<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果果帮 · 识别分析中</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    background: #ede8e1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== 手机外壳 ===== */
  .phone {
    width: 390px; height: 780px;
    background: #ede8e1;
    border-radius: 50px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 0 0 12px #1a1a1a, 0 0 0 14px #2a2a2a;
    overflow: hidden; position: relative;
  }
  .notch {
    width: 120px; height: 32px; background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    z-index: 50;
  }

  /* ===== 右上角计时器 ===== */
  .timer-badge {
    position: absolute; top: 16px; right: 16px; z-index: 100;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.06);
    border-radius: 20px;
    padding: 5px 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .timer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #dd6b20;
    animation: timer-blink 1s ease-in-out infinite;
  }
  @keyframes timer-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .timer-text {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 600;
    color: #3a2a20;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 返回按钮 ===== */
  .nav-back {
    position: absolute; top: 16px; left: 16px; z-index: 100;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    color: #3a2a20; font-size: 14px; text-decoration: none;
  }

  /* ===== 扫描动画 ===== */
  .scan-ring {
    position: absolute; border-radius: 50%; border: 1.5px solid #7a4a36;
    animation: ring-expand 2.4s ease-out infinite;
  }
  @keyframes ring-expand {
    0% { width: 100px; height: 100px; opacity: 0.8; }
    100% { width: 320px; height: 320px; opacity: 0; }
  }
  @keyframes scan-y {
    0%, 100% { top: 15%; }
    50% { top: 85%; }
  }

  /* ===== 进度条 ===== */
  .progress-track {
    background: linear-gradient(90deg, #7a4a36 var(--p, 0%), #f1ece4 var(--p, 0%));
    width: 0%;
    transition: width 1.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .progress-track.animated::after {
    content: '';
    display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2s ease-in-out infinite;
  }
</style>
</head>
<body>
  <div class="phone">
    <!-- ===== 手机刘海 ===== -->
    <div class="notch"></div>

    <!-- ===== 右上角计时器 ===== -->
    <div class="timer-badge">
      <div class="timer-dot"></div>
      <span class="timer-text" id="timerDisplay">0.0s</span>
    </div>

    <!-- ===== 返回按钮 ===== -->
    <a class="nav-back" href="scan.html">←</a>

    <!-- ===== 主内容区 ===== -->
    <div class="px-7 pt-16 pb-10 h-full flex flex-col">
      <!-- 扫描动画区 -->
      <div class="mt-6 flex flex-col items-center">
        <div class="relative w-72 h-72 flex items-center justify-center">
          <div class="scan-ring" style="animation-delay: 0s;"></div>
          <div class="scan-ring" style="animation-delay: 0.8s;"></div>
          <div class="scan-ring" style="animation-delay: 1.6s;"></div>

          <div class="relative w-52 h-52 rounded-3xl overflow-hidden bg-white shadow-md">
            <img id="loadingImg" src="../picture/peach.png" class="w-full h-full object-cover" alt="扫描图片"/>
            <div class="absolute left-0 right-0 h-1 bg-[#7a4a36]/70" style="top: 50%; box-shadow: 0 0 20px #7a4a36; animation: scan-y 1.8s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>

      <!-- 标题 -->
      <div class="mt-5 text-center">
        <h2 class="text-[18px] text-[#2a1e16] font-medium">正在分析这些水果</h2>
        <p class="text-[11px] text-[#b8a797] tracking-wide mt-1">
          <span id="engineLabel" class="text-[#7a4a36] font-medium">豆包大模型</span> 识别中...
        </p>
      </div>

      <!-- 分维度进度条 -->
      <div class="mt-8 space-y-4">
        <div data-bar="0">
          <div class="flex justify-between text-[10px] text-[#6b574a] tracking-wider mb-2">
            <span>光泽度</span><span class="text-[#7a4a36] font-medium bar-val">0%</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden bg-[#f1ece4]">
            <div class="h-full progress-track rounded-full"></div>
          </div>
        </div>
        <div data-bar="1">
          <div class="flex justify-between text-[10px] text-[#6b574a] tracking-wider mb-2">
            <span>色泽</span><span class="text-[#7a4a36] font-medium bar-val">0%</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden bg-[#f1ece4]">
            <div class="h-full progress-track rounded-full"></div>
          </div>
        </div>
        <div data-bar="2">
          <div class="flex justify-between text-[10px] text-[#6b574a] tracking-wider mb-2">
            <span>形状</span><span class="text-[#7a4a36] font-medium bar-val">0%</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden bg-[#f1ece4]">
            <div class="h-full progress-track rounded-full"></div>
          </div>
        </div>
        <div data-bar="3">
          <div class="flex justify-between text-[10px] text-[#6b574a] tracking-wider mb-2">
            <span>熟度</span><span class="text-[#7a4a36] font-medium bar-val">0%</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden bg-[#f1ece4]">
            <div class="h-full progress-track rounded-full"></div>
          </div>
        </div>
        <div data-bar="4">
          <div class="flex justify-between text-[10px] text-[#6b574a] tracking-wider mb-2">
            <span>新鲜度</span><span class="text-[#7a4a36] font-medium bar-val">0%</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden bg-[#f1ece4]">
            <div class="h-full progress-track rounded-full"></div>
          </div>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- 底部提示 -->
      <p class="text-[10px] text-center text-[#b8a797] tracking-wider">请稍候...</p>
    </div>
  </div>

  <script>
    var startTime = performance.now();
    var timerEl = document.getElementById('timerDisplay');
    var bars = document.querySelectorAll('[data-bar]');
    var API_BASE = 'http://localhost:9528';
    var apiCompleted = false;
    var fakeAnimationInterval = null;

    // ===== 1. 回显图片 & 引擎名 =====
    (function() {
      var img = localStorage.getItem('scanImagePath');
      if (img) document.getElementById('loadingImg').src = img;

      var model = localStorage.getItem('scanModel') || '';
      var labelEl = document.getElementById('engineLabel');
      if (model && labelEl) {
        var shortName = model.replace('doubao-seed-2-0-', '').replace('-260215', '').replace('-260428', '');
        labelEl.textContent = shortName;
      }
    })();

    // ===== 2. 实时计时器 =====
    function updateTimer() {
      var elapsed = (performance.now() - startTime) / 1000;
      if (elapsed < 60) {
        timerEl.textContent = elapsed.toFixed(1) + 's';
      } else {
        var min = Math.floor(elapsed / 60);
        var sec = Math.floor(elapsed % 60);
        timerEl.textContent = min + ':' + (sec < 10 ? '0' : '') + sec;
      }
      requestAnimationFrame(updateTimer);
    }
    requestAnimationFrame(updateTimer);

    // ===== 3. 压缩图片 =====
    function compressImage(imageBase64, maxWidth, quality) {
      maxWidth = maxWidth || 800;
      quality = quality || 0.8;
      return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
          var w = img.width;
          var h = img.height;
          if (w <= maxWidth) {
            resolve({ dataUrl: imageBase64, width: w, height: h });
            return;
          }
          var ratio = maxWidth / w;
          var canvas = document.createElement('canvas');
          canvas.width = maxWidth;
          canvas.height = Math.round(h * ratio);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), width: canvas.width, height: canvas.height });
        };
        img.onerror = function() {
          resolve({ dataUrl: imageBase64, width: 0, height: 0 });
        };
        img.src = imageBase64;
      });
    }

    // ===== 4. 模拟进度动画（等待API时显示）=====
    function startFakeProgressAnimation() {
      var fakeTargets = [40, 35, 45, 38, 42];
      bars.forEach(function(bar, i) {
        var track = bar.querySelector('.progress-track');
        var valEl = bar.querySelector('.bar-val');
        track.classList.add('animated');
        
        var current = 0;
        var target = fakeTargets[i];
        var duration = 800 + i * 200;
        var startTs = null;
        
        function animate(ts) {
          if (!startTs) startTs = ts;
          var progress = Math.min((ts - startTs) / duration, 1);
          current = Math.round(target * progress);
          track.style.width = current + '%';
          track.style.setProperty('--p', current + '%');
          valEl.textContent = current + '%';
          
          if (progress < 1 && !apiCompleted) {
            requestAnimationFrame(animate);
          }
        }
        requestAnimationFrame(animate);
      });
    }

    // ===== 5. 调用识别 API =====
    function callAPI(imageBase64, modelName) {
      compressImage(imageBase64, 800, 0.8).then(function(compressed) {
        // 2026-06-18 调试：把压缩前后的尺寸都写进 localStorage，
        // 让结果页能对比"原图 vs 压缩图 vs 豆包 position"
        var orig = new Image();
        orig.onload = function() {
          localStorage.setItem('scanOriginalSize', orig.width + 'x' + orig.height);
          localStorage.setItem('scanCompressedSize', compressed.width + 'x' + compressed.height);
        };
        orig.src = imageBase64;
        // 兜底：如果 orig.onload 没跑（cached），先写一个压缩图尺寸
        try { localStorage.setItem('scanCompressedSize', compressed.width + 'x' + compressed.height); } catch(e) {}

        var promptText = '请识别图片中的水果，并评估其品质。要求返回JSON格式，包含水果名称、评分(光泽度、新鲜度、色泽、形状、成熟度、综合)、评分理由。';
        var requestBody = JSON.stringify({ text: promptText, images: [compressed.dataUrl], model: modelName });

        fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: requestBody
        })
        .then(function(res) {
          return res.text();
        })
        .then(function(text) {
          apiCompleted = true;
          
          var data = JSON.parse(text);
          var content = data.content;
          
          if (!content) {
            showError('API 返回内容为空\n\n服务器响应: ' + text);
            return;
          }
          
          var resultData;
          try {
            resultData = JSON.parse(content);
          } catch(e) {
            var jsonMatch = content.match(/```json\s*([\s\S]*?)\s*```/) || content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try { resultData = JSON.parse(jsonMatch[1] || jsonMatch[0]); } catch(e2) {
                resultData = { rawText: content };
              }
            } else {
              resultData = { rawText: content };
            }
          }

          var fruits = resultData.fruits || [];
          var firstFruit = fruits[0] || {};

          var scanResult = {
            success: true,
            engine: 'doubao',
            model: modelName,
            fruits: fruits,
            scores: firstFruit.scores || {},
            fruitName: firstFruit.category || resultData.fruitName || '',
            enName: firstFruit.enName || resultData.enName || '',
            reason: firstFruit.reason || resultData.reason || '',
            final_score: firstFruit.final_score || resultData.final_score || 0,
            elapsed_sec: data.elapsed_sec || 0,
            content: content
          };

          localStorage.setItem('scanResult', JSON.stringify(scanResult));
          localStorage.setItem('scanImagePath', compressed.dataUrl);

          var totalSec = ((performance.now() - startTime) / 1000).toFixed(1);
          localStorage.setItem('scanLoadTime', totalSec);

          startRealProgressAnimation(scanResult.scores);
        })
        .catch(function(err) {
          apiCompleted = true;
          console.error('API调用失败:', err);
          showError('识别失败:\n' + (err.message || err.toString()));
        });
      });
    }

    // ===== 6. 真实进度条动画（API返回后）=====
    function startRealProgressAnimation(scores) {
      var defaultScores = { gloss: 72, color: 68, shape: 89, ripeness: 75, freshness: 82 };
      scores = scores || defaultScores;
      var barTargets = [scores.gloss, scores.color, scores.shape, scores.ripeness, scores.freshness];

      bars.forEach(function(bar, i) {
        var track = bar.querySelector('.progress-track');
        var valEl = bar.querySelector('.bar-val');
        var currentWidth = parseFloat(track.style.width) || 0;
        var target = barTargets[i] || 0;

        var startTs = null;
        var duration = 1000;
        
        function animate(ts) {
          if (!startTs) startTs = ts;
          var progress = Math.min((ts - startTs) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = Math.round(currentWidth + (target - currentWidth) * eased);
          
          track.style.width = current + '%';
          track.style.setProperty('--p', current + '%');
          valEl.textContent = current + '%';
          
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        }
        requestAnimationFrame(animate);
      });

      setTimeout(function() {
        window.location.href = 'scan-result.html';
      }, 1500);
    }

    // ===== 7. 显示错误 =====
    function showError(msg) {
      localStorage.removeItem('scanResult');
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:20px;padding:28px 24px;max-width:320px;text-align:center;">' +
        '<div style="font-size:32px;margin-bottom:12px;">❌</div>' +
        '<div style="font-size:14px;font-weight:600;color:#2a1e16;margin-bottom:8px;">识别失败</div>' +
        '<div style="font-size:11px;color:#6b574a;line-height:1.6;white-space:pre-wrap;text-align:left;background:#faf8f5;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-family:monospace;">' + msg + '</div>' +
        '<button style="width:100%;height:40px;border-radius:20px;background:#7a4a36;color:#fff;font-size:13px;border:none;cursor:pointer;letter-spacing:0.1em;" onclick="window.location.href=\'scan.html\';">返回重试</button>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    // ===== 8. 页面加载后开始模拟动画和调用API =====
    (function() {
      var imageBase64 = localStorage.getItem('scanImagePath');
      var modelName = localStorage.getItem('scanModel') || 'doubao-seed-2-0-pro-260215';

      if (!imageBase64) {
        showError('未找到图片，请重新选择');
        return;
      }

      startFakeProgressAnimation();
      callAPI(imageBase64, modelName);
    })();
  </script>
</body>
</html>
