    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

<body>
    <div id="app"></div>
    <script>
        const ICONS = {
            bulb: '💡',
            mouse: '🖱️',
            game: '🎮',
            lab: '🔬',
            info: 'ℹ️',
            left: '←',
            save: '💾',
            trash: '🗑️',
            ruler: '📏',
            moon: '🌙',
            gear: '⚙️',
            book: '📖',
            help: '❓',
            star: '⭐',
            redo: '🔄',
            paint: '🎨',
            puzzle: '🧩',
            qr: '📱',
            record: '⏺️',
            stop: '⏹️',
            compare: '⚖️',
            lock: '🔒',
            square: '⬜',
            tv: '📺',
            circle: '⭕',
            ban: '🚫',
            palette: '🎨'
        };

        class LightEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.elements = [];
                this.rays = [];
                this.showNormal = false;
                this.darkMode = false;
            }
            addElement(e) { this.elements.push(e); }
            removeElement(e) { const i = this.elements.indexOf(e); if (i > -1) this.elements.splice(i, 1); }
            clearElements() { this.elements = []; }
            updateRays() {
                this.rays = [];
                const lasers = this.elements.filter(e => e.type === 'laser');
                for (const laser of lasers) {
                    const angle = laser.rotation * Math.PI / 180;
                    const dir = { x: Math.cos(angle), y: Math.sin(angle) };
                    const ray = { x: laser.x, y: laser.y, dir, color: laser.color || '#fbbf24', segments: [] };
                    let cx = laser.x, cy = laser.y, cd = { ...dir }, refl = 0;
                    while (refl < 20) {
                        const ex = cx + cd.x * 2000, ey = cy + cd.y * 2000;
                        let closest = null, dist = Infinity, hit = null;
                        for (const el of this.elements) {
                            if (el.type === 'laser') continue;
                            if (el.type === 'mirror' || el.type === 'concave' || el.type === 'convex') {
                                const line = this.getMirrorLine(el);
                                const inter = this.lineIntersection(cx, cy, ex, ey, line.x1, line.y1, line.x2, line.y2);
                                if (inter) {
                                    const d = Math.sqrt(Math.pow(inter.x - cx, 2) + Math.pow(inter.y - cy, 2));
                                    if (d > 1 && d < dist) { dist = d; closest = inter; hit = el; }
                                }
                            } else if (el.type === 'target') {
                                const dx = cx - el.x, dy = cy - el.y;
                                const dot = dx * cd.x + dy * cd.y;
                                const t = -dot / (cd.x * cd.x + cd.y * cd.y);
                                if (t > 0) {
                                    const px = cx + cd.x * t, py = cy + cd.y * t;
                                    const d = Math.sqrt(Math.pow(px - el.x, 2) + Math.pow(py - el.y, 2));
                                    if (d < el.radius + 5) { dist = t; closest = { x: px, y: py }; hit = el; }
                                }
                            } else if (el.type === 'obstacle') {
                                const w = el.width || 60, h = el.height || 40;
                                const angle = el.rotation * Math.PI / 180;
                                const corners = [
                                    { x: el.x - w/2 * Math.cos(angle) + h/2 * Math.sin(angle), y: el.y - w/2 * Math.sin(angle) - h/2 * Math.cos(angle) },
                                    { x: el.x + w/2 * Math.cos(angle) + h/2 * Math.sin(angle), y: el.y + w/2 * Math.sin(angle) - h/2 * Math.cos(angle) },
                                    { x: el.x + w/2 * Math.cos(angle) - h/2 * Math.sin(angle), y: el.y + w/2 * Math.sin(angle) + h/2 * Math.cos(angle) },
                                    { x: el.x - w/2 * Math.cos(angle) - h/2 * Math.sin(angle), y: el.y - w/2 * Math.sin(angle) + h/2 * Math.cos(angle) }
                                ];
                                for (let i = 0; i < 4; i++) {
                                    const j = (i + 1) % 4;
                                    const inter = this.lineIntersection(cx, cy, ex, ey, corners[i].x, corners[i].y, corners[j].x, corners[j].y);
                                    if (inter) {
                                        const d = Math.sqrt(Math.pow(inter.x - cx, 2) + Math.pow(inter.y - cy, 2));
                                        if (d > 1 && d < dist) { dist = d; closest = inter; hit = el; }
                                    }
                                }
                            } else if (el.type === 'screen') {
                                const w = el.width || 100, h = el.height || 100;
                                const angle = el.rotation * Math.PI / 180;
                                const corners = [
                                    { x: el.x - w/2 * Math.cos(angle) + h/2 * Math.sin(angle), y: el.y - w/2 * Math.sin(angle) - h/2 * Math.cos(angle) },
                                    { x: el.x + w/2 * Math.cos(angle) + h/2 * Math.sin(angle), y: el.y + w/2 * Math.sin(angle) - h/2 * Math.cos(angle) },
                                    { x: el.x + w/2 * Math.cos(angle) - h/2 * Math.sin(angle), y: el.y + w/2 * Math.sin(angle) + h/2 * Math.cos(angle) },
                                    { x: el.x - w/2 * Math.cos(angle) - h/2 * Math.sin(angle), y: el.y - w/2 * Math.sin(angle) + h/2 * Math.cos(angle) }
                                ];
                                for (let i = 0; i < 4; i++) {
                                    const j = (i + 1) % 4;
                                    const inter = this.lineIntersection(cx, cy, ex, ey, corners[i].x, corners[i].y, corners[j].x, corners[j].y);
                                    if (inter) {
                                        const d = Math.sqrt(Math.pow(inter.x - cx, 2) + Math.pow(inter.y - cy, 2));
                                        if (d > 1 && d < dist) { dist = d; closest = inter; hit = el; }
                                    }
                                }
                            }
                        }
                        if (closest) {
                            const segment = { x1: cx, y1: cy, x2: closest.x, y2: closest.y };
                            if (hit.type === 'mirror' || hit.type === 'concave' || hit.type === 'convex') {
                                const norm = this.getNormal(hit);
                                segment.normalPoint = { x: closest.x, y: closest.y };
                                segment.normal = norm;
                                cd = this.reflect(cd, norm);
                                cx = closest.x; cy = closest.y; refl++;
                            }
                            if (hit.type === 'target') { hit.hit = true; }
                            ray.segments.push(segment);
                            if (!(hit.type === 'mirror' || hit.type === 'concave' || hit.type === 'convex')) break;
                        } else {
                            ray.segments.push({ x1: cx, y1: cy, x2: ex, y2: ey });
                            break;
                        }
                    }
                    this.rays.push(ray);
                }
            }
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (const e of this.elements) this.drawElement(e);
                if (this.showNormal) this.drawNormals();
                this.drawRays();
            }
            drawElement(e) {
                this.ctx.save();
                this.ctx.translate(e.x, e.y);
                this.ctx.rotate(e.rotation * Math.PI / 180);
                if (e.type === 'laser') {
                    const s = 30;
                    this.ctx.beginPath();
                    this.ctx.moveTo(s, 0); this.ctx.lineTo(-s*0.6, -s*0.4);
                    this.ctx.lineTo(-s*0.4, 0); this.ctx.lineTo(-s*0.6, s*0.4); this.ctx.closePath();
                    const g = this.ctx.createLinearGradient(-s, 0, s, 0);
                    g.addColorStop(0, '#374151'); g.addColorStop(1, '#6b7280');
                    this.ctx.fillStyle = g; this.ctx.fill();
                    this.ctx.beginPath(); this.ctx.arc(s*0.5, 0, 5, 0, Math.PI*2);
                    this.ctx.fillStyle = e.color || '#fbbf24'; this.ctx.fill();
                } else if (e.type === 'mirror') {
                    const w = e.width || 80, h = e.height || 12;
                    this.ctx.fillStyle = '#e2e8f0';
                    this.ctx.fillRect(-w/2, -h/2, w, h);
                    this.ctx.strokeStyle = '#94a3b8'; this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(-w/2, -h/2, w, h);
                } else if (e.type === 'target') {
                    const r = e.radius || 25;
                    this.ctx.beginPath(); this.ctx.arc(0, 0, r, 0, Math.PI*2);
                    this.ctx.fillStyle = e.hit ? '#22c55e' : '#ef4444';
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fff'; this.ctx.font = 'bold 16px Arial';
                    this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('靶', 0, 0);
                } else if (e.type === 'obstacle') {
                    const w = e.width || 60, h = e.height || 40;
                    this.ctx.fillStyle = '#475569';
                    this.ctx.fillRect(-w/2, -h/2, w, h);
                    this.ctx.strokeStyle = '#94a3b8'; this.ctx.strokeRect(-w/2, -h/2, w, h);
                } else if (e.type === 'screen') {
                    const w = e.width || 100, h = e.height || 100;
                    this.ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    this.ctx.fillRect(-w/2, -h/2, w, h);
                    this.ctx.strokeStyle = '#00d4ff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(-w/2, -h/2, w, h);
                    this.ctx.fillStyle = '#00d4ff';
                    this.ctx.font = 'bold 14px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('光屏', 0, 0);
                } else if (e.type === 'protractor') {
                    const r = 70;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, Math.PI, 0);
                    this.ctx.strokeStyle = '#00d4ff';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(-r, 0);
                    this.ctx.lineTo(r, 0);
                    this.ctx.strokeStyle = '#00d4ff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(0, -r);
                    this.ctx.strokeStyle = '#ef4444';
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                    for (let i = 0; i <= 180; i += 5) {
                        const a = (i - 90) * Math.PI / 180;
                        const tickLen = i % 10 === 0 ? (i % 30 === 0 ? 15 : 10) : 5;
                        const ir = r - tickLen;
                        this.ctx.beginPath();
                        this.ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                        this.ctx.lineTo(Math.cos(a) * ir, Math.sin(a) * ir);
                        this.ctx.strokeStyle = i % 30 === 0 ? '#00d4ff' : '#67e8f9';
                        this.ctx.lineWidth = i % 30 === 0 ? 2 : 1;
                        this.ctx.stroke();
                        if (i % 30 === 0) {
                            const textR = r + 20;
                            this.ctx.fillStyle = '#00d4ff';
                            this.ctx.font = 'bold 12px Arial';
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            const tx = Math.cos(a) * textR;
                            const ty = Math.sin(a) * textR;
                            this.ctx.fillText(i.toString(), tx, ty);
                        }
                    }
                    this.ctx.fillStyle = '#00d4ff';
                    this.ctx.font = 'bold 14px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('0°', 0, r + 35);
                }
                this.ctx.restore();
            }
            drawRays() {
                for (const ray of this.rays) {
                    for (const seg of ray.segments) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(seg.x1, seg.y1);
                        this.ctx.lineTo(seg.x2, seg.y2);
                        this.ctx.strokeStyle = ray.color;
                        this.ctx.lineWidth = 4;
                        this.ctx.shadowColor = ray.color;
                        this.ctx.shadowBlur = 15;
                        this.ctx.stroke();
                        this.ctx.shadowBlur = 0;
                    }
                }
            }
            drawNormals() {
                for (const ray of this.rays) {
                    for (const seg of ray.segments) {
                        if (seg.normalPoint) {
                            const norm = seg.normal;
                            this.ctx.beginPath();
                            this.ctx.moveTo(seg.normalPoint.x, seg.normalPoint.y);
                            this.ctx.lineTo(seg.normalPoint.x + norm.x * 40, seg.normalPoint.y + norm.y * 40);
                            this.ctx.strokeStyle = '#ef4444';
                            this.ctx.setLineDash([5, 5]);
                            this.ctx.stroke();
                            this.ctx.setLineDash([]);
                        }
                    }
                }
            }
            getMirrorLine(m) {
                const a = m.rotation * Math.PI / 180;
                const hw = (m.width || 80) / 2;
                return { x1: m.x - hw * Math.cos(a), y1: m.y - hw * Math.sin(a), x2: m.x + hw * Math.cos(a), y2: m.y + hw * Math.sin(a) };
            }
            getNormal(m) {
                const a = m.rotation * Math.PI / 180;
                return { x: Math.sin(a), y: -Math.cos(a) };
            }
            lineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
                const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
                if (Math.abs(denom) < 1e-10) return null;
                const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
                const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
                if (ua >= 0 && ua <= 1 && ub >= -0.1 && ub <= 1.1) {
                    return { x: x1 + ua * (x2 - x1), y: y1 + ua * (y2 - y1) };
                }
                return null;
            }
            reflect(v, n) {
                const dot = v.x * n.x + v.y * n.y;
                return { x: v.x - 2 * dot * n.x, y: v.y - 2 * dot * n.y };
            }
        }

        class SceneManager {
            constructor(engine) { this.engine = engine; this.elements = []; }
            addElement(e) { this.elements.push(e); this.engine.addElement(e); }
            removeElement(e) { const i = this.elements.indexOf(e); if (i > -1) { this.elements.splice(i, 1); this.engine.removeElement(e); } }
            clearElements() { this.elements = []; this.engine.clearElements(); }
            createLaser(x, y, rot, color) { return { type: 'laser', x, y, rotation: rot || 0, color: color || '#fbbf24', width: 30, height: 20 }; }
            createMirror(x, y, rot) { return { type: 'mirror', x, y, rotation: rot || 0, width: 80, height: 12 }; }
            createTarget(x, y) { return { type: 'target', x, y, rotation: 0, radius: 25, hit: false }; }
            createObstacle(x, y) { return { type: 'obstacle', x, y, rotation: 0, width: 60, height: 40 }; }
            createScreen(x, y) { return { type: 'screen', x, y, rotation: 0, width: 100, height: 8 }; }
            createProtractor(x, y) { return { type: 'protractor', x, y, rotation: 0 }; }
            hasTargetHit() { 
                const targets = this.elements.filter(e => e.type === 'target');
                return targets.length > 0 && targets.every(t => t.hit); 
            }
            resetTargets() {
                this.elements.forEach(e => {
                    if (e.type === 'target') e.hit = false;
                });
            }
        }

        class LevelManager {
            constructor() { this.progress = this.loadProgress(); }
            loadProgress() {
                const saved = localStorage.getItem('lightlab_level_progress');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return this.migrateProgress(parsed);
                }
                const initial = {};
                LEVELS.forEach(level => {
                    initial[level.id] = { levelId: String(level.id), stars: 0, completed: false, unlocked: level.id === 1 };
                });
                return initial;
            }
            migrateProgress(oldProgress) {
                const newProgress = {};
                LEVELS.forEach(level => {
                    const oldData = oldProgress[level.id];
                    newProgress[level.id] = {
                        levelId: String(level.id),
                        stars: oldData?.stars || 0,
                        completed: oldData?.completed || (oldData?.stars || 0) > 0,
                        unlocked: oldData?.unlocked || level.id === 1
                    };
                });
                return newProgress;
            }
            saveProgress() { localStorage.setItem('lightlab_level_progress', JSON.stringify(this.progress)); }
            isUnlocked(id) {
                if (id === 1) return true;
                const prevProgress = this.progress[id - 1];
                return prevProgress?.completed || false;
            }
            getStars(id) { return this.progress[id]?.stars || 0; }
            setStars(id, stars) {
                if (!this.progress[id]) {
                    this.progress[id] = { levelId: String(id), stars: 0, completed: false, unlocked: false };
                }
                this.progress[id].stars = stars;
                this.progress[id].completed = true;
                this.saveProgress();
                const nextId = id + 1;
                if (this.progress[nextId]) {
                    this.progress[nextId].unlocked = true;
                    this.saveProgress();
                }
            }
        }

        class Modal {
            constructor(options) {
                this.title = options.title || '';
                this.content = options.content || '';
                this.buttons = options.buttons || [];
            }
            render() {
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50';
                const content = document.createElement('div');
                content.className = 'glass rounded-3xl p-8 max-w-md w-full mx-4';
                content.innerHTML = `<h2 class="text-2xl font-bold text-cyan-300 mb-6">${this.title}</h2><div class="text-white mb-6">${this.content}</div><div class="flex gap-4 justify-end"></div>`;
                const footer = content.querySelector('div:last-child');
                this.buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.className = btn.primary ? 'bg-cyan-500 hover:bg-cyan-400 text-white px-6 py-2 rounded-lg' : 'bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg';
                    b.textContent = btn.text;
                    b.addEventListener('click', () => { if (btn.onClick) btn.onClick(); overlay.remove(); });
                    footer.appendChild(b);
                });
                overlay.appendChild(content);
                document.body.appendChild(overlay);
                return this;
            }
            static alert(msg, title = '提示') {

                            </aside>
                            <main class="flex-1 relative">
                                <canvas id="mainCanvas" class="w-full h-full cursor-crosshair"></canvas>
                            </main>
                        </div>
                    </div>
                `;

                this.initCanvas();
                for (const element of level.elements) {
                    const el = { ...element };
                    if (el.type === 'target') el.hit = false;
                    this.sceneManager.addElement(el);
                }
                this.setupCanvasEvents();

                document.getElementById('backBtn').addEventListener('click', () => this.renderChallengeLevelMap());
                const savedStars = this.levelManager.getStars(levelId);
                this.updateLevelStars(savedStars);

                this.startGameLoop();
            }

            calculateStars(steps, baseSteps) {
                if (steps <= baseSteps * 0.6) return 3;
                if (steps <= baseSteps * 0.85) return 2;
                if (steps <= baseSteps) return 1;
                return 0;
            }
            checkLevelComplete(level) {
                if (this.sceneManager.hasTargetHit()) {
                    const baseSteps = level.baseSteps || 5;
                    const stars = this.calculateStars(this.actionCount, baseSteps);
                    this.levelManager.setStars(level.id, stars);
                    this.updateLevelStars(stars);
                    setTimeout(() => {
                        const nextLevel = LEVELS.find(l => l.id === level.id + 1);
                        if (nextLevel) this.startLevel(nextLevel.id);
                        else this.renderChallengeLevelMap();
                    }, 500);
                    return true;
                }
                return false;
            }

            updateLevelStars(stars) {
                const levelStarsEl = document.getElementById('levelStars');
                if (levelStarsEl) {
                    levelStarsEl.innerHTML = [1, 2, 3].map(i => 
                        `<span class="${i <= stars ? 'star-bright animate-star-pop' : 'star-dim'}" style="animation-delay: ${(i - 1) * 0.1}s">${ICONS.star}</span>`
                    ).join('');
                }
            }

            renderSandboxPage() {
                this.clearModals();
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col">
                        <header class="flex items-center justify-between px-6 py-4 glass">
                            <div class="flex items-center gap-4">
                                <button id="backBtn" class="w-10 h-10 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center">${ICONS.left}</button>
                                <h1 class="text-xl font-bold text-white">流光造境 · 沙盒模式</h1>
                            </div>
                            <div class="flex items-center gap-3">
                            </div>
                        </header>
                        <div class="flex-1 flex">
                            <aside class="w-64 glass p-4 flex flex-col gap-4">
                                <div>
                                    <h3 class="text-sm font-bold text-gray-300 mb-3">器材库</h3>
                                    <div class="grid grid-cols-3 gap-2">
                                        <button class="equip-btn p-2 rounded-lg bg-yellow-500/20 text-yellow-400" data-type="laser">${ICONS.bulb}</button>
                                        <button class="equip-btn p-2 rounded-lg bg-blue-500/20 text-blue-400" data-type="mirror">${ICONS.square}</button>
                                        <button class="equip-btn p-2 rounded-lg bg-white/20 text-white" data-type="screen">${ICONS.tv}</button>
                                        <button class="equip-btn p-2 rounded-lg bg-cyan-500/20 text-cyan-400" data-type="protractor">${ICONS.circle}</button>
                                        <button class="equip-btn p-2 rounded-lg bg-gray-500/20 text-gray-400" data-type="obstacle">${ICONS.ban}</button>
                                        <button class="equip-btn p-2 rounded-lg bg-red-500/20 text-red-400" data-type="target">${ICONS.circle}</button>
                                    </div>
                                </div>
                                <div class="mt-auto">
                                    <button id="clearBtn" class="w-full p-3 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300">${ICONS.trash} 清空场景</button>
                                </div>
                            </aside>
                            <main class="flex-1 relative">
                                <canvas id="mainCanvas" class="w-full h-full cursor-crosshair"></canvas>
                            </main>
                        </div>
                    </div>
                `;

                this.initCanvas();
                this.setupCanvasEvents();

                document.getElementById('backBtn').addEventListener('click', () => this.renderHomePage());
                document.getElementById('clearBtn').addEventListener('click', () => this.sceneManager.clearElements());

                this.startGameLoop();
            }

            initCanvas() {
                const canvas = document.getElementById('mainCanvas');
                const resizeCanvas = () => {
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                };
                resizeCanvas();
                this.canvas = canvas;
                this.lightEngine = new LightEngine(canvas);
                this.sceneManager = new SceneManager(this.lightEngine);
                window.addEventListener('resize', resizeCanvas);
            }

            setupCanvasEvents() {
                const canvas = this.canvas;
                canvas.addEventListener('mousedown', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    if (e.button === 0) {
                        const clicked = this.getElementAt(x, y);
                        if (clicked) {
                            this.selectedElement = clicked;
                            this.isDragging = true;
                            this.dragOffset = { x: x - clicked.x, y: y - clicked.y };
                            this.dragStartPos = { x: clicked.x, y: clicked.y, rotation: clicked.rotation };
                        }
                    } else if (e.button === 2) {
                        const clicked = this.getElementAt(x, y);
                        if (clicked) {
                            this.sceneManager.removeElement(clicked);
                            if (this.selectedElement === clicked) {
                                this.selectedElement = null;
                            }
                        }
                    }
                });
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    if (this.isDragging && this.selectedElement) {
                        this.selectedElement.x = x - this.dragOffset.x;
                        this.selectedElement.y = y - this.dragOffset.y;
                    } else if (this.isRotating && this.selectedElement) {
                        this.selectedElement.rotation += 2;
                    }
                });
                canvas.addEventListener('mouseup', () => {
                    if (this.selectedElement) {
                        const dx = Math.abs(this.selectedElement.x - this.dragStartPos.x);
                        const dy = Math.abs(this.selectedElement.y - this.dragStartPos.y);
                        const dr = Math.abs(this.selectedElement.rotation - this.dragStartPos.rotation);
                        if (dx > 2 || dy > 2 || dr > 1) {
                            this.actionCount++;
                            this.updateActionCount();
                        }
                    }
                    this.isDragging = false;
                    this.isRotating = false;
                });
                canvas.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Delete' && this.selectedElement) {
                        this.sceneManager.removeElement(this.selectedElement);
                        this.selectedElement = null;
                    }
                });
                document.querySelectorAll('.equip-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.addElement(btn.dataset.type));
                });
            }

            getElementAt(x, y) {
                for (let i = this.sceneManager.elements.length - 1; i >= 0; i--) {
                    const e = this.sceneManager.elements[i];
                    if (this.currentPage === 'challenge' && (e.type === 'laser' || e.type === 'target' || e.type === 'obstacle')) continue;
                    const dx = x - e.x, dy = y - e.y;
                    if (e.type === 'target') {
                        if (Math.sqrt(dx * dx + dy * dy) < e.radius + 10) return e;
                    } else if (e.type === 'laser') {
                        if (Math.sqrt(dx * dx + dy * dy) < 25) return e;
                    } else {
                        const w = e.width || 80, h = e.height || 40;
                        if (Math.abs(dx) < w / 2 + 10 && Math.abs(dy) < h / 2 + 10) return e;
                    }
                }
                return null;
            }

            addElement(type) {
                const x = this.canvas.width / 2, y = this.canvas.height / 2;
                let element;
                switch (type) {
                    case 'laser': element = this.sceneManager.createLaser(x, y, 0); break;
                    case 'mirror': element = this.sceneManager.createMirror(x, y, 0); break;
                    case 'screen': element = this.sceneManager.createScreen(x, y); break;
                    case 'protractor': element = this.sceneManager.createProtractor(x, y); break;
                    case 'obstacle': element = this.sceneManager.createObstacle(x, y); break;
                    case 'target': element = this.sceneManager.createTarget(x, y); break;
                }
                if (element) {
                    this.sceneManager.addElement(element);
                    this.actionCount++;
                    this.updateActionCount();
                }
            }

            updateActionCount() {
                const el = document.getElementById('actionCount');
                if (el) el.textContent = this.actionCount;
            }

            adjustMirrorNormal(angle) {
                if (this.selectedElement && this.selectedElement.type === 'mirror') {
                    this.selectedElement.rotation = (angle - 90);
                }
            }

            startGameLoop() {
                if (this.gameLoop) cancelAnimationFrame(this.gameLoop);
                const loop = () => {
                    this.lightEngine.updateRays();
                    this.lightEngine.draw();
                    if (this.currentPage === 'challenge' && this.currentLevel) {
                        this.checkLevelComplete(this.currentLevel);
                    }
                    this.gameLoop = requestAnimationFrame(loop);
                };
                loop();
            }

            renderHelpModal() {
                new Modal({
                    title: '帮助指引',
                    content: `
                        <div class="space-y-4">
                            <div class="glass p-3 rounded-lg">
                                <h4 class="font-bold text-cyan-400 mb-2">${ICONS.mouse} 基本操作</h4>
                                <ul class="text-sm text-gray-300"><li>• 点击器材可选中并拖拽移动</li><li>• 右键拖动可旋转选中的元件</li><li>• 按 Delete 键删除选中的元件</li></ul>
                            </div>
                            <div class="glass p-3 rounded-lg">
                                <h4 class="font-bold text-cyan-400 mb-2">${ICONS.lab} 实验模式</h4>
                                <ul class="text-sm text-gray-300"><li>• 自由实验台：从零开始搭建光路</li><li>• 经典实验库：一键加载预设实验</li></ul>
                            </div>
                            <div class="glass p-3 rounded-lg">
                                <h4 class="font-bold text-cyan-400 mb-2">${ICONS.game} 闯关模式</h4>
                                <ul class="text-sm text-gray-300"><li>• 使用镜子将光线反射到目标点</li><li>• 操作次数越少，星级评价越高</li></ul>
                            </div>
                        </div>
                    `,
                    buttons: [{ text: '知道了', primary: true }]
                }).render();
            }

            renderKnowledgeModal() {
                const knowledgeItems = [
                    { id: 1, title: '光的反射定律', content: '反射光线、入射光线和法线在同一平面内；反射光线和入射光线分别位于法线两侧；反射角等于入射角。', type: '知识点' },
                    { id: 2, title: '镜面反射', content: '平行光线照射到光滑表面时，反射光线仍然平行。如镜子、水面等。', type: '知识点' },
                    { id: 3, title: '漫反射', content: '平行光线照射到粗糙表面时，反射光线向各个方向散射。这是我们能看到不发光物体的原因。', type: '知识点' },
                    { id: 4, title: '潜望镜原理', content: '利用两面平行的平面镜，通过两次反射改变光路，使观察者能够看到高处或远处的物体。', type: '知识点' },
                    { id: 5, title: '光污染', content: '城市中过多的玻璃幕墙会产生强烈的镜面反射，影响居民生活和交通安全。', type: '知识点' },
                    { id: 6, title: '问：入射角是30°，反射角是多少？', content: '答：30°。根据反射定律，反射角等于入射角。', type: '题目' },
                    { id: 7, title: '问：为什么我们能看到书本上的字？', content: '答：因为书本表面发生漫反射，光线向各个方向散射，进入我们的眼睛。', type: '题目' },
                    { id: 8, title: '问：镜子为什么能照出人影？', content: '答：镜子表面光滑，发生镜面反射，光线按照反射定律准确反射，形成清晰的像。', type: '题目' },
                    { id: 9, title: '问：雨后的夜晚走路，为什么迎着月光走亮处是水洼？', content: '答：水面发生镜面反射，迎着月光时反射光线进入眼睛；地面发生漫反射，光线较弱。', type: '题目' },
                    { id: 10, title: '问：反射角和入射角是相对于什么测量的？', content: '答：都是相对于法线测量的。法线是垂直于反射面的直线。', type: '题目' }
                ];
                const usedIds = JSON.parse(localStorage.getItem('lightlab_knowledge_used') || '[]');
                const availableItems = knowledgeItems.filter(item => !usedIds.includes(item.id));
                const item = availableItems.length > 0 
                    ? availableItems[Math.floor(Math.random() * availableItems.length)]
                    : knowledgeItems[Math.floor(Math.random() * knowledgeItems.length)];
                
                if (availableItems.length > 0) {
                    usedIds.push(item.id);
                    if (usedIds.length >= knowledgeItems.length) {
                        localStorage.setItem('lightlab_knowledge_used', JSON.stringify([]));
                    } else {
                        localStorage.setItem('lightlab_knowledge_used', JSON.stringify(usedIds));
                    }
                }

                new Modal({
                    title: '科普知识',
                    content: `
                        <div class="space-y-4">
                            <div class="glass p-4 rounded-xl">
                                <div class="flex items-center gap-2 mb-3">
                                    <span class="text-xs px-2 py-1 rounded-full ${item.type === '知识点' ? 'bg-cyan-500/20 text-cyan-400' : 'bg-yellow-500/20 text-yellow-400'}">${item.type}</span>
                                    <h3 class="font-bold text-cyan-400">${item.title}</h3>
                                </div>
                                <p class="text-gray-300">${item.content}</p>
                            </div>
                        </div>
                    `,
                    width: '600px',
                    buttons: [{ text: '关闭', primary: true }]
                }).render();
            }

            runLevelAudit() {
                const auditResults = [];
                let passedCount = 0;
                let failedCount = 0;

                LEVELS.forEach(level => {
                    const issues = [];
                    
                    if (!level.baseSteps || level.baseSteps <= 0) {
                        issues.push('缺少基准步数配置');
                    }
                    
                    const hasLaser = level.elements.some(e => e.type === 'laser');
                    if (!hasLaser) {
                        issues.push('关卡缺少激光初始元素');
                    }
                    
                    const laserCount = level.elements.filter(e => e.type === 'laser').length;
                    if (laserCount > 1) {
                        issues.push('激光元素数量超过1个');
                    }
                    
                    const hasTarget = level.elements.some(e => e.type === 'target');
                    if (!hasTarget) {
                        issues.push('关卡缺少目标靶元素');
                    }
                    
                    if (!level.maxMirrors || level.maxMirrors <= 0) {
                        issues.push('缺少最大镜子数量限制');
                    }

                    auditResults.push({
                        levelId: level.id,
                        levelName: level.name,
                        passed: issues.length === 0,
                        issues: issues
                    });

                    if (issues.length === 0) passedCount++;
                    else failedCount++;
                });

                const resultHTML = auditResults.map(r => `
                    <div class="glass p-3 rounded-lg mb-2">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-xl font-bold ${r.passed ? 'text-green-400' : 'text-red-400'}">${r.levelId}</span>
                            <span class="font-bold text-white">${r.levelName}</span>
                            <span class="ml-auto text-sm px-3 py-1 rounded-full ${r.passed ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${r.passed ? '通过' : '未通过'}</span>
                        </div>
                        ${!r.passed ? `<div class="text-sm text-gray-400 space-y-1">${r.issues.map(i => `<div>• ${i}</div>`).join('')}</div>` : ''}
                    </div>
                `).join('');

                new Modal({
                    title: '关卡合规性自检报告',
                    content: `
                        <div class="mb-4 flex items-center gap-4">
                            <div class="glass p-3 rounded-lg flex-1 text-center">
                                <div class="text-2xl font-bold text-green-400">${passedCount}</div>
                                <div class="text-xs text-gray-400">通过</div>
                            </div>
                            <div class="glass p-3 rounded-lg flex-1 text-center">
                                <div class="text-2xl font-bold text-red-400">${failedCount}</div>
                                <div class="text-xs text-gray-400">未通过</div>
                            </div>
                            <div class="glass p-3 rounded-lg flex-1 text-center">
                                <div class="text-2xl font-bold text-cyan-400">${LEVELS.length}</div>
                                <div class="text-xs text-gray-400">总关卡数</div>
                            </div>
                        </div>
                        <div class="max-h-80 overflow-y-auto">${resultHTML}</div>
                    `,
                    width: '700px',
                    buttons: [{ text: '关闭', primary: true }]
                }).render();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
