<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指令幻境生成盒 | AI微型网页工坊</title>
<style>
/* ========== CSS变量 & 主题 ========== */
:root {
  --bg-primary: #0a0a1a;
  --bg-secondary: #12122a;
  --bg-card: rgba(20, 20, 50, 0.6);
  --bg-card-hover: rgba(30, 30, 70, 0.8);
  --border-color: rgba(139, 92, 246, 0.3);
  --border-glow: rgba(139, 92, 246, 0.6);
  --text-primary: #f0f0ff;
  --text-secondary: #a0a0c0;
  --text-muted: #6b6b8b;
  --accent-primary: #8b5cf6;
  --accent-secondary: #06b6d4;
  --accent-pink: #ec4899;
  --accent-green: #10b981;
  --accent-yellow: #f59e0b;
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.3);
  --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
  --font-mono: 'Courier New', Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

[data-theme="light"] {
  --bg-primary: #f8f9ff;
  --bg-secondary: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.8);
  --bg-card-hover: rgba(245, 243, 255, 0.9);
  --border-color: rgba(139, 92, 246, 0.2);
  --border-glow: rgba(139, 92, 246, 0.4);
  --text-primary: #1a1a2e;
  --text-secondary: #4a4a6a;
  --text-muted: #8b8ba8;
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.15);
  --shadow-card: 0 8px 32px rgba(139, 92, 246, 0.08);
}

/* ========== 基础样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  background: 
    radial-gradient(ellipse at top left, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
    var(--bg-primary);
}

/* ========== 霓虹装饰线 ========== */
.neon-line {
  position: absolute;
  background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-secondary), var(--accent-pink), transparent);
  height: 2px;
  opacity: 0.6;
  animation: neonFlow 3s ease-in-out infinite;
}

.neon-line-1 {
  top: 0;
  left: 0;
  right: 0;
  animation-delay: 0s;
}

.neon-line-2 {
  bottom: 0;
  left: 0;
  right: 0;
  animation-delay: 1.5s;
  transform: scaleX(-1);
}

@keyframes neonFlow {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

/* ========== 顶部区域 ========== */
.header {
  flex-shrink: 0;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  position: relative;
  z-index: 10;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: var(--shadow-glow);
  position: relative;
  overflow: hidden;
}

.logo-icon::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: rotate(45deg) translateX(-100%);
  animation: logoShine 3s ease-in-out infinite;
}

@keyframes logoShine {
  0%, 100% { transform: rotate(45deg) translateX(-100%); }
  50% { transform: rotate(45deg) translateX(100%); }
}

.logo-text h1 {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

.logo-text p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.header-tip {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-tip .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-green); }
  50% { opacity: 0.6; box-shadow: 0 0 4px var(--accent-green); }
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.25s ease;
}

.icon-btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
  color: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.icon-btn:active { transform: translateY(0); }

/* ========== 主工作区 ========== */
.main-workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  padding: 16px;
  min-height: 0;
  overflow: hidden;
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--shadow-card);
  transition: border-color 0.3s ease;
}

.panel:hover {
  border-color: var(--border-glow);
}

.panel-header {
  flex-shrink: 0;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  background: rgba(139, 92, 246, 0.03);
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

.panel-title .icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: white;
}

.panel-actions {
  display: flex;
  gap: 6px;
}

.small-btn {
  padding: 5px 12px;
  font-size: 12px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.small-btn:hover {
  background: var(--bg-card-hover);
  color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.panel-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ========== 左栏：指令输入区 ========== */
.input-area {
  height: 100%;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.prompt-textarea {
  flex: 1;
  width: 100%;
  padding: 16px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.7;
  resize: none;
  outline: none;
  transition: all 0.3s ease;
}

.prompt-textarea:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
}

.prompt-textarea::placeholder {
  color: var(--text-muted);
}

.examples {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.examples-label {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.examples-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.example-chip {
  padding: 8px 12px;
  font-size: 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.example-chip:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  transform: translateY(-1px);
  background: rgba(139, 92, 246, 0.05);
}

.generate-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  letter-spacing: 1px;
}

.generate-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}

.generate-btn:hover::before { left: 100%; }

.generate-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
}

.generate-btn:active { transform: translateY(0); }

.generate-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.generate-btn .spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== 中栏：代码输出区 ========== */
.code-container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.code-header-tabs {
  flex-shrink: 0;
  display: flex;
  padding: 10px 14px 0;
  gap: 4px;
  border-bottom: 1px solid var(--border-color);
}

.code-tab {
  padding: 8px 14px;
  font-size: 12px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
}

.code-tab.active {
  background: var(--bg-card);
  color: var(--accent-primary);
  border-color: var(--border-color);
  border-bottom-color: var(--bg-card);
  margin-bottom: -1px;
}

.code-view {
  flex: 1;
  overflow: auto;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre;
  word-wrap: normal;
}

.code-view .line {
  display: flex;
  min-height: 1.7em;
}

.code-view .line-num {
  flex-shrink: 0;
  width: 40px;
  text-align: right;
  padding-right: 12px;
  color: var(--text-muted);
  user-select: none;
  opacity: 0.5;
}

.code-view .line-content {
  flex: 1;
}

/* 语法高亮 */
.tok-tag { color: #f472b6; }
.tok-attr { color: #fbbf24; }
.tok-str { color: #34d399; }
.tok-comment { color: #6b7280; font-style: italic; }
.tok-prop { color: #60a5fa; }
.tok-val { color: #f97316; }
.tok-fn { color: #a78bfa; }
.tok-kw { color: #ec4899; }
.tok-num { color: #fb923c; }
.tok-op { color: #94a3b8; }

.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: var(--accent-primary);
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 2px;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* ========== 右栏：实时预览区 ========== */
.preview-container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.preview-toolbar {
  flex-shrink: 0;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
}

.url-bar {
  flex: 1;
  padding: 6px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.size-toggle {
  display: flex;
  gap: 4px;
}

.size-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.2s ease;
}

.size-btn.active {
  background: var(--accent-primary);
  color: white;
  border-color: var(--accent-primary);
}

.preview-frame-wrap {
  flex: 1;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  background: 
    linear-gradient(45deg, rgba(139, 92, 246, 0.03) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(139, 92, 246, 0.03) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(139, 92, 246, 0.03) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(139, 92, 246, 0.03) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}

.preview-frame {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: white;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.preview-frame.mobile {
  width: 320px;
  height: 640px;
  border-radius: 28px;
  border-width: 8px;
  border-color: var(--bg-secondary);
}

.preview-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-muted);
  text-align: center;
  padding: 40px;
}

.preview-empty .empty-icon {
  font-size: 48px;
  opacity: 0.3;
}

.preview-empty p {
  font-size: 13px;
  line-height: 1.6;
}

/* ========== 底部：历史记录画廊 ========== */
.history-section {
  flex-shrink: 0;
  padding: 14px 32px;
  border-top: 1px solid var(--border-color);
  position: relative;
  z-index: 10;
}

.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.history-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.history-count {
  padding: 2px 8px;
  font-size: 11px;
  background: rgba(139, 92, 246, 0.1);
  color: var(--accent-primary);
  border-radius: 10px;
}

.history-clear {
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.2s ease;
}

.history-clear:hover { color: var(--accent-pink); }

.gallery-container {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  scroll-behavior: smooth;
}

.gallery-container::-webkit-scrollbar {
  height: 4px;
}

.gallery-container::-webkit-scrollbar-track {
  background: transparent;
}

.gallery-container::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 2px;
}

.history-card {
  flex-shrink: 0;
  width: 150px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.3s ease;
  overflow: hidden;
  position: relative;
}

.history-card:hover {
  border-color: var(--accent-primary);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
}

.history-thumb {
  width: 100%;
  height: 90px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  position: relative;
  overflow: hidden;
}

.history-thumb canvas {
  width: 100%;
  height: 100%;
}

.history-card-info {
  padding: 10px;
}

.history-card-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-card-time {
  font-size: 10px;
  color: var(--text-muted);
}

.history-card-del {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.history-card:hover .history-card-del { opacity: 1; }

.history-card-del:hover { background: var(--accent-pink); }

.empty-history {
  width: 100%;
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
}

/* ========== Toast 提示 ========== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  padding: 12px 20px;
  border-radius: 10px;
  background: var(--bg-card-strong);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-size: 13px;
  box-shadow: var(--shadow-card);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.success { border-left: 3px solid var(--accent-green); }
.toast.error { border-left: 3px solid var(--accent-pink); }
.toast.info { border-left: 3px solid var(--accent-secondary); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(100px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(100px); }
}

/* ========== 响应式 ========== */
@media (max-width: 1200px) {
  .main-workspace {
    grid-template-columns: 1fr 1fr;
  }
  .panel.preview-panel {
    grid-column: span 2;
  }
}

@media (max-width: 768px) {
  .main-workspace {
    grid-template-columns: 1fr;
    overflow-y: auto;
  }
  .panel.preview-panel {
    grid-column: span 1;
  }
  .header { padding: 12px 16px; }
  .logo-text h1 { font-size: 18px; }
  .header-tip { display: none; }
  .history-section { padding: 12px 16px; }
}
</style>
</head>
<body>

<div class="neon-line neon-line-1"></div>
<div class="neon-line neon-line-2"></div>

<!-- ========== 顶部区域 ========== -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <div class="logo-icon">✨</div>
      <div class="logo-text">
        <h1>指令幻境生成盒</h1>
        <p>AI Mini Page Generator · 自然语言 → 可视化网页</p>
      </div>
    </div>
  </div>
  <div class="header-tip">
    <span class="dot"></span>
    <span>输入描述 · 一键生成 · 实时预览</span>
  </div>
  <div class="header-controls">
    <button class="icon-btn" id="themeToggle" title="切换主题">🌓</button>
    <button class="icon-btn" id="exportBtn" title="导出HTML">📥</button>
    <button class="icon-btn" id="screenshotBtn" title="截图预览">📷</button>
    <button class="icon-btn" id="clearCacheBtn" title="清空缓存">🗑️</button>
  </div>
</header>

<!-- ========== 主工作区 ========== -->
<main class="main-workspace">
  <!-- 左栏：指令输入 -->
  <section class="panel input-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span class="icon">💬</span>
        <span>指令输入</span>
      </div>
    </div>
    <div class="panel-body">
      <div class="input-area">
        <textarea

  let bestMatch = null;
  let bestScore = 0;
  
  for (const tpl of TEMPLATES) {
    let score = 0;
    for (const kw of tpl.keywords) {
      if (lowerPrompt.includes(kw.toLowerCase())) {
        score += kw.length > 2 ? 2 : 1;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = tpl;
    }
  }
  
  if (!bestMatch) {
    bestMatch = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
  }
  
  return bestMatch;
}

// 代码语法高亮（简易版）
function highlightHTML(code) {
  return code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-comment">$1</span>')
    .replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)/g, '$1<span class="tok-tag">$2</span>')
    .replace(/(\s)([a-zA-Z-]+)(=)/g, '$1<span class="tok-attr">$2</span>$3')
    .replace(/(=)(&quot;[^&]*?&quot;)/g, '$1<span class="tok-str">$2</span>')
    .replace(/(=)('[^']*?')/g, '$1<span class="tok-str">$2</span>');
}

function highlightCSS(code) {
  return code
    .replace(/\/\*[\s\S]*?\*\//g, m => `<span class="tok-comment">${m}</span>`)
    .replace(/([a-zA-Z-]+)(\s*):/g, '<span class="tok-prop">$1</span>$2:')
    .replace(/:\s*([^;{}]+)/g, (m, val) => `: <span class="tok-val">${val.trim()}</span>`)
    .replace(/([.#][a-zA-Z_-][^{]*)/g, '<span class="tok-tag">$1</span>');
}

function highlightJS(code) {
  const keywords = ['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'document', 'window'];
  let result = code
    .replace(/\/\/.*$/gm, m => `<span class="tok-comment">${m}</span>`)
    .replace(/\/\*[\s\S]*?\*\//g, m => `<span class="tok-comment">${m}</span>`)
    .replace(/(["'`])(?:(?!\1)[^\\]|\\.)*\1/g, m => `<span class="tok-str">${m}</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');
  
  for (const kw of keywords) {
    const re = new RegExp(`\\b(${kw})\\b`, 'g');
    result = result.replace(re, '<span class="tok-kw">$1</span>');
  }
  
  return result;
}

// 分割代码为HTML/CSS/JS部分
function splitCode(fullCode) {
  let html = fullCode;
  let css = '';
  let js = '';
  
  const styleMatch = fullCode.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  if (styleMatch) {
    css = styleMatch[1].trim();
  }
  
  const scriptMatch = fullCode.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
  if (scriptMatch) {
    js = scriptMatch[1].trim();
  }
  
  return { html: fullCode, css, js };
}

// 带行号格式化
function formatCode(code, lang) {
  let highlighted;
  switch(lang) {
    case 'css': highlighted = highlightCSS(code); break;
    case 'js': highlighted = highlightJS(code); break;
    default: highlighted = highlightHTML(code); break;
  }
  
  const lines = highlighted.split('\n');
  return lines.map((line, i) => 
    `<div class="line"><span class="line-num">${i+1}</span><span class="line-content">${line || '&nbsp;'}</span></div>`
  ).join('');
}

// 生成缩略图（用Canvas画配色卡片）
function generateThumbnail(template) {
  const canvas = document.createElement('canvas');
  canvas.width = 150;
  canvas.height = 90;
  const ctx = canvas.getContext('2d');
  
  const [c1, c2, c3] = template.palette;
  const grad = ctx.createLinearGradient(0, 0, 150, 90);
  grad.addColorStop(0, c1);
  grad.addColorStop(0.5, c2);
  grad.addColorStop(1, c3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 150, 90);
  
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(10, 12, 50, 6);
  ctx.fillRect(10, 24, 80, 4);
  ctx.fillRect(10, 32, 60, 4);
  
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(10, 45, 30, 30);
  ctx.fillRect(50, 45, 45, 14);
  ctx.fillRect(50, 61, 45, 14);
  
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(105, 45, 35, 30);
  
  return canvas.toDataURL();
}

// ========== 状态管理 ==========
let currentTemplate = null;
let currentCode = '';
let currentTab = 'html';
let previewSize = 'desktop';
let isGenerating = false;
let history = JSON.parse(localStorage.getItem('幻境_history') || '[]');

// ========== 初始化 ==========
function init() {
  initTheme();
  renderExamples();
  renderHistory();
  bindEvents();
}

// 主题
function initTheme() {
  const saved = localStorage.getItem('幻境_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('幻境_theme', next);
  showToast(next === 'dark' ? '已切换到暗黑模式' : '已切换到浅色模式', 'success');
}

// 示例渲染
function renderExamples() {
  const grid = $('examplesGrid');
  grid.innerHTML = EXAMPLES.map(ex => 
    `<button class="example-chip" data-prompt="${ex}">${ex}</button>`
  ).join('');
  
  grid.querySelectorAll('.example-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      $('promptInput').value = btn.dataset.prompt;
    });
  });
}

// 历史记录渲染
function renderHistory() {
  const container = $('galleryContainer');
  const count = $('historyCount');
  count.textContent = history.length;
  
  if (history.length === 0) {
    container.innerHTML = '<div class="empty-history">还没有生成记录，试试输入指令创建你的第一个幻境吧 ✨</div>';
    return;
  }
  
  container.innerHTML = history.map((item, idx) => `
    <div class="history-card" data-idx="${idx}">
      <button class="history-card-del" data-idx="${idx}">×</button>
      <div class="history-thumb">
        <img src="${item.thumbnail}" style="width:100%;height:100%;object-fit:cover;" alt="">
      </div>
      <div class="history-card-info">
        <div class="history-card-name">${item.name}</div>
        <div class="history-card-time">${formatTime(item.createdAt)}</div>
      </div>
    </div>
  `).join('');
  
  container.querySelectorAll('.history-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('history-card-del')) return;
      const idx = parseInt(card.dataset.idx);
      loadHistory(idx);
    });
  });
  
  container.querySelectorAll('.history-card-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      history.splice(idx, 1);
      localStorage.setItem('幻境_history', JSON.stringify(history));
      renderHistory();
      showToast('已删除记录', 'success');
    });
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

function loadHistory(idx) {
  const item = history[idx];
  $('promptInput').value = item.prompt;
  currentTemplate = TEMPLATES.find(t => t.id === item.templateId) || TEMPLATES[0];
  currentCode = item.code;
  renderCode();
  updatePreview(currentCode);
  $('urlBar').textContent = item.name + '.html';
  showToast('已加载历史记录', 'success');
}

// ========== 绑定事件 ==========
function bindEvents() {
  $('generateBtn').addEventListener('click', handleGenerate);
  $('promptInput').addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') handleGenerate();
  });
  
  $('themeToggle').addEventListener('click', toggleTheme);
  $('exportBtn').addEventListener('click', exportHTML);
  $('screenshotBtn').addEventListener('click', () => showToast('截图功能开发中 📸', 'info'));
  $('clearCacheBtn').addEventListener('click', clearAllCache);
  $('copyBtn').addEventListener('click', copyCode);
  $('resetBtn').addEventListener('click', resetCode);
  $('clearHistoryBtn').addEventListener('click', clearHistory);
  
  document.querySelectorAll('.code-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderCode();
    });
  });
  
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      previewSize = btn.dataset.size;
      const frame = $('previewFrame');
      if (previewSize === 'mobile') {
        frame.classList.add('mobile');
      } else {
        frame.classList.remove('mobile');
      }
    });
  });
}

// ========== 生成逻辑 ==========
async function handleGenerate() {
  const prompt = $('promptInput').value.trim();
  if (!prompt) {
    showToast('请先输入描述指令 ✏️', 'error');
    return;
  }
  if (isGenerating) return;
  
  isGenerating = true;
  const btn = $('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>AI 生成中...';
  
  const template = matchTemplate(prompt);
  currentTemplate = template;
  
  $('urlBar').textContent = template.name + '.html';
  
  const code = template.generate();
  
  await typeCodeEffect(code);
  
  currentCode = code;
  updatePreview(code);
  
  saveToHistory(prompt, template, code);
  
  isGenerating = false;
  btn.disabled = false;
  btn.innerHTML = '<span class="btn-text">⚡ 一键生成幻境</span>';
  
  showToast('幻境生成成功！✨', 'success');
}

// 打字机效果
async function typeCodeEffect(fullCode) {
  const codeView = $('codeView');
  
  const split = splitCode(fullCode);
  let displayCode = '';
  
  if (currentTab === 'html') {
    displayCode = fullCode;
  } else if (currentTab === 'css') {
    displayCode = split.css || '/* No CSS */';
  } else {
    displayCode = split.js || '// No JavaScript';
  }
  
  const totalLen = displayCode.length;
  const steps = 60;
  const stepLen = Math.ceil(totalLen / steps);
  const delay = 30;
  
  for (let i = 0; i <= totalLen; i += stepLen) {
    const partial = displayCode.substring(0, i);
    codeView.innerHTML = formatCode(partial, currentTab) + '<span class="typing-cursor"></span>';
    codeView.scrollTop = codeView.scrollHeight;
    await new Promise(r => setTimeout(r, delay));
  }
  
  codeView.innerHTML = formatCode(displayCode, currentTab);
}

function renderCode() {
  if (!currentCode) return;
  const codeView = $('codeView');
  const split = splitCode(currentCode);
  let code;
  if (currentTab === 'html') code = currentCode;
  else if (currentTab === 'css') code = split.css || '/* No CSS */';
  else code = split.js || '// No JavaScript';
  codeView.innerHTML = formatCode(code, currentTab);
}

// 更新预览
function updatePreview(htmlCode) {
  const frame = $('previewFrame');
  const empty = $('previewEmpty');
  
  empty.style.display = 'none';
  frame.style.display = 'block';
  
  frame.srcdoc = htmlCode;
}

// ========== 功能函数 ==========
function copyCode() {
  if (!currentCode) {
    showToast('还没有生成代码哦', 'error');
    return;
  }
  const split = splitCode(currentCode);
  let text = currentTab === 'html' ? currentCode : 
              currentTab === 'css' ? split.css : split.js;
  navigator.clipboard.writeText(text).then(() => {
    showToast('代码已复制到剪贴板 📋', 'success');
  }).catch(() => {
    showToast('复制失败，请手动复制', 'error');
  });
}

function resetCode() {
  if (!currentCode) {
    showToast('还没有生成代码哦', 'error');
    return;
  }
  if (confirm('确定要重置当前代码吗？')) {
    currentCode = '';
    currentTemplate = null;
    $('codeView').innerHTML = `
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-family: var(--font-sans); text-align: center; padding: 40px;">
        <div style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;">⌨️</div>
        <p style="font-size: 13px; line-height: 1.8;">
          输入指令后，AI将在这里生成<br>
          <span style="color: var(--accent-primary);">HTML / CSS / JS</span> 完整代码
        </p>
      </div>`;
    $('previewFrame').style.display = 'none';
    $('previewEmpty').style.display = 'flex';
    $('urlBar').textContent = 'about:blank';
    showToast('已重置', 'success');
  }
}

function exportHTML() {
  if (!currentCode) {
    showToast('请先生成幻境页面', 'error');
    return;
  }
  const blob = new Blob([currentCode], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (currentTemplate?.name || '幻境') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('HTML文件已导出 📥', 'success');
}

function saveToHistory(prompt, template, code) {
  const item = {
    id: Date.now(),
    prompt,
    name: template.name,
    templateId: template.id,
    code,
    thumbnail: generateThumbnail(template),
    createdAt: Date.now()
  };
  
  history.unshift(item);
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('幻境_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  if (history.length === 0) {
    showToast('历史记录已经是空的啦', 'info');
    return;
  }
  if (confirm('确定要清空全部历史记录吗？')) {
    history = [];
    localStorage.removeItem('幻境_history');
    renderHistory();
    showToast('历史记录已清空', 'success');
  }
}

function clearAllCache() {
  if (confirm('确定要清空所有缓存吗？这将删除全部历史记录。')) {
    localStorage.removeItem('幻境_history');
    localStorage.removeItem('幻境_theme');
    history = [];
    renderHistory();
    showToast('所有缓存已清空 🧹', 'success');
  }
}

// ========== 启动 ==========
document.addEventListener('DOMContentLoaded', init);
</script>
