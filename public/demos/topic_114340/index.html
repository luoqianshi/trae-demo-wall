<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的多线人生 — 生命之树 v10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#e8f5e9;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none}
canvas{display:block;cursor:default}

#topBar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:10;border-bottom:1px solid rgba(0,0,0,0.06)}
#topBar h1{font-size:1rem;font-weight:700;color:#2e4a2e;letter-spacing:0.5px}
#addBranchBtn{padding:5px 14px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;border:1.5px solid #22c55e;background:#f0fdf4;color:#16a34a;transition:all 0.2s}
#addBranchBtn:hover{background:#22c55e;color:white}
.stats{display:flex;gap:14px;font-size:0.8rem;color:#5a7a5a}
.stats span{display:flex;align-items:center;gap:3px}
.stats .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-leaf{background:linear-gradient(135deg,#4ade80,#22c55e)}
.dot-bloom{background:linear-gradient(135deg,#f472b6,#ec4899)}
.dot-branch{background:linear-gradient(135deg,#a0845c,#8B5E3C)}

#emptyHint{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);padding:14px 28px;border-radius:50px;font-size:0.95rem;color:#5a7a5a;box-shadow:0 4px 20px rgba(0,0,0,0.08);pointer-events:none;transition:opacity 0.5s;z-index:5}
#emptyHint.hidden{opacity:0}

#contextMenu{position:fixed;z-index:20;background:white;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);padding:6px 0;min-width:160px;display:none}
#contextMenu.show{display:block;animation:fadeIn 0.15s ease}
.ctx-item{padding:10px 18px;font-size:0.9rem;color:#333;cursor:pointer;transition:background 0.15s}
.ctx-item:hover{background:#f0fdf4}
.ctx-item.danger{color:#dc2626}
.ctx-item.danger:hover{background:#fef2f2}
.ctx-sep{height:1px;background:#e5e7eb;margin:4px 0}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);z-index:30;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex;animation:fadeIn 0.2s ease}
.modal{background:white;border-radius:20px;padding:28px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal h2{font-size:1.2rem;font-weight:700;color:#1a2e1a;margin-bottom:18px}
.modal label{display:block;font-size:0.83rem;font-weight:600;color:#5a7a5a;margin-bottom:5px;margin-top:12px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 13px;border:1.5px solid #d1e7d1;border-radius:10px;font-size:0.93rem;outline:none;transition:border-color 0.2s;font-family:inherit}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#22c55e}
.modal-row{display:flex;gap:12px}
.modal-row>div{flex:1}
.btn-row{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.btn{padding:9px 20px;border-radius:10px;font-size:0.88rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
.btn-cancel{background:#f3f4f6;color:#666}
.btn-cancel:hover{background:#e5e7eb}
.btn-confirm{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;box-shadow:0 4px 12px rgba(34,197,94,0.3)}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(34,197,94,0.4)}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#fecaca}

#toastContainer{position:fixed;top:58px;right:20px;z-index:40;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:12px;font-size:0.85rem;font-weight:500;color:white;box-shadow:0 4px 16px rgba(0,0,0,0.12);animation:slideIn 0.3s ease,fadeOut 0.4s ease 2.2s forwards;max-width:280px}
.toast-success{background:linear-gradient(135deg,#22c55e,#16a34a)}
.toast-achieve{background:linear-gradient(135deg,#ec4899,#db2777)}
.toast-info{background:linear-gradient(135deg,#3b82f6,#2563eb)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeOut{to{opacity:0;transform:translateX(40px)}}

/* Bubble tooltip */
#bubbleTip{position:fixed;z-index:18;background:white;border-radius:14px;padding:16px;min-width:200px;box-shadow:0 8px 30px rgba(0,0,0,0.15);display:none;pointer-events:auto}
#bubbleTip.show{display:block;animation:fadeIn 0.15s ease}
#bubbleTip h3{font-size:0.95rem;font-weight:700;color:#1a2e1a;margin-bottom:8px}
#bubbleTip .tip-info{font-size:0.8rem;color:#5a7a5a;margin-bottom:4px}
#bubbleTip .tip-branch{font-size:0.75rem;color:#8B5E3C;margin-bottom:10px}
#bubbleTip .btn-complete{width:100%;padding:8px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;border:none;color:white;transition:all 0.2s}
#bubbleTip .btn-complete.sun-btn{background:linear-gradient(135deg,#FFB300,#F57F17)}
#bubbleTip .btn-complete.sun-btn:hover{background:linear-gradient(135deg,#F57F17,#E65100)}
#bubbleTip .btn-complete.rain-btn{background:linear-gradient(135deg,#0288D1,#01579B)}
#bubbleTip .btn-complete.rain-btn:hover{background:linear-gradient(135deg,#01579B,#0D47A1)}

/* Bottom Soil Panel */
#soilPanel{position:fixed;bottom:0;left:0;right:0;height:150px;background:linear-gradient(180deg,#6d4c2a 0%,#5a3e20 40%,#4a3218 100%);z-index:10;display:flex;border-top:3px solid #8B6E4E;box-shadow:0 -4px 20px rgba(0,0,0,0.15)}
#soilTabs{width:100px;border-right:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;padding:8px 0}
.soil-tab{padding:10px 12px;font-size:0.78rem;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;text-align:center}
.soil-tab:hover{color:rgba(255,255,255,0.8)}
.soil-tab.active{color:white;border-left-color:#4ade80;background:rgba(255,255,255,0.08)}
#soilContent{flex:1;overflow-y:auto;padding:12px 16px}
.soil-section-title{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.todo-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,0.06);transition:background 0.15s;cursor:pointer}
.todo-item:hover{background:rgba(255,255,255,0.12)}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.todo-dot.sun{background:#FFB300}
.todo-dot.rain{background:#4FC3F7}
.todo-name{flex:1;font-size:0.82rem;color:rgba(255,255,255,0.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-branch-tag{font-size:0.7rem;color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:4px;flex-shrink:0}
.feed-item{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;margin-bottom:4px}
.feed-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:white;flex-shrink:0;margin-top:1px}
.feed-icon.fi-task{background:#FFB300}
.feed-icon.fi-goal{background:#4FC3F7}
.feed-icon.fi-leaf{background:#22c55e}
.feed-icon.fi-bloom{background:#ec4899}
.feed-text{font-size:0.8rem;color:rgba(255,255,255,0.7);line-height:1.4}
.feed-text strong{color:rgba(255,255,255,0.9);font-weight:600}
.feed-time{font-size:0.68rem;color:rgba(255,255,255,0.3);margin-top:2px}

/* Side Panel */
#sidePanel{position:fixed;right:0;top:48px;bottom:150px;width:240px;background:#ffffff;border-left:1px solid rgba(0,0,0,0.1);z-index:9;overflow-y:auto;padding:14px;transition:transform 0.3s}
#sidePanel.collapsed{transform:translateX(240px)}
#togglePanel{position:fixed;right:240px;top:58px;z-index:9;width:26px;height:26px;border-radius:8px 0 0 8px;background:#ffffff;border:1px solid rgba(0,0,0,0.1);border-right:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#5a7a5a;transition:right 0.3s}
#togglePanel.shifted{right:0}
.branch-item{padding:8px 10px;border-radius:10px;margin-bottom:6px;background:#f0fdf4;border:1px solid #d1e7d1;transition:all 0.2s}
.branch-item:hover{background:#dcfce7;border-color:#22c55e}
.branch-item h4{font-size:0.85rem;font-weight:600;color:#1a2e1a;margin-bottom:3px}
.branch-item p{font-size:0.72rem;color:#5a7a5a}
.branch-actions{display:flex;gap:5px;margin-top:6px}
.branch-actions button{padding:3px 8px;border-radius:6px;font-size:0.72rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-add-task{background:#fef3c7;color:#92400e}.btn-add-task:hover{background:#fde68a}
.btn-add-goal{background:#dbeafe;color:#1e3a5f}.btn-add-goal:hover{background:#bfdbfe}
.btn-del-branch{background:#fee2e2;color:#dc2626}.btn-del-branch:hover{background:#fecaca}
#panelTitle{font-size:0.82rem;font-weight:700;color:#2e4a2e;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e5e7eb}
.item-list{margin-top:6px}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;border-radius:6px;margin-bottom:2px;font-size:0.78rem;cursor:pointer;transition:background 0.15s}
.item-row:hover{background:rgba(0,0,0,0.04)}
.item-row.sun{background:rgba(255,213,79,0.15)}.item-row.sun:hover{background:rgba(255,213,79,0.3)}
.item-row.rain{background:rgba(79,195,247,0.15)}.item-row.rain:hover{background:rgba(79,195,247,0.3)}
.item-row .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .item-check{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:white;flex-shrink:0}
.sun .item-check{background:#FFB300}
.rain .item-check{background:#0288D1}
</style>
</head>
<body>

<canvas id="treeCanvas"></canvas>

<div id="topBar">
  <h1>我的多线人生</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <button id="addBranchBtn" onclick="openModal('branchModal');setTimeout(()=>document.getElementById('branchNameInput').focus(),100)">+ 新建事项</button>
    <div class="stats">
      <span><span class="dot dot-branch"></span> 枝条 <b id="statBranch">0</b></span>
      <span><span class="dot dot-leaf"></span> 叶片 <b id="statLeaf">0</b></span>
      <span><span class="dot dot-bloom"></span> 花朵 <b id="statBloom">0</b></span>
    </div>
  </div>
</div>

<div id="emptyHint">点击棕色主干或使用右上角按钮，开始你的第一根枝条</div>

<div id="sidePanel">
  <div id="panelTitle">我的事项</div>
  <div id="branchList"></div>
</div>
<button id="togglePanel" onclick="toggleSidePanel()">&lt;</button>

<div id="bubbleTip">
  <h3 id="tipTitle"></h3>
  <div id="tipInfo" class="tip-info"></div>
  <div id="tipBranch" class="tip-branch"></div>
  <button id="tipBtn" class="btn-complete" onclick="completeFromTip()">完成</button>
</div>

<div id="soilPanel">
  <div id="soilTabs">
    <div class="soil-tab active" data-tab="todo" onclick="switchSoilTab('todo')">待办</div>
    <div class="soil-tab" data-tab="feed" onclick="switchSoilTab('feed')">动态</div>
  </div>
  <div id="soilContent">
    <div id="todoView"></div>
    <div id="feedView" style="display:none"></div>
  </div>
</div>

<div id="contextMenu"></div>

<!-- Add Branch Modal -->
<div class="modal-overlay" id="branchModal">
  <div class="modal">
    <h2>新建事项</h2>
    <label>事项名称</label>
    <input type="text" id="branchNameInput" placeholder="例如：工作、学习、健康..." maxlength="20">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('branchModal')">取消</button>
      <button class="btn btn-confirm" onclick="confirmAddBranch()">确定</button>
    </div>
  </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2>添加任务</h2>
    <label>任务名称</label>
    <input type="text" id="taskNameInput" placeholder="例如：完成周报" maxlength="30">
    <label>频率</label>
    <select id="taskFreqInput">
      <option value="once">单次</option>
      <option value="daily">每天</option>
      <option value="weekly">每周</option>
      <option value="monthly">每月</option>
      <option value="longterm">长期</option>
    </select>
    <label>截止时间</label>
    <input type="date" id="taskDeadlineInput">
    <div class="modal-row">
      <div><label>优先级 (1-5)</label><input type="number" id="taskPriorityInput" min="1" max="5" value="3"></div>
      <div><label>权重 (1-5)</label><input type="number" id="taskWeightInput" min="1" max="5" value="3"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('taskModal')">取消</button>
      <button class="btn btn-confirm" onclick="confirmAddTask()">添加</button>
    </div>
  </div>
</div>

<!-- Add Goal Modal -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <h2>设定目标</h2>
    <label>目标名称</label>
    <input type="text" id="goalNameInput" placeholder="例如：通过英语六级" maxlength="30">
    <label>截止时间</label>
    <input type="date" id="goalDeadlineInput">
    <div class="modal-row">
      <div><label>优先级 (1-5)</label><input type="number" id="goalPriorityInput" min="1" max="5" value="3"></div>
      <div><label>权重 (1-5)</label><input type="number" id="goalWeightInput" min="1" max="5" value="3"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('goalModal')">取消</button>
      <button class="btn btn-confirm" onclick="confirmAddGoal()">添加</button>
    </div>
  </div>
</div>

<!-- Sub-Branch Modal -->
<div class="modal-overlay" id="subBranchModal">
  <div class="modal">
    <h2>添加子事项</h2>
    <label>子事项名称</label>
    <input type="text" id="subBranchNameInput" placeholder="例如：英语、数学、编程..." maxlength="20">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('subBranchModal')">取消</button>
      <button class="btn btn-confirm" onclick="confirmAddSubBranch()">确定</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2>确认删除</h2>
    <p style="color:#5a7a5a;margin-bottom:8px" id="deleteMsg">确定要删除这个事项吗？</p>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ===== CONSTANTS =====
const TRUNK_WIDTH_BASE = 14;
const TRUNK_WIDTH_TOP = 6;
const BRANCH_HIT_PAD = 25;
const TRUNK_HIT_PAD = 40;
const DRAG_THRESHOLD = 5;
const RAINBOW_DURATION = 3500;
const SOIL_HEIGHT = 150;
const TOP_BAR_H = 48;
const LEAF_COLORS = [
  ['#4ade80','#22c55e'],['#34d399','#059669'],['#a3e635','#65a30d'],
  ['#2dd4bf','#0d9488'],['#86efac','#16a34a'],['#bef264','#4d7c0f'],
  ['#6ee7b7','#047857'],['#a7f3d0','#065f46']
];
const BLOOM_COLORS = [
  ['#f472b6','#ec4899'],['#fb923c','#ea580c'],['#c084fc','#9333ea'],
  ['#f9a8d4','#db2777'],['#fbbf24','#d97706'],['#fda4af','#e11d48'],
  ['#d8b4fe','#7c3aed'],['#fcd34d','#b45309']
];
const FREQ_LABELS = {once:'单次',daily:'每天',weekly:'每周',monthly:'每月',longterm:'长期'};

// ===== STATE =====
let state = { branches: [], rainbows: [], particles: [], nextId: 1, feed: [] };
let canvas, ctx, dpr;
let hoveredTarget = null;
let mouseDownPos = null;
let isDragging = false;
let dragBranch = null;
let contextBranchId = null;
let deleteTargetId = null;
let trunkRect = {};
let animFrame = 0;
let currentSoilTab = 'todo';
let tipTarget = null; // {type:'task'|'goal', branchId, id}

// Falling animations
let fallingItems = []; // {type, branchId, itemId, startX, startY, targetX, targetY, progress, color1, color2}

// ===== UTILITY =====
function gid() { return 'i' + (state.nextId++); }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function ptSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return dist(px, py, ax, ay);
  let t = clamp(((px-ax)*dx+(py-ay)*dy)/lenSq, 0, 1);
  return dist(px, py, ax+t*dx, ay+t*dy);
}
function quadBezier(t, x0, y0, cx, cy, x1, y1) {
  const u = 1 - t;
  return { x: u*u*x0+2*u*t*cx+t*t*x1, y: u*u*y0+2*u*t*cy+t*t*y1 };
}
function calcBubbleRadius(priority, weight) { return 12 + (priority + weight) * 2; }
function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function deadlineStr(deadline) {
  if (!deadline) return '';
  const d = new Date(deadline);
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.ceil((d - now) / 86400000);
  if (diff < 0) return '已逾期 ' + Math.abs(diff) + ' 天';
  if (diff === 0) return '今天截止';
  if (diff === 1) return '明天截止';
  return diff + ' 天后截止';
}

// ===== SKY POSITIONS =====
// Distribute all active tasks/goals across the sky area
function getSkyPositions() {
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  const { cx, topY, baseY } = getTrunkGeom();

  // Compute tree bounding box (branches + leaf scatter)
  let treeMinX = cx - 30, treeMaxX = cx + 30, treeMinY = topY - 20;
  state.branches.forEach(b => {
    const p = getBranchPath(b);
    const scatter = 55; // max leaf scatter distance
    treeMinX = Math.min(treeMinX, p.ax, p.cx, p.ex) - scatter;
    treeMaxX = Math.max(treeMaxX, p.ax, p.cx, p.ex) + scatter;
    treeMinY = Math.min(treeMinY, p.ay, p.cy, p.ey) - scatter;
  });
  const treeMaxY = baseY + 10;

  // Define non-overlapping zones with generous gap from tree
  const gap = 30;
  // Zone 1: Top band (well above tree canopy)
  const topZone = { x1: 10, y1: TOP_BAR_H + 10, x2: w - 260, y2: Math.max(TOP_BAR_H + 50, treeMinY - gap) };
  // Only use top zone if it has enough height
  const topValid = topZone.y2 - topZone.y1 > 50;
  // Zone 2: Left band (left of tree trunk)
  const leftZone = { x1: 10, y1: TOP_BAR_H + 10, x2: Math.max(50, treeMinX - gap), y2: h - SOIL_HEIGHT - 20 };
  const leftValid = leftZone.x2 - leftZone.x1 > 50 && leftZone.y2 - leftZone.y1 > 50;
  // Zone 3: Right band (right of tree, left of side panel)
  const rightZone = { x1: Math.min(w - 270, treeMaxX + gap), y1: TOP_BAR_H + 10, x2: w - 260, y2: h - SOIL_HEIGHT - 20 };
  const rightValid = rightZone.x2 - rightZone.x1 > 50 && rightZone.y2 - rightZone.y1 > 50;

  const items = [];
  state.branches.forEach(b => {
    b.tasks.filter(t => !t.completed && !t.falling).forEach(t => {
      items.push({ type:'task', branchId:b.id, id:t.id, data:t, branchName:b.name });
    });
    b.goals.filter(g => !g.achieved && !g.falling).forEach(g => {
      items.push({ type:'goal', branchId:b.id, id:g.id, data:g, branchName:b.name });
    });
  });
  if (items.length === 0) return [];

  // Build valid zones list
  const zones = [];
  if (topValid) zones.push({ ...topZone, name: 'top' });
  if (leftValid) zones.push({ ...leftZone, name: 'left' });
  if (rightValid) zones.push({ ...rightZone, name: 'right' });

  if (zones.length === 0) {
    zones.push({ x1: 10, y1: TOP_BAR_H + 10, x2: w - 260, y2: TOP_BAR_H + 80, name: 'fallback' });
  }

  // For small item counts, spread them across different zones for visual balance
  const perZone = Math.max(1, Math.ceil(items.length / zones.length));
  return items.map((item, i) => {
    const zoneIdx = Math.min(Math.floor(i / perZone), zones.length - 1);
    const zone = zones[zoneIdx];
    const localIdx = i - zoneIdx * perZone;
    const cols = Math.max(1, Math.ceil(Math.sqrt(perZone * (zone.x2 - zone.x1) / Math.max(zone.y2 - zone.y1, 1))));
    const rows = Math.ceil(perZone / cols);
    const col = localIdx % cols;
    const row = Math.floor(localIdx / cols);
    const cellW = (zone.x2 - zone.x1) / Math.max(cols, 1);
    const cellH = (zone.y2 - zone.y1) / Math.max(rows, 1);
    const seed = parseInt(item.id.replace('i','')) || 0;
    const ox = ((seed * 7 + 13) % 37) / 37 * 0.4 + 0.3;
    const oy = ((seed * 11 + 29) % 41) / 41 * 0.4 + 0.3;
    const baseX = zone.x1 + (col + ox) * cellW;
    const baseY = zone.y1 + (row + oy) * cellH;
    const floatX = Math.sin(animFrame * 0.012 + seed) * 5;
    const floatY = Math.cos(animFrame * 0.009 + seed * 1.3) * 4;
    return { ...item, x: baseX + floatX, y: baseY + floatY };
  });
}

// ===== TRUNK GEOMETRY =====
function getTrunkGeom() {
  const cx = canvas.width / (2 * dpr);
  const baseY = canvas.height / dpr - SOIL_HEIGHT - 10;
  const topY = canvas.height / dpr * 0.42;
  return { cx, baseY, topY };
}

function getBranchPath(b) {
  const { cx, baseY, topY } = getTrunkGeom();
  const attachY = topY + (baseY - topY) * (1 - b.attachRatio);
  const attachX = cx;
  const totalLen = b.baseLength + b.growthLength;
  const endX = attachX + Math.sin(b.angle) * totalLen;
  const endY = attachY - Math.cos(b.angle) * totalLen;
  const cpX = attachX + Math.sin(b.angle) * totalLen * 0.45;
  const cpY = attachY - Math.cos(b.angle) * totalLen * 0.65;
  return { ax: attachX, ay: attachY, cx: cpX, cy: cpY, ex: endX, ey: endY, len: totalLen };
}

// ===== DATA OPS =====
function addBranch(name) {
  const count = state.branches.length;
  const side = count % 2 === 0 ? 1 : -1;
  const idx = Math.floor(count / 2);
  const angleDeg = 22 + idx * 16 + rand(-5, 5);
  const attachRatio = 0.88 - idx * 0.17;
  state.branches.push({
    id: gid(), name,
    angle: side * Math.min(angleDeg, 72) * Math.PI / 180,
    attachRatio: Math.max(0.22, attachRatio),
    baseLength: 110 + idx * 15 + rand(-10, 10),
    growthLength: 0, growthWidth: 0,
    tasks: [], goals: [], leaves: [], blooms: [], subBranches: []
  });
  saveState(); updateStats(); updateEmptyHint();
}

function deleteBranch(id) {
  state.branches = state.branches.filter(b => b.id !== id);
  saveState(); updateStats(); updateEmptyHint(); renderSoilPanel();
}

function updateBranchGrowth(b) {
  const n = b.leaves.length + b.blooms.length;
  b.growthLength = n * 7;
  b.growthWidth = Math.min(n * 0.4, 4.5);
}

function addTask(branchId, task) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  b.tasks.push({ ...task, id: gid(), completed: false, falling: false, t: 0.3 + Math.random() * 0.5 });
  addFeed('task', task.name, b.name);
  saveState(); renderSidePanel(); renderSoilPanel();
}

function completeTask(branchId, taskId) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  const task = b.tasks.find(t => t.id === taskId);
  if (!task || task.completed || task.falling) return;
  task.falling = true;
  // Find sky position
  const skyPos = getSkyPositions().find(p => p.type === 'task' && p.id === taskId);
  const path = getBranchPath(b);
  const leafPos = quadBezier(task.t, path.ax, path.ay, path.cx, path.cy, path.ex, path.ey);
  const colors = pick(LEAF_COLORS);
  if (skyPos) {
    fallingItems.push({
      type: 'task', branchId, itemId: taskId,
      startX: skyPos.x, startY: skyPos.y,
      targetX: leafPos.x, targetY: leafPos.y,
      progress: 0, color1: colors[0], color2: colors[1]
    });
  } else {
    // Fallback: complete immediately
    finishCompleteTask(b, task, leafPos, colors);
  }
  hideBubbleTip();
}

function finishCompleteTask(b, task, pos, colors) {
  task.completed = true; task.falling = false;
  b.leaves.push({
    id: gid(), sourceTaskId: task.id,
    x: pos.x, y: pos.y,
    color1: colors[0], color2: colors[1],
    size: 8 + task.weight * 2, angle: rand(0, Math.PI * 2)
  });
  spawnParticles(pos.x, pos.y, colors[0], 10);
  updateBranchGrowth(b);
  addFeed('leaf', task.name, b.name);
  saveState(); updateStats(); renderSoilPanel();
  showToast('任务完成！叶片已生长', 'success');
}

function addGoal(branchId, goal) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  b.goals.push({ ...goal, id: gid(), achieved: false, falling: false, t: 0.3 + Math.random() * 0.5 });
  addFeed('goal', goal.name, b.name);
  saveState(); renderSidePanel(); renderSoilPanel();
}

function completeGoal(branchId, goalId) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  const goal = b.goals.find(g => g.id === goalId);
  if (!goal || goal.achieved || goal.falling) return;
  goal.falling = true;
  const skyPos = getSkyPositions().find(p => p.type === 'goal' && p.id === goalId);
  const path = getBranchPath(b);
  const bloomPos = quadBezier(goal.t, path.ax, path.ay, path.cx, path.cy, path.ex, path.ey);
  const colors = pick(BLOOM_COLORS);
  if (skyPos) {
    fallingItems.push({
      type: 'goal', branchId, itemId: goalId,
      startX: skyPos.x, startY: skyPos.y,
      targetX: bloomPos.x, targetY: bloomPos.y,
      progress: 0, color1: colors[0], color2: colors[1]
    });
  } else {
    finishCompleteGoal(b, goal, bloomPos, colors);
  }
  hideBubbleTip();
}

function finishCompleteGoal(b, goal, pos, colors) {
  goal.achieved = true; goal.falling = false;
  b.blooms.push({
    id: gid(), sourceGoalId: goal.id,
    x: pos.x, y: pos.y,
    color1: colors[0], color2: colors[1],
    size: 10 + goal.weight * 3, petalCount: 5 + Math.floor(goal.priority)
  });
  spawnParticles(pos.x, pos.y, colors[0], 16);
  state.rainbows.push({ id: gid(), start: Date.now() });
  updateBranchGrowth(b);
  addFeed('bloom', goal.name, b.name);
  saveState(); updateStats(); renderSoilPanel();
  showToast('目标达成！花朵已绽放', 'achieve');
}

function changeLeafColor(branchId, leafId) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  const leaf = b.leaves.find(l => l.id === leafId);
  if (!leaf) return;
  const c = pick(LEAF_COLORS);
  leaf.color1 = c[0]; leaf.color2 = c[1];
  spawnParticles(leaf.x, leaf.y, c[0], 5);
  saveState();
}

function changeBloomColor(branchId, bloomId) {
  const b = state.branches.find(x => x.id === branchId);
  if (!b) return;
  const bloom = b.blooms.find(bl => bl.id === bloomId);
  if (!bloom) return;
  const c = pick(BLOOM_COLORS);
  bloom.color1 = c[0]; bloom.color2 = c[1];
  spawnParticles(bloom.x, bloom.y, c[0], 5);
  saveState();
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    state.particles.push({
      x, y, vx: rand(-2.5, 2.5), vy: rand(-3, -0.5),
      life: 1, decay: rand(0.015, 0.03),
      size: rand(2, 5), color
    });
  }
}

// ===== SUB-BRANCH =====
function addSubBranch(parentId, name) {
  const b = state.branches.find(x => x.id === parentId);
  if (!b) return;
  if (!b.subBranches) b.subBranches = [];
  b.subBranches.push({ name, leaves: [], blooms: [], leafCount: 0, bloomCount: 0 });
  addFeed('task', '子事项: ' + name, b.name);
  saveState(); renderSidePanel();
}

function addTaskToSubBranch(parentId, subIdx, task) {
  const b = state.branches.find(x => x.id === parentId);
  if (!b || !b.subBranches || !b.subBranches[subIdx]) return;
  const sb = b.subBranches[subIdx];
  const colors = pick(LEAF_COLORS);
  // Add as completed task on parent for tracking
  b.tasks.push({ ...task, id: gid(), completed: true, falling: false, t: 0.5 });
  // Add leaf to sub-branch
  sb.leaves.push({
    id: gid(), sourceTaskId: null,
    x: 0, y: 0,
    color1: colors[0], color2: colors[1],
    size: 6 + (task.weight || 3) * 1.5,
    angle: rand(0, Math.PI * 2)
  });
  sb.leafCount++;
  updateBranchGrowth(b);
  addFeed('leaf', task.name, b.name + ' > ' + sb.name);
  saveState(); updateStats(); renderSoilPanel();
  showToast('子事项叶片已生长', 'success');
}

function addGoalToSubBranch(parentId, subIdx, goal) {
  const b = state.branches.find(x => x.id === parentId);
  if (!b || !b.subBranches || !b.subBranches[subIdx]) return;
  const sb = b.subBranches[subIdx];
  const colors = pick(BLOOM_COLORS);
  b.goals.push({ ...goal, id: gid(), achieved: true, falling: false, t: 0.5 });
  sb.blooms.push({
    id: gid(), sourceGoalId: null,
    x: 0, y: 0,
    color1: colors[0], color2: colors[1],
    size: 7 + (goal.weight || 3) * 2,
    petalCount: 5 + Math.floor(goal.priority || 3)
  });
  sb.bloomCount++;
  updateBranchGrowth(b);
  addFeed('bloom', goal.name, b.name + ' > ' + sb.name);
  saveState(); updateStats(); renderSoilPanel();
  showToast('子事项花朵已绽放', 'achieve');
}

// ===== FEED =====
function addFeed(type, name, branchName) {
  state.feed.unshift({ type, name, branchName, time: Date.now() });
  if (state.feed.length > 50) state.feed.length = 50;
}

// ===== FALLING ANIMATION =====
function updateFalling() {
  fallingItems = fallingItems.filter(fi => {
    fi.progress += 0.025;
    if (fi.progress >= 1) {
      // Land on tree
      const b = state.branches.find(x => x.id === fi.branchId);
      if (fi.type === 'task') {
        const task = b?.tasks.find(t => t.id === fi.itemId);
        if (b && task) {
          const pos = { x: fi.targetX, y: fi.targetY };
          finishCompleteTask(b, task, pos, { c1: fi.color1, c2: fi.color2 });
        }
      } else {
        const goal = b?.goals.find(g => g.id === fi.itemId);
        if (b && goal) {
          const pos = { x: fi.targetX, y: fi.targetY };
          finishCompleteGoal(b, goal, pos, { c1: fi.color1, c2: fi.color2 });
        }
      }
      return false;
    }
    return true;
  });
}

function drawFalling() {
  fallingItems.forEach(fi => {
    // Ease out cubic
    const t = 1 - Math.pow(1 - fi.progress, 3);
    const x = fi.startX + (fi.targetX - fi.startX) * t;
    const y = fi.startY + (fi.targetY - fi.startY) * t;
    const r = 14 * (1 - fi.progress * 0.3);
    // Trail
    for (let i = 3; i > 0; i--) {
      const tt = Math.max(0, fi.progress - i * 0.03);
      const et = 1 - Math.pow(1 - tt, 3);
      const tx = fi.startX + (fi.targetX - fi.startX) * et;
      const ty = fi.startY + (fi.targetY - fi.startY) * et;
      ctx.beginPath();
      ctx.arc(tx, ty, r * (1 - i * 0.2), 0, Math.PI * 2);
      ctx.fillStyle = fi.type === 'task' ? `rgba(255,179,0,${0.15/i})` : `rgba(2,136,209,${0.15/i})`;
      ctx.fill();
    }
    // Main bubble
    const grad = ctx.createRadialGradient(x - r*0.25, y - r*0.25, r*0.1, x, y, r);
    if (fi.type === 'task') {
      grad.addColorStop(0, '#FFF59D');
      grad.addColorStop(1, '#FFB300');
    } else {
      grad.addColorStop(0, '#B3E5FC');
      grad.addColorStop(1, '#0288D1');
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 1 - fi.progress * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

// ===== RENDERING =====
function render() {
  animFrame++;
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  ctx.save();
  ctx.scale(dpr, dpr);

  drawBackground(w, h);
  drawSkyBubbles();
  drawTrunk();
  state.branches.forEach(b => drawBranch(b));
  state.rainbows = state.rainbows.filter(r => drawRainbow(r));
  updateFalling();
  drawFalling();
  drawParticles();
  if (hoveredTarget) canvas.style.cursor = 'pointer';
  else canvas.style.cursor = 'default';

  ctx.restore();
}

function drawBackground(w, h) {
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.25, '#B0E0F6');
  grad.addColorStop(0.55, '#e0f2fe');
  grad.addColorStop(0.75, '#d4edda');
  grad.addColorStop(1, '#c8e6c9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Clouds
  drawCloud(w * 0.15 + Math.sin(animFrame*0.003)*20, h*0.12, 0.8);
  drawCloud(w * 0.7 + Math.sin(animFrame*0.004+1)*25, h*0.08, 1.0);
  drawCloud(w * 0.45 + Math.sin(animFrame*0.002+2)*15, h*0.18, 0.6);

  // Ground above soil panel
  const groundTop = h - SOIL_HEIGHT;
  const gGrad = ctx.createLinearGradient(0, groundTop - 30, 0, groundTop);
  gGrad.addColorStop(0, '#86efac');
  gGrad.addColorStop(0.5, '#4ade80');
  gGrad.addColorStop(1, '#38a169');
  ctx.fillStyle = gGrad;
  ctx.beginPath();
  ctx.ellipse(w / 2, groundTop, w * 0.5, 35, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.arc(25, -5, 20, 0, Math.PI * 2);
  ctx.arc(-22, 2, 18, 0, Math.PI * 2);
  ctx.arc(12, -15, 18, 0, Math.PI * 2);
  ctx.arc(-10, -12, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTrunk() {
  const { cx, baseY, topY } = getTrunkGeom();
  const sway = Math.sin(animFrame * 0.008) * 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - TRUNK_WIDTH_BASE, baseY);
  ctx.quadraticCurveTo(cx - TRUNK_WIDTH_BASE * 0.7 + sway * 0.5, (baseY + topY) / 2, cx - TRUNK_WIDTH_TOP + sway, topY);
  ctx.lineTo(cx + TRUNK_WIDTH_TOP + sway, topY);
  ctx.quadraticCurveTo(cx + TRUNK_WIDTH_BASE * 0.7 + sway * 0.5, (baseY + topY) / 2, cx + TRUNK_WIDTH_BASE, baseY);
  ctx.closePath();
  const grad = ctx.createLinearGradient(cx - TRUNK_WIDTH_BASE, 0, cx + TRUNK_WIDTH_BASE, 0);
  grad.addColorStop(0, '#5D3A1A');
  grad.addColorStop(0.3, '#8B5E3C');
  grad.addColorStop(0.7, '#8B5E3C');
  grad.addColorStop(1, '#5D3A1A');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#4A2E12';
  ctx.lineWidth = 1;
  ctx.stroke();
  trunkRect = { x: cx - TRUNK_HIT_PAD, y: topY - 10, w: TRUNK_HIT_PAD * 2, h: baseY - topY + 20 };
}

function drawBranch(b) {
  const p = getBranchPath(b);
  const baseW = 4 + b.growthWidth;
  const tipW = 1.5 + b.growthWidth * 0.25;
  const steps = 30;
  const isHov = hoveredTarget && hoveredTarget.type === 'branch' && hoveredTarget.id === b.id;
  for (let i = 0; i < steps; i++) {
    const t0 = i/steps, t1 = (i+1)/steps;
    const p0 = quadBezier(t0, p.ax,p.ay,p.cx,p.cy,p.ex,p.ey);
    const p1 = quadBezier(t1, p.ax,p.ay,p.cx,p.cy,p.ex,p.ey);
    const w0 = baseW+(tipW-baseW)*t0, w1 = baseW+(tipW-baseW)*t1;
    ctx.beginPath();
    ctx.moveTo(p0.x,p0.y-w0/2); ctx.lineTo(p1.x,p1.y-w1/2);
    ctx.lineTo(p1.x,p1.y+w1/2); ctx.lineTo(p0.x,p0.y+w0/2);
    ctx.closePath();
    const grad = ctx.createLinearGradient(p0.x-w0,p0.y,p0.x+w0,p0.y);
    grad.addColorStop(0, isHov?'#a0845c':'#6B4423');
    grad.addColorStop(0.5, isHov?'#c4a878':'#9B7653');
    grad.addColorStop(1, isHov?'#a0845c':'#6B4423');
    ctx.fillStyle = grad; ctx.fill();
  }
  const lp = quadBezier(0.08, p.ax,p.ay,p.cx,p.cy,p.ex,p.ey);
  const nameOffX = b.angle > 0 ? 30 : -30;
  const nameOffY = -16;
  ctx.save();
  ctx.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = isHov ? '#2e4a2e' : '#5a7a5a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.name, lp.x + nameOffX, lp.y + nameOffY);
  ctx.restore();
  // Draw leaves scattered around branch
  const leafCount = b.leaves.length;
  const bloomCount = b.blooms.length;
  const allCount = leafCount + bloomCount;
  // Normal tangent for offset direction
  const dirX = p.ex - p.ax, dirY = p.ey - p.ay;
  const dirLen = Math.hypot(dirX, dirY) || 1;
  const normX = -dirY / dirLen, normY = dirX / dirLen;
  b.leaves.forEach((leaf, li) => {
    const t = 0.12 + (li / Math.max(allCount, 1)) * 0.8;
    const pos = quadBezier(t, p.ax, p.ay, p.cx, p.cy, p.ex, p.ey);
    // Deterministic scatter based on leaf index
    const seed = (li * 7 + 3) % 100 / 100;
    const scatterDist = 15 + seed * 35;
    const side = li % 2 === 0 ? 1 : -1;
    const sx = pos.x + normX * scatterDist * side + ((li * 13) % 11 - 5) * 0.6;
    const sy = pos.y + normY * scatterDist * side + ((li * 17) % 9 - 4) * 0.5;
    const hov = hoveredTarget && hoveredTarget.type === 'leaf' && hoveredTarget.id === leaf.id;
    drawLeaf(sx, sy, leaf.size, leaf.angle, leaf.color1, leaf.color2, hov);
  });
  // Draw blooms at their sequential position on branch (smaller size)
  b.blooms.forEach((bloom, bi) => {
    const t = 0.15 + ((bi + 0.5) / Math.max(bloomCount, 1)) * 0.7;
    const pos = quadBezier(t, p.ax, p.ay, p.cx, p.cy, p.ex, p.ey);
    const side = bi % 2 === 0 ? 1 : -1;
    const bx = pos.x + normX * 12 * side;
    const by = pos.y + normY * 12 * side;
    const hov = hoveredTarget && hoveredTarget.type === 'bloom' && hoveredTarget.id === bloom.id;
    drawBloom(bx, by, bloom.size, bloom.petalCount, bloom.color1, bloom.color2, hov);
  });
  // Draw sub-branches (after main leaves/blooms so they're visible)
  if (b.subBranches) {
    b.subBranches.forEach((sb, si) => {
      const sbAngle = b.angle + (si % 2 === 0 ? 1 : -1) * (0.25 + si * 0.12);
      const sbLen = Math.max(50, 40 + sb.leafCount * 6 + sb.bloomCount * 8);
      const sbStart = 0.25 + ((si + 1) / (b.subBranches.length + 1)) * 0.6;
      const startPos = quadBezier(sbStart, p.ax, p.ay, p.cx, p.cy, p.ex, p.ey);
      const sbEndX = startPos.x + Math.sin(sbAngle) * sbLen;
      const sbEndY = startPos.y - Math.cos(sbAngle) * sbLen;
      const sbCpX = startPos.x + Math.sin(sbAngle) * sbLen * 0.4;
      const sbCpY = startPos.y - Math.cos(sbAngle) * sbLen * 0.55;
      ctx.beginPath();
      ctx.moveTo(startPos.x, startPos.y);
      ctx.quadraticCurveTo(sbCpX, sbCpY, sbEndX, sbEndY);
      ctx.strokeStyle = '#8B6E4E';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Junction dot
      ctx.beginPath();
      ctx.arc(startPos.x, startPos.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7B5B3A';
      ctx.fill();
      const sbNormX = -(sbEndY - startPos.y);
      const sbNormY = sbEndX - startPos.x;
      const sbNormLen = Math.hypot(sbNormX, sbNormY) || 1;
      const snx = sbNormX / sbNormLen, sny = sbNormY / sbNormLen;
      sb.leaves.forEach((leaf, li) => {
        const lt = 0.2 + (li / Math.max(sb.leaves.length, 1)) * 0.7;
        const lx = startPos.x + (sbEndX - startPos.x) * lt + snx * (8 + (li % 3) * 10) * (li % 2 === 0 ? 1 : -1);
        const ly = startPos.y + (sbEndY - startPos.y) * lt + sny * (8 + (li % 3) * 10) * (li % 2 === 0 ? 1 : -1);
        drawLeaf(lx, ly, leaf.size, leaf.angle, leaf.color1, leaf.color2, false);
      });
      sb.blooms.forEach((bloom, bi) => {
        const bt = 0.3 + (bi / Math.max(sb.blooms.length, 1)) * 0.5;
        const bx2 = startPos.x + (sbEndX - startPos.x) * bt + snx * 10 * (bi % 2 === 0 ? 1 : -1);
        const by2 = startPos.y + (sbEndY - startPos.y) * bt + sny * 10 * (bi % 2 === 0 ? 1 : -1);
        drawBloom(bx2, by2, bloom.size * 0.8, bloom.petalCount, bloom.color1, bloom.color2, false);
      });
      ctx.save();
      ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#5a3a1a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(sb.name, (startPos.x + sbEndX) / 2 + snx * 18, (startPos.y + sbEndY) / 2 + sny * 18);
      ctx.restore();
    });
  }
}

function drawSkyBubbles() {
  const positions = getSkyPositions();
  positions.forEach(pos => {
    const r = calcBubbleRadius(pos.data.priority, pos.data.weight);
    const hov = hoveredTarget && hoveredTarget.type === pos.type && hoveredTarget.id === pos.id;
    if (pos.type === 'task') drawSunBubbleSky(pos.x, pos.y, r, pos.data.name, hov);
    else drawRainBubbleSky(pos.x, pos.y, r, pos.data.name, hov);
  });
}

function drawSunBubbleSky(x, y, r, name, hovered) {
  r = hovered ? r * 1.15 : r;
  const pulse = Math.sin(animFrame * 0.04 + x * 0.1) * 2;
  r += pulse;
  // Glow
  ctx.beginPath();
  ctx.arc(x, y, r + 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,213,79,0.15)';
  ctx.fill();
  // Body
  const grad = ctx.createRadialGradient(x - r*0.25, y - r*0.25, r*0.1, x, y, r);
  grad.addColorStop(0, '#FFF59D');
  grad.addColorStop(0.5, '#FFD54F');
  grad.addColorStop(1, '#FFB300');
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = hovered ? '#F57F17' : 'rgba(255,179,0,0.5)';
  ctx.lineWidth = hovered ? 2.5 : 1.5;
  ctx.stroke();
  // Shine
  ctx.beginPath();
  ctx.arc(x - r*0.25, y - r*0.3, r*0.22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
  // Name below
  ctx.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(121,85,72,0.9)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const dn = name.length > 8 ? name.slice(0,8)+'..' : name;
  ctx.fillText(dn, x, y + r + 5);
}

function drawRainBubbleSky(x, y, r, name, hovered) {
  r = hovered ? r * 1.15 : r;
  const pulse = Math.sin(animFrame * 0.035 + y * 0.1) * 2;
  r += pulse;
  ctx.beginPath();
  ctx.arc(x, y, r + 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(79,195,247,0.12)';
  ctx.fill();
  const grad = ctx.createRadialGradient(x - r*0.2, y - r*0.25, r*0.1, x, y, r);
  grad.addColorStop(0, '#B3E5FC');
  grad.addColorStop(0.5, '#4FC3F7');
  grad.addColorStop(1, '#0288D1');
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = hovered ? '#01579B' : 'rgba(2,136,209,0.4)';
  ctx.lineWidth = hovered ? 2.5 : 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x - r*0.2, y - r*0.3, r*0.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  ctx.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(13,71,161,0.9)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const dn = name.length > 8 ? name.slice(0,8)+'..' : name;
  ctx.fillText(dn, x, y + r + 5);
}

function drawLeaf(x, y, size, angle, c1, c2, hovered) {
  size = hovered ? size * 1.2 : size;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo(size*0.8,-size*0.6, size*0.6,size*0.5, 0, size);
  ctx.bezierCurveTo(-size*0.6,size*0.5, -size*0.8,-size*0.6, 0, -size);
  ctx.closePath();
  const grad = ctx.createLinearGradient(-size,-size,size,size);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = hovered ? '#166534' : 'rgba(22,101,52,0.3)';
  ctx.lineWidth = hovered ? 1.5 : 0.8; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -size*0.7); ctx.lineTo(0, size*0.7);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
}

function drawBloom(x, y, size, petalCount, c1, c2, hovered) {
  size = hovered ? size * 1.15 : size;
  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < petalCount; i++) {
    const a = (i/petalCount)*Math.PI*2 + animFrame*0.002;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, -size*0.5, size*0.3, size*0.5, 0, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(0,-size*0.4,0, 0,-size*0.5,size*0.5);
    grad.addColorStop(0, c1); grad.addColorStop(1, c2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, size*0.22, 0, Math.PI*2);
  ctx.fillStyle = '#FBBF24'; ctx.fill();
  if (hovered) { ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.restore();
}

function drawRainbow(rainbow) {
  const elapsed = Date.now() - rainbow.start;
  const progress = elapsed / RAINBOW_DURATION;
  if (progress >= 1) return false;
  let opacity;
  if (progress < 0.25) opacity = progress / 0.25;
  else if (progress > 0.7) opacity = (1 - progress) / 0.3;
  else opacity = 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  const colors = ['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#9400D3'];
  ctx.save();
  ctx.globalAlpha = opacity * 0.25;
  colors.forEach((c, i) => {
    ctx.beginPath();
    ctx.arc(w/2, h + 30, Math.max(w,h)*0.55 + i*22, Math.PI, 0);
    ctx.strokeStyle = c; ctx.lineWidth = 18; ctx.stroke();
  });
  ctx.restore();
  return true;
}

function drawParticles() {
  state.particles = state.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= p.decay;
    if (p.life <= 0) return false;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life * 0.8; ctx.fill(); ctx.globalAlpha = 1;
    return true;
  });
}

// ===== HIT DETECTION =====
function getHitTarget(mx, my) {
  // Check sky bubbles first
  const positions = getSkyPositions();
  for (const pos of positions) {
    const r = calcBubbleRadius(pos.data.priority, pos.data.weight) + 6;
    if (dist(mx, my, pos.x, pos.y) < r) {
      return { type: pos.type, id: pos.id, branchId: pos.branchId, x: pos.x, y: pos.y };
    }
  }
  // Leaves (scattered around branch) - use for loop to allow real return
  for (const b of state.branches) {
    const p = getBranchPath(b);
    const allCount = b.leaves.length + b.blooms.length;
    const dirX = p.ex - p.ax, dirY = p.ey - p.ay;
    const dirLen = Math.hypot(dirX, dirY) || 1;
    const normX = -dirY / dirLen, normY = dirX / dirLen;
    for (let li = 0; li < b.leaves.length; li++) {
      const leaf = b.leaves[li];
      const t = 0.12 + (li / Math.max(allCount, 1)) * 0.8;
      const pos = quadBezier(t, p.ax, p.ay, p.cx, p.cy, p.ex, p.ey);
      const seed = (li * 7 + 3) % 100 / 100;
      const scatterDist = 15 + seed * 35;
      const side = li % 2 === 0 ? 1 : -1;
      const sx = pos.x + normX * scatterDist * side + ((li * 13) % 11 - 5) * 0.6;
      const sy = pos.y + normY * scatterDist * side + ((li * 17) % 9 - 4) * 0.5;
      if (dist(mx, my, sx, sy) < leaf.size + 6) return { type: 'leaf', id: leaf.id, branchId: b.id, sx, sy };
    }
  }
  // Blooms (on branch)
  for (const b of state.branches) {
    const p = getBranchPath(b);
    const bloomCount = b.blooms.length;
    const dirX = p.ex - p.ax, dirY = p.ey - p.ay;
    const dirLen = Math.hypot(dirX, dirY) || 1;
    const normX = -dirY / dirLen, normY = dirX / dirLen;
    for (let bi = 0; bi < b.blooms.length; bi++) {
      const bloom = b.blooms[bi];
      const t = 0.15 + ((bi + 0.5) / Math.max(bloomCount, 1)) * 0.7;
      const pos = quadBezier(t, p.ax, p.ay, p.cx, p.cy, p.ex, p.ey);
      const side = bi % 2 === 0 ? 1 : -1;
      const bx = pos.x + normX * 12 * side;
      const by = pos.y + normY * 12 * side;
      if (dist(mx, my, bx, by) < bloom.size + 8) return { type: 'bloom', id: bloom.id, branchId: b.id, sx: bx, sy: by };
    }
  }
  // Branches
  for (const b of state.branches) {
    const p = getBranchPath(b);
    for (let i = 0; i < 20; i++) {
      const t0 = i/20, t1 = (i+1)/20;
      const p0 = quadBezier(t0, p.ax,p.ay,p.cx,p.cy,p.ex,p.ey);
      const p1 = quadBezier(t1, p.ax,p.ay,p.cx,p.cy,p.ex,p.ey);
      if (ptSegDist(mx, my, p0.x, p0.y, p1.x, p1.y) < BRANCH_HIT_PAD) return { type: 'branch', id: b.id, branch: b };
    }
  }
  // Trunk
  const t = trunkRect;
  if (t.x !== undefined && mx >= t.x && mx <= t.x+t.w && my >= t.y && my <= t.y+t.h) return { type: 'trunk' };
  return null;
}

// ===== BUBBLE TIP =====
function showBubbleTip(target) {
  tipTarget = target;
  const tip = document.getElementById('bubbleTip');
  const title = document.getElementById('tipTitle');
  const info = document.getElementById('tipInfo');
  const branch = document.getElementById('tipBranch');
  const btn = document.getElementById('tipBtn');

  const b = state.branches.find(x => x.id === target.branchId);
  if (!b) return;

  let data;
  if (target.type === 'task') {
    data = b.tasks.find(t => t.id === target.id);
  } else {
    data = b.goals.find(g => g.id === target.id);
  }
  if (!data) return;

  title.textContent = data.name;
  let infoText = '';
  if (data.frequency) infoText += '频率：' + (FREQ_LABELS[data.frequency] || data.frequency) + '  ';
  if (data.priority) infoText += '优先级：' + data.priority + '  ';
  if (data.weight) infoText += '权重：' + data.weight;
  const dl = deadlineStr(data.deadline);
  if (dl) infoText += '\n' + dl;
  info.textContent = infoText;
  info.style.whiteSpace = 'pre-line';
  branch.textContent = '所属事项：' + b.name;

  btn.className = 'btn-complete ' + (target.type === 'task' ? 'sun-btn' : 'rain-btn');
  btn.textContent = target.type === 'task' ? '完成任务' : '实现目标';

  // Position
  let left = target.x + 20;
  let top = target.y - 20;
  if (left + 220 > window.innerWidth) left = target.x - 230;
  if (top + 160 > window.innerHeight - SOIL_HEIGHT) top = window.innerHeight - SOIL_HEIGHT - 170;
  if (top < TOP_BAR_H + 10) top = TOP_BAR_H + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.classList.add('show');
}

function hideBubbleTip() {
  document.getElementById('bubbleTip').classList.remove('show');
  tipTarget = null;
}

function showLeafBloomTip(target, type) {
  const b = state.branches.find(x => x.id === target.branchId);
  if (!b) return;
  const tip = document.getElementById('bubbleTip');
  const title = document.getElementById('tipTitle');
  const info = document.getElementById('tipInfo');
  const branch = document.getElementById('tipBranch');
  const btn = document.getElementById('tipBtn');

  let name = '', detail = '';
  if (type === 'leaf') {
    const leaf = b.leaves.find(l => l.id === target.id);
    if (!leaf) return;
    const srcTask = leaf.sourceTaskId ? b.tasks.find(t => t.id === leaf.sourceTaskId) : null;
    name = srcTask ? srcTask.name : '已完成任务（演示数据）';
    detail = '所属事项：' + b.name;
    if (srcTask) {
      detail += '\n频率：' + (FREQ_LABELS[srcTask.frequency] || srcTask.frequency || '未知');
      detail += '\n优先级：' + (srcTask.priority || '-') + '  权重：' + (srcTask.weight || '-');
      if (srcTask.deadline) detail += '\n' + deadlineStr(srcTask.deadline);
    }
  } else {
    const bloom = b.blooms.find(bl => bl.id === target.id);
    if (!bloom) return;
    const srcGoal = bloom.sourceGoalId ? b.goals.find(g => g.id === bloom.sourceGoalId) : null;
    name = srcGoal ? srcGoal.name : '已达成目标（演示数据）';
    detail = '所属事项：' + b.name;
    if (srcGoal) {
      detail += '\n优先级：' + (srcGoal.priority || '-') + '  权重：' + (srcGoal.weight || '-');
      if (srcGoal.deadline) detail += '\n' + deadlineStr(srcGoal.deadline);
    }
  }

  title.textContent = name;
  info.textContent = detail;
  info.style.whiteSpace = 'pre-line';
  branch.textContent = '所属事项：' + b.name;
  btn.style.display = 'none';

  let left = target.sx !== undefined ? target.sx + 20 : 200;
  let top = target.sy !== undefined ? target.sy - 20 : 200;
  if (left + 220 > window.innerWidth) left = left - 240;
  if (top + 160 > window.innerHeight - SOIL_HEIGHT) top = window.innerHeight - SOIL_HEIGHT - 170;
  if (top < TOP_BAR_H + 10) top = TOP_BAR_H + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.classList.add('show');
  tipJustOpened = true;
}

let tipJustOpened = false;
function completeFromTip() {
  if (!tipTarget) return;
  if (tipTarget.type === 'task') completeTask(tipTarget.branchId, tipTarget.id);
  else completeGoal(tipTarget.branchId, tipTarget.id);
  tipTarget = null;
}

// ===== INTERACTION =====
function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas = document.getElementById('treeCanvas');
ctx = canvas.getContext('2d');

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

canvas.addEventListener('mousemove', e => {
  const { x, y } = getMousePos(e);
  if (dragBranch && mouseDownPos && dist(mouseDownPos.x, mouseDownPos.y, x, y) > DRAG_THRESHOLD) isDragging = true;
  if (isDragging && dragBranch) {
    const { cx, baseY, topY } = getTrunkGeom();
    const attachY = topY + (baseY - topY) * (1 - dragBranch.attachRatio);
    const dx = x - cx, dy = attachY - y;
    if (dy > 10) { dragBranch.angle = clamp(Math.atan2(dx, dy), -1.2, 1.2); saveState(); }
    canvas.style.cursor = 'grabbing'; return;
  }
  hoveredTarget = getHitTarget(x, y);
  if (!hoveredTarget) canvas.style.cursor = 'default';
});

canvas.addEventListener('mousedown', e => {
  const { x, y } = getMousePos(e);
  mouseDownPos = { x, y };
  const target = getHitTarget(x, y);
  if (target && target.type === 'branch') { dragBranch = target.branch; isDragging = false; }
});

canvas.addEventListener('mouseup', () => { isDragging = false; dragBranch = null; mouseDownPos = null; });
canvas.addEventListener('mouseleave', () => { hoveredTarget = null; isDragging = false; dragBranch = null; mouseDownPos = null; hideBubbleTip(); });

canvas.addEventListener('click', e => {
  if (isDragging) { isDragging = false; return; }
  const { x, y } = getMousePos(e);
  hideContextMenu();
  const target = getHitTarget(x, y);
  if (!target) { hideBubbleTip(); return; }
  switch (target.type) {
    case 'trunk':
      hideBubbleTip();
      openModal('branchModal');
      setTimeout(() => document.getElementById('branchNameInput').focus(), 100);
      break;
    case 'branch':
      hideBubbleTip();
      showContextMenu(x, y, target.branch);
      break;
    case 'task':
      completeTask(target.branchId, target.id);
      break;
    case 'goal':
      completeGoal(target.branchId, target.id);
      break;
    case 'leaf':
      showLeafBloomTip(target, 'leaf');
      break;
    case 'bloom':
      showLeafBloomTip(target, 'bloom');
      break;
  }
});

}

let menuJustOpened = false;
document.addEventListener('click', e => {

function confirmAddGoal() {

  const name = document.getElementById('subBranchNameInput').value.trim();

function toggleSidePanel() {

  p.classList.toggle('collapsed'); b.classList.toggle('shifted');
  b.innerHTML = p.classList.contains('collapsed') ? '&gt;' : '&lt;';

function renderSidePanel() {
  const list = document.getElementById('branchList');
  if (state.branches.length === 0) { list.innerHTML = '<p style="font-size:0.8rem;color:#aaa;text-align:center;padding:20px 0">暂无事项</p>'; return; }
  list.innerHTML = state.branches.map(b => {
    const at = b.tasks.filter(t => !t.completed).length;
    const ag = b.goals.filter(g => !g.achieved).length;
    let th = at ? `<div style="font-size:0.72rem;color:#92400e;margin-top:4px">待完成任务 ${at}</div>` : '';
    let gh = ag ? `<div style="font-size:0.72rem;color:#1e3a5f;margin-top:2px">待达成目标 ${ag}</div>` : '';
    return `<div class="branch-item">
      <h4>${esc(b.name)}</h4>
      <p>叶 ${b.leaves.length} | 花 ${b.blooms.length}</p>
      ${th}${gh}
      <div class="branch-actions">
        <button class="btn-add-task" onclick="contextBranchId='${b.id}';openTaskModal()">+ 任务</button>
        <button class="btn-add-goal" onclick="contextBranchId='${b.id}';openGoalModal()">+ 目标</button>
        <button style="padding:3px 8px;border-radius:6px;font-size:0.72rem;font-weight:600;cursor:pointer;border:none;background:#f3e8ff;color:#7c3aed" onclick="contextBranchId='${b.id}';promptSubBranch()">+ 子事项</button>
        <button class="btn-del-branch" onclick="deleteTargetId='${b.id}';document.getElementById('deleteMsg').textContent='确定要删除「${esc(b.name)}」吗？';openModal('deleteModal')">删除</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== SOIL PANEL =====
function switchSoilTab(tab) {
  currentSoilTab = tab;
  document.querySelectorAll('.soil-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('todoView').style.display = tab === 'todo' ? '' : 'none';
  document.getElementById('feedView').style.display = tab === 'feed' ? '' : 'none';
  renderSoilPanel();
}

function renderSoilPanel() {
  // Todo view
  const todoEl = document.getElementById('todoView');
  const allTodos = [];
  state.branches.forEach(b => {
    b.tasks.filter(t => !t.completed).forEach(t => allTodos.push({ type:'task', name:t.name, branch:b.name, id:t.id, branchId:b.id, deadline:t.deadline, priority:t.priority }));
    b.goals.filter(g => !g.achieved).forEach(g => allTodos.push({ type:'goal', name:g.name, branch:b.name, id:g.id, branchId:b.id, deadline:g.deadline, priority:g.priority }));
  });
  // Sort by priority desc
  allTodos.sort((a, b) => (b.priority || 3) - (a.priority || 3));

  if (allTodos.length === 0) {
    todoEl.innerHTML = '<div class="soil-section-title">待办清单</div><p style="font-size:0.82rem;color:rgba(255,255,255,0.3);padding:10px 0">暂无待办事项</p>';
  } else {
    todoEl.innerHTML = '<div class="soil-section-title">待办清单（' + allTodos.length + '）</div>' +
      allTodos.map(item => {
        const dl = item.deadline ? deadlineStr(item.deadline) : '';
        const dlStyle = dl && dl.includes('逾期') ? 'color:#fca5a5;' : 'color:rgba(255,255,255,0.4);';
        return `<div class="todo-item" data-action="${item.type === 'task' ? 'completeTask' : 'completeGoal'}" data-branch="${item.branchId}" data-item="${item.id}">
          <span class="todo-dot ${item.type === 'task' ? 'sun' : 'rain'}"></span>
          <span class="todo-name">${esc(item.name)}${dl ? ' <span style="font-size:0.7rem;'+dlStyle+'">'+dl+'</span>' : ''}</span>
          <span class="todo-branch-tag">${esc(item.branch)}</span>
        </div>`;
      }).join('');
  }

  // Feed view
  const feedEl = document.getElementById('feedView');
  if (state.feed.length === 0) {
    feedEl.innerHTML = '<div class="soil-section-title">动态</div><p style="font-size:0.82rem;color:rgba(255,255,255,0.3);padding:10px 0">暂无动态</p>';
  } else {
    const iconMap = { task:'fi-task', goal:'fi-goal', leaf:'fi-leaf', bloom:'fi-bloom' };
    const labelMap = { task:'发布任务', goal:'设定目标', leaf:'完成任务', bloom:'达成目标' };
    const emojiMap = { task:'T', goal:'G', leaf:'L', bloom:'B' };
    feedEl.innerHTML = '<div class="soil-section-title">动态</div>' +
      state.feed.slice(0, 30).map(f =>
        `<div class="feed-item">
          <span class="feed-icon ${iconMap[f.type] || 'fi-task'}">${emojiMap[f.type] || '?'}</span>
          <div>
            <div class="feed-text"><strong>${labelMap[f.type] || ''}</strong> ${esc(f.name)}<span style="color:rgba(255,255,255,0.3);margin-left:6px">${esc(f.branchName)}</span></div>
            <div class="feed-time">${formatTime(f.time)}</div>
          </div>
        </div>`
      ).join('');
  }
}

// Event delegation for soil panel
document.getElementById('soilContent').addEventListener('click', e => {
  const row = e.target.closest('.todo-item[data-action]');
  if (!row) return;
  const action = row.dataset.action;
  const branchId = row.dataset.branch;
  const itemId = row.dataset.item;
  if (action === 'completeTask') completeTask(branchId, itemId);
  else if (action === 'completeGoal') completeGoal(branchId, itemId);
});

// Event delegation for side panel
document.getElementById('branchList').addEventListener('click', e => {
  const row = e.target.closest('.item-row[data-action]');
  if (!row) return;
  const action = row.dataset.action;
  const branchId = row.dataset.branch;
  const itemId = row.dataset.item;
  if (action === 'completeTask') completeTask(branchId, itemId);
  else if (action === 'completeGoal') completeGoal(branchId, itemId);
});

// ===== PERSISTENCE =====
function saveState() {
  const data = { branches: state.branches, feed: state.feed, nextId: state.nextId };
  localStorage.setItem('multilife_tree', JSON.stringify(data));
}

function loadState() {
  try {
    const raw = localStorage.getItem('multilife_tree');
    if (!raw) return;
    const data = JSON.parse(raw);
    state.branches = data.branches || [];
    state.feed = data.feed || [];
    state.nextId = data.nextId || 1;
    // Migration: ensure falling flags
    state.branches.forEach(b => {
      b.tasks.forEach(t => { if (t.falling === undefined) t.falling = false; });
      b.goals.forEach(g => { if (g.falling === undefined) g.falling = false; });
      if (!b.subBranches) b.subBranches = [];
    });
  } catch (e) { console.warn('Failed to load state:', e); }
}

// ===== ANIMATION LOOP =====
function animate() { render(); requestAnimationFrame(animate); }

function generateDemoData() {
  if (state.branches.length > 0) return; // Only generate if empty
  const branchNames = ['学习', '工作', '健康', '副业', '社交'];
  const taskNames = [
    '背单词','刷算法题','看技术文档','写周报','开早会',
    '跑步30分钟','冥想10分钟','做早餐','读书一章','整理笔记',
    '练吉他','画速写','写日记','学英语口语','做瑜伽',
    '复习数据结构','写博客','听播客','练书法','打扫房间',
    '准备面试','学习PPT','锻炼核心','看纪录片','背古诗词',
    '整理书桌','规划下周','学新框架','写单元测试','代码评审'
  ];
  const goalNames = [
    '通过英语六级','升职加薪','跑完半马','副业月入5000','读完10本书',
    '学会游泳','拿到驾照','发表论文','完成项目上线','减重10斤',
    '学完日语N3','吉他弹唱一首歌','坚持早起30天','拿到奖学金','公众号涨粉1000',
    '完成马拉松','理财收益10%','学会做10道菜','写完毕业论文','参加技术大会'
  ];
  const freqs = ['once','daily','weekly','monthly','longterm'];

  branchNames.forEach((name, bi) => {
    const count = state.branches.length;
    const side = count % 2 === 0 ? 1 : -1;
    const idx = Math.floor(count / 2);
    const angleDeg = 22 + idx * 16 + (bi % 3 - 1) * 3;
    const attachRatio = 0.88 - idx * 0.17;
    const branch = {
      id: gid(), name,
      angle: side * Math.min(angleDeg, 72) * Math.PI / 180,
      attachRatio: Math.max(0.22, attachRatio),
      baseLength: 110 + idx * 15 + (bi % 5 - 2) * 5,
      growthLength: 0, growthWidth: 0,
      tasks: [], goals: [], leaves: [], blooms: []
    };
    state.branches.push(branch);
  });

  // Add 20 completed tasks per branch = 100 leaves (with sourceTaskId for info display)
  let taskIdx = 0;
  state.branches.forEach(b => {
    for (let i = 0; i < 20; i++) {
      const tName = taskNames[taskIdx % taskNames.length];
      taskIdx++;
      const colors = pick(LEAF_COLORS);
      const taskId = gid();
      b.tasks.push({ name: tName, id: taskId, completed: true, falling: false, t: 0.5, frequency: freqs[i % 5], priority: 1 + (i % 5), weight: 1 + (i % 5), deadline: null });
      b.leaves.push({
        id: gid(), sourceTaskId: taskId,
        x: 0, y: 0,
        color1: colors[0], color2: colors[1],
        size: 7 + Math.floor(Math.random() * 6),
        angle: Math.random() * Math.PI * 2
      });
    }
  });

  // Add 4 blooms per branch = 20 flowers (with sourceGoalId)
  let goalIdx = 0;
  state.branches.forEach(b => {
    for (let i = 0; i < 4; i++) {
      const gName = goalNames[goalIdx % goalNames.length];
      goalIdx++;
      const colors = pick(BLOOM_COLORS);
      const goalId = gid();
      b.goals.push({ name: gName, id: goalId, achieved: true, falling: false, t: 0.5, priority: 3 + (i % 3), weight: 3 + (i % 3), deadline: null });
      b.blooms.push({
        id: gid(), sourceGoalId: goalId,
        x: 0, y: 0,
        color1: colors[0], color2: colors[1],
        size: 10 + Math.floor(Math.random() * 8),
        petalCount: 5 + Math.floor(Math.random() * 4)
      });
    }
    updateBranchGrowth(b);
  });

  // Add a demo sub-branch on '学习' branch
  const studyBranch = state.branches[0];
  studyBranch.subBranches = [{ name: '英语', leaves: [], blooms: [], leafCount: 3, bloomCount: 1 }];
  const sb = studyBranch.subBranches[0];
  for (let i = 0; i < 3; i++) {
    const c = pick(LEAF_COLORS);
    sb.leaves.push({ id: gid(), sourceTaskId: null, x: 0, y: 0, color1: c[0], color2: c[1], size: 6 + i, angle: rand(0, Math.PI * 2) });
  }
  const bc = pick(BLOOM_COLORS);
  sb.blooms.push({ id: gid(), sourceGoalId: null, x: 0, y: 0, color1: bc[0], color2: bc[1], size: 8, petalCount: 6 });

  // Add 2 active tasks in sky
  const b0 = state.branches[0];
  b0.tasks.push({ name: '阅读30分钟', id: gid(), completed: false, falling: false, t: 0.4, frequency: 'daily', priority: 3, weight: 3, deadline: null });
  b0.tasks.push({ name: '背50个单词', id: gid(), completed: false, falling: false, t: 0.6, frequency: 'daily', priority: 4, weight: 4, deadline: null });

  // Add 1 active goal in sky
  b0.goals.push({ name: '本月读完3本书', id: gid(), achieved: false, falling: false, t: 0.8, priority: 5, weight: 5, deadline: '2026-07-31' });

  saveState();
}

function init() { loadState(); generateDemoData(); updateStats(); updateEmptyHint(); animate(); }
init();
</script>
