<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>职途智引 · 职业咨询</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

:root {
  --bg: #0a0e1a; --bg-card: rgba(17,24,44,0.85); --bg-input: rgba(99,102,241,0.06);
  --fg: #e8ecf4; --fg-muted: #7a869a; --fg-dim: #4a5568;
  --accent: #8b5cf6; --accent-glow: rgba(139,92,246,0.35);
  --accent2: #38bdf8; --accent3: #34d399; --accent4: #f59e0b; --accent5: #ec4899;
  --border: rgba(99,102,241,0.15); --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

.bg-atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.bg-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.08; }
.bg-orb.o1 { width: 550px; height: 550px; background: #8b5cf6; top: -180px; left: -100px; }
.bg-orb.o2 { width: 450px; height: 450px; background: #ec4899; bottom: -120px; right: -80px; }

.container { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 40px 32px; }

header { margin-bottom: 28px; }
header h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
header p { font-size: 15px; color: var(--fg-muted); }

.chat-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: 700px; display: flex; flex-direction: column; backdrop-filter: blur(20px); }

.chat-header { padding: 20px 24px; background: rgba(139,92,246,0.05); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.chat-title { font-size: 15px; font-weight: 700; }
.chat-subtitle { font-size: 12px; color: var(--fg-muted); }

.chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

.message { display: flex; gap: 12px; animation: fadeIn 0.4s ease-out; }
.message.user { flex-direction: row-reverse; }
.message-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.message-avatar.coach { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
.message-avatar.user { background: rgba(56,189,248,0.2); color: var(--accent2); }

.message-body { max-width: 75%; }
.message.bot .message-body { background: rgba(139,92,246,0.06); border: 1px solid rgba(139,92,246,0.15); border-radius: 0 16px 16px 16px; padding: 16px 20px; }
.message.user .message-body { background: var(--accent); border-radius: 16px 0 16px 16px; padding: 16px 20px; color: #fff; }

.message-text { font-size: 14px; line-height: 1.8; }

.think-step { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(99,102,241,0.06); border-radius: 10px; margin-bottom: 6px; font-size: 12px; }
.think-step .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.think-step .step-text { color: var(--fg-muted); }
.think-step.done .step-num { background: var(--accent3); }
.think-step.done .step-text { color: var(--accent3); }

.chat-input-area { padding: 20px; border-top: 1px solid var(--border); }
.input-row { display: flex; gap: 12px; }
.chat-input { flex: 1; padding: 14px 20px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); font-size: 14px; font-family: inherit; outline: none; transition: all 0.3s; }
.chat-input:focus { border-color: var(--accent); }
.send-btn { padding: 14px 28px; background: var(--accent); border: none; border-radius: 14px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }

.suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.suggest-btn { padding: 8px 16px; background: rgba(139,92,246,0.06); border: 1px solid var(--border); border-radius: 20px; color: var(--fg-muted); font-size: 12px; cursor: pointer; transition: all 0.3s; }
.suggest-btn:hover { border-color: var(--accent); color: var(--accent); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
  .message-body { max-width: 85%; }
}
</style>
</head>
<body>

  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(99, 102, 241, 0.15);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 12px 32px;

.nav-brand {

<script>

  var path = window.location.pathname;
  var filename = path.substring(path.lastIndexOf('/') + 1);
  var pageMap = {
    'demo-career-home.html': 'home',
    'demo-career-profile.html': 'profile',
    'demo-career-assessment.html': 'assessment',

<div class="bg-atmosphere">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
</div>

<div class="container">
  <header>
    <h1>💬 职业咨询</h1>
    <p>AI教练模式，5步思考流程：意图识别 → 职业档案读取 → 查询优化 → 知识检索 → 答案生成</p>
  </header>

  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-avatar">👩‍🏫</div>
      <div>
        <div class="chat-title">职业规划教练</div>
        <div class="chat-subtitle">基于你的职业档案，为你提供专业的职业咨询</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="message-avatar coach">👩‍🏫</div>
        <div class="message-body">
          <div class="message-text">你好！我是你的职业规划教练。我可以帮助你：<br><br>
            • 分析职业发展方向<br>
            • 解答职业困惑<br>
            • 提供转型建议<br>
            • 规划学习路径<br><br>
            我已经读取了你的职业档案，包括测评结果和简历分析。请问有什么可以帮你的？</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入你的职业问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">发送</button>
      </div>
      <div class="suggestions">
        <button class="suggest-btn" onclick="sendQuick('我适合做什么工作？')">我适合做什么工作？</button>
        <button class="suggest-btn" onclick="sendQuick('护士如何转型？')">护士如何转型？</button>
        <button class="suggest-btn" onclick="sendQuick('如何提升竞争力？')">如何提升竞争力？</button>
        <button class="suggest-btn" onclick="sendQuick('推荐学习路径')">推荐学习路径</button>
      </div>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    q: '我适合做什么工作？',
    answer: '基于你的职业档案分析，以下是适合你的工作方向：<br><br>【高度匹配】<br>• 护理专家 — 你的护理专业背景和三甲医院经验非常契合<br>• 专科护士 — ICU/急诊/手术室等方向<br><br>【合理转型】<br>• 健康管理师 — 大健康领域正在快速发展<br>• 医疗质量经理 — 需要质量管理和流程优化能力<br><br>【挑战突破】<br>• 医疗信息化 — 将护理经验与技术结合<br><br>建议：先完成完整测评，获取更精准的推荐。'
  },
  {
    q: '护士如何转型？',
    answer: '护士转型有多种方向可以选择：<br><br>【大健康方向】<br>• 健康管理师：考取证书，学习营养学和慢病管理<br>• 康复治疗师：补充康复医学知识<br>• 养老护理专家：银发经济需求旺盛<br><br>【医疗管理方向】<br>• 护理管理：护士长→护理部主任<br>• 医疗质量：JCI认证、流程优化<br>• 医院运营：行政管理岗位<br><br>【跨界方向】<br>• 医疗信息化：学习IT技能<br>• 医药代表：利用专业知识<br>• 医学教育：院校或培训机构<br><br>建议：结合你的职业价值观（社交导向），健康管理和护理管理是比较适合的方向。'
  },
  {
    q: '如何提升竞争力？',
    answer: '提升竞争力需要系统性规划：<br><br>【短期（0-1年）】<br>• 考取专科护士认证（ICU/急诊等）<br>• 发表1-2篇学术论文<br>• 掌握循证护理方法<br><br>【中期（1-3年）】<br>• 晋升主管护师职称<br>• 承担临床教学任务<br>• 主导护理科研课题<br><br>【长期（3-5年）】<br>• 晋升主任护师<br>• 建立个人专业品牌<br>• 推动学科创新发展<br><br>【通用建议】<br>• 保持学习心态，关注行业趋势<br>• 建立人脉网络<br>• 积累管理经验'
  },
  {
    q: '推荐学习路径',
    answer: '根据你的目标，推荐以下学习路径：<br><br>【护理专家路线】<br>1. 专科护士培训（6个月）<br>2. 护理管理课程（3个月）<br>3. 循证护理学习（3个月）<br>4. 科研方法学习（6个月）<br><br>【健康管理师路线】<br>1. 健康管理师资格考试（3个月）<br>2. 营养学基础（3个月）<br>3. 慢病管理培训（3个月）<br>4. 健康评估实践（6个月）<br><br>【通用技能】<br>• 沟通技巧提升<br>• 项目管理基础<br>• 数据分析入门<br><br>建议：选择一条主路径，同时学习通用技能。'
  }
];

function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const chat = document.getElementById('chatMessages');
  chat.innerHTML += `
    <div class="message user">
      <div class="message-avatar user">👤</div>
      <div class="message-body"><div class="message-text">${msg}</div></div>
    </div>
    <div class="message bot">
      <div class="message-avatar coach">👩‍🏫</div>
      <div class="message-body">
        <div class="think-step"><span class="step-num">1</span><span class="step-text">意图识别中...</span></div>
      </div>
    </div>
  `;

  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  // 模拟5步思考流程
  setTimeout(() => {
    chat.lastElementChild.querySelector('.message-body').innerHTML = `
      <div class="think-step done"><span class="step-num">1</span><span class="step-text">意图识别：理解用户需求</span></div>
      <div class="think-step"><span class="step-num">2</span><span class="step-text">读取职业档案...</span></div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }, 500);

  setTimeout(() => {
    chat.lastElementChild.querySelector('.message-body').innerHTML = `
      <div class="think-step done"><span class="step-num">1</span><span class="step-text">意图识别：理解用户需求</span></div>
      <div class="think-step done"><span class="step-num">2</span><span class="step-text">职业档案读取：高俊，护理专业，三甲医院</span></div>
      <div class="think-step"><span class="step-num">3</span><span class="step-text">查询优化中...</span></div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }, 1000);

  setTimeout(() => {
    chat.lastElementChild.querySelector('.message-body').innerHTML = `
      <div class="think-step done"><span class="step-num">1</span><span class="step-text">意图识别：理解用户需求</span></div>
      <div class="think-step done"><span class="step-num">2</span><span class="step-text">职业档案读取：高俊，护理专业，三甲医院</span></div>
      <div class="think-step done"><span class="step-num">3</span><span class="step-text">查询优化：结合测评结果（现实型80分）</span></div>
      <div class="think-step"><span class="step-num">4</span><span class="step-text">知识检索中...</span></div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }, 1500);

  setTimeout(() => {
    chat.lastElementChild.querySelector('.message-body').innerHTML = `
      <div class="think-step done"><span class="step-num">1</span><span class="step-text">意图识别：理解用户需求</span></div>
      <div class="think-step done"><span class="step-num">2</span><span class="step-text">职业档案读取：高俊，护理专业，三甲医院</span></div>
      <div class="think-step done"><span class="step-num">3</span><span class="step-text">查询优化：结合测评结果（现实型80分）</span></div>
      <div class="think-step done"><span class="step-num">4</span><span class="step-text">知识检索：从知识库获取相关信息</span></div>
      <div class="think-step"><span class="step-num">5</span><span class="step-text">生成答案...</span></div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }, 2000);

  setTimeout(() => {
    const match = questions.find(q => msg.includes(q.q) || q.q.includes(msg));
    const answer = match ? match.answer : '感谢你的提问！基于你的职业档案，我为你分析如下：<br><br>你的核心优势是护理专业背景和三甲医院工作经验。根据霍兰德测评，你属于现实型(R)，动手能力强，注重实际。建议你：<br><br>1. 深耕护理专业，成为专科护理专家<br>2. 考虑转型健康管理领域<br>3. 如果对管理感兴趣，可以向护士长方向发展';
    
    chat.lastElementChild.querySelector('.message-body').innerHTML = `<div class="message-text">${answer}</div>`;
    chat.scrollTop = chat.scrollHeight;
  }, 2500);
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}
</script>

</body>
