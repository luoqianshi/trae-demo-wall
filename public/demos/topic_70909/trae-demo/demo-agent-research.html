<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职途智引 · Agent 调研</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

:root {
  --bg: #0a0e1a; --bg-card: rgba(17,24,44,0.85); --bg-input: rgba(99,102,241,0.06);
  --fg: #e8ecf4; --fg-muted: #7a869a; --fg-dim: #4a5568;
  --accent: #6366f1; --accent-glow: rgba(99,102,241,0.35);
  --accent2: #38bdf8; --accent3: #34d399; --accent4: #f59e0b; --accent5: #ec4899;
  --border: rgba(99,102,241,0.15); --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

.bg-atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.bg-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.08; }
.bg-orb.o1 { width: 600px; height: 600px; background: #7c3aed; top: -200px; right: -100px; }
.bg-orb.o2 { width: 500px; height: 500px; background: #ec4899; bottom: -150px; left: -80px; }

.container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 32px; }

header { margin-bottom: 32px; }
header h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
header p { font-size: 15px; color: var(--fg-muted); }

.chat-area { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: 600px; display: flex; flex-direction: column; backdrop-filter: blur(20px); }

.chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.message { display: flex; gap: 12px; animation: fadeIn 0.4s ease-out; }
.message.user { flex-direction: row-reverse; }
.message-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.message-avatar.bot { background: linear-gradient(135deg, var(--accent), #7c3aed); }
.message-avatar.user { background: rgba(56,189,248,0.2); color: var(--accent2); }
.message-body { max-width: 70%; padding: 14px 18px; border-radius: var(--radius); }
.message.bot .message-body { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.15); }
.message.user .message-body { background: var(--accent); color: #fff; }
.message-text { font-size: 14px; line-height: 1.7; }
.message-time { font-size: 11px; color: var(--fg-dim); margin-top: 6px; }

.chat-input-area { padding: 20px; border-top: 1px solid var(--border); }
.input-row { display: flex; gap: 12px; }
.chat-input { flex: 1; padding: 14px 20px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); font-size: 14px; font-family: inherit; outline: none; transition: all 0.3s; }
.chat-input:focus { border-color: var(--accent); }
.send-btn { padding: 14px 28px; background: var(--accent); border: none; border-radius: 14px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.quick-questions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.quick-btn { padding: 8px 16px; background: rgba(99,102,241,0.06); border: 1px solid var(--border); border-radius: 20px; color: var(--fg-muted); font-size: 12px; cursor: pointer; transition: all 0.3s; }
.quick-btn:hover { border-color: var(--accent); color: var(--accent); }

.agent-info { display: flex; align-items: center; gap: 16px; padding: 16px 24px; background: rgba(99,102,241,0.04); border-bottom: 1px solid var(--border); }
.agent-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.agent-name { font-size: 15px; font-weight: 700; }
.agent-desc { font-size: 12px; color: var(--fg-muted); }

.thinking-dots { display: flex; gap: 4px; }
.thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.4s infinite ease-in-out both; }
.thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
.thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

@media (max-width: 768px) {
  .message-body { max-width: 85%; }
}
</style>
</head>
<body>

<style>

  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(99, 102, 241, 0.15);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 12px 32px;
  display: flex; align-items: center; gap: 32px;
}
.nav-brand {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none; color: #e8ecf4;

}

.brand-text {
  background: linear-gradient(135deg, #6366f1, #ec4899);

  background-clip: text;
}

  display: flex; gap: 4px; flex: 1;

.nav-links::-webkit-scrollbar { display: none; }
.nav-link {
  padding: 6px 14px; border-radius: 8px;

<script>
(function() {
  var path = window.location.pathname;
  var filename = path.substring(path.lastIndexOf('/') + 1);
  var pageMap = {
    'demo-career-home.html': 'home',
    'demo-career-profile.html': 'profile',
    'demo-career-assessment.html': 'assessment',
    'demo-career-path.html': 'path',
    'demo-career-resume.html': 'resume',
    'demo-career-job.html': 'job',
    'demo-career-consult.html': 'consult',

<div class="bg-atmosphere">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
</div>

<div class="container">
  <header>
    <h1>🔍 Agent 调研</h1>
    <p>AI 研究助手帮你深入调研行业趋势、岗位信息和职业发展</p>
  </header>

  <div class="chat-area">
    <div class="agent-info">
      <div class="agent-avatar">🔮</div>
      <div>
        <div class="agent-name">职业研究助手</div>
        <div class="agent-desc">基于向量检索 + BM25 + 网页搜索的三路召回架构</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="message-avatar bot">🤖</div>
        <div class="message-body">
          <div class="message-text">你好！我是你的职业研究助手。我可以帮你深入调研：<br><br>
            • 行业发展趋势<br>
            • 目标岗位的真实工作内容<br>
            • 薪资待遇与晋升路径<br>
            • 技能学习路径<br>
            • 与竞品岗位的对比分析<br><br>
            请问你想了解什么？</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入你的研究问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">发送</button>
      </div>
      <div class="quick-questions">
        <button class="quick-btn" onclick="sendQuick('护理专家的职业发展路径')">护理专家的职业发展路径</button>
        <button class="quick-btn" onclick="sendQuick('护士转型健康管理师的建议')">护士转型健康管理师</button>
        <button class="quick-btn" onclick="sendQuick('医疗行业薪资待遇分析')">医疗行业薪资待遇</button>
      </div>
    </div>
  </div>
</div>

<script>
const messages = [
  {
    question: '护理专家的职业发展路径',
    answer: '护理专家的职业发展路径清晰且有层次：<br><br>【技术路线】<br>• 护士(0-2年) → 护师(2-4年) → 主管护师(4-7年) → 主任护师(7-12年)<br><br>【管理路线】<br>• 责任护士 → 护理组长 → 护士长 → 护理部主任<br><br>【关键认证】<br>• ICU专科护士认证、急诊专科护士认证、伤口造口专科护士认证等<br><br>【薪资参考】<br>• 护士：8k-12k/月<br>• 主管护师：15k-25k/月<br>• 主任护师：25k-40k/月'
  },
  {
    question: '护士转型健康管理师的建议',
    answer: '护士转型健康管理师是一个非常合理的职业方向：<br><br>【优势】<br>• 医学基础知识扎实，客户信任度高<br>• 临床经验丰富，能提供专业健康建议<br>• 沟通能力强，善于倾听和关怀<br><br>【转型步骤】<br>1. 考取健康管理师职业资格证书<br>2. 学习营养学、心理学基础知识<br>3. 积累健康评估与干预经验<br>4. 建立个人品牌或加入健康管理机构<br><br>【发展方向】<br>• 体检中心健康管理师<br>• 互联网医疗健康顾问<br>• 企业健康管理负责人<br>• 个人健康管理工作室'
  },
  {
    question: '医疗行业薪资待遇分析',
    answer: '医疗行业薪资水平因岗位和地区差异较大：<br><br>【护理岗位】<br>• 一线城市三甲医院：10k-20k/月<br>• 二线城市三甲医院：6k-12k/月<br>• 社区医院：4k-8k/月<br><br>【医疗技术岗位】<br>• 检验师：8k-15k/月<br>• 药师：10k-20k/月<br>• 影像技师：10k-18k/月<br><br>【健康管理岗位】<br>• 健康管理师：6k-15k/月<br>• 私人健康顾问：15k-30k/月<br><br>【趋势】<br>大健康产业正在快速发展，健康管理、康复护理等岗位需求持续增长。'
  }
];

function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const chat = document.getElementById('chatMessages');
  chat.innerHTML += `
    <div class="message user">
      <div class="message-avatar user">👤</div>
      <div class="message-body"><div class="message-text">${msg}</div></div>
    </div>
    <div class="message bot">
      <div class="message-avatar bot">🤖</div>
      <div class="message-body"><div class="message-text"><div class="thinking-dots"><span></span><span></span><span></span></div></div></div>
    </div>
  `;

  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  setTimeout(() => {
    const match = messages.find(m => msg.includes(m.question) || m.question.includes(msg));
    const answer = match ? match.answer : '感谢你的提问！我正在为你收集相关信息...<br><br>【调研要点】<br>• 行业发展趋势分析<br>• 岗位核心能力要求<br>• 薪资待遇范围<br>• 学习路径建议<br>• 职业发展前景';
    
    const botMsg = chat.lastElementChild;
    botMsg.querySelector('.message-text').innerHTML = answer;
    chat.scrollTop = chat.scrollHeight;
  }, 1500);
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}
</script>

</body>
