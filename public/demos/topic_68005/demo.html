<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c8a267" />
  <title>时光罗盘 · 历史学习</title>
  <style>
/* 时光罗盘 · 历史学习体验 App 样式 */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 关键修复：确保 hidden 属性不会被 CSS 覆盖 */
[hidden] {
  display: none !important;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: #2c2a28;
  background: #f3ede2;
  overflow-x: hidden;
}

/* 手机外壳容器（桌面端显示手机框，移动端全屏） */
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at top, #e8dcc4 0%, #c9b792 60%, #a89570 100%);
}

.app {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  max-height: 920px;
  background: #fdf8ef;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 80px rgba(80, 60, 30, 0.35);
  border-radius: 0;
}

@media (min-width: 500px) {
  body {
    padding: 20px;
  }
  .app {
    border-radius: 42px;
    border: 10px solid #2c2a28;
    max-height: 900px;
  }
}

/* 顶部栏 */
.app-header {
  background: linear-gradient(135deg, #8b6f47 0%, #c8a267 100%);
  color: #fff9ec;
  padding: 22px 20px 20px;
  position: relative;
  flex-shrink: 0;
  z-index: 5;
  box-shadow: 0 2px 8px rgba(80, 60, 30, 0.15);
}

.app-title {
  text-align: center;
}

.app-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  display: block;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
}

.app-sub {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.85;
  margin-top: 4px;
  display: block;
}

/* 主内容区 */
.app-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  position: relative;
  background: #fdf8ef;
}

.app-main::-webkit-scrollbar {
  width: 0;
}

/* 页面切换 */
.page {
  display: none;
  padding: 18px 18px 30px;
  min-height: 100%;
  animation: fadeIn 0.35s ease;
}

.page.active {
  display: block;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 日期卡片 */
.date-card {
  background:
    linear-gradient(135deg, #f9f1dc 0%, #f3e5c0 100%);
  border: 1px solid #e2d0a5;
  border-radius: 18px;
  padding: 22px 20px;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(139, 111, 71, 0.12);
}

.date-card::before {
  content: "";
  position: absolute;
  top: -30px;
  right: -30px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(200, 162, 103, 0.2) 0%, transparent 70%);
  border-radius: 50%;
}

.date-card::after {
  content: "曆";
  position: absolute;
  top: 12px;
  left: 15px;
  font-size: 14px;
  color: #c8a267;
  font-weight: bold;
  letter-spacing: 1px;
  writing-mode: vertical-rl;
  opacity: 0.6;
}

.date-big {
  font-size: 38px;
  font-weight: 700;
  color: #5c4525;
  letter-spacing: 2px;
  line-height: 1.1;
  position: relative;
}

.date-small {
  font-size: 13px;
  color: #8b6f47;
  margin-top: 8px;
  letter-spacing: 1px;
  position: relative;
}

.pick-date-btn {
  margin-top: 16px;
  background: #8b6f47;
  color: #fff9ec;
  border: none;
  padding: 9px 20px;
  border-radius: 20px;
  font-size: 13px;
  letter-spacing: 1px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.pick-date-btn:hover {
  background: #7a5f3c;
  transform: translateY(-1px);
}

.pick-date-btn svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
}

.date-picker {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed #d4bc8c;
  display: flex;
  gap: 8px;
  justify-content: center;
  position: relative;
}

.date-picker input[type="date"] {
  padding: 8px 12px;
  border: 1px solid #d4bc8c;
  border-radius: 8px;
  background: #fff;
  color: #5c4525;
  font-size: 14px;
  font-family: inherit;
}

.date-picker button {
  padding: 8px 16px;
  background: #c8a267;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}

/* 章节标题 */
.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 2px 14px;
  color: #5c4525;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
}

.section-title .dot {
  width: 6px;
  height: 6px;
  background: #c8a267;
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(200, 162, 103, 0.25);
}

/* 事件卡片列表 */
.event-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.event-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px 18px;
  border: 1px solid #ecdfc5;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  box-shadow: 0 2px 8px rgba(139, 111, 71, 0.06);
}

.event-card:active {
  transform: scale(0.98);
  box-shadow: 0 1px 4px rgba(139, 111, 71, 0.1);
}

.event-card:hover {
  border-color: #c8a267;
  box-shadow: 0 4px 16px rgba(139, 111, 71, 0.15);
}

.event-tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 10px;
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 500;
}

.event-tag.china {
  background: #f5e8d2;
  color: #8b4f25;
}

.event-tag.world {
  background: #dbe5f2;
  color: #3a4d7a;
}

.event-year {
  font-size: 13px;
  color: #a89570;
  margin-bottom: 4px;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

.event-title {
  font-size: 16px;
  font-weight: 600;
  color: #3a2f20;
  margin-bottom: 6px;
  line-height: 1.4;
}

.event-summary {
  font-size: 13px;
  color: #6e5a3c;
  line-height: 1.65;
  margin-bottom: 6px;
}

.event-more {
  font-size: 12px;
  color: #c8a267;
  margin-top: 8px;
  letter-spacing: 1px;
}

.event-more::after {
  content: " →";
  transition: transform 0.2s;
}

.event-card:hover .event-more::after {
  margin-left: 3px;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: #a89570;
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 14px;
  letter-spacing: 1px;
}

/* 分类按钮 */
.category-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 14px;
  margin-bottom: 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.category-tabs::-webkit-scrollbar {
  display: none;
}

.cat-btn {
  flex-shrink: 0;
  padding: 7px 16px;
  background: #f5ecd8;
  color: #8b6f47;
  border: 1px solid transparent;
  border-radius: 18px;
  font-size: 13px;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.cat-btn.active {
  background: #8b6f47;
  color: #fff9ec;
  box-shadow: 0 2px 8px rgba(139, 111, 71, 0.25);
}

.cat-btn:hover:not(.active) {
  background: #ecdcb9;
}

/* 人物卡片列表 */
.people-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.person-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px 18px;
  border: 1px solid #ecdfc5;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(139, 111, 71, 0.06);
}

.person-card:active {
  transform: scale(0.98);
}

.person-card:hover {
  border-color: #c8a267;
  box-shadow: 0 4px 16px rgba(139, 111, 71, 0.15);
}

.person-avatar {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, #c8a267, #8b6f47);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 2px 8px rgba(139, 111, 71, 0.3);
}

.person-info {
  flex: 1;
  min-width: 0;
}

.person-name {
  font-size: 17px;
  font-weight: 600;
  color: #3a2f20;
  margin-bottom: 3px;
}

.person-era {
  font-size: 12px;
  color: #a89570;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.person-title {
  font-size: 12.5px;
  color: #6e5a3c;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}

.person-category {
  font-size: 10.5px;
  padding: 3px 8px;
  background: #f5e8d2;
  color: #8b4f25;
  border-radius: 8px;
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* 搜索栏 */
.search-bar {
  background: #fff;
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #ecdfc5;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(139, 111, 71, 0.06);
}

.search-bar svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: #a89570;
}

.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  background: transparent;
  color: #3a2f20;
  font-family: inherit;
}

.search-bar input::placeholder {
  color: #b8a98c;
}

#search-clear {
  background: transparent;
  border: none;
  color: #a89570;
  font-size: 13px;
  cursor: pointer;
  padding: 4px 6px;
  font-family: inherit;
}

#search-clear:hover {
  color: #8b4f25;
}

/* 搜索筛选 */
.search-filters {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}

.filter-btn {
  flex: 1;
  padding: 7px 8px;
  background: #f5ecd8;
  color: #8b6f47;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 12.5px;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.filter-btn.active {
  background: #8b6f47;
  color: #fff9ec;
}

.filter-btn:hover:not(.active) {
  background: #ecdcb9;
}

/* 搜索空状态 */
.search-empty {
  text-align: center;
  padding: 40px 20px;
}

.search-empty-icon {
  font-size: 56px;
  margin-bottom: 14px;
  opacity: 0.4;
}

.search-empty-text {
  color: #a89570;
  font-size: 14px;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

.search-tips {
  color: #8b6f47;
  font-size: 13px;
  letter-spacing: 1px;
  text-align: center;
  line-height: 2.2;
}

.chip {
  display: inline-block;
  padding: 5px 12px;
  background: #fff;
  border: 1px solid #e2d0a5;
  color: #5c4525;
  border-radius: 14px;
  font-size: 12.5px;
  letter-spacing: 1px;
  margin: 0 3px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.chip:hover {
  background: #f5e8d2;
  border-color: #c8a267;
}

/* 搜索结果 */
.search-results {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-result {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  border: 1px solid #ecdfc5;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 6px rgba(139, 111, 71, 0.05);
}

.search-result:hover {
  border-color: #c8a267;
  box-shadow: 0 3px 12px rgba(139, 111, 71, 0.12);
}

.search-result-type {
  display: inline-block;
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 8px;
  margin-bottom: 6px;
  background: #f5e8d2;
  color: #8b4f25;
  letter-spacing: 1px;
  font-weight: 500;
}

.search-result-type.person {
  background: #d4e4d8;
  color: #3a5a43;
}

.search-result-type.event {
  background: #dbe5f2;
  color: #3a4d7a;
}

.search-result-type.time {
  background: #f5d4d4;
  color: #7a3a3a;
}

.search-result-title {
  font-size: 15px;
  font-weight: 600;
  color: #3a2f20;
  margin-bottom: 4px;
}

.search-result-desc {
  font-size: 12.5px;
  color: #6e5a3c;
  line-height: 1.6;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.search-highlight {
  background: #fde8a8;
  color: #8b4f25;
  padding: 0 2px;
  border-radius: 3px;
  font-weight: 600;
}

.search-result-meta {
  font-size: 11.5px;
  color: #a89570;
  margin-top: 6px;
  letter-spacing: 1px;
}

/* 搜索结果点击提示 */
.search-result-hint {
  display: block;
  text-align: right;
  font-size: 11.5px;
  color: #a89570;
  margin-top: 8px;
  letter-spacing: 1px;
}

.search-result-hint::after {
  content: " →";
  display: inline-block;
  transition: transform 0.2s ease;
}

.search-result:hover .search-result-hint {
  color: #8b4f25;
}

.search-result:hover .search-result-hint::after {
  transform: translateX(3px);
}

/* 底部导航 */
.app-nav {
  display: flex;
  background: #fff9ec;
  border-top: 1px solid #e2d0a5;
  padding: 8px 0 10px;
  flex-shrink: 0;
  box-shadow: 0 -2px 8px rgba(139, 111, 71, 0.08);
}

.nav-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 6px 4px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: #b8a98c;
  transition: color 0.2s;
}

.nav-icon {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s;
}

.nav-text {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 500;
}

.nav-btn.active {
  color: #8b4f25;
}

.nav-btn.active .nav-icon {
  transform: translateY(-2px);
}

.nav-btn:hover:not(.active) {
  color: #8b6f47;
}

/* 弹窗 */
.modal {
  position: absolute;
  inset: 0;
  z-index: 999;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
}

.modal.is-open {
  display: flex;
  animation: fadeInModal 0.3s ease;
}

.modal.is-open .modal-panel {
  animation: slideUp 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(40, 30, 20, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.modal-panel {
  position: relative;
  background: #fdf8ef;
  border-radius: 24px 24px 0 0;
  max-height: 88%;
  overflow-y: auto;
  box-shadow: 0 -8px 32px rgba(80, 60, 30, 0.3);
  scrollbar-width: thin;
  scrollbar-color: #c8a267 transparent;
  will-change: transform;
}

.modal-panel::-webkit-scrollbar {
  width: 4px;
}

.modal-panel::-webkit-scrollbar-thumb {
  background: #c8a267;
  border-radius: 2px;
}

@keyframes fadeInModal {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

.modal-head {
  background: linear-gradient(135deg, #8b6f47 0%, #c8a267 100%);
  color: #fff9ec;
  padding: 20px 22px 20px;
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.modal-title {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 2px;
  line-height: 1.5;
  flex: 1;
}

.modal-close {
  background: rgba(255, 255, 255, 0.2);
  color: #fff9ec;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  padding: 0;
}

.modal-close:hover {
  background: rgba(255, 255, 255, 0.35);
}

.modal-body {
  padding: 22px 22px 32px;
}

.modal-body .meta-line {
  font-size: 13px;
  color: #a89570;
  letter-spacing: 1px;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px dashed #e2d0a5;
}

.modal-body .modal-tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 10px;
  margin-right: 8px;
  letter-spacing: 1px;
  font-weight: 500;
}

.modal-body .modal-tag.china {
  background: #f5e8d2;
  color: #8b4f25;
}

.modal-body .modal-tag.world {
  background: #dbe5f2;
  color: #3a4d7a;
}

.modal-body p {
  font-size: 15px;
  line-height: 1.95;
  color: #3a2f20;
  margin: 0 0 14px;
  text-align: justify;
  text-indent: 2em;
}

.modal-body p:first-of-type {
  margin-top: 10px;
}

.modal-body p:last-child {
  margin-bottom: 0;
}

/* 历史人物详情特有样式 */
.person-detail-header {
  text-align: center;
  padding: 10px 0 20px;
  border-bottom: 1px solid #e2d0a5;
  margin-bottom: 20px;
}

.person-detail-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c8a267, #8b6f47);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(139, 111, 71, 0.35);
}

.person-detail-name {
  font-size: 22px;
  font-weight: 700;
  color: #3a2f20;
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.person-detail-era {
  font-size: 13px;
  color: #a89570;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.person-detail-title {
  font-size: 13px;
  color: #6e5a3c;
  letter-spacing: 1px;
}

</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">
      <span class="app-name">时光罗盘</span>
      <span class="app-sub">穿越时空的学习之旅</span>
    </div>
  </header>

    <main class="app-main">
      <!-- Tab: 今日历史 -->
      <section class="page page-today active" id="page-today">

const HISTORY_EVENTS = [
  // 6月17日
  { month: 6, day: 17, year: 1967, title: '中国第一颗氢弹爆炸成功', type: '中国',
    summary: '1967年6月17日，中国在罗布泊成功爆炸了第一颗氢弹，成为世界上第四个掌握氢弹技术的国家。',
    detail: '1967年6月17日上午，一架轰-6甲轰炸机在新疆罗布泊上空投下了中国第一颗氢弹。随着一声巨响，巨大的蘑菇云腾空而起，爆炸当量达到330万吨。这颗氢弹的研制成功，使中国成为继美国、苏联、英国之后，世界上第四个掌握氢弹技术的国家。值得一提的是，中国从第一颗原子弹到第一颗氢弹，仅用了两年零八个月，速度之快震惊世界。在邓稼先、于敏等科学家的带领下，老一辈科研工作者在设备简陋、资料匮乏的条件下，凭借着爱国热情和科学精神完成了这一壮举。这次试验成功大大提高了中国的国际地位，也为维护世界和平作出了重要贡献。' },
  { month: 6, day: 17, year: 1972, title: '尼克松签署水门事件调查令', type: '世界',
    summary: '1972年6月17日，美国水门饭店发生非法闯入事件，最终导致尼克松总统辞职。',
    detail: '1972年6月17日凌晨，五名男子潜入位于美国华盛顿水门饭店内的民主党全国委员会办公室，试图安装窃听设备并偷拍文件，结果被值班保安当场抓获。这起看似普通的入室盗窃案，在随后的调查中逐渐牵扯出美国总统尼克松及其竞选团队。经过两年多的调查和国会听证，大量证据显示尼克松政府不仅授权了窃听行动，还试图动用中情局和联邦调查局阻挠调查。1974年8月9日，尼克松在面临国会弹劾的压力下宣布辞职，成为美国历史上第一位辞职的总统。水门事件深刻影响了美国政治文化，也让"门"字成为全球政治丑闻的代名词。' },
  { month: 6, day: 17, year: 1885, title: '法国送给美国自由女神像', type: '世界',
    summary: '1885年6月17日，法国将自由女神像装箱运往美国，纪念美法友谊。',
    detail: '自由女神像正式名称为"自由照耀世界之神"，由法国雕塑家巴托尔迪设计，是法国人民赠予美国人民的礼物，以纪念美国独立一百周年以及两国在独立战争中结下的友谊。1885年6月17日，这座高达46米的铜像被拆解成214个木箱，由法国海军"伊泽尔"号运往美国纽约港。1886年10月28日，自由女神像在贝德罗岛（现自由岛）上重新组装并举行落成仪式，由当时的美国总统克利夫兰主持揭幕。自由女神像头戴七道尖芒冠冕，右手高举象征自由的火炬，左手捧着刻有1776年7月4日日期的《独立宣言》，脚下是被挣脱的锁链。她从此成为美国自由与民主精神的象征，1984年被列入世界文化遗产名录。' },

  // 6月18日
  { month: 6, day: 18, year: 1815, title: '滑铁卢战役', type: '世界',
    summary: '1815年6月18日，拿破仑在比利时滑铁卢战败，标志着拿破仑时代的终结。',
    detail: '1815年6月18日，法国皇帝拿破仑·波拿巴率领的法军在比利时小镇滑铁卢与英国威灵顿公爵指挥的反法同盟军遭遇。这场战役是拿破仑一生中的最后一战。此前三个月前，拿破仑从厄尔巴岛重返法国并建立百日王朝，欧洲各国迅速组成第七次反法同盟。滑铁卢战役持续了一整天，双方都付出了惨重的代价。最终在普鲁士军队的增援下，法军溃败。这场战役的失败直接导致了拿破仑的第二次退位。6月22日，拿破仑宣布退位，后被流放到南大西洋的圣赫勒拿岛，并于1821年在岛上去世。滑铁卢战役彻底结束了拿破仑时代，重新划分了欧洲的政治版图，维也纳会议奠定了此后近百年的欧洲均势。滑铁卢一词也因此成为"失败"的代名词而流传于世。' },
  { month: 6, day: 18, year: 1928, title: '中国共产党第六次全国代表大会召开', type: '中国',
    summary: '1928年6月18日，中共六大在莫斯科召开，总结大革命失败的经验教训。',
    detail: '1928年6月18日至7月11日，中国共产党第六次全国代表大会在苏联莫斯科近郊兹维尼果罗德镇"银色别墅"秘密召开。这是中国共产党历史上唯一一次在国外召开的全国代表大会。出席大会的代表共142人，其中有选举权的正式代表84人。瞿秋白、周恩来、李立三、蔡和森等重要领导人出席。大会认真总结了大革命失败的经验教训，批判了陈独秀的右倾机会主义错误和"左"倾盲动主义倾向，明确指出中国社会仍然是半殖民地半封建社会，中国革命现阶段的性质仍然是资产阶级民主革命，制定了反对帝国主义和封建主义、实行土地革命、建立工农民主专政的革命纲领，并确定了党的建设、武装斗争和土地革命三位一体的总方针。大会选举产生了新的中央委员会，向忠发当选为中央总书记。中共六大在党的历史上具有重要意义，它统一了全党的思想，对克服党内存在的混乱情绪起到了积极作用，为后来中国革命的发展奠定了基础。' },
  { month: 6, day: 18, year: 1935, title: '瞿秋白就义', type: '中国',
    summary: '1935年6月18日，中国共产党早期主要领导人瞿秋白在福建长汀就义。',
    detail: '1935年6月18日，中国共产党早期主要领导人之一、伟大的马克思主义者瞿秋白在福建长汀罗汉岭英勇就义，年仅36岁。瞿秋白1899年出生于江苏常州，是中国共产党早期的主要领导人之一，也是中国革命文学事业的重要奠基者之一。他曾两度担任中国共产党最高领导人，主持召开八七会议，为中国革命作出了重要贡献。1934年10月中央红军主力长征后，瞿秋白因病留在中央苏区坚持斗争。1935年2月，他在转移途中被国民党军队包围被俘。在狱中，他坚贞不屈，写下了《多余的话》等文章，回顾自己的一生。就义前，他高呼"中国共产党万岁""中国革命胜利万岁"等口号，从容走向刑场，用生命践行了一个共产党员的革命气节。瞿秋白的一生是为中国革命事业奋斗的一生，他的崇高精神和革命气节永远值得后人缅怀。' },
  { month: 6, day: 18, year: 2012, title: '中国神舟九号载人飞船发射成功', type: '中国',
    summary: '2012年6月18日，神舟九号飞船成功发射并与天宫一号对接，中国首次载人交会对接任务圆满完成。',
    detail: '2012年6月18日，中国神舟九号载人飞船在酒泉卫星发射中心成功发射升空。执行此次飞行任务的三名航天员是景海鹏、刘旺和中国首位女航天员刘洋。神舟九号飞船在太空中成功与天宫一号目标飞行器实现自动交会对接，并随后实现了航天员的手控交会对接，这是中国载人航天史上的重要突破。这次任务是中国载人航天工程三步走战略中第二步的关键一步，标志着中国已经完整掌握了空间交会对接技术。神舟九号任务的成功完成，实现了中国载人航天工程的新的又一次重大突破，为中国空间站建设奠定了坚实基础，也为中国未来载人登月等深空探测活动积累了宝贵经验。这次任务使中国成为世界上第三个独立掌握空间交会对接技术的国家。刘洋成为中国第一位进入太空的女航天员。' },

  // 6月22日（补充）
  { month: 6, day: 22, year: 1941, title: '苏德战争爆发', type: '世界',
    summary: '1941年6月22日，德国撕毁《苏德互不侵犯条约》，大举进攻苏联。',
    detail: '1941年6月22日凌晨，纳粹德国撕毁《苏德互不侵犯条约》，集结了190个师共550万余人、3700辆坦克、4900架飞机、47000门大炮和190艘军舰，划分为三个集团军群，以闪电战方式从北方、中央、南方三个方向以突然袭击的方式向苏联发动了空前规模的进攻。这就是历史上著名的"巴巴罗萨"计划。这次进攻是人类历史上最大规模的军事行动之一。在战争初期，苏联红军因准备不足节节败退，大片国土沦陷。但苏联人民在斯大林的领导下迅速组织起顽强的抵抗，在莫斯科、列宁格勒、斯大林格勒等战役中浴血奋战，最终扭转了战局。苏德战争是第二次世界大战中规模最大、战斗最激烈、伤亡最惨重的主战场，为世界反法西斯战争的胜利作出了不可磨灭的贡献。' },

  // 6月25日
  { month: 6, day: 25, year: 1950, title: '朝鲜战争爆发', type: '世界',
    summary: '1950年6月25日，朝鲜战争爆发，中国人民志愿军于10月19日入朝参战。',
    detail: '1950年6月25日凌晨，朝鲜人民军越过三八线向南进攻，朝鲜战争爆发。两天后，美国操纵联合国安理会通过决议，组成以美军为主的"联合国军"介入朝鲜战争。9月15日，美军在仁川登陆，朝鲜战局发生逆转。10月7日，美军越过三八线向北推进，战火逐渐烧到中国边境。10月8日，中共中央作出"抗美援朝、保家卫国"的重大战略决策，10月19日，中国人民志愿军在彭德怀司令员的率领下，跨过鸭绿江入朝参战。10月25日，志愿军在朝鲜人民军配合下，对以美国为首的"联合国军"发动第一次战役，成功将敌军从鸭绿江边击退到清川江以南，初步稳定了朝鲜战局。此后，志愿军又取得了第二次、第三次、第四次、第五次战役的胜利，将战线稳定在三八线附近。1953年7月27日，朝鲜停战协定在板门店签署，朝鲜战争结束。中国人民志愿军在抗美援朝战争中付出了巨大的牺牲，涌现出杨根思、黄继光、邱少云等无数英雄模范人物，用鲜血和生命捍卫了新中国的安全，极大地提升了中国的国际地位和民族自信心。' },

  // 1月1日
  { month: 1, day: 1, year: 1912, title: '中华民国成立', type: '中国',
    summary: '1912年1月1日，孙中山在南京宣誓就任临时大总统，中华民国正式成立。',
    detail: '1912年1月1日，孙中山由上海抵达南京，在原两江总督署宣誓就任中华民国临时大总统，并宣告中华民国临时政府成立。这一天，亚洲第一个共和制政权在中国诞生。临时政府采用公历纪年，以1912年为民国元年，国旗为五色旗，象征汉满蒙回藏五族共和。尽管南京临时政府只存在了短短三个月，其颁布的《中华民国临时约法》确立了主权在民、三权分立等现代民主原则，对中国政治发展影响深远。中华民国的成立结束了在中国延续两千多年的封建帝制，开启了近代中国艰难曲折的共和之路。' },
  { month: 1, day: 1, year: 2002, title: '欧元纸币和硬币开始流通', type: '世界',
    summary: '2002年1月1日，欧元纸币和硬币正式在欧元区12个成员国全面流通。',
    detail: '2002年1月1日，经过多年准备，欧元现钞正式在德国、法国、意大利、西班牙等12个欧盟成员国开始流通，取代了马克、法郎、里拉、比塞塔等各国旧货币。这是自罗马帝国以来欧洲最大规模的货币统一行动。欧元的诞生使欧盟在经济上真正成为一个整体，极大促进了成员国之间的贸易和人员往来。欧元纸币正面为欧洲建筑史上的拱门和窗户图案，背面为不同历史时期的桥梁，象征欧洲的开放与连通。如今，欧元已是世界第二大国际货币，欧元区成员国也扩展到20个国家，覆盖3.4亿人口。' },

  // 7月4日
  { month: 7, day: 4, year: 1776, title: '美国《独立宣言》签署', type: '世界',
    summary: '1776年7月4日，大陆会议通过《独立宣言》，美国正式脱离英国独立。',
    detail: '1776年7月4日，在费城召开的第二届大陆会议上，代表们通过了由托马斯·杰斐逊起草的《独立宣言》。这份被后世视为现代民主思想基石的文件庄严宣告：北美十三州从此脱离英国统治，成为自由独立的合众国。《独立宣言》最著名的段落写道："我们认为这些真理是不言而喻的——人人生而平等，造物者赋予他们若干不可剥夺的权利，其中包括生命权、自由权和追求幸福的权利。"这一理念深刻影响了此后法国大革命以及世界各地的民主运动。7月4日从此成为美国的国庆日，《独立宣言》的原件现保存于美国国家档案馆。' },
  { month: 7, day: 4, year: 1904, title: '中国福利会前身创建', type: '中国',
    summary: '1904年7月4日，宋庆龄出生于上海，她后来创办了中国福利会。',
    detail: '1904年7月4日，宋庆龄出生于上海一个实业家家庭。她早年留学美国，归国后追随孙中山投身革命事业，1915年与孙中山在日本东京结婚。孙中山逝世后，宋庆龄始终坚守"联俄、联共、扶助农工"的三大政策，长期支持中国人民的解放事业。新中国成立后，她担任国家重要领导职务，并于1951年在上海创办了中国福利会，致力于儿童保健与文化教育事业。宋庆龄被尊称为"国之瑰宝"，是20世纪中国最伟大的女性之一。2021年7月，中国福利会在上海举行成立80周年纪念活动，传承宋庆龄的事业精神。' },

  // 10月1日
  { month: 10, day: 1, year: 1949, title: '中华人民共和国成立', type: '中国',
    summary: '1949年10月1日，毛泽东在天安门城楼宣布中华人民共和国中央人民政府成立。',
    detail: '1949年10月1日下午三点，北京天安门广场举行了盛大的开国大典。毛泽东主席在天安门城楼上用浓重的湖南口音向全世界庄严宣告："中华人民共和国中央人民政府今天成立了！中国人民从此站起来了！"广场上30万军民欢声雷动。随后举行了盛大的阅兵式和群众游行，新成立的中国人民解放军陆海空三军首次接受检阅。当天傍晚，天安门广场上灯火辉煌，礼花腾空而起，首都人民彻夜欢庆。中华人民共和国的成立，标志着中国人民从此结束了一百多年来被侵略被奴役的屈辱历史，真正成为国家的主人。中国历史从此翻开了崭新的一页。10月1日成为中华人民共和国的国庆节。' },

  // 12月25日
  { month: 12, day: 25, year: 1991, title: '苏联解体', type: '世界',
    summary: '1991年12月25日，戈尔巴乔夫宣布辞去苏联总统职务，苏联正式解体。',
    detail: '1991年12月25日晚，苏联总统戈尔巴乔夫在克里姆林宫发表电视讲话，宣布辞去苏联总统和武装部队最高统帅职务，并将核按钮交给俄罗斯总统叶利钦。讲话结束后，克里姆林宫上空飘扬了近七十年的苏联国旗缓缓降下，取而代之的是俄罗斯联邦的白蓝红三色旗。至此，由15个加盟共和国组成、横跨欧亚两大洲、国土面积世界第一、拥有近三亿人口的超级大国——苏维埃社会主义共和国联盟（苏联）正式解体。苏联解体是20世纪最重大的历史事件之一，它标志着冷战时代的结束和两极格局的终结，也深刻改变了世界政治版图。苏联从建立到解体共走过69年历程，给全世界留下了深刻的历史教训。' },
  { month: 12, day: 25, year: 1936, title: '西安事变和平解决', type: '中国',
    summary: '1936年12月25日，蒋介石被释放，西安事变和平解决，国共开始第二次合作。',
    detail: '1936年12月12日，东北军将领张学良和西北军将领杨虎城在西安华清池发动兵谏，扣押了前来督战"剿共"的蒋介石，史称"西安事变"或"双十二事变"。张、杨二人提出停止内战、一致抗日等八项主张。消息传出，全国震动，国际关注。在各方力量的斡旋下，特别是中共中央派周恩来等人赴西安参与谈判，最终促成了和平解决。12月25日，蒋介石在张学良的陪同下离开西安返回南京。西安事变的和平解决，促成了国共两党的第二次合作，抗日民族统一战线初步形成。此后全国各界力量逐步团结起来，为即将到来的全面抗日战争奠定了基础。西安事变因此被视为扭转中国时局的关键转折点。' },

  // 5月4日
  { month: 5, day: 4, year: 1919, title: '五四运动爆发', type: '中国',
    summary: '1919年5月4日，北京学生走上街头抗议巴黎和会，掀起新文化与爱国运动高潮。',
    detail: '1919年5月4日，北京十余所大专学校的三千多名学生在天安门前集会游行，抗议巴黎和会将德国在山东的特权转让给日本。学生们打出"外争主权，内除国贼""誓死力争，还我青岛""废除二十一条"等标语，火烧赵家楼、痛打章宗祥，遭到军警镇压。这场运动随后迅速扩展到全国各大城市，工人罢工、商人罢市，形成前所未有的全民爱国浪潮。在强大压力下，北洋政府最终罢免了曹汝霖、陆宗舆、章宗祥三人，并拒绝在凡尔赛和约上签字。五四运动不仅是一场爱国政治运动，更是一场深刻的思想启蒙运动。它高举民主与科学两面大旗，猛烈抨击封建旧礼教旧文化，大力传播新思想新文化。一大批先进知识分子在这场运动中接受了马克思主义，为中国共产党的成立奠定了思想和组织基础。5月4日后来被定为中国青年节。' },

  // 9月1日
  { month: 9, day: 1, year: 1939, title: '第二次世界大战爆发', type: '世界',
    summary: '1939年9月1日，德国闪击波兰，英法对德宣战，第二次世界大战全面爆发。',
    detail: '1939年9月1日凌晨，纳粹德国出动150多万军队、2000多架飞机、2800多辆坦克，从北、西、南三个方向同时向波兰发起闪电进攻。9月3日，英国和法国被迫对德国宣战，第二次世界大战全面爆发。这场由法西斯国家发动的战争持续了六年之久，战火遍及欧洲、亚洲、非洲和大洋洲，先后有六十多个国家、二十亿以上人口被卷入战争，造成约七千万人死亡，是人类历史上规模最大、伤亡最惨重的一场战争。1945年5月8日德国投降，8月6日和9日美国先后在日本广岛、长崎投下原子弹，8月15日日本宣布无条件投降，9月2日在"密苏里"号战列舰上签署投降书，第二次世界大战正式结束。战后建立的联合国，至今仍是维护世界和平与安全最重要的国际组织。' },

  // 9月3日
  { month: 9, day: 3, year: 1945, title: '中国人民抗日战争胜利纪念日', type: '中国',
    summary: '1945年9月3日，中国人民取得抗日战争的伟大胜利，这一天被确定为中国人民抗日战争胜利纪念日。',
    detail: '1945年9月2日，日本代表在停泊于东京湾的美国"密苏里"号战列舰上签署无条件投降书。9月3日，中国举国欢庆，这一天被定为中国人民抗日战争胜利纪念日。2014年2月27日，第十二届全国人大常委会第七次会议通过决定，将每年9月3日确定为中国人民抗日战争胜利纪念日，每年12月13日设立为南京大屠杀死难者国家公祭日。从1931年九一八事变到1945年抗战胜利，中国人民经过十四年艰苦卓绝的斗争，付出了巨大的民族牺牲。据不完全统计，中国军民伤亡共3500多万人，其中死亡人数约2000万。抗日战争是近代以来中国抗击外敌入侵第一次取得完全胜利的民族解放战争，彻底粉碎了日本军国主义殖民奴役中国的图谋，重新确立了中国在世界上的大国地位，开辟了中华民族伟大复兴的光明前景。' },

  // 9月18日
  { month: 9, day: 18, year: 1931, title: '九一八事变', type: '中国',
    summary: '1931年9月18日，日本关东军在沈阳制造柳条湖事件，悍然发动侵华战争。',
    detail: '1931年9月18日夜，日本关东军以蓄意制造的柳条湖铁路爆炸事件为借口，悍然进攻中国东北军驻地北大营和沈阳城，史称九一八事变。由于当时中国国民政府采取不抵抗政策，东北军大部不战而退。短短四个多月内，东北三省一百多万平方公里的大好河山全部沦陷，三千万同胞沦为亡国奴。九一八事变是日本帝国主义侵华的开端，也是世界反法西斯战争的起点。面对日本侵略者的铁蹄，中国人民毅然奋起抵抗。1932年1月28日，中国军队在上海奋起抗战，即一·二八事变。九一八事变后，中国共产党立即发表宣言，号召全国人民团结起来，反抗日本侵略者的侵略。九一八事变是中国人民抗日战争的起点，也是中华民族十四年抗战的开端。2017年起，中国将"八年抗战"改为"十四年抗战"，以准确反映九一八事变后中国人民反抗日本侵略者的完整历史。每年的9月18日，全国多座城市都会鸣响防空警报，以警醒国人勿忘国耻。' },

  // 6月1日
  { month: 6, day: 1, year: 1925, title: '国际儿童节确立', type: '世界',
    summary: '1925年6月1日，国际儿童幸福促进会在瑞士日内瓦召开大会，确定6月1日为国际儿童节。',
    detail: '1925年6月1日，国际儿童幸福促进会在瑞士日内瓦召开关于儿童福利的国际会议，首次提出了"国际儿童节"的概念，并发表了《日内瓦保障儿童宣言》。为了悼念利迪策村和全世界所有在法西斯侵略战争中死难的儿童，1949年11月，国际民主妇女联合会在莫斯科举行理事会议，决定以每年的6月1日为国际儿童节。这次会议的目的是为了保障世界各国儿童的生存权、保健权、受教育权，为了改善儿童的生活。为了庆祝儿童节，世界各国都举行了各种形式的活动。在中国，1949年12月，中央人民政府政务院发出通令，废除旧的儿童节，将6月1日作为中国的儿童节，与国际儿童节统一起来。从此，每年的这一天，全国少年儿童都要举行各种活动，欢庆自己的节日。儿童节是属于孩子们的节日，也是提醒全社会关心儿童成长、保护儿童权益的重要日子。' },

  // 6月6日
  { month: 6, day: 6, year: 1944, title: '诺曼底登陆', type: '世界',
    summary: '1944年6月6日，盟军在法国诺曼底实施大规模登陆作战，开辟欧洲第二战场。',
    detail: '1944年6月6日凌晨，在盟军欧洲盟军最高司令艾森豪威尔将军的指挥下，代号为"霸王行动"的人类历史上最大规模的两栖登陆作战在法国西北部的诺曼底海岸打响。以英美两国军队为主力的盟军先头部队总计17.6万人，从英国跨越英吉利海峡，抢滩登陆诺曼底的五个主要海滩——犹他、奥马哈、黄金、朱诺和宝剑。同日，2.3万名空降兵也在德军后方空降着陆。登陆作战中，盟军付出了惨重代价，仅在奥马哈海滩就有超过4000名美军官兵阵亡。但盟军的顽强进攻最终突破了德军的大西洋壁垒。到7月初，已有超过百万盟军成功登陆并建立了稳固的登陆场。诺曼底登陆成功开辟了欧洲第二战场，加速了纳粹德国的灭亡。这一战役被公认为第二次世界大战的重要转折点之一，它与东线苏军的反攻形成夹击之势，使德国法西斯陷入两面作战的困境。诺曼底登陆的胜利标志着欧洲反法西斯战争进入最后阶段，为最终战胜德国法西斯奠定了重要基础。' },

  // 8月6日
  { month: 8, day: 6, year: 1945, title: '广岛原子弹爆炸', type: '世界',
    summary: '1945年8月6日，美国在日本广岛投下原子弹，加速了日本投降和二战结束。',
    detail: '1945年8月6日上午8时15分，美国陆军航空军B-29"超级空中堡垒"轰炸机"埃诺拉·盖伊"号在日本广岛市上空约600米处投下了人类历史上第一颗用于实战的原子弹，代号"小男孩"。爆炸瞬间产生的巨大冲击波和高达数百万度的火球将广岛市中心约12平方公里的区域夷为平地。据后来统计，这次爆炸直接造成约14万人死亡，加上随后因核辐射患病的受害者，总遇难人数超过20万。三天后的8月9日，美国又在日本长崎投下了第二颗原子弹"胖子"。这两次原子弹爆炸给日本造成了毁灭性打击，加上8月8日苏联红军出兵中国东北对日作战，日本天皇裕仁于8月15日宣布无条件投降，9月2日正式签署投降书，第二次世界大战至此结束。原子弹的巨大破坏力也让世界深刻认识到核武器的灾难性后果，推动了战后国际社会对核武器控制和和平利用原子能的努力。广岛和平纪念公园及原子弹爆炸圆顶屋已成为世界文化遗产，提醒世人战争的残酷与和平的珍贵。' },

  // 12月13日
  { month: 12, day: 13, year: 1937, title: '南京大屠杀', type: '中国',
    summary: '1937年12月13日，日军攻占南京后实施惨绝人寰的大屠杀，三十余万同胞遇难。',
    detail: '1937年12月13日，日军攻陷中国首都南京后，对无辜平民和放下武器的中国士兵进行了长达六周惨绝人寰的大规模屠杀、强奸、抢劫和纵火，史称南京大屠杀。据战后远东国际军事法庭和南京审判战犯军事法庭调查统计，在南京大屠杀中，日军共杀害中国平民和战俘达三十余万人，其中集体屠杀达28起，屠杀人数19万余人，零散屠杀858起，死亡人数15万余人。日军还对南京妇女实施了大规模的强奸暴行，据统计总数达两万余起。日军的暴行震惊世界，当时在南京的德国商人拉贝等外国侨民自发组织了"安全区"，保护了约25万中国难民。南京大屠杀是日本侵略者对中国人民犯下的滔天罪行，是中华民族历史上最为惨痛的一页，也是人类文明史上最黑暗的一章。2014年2月27日，中国十二届全国人大常委会第七次会议通过决定，将每年12月13日设立为南京大屠杀死难者国家公祭日。这一决定表达了中国人民对南京大屠杀死难者的深切缅怀和铭记历史、珍爱和平的坚定决心。' },

  // 11月9日
  { month: 11, day: 9, year: 1989, title: '柏林墙倒塌', type: '世界',
    summary: '1989年11月9日，分割东西柏林的柏林墙被民众冲开，冷战走向终结。',
    detail: '1961年8月13日，为阻止东德居民大量逃往西柏林，民主德国在东西柏林边界修筑了全长155公里的水泥高墙，即"柏林墙"。柏林墙不仅是一堵钢筋水泥墙，更配备了铁丝网、瞭望塔、自动射击装置和"死亡地带"。它成为冷战时期东西方两大阵营对抗最尖锐的象征，也把无数德国家庭无情地分割了二十八年。1989年11月9日晚，在东德政府放宽边境管制的消息传出后，成千上万的东柏林人涌向边境哨卡，边防军在混乱中放行。人们爬上高墙，挥动锤子和凿子凿下一块块混凝土，整个柏林陷入狂欢。柏林墙的倒塌标志着冷战走向终结，也预示着两德统一的到来。1990年10月3日，分裂四十五年的德意志民主共和国正式加入德意志联邦共和国，德国实现统一。今天，柏林墙遗址上的查理检查站和东画廊仍吸引着世界各地的游客。' },

  // 3月14日
  { month: 3, day: 14, year: 1879, title: '爱因斯坦诞生', type: '世界',
    summary: '1879年3月14日，爱因斯坦出生于德国乌尔姆，后创立相对论改变了物理学。',
    detail: '1879年3月14日，阿尔伯特·爱因斯坦出生于德国南部城市乌尔姆的一个犹太人家庭。幼年时期的爱因斯坦说话较晚，却很早就对数学和物理表现出浓厚兴趣。16岁时他就开始思考一个深刻的问题：如果一个人以光速飞行，他看到的世界会是什么样子？这个问题在十年后催生了他的狭义相对论。1905年被称为爱因斯坦的"奇迹年"——这一年他发表了四篇改变世界的论文，其中最著名的就是狭义相对论和质能等价方程 E=mc²。1915年他又发表了广义相对论，彻底颠覆了牛顿以来人类对时间、空间和引力的理解。1921年爱因斯坦荣获诺贝尔物理学奖。1933年为躲避纳粹迫害，他移居美国并加入普林斯顿高等研究院。1939年他联名致信罗斯福总统，建议美国开展原子弹研究。战后他积极倡导和平利用核能和反对核武器。爱因斯坦于1955年4月18日在美国普林斯顿逝世，享年76岁。他被公认为人类有史以来最伟大的科学家之一。' },

  // 8月15日
  { month: 8, day: 15, year: 1945, title: '日本宣布无条件投降', type: '中国',
    summary: '1945年8月15日，日本天皇裕仁广播《终战诏书》，宣布无条件投降。',
    detail: '1945年8月15日正午，日本天皇裕仁通过电台向全国广播《终战诏书》，正式宣布日本接受《波茨坦公告》，无条件投降。中国人民经过艰苦卓绝的十四年抗日战争，终于迎来了胜利的曙光。消息传来，整个中国沸腾了——重庆、延安、上海、北平等地的人民涌上街头，敲锣打鼓、燃放鞭炮，欢庆这来之不易的胜利。8月28日，毛泽东亲自赴重庆与蒋介石谈判，谋求战后和平建国。9月2日上午9时许，日本外相重光葵和参谋总长梅津美治郎在停泊于东京湾的美国"密苏里"号战列舰主甲板上，代表日本政府和军队签署了投降书。中国国民政府军事委员会军令部部长徐永昌将军代表中国在投降书上签字。9月3日被确定为中国人民抗日战争胜利纪念日。这场战争给中国造成了约3500万人伤亡和巨额财产损失，但中华民族最终以巨大的牺牲赢得了民族独立与尊严。' },

  // 2月14日
  { month: 2, day: 14, year: 1912, title: '孙中山辞去临时大总统', type: '中国',
    summary: '1912年2月14日，孙中山向临时参议院提出辞呈，让位给袁世凯。',
    detail: '1912年2月14日，就在中华民国成立仅一个半月后，临时大总统孙中山向南京临时参议院正式提出辞职，并推荐袁世凯继任。这一决定在当时引发巨大争议，许多革命党人难以接受。孙中山之所以作出这个艰难选择，是因为袁世凯控制着当时中国最强大的北洋军队，若强行开战，新生的共和政权极可能被扼杀。在各方斡旋下，袁世凯最终承诺拥护共和体制，并于2月12日迫使清宣统帝溥仪退位。次日孙中山兑现承诺提出辞职。2月15日临时参议院选举袁世凯为第二任临时大总统。然而袁世凯上台后很快背弃承诺，一步步走向独裁，最终于1915年复辟帝制。孙中山的这次让位虽有其历史必然性，却也预示着中国共和之路的艰难曲折。此后十多年间，中国陷入军阀混战的动荡局面，直到国民革命军北伐才再次实现形式上的统一。' },

  // 4月23日
  { month: 4, day: 23, year: 1949, title: '中国人民解放军攻占南京', type: '中国',
    summary: '1949年4月23日，解放军突破长江天险，攻占国民政府首都南京。',
    detail: '1949年4月21日，毛泽东、朱德发布《向全国进军的命令》，中国人民解放军第二、第三野战军发起规模浩大的渡江战役。百万雄师在西起九江东北的湖口、东至江阴的长达五百余公里的战线上强渡长江，彻底摧毁了国民党军队苦心经营三个半月的长江防线。4月23日晚，人民解放军第三十五军攻占南京城，红旗插上了国民政府总统府门楼。蒋介石苦心经营二十余年的国民政府在大陆的统治就此宣告结束。毛泽东闻讯后挥笔写下著名诗篇《七律·人民解放军占领南京》："钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷。"攻占南京是三大战役后又一具有决定意义的胜利，为新中国的诞生奠定了坚实基础。此后人民解放军以秋风扫落叶之势向华南、西南、西北进军，迅速解放了中国大陆的绝大部分地区。' },

  // 7月20日
  { month: 7, day: 20, year: 1969, title: '人类首次登上月球', type: '世界',
    summary: '1969年7月20日，美国阿波罗11号宇航员阿姆斯特朗成为第一个踏上月球的人类。',
    detail: '1969年7月20日美国东部时间下午4时17分40秒，美国阿波罗11号飞船的登月舱"鹰"号在月球表面的"静海"区域平稳着陆。六个半小时后，宇航员尼尔·阿姆斯特朗沿着登月舱的九级扶梯走下，他的左脚在月尘上留下了人类在地球以外天体上的第一个脚印。与此同时，他通过无线电向全世界二十多亿电视观众说出了那句永载史册的名言："这是我个人的一小步，却是人类的一大步。"（That\'s one small step for a man, one giant leap for mankind.）随后，宇航员巴兹·奥尔德林也踏上月面。两人在月球表面停留了约两个半小时，插上美国国旗、安放科学仪器、采集岩石样本。阿波罗11号任务的成功，不仅是美苏太空竞赛中美国的决定性胜利，更是人类探索宇宙征程中的里程碑事件。从1969年到1972年，共有12名美国宇航员先后踏上月球表面，至今尚无其他国家实现载人登月。' },

  // 3月14日
  { month: 3, day: 14, year: 1879, title: '爱因斯坦诞生', type: '世界',
    summary: '1879年3月14日，阿尔伯特·爱因斯坦出生于德国乌尔姆，后创立相对论改变物理学。',
    detail: '1879年3月14日，阿尔伯特·爱因斯坦出生于德国南部城市乌尔姆的一个犹太人家庭。幼年时期的爱因斯坦说话较晚，却很早就对数学和物理表现出浓厚兴趣。十六岁时他就开始思考一个深刻的问题：如果一个人以光速飞行，他看到的世界会是什么样子？这个问题在十年后催生了他的狭义相对论。1905年被称为爱因斯坦的"奇迹年"——这一年他发表了四篇改变世界的论文，其中最著名的就是狭义相对论和质能等价方程 E=mc²。1915年他又发表了广义相对论，彻底颠覆了牛顿以来人类对时间、空间和引力的理解。1921年爱因斯坦荣获诺贝尔物理学奖。1933年为躲避纳粹迫害，他移居美国并加入普林斯顿高等研究院。爱因斯坦于1955年4月18日在美国普林斯顿逝世，享年76岁，被公认为人类有史以来最伟大的科学家之一。' },

  // 4月12日
  { month: 4, day: 12, year: 1961, title: '人类首次进入太空', type: '世界',
    summary: '1961年4月12日，苏联宇航员尤里·加加林成为人类历史上第一个进入太空的人。',
    detail: '1961年4月12日莫斯科时间上午9时零7分，苏联宇航员尤里·加加林乘坐"东方1号"载人飞船从拜科努尔航天发射场升空，在最大高度约327公里的轨道上环绕地球飞行一圈，历时108分钟后安全返回地面。这是人类历史上第一次载人航天飞行，加加林因此成为全人类第一位"太空人"。消息传来，举世震惊。当时的美苏太空竞争正处于白热化阶段，苏联先于美国将人类送入太空，对美国朝野造成巨大冲击。加加林的成功宣告了人类航天时代的到来。然而令人惋惜的是，这位人类首位于1968年3月27日在一次战斗机训练飞行中因飞机失事遇难，年仅34岁。为了纪念他，月球背面的一座环形山以他的名字命名，国际航空联合会也设立了加加林金质奖章。' },

  // 9月11日
  { month: 9, day: 11, year: 2001, title: '美国911恐怖袭击事件', type: '世界',
    summary: '2001年9月11日，恐怖分子劫持客机撞击美国纽约世贸中心和华盛顿五角大楼。',
    detail: '2001年9月11日上午，19名基地组织恐怖分子劫持了四架美国民航客机。其中两架分别撞上纽约世界贸易中心的南北双子塔，一架撞向美国国防部所在地五角大楼，第四架在乘客的反抗下坠毁于宾夕法尼亚州乡间。这次袭击造成近3000人死亡，其中包括数百名消防员和警察。两座高达110层的世贸大楼在遭受撞击后不到两小时内相继坍塌，震惊世界。911事件是人类历史上最严重的恐怖袭击，它彻底改变了21世纪初的全球政治格局。美国随后发动了阿富汗战争和伊拉克战争，全球进入了漫长的"反恐战争"时代。这次事件也深刻改变了航空安全、国家安全和国际关系的方方面面。' },

  // 12月7日
  { month: 12, day: 7, year: 1941, title: '日本偷袭珍珠港', type: '世界',
    summary: '1941年12月7日，日本海军偷袭美国夏威夷珍珠港，太平洋战争全面爆发。',
    detail: '1941年12月7日夏威夷时间清晨，日本海军在没有宣战的情况下，以六艘航空母舰搭载的四百余架舰载机，对美国太平洋舰队基地珍珠港发动了突袭。这场持续约两个小时的空中打击，击沉或重创了美国八艘战列舰、三艘巡洋舰、三艘驱逐舰，击毁飞机约188架，造成美军2403人死亡、1178人受伤。日军仅损失29架飞机、五艘袖珍潜艇和一艘潜艇。美国总统罗斯福随后在国会发表著名的"国耻日"演讲，美国正式对日本宣战，太平洋战争全面爆发。这一事件也直接导致美国全面加入第二次世界大战，从根本上改变了战争的走向和最终结局。珍珠港事件至今仍是美国历史上最严重的本土受袭事件之一。' },

  // 7月1日
  { month: 7, day: 1, year: 1997, title: '香港回归祖国', type: '中国',
    summary: '1997年7月1日，中华人民共和国恢复对香港行使主权，香港特别行政区成立。',
    detail: '1997年7月1日零时，香港会议展览中心灯火辉煌，中英两国政府在这里举行香港政权交接仪式。在中华人民共和国国歌声中，五星红旗和香港特别行政区区旗冉冉升起。国家主席江泽民庄严宣告：根据中英关于香港问题的联合声明，两国政府如期举行了香港交接仪式，宣告中国对香港恢复行使主权。中华人民共和国香港特别行政区正式成立。至此，英国对香港长达一百五十六年的殖民统治宣告结束。经历了百年沧桑的香港回归祖国，标志着香港同胞从此成为祖国这块土地上的真正主人，香港的发展从此进入一个崭新的时代。"一国两制"的伟大构想在香港率先成为现实，为后来澳门回归和两岸统一提供了重要的历史借鉴。7月1日凌晨，中国人民解放军驻香港部队进驻香港，开始履行防务职责。' },

  // 12月20日
  { month: 12, day: 20, year: 1999, title: '澳门回归祖国', type: '中国',
    summary: '1999年12月20日，中华人民共和国恢复对澳门行使主权，澳门特别行政区成立。',
    detail: '1999年12月20日零时，在雄壮的《义勇军进行曲》乐曲声中，中华人民共和国国旗和中华人民共和国澳门特别行政区区旗在澳门文化中心花园馆庄严升起。从此，澳门历经四百多年葡萄牙管治后回到祖国怀抱，开启了"一国两制"、"澳人治澳"、高度自治的新纪元。国家主席江泽民在交接仪式上庄严宣告中国政府恢复对澳门行使主权。澳门的顺利回归，是继1997年7月1日香港回归后，中华民族在实现祖国统一大业中的又一盛事。它标志着西方殖民者在亚洲领土上的统治彻底结束，具有重大的历史意义和国际影响。澳门回归二十多年来，经济持续繁荣、社会和谐稳定，充分证明了"一国两制"方针的强大生命力。' },

  // 3月22日
  { month: 3, day: 22, year: 1433, title: '郑和最后一次远航归来', type: '中国',
    summary: '1433年3月22日前后，郑和率领明朝远洋船队完成第七次也是最后一次下西洋的壮举。',
    detail: '从1405年到1433年，明朝杰出的航海家郑和奉永乐皇帝和后来的宣德皇帝之命，率领当时世界上最庞大的远洋船队，先后七次出海远航，遍历东南亚、印度洋、阿拉伯海和东非海岸，访问了三十多个国家和地区。郑和的宝船最大的长约150米、宽约60米，可容纳上千人，是当时世界上最大的木质帆船。郑和的船队规模庞大，每次远航都有大小船只二三百艘、人员二万七千余人。相比之下，近一个世纪之后哥伦布发现美洲的船队只有三艘小船和几十人。郑和七下西洋，极大地促进了中国与亚非各国的友好往来和经济文化交流，在世界航海史上写下了辉煌的篇章。1433年，船队在第七次远航归来途中，郑和因积劳成疾在印度古里去世，享年62岁。他的航海壮举比哥伦布发现美洲早了整整半个多世纪，是中华民族的骄傲。' },

  // 2月19日
  { month: 2, day: 19, year: 1997, title: '邓小平同志逝世', type: '中国',
    summary: '1997年2月19日，中国改革开放的总设计师邓小平同志在北京逝世，享年93岁。',
    detail: '1997年2月19日21时08分，中国共产党第二代中央领导集体的核心、中国改革开放和现代化建设的总设计师邓小平同志，因病医治无效在北京逝世，享年93岁。噩耗传来，举国同悲。2月24日，北京人民大会堂举行隆重的追悼大会，江泽民同志致悼词，高度评价邓小平同志伟大光辉的一生。邓小平同志为中国革命、建设、改革事业奋斗了七十多年。他所创立的邓小平理论，是中国共产党在新时期的指导思想，指引中国走上了改革开放、建设中国特色社会主义的伟大道路。他提出的"三个有利于"标准、"发展才是硬道理"、"科学技术是第一生产力"等重要论断，至今仍具有重要指导意义。他虽然没能亲眼看到香港回归，但他生前亲自参与制定的"一国两制"方针已经成功实现。邓小平同志的逝世，是中国共产党和中国人民不可估量的损失。他的业绩和思想将永远铭刻在中华民族的史册上。' },

  // 1月15日
  { month: 1, day: 15, year: 1929, title: '马丁·路德·金诞生', type: '世界',
    summary: '1929年1月15日，美国黑人民权运动领袖马丁·路德·金出生于美国亚特兰大。',
    detail: '马丁·路德·金1929年1月15日出生于美国佐治亚州亚特兰大市一个黑人牧师家庭。他自幼聪慧好学，后获得波士顿大学神学博士学位。受印度圣雄甘地"非暴力不合作"思想的影响，马丁·路德·金成为美国黑人民权运动中最杰出的领袖人物。1963年8月28日，他在华盛顿林肯纪念堂前向聚集的二十五万群众发表了著名演说《我有一个梦想》，成为20世纪最具影响力的演讲之一。他号召人们不分种族、肤色，人人平等，和睦相处。1964年，马丁·路德·金获得诺贝尔和平奖，以表彰他以非暴力方式为美国黑人争取平等权利所做出的杰出贡献。然而1968年4月4日，他在田纳西州孟菲斯市一家旅馆的阳台上被白人种族主义分子刺杀身亡，年仅39岁。他的英年早逝震惊了整个美国和世界。为了纪念他，美国政府将每年一月的第三个星期一定为"马丁·路德·金纪念日"，并将他的出生地改为国家历史公园。他的生日1月15日也被联合国定为"马丁·路德·金国际纪念日"。' },

  // 5月1日
  { month: 5, day: 1, year: 1886, title: '国际劳动节确立', type: '世界',
    summary: '1886年5月1日，美国芝加哥工人大罢工，后成为国际劳动节的起源。',
    detail: '1886年5月1日，美国芝加哥等城市的三十五万工人举行声势浩大的总罢工和示威游行，要求改善劳动条件，实行八小时工作制。工人们的斗争遭到了资产阶级政府的残酷镇压，多名工人在流血冲突中牺牲。但工人们的英勇斗争最终迫使资本家承认了八小时工作制。为了纪念美国工人的这次伟大斗争，1889年7月在巴黎召开的第二国际成立大会上，与会代表一致通过决议，将每年的5月1日定为国际劳动节。从此，五一国际劳动节成为全世界劳动人民团结战斗的节日。1890年5月1日，欧美各国的工人阶级率先走向街头，举行盛大的示威游行与集会，争取合法权益。中国工人阶级第一次大规模纪念五一国际劳动节是在1920年。新中国成立后，政务院于1949年12月正式规定5月1日为劳动节，至今仍是中国重要的法定节日之一。' },

  // 8月8日
  { month: 8, day: 8, year: 2008, title: '北京奥运会开幕', type: '中国',
    summary: '2008年8月8日，第29届夏季奥林匹克运动会在北京国家体育场"鸟巢"隆重开幕。',
    detail: '2008年8月8日晚8时，举世瞩目的第29届夏季奥林匹克运动会开幕式在北京国家体育场"鸟巢"隆重举行。国家主席胡锦涛庄严宣布本届奥运会开幕。这是中国首次举办夏季奥林匹克运动会，也是继1964年东京奥运会和1988年汉城（现首尔）奥运会之后，夏季奥运会第三次在亚洲国家举行。开幕式以气势恢宏的文艺表演展现了中华民族五千年灿烂文明，从四大发明到丝绸之路，从汉字"和"字演变到太极表演，向世界展示了古老而现代的中国。主火炬由前体操王子李宁以"空中飞人"的方式点燃，成为奥运史上最经典的瞬间之一。本届奥运会共有204个国家和地区的代表团、一万一千多名运动员参加，设28个大项、302个小项。中国体育代表团共获得51枚金牌、21枚银牌、28枚铜牌，首次跃居金牌榜首位，创造了历史最好成绩。北京奥运会被誉为"无与伦比的奥运会"，向世界展示了中国的发展成就和人民的精神风貌。' },

  // 11月12日
  { month: 11, day: 12, year: 1937, title: '淞沪会战结束 · 南京大屠杀前夜', type: '中国',
    summary: '1937年11月12日上海失陷，日军随后向南京进犯，中华民族面临空前危机。',
    detail: '1937年8月13日，日军大举进攻上海，中国军队奋起抵抗，历时三个月的淞沪会战由此打响。这是抗日战争中规模最大、战斗最惨烈的战役之一。中国军队先后投入约七十万兵力，日军也增兵至三十余万。中国军队装备虽远落后于日军，但全体将士浴血奋战，表现出了强烈的爱国精神和牺牲精神。谢晋元率"八百壮士"死守四行仓库的事迹，至今仍激励着后人。11月12日，上海最终失陷。日军占领上海后随即沿京沪线西进，直逼当时的中国首都南京。12月13日南京沦陷后，日军在长达六周的时间里，对无辜平民和放下武器的中国士兵进行了惨绝人寰的大屠杀，三十多万同胞遇难，这就是震惊世界的"南京大屠杀"。南京大屠杀是中华民族近代史上最惨痛的一页，也是人类文明史上最黑暗的篇章之一。前事不忘，后事之师。我们铭记这段历史，不是为了延续仇恨，而是为了珍惜今天的和平，为了不让历史的悲剧重演。' },

  // 3月8日
  { month: 3, day: 8, year: 1908, title: '国际妇女节确立', type: '世界',
    summary: '1908年3月8日，美国纽约女工罢工游行，后被定为国际妇女节。',
    detail: '1908年3月8日，美国纽约一万五千名缝纫工人举行大罢工，要求缩短工时、提高工资、获得选举权。她们在游行中打出"面包与玫瑰"的口号，"面包"代表经济保障，"玫瑰"代表更高的生活质量。这次罢工虽然没有立即取得完全成功，但它吹响了全世界劳动妇女争取解放的号角。1910年，第二国际妇女书记处会议在丹麦哥本哈根召开，德国妇女运动领袖蔡特金倡议设立国际妇女节，得到与会代表的热烈响应。从此，3月8日成为全世界劳动妇女团结战斗的节日。1924年3月8日，中国妇女第一次在广州公开纪念国际妇女节。新中国成立后，中央人民政府政务院于1949年12月正式规定3月8日为妇女节，是中国重要的法定节日之一。每年的三八妇女节，全国各地都会举行各种纪念活动，表彰优秀女性，促进男女平等。' },

  // 10月24日
  { month: 10, day: 24, year: 1945, title: '联合国成立', type: '世界',
    summary: '1945年10月24日，《联合国宪章》正式生效，联合国宣告成立。',
    detail: '1945年10月24日，经过中、美、英、苏等主要反法西斯同盟国家的共同努力，《联合国宪章》在美国旧金山正式生效，联合国宣告成立。这一天后来被定为"联合国日"。联合国的成立是第二次世界大战后国际秩序重建的重要标志，也是人类历史上第一个真正具有普遍性的国际组织。联合国总部设在美国纽约，并在日内瓦、维也纳、内罗毕等地设有分支机构。联合国的宗旨是：维护国际和平与安全；发展国际间以尊重各国人民平等权利及自决原则为基础的友好关系；进行国际合作，以解决国际间经济、社会、文化和人道主义性质的问题。中国是联合国的创始会员国之一，也是安全理事会五个常任理事国之一。1971年10月25日，第二十六届联合国大会通过第2758号决议，恢复中华人民共和国在联合国的一切合法权利。今天，联合国已拥有193个会员国，是当今世界最具普遍性、代表性和权威性的国际组织。' },

  // 5月29日
  { month: 5, day: 29, year: 1953, title: '人类首次登顶珠穆朗玛峰', type: '世界',
    summary: '1953年5月29日，新西兰登山家埃德蒙·希拉里和尼泊尔向导丹增·诺尔盖首次登顶珠峰。',
    detail: '1953年5月29日上午11时30分，新西兰登山家埃德蒙·希拉里和尼泊尔夏尔巴族向导丹增·诺尔盖从珠穆朗玛峰东南山脊成功登上世界之巅，成为人类历史上有记录以来第一批站在地球最高点的人。他们在珠穆朗玛峰8848.86米（2020年中国最新测量数据）的顶峰停留了约十五分钟，在那里留下了联合国旗、英国国旗、尼泊尔国旗和一些食物供品。这次成功登顶是人类登山史上的最伟大成就之一，也是英国探险队连续九年尝试攀登珠峰后的第一次成功。希拉里和丹增的壮举极大地激励了全世界。此后，越来越多的登山者踏上珠峰攀登之路。1960年5月25日，中国登山队首次从北坡登上珠穆朗玛峰，王富洲、贡布、屈银华三位队员把五星红旗插上了地球之巅。2020年，中国再次精确测量了珠峰的高度，向世界公布了8848.86米的最新数据。' },

  // 7月27日
  { month: 7, day: 27, year: 1953, title: '朝鲜战争停战协定签署', type: '中国',
    summary: '1953年7月27日，朝鲜停战协定在板门店签署，历时三年的朝鲜战争结束。',
    detail: '1950年6月25日，朝鲜战争爆发。美军为主的"联合国军"随后介入战争，战火很快烧到鸭绿江边，严重威胁新中国的安全。1950年10月25日，中国人民志愿军在彭德怀司令员兼政委的率领下，雄赳赳气昂昂跨过鸭绿江，开始了伟大的抗美援朝战争。历时两年零九个月的战争中，志愿军将士在装备落后、后勤保障困难、冰天雪地的极端条件下，以血肉之躯抗击武装到牙齿的敌人，打退了以美国为首的"联合国军"的多次进攻，用鲜血和生命谱写了一曲曲可歌可泣的英雄史诗。松骨峰阻击战、长津湖战役、上甘岭战役……每一场战斗都感天动地。1953年7月27日，朝鲜停战协定在板门店正式签字，历时三年多的朝鲜战争宣告结束。彭德怀元帅在签字后自豪地说："西方侵略者几百年来只要在东方一个海岸上架起几尊大炮就可以霸占一个国家的时代一去不复返了！"抗美援朝战争的伟大胜利，捍卫了新中国的安全，极大地提高了中国的国际地位，为中国经济建设和社会改革赢得了相对稳定的和平环境。' },

  // 3月21日
  { month: 3, day: 21, year: 1927, title: '上海工人第三次武装起义', type: '中国',
    summary: '1927年3月21日，上海工人发动第三次武装起义，占领上海。',
    detail: '1927年3月21日，在北伐军节节胜利、逼近上海的形势下，上海八十多万工人在周恩来、罗亦农、赵世炎等共产党人领导下举行总罢工，并很快发展为武装起义。工人武装经过三十小时的激烈战斗，击溃了北洋军阀在上海的驻军，于3月22日下午占领了上海除租界以外的全部地区。这是北伐战争期间工人运动发展的最高峰，也是中国工人阶级第一次依靠自己的力量取得的重要胜利。然而，仅仅半个多月后，蒋介石就在上海发动"四一二反革命政变"，对共产党人和革命群众进行血腥屠杀，第一次国共合作破裂，大革命归于失败。' },

  // 4月12日
  { month: 4, day: 12, year: 1927, title: '四一二反革命政变', type: '中国',
    summary: '1927年4月12日，蒋介石在上海发动反革命政变，屠杀共产党人和革命群众。',
    detail: '1927年4月12日凌晨，在帝国主义和买办资产阶级的支持下，蒋介石在上海突然发动反革命政变。早已准备好的青红帮流氓武装从租界冲出，向工人纠察队发起进攻。国民党军队以"调解工人内讧"为名，解除了工人纠察队的武装。4月13日，上海总工会在闸北青云路广场召开大会，抗议蒋介石的反革命行径，会后群众进行示威游行，遭到国民党军队的血腥镇压，当场死亡一百多人，伤者无数。随后几天，蒋介石集团在上海、江苏、浙江、安徽、福建、广东、广西等地展开大规模搜捕和屠杀，一大批共产党人和革命群众倒在血泊之中。据不完全统计，从4月12日到4月15日，上海就有三百多人被杀，五百多人被捕，五千多人失踪。四一二反革命政变标志着第一次国共合作的破裂和大革命的失败，中国革命进入了最艰苦的土地革命战争时期。' },

  // 5月4日（已存在五四运动条目，此处补充另外一条）
  { month: 5, day: 4, year: 1979, title: '撒切尔夫人成为英国首位女首相', type: '世界',
    summary: '1979年5月4日，玛格丽特·撒切尔成为英国历史上第一位女首相。',
    detail: '1979年5月4日，在保守党取得议会选举胜利后，玛格丽特·希尔达·撒切尔（Margaret Hilda Thatcher）正式就任英国首相，成为英国历史上首位女性首相。撒切尔夫人出生于1925年，父亲是一位经营杂货店的商人。她自幼勤奋好学，1943年考入牛津大学萨默维尔学院学习化学，毕业后曾任化学研究员。后来她转而研究法律并考取律师资格，1959年当选下议院议员，正式步入政坛。1975年她击败爱德华·希思成为保守党领袖，也是英国历史上第一位女性政党领袖。在长达十一年的首相任期内（1979—1990），撒切尔夫人推行了一系列被后世称为"撒切尔主义"的经济和社会改革：大力推行国有企业私有化、削弱工会力量、降低税率、放松金融监管。这些改革使英国经济在经历长期"滞胀"后重现活力，也带来了社会分化和争议。她在国际上以强硬立场著称，特别是在1982年英阿马岛战争中果断采取军事行动并取得胜利，为她赢得了"铁娘子"（Iron Lady）的称号。1990年因党内分歧辞职。撒切尔夫人于2013年4月8日因中风去世，享年87岁。她是二十世纪英国最具影响力的政治家之一。' },

  // 6月4日
  { month: 6, day: 4, year: 1942, title: '中途岛海战爆发', type: '世界',
    summary: '1942年6月4日，美日在太平洋中途岛展开海战，成为二战太平洋战场的转折点。',
    detail: '1942年6月4日，日本联合舰队出动几乎全部主力，在山本五十六海军大将指挥下，企图一举攻占太平洋中部的中途岛，消灭美国太平洋舰队的航空母舰主力。然而，美军情报部门通过密码破译，提前掌握了日军的作战计划和兵力部署，在尼米兹海军上将的指挥下，三艘美国航空母舰（企业号、大黄蜂号、约克城号）提前在预定海域设伏。战斗从6月4日凌晨开始，日军舰载机对中途岛进行了空袭，但未能有效摧毁岛上的军事设施。在随后的海战中，美军舰载机抓住日军舰载机正在甲板上补充弹药和油料的有利时机，对日本舰队发动猛烈攻击，一举击沉日本四艘航空母舰（赤城、加贺、苍龙、飞龙），损失飞机约三百三十架。美军仅损失一艘航空母舰（约克城号）、一艘驱逐舰和约一百五十架飞机。中途岛海战是太平洋战争中具有决定性意义的一战。此战之后，日本海军航空兵的精华损失殆尽，再也无力发动大规模战略进攻，太平洋战场的战略主动权从此转入美国手中。这一天成为第二次世界大战中太平洋战场最重要的转折点之一。' },

  // 7月14日
  { month: 7, day: 14, year: 1789, title: '法国大革命攻占巴士底狱', type: '世界',
    summary: '1789年7月14日，巴黎人民攻占象征专制王权的巴士底狱，法国大革命爆发。',
    detail: '1789年7月14日，巴黎人民武装起义，攻占了象征法国封建专制王权的巴士底狱（Bastille），这一天被视为法国大革命的开端。巴士底狱是一座位于巴黎东部的要塞和国家监狱，关押着政府认定的政治犯，成为法国人民心目中专制压迫的象征。攻占巴士底狱的消息迅速传遍法国各地，各地市民纷纷效仿，掀起了全国性的革命浪潮。8月4日，制宪议会通过决议，废除贵族和教会的一切封建特权。8月26日，议会通过了著名的《人权宣言》，宣告"人生而自由，在权利上是平等的"。法国大革命彻底改变了法国乃至整个欧洲的历史进程，它推翻了统治法国长达数百年的波旁王朝，结束了封建专制制度，传播了"自由、平等、博爱"的资产阶级革命思想，深刻影响了19世纪世界政治发展的方向。7月14日后来被定为法国国庆日，至今仍是法国最重要的国家节日。' },

  // 8月1日
  { month: 8, day: 1, year: 1927, title: '南昌起义 · 八一建军节', type: '中国',
    summary: '1927年8月1日，中国共产党领导发动南昌起义，打响了武装反抗国民党反动派的第一枪。',
    detail: '1927年，第一次国内革命战争失败后，国民党反动派疯狂屠杀共产党人和革命群众，中国革命陷入低潮。在这危急关头，中共中央决定在江西南昌发动武装起义。8月1日凌晨，在以周恩来为书记的中共前敌委员会领导下，贺龙、叶挺、朱德、刘伯承等率领党所掌握和影响下的军队两万多人，在南昌城打响了武装反抗国民党反动派的第一枪。经过四个多小时的激烈战斗，起义军全歼南昌城内的守敌三千余人，占领了南昌城。南昌起义后，国民党反动派调集军队向南昌反扑。8月3日起，起义军按原定计划分批撤出南昌，南下广东。南昌起义虽然最终没有能够在广东建立起新的革命根据地，但它作为中国共产党独立领导革命战争、创建人民军队和武装夺取政权的伟大开端而载入史册。1933年7月11日，中华苏维埃共和国临时中央政府决定，将8月1日定为中国工农红军成立纪念日。1949年6月15日，中国人民革命军事委员会发布命令，规定以"八一"二字作为中国人民解放军军旗和军徽的主要标志。中华人民共和国成立后，将此纪念日改称为中国人民解放军建军节。从此，"八一"成为人民军队的光荣标志。' },

  // 9月9日
  { month: 9, day: 9, year: 1976, title: '毛泽东同志逝世', type: '中国',
    summary: '1976年9月9日，中国共产党、中国人民解放军和中华人民共和国的缔造者毛泽东与世长辞。',
    detail: '1976年9月9日零时10分，中国共产党中央委员会主席、中国共产党中央军事委员会主席、中国人民政治协商会议全国委员会名誉主席毛泽东同志在北京因病医治无效不幸逝世，享年八十三岁。噩耗传来，举国同悲，万民痛哭。9月18日下午3时，首都百万群众在天安门广场举行隆重的追悼大会，华国锋同志致悼词，高度评价了毛泽东同志伟大而光辉的一生。全国各地也纷纷举行各种形式的悼念活动。联合国也为毛泽东逝世降半旗致哀，世界上一百二十多个国家的政党和政府发来唁电或唁函，表达对这位中国人民伟大领袖的深切哀悼。毛泽东同志是中国共产党、中国人民解放军和中华人民共和国的主要缔造者和领导人，是伟大的马克思主义者、伟大的无产阶级革命家、战略家、理论家。他领导中国人民经过二十八年艰苦卓绝的新民主主义革命，推翻了帝国主义、封建主义和官僚资本主义的统治，实现了民族独立和人民解放，建立了人民当家作主的新中国。他对中国革命和建设事业建立的丰功伟绩，在中国人民心中具有至高无上的地位。毛泽东同志的逝世，是中国共产党和中国人民不可估量的损失。' },

  // 10月1日（补充事件）
  { month: 10, day: 1, year: 1964, title: '日本新干线正式运营', type: '世界',
    summary: '1964年10月1日，世界上第一条高速铁路——日本东海道新干线正式通车运营。',
    detail: '1964年10月1日，就在东京奥运会开幕前夕，日本第一条高速铁路——连接东京和大阪的东海道新干线正式通车运营。这是人类历史上第一条实用化的高速铁路，被誉为"世界铁道史上的大革命"。新干线列车采用先进的动力分散式牵引技术，运行速度达到每小时210公里，把原来需要六个多小时的东京到大阪路程缩短到三个小时。新干线的开通极大地改变了日本的社会经济生活，缩短了大城市之间的时空距离，促进了人员流动和经济发展。它的成功也推动了世界各国发展高速铁路的进程。此后，法国、德国、意大利、西班牙等国相继建成自己的高速铁路系统。2003年10月12日，中国第一条真正意义上的高速铁路秦沈客运专线正式投入运营；2008年8月1日，京津城际高铁通车，标志着中国高铁时代的全面到来。如今，中国高铁运营总里程已超过四万公里，稳居世界第一，成为中国现代化建设的亮丽名片。' },

  // 11月11日
  { month: 11, day: 11, year: 1918, title: '第一次世界大战结束', type: '世界',
    summary: '1918年11月11日，德国签署停战协定，第一次世界大战正式结束。',
    detail: '1918年11月11日上午5时，德国代表在法国贡比涅森林的一节火车车厢中，与协约国联军总司令福煦元帅签署了停战协定。协定规定，德国必须在十五天内撤出所有占领的领土，并交出大量军事物资。协定于当日上午11时正式生效。这一天标志着历时四年零三个月的第一次世界大战正式结束。第一次世界大战从1914年7月28日奥匈帝国向塞尔维亚宣战开始，到1918年11月11日德国投降为止，战火席卷了欧洲、非洲、亚洲的广大地区。战争造成了人类历史上前所未有的巨大人员伤亡和物质损失：据统计，直接参战的军队约有六千五百万人，其中约八百五十万人阵亡，二千一百万人受伤，另外还有约七百万平民死于战争引起的饥荒、疾病和屠杀。战争导致欧洲四大帝国（俄罗斯帝国、德意志帝国、奥匈帝国、奥斯曼帝国）相继崩溃，世界政治格局发生深刻变化。战后召开的巴黎和会和华盛顿会议建立了所谓的"凡尔赛—华盛顿体系"，但这一体系本身矛盾重重，仅维持了二十多年就被新的世界大战所打破。' },

  // 12月26日
  { month: 12, day: 26, year: 1893, title: '毛泽东同志诞生', type: '中国',
    summary: '1893年12月26日，毛泽东出生于湖南省湘潭县韶山冲一个农民家庭。',
    detail: '1893年12月26日，毛泽东出生在湖南省湘潭县韶山冲（今属韶山市）一个农民家庭。父亲毛贻昌（毛顺生）是一个勤劳能干的农民，靠辛苦劳作逐渐摆脱贫困成为中农；母亲文七妹是一位善良虔诚的佛教徒。毛泽东从小在私塾接受中国传统教育，熟读四书五经，同时也偷偷阅读《水浒传》《三国演义》《西游记》等中国古典小说。1910年秋天，十七岁的毛泽东离开家乡到东山高等小学堂读书，写下了"孩儿立志出乡关，学不成名誓不还。埋骨何须桑梓地，人生无处不青山"的诗句表达远大志向。此后他先后到长沙、北京等地求学和工作，逐步接触到马克思主义，并成为中国共产党的创始人之一。毛泽东的诞辰——12月26日，至今仍是中国人民深切缅怀和纪念的日子。他的思想和精神，作为毛泽东思想，已被写入党章和宪法，成为中国共产党和中国人民宝贵的精神财富。毛泽东同志的一生，是为中华民族独立、中国人民解放和国家富强而奋斗的一生，他的丰功伟绩将永远被中国人民铭记。' },

  // 2月12日
  { month: 2, day: 12, year: 1912, title: '清宣统帝溥仪退位', type: '中国',
    summary: '1912年2月12日，清朝最后一位皇帝溥仪下诏退位，中国两千多年的封建帝制结束。',
    detail: '1912年2月12日，隆裕太后代表年仅六岁的宣统皇帝溥仪，在紫禁城养心殿颁发了《清帝退位诏书》，宣布"将统治权公诸全国，定为共和立宪国体"。这道诏书的颁布，标志着清朝二百六十八年的统治正式结束，同时也标志着在中国延续了两千多年的封建君主专制制度的终结。诏书中明确写道："即由袁世凯以全权组织临时共和政府，与民军协商统一办法。"清帝能够和平退位，与孙中山领导的辛亥革命、袁世凯的政治斡旋以及当时国内外的复杂形势都有密切关系。清帝退位后，根据南京临时政府制定的《关于大清皇帝辞位之后优待之条件》，溥仪仍保留皇帝尊号，继续住在紫禁城内，民国政府每年拨付四百万元作为皇室经费。这种"小朝廷"的状况一直持续到1924年冯玉祥发动"北京政变"，才将溥仪彻底赶出紫禁城。溥仪后来曾被日本人利用，在东北担任伪"满洲国"皇帝，成为日本侵华的工具。抗战胜利后，他被苏军俘虏，后被遣送回国，在抚顺战犯管理所接受改造，最终成为新中国的普通公民。溥仪一生当过三次皇帝，经历之曲折离奇，在中国乃至世界历史上都极为罕见。' },

  // 1月25日
  { month: 1, day: 25, year: 1924, title: '第一届冬季奥林匹克运动会开幕', type: '世界',
    summary: '1924年1月25日，第一届冬季奥林匹克运动会在法国夏蒙尼开幕。',
    detail: '1924年1月25日至2月4日，第一届冬季奥林匹克运动会在法国东部的夏蒙尼（Chamonix）举行，共有十六个国家的二百五十八名运动员参加了六个大项十四个小项的比赛。首届冬奥会实际上最初被称为"国际冬季运动周"，是同年巴黎夏季奥运会的附属活动。由于取得了巨大成功，国际奥委会后来追认它为第一届冬季奥运会。挪威、芬兰、奥地利等北欧和阿尔卑斯国家在首届冬奥会上表现出色，挪威以四枚金牌位列榜首。1896年第一届现代奥运会在雅典举办以来，冬季项目（如滑冰）曾短暂出现在早期奥运会中，但由于时间和场地的原因，始终未能成为奥运会的重要组成部分。1921年国际奥委会洛桑会议决定举办独立的冬季奥运会。从此，冰雪运动正式登上奥林匹克大家庭的舞台。迄今为止，冬奥会已举办了二十四届，成为与夏季奥运会并驾齐驱的世界顶级体育盛会。2022年2月4日至20日，第24届冬季奥林匹克运动会在中国北京和张家口举行，这是中国历史上首次举办冬季奥运会，北京也因此成为奥运史上第一个既举办过夏季奥运会、又举办过冬季奥运会的"双奥之城"。' },

  // 3月5日
  { month: 3, day: 5, year: 1898, title: '周恩来同志诞生', type: '中国',
    summary: '1898年3月5日，周恩来出生于江苏省淮安市一个没落的封建官僚家庭。',
    detail: '1898年3月5日，周恩来出生在江苏省淮安府山阳县（今淮安市淮安区）一个逐渐衰落的封建官僚家庭。字翔宇，小名大鸾。他的祖父周起魁曾任淮安府山阳县知县，在当地颇有声望。但到周恩来出生时，家庭已经开始衰落。周恩来从小过继给无后的叔父为子，由养母陈氏抚养长大。陈氏出身书香门第，擅长诗文书画，对周恩来的早期教育影响很大。不幸的是，在周恩来不到十岁时，生母和养母相继去世，他不得不带着两个弟弟回到绍兴老家，过着相当清贫的生活。艰难的少年时代培养了他吃苦耐劳、独立自主的品格。1913年，十五岁的周恩来考入天津南开学校，开始了他丰富多彩的青年时代。在南开，他品学兼优、积极参加各种社团活动，展现出卓越的组织和领导才能。1917年他赴日本留学，1919年回国后积极参加五四运动，成为天津学生界的领导人，并与马骏、郭隆真、邓颖超等人组织进步团体"觉悟社"。1920年11月，周恩来赴法国勤工俭学，在那里接受了马克思主义，于1921年加入中国共产党，成为中国共产党最早的党员之一。此后他把毕生精力无私地奉献给了中国革命和建设事业。周恩来同志是伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家，党和国家主要领导人之一，中国人民解放军主要创建人之一，中华人民共和国开国总理。他的卓著功勋、崇高品德、光辉人格，深深铭记在全国各族人民心中。1976年1月8日，周恩来同志在北京与世长辞，享年七十八岁。他的逝世引起了全国人民的无限悲痛，首都百万群众自发伫立在十里长街，寒风中为总理灵车送行，这一幕成为中国人民心中永远的记忆。' },

  // 4月30日
  { month: 4, day: 30, year: 1945, title: '希特勒自杀 · 欧洲反法西斯战争即将胜利', type: '世界',
    summary: '1945年4月30日，纳粹德国元首希特勒在柏林总理府地下室自杀，德国法西斯濒临崩溃。',
    detail: '1945年4月30日下午3时30分左右，在苏联红军已经攻入柏林市区、兵临总理府城下的情况下，纳粹德国元首阿道夫·希特勒在位于柏林威廉大街总理府地下的避弹室中自杀身亡。他与刚结婚的情妇爱娃·布劳恩双双服毒，希特勒同时还向自己的头部开了一枪。按照他的临终吩咐，卫兵将他和爱娃的尸体抬到总理府花园中浇上汽油火化。希特勒的死标志着纳粹德国法西斯政权的彻底崩溃。5月2日，柏林卫戍司令魏德林率部向苏军投降。5月8日深夜，德国代表在柏林近郊的卡尔斯霍斯特正式签署无条件投降书，欧洲反法西斯战争胜利结束。希特勒发动的这场战争给欧洲和世界人民带来了空前的灾难。据不完全统计，二战期间全球约有七千万至八千五百万人死亡，其中苏联一国就死亡约二千七百万人，中国死亡约三千五百万人。希特勒作为人类历史上最凶恶的独裁者和战争罪犯之一，他的名字将永远与"种族灭绝""法西斯暴政"等词汇联系在一起，被永远钉在历史的耻辱柱上。' },

  // 5月12日
  { month: 5, day: 12, year: 2008, title: '四川汶川发生特大地震', type: '中国',
    summary: '2008年5月12日14时28分，四川省汶川县发生里氏8.0级特大地震，造成重大人员伤亡和财产损失。',
    detail: '2008年5月12日14时28分04秒，四川省阿坝藏族羌族自治州汶川县发生里氏8.0级（后修订为面波震级8.0级、矩震级8.3级）强烈地震，震中位于北纬31.01度、东经103.42度，震源深度约14公里。这是继1976年唐山大地震后，新中国成立以来破坏性最强、波及范围最广、灾害损失最重、救灾难度最大的一次地震。地震波及四川、甘肃、陕西、重庆等十几个省区市，受灾面积超过五十万平方公里。汶川大地震造成了极其惨重的人员伤亡和财产损失：截至2008年9月25日，确认遇难六万九千二百二十七人，失踪一万七千九百二十三人，受伤三十七万四千六百四十三人，直接经济损失达八千四百五十一亿元。许多乡镇几乎被夷为平地，北川县城、映秀镇等城镇几乎被完全摧毁。地震发生后，党中央、国务院迅速作出部署，开展了一场史无前例的抗震救灾行动。胡锦涛总书记、温家宝总理等党和国家领导人第一时间亲临灾区指挥抗震救灾。人民解放军、武警部队、公安干警、民兵预备役人员共计约十三万人迅速集结灾区开展救援。全国人民和海外同胞踊跃捐款捐物，志愿者从四面八方赶赴灾区。"一方有难、八方支援"的精神在这一特殊时刻得到了最充分的体现。在抗震救灾中涌现出许多感人事迹，许多教师用自己的身躯掩护学生脱险，许多母亲用最后的姿势保护怀中的孩子。5月19日至21日，全国举行哀悼活动，表达对遇难同胞的深切悼念。经过三年艰苦卓绝的灾后恢复重建，一座座崭新的城镇在废墟上拔地而起，灾区人民的生活逐步恢复正常。汶川大地震虽然给中国人民带来了巨大伤痛，也展现了中华民族众志成城、团结一心、不屈不挠、敢于胜利的伟大精神。' },

  // 6月22日
  { month: 6, day: 22, year: 1941, title: '德国撕毁苏德互不侵犯条约 · 苏德战争爆发', type: '世界',
    summary: '1941年6月22日，纳粹德国撕毁苏德互不侵犯条约，对苏联发动突然袭击，苏德战争爆发。',
    detail: '1939年8月23日，苏联与德国在莫斯科签订了《苏德互不侵犯条约》，双方约定十年内互不侵犯，并在东欧划分了势力范围。这一条约使苏联暂时避免了两线作战的危险，也使德国在进攻波兰时避免了后顾之忧。然而，希特勒从一开始就没有真正打算长期遵守这个条约。1941年6月22日凌晨3时，纳粹德国悍然撕毁条约，出动一百九十个师共约五百五十万兵力、四千架飞机、三千七百辆坦克、四万七千门大炮，在从波罗的海到黑海的长达一千八百公里的战线上，分三路向苏联发动突然袭击。这就是代号为"巴巴罗萨计划"的侵苏战争。战争初期，苏军由于准备不足、指挥失当，遭受了极为惨重的损失，在不到五个月的时间里，损失兵力约四百万，西部大片领土沦陷，德军兵临莫斯科城下。然而苏联人民并未屈服，在斯大林的领导下迅速转入战时状态，进行了艰苦卓绝的卫国战争。1941年12月的莫斯科会战粉碎了德军"闪电战"的神话，1942年7月至1943年2月的斯大林格勒会战成为整个第二次世界大战的转折点。此后苏军转入反攻，经过库尔斯克会战、十次斯大林式打击等一系列战役，一步步把侵略者赶出苏联国土，并最终于1945年5月攻克柏林，赢得了苏德战争的最终胜利。苏德战争是第二次世界大战中规模最大、战斗最激烈、伤亡最惨重的战场，双方累计死伤超过四千万人，战争的惨烈程度在人类历史上罕见。' },

  // 10月10日
  { month: 10, day: 10, year: 1911, title: '武昌起义 · 辛亥革命爆发', type: '中国',
    summary: '1911年10月10日，湖北武昌新军发动起义，打响了辛亥革命的第一枪。',
    detail: '1911年10月10日（农历八月十九日）晚，湖北武昌的革命党人发动武装起义，打响了辛亥革命的第一枪。这一年是中国农历辛亥年，因此这次推翻清朝的革命被称为辛亥革命。武昌起义的直接导火索是四川保路运动的高涨。1911年5月，清政府宣布"铁路国有"政策，将已划归民间商办的川汉、粤汉铁路收回，转手出让给外国银行团，激起了四川、湖南、湖北、广东四省人民的强烈反对。四川人民的反抗最为激烈，发展为武装暴动。清政府被迫从湖北等地抽调军队入川镇压，造成武昌守备空虚。早已在湖北新军中秘密发展革命力量的文学社和共进会两大革命团体，抓住这一有利时机，决定于10月16日发动起义。不料10月9日，革命党人在汉口俄租界配制炸弹时不慎引起爆炸，俄租界巡捕闻声赶来，搜走了起义的旗帜、文告、弹药和党人名册，并转交清政府。湖广总督瑞澂下令按名单搜捕革命党人，武汉三镇顿时笼罩在白色恐怖之中。在这万分危急的时刻，10月10日晚7时许，驻武昌的新军工程第八营革命党人熊秉坤、金兆龙等毅然打响了第一枪。起义士兵迅速占领楚望台军械库，随后步、炮、辎重各营纷纷响应，经过一夜激战，攻克湖广总督署，占领武昌全城。11日晚和12日凌晨，驻汉阳、汉口的新军也先后起义，武汉三镇全部光复。武昌起义胜利后，革命党人成立了湖北军政府，推举黎元洪为都督。武昌起义的胜利，在全国范围内产生了巨大影响，各省纷纷响应，短短两个月内，湖南、陕西、江西、山西、云南、贵州、江苏、浙江、广西、安徽、福建、广东、四川等省先后宣布独立，清王朝的统治迅速土崩瓦解。1912年1月1日，中华民国临时政府在南京成立，孙中山就任临时大总统。2月12日，清宣统帝溥仪下诏退位，统治中国二百六十八年的清王朝灭亡，在中国延续两千多年的封建君主专制制度至此终结。辛亥革命是中国近代史上一次伟大的资产阶级民主革命，它推翻了清朝的腐朽统治，结束了中国两千多年的封建君主专制制度，建立了资产阶级民主共和国，使民主共和的观念深入人心。10月10日这一天后来被定为中华民国的"双十节"。' },

  // 2月2日
  { month: 2, day: 2, year: 1943, title: '斯大林格勒战役胜利结束', type: '世界',
    summary: '1943年2月2日，被围困的德军在斯大林格勒投降，苏德战场和二战的转折点出现。',
    detail: '1943年2月2日，被苏联红军围困在斯大林格勒城内的德军第六集团军残部，在司令官保卢斯元帅率领下放下武器投降。至此，历时六个半月的斯大林格勒战役以苏联的辉煌胜利告终。斯大林格勒（现名伏尔加格勒）位于伏尔加河下游西岸，是连接苏联南北的水陆交通枢纽，也是重要的工业城市。1942年夏天，希特勒发动了旨在夺取高加索油田和伏尔加河流域的大规模夏季攻势。7月中旬，德军兵临斯大林格勒城下。从1942年7月17日战役正式打响，到1943年2月2日结束，这场战役经历了异常惨烈的城市巷战阶段和苏军围歼阶段。在城市巷战中，德军曾一度占领市区的百分之九十，但始终无法完全占领全城。苏军士兵以大无畏的精神与敌人展开逐屋逐街的争夺，每一条街道、每一座建筑、每一层楼都经过反复争夺。1942年11月19日，苏军在朱可夫元帅指挥下发动代号为"天王星行动"的大规模反攻，迅速在德军两翼突破并完成对德军第六集团军的合围。被围的三十三万德军在零下三四十摄氏度的严寒中弹尽粮绝，最终于1943年2月2日全军覆没。斯大林格勒战役是苏德战争中规模最大、最为惨烈的一场战役，双方累计伤亡超过二百万人。这场战役不仅是苏德战争的转折点，也是整个第二次世界大战的战略转折点——从此纳粹德国再也无力发动大规模战略进攻，战争的主动权彻底转到了反法西斯同盟国一方。' },

  // 9月21日
  { month: 9, day: 21, year: 1949, title: '中国人民政治协商会议第一届全体会议开幕', type: '中国',
    summary: '1949年9月21日，中国人民政治协商会议第一届全体会议在北平开幕，为新中国成立做准备。',
    detail: '1949年9月21日至30日，中国人民政治协商会议第一届全体会议在北平中南海怀仁堂隆重举行。参加会议的代表共六百六十二人，代表着中国共产党、各民主党派、各人民团体、人民解放军、各地区、各民族以及海外华侨等各方面力量。毛泽东在会上致开幕词，他庄严宣告："占人类总数四分之一的中国人从此站立起来了！"这次会议代行全国人民代表大会的职权，通过了具有临时宪法性质的《中国人民政治协商会议共同纲领》，以及《中国人民政治协商会议组织法》《中华人民共和国中央人民政府组织法》等重要文件。会议决定：中华人民共和国的国都定于北平，自即日起改名为北京；中华人民共和国采用公元纪年；在中华人民共和国国歌未正式制定以前，以《义勇军进行曲》为代国歌；中华人民共和国的国旗为五星红旗。9月30日，会议选举毛泽东为中央人民政府主席，朱德、刘少奇、宋庆龄、李济深、张澜、高岗为副主席，陈毅等五十六人为中央人民政府委员。会议还决定在北京天安门广场建立人民英雄纪念碑，以纪念为中华民族独立和中国人民解放事业而英勇牺牲的革命先烈。会议闭幕当天，毛泽东带领全体政协代表来到天安门广场，为人民英雄纪念碑举行了隆重的奠基典礼。中国人民政治协商会议第一届全体会议的召开，标志着一百多年来中国人民争取民族独立和人民解放运动取得了历史性的伟大胜利，标志着中华人民共和国的筹建工作基本完成。十天之后的10月1日，毛泽东在北京天安门城楼上庄严宣告中华人民共和国中央人民政府成立。' },

  // 11月18日
  { month: 11, day: 18, year: 1978, title: '中共十一届三中全会在北京召开', type: '中国',
    summary: '1978年12月18日至22日，中共十一届三中全会在北京召开，开启了改革开放历史新时期。',
    detail: '1978年12月18日至22日，中国共产党第十一届中央委员会第三次全体会议在北京召开。出席会议的中央委员一百六十九人、候补中央委员一百一十二人。在此之前，1978年11月10日至12月15日，中共中央召开了历时三十六天的中央工作会议，为十一届三中全会作了充分准备。在中央工作会议闭幕会上，邓小平作了题为《解放思想，实事求是，团结一致向前看》的重要讲话，为全会确定了具有重大意义的指导思想。十一届三中全会高度评价了关于实践是检验真理的唯一标准问题的讨论，果断地停止使用"以阶级斗争为纲"的口号，作出了把党和国家的工作重心转移到社会主义现代化建设上来、实行改革开放的历史性决策。会议还审查和解决了党的历史上一批重大冤假错案和一些重要领导人的功过是非问题。全会增选陈云为中央委员会副主席，增选邓颖超、胡耀邦、王震为中央政治局委员；选举产生了由陈云任第一书记的中央纪律检查委员会。中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折，它从根本上冲破了长期"左"倾错误的严重束缚，端正了党的指导思想，重新确立了马克思主义的思想路线、政治路线和组织路线，形成了以邓小平同志为核心的党的第二代中央领导集体。全会结束了1976年10月以来党的工作在徘徊中前进的局面，开始全面认真地纠正"文化大革命"中及其以前的"左"倾错误，开辟了建设中国特色社会主义的新道路。以这次全会为标志，中国进入了改革开放和社会主义现代化建设的历史新时期。从此，中国共产党在新中国成立以来对社会主义建设道路的探索，进入了一个以改革开放和现代化建设为主要内容的新阶段。四十多年来，中国人民在改革开放的伟大征程上取得了举世瞩目的巨大成就，国家面貌发生了翻天覆地的变化。' },

  // 4月14日
  { month: 4, day: 14, year: 2010, title: '青海玉树发生7.1级强烈地震', type: '中国',
    summary: '2010年4月14日，青海玉树发生7.1级强烈地震，造成重大人员伤亡。',
    detail: '2010年4月14日7时49分，青海省玉树藏族自治州玉树县发生里氏7.1级强烈地震，震源深度约14公里。由于震中地处玉树藏族自治州州府所在地结古镇一带，人口相对密集，加上当地房屋抗震性能较差，地震造成了严重的人员伤亡和财产损失。截至2010年5月30日18时，经青海省和相关部门核定，玉树地震已造成二千六百九十八人遇难，二百七十人失踪，十二万多人受伤。大量房屋倒塌，交通、电力、通讯等基础设施严重受损。地震发生后，党中央、国务院高度重视，胡锦涛总书记、温家宝总理多次作出重要指示，要求全力做好抗震救灾工作。全国人民迅速行动起来，一场全国上下众志成城的抗震救灾行动迅速展开。人民解放军、武警部队、公安消防部队和各类专业救援队伍第一时间赶赴灾区，在高原缺氧、气候寒冷、交通不便等极其困难的条件下展开搜救工作。4月21日被定为全国哀悼日，举国上下深切哀悼玉树地震遇难同胞。在抗震救灾和灾后重建中，涌现出了许多感人至深的事迹。玉树地震灾后恢复重建工作历时约三年，到2013年基本完成，一座在废墟上崛起的新玉树展现在世人面前。玉树抗震救灾充分展现了中华民族"一方有难、八方支援"的伟大精神，也彰显了党和政府应对重大自然灾害的强大组织和动员能力。' },

  // ========== 中国古代重要事件 ==========
  
  // 夏朝建立
  { month: 1, day: 1, year: -2070, title: '夏朝建立', type: '中国',
    summary: '约公元前2070年，禹建立夏朝，标志着中国第一个王朝的诞生。',
    detail: '约公元前2070年，禹在阳城（今河南登封）建立夏朝，这是中国历史上第一个世袭制王朝。禹因治水有功，被推举为部落联盟首领，他结束了原始部落联盟的禅让制，将王位传给儿子启，开启了"家天下"的世袭制度。夏朝统治长达约470年，历经17位君主。夏朝的建立标志着中国从原始社会进入奴隶社会，国家形态开始形成。夏朝创造了早期的历法（夏小正），发展了农业生产，建立了初步的官僚体系和军队。夏朝最后一位君主桀因暴虐无道，被商汤推翻，夏朝灭亡。' },

  // 商朝建立
  { month: 1, day: 1, year: -1600, title: '商朝建立', type: '中国',
    summary: '约公元前1600年，商汤灭夏，建立商朝，甲骨文开始出现。',
    detail: '约公元前1600年，商部落首领商汤在鸣条之战中打败夏朝最后一位君主桀，建立商朝，定都亳（今河南商丘）。商朝是中国历史上第二个王朝，统治约600年，历经31位君主。商朝中期多次迁都，最后定都殷（今河南安阳），因此商朝也被称为"殷商"。商朝最伟大的成就是甲骨文的出现，这是中国目前发现的最早的成熟文字，刻写在龟甲和兽骨上，主要用于占卜。商朝的青铜器制造技术达到了很高水平，著名的司母戊鼎（后母戊鼎）就是这一时期的杰作。商朝最后一位君主纣王因荒淫残暴，被周武王推翻。' },

  // 周朝建立
  { month: 1, day: 1, year: -1046, title: '周朝建立', type: '中国',
    summary: '公元前1046年，周武王灭商，建立周朝，实行分封制和宗法制。',
    detail: '公元前1046年，周武王姬发率领诸侯联军在牧野之战中打败商纣王，建立周朝，定都镐京（今陕西西安），史称西周。周朝是中国历史上统治时间最长的王朝，达800多年。周朝实行分封制，周天子将土地和人民分封给宗室、功臣和先代贵族，建立诸侯国。同时实行宗法制，以血缘关系为纽带维护统治秩序。周朝还制定了完备的礼乐制度，对中国文化产生了深远影响。公元前770年，周平王迁都洛邑（今河南洛阳），史称东周，分为春秋和战国两个时期。' },

  // 秦始皇统一中国
  { month: 1, day: 1, year: -221, title: '秦始皇统一中国', type: '中国',
    summary: '公元前221年，秦始皇嬴政统一六国，建立中国历史上第一个大一统王朝。',
    detail: '公元前221年，秦王嬴政先后消灭韩、赵、魏、楚、燕、齐六国，完成统一大业，建立秦朝，定都咸阳。嬴政自称"始皇帝"，成为中国历史上第一个皇帝。秦始皇统一后采取了一系列巩固统一的措施：统一文字（小篆）、统一度量衡、统一货币、统一车轨；修筑万里长城抵御匈奴；修建驰道加强全国交通；实行郡县制取代分封制，加强中央集权。秦始皇还下令焚书坑儒，对文化造成了一定破坏。秦朝虽然只存在了15年，但它奠定了中国两千多年封建制度的基础，对中国历史产生了深远影响。' },

  // 汉朝建立
  { month: 2, day: 28, year: -202, title: '汉朝建立', type: '中国',
    summary: '公元前202年，刘邦建立汉朝，开启中国历史上最强盛的朝代之一。',
    detail: '公元前202年，刘邦在楚汉战争中击败项羽，统一天下，建立汉朝，定都长安（今陕西西安），史称西汉。汉朝分为西汉和东汉两个时期，共历29位皇帝，统治400多年。汉初实行休养生息政策，国力逐渐恢复。汉武帝时期达到鼎盛，政治上加强中央集权，经济上盐铁官营，文化上独尊儒术，军事上北击匈奴，开辟丝绸之路。汉朝是中国历史上第一个长期稳定的大一统王朝，奠定了汉族的民族认同，对中国政治、经济、文化的发展产生了深远影响。' },

  // 三国时期开始
  { month: 12, day: 10, year: 220, title: '三国时期开始', type: '中国',
    summary: '220年，曹丕篡汉建魏，三国鼎立局面正式形成。',
    detail: '220年，曹操之子曹丕逼迫汉献帝禅位，建立魏国，定都洛阳，东汉灭亡。次年，刘备在成都称帝，建立蜀汉；229年，孙权在建业（今江苏南京）称帝，建立东吴。至此，三国鼎立的局面正式形成。三国时期是中国历史上一个英雄辈出的时代，涌现出曹操、刘备、孙权、诸葛亮、关羽、张飞等著名历史人物。这一时期战争频繁，但也促进了文化和科技的发展。263年，魏灭蜀；265年，司马炎篡魏建立晋朝；280年，晋灭吴，三国时期结束，中国重新统一。' },

  // 唐朝建立
  { month: 6, day: 18, year: 618, title: '唐朝建立', type: '中国',
    summary: '618年，李渊建立唐朝，开启中国历史上的黄金时代。',
    detail: '618年，唐国公李渊在晋阳起兵，推翻隋朝，建立唐朝，定都长安（今陕西西安）。唐朝是中国历史上最强盛的朝代之一，政治开明、经济繁荣、文化灿烂、国力强盛。唐太宗李世民开创"贞观之治"，唐玄宗时期达到"开元盛世"的顶峰。唐朝实行开放的对外政策，与周边国家和地区交流频繁，丝绸之路更加繁荣。唐朝文化成就辉煌，诗歌、书法、绘画、音乐等都达到了很高水平，出现了李白、杜甫、白居易等伟大诗人。唐朝共历21位皇帝，统治近300年，对中国和世界历史都产生了深远影响。' },

  // 宋朝建立
  { month: 1, day: 1, year: 960, title: '宋朝建立', type: '中国',
    summary: '960年，赵匡胤发动陈桥兵变，建立宋朝，开启中国历史上经济文化最繁荣的时期。',
    detail: '960年，后周大将赵匡胤在陈桥驿发动兵变，黄袍加身，建立宋朝，定都开封（东京），史称北宋。宋朝分为北宋和南宋两个时期，共历18位皇帝，统治319年。宋朝实行重文轻武政策，文化教育高度发达，科技进步显著，四大发明中的活字印刷术、指南针、火药都在这一时期得到广泛应用和发展。宋朝经济繁荣，商业发达，出现了世界上最早的纸币"交子"。文学方面，宋词达到鼎盛，出现了苏轼、李清照、辛弃疾等著名词人。1127年，金兵攻陷开封，北宋灭亡；赵构南迁建立南宋，定都临安（今浙江杭州）。1279年，南宋被元朝灭亡。' },

  // 元朝建立
  { month: 12, day: 18, year: 1271, title: '元朝建立', type: '中国',
    summary: '1271年，忽必烈建立元朝，这是中国历史上第一个由少数民族建立的大一统王朝。',
    detail: '1271年，蒙古大汗忽必烈改国号为"大元"，正式建立元朝，定都大都（今北京）。1279年，元朝消灭南宋残余势力，完成全国统一。元朝是中国历史上疆域最辽阔的朝代，其疆域东起日本海，西至天山山脉，北抵贝加尔湖，南达南海。元朝实行行省制度，加强了中央对地方的控制，这一制度对后世影响深远。元朝时期，中外交流频繁，马可·波罗等外国旅行家来到中国，促进了东西方文化交流。元朝还开通了京杭大运河，加强了南北经济联系。1368年，朱元璋率领农民起义军推翻元朝，建立明朝。' },

  // 明朝建立
  { month: 1, day: 23, year: 1368, title: '明朝建立', type: '中国',
    summary: '1368年，朱元璋建立明朝，恢复汉族统治，加强中央集权。',
    detail: '1368年，农民起义军领袖朱元璋在应天府（今江苏南京）称帝，建立明朝，年号洪武。朱元璋采取一系列措施加强中央集权，废除丞相制度，设立三司，加强皇权。明朝初期实行休养生息政策，农业生产逐渐恢复。明成祖朱棣时期，迁都北京，修建紫禁城，派郑和下西洋，加强了与海外各国的联系。明朝文化科技成就显著，出现了《永乐大典》《本草纲目》《天工开物》等重要著作。明朝中后期，商品经济发达，出现了资本主义萌芽。1644年，李自成率领农民起义军攻占北京，明朝灭亡。' },

  // 清朝建立
  { month: 5, day: 15, year: 1636, title: '清朝建立', type: '中国',
    summary: '1636年，皇太极改国号为清，建立清朝，这是中国最后一个封建王朝。',
    detail: '1636年，后金大汗皇太极改国号为"大清"，正式建立清朝。1644年，清军入关，定都北京，逐步统一全国。清朝前期出现了"康乾盛世"，国力强盛，疆域辽阔。康熙、雍正、乾隆三位皇帝在位期间，加强了中央集权，巩固了多民族国家的统一。清朝实行闭关锁国政策，限制对外交流。1840年鸦片战争后，中国开始沦为半殖民地半封建社会。清朝后期，内忧外患不断，先后经历了太平天国运动、洋务运动、戊戌变法、辛亥革命等重大事件。1912年，辛亥革命推翻清朝统治，结束了中国两千多年的封建帝制。' },

  // ========== 中国近代重要事件 ==========
  
  // 第一次鸦片战争
  { month: 6, day: 28, year: 1840, title: '第一次鸦片战争爆发', type: '中国',
    summary: '1840年6月，英国发动鸦片战争，中国近代史开始。',
    detail: '1840年6月，英国以中国禁烟运动为借口，发动第一次鸦片战争。英国舰队抵达广州海面，封锁珠江口，战争正式爆发。由于清政府腐败无能，清军装备落后，战争以中国失败告终。1842年8月，清政府被迫签订《南京条约》，这是中国近代史上第一个不平等条约。条约规定割让香港岛给英国，赔偿英国2100万银元，开放广州、厦门、福州、宁波、上海五处为通商口岸，协定关税等。第一次鸦片战争标志着中国开始沦为半殖民地半封建社会，是中国近代史的开端。' },

  // 太平天国运动
  { month: 1, day: 11, year: 1851, title: '太平天国运动爆发', type: '中国',
    summary: '1851年1月，洪秀全发动金田起义，太平天国运动开始。',
    detail: '1851年1月11日，洪秀全在广西桂平县金田村发动武装起义，建号"太平天国"，自称"天王"。太平天国运动是中国历史上规模最大的一次农民起义，起义军迅速发展壮大，先后攻占了南京、武汉、安庆等重要城市。1853年，太平天国定都天京（今江苏南京），颁布《天朝田亩制度》，主张平均分配土地。太平天国运动持续了14年，沉重打击了清朝统治和外国侵略势力。1864年，天京被湘军攻陷，太平天国运动失败。' },

  // 洋务运动开始
  { month: 1, day: 1, year: 1861, title: '洋务运动开始', type: '中国',
    summary: '19世纪60年代，洋务派发起洋务运动，开始中国近代化进程。',
    detail: '19世纪60年代至90年代，清朝政府中的洋务派官员如曾国藩、李鸿章、左宗棠、张之洞等发起了一场旨在"自强""求富"的洋务运动。洋务派主张学习西方先进技术，创办近代军事工业和民用工业，建立新式海军，创办新式学堂，派遣留学生。洋务运动期间创办了安庆内军械所、江南制造总局、福州船政局、轮船招商局、开平矿务局等一批近代企业。虽然洋务运动没有使中国走上富强之路，但它引进了西方先进技术，培养了一批近代人才，客观上促进了中国民族资本主义的产生和发展，是中国近代化的开端。' },

  // 甲午战争
  { month: 7, day: 25, year: 1894, title: '甲午中日战争爆发', type: '中国',
    summary: '1894年7月，日本发动甲午战争，中国战败，签订《马关条约》。',
    detail: '1894年7月25日，日本海军在丰岛海面袭击中国运兵船，甲午中日战争爆发。战争持续了近9个月，主要包括平壤战役、黄海海战、辽东战役和威海卫战役。由于清政府腐败无能和战略失误，中国军队节节败退。1895年4月，清政府被迫与日本签订《马关条约》，条约规定割让辽东半岛、台湾全岛及所有附属各岛屿和澎湖列岛给日本，赔偿日本军费白银2亿两，开放沙市、重庆、苏州、杭州为通商口岸，允许日本在中国通商口岸开设工厂等。甲午战争的失败使中国的半殖民地化程度大大加深，也促使中国人民开始觉醒，掀起了维新变法运动。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '戊戌变法', type: '中国',
    summary: '1898年6月，光绪帝颁布"明定国是"诏书，戊戌变法开始。',
    detail: '1898年6月11日，光绪皇帝颁布"明定国是"诏书，宣布变法，史称"戊戌变法"或"百日维新"。变法由康有为、梁启超等维新派推动，主要内容包括：政治上改革官制、裁撤冗员、广开言路；经济上鼓励发展工商业、创办新式银行、改革财政；文化教育上废除八股取士、创办京师大学堂、派遣留学生等。变法触动了以慈禧太后为首的顽固派的利益。9月21日，慈禧太后发动政变，囚禁光绪皇帝，逮捕维新派人士，戊戌变法失败。谭嗣同等"戊戌六君子"被杀害。戊戌变法虽然失败了，但它传播了西方资产阶级思想，激发了中国人民的爱国热情，为后来的辛亥革命奠定了思想基础。' },

  // 辛亥革命
  { month: 10, day: 10, year: 1911, title: '辛亥革命爆发', type: '中国',
    summary: '1911年10月10日，武昌起义爆发，辛亥革命开始，推翻清朝统治。',
    detail: '1911年10月10日晚，湖北新军中的革命党人在武昌发动武装起义，占领武昌城，成立湖北军政府。武昌起义的胜利迅速传遍全国，各省纷纷宣布独立，清朝统治土崩瓦解。1912年1月1日，孙中山在南京宣誓就任中华民国临时大总统，宣告中华民国成立。2月12日，清宣统帝溥仪退位，清朝灭亡，中国两千多年的封建帝制结束。辛亥革命是中国近代史上一次伟大的资产阶级民主革命，它推翻了封建帝制，使民主共和观念深入人心。但辛亥革命没有彻底改变中国半殖民地半封建社会的性质，革命果实最终被袁世凯窃取。' },

  // 新文化运动
  { month: 9, day: 15, year: 1915, title: '新文化运动开始', type: '中国',
    summary: '1915年9月，陈独秀创办《新青年》，新文化运动开始。',
    detail: '1915年9月，陈独秀在上海创办《青年杂志》（后改名为《新青年》），标志着新文化运动的开始。新文化运动的主要倡导者有陈独秀、李大钊、鲁迅、胡适等。运动的口号是"民主"和"科学"，主张反对封建礼教，提倡白话文，反对文言文，提倡新文学，反对旧文学。新文化运动猛烈抨击封建思想文化，传播西方资产阶级民主思想和科学知识，动摇了封建思想的统治地位，为马克思主义在中国的传播创造了条件，也为五四运动的爆发奠定了思想基础。' },

  // 中国共产党成立
  { month: 7, day: 23, year: 1921, title: '中国共产党成立', type: '中国',
    summary: '1921年7月23日，中国共产党第一次全国代表大会召开，中国共产党成立。',
    detail: '1921年7月23日，中国共产党第一次全国代表大会在上海召开（后转移到浙江嘉兴南湖的游船上），标志着中国共产党正式成立。出席会议的代表有毛泽东、董必武、陈潭秋、何叔衡等13人，代表全国50多名党员。大会确定了党的名称为"中国共产党"，通过了党的第一个纲领，选举产生了党的中央领导机构。中国共产党的成立是中国历史上开天辟地的大事变，从此中国革命的面貌焕然一新。中国共产党领导中国人民经过28年的艰苦斗争，终于在1949年建立了中华人民共和国。' },

  // 南昌起义
  { month: 8, day: 1, year: 1927, title: '南昌起义', type: '中国',
    summary: '1927年8月1日，南昌起义爆发，打响武装反抗国民党反动派的第一枪。',
    detail: '1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等率领共产党掌握和影响的国民革命军两万余人在南昌发动武装起义。起义军经过激烈战斗，占领了南昌城。南昌起义打响了武装反抗国民党反动派的第一枪，标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开始。8月1日后来被定为中国人民解放军建军节。南昌起义后，起义军南下广东，虽然遭受挫折，但保存下来的部队成为中国工农红军的骨干力量。' },

  // 红军长征
  { month: 10, day: 10, year: 1934, title: '红军长征开始', type: '中国',
    summary: '1934年10月，中央红军开始长征，这是人类历史上的伟大壮举。',
    detail: '1934年10月，由于第五次反"围剿"失败，中央红军（红一方面军）被迫撤离中央革命根据地，开始长征。长征途中，红军经历了无数艰难险阻，爬雪山、过草地，克服了恶劣的自然环境和敌人的围追堵截。1935年1月，中共中央在贵州遵义召开政治局扩大会议，确立了毛泽东在党中央和红军中的领导地位，这是中国共产党历史上一个生死攸关的转折点。1935年10月，中央红军到达陕北，与陕北红军会师。1936年10月，红二、四方面军到达甘肃会宁，与红一方面军会师，长征胜利结束。长征的胜利是中国革命转危为安的关键，铸就了伟大的长征精神。' },

  // 西安事变
  { month: 12, day: 12, year: 1936, title: '西安事变', type: '中国',
    summary: '1936年12月12日，张学良、杨虎城发动西安事变，促成抗日民族统一战线。',
    detail: '1936年12月12日，为了劝谏蒋介石改变"攘外必先安内"的政策，停止内战，一致抗日，张学良和杨虎城在西安发动"兵谏"，扣押了蒋介石，史称"西安事变"或"双十二事变"。中国共产党从全民族利益出发，派周恩来等人前往西安调解，促成事变和平解决。蒋介石被迫接受"停止内战、联共抗日"的主张。西安事变的和平解决标志着国共两党十年内战基本结束，抗日民族统一战线初步形成，为抗日战争的胜利奠定了基础。' },

  // 抗日战争全面爆发
  { month: 7, day: 7, year: 1937, title: '七七事变 · 抗日战争全面爆发', type: '中国',
    summary: '1937年7月7日，卢沟桥事变爆发，中国开始全面抗日战争。',
    detail: '1937年7月7日，日本侵略军在北平西南的卢沟桥附近进行军事演习，借口一名士兵失踪，要求进入宛平城搜查，遭到中国守军拒绝后，向宛平城和卢沟桥发动进攻，中国守军奋起抵抗，史称"七七事变"或"卢沟桥事变"。七七事变标志着日本全面侵华战争的开始，也标志着中国人民全面抗日战争的开始。事变后，中国共产党发表通电，号召全国人民团结起来，抵抗日本侵略。7月17日，蒋介石在庐山发表谈话，宣布准备抗战。国共两党实现第二次合作，建立抗日民族统一战线，共同抗击日本侵略者。' },

  // 中华人民共和国成立
  { month: 10, day: 1, year: 1949, title: '中华人民共和国成立', type: '中国',
    summary: '1949年10月1日，毛泽东在天安门城楼宣告中华人民共和国成立。',
    detail: '1949年10月1日下午3时，北京天安门广场举行开国大典，毛泽东在天安门城楼上庄严宣告："中华人民共和国中央人民政府今天成立了！"他亲自按下电钮，升起了第一面五星红旗。随后举行了盛大的阅兵式和群众游行。中华人民共和国的成立标志着中国新民主主义革命的胜利，结束了中国半殖民地半封建社会的历史，实现了民族独立和人民解放，中国人民从此站起来了，成为国家的主人。新中国的成立开创了中国历史的新纪元，也对世界产生了深远影响。' },

  // ========== 中国古代重要事件（续）==========
  
  // 春秋时期 - 孔子周游列国
  { month: 1, day: 1, year: -497, title: '孔子周游列国', type: '中国',
    summary: '公元前497年，孔子开始周游列国，宣扬儒家思想。',
    detail: '公元前497年，孔子率领弟子离开鲁国，开始了长达十四年的周游列国之旅。他先后到过卫、曹、宋、郑、陈、蔡、楚等国，希望能得到各国君主的重用，实现自己的政治理想。在周游过程中，孔子和弟子们经历了许多艰难险阻，多次面临生命危险。但孔子始终坚持自己的信念，宣扬"仁"和"礼"的思想，希望能够恢复社会秩序，实现天下大同。虽然孔子的政治主张在当时没有得到广泛认可，但他的思想却深深影响了中国两千多年的历史。' },

  // 战国时期 - 百家争鸣
  { month: 1, day: 1, year: -475, title: '百家争鸣', type: '中国',
    summary: '战国时期，各种思想流派纷纷兴起，形成百家争鸣的局面。',
    detail: '战国时期是中国历史上思想文化最为繁荣的时期之一，各种思想流派如儒家、道家、墨家、法家、名家、阴阳家等纷纷兴起，他们各抒己见，互相辩论，形成了"百家争鸣"的局面。儒家主张"仁爱"和"礼治"，道家主张"无为而治"，墨家主张"兼爱"和"非攻"，法家主张"法治"和"中央集权"。这些思想流派不仅在当时产生了重要影响，而且对中国传统文化的发展产生了深远影响。' },

  // 秦朝 - 焚书坑儒
  { month: 1, day: 1, year: -213, title: '焚书坑儒', type: '中国',
    summary: '公元前213年，秦始皇下令焚书坑儒，对文化造成严重破坏。',
    detail: '公元前213年，秦始皇采纳李斯的建议，下令焚烧除秦记以外的所有史书，以及《诗》《书》等儒家经典，只保留医药、卜筮、种树等实用书籍。第二年，又将四百六十多名方士和儒生坑杀于咸阳。焚书坑儒是秦始皇为了加强思想控制而采取的极端措施，它对中国文化造成了严重破坏，许多珍贵的文献典籍因此失传。但这一事件也反映了秦朝统一后思想文化领域的激烈斗争。' },

  // 汉朝 - 文景之治
  { month: 1, day: 1, year: -180, title: '文景之治', type: '中国',
    summary: '汉文帝、汉景帝时期，实行休养生息政策，出现文景之治。',
    detail: '汉文帝和汉景帝在位期间，实行"休养生息"政策，减轻农民负担，鼓励农业生产，提倡节俭，减少刑罚。在他们的治理下，社会经济得到了恢复和发展，人民生活水平提高，国家财政充裕，史称"文景之治"。文景之治为汉武帝时期的强盛奠定了坚实的物质基础。' },

  // 三国 - 赤壁之战
  { month: 11, day: 1, year: 208, title: '赤壁之战', type: '中国',
    summary: '208年，孙权、刘备联军在赤壁大败曹操，奠定三国鼎立基础。',
    detail: '208年，曹操率领大军南下，企图一举消灭孙权和刘备，统一天下。孙权和刘备联合起来，在赤壁（今湖北赤壁市）与曹军展开决战。联军利用火攻战术，烧毁曹军战船，大败曹军。赤壁之战是中国历史上著名的以少胜多的战役，它奠定了三国鼎立的局面。' },

  // 唐朝 - 安史之乱
  { month: 12, day: 16, year: 755, title: '安史之乱', type: '中国',
    summary: '755年，安禄山、史思明发动叛乱，唐朝由盛转衰。',
    detail: '755年，身兼范阳、平卢、河东三镇节度使的安禄山以"讨伐奸臣"为名，在范阳起兵叛乱。叛军迅速攻占了洛阳、长安等地，唐玄宗被迫逃往四川。后来，在郭子仪、李光弼等将领的努力下，叛乱终于被平定。但安史之乱给唐朝带来了沉重打击，人口锐减，经济衰退，中央集权削弱，唐朝从此由盛转衰。' },

  // 宋朝 - 靖康之耻
  { month: 1, day: 15, year: 1127, title: '靖康之耻', type: '中国',
    summary: '1127年，金兵攻陷开封，北宋灭亡，史称靖康之耻。',
    detail: '1127年，金兵攻陷北宋都城开封，宋徽宗、宋钦宗二帝以及大量皇室成员、官员和百姓被掳往北方，北宋灭亡。这一事件被称为"靖康之耻"，是中国历史上的一次重大耻辱。南宋建立后，宋高宗赵构为了躲避金兵，一路南逃，最终定都临安（今浙江杭州）。' },

  // 明朝 - 郑和下西洋
  { month: 7, day: 11, year: 1405, title: '郑和下西洋', type: '中国',
    summary: '1405年，郑和率领船队首次下西洋，开启大规模远洋航行。',
    detail: '1405年，明成祖朱棣派遣郑和率领庞大的船队从南京出发，开始了第一次下西洋的航行。在接下来的二十八年里，郑和先后七次率领船队远航，到达了亚非三十多个国家和地区，最远到达非洲东海岸和红海沿岸。郑和下西洋是中国古代规模最大、航行时间最长的远洋航行，它加强了中国与世界各国的联系，促进了中外经济文化交流。' },

  // 明朝 - 土木堡之变
  { month: 8, day: 15, year: 1449, title: '土木堡之变', type: '中国',
    summary: '1449年，明英宗在土木堡被瓦剌俘虏，明朝国力受损。',
    detail: '1449年，瓦剌首领也先率军南下，直逼北京。明英宗在宦官王振的怂恿下，亲自率军出征。由于王振的错误指挥，明军在土木堡（今河北怀来境内）被瓦剌军包围，全军覆没，明英宗被俘。这一事件被称为"土木堡之变"，它使明朝的国力受到严重削弱。后来，于谦等人拥立明代宗即位，组织北京保卫战，才击退了瓦剌军。' },

  // 清朝 - 康乾盛世
  { month: 1, day: 1, year: 1662, title: '康乾盛世', type: '中国',
    summary: '康熙、雍正、乾隆时期，清朝达到鼎盛，史称康乾盛世。',
    detail: '从康熙到乾隆时期，清朝在政治、经济、文化等方面都达到了鼎盛。康熙皇帝平定三藩之乱、收复台湾、抗击沙俄侵略，巩固了国家统一；雍正皇帝推行改革，加强中央集权；乾隆皇帝进一步拓展疆域，使清朝的版图达到最大。在这一时期，农业生产发展，商业繁荣，人口增长，文化也取得了巨大成就。但康乾盛世也存在着闭关锁国、文字狱等问题，为清朝的衰落埋下了隐患。' },

  // ========== 中国近代重要事件（续）==========
  
  // 第二次鸦片战争
  { month: 10, day: 8, year: 1856, title: '第二次鸦片战争爆发', type: '中国',
    summary: '1856年，英国、法国发动第二次鸦片战争，进一步加深中国半殖民地化。',
    detail: '1856年，英国以"亚罗号事件"为借口，法国以"马神甫事件"为借口，联合发动了第二次鸦片战争。1858年，清政府被迫签订《天津条约》；1860年，英法联军攻占北京，火烧圆明园，清政府又签订了《北京条约》。第二次鸦片战争使中国的半殖民地化程度进一步加深，中国丧失了更多的领土和主权。' },

  // 辛酉政变
  { month: 11, day: 1, year: 1861, title: '辛酉政变', type: '中国',
    summary: '1861年，慈禧太后发动辛酉政变，开始垂帘听政。',
    detail: '1861年，咸丰皇帝病逝后，慈禧太后联合恭亲王奕訢发动政变，铲除了肃顺等八位顾命大臣，开始垂帘听政。辛酉政变标志着慈禧太后开始掌握清朝的实际权力，她统治中国长达四十多年，对中国近代史产生了深远影响。' },

  // 义和团运动
  { month: 1, day: 1, year: 1900, title: '义和团运动', type: '中国',
    summary: '1900年，义和团运动爆发，提出"扶清灭洋"口号。',
    detail: '19世纪末，山东、直隶等地的农民和手工业者组织义和团，提出"扶清灭洋"的口号，反对外国侵略和教会势力。1900年，义和团运动达到高潮，他们围攻外国使馆，袭击教堂。八国联军以此为借口，发动侵华战争，镇压义和团运动。义和团运动虽然失败了，但它显示了中国人民反抗外国侵略的决心。' },

  // 八国联军侵华
  { month: 6, day: 10, year: 1900, title: '八国联军侵华', type: '中国',
    summary: '1900年，八国联军入侵中国，北京再次沦陷。',
    detail: '1900年6月，英、美、德、法、俄、日、意、奥八国组成联军，以镇压义和团运动为名，从天津向北京进攻。8月，联军攻占北京，慈禧太后和光绪皇帝仓皇西逃。联军在北京烧杀抢掠，无恶不作，许多珍贵文物被劫掠一空。1901年，清政府被迫签订《辛丑条约》，中国完全沦为半殖民地半封建社会。' },

  // 五四运动
  { month: 5, day: 4, year: 1919, title: '五四运动', type: '中国',
    summary: '1919年5月4日，北京学生发起五四运动，掀起爱国浪潮。',
    detail: '1919年5月4日，北京三千多名学生在天安门前集会，抗议巴黎和会上帝国主义列强将德国在山东的权益转让给日本。他们提出"外争主权，内除国贼"的口号，举行示威游行，并火烧赵家楼。五四运动迅速席卷全国，工人罢工、商人罢市，形成了空前的爱国运动。五四运动是中国近代史上一次彻底的反帝反封建的爱国运动，它促进了马克思主义在中国的传播，为中国共产党的成立奠定了思想基础。' },

  // 五卅运动
  { month: 5, day: 30, year: 1925, title: '五卅运动', type: '中国',
    summary: '1925年5月30日，上海爆发五卅运动，掀起全国反帝高潮。',
    detail: '1925年5月30日，上海工人和学生举行反帝示威游行，抗议日本资本家枪杀工人顾正红。英国巡捕在南京路上开枪镇压，造成十三人死亡，数十人受伤，史称"五卅惨案"。这一事件激起了全国人民的愤怒，各地纷纷举行罢工、罢课、罢市，掀起了全国性的反帝高潮。五卅运动是中国共产党领导的一次重要的群众运动，它进一步唤醒了中国人民的民族意识。' },

  // 四一二反革命政变
  { month: 4, day: 12, year: 1927, title: '四一二反革命政变', type: '中国',
    summary: '1927年4月12日，蒋介石发动四一二反革命政变，国共合作破裂。',
    detail: '1927年4月12日，蒋介石在上海发动反革命政变，派出军队和青帮流氓袭击共产党人和革命群众，大肆屠杀共产党员和进步人士。这一事件标志着第一次国共合作的破裂，中国革命进入了低潮。此后，蒋介石在南京建立了国民政府，开始了对中国的独裁统治。' },

  // 长征胜利
  { month: 10, day: 22, year: 1936, title: '长征胜利', type: '中国',
    summary: '1936年10月，红二、四方面军与红一方面军会师，长征胜利结束。',
    detail: '1936年10月，红二、四方面军到达甘肃会宁，与红一方面军胜利会师，标志着长征的胜利结束。长征的胜利是中国革命转危为安的关键，它保存了中国革命的火种，铸就了伟大的长征精神。长征的胜利实现了中国革命从挫折走向胜利的伟大转折，为中国革命的胜利奠定了基础。' },

  // 南京大屠杀
  { month: 12, day: 13, year: 1937, title: '南京大屠杀', type: '中国',
    summary: '1937年12月13日，日军攻占南京，实施惨绝人寰的大屠杀。',
    detail: '1937年12月13日，日军攻占南京后，对无辜平民和放下武器的中国士兵进行了长达六周的大规模屠杀、强奸、抢劫和纵火，史称"南京大屠杀"。据统计，在南京大屠杀中，日军共杀害中国平民和战俘达三十余万人。南京大屠杀是日本侵略者对中国人民犯下的滔天罪行，是中华民族历史上最为惨痛的一页。' },

  // 日本投降
  { month: 8, day: 15, year: 1945, title: '日本宣布无条件投降', type: '中国',
    summary: '1945年8月15日，日本宣布无条件投降，抗日战争胜利结束。',
    detail: '1945年8月15日，日本天皇裕仁通过广播宣布无条件投降。9月2日，日本代表在"密苏里"号战列舰上签署投降书，标志着第二次世界大战的结束和中国抗日战争的胜利。中国人民经过十四年的艰苦斗争，终于取得了抗日战争的伟大胜利，这是中国近代史上第一次取得完全胜利的反侵略战争。' },

  // ========== 中国古代重要事件（续二）==========
  
  // 夏朝 - 太康失国
  { month: 1, day: 1, year: -1989, title: '太康失国', type: '中国',
    summary: '约公元前1989年，夏朝君主太康失国，后羿代夏。',
    detail: '夏朝建立后，禹将王位传给儿子启，开启了世袭制。启死后，他的儿子太康继位。太康沉迷于游乐打猎，不理朝政，引起了民众的不满。东夷族首领后羿趁机发动叛乱，夺取了夏朝的政权，史称"太康失国"。后羿立太康的弟弟仲康为傀儡君主，自己掌握实际权力。后来后羿被他的大臣寒浞所杀，寒浞继续统治夏朝。直到少康长大后，聚集力量，消灭了寒浞，恢复了夏朝的统治，史称"少康中兴"。' },

  // 商朝 - 盘庚迁殷
  { month: 1, day: 1, year: -1300, title: '盘庚迁殷', type: '中国',
    summary: '约公元前1300年，商王盘庚迁都到殷，商朝从此稳定下来。',
    detail: '商朝建立后，由于政治动乱和自然灾害等原因，多次迁都。直到商王盘庚时期，为了摆脱内部纷争和外部威胁，他决定将都城迁到殷（今河南安阳）。盘庚迁殷是商朝历史上的一个重要转折点，此后商朝的都城再也没有迁移过，因此商朝也被称为"殷商"。在殷都，商朝的政治、经济和文化都得到了很大发展，甲骨文就是在这个时期产生的。' },

  // 周朝 - 周公旦辅政
  { month: 1, day: 1, year: -1042, title: '周公旦辅政', type: '中国',
    summary: '公元前1042年，周公旦辅佐周成王，巩固周朝统治。',
    detail: '周武王建立周朝后不久就去世了，他的儿子周成王继位，当时成王还很年幼。周武王的弟弟周公旦主动承担起辅佐成王的重任。周公旦在辅政期间，平定了管叔、蔡叔等人的叛乱，巩固了周朝的统治。他还制定了一系列的礼乐制度，规范了社会秩序。周公旦还营建了东都洛邑（今河南洛阳），加强了对东部地区的控制。周公旦的辅政为周朝的稳定和发展奠定了坚实基础。' },

  // 春秋 - 齐桓公称霸
  { month: 1, day: 1, year: -685, title: '齐桓公称霸', type: '中国',
    summary: '公元前685年，齐桓公成为春秋时期第一位霸主。',
    detail: '齐桓公是春秋时期齐国的国君，他在位期间，任用管仲为相，进行了一系列改革。管仲改革使齐国的经济和军事实力迅速增强。齐桓公提出"尊王攘夷"的口号，打着周天子的旗号，联合其他诸侯国，共同抵御北方少数民族的入侵。公元前651年，齐桓公在葵丘（今河南兰考）召集诸侯会盟，周天子也派代表参加，承认了齐桓公的霸主地位。齐桓公成为春秋时期的第一位霸主。' },

  // 战国 - 商鞅变法
  { month: 1, day: 1, year: -356, title: '商鞅变法', type: '中国',
    summary: '公元前356年，商鞅在秦国开始变法，秦国逐渐强大。',
    detail: '公元前356年，秦孝公任用商鞅进行变法。商鞅变法的主要内容包括：废除井田制，承认土地私有；奖励耕织，生产粮食布帛多的人可以免除徭役；奖励军功，按军功大小授予爵位；建立县制，加强中央集权；统一度量衡等。这些改革措施使秦国的经济得到发展，军队战斗力增强，为秦国后来统一六国奠定了基础。商鞅变法是中国历史上一次重要的改革，对中国历史产生了深远影响。' },

  // 秦朝 - 统一六国
  { month: 1, day: 1, year: -230, title: '秦灭六国', type: '中国',
    summary: '公元前230年，秦国开始统一六国的战争。',
    detail: '从公元前230年开始，秦国开始了统一六国的战争。在李斯、王翦等大臣的辅佐下，秦始皇嬴政先后消灭了韩、赵、魏、楚、燕、齐六国。公元前221年，秦国完成统一大业，建立了中国历史上第一个统一的中央集权制国家。秦朝的统一结束了春秋战国以来长期分裂割据的局面，开创了中国历史的新纪元。' },

  // 汉朝 - 张骞出使西域
  { month: 1, day: 1, year: -138, title: '张骞出使西域', type: '中国',
    summary: '公元前138年，张骞首次出使西域，开辟丝绸之路。',
    detail: '公元前138年，汉武帝派张骞出使西域，目的是联合大月氏共同对抗匈奴。张骞率领一百多人的使团从长安出发，途中被匈奴俘虏，被迫在匈奴生活了十年。后来他趁机逃脱，继续西行，历经艰险，终于到达大月氏。虽然大月氏不愿与汉朝联合，但张骞的这次出使获得了大量关于西域的地理、物产、风俗等信息。公元前119年，张骞再次出使西域，这次他率领三百多人的使团，携带大量丝绸、茶叶等物品，到达乌孙等国，建立了汉朝与西域各国的友好关系。张骞的两次出使西域，开辟了连接东西方的丝绸之路，促进了汉朝与西域各国的经济文化交流。' },

  // 汉朝 - 昭君出塞
  { month: 1, day: 1, year: -33, title: '昭君出塞', type: '中国',
    summary: '公元前33年，王昭君远嫁匈奴，促进汉匈和平。',
    detail: '公元前33年，汉元帝将宫女王昭君嫁给匈奴呼韩邪单于，以和亲的方式维护汉匈关系。王昭君到达匈奴后，被封为"宁胡阏氏"，她积极传播中原文化，促进了汉匈之间的经济文化交流。王昭君出塞后，汉匈之间保持了长达半个世纪的和平，边境地区出现了"边城晏闭，牛马布野"的繁荣景象。王昭君的故事成为中国历史上民族团结的佳话。' },

  // 三国 - 诸葛亮北伐
  { month: 1, day: 1, year: 228, title: '诸葛亮北伐', type: '中国',
    summary: '228年，诸葛亮开始北伐中原，试图兴复汉室。',
    detail: '228年，诸葛亮率领蜀军开始第一次北伐中原。在北伐过程中，诸葛亮先后六次出兵，但由于各种原因，都未能成功。诸葛亮北伐的目的是兴复汉室，统一中国。他在北伐中采取了一系列战术，如声东击西、诱敌深入等，但最终因为国力悬殊和后勤困难等原因而失败。尽管如此，诸葛亮的北伐精神和忠诚精神深受后人敬仰。' },

  // 晋朝 - 八王之乱
  { month: 1, day: 1, year: 291, title: '八王之乱', type: '中国',
    summary: '291年，八王之乱爆发，西晋陷入内乱。',
    detail: '291年，晋惠帝即位后，皇后贾南风干政，引发了皇族内部的权力斗争。汝南王司马亮、楚王司马玮、赵王司马伦等八位诸侯王先后参与了这场长达十六年的内乱，史称"八王之乱"。八王之乱给西晋带来了沉重打击，社会经济遭到严重破坏，人民生活困苦。这场内乱也削弱了西晋的统治，为后来的"五胡乱华"和西晋的灭亡埋下了隐患。' },

  // 唐朝 - 贞观之治
  { month: 1, day: 1, year: 627, title: '贞观之治', type: '中国',
    summary: '627年，唐太宗开始贞观之治，唐朝走向强盛。',
    detail: '627年，唐太宗李世民即位，他在位期间，实行了一系列开明的政策。他虚心纳谏，重用魏征等敢于直言的大臣；轻徭薄赋，减轻百姓负担；推行均田制和租庸调制，促进了农业生产的发展；重视教育，兴办学校，培养人才。在他的治理下，唐朝出现了政治清明、经济繁荣、社会稳定的局面，史称"贞观之治"。贞观之治为唐朝的强盛奠定了坚实基础。' },

  // 唐朝 - 开元盛世
  { month: 1, day: 1, year: 713, title: '开元盛世', type: '中国',
    summary: '713年，唐玄宗开创开元盛世，唐朝达到鼎盛。',
    detail: '713年，唐玄宗李隆基即位，他在位前期，励精图治，任用姚崇、宋璟等贤相，进行了一系列改革。他整顿吏治，裁减冗员；发展经济，鼓励农桑；重视文化教育，提倡科举。在他的治理下，唐朝的政治、经济、文化都达到了鼎盛时期，史称"开元盛世"。开元盛世是中国历史上少有的盛世局面，当时的唐朝国力强盛，文化繁荣，对外交流频繁。' },

  // 宋朝 - 王安石变法
  { month: 1, day: 1, year: 1069, title: '王安石变法', type: '中国',
    summary: '1069年，王安石开始变法，试图富国强兵。',
    detail: '1069年，宋神宗任用王安石为参知政事，开始进行变法。王安石变法的主要内容包括：青苗法、免役法、方田均税法、农田水利法、保甲法、将兵法等。这些措施旨在增加政府财政收入，减轻农民负担，加强军事力量。然而，王安石变法遭到了保守派的强烈反对，加上变法过程中出现了一些问题，最终在宋神宗死后被废止。尽管如此，王安石变法的思想和措施对后来的改革产生了一定影响。' },

  // 明朝 - 靖难之役
  { month: 7, day: 6, year: 1399, title: '靖难之役', type: '中国',
    summary: '1399年，朱棣发动靖难之役，夺取皇位。',
    detail: '1399年，明太祖朱元璋的第四子燕王朱棣以"清君侧"为名，发动了"靖难之役"，起兵反对建文帝朱允炆。这场战争持续了四年，最终朱棣率领燕军攻占了南京，建文帝下落不明。朱棣登基为帝，即明成祖。靖难之役是明朝历史上的一次重要事件，它改变了明朝的皇位继承顺序，也对明朝的政治产生了深远影响。' },

  // 清朝 - 鸦片战争
  { month: 6, day: 28, year: 1840, title: '第一次鸦片战争', type: '中国',
    summary: '1840年，第一次鸦片战争爆发，中国近代史开始。',
    detail: '1840年6月，英国以中国禁烟运动为借口，发动第一次鸦片战争。英国舰队抵达广州海面，封锁珠江口，战争正式爆发。由于清政府腐败无能，清军装备落后，战争以中国失败告终。1842年8月，清政府被迫签订《南京条约》，这是中国近代史上第一个不平等条约。第一次鸦片战争标志着中国开始沦为半殖民地半封建社会，是中国近代史的开端。' },

  // ========== 中国近代重要事件（续二）==========
  
  // 太平天国运动
  { month: 1, day: 11, year: 1851, title: '金田起义', type: '中国',
    summary: '1851年1月，洪秀全发动金田起义，太平天国运动开始。',
    detail: '1851年1月11日，洪秀全在广西桂平县金田村发动武装起义，建号"太平天国"，自称"天王"。太平天国运动是中国历史上规模最大的一次农民起义，起义军迅速发展壮大，先后攻占了南京、武汉、安庆等重要城市。1853年，太平天国定都天京（今江苏南京），颁布《天朝田亩制度》，主张平均分配土地。太平天国运动持续了14年，沉重打击了清朝统治和外国侵略势力。1864年，天京被湘军攻陷，太平天国运动失败。' },

  // 洋务运动
  { month: 1, day: 1, year: 1861, title: '洋务运动', type: '中国',
    summary: '19世纪60年代，洋务派发起洋务运动，开始中国近代化进程。',
    detail: '19世纪60年代至90年代，清朝政府中的洋务派官员如曾国藩、李鸿章、左宗棠、张之洞等发起了一场旨在"自强""求富"的洋务运动。洋务派主张学习西方先进技术，创办近代军事工业和民用工业，建立新式海军，创办新式学堂，派遣留学生。洋务运动期间创办了安庆内军械所、江南制造总局、福州船政局、轮船招商局、开平矿务局等一批近代企业。虽然洋务运动没有使中国走上富强之路，但它引进了西方先进技术，培养了一批近代人才，客观上促进了中国民族资本主义的产生和发展，是中国近代化的开端。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '戊戌变法', type: '中国',
    summary: '1898年6月，光绪帝颁布"明定国是"诏书，戊戌变法开始。',
    detail: '1898年6月11日，光绪皇帝颁布"明定国是"诏书，宣布变法，史称"戊戌变法"或"百日维新"。变法由康有为、梁启超等维新派推动，主要内容包括：政治上改革官制、裁撤冗员、广开言路；经济上鼓励发展工商业、创办新式银行、改革财政；文化教育上废除八股取士、创办京师大学堂、派遣留学生等。变法触动了以慈禧太后为首的顽固派的利益。9月21日，慈禧太后发动政变，囚禁光绪皇帝，逮捕维新派人士，戊戌变法失败。谭嗣同等"戊戌六君子"被杀害。戊戌变法虽然失败了，但它传播了西方资产阶级思想，激发了中国人民的爱国热情，为后来的辛亥革命奠定了思想基础。' },

  // 辛亥革命
  { month: 10, day: 10, year: 1911, title: '武昌起义', type: '中国',
    summary: '1911年10月10日，武昌起义爆发，辛亥革命开始。',
    detail: '1911年10月10日晚，湖北新军中的革命党人在武昌发动武装起义，占领武昌城，成立湖北军政府。武昌起义的胜利迅速传遍全国，各省纷纷宣布独立，清朝统治土崩瓦解。1912年1月1日，孙中山在南京宣誓就任中华民国临时大总统，宣告中华民国成立。2月12日，清宣统帝溥仪退位，清朝灭亡，中国两千多年的封建帝制结束。辛亥革命是中国近代史上一次伟大的资产阶级民主革命，它推翻了封建帝制，使民主共和观念深入人心。' },

  // ========== 中国古代重要事件（续三）==========
  
  // 西周 - 国人暴动
  { month: 1, day: 1, year: -841, title: '国人暴动', type: '中国',
    summary: '公元前841年，国人暴动，周厉王逃亡，共和行政开始。',
    detail: '公元前841年，周厉王实行暴政，垄断山林川泽之利，禁止国人采樵渔猎，并派人监视国人言论，导致国人不满。国人发动暴动，周厉王逃亡到彘（今山西霍县）。国人暴动后，周朝由周公、召公共同执政，史称"共和行政"。共和行政是中国历史上第一次有确切纪年的开始，从此中国历史有了连续的纪年。' },

  // 春秋 - 城濮之战
  { month: 4, day: 1, year: -632, title: '城濮之战', type: '中国',
    summary: '公元前632年，晋国在城濮之战中击败楚国，晋文公称霸。',
    detail: '公元前632年，晋国与楚国在城濮（今山东鄄城）展开决战。晋文公重耳在流亡期间曾得到楚王的帮助，他承诺如果将来与楚国交战，将"退避三舍"。在城濮之战中，晋文公兑现承诺，退避三舍（九十里），然后发起进攻，大败楚军。城濮之战使晋文公成为春秋时期的霸主，晋国成为北方最强大的诸侯国。' },

  // 战国 - 长平之战
  { month: 4, day: 1, year: -260, title: '长平之战', type: '中国',
    summary: '公元前260年，秦国在长平之战中大败赵国，坑杀四十万降卒。',
    detail: '公元前260年，秦国与赵国在长平（今山西高平）展开决战。赵国派老将廉颇坚守，秦军久攻不下。后来赵王听信谣言，换用年轻将领赵括。秦将白起利用赵括轻敌冒进的特点，采取诱敌深入的战术，将赵军包围。赵军断粮四十六天后投降，白起将四十万降卒全部坑杀。长平之战是战国时期规模最大、伤亡最惨重的战役，赵国从此元气大伤，秦国统一六国的进程大大加快。' },

  // 秦朝 - 陈胜吴广起义
  { month: 7, day: 1, year: -209, title: '陈胜吴广起义', type: '中国',
    summary: '公元前209年，陈胜、吴广在大泽乡发动起义，秦朝开始崩溃。',
    detail: '公元前209年7月，陈胜、吴广等九百多名农民被征发到渔阳戍守。途中遇到大雨，无法按时到达，按秦朝法律，迟到者将被处死。陈胜、吴广于是发动起义，喊出"王侯将相宁有种乎"的口号，建立了张楚政权。起义军迅速发展壮大，攻占了许多城池。虽然陈胜、吴广后来失败牺牲，但他们点燃的反秦火焰迅速蔓延，最终导致秦朝的灭亡。陈胜吴广起义是中国历史上第一次大规模农民起义。' },

  // 汉朝 - 绿林赤眉起义
  { month: 1, day: 1, year: -17, title: '绿林赤眉起义', type: '中国',
    summary: '公元17年，绿林、赤眉起义爆发，推翻王莽政权。',
    detail: '公元17年，由于王莽政权的腐败和社会矛盾的激化，各地农民纷纷起义。绿林军在绿林山（今湖北当阳）起义，赤眉军在山东起义。起义军迅速发展壮大，绿林军攻入长安，推翻了王莽政权。后来绿林军将领刘秀建立了东汉王朝。绿林赤眉起义推翻了王莽的新朝，恢复了汉朝的统治。' },

  // 汉朝 - 党锢之祸
  { month: 1, day: 1, year: 166, title: '党锢之祸', type: '中国',
    summary: '公元166年，东汉发生党锢之祸，士大夫遭到镇压。',
    detail: '公元166年，东汉朝廷中的宦官集团与士大夫集团发生激烈冲突。宦官诬陷士大夫结党营私，皇帝下令逮捕数百名士大夫，禁止他们做官，史称"党锢之祸"。党锢之祸持续了十多年，严重打击了东汉的士大夫阶层，加剧了东汉的政治危机。' },

  // 三国 - 官渡之战
  { month: 10, day: 1, year: 200, title: '官渡之战', type: '中国',
    summary: '公元200年，曹操在官渡之战中击败袁绍，统一北方。',
    detail: '公元200年，曹操与袁绍在官渡（今河南中牟）展开决战。袁绍兵多粮足，曹操兵少粮缺。但曹操采取正确的战略，烧毁袁绍粮草，使袁绍军大乱。曹操趁机进攻，大败袁绍。官渡之战是中国历史上著名的以少胜多的战役，它使曹操统一了北方，为后来曹魏的建立奠定了基础。' },

  // 晋朝 - 永嘉之乱
  { month: 1, day: 1, year: 311, title: '永嘉之乱', type: '中国',
    summary: '公元311年，匈奴攻陷洛阳，西晋陷入混乱。',
    detail: '公元311年，匈奴军队攻陷西晋都城洛阳，俘虏晋怀帝，史称"永嘉之乱"。永嘉之乱是西晋灭亡的重要事件，它标志着北方少数民族开始大规模入侵中原，中国进入"五胡十六国"时期。大量北方汉族人口南迁，促进了南方经济的发展。' },

  // 南北朝 - 北魏孝文帝改革
  { month: 1, day: 1, year: 490, title: '北魏孝文帝改革', type: '中国',
    summary: '公元490年，北魏孝文帝推行汉化改革，促进民族融合。',
    detail: '公元490年前后，北魏孝文帝拓跋宏推行了一系列汉化改革措施。他下令鲜卑人改穿汉服、改用汉姓、改说汉语，鼓励鲜卑人与汉人通婚，迁都洛阳。这些改革促进了北方各民族的融合，推动了鲜卑族的汉化进程。北魏孝文帝改革是中国历史上一次重要的民族融合事件，对后来的隋唐统一产生了深远影响。' },

  // 唐朝 - 武周建立
  { month: 9, day: 9, year: 690, title: '武周建立', type: '中国',
    summary: '公元690年，武则天称帝，建立武周政权。',
    detail: '公元690年9月9日，武则天正式称帝，改国号为周，成为中国历史上第一位女皇帝。武则天在位期间，实行了一系列改革措施，重视人才选拔，发展农业生产，加强边疆管理。她的统治虽然遭到一些人的反对，但客观上为唐朝的繁荣做出了贡献。705年，武则天病重，大臣们发动政变，恢复唐朝。' },

  // 宋朝 - 靖康之变
  { month: 1, day: 9, year: 1127, title: '靖康之变', type: '中国',
    summary: '1127年，金兵攻陷开封，北宋灭亡。',
    detail: '1127年1月，金兵攻陷北宋都城开封，俘虏宋徽宗、宋钦宗二帝以及大量皇室成员、官员和工匠北去，北宋灭亡，史称"靖康之变"。靖康之变是中国历史上的一次重大耻辱，它标志着北宋的灭亡和南宋的开始。康王赵构在南方建立南宋政权，定都临安（今浙江杭州）。' },

  // 元朝 - 蒙古统一
  { month: 1, day: 1, year: 1206, title: '蒙古统一', type: '中国',
    summary: '1206年，铁木真统一蒙古各部，建立蒙古汗国。',
    detail: '1206年，铁木真在斡难河源头召开大会，统一蒙古各部，被推举为"成吉思汗"，建立蒙古汗国。成吉思汗随后发动了一系列征服战争，先后征服了西夏、金朝、西辽、花剌子模等政权。蒙古帝国的建立改变了世界历史的进程，蒙古军队的征服活动横跨欧亚大陆，建立了人类历史上疆域最辽阔的帝国。' },

  // 明朝 - 明成祖迁都北京
  { month: 1, day: 1, year: 1421, title: '明成祖迁都北京', type: '中国',
    summary: '1421年，明成祖朱棣迁都北京，加强北方防御。',
    detail: '1421年，明成祖朱棣将明朝都城从南京迁到北京。迁都北京是为了加强对北方的控制，抵御蒙古的入侵。朱棣在北京修建了紫禁城，作为皇宫。迁都北京使北京成为中国政治中心，这一格局一直延续到今天。' },

  // 清朝 - 三藩之乱
  { month: 1, day: 1, year: 1673, title: '三藩之乱', type: '中国',
    summary: '1673年，吴三桂等发动三藩之乱，威胁清朝统治。',
    detail: '1673年，平西王吴三桂、平南王尚可喜、靖南王耿精忠三个藩王发动叛乱，史称"三藩之乱"。三藩之乱持续了八年，波及南方大部分地区。康熙皇帝采取分化瓦解的策略，逐一消灭叛军。1681年，三藩之乱被平定，清朝的统治更加稳固。' },

  // ========== 中国近代重要事件（续三）==========
  
  // 甲午战争
  { month: 7, day: 25, year: 1894, title: '甲午战争爆发', type: '中国',
    summary: '1894年7月，甲午中日战争爆发，中国战败。',
    detail: '1894年7月25日，日本海军在丰岛海面袭击中国运兵船，甲午中日战争爆发。战争持续了近9个月，主要包括平壤战役、黄海海战、辽东战役和威海卫战役。由于清政府腐败无能和战略失误，中国军队节节败退。1895年4月，清政府被迫签订《马关条约》，割让台湾、赔款白银2亿两。甲午战争的失败使中国的半殖民地化程度大大加深。' },

  // 公车上书
  { month: 5, day: 2, year: 1895, title: '公车上书', type: '中国',
    summary: '1895年5月，康有为领导公车上书，维新运动开始。',
    detail: '1895年5月2日，康有为联合在京参加科举考试的举人一千三百多人，联名上书光绪皇帝，反对签订《马关条约》，请求变法图强，史称"公车上书"。公车上书是维新派登上政治舞台的标志，它传播了维新思想，为后来的戊戌变法奠定了基础。' },

  // 义和团运动
  { month: 1, day: 1, year: 1900, title: '义和团运动高潮', type: '中国',
    summary: '1900年，义和团运动达到高潮，提出"扶清灭洋"。',
    detail: '1900年，义和团运动在北方各省迅速发展，提出"扶清灭洋"口号。义和团攻击外国使馆、教堂和铁路，引起了外国列强的强烈反应。八国联军以镇压义和团为名，入侵中国，攻占北京。义和团运动虽然失败了，但它显示了中国人民反抗外国侵略的决心。' },

  // 保路运动
  { month: 9, day: 7, year: 1911, title: '保路运动', type: '中国',
    summary: '1911年9月，四川保路运动爆发，成为辛亥革命导火索。',
    detail: '1911年9月7日，四川民众为反对清政府将铁路修筑权出卖给外国，发动保路运动。清政府派军队镇压，造成成都血案。保路运动使四川局势动荡，清政府从湖北调兵入川镇压，削弱了湖北的军事力量，为武昌起义创造了条件。保路运动成为辛亥革命的导火索。' },

  // 二次革命
  { month: 7, day: 12, year: 1913, title: '二次革命', type: '中国',
    summary: '1913年7月，孙中山发动二次革命，反对袁世凯。',
    detail: '1913年7月12日，孙中山发动二次革命，反对袁世凯的独裁统治。二次革命很快失败，孙中山等人被迫流亡海外。二次革命的失败标志着民国初年民主政治的挫折，袁世凯的独裁统治进一步加强。' },

  // 护国运动
  { month: 12, day: 25, year: 1915, title: '护国运动', type: '中国',
    summary: '1915年12月，蔡锷发动护国运动，反对袁世凯称帝。',
    detail: '1915年12月25日，蔡锷在云南发动护国运动，反对袁世凯称帝。护国军迅速发展壮大，贵州、广西、广东等省相继响应。袁世凯被迫取消帝制，不久后病死。护国运动保卫了共和制度，挫败了袁世凯复辟帝制的企图。' },

  // 护法运动
  { month: 8, day: 25, year: 1917, title: '护法运动', type: '中国',
    summary: '1917年8月，孙中山发动护法运动，维护临时约法。',
    detail: '1917年8月25日，孙中山在广州发动护法运动，反对北洋军阀废弃临时约法。护法运动持续了一年多，但由于军阀内部的矛盾和孙中山缺乏足够的军事力量，最终失败。护法运动的失败使孙中山认识到必须建立自己的革命武装。' },
