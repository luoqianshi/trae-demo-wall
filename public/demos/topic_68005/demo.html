  // 北伐战争
  { month: 7, day: 9, year: 1926, title: '北伐战争开始', type: '中国',
    summary: '1926年7月，国民革命军开始北伐，统一全国。',
    detail: '1926年7月9日，国民革命军从广州出发，开始北伐战争。北伐军分三路进军，先后击败吴佩孚、孙传芳、张作霖等军阀。1928年，北伐战争基本完成，国民政府在形式上统一了全国。北伐战争是中国近代史上一次重要的统一战争。' },

  // 九一八事变
  { month: 9, day: 18, year: 1931, title: '九一八事变', type: '中国',
    summary: '1931年9月18日，日本侵占东北，抗日战争开始。',
    detail: '1931年9月18日夜，日本关东军在沈阳柳条湖铁路制造爆炸事件，以此为借口进攻东北军北大营和沈阳城。由于国民政府采取不抵抗政策，日军在短短四个多月内占领了东北三省。九一八事变是日本侵华的开始，也是中国人民抗日战争的起点。' },

  // 一二八事变
  { month: 1, day: 28, year: 1932, title: '一二八事变', type: '中国',
    summary: '1932年1月28日，日军进攻上海，十九路军奋起抵抗。',
    detail: '1932年1月28日夜，日军进攻上海，驻守上海的十九路军奋起抵抗。十九路军在蔡廷锴、蒋光鼐的指挥下，与日军激战一个多月，使日军三次增兵、四次换帅。最后在英、美、法等国的调停下，双方签订停战协定。一二八事变显示了中国人民抵抗日本侵略的决心。' },

  // 华北事变
  { month: 1, day: 1, year: 1935, title: '华北事变', type: '中国',
    summary: '1935年，日本策动华北自治，民族危机加深。',
    detail: '1935年，日本策动华北各省"自治"，企图将华北从中国分离出去。国民政府被迫签订《何梅协定》《秦土协定》，使中国在华北的主权受到严重损害。华北事变激起了全国人民的抗日救亡运动，一二九运动就是在这一背景下爆发的。' },

  // 一二九运动
  { month: 12, day: 9, year: 1935, title: '一二九运动', type: '中国',
    summary: '1935年12月9日，北平学生发起抗日救亡运动。',
    detail: '1935年12月9日，北平数千名学生举行示威游行，反对日本侵略和国民政府的不抵抗政策，喊出"停止内战，一致对外"的口号。一二九运动迅速波及全国，掀起了抗日救亡运动的高潮。一二九运动促进了中华民族的觉醒，为后来的抗日战争奠定了群众基础。' },

  // 七七事变
  { month: 7, day: 7, year: 1937, title: '七七事变', type: '中国',
    summary: '1937年7月7日，卢沟桥事变爆发，全面抗战开始。',
    detail: '1937年7月7日夜，日军在卢沟桥附近进行军事演习，借口一名士兵失踪，要求进入宛平城搜查，遭到中国守军拒绝后，向宛平城和卢沟桥发动进攻。中国守军奋起抵抗，七七事变爆发。七七事变标志着日本全面侵华战争的开始，也标志着中国人民全面抗日战争的开始。' },

  // 平型关大捷
  { month: 9, day: 25, year: 1937, title: '平型关大捷', type: '中国',
    summary: '1937年9月25日，八路军在平型关伏击日军，取得首战胜利。',
    detail: '1937年9月25日，八路军115师在山西平型关伏击日军，歼灭日军一千余人，缴获大量武器弹药。平型关大捷是八路军出师抗日的首战胜利，打破了日军不可战胜的神话，鼓舞了全国人民的抗战信心。' },

  // 台儿庄战役
  { month: 3, day: 23, year: 1938, title: '台儿庄战役', type: '中国',
    summary: '1938年3月，中国军队在台儿庄重创日军。',
    detail: '1938年3月23日至4月7日，中国军队在山东台儿庄与日军展开激战。在李宗仁的指挥下，中国军队歼灭日军一万余人，取得了抗战以来正面战场的最大胜利。台儿庄战役打破了日军不可战胜的神话，鼓舞了全国人民的抗战信心。' },

  // 百团大战
  { month: 8, day: 20, year: 1940, title: '百团大战', type: '中国',
    summary: '1940年8月，八路军发动百团大战，打击日军。',
    detail: '1940年8月20日，八路军在华北发动大规模进攻，参战部队达105个团，史称"百团大战"。百团大战持续了三个多月，破坏了大量日军交通线和据点，歼灭日军两万余人。百团大战显示了八路军的力量，打击了日军的嚣张气焰。' },

  // 重庆谈判
  { month: 8, day: 28, year: 1945, title: '重庆谈判', type: '中国',
    summary: '1945年8月，毛泽东赴重庆谈判，争取和平建国。',
    detail: '1945年8月28日，毛泽东应蒋介石邀请，从延安飞赴重庆进行谈判。谈判持续了43天，双方签订了《双十协定》，确定和平建国的基本方针。虽然协定很快被蒋介石撕毁，但重庆谈判显示了中国共产党争取和平的诚意，赢得了全国人民的拥护。' },

  // 解放战争开始
  { month: 6, day: 26, year: 1946, title: '解放战争开始', type: '中国',
    summary: '1946年6月，国民党进攻中原解放区，解放战争开始。',
    detail: '1946年6月26日，国民党军队大举进攻中原解放区，全面内战爆发。解放战争持续了三年多，人民解放军先后粉碎了国民党的全面进攻和重点进攻，转入战略反攻和战略决战。1949年，人民解放军推翻了国民党政权，建立了中华人民共和国。' },

  // ========== 中国古代重要事件（续四）==========
  
  // 尧舜禹禅让
  { month: 1, day: 1, year: -2100, title: '尧舜禹禅让', type: '中国',
    summary: '约公元前2100年，尧舜禹禅让，天下为公。',
    detail: '尧舜禹是中国古代传说中的圣王。尧帝年老时，通过考察，选定舜为继承人，将帝位禅让给舜，这就是历史上著名的"禅让制"。舜帝年老后，同样将帝位禅让给禹。尧舜禹禅让体现了一种"天下为公"的政治理想，被后世儒家视为理想政治的典范。大禹治水成功后，得到了各部落的支持，最终建立了夏朝。' },

  // 夏朝建立
  { month: 1, day: 1, year: -2070, title: '夏朝建立', type: '中国',
    summary: '约公元前2070年，禹建立夏朝，中国进入文明时代。',
    detail: '公元前2070年左右，禹因治水有功，被各部落推举为联盟首领。禹年老后，本想按照禅让制将帝位传给益，但由于禹的儿子启的势力强大，启最终继承了帝位，结束了禅让制，建立了夏朝。夏朝的建立标志着中国从原始社会进入奴隶社会，中国历史从此进入了文明时代。' },

  // 商朝灭夏
  { month: 1, day: 1, year: -1600, title: '商朝灭夏', type: '中国',
    summary: '约公元前1600年，商汤灭夏，建立商朝。',
    detail: '公元前1600年左右，商族首领汤看到夏桀的暴政导致天下大乱，便起兵伐夏。在鸣条之战中，商汤大败夏军，推翻了夏朝的统治，建立了商朝。商朝的建立标志着中国历史进入了一个新的发展阶段。商朝时期，青铜器制造技术达到高峰，甲骨文也逐渐成熟。' },

  // 周武王伐纣
  { month: 1, day: 1, year: -1046, title: '周武王伐纣', type: '中国',
    summary: '公元前1046年，周武王在牧野之战中打败商纣王，商朝灭亡。',
    detail: '公元前1046年，周武王姬发率领诸侯联军，在牧野与商朝军队展开决战。由于商朝军队中的奴隶和俘虏临阵倒戈，商军大败。商纣王见大势已去，在鹿台自焚而死，商朝灭亡。周武王建立周朝，定都镐京。周武王伐纣是中国历史上一次重要的改朝换代，它结束了商朝的统治，开创了周朝八百年的基业。' },

  // 春秋五霸
  { month: 1, day: 1, year: -680, title: '春秋五霸', type: '中国',
    summary: '公元前680年左右，春秋五霸形成。',
    detail: '春秋时期，周王室衰微，诸侯争霸。齐桓公、晋文公、楚庄王、吴王夫差、越王勾践相继称霸，史称"春秋五霸"。五霸的相继出现，在一定时期内维护了中原地区的政治秩序，抵御了北方少数民族的入侵。春秋时期是中国思想文化大繁荣的时期，产生了诸子百家争鸣的局面。' },

  // 战国七雄
  { month: 1, day: 1, year: -475, title: '战国七雄', type: '中国',
    summary: '公元前475年左右，战国七雄格局形成。',
    detail: '战国时期，齐、楚、燕、韩、赵、魏、秦七个诸侯国相互争斗，史称"战国七雄"。战国时期是中国历史上一个社会大变革的时期，各国为了增强国力，纷纷进行变法改革。战国时期也是中国思想文化最繁荣的时期之一，产生了儒家、道家、墨家、法家等众多学派。' },

  // 秦统一六国
  { month: 1, day: 1, year: -221, title: '秦统一六国', type: '中国',
    summary: '公元前221年，秦始皇统一六国，建立秦朝。',
    detail: '公元前221年，秦王嬴政统一六国，建立秦朝，定都咸阳。秦始皇成为中国历史上第一个皇帝。秦朝统一后，实行了一系列巩固统一的措施：统一文字、统一度量衡、统一货币、修筑万里长城、实行郡县制。秦朝的统一结束了春秋战国以来的分裂局面，建立了中国历史上第一个大一统的中央集权制国家。' },

  // 楚汉之争
  { month: 1, day: 1, year: -206, title: '楚汉之争', type: '中国',
    summary: '公元前206年至前202年，刘邦与项羽争夺天下。',
    detail: '公元前206年，项羽封刘邦为汉王，随后爆发了刘邦与项羽争夺天下的战争，即"楚汉之争"。楚汉之争持续了四年，最终刘邦在垓下之战中大败项羽，项羽在乌江自刎。刘邦建立汉朝，定都长安。楚汉之争的胜负，除了军事因素外，更重要的是刘邦善于用人，而项羽刚愎自用。' },

  // 文景之治
  { month: 1, day: 1, year: -180, title: '文景之治', type: '中国',
    summary: '汉文帝、汉景帝时期，出现太平盛世。',
    detail: '汉文帝和汉景帝在位期间，实行"休养生息"政策，减轻农民负担，鼓励农业生产，提倡节俭，减少刑罚。在他们的治理下，社会经济得到了恢复和发展，人民生活水平提高，国家财政充裕，史称"文景之治"。文景之治为汉武帝时期的强盛奠定了坚实的物质基础，是中国历史上著名的太平盛世。' },

  // 汉武帝大一统
  { month: 1, day: 1, year: -140, title: '汉武帝大一统', type: '中国',
    summary: '汉武帝时期，西汉达到鼎盛。',
    detail: '汉武帝刘彻在位期间，实行了一系列加强中央集权的措施。他推行"推恩令"，削弱诸侯王势力；设立刺史制度，加强中央对地方的控制；实行盐铁官营，增加国家财政收入；重用卫青、霍去病，大破匈奴；派张骞出使西域，开辟丝绸之路；"罢黜百家，独尊儒术"，确立儒家思想的正统地位。汉武帝时期，西汉达到了鼎盛。' },

  // 王莽篡汉
  { month: 1, day: 1, year: 9, title: '王莽篡汉', type: '中国',
    summary: '公元9年，王莽建立新朝，西汉灭亡。',
    detail: '公元9年，王莽代汉自立，建立新朝，西汉灭亡。王莽是汉元帝皇后王政君的侄子，他以外戚身份专权，最终逼迫孺子婴禅位，自己当了皇帝。王莽称帝后，进行了一系列改革，但由于措施不当，引发了社会动荡，最终导致了绿林赤眉起义的爆发。' },

  // 刘秀建立东汉
  { month: 1, day: 1, year: 25, title: '刘秀建立东汉', type: '中国',
    summary: '公元25年，刘秀建立东汉，定都洛阳。',
    detail: '公元25年，刘秀在群雄割据中崛起，建立东汉政权，定都洛阳。刘秀是汉高祖刘邦的九世孙，他参加了绿林军，后来平定各地割据势力，重新统一了中国。刘秀在位期间，注意减轻农民负担，恢复社会生产，史称"光武中兴"。' },

  // 黄巾起义
  { month: 1, day: 1, year: 184, title: '黄巾起义', type: '中国',
    summary: '公元184年，黄巾起义爆发，东汉陷入混乱。',
    detail: '公元184年，张角领导的黄巾起义爆发。黄巾起义是中国历史上规模最大的一次宗教性农民起义。张角创立太平道，利用宗教组织群众，提出"苍天已死，黄天当立"的口号。黄巾起义虽然最终被镇压，但它动摇了东汉的统治基础，导致了军阀割据的局面。' },

  // 淝水之战
  { month: 1, day: 1, year: 383, title: '淝水之战', type: '中国',
    summary: '公元383年，东晋在淝水之战中大败前秦。',
    detail: '公元383年，前秦皇帝苻坚率军南下，企图一举灭晋。东晋宰相谢安派谢石、谢玄率军迎战。在淝水之战中，东晋军队采用正确的战略战术，大败前秦军队。苻坚在逃跑途中听到风声和鹤叫，都以为是晋军追来，这就是"风声鹤唳"的典故。淝水之战保住了东晋的半壁江山，也保护了汉族文化。' },

  // 贞观之治
  { month: 1, day: 1, year: 627, title: '贞观之治', type: '中国',
    summary: '唐太宗在位期间，唐朝出现盛世。',
    detail: '627年至649年是唐太宗在位时期。他虚心纳谏，重用魏征等贤臣；轻徭薄赋，与民休息；重视教育，培养人才；对外实行开放政策，与各族和平交往。在他的治理下，唐朝政治清明，经济繁荣，文化昌盛，史称"贞观之治"。贞观之治为唐朝的强盛奠定了基础，也为后世治国提供了宝贵经验。' },

  // 开元盛世
  { month: 1, day: 1, year: 713, title: '开元盛世', type: '中国',
    summary: '唐玄宗在位前期，唐朝达到鼎盛。',
    detail: '713年至741年是唐玄宗在位前期。他任用姚崇、宋璟等贤相，励精图治，使唐朝的国力达到顶峰。这一时期，唐朝经济繁荣，文化昌盛，对外交往频繁，是唐朝最鼎盛的时期，史称"开元盛世"。开元盛世是中国历史上最辉煌的时期之一，也是当时世界上最强大的国家。' },

  // 安史之乱
  { month: 1, day: 1, year: 755, title: '安史之乱', type: '中国',
    summary: '755年，安禄山发动叛乱，唐朝由盛转衰。',
    detail: '755年，身兼三镇节度使的安禄山在范阳起兵叛乱，很快攻占洛阳、长安。唐玄宗被迫逃往四川，在马嵬坡发生兵变，杨贵妃被逼死。后来在郭子仪、李光弼等人的努力下，叛乱终于被平定。安史之乱历时八年，给唐朝经济造成了巨大破坏，唐朝从此由盛转衰。' },

  // 黄巢起义
  { month: 1, day: 1, year: 875, title: '黄巢起义', type: '中国',
    summary: '875年，黄巢起义爆发，唐朝走向衰落。',
    detail: '875年，黄巢发动农民起义，起义军转战大半个中国，攻占了唐朝都城长安。黄巢起义虽然最终失败，但它沉重打击了唐朝的统治，加速了唐朝的灭亡。黄巢起义失败后，唐朝名存实亡，各地藩镇割据。' },

  // 杯酒释兵权
  { month: 1, day: 1, year: 961, title: '杯酒释兵权', type: '中国',
    summary: '961年，宋太祖赵匡胤用酒宴解除将领兵权。',
    detail: '961年，宋太祖赵匡胤在宴会上请石守信等将领喝酒，然后劝他们交出兵权，回家享乐，这就是历史上有名的"杯酒释兵权"。宋太祖通过这种方式，消除了将领们割据一方的可能性，加强了中央集权，为宋朝的稳定奠定了基础。' },

  // 檀渊之盟
  { month: 1, day: 1, year: 1005, title: '檀渊之盟', type: '中国',
    summary: '1005年，宋真宗与辽国签订檀渊之盟。',
    detail: '1005年，宋真宗在檀渊（今河南濮阳）与辽国签订和约，史称"檀渊之盟"。和约规定：宋辽约为兄弟之国，宋每年给辽银十万两、绢二十万匹。檀渊之盟结束了宋辽之间的战争，保持了长时间的和平，有利于双方的经济文化交流。' },

  // 靖康之变
  { month: 1, day: 9, year: 1127, title: '靖康之变', type: '中国',
    summary: '1127年，金兵俘虏宋徽宗、宋钦宗，北宋灭亡。',
    detail: '1127年，金兵攻破北宋都城开封，俘虏宋徽宗、宋钦宗父子以及大量皇族、后妃、大臣和工匠，北宋灭亡。这就是历史上著名的"靖康之变"。康王赵构逃到南方，在临安建立南宋政权。靖康之变是汉族人民的一次大灾难，也是宋朝国耻的象征。' },

  // 崖山海战
  { month: 3, day: 19, year: 1279, title: '崖山海战', type: '中国',
    summary: '1279年，南宋在崖山海战中失败，南宋灭亡。',
    detail: '1279年3月19日，南宋军队与元军在崖山（今广东新会）海域进行最后的决战。南宋军队全军覆没，宰相陆秀夫背着年幼的皇帝赵昺投海自尽，南宋彻底灭亡。崖山海战标志着古典意义上汉族政权的结束，有"崖山之后无中华"之说。' },

  // 明朝建立
  { month: 1, day: 1, year: 1368, title: '明朝建立', type: '中国',
    summary: '1368年，朱元璋建立明朝，定都南京。',
    detail: '1368年，朱元璋在应天府（今南京）称帝，建立明朝。朱元璋就是明太祖。他出身贫寒，参加过农民起义，最终推翻元朝，建立了汉族政权。朱元璋建立明朝后，实行了一系列加强中央集权的措施，废除丞相制度，设立厂卫特务机构，大肆诛杀功臣。' },

  // 郑和下西洋
  { month: 7, day: 11, year: 1405, title: '郑和下西洋', type: '中国',
    summary: '1405年，郑和开始第一次下西洋。',
    detail: '1405年至1433年，明成祖朱棣派郑和率领庞大的船队七次下西洋。郑和的船队最远到达非洲东海岸和红海沿岸，访问了三十多个国家和地区。郑和下西洋加强了中国与亚非各国的友好关系，促进了中国与世界的经济文化交流，是中国航海史上的壮举。' },

  // 土木堡之变
  { month: 8, day: 15, year: 1449, title: '土木堡之变', type: '中国',
    summary: '1449年，明英宗在土木堡被瓦剌俘虏。',
    detail: '1449年，明英宗在宦官王振的怂恿下，御驾亲征瓦剌。由于王振的错误指挥，明军在土木堡被瓦剌军队包围全军覆没，明英宗被俘。消息传到北京，于谦等大臣拥立明代宗即位，组织北京保卫战，击退了瓦剌军。土木堡之变是明朝由盛转衰的标志。' },

  // 戚继光抗倭
  { month: 1, day: 1, year: 1560, title: '戚继光抗倭', type: '中国',
    summary: '1560年左右，戚继光在东南沿海抗倭。',
    detail: '1560年左右，戚继光临危受命，到东南沿海抗倭。他训练了一支"戚家军"，在台州、福州、兴化等地多次击败倭寇，基本平定了东南沿海的倭患。戚继光还发明了鸳鸯阵等战术，他的抗倭事迹被后人广为传颂。' },

  // 努尔哈赤建立后金
  { month: 1, day: 1, year: 1616, title: '努尔哈赤建立后金', type: '中国',
    summary: '1616年，努尔哈赤建立后金，努尔哈赤统一女真各部。',
    detail: '1583年至1618年，努尔哈赤逐步统一了女真各部。1616年，努尔哈赤在赫图阿拉称汗，建立后金政权。努尔哈赤创建了八旗制度，使女真族成为一个强大的军事集团。他还创制了满文，促进了满族文化的发展。努尔哈赤为清朝的建立奠定了基础。' },

  // 皇太极改国号为清
  { month: 1, day: 1, year: 1636, title: '皇太极改国号为清', type: '中国',
    summary: '1636年，皇太极改国号为清。',
    detail: '1636年，皇太极改国号为"大清"，正式建立了清朝。皇太极是努尔哈赤的第八子，他在位期间，进行了一系列改革：改族名为满洲，创制新满文，设立六部，重用汉官，改革军事制度。皇太极还多次进攻明朝，为清朝入关奠定了基础。' },

  // 郑成功收复台湾
  { month: 4, day: 1, year: 1661, title: '郑成功收复台湾', type: '中国',
    summary: '1661年，郑成功率军收复台湾。',
    detail: '1661年4月，郑成功率军从金门出发，经过澎湖，在台湾登陆。经过九个月的战斗，郑成功击败了荷兰殖民者，收复了台湾。郑成功收复台湾，维护了中国的领土完整，是中华民族的民族英雄。' },

  // 雅克萨之战
  { month: 1, day: 1, year: 1685, title: '雅克萨之战', type: '中国',
    summary: '1685年至1689年，清军击败沙俄侵略者。',
    detail: '1685年至1689年，清军与沙俄军队在雅克萨（今俄罗斯阿尔巴津）展开两次战争。清军两次击败俄军，迫使沙俄签订了《尼布楚条约》。《尼布楚条约》明确划定了中俄东段边界，维护了中国东北边疆的安全。' },

  // ========== 中国近代重要事件（续四）==========
  
  // 太平天国运动
  { month: 1, day: 11, year: 1851, title: '太平天国金田起义', type: '中国',
    summary: '1851年1月11日，洪秀全在金田村发动起义。',
    detail: '1851年1月11日，洪秀全在广西桂平县金田村发动起义，建号太平天国。洪秀全自称天王。太平天国运动是中国历史上规模最大的一次农民起义。起义军从广西出发，一路北上，于1853年攻占南京，定都于此。太平天国定都天京后，颁布了《天朝田亩制度》，提出了平均分配土地的理想。' },

  // 洋务运动
  { month: 1, day: 1, year: 1861, title: '洋务运动开始', type: '中国',
    summary: '1861年，洋务运动开始，中国近代化起步。',
    detail: '1861年至1894年，清朝洋务派以"自强""求富"为口号，掀起了一场引进西方先进技术的运动。洋务派创办了一批近代军事工业和民用工业，建立了新式海军，创办了新式学堂，派遣了留学生。洋务运动虽然没有使中国走上富强之路，但为中国近代化奠定了基础。' },

  // 中法战争
  { month: 8, day: 23, year: 1884, title: '中法战争爆发', type: '中国',
    summary: '1884年，中法战争爆发。',
    detail: '1884年8月23日，法国舰队袭击福建马尾军港，中国海军损失惨重，中法战争爆发。战争分为海上和陆上两个战场。在陆上战场，老将冯子材在镇南关大败法军，取得镇南关大捷。然而，清政府却在这个胜利的情况下与法国签订了《中法新约》，中国在战争中"不败而败"。' },

  // 镇南关大捷
  { month: 3, day: 1, year: 1885, title: '镇南关大捷', type: '中国',
    summary: '1885年3月，老将冯子材在镇南关大败法军。',
    detail: '1885年3月，年近七旬的老将冯子材在镇南关（今友谊关）大败法军，毙伤敌军一千多人，俘虏数百人，法军司令尼格里重伤。镇南关大捷是中法战争中的关键战役，也是中国近代反侵略战争的一次重要胜利。' },

  // 甲午战争
  { month: 7, day: 25, year: 1894, title: '甲午中日战争爆发', type: '中国',
    summary: '1894年7月，日本发动甲午战争。',
    detail: '1894年7月25日，日本舰队在丰岛海面袭击中国运兵船，甲午战争爆发。战争包括平壤战役、黄海海战、辽东战役、威海卫战役等重要战役。在黄海海战中，北洋舰队损失惨重，但刘公岛守军坚持到最后一刻。战争的结果是中国战败，被迫签订《马关条约》。' },

  // 台湾人民反割台斗争
  { month: 5, day: 25, year: 1895, title: '台湾人民反割台斗争', type: '中国',
    summary: '1895年，台湾人民开展反割台斗争。',
    detail: '1895年，清政府被迫将台湾割让给日本。台湾人民开展了轰轰烈烈的反割台斗争，徐骧、刘永福等领导义军与日军展开激烈战斗。台湾人民坚持抗日斗争五个多月，牺牲一万多人，显示了中华民族不屈不挠的斗争精神。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '百日维新', type: '中国',
    summary: '1898年6月11日，戊戌变法开始。',
    detail: '1898年6月11日，光绪皇帝颁布《定国是诏》，正式开始变法。变法期间，光绪皇帝颁布了一百多道新政上谕，推行政治、经济、文化教育等方面的改革。由于变法触动了顽固派的利益，仅维持了103天就被镇压，史称"百日维新"。谭嗣同等六人被杀害，史称"戊戌六君子"。' },

  // 义和团运动
  { month: 1, day: 1, year: 1900, title: '义和团运动', type: '中国',
    summary: '1900年，义和团运动达到高潮。',
    detail: '1900年，义和团运动在中国北方达到高潮。义和团提出"扶清灭洋"口号，围攻外国使馆。八国联军以镇压义和团为名入侵中国，攻占北京。慈禧太后带着光绪皇帝仓皇西逃。义和团运动虽然在中外反动势力的联合镇压下失败了，但它显示了中国人民反抗外来侵略的决心。' },

  // 辛亥革命
  { month: 10, day: 10, year: 1911, title: '辛亥革命爆发', type: '中国',
    summary: '1911年10月10日，武昌起义爆发，辛亥革命开始。',
    detail: '1911年10月10日晚，武昌起义爆发。革命军迅速攻占武昌、汉口、汉阳三镇，成立了湖北军政府。各省纷纷响应，宣布独立。1912年1月1日，中华民国临时政府在南京成立，孙中山就任临时大总统。2月12日，清帝退位，清朝灭亡，延续两千多年的封建帝制结束。' },

  // 二次革命
  { month: 7, day: 12, year: 1913, title: '二次革命爆发', type: '中国',
    summary: '1913年7月，孙中山发动二次革命。',
    detail: '1913年3月20日，宋教仁在上海被暗杀。7月，孙中山发动二次革命，反对袁世凯的独裁统治。江西、江苏、上海等地先后宣布独立，讨伐袁世凯。但由于兵力悬殊和内部矛盾，二次革命很快失败，孙中山等人流亡海外。' },

  // 护国战争
  { month: 12, day: 25, year: 1915, title: '护国战争爆发', type: '中国',
    summary: '1915年12月，蔡锷在云南发动护国战争。',
    detail: '1915年12月，袁世凯称帝。12月25日，蔡锷在云南宣布独立，组织护国军，讨伐袁世凯。贵州、广西、广东、浙江等省相继响应。护国战争使袁世凯的帝制梦碎，被迫取消帝制。' },

  // 张勋复辟
  { month: 7, day: 1, year: 1917, title: '张勋复辟', type: '中国',
    summary: '1917年7月，张勋拥立溥仪复辟。',
    detail: '1917年7月1日，前清遗臣张勋带兵进入北京，拥立废帝溥仪复辟。复辟仅持续了12天，就在全国人民的反对声中结束。张勋复辟虽然失败了，但它暴露了封建残余势力的顽固性，也说明了民主共和观念已经深入人心。' },

  // 五四运动
  { month: 5, day: 4, title: '五四运动', year: 1919, type: '中国',
    summary: '1919年5月4日，北京学生发动五四运动。',
    detail: '1919年5月4日，北京学生三千多人在天安门前集会，抗议巴黎和会上中国外交的失败。学生的爱国行动遭到北洋政府的镇压，激起全国人民的愤怒。上海工人罢工，学生罢课，商人罢市，形成全国性的爱国运动。五四运动是中国新民主主义革命的开端。' },

  // 中国共产党成立
  { month: 7, day: 23, year: 1921, title: '中国共产党成立', type: '中国',
    summary: '1921年7月23日，中国共产党第一次全国代表大会召开。',
    detail: '1921年7月23日，中国共产党第一次全国代表大会在上海召开。大会通过了党的第一个纲领，选举产生了党的中央领导机构。中国共产党的成立，是中国历史上开天辟地的大事。从此，中国革命有了坚强的领导核心，中国革命的面貌焕然一新。' },

  // 北伐战争
  { month: 7, day: 9, year: 1926, title: '北伐战争开始', type: '中国',
    summary: '1926年7月，国民革命军开始北伐。',
    detail: '1926年7月9日，国民革命军从广州誓师北伐。北伐军分三路进军：西路攻取湖南、湖北；中路进入江西；东路进攻福建、浙江。在不到半年的时间里，北伐军就消灭了吴佩孚、孙传芳的主力，控制了半个中国。' },

  // 南昌起义
  { month: 8, day: 1, year: 1927, title: '南昌起义', type: '中国',
    summary: '1927年8月1日，南昌起义爆发。',
    detail: '1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等率领共产党掌握和影响的国民革命军两万余人在南昌发动武装起义。起义军经过激烈战斗，占领了南昌城。南昌起义打响了武装反抗国民党反动派的第一枪，标志着中国共产党独立领导革命战争、创建人民军队的开始。' },

  // 井冈山会师
  { month: 4, day: 28, year: 1928, title: '井冈山会师', type: '中国',
    summary: '1928年4月，朱德、陈毅率部与毛泽东会师。',
    detail: '1928年4月，朱德、陈毅率领南昌起义余部和湘南起义农军来到井冈山，与毛泽东领导的秋收起义部队胜利会师。两支部队合编为中国工农红军第四军，朱德任军长，毛泽东任党代表。井冈山会师加强了红军的战斗力，对巩固和扩大井冈山革命根据地起了重要作用。' },

  // 九一八事变
  { month: 9, day: 18, year: 1931, title: '九一八事变', type: '中国',
    summary: '1931年9月18日，日本关东军制造柳条湖事件。',
    detail: '1931年9月18日夜，日本关东军以柳条湖铁路爆炸事件为借口，炮轰东北军北大营。由于蒋介石下令不抵抗，日本军队在不到半年的时间内占领了整个东北三省。九一八事变是日本帝国主义侵华的开端，也是中国人民抗日战争的起点。' },

  // 遵义会议
  { month: 1, day: 15, year: 1935, title: '遵义会议', type: '中国',
    summary: '1935年1月，遵义会议召开。',
    detail: '1935年1月15日至17日，中共中央在贵州遵义召开政治局扩大会议。会议结束了王明"左"倾教条主义在中央的统治，确立了毛泽东在党中央和红军的领导地位。遵义会议在极其危急的情况下挽救了党、挽救了红军、挽救了中国革命，是中国共产党历史上一个生死攸关的转折点。' },

  // 西安事变
  { month: 12, day: 12, year: 1936, title: '西安事变', type: '中国',
    summary: '1936年12月12日，张学良、杨虎城发动西安事变。',
    detail: '1936年12月12日，张学良、杨虎城在西安扣押蒋介石，发动"兵谏"，要求停止内战，一致抗日。在中共的调停下，西安事变和平解决。西安事变的和平解决标志着十年内战基本结束和抗日民族统一战线的初步形成。' },

  // 卢沟桥事变
  { month: 7, day: 7, year: 1937, title: '卢沟桥事变', type: '中国',
    summary: '1937年7月7日，日军发动卢沟桥事变。',
    detail: '1937年7月7日，日军在卢沟桥附近进行军事演习，借口一名士兵失踪，炮轰宛平城。中国守军第二十九军奋起抵抗。这就是震惊中外的卢沟桥事变。卢沟桥事变是日本帝国主义全面侵华的开始，也是中国人民全面抗日战争的开始。' },

  // 淞沪会战
  { month: 8, day: 13, year: 1937, title: '淞沪会战', type: '中国',
    summary: '1937年8月，淞沪会战爆发。',
    detail: '1937年8月13日，日军进攻上海，淞沪会战爆发。中国军队奋起抵抗，谢晋元率八百壮士死守四行仓库就是我军英勇抗敌的典型事例。会战持续了三个月，中国军队付出重大牺牲，但粉碎了日军"三个月灭亡中国"的狂妄企图。' },

  // 南京大屠杀
  { month: 12, day: 13, year: 1937, title: '南京大屠杀', type: '中国',
    summary: '1937年12月13日，日军在南京进行大屠杀。',
    detail: '1937年12月13日，日军攻占南京后，对中国军民进行了长达六个星期的大规模屠杀、奸淫、抢劫和纵火。这就是震惊世界的南京大屠杀。据估计，死难者达三十万人以上。日军的暴行是人类历史上最黑暗的一页。' },

  // 太原会战
  { month: 9, day: 1, year: 1937, title: '太原会战', type: '中国',
    summary: '1937年9月至11月，太原会战爆发。',
    detail: '1937年9月至11月，中国军队在山西与日军展开太原会战。会战中，八路军115师在平型关取得了抗战以来的首次大捷，歼敌一千多人。平型关大捷是中国军队对日军作战取得的第一个重大胜利，打破了日军不可战胜的神话。' },

  // 徐州会战
  { month: 1, day: 1, year: 1938, title: '徐州会战', type: '中国',
    summary: '1938年1月至5月，徐州会战爆发。',
    detail: '1938年1月至5月，中日双方在徐州地区展开会战。1938年4月，中国军队在台儿庄取得大捷，歼敌一万余人。台儿庄大捷是抗战以来正面战场取得的最大胜利，极大地鼓舞了全国人民的抗战士气。' },

  // 武汉会战
  { month: 6, day: 1, year: 1938, title: '武汉会战', type: '中国',
    summary: '1938年6月至10月，武汉会战爆发。',
    detail: '1938年6月至10月，中日双方在武汉地区展开大会战。这是抗战时期规模最大的一次会战，双方投入兵力超过百万人。会战最终以中国军队主动撤退而结束，但它消耗了日军大量有生力量，抗日战争从此进入战略相持阶段。' },

  // 百团大战
  { month: 8, day: 20, year: 1940, title: '百团大战', type: '中国',
    summary: '1940年8月至12月，八路军发动百团大战。',
    detail: '1940年8月20日至12月5日，八路军在华北敌后发动了一次大规模的进攻作战，参战部队达105个团，故称"百团大战"。战役期间，八路军破坏铁路、公路，拔除据点，给日军以沉重打击。百团大战是中国军队对日军发动的一次大规模主动出击。' },

  // 皖南事变
  { month: 1, day: 6, year: 1941, title: '皖南事变', type: '中国',
    summary: '1941年1月，国民党制造皖南事变。',
    detail: '1941年1月6日，新四军军部及所属部队九千余人在皖南茂林地区遭到国民党军八万人的围攻，除约两千人突围外，大部牺牲或被俘。军长叶挺被扣押，副军长项英遇害。皖南事变是国民党顽固派蓄意制造的分裂事件。' },

  // 辽沈战役
  { month: 9, day: 12, year: 1948, title: '辽沈战役', type: '中国',
    summary: '1948年9月至11月，辽沈战役爆发。',
    detail: '1948年9月12日至11月2日，人民解放军东北野战军在林彪、罗荣桓指挥下发动辽沈战役。战役历经52天，歼灭国民党军47万人，解放了东北全境。辽沈战役的胜利，使人民解放军在数量上取得了优势。' },

  // 淮海战役
  { month: 11, day: 6, year: 1948, title: '淮海战役', type: '中国',
    summary: '1948年11月至1949年1月，淮海战役爆发。',
    detail: '1948年11月6日至1949年1月10日，人民解放军华东野战军和中原野战军在刘伯承、邓小平、陈毅、粟裕、谭震林指挥下发动淮海战役。战役历经66天，歼灭国民党军55万人。淮海战役的胜利，为解放全中国奠定了基础。' },

  // 平津战役
  { month: 11, day: 29, year: 1948, title: '平津战役', type: '中国',
    summary: '1948年11月至1949年1月，平津战役爆发。',
    detail: '1948年11月29日至1949年1月31日，人民解放军东北野战军和华北军区部队发动平津战役。战役期间，由于中共的争取，北平国民党守军总司令傅作义率部接受和平改编。1月31日，人民解放军进入北平，平津战役胜利结束。' },

  // 七届二中全会
  { month: 3, day: 5, year: 1949, title: '七届二中全会', type: '中国',
    summary: '1949年3月，中共七届二中全会召开。',
    detail: '1949年3月5日至13日，中国共产党七届二中全会在西柏坡召开。会议讨论了夺取全国胜利以及将革命进行到底的方针政策，提出了促进革命迅速取得全国胜利和组织这个胜利的各项政策。毛泽东在会上提出了"两个务必"的重要思想。' },

  // 中华人民共和国成立
  { month: 10, day: 1, year: 1949, title: '新中国成立', type: '中国',
    summary: '1949年10月1日，中华人民共和国成立。',
    detail: '1949年10月1日，毛泽东在天安门城楼上庄严宣告中华人民共和国中央人民政府成立。当天，举行了盛大的阅兵仪式和群众游行。中华人民共和国的成立，标志着中国新民主主义革命取得了伟大胜利，中国人民从此站起来了。' },

  // ========== 中国古代重要事件（续五）==========

  // 炎帝黄帝传说
  { month: 1, day: 1, year: -3000, title: '炎帝黄帝时代', type: '中国',
    summary: '约公元前3000年，炎帝黄帝部落联盟形成。',
    detail: '据传说，炎帝和黄帝是中国远古时代的两个部落首领。炎帝姓姜，号神农氏，教人农耕，发明了医药；黄帝姓姬，号轩辕氏，发明了文字、舟车、音乐等。后来，炎帝部落和黄帝部落在阪泉之战中合并，形成了华夏族的主体。炎帝黄帝被后人尊为中华民族的共同祖先。' },

  // 大禹治水
  { month: 1, day: 1, year: -2100, title: '大禹治水', type: '中国',
    summary: '约公元前2100年，大禹治水成功。',
    detail: '四千多年前，中国发生了大洪水。尧舜时期，鲧负责治水，他采用堵塞的方法，九年没有成功。鲧的儿子禹接手治水工作，采用疏导的方法，终于制服了洪水。大禹治水十三年，三过家门而不入，终于消除了水患。大禹因治水有功，被舜选为继承人，后来建立了夏朝。' },

  // 夏桀暴政
  { month: 1, day: 1, year: -1800, title: '夏桀暴政', type: '中国',
    summary: '夏朝末年，夏桀暴虐无道。',
    detail: '夏朝末代君主桀是历史上有名的暴君。他大兴土木，建造华丽的宫殿；横征暴敛，滥用民力；宠信妹喜，荒废朝政。据说他建造了一个酒池，可以划船，让三千人一起喝酒。他还自比为太阳，说"太阳什么时候灭亡，我就什么时候灭亡"。人民不堪其苦，纷纷诅咒说："这个太阳什么时候灭亡，我们宁愿与你同归于尽。"夏桀的暴政最终导致了夏朝的灭亡。' },

  // 商鞅变法
  { month: 1, day: 1, year: -359, title: '商鞅变法', type: '中国',
    summary: '公元前359年，商鞅在秦国开始变法。',
    detail: '公元前359年，秦孝公任用商鞅进行变法。商鞅颁布了一系列法令：废除井田制，承认土地私有；奖励耕织，重农抑商；奖励军功，按军功授予爵位；建立县制；统一度量衡等。商鞅变法使秦国迅速强大起来，为后来秦始皇统一六国奠定了基础。' },

  // 秦始皇焚书坑儒
  { month: 1, day: 1, year: -213, title: '焚书坑儒', type: '中国',
    summary: '公元前213年，秦始皇焚书坑儒。',
    detail: '公元前213年，秦始皇采纳李斯的建议，下令焚烧《诗》《书》等儒家经典，只保留农业、医学等实用书籍。第二年，秦始皇又将四百多名儒生活埋于咸阳。焚书坑儒是秦始皇为了统一思想而采取的极端措施，它对中国古代文化造成了巨大破坏。' },

  // 巨鹿之战
  { month: 1, day: 1, year: -207, title: '巨鹿之战', type: '中国',
    summary: '公元前207年，项羽大败秦军。',
    detail: '公元前207年，项羽率楚军在巨鹿（今河北平乡）与秦军决战。项羽破釜沉舟，命令士兵只带三天口粮，表示必死的决心。楚军以一当十，奋勇杀敌，大败秦军。巨鹿之战是推翻秦朝的决定性战役。' },

  // 垓下之围
  { month: 1, day: 1, year: -202, title: '垓下之围', type: '中国',
    summary: '公元前202年，项羽被围于垓下。',
    detail: '公元前202年，刘邦率各路诸侯军队在垓下围困项羽。项羽兵少粮尽，夜间听到四面八方传来楚歌，以为楚地都已失陷。项羽在营中与虞姬悲歌诀别，率八百骑兵突围而去，最后在乌江自刎。' },

  // 汉初分封
  { month: 1, day: 1, year: -202, title: '汉初分封', type: '中国',
    summary: '公元前202年，刘邦分封诸侯王。',
    detail: '公元前202年，刘邦建立汉朝后，大封功臣为诸侯王。刘邦吸取秦朝灭亡的教训，认为秦朝是因为没有分封同姓子弟为王，才导致孤立无援而亡。于是他分封了九个同姓王和若干异姓王，后来又通过各种手段削弱诸侯王的势力，为汉朝的稳定奠定了基础。' },

  // 七国之乱
  { month: 1, day: 1, year: -154, title: '七国之乱', type: '中国',
    summary: '公元前154年，七国之乱爆发。',
    detail: '公元前154年，以吴王刘濞为首的七个诸侯王发动叛乱。汉景帝派周亚夫率军平叛，只用了三个月就平定了叛乱。七国之乱的平定，加强了中央集权，巩固了汉朝的统治。' },

  // 丝绸之路开通
  { month: 1, day: 1, year: -138, title: '丝绸之路开通', type: '中国',
    summary: '公元前138年，张骞出使西域，丝绸之路开通。',
    detail: '公元前138年和公元前119年，张骞两次出使西域，开辟了从中国通往西域的道路。这条道路横跨亚欧大陆，成为东西方贸易和文化交流的重要通道。中国精美的丝绸沿着这条路运往西方，因此被称为"丝绸之路"。' },

  // 昭君出塞
  { month: 1, day: 1, year: -33, title: '昭君出塞', type: '中国',
    summary: '公元前33年，王昭君出嫁匈奴。',
    detail: '公元前33年，匈奴呼韩邪单于入朝求亲，宫廷女子王昭君自愿请行，嫁给呼韩邪单于。王昭君出塞后，汉匈之间保持了较长时间的和平，边境地区出现了"边城晏闭，牛马布野"的繁荣景象。王昭君的事迹成为千古流传的佳话。' },

  // 窦宪勒石
  { month: 1, day: 1, year: 89, title: '窦宪勒石燕然', type: '中国',
    summary: '公元89年，窦宪大破北匈奴，勒石记功。',
    detail: '公元89年，东汉大将窦宪率军出塞，在稽落山（今蒙古国境内）大破北匈奴军队，追击一千多里。窦宪登上燕然山（今蒙古国杭爱山），令班固撰写铭文，刻石记功，这就是历史上著名的"燕然勒石"。窦宪的这次胜利，迫使北匈奴西迁，从此匈奴势力逐渐退出中国历史舞台。' },

  // 黄巾起义
  { month: 1, day: 1, year: 184, title: '黄巾起义', type: '中国',
    summary: '公元184年，张角发动黄巾起义。',
    detail: '公元184年，张角领导的黄巾起义爆发。张角以"苍天已死，黄天当立，岁在甲子，天下大吉"为口号，率领头裹黄巾的起义军在全国各地同时起义。黄巾起义虽然最终被镇压，但它动摇了东汉的统治基础，导致了群雄割据的局面。' },

  // 三顾茅庐
  { month: 1, day: 1, year: 207, title: '三顾茅庐', type: '中国',
    summary: '公元207年，刘备三顾茅庐请诸葛亮。',
    detail: '公元207年，刘备三次前往隆中拜访诸葛亮，请他出山相助。前两次诸葛亮都不在家，第三次终于见到诸葛亮。诸葛亮向刘备分析了天下形势，提出了"隆中对"的战略规划。这次会面奠定了三国鼎立的战略基础，诸葛亮从此成为刘备最重要的谋士。' },

  // 赤壁之战
  { month: 11, day: 1, year: 208, title: '赤壁之战', type: '中国',
    summary: '公元208年，孙刘联军大败曹操于赤壁。',
    detail: '公元208年，曹操率军南下，与孙权、刘备联军在赤壁决战。孙刘联军采用火攻战术，烧毁曹操战船，大败曹军。赤壁之战是三国时期最著名的战役，也是中国历史上以少胜多的经典战例。赤壁之战奠定了三国鼎立的基础。' },

  // 诸葛亮出师表
  { month: 1, day: 1, year: 227, title: '诸葛亮出师表', type: '中国',
    summary: '公元227年，诸葛亮上表北伐。',
    detail: '公元227年，蜀汉丞相诸葛亮准备北伐曹魏，临行前向后主刘禅上《出师表》。在这篇著名的表文中，诸葛亮追述了刘备的知遇之恩，表达了自己对蜀汉的忠诚，并向后主提出了修明政治、亲贤远佞的建议。《出师表》成为千古传颂的名篇。' },

  // 八王之乱
  { month: 1, day: 1, year: 291, title: '八王之乱', type: '中国',
    summary: '公元291年，西晋八王之乱爆发。',
    detail: '公元291年至306年，西晋皇族之间爆发了一场争夺政权的混战，参与的八个王先后被杀，史称"八王之乱"。这场战乱使西晋的国力遭到严重削弱，最终导致了西晋的灭亡和随后的五胡乱华。' },

  // 贞观之治
  { month: 1, day: 1, year: 627, title: '贞观之治', type: '中国',
    summary: '627年至649年，唐太宗开创贞观之治。',
    detail: '627年至649年，唐太宗李世民在位期间，采取了一系列政治、经济、文化措施，出现了政治清明、经济发展、社会安定、文化繁荣的局面，史称"贞观之治"。唐太宗虚心纳谏，重用魏征等贤臣，使唐朝成为当时世界上最强大的国家之一。' },

  // 玄奘取经
  { month: 1, day: 1, year: 629, title: '玄奘西行取经', type: '中国',
    summary: '公元629年，玄奘前往天竺取经。',
    detail: '公元629年，唐朝高僧玄奘从长安出发，独自一人西行求法。他历经千辛万苦，越过沙漠，翻越雪山，经过中亚，到达印度。玄奘在印度学习佛经十七年，于645年回到长安，带回佛经六百余部。玄奘的西行取经，成为中印文化交流的里程碑。' },

  // 鉴真东渡
  { month: 1, day: 1, year: 753, title: '鉴真东渡日本', type: '中国',
    summary: '公元753年，鉴真到达日本传播佛法。',
    detail: '鉴真应日本僧人邀请，先后六次东渡日本，前五次都失败了，第五次漂流到海南岛，他双目失明，但仍不放弃。终于在753年，鉴真第六次东渡成功，到达日本。鉴真在日本传授戒律，建造唐招提寺，为日本佛教和文化的发展做出了巨大贡献。' },

  // 陈桥兵变
  { month: 1, day: 1, year: 960, title: '陈桥兵变', type: '中国',
    summary: '公元960年，赵匡胤发动陈桥兵变，建立宋朝。',
    detail: '公元960年，后周大将赵匡胤在陈桥驿被部下黄袍加身，拥立为帝，建立了宋朝，赵匡胤就是宋太祖。陈桥兵变是历史上一次不流血的政变，它结束了五代十国的混乱局面，为宋朝的统一奠定了基础。' },

  // 澶渊之盟
  { month: 1, day: 1, year: 1005, title: '澶渊之盟', type: '中国',
    summary: '公元1005年，宋辽签订澶渊之盟。',
    detail: '公元1005年，宋真宗在澶州（澶渊）与辽国签订和约，史称"澶渊之盟"。和约规定宋辽为兄弟之国，宋每年给辽银十万两、绢二十万匹。澶渊之盟使宋辽保持了长达百年的和平。' },

  // 庆历新政
  { month: 1, day: 1, year: 1043, title: '庆历新政', type: '中国',
    summary: '公元1043年，范仲淹推行庆历新政。',
    detail: '1043年，宋仁宗任用范仲淹进行改革。范仲淹向宋仁宗上《答手诏条陈十事》，提出十项改革措施，包括严格官员选拔、裁减冗员、限制恩荫等。庆历新政触动了官僚集团的利益，遭到反对派的攻击，最终失败。' },

  // 王安石变法
  { month: 1, day: 1, year: 1069, title: '王安石变法', type: '中国',
    summary: '公元1069年，王安石开始变法。',
    detail: '1069年，宋神宗任用王安石为参知政事，开始变法。王安石推行了一系列新法，包括青苗法、免役法、方田均税法、保甲法等。王安石变法旨在富国强兵，但遭到保守派的强烈反对，最终失败。' },

  // 岳飞抗金
  { month: 1, day: 1, year: 1130, title: '岳飞抗金', type: '中国',
    summary: '公元1130年起，岳飞率军抗金。',
    detail: '1130年起，岳飞率岳家军转战各地，抗击金军。他先后收复建康、襄阳等失地，多次大败金军。岳家军纪律严明，作战勇敢，流传着"撼山易，撼岳家军难"的说法。岳飞的抗金斗争，表现了中华民族不屈不挠的精神。' },

  // 元末农民起义
  { month: 1, day: 1, year: 1351, title: '元末农民起义', type: '中国',
    summary: '公元1351年，红巾军起义爆发。',
    detail: '1351年，白莲教首领韩山童、刘福通等人在颍州发动起义，起义军头裹红巾，史称"红巾军起义"。红巾军起义迅速蔓延到全国各大地区，其中朱元璋的起义军最终推翻了元朝，建立了明朝。' },

  // 郑和下西洋
  { month: 7, day: 11, year: 1405, title: '郑和下西洋', type: '中国',
    summary: '1405年，郑和开始第一次下西洋。',
    detail: '1405年至1433年，明成祖朱棣派郑和率领船队七次下西洋。郑和的船队最远到达非洲东海岸和红海沿岸，访问了三十多个国家和地区。郑和下西洋是中国航海史上的壮举，促进了中外经济文化交流。' },

  // 于谦保卫北京
  { month: 1, day: 1, year: 1449, title: '于谦保卫北京', type: '中国',
    summary: '1449年，于谦指挥北京保卫战。',
    detail: '1449年，明英宗在土木堡被瓦剌俘虏。消息传到北京，在于谦等人的坚决主张下，明代宗即位，决心守卫北京。于谦指挥军队，动员人民，成功击退了瓦剌军的进攻，保卫了北京城。' },

  // 戚继光抗倭
  { month: 1, day: 1, year: 1560, title: '戚继光抗倭', type: '中国',
    summary: '1560年左右，戚继光平定倭寇。',
    detail: '1560年左右，戚继光到浙江、福建沿海抗倭。他训练了一支纪律严明、作战勇敢的"戚家军"，采用鸳鸯阵等战术，先后平定了浙江、福建、广东等地的倭寇。戚继光的抗倭斗争，保卫了沿海人民的生命财产安全。' },

  // 努尔哈赤统一女真
  { month: 1, day: 1, year: 1583, title: '努尔哈赤统一女真', type: '中国',
    summary: '1583年起，努尔哈赤开始统一女真各部。',
    detail: '1583年起，努尔哈赤开始用武力统一女真各部。经过三十多年的努力，他基本统一了女真各部，创建了八旗制度，为后金的建立奠定了基础。' },

  // 清军入关
  { month: 1, day: 1, year: 1644, title: '清军入关', type: '中国',
    summary: '1644年，清军进入山海关。',
    detail: '1644年，李自成攻占北京，明朝灭亡。吴三桂引清军入关，在山海关大败李自成。清军随后占领北京，开始了清朝统一全国的进程。' },

  // 康乾盛世
  { month: 1, day: 1, year: 1662, title: '康乾盛世', type: '中国',
    summary: '1662年至1796年，清朝出现康乾盛世。',
    detail: '从1662年康熙皇帝即位到1796年乾隆皇帝退位，清朝出现了长达一百多年的盛世局面。这一时期，中国政治稳定，经济繁荣，人口增长，文化昌盛。康熙、雍正、乾隆三位皇帝励精图治，使清朝的疆域达到最大化。' },

  // 鸦片走私
  { month: 1, day: 1, year: 1800, title: '鸦片走私泛滥', type: '中国',
    summary: '19世纪初，英国向中国走私鸦片。',
    detail: '19世纪初，英国为扭转对华贸易逆差，开始向中国大量走私鸦片。鸦片走私不仅使中国白银大量外流，还严重毒害了中国人民的身心健康。林则徐在给道光皇帝的奏折中说：如果不严禁鸦片，"数十年后，中国几无可以御敌之兵，且无可以充饷之银"。' },

  // 虎门销烟
  { month: 6, day: 3, year: 1839, title: '虎门销烟', type: '中国',
    summary: '1839年6月，林则徐在虎门销毁鸦片。',
    detail: '1839年6月3日至25日，林则徐在广东虎门海滩当众销毁鸦片二万余箱，约二百三十七万斤。虎门销烟向世界表明了中国人民反抗外国侵略的决心，是近代中国反帝斗争的光辉起点。' },

  // 三元里抗英
  { month: 5, day: 31, year: 1841, title: '三元里抗英斗争', type: '中国',
    summary: '1841年5月，广州三元里人民抗英。',
    detail: '1841年5月，英军在广州三元里骚扰百姓。三元里一百零三乡人民自动组织起来，在牛栏岗围困英军，迫使其逃回四方炮台。三元里抗英斗争是中国近代史上人民群众自发反抗外国侵略者的第一次大规模斗争。' },

  // 洋务运动
  { month: 1, day: 1, year: 1861, title: '洋务运动', type: '中国',
    summary: '1861年至1894年，洋务运动开展。',
    detail: '1861年至1894年，清朝洋务派以"自强""求富"为口号，引进西方先进技术，创办近代企业，建立新式学堂，派遣留学生。洋务运动创办了安庆内军械所、江南制造总局、轮船招商局等企业，为中国近代化奠定了基础。' },

  // 甲午战争
  { month: 7, day: 25, year: 1894, title: '甲午战争', type: '中国',
    summary: '1894年至1895年，甲午战争爆发。',
    detail: '1894年7月，日本发动侵华战争。战争期间，北洋舰队在黄海海战中损失惨重威海卫军港被日军攻陷，北洋舰队全军覆没。1895年，清政府被迫签订《马关条约》，割让台湾、辽东半岛，赔款白银二亿两。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '戊戌变法', type: '中国',
    summary: '1898年，戊戌变法开始。',
    detail: '1898年6月11日至9月21日，光绪皇帝推行戊戌变法。变法期间颁布了上百道诏令，涉及政治、经济、文化教育等方面。由于触动了顽固派的利益，变法仅维持了103天就被镇压。谭嗣同等六人被杀害，史称"戊戌六君子"。' },

  // 义和团运动
  { month: 1, day: 1, year: 1900, title: '义和团运动', type: '中国',
    summary: '1900年，义和团运动高潮。',
    detail: '1900年，义和团运动在中国北方达到高潮。他们提出"扶清灭洋"口号，围攻外国使馆。八国联军入侵中国，攻占北京，慈禧太后挟持光绪帝西逃。义和团运动在中外反动势力的联合镇压下失败。' },

  // 辛亥革命
  { month: 10, day: 10, year: 1911, title: '辛亥革命', type: '中国',
    summary: '1911年，辛亥革命爆发。',
    detail: '1911年10月10日，革命党人在武昌发动起义，各省纷纷响应。1912年1月1日，中华民国成立，孙中山就任临时大总统。2月12日，清帝退位，结束了中国两千多年的封建帝制。' },

  // 北伐战争
  { month: 7, day: 9, year: 1926, title: '北伐战争', type: '中国',
    summary: '1926年至1928年，国民革命军北伐。',
    detail: '1926年7月，国民革命军从广州誓师北伐。北伐军连克长沙、武汉、南昌、南京等地，1928年张学良在东北"易帜"，北伐战争完成，中国在形式上实现了统一。' },

  // 九一八事变
  { month: 9, day: 18, year: 1931, title: '九一八事变', type: '中国',
    summary: '1931年9月18日，九一八事变爆发。',
    detail: '1931年9月18日夜，日本关东军炸毁沈阳北郊柳条湖附近南满铁路的一段，反诬是中国军队所为，随即攻占北大营。由于蒋介石下令不抵抗，东北三省在短短四个多月内全部沦陷。' },

  // 一二八事变
  { month: 1, day: 28, year: 1932, title: '一二八事变', type: '中国',
    summary: '1932年1月28日，日军进攻上海。',
    detail: '1932年1月28日，日军进攻上海，驻守上海的第十九路军在军长蔡廷锴、总指挥蒋光鼐的指挥下奋起抵抗。淞沪抗战持续了一个多月，打死打伤日军一万余人，显示了中国人民不可屈服的精神。' },

  // 长城抗战
  { month: 1, day: 1, year: 1933, title: '长城抗战', type: '中国',
    summary: '1933年，中国军队在长城沿线抗击日军。',
    detail: '1933年1月至5月，日军进攻山海关、长城各口。中国守军第二十九军等部在冷口、喜峰口、古北口等地与日军展开激战。第二十九军大刀队夜袭敌营的故事传遍全国，极大地鼓舞了全国人民的抗日热情。' },

  // 华北事变
  { month: 1, day: 1, year: 1935, title: '华北事变', type: '中国',
    summary: '1935年，日本策动华北自治。',
    detail: '1935年，日本在华北制造一系列事端，策动华北五省"自治"，企图把华北变成第二个"满洲国"。在民族危机空前严重的关头，爆发了一二九运动，掀起了全国抗日救亡运动的新高潮。' },

  // 西安事变
  { month: 12, day: 12, year: 1936, title: '西安事变', type: '中国',
    summary: '1936年12月12日，西安事变爆发。',
    detail: '1936年12月12日，张学良、杨虎城在西安扣押蒋介石，发动"兵谏"，逼蒋抗日。在中共的调停下，西安事变和平解决，成为扭转时局的关键。' },

  // 七七事变
  { month: 7, day: 7, year: 1937, title: '七七事变', type: '中国',
    summary: '1937年7月7日，七七事变爆发。',
    detail: '1937年7月7日，日军在卢沟桥附近进行军事演习，借口一名士兵"失踪"，强行炮轰宛平城。中国守军第二十九军奋起抵抗，全面抗战由此爆发。' },

  // 淞沪会战
  { month: 8, day: 13, year: 1937, title: '淞沪会战', type: '中国',
    summary: '1937年8月13日，淞沪会战爆发。',
    detail: '1937年8月13日，日军大举进攻上海，中国军队奋起抵抗。谢晋元率八百壮士死守四行仓库就是我军英勇抗敌的典型事例。会战持续三个月，粉碎了日军"三个月灭亡中国"的狂妄企图。' },

  // 南京保卫战
  { month: 12, day: 1, year: 1937, title: '南京保卫战', type: '中国',
    summary: '1937年12月，中国军队保卫南京。',
    detail: '1937年12月，中国军队在南京外围与日军激战。南京卫戍司令唐生智指挥十万守城部队拼死抵抗，但因敌我力量悬殊，南京于12月13日沦陷。日军进行了惨绝人寰的南京大屠杀。' },

  // 台儿庄战役
  { month: 3, day: 23, year: 1938, title: '台儿庄战役', type: '中国',
    summary: '1938年3月，台儿庄战役胜利。',
    detail: '1938年3月23日至4月7日，中国军队在台儿庄与日军展开激战。在第五战区司令长官李宗仁的指挥下，中国军队重创日军，歼敌一万余人，取得抗战以来正面战场的最大胜利。' },

  // 汪精卫投敌
  { month: 12, day: 30, year: 1938, title: '汪精卫投敌叛国', type: '中国',
    summary: '1938年12月，汪精卫投敌叛国。',
    detail: '1938年12月，国民党副总裁汪精卫叛国投敌。1939年底，汪精卫与日本签订卖国条约。1940年3月，汪精卫在南京成立伪国民政府，成为日本侵略者的傀儡。汪精卫的叛国投敌，受到全国人民的唾骂。' },

  // 百团大战
  { month: 8, day: 20, year: 1940, title: '百团大战', type: '中国',
    summary: '1940年8月，百团大战开始。',
    detail: '1940年8月至12月，八路军105个团在彭德怀指挥下，在华北敌后发动大规模交通破袭战。战役历时三个半月，歼敌四万余人，破坏铁路九百多公里、公路三千多公里。' },

  // 皖南事变
  { month: 1, day: 6, year: 1941, title: '皖南事变', type: '中国',
    summary: '1941年1月，国民党顽固派制造皖南事变。',
    detail: '1941年1月6日，新四军军部及直属部队九千余人在皖南泾县茂林地区遭国民党军重兵围攻。除约两千人突围外，其余大部牺牲，军长叶挺被扣押，副军长项英遇害。' },

  // 豫湘桂战役
  { month: 4, day: 1, year: 1944, title: '豫湘桂战役', type: '中国',
    summary: '1944年4月至12月，豫湘桂战役爆发。',
    detail: '1944年4月至12月，日军发动打通大陆交通线的"一号作战"，中国守军节节败退。战役期间，河南、湖南、广西等省大片国土沦陷。但中国军队也在一些地区进行了顽强抵抗。' },

  // 三大战役
  { month: 9, day: 12, year: 1948, title: '三大战役', type: '中国',
    summary: '1948年9月至1949年1月，三大战役胜利。',
    detail: '1948年9月至1949年1月，人民解放军发动辽沈、淮海、平津三大战役，共歼灭国民党军154万余人。国民党军队的主力被消灭，为解放全中国奠定了基础。' },

  // 新中国成立
  { month: 10, day: 1, year: 1949, title: '开国大典', type: '中国',
    summary: '1949年10月1日，开国大典在北京天安门广场举行。',
    detail: '1949年10月1日，毛泽东在天安门城楼上庄严宣告：中华人民共和国中央人民政府成立了！随后，举行了盛大的阅兵仪式和群众游行。当天晚上，天安门广场上举行了焰火晚会。' },

  // ========== 中国古代重要事件（续六）==========

  // 阪泉之战
  { month: 1, day: 1, year: -2700, title: '阪泉之战', type: '中国',
    summary: '约公元前2700年，黄帝大战炎帝于阪泉。',
    detail: '据传说，炎帝和黄帝是远古时期两个强大的部落首领。后来，两个部落之间发生了战争，这就是著名的"阪泉之战"。在这场战争中，黄帝率领的部落最终战胜了炎帝部落，两个部落合并，成为华夏族的主体。黄帝因此被后世尊为中华民族的共同祖先之一。' },

  // 舜禹禅让
  { month: 1, day: 1, year: -2100, title: '舜禹禅让', type: '中国',
    summary: '约公元前2100年，舜禅让帝位于禹。',
    detail: '据传说，尧帝年老时，将帝位禅让给了舜。舜帝年老后，也将帝位禅让给了禹，这就是历史上有名的"禅让制"。禅让制体现了古代圣贤"天下为公"的政治理想，被后世儒家视为理想政治的典范。' },

  // 夏启继位
  { month: 1, day: 1, year: -2070, title: '夏启继位', type: '中国',
    summary: '约公元前2070年，启继承禹的帝位，建立夏朝。',
    detail: '大禹年老时，本想按照禅让制将帝位传给益。但由于禹的儿子启势力强大，启最终继承了帝位，结束了禅让制，建立了夏朝。启继位标志着中国从"公天下"变成了"家天下"，从此开始了世袭制。' },

  // 商汤灭夏
  { month: 1, day: 1, year: -1600, title: '商汤灭夏', type: '中国',
    summary: '约公元前1600年，商汤在鸣条之战中灭掉夏朝。',
    detail: '夏朝末年，夏桀暴虐无道，引起天下大乱。商族首领汤看到时机成熟，便起兵伐夏。在鸣条之战中，商汤大败夏军，夏桀逃亡后死于南巢。商汤建立了商朝，定都于毫。商汤灭夏是中国历史上第一次朝代更替。' },

  // 伊尹辅政
  { month: 1, day: 1, year: -1550, title: '伊尹辅政', type: '中国',
    summary: '商朝初期，伊尹辅佐商王治理国家。',
    detail: '伊尹是商朝初年的重要政治家，出身奴隶，后被商汤重用。他辅佐商汤治理国家，制定了各种制度。商汤死后，伊尹又辅佐了外丙、仲壬、太甲等商王。太甲继位后，伊尹曾把他流放到桐宫反省，直到他改过自新才把他接回来。伊尹是中国历史上有名的贤相。' },

  // 武王伐纣
  { month: 1, day: 1, year: -1046, title: '武王伐纣', type: '中国',
    summary: '公元前1046年，周武王在牧野之战中灭掉商朝。',
    detail: '商朝末年，纣王暴虐无道，引起了天下人的不满。周部落的首领姬发（即周武王）在姜子牙的辅佐下，联合各路诸侯，在牧野与商军决战。由于商军中的奴隶和俘虏临阵倒戈，商军大败。纣王见大势已去，在鹿台自焚而死。商朝灭亡，周朝建立。' },

  // 周公制礼
  { month: 1, day: 1, year: -1040, title: '周公制礼', type: '中国',
    summary: '周公制定周礼，建立了一套完整的礼仪制度。',
    detail: '周公旦是周武王的弟弟，武王死后，他辅佐年幼的成王，摄政七年。周公制定了一套完整的礼乐制度，包括宗法制、分封制等，这些制度成为中国传统文化的重要组成部分。周公还主持营建洛邑，作为周朝东都。周公被誉为"元圣"，是孔子最崇拜的人物之一。' },

  // 共和行政
  { month: 1, day: 1, year: -841, title: '共和行政', type: '中国',
    summary: '公元前841年，国人暴动后，周公、召公共同执政。',
    detail: '公元前841年，周厉王实行暴政，被国人赶走。此后，周朝由周公、召公共同执政，史称"共和行政"。共和行政是中国历史上有确切纪年的开始，这一年成为中国历史有确切纪年的起点。' },

  // 幽王烽火戏诸侯
  { month: 1, day: 1, year: -771, title: '幽王烽火戏诸侯', type: '中国',
    summary: '周幽王为博褒姒一笑，烽火戏弄诸侯。',
    detail: '周幽王宠爱褒姒，想尽办法逗她笑，但都没有成功。后来他下令点燃烽火台，骗得各路诸侯带兵前来救驾。褒姒看到诸侯们白忙一场的样子，果然笑了。幽王很高兴，又多次点燃烽火戏弄诸侯。后来犬戎真的入侵时，幽王点燃烽火，却没有诸侯来救，最终被杀，西周灭亡。' },

  // 春秋争霸
  { month: 1, day: 1, year: -685, title: '齐桓公称霸', type: '中国',
    summary: '公元前685年，齐桓公成为春秋首霸。',
    detail: '齐桓公在管仲的辅佐下，实行改革，使齐国迅速强大。他打着"尊王攘夷"的旗号，联合诸侯国，抵御北方少数民族的入侵。他还帮助燕国击退山戎，帮助卫国恢复国家。由于齐桓公功绩卓著，被各诸侯国推为霸主，成为春秋时期的第一位霸主。' },

  // 晋文公称霸
  { month: 1, day: 1, year: -632, title: '晋文公称霸', type: '中国',
    summary: '公元前632年，晋文公在城濮之战后成为霸主。',
    detail: '晋文公重耳流亡在外十九年，经历了各种磨难。回国继位后，他励精图治，使晋国迅速强大。在城濮之战中，晋文公大败楚军，随后被各诸侯国推为霸主。晋文公在位九年，是春秋时期最有作为的君主之一。' },

  // 楚庄王称霸
  { month: 1, day: 1, year: -613, title: '楚庄王称霸', type: '中国',
    summary: '公元前613年至前591年，楚庄王成为春秋霸主。',
    detail: '楚庄王是春秋时期楚国最有作为的君主。他刚继位时，假装沉迷于酒色，不问政事，实际上是在观察大臣们的忠心。三年后，他开始亲政，很快使楚国强大起来。他率军北上，与晋国争夺霸主地位，在邲之战中大败晋军，成为春秋时期的霸主之一。' },

  // 吴王夫差称霸
  { month: 1, day: 1, year: -495, title: '吴王夫差称霸', type: '中国',
    summary: '公元前495年至前473年，吴王夫差成为春秋霸主。',
    detail: '吴王夫差是吴国的国君，他励精图治，使吴国迅速强大。他率军大败越国，俘虏了越王勾践。后来勾践卧薪尝胆，最终灭掉了吴国。夫差在位期间，吴国曾一度成为春秋霸主。' },

  // 越王勾践灭吴
  { month: 1, day: 1, year: -473, title: '越王勾践灭吴', type: '中国',
    summary: '公元前473年，越王勾践灭掉吴国，成为霸主。',
    detail: '越王勾践被吴王夫差俘虏后，在吴国为奴三年。回国后，他卧薪尝胆，发奋图强。经过二十年的努力，越国终于强大起来。公元前473年，勾践率军灭掉吴国，成为春秋时期的最后一位霸主。这就是历史上著名的"卧薪尝胆"的故事。' },

  // 战国开始
  { month: 1, day: 1, year: -475, title: '战国时期开始', type: '中国',
    summary: '公元前475年，战国时期开始。',
    detail: '公元前475年，中国历史进入战国时期。这一时期，周王室衰微，诸侯国之间战争不断。原来的"春秋五霸"变成了"战国七雄"，即齐、楚、燕、韩、赵、魏、秦七个强国。战国时期是中国历史上一个重要的大变革时期。' },

  // 商鞅变法
  { month: 1, day: 1, year: -356, title: '商鞅变法', type: '中国',
    summary: '公元前356年，商鞅在秦国开始变法。',
    detail: '公元前356年，秦孝公任用商鞅进行变法。商鞅颁布了垦草令等法令，鼓励农业生产，奖励军功。商鞅变法使秦国迅速强大起来，为后来秦始皇统一六国奠定了基础。' },

  // 合纵连横
  { month: 1, day: 1, year: -340, title: '合纵连横', type: '中国',
    summary: '战国时期，苏秦张仪分别倡导合纵连横。',
    detail: '战国时期，纵横家们提出了两种不同的外交策略：合纵和连横。合纵是联合南北各国共同对付强大的秦国，连横则是分化瓦解弱国。著名的纵横家有苏秦和张仪。苏秦主张合纵，曾佩戴六国相印；张仪主张连横，为秦国瓦解六国联盟。' },

  // 长平之战
  { month: 1, day: 1, year: -260, title: '长平之战', type: '中国',
    summary: '公元前260年，秦国在长平之战中大败赵国。',
    detail: '公元前260年，秦国与赵国在长平展开决战。赵国派老将廉颇坚守，秦军用反间计使赵王换用赵括。秦将白起诱敌深入，将赵军包围。断粮四十六天后，赵括率军突围，被乱箭射死。白起坑杀四十万赵军。长平之战是战国时期规模最大、伤亡最惨重的战役。' },

  // 秦始皇统一六国
  { month: 1, day: 1, year: -230, title: '秦灭六国', type: '中国',
    summary: '公元前230年至前221年，秦国统一六国。',
    detail: '公元前230年，秦国开始发动统一六国的战争。首先灭掉韩国，然后灭掉赵国、魏国、楚国、燕国，最后灭掉齐国。公元前221年，秦国完成了统一大业，建立了中国历史上第一个统一的中央集权制国家。' },

  // 秦朝建立
  { month: 1, day: 1, year: -221, title: '秦朝建立', type: '中国',
    summary: '公元前221年，秦始皇建立秦朝。',
    detail: '公元前221年，秦王嬴政统一六国后，自称"始皇帝"，建立秦朝。秦始皇统一文字、度量衡，修筑万里长城，建立郡县制，奠定了中国大一统的基础。但秦朝因暴政而短命，仅存在十五年就灭亡了。' },

  // 陈胜吴广起义
  { month: 7, day: 1, year: -209, title: '陈胜吴广起义', type: '中国',
    summary: '公元前209年，陈胜吴广在大泽乡起义。',
    detail: '公元前209年，九百名戍卒在大泽乡遇到暴雨，无法按期到达目的地。按照秦法，误期要被处死。陈胜、吴广领导戍卒起义，提出"王侯将相宁有种乎"的口号。起义军迅速发展，但最终被镇压。陈胜、吴广起义虽然失败，但它是中国历史上第一次大规模的农民起义。' },

  // 巨鹿之战
  { month: 1, day: 1, year: -207, title: '巨鹿之战', type: '中国',
    summary: '公元前207年，项羽在巨鹿大败秦军。',
    detail: '公元前207年，项羽率楚军在巨鹿与秦军决战。他下令全军破釜沉舟，只带三天口粮，表示必死的决心。楚军以一当十，奋勇杀敌，大败秦军。巨鹿之战是推翻秦朝的决定性战役。' },

  // 楚汉战争
  { month: 1, day: 1, year: -206, title: '楚汉战争', type: '中国',
    summary: '公元前206年至前202年，刘邦项羽争夺天下。',
    detail: '公元前206年至前202年，刘邦与项羽进行了四年的楚汉战争。刘邦善于用人，重用韩信、张良、萧何等人才；项羽刚愎自用，失去人心。最终，刘邦在垓下之战中大败项羽，项羽在乌江自刎。刘邦建立汉朝。' },

  // 文景之治
  { month: 1, day: 1, year: -180, title: '文景之治', type: '中国',
    summary: '汉文帝、汉景帝时期出现盛世。',
    detail: '汉文帝、汉景帝在位期间，采取轻徭薄赋、与民休息的政策。他们提倡节俭，减少刑罚，重视农业生产。在他们的治理下，社会经济得到恢复和发展，人口增加，国库充盈，史称"文景之治"。' },

  // 汉武帝加强中央集权
  { month: 1, day: 1, year: -140, title: '汉武帝大一统', type: '中国',
    summary: '汉武帝采取一系列措施加强中央集权。',
    detail: '汉武帝采取了一系列加强中央集权的措施：颁布"推恩令"削弱诸侯势力；设立刺史制度监督地方官员；推行盐铁官营增加财政收入；重用卫青、霍去病北击匈奴；派张骞出使西域；"罢黜百家，独尊儒术"。汉武帝的统治使西汉达到鼎盛。' },

  // 张骞出使西域
  { month: 1, day: 1, year: -138, title: '张骞出使西域', type: '中国',
    summary: '公元前138年，张骞出使西域。',
    detail: '公元前138年，汉武帝派张骞出使西域，联络大月氏夹击匈奴。张骞出使西域虽然没能达到预期目的，但他了解了西域各国的情况，开辟了丝绸之路。公元前119年，张骞再次出使西域，使西域各国与汉朝建立了联系。' },

  // 巫蛊之祸
  { month: 1, day: 1, year: -92, title: '巫蛊之祸', type: '中国',
    summary: '公元前92年，汉武帝晚年发生巫蛊之祸。',
    detail: '公元前92年，汉武帝晚年多病，怀疑有人用巫蛊诅咒他。他命令酷吏江充彻查此事。江充趁机陷害太子刘据，刘据被迫起兵，兵败后自杀。太子府和皇后卫子夫也都自杀。这场动乱牵连了数万人，是汉武帝晚年最大的政治悲剧。' },

  // 王莽改制
  { month: 1, day: 1, year: 9, title: '王莽改制', type: '中国',
    summary: '公元9年，王莽进行改革，试图挽救社会危机。',
    detail: '王莽建立新朝后，进行了一系列改革：将全国土地收归国有，改为王田；改革币制，发行新钱；推行五均六筦等。但这些改革措施脱离实际，反而加重了社会矛盾，引发了大规模的农民起义。' },

  // 光武中兴
  { month: 1, day: 1, year: 25, title: '光武中兴', type: '中国',
    summary: '公元25年，刘秀建立东汉，开创光武中兴。',
    detail: '刘秀在推翻新朝、统一天下的过程中，吸取了王莽改制的教训，采取了一系列缓和矛盾的政策。他减轻农民负担，释放奴婢，裁减官员。在他的治理下，社会经济得到恢复和发展，史称"光武中兴"。' },

  // 班超投笔从戎
  { month: 1, day: 1, year: 73, title: '班超投笔从戎', type: '中国',
    summary: '公元73年，班超投笔从戎，出使西域。',
    detail: '班超年轻时做文书工作，后来投笔从戎，跟随窦固出击匈奴。他被派往西域，用智慧和勇气平定了西域各国的叛乱，使西域重新归属汉朝。班超在西域活动了三十一年，为维护汉朝与西域的联系做出了重要贡献。' },

  // 黄巾起义
  { month: 1, day: 1, year: 184, title: '黄巾起义', type: '中国',
    summary: '公元184年，张角领导黄巾起义。',
    detail: '张角创立太平道，利用宗教形式组织群众，提出"苍天已死，黄天当立"的口号。公元184年，各地黄巾军同时起义，声势浩大。虽然黄巾起义最终被镇压，但它动摇了东汉的统治，导致了群雄割据的局面。' },

  // 董卓之乱
  { month: 1, day: 1, year: 189, title: '董卓之乱', type: '中国',
    summary: '公元189年，董卓率军入京，开始作乱。',
    detail: '公元189年，大将军何进召董卓入京对付宦官，结果引狼入室。董卓进京后，废少帝，立献帝，操纵朝政。他纵容士兵烧杀抢掠，无恶不作，引起了天下人的愤怒。后来司徒王允用美人计除掉了董卓。' },

  // 官渡之战
  { month: 1, day: 1, year: 200, title: '官渡之战', type: '中国',
    summary: '公元200年，曹操在官渡大败袁绍。',
    detail: '公元200年，曹操与袁绍在官渡对峙。袁绍兵多粮足，曹操兵少粮缺。但曹操采纳许攸的建议，派人火烧袁绍的粮草辎重。袁绍军大乱，曹操趁机发起进攻，大败袁绍。官渡之战奠定了曹操统一北方的基础。' },

  // 赤壁之战
  { month: 1, day: 1, year: 208, title: '赤壁之战', type: '中国',
    summary: '公元208年，孙刘联军在赤壁大败曹操。',
    detail: '公元208年，曹操率军南下，想一举统一南方。孙权与刘备联合抗曹，在赤壁与曹军决战。孙刘联军利用火攻战术，烧毁曹操战船，大败曹军。赤壁之战奠定了三国鼎立的基础。' },

  // 夷陵之战
  { month: 1, day: 1, year: 222, title: '夷陵之战', type: '中国',
    summary: '公元222年，刘备在夷陵被孙权击败。',
    detail: '关羽被杀后，刘备率军伐吴，为关羽报仇。孙权派陆逊为大都督，在夷陵与刘备对峙。陆逊采用火攻战术，大败刘备。刘备败逃白帝城，第二年病逝。夷陵之战使蜀汉元气大伤。' },

  // 诸葛亮北伐
  { month: 1, day: 1, year: 228, title: '诸葛亮北伐', type: '中国',
    summary: '公元228年至234年，诸葛亮六出祁山北伐。',
    detail: '诸葛亮为了实现兴复汉室的目标，从公元228年开始，连续六次北伐曹魏。他采取稳扎稳打的策略，但由于蜀魏两国实力悬殊，加上蜀道艰难，粮草运输困难，北伐未能成功。公元234年，诸葛亮病逝于五丈原。' },

  // 高平陵之变
  { month: 1, day: 1, year: 249, title: '高平陵之变', type: '中国',
    summary: '公元249年，司马懿发动政变夺取魏国大权。',
    detail: '公元249年，魏帝曹芳与太傅司马懿到高平陵祭扫明帝陵墓。大将军曹爽兄弟随行。司马懿趁机发动政变，控制了洛阳。曹爽投降后被杀，司马懿掌握了魏国大权。几年后，司马氏代魏建立了晋朝。' },

  // 八王之乱
  { month: 1, day: 1, year: 300, title: '八王之乱', type: '中国',
    summary: '公元300年至306年，西晋发生八王之乱。',
    detail: '公元291年至306年，西晋皇族之间爆发了争夺政权的内战。八个封王先后参与这场混战，史称"八王之乱"。这场战乱使西晋国力衰竭，最终导致了西晋的灭亡和随后的五胡乱华。' },

  // 永嘉之乱
  { month: 1, day: 1, year: 311, title: '永嘉之乱', type: '中国',
    summary: '公元311年，匈奴攻破洛阳，西晋元气大伤。',
    detail: '311年，匈奴军队攻破洛阳，俘虏晋怀帝，杀王公士民三万余人。永嘉之乱使西晋元气大伤，为后来的灭亡埋下了伏笔。永嘉之乱后，中原士族和百姓大量南迁。' },

  // 淝水之战
  { month: 1, day: 1, year: 383, title: '淝水之战', type: '中国',
    summary: '公元383年，东晋在淝水大败前秦。',
    detail: '383年，前秦皇帝苻坚率军南下，企图一举灭晋。东晋宰相谢安派谢石、谢玄率军迎战。在淝水之战中，东晋军队大败前秦军队，苻坚狼狈逃回北方。战后，前秦分裂，东晋得以保全。' },

  // 孝文帝改革
  { month: 1, day: 1, year: 494, title: '孝文帝改革', type: '中国',
    summary: '公元494年，北魏孝文帝推行汉化改革。',
    detail: '北魏孝文帝拓跋宏推行了一系列汉化改革：他下令鲜卑人改穿汉服、改用汉姓、改说汉语；鼓励鲜卑人与汉人通婚；迁都洛阳。孝文帝改革促进了民族融合，推动了鲜卑族的汉化。' },

  // 梁武帝佞佛
  { month: 1, day: 1, year: 527, title: '梁武帝佞佛', type: '中国',
    summary: '梁武帝大力提倡佛教，耗费大量国力。',
    detail: '梁武帝萧衍晚年大力提倡佛教，修建了大量寺庙。他多次出家为僧，让大臣们用重金赎身。梁武帝的佞佛政策耗费了大量国力，导致政治腐败。最终，侯景发动叛乱，梁武帝被囚禁饿死。' },

  // 隋炀帝暴政
  { month: 1, day: 1, year: 604, title: '隋炀帝暴政', type: '中国',
    summary: '隋炀帝暴虐无道，导致隋朝灭亡。',
    detail: '隋炀帝杨广在位期间，大兴土木，修建大运河、三游江都、三打高丽。他横征暴敛，滥用民力，引起了人民的强烈不满。618年，隋炀帝在江都被宇文化及缢杀，隋朝灭亡。' },

  // 玄武门之变
  { month: 1, day: 1, year: 626, title: '玄武门之变', type: '中国',
    summary: '公元626年，李世民发动玄武门之变夺取皇位。',
    detail: '626年，秦王李世民在玄武门发动政变，杀死太子李建成和齐王李元吉。随后，李渊立李世民为太子，两个月后禅位，李世民继位，是为唐太宗。玄武门之变是唐朝宫廷政变的开始。' },

  // 贞观之治
  { month: 1, day: 1, year: 627, title: '贞观之治', type: '中国',
    summary: '627年至649年，唐太宗开创贞观之治。',
    detail: '627年至649年，唐太宗在位期间，采取了一系列开明的政策。他虚心纳谏，重用魏征等贤臣；轻徭薄赋，与民休息；重视教育，培养人才。在他的治理下，唐朝政治清明，经济繁荣，史称"贞观之治"。' },

  // 女皇武则天
  { month: 1, day: 1, year: 690, title: '武则天称帝', type: '中国',
    summary: '公元690年，武则天称帝，改国号为周。',
    detail: '690年，武则天废唐睿宗，自立为帝，改国号为周，成为中国历史上唯一的女皇帝。武则天在位期间，打击士族势力，重用庶族官员，发展经济。她死后，唐朝恢复。' },

  // 开元盛世
  { month: 1, day: 1, year: 713, title: '开元盛世', type: '中国',
    summary: '713年至741年，唐朝进入开元盛世。',
    detail: '713年至741年，唐玄宗在位前期，重用姚崇、宋璟等贤相，励精图治，使唐朝达到鼎盛。这一时期，政治清明，经济繁荣，文化昌盛，史称"开元盛世"。' },

  // 安史之乱
  { month: 1, day: 1, year: 755, title: '安史之乱', type: '中国',
    summary: '755年，安禄山发动叛乱，唐朝由盛转衰。',
    detail: '755年，身兼三镇节度使的安禄山在范阳起兵叛乱。安史叛军攻占洛阳、长安，唐玄宗逃往四川。安史之乱持续了八年，唐朝元气大伤，从此由盛转衰。' },

  // 藩镇割据
  { month: 1, day: 1, year: 763, title: '藩镇割据', type: '中国',
    summary: '安史之乱后，藩镇割据局面形成。',
    detail: '安史之乱后，唐朝在各地设立藩镇，委任节度使。这些节度使拥兵自重，形成割据势力，与中央政府对抗。藩镇割据的局面一直持续到唐朝灭亡，严重削弱了唐朝的统治。' },

  // 牛李党争
  { month: 1, day: 1, year: 808, title: '牛李党争', type: '中国',
    summary: '唐朝中后期，朝臣分成牛党和李党，互相争斗。',
    detail: '唐朝中后期，以牛僧孺为首的牛党和以李德裕为首的李党进行了长达四十年的党争。两党之间互相攻击，争权夺利，严重消耗了唐朝的政治资源，加速了唐朝的衰落。' },

  // 黄巢起义
  { month: 1, day: 1, year: 874, title: '黄巢起义', type: '中国',
    summary: '874年，黄巢发动农民起义。',
    detail: '874年，黄巢率众起义，提出"均平"的口号。起义军转战大半个中国，于880年攻占长安，黄巢称帝。后来起义失败，黄巢在泰山兵败自杀。黄巢起义沉重打击了唐朝的统治，加速了唐朝的灭亡。' },

  // 五代十国
  { month: 1, day: 1, year: 907, title: '五代十国', type: '中国',
    summary: '907年，唐朝灭亡，五代十国开始。',
    detail: '907年，朱温逼迫唐哀帝禅位，建立后梁，唐朝灭亡。此后，中国北方相继出现了后梁、后唐、后晋、后汉、后周五个朝代，南方和山西则出现了十个割据政权，史称"五代十国"。' },

  // 陈桥兵变
  { month: 1, day: 1, year: 960, title: '陈桥兵变', type: '中国',
    summary: '960年，赵匡胤在陈桥兵变中建立宋朝。',
    detail: '960年，后周大将赵匡胤在陈桥驿被部下黄袍加身，拥立为帝，建立宋朝。赵匡胤就是宋太祖。陈桥兵变是历史上一次不流血的政变，它结束了五代十国的混乱局面。' },

  // 杯酒释兵权
  { month: 1, day: 1, year: 961, title: '杯酒释兵权', type: '中国',
    summary: '961年，宋太祖用酒宴解除将领兵权。',
    detail: '961年，宋太祖赵匡胤担心将领们会仿效自己黄袍加身，于是设宴款待石守信等将领。在宴席上，他暗示将领们交出兵权。将领们心领神会，第二天就上表请求解除兵权。这就是历史上有名的"杯酒释兵权"。' },

  // 澶渊之盟
  { month: 1, day: 1, year: 1004, title: '澶渊之盟', type: '中国',
    summary: '1004年，宋辽签订澶渊之盟。',
    detail: '1004年，辽军大举南侵，宋真宗在寇准的坚持下御驾亲征。宋军在澶渊取得小胜，但宋真宗急于求和，与辽国签订和约。宋朝每年给辽银十万两、绢二十万匹。澶渊之盟使宋辽保持了长期的和平。' },

  // 王安石变法
  { month: 1, day: 1, year: 1069, title: '王安石变法', type: '中国',
    summary: '1069年，王安石开始变法改革。',
    detail: '1069年，宋神宗任用王安石进行变法。王安石推行青苗法、免役法、方田均税法、保甲法等新法，目的是富国强兵。但变法遭到保守派的反对，最终失败。' },

  // 靖康之变
  { month: 1, day: 1, year: 1126, title: '靖康之变', type: '中国',
    summary: '1126年，金兵南下，北宋危机。',
    detail: '1126年，金兵大举南侵，包围北宋都城开封。宋钦宗在李纲的坚持下组织抵抗。但宋钦宗后来听信投降派的话，罢免李纲，向金求和。1127年，金兵再次南下，攻破开封，俘虏宋徽宗、宋钦宗，北宋灭亡。' },

  // 岳飞北伐
  { month: 1, day: 1, year: 1134, title: '岳飞北伐', type: '中国',
    summary: '1134年至1141年，岳飞率军北伐抗金。',
    detail: '1134年，岳飞率军北伐，收复了襄阳六郡，这是南宋建立以来第一次收复失地。此后，岳飞又多次北伐，一直打到开封附近的朱仙镇。但宋高宗和秦桧与金国议和，以"莫须有"的罪名将岳飞杀害。' },

  // 蒙古统一
  { month: 1, day: 1, year: 1206, title: '成吉思汗统一蒙古', type: '中国',
    summary: '1206年，铁木真统一蒙古各部，建立蒙古汗国。',
    detail: '1206年，铁木真统一了蒙古各部，被推举为"成吉思汗"，建立蒙古汗国。成吉思汗及其子孙发动了一系列征服战争，建立了人类历史上版图最大的帝国。' },

  // 钓鱼城之战
  { month: 1, day: 1, year: 1259, title: '钓鱼城之战', type: '中国',
    summary: '1259年，钓鱼城保卫战，蒙古大汗战死。',
    detail: '1259年，蒙古大汗蒙哥率军攻打钓鱼城。宋守将王坚、张珏率军民死守，击退了蒙古军的进攻。蒙哥在攻城时被炮石击中身亡。蒙古军被迫撤退，钓鱼城保卫战取得胜利。' },

  // 元朝统一
  { month: 1, day: 1, year: 1279, title: '元朝统一全国', type: '中国',
    summary: '1279年，元朝灭掉南宋，完成统一。',
    detail: '1271年，忽必烈改国号为"大元"，建立元朝。1279年，元军在崖山彻底击败南宋残余势力，南宋灭亡。元朝的统一结束了长期的分裂局面，但实行民族歧视政策，引起汉族人民的不满。' },

  // 红巾军起义
  { month: 1, day: 1, year: 1351, title: '红巾军起义', type: '中国',
    summary: '1351年，韩山童、刘福通发动红巾军起义。',
    detail: '1351年，白莲教首领韩山童、刘福通在颍州发动起义，起义军头裹红巾，史称"红巾军起义"。红巾军起义迅速蔓延全国，其中郭子兴、朱元璋等部最终推翻了元朝。' },

  // 朱元璋建立明朝
  { month: 1, day: 1, year: 1368, title: '明朝建立', type: '中国',
    summary: '1368年，朱元璋建立明朝，定都南京。',
    detail: '1368年，朱元璋在应天府称帝，建立明朝，朱元璋就是明太祖。同年，明军攻占大都，元朝灭亡。朱元璋吸取历史教训，实行分封制，大肆诛杀功臣，加强中央集权。' },

  // 靖难之役
  { month: 1, day: 1, year: 1399, title: '靖难之役', type: '中国',
    summary: '1399年至1402年，朱棣发动靖难之役夺取皇位。',
    detail: '1399年，燕王朱棣以"清君侧"为名，发动靖难之役。1402年，朱棣率军攻入南京，建文帝下落不明。朱棣自立为帝，是为明成祖。靖难之役是明朝皇室内部争夺皇位的战争。' },

  // 郑和下西洋
  { month: 7, day: 11, year: 1405, title: '郑和下西洋', type: '中国',
    summary: '1405年，郑和开始第一次下西洋。',
    detail: '1405年至1433年，郑和率领庞大的船队七次下西洋，到达了东南亚、南亚、西亚和非洲东海岸。郑和下西洋是中国航海史上的壮举，促进了中外经济文化交流。' },

  // 土木堡之变
  { month: 8, day: 15, year: 1449, title: '土木堡之变', type: '中国',
    summary: '1449年，明英宗在土木堡被瓦剌俘虏。',
    detail: '1449年，明英宗在宦官王振的怂恿下亲征瓦剌。由于王振的错误指挥，明军在土木堡被围全军覆没，明英宗被俘。消息传到北京，于谦等人拥立明代宗，组织北京保卫战，击退瓦剌军。' },

  // 夺门之变
  { month: 1, day: 1, year: 1457, title: '夺门之变', type: '中国',
    summary: '1457年，明英宗复辟，重新夺回皇位。',
    detail: '1457年，明代宗病重，石亨、徐有贞等人拥立明英宗复辟，重新夺回皇位。史称"夺门之变"。明英宗复辟后，害死于谦。' },

  // 俺答封贡
  { month: 1, day: 1, year: 1571, title: '俺答封贡', type: '中国',
    summary: '1571年，明朝封俺答汗为顺义王。',
    detail: '1571年，明朝封蒙古首领俺答汗为顺义王，开放边境互市贸易，史称"俺答封贡"。从此，明朝与蒙古保持了长期的和平关系，边境地区出现了繁荣的局面。' },

  // 努尔哈赤起兵
  { month: 1, day: 1, year: 1583, title: '努尔哈赤起兵统一女真', type: '中国',
    summary: '1583年起，努尔哈赤开始统一女真各部。',
    detail: '1583年起，努尔哈赤以十三副遗甲起兵，开始统一女真各部。经过三十多年的努力，他基本统一了女真各部，创建了八旗制度。1616年，努尔哈赤称汗，建立后金。' },

  // 宁远大捷
  { month: 1, day: 1, year: 1626, title: '宁远大捷', type: '中国',
    summary: '1626年，袁崇焕在宁远击败努尔哈赤。',
    detail: '1626年，努尔哈赤率军进攻宁远。袁崇焕率军死守，用红夷大炮猛烈轰击后金军。努尔哈赤在这次战役中被炮石击伤，后金军被迫撤退。努尔哈赤不久后去世。' },

  // 明末农民起义
  { month: 1, day: 1, year: 1628, title: '明末农民起义爆发', type: '中国',
    summary: '1628年，高迎祥、李自成等发动农民起义。',
    detail: '1628年，陕西发生大饥荒，高迎祥、李自成，张献忠等发动农民起义。起义军转战全国各地，最终在李自成的领导下攻占北京，推翻了明朝。但李自成在山海关战败，清军入关，起义最终失败。' },

  // 努尔哈赤迁都沈阳
  { month: 1, day: 1, year: 1625, title: '努尔哈赤迁都沈阳', type: '中国',
    summary: '1625年，努尔哈赤迁都沈阳。',
    detail: '1625年，努尔哈赤将都城从辽阳迁到沈阳。沈阳靠近中原，便于进攻明朝。努尔哈赤在沈阳建立了后金的统治中心，为清朝的建立奠定了基础。' },

  // 清军入关
  { month: 1, day: 1, year: 1644, title: '清军入关', type: '中国',
    summary: '1644年，清军入关，定都北京。',
    detail: '1644年，李自成攻占北京，明朝灭亡。吴三桂引清军入关，在山海关大败李自成。清军随后占领北京，顺治皇帝定都北京，开始了清朝统一全国的进程。' },

  // 扬州十日
  { month: 1, day: 1, year: 1645, title: '扬州十日', type: '中国',
    summary: '1645年，清军在扬州进行大屠杀。',
    detail: '1645年，清军攻占扬州后，对扬州人民进行了十天的大屠杀。据估计，死难者达八十万人。扬州十日是清军入关后的暴行之一。' },

  // 嘉定三屠
  { month: 1, day: 1, year: 1645, title: '嘉定三屠', type: '中国',
    summary: '1645年，清军在嘉定进行三次大屠杀。',
    detail: '1645年，清军攻占嘉定后，因为当地人民反抗，先后进行了三次大屠杀。这就是历史上著名的"嘉定三屠"。清军的暴行激起了江南人民的强烈反抗。' },

  // 郑成功收复台湾
  { month: 4, day: 1, year: 1661, title: '郑成功收复台湾', type: '中国',
    summary: '1661年，郑成功率军收复台湾。',
    detail: '1661年4月，郑成功率军从金门出发，在台湾登陆。经过九个月的战斗，郑成功击败了荷兰殖民者，收复了台湾。郑成功收复台湾，维护了中国的领土完整。' },

  // 三藩之乱
  { month: 1, day: 1, year: 1673, title: '三藩之乱', type: '中国',
    summary: '1673年，吴三桂等三藩发动叛乱。',
    detail: '1673年，平西王吴三桂、平南王尚可喜、靖南王耿精忠发动叛乱，史称"三藩之乱"。康熙皇帝采取分化瓦解的策略，1681年平定了叛乱。三藩之乱的平定加强了清朝的统治。' },

  // 雅克萨之战
  { month: 1, day: 1, year: 1685, title: '雅克萨之战', type: '中国',
    summary: '1685年至1689年，清军击败沙俄侵略者。',
    detail: '1685年和1689年，清军两次在雅克萨击败沙俄侵略军。1689年，中俄签订《尼布楚条约》，划定了两国东段边界。雅克萨之战捍卫了中国的领土主权。' },

  // 文字狱
  { month: 1, day: 1, year: 1711, title: '文字狱', type: '中国',
    summary: '清朝大兴文字狱，压制反清思想。',
    detail: '1711年，清朝开始大兴文字狱，压制反清思想。文字狱是清朝统治者为了维护统治，对知识分子进行思想压制的手段。许多文人因为文字狱而家破人亡，文字狱一直持续到清朝灭亡。' },

  // 乾隆闭关锁国
  { month: 1, day: 1, year: 1757, title: '乾隆闭关锁国', type: '中国',
    summary: '1757年，乾隆关闭其它口岸，只留广州一口通商。',
    detail: '1757年，乾隆皇帝实行闭关锁国政策，关闭了其它沿海口岸，只留广州一口通商。闭关锁国政策使中国失去了与西方交流的机会，逐渐落后于世界潮流。' },

  // ========== 中国近代重要事件（续五）==========

  // 鸦片战争
  { month: 6, day: 28, year: 1840, title: '第一次鸦片战争爆发', type: '中国',
    summary: '1840年6月，英国发动第一次鸦片战争。',
    detail: '1840年6月，英国为保护鸦片贸易，发动了侵略中国的战争。战争持续了两年多。1842年，清政府被迫签订《南京条约》，割让香港岛，赔款二千一百万元，开放广州、厦门、福州、宁波、上海五口通商。鸦片战争是中国近代史的开端。' },

  // 虎门销烟
  { month: 6, day: 3, year: 1839, title: '虎门销烟', type: '中国',
    summary: '1839年6月，林则徐在虎门销毁鸦片。',
    detail: '1839年6月3日至25日，林则徐在广东虎门海滩当众销毁鸦片二万余箱。虎门销烟是中国人民反抗外国侵略的壮举，向世界表明了中国人民维护民族尊严的决心。' },

  // 太平天国运动
  { month: 1, day: 11, year: 1851, title: '太平天国金田起义', type: '中国',
    summary: '1851年1月11日，洪秀全在金田村发动起义。',
    detail: '1851年1月11日，洪秀全在广西桂平县金田村发动起义，建号太平天国。起义军从广西打到江苏，于1853年攻占南京，定都于此。太平天国颁布《天朝田亩制度》，提出平均分配土地的理想。1864年，天京陷落，太平天国运动失败。' },

  // 第二次鸦片战争
  { month: 10, day: 8, year: 1856, title: '第二次鸦片战争爆发', type: '中国',
    summary: '1856年，英法联军发动第二次鸦片战争。',
    detail: '1856年，英国以"亚罗号事件"为借口，法国以"马神甫事件"为借口，联合发动战争。1858年，联军攻占天津；1860年，联军攻占北京，火烧圆明园。清政府被迫签订《天津条约》《北京条约》。' },

  // 洋务运动
  { month: 1, day: 1, year: 1861, title: '洋务运动开始', type: '中国',
    summary: '1861年，洋务运动开始，中国近代化起步。',
    detail: '1861年至1894年，清朝洋务派以"自强""求富"为口号，引进西方技术，创办近代企业。洋务运动创办了江南制造总局、轮船招商局等一批企业，派遣留学生，为中国近代化奠定了基础。' },

  // 中法战争
  { month: 8, day: 23, year: 1884, title: '中法战争爆发', type: '中国',
    summary: '1884年8月，中法战争爆发。',
    detail: '1884年8月23日，法国舰队袭击福建马尾军港，清政府被迫对法宣战。战争中，老将冯子材在镇南关取得大捷。但清政府反而与法国签订不平等条约。' },

  // 甲午战争
  { month: 7, day: 25, year: 1894, title: '甲午战争爆发', type: '中国',
    summary: '1894年7月，甲午中日战争爆发。',
    detail: '1894年7月25日，日本舰队在丰岛海面袭击中国运兵船，甲午战争爆发。战争持续近九个月，北洋舰队在黄海海战和威海卫战役中全军覆没。1895年，清政府被迫签订《马关条约》，割让台湾和辽东半岛，赔款白银二亿两。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '百日维新', type: '中国',
    summary: '1898年6月11日，戊戌变法开始。',
    detail: '1898年6月11日至9月21日，光绪皇帝推行新法，史称"百日维新"。变法期间颁布了上百道诏令。9月21日，慈禧太后发动政变，囚禁光绪帝，捕杀维新派。谭嗣同等六人被杀害，史称"戊戌六君子"。' },

  // 义和团运动
  { month: 1, day: 1, year: 1900, title: '义和团运动', type: '中国',
    summary: '1900年，义和团运动达到高潮。',
    detail: '1900年，义和团运动在中国北方达到高潮。义和团民围攻外国使馆、教堂。八国联军入侵中国，攻占北京，慈禧太后挟持光绪帝西逃。义和团运动在中外反动势力的联合镇压下失败。' },

  // 辛亥革命
  { month: 10, day: 10, year: 1911, title: '武昌起义', type: '中国',
    summary: '1911年10月10日，武昌起义爆发。',
    detail: '1911年10月10日晚，革命党人在武昌发动起义，迅速占领武昌、汉口、汉阳三镇。1912年1月1日，中华民国临时政府成立，孙中山就任临时大总统。2月12日，清帝退位，清朝灭亡，封建帝制结束。' },

  // 二次革命
  { month: 7, day: 12, year: 1913, title: '二次革命', type: '中国',
    summary: '1913年7月，孙中山发动二次革命。',
    detail: '1913年3月，宋教仁在上海被暗杀。7月，孙中山发动二次革命，反对袁世凯的独裁统治。二次革命很快失败，孙中山等人流亡海外。' },

  // 护国战争
  { month: 12, day: 25, year: 1915, title: '护国战争', type: '中国',
    summary: '1915年12月，蔡锷发动护国战争。',
    detail: '1915年12月25日，蔡锷在云南宣布独立，组织护国军，讨伐称帝的袁世凯。贵州、广西等省相继响应。袁世凯被迫取消帝制，不久病死。' },

  // 新文化运动
  { month: 9, day: 15, year: 1915, title: '新文化运动', type: '中国',
    summary: '1915年9月，新文化运动开始。',
    detail: '1915年9月，陈独秀创办《青年杂志》（后改名《新青年》），标志着新文化运动的开始。新文化运动提倡民主与科学，反对封建礼教，文学革命使白话文取代文言文。' },

  // 五四运动
  { month: 5, day: 4, year: 1919, title: '五四运动', type: '中国',
    summary: '1919年5月4日，北京学生发动五四运动。',
    detail: '1919年5月4日，北京学生三千多人在天安门前集会，抗议巴黎和会上的不平等条约。五四运动迅速扩展为全国性的爱国运动，工人罢工、商人罢市。五四运动是中国新民主主义革命的开端。' },

  // 中国共产党成立
  { month: 7, day: 23, year: 1921, title: '中国共产党成立', type: '中国',
    summary: '1921年7月23日，中国共产党第一次全国代表大会召开。',
    detail: '1921年7月23日，中国共产党第一次全国代表大会在上海召开。大会通过了党的第一个纲领，选举产生了中央局。中国共产党的成立，是中国历史上开天辟地的大事。' },

  // 北伐战争
  { month: 7, day: 9, year: 1926, title: '北伐战争开始', type: '中国',
    summary: '1926年7月，国民革命军开始北伐。',
    detail: '1926年7月9日，国民革命军从广州誓师北伐。北伐军连克长沙、武汉、南昌、南京等地。1928年张学良东北"易帜"，北伐完成，国民政府在形式上统一了全国。' },

  // 南昌起义
  { month: 8, day: 1, year: 1927, title: '南昌起义', type: '中国',
    summary: '1927年8月1日，南昌起义爆发。',
    detail: '1927年8月1日，周恩来、贺龙、叶挺、朱德等率领革命军起义，打响了武装反抗国民党反动派的第一枪。南昌起义是中国共产党独立领导革命战争、创建人民军队的开始。' },

  // 井冈山会师
  { month: 4, day: 28, year: 1928, title: '井冈山会师', type: '中国',
    summary: '1928年4月，毛泽东与朱德在井冈山会师。',
    detail: '1928年4月，朱德、陈毅率领南昌起义余部和湘南起义农军来到井冈山，与毛泽东领导的秋收起义部队胜利会师。两军合编为中国工农红军第四军。' },

  // 九一八事变
  { month: 9, day: 18, year: 1931, title: '九一八事变', type: '中国',
    summary: '1931年9月18日，日本关东军制造柳条湖事件。',
    detail: '1931年9月18日夜，日本关东军炸毁柳条湖铁路，诬陷为中国军队所为，随即攻占沈阳。由于蒋介石下令不抵抗，东北三省在四个多月内全部沦陷。' },

  // 遵义会议
  { month: 1, day: 15, year: 1935, title: '遵义会议', type: '中国',
    summary: '1935年1月，遵义会议召开。',
    detail: '1935年1月15日至17日，中共中央在贵州遵义召开政治局扩大会议。会议结束了王明"左"倾教条主义在中央的统治，确立了毛泽东在党中央和红军的领导地位。遵义会议是党的历史上一个生死攸关的转折点。' },

  // 一二九运动
  { month: 12, day: 9, year: 1935, title: '一二九运动', type: '中国',
    summary: '1935年12月9日，北平学生发动一二九运动。',
    detail: '1935年12月9日，北平学生举行示威游行，抗议日本侵略和国民政府的不抵抗政策，喊出"停止内战，一致对外"的口号。一二九运动促进了中华民族的觉醒。' },

  // 西安事变
  { month: 12, day: 12, year: 1936, title: '西安事变', type: '中国',
    summary: '1936年12月12日，张学良、杨虎城发动西安事变。',
    detail: '1936年12月12日，张学良、杨虎城在西安扣押蒋介石，发动"兵谏"。在中国共产党的调停下，西安事变和平解决，成为扭转时局的关键。' },

  // 七七事变
  { month: 7, day: 7, year: 1937, title: '七七事变', type: '中国',
    summary: '1937年7月7日，卢沟桥事变爆发。',
    detail: '1937年7月7日，日军在卢沟桥附近进行军事演习，借口士兵"失踪"，炮轰宛平城。中国守军奋起抵抗，全面抗战爆发。' },

  // 淞沪会战
  { month: 8, day: 13, year: 1937, title: '淞沪会战', type: '中国',
    summary: '1937年8月13日，淞沪会战爆发。',
    detail: '1937年8月13日，日军大举进攻上海。中国军队奋起抵抗，会战持续三个月。谢晋元率八百壮士死守四行仓库就是我军英勇抗敌的典型事例。' },

  // 南京大屠杀
  { month: 12, day: 13, year: 1937, title: '南京大屠杀', type: '中国',
    summary: '1937年12月13日，南京大屠杀开始。',
    detail: '1937年12月13日，日军攻占南京后，对中国军民进行了长达六个星期的大规模屠杀、奸淫、抢劫和纵火。遇难者达三十万人以上。南京大屠杀是人类历史上最黑暗的一页。' },

  // 台儿庄战役
  { month: 3, day: 23, year: 1938, title: '台儿庄战役', type: '中国',
    summary: '1938年3月，台儿庄战役胜利。',
    detail: '1938年3月23日至4月7日，中国军队在台儿庄与日军展开激战，歼敌一万余人。这是抗战以来正面战场取得的最大胜利。' },

  // 百团大战
  { month: 8, day: 20, year: 1940, title: '百团大战', type: '中国',
    summary: '1940年8月，百团大战开始。',
    detail: '1940年8月至12月，八路军105个团在华北敌后发动大规模进攻作战，破坏铁路和公路，拔除据点，歼敌四万余人。' },

  // 皖南事变
  { month: 1, day: 6, year: 1941, title: '皖南事变', type: '中国',
    summary: '1941年1月，国民党顽固派制造皖南事变。',
    detail: '1941年1月6日，新四军军部九千余人在皖南遭国民党军重兵围攻。大部牺牲，军长叶挺被扣，副军长项英遇害。' },

  // 三大战役
  { month: 9, day: 12, year: 1948, title: '三大战役', type: '中国',
    summary: '1948年9月至1949年1月，三大战役胜利结束。',
    detail: '1948年9月至1949年1月，人民解放军发动辽沈、淮海、平津三大战役，共歼灭国民党军154万余人，基本消灭了国民党军队的主力。' },

  // 中华人民共和国成立
  { month: 10, day: 1, year: 1949, title: '新中国成立', type: '中国',
    summary: '1949年10月1日，中华人民共和国成立。',
    detail: '1949年10月1日，毛泽东在天安门城楼上庄严宣告中华人民共和国中央人民政府成立。举行了盛大的阅兵仪式和群众游行。' },

  // 抗美援朝
  { month: 10, day: 19, year: 1950, title: '抗美援朝', type: '中国',
    summary: '1950年10月19日，中国人民志愿军入朝参战。',
    detail: '1950年10月19日，中国人民志愿军跨过鸭绿江，入朝参战。志愿军与朝鲜人民军并肩作战，经过三年浴血奋战，迫使美国在停战协定上签字。抗美援朝战争的胜利，保卫了新中国安全，提高了中国的国际地位。' },

  // 和平共处五项原则
  { month: 6, day: 28, year: 1953, title: '和平共处五项原则', type: '中国',
    summary: '1953年12月，中国提出和平共处五项原则。',
    detail: '1953年12月31日，周恩来在同印度谈判时，首次提出和平共处五项原则：互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。和平共处五项原则成为中国外交的基本准则。' },

  // 万隆会议
  { month: 4, day: 18, year: 1955, title: '万隆会议', type: '中国',
    summary: '1955年4月，周恩来参加万隆会议。',
    detail: '1955年4月18日至24日，亚非会议（万隆会议）在印度尼西亚万隆举行。周恩来率中国代表团参加会议，提出"求同存异"原则，推动会议取得成功。' },

  // 两弹一星
  { month: 10, day: 16, year: 1964, title: '第一颗原子弹爆炸成功', type: '中国',
    summary: '1964年10月16日，中国第一颗原子弹爆炸成功。',
    detail: '1964年10月16日，中国第一颗原子弹在新疆罗布泊爆炸成功。中国成为世界上第五个拥有核武器的国家，打破了超级大国的核垄断。' },

  // 文化大革命
  { month: 5, day: 16, year: 1966, title: '文化大革命', type: '中国',
    summary: '1966年5月16日，文化大革命开始。',
    detail: '1966年5月16日，中共中央发出"五一六"通知，文化大革命开始。这是一场由领导者错误发动、被反革命集团利用的内乱，给党、国家和各族人民带来严重灾难。' },

  // 恢复高考
  { month: 7, day: 20, year: 1977, title: '恢复高考', type: '中国',
    summary: '1977年，恢复高等学校招生考试制度。',
    detail: '1977年，邓小平恢复工作后，主持恢复高考制度。当年冬天，570万考生走进考场，27万人被录取。恢复高考为中国的改革开放和现代化建设培养了大批人才。' },

  // 改革开放
  { month: 12, day: 18, year: 1978, title: '十一届三中全会', type: '中国',
    summary: '1978年12月，十一届三中全会召开。',
    detail: '1978年12月18日至22日，中国共产党十一届三中全会在北京召开。会议确立了解放思想、实事求是的思想路线，作出了把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。' },

  // 香港回归
  { month: 7, day: 1, year: 1997, title: '香港回归祖国', type: '中国',
    summary: '1997年7月1日，香港回归祖国。',
    detail: '1997年7月1日零点，中华人民共和国香港特别行政区成立仪式隆重举行。香港回归祖国，标志着"一国两制"构想的成功实践，是中华民族的百年盛事。' },

  // 澳门回归
  { month: 12, day: 20, year: 1999, title: '澳门回归祖国', type: '中国',
    summary: '1999年12月20日，澳门回归祖国。',
    detail: '1999年12月20日，澳门回归祖国。澳门回归是继香港回归后，"一国两制"构想的又一次成功实践。' },

  // 加入世贸组织
  { month: 12, day: 11, year: 2001, title: '中国加入世界贸易组织', type: '中国',
    summary: '2001年12月11日，中国正式成为世贸组织成员。',
    detail: '2001年12月11日，中国正式成为世界贸易组织成员。这标志着中国的对外开放进入新阶段，中国经济与世界经济全面接轨。' },

  // 北京奥运会
  { month: 8, day: 8, year: 2008, title: '北京奥运会开幕', type: '中国',
    summary: '2008年8月8日，北京奥运会开幕。',
    detail: '2008年8月8日至24日，第29届夏季奥林匹克运动会在北京举行。这是中国第一次举办奥运会，中国体育代表团获得金牌榜第一名的成绩。' },

  // 一带一路
  { month: 9, day: 7, year: 2013, title: '一带一路倡议', type: '中国',
    summary: '2013年9月和10月，中国提出"一带一路"倡议。',
    detail: '2013年9月和10月，中国先后提出共建"丝绸之路经济带"和"21世纪海上丝绸之路"的重大倡议。一带一路成为构建人类命运共同体的重要实践平台。' },

  // 脱贫攻坚
  { month: 2, day: 25, year: 2021, title: '脱贫攻坚战取得全面胜利', type: '中国',
    summary: '2021年2月25日，中国宣布脱贫攻坚战取得全面胜利。',
    detail: '2021年2月25日，全国脱贫攻坚总结表彰大会在北京举行。中国完成了消除绝对贫困的历史任务，提前10年实现联合国2030年可持续发展议程减贫目标，创造了人类减贫史上的奇迹。' },

  // ========== 世界历史重要事件 ==========

  // 古埃及文明
  { month: 1, day: 1, year: -3100, title: '古埃及文明开始', type: '世界',
    summary: '约公元前3100年，埃及实现统一。',
    detail: '约公元前3100年，美尼斯统一上下埃及，建立第一王朝，标志着古埃及文明的开端。古埃及是世界四大文明古国之一，创造了象形文字、金字塔、木乃伊等辉煌的文化成就。古埃及文明延续了三千多年，直到公元前332年被亚历山大大帝征服。' },

  // 古巴比伦文明
  { month: 1, day: 1, year: -1894, title: '古巴比伦王国建立', type: '世界',
    summary: '约公元前1894年，古巴比伦王国建立。',
    detail: '约公元前1894年，阿摩利人在两河流域建立了古巴比伦王国。公元前18世纪，汉谟拉比统一了两河流域，颁布了《汉谟拉比法典》，这是世界上现存的第一部比较完整的成文法典。古巴比伦文明是世界四大文明古国之一。' },

  // 古希腊文明
  { month: 1, day: 1, year: -776, title: '第一届奥林匹克运动会', type: '世界',
    summary: '公元前776年，第一届奥林匹克运动会在希腊举行。',
    detail: '公元前776年，第一届奥林匹克运动会在希腊奥林匹亚举行，这是古代奥运会的开端。古代奥林匹克运动会每四年举行一次，持续了约一千二百年，直到公元394年被罗马皇帝狄奥多西一世废除。奥林匹克运动会是古希腊文明的重要组成部分。' },

  // 波斯帝国
  { month: 1, day: 1, year: -550, title: '波斯帝国建立', type: '世界',
    summary: '公元前550年，波斯帝国建立。',
    detail: '公元前550年，居鲁士大帝统一波斯各部，建立阿契美尼德王朝，随后征服了米底、吕底亚、新巴比伦等国，建立了庞大的波斯帝国。波斯帝国是古代世界第一个地跨亚非欧三大洲的大帝国。' },

  // 希波战争
  { month: 1, day: 1, year: -500, title: '希波战争', type: '世界',
    summary: '公元前500年至前449年，波斯帝国与希腊城邦发生战争。',
    detail: '公元前500年至前449年，波斯帝国与希腊城邦之间发生了一系列战争，史称"希波战争"。在著名的温泉关战役中，斯巴达国王列奥尼达率三百勇士英勇战死。希腊联军最终在萨拉米斯海战中击败波斯海军，取得了战争的胜利。' },

  // 伯里克利时代
  { month: 1, day: 1, year: -461, title: '伯里克利时代', type: '世界',
    summary: '公元前461年至前429年，伯里克利统治时期是雅典民主的黄金时代。',
    detail: '公元前461年至前429年，伯里克利担任雅典首席将军，实行民主改革，使雅典民主政治达到顶峰。这一时期，雅典经济繁荣，文化昌盛，帕特农神庙等伟大建筑建成，苏格拉底、柏拉图等哲学家活跃于雅典。' },

  // 亚历山大大帝
  { month: 1, day: 1, year: -336, title: '亚历山大大帝东征', type: '世界',
    summary: '公元前334年，亚历山大大帝开始东征。',
    detail: '公元前334年至前323年，马其顿国王亚历山大大帝率军东征，征服了波斯帝国、埃及，并一直打到印度河流域。亚历山大的东征促进了东西方文化的交流，创建了"希腊化时代"。他33岁去世时，帝国已经分裂。' },

  // 罗马共和国
  { month: 1, day: 1, year: -509, title: '罗马共和国建立', type: '世界',
    summary: '公元前509年，罗马共和国建立。',
    detail: '公元前509年，罗马人推翻了伊特鲁里亚国王，建立了罗马共和国。罗马共和国实行贵族共和制，设置了元老院和执政官。在数百年的发展中，罗马共和国不断扩张，最终成为地中海地区的霸主。' },

  // 斯巴达克起义
  { month: 1, day: 1, year: -73, title: '斯巴达克起义', type: '世界',
    summary: '公元前73年，斯巴达克领导奴隶起义。',
    detail: '公元前73年至前71年，角斗士斯巴达克领导了古罗马最大的一次奴隶起义。起义军转战意大利半岛各地，屡败罗马军队，声势浩大。最后，罗马出动六个军团才镇压了这次起义。斯巴达克起义沉重打击了罗马的奴隶制度。' },

  // 凯撒遇刺
  { month: 3, day: 15, year: -44, title: '凯撒遇刺', type: '世界',
    summary: '公元前44年3月15日，罗马独裁者凯撒被刺杀。',
    detail: '公元前44年3月15日，罗马独裁者尤利乌斯·凯撒在元老院被布鲁图斯等人刺杀，据说留下了"你也有份，布鲁图斯？"的名言。凯撒的遇刺引发了罗马的内战，最终导致罗马从共和国转变为帝国。' },

  // 罗马帝国建立
  { month: 1, day: 1, year: -27, title: '罗马帝国建立', type: '世界',
    summary: '公元前27年，屋大维建立罗马帝国。',
    detail: '公元前27年，元老院授予屋大维"奥古斯都"的称号，标志着罗马帝国的开始。屋大维结束了几十年的内战，开创了罗马历史上的"罗马和平"时期。在他的统治下，罗马帝国进入鼎盛时代。' },

  // 基督教诞生
  { month: 1, day: 1, year: 1, title: '基督教诞生', type: '世界',
    summary: '公元1世纪，基督教在罗马帝国境内诞生。',
    detail: '基督教起源于公元1世纪的巴勒斯坦地区，创始人据传是拿撒勒人耶稣。基督教宣传上帝面前人人平等，强调博爱与救赎。基督教最初遭到罗马帝国的迫害，但后来逐渐传播开来，成为罗马帝国的国教，并发展为世界三大宗教之一。' },

  // 伊斯兰教创立
  { month: 1, day: 1, year: 610, title: '伊斯兰教创立', type: '世界',
    summary: '公元610年，穆罕默德开始传播伊斯兰教。',
    detail: '公元610年，先知穆罕默德在麦加开始传播伊斯兰教。伊斯兰教宣传一神崇拜，提倡平等与博爱。622年，穆罕默德迁居麦地那，这一年成为伊斯兰历的元年。伊斯兰教的创立对世界历史产生了深远影响。' },

  // 查理曼帝国
  { month: 1, day: 1, year: 800, title: '查理曼帝国建立', type: '世界',
    summary: '公元800年，查理曼加冕为皇帝。',
    detail: '公元800年圣诞节，教皇利奥三世为查理曼加冕，称其为"罗马人的皇帝"。查理曼帝国是中世纪欧洲最强大的王国，疆域包括今法国、德国、意大利等地。查理曼帝国分裂后，形成了后来法国、德国、意大利等国的雏形。' },

  // 十字军东征
  { month: 1, day: 1, year: 1096, title: '十字军东征', type: '世界',
    summary: '1096年至1291年，十字军东征。',
    detail: '1096年至1291年，欧洲封建主发动了多次十字军东征，目标是夺取耶路撒冷。十字军东征虽然失败了，但它促进了东西方文化的交流，带来了拜占庭文化和阿拉伯文化向西欧的传播。' },

  // 百年战争
  { month: 1, day: 1, year: 1337, title: '英法百年战争', type: '世界',
    summary: '1337年至1453年，英法两国发生百年战争。',
    detail: '1337年至1453年，英法两国之间爆发了长达116年的战争。战争期间，法国农家女贞德率军抗击英军，扭转了战局。百年战争最终以法国的胜利告终，法国实现了民族统一。' },

  // 文艺复兴
  { month: 1, day: 1, year: 1300, title: '文艺复兴', type: '世界',
    summary: '14世纪至17世纪，欧洲文艺复兴运动。',
    detail: '文艺复兴是一场欧洲思想文化运动，始于意大利，逐渐传播到整个欧洲。文艺复兴提倡人文主义，强调人的价值和尊严，反对中世纪的宗教蒙昧主义。文艺复兴催生了达芬奇、米开朗基罗、拉斐尔等艺术大师，也产生了哥白尼、伽利略等科学先驱。' },

  // 宗教改革
  { month: 1, day: 1, year: 1517, title: '马丁·路德宗教改革', type: '世界',
    summary: '1517年，马丁·路德发表《九十五条论纲》。',
    detail: '1517年，马丁·路德发表《九十五条论纲》，批评天主教会的腐败和赎罪券制度，标志宗教改革的开始。宗教改革打破了天主教会的垄断，产生了新教各派，促进了欧洲各国的宗教和政治变革。' },

  // 英国工业革命
  { month: 1, day: 1, year: 1760, title: '英国工业革命', type: '世界',
    summary: '1760年至1840年，英国工业革命。',
    detail: '1760年至1840年，英国发生了工业革命，机器取代手工劳动，大工厂取代了小作坊。工业革命极大地提高了生产效率，促进了经济的快速发展，也带来了社会结构的深刻变化。工业革命从英国传播到欧洲大陆和北美，改变了整个世界的面貌。' },

  // 美国独立
  { month: 7, day: 4, year: 1776, title: '美国独立', type: '世界',
    summary: '1776年7月4日，美国独立宣言发表。',
    detail: '1776年7月4日，大陆会议通过《独立宣言》，宣告美国独立。《独立宣言》提出"人人生而平等"的原则，宣称人民有权推翻暴政。《独立宣言》的发表标志着美国的诞生，也对世界民主运动产生了深远影响。' },

  // 法国大革命
  { month: 7, day: 14, year: 1789, title: '法国大革命', type: '世界',
    summary: '1789年7月14日，法国大革命爆发。',
    detail: '1789年7月14日，巴黎人民攻占巴士底狱，法国大革命爆发。大革命推翻了封建专制制度，发表了《人权宣言》，提出了"自由、平等、博爱"的口号。法国大革命对世界历史产生了深远影响，被誉为"规模最大的革命"。' },

  // 拿破仑战争
  { month: 1, day: 1, year: 1804, title: '拿破仑称帝', type: '世界',
    summary: '1804年12月，拿破仑称帝。',
    detail: '1804年12月，拿破伦加冕为法兰西皇帝。拿破仑战争席卷了整个欧洲，传播了法国大革命的思想，但也带来了战争和破坏。1815年，拿破伦在滑铁卢战役中战败，拿破伦时代结束。' },

  // 美国内战
  { month: 4, day: 12, year: 1861, title: '美国内战爆发', type: '世界',
    summary: '1861年4月12日，美国内战爆发。',
    detail: '1861年4月12日，南北战争爆发。这场战争的焦点是奴隶制度问题。林肯总统领导北方联邦军击败南方邦联军，维护了美国的统一。1863年，林肯发表《解放奴隶宣言》。美国内战的胜利，为资本主义的发展扫清了障碍。' },

  // 日本明治维新
  { month: 1, day: 1, year: 1868, title: '日本明治维新', type: '世界',
    summary: '1868年，日本开始明治维新。',
    detail: '1868年，日本开始了明治维新运动。明治政府实行了一系列改革措施：废藩置县、殖产兴业、文明开化、富国强兵。明治维新使日本迅速走上资本主义道路，成为亚洲第一个实现现代化的国家。' },

  // 第一次世界大战
  { month: 7, day: 28, year: 1914, title: '第一次世界大战爆发', type: '世界',
    summary: '1914年7月28日，第一次世界大战爆发。',
    detail: '1914年7月28日，奥匈帝国向塞尔维亚宣战，第一次世界大战爆发。战争持续了四年多，先后有三十多个国家卷入战争，造成约一千万人死亡。1918年11月11日，德国投降，第一次世界大战结束。' },

  // 俄国十月革命
  { month: 11, day: 7, year: 1917, title: '俄国十月革命', type: '世界',
    summary: '1917年11月7日，俄国十月革命爆发。',
    detail: '1917年11月7日（俄历10月25日），布尔什维克党在列宁领导下发动革命，推翻了临时政府，建立了苏维埃政权。十月革命建立了世界上第一个社会主义国家，对世界历史产生了深远影响。' },

  // 第二次世界大战
  { month: 9, day: 1, year: 1939, title: '第二次世界大战爆发', type: '世界',
    summary: '1939年9月1日，第二次世界大战爆发。',
    detail: '1939年9月1日，德国入侵波兰，第二次世界大战爆发。战争持续了六年，先后有六十多个国家卷入战争，造成约七千万人死亡。1945年8月，日本投降，第二次世界大战结束。' },

  // 联合国成立
  { month: 10, day: 24, year: 1945, title: '联合国成立', type: '世界',
    summary: '1945年10月24日，联合国正式成立。',
    detail: '1945年10月24日，联合国正式成立。联合国的宗旨是维护国际和平与安全，促进国际合作。联合国宪章于1945年6月26日在旧金山签署，中国是联合国的创始会员国和安理会常任理事国。' },

  // 冷战开始
  { month: 3, day: 12, year: 1947, title: '冷战开始', type: '世界',
    summary: '1947年3月，杜鲁门主义出台，冷战开始。',
    detail: '1947年3月，美国总统杜鲁门发表演说，提出"杜鲁门主义"，标志着冷战的开始。冷战期间，美国和苏联两个超级大国进行全方位的对抗，但避免直接军事冲突。1991年苏联解体，冷战结束。' },

  // 欧盟成立
  { month: 11, day: 1, year: 1993, title: '欧洲联盟成立', type: '世界',
    summary: '1993年11月1日，欧洲联盟正式成立。',
    detail: '1993年11月1日，《马斯特里赫特条约》生效，欧洲联盟正式成立。欧盟是由欧洲共同体发展而来的区域性国际组织，目前有27个成员国。欧盟的成立促进了欧洲一体化进程，对世界政治和经济格局产生了重要影响。' },

  // 苏联解体
  { month: 12, day: 26, year: 1991, title: '苏联解体', type: '世界',
    summary: '1991年12月26日，苏联正式解体。',
    detail: '1991年12月26日，苏联最高苏维埃通过决议，宣布苏联停止存在。苏联解体标志着冷战的结束和两极格局的终结。俄罗斯联邦成为苏联的主要继承国，继承了联合国安理会常任理事国地位。' },

  // 秦始皇统一中国
  { month: 10, day: 1, year: -221, title: '秦始皇统一中国', type: '中国',
    summary: '公元前221年，秦始皇嬴政统一六国，建立了中国历史上第一个统一的中央集权封建国家。',
    detail: '公元前221年，秦王嬴政在先后攻灭韩、赵、魏、楚、燕、齐六国后，完成了统一大业，建立了中国历史上第一个统一的多民族中央集权封建国家——秦朝。嬴政自称"始皇帝"，史称秦始皇。秦始皇推行了一系列巩固统一的措施：在政治上，确立皇帝制度，实行三公九卿制，废除分封制，推行郡县制；在经济上，统一货币、度量衡；在文化上，统一文字，以小篆作为全国通用字体；在军事上，北击匈奴，修筑长城，南征百越，开凿灵渠。这些措施奠定了中国两千多年封建社会政治制度的基本格局，对中国历史的发展产生了深远影响。' },

  // 汉武帝登基
  { month: 3, day: 9, year: -141, title: '汉武帝刘彻即位', type: '中国',
    summary: '公元前141年，汉武帝刘彻即位，开创了西汉王朝的鼎盛时期。',
    detail: '公元前141年，汉景帝去世，太子刘彻即位，是为汉武帝。汉武帝在位五十四年，是西汉王朝最鼎盛的时期。他在政治上，颁布"推恩令"，削弱诸侯王势力，加强中央集权；在思想上，采纳董仲舒的建议，"罢黜百家，独尊儒术"，确立了儒家思想的正统地位；在军事上，派卫青、霍去病等大将多次出击匈奴，解除了匈奴对北方边境的威胁；在外交上，派张骞出使西域，开辟了著名的"丝绸之路"，加强了中原与西域各国的联系；在经济上，实行盐铁官营、均输平准等政策，增加了国家财政收入。汉武帝时期，西汉国力强盛，疆域辽阔，文化繁荣，成为当时世界上最强大的国家之一。' },

  // 赤壁之战
  { month: 11, day: 20, year: 208, title: '赤壁之战', type: '中国',
    summary: '公元208年，孙刘联军在赤壁大败曹操军队，奠定了三国鼎立的基础。',
    detail: '公元208年，曹操在统一北方后，率领二十万大军南下，企图一举消灭孙权和刘备，统一全国。面对曹军的强大攻势，孙权和刘备联合起来，在长江赤壁一带与曹军对峙。孙刘联军利用曹军不习水战、连锁战船的弱点，由周瑜指挥，黄盖诈降，采用火攻战术，火烧曹军战船。大火延烧到岸上的曹军营寨，曹军大败。赤壁之战是中国历史上著名的以少胜多的战役。战后，曹操退回北方，孙权在江东的统治得到巩固，刘备则乘机占据荆州，后又夺取益州，形成了天下三分的局面，为后来魏、蜀、吴三国鼎立奠定了基础。' },

  // 隋朝统一中国
  { month: 2, day: 10, year: 589, title: '隋朝统一中国', type: '中国',
    summary: '公元589年，隋文帝杨坚灭陈，结束了近三百年的分裂局面，重新统一中国。',
    detail: '公元581年，杨坚代周称帝，建立隋朝，定都长安，是为隋文帝。公元589年，隋文帝派杨广率军南下，攻入建康，灭了南朝最后一个朝代陈，结束了自西晋末年以来近三百年的分裂割据局面，重新统一了中国。隋朝的统一，有利于社会的安定和经济文化的发展。隋文帝在位期间，实行了一系列改革：在政治上，确立三省六部制，简化地方行政机构；在经济上，继续推行均田制，减轻赋役，清查户口；在文化上，创立科举制度，打破了门阀士族对仕途的垄断。这些改革措施对后世产生了深远影响，特别是科举制度，在中国延续了一千三百多年，直到清末才被废除。' },

  // 贞观之治
  { month: 1, day: 1, year: 627, title: '贞观之治开始', type: '中国',
    summary: '公元627年，唐太宗李世民改元贞观，开创了唐朝第一个盛世。',
    detail: '公元626年，李世民发动玄武门之变，杀死太子李建成和齐王李元吉，被立为太子。不久，唐高祖李渊退位，李世民即位，是为唐太宗。次年改元贞观。唐太宗在位二十三年，他吸取隋亡的教训，励精图治，虚心纳谏，重用魏征、房玄龄、杜如晦等贤能之臣。在政治上，完善三省六部制，整顿吏治；在经济上，轻徭薄赋，劝课农桑，实行均田制和租庸调制；在民族关系上，采取开明的民族政策，被周边各族尊称为"天可汗"；在文化上，兴办学校，完善科举制。贞观年间，政治清明，经济发展，社会安定，文化繁荣，国力强盛，史称"贞观之治"，是中国封建社会少有的治世局面。' },

  // 安史之乱
  { month: 11, day: 9, year: 755, title: '安史之乱爆发', type: '中国',
    summary: '公元755年，安禄山在范阳起兵叛乱，唐朝由盛转衰。',
    detail: '公元755年11月9日，身兼范阳、平卢、河东三镇节度使的安禄山以讨伐杨国忠为名，在范阳起兵叛乱，史称"安史之乱"。叛军迅速南下，攻占洛阳，安禄山自称大燕皇帝。次年，叛军攻破潼关，唐玄宗仓皇逃往四川，途中发生马嵬驿兵变，杨国忠被杀，杨贵妃被迫自缢。太子李亨在灵武即位，是为唐肃宗。后来，叛军内部发生内讧，安禄山被儿子安庆绪所杀，史思明又杀安庆绪，史思明又被儿子史朝义所杀。公元763年，历时八年的安史之乱终于被平定。安史之乱是唐朝由盛转衰的转折点，战乱使社会经济遭到严重破坏，藩镇割据局面形成，中央集权被严重削弱，唐朝从此一蹶不振。' },

  // 陈桥兵变 北宋建立
  { month: 2, day: 4, year: 960, title: '陈桥兵变 北宋建立', type: '中国',
    summary: '公元960年，赵匡胤发动陈桥兵变，黄袍加身，建立宋朝。',
    detail: '公元960年正月，后周大将赵匡胤借口北汉与契丹联合南下，率军从大梁出发北上御敌。行至陈桥驿时，赵匡胤的部下发动兵变，将一件黄袍披在他身上，拥立他为皇帝，史称"陈桥兵变"。赵匡胤随即率军返回开封，逼迫后周恭帝禅位，改国号为宋，定都开封，史称北宋，赵匡胤就是宋太祖。北宋建立后，宋太祖通过"杯酒释兵权"解除了禁军将领的兵权，加强了中央集权。随后，北宋先后消灭了南平、后蜀、南汉、南唐等割据政权，结束了五代十国的分裂局面，基本统一了中原和南方地区。北宋重文轻武，文化繁荣，经济发达，但也造成了军事力量相对薄弱的局面。' },

  // 靖康之变
  { month: 1, day: 9, year: 1127, title: '靖康之变 北宋灭亡', type: '中国',
    summary: '公元1127年，金军攻破开封，俘虏徽钦二帝，北宋灭亡。',
    detail: '公元1125年，金军分兵两路南下攻宋。宋徽宗惊慌失措，传位给太子赵恒，是为宋钦宗，自己做了太上皇。公元1126年，金军第一次围攻开封，被李纲率领军民击退。但不久宋钦宗罢免了李纲，对金求和。同年闰十一月，金军再次南下，攻破开封。公元1127年正月，金军俘虏宋徽宗、宋钦宗二帝以及后妃、宗室、大臣等三千余人北去，并搜刮了大量金银财宝。这一事件发生在宋钦宗靖康年间，史称"靖康之变"，又称"靖康之耻"。靖康之变标志着北宋的灭亡。同年五月，康王赵构在南京应天府即位，重建宋朝，后定都临安，史称南宋。' },

  // 元朝建立
  { month: 12, day: 18, year: 1271, title: '元朝建立', type: '中国',
    summary: '公元1271年，忽必烈改国号为大元，建立元朝。',
    detail: '公元1206年，铁木真统一蒙古各部，建立蒙古汗国，被尊称为成吉思汗。此后，蒙古铁骑四处征战，建立了横跨欧亚大陆的庞大帝国。公元1260年，成吉思汗的孙子忽必烈在开平即位，成为蒙古大汗。公元1271年，忽必烈取《易经》"大哉乾元"之义，改国号为"大元"，正式建立元朝，次年定都大都，也就是今天的北京。忽必烈就是元世祖。公元1276年，元军攻占临安，南宋灭亡。公元1279年，元军在崖山海战中消灭南宋残余势力，统一了全国。元朝是中国历史上第一个由少数民族建立的大一统王朝，疆域空前辽阔，行省制度对后世影响深远。元朝的统一促进了民族融合和中外文化交流。' },

  // 明朝建立
  { month: 1, day: 23, year: 1368, title: '明朝建立', type: '中国',
    summary: '公元1368年，朱元璋在应天称帝，建立明朝。',
    detail: '元朝末年，政治腐败，社会矛盾激化，红巾军起义爆发。贫苦农民出身的朱元璋参加了郭子兴领导的红巾军，逐渐崭露头角。郭子兴死后，朱元璋成为这支起义军的领袖。他采纳朱升"高筑墙，广积粮，缓称王"的建议，积蓄力量，先后消灭了陈友谅、张士诚等割据势力。公元1368年正月，朱元璋在应天府称帝，国号大明，建元洪武，定都应天，也就是今天的南京。朱元璋就是明太祖。同年，明军北伐，攻占大都，元顺帝北逃，元朝在全国的统治结束。明朝建立后，明太祖朱元璋采取了一系列加强中央集权的措施：废除丞相制度，六部直接对皇帝负责；设立锦衣卫，实行特务统治；分封诸子为王，镇守各地。这些措施对明朝的政治制度产生了深远影响。' },

  // 郑和下西洋
  { month: 7, day: 11, year: 1405, title: '郑和第一次下西洋', type: '中国',
    summary: '公元1405年，郑和奉命率船队第一次下西洋，开启了世界航海史上的壮举。',
    detail: '公元1405年7月11日，明成祖朱棣派遣郑和率领庞大的船队从苏州刘家港出发，第一次出使西洋，也就是今天的南海和印度洋沿岸地区。郑和本姓马，小名三宝，是云南回族人，在靖难之役中有功，被赐姓郑。郑和的船队有大小船只二百多艘，人员二万七千多人，其中最大的"宝船"长一百五十多米，宽六十多米，是当时世界上最大的木帆船。从1405年到1433年，郑和先后七次下西洋，到过亚非三十多个国家和地区，最远到达非洲东海岸和红海沿岸。郑和下西洋是世界航海史上的壮举，比哥伦布发现美洲早了半个多世纪，促进了中国与亚非各国的友好往来和经济文化交流，展示了明朝前期强大的国力。' },

  // 清军入关
  { month: 5, day: 27, year: 1644, title: '清军入关', type: '中国',
    summary: '公元1644年，清军在吴三桂的引导下入关，开始了清朝对全国的统治。',
    detail: '公元1644年三月，李自成率领农民起义军攻占北京，崇祯帝在煤山自缢，明朝灭亡。驻守山海关的明将吴三桂起初准备投降李自成，但得知父亲被拘、爱妾陈圆圆被夺后，冲冠一怒为红颜，转而投降清朝，引清兵入关。同年五月二十七日，李自成率军与吴三桂在山海关展开激战，清军突然从侧翼杀出，大顺军大败。李自成退回北京，随后撤出北京西走。清军在多尔衮的率领下入主北京。同年十月，清顺治帝从盛京迁都北京，正式开始了清朝对全国的统治。清朝是中国历史上最后一个封建王朝，也是第二个由少数民族建立的大一统王朝。清朝前期，疆域辽阔，国力强盛，出现了"康乾盛世"的局面，但后期逐渐走向衰落。' },

  // 康乾盛世
  { month: 5, day: 4, year: 1661, title: '康熙帝即位 康乾盛世开启', type: '中国',
    summary: '公元1661年，康熙帝即位，开启了中国封建社会最后一个盛世。',
    detail: '公元1661年，清顺治帝去世，年仅八岁的爱新觉罗·玄烨即位，是为康熙帝，由索尼、苏克萨哈、遏必隆、鳌拜四大臣辅政。康熙十四岁亲政后，首先铲除了专权的鳌拜，随后平定三藩之乱，统一台湾，抗击沙俄侵略，平定准噶尔叛乱，巩固了统一的多民族国家。康熙帝重视农业生产，治理黄河，减轻农民负担，振兴文教。他的孙子乾隆帝在位期间，清朝国力达到鼎盛，疆域空前辽阔，经济繁荣，文化昌盛，史称"康乾盛世"，又称"康雍乾盛世"。这是中国封建社会最后一个盛世，持续时间长达一百三十多年。但盛世之下也隐藏着危机，闭关锁国、重农抑商、思想禁锢等政策使中国逐渐落后于世界潮流。' },

  // 鸦片战争
  { month: 6, day: 28, year: 1840, title: '鸦片战争爆发', type: '中国',
    summary: '1840年，英国发动鸦片战争，中国开始沦为半殖民地半封建社会。',
    detail: '1840年6月28日，英国政府以林则徐虎门销烟为借口，派遣远征军抵达中国广东海面，封锁珠江口，鸦片战争正式爆发。战争初期，英军在广东、福建等地进攻受阻，转而北上，攻陷浙江定海，随后抵达天津大沽口外。道光帝惊慌失措，派琦善与英军谈判，并将林则徐革职查办。1841年初，英军强占香港岛，随后扩大侵略战争，先后攻占厦门、定海、镇海、宁波等地。1842年8月，英军军舰驶抵南京下关江面，清政府被迫求和。1842年8月29日，清政府与英国签订了中国近代史上第一个不平等条约——《南京条约》，割让香港岛，赔款2100万银元，开放广州、厦门、福州、宁波、上海五处为通商口岸。鸦片战争是中国近代史的开端，中国开始沦为半殖民地半封建社会。' },

  // 太平天国运动
  { month: 1, day: 11, year: 1851, title: '太平天国运动爆发', type: '中国',
    summary: '1851年，洪秀全在广西金田村发动起义，建立太平天国。',
    detail: '鸦片战争后，中国社会矛盾激化。1843年，洪秀全创立拜上帝会，利用宗教形式发动群众。1851年1月11日，洪秀全在广西桂平县金田村发动起义，建号太平天国，起义军称太平军。1853年，太平军攻占南京，改名为天京，作为太平天国的都城，正式建立了与清政府对峙的政权。太平天国颁布了《天朝田亩制度》，提出了"凡天下田，天下人同耕"的主张，反映了农民阶级对土地的强烈渴望。1856年，太平天国在军事上达到全盛，但随后发生了天京事变，太平天国由盛转衰。1859年，洪仁玕提出《资政新篇》，主张学习西方，发展资本主义，这是先进的中国人最早提出的在中国发展资本主义的方案。1864年，天京陷落，太平天国运动失败。太平天国运动是中国历史上规模最大的一次农民战争，沉重打击了清王朝的统治和外国侵略势力。' },

  // 洋务运动
  { month: 6, day: 12, year: 1861, title: '洋务运动开始', type: '中国',
    summary: '19世纪60年代，清朝统治集团发起洋务运动，开启了中国近代化的进程。',
    detail: '第二次鸦片战争后，清朝统治集团内部一些较为开明的官员主张学习西方先进的军事技术，以维护清朝统治，这些官员被称为"洋务派"。洋务派在中央以奕訢为代表，在地方以曾国藩、李鸿章、左宗棠、张之洞等人为代表。从19世纪60年代到90年代，他们掀起了一场"师夷长技以自强"的洋务运动。洋务运动前期以"自强"为口号，创办了一批近代军事工业，如安庆内军械所、江南制造总局、福州船政局等；后期以"求富"为口号，创办了一批民用工业，如轮船招商局、开平煤矿、汉阳铁厂等。洋务派还筹建了北洋、南洋、福建三支海军，兴办新式学堂，派遣留学生。洋务运动是中国近代化的开端，引进了西方先进的科学技术，使中国出现了第一批近代企业，客观上促进了中国民族资本主义的产生和发展。但洋务运动只学技术不变制度，最终未能使中国走上富强道路。' },

  // 甲午中日战争
  { month: 7, day: 25, year: 1894, title: '甲午中日战争爆发', type: '中国',
    summary: '1894年，甲午中日战争爆发，中国半殖民地化程度大大加深。',
    detail: '1894年，朝鲜爆发东学党起义，朝鲜政府请求清政府派兵镇压。日本也乘机出兵朝鲜，蓄意挑起战争。7月25日，日本联合舰队在朝鲜丰岛海面突袭中国运兵船，甲午中日战争爆发。8月1日，中日双方正式宣战。战争分为两个阶段：第一阶段主要在朝鲜境内进行，平壤战役中清军战败；黄海海战中，北洋水师与日本联合舰队展开激战，损失惨重。第二阶段主要在中国境内进行，日军渡过鸭绿江，攻入辽东半岛，制造了旅顺大屠杀；随后日军又在山东半岛登陆，海陆围攻威海卫，北洋水师全军覆没。1895年4月，清政府被迫与日本签订《马关条约》，割让辽东半岛、台湾及澎湖列岛，赔款二亿两白银，开放沙市、重庆、苏州、杭州为商埠，允许日本在通商口岸开设工厂。《马关条约》使中国半殖民地化程度大大加深，民族危机空前严重。' },

  // 戊戌变法
  { month: 6, day: 11, year: 1898, title: '戊戌变法', type: '中国',
    summary: '1898年，光绪帝颁布"明定国是"诏书，戊戌变法开始。',
    detail: '甲午战后，民族危机空前严重，资产阶级维新思想进一步发展。以康有为、梁启超为代表的资产阶级维新派主张变法维新，实行君主立宪，发展资本主义。他们通过公车上书、组织学会、创办报刊等方式宣传变法思想。1898年6月11日，光绪帝颁布"明定国是"诏书，宣布变法，史称"戊戌变法"。变法的主要内容包括：政治上，改革政府机构，裁撤冗官，任用维新人士；经济上，鼓励私人兴办工矿企业；文化教育上，开办新式学堂，翻译西方书籍，传播新思想，科举考试废除八股文；军事上，训练新式军队。变法触动了以慈禧太后为首的顽固派的利益。1898年9月21日，慈禧太后发动戊戌政变，囚禁光绪帝，捕杀维新派人士。谭嗣同、康广仁、林旭、杨深秀、杨锐、刘光第六人被害，史称"戊戌六君子"。戊戌变法历时仅一百零三天，又称"百日维新"。戊戌变法是一次资产阶级性质的改良运动，虽然失败了，但在社会上起到了思想启蒙的作用。' },

  // 古埃及统一
  { month: 7, day: 20, year: -3100, title: '古埃及统一', type: '世界',
    summary: '约公元前3100年，美尼斯统一上下埃及，建立第一王朝，开启了古埃及文明。',
    detail: '约公元前3100年，上埃及国王美尼斯征服了下埃及，建立了埃及历史上第一个统一的王朝——第一王朝，定都孟斐斯。这一事件标志着古埃及文明的正式开始。美尼斯统一埃及后，建立了中央集权的专制统治，自称"法老"，被视为太阳神之子。古埃及文明延续了三千多年，经历了古王国、中王国、新王国等时期，创造了辉煌灿烂的文明：建造了举世闻名的金字塔，发明了象形文字，制定了太阳历，在数学、医学、建筑等领域取得了很高的成就。古埃及文明是世界上最古老的文明之一，对人类文明的发展产生了深远影响。' },

  // 古巴比伦王国建立
  { month: 3, day: 21, year: -1894, title: '古巴比伦王国建立', type: '世界',
    summary: '约公元前1894年，阿摩利人建立古巴比伦王国，两河流域文明进入新阶段。',
    detail: '约公元前1894年，阿摩利人首领苏姆阿布姆在两河流域的巴比伦城建立国家，史称古巴比伦王国。两河流域又称美索不达米亚，是人类文明的重要发祥地之一，苏美尔人、阿卡德人、巴比伦人、亚述人等先后在这里创造了辉煌的文明。古巴比伦王国在第六代国王汉谟拉比统治时期达到鼎盛。汉谟拉比统一了两河流域，建立了中央集权的专制统治。他颁布了著名的《汉谟拉比法典》，这是世界上现存最早的较为完整的成文法典，法典刻在一块黑色玄武岩石柱上，共有282条条文，内容涉及诉讼、财产、婚姻、继承、奴隶等方面，比较全面地反映了古巴比伦社会的情况。' },

  // 古希腊奥林匹克运动会
  { month: 7, day: 21, year: -776, title: '第一届古代奥林匹克运动会', type: '世界',
    summary: '公元前776年，第一届古代奥林匹克运动会在希腊奥林匹亚举行。',
    detail: '公元前776年，第一届古代奥林匹克运动会在希腊伯罗奔尼撒半岛的奥林匹亚举行，以纪念众神之王宙斯。这是有文字记载的最早的奥运会。运动会每四年举行一次，期间希腊各城邦之间停止战争，共同参加这一盛会。比赛项目最初只有短跑一项，后来逐渐增加了摔跤、五项全能、拳击、战车比赛等项目。获胜者被授予橄榄枝花冠，受到人们的尊敬和爱戴。古代奥运会不仅是体育竞技的盛会，也是希腊各城邦文化交流的重要场合，体现了古希腊人对体格健美和精神力量的追求。古代奥运会持续了一千多年，直到公元393年被罗马皇帝狄奥多西一世废止。1896年，现代奥林匹克运动会在希腊雅典重新举办，延续了奥林匹克精神。' },

  // 罗马共和国建立
  { month: 9, day: 13, year: -509, title: '罗马共和国建立', type: '世界',
    summary: '公元前509年，罗马人推翻王政，建立共和国，开启了罗马的新时代。',
    detail: '公元前509年，罗马人推翻了最后一位国王塔克文的统治，结束了王政时代，建立了罗马共和国。共和国的最高权力机关是元老院，由贵族组成；最高行政长官是两名执政官，由公民大会选举产生，任期一年。罗马共和国建立后，不断对外扩张，逐步征服了意大利半岛，随后又与地中海强国迦太基进行了三次布匿战争，最终取得了地中海的霸权。罗马共和国时期，奴隶制得到了充分发展，社会矛盾也日益尖锐。公元前73年爆发了斯巴达克奴隶起义，沉重打击了罗马奴隶主阶级的统治。公元前45年，恺撒成为终身独裁官，共和国名存实亡。公元前27年，屋大维被授予"奥古斯都"称号，罗马进入帝国时代。罗马文明对后世影响深远，特别是罗马法、拉丁文字、建筑艺术等，成为西方文明的重要源头。' },

  // 亚历山大大帝东征
  { month: 5, day: 15, year: -334, title: '亚历山大大帝东征开始', type: '世界',
    summary: '公元前334年，亚历山大大帝率军东征，建立了横跨欧亚非的大帝国。',
    detail: '公元前336年，马其顿国王腓力二世遇刺身亡，年仅二十岁的亚历山大即位，史称亚历山大大帝。公元前334年，亚历山大率领三万步兵和五千骑兵，越过达达尼尔海峡，开始了对波斯帝国的东征。他以少胜多，先后在伊苏斯战役和高加米拉战役中击败波斯大军，灭亡了波斯帝国。随后，亚历山大继续东进，一直打到印度河流域。由于士兵厌战，亚历山大被迫撤军，于公元前324年回到巴比伦。公元前323年，亚历山大在巴比伦病逝，年仅三十三岁。亚历山大东征历时十年，建立了一个横跨欧亚非三洲的庞大帝国，疆域从希腊、埃及一直延伸到印度河流域。东征虽然给被征服地区带来了破坏，但也促进了东西方文化的交流与融合，开创了希腊化时代。' },

  // 罗马帝国建立
  { month: 1, day: 16, year: -27, title: '罗马帝国建立', type: '世界',
    summary: '公元前27年，屋大维被授予"奥古斯都"称号，罗马进入帝国时代。',
    detail: '公元前27年1月16日，罗马元老院授予屋大维"奥古斯都"（意为神圣、至尊）的称号，标志着罗马共和国的结束和罗马帝国的开始。屋大维是恺撒的外甥兼养子，在恺撒遇刺后，他与安东尼、雷必达结成"后三头同盟"，击败了共和派势力。随后，屋大维又在亚克兴海战中击败安东尼和埃及艳后克利奥帕特拉，成为罗马唯一的统治者。屋大维在位四十多年，对内实行改革，加强中央集权，促进经济发展和文化繁荣；对外继续扩张，使罗马帝国的疆域达到最大规模：东起幼发拉底河，西至不列颠，北达莱茵河和多瑙河，南抵北非，地中海成为罗马的内湖。罗马帝国前期政治稳定、经济繁荣，史称"罗马和平"时期。罗马文明对西方世界产生了极其深远的影响，其法律、政治制度、建筑、语言等至今仍在发挥作用。' },

  // 西罗马帝国灭亡
  { month: 9, day: 4, year: 476, title: '西罗马帝国灭亡', type: '世界',
    summary: '公元476年，西罗马帝国灭亡，欧洲进入中世纪。',
    detail: '公元476年，日耳曼雇佣军首领奥多亚克废黜了最后一位西罗马皇帝罗慕路斯·奥古斯都，西罗马帝国正式灭亡。这一事件标志着欧洲奴隶社会的结束和中世纪的开始。罗马帝国在公元395年分裂为东西两部分，东罗马帝国以君士坦丁堡为首都，继续存在了一千多年，史称拜占庭帝国。而西罗马帝国则在外族入侵和内部危机的双重打击下走向衰落。从公元4世纪起，日耳曼各族不断入侵西罗马帝国，哥特人、汪达尔人、法兰克人等纷纷在帝国境内建立自己的王国。西罗马帝国的灭亡使欧洲进入了长达近千年的中世纪，这一时期封建制度逐步形成，基督教成为占统治地位的意识形态，经济和文化发展相对缓慢。' },

  // 查理曼帝国建立
  { month: 12, day: 25, year: 800, title: '查理曼帝国建立', type: '世界',
    summary: '公元800年，查理曼被教皇加冕为"罗马人的皇帝"，查理曼帝国建立。',
    detail: '公元800年12月25日圣诞节，法兰克国王查理曼在罗马圣彼得大教堂被教皇利奥三世加冕为"罗马人的皇帝"，史称查理大帝，他所统治的国家被称为查理曼帝国。查理曼是法兰克王国加洛林王朝的国王，他在位期间，通过五十多次战争，征服了西欧大部分地区，建立了一个版图包括今天法国、德国、荷兰、比利时、瑞士、奥地利以及意大利北部在内的庞大帝国，大体上恢复了西罗马帝国的疆域。查理曼不仅是一位杰出的军事家，也是一位有作为的政治家和文化的保护者。他重视文化教育，兴办学校，延揽学者，整理古籍，使古典文化得到一定程度的复兴，史称"加洛林文艺复兴"。公元843年，查理曼的三个孙子签订《凡尔登条约》，将帝国一分为三，形成了后来法国、德国和意大利三个国家的雏形。' },

  // 哥伦布发现新大陆
  { month: 10, day: 12, year: 1492, title: '哥伦布发现新大陆', type: '世界',
    summary: '1492年，哥伦布率领船队抵达美洲，开辟了通往美洲的新航路。',
    detail: '1492年8月3日，意大利航海家克里斯托弗·哥伦布在西班牙王室的资助下，率领三艘帆船和八十七名水手，从西班牙巴罗斯港出发，向西航行，寻找通往东方的新航路。经过两个多月的艰苦航行，1492年10月12日凌晨，船队终于到达了巴哈马群岛中的一个小岛。哥伦布以为自己到达了印度，所以把当地居民称为"印第安人"。后来，哥伦布又三次西航，到达了加勒比海的一些岛屿和中美洲、南美洲的部分地区，但他始终认为自己到达的是亚洲的印度。后来，意大利航海家亚美利哥证实了这是一块欧洲人此前不知道的新大陆，后来这块大陆就以他的名字命名为"亚美利加洲"，简称美洲。哥伦布发现新大陆，打破了美洲与世界其他地区相对隔绝的状态，开启了地理大发现的时代，对世界历史产生了深远的影响。' },

  // 宗教改革
  { month: 10, day: 31, year: 1517, title: '马丁·路德宗教改革', type: '世界',
    summary: '1517年，马丁·路德发表《九十五条论纲》，拉开了宗教改革的序幕。',
    detail: '1517年10月31日，德国神学家马丁·路德在维滕贝格教堂门口张贴了《九十五条论纲》，抨击罗马天主教会出售赎罪券的做法，拉开了欧洲宗教改革的序幕。马丁·路德提出"因信称义"的主张，认为人只要信仰上帝就可以得救，不需要通过教会和神职人员作为中介；主张《圣经》是信仰的最高权威，每个人都可以直接阅读和理解《圣经》，而不必听从教会的解释。宗教改革迅速席卷欧洲，形成了路德宗、加尔文宗、英国国教等新教教派，与罗马天主教会分庭抗礼。宗教改革是一场深刻的思想解放运动，它打破了天主教会对人们思想的垄断，促进了民族意识的觉醒和民族国家的形成，也为欧洲资本主义的发展创造了条件。' },

  // 英国资产阶级革命
  { month: 1, day: 30, year: 1649, title: '英国资产阶级革命', type: '世界',
    summary: '1649年，英国国王查理一世被处死，英国宣布为共和国。',
    detail: '1640年，英国国王查理一世为了筹措军费，被迫重新召开议会，英国资产阶级革命由此开始。1642年，查理一世挑起内战，议会军在克伦威尔的领导下，经过马斯顿荒原战役和纳西比战役，击败了王党军队。1649年1月30日，查理一世被送上断头台，英国宣布为共和国。但共和国成立后，克伦威尔实行独裁统治，解散议会，自称"护国主"。1660年，斯图亚特王朝复辟。1688年，资产阶级和新贵族发动宫廷政变，邀请荷兰执政威廉和玛丽入主英国，史称"光荣革命"。1689年，英国议会通过《权利法案》，限制了国王的权力，确立了君主立宪制。英国资产阶级革命是世界历史上第一次成功的资产阶级革命，它推翻了封建君主专制，确立了资产阶级的统治地位，为英国资本主义的发展扫清了道路，也对世界历史产生了深远影响。' },

  // 启蒙运动
  { month: 11, day: 21, title: '启蒙运动', year: 1694, type: '世界',
    summary: '17-18世纪，启蒙运动在欧洲兴起，开启了思想解放的新时代。',
    detail: '启蒙运动是17至18世纪在欧洲兴起的一场资产阶级思想解放运动，它以法国为中心，波及整个欧洲。启蒙思想家们高举"理性"的旗帜，反对封建专制制度和天主教会的蒙昧主义，提倡自由、平等、博爱、民主和科学。启蒙运动的代表人物有伏尔泰、孟德斯鸠、卢梭、狄德罗等。伏尔泰批判天主教会的黑暗和腐朽，主张开明君主制；孟德斯鸠提出三权分立学说，主张立法权、行政权和司法权相互分立、相互制衡；卢梭提出"社会契约论"和"人民主权说"，认为国家的权力属于人民。启蒙运动为资产阶级革命作了思想上和理论上的准备，对法国大革命、美国独立战争等产生了重大影响，也推动了近代科学文化的发展。' },

  // 美国独立战争
  { month: 7, day: 4, year: 1776, title: '美国独立宣言发表', type: '世界',
    summary: '1776年7月4日，大陆会议通过《独立宣言》，宣告美国诞生。',
    detail: '1775年4月，莱克星顿的枪声打响了美国独立战争的第一枪。同年5月，第二届大陆会议召开，决定组建大陆军，任命华盛顿为总司令。1776年7月4日，大陆会议通过了由杰斐逊等人起草的《独立宣言》，宣告北美十三个殖民地脱离英国独立，美利坚合众国诞生。《独立宣言》宣布人人生而平等，每个人都有生命权、自由权和追求幸福的权利，被马克思称为"第一个人权宣言"。美国独立战争初期，大陆军处于劣势，但在华盛顿的领导下，克服重重困难，逐渐扭转战局。1777年萨拉托加大捷是独立战争的转折点。1781年，约克镇战役的胜利标志着独立战争基本结束。1783年，英国承认美国独立。美国独立战争既是一场民族解放战争，也是一场资产阶级革命，它推翻了英国的殖民统治，实现了国家独立，为美国资本主义的发展开辟了道路。' },

  // 法国大革命
  { month: 7, day: 14, year: 1789, title: '法国大革命爆发', type: '世界',
    summary: '1789年7月14日，巴黎人民攻占巴士底狱，法国大革命爆发。',
    detail: '18世纪末，法国封建专制制度严重阻碍了资本主义的发展，社会矛盾尖锐。1789年5月，法国国王路易十六为了解决财政危机，被迫召开三级会议。第三等级的代表同国王进行了斗争，宣布成立国民议会，后改称制宪议会。7月14日，巴黎人民发动起义，攻占了象征封建专制统治的巴士底狱，法国大革命正式爆发。革命爆发后，制宪议会通过了《人权宣言》，宣告了人权、法治、自由、平等和保护私有财产等基本原则。法国大革命经历了君主立宪派统治、吉伦特派统治、雅各宾派专政等阶段，其中雅各宾派专政时期实行的革命恐怖政策，在打击敌人的同时也造成了大量无辜者的死亡。1794年的热月政变结束了雅各宾派专政。1799年，拿破仑发动雾月政变，夺取政权。法国大革命是世界历史上规模最大、最彻底的一次资产阶级革命，它摧毁了法国的封建专制制度，传播了自由平等的思想，对世界历史产生了深远影响。' },

  // 工业革命
  { month: 5, day: 1, year: 1825, title: '英国工业革命完成', type: '世界',
    summary: '19世纪上半期，英国率先完成工业革命，成为世界上第一个工业国家。',
    detail: '工业革命又称产业革命，是资本主义从手工工场阶段过渡到大机器生产阶段的一次重大飞跃。工业革命最早发生在英国，从18世纪60年代开始，到19世纪上半期基本完成。工业革命首先从棉纺织业开始，1765年哈格里夫斯发明珍妮纺纱机，标志着工业革命的开始。1785年，瓦特制成的改良蒸汽机投入使用，使人类进入了"蒸汽时代"。蒸汽机的广泛使用推动了交通运输业的发展，富尔顿发明了汽船，史蒂芬孙发明了火车。工业革命极大地提高了社会生产力，使英国成为世界上第一个工业国家，被誉为"世界工厂"。工业革命也引起了社会结构的重大变化，产生了工业资产阶级和工业无产阶级两大对立阶级。工业革命还促进了城市的兴起和发展，但也带来了环境污染、贫富分化等社会问题。工业革命后来扩展到法国、德国、美国等国家，对世界历史产生了深远影响。' },

  // 巴黎公社
  { month: 3, day: 18, year: 1871, title: '巴黎公社成立', type: '世界',
    summary: '1871年3月18日，巴黎公社成立，这是世界上第一个无产阶级政权。',
    detail: '1870年，普法战争爆发，法国战败，拿破仑三世投降。巴黎人民发动起义，推翻了第二帝国，建立了第三共和国。但资产阶级临时政府对外采取投降政策，与普鲁士签订了屈辱的和约；对内则准备解除巴黎工人的武装。1871年3月18日凌晨，政府军企图夺取巴黎市内的蒙马特尔高地的大炮，被巴黎人民发现。巴黎人民奋起反抗，举行起义，临时政府逃往凡尔赛。3月26日，巴黎人民进行了公社选举。3月28日，巴黎公社正式宣告成立。巴黎公社是世界历史上第一个无产阶级政权，它采取了一系列革命措施：废除旧军队和旧警察，代之以国民自卫军；取消旧法庭，建立新的司法机构；没收逃亡资本家的工厂，交给工人合作社管理；实行八小时工作制；等等。5月28日，巴黎公社在资产阶级反动势力的镇压下失败了。巴黎公社虽然失败了，但它是无产阶级建立政权的第一次伟大尝试，丰富了马克思主义关于无产阶级革命和无产阶级专政的学说。' },

  // 武王伐纣 西周建立
  { month: 2, day: 4, year: -1046, title: '武王伐纣 西周建立', type: '中国',
    summary: '约公元前1046年，周武王姬发伐纣灭商，建立周朝，史称西周。',
