    biography: [
      '苏轼字子瞻，又字和仲，号东坡居士，四川眉山人。他与父亲苏洵、弟弟苏辙都是北宋著名文学家，合称"三苏"，父子三人又都名列唐宋八大家，在中国文学史上传为佳话。苏轼从小聪颖过人，深受父亲的影响，读书刻苦，能诗善文。嘉祐二年（1057年），二十一岁的苏轼与十九岁的弟弟苏辙一同赴京城开封参加科举考试，双双考中进士。主考官欧阳修读到苏轼的文章，拍案叫绝，公开称赞"吾当避此人出一头地"，意思是我应该给这个人让路，让他出人头地。苏轼由此名声大振。',
      '入仕后的苏轼最初仕途顺利，先后在地方和中央担任过各种职务。但他生性豪爽直率，又才华横溢，在复杂的政治斗争中往往不懂得明哲保身。宋神宗年间，王安石主持变法，苏轼对变法中的一些过激做法持不同意见，写了一些讽刺新法的诗文。元丰二年（1079年），一批支持变法的官员从苏轼的诗文中罗织罪名，弹劾他"愚弄朝廷、妄自尊大""指斥乘舆"。苏轼因此被捕入狱，关押在御史台狱中审问了一百三十多天，史称"乌台诗案"（因御史台又称乌台）。这是中国历史上著名的文字狱之一，苏轼险些被处死，最后在多方营救下才得以幸免，被贬为黄州团练副使——一个没有实权、被监视居住的闲职。',
      '四十五岁的苏轼来到黄州（今湖北黄冈），开始了他一生中最重要的贬谪岁月。初到黄州，苏轼生活困难，一家人的温饱都成问题。一位好心的朋友帮他向官府申请到了城东一片废弃的荒地，大约五十余亩，让他自己耕种以补贴生计。这片荒地位于黄州城东的山坡上，因此苏轼自号"东坡居士"，从此人们便亲切地称他为苏东坡。这段贬谪生活虽然艰苦，却让苏轼的人格和创作都达到了新的高度。在黄州，他写下了许多传世名篇，包括《赤壁赋》《后赤壁赋》《念奴娇·赤壁怀古》《定风波》等。"大江东去，浪淘尽，千古风流人物"——这豪放苍凉的吟唱，成为中国文学史上最动人的篇章之一。',
      '元丰七年（1084年），苏轼被调离黄州，先后任汝州、常州等地。宋神宗去世后，高太后临朝听政，旧党领袖司马光重新上台，苏轼被召回京城重用，很快升任翰林学士、侍读、礼部尚书等要职。然而苏轼虽然反对新法的一些过激做法，却并不完全同意司马光尽废新法的极端做法，因此又与旧党人物产生矛盾。加上他在文坛名气太大，又遭到一些人的嫉妒，元祐四年（1089年）苏轼再次主动请求外放，出任杭州知州。在杭州期间，他疏浚西湖、修筑堤防，为杭州人民做了许多好事。至今西湖上的"苏堤"仍以他的名字命名，纪念他的功绩。',
      '高太后去世后，宋哲宗亲政，新党人物重新上台，苏轼又一次成为政治打击的对象。绍圣元年（1094年），五十九岁的苏轼被贬到惠州（今广东惠州）。当时岭南属于偏远的蛮荒之地，贬到那里几乎等于流放。然而苏轼以他特有的豁达乐观面对这一切。在惠州，他写下"日啖荔枝三百颗，不辞长作岭南人"的诗句，表达了随遇而安的生活态度。他还在惠州修桥补路、推广秧马农具，为当地百姓做了许多好事。然而迫害并未停止。绍圣四年（1097年），六十二岁的苏轼被进一步贬到更远的儋州（今海南儋州）。海南岛在当时是仅次于满门抄斩的严厉惩罚。',
      '在儋州的三年间，苏轼以花甲之身，在蛮荒之地传播中原文化。他办学堂、开医馆、劝农耕，把中原先进的文化和技术带到了海南。在他的影响下，海南在他离开后不久就出了历史上第一位进士。苏轼以他的人格魅力和文化关怀，赢得了海南人民世世代代的尊敬。元符三年（1100年），宋哲宗去世，宋徽宗即位，朝廷大赦天下，苏轼终于获准北归。然而长期的贬谪生活已经严重损害了他的健康。建中靖国元年（1101年）七月二十八日，北归途中的苏轼在常州（今江苏常州）病逝，享年六十五岁。临终前他留下"吾生无恶，死必不坠"的遗言，平静地走完了自己的人生。',
      '苏轼一生在诗、词、文、书法、绘画等多个艺术领域都取得了登峰造极的成就。他的诗与黄庭坚并称"苏黄"，词与辛弃疾并称"苏辛"，文与欧阳修并称"欧苏"，书法则位列"宋四家"之首。他一生创作了大量作品，流传至今的诗有两千七百多首，词有三百多首，文有四千多篇，数量之多、质量之高，在整个中国文学史上都极为罕见。更重要的是，苏轼的人格魅力——那种在苦难中仍能保持乐观豁达、热爱生活、关心百姓的精神，千百年来感动和影响着一代又一代的中国人。他是中国文化史上最受人民爱戴的文人之一，他的那句"一蓑烟雨任平生"，道出了无数人心中的向往。'
    ]
  },
  {
    name: '武则天',
    era: '624 — 705',
    category: '中国古代',
    title: '中国历史上唯一的女皇帝',
    biography: [
      '武则天名曌（"曌"是她为自己创造的字，意为日月当空），并州文水（今山西文水）人。她的父亲武士彟是唐朝的开国功臣之一，早年经营木材生意致富，后来追随唐高祖李渊起兵反隋，唐朝建立后官至工部尚书、荆州都督，封应国公。母亲杨氏是隋朝皇室后裔。武则天出生于这样一个既有商业背景又有政治地位的家庭，从小受到良好教育，聪明过人，博览群书。',
      '贞观十一年（637年），十四岁的武则天因为美貌和才名被唐太宗李世民召入宫中，封为"才人"——这是皇帝妃嫔中的一个等级，地位不算高。入宫之后，武则天很快就展现出不同于一般女子的刚毅和胆识。有一次唐太宗得到一匹名叫"狮子骢"的烈马，性情暴烈，无人能驯服。当时在场的武则天却对太宗说："妾能制之，然须三物：一铁鞭，二铁檛（铁棍），三匕首。铁鞭击之不服，则以铁檛打其头；又不服，则以匕首断其喉。"这番话让唐太宗对这个年轻女子刮目相看——她的性格中确实有一种狠辣果决的特质。',
      '武则天在宫中做了十二年才人，地位始终没有提升。唐太宗晚年病重期间，她与太子李治产生了感情。贞观二十三年（649年）太宗去世，按照当时的规矩，没有生育子女的妃嫔都要被送入寺庙出家为尼。武则天也被迫进入长安感业寺，开始了两年青灯古佛的生活。然而她与新皇帝李治（唐高宗）的联系并未中断。永徽二年（651年），高宗李治到感业寺上香，与武则天重逢。此后不久，武氏被重新召入宫中，封为"昭仪"，正式开启了她波澜壮阔的政治生涯。这一年她二十八岁。',
      '重回宫廷后，武则天以非凡的政治手腕，在短短几年间扳倒了萧淑妃和王皇后两大对手，一步步走向权力的中心。永徽六年（655年），唐高宗不顾长孙无忌、褚遂良等元老重臣的激烈反对，正式下诏废王皇后，立武则天为皇后。这一年武则天三十二岁。当上皇后之后，她迅速清除朝中反对势力，培养自己的政治力量。显庆五年（660年）以后，高宗李治因患风疾（类似高血压或中风），经常头晕目眩，无法处理朝政，便委托武则天协助处理国家大事。从此，武则天开始实际掌控唐朝的最高权力，宫中将她和高宗并称为"二圣"——两个圣人。',
      '弘道元年（683年），唐高宗病逝，临终遗诏让太子李显（唐中宗）继位，军国大事有不决者，兼取天后（武则天）处分。然而中宗即位后不久就被武则天废黜，改立另一个儿子李旦为帝（唐睿宗），但睿宗完全是个傀儡，武则天临朝称制，独揽大权。此后几年间，她平定了徐敬业等人在扬州发动的叛乱，又大开告密之门，重用酷吏，严厉打击反对势力，为自己称帝铺平道路。天授元年（690年）九月九日，六十七岁的武则天正式登基称帝，改国号为"周"，改元天授，定都洛阳。她成为中国历史上唯一正统的女皇帝——这一年她已经六十七岁高龄，也是中国历史上即位年龄最大的皇帝之一。',
      '武则天在位十五年（如果从临朝称制算起则实际掌权二十余年），政治上颇有作为。她重视人才选拔，首创"殿试"制度，亲自在皇宫大殿上考试贡生，使大批寒门子弟有机会脱颖而出。她重视农业生产，轻徭薄赋，促进了社会经济发展。她大力开疆拓土，设立北庭都护府，加强了对西域的管理。在她统治期间，唐朝国力强盛、文化繁荣，为后来的"开元盛世"奠定了坚实的基础。但武则天也有备受争议的一面：她重用酷吏、奖励告密、滥杀无辜，手段残忍；她晚年生活奢靡，宠信张昌宗、张易之兄弟，导致朝政日益混乱。',
      '神龙元年（705年）正月，武则天病重期间，宰相张柬之等人发动"神龙政变"，诛杀张昌宗、张易之，逼迫武则天让位给太子李显。武则天在人生的最后时刻，被迫交出了她用尽一生奋斗得来的权力。同年十一月二十六日，武则天在上阳宫的仙居殿病逝，享年八十二岁。临终前她留下遗诏："去帝号，称则天大圣皇后。"她主动放弃了"皇帝"的称号，选择以"皇后"的身份与唐高宗合葬于乾陵。她的陵墓前矗立着一块巨大的石碑，碑上空空如也、一字不刻，这就是著名的"无字碑"——功过是非，留待后人评说。这是一个传奇女子留给这个世界最后的姿态。',
      '武则天是中国历史上一位极具争议的人物。她打破了男权社会对女性的天花板，在男人的世界里登上了权力的最高峰。后世对她的评价两极分化：有人骂她是篡唐的"妖后""暴君"，称赞她的人则视她为杰出的女政治家。无论如何评价，她都是中国历史上绕不开的重要人物——她以一个女子之身，在男权至上的封建社会中登上了皇帝宝座，并且治国理政颇有建树，这本身就是一件了不起的事情。她的一生，是中国历史上最不可思议的传奇之一。'
    ]

  {
    name: '秦始皇',
    era: '前259 — 前210',
    category: '中国古代',
    title: '千古一帝 · 中国首位皇帝',
    biography: [
      '秦始皇姓嬴名政，是中国历史上第一个使用"皇帝"称号的君主。他出生于战国时期的赵国都城邯郸（今河北邯郸）。当时他的父亲子楚（后来的秦庄襄王）作为秦国的王室公子，被派到赵国做人质——这是战国时期诸侯之间常见的外交安排。子楚在赵国期间，结识了大商人吕不韦。吕不韦认为子楚"奇货可居"，是一个可以利用的政治投资品，于是花费重金帮助子楚在秦国活动，使他最终被立为秦国太子的继承人。嬴政就是子楚在赵国做人质期间出生的。由于出生在正月，且母亲姓赵，所以最初叫"赵政"，后来才改为"嬴政"。',
      '嬴政的童年并不幸福。他出生时，秦赵两国关系紧张，长平之战刚结束不久，赵国四十万降卒被秦军坑杀，赵人对秦国人恨之入骨。嬴政就是在这样的环境下出生的，从小在赵国遭受敌视和冷遇。后来子楚在吕不韦的帮助下逃离赵国，嬴政和母亲赵姬则被留在赵国，度过了几年艰难的岁月。这段童年经历，可能与嬴政后来性格中多疑、冷酷、缺乏安全感的特点有一定关系。',
      '公元前247年，秦庄襄王（子楚）去世，十三岁的嬴政继承了秦国王位。由于年幼，朝政由丞相吕不韦和太后赵姬主持，吕不韦被嬴政尊称为"仲父"（叔父的意思），实际上掌握了秦国的军政大权。随着嬴政一天天长大，他与吕不韦以及太后宠信的宦官嫪毐之间的矛盾也日益加深。公元前238年，二十二岁的嬴政正式举行冠礼（成年礼），开始亲政。嫪毐先发制人发动叛乱，被嬴政果断平定，嫪毐被车裂处死、夷灭三族。次年嬴政又以吕不韦与嫪毐案有牵连为由，免去吕不韦的丞相职务，后来又逼迫吕不韦自杀。通过这一系列雷霆手段，年轻的嬴政彻底清除了内部的政治障碍，牢牢掌握了秦国的最高权力。',
      '亲政之后，嬴政继承了秦国六代先王励精图治的基业，开始了他统一全国的宏伟事业。他重用李斯、尉缭、王翦、王贲、蒙恬等一批杰出的文臣武将，制定了"灭诸侯、成帝业、为天下一统"的战略目标。从公元前230年灭韩开始，到公元前221年灭齐为止，嬴政用了整整十年时间，先后消灭了韩、赵、魏、楚、燕、齐六个诸侯国，完成了统一中国的伟业。这一年嬴政三十九岁。这是中国历史上第一次真正意义上的统一——不仅是疆域的统一，更是政治制度、法律、文字、度量衡等全方位的统一。从此，"统一"成为中国历史的主旋律。',
      '统一天下后，嬴政认为自己"德兼三皇、功过五帝"，王号已经不足以彰显他的伟大，于是创造出"皇帝"这个新称号。他自称"始皇帝"，希望他的后世子孙能以"二世""三世"传下去，直到千世万世。秦始皇在全国范围内废除分封制，推行郡县制，把全国划分为三十六郡，郡下设县，郡守县令由中央直接任免，不再世袭。这一制度彻底结束了此前诸侯割据的局面，奠定了中国两千多年封建社会政治体制的基本框架。同时他统一了文字、货币、度量衡、车轨等，极大促进了各地区的经济文化交流。此外他还北击匈奴、修筑万里长城，南平百越、开凿灵渠，扩大了中国的版图。',
      '然而，秦始皇的统治也存在严重问题。他好大喜功、滥用民力，在统一天下后的短短十余年间，连续修建长城、阿房宫、骊山陵、驰道等超大型工程，征发了上百万民夫，给人民带来了沉重的负担。据估计，秦朝全国总人口约两千万，而常年服役的丁壮就有二三百万，许多人在沉重的劳役中死去。秦始皇还采纳李斯的建议"焚书坑儒"——焚毁除秦国史书和医药、卜筮、种树之书以外的诸子百家著作，后来又活埋了四百六十多名批评朝政的方士和儒生。这一举措严重摧残了中国古代文化，也使秦始皇在后世得到"暴君"的骂名。晚年的秦始皇迷信长生不老，多次派方士入海求仙寻找不死之药，耗费了大量人力物力。',
      '公元前210年，五十岁的秦始皇在第五次巡游全国的途中，病死于沙丘平台（今河北广宗一带）。他临死前留下遗诏，命长子扶苏赶回咸阳主持丧事并继位。然而随行的丞相李斯、宦官赵高和少子胡亥却合谋篡改了遗诏，改立胡亥为太子，并伪造诏书赐死扶苏和大将蒙恬。这就是历史上著名的"沙丘之谋"。胡亥继位后是为秦二世，他的统治比秦始皇更加暴虐，终于在秦始皇死后仅一年，就爆发了陈胜、吴广领导的大泽乡起义，随后群雄并起，强大的秦帝国迅速土崩瓦解。公元前206年，秦朝灭亡，距离秦始皇去世仅四年。',
      '秦始皇是中国历史上最具争议的帝王之一。有人称他为"千古一帝"，认为他统一中国、建立中央集权制度、书同文车同轨、修筑长城，功在千秋；也有人骂他是"暴君"，指责他穷兵黩武、横征暴敛、焚书坑儒、摧残文化。客观地说，这两面都是真实的秦始皇。他对中国历史的影响是巨大而深远的——他所建立的中央集权制度在中国延续了两千多年；他所开创的"大一统"观念，成为中华民族最根深蒂固的政治传统。百代都行秦政法——从这个意义上说，秦始皇不仅塑造了秦朝，更塑造了此后两千年的中国历史。他的功过是非，恐怕永远也争论不完。'
    ]
  },
  {

    title: '西汉史学家 · 《史记》作者',
    biography: [
      '司马迁字子长，西汉左冯翊夏阳（今陕西韩城）人。他出身于一个史学世家，祖上世代担任周朝的史官。父亲司马谈是汉武帝时期的太史令——这是负责掌管国家图书典籍、天文历法和记载历史事件的官职，相当于国家图书馆馆长兼皇家史官。司马谈学识渊博，不仅精通史学，对诸子百家、天文历法也深有研究。生长在这样的家庭环境中，司马迁自幼受到良好的学术熏陶。他自己说"年十岁则诵古文"，十岁就开始阅读用先秦古文字写的史书，打下了坚实的学问基础。',
      '二十岁时，司马迁在父亲的鼓励和支持下，开始了一次历时数年的全国漫游。他从长安出发，足迹遍及大江南北——南游江淮，登上会稽山，探访大禹陵；到沅水、湘江一带，考察屈原自沉的汨罗江；北渡汶水、泗水，在齐鲁之都（今山东曲阜、邹城一带）探访孔子、孟子的遗风；在梁楚旧地（今河南东部、江苏北部一带）考察战国时期的历史遗迹；到过大梁（今开封），访问魏国都城；登过庐山，看过大禹治水的遗迹；到过淮阴，寻访韩信的故乡和封侯之地。这次长途漫游，司马迁行程达数万里，实地考察了许多历史事件的发生地，接触了大量民间传说和第一手资料，为他日后撰写《史记》做了充分的实地调查。这是一次非常了不起的学术壮游。',
      '回到长安后，司马迁入仕为官，担任郎中——皇帝的侍从官，有机会跟随汉武帝出行。元封元年（前110年），汉武帝举行大规模的封禅大典，这是古代帝王祭祀天地、向天地报告成功的盛典。司马谈作为太史令本应随行，但在洛阳病重无法前行，最终在洛阳含恨去世。临终前他拉着儿子司马迁的手，泪流满面地嘱托他："余死，汝必为太史；为太史，无忘吾所欲论著矣！"意思是我死之后，你一定会接任太史令；做了太史令，千万不要忘记我想要完成的著作啊！司马迁俯首流涕，郑重地承诺："小子不敏，请悉论先人所次旧闻，弗敢阙。"——儿子虽然不聪明，但我一定把父亲整理记载的历史旧闻全部编写完成，不敢有所缺漏。这是中国史学史上最动人的父子对话之一。',
      '三年后，三十八岁的司马迁果然被任命为太史令，继承了父亲的职位和未竟的事业。他利用职务之便，遍览皇家藏书馆中堆积如山的典籍文献，掌握了大量珍贵的史料。太初元年（前104年），司马迁与当时的天文学家、历法家一起主持制定了新的历法《太初历》，这是当时世界上最先进的历法之一。也是从这一年开始，司马迁正式动笔撰写《史记》，这一年他四十二岁。按照原计划，这部书将是他毕生心血的结晶。',
      '然而天有不测风云。就在司马迁埋头著述的第七个年头，一场飞来横祸彻底改变了他的命运。天汉二年（前99年），西汉名将李陵在对匈奴作战中战败被俘，被迫投降。消息传到长安，汉武帝震怒，满朝文武见风使舵，纷纷声讨李陵。司马迁却站了出来，为李陵说了几句公道话，认为李陵以五千步兵深入匈奴腹地，转战千里，杀敌上万，最终弹尽粮绝才不得已投降，情有可原。这番话触怒了汉武帝，被定为"诬上"的罪名——诬蔑皇上，罪当腰斩。按照汉代的法律，被判死罪的人有两种办法可以免死：一是缴纳五十万钱赎罪，二是接受"宫刑"（阉割之刑）代替死刑。司马迁官小家贫，拿不出这么多钱赎罪，摆在他面前的只有两条路：要么死，要么接受宫刑。',
      '这是司马迁一生中最痛苦的抉择。在当时的士大夫看来，宫刑是最耻辱的刑罚，它不仅残害肉体，更侮辱人格，是"大辱中的大辱"。司马迁在给朋友任安的信中写道："太上不辱先，其次不辱身……最下腐刑极矣！"意思是人生最大的耻辱莫过于宫刑。他也曾想过自杀——士可杀不可辱，一死了之反而痛快。但是，一想到父亲临终前的嘱托，一想到耗费了多年心血、刚刚草创未完的《史记》，他又实在不甘心就这样死去。经过痛苦的思想挣扎，司马迁最终选择了忍辱负重，接受宫刑以换取活命的机会。他后来写道："人固有一死，或重于泰山，或轻于鸿毛。"他的选择，正是为了完成比泰山还重的使命。',
      '受刑出狱后，司马迁被任命为中书令——一个由宦官担任的、在皇帝身边掌管文书的官职。这个职位虽然更接近皇帝权力中心，但在当时人眼中却是宦官的代名词，司马迁因此更加痛苦和屈辱。然而正是在这种常人难以忍受的精神折磨中，他把全部的精力和感情都投入到了《史记》的写作中。大约在征和二年（前91年）左右，司马迁终于完成了这部旷世巨著。全书共一百三十篇，五十二万六千五百字，包括十二本纪（记帝王）、十表（用表格简列世系和大事）、八书（记典章制度）、三十世家（记诸侯和重要人物）、七十列传（记各类人物），记述了从传说中的黄帝时代一直到汉武帝太初年间，三千多年的历史。',
      '司马迁完成《史记》后不久就去世了，具体的卒年史书中没有明确记载，大约卒于公元前87年前后。他的巨著《史记》在他死后由他的外孙杨恽整理公布于世。《史记》是中国历史上第一部纪传体通史，被列为中国"二十四史"之首。它不仅是一部伟大的历史著作，也是一部杰出的文学作品——司马迁的文笔生动、人物栩栩如生，书中许多故事和成语至今仍被广泛引用。鲁迅先生称赞《史记》是"史家之绝唱，无韵之离骚"——既是史学领域的巅峰之作，也是没有韵脚的《离骚》，给予了最高的评价。司马迁用他屈辱而伟大的一生，完成了"究天人之际，通古今之变，成一家之言"的不朽事业。他的名字和他的著作一起，永远铭刻在中华文明的史册上。'
    ]
  },
  {
    name: '屈原',
    era: '约前340 — 前278',
    category: '中国古代',
    title: '中国浪漫主义文学奠基人 · 爱国诗人',
    biography: [
      '屈原名平，字原，战国时期楚国丹阳（今湖北秭归一带）人。他出身楚国贵族，是楚武王熊通之子屈瑕的后代。屈原从小受到良好教育，博闻强记、才华横溢，二十多岁就担任楚怀王的左徒（相当于副丞相），参与楚国的内政外交。他主张对内修明政治、任用贤能，对外联齐抗秦，一度深得怀王信任。',
      '然而屈原的正直和才华遭到了楚国贵族保守派的嫉妒和排挤。上官大夫靳尚、令尹子兰等人在怀王面前屡进谗言，诬陷屈原傲慢自大、目中无人。怀王逐渐疏远屈原，后来将他贬为三闾大夫——一个只管王族宗庙祭祀和贵族子弟教育的闲职。尽管被疏远，屈原仍然心系国家，写下了许多忧国忧民的诗篇。',
      '楚怀王后来受秦国张仪的欺骗，与齐国断交，又轻率伐秦，结果在丹阳、蓝田之战中惨败，丧失了大片国土。怀王最终被秦国诱骗入秦，客死咸阳。楚顷襄王即位后，屈原更加被冷落，终于被放逐到长江以南的蛮荒之地。在长达二十多年的流放生涯中，屈原走遍了湘水、沅水一带，深入了解民间疾苦，他的诗歌创作也达到了巅峰。',
      '屈原是中国文学史上第一位伟大的爱国诗人，他创立了"楚辞"这一独特的文学体裁。他的代表作《离骚》是中国古代最长的抒情诗，全诗三百七十多句，近两千五百字，以绚丽的文采、丰富的想象、深沉的情感，倾诉了诗人的政治理想、爱国情怀和不幸遭遇。"路漫漫其修远兮，吾将上下而求索"——这震撼人心的名句，千百年来激励着无数仁人志士。此外他还创作了《九歌》《九章》《天问》等不朽诗篇。《天问》一口气向天提出了一百七十多个问题，涉及天地宇宙、神话历史，是中国文学史上绝无仅有的奇文。',
      '公元前278年，秦国大将白起率军攻破楚国都城郢都，焚毁了楚国先王的陵墓。消息传来，五十五岁的屈原在极度悲愤中，感到自己的祖国已经濒临灭亡，他的理想彻底破灭了。在这一年的农历五月初五，屈原怀抱一块大石头，纵身投入了波涛滚滚的汨罗江，以死殉国。附近的村民得知后，纷纷划船赶来营救，却再也找不到诗人的身影。为了防止鱼虾啃食屈原的遗体，人们往江中投放用糯米做的粽子。',
      '屈原虽然投江而死，但他的精神和诗篇却永远流传了下来。两千多年来，每年农历五月初五的端午节，人们以赛龙舟、吃粽子等方式纪念这位伟大的爱国诗人。屈原被列为世界四大文化名人之一（与波兰哥白尼、英国莎士比亚、意大利但丁齐名），受到全世界人民的敬仰。他那深厚的爱国主义情怀、高洁不屈的人格精神和璀璨夺目的文学成就，使他成为中华民族文化史上最光辉的人物之一。'
    ]
  },
  {
    name: '文天祥',
    era: '1236 — 1283',
    category: '中国古代',
    title: '南宋抗元英雄 · 民族气节典范',
    biography: [
      '文天祥字履善，又字宋瑞，号文山，吉州庐陵（今江西吉安）人。他出生于南宋末年一个书香门第，父亲文仪是一位博学的乡绅，藏书万卷，教子有方。文天祥从小聪颖好学，在父亲的教导下博览群书，尤其仰慕历代忠臣义士。二十岁那年，他到京城临安参加进士考试，在殿试中以一篇《御试策》针砭时弊、主张改革，被宋理宗亲自提拔为第一名，高中状元——这一年他才二十岁。',
      '然而文天祥所处的时代，正是南宋王朝风雨飘摇、蒙古大军步步进逼的危难时刻。中状元后不久，他的父亲去世，文天祥回家守孝三年。此后他虽然历任各种官职，却因为性格耿直、敢于直言，多次遭到权臣的排挤和贬斥。三十八岁那年，他索性辞官回乡，在家乡办学授徒，似乎要终老林下。',
      '然而国家的危难不允许他置身事外。德祐元年（1275年），元军沿长江东下，直逼临安。朝廷紧急下诏，号召天下兵马勤王。文天祥在家乡读到诏书后，痛哭流涕，毅然变卖家产，招兵买马，组织了一支一万多人的义军，奔赴临安保卫朝廷。朋友劝他说元军势大，以卵击石无济于事。文天祥回答说："我也知道是这样。但国家养育臣民三百多年，一旦有急，征天下兵，无一人一骑入关者。我深恨于此，所以不自量力，以身赴难。希望天下忠臣义士闻风而起，国家也许还能保全。"这番话，道出了他"知其不可而为之"的悲壮决心。',
      '文天祥率义军赶到临安后，被任命为右丞相兼枢密使，主持残局。然而此时南宋朝廷已经人心涣散，许多官员纷纷逃跑。德祐二年（1276年）初，元军兵临临安城下。文天祥被派往元营谈判，结果被元军统帅伯颜扣留。临安随后陷落，宋恭帝和太后被俘北上。文天祥在被押送北上的途中，于镇江冒险逃脱，历经千辛万苦辗转来到温州，继续组织抗元斗争。',
      '此后的三年间，文天祥在福建、江西、广东一带坚持抗战，组织军队，收复失地。他的军队一度在江西大败元军，收复了不少州县。但在元军的强大攻势下，义军最终寡不敌众。祥兴元年（1278年）十二月，文天祥在广东海丰五坡岭被元军俘虏。他当即吞下随身携带的冰片自杀，却因药力不够未能成功。',
      '被俘后的文天祥被押送到大都（今北京），关押在一间狭小阴暗的土牢中。元朝统治者用尽各种手段劝他投降：派已经投降的南宋旧臣前来游说，让被俘的宋恭帝亲自劝降，许以高官厚禄，甚至用酷刑折磨。但文天祥始终不为所动。在狱中，他写下了流传千古的《正气歌》，列举了历代忠臣义士的事迹，表达了自己宁死不屈的决心。他还写下了"人生自古谁无死，留取丹心照汗青"的不朽名句。',
      '至元十九年（1282年）十二月，元世祖忽必烈亲自召见文天祥，许以丞相之位。文天祥回答说："天祥受宋朝三帝厚恩，号称状元宰相，如今国破家亡，唯求一死。"忽必烈见他意志坚定，知道无法劝降，终于下令将他处死。次年一月，文天祥在大都柴市从容就义，时年四十七岁。临刑前，他面向南方（南宋故国的方向）跪拜行礼，然后引颈就刑。死后人们在他的衣带中发现了一首绝笔诗："孔曰成仁，孟曰取义。惟其义尽，所以仁至。读圣贤书，所学何事？而今而后，庶几无愧！"',
      '文天祥用他的生命，诠释了中华民族"杀身成仁、舍生取义"的最高气节。他的名字成为中华民族精神的象征，激励着后世一代又一代的爱国者。他的诗文集《文山先生全集》流传至今，字里行间充满浩然正气。'
    ]

  {
    name: '成吉思汗',

    category: '中国古代',
    title: '蒙古帝国开创者 · 一代天骄',
    biography: [
      '成吉思汗本名铁木真，出生于蒙古高原斡难河畔（今鄂嫩河，属蒙古国）的一个蒙古贵族家庭。他的父亲也速该是蒙古乞颜部的首领。铁木真九岁那年，父亲在带着他去提亲的归途中，被敌对的塔塔儿部人下毒害死。父亲死后，部众离散，铁木真和母亲、兄弟们陷入困境，一家人在草原上艰难度日，靠采集野果、捕杀土拨鼠为生。少年时代的铁木真多次被仇敌追捕，九死一生。这段艰难困苦的经历，磨练了他钢铁般的意志和超凡的军事才能。',
      '成年后的铁木真凭借过人的胆识和谋略，逐步收拢部众，联合盟友，先后击败了蔑儿乞、塔塔儿、克烈、乃蛮等部落，统一了蒙古高原。在统一过程中，铁木真展现出卓越的军事和政治才能：他善于用人，不问出身高低，许多出身奴仆的杰出人才（如木华黎、者别等）都被他重用；他善于用兵，创立了灵活机动的骑兵战术；他还制定了《大札撒》——蒙古历史上第一部成文法典。',
      '1206年，铁木真在斡难河畔召开忽里台大会（贵族会议），被推举为全蒙古的大汗，尊号"成吉思汗"——意为"拥有海洋四方的大汗"或"坚强的大汗"。这一年他四十五岁。蒙古汗国正式建立，从此蒙古作为一个统一的民族登上了世界历史舞台。',
      '建国后，成吉思汗开始了他震惊世界的对外征服。1209年，他率军南下，迫使西夏求和。1211年起，他亲率大军进攻金朝，攻破金朝中都（今北京），金朝被迫迁都汴京。1219年，为了惩罚花剌子模（中亚古国）杀害蒙古商使的行为，成吉思汗亲率二十万大军西征，这是人类历史上最伟大的军事远征之一。蒙古铁骑横扫中亚，攻破花剌子模都城撒马尔罕，追击敌军直到印度河沿岸。这场远征打通了欧亚大陆的交通线，促进了东西方的文化和商业交流，也给中亚人民带来了深重的灾难。',
      '西征归来后，成吉思汗继续进攻西夏。1227年，在西夏即将灭亡之际，六十六岁的成吉思汗在六盘山下的清水县病逝。临终前他留下遗嘱：利用宋金世仇，借道宋境，联宋灭金。他的子孙后来正是按照这一战略，先后灭了西夏、金朝和南宋，建立了中国历史上疆域最辽阔的元朝，并建立了横跨欧亚大陆的四大汗国。',

      '李时珍字东璧，号濒湖，湖广蕲州（今湖北蕲春）人。他出身于一个世代行医的家庭，祖父和父亲都是当地有名的医生。在那个"万般皆下品，惟有读书高"的时代，医生的社会地位并不高，父亲希望李时珍走科举入仕的道路，而不是继承家业做医生。然而李时珍从小体弱多病，多次生病求医的经历使他对医学产生了浓厚的兴趣，反而对科举八股文不感兴趣。',
      '十四岁那年，李时珍在父亲的督促下考中秀才，但此后三次参加乡试都名落孙山。二十三岁那年，他终于说服父亲，正式开始学医。从此他如鱼得水，把全部精力投入到医学中。他勤奋阅读历代医药著作，同时跟随父亲临床实践，医术进步神速。没过几年，他就成为当地有名的医生。他医术精湛、医德高尚，对待病人无论贫富贵贱都一视同仁，深受百姓爱戴。',

      '为了完成这一伟大的目标，李时珍付出了常人难以想象的艰辛努力。他一方面"读书十年，不出户庭"，深入研读了八百多部古代医药和相关著作，做了数百万字的读书笔记；另一方面，他"搜罗百氏，采访四方"，走出书斋，深入山野民间，实地考察各种药物。他的足迹遍及湖北、河南、河北、江西、江苏、安徽等省的名山大川，亲自采集药物标本、记录生长习性、向当地农民和樵夫请教。为了验证某些剧毒药物的药性，他甚至冒着生命危险亲自试服。',
      '经过整整二十七年的艰苦努力，万历六年（1578年），六十岁的李时珍终于完成了他的旷世巨著《本草纲目》。这部书共五十二卷，约一百九十万字，记载药物一千八百九十二种，其中李时珍新增的就有三百七十四种；收录药方一万一千零九十六个，配有药物插图一千一百六十幅。全书将药物分为水、火、土、金石、草、谷、菜、果、木、服器、虫、鳞、介、禽、兽、人等十六部，部下分六十类，分类之科学、条理之清晰，在当时的世界上处于领先地位。',

      '万历二十一年（1593年），七十六岁的李时珍与世长辞。他一生著述丰富，除《本草纲目》外，还著有《濒湖脉学》《奇经八脉考》等医学著作。《本草纲目》后来被译成拉丁文、英文、日文、德文、法文、俄文等多种文字，流传世界各地，被达尔文称为"中国古代的百科全书"，对世界医药学和自然科学的发展产生了深远影响。2011年，《本草纲目》和李时珍的另一部著作《黄帝内经》一道，被联合国教科文组织列入《世界记忆名录》，成为全人类共同的文化遗产。李时珍用二十七年光阴写下的这部药典，是中华民族对人类文明的伟大贡献。'

      '蔡伦一生最大的贡献，是在担任尚方令期间改进和完善了造纸术。尚方令是负责管理宫廷手工制造作坊的官职，掌管着皇家御用的刀剑、兵器和各种器物的制作。这个职位使蔡伦有机会接触到当时最先进的各种手工艺技术，也使他对材料加工产生了浓厚的兴趣。',

      '蔡伦的晚年并不幸福。由于他早年卷入宫廷斗争，汉安帝亲政后追究旧事，下令让蔡伦到廷尉（最高司法官）那里自首。蔡伦耻于受辱，沐浴整冠后服毒自尽，走完了他的一生。尽管他的个人命运以悲剧收场，但他改进的造纸术却成为中华民族对人类文明最伟大的贡献之一。在今天的美国华盛顿国家博物馆中，蔡伦的画像与爱因斯坦、达尔文等科学巨匠并列，被作为对人类文明贡献最大的人物之一永久纪念。他的名字，将永远与"纸"这个改变了世界的伟大发明紧密相连。'

      '青年时期的祖冲之曾在当时的国家级学术机构华林学省和总明观任职，这使他有机会接触到国家收藏的大量图书、档案和天文观测资料。他勤奋好学、博览群书，同时又不盲从古人，敢于独立思考、大胆创新。他广泛研究了先秦以来的天文和数学著作，在深入理解的基础上提出了许多超越前人的创见。',

    biography: [
      '海伦·亚当斯·凯勒（Helen Adams Keller）1880年6月27日出生于美国阿拉巴马州塔斯坎比亚镇的一个种植园主家庭。她的父亲是南方联邦军队的退役上尉，母亲出身于一个显赫的家族。海伦出生时是一个健康聪明的婴儿，六个月大就开始学说话，一家人对她充满期望。然而，命运却给这个可爱的孩子开了一个无比残酷的玩笑。',
      '海伦一岁零七个月的时候，一场突如其来的高烧（可能是猩红热或脑膜炎）使她失去了视力和听力，从此陷入了一个黑暗而无声的世界。由于听不到声音，她也无法学会说话，成为一个既盲又聋又哑的三重残疾儿童。在接下来的几年里，海伦生活在无法与外界沟通的孤独和绝望中。由于无法表达自己的需求，她常常脾气暴躁、行为失控，被周围的人视为一个难以管教的"野孩子"。她的父母在痛苦中四处求医，尝试了各种方法都无济于事。',
      '1887年3月3日，在海伦将近七岁的时候，一位名叫安妮·沙利文（Anne Sullivan）的年轻女教师来到了她的家中。这一天成为海伦生命中最重要的转折点，她后来称这一天为"我灵魂的生日"。安妮·沙利文本人也有视力障碍，她十四岁时才进入波士顿的柏金斯盲人学校学习，深知盲人教育的艰辛。她带着极大的耐心和爱心，开始了对海伦的教育。',
      '最初的教育极其困难。海伦对这个新来的"入侵者"充满敌意，拒绝学习。安妮采取了"实物教学"的方法：她把一个洋娃娃放到海伦手中，然后在她的手掌上缓慢地拼写出"D-O-L-L"（洋娃娃）这个单词。然而海伦并不理解这些字母的意义，她以为这只是一种新的游戏。这样的尝试进行了无数次，都没有成功。直到有一天，安妮带着海伦来到水井边，让清凉的水流从她的一只手上流过，同时在她的另一只手上反复拼写出"W-A-T-E-R"（水）这个单词。',
      '就在这一刻，奇迹发生了。海伦突然意识到：这些手掌上的运动符号，正是她所熟悉的"水"！她浑身颤抖，仿佛被电击一般。她趴在地上，用手指着地面——她要知道"地"这个字怎么写。她不断地指着各种事物，急切地学习它们的名称。那一天，海伦学会了三十个单词。她后来在自传中写道："那天的学习，使我从一个无知的小孩变成了一个有思想、有情感的人。我第一次感觉到自己是一个"人"。"这个著名的"水"字启示，成为人类教育史上最动人的故事之一。',
      '从那以后，海伦的学习进步神速。她用手指触摸别人的嘴唇和喉咙来学习说话，通过点字（盲文）来阅读书籍，通过手语与人交流。她的求知欲极其旺盛，对世界充满了好奇。1890年，十岁的海伦开始学习说话——对于一个从未听过声音的人来说，这几乎是不可能的事情。但她凭借惊人的毅力，最终学会了用清晰的声音与人交流。',
      '1898年，十八岁的海伦进入哈佛大学拉德克利夫学院学习，成为世界历史上第一个获得大学学位的盲聋人。大学期间，她在安妮老师的帮助下，用手"听"课，用盲文阅读，用打字机写作，成绩优异。1904年，二十四岁的海伦以优异的成绩从哈佛大学毕业，获得文学学士学位。她的毕业感言震惊了整个美国。',
      '大学毕业后，海伦将毕生精力投入到为残障人士争取权益的事业中。她走遍美国和世界各地，发表演讲、募集资金，为盲人和聋人建立学校和福利机构。她积极参与妇女参政运动、和平运动和社会主义运动，成为二十世纪初美国最著名的社会活动家之一。她一生共创作了十四部著作，其中自传《我的生活》（The Story of My Life）和《假如给我三天光明》（Three Days to See）等作品感动了全世界无数读者，成为激励人们克服困难、热爱生命的经典。',
      '在《假如给我三天光明》中，海伦写道："假如给我三天光明，我第一天要看人，看他们的善良、淳朴与友谊使我的生活值得一过。第二天，我要在黎明起身，去看黑夜变为白昼的动人奇迹。第三天，我将在日常世界中度过，到为生活而奔忙的人们经常去的地方去体验他们的快乐、忧伤、感动与善良。"这段朴实无华的文字，道出了一个失去光明的人对生命最真挚的热爱。',
      '海伦·凯勒1968年6月1日在康涅狄格州的家中去世，享年八十七岁。她被安葬在华盛顿国家大教堂，与威尔逊总统等美国历史上的杰出人物长眠在一起。1999年，海伦·凯勒被美国《时代》周刊评选为"二十世纪美国十大英雄偶像"之一。她用她的一生证明：人类的精神力量可以超越任何生理的缺陷。她那句名言——"世界上最美好的东西，是看不见也摸不到的，只能用心去感受"——将永远激励着每一个热爱生命的人。'
    ]
  },
  {
    name: '马克思',

    biography: [
      '卡尔·海因里希·马克思（Karl Heinrich Marx）1818年5月5日出生于普鲁士莱茵省特里尔城的一个犹太家庭。他的父亲亨利希·马克思是一位成功的律师，为了获得更好的职业发展而改信基督教。马克思从小受到良好的教育，十七岁进入波恩大学学习法律，一年后转学到柏林大学。在柏林期间，他对哲学产生了浓厚的兴趣，特别是黑格尔的哲学思想。1841年，二十三岁的马克思以一篇关于古希腊哲学的论文获得耶拿大学的哲学博士学位。',
      '大学毕业后，马克思本来想在大学从事学术研究，但由于普鲁士政府对思想自由的压制，他不得不转向新闻工作。1842年，他成为《莱茵报》的主编。这份报纸很快成为宣传激进民主思想的阵地，马克思在报上发表了一系列针砭时弊的文章，猛烈抨击普鲁士的专制制度。然而好景不长，1843年普鲁士政府查封了《莱茵报》。同年，马克思与童年时代的恋人燕妮·冯·威斯特华伦结婚——燕妮出身普鲁士贵族家庭，这桩婚事在当时引起了不小的轰动。',
      '1843年10月，二十五岁的马克思带着新婚妻子迁居巴黎。在巴黎期间，他广泛接触了各国流亡者和工人组织，深入研究了英国古典政治经济学和法国空想社会主义学说，思想逐步从民主主义转向共产主义。1844年8月，马克思在巴黎与弗里德里希·恩格斯会面——这是人类思想史上最著名的会晤之一。两人一见如故，发现彼此的观点惊人地一致，从此开始了长达四十年的亲密合作，共同创立了马克思主义学说。',
      '1845年，马克思被法国政府驱逐出境，迁居比利时布鲁塞尔。此后他又先后移居德国科隆、法国巴黎，最终于1849年定居英国伦敦——在那里度过了他人生的最后三十四年。在伦敦期间，马克思的生活极为艰辛，由于没有稳定收入，加上他又把主要精力投入到理论研究和革命活动中，全家经常陷入贫困。恩格斯从曼彻斯特的父亲工厂中不断提供资助，才使马克思一家勉强维持生活。有几个孩子因为营养不良和疾病而夭折，成为马克思心中永远的痛。',
      '然而，正是在这种极端艰苦的条件下，马克思完成了他一生中最重要的理论著作。从1843年到1883年的四十年间，他先后写出了《1844年经济学哲学手稿》《神圣家族》《德意志意识形态》《哲学的贫困》等重要著作。1848年，三十岁的马克思与恩格斯共同发表了震惊世界的《共产党宣言》——这部篇幅不长的小册子，以"一个幽灵，共产主义的幽灵，在欧洲游荡"开篇，系统阐述了马克思主义的基本观点，宣告了资本主义的必然灭亡和共产主义的必然胜利，成为国际共产主义运动的纲领性文件。',
      '马克思一生中最重要、最宏大的著作是《资本论》（Das Kapital）。这部巨著耗费了他后半生几乎全部的精力。为了写作《资本论》，马克思在大英博物馆的阅览室里埋头苦读了二十多年，翻阅了一千五百多种书籍，做了数百本读书笔记。他深入研究了资本主义经济的运行规律，分析了商品、货币、资本、剩余价值等核心概念，揭示了资本主义生产方式的内在矛盾和历史局限性。1867年，《资本论》第一卷正式出版——这是马克思生前出版的唯一一卷。第二卷和第三卷是在他去世后由恩格斯根据他的遗稿整理出版的。',
      '马克思不仅是一位学者，更是一位积极的社会活动家。他参与创立了"国际工人协会"（即第一国际），并成为其实际的灵魂人物。他积极支持各国工人运动和民族独立运动，为巴黎公社的斗争写下了热情洋溢的《法兰西内战》。他的学说在他生前就已经在欧洲工人运动中产生了广泛影响。',
      '1881年，与马克思相濡以沫近四十年的妻子燕妮在伦敦去世，这给马克思带来了沉重的打击。一年多后的1883年3月14日，马克思在伦敦寓所的安乐椅上与世长辞，享年六十五岁。他被安葬在伦敦海格特公墓，与妻子燕妮合葬。他的墓前矗立着一座高大的铜像，碑上刻着他的名言："哲学家们只是用不同的方式解释世界，而问题在于改变世界。"',
      '马克思对人类历史的影响是巨大而深远的。他创立的马克思主义学说，深刻地改变了二十世纪的世界面貌，催生了苏联、中国等一系列社会主义国家的诞生，也极大地推动了西方社会的民主化和福利化进程。他的思想体系涵盖了哲学、经济学、历史学、政治学、社会学等多个领域，成为现代社会科学最重要的思想传统之一。马克思被公认为人类历史上最伟大的思想家之一。2008年国际金融危机爆发后，他的《资本论》在欧洲和世界各地再次热销——这表明他对资本主义的深刻分析，在今天依然具有强大的现实意义。正如他的亲密战友恩格斯在他墓前所言："他的英名和事业将永垂不朽！"'
    ]

  {
    name: '甘地',
    era: '1869 — 1948',
    category: '世界人物',
    title: '印度国父 · 非暴力不合作运动领袖',
    biography: [
      '莫罕达斯·卡拉姆昌德·甘地（Mohandas Karamchand Gandhi）1869年10月2日出生于印度西部古吉拉特邦一个叫波尔班达尔的小镇。他的家庭属于印度教中的吠舍种姓（商人种姓），父亲卡巴·甘地是当地的土邦首相，为人正直善良，母亲普塔丽拜是一位虔诚的印度教徒，这些家庭背景对甘地一生的思想和性格产生了深远影响。',
      '少年时代的甘地腼腆内向，成绩平平，绝非什么"神童"。十三岁那年，按照印度的传统习俗，他与同龄女孩卡斯特巴结婚——这是一桩父母包办的婚姻，但甘地与妻子后来感情甚好，相伴终身。十八岁时，甘地从中学毕业，他不顾家乡保守势力的反对（印度教徒当时认为漂洋过海是不洁的），远赴英国伦敦大学学院学习法律。在伦敦期间，他严格遵守素食戒律，生活简朴，同时广泛阅读了基督教、伊斯兰教和各种哲学书籍，思想日益成熟。三年后，他取得了律师资格，回到印度。',
      '然而，甘地在印度的律师生涯并不成功。他性格腼腆，不善言辞，在法庭上常常紧张得说不出话来。1893年，二十四岁的甘地应邀前往南非，为一家印度商人公司处理法律事务——这次南非之行，成为他人生的重大转折点。在南非，甘地亲身经历了欧洲殖民者对印度裔移民的种族歧视和压迫。有一次，他购买了头等车厢的火车票，却因为肤色原因被粗暴地赶下火车，在寒冷的车站里度过了一夜。这一耻辱性的经历，使他开始思考如何以一种有效的方式与不公和压迫作斗争。',
      '在南非的二十一年间，甘地逐渐发展出了他独特的斗争哲学——"萨提亚格拉哈"（Satyagraha），意为"坚持真理"，也被称为"非暴力不合作"。他认为，不公正的制度之所以能够存在，是因为被压迫者在不自觉地"配合"它；如果被压迫者集体拒绝配合，同时不使用暴力，那么压迫者的权力基础就会被彻底瓦解，而压迫者自身也会在良心的谴责下发生改变。甘地在南非组织了多次非暴力抵抗运动，包括大规模的和平游行、罢工和自愿入狱。这些运动虽然受到了残酷镇压，但最终迫使南非政府做出了重大让步，废除了多项歧视性法律。甘地也因此声名远扬，成为印度人心目中的英雄。',
      '1915年，四十五岁的甘地回到了阔别多年的祖国——印度。回国后，他没有立即投身政治，而是用了整整一年的时间，乘坐三等火车走遍印度各地，深入了解这个他已经陌生的祖国。他看到了印度底层人民的赤贫、愚昧和痛苦，决心为他们的解放而斗争。他脱下西装，换上了印度最底层农民穿的土布"陀地"（Dhoti，用一块白布围裹下身），亲自纺纱织布，过着苦行僧般的简朴生活——他每天的生活费不足一便士，饮食只有水果、蔬菜和羊奶。这种简朴的生活方式，使他获得了印度广大贫苦民众的认同和爱戴，人们亲切地称他为"圣雄"（Mahatma）——意为"伟大的灵魂"。',
      '从1919年开始，甘地先后发动和领导了三次大规模的"非暴力不合作运动"和"公民不服从运动"，反对英国的殖民统治。他号召印度人抵制英国商品、拒绝纳税、不使用英国法庭和学校、不担任英国政府公职。最著名的一次是1930年的"食盐进军"——为了抗议英国政府的食盐专营法（禁止印度人自制食盐），六十岁的甘地率领七十八名信徒，从他的修道院长途步行三百九十公里来到阿拉伯海边，亲自煮海水制盐，以实际行动挑战英国法律。这场运动引发了全国性的抗议浪潮，数以万计的印度人自愿入狱。',
      '甘地的非暴力哲学核心是"爱"与"真理"。他相信每个人心中都有善性，即使是最凶恶的敌人也可以被爱所感化。他的名言"以眼还眼，只会使整个世界都盲目"（An eye for an eye makes the whole world blind）深刻地表达了这一思想。他一生中多次绝食——不是为了威胁对手，而是为了感化对手。每当印度教徒和穆斯林之间发生暴力冲突时，他就以绝食的方式呼吁双方停止仇杀，他的绝食曾多次成功地制止了大规模的宗教流血冲突。',
      '在甘地和印度其他民族主义领袖的长期斗争下，英国政府最终于1947年同意印度独立。然而，印度独立是以"印巴分治"的形式实现的——印度教徒占多数的地区成立印度联邦，穆斯林占多数的地区成立巴基斯坦。分治引发了人类历史上最大规模的人口迁徙和相互屠杀，约有一百万人在混乱中丧生，一千五百万人流离失所。年近八十的甘地以惊人的精力投身于平息教派冲突的工作中，他走遍暴乱地区，呼吁人民停止相互残杀。他以绝食威胁极端分子，甚至在穆斯林居住区绝食——这使一些极端印度教徒对他恨之入骨。',
      '1948年1月30日，在一次前往晚祷的路上，七十九岁的甘地被一名狂热的印度教极端分子纳图拉姆·戈德塞用手枪击中胸部。中弹后，甘地以微弱的声音说："哦，神啊……"然后倒地身亡。消息传出，整个印度陷入巨大的悲痛之中。印度总理尼赫鲁在广播中用哽咽的声音向全国人民宣告："我们生命中的光明熄灭了……"甘地的葬礼吸引了数百万悲痛的民众，他的遗体按照印度教传统在亚穆纳河畔火化。',
      '甘地被誉为"印度国父"，被公认为二十世纪最伟大的人物之一。他的非暴力思想深刻影响了马丁·路德·金、纳尔逊·曼德拉等后世的民权运动领袖，也为人类解决冲突提供了一种全新的、超越暴力的思维方式。爱因斯坦曾经这样评价甘地："后世的子孙也许很难相信，历史上竟然走过这样一副血肉之躯。"1999年，甘地被美国《时代》周刊评选为二十世纪最具影响力的人物第二名（仅次于爱因斯坦）。每年的10月2日——甘地的生日，被联合国定为"国际非暴力日"。他的精神遗产，将永远激励着人类追求和平、正义与尊严。'
    ]
  },

  <script>
// 时光罗盘 App 主逻辑

(function () {
  'use strict';

  // ============== 导航切换 ==============
  const pages = {
    today: document.getElementById('page-today'),
    people: document.getElementById('page-people'),
    search: document.getElementById('page-search')
  };

  const navBtns = document.querySelectorAll('.nav-btn');

  function switchPage(pageId) {
    Object.values(pages).forEach(page => page && page.classList.remove('active'));
    if (pages[pageId]) pages[pageId].classList.add('active');

    navBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === 'page-' + pageId);
    });

    const main = document.querySelector('.app-main');
    if (main) main.scrollTop = 0;

    closeModal();
  }

  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.page.replace('page-', '');
      switchPage(id);
    });
  });

  // ============== 日期选择 ==============
  let currentDate = new Date();

  const todayBig = document.getElementById('today-big');
  const todaySmall = document.getElementById('today-small');
  const pickDateBtn = document.getElementById('pick-date-btn');
  const datePicker = document.getElementById('date-picker');
  const dateInput = document.getElementById('date-input');
  const dateConfirm = document.getElementById('date-confirm');

  function formatDateDisplay(date) {
    const m = date.getMonth() + 1;
    const d = date.getDate();
    todayBig.textContent = `${m}月${d}日`;

    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    todaySmall.textContent = `${date.getFullYear()}年 · ${weekdays[date.getDay()]}`;
  }

  function getEventsForDate(month, day) {
    return HISTORY_EVENTS.filter(e => e.month === month && e.day === day);
  }

  function renderEventsForDate(date) {
    const events = getEventsForDate(date.getMonth() + 1, date.getDate());
    const list = document.getElementById('event-list');

    if (events.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📜</div>
          <div class="empty-state-text">这一天暂无历史事件记录<br><small style="font-size:12px;opacity:0.7;">试试选择其他日期，或前往人物页浏览</small></div>
        </div>
      `;
      return;
    }

    list.innerHTML = events.map((ev, idx) => `
      <div class="event-card" data-event-index="${HISTORY_EVENTS.indexOf(ev)}">
        <span class="event-tag ${ev.type === '中国' ? 'china' : 'world'}">${ev.type}</span>
        <div class="event-year">${ev.year}年</div>
        <div class="event-title">${ev.title}</div>
        <div class="event-summary">${ev.summary}</div>
        <div class="event-more">查看详情</div>
      </div>
    `).join('');

    // 事件卡片点击：由全局事件委托处理，无需单独绑定
  }

  // 初始化今日
  formatDateDisplay(currentDate);
  renderEventsForDate(currentDate);

  // 默认使用今天作为初始日期
  const yyyy = currentDate.getFullYear();
  const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
  const dd = String(currentDate.getDate()).padStart(2, '0');
  dateInput.value = `${yyyy}-${mm}-${dd}`;

  pickDateBtn.addEventListener('click', () => {
    datePicker.hidden = !datePicker.hidden;
    if (!datePicker.hidden) {
      dateInput.focus();
    }
  });

  dateConfirm.addEventListener('click', () => {
    if (!dateInput.value) return;
    const parts = dateInput.value.split('-');
    currentDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    formatDateDisplay(currentDate);
    renderEventsForDate(currentDate);
    datePicker.hidden = true;
  });

  // ============== 人物页 ==============
  const peopleGrid = document.getElementById('people-grid');
  const catBtns = document.querySelectorAll('.cat-btn');
  let currentCategory = 'all';

  function renderPeople() {
    let list = HISTORY_PEOPLE;
    if (currentCategory !== 'all') {
      list = HISTORY_PEOPLE.filter(p => p.category === currentCategory);
    }

    if (list.length === 0) {
      peopleGrid.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📖</div>
          <div class="empty-state-text">暂无该分类下的人物</div>
        </div>
      `;
      return;
    }

    peopleGrid.innerHTML = list.map(person => `
      <div class="person-card" data-person-name="${person.name}">
        <div class="person-avatar">${person.name.charAt(0)}</div>
        <div class="person-info">
          <div class="person-name">${person.name}</div>
          <div class="person-era">${person.era}</div>
          <div class="person-title">${person.title}</div>
        </div>
        <span class="person-category">${person.category}</span>
      </div>
    `).join('');

    // 人物卡片点击：由全局事件委托处理，无需单独绑定
  }

  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      catBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      renderPeople();
    });
  });

  renderPeople();

  // ============== 搜索页 ==============
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const searchEmpty = document.getElementById('search-empty');
  const searchResults = document.getElementById('search-results');
  const filterBtns = document.querySelectorAll('.filter-btn');
  let currentFilter = 'all';
  let lastKeyword = '';

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function highlight(text, keyword) {
    if (!keyword) return escapeHtml(text);
    const safe = escapeHtml(text);
    const safeKw = escapeHtml(keyword);
    const reg = new RegExp(safeKw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(reg, m => `<span class="search-highlight">${m}</span>`);
  }

  function searchInPerson(person, keyword) {
    const kw = keyword.toLowerCase();
    const bioText = Array.isArray(person.biography)
      ? person.biography.join(' ')
      : (person.biography || '');
    const fields = {
      person: [person.name || '', person.title || ''],
      time: [person.era || ''],
      event: bioText
    };

    if (currentFilter === 'all') {
      const allText = Object.values(fields).flat().join(' ');
      return allText.toLowerCase().includes(kw);
    }
    return (fields[currentFilter] || []).join(' ').toLowerCase().includes(kw);
  }

  function searchInEvent(event, keyword) {
    const kw = keyword.toLowerCase();
    const fields = {
      event: [event.title, event.summary, event.detail],
      time: [`${event.month}月${event.day}日`, `${event.year}年`, `${event.year}`],
      person: [event.title, event.summary]
    };

    if (currentFilter === 'all') {
      const allText = Object.values(fields).flat().join(' ');
      return allText.toLowerCase().includes(kw);
    }
    return (fields[currentFilter] || []).join(' ').toLowerCase().includes(kw);
  }

  function doSearch(keyword) {
    if (!keyword || !keyword.trim()) {
      searchResults.hidden = true;
      searchEmpty.hidden = false;
      return;
    }

    keyword = keyword.trim();
    lastKeyword = keyword;

    const matchedPersons = HISTORY_PEOPLE.filter(p => searchInPerson(p, keyword));
    const matchedEvents = HISTORY_EVENTS.filter(e => searchInEvent(e, keyword));

    if (matchedPersons.length === 0 && matchedEvents.length === 0) {
      searchEmpty.hidden = false;
      searchResults.hidden = true;
      searchEmpty.innerHTML = `
        <div class="search-empty-icon">🔍</div>
        <div class="search-empty-text">没有找到关于"${escapeHtml(keyword)}"的记录</div>
        <div class="search-tips">
          <span>试试搜索：</span>
          <button class="chip" data-kw="李世民">李世民</button>
          <button class="chip" data-kw="牛顿">牛顿</button>
          <button class="chip" data-kw="改革">改革</button>
        </div>
      `;
      return;
    }

    searchEmpty.hidden = true;
    searchResults.hidden = false;

    let html = '';

    // 人物
    if (matchedPersons.length > 0) {
      html += matchedPersons.map(person => `
        <div class="search-result" data-type="person" data-person-name="${escapeHtml(person.name)}">
          <span class="search-result-type person">人物</span>
          <div class="search-result-title">${highlight(person.name, keyword)}</div>
          <div class="search-result-desc">${highlight(person.title + ' · ' + person.era, keyword)}</div>
          <span class="search-result-hint">点击查看传记</span>
        </div>
      `).join('');
    }

    // 事件
    if (matchedEvents.length > 0) {
      html += matchedEvents.map(event => `
        <div class="search-result" data-type="event" data-event-index="${HISTORY_EVENTS.indexOf(event)}">
          <span class="search-result-type event">事件</span>
          <div class="search-result-title">${highlight(event.title, keyword)}</div>
          <div class="search-result-desc">${highlight(event.summary, keyword)}</div>
          <div class="search-result-meta">${event.year}年 · ${event.month}月${event.day}日 · ${event.type}</div>
          <span class="search-result-hint">点击查看详情</span>
        </div>
      `).join('');
    }

    searchResults.innerHTML = html;
  }

  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    const val = searchInput.value;
    searchClear.hidden = val.length === 0;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => doSearch(val), 200);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.hidden = true;
    doSearch('');
    searchInput.focus();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.type;
      doSearch(searchInput.value);
    });
  });

  function attachChipListeners() {
    // 空函数保留为兼容，实际 chip 点击由全局事件委托处理
  }

  // chip 点击：全局事件委托（搜索页的推荐词）
  document.addEventListener('click', function (e) {
    const chip = e.target.closest('.chip');
    if (chip && chip.dataset.kw) {
      const kw = chip.dataset.kw;
      searchInput.value = kw;
      searchClear.hidden = kw.length === 0;
      doSearch(kw);
    }
  });

  // ============== 弹窗（事件委托方式，确保关闭按钮始终有效） ==============
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');

  function openModal() {
    modal.classList.add('is-open');
  }

  function closeModal() {
    modal.classList.remove('is-open');
    modalBody.scrollTop = 0;
  }

  // 事件委托：整个 modal 内的点击事件统一处理
  // —— 点击遮罩 → 关闭；点击 × → 关闭；点击 panel 内部 → 不处理
  modal.addEventListener('click', function (e) {
    const target = e.target;
    if (target.closest('#modal-close') || target.closest('#modal-mask') || target === modal) {
      e.stopPropagation();
      closeModal();
    }
  });

  // ESC 键也能关闭
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) {
      closeModal();
    }
  });

  // ============================================================
  // 统一事件委托：点击任何卡片（今日事件/人物/搜索结果）都打开详情
  // —— 这种方式比每个元素单独绑定更可靠，不受 DOM 变化影响
  // ============================================================
  document.addEventListener('click', function (e) {
    const target = e.target;

    // 1. 今日页的事件卡片
    const eventCard = target.closest('.event-card');
    if (eventCard) {
      const idx = parseInt(eventCard.dataset.eventIndex, 10);
      if (!isNaN(idx) && HISTORY_EVENTS[idx]) {
        showEventModal(HISTORY_EVENTS[idx]);
        return;
      }
    }

    // 2. 人物页的卡片
    const personCard = target.closest('.person-card');
    if (personCard) {
      const name = personCard.dataset.personName;
      const person = HISTORY_PEOPLE.find(function (p) { return p.name === name; });
      if (person) {
        showPersonModal(person);
        return;
      }
    }

    // 3. 搜索结果卡片
    const searchResult = target.closest('.search-result');
    if (searchResult) {
      const type = searchResult.dataset.type;
      if (type === 'person') {
        const name = searchResult.dataset.personName;
        const person = HISTORY_PEOPLE.find(function (p) { return p.name === name; });
        if (person) showPersonModal(person);
      } else if (type === 'event') {
        const idx = parseInt(searchResult.dataset.eventIndex, 10);
        if (!isNaN(idx) && HISTORY_EVENTS[idx]) {
          showEventModal(HISTORY_EVENTS[idx]);
        }
      }
    }
  });

  function showEventModal(event) {
    modalTitle.textContent = event.title;
    modalBody.innerHTML = `
      <div class="meta-line">
        <span class="modal-tag ${event.type === '中国' ? 'china' : 'world'}">${event.type}</span>
        <span class="modal-tag">${event.year}年</span>
        <span class="modal-tag">${event.month}月${event.day}日</span>
      </div>
      <p>${event.detail}</p>
    `;
    openModal();
  }

  function showPersonModal(person) {
    modalTitle.textContent = person.name;
    const bioHtml = person.biography.map(p => `<p>${escapeHtml(p)}</p>`).join('');
    modalBody.innerHTML = `
      <div class="person-detail-header">
        <div class="person-detail-avatar">${person.name.charAt(0)}</div>
        <div class="person-detail-name">${person.name}</div>
        <div class="person-detail-era">${person.era}</div>
        <div class="person-detail-title">${person.title}</div>
      </div>
      ${bioHtml}
    `;
    openModal();
  }

  // 暴露给外部（供调试）
  window.historyApp = {
    switchPage,
    showEventModal,
    showPersonModal,
    doSearch
  };
})();

</script>
</body>
</html>
