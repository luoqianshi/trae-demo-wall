<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>邻聚 - 业主端登录</title>
<style>
@import 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap';

:root {
  --primary: #C8633E;
  --primary-light: #E8A88E;
  --green: #5E8C7A;
  --gold: #C99A3F;
  --bg: #FBF7F1;
  --bg2: #F2E9DD;
  --bg3: #EFE3D2;
  --white: #FFFFFF;
  --ink: #2B2620;
  --muted: #87796B;
  --muted-light: #B5A99E;
  --rule: #E2D6C6;
  --danger: #D94F4F;
  --success: #4CAF7D;
  --info: #5B9BD5;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(43,38,32,0.08);
  --wx-green: #07C160;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #E8E0D6;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Phone Frame */
.phone-frame {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 44px;
  box-shadow: 0 25px 60px rgba(43,38,32,0.25), 0 0 0 8px #2B2620;
  position: relative;
  overflow: hidden;
}

/* Notch */
.phone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 34px;
  background: #2B2620;
  border-radius: 0 0 20px 20px;
  z-index: 100;
}

/* Screen container */
.screen-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Common screen */
.screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 60px 24px 34px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transition: transform 0.4s cubic-bezier(0.32,0.72,0,1), opacity 0.3s ease;
  opacity: 0;
  pointer-events: none;
  transform: translateX(100%);
  overflow-y: auto;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }

.screen.active {
  opacity: 1;
  pointer-events: all;
  transform: translateX(0);
}

.screen.slide-out-left {
  transform: translateX(-30%);
  opacity: 0;
}

/* Back button */
.back-btn {
  position: absolute;
  top: 52px;
  left: 16px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  z-index: 10;
  color: var(--ink);
}

/* Header title */
.header-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  text-align: center;
  margin-bottom: 24px;
  padding-top: 8px;
}

/* ================= WELCOME SCREEN ================= */
.welcome-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: 40px;
}

.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 48px;
}

.logo-icon {
  width: 96px;
  height: 96px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--gold) 100%);
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(200,99,62,0.25);
}

.logo-icon svg { width: 52px; height: 52px; }

.logo-text {
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 2px;
}

.tagline {
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
  max-width: 280px;
  margin-bottom: 48px;
}

.wx-login-btn {
  width: 100%;
  height: 52px;
  background: var(--wx-green);
  color: #fff;
  border: none;
  border-radius: 28px;
  font-size: 17px;
  font-weight: 500;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 20px;
  box-shadow: 0 4px 12px rgba(7,193,96,0.25);
  transition: transform 0.15s, box-shadow 0.15s;
}
.wx-login-btn:active { transform: scale(0.97); box-shadow: 0 2px 6px rgba(7,193,96,0.2); }

.privacy-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.privacy-wrap a { color: var(--primary); text-decoration: none; }

/* Custom checkbox */
.custom-check {
  width: 20px;
  height: 20px;
  border: 2px solid var(--muted-light);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.custom-check.checked { background: var(--primary); border-color: var(--primary); }
.custom-check svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.2s; }
.custom-check.checked svg { opacity: 1; }

/* ================= PHONE SCREEN ================= */
.phone-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 16px;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.phone-prefix {
  position: absolute;
  left: 16px;
  font-size: 16px;
  color: var(--ink);
  font-weight: 500;
}

.text-input {
  width: 100%;
  height: 52px;
  border: 1.5px solid var(--rule);
  border-radius: var(--radius);
  padding: 0 16px;
  font-size: 16px;
  font-family: inherit;
  color: var(--ink);
  background: var(--white);
  outline: none;
  transition: border-color 0.2s;
}
.text-input:focus { border-color: var(--primary); }
.text-input.phone-input { padding-left: 52px; }

.code-row {
  display: flex;
  gap: 12px;
}
.code-row .text-input { flex: 1; }

.code-btn {
  height: 52px;
  padding: 0 20px;
  background: var(--bg2);
  border: 1.5px solid var(--rule);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  color: var(--primary);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.code-btn:disabled {
  color: var(--muted-light);
  cursor: not-allowed;
}
.code-btn:not(:disabled):active { background: var(--bg3); }

.primary-btn {
  width: 100%;
  height: 52px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 17px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(200,99,62,0.2);
}
.primary-btn:active { transform: scale(0.98); box-shadow: 0 2px 6px rgba(200,99,62,0.15); }
.primary-btn:disabled { background: var(--muted-light); box-shadow: none; cursor: not-allowed; }

/* ================= IDENTITY SCREEN ================= */
.step-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
  padding-top: 8px;
}

.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rule);
  transition: all 0.3s;
}
.step-dot.active { background: var(--primary); width: 24px; border-radius: 4px; }

.step-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.step-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 20px;
}

/* Radio cards */
.radio-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.radio-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 16px;
  background: var(--white);
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
}
.radio-card:active { transform: scale(0.99); }
.radio-card.selected { border-color: var(--primary); background: #FFF8F5; }

.radio-circle {
  width: 22px;
  height: 22px;
  border: 2px solid var(--muted-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.radio-card.selected .radio-circle { border-color: var(--primary); background: var(--primary); }
.radio-circle svg { width: 10px; height: 10px; opacity: 0; }
.radio-card.selected .radio-circle svg { opacity: 1; }

.radio-info { flex: 1; }
.radio-name { font-size: 16px; font-weight: 500; color: var(--ink); }
.radio-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* Grid buttons */
.grid-btns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.grid-btn {
  height: 56px;
  background: var(--white);
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  font-size: 16px;
  font-family: inherit;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.grid-btn:active { transform: scale(0.96); }
.grid-btn.selected { border-color: var(--primary); background: #FFF8F5; color: var(--primary); }

/* Unit + Room grid */
.unit-room-wrap {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.sub-label {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 10px;
}

/* Confirm screen */
.confirm-card {
  background: var(--white);
  border: 1.5px solid var(--rule);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.confirm-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg2);
  font-size: 15px;
}
.confirm-row:last-child { border-bottom: none; }
.confirm-label { color: var(--muted); }
.confirm-value { font-weight: 500; color: var(--ink); }

/* ================= SUCCESS SCREEN ================= */
.success-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: 40px;
}

.checkmark-wrap {
  width: 120px;
  height: 120px;
  margin-bottom: 32px;
  position: relative;
}

.checkmark-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--success) 0%, #3D8B5F 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(76,175,125,0.25);
  animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.checkmark-svg {
  width: 56px;
  height: 56px;
  stroke: #fff;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawCheck 0.4s 0.3s ease forwards;
}

@keyframes drawCheck {
  to { stroke-dashoffset: 0; }
}

.success-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 12px;
  text-align: center;
  opacity: 0;
  animation: fadeUp 0.5s 0.5s ease forwards;
}

.success-subtitle {
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.5s 0.65s ease forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.enter-btn {
  width: 100%;
  height: 52px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 17px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(200,99,62,0.2);
  opacity: 0;
  animation: fadeUp 0.5s 0.8s ease forwards;
  transition: all 0.2s;
}
.enter-btn:active { transform: scale(0.98); }

/* ================= TOAST ================= */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(43,38,32,0.9);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ================= HOUSE BINDING ================= */
.house-card {
  background: var(--bg2);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1.5px solid var(--rule);
  transition: all 0.2s;
}
.house-card:hover { border-color: var(--primary); }
.house-card .house-info { flex: 1; }
.house-card .house-addr { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.house-card .house-role { font-size: 12px; color: var(--muted); }
.house-card .house-badge {
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.house-badge.owner { background: #EBF5EF; color: #5E8C7A; }
.house-badge.tenant { background: #EBF2FA; color: #5B9BD5; }
.house-badge.family { background: #FBF3E3; color: #C99A3F; }
.house-card .house-remove {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--danger-light, #F5DADA);
  color: var(--danger);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-left: 10px;
  font-size: 16px;
}
.secondary-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--primary);
  background: transparent;
  color: var(--primary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}
.secondary-btn:active { transform: scale(0.96); background: rgba(200,99,62,0.05); }
.header-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.form-group { margin-bottom: 12px; }

/* Decorative bottom safe area */
.safe-area {
  height: 20px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="screen-container">

    <!-- ====== WELCOME SCREEN ====== -->
    <div class="screen active" id="screen-welcome">
      <div class="welcome-content">
        <div class="logo-wrap">
          <div class="logo-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 4L6 14v20l18 10 18-10V14L24 4z" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/>
              <path d="M24 24L12 17.5M24 24v13M24 24l12-6.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="24" cy="24" r="3" fill="#fff"/>
            </svg>
          </div>
          <div class="logo-text">邻聚</div>
        </div>
        <p class="tagline">让同住一个小区的人，<br>重新成为彼此生活里的人</p>
        <button class="wx-login-btn" id="wxLoginBtn" onclick="handleWxLogin()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.5 14c-3.6 0-6.5-2.5-6.5-5.5S4.9 3 8.5 3s6.5 2.5 6.5 5.5S12.1 14 8.5 14zm7 7c-2.8 0-5-1.9-5-4.2 0-2.3 2.2-4.3 5-4.3s5 2 5 4.3c0 2.3-2.2 4.2-5 4.2z"/>
          </svg>
          微信一键登录
        </button>
        <div class="privacy-wrap">
          <div class="custom-check" id="privacyCheck" onclick="togglePrivacy()">
            <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"/>
            </svg>
          </div>
          <span>我已阅读并同意<a href="#">《隐私协议》</a>和<a href="#">《用户协议》</a></span>
        </div>
      </div>
    </div>

    <!-- ====== PHONE VERIFY SCREEN ====== -->
    <div class="screen" id="screen-phone">
      <button class="back-btn" onclick="goBack('screen-welcome')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
      <div class="header-title">手机号验证</div>
      <div class="phone-form">
        <div class="input-group">
          <label class="input-label">手机号码</label>
          <div class="input-wrap">
            <span class="phone-prefix">+86</span>
            <input type="tel" class="text-input phone-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" oninput="validatePhone()">
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">验证码</label>
          <div class="code-row">
            <input type="tel" class="text-input" id="codeInput" placeholder="请输入验证码" maxlength="6">
            <button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
          </div>
        </div>
        <button class="primary-btn" id="phoneNextBtn" onclick="goToBinding()">下一步</button>
      </div>
    </div>

    <!-- ====== HOUSE BINDING SCREEN ====== -->
    <div class="screen" id="screen-binding">
      <button class="back-btn" onclick="goBackToPhone()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
      <div class="header-title">绑定房屋</div>
      <div class="header-subtitle">绑定您的房屋信息，支持绑定多套房屋</div>

      <!-- Bound Houses List -->
      <div id="boundHousesList" style="margin-bottom:16px;">
        <div class="empty-bound" style="text-align:center;padding:20px;color:var(--muted);font-size:14px;">
          暂未绑定房屋，请点击下方按钮添加
        </div>
      </div>

      <!-- Add House Button -->
      <button class="secondary-btn" onclick="showAddHouseForm()" style="margin-bottom:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加房屋
      </button>

      <!-- Add House Form (hidden by default) -->
      <div id="addHouseForm" style="display:none;background:var(--bg2);border-radius:14px;padding:16px;margin-bottom:16px;">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px;">添加房屋信息</div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">选择小区</label>
          <select id="bindCommunity" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--rule);font-size:14px;background:var(--bg);">
            <option value="">请选择小区</option>
            <option value="阳光花园">阳光花园</option>
            <option value="翡翠城">翡翠城</option>
            <option value="金色家园">金色家园</option>
          </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">楼栋</label>
            <select id="bindBuilding" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--rule);font-size:14px;background:var(--bg);">
              <option value="">选择楼栋</option>
              <option>1号楼</option><option>2号楼</option><option>3号楼</option><option>4号楼</option><option>5号楼</option>
              <option>6号楼</option><option>7号楼</option><option>8号楼</option><option>9号楼</option><option>10号楼</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">单元</label>
            <select id="bindUnit" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--rule);font-size:14px;background:var(--bg);">
              <option value="">选择单元</option>
              <option>1单元</option><option>2单元</option><option>3单元</option><option>4单元</option>
            </select>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">房号</label>
            <select id="bindRoom" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--rule);font-size:14px;background:var(--bg);">
              <option value="">选择房号</option>
              <option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">身份</label>
            <select id="bindRole" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--rule);font-size:14px;background:var(--bg);">
              <option value="业主">业主（户主）</option>
              <option value="租户">租户</option>
              <option value="家属">家属</option>
            </select>
          </div>
        </div>

        <div style="display:flex;gap:10px;">
          <button class="primary-btn" style="flex:1;" onclick="confirmAddHouse()">确认添加</button>
          <button class="secondary-btn" style="flex:1;" onclick="hideAddHouseForm()">取消</button>
        </div>
      </div>

      <!-- Next Button -->
      <button class="primary-btn" id="bindingNextBtn" onclick="goToIdentity()" style="opacity:0.5;pointer-events:none;">
        下一步 · 业主认证
      </button>
    </div>

    <!-- ====== IDENTITY AUTH SCREEN ====== -->
    <div class="screen" id="screen-identity">
      <button class="back-btn" onclick="identityBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
      <div class="header-title">业主认证</div>

      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
      </div>

      <!-- Step 1: Community -->
      <div class="step-content" id="step1">
        <div class="step-title">请选择您所在的小区</div>
        <div class="radio-cards">
          <div class="radio-card" onclick="selectCommunity(this, '阳光花园')">
            <div class="radio-circle">
              <svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,5 4,8 9,2"/></svg>
            </div>
            <div class="radio-info">
              <div class="radio-name">阳光花园</div>
              <div class="radio-desc">北京市朝阳区 · 1200户</div>
            </div>
          </div>
          <div class="radio-card" onclick="selectCommunity(this, '翡翠城')">
            <div class="radio-circle">
              <svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,5 4,8 9,2"/></svg>
            </div>
            <div class="radio-info">
              <div class="radio-name">翡翠城</div>
              <div class="radio-desc">北京市海淀区 · 860户</div>
            </div>
          </div>
          <div class="radio-card" onclick="selectCommunity(this, '金色家园')">
            <div class="radio-circle">
              <svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,5 4,8 9,2"/></svg>
            </div>
            <div class="radio-info">
              <div class="radio-name">金色家园</div>
              <div class="radio-desc">北京市丰台区 · 650户</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Step 2: Building -->
      <div class="step-content" id="step2" style="display:none;">
        <div class="step-title">请选择楼栋号</div>
        <div class="grid-btns">
          <button class="grid-btn" onclick="selectBuilding(this, '1号楼')">1号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '2号楼')">2号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '3号楼')">3号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '4号楼')">4号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '5号楼')">5号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '6号楼')">6号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '7号楼')">7号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '8号楼')">8号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '9号楼')">9号楼</button>
          <button class="grid-btn" onclick="selectBuilding(this, '10号楼')">10号楼</button>
        </div>
      </div>

      <!-- Step 3: Unit + Room -->
      <div class="step-content" id="step3" style="display:none;">
        <div class="step-title">请选择单元和房号</div>
        <div class="unit-room-wrap">
          <div>
            <div class="sub-label">单元</div>
            <div class="grid-btns" id="unitGrid">
              <button class="grid-btn" onclick="selectUnit(this, '1单元')">1单元</button>
              <button class="grid-btn" onclick="selectUnit(this, '2单元')">2单元</button>
              <button class="grid-btn" onclick="selectUnit(this, '3单元')">3单元</button>
              <button class="grid-btn" onclick="selectUnit(this, '4单元')">4单元</button>
            </div>
          </div>
          <div>
            <div class="sub-label">房号</div>
            <div class="grid-btns" id="roomGrid">
              <button class="grid-btn" onclick="selectRoom(this, '01')">01</button>
              <button class="grid-btn" onclick="selectRoom(this, '02')">02</button>
              <button class="grid-btn" onclick="selectRoom(this, '03')">03</button>
              <button class="grid-btn" onclick="selectRoom(this, '04')">04</button>
              <button class="grid-btn" onclick="selectRoom(this, '05')">05</button>
              <button class="grid-btn" onclick="selectRoom(this, '06')">06</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Step 4: Confirm -->
      <div class="step-content" id="step4" style="display:none;">
        <div class="step-title">确认您的信息</div>
        <div class="confirm-card">
          <div class="confirm-row">
            <span class="confirm-label">所在小区</span>
            <span class="confirm-value" id="confirmCommunity">-</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">楼栋</span>
            <span class="confirm-value" id="confirmBuilding">-</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">单元</span>
            <span class="confirm-value" id="confirmUnit">-</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">房号</span>
            <span class="confirm-value" id="confirmRoom">-</span>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">业主姓名</label>
          <input type="text" class="text-input" id="ownerName" placeholder="请输入您的真实姓名">
        </div>
        <button class="primary-btn" onclick="submitAuth()">提交认证</button>
      </div>

      <div class="safe-area"></div>
    </div>

    <!-- ====== SUCCESS SCREEN ====== -->
    <div class="screen" id="screen-success">
      <div class="success-content">
        <div class="checkmark-wrap">
          <div class="checkmark-circle">
            <svg class="checkmark-svg" viewBox="0 0 24 24">
              <polyline points="5,13 10,18 19,6"/>
            </svg>
          </div>
        </div>
        <div class="success-title">认证成功</div>
        <div class="success-subtitle">欢迎加入阳光花园邻里大家庭！</div>
        <div id="successHousesSummary" style="margin:16px 0;background:var(--bg2);border-radius:12px;padding:14px;text-align:left;">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;">已绑定房屋：</div>
          <div id="successHousesList"></div>
        </div>
        <button class="enter-btn" onclick="enterApp()">进入邻聚</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== State ===== */
let currentScreen = 'screen-welcome';
let currentStep = 1;
let privacyAgreed = false;
let countdown = 0;
let selectedCommunity = '';
let selectedBuilding = '';
let selectedUnit = '';
let selectedRoom = '';

/* ===== Navigation ===== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    if (s.classList.contains('active')) {
      s.classList.add('slide-out-left');
      s.classList.remove('active');
      setTimeout(() => s.classList.remove('slide-out-left'), 400);
    }
  });
  const target = document.getElementById(id);
  target.classList.add('active');
  currentScreen = id;
}

function goBack(toId) {
  showScreen(toId);
}

/* ===== Toast ===== */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ===== Welcome ===== */
function togglePrivacy() {
  privacyAgreed = !privacyAgreed;
  document.getElementById('privacyCheck').classList.toggle('checked', privacyAgreed);
}

function handleWxLogin() {
  if (!privacyAgreed) {
    showToast('请先同意隐私协议');
    return;
  }
  showScreen('screen-phone');
}

/* ===== Phone ===== */
function validatePhone() {
  const val = document.getElementById('phoneInput').value;
  const btn = document.getElementById('phoneNextBtn');
  btn.disabled = !/^1\d{10}$/.test(val);
}

function sendCode() {
  const phone = document.getElementById('phoneInput').value;
  if (!/^1\d{10}$/.test(phone)) {
    showToast('请输入正确的手机号');
    return;
  }
  if (countdown > 0) return;
  countdown = 60;
  const btn = document.getElementById('codeBtn');
  btn.disabled = true;
  btn.textContent = countdown + 's';
  const timer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = countdown + 's';
    }
  }, 1000);
  showToast('验证码已发送');
}

function goToIdentity() {
  showScreen('screen-identity');
  currentStep = 1;
  updateStepIndicator();
  showStep(1);
}

/* ===== Identity Wizard ===== */
function updateStepIndicator() {
  for (let i = 1; i <= 4; i++) {
    document.getElementById('dot' + i).classList.toggle('active', i === currentStep);
  }
}

function showStep(n) {
  for (let i = 1; i <= 4; i++) {
    document.getElementById('step' + i).style.display = i === n ? 'flex' : 'none';
  }
  currentStep = n;
  updateStepIndicator();
}

function identityBack() {
  if (currentStep > 1) {
    showStep(currentStep - 1);
  } else {
    showScreen('screen-binding');
  }
}

function selectCommunity(el, name) {
  document.querySelectorAll('#step1 .radio-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedCommunity = name;
  setTimeout(() => showStep(2), 250);
}

function selectBuilding(el, name) {
  document.querySelectorAll('#step2 .grid-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedBuilding = name;
  setTimeout(() => showStep(3), 250);
}

function selectUnit(el, name) {
  document.querySelectorAll('#unitGrid .grid-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedUnit = name;
  checkStep3Complete();
}

function selectRoom(el, name) {
  document.querySelectorAll('#roomGrid .grid-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedRoom = name;
  checkStep3Complete();
}

function checkStep3Complete() {
  if (selectedUnit && selectedRoom) {
    setTimeout(() => {
      document.getElementById('confirmCommunity').textContent = selectedCommunity;
      document.getElementById('confirmBuilding').textContent = selectedBuilding;
      document.getElementById('confirmUnit').textContent = selectedUnit;
      document.getElementById('confirmRoom').textContent = selectedRoom;
      showStep(4);
    }, 300);
  }
}

function submitAuth() {
  const name = document.getElementById('ownerName').value.trim();
  if (!name) {
    showToast('请输入业主姓名');
    return;
  }
  if (name.length < 2) {
    showToast('姓名至少2个字符');
    return;
  }

  // Populate bound houses summary on success screen
  const summaryList = document.getElementById('successHousesList');
  if (summaryList && boundHouses.length > 0) {
    summaryList.innerHTML = boundHouses.map(h => {
      const roleBadge = h.role === '业主' ? 'tag-success' : h.role === '租户' ? 'tag-info' : 'tag-warn';
      return `<div style="font-size:13px;padding:4px 0;display:flex;align-items:center;gap:8px;">
        <span>${h.addr}</span>
        <span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;${h.role === '业主' ? 'background:#EBF5EF;color:#5E8C7A;' : h.role === '租户' ? 'background:#EBF2FA;color:#5B9BD5;' : 'background:#FBF3E3;color:#C99A3F;'}">${h.role}</span>
      </div>`;
    }).join('');
  } else if (summaryList) {
    summaryList.innerHTML = '<div style="font-size:13px;color:var(--muted);">暂未绑定房屋</div>';
  }

  // Transition to success screen
  showScreen('screen-success');
}

/* ===== Success ===== */
function enterApp() {
  alert('即将进入邻聚首页...');
}

/* ===== Init ===== */
document.getElementById('phoneNextBtn').disabled = true;

// ============ House Binding ============
let boundHouses = [];

function goToBinding() {
  const phone = document.getElementById('phoneInput').value;
  const code = document.getElementById('codeInput').value;

  if (!/^1[3-9]\d{9}$/.test(phone)) {
    showToast('请输入正确的手机号');
    return;
  }
  if (code.length < 4) {
    showToast('请输入验证码');
    return;
  }

  showScreen('screen-binding');
}

function goBackToPhone() {
  showScreen('screen-phone');
}

function showAddHouseForm() {
  document.getElementById('addHouseForm').style.display = 'block';
}
function hideAddHouseForm() {
  document.getElementById('addHouseForm').style.display = 'none';
  // Reset form
  document.getElementById('bindCommunity').value = '';
  document.getElementById('bindBuilding').value = '';
  document.getElementById('bindUnit').value = '';
  document.getElementById('bindRoom').value = '';
  document.getElementById('bindRole').value = '业主';
}

function confirmAddHouse() {
  const community = document.getElementById('bindCommunity').value;
  const building = document.getElementById('bindBuilding').value;
  const unit = document.getElementById('bindUnit').value;
  const room = document.getElementById('bindRoom').value;
  const role = document.getElementById('bindRole').value;

  if (!community || !building || !unit || !room) {
    showToast('请填写完整的房屋信息');
    return;
  }

  // Check duplicate
  const addr = community + ' ' + building + ' ' + unit + ' ' + room;
  if (boundHouses.some(h => h.addr === addr)) {
    showToast('该房屋已绑定，请勿重复添加');
    return;
  }

  boundHouses.push({ community, building, unit, room, role, addr });
  renderBoundHouses();
  hideAddHouseForm();
  showToast('房屋绑定成功！');
}

function renderBoundHouses() {
  const list = document.getElementById('boundHousesList');
  const nextBtn = document.getElementById('bindingNextBtn');

  if (boundHouses.length === 0) {
    list.innerHTML = '<div class="empty-bound" style="text-align:center;padding:20px;color:var(--muted);font-size:14px;">暂未绑定房屋，请点击下方按钮添加</div>';
    nextBtn.style.opacity = '0.5';
    nextBtn.style.pointerEvents = 'none';
    return;
  }

  nextBtn.style.opacity = '1';
  nextBtn.style.pointerEvents = 'auto';

  list.innerHTML = boundHouses.map((h, i) => {
    const roleClass = h.role === '业主' ? 'owner' : h.role === '租户' ? 'tenant' : 'family';
    const roleLabel = h.role === '业主' ? '业主' : h.role === '租户' ? '租户' : '家属';
    return `
      <div class="house-card">
        <div class="house-info">
          <div class="house-addr">${h.addr}</div>
          <div class="house-role"><span class="house-badge ${roleClass}">${roleLabel}</span></div>
        </div>
        <button class="house-remove" onclick="removeHouse(${i})">×</button>
      </div>`;
  }).join('');
}

function removeHouse(index) {
  boundHouses.splice(index, 1);
  renderBoundHouses();
  showToast('已解绑');
}
</script>

</body>
</html>
