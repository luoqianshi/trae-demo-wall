<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收藏夹清道夫 - 让收藏不再吃灰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0f1a;
      --bg2: rgba(30, 41, 59, 0.6);
      --bg3: #334155;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --accent2: #a78bfa;
      --accent2-glow: rgba(167, 139, 250, 0.3);
      --danger: #f87171;
      --success: #34d399;
      --border: rgba(51, 65, 85, 0.6);
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(56,189,248,0.1); }
      50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(56,189,248,0.15); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(167, 139, 250, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
      animation: bgPulse 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* Grid pattern overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .header {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .logo .icon {
      font-size: 1.6rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }
    .logo span {
      background: linear-gradient(135deg, var(--ink) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .stats:hover {
      background: rgba(56, 189, 248, 0.08);
    }
    .stats strong {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 800;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    /* Main */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* Input Section */
    .input-section {
      background: var(--bg2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }
    .input-section:focus-within {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.08), inset 0 1px 0 rgba(56, 189, 248, 0.1);
    }
    .input-section h2 {
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }
    .input-box {
      width: 100%;
      min-height: 130px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: all 0.3s;
      line-height: 1.6;
    }
    .input-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15), 0 0 20px rgba(56, 189, 248, 0.1);
      background: rgba(15, 23, 42, 0.7);
    }
    .input-box::placeholder { color: #475569; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: var(--bg);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.5);
      color: var(--ink);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* Result Preview */
    .result-preview {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: none;
      position: relative;
      overflow: hidden;
    }
    .result-preview.show {
      display: block;
      animation: cardEnter 0.4s ease;
    }
    .result-preview::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 3px; height: 100%;
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
      border-radius: 14px 0 0 14px;
    }
    .result-preview .result-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.6rem;
      color: var(--ink);
      padding-left: 0.5rem;
    }
    .result-preview .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      padding-left: 0.5rem;
    }
    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      cursor: grab;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      user-select: none;
    }
    .tag:active { cursor: grabbing; }
    .tag.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }
    .tag.drag-over {
      border-color: var(--accent);
      border-style: solid;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      transform: scale(1.08);
    }
    .tag:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.2);
    }
    .tag.active {
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: var(--bg);
      border-color: transparent;
      font-weight: 600;
    }
    .tag .remove {
      width: 14px; height: 14px;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag .remove:hover {
      background: var(--danger);
      color: white;
    }
    .add-tag-inline {
      display: inline-flex;
      gap: 0.25rem;
      align-items: center;
      margin-left: 0.3rem;
    }
    .add-tag-inline-input {
      width: 100px;
      padding: 0.15rem 0.4rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px dashed var(--border);
      border-radius: 4px;
      color: var(--ink);
      font-size: 0.7rem;
      outline: none;
      transition: all 0.2s;
    }
    .add-tag-inline-input:focus { border-color: var(--accent); }
    .add-tag-inline-btn {
      width: 20px; height: 20px;
      padding: 0;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
      color: var(--accent);
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .add-tag-inline-btn:hover {
      background: rgba(56, 189, 248, 0.25);
    }
    .result-preview .summary {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
      padding-left: 0.5rem;
    }
    .result-preview .actions {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.6rem;
      padding-left: 0.5rem;
    }

    /* Filter Section */
    .filter-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.6rem;
      background: var(--bg2);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--ink);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.5;
    }
    .filter-tags-wrapper {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex: 1;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .filter-tags-container {
      min-width: 0;
      overflow: hidden;
      flex: 1;
    }
    .filter-tag-nav {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .filter-tag-nav:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .filter-tag-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .filter-tags {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .filter-tags::-webkit-scrollbar {
      display: none;
    }
    .filter-tags .tag {
      flex-shrink: 0;
    }

    /* Knowledge List */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: -0.01em;
      scroll-margin-top: 70px;
    }
    .section-title .count {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
      background: var(--bg2);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .knowledge-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.3;
      animation: float 4s ease-in-out infinite;
    }
    .empty-state h3 {
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .empty-state p { font-size: 0.9rem; }

    /* Card */
    .card {
      background: var(--bg2);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: cardEnter 0.4s ease backwards;
    }
    .card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(56, 189, 248, 0.08);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover::before { opacity: 1; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--ink);
      flex: 1;
      word-break: break-all;
      line-height: 1.4;
    }
    .card-actions {
      display: flex;
      gap: 0.3rem;
      margin-left: 0.5rem;
    }
    .card-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .card-btn:hover {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      transform: scale(1.1);
    }
    .card-btn.delete:hover {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
    }
    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
      align-items: center;
    }
    .card-tags .tag {
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      cursor: default;
    }
    .card-tags .tag .remove {
      width: 14px; height: 14px;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0;
    }
    .card-tags .tag:hover .remove { opacity: 1; }
    .card-tags .tag .remove:hover {
      background: var(--danger);
      color: white;
    }
    .card-inline-add {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .card-inline-add-btn {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .card-inline-add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .card-inline-input {
      width: 90px;
      padding: 0.2rem 0.4rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--ink);
      font-size: 0.72rem;
      outline: none;
    }
    .card-summary {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 0.6rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 0.78rem;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-source {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--bg2);
      backdrop-filter: blur(20px);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.9rem 2rem;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.2);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }
    .modal {
      background: var(--bg2);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      max-width: 640px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.95) translateY(10px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .modal-overlay.show .modal {
      transform: scale(1) translateY(0);
    }
    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
      opacity: 0.5;
    }
    .modal h3 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
      padding-right: 2rem;
    }
    .modal .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal .close-btn:hover {
      background: rgba(248, 113, 113, 0.2);
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.3);
    }
    .modal .modal-tags {
      margin-bottom: 1.25rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .modal .modal-content {
      color: var(--muted);
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: 0.9rem;
      background: rgba(15, 23, 42, 0.5);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--bg3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Theme Switcher */
    .theme-switcher {
      position: relative;
    }
    .theme-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

    .theme-dropdown {
      position: absolute;

    .theme-dropdown.show { display: block; animation: cardEnter 0.2s ease; }
    .theme-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--ink);

    }
    .theme-option:hover { background: rgba(56, 189, 248, 0.1); }
    .theme-option.active { background: rgba(56, 189, 248, 0.15); }
    .theme-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    /* ===== Theme: Ocean (default) ===== */
    :root, body[data-theme="ocean"] {
      --bg: #0b0f1a;
      --bg2: rgba(30, 41, 59, 0.6);
      --bg3: #334155;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --accent2: #a78bfa;
      --accent2-glow: rgba(167, 139, 250, 0.3);
      --danger: #f87171;
      --success: #34d399;
      --border: rgba(51, 65, 85, 0.6);

    /* ===== Theme: Aurora (Purple) ===== */
    body[data-theme="aurora"] {
      --bg: #0f0b1a;
      --bg2: rgba(40, 30, 60, 0.6);
      --bg3: #4a3a6b;
      --ink: #faf8fc;

    }
    body[data-theme="aurora"] body::before {
      background:
        radial-gradient(circle at 20% 30%, rgba(192, 132, 252, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(192, 132, 252, 0.05) 0%, transparent 40%) !important;

    /* ===== Theme: Forest (Green) ===== */
    body[data-theme="forest"] {
      --bg: #0a1a0f;
      --bg2: rgba(30, 50, 40, 0.6);
      --bg3: #3a5a45;

    /* ===== Theme: Sakura (Pink) ===== */
    body[data-theme="sakura"] {

      --bg2: rgba(60, 35, 50, 0.6);
      --bg3: #6b3a55;
      --ink: #fcf0f5;
      --muted: #d4a3b8;
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.3);

      --accent2-glow: rgba(192, 132, 252, 0.3);

    /* Responsive */
    @media (max-width: 640px) {

  </style>
</head>
<body>

<header class="header">
  <div class="logo">
    <span class="icon">🧹</span>
    <span>收藏夹清道夫</span>
  </div>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div class="stats" onclick="scrollToKnowledge()">
      <div>已保存 <strong id="stat-count">0</strong> 条</div>
      <div>标签 <strong id="stat-tags">0</strong> 个</div>
    </div>
    <div class="theme-switcher">
      <button class="theme-btn" onclick="toggleThemeMenu()" title="切换主题">🎨</button>
      <div class="theme-dropdown" id="themeDropdown">
        <div class="theme-option active" data-theme="ocean" onclick="setTheme('ocean')">
          <span class="theme-dot" style="background:linear-gradient(135deg,#38bdf8,#a78bfa)"></span>
          <span>深海蓝</span>
        </div>
        <div class="theme-option" data-theme="aurora" onclick="setTheme('aurora')">
          <span class="theme-dot" style="background:linear-gradient(135deg,#c084fc,#f472b6)"></span>
          <span>极光紫</span>
        </div>
        <div class="theme-option" data-theme="forest" onclick="setTheme('forest')">
          <span class="theme-dot" style="background:linear-gradient(135deg,#34d399,#a3e635)"></span>
          <span>森林绿</span>
        </div>
        <div class="theme-option" data-theme="sunset" onclick="setTheme('sunset')">
          <span class="theme-dot" style="background:linear-gradient(135deg,#fb923c,#f472b6)"></span>
          <span>日落橙</span>
        </div>
        <div class="theme-option" data-theme="sakura" onclick="setTheme('sakura')">
          <span class="theme-dot" style="background:linear-gradient(135deg,#f472b6,#c084fc)"></span>
          <span>樱花粉</span>

      </div>
    </div>
  </div>
</header>

<main class="container">

  <!-- Input -->
  <section class="input-section">
    <h2>📝 粘贴你收藏的内容</h2>
    <textarea class="input-box" id="contentInput" placeholder="把收藏夹里&quot;吃灰&quot;的文章粘贴进来，AI 自动帮你分析摘要和标签。&#10;支持：直接粘贴文章全文、网页链接、笔记片段。"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeContent()">
        🤖 AI 分析
      </button>
      <button class="btn btn-secondary" onclick="addSampleData()">
        📦 加载示例数据
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">
        🗑️ 清空全部
      </button>
    </div>

    <!-- Preview -->
    <div class="result-preview" id="resultPreview">
      <div class="result-title" id="previewTitle">分析结果</div>
      <div class="tags" id="previewTags"></div>

      <div class="actions">
        <button class="btn btn-primary" onclick="saveCurrent()">💾 保存到知识库</button>
        <button class="btn btn-secondary" onclick="cancelPreview()">取消</button>
      </div>
    </div>
  </section>

  <!-- List -->
  <section>
    <div class="section-title" id="knowledgeListAnchor">
      <span>📚 我的知识库</span>
      <span class="count" id="listCount">共 0 条</span>
    </div>

    <!-- Filter -->
    <div class="filter-section" id="filterSection" style="display:none;">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索标题、摘要、标签..." oninput="renderList()">
      </div>
      <div class="filter-tags-wrapper">
        <button class="filter-tag-nav" id="navLeft" onclick="scrollFilterLeft()" disabled>‹</button>
        <div class="filter-tags-container">
          <div class="filter-tags" id="filterTags"></div>
        </div>
        <button class="filter-tag-nav" id="navRight" onclick="scrollFilterRight()" disabled>›</button>
      </div>
    </div>

    <div class="knowledge-list" id="knowledgeList">
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>知识库还是空的</h3>
        <p>在上方粘贴内容，让 AI 帮你整理第一条知识吧</p>
      </div>
    </div>
  </section>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">详情</h3>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script>
// ============ 数据存储 ============
let knowledgeBase = JSON.parse(localStorage.getItem('knowledge_cleaner_db') || '[]');
let currentAnalysis = null;
let activeTagFilter = null;

function saveDB() {
  localStorage.setItem('knowledge_cleaner_db', JSON.stringify(knowledgeBase));
  updateStats();
}

// ============ AI 分析引擎（纯前端模拟） ============
const keywordMap = {
  'AI工具': ['AI', '人工智能', 'ChatGPT', '大模型', 'LLM', '机器学习', '深度学习', '生成式AI', 'AIGC', 'Prompt', 'Copilot'],
  '前端开发': ['前端', 'HTML', 'CSS', 'JavaScript', 'React', 'Vue', 'TypeScript', 'Tailwind', '前端框架', 'DOM', '响应式'],
  '后端开发': ['后端', 'Node.js', 'Python', 'Java', 'Go', '数据库', 'API', '服务器', '微服务', 'Redis', 'MySQL'],
  '效率工具': ['效率', '生产力', '时间管理', '工具推荐', '自动化', '快捷操作', '工作流', 'Notion', 'Obsidian'],
  '职场成长': ['职场', '沟通', '面试', '简历', '领导力', '晋升', '职业规划', '团队协作', '向上管理'],
  '产品设计': ['产品', '设计', 'UI', 'UX', '用户研究', '原型', 'Figma', '交互设计', '用户体验', '产品经理'],
  '内容创作': ['写作', '公众号', '自媒体', '短视频', '文案', '内容运营', '爆款', '选题', '标题'],
  '投资理财': ['投资', '理财', '股票', '基金', '财务自由', '资产配置', '被动收入', '复利'],
  '学习方法': ['学习', '备考', '记忆', '阅读', '笔记', '知识管理', '费曼学习法', '思维模型'],
  '健康生活': ['健康', '健身', '运动', '饮食', '睡眠', '冥想', '心理健康', '自律', '习惯养成'],
  '心理学': ['心理', '焦虑', '情绪', '压力', '认知', '习惯', '拖延', '正念', '积极心理学'],
  '科技趋势': ['科技', '互联网', '创业', '趋势', '数字化', 'Web3', '元宇宙', '区块链', '云计算']
};

function analyzeContent() {
  const input = document.getElementById('contentInput').value.trim();
  if (!input) {
    showToast('请先粘贴一些内容');
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span> 分析中...';

  setTimeout(() => {
    const result = performAnalysis(input);
    currentAnalysis = result;
    showPreview(result);

    btn.disabled = false;
    btn.innerHTML = '🤖 AI 分析';
  }, 900);
}

function performAnalysis(text) {
  const lines = text.split('\n').filter(l => l.trim());
  let title = lines[0]?.trim().slice(0, 40) || text.slice(0, 40);
  if (title.length >= 40) title += '...';

  const summary = generateSummary(text);
  const tags = extractTags(text);

  let source = '文本';
  if (text.startsWith('http')) source = '网页链接';
  else if (text.includes('bilibili.com') || text.includes('b23.tv')) source = 'B站';
  else if (text.includes('zhihu.com')) source = '知乎';
  else if (text.includes('xiaohongshu.com')) source = '小红书';
  else if (text.includes('mp.weixin.qq.com')) source = '公众号';

  return { title, summary, tags, source, fullText: text, date: new Date().toISOString() };
}

function generateSummary(text) {
  const cleanText = text.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
  const sentences = cleanText.split(/[。！？.!?]/).filter(s => s.trim().length > 10);

  if (sentences.length >= 2) {
    const s1 = sentences[0].trim().slice(0, 80);
    const s2 = sentences.find((s, i) => i > 0 && s.trim().length > 15)?.trim().slice(0, 60) || '';
    return s1 + (s2 ? '；' + s2 : '') + '。';
  }

  return cleanText.slice(0, 100) + (cleanText.length > 100 ? '...' : '');
}

function extractTags(text) {
  const scores = {};

  for (const [category, keywords] of Object.entries(keywordMap)) {
    let score = 0;
    for (const kw of keywords) {
      const regex = new RegExp(kw, 'gi');
      const matches = text.match(regex);
      if (matches) score += matches.length;
    }
    if (score > 0) scores[category] = score;
  }

  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([tag]) => tag);
}

// ============ UI 渲染 ============
function showPreview(result) {
  document.getElementById('previewTitle').textContent = result.title;
  document.getElementById('previewSummary').textContent = result.summary;
  renderPreviewTags();
  document.getElementById('resultPreview').classList.add('show');
}

function renderPreviewTags() {
  const tagsContainer = document.getElementById('previewTags');
  if (!currentAnalysis) return;

  let html = '';
  if (currentAnalysis.tags.length === 0) {
    html += '<span class="tag" style="opacity:0.5;cursor:default;">未识别标签</span>';
  } else {
    html += currentAnalysis.tags.map((t, i) =>
      `<span class="tag" draggable="true" data-tag-idx="${i}"
            ondragstart="onTagDragStart(event)" ondragend="onTagDragEnd(event)"
            ondragover="onTagDragOver(event)" ondragleave="onTagDragLeave(event)"
            ondrop="onTagDrop(event,${i})">
        ${escapeHtml(t)}
        <span class="remove" onclick="removeTagFromPreview('${escapeHtml(t)}')">✕</span>
      </span>`
    ).join('');
  }

  // Inline add button
  html += `
    <span class="add-tag-inline" id="addTagInline">
      <input class="add-tag-inline-input" id="addTagInlineInput" placeholder="+ 标签" onkeydown="if(event.key==='Enter'){addTagToPreview();event.preventDefault();}">
      <button class="add-tag-inline-btn" onclick="addTagToPreview()">+</button>
    </span>`;

  tagsContainer.innerHTML = html;
}

// ============ 标签拖拽排序 ============
let dragSrcIdx = null;

function onTagDragStart(e) {
  dragSrcIdx = parseInt(e.target.closest('.tag').dataset.tagIdx);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIdx);
}

function onTagDragEnd(e) {
  e.target.classList.remove('dragging');
  dragSrcIdx = null;
  // Remove all drag-over highlights
  document.querySelectorAll('.tag.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function onTagDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tag = e.target.closest('.tag');
  if (tag && !tag.classList.contains('dragging')) {
    tag.classList.add('drag-over');
  }
}

function onTagDragLeave(e) {
  const tag = e.target.closest('.tag');
  if (tag) tag.classList.remove('drag-over');
}

function onTagDrop(e, targetIdx) {
  e.preventDefault();
  e.target.closest('.tag').classList.remove('drag-over');
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
  if (!currentAnalysis) return;

  // Reorder array
  const tags = currentAnalysis.tags;
  const moved = tags.splice(dragSrcIdx, 1)[0];
  tags.splice(targetIdx, 0, moved);

  renderPreviewTags();
  dragSrcIdx = null;
}

function addTagToPreview() {
  const input = document.getElementById('addTagInlineInput');
  if (!input) return;
  const tag = input.value.trim();
  if (!tag) return;
  if (!currentAnalysis) return;
  if (currentAnalysis.tags.includes(tag)) {
    showToast('标签已存在');
    return;
  }
  if (currentAnalysis.tags.length >= 8) {
    showToast('最多添加 8 个标签');
    return;
  }
  currentAnalysis.tags.push(tag);
  renderPreviewTags();
  // Refocus the new input
  setTimeout(() => {
    const newInput = document.getElementById('addTagInlineInput');
    if (newInput) newInput.focus();
  }, 50);
}

function removeTagFromPreview(tag) {
  if (!currentAnalysis) return;
  currentAnalysis.tags = currentAnalysis.tags.filter(t => t !== tag);
  renderPreviewTags();
}

function cancelPreview() {
  document.getElementById('resultPreview').classList.remove('show');
  currentAnalysis = null;
}

function saveCurrent() {
  if (!currentAnalysis) return;

  knowledgeBase.unshift({
    id: Date.now(),
    ...currentAnalysis
  });

  saveDB();
  renderList();
  renderFilterTags();

  document.getElementById('contentInput').value = '';
  cancelPreview();
  showToast('✅ 已保存到知识库');
}

function renderList() {
  const list = document.getElementById('knowledgeList');
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = knowledgeBase;

  if (search) {
    filtered = filtered.filter(item =>
      item.title.toLowerCase().includes(search) ||
      item.summary.toLowerCase().includes(search) ||
      item.tags.some(t => t.toLowerCase().includes(search))
    );
  }

  if (activeTagFilter) {
    filtered = filtered.filter(item => item.tags.includes(activeTagFilter));
  }

  document.getElementById('listCount').textContent = `共 ${filtered.length} 条`;

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>没有找到匹配的内容</h3>
        <p>试试其他搜索词或标签</p>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map((item, index) => `
    <div class="card" data-id="${item.id}" style="animation-delay: ${index * 0.05}s">
      <div class="card-header">
        <div class="card-title">${escapeHtml(item.title)}</div>
        <div class="card-actions">
          <button class="card-btn" onclick="viewDetail(${item.id})" title="查看详情">👁</button>
          <button class="card-btn delete" onclick="deleteItem(${item.id})" title="删除">🗑</button>
        </div>
      </div>
      <div class="card-tags">
        ${item.tags.map((t, idx) => `<span class="tag" draggable="true" data-global-idx="${idx}" 
          ondragstart="onCardTagDragStart(event, ${item.id})" ondragend="onCardTagDragEnd(event)"
          ondragover="onCardTagDragOver(event)" ondragleave="onCardTagDragLeave(event)"
          ondrop="onCardTagDrop(event, ${item.id}, ${idx})">
          ${escapeHtml(t)}
          <span class="remove" onclick="removeTagFromCard(${item.id},'${escapeHtml(t)}')">✕</span>
        </span>`).join('')}
        <span class="card-inline-add" id="inlineAdd_${item.id}">
          <button class="card-inline-add-btn" onclick="showInlineInput(${item.id})" title="添加标签">+</button>
        </span>
      </div>
      <div class="card-summary">${escapeHtml(item.summary)}</div>
      <div class="card-meta">
        <span class="card-source">📎 ${item.source}</span>
        <span>${formatDate(item.date)}</span>
      </div>
    </div>
  `).join('');
}

function renderFilterTags() {
  const allTags = new Set();
  knowledgeBase.forEach(item => item.tags.forEach(t => allTags.add(t)));

  const container = document.getElementById('filterTags');
  if (allTags.size === 0) {
    container.innerHTML = '';
    return;
  }

  // 保持已有排序，新标签追加到末尾
  const savedOrder = JSON.parse(localStorage.getItem('knowledge_cleaner_filter_order') || '[]');
  const ordered = [];
  savedOrder.forEach(t => { if (allTags.has(t)) { ordered.push(t); allTags.delete(t); } });
  allTags.forEach(t => ordered.push(t));

  // 保存当前顺序
  localStorage.setItem('knowledge_cleaner_filter_order', JSON.stringify(ordered));

  container.innerHTML = ordered.map((tag, idx) =>
    `<span class="tag ${activeTagFilter === tag ? 'active' : ''}" draggable="true"
          data-filter-idx="${idx}" onclick="toggleTagFilter('${tag}')"
          ondragstart="onFilterTagDragStart(event)" ondragend="onFilterTagDragEnd(event)"
          ondragover="onFilterTagDragOver(event)" ondragleave="onFilterTagDragLeave(event)"
          ondrop="onFilterTagDrop(event,${idx})">${escapeHtml(tag)}</span>`
  ).join('');

  setTimeout(updateNavButtons, 50);
}

// --- 筛选标签拖拽排序 ---
let filterDragSrcIdx = null;

function onFilterTagDragStart(e) {
  filterDragSrcIdx = parseInt(e.target.closest('.tag').dataset.filterIdx);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onFilterTagDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('#filterTags .tag.drag-over').forEach(el => el.classList.remove('drag-over'));
  filterDragSrcIdx = null;
}
function onFilterTagDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tag = e.target.closest('.tag');
  if (tag && !tag.classList.contains('dragging')) tag.classList.add('drag-over');
}
function onFilterTagDragLeave(e) {
  const tag = e.target.closest('.tag');
  if (tag) tag.classList.remove('drag-over');
}
function onFilterTagDrop(e, targetIdx) {
  e.preventDefault();
  e.target.closest('.tag').classList.remove('drag-over');
  if (filterDragSrcIdx === null || filterDragSrcIdx === targetIdx) return;

  const savedOrder = JSON.parse(localStorage.getItem('knowledge_cleaner_filter_order') || '[]');
  const tags = savedOrder.length ? savedOrder : Array.from(new Set(knowledgeBase.flatMap(i => i.tags)));
  const moved = tags.splice(filterDragSrcIdx, 1)[0];
  tags.splice(targetIdx, 0, moved);
  localStorage.setItem('knowledge_cleaner_filter_order', JSON.stringify(tags));

  renderFilterTags();
  filterDragSrcIdx = null;
}

function toggleTagFilter(tag) {
  activeTagFilter = activeTagFilter === tag ? null : tag;
  renderFilterTags();
  renderList();
}

// ============ 筛选标签左右箭头滚动 ============
function scrollFilterLeft() {
  const container = document.getElementById('filterTags');
  if (!container) return;
  container.scrollBy({ left: -250, behavior: 'smooth' });
  setTimeout(updateNavButtons, 350);
}

function scrollFilterRight() {
  const container = document.getElementById('filterTags');
  if (!container) return;
  container.scrollBy({ left: 250, behavior: 'smooth' });
  setTimeout(updateNavButtons, 350);
}

function updateNavButtons() {
  const container = document.getElementById('filterTags');
  const leftBtn = document.getElementById('navLeft');
  const rightBtn = document.getElementById('navRight');
  if (!container || !leftBtn || !rightBtn) return;

  const canScrollLeft = container.scrollLeft > 1;
  const canScrollRight = container.scrollLeft + container.clientWidth < container.scrollWidth - 1;

  leftBtn.disabled = !canScrollLeft;
  rightBtn.disabled = !canScrollRight;
}

// ============ 操作 ============
function deleteItem(id) {
  if (!confirm('确定要删除这条知识吗？')) return;
  knowledgeBase = knowledgeBase.filter(item => item.id !== id);
  saveDB();
  renderList();
  renderFilterTags();
  showToast('已删除');
}

function viewDetail(id) {
  const item = knowledgeBase.find(i => i.id === id);
  if (!item) return;

  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalTags').innerHTML = item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  document.getElementById('modalContent').textContent = item.fullText;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function clearAll() {
  if (!knowledgeBase.length) return;
  if (!confirm('确定要清空所有知识吗？此操作不可恢复。')) return;
  knowledgeBase = [];
  saveDB();
  renderList();
  renderFilterTags();
  showToast('知识库已清空');
}

// ============ 工具函数 ============
function updateStats() {
  document.getElementById('stat-count').textContent = knowledgeBase.length;
  const allTags = new Set();
  knowledgeBase.forEach(item => item.tags.forEach(t => allTags.add(t)));
  document.getElementById('stat-tags').textContent = allTags.size;

    document.getElementById('filterSection').style.display = 'flex';
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;

  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
  if (diff < 604800000) return `${Math.floor(diff / 86400000)}天前`;

  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

// ============ 主题切换 ============
function toggleThemeMenu() {

  dropdown.classList.toggle('show');
}

function setTheme(themeName) {
  document.body.setAttribute('data-theme', themeName);
  localStorage.setItem('knowledge_cleaner_theme', themeName);

  // Update active state in dropdown
  document.querySelectorAll('.theme-option').forEach(opt => {

  });

function initTheme() {
  const saved = localStorage.getItem('knowledge_cleaner_theme') || 'ocean';

  document.querySelectorAll('.theme-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.theme === saved);

document.addEventListener('click', (e) => {

    document.getElementById('themeDropdown').classList.remove('show');
  }
});

// ============ 知识库标签编辑 ============

// --- 卡片标签拖拽排序 ---
let cardDragItemId = null;
let cardDragSrcIdx = null;

function onCardTagDragStart(e, itemId) {
  cardDragItemId = itemId;
  cardDragSrcIdx = parseInt(e.target.closest('.tag').dataset.globalIdx);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onCardTagDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.tag.drag-over').forEach(el => el.classList.remove('drag-over'));
  cardDragItemId = null;
  cardDragSrcIdx = null;
}

function onCardTagDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tag = e.target.closest('.tag');
  if (tag && !tag.classList.contains('dragging')) {
    tag.classList.add('drag-over');
  }
}

function onCardTagDragLeave(e) {
  const tag = e.target.closest('.tag');
  if (tag) tag.classList.remove('drag-over');
}

function onCardTagDrop(e, itemId, targetIdx) {
  e.preventDefault();
  e.target.closest('.tag').classList.remove('drag-over');
  if (cardDragSrcIdx === null || cardDragSrcIdx === targetIdx) return;
  if (cardDragItemId !== itemId) return; // Don't drag between cards

  const item = knowledgeBase.find(i => i.id === itemId);
  if (!item) return;
  const moved = item.tags.splice(cardDragSrcIdx, 1)[0];
  item.tags.splice(targetIdx, 0, moved);

  saveDB();
  renderList();
  renderFilterTags();
  cardDragSrcIdx = null;
}

function removeTagFromCard(itemId, tag) {
  const item = knowledgeBase.find(i => i.id === itemId);
  if (!item) return;
  item.tags = item.tags.filter(t => t !== tag);
  saveDB();
  renderList();
  renderFilterTags();
  showToast('已删除标签');
}

function showInlineInput(itemId) {
  const container = document.getElementById(`inlineAdd_${itemId}`);
  // 已经显示输入框了？
  if (container.querySelector('.card-inline-input')) return;

  container.innerHTML = `
    <input class="card-inline-input" id="inlineInput_${itemId}" placeholder="标签名" onkeydown="if(event.key==='Enter'){addTagToCard(${itemId});event.preventDefault();}">
  `;
  const input = document.getElementById(`inlineInput_${itemId}`);
  input.focus();
}

function addTagToCard(itemId) {
  const item = knowledgeBase.find(i => i.id === itemId);
  if (!item) return;
  const input = document.getElementById(`inlineInput_${itemId}`);
  const tag = input.value.trim();
  if (!tag) return;
  if (item.tags.includes(tag)) {
    showToast('标签已存在');
    return;
  }
  if (item.tags.length >= 8) {
    showToast('最多添加 8 个标签');
    return;
  }
  item.tags.push(tag);
  saveDB();
  renderList();
  renderFilterTags();
  showToast('已添加标签');
}
