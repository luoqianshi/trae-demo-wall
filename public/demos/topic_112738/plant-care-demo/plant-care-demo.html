        description: '琴叶榕叶片像小提琴，造型优雅，是网红家居绿植。',
        tips: ['避免频繁移动位置', '叶片定期喷水保湿', '冬季减少浇水']
      },
      'snake': {
        name: '虎皮兰',
        emoji: '&#127797;',
        scientific: 'Sansevieria trifasciata',
        difficulty: '极简',
        water: '每 2-3 周 1 次',
        light: '耐阴耐晒',
        temp: '10-35°C',
        humidity: '30-60%',
        fertilizer: '每 3 月 1 次',
        description: '虎皮兰耐旱耐阴，夜间释放氧气，是卧室绿植的理想选择。',
        tips: ['极度耐旱，少浇水', '适应性强，光照要求低', '分株繁殖简单']
      },
      'peace': {
        name: '白掌',
        emoji: '&#127800;',
        scientific: 'Spathiphyllum',
        difficulty: '简单',
        water: '每周 1-2 次',
        light: '散射光',
        temp: '18-28°C',
        humidity: '50-80%',
        fertilizer: '每月 1 次',
        description: '白掌花朵洁白优雅，寓意一帆风顺，还能有效净化空气中的甲醛。',
        tips: ['保持土壤湿润', '花期适当补充磷肥', '注意通风防红蜘蛛']
      }
    };

    const diagnosisDB = {
      'yellow': {
        symptom: '叶片发黄',
        emoji: '&#128993;',
        causes: ['浇水过多导致根部缺氧', '缺乏氮肥', '光照不足'],
        solutions: ['检查土壤湿度，等表层干透再浇水', '适当补充含氮肥料', '移至光线更明亮的位置']
      },
      'wilt': {
        symptom: '叶片萎蔫',
        emoji: '&#129313;',
        causes: ['缺水严重', '根部受损', '环境温度过高'],
        solutions: ['立即浇透水，保持土壤湿润', '检查根部是否腐烂，必要时换盆', '移至阴凉通风处']
      },
      'brown': {
        symptom: '叶尖焦枯',
        emoji: '&#129001;',
        causes: ['空气湿度过低', '施肥过量烧伤', '水质过硬含氯'],
        solutions: ['增加环境湿度，可喷雾或放加湿器旁', '稀释肥料浓度，减少施肥频率', '使用静置 24 小时的自来水或雨水']
      },
      'spot': {
        symptom: '叶片长斑',
        emoji: '&#128995;',
        causes: ['真菌感染', '细菌感染', '虫害叮咬'],
        solutions: ['剪除病叶，避免扩散', '喷洒多菌灵或百菌清', '改善通风，避免叶片长期潮湿']
      },
      'drop': {
        symptom: '落叶掉叶',
        emoji: '&#127810;',
        causes: ['环境突变（温度/光照）', '浇水不当', '自然新陈代谢'],
        solutions: ['避免频繁移动植物位置', '保持稳定的浇水节奏', '老叶自然脱落属正常现象，无需担心']
      },
      'pest': {
        symptom: '发现虫害',
        emoji: '&#128027;',
        causes: ['红蜘蛛', '蚜虫', '介壳虫'],
        solutions: ['用湿布擦拭叶片去除虫体', '喷洒肥皂水或专用杀虫剂', '隔离病株，防止传染其他植物']
      }
    };

    // ========== State ==========
    let myGarden = JSON.parse(localStorage.getItem('myGarden') || '[]');
    let currentPlant = null;

    // ========== Init ==========
    document.addEventListener('DOMContentLoaded', () => {
      renderCommonPlants();
      renderGarden();
      renderCarePlan();
      renderDiagnosisOptions();
      updateHeaderStats();

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
      });
    });

    // ========== Common Plants ==========
    function renderCommonPlants() {
      const grid = document.getElementById('commonPlants');
      grid.innerHTML = Object.entries(plantDB).map(([key, plant]) => `
        <div class="plant-item" onclick="selectPlant('${key}')">
          <div class="plant-emoji">${plant.emoji}</div>
          <div class="plant-name">${plant.name}</div>
          <div class="plant-desc">${plant.difficulty} · ${plant.water}</div>
        </div>
      `).join('');
    }

    // ========== File Upload ==========
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      showLoading('AI 正在分析照片...');

      const reader = new FileReader();
      reader.onload = function(e) {
        setTimeout(() => {
          hideLoading();
          // Simulate AI recognition - randomly pick a plant
          const keys = Object.keys(plantDB);
          const randomKey = keys[Math.floor(Math.random() * keys.length)];
          showScanResult(randomKey, e.target.result);
        }, 2000);
      };
      reader.readAsDataURL(file);
    }

    // ========== Select Plant ==========
    function selectPlant(key) {
      showLoading('AI 正在识别...');
      setTimeout(() => {
        hideLoading();
        showScanResult(key);
      }, 1500);
    }

    // ========== Show Scan Result ==========
    function showScanResult(key, imgSrc) {
      const plant = plantDB[key];
      currentPlant = { key, ...plant, addedDate: new Date().toISOString() };

      const resultHTML = `
        <div class="result-card">
          <div class="result-header">
            <div class="result-emoji">${plant.emoji}</div>
            <div class="result-info">
              <h3>${plant.name}</h3>
              <p>${plant.scientific} · 养护难度：${plant.difficulty}</p>
            </div>
          </div>
          ${imgSrc ? `<img src="${imgSrc}" class="preview-img" alt="植物照片">` : ''}
          <div class="care-tags">
            <span class="care-tag">&#128167; ${plant.water}</span>
            <span class="care-tag yellow">&#9728; ${plant.light}</span>
            <span class="care-tag">&#127777; ${plant.temp}</span>
          </div>
          <p style="margin-top:1rem; font-size:0.9rem;">${plant.description}</p>
          <button class="btn btn-primary" style="margin-top:1rem;" onclick="addToGarden('${key}')">
            &#10133; 添加到我的花园
          </button>
        </div>
      `;
      document.getElementById('scanResult').innerHTML = resultHTML;
    }

    // ========== Add to Garden ==========
    function addToGarden(key) {
      if (myGarden.some(p => p.key === key)) {
        showToast('该植物已在花园中');
        return;
      }
      const plant = plantDB[key];
      myGarden.push({
        key,
        name: plant.name,
        emoji: plant.emoji,
        addedDate: new Date().toISOString(),
        lastWatered: new Date().toISOString(),
        health: 'good'
      });
      saveGarden();
      showToast(`已添加 ${plant.name} 到花园`);
      updateHeaderStats();

      // Switch to garden tab
      document.querySelector('[data-tab="garden"]').click();
    }

    // ========== Garden ==========
    function renderGarden() {
      const list = document.getElementById('gardenList');
      const empty = document.getElementById('gardenEmpty');

      if (myGarden.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      list.innerHTML = myGarden.map((plant, index) => {
        const dbPlant = plantDB[plant.key];
        const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);
        const waterFreq = dbPlant.water.includes('2 周') ? 14 : dbPlant.water.includes('2-3 周') ? 21 : 7;
        const needWater = daysSinceWater >= waterFreq;

        return `
          <div class="garden-plant" onclick="showPlantDetail(${index})">
            <div class="garden-emoji">${plant.emoji}</div>
            <div class="garden-info">
              <h4>${plant.name}</h4>
              <p>${needWater ? '&#128167; 该浇水了' : `&#9989; ${daysSinceWater}天前浇过水`} · ${dbPlant.light}</p>
            </div>
            <div class="garden-health ${plant.health}">
              ${plant.health === 'good' ? '&#128154;' : plant.health === 'warn' ? '&#128993;' : '&#128308;'}
            </div>
          </div>
        `;
      }).join('');
    }

    function showPlantDetail(index) {
      const plant = myGarden[index];
      const dbPlant = plantDB[plant.key];
      const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);

      document.getElementById('modalTitle').textContent = plant.name;
      document.getElementById('modalBody').innerHTML = `
        <div style="text-align:center; margin-bottom:1rem;">
          <div style="font-size:4rem;">${plant.emoji}</div>
          <p style="color:var(--muted); font-size:0.85rem;">${dbPlant.scientific}</p>
        </div>
        <div class="care-plan-item">
          <div class="care-plan-icon">&#128167;</div>
          <div class="care-plan-text">
            <div class="label">浇水频率</div>
            <div class="value">${dbPlant.water}</div>
          </div>
          <div class="care-plan-status ${daysSinceWater > 7 ? 'warn' : 'ok'}">${daysSinceWater}天前</div>
        </div>
        <div class="care-plan-item">
          <div class="care-plan-icon">&#9728;</div>
          <div class="care-plan-text">
            <div class="label">光照需求</div>
            <div class="value">${dbPlant.light}</div>
          </div>
        </div>
        <div class="care-plan-item">
          <div class="care-plan-icon">&#127777;</div>
          <div class="care-plan-text">
            <div class="label">适宜温度</div>
            <div class="value">${dbPlant.temp}</div>
          </div>
        </div>
        <div class="care-plan-item">
          <div class="care-plan-icon">&#127811;</div>
          <div class="care-plan-text">
            <div class="label">施肥周期</div>
            <div class="value">${dbPlant.fertilizer}</div>
          </div>
        </div>
        <div style="margin-top:1rem;">
          <h4 style="font-size:0.9rem; margin-bottom:0.5rem;">&#128161; 养护小贴士</h4>
          ${dbPlant.tips.map(tip => `<p style="font-size:0.85rem; color:var(--muted); padding:0.2rem 0;">&#8226; ${tip}</p>`).join('')}
        </div>
        <button class="btn btn-primary" style="margin-top:1rem;" onclick="waterPlant(${index})">
          &#128167; 标记已浇水
        </button>
        <button class="btn btn-secondary" style="margin-top:0.5rem;" onclick="removePlant(${index})">
          &#128465; 移除植物
        </button>
      `;
      document.getElementById('plantModal').classList.add('active');
    }

    function waterPlant(index) {
      myGarden[index].lastWatered = new Date().toISOString();
      saveGarden();
      showToast('已标记浇水');
      closeModal();
      renderGarden();
      renderCarePlan();
      updateHeaderStats();
    }

    function removePlant(index) {
      if (confirm('确定要移除这盆植物吗？')) {
        myGarden.splice(index, 1);
        saveGarden();
        showToast('已移除植物');
        closeModal();
        renderGarden();
        renderCarePlan();
        updateHeaderStats();
      }
    }

    // ========== Care Plan ==========
    function renderCarePlan() {
      const content = document.getElementById('careContent');
      const empty = document.getElementById('careEmpty');

      if (myGarden.length === 0) {
        content.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      const today = new Date();
      const tasks = [];

      myGarden.forEach((plant, index) => {
        const dbPlant = plantDB[plant.key];
        const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);
        const waterFreq = dbPlant.water.includes('2 周') ? 14 : dbPlant.water.includes('2-3 周') ? 21 : 7;
        const needWater = daysSinceWater >= waterFreq;

        if (needWater) {
          tasks.push({
            type: 'water',
            plant: plant.name,
            emoji: plant.emoji,
            desc: `已 ${daysSinceWater} 天未浇水，建议立即浇水`,
            urgent: daysSinceWater >= waterFreq + 3,
            index
          });
        }

        // Check if needs fertilizer (simplified: every 30 days)
        const daysSinceAdded = Math.floor((Date.now() - new Date(plant.addedDate).getTime()) / 86400000);
        if (daysSinceAdded % 30 === 0 && daysSinceAdded > 0) {
          tasks.push({
            type: 'fertilize',
            plant: plant.name,
            emoji: plant.emoji,
            desc: '该施肥了，建议补充适量肥料',
            urgent: false,
            index
          });
        }
      });

      if (tasks.length === 0) {
        content.innerHTML = `
          <div class="card">
            <div style="text-align:center; padding:2rem;">
              <div style="font-size:3rem;">&#9989;</div>
              <p style="color:var(--muted); margin-top:0.5rem;">今日养护任务已完成<br>你的植物们都很健康！</p>
            </div>
          </div>
        `;
        return;
      }

      content.innerHTML = `
        <div class="card">
          <div class="card-title">&#128197; 今日养护任务 (${tasks.length})</div>
          ${tasks.map(task => `
            <div class="care-plan-item">
              <div class="care-plan-icon">${task.emoji}</div>
              <div class="care-plan-text">
                <div class="label">${task.plant} ${task.type === 'water' ? '需要浇水' : '需要施肥'}</div>
                <div class="value">${task.desc}</div>
              </div>
              <button class="btn btn-primary" style="width:auto; padding:0.5rem 1rem; font-size:0.8rem;"
                onclick="waterPlant(${task.index})">
                完成
              </button>
            </div>
          `).join('')}
        </div>
        <div class="card">
          <div class="card-title">&#128200; 本周养护概览</div>
          ${myGarden.map(plant => {
            const dbPlant = plantDB[plant.key];
            const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);
            const waterFreq = dbPlant.water.includes('2 周') ? 14 : dbPlant.water.includes('2-3 周') ? 21 : 7;
            const progress = Math.min(100, (daysSinceWater / waterFreq) * 100);
            return `
              <div style="margin-bottom:1rem;">
                <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                  <span>${plant.emoji} ${plant.name}</span>
                  <span style="color:var(--muted);">${daysSinceWater}/${waterFreq} 天</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width:${progress}%; background:${progress > 80 ? 'var(--danger)' : progress > 50 ? 'var(--accent2)' : 'var(--accent)'}"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // ========== Diagnosis ==========
    function renderDiagnosisOptions() {
      const container = document.getElementById('diagnosisOptions');
      container.innerHTML = Object.entries(diagnosisDB).map(([key, diag]) => `
        <button class="diagnosis-btn" onclick="diagnose('${key}')">
          <span class="emoji">${diag.emoji}</span>
          <span>${diag.symptom}</span>
        </button>
      `).join('');
    }

    function diagnose(key) {
      showLoading('AI 正在分析症状...');
      setTimeout(() => {
        hideLoading();
        const diag = diagnosisDB[key];
        document.getElementById('diagnosisResult').innerHTML = `
          <div class="diagnosis-result">
            <h4>${diag.emoji} 诊断结果：${diag.symptom}</h4>
            <p><strong>可能原因：</strong></p>
            <ul style="margin-left:1rem; margin-bottom:1rem;">
              ${diag.causes.map(c => `<li style="font-size:0.9rem; padding:0.2rem 0;">${c}</li>`).join('')}
            </ul>
            <div class="solution">
              <h5>&#128161; 救治方案</h5>
              <ul>
                ${diag.solutions.map(s => `<li>${s}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }, 1500);
    }

    // ========== Utilities ==========
    function saveGarden() {
      localStorage.setItem('myGarden', JSON.stringify(myGarden));
    }

    function updateHeaderStats() {
      document.getElementById('plantCount').textContent = myGarden.length;

      let tasks = 0;
      myGarden.forEach(plant => {
        const dbPlant = plantDB[plant.key];
        const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);
        const waterFreq = dbPlant.water.includes('2 周') ? 14 : dbPlant.water.includes('2-3 周') ? 21 : 7;
        if (daysSinceWater >= waterFreq) tasks++;
      });
      document.getElementById('todayTasks').textContent = tasks;

      let healthScore = 100;
      myGarden.forEach(plant => {
        const dbPlant = plantDB[plant.key];
        const daysSinceWater = Math.floor((Date.now() - new Date(plant.lastWatered).getTime()) / 86400000);
        const waterFreq = dbPlant.water.includes('2 周') ? 14 : dbPlant.water.includes('2-3 周') ? 21 : 7;
        if (daysSinceWater > waterFreq + 3) healthScore -= 15;
        else if (daysSinceWater > waterFreq) healthScore -= 5;
      });
      document.getElementById('healthScore').textContent = Math.max(0, healthScore);
    }

    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function closeModal() {
      document.getElementById('plantModal').classList.remove('active');
    }

    // Close modal on overlay click
    document.getElementById('plantModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('plantModal')) closeModal();
    });
  </script>
</body>
</html>
