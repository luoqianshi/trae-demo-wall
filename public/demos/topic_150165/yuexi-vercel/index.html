function getLastExchange(history) {
  const userIdx = history.map((m, i) => m.role === 'user' ? i : -1).filter(i => i >= 0).pop();
  const aiIdx = userIdx !== undefined ? history.findIndex((m, i) => i > userIdx && m.role === 'ai') : -1;
  return {
    user: userIdx >= 0 ? history[userIdx] : null,
    ai: aiIdx >= 0 ? history[aiIdx] : null
  };
}

function setupVoiceInput(btn, textarea) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    btn.style.display = 'none';
    return;
  }
  let recognition = null;
  let isRecording = false;

  const startRecording = () => {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { isRecording = true; btn.classList.add('recording'); showToast('正在听...'); };
    recognition.onresult = (event) => {
      let final = '', interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) { final += transcript; } else { interim += transcript; }
      }
      const current = textarea.value;
      const base = current.replace(/…$/, '');
      if (final) { textarea.value = base + final; } else if (interim) { textarea.value = base + interim + '…'; }
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    };
    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') showToast('请允许麦克风权限');
      else if (event.error === 'no-speech') showToast('没有检测到语音');
      else showToast('语音识别出错');
      stopRecording();
    };
    recognition.onend = () => { stopRecording(); };
    try { recognition.start(); } catch (e) { showToast('无法启动语音识别'); }
  };

  const stopRecording = () => {
    isRecording = false;
    btn.classList.remove('recording');
    if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
    if (textarea.value.endsWith('…')) { textarea.value = textarea.value.slice(0, -1); }
  };

  btn.onclick = () => {
    if (isRecording) { stopRecording(); } else { startRecording(); }
  };
}

async function handleUserMessage(text, messagesArea, inputSection) {
  const state = getState();

  // Add user message
  const userMsg = { role: 'user', content: text, time: Date.now() };
  setState({ chatHistory: [...state.chatHistory, userMsg] });

  // Hide IP section if present
  const ipSection = messagesArea.querySelector('.ip-section');
  if (ipSection) ipSection.remove();

  // Hide suggestions
  const suggestions = inputSection.querySelector('#chat-suggestions');
  if (suggestions) suggestions.style.display = 'none';

  // Render user message
  messagesArea.appendChild(renderChatMessage(userMsg));
  messagesArea.scrollTop = messagesArea.scrollHeight;

  // Show typing indicator
  const typingDiv = document.createElement('div');
  typingDiv.className = 'chat-msg ai';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = `
    <div class="chat-msg-avatar ai-av">月</div>
    <div class="chat-msg-bubble">${renderTypingCard()}</div>
  `;
  messagesArea.appendChild(typingDiv);
  messagesArea.scrollTop = messagesArea.scrollHeight;

  try {
    const result = await runDiagnosisPipeline(text, 3);
    typingDiv.remove();

    const aiMsg = {
      role: 'ai',
      content: { diagnosis: result.diagnosis, plan: result.plan, phaseName: result.phase },
      time: Date.now()
    };
    setState({ chatHistory: [...getState().chatHistory, aiMsg] });
    messagesArea.appendChild(renderChatMessage(aiMsg));
    messagesArea.scrollTop = messagesArea.scrollHeight;
  } catch (e) {
    typingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'chat-msg ai';
    errDiv.innerHTML = `
      <div class="chat-msg-avatar ai-av">月</div>
      <div class="chat-msg-bubble">
        <div class="ai-reply-card">
          <div class="ai-card-section" style="text-align:center;color:var(--color-ink-light);padding:var(--space-lg);">
            分析出现问题，请重试
          </div>
        </div>
      </div>
    `;
    messagesArea.appendChild(errDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    showToast('分析失败，请重试');
    console.error(e);
  }
}

          <div class="card-title" style="font-size: 1.125rem; line-height: 1.6;">${escapeHtml(q.text)}</div>
        </div>
      </div>

      <div class="radio-group" style="margin-bottom: var(--space-lg);">
        ${options.map(opt => `
          <div class="radio-option ${selectedScore === opt.score ? 'selected' : ''}" data-score="${opt.score}">
            <div class="radio-indicator"></div>
            <span>${opt.label}</span>
          </div>
        `).join('')}
      </div>

      <div style="display:flex; gap: var(--space-sm);">
        ${currentIndex > 0 ? `<button class="btn btn-ghost" id="quiz-prev">上一题</button>` : '<div></div>'}
        <button class="btn btn-primary btn-block" id="quiz-next" ${selectedScore ? '' : 'disabled'}>${currentIndex === total - 1 ? '查看结果' : '下一题'}</button>
      </div>
    `;

    el.querySelectorAll('.radio-option').forEach(opt => {
      opt.onclick = () => {
        answers[currentIndex] = parseInt(opt.dataset.score);
        renderQuestion();
      };
    });

    const prevBtn = el.querySelector('#quiz-prev');
    if (prevBtn) {
      prevBtn.onclick = () => { currentIndex--; renderQuestion(); };
    }

    const nextBtn = el.querySelector('#quiz-next');
    if (nextBtn) {
      nextBtn.onclick = () => {
        if (currentIndex === total - 1) {
          finishQuiz();
        } else {
          currentIndex++;
          renderQuestion();
        }
      };
    }
  }

  function finishQuiz() {
    const answerArray = QUESTIONS.map((q, i) => ({
      constitution: q.constitution,
      score: answers[i] || 0
    }));

    const diagnosis = agents.constitution.diagnoseFromQuestionnaire(answerArray);
    const st = getState();
    const plan = agents.regimen.plan({
      primary: diagnosis.primary,
      secondary: diagnosis.secondary,
      phase: st.cycleData?.currentPhase || 'menstrual',
      severity: 2
    });

    setState({
      constitution: {
        primary: diagnosis.primary,
        secondary: diagnosis.secondary,
        confidence: diagnosis.confidence,
        lastUpdated: new Date().toISOString()

    const primaryInfo = diagnosis.primary ? CONSTITUTIONS[diagnosis.primary] : null;

    el.innerHTML = `

            }).join('')}

      <div class="card" style="margin-bottom: var(--space-lg); animation: revealUp var(--duration-slow) var(--ease-out-expo) 240ms forwards; opacity: 0;">

/* ========================================
   Router
   ======================================== */

const views = new Map();
let currentView = null;

function registerView(name, renderFn) {
  views.set(name, renderFn);
}

function navigate(hash) {
  window.location.hash = hash;
}

function getRouteFromHash() {
  const hash = window.location.hash || ROUTES.welcome;
  for (const [key, route] of Object.entries(ROUTES)) {
    if (route === hash) return key;
  }
  return 'welcome';
}

function getCurrentRoute() {
  return getRouteFromHash();
}

function initRouter() {
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

function handleRoute() {
  const viewName = getRouteFromHash();
  if (viewName === 'welcome') {
    // Hide tab bar during onboarding
    if (window._hideTabBar) window._hideTabBar();
    renderView(viewName);
    return;
  }
  renderView(viewName);
}

/* ========================================

function renderAgentCycle() {
  const state = getState();
  const cycleData = state.cycleData;
  const cycleInfo = agents.cycle.getCycleInfo(cycleData);

  const el = document.createElement('div');
  el.className = 'stagger-reveal';
  el.style.padding = 'var(--space-md)';
  el.style.maxWidth = '720px';
  el.style.margin = '0 auto';

  const today = new Date();
  const cycleLength = cycleData?.cycleLength || 28;
  const periodLength = cycleData?.periodLength || 5;
  const lastPeriod = cycleData?.lastPeriodStart ? new Date(cycleData.lastPeriodStart) : null;

  // Generate 35-day calendar
  let calendarHtml = '';
  const startOffset = lastPeriod ? daysBetween(lastPeriod, today) % cycleLength : 0;
  for (let i = -7; i < 28; i++) {
    const d = addDays(today, i);
    const dayOfCycle = lastPeriod ? ((daysBetween(lastPeriod, d) % cycleLength) + cycleLength) % cycleLength + 1 : null;
    const phase = dayOfCycle ? getPhaseForDay(dayOfCycle, cycleLength) : null;
    const pInfo = phase ? PHASES[phase] : null;
    const isToday = i === 0;
    const isPeriod = dayOfCycle && dayOfCycle <= periodLength;
    const isOvulation = dayOfCycle && (dayOfCycle >= 14 && dayOfCycle <= 15);

    calendarHtml += `
      <div class="cycle-cal-day ${isToday ? 'today' : ''} ${isPeriod ? 'period' : ''} ${isOvulation ? 'ovulation' : ''}" style="${pInfo && !isPeriod && !isOvulation ? `border-color:${pInfo.color}30;` : ''}">
        <div class="cycle-cal-date">${d.getDate()}</div>
        <div class="cycle-cal-week">${['日','一','二','三','四','五','六'][d.getDay()]}</div>
        ${isToday ? '<div class="cycle-cal-dot"></div>' : ''}
        ${isPeriod ? '<div class="cycle-cal-badge" style="background:var(--color-cinnabar);">经</div>' : ''}
        ${isOvulation ? '<div class="cycle-cal-badge" style="background:#2E4A62;">排</div>' : ''}
      </div>
    `;
  }

  const nextPeriodDate = lastPeriod ? addDays(lastPeriod, cycleLength) : null;
  const ovulationDate = lastPeriod ? addDays(lastPeriod, 14) : null;

  el.innerHTML = `
    <div style="margin-bottom: var(--space-lg);">
      <div class="page-subtitle">周期预测师</div>
      <p style="font-size: 0.875rem; color: var(--color-ink-light); margin-top: var(--space-xs);">追踪你的周期规律，预测经期和排卵日</p>

/* ========================================
   Tab Pages: Cycle (周期)
   ======================================== */
function renderTabCycle() {
  const state = getState();
  const cycleData = state.cycleData;
  const cycleInfo = agents.cycle.getCycleInfo(cycleData);
  const today = new Date();
  const cycleLength = cycleData?.cycleLength || 28;
  const periodLength = cycleData?.periodLength || 5;
  const lastPeriod = cycleData?.lastPeriodStart ? new Date(cycleData.lastPeriodStart) : null;

  // Prediction dates
  const nextPeriodDate = lastPeriod ? addDays(lastPeriod, cycleLength) : null;
  const ovulationDate = lastPeriod ? addDays(lastPeriod, 14) : null;
  const daysToNext = lastPeriod ? cycleLength - (daysBetween(lastPeriod, today) % cycleLength) : null;
  const nextPhaseDate = lastPeriod ? (() => {
    const cd = daysBetween(lastPeriod, today) % cycleLength + 1;
    const phase = getPhaseForDay(cd, cycleLength);
    const pEnd = PHASES[phase]?.dayRange?.[1] || 28;
    return addDays(today, pEnd - cd);
  })() : null;

  // Calendar (21 days: 7 before, 14 after)
  let calHtml = '';
  for (let i = -7; i < 21; i++) {
    const d = addDays(today, i);
    const cd = lastPeriod ? ((daysBetween(lastPeriod, d) % cycleLength) + cycleLength) % cycleLength + 1 : null;
    const phase = cd ? getPhaseForDay(cd, cycleLength) : null;
    const pI = phase ? PHASES[phase] : null;
    const isToday = i === 0;
    const isPeriod = cd && cd <= periodLength;
    const isOvulation = cd && (cd >= 14 && cd <= 15);
    calHtml += `
      <div class="cycle-cal-day ${isToday ? 'today' : ''} ${isPeriod ? 'period' : ''} ${isOvulation ? 'ovulation' : ''}" style="${pI && !isPeriod && !isOvulation ? `border-color:${pI.color}25;` : ''}">
        <div class="cycle-cal-date">${d.getDate()}</div>
        <div class="cycle-cal-week">${['日','一','二','三','四','五','六'][d.getDay()]}</div>
        ${isToday ? '<div class="cycle-cal-dot"></div>' : ''}
        ${isPeriod ? '<div class="cycle-cal-badge" style="background:var(--color-cinnabar);">经</div>' : ''}
        ${isOvulation ? '<div class="cycle-cal-badge" style="background:#2E4A62;">排</div>' : ''}
      </div>`;
  }

  // Recent symptom logs from chat
  const chatHistory = state.chatHistory || [];
  const recentUserMsgs = chatHistory.filter(m => m.role === 'user').slice(-5).reverse();

  // Phase progress bar
  const currentCycleDay = cycleInfo?.cycleDay || 1;
  const phaseObj = cycleInfo?.phase ? PHASES[cycleInfo.phase] : null;
  const phaseStart = phaseObj?.dayRange?.[0] || 1;
  const phaseEnd = phaseObj?.dayRange?.[1] || 5;
  const phaseProgress = Math.round(((currentCycleDay - phaseStart) / (phaseEnd - phaseStart + 1)) * 100);

  const el = document.createElement('div');
  el.className = 'tab-page tab-page-scroll stagger-reveal';
  el.innerHTML = `
    <!-- Hero -->
    <div class="cycle-hero">
      <div class="cycle-hero-day">${cycleInfo ? cycleInfo.cycleDay : '-'}</div>
      <div class="cycle-hero-label">周期第 ${cycleInfo ? cycleInfo.cycleDay : '?'} 天</div>
      ${phaseObj ? `
        <div class="cycle-hero-phase" style="background:${phaseObj.color}12;color:${phaseObj.color};">
          <span style="width:6px;height:6px;border-radius:50%;background:${phaseObj.color};"></span>
          ${phaseObj.name}
        </div>
      ` : ''}
    </div>

    <!-- Phase progress -->
    ${phaseObj ? `
    <div style="background:#fff;border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-md);border:1px solid rgba(44,36,32,0.04);">
      <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--color-ink-ghost);margin-bottom:4px;">
        <span>第${phaseStart}天</span>
        <span>${phaseObj.name}进度 ${phaseProgress}%</span>
        <span>第${phaseEnd}天</span>
      </div>
      <div style="height:4px;background:rgba(44,36,32,0.06);border-radius:2px;overflow:hidden;">
        <div style="height:100%;width:${phaseProgress}%;background:${phaseObj.color};border-radius:2px;transition:width 0.3s;"></div>
      </div>
      <div style="font-size:0.8125rem;color:var(--color-ink-light);margin-top:6px;">${phaseObj.principle}</div>
    </div>
    ` : ''}

    <!-- Prediction cards -->
    <div class="cycle-prediction-grid">
      <div class="cycle-pred-card">
        <div class="cycle-pred-value" style="color:var(--color-cinnabar);">${nextPeriodDate ? formatDate(nextPeriodDate, 'M/D') : '-'}</div>
        <div class="cycle-pred-label">下次经期</div>
      </div>
      <div class="cycle-pred-card">
        <div class="cycle-pred-value" style="color:#2E4A62;">${ovulationDate ? formatDate(ovulationDate, 'M/D') : '-'}</div>
        <div class="cycle-pred-label">排卵日</div>
      </div>
      <div class="cycle-pred-card">
        <div class="cycle-pred-value">${daysToNext !== null ? daysToNext + '天' : '-'}</div>
        <div class="cycle-pred-label">距经期</div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="profile-section">
      <div class="profile-section-title">周期日历</div>
      <div class="cycle-calendar">${calHtml}</div>
      <div style="display:flex;gap:var(--space-md);margin-top:var(--space-sm);justify-content:center;">
        <div style="display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--color-ink-light);"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-cinnabar);"></span>经期</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--color-ink-light);"><span style="width:8px;height:8px;border-radius:50%;background:#2E4A62;"></span>排卵</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--color-ink-light);"><span style="width:8px;height:8px;border-radius:50%;border:2px solid var(--color-cinnabar);"></span>今天</div>
      </div>
    </div>

    <!-- Recent symptoms -->
    ${recentUserMsgs.length ? `
    <div class="profile-section" style="margin-top:var(--space-lg);">
      <div class="profile-section-title">近期记录</div>
      <div class="cycle-symptom-log">
        ${recentUserMsgs.map(m => `
          <div class="cycle-symptom-item">
            <div class="cycle-symptom-dot" style="background:var(--color-cinnabar);"></div>
            <div class="cycle-symptom-text">${escapeHtml(m.content)}</div>
            <div class="cycle-symptom-date">${new Date(m.time).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' })}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}

    <!-- Quick record -->
    <button class="btn btn-outline btn-block" style="margin-top:var(--space-md);" onclick="navigate('${ROUTES.home}')">
      记录今天症状 →
    </button>
  `;
  return el;
}

function calculateConstitutionFromOnboarding(answers) {
  const scores = { qiXu: 0, xueYu: 0, hanNing: 0, ganYu: 0, xueRe: 0, shenXu: 0, tanShi: 0, yinXu: 0 };
  let totalWeight = 0;

  for (const q of ONBOARDING_QUESTIONS) {
    const answer = answers[q.key];
    if (!answer) continue;

    if (q.type === 'single') {
      const opt = q.options.find(o => o.value === answer);
      if (opt?.tags) {
        for (const [key, val] of Object.entries(opt.tags)) {
          if (scores[key] !== undefined) {
            scores[key] += typeof val === 'number' ? val : 0;
            totalWeight += typeof val === 'number' ? val : 0;
          }
        }
      }
    } else if (q.type === 'multi' && Array.isArray(answer)) {
      for (const val of answer) {
        const opt = q.options.find(o => o.value === val);
        if (opt?.tags) {
          for (const [key, v] of Object.entries(opt.tags)) {
            if (scores[key] !== undefined) {
              scores[key] += typeof v === 'number' ? v : 0;
              totalWeight += typeof v === 'number' ? v : 0;
            }
          }
        }
      }
    }
  }

  // Sort to find primary and secondary
  const sorted = Object.entries(scores)
    .filter(([k, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);

  if (sorted.length === 0) {
    return { primary: 'qiXu', secondary: [], confidence: 0.5, source: 'cold_start_default' };
  }

  const primary = sorted[0][0];
  const primaryScore = sorted[0][1];
  const secondary = sorted.slice(1, 3).filter(([k, v]) => v >= primaryScore * 0.4).map(([k]) => k);
  const confidence = Math.min(0.85, 0.5 + (primaryScore / (totalWeight || 10)) * 0.35);

  return {
    primary,
    secondary,
    confidence: Math.round(confidence * 100) / 100,
    scores,
    source: 'cold_start'
  };
}

function renderOnboarding() {
  let step = 0;
  const answers = {};

  const el = document.createElement('div');
  el.className = 'onboarding-container';
  el.innerHTML = `
    <div class="onboarding-inner">
      <!-- Top bar -->
      <div class="onboarding-top">
        <div class="onboarding-brand">月汐 · 体质画像</div>
        <div class="onboarding-progress-wrap">
          <div class="onboarding-progress-bar">
            <div class="onboarding-progress-fill" id="ob-progress"></div>
          </div>
          <div class="onboarding-step-count"><span id="ob-cur">1</span> / 5</div>
        </div>
      </div>

      <!-- Content area -->
      <div class="onboarding-content" id="ob-content"></div>

      <!-- Bottom actions -->
      <div class="onboarding-actions">
        <button class="btn btn-ghost" id="ob-back" style="visibility:hidden;">上一题</button>
        <button class="btn btn-primary" id="ob-next" disabled>下一题</button>
      </div>

      <!-- Skip link -->
      <div style="text-align:center;margin-top:var(--space-sm);">
        <button class="onboarding-skip" id="ob-skip">先逛逛，稍后再填</button>
      </div>
    </div>
  `;

  const content = el.querySelector('#ob-content');
  const progressFill = el.querySelector('#ob-progress');
  const curNum = el.querySelector('#ob-cur');
  const backBtn = el.querySelector('#ob-back');
  const nextBtn = el.querySelector('#ob-next');
  const skipBtn = el.querySelector('#ob-skip');

  function renderStep() {
    const q = ONBOARDING_QUESTIONS[step];
    curNum.textContent = step + 1;
    progressFill.style.width = ((step) / ONBOARDING_QUESTIONS.length * 100) + '%';
    backBtn.style.visibility = step === 0 ? 'hidden' : 'visible';

    if (step === ONBOARDING_QUESTIONS.length) {
      // Result page
      renderResult();
      return;
    }

    nextBtn.textContent = step === ONBOARDING_QUESTIONS.length - 1 ? '生成体质画像' : '下一题';

    let selected = answers[q.key];
    if (q.type === 'multi' && !Array.isArray(selected)) selected = [];

    content.innerHTML = `
      <div class="ob-question-card stagger-reveal">
        <div class="ob-q-icon">${q.icon}</div>
        <div class="ob-q-title">${q.title}</div>
        <div class="ob-q-subtitle">${q.subtitle}</div>
        ${q.hint ? `<div class="ob-q-hint">💡 ${q.hint}</div>` : ''}
        <div class="ob-options">
          ${q.options.map((opt, i) => {
            const isSelected = q.type === 'single'
              ? selected === opt.value
              : selected.includes(opt.value);
            return `
              <button class="ob-option ${isSelected ? 'selected' : ''}" data-value="${opt.value}" data-idx="${i}">
                <span class="ob-option-text">${opt.label}</span>
                <span class="ob-option-check">
                  ${q.type === 'single'
                    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>'
                    : (isSelected ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' : '')}
                </span>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;

    // Update next button state
    const hasAnswer = q.type === 'single'
      ? !!answers[q.key]
      : (answers[q.key]?.length > 0);
    nextBtn.disabled = !hasAnswer;

    // Option click handlers — only toggle visual state, no re-render
    content.querySelectorAll('.ob-option').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        const val = btn.dataset.value;
        const check = btn.querySelector('.ob-option-check');

        if (q.type === 'single') {
          answers[q.key] = val;
          // Unselect all, select clicked
          content.querySelectorAll('.ob-option').forEach(b => {
            b.classList.remove('selected');
            const c = b.querySelector('.ob-option-check');
            if (c) c.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
          });
          btn.classList.add('selected');
          if (check) check.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
        } else {
          if (!Array.isArray(answers[q.key])) answers[q.key] = [];
          const idx = answers[q.key].indexOf(val);
          if (idx >= 0) {
            answers[q.key].splice(idx, 1);
            btn.classList.remove('selected');
            if (check) check.innerHTML = '';
          } else {
            answers[q.key].push(val);
            btn.classList.add('selected');
            if (check) check.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
          }
        }
        nextBtn.disabled = q.type === 'single' ? false : (answers[q.key]?.length === 0);
      };
    });
  }

  function renderResult() {
    progressFill.style.width = '100%';
    curNum.textContent = '5';
    backBtn.style.visibility = 'visible';
    nextBtn.style.display = 'none';
    skipBtn.style.display = 'none';

    const result = calculateConstitutionFromOnboarding(answers);
    const c = CONSTITUTIONS[result.primary];

    // Save to state
    const state = getState();
    setState({
      constitution: {
        primary: result.primary,
        secondary: result.secondary,
        confidence: result.confidence,
        scores: result.scores,
        source: result.source,
        lastUpdated: new Date().toISOString()
      },
      profile: {
        ...state.profile,
        ageRange: answers.age,
        cycleRegularity: answers.cycleRegularity,
        mainConcerns: answers.mainConcern,
        tongueType: answers.tongue,
        lifestyle: answers.lifestyle
      }
    });

    // Also update profile in DB
    get('profiles', 'default-user').then(profile => {
      if (profile) {
        put('profiles', {
          ...profile,
          age: answers.age === '18-25' ? 22 : answers.age === '26-35' ? 30 : answers.age === '36-45' ? 40 : answers.age === 'under18' ? 17 : 48,
          settings: { ...profile.settings, onboardingComplete: true }
        });
      }
      put('appSettings', { key: 'onboardingComplete', value: true });
    });

    content.innerHTML = `
      <div class="ob-result-card stagger-reveal">
        <div class="ob-result-badge">🎉 你的体质画像已生成</div>
        <div class="ob-result-icon" style="background:${c.color}18;color:${c.color};">${c.element}</div>
        <div class="ob-result-name">${c.name}</div>
        <div class="ob-result-sub">基于 5 道轻量问答 · 置信度 ${Math.round(result.confidence * 100)}%</div>
        <div class="ob-result-desc">${c.description}</div>
        ${result.secondary?.length ? `
          <div class="ob-result-secondary">
            <span class="ob-sec-label">兼体质</span>
            ${result.secondary.map(s => {
              const sc = CONSTITUTIONS[s];
              return `<span class="ob-sec-tag" style="background:${sc.color}15;color:${sc.color};">${sc.name}</span>`;
            }).join('')}
          </div>
        ` : ''}
        <div class="ob-result-tip">
          💡 这是基于快速问答的初步画像，想更精准可以做完整的「望闻问切」30题体质辨识
        </div>
        <button class="btn btn-primary btn-block" id="ob-start-btn" style="margin-top:var(--space-md);">
          开始使用月汐
        </button>
      </div>
    `;

    content.querySelector('#ob-start-btn').onclick = () => {
      if (window._showTabBar) window._showTabBar();
      navigate(ROUTES.home);
    };
  }

  backBtn.onclick = (e) => {
    e.preventDefault();
    if (step > 0) { step--; renderStep(); }
  };

  nextBtn.onclick = (e) => {
    e.preventDefault();
    if (step < ONBOARDING_QUESTIONS.length) {
      step++;
      renderStep();
    }
  };

  skipBtn.onclick = () => {
    put('appSettings', { key: 'onboardingComplete', value: true });
    if (window._showTabBar) window._showTabBar();
    navigate(ROUTES.home);
  };

  renderStep();
  return el;
}

function renderView(viewName) {
  const container = document.getElementById('app-content');
  if (!container) return;
  const renderFn = views.get(viewName);
  if (!renderFn) {
    container.innerHTML = `<div class="view-enter text-center" style="padding:var(--space-xl)"><h3>页面建设中</h3></div>`;
    return;
  }
  if (currentView) {
    container.classList.add('view-exit');
  }
  setTimeout(() => {
    container.innerHTML = '';
    const el = renderFn();
    if (el) {
      el.classList.add('view-enter');
      container.appendChild(el);
    }
    setState({ currentView: viewName });
    currentView = viewName;
    window.scrollTo(0, 0);
  }, currentView ? 150 : 0);
}

          <div class="app-content" id="app-content"></div>
        </div>
      `;
      document.body.appendChild(renderSidebar());

      window._showTabBar = () => {
        if (!document.getElementById('tab-bar')) {
          document.body.appendChild(renderTabBar());
          updateTabActive();
        }
      };
      window._hideTabBar = () => {
        const bar = document.getElementById('tab-bar');
        if (bar) bar.remove();
      };
    }

    // Init router
    initRouter();

    // Redirect to onboarding if not completed and on default route
    const currentHash = window.location.hash;
    if (!onboardingDone && (currentHash === '' || currentHash === ROUTES.home || currentHash === '#/')) {
      navigate(ROUTES.welcome);
    } else if (onboardingDone) {
      // Already completed onboarding, show tab bar
      if (window._showTabBar) window._showTabBar();
    }

    // Update header/sidebar/tab on route change
    window.addEventListener('hashchange', () => {
      updateHeader();
      updateNavActive();
      updateTabActive();
    });

    updateHeader();
    updateTabActive();

  } catch (e) {
    console.error('App init failed:', e);
    document.getElementById('app').innerHTML = `

        <p style="color:var(--color-ink-ghost);margin-top:var(--space-md);">请检查浏览器是否支持 IndexedDB</p>

  }

        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(result => {
            if (result.outcome === 'accepted') {
              if (miniBanner) miniBanner.style.display = 'none';
            }
            deferredPrompt = null;
          });
        }
      };
    }
  } else {
    // Mobile: show install guide
    const dismissed = localStorage.getItem('yuexi_pwa_dismissed');
    if (dismissed) return;

    // Adjust steps for Android vs iOS
    const stepsContainer = document.getElementById('pwa-install-steps');
    if (stepsContainer && isAndroid) {
      stepsContainer.innerHTML = `
        <div class="pwa-install-step">
          <div class="pwa-install-step-num">1</div>
          <span>点击浏览器右上角「三个点」菜单</span>
        </div>
        <div class="pwa-install-step">
          <div class="pwa-install-step-num">2</div>
          <span>选择「添加到主屏幕」或「安装应用」</span>
        </div>
        <div class="pwa-install-step">
          <div class="pwa-install-step-num">3</div>
          <span>点击「添加」即可</span>
        </div>
      `;
    }

    // Show overlay after 1.5s
    setTimeout(() => {
      if (overlay) overlay.classList.add('show');
    }, 1500);
  }

  // Close handlers
  function dismissForever() {
    localStorage.setItem('yuexi_pwa_dismissed', '1');
    if (overlay) overlay.classList.remove('show');
    if (miniBanner) miniBanner.style.display = 'none';
  }

  function dismissTemporarily() {
    if (overlay) overlay.classList.remove('show');
    if (miniBanner) miniBanner.style.display = 'none';
  }

  if (closeBtn) closeBtn.onclick = dismissTemporarily;
  if (okBtn) okBtn.onclick = () => {
    if (dontShow && dontShow.checked) dismissForever();
    else dismissTemporarily();
  };
  if (miniDismiss) miniDismiss.onclick = dismissTemporarily;

  // Handle beforeinstallprompt on mobile for Chrome
  if (isMobile) {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      // If browser supports native install, use mini banner approach
      if (overlay) overlay.classList.remove('show');
      if (miniBanner) miniBanner.style.display = 'flex';
    });
  }
})();
</script>
</body>
</html>
