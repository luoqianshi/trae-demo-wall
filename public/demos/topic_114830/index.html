<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊车辅助盲区预警系统 - 仿真演示</title>
<style>
/* ==================== 全局重置与变量 ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --bg-deep:#070b14;
    --bg-panel:#0f1525;
    --bg-card:#161e33;
    --bg-hover:#1e2845;
    --border:#243056;
    --text:#dce4f5;
    --text-dim:#6b7a99;
    --text-bright:#ffffff;
    --accent:#00d4ff;
    --accent-glow:rgba(0,212,255,.3);
    --safe:#00e676;
    --caution:#ffd600;
    --warning:#ff9100;
    --danger:#ff1744;
    --danger-glow:rgba(255,23,68,.4);
    --shadow:0 4px 20px rgba(0,0,0,.5);
    --mono:'Consolas','Monaco','Courier New',monospace;
    --sans:'Segoe UI','Microsoft YaHei',sans-serif;
}
html,body{height:100%;overflow:hidden;}
body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    user-select:none;
}

/* ==================== 主布局 ==================== */
.app{
    display:grid;
    grid-template-rows:56px 1fr auto;
    grid-template-columns:1fr 380px;
    height:100vh;
    gap:1px;
    background:var(--border);
}
.header{
    grid-column:1/-1;
    background:var(--bg-panel);
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:16px;
    border-bottom:1px solid var(--border);
}
.header .logo{
    font-size:18px;
    font-weight:700;
    color:var(--accent);
    text-shadow:0 0 10px var(--accent-glow);
    white-space:nowrap;
}
.header .logo .sub{font-size:12px;color:var(--text-dim);font-weight:400;margin-left:8px;}
.header .status-bar{
    display:flex;
    gap:20px;
    margin-left:auto;
    font-family:var(--mono);
    font-size:13px;
}
.header .status-item{display:flex;align-items:center;gap:6px;}
.header .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--safe);
    box-shadow:0 0 8px var(--safe);
    animation:pulse 2s infinite;
}
.header .status-dot.offline{background:var(--text-dim);box-shadow:none;animation:none;}
.header .clock{color:var(--accent);font-weight:600;}

/* ==================== 画布区域 ==================== */
.canvas-area{
    background:var(--bg-deep);
    position:relative;
    overflow:hidden;
}
#simCanvas{display:block;width:100%;height:100%;cursor:grab;}
#simCanvas:active{cursor:grabbing;}
.canvas-overlay{
    position:absolute;
    top:12px;left:12px;
    background:rgba(15,21,37,.85);
    backdrop-filter:blur(8px);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    font-size:12px;
    max-width:300px;
}
.canvas-overlay .scene-name{
    font-size:15px;font-weight:600;color:var(--accent);
    margin-bottom:4px;
}
.canvas-overlay .scene-desc{color:var(--text-dim);line-height:1.5;}
.canvas-hint{
    position:absolute;
    bottom:12px;left:12px;
    background:rgba(15,21,37,.85);
    backdrop-filter:blur(8px);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
    font-size:11px;
    color:var(--text-dim);
    font-family:var(--mono);
}
.canvas-hint kbd{
    background:var(--bg-hover);
    border:1px solid var(--border);
    border-radius:3px;
    padding:1px 5px;
    color:var(--text);
    font-size:10px;
}
.risk-overlay{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    box-shadow:inset 0 0 0 0 transparent;
    transition:box-shadow .3s;
}
.risk-overlay.caution{box-shadow:inset 0 0 80px rgba(255,214,0,.15);}
.risk-overlay.warning{box-shadow:inset 0 0 100px rgba(255,145,0,.25);}
.risk-overlay.danger{box-shadow:inset 0 0 120px rgba(255,23,68,.35);animation:dangerFlash .5s infinite alternate;}

/* ==================== HUD 面板 ==================== */
.hud-panel{
    background:var(--bg-panel);
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.hud-panel::-webkit-scrollbar{width:6px;}
.hud-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.hud-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
}
.hud-card-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-dim);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
}
.hud-card-title::before{
    content:'';width:3px;height:12px;
    background:var(--accent);border-radius:2px;
}

/* 360 雷达环视 */
.radar-display{
    width:100%;
    aspect-ratio:1;
    position:relative;
}
#radarCanvas{width:100%;height:100%;}

/* 距离条 */
.dist-bars{display:flex;flex-direction:column;gap:6px;}
.dist-bar-row{
    display:grid;
    grid-template-columns:56px 1fr 52px;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:12px;
}
.dist-bar-label{color:var(--text-dim);font-size:11px;}
.dist-bar-track{
    height:14px;
    background:var(--bg-deep);
    border-radius:7px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--border);
}
.dist-bar-fill{
    height:100%;
    border-radius:7px;
    transition:width .15s,background .15s;
    position:relative;
}
.dist-bar-fill::after{
    content:'';
    position:absolute;
    right:0;top:0;bottom:0;
    width:2px;
    background:rgba(255,255,255,.5);
}
.dist-bar-value{
    text-align:right;
    font-size:12px;
    font-weight:600;
}

/* 风险等级 */
.risk-level{
    text-align:center;
    padding:16px 12px;
    border-radius:10px;
    border:2px solid;
    transition:all .3s;
}
.risk-level.safe{border-color:var(--safe);background:rgba(0,230,118,.08);}
.risk-level.caution{border-color:var(--caution);background:rgba(255,214,0,.08);}
.risk-level.warning{border-color:var(--warning);background:rgba(255,145,0,.1);}
.risk-level.danger{border-color:var(--danger);background:rgba(255,23,68,.12);animation:dangerPulse .5s infinite alternate;}
.risk-level-icon{font-size:28px;margin-bottom:4px;}
.risk-level-text{font-size:20px;font-weight:700;letter-spacing:2px;}
.risk-level-desc{font-size:11px;color:var(--text-dim);margin-top:4px;}
.risk-level.safe .risk-level-text{color:var(--safe);}
.risk-level.caution .risk-level-text{color:var(--caution);}
.risk-level.warning .risk-level-text{color:var(--warning);}
.risk-level.danger .risk-level-text{color:var(--danger);}

/* 警告信息 */
.warning-area{
    min-height:60px;
    max-height:120px;
    overflow-y:auto;
    font-size:12px;
    line-height:1.6;
}
.warning-area::-webkit-scrollbar{width:4px;}
.warning-area::-webkit-scrollbar-thumb{background:var(--border);}
.warning-msg{
    padding:4px 8px;
    border-radius:4px;
    margin-bottom:3px;
    display:flex;
    gap:6px;
    align-items:flex-start;
    animation:slideIn .2s;
}
.warning-msg .w-time{color:var(--text-dim);font-size:10px;font-family:var(--mono);flex-shrink:0;}
.warning-msg.caution{background:rgba(255,214,0,.1);color:var(--caution);}
.warning-msg.warning{background:rgba(255,145,0,.1);color:var(--warning);}
.warning-msg.danger{background:rgba(255,23,68,.1);color:var(--danger);font-weight:600;}
.warning-msg.info{color:var(--text-dim);}
.no-warning{color:var(--text-dim);text-align:center;padding:20px 0;font-size:12px;}

/* 车辆状态 */
.vehicle-status{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    font-family:var(--mono);
}
.vs-item{
    background:var(--bg-deep);
    border-radius:6px;
    padding:8px 10px;
    text-align:center;
}
.vs-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.vs-value{font-size:18px;font-weight:700;color:var(--accent);margin-top:2px;}

/* 最近障碍物 */
.nearest-info{font-family:var(--mono);font-size:12px;line-height:1.8;}
.nearest-info .ni-row{display:flex;justify-content:space-between;}
.nearest-info .ni-label{color:var(--text-dim);}
.nearest-info .ni-value{font-weight:600;}

/* ==================== 控制面板 ==================== */
.control-panel{
    grid-column:1/-1;
    background:var(--bg-panel);
    border-top:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
}
.ctrl-group{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
}
.ctrl-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-right:4px;white-space:nowrap;}
.btn{
    background:var(--bg-hover);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-family:var(--sans);
    transition:all .15s;
    white-space:nowrap;
}
.btn:hover{background:var(--border);color:var(--text-bright);}
.btn.active{background:var(--accent);color:var(--bg-deep);border-color:var(--accent);font-weight:600;}
.btn.gear-btn{min-width:40px;font-weight:700;font-family:var(--mono);font-size:15px;}
.btn.gear-btn.active{background:var(--accent);color:var(--bg-deep);}
.btn.danger-btn{border-color:var(--danger);color:var(--danger);}
.btn.danger-btn:hover{background:var(--danger);color:#fff;}
.btn.move-btn{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    padding:0;font-size:16px;
}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.log-toggle{
    margin-left:auto;
    font-size:12px;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;align-items:center;gap:4px;
}

/* ==================== 日志面板 ==================== */
.log-panel{
    grid-column:1/-1;
    background:var(--bg-panel);
    border-top:1px solid var(--border);
    max-height:180px;
    overflow:hidden;
    display:none;
    flex-direction:column;
}
.log-panel.visible{display:flex;}
.log-header{
    display:flex;align-items:center;
    padding:6px 16px;
    border-bottom:1px solid var(--border);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-dim);
}
.log-clear{margin-left:auto;cursor:pointer;color:var(--accent);}
.log-content{
    overflow-y:auto;
    padding:6px 16px;
    font-family:var(--mono);
    font-size:11px;
    line-height:1.6;
    flex:1;
}
.log-content::-webkit-scrollbar{width:6px;}
.log-content::-webkit-scrollbar-thumb{background:var(--border);}
.log-entry{display:flex;gap:8px;padding:1px 0;}
.log-time{color:var(--text-dim);flex-shrink:0;}
.log-tag{
    flex-shrink:0;
    padding:0 4px;border-radius:2px;font-size:9px;font-weight:700;
}
.log-tag.info{background:var(--accent);color:var(--bg-deep);}
.log-tag.warn{background:var(--caution);color:var(--bg-deep);}
.log-tag.err{background:var(--danger);color:#fff;}
.log-tag.ok{background:var(--safe);color:var(--bg-deep);}
.log-msg{color:var(--text);}

/* ==================== 动画 ==================== */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes dangerPulse{from{box-shadow:0 0 5px var(--danger);}to{box-shadow:0 0 20px var(--danger);}}
@keyframes dangerFlash{from{box-shadow:inset 0 0 120px rgba(255,23,68,.35);}to{box-shadow:inset 0 0 150px rgba(255,23,68,.5);}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}

/* 统计 */
.stats-row{display:flex;gap:8px;}
.stats-item{
    flex:1;
    background:var(--bg-deep);
    border-radius:6px;
    padding:6px;
    text-align:center;
}
.stats-value{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--accent);}
.stats-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;}

/* 响应式 */
@media(max-width:1100px){
    .app{grid-template-columns:1fr 320px;}
}
</style>
</head>
<body>
<div class="app">
    <!-- 头部 -->
    <div class="header">
        <div class="logo">泊车辅助盲区预警系统<span class="sub">仿真演示 v1.00</span></div>
        <div class="status-bar">
            <div class="status-item"><div class="status-dot" id="sysDot"></div><span id="sysStatus">系统就绪</span></div>
            <div class="status-item"><span>雷达:</span><span id="radarCount" style="color:var(--accent)">8路</span></div>
            <div class="status-item"><span>采样:</span><span id="sampleRate" style="color:var(--accent)">10Hz</span></div>
            <div class="status-item clock" id="clock">--:--:--</div>
        </div>
    </div>

    <!-- 画布区域 -->
    <div class="canvas-area">
        <canvas id="simCanvas"></canvas>
        <div class="canvas-overlay">
            <div class="scene-name" id="sceneName">地下车库停车</div>
            <div class="scene-desc" id="sceneDesc">模拟地下车库倒车入库场景，注意两侧立柱与后方矮墩</div>
        </div>
        <div class="canvas-hint">
            <kbd>↑</kbd><kbd>↓</kbd> 前进/后退 <kbd>←</kbd><kbd>→</kbd> 转向 <kbd>空格</kbd> 刹车 <kbd>R</kbd> 重置 | 拖拽障碍物可移动
        </div>
        <div class="risk-overlay" id="riskOverlay"></div>
    </div>

    <!-- HUD 面板 -->
    <div class="hud-panel">
        <!-- 360 环视 -->
        <div class="hud-card">
            <div class="hud-card-title">360° 雷达环视</div>
            <div class="radar-display"><canvas id="radarCanvas"></canvas></div>
        </div>

        <!-- 风险等级 -->
        <div class="risk-level safe" id="riskLevel">
            <div class="risk-level-icon" id="riskIcon">✓</div>
            <div class="risk-level-text" id="riskText">安全</div>
            <div class="risk-level-desc" id="riskDesc">周围无近距离障碍物</div>
        </div>

        <!-- 距离条 -->
        <div class="hud-card">
            <div class="hud-card-title">超声波雷达测距</div>
            <div class="dist-bars" id="distBars"></div>
        </div>

        <!-- 最近障碍物 -->
        <div class="hud-card">
            <div class="hud-card-title">最近障碍物</div>
            <div class="nearest-info" id="nearestInfo">
                <div class="ni-row"><span class="ni-label">方向</span><span class="ni-value" id="niDir">--</span></div>
                <div class="ni-row"><span class="ni-label">距离</span><span class="ni-value" id="niDist">--</span></div>
                <div class="ni-row"><span class="ni-label">类型</span><span class="ni-value" id="niType">--</span></div>
            </div>
        </div>

        <!-- 车辆状态 -->
        <div class="hud-card">
            <div class="hud-card-title">车辆状态</div>
            <div class="vehicle-status">
                <div class="vs-item"><div class="vs-label">档位</div><div class="vs-value" id="vsGear">P</div></div>
                <div class="vs-item"><div class="vs-label">车速</div><div class="vs-value" id="vsSpeed">0</div></div>
                <div class="vs-item"><div class="vs-label">方位</div><div class="vs-value" id="vsHeading">0°</div></div>
                <div class="vs-item"><div class="vs-label">里程</div><div class="vs-value" id="vsOdo">0m</div></div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="hud-card">
            <div class="hud-card-title">运行统计</div>
            <div class="stats-row">
                <div class="stats-item"><div class="stats-value" id="statAlerts">0</div><div class="stats-label">预警次数</div></div>
                <div class="stats-item"><div class="stats-value" id="statDangers">0</div><div class="stats-label">危险次数</div></div>
                <div class="stats-item"><div class="stats-value" id="statTime">0s</div><div class="stats-label">运行时长</div></div>
            </div>
        </div>

        <!-- 警告信息 -->
        <div class="hud-card">
            <div class="hud-card-title">预警信息</div>
            <div class="warning-area" id="warningArea">
                <div class="no-warning">暂无预警信息</div>
            </div>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="ctrl-group">
            <span class="ctrl-label">场景</span>
            <button class="btn active" data-scene="parking">车库停车</button>
            <button class="btn" data-scene="narrow">窄路会车</button>
            <button class="btn" data-scene="parallel">侧方停车</button>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">档位</span>
            <button class="btn gear-btn active" data-gear="P">P</button>
            <button class="btn gear-btn" data-gear="R">R</button>
            <button class="btn gear-btn" data-gear="N">N</button>
            <button class="btn gear-btn" data-gear="D">D</button>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">驾驶</span>
            <button class="btn move-btn" id="moveUp">▲</button>
            <button class="btn move-btn" id="moveDown">▼</button>
            <button class="btn move-btn" id="moveLeft">◀</button>
            <button class="btn move-btn" id="moveRight">▶</button>
            <button class="btn move-btn" id="moveBrake">■</button>
        </div>
        <div class="ctrl-group">
            <button class="btn" id="autoDemoBtn">自动演示</button>
            <button class="btn" id="soundBtn">🔊 报警音</button>
            <button class="btn" id="resetBtn">重置场景</button>
        </div>
        <div class="log-toggle" id="logToggle">📋 遥测日志 ▸</div>
    </div>

    <!-- 日志面板 -->
    <div class="log-panel" id="logPanel">
        <div class="log-header">
            系统遥测日志
            <span class="log-clear" id="logClear">清空</span>
        </div>
        <div class="log-content" id="logContent"></div>
    </div>
</div>

<script>
// ================================================================
//  泊车辅助盲区预警仿真系统 - 核心代码
// ================================================================

// ==================== 配置参数 ====================
const CFG = {
    PPM: 48,                  // 像素/米
    CAR_L: 4.6,               // 车长 (m)
    CAR_W: 1.85,              // 车宽 (m)
    WHEELBASE: 2.7,           // 轴距 (m)
    RADAR_RANGE: 2.5,         // 雷达最大量程 (m)
    RADAR_MIN: 0.10,          // 雷达最小量程 (m)
    RADAR_FOV: Math.PI/3,     // 雷达波束角 60°
    RADAR_RAYS: 9,            // 每雷达射线数
    RAY_STEPS: 60,            // 射线步进数
    CAR_MAXSPD: 2.5,          // 最大速度 m/s (约9km/h 泊车速度)
    CAR_ACCEL: 1.5,           // 加速度 m/s²
    CAR_DECEL: 3.0,           // 制动减速度 m/s²
    TURN_RATE: 1.2,           // 转向角速度 rad/s
    // 风险阈值 (米)
    TH_SAFE: 1.2,
    TH_CAUTION: 0.7,
    TH_WARNING: 0.35,
    TH_DANGER: 0.15,
};

// ==================== 工具函数 ====================
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const deg2rad=d=>d*Math.PI/180;
const rad2deg=r=>r*180/Math.PI;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const fmtDist=d=>d>=CFG.RADAR_RANGE?'— —':(d<1?Math.round(d*100)+'cm':d.toFixed(2)+'m');

// 射线-圆相交，返回最近距离或 null
function rayCircle(ox,oy,dx,dy,cx,cy,r){
    const fx=ox-cx, fy=oy-cy;
    const a=dx*dx+dy*dy;
    const b=2*(fx*dx+fy*dy);
    const c=fx*fx+fy*fy-r*r;
    const disc=b*b-4*a*c;
    if(disc<0) return null;
    const sq=Math.sqrt(disc);
    const t1=(-b-sq)/(2*a);
    const t2=(-b+sq)/(2*a);
    if(t1>=0) return t1;
    if(t2>=0) return t2;
    return null;
}

// 射线-OBB(旋转矩形)相交
function rayOBB(ox,oy,dx,dy,cx,cy,w,h,ang){
    // 转到 OBB 局部坐标
    const cs=Math.cos(-ang), sn=Math.sin(-ang);
    const lx=cs*(ox-cx)-sn*(oy-cy);
    const ly=sn*(ox-cx)+cs*(oy-cy);
    const ldx=cs*dx-sn*dy;
    const ldy=sn*dx+cs*dy;
    const hw=w/2, hh=h/2;
    // AABB slab
    let tmin=-Infinity, tmax=Infinity;
    if(Math.abs(ldx)<1e-9){
        if(lx<-hw||lx>hw) return null;
    } else {
        let t1=(-hw-lx)/ldx, t2=(hw-lx)/ldx;
        if(t1>t2)[t1,t2]=[t2,t1];
        tmin=Math.max(tmin,t1);
        tmax=Math.min(tmax,t2);
    }
    if(Math.abs(ldy)<1e-9){
        if(ly<-hh||ly>hh) return null;
    } else {
        let t1=(-hh-ly)/ldy, t2=(hh-ly)/ldy;
        if(t1>t2)[t1,t2]=[t2,t1];
        tmin=Math.max(tmin,t1);
        tmax=Math.min(tmax,t2);
    }
    if(tmax<tmin||tmax<0) return null;
    return tmin>=0?tmin:tmax;
}

// ==================== 障碍物定义 ====================
class Obstacle {
    constructor(opts){
        Object.assign(this,opts);
        this.id=Obstacle._id++;
        // type: 'circle' | 'rect'
        // category: 'pedestrian'|'pillar'|'wall'|'barrier'|'car'|'curb'
    }
    // 射线相交测试，返回距离或 null
    intersect(ox,oy,dx,dy){
        if(this.type==='circle'){
            return rayCircle(ox,oy,dx,dy,this.x,this.y,this.r);
        } else {
            return rayOBB(ox,oy,dx,dy,this.x,this.y,this.w,this.h,this.angle||0);
        }
    }
    // 点是否在障碍物内 (用于拖拽)
    contains(px,py){
        if(this.type==='circle'){
            return dist(px,py,this.x,this.y)<=this.r;
        } else {
            const cs=Math.cos(-(this.angle||0)),sn=Math.sin(-(this.angle||0));
            const lx=cs*(px-this.x)-sn*(py-this.y);
            const ly=sn*(px-this.x)+cs*(py-this.y);
            return Math.abs(lx)<=this.w/2&&Math.abs(ly)<=this.h/2;
        }
    }
}
Obstacle._id=0;

// ==================== 雷达传感器 ====================
class Radar {
    constructor(name,label,offX,offY,angle,color){
        this.name=name;
        this.label=label;
        this.offX=offX; // 相对车中心偏移 (m)
        this.offY=offY;
        this.angle=angle; // 朝向角 (rad, 0=车头方向)
        this.color=color;
        this.distance=CFG.RADAR_RANGE;
        this.detected=false;
        this.hitObstacle=null;
        this.hitX=0; this.hitY=0;
    }
    // 获取世界坐标
    worldPos(car){
        const cs=Math.cos(car.angle), sn=Math.sin(car.angle);
        return {
            x: car.x + this.offX*cs - this.offY*sn,
            y: car.y + this.offX*sn + this.offY*cs,
            angle: car.angle + this.angle,
        };
    }
    // 射线检测
    scan(car, obstacles){
        const wp=this.worldPos(car);
        this.distance=CFG.RADAR_RANGE;
        this.detected=false;
        this.hitObstacle=null;
        const halfFov=CFG.RADAR_FOV/2;
        const rayStep=CFG.RADAR_FOV/(CFG.RADAR_RAYS-1);
        let bestDist=CFG.RADAR_RANGE;
        let bestObs=null, bestX=0, bestY=0;

        for(let i=0;i<CFG.RADAR_RAYS;i++){
            const ra=wp.angle - halfFov + i*rayStep;
            const dx=Math.cos(ra), dy=Math.sin(ra);
            for(const obs of obstacles){
                const t=obs.intersect(wp.x,wp.y,dx,dy);
                if(t!==null && t<bestDist && t>=0){
                    bestDist=t;
                    bestObs=obs;
                    bestX=wp.x+dx*t;
                    bestY=wp.y+dy*t;
                }
            }
        }
        this.distance=Math.max(CFG.RADAR_MIN, bestDist);
        this.detected=bestDist<CFG.RADAR_RANGE;
        this.hitObstacle=bestObs;
        this.hitX=bestX; this.hitY=bestY;
    }
}

// ==================== 车辆 ====================
class Car {
    constructor(x,y,angle){
        this.x=x; this.y=y;
        this.angle=angle||0; // 0 = 朝右
        this.speed=0;
        this.steering=0; // -1~1
        this.gear='P';
        this.odometer=0;
        this.width=CFG.CAR_W;
        this.length=CFG.CAR_L;
        this.braking=false;
        // 8 路超声波雷达 (offX 前正, offY 左正)
        const hw=CFG.CAR_W/2, hl=CFG.CAR_L/2;
        this.radars=[
            new Radar('FL','前左',  hl-0.1, -hw+0.1, deg2rad(-35), '#00d4ff'),
            new Radar('FC','前中',  hl-0.05, 0,       0,            '#00d4ff'),
            new Radar('FR','前右',  hl-0.1,  hw-0.1,  deg2rad(35),  '#00d4ff'),
            new Radar('SL','左侧',  0.2,    -hw,      deg2rad(-90), '#00e5a0'),
            new Radar('SR','右侧',  0.2,     hw,      deg2rad(90),  '#00e5a0'),
            new Radar('RL','后左',  -hl+0.1, -hw+0.1, deg2rad(-145),'#ff6b9d'),
            new Radar('RC','后中',  -hl+0.05, 0,      deg2rad(180), '#ff6b9d'),
            new Radar('RR','后右',  -hl+0.1,  hw-0.1,  deg2rad(145),'#ff6b9d'),
        ];
    }
    update(dt, input){
        // 档位逻辑
        let throttle=0;
        if(input.up) throttle=1;
        else if(input.down) throttle=-1;

        if(this.gear==='P'){
            // P档驻车锁死，完全不动，忽略所有油门输入
            this.speed=0;
        }
        else if(this.gear==='N'){
            // N档空挡滑行，无动力输出，仅摩擦阻力减速
            this.speed*=0.92;
        }
        else if(this.gear==='D'){
            // D档前进：油门前进，松油门减速，不可倒退
            if(throttle>0) this.speed=Math.min(this.speed+CFG.CAR_ACCEL*dt, CFG.CAR_MAXSPD);
            else if(throttle<0) this.speed=Math.max(this.speed-CFG.CAR_DECEL*dt, 0);
            else this.speed*=0.95;
        }
        else if(this.gear==='R'){
            // R档倒车：油门倒车，松油门减速，不可前进
            if(throttle<0) this.speed=Math.max(this.speed-CFG.CAR_ACCEL*dt, -CFG.CAR_MAXSPD);
            else if(throttle>0) this.speed=Math.min(this.speed+CFG.CAR_DECEL*dt, 0);
            else this.speed*=0.95;
        }

        if(input.brake||this.braking){
            this.speed*=0.6;
        }

        this.speed=clamp(this.speed,-CFG.CAR_MAXSPD,CFG.CAR_MAXSPD);
        if(Math.abs(this.speed)<0.01) this.speed=0;

        // 转向 (支持比例转向)
        let steer=0;
        if(input.steerVal !== undefined){
            steer = input.steerVal;
        } else {
            if(input.left) steer=-1;
            else if(input.right) steer=1;
        }
        this.steering=lerp(this.steering, steer, 0.2);

        // 自行车模型
        if(Math.abs(this.speed)>0.01){
            const turnAngle=this.steering*deg2rad(30);
            const turnRadius=CFG.WHEELBASE/Math.tan(Math.abs(turnAngle)+0.001);
            const angularVel=this.speed/turnRadius*Math.sign(turnAngle);
            this.angle+=angularVel*dt;
            this.x+=Math.cos(this.angle)*this.speed*dt;
            this.y+=Math.sin(this.angle)*this.speed*dt;
            this.odometer+=Math.abs(this.speed)*dt;
        }
    }
    getCorners(){
        const hl=CFG.CAR_L/2, hw=CFG.CAR_W/2;
        const cs=Math.cos(this.angle), sn=Math.sin(this.angle);
        return [
            {x:this.x+hl*cs-hw*sn, y:this.y+hl*sn+hw*cs},
            {x:this.x+hl*cs+hw*sn, y:this.y+hl*sn-hw*cs},
            {x:this.x-hl*cs+hw*sn, y:this.y-hl*sn-hw*cs},
            {x:this.x-hl*cs-hw*sn, y:this.y-hl*sn+hw*cs},
        ];
    }
}

// ==================== 音频报警系统 ====================
class AlarmAudio {
    constructor(){
        this.enabled=true;
        this.ctx=null;
        this.lastBeep=0;
        this.currentLevel='safe';
    }
    init(){
        if(!this.ctx){
            try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
        }
    }
    setLevel(level){
        this.currentLevel=level;
    }
    update(now){
        if(!this.enabled||!this.ctx) return;
        const configs={
            safe:    {freq:0, interval:0},
            caution: {freq:880, interval:2000},
            warning: {freq:1320,interval:1000},
            danger:  {freq:1760,interval:300},
        };
        const cfg=configs[this.currentLevel]||configs.safe;
        if(cfg.freq===0) return;
        if(now-this.lastBeep>=cfg.interval){
            this.beep(cfg.freq, this.currentLevel==='danger'?0.12:0.08);
            this.lastBeep=now;
        }
    }
    beep(freq, duration){
        if(!this.ctx) return;
        const osc=this.ctx.createOscillator();
        const gain=this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.value=freq;
        osc.type='sine';
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+duration);
        osc.start(this.ctx.currentTime);
        osc.stop(this.ctx.currentTime+duration);
    }
}

// ==================== 仿真主控 ====================
class Simulation {
    constructor(){
        this.car=null;
        this.obstacles=[];
        this.npcVehicles=[];      // 社会车辆 (动态障碍物)
        this.parkingSpot=null;    // 蓝色停车位框 (非障碍物)
        this.currentScene='parking';
        this.riskLevel='safe';
        this.minDistance=CFG.RADAR_RANGE;
        this.nearestRadar=null;
        this.startTime=Date.now();
        this.alertCount=0;
        this.dangerCount=0;
        this.lastRiskLevel='safe';
        this.autoDemo=false;
        this.autoDemoPhase=0;
        this.autoDemoTimer=0;
        this.warnings=[];
        this.maxWarnings=20;
        this.logs=[];
        this.maxLogs=100;
    }
    loadScene(sceneId){
        const scene=SCENES[sceneId];
        if(!scene) return;
        this.currentScene=sceneId;
        this.car=new Car(scene.car.x, scene.car.y, scene.car.angle);
        this.obstacles=scene.obstacles.map(o=>new Obstacle({...o}));
        // 加载停车位 (非障碍物，仅视觉引导)
        this.parkingSpot=scene.parkingSpot?{...scene.parkingSpot}:null;
        // 加载社会车辆
        this.npcVehicles=(scene.npcVehicles||[]).map(v=>({
            ...v, w:1.8, h:4.5, type:v.type||'oncoming',
        }));
        this.riskLevel='safe';
        this.minDistance=CFG.RADAR_RANGE;
        this.alertCount=0;
        this.dangerCount=0;
        this.startTime=Date.now();
        this.warnings=[];
        this.autoDemoPhase=0;
        this.autoDemoTimer=0;
        this.log('info','场景已加载: '+scene.name);
        this.log('info','8路超声波雷达已启动，采样频率 10Hz');
        if(this.parkingSpot) this.log('info','目标停车位已标定 (蓝色框)');
        if(this.npcVehicles.length>0) this.log('info','检测到 '+this.npcVehicles.length+' 辆社会车辆');
    }
    update(dt, input){
        // 自动演示模式
        if(this.autoDemo){
            this.runAutoDemo(dt);
        }
        // 更新社会车辆位置
        this.updateNpcVehicles(dt);
        this.car.update(dt, input);
        // 雷达扫描 (静态障碍物 + 社会车辆)
        const allObstacles=[...this.obstacles, ...this.npcVehicles.map(v=>new Obstacle({
            type:'rect', category:'car', x:v.x, y:v.y, w:v.h, h:v.w, angle:v.angle,
        }))];
        for(const r of this.car.radars){
            r.scan(this.car, allObstacles);
        }
        // 计算风险等级
        this.assessRisk();
    }
    updateNpcVehicles(dt){
        for(const v of this.npcVehicles){
            if(v.type==='oncoming'){
                // 对向来车: 从右向左行驶，循环
                if(v.x<-20){ v.x=20; }
                // 会车时减速: 接近玩家车时放慢
                const dx=Math.abs(v.x-this.car.x);
                if(dx<3.0){ v.speed=0.8; } else { v.speed=1.8; }
                v.x+=Math.cos(v.angle)*v.speed*dt;
            } else if(v.type==='following'){
                // 跟随车: 同向行驶，保持安全距离
                if(v.x>20){ v.x=-20; }
                const dx=this.car.x-v.x;
                if(dx>0 && dx<5.5){
                    v.speed=0; // 前方有车，保持安全距离停止
                } else if(dx>=5.5 && dx<7){
                    v.speed=0.5; // 缓慢跟随
                } else if(dx<=0 && dx>-5){
                    v.speed=0; // 玩家车倒车接近，停止避让
                } else {
                    v.speed=1.2; // 正常速度
                }
                v.x+=Math.cos(v.angle)*v.speed*dt;
            }
        }
    }
    assessRisk(){
        let minD=CFG.RADAR_RANGE;
        let nearest=null;
        for(const r of this.car.radars){
            if(r.detected && r.distance<minD){
                minD=r.distance;
                nearest=r;
            }
        }
        this.minDistance=minD;
        this.nearestRadar=nearest;
        let level='safe';
        if(minD<CFG.TH_DANGER) level='danger';
        else if(minD<CFG.TH_WARNING) level='warning';
        else if(minD<CFG.TH_CAUTION) level='caution';
        else if(minD<CFG.TH_SAFE) level='caution';
        else level='safe';

        // 等级变化时记录
        if(level!==this.lastRiskLevel){
            this.onRiskChange(this.lastRiskLevel, level);
            this.lastRiskLevel=level;
        }
        this.riskLevel=level;
    }
    onRiskChange(from, to){
        const levels={safe:0,caution:1,warning:2,danger:3};
        if(levels[to]>levels[from]){
            if(to==='caution'){
                this.alertCount++;
                this.addWarning('caution', `${this.nearestRadar?.label||''}方向检测到障碍物 (${fmtDist(this.minDistance)})`);
                this.log('warn','注意: '+this.nearestRadar?.label+' 距离 '+fmtDist(this.minDistance));
            } else if(to==='warning'){
                this.alertCount++;
                this.addWarning('warning', `⚠ ${this.nearestRadar?.label||''}方向障碍物逼近 (${fmtDist(this.minDistance)})，建议减速`);
                this.log('warn','警告: '+this.nearestRadar?.label+' 逼近至 '+fmtDist(this.minDistance));
            } else if(to==='danger'){
                this.dangerCount++;
                this.addWarning('danger', `⛔ 危险！${this.nearestRadar?.label||''}方向极近 (${fmtDist(this.minDistance)})，立即刹车！`);
                this.log('err','危险: '+this.nearestRadar?.label+' 仅剩 '+fmtDist(this.minDistance)+' 触发紧急制动');
            }
        } else if(to==='safe' && from!=='safe'){
            this.addWarning('info', '盲区已清除，周围安全');
            this.log('ok','盲区安全，预警解除');
        }
    }
    addWarning(level, msg){
        const now=new Date();
        const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        this.warnings.unshift({level, msg, time});
        if(this.warnings.length>this.maxWarnings) this.warnings.pop();
    }
    log(tag, msg){
        const now=new Date();
        const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0')}`;
        this.logs.push({tag, msg, time});
        if(this.logs.length>this.maxLogs) this.logs.shift();
    }
    runAutoDemo(dt){
        this.autoDemoTimer+=dt;
        // 根据场景类型选择不同的自动演示逻辑
        if(this.currentScene==='narrow'){
            this.runNarrowAutoDemo(dt);
        } else {
            this.runParkingAutoDemo(dt);
        }
    }
    runParkingAutoDemo(dt){
        const car=this.car;
        const phase=this.autoDemoPhase;
        const target = this.parkingSpot;
        const tx = target ? target.x : 0;
        const ty = target ? target.y : -1.5;
        // 判断是否为侧方停车 (基于场景类型，不基于位置，避免中途切换逻辑)
        const isParallel = this.currentScene==='parallel';
        // 侧方停车限速更慢
        const maxAutoSpeed = isParallel ? 0.5 : 1.2;
        if(Math.abs(car.speed) > maxAutoSpeed){
            car.speed = Math.sign(car.speed) * maxAutoSpeed;
        }
        const headingDeg = car.angle * 180 / Math.PI;

        if(phase===0){
            car.gear='R';
            this._parallelSub = 0; // 重置S曲线子阶段
            this.log('info','自动演示: 挂入倒档，开始倒车入库');
            this.autoDemoPhase=1;
            this._autoReverseStart={x:car.x, y:car.y};
        } else if(phase===1){
            const distToTarget = dist(car.x, car.y, tx, ty);
            const reverseDist = dist(car.x, car.y, this._autoReverseStart.x, this._autoReverseStart.y);
            car.braking=false;
            const dx = tx - car.x;

            if(isParallel){
                // === 侧方停车 S曲线 (车位在车辆右侧) ===
                // 使用子阶段状态机: 0=摆入, 1=回正, 2=微调
                if(this._parallelSub === undefined) this._parallelSub = 0;

                if(this._parallelSub === 0){
                    // 1a: 向左打方向倒车，车尾向右摆入车位 (需足够旋转产生横向位移)
                    const steerStrength = 0.6;
                    this._autoInput={down:true, up:false, steerVal: -steerStrength, brake:false};
                    // 车身左转到约115° → 进入回正阶段 (产生足够横向位移)
                    if(headingDeg > 115){
                        this._parallelSub = 1;
                        this.log('info','自动演示: 车尾摆入车位，开始回正车身');
                    }
                } else if(this._parallelSub === 1){
                    // 1b: 向右打方向，回正车身
                    this._autoInput={down:true, up:false, steerVal: 0.5, brake:false};
                    // 车身回正 → 进入微调阶段
                    if(headingDeg < 92){
                        this._parallelSub = 2;
                        this.log('info','自动演示: 车身已回正，微调入位');
                    }
                } else {
                    // 1c: 直退微调，接近目标
                    let steer = 0;
                    if(Math.abs(dx) > 0.15){ steer = clamp(-dx * 0.3, -0.3, 0.3); }
                    this._autoInput={down:true, up:false, steerVal: steer, brake:false};
                    if(distToTarget < 0.5){
                        this.autoDemoPhase=2;
                        this.log('info','自动演示: 接近停车位，开始制动对正');
                    }
                }
            } else {
                // === 车库/侧方停车: 直退+比例微调 ===
                let steer = 0;
                if(reverseDist > 0.3 && Math.abs(dx) > 0.15){
                    steer = clamp(-dx * 0.5, -0.6, 0.6);
                }
                this._autoInput={down:true, up:false, steerVal: steer, brake:false};
                if(distToTarget < 0.6){
                    this.autoDemoPhase=2;
                    this.log('info','自动演示: 接近停车位，开始制动对正');
                }
            }
            // 安全制动
            if(this.riskLevel==='danger'){
                car.braking=true;
                this._autoInput={down:false, up:false, left:false, right:false, brake:true};
                this._autoBrakePos={x:car.x, y:car.y};
                this.autoDemoPhase=4;
                this.log('warn','自动演示: 检测到危险障碍物，制动恢复');
            }
        } else if(phase===2){
            // 微调对正停车位
            const distToTarget = dist(car.x, car.y, tx, ty);
            if(distToTarget > 0.3){
                car.braking=false;
                const dx = tx - car.x;
                let steer = 0;
                if(Math.abs(dx) > 0.15){ steer = clamp(-dx * 0.5, -0.5, 0.5); }
                this._autoInput={down:true, up:false, steerVal: steer, brake:false};
            } else {
                car.braking=true;
                this._autoInput={down:false, up:false, left:false, right:false, brake:true};
                if(Math.abs(car.speed) < 0.05){
                    car.gear='P';
                    this.autoDemoPhase=3;
                    this.log('ok','自动演示: 车辆已停入停车位，挂入P档');
                    this.addWarning('info','✓ 自动泊车演示完成，车辆已入库');
                }
            }
            if(this.riskLevel==='danger'){
                car.braking=true;
                this._autoInput={down:false, up:false, left:false, right:false, brake:true};
                this._autoBrakePos={x:car.x, y:car.y};
                this.autoDemoPhase=4;
            }
        } else if(phase===3){
            this._autoInput={down:false,up:false,left:false,right:false,brake:false};
        } else if(phase===4){
            // 危险恢复: 先停车，再前进脱离危险，最后恢复倒车
            if(this.riskLevel === 'danger' && Math.abs(car.speed) > 0.05){
                // 危险且仍在运动 - 紧急制动
                car.braking=true;
                this._autoInput={down:false, up:false, left:false, right:false, brake:true};
            } else if(this.riskLevel === 'danger'){
                // 危险但已停车 - 前进脱离
                car.braking=false;
                car.gear='D';
                this._autoInput={up:true, down:false, left:false, right:false, brake:false};
            } else {
                // 危险解除 - 恢复倒车，但跳过已完成的摆入阶段
                car.braking=false;
                car.gear='R';
                this.autoDemoPhase=1;
                // 不重置_parallelSub，跳到微调阶段避免重复摆入
                if(this._parallelSub === 0){
                    this._parallelSub = 1;
                }
                this._autoReverseStart={x:car.x, y:car.y};
                this.log('info','自动演示: 危险解除，恢复倒车入库');
            }
        }
    }
    runNarrowAutoDemo(dt){
        const car=this.car;
        const phase=this.autoDemoPhase;

        // 循环演示: 车辆驶出演示区域后重置场景
        if(car.x > 12 && phase !== 0){
            this.loadScene('narrow');
            this.autoDemo = true;
            this.autoDemoPhase = 0;
            this.autoDemoTimer = 0;
            this.log('info','自动演示: 循环演示，重置场景');
            return;
        }

        // 获取社会车辆信息
        const oncoming=this.npcVehicles.find(v=>v.type==='oncoming');
        const distToOncoming = oncoming ? Math.abs(oncoming.x - car.x) : 999;

        if(phase===0){
            // 起步: D档前进
            car.gear='D';
            this.log('info','自动演示: 挂入D档，开始行驶');
            this.autoDemoPhase=1;
        } else if(phase===1){
            // 正常行驶，监控来车与障碍物
            car.braking=false;

            if(this.riskLevel==='danger'){
                // 检测到危险障碍物 - 紧急制动
                car.braking=true;
                this._autoInput={up:false,down:false,left:false,right:false,brake:true};
                this.log('warn','自动演示: 检测到障碍物，紧急制动确认安全');
                this.autoDemoPhase=5;
            } else if(this.riskLevel==='warning'){
                // 障碍物接近 - 减速慢行
                this._autoInput={up:true,down:false,left:false,right:false,brake:false};
                if(car.speed > 0.5) car.speed = 0.5;
                if(this.autoDemoTimer % 2 < 0.1){
                    this.log('info','自动演示: 障碍物接近，减速慢行确认安全');
                }
            } else if(distToOncoming < 4.0){
                // 检测到社会车辆 - 减速慢行，不停止
                this._autoInput={up:true,down:false,left:false,right:false,brake:false};
                if(car.speed > 0.5) car.speed = 0.5;
                if(this.autoDemoTimer % 3 < 0.1){
                    this.log('info','自动演示: 检测到来车，减速慢行保持车道');
                }
            } else {
                // 安全 - 正常行驶
                this._autoInput={up:true,down:false,left:false,right:false,brake:false};
            }
        } else if(phase===5){
            // 障碍物制动后确认安全
            car.braking=true;
            this._autoInput={up:false,down:false,left:false,right:false,brake:true};
            if(this.riskLevel !== 'danger' && this.riskLevel !== 'warning'){
                // 环境已安全
                car.braking=false;
                car.gear='D';
                this.autoDemoPhase=1;
                this.log('info','自动演示: 环境确认安全，恢复行驶');
            }
        }
    }
    getAutoInput(){
        return this.autoDemo ? (this._autoInput||{}) : null;
    }
}

// ==================== 渲染器 ====================
class Renderer {
    constructor(canvas){
        this.canvas=canvas;
        this.ctx=canvas.getContext('2d');
        this.dpr=window.devicePixelRatio||1;
        this.resize();
    }
    resize(){
        const r=this.canvas.getBoundingClientRect();
        this.canvas.width=r.width*this.dpr;
        this.canvas.height=r.height*this.dpr;
        this.w=r.width;
        this.h=r.height;
        this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    }
    render(sim){
        const ctx=this.ctx;
        ctx.clearRect(0,0,this.w,this.h);
        // 背景
        ctx.fillStyle='#070b14';
        ctx.fillRect(0,0,this.w,this.h);
        // 相机跟随车辆, 车头朝上
        const camX=this.w/2, camY=this.h/2;
        ctx.save();
        ctx.translate(camX, camY);
        ctx.rotate(-sim.car.angle - Math.PI/2); // 车头朝上
        ctx.scale(CFG.PPM, CFG.PPM);
        ctx.translate(-sim.car.x, -sim.car.y);

        this.drawGrid(ctx, sim);
        this.drawLaneLines(ctx, sim);
        this.drawParkingSpot(ctx, sim);
        this.drawObstacles(ctx, sim);
        this.drawNpcVehicles(ctx, sim);
        this.drawRadarCones(ctx, sim);
        this.drawRadarHits(ctx, sim);
        this.drawCar(ctx, sim);
        this.drawDistanceRings(ctx, sim);

        ctx.restore();
    }
    drawGrid(ctx, sim){
        const range=12;
        const gx=Math.floor(sim.car.x/range)*range;
        const gy=Math.floor(sim.car.y/range)*range;
        ctx.strokeStyle='rgba(36,48,86,0.4)';
        ctx.lineWidth=1/CFG.PPM;
        for(let i=-2;i<=2;i++){
            const x=gx+i*range;
            ctx.beginPath(); ctx.moveTo(x,gy-range*2); ctx.lineTo(x,gy+range*2); ctx.stroke();
            const y=gy+i*range;
            ctx.beginPath(); ctx.moveTo(gx-range*2,y); ctx.lineTo(gx+range*2,y); ctx.stroke();
        }
    }
    drawLaneLines(ctx, sim){
        // 仅窄路会车场景绘制车道线
        if(sim.currentScene!=='narrow') return;
        // 车道中心线 (y=0)
        ctx.strokeStyle='rgba(255,214,0,0.4)';
        ctx.lineWidth=2/CFG.PPM;
        ctx.setLineDash([0.5,0.3]);
        ctx.beginPath();
        ctx.moveTo(sim.car.x-15, 0);
        ctx.lineTo(sim.car.x+15, 0);
        ctx.stroke();
        ctx.setLineDash([]);
        // 本车道边缘提示线 (y=-1.2)
        ctx.strokeStyle='rgba(0,230,118,0.2)';
        ctx.lineWidth=1/CFG.PPM;
        ctx.beginPath();
        ctx.moveTo(sim.car.x-15, -1.2);
        ctx.lineTo(sim.car.x+15, -1.2);
        ctx.stroke();
        // 对向车道边缘提示线 (y=1.2)
        ctx.strokeStyle='rgba(255,100,100,0.2)';
        ctx.beginPath();
        ctx.moveTo(sim.car.x-15, 1.2);
        ctx.lineTo(sim.car.x+15, 1.2);
        ctx.stroke();
    }
    drawParkingSpot(ctx, sim){
        if(!sim.parkingSpot) return;
        const ps=sim.parkingSpot;
        ctx.save();
        ctx.translate(ps.x, ps.y);
        ctx.rotate(ps.angle||0);
        // 蓝色虚线框
        ctx.strokeStyle='#2196f3';
        ctx.lineWidth=3/CFG.PPM;
        ctx.setLineDash([0.2,0.15]);
        ctx.strokeRect(-ps.w/2, -ps.h/2, ps.w, ps.h);
        ctx.setLineDash([]);
        // 半透明蓝色填充
        ctx.fillStyle='rgba(33,150,243,0.08)';
        ctx.fillRect(-ps.w/2, -ps.h/2, ps.w, ps.h);
        // "P" 标识
        ctx.fillStyle='rgba(33,150,243,0.4)';
        ctx.font=`bold ${0.6}px ${'Arial'}`;
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('P', 0, 0);
        ctx.restore();
    }
    drawNpcVehicles(ctx, sim){
        for(const v of sim.npcVehicles){
            ctx.save();
            ctx.translate(v.x, v.y);
            ctx.rotate(v.angle);
            // 车身阴影
            ctx.fillStyle='rgba(0,0,0,0.3)';
            ctx.fillRect(-v.h/2+0.05, -v.w/2+0.05, v.h, v.w);
            // 车身 (社会车辆用不同颜色)
            const grad=ctx.createLinearGradient(0,-v.w/2,0,v.w/2);
            grad.addColorStop(0,'#4a5a7b');
            grad.addColorStop(0.5,'#3a4a6b');
            grad.addColorStop(1,'#2a3a5b');
            ctx.fillStyle=grad;
            ctx.fillRect(-v.h/2, -v.w/2, v.h, v.w);
            // 车窗
            ctx.fillStyle='rgba(100,200,255,0.15)';
            ctx.fillRect(-v.h/2+0.6, -v.w/2+0.15, v.h-1.8, v.w-0.3);
            // 边框
            ctx.strokeStyle='rgba(255,255,255,0.2)';
            ctx.lineWidth=1/CFG.PPM;
            ctx.strokeRect(-v.h/2, -v.w/2, v.h, v.w);
            // 车头灯
            ctx.fillStyle='#fff8e1';
            ctx.fillRect(v.h/2-0.08, -v.w/2+0.1, 0.08, 0.3);
            ctx.fillRect(v.h/2-0.08, v.w/2-0.4, 0.08, 0.3);
            // 尾灯
            ctx.fillStyle='#ff1744';
            ctx.fillRect(-v.h/2, -v.w/2+0.1, 0.08, 0.3);
            ctx.fillRect(-v.h/2, v.w/2-0.4, 0.08, 0.3);
            ctx.restore();
        }
    }
    drawObstacles(ctx, sim){
        for(const obs of sim.obstacles){
            const colors={
                pedestrian:'#ff9100', pillar:'#78909c', wall:'#455a64',
                barrier:'#ffd600', car:'#5c6bc0', curb:'#8d6e63',
            };
            const c=colors[obs.category]||'#666';
            if(obs.type==='circle'){
                ctx.fillStyle=c;
                ctx.globalAlpha=0.7;
                ctx.beginPath();
                ctx.arc(obs.x,obs.y,obs.r,0,Math.PI*2);
                ctx.fill();
                ctx.globalAlpha=1;
                ctx.strokeStyle=c;
                ctx.lineWidth=2/CFG.PPM;
                ctx.stroke();
                // 行人图标
                if(obs.category==='pedestrian'){
                    ctx.fillStyle='#fff';
                    ctx.font=`${obs.r*1.5}px sans-serif`;
                    ctx.textAlign='center';
                    ctx.textBaseline='middle';
                    ctx.fillText('🚶',obs.x,obs.y);
                }
            } else {
                ctx.save();
                ctx.translate(obs.x,obs.y);
                ctx.rotate(obs.angle||0);
                ctx.fillStyle=c;
                ctx.globalAlpha=0.7;
                ctx.fillRect(-obs.w/2,-obs.h/2,obs.w,obs.h);
                ctx.globalAlpha=1;
                ctx.strokeStyle=c;
                ctx.lineWidth=2/CFG.PPM;
                ctx.strokeRect(-obs.w/2,-obs.h/2,obs.w,obs.h);
                // 标签
                if(obs.category==='car'){
                    // 车窗
                    ctx.fillStyle='rgba(0,0,0,0.3)';
                    ctx.fillRect(-obs.w/2+0.15,-obs.h/2+0.6,obs.w-0.3,obs.h-1.6);
                }
                if(obs.category==='barrier'){
                    // 警示条纹
                    ctx.fillStyle='#000';
                    for(let i=0;i<4;i++){
                        ctx.fillRect(-obs.w/2+i*obs.w/4,-obs.h/2,obs.w/8,obs.h);
                    }
                }
                ctx.restore();
            }
        }
    }
    drawRadarCones(ctx, sim){
        const halfFov=CFG.RADAR_FOV/2;
        for(const r of sim.car.radars){
            const wp=r.worldPos(sim.car);
            const levelColor=this.radarColor(r.distance, r.detected);
            ctx.fillStyle=levelColor.fill;
            ctx.strokeStyle=levelColor.stroke;
            ctx.lineWidth=1/CFG.PPM;
            ctx.beginPath();
            ctx.moveTo(wp.x, wp.y);
            const steps=20;
            for(let i=0;i<=steps;i++){
                const a=wp.angle-halfFov+(CFG.RADAR_FOV*i/steps);
                const d=r.detected?r.distance:CFG.RADAR_RANGE;
                ctx.lineTo(wp.x+Math.cos(a)*d, wp.y+Math.sin(a)*d);
            }
            ctx.closePath();
            ctx.globalAlpha=0.15;
            ctx.fill();
            ctx.globalAlpha=0.5;
            ctx.stroke();
            ctx.globalAlpha=1;
        }
    }
    drawRadarHits(ctx, sim){
        for(const r of sim.car.radars){
            if(!r.detected) continue;
            const wp=r.worldPos(sim.car);
            const c=this.radarColor(r.distance, true);
            // 命中点
            ctx.fillStyle=c.stroke;
            ctx.beginPath();
            ctx.arc(r.hitX, r.hitY, 0.1, 0, Math.PI*2);
            ctx.fill();
            // 距离线
            ctx.strokeStyle=c.stroke;
            ctx.lineWidth=1.5/CFG.PPM;
            ctx.setLineDash([0.05,0.05]);
            ctx.beginPath();
            ctx.moveTo(wp.x, wp.y);
            ctx.lineTo(r.hitX, r.hitY);
            ctx.stroke();
            ctx.setLineDash([]);
            // 距离文字
            ctx.fillStyle=c.stroke;
            ctx.font=`bold ${0.2}px ${'Consolas'}`;
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            const mx=(wp.x+r.hitX)/2, my=(wp.y+r.hitY)/2;
            ctx.save();
            ctx.translate(mx,my);
            ctx.rotate(sim.car.angle+Math.PI/2);
            ctx.fillText(fmtDist(r.distance),0,0);
            ctx.restore();
        }
    }
    drawCar(ctx, sim){
        const car=sim.car;
        const hl=CFG.CAR_L/2, hw=CFG.CAR_W/2;
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        // 车身阴影
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.fillRect(-hl+0.05, -hw+0.05, CFG.CAR_L, CFG.CAR_W);
        // 车身
        const grad=ctx.createLinearGradient(0,-hw,0,hw);
        grad.addColorStop(0,'#3a4a6b');
        grad.addColorStop(0.5,'#2a3a5b');
        grad.addColorStop(1,'#1a2a4b');
        ctx.fillStyle=grad;
        ctx.fillRect(-hl, -hw, CFG.CAR_L, CFG.CAR_W);
        // 车窗
        ctx.fillStyle='rgba(100,200,255,0.15)';
        ctx.fillRect(-hl+0.6, -hw+0.15, CFG.CAR_L-1.8, CFG.CAR_W-0.3);
        // 车顶线
        ctx.strokeStyle='rgba(0,212,255,0.3)';
        ctx.lineWidth=1/CFG.PPM;
        ctx.strokeRect(-hl, -hw, CFG.CAR_L, CFG.CAR_W);
        // 前挡风
        ctx.fillStyle='rgba(100,200,255,0.2)';
        ctx.beginPath();
        ctx.moveTo(hl-1.2, -hw+0.1);
        ctx.lineTo(hl-0.3, -hw+0.35);
        ctx.lineTo(hl-0.3, hw-0.35);
        ctx.lineTo(hl-1.2, hw-0.1);
        ctx.closePath();
        ctx.fill();
        // 后挡风
        ctx.beginPath();
        ctx.moveTo(-hl+1.2, -hw+0.1);
        ctx.lineTo(-hl+0.3, -hw+0.35);
        ctx.lineTo(-hl+0.3, hw-0.35);
        ctx.lineTo(-hl+1.2, hw-0.1);
        ctx.closePath();
        ctx.fill();
        // 车头灯
        ctx.fillStyle='#fff8e1';
        ctx.fillRect(hl-0.08, -hw+0.1, 0.08, 0.3);
        ctx.fillRect(hl-0.08, hw-0.4, 0.08, 0.3);
        // 尾灯
        ctx.fillStyle='#ff1744';
        ctx.fillRect(-hl, -hw+0.1, 0.08, 0.3);
        ctx.fillRect(-hl, hw-0.4, 0.08, 0.3);
        // 雷达传感器位置标记
        for(const r of car.radars){
            ctx.fillStyle=r.color;
            ctx.beginPath();
            ctx.arc(r.offX, r.offY, 0.06, 0, Math.PI*2);
            ctx.fill();
        }
        // 方向指示
        ctx.fillStyle='rgba(0,212,255,0.8)';
        ctx.beginPath();
        ctx.moveTo(hl+0.15, 0);
        ctx.lineTo(hl-0.05, -0.1);
        ctx.lineTo(hl-0.05, 0.1);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    drawDistanceRings(ctx, sim){
        // 在车周围画距离环
        const car=sim.car;
        const rings=[
            {r:CFG.TH_SAFE, color:'rgba(0,230,118,0.15)'},
            {r:CFG.TH_CAUTION, color:'rgba(255,214,0,0.15)'},
            {r:CFG.TH_WARNING, color:'rgba(255,145,0,0.15)'},
            {r:CFG.TH_DANGER, color:'rgba(255,23,68,0.15)'},
        ];
        for(const ring of rings){
            ctx.strokeStyle=ring.color;
            ctx.lineWidth=1/CFG.PPM;
            ctx.setLineDash([0.1,0.1]);
            ctx.beginPath();
            ctx.arc(car.x, car.y, ring.r+CFG.CAR_L/2, 0, Math.PI*2);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }
    radarColor(d, detected){
        if(!detected) return {fill:'rgba(0,212,255,0.08)', stroke:'rgba(0,212,255,0.3)'};
        if(d<CFG.TH_DANGER) return {fill:'rgba(255,23,68,0.25)', stroke:'#ff1744'};
        if(d<CFG.TH_WARNING) return {fill:'rgba(255,145,0,0.2)', stroke:'#ff9100'};
        if(d<CFG.TH_CAUTION) return {fill:'rgba(255,214,0,0.15)', stroke:'#ffd600'};
        return {fill:'rgba(0,230,118,0.12)', stroke:'#00e676'};
    }
}

// ==================== HUD 渲染器 ====================
class HUDRenderer {
    constructor(canvas){
        this.canvas=canvas;
        this.ctx=canvas.getContext('2d');
        this.dpr=window.devicePixelRatio||1;
        this.resize();
    }
    resize(){
        const r=this.canvas.getBoundingClientRect();
        this.canvas.width=r.width*this.dpr;
        this.canvas.height=r.height*this.dpr;
        this.w=r.width;
        this.h=r.height;
        this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    }
    render(sim){
        const ctx=this.ctx;
        ctx.clearRect(0,0,this.w,this.h);
        const cx=this.w/2, cy=this.h/2;
        const R=Math.min(cx,cy)-8;

        // 背景圆
        ctx.fillStyle='rgba(7,11,20,0.8)';
        ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();

        // 距离环
        const rings=[
            {r:R*0.33, color:'rgba(255,23,68,0.3)'},
            {r:R*0.5, color:'rgba(255,145,0,0.3)'},
            {r:R*0.7, color:'rgba(255,214,0,0.3)'},
            {r:R*0.95, color:'rgba(0,230,118,0.3)'},
        ];
        for(const ring of rings){
            ctx.strokeStyle=ring.color;
            ctx.lineWidth=1;
            ctx.beginPath(); ctx.arc(cx,cy,ring.r,0,Math.PI*2); ctx.stroke();
        }
        // 十字线
        ctx.strokeStyle='rgba(36,48,86,0.6)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy);
        ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R);
        ctx.stroke();

        // 方向标识
        ctx.fillStyle='rgba(107,122,153,0.6)';
        ctx.font='10px Consolas';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('前',cx,cy-R-2);
        ctx.fillText('后',cx,cy+R+2);
        ctx.fillText('左',cx-R-2,cy);
        ctx.fillText('右',cx+R+2,cy);

        // 雷达扇形
        for(const r of sim.car.radars){
            if(!r.detected) continue;
            const wp=r.worldPos(sim.car);
            // 相对车辆的角度 (屏幕坐标: 上=前)
            let relAng = r.angle + sim.car.angle + Math.PI/2; // 转为屏幕坐标
            const distRatio=clamp(r.distance/CFG.RADAR_RANGE,0,1);
            const drawR=R*(1-distRatio)*0.95;
            const color=this.radarColor(r.distance);
            // 扇形
            const halfFov=CFG.RADAR_FOV/2;
            ctx.fillStyle=color.fill;
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            for(let i=0;i<=12;i++){
                const a=relAng-halfFov+(CFG.RADAR_FOV*i/12) - Math.PI/2;
                ctx.lineTo(cx+Math.cos(a)*drawR, cy+Math.sin(a)*drawR);
            }
            ctx.closePath();
            ctx.fill();
            // 点
            const px=cx+Math.cos(relAng-Math.PI/2)*drawR;
            const py=cy+Math.sin(relAng-Math.PI/2)*drawR;
            ctx.fillStyle=color.stroke;
            ctx.beginPath();
            ctx.arc(px,py,4,0,Math.PI*2);
            ctx.fill();
        }

        // 车辆图标
        ctx.fillStyle='rgba(0,212,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(cx,cy-R*0.12);
        ctx.lineTo(cx-R*0.06,cy+R*0.08);
        ctx.lineTo(cx+R*0.06,cy+R*0.08);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle='rgba(0,212,255,0.5)';
        ctx.lineWidth=1;
        ctx.stroke();

        // 中心最近距离
        if(sim.minDistance<CFG.RADAR_RANGE){
            ctx.fillStyle='#fff';
            ctx.font='bold 12px Consolas';
            ctx.textAlign='center';
            ctx.fillText(fmtDist(sim.minDistance), cx, cy+R*0.25);
        }
    }
    radarColor(d){
        if(d<CFG.TH_DANGER) return {fill:'rgba(255,23,68,0.4)', stroke:'#ff1744'};
        if(d<CFG.TH_WARNING) return {fill:'rgba(255,145,0,0.3)', stroke:'#ff9100'};
        if(d<CFG.TH_CAUTION) return {fill:'rgba(255,214,0,0.25)', stroke:'#ffd600'};
        return {fill:'rgba(0,230,118,0.2)', stroke:'#00e676'};
    }
}

// ==================== 主程序 ====================
const sim=new Simulation();
const canvas=document.getElementById('simCanvas');
const renderer=new Renderer(canvas);
const radarCanvas=document.getElementById('radarCanvas');
const hudRenderer=new HUDRenderer(radarCanvas);
const audio=new AlarmAudio();

sim.loadScene('parking');

// 输入状态
const input={up:false,down:false,left:false,right:false,brake:false};
const keyMap={
    'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
    'w':'up','s':'down','a':'left','d':'right','W':'up','S':'down','A':'left','D':'right',
    ' ':'brake',
};

window.addEventListener('keydown',e=>{
    if(keyMap[e.key]){ input[keyMap[e.key]]=true; e.preventDefault(); }
    if(e.key==='r'||e.key==='R'){ sim.loadScene(sim.currentScene); }
});
window.addEventListener('keyup',e=>{
    if(keyMap[e.key]){ input[keyMap[e.key]]=false; e.preventDefault(); }
});

// 按钮控制
const moveBtns={
    moveUp:'up', moveDown:'down', moveLeft:'left', moveRight:'right', moveBrake:'brake',
};
for(const [id,key] of Object.entries(moveBtns)){
    const btn=document.getElementById(id);
    const press=()=>{input[key]=true; audio.init();};
    const release=()=>{input[key]=false;};
    btn.addEventListener('mousedown',press);
    btn.addEventListener('mouseup',release);
    btn.addEventListener('mouseleave',release);
    btn.addEventListener('touchstart',e=>{e.preventDefault();press();});
    btn.addEventListener('touchend',e=>{e.preventDefault();release();});
}

// 场景切换
document.querySelectorAll('[data-scene]').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('[data-scene]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const scene=btn.dataset.scene;
        sim.loadScene(scene);
        const sc=SCENES[scene];
        document.getElementById('sceneName').textContent=sc.name;
        document.getElementById('sceneDesc').textContent=sc.desc;
    });
});

// 档位切换
document.querySelectorAll('[data-gear]').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('[data-gear]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        sim.car.gear=btn.dataset.gear;
        sim.log('info','档位切换: '+btn.dataset.gear);
        audio.init();
    });
});

// 自动演示
document.getElementById('autoDemoBtn').addEventListener('click',function(){
    sim.autoDemo=!sim.autoDemo;
    this.classList.toggle('active',sim.autoDemo);
    this.textContent=sim.autoDemo?'停止演示':'自动演示';
    if(sim.autoDemo){
        sim.loadScene(sim.currentScene);
        sim.autoDemo=true;
        sim.log('info','启动自动泊车演示');
        audio.init();
    } else {
        sim._autoInput=null;
        sim.log('info','停止自动演示');
    }
});

// 报警音开关
document.getElementById('soundBtn').addEventListener('click',function(){
    audio.enabled=!audio.enabled;
    audio.init();
    this.textContent=audio.enabled?'🔊 报警音':'🔇 已静音';
    this.classList.toggle('active',audio.enabled);
});

// 重置
document.getElementById('resetBtn').addEventListener('click',()=>{
    sim.loadScene(sim.currentScene);
});

// 日志切换
document.getElementById('logToggle').addEventListener('click',function(){
    const panel=document.getElementById('logPanel');
    panel.classList.toggle('visible');
    this.textContent=panel.classList.contains('visible')?'📋 遥测日志 ▾':'📋 遥测日志 ▸';
});
document.getElementById('logClear').addEventListener('click',()=>{
    sim.logs=[];
});

// 障碍物拖拽
let dragObs=null;
let dragOffset={x:0,y:0};
canvas.addEventListener('mousedown',e=>{
    const pos=screenToWorld(e.clientX,e.clientY);
    for(const obs of sim.obstacles){
        if(obs.contains(pos.x,pos.y)){
            dragObs=obs;
            dragOffset={x:pos.x-obs.x, y:pos.y-obs.y};
            break;
        }
    }
});
canvas.addEventListener('mousemove',e=>{
    if(!dragObs) return;
    const pos=screenToWorld(e.clientX,e.clientY);
    dragObs.x=pos.x-dragOffset.x;
    dragObs.y=pos.y-dragOffset.y;
});
canvas.addEventListener('mouseup',()=>{dragObs=null;});
canvas.addEventListener('mouseleave',()=>{dragObs=null;});

function screenToWorld(sx,sy){
    const r=canvas.getBoundingClientRect();
    const lx=sx-r.left, ly=sy-r.top;
    // 逆变换: screen -> world
    const dx=(lx-renderer.w/2)/CFG.PPM;
    const dy=(ly-renderer.h/2)/CFG.PPM;
    const ang=-sim.car.angle - Math.PI/2;
    const cs=Math.cos(-ang), sn=Math.sin(-ang);
    return {
        x: sim.car.x + dx*cs - dy*sn,
        y: sim.car.y + dx*sn + dy*cs,
    };
}

// 窗口大小变化
window.addEventListener('resize',()=>{
    renderer.resize();
    hudRenderer.resize();
});

// ==================== UI 更新 ====================
function updateUI(){
    // 风险等级
    const riskEl=document.getElementById('riskLevel');
    const riskIcon=document.getElementById('riskIcon');
    const riskText=document.getElementById('riskText');
    const riskDesc=document.getElementById('riskDesc');
    const riskOverlay=document.getElementById('riskOverlay');
    const riskData={
        safe:{icon:'✓',text:'安全',desc:'周围无近距离障碍物',cls:'safe'},
        caution:{icon:'⚠',text:'注意',desc:'检测到附近障碍物，请留意',cls:'caution'},
        warning:{icon:'⚠',text:'警告',desc:'障碍物逼近，建议减速',cls:'warning'},
        danger:{icon:'⛔',text:'危险',desc:'极近距离障碍物，立即刹车！',cls:'danger'},
    };
    const rd=riskData[sim.riskLevel];
    riskEl.className='risk-level '+rd.cls;
    riskIcon.textContent=rd.icon;
    riskText.textContent=rd.text;
    riskDesc.textContent=rd.desc;
    riskOverlay.className='risk-overlay '+(sim.riskLevel==='safe'?'':sim.riskLevel);

    // 距离条
    const distBars=document.getElementById('distBars');
    distBars.innerHTML='';
    for(const r of sim.car.radars){
        const row=document.createElement('div');
        row.className='dist-bar-row';
        const pct=clamp(r.distance/CFG.RADAR_RANGE,0,1)*100;
        const color=r.detected?(
            r.distance<CFG.TH_DANGER?'var(--danger)':
            r.distance<CFG.TH_WARNING?'var(--warning)':
            r.distance<CFG.TH_CAUTION?'var(--caution)':'var(--safe)'
        ):'var(--text-dim)';
        row.innerHTML=`
            <span class="dist-bar-label">${r.label}</span>
            <div class="dist-bar-track">
                <div class="dist-bar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <span class="dist-bar-value" style="color:${color}">${fmtDist(r.distance)}</span>
        `;
        distBars.appendChild(row);
    }

    // 最近障碍物
    if(sim.nearestRadar){
        const catNames={pedestrian:'行人',pillar:'立柱',wall:'墙壁',barrier:'矮墩',car:'车辆',curb:'路沿石'};
        document.getElementById('niDir').textContent=sim.nearestRadar.label;
        document.getElementById('niDist').textContent=fmtDist(sim.minDistance);
        document.getElementById('niType').textContent=catNames[sim.nearestRadar.hitObstacle?.category]||'未知';
    } else {
        document.getElementById('niDir').textContent='—';
        document.getElementById('niDist').textContent='—';
        document.getElementById('niType').textContent='无';
    }

    // 车辆状态
    document.getElementById('vsGear').textContent=sim.car.gear;
    document.getElementById('vsSpeed').textContent=Math.abs(Math.round(sim.car.speed*3.6));
    document.getElementById('vsHeading').textContent=Math.round(rad2deg(sim.car.angle)%360)+'°';
    document.getElementById('vsOdo').textContent=sim.car.odometer.toFixed(1)+'m';

    // 统计
    document.getElementById('statAlerts').textContent=sim.alertCount;
    document.getElementById('statDangers').textContent=sim.dangerCount;
    document.getElementById('statTime').textContent=Math.round((Date.now()-sim.startTime)/1000)+'s';

    // 警告信息
    const wa=document.getElementById('warningArea');
    if(sim.warnings.length===0){
        wa.innerHTML='<div class="no-warning">暂无预警信息</div>';
    } else {
        wa.innerHTML=sim.warnings.map(w=>
            `<div class="warning-msg ${w.level}"><span class="w-time">${w.time}</span><span>${w.msg}</span></div>`
        ).join('');
    }

    // 日志
    const lc=document.getElementById('logContent');
    lc.innerHTML=sim.logs.slice(-30).reverse().map(l=>
        `<div class="log-entry"><span class="log-time">${l.time}</span><span class="log-tag ${l.tag}">${l.tag.toUpperCase()}</span><span class="log-msg">${l.msg}</span></div>`
    ).join('');

    // 时钟
    const now=new Date();
    document.getElementById('clock').textContent=
        `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    // 系统状态
    if(sim.autoDemo){
        document.getElementById('sysStatus').textContent='自动演示中';
        document.getElementById('sysDot').style.background='var(--accent)';
    } else if(sim.riskLevel==='danger'){
        document.getElementById('sysStatus').textContent='危险报警';
        document.getElementById('sysDot').style.background='var(--danger)';
    } else if(sim.riskLevel!=='safe'){
        document.getElementById('sysStatus').textContent='预警中';
        document.getElementById('sysDot').style.background='var(--caution)';
    } else {
        document.getElementById('sysStatus').textContent='系统就绪';
        document.getElementById('sysDot').style.background='var(--safe)';
    }
}

// ==================== 主循环 ====================
let lastTime=performance.now();
function loop(){
    const now=performance.now();
    const dt=Math.min(0.05,(now-lastTime)/1000);
    lastTime=now;

    // 合并自动演示输入
    const autoInput=sim.getAutoInput();
    const effInput=autoInput||input;

    sim.update(dt, effInput);
    audio.setLevel(sim.riskLevel);
    audio.update(now);
    renderer.render(sim);
    hudRenderer.render(sim);
    updateUI();
}
// 使用 setInterval 确保标签页不可见时仿真仍然运行
setInterval(loop, 33);

// 初始化日志
sim.log('info','泊车辅助盲区预警系统启动');
sim.log('info','8路超声波雷达初始化完成');
sim.log('info','HUD抬头显示系统就绪');
sim.log('ok','系统自检通过，等待操作');
</script>
