<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠友圈 · 养宠助手 Demo</title>
<style>
/* ===== Design Tokens ===== */
:root{
  --primary-50:#FBF0EC;--primary-100:#F5DDD3;--primary-200:#EDC5B6;--primary-300:#E0A892;
  --primary-400:#D28D74;--primary-500:#C4715A;--primary-600:#B56048;--primary-700:#9E4F3C;
  --primary-800:#864033;--primary-900:#6E3329;
  --secondary-50:#F0F4ED;--secondary-100:#DCE5D4;--secondary-200:#C2D0B5;--secondary-300:#A5B896;
  --secondary-400:#92A685;--secondary-500:#8A9B7E;--secondary-600:#7A8B6E;--secondary-700:#6A7A5E;
  --secondary-800:#586850;--secondary-900:#475640;
  --success:#4CAF50;--success-bg:#E8F5E9;--warning:#FF9800;--warning-bg:#FFF3E0;
  --error:#F44336;--error-bg:#FFEBEE;--info:#2196F3;--info-bg:#E3F2FD;
  --ink:#2D2420;--muted:#8B7E78;--rule:#E8DDD6;--bg:#FDF8F3;--bg2:#FFFFFF;--bg3:#F5EDE6;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px;
  --shadow-1:0 1px 2px rgba(45,36,32,.06);--shadow-2:0 2px 8px rgba(45,36,32,.08);
  --shadow-3:0 4px 16px rgba(45,36,32,.1);--shadow-4:0 8px 32px rgba(45,36,32,.12);
  --duration-fast:150ms;--duration-normal:250ms;--duration-slow:400ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in:cubic-bezier(0.4,0,1,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}

/* ===== Phone Frame ===== */
.phone-frame{width:390px;height:844px;margin:20px auto;background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 0 0 12px #1a1a1a,0 0 0 14px #333,var(--shadow-4);display:flex;flex-direction:column}
@media(max-width:420px){.phone-frame{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}}
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;flex-shrink:0;position:relative;z-index:100}
.status-bar .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#1a1a1a;border-radius:0 0 18px 18px}
.status-bar .icons{display:flex;gap:5px;align-items:center;font-size:12px}

/* ===== Page Container ===== */
.page-container{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.page-container::-webkit-scrollbar{display:none}
.page{display:none;min-height:100%;padding-bottom:80px}
.page.active{display:block;animation:fadeIn var(--duration-normal) var(--ease-out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes scaleIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes heartPop{0%{transform:scale(0) rotate(-15deg);opacity:0}50%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* ===== Bottom Tab Bar ===== */
.tab-bar{height:78px;background:var(--bg2);border-top:1px solid var(--rule);display:flex;align-items:flex-start;padding-top:8px;flex-shrink:0;position:relative;z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;transition:color var(--duration-fast)}
.tab-item .icon{font-size:24px;opacity:.5;transition:all var(--duration-fast)}
.tab-item .label{font-size:10px;color:var(--muted);font-weight:500}
.tab-item.active .icon{opacity:1;transform:scale(1.1)}
.tab-item.active .label{color:var(--primary-500);font-weight:600}
.tab-item:active .icon{transform:scale(.9)}

/* ===== Common Components ===== */
.nav-bar{height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;background:var(--bg2);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:50}
.nav-bar .back{font-size:20px;cursor:pointer;color:var(--ink);width:32px}
.nav-bar .title{flex:1;font-size:17px;font-weight:700}
.nav-bar .action{font-size:14px;color:var(--primary-500);font-weight:600;cursor:pointer}

.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg2)}
.search-bar .input{flex:1;background:var(--bg3);border-radius:var(--radius-full);padding:8px 16px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.search-bar .input.focused{border:2px solid var(--primary-500);background:var(--bg2);color:var(--ink)}
.search-bar .cancel{font-size:14px;color:var(--primary-500);cursor:pointer;white-space:nowrap}

.chip-row{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:var(--radius-full);font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid var(--rule);color:var(--muted);background:var(--bg2);transition:all var(--duration-fast)}
.chip.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.chip:active{transform:scale(.95)}

.card{background:var(--bg2);border-radius:var(--radius-md);margin:8px 16px;padding:14px;box-shadow:var(--shadow-1)}
.card-flat{background:var(--bg2);border-bottom:1px solid var(--rule);padding:14px 16px}

.fab{position:fixed;bottom:100px;right:20px;width:52px;height:52px;border-radius:var(--radius-full);background:var(--primary-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow-3);cursor:pointer;z-index:90;transition:all var(--duration-fast)}
.fab:active{transform:scale(.9) rotate(90deg)}

/* Question Card */
.q-card{background:var(--bg2);margin:8px 16px;padding:14px;border-radius:var(--radius-md);box-shadow:var(--shadow-1);cursor:pointer;transition:all var(--duration-fast)}
.q-card:active{transform:scale(.98);box-shadow:var(--shadow-2)}
.q-card .tags{display:flex;gap:6px;margin-bottom:8px}
.q-card .tag{font-size:11px;padding:2px 8px;border-radius:var(--radius-full);background:var(--primary-50);color:var(--primary-600)}
.q-card .q-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:6px}
.q-card .q-snippet{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-card .q-meta{display:flex;gap:14px;font-size:12px;color:var(--muted)}

/* Post Card */
.post-card{background:var(--bg2);margin:8px 16px;padding:14px;border-radius:var(--radius-md);box-shadow:var(--shadow-1)}
.post-card .user-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.post-card .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.post-card .user-info{flex:1}
.post-card .username{font-size:14px;font-weight:600}
.post-card .post-meta{font-size:11px;color:var(--muted)}
.post-card .follow-btn{font-size:12px;color:var(--primary-500);border:1px solid var(--primary-500);padding:3px 12px;border-radius:var(--radius-full);cursor:pointer}
.post-card .follow-btn.followed{color:var(--muted);border-color:var(--rule);background:var(--bg3)}
.post-card .post-text{font-size:14px;line-height:1.5;margin-bottom:10px}
.post-card .post-images{display:grid;gap:3px;margin-bottom:10px;border-radius:var(--radius-sm);overflow:hidden}
.post-card .post-images.single{grid-template-columns:1fr}
.post-card .post-images.dual{grid-template-columns:1fr 1fr}
.post-card .post-images.triple{grid-template-columns:1fr 1fr 1fr}
.post-card .post-images .img{aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px}
.post-card .post-images.single .img{aspect-ratio:16/10}
.post-card .action-row{display:flex;gap:20px;font-size:13px;color:var(--muted)}
.post-card .action-row span{display:flex;align-items:center;gap:4px;cursor:pointer;transition:color var(--duration-fast)}
.post-card .action-row span:active{transform:scale(.9)}
.post-card .action-row span.liked{color:var(--error)}
.post-card .action-row span.faved{color:var(--warning)}

/* Circle List Item */
.circle-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background var(--duration-fast)}
.circle-item:active{background:var(--bg3)}
.circle-item .c-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.circle-item .c-info{flex:1}
.circle-item .c-name{font-size:15px;font-weight:600}
.circle-item .c-meta{font-size:12px;color:var(--muted)}
.circle-item .join-btn{font-size:13px;color:var(--primary-500);font-weight:600;border:1px solid var(--primary-500);padding:5px 14px;border-radius:var(--radius-full);cursor:pointer;transition:all var(--duration-fast)}
.circle-item .join-btn.joined{color:var(--muted);border-color:var(--rule);background:var(--bg3)}
.circle-item .join-btn:active{transform:scale(.95)}
.circle-item .badge{font-size:10px;background:var(--error);color:#fff;border-radius:var(--radius-full);min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Pet Profile */
.pet-hero{text-align:center;padding:24px 16px;background:linear-gradient(180deg,var(--primary-50),var(--bg))}
.pet-hero .pet-avatar{width:80px;height:80px;border-radius:50%;background:var(--bg2);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:var(--shadow-2)}
.pet-hero .pet-name{font-size:20px;font-weight:700}
.pet-hero .pet-sub{font-size:13px;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);margin:0 16px;border-radius:var(--radius-md);overflow:hidden}
.info-grid .info-item{background:var(--bg2);padding:12px 16px}
.info-grid .info-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.info-grid .info-value{font-size:15px;font-weight:600}

/* Reminder Item */
.reminder-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background var(--duration-fast)}
.reminder-item:active{background:var(--bg3)}
.reminder-item .r-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.reminder-item .r-icon.vaccine{background:var(--info-bg);color:var(--info)}
.reminder-item .r-icon.deworm{background:var(--success-bg);color:var(--success)}
.reminder-item .r-icon.checkup{background:var(--warning-bg);color:var(--warning)}
.reminder-item .r-icon.overdue{background:var(--error-bg);color:var(--error)}
.reminder-item .r-info{flex:1}
.reminder-item .r-title{font-size:14px;font-weight:600}
.reminder-item .r-date{font-size:12px;color:var(--muted)}
.reminder-item .r-status{font-size:12px;font-weight:600}
.reminder-item .r-status.upcoming{color:var(--warning)}
.reminder-item .r-status.overdue{color:var(--error)}
.reminder-item .r-status.normal{color:var(--info)}
.reminder-item .r-status.done{color:var(--success)}

/* Empty & Error States */
.empty-state{text-align:center;padding:60px 24px}
.empty-state .emoji{font-size:48px;opacity:.3;margin-bottom:12px}
.empty-state .text{font-size:15px;color:var(--muted);margin-bottom:6px}
.empty-state .action-text{font-size:14px;color:var(--primary-500);cursor:pointer;font-weight:600}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--rule) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;border-radius:4px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex;animation:fadeIn var(--duration-fast)}
.modal{background:var(--bg2);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:390px;max-width:100%;padding:20px;animation:slideUp var(--duration-normal) var(--ease-spring)}
@media(max-width:420px){.modal{width:100%}}
.modal .m-handle{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:0 auto 16px}
.modal .m-title{font-size:17px;font-weight:700;margin-bottom:8px}
.modal .m-text{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.modal .m-actions{display:flex;gap:10px;margin-top:16px}
.modal .m-btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:all var(--duration-fast)}
.modal .m-btn:active{transform:scale(.97)}
.modal .m-btn.primary{background:var(--primary-500);color:#fff}
.modal .m-btn.secondary{background:var(--bg3);color:var(--ink)}

/* Toast */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(45,36,32,.9);color:#fff;padding:10px 20px;border-radius:var(--radius-full);font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity var(--duration-normal)}
.toast.show{opacity:1}

/* Detail Page (overlay) */
.detail-page{position:absolute;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column}
.detail-page.show{display:flex;animation:slideInRight var(--duration-normal) var(--ease-out)}

/* Comment Item */
.comment-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.comment-item .c-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.comment-item .c-body{flex:1}
.comment-item .c-name{font-size:13px;font-weight:600;margin-bottom:2px}
.comment-item .c-name .author-tag{font-size:10px;color:var(--primary-500);margin-left:4px}
.comment-item .c-text{font-size:13px;line-height:1.4;margin-bottom:4px}
.comment-item .c-meta{font-size:11px;color:var(--muted)}

/* Bottom Input */
.bottom-input{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--rule)}
.bottom-input input{flex:1;background:var(--bg3);border:none;border-radius:var(--radius-full);padding:8px 16px;font-size:14px;outline:none}
.bottom-input .send-btn{width:32px;height:32px;border-radius:50%;background:var(--primary-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.bottom-input .send-btn:disabled{background:var(--rule);color:var(--muted)}

/* Form */
.form-group{padding:12px 16px;border-bottom:1px solid var(--rule)}
.form-group label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;outline:none;background:var(--bg2);color:var(--ink)}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary-500)}

/* Step Bar */
.step-bar{display:flex;gap:4px;padding:12px 16px}
.step-bar .step{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.step-bar .step.done{background:var(--primary-500)}
.step-bar .step.current{background:var(--primary-300)}

/* Type Grid */
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.type-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--radius-md);border:2px solid var(--rule);cursor:pointer;transition:all var(--duration-fast)}
.type-item.selected{border-color:var(--primary-500);background:var(--primary-50)}
.type-item:active{transform:scale(.95)}
.type-item .emoji{font-size:28px}
.type-item .name{font-size:12px;font-weight:500}

/* Pet Selector */
.pet-selector{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.pet-selector::-webkit-scrollbar{display:none}
.pet-chip{display:flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--rule);border-radius:var(--radius-full);font-size:13px;white-space:nowrap;cursor:pointer;transition:all var(--duration-fast)}
.pet-chip.selected{border-color:var(--primary-500);background:var(--primary-50);color:var(--primary-600)}
.pet-chip:active{transform:scale(.95)}

/* Timeline */
.timeline{padding:16px}
.timeline-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.timeline-item:not(:last-child)::before{content:'';position:absolute;left:7px;top:20px;bottom:0;width:2px;background:var(--rule)}
.timeline-item .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px;z-index:1}
.timeline-item .dot.done{background:var(--success)}
.timeline-item .dot.pending{background:var(--bg3);border:2px solid var(--rule)}
.timeline-item .t-content{flex:1}
.timeline-item .t-title{font-size:14px;font-weight:600}
.timeline-item .t-date{font-size:12px;color:var(--muted)}

/* Banner */
.banner{padding:8px 16px;font-size:13px;text-align:center}
.banner.success{background:var(--success-bg);color:var(--success)}
.banner.warning{background:var(--warning-bg);color:var(--warning)}
.banner.error{background:var(--error-bg);color:var(--error)}
.banner.info{background:var(--info-bg);color:var(--info)}

/* Button */
.btn{display:block;width:100%;padding:13px;border-radius:var(--radius-full);font-size:15px;font-weight:600;text-align:center;cursor:pointer;border:none;transition:all var(--duration-fast)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary-500);color:#fff}
.btn.secondary{background:var(--bg3);color:var(--ink)}

/* Heart animation overlay */
.heart-anim{position:fixed;font-size:80px;color:var(--error);z-index:250;pointer-events:none;animation:heartPop var(--duration-slow) var(--ease-spring)}

/* Image Grid (post creation) */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 16px}
.img-slot{aspect-ratio:1;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.img-slot.filled{background:var(--primary-50)}
.img-slot.add{border:2px dashed var(--rule);background:var(--bg2);color:var(--muted);font-size:24px}

/* Profile stats */
.profile-header{text-align:center;padding:24px 16px;background:var(--bg2)}
.profile-header .p-avatar{width:72px;height:72px;border-radius:50%;background:var(--primary-100);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:32px}
.profile-header .p-name{font-size:18px;font-weight:700}
.profile-header .p-bio{font-size:13px;color:var(--muted);margin-top:4px}
.profile-stats{display:flex;justify-content:center;gap:32px;padding:12px 0}
.profile-stats .stat{text-align:center}
.profile-stats .stat .num{font-size:18px;font-weight:700}
.profile-stats .stat .label{font-size:12px;color:var(--muted)}

.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background var(--duration-fast)}
.menu-item:active{background:var(--bg3)}
.menu-item .m-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.menu-item .m-text{flex:1;font-size:15px}
.menu-item .m-arrow{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- Phone Frame -->
<div class="phone-frame">
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="notch"></div>
    <div class="icons"><span>📶</span><span>📡</span><span>🔋</span></div>
  </div>

  <div class="page-container" id="pageContainer">

    <!-- ===== PAGE: 问答 ===== -->
    <div class="page active" id="page-qa">
      <div class="search-bar">
        <div class="input" onclick="openSearch()">🔍 搜索养宠问题...</div>
      </div>
      <div class="chip-row" id="qaChips">
        <div class="chip active" onclick="filterQA('hot',this)">热门</div>
        <div class="chip" onclick="filterQA('health',this)">健康</div>
        <div class="chip" onclick="filterQA('food',this)">饮食</div>
        <div class="chip" onclick="filterQA('behavior',this)">行为</div>
        <div class="chip" onclick="filterQA('grooming',this)">美容</div>

  post.likes+=post.liked?1:-1;

  el.innerHTML=post.liked?`❤️ <span class="like-count">${post.likes}</span>`:`🤍 <span class="like-count">${post.likes}</span>`;
  if(post.liked){
    const rect=el.getBoundingClientRect();
    const heart=document.createElement('div');
    heart.className='heart-anim';
    heart.textContent='❤️';
    heart.style.left=(rect.left+rect.width/2-40)+'px';
    heart.style.top=(rect.top-40)+'px';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),600);
  }
}

    const types=['🐱 猫','🐶 狗','🐰 兔','🐹 仓鼠','🐢 龟','🐦 鸟','🐟 鱼','🐍 爬宠'];
    return `
      <div class="step-bar"><div class="step done"></div><div class="step current"></div><div class="step"></div><div class="step"></div></div>
      <div style="padding:12px 16px;font-size:14px;font-weight:700;color:var(--muted)">选择宠物种类</div>
      <div class="type-grid" id="typeGrid">
        ${types.map(t=>{const e=t.split(' ')[0],n=t.split(' ')[1];return `<div class="type-item ${n===petForm.type?'selected':''}" onclick="selectType('${n}',this)"><span class="emoji">${e}</span><span class="name">${n}</span></div>`}).join('')}
      </div>
      <div style="padding:20px 16px"><div class="btn primary" onclick="nextStep()">下一步</div></div>
    `;
  }
  if(createStep===2){
    const breeds=petForm.type==='猫'?['布偶猫','英国短毛猫','美国短毛猫','橘猫','暹罗猫','波斯猫','缅因猫']:['金毛','拉布拉多','柯基','哈士奇','泰迪','边牧','柴犬'];
    return `
      <div class="step-bar"><div class="step done"></div><div class="step done"></div><div class="step current"></div><div class="step"></div></div>
      <div style="padding:12px 16px;font-size:14px;font-weight:700;color:var(--muted)">选择品种</div>
      <div class="search-bar"><div class="input">🔍 搜索品种</div></div>
      ${breeds.map(b=>`<div class="circle-item" onclick="selectBreed('${b}',this)"><div class="c-icon" style="background:var(--primary-100)">${petForm.type==='猫'?'🐱':'🐶'}</div><div class="c-info"><div class="c-name">${b}</div></div><div style="width:18px;height:18px;border-radius:50%;${petForm.breed===b?'background:var(--primary-500)':'border:2px solid var(--rule)'}"></div></div>`).join('')}
      <div style="padding:20px 16px;display:flex;gap:10px">
        <div class="btn secondary" onclick="prevStep()">上一步</div>
        <div class="btn primary" onclick="nextStep()">下一步</div>
      </div>
    `;
  }
  if(createStep===3){
    return `
      <div class="step-bar"><div class="step done"></div><div class="step done"></div><div class="step done"></div><div class="step current"></div></div>
      <div class="form-group"><label>名字</label><input type="text" placeholder="给宠物起个名字" value="${petForm.name}" oninput="petForm.name=this.value"></div>
      <div class="form-group"><label>性别</label><div class="pet-selector"><div class="pet-chip ${petForm.gender==='♀'?'selected':''}" onclick="selectGender('♀',this)">♀ 母</div><div class="pet-chip ${petForm.gender==='♂'?'selected':''}" onclick="selectGender('♂',this)">♂ 公</div></div></div>
      <div class="form-group"><label>出生日期</label><input type="date" value="${petForm.birthday}" onchange="petForm.birthday=this.value"></div>
      <div class="form-group"><label>体重 (kg)</label><input type="text" placeholder="如：4.2" value="${petForm.weight}" oninput="petForm.weight=this.value"></div>
      <div class="form-group"><label>绝育状态</label><div class="pet-selector"><div class="pet-chip ${petForm.neutered==='已绝育'?'selected':''}" onclick="selectNeutered('已绝育',this)">已绝育</div><div class="pet-chip ${petForm.neutered==='未绝育'?'selected':''}" onclick="selectNeutered('未绝育',this)">未绝育</div></div></div>
      <div style="padding:20px 16px;display:flex;gap:10px">
        <div class="btn secondary" onclick="prevStep()">上一步</div>
        <div class="btn primary" onclick="nextStep()">下一步</div>
      </div>
    `;
  }
  if(createStep===4){
    return `
      <div class="step-bar"><div class="step done"></div><div class="step done"></div><div class="step done"></div><div class="step done"></div></div>
      <div style="padding:12px 16px;font-size:14px;font-weight:700;color:var(--muted)">上传宠物照片</div>
      <div style="text-align:center;padding:32px 16px">
        <div style="width:96px;height:96px;border-radius:50%;background:var(--bg3);border:2px dashed var(--rule);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--muted);cursor:pointer" onclick="showToast('相机功能开发中...')">📷</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">点击上传或拍照</div>
      </div>
      <div style="padding:20px 16px;display:flex;gap:10px">
        <div class="btn secondary" onclick="prevStep()">上一步</div>
        <div class="btn primary" onclick="submitPet()">完成创建</div>
      </div>
    `;
  }
}

function selectType(type,el){
  petForm.type=type;
  document.querySelectorAll('#typeGrid .type-item').forEach(t=>t.classList.remove('selected'));
  el.classList.add('selected');
}

function selectBreed(breed,el){
  petForm.breed=breed;
  document.querySelectorAll('#detailContent .circle-item').forEach(c=>{
    const dot=c.querySelector('div:last-child');
    dot.style.background='transparent';
    dot.style.border='2px solid var(--rule)';
    dot.innerHTML='';
  });
  const dot=el.querySelector('div:last-child');
  dot.style.background='var(--primary-500)';
  dot.style.border='2px solid var(--primary-500)';
  dot.innerHTML='<span style="color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;height:100%">✓</span>';
}

function selectGender(g,el){
  petForm.gender=g;
  el.parentElement.querySelectorAll('.pet-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function selectNeutered(n,el){
  petForm.neutered=n;
  el.parentElement.querySelectorAll('.pet-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function nextStep(){
  if(createStep===2&&!petForm.breed){showToast('请选择品种');return}
  if(createStep===3&&!petForm.name){showToast('请输入宠物名字');return}
  createStep++;
  if(createStep>4){submitPet();return}
  document.getElementById('detailTitle').textContent='创建档案 ('+createStep+'/4)';
  document.getElementById('detailContent').innerHTML=renderCreateStep();
  document.getElementById('detailContent').scrollTop=0;
}

function prevStep(){
  createStep--;
  document.getElementById('detailTitle').textContent='创建档案 ('+createStep+'/4)';
  document.getElementById('detailContent').innerHTML=renderCreateStep();
  document.getElementById('detailContent').scrollTop=0;
}

function submitPet(){
  document.getElementById('detailContent').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px">
      <div style="font-size:64px;margin-bottom:16px">🎉</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px">档案创建成功</div>
      <div style="font-size:14px;color:var(--muted);text-align:center;margin-bottom:20px">已为${petForm.name||'你的宠物'}生成专属健康提醒计划</div>
      <div style="width:100%;padding:0 32px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:8px">已生成3条提醒</div>
        <div class="reminder-item"><div class="r-icon vaccine">💉</div><div class="r-info"><div class="r-title">疫苗提醒</div><div class="r-date">8周后</div></div></div>
        <div class="reminder-item"><div class="r-icon deworm">💊</div><div class="r-info"><div class="r-title">驱虫提醒</div><div class="r-date">1月后</div></div></div>
        <div class="reminder-item"><div class="r-icon checkup">🏥</div><div class="r-info"><div class="r-title">体检提醒</div><div class="r-date">1年后</div></div></div>
      </div>
      <div style="width:100%;padding:0 32px">
        <div class="btn primary" onclick="closeDetail();renderPetPage()">查看档案</div>
      </div>
    </div>
  `;
}

// ===== Search =====
function openSearch(){
  document.getElementById('detailTitle').textContent='搜索';
  document.getElementById('detailContent').innerHTML=`
    <div class="search-bar">
      <div class="input focused" style="flex:1">🔍 <input type="text" placeholder="搜索养宠问题..." id="searchInput" style="border:none;outline:none;background:transparent;font-size:14px;flex:1" oninput="handleSearch(this.value)"></div>
      <div class="cancel" onclick="closeDetail()">取消</div>
    </div>
    <div id="searchContent">
      <div style="padding:16px;font-size:13px;font-weight:700;color:var(--muted)">热门搜索</div>
      <div class="chip-row">
        <div class="chip" onclick="doSearch('猫咪呕吐')">猫咪呕吐</div>
        <div class="chip" onclick="doSearch('驱虫药')">驱虫药</div>
        <div class="chip" onclick="doSearch('幼猫喂养')">幼猫喂养</div>
        <div class="chip" onclick="doSearch('疫苗时间')">疫苗时间</div>
        <div class="chip" onclick="doSearch('绝育')">绝育注意事项</div>
      </div>
      <div style="padding:16px;font-size:13px;font-weight:700;color:var(--muted)">最近搜索</div>
      <div class="circle-item" style="border:none" onclick="doSearch('猫咪打疫苗')"><div class="c-icon" style="background:var(--bg3);font-size:14px">🕐</div><div class="c-info"><div class="c-name" style="font-size:14px">猫咪打疫苗时间表</div></div><div style="color:var(--muted);font-size:14px">×</div></div>
      <div class="circle-item" style="border:none" onclick="doSearch('狗粮推荐')"><div class="c-icon" style="background:var(--bg3);font-size:14px">🕐</div><div class="c-info"><div class="c-name" style="font-size:14px">狗粮推荐</div></div><div style="color:var(--muted);font-size:14px">×</div></div>
    </div>
  `;
  document.getElementById('detailPage').classList.add('show');
  setTimeout(()=>document.getElementById('searchInput').focus(),300);
}

function handleSearch(val){
  if(!val.trim())return;
  const results=qaData.filter(q=>q.title.includes(val)||q.tags.some(t=>t.includes(val)));
  if(results.length===0){
    document.getElementById('searchContent').innerHTML=`<div class="empty-state"><div class="emoji">🔍</div><div class="text">没有找到相关问题</div><div class="action-text" onclick="closeDetail();openAskPage()">去提问 ›</div></div>`;
    return;
  }
  document.getElementById('searchContent').innerHTML=`<div style="padding:8px 16px;font-size:12px;color:var(--muted)">找到 ${results.length} 条相关结果</div>${results.map(q=>`<div class="q-card" onclick="closeDetail();setTimeout(()=>openQADetail(${q.id}),300)"><div class="tags">${q.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="q-title">${q.title}</div><div class="q-snippet">${q.snippet}</div><div class="q-meta"><span>👁 ${q.views}</span><span>💬 ${q.answers}</span><span>👍 ${q.likes}</span></div></div>`).join('')}`;
}

function doSearch(keyword){
  document.getElementById('searchInput').value=keyword;
  handleSearch(keyword);
}

// ===== Modal =====
function showModal(html){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay'))closeModalDirect();
}

function closeModalDirect(){
  document.getElementById('modalOverlay').classList.remove('show');
}

// ===== Detail Page =====
function closeDetail(){
  document.getElementById('detailPage').classList.remove('show');
}

// ===== Toast =====
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

// ===== Like Action (detail page) =====
function likeAction(el){
  el.style.color=el.style.color==='rgb(244, 67, 54)'?'var(--muted)':'var(--error)';
}

// ===== Clock =====
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
}

// ===== Init =====
renderQA('hot');
renderFeed('recommend');
renderCircles('all');
renderPetPage();
updateClock();
setInterval(updateClock,60000);
</script>
</body>
</html>
