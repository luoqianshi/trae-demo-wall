<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鱼乐圈 - 钓鱼爱好者社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1e3d2f 100%); min-height: 100vh; }
        
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px; position: sticky; top: 0; z-index: 100; }
        .header h1 { color: #fff; text-align: center; font-size: 24px; margin-bottom: 12px; }
        .nav { display: flex; justify-content: center; gap: 8px; }
        .nav-btn { padding: 10px 20px; border: none; border-radius: 25px; background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .nav-btn.active { background: #ffd700; color: #1a472a; font-weight: bold; }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .zone { display: none; }
        .zone.active { display: block; }
        
        .post-form { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .post-form h2 { color: #1a472a; margin-bottom: 20px; font-size: 20px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #2d5a3d; outline: none; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .upload-area { border: 2px dashed #2d5a3d; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { background: rgba(45,90,61,0.1); }
        .upload-area input { display: none; }
        .upload-area span { color: #2d5a3d; font-weight: bold; }
        .preview-image { max-width: 200px; max-height: 150px; border-radius: 8px; margin-top: 12px; display: none; }
        
        .submit-btn { background: linear-gradient(135deg, #2d5a3d, #1a472a); color: #fff; padding: 12px 32px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(45,90,61,0.4); }
        
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .post-card { background: rgba(255,255,255,0.95); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.15); transition: transform 0.3s; }
        .post-card:hover { transform: translateY(-4px); }
        .post-image { width: 100%; height: 200px; object-fit: cover; background: #f0f0f0; }
        .post-content { padding: 16px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .post-author { font-weight: bold; color: #1a472a; }
        .post-time { font-size: 12px; color: #888; }
        .post-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .post-meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: 13px; color: #555; }
        .post-meta span { background: rgba(45,90,61,0.1); padding: 4px 8px; border-radius: 12px; }
        .post-body { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag { background: #ffd700; color: #1a472a; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
        
        .post-actions { display: flex; gap: 12px; padding-top: 12px; border-top: 1px solid #eee; }
        .action-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 14px; display: flex; align-items: center; gap: 4px; transition: color 0.3s; }
        .action-btn:hover { color: #2d5a3d; }
        .action-btn.liked { color: #e74c3c; }
        
        .comments-section { display: none; padding-top: 12px; border-top: 1px solid #eee; margin-top: 12px; }
        .comments-section.show { display: block; }
        .comment-list { margin-bottom: 12px; }
        .comment-item { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .comment-author { font-weight: bold; color: #1a472a; margin-bottom: 4px; }
        .comment-text { color: #555; }
        .comment-input { width: calc(100% - 80px); padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-right: 8px; }
        .comment-btn { padding: 8px 16px; background: #2d5a3d; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        
        .user-bar { background: rgba(255,255,255,0.1); padding: 8px 20px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
        .user-bar span { color: #fff; font-size: 14px; }
        .user-bar input { padding: 6px 12px; border: none; border-radius: 12px; font-size: 14px; }
        .user-bar button { padding: 6px 16px; background: #ffd700; color: #1a472a; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        
        .price-tag { color: #e74c3c; font-weight: bold; font-size: 16px; }
        .swap-info { display: flex; gap: 12px; align-items: center; }
        .swap-arrow { color: #2d5a3d; font-size: 20px; }
        
        @media (max-width: 768px) {
            .posts-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="user-bar">
        <span>昵称:</span>
        <input type="text" id="nicknameInput" placeholder="请输入昵称">
        <button onclick="setNickname()">确定</button>
    </div>
    
    <div class="header">
        <h1>🐟 鱼乐圈 - 钓鱼爱好者社区</h1>
        <div class="nav">
            <button class="nav-btn active" onclick="switchZone('catch')">🎣 渔获晒区</button>
            <button class="nav-btn" onclick="switchZone('trade')">💰 交易区</button>
            <button class="nav-btn" onclick="switchZone('swap')">🔄 换鱼区</button>
        </div>
    </div>
    
    <div class="container">
        <div id="catchZone" class="zone active">
            <div class="post-form">
                <h2>📸 发布新渔获</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>鱼种</label>
                        <input type="text" id="catchFishType" placeholder="如：草鱼、鲤鱼、鲈鱼">
                    </div>
                    <div class="form-group">
                        <label>重量 (斤)</label>
                        <input type="number" id="catchWeight" placeholder="0.0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>数量 (条)</label>
                        <input type="number" id="catchCount" placeholder="1" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>上鱼过程</label>
                    <textarea id="catchStory" placeholder="分享你的垂钓经历..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>口感评价</label>
                        <select id="catchTaste">
                            <option value="">请选择口感</option>
                            <option value="鲜嫩">鲜嫩</option>
                            <option value="肥美">肥美</option>
                            <option value="紧实">紧实</option>
                            <option value="清淡">清淡</option>
                            <option value="鲜香">鲜香</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>推荐吃法</label>
                        <input type="text" id="catchRecipe" placeholder="如：清蒸、红烧、炖汤">
                    </div>
                </div>
                <div class="upload-area" onclick="document.getElementById('catchImage').click()">
                    <input type="file" id="catchImage" accept="image/*" onchange="previewImage(this, 'catchPreview')">
                    <span>📷 点击上传鱼获照片</span>
                    <img id="catchPreview" class="preview-image" src="" alt="预览">
                </div>
                <button class="submit-btn" onclick="publishCatch()">发布渔获</button>
            </div>
            
            <div id="catchPosts" class="posts-grid"></div>
        </div>
        
        <div id="tradeZone" class="zone">
            <div class="post-form">
                <h2>💼 发布交易信息</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>鱼种</label>
                        <input type="text" id="tradeFishType" placeholder="如：鲫鱼、黑鱼、黄鳝">
                    </div>
                    <div class="form-group">
                        <label>重量 (斤)</label>
                        <input type="number" id="tradeWeight" placeholder="0.0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>价格 (元/斤)</label>
                        <input type="number" id="tradePrice" placeholder="0.0" step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>交易方式</label>
                        <select id="tradeMethod">
                            <option value="">请选择交易方式</option>
                            <option value="local">同城自提</option>
                            <option value="shipping">买家承担运费</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>所在位置</label>
                        <input type="text" id="tradeLocation" placeholder="如：北京市朝阳区">
                    </div>
                </div>
                <div class="form-group">
                    <label>详细描述</label>
                    <textarea id="tradeDesc" placeholder="描述鱼的品质、新鲜度等..."></textarea>
                </div>
                <div class="upload-area" onclick="document.getElementById('tradeImage').click()">
                    <input type="file" id="tradeImage" accept="image/*" onchange="previewImage(this, 'tradePreview')">
                    <span>📷 点击上传鱼货照片</span>
                    <img id="tradePreview" class="preview-image" src="" alt="预览">
                </div>
                <button class="submit-btn" onclick="publishTrade()">发布交易</button>
            </div>
            
            <div id="tradePosts" class="posts-grid"></div>
        </div>
        
        <div id="swapZone" class="zone">
            <div class="post-form">
                <h2>🤝 发布换鱼信息</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>待换鱼种</label>
                        <input type="text" id="swapOffer" placeholder="你想交换的鱼种">
                    </div>
                    <div class="form-group">
                        <label>待换数量</label>
                        <input type="number" id="swapOfferCount" placeholder="数量" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>期望鱼种</label>
                        <input type="text" id="swapWant" placeholder="你想要的鱼种">
                    </div>
                    <div class="form-group">
                        <label>是否可补差价</label>
                        <select id="swapPrice">
                            <option value="no">不补差价</option>
                            <option value="yes">可协商补差价</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>交换说明</label>
                    <textarea id="swapDesc" placeholder="描述你的渔获情况、交换条件等..."></textarea>
                </div>
                <div class="upload-area" onclick="document.getElementById('swapImage').click()">
                    <input type="file" id="swapImage" accept="image/*" onchange="previewImage(this, 'swapPreview')">
                    <span>📷 点击上传待换渔获照片</span>
                    <img id="swapPreview" class="preview-image" src="" alt="预览">
                </div>
                <button class="submit-btn" onclick="publishSwap()">发布换鱼</button>
            </div>
            
            <div id="swapPosts" class="posts-grid"></div>
        </div>
    </div>
    
    <script>
        const zones = ['catch', 'trade', 'swap'];
        let currentZone = 'catch';
        
        function switchZone(zone) {
            currentZone = zone;
            zones.forEach(z => {
                document.getElementById(z + 'Zone').classList.toggle('active', z === zone);
                document.querySelector(`.nav-btn[onclick="switchZone('${z}')"]`).classList.toggle('active', z === zone);
            });
            loadPosts();
        }
        
        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (file.size > 2 * 1024 * 1024) {
                    alert('图片大小不能超过2MB，请选择更小的图片！');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 600;
                        const maxHeight = 400;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = (width * maxHeight) / height;
                            height = maxHeight;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById(previewId).src = compressedDataUrl;
                        document.getElementById(previewId).style.display = 'block';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        
        function getNickname() {
            return localStorage.getItem('fishNickname') || '钓友';
        }
        
        function setNickname() {
            const input = document.getElementById('nicknameInput');
            const nickname = input.value.trim();
            if (nickname) {
                localStorage.setItem('fishNickname', nickname);
                alert('昵称设置成功！');
            }
        }
        
        function getPosts(zone) {
            const data = localStorage.getItem(`fish_${zone}_posts`);
            return data ? JSON.parse(data) : [];
        }
        
        function savePosts(zone, posts) {
            localStorage.setItem(`fish_${zone}_posts`, JSON.stringify(posts));
        }
        
        function publishCatch() {
            const fishType = document.getElementById('catchFishType').value;
            const weight = document.getElementById('catchWeight').value;
            const count = document.getElementById('catchCount').value;
            const story = document.getElementById('catchStory').value;
            const taste = document.getElementById('catchTaste').value;
            const recipe = document.getElementById('catchRecipe').value;
            const image = document.getElementById('catchPreview').src;
            
            if (!fishType || !weight) {
                alert('请填写鱼种和重量！');
                return;
            }
            
            const post = {
                id: Date.now(),
                author: getNickname(),
                fishType,
                weight,
                count: count || 1,
                story,
                taste,
                recipe,
                image: image || '',
                likes: 0,
                comments: [],
                time: new Date().toLocaleString()
            };
            
            const posts = getPosts('catch');
            posts.unshift(post);
            savePosts('catch', posts);
            clearCatchForm();
            loadPosts();
        }
        
        function clearCatchForm() {
            document.getElementById('catchFishType').value = '';
            document.getElementById('catchWeight').value = '';
            document.getElementById('catchCount').value = '';
            document.getElementById('catchStory').value = '';
            document.getElementById('catchTaste').value = '';
            document.getElementById('catchRecipe').value = '';
            document.getElementById('catchPreview').src = '';
            document.getElementById('catchPreview').style.display = 'none';
            document.getElementById('catchImage').value = '';
        }
        
        function publishTrade() {
            const fishType = document.getElementById('tradeFishType').value;
            const weight = document.getElementById('tradeWeight').value;
            const price = document.getElementById('tradePrice').value;
            const method = document.getElementById('tradeMethod').value;
            const location = document.getElementById('tradeLocation').value;
            const desc = document.getElementById('tradeDesc').value;
            const image = document.getElementById('tradePreview').src;
            
            if (!fishType || !weight || !price || !method) {
                alert('请填写鱼种、重量、价格和交易方式！');
                return;
            }
            
            const post = {
                id: Date.now(),
                author: getNickname(),
                fishType,
                weight,
                price,
                method: method === 'local' ? '同城自提' : '买家承担运费',
                location,
                desc,
                image: image || '',
                likes: 0,
                comments: [],
                time: new Date().toLocaleString()
            };
            
            const posts = getPosts('trade');
            posts.unshift(post);
            savePosts('trade', posts);
            clearTradeForm();
            loadPosts();
        }
        
        function clearTradeForm() {
            document.getElementById('tradeFishType').value = '';
            document.getElementById('tradeWeight').value = '';
            document.getElementById('tradePrice').value = '';
            document.getElementById('tradeMethod').value = '';
            document.getElementById('tradeLocation').value = '';
            document.getElementById('tradeDesc').value = '';
            document.getElementById('tradePreview').src = '';
            document.getElementById('tradePreview').style.display = 'none';
            document.getElementById('tradeImage').value = '';
        }
        
        function publishSwap() {
            const offer = document.getElementById('swapOffer').value;
            const offerCount = document.getElementById('swapOfferCount').value;
            const want = document.getElementById('swapWant').value;
            const price = document.getElementById('swapPrice').value;
            const desc = document.getElementById('swapDesc').value;
            const image = document.getElementById('swapPreview').src;
            
            if (!offer || !want) {
                alert('请填写待换鱼种和期望鱼种！');
                return;
            }
            
            const post = {
                id: Date.now(),
                author: getNickname(),
                offer,
                offerCount: offerCount || 1,
                want,
                price: price === 'yes' ? '可协商补差价' : '不补差价',
                desc,
                image: image || '',
                likes: 0,
                comments: [],
                time: new Date().toLocaleString()
            };
            
            const posts = getPosts('swap');
            posts.unshift(post);
            savePosts('swap', posts);
            clearSwapForm();
            loadPosts();
        }
        
        function clearSwapForm() {
            document.getElementById('swapOffer').value = '';
            document.getElementById('swapOfferCount').value = '';
            document.getElementById('swapWant').value = '';
            document.getElementById('swapPrice').value = 'no';
            document.getElementById('swapDesc').value = '';
            document.getElementById('swapPreview').src = '';
            document.getElementById('swapPreview').style.display = 'none';
            document.getElementById('swapImage').value = '';
        }
        
        function loadPosts() {
            const posts = getPosts(currentZone);
            const container = document.getElementById(currentZone + 'Posts');
            container.innerHTML = '';
            
            if (posts.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#fff;font-size:18px;padding:40px;">暂无内容，快来发布第一条吧！</div>';
                return;
            }
            
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = renderPost(post);
                container.appendChild(card);
            });
        }
        
        function renderPost(post) {
            let html = '';
            
            if (post.image) {
                html += `<img class="post-image" src="${post.image}" alt="渔获照片">`;
            } else {
                html += `<div class="post-image" style="display:flex;align-items:center;justify-content:center;color:#888;font-size:48px;">🐟</div>`;
            }
            
            html += `<div class="post-content">
                <div class="post-header">
                    <span class="post-author">👤 ${post.author}</span>
                    <span class="post-time">⏰ ${post.time}</span>
                </div>`;
            
            if (currentZone === 'catch') {
                html += `<h3 class="post-title">${post.fishType}</h3>
                <div class="post-meta">
                    <span>⚖️ ${post.weight}斤</span>
                    <span>🐟 ${post.count}条</span>
                    ${post.taste ? `<span>😋 ${post.taste}</span>` : ''}
                </div>
                ${post.story ? `<p class="post-body">${post.story}</p>` : ''}
                ${post.recipe ? `<div class="post-tags"><span class="tag">🍳 推荐吃法：${post.recipe}</span></div>` : ''}`;
            } else if (currentZone === 'trade') {
                html += `<h3 class="post-title">${post.fishType}</h3>
                <div class="post-meta">
                    <span>⚖️ ${post.weight}斤</span>
                    <span class="price-tag">💰 ${post.price}元/斤</span>
                    <span>📍 ${post.location || '未填写'}</span>
                </div>
                <div class="post-tags">
                    <span class="tag">${post.method}</span>
                </div>
                ${post.desc ? `<p class="post-body">${post.desc}</p>` : ''}`;
            } else if (currentZone === 'swap') {
                html += `<h3 class="post-title">换鱼：${post.offer} → ${post.want}</h3>
                <div class="post-meta">
                    <span>📤 我有：${post.offer} × ${post.offerCount}条</span>
                    <span>📥 想要：${post.want}</span>
                </div>
                <div class="post-tags">
                    <span class="tag">${post.price}</span>
                </div>
                ${post.desc ? `<p class="post-body">${post.desc}</p>` : ''}`;
            }
            
            html += `<div class="post-actions">
                <button class="action-btn ${checkIfLiked(post.id) ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)">
                    ❤️ ${post.likes}
                </button>
                <button class="action-btn" onclick="toggleComments(${post.id})">
                    💬 留言 (${post.comments.length})
                </button>
                ${post.author === getNickname() ? '<button class="action-btn" style="color:#e74c3c" onclick="deletePost(' + post.id + ')">🗑️ 删除</button>' : ''}
            </div>
            <div id="comments-${post.id}" class="comments-section">
                <div id="comment-list-${post.id}" class="comment-list">
                    ${post.comments.map(c => `<div class="comment-item"><div class="comment-author">${c.author}</div><div class="comment-text">${c.text}</div></div>`).join('')}
                </div>
                <input type="text" id="comment-input-${post.id}" class="comment-input" placeholder="写下你的留言...">
                <button class="comment-btn" onclick="addComment(${post.id})">发送</button>
            </div>
            </div>`;
            
            return html;
        }
        
        function getLikedPosts() {
            const data = localStorage.getItem('fish_liked_posts');
            return data ? JSON.parse(data) : {};
        }
        
        function saveLikedPosts(liked) {
            localStorage.setItem('fish_liked_posts', JSON.stringify(liked));
        }
        
        function checkIfLiked(postId) {
            const liked = getLikedPosts();
            return liked[currentZone] && liked[currentZone].includes(postId);
        }
        
        function toggleLike(postId, btn) {
            const posts = getPosts(currentZone);
            const post = posts.find(p => p.id === postId);
            if (post) {
                const liked = getLikedPosts();
                if (!liked[currentZone]) liked[currentZone] = [];
                
                const index = liked[currentZone].indexOf(postId);
                if (index > -1) {
                    liked[currentZone].splice(index, 1);
                    post.likes--;
                } else {
                    liked[currentZone].push(postId);
                    post.likes++;
                }
                
                saveLikedPosts(liked);
                savePosts(currentZone, posts);
                btn.classList.toggle('liked');
                btn.innerHTML = `❤️ ${post.likes}`;
            }
        }
        
        function deletePost(postId) {
            if (!confirm('确定要删除这条帖子吗？')) return;
            const posts = getPosts(currentZone);
            const filtered = posts.filter(p => p.id !== postId);
            savePosts(currentZone, filtered);
            loadPosts();
        }
        
        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            section.classList.toggle('show');
        }
        
        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const posts = getPosts(currentZone);
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({
                    author: getNickname(),
                    text,
                    time: new Date().toLocaleString()
                });
                savePosts(currentZone, posts);
                
                const list = document.getElementById(`comment-list-${postId}`);
                list.innerHTML += `<div class="comment-item"><div class="comment-author">${getNickname()}</div><div class="comment-text">${text}</div></div>`;
                input.value = '';
            }
        }
        
        document.getElementById('nicknameInput').value = getNickname();
        
        if (getPosts('catch').length === 0) {
