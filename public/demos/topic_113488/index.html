<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安药伴｜智能服药提醒小程序</title>
  <style>
    :root {
      --bg: #fff8ef;
      --bg2: #ffffff;
      --ink: #24302d;
      --muted: #6d7773;
      --rule: #eadfce;
      --accent: #1f8a70;
      --accent2: #f28c38;
      --soft: #eaf7f2;
      --warn: #fff0dc;
      --danger: #e05555;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: #f0ede6;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 10px;
    }

    /* Tablet frame */
    .phone {
      width: 720px;
      min-height: 520px;
      background: var(--bg);
      border-radius: 24px;
      border: 6px solid #2a2a2a;
      box-shadow: 0 24px 70px rgba(0,0,0,.16), inset 0 0 0 2px #444;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      font-size: 15px;
    }

    .phone-statusbar {
      height: 32px;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: .72rem;
      font-weight: 800;
      color: var(--muted);
      flex-shrink: 0;
    }

    .phone-notch {
      display: none;
    }

    /* Tab bar */
    .tabbar {
      height: 56px;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      display: flex;
      flex-shrink: 0;
    }

    .tab-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
      transition: color .2s;
      user-select: none;
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
    }

    /* Page container */
    .page-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .page {
      display: none;
      flex-direction: column;
      min-height: 100%;
    }

    .page.active {
      display: flex;
    }

    /* Toast */
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.85);
      background: rgba(36,48,45,.92);
      color: #fff;
      border-radius: 16px;
      padding: 18px 32px;
      font-size: 1.05rem;
      font-weight: 900;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ========== HOME PAGE ========== */
    .home-header {
      background: linear-gradient(135deg, var(--accent), #167a5f);
      color: #fff;
      padding: 18px 28px 14px;
    }

    .home-header h2 {
      font-size: 1.4rem;
      letter-spacing: -0.04em;
      margin-bottom: 3px;
    }

    .home-header p {
      opacity: .85;
      font-size: .88rem;
    }

    .home-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 14px 28px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .stat-num.green { color: var(--accent); }
    .stat-num.orange { color: var(--accent2); }
    .stat-num.gray { color: var(--muted); }

    .stat-label {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 800;
      margin-top: 2px;
    }

    .section-label {
      padding: 8px 28px 6px;
      font-size: .92rem;
      font-weight: 900;
      color: var(--ink);
      text-align: center;
    }

    .med-list {
      padding: 0 28px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .med-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: box-shadow .2s;
    }

    .med-card:active {
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    .med-card.done {
      opacity: .5;
    }

    .med-card.done .med-card-name {
      text-decoration: line-through;
    }

    .med-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--soft);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .med-card-icon.orange {
      background: var(--warn);
    }

    .med-card-info {
      flex: 1;
    }

    .med-card-name {
      font-weight: 800;
      font-size: .95rem;
      margin-bottom: 2px;
    }

    .med-card-detail {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 700;
    }

    .med-card-status {
      font-size: .72rem;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-done {
      background: var(--soft);
      color: var(--accent);
    }

    .badge-pending {
      background: var(--warn);
      color: var(--accent2);
    }

    .badge-overdue {
      background: #fde2e2;
      color: var(--danger);
    }

    /* ========== ADD PAGE ========== */
    .add-header {
      padding: 12px 28px;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
    }

    .add-header h2 {
      font-size: 1.15rem;
      font-weight: 900;
    }

    .add-header p {
      font-size: .82rem;
      color: var(--muted);
    }

    .add-form {
      padding: 12px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: .78rem;
      font-weight: 800;
      color: var(--muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: .88rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      resize: none;
      height: 48px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .photo-upload {
      background: var(--soft);
      border: 2px dashed rgba(31,138,112,.3);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      color: var(--accent);
      font-weight: 800;
      font-size: .82rem;
      transition: background .2s;
    }

    .photo-upload:active {
      background: #d8f0e8;
    }

    .photo-upload .photo-icon {
      font-size: 1.8rem;
      margin-bottom: 3px;
    }

    .family-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .family-tag {
      background: var(--soft);
      border: 1px solid rgba(31,138,112,.2);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .family-tag.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(31,138,112,.22);
      transition: transform .15s;
      font-family: inherit;
    }

    .btn-primary:active {
      transform: scale(.97);
    }

    /* ========== REMINDER PAGE ========== */
    .reminder-page {
      background: linear-gradient(180deg, var(--warn) 0%, var(--bg) 25%);
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 14px 24px;
      align-content: start;
    }

    .reminder-time {
      grid-column: 1 / -1;
      text-align: center;
      padding: 8px 0 4px;
      font-size: .88rem;
      color: var(--muted);
      font-weight: 800;
    }

    .reminder-prompt {
      grid-column: 1 / -1;
      text-align: center;
      padding: 0;
      font-size: .82rem;
      color: var(--muted);
      font-weight: 700;
    }

    .reminder-drug-card {
      background: var(--bg2);
      border: 2px solid var(--accent2);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 32px rgba(242,140,56,.14);
    }

    .reminder-drug-label {
      font-size: .82rem;
      color: var(--muted);
      font-weight: 800;
    }

    .reminder-drug-name {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent2);
      letter-spacing: -0.04em;
      margin: 6px 0;
    }

    .reminder-drug-photo {
      width: 70px;
      height: 70px;
      background: var(--soft);
      border-radius: 16px;
      margin: 8px auto;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      border: 1px solid var(--rule);
    }

    .reminder-details {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      overflow: hidden;
    }

    .reminder-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: .8rem;
      border-bottom: 1px solid var(--rule);
    }

    .reminder-detail-row:last-child {
      border-bottom: none;
    }

    .reminder-detail-row b {
      color: var(--ink);
    }

    .reminder-detail-row span {
      color: var(--muted);
      font-weight: 700;
    }

    .voice-bar {
      grid-column: 1 / -1;
      background: var(--warn);
      border: 1px solid rgba(242,140,56,.25);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      font-size: .82rem;
      color: var(--ink);
    }

    .voice-bar .wave {
      display: inline-block;
      margin-right: 6px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    .confirm-area {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-confirm {
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 10px 20px;
      font-size: .92rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(242,140,56,.2);
      font-family: inherit;
      transition: transform .15s;
      white-space: nowrap;
    }

    .btn-confirm:active {
      transform: scale(.97);
    }

    .btn-voice {
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: .72rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-voice:active {
      background: var(--soft);
      color: var(--accent);
    }

    .btn-skip {
      background: none;
      border: none;
      padding: 10px 8px;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    /* ========== RECORDS PAGE ========== */
    .records-header {
      padding: 18px 22px;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .records-header h2 {
      font-size: 1.1rem;
      font-weight: 900;
    }

    .records-tabs {
      display: flex;
      gap: 0;
      padding: 0 22px;
      background: var(--bg2);
    }

    .records-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: .82rem;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .records-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .records-list {
      padding: 14px 22px;
      display: grid;
      gap: 10px;
    }

    .record-item {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .record-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .record-dot.green { background: var(--accent); }
    .record-dot.orange { background: var(--accent2); }
    .record-dot.red { background: var(--danger); }

    .record-info {
      flex: 1;
    }

    .record-name {
      font-weight: 800;
      font-size: .9rem;
    }

    .record-time {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
    }

    .record-badge {
      font-size: .72rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .stock-section {
      margin: 10px 22px 22px;
      background: var(--warn);
      border: 1px solid rgba(242,140,56,.2);
      border-radius: 16px;
      padding: 16px;
    }

    .stock-title {
      font-size: .82rem;
      font-weight: 900;
      color: var(--accent2);
      margin-bottom: 8px;
    }

    .stock-item {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      padding: 4px 0;
      color: var(--ink);
      font-weight: 700;
    }

    .stock-item span {
      color: var(--muted);
    }

    .safety-note {
      margin: 0 22px 22px;
      background: #fde2e2;
      border: 1px solid rgba(224,85,85,.15);
      border-radius: 14px;
      padding: 14px;
      font-size: .82rem;
      color: var(--danger);
      font-weight: 700;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 22px;
      color: var(--muted);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    /* Desktop centering */
    @media (min-width: 500px) {
      body {
        align-items: center;
        padding-top: 40px;
        background:
          radial-gradient(circle at 20% 20%, rgba(31,138,112,.08), transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(242,140,56,.08), transparent 40%),
          #eae6de;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-statusbar">
      <span>9:41</span>
      <span></span>
      <span>100%</span>
    </div>

    <div class="page-container">
      <!-- HOME -->
      <div class="page active" id="page-home">
        <div class="home-header">
          <h2>安药伴</h2>
          <p>安心吃药，陪伴左右</p>
        </div>
        <div class="home-stats">
          <div class="stat-card">
            <div class="stat-num green" id="stat-done">0</div>
            <div class="stat-label">今日已服</div>
          </div>
          <div class="stat-card">
            <div class="stat-num orange" id="stat-pending">0</div>
            <div class="stat-label">待确认</div>
          </div>
          <div class="stat-card">
            <div class="stat-num gray" id="stat-total">0</div>
            <div class="stat-label">药品总数</div>
          </div>
        </div>
        <div class="section-label">今日服药提醒</div>
        <div class="med-list" id="home-med-list">
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <p>还没有药品，去"添加"页面录入吧</p>
          </div>
        </div>
      </div>

      <!-- ADD -->
      <div class="page" id="page-add">
        <div class="add-header">
          <h2>添加服药提醒</h2>
          <p>为老人设置每天的用药计划</p>
        </div>
        <div class="add-form">
          <div class="form-group">
            <label>药品照片</label>
            <div class="photo-upload" id="photo-upload">
              <div class="photo-icon">📷</div>
              <span>点击拍照或上传药盒照片</span>
            </div>
          </div>
          <div class="form-group">
            <label>药品名称</label>
            <input type="text" id="input-name" placeholder="例如：降压药 A">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>每次剂量</label>
              <input type="text" id="input-dose" placeholder="例如：1 片">
            </div>
            <div class="form-group">
              <label>总量</label>
              <input type="text" id="input-total" placeholder="例如：30 片">
            </div>
          </div>
          <div class="form-group">
            <label>提醒时间</label>
            <select id="input-time">
              <option value="早餐后 7:00">早餐后 7:00</option>
              <option value="早餐后 8:00" selected>早餐后 8:00</option>
              <option value="午餐后 12:00">午餐后 12:00</option>
              <option value="午餐后 12:30">午餐后 12:30</option>
              <option value="晚餐后 18:00">晚餐后 18:00</option>
              <option value="晚餐后 19:00">晚餐后 19:00</option>
              <option value="睡前 21:00">睡前 21:00</option>
              <option value="睡前 22:00">睡前 22:00</option>
            </select>
          </div>
          <div class="form-group">
            <label>语音说明（老人听到的话）</label>
            <textarea id="input-voice" placeholder="例如：饭后温水服用，不要和牛奶一起吃"></textarea>
          </div>
          <div class="form-group">
            <label>每日用量</label>
            <input type="text" id="input-daily" placeholder="例如：1 片（用于估算剩余天数）">
          </div>
          <div class="form-group">
            <label>共同照护家人</label>
            <div class="family-tags">
              <span class="family-tag selected">女儿</span>
              <span class="family-tag">儿子</span>
              <span class="family-tag">配偶</span>
            </div>
          </div>
          <button class="btn-primary" id="btn-save">保存并提醒老人</button>
        </div>
      </div>

      <!-- REMINDER -->
      <div class="page" id="page-reminder">
        <div class="reminder-page">
          <div class="reminder-time" id="reminder-time-display">当前提醒时间</div>
          <div class="reminder-prompt">到了服药时间啦</div>
          <div class="reminder-drug-card">
            <div class="reminder-drug-label">现在该服用</div>
            <div class="reminder-drug-name" id="reminder-name">--</div>
            <div class="reminder-drug-photo" id="reminder-photo">💊</div>
          </div>
          <div class="reminder-details">
            <div class="reminder-detail-row"><b>每次剂量</b><span id="reminder-dose">--</span></div>
            <div class="reminder-detail-row"><b>提醒时间</b><span id="reminder-time">--</span></div>
            <div class="reminder-detail-row"><b>服用说明</b><span id="reminder-voice">--</span></div>
          </div>
          <div class="voice-bar">
            <span class="wave">🔊</span> 语音播报中...
          </div>
          <div class="confirm-area">
            <button class="btn-confirm" id="btn-confirm">我吃过了</button>
            <button class="btn-voice" id="btn-voice-confirm">🎤 也可以说"我吃过了"</button>
            <button class="btn-skip" id="btn-skip">暂时不吃</button>
          </div>
        </div>
      </div>

      <!-- RECORDS -->
      <div class="page" id="page-records">
        <div class="records-header">
          <h2>服药记录</h2>
          <span style="font-size:.82rem;color:var(--muted);font-weight:800">近 7 天</span>
        </div>
        <div class="records-tabs">
          <div class="records-tab active" data-tab="today">今日</div>
          <div class="records-tab" data-tab="week">本周</div>
          <div class="records-tab" data-tab="stock">库存</div>
        </div>
        <div id="records-content">
          <div class="records-list" id="records-list">
            <div class="empty-state">
              <div class="empty-icon">📊</div>
              <p>暂无服药记录</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tabbar">
      <div class="tab-item active" data-page="page-home">
        <div class="tab-icon">🏠</div>
        <span>首页</span>
      </div>
      <div class="tab-item" data-page="page-add">
        <div class="tab-icon">➕</div>
        <span>添加</span>
      </div>
      <div class="tab-item" data-page="page-reminder">
        <div class="tab-icon">🔔</div>
        <span>提醒</span>
      </div>
      <div class="tab-item" data-page="page-records">
        <div class="tab-icon">📋</div>
        <span>记录</span>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function() {
      /* Data Store */
      var medicines = [];
      var records = [];
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function showToast(msg) {
        toastEl.textContent = msg || '已成功';
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          toastEl.classList.remove('show');
        }, 1600);
      }

      /* Tab Navigation */
      var tabs = document.querySelectorAll('.tab-item');
      tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          var pageId = tab.getAttribute('data-page');
          switchPage(pageId);
          tabs.forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
        });
      });

      function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        var target = document.getElementById(pageId);
        if (target) target.classList.add('active');

        if (pageId === 'page-home') renderHome();
        if (pageId === 'page-reminder') renderReminder();
        if (pageId === 'page-records') renderRecords();
      }

      /* Family Tags */
      document.querySelectorAll('.family-tag').forEach(function(tag) {
        tag.addEventListener('click', function() {
          tag.classList.toggle('selected');
        });
      });

      /* Photo Upload (simulated) */
      document.getElementById('photo-upload').addEventListener('click', function() {
        showToast('已拍下药盒照片');
        this.innerHTML = '<div class="photo-icon">✅</div><span>药盒照片已保存</span>';
      });

      /* Save Medicine */
      document.getElementById('btn-save').addEventListener('click', function() {
        var name = document.getElementById('input-name').value.trim();
        var dose = document.getElementById('input-dose').value.trim();
        var total = document.getElementById('input-total').value.trim();
        var time = document.getElementById('input-time').value;
        var voice = document.getElementById('input-voice').value.trim();
        var daily = document.getElementById('input-daily').value.trim();

        if (!name) { showToast('请输入药品名称'); return; }
        if (!dose) { showToast('请输入每次剂量'); return; }

        var familyArr = [];
        document.querySelectorAll('.family-tag.selected').forEach(function(t) {
          familyArr.push(t.textContent);
        });

        medicines.push({
          id: Date.now(),
          name: name,
          dose: dose,
          total: total ? parseInt(total) : 0,
          time: time,
          voice: voice || '按说明服用',
          daily: daily ? parseInt(daily) : 0,
          family: familyArr,
          done: false,
          doneTime: null
        });

        showToast('已成功添加：' + name);

        /* Reset form */
        document.getElementById('input-name').value = '';
        document.getElementById('input-dose').value = '';
        document.getElementById('input-total').value = '';
        document.getElementById('input-voice').value = '';
        document.getElementById('input-daily').value = '';
        var photoUp = document.getElementById('photo-upload');
        photoUp.innerHTML = '<div class="photo-icon">📷</div><span>点击拍照或上传药盒照片</span>';

        switchPage('page-home');
        /* Activate home tab */
        tabs.forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('[data-page="page-home"]').classList.add('active');
      });

      /* Render Home */
      function renderHome() {
        var listEl = document.getElementById('home-med-list');
        var doneCount = 0;
        var pendingCount = 0;

        if (medicines.length === 0) {
          listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>还没有药品，去"添加"页面录入吧</p></div>';
          document.getElementById('stat-done').textContent = '0';
          document.getElementById('stat-pending').textContent = '0';
          document.getElementById('stat-total').textContent = '0';
          return;
        }

        var html = '';
        medicines.forEach(function(med) {
          if (med.done) doneCount++;
          else pendingCount++;
          var statusClass = med.done ? 'done' : '';
          var badgeClass = med.done ? 'badge-done' : 'badge-pending';
          var badgeText = med.done ? '已服用' : '待确认';
          var iconClass = med.done ? '' : 'orange';

          html += '<div class="med-card ' + statusClass + '" data-id="' + med.id + '">';
          html += '<div class="med-card-icon ' + iconClass + '">💊</div>';
          html += '<div class="med-card-info">';
          html += '<div class="med-card-name">' + med.name + '</div>';
          html += '<div class="med-card-detail">' + med.time + ' · ' + med.dose + '</div>';
          html += '</div>';
          html += '<span class="med-card-status ' + badgeClass + '">' + badgeText + '</span>';
          html += '</div>';
        });

        listEl.innerHTML = html;
        document.getElementById('stat-done').textContent = doneCount;
        document.getElementById('stat-pending').textContent = pendingCount;
        document.getElementById('stat-total').textContent = medicines.length;

        /* Click to view reminder detail */
        listEl.querySelectorAll('.med-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var id = parseInt(card.getAttribute('data-id'));
            var med = medicines.find(function(m) { return m.id === id; });
            if (med) {
              currentReminderMed = med;
              switchPage('page-reminder');
              tabs.forEach(function(t) { t.classList.remove('active'); });
              document.querySelector('[data-page="page-reminder"]').classList.add('active');
            }
          });
        });
      }

      /* Render Reminder */
      var currentReminderMed = null;

      function renderReminder() {
        var med = currentReminderMed;
        if (!med) {
          /* Pick first pending */
          med = medicines.find(function(m) { return !m.done; });
          currentReminderMed = med;
        }

        if (!med) {
          document.getElementById('reminder-name').textContent = '没有待确认的药品';
          document.getElementById('reminder-dose').textContent = '--';
          document.getElementById('reminder-time').textContent = '--';
          document.getElementById('reminder-voice').textContent = '--';
          document.getElementById('reminder-time-display').textContent = '所有药品已确认';
          return;
        }

        document.getElementById('reminder-time-display').textContent = med.time;
        document.getElementById('reminder-name').textContent = med.name;
        document.getElementById('reminder-dose').textContent = med.dose;
        document.getElementById('reminder-time').textContent = med.time;
        document.getElementById('reminder-voice').textContent = med.voice;
      }

      /* Confirm button */
      document.getElementById('btn-confirm').addEventListener('click', function() {
        confirmMed();
      });

      document.getElementById('btn-voice-confirm').addEventListener('click', function() {
        showToast('语音识别：我吃过了');
        setTimeout(function() { confirmMed(); }, 600);
      });

      document.getElementById('btn-skip').addEventListener('click', function() {
        showToast('已记录：暂时不吃');
      });

      function confirmMed() {
        if (!currentReminderMed) return;
        currentReminderMed.done = true;
        currentReminderMed.doneTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

        records.push({
          name: currentReminderMed.name,
          dose: currentReminderMed.dose,
          time: currentReminderMed.time,
          doneTime: currentReminderMed.doneTime,
          status: 'done'
        });

        showToast('已成功确认：' + currentReminderMed.name);

        /* Move to next pending or show complete */
        currentReminderMed = null;
        setTimeout(function() {
          renderReminder();
        }, 300);
      }

      /* Records Tabs */
      var currentRecordTab = 'today';

      document.querySelectorAll('.records-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.records-tab').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          currentRecordTab = tab.getAttribute('data-tab');
          renderRecords();
        });
      });

      function renderRecords() {
        var container = document.getElementById('records-content');

        if (currentRecordTab === 'stock') {
          renderStock(container);
          return;
        }

        var list = document.getElementById('records-list');
        if (records.length === 0 && medicines.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>暂无服药记录</p></div>';
          return;
        }

        var html = '';
        medicines.forEach(function(med) {
          var dotClass = med.done ? 'green' : 'orange';
          var badgeClass = med.done ? 'badge-done' : 'badge-pending';
          var badgeText = med.done ? '已服用 ' + (med.doneTime || '') : '待确认';

          html += '<div class="record-item">';
          html += '<div class="record-dot ' + dotClass + '"></div>';
          html += '<div class="record-info">';
          html += '<div class="record-name">' + med.name + ' · ' + med.dose + '</div>';
          html += '<div class="record-time">' + med.time + '</div>';
          html += '</div>';
          html += '<span class="record-badge ' + badgeClass + '">' + badgeText + '</span>';
          html += '</div>';
        });

        list.innerHTML = html;

        /* Add safety note if there are pending */
        var hasPending = medicines.some(function(m) { return !m.done; });
        if (hasPending) {
          var noteHtml = '<div class="safety-note">⚠ 漏服提示：如果老人超时未确认，请先联系老人确认情况。是否补服应按医生建议处理，不要自行补服。</div>';
          list.insertAdjacentHTML('afterend', noteHtml);
        }
      }

      function renderStock(container) {
        var html = '<div style="padding:14px 22px"></div>';

        if (medicines.length === 0) {
          html += '<div class="empty-state"><div class="empty-icon">📦</div><p>暂无药品库存信息</p></div>';
        } else {
          html += '<div class="stock-section">';
          html += '<div class="stock-title">药品库存估算</div>';
          medicines.forEach(function(med) {
            var daysLeft = '--';
            if (med.total && med.daily) {
              daysLeft = Math.floor(med.total / med.daily);
              if (daysLeft <= 5) daysLeft = daysLeft + '（快用完，提醒购买）';
              else daysLeft += ' 天';
            }
            html += '<div class="stock-item"><b>' + med.name + '</b><span>剩余约 ' + daysLeft + '</span></div>';
          });
          html += '</div>';
        }

        container.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
