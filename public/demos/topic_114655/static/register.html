<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族迹 · 注册</title>
<link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="register-wrapper">
  <!-- 左侧品牌区 -->
  <div class="brand-panel">
    <div class="brand-content">
      <div class="brand-icon">🌳</div>
      <h1 class="brand-title">族 迹</h1>
      <p class="brand-subtitle">电子族谱管理系统</p>
      <p class="brand-desc">以树为脉，以谱为根<br>传承家族记忆，延续血脉温情</p>
    </div>
    <div class="brand-footer">© 2026 族迹 · 守护每一个家族的根</div>
  </div>

  <!-- 右侧注册区 -->
  <div class="register-panel">
    <div class="register-card">
      <h2 class="register-title">创建家族账户</h2>
      <p class="register-sub">填写信息加入族谱大家庭</p>

      <form id="registerForm" novalidate>

        <!-- ====== 账号信息 ====== -->
        <div class="section-title">账号信息</div>

        <div class="form-group">
          <label for="regUsername">账号 *</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="regUsername" placeholder="手机号或邮箱" autocomplete="username" required>
          </div>
          <span class="error-msg" id="regUsernameError"></span>
        </div>

        <div class="form-group">
          <label for="regPassword">密码 *</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" placeholder="至少 6 位密码" autocomplete="new-password" required>
            <button type="button" class="toggle-pwd" id="togglePwd" title="显示密码">👁️</button>
          </div>
          <span class="error-msg" id="regPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="regConfirmPwd">确认密码 *</label>
          <div class="input-wrap">
            <span class="input-icon">🔐</span>
            <input type="password" id="regConfirmPwd" placeholder="再次输入密码" autocomplete="new-password" required>
          </div>
          <span class="error-msg" id="regConfirmError"></span>
        </div>

        <!-- ====== 家族信息 ====== -->
        <div class="section-title">家族信息</div>

        <div class="form-group">
          <label for="regFamilyName">家族名称 *</label>
          <div class="input-wrap">
            <span class="input-icon">🏠</span>
            <input type="text" id="regFamilyName" placeholder="如：李氏宗谱" required>
          </div>
          <span class="error-msg" id="regFamilyNameError"></span>
        </div>

        <div class="form-group">
          <label for="regFamilyCode">家族编码 *</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="text" id="regFamilyCode" placeholder="6-20位字母数字组合，如：LI001" required>
          </div>
          <span class="error-msg" id="regFamilyCodeError"></span>
        </div>

        <!-- ====== 个人信息 ====== -->
        <div class="section-title">个人信息</div>

        <div class="form-row">
          <div class="form-group">
            <label for="regName">姓名 *</label>
            <div class="input-wrap">
              <span class="input-icon">✏️</span>
              <input type="text" id="regName" placeholder="真实姓名" required>
            </div>
            <span class="error-msg" id="regNameError"></span>
          </div>
          <div class="form-group">
            <label for="regGender">性别 *</label>
            <select id="regGender" class="reg-select">
              <option value="M">男</option>
              <option value="F">女</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regGenName">字辈（选填）</label>
            <input type="text" id="regGenName" class="reg-input" placeholder="如：泽、明">
          </div>
          <div class="form-group">
            <label for="regGeneration">代数（选填）</label>
            <select id="regGeneration" class="reg-select">
              <option value="">请选择</option>
              <option value="1">第一代（始祖）</option>
              <option value="2">第二代</option>
              <option value="3">第三代</option>
              <option value="4">第四代</option>
              <option value="5">第五代</option>
              <option value="6">第六代</option>
              <option value="7">第七代</option>
              <option value="8">第八代</option>
              <option value="9">第九代</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regBirth">出生日期（选填）</label>
            <input type="date" id="regBirth" class="reg-input">
          </div>
          <div class="form-group">
            <label for="regAlive">状态</label>
            <select id="regAlive" class="reg-select">
              <option value="1">在世</option>
              <option value="0">已故</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="regDeathGroup" style="display:none">
          <label for="regDeath">逝世日期</label>
          <input type="date" id="regDeath" class="reg-input">
        </div>

        <div class="form-group">
          <label for="regBirthplace">出生地（选填）</label>
          <input type="text" id="regBirthplace" class="reg-input" placeholder="如：浙江绍兴">
        </div>

        <!-- 提交 -->
        <button type="submit" class="btn-register" id="registerBtn">
          <span class="btn-text">注 册</span>
          <span class="btn-spinner" id="registerSpinner"></span>
        </button>
      </form>

      <div class="divider">
        <span>已有账户</span>
      </div>

      <p class="login-tip">
        已有家族账户？<a href="login.html">立即登录</a>
      </p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="js/register.js"></script>
</body>
</html>
