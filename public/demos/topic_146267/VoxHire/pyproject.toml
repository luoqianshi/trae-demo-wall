[project]
name = "voxhire"
version = "0.1.0"
description = "Local-first AI voice interview demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "edge-tts==7.2.7",
  "httpx==0.28.1",
  "pypdf==5.3.0",
  "pytest==8.3.4",
  "python-multipart==0.0.20",
  "speech-to-speech[paraformer]",
  "uvicorn[standard]==0.34.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
