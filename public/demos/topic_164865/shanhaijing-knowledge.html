<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>山海经 · 古籍知识库</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
:root {
  --xuan: #f0e2c8;
  --xuan-2: #e8d6b6;
  --xuan-3: #e0cca8;
  --xuan-4: #d4bc94;
  --mo: #e6d5b6;
  --zhi: #4a3222;
  --zhi-2: #5c4028;
  --zhi-3: #6e4f30;
  --zhi-4: #80603a;
  --jin: #b8802c;
  --jin-2: #d4983a;
  --jin-3: #8a6020;
  --zhu: #b83d2a;
  --zhu-2: #d9543e;
  --qing: #3a7565;
  --qing-2: #5a9a88;
  --shiqing: #4a6b8a;
  --shiqing-2: #6a8baa;
  --line: rgba(138, 96, 32, 0.25);
  --line-strong: rgba(138, 96, 32, 0.5);
  --shadow: 0 4px 24px rgba(74, 50, 34, 0.15);
  --glow: 0 0 30px rgba(184, 128, 44, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "STSong", serif;
  background: var(--mo);
  color: var(--zhi);
  line-height: 1.9;
  overflow-x: hidden;
  min-height: 100vh;
  font-size: 16px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 0% 50%, rgba(184, 61, 42, 0.12) 0%, transparent 35%),
    radial-gradient(ellipse at 100% 50%, rgba(58, 117, 101, 0.12) 0%, transparent 35%),
    radial-gradient(ellipse at 50% 0%, rgba(184, 128, 44, 0.1) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 100%, rgba(74, 107, 138, 0.08) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='stone'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='1 0 0 0 0.35  0 1 0 0 0.25  0 0 1 0 0.15  0 0 0 0.2 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23stone)'/%3E%3C/svg%3E");
  opacity: 0.5;
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 0;
}

.cloud-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

.cloud-layer::before,
.cloud-layer::after {
  content: '';
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,100 Q50,60 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100 L800,200 L0,200 Z' fill='rgba(240,226,200,0.4)'/%3E%3C/svg%3E");
  background-repeat: repeat-x;
  animation: cloudFloat 60s linear infinite;
}

.cloud-layer::after {
  animation-delay: -30s;
  opacity: 0.5;
  top: 30%;
}

@keyframes cloudFloat {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2rem;
}

/* ========== 导航栏 ========== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(230, 213, 182, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0.75rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  cursor: pointer;
  flex-shrink: 0;
}

.nav-logo-seal {
  width: 36px;
  height: 36px;
  background: var(--zhu);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--zhi);
  font-size: 1rem;
  font-weight: 700;
  border-radius: 2px;
  transform: rotate(-2deg);
  box-shadow: 0 2px 8px rgba(166, 59, 46, 0.3);
}

.nav-logo-text {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--jin);
  letter-spacing: 0.1em;
}

.nav-menu {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-menu li {
  position: relative;
  cursor: pointer;
  color: var(--zhi-2);
  font-size: 0.92rem;
  letter-spacing: 0.08em;
  padding: 0.3rem 0;
  transition: color 0.3s;
  white-space: nowrap;
}

.nav-menu li:hover,
.nav-menu li.active {
  color: var(--jin);
}

.nav-menu li::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: 1px;
  background: var(--jin);
  transition: all 0.3s;
  transform: translateX(-50%);
}

.nav-menu li:hover::after,
.nav-menu li.active::after {
  width: 100%;
}

.nav-search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}

.nav-search:hover {
  border-color: var(--line-strong);
  background: rgba(201, 164, 76, 0.05);
}

.nav-search-icon { color: var(--zhi-3); font-size: 0.85rem; }
.nav-search-text { color: var(--zhi-3); font-size: 0.82rem; }

/* ========== 页面通用 ========== */
.page {
  padding-top: 65px;
  min-height: 100vh;
}

.section-title {
  text-align: center;
  margin-bottom: 3rem;
}

.section-title-zh {
  font-size: 2rem;
  color: var(--jin);
  font-weight: 700;
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.section-title-en {
  font-size: 0.8rem;
  color: var(--zhi-4);
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

.section-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin: 1rem 0 0;
}

.section-divider-line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--jin-3), transparent);
}

.section-divider-dot {
  width: 6px;
  height: 6px;
  background: var(--jin);
  transform: rotate(45deg);
}

/* ========== 首页 Hero ========== */
.home-hero {
  position: relative;
  min-height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.home-hero-bg {
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(180deg, rgba(230, 213, 182, 0.3) 0%, rgba(230, 213, 182, 0.1) 30%, rgba(230, 213, 182, 0.2) 70%, rgba(230, 213, 182, 0.5) 100%),
    radial-gradient(ellipse at 50% 40%, rgba(184, 128, 44, 0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 15% 70%, rgba(184, 61, 42, 0.15) 0%, transparent 40%),
    radial-gradient(ellipse at 85% 65%, rgba(58, 117, 101, 0.12) 0%, transparent 40%);
}

.home-hero-mountains {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 200px;
  opacity: 0.15;
}

.home-hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 900px;
  padding: 2rem;
}

.home-hero-badge {
  display: inline-block;
  padding: 0.4rem 1.2rem;
  border: 1px solid var(--jin-3);
  color: var(--jin-2);
  font-size: 0.8rem;
  letter-spacing: 0.25em;
  margin-bottom: 2rem;
  background: rgba(201, 164, 76, 0.06);
}

.home-hero-title {
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  font-weight: 700;
  background: linear-gradient(180deg, var(--jin-2) 0%, var(--jin) 50%, var(--jin-3) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.2em;
  margin-bottom: 1.5rem;
  line-height: 1.2;
  text-shadow: 0 0 60px rgba(201, 164, 76, 0.2);
}

.home-hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--zhi-2);
  margin-bottom: 1rem;
  letter-spacing: 0.15em;
  font-weight: 400;
}

.home-hero-desc {
  font-size: 0.95rem;
  color: var(--zhi-3);
  max-width: 600px;
  margin: 0 auto 2.5rem;
  line-height: 2;
}

.home-hero-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.8rem 1.8rem;
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.3s;
  border: none;
  font-family: inherit;
  border-radius: 2px;
}

.btn-primary {
  background: linear-gradient(180deg, var(--jin-2), var(--jin));
  color: var(--xuan);
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(201, 164, 76, 0.25);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(201, 164, 76, 0.35);
}

.btn-ghost {
  background: transparent;
  color: var(--zhi-2);
  border: 1px solid var(--line-strong);
}

.btn-ghost:hover {
  background: rgba(201, 164, 76, 0.08);
  border-color: var(--jin);
  color: var(--jin);
}

/* ========== 今日异兽 ========== */
.home-today {
  padding: 5rem 0;
  position: relative;
}

.today-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  background: var(--xuan);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.today-image {
  position: relative;
  min-height: 400px;
  background: var(--xuan-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.today-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 2rem;
  transition: transform 0.6s ease;
}

.today-card:hover .today-image img {
  transform: scale(1.05);
}

.today-image-label {
  position: absolute;
  top: 1.5rem;
  left: 1.5rem;
  padding: 0.3rem 0.8rem;
  background: var(--zhu);
  color: var(--zhi);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
}

.today-image-mountain {
  position: absolute;
  bottom: 1.5rem;
  right: 1.5rem;
  font-size: 0.8rem;
  color: var(--zhi-3);
  letter-spacing: 0.1em;
}

.today-info {
  padding: 2.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.today-info-label {
  font-size: 0.78rem;
  color: var(--jin);
  letter-spacing: 0.25em;
  margin-bottom: 0.8rem;
}

.today-info-name {
  font-size: 2.5rem;
  color: var(--zhi);
  font-weight: 700;
  margin-bottom: 0.5rem;
  letter-spacing: 0.1em;
}

.today-info-pinyin {
  font-size: 0.85rem;
  color: var(--zhi-4);
  letter-spacing: 0.1em;
  margin-bottom: 1.5rem;
}

.today-info-text {
  font-size: 0.95rem;
  color: var(--zhi-2);
  line-height: 2;
  margin-bottom: 1.5rem;
}

.today-info-source {
  font-size: 0.8rem;
  color: var(--zhi-4);
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  letter-spacing: 0.05em;
}

.today-info-tags {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.tag {
  padding: 0.25rem 0.7rem;
  background: rgba(201, 164, 76, 0.1);
  border: 1px solid var(--line);
  color: var(--jin-2);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  border-radius: 2px;
}

/* ========== 功能入口 ========== */
.home-features {
  padding: 5rem 0;
  background: var(--xuan);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.feature-card {
  background: var(--xuan-2);
  border: 1px solid var(--line);
  padding: 2rem;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.feature-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--jin);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.feature-card:hover {
  transform: translateY(-4px);
  border-color: var(--line-strong);
  box-shadow: var(--glow);
  background: var(--xuan-3);
}

.feature-card:hover::before {
  transform: scaleX(1);
}

.feature-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
  opacity: 0.8;
}

.feature-title {
  font-size: 1.15rem;
  color: var(--jin);
  margin-bottom: 0.8rem;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.feature-desc {
  font-size: 0.88rem;
  color: var(--zhi-3);
  line-height: 1.8;
  margin-bottom: 1rem;
}

.feature-link {
  font-size: 0.82rem;
  color: var(--jin-2);
  letter-spacing: 0.1em;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

/* ========== 快速检索 ========== */
.home-search {
  padding: 5rem 0;
  text-align: center;
}

.home-search-box {
  max-width: 600px;
  margin: 0 auto 2rem;
  position: relative;
}

.home-search-input {
  width: 100%;
  padding: 1rem 1.2rem 1rem 3rem;
  background: var(--xuan);
  border: 1px solid var(--line-strong);
  color: var(--zhi);
  font-size: 1rem;
  font-family: inherit;
  border-radius: 2px;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}

.home-search-input:focus {
  outline: none;
  border-color: var(--jin);
  box-shadow: 0 0 0 3px rgba(201, 164, 76, 0.1);
}

.home-search-input::placeholder {
  color: var(--zhi-4);
}

.home-search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--zhi-4);
  font-size: 1rem;
}

.home-search-tags {
  display: flex;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
}

.home-search-tag {
  padding: 0.3rem 0.8rem;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--zhi-3);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.08em;
  font-family: inherit;
  border-radius: 2px;
}

.home-search-tag:hover {
  border-color: var(--jin);
  color: var(--jin);
  background: rgba(201, 164, 76, 0.08);
}

/* ========== 页面切换动画 ========== */
.fade-enter-active,
.fade-leave-active {
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.fade-enter-from {
  opacity: 0;
  transform: translateY(12px);
}

.fade-leave-to {
  opacity: 0;
  transform: translateY(-12px);
}

/* ========== 页脚 ========== */
.footer {
  padding: 3rem 0 2rem;
  border-top: 1px solid var(--line);
  text-align: center;
  color: var(--zhi-4);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
}

/* ========== 南山经地图 ========== */
.map-page {
  padding: 2rem 0 4rem;
}

.map-tabs {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.map-tab {
  padding: 0.5rem 1.2rem;
  background: var(--xuan);
  border: 1px solid var(--line);
  color: var(--zhi-2);
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  border-radius: 2px;
  letter-spacing: 0.08em;
}

.map-tab:hover {
  border-color: var(--jin);
  color: var(--jin);
}

.map-tab.active {
  background: rgba(201, 164, 76, 0.15);
  border-color: var(--jin);
  color: var(--jin);
}

.map-mode-toggle {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.map-mode-btn {
  padding: 0.35rem 1rem;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--zhi-3);
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  border-radius: 2px;
}

.map-mode-btn.active {
  background: rgba(201, 164, 76, 0.1);
  border-color: var(--jin);
  color: var(--jin);
}

.map-header {
  text-align: center;
  padding: 2rem 0;
}

.map-header h2 {
  font-size: 2rem;
  color: var(--jin);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.map-header p {
  color: var(--zhi-3);
  font-size: 0.9rem;
}

.map-container {
  position: relative;
  width: 100%;
  height: 520px;
  background: linear-gradient(180deg, rgba(230, 213, 182, 0.5) 0%, rgba(224, 204, 168, 0.8) 100%);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 2rem;
}

.map-canvas {
  position: relative;
  width: 100%;
  height: 100%;
}

.map-bg-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.6;
}

.mountain-point {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 10;
}

.mountain-dot {
  width: 18px;
  height: 18px;
  background: var(--jin);
  border: 2px solid var(--xuan);
  border-radius: 50%;
  position: relative;
  transition: all 0.3s;
  box-shadow: 0 0 10px rgba(201, 164, 76, 0.5);
}

.mountain-point:hover .mountain-dot {
  transform: scale(1.3);
  box-shadow: 0 0 20px rgba(201, 164, 76, 0.8);
}

.mountain-point.locked .mountain-dot {
  background: var(--xuan-3);
  border-color: var(--zhi-4);
  box-shadow: none;
  opacity: 0.5;
}

.mountain-point.active .mountain-dot {
  background: var(--zhu);
  transform: scale(1.4);
  box-shadow: 0 0 20px rgba(166, 59, 46, 0.6);
}

.mountain-label {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 8px;
  white-space: nowrap;
  font-size: 0.8rem;
  color: var(--zhi-2);
  letter-spacing: 0.08em;
  background: rgba(240, 226, 200, 0.95);
  padding: 0.2rem 0.5rem;
  border-radius: 2px;
  border: 1px solid var(--line);
}

.mountain-point.locked .mountain-label {
  color: var(--zhi-4);
  opacity: 0.6;
}

.mountain-order {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--jin);
  background: rgba(240, 226, 200, 0.95);
  padding: 0.1rem 0.4rem;
  border-radius: 2px;
  border: 1px solid var(--line);
}

.map-path {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.map-path svg {
  width: 100%;
  height: 100%;
}

.map-path-line {
  stroke: var(--jin);
  stroke-width: 1.5;
  fill: none;
  stroke-dasharray: 6, 4;
  opacity: 0.4;
}

.map-path-line.locked {
  stroke: var(--zhi-4);
  opacity: 0.2;
}

/* 山系图例 */
.map-legend {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.82rem;
  color: var(--zhi-3);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.legend-dot.unlocked { background: var(--jin); box-shadow: 0 0 6px rgba(201,164,76,0.5); }
.legend-dot.locked { background: var(--xuan-3); border: 1px solid var(--zhi-4); }

// ========== 南山经地图组件 ==========
const MapPage = defineComponent({
  name: 'MapPage',
  props: ['mountains', 'beasts', 'seaRegions', 'bookSystem'],
  emits: ['nav', 'view-beast'],
  setup(props, { emit }) {
    const mapMode = ref('shanjing');
    const selectedRange = ref('nanshan');
    const selectedMountain = ref(null);
    const selectedRegion = ref(null);

    const mountainGroups = [
      { id: 'nanshan', name: '南山经', color: '#c9a44c' },
      { id: 'xishan', name: '西山经', color: '#5a8a7c' },
      { id: 'beishan', name: '北山经', color: '#8b7239' },
      { id: 'dongshan', name: '东山经', color: '#a63b2e' },
      { id: 'zhongshan', name: '中山经', color: '#9b82c4' }
    ];

    const seaGroups = [
      { id: 'haiwai', name: '海外四经' },
      { id: 'hainei', name: '海内四经' },
      { id: 'dahuang', name: '大荒四经' },
      { id: 'haineijing', name: '海内经' }
    ];

    const filteredMountains = computed(() => {
      if (selectedRange.value === 'nanshan') {
        return props.mountains.filter(m => !m.mountainGroup || m.mountainGroup === 'nanshan' || m.range.startsWith('南山经'));
      }
      return props.mountains.filter(m => m.mountainGroup === selectedRange.value);
    });

    const filteredRegions = computed(() => {
      return props.seaRegions.filter(r => r.regionGroup === selectedRange.value);
    });

    const currentItems = computed(() => {
      if (mapMode.value === 'shanjing') {
        return filteredMountains.value;
      }
      return filteredRegions.value;
    });

    const selectedItem = computed(() => {
      if (mapMode.value === 'shanjing') return selectedMountain.value;
      return selectedRegion.value;
    });

    const switchMode = (mode) => {
      mapMode.value = mode;
      if (mode === 'shanjing') {
        selectedRange.value = 'nanshan';
      } else {
        selectedRange.value = 'haiwai';
      }
      selectedMountain.value = null;
      selectedRegion.value = null;
    };

    const selectRange = (rangeId) => {
      selectedRange.value = rangeId;
      selectedMountain.value = null;
      selectedRegion.value = null;
    };

    const selectMountain = (mountain) => {
      if (!mountain.unlocked) {
        const sorted = [...filteredMountains.value].sort((a, b) => a.order - b.order);
        const idx = sorted.findIndex(m => m.id === mountain.id);
        if (idx > 0 && !sorted[idx - 1].unlocked) {
          return;
        }
        mountain.unlocked = true;
      }
      selectedMountain.value = mountain;
    };

    const selectRegion = (region) => {
      selectedRegion.value = region;
    };

    const getRegionPosition = (region, index) => {
      const seed = region.id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      const x = 15 + (seed % 70);
      const y = 15 + ((seed * 3) % 60);
      return { x, y };
    };

    const getBeastById = (beastId) => {
      return props.beasts.find(b => b.id === beastId);
    };

    const itemBeasts = computed(() => {
      const item = selectedItem.value;
      if (!item || !item.beasts) return [];
      return item.beasts
        .map(id => getBeastById(id))
        .filter(Boolean);
    });

    const pathLines = computed(() => {
      if (mapMode.value !== 'shanjing') return [];
      const lines = [];
      const sorted = [...filteredMountains.value].sort((a, b) => a.order - b.order);
      for (let i = 0; i < sorted.length - 1; i++) {
        lines.push({
          from: sorted[i],
          to: sorted[i + 1],
          locked: !sorted[i + 1].unlocked
        });
      }
      return lines;
    });

    const unlockedCount = computed(() => {
      return filteredMountains.value.filter(m => m.unlocked).length;
    });

    const currentRangeName = computed(() => {
      const all = [...mountainGroups, ...seaGroups];
      const found = all.find(g => g.id === selectedRange.value);
      return found ? found.name : '';
    });

    return {
      mapMode,
      selectedRange,
      selectedMountain,
      selectedRegion,
      mountainGroups,
      seaGroups,
      filteredMountains,
      filteredRegions,
      currentItems,
      selectedItem,
      itemBeasts,
      pathLines,
      unlockedCount,
      currentRangeName,
      getRegionPosition,
      switchMode,
      selectRange,
      selectMountain,
      selectRegion
    };
  },
  template: `
    <div class="map-page">
      <div class="container">
        <div class="map-header">
          <h2>山海地理巡游</h2>
          <p>五藏山经 · 海经荒经，逐山异域探索上古世界</p>
        </div>

        <div class="map-mode-toggle">
          <button :class="['map-mode-btn', { active: mapMode === 'shanjing' }]" @click="switchMode('shanjing')">
            ⛰ 五藏山经
          </button>
          <button :class="['map-mode-btn', { active: mapMode === 'haijing' }]" @click="switchMode('haijing')">
            🌊 海经荒经
          </button>
        </div>

        <div class="map-tabs">
          <template v-if="mapMode === 'shanjing'">
            <button
              v-for="g in mountainGroups"
              :key="g.id"
              :class="['map-tab', { active: selectedRange === g.id }]"
              @click="selectRange(g.id)"
            >
              {{ g.name }}
            </button>
          </template>
          <template v-else>
            <button
              v-for="g in seaGroups"
              :key="g.id"
              :class="['map-tab', { active: selectedRange === g.id }]"
              @click="selectRange(g.id)"
            >
              {{ g.name }}
            </button>
          </template>
        </div>

        <div class="map-legend" v-if="mapMode === 'shanjing'">
          <div class="legend-item">
            <span class="legend-dot unlocked"></span>
            <span>已解锁</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot active"></span>
            <span>当前选中</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot locked"></span>
            <span>待解锁</span>
          </div>
          <div class="legend-item" style="margin-left:1rem; color:var(--zhi-4);">
            {{ currentRangeName }} · 已解锁 {{ unlockedCount }}/{{ filteredMountains.length }}
          </div>
        </div>

        <div class="map-container">
          <div class="map-canvas">
            <svg class="map-bg-svg" viewBox="0 0 100 60" preserveAspectRatio="none">
              <defs>
                <linearGradient id="seaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                  <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:0.3" />
                  <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:0" />
                </linearGradient>
                <linearGradient id="landGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                  <stop offset="0%" style="stop-color:#2a2519;stop-opacity:0.4" />
                  <stop offset="100%" style="stop-color:#2a2519;stop-opacity:0" />
                </linearGradient>
              </defs>
              <rect v-if="mapMode === 'haijing'" x="0" y="0" width="100" height="60" fill="url(#seaGrad)" />
              <rect v-else x="0" y="40" width="100" height="20" fill="url(#seaGrad)" />
              <path d="M0,45 Q15,38 30,42 T60,40 T100,44 L100,60 L0,60 Z" fill="url(#landGrad)" />
              <path d="M0,50 Q20,45 40,48 T80,46 T100,50" stroke="rgba(201,164,76,0.1)" stroke-width="0.3" fill="none" />
            </svg>

            <div class="map-path" v-if="mapMode === 'shanjing'">
              <svg viewBox="0 0 100 60" preserveAspectRatio="none">
                <line
                  v-for="(line, idx) in pathLines"
                  :key="idx"
                  :x1="line.from.position.x"
                  :y1="line.from.position.y"
                  :x2="line.to.position.x"
                  :y2="line.to.position.y"
                  :class="['map-path-line', { locked: line.locked }]"
                />
              </svg>
            </div>

            <template v-if="mapMode === 'shanjing'">
              <div
                v-for="mountain in filteredMountains"
                :key="mountain.id"
                :class="['mountain-point', { locked: !mountain.unlocked, active: selectedMountain && selectedMountain.id === mountain.id }]"
                :style="{ left: mountain.position.x + '%', top: mountain.position.y + '%' }"
                @click="selectMountain(mountain)"
              >
                <span class="mountain-order">{{ mountain.order }}</span>
                <div class="mountain-dot"></div>
                <span class="mountain-label">{{ mountain.name }}</span>
              </div>
            </template>

            <template v-else>
              <div
                v-for="region in filteredRegions"
                :key="region.id"
                :class="['mountain-point', { active: selectedRegion && selectedRegion.id === region.id }]"
                :style="{ left: getRegionPosition(region).x + '%', top: getRegionPosition(region).y + '%' }"
                @click="selectRegion(region)"
              >
                <div class="mountain-dot" style="background: var(--qing-2); box-shadow: 0 0 10px rgba(90,138,124,0.5);"></div>
                <span class="mountain-label">{{ region.name }}</span>
              </div>
            </template>
          </div>
        </div>

        <div v-if="selectedItem" class="mountain-detail">
          <div>
            <div class="mountain-detail-header">
              <h3 class="mountain-detail-name">{{ selectedItem.name }}</h3>
              <div class="mountain-detail-range">
                {{ currentRangeName }}
                <span v-if="mapMode === 'shanjing'"> · 第{{ selectedItem.order }}座</span>
              </div>
            </div>
            <div class="mountain-detail-desc">{{ selectedItem.description }}</div>
            <div v-if="selectedItem.translation" class="mountain-detail-translation">
              <span class="translation-label">白话释义</span>
              {{ selectedItem.translation }}
            </div>

            <div class="detail-section" v-if="selectedItem.waters && selectedItem.waters.length">
              <div class="detail-section-title">水 系</div>
              <div class="detail-chips">
                <span v-for="w in selectedItem.waters" :key="w" class="detail-chip">💧 {{ w }}</span>
              </div>
            </div>

            <div class="detail-section" v-if="selectedItem.features && selectedItem.features.length">
              <div class="detail-section-title">特 征</div>
              <div class="detail-chips">
                <span v-for="f in selectedItem.features" :key="f" class="detail-chip">{{ f }}</span>
              </div>
            </div>

            <div class="detail-section" v-if="selectedItem.products && selectedItem.products.length">
              <div class="detail-section-title">物 产</div>
              <div class="detail-chips">
                <span v-for="p in selectedItem.products" :key="p" class="detail-chip">{{ p }}</span>
              </div>
            </div>
          </div>

          <div>
            <div class="detail-section">
              <div class="detail-section-title">异 兽 / 奇 物</div>
            </div>
            <div class="mountain-beasts">
              <div v-if="itemBeasts.length === 0" class="no-beast">
                此地暂无详细异兽图鉴
              </div>
              <div
                v-for="beast in itemBeasts"
                :key="beast.id"
                class="beast-mini-card"
                @click="$emit('view-beast', beast.id)"
              >
                <div class="beast-mini-img">
                  <img v-if="beast.image" :src="beast.image" :alt="beast.name">
                  <span v-else style="font-size:1.5rem">📜</span>
                </div>
                <div class="beast-mini-info">
                  <h4>{{ beast.name }} · {{ beast.pinyin }}</h4>
                  <p>{{ beast.translation.slice(0, 50) }}……</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div v-else class="no-beast" style="background: var(--xuan); border: 1px solid var(--line); border-radius: 4px; padding: 3rem;">
          <span style="font-size:2rem; display:block; margin-bottom:0.5rem;">👆</span>
          点击地图上的地点查看详情
        </div>
      </div>
    </div>
  `
});

// ========== 知识库检索组件 ==========
const LibraryPage = defineComponent({
  name: 'LibraryPage',
  props: ['beasts', 'mountains', 'gods', 'stories', 'seaRegions', 'plants'],
  emits: ['nav', 'view-beast'],
  setup(props, { emit }) {
    const searchQuery = ref('');
    const activeCategory = ref('all');
    const selectedItem = ref(null);
    const showModal = ref(false);

    const categories = [
      { key: 'all', label: '全部', icon: '📚' },
      { key: 'beast', label: '异兽', icon: '🐉' },
      { key: 'plant', label: '植物', icon: '🌿' },
      { key: 'mountain', label: '山系', icon: '⛰' },
      { key: 'region', label: '地域', icon: '🗺' },
      { key: 'god', label: '神祇', icon: '⚡' },
      { key: 'story', label: '典故', icon: '📖' }
    ];

    const allItems = computed(() => {
      const items = [];
      props.beasts.forEach(b => items.push({
        ...b,
        type: 'beast',
        typeLabel: '异兽',
        desc: b.translation,
        source: b.chapter
      }));
      props.mountains.forEach(m => items.push({
        ...m,
        type: 'mountain',
        typeLabel: '山系',
        desc: m.translation || m.description,
        source: m.range,
        pinyin: ''
      }));
      if (props.seaRegions) {
        props.seaRegions.forEach(r => items.push({
          ...r,
          type: 'region',
          typeLabel: '地域',
          desc: r.translation || r.description,
          source: r.chapter,
          pinyin: '',
          image: ''
        }));
      }
      props.gods.forEach(g => items.push({
        ...g,
        type: 'god',
        typeLabel: '神祇',
        desc: g.translation || g.description,
        source: g.chapter,
        pinyin: '',
        image: ''
      }));
      if (props.plants) {
        props.plants.forEach(p => items.push({
          ...p,
          type: 'plant',
          typeLabel: '植物',
          desc: p.translation || p.description,
          source: p.chapter,
          pinyin: p.pinyin || '',
          image: ''
        }));
      }
      props.stories.forEach(s => items.push({
        ...s,
        type: 'story',
        typeLabel: '典故',
        desc: s.content,
        source: s.chapter,
        pinyin: '',
        image: ''
      }));
      return items;
    });

    const filteredItems = computed(() => {
      let items = allItems.value;
      
      if (activeCategory.value !== 'all') {
        items = items.filter(item => item.type === activeCategory.value);
      }
      
      if (searchQuery.value.trim()) {
        const q = searchQuery.value.toLowerCase().trim();
        items = items.filter(item => 
          item.name.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.source.toLowerCase().includes(q) ||
          (item.tags && item.tags.some(t => t.toLowerCase().includes(q)))
        );
      }
      
      return items;
    });

    const categoryCounts = computed(() => {
      return {
        all: allItems.value.length,
        beast: props.beasts.length,
        plant: props.plants ? props.plants.length : 0,
        mountain: props.mountains.length,
        region: props.seaRegions ? props.seaRegions.length : 0,
        god: props.gods.length,
        story: props.stories.length
      };
    });

    const openDetail = (item) => {
      selectedItem.value = item;
      showModal.value = true;
    };

    const closeModal = () => {
      showModal.value = false;
      selectedItem.value = null;
    };

    const clearSearch = () => {
      searchQuery.value = '';
    };

    const viewInCompare = (beastId) => {
      closeModal();
      emit('view-beast', beastId);
    };

    return {
      searchQuery,
      activeCategory,
      categories,
      filteredItems,
      categoryCounts,
      selectedItem,
      showModal,
      openDetail,
      closeModal,
      clearSearch,
      viewInCompare
    };
  },
  template: `
    <div class="library-page">
      <div class="container">
        <div class="library-header">
          <h2>古籍知识库</h2>
          <p>按异兽、山系、植物、神祇、典故检索，自带出处索引与认知误区科普</p>
        </div>

        <div class="library-search">
          <span class="library-search-icon">🔍</span>
          <input
            type="text"
            class="library-search-input"
            v-model="searchQuery"
            placeholder="搜索异兽、山系、植物、神祇、文化典故……"
          >
          <span v-if="searchQuery" class="library-search-clear" @click="clearSearch">✕</span>
        </div>

        <div class="library-categories">
          <button
            v-for="cat in categories"
            :key="cat.key"
            :class="['category-tab', { active: activeCategory === cat.key }]"
            @click="activeCategory = cat.key"
          >
            <span>{{ cat.icon }}</span>
            <span>{{ cat.label }}</span>
            <span class="category-count">{{ categoryCounts[cat.key] }}</span>
          </button>
        </div>

        <div v-if="filteredItems.length > 0" class="library-results">
          <div
            v-for="item in filteredItems"
            :key="item.id + '-' + item.type"
            class="result-card"
            @click="openDetail(item)"
          >
            <div class="result-card-header">
              <div class="result-card-img">
                <img v-if="item.image" :src="item.image" :alt="item.name">
                <span v-else>
                  <span v-if="item.type === 'beast'">🐉</span>
                  <span v-else-if="item.type === 'plant'">🌿</span>
                  <span v-else-if="item.type === 'mountain'">⛰</span>
                  <span v-else-if="item.type === 'region'">🗺</span>
                  <span v-else-if="item.type === 'god'">⚡</span>
                  <span v-else>📖</span>
                </span>
              </div>
              <div class="result-card-info">
                <span :class="['result-card-type', item.type]">{{ item.typeLabel }}</span>
                <h4>{{ item.name }}</h4>
                <div v-if="item.pinyin" class="pinyin">{{ item.pinyin }}</div>
              </div>
            </div>
            <div class="result-card-desc">{{ item.desc }}</div>
            <div class="result-card-source">
              <span>出处：{{ item.source }}</span>
              <span class="result-card-action">查看详情 →</span>
            </div>
          </div>
        </div>

        <div v-else class="no-results">
          <div class="no-results-icon">🔍</div>
          <div class="no-results-text">未找到相关内容</div>
          <div class="no-results-hint">试试其他关键词，或切换分类浏览</div>
        </div>
      </div>

      <!-- 详情弹窗 -->
      <transition name="fade">
        <div v-if="showModal && selectedItem" class="modal-overlay" @click.self="closeModal">
          <div class="modal-content">
            <div class="modal-close" @click="closeModal">✕</div>
            <div class="modal-body">
              <div class="beast-info-header">
                <div class="beast-info-img">
                  <img v-if="selectedItem.image" :src="selectedItem.image" :alt="selectedItem.name">
                  <span v-else style="font-size:2rem">
                    <span v-if="selectedItem.type === 'beast'">🐉</span>
                    <span v-else-if="selectedItem.type === 'plant'">🌿</span>
                    <span v-else-if="selectedItem.type === 'mountain'">⛰</span>
                    <span v-else-if="selectedItem.type === 'region'">🗺</span>
                    <span v-else-if="selectedItem.type === 'god'">⚡</span>
                    <span v-else>📖</span>
                  </span>
                </div>
                <div class="beast-info-text">
                  <span :class="['result-card-type', selectedItem.type]">{{ selectedItem.typeLabel }}</span>
                  <h3 style="font-size:1.6rem; color:var(--zhi); margin:0.3rem 0;">{{ selectedItem.name }}</h3>
                  <div v-if="selectedItem.pinyin" class="pinyin" style="color:var(--zhi-4); font-size:0.85rem;">{{ selectedItem.pinyin }}</div>
                </div>
              </div>

              <div v-if="selectedItem.type === 'beast'" class="original-section">
                <div class="original-section-title">原 文</div>
                <div class="original-text">{{ selectedItem.original }}</div>
              </div>

              <div v-if="selectedItem.type === 'mountain' || selectedItem.type === 'region' || selectedItem.type === 'god' || selectedItem.type === 'plant'" class="original-section">
                <div class="original-section-title">原 文 记 载</div>
                <div class="original-text">{{ selectedItem.description }}</div>
              </div>

              <div class="original-section">
                <div class="original-section-title translation-title">白 话 释 义</div>
                <div class="translation-text" v-if="selectedItem.type === 'beast'">{{ selectedItem.desc }}</div>
                <div class="translation-text" v-else-if="selectedItem.translation">{{ selectedItem.translation }}</div>
                <div class="translation-text" v-else>{{ selectedItem.desc }}</div>
              </div>

              <div v-if="selectedItem.kidsStory" class="original-section">
                <div class="original-section-title story-kids-title">🐉 小 朋 友 故 事 屋</div>
                <div class="kids-story-box">
                  <div class="kids-story-text">{{ selectedItem.kidsStory }}</div>
                </div>
              </div>

              <div v-if="selectedItem.type === 'beast'" class="original-section">
                <div class="original-section-title">出 处</div>
                <div class="translation-text" style="border-left-color: var(--jin);">
                  《山海经 · {{ selectedItem.chapter }}》<br>
                  所在山系：{{ selectedItem.mountain }}
                </div>
              </div>

              <div v-if="selectedItem.type === 'mountain'" class="original-section">
                <div class="original-section-title">水 系 / 物 产</div>
                <div class="detail-chips" style="margin-top:0.5rem;">
                  <span v-for="w in selectedItem.waters" :key="w" class="detail-chip">💧 {{ w }}</span>
                  <span v-for="p in selectedItem.products" :key="p" class="detail-chip">{{ p }}</span>
                </div>
              </div>

              <div v-if="selectedItem.type === 'region'" class="original-section">
                <div class="original-section-title region-title">特 征</div>
                <div class="detail-chips" style="margin-top:0.5rem;">
                  <span v-for="f in selectedItem.features" :key="f" class="detail-chip">{{ f }}</span>
                </div>
              </div>

              <div v-if="selectedItem.type === 'god'" class="original-section">
                <div class="original-section-title">形 貌 / 祭 祀</div>
                <div class="translation-text" style="border-left-color: var(--zhu);">
                  <p><strong>形貌：</strong>{{ selectedItem.appearance }}</p>
                  <p v-if="selectedItem.worship" style="margin-top:0.5rem;"><strong>祭祀：</strong>{{ selectedItem.worship }}</p>
                </div>
              </div>

              <div v-if="selectedItem.type === 'plant'" class="original-section">
                <div class="original-section-title">植 物 信 息</div>
                <div class="translation-text" style="border-left-color: var(--qing-2);">
                  <p><strong>类别：</strong>{{ selectedItem.category }}</p>
                  <p v-if="selectedItem.mountain" style="margin-top:0.5rem;"><strong>所在山：</strong>{{ selectedItem.mountain }}</p>
                  <p v-if="selectedItem.efficacy" style="margin-top:0.5rem;"><strong>功效：</strong>{{ selectedItem.efficacy }}</p>
                </div>
              </div>

              <div v-if="selectedItem.type === 'plant' && selectedItem.features" class="original-section">
                <div class="original-section-title">特 征</div>
                <div class="detail-chips" style="margin-top:0.5rem;">
                  <span v-for="f in selectedItem.features" :key="f" class="detail-chip">{{ f }}</span>
                </div>
              </div>

              <div v-if="selectedItem.type === 'story'" class="original-section">
                <div class="original-section-title">时 代</div>
                <div class="translation-text" style="border-left-color: #b9a3e0;">
                  {{ selectedItem.era }}
                </div>
              </div>

              <div v-if="selectedItem.type === 'beast'" style="margin-top:1.5rem; text-align:center;">
                <button class="btn btn-primary" @click="viewInCompare(selectedItem.id)">
                  查看原著改编对照 →
                </button>
              </div>
            </div>
          </div>
        </div>
      </transition>
    </div>
  `
});

// ========== 主应用 ==========
const app = createApp({
  components: {
    'home-page': HomePage,
    'map-page': MapPage,
    'compare-page': ComparePage,
    'library-page': LibraryPage
  },
  setup() {
    const currentPage = ref('home');
    const selectedBeast = ref(null);
    const beasts = ref(beastsData);
    const mountains = ref(mountainsData);
    const gods = ref(godsData);
    const stories = ref(storiesData);
    const seaRegions = ref(seaRegionsData);
    const plants = ref(plantsData);
    const bookSystemData = bookSystem;

    const navigate = (page) => {
      currentPage.value = page;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const viewBeast = (beastId) => {
      const beast = beastsData.find(b => b.id === beastId);
      selectedBeast.value = beast || beastsData[0];
      currentPage.value = 'compare';
    };

    return {
      currentPage,
      selectedBeast,
      beasts,
      mountains,
      gods,
      stories,
      seaRegions,
      plants,
      bookSystem: bookSystemData,
      navigate,
      viewBeast
    };
  }
});

app.mount('#app');
</script>
</body>
</html>
