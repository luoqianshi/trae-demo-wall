[package]
name = "ai_filemanager_shell_ext"
version = "0.1.0"
description = "AI FileManager Windows Shell Extension DLL"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Windows API for COM and Shell Extension
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
]}