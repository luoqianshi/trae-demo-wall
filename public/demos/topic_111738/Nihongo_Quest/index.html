<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日语秘境 · 第 1 关 便利店买水</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --mint: #a8dadc;
      --mint-deep: #6fb6b8;
      --sakura: #ffb7c5;
      --sakura-deep: #ff7aa2;
      --cream: #fff8f0;
      --ink: #2b3a3a;
      --ink-soft: #4d6161;
      --line: rgba(43, 58, 58, 0.08);
      --shadow: 0 12px 32px rgba(43, 58, 58, 0.12);
      --shadow-soft: 0 6px 18px rgba(43, 58, 58, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Zen Kaku Gothic New", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 10%, #ffe1ec 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #d2f0f1 0%, transparent 50%),
        linear-gradient(180deg, #fff8f0 0%, #fef0e8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============ Common ============ */
    .view {
      animation: fadeIn 0.45s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .brand .mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--sakura) 0%, var(--sakura-deep) 100%);
      display: grid; place-items: center;
      color: white; font-size: 16px;
      box-shadow: var(--shadow-soft);
    }
    .progress-dot {
      font-size: 12px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.6);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .btn {
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--sakura) 0%, var(--sakura-deep) 100%);
      color: white;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(255, 122, 162, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 122, 162, 0.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5; cursor: not-allowed; transform: none;
      box-shadow: 0 2px 6px rgba(255, 122, 162, 0.2);
    }
    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      padding: 12px 24px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.6); border-color: var(--mint); }

    /* ============ Role Select ============ */
    .role-card-wrap {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .level-title {
      text-align: center;
      margin-bottom: 8px;
    }
    .level-title .label {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--sakura-deep);
      background: rgba(255, 183, 197, 0.18);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
    }
    .level-title h1 {
      font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
      font-size: 36px;
      font-weight: 900;
      margin-top: 12px;
      letter-spacing: 1px;
    }
    .level-title .jp {
      font-size: 15px;
      color: var(--ink-soft);
      margin-top: 6px;
      font-weight: 500;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 28px 0 12px;
    }
    .role-card {
      background: white;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 24px 16px 20px;
      cursor: pointer;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .role-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--mint);
    }
    .role-card .emoji {
      font-size: 56px;
      display: block;
      margin-bottom: 8px;
    }
    .role-card h3 {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .role-card .role-jp {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }
    .role-card p {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.5;
    }
    .role-card .tag {
      position: absolute;
      top: 12px; right: 12px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink-soft);
      letter-spacing: 1px;
    }

    .role-tip {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 16px;
    }
    .role-tip kbd {
      display: inline-block;
      padding: 2px 6px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }

    /* ============ Dialogue ============ */
    .scene {
      position: relative;
      height: 360px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      background:
        linear-gradient(180deg, #fff4e6 0%, #ffe5d4 60%, #ffd0b5 100%);
    }
    .scene img.bg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .scene .bg-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.15) 0 30px, transparent 30px 60px),
        linear-gradient(180deg, #fff4e6 0%, #ffe5d4 100%);
      color: var(--ink-soft);
      font-size: 14px;
    }
    .scene .bg-fallback::before {
      content: "🏪";
      font-size: 80px;
      margin-bottom: 8px;
    }

    /* Speech bubble */
    .bubble {
      position: absolute;
      max-width: 220px;
      padding: 12px 14px;
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      animation: pop 0.3s ease both;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .bubble:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(43, 58, 58, 0.15);
    }
    .bubble:active {
      transform: scale(0.98);
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble.left {
      top: 18px; left: 18px;
      border-left: 4px solid var(--mint-deep);
    }
    .bubble.left::after {
      content: ""; position: absolute; left: -10px; top: 18px;
      border: 8px solid transparent; border-right-color: white;
    }
    .bubble.right {
      top: 18px; right: 18px;
      border-right: 4px solid var(--sakura-deep);
      text-align: right;
    }
    .bubble.right::after {
      content: ""; position: absolute; right: -10px; top: 18px;
      border: 8px solid transparent; border-left-color: white;
    }
    .bubble .jp {
      font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--ink);
    }
    .bubble .cn {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .bubble .hint-label {
      display: inline-block;
      font-size: 10px;
      color: var(--sakura-deep);
      background: rgba(255, 183, 197, 0.2);
      padding: 1px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .recognition-overlay {
      position: absolute;
      bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(43, 58, 58, 0.85);
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      max-width: 80%;
      text-align: center;
      animation: pop 0.25s ease both;
    }
    .recognition-overlay.error {
      background: rgba(220, 53, 69, 0.92);
    }

    /* Action bar */
    .action-bar {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .action-bar .turn-label {
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .action-bar .turn-hint {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 16px;
      text-align: center;
    }

    .voice-btn {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--sakura) 0%, var(--sakura-deep) 100%);
      color: white;
      font-size: 36px;
      display: grid; place-items: center;
      box-shadow: 0 8px 24px rgba(255, 122, 162, 0.5);
      transition: transform 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .voice-btn:hover { transform: scale(1.04); }
    .voice-btn:active, .voice-btn.recording {
      transform: scale(1.12);
      background: linear-gradient(135deg, #ff5577 0%, #d63854 100%);
      box-shadow: 0 12px 28px rgba(214, 56, 84, 0.6);
    }
    .voice-btn:disabled {
      background: #ccc; cursor: not-allowed; box-shadow: none; transform: none;
    }
    .voice-btn .pulse {
      position: absolute;
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--sakura);
      opacity: 0.6;
      animation: pulse 1.2s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .voice-btn .pulse.hidden { display: none; }

    .voice-btn-wrap { position: relative; display: inline-block; }
    .voice-tip {
      margin-top: 14px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .voice-tip b { color: var(--sakura-deep); }

    .voice-controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      justify-content: center;
    }

    .fallback-input {
      margin-top: 12px;
      display: flex; gap: 8px; width: 100%; max-width: 480px;
    }
    .fallback-input input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }
    .fallback-input input:focus {
      outline: none;
      border-color: var(--mint);
    }

    .next-step {
      display: flex; flex-direction: column; align-items: center;
    }
    .npc-text {
      font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin: 8px 0 6px;
    }
    .npc-cn {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 20px;
    }

    .fail-block {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .fail-msg {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(220, 53, 69, 0.1);
      color: #d63854;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .fail-buttons {
      display: flex; gap: 12px; justify-content: center;
      flex-wrap: wrap;
    }
    .hint-card {
      margin-top: 16px;
      padding: 16px;
      background: var(--cream);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--sakura);
      text-align: left;
    }
    .hint-card .hint-title {
      font-size: 12px;
      color: var(--sakura-deep);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .hint-card .hint-jp {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hint-card .hint-cn {
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* Step indicator (small) */
    .step-indicator {
      display: flex; gap: 6px; margin-top: 16px;
    }
    .step-indicator .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.12);
      transition: all 0.3s ease;
    }
    .step-indicator .dot.active { background: var(--sakura-deep); transform: scale(1.3); }
    .step-indicator .dot.done { background: var(--mint-deep); }

    /* ============ Result ============ */
    .result-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .result-card .icon {
      width: 88px; height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint) 0%, var(--mint-deep) 100%);
      display: grid; place-items: center;
      font-size: 44px;
      color: white;
      box-shadow: 0 8px 20px rgba(111, 182, 184, 0.45);
      animation: bounce 0.8s ease;
    }
    @keyframes bounce {
      0%   { transform: scale(0); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .result-card h2 {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .result-card .jp {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 24px;
    }
    .result-stats {
      display: flex; justify-content: center; gap: 32px;
      margin: 24px 0 32px;
    }
    .result-stats .stat {
      display: flex; flex-direction: column; align-items: center;
    }
    .result-stats .stat .num {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--sakura-deep);
      line-height: 1;
    }
    .result-stats .stat .label {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 6px;
      letter-spacing: 2px;
    }
    .result-actions {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }

    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }
    .petals span {
      position: absolute;
      top: -10%;
      color: var(--sakura);
      font-size: 18px;
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {
      0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .scene { height: 280px; }
      .voice-btn { width: 80px; height: 80px; font-size: 30px; }
      .voice-btn .pulse { width: 80px; height: 80px; }
      .bubble { max-width: 160px; font-size: 14px; padding: 10px 12px; }
      .bubble .jp { font-size: 15px; }
      .npc-text { font-size: 22px; }
      .level-title h1 { font-size: 28px; }
      .role-card .emoji { font-size: 44px; }
    }
  </style>
</head>
<body>
  <div class="petals" id="petals"></div>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <span class="mark">🌸</span>
        <span>日语秘境</span>
      </div>
      <div class="progress-dot" id="progressDot">第 1 / 1 关</div>
    </div>

    <!-- ===== Role Select ===== -->
    <section class="view view-role" data-view="role">
      <div class="role-card-wrap">
        <div class="level-title">
          <span class="label">LEVEL 01</span>
          <h1>便利店买水</h1>
          <div class="jp">コンビニでお水を買おう</div>
        </div>

        <div class="role-grid">
          <div class="role-card" data-role="customer">
            <span class="tag">買う</span>
            <span class="emoji">🛒</span>
            <h3>顾客</h3>
            <div class="role-jp">客（きゃく）</div>
            <p>你来买东西<br>向店员点一瓶水</p>
          </div>
          <div class="role-card" data-role="clerk">
            <span class="tag">売る</span>
            <span class="emoji">🏪</span>
            <h3>店员</h3>
            <div class="role-jp">店員（てんいん）</div>
            <p>你来接待客人<br>欢迎并收款</p>
          </div>
        </div>

        <div class="role-tip">
          💡 选择角色后，按住圆形按钮 <kbd>🎤</kbd> 说话完成对话
        </div>
      </div>
    </section>

    <!-- ===== Dialogue ===== -->
    <section class="view view-dialogue" data-view="dialogue" hidden>
      <div class="scene" id="scene">
        <img class="bg" id="sceneImg" alt="便利店场景" />
        <div class="bg-fallback" id="sceneFallback">场景加载中…</div>
        <div class="bubble left" id="bubbleLeft" hidden>
          <div class="jp"></div>
          <div class="cn"></div>
        </div>
        <div class="bubble right" id="bubbleRight" hidden>
          <div class="jp"></div>
          <div class="cn"></div>
        </div>
        <div class="recognition-overlay" id="recognition" hidden></div>
      </div>

      <div class="action-bar" id="actionBar">
        <!-- Dynamic content -->
      </div>
    </section>

    <!-- ===== Result ===== -->
    <section class="view view-result" data-view="result" hidden>
      <div class="result-card">
        <div class="icon">✓</div>
        <h2>关卡完成！</h2>
        <div class="jp">レベルクリア！</div>
        <div class="result-stats">
          <div class="stat">
            <div class="num" id="statAttempts">0</div>
            <div class="label">尝试次数</div>
          </div>
          <div class="stat">
            <div class="num" id="statAccuracy">0%</div>
            <div class="label">正确率</div>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" id="btnReplay">再玩一次</button>
          <button class="btn btn-ghost" id="btnBack">返回选关</button>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function () {
    'use strict';

    // ============ Level Data ============
    const LEVELS = [
      {
        id: 'level-1',
        title: '便利店买水',
        subtitle: 'コンビニでお水を買おう',
        scenePrompt: encodeURIComponent(
          'a warm anime-style Japanese convenience store interior, ' +
          'behind the counter stands a young female shop clerk in uniform with a cap, ' +
          'in front of the counter stands a male customer, ' +
          'shelves full of colorful drinks and snacks, soft warm lighting, ' +
          'pastel color palette, illustration, 2D, clean lines, ' +
          'Studio Ghibli inspired, no text, no watermark'
        ),
        scripts: {
          customer: [
            { type: 'npc', side: 'right', text: 'いらっしゃいませ。', cn: '欢迎光临。' },
            {
              type: 'user',
              side: 'left',
              text: 'すみません、水を一本ください。',
              cn: '不好意思，请给我一瓶水。',
              accepts: [
                'すみません水を一本ください',
                'すみませんお水を一本ください',
                'すみませんお水を一杯ください',
                'すみません水をください',
                'すみませんお水をください',
                'お水を一本ください',
                '水を一本ください',
                'お水を一杯ください',
                '水をください',
                'お水をください',
                'お水ください',
                '水ください',
                '水を一杯ください',
                'すみません水を一杯ください',
                'お水を一本お願いします',
                '水を一本お願いします',
                '水を一本お願いします',
                'お水を一本ください'
              ]
            },
            { type: 'npc', side: 'right', text: 'はい、110円です。', cn: '好的，110 日元。' },
            {
              type: 'user',
              side: 'left',
              text: 'はい、どうぞ。',
              cn: '好的，给您。',
              accepts: ['はいです', 'はいはい', 'はい', 'どうぞ', 'はいどうぞ', 'はいどうそ', 'は、どうぞ']
            },
            { type: 'npc', side: 'right', text: 'ありがとうございました。', cn: '感谢您的惠顾。' }
          ],
          clerk: [
            {
              type: 'user',
              side: 'right',
              text: 'いらっしゃいませ。',
              cn: '欢迎光临。',
              accepts: [
                'いらっしゃいませ',
                'いらしゃいませ',
                'いらっさいませ',
                'いらっしゃい',
                'いらしゃい',
                '欢迎光临'
              ]
            },
            { type: 'npc', side: 'left', text: 'すみません、水を一本ください。', cn: '不好意思，请给我一瓶水。' },
            {
              type: 'user',
              side: 'right',
              text: 'はい、110円です。',
              cn: '好的，110 日元。',
              accepts: [
                'はい110円です',
                '110円です',
                'はい、110円です',
                'はい110えん',
                '110えんです',
                '110円'
              ]
            },
            { type: 'npc', side: 'left', text: 'はい、どうぞ。', cn: '好的，给您。' },
            {
              type: 'user',
              side: 'right',
              text: 'ありがとうございました。',
              cn: '感谢您的惠顾。',
              accepts: [
                'ありがとうございました',
                'ありがとうございました',
                'ありがとうございました',
                'ありがとう',
                'ご来店ありがとうございました',
                '谢谢'
              ]
            }
          ]
        }
      }
    ];

    // ============ State ============
    const state = {
      view: 'role',
      level: LEVELS[0],
      role: null,        // 'customer' | 'clerk'
      stepIndex: 0,
      attempts: 0,       // 总尝试次数
      successes: 0,      // 用户轮成功次数
      totalUserTurns: 0, // 用户轮总数
      recognition: null, // 当前 SpeechRecognition 实例
      isRecording: false,
      fallbackMode: false
    };

    // ============ DOM ============
    const $ = (id) => document.getElementById(id);
    const views = {
      role: document.querySelector('[data-view="role"]'),
      dialogue: document.querySelector('[data-view="dialogue"]'),
      result: document.querySelector('[data-view="result"]')
    };
    const els = {
      progressDot: $('progressDot'),
      sceneImg: $('sceneImg'),
      sceneFallback: $('sceneFallback'),
      bubbleLeft: $('bubbleLeft'),
      bubbleRight: $('bubbleRight'),
      recognition: $('recognition'),
      actionBar: $('actionBar'),
      statAttempts: $('statAttempts'),
      statAccuracy: $('statAccuracy'),
      btnReplay: $('btnReplay'),
      btnBack: $('btnBack')
    };

    // ============ Helpers ============
    function showView(name) {
      state.view = name;
      Object.entries(views).forEach(([k, v]) => {
        v.hidden = k !== name;
      });
    }

    function normalize(text) {
      if (!text) return '';
      return text
        .replace(/[\s\u3000]/g, '')             // remove all spaces
        .replace(/[、。，．,。?!\?!\.。]/g, '')  // remove punctuation
        .replace(/[ー－]/g, '-')                 // dash variants
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // full-width → half-width
        .toLowerCase();
    }

    function isAccept(recognized, accepts) {
      const n = normalize(recognized);
      if (!n) return false;
      for (const a of accepts) {
        if (normalize(a) === n) return true;
      }
      // 容错：若识别结果中包含所有 accepts 公共子串，或满足"包含核心关键词"也通过
      // 简化：核心关键词来自第一条 accept
      const tokens = normalize(accepts[0])
        .replace(/[はをのにをがはです]/g, '')   // 去掉常见助词
        .split(/[-ー]/)
        .filter(t => t.length >= 1);
      if (tokens.length === 0) return false;
      // 所有 token 都出现在识别结果中
      return tokens.every(t => n.includes(t));
    }

    // ============ TTS ============
    let voicesLoaded = false;
    function loadVoices() {
      return new Promise((resolve) => {
        let voices = speechSynthesis.getVoices();
        if (voices.length) { voicesLoaded = true; return resolve(voices); }
        speechSynthesis.onvoiceschanged = () => {
          voices = speechSynthesis.getVoices();
          voicesLoaded = true;
          resolve(voices);
        };
        // 超时兜底
        setTimeout(() => resolve(speechSynthesis.getVoices() || []), 1500);
      });
    }
    async function speakJa(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ja-JP';
        utter.rate = 0.9;
        utter.pitch = 1.0;
        const voices = await loadVoices();
        const ja = voices.find(v => /ja/i.test(v.lang));
        if (ja) utter.voice = ja;
        return new Promise((resolve) => {
          utter.onend = resolve;
          utter.onerror = resolve;
          speechSynthesis.speak(utter);
        });
      } catch (e) { /* 静默失败，不影响流程 */ }
    }
    function stopSpeak() {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
    }

    // ============ Speech Recognition ============
    function getRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const r = new SR();
      r.lang = 'ja-JP';
      r.interimResults = false;
      r.maxAlternatives = 3;
      r.continuous = false;
      return r;
    }

    function isSecureContext() {
      return window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    }

    function startRecording() {
      if (state.isRecording) return;
      if (!isSecureContext()) {
        showRecognition('当前环境不支持语音输入，请用键盘输入', 'error');
        state.fallbackMode = true;
        renderFallback();
        return;
      }
      const r = getRecognition();
      if (!r) {
        state.fallbackMode = true;
        renderFallback();
        return;
      }
      state.recognition = r;
      state.isRecording = true;
      try {
        r.start();
      } catch (e) {
        state.isRecording = false;
        showRecognition('无法启动语音识别，请用键盘输入', 'error');
        state.fallbackMode = true;
        renderFallback();
        return;
      }
      renderVoiceBtn();

      r.onresult = (e) => {
        // 收集所有候选
        const results = [];
        for (let i = 0; i < e.results.length; i++) {
          const res = e.results[i];
          for (let j = 0; j < res.length; j++) {
            results.push(res[j].transcript);
          }
        }
        const best = results[0] || '';
        handleRecognitionResult(best, results);
      };
      r.onerror = (e) => {
        // 仅当当前实例还是这个 r 时才处理
        if (state.recognition !== r) return;
        state.isRecording = false;
        if (e.error === 'no-speech') {
          showRecognition('没听到声音，请按住 🎤 再试一次', 'error');
          renderVoiceBtn();
          return;
        }
        if (e.error === 'aborted') {
          renderVoiceBtn();
          return;
        }
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          showRecognition('未获得麦克风权限，已切换到文字输入模式', 'error');
          state.fallbackMode = true;
          renderFallback();
          return;
        }
        showRecognition('识别出错，请重试', 'error');
        renderFail();
      };
      r.onend = () => {
        // 仅当当前实例还是这个 r 时才处理（避免覆盖用户主动停止后的状态）
        if (state.recognition !== r) return;
        state.isRecording = false;
        renderVoiceBtn();
      };
    }

    function stopRecording() {
      // 无论识别实例是否存在，都立即恢复按钮样式
      state.isRecording = false;
      renderVoiceBtn();
      if (state.recognition) {
        const r = state.recognition;
        state.recognition = null; // 提前解绑，防止 onend 再次处理
        try { r.stop(); } catch (e) {}
      }
    }

    function handleRecognitionResult(text, all) {
      const step = getCurrentStep();
      if (!step || step.type !== 'user') return;
      state.attempts += 1;

      const ok = isAccept(text, step.accepts);
      const allText = (all || [text]).join(' / ');
      if (ok) {
        state.successes += 1;
        showBubble(step.side, step.text, step.cn, '你说');
        showRecognition('✓ ' + allText, 'ok');
        // 用户说完后等待 2 秒进入下一回合
        setTimeout(() => {
          hideAllBubbles();
          state.stepIndex += 1;
          renderStep();
        }, 2000);
      } else {
        showRecognition('没听清，再试一次 · ' + allText, 'error');
        renderFail();
      }
    }

    // ============ Step Logic ============
    function getCurrentStep() {
      if (!state.role) return null;
      return state.level.scripts[state.role][state.stepIndex];
    }

    function renderStep() {
      stopSpeak();
      const step = getCurrentStep();
      hideAllBubbles();
      $('recognition').hidden = true;
      if (!step) {
        // 通关
        renderResult();
        return;
      }
      updateStepIndicator();

      if (step.type === 'npc') {
        // NPC 说话：显示气泡，由 renderNpcStep 统一管理 TTS 播放
        showBubble(step.side, step.text, step.cn);
        renderNpcStep(step);
      } else {
        // 轮到用户：显示气泡（不自动播放），点击播放
        showBubble(step.side, step.text, step.cn, '请说');
        renderUserStep(step);
      }
    }

    async function renderNpcStep(step) {
      els.actionBar.innerHTML = `
        <div class="next-step">
          <div class="turn-label">对方正在说</div>
          <div class="npc-text">${step.text}</div>
          <div class="npc-cn">${step.cn}</div>
        </div>
      `;
      // 等待 TTS 播放完成后再进入下一回合
      await speakJa(step.text);
      await new Promise(r => setTimeout(r, 500)); // 播完后多等 0.5 秒
      hideAllBubbles();
      state.stepIndex += 1;
      const nextStep = getCurrentStep();
      if (!nextStep) {
        renderResult();
        return;
      }
      updateStepIndicator();
      if (nextStep.type === 'user') {
        // NPC 说完后，显示用户提示气泡（不自动播放），点击气泡才播放
        showBubble(nextStep.side, nextStep.text, nextStep.cn, '请说');
        renderUserStep(nextStep);
      } else {
        // 继续 NPC 回合：先递归（会自动播放本回合），不要在调用前再 speakJa
        showBubble(nextStep.side, nextStep.text, nextStep.cn);
        renderNpcStep(nextStep);
      }
    }

    function renderUserStep(step) {
      if (state.fallbackMode) {
        renderFallback();
        return;
      }
      els.actionBar.innerHTML = `
        <div class="voice-btn-wrap">
          <button class="voice-btn" id="voiceBtn" aria-label="按住说话">
            <span class="pulse ${state.isRecording ? '' : 'hidden'}" id="pulse"></span>
            <span id="voiceIcon">🎤</span>
          </button>
        </div>
        <div class="voice-tip">
          ${state.isRecording
            ? '正在录音… 松开按钮结束'
            : '按住 <b>🎤</b> 说话，松开结束，或直接在下方输入'}
        </div>
        <div class="fallback-input" style="margin-top: 14px;">
          <input type="text" id="textInput" placeholder="或在此输入日文…" />
          <button class="btn btn-primary" id="btnTextSubmit" style="padding: 10px 18px;">发送</button>
        </div>
      `;
      const btn = $('voiceBtn');
      // 按住说话 / 松开结束
      btn.addEventListener('mousedown', startRecording);
      btn.addEventListener('mouseup', stopRecording);
      btn.addEventListener('mouseleave', stopRecording);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
      $('textInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitTextInput();
      });
      $('btnTextSubmit').addEventListener('click', submitTextInput);
    }

    function renderVoiceBtn() {
      const btn = $('voiceBtn');
      const pulse = $('pulse');
      if (!btn) return;
      if (state.isRecording) {
        btn.classList.add('recording');
        pulse && pulse.classList.remove('hidden');
      } else {
        btn.classList.remove('recording');
        pulse && pulse.classList.add('hidden');
      }
    }

    function submitTextInput() {
      const input = $('textInput');
      const text = (input.value || '').trim();
      if (!text) return;
      handleRecognitionResult(text, [text]);
      input.value = '';
    }

    function renderFallback() {
      const step = getCurrentStep();
      if (!step) return;
      els.actionBar.innerHTML = `
        <div class="voice-btn-wrap" style="opacity:.4;pointer-events:none;">
          <button class="voice-btn" disabled title="当前浏览器不支持语音识别">
            <span>🎤</span>
          </button>
        </div>
        <div class="voice-tip" style="color:#d63854;">当前浏览器不支持语音识别，请用文字输入完成对话</div>
        <div class="fallback-input">
          <input type="text" id="textInput" placeholder="请输入日文台词…" />
          <button class="btn btn-primary" id="btnTextSubmit" style="padding: 10px 18px;">发送</button>
        </div>
        <div class="hint-card" style="margin-top:14px;">
          <div class="hint-title">标准台词（照着念）</div>
          <div class="hint-jp">${step.text}</div>
          <div class="hint-cn">${step.cn}</div>
        </div>
      `;
      $('textInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitTextInput();
      });
      $('btnTextSubmit').addEventListener('click', submitTextInput);
      $('textInput').focus();
    }

    function renderFail() {
      const step = getCurrentStep();
      if (!step) return;
      els.actionBar.innerHTML = `
        <div class="fail-block">
          <div class="fail-msg">没听清，再试一次</div>
          <div class="fail-buttons">
            <button class="btn btn-primary" id="btnRetry">🔄 重试</button>
            <button class="btn btn-ghost" id="btnShowHint">💡 看提示</button>
          </div>
          <div class="hint-card" id="hintCard" hidden>
            <div class="hint-title">标准台词（照着念）</div>
            <div class="hint-jp">${step.text}</div>
            <div class="hint-cn">${step.cn}</div>
          </div>
        </div>
      `;
      $('btnRetry').addEventListener('click', () => {
        hideAllBubbles();
        renderUserStep(step);
      });
      $('btnShowHint').addEventListener('click', () => {
        const card = $('hintCard');
        card.hidden = false;
        $('btnShowHint').disabled = true;
      });
    }

    function renderResult() {
      stopSpeak();
      const totalUserTurns = countUserTurns();
      const acc = totalUserTurns === 0 ? 0 : Math.round((state.successes / totalUserTurns) * 100);
      els.statAttempts.textContent = state.attempts;
      els.statAccuracy.textContent = acc + '%';
      showView('result');
      startPetals();
    }

    function countUserTurns() {
      return state.level.scripts[state.role].filter(s => s.type === 'user').length;
    }

    function updateStepIndicator() {
      const total = state.level.scripts[state.role].length;
      const dots = Array.from({ length: total }, (_, i) => {
        let cls = 'dot';
        if (i < state.stepIndex) cls += ' done';
        else if (i === state.stepIndex) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('');
      // 复用 action-bar 中的指示器位置（追加到底部）
      let ind = document.getElementById('stepIndicator');
      if (!ind) {
        ind = document.createElement('div');
        ind.id = 'stepIndicator';
        ind.className = 'step-indicator';
        els.actionBar.appendChild(ind);
      }
      ind.innerHTML = dots;
    }

    // ============ Bubbles ============
    function showBubble(side, jp, cn, label) {
      const el = side === 'left' ? els.bubbleLeft : els.bubbleRight;
      el.querySelector('.jp').textContent = jp;
      const cnEl = el.querySelector('.cn');
      if (cn) {
        cnEl.textContent = cn;
        cnEl.style.display = '';
      } else {
        cnEl.style.display = 'none';
      }
      // 顶部标签
      let labelEl = el.querySelector('.hint-label');
      if (label) {
        if (!labelEl) {
          labelEl = document.createElement('div');
          labelEl.className = 'hint-label';
          el.insertBefore(labelEl, el.firstChild);
        }
        labelEl.textContent = label;
      } else if (labelEl) {
        labelEl.remove();
      }
      // 存储日文文本供点击朗读
      el.dataset.jp = jp;
      el.hidden = false;
    }
    function hideAllBubbles() {
      els.bubbleLeft.hidden = true;
      els.bubbleRight.hidden = true;
    }

    function showRecognition(text, type) {
      const el = els.recognition;
      el.textContent = text;
      el.className = 'recognition-overlay' + (type === 'error' ? ' error' : '');
      el.hidden = false;
    }

    // ============ Petals ============
    function startPetals() {
      const wrap = $('petals');
      wrap.innerHTML = '';
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('span');
        s.textContent = '🌸';
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDuration = (5 + Math.random() * 6) + 's';
        s.style.animationDelay = (Math.random() * 5) + 's';
        s.style.fontSize = (14 + Math.random() * 10) + 'px';
        wrap.appendChild(s);
      }
      setTimeout(() => { wrap.innerHTML = ''; }, 6000);
    }

    // ============ Scene Image ============
    function loadScene() {
      const prompt = state.level.scenePrompt;
      const url = `https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${prompt}&image_size=landscape_16_9`;
      const img = els.sceneImg;
      img.onload = () => {
        els.sceneFallback.style.display = 'none';
      };
      img.onerror = () => {
        img.style.display = 'none';
        els.sceneFallback.textContent = '🏪 コンビニ';
      };
      img.src = url;
    }

    // ============ Event Wiring ============
    document.querySelectorAll('.role-card').forEach(card => {
      card.addEventListener('click', () => {
        const role = card.dataset.role;
        startLevel(role);
      });
    });

    // 气泡点击朗读
    [els.bubbleLeft, els.bubbleRight].forEach(bubble => {
      bubble.addEventListener('click', () => {
        const text = bubble.dataset.jp;
        if (text) speakJa(text);
      });
    });

    els.btnReplay.addEventListener('click', () => {
      startLevel(state.role);
    });
    els.btnBack.addEventListener('click', () => {
      stopSpeak();
      showView('role');
    });

    function startLevel(role) {
      state.role = role;
      state.stepIndex = 0;
      state.attempts = 0;
      state.successes = 0;
      state.fallbackMode = !getRecognition();
      showView('dialogue');
      els.progressDot.textContent = state.role === 'customer' ? '第 1 关 · 顾客' : '第 1 关 · 店员';
      loadScene();
      renderStep();
    }

    // 初始
    showView('role');
    if (state.fallbackMode) {
      // 标记 fallback 模式，等用户进入关卡时显示文字输入
    }

    // 预加载语音
    if ('speechSynthesis' in window) {
      loadVoices();
    }
  })();
  </script>
</body>
</html>
