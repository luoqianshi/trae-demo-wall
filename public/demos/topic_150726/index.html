我记得那个小男孩把我放在水泥地上的样子，记得他眼睛里的光，记得他身后那棵永远摇摇晃晃的老槐树。后来他被作业和考试淹没，我也被收进了抽屉深处。

我的第二人生，是成为城市记忆收藏家——收集那些被遗忘的童年片段，在某个不经意的午后，用一声咔嗒，唤醒你心底最柔软的角落。`},{id:`teddy`,name:`旧泰迪熊`,emoji:`🧸`,mood:`柔软 · 陪伴`,tags:[`柔软`,`陪伴`,`温暖`],role:`深夜拥抱官`,quote:`"我的棉花有些跑出来了，但我的拥抱依然满分。"`,keywords:`陪伴、治愈`,avatar:`🧸`,rarity:`SR`,era:`2010s`,story:`我是一只缺了左耳的棕色泰迪熊，右眼的纽扣已经松动，肚子上的缝线也歪歪扭扭。但我的棉花芯里，藏着一个孩子从三岁到十三岁的所有眼泪。
