<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店长模拟器 · 7天开店挑战</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');

    :root {
      --bg: #1a1c2c;
      --bg2: #29366f;
      --bg3: #3b5dc9;
      --fg: #f4f4f4;
      --fg-dark: #a0a8c0;
      --accent: #ffcd75;
      --accent2: #ff6f69;
      --green: #38b764;
      --green-dark: #257179;
      --red: #b13e53;
      --blue: #41a6f6;
      --purple: #733eff;
      --border: #566c86;
      --border-light: #94b0c2;
      --pixel-font: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
      --cn-font: 'ZCOOL KuaiLe', 'Press Start 2P', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--cn-font);
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    body {
      background:
        linear-gradient(180deg, #1a1c2c 0%, #29366f 50%, #1a1c2c 100%);
      min-height: 100vh;
      padding: 20px 12px;
    }

    .pixel-border {
      border: 4px solid var(--border-light);
      box-shadow:
        inset -4px -4px 0 0 var(--border),
        inset 4px 4px 0 0 #fff,
        0 0 0 4px var(--bg);
      background: var(--bg2);
    }

    .pixel-btn {
      font-family: var(--cn-font);
      font-size: 16px;
      padding: 12px 20px;
      background: var(--blue);
      color: #fff;
      border: none;
      cursor: pointer;
      position: relative;
      box-shadow:
        inset -3px -3px 0 0 #2d7dd2,
        inset 3px 3px 0 0 #7ec8ff,
        0 4px 0 0 #1a4a8a;
      transition: all 0.1s;
      text-shadow: 2px 2px 0 #1a4a8a;
      letter-spacing: 1px;
    }

    .pixel-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        inset -3px -3px 0 0 #2d7dd2,
        inset 3px 3px 0 0 #7ec8ff,
        0 6px 0 0 #1a4a8a;
    }

    .pixel-btn:active {
      transform: translateY(2px);
      box-shadow:
        inset -3px -3px 0 0 #2d7dd2,
        inset 3px 3px 0 0 #7ec8ff,
        0 2px 0 0 #1a4a8a;
    }

    .pixel-btn.secondary {
      background: var(--border);
      box-shadow:
        inset -3px -3px 0 0 #3d4f6f,
        inset 3px 3px 0 0 #7a90b0,
        0 4px 0 0 #2a3a54;
      text-shadow: 2px 2px 0 #2a3a54;
    }

    .pixel-btn.secondary:hover {
      box-shadow:
        inset -3px -3px 0 0 #3d4f6f,
        inset 3px 3px 0 0 #7a90b0,
        0 6px 0 0 #2a3a54;
    }

    .pixel-btn.success {
      background: var(--green);
      box-shadow:
        inset -3px -3px 0 0 #2a8a4d,
        inset 3px 3px 0 0 #6dd89a,
        0 4px 0 0 #1a5a32;
      text-shadow: 2px 2px 0 #1a5a32;
    }

    .pixel-btn.danger {
      background: var(--red);
      box-shadow:
        inset -3px -3px 0 0 #8a2d42,
        inset 3px 3px 0 0 #ff8fa6,
        0 4px 0 0 #5a1d2a;
      text-shadow: 2px 2px 0 #5a1d2a;
    }

    .pixel-btn.warning {
      background: var(--accent);
      color: #5a3a00;
      box-shadow:
        inset -3px -3px 0 0 #d4a53a,
        inset 3px 3px 0 0 #ffe8a8,
        0 4px 0 0 #8a6a1a;
      text-shadow: 1px 1px 0 #ffe8a8;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .screen {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 首页 ===== */
    .title-screen {
      text-align: center;
      padding: 30px 20px 40px;
      position: relative;
      overflow: hidden;
    }

    .title-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255, 205, 117, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 20%, rgba(65, 166, 246, 0.1) 0%, transparent 30%),
        radial-gradient(ellipse at 80% 30%, rgba(115, 62, 255, 0.1) 0%, transparent 25%);
      pointer-events: none;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .game-title {
      font-family: var(--pixel-font);
      font-size: 32px;
      color: var(--accent);
      text-shadow:
        0 0 10px rgba(255, 205, 117, 0.5),
        4px 4px 0 var(--red),
        8px 8px 0 rgba(0,0,0,0.3);
      margin-bottom: 12px;
      letter-spacing: 3px;
      line-height: 1.4;
      position: relative;
      animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 10px rgba(255, 205, 117, 0.5), 4px 4px 0 var(--red), 8px 8px 0 rgba(0,0,0,0.3); }
      50% { text-shadow: 0 0 20px rgba(255, 205, 117, 0.8), 0 0 40px rgba(255, 205, 117, 0.4), 4px 4px 0 var(--red), 8px 8px 0 rgba(0,0,0,0.3); }
    }

    .game-subtitle {
      font-size: 18px;
      color: var(--fg-dark);
      margin-bottom: 30px;
      letter-spacing: 6px;
      position: relative;
    }

    .pixel-art {
      width: 280px;
      height: 240px;
      margin: 0 auto 25px;
      position: relative;
      image-rendering: pixelated;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .street-lamp {
      position: absolute;
      left: -10px;
      bottom: 0;
      width: 16px;
      height: 120px;
      z-index: 3;
    }

    .lamp-post {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 90px;
      background: #4a4a4a;
      box-shadow: inset -1px 0 0 #2a2a2a, inset 1px 0 0 #6a6a6a;
    }

    .lamp-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 14px;
      background: #ffd700;
      box-shadow:
        0 0 15px rgba(255, 215, 0, 0.6),
        0 0 30px rgba(255, 215, 0, 0.3),
        inset -2px -2px 0 #daa520,
        inset 2px 2px 0 #ffec8b;
      border-radius: 4px 4px 2px 2px;
    }

    .lamp-light {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 80px;
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.15) 0%, transparent 100%);
      clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
      pointer-events: none;
    }

    .shop-pixel {
      width: 200px;
      height: 180px;
      position: relative;
    }

    .shop-roof {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 50px;
    }

    .shop-roof-main {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: #8b2500;
      box-shadow:
        inset 0 -4px 0 #5a1800,
        inset 0 4px 0 #cd3700;
    }

    .shop-roof-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 30px;
      background: #a52a2a;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .shop-roof-tiles {
      position: absolute;
      bottom: 4px;
      left: 10px;
      right: 10px;
      height: 12px;
      background: repeating-linear-gradient(
        90deg,
        #cd3700 0px,
        #cd3700 8px,
        #8b2500 8px,
        #8b2500 16px
      );
    }

    .shop-body {
      position: absolute;
      top: 48px;
      left: 10px;
      right: 10px;
      bottom: 0;
      background:
        linear-gradient(180deg, #deb887 0%, #d2b48c 30%, #c4a574 100%);
      box-shadow:
        inset -6px 0 0 #a0826d,
        inset 6px 0 0 #f5deb3,
        inset 0 -6px 0 #8b7355;
    }

    .shop-sign {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #8b4513;
      border: 3px solid #5c3317;
      box-shadow:
        inset -2px -2px 0 #5c3317,
        inset 2px 2px 0 #a0522d,
        0 4px 0 rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shop-sign-text {
      font-family: var(--pixel-font);
      font-size: 12px;
      color: #ffd700;
      text-shadow: 2px 2px 0 #5c3317;
      letter-spacing: 2px;
    }

    .shop-windows {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 15px;
    }

    .shop-window {
      width: 40px;
      height: 36px;
      background: #ffe4b5;
      border: 3px solid #5c3317;
      box-shadow:
        0 0 12px rgba(255, 228, 181, 0.6),
        inset -2px -2px 0 #daa520,
        inset 2px 2px 0 #fff8dc;
      position: relative;
      overflow: hidden;
      animation: windowGlow 4s ease-in-out infinite;
    }

    @keyframes windowGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(255, 228, 181, 0.6), inset -2px -2px 0 #daa520, inset 2px 2px 0 #fff8dc; }
      50% { box-shadow: 0 0 20px rgba(255, 228, 181, 0.9), 0 0 30px rgba(255, 200, 100, 0.4), inset -2px -2px 0 #daa520, inset 2px 2px 0 #fff8dc; }
    }

    .shop-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      background: #5c3317;
      transform: translateX(-50%);
    }

    .shop-window::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: #5c3317;
      transform: translateY(-50%);
    }

    .shop-door {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 56px;
      background: #654321;
      border: 3px solid #3d2817;
      border-bottom: none;
      box-shadow:
        inset -3px 0 0 #3d2817,
        inset 3px 0 0 #8b5a2b;
    }

    .shop-door-handle {
      position: absolute;
      top: 50%;
      right: 6px;
      width: 6px;
      height: 6px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #b8860b;
    }

    .shop-awning {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 14px;
      background: repeating-linear-gradient(
        90deg,
        #dc143c 0px,
        #dc143c 14px,
        #fff 14px,
        #fff 28px
      );
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }

    .shop-plant {
      position: absolute;
      bottom: 0;
      left: -2px;
      width: 24px;
      height: 40px;
    }

    .shop-plant-pot {
      position: absolute;
      bottom: 0;
      left: 2px;
      width: 20px;
      height: 16px;
      background: #b22222;
      box-shadow:
        inset -2px -2px 0 #8b0000,
        inset 2px 0 0 #cd5c5c;
    }

    .shop-plant-leaves {
      position: absolute;
      bottom: 14px;
      left: 0;
      width: 24px;
      height: 26px;
      background: #228b22;
      border-radius: 50% 50% 40% 40%;
      box-shadow:
        inset -3px -3px 0 #006400,
        inset 3px 3px 0 #32cd32;
    }

    .shop-plant-right {
      left: auto;
      right: -2px;
    }

    .start-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 320px;
      margin: 0 auto;
    }

    .start-buttons .pixel-btn {
      width: 100%;
      font-size: 18px;
      padding: 16px;
    }

    .hint-text {
      margin-top: 30px;
      font-size: 14px;
      color: var(--fg-dark);
    }

    .home-simple {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .home-title-wrap {
      margin-bottom: 60px;
      text-align: center;
    }

    .home-title {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: 8px;
    }

    .home-tagline {
      font-size: 16px;
      color: var(--fg-dark);
      letter-spacing: 8px;
      opacity: 0.8;
    }

    .home-buttons {
      margin-bottom: 40px;
    }

    .home-buttons .pixel-btn {
      font-size: 20px;
      padding: 18px 48px;
    }

    .home-hint {
      margin-top: 0;
      font-size: 13px;
      opacity: 0.6;
    }

    .blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ===== 选择页面 ===== */
    .select-screen {
      padding: 20px;
    }

    .screen-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .screen-header h2 {
      font-family: var(--pixel-font);
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }

    .screen-header p {
      color: var(--fg-dark);
      font-size: 15px;
    }

    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .dot {
      width: 14px;
      height: 14px;
      background: var(--border);
      border: 2px solid var(--border-light);
    }

    .dot.active {
      background: var(--accent);
      border-color: #fff;
      box-shadow: 0 0 10px var(--accent);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .select-card {
      padding: 20px;
      background: var(--bg2);
      border: 4px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .select-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .select-card.selected {
      border-color: var(--accent);
      background: rgba(255, 205, 117, 0.15);
      box-shadow: 0 0 20px rgba(255, 205, 117, 0.3);
    }

    .select-card.selected::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 12px;
      color: var(--green);
      font-size: 24px;
      font-weight: bold;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 12px;
      text-align: center;
    }

    .card-title {
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 8px;
      text-align: center;
    }

    .card-tag {
      display: inline-block;
      font-size: 12px;
      color: var(--bg);
      background: var(--border-light);
      padding: 2px 8px;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--fg-dark);
      line-height: 1.6;
    }

    .card-stats {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px dashed var(--border);
      font-size: 13px;
    }

    .card-stats div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .card-stats span:first-child {
      color: var(--fg-dark);
    }

    .card-stats span:last-child {
      color: var(--fg);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ===== 游戏主界面 ===== */
    .game-screen {
      padding: 10px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: var(--bg2);
      border: 3px solid var(--border);
    }

    .day-display {
      font-family: var(--pixel-font);
      font-size: 14px;
      color: var(--accent);
    }

    .store-name {
      font-size: 16px;
      color: var(--fg);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-item {
      padding: 10px 8px;
      background: var(--bg2);
      border: 3px solid var(--border);
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--fg-dark);
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--pixel-font);
      font-size: 14px;
      color: var(--fg);
    }

    .stat-value.cash { color: var(--green); }
    .stat-value.traffic { color: var(--blue); }
    .stat-value.reputation { color: var(--accent); }
    .stat-value.stock { color: var(--purple); }
    .stat-value.stress { color: var(--red); }

    .stat-bar {
      height: 6px;
      background: var(--bg);
      margin-top: 6px;
      border: 1px solid var(--border);
    }

    .stat-bar-fill {
      height: 100%;
      transition: width 0.3s;
    }

    .stat-bar-fill.green { background: var(--green); }
    .stat-bar-fill.blue { background: var(--blue); }
    .stat-bar-fill.gold { background: var(--accent); }
    .stat-bar-fill.purple { background: var(--purple); }
    .stat-bar-fill.red { background: var(--red); }

    .event-panel {
      padding: 24px;
      background: var(--bg2);
      border: 3px solid var(--border);
      margin-bottom: 16px;
      min-height: 180px;
    }

    .event-title {
      font-family: var(--pixel-font);
      font-size: 16px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .event-desc {
      font-size: 16px;
      line-height: 1.8;
      color: var(--fg);
      margin-bottom: 20px;
    }

    .event-scene {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      background: var(--bg3);
      color: var(--fg);
      border: 3px solid var(--border-light);
      cursor: pointer;
      font-family: var(--cn-font);
      font-size: 15px;
      transition: all 0.15s;
      position: relative;
    }

    .choice-btn:hover {
      background: var(--blue);
      border-color: #fff;
      transform: translateX(8px);
    }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .choice-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--accent);
    }

    .choice-desc {
      font-size: 13px;
      color: var(--fg-dark);
      line-height: 1.5;
    }

    .feedback-panel {
      padding: 16px;
      background: rgba(66, 211, 156, 0.1);
      border: 3px solid var(--green);
      margin-bottom: 16px;
      display: none;
    }

    .feedback-panel.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-title {
      color: var(--green);
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--fg);
    }

    .delta-indicators {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .delta {
      font-size: 12px;
      padding: 2px 8px;
      font-family: var(--pixel-font);
    }

    .delta.up {
      color: var(--green);
      background: rgba(56, 183, 100, 0.2);
    }

    .delta.down {
      color: var(--red);
      background: rgba(177, 62, 83, 0.2);
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ===== 结局页 ===== */
    .ending-screen {
      padding: 20px;
    }

    .ending-card {
      padding: 30px;
      background: var(--bg2);
      border: 4px solid var(--border);
      text-align: center;
      margin-bottom: 20px;
    }

    .ending-badge {
      display: inline-block;
      padding: 6px 16px;

    }

    .score-value {

    .review-panel {
      padding: 20px;

      z-index: 999;
      animation: toastIn 0.3s ease-out;

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }

    /* 响应式 */
    @media (max-width: 640px) {

<body>
  <div class="container">
    <!-- 首页 -->

    <!-- 店型选择 -->

          <div class="dot"></div>

        <div class="screen-header">

          </div>
          <div class="stat-item">
            <div class="stat-label">压力</div>
            <div class="stat-value stress" id="stat-stress">0</div>
            <div class="stat-bar"><div class="stat-bar-fill red" id="bar-stress" style="width: 50%"></div></div>
          </div>

        <div class="event-panel">
          <div class="event-scene" id="event-scene">🏪</div>

    <!-- 结局页 -->

  </div>

  <script>
    // ============================================================
    //  店长模拟器 · 决策树系统 v2.0
    // ============================================================

    // ========== 1. 角色系统 ==========
    const roles = [
      {
        id: 'lin-xiaoyu',
        name: '辞职白领 · 林小雨',
        icon: '👔',
        tag: '资金充裕 · 懂运营 · 不会做餐饮',
        story: '大厂运营岗5年，厌倦了996和PPT。攒了一笔血汗钱，想用互联网思维改造传统早餐店。厨艺为零，但自信靠营销和数据也能赢。',
        initialCash: 150000,
        initialTraffic: 30,
        initialReputation: 45,
        initialStock: 40,
        initialStress: 50,
        buff: {
          marketingBonus: 0.30,
          qualityBonus: -0.20
        },
        debuff: {
          stressGrowth: 0.20
        },
        exclusiveEvent: 'online-viral'
      },
      {
        id: 'chen-daqiang',
        name: '返乡青年 · 陈大强',
        icon: '🧑‍🌾',
        tag: '能吃苦 · 熟人多 · 现金紧 · 不会线上',
        story: '在城里餐馆打了8年工，从洗菜做到主厨。攒了点钱回老家创业，街坊邻居都认识。就是对手机上那些花里胡哨的一窍不通。',
        initialCash: 80000,
        initialTraffic: 35,
        initialReputation: 55,
        initialStock: 50,
        initialStress: 35,
        buff: {
          qualityBonus: 0.20,
          canSelfWork: true
        },
        debuff: {
          marketingBonus: -0.40
        },
        exclusiveEvent: 'hometown-support'
      },
      {
        id: 'wang-couple',
        name: '夫妻档 · 王叔王婶',
        icon: '👫',
        tag: '人手足 · 服务好 · 观念保守 · 输不起',
        story: '夫妻俩都四十多了，工厂不景气双双下岗。拿出半辈子积蓄开个早餐店，就为了供孩子上大学。手脚麻利，待人热情，但对新东西接受慢。',
        initialCash: 100000,
        initialTraffic: 32,
        initialReputation: 50,
        initialStock: 45,
        initialStress: 40,
        buff: {
          serviceBonus: 0.25,
          stressGrowth: -0.30
        },
        debuff: {
          innovationBonus: -0.30
        },
        exclusiveEvent: 'regular-customer'
      }
    ];

    // ========== 2. 店型系统 ==========
    const allStores = [
      {
        id: 'breakfast',
        name: '早餐店',
        icon: '🥟',
        tag: '高频刚需 · 早高峰压力',
        desc: '包子、豆浆、油条、粥。早起是基本功，出餐速度就是生命线，客单价低但复购高。',
        baseTraffic: 40,
        basePrice: 12,
        baseCost: 500,
        baseConversion: 0.75,
        baseMarginRate: 0.55,
        dailyStockConsume: 15,
        stockLossRate: 0.05,
        unlocked: true
      },
      {
        id: 'fruit',
        name: '水果店',
        icon: '🍎',
        tag: '损耗高 · 库存敏感',
        desc: '新鲜水果卖的就是品质。损耗是最大的敌人，会做促销和组合才能把钱赚回来。',
        baseTraffic: 35,
        basePrice: 25,
        baseCost: 600,
        baseConversion: 0.65,
        baseMarginRate: 0.45,
        dailyStockConsume: 20,
        stockLossRate: 0.1,
        unlocked: false,
        unlockCondition: '完成一次早餐店挑战即可解锁'
      },
      {
        id: 'barber',
        name: '理发店',
        icon: '💈',
        tag: '口碑驱动 · 复购关键',
        desc: '手艺是根本，服务是加分。一条差评可能比十个好评还有影响力，会员制是命脉。',
        baseTraffic: 25,
        basePrice: 35,
        baseCost: 400,
        baseConversion: 0.85,
        baseMarginRate: 0.7,
        dailyStockConsume: 5,
        stockLossRate: 0.01,
        unlocked: false,
        unlockCondition: '完成一次早餐店挑战即可解锁'
      }
    ];

    const storeType = allStores[0];

    // ========== 3. 核心经营公式 ==========
    function calculateDailyProfit(state) {
      const role = roles.find(r => r.id === state.roleId);
      const store = allStores.find(s => s.id === state.storeId) || storeType;

      let effectiveTraffic = state.traffic;
      let effectiveConversion = store.baseConversion + (state.reputation - 50) * 0.003;
      effectiveConversion = clamp(effectiveConversion, 0.4, 0.95);

      let effectivePrice = store.basePrice * state.priceLevel;

      let dailyRevenue = effectiveTraffic * effectiveConversion * effectivePrice;

      let qualityMultiplier = 1 + (role.buff.qualityBonus || 0);
      let serviceMultiplier = 1 + (role.buff.serviceBonus || 0);
      let reputationBoost = (state.reputation - 50) * 0.005;
      dailyRevenue *= (qualityMultiplier * 0.5 + serviceMultiplier * 0.3 + 0.2 + reputationBoost);

      let fixedCost = store.baseCost;
      let variableCost = dailyRevenue * (1 - state.marginRate);
      let dailyCost = fixedCost + variableCost;

      let dailyProfit = dailyRevenue - dailyCost;

      let stockSold = Math.min(state.stock, store.dailyStockConsume * (effectiveTraffic / store.baseTraffic));
      let stockLoss = state.stock * store.stockLossRate;
      let stockChange = -stockSold - stockLoss;

      let baseStressChange = 2 + (effectiveTraffic > 60 ? 3 : 0) + (state.stock < 20 ? 2 : 0);
      let stressMultiplier = 1 + (role.debuff.stressGrowth || 0);
      let stressChange = baseStressChange * stressMultiplier;

      let reputationChange = (qualityMultiplier > 1 ? 0.5 : qualityMultiplier < 1 ? -0.5 : 0) +
                             (serviceMultiplier > 1 ? 0.5 : 0);

      return {
        revenue: Math.round(dailyRevenue),
        cost: Math.round(dailyCost),
        profit: Math.round(dailyProfit),
        stockChange: Math.round(stockChange),
        stressChange: Math.round(stressChange * 10) / 10,
        reputationChange: Math.round(reputationChange * 10) / 10,
        conversionRate: Math.round(effectiveConversion * 100) / 100,
        effectivePrice: Math.round(effectivePrice * 100) / 100
      };
    }

    // ========== 4. 决策树事件系统 ==========

    // Day 1 - 选址
    const day1Event = {
      day: 1,
      scene: '📍',
      title: 'Day 1 · 选址定生死',
      desc: '中介带你看了三个铺位。租金、人流、位置各有优劣。选址选对了，生意就成了一半。',
      choices: [
        {
          id: 'A1',
          title: 'A1 · 老小区底商',
          desc: '租金3万/年，都是街坊邻居，客单价偏低但人情味浓。',
          effects: {
            cash: -30,
            traffic: 25,
            reputation: 10,
            priceLevel: -0.15,
            locationType: 'community'
          },
          feedback: '小区阿姨们路过都会往里瞅两眼。虽然租金便宜，但你感觉这里的人会成为熟客。以后做的就是邻里生意。'
        },
        {
          id: 'A2',
          title: 'A2 · 中学旁边',
          desc: '租金5万/年，学生客流大，客单价低但走量快。',
          effects: {
            cash: -50,
            traffic: 40,
            reputation: 5,
            priceLevel: -0.25,
            marginRate: -0.05,
            locationType: 'school'
          },
          feedback: '上下学时间人潮涌动，都是背着书包的学生。你算了算，走量的话也能赚钱，就是得辛苦点。'
        },
        {
          id: 'A3',
          title: 'A3 · 新商圈负一楼',
          desc: '租金8万/年，客流不算多但增长潜力大，客单价高。',
          effects: {
            cash: -80,
            traffic: 15,
            reputation: 0,
            priceLevel: 0.20,
            locationType: 'mall'
          },
          feedback: '商圈看起来很高档，就是现在人气还没起来。你赌的是未来——等商圈成熟了，这里就是黄金地段。'
        }
      ]
    };

    // Day 2 - 定位
    function getDay2Event(state) {
      const locationDesc = {
        community: '既然选了老小区，就要想好走什么路线。是靠便宜拉人，还是靠品质留住？',

      return {
        day: 2,
        scene: '🎯',
        title: 'Day 2 · 店铺定位',
        desc: desc,
        choices: [
          {
            id: 'B1',
            title: 'B1 · 低价路线',
            desc: '客单价-20%，客流+15，毛利率-15%，靠走量取胜。',
            effects: {
              priceLevel: -0.20,
              traffic: 15,
              marginRate: -0.15,
              positioningType: 'low-price'

          },
          {
            id: 'B2',
            title: 'B2 · 品质路线',
            desc: '客单价+30%，客流-10，毛利率+20%，口碑+15，走精品路线。',
            effects: {
              priceLevel: 0.30,
              traffic: -10,
              marginRate: 0.20,
              reputation: 15,
              positioningType: 'quality'
            },
            feedback: '你决定做品质。用好原料、做好口味，哪怕贵一点也有人认。你相信——好东西，自己会说话。'

          {
            id: 'B3',
            title: 'B3 · 差异化特色',
            desc: '客单价+10%，客流+5，口碑+8，主打一个"不一样"。',

              priceLevel: 0.10,
              traffic: 5,

            },
            feedback: '你不想走极端，而是找一个差异化的点。既有自己的特色，又不至于太偏门。中间路线，稳中有进。'
          }
        ]
      };
    }

    // Day 3 - 菜单
    const day3Event = {
      day: 3,
      scene: '📋',
      title: 'Day 3 · 菜单怎么定',
      desc: '菜单上放多少东西？多了选择困难，少了不够吸引人。这直接影响备料成本和出餐效率。',
      choices: [
        {
          id: 'C1',
          title: 'C1 · 少而精（3款主打）',
          desc: '库存成本-20%，出餐效率+30%，口碑+5，客流-5。',
          effects: {
            traffic: -5,
            reputation: 5,

    // ========== 8. 游戏状态对象 ==========
    let gameState = {
      roleId: null,
      storeId: 'breakfast',
      day: 0,

      cash: 0,
      traffic: 0,
      reputation: 0,
      stock: 0,
      stress: 0,

      priceLevel: 1.0,
      marginRate: 0.55,

      locationType: null,
      positioningType: null,
      menuSize: null,

      marketingSpent: 0,

      dailyLog: [],
      choicesMade: [],

      currentEvent: null,
      initialCash: 0
    };

    // ========== 9. 工具函数 ==========
    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function showToast(message) {
      const oldToast = document.querySelector('.toast');
      if (oldToast) oldToast.remove();

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 2000);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    // ========== 10. 角色选择渲染 ==========
    function renderRoleCards() {
      const container = document.getElementById('role-cards');
      container.innerHTML = roles.map(role => `
        <div class="select-card ${gameState.roleId === role.id ? 'selected' : ''}"
             onclick="selectRole('${role.id}')">
          <div class="card-icon">${role.icon}</div>
          <div class="card-tag">${role.tag}</div>
          <div class="card-title">${role.name}</div>
          <div class="card-desc">${role.story}</div>
          <div class="card-stats">
            <div><span>启动资金</span><span>¥${(role.initialCash / 10000).toFixed(1)}万</span></div>
            <div><span>初始口碑</span><span>${role.initialReputation}</span></div>
            <div><span>初始压力</span><span>${role.initialStress}</span></div>
          </div>
        </div>
      `).join('');
    }

    function selectRole(roleId) {
      gameState.roleId = roleId;
      renderRoleCards();
    }

    function confirmRole() {
      if (!gameState.roleId) {
        showToast('先选一个身份吧！');
        return;
      }
      goToScreen('screen-store');
    }

    // ========== 11. 店型选择 ==========
    function renderStoreCards() {
      const container = document.getElementById('store-cards');
      container.innerHTML = allStores.map(store => {
        if (store.unlocked) {
          return `
            <div class="select-card store-card ${store.id === gameState.storeId ? 'selected' : ''}" data-store="${store.id}" style="cursor: pointer;" onclick="selectStore('${store.id}')">
              <div class="card-icon">${store.icon}</div>
              <div class="card-tag">${store.tag}</div>
              <div class="card-title">${store.name}</div>
              <div class="card-desc">${store.desc}</div>
              <div class="card-stats">
                <div><span>基础客流</span><span>${store.baseTraffic}</span></div>
                <div><span>基础客单价</span><span>¥${store.basePrice}</span></div>
                <div><span>基础日成本</span><span>¥${store.baseCost}</span></div>
                <div><span>基础转化率</span><span>${Math.round(store.baseConversion * 100)}%</span></div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="select-card store-card locked" style="cursor: not-allowed; opacity: 0.5; filter: grayscale(100%); position: relative;" onclick="showToast('${store.unlockCondition}')">
              <div class="lock-icon" style="position: absolute; top: 12px; right: 12px; font-size: 24px; z-index: 2;">🔒</div>
              <div class="card-icon" style="opacity: 0.6;">${store.icon}</div>
              <div class="card-tag" style="opacity: 0.6;">${store.tag}</div>
              <div class="card-title" style="opacity: 0.6;">${store.name}</div>
              <div class="card-desc" style="opacity: 0.6;">${store.desc}</div>
              <div class="card-stats" style="opacity: 0.6;">
                <div><span>基础客流</span><span>${store.baseTraffic}</span></div>
                <div><span>基础客单价</span><span>¥${store.basePrice}</span></div>
                <div><span>基础日成本</span><span>¥${store.baseCost}</span></div>
                <div><span>基础转化率</span><span>${Math.round(store.baseConversion * 100)}%</span></div>
              </div>
              <div class="unlock-hint" style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--accent); white-space: nowrap; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px;">
                🔒 ${store.unlockCondition}
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function selectStore(storeId) {
      const store = allStores.find(s => s.id === storeId);
      if (!store || !store.unlocked) return;
      gameState.storeId = storeId;
      renderStoreCards();
    }

    // ========== 12. 核心游戏函数 ==========

    function startGame() {
      if (!gameState.roleId) {
        showToast('请先选择身份！');
        return;
      }
      if (!gameState.storeId) {
        showToast('请先选择店型！');
        return;
      }

      const role = roles.find(r => r.id === gameState.roleId);
      const store = allStores.find(s => s.id === gameState.storeId);

      gameState = {
        roleId: role.id,
        storeId: store.id,
        day: 1,

        cash: role.initialCash / 1000,
        traffic: store.baseTraffic + role.initialTraffic - 30,
        reputation: role.initialReputation,
        stock: role.initialStock,
        stress: role.initialStress,

        priceLevel: 1.0,
        marginRate: store.baseMarginRate,

        locationType: null,
        positioningType: null,
        menuSize: null,

        marketingSpent: 0,

        dailyLog: [],
        choicesMade: [],

        currentEvent: null,
        initialCash: role.initialCash / 1000
      };

      gameState.traffic = clamp(gameState.traffic, 10, 100);
      gameState.reputation = clamp(gameState.reputation, 0, 100);
      gameState.stock = clamp(gameState.stock, 0, 100);
      gameState.stress = clamp(gameState.stress, 0, 100);

      document.getElementById('store-name').textContent = `我的${store.name}`;

      gameState.currentEvent = selectDayEvent(1, gameState);

      renderStats();
      renderEvent();
      goToScreen('screen-game');
    }

    function selectDayEvent(day, state) {
      switch (day) {
        case 1:
          return day1Event;
        case 2:
          return getDay2Event(state);
        case 3:
          return day3Event;
        case 4:
          return getDay4Event(state);
        case 5:
          return getDay5Event(state);
        case 6:
          return selectCrisisEvent(state);
        case 7:
          return selectFinalEvent(state);
        default:
          return null;
      }
    }

    function renderStats() {
      const s = gameState;
      document.getElementById('stat-cash').textContent = `${s.cash.toFixed(1)}k`;
      document.getElementById('stat-traffic').textContent = Math.round(s.traffic);
      document.getElementById('stat-reputation').textContent = Math.round(s.reputation);
      document.getElementById('stat-stock').textContent = Math.round(s.stock);
      document.getElementById('stat-stress').textContent = Math.round(s.stress);

      document.getElementById('bar-cash').style.width = `${clamp(s.cash / 2, 0, 100)}%`;
      document.getElementById('bar-traffic').style.width = `${clamp(s.traffic, 0, 100)}%`;
      document.getElementById('bar-reputation').style.width = `${clamp(s.reputation, 0, 100)}%`;
      document.getElementById('bar-stock').style.width = `${clamp(s.stock, 0, 100)}%`;
      document.getElementById('bar-stress').style.width = `${clamp(s.stress, 0, 100)}%`;
    }

    function renderEvent() {
      const event = gameState.currentEvent;
      if (!event) return;

      document.getElementById('day-display').textContent = `DAY ${event.day}`;
      document.getElementById('event-scene').textContent = event.scene;
      document.getElementById('event-title').textContent = event.title;
      document.getElementById('event-desc').textContent = event.desc;

      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = event.choices.map((choice, index) => `
        <button class="choice-btn" onclick="makeChoice(${index})">
          <div class="choice-title">${choice.title}</div>
          <div class="choice-desc">${choice.desc}</div>
        </button>
      `).join('');

      document.getElementById('feedback-panel').classList.remove('show');
      document.getElementById('next-day-btn').style.display = 'none';
    }

    function makeChoice(choiceIndex) {
      const event = gameState.currentEvent;
      const choice = event.choices[choiceIndex];
      const effects = choice.effects || {};

      const oldState = {
        cash: gameState.cash,
        traffic: gameState.traffic,
        reputation: gameState.reputation,
        stock: gameState.stock,
        stress: gameState.stress
      };

      if (effects.cash !== undefined) gameState.cash += effects.cash;
      if (effects.traffic !== undefined) gameState.traffic += effects.traffic;
      if (effects.reputation !== undefined) gameState.reputation += effects.reputation;
      if (effects.stock !== undefined) gameState.stock += effects.stock;
      if (effects.stress !== undefined) gameState.stress += effects.stress;
      if (effects.priceLevel !== undefined) gameState.priceLevel += effects.priceLevel;
      if (effects.marginRate !== undefined) gameState.marginRate += effects.marginRate;
      if (effects.locationType !== undefined) gameState.locationType = effects.locationType;
      if (effects.positioningType !== undefined) gameState.positioningType = effects.positioningType;
      if (effects.menuSize !== undefined) gameState.menuSize = effects.menuSize;
      if (effects.marketingSpent !== undefined) gameState.marketingSpent += effects.marketingSpent;

      gameState.cash = clamp(gameState.cash, 0, 200);
      gameState.traffic = clamp(gameState.traffic, 0, 150);
      gameState.reputation = clamp(gameState.reputation, 0, 100);
      gameState.stock = clamp(gameState.stock, 0, 100);
      gameState.stress = clamp(gameState.stress, 0, 100);
      gameState.priceLevel = clamp(gameState.priceLevel, 0.5, 2.0);
      gameState.marginRate = clamp(gameState.marginRate, 0.2, 0.8);

      let settlement = null;
      if (gameState.day >= 2) {
        settlement = calculateDailySettlement(gameState);
        gameState.dailyLog.push({
          day: gameState.day,
          settlement: settlement,
          choice: choice.title
        });
      }

      renderStats();

      const deltaHtml = [];
      const dc = gameState.cash - oldState.cash;
      const dt = gameState.traffic - oldState.traffic;
      const dr = gameState.reputation - oldState.reputation;
      const ds = gameState.stock - oldState.stock;
      const dstress = gameState.stress - oldState.stress;

      if (Math.abs(dc) > 0.01) deltaHtml.push(`<span class="delta ${dc > 0 ? 'up' : 'down'}">现金 ${dc > 0 ? '+' : ''}${dc.toFixed(1)}k</span>`);
      if (Math.abs(dt) > 0.01) deltaHtml.push(`<span class="delta ${dt > 0 ? 'up' : 'down'}">客流 ${dt > 0 ? '+' : ''}${Math.round(dt)}</span>`);
      if (Math.abs(dr) > 0.01) deltaHtml.push(`<span class="delta ${dr > 0 ? 'up' : 'down'}">口碑 ${dr > 0 ? '+' : ''}${Math.round(dr)}</span>`);
      if (Math.abs(ds) > 0.01) deltaHtml.push(`<span class="delta ${ds > 0 ? 'up' : 'down'}">库存 ${ds > 0 ? '+' : ''}${Math.round(ds)}</span>`);
      if (Math.abs(dstress) > 0.01) deltaHtml.push(`<span class="delta ${dstress > 0 ? 'down' : 'up'}">压力 ${dstress > 0 ? '+' : ''}${Math.round(dstress)}</span>`);

      let feedbackText = choice.feedback;
      if (settlement && gameState.day >= 2) {
        feedbackText += `\n\n📊 今日经营：收入¥${settlement.revenue}，成本¥${settlement.cost}，${settlement.profit >= 0 ? '利润' : '亏损'}¥${Math.abs(settlement.profit)}。`;
      }

      document.getElementById('feedback-text').textContent = feedbackText;
      document.getElementById('delta-indicators').innerHTML = deltaHtml.join('');
      document.getElementById('feedback-panel').classList.add('show');

      gameState.choicesMade.push({
        day: event.day,
        event: event.title,
        choiceId: choice.id,
        choiceTitle: choice.title,
        feedback: choice.feedback,
        effects: effects,
        settlement: settlement
      });

      document.querySelectorAll('.choice-btn').forEach(btn => btn.disabled = true);

      if (gameState.day < 7) {
        document.getElementById('next-day-btn').style.display = 'inline-block';
      } else {
        setTimeout(() => showEnding(), 2000);
      }
    }

    function calculateDailySettlement(state) {
      const result = calculateDailyProfit(state);

      state.cash += result.profit / 1000;
      state.stock += result.stockChange;
      state.stress += result.stressChange;
      state.reputation += result.reputationChange;

      state.cash = clamp(state.cash, 0, 200);
      state.stock = clamp(state.stock, 0, 100);
      state.stress = clamp(state.stress, 0, 100);
      state.reputation = clamp(state.reputation, 0, 100);

      return result;
    }

    function nextDay() {
      gameState.day++;
      gameState.currentEvent = selectDayEvent(gameState.day, gameState);
      renderEvent();
    }

    // ========== 13. 结局系统 ==========
    function showEnding() {
      const ending = determineEnding(gameState);

      document.getElementById('ending-emoji').textContent = ending.emoji;
      document.getElementById('ending-title').textContent = ending.title;
      document.getElementById('ending-desc').textContent = ending.description;
      document.getElementById('review-text').textContent = ending.review;

      const suggestionsHtml = ending.suggestions.map(s => `<li>${s}</li>`).join('');
      document.getElementById('suggestions-list').innerHTML = suggestionsHtml;

      const scores = [
        { label: '现金', value: Math.round(clamp(gameState.cash, 0, 100)), color: 'green' },
        { label: '客流', value: Math.round(clamp(gameState.traffic, 0, 100)), color: 'blue' },
        { label: '口碑', value: Math.round(clamp(gameState.reputation, 0, 100)), color: 'gold' },
        { label: '库存', value: Math.round(clamp(gameState.stock, 0, 100)), color: 'purple' },
        { label: '抗压', value: Math.round(clamp(100 - gameState.stress, 0, 100)), color: 'red' }
      ];

      document.getElementById('score-bars').innerHTML = scores.map(s => `
        <div class="score-row">
          <span class="score-label">${s.label}</span>
          <div class="stat-bar"><div class="stat-bar-fill ${s.color}" style="width: ${s.value}%"></div></div>
          <span class="score-value">${s.value}</span>
        </div>
      `).join('');

      renderTimeline();

      goToScreen('screen-ending');
    }

    function determineEnding(state) {
      for (const ending of endings) {
        if (ending.condition(state)) {
          return ending;
        }
      }
      return endings.find(e => e.id === 'break-even');
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-list');
      container.innerHTML = gameState.choicesMade.map((d, i) => `
        <div class="timeline-item">
          <div class="day">Day ${d.day}</div>
          <div class="decision">${d.choiceTitle}</div>
          <div class="result">${d.feedback}</div>
          ${d.settlement ? `<div class="result" style="margin-top:4px;color:var(--accent);">📊 当日：营收¥${d.settlement.revenue} / ${d.settlement.profit >= 0 ? '利润' : '亏损'}¥${Math.abs(d.settlement.profit)}</div>` : ''}
        </div>
      `).join('');
    }

    // ========== 14. 重新开始 ==========
    function restartGame() {
      gameState = {
        roleId: gameState.roleId,
        storeId: 'breakfast',
        day: 0,
        cash: 0,
        traffic: 0,
        reputation: 0,
        stock: 0,
        stress: 0,
        priceLevel: 1.0,
        marginRate: 0.55,
        locationType: null,
        positioningType: null,
        menuSize: null,
        marketingSpent: 0,
        dailyLog: [],
        choicesMade: [],
        currentEvent: null,
        initialCash: 0
      };
      goToScreen('screen-role');
    }

    // ========== 15. 初始化 ==========
    function initStars() {
      const starsContainer = document.getElementById('stars');
      if (!starsContainer) return;
      const starCount = 30;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        star.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
        star.style.width = (2 + Math.random() * 2) + 'px';
        star.style.height = star.style.width;
        starsContainer.appendChild(star);
      }
    }

    renderRoleCards();
    renderStoreCards();
    initStars();
  </script>
</body>
</html>
