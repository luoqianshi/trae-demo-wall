<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3秒决策器</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Zcool+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">🎲 3秒决策器</h1>
            <p class="subtitle">生活娱乐好帮手</p>
        </header>

        <main class="main-content">
            <section class="category-section">
                <h2 class="section-title">🎯 快速选择</h2>
                <div class="category-grid">
                    <button class="category-btn" data-category="milk-tea">🧋 奶茶</button>
                    <button class="category-btn" data-category="entertainment">🎮 饭后娱乐</button>
                    <button class="category-btn" data-category="food">🍔 吃什么</button>
                    <button class="category-btn" data-category="sports">⚽ 运动</button>
                </div>
            </section>

            <section class="input-section">
                <h2 class="section-title">📝 输入选项</h2>
                <div class="input-wrapper">
                    <input type="text" id="optionInput" placeholder="输入选项，如：奶茶" class="option-input">
                    <button id="addBtn" class="add-btn">➕ 添加</button>
                </div>
                <div id="optionsList" class="options-list">
                    <div class="empty-tip">点击上方按钮或手动输入选项</div>
                </div>
            </section>

            <section class="wheel-section">
                <div class="wheel-container">
                    <div class="wheel-pointer">⬆️</div>
                    <canvas id="wheelCanvas" class="wheel-canvas"></canvas>
                    <div class="center-circle"></div>
                    <div class="countdown" id="countdown">3</div>
                </div>
                <button id="spinBtn" class="spin-btn" disabled>🎡 开始决策</button>
            </section>

            <section class="result-section" id="resultSection">
                <div class="result-card">
                    <h3 class="result-title">🎉 决策结果</h3>
                    <p id="resultText" class="result-text">等待决策...</p>
                    <button id="resetBtn" class="reset-btn">🔄 再摇一次</button>
                </div>
            </section>

            <section class="history-section">
                <h2 class="section-title">📜 历史记录</h2>
                <div id="historyList" class="history-list"></div>
                <button id="clearHistoryBtn" class="clear-history-btn">🗑️ 清空记录</button>
            </section>
        </main>

        <footer class="footer">
            <p>💡 提示：摇一摇手机也可以触发决策哦~</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
