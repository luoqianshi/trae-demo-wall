<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日吃什么 · 家常菜灵感转盘</title>
    <style>
        /* ==================== 全局样式重置 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffb74d 0%, #ff8a65 50%, #ff7043 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 12px;
            color: #4a2c20;
        }

        /* ==================== 手机外壳框架 ==================== */
        .phone {
            width: 100%;
            max-width: 390px;
            background: #fff;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(180,80,30,0.25);
            overflow: hidden;
            min-height: 720px;
            display: flex;
            flex-direction: column;
        }

        /* ==================== 顶部标题栏 ==================== */
        .topbar {
            background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%);
            color: #fff;
            padding: 34px 20px 18px;
            text-align: center;
        }
        .topbar h1 { font-size: 1.35rem; font-weight: 700; }
        .topbar p { font-size: 0.78rem; opacity: 0.92; margin-top: 4px; }

        /* ==================== 底部标签栏 ==================== */
        .tabbar {
            display: flex;
            background: #fff;
            border-top: 1px solid #ffe0d2;
            padding: 8px 0 14px;
        }
        .tab {
            flex: 1; text-align: center;
            font-size: 0.72rem; color: #888;
            cursor: pointer; user-select: none;
        }
        .tab .tab-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
        .tab.active { color: #ff5722; font-weight: 700; }

        /* ==================== 内容区 ==================== */
        .screen {
            flex: 1; overflow-y: auto;
            padding: 0; background: #fffaf5;
        }

        /* ==================== 转盘页样式 ==================== */
        .wheel-wrap {
            padding: 24px 16px 10px;
            text-align: center;
        }
        .wheel-title {
            font-size: 0.9rem; color: #bf360c;
            margin-bottom: 14px; font-weight: 600;
        }
        /* 转盘容器：固定尺寸，相对定位，便于内部绝对定位指针 */
        .wheel-box {
            position: relative;
            width: 280px; height: 280px;
            margin: 0 auto 14px;
        }
        /* 转盘主体：SVG 绘制扇形，通过 rotate 实现旋转动画 */
        .wheel-svg {
            width: 100%; height: 100%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.21, 1.01);
            transform-origin: center center;
        }
        /* 中心圆：覆盖在转盘中心，展示 logo 与开始按钮 */
        .wheel-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #ff5722, #ff7043);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(255,87,34,0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff; font-size: 0.82rem; font-weight: 700;
            z-index: 5;
            transition: transform 0.2s;
        }
        .wheel-center:active { transform: translate(-50%,-50%) scale(0.92); }
        /* 顶部指针：固定不旋转，指向当前选中的扇形 */
        .wheel-pointer {
            position: absolute;
            top: -6px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #bf360c;
            z-index: 6;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        /* 转盘结果展示条 */
        .wheel-result {
            margin: 10px 16px 0;
            padding: 14px 16px;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 14px;
            text-align: center;
            display: none;
        }
        .wheel-result.show { display: block; animation: popIn 0.5s ease; }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .wr-emoji { font-size: 2rem; }
        .wr-name { font-size: 1.1rem; font-weight: 700; color: #bf360c; margin: 4px 0; }
        .wr-meta { font-size: 0.75rem; color: #8d6e63; }
        .wr-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 22px;
            background: #ff5722; color: #fff;
            border: none; border-radius: 18px;
            font-size: 0.82rem; font-weight: 600;
            cursor: pointer;
        }
        .wr-btn:active { transform: scale(0.95); }

        /* 偏好筛选条 */
        .pref-row {
            padding: 14px 16px 6px;
        }
        .pref-row .pref-label {
            font-size: 0.78rem; color: #8d6e63;
            margin-bottom: 8px; font-weight: 600;
        }
        .pref-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .pchip {
            padding: 6px 14px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #ffccbc;
            font-size: 0.75rem; color: #bf360c;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pchip.active {
            background: #ff5722; color: #fff; border-color: transparent;
        }

        /* ==================== 菜库列表样式 ==================== */
        .search-bar {
            padding: 12px 16px;
            background: #fff;
            display: flex; gap: 8px;
            border-bottom: 1px solid #ffe0d2;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ffccbc;
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus { border-color: #ff5722; }

        .filter-row {
            display: flex; gap: 8px;
            padding: 10px 16px;
            background: #fff;
            overflow-x: auto;
            border-bottom: 1px solid #ffe0d2;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .fchip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 16px;
            background: #fff8e1;
            border: 1px solid #ffe0b2;
            font-size: 0.75rem;
            color: #e65100;
            cursor: pointer;
        }
        .fchip.active {
            background: #ff9800; color: #fff; border-color: transparent;
        }

        .dish-list { padding: 12px 16px; }
        .dish-card {
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 3px 10px rgba(255,87,34,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex; gap: 12px; align-items: center;
        }
        .dish-card:active { transform: scale(0.98); }
        .dc-emoji {
            font-size: 2rem;
            width: 50px; height: 50px;
            background: #fff3e0;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .dc-info { flex: 1; }
        .dc-name { font-size: 0.95rem; font-weight: 700; color: #4a2c20; }
        .dc-meta { font-size: 0.72rem; color: #999; margin-top: 4px; }
        .dc-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .dc-tag {
            font-size: 0.65rem; padding: 2px 8px;
            background: #fff3e0; border-radius: 8px; color: #e65100;
        }
        .dc-cal {
            font-size: 0.7rem; color: #ff5722; font-weight: 700;
            white-space: nowrap;
        }

        /* ==================== 详情弹层样式 ==================== */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center; align-items: flex-end;
            z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 100%; max-width: 390px;
            background: #fff;
            border-radius: 24px 24px 0 0;
            max-height: 85vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            padding: 22px 20px;
            background: linear-gradient(135deg, #ff7043, #ff5722);
            color: #fff;
            position: sticky; top: 0;
        }
        .modal-header .close {
            position: absolute; top: 18px; right: 20px;
            font-size: 1.4rem; cursor: pointer; opacity: 0.85;
        }
        .modal-body { padding: 20px; }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #fff3e0;
            font-size: 0.85rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #999; }
        .detail-val { color: #4a2c20; font-weight: 600; text-align: right; }

        /* 食材清单 */
        .ingredient-list {
            margin-top: 14px;
        }
        .ingredient-list h3 {
            font-size: 0.9rem; color: #bf360c;
            margin-bottom: 10px;
            border-left: 4px solid #ff5722; padding-left: 10px;
        }
        .ing-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .ing-tag {
            font-size: 0.78rem; padding: 6px 12px;
            background: #fff3e0; color: #e65100;
            border-radius: 10px;
        }

        /* 做法步骤 */
        .steps-list { margin-top: 16px; }
        .steps-list h3 {
            font-size: 0.9rem; color: #bf360c;
            margin-bottom: 10px;
            border-left: 4px solid #ff5722; padding-left: 10px;
        }
        .step-item {
            display: flex; gap: 10px;
            margin-bottom: 10px;
            font-size: 0.82rem; color: #555; line-height: 1.6;
        }
        .step-num {
            flex-shrink: 0;
            width: 22px; height: 22px;
            background: #ff5722; color: #fff;
            border-radius: 50%;
            font-size: 0.72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }

        .cook-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #ff7043, #ff5722);
            color: #fff; border: none; border-radius: 14px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; margin-top: 18px;
        }
        .cook-btn:active { transform: scale(0.97); }

        /* ==================== 历史记录样式 ==================== */
        .history-tip {
            padding: 14px 16px;
            background: #fff8e1;
            font-size: 0.78rem; color: #8d6e63;
            border-bottom: 1px solid #ffe0b2;
        }
        .history-empty {
            text-align: center; padding: 60px 20px;
            color: #ccc; font-size: 0.85rem;
        }
        .history-empty .he-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }

        .history-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #fff3e0;
        }
        .hi-emoji { font-size: 1.6rem; }
        .hi-info { flex: 1; }
        .hi-name { font-size: 0.88rem; font-weight: 600; color: #4a2c20; }
        .hi-date { font-size: 0.72rem; color: #aaa; margin-top: 2px; }
        .hi-del {
            color: #ccc; cursor: pointer; font-size: 1.1rem;
            padding: 4px 8px;
        }
        .hi-del:active { color: #ff5722; }

        /* 营养均衡提示卡片 */
        .nutrition-card {
            margin: 14px 16px;
            padding: 14px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 14px;
        }
        .nc-title {
            font-size: 0.85rem; color: #2e7d32;
            font-weight: 700; margin-bottom: 8px;
        }
        .nc-bar {
            height: 8px; background: #fff;
            border-radius: 4px; overflow: hidden;
            margin-bottom: 6px;
        }
        .nc-fill {
            height: 100%;
            background: linear-gradient(90deg, #66bb6a, #43a047);
            border-radius: 4px;
            transition: width 0.5s;
        }
        .nc-text { font-size: 0.75rem; color: #2e7d32; }

        /* ==================== 我的页面样式 ==================== */
        .profile-section {
            padding: 20px 16px;
        }
        .profile-card {
            background: linear-gradient(135deg, #ff7043, #ff5722);
            border-radius: 18px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 16px;
        }
        .pc-avatar { font-size: 3rem; }
        .pc-name { font-size: 1.1rem; font-weight: 700; margin-top: 6px; }
        .pc-stat { font-size: 0.78rem; opacity: 0.9; margin-top: 4px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .stat-box {
            background: #fff;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(255,87,34,0.08);
        }
        .sb-num { font-size: 1.4rem; font-weight: 700; color: #ff5722; }
        .sb-label { font-size: 0.7rem; color: #999; margin-top: 4px; }

        .section-title {
            font-size: 0.9rem; color: #bf360c; font-weight: 700;
            margin: 14px 16px 8px;
            border-left: 4px solid #ff5722; padding-left: 10px;
        }
        .empty-tip { text-align: center; padding: 40px 20px; color: #ccc; font-size: 0.82rem; }
    </style>
</head>
<body>
    <div class="phone">
        <!-- 顶部标题栏 -->
        <div class="topbar">
            <h1>🍽️ 今日吃什么</h1>
            <p>转一转，告别选择困难</p>
        </div>

        <!-- 主内容区：根据当前 tab 动态渲染 -->
        <div class="screen" id="screen"></div>

        <!-- 底部标签栏：转盘/菜库/历史/我的 -->
        <div class="tabbar">
            <div class="tab active" data-tab="wheel" onclick="switchTab('wheel')">
                <span class="tab-icon">🎡</span>转盘
            </div>
            <div class="tab" data-tab="library" onclick="switchTab('library')">
                <span class="tab-icon">📚</span>菜库
            </div>
            <div class="tab" data-tab="history" onclick="switchTab('history')">
                <span class="tab-icon">📝</span>历史
            </div>
            <div class="tab" data-tab="profile" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>我的
            </div>
        </div>
    </div>

    <!-- 详情弹层：展示菜品完整信息 -->
    <div class="modal-mask" id="modalMask" onclick="closeModal(event)">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        /* ==================== 模块说明 ====================
         * 本脚本分为 5 个模块：
         * 1) DISHES：真实菜品数据库（28 道菜，7 大菜系，含食材/步骤/营养）
         * 2) FLAVOR/CUISINE 常量：口味与菜系枚举
         * 3) 状态变量：当前 tab、筛选条件、转盘状态、历史记录
         * 4) 渲染函数：renderWheel / renderLibrary / renderHistory / renderProfile
         * 5) 交互函数：转盘旋转 / 详情弹层 / 历史持久化 / 营养统计
         * 历史记录通过 localStorage 持久化，刷新后不丢失。
         */

        /* ==================== 1. 真实菜品数据库 ==================== */
        const DISHES = [
            { id:'d1', name:'番茄炒蛋', emoji:'🍳',
              flavor:'salty', cuisine:'home', time:15, cal:280,
              ingredients:['番茄 2 个','鸡蛋 3 个','葱花 适量','盐 适量','糖 少许'],
              steps:['鸡蛋打散加少许盐','番茄切块备用','热油下蛋液炒至凝固盛出','底油炒番茄出汁','回锅加糖盐翻匀'] },
            { id:'d2', name:'宫保鸡丁', emoji:'🌶️',
              flavor:'spicy', cuisine:'chuan', time:25, cal:420,
              ingredients:['鸡胸肉 300g','花生米 50g','干辣椒 适量','花椒 少许','葱姜蒜','酱油 醋 糖'],
              steps:['鸡胸肉切丁加料酒腌制','调汁：酱油醋糖淀粉','热油爆香干辣椒花椒','下鸡丁滑炒至变色','淋汁加花生翻匀'] },
            { id:'d3', name:'麻婆豆腐', emoji:'🥘',
              flavor:'spicy', cuisine:'chuan', time:20, cal:310,
              ingredients:['嫩豆腐 1 块','猪肉末 100g','豆瓣酱','花椒粉','葱花','淀粉'],
              steps:['豆腐切方块焯水','肉末煸至出油','加豆瓣酱炒红油','加豆腐焖煮 3 分钟','勾芡撒花椒粉葱花'] },
            { id:'d4', name:'红烧肉', emoji:'🍖',
              flavor:'salty', cuisine:'home', time:60, cal:580,
              ingredients:['五花肉 500g','冰糖 30g','生抽 老抽','料酒','葱姜 八角'],
              steps:['五花肉切块焯水','冰糖炒糖色','下肉块翻炒上色','加调料和热水','小火炖 40 分钟收汁'] },
            { id:'d5', name:'鱼香肉丝', emoji:'🥢',
              flavor:'salty', cuisine:'chuan', time:30, cal:380,
              ingredients:['猪里脊 250g','木耳 笋丝','胡萝卜丝','泡椒','酱油 醋 糖'],
              steps:['肉丝加淀粉抓匀','调鱼香汁：酱油醋糖','爆香泡椒出红油','下肉丝滑散','加蔬菜丝炒匀淋汁'] },
            { id:'d6', name:'酸辣土豆丝', emoji:'🥔',
              flavor:'sour', cuisine:'home', time:15, cal:220,
              ingredients:['土豆 2 个','干辣椒','花椒','醋','葱蒜'],
              steps:['土豆切丝泡水去淀粉','热油爆香花椒干辣椒','下土豆丝大火快炒','淋醋加盐翻匀出锅'] },
            { id:'d7', name:'青椒肉丝', emoji:'🫑',
              flavor:'salty', cuisine:'home', time:20, cal:300,
              ingredients:['猪里脊 200g','青椒 3 个','酱油','料酒','淀粉'],
              steps:['肉丝加料酒淀粉抓匀','青椒切丝','热油滑炒肉丝盛出','下青椒丝炒断生','回锅加酱油翻匀'] },
            { id:'d8', name:'回锅肉', emoji:'🧄',
              flavor:'spicy', cuisine:'chuan', time:35, cal:480,
              ingredients:['五花肉 400g','蒜苗 100g','豆瓣酱','甜面酱','青椒'],
              steps:['整块五花肉煮 20 分钟','晾凉切薄片','下锅煸至卷曲出油','加豆瓣酱炒红油','下蒜苗断生出锅'] },
            { id:'d9', name:'糖醋排骨', emoji:'🍖',
              flavor:'sweet', cuisine:'home', time:45, cal:520,
              ingredients:['排骨 500g','冰糖','醋','酱油','料酒','姜'],
              steps:['排骨焯水去血沫','冰糖炒糖色','下排骨翻炒上色','加热水炖 30 分钟','大火收汁淋醋'] },
            { id:'d10', name:'清蒸鲈鱼', emoji:'🐟',
              flavor:'light', cuisine:'yue', time:20, cal:260,
              ingredients:['鲈鱼 1 条','葱姜丝','蒸鱼豉油','料酒','热油'],
              steps:['鱼身划刀加料酒','铺葱姜上锅蒸 8 分钟','倒掉腥水','淋蒸鱼豉油','泼热油激发香气'] },
            { id:'d11', name:'蒜蓉西兰花', emoji:'🥦',
              flavor:'light', cuisine:'home', time:10, cal:150,
              ingredients:['西兰花 1 颗','蒜末','盐','蚝油'],
              steps:['西兰花掰小朵焯水','热油爆香蒜末','下西兰花翻炒','加蚝油盐炒匀出锅'] },
            { id:'d12', name:'凉拌黄瓜', emoji:'🥒',
              flavor:'light', cuisine:'home', time:5, cal:80,
              ingredients:['黄瓜 2 根','蒜末','醋','辣椒油','香油'],
              steps:['黄瓜拍碎切段','加盐腌制 5 分钟','倒掉多余水分','加蒜末醋辣椒油','淋香油拌匀'] },
            { id:'d13', name:'可乐鸡翅', emoji:'🍗',
              flavor:'sweet', cuisine:'home', time:40, cal:450,
              ingredients:['鸡翅 10 个','可乐 1 罐','姜','料酒','生抽','老抽'],

        /* ==================== 3. 状态变量 ==================== */

        let libraryVisibleCount = 8;    // 菜库列表每页显示数量

        /* ==================== 4.1 历史记录管理（localStorage 持久化） ==================== */
        const STORAGE_KEY = 'what_to_eat_history';

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }
        function saveHistory(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }
        function addHistory(dishId) {
            const list = loadHistory();
            const dish = DISHES.find(d => d.id === dishId);
            if (!dish) return;
            list.unshift({
                id: 'h_' + Date.now(),
                dishId: dishId,
                name: dish.name,
                emoji: dish.emoji,
                date: new Date().toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
            });
            saveHistory(list.slice(0, 50));
        }
        function removeHistory(hid) {
            const list = loadHistory().filter(h => h.id !== hid);
            saveHistory(list);
            render();
        }
        function clearHistory() {
            saveHistory([]);
            render();
        }

        function switchTab(tab) {

            });
            render();
        }

        /* ==================== 6. 主渲染入口 ==================== */

            const screen = document.getElementById('screen');

            else if (currentTab === 'history') renderHistory(screen);

        /* ==================== 7.1 渲染转盘页 ==================== */
        function renderWheel(screen) {
            let html = '<div class="wheel-wrap">';

            // 转盘容器
            html += '<div class="wheel-box" id="wheelBox">';
            html += '<div class="wheel-pointer"></div>';          // 顶部固定指针
            html += buildWheelSvg();                              // SVG 转盘主体
            html += `<div class="wheel-center" onclick="spinWheel()" ${pool.length===0?'style="opacity:0.5;cursor:not-allowed;"':''}>GO!</div>`; // 中心开始按钮
            html += '</div>';

            if (pool.length === 0) {
                html += '<div style="padding:20px;background:#fff3e0;border-radius:12px;margin-top:10px;color:#e65100;font-size:0.85rem;text-align:center;">';

        /* ==================== 7.2 构建 SVG 转盘 ==================== */
        function buildWheelSvg() {
            // 根据偏好筛选当前转盘候选菜品
            const pool = getWheelPool();
            const n = pool.length;
            if (n === 0) return '<svg class="wheel-svg" viewBox="0 0 200 200"></svg>';

            const cx = 100, cy = 100, r = 95;
            const angleStep = 360 / n;
            const colors = ['#ffb74d','#ff8a65','#ff7043','#ab47bc','#5c6bc0','#26a69a','#ffa726','#ec407a','#66bb6a','#42a5f5','#8d6e63','#ffee58'];
            let paths = '';
            let texts = '';

            // 绘制每个扇形与对应文字
            pool.forEach((d, i) => {
                const a0 = i * angleStep - 90;          // 起始角度（-90 使 0° 指向正上方）
                const a1 = (i + 1) * angleStep - 90;   // 结束角度
                const rad0 = a0 * Math.PI / 180;
                const rad1 = a1 * Math.PI / 180;
                const x0 = cx + r * Math.cos(rad0);
                const y0 = cy + r * Math.sin(rad0);
                const x1 = cx + r * Math.cos(rad1);
                const y1 = cy + r * Math.sin(rad1);
                const largeArc = angleStep > 180 ? 1 : 0;
                // 扇形路径：从圆心出发，画弧线，回到圆心
                paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${largeArc} 1 ${x1},${y1} Z" 
                    fill="${colors[i % colors.length]}" stroke="#fff" stroke-width="1.5"/>`;

                const fontSize = n <= 12 ? 10 : n <= 16 ? 9 : 8;
                const textRadius = n <= 12 ? 60 : n <= 16 ? 58 : 55;
                const aMid = (a0 + a1) / 2;
                const radMid = aMid * Math.PI / 180;
                const tx = cx + textRadius * Math.cos(radMid);
                const ty = cy + textRadius * Math.sin(radMid);
                const rotate = aMid + 90;
                texts += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"
                    font-size="${fontSize}" fill="#fff" font-weight="600"
                    transform="rotate(${rotate} ${tx} ${ty})">${d.emoji}</text>`;
            });

            return `<svg class="wheel-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                ${paths}${texts}
            </svg>`;
        }

        /* ==================== 7.3 根据偏好筛选转盘候选菜品 ==================== */
        function getWheelPool() {
            if (activePrefs.length === 0 || activePrefs.includes('all')) return DISHES;
            
            const flavorPrefs = activePrefs.filter(p => ['spicy','sweet','sour','salty','light'].includes(p));
            const cuisinePrefs = activePrefs.filter(p => ['home','chuan','yue','lu','xiang','dongbei','xibei'].includes(p));
            const hasQuick = activePrefs.includes('quick');
            
            return DISHES.filter(d => {
                const matchFlavor = flavorPrefs.length === 0 || flavorPrefs.includes(d.flavor);
                const matchCuisine = cuisinePrefs.length === 0 || cuisinePrefs.includes(d.cuisine);
                const matchQuick = !hasQuick || d.time <= 20;
                return matchFlavor && matchCuisine && matchQuick;
            });
        }

        /* ==================== 8.1 转盘旋转逻辑 ==================== */
        function setPref(k) {
            if (k === 'all') {
                activePrefs = [];
            } else {
                const idx = activePrefs.indexOf(k);
                if (idx >= 0) {
                    activePrefs.splice(idx, 1);
                } else {
                    activePrefs.push(k);
                }
            }
            wheelRotation = 0;
            lastResult = null;
            render();
        }

        function spinWheel() {
            if (wheelSpinning) return;
            const pool = getWheelPool();
            if (pool.length === 0) return;

            wheelSpinning = true;
            const svg = document.querySelector('.wheel-svg');
            if (!svg) { wheelSpinning = false; return; }

            // 随机选中一个菜品（真实随机，非模拟数据）
            const targetIdx = Math.floor(Math.random() * pool.length);
            const angleStep = 360 / pool.length;

            // 计算目标角度：指针在正上方，需让选中扇形旋转到 12 点钟方向
            // 选中扇形中心角度为 targetIdx * angleStep + angleStep/2（相对 0° 在正上方）
            // 旋转角度 = 360 * 多圈 - 选中扇形中心角度
            const spins = 5; // 至少转 5 圈，增加视觉效果
            const targetCenter = targetIdx * angleStep + angleStep / 2;
            const finalRotation = 360 * spins + (360 - targetCenter);

            // 累加到当前角度（保证多次旋转方向一致）
            wheelRotation += finalRotation;
            svg.style.transform = `rotate(${wheelRotation}deg)`;

            // 旋转结束后展示结果
            setTimeout(() => {
                wheelSpinning = false;
                lastResult = pool[targetIdx];
                render();
            }, 4200);
        }

        /* ==================== 9.2 菜品卡片 HTML ==================== */

        /* ==================== 9.3 菜库筛选逻辑 ==================== */
        function setFilter(k) { currentFilter = k; libraryVisibleCount = 8; render(); }
        function loadMoreDishes() { libraryVisibleCount += 8; render(); }
        function filterDishes() {
            const kw = (document.getElementById('searchInput')?.value || '').trim();
            return DISHES.filter(d => {
                if (kw && !d.name.includes(kw)) return false;
                // 按口味或菜系筛选
                if (['spicy','sweet','light','sour','salty'].includes(currentFilter)) {
                    if (d.flavor !== currentFilter) return false;
                }
                if (['home','chuan','yue','lu','xiang','dongbei','xibei'].includes(currentFilter)) {
                    if (d.cuisine !== currentFilter) return false;
                }
                return true;
            });
        }
        function doSearch() { libraryVisibleCount = 8; render(); }

        /* ==================== 10.1 详情弹层 ==================== */
        function openDetail(id) {
            const d = DISHES.find(x => x.id === id);
            if (!d) return;

            let html = `
                <div class="modal-header">
                    <span class="close" onclick="closeModal()">×</span>
                    <h2 style="font-size:1.2rem;">${d.emoji} ${d.name}</h2>
                    <div style="margin-top:6px;font-size:0.78rem;opacity:0.92;">
                        ${FLAVOR_MAP[d.flavor].name} · ${CUISINE_MAP[d.cuisine].name} · ${d.time} 分钟
                    </div>
                </div>
                <div class="modal-body">
                    <div class="detail-row"><span class="detail-label">⏱️ 烹饪时长</span><span class="detail-val">${d.time} 分钟</span></div>
                    <div class="detail-row"><span class="detail-label">🔥 热量</span><span class="detail-val">${d.cal} 大卡</span></div>
                    <div class="detail-row"><span class="detail-label">👅 口味</span><span class="detail-val">${FLAVOR_MAP[d.flavor].name}</span></div>
                    <div class="detail-row"><span class="detail-label">🍽️ 菜系</span><span class="detail-val">${CUISINE_MAP[d.cuisine].name}</span></div>

                    <div class="ingredient-list">
                        <h3>🥬 食材清单</h3>
                        <div class="ing-tags">
                            ${d.ingredients.map(i => `<span class="ing-tag">${i}</span>`).join('')}
                        </div>
                    </div>

                    <div class="steps-list">
                        <h3>👨‍🍳 做法步骤</h3>
                        ${d.steps.map((s, i) => `
                            <div class="step-item">
                                <div class="step-num">${i+1}</div>
                                <div>${s}</div>
                            </div>
                        `).join('')}
                    </div>

                    <button class="cook-btn" onclick="markCooked('${d.id}')">✅ 今天就吃这个</button>
                </div>`;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalMask').classList.add('show');
        }

        function closeModal(e) {
            if (e && e.target.id !== 'modalMask') return;
            document.getElementById('modalMask').classList.remove('show');
        }

        /* ==================== 10.2 标记已吃：写入历史记录 ==================== */
        function markCooked(dishId) {
            addHistory(dishId);
            closeModal();
            const d = DISHES.find(x => x.id === dishId);
            // 临时提示（用 modal 展示）
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header">
                    <span class="close" onclick="closeModal()">×</span>
                    <h2 style="font-size:1.05rem;">🎉 已记录到历史</h2>
                </div>
                <div class="modal-body" style="text-align:center;padding:36px 20px;">
                    <div style="font-size:3rem;">${d.emoji}</div>
                    <div style="font-size:1rem;font-weight:700;color:#bf360c;margin:10px 0;">${d.name}</div>
                    <div style="font-size:0.8rem;color:#999;">已加入「今日吃过」清单<br>营养统计将自动更新</div>
                    <button class="cook-btn" onclick="closeModal()">好的</button>
                </div>`;
        }

        /* ==================== 11. 渲染历史记录页 ==================== */
        function renderHistory(screen) {
            const list = loadHistory();
            let html = '<div class="history-tip">📝 记录每顿饭，看看你最近的饮食偏好</div>';

            // 营养均衡提示卡片
            html += buildNutritionCard(list);

            if (list.length === 0) {
                html += `<div class="history-empty">
                    <span class="he-emoji">🍽️</span>
                    还没有记录<br>去转盘抽一道菜，或从菜库选一个吧
                </div>`;
            } else {
                list.forEach(h => {
                    html += `<div class="history-item">
                        <span class="hi-emoji">${h.emoji}</span>
                        <div class="hi-info">
                            <div class="hi-name">${h.name}</div>
                            <div class="hi-date">${h.date}</div>
                        </div>
                        <span class="hi-del" onclick="removeHistory('${h.id}')">×</span>
                    </div>`;
                });
                html += `<div style="padding:16px;text-align:center;">
                    <button class="cook-btn" style="width:auto;padding:10px 28px;" onclick="clearHistory()">清空记录</button>
                </div>`;
            }
            screen.innerHTML = html;
        }

        /* ==================== 11.1 营养均衡统计卡片 ==================== */
        function buildNutritionCard(list) {
            if (list.length === 0) return '';
            // 统计最近 7 天各口味分布
            const recent = list.slice(0, 7);
            const flavorCount = {};
            recent.forEach(h => {
                const dish = DISHES.find(d => d.id === h.dishId);
                if (dish) flavorCount[dish.flavor] = (flavorCount[dish.flavor] || 0) + 1;
            });
            const total = recent.length;
            const lightCount = flavorCount.light || 0;
            const lightPct = Math.round(lightCount / total * 100);

            // 均衡度：清淡占比越高越健康（简化逻辑）
            const balance = Math.min(100, lightPct + 30);

            let advice = '饮食结构合理，继续保持～';
            if (lightPct < 20) advice = '最近清淡菜偏少，建议多吃蔬菜';
            if (lightPct >= 60) advice = '清淡饮食很棒，可适当加些蛋白质';

            return `<div class="nutrition-card">
                <div class="nc-title">🥗 近 ${total} 餐营养均衡度</div>
                <div class="nc-bar"><div class="nc-fill" style="width:${balance}%;"></div></div>
                <div class="nc-text">${balance} 分 · ${advice}</div>
            </div>`;
        }

        /* ==================== 12. 渲染我的页 ==================== */
        function renderProfile(screen) {
            const list = loadHistory();
            const totalDishes = list.length;
            const uniqueDishes = new Set(list.map(h => h.dishId)).size;
            const spicyCount = list.filter(h => {
                const d = DISHES.find(x => x.id === h.dishId);
                return d && d.flavor === 'spicy';
            }).length;

            // 最常吃的菜
            const countMap = {};
            list.forEach(h => { countMap[h.dishId] = (countMap[h.dishId] || 0) + 1; });
            let favDish = '暂无';
            let favEmoji = '🤔';
            let favCount = 0;
            Object.entries(countMap).forEach(([id, c]) => {
                if (c > favCount) {
                    favCount = c;
                    const d = DISHES.find(x => x.id === id);
                    if (d) { favDish = d.name; favEmoji = d.emoji; }
                }
            });

            let html = '<div class="profile-section">';
            html += `<div class="profile-card">
                <div class="pc-avatar">🍳</div>
                <div class="pc-name">美食探索家</div>
                <div class="pc-stat">已记录 ${totalDishes} 餐 · 尝试过 ${uniqueDishes} 道菜</div>
            </div>`;

            html += '<div class="stat-grid">';
            html += `<div class="stat-box"><div class="sb-num">${totalDishes}</div><div class="sb-label">总记录</div></div>`;
            html += `<div class="stat-box"><div class="sb-num">${uniqueDishes}</div><div class="sb-label">不同菜品</div></div>`;
            html += `<div class="stat-box"><div class="sb-num">${spicyCount}</div><div class="sb-label">无辣不欢</div></div>`;
            html += '</div>';

            html += `<div class="section-title">🏆 我的本命菜</div>`;
            html += `<div class="dish-card" style="margin:8px 0 0 0;" onclick="openDetailFav()">
                <div class="dc-emoji">${favEmoji}</div>
                <div class="dc-info">
                    <div class="dc-name">${favDish}</div>
                    <div class="dc-meta">吃过 ${favCount} 次 · 你最爱的味道</div>
                </div>
            </div>`;

            html += `<div class="section-title">💡 小贴士</div>`;
            html += `<div style="padding:14px;background:#fff8e1;border-radius:12px;margin:8px 0 0 0;font-size:0.8rem;color:#8d6e63;line-height:1.7;">
                · 转盘随机抽取，解决选择困难<br>
                · 标记「今天吃过」自动统计营养<br>
                · 历史记录保存在本地，保护隐私<br>
                · 多吃清淡菜，饮食更均衡
            </div>`;
            html += '</div>';
            screen.innerHTML = html;
        }

        /* ==================== 12.1 跳转到本命菜详情 ==================== */
        function openDetailFav() {
            const list = loadHistory();
            if (list.length === 0) return;
            const countMap = {};
            list.forEach(h => { countMap[h.dishId] = (countMap[h.dishId] || 0) + 1; });
            let favId = null, favCount = 0;
            Object.entries(countMap).forEach(([id, c]) => {
                if (c > favCount) { favCount = c; favId = id; }
            });
            if (favId) openDetail(favId);
        }

        /* ==================== 13. 初始化 ==================== */
        render();
    </script>
</body>
</html>
