<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReflectRead — PC 端 UI 原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e7e5e4;
      color: #1c1917;
      padding: 1.5rem;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      text-align: center;
      font-family: 'Lora', serif;
    }
    .nav-wrap {
      max-width: 1280px;
      margin: 0 auto 1rem;
      background: #fff;
      border: 1px solid #d6d3d1;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .nav-title {
      font-size: 0.72rem;
      color: #78716c;
      text-align: center;
      margin-bottom: 0.6rem;
      letter-spacing: 0.05em;
    }
    .nav-flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nav-group {
      display: flex;
      align-items: stretch;
      position: relative;
    }
    .nav-group::after {
      content: "";
      width: 1px;
      background: #e7e5e4;
      margin: 4px 6px;
    }
    .nav-group:last-child::after { display: none; }
    .nav-stage-label {
      display: flex;
      align-items: center;
      padding: 0 8px 0 4px;
      font-size: 0.65rem;
      color: #b45309;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .nav-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin-right: 14px;
    }
    .nav-step:last-child { margin-right: 0; }
    .nav-step .arr {
      position: absolute;
      right: -12px;
      top: 40%;
      transform: translateY(-50%);
      color: #d6d3d1;
      font-size: 10px;
      pointer-events: none;
    }
    .nav-step:last-child .arr { display: none; }
    .nav-step button {
      padding: 0.3rem 0.7rem;
      border: 1px solid #d6d3d1;
      background: #fafaf9;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.75rem;
      color: #57534e;
      white-space: nowrap;
      transition: all .15s;
    }
    .nav-step button:hover {
      border-color: #b45309;
      color: #b45309;
    }
    .nav-step button.active {
      background: #b45309;
      color: #fff;
      border-color: #b45309;
    }
    .nav-step .step-desc {
      font-size: 0.6rem;
      color: #a8a29e;
      margin-top: 3px;
      white-space: nowrap;
    }
    .frame-wrap {
      max-width: 1280px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #d6d3d1;
    }
    .browser-header {
      background: #f0efee;
      padding: 0.4rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid #d6d3d1;
    }
    .browser-dot { width: 10px; height: 10px; border-radius: 50%; }
    .browser-dot.r { background: #ef4444; }
    .browser-dot.y { background: #eab308; }
    .browser-dot.g { background: #22c55e; }
    .browser-url {
      flex: 1;
      background: #fff;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      color: #78716c;
      border: 1px solid #d6d3d1;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 720px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<h1>ReflectRead — PC 端 UI 原型</h1>

<div class="nav-wrap">
  <div class="nav-title">用户旅程：导入书籍 → 沉浸阅读 → 知识沉淀 → 成品输出</div>
  <div class="nav-flow">

    <!-- 阶段 1: 导入 -->
    <div class="nav-group">
      <span class="nav-stage-label">导入</span>
      <div class="nav-step">
        <button class="active" data-scene="shelf.html">书架</button>
        <span class="step-desc">上传 / 管理书籍</span>
      </div>
    </div>

    <!-- 阶段 2: 阅读 -->
    <div class="nav-group">
      <span class="nav-stage-label">阅读</span>
      <div class="nav-step">
        <button data-scene="reader.html">阅读</button>
        <span class="step-desc">沉浸式阅读</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="select.html">选中</button>
        <span class="step-desc">触发操作栏</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="translate.html">翻译</button>
        <span class="step-desc">上下文感知</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="chat.html">对话</button>
        <span class="step-desc">与 AI 探讨</span>
      </div>
    </div>

    <!-- 阶段 3: 知识管理 -->
    <div class="nav-group">
      <span class="nav-stage-label">沉淀</span>
      <div class="nav-step">
        <button data-scene="kb-overview.html">总览</button>
        <span class="step-desc">知识库全景</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="kb-book.html">按书</button>
        <span class="step-desc">语义目录</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="kb-tags.html">标签</button>
        <span class="step-desc">索引引擎</span>
        <span class="arr">→</span>
      </div>
      <div class="nav-step">
        <button data-scene="kb-collection.html">集合</button>
        <span class="step-desc">主题聚合</span>
      </div>
    </div>

    <!-- 阶段 4: 输出 -->
    <div class="nav-group">
      <span class="nav-stage-label">输出</span>
      <div class="nav-step">
        <button data-scene="kb-output.html">文章</button>
        <span class="step-desc">AI 策展成品</span>
      </div>
    </div>

  </div>
</div>

<div class="frame-wrap">
  <div class="browser-header">
    <div class="browser-dot r"></div>
    <div class="browser-dot y"></div>
    <div class="browser-dot g"></div>
    <div class="browser-url" id="url-bar">reflectread.app/shelf</div>
  </div>
  <iframe id="scene-frame" src="shelf.html"></iframe>
</div>

<script>
  const scenes = {
    'shelf.html': 'reflectread.app/shelf',
    'reader.html': 'reflectread.app/reader',
    'select.html': 'reflectread.app/reader',
    'translate.html': 'reflectread.app/reader',
    'chat.html': 'reflectread.app/reader',
    'kb-overview.html': 'reflectread.app/knowledge',
    'kb-book.html': 'reflectread.app/knowledge/book/gatsby',
    'kb-tags.html': 'reflectread.app/knowledge/tags',
    'kb-collection.html': 'reflectread.app/knowledge/collections',
    'kb-output.html': 'reflectread.app/knowledge/output',
  };
  document.querySelectorAll('.nav-step button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-step button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const scene = btn.dataset.scene;
      document.getElementById('scene-frame').src = scene;
      document.getElementById('url-bar').textContent = scenes[scene] || 'reflectread.app';
    });
  });
</script>

</body>
</html>
