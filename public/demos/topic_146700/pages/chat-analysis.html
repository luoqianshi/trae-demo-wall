<!DOCTYPE html>
<html lang="zh-CN" class="mini-program">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家教助手 - 对话分析</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html.mini-program body {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 130px;
      overflow-x: hidden;
    }
    html.mini-program ::-webkit-scrollbar { display: none; }
    html.mini-program body { -ms-overflow-style: none; scrollbar-width: none; }

    /* Nav bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #2563EB;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      box-sizing: border-box;
    }
    .nav-bar .nav-title {
      font-size: var(--font-size-lg);
      font-weight: var(--weight-semibold);
      color: #FFFFFF;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Contact cards */
    .contact-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 4px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .contact-card {
      flex-shrink: 0;
      width: 120px;
      padding: 12px 10px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-default);
      position: relative;
      background: var(--bg-card);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .contact-card.selected {
      border-color: var(--color-primary);
      background: var(--color-primary-lighter);
    }
    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px auto;
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      color: #FFFFFF;
      background: var(--color-neutral-400);
    }
    .contact-card.selected .contact-avatar {
      background: var(--color-primary);
    }

    /* Upload area */
    .upload-zone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
      position: relative;
    }
    .upload-zone.dragover {
      border-color: var(--color-primary);
      background: var(--color-primary-lighter);
    }
    .upload-file-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* File info bar */
    .file-info-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--color-primary-lighter);
      border-radius: var(--radius-md);
      margin-top: 10px;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
    }
    .file-info-bar.visible { display: flex; }

    /* New contact form */
    .new-contact-form {
      display: none;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      margin: 0 16px;
    }
    .new-contact-form.visible { display: block; }
    .new-contact-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      outline: none;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .new-contact-form input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-primary-light);
    }

    /* Result cards */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .card-title {
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      flex: 1;
    }
    .card-badge {
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--bg-sunken);
      color: var(--text-secondary);
    }

    /* Subject pills */
    .subject-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
    }

    /* Lesson item */
    .lesson-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-default);
    }
    .lesson-item:last-child { border-bottom: none; padding-bottom: 0; }

    /* Leave item */
    .leave-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-default);
    }
    .leave-item:last-child { border-bottom: none; padding-bottom: 0; }

    /* Salary section */
    .salary-subject-section {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-default);
    }
    .salary-subject-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .salary-entry {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
    }
    .salary-timeline-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-neutral-400);
      flex-shrink: 0;
      margin-top: 6px;
    }

    /* Badges */
    .badge-recurring {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--color-primary-light);
      color: var(--color-primary);
    }
    .badge-recorded {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--state-success-light);
      color: var(--state-success);
    }
    .badge-current {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--state-info-light);
      color: var(--state-info);
    }
    .badge-pending {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--state-warning-light);
      color: var(--state-warning);
    }
    .badge-history {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--bg-sunken);
      color: var(--text-tertiary);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-tertiary);
    }
    .empty-state svg { margin-bottom: 12px; }

    /* Bottom action bar */
    .bottom-action-bar {
      position: fixed;
      bottom: 56px;
      left: 0;
      right: 0;
      width: 375px;
      margin: 0 auto;
      background: var(--bg-card);
      border-top: 1px solid var(--border-default);
      padding: 10px 16px;
      gap: 10px;
      z-index: 45;
      align-items: center;
      justify-content: center;
    }
    .bottom-action-bar.hidden { display: none; }
    .bottom-action-bar.visible { display: flex; }

    /* Analyzing overlay */
    .analyzing-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 375px;
      margin: 0 auto;
      background: rgba(0,0,0,0.45);
      z-index: 60;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #FFFFFF;
      font-size: var(--font-size-base);
      font-weight: var(--weight-medium);
    }
    .analyzing-overlay.visible { display: flex; }

    /* Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 375px;
      margin: 0 auto;
      background: var(--bg-card);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 56px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 0px);
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 12px;
      transition: color var(--transition-fast);
    }
    .tab-indicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-item.active .tab-indicator {
      background: var(--color-primary);
    }
    .tab-item:not(.active) .tab-indicator {
      border: 2px solid var(--text-tertiary);
    }

    /* Button styles */
    .btn-primary {
      padding: 10px 20px;
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      font-family: var(--font-family);
      transition: background var(--transition-fast);
    }
    .btn-primary:active { background: var(--color-primary-hover); }
    .btn-outline {
      padding: 10px 20px;
      background: #FFFFFF;
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      font-family: var(--font-family);
      transition: background var(--transition-fast);
    }
    .btn-outline:active { background: var(--bg-sunken); }
    .btn-text-blue {
      background: none;
      border: none;
      color: var(--color-primary);
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      font-family: var(--font-family);
      padding: 0;
    }
  </style>
</head>
<body>

  <!-- Nav Bar -->
  <div class="nav-bar">
    <button data-dom-id="back-home" style="background:none; border:none; cursor:pointer; padding:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <span class="nav-title">对话分析</span>
    <button style="background:none; border:none; cursor:pointer; padding:4px; color:#FFFFFF; font-size:var(--font-size-sm); font-weight:var(--weight-medium); font-family:var(--font-family);">帮助</button>
  </div>

  <!-- Contact Selector Section -->
  <div style="padding:16px 0 0 0;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0 16px; margin-bottom:10px;">
      <span style="font-size:var(--font-size-sm); font-weight:var(--weight-medium); color:var(--text-secondary);">选择联系人</span>
      <button id="btnAddContact" class="btn-text-blue" style="font-size:var(--font-size-sm);">+ 新建联系人</button>
    </div>

    <!-- Contact Cards Scroll -->
    <div class="contact-scroll" id="contactScroll">
      <!-- Rendered by JS -->
    </div>

    <!-- New Contact Form -->
    <div class="new-contact-form" id="newContactForm" style="margin-top:10px;">
      <input type="text" id="inputParentName" placeholder="家长称呼（如：王妈妈）" maxlength="20">
      <input type="text" id="inputStudentName" placeholder="学生姓名（如：小明）" maxlength="20">
      <div id="subjectChips" style="display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;"></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="btnConfirmAdd" class="btn-primary" style="flex:1;">确认添加</button>
        <button id="btnCancelAdd" class="btn-outline" style="flex:1;">取消</button>
      </div>
      <div id="editActions" style="display:none; margin-top:6px;">
        <button id="btnDeleteContact" style="width:100%; padding:6px; border:1px solid var(--state-error); background:none; color:var(--state-error); border-radius:8px; font-size:var(--font-size-xs); cursor:pointer;">删除此联系人</button>
      </div>
    </div>
  </div>

  <!-- Upload Area -->
  <div style="padding:16px;">
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" class="upload-file-input" accept=".txt,.csv,.text">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <label for="fileInput" class="btn-primary" style="display:inline-block; cursor:pointer; margin-bottom:8px;">
        选择文件上传
      </label>
      <div style="font-size:var(--font-size-xs); color:var(--text-tertiary);">支持 .txt / .csv 格式</div>
    </div>

    <!-- Sample button -->
    <div style="text-align:center; margin-top:12px;">
      <button id="btnSample" class="btn-text-blue" style="font-size:var(--font-size-sm);">使用示例聊天记录体验解析功能</button>
    </div>

    <!-- File info bar -->
    <div class="file-info-bar" id="fileInfoBar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span id="fileInfoText" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    </div>
  </div>

  <!-- Analysis Results Area -->
  <div id="resultsArea" style="padding:0 16px;">
    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <div style="font-size:var(--font-size-sm); color:var(--text-tertiary);">上传聊天记录或使用示例数据</div>
      <div style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-top:4px;">系统将自动提取课时、休假和薪资信息</div>
    </div>

    <!-- Rendered cards go here -->
    <div id="resultsCards"></div>
  </div>

  <!-- Analyzing Overlay -->
  <div class="analyzing-overlay" id="analyzingOverlay">
    <div class="spinner"></div>
    <span>正在分析...</span>
  </div>

  <!-- Bottom Action Bar -->
  <div class="bottom-action-bar hidden" id="bottomActionBar">
    <button id="btnReanalyze" class="btn-outline" style="flex:1;">重新分析</button>
    <button id="btnSave" class="btn-primary" style="flex:1;">保存所有记录</button>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item" data-dom-id="tab-home">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">首页</span>
    </div>
    <div class="tab-item active" data-dom-id="tab-analysis">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--color-primary); font-weight:var(--weight-medium);">分析</span>
    </div>
    <div class="tab-item" data-dom-id="tab-lessons">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">课时</span>
    </div>
    <div class="tab-item" data-dom-id="tab-profile">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">我的</span>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ==================== Constants ====================
  var STORAGE_CONTACTS = 'tutor_contacts';
  var STORAGE_SELECTED = 'tutor_selected_contact';
  var SUBJECTS = ['数学', '英语', '物理', '化学', '语文', '生物', '历史', '地理', '政治'];
  var SUBJECT_COLORS = {
    '数学': { bg: '#DBEAFE', color: '#2563EB' },
    '英语': { bg: '#D1FAE5', color: '#059669' },
    '物理': { bg: '#FEF3C7', color: '#D97706' },
    '化学': { bg: '#EDE9FE', color: '#7C3AED' },
    '语文': { bg: '#FCE7F3', color: '#DB2777' },
    '生物': { bg: '#CCFBF1', color: '#0D9488' },
    '历史': { bg: '#FEE2E2', color: '#DC2626' },
    '地理': { bg: '#E0E7FF', color: '#4F46E5' },
    '政治': { bg: '#FEF9C3', color: '#CA8A04' }
  };
  var DEFAULT_SUBJECT_COLOR = { bg: '#F3F4F6', color: '#6B7280' };

  var DEFAULT_CONTACTS = [
    { id: 1, name: '王妈妈', student: '小明', avatar: '王', subjects: '数学 英语 物理' },
    { id: 2, name: '李爸爸', student: '小红', avatar: '李', subjects: '英语 数学' },

      if (recurringMatch2) {

      if (rangeLeaveMatch) {

      // Pattern 6: Compound with date before: "M月D日起[subjectA]和[subjectB]课酬调整为N元/小时"
      var compoundAdjDateMatch = salLine.match(/(\d{1,2})月(\d{1,2})[日号]起([\u4e00-\u9fa5]+)和([\u4e00-\u9fa5]+)课酬调整为(\d+)元\/小时/);
      if (compoundAdjDateMatch) {
        var cMonth = compoundAdjDateMatch[1];
        var cDay = compoundAdjDateMatch[2];
        var subC1 = compoundAdjDateMatch[3];
        var subC2 = compoundAdjDateMatch[4];
        var rateC = parseInt(compoundAdjDateMatch[5], 10);
        var effDateC = cMonth + '月' + cDay + '日';
        addSalaryEntry(salaryMap, subC1, rateC, 'pending', effDateC);
        addSalaryEntry(salaryMap, subC2, rateC, 'pending', effDateC);
        continue;
      }
    }

    // Convert salaryMap to array grouped by subject
    var salaryGroups = [];
    var subjectNames = Object.keys(salaryMap);
    for (var si = 0; si < subjectNames.length; si++) {
      var sName = subjectNames[si];
      var entries = salaryMap[sName];
      // Deduplicate: same rate + same type
      var deduped = [];
      for (var ei = 0; ei < entries.length; ei++) {
        var exists = false;
        for (var di = 0; di < deduped.length; di++) {
          if (deduped[di].rate === entries[ei].rate && deduped[di].type === entries[ei].type) {
            exists = true;
            break;
          }
        }
        if (!exists) {
          deduped.push(entries[ei]);
        }
      }
      // Sort: pending first, then current, then history
      deduped.sort(function(a, b) {
        var order = { pending: 0, current: 1, history: 2 };
        return (order[a.type] || 9) - (order[b.type] || 9);
      });
      salaryGroups.push({
        subject: sName,
        entries: deduped
      });
    }

    return {
      lessons: lessons,
      leaves: leaves,
      salaries: salaryGroups
    };
  }

  function addSalaryEntry(map, subject, rate, type, date) {
    if (!SUBJECT_COLORS[subject]) return; // skip non-recognized subjects
    if (!map[subject]) {
      map[subject] = [];
    }
    map[subject].push({ rate: rate, type: type, date: date });
  }

  function extractEffectiveDate(line) {
    var m = line.match(/(\d{1,2})月(\d{1,2})[日号]起/);
    if (m) return m[1] + '月' + m[2] + '日';
    var m2 = line.match(/(\d{4})年(\d{1,2})月(\d{1,2})[日号]起/);
    if (m2) return m2[1] + '年' + m2[2] + '月' + m2[3] + '日';
    return null;
  }

  function extractEffectiveDateFromContext(lines, idx) {
    // Look at previous 2 lines for date context
    for (var j = idx - 1; j >= Math.max(0, idx - 2); j--) {
      var d = extractEffectiveDate(lines[j]);
      if (d) return d;
    }
    return null;
  }

  function extractSubjectsWithSalary(line) {
    var subs = [];
    var matches = line.match(/([\u4e00-\u9fa5]+)和([\u4e00-\u9fa5]+)课酬/);
    if (matches) {
      if (SUBJECT_COLORS[matches[1]]) subs.push(matches[1]);
      if (SUBJECT_COLORS[matches[2]]) subs.push(matches[2]);
    }
    return subs;
  }

  function extractSalaryRate(line, subject) {
    var m = line.match(subject + '课酬(\\d+)\u5143/');
    if (m) return parseInt(m[1], 10);
    var m2 = line.match(subject + '是(\\d+)\u4e00/');
    if (m2) return parseInt(m2[1], 10);
    return null;
  }

  // ==================== Process & Render ====================
  function processText(text) {
    if (!text || text.trim() === '') return;

    // Validate selected contact matches chat content
    if (selectedContactId) {
      var contactObj = null;
      for (var ci = 0; ci < contacts.length; ci++) {
        if (contacts[ci].id === selectedContactId) { contactObj = contacts[ci]; break; }
      }
      if (contactObj) {
        var parentInChat = text.indexOf(contactObj.name) >= 0;
        var studentInChat = text.indexOf(contactObj.student) >= 0;
        if (!parentInChat && !studentInChat) {
          var proceed = confirm('聊天记录中未找到"' + contactObj.name + '"或"' + contactObj.student + '"，可能是其他联系人的记录。\n\n是否仍要继续分析？');
          if (!proceed) return;
        }
      }
    } else {
      var doSelect = confirm('请先选择一个联系人再分析，这样可以关联记录到对应家长和学生。\n\n点击"确定"跳过选择直接分析，点击"取消"返回选择。');
      if (!doSelect) return;
    }

    analyzingOverlay.classList.add('visible');

    setTimeout(function() {
      analysisResults = parseChat(text);
      renderResults(analysisResults);
      analyzingOverlay.classList.remove('visible');
      emptyState.style.display = 'none';
      bottomActionBar.classList.remove('hidden');
      bottomActionBar.classList.add('visible');
    }, 800);
  }

  function renderResults(results) {
    var html = '';

    // Card A: Lessons
    html += '<div class="result-card">';
    html += '<div class="card-header">';
    html += '<span class="card-dot" style="background:var(--color-primary);"></span>';
    html += '<span class="card-title">课时安排</span>';
    html += '<span class="card-badge">' + results.lessons.length + ' 条记录</span>';
    html += '</div>';
    if (results.lessons.length === 0) {
      html += '<div style="font-size:var(--font-size-sm); color:var(--text-tertiary); text-align:center; padding:12px 0;">未提取到课时信息</div>';
    } else {
      for (var li = 0; li < results.lessons.length; li++) {
        var lesson = results.lessons[li];
        var sc = getSubjectColor(lesson.subject);
        html += '<div class="lesson-item">';
        html += '<div style="flex:1;">';
        html += '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">';
        if (lesson.recurring) {
          html += '<span class="badge-recurring">\u6bcf\u5468\u56fa\u5b9a</span>';
        }
        html += '<span style="font-size:var(--font-size-sm); font-weight:var(--weight-medium); color:var(--text-primary);">' + escapeHtml(lesson.day) + ' ' + escapeHtml(lesson.timeRange) + '</span>';
        if (lesson.contextDate) {
          html += '<span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">(' + escapeHtml(lesson.contextDate) + '\u5bf9\u8bdd\u786e\u8ba4)</span>';
        }
        html += '</div>';
        html += '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">';
        html += '<span class="subject-pill" style="background:' + sc.bg + '; color:' + sc.color + ';">' + escapeHtml(lesson.subject) + '</span>';
        html += '<span style="font-size:var(--font-size-xs); color:var(--text-secondary);">' + lesson.hours + '\u5c0f\u65f6/\u6b21</span>';
        if (lesson.contact) {
          html += '<span style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-left:auto;">' + escapeHtml(lesson.contact) + '</span>';
        }
        html += '</div>';
        html += '</div>';
        html += '</div>';
      }
    }
    html += '</div>';

    // Card B: Leaves
    html += '<div class="result-card">';
    html += '<div class="card-header">';
    html += '<span class="card-dot" style="background:var(--state-success);"></span>';
    html += '<span class="card-title">休假信息</span>';
    html += '<span class="card-badge">' + results.leaves.length + ' 条记录</span>';
    html += '</div>';
    if (results.leaves.length === 0) {
      html += '<div style="font-size:var(--font-size-sm); color:var(--text-tertiary); text-align:center; padding:12px 0;">未提取到休假信息</div>';
    } else {
      for (var lei = 0; lei < results.leaves.length; lei++) {
        var leave = results.leaves[lei];
        html += '<div class="leave-item">';
        html += '<div style="flex:1;">';
        html += '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:2px;">';
        html += '<span style="font-size:var(--font-size-sm); font-weight:var(--weight-medium); color:var(--text-primary);">' + escapeHtml(leave.startDate);
        if (leave.startDate !== leave.endDate) {
          html += ' - ' + escapeHtml(leave.endDate);
        }
        html += '</span>';
        html += '<span class="badge-recorded">\u5df2\u8bb0\u5f55</span>';
        if (leave.contact) {
          html += '<span style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-left:auto;">' + escapeHtml(leave.contact) + '</span>';
        }
        html += '</div>';
        html += '<span style="font-size:var(--font-size-xs); color:var(--text-secondary);">' + escapeHtml(leave.reason) + '</span>';
        html += '</div>';
        html += '</div>';
      }
    }
    html += '</div>';

    // Card C: Salary Records (per subject)
    html += '<div class="result-card">';
    var totalSalaryEntries = 0;
    for (var sg = 0; sg < results.salaries.length; sg++) {
      totalSalaryEntries += results.salaries[sg].entries.length;
    }
    html += '<div class="card-header">';
    html += '<span class="card-dot" style="background:var(--state-warning);"></span>';
    html += '<span class="card-title">薪资记录</span>';
    html += '<span class="card-badge">' + totalSalaryEntries + ' 条记录</span>';
    html += '</div>';
    if (results.salaries.length === 0) {
      html += '<div style="font-size:var(--font-size-sm); color:var(--text-tertiary); text-align:center; padding:12px 0;">未提取到薪资信息</div>';
    } else {
      for (var si = 0; si < results.salaries.length; si++) {
        var group = results.salaries[si];
        var gsc = getSubjectColor(group.subject);
        html += '<div class="salary-subject-section">';
        html += '<div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">';
        html += '<span class="subject-pill" style="background:' + gsc.bg + '; color:' + gsc.color + ';">' + escapeHtml(group.subject) + '</span>';
        html += '</div>';
        for (var se = 0; se < group.entries.length; se++) {
          var entry = group.entries[se];
          html += '<div class="salary-entry">';
          html += '<span class="salary-timeline-dot"></span>';
          html += '<div style="flex:1;">';
          html += '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">';
          html += '<span style="font-size:var(--font-size-sm); font-weight:var(--weight-bold); color:var(--text-primary);">' + entry.rate + '元/小时</span>';
          if (entry.type === 'pending') {
            html += '<span class="badge-pending">待生效</span>';
          } else if (entry.type === 'current') {
            html += '<span class="badge-current">当前标准</span>';
          } else if (entry.type === 'history') {
            html += '<span class="badge-history">历史标准</span>';
          }
          html += '</div>';
          if (entry.date) {
            html += '<div style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-top:2px;">' + escapeHtml(entry.date) + '起</div>';
          }
          html += '</div>';
          html += '</div>';
        }
        html += '</div>';
      }
    }
    html += '</div>';

    resultsCards.innerHTML = html;
  }

  function resetResults() {
    analysisResults = null;
    resultsCards.innerHTML = '';
    emptyState.style.display = '';
    bottomActionBar.classList.remove('visible');
    bottomActionBar.classList.add('hidden');
    fileInfoBar.classList.remove('visible');
    fileInput.value = '';
  }

  // ==================== Event Bindings ====================
  btnAddContact.addEventListener('click', showNewContactForm);
  btnCancelAdd.addEventListener('click', hideNewContactForm);
  btnConfirmAdd.addEventListener('click', confirmAddContact);
  btnDeleteContact.addEventListener('click', function() {
    if (!editingContactId) return;
    var doDelete = confirm('\u786e\u5b9a\u8981\u5220\u9664\u6b64\u8054\u7cfb\u4eba\u5417\uff1f\u5220\u9664\u540e\u65e0\u6cd5\u6062\u590d\u3002');
    if (!doDelete) return;
    contacts = contacts.filter(function(c) { return c.id !== editingContactId; });
    if (selectedContactId === editingContactId) selectedContactId = null;
    saveContacts();
    renderContacts();
    hideNewContactForm();
  });

  inputParentName.addEventListener('input', function() {
    this.style.borderColor = '';
  });
  inputStudentName.addEventListener('input', function() {
    this.style.borderColor = '';
  });

  fileInput.addEventListener('change', handleFile);
  setupDragDrop();

  btnSample.addEventListener('click', function() {
    processText(SAMPLE_TEXT);
  });

  btnReanalyze.addEventListener('click', function() {
    resetResults();
  });

  btnSave.addEventListener('click', function() {
    var origText = btnSave.textContent;
    btnSave.textContent = '已保存';
    btnSave.style.background = 'var(--state-success)';
    setTimeout(function() {
      btnSave.textContent = origText;
      btnSave.style.background = '';
    }, 1500);
  });

  // Back button
  var backBtn = document.querySelector('[data-dom-id="back-home"]');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      // Navigate to home page
      window.location.href = 'home.html';
    });
  }

  // ==================== Init ====================
  loadContacts();
  renderContacts();

  // ==================== Tab Navigation ====================
  var pageMap = {
    'tab-home': 'home.html',
    'tab-analysis': 'chat-analysis.html',
    'tab-lessons': 'lesson-tracking.html',
    'tab-profile': 'profile.html'
  };
  var tabs = document.querySelectorAll('.tab-item');
  for (var ti = 0; ti < tabs.length; ti++) {
    (function(tab) {
      tab.style.cursor = 'pointer';
      tab.addEventListener('click', function() {
        var id = tab.getAttribute('data-dom-id');
        if (id && pageMap[id]) {
          window.location.href = pageMap[id];
        }
      });
    })(tabs[ti]);
  }

})();
</script>
