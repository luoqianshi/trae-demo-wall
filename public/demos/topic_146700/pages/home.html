<!DOCTYPE html>
<html lang="zh-CN" class="mini-program">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家教助手 - 首页</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Mini-program specific overrides */
    html.mini-program body {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 70px;
      overflow-x: hidden;
    }

    /* Custom scrollbar hide for mini-program feel */
    html.mini-program ::-webkit-scrollbar { display: none; }
    html.mini-program body { -ms-overflow-style: none; scrollbar-width: none; }

    /* Status bar */
    .status-bar {
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      padding: 12px 16px;
      color: #FFFFFF;
      min-height: 48px;
      box-sizing: border-box;
    }

    /* Greeting card */
    .greeting-card {
      margin: 12px 16px 0 16px;
      position: relative;
      z-index: 1;
    }

    /* Stat card dot indicator */
    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      flex-shrink: 0;
    }

    /* Action button */
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 8px;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .action-btn:active {
      background: var(--bg-card-hover);
    }

    /* Action icon container */
    .action-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Activity item */
    .activity-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-default);
    }
    .activity-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* Activity badge */
    .activity-badge {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    /* Bottom tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 375px;
      margin: 0 auto;
      background: var(--bg-card);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 56px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 0px);
      z-index: 50;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 12px;
      transition: color var(--transition-fast);
    }

    .tab-indicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-item.active .tab-indicator {
      background: var(--color-primary);
    }

    .tab-item:not(.active) .tab-indicator {
      border: 2px solid var(--text-tertiary);
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="status-bar">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="width:24px;"></span>
      <span style="font-size:var(--font-size-lg); font-weight:var(--weight-semibold); letter-spacing:0.5px;">家教助手</span>
      <!-- Bell notification icon -->
      <button data-dom-id="btn-notification" style="width:24px; height:24px; background:none; border:none; cursor:pointer; position:relative; padding:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <!-- Notification dot -->
        <span style="position:absolute; top:0; right:0; width:8px; height:8px; background:#DC2626; border-radius:50%; border:2px solid #2563EB;"></span>
      </button>
    </div>
  </div>

  <!-- User Greeting Card -->
  <div class="greeting-card" style="background:var(--bg-card); border:1px solid var(--border-default); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-sm);">
    <div style="display:flex; align-items:center; gap:12px;">
      <!-- Avatar -->
      <div style="width:48px; height:48px; border-radius:50%; background:var(--color-primary); display:flex; align-items:center; justify-content:center; color:#FFFFFF; font-size:var(--font-size-lg); font-weight:var(--weight-semibold); flex-shrink:0;">
        张
      </div>
      <div style="flex:1;">
        <div style="font-size:var(--font-size-xl); font-weight:var(--weight-semibold); color:var(--text-primary); margin-bottom:2px;">
          下午好，张老师
        </div>
        <div style="font-size:var(--font-size-sm); color:var(--text-secondary);">
          今天有 <span style="color:var(--color-primary); font-weight:var(--weight-medium);">2 节</span> 待上课时
        </div>
      </div>
      <!-- Chevron right -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </div>

  <!-- Main Content Area -->
  <div style="padding:16px;">

    <!-- Quick Stats Row -->
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
      <!-- 本月课时 -->
      <div class="surface-card" style="padding:12px 10px; text-align:center;">
        <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:6px;">
          <span class="stat-dot" style="background:var(--color-primary);"></span>
          <span style="font-size:var(--font-size-xs); color:var(--text-secondary);">本月课时</span>
        </div>
        <div style="font-size:var(--font-size-xl); font-weight:var(--weight-bold); color:var(--color-primary);">
          32 <span style="font-size:var(--font-size-xs); font-weight:var(--weight-regular); color:var(--text-secondary);">小时</span>
        </div>
      </div>
      <!-- 本月收入 -->
      <div class="surface-card" style="padding:12px 10px; text-align:center;">
        <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:6px;">
          <span class="stat-dot" style="background:#059669;"></span>
          <span style="font-size:var(--font-size-xs); color:var(--text-secondary);">本月收入</span>
        </div>
        <div style="font-size:var(--font-size-xl); font-weight:var(--weight-bold); color:#059669;">
          ¥4,800
        </div>
      </div>
      <!-- 学生数量 -->
      <div class="surface-card" style="padding:12px 10px; text-align:center;">
        <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:6px;">
          <span class="stat-dot" style="background:#D97706;"></span>
          <span style="font-size:var(--font-size-xs); color:var(--text-secondary);">学生数量</span>
        </div>
        <div style="font-size:var(--font-size-xl); font-weight:var(--weight-bold); color:#D97706;">
          5 <span style="font-size:var(--font-size-xs); font-weight:var(--weight-regular); color:var(--text-secondary);">位</span>
        </div>
      </div>
    </div>

    <!-- Quick Action Grid -->
    <div style="margin-bottom:20px;">
      <div style="font-size:var(--font-size-sm); font-weight:var(--weight-medium); color:var(--text-secondary); margin-bottom:10px; padding-left:2px;">快捷功能</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <!-- 对话分析 -->
        <div class="action-btn" data-dom-id="nav-chat-analysis">
          <div class="action-icon" style="background:var(--color-primary-light);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <line x1="9" y1="9" x2="15" y2="9"/>
              <line x1="12" y1="6" x2="12" y2="12"/>
            </svg>
          </div>
          <span style="font-size:var(--font-size-sm); color:var(--text-primary); font-weight:var(--weight-medium);">对话分析</span>
        </div>
        <!-- 课时管理 -->
        <div class="action-btn" data-dom-id="nav-lesson-tracking">
          <div class="action-icon" style="background:#D1FAE5;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <circle cx="12" cy="16" r="2"/>
            </svg>
          </div>
          <span style="font-size:var(--font-size-sm); color:var(--text-primary); font-weight:var(--weight-medium);">课时管理</span>
        </div>
        <!-- 薪资记录 -->
        <div class="action-btn" data-dom-id="nav-salary-records">
          <div class="action-icon" style="background:#FEF3C7;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <span style="font-size:var(--font-size-sm); color:var(--text-primary); font-weight:var(--weight-medium);">薪资记录</span>
        </div>
        <!-- 设置 -->
        <div class="action-btn" data-dom-id="nav-settings">
          <div class="action-icon" style="background:var(--bg-sunken);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span style="font-size:var(--font-size-sm); color:var(--text-primary); font-weight:var(--weight-medium);">设置</span>
        </div>
      </div>
    </div>

    <!-- Recent Activity Section -->
    <div class="surface-card" style="padding:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <span style="font-size:var(--font-size-base); font-weight:var(--weight-semibold); color:var(--text-primary);">最近动态</span>
        <button data-dom-id="view-all-activity" style="font-size:var(--font-size-sm); color:var(--color-primary); background:none; border:none; cursor:pointer; padding:0; font-weight:var(--weight-medium);">查看全部</button>
      </div>

      <!-- Activity 1 -->
      <div class="activity-item">
        <div class="activity-badge" style="background:var(--color-primary-light);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:var(--font-size-sm); color:var(--text-primary); line-height:var(--line-height-normal);">
            <span style="color:var(--color-primary); font-weight:var(--weight-medium);">[分析完成]</span> 从与王妈妈的对话中提取了 3 条课时记录
          </div>
          <div style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-top:2px;">2分钟前</div>
        </div>
      </div>

      <!-- Activity 2 -->
      <div class="activity-item">
        <div class="activity-badge" style="background:#D1FAE5;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:var(--font-size-sm); color:var(--text-primary); line-height:var(--line-height-normal);">
            <span style="color:#059669; font-weight:var(--weight-medium);">[课时确认]</span> 周六数学课 14:00-16:00 已确认
          </div>
          <div style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-top:2px;">1小时前</div>
        </div>
      </div>

      <!-- Activity 3 -->
      <div class="activity-item">
        <div class="activity-badge" style="background:#FEF3C7;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:var(--font-size-sm); color:var(--text-primary); line-height:var(--line-height-normal);">
            <span style="color:#D97706; font-weight:var(--weight-medium);">[薪资到账]</span> 6月课酬 ¥1,600 已到账
          </div>
          <div style="font-size:var(--font-size-xs); color:var(--text-tertiary); margin-top:2px;">昨天</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" data-dom-id="tab-home">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--color-primary); font-weight:var(--weight-medium);">首页</span>
    </div>
    <div class="tab-item" data-dom-id="tab-analysis">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">分析</span>
    </div>
    <div class="tab-item" data-dom-id="tab-lessons">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">课时</span>
    </div>
    <div class="tab-item" data-dom-id="tab-profile">
      <div class="tab-indicator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <span style="font-size:var(--font-size-xs); color:var(--text-tertiary);">我的</span>
    </div>
  </div>

  <script>
  (function() {
    var pageMap = {
      'tab-home': 'home.html',
      'tab-analysis': 'chat-analysis.html',
      'tab-lessons': 'lesson-tracking.html',
      'tab-profile': 'profile.html'
    };
    var tabs = document.querySelectorAll('.tab-item');
    for (var i = 0; i < tabs.length; i++) {
      (function(tab) {
        tab.style.cursor = 'pointer';
        tab.addEventListener('click', function() {
          var id = tab.getAttribute('data-dom-id');
          if (id && pageMap[id]) {
            window.location.href = pageMap[id];
          }
        });
      })(tabs[i]);
    }
    var notifBtn = document.querySelector('[data-dom-id="btn-notification"]');
    if (notifBtn) {
      notifBtn.addEventListener('click', function() {
        window.location.href = 'notifications.html';
      });
    }
  })();
  </script>

</body>
</html>
