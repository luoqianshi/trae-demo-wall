<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注力训练工具</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>🧠 专注力训练工具</h1>
            <p>让我们一起提升专注力！</p>
        </header>

        <main id="main-content">
            <section class="home-page">
                <div class="card" onclick="startSchulte()">
                    <div class="card-icon">🔢</div>
                    <h2>舒尔特方格</h2>
                    <p>按顺序点击数字，锻炼你的注意力和反应速度！</p>
                </div>
                
                <div class="card" onclick="startColorTraining()">
                    <div class="card-icon">🎨</div>
                    <h2>汉字颜色训练</h2>
                    <p>选出汉字显示的颜色，挑战你的大脑！</p>
                </div>
            </section>

            <section class="schulte-page hidden">
                <button class="back-btn" onclick="goHome()">← 返回首页</button>
                
                <div class="setup-section" id="schulte-setup">
                    <h2>🔢 舒尔特方格</h2>
                    <p>请输入数字数量（最多30个）：</p>
                    <input type="number" id="schulte-size" min="2" max="30" value="9">
                    <button class="start-btn" onclick="startSchulteGame()">开始训练</button>
                </div>

                <div class="game-section hidden" id="schulte-game">
                    <div class="timer">⏱️ <span id="schulte-timer">00:00</span></div>
                    <p>请按顺序点击数字：<span id="next-number">1</span></p>
                    <div class="grid" id="schulte-grid"></div>
                </div>

                <div class="result-section hidden" id="schulte-result">
                    <h2>🎉 完成！</h2>
                    <div class="result-stats">
                        <div class="stat">
                            <span class="stat-label">用时</span>
                            <span class="stat-value" id="schulte-time">0秒</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">正确率</span>
                            <span class="stat-value" id="schulte-accuracy">100%</span>
                        </div>
                    </div>
                    <button class="start-btn" onclick="startSchulte()">再玩一次</button>
                </div>
            </section>

            <section class="color-page hidden">
                <button class="back-btn" onclick="goHome()">← 返回首页</button>
                
                <div class="game-section" id="color-game">
                    <div class="timer">⏱️ <span id="color-timer">00:00</span></div>
                    <p>请选出下面汉字显示的颜色：</p>
                    <div class="word-display" id="color-word">红</div>
                    <div class="color-options" id="color-options"></div>
                    <div class="progress">
                        <span id="color-progress">1/10</span>
                    </div>
                </div>

                <div class="result-section hidden" id="color-result">
                    <h2>🎉 完成！</h2>
                    <div class="result-stats">
                        <div class="stat">
                            <span class="stat-label">用时</span>
                            <span class="stat-value" id="color-time">0秒</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">正确率</span>
                            <span class="stat-value" id="color-accuracy">100%</span>
                        </div>
                    </div>
                    <button class="start-btn" onclick="startColorTraining()">再玩一次</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
