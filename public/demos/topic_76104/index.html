  'JINA_API_KEY', 'VOYAGE_API_KEY', 'MIXEDBREAD_API_KEY',
  'UPSTAGE_API_KEY', 'NOVITA_API_KEY', 'PERPLEXITY_API_KEY',
  'FIREWORKS_API_KEY', 'NVIDIA_API_KEY', 'XAI_API_KEY',
  'BEDROCK_API_KEY', 'VERTEXAI_API_KEY',
];

// ===== Parsing =====
function parseEnv(envText) {
  const config = {};
  const lines = envText.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    const eqIdx = trimmed.indexOf('=');
    if (eqIdx === -1) continue;
    const key = trimmed.substring(0, eqIdx).trim();
    let value = trimmed.substring(eqIdx + 1).trim();
    // Remove surrounding quotes
    if ((value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))) {
      value = value.slice(1, -1);
    }
    // Handle export prefix
    const cleanKey = key.startsWith('export ') ? key.substring(7).trim() : key;
    config[cleanKey] = value;
  }
  return config;
}

function getConfig(config, key) {
  return config[key] !== undefined ? config[key] : null;
}

function looksLikeRealKey(val) {
  if (!val || val.length < 15) return false;
  const lower = val.toLowerCase();
  if (lower.includes('your-') || lower.includes('placeholder')) return false;
  if (/^sk-?[x\*]+$/i.test(val)) return false;
  return true;
}

function looksLikePlaceholder(val) {
  if (!val) return false;
  const lower = val.toLowerCase();
  if (lower.includes('your-') || lower.includes('placeholder')) return true;
  if (/^sk-?[x\*]+$/i.test(val)) return true;
  return false;
}

function isDefault(config, key) {
  const val = getConfig(config, key);
  if (val === null) {
    // If key not set, check if default is a known concern
    const meta = KNOWN_DEFAULTS[key];
    if (meta && meta.severity === 'critical') {
      return { isDefault: true, isMissing: true, defaultVal: meta.default };
    }
    return null;
  }
  const meta = KNOWN_DEFAULTS[key];
  if (!meta) return null;
  return { isDefault: val === meta.default, isMissing: false, defaultVal: meta.default, actualVal: val };
}

// ===== Diagnosis Logic =====

function checkHttpLayer(config) {
  const issues = [];
  let score = 100;

  // Worker class check
  const workerClass = getConfig(config, 'SERVER_WORKER_CLASS') || 'gevent';
  const workerAmount = parseInt(getConfig(config, 'SERVER_WORKER_AMOUNT') || '1');

  // Warning: gevent + multiple workers is unnecessary
  if (workerClass === 'gevent' && workerAmount > 1) {
    issues.push({
      type: 'warning',
      text: `<strong>gevent 下多 Worker 无必要</strong>：当前 <code>SERVER_WORKER_CLASS=gevent</code> 且 <code>SERVER_WORKER_AMOUNT=${workerAmount}</code>。gevent 通过 greenlet 在单 Worker 内即可处理大量并发连接，官方推荐 <strong>保持为 1</strong>。多开 Worker 会浪费内存且无吞吐增益，如需更高并发应水平扩展实例而非增加 Worker 数。`,
      fix: '将 SERVER_WORKER_AMOUNT 改回 1'
    });
    score -= 15;
  }

  // Worker amount too high for sync
  if (workerClass !== 'gevent' && workerAmount > 4) {
    issues.push({
      type: 'warning',
      text: `<strong>同步 Worker 过多</strong>：当前 <code>SERVER_WORKER_CLASS=${workerClass}</code>（非 gevent），且 <code>SERVER_WORKER_AMOUNT=${workerAmount}</code>。同步模式下每个 Worker 独占一个进程，建议值为 <code>2 × CPU 核心数 + 1</code>。过多 Worker 会浪费内存且可能导致数据库连接耗尽。`,
      fix: '根据 CPU 核心数调整，建议不超过 CPU 核心数 × 2 + 1'
    });
    score -= 10;
  }

  // Worker connections too low
  const workerConnections = parseInt(getConfig(config, 'SERVER_WORKER_CONNECTIONS') || '10');
  if (workerClass === 'gevent' && workerConnections <= 10 && workerAmount === 1) {
    issues.push({
      type: 'warning',
      text: `<strong>并发连接数偏低</strong>：<code>SERVER_WORKER_CONNECTIONS=${workerConnections}</code>。gevent 单 Worker 模式下，此参数决定了最大并发处理能力。生产环境建议设为 <strong>30-100</strong>，避免高负载时请求排队。`,
      fix: '将 SERVER_WORKER_CONNECTIONS 调整为 30-100'
    });
    score -= 8;
  }

  // Gunicorn timeout
  const gunicornTimeout = parseInt(getConfig(config, 'GUNICORN_TIMEOUT') || '360');
  if (gunicornTimeout < 300) {
    issues.push({
      type: 'warning',
      text: `<strong>Gunicorn 超时偏短</strong>：<code>GUNICORN_TIMEOUT=${gunicornTimeout}</code>秒。LLM 流式响应（SSE）可能需要较长时间，超时过短会导致长连接被意外断开。推荐至少 <strong>360 秒</strong>。`,
      fix: '将 GUNICORN_TIMEOUT 设为 360 或更高'
    });
    score -= 8;
  }

  // DIFY_BIND_ADDRESS
  const bindAddr = getConfig(config, 'DIFY_BIND_ADDRESS');
  if (bindAddr === '0.0.0.0' && getConfig(config, 'CONSOLE_CORS_ALLOW_ORIGINS') === '*') {
    issues.push({
      type: 'warning',
      text: `<strong>开放监听 + CORS 全开</strong>：<code>DIFY_BIND_ADDRESS=0.0.0.0</code> 配合 <code>CORS=*</code> 意味着任何来源都可以访问 API。生产环境应限制 CORS 为具体域名。`,
      fix: '将 CONSOLE_CORS_ALLOW_ORIGINS 设为你的实际域名，如 https://dify.yourdomain.com'
    });
    score -= 10;
  }

  // No issues is good
  if (issues.length === 0) {
    issues.push({
      type: 'info',
      text: 'HTTP 接入层配置合理，gevent 单 Worker 模式已能充分利用异步 I/O 处理高并发。'
    });
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

function checkWorkflowParallel(config) {
  const issues = [];
  let score = 100;

  const maxExecTime = parseInt(getConfig(config, 'WORKFLOW_MAX_EXECUTION_TIME') || '1200');
  const appMaxExecTime = parseInt(getConfig(config, 'APP_MAX_EXECUTION_TIME') || '1200');
  const maxSteps = parseInt(getConfig(config, 'WORKFLOW_MAX_EXECUTION_STEPS') || '500');
  const callDepth = parseInt(getConfig(config, 'WORKFLOW_CALL_MAX_DEPTH') || '5');

  if (maxExecTime < 600) {
    issues.push({
      type: 'warning',
      text: `<strong>工作流执行时间偏短</strong>：<code>WORKFLOW_MAX_EXECUTION_TIME=${maxExecTime}</code>秒。复杂工作流（含多轮 LLM 调用 + RAG 检索）可能超过此时间，导致中途被终止。建议设为 <strong>1200 秒以上</strong>。`,
      fix: '将 WORKFLOW_MAX_EXECUTION_TIME 设为 1200 或更高'
    });
    score -= 15;
  }

  if (maxExecTime !== appMaxExecTime) {
    issues.push({
      type: 'warning',
      text: `<strong>执行时间不一致</strong>：<code>WORKFLOW_MAX_EXECUTION_TIME=${maxExecTime}</code>（工作流引擎级）与 <code>APP_MAX_EXECUTION_TIME=${appMaxExecTime}</code>（应用队列级）不匹配。两者作用于不同层面，不一致可能导致某一层面先触发超时、工作流被意外终止。官方建议<strong>同时增加并保持两者一致</strong>。`,
      fix: '将 WORKFLOW_MAX_EXECUTION_TIME 和 APP_MAX_EXECUTION_TIME 设为相同值'
    });
    score -= 10;
  }

  // Gunicorn timeout should cover the longest execution (only warn if user increased execution time)
  const gunicornTimeout = parseInt(getConfig(config, 'GUNICORN_TIMEOUT') || '360');
  const maxExecOverall = Math.max(maxExecTime, appMaxExecTime);
  if (maxExecOverall > 1200 && gunicornTimeout < maxExecOverall) {
    issues.push({
      type: 'warning',
      text: `<strong>Gunicorn 超时小于执行时间上限</strong>：<code>GUNICORN_TIMEOUT=${gunicornTimeout}</code>秒，而工作流/应用最大执行时间为 <strong>${maxExecOverall}</strong> 秒。Gunicorn 会在 ${gunicornTimeout} 秒后强制终止 Worker，可能导致 SSE 长连接在工作流完成前被断开。`,
      fix: `将 GUNICORN_TIMEOUT 设为 ${maxExecOverall + 60} 或更高（至少比最大执行时间长 60 秒）`
    });
    score -= 12;
  }

  if (maxSteps > 1000) {
    issues.push({
      type: 'info',
      text: `<strong>工作流步数较大</strong>：<code>WORKFLOW_MAX_EXECUTION_STEPS=${maxSteps}</code>。较高的步数上限允许更复杂的工作流，但也可能因无限循环导致资源耗尽。确保工作流设计有明确的终止条件。`
    });
  }

  if (callDepth > 10) {
    issues.push({
      type: 'warning',
      text: `<strong>调用深度过大</strong>：<code>WORKFLOW_CALL_MAX_DEPTH=${callDepth}</code>。过深的递归调用可能导致栈溢出和响应延迟成倍增加。建议不超过 <strong>5-8</strong>。`,
      fix: '将 WORKFLOW_CALL_MAX_DEPTH 设为 5-8'
    });
    score -= 10;
  }

  if (issues.length === 0) {
    issues.push({
      type: 'info',
      text: '工作流并行配置合理，执行时间和步数限制在安全范围内。'
    });
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

function checkCelery(config) {
  const issues = [];
  let score = 100;

  const celeryAmount = parseInt(getConfig(config, 'CELERY_WORKER_AMOUNT') || '4');
  const autoScale = getConfig(config, 'CELERY_AUTO_SCALE') || 'false';
  const celeryClass = getConfig(config, 'CELERY_WORKER_CLASS') || 'gevent';

  // Celery class change warning
  if (celeryClass && celeryClass !== 'gevent' && celeryClass !== '') {
    issues.push({
      type: 'critical',
      text: `<strong>Celery Worker 类型已修改</strong>：<code>CELERY_WORKER_CLASS=${celeryClass}</code>。官方强烈不建议修改此值，非 gevent 模式会破坏 psycopg2 和 gRPC 的 monkey-patch，导致数据库操作和插件调用异常。`,
      fix: '保持 CELERY_WORKER_CLASS 为空（默认使用 gevent）'
    });
    score -= 30;
  }

  // Auto-scale not enabled with high celery workers
  if (autoScale !== 'true' && celeryAmount > 4) {
    issues.push({
      type: 'warning',
      text: `<strong>建议启用自动扩缩</strong>：<code>CELERY_WORKER_AMOUNT=${celeryAmount}</code>，但 <code>CELERY_AUTO_SCALE</code> 未启用。固定 Worker 数在低负载时浪费资源，高负载时可能不足。推荐启用 <code>CELERY_AUTO_SCALE=true</code> 并设置合理的 min/max 区间。`,
      fix: '设置 CELERY_AUTO_SCALE=true，CELERY_MIN_WORKERS=2，CELERY_MAX_WORKERS=CPU核心数'
    });
    score -= 12;
  }

  // Too few workers
  if (celeryAmount < 2 && autoScale !== 'true') {
    issues.push({
      type: 'warning',
      text: `<strong>Celery Worker 数量偏少</strong>：<code>CELERY_WORKER_AMOUNT=${celeryAmount}</code>。生产环境中，知识库索引、工作流调度、邮件发送等异步任务可能排队积压。建议至少 <strong>2-4 个 Worker</strong>。`,
      fix: '将 CELERY_WORKER_AMOUNT 设为 2-4，或启用 CELERY_AUTO_SCALE=true'
    });
    score -= 10;
  }

  // Too many workers without auto-scale
  if (celeryAmount > 8 && autoScale !== 'true') {
    issues.push({
      type: 'warning',
      text: `<strong>Celery Worker 数量过多</strong>：<code>CELERY_WORKER_AMOUNT=${celeryAmount}</code>。过多的固定 Worker 会消耗大量内存和数据库连接，且大部分时间可能处于空闲状态。建议启用自动扩缩。`,
      fix: '启用 CELERY_AUTO_SCALE=true 替代固定大量 Worker'
    });
    score -= 10;
  }

  if (issues.length === 0) {
    issues.push({
      type: 'info',
      text: 'Celery 异步配置合理，Worker 数量和扩缩策略适配当前负载。'
    });
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

function checkModelProviders(config) {
  const issues = [];
  let score = 100;
  const configured = [];
  const missing = [];

  for (const key of MODEL_PROVIDER_KEYS) {
    const val = getConfig(config, key);
    if (looksLikeRealKey(val)) {
      configured.push(key);
    } else {
      missing.push(key);
    }
  }

  // Check for common placeholder patterns
  for (const key of MODEL_PROVIDER_KEYS) {
    const val = getConfig(config, key);
    if (val && looksLikePlaceholder(val)) {
      issues.push({
        type: 'warning',
        text: `<strong>${key} 使用了占位符</strong>：当前值为占位符而非真实 API Key。请替换为有效的 API 密钥。`
      });
      score -= 5;
    }
  }

  // Check OPENAI_API_BASE
  const openaiBase = getConfig(config, 'OPENAI_API_BASE');
  if (openaiBase && openaiBase !== 'https://api.openai.com/v1') {
    issues.push({
      type: 'info',
      text: `<strong>自定义 OpenAI API Base</strong>：<code>OPENAI_API_BASE=${openaiBase}</code>。确保此代理/中转服务稳定可靠，并在模型供应商中正确配置。`
    });
  }

  if (configured.length === 0 && missing.length > 0) {
    issues.push({
      type: 'critical',
      text: `<strong>未检测到任何已配置的模型供应商</strong>：至少需要配置一个模型供应商的 API Key（如 OPENAI_API_KEY），否则 Dify 无法调用任何 LLM 模型。你可以在 Dify 控制台的"模型供应商"页面手动添加，也可通过环境变量预设。`,
      fix: '至少设置一个模型供应商 API Key，如 OPENAI_API_KEY=sk-...'
    });
    score -= 40;
  } else if (configured.length > 0) {
    issues.push({
      type: 'info',
      text: `已检测到 <strong>${configured.length}</strong> 个模型供应商已配置：${configured.join(', ')}。`,
    });
  }

  // Text generation timeout
  const textGenTimeout = parseInt(getConfig(config, 'TEXT_GENERATION_TIMEOUT_MS') || '60000');
  if (textGenTimeout < 120000) {
    issues.push({
      type: 'warning',
      text: `<strong>文本生成超时偏短</strong>：<code>TEXT_GENERATION_TIMEOUT_MS=${textGenTimeout}</code>ms（${(textGenTimeout/1000).toFixed(0)}秒）。复杂 Prompt 或长文本生成可能超过此时间。建议设为 <strong>120000ms（2分钟）以上</strong>。`,
      fix: '将 TEXT_GENERATION_TIMEOUT_MS 设为 120000 或更高'
    });
    score -= 10;
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

function checkOverloadProtection(config) {
  const issues = [];
  let score = 100;

  const maxActive = getConfig(config, 'APP_MAX_ACTIVE_REQUESTS') || '0';
  const defaultActive = getConfig(config, 'APP_DEFAULT_ACTIVE_REQUESTS') || '0';

  if (maxActive === '0' || maxActive === '') {
    issues.push({
      type: 'warning',
      text: `<strong>未设置全局并发限制</strong>：<code>APP_MAX_ACTIVE_REQUESTS=${maxActive || '0'}</code>，表示无限制。生产环境中，单个恶意或异常应用可能耗尽所有资源，导致服务不可用。建议设为 <strong>50-200</strong> 之间的合理值。`,
      fix: '设置 APP_MAX_ACTIVE_REQUESTS=100（根据服务器规模调整）'
    });
    score -= 20;
  }

  if (defaultActive === '0' || defaultActive === '') {
    issues.push({
      type: 'info',
      text: `<strong>未设置应用默认并发限制</strong>：<code>APP_DEFAULT_ACTIVE_REQUESTS=${defaultActive || '0'}</code>。建议为每个应用设置默认并发上限，防止单应用占用过多资源。推荐 <strong>10-50</strong>。`,
      fix: '设置 APP_DEFAULT_ACTIVE_REQUESTS=20'
    });
    score -= 8;
  }

  // API tool timeouts
  const connectTimeout = parseInt(getConfig(config, 'API_TOOL_DEFAULT_CONNECT_TIMEOUT') || '10');
  const readTimeout = parseInt(getConfig(config, 'API_TOOL_DEFAULT_READ_TIMEOUT') || '60');

  if (connectTimeout < 5) {
    issues.push({
      type: 'warning',
      text: `<strong>API 工具连接超时过短</strong>：<code>API_TOOL_DEFAULT_CONNECT_TIMEOUT=${connectTimeout}</code>秒。外部 API 在网络波动时可能无法在 5 秒内建立连接，建议设为 <strong>10-30 秒</strong>。`,
      fix: '将 API_TOOL_DEFAULT_CONNECT_TIMEOUT 设为 10 或更高'
    });
    score -= 5;
  }

  if (readTimeout < 30) {
    issues.push({
      type: 'warning',
      text: `<strong>API 工具读取超时过短</strong>：<code>API_TOOL_DEFAULT_READ_TIMEOUT=${readTimeout}</code>秒。某些外部 API 响应较慢，30 秒内可能无法返回结果。建议设为 <strong>60-120 秒</strong>。`,
      fix: '将 API_TOOL_DEFAULT_READ_TIMEOUT 设为 60 或更高'
    });
    score -= 5;
  }

  if (issues.length === 0) {
    issues.push({
      type: 'info',
      text: '过载保护配置合理，已设置并发限制防止资源耗尽。'
    });
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

function checkDatabasePool(config) {
  const issues = [];
  let score = 100;

  const poolSize = parseInt(getConfig(config, 'SQLALCHEMY_POOL_SIZE') || '30');
  const maxOverflow = parseInt(getConfig(config, 'SQLALCHEMY_MAX_OVERFLOW') || '10');
  const poolRecycle = parseInt(getConfig(config, 'SQLALCHEMY_POOL_RECYCLE') || '3600');
  const poolPrePing = getConfig(config, 'SQLALCHEMY_POOL_PRE_PING') || 'false';
  const totalConnections = poolSize + maxOverflow;
  const postgresMax = parseInt(getConfig(config, 'POSTGRES_MAX_CONNECTIONS') || '200');

  // Pool pre-ping in production
  if (poolPrePing !== 'true' && poolPrePing !== 'True' && poolPrePing !== '1') {
    issues.push({
      type: 'warning',
      text: `<strong>未启用连接预检</strong>：<code>SQLALCHEMY_POOL_PRE_PING=${poolPrePing || 'false'}</code>。生产环境中，数据库连接可能因网络中断、数据库重启等原因变为"僵尸连接"。启用 pre-ping 可在使用前验证连接有效性，避免"connection already closed"错误。代价仅为每次查询前多一次轻量级 SELECT。`,
      fix: '设置 SQLALCHEMY_POOL_PRE_PING=true'
    });
    score -= 15;
  }

  // PostgreSQL connections vs pool (official formula)
  const workerAmount = parseInt(getConfig(config, 'SERVER_WORKER_AMOUNT') || '1');
  const workerConnections = parseInt(getConfig(config, 'SERVER_WORKER_CONNECTIONS') || '10');
  const celeryAmount = parseInt(getConfig(config, 'CELERY_WORKER_AMOUNT') || '4');
  // Official recommendation: SERVER_WORKER_AMOUNT × SERVER_WORKER_CONNECTIONS + CELERY_WORKER_AMOUNT + margin
  const requiredMin = workerAmount * workerConnections + celeryAmount + 20;

  if (postgresMax < requiredMin) {
    issues.push({
      type: 'critical',
      text: `<strong>PostgreSQL 连接数不足</strong>：<code>POSTGRES_MAX_CONNECTIONS=${postgresMax}</code>。根据 Dify 官方公式，至少需要 <strong>SERVER_WORKER_AMOUNT × SERVER_WORKER_CONNECTIONS + CELERY_WORKER_AMOUNT + 余裕</strong> = <strong>${requiredMin}</strong> 个连接。当前配置下，API 与 Celery 同时开启连接池时极易触发 <code>too many connections</code> 错误。`,
      fix: `将 POSTGRES_MAX_CONNECTIONS 设为 ${requiredMin} 或更高`
    });
    score -= 25;
  }

  // Pool recycle
  if (poolRecycle > 7200) {
    issues.push({
      type: 'warning',
      text: `<strong>连接回收周期过长</strong>：<code>SQLALCHEMY_POOL_RECYCLE=${poolRecycle}</code>秒（${(poolRecycle/3600).toFixed(1)}小时）。某些云数据库/负载均衡器会在更短时间后断开空闲连接。建议设为 <strong>3600 秒（1小时）</strong>或更短。`,
      fix: '将 SQLALCHEMY_POOL_RECYCLE 设为 3600'
    });
    score -= 8;
  }

  // Pool size too small for production
  if (poolSize < 20) {
    issues.push({
      type: 'warning',
      text: `<strong>连接池偏小</strong>：<code>SQLALCHEMY_POOL_SIZE=${poolSize}</code>。生产环境建议至少 <strong>20-30</strong>，高并发场景可设为 <strong>50-100</strong>。过小的连接池会导致请求排队等待数据库连接。`,
      fix: '将 SQLALCHEMY_POOL_SIZE 设为 30 或更高'
    });
    score -= 10;
  }

  if (issues.length === 0) {
    issues.push({
      type: 'info',
      text: '数据库连接池配置合理，连接预检已启用，连接数充足。'
    });
  }

  return { score: Math.max(0, score), issues, status: score >= 90 ? 'good' : score >= 70 ? 'warn' : 'bad' };
}

// ===== Security Check =====
function checkSecurity(config) {
  const criticalDefaults = [];
  for (const key of ['SECRET_KEY', 'DB_PASSWORD', 'REDIS_PASSWORD']) {
    const result = isDefault(config, key);
    if (result && result.isDefault) {
      criticalDefaults.push({ key, ...result });
    }
  }
  return criticalDefaults;
}

// ===== Overall Summary =====
function generateSummary(results) {
  const issues = [];
  for (const dim of results) {
    for (const issue of dim.issues) {
      if (issue.type === 'critical' || issue.type === 'warning') {
        issues.push({ dimension: dim.name, ...issue });
      }
    }
  }
  return issues;
}

// ===== Main Diagnosis =====
function runDiagnosis() {
  const envText = document.getElementById('env-input').value.trim();
  if (!envText) {
    alert('请先粘贴 .env 配置文件内容');
    return;
  }

  const config = parseEnv(envText);

  // Show loading
  const btn = document.getElementById('btn-diagnose');
  const origText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 分析中...';
  btn.disabled = true;

  // Run checks with slight delay for UX
  setTimeout(() => {
    const results = [
      { name: 'HTTP 接入层', icon: '🌐', key: 'http', ...checkHttpLayer(config) },
      { name: '工作流并行', icon: '⚡', key: 'workflow', ...checkWorkflowParallel(config) },
      { name: 'Celery 异步', icon: '🔧', key: 'celery', ...checkCelery(config) },
      { name: '模型供应商', icon: '🤖', key: 'model', ...checkModelProviders(config) },
      { name: '过载保护', icon: '🛡️', key: 'overload', ...checkOverloadProtection(config) },
      { name: '数据库连接池', icon: '🗄️', key: 'database', ...checkDatabasePool(config) },
    ];

    const securityIssues = checkSecurity(config);

    const overallScore = Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length);
    const overallStatus = overallScore >= 90 ? 'good' : overallScore >= 70 ? 'warn' : 'bad';
    const criticalCount = results.reduce((c, r) => c + r.issues.filter(i => i.type === 'critical').length, 0);
    const warningCount = results.reduce((c, r) => c + r.issues.filter(i => i.type === 'warning').length, 0);

    renderReport(results, securityIssues, overallScore, overallStatus, criticalCount, warningCount, config);

    btn.innerHTML = origText;
    btn.disabled = false;

    // Switch to report tab
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="report"]').classList.add('active');
    document.querySelector('.tab-btn[data-tab="report"]').disabled = false;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-report').classList.add('active');
    document.getElementById('panel-report').scrollIntoView({ behavior: 'smooth' });
  }, 500);
}

function renderReport(results, securityIssues, overallScore, overallStatus, criticalCount, warningCount, config) {
  const statusLabels = { good: '健康', warn: '需关注', bad: '需修复' };
  const statusColors = { good: 'good', warn: 'warn', bad: 'bad' };
  const statusEmoji = { good: '✅', warn: '⚠️', bad: '🔴' };

  let html = '';

  // Overall score
  html += `
  <div class="score-section">
    <div class="score-card ${statusColors[overallStatus]}">
      <div class="score-num">${overallScore}</div>
      <div class="score-label">综合健康分</div>
    </div>
    <div class="score-card ${criticalCount > 0 ? 'bad' : 'good'}">
      <div class="score-num">${criticalCount}</div>
      <div class="score-label">严重问题</div>
    </div>
    <div class="score-card ${warningCount > 0 ? 'warn' : 'good'}">
      <div class="score-num">${warningCount}</div>
      <div class="score-label">优化建议</div>
    </div>
    <div class="score-card good">
      <div class="score-num">${Object.keys(config).length}</div>
      <div class="score-label">已解析参数</div>
    </div>
  </div>`;

  // Security alerts
  if (securityIssues.length > 0) {
    html += `<div class="card" style="border-left:4px solid var(--red);">`;
    html += `<h3 style="color:var(--red);font-size:1rem;margin-bottom:12px;">🔴 安全警报：以下关键参数使用了默认值</h3>`;
    html += `<ul class="issue-list">`;
    for (const s of securityIssues) {
      html += `<li class="issue-item critical">
        <span class="dot"></span>
        <span class="issue-text"><strong>${s.key}</strong>${s.isMissing ? ' 未设置' : ' 使用了默认值'}。${KNOWN_DEFAULTS[s.key]?.desc || ''} 使用默认值存在严重安全风险。${s.key === 'SECRET_KEY' ? '修改后所有用户 Token 将失效，请务在首次部署前设置！' : ''}</span>
      </li>`;
    }
    html += `</ul></div>`;
  }

  // Dimension cards
  html += `<div class="filter-section">
    <button class="filter-chip active" onclick="filterDims('all', this)">全部</button>
    <button class="filter-chip" onclick="filterDims('critical', this)">严重</button>
    <button class="filter-chip" onclick="filterDims('warning', this)">警告</button>
    <button class="filter-chip" onclick="filterDims('good', this)">正常</button>
  </div>`;

  for (const dim of results) {
    const statusClass = statusColors[dim.status];
    const badgeLabel = statusLabels[dim.status];
    const hasIssues = dim.issues.some(i => i.type === 'critical' || i.type === 'warning');

    html += `
    <div class="card dim-card" data-status="${dim.status}">
      <div class="dim-header" onclick="toggleDim(this)">
        <div class="icon ${statusClass}">${dim.icon}</div>
        <h3>${dim.name}</h3>
        <span class="status-badge ${statusClass}">${badgeLabel} · ${dim.score}分</span>
        <span class="arrow ${hasIssues ? 'open' : ''}">▶</span>
      </div>
      <div class="dim-body ${hasIssues ? 'open' : ''}">
        <ul class="issue-list">`;

    for (const issue of dim.issues) {
      html += `
          <li class="issue-item ${issue.type}">
            <span class="dot"></span>
            <span class="issue-text">${issue.text}</span>
          </li>`;
      if (issue.fix) {
        html += `
          <div class="recommendation">
            <strong>💡 建议修复：</strong>${issue.fix}
          </div>`;
      }
    }

    html += `
        </ul>
      </div>
    </div>`;
  }

  // Summary of all issues
  const allIssues = generateSummary(results);
  if (allIssues.length > 0) {
    html += `<div class="card">
      <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;">📋 问题汇总（${allIssues.length} 项）</h3>
      <div class="summary-grid">`;
    for (const issue of allIssues) {
      html += `<div class="summary-item">
        <div class="label">${issue.dimension} · ${issue.type === 'critical' ? '严重' : '警告'}</div>
        <div class="value" style="font-size:0.88rem;font-weight:500;">${issue.text.replace(/<[^>]*>/g, '').substring(0, 80)}...</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  document.getElementById('report-content').innerHTML = html;
}

// ===== UI Helpers =====
function toggleDim(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function filterDims(status, btn) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.dim-card').forEach(card => {
    if (status === 'all') {
      card.style.display = '';
    } else if (status === 'critical') {
      card.style.display = card.querySelector('.status-badge.bad') ? '' : 'none';
    } else if (status === 'warning') {
      card.style.display = card.querySelector('.status-badge.warn') ? '' : 'none';
    } else if (status === 'good') {
      card.style.display = card.querySelector('.status-badge.good') ? '' : 'none';
    }
  });
}
