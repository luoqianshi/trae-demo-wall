<!-- =============================================
     Project Shell — Shared HTML Fragment
     Navbar + Page Wrapper for all pages
     ============================================= -->

<!-- Fixed Top Navbar: 56px height, white bg, bottom border -->
<nav class="fixed top-0 left-0 right-0 z-50 h-14 flex items-center justify-center"
     style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border);">
  <div class="w-full flex items-center justify-between"
       style="max-width: 1400px; padding: 0 24px;">

    <!-- Left: Logo -->
    <a href="#" class="flex items-center gap-1 shrink-0" style="text-decoration: none;">
      <span class="display-heading-3" style="font-size: 20px; font-weight: 700; letter-spacing: -0.025em; color: var(--color-text-primary);">
        Video
      </span>
      <span class="display-heading-3" style="font-size: 20px; font-weight: 700; letter-spacing: -0.025em; color: var(--color-primary);">
        AI
      </span>
    </a>

    <!-- Center: Navigation Links -->
    <div class="flex items-center gap-5">
      <a href="#"
         data-nav-key="video-upload"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        视频上传解析
      </a>
      <a href="#"
         data-nav-key="analysis-result"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        解析结果详情
      </a>
      <a href="#"
         data-nav-key="multi-fusion"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        多视频融合创作
      </a>
      <a href="#"
         data-nav-key="image-search"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        以图搜视频检索
      </a>
      <a href="#"
         data-nav-key="frame-workspace"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        帧级创作工作台
      </a>
      <a href="#"
         data-nav-key="audio-workspace"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        音频创作工作台
      </a>
      <a href="#"
         data-nav-key="online-editor"
         class="nav-link"
         style="font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);"
         onmouseover="this.style.color='var(--color-primary)'"
         onmouseout="this.style.color='var(--color-text-secondary)'">
        在线剪辑工作台
      </a>
    </div>

    <!-- Right: User Avatar Placeholder -->
    <div class="shrink-0 flex items-center justify-center rounded-full"
         style="width: 32px; height: 32px; background-color: var(--color-bg-tertiary); border: 1px solid var(--color-border);">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="8" cy="5" r="2.5" fill="var(--color-text-tertiary)"/>
        <path d="M2.5 14C2.5 11.2386 4.98828 9 8 9C11.0117 9 13.5 11.2386 13.5 14" stroke="var(--color-text-tertiary)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

  </div>
</nav>
