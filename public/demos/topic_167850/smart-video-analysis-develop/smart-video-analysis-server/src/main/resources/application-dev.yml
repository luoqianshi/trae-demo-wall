spring:
  datasource:
    url: jdbc:mysql://localhost:13306/smart_video_analysis?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useOldAliasMetadataBehavior=true&nullNamePatternMatchesAll=true&connectTimeout=10000&socketTimeout=60000
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 10000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: localhost
      port: 16379
      password: redis123
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

minio:
  endpoint: http://localhost:19000
  access-key: minioadmin
  secret-key: minioadmin123
  buckets:
    video-raw: video-raw
    video-processed: video-processed
    audio-output: audio-output
    image-frames: image-frames
    image-generated: image-generated
    project-exports: project-exports
    temp: temp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sva: debug
    org.springframework.security: info
