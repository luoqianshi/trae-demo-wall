spring:
  application:
    name: smart-video-analysis
  profiles:
    active: h2
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080
  address: 127.0.0.1
  tomcat:
    protocol: org.apache.coyote.http11.Http11Protocol
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sva.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://localhost:19000
  access-key: minioadmin
  secret-key: minioadmin123
  buckets:
    video-raw: video-raw
    video-processed: video-processed
    audio-output: audio-output
    image-frames: image-frames
    image-generated: image-generated
    project-exports: project-exports
    temp: temp

ai:
  comfyui:
    enabled: false
    endpoint: http://localhost:8188
    api-key: ""
    timeout: 60000
  whisper:
    enabled: false
    endpoint: http://localhost:9002
    timeout: 300000
  tts:
    enabled: false
    endpoint: http://localhost:5000
    timeout: 60000
  rvc:
    enabled: false
    endpoint: http://localhost:6000
    timeout: 60000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sva.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
