<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Win11增强记事本 成品交互Demo（局部文字高亮版）</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #202020;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Win11主窗口 */
.win11-window {
    width: 1280px;
    height: 720px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 60px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
}

/* 顶部固定栏 禁止压缩 */
.win-title-bar, .menu-bar, .tool-bar, .single-slider-wrap, .status-bar {
    flex-shrink: 0;
}

/* 窗口标题栏 */
.win-title-bar {
    height: 36px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    border-bottom: 1px solid #e5e5e5;
}
.window-dots {
    display: flex;
    gap: 8px;
}
.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
.dot-close { background: #ff5f57; }
.dot-min   { background: #ffbd2e; }
.dot-max   { background: #28c840; }

/* 标签栏 */
.tab-container {
    display: flex;
    flex: 1;
    height: 28px;
    gap: 4px;
    overflow-x: auto;
}
.tab {
    height: 26px;
    background: #e8e8e8;
    border-radius: 6px 6px 0 0;
    display: inline-flex;
    align-items: center;
    padding: 0 14px;
    min-width: 120px;
    font-size: 13px;
    cursor: pointer;
}
.tab.active {
    background: #fff;
    border: 1px solid #ddd;
    border-bottom: none;
}
.tab-close {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin-left: 8px;
}
.tab-close:hover {
    background: #dcdcdc;
}

/* 菜单栏 */
.menu-bar {
    height: 30px;
    background: #ffffff;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #dddddd;
}
.menu-item {
    padding: 4px 12px;
    font-size: 14px;
    cursor: pointer;
}
.menu-item:hover {
    background: #e8f0fe;
}

/* 工具栏 */
.tool-bar {
    height: 42px;
    background: #f8f8f8;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 15px;
    border-bottom: 1px solid #ddd;
}
.tool-btn {
    padding: 6px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
}
.tool-btn:hover {
    background: #eeeeee;
}
.tool-btn.active {
    background: #0067c0;
    color: #fff;
    border-color: #0067c0;
}

/* 核心编辑容器 自动占满剩余高度 */
.editor-root {
    flex: 1;
    width: 100%;
    height: 100%;
}

/* 分屏布局 纯并列无嵌套 */
.split-row {
    display: flex;
    width: 100%;
    height: 100%;
}
.split-col {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
}

/* 分割线固定尺寸不压缩 */
.gutter-v {
    width: 4px;
    background: #ddd;
    cursor: ew-resize;
    flex-shrink: 0;
}
.gutter-h {
    height: 4px;
    background: #ddd;
    cursor: ns-resize;
    flex-shrink: 0;
}

/* 编辑面板容器 */
.edit-panel {
    flex: 1;
    height: 100%;
    border: 1px solid #e5e5e5;
}
/* 可编辑文本框，支持span局部高亮 */
.edit-box {
    width: 100%;
    height: 100%;
    padding: 12px;
    font-size: 14px;
    line-height: 1.75;
    overflow: auto;
    white-space: pre-wrap;
    outline: none;
}
/* 局部文字高亮样式 */
.diff-mod { background: #fff2b3; color: #996b00; }
.diff-del { background: #ffd9d9; color: #c51f1f; text-decoration: line-through; }
.diff-add { background: #d9ffd9; color: #098609; }

/* 单行模式底部滑块 */
.single-slider-wrap {
    height: 34px;
    background: #f1f1f1;
    display: none;
    align-items: center;
    padding: 0 15px;
    border-top: 1px solid #ddd;
}
.slider-track {
    width: 100%;
    height: 6px;
    background: #ccc;
    border-radius: 3px;
}

/* 状态栏 */
.status-bar {
    height: 28px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 12px;
    color: #444;
    gap: 30px;
    border-top: 1px solid #ddd;
}

/* 弹窗遮罩 */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}
.modal.show {
    display: flex;
}
.modal-dialog {
    width: 400px;
    background: #fff;
    border-radius: 8px;
    padding: 22px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal-dialog h4 {
    margin-bottom: 10px;
    font-size: 15px;
}
.modal-dialog p {
    margin-bottom: 16px;
    font-size: 13px;
    color: #555;
    line-height: 1.6;
}
.modal-dialog button {
    padding: 6px 18px;
    background: #0067c0;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="win11-window">
    <!-- 标题栏+标签 -->
    <div class="win-title-bar">
        <div class="window-dots">
            <div class="dot dot-close"></div>
            <div class="dot dot-min"></div>
            <div class="dot dot-max"></div>
        </div>
        <div class="tab-container">
            <div class="tab active">项目文档.txt<span class="tab-close">×</span></div>
            <div class="tab">校对版本.txt<span class="tab-close">×</span></div>
            <div class="tab" onclick="newTabTip()">+ 新建标签</div>
        </div>
    </div>
    <!-- 原生菜单 -->
    <div class="menu-bar">
        <div class="menu-item">文件(F)</div>
        <div class="menu-item">编辑(E)</div>
        <div class="menu-item">格式(O)</div>
        <div class="menu-item">查看(V)</div>
        <div class="menu-item">帮助(H)</div>
    </div>
    <!-- 功能工具栏 -->
    <div class="tool-bar">
        <button class="tool-btn" onclick="addVertical()">纵向分屏</button>
        <button class="tool-btn" onclick="addHorizontal()">横向分屏</button>
        <button class="tool-btn" onclick="resetScreen()">重置单屏</button>
        <button class="tool-btn" id="btnDiff" onclick="toggleDiff()">开启差异高亮</button>
        <button class="tool-btn" onclick="saveLayout()">保存分屏布局</button>
        <button class="tool-btn" onclick="toggleLine()">智能单句换行</button>
        <button class="tool-btn" onclick="toggleSingle()">单行极简模式</button>
    </div>
    <!-- 主编辑区 -->
    <div class="editor-root" id="editorRoot">
        <div class="edit-panel">
            <div class="edit-box" contenteditable="true">Win11 增强记事本｜成品预览界面
————————————————————
【操作说明】
纵向分屏：1屏 → 左右2屏 → 左中右3屏（纯并列无嵌套）
横向分屏：1屏 → 上下2屏 → 上中下3屏
重置单屏：恢复全屏原生界面
开启差异高亮：三屏内不同文字单独色块高亮
————————————————————
UI、交互逻辑与PyQt6开发成品完全一致</div>
        </div>
    </div>
    <!-- 单行模式滑块 -->
    <div class="single-slider-wrap" id="singleSlider">
        <div class="slider-track"></div>
    </div>
    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="statLayout">布局：全屏单屏</span>
        <span id="statDiff">文本对比：关闭</span>
        <span id="statLine">智能换行：关闭</span>
        <span>UTF-8</span>
        <span>行 1，列 1</span>
    </div>
</div>

<!-- 弹窗 -->
<div class="modal" id="globalModal">
    <div class="modal-dialog">
        <h4 id="modTitle">提示</h4>
        <p id="modText"></p>
        <button onclick="closeModal()">确定</button>
    </div>
</div>

<script>
let vCnt = 1;
let hCnt = 1;
let diffOn = false;
let lineOn = false;
let singleOn = false;

const editorRoot = document.getElementById('editorRoot');
const btnDiff = document.getElementById('btnDiff');
const statLayout = document.getElementById('statLayout');
const statDiff = document.getElementById('statDiff');
const statLine = document.getElementById('statLine');
const singleSlider = document.getElementById('singleSlider');
const globalModal = document.getElementById('globalModal');
const modTitle = document.getElementById('modTitle');
const modText = document.getElementById('modText');

function showModal(tip, txt) {
    modTitle.innerText = tip;
    modText.innerText = txt;
    globalModal.classList.add('show');
}
function closeModal() {
    globalModal.classList.remove('show');
}

// 重置全屏单屏
function resetScreen() {
    vCnt = 1;
    hCnt = 1;
    singleOn = false;
    singleSlider.style.display = 'none';
    diffOn = false;
    btnDiff.classList.remove('active');
    statDiff.innerText = "文本对比：关闭";
    editorRoot.innerHTML = `<div class="edit-panel">
<div class="edit-box" contenteditable="true">Win11 增强记事本｜成品预览界面
————————————————————
【操作说明】
纵向分屏：1屏 → 左右2屏 → 左中右3屏（纯并列无嵌套）
横向分屏：1屏 → 上下2屏 → 上中下3屏
重置单屏：恢复全屏原生界面
开启差异高亮：三屏内不同文字单独色块高亮
————————————————————
UI、交互逻辑与PyQt6开发成品完全一致</div>
</div>`;
    statLayout.innerText = "布局：全屏单屏";
}

// 纵向分屏：1→2→3 纯左右并列
function addVertical() {
    if (singleOn) return showModal("禁止操作", "单行模式下不可分屏，请先退出");
    hCnt = 1;
    if (vCnt >= 3) return showModal("提示", "纵向最多3等分屏，用于三版本文本对比");
    vCnt++;
    let html = `<div class="split-row">`;
    // 左屏 基准原版
    html += `<div class="edit-panel"><div class="edit-box" contenteditable="false">【基准原版｜左屏】
Win11增强记事本核心功能清单
1. 原生界面全部复刻
2. 多级横竖递归分屏编辑
3. 智能语义单句自动换行
4. 分屏布局状态持久化保存
5. 多文档内容差异高亮对比
6. 单行极简逐行编辑模式

性能要求：秒启动、低内存、无后台进程</div></div>`;
    // 中间修改版
    if (vCnt >= 2) {
        html += `<div class="gutter-v"></div>`;
        html += `<div class="edit-panel"><div id="midBox" class="edit-box" contenteditable="false">【修改版本A｜中屏】
Win11增强记事本功能总览
1. 原生UI、快捷键、菜单完整复刻
2. 多级横竖递归分屏编辑布局
3. 智能语义单句自动换行引擎
4. 分屏布局状态持久化保存
5. 多文档实时差异高亮对比
6. 单行极简逐行编辑模式

性能要求：秒启动、低内存占用运行</div></div>`;
    }
    // 右侧新增版
    if (vCnt >= 3) {
        html += `<div class="gutter-v"></div>`;
        html += `<div class="edit-panel"><div id="rightBox" class="edit-box" contenteditable="false">【修改版本B｜右屏】
Win11增强记事本全能力清单
1. 原生界面与交互1:1复刻
2. 多级横竖递归分屏布局
3. 智能语义单句自动换行
5. 单行极简逐行编辑模式
6. 新增深色主题适配功能

性能要求：秒启动、极低内存、无后台驻留</div></div>`;
    }
    html += `</div>`;
    editorRoot.innerHTML = html;
    statLayout.innerText = `布局：纵向${vCnt}等分并列屏`;
}

// 横向分屏：1→2→3 纯上下并列
function addHorizontal() {
    if (singleOn) return showModal("禁止操作", "单行模式下不可分屏，请先退出");
    vCnt = 1;
    if (hCnt >= 3) return showModal("提示", "横向最多支持3等分屏");
    hCnt++;
    let html = `<div class="split-col">`;
    html += `<div class="edit-panel"><div class="edit-box" contenteditable="true">【上段｜基础功能区】
复刻Win11记事本全部原生能力：
文件/编辑/格式/查看/状态栏/快捷键</div></div>`;
    if (hCnt >= 2) html += `<div class="gutter-h"></div><div class="edit-panel"><div class="edit-box" contenteditable="true">【中段｜增强功能区】
五大核心拓展功能：
递归分屏、智能换行、布局持久化、文本对比、单行模式</div></div>`;
    if (hCnt >= 3) html += `<div class="gutter-h"></div><div class="edit-panel"><div class="edit-box" contenteditable="true">【下段｜性能与部署区】
技术栈：Python + PyQt6
打包独立EXE，Win10/11免环境运行</div></div>`;
    html += `</div>`;
    editorRoot.innerHTML = html;
    statLayout.innerText = `布局：横向${hCnt}等分并列屏`;
}

// 差异高亮：局部字词单独上色（核心需求）
function toggleDiff() {
    diffOn = !diffOn;
    btnDiff.classList.toggle('active', diffOn);
    statDiff.innerText = diffOn ? "文本对比：开启(字词局部高亮)" : "文本对比：关闭";
    const midBox = document.getElementById('midBox');
    const rightBox = document.getElementById('rightBox');
    if (!midBox || !rightBox) {
        if (diffOn) showModal("提示", "请先点击【纵向分屏】打开3屏布局，才能预览字词差异高亮");
        return;
    }
    if (!diffOn) {
        // 关闭，还原纯文本
        midBox.innerHTML = `【修改版本A｜中屏】
Win11增强记事本功能总览
1. 原生UI、快捷键、菜单完整复刻
2. 多级横竖递归分屏编辑布局
3. 智能语义单句自动换行引擎
4. 分屏布局状态持久化保存
5. 多文档实时差异高亮对比
6. 单行极简逐行编辑模式

性能要求：秒启动、低内存占用运行`;
        rightBox.innerHTML = `【修改版本B｜右屏】
Win11增强记事本全能力清单
1. 原生界面与交互1:1复刻
2. 多级横竖递归分屏布局
3. 智能语义单句自动换行
5. 单行极简逐行编辑模式
6. 新增深色主题适配功能

性能要求：秒启动、极低内存、无后台驻留`;
        return;
    }
    // 开启：局部文字套span上色
    midBox.innerHTML = `【修改版本A｜中屏】
Win11增强记事本<span class="diff-mod">功能总览(命名调整)</span>
1. 原生UI、快捷键、菜单完整复刻
2. 多级横竖递归分屏编辑布局
3. 智能语义单句自动换行<span class="diff-mod">引擎(算法升级)</span>
4. 分屏布局状态持久化保存
5. 多文档实时差异高亮对比
6. 单行极简逐行编辑模式

性能要求：秒启动、<span class="diff-del">低内存占用运行(冗余删除)</span>`;

    rightBox.innerHTML = `【修改版本B｜右屏】
Win11增强记事本<span class="diff-add">全能力清单(扩容新增)</span>
1. 原生界面与交互1:1复刻
2. 多级横竖递归分屏布局
3. 智能语义单句自动换行
5. 单行极简逐行编辑模式
6. <span class="diff-add">新增深色主题适配功能(独家拓展)</span>

性能要求：秒启动、<span class="diff-mod">极低内存、无后台驻留深度优化</span>`;
    showModal("差异对比已激活", "🟡黄色=修改文字 🔴红色=删除文字（带删除线） 🟢绿色=新增文字，仅不同片段单独高亮，非整屏底色");
}

// 智能单句换行
function toggleLine() {
    lineOn = !lineOn;
    statLine.innerText = lineOn ? "智能换行：开启" : "智能换行：关闭";
    showModal("智能单句换行", lineOn ? "开启：自动识别。？！；分句，一句一行，各分屏独立生效" : "关闭：恢复原生窗口宽度换行");
}

// 保存分屏布局
function saveLayout() {
    showModal("布局保存成功", "当前分屏层级、面板文本已缓存，PyQt6成品重启一键还原");
}

// 单行极简模式
function toggleSingle() {
    singleOn = !singleOn;
    singleSlider.style.display = singleOn ? "flex" : "none";
    if (singleOn) {
        vCnt = 1;
        hCnt = 1;
        editorRoot.innerHTML = `<div class="split-col" style="height:100%">
            <div class="edit-panel"><div class="edit-box" style="height:36px" contenteditable="true">单行1：台词/脚本专用编辑</div></div>
            <div class="gutter-h"></div>
            <div class="edit-panel"><div class="edit-box" style="height:36px" contenteditable="true">单行2：代码片段草稿</div></div>
            <div class="gutter-h"></div>
            <div class="edit-panel"><div class="edit-box" style="height:36px" contenteditable="true">单行3：文案逐行校对</div></div>
            <div class="gutter-h"></div>
            <div class="edit-panel"><div class="edit-box" style="height:36px" contenteditable="true">单行4：配置参数编辑</div></div>
            <div class="gutter-h"></div>
            <div class="edit-panel"><div class="edit-box" style="height:36px" contenteditable="true">单行5：日志条目记录</div></div>
        </div>`;
        statLayout.innerText = "布局：单行极简模式";
        showModal("单行极简模式", "每个面板限制单行输入，底部全局统一滑块，溢出内容整体滑动查看");
    } else {
        resetScreen();
    }
}

// 新建标签提示
function newTabTip() {
    showModal("原生标签功能", "完整复刻Win11新版记事本标签交互：新建、关闭、拖拽排序、拖拽分离独立窗口、多窗口标签合并");
}
</script>
</body>
</html>
