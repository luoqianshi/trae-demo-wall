<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今天想什么</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Noto Sans SC', sans-serif;
      background: #FFFFFF;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Shell Layout ── */
    .app-shell {
      position: relative;
      width: 375px;
      min-height: 812px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #FFFFFF;
      z-index: 100;
      flex-shrink: 0;
    }

    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: #1D1D1F;
      letter-spacing: 0.02em;
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar-icons svg {
      display: block;
    }

    /* ── System Capsule ── */
    .sys-capsule {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 87px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.06);
      z-index: 101;
    }

    .sys-capsule span {
      flex: 1;
      text-align: center;
      font-size: 16px;
      color: rgba(0, 0, 0, 0.5);
      line-height: 1;
    }

    .sys-capsule .capsule-divider {
      width: 1px;
      height: 16px;
      background: rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
    }

    /* ── Page Content Area ── */
    .page-content {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Bottom Tab Bar (4 tabs) ── */
    .tab-bar {
      position: relative;
      width: 100%;
      height: 83px;
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      background: #FFFFFF;
      border-top: 0.5px solid #F2F2F7;
      padding-top: 6px;
      padding-bottom: 34px;
      flex-shrink: 0;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      flex: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-decoration: none;
      background: none;
      border: none;
      outline: none;
      position: relative;
    }

    .tab-item svg {
      display: block;
      transition: color 0.2s ease;
    }

    .tab-item-label {
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      transition: color 0.2s ease;
    }

    /* ── Tab States ── */
    .tab-item--active svg {
      color: #34C759;
    }

    .tab-item--active .tab-item-label {
      color: #34C759;
    }

    .tab-item--inactive svg {
      color: #8E8E93;
    }

    .tab-item--inactive .tab-item-label {
      color: #8E8E93;
    }

    /* ── Hidden Tab Bar (for full-screen pages) ── */
    .tab-bar--hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-bar-time">9:41</span>
      <div class="status-bar-icons">
        <!-- Signal -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-label="信号">
          <rect x="0" y="9" width="3" height="3" rx="0.5" fill="#1D1D1F"/>
          <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#1D1D1F"/>
          <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#1D1D1F"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#1D1D1F"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-label="WiFi">
          <path d="M8 10.5a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z" fill="#1D1D1F"/>
          <path d="M4.93 8.47a4.47 4.47 0 016.14 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M2.1 5.64a8.02 8.02 0 0111.8 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M0 3a10.8 10.8 0 0116 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <!-- Battery -->
        <svg width="27" height="12" viewBox="0 0 27 12" fill="none" aria-label="电池">
          <rect x="0.5" y="0.5" width="23" height="11" rx="2.5" stroke="#1D1D1F" stroke-width="1"/>
          <rect x="24.5" y="3.5" width="2" height="5" rx="1" fill="#1D1D1F" opacity="0.4"/>
          <rect x="2" y="2" width="20" height="8" rx="1.5" fill="#1D1D1F"/>
        </svg>
      </div>

      <!-- System Capsule -->
      <div class="sys-capsule w-[87px] h-8" style="display:flex;align-items:center;border-radius:9999px;background:rgba(0,0,0,0.06);position:absolute;right:16px;top:50%;transform:translateY(-50%)">
        <span style="flex:1;text-align:center;font-size:16px;color:rgba(0,0,0,0.5);letter-spacing:-2px" aria-label="更多">···</span>
        <span class="w-px" style="width:1px;height:16px;background:rgba(0,0,0,0.1);display:inline-block"></span>
        <span style="flex:1;text-align:center;font-size:16px;color:rgba(0,0,0,0.5)" aria-label="关闭">×</span>
      </div>
    </div>

    <!-- SLOT: pageContent -->
    <div class="page-content">
      <!-- Page content goes here -->
    </div>

    <!-- SLOT: activeNavItem -->
    <!-- Set the class tab-item--active on the desired tab (0=首页, 1=发现, 2=回顾, 3=我的). -->

    <!-- Bottom Tab Bar (4 tabs) -->
    <nav class="tab-bar">

      <!-- Tab 0: 首页 (Home) -->
      <button class="tab-item tab-item--active" aria-label="首页" data-dom-id="nav-home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="tab-item-label">首页</span>
      </button>

      <!-- Tab 1: 发现 (Discover) -->
      <button class="tab-item tab-item--inactive" aria-label="发现" data-dom-id="nav-discover">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="tab-item-label">发现</span>
      </button>

      <!-- Tab 2: 回顾 (Review / Calendar) -->
      <button class="tab-item tab-item--inactive" aria-label="回顾" data-dom-id="nav-review">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <path d="M8 14l2.5 2.5L16 11"/>
        </svg>
        <span class="tab-item-label">回顾</span>
      </button>

      <!-- Tab 3: 我的 (Profile) -->
      <button class="tab-item tab-item--inactive" aria-label="我的" data-dom-id="nav-profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M5 20a7 7 0 0114 0"/>
        </svg>
        <span class="tab-item-label">我的</span>
      </button>

    </nav>

  </div>
</body>
</html>
