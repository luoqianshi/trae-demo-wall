<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天想什么 - 登录</title>
    <style id="theme-vars">
:root {
  /* ── Brand Color (Fresh Lime Green) ── */
  --color-primary: #34C759;
  --color-primary-light: #5BD97A;
  --color-primary-dark: #28A745;
  --color-primary-bg: rgba(52, 199, 89, 0.08);
  --color-primary-bg-hover: rgba(52, 199, 89, 0.15);
  --color-primary-gradient: linear-gradient(135deg, #34C759, #30D158);
  --color-primary-gradient-soft: linear-gradient(135deg, rgba(52,199,89,0.08), rgba(48,209,88,0.06));

  /* ── Light Mode Surfaces (Clean White) ── */
  --color-bg-base: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-card: #FFFFFF;
  --color-bg-input: #F5F5F5;
  --color-bg-hover: #F0F0F0;
  --color-bg-overlay: rgba(0, 0, 0, 0.45);

  /* ── Text ── */
  --color-text-primary: #1D1D1F;
  --color-text-secondary: #8E8E93;
  --color-text-tertiary: #C7C7CC;
  --color-text-inverse: #FFFFFF;

  /* ── State Colors ── */
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #007AFF;

  /* ── Tag / Category Colors ── */
  --tag-hot: #FF3B30;
  --tag-philosophy: #AF52DE;
  --tag-career: #007AFF;
  --tag-social: #FF9500;
  --tag-tech: #34C759;
  --tag-art: #FF2D55;
  --tag-life: #FFCC00;
  --tag-health: #5AC8FA;

  /* ── Borders ── */
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-active: rgba(52, 199, 89, 0.5);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* ── Radius (iOS-style, restrained) ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* ── Shadows (subtle iOS-style) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
  --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow: 0 4px 16px rgba(52, 199, 89, 0.2);

  /* ── Typography ── */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Serif SC', 'Source Han Serif CN', Georgia, serif;

  /* ── Type Scale ── */
  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.8125rem;
  --text-md: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ── Layout ── */
  --page-padding: 16px;
  --bottom-safe-area: 34px;

  /* ── Brand Prefix ── */
  --brand-prefix: think;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="app-shell">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-bar-time">9:41</span>
      <div class="status-bar-icons">
        <!-- Signal -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-label="信号">
          <rect x="0" y="9" width="3" height="3" rx="0.5" fill="#1D1D1F"/>
          <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#1D1D1F"/>
          <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#1D1D1F"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#1D1D1F"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-label="WiFi">
          <path d="M8 10.5a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z" fill="#1D1D1F"/>
          <path d="M4.93 8.47a4.47 4.47 0 016.14 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M2.1 5.64a8.02 8.02 0 0111.8 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M0 3a10.8 10.8 0 0116 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <!-- Battery -->
        <svg width="27" height="12" viewBox="0 0 27 12" fill="none" aria-label="电池">
          <rect x="0.5" y="0.5" width="23" height="11" rx="2.5" stroke="#1D1D1F" stroke-width="1"/>
          <rect x="24.5" y="3.5" width="2" height="5" rx="1" fill="#1D1D1F" opacity="0.4"/>
          <rect x="2" y="2" width="20" height="8" rx="1.5" fill="#1D1D1F"/>
        </svg>
      </div>

      <!-- System Capsule -->
      <div class="sys-capsule w-[87px] h-8" style="display:flex;align-items:center;border-radius:9999px;background:rgba(0,0,0,0.06);position:absolute;right:16px;top:50%;transform:translateY(-50%)">
        <span style="flex:1;text-align:center;font-size:16px;color:rgba(0,0,0,0.5);letter-spacing:-2px" aria-label="更多">···</span>
        <span class="w-px" style="width:1px;height:16px;background:rgba(0,0,0,0.1);display:inline-block"></span>
        <span style="flex:1;text-align:center;font-size:16px;color:rgba(0,0,0,0.5)" aria-label="关闭">×</span>
      </div>
    </div>

    <!-- Page Content: Letter-paper style login -->
    <div class="page-content">
      <div class="letter-paper">

        <!-- Letter ruling lines (decorative) -->
        <div class="letter-lines" aria-hidden="true"></div>

        <!-- Brand Header (letterhead style) -->
        <div class="letter-header">
          <div class="letter-logo">?</div>
          <h1 class="letter-title">今天想什么</h1>
          <p class="letter-tagline">每天一个问题，锻炼你的思考肌肉</p>
        </div>

        <!-- Letter body: a subtle handwriting-style prompt -->
        <div class="letter-body">
          <p class="letter-prompt">给今天一个问号，<br>给自己一个答案。</p>
        </div>

        <!-- Bottom Login Area (minimal) -->
        <div class="letter-footer">
          <button class="btn-wechat" data-dom-id="cta-login-wechat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.046c.134 0 .24-.111.24-.247 0-.06-.024-.12-.04-.178l-.327-1.233a.492.492 0 01.177-.554C23.016 18.514 24 16.789 24 14.904c0-3.154-2.978-5.892-7.062-6.046zm-2.845 2.957c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm5.69 0c.535 0 .969.44.969.982a.976.976 0 01-.97.983.976.976 0 01-.968-.983c0-.542.434-.982.969-.982z"/>
            </svg>
            微信登录
          </button>
          <button class="btn-phone">手机号登录</button>
          <p class="agreement-text">登录即同意《用户协议》和《隐私政策》</p>
        </div>

      </div>
    </div>

    <!-- Tab bar hidden for login page -->

  </div>

    <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Noto Sans SC', sans-serif;
      background: #FFFFFF;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Shell Layout ── */
    .app-shell {
      position: relative;
      width: 375px;
      min-height: 812px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #FFFFFF;
      z-index: 100;
      flex-shrink: 0;
    }

    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: #1D1D1F;
      letter-spacing: 0.02em;
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar-icons svg {
      display: block;
    }

    /* ── Page Content ── */
    .page-content {
      flex: 1;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════════
       Letter-Paper Style
       ══════════════════════════════════ */
    .letter-paper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Decorative ruling lines ── */
    .letter-lines {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        rgba(52, 199, 89, 0.05) 31px,
        rgba(52, 199, 89, 0.05) 32px
      );
      background-position: 0 0;
      pointer-events: none;
      z-index: 0;
      /* Fade in lines below header, fade out above footer */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 75%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 75%, transparent 100%);
    }

    /* ── Left margin line (like real letter paper) ── */
    .letter-lines::after {
      content: '';
      position: absolute;
      left: 52px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 59, 48, 0.12);
    }

    /* ── Header: letterhead area ── */
    .letter-header {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 64px;
      padding-bottom: 0;
    }

    .letter-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #34C759;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(52, 199, 89, 0.25);
    }

    .letter-title {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 26px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .letter-tagline {
      font-size: 14px;
      color: #8E8E93;
      letter-spacing: 0.02em;
    }

    /* ── Body: letter content area ── */
    .letter-body {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 36px 0 68px;
    }

    .letter-prompt {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 17px;
      line-height: 32px;
      color: #3A3A3C;
      letter-spacing: 0.08em;
    }

    /* ── Footer: minimal login ── */
    .letter-footer {
      position: relative;
      z-index: 1;
      padding: 0 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-wechat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #34C759;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
      outline: none;
    }

    .btn-wechat:active {
      opacity: 0.85;
    }

    .btn-wechat svg {
      flex-shrink: 0;
    }

    .btn-phone {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      border: 1px solid rgba(52, 199, 89, 0.3);
      border-radius: 12px;
      background: transparent;
      color: #34C759;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
      outline: none;
    }

    .btn-phone:active {
      opacity: 0.7;
    }

    .agreement-text {
      font-size: 11px;
      color: #C7C7CC;
      text-align: center;
      line-height: 1.5;
      margin-top: 4px;
    }
    </style>
</body>
</html>
