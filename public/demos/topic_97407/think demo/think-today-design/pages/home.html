    <style id="theme-vars">
:root {
  /* ── Brand Color (Fresh Lime Green) ── */
  --color-primary: #34C759;
  --color-primary-light: #5BD97A;
  --color-primary-dark: #28A745;
  --color-primary-bg: rgba(52, 199, 89, 0.08);
  --color-primary-bg-hover: rgba(52, 199, 89, 0.15);
  --color-primary-gradient: linear-gradient(135deg, #34C759, #30D158);
  --color-primary-gradient-soft: linear-gradient(135deg, rgba(52,199,89,0.08), rgba(48,209,88,0.06));

  /* ── Light Mode Surfaces (Clean White) ── */
  --color-bg-base: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-card: #FFFFFF;
  --color-bg-input: #F5F5F5;
  --color-bg-hover: #F0F0F0;
  --color-bg-overlay: rgba(0, 0, 0, 0.45);

  /* ── Text ── */
  --color-text-primary: #1D1D1F;
  --color-text-secondary: #8E8E93;
  --color-text-tertiary: #C7C7CC;
  --color-text-inverse: #FFFFFF;

  /* ── State Colors ── */
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #007AFF;

  /* ── Tag / Category Colors ── */
  --tag-hot: #FF3B30;
  --tag-philosophy: #AF52DE;
  --tag-career: #007AFF;
  --tag-social: #FF9500;
  --tag-tech: #34C759;
  --tag-art: #FF2D55;
  --tag-life: #FFCC00;
  --tag-health: #5AC8FA;

  /* ── Borders ── */
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-active: rgba(52, 199, 89, 0.5);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* ── Radius (iOS-style, restrained) ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* ── Shadows (subtle iOS-style) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
  --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow: 0 4px 16px rgba(52, 199, 89, 0.2);

  /* ── Typography ── */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Serif SC', 'Source Han Serif CN', Georgia, serif;

  /* ── Type Scale ── */
  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.8125rem;
  --text-md: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ── Layout ── */
  --page-padding: 16px;
  --bottom-safe-area: 34px;

  /* ── Brand Prefix ── */
  --brand-prefix: think;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

        justify-content: center;

  <div class="app-shell">

    <!-- Status Bar -->

      <span class="status-bar-time">9:41</span>
      <div class="status-bar-icons">

        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-label="信号">
          <rect x="0" y="9" width="3" height="3" rx="0.5" fill="#1D1D1F"/>

      <!-- System Capsule -->

        <span aria-label="更多">···</span>
        <span class="capsule-divider"></span>
        <span aria-label="关闭">&times;</span>
      </div>
    </div>

    <!-- PAGE CONTENT: Home -->
    <div class="page-content">

      <!-- A) Header -->
      <div class="home-header">
        <div class="home-header__left">
          <span class="home-header__greeting">下午好</span>
          <div class="home-header__avatar">明</div>
        </div>
      </div>

      <!-- B) Brand -->
      <div class="home-brand">
        <div class="home-brand__title">今天想什么</div>
        <div class="home-brand__stat">
          <span class="home-brand__live-dot"></span>
          1,234 人正在思考
        </div>
      </div>

      <!-- C) Today's Question Card -->
      <div class="home-question-card">
        <div class="question-card">
          <span class="question-card__badge">时事热点</span>
          <div class="question-card__text">如果你可以给十年前的自己写一封信，你会说什么？</div>
          <div class="question-card__footer">
            <div class="question-card__divider"></div>
            <button class="question-card__refresh" aria-label="换一换">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
              </svg>
              换一换
            </button>
          </div>
        </div>
      </div>

      <!-- D) CTA -->
      <div class="home-cta">
        <button class="home-cta__btn" data-dom-id="cta-start-writing">开始写下你的想法</button>
      </div>

      <!-- E) Yesterday Section -->
      <div class="home-yesterday">
        <div class="home-yesterday__title">
          昨日回顾
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
        <div class="home-yesterday__card">
          <span class="home-yesterday__question">你认为"成功"的定义是什么？</span>
          <a class="home-yesterday__link" href="javascript:void(0)">查看</a>
        </div>
      </div>

      <!-- F) Ranking Section -->
      <div class="home-ranking">
        <div class="home-ranking__header">
          <span class="home-ranking__title">全站排行</span>
          <a class="home-ranking__view-all" href="javascript:void(0)">查看全部</a>
        </div>
        <div class="home-ranking__list">
          <!-- 1st place -->
          <div class="rank-item rank-item--first">
            <div class="rank-item__medal rank-item__medal--gold">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 6H22l-5 4 1.5 6L12 14l-6.5 4L7 12 2 8h7.5z"/></svg>
            </div>
            <div class="rank-item__avatar" style="background:#34C759">李</div>
            <div class="rank-item__info">
              <span class="rank-item__name">李思考</span>
              <span class="rank-item__streak">连续32天</span>
            </div>
            <div class="rank-item__badge">1</div>
          </div>
          <!-- 2nd place -->
          <div class="rank-item rank-item--other">
            <div class="rank-item__medal rank-item__medal--silver">2</div>
            <div class="rank-item__avatar" style="background:#E5E5EA;color:#8E8E93">王</div>
            <div class="rank-item__info">
              <span class="rank-item__name">王明心</span>
              <span class="rank-item__streak">连续28天</span>
            </div>
          </div>
          <!-- 3rd place -->
          <div class="rank-item rank-item--other">
            <div class="rank-item__medal rank-item__medal--bronze">3</div>
            <div class="rank-item__avatar" style="background:#E5E5EA;color:#8E8E93">张</div>
            <div class="rank-item__info">
              <span class="rank-item__name">张小思</span>
              <span class="rank-item__streak">连续21天</span>
            </div>
          </div>
          <!-- My ranking -->
          <div class="rank-item rank-item--me">
            <div class="rank-item__medal rank-item__medal--me">12</div>
            <div class="rank-item__avatar rank-item__avatar--me">明</div>
            <div class="rank-item__info">
              <span class="rank-item__name rank-item__name--me">我</span>
              <span class="rank-item__streak">连续7天</span>
            </div>
            <span class="rank-item__arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
          </div>
        </div>
      </div>

      <!-- G) Stats Strip -->
      <div class="home-stats">
        <span class="home-stats__pill">连续7天</span>
        <span class="home-stats__pill">累计23篇</span>
        <span class="home-stats__pill">本月15篇</span>
      </div>

      <!-- H) Bottom spacing -->
      <div class="home-bottom-spacer"></div>

    </div>

    <!-- Bottom Tab Bar (4 tabs) -->
    <nav class="tab-bar">

      <!-- Tab 0: 首页 (Home) — ACTIVE -->
      <button class="tab-item tab-item--active" aria-label="首页" data-dom-id="nav-home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="tab-item-label">首页</span>
      </button>

      <!-- Tab 1: 发现 (Discover) -->

          <circle cx="11" cy="11" r="8"/>

      <button class="tab-item tab-item--inactive" aria-label="我的" data-dom-id="nav-profile">

  </div>

    <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: #FFFFFF;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Shell Layout ── */
    .app-shell {
      position: relative;
      width: 375px;
      min-height: 812px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: transparent;
      z-index: 100;
      flex-shrink: 0;
    }

    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: #1D1D1F;
      letter-spacing: 0.02em;
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar-icons svg {
      display: block;
    }

    /* ── System Capsule ── */
    .sys-capsule {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 87px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 9999px;
      padding: 3px 8px;
      z-index: 101;
    }

    .sys-capsule span {
      font-size: 12px;
      font-weight: 500;
      color: #1D1D1F;
      line-height: 1;
    }

    .sys-capsule .capsule-divider {
      width: 1px;
      height: 14px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    /* ── Page Content Area ── */
    .page-content {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Bottom Tab Bar ── */
    .tab-bar {
      position: relative;
      width: 100%;
      height: 83px;
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      background: #FFFFFF;
      box-shadow: 0 -0.5px 0 rgba(0, 0, 0, 0.04);
      padding-top: 8px;
      padding-bottom: 34px;
      flex-shrink: 0;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      width: 20%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-decoration: none;
      background: none;
      border: none;
      outline: none;
      position: relative;
    }

    .tab-item svg {
      display: block;
      transition: color 0.2s ease;
    }

    .tab-item-label {
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      transition: color 0.2s ease;
    }

    /* Active tab dot indicator */
    .tab-item--active .tab-dot {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #34C759;
      margin-top: 2px;
    }

    .tab-item--inactive .tab-dot {
      display: none;
    }

    /* ── Tab States ── */
    .tab-item--active svg {
      color: #34C759;
    }

    .tab-item--active .tab-item-label {
      color: #34C759;
    }

    .tab-item--inactive svg {
      color: #C7C7CC;
    }

    .tab-item--inactive .tab-item-label {
      color: #C7C7CC;
    }

    /* ══════════════════════════════════════
       HOME PAGE — iOS Green Clean
       ══════════════════════════════════════ */

    /* A) Top header */
    .home-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 16px;
    }

    .home-header__left {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
    }

    .home-header__greeting {
      font-size: 14px;
      color: #8E8E93;
      line-height: 1;
    }

    .home-header__avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F2F2F7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: #8E8E93;
      flex-shrink: 0;
    }

    /* B) Brand area */
    .home-brand {
      padding: 4px 16px 16px;
    }

    .home-brand__title {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 700;
      color: #1D1D1F;
      line-height: 1.3;
    }

    .home-brand__stat {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: #8E8E93;
    }

    .home-brand__live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34C759;
      flex-shrink: 0;
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* C) Today's Question Card */
    .home-question-card {
      padding: 0 16px;
    }

    .question-card {
      background: #F5F5F5;
      border-radius: 14px;
      padding: 24px 20px;
    }

    .question-card__badge {
      display: inline-block;
      font-size: 11px;
      color: #FF3B30;
      background: rgba(255, 59, 48, 0.08);
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 500;
      line-height: 1.2;
    }

    .question-card__text {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 18px;
      color: #1D1D1F;
      line-height: 1.6;
      margin-top: 16px;
    }

    .question-card__divider {
      width: 40px;
      height: 0.5px;
      background: #E5E5EA;
    }

    .question-card__footer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .question-card__refresh {
      display: flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: transparent;
      color: #C7C7CC;
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 4px 0;
      margin-left: auto;
      outline: none;
      transition: color 0.2s ease;
    }

    .question-card__refresh:active {
      color: #8E8E93;
    }

    .question-card__refresh svg {
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* D) CTA Area */
    .home-cta {
      padding: 20px 16px;
    }

    .home-cta__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: #34C759;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s ease;
    }

    .home-cta__btn:active {
      opacity: 0.85;
    }

    /* E) Yesterday's Section */
    .home-yesterday {
      padding: 0 16px 20px;
    }

    .home-yesterday__title {
      font-size: 15px;
      font-weight: 600;
      color: #1D1D1F;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
