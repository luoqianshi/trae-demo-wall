<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天想什么 - 完成</title>
    <style id="theme-vars">
:root {
  /* ── Brand Color (Fresh Lime Green) ── */
  --color-primary: #34C759;
  --color-primary-light: #5BD97A;
  --color-primary-dark: #28A745;
  --color-primary-bg: rgba(52, 199, 89, 0.08);
  --color-primary-bg-hover: rgba(52, 199, 89, 0.15);
  --color-primary-gradient: linear-gradient(135deg, #34C759, #30D158);
  --color-primary-gradient-soft: linear-gradient(135deg, rgba(52,199,89,0.08), rgba(48,209,88,0.06));

  /* ── Light Mode Surfaces (Clean White) ── */
  --color-bg-base: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-card: #FFFFFF;
  --color-bg-input: #F5F5F5;
  --color-bg-hover: #F0F0F0;
  --color-bg-overlay: rgba(0, 0, 0, 0.45);

  /* ── Text ── */
  --color-text-primary: #1D1D1F;
  --color-text-secondary: #8E8E93;
  --color-text-tertiary: #C7C7CC;
  --color-text-inverse: #FFFFFF;

  /* ── State Colors ── */
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #007AFF;

  /* ── Tag / Category Colors ── */
  --tag-hot: #FF3B30;
  --tag-philosophy: #AF52DE;
  --tag-career: #007AFF;
  --tag-social: #FF9500;
  --tag-tech: #34C759;
  --tag-art: #FF2D55;
  --tag-life: #FFCC00;
  --tag-health: #5AC8FA;

  /* ── Borders ── */
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-active: rgba(52, 199, 89, 0.5);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* ── Radius (iOS-style, restrained) ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* ── Shadows (subtle iOS-style) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
  --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow: 0 4px 16px rgba(52, 199, 89, 0.2);

  /* ── Typography ── */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-serif: 'Noto Serif SC', 'Source Han Serif CN', Georgia, serif;

  /* ── Type Scale ── */
  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.8125rem;
  --text-md: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ── Layout ── */
  --page-padding: 16px;
  --bottom-safe-area: 34px;

  /* ── Brand Prefix ── */
  --brand-prefix: think;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="app-shell">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-bar-time">9:41</span>
      <div class="status-bar-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-label="信号">
          <rect x="0" y="9" width="3" height="3" rx="0.5" fill="#1D1D1F"/>
          <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#1D1D1F"/>
          <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#1D1D1F"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#1D1D1F"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-label="WiFi">
          <path d="M8 10.5a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z" fill="#1D1D1F"/>
          <path d="M4.93 8.47a4.47 4.47 0 016.14 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M2.1 5.64a8.02 8.02 0 0111.8 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M0 3a10.8 10.8 0 0116 0" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <svg width="27" height="12" viewBox="0 0 27 12" fill="none" aria-label="电池">
          <rect x="0.5" y="0.5" width="23" height="11" rx="2.5" stroke="#1D1D1F" stroke-width="1"/>
          <rect x="24.5" y="3.5" width="2" height="5" rx="1" fill="#1D1D1F" opacity="0.4"/>
          <rect x="2" y="2" width="20" height="8" rx="1.5" fill="#1D1D1F"/>
        </svg>
      </div>

      <!-- System Capsule -->
      <div class="sys-capsule" aria-hidden="true">
        <span aria-label="更多">···</span>
        <span class="capsule-divider"></span>
        <span aria-label="关闭">&times;</span>
      </div>
    </div>

    <!-- Page Nav -->
    <div class="page-nav">
      <button class="page-nav-back" data-dom-id="back-to-writing">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="page-nav-title">完成</span>
      <span class="page-nav-right"></span>
    </div>

    <!-- Page Content -->
    <div class="page-content">

      <!-- A) Success Celebration -->
      <div class="celebration-area">
        <div class="celebration-emoji">&#x1F389; 完成！</div>
        <div class="celebration-sub">你今天的思考已记录</div>
      </div>

      <!-- B) Preview Card -->
      <div class="preview-card-wrapper">
        <div class="preview-card">
          <div class="preview-card-meta">
            <span class="preview-card-date">2024年7月15日</span>
            <span class="preview-card-tag">时事热点</span>
          </div>
          <div class="preview-card-question">如果你可以给十年前的自己写一封信，你会说什么？</div>
          <div class="preview-card-divider"></div>
          <div class="preview-card-answer">给十年前的自己... 这是个很有意思的问题。十年前的我还在上大学，那时候对未来充满期待但又迷茫。如果真能写信回去，我大概会告诉自己：别害怕那些看似巨大的失败...</div>
          <div class="preview-card-footer">
            <div class="preview-card-avatar">
              <span class="preview-card-avatar-text">明</span>
            </div>
            <span class="preview-card-footer-text">小明 · 思考了 12 分钟</span>
          </div>
        </div>
      </div>

      <!-- C) Generate Share Button -->
      <!-- D) Back to Home -->
      <div class="preview-actions">
        <button class="btn-primary" data-dom-id="cta-generate-share">生成分享图</button>
        <button class="btn-text" data-dom-id="back-to-home">返回首页</button>
      </div>

    </div>

    <!-- No bottom nav on this page -->

  </div>

    <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
      background: var(--color-bg-base);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Shell Layout ── */
    .app-shell {
      position: relative;
      width: 375px;
      min-height: 812px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--color-bg-base);
    }

    /* ── Status Bar ── */
    .status-bar {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: transparent;
      z-index: 100;
      flex-shrink: 0;
    }

    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      letter-spacing: 0.02em;
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar-icons svg {
      display: block;
    }

    /* ── System Capsule ── */
    .sys-capsule {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 87px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 9999px;
      padding: 3px 8px;
      z-index: 101;
    }

    .sys-capsule span {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-primary);
      line-height: 1;
    }

    .sys-capsule .capsule-divider {
      width: 1px;
      height: 14px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    /* ── Page Content Area ── */
    .page-content {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Page Nav ── */
    .page-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 48px;
      flex-shrink: 0;
    }

    .page-nav-back {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .page-nav-back svg {
      display: block;
      color: var(--color-primary);
    }

    .page-nav-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      text-align: center;
      flex: 1;
    }

    .page-nav-right {
      width: 44px;
      flex-shrink: 0;
    }

    /* ── Success Celebration ── */
    .celebration-area {
      padding: 32px 16px 24px;
      text-align: center;
    }

    .celebration-emoji {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }

    .celebration-sub {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* ── Preview Card ── */
    .preview-card-wrapper {
      padding: 0 16px;
    }

    .preview-card {
      background: var(--color-bg-input);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .preview-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .preview-card-date {
      font-size: 12px;
      color: var(--color-text-tertiary);
    }

    .preview-card-tag {
      display: inline-block;
      background: rgba(52, 199, 89, 0.08);
      color: var(--color-primary);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .preview-card-question {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 16px;
      color: var(--color-text-primary);
      line-height: 1.6;
      font-style: italic;
      margin-bottom: 16px;
    }

    .preview-card-divider {
      width: 30px;
      height: 1px;
      background: var(--color-text-tertiary);
      margin-bottom: 16px;
    }

    .preview-card-answer {
      font-size: 14px;
      color: #3A3A3C;
      line-height: 1.8;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-card-answer::after {
      content: '...';
    }

    .preview-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-card-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-card-avatar-text {
      font-size: 10px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1;
    }

    .preview-card-footer-text {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    /* ── Actions ── */
    .preview-actions {
      padding: 32px 16px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      height: 48px;
      background: var(--color-primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-text {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-top: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</body>
</html>
