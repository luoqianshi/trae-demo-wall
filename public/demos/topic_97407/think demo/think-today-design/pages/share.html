  --text-sm: 0.75rem;

  --text-xl: 1.25rem;

  /* ── Spacing ── */

  <script>
  // ── Content Data ──
  const DATA = {
    question: "如果你可以给十年前的自己写一封信，你会说什么？",
    category: "时事热点",
    answer: "给十年前的自己... 十年前的我还在上大学，对未来充满期待又迷茫。如果真能写信回去，大概会告诉自己：别害怕看似巨大的失败，它们最终都会变成你最珍贵的故事。还有就是，多陪陪身边的人，时间比你想象的走得更快。",
    author: "小明",
    date: "2026年7月9日"
  };

  let currentTemplate = 'postcard';

  // ── Template Renderers ──
  function tplPostcard() {
    return `
    <div style="width:100%;height:100%;display:flex;background:#FFF8EE;font-family:Georgia,'Noto Serif SC',serif;position:relative;overflow:hidden;">
      <!-- Left: Scenic Illustration -->
      <div style="width:38%;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,#FF8C42 0%,#E85D75 40%,#8B3A8F 70%,#5C2D82 100%);"></div>
        <!-- Abstract sun -->
        <div style="position:absolute;top:18%;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#FFE066 30%,rgba(255,200,60,0.3) 70%);"></div>
        <!-- Abstract mountains -->
        <div style="position:absolute;bottom:0;left:0;right:0;">
          <div style="position:absolute;bottom:0;left:-5px;width:50px;height:80px;background:rgba(90,40,80,0.6);border-radius:50% 60% 0 0;transform:rotate(-5deg);"></div>
          <div style="position:absolute;bottom:0;right:-8px;width:45px;height:60px;background:rgba(70,30,70,0.5);border-radius:60% 50% 0 0;transform:rotate(8deg);"></div>
        </div>
        <!-- Water line -->
        <div style="position:absolute;bottom:20%;left:0;right:0;height:1px;background:rgba(255,255,255,0.25);"></div>
        <div style="position:absolute;bottom:16%;left:10%;right:10%;height:1px;background:rgba(255,255,255,0.12);"></div>
      </div>
      <!-- Right: Content -->
      <div style="width:62%;padding:20px 16px 16px;display:flex;flex-direction:column;position:relative;">
        <!-- Postage stamp -->
        <div style="position:absolute;top:10px;right:8px;width:36px;height:42px;border:2px dashed #C4A882;border-radius:3px;transform:rotate(6deg);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);">
          <span style="font-size:16px;color:#5C3D1E;">?</span>
        </div>
        <div style="font-size:9px;color:#A0764A;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;font-family:-apple-system,sans-serif;">今天想什么</div>
        <div style="font-size:14px;color:#5C3D1E;font-style:italic;line-height:1.5;margin-bottom:10px;font-weight:500;">${DATA.question}</div>
        <div style="width:40px;height:1px;border-top:1px dashed #C4A882;margin-bottom:10px;"></div>
        <div style="font-size:10px;color:#7A6B5D;line-height:1.7;flex:1;font-family:-apple-system,'Noto Sans SC',sans-serif;">${DATA.answer}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(196,168,130,0.3);">
          <span style="font-size:8px;color:#A0764A;font-family:-apple-system,sans-serif;">${DATA.date}</span>
          <span style="font-size:8px;color:#A0764A;font-family:-apple-system,sans-serif;">${DATA.author}</span>
        </div>
      </div>
    </div>`;
  }

  function tplLetter() {
    return `
    <div style="width:100%;height:100%;background:#F5F0E8;font-family:Georgia,'Noto Serif SC',serif;position:relative;overflow:hidden;">
      <!-- Red margin line -->
      <div style="position:absolute;left:32px;top:0;bottom:0;width:2px;background:rgba(200,80,80,0.35);"></div>
      <!-- Letterhead -->
      <div style="text-align:center;padding:16px 12px 10px;font-size:10px;color:#7A6B5D;letter-spacing:4px;font-family:-apple-system,sans-serif;">── 今天想什么 ──</div>
      <!-- Ruled lines and content -->
      <div style="padding:0 16px 0 40px;position:relative;">
        <div style="font-size:12px;color:#4A3728;margin-bottom:14px;font-style:italic;">亲爱的自己：</div>
        <!-- Question (large serif) -->
        <div style="font-size:14px;color:#3A2A18;line-height:1.7;margin-bottom:4px;font-weight:500;padding-right:8px;">${DATA.question}</div>
        <!-- Faint ruled lines behind text -->
        <div style="position:absolute;top:68px;left:40px;right:16px;bottom:60px;background:repeating-linear-gradient(transparent,transparent 19px,rgba(160,140,110,0.15) 19px,rgba(160,140,110,0.15) 20px);pointer-events:none;"></div>
        <div style="position:relative;">
          <div style="font-size:10px;color:#5C4A38;line-height:20px;padding-right:8px;">${DATA.answer}</div>
        </div>
      </div>
      <!-- Wax seal -->
      <div style="position:absolute;bottom:12px;right:20px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#28A745,#34C759);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(52,199,89,0.3);">
        <span style="font-size:16px;color:#fff;font-weight:700;font-family:Georgia,serif;">?</span>
      </div>
      <!-- Date -->
      <div style="position:absolute;bottom:16px;left:44px;font-size:8px;color:#A09080;font-family:-apple-system,sans-serif;">${DATA.date} · ${DATA.author}</div>
    </div>`;
  }

  function tplBottle() {
    return `
    <div style="width:100%;height:100%;background:linear-gradient(180deg,#1A3A5C 0%,#2D5F8A 50%,#3A7AB8 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;">
      <!-- Stars -->
      <div style="position:absolute;top:8%;left:15%;width:3px;height:3px;background:rgba(255,255,255,0.4);border-radius:50%;"></div>
      <div style="position:absolute;top:12%;right:20%;width:2px;height:2px;background:rgba(255,255,255,0.3);border-radius:50%;"></div>
      <div style="position:absolute;top:6%;right:35%;width:2px;height:2px;background:rgba(255,255,255,0.25);border-radius:50%;"></div>
      <!-- SVG wave top -->
      <svg style="position:absolute;top:0;left:0;width:100%;height:30px;opacity:0.3;" viewBox="0 0 300 30" preserveAspectRatio="none">
        <path d="M0 15 Q37.5 0 75 15 T150 15 T225 15 T300 15 V30 H0 Z" fill="rgba(255,255,255,0.15)"/>
      </svg>
      <!-- Bottle shape -->
      <div style="margin-top:28px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:85%;">
        <!-- Bottle neck -->
        <div style="width:40px;height:20px;background:rgba(255,255,255,0.12);border-radius:8px 8px 0 0;border:1px solid rgba(255,255,255,0.2);border-bottom:none;"></div>
        <!-- Bottle body -->
        <div style="width:100%;flex:1;max-height:380px;background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:4px 4px 40px 40px;padding:20px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden;">
          <!-- Glass highlight -->

  // ── Switch Template ──
  function switchTemplate(name) {
    if (!templates[name]) return;
    currentTemplate = name;
    const container = document.getElementById('previewContainer');
    // Fade out
    container.style.opacity = '0';
    container.style.transform = 'scale(0.97)';
    setTimeout(() => {
      container.innerHTML = templates[name]();
      // Fade in
      requestAnimationFrame(() => {
        container.style.opacity = '1';
        container.style.transform = 'scale(1)';
      });
    }, 180);

    // Update thumbnail active states
    document.querySelectorAll('.template-item').forEach(item => {
      const thumb = item.querySelector('.template-thumb');
      const label = item.querySelector('.template-label');
      if (item.getAttribute('data-tpl') === name) {
        thumb.classList.add('tpl-thumb--active');
        label.classList.add('tpl-label-active');
      } else {
        thumb.classList.remove('tpl-thumb--active');
        label.classList.remove('tpl-label-active');
      }
    });
  }

  // ── Init ──
  document.addEventListener('DOMContentLoaded', () => {
    switchTemplate('postcard');
  });
