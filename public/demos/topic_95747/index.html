<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>灵眸 LingMou — AI 生活感知助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:#fdf6ee;color:#1e293b;
  --font-size-scale:1;
  transition:background 0.6s ease,color 0.4s ease;
}
body.font-lg{--font-size-scale:1.18}
body.font-clear .scene-title,
body.font-clear .display-font{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif!important}
body.font-playful .display-font{font-family:'ZCOOL KuaiLe','PingFang SC',sans-serif!important}

/* ========== 暗色模式 ========== */
body.dark{
  background:#0f172a;color:#e2e8f0;
}
body.dark .topbar,
body.dark .font-panel,
body.dark .settings-panel{
  background:rgba(15,23,42,0.82)!important;
  border-color:rgba(255,255,255,0.08)!important;
}
body.dark .tab{color:#fde68a;opacity:0.6}
body.dark .tab:hover{background:rgba(251,191,36,0.1)}
body.dark .phone-mockup{
  background:rgba(30,41,59,0.7);
  border-color:rgba(255,255,255,0.12);
  box-shadow:0 30px 80px rgba(0,0,0,0.4),inset 0 0 0 1px rgba(255,255,255,0.08);
}
body.dark .phone-statusbar{color:rgba(255,255,255,0.4)}
body.dark .phone-app-name{color:#f1f5f9}
body.dark .scene-card{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.08)}
body.dark .scene-card-name{color:#e2e8f0}
body.dark .scan-area{background:rgba(30,41,59,0.4);border-color:rgba(255,255,255,0.12)}
body.dark .result-card,
body.dark .social-card{background:rgba(30,41,59,0.85)}
body.dark .result-name{color:#f1f5f9}
body.dark .style-btn{background:rgba(255,255,255,0.05);color:#94a3b8;border-color:rgba(255,255,255,0.1)}
body.dark .style-btn:hover{background:rgba(255,255,255,0.1)}
body.dark .font-panel-label,
body.dark .font-btn,
body.dark .size-btn{color:rgba(255,255,255,0.5)}
body.dark .font-btn.active,
body.dark .size-btn.active{background:rgba(255,255,255,0.12);color:#fde68a}
body.dark .font-divider{background:rgba(255,255,255,0.12)}
body.dark .home-hero h1{color:#fde68a}
body.dark .home-hero p{color:#fbbf24;opacity:0.8}
body.dark .home-daily{
  background:linear-gradient(135deg,rgba(30,41,59,0.85),rgba(245,158,11,0.08));
  border-color:rgba(251,191,36,0.25);
}
body.dark .home-daily-tag{background:rgba(251,191,36,0.18);color:#fbbf24}
body.dark .home-daily-date{color:#fbbf24;opacity:0.7}
body.dark .home-daily-scene{color:#fde68a}
body.dark .home-daily-text{color:#f1f5f9}
body.dark .home-daily-btn{background:rgba(255,255,255,0.05);color:#fbbf24;border-color:rgba(251,191,36,0.25)}
body.dark .home-daily-btn:hover{background:rgba(251,191,36,0.12)}
body.dark .home-feature-card{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.08)}
body.dark .home-feature-card h3{color:#f1f5f9}
body.dark .home-feature-card p{color:#cbd5e1}
body.dark .stats-card{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.08)}
body.dark .stats-num{color:#fde68a}
body.dark .stats-label{color:#94a3b8}
body.dark .achievement{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.08)}
body.dark .achievement.unlocked{background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(16,185,129,0.1))}
body.dark .achievement-name{color:#f1f5f9}
body.dark .achievement-desc{color:#94a3b8}
body.dark .tier-header{color:#7dd3fc}
body.dark .tier-progress{background:rgba(255,255,255,0.1)}
body.dark .outfit-preview{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.08)}
body.dark .outfit-title{color:#f1f5f9}
body.dark .outfit-sub{color:#94a3b8}
body.dark .closet-item{background:rgba(30,41,59,0.5);border-color:rgba(255,255,255,0.1)}
body.dark .closet-item.unlocked{border-color:rgba(245,158,11,0.4)}
body.dark .closet-item.equipped{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(251,191,36,0.08))}
body.dark .closet-preview{background:rgba(255,255,255,0.08)}
body.dark .closet-name{color:#e2e8f0}
body.dark .closet-label{color:#94a3b8}
body.dark .closet-lock{color:#64748b}
body.dark .badge-showcase-item{background:rgba(30,41,59,0.5);border-color:rgba(255,255,255,0.1)}
body.dark .badge-showcase-item.unlocked{border-color:rgba(245,158,11,0.4);background:rgba(30,41,59,0.7)}
body.dark .badge-showcase-item.equipped{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(251,191,36,0.08))}
body.dark .badge-showcase-name{color:#f1f5f9}
body.dark .badge-showcase-desc{color:#94a3b8}
body.dark .settings-panel-label{color:#94a3b8}
body.dark .settings-row{border-color:rgba(255,255,255,0.08)}
body.dark .lab-input{background:rgba(30,41,59,0.7);border-color:rgba(255,255,255,0.12);color:#e2e8f0}
body.dark .lab-input:focus{border-color:#f59e0b}
body.dark .lab-input::placeholder{color:#64748b}

/* ========== 顶部导航 ========== */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(0,0,0,0.06);
  padding:0 20px;
}
.topbar-inner{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:60px;gap:16px;
}
.brand{
  display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer;
  padding:6px 14px 6px 6px;border-radius:18px;
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  box-shadow:0 4px 14px rgba(245,158,11,0.32);
  transition:transform 0.25s,box-shadow 0.25s;
}
.brand:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,158,11,0.42)}
.brand:active{transform:translateY(0)}
.brand-icon{
  width:30px;height:30px;border-radius:12px;
  background:rgba(255,255,255,0.28);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;position:relative;
}
/* 成就徽章角标：装备后显示在 brand-icon 右上角 */
.brand-badge{
  position:absolute;top:-7px;right:-7px;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#fff;
  border:1.5px solid #fff;cursor:pointer;
  animation:badgePop 0.45s cubic-bezier(0.34,1.56,0.64,1);
  z-index:5;
}
@keyframes badgePop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.brand-badge:hover{transform:scale(1.15)}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:14px;font-weight:800;color:#fff;letter-spacing:0.5px}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.85);font-weight:600}

.tabs{
  display:flex;gap:4px;flex:1;justify-content:center;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:20px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  background:transparent;color:#78350f;opacity:0.6;
  transition:all 0.25s;white-space:nowrap;
  font-family:inherit;
}
.tab:hover{opacity:0.9;background:rgba(245,158,11,0.08)}
.tab.active{
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  color:#fff;opacity:1;
  box-shadow:0 4px 14px rgba(245,158,11,0.35);
}
.tab公益{background:linear-gradient(135deg,#10b981,#34d399);color:#fff;opacity:1;box-shadow:0 4px 14px rgba(16,185,129,0.35)}
.tab公益.active{box-shadow:0 4px 14px rgba(16,185,129,0.5)}
.tab.lab{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;opacity:1;box-shadow:0 4px 14px rgba(139,92,246,0.35)}
.tab.lab.active{box-shadow:0 4px 14px rgba(139,92,246,0.5)}

.top-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:none;
  background:transparent;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;
}
.icon-btn:hover{background:rgba(0,0,0,0.06)}
.icon-btn.active{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(251,191,36,0.12));color:#b45309}
body.dark .icon-btn.active{background:rgba(251,191,36,0.18);color:#fde68a}
@keyframes musicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.icon-btn.active{animation:musicPulse 1.6s ease-in-out infinite}

/* ========== 字体面板 ========== */
.font-panel{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px;border:1px solid rgba(255,255,255,0.9);
  box-shadow:0 6px 24px rgba(0,0,0,0.08);
}
.font-panel-label{font-size:11px;color:rgba(0,0,0,0.45);font-weight:700;letter-spacing:0.5px}
.font-btn{
  padding:5px 11px;border-radius:14px;border:none;
  font-size:11px;font-weight:600;cursor:pointer;
  background:transparent;color:rgba(0,0,0,0.5);
  transition:all 0.25s;font-family:inherit;
}
.font-btn:hover{background:rgba(0,0,0,0.06);color:rgba(0,0,0,0.7)}
.font-btn.active{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.85)}
.font-divider{width:1px;height:16px;background:rgba(0,0,0,0.12)}
.size-btn{
  padding:4px 10px;border-radius:12px;border:none;
  font-size:12px;font-weight:700;cursor:pointer;
  background:transparent;color:rgba(0,0,0,0.45);
  transition:all 0.25s;min-width:30px;font-family:inherit;
}
.size-btn:hover{background:rgba(0,0,0,0.06)}
.size-btn.active{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.85)}

/* ========== 设置面板 ========== */
.settings-panel{
  position:fixed;top:60px;right:0;bottom:0;width:320px;z-index:250;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-left:1px solid rgba(0,0,0,0.06);
  padding:24px;overflow-y:auto;
  transform:translateX(100%);transition:transform 0.3s ease;
  box-shadow:-8px 0 32px rgba(0,0,0,0.08);
}
.settings-panel.open{transform:translateX(0)}
.settings-panel-title{
  font-size:18px;font-weight:800;color:#1e293b;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;
}
.settings-close{
  width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;
  background:rgba(0,0,0,0.05);font-size:14px;color:#64748b;
}
.settings-panel-label{font-size:11px;font-weight:700;letter-spacing:1px;color:#94a3b8;text-transform:uppercase;margin:18px 0 8px}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.06);
}
.settings-row-label{font-size:14px;font-weight:600;color:#1e293b}
.settings-row-desc{font-size:11px;color:#94a3b8;margin-top:2px}
.toggle{
  width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;
  background:rgba(0,0,0,0.15);position:relative;transition:background 0.25s;
}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform 0.25s;box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.toggle.on{background:#f59e0b}
.toggle.on::after{transform:translateX(20px)}

.settings-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:240;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.settings-overlay.open{opacity:1;pointer-events:auto}

/* ========== 主舞台 ========== */
.stage{
  margin-top:60px;
  min-height:calc(100vh - 60px);
  padding:40px 24px 120px;
  position:relative;overflow:hidden;
  transition:background 0.6s ease;
}
.orb{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(80px);opacity:0.3;
  animation:orbFloat 12s ease-in-out infinite;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.12)}
  66%{transform:translate(-20px,-50px) scale(0.92)}
}
.orb:nth-child(2){animation-delay:-4s;animation-duration:14s}
.orb:nth-child(3){animation-delay:-7s;animation-duration:16s}
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.05) 100%);
}

/* ========== 通用布局 ========== */
.stage-inner{
  position:relative;z-index:2;
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:50px;
  min-height:calc(100vh - 60px - 40px - 120px);
}
.text-side{flex:1;min-width:0}
.text-side .scene-number{
  font-size:12px;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;margin-bottom:14px;opacity:0.55;
}
.scene-title{
  font-size:calc(clamp(1.8rem,3.5vw,2.6rem) * var(--font-size-scale,1));
  font-weight:900;line-height:1.25;margin-bottom:18px;letter-spacing:1px;
  transition:font-family 0.5s;
}
.scene-desc{
  font-size:calc(16px * var(--font-size-scale,1));line-height:1.9;
  margin-bottom:24px;max-width:460px;opacity:0.8;
}
.feature-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.feature-pill{
  font-size:calc(12px * var(--font-size-scale,1));padding:8px 16px;border-radius:20px;
  font-weight:600;letter-spacing:0.3px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}

/* ========== 手机 Mockup ========== */
.phone-mockup{
  flex-shrink:0;
  width:300px;height:620px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:38px;
  border:2.5px solid rgba(255,255,255,0.8);
  box-shadow:0 30px 80px rgba(0,0,0,0.10),0 8px 24px rgba(0,0,0,0.06),inset 0 0 0 1px rgba(255,255,255,0.6);
  overflow:hidden;position:relative;
  animation:phoneBreath 7s ease-in-out infinite;
}
@keyframes phoneBreath{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.phone-notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:120px;height:28px;background:rgba(0,0,0,0.05);
  border-radius:0 0 18px 18px;z-index:10;
}
.phone-statusbar{
  padding:14px 22px 6px;display:flex;justify-content:space-between;
  font-size:11px;color:rgba(0,0,0,0.4);font-weight:600;
}
.phone-screen{
  padding:10px 18px 16px;
  height:calc(100% - 40px);
  display:flex;flex-direction:column;overflow-y:auto;
}
.phone-screen::-webkit-scrollbar{width:0}
.phone-app-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.phone-app-logo{display:flex;align-items:center;gap:7px}
.phone-app-icon{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;box-shadow:0 3px 10px rgba(245,158,11,0.3);
}
.phone-app-name{font-size:14px;font-weight:800;color:#1e293b}
.phone-app-tag{font-size:10px;padding:4px 10px;border-radius:12px;font-weight:700}

/* ========== 场景选择器 ========== */
.scene-picker{
  display:flex;gap:8px;overflow-x:auto;
  padding:4px 0 10px;scrollbar-width:none;
  margin-bottom:10px;
}
.scene-picker::-webkit-scrollbar{display:none}
.scene-card{
  flex-shrink:0;width:78px;
  background:rgba(255,255,255,0.7);
  border:1.5px solid rgba(0,0,0,0.06);
  border-radius:14px;padding:10px 6px;
  cursor:pointer;transition:all 0.25s;
  text-align:center;
}
.scene-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.scene-card.active{
  border-color:#f59e0b;background:rgba(255,255,255,0.95);
  box-shadow:0 6px 18px rgba(245,158,11,0.25);
}
.scene-card-icon{font-size:26px;margin-bottom:4px}
.scene-card-name{font-size:10px;font-weight:700;color:#1e293b;line-height:1.3}

/* ========== 主操作按钮 ========== */
.action-btn{
  width:100%;padding:14px;border-radius:18px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  color:#fff;letter-spacing:1px;
  box-shadow:0 6px 20px rgba(245,158,11,0.35);
  transition:all 0.25s;font-family:inherit;
  position:relative;overflow:hidden;
}
.action-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,158,11,0.45)}
.action-btn:active{transform:translateY(0)}
.action-btn:disabled{opacity:0.6;cursor:not-allowed}
.action-btn.green{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.35)}
.action-btn.green:hover{box-shadow:0 8px 24px rgba(16,185,129,0.45)}
.action-btn.red{background:linear-gradient(135deg,#ef4444,#f87171);box-shadow:0 6px 20px rgba(239,68,68,0.35)}
.action-btn.purple{background:linear-gradient(135deg,#8b5cf6,#a78bfa);box-shadow:0 6px 20px rgba(139,92,246,0.35)}
.action-btn.ghost{
  background:rgba(255,255,255,0.6);color:#78350f;box-shadow:none;
  border:1.5px solid rgba(245,158,11,0.3);
}
.action-btn.ghost:hover{background:rgba(245,158,11,0.08)}
.action-btn.pulse::before{
  content:'';position:absolute;inset:0;border-radius:18px;
  background:inherit;opacity:0.6;
  animation:btnPulse 2s ease-in-out infinite;
}
@keyframes btnPulse{
  0%,100%{transform:scale(1);opacity:0.6}
  50%{transform:scale(1.04);opacity:0}
}

/* ========== 扫描动画区 ========== */
.scan-area{
  background:rgba(255,255,255,0.5);
  border-radius:16px;height:140px;
  margin-bottom:12px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed rgba(0,0,0,0.1);
}
.scan-area.scanning{border-style:solid;border-color:#f59e0b;background:rgba(245,158,11,0.05)}
.scan-icon{font-size:48px;opacity:0.7;transition:all 0.3s}
.scan-area.scanning .scan-icon{opacity:0.3;transform:scale(0.8)}
.scan-frame{
  position:absolute;inset:14px;border-radius:12px;
  border:2px solid rgba(245,158,11,0.6);
  opacity:0;transition:opacity 0.3s;
}
.scan-area.scanning .scan-frame{opacity:1}
.scan-corner{position:absolute;width:18px;height:18px;border:3px solid #f59e0b}
.scan-corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.scan-corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.scan-corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 6px}
.scan-corner.br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.scan-line{
  position:absolute;left:14px;right:14px;height:2px;
  background:linear-gradient(90deg,transparent,#f59e0b,transparent);
  box-shadow:0 0 12px rgba(245,158,11,0.6);
  opacity:0;transition:opacity 0.3s;
}
.scan-area.scanning .scan-line{opacity:1;animation:scanMove 1.6s ease-in-out infinite}
@keyframes scanMove{
  0%,100%{top:18px}
  50%{top:calc(100% - 20px)}
}
.scan-status{
  position:absolute;bottom:8px;left:0;right:0;
  text-align:center;font-size:11px;font-weight:600;
  color:#f59e0b;opacity:0;transition:opacity 0.3s;
}
.scan-area.scanning .scan-status{opacity:1}

/* 摄像头/上传区 */
.media-area{
  background:rgba(0,0,0,0.05);border-radius:16px;height:180px;
  margin-bottom:12px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px dashed rgba(0,0,0,0.15);cursor:pointer;
  transition:all 0.25s;
}
.media-area:hover{border-color:#f59e0b;background:rgba(245,158,11,0.04)}
.media-area.has-media{border-style:solid;border-color:#f59e0b}
.media-area video,.media-area img{
  width:100%;height:100%;object-fit:cover;border-radius:14px;
}
.media-placeholder{font-size:13px;color:#94a3b8;text-align:center;line-height:1.7}
.media-placeholder .mpi{font-size:36px;margin-bottom:8px;display:block}
.media-toolbar{
  display:flex;gap:8px;margin-bottom:10px;
}
.media-toolbar button{
  flex:1;padding:9px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);
  background:rgba(255,255,255,0.6);font-size:11px;font-weight:600;cursor:pointer;
  color:#64748b;transition:all 0.25s;font-family:inherit;
}
.media-toolbar button:hover{background:rgba(255,255,255,0.9)}
.media-toolbar button.active{background:#f59e0b;color:#fff;border-color:#f59e0b}

/* ========== 结果卡片 ========== */
.result-card{
  background:rgba(255,255,255,0.9);
  border-radius:16px;padding:14px;
  box-shadow:0 2px 14px rgba(0,0,0,0.04);
  margin-bottom:10px;
  animation:cardSlideUp 0.6s ease-out;
}
@keyframes cardSlideUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.result-label{font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase}
.result-name{font-size:19px;font-weight:800;color:#1e293b;margin-bottom:6px}
.result-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.result-tag{font-size:10px;padding:3px 9px;border-radius:9px;font-weight:700}
.result-highlight{
  font-size:14px;line-height:1.75;padding:11px;border-radius:11px;
  margin-bottom:7px;position:relative;
}
.result-highlight::before{
  content:'\201C';position:absolute;left:5px;top:-4px;
  font-size:30px;opacity:0.15;line-height:1;
}
.result-funfact{
  font-size:11px;padding:9px 12px;border-radius:10px;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:all 0.3s;
}
.result-funfact:hover{transform:translateY(-1px)}

.style-switcher{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.style-btn{
  padding:5px 11px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);
  font-size:11px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,0.6);color:#64748b;
  transition:all 0.25s;font-family:inherit;
}
.style-btn:hover{background:rgba(255,255,255,0.9)}
.style-btn.active{background:#f59e0b;color:#fff;border-color:#f59e0b;box-shadow:0 3px 10px rgba(245,158,11,0.3)}

.safety-card{border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;animation:cardSlideUp 0.5s ease-out}
.safety-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.safety-status{font-size:11px;font-weight:800;margin-bottom:3px}
.safety-msg{font-size:12px;line-height:1.6}

.social-card{background:rgba(255,255,255,0.9);border-radius:14px;padding:12px;margin-bottom:8px;animation:cardSlideUp 0.5s ease-out}
.social-label{font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
.social-summary{font-size:12px;line-height:1.6;padding:10px 11px;border-radius:9px;margin-bottom:8px}
.social-suggestion{font-size:13px;line-height:1.75;padding:10px 11px;border-radius:9px}

.sound-bars{display:flex;align-items:center;justify-content:center;gap:6px;height:60px;margin-bottom:10px}
.sound-bar{width:5px;background:#ec4899;border-radius:3px;animation:soundBar 0.8s ease-in-out infinite}
@keyframes soundBar{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1.8)}}

/* ========== 首页 ========== */
.home-hero{text-align:center;max-width:760px;margin:0 auto;padding:20px}
.home-hero .home-eye{
  font-size:64px;margin-bottom:16px;
  display:inline-block;animation:eyeBlink 4s ease-in-out infinite;
}
@keyframes eyeBlink{
  0%,90%,100%{transform:scaleY(1)}
  95%{transform:scaleY(0.1)}
}
.home-hero h1{
  font-size:calc(clamp(2rem,5vw,3.4rem) * var(--font-size-scale,1));
  font-weight:900;letter-spacing:2px;margin-bottom:14px;color:#78350f;
  transition:font-family 0.5s;
}
.home-hero .home-tagline{
  font-size:calc(clamp(15px,2vw,20px) * var(--font-size-scale,1));
  color:#92400e;opacity:0.85;line-height:1.8;margin-bottom:32px;
}
.home-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.home-cta .action-btn{width:auto;padding:14px 32px}

/* 今日灵感卡片 */
.home-daily{
  max-width:560px;margin:0 auto 48px;
  background:linear-gradient(135deg,rgba(255,255,255,0.85),rgba(254,243,199,0.6));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(251,191,36,0.3);
  border-radius:22px;padding:22px 24px;
  box-shadow:0 8px 28px rgba(245,158,11,0.1);
  animation:cardSlideUp 0.7s ease-out;
  position:relative;overflow:hidden;
}
.home-daily::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,0.18),transparent 70%);
  pointer-events:none;
}
.home-daily-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:6px;
}
.home-daily-tag{
  font-size:11px;font-weight:800;letter-spacing:1.5px;
  color:#b45309;background:rgba(251,191,36,0.18);
  padding:4px 12px;border-radius:12px;
}
.home-daily-date{font-size:11px;color:#a16207;opacity:0.8;font-weight:600}
.home-daily-scene{
  font-size:18px;font-weight:800;color:#78350f;margin-bottom:8px;
}
.home-daily-text{
  font-size:15px;line-height:1.9;color:#451a03;
  font-family:'Noto Serif SC','STSong',serif;
  margin-bottom:14px;font-style:italic;
}
.home-daily-actions{display:flex;gap:8px;flex-wrap:wrap}
.home-daily-btn{
  padding:7px 14px;border-radius:14px;border:1px solid rgba(245,158,11,0.3);
  background:rgba(255,255,255,0.6);font-size:12px;font-weight:600;
  color:#92400e;cursor:pointer;transition:all 0.25s;font-family:inherit;
}
.home-daily-btn:hover{background:rgba(245,158,11,0.12);transform:translateY(-1px)}
.home-daily-btn.primary{
  background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;
  border-color:transparent;box-shadow:0 3px 12px rgba(245,158,11,0.3);
}
.home-daily-btn.primary:hover{box-shadow:0 5px 16px rgba(245,158,11,0.4)}
.home-features{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;max-width:900px;margin:0 auto;
}
.home-feature-card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:18px;padding:22px;text-align:left;
  border:1px solid rgba(255,255,255,0.9);
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  cursor:pointer;transition:all 0.3s;
  animation:cardSlideUp 0.6s ease-out;
}
.home-feature-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.1)}
.home-feature-card .hfc-icon{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:14px;
}
.home-feature-card h3{font-size:16px;font-weight:800;color:#1e293b;margin-bottom:8px}
.home-feature-card p{font-size:12px;line-height:1.7;color:#64748b}

/* ========== 统计/足迹 ========== */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;margin-bottom:28px;
}
.stats-card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px;padding:18px;text-align:center;
  border:1px solid rgba(255,255,255,0.9);
}
.stats-num{font-size:32px;font-weight:900;color:#f59e0b;line-height:1}
.stats-label{font-size:11px;color:#94a3b8;font-weight:600;margin-top:6px;letter-spacing:1px}

.achievements-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.achievement{
  background:rgba(255,255,255,0.6);
  border:1.5px solid rgba(0,0,0,0.06);
  border-radius:14px;padding:14px;text-align:center;
  transition:all 0.3s;opacity:0.5;
}
.achievement.unlocked{
  opacity:1;border-color:#f59e0b;
  background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(251,191,36,0.04));
}
.achievement-icon{font-size:28px;margin-bottom:6px;filter:grayscale(1)}
.achievement.unlocked .achievement-icon{filter:none}
.achievement-name{font-size:12px;font-weight:700;color:#1e293b;margin-bottom:2px}
.achievement-desc{font-size:10px;color:#94a3b8;line-height:1.5}
.achievement-reward{font-size:9px;color:#f59e0b;font-weight:700;margin-top:5px;letter-spacing:0.3px;opacity:0;transition:opacity 0.3s}
.achievement.unlocked .achievement-reward{opacity:1}
/* 成就分层标签 */
.tier-section{margin-bottom:18px}
.tier-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:800;color:#0369a1}
.tier-header .tier-tip{font-size:10px;font-weight:500;color:#94a3b8;margin-left:auto}
.tier-progress{flex:1;height:6px;background:rgba(0,0,0,0.06);border-radius:3px;overflow:hidden;max-width:120px;margin-left:8px}
.tier-progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
.tier-sprout .tier-progress-fill{background:linear-gradient(90deg,#86efac,#4ade80)}
.tier-growth .tier-progress-fill{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.tier-bloom .tier-progress-fill{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
/* 装扮柜 */
.outfit-preview{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.9);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.outfit-avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#fbbf24);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;color:#fff;position:relative}
.outfit-avatar-badge{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;border:1.5px solid #fff}
.outfit-info{flex:1;min-width:0}
.outfit-title{font-size:15px;font-weight:800;color:#1e293b;margin-bottom:2px}
.outfit-sub{font-size:11px;color:#94a3b8}
.outfit-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(245,158,11,0.15);color:#b45309}
.closet-section{margin-bottom:14px}
.closet-label{font-size:12px;font-weight:700;color:#475569;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.closet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.closet-item{background:rgba(255,255,255,0.55);border:1.5px dashed rgba(0,0,0,0.1);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;transition:all 0.25s;opacity:0.55}
.closet-item.unlocked{opacity:1;border-style:solid;border-color:rgba(245,158,11,0.3)}
.closet-item.equipped{border-color:#f59e0b;background:linear-gradient(135deg,rgba(245,158,11,0.12),rgba(251,191,36,0.06));box-shadow:0 3px 10px rgba(245,158,11,0.18)}
.closet-item:hover.unlocked{transform:translateY(-2px)}
.closet-preview{width:34px;height:34px;border-radius:11px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,0.5)}
.closet-name{font-size:10px;font-weight:700;color:#334155;line-height:1.3}
.closet-lock{font-size:9px;color:#cbd5e1;margin-top:3px}
.closet-item.equipped .closet-name{color:#b45309}
/* 徽章荣耀展示区 */
.badge-showcase{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.badge-showcase-item{background:rgba(255,255,255,0.55);border:1.5px dashed rgba(0,0,0,0.1);border-radius:14px;padding:12px 8px;text-align:center;transition:all 0.3s;opacity:0.5}
.badge-showcase-item.unlocked{opacity:1;border-style:solid;border-color:rgba(245,158,11,0.35);background:rgba(255,255,255,0.78)}
.badge-showcase-item.equipped{border-color:#f59e0b;box-shadow:0 4px 14px rgba(245,158,11,0.25);background:linear-gradient(135deg,rgba(245,158,11,0.12),rgba(251,191,36,0.05))}
.badge-showcase-medal{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:900;background:rgba(0,0,0,0.1)}
.badge-showcase-item.unlocked .badge-showcase-medal{animation:badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.badge-showcase-name{font-size:11px;font-weight:800;color:#1e293b;margin-bottom:3px;line-height:1.3}
.badge-showcase-desc{font-size:9px;color:#94a3b8;line-height:1.4;margin-bottom:5px}
.badge-showcase-status{font-size:9px;font-weight:700;color:#10b981;padding:2px 6px;border-radius:8px;background:rgba(16,185,129,0.12);display:inline-block}
.badge-showcase-status.hint{color:#0284c7;background:rgba(2,132,199,0.1)}
.badge-showcase-status.lock{color:#cbd5e1;background:rgba(0,0,0,0.04)}
.badge-showcase-item.equipped .badge-showcase-status{color:#b45309;background:rgba(245,158,11,0.18)}

/* ========== 场景实验室 ========== */
.lab-section{max-width:680px;margin:0 auto;position:relative;z-index:2}
.lab-header{text-align:center;margin-bottom:24px}
.lab-header h2{
  font-size:calc(clamp(1.6rem,3vw,2.2rem) * var(--font-size-scale,1));
  font-weight:900;color:#78350f;margin-bottom:10px;
}
.lab-header p{font-size:14px;color:#92400e;opacity:0.8;line-height:1.7}
.lab-input-group{margin-bottom:16px}
.lab-input-label{font-size:12px;font-weight:700;color:#6b21a8;margin-bottom:6px;letter-spacing:0.5px}
.lab-input{
  width:100%;padding:12px 14px;border-radius:12px;
  border:1.5px solid rgba(139,92,246,0.25);
  background:rgba(255,255,255,0.8);
  font-size:14px;font-family:inherit;color:#1e293b;
  transition:all 0.25s;
}
.lab-input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,0.1)}
.lab-input::placeholder{color:#94a3b8}
.lab-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lab-suggestion-chip{
  padding:5px 11px;border-radius:12px;border:1px solid rgba(139,92,246,0.25);
  background:rgba(139,92,246,0.06);font-size:11px;color:#6b21a8;
  cursor:pointer;transition:all 0.25s;font-family:inherit;
}
.lab-suggestion-chip:hover{background:rgba(139,92,246,0.14);transform:translateY(-1px)}

/* ========== 无障碍模式 ========== */
body.accessibility{background:#fffbe6!important;font-size:18px}
body.accessibility.dark{background:#1a1a0a!important;color:#fff}
body.accessibility .topbar{background:rgba(255,251,230,0.95)}
body.accessibility.dark .topbar{background:rgba(26,26,10,0.95)}
body.accessibility .tab{font-size:16px;padding:10px 18px}
body.accessibility .font-panel{display:none}
body.accessibility .stage{padding:30px 20px 80px}
body.accessibility .text-side{display:none}
body.accessibility .stage-inner{justify-content:center}
body.accessibility .phone-mockup{width:380px;height:720px;border-radius:32px}
body.accessibility .phone-app-name{font-size:20px}
body.accessibility .phone-app-tag{font-size:14px;padding:6px 14px}
body.accessibility .scene-card{width:110px;padding:14px 8px}
body.accessibility .scene-card-icon{font-size:36px}
body.accessibility .scene-card-name{font-size:14px}
body.accessibility .action-btn{font-size:18px;padding:20px;border-radius:22px}
body.accessibility .result-name{font-size:24px}
body.accessibility .result-highlight{font-size:18px;line-height:1.8}
body.accessibility .result-tag{font-size:14px;padding:5px 12px}
body.accessibility .safety-msg{font-size:16px;line-height:1.8}
body.accessibility .social-suggestion{font-size:17px;line-height:1.9}

.a11y-banner{
  background:linear-gradient(135deg,#10b981,#34d399);
  color:#fff;padding:10px 14px;border-radius:14px;
  margin-bottom:14px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.a11y-banner-icon{font-size:18px}

/* ========== Toast ========== */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(30,41,59,0.92);color:#fff;
  padding:10px 20px;border-radius:24px;
  font-size:13px;font-weight:600;z-index:300;
  opacity:0;pointer-events:none;transition:all 0.3s;
  backdrop-filter:blur(12px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 响应式 ========== */
@media (max-width:860px){
  .stage-inner{flex-direction:column;gap:24px;text-align:center}
  .phone-mockup{order:-1;width:280px;height:580px}
  .text-side .scene-desc{margin:0 auto 20px}
  .feature-pills{justify-content:center}
  .topbar-inner{height:54px}
  .brand-sub{display:none}
  .tab{font-size:12px;padding:7px 11px}
  .stage{padding:30px 16px 110px;margin-top:54px}
  .font-panel{bottom:14px;padding:6px 12px;gap:6px}
  .font-btn{padding:4px 9px;font-size:10px}
  .home-features{grid-template-columns:1fr 1fr}
  .settings-panel{width:100%}
  .home-cta .action-btn{width:100%}
}
@media (max-width:480px){
  .phone-mockup{width:250px;height:520px;border-radius:30px}
  .scene-title{font-size:calc(1.6rem * var(--font-size-scale,1))}
  .home-features{grid-template-columns:1fr}
}
</style>

  <div class="topbar-inner">

// ========== 工具函数 ==========
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function showToast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2000);
}
function speak(text){
  if(!('speechSynthesis' in window)){showToast('当前浏览器不支持语音播报');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=0.9;u.pitch=1;
  speechSynthesis.speak(u);
  trackStat('speakCount');
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{showToast('📋 已复制到剪贴板');trackStat('copyCount')}).catch(()=>fallbackCopy(text));
  }else{fallbackCopy(text)}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('📋 已复制到剪贴板');trackStat('copyCount')}catch(e){showToast('复制失败，请手动选择文字')}
  document.body.removeChild(ta);
}
function incStat(key){
  stats[key]=(stats[key]||0)+1;
  if(key==='identify'||key==='safety'||key==='social'||key==='fun'||key==='a11y'||key==='lab'){
    stats.totalScans=(stats.totalScans||0)+1;
  }
  localStorage.setItem('lingmou-stats',JSON.stringify(stats));
  checkAchievements();
}
// 非扫描类行为追踪（不计入 totalScans，避免膨胀）
function trackStat(key){
  stats[key]=(stats[key]||0)+1;
  localStorage.setItem('lingmou-stats',JSON.stringify(stats));
  checkAchievements();
}
function markStyleUsed(style){
  if(!stats.stylesUsed)stats.stylesUsed=[];
  if(!stats.stylesUsed.includes(style)){
    stats.stylesUsed.push(style);
    localStorage.setItem('lingmou-stats',JSON.stringify(stats));
    checkAchievements();
  }
}

// 判断某徽章是否已解锁（集齐对应层级全部成就；master 需全 15 项）
function isBadgeUnlocked(key){
  const b=badges[key];if(!b)return false;
  const unlocked=JSON.parse(localStorage.getItem('lingmou-achievements')||'[]');
  if(b.tier==='master')return unlocked.length>=achievements.length;
  const list=achievements.filter(a=>a.tier===b.tier);
  return list.every(a=>unlocked.includes(a.id));
}
// 检查徽章解锁（在 checkAchievements 后调用），独立存 lingmou-badges
function checkBadges(){
  const unlockedBadges=JSON.parse(localStorage.getItem('lingmou-badges')||'[]');
  Object.keys(badges).forEach(key=>{
    if(!unlockedBadges.includes(key)&&isBadgeUnlocked(key)){
      unlockedBadges.push(key);
      localStorage.setItem('lingmou-badges',JSON.stringify(unlockedBadges));
      showToast(badges[key].icon+' 荣耀解锁徽章【'+badges[key].name+'】！');
      playUnlockSound('bloom'); // 徽章用绽放级三音琶音
      applyRewards();
    }
  });
}

// 装扮柜：已装备的奖励（frame/title/theme/badge），存 localStorage
function getEquipped(){
  const eq=JSON.parse(localStorage.getItem('lingmou-equipped')||'{"frame":null,"title":null,"theme":null,"badge":null}');
  if(!eq.badge)eq.badge=null;
  return eq;
}
// 判断某奖励是否已解锁可用（badge 类型走 isBadgeUnlocked）
function isRewardUnlocked(reward){
  if(!reward)return false;
  if(reward.type==='badge')return isBadgeUnlocked(reward.key);
  const unlocked=JSON.parse(localStorage.getItem('lingmou-achievements')||'[]');
  return achievements.some(a=>a.id&&unlocked.includes(a.id)&&a.reward&&a.reward.type===reward.type&&a.reward.key===reward.key);
}
// 装备/卸下奖励（再点一次卸下）
function equipReward(type,key){
  // key 为 null 表示卸下，始终允许；否则必须已解锁
  if(key!==null&&!isRewardUnlocked({type,key})){showToast('🔒 该装扮尚未解锁，继续探索吧');return;}
  const eq=getEquipped();
  if(eq[type]===key){eq[type]=null;}
  else{eq[type]=key;}
  localStorage.setItem('lingmou-equipped',JSON.stringify(eq));
  applyRewards();
  const nameMap={frame:frames,title:titles,theme:themes,badge:badges};
  const eq2=getEquipped();
  showToast(eq2[type]?('✨ 已装备：'+(nameMap[type][key]||{}).name):'已卸下装扮');
  render();
}
// 把已装备奖励实时应用到顶部 brand 区域
function applyRewards(){
  const eq=getEquipped();
  const icon=$('.brand-icon');
  const brand=$('.brand');
  const sub=$('.brand-sub');
  if(!icon||!brand||!sub)return;
  // 头像框
  icon.style.cssText='position:relative';
  if(eq.frame&&frames[eq.frame]&&isRewardUnlocked({type:'frame',key:eq.frame})){
    icon.style.cssText+=';'+frames[eq.frame].css;
  }
  // 主题色
  if(eq.theme&&themes[eq.theme]&&isRewardUnlocked({type:'theme',key:eq.theme})){
    brand.style.background=themes[eq.theme].css;
  }else{
    brand.style.background='linear-gradient(135deg,#f59e0b,#fbbf24)';
  }
  // 称号：未手动装备时按解锁数自动进阶
  const unlocked=JSON.parse(localStorage.getItem('lingmou-achievements')||'[]');
  let titleText='AI 生活感知助手';
  if(eq.title&&titles[eq.title]&&isRewardUnlocked({type:'title',key:eq.title})){
    titleText=titles[eq.title].name;
  }else{
    const n=unlocked.length;
    if(n>=12)titleText='感知大师';

// 成就解锁音效（Web Audio API，零音频文件，复用音乐 AudioContext）
function playUnlockSound(tier){
  try{
    const ctx=window._lingmouAudioCtx||new (window.AudioContext||window.webkitAudioContext)();
    window._lingmouAudioCtx=ctx;
    if(ctx.state==='suspended')ctx.resume();
    // 不同层级不同音阶：萌芽单音、成长双音上行、绽放三音琶音
    const notes={sprout:[523.25],growth:[523.25,659.25],bloom:[523.25,659.25,783.99]}[tier]||[523.25];
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime+i*0.12);
      gain.gain.linearRampToValueAtTime(0.18,ctx.currentTime+i*0.12+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.5);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(ctx.currentTime+i*0.12);
      osc.stop(ctx.currentTime+i*0.12+0.5);
    });
  }catch(e){}
}
function checkAchievements(){
  const unlocked = JSON.parse(localStorage.getItem('lingmou-achievements')||'[]');
  achievements.forEach(a=>{
    if(!unlocked.includes(a.id)&&a.check(stats)){
      unlocked.push(a.id);
      localStorage.setItem('lingmou-achievements',JSON.stringify(unlocked));
      const tm=tierMeta[a.tier];
      showToast(tm.icon+' 解锁成就【'+a.name+'】→ 获得：'+a.reward.name);
      playUnlockSound(a.tier);
      applyRewards();
    }
  });
  // 检查徽章解锁（集齐整层成就时触发）
  checkBadges();
}

let socialMode='preset';
function setSocialMode(mode){
  socialMode=mode;
  $$('.media-toolbar button[data-st]').forEach(b=>b.classList.toggle('active',b.dataset.st===mode));
  render();
}
function startSocialScan(){
  if(isScanning)return;
  if(socialMode==='voice'){
    startVoiceRecognition();
    return;
  }
  if(isScanning)return;
  isScanning=true;
  const btn=$('#actionBtn');const status=$('#scanStatus');const container=$('#resultContainer');
  btn.disabled=true;btn.textContent='分析中…';btn.classList.remove('pulse');container.innerHTML='';
  const statuses=['正在聆听对话…','识别话题关键词…','分析情绪与意图…','生成接话建议…'];
  let si=0;status.textContent=statuses[0];
  const statusTimer=setInterval(()=>{si=(si+1)%statuses.length;status.textContent=statuses[si]},600);
  setTimeout(()=>{
    clearInterval(statusTimer);btn.disabled=false;btn.textContent='🔄 重新分析';btn.classList.add('pulse');isScanning=false;currentSuggestionIdx=0;
    renderSocialResult();incStat('social');
  },2400);
}
function startVoiceRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    showToast('当前浏览器不支持语音识别，已切换为预设场景');
    setSocialMode('preset');
    return;
  }
  if(isRecording){
    if(recognition)recognition.stop();
    return;
  }
  recognition=new SR();
  recognition.lang='zh-CN';
  recognition.continuous=false;
  recognition.interimResults=true;
  const btn=$('#actionBtn');const status=$('#scanStatus');const container=$('#resultContainer');
  btn.textContent='⏹ 停止识别';btn.classList.remove('pulse');
  status.textContent='正在聆听…请说话';
  container.innerHTML='';
  isRecording=true;
  let finalText='';
  recognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    status.textContent='听到：'+(finalText||interim);
  };
  recognition.onerror=e=>{
    showToast('语音识别出错：'+e.error);
    isRecording=false;
    btn.textContent='🎤 开始语音识别';btn.classList.add('pulse');
    status.textContent='识别失败，请重试';
  };
  recognition.onend=()=>{
    isRecording=false;
    btn.textContent='🎤 开始语音识别';btn.classList.add('pulse');
    if(finalText.trim()){
      status.textContent='已识别，正在生成建议…';
      setTimeout(()=>{
        // 用识别到的文本匹配最接近的预设场景
        const scene=sceneData.social.scenes[currentScene.social];
        currentSuggestionIdx=0;
        renderSocialResult(finalText);
        incStat('social');
      },1200);
    }else{
      status.textContent='未识别到语音，请重试';
    }
  };
  recognition.start();
}
function renderSocialResult(userText){
  const scene=sceneData.social.scenes[currentScene.social];
  const container=$('#resultContainer');
  const suggestion=scene.suggestions[currentSuggestionIdx];
  container.innerHTML=`
    <div class="social-card">
      <div class="social-label" style="color:#be185d">📋 对话感知</div>
      <div class="social-summary" style="background:#fdf4f8;color:#831843">${userText?('你说的：'+userText):scene.summary}</div>

}

function generateLab(){
  const input=$('#labInput');
  const name=input.value.trim();
  if(!name){showToast('请输入物品名称');input.focus();return}
  const result=$('#labResult');
  result.innerHTML=`<div style="text-align:center;padding:30px;color:#8b5cf6;font-size:14px;font-weight:600">🧪 灵眸正在为「${name}」生成解读…</div>`;
  setTimeout(()=>{
    const interpretations=generateLabInterpretations(name);
    const styles=[{key:'humor',name:'😄 幽默',color:'#f59e0b',bg:'#fffbeb'},{key:'science',name:'🔬 科普',color:'#3b82f6',bg:'#eff6ff'},{key:'literature',name:'🌸 文艺',color:'#ec4899',bg:'#fdf4f8'},{key:'toxic',name:'🔥 毒舌',color:'#ef4444',bg:'#fef2f2'}];
    result.innerHTML=styles.map(s=>`
      <div class="result-card" style="margin-bottom:10px;animation:cardSlideUp 0.5s ease-out">
        <div class="result-label" style="color:${s.color}">✦ ${s.name}</div>
        <div class="result-highlight" style="background:${s.bg};color:${s.color};font-family:'Noto Serif SC','STSong',serif;font-size:14px;line-height:1.85">${interpretations[s.key]}</div>
        <button class="style-btn" style="margin-top:6px" onclick="speak('${interpretations[s.key].replace(/'/g,"\\'")}')">🔊 朗读</button>
      </div>
    `).join('');
    showToast('已为「'+name+'」生成四种解读');
    incStat('lab');
  },1500);
}
function generateLabInterpretations(name){
  // 基于{name}生成解读（用词库填充）
  const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  const humorTpls=labWordbank.物品模板.humor;
  const scienceTpls=labWordbank.物品模板.science;
  const literatureTpls=labWordbank.物品模板.literature;
  const toxicTpls=labWordbank.物品模板.toxic;
  return {
    humor:pick(humorTpls).replace(/{name}/g,name).replace(/{result}/g,'黄昏'),
    science:pick(scienceTpls).replace(/{name}/g,name),
    literature:pick(literatureTpls).replace(/{name}/g,name).replace(/{result}/g,'黄昏'),
    toxic:pick(toxicTpls).replace(/{name}/g,name)
  };
}

// ========== 渲染：我的足迹 ==========
function renderStats(){
  const unlocked=JSON.parse(localStorage.getItem('lingmou-achievements')||'[]');
  const eq=getEquipped();
  // 当前称号（手动装备优先，否则按解锁数自动进阶）
  let curTitle='初来乍到';
  if(eq.title&&titles[eq.title]&&isRewardUnlocked({type:'title',key:eq.title}))curTitle=titles[eq.title].name;
  else if(unlocked.length>=12)curTitle='感知大师';
  else if(unlocked.length>=8)curTitle='全能探索家';
  else if(unlocked.length>=4)curTitle='灵眸新人';
  else if(unlocked.length>=1)curTitle='初识灵眸';
  // 装扮柜单项渲染
  function closetItems(type,map){
    const items=Object.keys(map).map(key=>{
      const rl={type,key};
      const isUnlocked=isRewardUnlocked(rl);
      const isEq=eq[type]===key;
      let preview='';
      if(type==='frame'){preview=`<div class="closet-preview" style="${map[key].css.split(';').filter(s=>s.includes('box-shadow')).join(';')}">👁</div>`;}
      else if(type==='theme'){preview=`<div class="closet-preview" style="background:${map[key].css}">👁</div>`;}
      else if(type==='badge'){preview=`<div class="closet-preview" style="${map[key].css}">${map[key].icon}</div>`;}
      else{preview=`<div class="closet-preview">🎖️</div>`;}
      return `<div class="closet-item ${isUnlocked?'unlocked':''} ${isEq?'equipped':''}" ${isUnlocked?`onclick="equipReward('${type}','${key}')"`:''}>
        ${preview}
        <div class="closet-name">${map[key].name}${isEq?' · 已装备':''}</div>
        ${isUnlocked?'':'<div class="closet-lock">🔒 未解锁</div>'}
      </div>`;
    });
    // 「卸下」选项
    items.unshift(`<div class="closet-item ${eq[type]?'unlocked':'equipped unlocked'}" onclick="equipReward('${type}',null)">
      <div class="closet-preview">⭕</div>
      <div class="closet-name">默认${eq[type]?'':' · 已装备'}</div>
    </div>`);
    return items.join('');
  }
  // 徽章荣耀展示区：展示所有徽章，已解锁高亮，未解锁灰显并提示条件
  const unlockedBadges=JSON.parse(localStorage.getItem('lingmou-badges')||'[]');
  function badgeShowcase(){
    return Object.keys(badges).map(key=>{
      const b=badges[key];
      const isU=isBadgeUnlocked(key);
      const isEq=eq.badge===key;
      return `<div class="badge-showcase-item ${isU?'unlocked':''} ${isEq?'equipped':''}" title="${b.desc}${isU?'':'（未解锁）'}">
        <div class="badge-showcase-medal" style="${isU?b.css:''}">${b.icon}</div>
        <div class="badge-showcase-name">${b.name}</div>
        <div class="badge-showcase-desc">${b.desc}</div>
        ${isU?(isEq?'<div class="badge-showcase-status">已装备</div>':'<div class="badge-showcase-status hint">已解锁·可装备</div>'):'<div class="badge-showcase-status lock">未解锁</div>'}
      </div>`;
    }).join('');
  }
  // 分层成就墙渲染
  function tierWall(tier){
    const list=achievements.filter(a=>a.tier===tier);
    const done=list.filter(a=>unlocked.includes(a.id)).length;
    const tm=tierMeta[tier];
    return `<div class="tier-section tier-${tier}">
      <div class="tier-header">
        <span>${tm.icon} ${tm.name}</span>
        <div class="tier-progress"><div class="tier-progress-fill" style="width:${list.length?Math.round(done/list.length*100):0}%"></div></div>
        <span style="font-size:11px;color:#94a3b8;font-weight:600">${done}/${list.length}</span>
        <span class="tier-tip">${tm.tip}</span>
      </div>
      <div class="achievements-grid">
        ${list.map(a=>{
          const isU=unlocked.includes(a.id);
          return `<div class="achievement ${isU?'unlocked':''}" title="${a.desc}">
            <div class="achievement-icon">${a.icon}</div>
            <div class="achievement-name">${a.name}</div>
            <div class="achievement-desc">${a.desc}</div>
            <div class="achievement-reward">🎁 ${a.reward.name}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  return `
    <div style="width:100%;max-width:760px;margin:0 auto">
      <div style="text-align:center;margin-bottom:24px">
        <h2 style="font-size:calc(clamp(1.6rem,3vw,2.2rem) * var(--font-size-scale,1));font-weight:900;color:#0369a1;margin-bottom:8px">📊 我的足迹</h2>
        <p style="color:#0284c7;opacity:0.8;font-size:14px">记录你在灵眸的每一次探索 · ${unlocked.length>=15?'🏆 成就全部圆满，你已是灵眸之友':(unlocked.length>=1?('已解锁 '+unlocked.length+'/'+achievements.length+' 项成就，继续探索吧'):'开始你的第一次探索吧')}</p>
      </div>
      <div class="stats-grid">
        <div class="stats-card"><div class="stats-num">${stats.totalScans||0}</div><div class="stats-label">总扫描次数</div></div>
        <div class="stats-card"><div class="stats-num">${stats.identify||0}</div><div class="stats-label">万物识别</div></div>
        <div class="stats-card"><div class="stats-num">${stats.safety||0}</div><div class="stats-label">安全哨兵</div></div>
        <div class="stats-card"><div class="stats-num">${stats.social||0}</div><div class="stats-label">社交智囊</div></div>
        <div class="stats-card"><div class="stats-num">${stats.fun||0}</div><div class="stats-label">趣味解读</div></div>
        <div class="stats-card"><div class="stats-num">${stats.lab||0}</div><div class="stats-label">场景实验室</div></div>
        <div class="stats-card"><div class="stats-num">${stats.a11y||0}</div><div class="stats-label">无障碍模式</div></div>
        <div class="stats-card"><div class="stats-num">${unlocked.length}/${achievements.length}</div><div class="stats-label">已解锁成就</div></div>
      </div>
      <div class="outfit-preview">
        <div class="outfit-avatar" style="${eq.frame&&frames[eq.frame]&&isRewardUnlocked({type:'frame',key:eq.frame})?frames[eq.frame].css:''}">👁${eq.badge&&badges[eq.badge]&&isBadgeUnlocked(eq.badge)?`<span class="outfit-avatar-badge" style="${badges[eq.badge].css}">${badges[eq.badge].icon}</span>`:''}</div>
        <div class="outfit-info">
          <div class="outfit-title">${curTitle}</div>
          <div class="outfit-sub">灵眸 LingMou · 当前装扮</div>
        </div>
        <div class="outfit-badge">已解锁 ${unlocked.length} 项</div>
      </div>
      <div style="margin-bottom:14px;font-size:15px;font-weight:800;color:#0369a1">🏅 徽章荣耀 · 集齐整层成就解锁</div>
      <div class="badge-showcase">${badgeShowcase()}</div>
      <div style="margin:20px 0 14px;font-size:15px;font-weight:800;color:#0369a1">🎨 装扮柜 · 点击装备已解锁的奖励</div>
      <div class="closet-section">
        <div class="closet-label">🖼️ 头像框</div>
        <div class="closet-grid">${closetItems('frame',frames)}</div>
      </div>
      <div class="closet-section">
        <div class="closet-label">🎖️ 称号</div>
        <div class="closet-grid">${closetItems('title',titles)}</div>
      </div>
      <div class="closet-section">
        <div class="closet-label">🌈 主题色</div>
        <div class="closet-grid">${closetItems('theme',themes)}</div>
      </div>
      <div class="closet-section">
        <div class="closet-label">🏅 成就徽章</div>
        <div class="closet-grid">${closetItems('badge',badges)}</div>
      </div>
      <div style="margin:20px 0 14px;font-size:15px;font-weight:800;color:#0369a1">🏆 成就墙 · 三层进阶</div>
      ${tierWall('sprout')}
      ${tierWall('growth')}
      ${tierWall('bloom')}
    </div>
  `;
}
function resetStats(){
  if(!confirm('确定要重置所有使用足迹、成就、徽章与装扮吗？'))return;
  stats={identify:0,safety:0,social:0,fun:0,a11y:0,lab:0,totalScans:0,stylesUsed:[],speakCount:0,copyCount:0,dailySpin:0,darkSafety:0};
  localStorage.setItem('lingmou-stats',JSON.stringify(stats));
  localStorage.removeItem('lingmou-achievements');
  localStorage.removeItem('lingmou-badges');
  localStorage.removeItem('lingmou-equipped');
  applyRewards();
  showToast('已重置足迹、徽章与装扮');
  render();
}

// ========== 主渲染 ==========
function render(){
  applySceneAtmosphere(currentMode);
  const inner=$('#stageInner');
  document.body.classList.toggle('accessibility',currentMode==='a11y');
  // 同步设置面板开关状态
  const tA11y=$('#toggleA11y');if(tA11y)tA11y.classList.toggle('on',currentMode==='a11y');
  if(currentMode==='home')inner.innerHTML=renderHome();
  else if(currentMode==='identify')inner.innerHTML=renderIdentify();
  else if(currentMode==='safety')inner.innerHTML=renderSafety();
  else if(currentMode==='social')inner.innerHTML=renderSocial();
  else if(currentMode==='fun')inner.innerHTML=renderFun();
  else if(currentMode==='lab')inner.innerHTML=renderLab();
  else if(currentMode==='a11y')inner.innerHTML=renderA11y();
  else if(currentMode==='stats')inner.innerHTML=renderStats();
  applyFontStyle(currentFontStyle);
}
function switchMode(mode){
  currentMode=mode;
  $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
  render();
  // 切换场景音乐（如已开启）
  switchMusicForMode(mode);
}
function selectScene(mode,idx){
  currentScene[mode]=idx;
  if(mode==='identify')currentStyle='humor';
  render();
}

// ========== Tab 切换 ==========
$('#tabs').addEventListener('click',e=>{
  const btn=e.target.closest('.tab');
  if(!btn)return;
  switchMode(btn.dataset.mode);
});

// ========== 字体控制 ==========
let currentFontStyle='elegant';
let currentFontSize='md';
function applyFontStyle(style){
  currentFontStyle=style;
  localStorage.setItem('lingmou-font-style',style);
  document.body.classList.remove('font-clear','font-playful');
  if(style==='clear')document.body.classList.add('font-clear');
  if(style==='playful')document.body.classList.add('font-playful');
  $$('.font-btn').forEach(b=>b.classList.toggle('active',b.dataset.style===style));
  $$('.scene-title,.display-font').forEach(el=>{
    const key=el.dataset.fontKey;
    if(key&&fontDefs[key])el.style.fontFamily=fontDefs[key][style];
  });
  // 同步设置面板的 toggle
  $$('.settings-row .toggle[data-font]').forEach(t=>t.classList.toggle('on',t.dataset.font===style));
}
function applyFontSize(size){
  currentFontSize=size;
  localStorage.setItem('lingmou-font-size',size);
  document.body.classList.remove('font-lg');
  if(size==='lg')document.body.classList.add('font-lg');
  $$('.size-btn').forEach(b=>b.classList.toggle('active',b.dataset.size===size));
}
function setFont(style){applyFontStyle(style);showToast('字体已切换')}

// ========== 暗色/无障碍 ==========
function toggleDark(){
  document.body.classList.toggle('dark');
  const isDark=document.body.classList.contains('dark');
  localStorage.setItem('lingmou-dark',isDark?'1':'0');
  $('#toggleDark').classList.toggle('on',isDark);
  $('#darkToggle').textContent=isDark?'☀️':'🌙';
}
function toggleA11y(){
  // 设置面板里的开关：切换到/退出无障碍模式
  if(currentMode==='a11y'){
    switchMode('home');
  }else{
    switchMode('a11y');
  }
  $('#toggleA11y').classList.toggle('on',currentMode==='a11y');
  closeSettings();
}

// ========== 氛围音乐（Web Audio API 实时生成，零音频文件，按场景切换） ==========
let audioCtx=null,ambientNodes=null,isMusicOn=false;
// 各场景音乐配方：频率组合 / 波形 / 滤波 / LFO 速率 / 音量
const musicProfiles={
  // 温暖治愈：C 大调三音，sine 为主，慢呼吸
  home:   {freqs:[261.63,329.63,392.00],types:['sine','triangle','sine'],filter:900,lfo:0.06,gain:0.055,name:'温暖治愈'},
  stats:  {freqs:[261.63,329.63,392.00],types:['sine','triangle','sine'],filter:900,lfo:0.06,gain:0.055,name:'温暖治愈'},
  // 清新活泼：G 大调，稍快 LFO，亮度提升
  identify:{freqs:[196.00,246.94,293.66],types:['triangle','sine','triangle'],filter:1200,lfo:0.11,gain:0.05,name:'清新活泼'},
  fun:    {freqs:[196.00,246.94,293.66],types:['triangle','sine','triangle'],filter:1200,lfo:0.11,gain:0.05,name:'清新活泼'},
  lab:    {freqs:[196.00,246.94,293.66],types:['triangle','sine','triangle'],filter:1300,lfo:0.13,gain:0.052,name:'清新活泼'},
  // 低沉守护：A 小调，低频，sine 为主，极慢，低音量
  safety: {freqs:[110.00,130.81,164.81],types:['sine','sine','triangle'],filter:520,lfo:0.04,gain:0.06,name:'低沉守护'},
  // 轻松俏皮：F 大调，triangle 为主，稍快节奏
  social: {freqs:[174.61,218.63,261.63],types:['triangle','triangle','sine'],filter:1050,lfo:0.14,gain:0.052,name:'轻松俏皮'},
  // 宁静舒缓：D 大调低八度，sine，极慢，柔和
  a11y:   {freqs:[146.83,174.61,220.00],types:['sine','sine','sine'],filter:680,lfo:0.035,gain:0.045,name:'宁静舒缓'}
};
function getMusicProfile(mode){
  return musicProfiles[mode]||musicProfiles.home;
}
function initAmbient(){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const master=audioCtx.createGain();
  master.gain.value=0;
  master.connect(audioCtx.destination);
  ambientNodes={master,filter:null,oscs:[],lfos:[],profile:null};
  buildAmbientGraph(currentMode);
  // 平滑淡入
  master.gain.linearRampToValueAtTime(getMusicProfile(currentMode).gain,audioCtx.currentTime+2.5);
}
function buildAmbientGraph(mode){
  if(!audioCtx||!ambientNodes)return;
  const p=getMusicProfile(mode);
  // 如果配方相同，无需重建
  if(ambientNodes.profile&&ambientNodes.profile.freqs.join()===p.freqs.join()&&ambientNodes.profile.filter===p.filter)return;
  // 拆除旧节点
  ambientNodes.oscs.forEach(o=>{try{o.stop()}catch(e){}});
  ambientNodes.lfos.forEach(o=>{try{o.stop()}catch(e){}});
  ambientNodes.oscs=[];ambientNodes.lfos=[];
  // 新建滤波
  const filter=audioCtx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=p.filter;
  filter.Q.value=0.6;
  filter.connect(ambientNodes.master);
  ambientNodes.filter=filter;
  // 新建振荡器组合
  p.freqs.forEach((f,i)=>{
    const o=audioCtx.createOscillator();
    o.type=p.types[i]||'sine';
    o.frequency.value=f;
    const g=audioCtx.createGain();
    g.gain.value=i===0?0.5:0.28;
    o.connect(g);g.connect(filter);
    // 慢速音量起伏，像呼吸
    const lfo=audioCtx.createOscillator();
    lfo.frequency.value=p.lfo+i*0.03;
    const lfoGain=audioCtx.createGain();
    lfoGain.gain.value=0.12;
    lfo.connect(lfoGain);lfoGain.connect(g.gain);
    lfo.start();o.start();
    ambientNodes.oscs.push(o);ambientNodes.lfos.push(lfo);
  });
  ambientNodes.profile=p;
}
function switchMusicForMode(mode){
  // 切换模块时平滑过渡到新场景音乐
  if(!isMusicOn||!audioCtx||!ambientNodes)return;
  const p=getMusicProfile(mode);
  if(ambientNodes.profile&&ambientNodes.profile===p)return;
  // 先平滑降低音量，重建图谱，再淡入
  ambientNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
  ambientNodes.master.gain.linearRampToValueAtTime(0.02,audioCtx.currentTime+0.4);
  setTimeout(()=>{
    buildAmbientGraph(mode);
    ambientNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
    ambientNodes.master.gain.linearRampToValueAtTime(p.gain,audioCtx.currentTime+1.2);
  },450);
}
function toggleMusic(){
  if(!audioCtx){
    try{initAmbient()}catch(e){showToast('当前浏览器不支持音频');return}
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  isMusicOn=!isMusicOn;
  const btn=$('#musicToggle');
  const settingToggle=$('#toggleMusicSetting');
  if(isMusicOn){
    ambientNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
    ambientNodes.master.gain.linearRampToValueAtTime(getMusicProfile(currentMode).gain,audioCtx.currentTime+1.5);
    btn.classList.add('active');
    btn.textContent='🎶';
    showToast('🎵 氛围音乐已开启 · '+getMusicProfile(currentMode).name);
  }else{
    ambientNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
    ambientNodes.master.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.8);
    btn.classList.remove('active');
    btn.textContent='🎵';
    showToast('🔇 氛围音乐已关闭');
  }
  if(settingToggle)settingToggle.classList.toggle('on',isMusicOn);
  localStorage.setItem('lingmou-music',isMusicOn?'1':'0');
}

// ========== 设置面板 ==========
function openSettings(){$('#settingsPanel').classList.add('open');$('#settingsOverlay').classList.add('open')}
function closeSettings(){$('#settingsPanel').classList.remove('open');$('#settingsOverlay').classList.remove('open')}
$('#settingsToggle').addEventListener('click',openSettings);

// ========== 字体面板事件 ==========
$('#fontPanel').addEventListener('click',e=>{
  if(e.target.classList.contains('font-btn'))applyFontStyle(e.target.dataset.style);
  if(e.target.classList.contains('size-btn'))applyFontSize(e.target.dataset.size);
});

// ========== 顶部按钮 ==========
$('#darkToggle').addEventListener('click',toggleDark);
$('#musicToggle').addEventListener('click',toggleMusic);

// ========== 键盘快捷键 ==========
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const keys={'1':'home','2':'identify','3':'safety','4':'social','5':'fun','6':'lab','7':'a11y','8':'stats'};
  if(keys[e.key])switchMode(keys[e.key]);
  if(e.key==='d'||e.key==='D')toggleDark();
  if(e.key==='m'||e.key==='M')toggleMusic();
  if(e.key==='Escape')closeSettings();
});

// ========== 初始化 ==========
const savedStyle=localStorage.getItem('lingmou-font-style');
const savedSize=localStorage.getItem('lingmou-font-size');
const savedDark=localStorage.getItem('lingmou-dark');
if(savedStyle)applyFontStyle(savedStyle);
if(savedSize)applyFontSize(savedSize);
if(savedDark==='1'){document.body.classList.add('dark');$('#toggleDark').classList.add('on');$('#darkToggle').textContent='☀️'}

render();
checkAchievements();
applyRewards();

// 首次访问引导提示
if(!localStorage.getItem('lingmou-visited')){
  setTimeout(()=>{
    showToast('👋 欢迎来到灵眸！按 1 回首页，2-8 切模块，M 开音乐');
    localStorage.setItem('lingmou-visited','1');
  },1200);
}
</script>
