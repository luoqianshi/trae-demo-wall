      color: var(--muted);
      margin-top: 4px;
      background: var(--bg);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .mc-time { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ========== 模态框 ========== */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--white);
      width: 100%;
      max-height: 90%;
      border-radius: 20px 20px 0 0;
      overflow-y: auto;
      animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal::-webkit-scrollbar { width: 0; }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 10px auto 4px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }
    .modal-close {
      background: var(--line2);
      border: none;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--ink2);
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--pink); color: #fff; }

    /* ========== 详情页 - 主流App视频/图片展示 ========== */
    /* 视频播放器/图片大图区 */
    .detail-player {
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .detail-player.bg-custom { background: linear-gradient(135deg, #3A1A18, #5C2820); }
    .detail-player.bg-food { background: linear-gradient(135deg, #1A2A1E, #2A3E2E); }
    .detail-player.bg-dialect { background: linear-gradient(135deg, #2A2018, #3E3020); }

    /* 播放按钮 */
    .player-center-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 2;
    }
    .player-center-btn:hover { background: var(--pink); border-color: var(--pink); transform: scale(1.1); }
    .player-center-btn svg { width: 24px; height: 24px; color: #fff; margin-left: 3px; }

    /* 播放器底部控制条 */
    .player-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }
    .player-progress {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      position: relative;
    }
    .player-progress::after {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 30%; height: 100%;
      background: var(--pink);
      border-radius: 2px;
    }
    .player-time {
      font-size: 10px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }
    .player-fullscreen svg { width: 16px; height: 16px; color: rgba(255,255,255,0.8); }

    /* 图片类型 - 大图展示无播放器控件 */
    .detail-player.is-image .player-controls { display: none; }
    .detail-player.is-image .player-center-btn { display: none; }

    /* 详情标题区 */
    .detail-title-bar {
      padding: 12px 16px;
      background: var(--white);
    }
    .dtb-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .dtb-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .dtb-meta span { display: flex; align-items: center; gap: 3px; }
    .dtb-meta svg { width: 14px; height: 14px; }
    .dtb-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .dtb-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    .dtb-tag.t-custom { background: var(--pink-dim); color: var(--pink); }
    .dtb-tag.t-food { background: #E0EBE0; color: var(--green); }
    .dtb-tag.t-dialect { background: #F0E5DC; color: var(--gold); }
    .dtb-tag.t-region { background: var(--blue-dim); color: var(--blue); }

    /* UP主信息条 */
    .detail-uploader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--white);
      border-top: 1px solid var(--line2);
      border-bottom: 1px solid var(--line2);
    }
    .du-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .du-info { flex: 1; }
    .du-name { font-size: 13px; font-weight: 700; color: var(--ink); }
    .du-desc { font-size: 10px; color: var(--muted); }
    .du-follow {
      background: var(--white);
      border: 1px solid var(--pink);
      color: var(--pink);

      font-size: 12px;
      font-weight: 600;

    .du-follow:hover { background: var(--pink); color: #fff; }

    /* 互动栏（点赞/投币/收藏/转发） */
    .detail-actions {
      display: flex;
      justify-content: space-around;
      padding: 10px 16px;

      border-bottom: 8px solid var(--bg);
    }
    .da-item {
      display: flex;

      transition: color 0.2s;
      color: var(--ink2);
    }
    .da-item:hover { color: var(--pink); }
    .da-item svg { width: 22px; height: 22px; }
    .da-item .da-count { font-size: 11px; font-weight: 600; }

    /* 溯源入口按钮 */
    .source-entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--white);
      border-bottom: 8px solid var(--bg);

      transition: background 0.2s;
    }
    .source-entry:hover { background: var(--bg); }
    .source-entry-icon {
      width: 40px; height: 40px;

      background: var(--pink-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .source-entry-text { flex: 1; }
    .source-entry-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .source-entry-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .source-entry-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    /* 溯源内容页样式 */
    .source-content {
      padding: 16px;
    }
    .source-hero {
      text-align: center;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--line2);
      margin-bottom: 16px;
    }
    .source-hero-emoji { font-size: 48px; margin-bottom: 8px; }
    .source-hero-title { font-size: 18px; font-weight: 700; color: var(--ink); }
    .source-hero-tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-top: 8px;
      background: var(--pink-dim);
      color: var(--pink);
    }
    .source-section { margin-bottom: 20px; }
    .source-section h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .source-section h4::before {
      content: '';
      width: 4px; height: 16px;
      background: var(--pink);
      border-radius: 2px;
    }
    .source-section p {
      font-size: 13px;
      line-height: 1.9;
      color: var(--ink2);
    }
    .source-section .source-steps {
      list-style: none;
      counter-reset: step;
    }
    .source-section .source-steps li {
      counter-increment: step;
      padding: 8px 0 8px 32px;
      position: relative;
      font-size: 13px;
      line-height: 1.8;
      color: var(--ink2);
    }
    .source-section .source-steps li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 7px;
      width: 22px; height: 22px;
      background: var(--pink);
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 评论区 - 主流App样式 */
    .comment-section {
      padding: 0 16px 16px;
      background: var(--white);
    }
    .comment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 10px;
      border-top: 8px solid var(--bg);
      margin: 0 -16px 0;
      padding-left: 16px;
      padding-right: 16px;
    }
    .ch-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .ch-count {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }
    .ch-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .ch-rating .ch-score {
      font-size: 16px;
      font-weight: 900;
      color: var(--star);
    }

    /* 评论列表 */
    .comment-list { }
    .comment-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line2);
    }
    .comment-item:last-child { border-bottom: none; padding-bottom: 60px; }
    .c-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .c-body { flex: 1; min-width: 0; }
    .c-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .c-stars { font-size: 10px; color: var(--star); }
    .c-text {
      font-size: 14px;
      margin-top: 4px;
      line-height: 1.6;
      color: var(--ink);
      word-break: break-word;
    }
    .c-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 6px;
    }
    .c-time { font-size: 11px; color: var(--muted); }
    .c-like {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s;
    }
    .c-like:hover { color: var(--pink); }
    .c-like svg { width: 14px; height: 14px; }
    .c-like.liked { color: var(--pink); }
    .c-like.liked svg { fill: var(--pink); }
    .c-reply {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .c-reply:hover { color: var(--pink); }

    /* 底部评论输入栏（sticky固定在modal底部） */
    .detail-bottom-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--white);
      border-top: 1px solid var(--line);
      z-index: 10;
    }
    .dbb-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .dbb-input:hover { background: var(--line2); }
    .dbb-input-text {
      font-size: 13px;
      color: var(--muted);
    }
    .dbb-input-icon {
      width: 22px; height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .dbb-input-icon:hover { color: var(--pink); }
    .dbb-input-icon svg { width: 20px; height: 20px; }
    .dbb-rating-btn {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 6px;
      transition: color 0.2s;
    }
    .dbb-rating-btn:hover { color: var(--star); }
    .dbb-rating-btn.has-rating { color: var(--star); }
    .dbb-rating-btn svg { width: 18px; height: 18px; }

    /* 评论编辑器弹窗 */
    .composer-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      align-items: flex-end;
    }
    .composer-overlay.show { display: flex; }
    .composer {
      background: var(--white);
      width: 100%;
      border-radius: 20px 20px 0 0;
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .composer-bar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .composer-close {
      background: var(--line2);
      border: none;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--ink2);
      transition: all 0.2s;
    }
    .composer-close:hover { background: var(--pink); color: #fff; }
    .composer-body { padding: 16px; }
    .composer-rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .composer-rating-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }
    .composer-stars {
      display: flex;
      gap: 8px;
    }
    .composer-stars span {
      font-size: 26px;
      color: var(--line);
      cursor: pointer;
      transition: color 0.15s;
      line-height: 1;
    }
    .composer-stars span.active { color: var(--star); }
    .composer-textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 14px;
      min-height: 100px;

      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    .composer-textarea:focus { border-color: var(--pink); background: var(--white); }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 16px;
    }
    .composer-count {
      font-size: 12px;
      color: var(--muted);
    }
    .composer-submit {
      background: var(--pink);
      color: #fff;
      border: none;
      padding: 8px 24px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .composer-submit:hover { background: var(--pink-light); }
    .composer-submit:disabled {
      background: var(--line);
      color: var(--muted);
      cursor: not-allowed;
    }

    /* 上传提交按钮 */
    .submit-btn {
      width: 100%;
      background: var(--pink);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--pink-light); }

    /* ========== 个人中心 ========== */
    .profile-header {
      background: var(--white);
      padding: 20px 16px;
      text-align: center;
      border-bottom: 8px solid var(--bg);
    }
    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 3px solid var(--white);
      box-shadow: 0 0 0 2px var(--pink);
    }
    .profile-name { font-size: 16px; font-weight: 700; color: var(--ink); }
    .profile-badge {
      display: inline-block;
      background: var(--pink-dim);
      color: var(--pink);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 10px;
      margin-top: 6px;
      font-weight: 600;
    }
    .profile-stats {
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      background: var(--white);
      border-bottom: 8px solid var(--bg);

    .stat-num { font-size: 19px; font-weight: 900; color: var(--ink); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .menu-list {
      background: var(--white);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--line2);
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg); }
    .menu-icon {
      width: 32px; height: 32px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .menu-label { flex: 1; font-size: 14px; font-weight: 500; color: var(--ink); }
    .menu-arrow { color: var(--muted); font-size: 16px; }

    /* ========== 上传表单 ========== */
    .upload-form { padding: 0 16px 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .form-group label .required { color: var(--pink); }
    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
    }
    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--pink); background: var(--white); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .upload-type-tabs { display: flex; gap: 6px; }
    .ut-tab {
      flex: 1;
      padding: 9px 4px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
      background: var(--bg);
      color: var(--ink2);
    }
    .ut-tab.active { background: var(--pink); color: #fff; border-color: var(--pink); }
    .upload-area {
      border: 2px dashed var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: var(--pink); }
    .upload-icon { font-size: 28px; margin-bottom: 6px; }

    /* ========== 地区面板 ========== */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px;
    }
    .region-card {
      padding: 16px;
      border-radius: var(--radius-lg);
      background: var(--bg);
      border: 2px solid var(--line);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .region-card:hover { border-color: var(--pink); }
    .region-card.active { border-color: var(--pink); background: var(--pink-dim); }
    .r-icon { font-size: 26px; margin-bottom: 6px; }
    .r-name { font-size: 13px; font-weight: 700; color: var(--ink); }
    .r-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      top: 55%; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 300;
      opacity: 0;

    function getAvatarColor(name) {
      var hash = 0;
      for (var i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
      return avatarColors[Math.abs(hash) % avatarColors.length];
    }

    function getTagName(type) {
      return type === 'custom' ? '习俗' : type === 'food' ? '饮食' : '方言';

    // ========== 初始化 ==========
    function init() {
      updateTime();
      setInterval(updateTime, 60000);
      renderRegions();

      renderForumList();
      renderMessages();
    }

    function updateTime() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('statusTime').textContent = h + ':' + m;
    }

    function switchTab(page) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('page-' + page).classList.add('active');
      var tab = document.querySelector('.tab-item[data-page="' + page + '"]');
      if (tab) tab.classList.add('active');
      document.getElementById('appContent').scrollTop = 0;
    }

    // ========== 首页 ==========
    function filterHome(cat) {
      currentCategory = cat;
      document.querySelectorAll('#homeCategories .cat-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.cat === cat);
      });
      renderHomeFeed();
    }

    function renderHomeFeed() {
      var feed = document.getElementById('homeFeed');
      var items = CONTENTS.filter(function(c) {
        if (c.region !== currentRegionId) return false;
        if (currentCategory === 'all') return true;
        return c.type === currentCategory;
      });

      if (items.length === 0) {
        feed.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">该分类暂无内容，快来上传第一条吧！</div></div>';
        return;
      }
      feed.innerHTML = items.map(renderVideoCard).join('');
    }

          '<span class="da-count">' + Math.floor(item.ratingCount * 0.5) + '</span>' +
        '</div>' +
        '<div class="da-item" onclick="showToast(\'分享链接已复制\')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' +
          '<span class="da-count">分享</span>' +
        '</div>' +
      '</div>';

      // 溯源入口按钮（取代内嵌描述区）
      var sourceEntryHtml = '<div class="source-entry" onclick="openSource(' + item.id + ')">' +
        '<div class="source-entry-icon">📜</div>' +
        '<div class="source-entry-text">' +
          '<div class="source-entry-title">文化溯源</div>' +
          '<div class="source-entry-desc">查看简介、历史渊源、文化特色等详细资料</div>' +
        '</div>' +
        '<div class="source-entry-arrow">›</div>' +
      '</div>';

      // 评论区
      var commentHtml = renderCommentSection(item);

      // 记录当前详情页ID（供评论编辑器使用）
      currentDetailItemId = item.id;

      document.getElementById('detailModalTitle').textContent = title;
      document.getElementById('detailModalBody').innerHTML = playerHtml + titleBarHtml + uploaderHtml + actionsHtml + sourceEntryHtml + commentHtml;
      openModal('detailOverlay');
    }

    // 溯源详情页
    function openSource(id) {
      var item = CONTENTS.find(function(c) { return c.id === id; });
      if (!item) return;

      var tagName = getTagName(item.type);
      var titleText = item.type === 'dialect' ? item.word + ' — ' + item.meaning : item.title;

      var html = '<div class="source-content">' +
        '<div class="source-hero">' +
          '<div class="source-hero-emoji">' + item.emoji + '</div>' +
          '<div class="source-hero-title">' + titleText + '</div>' +
          '<span class="source-hero-tag">' + tagName + '</span>' +
        '</div>';

      if (item.type === 'dialect') {
        html += srcSection('拼音', '<p>' + item.pinyin + '</p>') +
          srcSection('释义', '<p>' + item.meaning + '</p>') +
          srcSection('用法示例', '<p>' + item.example + '</p>');
      } else if (item.type === 'food') {
        html += srcSection('简介', '<p>' + item.desc + '</p>') +
          srcSection('历史渊源', '<p>' + item.detail.history + '</p>') +
          srcSection('所需食材', '<p>' + item.detail.ingredients + '</p>') +
          srcSection('做法步骤', '<ol class="source-steps">' + item.detail.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>');
      } else {
        html += srcSection('简介', '<p>' + item.desc + '</p>') +
          srcSection('历史溯源', '<p>' + item.detail.history + '</p>') +
          srcSection('文化特色', '<p>' + item.detail.features + '</p>');
      }

      html += '</div>';

      document.getElementById('sourceModalTitle').textContent = '文化溯源 · ' + tagName;
      document.getElementById('sourceModalBody').innerHTML = html;
      openModal('sourceOverlay');
    }

    // 溯源内容区块辅助函数
    function srcSection(title, contentHtml) {
      return '<div class="source-section"><h4>' + title + '</h4>' + contentHtml + '</div>';
    }

    function renderCommentSection(item) {
      var comments = COMMENTS[item.id] || [];
      var commentHtml = comments.map(function(c, idx) {
        var stars = '★'.repeat(c.stars) + '☆'.repeat(5 - c.stars);
        var color = getAvatarColor(c.name);
        return '<div class="comment-item">' +
          '<div class="c-avatar" style="background:' + color + '">' + c.name.charAt(0) + '</div>' +
          '<div class="c-body">' +
            '<div class="c-name">' + c.name + ' <span class="c-stars">' + stars + '</span></div>' +
            '<div class="c-text">' + c.text + '</div>' +
            '<div class="c-footer">' +
              '<span class="c-time">' + c.time + '</span>' +
              '<div class="c-like" id="like-' + item.id + '-' + idx + '" onclick="toggleLike(' + item.id + ',' + idx + ')">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' +
                '<span>' + c.likes + '</span>' +
              '</div>' +
              '<span class="c-reply" onclick="showToast(\'回复功能开发中...\')">回复</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      return '<div class="comment-section">' +
        '<div class="comment-header">' +
          '<div><span class="ch-title">评论</span><span class="ch-count">' + comments.length + '条</span></div>' +
          '<div class="ch-rating"><span class="ch-score">' + item.rating.toFixed(1) + '</span> ★ · ' + item.ratingCount + '人评分</div>' +
        '</div>' +
        '<div class="comment-list">' + (commentHtml || '<div class="empty-state" style="padding:24px;text-align:center"><div class="empty-text" style="font-size:13px;color:var(--muted)">暂无评论，快来发表第一条吧</div></div>') + '</div>' +
      '</div>';
    }

    // 评论编辑器状态
    var currentDetailItemId = null;
    var composerRating = 0;

    function openCommentComposer() {
      document.getElementById('composerOverlay').classList.add('show');
      // 重置状态
      composerRating = 0;
      document.getElementById('composerTextarea').value = '';
      updateComposerStars();
      updateComposerCount();
      // 自动聚焦
      setTimeout(function() {
        document.getElementById('composerTextarea').focus();
      }, 300);
    }

    function closeCommentComposer() {
      document.getElementById('composerOverlay').classList.remove('show');
      // 恢复默认placeholder
      document.getElementById('composerTextarea').placeholder = '说说这个内容是否符合当地实际情况...';
    }

    function setComposerRating(val) {
      composerRating = val;
      updateComposerStars();
      updateSubmitBtn();
    }

    function updateComposerStars() {
      document.querySelectorAll('#composerStars span').forEach(function(s) {
        s.classList.toggle('active', parseInt(s.dataset.val) <= composerRating);
      });
    }

    function updateComposerCount() {
      var text = document.getElementById('composerTextarea').value;
      var len = text.length;
      document.getElementById('composerCount').textContent = len + '/200';
      if (len > 200) {
        document.getElementById('composerTextarea').value = text.substring(0, 200);
        document.getElementById('composerCount').textContent = '200/200';
      }
      updateSubmitBtn();
    }

    function updateSubmitBtn() {
      var text = document.getElementById('composerTextarea').value.trim();
      var btn = document.getElementById('composerSubmit');
      // 评分或文字任一不为空即可发送
      btn.disabled = (composerRating === 0 && text.length < 5);
    }

    function toggleLike(itemId, commentIdx) {
      var el = document.getElementById('like-' + itemId + '-' + commentIdx);
      if (!el) return;
      var span = el.querySelector('span');
      var current = parseInt(span.textContent);
      if (el.classList.contains('liked')) {
        el.classList.remove('liked');
        span.textContent = current - 1;
      } else {
        el.classList.add('liked');
        span.textContent = current + 1;
        showToast('点赞成功');
      }
    }

    function submitComment() {
      var text = document.getElementById('composerTextarea').value.trim();
      if (composerRating === 0 && text.length < 5) {
        showToast('请输入至少5个字的评论或选择评分');
        return;
      }

      // 判断当前是在帖子详情还是内容详情
      var composerVisible = document.getElementById('composerOverlay').classList.contains('show');
      var postDetailVisible = document.getElementById('postDetailOverlay').classList.contains('show');

      if (postDetailVisible && currentPostId !== null) {
        // 帖子回复
        var post = FORUM_POSTS.find(function(p) { return p.id === currentPostId; });
        if (post) {
          if (!post.replyList) post.replyList = [];
          post.replyList.push({
            name: '文化记录者',
            color: '#C8503E',
            text: text,
            time: '刚刚'
          });
          post.replies = post.replyList.length;
          showToast('回复发表成功！');
          closeCommentComposer();
          openPostDetail(currentPostId);
        }
      } else if (currentDetailItemId !== null) {
        // 内容详情评论
        var itemId = currentDetailItemId;
        if (!COMMENTS[itemId]) COMMENTS[itemId] = [];
        COMMENTS[itemId].unshift({
          name: '文化记录者',
          stars: composerRating || 5,
          text: text || '已评分',
          time: '刚刚',
          likes: 0
        });
        showToast('评论发表成功！');
        closeCommentComposer();
        openDetail(itemId);
      }
    }

    // ========== 地区选择 ==========
    function renderRegions() {
      document.getElementById('regionGrid').innerHTML = REGIONS.map(function(r) {
        return '<div class="region-card' + (r.id === currentRegionId ? ' active' : '') + '" onclick="selectRegion(\'' + r.id + '\')">' +
          '<div class="r-icon">' + r.icon + '</div>' +
          '<div class="r-name">' + r.name + '</div>' +
          '<div class="r-desc">' + r.desc + '</div>' +
        '</div>';
      }).join('');
    }

    function selectRegion(id) {
      currentRegionId = id;
      // 切换地区时重置分类为"全部"
      currentCategory = 'all';
      document.querySelectorAll('#homeCategories .cat-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.cat === 'all');
      });
      var region = REGIONS.find(function(r) { return r.id === id; });
      document.getElementById('currentRegion').textContent = region.name;
      renderRegions();
      renderHomeFeed();
      renderForumList();
      closeModal('regionOverlay');
      showToast('已切换到 ' + region.name);
    }

    function openRegionPanel() { openModal('regionOverlay'); }

    // ========== 上传 ==========
    function openUploadModal() { openModal('uploadOverlay'); }

    function selectUploadType(type) {
      currentUploadType = type;
      document.querySelectorAll('.ut-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === type);
      });
    }

    function submitUpload() {
      var cat = document.getElementById('uploadCategory').value;
      var region = document.getElementById('uploadRegion').value;
      var title = document.getElementById('uploadTitle').value.trim();
      var desc = document.getElementById('uploadDesc').value.trim();
      if (!cat) { showToast('请选择内容分类'); return; }
      if (!region) { showToast('请选择所属地区'); return; }
      if (!title || title.length < 2) { showToast('标题至少2个字'); return; }
      if (!desc || desc.length < 10) { showToast('描述不少于10个字'); return; }
      showToast('上传成功！内容将在审核后展示');
      closeModal('uploadOverlay');
      document.getElementById('uploadCategory').value = '';
      document.getElementById('uploadRegion').value = '';
      document.getElementById('uploadTitle').value = '';
      document.getElementById('uploadDesc').value = '';
    }

    // ========== 通用 ==========
    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    });

    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    init();
  </script>
</body>
</html>
