  // ========= 片段选择页 =========
  function initSelectPage(){
    var html = '';
    SCENE_DATA.scenes.forEach(function(s, i){
      var isFeatured = s.id === 'baoyu-smash-jade';
      html += '<div class="scene-card' + (isFeatured ? ' featured' : '') + '" data-idx="' + i + '">';
      if(isFeatured) html += '<div class="s-badge">重要情节</div>';
      html += '<div class="s-num">0' + (i+1) + '</div>';
      html += '<div class="s-title">' + s.title + '</div>';
      html += '<div class="s-chapter">' + s.chapter + '</div>';
      html += '<div class="s-desc">' + s.description + '</div>';
      html += '<span class="s-tag">' + s.nodes.length + ' 个情节节点</span>';
      html += '</div>';
    });
    $sceneCards.innerHTML = html;

    Array.from($sceneCards.querySelectorAll('.scene-card')).forEach(function(card){
      card.addEventListener('click', function(){
        var idx = parseInt(this.dataset.idx);
        openScene(idx);
      });
    });
  }

  function openScene(idx){
    currentScene = SCENE_DATA.scenes[idx];
    currentIdx = 0;
    isPlaying = false;
    clearTimeout(playTimer);
    if(animFrame) cancelAnimationFrame(animFrame);
    prevNode = null;
    targetNode = null;

    $chapLabel.textContent = currentScene.chapter;
    $titleLabel.textContent = currentScene.title;
    $statusDot.classList.remove('playing');
    $playBtn.textContent = '▶ 播放';
    $textCard.classList.add('hidden');
    $recapOverlay.classList.remove('show');
    $selectPage.classList.add('hidden');
    $mainPage.classList.remove('hidden');

    resetView();
    initCanvas();
    buildTimeline();
    goToNode(0, true);
  }

  // ========= Canvas =========
  function initCanvas(){
    canvas = document.getElementById('liveCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();

    // ── 坐标校准工具：点击画布时打印虚拟坐标 (900×650) ──
    canvas.addEventListener('click', function(e){
      var rect = canvas.getBoundingClientRect();
      var sx = e.clientX - rect.left;
      var sy = e.clientY - rect.top;
      var vx = (sx - W/2) / camZoom + camX;
      var vy = (sy - H/2) / camZoom + camY;
      console.log('[坐标校准] 虚拟坐标: x=' + vx.toFixed(1) + ', y=' + vy.toFixed(1) + '  |  屏幕坐标: sx=' + sx.toFixed(1) + ', sy=' + sy.toFixed(1));
    });

    // ── 鼠标拖拽 ──
    canvas.addEventListener('mousedown', function(e){
      isUserInteracting = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartCamX = targetCamX;
      dragStartCamY = targetCamY;
      e.preventDefault();
    });

    window.addEventListener('mousemove', function(e){
      if(!isUserInteracting) return;
      if(e.buttons !== 1) return;
      var dx = (e.clientX - dragStartX) / camZoom;
      var dy = (e.clientY - dragStartY) / camZoom;
      targetCamX = dragStartCamX - dx;
      targetCamY = dragStartCamY - dy;
    });

    window.addEventListener('mouseup', function(e){
      if(!isUserInteracting) return;
      isUserInteracting = false;
    });

    // ── 滚轮缩放 ──
    canvas.addEventListener('wheel', function(e){
      isUserInteracting = true;
      e.preventDefault();
      var delta = -e.deltaY * 0.001;
      targetCamZoom = Math.max(0.5, Math.min(3.0, camZoom + delta * camZoom));
    }, {passive: false});

    // ── 触摸事件（移动端拖拽 + 双指缩放）──
    canvas.addEventListener('touchstart', function(e){
      isUserInteracting = true;
      if(e.touches.length === 1){
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        dragStartCamX = targetCamX;
        dragStartCamY = targetCamY;
      } else if(e.touches.length === 2){
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.sqrt(dx*dx + dy*dy);
        pinchStartZoom = camZoom;
      }
      e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchmove', function(e){
      if(!isUserInteracting) return;
      if(e.touches.length === 1){
        var dx = (e.touches[0].clientX - dragStartX) / camZoom;
        var dy = (e.touches[0].clientY - dragStartY) / camZoom;
        targetCamX = dragStartCamX - dx;
        targetCamY = dragStartCamY - dy;
      } else if(e.touches.length === 2){
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if(pinchStartDist > 0){
          targetCamZoom = Math.max(0.5, Math.min(3.0, pinchStartZoom * (dist / pinchStartDist)));
        }
      }
      e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchend', function(e){
      if(e.touches.length === 0){
        isUserInteracting = false;
      }
    });

    // ── 启动全局渲染循环 ──
    loop();
  }

  function resizeCanvas(){
    if(!canvas) return;
    var rect = $canvasWrap.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    W = rect.width;
    H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(currentScene) renderFrame();
  }

  window.addEventListener('resize', function(){
    resizeCanvas();
  });

  // ========= 时间轴 =========
  function buildTimeline(){
    var nodes = currentScene.nodes;
    var html = '';
    nodes.forEach(function(n, i){
      var pct = nodes.length === 1 ? 50 : (i / (nodes.length - 1)) * 100;
      html += '<div class="node" data-idx="' + i + '" style="left:' + pct + '%"></div>';
    });
    $timelineNodes.innerHTML = html;
    updateTimelineFill(0);
  }

  function updateTimelineFill(idx){
    var nodes = currentScene.nodes;
    var pct = nodes.length === 1 ? 0 : (idx / (nodes.length - 1)) * 100;
    $timelineFill.style.width = pct + '%';
    $timeLabel.textContent = currentScene.nodes[idx].time;

    var allNodes = Array.from($timelineNodes.querySelectorAll('.node'));
    allNodes.forEach(function(n, i){
      n.classList.remove('active', 'played');
      if(i === idx) n.classList.add('active');
      else if(i < idx) n.classList.add('played');
    });
  }

  // 时间轴拖动
  $timeline.addEventListener('click', function(e){
    if(isPlaying) return;
    isUserInteracting = false; // 恢复自动跟随
    var rect = $timeline.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    var nodes = currentScene.nodes;
    var idx = Math.round(pct * (nodes.length - 1));
    idx = Math.max(0, Math.min(idx, nodes.length - 1));
    goToNode(idx);
  });

  // ========= 节点跳转 =========
  // 根据 location 名查找建筑坐标
  function getBuildingByLocation(loc){
    var map = {
      '潇湘馆': 'xiaoxiang', '潇湘馆外': 'xiaoxiang',
      '怡红院': 'yihong',
      '蘅芜苑': 'hengwu',
      '沁芳闸': 'qinfangz', '沁芳闸→花冢': 'huazhong',
      '花冢': 'huazhong',
      '滴翠亭': 'dicui',
      '贾政书房': 'jiazheng'
    };
    var id = map[loc];
    return id ? findLocationById(id) : null;
  }

  function goToNode(idx, instant){
    if(idx === currentIdx && !instant) return;
    clearTimeout(recapTimer);
    prevNode = currentScene.nodes[currentIdx];
    targetNode = currentScene.nodes[idx];
    currentIdx = idx;

    // 镜头飞向当前节点所在地
    var loc = targetNode.location;
    var bld = getBuildingByLocation(loc);
    if(bld){
      focusOn(bld.x, bld.y, bld.w, bld.h);
    } else {
      // 按人物中心聚焦
      var sumX=0, sumY=0, cnt=0;
      targetNode.characters.forEach(function(c){ sumX+=c.x; sumY+=c.y; cnt++; });
      if(cnt>0) focusOn(sumX/cnt, sumY/cnt);
    }

    if(instant){
      camX = targetCamX; camY = targetCamY; camZoom = targetCamZoom;
      animProgress = 1;
      renderFrame();
      showTextCard();
    } else {
      animProgress = 0;
      animStart = performance.now();
      animateTransition();
    }

    updateTimelineFill(idx);

    // 到达末尾：等待动画播完 + 额外 3 秒阅读时间
    if(idx === currentScene.nodes.length - 1 && !instant){
      recapTimer = setTimeout(function(){
        if(!isPlaying) return;
        pausePlay();
        showRecap();
      }, animDuration + 3000);
    }
  }

  function animateTransition(){
    animFrame = requestAnimationFrame(function(ts){
      var elapsed = ts - animStart;
      animProgress = Math.min(elapsed / animDuration, 1);
      if(animProgress < 1){
        animateTransition();
      } else {
        showTextCard();
      }
    });
  }

  function showTextCard(){
    var node = currentScene.nodes[currentIdx];
    $tcSummary.textContent = node.summary;
    var tags = '';
    if(node.tags.space){
      tags += '<span class="tc-tag tag-space">📍 ' + node.tags.space + '</span>';
    }
    if(node.tags.emotion){
      tags += '<span class="tc-tag tag-emotion">💧 ' + node.tags.emotion + '</span>';
    }
    if(node.tags.characters){
      tags += '<span class="tc-tag tag-char">👤 ' + node.tags.characters + '</span>';
    }
    $tcTags.innerHTML = tags;
    $textCard.classList.remove('hidden');
  }

  // ========= Canvas 渲染 =========
  // 虚拟坐标系 900 x 650，紧凑府院布局
  var VW = 900, VH = 650;

  // 相机系统
  var camX = 450, camY = 325, camZoom = 1;
  var targetCamX = 450, targetCamY = 325, targetCamZoom = 1;
  var focusBuilding = null; // 当前高亮的建筑
  var isUserInteracting = false; // 用户是否正在拖拽/缩放
  var dragStartX = 0, dragStartY = 0; // 拖拽起始屏幕坐标
  var dragStartCamX = 0, dragStartCamY = 0; // 拖拽起始相机坐标
  var pinchStartDist = 0; // 双指起始距离
  var pinchStartZoom = 0; // 双指起始缩放

  function vx(v){ return v * W / VW; }
  function vy(v){ return v * H / VH; }
  function vr(v){ return v * Math.min(W/VW, H/VH); }

  function updateCamera(){
    var s = 0.04;
    camX += (targetCamX - camX) * s;
    camY += (targetCamY - camY) * s;
    camZoom += (targetCamZoom - camZoom) * s;
    if(Math.abs(targetCamX - camX) < 0.3) camX = targetCamX;
    if(Math.abs(targetCamY - camY) < 0.3) camY = targetCamY;
    if(Math.abs(targetCamZoom - camZoom) < 0.003) camZoom = targetCamZoom;
  }

  function focusOn(bx, by, bw, bh){
    if(bw && bh){
      targetCamX = bx + bw/2;
      targetCamY = by + bh/2;
      targetCamZoom = 1.3;
      focusBuilding = {x:bx, y:by, w:bw, h:bh};
    } else {
      targetCamX = bx;
      targetCamY = by;
      targetCamZoom = 1.3;
      focusBuilding = null;
    }
  }

  function resetView(){
    targetCamX = 450; targetCamY = 325; targetCamZoom = 1;
    focusBuilding = null;
  }

  function applyCamera(){
    ctx.save();
    var sc = camZoom;
    var ox = W/2 - camX * sc;
    var oy = H/2 - camY * sc;
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);
  }

  function restoreCamera(){ ctx.restore(); }

  // ========= 通用绘图组件 =========
  function drawLocation(ctx, loc, focus){
    // 统一锚点 + 标签绘制（所有类型共用）
    var cx = loc.x + loc.w/2, cy = loc.y + loc.h/2;
    switch(loc.type){
      case 'indoor':   drawIndoor(ctx, loc); break;
      case 'pavilion': drawPavilion(ctx, loc); break;
      case 'bridge':   drawBridgeShape(ctx, loc); break;
      case 'mound':    drawMound(ctx, loc); break;
      default:         drawIndoor(ctx, loc);
    }
    // 中心锚点：暗青色微小圆点
    ctx.fillStyle = 'rgba(107, 214, 199, 0.5)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI*2);
    ctx.fill();
    // 弱化标签：写在锚点正下方
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '9px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(loc.label, cx, cy + 5);
    ctx.textBaseline = 'alphabetic';
  }

    ctx.quadraticCurveTo(b.x + b.w/2, b.y - b.h/2, b.x + b.w, b.y + b.h/2);

  function drawHighlight(){

  // ========= 全局渲染循环 =========
  function loop(){
    renderFrame();
    requestAnimationFrame(loop);
  }

  function renderFrame(progressOverride){
    if(!currentScene) return; // 未进入场景时跳过
    updateCamera();
    var node = currentScene.nodes[currentIdx];
    var progress = progressOverride !== undefined ? progressOverride : 1;
    // 当没有外部传入 progress 时，使用 animProgress 做 easeInOutCubic
    if(progressOverride === undefined && prevNode){
      var t = animProgress;
      progress = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
    }
    var atmosphereColor = SCENE_DATA.atmosphereColors[node.atmosphere] || '#1a1d25';
    var emotionColors = SCENE_DATA.emotionColors;

    var chars = node.characters;
    var relations = node.relations;
    var bgColor = atmosphereColor;

    if(prevNode && progress < 1){
      var prevAtmo = SCENE_DATA.atmosphereColors[prevNode.atmosphere] || '#1a1d25';
      bgColor = lerpColor(prevAtmo, atmosphereColor, progress);
    }

    ctx.clearRect(0, 0, W, H);

    // 第一层：背景氛围
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);

    // 进入相机 transform
    applyCamera();

    // 第二层：建筑平面图
    drawMap();

    // 第三层：关系连线（直接使用虚拟坐标）
    relations.forEach(function(r){
      var fromChar = chars.find(function(c){return c.id === r.from});
      var toChar = chars.find(function(c){return c.id === r.to});
      if(!fromChar || !toChar) return;

      var fx = fromChar.x, fy = fromChar.y;
      var tx = toChar.x, ty = toChar.y;

      if(prevNode && progress < 1){
        var prevFrom = prevNode.characters.find(function(c){return c.id === r.from});
        var prevTo = prevNode.characters.find(function(c){return c.id === r.to});
        if(prevFrom){ fx = lerp(prevFrom.x, fx, progress); fy = lerp(prevFrom.y, fy, progress); }
        if(prevTo){ tx = lerp(prevTo.x, tx, progress); ty = lerp(prevTo.y, ty, progress); }
      }

      var colorMap = {gold: '#e8d5a3', gray: '#8b949e', red: '#d46d75', purple: '#d8a1ff'};
      var lineColor = colorMap[r.color] || '#e8d5a3';
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = r.width * 1.5;
      ctx.globalAlpha = 0.5 + (r.width || 1) * 0.15;

      if(r.style === 'dashed'){ ctx.setLineDash([8, 5]); }
      else if(r.style === 'zigzag'){ drawZigzag(ctx, fx, fy, tx, ty); ctx.setLineDash([]); ctx.globalAlpha = 1; return; }
      else { ctx.setLineDash([]); }

      // 贝塞尔弧线连线（带轻微弧度，像能量连接）
      var rcp = computeControlPoint(fx, fy, tx, ty, 0.12);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(rcp.x, rcp.y, tx, ty);
      ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.globalAlpha = 1;

    // 第四层：人物光晕圆点（直接使用虚拟坐标）
    chars.forEach(function(c){
      var cx = c.x, cy = c.y;

      if(prevNode && progress < 1 && c.moving){
        var prevChar = prevNode.characters.find(function(pc){return pc.id === c.id});
        if(prevChar){
          var cp = computeControlPoint(prevChar.x, prevChar.y, cx, cy, 0.2);
          var bp = bezierPoint({x:prevChar.x, y:prevChar.y}, {x:cx, y:cy}, cp, progress);
          cx = bp.x; cy = bp.y;
        }
      }

      var glowColor = emotionColors[c.emotion] || '#6bd6c7';
      if(prevNode && progress < 1){
        var prevChar = prevNode.characters.find(function(pc){return pc.id === c.id});
        if(prevChar && prevChar.emotion !== c.emotion){
          var prevGlow = emotionColors[prevChar.emotion] || '#6bd6c7';
          glowColor = lerpColor(prevGlow, glowColor, progress);
        }
      }

      var r = 22;
      var gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      gradient.addColorStop(0, glowColor);
      gradient.addColorStop(0.4, glowColor + '88');
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = glowColor;
      ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 11px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText(c.name, cx, cy + 26);
    });

    // 第五层：移动轨迹虚线（贝塞尔弧线）
    if(prevNode && progress < 1){
      var movingChars = chars.filter(function(c){return c.moving});
      movingChars.forEach(function(c){
        var prevChar = prevNode.characters.find(function(pc){return pc.id === c.id});
        if(!prevChar) return;
        var px = prevChar.x, py = prevChar.y;
        var cx = c.x, cy = c.y;
        var tcp = computeControlPoint(px, py, cx, cy, 0.2);

        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.moveTo(px, py);
        ctx.quadraticCurveTo(tcp.x, tcp.y, cx, cy);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }

    restoreCamera();
  }

  function drawZigzag(ctx, x1, y1, x2, y2){
    var dx = x2 - x1, dy = y2 - y1;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var segments = Math.ceil(dist / 20);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    for(var i = 1; i < segments; i++){
      var t = i / segments;
      var x = x1 + dx * t;
      var y = y1 + dy * t;
      var offset = (i % 2 === 0 ? 6 : -6);
      var nx = -dy / dist * offset;
      var ny = dx / dist * offset;
      ctx.lineTo(x + nx, y + ny);
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawArrow(ctx, x1, y1, x2, y2, color){
    var dx = x2 - x1, dy = y2 - y1;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var ux = dx/dist, uy = dy/dist;
    var ax = x2 - ux * 16, ay = y2 - uy * 16;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(ax - uy * 5, ay + ux * 5);
    ctx.lineTo(ax + uy * 5, ay - ux * 5);
    ctx.closePath();
    ctx.fill();
  }

  function lerp(a, b, t){ return a + (b - a) * t; }

  // 二次贝塞尔曲线：点 p0 → p1，控制点 cp，参数 t∈[0,1]
  function bezierPoint(p0, p1, cp, t){
    var u = 1 - t;
    return {
      x: u*u*p0.x + 2*u*t*cp.x + t*t*p1.x,
      y: u*u*p0.y + 2*u*t*cp.y + t*t*p1.y
    };
  }

  // 计算法向偏移控制点：在 p0→p1 连线的中垂线上，偏移量为两点距离的 offsetRatio 倍
  function computeControlPoint(x1, y1, x2, y2, offsetRatio){
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var dx = x2 - x1, dy = y2 - y1;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 1) return {x: mx, y: my};
    var offset = dist * (offsetRatio || 0.2);
    // 随机方向：用 id 哈希决定偏移方向的正负，保证同一对角色每次弧线方向一致
    var sign = ((x1 * 7 + y1 * 13 + x2 * 3 + y2 * 17) % 2 === 0) ? 1 : -1;
    return {
      x: mx + (-dy / dist) * offset * sign,
      y: my + (dx / dist) * offset * sign
    };
  }

  function lerpColor(c1, c2, t){
    var r1 = parseInt(c1.slice(1,3), 16), g1 = parseInt(c1.slice(3,5), 16), b1 = parseInt(c1.slice(5,7), 16);
    var r2 = parseInt(c2.slice(1,3), 16), g2 = parseInt(c2.slice(3,5), 16), b2 = parseInt(c2.slice(5,7), 16);
    var r = Math.round(lerp(r1, r2, t));
    var g = Math.round(lerp(g1, g2, t));
    var b = Math.round(lerp(b1, b2, t));
    return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
  }

  // ========= 播放控制 =========
  $playBtn.addEventListener('click', function(){
    isUserInteracting = false; // 恢复自动跟随
    if(isPlaying){
      pausePlay();
    } else {
      startPlay();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    isUserInteracting = false; // 恢复自动跟随
    pausePlay();
    resetView();
    goToNode(0, true);
  });

  function startPlay(){
    if(currentIdx >= currentScene.nodes.length - 1){
      currentIdx = 0;
      goToNode(0, true);
    }
    isPlaying = true;
    $playBtn.textContent = '⏸ 暂停';
    $statusDot.classList.add('playing');
    advancePlay();
  }

  function pausePlay(){
    isPlaying = false;
    $playBtn.textContent = '▶ 播放';
    $statusDot.classList.remove('playing');
    clearTimeout(playTimer);
  }

  function advancePlay(){
    if(!isPlaying) return;
    if(currentIdx >= currentScene.nodes.length - 1) return;
    goToNode(currentIdx + 1);
    playTimer = setTimeout(advancePlay, 4000);
  }

  // ========= 章末人物卡 =========
  document.getElementById('recapBtn').addEventListener('click', function(){
    showRecap();
  });

  document.getElementById('rpClose').addEventListener('click', function(){
    $recapOverlay.classList.remove('show');
  });

  $recapOverlay.addEventListener('click', function(e){
    if(e.target === $recapOverlay){
      $recapOverlay.classList.remove('show');
    }
  });

  function showRecap(){
    if(!currentScene) return;
    var recap = currentScene.recap;
    var chars = recap.characters;

    // 渲染标签
    var tabHtml = '';
    chars.forEach(function(c, i){
      tabHtml += '<button class="char-tab' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' + c.name + '</button>';
    });
    $charTabs.innerHTML = tabHtml;

    // 渲染第一个人物
    renderCharDetail(0);

    // 标签点击
    Array.from($charTabs.querySelectorAll('.char-tab')).forEach(function(tab){
      tab.addEventListener('click', function(){
        Array.from($charTabs.querySelectorAll('.char-tab')).forEach(function(t){t.classList.remove('active')});
        this.classList.add('active');
        renderCharDetail(parseInt(this.dataset.idx));
      });
    });

    $recapOverlay.classList.add('show');
  }

  function renderCharDetail(idx){
    var c = currentScene.recap.characters[idx];
    var html = '';
    html += '<div class="cd-header">';
    html += '<div class="cd-avatar">' + c.avatar + '</div>';
    html += '<div class="cd-name">' + c.name + '</div>';
    html += '</div>';

    html += '<div class="cd-section"><div class="cd-label">性格标签</div>';
    html += '<div class="cd-keywords">';
    c.keywords.forEach(function(k){ html += '<span class="cd-kw">' + k + '</span>'; });
    html += '</div></div>';

    html += '<div class="cd-section"><div class="cd-label">情绪曲线</div>';
    html += '<div class="cd-curve"><canvas id="curveCanvas' + idx + '"></canvas></div></div>';

    html += '<div class="cd-section"><div class="cd-label">空间轨迹</div>';
    html += '<div class="cd-path">' + c.path + '</div></div>';

    html += '<div class="cd-section"><div class="cd-label">互动关系</div>';
    html += '<div class="cd-interactions">';
    c.interactions.forEach(function(inter){ html += '<div class="cd-inter">' + inter + '</div>'; });
    html += '</div></div>';

    $charDetail.innerHTML = html;

    // 绘制情绪曲线
    setTimeout(function(){
      var curveCanvas = document.getElementById('curveCanvas' + idx);
      if(!curveCanvas) return;
      var dpr = window.devicePixelRatio || 1;
      var cw = curveCanvas.parentElement.clientWidth;
      var ch = 60;
      curveCanvas.width = cw * dpr;
      curveCanvas.height = ch * dpr;
      curveCanvas.style.width = cw + 'px';
      curveCanvas.style.height = ch + 'px';
      var cctx = curveCanvas.getContext('2d');
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var curve = c.emotion_curve;
      var maxVal = 100;
      var padding = 10;

      // 背景网格
      cctx.strokeStyle = 'rgba(255,255,255,0.04)';
      cctx.lineWidth = 0.5;
      for(var i = 0; i < 3; i++){
        var gy = padding + (ch - padding*2) * i / 2;
        cctx.beginPath(); cctx.moveTo(padding, gy); cctx.lineTo(cw - padding, gy); cctx.stroke();
      }

      // 折线
      var stepX = (cw - padding*2) / (curve.length - 1);
      cctx.strokeStyle = '#c9a96e';
      cctx.lineWidth = 2;
      cctx.beginPath();
      curve.forEach(function(v, i){
        var px = padding + stepX * i;
        var py = padding + (ch - padding*2) * (1 - v/maxVal);
        if(i === 0) cctx.moveTo(px, py);
        else cctx.lineTo(px, py);
      });
      cctx.stroke();

      // 点
      curve.forEach(function(v, i){
        var px = padding + stepX * i;
        var py = padding + (ch - padding*2) * (1 - v/maxVal);
        cctx.fillStyle = '#c9a96e';
        cctx.beginPath();
        cctx.arc(px, py, 4, 0, Math.PI*2);
        cctx.fill();
      });
    }, 100);
  }

  // ========= 返回 =========
  document.getElementById('backBtn').addEventListener('click', function(){
    pausePlay();
    resetView();
    $mainPage.classList.add('hidden');
    $selectPage.classList.remove('hidden');
    $recapOverlay.classList.remove('show');
  });

})();
</script>
