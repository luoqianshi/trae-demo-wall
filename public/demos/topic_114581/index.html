<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>小贝 · 适老陪伴 App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --paper:#EFE6D2;
  --paper-2:#F7F0DE;
  --surface:#FFFBF1;
  --surface-2:#FBF3E0;
  --ink:#241D14;
  --ink-2:#534635;
  --muted:#8C7B62;
  --line:#E0D2B4;
  --line-2:#D6C4A0;
  --vermillion:#B23A2C;
  --vermillion-dark:#8C2818;
  --vermillion-soft:#D9604E;
  --jade:#44715A;
  --jade-dark:#335A47;
  --gold:#B98B33;
  --gold-soft:#E2BE6A;
  --ink-wash:#2A1F12;
  --shadow-sm:0 4px 14px -6px rgba(70,45,15,.28);
  --shadow:0 18px 40px -18px rgba(70,45,15,.45);
  --shadow-lg:0 30px 70px -24px rgba(70,45,15,.55);
  --r:22px;
  --r-sm:14px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Noto Sans SC","Noto Serif SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 800px at 15% 10%, #E8DBBE 0%, transparent 55%),
    radial-gradient(1000px 700px at 85% 90%, #D9C49A 0%, transparent 50%),
    linear-gradient(135deg,#E3D4B0 0%, #CDB68A 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* paper grain overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.12 0 0 0 0 0.07 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/></svg>");
  opacity:.5;mix-blend-mode:multiply;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(178,58,44,.06), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(68,113,90,.07), transparent 45%);
}

/* desktop decorative seal */
.brand-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.brand-bg .seal{
  position:absolute;font-family:"Ma Shan Zheng",serif;color:rgba(178,58,44,.05);
  font-size:34vmin;line-height:1;user-select:none;
}
.brand-bg .seal.s1{top:-4vmin;left:-2vmin;transform:rotate(-8deg)}
.brand-bg .seal.s2{bottom:-6vmin;right:-2vmin;transform:rotate(6deg)}

/* ============ PHONE FRAME ============ */
.device{
  position:relative;z-index:2;
  width:402px;height:858px;max-height:96vh;
  background:linear-gradient(160deg,#2A2118,#15100A);
  border-radius:46px;padding:13px;
  box-shadow:var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,.06);
  flex-shrink:0;
}
.device::before{
  content:"";position:absolute;inset:6px;border-radius:40px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.04);
  pointer-events:none;z-index:5;
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:34px;overflow:hidden;
  background:var(--paper);
  display:flex;flex-direction:column;
}
.overlay2{position:absolute;inset:0;z-index:60}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:26px;background:#0a0805;
  border-radius:0 0 18px 18px;z-index:50;
}
.notch::after{
  content:"";position:absolute;right:26px;top:9px;width:9px;height:9px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4a55,#0c1014);
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ============ VIEW BASE ============ */
.view{min-height:100%;display:flex;flex-direction:column;position:relative}
.view-pad{padding:0 18px 120px}

/* ============ LOGIN ============ */
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;position:relative}
.login .seal-mark{
  width:104px;height:104px;border-radius:24px;
  background:linear-gradient(150deg,var(--vermillion),var(--vermillion-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:"Ma Shan Zheng",serif;color:#FBF1DC;font-size:64px;line-height:1;
  box-shadow:0 16px 40px -12px rgba(178,58,44,.7), inset 0 2px 0 rgba(255,255,255,.18);
  transform:rotate(-4deg);
  margin-bottom:26px;
  position:relative;
}
.login .seal-mark::after{
  content:"";position:absolute;inset:6px;border:1.5px solid rgba(255,255,255,.35);border-radius:18px;
}
.login h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:34px;margin:0 0 6px;letter-spacing:2px;color:var(--ink)}
.login .sub{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--vermillion);letter-spacing:1px;font-size:16px;margin-bottom:4px}
.login .tag{color:var(--ink-2);font-size:14px;margin-bottom:34px;font-weight:300}
.login .test-card{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 14px;box-shadow:var(--shadow-sm);margin-bottom:22px;text-align:left;
}
.login .test-card .tt{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;font-weight:500}
.login .test-card .row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.login .test-card .row:last-child{border-bottom:0}
.login .test-card .ava{width:42px;height:42px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;border:2px solid var(--surface-2)}
.login .test-card .info .n{font-weight:700;font-size:15px;color:var(--ink)}
.login .test-card .info .r{font-size:12px;color:var(--muted)}
.login .test-card .badge{margin-left:auto;font-size:11px;color:var(--jade);border:1px solid var(--jade);padding:2px 8px;border-radius:20px;font-weight:500}

.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:16px;transition:transform .15s, box-shadow .2s, background .2s;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,var(--vermillion),var(--vermillion-dark));
  color:#FBF1DC;padding:15px 28px;font-size:16px;width:100%;
  box-shadow:0 14px 30px -10px rgba(178,58,44,.6), inset 0 1px 0 rgba(255,255,255,.2);
  letter-spacing:1px;
}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);padding:11px 20px;font-size:14px}
.btn-jade{background:linear-gradient(135deg,var(--jade),var(--jade-dark));color:#F2EEDF;padding:13px 22px;font-size:15px;box-shadow:var(--shadow-sm)}
.login .foot{font-size:12px;color:var(--muted);margin-top:18px}

/* ============ MODE SELECT ============ */
.mode-select{flex:1;display:flex;flex-direction:column;padding:34px 24px 30px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mh .seal-sm{width:34px;height:34px;border-radius:9px;background:var(--vermillion);display:flex;align-items:center;justify-content:center;font-family:"Ma Shan Zheng",serif;color:#FBF1DC;font-size:22px;transform:rotate(-4deg)}
.mh .tt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;letter-spacing:1px}
.mode-select .lead{color:var(--ink-2);font-size:14px;margin:4px 0 30px;font-weight:300}
.mode-cards{display:flex;flex-direction:column;gap:16px;flex:1}
.mode-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .18s, box-shadow .2s;position:relative;overflow:hidden;
}
.mode-card:active{transform:scale(.98)}
.mode-card .ico{
  width:60px;height:60px;border-radius:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#FBF1DC;
}
.mode-card.elder .ico{background:linear-gradient(135deg,var(--vermillion),var(--vermillion-dark))}
.mode-card.young .ico{background:linear-gradient(135deg,var(--jade),var(--jade-dark))}
.mode-card .ico svg{width:30px;height:30px}
.mode-card .tx .t{font-family:"Noto Serif SC",serif;font-weight:700;font-size:19px;margin-bottom:3px}
.mode-card .tx .d{font-size:13px;color:var(--muted);font-weight:300}
.mode-card .arr{margin-left:auto;color:var(--muted)}
.mode-card .deco{position:absolute;right:-30px;bottom:-30px;font-family:"Ma Shan Zheng",serif;font-size:120px;color:rgba(178,58,44,.05);line-height:1}
.mode-card.young .deco{color:rgba(68,113,90,.06)}

.switch-row{display:flex;gap:8px;margin:14px 18px 0}
.switch-row .btn{flex:1}

/* ============ ELDER HOME ============ */
.e-top{
  padding:48px 22px 14px;display:flex;align-items:flex-end;justify-content:space-between;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(178,58,44,.10), transparent 60%),
    linear-gradient(180deg,#F7EFD9 0%, transparent 100%);
}
.e-top .greet .hi{font-size:13px;color:var(--muted);letter-spacing:1px;font-weight:400}
.e-top .greet .nm{font-family:"Noto Serif SC",serif;font-weight:900;font-size:27px;color:var(--ink);line-height:1.15;margin-top:2px}
.e-top .greet .nm em{font-style:normal;color:var(--vermillion)}
.e-top .date{font-family:"Noto Serif SC",serif;text-align:right}
.e-top .date .d{font-weight:700;font-size:15px;color:var(--ink)}
.e-top .date .l{font-size:11px;color:var(--muted);margin-top:2px}

.alma-strip{
  margin:0 18px 12px;background:linear-gradient(135deg,#FDF7E8,#F5E9C9);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow-sm);
}
.alma-strip .ic{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alma-strip .ic svg{width:18px;height:18px}
.alma-strip .tx{font-size:12.5px;color:var(--ink-2);flex:1;line-height:1.4}
.alma-strip .tx b{color:var(--vermillion)}
.alma-strip .arr{color:var(--muted)}

.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 18px}
.ecard{
  position:relative;border-radius:24px;overflow:hidden;cursor:pointer;
  aspect-ratio:1/1.18;background-size:cover;background-position:center;
  box-shadow:var(--shadow);transition:transform .2s;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
}
.ecard:active{transform:scale(.96)}
.ecard .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,8,.05) 0%,rgba(20,14,8,.05) 35%,rgba(20,14,8,.72) 100%)}
.ecard .badge{
  position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,251,241,.92);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;color:var(--vermillion);
  box-shadow:0 4px 10px -2px rgba(0,0,0,.3);
}
.ecard .badge svg{width:20px;height:20px}
.ecard .lbl{position:absolute;left:14px;bottom:13px;right:14px}
.ecard .lbl .t{font-family:"Noto Serif SC",serif;font-weight:900;color:#FBF1DC;font-size:21px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.ecard .lbl .s{font-size:11.5px;color:rgba(255,251,241,.82);margin-top:2px;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ecard .mode-tag{position:absolute;top:12px;left:12px;font-size:9px;letter-spacing:1px;background:rgba(20,14,8,.5);color:#fff;padding:3px 7px;border-radius:8px;font-weight:500;backdrop-filter:blur(4px)}

@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

.e-fab{
  position:absolute;bottom:18px;right:18px;z-index:30;
  width:50px;height:50px;border-radius:50%;background:rgba(36,29,20,.78);backdrop-filter:blur(6px);
  border:1px solid rgba(255,251,241,.18);color:#FBF1DC;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow);
}
.e-fab svg{width:22px;height:22px}

/* detail page (elder) */
.det-head{display:flex;align-items:center;gap:10px;padding:46px 18px 14px}
.det-head .back{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.det-head .t{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px}
.det-head .sub{font-size:12px;color:var(--muted);margin-left:auto}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 18px 30px}

/* ============ ACTION OVERLAYS ============ */
.overlay{position:absolute;inset:0;z-index:60;background:rgba(15,10,5,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:30px;width:calc(100% - 36px);max-width:360px;overflow:hidden;box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}

/* calling */
.calling{background:linear-gradient(180deg,#2A1F12,#150E06);color:#FBF1DC;text-align:center;padding:30px 26px}
.calling .ct{font-size:13px;letter-spacing:3px;color:rgba(255,251,241,.6);margin-bottom:30px}
.calling .ph-wrap{position:relative;width:150px;height:150px;margin:0 auto 22px}
.calling .ph-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(255,251,241,.2)}
.calling .ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(217,96,78,.5);animation:pulse 1.8s infinite}
.calling .ring.r2{animation-delay:.6s}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.calling .nm{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:700;margin-bottom:4px}
.calling .num{color:rgba(255,251,241,.55);font-size:15px;letter-spacing:2px;margin-bottom:34px}
.calling .status{color:var(--gold-soft);font-size:14px;margin-bottom:26px;min-height:20px}
.calling .hangup{width:68px;height:68px;border-radius:50%;background:var(--vermillion);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer;box-shadow:0 12px 30px -8px rgba(178,58,44,.7);border:0}
.calling .hangup svg{width:28px;height:28px}
.calling .hint{font-size:12px;color:rgba(255,251,241,.45);margin-top:14px}

/* player */
.player{padding:0}
.player .pcov{height:240px;background-size:cover;background-position:center;position:relative}
.player .pcov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,10,5,.7))}
.player .pbody{padding:20px 24px 26px}
.player .pt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px}
.player .pa{color:var(--muted);font-size:13px;margin-top:3px}
.player .pbar{height:5px;background:var(--line);border-radius:5px;margin:18px 0 6px;overflow:hidden}
.player .pbar i{display:block;height:100%;width:32%;background:linear-gradient(90deg,var(--vermillion),var(--vermillion-soft));border-radius:5px;transition:width .3s}
.player .ptime{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.player .pctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:18px}
.player .pctl .pbtn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--vermillion),var(--vermillion-dark));color:#FBF1DC;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;box-shadow:0 10px 24px -8px rgba(178,58,44,.6)}
.player .pctl .pbtn svg{width:26px;height:26px}
.player .pctl .sbtn{width:42px;height:42px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line)}
.player .pctl .sbtn svg{width:18px;height:18px}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px;justify-content:center;margin-top:14px}
.eq span{width:3px;background:var(--vermillion);border-radius:3px;animation:eq 1s infinite ease-in-out}
.eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}.eq span:nth-child(4){animation-delay:.45s}.eq span:nth-child(5){animation-delay:.6s}.eq span:nth-child(6){animation-delay:.3s}.eq span:nth-child(7){animation-delay:.15s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}

/* taxi */
.taxi{padding:26px 24px;text-align:center}
.taxi .tt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;margin-bottom:6px}
.taxi .dst{color:var(--vermillion);font-weight:700;font-size:15px;margin-bottom:18px}
.taxi .carmap{height:160px;border-radius:18px;background:linear-gradient(135deg,#E8DBBE,#D6C4A0);position:relative;overflow:hidden;margin-bottom:18px}
.taxi .carmap::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:28px 28px;opacity:.5}
.taxi .car{position:absolute;left:20px;bottom:30px;font-size:30px;animation:drive 2s infinite ease-in-out}
@keyframes drive{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.taxi .pin{position:absolute;right:30px;top:24px;color:var(--vermillion);font-size:26px}
.taxi .stbar{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:18px}
.taxi .stbar .dot{width:10px;height:10px;border-radius:50%;background:var(--jade);flex-shrink:0;box-shadow:0 0 0 4px rgba(68,113,90,.2)}
.taxi .stbar .dot.go{background:var(--gold);box-shadow:0 0 0 4px rgba(185,139,51,.2)}
.taxi .stbar .tx .a{font-weight:700;font-size:14px}.taxi .stbar .tx .b{font-size:11px;color:var(--muted)}

/* video player */
.vp{width:100%;background:#000;border-radius:30px 30px 0 0;overflow:hidden}
.vp video{width:100%;display:block;max-height:380px;background:#000}
.vp .vinfo{padding:16px 22px 24px}
.vp .vinfo .vt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px}
.vp .vinfo .va{color:var(--muted);font-size:13px;margin-top:3px}

/* album viewer */
.album-vw{position:absolute;inset:0;z-index:60;background:#0F0A05;display:flex;flex-direction:column}
.album-vw .abar{display:flex;align-items:center;gap:10px;padding:46px 18px 12px;color:#FBF1DC}
.album-vw .abar .back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer}
.album-vw .abar .t{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px}
.album-vw .astage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 14px;overflow:hidden}
.album-vw .atrack{display:flex;transition:transform .4s cubic-bezier(.2,.8,.2,1);width:100%}
.album-vw .atrack .slide{min-width:100%;text-align:center}
.album-vw .atrack .slide img{max-width:100%;max-height:62vh;border-radius:14px;box-shadow:0 20px 50px -16px rgba(0,0,0,.7)}
.album-vw .atrack .slide .cap{color:rgba(255,251,241,.8);font-size:13px;margin-top:12px;font-family:"Noto Serif SC",serif}
.album-vw .anav{display:flex;justify-content:space-between;padding:0 18px 8px}
.album-vw .anav .nb{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.album-vw .adots{display:flex;gap:6px;justify-content:center;padding:10px 0 26px}
.album-vw .adots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .25s}
.album-vw .adots i.on{background:var(--gold-soft);width:18px;border-radius:4px}

/* almanac modal */
.alm-modal{padding:0;width:calc(100% - 40px);max-width:360px}
.alm-top{background:linear-gradient(135deg,#7C2418,#B23A2C);color:#FBF1DC;padding:24px 22px;position:relative;overflow:hidden}
.alm-top::after{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23ffffff' stroke-width='1' opacity='0.1'/></svg>");opacity:.5}
.alm-top .gd{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:2px;opacity:.7}
.alm-top .dt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;margin-top:2px}
.alm-top .ln{font-size:13px;opacity:.85;margin-top:4px;font-family:"Noto Serif SC",serif}
.alm-body{padding:18px 22px 24px}
.alm-row{display:flex;gap:14px;margin-bottom:14px}
.alm-row .tag{flex-shrink:0;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px}
.alm-row.yi .tag{background:rgba(68,113,90,.15);color:var(--jade-dark)}
.alm-row.ji .tag{background:rgba(178,58,44,.13);color:var(--vermillion)}
.alm-row .items{font-size:14px;color:var(--ink);line-height:1.7;padding-top:6px}
.alm-row .items span{display:inline-block;margin-right:8px}
.alm-xtra{display:flex;gap:10px;border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.alm-xtra .xb{flex:1;background:var(--surface-2);border-radius:10px;padding:9px;text-align:center}
.alm-xtra .xb .k{font-size:10px;color:var(--muted)}
.alm-xtra .xb .v{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14px;color:var(--ink);margin-top:2px}
.alm-close{margin-top:16px;width:100%;background:var(--ink);color:#FBF1DC;padding:13px;border-radius:14px;border:0;font-weight:700;cursor:pointer;font-family:inherit}

/* ============ CONFIG ============ */
.c-top{padding:46px 20px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#F7EFD9,transparent)}
.c-top .back{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.c-top .t{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;flex:1}
.c-top .t .s{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;font-family:"Noto Sans SC"}

.elder-switch{margin:0 18px 18px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.elder-switch .es{
  flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:30px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;
}
.elder-switch .es .av{width:24px;height:24px;border-radius:50%;background-size:cover;background-position:center}
.elder-switch .es.on{background:var(--ink);color:#FBF1DC;border-color:var(--ink)}

.csec{margin:0 18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.csec-h{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.csec-h .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#FBF1DC}
.csec-h .ico svg{width:16px;height:16px}
.csec-h .tt{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;flex:1}
.csec-h .tt .d{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:1px;font-family:"Noto Sans SC"}
.csec-h .chev{color:var(--muted);transition:transform .25s}
.csec.open .csec-h .chev{transform:rotate(180deg)}
.csec-body{max-height:0;overflow:hidden;transition:max-height .3s}
.csec.open .csec-body{max-height:4000px}
.csec-inner{padding:6px 14px 14px}

/* elder card in config */
.elder-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px dashed var(--line)}
.elder-item:last-child{border-bottom:0}
.elder-item .av{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;border:2px solid var(--surface-2)}
.elder-item .info .n{font-weight:700;font-size:15px}.elder-item .info .r{font-size:12px;color:var(--muted)}
.elder-item .tag{margin-left:auto;font-size:11px;color:var(--jade);border:1px solid var(--jade);padding:2px 8px;border-radius:20px}

/* card config row */
.cfg-card{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px dashed var(--line)}
.cfg-card:last-child{border-bottom:0}
.cfg-card .prev{width:54px;height:54px;border-radius:13px;background-size:cover;background-position:center;flex-shrink:0;position:relative;overflow:hidden;border:1px solid var(--line)}
.cfg-card .prev .pi{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--vermillion)}
.cfg-card .prev .pi svg{width:11px;height:11px}
.cfg-card .prev .cov-edit{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:rgba(15,10,5,.6);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cfg-card .prev .cov-edit svg{width:11px;height:11px}
.cfg-card .prev{cursor:pointer}
.cfg-card .ci{flex:1}
.cfg-card .ci .ct{font-weight:700;font-size:14px;font-family:"Noto Serif SC",serif}
.cfg-card .ci .cs{font-size:11px;color:var(--muted);margin-top:2px}
.cfg-card .ctrl{display:flex;align-items:center;gap:6px}
.cfg-card .ud{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.cfg-card .ud:active{background:var(--line)}
.cfg-card .ud svg{width:14px;height:14px}

/* toggle */
.toggle{position:relative;width:64px;height:30px;border-radius:30px;background:var(--line);cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .22s, background .2s}
.toggle.det{background:var(--vermillion)}
.toggle.det .knob{left:37px}
.toggle-wrap{display:flex;align-items:center;gap:8px}
.toggle-lbl{font-size:10px;color:var(--muted);font-weight:500;min-width:34px;text-align:center}
.toggle-lbl.on{color:var(--vermillion);font-weight:700}

/* mode switch for card */
.mode-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;margin-top:8px}
.mode-switch .ms{flex:1;text-align:center;font-size:11px;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.mode-switch .ms.on{background:#fff;color:var(--vermillion);font-weight:700;box-shadow:var(--shadow-sm)}

/* content item */
.citem{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--line)}
.citem:last-child{border-bottom:0}
.citem .cv{width:42px;height:42px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--line)}
.citem .ci{flex:1;min-width:0}
.citem .ci .a{font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .ci .b{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .del{width:30px;height:30px;border-radius:8px;background:rgba(178,58,44,.08);color:var(--vermillion);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.citem .del svg{width:14px;height:14px}

.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1.5px dashed var(--line-2);border-radius:13px;background:transparent;color:var(--ink-2);cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;margin-top:10px}
.add-btn svg{width:16px;height:16px}

/* inline form */
.form-box{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}
.form-box .fg{margin-bottom:8px}
.form-box .fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
.form-box .fg input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;font-size:13px;color:var(--ink)}
.form-box .fg input:focus{outline:none;border-color:var(--vermillion)}
.form-box .frow{display:flex;gap:8px;margin-top:10px}
.form-box .frow .btn{flex:1;padding:9px;font-size:13px}

/* album grid in config */
.alb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.alb-grid .cell{aspect-ratio:1;background-size:cover;background-position:center;border-radius:9px;position:relative;border:1px solid var(--line)}
.alb-grid .cell .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(15,10,5,.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.alb-grid .cell .del svg{width:11px;height:11px}
.alb-grid .add-cell{aspect-ratio:1;border:1.5px dashed var(--line-2);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;background:transparent}

/* account link */
.acct{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px dashed var(--line)}
.acct:last-child{border-bottom:0}
.acct .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.acct .ico svg{width:19px;height:19px}
.acct .tx .a{font-weight:700;font-size:14px}.acct .tx .b{font-size:11px;color:var(--muted);margin-top:1px}
.acct .st{margin-left:auto;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.acct .st.on{background:rgba(68,113,90,.13);color:var(--jade-dark)}
.acct .st.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);cursor:pointer}

/* young relations */
.young-item{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px dashed var(--line)}
.young-item:last-child{border-bottom:0}
.young-item .av{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;border:2px solid var(--surface-2)}
.young-item .info .n{font-weight:700;font-size:14px}.young-item .info .r{font-size:11px;color:var(--muted)}

.section-tip{font-size:11px;color:var(--muted);padding:8px 6px 0;line-height:1.5}

/* toast */
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(36,29,20,.92);color:#FBF1DC;padding:11px 20px;border-radius:24px;font-size:13px;z-index:80;animation:toast .3s;box-shadow:var(--shadow)}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* hidden file input */
.file-input{position:absolute;width:0;height:0;opacity:0}

.c-foot{padding:18px;text-align:center}
.c-foot .lg{font-family:"Ma Shan Zheng",serif;color:var(--vermillion);font-size:22px}
.c-foot .sm{font-size:11px;color:var(--muted);margin-top:4px}

@media (max-width:480px){
  body{align-items:stretch;justify-content:stretch;background:var(--paper)}
  body::before,body::after{display:none}
  .brand-bg{display:none}
  .device{width:100%;height:100vh;max-height:100vh;border-radius:0;padding:0}
  .device::before{display:none}
  .screen{border-radius:0}
  .notch{display:none}
}

function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#screen').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* time-based greeting */
function greet(){
  const h = new Date().getHours();
  if(h<6) return '夜深了';
  if(h<11) return '早上好';
  if(h<13) return '中午好';
  if(h<18) return '下午好';
  return '晚上好';
}
function todayStr(){
  const d = new Date();
  const w=['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 · 周${w}`;
}
function lunarStr(){
  return '丙午年 乙未月 戊申日';
}

function openOverlay(html){
  closeOverlay();
  const o = document.createElement('div'); o.className='overlay'; o.id='overlay';
  o.innerHTML = html;
  o.addEventListener('click', e=>{ if(e.target===o && o.dataset.dismiss!=='0') closeOverlay(); });
  $('#screen').appendChild(o);
}
function closeOverlay(){
  const o = document.getElementById('overlay'); if(o) o.remove();
  if(state.taxiTimer){ clearInterval(state.taxiTimer); state.taxiTimer=null; }
  if(state.player.audio){ state.player.audio.pause(); state.player.audio=null; state.player.playing=false; }
}

function showCalling(contact){
  openOverlay(`
  <div class="sheet calling">
    <div class="ct">正在呼叫</div>
    <div class="ph-wrap">
      <div class="ring"></div><div class="ring r2"></div>
      <img src="${contact.photo}" alt=""/>
    </div>
    <div class="nm">${esc(contact.name)}</div>
    <div class="num">${esc(contact.phone)}</div>
    <div class="status" id="call-status">正在拨号...</div>
    <button class="hangup" data-act="hangup">${svg('phoneOff')}</button>
    <div class="hint">点击挂断</div>
  </div>`);
  const st = document.getElementById('call-status');
  let step=0;
  const steps=['正在拨号...','嘟... 嘟...','对方已接听，通话中','通话中...'];
  const tid = setInterval(()=>{
    step++;
    if(step<steps.length) st.textContent=steps[step];
    else clearInterval(tid);
  }, 1200);
  state.taxiTimer = tid;
}

function showPlayer(song){
  state.player.cur = song;
  state.player.playing = true;
  /* cleanup any previous audio WITHOUT going through closeOverlay (which would also clear the new one) */
  if(state.player.audio){ state.player.audio.pause(); state.player.audio=null; }
  if(state.taxiTimer){ clearInterval(state.taxiTimer); state.taxiTimer=null; }
  /* build the overlay first (openOverlay calls closeOverlay, which is fine - no audio yet) */
  openOverlay(`
  <div class="sheet player">
    <div class="pcov" style="background-image:url('${song.cover}')"></div>
    <div class="pbody">
      <div class="pt">${esc(song.title)}</div>
      <div class="pa">${esc(song.artist)}</div>
      <div class="pbar"><i id="pbar-fill"></i></div>
      <div class="ptime"><span id="pcur">00:00</span><span id="pdur">00:00</span></div>
      <div class="eq"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="pctl">
        <button class="sbtn" data-act="prev-song">${svg('prev')}</button>
        <button class="pbtn" id="play-btn" data-act="toggle-play">${svg('pause','pb')}</button>
        <button class="sbtn" data-act="next-song">${svg('next')}</button>
      </div>
    </div>
  </div>`);
  /* create audio AFTER overlay is in place, so closeOverlay won't kill it */
  const audio = new Audio(song.audio);
  audio.loop = true;
  state.player.audio = audio;
  audio.addEventListener('loadedmetadata', ()=>{
    const d=document.getElementById('pdur');
    if(d){ const s=Math.floor(audio.duration||0); d.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  });
  audio.play().catch(()=>{ state.player.playing=false; const b=document.getElementById('play-btn'); if(b) b.innerHTML=svg('play','pb'); });
  state.taxiTimer = setInterval(()=>{
    const f=document.getElementById('pbar-fill'); const cur=document.getElementById('pcur');
    if(!audio.duration){ return; }
    const pct = (audio.currentTime/audio.duration)*100;
    if(f) f.style.width=pct+'%';
    if(cur){ const s=Math.floor(audio.currentTime); cur.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  }, 250);
}

  if(host.innerHTML){ host.innerHTML=''; return; }
  let html='';
  if(type==='phone'){
    html=`<div class="form-box">
      <div class="fg"><label>姓名</label><input id="f-name" placeholder="如：大伯"></div>
      <div class="fg"><label>电话</label><input id="f-phone" placeholder="如：138 0000 0000"></div>
      <div class="fg"><label>照片链接（可留空，默认生成）</label><input id="f-photo" placeholder="https://..."></div>
      <div class="frow"><button class="btn btn-ghost" data-act="cancel-form" data-form="${type}">取消</button><button class="btn btn-primary" data-act="save-item" data-type="${type}">保存</button></div>
    </div>`;
  } else if(type==='taxi'){
    html=`<div class="form-box">
      <div class="fg"><label>名称</label><input id="f-name" placeholder="如：回家"></div>
      <div class="fg"><label>地址</label><input id="f-addr" placeholder="如：幸福家园小区"></div>
      <div class="fg"><label>底图链接（可留空）</label><input id="f-photo" placeholder="https://..."></div>
      <div class="frow"><button class="btn btn-ghost" data-act="cancel-form" data-form="${type}">取消</button><button class="btn btn-primary" data-act="save-item" data-type="${type}">保存</button></div>
    </div>`;
  } else if(type==='music'){
    html=`<div class="form-box">
      <div class="fg"><label>节目名</label><input id="f-title" placeholder="如：今日要闻"></div>
      <div class="fg"><label>来源/频道</label><input id="f-artist" placeholder="如：央视新闻"></div>
      <div class="fg"><label>音频链接（可留空，使用示例）</label><input id="f-audio" placeholder="https://...mp3"></div>
      <div class="frow"><button class="btn btn-ghost" data-act="cancel-form" data-form="${type}">取消</button><button class="btn btn-primary" data-act="save-item" data-type="${type}">上传</button></div>
    </div>`;
  } else if(type==='video'){
    html=`<div class="form-box">
      <div class="fg"><label>视频名</label><input id="f-title" placeholder="如：贵妃醉酒·海岛冰轮"></div>
      <div class="fg"><label>分类</label><input id="f-artist" placeholder="如：京剧"></div>
      <div class="fg"><label>视频链接（可留空，使用示例）</label><input id="f-video" placeholder="https://...mp4"></div>
      <div class="frow"><button class="btn btn-ghost" data-act="cancel-form" data-form="${type}">取消</button><button class="btn btn-primary" data-act="save-item" data-type="${type}">上传</button></div>
    </div>`;
  }
  host.innerHTML=html;
}

function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

function saveItem(type){
  const c = cardByType(type);
  if(type==='phone'){
    const name=val('f-name'); if(!name){ toast('请填写姓名'); return; }
    c.items.push({ id:uid(), name, phone:val('f-phone')||'未填写', photo:val('f-photo')||P.son });
  } else if(type==='taxi'){
    const name=val('f-name'); if(!name){ toast('请填写名称'); return; }
    c.items.push({ id:uid(), name, address:val('f-addr')||'未填写', photo:val('f-photo')||P.community });
  } else if(type==='music'){
    const title=val('f-title'); if(!title){ toast('请填写曲目名'); return; }
    c.items.push({ id:uid(), title, artist:val('f-artist')||'新闻', cover:P.news1, audio:val('f-audio')||'demo.mp3' });
  } else if(type==='video'){
    const title=val('f-title'); if(!title){ toast('请填写视频名'); return; }
    c.items.push({ id:uid(), title, artist:val('f-artist')||'京剧', cover:P.operaV, video:val('f-video')||'demo.mp4' });
  }
  toast('已添加');
  render();
}

/* cover editor */
const COVER_AI = {
  phone: ()=>P.daughter,
  taxi: ()=>P.community,
  music: ()=>P.news1,
  video: ()=>P.operaV,
  album: ()=>P.fam1,
  almanac: ()=>P.alm,

function showCoverForm(type){

  if(!host) return;

  host.innerHTML = `<div class="form-box">
    <div class="fg"><label>底图链接</label><input id="cov-url" placeholder="粘贴图片地址 https://..."></div>
    <div class="frow">
      <button class="btn btn-ghost" data-act="cancel-cover" data-type="${type}">取消</button>
      <button class="btn btn-ghost" data-act="ai-cover" data-type="${type}">AI 生成</button>
      <button class="btn btn-primary" data-act="save-cover" data-type="${type}">应用</button>
    </div>

function saveCover(type){
  const url = val('cov-url');
  if(!url){ toast('请输入图片地址或点 AI 生成'); return; }
  cardByType(type).cover = url;
  toast('底图已更新');
  render();
}

/* ============================================================
   ACTIONS
============================================================ */
function handle(act, d, el){
  switch(act){
    case 'goto-login': state.view='login'; render(); break;
    case 'goto-mode': closeOverlay(); state.view='mode'; render(); break;
    case 'enter-elder': state.view='elder'; render(); break;
    case 'enter-config': state.view='config'; render(); break;
    case 'login-young': state.view='config'; render(); break;
    case 'login-elder': state.view='elder'; render(); break;

    /* elder cards */
    case 'tap-card': {
      if(d.type==='phone-single'){
        const it=cardByType('phone').items.find(x=>x.id===d.itemid); if(it) showCalling(it);
        return;
      } else if(d.type==='taxi-single'){
        const it=cardByType('taxi').items.find(x=>x.id===d.itemid); if(it) showTaxi(it);
        return;
      }
      const c = cardByType(d.type);
      if(!c) return;
      if(c.type==='almanac'){ showAlmanac(); return; }
      if(c.type==='music'){ const it=c.items[0]; if(it) showPlayer(it); return; }
      if(c.type==='video'){ const it=c.items[0]; if(it) showVideo(it); return; }
      if(c.type==='album'){ if(c.items.length) showAlbum(0); return; }
      state._detailType = d.type;
      $('#app').innerHTML = renderElderDetail(d.type);
      $('#app').scrollTop=0;
      break;
    }
    case 'back-elder': state.view='elder'; render(); break;
    case 'call-contact': { const it=cardByType('phone').items.find(x=>x.id===d.id); if(it) showCalling(it); break; }
    case 'call-taxi': { const it=cardByType('taxi').items.find(x=>x.id===d.id); if(it) showTaxi(it); break; }
    case 'play-song': { const it=cardByType('music').items.find(x=>x.id===d.id); if(it) showPlayer(it); break; }
    case 'play-video': { const it=cardByType('video').items.find(x=>x.id===d.id); if(it) showVideo(it); break; }
    case 'open-album': showAlbum(parseInt(d.idx)); break;
    case 'open-almanac': showAlmanac(); break;

    /* player */
    case 'toggle-play': {
      state.player.playing=!state.player.playing;
      const btn=document.getElementById('play-btn');
      if(btn) btn.innerHTML = state.player.playing?svg('pause','pb'):svg('play','pb');
      if(state.player.audio){
        if(state.player.playing){ state.player.audio.play().catch(()=>{}); }
        else { state.player.audio.pause(); }
      }
      break;
    }
    case 'prev-song': case 'next-song': {
      const c=cardByType('music'); const idx=c.items.findIndex(x=>x.id===state.player.cur.id);
      const ni = act==='prev-song' ? (idx-1+c.items.length)%c.items.length : (idx+1)%c.items.length;
      showPlayer(c.items[ni]);
      break;
    }

    /* album nav */
    case 'album-prev': case 'album-next': {
      const c=cardByType('album'); const n=c.items.length;
      state.albumIndex = (state.albumIndex + (act==='album-prev'?-1:1) + n) % n;
      const tr=document.getElementById('atrack'); if(tr) tr.style.transform=`translateX(-${state.albumIndex*100}%)`;
      document.querySelectorAll('.adots i').forEach((el,i)=>el.className = i===state.albumIndex?'on':'');
      document.querySelector('.abar .t').textContent = `${state.albumIndex+1} / ${n}`;
      break;
    }

    case 'hangup': case 'close-overlay': closeOverlay(); break;

    /* config */
    case 'switch-elder': state.currentElderId=d.id; render(); break;
    case 'toggle-sec': {
      const sec=el.closest('.csec'); sec.classList.toggle('open');
      break;
    }
    case 'set-mode': {
      const c=cardByType(d.type); c.openMode=d.mode;
      render();
      break;
    }
    case 'move-card': {
      const cs=cards(); cs.forEach((c,i)=>c.order=i);
      const sorted=[...cs].sort((a,b)=>(a.order??0)-(b.order??0));
      const idx=sorted.findIndex(c=>c.type===d.type);
      const ni=idx+parseInt(d.dir);
      if(ni<0||ni>=sorted.length) return;
      const a=sorted[idx], b=sorted[ni];
      const ao=a.order, bo=b.order; a.order=bo; b.order=ao;
      render();
      break;
    }
    case 'del-item': {
      const c=cardByType(d.type);
      c.items=c.items.filter(x=>x.id!==d.id);
      if(c.type==='album'){ const n=c.items.length; if(state.albumIndex>=n) state.albumIndex=Math.max(0,n-1); }
      toast('已删除');
      render();
      break;
    }
    case 'add-form': showForm(d.form); break;
    case 'cancel-form': { const h=document.getElementById('form-'+d.form); if(h) h.innerHTML=''; break; }
    case 'save-item': saveItem(d.type); break;
    case 'edit-cover': showCoverForm(d.type); break;
    case 'cancel-cover': { const h=document.getElementById('form-cover-'+d.type); if(h) h.innerHTML=''; break; }
    case 'ai-cover': {
      const u = (COVER_AI[d.type]||P.opera)();
      const inp=document.getElementById('cov-url'); if(inp) inp.value=u;
      toast('已填入 AI 生成地址');
      break;
    }
    case 'save-cover': saveCover(d.type); break;
    case 'upload-album': document.getElementById('album-file').click(); break;
    case 'toggle-acct': {
      const a=cfg().accounts[d.key]; a.linked=!a.linked;
      toast(a.linked?'已关联':'已解除');
      render();
      break;
    }
    case 'add-elder': toast('已发送邀请链接给长辈'); break;

  }
}

/* album file upload */
function handleAlbumUpload(file){
  const r=new FileReader();
  r.onload=e=>{
    const c=cardByType('album');
    c.items.push({ id:uid(), photo:e.target.result, cap:'新上传' });
    toast('已上传到相册');
    render();
  };
  r.readAsDataURL(file);
}

============================================================ */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(el){
    handle(el.dataset.act, el.dataset, el);
  }
});

// hidden album file input
const af = document.createElement('input');
af.type='file'; af.accept='image/*'; af.className='file-input'; af.id='album-file';
af.addEventListener('change', e=>{ if(e.target.files[0]) handleAlbumUpload(e.target.files[0]); });
document.body.appendChild(af);

render();
