  <style id="theme-vars">
/* Decision Check - Morandi Luminous Palette Brand CSS */
/* Morandi tones lifted: brighter chroma, translucent surfaces, airy warmth */

:root {
  /* === Brand Colors (Morandi Luminous) === */
  --color-primary: #9a8b72;
  --color-primary-light: #c4b49e;
  --color-primary-lighter: #e4d8c8;
  --color-primary-lightest: #f5f0e8;
  --color-primary-dark: #7a6c55;
  --color-primary-darker: #5a4e3a;

  /* Accent warm terra cotta — slightly more saturated */
  --color-accent: #c96b50;
  --color-accent-light: #e0957e;
  --color-accent-lighter: #f0c0b0;
  --color-accent-lightest: #f8e4dc;
  --color-accent-dark: #a85535;

  /* Morandi sage green — fresher */
  --color-secondary: #6d9e7c;
  --color-secondary-light: #98c4a8;
  --color-secondary-lighter: #c4e4d0;
  --color-secondary-dark: #4e8060;

  /* Morandi muted teal — clearer */
  --color-info: #5e9292;
  --color-info-light: #8ec4c4;
  --color-info-lighter: #c0e4e4;

  /* Surfaces — lifted, translucent feel */
  --color-surface: #faf8f5;
  --color-surface-elevated: #ffffff;
  --color-surface-overlay: rgba(90, 78, 58, 0.55);
  --color-surface-sunken: #f2ede6;
  --color-surface-glass: rgba(255, 255, 255, 0.65);

  /* Text — higher contrast */
  --color-text-primary: #3e352a;
  --color-text-secondary: #6e6358;
  --color-text-tertiary: #9a8e82;
  --color-text-inverse: #faf8f5;

  /* Borders — crisper */
  --color-border: #ddd5c8;
  --color-border-subtle: #ece7df;
  --color-border-strong: #c0b4a4;

  /* State colors */
  --state-success: #6d9e7c;
  --state-warning: #d4a030;
  --state-error: #c96b50;
  --state-info: #5e9292;

  /* === Typography === */
  --font-family-display: 'Noto Serif SC', 'Georgia', serif;
  --font-family-body: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-family-variable: 'InterVariable', 'Inter', sans-serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.875rem;
  --font-size-4xl: 2.25rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-snug: 1.375;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.75;

  --letter-spacing-tight: -0.025em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.05em;
  --letter-spacing-wider: 0.1em;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;

  /* === Shape === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Depth === */
  --shadow-sm: 0 1px 2px rgba(62, 53, 42, 0.04);
  --shadow-md: 0 4px 12px rgba(62, 53, 42, 0.05);
  --shadow-lg: 0 8px 24px rgba(62, 53, 42, 0.05);
  --shadow-float: 0 12px 32px rgba(62, 53, 42, 0.1);
  --shadow-glass: 0 8px 32px rgba(62, 53, 42, 0.06), inset 0 1px 0 rgba(255,255,255,0.5);

  /* === Motion === */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;

  /* === Chart Colors (Morandi Luminous) === */
  --chart-accent: #c96b50;
  --chart-accent2: #5e9292;
  --chart-series-1: #9a8b72;
  --chart-series-2: #c96b50;
  --chart-series-3: #6d9e7c;
  --chart-series-4: #5e9292;
  --chart-grid: #ddd5c8;
  --chart-text: #6e6358;
  --chart-bg: #faf8f5;
  --chart-threshold: #c96b50;

  /* === Variable Font Weight Range === */
  --font-weight-breath-min: 300;
  --font-weight-breath-max: 700;
}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=InterVariable:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* === Reset & Base === */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
        font-size: 16px;
    }

    body {
        background: #faf8f5;
        color: #3e352a;
        font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* === Custom Scrollbar (Light Theme) === */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #faf8f5; }
    ::-webkit-scrollbar-thumb { background: #c0b4a4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #9a8b72; }

    /* === Scroll Reveal === */
    .reveal-section {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-section.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* === Nav === */
    .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 0 32px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(250, 248, 245, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(192, 180, 164, 0.5);
        transition: background 0.3s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .nav.scrolled {
        background: rgba(250, 248, 245, 0.95);
    }
    .nav-logo {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #3e352a;
        letter-spacing: 0.02em;
        text-decoration: none;
    }
    .nav-btn-ghost {
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 8px 20px;
        border-radius: 9999px;
        border: 1px solid rgba(192, 180, 164, 0.5);
        background: transparent;
        color: #6e6358;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-btn-ghost:hover {
        color: #3e352a;
        border-color: rgba(221, 213, 200, 0.5);
        background: rgba(221, 213, 200, 0.06);
    }
    .nav-btn-ghost:active {
        background: rgba(221, 213, 200, 0.03);
    }
    .nav-btn-ghost:focus-visible {
        outline: 2px solid #c96b50;
        outline-offset: 2px;
    }

    /* === Glass Card === */
    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(221, 213, 200, 0.6);
        border-radius: 12px;
        position: relative;
    }

    /* === Hero Section (Compact) === */
    .hero-section {
        min-height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 120px 24px 64px;
        position: relative;
        background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(201, 107, 80, 0.08) 0%, rgba(94, 146, 146, 0.06) 40%, transparent 70%), #faf8f5;
    }
    .hero-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 30% 20%, rgba(154, 139, 114, 0.06) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(109, 158, 124, 0.05) 0%, transparent 50%);
        pointer-events: none;
    }
    .hero-section h1 {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 700;
        color: #3e352a;
        text-shadow: none;
        margin-bottom: 16px;
        line-height: 1.3;
        letter-spacing: -0.01em;
        position: relative;
        z-index: 1;
        text-wrap: balance;
        word-break: keep-all;
    }
    .hero-section .hero-subtitle {
        font-size: clamp(0.9375rem, 1.8vw, 1.0625rem);
        color: #9a8e82;
        max-width: 520px;
        line-height: 1.75;
        margin-bottom: 32px;
        position: relative;
        z-index: 1;
        text-shadow: none;
    }
    .decision-quote {
        position: relative;
        z-index: 1;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 32px;
        text-align: center;
    }
    .decision-quote::before {
        content: '\201C';
        position: absolute;
        top: -8px;
        left: 16px;
        font-size: 3.5rem;
        font-family: 'Noto Serif SC', Georgia, serif;
        color: #c96b50;
        opacity: 0.3;
        line-height: 1;
    }
    .decision-quote-text {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #6e6358;
        line-height: 1.5;
        font-style: italic;
    }
    .decision-quote-row {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 720px;
        margin: 0 auto;
        flex-wrap: wrap;
        justify-content: center;
    }
    .change-decision-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #9a8e82;
        padding: 8px 16px;
        border: 1px solid rgba(221, 213, 200, 0.5);
        border-radius: 9999px;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        white-space: nowrap;
        flex-shrink: 0;
    }
    .change-decision-btn:hover {
        color: #6e6358;
        border-color: rgba(192, 180, 164, 0.6);
        background: rgba(236, 231, 223, 0.4);
    }
    .change-decision-btn:active {
        background: rgba(236, 231, 223, 0.2);
    }
    .change-decision-btn:focus-visible {
        outline: 2px solid #c96b50;
        outline-offset: 2px;
    }

    /* === Section Common === */
    .section-inner {
        padding: 80px 24px;
        max-width: 1000px;
        margin: 0 auto;
    }

    /* === Dimension Cards Grid === */
    .dimensions-section {
        background: #f2ede6;
        border-top: 1px solid rgba(236, 231, 223, 0.8);
        border-bottom: 1px solid rgba(221, 213, 200, 0.6);
    }
    .dimensions-section .section-title {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: clamp(1.375rem, 3vw, 1.75rem);
        font-weight: 700;
        color: #3e352a;
        text-align: center;
        margin-bottom: 48px;
        text-shadow: none;
        letter-spacing: -0.01em;
        text-wrap: balance;
        word-break: keep-all;
    }
    .dimensions-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
    }

    /* === Dimension Card === */
    .dim-card {
        padding: 28px;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: default;
    }
    .dim-card:hover {
        transform: translateY(-6px);
    }
    .dim-card[data-color="c96b50"]:hover {
        box-shadow: 0 12px 40px rgba(201, 107, 80, 0.15);
    }
    .dim-card[data-color="5e9292"]:hover {
        box-shadow: 0 12px 40px rgba(94, 146, 146, 0.15);
    }
    .dim-card[data-color="6d9e7c"]:hover {
        box-shadow: 0 12px 40px rgba(109, 158, 124, 0.15);
    }
    .dim-card[data-color="9a8b72"]:hover {
        box-shadow: 0 12px 40px rgba(154, 139, 114, 0.15);
    }

    /* Card header */
    .dim-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }
    .dim-card-name {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: 1.5rem;
        font-weight: 700;
    }
    .dim-score-badge {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: #faf8f5;
        flex-shrink: 0;
    }

    /* Credibility pill */
    .credibility-pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 12px;
        letter-spacing: 0.03em;
    }
    .credibility-high {
        background: rgba(109, 158, 124, 0.15);
        color: #6d9e7c;
        border: 1px solid rgba(109, 158, 124, 0.35);
    }
    .credibility-medium {
        background: rgba(212, 160, 48, 0.15);
        color: #d4a030;
        border: 1px solid rgba(212, 160, 48, 0.35);
    }
    .credibility-low {
        background: rgba(201, 107, 80, 0.15);
        color: #c96b50;
        border: 1px solid rgba(201, 107, 80, 0.35);
    }

    /* Summary */
    .dim-summary {
        font-size: 0.9375rem;
        color: #9a8e82;
        line-height: 1.5;
        margin-bottom: 16px;
    }

    /* Toggle button */
    .dim-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        background: none;
        border: none;
        color: #6e6358;
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        padding: 6px 0;
        transition: color 0.3s ease;
    }
    .dim-toggle:hover {
        color: #9a8e82;
    }
    .dim-toggle svg {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        flex-shrink: 0;
    }
    .dim-toggle.expanded svg {
        transform: rotate(180deg);
    }

    /* Collapsible details panel */
    .dim-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        opacity: 0;
    }
    .dim-details.open {
        max-height: 600px;
        opacity: 1;
    }
    .dim-details-inner {
        padding-top: 16px;
        margin-top: 8px;
        border-top: 1px solid rgba(221, 213, 200, 0.5);
    }

    /* Basis text */
    .dim-basis {
        font-size: 0.875rem;
        color: #9a8e82;
        line-height: 1.75;
        margin-bottom: 20px;
    }

    /* Indicators */
    .dim-indicators-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: #6e6358;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
    }
    .dim-indicator-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    .dim-indicator-label {
        font-size: 0.8125rem;
        color: #9a8e82;
        min-width: 80px;
        flex-shrink: 0;
    }
    .dim-indicator-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(221, 213, 200, 0.6);
        border-radius: 3px;
        overflow: hidden;
    }
    .dim-indicator-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        width: 0;
    }
    .dim-indicator-bar-fill.animated {
        /* width set via inline style */
    }
    .dim-indicator-value {
        font-size: 0.75rem;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        color: #6e6358;
        min-width: 36px;
        text-align: right;
        flex-shrink: 0;
    }

    /* Sources */
    .dim-sources {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(236, 231, 223, 0.8);
    }
    .dim-sources-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: #6e6358;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    .dim-source-item {
        font-size: 0.75rem;
        color: #6e6358;
        line-height: 1.6;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
    }

    /* === Total Score Section === */
    .total-section {
        background: #faf8f5;
        border-top: 1px solid rgba(236, 231, 223, 0.8);
        border-bottom: 1px solid rgba(221, 213, 200, 0.6);
    }
    .total-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 80px 24px;
        max-width: 600px;
        margin: 0 auto;
    }
    .total-score-circle {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 4px 16px rgba(62, 53, 42, 0.06);
        border: 2px solid rgba(201, 107, 80, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        position: relative;
    }
    .total-score-circle::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(201, 107, 80, 0.1), rgba(94, 146, 146, 0.1));
        z-index: -1;
        filter: blur(8px);
    }
    .total-score-number {
        font-family: 'Noto Serif SC', Georgia, serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #3e352a;
        line-height: 1;
    }
    .total-score-number span {
        font-size: 1.25rem;
        color: #6e6358;
        font-weight: 500;
    }
    .total-label {
        font-size: 0.8125rem;
        color: #6e6358;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 20px;
    }
    .total-summary {
        font-size: 1.0625rem;
        color: #9a8e82;
        line-height: 1.75;
        max-width: 460px;
    }

    /* === CTA Section === */
    .cta-section {
        padding: 64px 24px 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        background: radial-gradient(ellipse 60% 40% at 50% 60%, rgba(201, 107, 80, 0.05) 0%, transparent 70%), #faf8f5;
    }
    .cta-primary {
        display: inline-block;
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 1.125rem;
        font-weight: 600;
        padding: 16px 40px;
        background: linear-gradient(135deg, #c96b50, #a85535);
        color: #faf8f5;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 24px rgba(201, 107, 80, 0.3);
    }
    .cta-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(201, 107, 80, 0.45);
        background: linear-gradient(135deg, #e0957e, #c96b50);
    }
    .cta-primary:active {
        transform: translateY(0);
        box-shadow: 0 4px 16px rgba(201, 107, 80, 0.3);
    }
    .cta-primary:focus-visible {
        outline: 2px solid #e0957e;
        outline-offset: 3px;
    }
    .cta-secondary {
        display: inline-block;
        font-family: 'Noto Sans SC', 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        padding: 14px 28px;
        background: transparent;
        color: #6e6358;
        border: 1px solid rgba(192, 180, 164, 0.5);
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cta-secondary:hover {
        color: #3e352a;
        border-color: rgba(221, 213, 200, 0.5);
        background: rgba(221, 213, 200, 0.06);
    }
    .cta-secondary:active {
        background: rgba(221, 213, 200, 0.03);
    }
    .cta-secondary:focus-visible {
        outline: 2px solid #c96b50;
        outline-offset: 2px;
    }

    /* === Footer === */
    .footer {
        text-align: center;
        padding: 32px 24px;
        border-top: 1px solid rgba(236, 231, 223, 0.8);
        background: #f2ede6;
    }
    .footer-text {
        font-size: 0.75rem;
        color: #5a4e3a;
        letter-spacing: 0.03em;
    }
    .footer-text a {
        color: #5a4e3a;
        text-decoration: none;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
        .nav {
            padding: 0 16px;
        }
        .dimensions-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .dim-card {
            padding: 20px;
        }
        .dim-card-header {
            margin-bottom: 12px;
        }
        .dim-card-name {
            font-size: 1.25rem;
        }
        .dim-score-badge {
            width: 42px;
            height: 42px;
            font-size: 0.875rem;
        }
        .hero-section {
            padding: 100px 20px 48px;
        }
        .decision-quote {
            padding: 20px 24px;
        }
        .decision-quote-text {
            font-size: 1.0625rem;
        }
        .section-inner {
            padding: 56px 16px;
        }
        .total-container {
            padding: 56px 16px;
        }
        .total-score-circle {
            width: 120px;
            height: 120px;
        }
        .total-score-number {
            font-size: 2rem;
        }
        .cta-section {
            padding: 48px 20px 64px;
        }
        .cta-primary {
            padding: 14px 32px;
            font-size: 1rem;
        }
        .cta-secondary {
            padding: 12px 24px;
            font-size: 0.9375rem;
        }
    }
  </style>
</head>
<body>
  <!-- ==================== NAVIGATION ==================== -->
  <nav class="nav" id="mainNav">
    <a href="#" class="nav-logo">决策体检</a>
    <div class="nav-buttons">
      <a href="landing-core-v2.html" class="nav-btn-ghost" data-dom-id="back-landing">返回首页</a>
    </div>
  </nav>

  <!-- ==================== HERO (COMPACT) ==================== -->
  <section class="hero-section">
    <h1 class="reveal-section">外部环境评估</h1>
    <p class="hero-subtitle reveal-section">基于决策科学框架，对你正在纠结的决策进行四维度结构化评估</p>
    <div class="decision-quote-row reveal-section">
      <div class="decision-quote glass-card" id="decisionQuote">
        <div class="decision-quote-text" id="decisionText"></div>
      </div>
      <a href="landing-core-v2.html" class="change-decision-btn" data-dom-id="back-landing">换个决策</a>
    </div>
  </section>

  <!-- ==================== FOUR DIMENSIONS ==================== -->
  <section class="dimensions-section">
    <div class="section-inner">
      <h2 class="section-title reveal-section">四维度评估结果</h2>
      <div class="dimensions-grid" id="dimensionsGrid">
        <!-- Cards rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ==================== TOTAL SCORE ==================== -->
  <section class="total-section">
    <div class="total-container reveal-section" id="totalSection">
      <div class="total-score-circle">
        <div class="total-score-number" id="totalScoreNumber"></div>
      </div>
      <div class="total-label">外部校准总分</div>
      <div class="total-summary" id="totalSummary"></div>
    </div>
  </section>

  <!-- ==================== CTA ==================== -->
  <section class="cta-section reveal-section">
    <a href="self-assessment.html" class="cta-primary" data-dom-id="goto-self-assessment">继续自评 &rarr;</a>
    <a href="landing-core-v2.html" class="cta-secondary" data-dom-id="back-landing">返回修改决策</a>
  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="footer-text">不收集个人隐私数据 &nbsp;|&nbsp; 决策体检 &copy; 2026</div>
  </footer>

  <script>
    /* === Data === */
    var currentCase = {
      decision: "要不要从传统IT转行做AI前线部署工程师？",
      dimensions: [
        {
          key: "direction",
          name: "方向感",
          score: 4,
          maxScore: 5,
          credibility: "high",
          credibilityLabel: "高可信",
          summary: "行业趋势上行，政策支持明确",
          color: "#c96b50",
          details: {
            basis: "AI行业正处于快速发展期，人才需求旺盛，政策层面持续加码支持。根据行业报告，2026年AI相关岗位需求同比增长45%，政策支持指数达到历史高位。",
            indicators: [
              { label: "政策支持度", value: 85 },
              { label: "人才需求增速", value: 78 },
              { label: "行业成熟度", value: 72 },
              { label: "竞争强度", value: 60 }
            ],
            sources: [
              "[1] 2026年AI行业人才需求报告",
              "[2] 国家新一代人工智能发展规划（2025修订版）",
              "[3] Gartner: AI技术成熟度曲线 2026"
            ]
          }
        },
        {
          key: "certainty",
          name: "确定性",
          score: 3,
          maxScore: 5,
          credibility: "medium",
          credibilityLabel: "中可信",
          summary: "信息量中等，路径存在但不够清晰",
          color: "#5e9292",
          details: {
            basis: "AI前线部署工程师是相对新兴的角色定义，行业尚未形成统一的岗位标准和技能认证体系。学习路径存在多条分支（MLOps、模型微调、边缘部署），选择成本较高。",
            indicators: [
              { label: "信息清晰度", value: 55 },
              { label: "路径明确性", value: 60 },
              { label: "参考案例数", value: 45 },
              { label: "技能认证覆盖", value: 40 }
            ],
            sources: [
              "[1] AI前线部署工程师岗位调研（2026）",
              "[2] 领英: AI相关岗位技能需求分析"
            ]
          }
        },
        {
          key: "timing",
          name: "时间感",
          score: 5,
          maxScore: 5,
          credibility: "high",
          credibilityLabel: "高可信",
          summary: "时机窗口开启，政策红利期",
          color: "#6d9e7c",
          details: {
            basis: "AI产业正处于从导入期向成长期过渡的关键节点，政策窗口期明确（2025-2030），行业人才缺口持续扩大。康波周期判断：当前处于新一轮技术革命的早期上行阶段。",
            indicators: [
              { label: "政策窗口期", value: 95 },
              { label: "行业生命周期", value: 80 },
              { label: "人才供给紧张度", value: 88 },
              { label: "转型紧迫性", value: 70 }
            ],
            sources: [
              "[1] 康波周期与技术革命历史分析",
              "[2] 产业生命周期: AI行业定位报告",
              "[3] 教育部: AI相关专业毕业生就业数据"
            ]
          }
        },
        {
          key: "cost",
          name: "代价感",
          score: 2,
          maxScore: 5,
          credibility: "low",
          credibilityLabel: "低可信",
          summary: "资金门槛中等，退出成本偏高",
          color: "#9a8b72",
          details: {
            basis: "转型需要投入学习时间和一定资金成本，但退出成本（回归原行业）的具体评估数据较少。部分参考案例显示转型周期通常为6-18个月，期间收入波动风险需要考虑。",
            indicators: [
              { label: "资金门槛", value: 45 },
              { label: "退出成本", value: 65 },
              { label: "机会成本", value: 70 },
              { label: "失败回归难度", value: 55 }
            ],
            sources: [
              "[1] 职业转型成本调研报告（2025）",
              "[2] IT行业人才流动数据分析"
            ]
          }
        }
      ],
      totalScore: 3.5,
      totalSummary: "整体外部环境偏积极，但代价维度需要重点关注"
    };

    /* === Render Decision Quote === */
    document.getElementById('decisionText').textContent = currentCase.decision;

    /* === Render Dimension Cards === */
    var grid = document.getElementById('dimensionsGrid');

    currentCase.dimensions.forEach(function(dim, idx) {
      var credibilityClass = 'credibility-' + dim.credibility;

      var indicatorsHTML = dim.details.indicators.map(function(ind) {
        return '<div class="dim-indicator-row">' +
          '<span class="dim-indicator-label">' + ind.label + '</span>' +
          '<div class="dim-indicator-bar-track">' +
            '<div class="dim-indicator-bar-fill" data-width="' + ind.value + '" style="background:' + dim.color + ';"></div>' +
          '</div>' +
          '<span class="dim-indicator-value">' + ind.value + '%</span>' +
        '</div>';
      }).join('');

      var sourcesHTML = dim.details.sources.map(function(src) {
        return '<div class="dim-source-item">' + src + '</div>';
      }).join('');

      var cardHTML =
        '<div class="dim-card glass-card reveal-section" data-color="' + dim.color + '" style="transition-delay:' + (idx * 120) + 'ms;">' +
          '<div class="dim-card-header">' +
            '<div class="dim-card-name" style="color:' + dim.color + ';">' + dim.name + '</div>' +
            '<div class="dim-score-badge" style="background:' + dim.color + ';">' + dim.score + '/' + dim.maxScore + '</div>' +
          '</div>' +
          '<span class="credibility-pill ' + credibilityClass + '">' + dim.credibilityLabel + '</span>' +
          '<div class="dim-summary">' + dim.summary + '</div>' +
          '<button class="dim-toggle" data-target="details-' + dim.key + '">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 8 10 12 6"/></svg>' +
            '查看详情' +
          '</button>' +
          '<div class="dim-details" id="details-' + dim.key + '">' +
            '<div class="dim-details-inner">' +
              '<div class="dim-basis">' + dim.details.basis + '</div>' +
              '<div class="dim-indicators-title">关键指标</div>' +
              indicatorsHTML +
              '<div class="dim-sources">' +
                '<div class="dim-sources-title">信息来源</div>' +
                sourcesHTML +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      grid.insertAdjacentHTML('beforeend', cardHTML);
    });

    /* === Render Total Score === */
    document.getElementById('totalScoreNumber').innerHTML = currentCase.totalScore + '<span>/' + '5</span>';
    document.getElementById('totalSummary').textContent = currentCase.totalSummary;

    /* === Toggle Details === */
    document.querySelectorAll('.dim-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var targetId = this.getAttribute('data-target');
        var panel = document.getElementById(targetId);
        var isOpen = panel.classList.contains('open');

        if (isOpen) {
          panel.classList.remove('open');
          this.classList.remove('expanded');
        } else {
          panel.classList.add('open');
          this.classList.add('expanded');

          /* Animate indicator bars on first open */
          var bars = panel.querySelectorAll('.dim-indicator-bar-fill');
          setTimeout(function() {
            bars.forEach(function(bar) {
              var w = bar.getAttribute('data-width');
              bar.style.width = w + '%';
              bar.classList.add('animated');
            });
          }, 50);
        }
      });
    });

    /* === Scroll Reveal (IntersectionObserver) === */
    var revealElements = document.querySelectorAll('.reveal-section');
    var revealObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

    revealElements.forEach(function(el) {
      revealObserver.observe(el);
    });

    /* === Nav Scroll Effect === */
    var nav = document.getElementById('mainNav');
    var lastScrollY = 0;
    window.addEventListener('scroll', function() {
      var scrollY = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollY > 20) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
      lastScrollY = scrollY;
    }, { passive: true });
  </script>
</body>
</html>
