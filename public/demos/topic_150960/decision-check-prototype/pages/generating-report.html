<body>

    <nav class="top-nav">
        <a href="#" class="nav-logo">决策体检</a>
        <a href="landing-core-v2.html" class="nav-ghost-btn" data-dom-id="back-landing">返回首页</a>
    </nav>

    <main class="glass-card">
        <p class="card-subtitle">正在为你的决策生成评估...</p>

        <div class="decision-quote" id="decisionDisplay">
            要不要从传统IT转行做AI前线部署工程师？
        </div>

        <ul class="progress-steps" id="progressSteps">
            <li class="progress-step" data-step="0">
                <span class="step-icon">⚙</span>
                <span class="step-text">正在解析决策内容...</span>
            </li>
            <li class="progress-step" data-step="1">
                <span class="step-icon">⚙</span>
                <span class="step-text">正在检索行业数据...</span>
            </li>
            <li class="progress-step" data-step="2">
                <span class="step-icon">⚙</span>
                <span class="step-text">正在分析外部环境...</span>
            </li>
            <li class="progress-step" data-step="3">
                <span class="step-icon">⚙</span>
                <span class="step-text">正在生成评估报告...</span>
            </li>
            <li class="progress-step" data-step="4">
                <span class="step-icon">⚙</span>
                <span class="step-text">评估完成</span>
            </li>
        </ul>

        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>

        <a href="report-free.html" class="cta-btn" id="ctaButton" data-dom-id="goto-report">查看评估结果 →</a>
    </main>

    <script>
        (function () {
            const displayEl = document.getElementById('decisionDisplay');
            const stored = localStorage.getItem('decisionText');
            if (stored) {
                displayEl.textContent = stored;
            } else {
                const hash = window.location.hash;
                if (hash && hash.startsWith('#decision=')) {
                    const fromHash = decodeURIComponent(hash.replace('#decision=', ''));
                    if (fromHash) displayEl.textContent = fromHash;
                }
            }

            const steps = document.querySelectorAll('.progress-step');
            const progressBarFill = document.getElementById('progressBarFill');
            const ctaButton = document.getElementById('ctaButton');
            const totalSteps = steps.length;
            const stepInterval = 1200;
            const barAnimDuration = 1000;

            let currentStep = -1;
            let progressPercent = 0;

            function setStepState(index, state) {
                const step = steps[index];
                const icon = step.querySelector('.step-icon');
                step.classList.remove('active', 'completed');

                if (state === 'active') {
                    step.classList.add('active', 'visible');
                    icon.className = 'step-icon active';
                    icon.textContent = '⚙';
                } else if (state === 'completed') {
                    step.classList.add('completed', 'visible');
                    icon.className = 'step-icon completed';
                    icon.textContent = '✓';
                }
            }

            function animateProgressTo(targetPercent, duration) {
                const startPercent = progressPercent;
                const startTime = performance.now();

                function tick(now) {
                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - t, 3);
                    const current = startPercent + (targetPercent - startPercent) * eased;
                    progressBarFill.style.width = current + '%';

                    if (t < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        progressPercent = targetPercent;
                    }
                }

                requestAnimationFrame(tick);
            }

            function activateNextStep() {
                currentStep++;
                if (currentStep < totalSteps) {
                    setStepState(currentStep, 'active');
                    const targetPercent = ((currentStep + 1) / totalSteps) * 100;
                    animateProgressTo(targetPercent, barAnimDuration);

                    if (currentStep === totalSteps - 1) {
                        setTimeout(function () {
                            setStepState(currentStep, 'completed');
                            setTimeout(function () {
                                ctaButton.classList.add('visible');
                            }, 300);
                        }, 1000);
                    } else {
                        for (var i = 0; i < currentStep; i++) {
                            setStepState(i, 'completed');
                        }
                        setTimeout(activateNextStep, stepInterval);
                    }
                }
            }

            setTimeout(activateNextStep, 400);
        })();
    </script>

    <style>

            transform: translateY(8px);

            opacity: 1;
            transform: translateY(0);
        }

        .step-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            color: #7a6c5a;
            transition: color var(--duration-normal);
        }

        .step-icon.active {

            animation: spin 1.2s linear infinite;
        }

        .step-icon.completed {
            color: #6d9e7c;
            animation: none;
        }

        .step-text {
            font-size: var(--font-size-sm);
            font-weight: 400;
            color: #7a6c5a;
            transition: color var(--duration-normal);
        }

        .progress-step.active .step-text {
            color: #b0a494;
        }

        .progress-step.completed .step-text {
            color: #6d9e7c;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(58, 52, 48, 0.5);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 32px;
        }

            height: 100%;

            border-radius: 3px;
            transition: width 0.3s ease;

            font-size: 1.125rem;
            font-weight: 600;

            background: linear-gradient(135deg, #c96b50, #a85535);
            border: none;
            border-radius: 9999px;
            padding: 18px 48px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            opacity: 0;
            transform: translateY(12px) scale(0.97);
            transition: opacity var(--duration-slow) var(--ease-out), transform var(--duration-slow) var(--ease-out), box-shadow var(--duration-normal);
            box-shadow: 0 4px 16px rgba(201, 107, 80, 0.2);
        }

            box-shadow: 0 6px 24px rgba(201, 107, 80, 0.35);
            transform: translateY(-1px);
        }

        .cta-btn.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
