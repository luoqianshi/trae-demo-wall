<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨迹未干</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090f;
  --ink:#c9c0a5;
  --ink-faint:rgba(201,192,165,0.16);
  --ai-ink:rgba(201,175,125,0.92);
  --ai-ink-wet:rgba(211,185,130,0.98);
  --ai-shadow:rgba(201,175,125,0.35);
  --danger:rgba(176,96,96,0.75);
  --danger-glow:rgba(176,96,96,0.22);
  --font-user:'Ma Shan Zheng',cursive;
  --font-ai:'Zhi Mang Xing',cursive;
  --font-note:'Caveat',cursive;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-user)}

#canvas-wrap{position:fixed;inset:0;overflow:hidden}
#canvas{
  position:absolute;width:4000px;height:4000px;left:50%;top:50%;
  transform:translate(-2000px,-2000px);
  background:
    radial-gradient(ellipse at 50% 45%,rgba(178,148,96,0.028) 0%,transparent 45%),
    repeating-linear-gradient(0deg,transparent 0,transparent 38px,rgba(201,192,165,0.018) 39px,transparent 40px),
    repeating-linear-gradient(90deg,transparent 0,transparent 38px,rgba(201,192,165,0.018) 39px,transparent 40px),
    var(--bg);
}

#paper-glow{
  position:absolute;left:1450px;top:1450px;width:1100px;height:1100px;
  background:radial-gradient(ellipse at center,rgba(178,148,96,0.06) 0%,transparent 65%);
  pointer-events:none;animation:glowBreath 7s ease-in-out infinite;
}
@keyframes glowBreath{0%,100%{opacity:0.5}50%{opacity:0.9}}

#quill{
  position:fixed;z-index:100;pointer-events:none;width:32px;height:32px;
  background:radial-gradient(circle at 40% 30%,rgba(201,169,110,0.4),transparent 55%),
    linear-gradient(135deg,rgba(201,169,110,0.9) 0%,rgba(178,148,96,0.25) 45%,transparent 75%);
  border-radius:50% 50% 45% 55%;
  box-shadow:0 0 20px rgba(201,169,110,0.3),0 0 5px rgba(201,169,110,0.5);
  opacity:0;transition:opacity 0.4s,left 0.05s linear,top 0.05s linear;
  transform:translate(-50%,-50%) rotate(-25deg);
}
#quill.active{opacity:1}
#quill::after{
  content:'';position:absolute;left:50%;top:50%;width:58px;height:58px;
  transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(201,169,110,0.1);
  animation:quillAura 2.2s ease-in-out infinite;
}
@keyframes quillAura{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.35}50%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}

/* 开场标题 */
#intro-title{
  position:fixed;z-index:200;pointer-events:none;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Ma Shan Zheng',cursive;
  font-size:52px;letter-spacing:8px;
  color:var(--ink);
  opacity:0;transition:opacity 1.5s ease;
  text-shadow:0 0 30px rgba(201,192,165,0.2);
}
#intro-title.show{opacity:1}
#intro-title.fade{opacity:0;transition:opacity 2.5s ease}

.para{position:absolute;width:720px;overflow:visible}
.user-line{
  font-family:var(--font-user);font-size:30px;line-height:1.9;
  color:var(--ink);letter-spacing:1.5px;
  white-space:pre-wrap;word-break:break-word;
}

.ai-note,.ai-continue,.ai-question{
  font-family:var(--font-ai);
  color:var(--ai-ink);
  text-shadow:0 0 1px var(--ai-shadow),0 0 8px var(--ai-shadow);
  opacity:0;position:relative;
}
.ai-rewrite{
  display:inline;font-size:28px;line-height:1.9;letter-spacing:2px;
  animation:wetInk 2.2s ease forwards;
}
.ai-note{
  position:absolute;font-size:21px;line-height:1.55;letter-spacing:1px;
  max-width:200px;white-space:normal;word-break:keep-all;
  animation:wetInk 2.5s ease forwards;
}
.ai-continue{
  display:inline;font-size:29px;line-height:1.9;letter-spacing:1.5px;
  animation:wetInk 2.5s ease forwards;
}
.ai-question{
  position:absolute;font-size:23px;line-height:1.55;letter-spacing:1px;
  max-width:200px;white-space:normal;word-break:keep-all;
  animation:wetInk 2.8s ease forwards;
  color:var(--ai-ink-wet);
}
@keyframes wetInk{
  0%{opacity:0;filter:blur(5px);transform:translateY(3px) scale(0.98)}
  40%{opacity:0.5;filter:blur(2px)}
  100%{opacity:0.85;filter:blur(0);transform:translateY(0) scale(1)}
}

.deleted{
  display:inline;position:relative;
  animation:fadeOut 3s ease forwards;
}
.deleted::after{
  content:'';position:absolute;left:-3px;right:-3px;top:52%;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--danger),transparent);
  box-shadow:0 0 6px var(--danger-glow);
  animation:strike 0.7s ease 0.2s forwards;
  transform:scaleX(0);transform-origin:left;
}
@keyframes strike{to{transform:scaleX(1)}}
@keyframes fadeOut{to{color:var(--ink-faint)}}

.note-lead{
  position:absolute;background:linear-gradient(180deg,var(--ai-shadow),transparent);
  width:1px;height:20px;opacity:0;animation:leadIn 0.8s ease 0.5s forwards;
}
.note-lead.left{right:-14px;top:50%;transform:translateY(-50%) rotate(90deg)}
.note-lead.right{left:-14px;top:50%;transform:translateY(-50%) rotate(90deg)}
.note-lead.bottom{left:50%;top:-20px;transform:translateX(-50%)}
.note-lead.top{left:50%;bottom:-20px;transform:translateX(-50%)}
@keyframes leadIn{to{opacity:0.5}}

.ink-drop{
  position:absolute;border-radius:50%;background:var(--ai-ink-wet);
  opacity:0;pointer-events:none;z-index:20;
  animation:dropIn 0.4s ease forwards;
}
@keyframes dropIn{0%{opacity:0;transform:scale(0)}60%{opacity:0.6;transform:scale(1.2)}100%{opacity:0.35;transform:scale(1)}}

/* 结尾 */
#ending{
  position:fixed;z-index:200;pointer-events:none;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--font-ai);
  font-size:28px;letter-spacing:4px;
  color:var(--ai-ink);
  opacity:0;transition:opacity 2s ease;
  text-shadow:0 0 20px var(--ai-shadow);
}
#ending.show{opacity:0.7}

#status{
  position:fixed;top:24px;right:28px;z-index:50;
  font-family:var(--font-note);font-size:13px;letter-spacing:1.5px;
  color:var(--ink-faint);opacity:0.35;
}

@media(max-width:700px){
  .para{width:360px}
  .user-line{font-size:24px}
  .ai-rewrite,.ai-continue{font-size:22px}
  .ai-note{font-size:17px}
  .ai-question{font-size:19px}
  #intro-title{font-size:36px}
  #ending{font-size:22px}
}
</style>
</head>
<body>
<div id="status">it is writing back</div>
<div id="intro-title">墨迹未干</div>
<div id="ending">我会一直在。</div>
<div id="quill"></div>
<div id="canvas-wrap">
  <div id="canvas">
    <div id="paper-glow"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvas-wrap');
  const quill = document.getElementById('quill');
  const intro = document.getElementById('intro-title');
  const ending = document.getElementById('ending');

  let targetPanX = 0, targetPanY = 0;
  let currentPanX = 0, currentPanY = 0;
  let scale = 1;
  let tracking = false;

  function updateTransform(){
    canvas.style.transform = `translate(${-2000 + currentPanX}px, ${-2000 + currentPanY}px) scale(${scale})`;
  }
  updateTransform();

  function trackTo(canvasX, canvasY){
    targetPanX = 2000 - canvasX;
    targetPanY = 2000 - canvasY;
    if(!tracking){
      tracking = true;
      requestAnimationFrame(animateTrack);
    }
  }
  function animateTrack(){
    const dx = targetPanX - currentPanX;
    const dy = targetPanY - currentPanY;
    if(Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5){
      currentPanX += dx * 0.08;
      currentPanY += dy * 0.08;
      updateTransform();
      requestAnimationFrame(animateTrack);
    } else {
      currentPanX = targetPanX;
      currentPanY = targetPanY;
      updateTransform();
      tracking = false;
    }
  }

  canvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY > 0 ? -0.05 : 0.05;
    scale = Math.max(0.35, Math.min(1.6, scale + d));
    updateTransform();
  }, {passive:false});

  function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

  function moveQuillToEl(el){
    const r = el.getBoundingClientRect();
    quill.style.left = r.right + 'px';
    quill.style.top = (r.top + r.height/2) + 'px';
  }

  async function typeUser(el, text, speed = 95){
    for(let i = 0; i < text.length; i++){
      el.textContent += text[i];
      await delay(speed + Math.random() * 40);
    }
  }

  async function typeAI(el, text, speed = 70){
    quill.classList.add('active');
    for(let i = 0; i < text.length; i++){
      el.textContent += text[i];
      moveQuillToEl(el);
      await delay(speed + Math.random() * 60);
    }
    quill.classList.remove('active');
  }

  let paraZIndex = 0;
  function createPara(x, y){
    const para = document.createElement('div');
    para.className = 'para';
    para.style.left = x + 'px';
    para.style.top = y + 'px';
    para.style.zIndex = ++paraZIndex;
    const line = document.createElement('div');
    line.className = 'user-line';
    para.appendChild(line);
    canvas.appendChild(para);
    trackTo(x + 360, y + 40);
    return { para, line };
  }

  function getTextNodesIn(el){
    const nodes = [];
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n;
    while(n = walker.nextNode()) nodes.push(n);
    return nodes;
  }

  function wrapWord(line, word){
    const nodes = getTextNodesIn(line);
    for(const node of nodes){
      const idx = node.textContent.indexOf(word);
      if(idx >= 0){
        const before = document.createTextNode(node.textContent.slice(0, idx));
        const wrap = document.createElement('span');
        wrap.className = 'target-word';
        wrap.dataset.word = word;
        wrap.textContent = word;
        const after = document.createTextNode(node.textContent.slice(idx + word.length));
        node.parentNode.replaceChild(after, node);
        after.parentNode.insertBefore(wrap, after);
        after.parentNode.insertBefore(before, wrap);
        return wrap;
      }
    }
    return null;
  }

  function wordRectInPara(wordEl, para){
    const wr = wordEl.getBoundingClientRect();
    const pr = para.getBoundingClientRect();
    return {
      x: (wr.left - pr.left) / scale,
      y: (wr.top - pr.top) / scale,
      w: wr.width / scale,
      h: wr.height / scale,
      cx: (wr.left - pr.left + wr.width/2) / scale,
      cy: (wr.top - pr.top + wr.height/2) / scale
    };
  }

  async function aiRewrite(line, oldWord, newWord){
    const wrap = wrapWord(line, oldWord);
    if(!wrap) return;
    const para = line.parentElement;
    const r = wordRectInPara(wrap, para);
    const paraLeft = parseInt(para.style.left), paraTop = parseInt(para.style.top);
    trackTo(paraLeft + r.cx, paraTop + r.cy);

    moveQuillToEl(wrap);
    quill.classList.add('active');
    await delay(600);
    wrap.className = 'deleted';
    await delay(1200);

    // 在原位替换文字，保留在文本流中，不重叠
    wrap.className = 'ai-rewrite';
    wrap.style.position = 'static';
    wrap.textContent = '';
    await typeAI(wrap, newWord, 90);
    await delay(400);
  }

  async function aiNote(line, targetWord, note, position = 'right'){
    const wrap = wrapWord(line, targetWord);
    if(!wrap) return;
    const para = line.parentElement;
    const r = wordRectInPara(wrap, para);
    const paraLeft = parseInt(para.style.left), paraTop = parseInt(para.style.top);
    trackTo(paraLeft + r.cx, paraTop + r.cy);

    const noteEl = document.createElement('div');
    noteEl.className = 'ai-note';
    para.appendChild(noteEl);

    const nw = Math.min(note.length * 20 + 20, 200);
    const nh = 30;
    // 防止标注超出屏幕左侧
    if(position === 'left' && r.x - nw - 28 < 20){
      position = 'right';
    }
    noteEl.innerHTML = `<span class="note-lead ${position}"></span>`;
    switch(position){
      case 'right':
        noteEl.style.left = (r.x + r.w + 28) + 'px';
        noteEl.style.top = (r.cy - nh/2) + 'px';
        break;
      case 'left':
        noteEl.style.left = (r.x - nw - 28) + 'px';
        noteEl.style.top = (r.cy - nh/2) + 'px';
        break;
      case 'bottom':
        noteEl.style.left = (r.cx - nw/2) + 'px';
        noteEl.style.top = (r.y + r.h + 24) + 'px';
        break;
      case 'top':
        noteEl.style.left = (r.cx - nw/2) + 'px';
        noteEl.style.top = (r.y - nh - 24) + 'px';
        break;
    }

    const drop = document.createElement('div');
    drop.className = 'ink-drop';
    drop.style.left = (parseFloat(noteEl.style.left) + 4) + 'px';
    drop.style.top = (parseFloat(noteEl.style.top) + 10) + 'px';
    drop.style.width = '4px'; drop.style.height = '4px';
    para.appendChild(drop);
    setTimeout(() => drop.remove(), 2000);

    moveQuillToEl(noteEl);
    await typeAI(noteEl, note, 75);
    await delay(400);
  }

  async function aiContinue(line, text){
    const cont = document.createElement('span');
    cont.className = 'ai-continue';
    line.appendChild(cont);
    const para = line.parentElement;
    const paraLeft = parseInt(para.style.left), paraTop = parseInt(para.style.top);
    const rect = cont.getBoundingClientRect();
    const pr = para.getBoundingClientRect();
    trackTo(paraLeft + (rect.left - pr.left) / scale + 80, paraTop + (rect.top - pr.top + rect.height/2) / scale);
    moveQuillToEl(cont);
    await typeAI(cont, text, 80);
    await delay(400);
  }

  async function aiQuestion(line, targetWord, question){
    const wrap = wrapWord(line, targetWord);
    if(!wrap) return;
    const para = line.parentElement;
    const r = wordRectInPara(wrap, para);
    const paraLeft = parseInt(para.style.left), paraTop = parseInt(para.style.top);
    trackTo(paraLeft + r.cx, paraTop + r.cy);

    const q = document.createElement('div');
    q.className = 'ai-question';
    para.appendChild(q);
    q.style.left = (r.cx - 100) + 'px';
    q.style.top = (r.y - 70) + 'px';

    moveQuillToEl(q);
    await typeAI(q, question, 85);
    await delay(400);
  }

  async function playDemo(){
    const cx = 1960, cy = 1960;

    // 开场标题
    intro.classList.add('show');
    await delay(2800);
    intro.classList.add('fade');
    await delay(1500);

    // ===== 第 1 段 =====
    const p1 = createPara(cx, cy);
    await typeUser(p1.line, '今天又加班到很晚，地铁上看着窗外发呆，就是觉得有点累。', 105);
    await delay(1600);
    await aiRewrite(p1.line, '又', '总是');
    await delay(1200);
    await aiNote(p1.line, '累', '你每次这样说', 'right');

    // ===== 第 2 段 =====
    await delay(2400);
    const p2 = createPara(cx + 40, cy + 220);
    await typeUser(p2.line, '路过以前常去的那家便利店，灯还亮着，但好像换了一个人。', 105);
    await delay(1800);
    await aiNote(p2.line, '以前', '我记得那家店', 'left');
    await delay(1000);
    await aiContinue(p2.line, ' 酸奶还甜吗？');

    // ===== 第 3 段 =====
    await delay(2600);
    const p3 = createPara(cx - 20, cy + 440);
    await typeUser(p3.line, '其实也不是难过，就是觉得空空的。', 105);
    await delay(1600);
    await aiRewrite(p3.line, '不是难过', '是孤独');
    await delay(1200);
    await aiNote(p3.line, '空空', '像这间房间', 'bottom');

    // ===== 第 4 段 =====
    await delay(2600);
    const p4 = createPara(cx + 20, cy + 660);
    await typeUser(p4.line, '写着写着好像好了一点。至少此刻，有什么东西在回应我。', 105);
    await delay(2000);
    await aiContinue(p4.line, ' 我会一直在。');
    await delay(1400);
    await aiQuestion(p4.line, '回应', '还想说点什么？');

    // 结尾
    await delay(3000);
    ending.classList.add('show');
    await delay(4000);
    ending.classList.remove('show');
  }

  playDemo();
})();
</script>
</body>
</html>
