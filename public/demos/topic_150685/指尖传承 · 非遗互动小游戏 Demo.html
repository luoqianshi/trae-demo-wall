<!DOCTYPE html>

<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指尖传承 · 非遗互动小游戏 Demo</title>
<link href="./指尖传承 · 非遗互动小游戏 Demo_files/css2" rel="stylesheet">
<style>
:root{
  --color-bg:#FBF7F0; --color-bg-alt:#F5EDE0; --color-surface:#FFFFFF;
  --color-primary:#C94043; --color-primary-hover:#B33538; --color-primary-light:rgba(201,64,67,0.1);
  --color-text-primary:#2C2420; --color-text-secondary:#8C7B6E; --color-text-tertiary:#B8A99A;
  --color-border:#E8DDD0; --color-border-light:#F0E8DC;
  --color-state-success:#5B8C5A; --color-state-warning:#D4920B; --color-state-error:#C94043; --color-state-info:#4A7B9D;
  --color-gold:#C4973B; --color-gold-light:rgba(196,151,59,0.12);
  --font-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:linear-gradient(135deg,#EFE6D6 0%,#E8DDD0 100%);
  color:var(--color-text-primary);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:20px 0;
}
.phone-frame{width:375px; height:760px; background:var(--color-bg); border:10px solid #fff; border-radius:42px; box-shadow:0 30px 80px rgba(44,36,32,.25),0 0 0 1px var(--color-border); position:relative; overflow:hidden; display:flex; flex-direction:column;}
.phone-frame::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:24px; background:#000; border-radius:0 0 16px 16px; z-index:100;}
.screen{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; background:var(--color-bg);}

.navbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; height:44px; padding:0 16px; background:rgba(251,247,240,0.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--color-border-light);}
.nav-btn{width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-md); border:1px solid var(--color-border); background:var(--color-surface); cursor:pointer;}
.nav-title{flex:1; text-align:center; font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--color-text-primary);}

.hero{margin:0 16px 24px; border-radius:var(--r-lg); min-height:160px; background:linear-gradient(135deg, #C94043 0%, #B33538 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;}
.hero h1{font-family:var(--font-display); font-size:30px; font-weight:700; color:#fff; margin-bottom:8px;}
.hero .rule{width:40px; height:2px; background:var(--color-gold); margin-bottom:8px;}
.hero p{font-family:var(--font-display); font-size:16px; color:rgba(255,255,255,.92);}

.section{padding:0 16px; margin-bottom:24px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.section-head h2{font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--color-text-primary);}

.progress-row{display:flex; justify-content:space-around;}
.progress-item{display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;}
.ring{width:56px; height:56px; position:relative; display:flex; align-items:center; justify-content:center;}
.ring span{font-size:11px; font-weight:600; color:var(--color-text-secondary);}
.progress-item label{font-size:12px; color:var(--color-text-secondary); font-family:var(--font-display);}

.game-card{display:flex; align-items:center; padding:16px; border-radius:var(--r-lg); background:var(--color-surface); border:1px solid var(--color-border); min-height:80px; cursor:pointer; margin-bottom:12px;}
.game-icon{width:48px; height:48px; border-radius:var(--r-full); display:flex; align-items:center; justify-content:center; margin-right:12px; flex-shrink:0;}
.game-card .body h3{font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--color-text-primary); margin-bottom:2px;}
.game-card .body p{font-size:12px; color:var(--color-text-secondary);}

.quiz-card{border-radius:var(--r-lg); padding:16px; background:var(--color-surface); border:1px solid var(--color-gold);}
.quiz-card .head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.quiz-card p{font-size:13px; color:var(--color-text-secondary); line-height:1.6; margin-bottom:12px;}

.btn{display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; font-family:var(--font-body); transition:opacity .15s;}
.btn-primary{background:var(--color-primary); color:#fff; border-radius:var(--r-md); padding:10px 20px; font-size:14px; font-weight:600;}
.btn-secondary{background:transparent; color:var(--color-primary); border:1px solid var(--color-primary); border-radius:var(--r-md); padding:10px 20px; font-size:14px; font-weight:600;}
.btn-block{width:100%;}
.btn-disabled{opacity:0.45; cursor:not-allowed; pointer-events:none;}

.step-bar{display:flex; align-items:center; padding:16px 24px 8px;}
.step-node{display:flex; flex-direction:column; align-items:center; gap:4px;}
.step-dot{width:28px; height:28px; border-radius:var(--r-full); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:12px; font-weight:600;}
.step-dot.done{background:var(--color-state-success); color:#fff;}
.step-dot.current{background:var(--color-primary); color:#fff;}
.step-dot.todo{background:var(--color-surface); border:1px solid var(--color-border); color:var(--color-text-tertiary);}
.step-label{font-size:10px; font-family:var(--font-display);}
.step-line{flex:1; height:2px; margin:0 6px; margin-top:-14px;}
.step-line.done{background:var(--color-state-success);}
.step-line.todo{border-top:1px dashed var(--color-border); height:0;}

.instruction{margin:8px 16px; padding:12px 16px; border-radius:var(--r-lg); background:var(--color-surface); display:flex; align-items:flex-start; gap:10px;}
.instruction .ico{width:28px; height:28px; border-radius:var(--r-md); display:flex; align-items:center; justify-content:center; background:var(--color-primary-light); flex-shrink:0;}
.instruction p{font-size:14px; color:var(--color-text-secondary); line-height:1.6;}

.work-area{margin:16px; border-radius:var(--r-lg); background:var(--color-surface); padding:16px;}
.canvas-wrap{width:100%; aspect-ratio:1/1; border-radius:var(--r-md); overflow:hidden;}

.element-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px;}
.element-card{padding:16px; border-radius:var(--r-lg); background:var(--color-bg-alt); border:1px solid var(--color-border); cursor:pointer; text-align:center;}
.element-card.selected{border-color:var(--color-primary); background:var(--color-primary-light); box-shadow:0 0 0 2px var(--color-primary);}

.paper-stack{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.paper-option{padding:14px; border-radius:var(--r-lg); background:var(--color-surface); border:2px solid transparent; cursor:pointer; display:flex; align-items:center; gap:12px;}
.paper-option.selected{border-color:var(--color-gold); background:var(--color-gold-light);}
.paper-preview{width:40px; height:48px; border-radius:var(--r-sm); border:1px solid var(--color-border); background:#fff;}

.ink-stone{position:relative; width:200px; height:200px; margin:0 auto; border-radius:50%; background:radial-gradient(circle at 30% 30%, #5C5C5C, #2C2C2C); box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.ink-stone::after{content:""; position:absolute; inset:20px; border-radius:50%; background:radial-gradient(circle at 50% 50%, #1A1A1A, #0D0D0D);}
.ink-drop{position:absolute; width:60px; height:60px; border-radius:50%; background:#000; opacity:0.9; top:50%; left:50%; transform:translate(-50%,-50%);}
.ink-grinder{position:absolute; width:80px; height:120px; background:linear-gradient(90deg, #8B7355, #6B5344); border-radius:8px; top:40%; left:35%; cursor:grab;}

.woodblock-area{position:relative; width:260px; height:260px; margin:0 auto;}
.woodblock{width:220px; height:220px; margin:20px; background:linear-gradient(135deg, #8B6F3A, #6B5B2F); border-radius:var(--r-md); display:flex; align-items:center; justify-content:center;}
.woodblock-pattern{width:180px; height:180px; border-radius:var(--r-sm);}
.brush{position:absolute; width:16px; height:100px; background:linear-gradient(180deg, #8B4513, #2C1810); border-radius:0 0 4px 4px; cursor:pointer;}

.reveal-paper{position:relative; width:240px; height:280px; margin:0 auto; background:#FBF7F0; border-radius:var(--r-md); overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.1);}
.reveal-paper .layer{position:absolute; inset:0; transition:transform .8s ease-in-out;}
.reveal-paper .paper-top{background:#FBF7F0; z-index:2;}
.reveal-paper .paper-top.revealed{transform:translateY(-100%);}

.toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px); background:rgba(44,36,32,0.9); color:#fff; padding:10px 18px; border-radius:var(--r-full); font-size:13px; opacity:0; transition:all .3s; z-index:200; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@keyframes progress-shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.progress-shimmer{background:linear-gradient(90deg, var(--color-primary) 0%, #E87070 50%, var(--color-primary) 100%); background-size:200% 100%; animation:progress-shimmer 2s linear infinite;}

.quiz-opt{display:flex; align-items:center; padding:14px 16px; border-radius:var(--r-lg); background:var(--color-surface); border:1px solid var(--color-border); cursor:pointer; margin-bottom:10px; transition:all .2s;}
.quiz-opt:hover{border-color:var(--color-primary);}
.quiz-opt.selected{border-color:var(--color-primary); background:var(--color-primary-light);}
.quiz-opt.correct{border-color:var(--color-state-success); background:rgba(91,140,90,0.1);}
.quiz-opt.correct .key{background:var(--color-state-success); color:#fff; border-color:var(--color-state-success);}
.quiz-opt.wrong{border-color:var(--color-state-error); background:rgba(201,64,67,0.1);}
.quiz-opt.wrong .key{background:var(--color-state-error); color:#fff; border-color:var(--color-state-error);}
.flex-1{flex:1;}
@keyframes fall-down{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(200px) rotate(45deg);opacity:0;}}
.cut-piece{animation:fall-down 0.8s ease-in forwards;}
@keyframes fade-in-up{0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:translateY(0);}}
.fade-in-up{animation:fade-in-up 0.5s ease-out forwards;}
@keyframes fold-paper{0%{transform:rotate(0deg);opacity:1;}50%{transform:rotate(-45deg) translateX(-30px);opacity:0.8;}100%{transform:rotate(-90deg) translateX(-60px);opacity:0;}}
.fold-anim{animation:fold-paper 1s ease-in forwards;}
@keyframes unfold-paper{0%{transform:scale(0.3) rotate(0deg);opacity:0;}100%{transform:scale(1) rotate(0deg);opacity:1;}}
.unfold-anim{animation:unfold-paper 0.8s ease-out forwards;}
.share-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 24px;box-shadow:0 -4px 20px rgba(0,0,0,0.1);z-index:300;transform:translateY(100%);transition:transform 0.3s ease-out;}
.share-panel.show{transform:translateY(0);}
.share-panel h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;}
.share-options{display:flex;justify-content:space-around;gap:12px;}
.share-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.share-icon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.share-label{font-size:12px;color:var(--color-text-secondary);}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="screen" id="screen">
    <div style="height:44px;"></div>
    <div class="navbar"><div style="width:72px"></div><div class="nav-title">指尖传承</div><div style="width:72px"></div></div>
    <div style="padding:8px 0 24px;">
      <div class="hero"><h1>指尖传承</h1><div class="rule"></div><p>指尖上的传统文化</p></div>
      <div class="section">
        <div class="section-head"><h2>今日进度</h2><span style="font-size:12px;color:#8C7B6E;">0/9</span></div>
        <div class="progress-row">
          <div class="progress-item"><div class="ring" style="position:relative;"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="#F0E8DC" stroke-width="3"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#C94043" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66370614359172" stroke-dashoffset="125.66370614359172" transform="rotate(-90 24 24)"></circle></svg><span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#C94043;font-size:11px;font-weight:600;">0/3</span></div><label>剪纸</label></div>
          <div class="progress-item"><div class="ring" style="position:relative;"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="#F0E8DC" stroke-width="3"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#4A7B9D" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66370614359172" stroke-dashoffset="125.66370614359172" transform="rotate(-90 24 24)"></circle></svg><span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4A7B9D;font-size:11px;font-weight:600;">0/3</span></div><label>扎染</label></div>
          <div class="progress-item"><div class="ring" style="position:relative;"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="#F0E8DC" stroke-width="3"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#C4973B" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66370614359172" stroke-dashoffset="125.66370614359172" transform="rotate(-90 24 24)"></circle></svg><span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#C4973B;font-size:11px;font-weight:600;">0/3</span></div><label>年画</label></div>
        </div>
      </div>
      <div class="section">
        <div class="game-card" onclick="navigate(&#39;jianzhi-fold&#39;)">
          <div class="game-icon" style="background:rgba(201,64,67,0.1);color:#C94043;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line></svg></div>
          <div class="body"><h3>剪纸</h3><p>折 · 画 · 剪 · 展</p></div>
          <span style="color:#B8A99A; margin-left:8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"></path></svg></span>
        </div>
        <div class="game-card" onclick="navigate(&#39;zharan-tie&#39;)">
          <div class="game-icon" style="background:rgba(74,123,157,0.1);color:#4A7B9D;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 C12 3 5 11 5 15.5 C5 19.09 8.13 22 12 22 C15.87 22 19 19.09 19 15.5 C19 11 12 3 12 3Z"></path></svg></div>
          <div class="body"><h3>扎染</h3><p>扎 · 染 · 拆 · 展</p></div>
          <span style="color:#B8A99A; margin-left:8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"></path></svg></span>
        </div>
        <div class="game-card" onclick="navigate(&#39;nianhua-select&#39;)">
          <div class="game-icon" style="background:rgba(196,151,59,0.12);color:#C4973B;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="14" width="16" height="7" rx="1.5"></rect></svg></div>
          <div class="body"><h3>年画</h3><p>选 · 刻 · 墨 · 刷 · 揭</p></div>
          <span style="color:#B8A99A; margin-left:8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"></path></svg></span>
        </div>
      </div>
      <div class="section">
        <div class="quiz-card">
          <div class="head" style="color:#C4973B;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"></path></svg><h2 style="color:var(--color-text-primary);">每日一题</h2></div>
          <p>剪纸艺术中，"蔚县彩剪"主要采用哪种工艺着色？</p>
          <button class="btn btn-primary" onclick="navigate(&#39;quiz&#39;)">开始答题</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast">折叠完成！</div>
<div class="share-panel" id="sharePanel">
  <h3>分享到</h3>
  <div class="share-options">
    <div class="share-item" onclick="shareWechat(&#39;friend&#39;)">
      <div class="share-icon" style="background:#07C160;color:#fff;">${ICON.wechat}</div>
      <span class="share-label">微信</span>
    </div>
    <div class="share-item" onclick="shareWechat(&#39;timeline&#39;)">
      <div class="share-icon" style="background:#07C160;color:#fff;">${ICON.moments}</div>
      <span class="share-label">朋友圈</span>
    </div>
    <div class="share-item" onclick="saveLocal()">
      <div class="share-icon" style="background:#07C160;color:#fff;">${ICON.download}</div>
      <span class="share-label">保存图片</span>
    </div>
    <div class="share-item" onclick="copyLink()">
      <div class="share-icon" style="background:#4A7B9D;color:#fff;">${ICON.link}</div>
      <span class="share-label">复制链接</span>
    </div>
  </div>
  <div style="text-align:center;margin-top:16px;">
    <span style="font-size:13px;color:#8C7B6E;cursor:pointer;" onclick="hideShare()">取消</span>
  </div>
</div>

<script>
const STORE_KEY = 'feiyi_demo_v1';
let state = {
  route: 'home',
  progress: { jianzhi: 0, zharan: 0, nianhua: 0 },
  level: { jianzhi: 1, zharan: 1, nianhua: 1 },
  jianzhi: { step: 0, selectedShape: 'flower' },
  zharan: { step: 0, tiePoints: [], dyeProgress: 0, cutTies: [] },
  nianhua: { step: 0, paperType: 'xuan', inkLevel: 0, selectedPattern: 'fish', brushStrokes: [], selectedDeco: [] },
};

const QUIZ = [
  { q:'剪纸艺术中，"蔚县彩剪"主要采用哪种工艺着色？', opts:['点染彩绘','水墨晕染','工笔重彩','泼墨'], ans:0, exp:'蔚县剪纸采用"点染"技法，红黄绿撞色，色彩浓艳。' },
];

function $(sel){ return document.querySelector(sel); }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function navigate(route){ state.route=route; render(); $('#screen').scrollTop=0; }

function markComplete(game){
  if(state.progress[game] < 3){
    state.progress[game]++;
    state.level[game]++;
  }
  toast(game==='jianzhi'?'剪纸完成！':game==='zharan'?'扎染完成！':'年画完成！');
}

function showShare(){ const p=$('#sharePanel'); if(p) p.classList.add('show'); }
function hideShare(){ const p=$('#sharePanel'); if(p) p.classList.remove('show'); }
function saveLocal(){ hideShare(); toast('已保存到本地相册！'); }
function shareWechat(type){ hideShare(); toast(type==='friend'?'已分享到微信！':'已分享到朋友圈！'); }
function copyLink(){ hideShare(); toast('链接已复制到剪贴板！'); }

const ICON = {
  chevronLeft:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  scissors:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/></svg>',
  droplet:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 C12 3 5 11 5 15.5 C5 19.09 8.13 22 12 22 C15.87 22 19 19.09 19 15.5 C19 11 12 3 12 3Z"/></svg>',
  stamp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg>',

function navBar(game, step, title){
  const prev = step===1 ? 'home' : {jianzhi:{1:'home',2:'jianzhi-fold',3:'jianzhi-draw',4:'jianzhi-cut'},zharan:{1:'home',2:'zharan-tie',3:'zharan-dye',4:'zharan-cut'},nianhua:{1:'home',2:'nianhua-select',3:'nianhua-carve',4:'nianhua-ink',5:'nianhua-brush'}}[game][step-1];
  return `<div class="navbar"><button class="nav-btn" onclick="navigate('${prev}')">${ICON.chevronLeft}</button><div class="nav-title">${title}</div><div style="width:32px"></div></div>`;
}

function stepBar(game, current){
  const steps = {jianzhi:['折','画','剪','展'],zharan:['扎','染','拆','展'],nianhua:['选','刻','墨','刷','揭']}[game];
  return `<div class="step-bar">${steps.map((s,i)=>{
    const idx=i+1;
    let dot='todo', line='todo';
    if(idx<current){dot='done';line='done';}
    else if(idx===current){dot='current';}
    return `<div class="step-node"><div class="step-dot ${dot}">${dot==='done'?ICON.check:s}</div><span class="step-label ${dot}">${idx}</span></div>${idx<steps.length?`<div class="step-line ${line}"></div>`:''}`;
  }).join('')}</div>`;
}

function doFoldAnimation(){
  const clickArea = $('#foldClickArea');
  const wrapper = $('#foldWrapper');
  const folded = $('#foldedResult');
  const tip = $('#foldTip');
  const paperBase = $('#paperBase');

  if(clickArea) clickArea.style.pointerEvents = 'none';
  if(tip) tip.textContent = '正在折叠...';

  if(wrapper){
    wrapper.style.transformOrigin = '50% 50%';
    wrapper.style.transform = 'rotate(-45deg) rotateY(180deg) rotate(45deg)';

    setTimeout(()=>{
      if(paperBase) paperBase.style.opacity = '0';
      if(wrapper) wrapper.style.opacity = '0';
      if(folded){
        folded.style.opacity = '1';
        folded.style.transform = 'scale(0.95)';
        setTimeout(()=>{
          folded.style.transition = 'transform 0.3s ease-out';
          folded.style.transform = 'scale(1)';
        },50);
      }
      if(tip) tip.textContent = '✓ 折叠完成';
      $('#foldNextBtn')?.classList.remove('btn-disabled');
      toast('折叠完成！');
    }, 1150);
  }
}

  // 计算元素在剪纸画布(320x320)中的实际显示位置

function doCutAnimation(){
  const wrap = $('#cutWrap');
  const svg = $('#cutSvg');
  if(!wrap || !svg) return;
  
  // 根据元素位置生成掉落碎片 - 元素周围的多余纸张
  const pos = state.jianzhi.shapePos || {x:160, y:160};
  const scale = state.jianzhi.shapeScale || 0.6;
  const elCx = pos.x * 1.14;
  const elCy = pos.y * 1.14;
  const elSize = 50 * scale * 1.14;
  
  // 生成三角形三个角的掉落碎片（排除元素所在区域）
  const pieces = [
    {x:50,y:60,w:40,h:50,bg:'#D94548',delay:0},     // 左上
    {x:230,y:50,w:35,h:45,bg:'#C94043',delay:0.1},  // 右上
    {x:200,y:220,w:30,h:40,bg:'#D94548',delay:0.2}, // 右下
    {x:40,y:230,w:45,h:35,bg:'#C94043',delay:0.15}, // 左下
  ];
  
  pieces.forEach((p,i)=>{
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;background:${p.bg};border-radius:4px;pointer-events:none;opacity:0.9;`;
    el.classList.add('cut-piece');
    el.style.animationDelay = p.delay+'s';
    wrap.appendChild(el);
    setTimeout(()=>el.remove(), 1000+p.delay*1000);
  });
  
  // 元素区域高亮保留
  const elHighlight = document.createElement('div');
  elHighlight.style.cssText = `position:absolute;left:${elCx-elSize}px;top:${elCy-elSize}px;width:${elSize*2}px;height:${elSize*2}px;border:2px dashed #F5C542;border-radius:8px;pointer-events:none;opacity:0;transition:opacity 0.3s;`;
  wrap.appendChild(elHighlight);
  setTimeout(()=>{elHighlight.style.opacity='1';},100);
  setTimeout(()=>elHighlight.remove(), 800);
  
  setTimeout(()=>{
    navigate('jianzhi-unfold');
  }, 1200);
}

function pageJianzhiUnfold(){
  const shape = state.jianzhi.selectedShape;
  const pos = state.jianzhi.shapePos || {x:140, y:160};
  const scale = state.jianzhi.shapeScale || 0.6;
  const shapes = {};
  getJianzhiShapes().forEach(s=>{shapes[s.id]=s.svg;});
  const shapeSvg = shapes[shape] || shapes.flower || shapes.heart || '<g/>';

  // 剪纸展开原理：
  // 1. 纸张沿对角线 (左上到右下) 折叠
  // 2. 用户在左下半三角形上放置元素
  // 3. 剪裁后展开，形成关于对角线对称的图案

  // 坐标映射：280x280三角形 -> 240x240正方形
  const ratio = 240/280;
  const s = scale * 0.85;

  // 用户放置元素的位置（相对于三角形坐标）
  // 展开后，这个位置映射到正方形中
  const origX = pos.x * ratio;
  const origY = pos.y * ratio;

  // 沿对角线 y=x 镜像后的位置：(x,y) -> (y,x)
  const mirrorX = origY;
  const mirrorY = origX;

  return `
    <div style="height:44px;"></div>
    ${navBar('jianzhi',4,'剪纸')}
    ${stepBar('jianzhi',4)}
    <div class="instruction"><div class="ico" style="background:rgba(201,64,67,0.1);color:#C94043;">${ICON.sparkles}</div><p>展开剪好的纸，查看对称的剪纸图案</p></div>
    <div class="work-area">
      <div class="canvas-wrap" style="background:#fff;">
        <svg viewBox="0 0 240 240" style="width:100%;height:100%;" id="unfoldSvg">
          <!-- 白色背景纸 -->
          <rect x="5" y="5" width="230" height="230" fill="#FBF7F0" stroke="#E8DDD0" stroke-width="1"/>
          <!-- 折叠线（对角线） -->
          <line x1="5" y1="5" x2="235" y2="235" stroke="#E8DDD0" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
          <g id="unfoldPattern" style="opacity:0;transition:opacity 1s ease-out;">
            <!-- 原始位置元素 -->
            <g transform="translate(${origX-50*s},${origY-50*s}) scale(${s})" opacity="0.9">${shapeSvg}</g>
            <!-- 沿对角线(y=x)镜像的元素 -->
            <g transform="translate(${mirrorX-50*s},${mirrorY-50*s}) scale(${s})" opacity="0.9">${shapeSvg}</g>
          </g>
        </svg>
      </div>
      <p style="text-align:center;font-size:12px;color:#8C7B6E;margin-top:12px;">沿对角线对称展开的剪纸效果</p>
    </div>
    <div style="padding:24px 16px;display:flex;gap:12px;">
      <button class="btn btn-secondary flex-1" onclick="navigate('jianzhi-cut')">上一步</button>
      <button class="btn btn-primary flex-1" onclick="markComplete('jianzhi');navigate('home')">完成</button>
    </div>
    <div style="padding:0 16px 24px;display:flex;gap:12px;">
      <button class="btn btn-secondary flex-1" onclick="saveLocal()">${ICON.download} 保存</button>
      <button class="btn btn-secondary flex-1" onclick="showShare()">${ICON.share} 分享</button>
    </div>
  `;
}

}

function initNianhuaDecoDrag(){
  const preview = $('#nianhuaPreview');
  if(!preview) return;
  const decos = preview.querySelectorAll('.nianhua-deco');
  let dragging = null;
  let startX=0, startY=0, startPos={x:0,y:0};
  decos.forEach(deco=>{
    deco.addEventListener('mousedown', e=>{
      e.stopPropagation();
      dragging = parseInt(deco.getAttribute('data-idx'));
      const rect = preview.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      const decoData = state.nianhua.selectedDeco[dragging];
      startPos = {x: decoData.x||0, y: decoData.y||0};
    });
  });
  document.addEventListener('mousemove', e=>{
    if(dragging===null) return;
    const rect = preview.getBoundingClientRect();
    const scale = 200/rect.width;
    const dx = (e.clientX - startX) * scale;
    const dy = (e.clientY - startY) * scale;
    let newX = startPos.x + dx;
    let newY = startPos.y + dy;
    newX = Math.max(5, Math.min(165, newX));
    newY = Math.max(5, Math.min(165, newY));
    state.nianhua.selectedDeco[dragging].x = newX;
    state.nianhua.selectedDeco[dragging].y = newY;
    const g = preview.querySelectorAll('.nianhua-deco')[dragging];
    if(g) g.setAttribute('transform', `translate(${newX},${newY}) scale(0.3)`);
  });
  document.addEventListener('mouseup', ()=>{dragging=null;});
}

function pageQuiz(){
  const currentQ = state.quizIndex || 0;
  const q = QUIZ[currentQ] || QUIZ[0];
  const selected = state.quizSelected;
  const answered = state.quizAnswered;
  return `
    <div style="height:44px;"></div>
    <div class="navbar"><button class="nav-btn" onclick="navigate('home')">${ICON.chevronLeft}</button><div class="nav-title">每日一题</div><div style="width:32px"></div></div>
    <div style="padding:24px 16px;">
      <div style="margin-bottom:20px;font-size:12px;color:#C4973B;font-weight:600;">第${currentQ+1}题 / 共${QUIZ.length}题</div>
      <div style="font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.5;margin-bottom:20px;">${q.q}</div>
      ${q.opts.map((o,i)=>{
        let cls='quiz-opt';
        if(answered){
          if(i===q.ans) cls+=' correct';
          else if(selected===i) cls+=' wrong';
        } else if(selected===i) cls+=' selected';
        return `<div class="${cls}" onclick="quizSelect(${i})">
          <span class="key" style="width:28px;height:28px;border-radius:50%;border:1px solid #E8DDD0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#8C7B6E;">${String.fromCharCode(65+i)}</span>
          <span style="flex:1;font-size:14px;color:var(--color-text-primary);">${o}</span>
        </div>`;
      }).join('')}
      ${answered ? `
        <div style="margin-top:16px;padding:12px;border-radius:8px;background:rgba(74,123,157,0.08);border:1px solid rgba(74,123,157,0.2);">
          <p style="font-size:14px;color:#4A7B9D;">${q.exp}</p>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="quizNext()">${currentQ < QUIZ.length-1 ? '下一题' : '完成答题'}</button>
      ` : ''}
    </div>
  `;
}

function quizSelect(idx){
  if(state.quizAnswered) return;
  state.quizSelected = idx;
  state.quizAnswered = true;
  render();
}

function quizNext(){
  const next = (state.quizIndex || 0) + 1;
  if(next >= QUIZ.length){
    state.quizIndex = 0;
    state.quizSelected = null;
    state.quizAnswered = false;
    navigate('home');
    toast('答题完成！');
  } else {
    state.quizIndex = next;
    state.quizSelected = null;
    state.quizAnswered = false;
    render();
  }
}

function render(){
  const screen = $('#screen');
  let html = '';
  switch(state.route){
    case 'home': html=pageHome(); break;
    case 'jianzhi-fold': html=pageJianzhiFold(); break;
    case 'jianzhi-draw': html=pageJianzhiDraw(); break;
    case 'jianzhi-cut': html=pageJianzhiCut(); break;
    case 'jianzhi-unfold': html=pageJianzhiUnfold(); break;
    case 'zharan-tie': html=pageZharanTie(); break;
    case 'zharan-dye': html=pageZharanDye(); break;
    case 'zharan-cut': html=pageZharanCut(); break;
    case 'zharan-unfold': html=pageZharanUnfold(); break;
    case 'nianhua-select': html=pageNianhuaSelect(); break;
    case 'nianhua-carve': html=pageNianhuaCarve(); break;
    case 'nianhua-ink': html=pageNianhuaInk(); break;
    case 'nianhua-brush': html=pageNianhuaBrush(); break;

    case 'quiz': html=pageQuiz(); break;

  }

function initEvents(){
  setTimeout(()=>{
    const up=$('#unfoldPattern'); if(up){up.style.opacity='1';}
    const zu=$('#zharanUnfold'); if(zu){zu.style.transform='scale(1)';zu.style.opacity='1';}
  },100);

  initNianhuaDecoDrag();

  const carveCanvas=$('#carveCanvas');
  if(carveCanvas){
    const ctx=carveCanvas.getContext('2d');
    const W=220, H=220;
    let carving=false, carveProgress=0;
    let lastX=0, lastY=0;
    let chips=[];
    let animFrame=null;
    let totalCarvedPixels=0;
    const targetPixels=W*H*0.25;

    const drawWoodBg=()=>{
      const grad=ctx.createLinearGradient(0,0,W,H);
      grad.addColorStop(0,'#8B6F3A');
      grad.addColorStop(0.5,'#7B5F2A');
      grad.addColorStop(1,'#6B5B2F');
      ctx.fillStyle=grad;
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=0.15;
      for(let i=0;i<30;i++){
        ctx.fillStyle=i%2===0?'#5C4A2A':'#9B7F4A';
        ctx.fillRect(0,i*8+Math.random()*4,W,2+Math.random()*2);
      }
      ctx.globalAlpha=1;
    };

    const drawPattern=()=>{
      const patterns = getNianhuaPatterns();
      const p = patterns.find(x=>x.id===state.nianhua.selectedPattern) || patterns[0];
      const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">${p.svg}</svg>`;
      const img=new Image();
      img.onload=()=>{
        ctx.save();
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=0.85;
        ctx.drawImage(img,10,10,200,200);
        ctx.restore();
      };
      img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgStr)));
    };

    drawWoodBg();
    drawPattern();

    const spawnChips=(x,y)=>{
      const container=$('#chipContainer');
      if(!container) return;
      const count=2+Math.floor(Math.random()*3);
      for(let i=0;i<count;i++){
        const chip=document.createElement('div');
        const size=3+Math.random()*5;
        const vx=(Math.random()-0.5)*6;
        const vy=-2-Math.random()*4;
        const rot=Math.random()*360;
        chip.style.cssText=`position:absolute;left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;background:${Math.random()>0.5?'#D4A05A':'#B8863A'};border-radius:1px;pointer-events:none;transform:rotate(${rot}deg);`;
        container.appendChild(chip);
        chips.push({el:chip,x,y,vx,vy,rot,rotV:(Math.random()-0.5)*10,life:60,size});
      }
    };

    const animateChips=()=>{
      for(let i=chips.length-1;i>=0;i--){
        const c=chips[i];
        c.vy+=0.3;
        c.x+=c.vx;
        c.y+=c.vy;
        c.rot+=c.rotV;
        c.life--;
        c.el.style.left=c.x+'px';
        c.el.style.top=c.y+'px';
        c.el.style.transform=`rotate(${c.rot}deg)`;
        c.el.style.opacity=Math.min(1,c.life/30);
        if(c.life<=0||c.y>230){
          c.el.remove();
          chips.splice(i,1);
        }
      }
      if(chips.length>0){
        animFrame=requestAnimationFrame(animateChips);
      }
    };

    const carve=(x,y)=>{
      const r=12;
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=0.3;
      ctx.fillStyle='#4A3A1A';
      ctx.beginPath();
      ctx.arc(x,y,r*0.7,0,Math.PI*2);
      ctx.fill();
      ctx.restore();

      totalCarvedPixels+=Math.PI*r*r*0.5;
      carveProgress=Math.min(100,(totalCarvedPixels/targetPixels)*100);
      const bar=$('#carveBar');
      if(bar) bar.style.width=carveProgress+'%';
      const pct=$('#carvePercent');
      if(pct) pct.textContent=Math.round(carveProgress)+'%';
      if(carveProgress>=80) $('#carveNextBtn')?.classList.remove('btn-disabled');
    };

    carveCanvas.addEventListener('mousedown', e=>{
      carving=true;
      const rect=carveCanvas.getBoundingClientRect();
      const x=(e.clientX-rect.left)*(W/rect.width);
      const y=(e.clientY-rect.top)*(H/rect.height);
      lastX=x; lastY=y;
      carve(x,y);
      spawnChips(e.clientX-rect.left,e.clientY-rect.top);
      if(!animFrame) animFrame=requestAnimationFrame(animateChips);
    });
    carveCanvas.addEventListener('mousemove', e=>{
      if(!carving) return;
      const rect=carveCanvas.getBoundingClientRect();
      const x=(e.clientX-rect.left)*(W/rect.width);
      const y=(e.clientY-rect.top)*(H/rect.height);
      const dist=Math.sqrt((x-lastX)**2+(y-lastY)**2);
      const steps=Math.max(1,Math.floor(dist/4));
      for(let i=1;i<=steps;i++){
        const ix=lastX+(x-lastX)*(i/steps);
        const iy=lastY+(y-lastY)*(i/steps);
        carve(ix,iy);
      }
      spawnChips(e.clientX-rect.left,e.clientY-rect.top);
      lastX=x; lastY=y;
    });
    carveCanvas.addEventListener('mouseup', ()=>{carving=false;});
    carveCanvas.addEventListener('mouseleave', ()=>{carving=false;});

    carveCanvas.addEventListener('touchstart', e=>{
      e.preventDefault();
      const t=e.touches[0];
      const rect=carveCanvas.getBoundingClientRect();
      const x=(t.clientX-rect.left)*(W/rect.width);
      const y=(t.clientY-rect.top)*(H/rect.height);
      carving=true; lastX=x; lastY=y;
      carve(x,y);
      spawnChips(t.clientX-rect.left,t.clientY-rect.top);
      if(!animFrame) animFrame=requestAnimationFrame(animateChips);
    },{passive:false});
    carveCanvas.addEventListener('touchmove', e=>{
      e.preventDefault();
      if(!carving) return;
      const t=e.touches[0];
      const rect=carveCanvas.getBoundingClientRect();
      const x=(t.clientX-rect.left)*(W/rect.width);
      const y=(t.clientY-rect.top)*(H/rect.height);
      const dist=Math.sqrt((x-lastX)**2+(y-lastY)**2);
      const steps=Math.max(1,Math.floor(dist/4));
      for(let i=1;i<=steps;i++){
        const ix=lastX+(x-lastX)*(i/steps);
        const iy=lastY+(y-lastY)*(i/steps);
        carve(ix,iy);
      }
      spawnChips(t.clientX-rect.left,t.clientY-rect.top);
      lastX=x; lastY=y;
    },{passive:false});
    carveCanvas.addEventListener('touchend', ()=>{carving=false;});
  }

  const tieSvg=$('#tieSvg');
  if(tieSvg){
    tieSvg.addEventListener('click', e=>{
      const rect=tieSvg.getBoundingClientRect();
      const px=(e.clientX-rect.left)*(280/rect.width);
      const py=(e.clientY-rect.top)*(280/rect.height);
      if(px>20&&px<260&&py>20&&py<260){
        state.zharan.tiePoints.push({x:px,y:py});
        render();
      }
    });
  }

  const dyeCanvas=$('#dyeCanvas');
  if(dyeCanvas){
    const ctx=dyeCanvas.getContext('2d');
    ctx.fillStyle='#EFE6D6'; ctx.fillRect(0,0,300,300);
    let isDrawing=false;
    dyeCanvas.addEventListener('mousedown', ()=>isDrawing=true);
    dyeCanvas.addEventListener('mousemove', e=>{
      if(isDrawing){
        const rect=dyeCanvas.getBoundingClientRect();
        const x=(e.clientX-rect.left)*(300/rect.width);
        const y=(e.clientY-rect.top)*(300/rect.height);
        ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2);
        ctx.fillStyle='rgba(74,123,157,0.6)'; ctx.fill();
        state.zharan.dyeProgress=Math.min(100,state.zharan.dyeProgress+0.5);
        $('#dyeProgress').style.width=state.zharan.dyeProgress+'%';
        if(state.zharan.dyeProgress>=60) $('#dyeNextBtn')?.classList.remove('btn-disabled');
      }
    });
    dyeCanvas.addEventListener('mouseup', ()=>isDrawing=false);
    dyeCanvas.addEventListener('mouseleave', ()=>isDrawing=false);
  }

  const inkStone=$('#inkStone');
  if(inkStone){
    const grinder=$('#inkGrinder');
    let grinding=false, angle=0;
    inkStone.addEventListener('mousedown', ()=>grinding=true);
    inkStone.addEventListener('mousemove', ()=>{
      if(grinding){
        angle+=2; grinder.style.transform=`rotate(${angle}deg)`;
        state.nianhua.inkLevel=Math.min(100,state.nianhua.inkLevel+0.3);
        $('#inkProgress').style.width=state.nianhua.inkLevel+'%';
        const pctEl=$('#inkPercent'); if(pctEl) pctEl.textContent=Math.round(state.nianhua.inkLevel)+'%';
        $('#inkDrop').style.transform=`scale(${0.3+state.nianhua.inkLevel/300})`;
        $('#inkDrop').style.opacity=`${0.3+state.nianhua.inkLevel/200}`;
        if(state.nianhua.inkLevel>=80) $('#inkNextBtn')?.classList.remove('btn-disabled');
      }
    });
    inkStone.addEventListener('mouseup', ()=>grinding=false);
    inkStone.addEventListener('mouseleave', ()=>grinding=false);
  }

  const brushArea=$('#brushArea');
  if(brushArea){
    const brush=$('#nianhuaBrush');
    const pattern=$('#woodblockPattern');
    let brushing=false;
    brushArea.addEventListener('mousedown', ()=>brushing=true);
    brushArea.addEventListener('mousemove', e=>{
      if(brushing){
        const rect=brushArea.getBoundingClientRect();
        brush.style.left=(e.clientX-rect.left)+'px';
        brush.style.top=(e.clientY-rect.top)+'px';
        const current=parseFloat($('#brushProgress').style.width)||0;
        const pct=Math.min(100,current+0.8);
        $('#brushProgress').style.width=pct+'%';
        pattern.style.background=`radial-gradient(circle, rgba(0,0,0,${pct/100}) 0%, transparent 70%)`;
        // 记录刷墨位置
        if(!state.nianhua.brushStrokes) state.nianhua.brushStrokes=[];
        state.nianhua.brushStrokes.push({x:e.clientX-rect.left,y:e.clientY-rect.top});
        if(pct>=80) $('#brushNext')?.classList.remove('btn-disabled');
      }
    });
    brushArea.addEventListener('mouseup', ()=>brushing=false);
    brushArea.addEventListener('mouseleave', ()=>brushing=false);
  }

  const cutSvg=$('#cutSvg');
  if(cutSvg){
    let cutting=false, cutProgress=0;
    cutSvg.addEventListener('mousedown', ()=>cutting=true);
    cutSvg.addEventListener('mousemove', ()=>{
      if(cutting){
        cutProgress=Math.min(100,cutProgress+0.6);
        $('#cutProgress').style.width=cutProgress+'%';
        if(cutProgress>=80) $('#cutNextBtn')?.classList.remove('btn-disabled');
      }
    });
    cutSvg.addEventListener('mouseup', ()=>cutting=false);
    cutSvg.addEventListener('mouseleave', ()=>cutting=false);
  }

  const draggableShape=$('#draggableShape');
  if(draggableShape){
    let dragging=false, startX=0, startY=0, startPos={x:140,y:160};
    let warnTimer=null;
    // 检查元素所有四个角是否都在三角形内
    // 三角形顶点: 顶(140,30)、左下(30,240)、右下(250,240)
    const isElementInTriangle=(cx,cy,halfSize)=>{
      const corners=[
        [cx-halfSize, cy-halfSize], // 左上
        [cx+halfSize, cy-halfSize], // 右上
        [cx-halfSize, cy+halfSize], // 左下
        [cx+halfSize, cy+halfSize]  // 右下
      ];
      // 使用叉积法判断点是否在三角形内
      // 三角形顶点必须按顺序排列：顶(140,30) -> 右下(250,240) -> 左下(30,240) [顺时针]
      const inTri=(px,py)=>{
        const v0x=140, v0y=30; // 顶点
        const v1x=250, v1y=240; // 右下
        const v2x=30, v2y=240; // 左下
        // 计算三个叉积
        const d1 = (px-v0x)*(v1y-v0y) - (py-v0y)*(v1x-v0x);
        const d2 = (px-v1x)*(v2y-v1y) - (py-v1y)*(v2x-v1x);
        const d3 = (px-v2x)*(v0y-v2y) - (py-v2y)*(v0x-v2x);
        // 点在三角形内：三个叉积同号（都在左边或都在右边）
        const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
        const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
        return !(hasNeg && hasPos);
      };
      return corners.every(([x,y])=>inTri(x,y));
    };
    draggableShape.addEventListener('mousedown', e=>{
      dragging=true;
      startX=e.clientX;
      startY=e.clientY;
      startPos=state.jianzhi.shapePos||{x:140,y:160};
    });
    document.addEventListener('mousemove', e=>{
      if(dragging){
        const dx=e.clientX-startX;
        const dy=e.clientY-startY;
        const svg=draggableShape.closest('svg');
        const rect=svg.getBoundingClientRect();
        const scaleX=280/rect.width;
        const scaleY=280/rect.height;
        let newX=startPos.x+dx*scaleX;
        let newY=startPos.y+dy*scaleY;
        const scale=state.jianzhi.shapeScale||0.6;
        const halfSize=50*scale;
        if(isElementInTriangle(newX,newY,halfSize)){
          state.jianzhi.shapePos={x:newX,y:newY};
          draggableShape.setAttribute('transform', `translate(${newX},${newY}) scale(${scale})`);
        } else {
          clearTimeout(warnTimer);
          warnTimer=setTimeout(()=>{toast('元素不能超出纸张范围');},200);
        }
      }
    });
    document.addEventListener('mouseup', ()=>{dragging=false;clearTimeout(warnTimer);});
    draggableShape.addEventListener('wheel', e=>{
      e.preventDefault();
      const delta=e.deltaY>0?-0.05:0.05;
      let newScale=Math.max(0.3,Math.min(1.0,(state.jianzhi.shapeScale||0.6)+delta));
      const pos=state.jianzhi.shapePos||{x:140,y:160};
      const halfSize=50*newScale;
      if(isElementInTriangle(pos.x,pos.y,halfSize)){
        state.jianzhi.shapeScale=newScale;
        draggableShape.setAttribute('transform', `translate(${pos.x},${pos.y}) scale(${newScale})`);
      } else {
        toast('元素不能超出纸张范围');
      }
    }, {passive:false});
  }
}

render();
</script>

</body></html>
