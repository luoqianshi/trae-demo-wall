<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食光 — 今天吃什么</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #fff5f0 0%, #ffe8d6 40%, #fff0e6 100%);
    min-height: 100vh;
    color: #2d2d2d;
  }

  /* ====== Header ====== */
  .app-header {
    text-align: center;
    padding: 32px 20px 16px;
  }
  .app-header .logo {
    font-size: 48px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .app-header h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #e67e22, #e74c3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 8px 0 4px;
  }
  .app-header .slogan {
    font-size: 14px;
    color: #c0a080;
  }

  /* ====== Main Container ====== */
  .main {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  /* ====== Category Tabs ====== */
  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .category-tab {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1.5px solid #e0c8b0;
    background: #fff;
    color: #8b6b4a;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s;
    font-weight: 500;
    user-select: none;
  }
  .category-tab:hover {
    border-color: #e67e22;
    color: #e67e22;
  }
  .category-tab.active {
    background: linear-gradient(135deg, #e67e22, #f39c12);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(230,126,34,0.3);
  }

  /* ====== Wheel Section ====== */
  .wheel-section {
    text-align: center;
    padding: 20px 0;
    position: relative;
  }
  .wheel-hint {
    font-size: 16px;
    color: #8b6b4a;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .wheel-container {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 24px;
    cursor: pointer;
  }
  .wheel-ring {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 6px solid #e67e22;
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.15, 1.2);
  }
  .wheel-ring.spinning {
    animation: spinWheel 0.8s ease-out;
  }
  @keyframes spinWheel {
    0% { transform: rotate(0deg); }
    30% { transform: rotate(720deg); }
    60% { transform: rotate(900deg); }
    100% { transform: rotate(1080deg); }
  }
  .wheel-center {
    font-size: 64px;
    transition: transform 0.3s;
  }
  .wheel-ring.spinning .wheel-center {
    animation: iconBounce 0.15s ease-in-out 6;
  }
  @keyframes iconBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* Particles */
  .particle {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: particleFly 1s ease-out forwards;
  }
  @keyframes particleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* ====== Result Card ====== */
  .result-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    border: 1px solid #f0e0d0;
    display: none;
    animation: slideUp 0.4s ease-out;
  }
  .result-card.show {
    display: block;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card .food-emoji {
    font-size: 72px;
    text-align: center;
    display: block;
    margin-bottom: 12px;
  }
  .result-card .food-name {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    color: #e67e22;
    margin-bottom: 4px;
  }
  .result-card .food-category {
    text-align: center;
    font-size: 13px;
    color: #c0a080;
    margin-bottom: 16px;
  }
  .food-meta {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 16px;
  }
  .food-meta-item {
    text-align: center;
    font-size: 13px;
    color: #8b6b4a;
  }
  .food-meta-item .value {
    font-size: 20px;
    font-weight: 700;
    color: #e67e22;
  }
  .food-tip {
    background: #fffaf5;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: #8b6b4a;
    line-height: 1.6;
    border: 1px solid #f5e0cc;
  }
  .food-tip::before {
    content: '💡 小贴士：';
    font-weight: 600;
    color: #e67e22;
  }

  /* ====== Action Buttons ====== */
  .action-buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-retry {
    background: #fff;
    border: 2px solid #e67e22;
    color: #e67e22;
  }
  .btn-retry:hover {
    background: #fff5f0;
  }
  .btn-confirm {
    background: linear-gradient(135deg, #e67e22, #f39c12);
    color: #fff;
    box-shadow: 0 4px 14px rgba(230,126,34,0.3);
  }
  .btn-confirm:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(230,126,34,0.4);
  }

  /* ====== History ====== */
  .history-section {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border: 1px solid #f0e0d0;
  }
  .history-section h3 {
    font-size: 17px;
    color: #e67e22;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: #fffaf5;
    border-radius: 12px;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .history-item .h-emoji { font-size: 28px; }
  .history-item .h-info { flex: 1; }
  .history-item .h-name { font-size: 15px; font-weight: 600; color: #2d2d2d; }
  .history-item .h-cat { font-size: 12px; color: #c0a080; }
  .history-item .h-time { font-size: 12px; color: #bbb; }
  .history-empty {
    text-align: center;
    color: #ccc;
    padding: 20px;
    font-size: 14px;
  }

  /* ====== Toast ====== */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #2d2d2d;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    animation: toastIn 0.3s ease-out, toastOut 0.3s 2.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  /* ====== Responsive ====== */
  @media (max-width: 400px) {
    .wheel-container { width: 160px; height: 160px; }
    .wheel-ring { width: 160px; height: 160px; border-width: 5px; }
    .wheel-center { font-size: 50px; }
    .result-card { padding: 20px; }
    .result-card .food-emoji { font-size: 56px; }
    .result-card .food-name { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <span class="logo">🍽️</span>
  <h1>食光 · 今天吃什么</h1>
  <p class="slogan">终结选择困难，一键决定今天的美味</p>
</div>

<div class="main">

  <!-- Category Tabs -->
  <div class="category-tabs" id="categoryTabs">
    <span class="category-tab active" data-cat="all">🎲 全部</span>
    <span class="category-tab" data-cat="chinese">🥡 中餐</span>
    <span class="category-tab" data-cat="western">🍝 西餐</span>
    <span class="category-tab" data-cat="japanese">🍣 日韩</span>
    <span class="category-tab" data-cat="snack">🍢 小吃</span>
    <span class="category-tab" data-cat="dessert">🍰 甜品</span>
  </div>

  <!-- Wheel -->
  <div class="wheel-section">
    <p class="wheel-hint" id="wheelHint">👆 点击转盘，开始推荐</p>
    <div class="wheel-container" id="wheelContainer">
      <div class="wheel-ring" id="wheelRing">
        <span class="wheel-center" id="wheelCenter">🎯</span>
      </div>
    </div>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="resultCard">
    <span class="food-emoji" id="foodEmoji"></span>
    <div class="food-name" id="foodName"></div>
    <div class="food-category" id="foodCategory"></div>
    <div class="food-meta">
      <div class="food-meta-item">
        <div class="value" id="foodCalories"></div>
        <div>热量(kcal)</div>
      </div>
      <div class="food-meta-item">
        <div class="value" id="foodTime"></div>
        <div>制作时间</div>
      </div>
      <div class="food-meta-item">
        <div class="value" id="foodDifficulty"></div>
        <div>难度</div>
      </div>
    </div>
    <div class="food-tip" id="foodTip"></div>
    <div class="action-buttons">
      <button class="btn btn-retry" onclick="spinWheel()">🔄 换一个</button>
      <button class="btn btn-confirm" onclick="confirmPick()">✅ 就它了</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <h3>📋 最近记录</h3>
    <div class="history-list" id="historyList">
      <div class="history-empty">还没有记录，快去转一转吧~</div>
    </div>
  </div>

</div>

<script>
// ==================== Food Database ====================
const foods = {
  chinese: [
    { emoji:'🍜', name:'兰州拉面', calories:480, time:'15min', difficulty:'⭐', tip:'汤底是灵魂，牛肉汤要熬足4小时，面条现拉才筋道。配一碟醋泡萝卜，绝了！' },
    { emoji:'🥟', name:'饺子', calories:350, time:'40min', difficulty:'⭐⭐', tip:'饺子皮和面加一个鸡蛋更劲道，肉馅顺着一个方向搅上劲，煮的时候点三次冷水。' },
    { emoji:'🍚', name:'宫保鸡丁', calories:520, time:'20min', difficulty:'⭐⭐', tip:'花生米要提前炸酥，鸡肉丁用蛋清+淀粉腌制10分钟更嫩滑。' },
    { emoji:'🥘', name:'火锅', calories:750, time:'60min', difficulty:'⭐', tip:'牛油锅底越煮越香，毛肚七上八下15秒刚好，蘸料蒜泥+香油是经典搭配。' },
    { emoji:'🍛', name:'红烧肉', calories:620, time:'50min', difficulty:'⭐⭐⭐', tip:'五花肉焯水后煎至金黄，冰糖炒糖色是关键，小火慢炖40分钟入口即化。' },
    { emoji:'🦐', name:'蒜蓉大虾', calories:280, time:'15min', difficulty:'⭐', tip:'虾开背去虾线，蒜蓉过油激发出香味，蒸8分钟，淋热油那一刻香气爆炸。' },
    { emoji:'🍲', name:'酸菜鱼', calories:450, time:'30min', difficulty:'⭐⭐', tip:'鱼片用蛋清+淀粉抓匀，酸菜要先炒出香味，汤底加泡椒才够味。' },
    { emoji:'🥬', name:'干煸四季豆', calories:180, time:'15min', difficulty:'⭐⭐', tip:'四季豆一定要炸到表皮起皱，干辣椒和花椒一起煸，出锅前撒一把蒜末。' },
  ],
  western: [
    { emoji:'🍕', name:'披萨', calories:650, time:'30min', difficulty:'⭐⭐', tip:'饼底要薄，烤箱预热到250°C，芝士拉丝的关键是马苏里拉要够多。' },
    { emoji:'🍔', name:'汉堡', calories:580, time:'20min', difficulty:'⭐', tip:'牛肉饼煎到两面焦香，面包胚用黄油烤一下更香，酸黄瓜是灵魂。' },
    { emoji:'🍝', name:'意大利面', calories:450, time:'20min', difficulty:'⭐', tip:'煮面水要像海水一样咸，面煮到al dente（弹牙），酱汁要裹住每一根面。' },
    { emoji:'🥩', name:'牛排', calories:520, time:'15min', difficulty:'⭐⭐⭐', tip:'牛排回温到室温再煎，大火封边锁住汁水，煎完rest 5分钟再切。' },
    { emoji:'🥗', name:'凯撒沙拉', calories:220, time:'10min', difficulty:'⭐', tip:'罗马生菜手撕不用刀切，凯撒酱现拌才好吃，面包丁用蒜香黄油烤。' },
    { emoji:'🌮', name:'墨西哥卷饼', calories:480, time:'25min', difficulty:'⭐⭐', tip:'牛油果酱（guacamole）是灵魂，加一点青柠汁提鲜，玉米饼用平底锅热一下。' },
  ],
  japanese: [
    { emoji:'🍣', name:'寿司', calories:350, time:'40min', difficulty:'⭐⭐⭐', tip:'米饭要用寿司醋拌匀，手蘸醋水防粘，鱼生要选新鲜的，芥末要放在鱼和饭之间。' },
    { emoji:'🍱', name:'鳗鱼饭', calories:580, time:'25min', difficulty:'⭐⭐', tip:'鳗鱼刷上照烧酱烤到表面微焦，酱汁渗进米饭里，撒上山椒粉提味。' },
    { emoji:'🍜', name:'日式拉面', calories:550, time:'30min', difficulty:'⭐⭐⭐', tip:'汤底用猪骨熬8小时以上，溏心蛋要提前腌制，叉烧肉用喷枪炙烤表面。' },
    { emoji:'🍤', name:'天妇罗', calories:380, time:'20min', difficulty:'⭐⭐', tip:'面糊要用冰水调，裹上后立刻下锅，油温170°C左右，炸到酥脆不油腻。' },
    { emoji:'🥘', name:'寿喜烧', calories:520, time:'30min', difficulty:'⭐', tip:'牛肉蘸生蛋液入口即化，汤汁用酱油+味醂+糖调，先煎牛肉再煮蔬菜。' },
    { emoji:'🍛', name:'日式咖喱饭', calories:480, time:'35min', difficulty:'⭐', tip:'咖喱块最后放，小火煮到浓稠，隔夜咖喱更好吃！加一勺蜂蜜或苹果泥更香甜。' },
  ],
  snack: [
    { emoji:'🍢', name:'麻辣烫', calories:420, time:'10min', difficulty:'⭐', tip:'汤底加牛奶更浓郁，先煮肉类再煮蔬菜，蒜泥+芝麻酱+辣椒油是万能蘸料。' },
    { emoji:'🫕', name:'煎饼果子', calories:380, time:'5min', difficulty:'⭐', tip:'面糊要摊得薄而均匀，鸡蛋打散铺满整个饼面，薄脆加两个才过瘾！' },
    { emoji:'🥟', name:'小笼包', calories:320, time:'30min', difficulty:'⭐⭐⭐', tip:'皮冻是汤汁的关键，轻轻提、慢慢移、先开窗、后喝汤。' },
    { emoji:'🍗', name:'炸鸡', calories:550, time:'25min', difficulty:'⭐', tip:'鸡肉用牛奶+盐腌制4小时更嫩，裹粉要按压出鳞片，复炸一次更酥脆。' },
    { emoji:'🌯', name:'肉夹馍', calories:420, time:'40min', difficulty:'⭐⭐', tip:'腊汁肉要炖到酥烂，白吉馍外脆里软，青椒和香菜是灵魂配菜。' },
    { emoji:'🦑', name:'铁板鱿鱼', calories:280, time:'10min', difficulty:'⭐', tip:'鱿鱼切花刀更入味，铁板烧到冒烟再放，洋葱垫底，孜然粉和辣椒面是标配。' },
  ],
  dessert: [
    { emoji:'🍰', name:'提拉米苏', calories:350, time:'25min', difficulty:'⭐⭐', tip:'手指饼干蘸咖啡液要快，马斯卡彭芝士室温软化，冷藏4小时以上口感最好。' },
    { emoji:'🍦', name:'冰淇淋', calories:280, time:'10min', difficulty:'⭐', tip:'蛋黄糊要隔水加热到80°C杀菌，奶油打到6分发，冷冻期间每小时搅拌一次。' },
    { emoji:'🧋', name:'奶茶', calories:320, time:'10min', difficulty:'⭐', tip:'茶叶用热水焖泡5分钟出味，加炼乳比白糖更香浓，珍珠煮好要泡红糖水。' },
    { emoji:'🥮', name:'蛋黄酥', calories:380, time:'50min', difficulty:'⭐⭐⭐', tip:'油皮要揉出膜，咸蛋黄喷白酒烤5分钟去腥，豆沙包住蛋黄再包油皮。' },
    { emoji:'🍩', name:'甜甜圈', calories:300, time:'20min', difficulty:'⭐⭐', tip:'面团发酵到两倍大，油温170°C炸到金黄，趁热裹上糖粉或巧克力酱。' },
    { emoji:'🍫', name:'巧克力熔岩蛋糕', calories:420, time:'20min', difficulty:'⭐⭐', tip:'烤箱温度和时间是关键，220°C烤12分钟，外层成型内心流心，趁热吃！' },
  ],
};

const catNames = {
  chinese:'中餐', western:'西餐', japanese:'日韩料理', snack:'街头小吃', dessert:'甜品饮品'
};

// ==================== State ====================
let currentCategory = 'all';
let currentFood = null;
let isSpinning = false;
let history = [];

// ==================== Category Tabs ====================
document.getElementById('categoryTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.category-tab');
  if (!tab || isSpinning) return;
  currentCategory = tab.dataset.cat;
  document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
});

// ==================== Wheel ====================
document.getElementById('wheelContainer').addEventListener('click', function() {
  if (isSpinning) return;
  spinWheel();
});

function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;

  const ring = document.getElementById('wheelRing');
  const center = document.getElementById('wheelCenter');
  const hint = document.getElementById('wheelHint');
  const resultCard = document.getElementById('resultCard');
  const container = document.getElementById('wheelContainer');

  // Reset
  ring.classList.remove('spinning');
  resultCard.classList.remove('show');
  void ring.offsetWidth;

  // Start spinning
  ring.classList.add('spinning');
  hint.textContent = '🎰 转盘中...';

  // Spawn particles
  const emojis = ['🍜','🍕','🍣','🍰','🍢','🥘','🍔','🍱','🍩','🍗'];
  for (let i = 0; i < 8; i++) {
    const particle = document.createElement('span');
    particle.className = 'particle';
    particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    particle.style.left = '50%';
    particle.style.top = '50%';
    particle.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
    particle.style.setProperty('--dy', (Math.random() - 0.5) * 200 + 'px');
    container.appendChild(particle);
    setTimeout(() => particle.remove(), 1000);
  }

  // Pick random food
  setTimeout(() => {
    let pool;
    if (currentCategory === 'all') {
      pool = Object.values(foods).flat();
    } else {
      pool = foods[currentCategory] || Object.values(foods).flat();
    }
    currentFood = pool[Math.floor(Math.random() * pool.length)];

    // Update UI
    document.getElementById('foodEmoji').textContent = currentFood.emoji;
    center.textContent = currentFood.emoji;

    setTimeout(() => {
      document.getElementById('foodName').textContent = currentFood.name;
      document.getElementById('foodCategory').textContent =
        Object.entries(catNames).find(([k]) => (foods[k] || []).includes(currentFood))?.[1] || '';
      document.getElementById('foodCalories').textContent = currentFood.calories;
      document.getElementById('foodTime').textContent = currentFood.time;
      document.getElementById('foodDifficulty').textContent = currentFood.difficulty;
      document.getElementById('foodTip').textContent = currentFood.tip;
      resultCard.classList.add('show');
      hint.textContent = '👆 不满意？点击转盘换一个';
      isSpinning = false;
    }, 200);
  }, 600);
}

// ==================== Confirm ====================
function confirmPick() {
  if (!currentFood) return;
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  history.unshift({ ...currentFood, time: timeStr });

  // Update history UI
  renderHistory();

  // Show toast
  showToast('✅ 已加入记录！就吃「' + currentFood.name + '」吧~');

  // Save to localStorage
  try {
    localStorage.setItem('shi-guang-history', JSON.stringify(history.slice(0, 20)));
  } catch(e) {}

  // Scroll to result
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ==================== History ====================
function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">还没有记录，快去转一转吧~</div>';
    return;
  }
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" style="animation-delay:${i * 0.05}s">
      <span class="h-emoji">${h.emoji}</span>
      <div class="h-info">
        <div class="h-name">${h.name}</div>
        <div class="h-cat">${h.calories} kcal · ${h.difficulty}</div>
      </div>
      <span class="h-time">${h.time}</span>
    </div>
  `).join('');
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2800);
}

// ==================== Init ====================
(function init() {
  try {
    const saved = localStorage.getItem('shi-guang-history');
    if (saved) {
      history = JSON.parse(saved);
      renderHistory();
    }
  } catch(e) {}
})();
</script>
