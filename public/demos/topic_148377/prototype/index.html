<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全民守护·全域寻亲智慧打拐一体化平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ====== 入口页专有样式 ====== */
    body {
      background: #0a0e1a;
      color: #e0e6f0;
      overflow-x: hidden;
    }

    /* --- 背景 --- */
    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      /* 深蓝渐变底色 */
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2a 40%, #1b2838 70%, #0a0e1a 100%);
    }

    /* 网格线 */
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift {
      0%   { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    /* 径向光晕 */
    .radial-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 70%);
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      animation: glowPulse 6s ease-in-out infinite alternate;
    }
    @keyframes glowPulse {
      0%   { opacity: 0.6; transform: translateX(-50%) scale(1); }
      100% { opacity: 1;   transform: translateX(-50%) scale(1.15); }
    }

    /* 粒子画布 */
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* --- 页面容器 --- */
    .landing {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 32px;
    }

    /* --- 顶部标题 --- */
    .landing-header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeInDown 0.8s ease both;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .landing-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #e63946, #f06470);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(230, 57, 70, 0.35);
    }

    .landing-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #e0e6f0 0%, #38bdf8 50%, #e0e6f0 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShimmer 4s linear infinite;
      line-height: 1.3;
    }
    @keyframes titleShimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .landing-subtitle {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 400;
      color: rgba(224, 230, 240, 0.55);
      letter-spacing: 4px;
    }

    /* --- 入口卡片组 --- */
    .entry-cards {
      display: flex;
      gap: 28px;
      margin-bottom: 64px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .entry-card {
      flex: 1 1 280px;
      max-width: 340px;
      min-width: 260px;
      padding: 36px 28px 32px;
      background: linear-gradient(145deg, rgba(20, 30, 52, 0.85), rgba(12, 18, 36, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.12);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
      animation: cardFadeUp 0.7s ease both;
      text-decoration: none;
      color: inherit;
    }
    .entry-card:nth-child(1) { animation-delay: 0.15s; }
    .entry-card:nth-child(2) { animation-delay: 0.3s; }
    .entry-card:nth-child(3) { animation-delay: 0.45s; }

    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 卡片内部光晕条 */
    .entry-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.06), transparent);
      transition: left 0.6s ease;
    }
    .entry-card:hover::before {
      left: 100%;
    }

    .entry-card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(56, 189, 248, 0.15),
        inset 0 1px 0 rgba(56, 189, 248, 0.1);
    }

    .card-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .entry-card:hover .card-icon-wrap {
      transform: scale(1.1);
    }

    .card-icon-wrap.mobile  { background: linear-gradient(135deg, #e63946, #f06470); box-shadow: 0 6px 20px rgba(230,57,70,0.3); }
    .card-icon-wrap.police  { background: linear-gradient(135deg, #457b9d, #6a9bbc); box-shadow: 0 6px 20px rgba(69,123,157,0.3); }
    .card-icon-wrap.admin   { background: linear-gradient(135deg, #8b5cf6, #a78bfa); box-shadow: 0 6px 20px rgba(139,92,246,0.3); }

    .entry-card:hover .card-icon-wrap.mobile  { box-shadow: 0 8px 28px rgba(230,57,70,0.45); }
    .entry-card:hover .card-icon-wrap.police  { box-shadow: 0 8px 28px rgba(69,123,157,0.45); }
    .entry-card:hover .card-icon-wrap.admin   { box-shadow: 0 8px 28px rgba(139,92,246,0.45); }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f0f4fa;
    }

    .card-desc {
      font-size: 14px;
      color: rgba(224, 230, 240, 0.5);
      line-height: 1.6;
    }

    .card-arrow {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .entry-card:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }
    .card-icon-wrap.mobile  ~ .card-arrow  { color: #f06470; }
    .card-icon-wrap.police  ~ .card-arrow  { color: #6a9bbc; }
    .card-icon-wrap.admin   ~ .card-arrow  { color: #a78bfa; }

    /* --- 底部统计 --- */
    .stats-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
      animation: fadeIn 1s ease 0.6s both;
    }

    .stat-item {
      flex: 1 1 200px;
      max-width: 260px;
      min-width: 180px;
      padding: 24px 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.08);
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease;
    }
    .stat-item:hover {
      border-color: rgba(56, 189, 248, 0.25);
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-number .stat-suffix {
      font-size: 18px;
      font-weight: 600;
      color: rgba(56, 189, 248, 0.7);
    }

    .stat-label-text {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(224, 230, 240, 0.45);
      font-weight: 500;
    }

    /* --- 底部版权 --- */
    .landing-footer {
      margin-top: auto;
      padding-top: 24px;
      text-align: center;
      font-size: 13px;
      color: rgba(224, 230, 240, 0.25);
      letter-spacing: 1px;
      animation: fadeIn 1s ease 0.9s both;
    }

    /* --- 响应式 --- */
    @media (max-width: 768px) {
      .landing {
        padding: 40px 16px 24px;
      }
      .landing-title {
        font-size: 24px;
        letter-spacing: 1px;
      }
      .landing-subtitle {
        font-size: 14px;
        letter-spacing: 2px;
      }
      .landing-header {
        margin-bottom: 36px;
      }
      .entry-cards {
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }
      .entry-card {
        max-width: 100%;
        flex: none;
        width: 100%;
      }
      .stats-bar {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }
      .stat-item {
        max-width: 100%;
        flex: none;
        width: 100%;
      }
      .stat-number {
        font-size: 26px;
      }
      .landing-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        font-size: 28px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .entry-cards {
        gap: 20px;
      }
      .entry-card {
        flex: 1 1 240px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景层 -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="radial-glow"></div>
    <canvas id="particleCanvas"></canvas>
  </div>

  <!-- 主内容 -->
  <div class="landing">

    <!-- 顶部标题 -->
    <header class="landing-header">
      <div class="landing-logo">🛡️</div>
      <h1 class="landing-title">全民守护·全域寻亲智慧打拐一体化平台</h1>
      <p class="landing-subtitle">让爱回家，让世界无拐</p>
    </header>

    <!-- 三端入口卡片 -->
    <div class="entry-cards">
      <!-- 移动端 -->
      <a class="entry-card" href="mobile.html">
        <div class="card-icon-wrap mobile">📱</div>
        <div class="card-title">移动端（家属/志愿者版）</div>
        <div class="card-desc">一键报案、线索上报、志愿者中心</div>
        <div class="card-arrow">进入 →</div>
      </a>
      <!-- PC民警工作端 -->
      <a class="entry-card" href="police.html">
        <div class="card-icon-wrap police">💻</div>
        <div class="card-title">PC民警工作端</div>
        <div class="card-desc">预警处置、档案管理、数据看板</div>
        <div class="card-arrow">进入 →</div>
      </a>
      <!-- PC系统管理端 -->
      <a class="entry-card" href="admin.html">
        <div class="card-icon-wrap admin">⚙️</div>
        <div class="card-title">PC系统管理端</div>
        <div class="card-desc">用户管理、权限配置、系统运维</div>
        <div class="card-arrow">进入 →</div>
      </a>
    </div>

    <!-- 底部统计 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-number"><span data-target="totalMissing">0</span></div>
        <div class="stat-label-text">在档失踪人员数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number"><span data-target="foundThisMonth">0</span></div>
        <div class="stat-label-text">本月找回人数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number"><span data-target="volunteerCount">0</span></div>
        <div class="stat-label-text">志愿者人数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number"><span data-target="aiMatchRate">0</span><span class="stat-suffix">%</span></div>
        <div class="stat-label-text">AI匹配成功率</div>
      </div>
    </div>

    <!-- 底部版权 -->
    <footer class="landing-footer">
      © 2026 全民守护系统 | 科技有温度，AI有良知
    </footer>

  </div>

  <!-- Mock 数据 -->
  <script src="js/mock.js"></script>

  <script>
    /* ====== 粒子动画 ====== */
    (function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 60;
      const CONNECT_DIST = 140;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // 初始化粒子
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 1.5 + 0.5
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 绘制连线
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECT_DIST) {
              const alpha = (1 - dist / CONNECT_DIST) * 0.12;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(56,189,248,' + alpha + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        // 绘制粒子
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56,189,248,0.35)';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ====== 数字滚动动画 ====== */
    (function initCountUp() {
      const stats = window.MockData && window.MockData.STATS;
      if (!stats) return;

      const targetMap = {
        totalMissing:   stats.totalMissing,
        foundThisMonth: stats.foundThisMonth,
        volunteerCount: stats.volunteerCount,
        aiMatchRate:    stats.aiMatchRate
      };

      const spans = document.querySelectorAll('[data-target]');
      const DURATION = 2000; // 2秒
      const FPS = 60;
      const totalSteps = Math.ceil(DURATION / (1000 / FPS));

      // IntersectionObserver 触发动画
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            startCountUp();
            observer.disconnect();
          }
        });
      }, { threshold: 0.3 });

      const statsBar = document.getElementById('statsBar');
      if (statsBar) observer.observe(statsBar);

      function startCountUp() {
        spans.forEach(span => {
          const key = span.getAttribute('data-target');
          const target = targetMap[key];
          if (target === undefined) return;

          const isFloat = !Number.isInteger(target);
          let step = 0;

          function tick() {
            step++;
            const progress = step / totalSteps;
            // easeOutExpo
            const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
            let current = target * ease;

            if (isFloat) {
              span.textContent = current.toFixed(1);
            } else {
              span.textContent = Math.floor(current).toLocaleString('zh-CN');
            }

            if (step < totalSteps) {
              requestAnimationFrame(tick);
            } else {
              // 确保最终值精确
              span.textContent = isFloat ? target.toFixed(1) : target.toLocaleString('zh-CN');
            }
          }
          requestAnimationFrame(tick);
        });
      }
    })();
  </script>
</body>
</html>
