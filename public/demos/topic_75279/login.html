<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观文智枢 Lumina Nexus · 登录</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#007BFF; --purple:#7C3AED; --green:#10B981; --orange:#F59E0B;
  --red:#EF4444;
  --bg:#F8FAFC; --grid:#F1F5F9;
  --border:#E2E8F0; --text:#1E293B; --text-sec:#64748B; --text-light:#94A3B8;
  --card-shadow:0 4px 24px rgba(0,123,255,0.06);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  color:var(--text);
}

/* ===== Layout: left-right split ===== */
.login-page{display:flex;width:100vw;height:100vh;}

/* ===== Left: Brand Visual Area ===== */
.brand-side{
  width:50%;height:100%;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(ellipse 600px 400px at 30% 30%, rgba(0,123,255,0.06), transparent 70%),
    radial-gradient(ellipse 500px 500px at 70% 70%, rgba(124,58,237,0.05), transparent 70%),
    var(--bg);
}
.brand-side::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:40px 40px;opacity:0.6;pointer-events:none;
}

/* Characters container */
.char-group{position:relative;width:320px;height:240px;margin-bottom:48px;z-index:2;}
.char{position:absolute;width:100px;height:100px;transform-box:border-box;}
.char svg{width:100%;height:100%;overflow:visible;}

/* Eye whites (outer) and pupils (inner, movable) */
.eye-white{fill:#fff;}
.eye-pupil{
  fill:#1E293B;
  transition:transform .08s linear;
  transform-box:fill-box;transform-origin:center;
}
/* Cover state: pupil hidden + eyelid closes */
.char-eyelid{
  fill:currentColor;
  transform:scaleY(0);
  transform-box:fill-box;transform-origin:center;
  transition:transform .3s var(--ease);
}
.char.covering .char-eyelid{transform:scaleY(1);}
.char.covering .eye-pupil{opacity:0;transition:opacity .15s var(--ease);}

/* Blink */
.eye-pupil.blink{
  transform:scaleY(0.08) translate(0,0) !important;
  transition:transform .06s ease !important;
}

/* Character positions & float animations */
.char-1{top:10px;left:40px;animation:floatA 4s ease-in-out infinite;}
.char-2{top:0;left:140px;animation:floatB 5s ease-in-out infinite;}
.char-3{top:80px;left:90px;animation:floatC 3.5s ease-in-out infinite;}
.char-4{top:30px;left:200px;animation:floatD 4.5s ease-in-out infinite;}
@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes floatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes floatD{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Brand text */
.brand-text{text-align:center;z-index:2;}
.brand-title{font-size:42px;font-weight:700;color:var(--text);letter-spacing:-1px;margin-bottom:8px;}
.brand-sub{font-size:15px;color:var(--text-sec);letter-spacing:0.5px;}

/* ===== Right: Login Form Area ===== */
.form-side{
  width:50%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;
}
.form-side::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:40px 40px;opacity:0.4;pointer-events:none;
}

.login-card{
  width:440px;padding:56px 48px;
  background:#fff;border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--card-shadow);
  position:relative;z-index:2;
  opacity:0;transform:scale(0.85);
  animation:cardEnter .6s var(--ease-spring) .1s forwards;
}
@keyframes cardEnter{to{opacity:1;transform:scale(1);}}
.login-card.exiting{animation:cardExit .4s var(--ease) forwards;}
@keyframes cardExit{to{opacity:0;transform:scale(0.9);}}

.card-header{margin-bottom:32px;}
.card-title{font-size:28px;font-weight:600;color:var(--text);letter-spacing:-0.5px;}
.card-sub{font-size:14px;color:var(--text-sec);margin-top:8px;}

/* Input groups */
.input-group{margin-bottom:20px;}
.input-label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-icon{
  position:absolute;left:14px;color:var(--text-light);font-size:16px;
  transition:color .3s var(--ease);pointer-events:none;z-index:3;
}
.input-field{
  width:100%;height:44px;padding:0 14px 0 42px;
  border:1px solid var(--border);border-radius:8px;
  font-size:15px;color:var(--text);background:#fff;
  transition:border-color .3s var(--ease), box-shadow .3s var(--ease);
  outline:none;position:relative;z-index:1;
}
.input-field::placeholder{color:var(--text-light);}
.input-field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,123,255,0.1);}
.input-wrap:focus-within .input-icon{color:var(--blue);}

/* ===== In-place password validation overlay on username field ===== */
/* Overlay container mirrors the input's exact dimensions, padding, font */
.char-overlay-container{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:2;overflow:hidden;
  border-radius:8px;
  font-size:15px;line-height:44px;font-family:inherit;letter-spacing:normal;
}
/* Each color block: absolutely positioned, fades in/out via opacity */
.char-overlay{
  position:absolute;top:0;height:100%;
  border-radius:4px;
  transition:opacity .25s var(--ease), background-color .25s var(--ease), border-bottom-color .25s var(--ease), border-radius .25s var(--ease);
  opacity:0;
  border-bottom:2px solid transparent;
}
.char-overlay.correct{
  background-color:rgba(16,185,129,0.25);
  border-bottom-color:var(--green);
  opacity:1;
}
.char-overlay.wrong{
  background-color:rgba(239,68,68,0.25);
  border-bottom-color:var(--red);
  opacity:1;
}
/* Hidden mirror span: same font metrics as input for pixel-perfect measurement */
.mirror-span{
  position:absolute;visibility:hidden;white-space:pre;
  font-size:15px;font-family:inherit;letter-spacing:normal;font-weight:400;
  top:0;left:42px; /* positioned at input's padding-left for reference */
}

/* Username border turns green when all chars correct */
.input-wrap.all-correct .input-field{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(16,185,129,0.1);
}

/* Password toggle */
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-light);font-size:16px;padding:4px;
  transition:color .3s var(--ease);z-index:3;
}
.pw-toggle:hover{color:var(--blue);}

/* Shake animation */
.input-wrap.shake{animation:shake .4s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.input-wrap.error .input-field{border-color:var(--red);}
.input-wrap.error .input-icon{color:var(--red);}

/* Error message */
.error-msg{
  font-size:13px;color:var(--red);margin-top:8px;
  opacity:0;max-height:0;overflow:hidden;
  transition:opacity .3s var(--ease), max-height .3s var(--ease);
}
.error-msg.show{opacity:1;max-height:30px;}

/* Login button */
.login-btn{
  width:100%;height:44px;margin-top:28px;
  border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg, #007BFF 0%, #7C3AED 100%);
  color:#fff;font-size:15px;font-weight:600;font-family:inherit;
  transition:opacity .3s var(--ease), transform .15s var(--ease), box-shadow .3s var(--ease);
  position:relative;overflow:hidden;
}
.login-btn:hover{opacity:0.92;}
.login-btn:active{transform:scale(0.98);}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;}
.login-btn.ready{animation:btnGlow 2s ease-in-out infinite;}
@keyframes btnGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(0,123,255,0.3);}
  50%{box-shadow:0 0 20px 4px rgba(0,123,255,0.25);}
}

/* Bottom hint */
.login-hint{text-align:center;margin-top:24px;font-size:13px;color:var(--text-light);}
.login-hint code{
  background:var(--grid);padding:2px 8px;border-radius:4px;
  font-family:inherit;color:var(--text-sec);font-size:12px;
}

/* ===== Responsive ===== */
@media (max-width:900px){
  .login-page{flex-direction:column;}
  .brand-side{width:100%;height:40%;}
  .form-side{width:100%;height:60%;}
  .char-group{width:240px;height:180px;margin-bottom:24px;}
  .char{width:80px;height:80px;}
  .char-1{top:0;left:20px;} .char-2{top:0;left:100px;}
  .char-3{top:60px;left:60px;} .char-4{top:10px;left:150px;}
  .brand-title{font-size:32px;}
  .login-card{width:90%;max-width:400px;padding:40px 32px;}
}
@media (max-width:440px){
  .login-card{padding:32px 24px;}
  .card-title{font-size:24px;}
}
</style>
</head>
<body>

<div class="login-page">

  <!-- ===== LEFT: Brand Visual Area ===== -->
  <div class="brand-side">
    <div class="char-group" id="charGroup">
      <!-- Character 1: Blue (#007BFF) -->
      <div class="char char-1" style="color:#007BFF">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="38" fill="#007BFF"/>
          <!-- Left eye: white + pupil -->
          <circle class="eye-white" cx="38" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="1-l" cx="38" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="38" cy="46" rx="6.5" ry="6.5"/>
          <!-- Right eye: white + pupil -->
          <circle class="eye-white" cx="62" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="1-r" cx="62" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="62" cy="46" rx="6.5" ry="6.5"/>
        </svg>
      </div>
      <!-- Character 2: Purple (#7C3AED) -->
      <div class="char char-2" style="color:#7C3AED">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="38" fill="#7C3AED"/>
          <circle class="eye-white" cx="38" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="2-l" cx="38" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="38" cy="46" rx="6.5" ry="6.5"/>
          <circle class="eye-white" cx="62" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="2-r" cx="62" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="62" cy="46" rx="6.5" ry="6.5"/>
        </svg>
      </div>
      <!-- Character 3: Green (#10B981) -->
      <div class="char char-3" style="color:#10B981">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="38" fill="#10B981"/>
          <circle class="eye-white" cx="38" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="3-l" cx="38" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="38" cy="46" rx="6.5" ry="6.5"/>
          <circle class="eye-white" cx="62" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="3-r" cx="62" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="62" cy="46" rx="6.5" ry="6.5"/>
        </svg>
      </div>
      <!-- Character 4: Orange (#F59E0B) -->
      <div class="char char-4" style="color:#F59E0B">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="38" fill="#F59E0B"/>
          <circle class="eye-white" cx="38" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="4-l" cx="38" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="38" cy="46" rx="6.5" ry="6.5"/>
          <circle class="eye-white" cx="62" cy="46" r="6"/>
          <circle class="eye-pupil" data-eye="4-r" cx="62" cy="46" r="3"/>
          <ellipse class="char-eyelid" cx="62" cy="46" rx="6.5" ry="6.5"/>
        </svg>
      </div>
    </div>
    <div class="brand-text">
      <div class="brand-title">观文智枢</div>
      <div class="brand-sub">Lumina Nexus · 让信息归于秩序</div>
    </div>
  </div>

  <!-- ===== RIGHT: Login Form Area ===== -->
  <div class="form-side">
    <div class="login-card" id="loginCard">
      <div class="card-header">
        <div class="card-title">欢迎回来</div>
        <div class="card-sub">登录以继续使用观文智枢</div>
      </div>

      <!-- Account input with in-place validation overlay -->
      <div class="input-group">
        <label class="input-label" for="username">账号</label>
        <div class="input-wrap" id="userWrap">
          <input type="text" id="username" class="input-field" placeholder="请输入账号" autocomplete="off">
          <i class="fa-regular fa-user input-icon"></i>
          <!-- In-place character validation overlay -->
          <div class="char-overlay-container" id="charOverlayContainer"></div>
          <!-- Hidden mirror span for measuring character positions -->
          <span class="mirror-span" id="mirrorSpan"></span>
        </div>
      </div>

      <!-- Password input -->
      <div class="input-group">
        <label class="input-label" for="password">密码</label>
        <div class="input-wrap" id="pwWrap">
          <input type="password" id="password" class="input-field" placeholder="请输入密码" autocomplete="off">
          <i class="fa-solid fa-lock input-icon"></i>
          <button class="pw-toggle" id="pwToggle" type="button" aria-label="切换密码显示">
            <i class="fa-regular fa-eye-slash" id="pwIcon"></i>
          </button>
        </div>
        <div class="error-msg" id="errorMsg">账号或密码不正确，请重试</div>
      </div>

      <!-- Login button -->
      <button class="login-btn" id="loginBtn" type="button">登 录</button>

      <!-- Hint -->
      <div class="login-hint">
        参赛演示账号 / 密码均为：<code>trae.cn</code>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  var CORRECT_USER = 'trae.cn';
  var CORRECT_PASS = 'trae.cn';
  var STORAGE_KEY = 'lumina_nexus_auth';

  // Elements
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var userWrap = document.getElementById('userWrap');
  var pwWrap = document.getElementById('pwWrap');
  var pwToggle = document.getElementById('pwToggle');
  var pwIcon = document.getElementById('pwIcon');
  var loginBtn = document.getElementById('loginBtn');
  var errorMsg = document.getElementById('errorMsg');
  var loginCard = document.getElementById('loginCard');
  var overlayContainer = document.getElementById('charOverlayContainer');
  var mirrorSpan = document.getElementById('mirrorSpan');

  // State
  var pwVisible = false;
  var charsCovering = false;
  var mouseX = 0, mouseY = 0;
  var pupilTargets = []; // {el, baseX, baseY, maxR}

  /* ===== Eye tracking: pupils follow mouse ===== */
  function initEyeTracking(){
    var pupils = document.querySelectorAll('.eye-pupil');
    pupils.forEach(function(p){
      var cx = parseFloat(p.getAttribute('cx'));
      var cy = parseFloat(p.getAttribute('cy'));
      var r = parseFloat(p.getAttribute('r'));
      pupilTargets.push({
        el: p,
        baseX: cx,
        baseY: cy,
        maxR: r * 1.3 // max move radius = ~40% of eye white radius (eye white r=6, pupil r=3)
      });
    });
  }

  function updatePupils(){
    pupilTargets.forEach(function(t){
      if(charsCovering) return; // Don't track when covering
      // Get eye position in screen coords
      var rect = t.el.getBoundingClientRect();
      var eyeCenterX = rect.left + rect.width / 2;
      var eyeCenterY = rect.top + rect.height / 2;
      // Calculate angle and distance
      var dx = mouseX - eyeCenterX;
      var dy = mouseY - eyeCenterY;
      var angle = Math.atan2(dy, dx);
      var dist = Math.min(Math.sqrt(dx*dx + dy*dy), 60) / 60; // normalize 0-1
      var moveX = Math.cos(angle) * t.maxR * dist;
      var moveY = Math.sin(angle) * t.maxR * dist;
      // Apply transform with smooth transition (CSS handles .08s)
      t.el.style.transform = 'translate(' + moveX.toFixed(2) + 'px, ' + moveY.toFixed(2) + 'px)';
    });
    requestAnimationFrame(updatePupils);
  }

  document.addEventListener('mousemove', function(e){
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  /* ===== Auto-blink for characters ===== */
  function autoBlink(){
    var charNum = Math.floor(Math.random() * 4) + 1;
    var eyeL = document.querySelector('.eye-pupil[data-eye="' + charNum + '-l"]');
    var eyeR = document.querySelector('.eye-pupil[data-eye="' + charNum + '-r"]');
    if(eyeL && eyeR && !charsCovering){
      eyeL.classList.add('blink');
      eyeR.classList.add('blink');
      setTimeout(function(){
        eyeL.classList.remove('blink');
        eyeR.classList.remove('blink');
      }, 150);
    }
    setTimeout(autoBlink, 2000 + Math.random() * 3000);
  }

  /* ===== Password visibility toggle + character "cover eyes" ===== */
  function setCharsCover(cover){
    charsCovering = cover;
    var chars = document.querySelectorAll('.char');
    chars.forEach(function(c){
      if(cover){
        c.classList.add('covering');
      }else{
        c.classList.remove('covering');
      }
    });
  }

  pwToggle.addEventListener('click', function(){
    pwVisible = !pwVisible;
    if(pwVisible){
      passwordInput.type = 'text';
      pwIcon.className = 'fa-regular fa-eye';
      setCharsCover(true);
    }else{
      passwordInput.type = 'password';
      pwIcon.className = 'fa-regular fa-eye-slash';
      setCharsCover(false);
    }
  });

  /* ===== In-place password validation overlay =====
   * Two-phase approach:
   *   1. rebuildOverlayPositions() — called when username changes;
   *      recreates overlay divs with correct left/width using mirror span.
   *   2. updateCharOverlayState() — called when password or username changes;
   *      toggles .correct / .wrong classes so CSS opacity transition handles
   *      smooth fade-in (0.2s) and fade-out (0.2s) without destroying elements.
   */

  // Phase 1: rebuild overlay divs to match username character positions
  function rebuildOverlayPositions(){
    var userVal = usernameInput.value;
    overlayContainer.innerHTML = '';

    if(!userVal) return;

    // Measure each character's pixel position via hidden mirror span
    for(var i = 0; i < userVal.length; i++){
      mirrorSpan.textContent = userVal.substring(0, i);
      var beforeWidth = mirrorSpan.offsetWidth;
      mirrorSpan.textContent = userVal.substring(0, i + 1);
      var charWidth = mirrorSpan.offsetWidth - beforeWidth;

      var ov = document.createElement('div');
      ov.className = 'char-overlay'; // starts at opacity:0 (invisible)
      /* Key: offset by 42px (input padding-left) so block aligns with the
         corresponding character inside the input field, not the input border */
      ov.style.left = (42 + beforeWidth) + 'px';
      ov.style.width = charWidth + 'px';
      overlayContainer.appendChild(ov);
    }
  }

  // Phase 2: update each overlay's correct/wrong/none state
  // Only compares password chars vs username chars position-by-position.
  // Does NOT judge whether the account itself is "correct".
  // Border-radius: only first & last visible blocks are rounded so the
  // middle ones visually connect into one continuous bar.
  function updateCharOverlayState(){
    var pwVal = passwordInput.value;
    var userVal = usernameInput.value;
    var overlays = overlayContainer.children;
    var checkLen = Math.min(pwVal.length, userVal.length);

    for(var i = 0; i < overlays.length; i++){
      if(i < checkLen){
        var isCorrect = (pwVal[i] === userVal[i]);
        overlays[i].className = 'char-overlay ' + (isCorrect ? 'correct' : 'wrong');
        // Continuous bar: round only the very first & very last visible block
        if(checkLen === 1){
          overlays[i].style.borderRadius = '4px';           // single block → all corners
        }else if(i === 0){
          overlays[i].style.borderRadius = '4px 0 0 4px';   // first → left corners
        }else if(i === checkLen - 1){
          overlays[i].style.borderRadius = '0 4px 4px 0';   // last → right corners
        }else{
          overlays[i].style.borderRadius = '0';              // middle → square, connects
        }
      }else{
        // Position not yet typed in password → no coverage, fade out
        overlays[i].className = 'char-overlay';
        overlays[i].style.borderRadius = '4px 0 0 4px';     // reset for next fade-in
      }
    }
  }

  // Password input: only update state (positions unchanged)
  passwordInput.addEventListener('input', function(){
    updateCharOverlayState();
    clearError();
  });
  // Username input: rebuild positions then update state
  usernameInput.addEventListener('input', function(){
    rebuildOverlayPositions();
    updateCharOverlayState();
    clearError();
  });

  function clearError(){
    errorMsg.classList.remove('show');
    userWrap.classList.remove('error','shake');
    pwWrap.classList.remove('error','shake');
  }

  /* ===== Shake animation trigger ===== */
  function triggerShake(){
    clearError();
    void userWrap.offsetWidth;
    void pwWrap.offsetWidth;
    userWrap.classList.add('error','shake');
    pwWrap.classList.add('error','shake');
    errorMsg.classList.add('show');
    setTimeout(function(){
      userWrap.classList.remove('shake');
      pwWrap.classList.remove('shake');
    }, 400);
  }

  /* ===== Login logic ===== */
  function doLogin(){
    var user = usernameInput.value.trim();
    var pass = passwordInput.value;
    if(user === CORRECT_USER && pass === CORRECT_PASS){
      var authData = {
        user: user,
        loginTime: Date.now(),
        token: btoa(user + ':' + pass + ':' + Date.now())
      };
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(authData));
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(authData));
      }catch(e){}
      loginBtn.disabled = true;
      loginBtn.textContent = '登录成功';
      loginCard.classList.add('exiting');
      setTimeout(function(){ window.location.href = 'work.html'; }, 400);
    }else{
      triggerShake();
    }
  }

  loginBtn.addEventListener('click', doLogin);
  passwordInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
  });
  usernameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') passwordInput.focus();
  });

  // Initialize
  initEyeTracking();
  updatePupils();
  setTimeout(autoBlink, 1500);
  setTimeout(function(){ usernameInput.focus(); }, 700);

})();
</script>

</body>
</html>
