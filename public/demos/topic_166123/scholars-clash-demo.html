<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>人类群星闪耀时 — 学者对决</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0c16;color:#fff;font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow:hidden;height:100dvh;width:100vw;display:flex;flex-direction:column;position:relative}
#app{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#0f1220 0%,#1a1f35 40%,#0f1220 100%)}
/* ====== 顶部 HUD ====== */
#hud{position:absolute;top:0;left:0;right:0;height:48px;z-index:20;display:flex;align-items:center;padding:0 10px;background:linear-gradient(180deg,rgba(0,0,0,0.8) 60%,transparent);pointer-events:none}
#hud-elixir{flex:1;max-width:200px;height:20px;background:rgba(255,255,255,0.06);border-radius:10px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
#hud-elixir-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#6c3aff,#a78bfa);transition:width .15s;width:50%}
#hud-elixir-fill.double{background:linear-gradient(90deg,#ff6b35,#ffb347)}
#hud-elixir-text{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5)}
#hud-timer{margin-left:12px;display:flex;align-items:center;gap:4px}
#hud-timer-text{font-size:15px;font-weight:bold;color:#fff;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#hud-double{display:none;font-size:10px;background:#ff6b35;color:#fff;padding:2px 6px;border-radius:4px;font-weight:bold}
#hud-crowns{display:flex;gap:3px;margin-left:8px;font-size:18px}
.crown{opacity:0.15;transition:opacity .3s}.crown.active{opacity:1}
/* ====== 战场 ====== */
#battlefield{position:absolute;top:48px;left:0;right:0;bottom:168px}
canvas#field{width:100%;height:100%;display:block;touch-action:none}
/* ====== 部署预览线 ====== */
#deploy-line{position:absolute;bottom:168px;left:0;right:50%;height:2px;background:linear-gradient(90deg,transparent,rgba(100,180,255,0.3),transparent);pointer-events:none;display:none;z-index:5}
/* ====== 底部卡牌 ====== */
#bottom{position:absolute;bottom:0;left:0;right:0;height:168px;z-index:15;background:linear-gradient(0deg,#0a0c16 70%,rgba(10,12,22,0.85));border-top:2px solid rgba(255,255,255,0.04)}
#cards{position:absolute;bottom:8px;left:6px;right:6px;display:flex;gap:5px;justify-content:center}
.card{flex:1;max-width:96px;min-width:70px;height:140px;border-radius:10px;position:relative;cursor:grab;overflow:hidden;border:2px solid rgba(255,255,255,0.06);transition:transform .12s,border-color .12s;touch-action:none}
.card:active{cursor:grabbing}
.card.disabled{opacity:0.35}
.card.dragging{z-index:100;transform:scale(1.05);border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,0.3)}
.card.selected{border-color:#ffd700;transform:translateY(-10px);box-shadow:0 8px 25px rgba(255,215,0,0.2)}
.card-bg{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:8px}
.card-icon{position:absolute;top:30px;left:4px;right:4px;bottom:26px;display:flex;align-items:center;justify-content:center;font-size:34px}
.card-cost{position:absolute;top:-7px;left:-7px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#fff;border:2px solid rgba(255,255,255,0.2);z-index:3;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.card-cost.can{background:linear-gradient(135deg,#6c3aff,#8b6cff)}
.card-cost.no{background:#444}
.card-type{position:absolute;top:3px;right:3px;font-size:7px;padding:1px 4px;border-radius:3px;color:#fff;opacity:0.6}
.card-name{position:absolute;bottom:3px;left:3px;right:3px;text-align:center;font-size:10px;font-weight:bold;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,0.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{position:absolute;top:70px;left:4px;right:4px;text-align:center;font-size:7px;color:rgba(255,255,255,0.4);white-space:nowrap;overflow:hidden}
/* ====== 敌方卡牌 ====== */
#enemy-cards{position:absolute;top:48px;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:center;gap:2px;pointer-events:none;z-index:5}
.ec{width:28px;height:36px;border-radius:3px;background:linear-gradient(135deg,#251a38,#1a1030);border:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,0.15)}
/* ====== 提示 ====== */
#hint{position:absolute;bottom:172px;left:0;right:0;text-align:center;font-size:12px;color:#8ab4ff;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 1px 8px rgba(0,0,0,0.8);z-index:8}
#hint.show{opacity:1}
/* ====== 通知 ====== */
#notif{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:bold;color:#ffd700;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 2px 15px rgba(0,0,0,0.9);z-index:25;text-align:center;background:rgba(0,0,0,0.5);padding:12px 24px;border-radius:12px;backdrop-filter:blur(4px)}
#notif.show{opacity:1}
/* ====== 结果 ====== */
#result{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px)}
#result.show{display:flex}
#result-title{font-size:48px;font-weight:bold;margin-bottom:6px}
#result-sub{font-size:18px;color:#aaa;margin-bottom:8px}
#result-stars{font-size:36px;margin-bottom:20px}
#result-btn{padding:14px 40px;font-size:16px;border:none;border-radius:10px;background:linear-gradient(135deg,#6c3aff,#a78bfa);color:#fff;cursor:pointer;font-family:inherit;font-weight:bold;transition:transform .15s}
#result-btn:active{transform:scale(0.95)}
/* 拖拽幽灵 */
#ghost{position:fixed;pointer-events:none;z-index:200;opacity:0.8;transition:none;display:none}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="hud-elixir">
      <div id="hud-elixir-fill"></div>
      <div id="hud-elixir-text">5/10</div>
    </div>
    <div id="hud-timer">
      <span id="hud-timer-text">3:00</span>
      <span id="hud-double">⚡双倍</span>
    </div>
    <div id="hud-crowns">
      <span class="crown">👑</span>
      <span class="crown">👑</span>
      <span class="crown">👑</span>
    </div>
  </div>

  <div id="enemy-cards"><div class="ec">?</div><div class="ec">?</div><div class="ec">?</div><div class="ec">?</div></div>
  <div id="battlefield"><canvas id="field"></canvas></div>
  <div id="deploy-line"></div>
  <div id="hint">👆 拖拽卡牌到左半场部署</div>
  <div id="notif"></div>

  <div id="bottom"><div id="cards"></div></div>

  <div id="result">
    <div id="result-title">🎉 胜利！</div>
    <div id="result-sub">完美！3星取胜</div>
    <div id="result-stars">👑👑👑</div>
    <button id="result-btn" onclick="location.reload()">再来一局</button>
  </div>
</div>

<script>
// ====== 8位学者 ======
const CARDS = [
  {id:0,name:'牛顿',cost:4,hp:3200,dmg:180,spd:0.9,tank:true,color:'#3b82f6',icon:'🔬',type:'坦克'},
  {id:1,name:'爱因斯坦',cost:5,hp:900,dmg:200,spd:1.2,tank:false,color:'#3b82f6',icon:'⚛️',type:'远程'},
  {id:2,name:'孔子',cost:4,hp:2800,dmg:130,spd:0.7,tank:true,color:'#eab308',icon:'📖',type:'坦克'},
  {id:3,name:'高斯',cost:3,hp:1400,dmg:170,spd:1.3,tank:false,color:'#a78bfa',icon:'📐',type:'近战'},
  {id:4,name:'苏格拉底',cost:3,hp:700,dmg:110,spd:1.7,tank:false,color:'#eab308',icon:'🗣️',type:'快速'},
  {id:5,name:'欧拉',cost:4,hp:800,dmg:160,spd:1.5,tank:false,color:'#a78bfa',icon:'🔢',type:'远程'},
  {id:6,name:'李白',cost:3,hp:900,dmg:150,spd:2.0,tank:false,color:'#f472b6',icon:'🍷',type:'刺客'},
  {id:7,name:'孙子',cost:5,hp:700,dmg:120,spd:1.0,tank:false,color:'#fb923c',icon:'⚔️',type:'辅助'},
];

// ====== 游戏状态 ======
let G={
  deck:[],hand:[],deckIdx:0,
  pMana:5,aMana:5,manaTimer:0,gameTime:180,
  aiTimer:0,aiInterval:5,
  selected:-1,dragging:false,
  units:[],towers:[],
  nextId:0,isDouble:false,over:false,
  pScore:0,aScore:0,lastTime:0,
};

// ====== Canvas ======
const C=document.getElementById('field');
const ctx=C.getContext('2d');
let W,H;

function resize(){
  const r=C.parentElement.getBoundingClientRect();
  W=C.width=r.width;H=C.height=r.height;
}
resize();window.addEventListener('resize',resize);

const Fw=20,Fh=14;
function toS(x,y){
  return{x:(x/Fw+0.5)*W,y:(0.5-y/Fh)*H*0.9+H*0.08};
}
function toW(sx,sy){
  return{x:(sx/W-0.5)*Fw,y:(0.5-(sy-H*0.08)/(H*0.9))*Fh};
}

// ====== 单位 ======
class U{
  constructor(x,y,c,t){
    this.id=G.nextId++;this.x=x;this.y=y;
    this.hp=c.hp;this.maxHp=c.hp;
    this.dmg=c.dmg;this.spd=c.spd;
    this.team=t;this.isTank=c.tank;
    this.range=c.tank?0.8:1.4;
    this.lastAtk=0;this.name=c.name;
    this.alive=true;this.size=c.tank?16:11;
    this.color=c.color;this.icon=c.icon;
    G.units.push(this);
  }
  update(dt){
    if(!this.alive)return;
    let tg=null,md=Infinity;
    for(const u of G.units){if(!u.alive||u.team==this.team)continue;const d=Math.hypot(this.x-u.x,this.y-u.y);if(d<md){md=d;tg=u;}}
    for(const t of G.towers){if(!t.alive||t.team==this.team)continue;const d=Math.hypot(this.x-t.x,this.y-t.y);if(d<md){md=d;tg=t;}}
    if(tg){
      if(md<this.range){
        if(performance.now()-this.lastAtk>1000){tg.hp-=this.dmg;this.lastAtk=performance.now();if(tg.hp<=0)tg.alive=false;}
      }else{
        const a=Math.atan2(tg.y-this.y,tg.x-this.x);
        this.x+=Math.cos(a)*this.spd*dt*2.5;
        this.y+=Math.sin(a)*this.spd*dt*2.5;
      }
    }else{
      const dir=this.team==0?1:-1;
      this.x+=dir*this.spd*dt*1.8;
      if(Math.abs(this.x)<3)this.y*=0.95;
    }
    this.x=Math.max(-9,Math.min(9,this.x));
    this.y=Math.max(-6.5,Math.min(6.5,this.y));
    if(this.hp<=0)this.alive=false;
  }
  draw(){
    if(!this.alive)return;
    const p=toS(this.x,this.y);
    const sz=this.size*Math.min(W,H)/500;
    const cl=this.team==0?'#60a5fa':'#f87171';
    ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(p.x,p.y+2,sz,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fill();ctx.shadowBlur=0;
    const g=ctx.createRadialGradient(p.x-sz*0.2,p.y-sz*0.2,0,p.x,p.y,sz);
    g.addColorStop(0,this.team==0?'#93bbfc':'#fc9393');
    g.addColorStop(1,cl);
    ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.stroke();
    ctx.font=`${sz}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.icon,p.x,p.y);
    const bw=sz*2.8,bh=Math.max(3,sz*0.3);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(p.x-bw/2,p.y-sz-7-bh,bw,bh);
    ctx.fillStyle=this.hp/this.maxHp>0.5?'#4ade80':this.hp/this.maxHp>0.25?'#fbbf24':'#f87171';
    ctx.fillRect(p.x-bw/2,p.y-sz-7-bh,bw*(this.hp/this.maxHp),bh);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font=`${Math.max(7,sz*0.5)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(this.name,p.x,p.y+sz+12);
  }
}

class T{
  constructor(x,y,hp,t,n,ik){
    this.x=x;this.y=y;this.hp=hp;this.maxHp=hp;
    this.team=t;this.name=n;this.isKing=ik;
    this.alive=true;this.lastAtk=0;
    this.range=ik?7:7.5;this.atkDmg=ik?100:80;
    G.towers.push(this);
  }
  update(dt){
    if(!this.alive)return;
    let tg=null,md=this.range;
    for(const u of G.units){if(!u.alive||u.team==this.team)continue;const d=Math.hypot(this.x-u.x,this.y-u.y);if(d<md){md=d;tg=u;}}
    if(tg&&performance.now()-this.lastAtk>(this.isKing?1100:900)){tg.hp-=this.atkDmg;this.lastAtk=performance.now();if(tg.hp<=0)tg.alive=false;}
    if(this.hp<=0)this.alive=false;
  }
  draw(){
    if(!this.alive)return;
    const p=toS(this.x,this.y);
    const sz=this.isKing?Math.min(W,H)/30:Math.min(W,H)/38;
    const cl=this.team==0?(this.isKing?'#1d4ed8':'#3b82f6'):(this.isKing?'#dc2626':'#ef4444');
    ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=15;
    ctx.fillStyle=cl;ctx.shadowBlur=0;
    ctx.fillRect(p.x-sz*1.3,p.y-sz*2,sz*2.6,sz*4);
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.strokeRect(p.x-sz*1.3,p.y-sz*2,sz*2.6,sz*4);
    const bw=sz*2.8,bh=Math.max(3,sz*0.3);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(p.x-bw/2,p.y-sz*2-8-bh,bw,bh);
    ctx.fillStyle=this.hp/this.maxHp>0.5?'#4ade80':this.hp/this.maxHp>0.25?'#fbbf24':'#f87171';
    ctx.fillRect(p.x-bw/2,p.y-sz*2-8-bh,bw*(this.hp/this.maxHp),bh);
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(9,sz*0.6)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(this.isKing?'知识殿堂':'学派塔',p.x,p.y+sz*2+4);
  }
}

// ====== 初始化 ======
function init(){
  G.deck=[...CARDS].sort(()=>Math.random()-0.5);
  G.hand=G.deck.slice(0,4);G.deckIdx=4;
  G.towers=[];
  new T(-8.5,0,4000,0,'PKing',1);
  new T(-5.5,3.5,2000,0,'PTL',0);
  new T(-5.5,-3.5,2000,0,'PTR',0);
  new T(8.5,0,4000,1,'AKing',1);
  new T(5.5,3.5,2000,1,'ATL',0);
  new T(5.5,-3.5,2000,1,'ATR',0);
  renderCards();
}

function spawn(x,y,c,t){new U(x,y,c,t);}

// ====== 绘制战场 ======
function drawField(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0c16');g.addColorStop(0.15,'#131829');g.addColorStop(0.5,'#1a1f35');g.addColorStop(0.85,'#131829');g.addColorStop(1,'#0a0c16');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Grid subtle
  ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=0.5;
  for(let x=0;x<=Fw;x++){const p=toS(x-Fw/2,0);ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,H);ctx.stroke();}
  for(let y=0;y<=Fh;y+=2){const p=toS(0,y-Fh/2);ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke();}
  // River
  const rY=toS(0,0).y;
  ctx.fillStyle='rgba(15,40,70,0.3)';ctx.fillRect(0,rY-50,W,100);
  ctx.fillStyle='rgba(20,60,100,0.1)';
  for(let i=0;i<8;i+=2){ctx.fillRect(0,rY-40+i*10,W,1);}
  // Bridges
  for(const bx of[-3.5,3.5]){
    const bl=toS(bx-1.8,0.6),br=toS(bx+1.8,-0.6);
    ctx.fillStyle='rgba(55,70,85,0.4)';ctx.fillRect(bl.x,br.y,br.x-bl.x,bl.y-br.y);
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.strokeRect(bl.x,br.y,br.x-bl.x,bl.y-br.y);
  }
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('知识长河',W/2,rY+4);
  // Deploy zone
  ctx.fillStyle='rgba(60,130,255,0.03)';ctx.strokeStyle='rgba(60,130,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([6,6]);
  ctx.beginPath();const dL=toS(-9,-6),dR=toS(-0.5,6);ctx.moveTo(dL.x+10,10);ctx.lineTo(dR.x-10,10);ctx.lineTo(dR.x-10,H-10);ctx.lineTo(dL.x+10,H-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle='rgba(100,180,255,0.08)';ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText('— 部署区域 —',W*0.25,H-8);
}

// ====== AI ======
function aiUpdate(dt){
  if(G.over)return;
  G.aiTimer+=dt;
  if(G.aiTimer>=G.aiInterval){
    G.aiTimer=0;G.aiInterval=3+Math.random()*5;
    if(G.aMana>=3){
      const aff=G.deck.filter(c=>c.cost<=G.aMana);
      if(aff.length>0){
        const p=aff[Math.floor(Math.random()*aff.length)];
        const side=Math.random()<0.5?-1:1;
        spawn(6+Math.random()*2.5,Math.random()*4*side,p,1);
        G.aMana-=p.cost;
      }
    }
  }
}

// ====== 主循环 ======
function update(dt){
  if(G.over||dt>0.1)return;
  G.gameTime-=dt;
  G.manaTimer+=dt;
  const dd=G.gameTime<60&&G.gameTime>0;
  G.isDouble=dd;
  const rate=dd?1.4:2.8;
  if(G.manaTimer>=rate){G.manaTimer-=rate;if(G.pMana<10)G.pMana++;if(G.aMana<10)G.aMana++;}
  aiUpdate(dt);
  for(let i=G.units.length-1;i>=0;i--){const u=G.units[i];u.update(dt);if(!u.alive)G.units.splice(i,1);}
  for(const t of G.towers)t.update(dt);
  const pT=G.towers.filter(t=>t.team===0&&!t.alive&&!t.isKing).length;
  const aT=G.towers.filter(t=>t.team===1&&!t.alive&&!t.isKing).length;
  G.pScore=Math.max(G.pScore,pT);G.aScore=Math.max(G.aScore,aT);
  const cs=document.querySelectorAll('.crown');
  cs[0].className='crown'+(aT>=1?' active':'');
  cs[1].className='crown'+(aT>=2?' active':'');
  cs[2].className='crown'+(aT>=3?' active':'');
  if(G.gameTime<-120)end('⚖️ 平局！','时间到，平局','#aaa');
  if(!G.towers.some(t=>t.name=='AKing'&&t.alive))end('🎉 胜利！','对方知识殿堂被摧毁！','#ffd700');
  if(!G.towers.some(t=>t.name=='PKing'&&t.alive))end('💀 败北…','我方知识殿堂被摧毁…','#f87171');
  if(G.gameTime<0&&G.gameTime>-0.1)notify('⏰ 加时赛！先推塔方获胜');
}

function end(t,s,c){
  G.over=true;
  const r=document.getElementById('result');r.classList.add('show');
  document.getElementById('result-title').textContent=t;
  document.getElementById('result-title').style.color=c;
  document.getElementById('result-sub').textContent=s;
  const stars=Math.max(1,3-G.aScore);
  document.getElementById('result-stars').textContent='👑'.repeat(stars)+'☆'.repeat(3-stars);
}
let nt;
function notify(t){
  const n=document.getElementById('notif');n.textContent=t;n.classList.add('show');
  clearTimeout(nt);nt=setTimeout(()=>n.classList.remove('show'),2500);
}

function render(){
  drawField();
  for(const t of G.towers)t.draw();
  for(const u of G.units)u.draw();
}

// ====== 卡牌 UI ======
function renderCards(){
  const a=document.getElementById('cards');a.innerHTML='';
  const cd=document.getElementById('hud-elixir-fill');
  cd.style.width=(G.pMana/10*100)+'%';
  cd.className=''+(G.isDouble?'double':'');
  document.getElementById('hud-elixir-text').textContent=Math.floor(G.pMana)+'/10';
  const t=G.gameTime>0?G.gameTime:0;
  document.getElementById('hud-timer-text').textContent=Math.floor(t/60)+':'+(t%60<10?'0':'')+Math.floor(t%60);
  document.getElementById('hud-double').style.display=G.isDouble?'inline-block':'none';
  for(let i=0;i<4;i++){
    if(!G.hand[i])continue;
    const c=G.hand[i];
    const d=document.createElement('div');
    d.className='card'+(G.pMana<c.cost?' disabled':'')+(G.selected===i?' selected':'');
    d.dataset.idx=i;
    const bg=document.createElement('div');bg.className='card-bg';
    bg.style.background=`linear-gradient(145deg,${c.color}88,${c.color}33)`;
    d.appendChild(bg);
    const ic=document.createElement('div');ic.className='card-icon';ic.textContent=c.icon;
    d.appendChild(ic);
    const cc=document.createElement('div');cc.className='card-cost '+(G.pMana>=c.cost?'can':'no');
    cc.textContent=c.cost;d.appendChild(cc);
    const tt=document.createElement('div');tt.className='card-type';
    tt.textContent=c.type;tt.style.background=c.tank?'rgba(59,130,246,0.3)':'rgba(250,200,100,0.2)';
    d.appendChild(tt);
    const nm=document.createElement('div');nm.className='card-name';nm.textContent=c.name;
    d.appendChild(nm);
    // Drag events
    let startX,startY;
    d.addEventListener('pointerdown',e=>{
      if(G.over||G.pMana<c.cost)return;
      startX=e.clientX;startY=e.clientY;
      d.setPointerCapture(e.pointerId);
    });
    d.addEventListener('pointermove',e=>{
      if(!d.hasPointerCapture(e.pointerId))return;
      const dy=startY-e.clientY;
      if(dy>20){
        G.selected=i;G.dragging=true;
        d.classList.add('dragging');
        document.getElementById('deploy-line').style.display='block';
        document.getElementById('hint').classList.add('show');
        document.getElementById('hint').textContent='拖到左半场部署';
        renderCards(); // re-render to show selection
      }
    });
    d.addEventListener('pointerup',e=>{
      if(!G.dragging||G.selected<0)return;
      d.classList.remove('dragging');
      document.getElementById('deploy-line').style.display='none';
      document.getElementById('hint').classList.remove('show');
      const r=C.getBoundingClientRect();
      const w=toW(e.clientX-r.left,e.clientY-r.top);
      if(w.x<=0&&w.x>=-8.5){
        const card=G.hand[G.selected];
        spawn(Math.max(-8.5,Math.min(w.x,-0.5)),Math.max(-5.5,Math.min(w.y,5.5)),card,0);
        G.pMana-=card.cost;
        G.hand[G.selected]=G.deck[G.deckIdx%G.deck.length];G.deckIdx++;
        G.selected=-1;G.dragging=false;
        renderCards();
      }else{
        G.selected=-1;G.dragging=false;
        renderCards();
      }
    });
    a.appendChild(d);
  }
  const h=document.getElementById('hint');
  if(!G.dragging&&G.selected>=0){h.textContent='👆 点击左半场部署 '+(G.hand[G.selected]?.name||'');h.classList.add('show');}
  else if(!G.dragging)h.classList.remove('show');
}

// ====== 战场点击部署（备选方案） ======
document.getElementById('battlefield').addEventListener('click',e=>{
  if(G.dragging||G.selected<0)return;
  const r=C.getBoundingClientRect();
  const w=toW(e.clientX-r.left,e.clientY-r.top);
  if(w.x>0||w.x<-8.5)return;
  const c=G.hand[G.selected];
  spawn(Math.max(-8.5,Math.min(w.x,-0.5)),Math.max(-5.5,Math.min(w.y,5.5)),c,0);
  G.pMana-=c.cost;
  G.hand[G.selected]=G.deck[G.deckIdx%G.deck.length];G.deckIdx++;
  G.selected=-1;
  renderCards();
});

// ====== 循环 ======
let lt=0;
function loop(t){
  if(!lt)lt=t;
  const dt=Math.min((t-lt)/1000,0.05);lt=t;
  update(dt);render();renderCards();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
