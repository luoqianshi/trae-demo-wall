<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>京日天气 — 气象沙盒（Demo）</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e1a;
  --ink: #e0e8ff;
  --panel: rgba(8,15,35,0.82);
  --panel-strong: rgba(8,15,35,0.92);
  --border: rgba(100,180,255,0.2);
  --border-strong: rgba(100,180,255,0.5);
  --accent: rgba(255,215,60,0.9);
  --blue: rgba(100,180,255,0.5);
}

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  height: 100vh; height: 100dvh;
  width: 100vw;
}

#map { position: fixed; inset: 0; z-index: 0; }

#wind-canvas, #particle-canvas {
  position: fixed; inset: 0; pointer-events: none;
}
#wind-canvas { z-index: 9; opacity: 0.55; }
#particle-canvas { z-index: 10; opacity: 0.7; }

/* === App Title === */
#app-title {
  position: fixed; top: 18px; left: 18px; z-index: 100;
  display: flex; flex-direction: column; gap: 4px; line-height: 1;
}
.title-main {
  font-size: 24px; font-weight: 700; letter-spacing: 4px; color: #fff;
  text-shadow: 0 0 20px rgba(100,200,255,0.8), 0 0 40px rgba(100,200,255,0.4);
}
.title-sub {
  font-size: 11px; letter-spacing: 3px; color: rgba(150,200,255,0.6); text-transform: uppercase;
}
.title-badge {
  margin-top: 6px; font-size: 10px; letter-spacing: 1px;
  color: rgba(255,215,60,0.85); border: 1px solid rgba(255,215,60,0.3);
  background: rgba(255,215,60,0.06); border-radius: 4px; padding: 2px 6px; width: fit-content;
}

/* === Layer Panel === */
#layer-panel {
  position: fixed; top: 18px; right: 18px; z-index: 100;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; backdrop-filter: blur(12px); min-width: 148px;
}
.panel-title {
  font-size: 11px; letter-spacing: 2.5px; color: rgba(150,200,255,0.55);
  text-transform: uppercase; margin-bottom: 10px;
}
.layer-btn-group { display: flex; flex-direction: column; gap: 5px; }
.layer-btn {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border: 1px solid rgba(100,180,255,0.12); border-radius: 7px;
  background: rgba(255,255,255,0.03); color: rgba(200,220,255,0.45);
  font-size: 14px; cursor: pointer; transition: all 0.18s ease;
  letter-spacing: 0.3px; text-align: left; width: 100%;
}
.layer-btn:hover { background: rgba(100,180,255,0.1); color: rgba(200,220,255,0.85); border-color: rgba(100,180,255,0.3); }
.layer-btn.active {
  background: rgba(100,180,255,0.16); color: #fff;
  border-color: var(--border-strong); box-shadow: 0 0 10px rgba(100,180,255,0.12);
}
.layer-btn .icon { font-size: 15px; }

/* === Briefing Card === */
#briefing-card {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 180;
  width: min(780px, calc(100vw - 390px)); min-width: 460px; padding: 16px 20px;
  border-radius: 18px;
  background:
    linear-gradient(135deg, rgba(9,18,36,0.9), rgba(15,30,55,0.72)),
    radial-gradient(circle at 12% 0%, rgba(255,210,100,0.16), transparent 32%);
  border: 1px solid rgba(140,205,255,0.28);
  box-shadow: 0 12px 42px rgba(0,0,0,0.38), 0 0 34px rgba(100,180,255,0.12);
  backdrop-filter: blur(18px); pointer-events: none;
}
.brief-main {
  font-size: 24px; line-height: 1.25; font-weight: 750; color: #fff;
  letter-spacing: 0.2px; text-shadow: 0 0 18px rgba(120,200,255,0.22);
}
.brief-sub { margin-top: 6px; font-size: 17px; line-height: 1.35; color: rgba(220,235,255,0.88); }
.brief-trust { margin-top: 6px; font-size: 15px; line-height: 1.35; color: rgba(255,225,160,0.86); }

/* === Legend Panel === */
#legend-panel {
  position: fixed; left: 18px; top: 92px; z-index: 100; width: 320px;
  max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 15px; backdrop-filter: blur(12px);
}
.legend-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.legend-title { font-size: 13px; font-weight: 650; color: rgba(220,235,255,0.94); letter-spacing: 0.3px; }
#legend-toggle {
  background: none; border: 1px solid var(--border); color: rgba(180,210,255,0.7);
  width: 22px; height: 22px; border-radius: 5px; cursor: pointer; font-size: 14px; line-height: 1;
}
#legend-toggle:hover { color: #fff; border-color: var(--border-strong); }
.legend-status { font-size: 12px; color: rgba(180,210,255,0.82); margin-bottom: 8px; }
.legend-data-status { margin-bottom: 8px; }
.ds-row { font-size: 11px; line-height: 1.5; color: rgba(170,200,240,0.78); }
.ds-row.ds-off { color: rgba(140,160,190,0.5); }
.legend-item { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(100,180,255,0.1); }
.legend-item-title { font-size: 12px; font-weight: 600; color: rgba(220,235,255,0.9); display: flex; align-items: center; gap: 6px; }
.legend-bar { height: 8px; border-radius: 4px; margin: 6px 0 3px; }
.legend-scale { display: flex; justify-content: space-between; font-size: 9px; color: rgba(160,190,230,0.6); }
.legend-note { font-size: 11px; line-height: 1.45; color: rgba(160,190,230,0.62); margin-top: 4px; }
.legend-empty { font-size: 12px; color: rgba(160,190,230,0.5); }
#legend-panel.collapsed #legend-status,
#legend-panel.collapsed #legend-data-status,
#legend-panel.collapsed #legend-body { display: none; }
#legend-panel.collapsed { width: auto; }
#legend-panel.collapsed .legend-head { margin-bottom: 0; }

/* === City Popup === */
#city-popup {
  position: fixed; top: 50%; left: 18px; transform: translateY(-50%); z-index: 200;
  background: var(--panel-strong); border: 1px solid rgba(100,180,255,0.28); border-radius: 14px;
  padding: 16px; width: 300px; backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 60px rgba(100,180,255,0.07);
  visibility: visible; transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear;
}
#city-popup.hidden {
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(-50%) translateX(-16px);
  transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0.22s;
}
.popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.popup-header span { font-size: 18px; font-weight: 600; color: #fff; }
#popup-close {
  background: none; border: none; color: rgba(200,220,255,0.45); font-size: 15px;
  cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.15s;
}
#popup-close:hover { color: #fff; }
.popup-current { margin-bottom: 14px; }
.current-temp { font-size: 44px; font-weight: 300; color: #fff; line-height: 1; margin-bottom: 4px; }
.current-desc { font-size: 14px; color: rgba(150,200,255,0.8); margin-bottom: 10px; }
.current-meta { display: flex; gap: 14px; font-size: 12px; color: rgba(180,210,255,0.6); flex-wrap: wrap; }
.forecast-heading { margin-bottom: 3px; font-size: 12px; font-weight: 650; letter-spacing: 0.3px; color: rgba(235,244,255,0.94); }
.forecast-source { margin-bottom: 8px; font-size: 10px; line-height: 1.4; color: rgba(155,190,230,0.68); }
.forecast-chart-wrap { position: relative; width: 268px; height: 110px; overflow: hidden; }
#forecast-chart { display: block; width: 100% !important; height: 100% !important; }

/* === Timeline === */
#timeline-panel {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
  display: flex; align-items: center; gap: 12px; background: rgba(8,15,35,0.82);
  border: 1px solid var(--border); border-radius: 40px; padding: 10px 18px;
  backdrop-filter: blur(12px); min-width: 580px; max-width: 88vw;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
.tl-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tl-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(100,180,255,0.4);
  background: rgba(100,180,255,0.14); color: #fff; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.18s; flex-shrink: 0;
}
.tl-btn:hover { background: rgba(100,180,255,0.28); box-shadow: 0 0 12px rgba(100,180,255,0.25); }
.tl-label { font-size: 10px; letter-spacing: 1px; color: rgba(150,200,255,0.65); min-width: 56px; white-space: nowrap; }
.tl-track {
  position: relative; flex: 1; height: 26px; display: flex; cursor: pointer;
  border-radius: 13px; overflow: hidden; user-select: none;
}
.tl-segment { height: 100%; display: flex; align-items: center; justify-content: center; }
.tl-past { flex: 3; background: rgba(60,120,200,0.22); }
.tl-future { flex: 8; background: rgba(30,70,140,0.18); }
.tl-seg-label { font-size: 9px; letter-spacing: 1px; color: rgba(150,200,255,0.45); pointer-events: none; text-transform: uppercase; }
.tl-now-marker {
  position: relative; z-index: 2; flex-shrink: 0; width: 2px; background: var(--accent);
  box-shadow: 0 0 6px rgba(255,215,60,0.55); display: flex; align-items: flex-start; justify-content: center; overflow: visible;
}
.tl-now-marker span { position: absolute; top: -15px; font-size: 8px; letter-spacing: 1px; color: var(--accent); white-space: nowrap; pointer-events: none; }
.tl-cursor { position: absolute; top: 0; width: 3px; height: 100%; background: rgba(255,255,255,0.88); border-radius: 2px; box-shadow: 0 0 7px rgba(255,255,255,0.45); pointer-events: none; z-index: 3; transition: left 0.08s ease; }

/* === Zoom Control === */
#zoom-control {
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 100;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 6px;
  backdrop-filter: blur(12px);
}
.zoom-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(100,180,255,0.25);
  background: rgba(100,180,255,0.1); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.18s;
}
.zoom-btn:hover:not(:disabled) { background: rgba(100,180,255,0.24); box-shadow: 0 0 12px rgba(100,180,255,0.25); }
.zoom-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.zoom-label { font-size: 11px; letter-spacing: 1.5px; color: rgba(180,210,255,0.85); padding: 4px 0; text-align: center; min-width: 40px; white-space: nowrap; }

/* === Layer Notice === */
#layer-notice {
  position: fixed; top: 110px; left: 50%; transform: translateX(-50%); z-index: 190;
  background: rgba(8,15,35,0.9); border: 1px solid rgba(255,180,80,0.4); border-radius: 8px;
  padding: 8px 14px; font-size: 12px; color: rgba(255,225,180,0.9); backdrop-filter: blur(10px);
  box-shadow: 0 4px 18px rgba(0,0,0,0.4); transition: opacity 0.3s;
}

/* === City Markers === */
.city-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(100,200,255,0.85); border: 1.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 0 8px rgba(100,200,255,0.7); display: block;
  transition: transform 0.15s, background 0.4s, box-shadow 0.4s;
}
.city-marker:hover .city-dot { transform: scale(1.6); background: rgba(255,220,80,0.9) !important; box-shadow: 0 0 14px rgba(255,220,80,0.7) !important; }
.city-label {
  font-size: 11px; color: rgba(220,235,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.85);
  pointer-events: none; white-space: nowrap; letter-spacing: 1px;
  font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
}
.focus-marker span {
  display: block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--accent); box-shadow: 0 0 12px rgba(255,215,60,0.7);
  animation: pulse 1.8s ease-out infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,215,60,0.5); }
  70% { box-shadow: 0 0 0 14px rgba(255,215,60,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,215,60,0); }
}

.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right,
.maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }

button:focus-visible, .tl-track:focus-visible { outline: 2px solid rgba(150,215,255,0.95); outline-offset: 2px; }

/* === Loading overlay === */
#boot-overlay {
  position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(circle at 50% 40%, #0e1830, #060912);
  transition: opacity 0.5s ease; color: rgba(180,210,255,0.7);
}
#boot-overlay.hide { opacity: 0; pointer-events: none; }
.boot-title { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: #fff; text-shadow: 0 0 24px rgba(100,200,255,0.7); }
.boot-sub { font-size: 12px; letter-spacing: 3px; color: rgba(150,200,255,0.55); text-transform: uppercase; }
.boot-bar { width: 220px; height: 3px; border-radius: 2px; background: rgba(100,180,255,0.15); overflow: hidden; margin-top: 10px; }
.boot-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, rgba(120,200,255,0.9), transparent); animation: bar 1.2s infinite; }
@keyframes bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
</style>
</head>
<body>
  <div id="map"></div>
  <canvas id="wind-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>

  <div id="boot-overlay">
    <div class="boot-title">京日天气</div>
    <div class="boot-sub">气象沙盒 · 加载中</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <div id="app-title">
    <span class="title-main">京日天气</span>
    <span class="title-sub">气象沙盒</span>
    <span class="title-badge">Demo · 真实数据</span>
  </div>

  <div id="layer-panel">
    <div class="panel-title">图层</div>
    <div class="layer-btn-group">
      <button type="button" class="layer-btn active" data-layer="radar"><span class="icon">📡</span><span>雷达</span></button>
      <button type="button" class="layer-btn active" data-layer="cloud"><span class="icon">☁</span><span>云图</span></button>
      <button type="button" class="layer-btn" data-layer="temperature"><span class="icon">🌡</span><span>温度</span></button>
      <button type="button" class="layer-btn active" data-layer="wind"><span class="icon">💨</span><span>风场</span></button>
      <button type="button" class="layer-btn active" data-layer="particles"><span class="icon">🌧</span><span>粒子</span></button>
    </div>
  </div>

  <div id="briefing-card" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="layer-notice" role="status" aria-live="polite" hidden></div>

  <div id="legend-panel" role="region" aria-labelledby="legend-title">
    <div class="legend-head">
      <span id="legend-title" class="legend-title">图层说明 · 怎么看</span>
      <button type="button" id="legend-toggle" title="收起图层说明" aria-expanded="true">−</button>
    </div>
    <div id="legend-status" class="legend-status" data-mode="now">🔵 实况 — 当前观测</div>
    <div id="legend-data-status" class="legend-data-status"></div>
    <div id="legend-body"></div>
  </div>

  <div id="zoom-control">
    <button type="button" id="zoom-in" class="zoom-btn" title="放大一级" aria-label="放大一级">＋</button>
    <div id="zoom-label" class="zoom-label">区县</div>
    <button type="button" id="zoom-out" class="zoom-btn" title="缩小一级" aria-label="缩小一级">−</button>
  </div>

  <div id="city-popup" class="hidden" role="dialog" aria-labelledby="popup-city-name" aria-hidden="true" inert>
    <div class="popup-header">
      <span id="popup-city-name"></span>
      <button type="button" id="popup-close" title="关闭城市天气" aria-label="关闭城市天气">✕</button>
    </div>
    <div class="popup-current">
      <div class="current-temp"><span id="popup-temp">--</span>°C</div>
      <div class="current-desc" id="popup-desc">--</div>
      <div class="current-meta">
        <span>💧 <span id="popup-humidity">--</span>%</span>
        <span>💨 <span id="popup-wind">--</span> m/s</span>
        <span>🌧 <span id="popup-precip">--</span> mm</span>
      </div>
    </div>
    <div class="forecast-heading">未来24小时 · Open-Meteo逐时预报</div>
    <div class="forecast-source" id="forecast-source">共 25 个逐时点（当前至 +24h）· 模型预报，仅供趋势参考</div>
    <div class="forecast-chart-wrap"><canvas id="forecast-chart" width="268" height="110"></canvas></div>
  </div>

  <div id="timeline-panel" role="region" aria-label="天气时间轴">
    <div class="tl-controls">
      <button type="button" id="tl-play-btn" class="tl-btn" title="播放时间轴" aria-label="播放时间轴" aria-pressed="false">▶</button>
      <span id="tl-time-label" class="tl-label">实况</span>
    </div>
    <div id="tl-track" class="tl-track" role="slider" tabindex="0" aria-label="天气时间" aria-valuemin="-180" aria-valuemax="1440" aria-valuenow="0" aria-valuetext="实况">
      <div class="tl-segment tl-past"><span class="tl-seg-label">过去 3h</span></div>
      <div class="tl-now-marker"><span>NOW</span></div>
      <div class="tl-segment tl-future"><span class="tl-seg-label">预报 +24h</span></div>
      <div id="tl-cursor" class="tl-cursor"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js"></script>
  <script>
  // ====================================================================
  // 京日天气 — 气象沙盒（单文件 Demo）
  // 数据源：Open-Meteo（城市天气/预报/局地网格）· RainViewer（雷达）
  //         NASA GIBS Himawari（红外云图）· CARTO（深色底图）
  // ====================================================================

  const CITIES = [
    { name: '北京', lat: 39.9042, lon: 116.4074 },
    { name: '上海', lat: 31.2304, lon: 121.4737 },
    { name: '广州', lat: 23.1291, lon: 113.2644 },
    { name: '深圳', lat: 22.5431, lon: 114.0579 },
    { name: '成都', lat: 30.5728, lon: 104.0668 },
    { name: '武汉', lat: 30.5928, lon: 114.3055 },
    { name: '杭州', lat: 30.2741, lon: 120.1551 },
    { name: '西安', lat: 34.3416, lon: 108.9398 },
    { name: '重庆', lat: 29.4316, lon: 106.9123 },
    { name: '南京', lat: 32.0603, lon: 118.7969 },
    { name: '沈阳', lat: 41.8057, lon: 123.4315 },
    { name: '哈尔滨', lat: 45.8038, lon: 126.5349 },
    { name: '乌鲁木齐', lat: 43.8256, lon: 87.6168 },
    { name: '拉萨', lat: 29.6525, lon: 91.1322 },
    { name: '海口', lat: 20.0440, lon: 110.1999 },
  ];
  const DEFAULT_FOCUS = { name: '北京·海淀', lat: 39.9593, lon: 116.2981 };
  const OPEN_METEO = 'https://api.open-meteo.com/v1/forecast';
  const RAINVIEWER = 'https://api.rainviewer.com/public/weather-maps.json';
  const PAST_HOURS = 3, FUTURE_HOURS = 24;
  const ZOOM_LEVELS = [
    { zoom: 4, label: '全国' }, { zoom: 6, label: '区域' },
    { zoom: 8, label: '城市' }, { zoom: 10, label: '区县' }, { zoom: 12, label: '街区' },
  ];
  const INITIAL_ZOOM_INDEX = 3;

  const WEATHER_CODES = {
    0:{d:'晴天',t:'clear'},1:{d:'大部晴朗',t:'clear'},2:{d:'局部多云',t:'cloudy'},3:{d:'阴天',t:'cloudy'},
    45:{d:'雾',t:'fog'},48:{d:'冻雾',t:'fog'},
    51:{d:'小毛毛雨',t:'rain'},53:{d:'中毛毛雨',t:'rain'},55:{d:'大毛毛雨',t:'rain'},
    61:{d:'小雨',t:'rain'},63:{d:'中雨',t:'rain'},65:{d:'大雨',t:'rain'},
    71:{d:'小雪',t:'snow'},73:{d:'中雪',t:'snow'},75:{d:'大雪',t:'snow'},77:{d:'冰晶',t:'snow'},
    80:{d:'小阵雨',t:'rain'},81:{d:'中阵雨',t:'rain'},82:{d:'强阵雨',t:'rain'},
    85:{d:'小阵雪',t:'snow'},86:{d:'大阵雪',t:'snow'},
    95:{d:'雷暴',t:'storm'},96:{d:'冰雹雷暴',t:'hail'},99:{d:'大冰雹雷暴',t:'hail'},
  };

  const LEGEND_META = {
    radar: { icon:'📡', title:'雷达 · 降水强度',
      bar:'linear-gradient(to right, #2a7fff, #2ad8a8, #f5e642, #ff7a1a, #e83a3a, #c44bff)',
      scale:['小雨','中雨','大雨','暴雨'], note:'颜色越偏红紫，降水越强；显示 RainViewer 真实雷达拼图。' },
    cloud: { icon:'☁', title:'云图 · 红外云顶',
      bar:'linear-gradient(to right, #0b1020, #3a4358, #b9c4d8, #ffffff)',
      scale:['晴空','中低云','高云/冷顶'], note:'Himawari-8 红外波段，亮白处为高冷云顶，可识别强对流趋势。' },
    temperature: { icon:'🌡', title:'温度 · 区级采样',
      bar:'linear-gradient(to right, #0050ff, #4090ff, #40d0a0, #80e040, #ffaa20, #ff3010)',
      scale:['-10°','0°','10°','20°','30°+'], note:'焦点城市周围采样生成，蓝冷红热；圆点越大越偏极端。' },
    wind: { icon:'💨', title:'风场 · 流线方向风速',
      bar:'linear-gradient(to right, #6ec8ff, #a0d8ff, #ffd8a0, #ff9050)',
      scale:['微风','4级','6级','8级'], note:'流线方向表示风向，越亮越快；为演示性流场。' },
    particles: { icon:'🌧', title:'粒子 · 降水演示',
      bar:null, scale:[], note:'点击城市标记后，按当地天气演示雨/雪/雷暴动画。' },
  };

  // ---------- State ----------
  const state = {
    activeLayers: new Set(['radar','cloud','wind','particles']),
    radarFrames: [], hasNowcast: false,
    cityWeather: new Map(),
    focusCity: null, focusMarker: null,
    localPoints: [], localStatus: 'idle',
    timelineOffset: 0, playing: false, playTimer: null,
    chart: null, map: null, popupForecast: [],
    popupCity: null,
  };

  // ---------- Utility ----------
  function tempToColor(t) {
    const stops = [
      [-10,'#0050ff'],[0,'#4090ff'],[10,'#40d0a0'],[20,'#80e040'],[30,'#ffaa20'],[40,'#ff3010']
    ];
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const r = (t - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
        return mixHex(stops[i-1][1], stops[i][1], r);
      }
    }
    return stops[stops.length-1][1];
  }
  function mixHex(a, b, r) {
    const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
    const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
    const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
    const R=Math.round(ar+(br-ar)*r), G=Math.round(ag+(bg-ag)*r), B=Math.round(ab+(bb-ab)*r);
    return `#${((R<<16)|(G<<8)|B).toString(16).padStart(6,'0')}`;
  }
  function formatDuration(m) {
    const total = Math.max(0, Math.round(m));
    const h = Math.floor(total/60), mm = total%60;
    if (!h) return `${mm}分钟`;
    return mm ? `${h}小时${mm}分钟` : `${h}小时`;
  }
  function directionFrom(center, p) {
    const ns = p.lat > center.lat + 0.03 ? '北' : p.lat < center.lat - 0.03 ? '南' : '';
    const ew = p.lon > center.lon + 0.03 ? '东' : p.lon < center.lon - 0.03 ? '西' : '';
    return ns || ew ? `${ns}${ew}` : '附近';
  }
  function showNotice(text, ms = 2200) {
    const el = document.getElementById('layer-notice');
    el.textContent = text; el.hidden = false; el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = '0'; setTimeout(()=>{el.hidden=true}, 300); }, ms);
  }
  async function fetchWithTimeout(url, ms = 9000) {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
    try { return await fetch(url, { signal: c.signal, cache: 'no-store' }); }
    finally { clearTimeout(t); }
  }

  // ---------- Weather API (Open-Meteo) ----------
  async function fetchCityWeather(lat, lon) {
    const params = new URLSearchParams({
      latitude: lat, longitude: lon,
      current: ['temperature_2m','relative_humidity_2m','wind_speed_10m','precipitation','weather_code','cloud_cover'].join(','),
      hourly: ['temperature_2m','precipitation_probability','precipitation','weather_code','cloud_cover'].join(','),
      forecast_days: 2, timezone: 'Asia/Shanghai',
    });
    const res = await fetchWithTimeout(`${OPEN_METEO}?${params}`);
    if (!res.ok) throw new Error('Weather API ' + res.status);
    return parseWeather(await res.json());
  }
  async function fetchWeatherPoints(points) {
    const params = new URLSearchParams({
      latitude: points.map(p=>p.lat).join(','),
      longitude: points.map(p=>p.lon).join(','),
      current: ['temperature_2m','relative_humidity_2m','wind_speed_10m','precipitation','weather_code','cloud_cover'].join(','),
      forecast_days: 1, timezone: 'Asia/Shanghai',
    });
    const res = await fetchWithTimeout(`${OPEN_METEO}?${params}`, 12000);
    if (!res.ok) throw new Error('Weather API ' + res.status);
    const raw = await res.json();
    const rows = Array.isArray(raw) ? raw : [raw];
    return rows.map(r => parseCurrent(r));
  }
  function parseCurrent(raw) {
    const cur = raw.current;
    const info = WEATHER_CODES[cur.weather_code] || { d:'未知', t:'clear' };
    return {
      current: { temp: Math.round(cur.temperature_2m), tempRaw: cur.temperature_2m,
        humidity: cur.relative_humidity_2m, wind: Math.round(cur.wind_speed_10m*10)/10,
        precip: cur.precipitation, code: cur.weather_code, desc: info.d, type: info.t, cloud: cur.cloud_cover },
      forecast: [],
    };
  }
  function parseWeather(raw) {
    const cur = raw.current;
    const info = WEATHER_CODES[cur.weather_code] || { d:'未知', t:'clear' };
    const now = new Date(cur.time);
    const h = raw.hourly;
    const idx = h.time.findIndex(t => new Date(t) >= now);
    const start = Math.max(0, idx);
    const forecast = h.time.slice(start, start + 25).map((t,i) => ({
      time: t, temp: h.temperature_2m[start+i], precipProb: h.precipitation_probability[start+i],
      precip: h.precipitation[start+i], code: h.weather_code[start+i], cloud: h.cloud_cover[start+i],
    }));
    return {
      current: { temp: Math.round(cur.temperature_2m), tempRaw: cur.temperature_2m,
        humidity: cur.relative_humidity_2m, wind: Math.round(cur.wind_speed_10m*10)/10,
        precip: cur.precipitation, code: cur.weather_code, desc: info.d, type: info.t, cloud: cur.cloud_cover },
      forecast,
    };
  }

  // ---------- RainViewer 雷达 ----------
  async function loadRadar() {
    let data;
    try { data = await (await fetchWithTimeout(RAINVIEWER, 12000)).json(); }
    catch (e) { console.warn('RainViewer unavailable', e); renderDataStatus(); return; }
    const past = data.radar?.past || [];
    const nowcast = data.radar?.nowcast || [];
    state.radarFrames = [...past, ...nowcast].sort((a,b) => a.time - b.time);
    state.hasNowcast = nowcast.length > 0;
    if (state.radarFrames.length) {
      addRadarLayer(closestRadarFrame(state.timelineOffset));
    }
    renderDataStatus(); renderLegend();
  }
  function closestRadarFrame(offsetMinutes) {
    if (!state.radarFrames.length) return null;
    const target = Date.now()/1000 + offsetMinutes*60;
    return state.radarFrames.reduce((best, f) =>
      Math.abs(f.time - target) < Math.abs(best.time - target) ? f : best);
  }
  function radarTileUrl(path) {
    return `https://tilecache.rainviewer.com${path}/256/{z}/{x}/{y}/2/1_1.png`;
  }
  function addRadarLayer(frame) {
    if (!frame || !state.map) return;
    const url = radarTileUrl(frame.path);
    if (state.map.getSource('radar')) {
      state.map.getSource('radar').setTiles([url]);
    } else {
      state.map.addSource('radar', { type:'raster', tiles:[url], tileSize:256, maxzoom: 12 });
      state.map.addLayer({ id:'radar-layer', type:'raster', source:'radar',
        paint: { 'raster-opacity': 0.6, 'raster-fade-duration': 120, 'raster-resampling':'linear' },
        layout: { visibility: layerVisible('radar') } });
    }
    setRadarOpacity();
  }
  function setRadarOpacity() {
    if (!state.map.getLayer('radar-layer')) return;
    const z = state.map.getZoom();
    const op = z <= 6 ? 0.5 : 0.42;
    state.map.setPaintProperty('radar-layer', 'raster-opacity', op);
  }
  function setRadarFrame(offsetMinutes) {
    const frame = closestRadarFrame(offsetMinutes);
    if (frame && state.map.getSource('radar')) {
      state.map.getSource('radar').setTiles([radarTileUrl(frame.path)]);
    }
  }

  // ---------- GIBS 云图 ----------
  function gibsTime() {
    const d = new Date(Date.now() - 3*3600*1000);
    d.setUTCMinutes(Math.floor(d.getUTCMinutes()/10)*10, 0, 0);
    return d.toISOString().replace(/\.\d+Z$/, 'Z');
  }
  function loadCloud() {
    if (!state.map) return;
    const time = gibsTime();
    const url = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/Himawari_AHI_Band13_Clean_Infrared/default/${time}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png`;
    if (state.map.getSource('cloud')) return;
    state.map.addSource('cloud', { type:'raster', tiles:[url], tileSize:256, maxzoom:6 });
    state.map.addLayer({ id:'cloud-layer', type:'raster', source:'cloud',
      paint: { 'raster-opacity': 0.5, 'raster-contrast': 0.28, 'raster-saturation': -0.12, 'raster-resampling':'linear' },
      layout: { visibility: layerVisible('cloud') } });
  }

  // ---------- Layer visibility ----------
  function layerVisible(id) {
    if (id === 'radar' || id === 'cloud') {
      // 未来时段不显示观测云图；雷达只在未来有 nowcast 帧时显示
      if (id === 'cloud' && state.timelineOffset > 0) return 'none';
      return state.activeLayers.has(id) ? 'visible' : 'none';
    }
    return state.activeLayers.has(id) ? 'visible' : 'none';
  }
  function syncLayerVisibility() {
    if (!state.map) return;
    if (state.map.getLayer('radar-layer')) state.map.setLayoutProperty('radar-layer','visibility', layerVisible('radar'));
    if (state.map.getLayer('cloud-layer')) state.map.setLayoutProperty('cloud-layer','visibility', layerVisible('cloud'));
    if (state.map.getLayer('temp-layer')) state.map.setLayoutProperty('temp-layer','visibility', layerVisible('temperature'));
  }

  // ---------- Temperature layer (区级采样圆点) ----------
  function addTemperatureLayer() {
    if (!state.map) return;
    const features = state.localPoints
      .filter(p => Number.isFinite(p.temp))
      .map(p => ({ type:'Feature', geometry:{ type:'Point', coordinates:[p.lon,p.lat] },
        properties:{ temp: p.temp, color: tempToColor(p.temp) } }));
    const data = { type:'FeatureCollection', features };
    if (state.map.getSource('temp')) { state.map.getSource('temp').setData(data); return; }
    state.map.addSource('temp', { type:'geojson', data });
    state.map.addLayer({ id:'temp-layer', type:'circle', source:'temp',
      paint: {
        'circle-radius': ['interpolate',['linear'],['zoom'],6,6,10,14,12,22],
        'circle-color': ['get','color'],
        'circle-opacity': 0.32,
        'circle-stroke-width': 1,
        'circle-stroke-color': ['get','color'],
        'circle-stroke-opacity': 0.7,
        'circle-blur': 0.4,
      },
      layout: { visibility: layerVisible('temperature') }
    });
  }

  // ---------- Map ----------
  function createMap() {
    return new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          // 高德深色作为兜底底图（国内稳定可访问）
          'gaode-dark': { type:'raster',
            tiles: [
              'https://wprd01.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8',
              'https://wprd02.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8',
              'https://wprd03.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8',
              'https://wprd04.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8',
            ],
            tileSize: 256,
          },
          // CARTO dark 作为首选底图（WGS84，与雷达/云图精准对齐），加载失败时透明、高德透出
          'carto-dark': { type:'raster',
            tiles: [
              'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
            ],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap &copy; CARTO',
          },
        },
        layers: [
          { id:'gaode-dark-layer', type:'raster', source:'gaode-dark', minzoom:0, maxzoom:20 },
          { id:'carto-dark-layer', type:'raster', source:'carto-dark', minzoom:0, maxzoom:20 },
        ],
      },
      center: [DEFAULT_FOCUS.lon, DEFAULT_FOCUS.lat],
      zoom: ZOOM_LEVELS[INITIAL_ZOOM_INDEX].zoom,
      minZoom: ZOOM_LEVELS[0].zoom, maxZoom: ZOOM_LEVELS[ZOOM_LEVELS.length-1].zoom,
      attributionControl: false, renderWorldCopies: false, antialias: false,
      fadeDuration: 300, maxTileCacheSize: 128,
      scrollZoom: false, doubleClickZoom: false, touchZoomRotate: false,
      dragRotate: false, keyboard: false,
    });
  }
  function addCityMarkers() {
    CITIES.forEach(city => {
      const el = document.createElement('div');
      el.className = 'city-marker';
      el.style.cssText = 'position:absolute;cursor:pointer;pointer-events:all;display:flex;flex-direction:column;align-items:center;gap:3px;';
      el.innerHTML = `<span class="city-dot"></span><span class="city-label">${city.name}</span>`;
      new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([city.lon, city.lat]).addTo(state.map);
      el.addEventListener('click', () => openCityPopup(city));
    });
  }
  function updateMarkerColor(name, w) {
    const el = document.querySelector(`.city-marker[data-city="${name}"]`) ||
      [...document.querySelectorAll('.city-marker')].find(m => m.querySelector('.city-label').textContent === name);
    if (!el) return;
    const dot = el.querySelector('.city-dot');
    const color = tempToColor(w.current.temp);
    dot.style.background = color; dot.style.boxShadow = `0 0 8px ${color}`;
    el.title = `${name}  ${w.current.temp}°C  ${w.current.desc}`;
  }
  function setFocusMarker(city) {
    if (!state.focusMarker) {
      const el = document.createElement('div'); el.className = 'focus-marker'; el.innerHTML = '<span></span>';
      state.focusMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([city.lon, city.lat]).addTo(state.map);
    } else state.focusMarker.setLngLat([city.lon, city.lat]);
  }
  function focusCity(city) {
    if (!city || !Number.isFinite(city.lat)) return;
    state.focusCity = city; state.localPoints = []; state.localStatus = 'loading';
    setFocusMarker(city);
    state.map.easeTo({ center:[city.lon, city.lat], zoom: ZOOM_LEVELS[INITIAL_ZOOM_INDEX].zoom, duration: 600 });
    zoomIndex = INITIAL_ZOOM_INDEX; updateZoomUI();
    renderDataStatus();
    fetchLocalWeather(city);
  }
  async function fetchLocalWeather(center) {
    const points = buildSamplePoints(center);
    try {
      const rows = await fetchWeatherPoints(points);
      const samples = rows.map((w,i) => w ? {
        lat: points[i].lat, lon: points[i].lon,
        temp: w.current.tempRaw, cloud: w.current.cloud, precip: w.current.precip,
        wind: w.current.wind, code: w.current.code, desc: w.current.desc,
      } : null).filter(Boolean);
      if (!samples.length) { state.localStatus = 'error'; renderDataStatus(); return; }
      state.localPoints = samples; state.localStatus = 'ready';
      addTemperatureLayer();
      renderDataStatus();
    } catch (e) {
      console.warn('Local weather fallback', e);
      state.localStatus = 'error'; renderDataStatus();
    }
  }
  function buildSamplePoints(center) {
    const radius = 0.27, steps = 5, step = (radius*2)/steps, pts = [];
    for (let y=0; y<=steps; y++) for (let x=0; x<=steps; x++)
      pts.push({ lat: +(center.lat - radius + y*step).toFixed(4), lon: +(center.lon - radius + x*step).toFixed(4) });
    return pts;
  }
  async function fetchAllCities() {
    const results = await Promise.allSettled(CITIES.map(c => fetchCityWeather(c.lat, c.lon)));
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') {
        state.cityWeather.set(CITIES[i].name, r.value);
        updateMarkerColor(CITIES[i].name, r.value);
      }
    });
    renderDataStatus();
  }

  // ---------- City Popup ----------
  let popupRequestId = 0;
  async function openCityPopup(city) {
    const reqId = ++popupRequestId;
    state.popupCity = city;
    const popup = document.getElementById('city-popup');
    document.getElementById('popup-city-name').textContent = city.name;
    document.getElementById('popup-temp').textContent = '--';
    document.getElementById('popup-desc').textContent = '加载中...';
    document.getElementById('popup-humidity').textContent = '--';
    document.getElementById('popup-wind').textContent = '--';
    document.getElementById('popup-precip').textContent = '--';
    document.getElementById('forecast-source').textContent = '正在读取 Open-Meteo 逐时模型预报...';
    popup.setAttribute('aria-hidden','false'); popup.removeAttribute('inert');
    popup.classList.remove('hidden');
    state.popupForecast = []; renderForecastChart([]);
    focusCity(city);

    let w;
    try { w = await fetchCityWeather(city.lat, city.lon); state.cityWeather.set(city.name, w); }
    catch (e) {
      if (reqId !== popupRequestId) return;
      document.getElementById('popup-desc').textContent = '数据获取失败';
      document.getElementById('forecast-source').textContent = 'Open-Meteo 逐时预报暂不可用';
      return;
    }
    if (reqId !== popupRequestId || popup.classList.contains('hidden')) return;
    const cur = w.current;
    document.getElementById('popup-temp').textContent = cur.temp;
    document.getElementById('popup-desc').textContent = cur.desc;
    document.getElementById('popup-humidity').textContent = cur.humidity;
    document.getElementById('popup-wind').textContent = cur.wind;
    document.getElementById('popup-precip').textContent = cur.precip;
    updateMarkerColor(city.name, w);
    state.popupForecast = w.forecast;
    document.getElementById('forecast-source').textContent =
      `共 ${w.forecast.length} 个逐时点（当前至 +24h）· 模型预报，仅供趋势参考`;
    renderForecastChart(w.forecast);
    if (state.activeLayers.has('particles')) {
      precip.setWeather(cur.type, cur.precip > 0 ? Math.min(cur.precip/20, 1) : 0.55);
    }
  }
  function closeCityPopup() {
    popupRequestId++;
    const popup = document.getElementById('city-popup');
    popup.classList.add('hidden');
    popup.setAttribute('aria-hidden','true'); popup.setAttribute('inert','');
    precip.setWeather('clear', 0);
  }
  function renderForecastChart(forecast) {
    const canvas = document.getElementById('forecast-chart');
    if (state.chart) { state.chart.destroy(); state.chart = null; }
    if (!Array.isArray(forecast) || !forecast.length) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = 'rgba(180,210,255,0.72)'; ctx.font = '12px "Microsoft YaHei", sans-serif';
      ctx.fillText('正在加载逐小时预报...', 18, 58); return;
    }
    if (typeof Chart === 'undefined') return;
    const slice = forecast.slice(0,25);
    const labels = slice.map(f => `${String(f.time).slice(11,13)}时`);
    state.chart = new Chart(canvas, {
      data: { labels, datasets: [
        { type:'line', label:'温度 °C', data: slice.map(f=>f.temp),
          borderColor:'rgba(255,180,60,0.9)', backgroundColor:'rgba(255,180,60,0.07)',
          borderWidth:2, pointRadius:2, tension:0.35, yAxisID:'y' },
        { type:'bar', label:'降水概率 %', data: slice.map(f=>f.precipProb ?? 0),
          backgroundColor:'rgba(80,160,255,0.32)', borderColor:'rgba(80,160,255,0.55)',
          borderWidth:1, yAxisID:'y1' },
      ]},
      options: { responsive:true, maintainAspectRatio:false, animation:{duration:280},
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{ label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + (ctx.datasetIndex===0?'°C':'%') } } },
        scales:{
          x:{ ticks:{color:'rgba(180,210,255,0.5)',font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:7}, grid:{color:'rgba(100,150,255,0.07)'} },
          y:{ position:'left', ticks:{color:'rgba(255,180,60,0.7)',font:{size:9}}, grid:{color:'rgba(100,150,255,0.07)'} },
          y1:{ position:'right', min:0, max:100, ticks:{color:'rgba(80,160,255,0.7)',font:{size:9}}, grid:{drawOnChartArea:false} },
        },
      },
    });
  }

  // ---------- Timeline ----------
  const tl = {
    track: null, cursor: null, playBtn: null, label: null,
    offset: 0, total: (PAST_HOURS+FUTURE_HOURS)*60, past: PAST_HOURS*60,
    init() {
      this.track = document.getElementById('tl-track');
      this.cursor = document.getElementById('tl-cursor');
      this.playBtn = document.getElementById('tl-play-btn');
      this.label = document.getElementById('tl-time-label');
      this.track.setAttribute('aria-valuemin', String(-this.past));
      this.track.setAttribute('aria-valuemax', String(FUTURE_HOURS*60));
      this.playBtn.addEventListener('click', () => this.toggle());
      let dragging = false;
      const seek = (e) => {
        const r = this.track.getBoundingClientRect();
        const ratio = Math.min(Math.max((e.clientX - r.left)/r.width, 0), 1);
        this.moveTo(Math.round(ratio*this.total - this.past));
        this.emit();
      };
      this.track.addEventListener('mousedown', e => { dragging = true; seek(e); });
      window.addEventListener('mousemove', e => { if (dragging) seek(e); });
      window.addEventListener('mouseup', () => dragging = false);
      this.track.addEventListener('touchstart', e => { dragging = true; seek(e.touches[0]); }, {passive:true});
      window.addEventListener('touchmove', e => { if (dragging) seek(e.touches[0]); }, {passive:true});
      window.addEventListener('touchend', () => dragging = false);
      this.track.addEventListener('keydown', e => {
        let n = null;
        if (e.key==='ArrowLeft'||e.key==='ArrowDown') n = this.offset - 30;
        if (e.key==='ArrowRight'||e.key==='ArrowUp') n = this.offset + 30;
        if (e.key==='Home') n = -this.past; if (e.key==='End') n = FUTURE_HOURS*60;
        if (n === null) return; e.preventDefault(); this.moveTo(n); this.emit();
      });
      this.moveTo(0);
    },
    onChange(fn){ this._fn = fn; },
    emit(){ if (this._fn) this._fn(this.offset); },
    moveTo(m) {
      this.offset = Math.min(Math.max(m, -this.past), FUTURE_HOURS*60);
      const ratio = (this.offset + this.past)/this.total;
      this.cursor.style.left = `${ratio*100}%`;
      if (this.offset === 0) this.label.textContent = '实况';
      else if (this.offset < 0) { const h=Math.abs(Math.floor(this.offset/60)), mm=Math.abs(this.offset%60); this.label.textContent = `-${h}h${mm>0?mm+'m':''}`; }
      else { const h=Math.floor(this.offset/60), mm=this.offset%60; this.label.textContent = `+${h}h${mm>0?mm+'m':''}`; }
      this.track.setAttribute('aria-valuenow', String(this.offset));
      this.track.setAttribute('aria-valuetext', this.label.textContent);
    },
    toggle() {
      if (this.playing) {
        this.playing = false; clearInterval(this.playTimer); this.playTimer = null;
        this.playBtn.textContent = '▶'; this.playBtn.setAttribute('aria-pressed','false');
      } else {
        this.playing = true; this.playBtn.textContent = '⏸'; this.playBtn.setAttribute('aria-pressed','true');
        if (this.offset === 0) this.moveTo(-this.past);
        this.playTimer = setInterval(() => {
          const n = this.offset + 30;
          this.moveTo(n > FUTURE_HOURS*60 ? -this.past : n); this.emit();
        }, 1100);
      }
    },
  };

  function onTimeChange(offset) {
    state.timelineOffset = offset;
    setRadarFrame(offset);
    syncLayerVisibility();
    updateLegendStatus(offset);
    renderDataStatus();
    updateBriefing();
  }

  // ---------- Legend & Data Status ----------
  function renderLegend() {
    const body = document.getElementById('legend-body');
    if (!body) return;
    const keys = [...state.activeLayers].filter(k => {
      if (k === 'radar') return !!state.map?.getLayer('radar-layer');
      if (k === 'cloud') return !!state.map?.getLayer('cloud-layer');
      return true;
    });
    if (!keys.length) { body.innerHTML = '<div class="legend-empty">未启用任何图层</div>'; return; }
    body.innerHTML = keys.map(k => {
      const m = LEGEND_META[k]; if (!m) return '';
      return `<div class="legend-item">
        <div class="legend-item-title"><span class="icon">${m.icon}</span>${m.title}</div>
        ${m.bar ? `<div class="legend-bar" style="background:${m.bar}"></div>` : ''}
        ${m.scale.length ? `<div class="legend-scale">${m.scale.map(s=>`<span>${s}</span>`).join('')}</div>` : ''}
        <div class="legend-note">${m.note}</div></div>`;
    }).join('');
  }
  function updateLegendStatus(offset) {
    const el = document.getElementById('legend-status');
    if (offset === 0) { el.textContent = '🔵 实况 — 当前观测'; el.dataset.mode = 'now'; }
    else if (offset < 0) { el.textContent = `⏪ 过去 ${formatDuration(Math.abs(offset))} 回放`; el.dataset.mode = 'past'; }
    else {
      const mode = offset <= (state.hasNowcast ? 180 : 0) && state.hasNowcast ? 'nowcast' : 'model';
      if (mode === 'nowcast') el.textContent = `⏩ 未来 ${formatDuration(offset)} · 雷达短临预测`;
      else el.textContent = `⏩ 未来 ${formatDuration(offset)} · 雷达短临已超出时效`;
      el.dataset.mode = 'future';
    }
  }
  function renderDataStatus() {
    const el = document.getElementById('legend-data-status');
    if (!el) return;
    const rows = [];
    const radarAvail = state.radarFrames.length > 0;
    if (!state.activeLayers.has('radar')) rows.push({text:'📡 雷达 · 已关闭', ok:false});
    else if (state.timelineOffset <= 0 && radarAvail) {
      const last = state.radarFrames[state.radarFrames.length-1];
      const ageMin = Math.max(0, Math.round((Date.now()/1000 - last.time)/60));
      rows.push({text:`📡 雷达实况 · 最新 ${ageMin} min 前`, ok:true});
    } else if (state.timelineOffset > 0 && state.hasNowcast) {
      rows.push({text:`📡 雷达短临预测 · +${formatDuration(state.timelineOffset)} · 仅供短时趋势参考`, ok:true});
    } else rows.push({text:'📡 雷达 · 实况或短临暂不可用', ok:false});

    if (state.timelineOffset > 0) rows.push({text:'☁ 云图 · 未来时段不显示观测云图', ok:false});
    else if (!state.activeLayers.has('cloud')) rows.push({text:'☁ 云图 · 已关闭', ok:false});
    else rows.push({text:'☁ 云图观测 · Himawari-8 红外', ok:true});

    rows.push({text: state.hasNowcast ? `⏩ 雷达短临 · 可用至约 +${formatDuration(180)}` : '⏩ 雷达短临 · 暂无', ok: state.hasNowcast});
    rows.push({text: state.cityWeather.size ? '🌡 城市天气 · 实时' : '🌡 城市天气 · 加载中', ok: !!state.cityWeather.size});
    rows.push({text: state.localStatus === 'ready' ? `🧭 局地网格 · ${state.localPoints.length} 个采样点` :
      state.localStatus === 'error' ? '🧭 局地网格 · 暂不可用' : '🧭 局地网格 · 加载中', ok: state.localStatus==='ready'});
    rows.push({text:'💨 风场 · 演示流场', ok:true});

    el.innerHTML = rows.map(r => `<div class="ds-row${r.ok?'':' ds-off'}">${r.text}</div>`).join('');
    updateBriefing();
  }

  // ---------- Briefing ----------
  function updateBriefing() {
    const card = document.getElementById('briefing-card');
    const b = buildBriefing();
    card.innerHTML = `<div class="brief-main">${b.main}</div><div class="brief-sub">${b.sub}</div><div class="brief-trust">${b.trust}</div>`;
  }
  function buildBriefing() {
    const center = state.focusCity || DEFAULT_FOCUS;
    const offset = state.timelineOffset;
    if (offset > 0) {
      const o = formatDuration(offset);
      if (state.hasNowcast && offset <= 180) return {
        main: `${center.name}：未来 ${o} · 雷达短临`,
        sub: '显示 RainViewer 提供的真实短临帧，不沿用冻结实况',
        trust: `短临时效约至 +${formatDuration(180)}，越接近时效末端越不确定` };
      return {
        main: `${center.name}：未来 ${o} · 超出雷达短临时效`,
        sub: '雷达短临仅覆盖未来约 3 小时，更远时段建议参考城市逐时预报',
        trust: '可回到实况/过去查看观测，或点击城市查看 +24h 模型预报' };
    }
    const samples = state.localPoints.filter(p => Number.isFinite(p.temp));
    if (samples.length < 4) {
      if (state.localStatus === 'error') return {
        main: `${center.name}：局地数据暂不可用`,
        sub: '城市天气与雷达图层仍可继续查看',
        trust: '网络恢复后重新选择城市即可重试' };
      return {
        main: `${center.name}天气读取中`,
        sub: '正在加载区级温度、云量、降水和雷达数据',
        trust: '地图先显示，天气判断随后更新' };
    }
    const avgTemp = samples.reduce((s,p)=>s+p.temp,0)/samples.length;
    const min = samples.reduce((a,b)=>a.temp<b.temp?a:b);
    const max = samples.reduce((a,b)=>a.temp>b.temp?a:b);
    const cloudSamples = samples.filter(p=>Number.isFinite(p.cloud));
    const avgCloud = cloudSamples.length ? cloudSamples.reduce((s,p)=>s+p.cloud,0)/cloudSamples.length : NaN;
    const precipSamples = samples.filter(p=>Number.isFinite(p.precip));
    const maxPrecip = precipSamples.length ? precipSamples.reduce((a,b)=>a.precip>b.precip?a:b) : null;
    const cloudWord = !Number.isFinite(avgCloud) ? '云量读取中' :
      avgCloud >= 80 ? '阴云很多' : avgCloud >= 55 ? '云量偏多' : avgCloud >= 25 ? '有散云' : '少云或晴';
    const rainWord = maxPrecip && maxPrecip.precip > 0.05 ? `${directionFrom(center,maxPrecip)}有弱降水` : '暂无明显降水';
    const last = state.radarFrames[state.radarFrames.length-1];
    const radarWord = last ? `雷达${Math.max(0,Math.round((Date.now()/1000-last.time)/60))}分钟前` : '雷达暂不可用';
    return {
      main: `${center.name}：${avgTemp.toFixed(0)}°C · ${cloudWord} · ${rainWord}`,
      sub: `偏热${directionFrom(center,max)} ${max.temp.toFixed(1)}°C / 偏凉${directionFrom(center,min)} ${min.temp.toFixed(1)}°C`,
      trust: state.hasNowcast ? `${radarWord}；短临0-2小时看雷达外推，越远越不准`
        : `${radarWord}；按实况雷达和区级采样做趋势参考` };
  }

  // ---------- Layer buttons ----------
  function bindLayerButtons() {
    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.layer;
        if (state.activeLayers.has(id)) {
          state.activeLayers.delete(id); btn.classList.remove('active');
          if (id === 'particles') precip.setWeather('clear', 0);
        } else {
          state.activeLayers.add(id); btn.classList.add('active');
          if (id === 'particles' && state.popupCity && state.cityWeather.has(state.popupCity.name)) {
            const w = state.cityWeather.get(state.popupCity.name);
            precip.setWeather(w.current.type, w.current.precip>0?Math.min(w.current.precip/20,1):0.55);
          }
          if (id === 'cloud') loadCloud();
          if (id === 'temperature') addTemperatureLayer();
        }
        syncLayerVisibility(); renderLegend(); renderDataStatus();
        showNotice(`${LEGEND_META[id].title} · ${state.activeLayers.has(id)?'已开启':'已关闭'}`);
      });
    });
  }

  // ---------- Zoom ----------
  let zoomIndex = INITIAL_ZOOM_INDEX;
  function bindZoom() {
    document.getElementById('zoom-in').addEventListener('click', () => setZoom(zoomIndex + 1));
    document.getElementById('zoom-out').addEventListener('click', () => setZoom(zoomIndex - 1));
    updateZoomUI();
  }
  function setZoom(i) {
    i = Math.min(Math.max(i, 0), ZOOM_LEVELS.length - 1);
    if (i === zoomIndex) return;
    zoomIndex = i;
    state.map.easeTo({ zoom: ZOOM_LEVELS[i].zoom, duration: 500 });
    updateZoomUI(); setRadarOpacity();
  }
  function updateZoomUI() {
    document.getElementById('zoom-label').textContent = ZOOM_LEVELS[zoomIndex].label;
    document.getElementById('zoom-in').disabled = zoomIndex >= ZOOM_LEVELS.length - 1;
    document.getElementById('zoom-out').disabled = zoomIndex <= 0;
  }

  // ---------- Legend toggle ----------
  function bindLegendToggle() {
    const btn = document.getElementById('legend-toggle');
    const panel = document.getElementById('legend-panel');
    btn.addEventListener('click', () => {
      const collapsed = panel.classList.toggle('collapsed');
      btn.textContent = collapsed ? '+' : '−';
      btn.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  // ---------- Wind field particles ----------
  const wind = {
    canvas: null, ctx: null, particles: [], W:0, H:0, t:0,
    init() {
      this.canvas = document.getElementById('wind-canvas');
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      const N = 220;
      for (let i = 0; i < N; i++) this.particles.push(this.spawn());
      this.loop();
    },
    resize() {
      this.W = this.canvas.width = window.innerWidth;
      this.H = this.canvas.height = window.innerHeight;
    },
    spawn() { return { x: Math.random()*this.W, y: Math.random()*this.H, age: Math.random()*60, life: 40+Math.random()*40 }; },
    angle(x, y) {
      const s = 0.0022;
      return (Math.sin(x*s + this.t) + Math.cos(y*s*1.3 + this.t*0.7)) * Math.PI * 0.9;
    },
    loop() {
      if (!state.activeLayers.has('wind')) {
        this.ctx.clearRect(0,0,this.W,this.H);
      } else {
        this.ctx.fillStyle = 'rgba(10,14,26,0.10)';
        this.ctx.fillRect(0,0,this.W,this.H);
        this.t += 0.0028;
        const focusWind = state.focusCity && state.localPoints.length
          ? state.localPoints.reduce((s,p)=>s+(p.wind||0),0)/state.localPoints.length : 3;
        const speed = 1 + Math.min(focusWind/3, 2.5);
        for (const p of this.particles) {
          const a = this.angle(p.x, p.y);
          const nx = p.x + Math.cos(a)*speed, ny = p.y + Math.sin(a)*speed;
          const mag = Math.min(1, speed/3.5);
          this.ctx.strokeStyle = `rgba(${110+mag*80|0},${190+mag*40|0},255,${0.35+mag*0.35})`;
          this.ctx.lineWidth = 1 + mag;
          this.ctx.beginPath(); this.ctx.moveTo(p.x,p.y); this.ctx.lineTo(nx,ny); this.ctx.stroke();
          p.x = nx; p.y = ny; p.age++;
          if (p.age > p.life || nx < 0 || nx > this.W || ny < 0 || ny > this.H) Object.assign(p, this.spawn());
        }
      }
      requestAnimationFrame(() => this.loop());
    },
  };

  // ---------- Precipitation particles ----------
  const precip = {
    canvas: null, ctx: null, W:0, H:0, type:'clear', intensity:0, drops:[],
    init() {
      this.canvas = document.getElementById('particle-canvas');
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.loop();
    },
    resize() { this.W = this.canvas.width = window.innerWidth; this.H = this.canvas.height = window.innerHeight; },
    setWeather(type, intensity) { this.type = type; this.intensity = intensity; this.drops = []; },
    loop() {
      this.ctx.clearRect(0,0,this.W,this.H);
      if (state.activeLayers.has('particles') && this.type !== 'clear' && this.intensity > 0) {
        const count = Math.floor(this.intensity * (this.type==='snow'?160:260));
        while (this.drops.length < count) this.drops.push(this.spawn());
        while (this.drops.length > count) this.drops.pop();
        for (const d of this.drops) {
          if (this.type === 'snow') {
            d.x += d.sw; d.y += d.v;
            this.ctx.fillStyle = `rgba(220,240,255,${d.a})`;
            this.ctx.beginPath(); this.ctx.arc(d.x,d.y,d.r,0,Math.PI*2); this.ctx.fill();
          } else {
            d.x += d.sw; d.y += d.v;
            this.ctx.strokeStyle = this.type==='storm' ? `rgba(180,220,255,${d.a})` : `rgba(150,200,255,${d.a})`;
            this.ctx.lineWidth = d.r;
            this.ctx.beginPath(); this.ctx.moveTo(d.x,d.y); this.ctx.lineTo(d.x - d.sw*1.5, d.y - d.v*1.5); this.ctx.stroke();
          }
          if (d.y > this.H) Object.assign(d, this.spawn(true));
        }
        if (this.type === 'storm' && Math.random() < 0.012) {
          this.ctx.fillStyle = `rgba(255,255,255,${0.15+Math.random()*0.25})`;
          this.ctx.fillRect(0,0,this.W,this.H);
        }
      } else if (this.drops.length) this.drops = [];
      requestAnimationFrame(() => this.loop());
    },
    spawn(top) {
      if (this.type === 'snow') return {
        x: Math.random()*this.W, y: top ? -5 : Math.random()*this.H,
        v: 0.5+Math.random()*1.2, sw: (Math.random()-0.5)*0.6,
        r: 1+Math.random()*1.8, a: 0.4+Math.random()*0.5 };
      return {
        x: Math.random()*this.W, y: top ? -10 : Math.random()*this.H,
        v: 6+Math.random()*8, sw: (Math.random()-0.5)*1.2,
        r: 0.8+Math.random()*1.1, a: 0.3+Math.random()*0.4 };
    },
  };

  // ---------- Init ----------
  let _featuresReady = false;
  function initializeFeatures() {
    if (_featuresReady || !state.map) return;
    const style = state.map.getStyle?.();
    if (!style || !Array.isArray(style.layers)) { setTimeout(initializeFeatures, 350); return; }
    _featuresReady = true;
    addCityMarkers();
    bindLayerButtons(); bindZoom(); bindLegendToggle();
    document.getElementById('popup-close').addEventListener('click', closeCityPopup);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !document.getElementById('city-popup').classList.contains('hidden')) closeCityPopup();
    });
    tl.init(); tl.onChange(onTimeChange);
    renderLegend(); updateLegendStatus(0);
    loadRadar(); loadCloud(); fetchAllCities();
    focusCity(DEFAULT_FOCUS);
    wind.init(); precip.init();
    state.map.on('zoomend', () => { setRadarOpacity(); });
    setTimeout(() => document.getElementById('boot-overlay').classList.add('hide'), 1000);
    setInterval(loadRadar, 5*60*1000);
  }

  function init() {
    state.map = createMap();
    // 三重兜底，确保 style 加载完成后必定初始化（对齐原应用的健壮策略）
    state.map.on('load', initializeFeatures);
    state.map.on('styledata', () => setTimeout(initializeFeatures, 0));
    setTimeout(initializeFeatures, 4000);
    setTimeout(() => document.getElementById('boot-overlay').classList.add('hide'), 7000);
  }

  if (typeof maplibregl !== 'undefined') init();
  else window.addEventListener('load', init);
  </script>
</body>
