version: '3.8'

services:
  backend:
    build: ./backend
    container_name: business-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./business_automation.db
      - SECRET_KEY=your-production-secret-key-change-me
      - DEEPSEEK_API_KEY=your-deepseek-api-key
      - DEEPSEEK_API_BASE_URL=https://sg.uiuiapi.com
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: business-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
