<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商家运营系统 Demo</title>
    <style>
      :root {
        --primary: #b45309;
        --primary-700: #92400e;
        --primary-soft: #f8ead7;
        --food: #f97316;
        --food-soft: #fff1e7;
        --success: #16a34a;
        --success-soft: #dcfce7;
        --warning: #f59e0b;
        --warning-soft: #fef3c7;
        --danger: #ef4444;
        --danger-soft: #fee2e2;
        --bg: #f6f4ef;
        --surface: #fffdfa;
        --surface-muted: #f1ece3;
        --border: #e6ddd1;
        --text: #1f2933;
        --muted: #6b7280;
        --sidebar: #0b1220;
        --sidebar-2: #111827;
        --green: #2f6f5e;
        --shadow:
          0 1px 2px rgba(31, 41, 51, 0.06), 0 14px 34px rgba(31, 41, 51, 0.06);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(
            circle at 16% 0%,
            rgba(249, 115, 22, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at 80% 12%,
            rgba(47, 111, 94, 0.09),
            transparent 26%
          ),
          var(--bg);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 276px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        color: #fff;
        background:
          linear-gradient(180deg, rgba(249, 115, 22, 0.08), transparent 28%),
          linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 14px 0 36px rgba(15, 23, 42, 0.18);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .brand {
        padding: 22px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 15px;
        color: #fed7aa;
        background: rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 900;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .brand p {
        margin: 4px 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
      }

      .nav {
        flex: 1;
        min-height: 0;
        padding: 14px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .nav::-webkit-scrollbar {
        display: none;
      }

      .nav-group-title {
        margin: 14px 8px 8px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .nav-btn {
        width: 100%;
        min-height: 46px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: 14px;
        color: rgba(255, 255, 255, 0.86);
        background: transparent;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        align-items: center;
        text-align: left;
        transition: 160ms ease;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.075);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .nav-btn.active {
        color: #fff;
        background: rgba(249, 115, 22, 0.16);
        border-color: rgba(251, 146, 60, 0.42);
        box-shadow: inset 3px 0 0 var(--food);
      }

      .nav-icon {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        display: grid;
        place-items: center;
      }

      .nav-main {
        font-weight: 800;
        line-height: 1.2;
      }

      .nav-sub {
        color: rgba(255, 255, 255, 0.56);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-footer {
        padding: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .merchant {
        padding: 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(249, 115, 22, 0.28);
        display: grid;
        place-items: center;
        font-weight: 900;
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 253, 250, 0.9);
        backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .breadcrumb {
        color: #8a6f57;
        font-size: 12px;
        font-weight: 700;
      }

      .topbar h2 {
        margin: 4px 0 0;
        font-size: 24px;
        line-height: 1.25;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .search {
        width: 260px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 13px;
        color: var(--text);
        background: #fff;
        outline: none;
      }

      .search:focus {
        border-color: rgba(180, 83, 9, 0.52);
        box-shadow: 0 0 0 4px rgba(180, 83, 9, 0.1);
      }

      .btn {
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 10px 14px;
        color: var(--text);
        background: #fff;
        font-weight: 800;
      }

      .btn.primary {
        color: #fff;
        border-color: var(--primary);
        background: linear-gradient(135deg, var(--primary), var(--food));
        box-shadow: 0 10px 22px rgba(180, 83, 9, 0.18);
      }

      .content {
        padding: 22px 24px 34px;
        display: grid;
        gap: 16px;
      }

      .hero {
        padding: 22px;
        border: 1px solid rgba(180, 83, 9, 0.16);
        border-radius: 22px;
        background:
          linear-gradient(
            135deg,
            rgba(255, 247, 237, 0.86),
            rgba(255, 253, 250, 0.96)
          ),
          var(--surface);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
      }

      .hero h3 {
        margin: 0;
        font-size: 28px;
        line-height: 1.25;
      }

      .hero p {
        max-width: 760px;
        margin: 8px 0 0;
        color: var(--muted);
      }

      .hero-score {
        min-width: 188px;
        padding: 16px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid var(--border);
      }

      .score-number {
        font-size: 34px;
        font-weight: 900;
        line-height: 1;
        color: var(--primary-700);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid.cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        min-width: 0;
        padding: 18px;
        border: 1px solid rgba(180, 83, 9, 0.13);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .card-head {
        margin-bottom: 14px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .card h4 {
        margin: 0;
        font-size: 17px;
        line-height: 1.3;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
      }

      .metric {
        min-height: 128px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 30px;
        line-height: 1;
        font-weight: 900;
      }

      .trend {
        margin-top: 10px;
        color: #166534;
        font-size: 12px;
        font-weight: 800;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .tag.primary {
        color: var(--primary-700);
        background: var(--primary-soft);
      }

      .tag.success {
        color: #166534;
        background: var(--success-soft);
      }

      .tag.warning {
        color: #92400e;
        background: var(--warning-soft);
      }

      .tag.danger {
        color: #991b1b;
        background: var(--danger-soft);
      }

      .tag.info {
        color: #334155;
        background: #e2e8f0;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 15px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
        background: #fff;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #eee5da;
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: #7c5f45;
        background: #fff7ed;
        font-size: 12px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .bars {
        display: grid;
        gap: 12px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr) 56px;
        gap: 10px;
        align-items: center;
      }

      .bar-track {
        height: 10px;
        border-radius: 999px;
        background: #f0e5d7;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), var(--food));
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .timeline-item {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 15px;
        background: linear-gradient(
          135deg,
          rgba(255, 247, 237, 0.72),
          rgba(255, 253, 250, 0.96)
        );
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--food);
        box-shadow: 0 0 0 5px rgba(249, 115, 22, 0.12);
      }

      .module-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 16px;
        align-items: start;
      }

      .mini-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .mini-card {
        padding: 14px;
        border: 1px dashed rgba(180, 83, 9, 0.22);
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          rgba(255, 247, 237, 0.7),
          rgba(255, 253, 250, 0.96)
        );
      }

      .mini-card strong {
        display: block;
        font-size: 18px;
      }

      .dish-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .dish {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
      }

      .dish-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .dish-price {
        color: var(--primary-700);
        font-weight: 900;
      }

      .cart-list {
        display: grid;
        gap: 10px;
      }

      .cart-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fff;
      }

      .pill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-700);
        font-size: 12px;
        font-weight: 800;
      }

      .ai-panel {
        display: grid;
        gap: 12px;
      }

      .ai-message {
        padding: 13px 14px;
        border-radius: 16px;
        border: 1px solid rgba(180, 83, 9, 0.16);
        background: #fff;
      }

      .ai-message strong {
        color: var(--primary-700);
      }

      .footer-note {
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        padding: 6px 0 2px;
      }

      @media (max-width: 1180px) {
        .app {
          grid-template-columns: 88px minmax(0, 1fr);
        }

        .brand {
          justify-content: center;
          padding-inline: 12px;
        }

        .brand > div:not(.brand-mark),
        .nav-main,
        .nav-sub,
        .nav-group-title,
        .merchant > div:not(.avatar) {
          display: none;
        }

        .nav-btn {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        .merchant {
          justify-content: center;
        }

        .grid.cols-4,
        .grid.cols-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .module-grid,
        .hero {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .app {
          display: block;
        }

        .sidebar {
          position: relative;
          height: auto;
        }

        .nav {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          max-height: 320px;
        }

        .nav-group-title,
        .sidebar-footer {
          display: none;
        }

        .topbar,
        .top-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .search {
          width: 100%;
        }

        .grid.cols-4,
        .grid.cols-3,
        .grid.cols-2,
        .mini-cards,
        .dish-grid {
          grid-template-columns: 1fr;
        }

        .content {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">店</div>
          <div>
            <h1>商家运营系统</h1>
            <p>单文件 Demo · 无需登录</p>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-footer">
          <div class="merchant">
            <div class="avatar">湖</div>
            <div>
              <strong>湖滨示范店</strong>
              <div class="nav-sub">测试商家 · 经营者</div>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="breadcrumb">
              经营后台 / <span id="crumb">经营首页</span>
            </div>
            <h2 id="pageTitle">经营首页</h2>
          </div>
          <div class="top-actions">
            <input
              class="search"
              id="globalSearch"
              placeholder="搜索订单、菜品、会员、风险..."
            />
            <button class="btn" id="resetBtn">重置演示</button>
            <button class="btn primary" id="exportBtn">导出日报</button>
          </div>
        </header>

        <section class="content" id="content"></section>
      </main>
    </div>

    <script>
      const modules = [
        {
          group: "总览",
          id: "dashboard",
          icon: "总",
          title: "经营首页",
          desc: "今日结论和行动",
        },
        {
          group: "AI 经营",
          id: "ai-actions",
          icon: "任",
          title: "AI任务中心",
          desc: "行动卡和复盘",
        },
        {
          group: "AI 经营",
          id: "ai-assistant",
          icon: "AI",
          title: "AI助手",
          desc: "经营教练问答",
        },
        {
          group: "AI 经营",
          id: "ai-config",
          icon: "配",
          title: "AI配置",
          desc: "Agent 和模型",
        },
        {
          group: "前厅履约",
          id: "orders",
          icon: "单",
          title: "订单管理",
          desc: "订单状态追踪",
        },
        {
          group: "前厅履约",
          id: "table-management",
          icon: "桌",
          title: "桌台管理",
          desc: "区域和开台",
        },
        {
          group: "前厅履约",
          id: "pos-cashier",
          icon: "收",
          title: "堂食 POS 收银台",
          desc: "点单和结账",
        },
        {
          group: "前厅履约",
          id: "payment-reconciliation",
          icon: "账",
          title: "支付对账",
          desc: "流水和差异",
        },
        {
          group: "前厅履约",
          id: "kitchen-kds",
          icon: "厨",
          title: "厨房/KDS",
          desc: "后厨出餐",
        },
        {
          group: "经营配置",
          id: "data-input",
          icon: "录",
          title: "数据录入",
          desc: "经营数据",
        },
        {
          group: "经营配置",
          id: "operations",
          icon: "营",
          title: "运营方案",
          desc: "营销计划",
        },
        {
          group: "经营配置",
          id: "menu",
          icon: "菜",
          title: "菜单管理",
          desc: "分类和菜品",
        },
        {
          group: "经营配置",
          id: "members",
          icon: "会",
          title: "会员中心",
          desc: "等级和复购",
        },
        {
          group: "经营配置",
          id: "stores",
          icon: "店",
          title: "门店管理",
          desc: "门店资料",
        },
        {
          group: "经营配置",
          id: "employee-permissions",
          icon: "权",
          title: "员工权限",
          desc: "角色授权",
        },
        {
          group: "供应财务",
          id: "purchase-suppliers",
          icon: "采",
          title: "采购/供应商",
          desc: "采购成本",
        },
        {
          group: "供应财务",
          id: "financial-reports",
          icon: "财",
          title: "财务报表",
          desc: "毛利和成本",
        },
        {
          group: "供应财务",
          id: "coupon-redemption",
          icon: "券",
          title: "优惠券核销",
          desc: "券码闭环",
        },
        {
          group: "供应财务",
          id: "delivery-platforms",
          icon: "外",
          title: "外卖平台",
          desc: "平台订单",
        },
        {
          group: "供应财务",
          id: "audit-risk",
          icon: "审",
          title: "审计风控",
          desc: "敏感操作",
        },
        {
          group: "洞察设置",
          id: "analytics",
          icon: "析",
          title: "数据分析",
          desc: "趋势分析",
        },
        {
          group: "洞察设置",
          id: "competitors",
          icon: "竞",
          title: "市场洞察",
          desc: "竞品监测",
        },
        {
          group: "洞察设置",
          id: "notifications",
          icon: "通",
          title: "通知中心",
          desc: "系统提醒",
        },
        {
          group: "洞察设置",
          id: "profile",
          icon: "商",
          title: "商家信息",
          desc: "基础资料",
        },
      ];

      const store = {
        dishes: [
          {
            name: "招牌红烧肉",
            category: "招牌热卖",
            price: 58,
            stock: 32,
            gross: "68%",
            status: "热卖",
          },
          {
            name: "青花椒酸菜鱼",
            category: "招牌热卖",
            price: 88,
            stock: 18,
            gross: "62%",
            status: "推荐",
          },
          {
            name: "黑椒牛肉饭",
            category: "午市套餐",
            price: 36,
            stock: 44,
            gross: "55%",
            status: "午市",
          },
          {
            name: "鲜虾云吞面",
            category: "午市套餐",
            price: 32,
            stock: 27,
            gross: "51%",
            status: "稳定",

      function money(value) {
        return "¥" + Number(value).toLocaleString("zh-CN");

      function tag(value) {
        const map = {
          已支付: "success",
          已确认: "success",
          已验收: "success",
          已出餐: "success",
          制作中: "warning",
          待制: "warning",
          待结账: "warning",
          待复核: "danger",
          待确认: "danger",
          执行中: "warning",
          配送中: "primary",
          高: "danger",
          中: "warning",
        };
        return `<span class="tag ${map[value] || "primary"}">${value}</span>`;
      }

      function table(headers, rows) {
        return `
        <div class="table-wrap">
          <table>
            <thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
            <tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      `;
      }

      function metric(label, value, trend) {
        return `
        <article class="card metric">
          <div>
            <div class="metric-label">${label}</div>
            <div class="metric-value">${value}</div>
          </div>
          <div class="trend">${trend}</div>
        </article>
      `;
      }

      function renderNav() {
        const nav = document.getElementById("nav");
        const groups = [...new Set(modules.map((m) => m.group))];
        nav.innerHTML = groups
          .map(
            (group) => `
        <div class="nav-group-title">${group}</div>
        ${modules
          .filter((m) => m.group === group)
          .map(
            (m) => `
          <button class="nav-btn ${m.id === activeModule ? "active" : ""}" data-id="${m.id}" title="${m.title}">
            <span class="nav-icon">${m.icon}</span>
            <span><span class="nav-main">${m.title}</span><span class="nav-sub">${m.desc}</span></span>
          </button>
        `,
          )
          .join("")}
      `,
          )
          .join("");

        nav.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeModule = btn.dataset.id;
            render();
          });
        });
      }

      function render() {
        const current =
          modules.find((m) => m.id === activeModule) || modules[0];
        document.getElementById("pageTitle").textContent = current.title;
        document.getElementById("crumb").textContent = current.title;
        document.getElementById("content").innerHTML =
          renderModule(activeModule) +
          `<div class="footer-note">单文件 Demo · 内置测试数据 · 无需登录和后端服务</div>`;
        renderNav();
      }

      function addDish(index) {
        const dish = store.dishes[index];
        const found = cart.find((item) => item.name === dish.name);
        if (found) found.qty += 1;
        else cart.push({ name: dish.name, price: dish.price, qty: 1 });
        activeModule = "pos-cashier";
        render();
      }

      function clearCart() {
        cart = [];
        render();
      }

      function checkout() {
        if (!cart.length) {
          alert("请先选择菜品。");
          return;
        }
        const total = cart.reduce(
          (sum, item) => sum + item.price * item.qty,
          0,
        );
        store.orders.unshift({
          no: "DEMO-POS-" + String(100 + store.orders.length),
          table: "A02",
          amount: total,
          channel: "微信",
          status: "已支付",
          time: "刚刚",
        });
        cart = [];
        activeModule = "payment-reconciliation";
        render();
        alert("结账成功，支付流水已进入对账模块。");
      }

      document
        .getElementById("globalSearch")
        .addEventListener("input", (event) => {
          keyword = event.target.value.trim();
          if (!keyword) return;
          const hit = modules.find(
            (m) => m.title.includes(keyword) || m.desc.includes(keyword),
          );
          if (hit) {
            activeModule = hit.id;
            render();
          }
        });

      document.getElementById("resetBtn").addEventListener("click", () => {
        activeModule = "dashboard";
        cart = [];
        document.getElementById("globalSearch").value = "";
        render();
      });

      document.getElementById("exportBtn").addEventListener("click", () => {

        a.download = "湖滨示范店经营日报.txt";
        a.click();
        URL.revokeObjectURL(a.href);
      });
