<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>荒糖 — 我的控糖日记</title>
    <style>
        :root {
            --bg: #fdf6f0;
            --card: #fff;
            --primary: #e94560;
            --primary-light: #ff6b81;
            --accent: #f5a623;
            --text: #2c3e50;
            --muted: #95a5a6;
            --green: #27ae60;
            --yellow: #f39c12;
            --red: #e74c3c;
            --border: #f0e6de;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --pink-bg: #fff5f5;
            --milk: #fef9f3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0e6de;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机框架 */
        .phone-frame {
            width: 393px;
            max-width: 100vw;
            height: 852px;
            max-height: 95vh;
            background: var(--bg);
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 8px #1a1a1a, 0 0 0 10px #333;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            background: var(--bg);
            padding: 14px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }
        .status-icons { display: flex; gap: 4px; align-items: center; }

        /* 可滚动内容区 */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-area::-webkit-scrollbar { width: 0; }

        /* 头部用户卡片 */
        .user-card {
            background: linear-gradient(135deg, #e94560, #c0392b);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .user-card::after {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .user-card::before {
            content: '';
            position: absolute;
            bottom: -20px; left: 60%;
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .user-card > * { position: relative; z-index: 1; }
        .user-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .avatar {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .user-info h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .user-info .persona-tag {
            display: inline-block;
            font-size: 11px;
            background: rgba(255,255,255,0.25);
            padding: 3px 10px;
            border-radius: 10px;
            margin-top: 4px;
        }
        .user-stats-row {
            display: flex;
            gap: 12px;
        }
        .user-stat {
            flex: 1;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .user-stat .num {
            font-size: 22px;
            font-weight: 800;
        }
        .user-stat .lbl {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* 本周概览 */
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .weekly-card {
            background: var(--card);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .weekly-card.warn-green { border-left: 4px solid var(--green); }
        .weekly-card.warn-yellow { border-left: 4px solid var(--yellow); }
        .weekly-card.warn-red { border-left: 4px solid var(--red); }
        .weekly-days {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
        }
        .day-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .day-dot .circle {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: #f5f0eb;
            color: #ccc;
            transition: all 0.3s;
        }
        .day-dot .circle.has-order {
            background: var(--primary-light);
            color: #fff;
        }
        .day-dot .circle.today {
            box-shadow: 0 0 0 3px rgba(233,69,96,0.2);
        }
        .day-dot .day-label {
            font-size: 10px;
            color: var(--muted);
        }

        /* 进度条 */
        .limit-bar {
            margin-top: 14px;
        }
        .limit-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .limit-track {
            height: 8px;
            background: #f0e6de;
            border-radius: 4px;
            overflow: hidden;
        }
        .limit-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease, background 0.5s;
        }
        .limit-fill.safe { background: var(--green); }
        .limit-fill.warn { background: var(--yellow); }
        .limit-fill.danger { background: var(--red); }
        .limit-markers {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
            padding: 0 2px;
        }

        /* 最新毒舌 */
        .roast-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        .roast-card.red-card {
            background: linear-gradient(135deg, #fff5f5, #fff);
            border: 1px solid rgba(231,76,60,0.2);
        }
        .roast-card.yellow-card {
            background: linear-gradient(135deg, #fffdf5, #fff);
            border: 1px solid rgba(243,156,18,0.2);
        }
        .roast-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .roast-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }
        .roast-badge.red-bg { background: var(--red); }
        .roast-badge.yellow-bg { background: var(--yellow); color: #333; }
        .roast-badge.green-bg { background: var(--green); }
        .roast-time {
            font-size: 11px;
            color: var(--muted);
        }
        .roast-body {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            font-style: italic;
        }
        .roast-tea {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
        }

        /* 订单列表 */
        .order-list-item {
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .order-tea-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .order-tea-icon.meituan { background: #fce4ec; }
        .order-tea-icon.eleme { background: #e3f2fd; }
        .order-info {
            flex: 1;
            min-width: 0;
        }
        .order-info .tea {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .order-info .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .order-info .mini-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 500;
        }
        .mini-tag.sugar-full { background: #fff3e0; color: #e65100; }
        .mini-tag.sugar-half { background: #f3e5f5; color: #7b1fa2; }
        .mini-tag.sugar-nosugar { background: #e8f5e9; color: #2e7d32; }
        .order-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            flex-shrink: 0;
        }

        /* 下单按钮 */
        .order-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #c0392b);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 20px;
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 1px;
        }
        .order-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(233,69,96,0.3);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        /* Toast */
        .app-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
        }
        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(4px);
        }

        /* 模态弹窗 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: #fff;
            border-radius: 20px 20px 0 0;
            width: 100%;
            padding: 20px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px; height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 0 auto 16px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 15px;
        }
        .modal-option:last-child { border-bottom: none; }
        .modal-option .check {
            color: var(--primary);
            font-weight: 700;
        }
        .modal-close {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #f5f5f5;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="phone-frame" id="app">
    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="status-time">9:41</span>
        <div class="status-icons">📶 🔋</div>
    </div>

    <!-- APS Toast -->
    <div class="app-toast" id="app-toast"></div>

    <!-- 订单弹窗 -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title">🧋 下单一杯奶茶</div>
            <div class="modal-option" onclick="selectTea()">
                <span>🍵 茶品</span>
                <span id="modal-tea" style="color:var(--muted);">点击选择</span>
            </div>
            <div class="modal-option" onclick="selectSugar()">
                <span>🍬 糖度</span>
                <span id="modal-sugar" style="color:var(--muted);">点击选择</span>
            </div>
            <div class="modal-option" onclick="selectPlatform()">
                <span>🛵 平台</span>
                <span id="modal-platform" style="color:var(--muted);">点击选择</span>
            </div>
            <div class="modal-option" style="cursor:default;">
                <span>🥤 杯数</span>
                <span>
                    <button onclick="changeCups(-1)" style="border:none;background:#f5f5f5;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;">−</button>
                    <span id="modal-cups" style="margin:0 12px;font-weight:700;">1</span>
                    <button onclick="changeCups(1)" style="border:none;background:#f5f5f5;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;">+</button>
                </span>
            </div>
            <button class="order-btn" style="margin-top:16px;" onclick="confirmOrder()">确认下单</button>
            <button class="modal-close" onclick="closeModal()">取消</button>
        </div>
    </div>

    <!-- 可滚动区域 -->
    <div class="scroll-area" id="scroll-area">
        <!-- 用户卡片 -->
        <div class="user-card">
            <div class="user-row">
                <div class="avatar" id="user-avatar">🧋</div>
                <div class="user-info">
                    <h3 id="user-name">续命奶茶侠</h3>
                    <span class="persona-tag" id="user-persona">🍬 全糖狂魔</span>
                </div>
            </div>
            <div class="user-stats-row">
                <div class="user-stat">
                    <div class="num" id="stat-total-cups">0</div>
                    <div class="lbl">累计杯数</div>
                </div>
                <div class="user-stat">
                    <div class="num" id="stat-weekly">0</div>
                    <div class="lbl">本周</div>
                </div>
                <div class="user-stat">
                    <div class="num" id="stat-warnings">0</div>
                    <div class="lbl">被骂次数</div>
                </div>
                <div class="user-stat">
                    <div class="num" id="stat-spent">0</div>
                    <div class="lbl">累计消费</div>
                </div>
            </div>
        </div>

        <!-- 本周控糖进度 -->
        <div class="section-title">📊 本周控糖进度</div>
        <div class="weekly-card warn-green" id="weekly-card">
            <div class="limit-row">
                <span>🥤 本周已喝</span>
                <span><strong id="weekly-text">0</strong> / 7 杯</span>
            </div>
            <div class="limit-track">
                <div class="limit-fill safe" id="limit-fill" style="width: 0%;"></div>
            </div>
            <div class="limit-markers">
                <span>安全</span><span>注意</span><span>危险!</span><span>💀</span>
            </div>
            <div class="weekly-days" id="weekly-days"></div>
        </div>

        <!-- 最新毒舌 -->
        <div class="section-title">⚡ 最新毒舌警告</div>
        <div id="roast-area">
            <div class="empty-state" id="roast-empty">
                <div class="icon">😇</div>
                <div>还没有被骂过</div>
                <small style="color:var(--muted);">少喝点就不会被骂</small>
            </div>
        </div>

        <!-- 历史订单 -->
        <div class="section-title">📋 最近订单</div>
        <div id="order-list">
            <div class="empty-state" id="order-empty">
                <div class="icon">🧋</div>
                <div>还没有订单记录</div>
                <small style="color:var(--muted);">快来下一杯奶茶吧</small>
            </div>
        </div>
    </div>

    <!-- 底部下单按钮 -->
    <button class="order-btn" onclick="openOrderModal()" style="margin:8px 16px 16px;width:auto;">
        🧋 下一杯奶茶
    </button>
</div>

<script>
// ==================== 数据 ====================

const NAMES = ['奶茶星人', '控糖失败者', '甜蜜杀手', '续命奶茶侠', '珍珠爱好者', '奶茶品鉴官', '糖分追逐者', '无糖背叛者'];
const TEAS = ['霸气草莓', '多肉葡萄', '满杯红柚', '豆乳玉麒麟', '芝芝莓莓', '杨枝甘露', '黑糖珍珠', '生椰拿铁', '芋泥波波', '青提茉莉', '桂馥兰香', '伯牙绝弦', '波霸奶茶', '四季奶青'];
const SUGARS = ['全糖', '七分糖', '半糖', '三分糖', '无糖'];
const PLATFORMS = ['美团', '饿了么'];
const WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];

const ROAST_RED = [
    '您的胰腺已经在写辞职信了，血糖仪看到你都发抖！别再喝了！',
    '你是不是把奶茶当点滴在打？血管里流的不是血是波霸吧？',
    '建议你把医保卡绑定在奶茶App上，随时准备抢救。',
    '胰岛素厂家含泪感谢您的贡献！血管已经在尖叫了！',
    '您的身体是一座糖分核反应堆吗？快点停下！'
];
const ROAST_YELLOW = [
    '在危险的边缘疯狂试探啊！明天一定少喝？',
    '"我知道不健康但就是忍不住"——经典自我欺骗句式。',
    '您对"适量"这个词是不是有什么误解？',
    '"明天一定少喝"——明日复明日选手认证。'
];
const ROAST_GREEN = [
    '表现不错，但别骄傲，周末还没到呢。',
    '还算克制。不过你的眼神告诉我你在计划下一杯了。',
    '尚在安全范围内，继续保持（如果做得到的话）。',
    '本周表现良好，授予"暂时健康"荣誉称号。'
];

// ==================== 状态 ====================

let appState = {
    userName: randomItem(NAMES),
    totalCups: 0,
    weeklyCups: 0,
    weeklyDays: {},
    warningCount: 0,
    totalSpent: 0,
    orders: [],
    roasts: [],
    orderIdCounter: 0,
    // 弹窗状态
    modalTea: null,
    modalSugar: null,
    modalPlatform: null,
    modalCups: 1
};

// ==================== 工具 ====================

function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function formatTime() { return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); }
function getToday() {
    const d = new Date().getDay();
    return d === 0 ? 6 : d - 1; // 周一=0
}

function calcLevel(cups, sugar) {
    let s = cups;
    if (sugar === '全糖') s += 3;
    else if (sugar === '七分糖') s += 1;
    if (s <= 2) return 'GREEN';
    if (s <= 5) return 'YELLOW';
    return 'RED';
}

function pickRoast(level) { return randomItem(level === 'RED' ? ROAST_RED : level === 'YELLOW' ? ROAST_YELLOW : ROAST_GREEN); }
function personaName() {
    const w = appState.weeklyCups;
    if (w >= 10) return '💀 糖分亡命徒';
    if (w >= 7) return '🔥 全糖狂魔';
    if (w >= 4) return '😈 甜蜜杀手';
    if (w >= 2) return '🧋 续命奶茶侠';
    return '🌿 三分糖倔强党';
}
function avatar() {
    const w = appState.weeklyCups;
    if (w >= 7) return '🤯';
    if (w >= 4) return '😈';
    if (w >= 2) return '😋';
    return '😇';
}
function warnClass() {
    const w = appState.weeklyCups;
    if (w >= 6) return 'warn-red';
    if (w >= 3) return 'warn-yellow';
    return 'warn-green';
}
function limitClass() {
    const w = appState.weeklyCups;
    if (w >= 6) return 'danger';
    if (w >= 3) return 'warn';
    return 'safe';
}
function sugarTag(c) {
    if (c === '全糖') return 'sugar-full';
    if (c === '七分糖' || c === '半糖') return 'sugar-half';
    return 'sugar-nosugar';
}

// ==================== 渲染 ====================

function renderAll() {
    renderUserCard();
    renderWeekly();
    renderRoasts();
    renderOrders();
}

function renderUserCard() {
    document.getElementById('user-name').textContent = appState.userName;
    document.getElementById('user-persona').textContent = personaName();
    document.getElementById('user-avatar').textContent = avatar();
    document.getElementById('stat-total-cups').textContent = appState.totalCups;
    document.getElementById('stat-weekly').textContent = appState.weeklyCups;
    document.getElementById('stat-warnings').textContent = appState.warningCount;
    document.getElementById('stat-spent').textContent = '¥' + appState.totalSpent.toFixed(0);
}

function renderWeekly() {
    document.getElementById('weekly-text').textContent = appState.weeklyCups;
    const card = document.getElementById('weekly-card');
    card.className = 'weekly-card ' + warnClass();

    const fill = document.getElementById('limit-fill');
    const pct = Math.min(100, (appState.weeklyCups / 7) * 100);
    fill.style.width = pct + '%';
    fill.className = 'limit-fill ' + limitClass();

    // 星期圆点
    const today = getToday();
    const daysContainer = document.getElementById('weekly-days');
    let html = '';
    for (let i = 0; i < 7; i++) {
        const has = appState.weeklyDays[i] || 0;
        const classes = ['circle'];
        if (has > 0) classes.push('has-order');
        if (i === today) classes.push('today');
        html += `<div class="day-dot">
            <div class="${classes.join(' ')}">${has || '·'}</div>
            <div class="day-label">周${WEEKDAYS[i]}</div>
        </div>`;
    }
    daysContainer.innerHTML = html;
}

function renderRoasts() {
    const area = document.getElementById('roast-area');
    if (appState.roasts.length === 0) {
        area.innerHTML = `<div class="empty-state" id="roast-empty">
            <div class="icon">😇</div><div>还没有被骂过</div>
            <small style="color:var(--muted);">少喝点就不会被骂</small></div>`;
        return;
    }
    // 显示最近 3 条
    let html = '';
    const recent = appState.roasts.slice(-3).reverse();
    recent.forEach(r => {
        const cls = r.level === 'RED' ? 'red-card' : r.level === 'YELLOW' ? 'yellow-card' : '';
        const bg = r.level === 'RED' ? 'red-bg' : r.level === 'YELLOW' ? 'yellow-bg' : 'green-bg';
        html += `<div class="roast-card ${cls}">
            <div class="roast-header">
                <span class="roast-badge ${bg}">${r.level}</span>
                <span class="roast-time">${r.time}</span>
            </div>
            <div class="roast-body">"${r.msg}"</div>
            <div class="roast-tea">🧋 ${r.tea} · ${r.sugar} · 本周第${r.count}杯</div>
        </div>`;
    });
    area.innerHTML = html;
}

function renderOrders() {
    const list = document.getElementById('order-list');
    if (appState.orders.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="icon">🧋</div>
            <div>还没有订单记录</div><small style="color:var(--muted);">快来下一杯奶茶吧</small></div>`;
        return;
    }
    let html = '';
    const recent = appState.orders.slice(-10).reverse();
    recent.forEach(o => {
        html += `<div class="order-list-item">
            <div class="order-tea-icon ${o.platform === '美团' ? 'meituan' : 'eleme'}">🧋</div>
            <div class="order-info">
                <div class="tea">${o.teaName}</div>
                <div class="meta">
                    <span class="mini-tag ${sugarTag(o.sugarLevel)}">${o.sugarLevel}</span>
                    <span>×${o.cups}杯</span>
                    <span>${o.platform}</span>
                    <span>${o.time}</span>
                </div>
            </div>
            <div class="order-price">¥${o.amount}</div>
        </div>`;
    });
    list.innerHTML = html;
}

// ==================== 下单逻辑 ====================

function openOrderModal() {
    appState.modalTea = null;
    appState.modalSugar = null;
    appState.modalPlatform = null;
    appState.modalCups = 1;
    document.getElementById('modal-tea').textContent = '点击选择';
    document.getElementById('modal-sugar').textContent = '点击选择';
    document.getElementById('modal-platform').textContent = '点击选择';
    document.getElementById('modal-cups').textContent = '1';
    document.getElementById('order-modal').classList.add('show');
}

function closeModal() {
    document.getElementById('order-modal').classList.remove('show');
}

function selectTea() {
    const tea = prompt('选择茶品：\n' + TEAS.map((t, i) => (i + 1) + '. ' + t).join('\n'), '1');
    const idx = parseInt(tea) - 1;
    if (idx >= 0 && idx < TEAS.length) {
        appState.modalTea = TEAS[idx];
        document.getElementById('modal-tea').textContent = TEAS[idx];
        document.getElementById('modal-tea').style.color = 'var(--text)';
    }
}

function selectSugar() {
    const sugar = prompt('选择糖度：\n' + SUGARS.map((s, i) => (i + 1) + '. ' + s).join('\n'), '1');
    const idx = parseInt(sugar) - 1;
    if (idx >= 0 && idx < SUGARS.length) {
        appState.modalSugar = SUGARS[idx];
        document.getElementById('modal-sugar').textContent = SUGARS[idx];
        document.getElementById('modal-sugar').style.color = 'var(--text)';
    }
}

function selectPlatform() {
    const p = prompt('选择平台：\n1. 美团\n2. 饿了么', '1');
    const idx = parseInt(p) - 1;
    if (idx >= 0 && idx < PLATFORMS.length) {
        appState.modalPlatform = PLATFORMS[idx];
        document.getElementById('modal-platform').textContent = PLATFORMS[idx];
        document.getElementById('modal-platform').style.color = 'var(--text)';
    }
}

function changeCups(delta) {
    appState.modalCups = Math.max(1, Math.min(9, appState.modalCups + delta));
    document.getElementById('modal-cups').textContent = appState.modalCups;
}

function confirmOrder() {
    if (!appState.modalTea || !appState.modalSugar || !appState.modalPlatform) {
        showAppToast('请完善订单信息');
        return;
    }

    const order = {
        id: 'MT' + Date.now(),
        teaName: appState.modalTea,
        sugarLevel: appState.modalSugar,
        cups: appState.modalCups,
        platform: appState.modalPlatform,
        amount: (12 + Math.random() * 30).toFixed(2),
        time: formatTime()
    };

    // 更新数据
    appState.totalCups += order.cups;
    appState.weeklyCups += order.cups;
    appState.totalSpent += parseFloat(order.amount);
    const today = getToday();
    appState.weeklyDays[today] = (appState.weeklyDays[today] || 0) + order.cups;
    appState.orders.push(order);

    // AI 判官
    const level = calcLevel(appState.weeklyCups, order.sugarLevel);
    if (level !== 'GREEN') appState.warningCount++;
    const roast = {
        level,
        msg: pickRoast(level),
        tea: order.teaName,
        sugar: order.sugarLevel,
        count: appState.weeklyCups,
        time: formatTime()
    };
    appState.roasts.push(roast);

    closeModal();
    renderAll();
    showAppToast(`🧋 下单成功！${order.teaName} ×${order.cups} — ${roast.level === 'RED' ? '🚨' : roast.level === 'YELLOW' ? '⚠️' : '✅'} ${roast.msg.slice(0,20)}...`);
}

// ==================== Toast ====================

function showAppToast(msg) {
    const t = document.getElementById('app-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== 状态栏时间 ====================

function updateStatusTime() {
    document.getElementById('status-time').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}

// ==================== 模拟推送通知 ====================

function simulatePushNotification() {
    if (!appState.roasts.length) return;
    const last = appState.roasts[appState.roasts.length - 1];
    if (last.level === 'RED') {
        showAppToast('🚨 重糖警告！' + last.msg.slice(0, 30) + '...');
    } else if (last.level === 'YELLOW' && Math.random() > 0.6) {
        showAppToast('⚠️ 控糖提醒：' + last.msg.slice(0, 30) + '...');
    }
}

// ==================== 初始化 ====================

function initApp() {
    updateStatusTime();
    setInterval(updateStatusTime, 30000);
    renderAll();

    // 点击弹窗背景关闭
    document.getElementById('order-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
}

// ==================== 启动 ====================

initApp();

// 暴露到全局供 onclick 使用
window.openOrderModal = openOrderModal;
window.closeModal = closeModal;
window.selectTea = selectTea;
window.selectSugar = selectSugar;
window.selectPlatform = selectPlatform;
window.changeCups = changeCups;
window.confirmOrder = confirmOrder;
</script>

</body>
</html>
