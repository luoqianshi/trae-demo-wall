<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>荒糖 — 奶茶人格测试</title>
    <style>
        :root {
            --bg: #fdf6f0;
            --card: #fff;
            --primary: #e94560;
            --primary-light: #ff6b81;
            --accent: #f5a623;
            --text: #2c3e50;
            --muted: #95a5a6;
            --green: #27ae60;
            --yellow: #f39c12;
            --red: #e74c3c;
            --border: #f0e6de;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #fdf6f0 0%, #fef9f3 40%, #fff5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 手机框架 */
        .phone-frame {
            width: 393px;
            max-width: 100vw;
            height: 852px;
            max-height: 95vh;
            background: #fff;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 8px #1a1a1a, 0 0 0 10px #333;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            padding: 14px 24px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            flex-shrink: 0;
        }

        /* 滚动区 */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .scroll-area::-webkit-scrollbar { width: 0; }

        /* 进度条 */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .progress-track {
            flex: 1;
            height: 6px;
            background: #f0e6de;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            min-width: 32px;
            text-align: right;
        }

        /* 步骤 */
        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .step-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        /* 选项 */
        .options { display: flex; flex-direction: column; gap: 10px; }

        .option-card {
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
        }
        .option-card:hover { border-color: #fccdd3; }
        .option-card.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, #fff5f7, #fff);
            box-shadow: 0 0 0 4px rgba(233,69,96,0.08);
        }
        .option-emoji {
            font-size: 32px;
            flex-shrink: 0;
            width: 44px;
            text-align: center;
        }
        .option-content { flex: 1; }
        .option-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .option-desc {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }
        .option-radio {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid #ddd;
            flex-shrink: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-card.selected .option-radio {
            border-color: var(--primary);
            background: var(--primary);
        }
        .option-radio::after {
            content: '';
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            display: none;
        }
        .option-card.selected .option-radio::after { display: block; }

        /* 按钮 */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #c0392b);
            color: #fff;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: var(--muted);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果页 */
        .result-header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .result-emoji {
            font-size: 72px;
            animation: bounceIn 0.6s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .result-persona {
            font-size: 26px;
            font-weight: 800;
            margin: 8px 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-bio {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 16px;
            padding: 0 10px;
        }

        /* 雷达图模拟 */
        .radar-box {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            text-align: center;
        }
        .radar-row {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
        }
        .radar-stat {
            text-align: center;
        }
        .radar-circle {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            margin: 0 auto 6px;
            color: #fff;
        }
        .radar-circle.red { background: var(--red); }
        .radar-circle.yellow { background: var(--yellow); color: #333; }
        .radar-circle.green { background: var(--green); }
        .radar-circle.pink { background: var(--primary-light); }
        .radar-label {
            font-size: 11px;
            color: var(--muted);
        }

        .result-card {
            background: var(--card);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .result-card h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.7;
        }
        .result-roast {
            font-style: italic;
            color: var(--red);
            font-weight: 600;
        }

        .btn-full {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .btn-full:active { transform: scale(0.97); }

        /* 动画 */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card { animation: slideUp 0.5s ease backwards; }
        .result-card:nth-child(2) { animation-delay: 0.1s; }
        .result-card:nth-child(3) { animation-delay: 0.2s; }
        .result-card:nth-child(4) { animation-delay: 0.3s; }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="status-time">9:41</span>
        <span>📶 🔋</span>
    </div>

    <!-- 滚动区 -->
    <div class="scroll-area" id="scroll-area">
        <!-- 进度 -->
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <span class="progress-text" id="progress-text">1/8</span>
        </div>

        <!-- 题目容器 -->
        <div id="questions-container"></div>
    </div>
</div>

<script>
// ==================== 题目数据 ====================

const questions = [
    {
        title: '你多久喝一次奶茶？',
        subtitle: '诚实回答，判官在看着你 👀',
        key: 'frequency',
        options: [
            { emoji: '☕', label: '每天至少一杯', desc: '奶茶就是我的血液', score: 5 },
            { emoji: '📅', label: '隔一两天一杯', desc: '生活需要一点甜', score: 4 },
            { emoji: '📆', label: '一周两三次', desc: '适度享受', score: 3 },
            { emoji: '🗓️', label: '一周一次', desc: '偶尔解馋', score: 2 },
            { emoji: '🌱', label: '几乎不喝', desc: '偶尔社交才碰', score: 1 }
        ]
    },
    {
        title: '你最爱什么糖度？',
        subtitle: '这将决定你的人格底色',
        key: 'sugar',
        options: [
            { emoji: '🍬', label: '全糖', desc: '人生已经够苦了，奶茶必须甜', score: 5 },
            { emoji: '🍭', label: '七分糖', desc: '甜但留有余地', score: 4 },
            { emoji: '🍯', label: '半糖', desc: '甜与健康的折中方案', score: 3 },
            { emoji: '🧊', label: '三分糖 / 无糖', desc: '喝个氛围，糖就不必了', score: 1 }
        ]
    },
    {
        title: '你最看重奶茶的什么？',
        subtitle: '多选，最多选 3 项',
        key: 'priority',
        multi: true,
        max: 3,
        options: [
            { emoji: '🍬', label: '甜度够不够', desc: '不甜=白喝', score: [5, 0, 0, 3] },
            { emoji: '🧋', label: '小料/珍珠', desc: '没有珍珠的奶茶没有灵魂', score: [0, 4, 3, 0] },
            { emoji: '📸', label: '颜值/打卡', desc: '好看出片才是第一要义', score: [0, 0, 2, 4] },
            { emoji: '💰', label: '性价比', desc: '贵的不一定好，便宜的不一定差', score: [3, 2, 0, 0] },
            { emoji: '🌟', label: '品牌/口碑', desc: '只喝大牌，网红店必打卡', score: [0, 3, 4, 2] },
            { emoji: '🌿', label: '健康低卡', desc: '代糖/植物奶，控糖达人', score: [0, 0, 0, 5] }
        ]
    },
    {
        title: '深夜刷到奶茶外卖，你会？',
        subtitle: '测试你的自制力',
        key: 'night',
        options: [
            { emoji: '🛒', label: '立即下单', desc: '深夜奶茶才是灵魂', score: 5 },
            { emoji: '💭', label: '加入购物车明天点', desc: '理智尚存，但不保证', score: 3 },
            { emoji: '📱', label: '刷一刷然后睡觉', desc: '看看解馋就够了', score: 2 },
            { emoji: '🙅', label: '直接划走', desc: '强大的自制力', score: 1 }
        ]
    },
    {
        title: '如果奶茶突然从地球消失？',
        subtitle: '测测你的依赖程度',
        key: 'vanish',
        options: [
            { emoji: '😱', label: '世界末日', desc: '没有奶茶的人生毫无意义', score: 5 },
            { emoji: '😢', label: '很难过但能接受', desc: '会想念但生活还要继续', score: 3 },
            { emoji: '😐', label: '无所谓', desc: '替代品很多', score: 2 },
            { emoji: '😌', label: '太好了', desc: '这样就不用纠结控糖了', score: 1 }
        ]
    },
    {
        title: '喝了奶茶后你会？',
        subtitle: '测测你的罪恶感',
        key: 'after',
        options: [
            { emoji: '🥳', label: '快乐就完了', desc: '及时行乐，不想那么多', score: 5 },
            { emoji: '🤔', label: '偶尔会后悔', desc: '喝完想想糖分有点多', score: 3 },
            { emoji: '🏃', label: '喝完去运动', desc: '赎罪式健身', score: 2 },
            { emoji: '📝', label: '记录卡路里', desc: '精确计算，严格控糖', score: 1 }
        ]
    },
    {
        title: '别人说你奶茶喝太多，你？',
        subtitle: '测测你的防御机制',
        key: 'defense',
        options: [
            { emoji: '😤', label: '关你什么事', desc: '我喝我的，你管得着吗', score: 5 },
            { emoji: '😅', label: '尴尬一笑', desc: '心里认同但嘴上不说', score: 3 },
            { emoji: '📉', label: '默默减少', desc: '被说了会收敛几天', score: 2 },
            { emoji: '✅', label: '谢谢提醒', desc: '感激并认真考虑', score: 1 }
        ]
    },
    {
        title: '你愿意被AI判官监控奶茶摄入吗？',
        subtitle: '最后一题！',
        key: 'ai',
        options: [
            { emoji: '🤖', label: '非常愿意', desc: '就需要有人毒舌骂醒我', score: 5 },
            { emoji: '😏', label: '可以试试', desc: '只要别骂太狠就行', score: 3 },
            { emoji: '🤨', label: '不太想', desc: '喝奶茶还要被骂？', score: 2 },
            { emoji: '🚫', label: '坚决不要', desc: 'AI也管不了我的糖分自由', score: 1 }
        ]
    }
];

// ==================== 状态 ====================

let state = {
    currentStep: 0,
    answers: {},
    multiSelected: new Set()
};

// ==================== 渲染 ====================

function renderQuestion(idx) {
    const q = questions[idx];
    const container = document.getElementById('questions-container');
    state.multiSelected = new Set();

    // 如果是多选题，预加载已有答案
    if (q.multi && state.answers[q.key]) {
        state.answers[q.key].forEach(s => state.multiSelected.add(s));
    }

    let optionsHtml = q.options.map((opt, i) => {
        const isSelected = q.multi
            ? state.multiSelected.has(i)
            : state.answers[q.key] === i;
        return `<div class="option-card${isSelected ? ' selected' : ''}" onclick="${q.multi ? 'selectMulti' : 'selectOption'}(${idx}, ${i})">
            <div class="option-emoji">${opt.emoji}</div>
            <div class="option-content">
                <div class="option-label">${opt.label}</div>
                <div class="option-desc">${opt.desc}</div>
            </div>
            <div class="option-radio"></div>
        </div>`;
    }).join('');

    const subtitle = q.multi ? `${q.subtitle} (最多${q.max}项)` : q.subtitle;

    container.innerHTML = `<div class="step active">
        <div class="step-title">${q.title}</div>
        <div class="step-subtitle">${subtitle}</div>
        <div class="options">${optionsHtml}</div>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="prevStep()" ${idx === 0 ? 'disabled' : ''}>上一步</button>
            <button class="btn btn-primary" id="next-btn" ${q.multi ? '' : (state.answers[q.key] !== undefined ? '' : 'disabled')}>
                ${idx === questions.length - 1 ? '查看结果 🎉' : '下一步'}
            </button>
        </div>
    </div>`;

    updateProgress();
    container.scrollTop = 0;
    document.getElementById('scroll-area').scrollTop = 0;
}

// ==================== 选择逻辑 ====================

function selectOption(qIdx, optIdx) {
    const q = questions[qIdx];
    if (q.multi) return; // 不应该来这里

    state.answers[q.key] = optIdx;
    renderQuestion(qIdx);
}

function selectMulti(qIdx, optIdx) {
    const q = questions[qIdx];

    if (state.multiSelected.has(optIdx)) {
        state.multiSelected.delete(optIdx);
    } else {
        if (state.multiSelected.size >= q.max) {
            // 移除最早选中的
            const first = state.multiSelected.values().next().value;
            state.multiSelected.delete(first);
        }
        state.multiSelected.add(optIdx);
    }

    // 更新答案
    state.answers[q.key] = Array.from(state.multiSelected);

    // 重新渲染（不翻页）
    renderQuestion(qIdx);
}

// ==================== 导航 ====================

function nextStep() {
    const q = questions[state.currentStep];
    // 验证
    if (!q.multi && state.answers[q.key] === undefined) return;
    if (q.multi && state.multiSelected.size === 0) return;

    if (state.currentStep < questions.length - 1) {
        state.currentStep++;
        renderQuestion(state.currentStep);
    } else {
        showResult();
    }
}

function prevStep() {
    if (state.currentStep > 0) {
        state.currentStep--;
        renderQuestion(state.currentStep);
    }
}

function updateProgress() {
    const total = questions.length;
    const pct = Math.round((state.currentStep / total) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${state.currentStep + 1}/${total}`;
    document.getElementById('progress-wrap').style.display = 'flex';
}

// ==================== 计算结果 ====================

function calcResult() {
    let totalScore = 0;
    let sugarScore = 0, freqScore = 0, socialScore = 0, healthScore = 0;

    questions.forEach(q => {
        const ans = state.answers[q.key];
        if (ans === undefined) return;

        if (q.multi && Array.isArray(ans)) {
            ans.forEach(optIdx => {
                const scores = q.options[optIdx].score;
                totalScore += scores[0] || 0;
                freqScore += scores[1] || 0;
                socialScore += scores[2] || 0;
                healthScore += scores[3] || 0;
            });
        } else {
            const score = q.options[ans].score;
            totalScore += score;

            // 按问题分类加分
            if (q.key === 'frequency') freqScore += score;
            else if (q.key === 'sugar') sugarScore += score;
            else if (q.key === 'priority') socialScore += score;
            else if (q.key === 'after') healthScore += score;
            else if (q.key === 'night') freqScore += score;
            else if (q.key === 'defense') socialScore += score;
            else if (q.key === 'ai') healthScore += (5 - score);
            else if (q.key === 'vanish') freqScore += score;
        }
    });

    // 总分归一化
    const maxScore = questions.reduce((sum, q) => {
        if (q.multi) return sum + q.options[0].score[0] + q.options[1].score[0] + q.options[2].score[0];
        return sum + 5;
    }, 0);
    const normalized = Math.round((totalScore / maxScore) * 100);

    return { totalScore, normalized, sugarScore, freqScore, socialScore, healthScore };
}

function getPersona(result) {
    const n = result.normalized;
    if (n >= 80) return { name: '💀 糖分亡命徒', emoji: '🤯', desc: '奶茶已经是你血液的一部分。你的血管里流淌的不是血，是波霸奶茶。胰岛素厂商应该给你颁终身成就奖。', color: 'red', roast: '医生说你的血糖比股市还刺激，上上下下全看今天喝了几杯。建议把遗嘱写好，受益人填蜜雪冰城。' };
    if (n >= 65) return { name: '🔥 全糖狂魔', emoji: '😈', desc: '全糖是你的底线，少一分甜都是对味蕾的背叛。你坚信"人生很苦，奶茶必须甜"——这个信条你已经坚持了好几年。', color: 'red', roast: '你点单时说的"全糖"，在店员耳朵里等于"请帮我加速血管硬化"。要不要考虑把医保卡绑定在美团上？' };
    if (n >= 50) return { name: '🧋 续命奶茶侠', emoji: '😋', desc: '奶茶是你的精神支柱，工作日靠它续命，周末靠它回血。你知道不健康，但每次路过奶茶店，脚会自动拐进去。', color: 'yellow', roast: '典型的"明天一定少喝"型选手，道理你都懂，但手不听话。建议把手机里的奶茶App都卸了——反正你过两天会装回来。' };
    if (n >= 35) return { name: '😏 三分糖倔强党', emoji: '🤔', desc: '你已经觉醒了一半的控糖意识，三分糖是你最后的倔强。偶尔全糖放纵一下，然后内疚三天。', color: 'yellow', roast: '三分糖选手，属于"知道不健康但假装不知道"的中级段位。你已经超越了60%的奶茶用户，但离真正控糖还隔着一个蜜雪冰城的距离。' };
    if (n >= 20) return { name: '🌿 奶茶品鉴官', emoji: '😌', desc: '你喝奶茶不是上瘾，是品鉴。你关注茶底、奶源、配比，糖度只是锦上添花。属于奶茶界的知识分子。', color: 'green', roast: '你喝的不是奶茶，是生活品质。但再好喝的奶茶也是糖水，别被仪式感骗了。继续保持，哪天彻底戒了我请你喝白开水。' };
    return { name: '😇 无糖苦行僧', emoji: '🥗', desc: '你对奶茶几乎免疫，无糖是常态，健康是第一优先级。你可能已经被朋友圈的奶茶爱好者们"开除友籍"了。', color: 'green', roast: '恭喜你，你是这个系统里最省心的用户。建议你继续保持，顺便去劝劝那个"全糖狂魔"朋友——虽然劝了也没用。' };
}

// ==================== 结果页 ====================

function showResult() {
    const result = calcResult();
    const persona = getPersona(result);

    document.getElementById('progress-wrap').style.display = 'none';

    const container = document.getElementById('questions-container');
    container.innerHTML = `
        <div class="step active">
            <div class="result-header">
                <div class="result-emoji">${persona.emoji}</div>
                <div class="result-persona">${persona.name}</div>
                <div class="result-bio">${persona.desc}</div>
            </div>

            <div class="radar-box">
                <div style="font-size:14px;font-weight:700;color:var(--text);">🕹️ 四维画像</div>
                <div style="display:flex;justify-content:space-around;margin-top:16px;">
                    <div class="radar-stat">
                        <div class="radar-circle pink">${Math.min(100, result.freqScore * 10)}</div>
                        <span class="radar-label">奶茶依赖</span>
                    </div>
                    <div class="radar-stat">
                        <div class="radar-circle ${result.sugarScore >= 4 ? 'red' : result.sugarScore >= 2 ? 'yellow' : 'green'}">${result.sugarScore * 10}</div>
                        <span class="radar-label">嗜甜指数</span>
                    </div>
                    <div class="radar-stat">
                        <div class="radar-circle ${result.socialScore >= 6 ? 'red' : result.socialScore >= 3 ? 'yellow' : 'green'}">${Math.min(100, result.socialScore * 10)}</div>
                        <span class="radar-label">社交驱动</span>
                    </div>
                    <div class="radar-stat">
                        <div class="radar-circle ${result.healthScore <= 3 ? 'red' : result.healthScore <= 5 ? 'yellow' : 'green'}">${Math.min(100, (5 - result.healthScore) * 10)}</div>
                        <span class="radar-label">控糖意志</span>
                    </div>
                </div>
            </div>

            <div class="result-card">
                <h3>😡 AI 判官评语</h3>
                <p class="result-roast">"${persona.roast}"</p>
            </div>

            <div class="result-card">
                <h3>📊 糖分等级</h3>
                <p>你的糖分成瘾指数：<strong>${result.normalized} 分</strong>（满分100）</p>
                <p style="color:var(--muted);font-size:11px;margin-top:4px;">
                    ${result.normalized >= 65 ? '超过了全国 85% 的奶茶用户，请立即就医。' :
                      result.normalized >= 35 ? '中等偏上，还有救，但不多。' :
                      '低于平均水平，你是奶茶界的一股清流。'}
                </p>
            </div>

            <div class="result-card">
                <h3>🛡️ 荒糖建议</h3>
                <p>
                    ${result.normalized >= 65 ? '建议将每周奶茶预算转投医保基金。每次想喝奶茶时，先看看这张测试结果。' :
                      result.normalized >= 35 ? '建立每周杯数上限，用三分糖替代全糖。你的身体已经在给你发信号了——虽然你可能忽略了。' :
                      '继续保持健康的饮品习惯。如果身边有"糖分亡命徒"朋友，请把这条测试转发给他们。'}
                </p>
            </div>

            <button class="btn-full btn-primary" onclick="restartQuiz()">🔄 重新测试</button>
            <button class="btn-full btn-secondary" onclick="shareResult()" style="margin-top:8px;background:#f5f5f5;color:var(--text);">📤 分享结果</button>
        </div>
    `;

    document.getElementById('scroll-area').scrollTop = 0;
}

// ==================== 全局函数 ====================

function shareResult() {
    const persona = getPersona(calcResult());
    const text = `我在荒糖 Sugar Judge 测出的奶茶人格是：${persona.name}\n评分：${calcResult().normalized}分\n${persona.roast}\n来测测你是什么人格 →`;
    if (navigator.share) {
        navigator.share({ title: '荒糖奶茶人格测试', text }).catch(() => {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板！'));
    } else {
        prompt('复制以下文字分享：', text);
    }
}

function restartQuiz() {
    state = { currentStep: 0, answers: {}, multiSelected: new Set() };
    document.getElementById('progress-wrap').style.display = 'flex';
    renderQuestion(0);
}

// ==================== 初始化 ====================

function updateTime() {
    document.getElementById('status-time').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}

// 挂载全局函数（onclick 需要）
window.nextStep = nextStep;
window.prevStep = prevStep;
window.selectOption = selectOption;
window.selectMulti = selectMulti;
window.restartQuiz = restartQuiz;
window.shareResult = shareResult;

// 覆写 renderQuestion 中的按钮绑定
const origNextBtn = nextStep;
document.addEventListener('click', function(e) {
    if (e.target.id === 'next-btn' && !e.target.disabled) {
        nextStep();
    }
});

updateTime();
setInterval(updateTime, 30000);
renderQuestion(0);
</script>
