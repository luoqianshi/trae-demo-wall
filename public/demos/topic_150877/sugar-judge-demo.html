<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒糖 Sugar Judge — 奶茶控糖毒舌警告系统 Demo</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #e94560;
            --accent2: #f5a623;
            --text: #eee;
            --muted: #8892b0;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --red: #e74c3c;
            --border: #2a2a4a;
            --pink: #ff6b9d;
            --milk: #fef5e7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-bubbles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(233,69,96,0.15), transparent);
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* 主容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .header .logo {
            font-size: 56px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header .subtitle {
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }
        .stat-card .value.green { color: var(--green); }
        .stat-card .value.yellow { color: var(--yellow); }
        .stat-card .value.red { color: var(--red); }
        .stat-card .value.accent { color: var(--accent); }

        /* 面板 */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green { background: var(--green); }
        .dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
        .dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }

        /* 流程可视化 */
        .flow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .flow-node {
            background: rgba(233,69,96,0.1);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px 18px;
            text-align: center;
            font-size: 13px;
            min-width: 100px;
            transition: all 0.3s;
        }
        .flow-node.active {
            background: rgba(233,69,96,0.25);
            box-shadow: 0 0 16px rgba(233,69,96,0.3);
            transform: scale(1.05);
        }
        .flow-node .node-icon { font-size: 22px; margin-bottom: 4px; }
        .flow-arrow {
            color: var(--accent);
            font-size: 20px;
            animation: arrow-blink 1s infinite;
        }
        @keyframes arrow-blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 按钮 */
        .btn {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233,69,96,0.4);
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            box-shadow: none;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 订单卡片 */
        .order-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 12px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .order-card.warned {
            border-color: var(--red);
            box-shadow: 0 0 12px rgba(231,76,60,0.2);
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .order-meta .tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .tag.platform-meituan { background: #fce4ec; color: #c62828; }
        .tag.platform-eleme { background: #e3f2fd; color: #1565c0; }
        .tag.sugar-full { background: #fff3e0; color: #e65100; }
        .tag.sugar-half { background: #f3e5f5; color: #7b1fa2; }
        .tag.sugar-nosugar { background: #e8f5e9; color: #2e7d32; }

        .order-id {
            font-size: 12px;
            color: var(--muted);
            font-family: monospace;
        }
        .order-user {
            font-weight: 600;
            font-size: 15px;
        }
        .order-tea {
            color: var(--accent2);
            font-size: 14px;
        }

        /* 毒舌警告框 */
        .roast-box {
            margin-top: 16px;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 14px;
            line-height: 1.7;
            display: none;
            animation: slideDown 0.4s ease;
        }
        .roast-box.show { display: block; }
        .roast-box.red {
            background: linear-gradient(135deg, rgba(231,76,60,0.15), rgba(233,69,96,0.1));
            border: 1px solid rgba(231,76,60,0.3);
        }
        .roast-box.yellow {
            background: linear-gradient(135deg, rgba(241,196,15,0.1), rgba(245,166,35,0.08));
            border: 1px solid rgba(241,196,15,0.3);
        }
        .roast-box.green {
            background: linear-gradient(135deg, rgba(46,204,113,0.1), rgba(39,174,96,0.08));
            border: 1px solid rgba(46,204,113,0.2);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .roast-box .level-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }
        .level-badge.red { background: var(--red); color: #fff; }
        .level-badge.yellow { background: var(--yellow); color: #333; }
        .level-badge.green { background: var(--green); color: #fff; }
        .roast-text {
            margin-top: 8px;
            font-style: italic;
            color: #eee;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 14px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(4px);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .stats-bar { flex-direction: column; }
            .flow { gap: 6px; }
            .flow-node { padding: 8px 12px; font-size: 11px; min-width: 70px; }
            .flow-arrow { font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- 背景泡泡 -->
<div class="bg-bubbles" id="bubbles"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="logo">🧋</div>
        <h1>荒糖 Sugar Judge</h1>
        <div class="subtitle">奶 茶 控 糖 · 毒 舌 警 告 系 统</div>
    </div>

    <!-- 统计栏 -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="label">📦 累计抓取订单</div>
            <div class="value accent" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🍵 本周杯数</div>
            <div class="value green" id="stat-weekly">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🚨 警告触发</div>
            <div class="value red" id="stat-warnings">0</div>
        </div>
    </div>

    <!-- 流程可视化 -->
    <div class="panel">
        <div class="panel-title">⚡ 数据管道</div>
        <div class="flow">
            <div class="flow-node" id="flow-scheduler">
                <div class="node-icon">⏰</div>
                定时任务
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-node" id="flow-redis">
                <div class="node-icon">📀</div>
                Redis 幂等
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-node" id="flow-db">
                <div class="node-icon">💾</div>
                MySQL 落库
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-node" id="flow-mq">
                <div class="node-icon">🐰</div>
                RabbitMQ
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-node" id="flow-ai">
                <div class="node-icon">🤖</div>
                DeepSeek AI
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-node" id="flow-result">
                <div class="node-icon">⚡</div>
                毒舌警告
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="btn-row">
        <button class="btn" id="btn-fetch" onclick="fetchOrder()">🔍 模拟抓取订单</button>
        <button class="btn btn-secondary" id="btn-auto" onclick="toggleAuto()">▶️ 自动轮询（每3秒）</button>
        <button class="btn btn-secondary" id="btn-reset" onclick="resetAll()">🔄 重置</button>
    </div>

    <!-- 结果区域 -->
    <div class="panel" style="min-height: 200px;">
        <div class="panel-title">
            <span>📋 处理队列</span>
            <span id="queue-count" style="color:var(--muted);font-size:12px;"></span>
        </div>
        <div id="order-list">
            <div style="text-align:center;color:var(--muted);padding:40px 0;">
                🧋 等待抓取订单...<br><small>点击上方按钮开始体验</small>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== 模拟数据 ====================

const USERS = ['奶茶星人', '控糖失败者', '甜蜜杀手', '续命奶茶侠', '珍珠爱好者', '奶茶品鉴官', '糖分追逐者', '无糖背叛者'];
const TEAS = ['霸气草莓', '多肉葡萄', '满杯红柚', '豆乳玉麒麟', '芝芝莓莓', '杨枝甘露', '黑糖珍珠', '生椰拿铁', '芋泥波波', '青提茉莉', '桂馥兰香', '伯牙绝弦', '波霸奶茶', '四季奶青'];
const SUGARS = ['全糖', '七分糖', '半糖', '三分糖', '无糖'];
const PLATFORMS = ['美团', '饿了么'];

// ==================== 毒舌语录库（降级使用） ====================

const ROAST_RED = [
    '兄弟，本周第{cups}杯了！您的胰腺已经在写辞职信了，血糖仪看到你都发抖！',
    '天啊第{cups}杯！你是不是把奶茶当点滴在打？血管里流的不是血是波霸吧？',
    '这周{cups}杯！建议你把医保卡绑定在奶茶App上，随时准备抢救。',
    '第{cups}杯还选{sugar}？您这是在挑战现代医学的极限啊！',
    '一周{cups}杯{sugar}，胰岛素厂家含泪感谢您的贡献！血管已经在尖叫了！',
    '不是，{cups}杯{sugar}{tea}？您的身体是一座糖分核反应堆吗？'
];

const ROAST_YELLOW = [
    '第{cups}杯了哦～ 这是在危险的边缘疯狂试探啊！',
    '一周{cups}杯，属于"我知道不健康但就是忍不住"的经典状态。',
    '还能喝{cups}杯呢？看来您对"适量"这个词有独特的理解。',
    '第{cups}杯{sugar}，属于"明天一定少喝"的明日复明日选手。'
];

const ROAST_GREEN = [
    '这周才{cups}杯，表现不错，但别骄傲，周末还没到呢。',
    '{cups}杯，还算克制。不过你的眼神告诉我你在计划下一杯了。',
    '目前{cups}杯，尚在安全范围内，继续保持（如果做得到的话）。'
];

// ==================== 全局状态 ====================

let state = {
    totalOrders: 0,
    weeklyCount: 0,
    warningCount: 0,
    autoTimer: null,
    processedOrderIds: new Set(),
    currentUser: USERS[Math.floor(Math.random() * USERS.length)]
};

// ==================== 工具函数 ====================

function random(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateOrderId() {
    return 'MT' + Date.now() + String(Math.floor(Math.random() * 1000)).padStart(3, '0');
}

function calcWarningLevel(weeklyCount, sugarLevel) {
    let score = weeklyCount;
    if (sugarLevel === '全糖') score += 3;
    else if (sugarLevel === '七分糖') score += 1;
    if (score <= 2) return 'GREEN';
    if (score <= 5) return 'YELLOW';
    return 'RED';
}

function pickRoast(level, cups, sugar, tea) {
    let pool;
    if (level === 'RED') pool = ROAST_RED;
    else if (level === 'YELLOW') pool = ROAST_YELLOW;
    else pool = ROAST_GREEN;
    return random(pool).replace('{cups}', cups).replace('{sugar}', sugar).replace('{tea}', tea);
}

function sugarTagClass(sugar) {
    if (sugar === '全糖') return 'sugar-full';
    if (sugar === '七分糖' || sugar === '半糖') return 'sugar-half';
    return 'sugar-nosugar';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function updateStats() {
    document.getElementById('stat-total').textContent = state.totalOrders;
    document.getElementById('stat-warnings').textContent = state.warningCount;
    const weeklyEl = document.getElementById('stat-weekly');
    weeklyEl.textContent = state.weeklyCount;
    weeklyEl.className = 'value ' + (state.weeklyCount > 5 ? 'red' : state.weeklyCount > 2 ? 'yellow' : 'green');
}

function highlightFlow(id) {
    const el = document.getElementById(id);
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 800);
}

// ==================== 核心逻辑 ====================

function fetchOrder() {
    // 1. 模拟生成订单
    highlightFlow('flow-scheduler');
    const order = {
        orderId: generateOrderId(),
        userId: 'U' + (10000 + Math.floor(Math.random() * 90000)),
        userName: state.currentUser,
        teaName: random(TEAS),
        sugarLevel: random(SUGARS),
        cups: 1 + Math.floor(Math.random() * 3),
        amount: (12 + Math.random() * 30).toFixed(2),
        platform: random(PLATFORMS),
        orderTime: new Date().toLocaleString('zh-CN')
    };

    showToast(`订单抓取中... Platform: ${order.platform} | Tea: ${order.teaName}`);

    // 2. 模拟延迟后处理（模拟异步管道）
    setTimeout(() => {
        // Redis 幂等判断
        highlightFlow('flow-redis');
        if (state.processedOrderIds.has(order.orderId)) {
            showToast('⏭️ 订单已处理过，跳过（幂等）');
            return;
        }
        state.processedOrderIds.add(order.orderId);

        // 3. 更新状态
        state.totalOrders++;
        state.weeklyCount += order.cups;
        const level = calcWarningLevel(state.weeklyCount, order.sugarLevel);
        if (level !== 'GREEN') state.warningCount++;

        // 4. 模拟落库
        setTimeout(() => {
            highlightFlow('flow-db');
        }, 300);

        // 5. 模拟 MQ 投递
        setTimeout(() => {
            highlightFlow('flow-mq');
        }, 600);

        // 6. 模拟 AI 判官
        setTimeout(() => {
            highlightFlow('flow-ai');
            highlightFlow('flow-result');

            const roast = pickRoast(level, state.weeklyCount, order.sugarLevel, order.teaName);
            order.warningLevel = level;
            order.roastMessage = roast;
            order.weeklyCount = state.weeklyCount;

            // 添加到列表
            addOrderCard(order);

            // 更新统计
            updateStats();

            showToast(`⚡ 毒舌警告触发！等级: ${level}`);
        }, 1200);
    }, 400);
}

function addOrderCard(order) {
    const list = document.getElementById('order-list');
    // 移除占位文字
    if (list.children.length === 1 && list.children[0].tagName === 'DIV' && list.children[0].textContent.includes('等待抓取')) {
        list.innerHTML = '';
    }

    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
        <div class="order-row">
            <div class="order-meta">
                <span class="order-id">#${order.orderId.slice(-8)}</span>
                <span class="tag platform-${order.platform === '美团' ? 'meituan' : 'eleme'}">${order.platform}</span>
                <span class="order-user">${order.userName}</span>
                <span class="order-tea">🧋 ${order.teaName} ×${order.cups}</span>
                <span class="tag ${sugarTagClass(order.sugarLevel)}">${order.sugarLevel}</span>
                <span style="color:var(--muted);font-size:13px;">¥${order.amount}</span>
                <span style="font-size:12px;color:var(--muted);">本周第${order.weeklyCount}杯</span>
            </div>
        </div>
        <div class="roast-box show ${order.warningLevel.toLowerCase()}">
            <span class="level-badge ${order.warningLevel.toLowerCase()}">${order.warningLevel}</span>
            <span class="roast-text">${order.roastMessage}</span>
        </div>
    `;

    // 如果高等级警告，加特效
    if (order.warningLevel === 'RED') {
        card.classList.add('warned');
    }

    list.insertBefore(card, list.firstChild);

    // 限制显示条数
    while (list.children.length > 20) {
        list.removeChild(list.lastChild);
    }
}

// ==================== 自动轮询 ====================

function toggleAuto() {
    const btn = document.getElementById('btn-auto');
    if (state.autoTimer) {
        clearInterval(state.autoTimer);
        state.autoTimer = null;
        btn.textContent = '▶️ 自动轮询（每3秒）';
        btn.style.background = 'transparent';
        showToast('⏸️ 自动轮询已暂停');
    } else {
        btn.textContent = '⏸️ 停止自动轮询';
        btn.style.background = 'linear-gradient(135deg, var(--green), #27ae60)';
        showToast('▶️ 自动轮询已启动（每3秒）');
        fetchOrder(); // 立即执行一次
        state.autoTimer = setInterval(fetchOrder, 3000);
    }
}

function resetAll() {
    if (state.autoTimer) {
        clearInterval(state.autoTimer);
        state.autoTimer = null;
        document.getElementById('btn-auto').textContent = '▶️ 自动轮询（每3秒）';
        document.getElementById('btn-auto').style.background = 'transparent';
    }
    state = {
        totalOrders: 0,
        weeklyCount: 0,
        warningCount: 0,
        autoTimer: null,
        processedOrderIds: new Set(),
        currentUser: random(USERS)
    };
    document.getElementById('order-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;">🧋 等待抓取订单...<br><small>点击上方按钮开始体验</small></div>';
    updateStats();
    showToast('🔄 已重置所有数据');
}

// ==================== 背景泡泡 ====================

function createBubbles() {
    const container = document.getElementById('bubbles');
    for (let i = 0; i < 15; i++) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        const size = 20 + Math.random() * 80;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.animationDuration = (8 + Math.random() * 12) + 's';
        bubble.style.animationDelay = Math.random() * 10 + 's';
        container.appendChild(bubble);
    }
}

// ==================== 初始化 ====================

createBubbles();
updateStats();
</script>

</body>
</html>
