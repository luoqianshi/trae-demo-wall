<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银发防诈骗演练</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#fafaf9;--surface:#fff;--elevated:#f5f5f4;
            --text:#1c1917;--text-secondary:#57534e;--text-tertiary:#a8a29e;
            --border:#e7e5e4;--border-hover:#d6d3d1;
            --accent:#0d9488;--accent-hover:#0f766e;--accent-bg:#f0fdfa;
            --danger:#dc2626;--danger-bg:#fef2f2;--danger-border:#fecaca;
            --warning:#d97706;--warning-bg:#fffbeb;--warning-border:#fde68a;
            --success:#16a34a;--success-bg:#f0fdf4;--success-border:#bbf7d0;
            --radius:10px;--radius-lg:14px;
            --shadow:0 1px 3px rgb(0 0 0 / 0.08);
            --shadow-md:0 4px 12px rgb(0 0 0 / 0.1);
        }
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;display:flex;flex-direction:column}

        /* Top bar */
        .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50}
        .topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1em}
        .topbar .logo-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9em}
        .topbar-right{display:flex;align-items:center;gap:12px}
        .topbar-badge{font-size:.72em;font-weight:700;color:var(--warning);background:var(--warning-bg);padding:3px 10px;border-radius:100px;display:flex;align-items:center;gap:4px}
        .topbar-title{font-size:.82em;color:var(--text-tertiary);font-weight:600}

        /* Pages container */
        .pages{flex:1;overflow:hidden;position:relative}
        .page{position:absolute;inset:0;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;display:none}
        .page.active{display:block;animation:pageIn .25s ease}
        @keyframes pageIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

        /* Bottom nav */
        .bottomnav{background:var(--surface);border-top:1px solid var(--border);display:flex;height:56px;flex-shrink:0;z-index:50}
        .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .15s;color:var(--text-tertiary);border:none;background:none;font-family:inherit}
        .nav-tab.active{color:var(--accent)}
        .nav-tab .nt-icon{font-size:1.2em}
        .nav-tab .nt-label{font-size:.68em;font-weight:700}

        /* Common */
        .section-title{font-size:1.1em;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
        .section-title .st-icon{font-size:1.1em}

        /* ========== HOME PAGE ========== */
        .home-header{text-align:center;padding:20px 0 24px}
        .home-header h2{font-size:1.5em;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
        .home-header p{color:var(--text-secondary);font-size:.92em}
        .home-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
        .hs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
        .hs-card .hs-num{font-size:1.6em;font-weight:800;color:var(--accent);line-height:1}
        .hs-card .hs-label{font-size:.72em;color:var(--text-tertiary);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

        .scenarios{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
        .sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px}
        .sc-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
        .sc-card:active{transform:scale(.98)}
        .sc-card .sc-icon{width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.3em;flex-shrink:0}
        .sc-card .sc-text{flex:1;min-width:0}
        .sc-card .sc-text h4{font-weight:700;font-size:.92em;margin-bottom:2px;display:flex;align-items:center;gap:6px}
        .sc-card .sc-text p{color:var(--text-tertiary);font-size:.8em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .sc-card .sc-arrow{color:var(--text-tertiary);flex-shrink:0;font-size:1em}
        .sc-card.cleared{border-color:var(--success-border)}
        .sc-card.cleared .sc-icon{background:var(--success-bg)}
        .sc-tag{font-size:.62em;font-weight:700;padding:2px 6px;border-radius:100px}
        .sc-tag.pass{background:var(--success-bg);color:var(--success)}
        .sc-tag.rounds{background:var(--elevated);color:var(--text-tertiary)}

        .sc-card .sc-icon.police{background:var(--danger-bg)}
        .sc-card .sc-icon.family{background:var(--warning-bg)}
        .sc-card .sc-icon.health{background:#ede9fe}
        .sc-card .sc-icon.prize{background:#e0f2fe}

        /* ========== KNOWLEDGE PAGE ========== */
        .kb-search{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:.92em;margin-bottom:20px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s}
        .kb-search:focus{border-color:var(--accent)}
        .kb-search::placeholder{color:var(--text-tertiary)}

        .kb-categories{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .kb-cat{padding:6px 14px;border-radius:100px;font-size:.82em;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all .15s}
        .kb-cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .kb-cat:hover:not(.active){border-color:var(--accent);color:var(--accent)}

        .kb-list{display:flex;flex-direction:column;gap:12px}
        .kb-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .2s}
        .kb-item:hover{box-shadow:var(--shadow-md)}
        .kb-item-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
        .kb-item-header h4{font-size:.92em;font-weight:700;display:flex;align-items:center;gap:6px}
        .kb-item-header .kb-arrow{color:var(--text-tertiary);transition:transform .2s;font-size:.9em}
        .kb-item.open .kb-arrow{transform:rotate(90deg)}
        .kb-item-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
        .kb-item.open .kb-item-body{max-height:500px}
        .kb-item-content{padding:0 16px 16px;color:var(--text-secondary);font-size:.88em;line-height:1.7;border-top:1px solid var(--border);padding-top:14px}
        .kb-item-content .kb-tip{background:var(--accent-bg);border-radius:var(--radius);padding:12px;margin-top:10px;color:var(--accent);font-weight:600;font-size:.85em}

        /* ========== PROFILE PAGE ========== */
        .profile-header{text-align:center;padding:24px 0 20px}
        .profile-avatar{width:72px;height:72px;background:var(--elevated);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2em;margin:0 auto 12px}
        .profile-header h3{font-size:1.15em;font-weight:700;margin-bottom:4px}
        .profile-header p{color:var(--text-tertiary);font-size:.85em}

        .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
        .ps-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
        .ps-card .ps-num{font-size:1.5em;font-weight:800;line-height:1}
        .ps-card .ps-num.accent{color:var(--accent)}
        .ps-card .ps-num.danger{color:var(--danger)}
        .ps-card .ps-num.success{color:var(--success)}
        .ps-card .ps-label{font-size:.72em;color:var(--text-tertiary);margin-top:4px;font-weight:700}

        .badge-wall{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
        .badge-item{width:64px;height:80px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .2s}
        .badge-item.earned{border-color:var(--success-border);background:var(--success-bg)}
        .badge-item .bi-icon{font-size:1.5em}
        .badge-item .bi-label{font-size:.65em;font-weight:700;color:var(--text-tertiary)}
        .badge-item.earned .bi-label{color:var(--success)}

        .history-list{display:flex;flex-direction:column;gap:10px}
        .history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
        .history-item .hi-left{display:flex;align-items:center;gap:10px}
        .history-item .hi-icon{font-size:1.2em}
        .history-item .hi-info h5{font-size:.88em;font-weight:700}
        .history-item .hi-info p{font-size:.75em;color:var(--text-tertiary)}
        .history-item .hi-score{font-size:1em;font-weight:800}
        .hi-pass{color:var(--success)}
        .hi-fail{color:var(--danger)}

        /* ========== GAME PAGE ========== */
        .game-topbar{display:flex;align-items:center;gap:10px;padding:0 20px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:50}
        .game-back{width:32px;height:32px;border:none;background:var(--elevated);border-radius:var(--radius);cursor:pointer;font-size:1.1em;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .15s}
        .game-back:hover{background:var(--border)}
        .game-topbar .gt-title{font-weight:700;font-size:.95em;flex:1}
        .game-topbar .gt-round{font-size:.78em;color:var(--text-tertiary);font-weight:600}

        .game-container{position:absolute;inset:0;display:none;flex-direction:column;z-index:40;background:var(--bg)}
        .game-container.active{display:flex}

        .progress-wrap{padding:12px 20px 0;flex-shrink:0}
        .progress-bar{height:5px;background:var(--elevated);border-radius:100px;overflow:hidden}
        .progress-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .4s ease;width:0%}

        .game-body{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}

        .chat-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;text-align:center}
        .chat-header .ch-type{font-size:.68em;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
        .chat-header .ch-desc{font-size:.82em;color:var(--text-tertiary)}

        .chat-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;min-height:180px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
        .msg{display:flex;gap:8px;animation:msgIn .3s ease}
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .msg.scammer{flex-direction:row}
        .msg.user{flex-direction:row-reverse}
        .msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9em;flex-shrink:0;font-weight:700}
        .msg.scammer .msg-avatar{background:var(--danger-bg);color:var(--danger)}
        .msg.user .msg-avatar{background:var(--accent-bg);color:var(--accent)}
        .msg-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:.9em;line-height:1.6}
        .msg.scammer .msg-bubble{background:var(--elevated);color:var(--text)}
        .msg.user .msg-bubble{background:var(--accent);color:#fff}
        .msg-label{font-size:.65em;color:var(--text-tertiary);margin-top:3px}

        .typing{display:none;padding:6px 0;align-items:center;gap:6px;color:var(--text-tertiary);font-size:.8em}
        .typing.show{display:flex}
        .typing-dots span{width:5px;height:5px;background:var(--text-tertiary);border-radius:50%;display:inline-block;animation:blink 1.4s infinite}
        .typing-dots span:nth-child(2){animation-delay:.2s}
        .typing-dots span:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

        .alert{border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;animation:alertIn .3s ease}
        @keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        .alert.danger{background:var(--danger-bg);border:1px solid var(--danger-border)}
        .alert.success{background:var(--success-bg);border:1px solid var(--success-border)}
        .alert.warning{background:var(--warning-bg);border:1px solid var(--warning-border)}
        .alert h4{font-weight:700;font-size:.88em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
        .alert p{color:var(--text-secondary);font-size:.82em;line-height:1.6;margin:0}

        .choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
        .choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 16px;text-align:left;cursor:pointer;transition:all .15s;font-size:.88em;color:var(--text);line-height:1.4}
        .choice-btn:hover{border-color:var(--accent);background:var(--accent-bg)}
        .choice-btn:active{transform:scale(.98)}
        .choice-btn.selected-safe{border-color:var(--success);background:var(--success-bg);pointer-events:none}
        .choice-btn.selected-danger{border-color:var(--danger);background:var(--danger-bg);pointer-events:none}

        .continue-btn{width:100%;padding:12px;border-radius:var(--radius);border:none;background:var(--text);color:#fff;font-weight:700;font-size:.9em;cursor:pointer;transition:all .15s;margin-bottom:20px}
        .continue-btn:hover{background:#27272a}

        /* Score overlay */
        .score-overlay{position:absolute;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;overflow-y:auto;padding:40px 20px 60px;align-items:center;text-align:center}
        .score-overlay.active{display:flex;animation:pageIn .3s ease}
        .score-big{font-size:4em;font-weight:800;color:var(--accent);line-height:1;margin-bottom:6px}
        .score-label{color:var(--text-secondary);margin-bottom:20px;font-size:1em}
        .score-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;width:100%;max-width:400px;margin-bottom:20px}
        .score-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88em}
        .score-row:last-child{border-bottom:none}
        .sr-label{color:var(--text-secondary)}
        .sr-value{font-weight:700;font-size:.82em;padding:2px 8px;border-radius:100px}
        .sr-pass{background:var(--success-bg);color:var(--success)}
        .sr-fail{background:var(--danger-bg);color:var(--danger)}
        .badge-earned{background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius-lg);padding:20px;max-width:300px;width:100%}
        .badge-earned .be-icon{font-size:2.5em;margin-bottom:6px}
        .badge-earned h4{font-weight:700;color:var(--success);margin-bottom:4px;font-size:1em}
        .badge-earned p{color:var(--text-secondary);font-size:.82em}
        .score-actions{display:flex;gap:10px;margin-top:8px}
        .btn{padding:12px 28px;border-radius:var(--radius);border:1px solid transparent;font-weight:700;font-size:.88em;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
        .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
        .btn-primary:hover{background:var(--accent-hover)}
        .btn-ghost{background:var(--surface);color:var(--text-secondary);border-color:var(--border)}
        .btn-ghost:hover{border-color:var(--text-tertiary);color:var(--text)}

        @media(max-width:400px){
            .home-summary{grid-template-columns:1fr 1fr 1fr;gap:8px}
            .msg-bubble{max-width:80%;font-size:.85em}
        }
    </style>
</head>
<body>
    <!-- Main App Shell -->
    <div class="topbar">
        <div class="logo"><div class="logo-icon">&#128737;</div><span>银发防诈骗演练</span></div>
        <div class="topbar-right">
            <div class="topbar-badge" id="topBadge" style="display:none">&#127942; <span id="topBadgeNum">0</span> 已通关</div>
        </div>
    </div>

    <div class="pages" id="pagesContainer">
        <!-- Home -->
        <div class="page active" id="pageHome">
            <div class="home-header">
                <h2>防骗演练中心</h2>
                <p>选择骗局场景，在安全环境中"被骗一次"</p>
            </div>
            <div class="home-summary" id="homeSummary">
                <div class="hs-card"><div class="hs-num" id="hsCleared">0</div><div class="hs-label">已通关</div></div>
                <div class="hs-card"><div class="hs-num" id="hsTotal">4</div><div class="hs-label">总场景</div></div>
                <div class="hs-card"><div class="hs-num" id="hsBest">-</div><div class="hs-label">最高分</div></div>
            </div>
            <div class="section-title"><span class="st-icon">&#127919;</span> 骗局场景</div>
            <div class="scenarios" id="scenarioList"></div>
        </div>

        <!-- Knowledge -->
        <div class="page" id="pageKnowledge">
            <div class="section-title"><span class="st-icon">&#128218;</span> 防骗知识库</div>
            <input class="kb-search" placeholder="搜索防骗知识..." id="kbSearch" oninput="filterKB()">
            <div class="kb-categories" id="kbCats"></div>
            <div class="kb-list" id="kbList"></div>
        </div>

        <!-- Profile -->
        <div class="page" id="pageProfile">
            <div class="profile-header">
                <div class="profile-avatar">&#128100;</div>
                <h3>防骗学员</h3>
                <p>坚持演练，远离骗局</p>
            </div>
            <div class="profile-stats">
                <div class="ps-card"><div class="ps-num accent" id="psCleared">0</div><div class="ps-label">通关场景</div></div>
                <div class="ps-card"><div class="ps-num success" id="psBest">-</div><div class="ps-label">最高分</div></div>
                <div class="ps-card"><div class="ps-num danger" id="psTotal">0</div><div class="ps-label">演练次数</div></div>
            </div>
            <div class="section-title"><span class="st-icon">&#127942;</span> 防骗勋章</div>
            <div class="badge-wall" id="badgeWall"></div>
            <div class="section-title"><span class="st-icon">&#128197;</span> 演练记录</div>
            <div class="history-list" id="historyList"></div>
            <div id="emptyHistory" style="text-align:center;padding:32px 0;color:var(--text-tertiary);font-size:.88em">还没有演练记录，去首页开始吧</div>
        </div>
    </div>

    <div class="bottomnav">
        <button class="nav-tab active" data-page="pageHome"><span class="nt-icon">&#127968;</span><span class="nt-label">首页</span></button>
        <button class="nav-tab" data-page="pageKnowledge"><span class="nt-icon">&#128218;</span><span class="nt-label">知识</span></button>
        <button class="nav-tab" data-page="pageProfile"><span class="nt-icon">&#128100;</span><span class="nt-label">我的</span></button>
    </div>

    <!-- Game Overlay -->
    <div class="game-container" id="gameContainer">
        <div class="game-topbar">
            <button class="game-back" onclick="exitGame()">&larr;</button>
            <span class="gt-title" id="gtTitle"></span>
            <span class="gt-round" id="gtRound"></span>
        </div>
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
        <div class="game-body">
            <div class="chat-header"><div class="ch-type" id="chType"></div><div class="ch-desc" id="chDesc"></div></div>
            <div class="chat-area" id="chatArea"></div>
            <div class="typing" id="typing"><span>对方正在输入</span><span class="typing-dots"><span></span><span></span><span></span></span></div>
            <div id="alertBox"></div>
            <div class="choices" id="choicesBox"></div>
            <button class="continue-btn" id="continueBtn" style="display:none" onclick="nextStep()">继续</button>
        </div>
        <div class="score-overlay" id="scoreOverlay">
            <span style="font-size:3em;margin-bottom:8px">&#127919;</span>
            <div class="score-big" id="scoreNum">0</div>
            <div class="score-label">防骗能力评分</div>
            <div class="badge-earned" id="badgeEarned" style="display:none"><div class="be-icon">&#127942;</div><h4>防骗达人</h4><p>恭喜通关！你已学会识别这种骗局</p></div>
            <div class="score-detail" id="scoreDetail"></div>
            <div class="score-actions"><button class="btn btn-ghost" onclick="exitGame()">返回</button><button class="btn btn-primary" onclick="retryGame()">再练一次</button></div>
        </div>
    </div>

    <script>
        // ========== DATA ==========
        const SCENARIOS = [
            {
                id:'police', icon:'&#128110;', title:'冒充公检法', color:'police',
                desc:'有人打电话说你涉嫌犯罪，要求转账配合调查',

                    </div>
                    <span class="sc-arrow">&#8250;</span>`;
                card.addEventListener('click',()=>startGame(s));
                list.appendChild(card);
            });
            document.getElementById('hsCleared').textContent=clearedSet.size;
            document.getElementById('hsBest').textContent=getOverallBest();
        }

        // ========== KNOWLEDGE ==========
        let kbFilter='all';
        function renderKnowledge(filter){
            const cats=['全部','通用原则','冒充公检法','冒充亲友','保健品','中奖通知','冒充客服'];
            const catBox=document.getElementById('kbCats');
            catBox.innerHTML='';
            cats.forEach(c=>{
                const btn=document.createElement('button');
                btn.className='kb-cat'+(filter===c||(filter==='all'&&c==='全部')?' active':'');
                btn.textContent=c;
                btn.addEventListener('click',()=>{kbFilter=c==='全部'?'all':c;renderKnowledge(kbFilter)});
                catBox.appendChild(btn);
            });
            const f=filter||'all';
            const filtered=f==='all'?KNOWLEDGE:KNOWLEDGE.filter(k=>k.cat===f);
            const searchVal=(document.getElementById('kbSearch')?.value||'').toLowerCase();
            const final=filtered.filter(k=>!searchVal||k.title.includes(searchVal)||k.body.includes(searchVal));
            const list=document.getElementById('kbList');
            list.innerHTML='';
            final.forEach(k=>{
                const item=document.createElement('div');
                item.className='kb-item';
                item.innerHTML=`
                    <div class="kb-item-header"><h4>${k.title}<span style="font-size:.7em;color:var(--text-tertiary);margin-left:4px">${k.cat}</span></h4><span class="kb-arrow">&#8250;</span></div>
                    <div class="kb-item-body"><div class="kb-item-content">${k.body}<div class="kb-tip">&#128161; ${k.tip}</div></div></div>`;
                item.querySelector('.kb-item-header').addEventListener('click',()=>item.classList.toggle('open'));
                list.appendChild(item);
            });
            if(!final.length) list.innerHTML='<div style="text-align:center;padding:32px;color:var(--text-tertiary);font-size:.88em">没有找到相关内容</div>';
        }
        function filterKB(){renderKnowledge(kbFilter)}

        // ========== PROFILE ==========
        function renderProfile(){
            document.getElementById('psCleared').textContent=clearedSet.size;
            document.getElementById('psBest').textContent=getOverallBest();
            document.getElementById('psTotal').textContent=totalPlays;

            const wall=document.getElementById('badgeWall');
            wall.innerHTML='';
            SCENARIOS.forEach(s=>{
                const earned=clearedSet.has(s.id);
                const div=document.createElement('div');
                div.className='badge-item'+(earned?' earned':'');
                div.innerHTML=`<span class="bi-icon">${s.icon}</span><span class="bi-label">${s.title}</span>`;
                wall.appendChild(div);
            });

            const list=document.getElementById('historyList');
            const empty=document.getElementById('emptyHistory');
            list.innerHTML='';
            if(!history.length){empty.style.display='block';return;}
            empty.style.display='none';
            history.slice(0,20).forEach(h=>{
                const sc=SCENARIOS.find(s=>s.id===h.id);
                if(!sc)return;
                const row=document.createElement('div');
                row.className='history-item';
                row.innerHTML=`
                    <div class="hi-left"><span class="hi-icon">${sc.icon}</span><div class="hi-info"><h5>${sc.title}</h5><p>${h.time}</p></div></div>
                    <span class="hi-score ${h.score>=60?'hi-pass':'hi-fail'}">${h.score}分</span>`;
                list.appendChild(row);
            });
        }
        function getOverallBest(){
            const vals=Object.values(bestScores);
            return vals.length?Math.max(...vals)+'%':'-';
        }

        // ========== GAME ==========
        function startGame(scenario){
            currentScenario=scenario;currentStep=0;safeCount=0;totalCount=0;
            document.getElementById('gtTitle').textContent=scenario.title;
            document.getElementById('chType').textContent=scenario.title+'骗局';
            document.getElementById('chDesc').textContent=scenario.desc;
            document.getElementById('chatArea').innerHTML='';
            document.getElementById('alertBox').innerHTML='';
            document.getElementById('choicesBox').innerHTML='';
            document.getElementById('continueBtn').style.display='none';
            document.getElementById('progressFill').style.width='0%';
            document.getElementById('scoreOverlay').classList.remove('active');
            document.getElementById('gameContainer').classList.add('active');
            renderStep();
        }
        function exitGame(){
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('scoreOverlay').classList.remove('active');
            renderScenarios();
        }
        function retryGame(){
            document.getElementById('scoreOverlay').classList.remove('active');
            startGame(currentScenario);
        }

        function renderStep(){
            if(currentStep>=currentScenario.dialog.length){showScore();return;}
            const step=currentScenario.dialog[currentStep];
            const total=currentScenario.dialog.length;
            document.getElementById('gtRound').textContent=`第 ${currentStep+1}/${total} 轮`;
            document.getElementById('progressFill').style.width=`${(currentStep/total)*100}%`;
            document.getElementById('continueBtn').style.display='none';
            document.getElementById('choicesBox').innerHTML='';

            showTyping(()=>{
                addMsg('scammer',step.scammer);
                setTimeout(()=>{
                    showAlert(step.tip);
                    showChoices(step.choices);
                },400);
            });
        }

        function showTyping(cb){
            const t=document.getElementById('typing');
            document.getElementById('choicesBox').innerHTML='';
            document.getElementById('continueBtn').style.display='none';
            t.classList.add('show');
            setTimeout(()=>{t.classList.remove('show');cb()},1200);
        }
        function addMsg(type,text){
            const area=document.getElementById('chatArea');
            const d=document.createElement('div');
            d.className='msg '+type;
            const avatar=type==='scammer'?'&#128083;':'&#128100;';
            const label=type==='scammer'?'陌生人':'你';
            d.innerHTML=`<div class="msg-avatar">${avatar}</div><div><div class="msg-bubble">${text}</div><div class="msg-label">${label}</div></div>`;
            area.appendChild(d);
            area.scrollTop=area.scrollHeight;
        }
        function showAlert(tip){
            const box=document.getElementById('alertBox');
            box.innerHTML=`<div class="alert ${tip.type}"><h4>${tip.type==='danger'?'&#9888;':'&#128269;'} ${tip.title}</h4><p>${tip.text}</p></div>`;
        }
        function showChoices(choices){
            const box=document.getElementById('choicesBox');
            box.innerHTML='';
            choices.forEach(c=>{
                const btn=document.createElement('button');
                btn.className='choice-btn';
                btn.textContent=c.text;
                btn.addEventListener('click',()=>makeChoice(c));
                box.appendChild(btn);
            });
        }
        function makeChoice(choice){
            totalCount++;if(choice.safe)safeCount++;
            addMsg('user',choice.text);
            document.querySelectorAll('.choice-btn').forEach(b=>b.style.pointerEvents='none');
            const btns=document.querySelectorAll('.choice-btn');
            btns.forEach(b=>{if(b.textContent===choice.text){b.classList.add(choice.safe?'selected-safe':'selected-danger')}});

            showTyping(()=>{
                addMsg('scammer',choice.response);
                const isLast=currentStep===currentScenario.dialog.length-1;
                if(isLast){
                    setTimeout(()=>{
                        if(choice.safe){
                            showAlert({type:'success',title:'&#10003; 做得好！',text:'你成功识破了骗局！保持警惕，任何要求转账的电话都是诈骗。'});
                        }else{
                            showAlert({type:'danger',title:'&#9888; 你被骗了！',text:'如果这是真实的电话，你的钱已经没了。记住：任何要你先给钱再拿好处的人都是骗子。'});
                        }
                        document.getElementById('continueBtn').textContent='查看结果';
                        document.getElementById('continueBtn').style.display='block';
                    },400);
                }else{
                    document.getElementById('continueBtn').textContent='下一轮对话';
                    document.getElementById('continueBtn').style.display='block';
                }
            });
        }
        function nextStep(){
            document.getElementById('alertBox').innerHTML='';
            document.getElementById('choicesBox').innerHTML='';
            document.getElementById('continueBtn').style.display='none';
            currentStep++;
            renderStep();
        }

        function showScore(){
            document.getElementById('progressFill').style.width='100%';
            const pct=totalCount>0?Math.round((safeCount/totalCount)*100):0;
            document.getElementById('scoreNum').textContent=pct;
            const badge=document.getElementById('badgeEarned');
            badge.style.display=pct>=60?'block':'none';
            const detail=document.getElementById('scoreDetail');
            detail.innerHTML=`
                <div class="score-row"><span class="sr-label">对话轮次</span><span class="sr-value sr-pass">${currentScenario.dialog.length} 轮</span></div>
                <div class="score-row"><span class="sr-label">正确应对</span><span class="sr-value sr-pass">${safeCount} / ${totalCount}</span></div>
                <div class="score-row"><span class="sr-label">是否通关</span><span class="sr-value ${pct>=60?'sr-pass':'sr-fail'}">${pct>=60?'通关成功':'未通过'}</span></div>`;

            if(pct>=60) clearedSet.add(currentScenario.id);
            const prevBest=bestScores[currentScenario.id]||0;
            if(pct>prevBest) bestScores[currentScenario.id]=pct;
            totalPlays++;

            const now=new Date();
            const timeStr=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            history.unshift({id:currentScenario.id,score:pct,time:timeStr});
            if(history.length>50) history.length=50;

            localStorage.setItem('af_cleared',JSON.stringify([...clearedSet]));
            localStorage.setItem('af_best',JSON.stringify(bestScores));
            localStorage.setItem('af_history',JSON.stringify(history));
            localStorage.setItem('af_plays',String(totalPlays));

            document.getElementById('scoreOverlay').classList.add('active');
        }

        function updateBadge(){
            const n=clearedSet.size;
            const badge=document.getElementById('topBadge');
            if(n>0){badge.style.display='flex';document.getElementById('topBadgeNum').textContent=n;}
            else badge.style.display='none';
        }

        // Start
        init();
    </script>
</body>
</html>
