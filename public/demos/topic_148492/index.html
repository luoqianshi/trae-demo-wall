<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>归宗 — 推开这扇门</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#8B6C42;--wood-dk:#5C4428;--wood-lt:#A8895E;
  --brick:#C45C3E;--brick-dk:#9E4030;
  --paper:#F5F0E8;--paper-dk:#E8DFD0;
  --jade:#7BA68C;--jade-dk:#5A8A6A;
  --gold:#D4A843;--gold-dk:#B08830;
  --ink:#2C2416;--ink-md:#4A3728;--ink-lt:#6B5744;
  --skin:#E8C8A0;--skin-dk:#D4B080;
  --red:#C44040;--red-lt:#E87070;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1612;font-family:'Noto Sans SC',sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:960px;height:640px;background:var(--paper);overflow:hidden;border:4px solid var(--ink-md);box-shadow:8px 8px 0 rgba(0,0,0,0.4);image-rendering:pixelated;image-rendering:crisp-edges}
@media(max-width:1000px){#game{width:100vw;height:auto;aspect-ratio:960/640;border-width:2px}}

#game::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 5px,rgba(0,0,0,0.012) 5px,rgba(0,0,0,0.012) 6px),repeating-linear-gradient(90deg,transparent,transparent 5px,rgba(0,0,0,0.012) 5px,rgba(0,0,0,0.012) 6px);pointer-events:none;z-index:999}

/* ===== 标题屏 ===== */
#title-screen{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#3A2E20 0%,#4A3C2A 40%,#5C4E3A 100%);cursor:pointer;transition:opacity 0.8s ease}
#title-screen.hidden{opacity:0;pointer-events:none}
.title-plaque{background:var(--wood);border:6px solid var(--wood-dk);padding:28px 56px;margin-bottom:32px;box-shadow:6px 6px 0 rgba(0,0,0,0.3),inset 2px 2px 0 var(--wood-lt);transform:rotate(-1deg)}
.title-plaque h1{font-family:'Ma Shan Zheng',cursive;font-size:2.8rem;color:var(--gold);letter-spacing:0.15em;text-shadow:2px 2px 0 var(--wood-dk)}
.title-plaque p{font-family:'Ma Shan Zheng',cursive;font-size:1rem;color:var(--paper-dk);text-align:center;margin-top:8px;letter-spacing:0.1em}
.title-hint{font-family:'Noto Sans SC',sans-serif;font-size:0.85rem;color:var(--paper-dk);opacity:0.6;animation:pulse 2s ease-in-out infinite}
.title-sub{font-family:'Noto Sans SC',sans-serif;font-size:0.72rem;color:var(--paper-dk);opacity:0.35;margin-top:24px;letter-spacing:0.08em}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}
.title-decor{position:absolute;bottom:50px;display:flex;gap:8px;opacity:0.3}
.title-decor span{display:block;width:6px;height:6px;background:var(--gold)}

/* ===== 场景 ===== */
#scene{position:absolute;inset:0;background:linear-gradient(180deg,#E8DFD0 0%,#DDD4C2 50%,#C8BCA8 100%)}
.beam{position:absolute;top:0;left:0;right:0;height:48px;background:var(--wood);border-bottom:6px solid var(--wood-dk);z-index:2}
.beam::after{content:'';position:absolute;top:6px;left:24px;right:24px;height:4px;background:var(--wood-dk);opacity:0.3}

/* 匾额 */
.plaque{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--wood-dk);border:4px solid var(--ink-md);padding:8px 32px;z-index:3;box-shadow:4px 4px 0 rgba(0,0,0,0.2)}
.plaque span{font-family:'Ma Shan Zheng',cursive;font-size:1.3rem;color:var(--gold);letter-spacing:0.2em;white-space:nowrap}

/* 对联 */
.scroll-l,.scroll-r{position:absolute;top:58px;width:36px;z-index:3;border:3px solid var(--wood);background:var(--paper)}
.scroll-l{left:60px}.scroll-r{right:60px}
.scroll-l span,.scroll-r span{writing-mode:vertical-rl;font-family:'Ma Shan Zheng',cursive;font-size:0.85rem;color:var(--ink-md);letter-spacing:0.3em;padding:12px 4px;display:block}

/* 窗户 - 带中式窗棂 */
.window{position:absolute;top:70px;width:80px;height:100px;z-index:2;background:linear-gradient(180deg,#A8D8E8,#C8E8D0);border:6px solid var(--wood);box-shadow:4px 4px 0 rgba(0,0,0,0.15)}
.window::before{content:'';position:absolute;top:50%;left:0;right:0;height:6px;background:var(--wood);transform:translateY(-50%)}
.window::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;background:var(--wood);transform:translateX(-50%)}
/* 窗棂装饰 */
.window-lattice{position:absolute;top:70px;width:80px;height:100px;z-index:3;pointer-events:none}
.wl-h{position:absolute;left:0;right:0;height:3px;background:var(--wood);opacity:0.5}
.wl-v{position:absolute;top:0;bottom:0;width:3px;background:var(--wood);opacity:0.5}
.win-light{position:absolute;top:70px;width:100px;height:120px;background:radial-gradient(ellipse,rgba(255,240,180,0.12),transparent 70%);pointer-events:none;z-index:1}

/* 地板 */
.floor{position:absolute;bottom:0;left:0;right:0;height:240px;background:repeating-linear-gradient(90deg,var(--wood-lt) 0px,var(--wood-lt) 120px,var(--wood) 120px,var(--wood) 122px,var(--wood-dk) 122px,var(--wood-dk) 124px);border-top:4px solid var(--wood-dk)}
.floor::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(0,0,0,0.04) 30px,rgba(0,0,0,0.04) 32px)}

/* 太师椅 */
.chair{position:absolute;bottom:196px;z-index:4}
.chair-back{width:40px;height:48px;background:var(--wood-dk);border:3px solid var(--ink-md)}
.chair-seat{width:44px;height:10px;background:var(--wood);border:3px solid var(--wood-dk);margin-left:-2px}
.chair-legs{display:flex;gap:24px;margin-left:2px}
.chair-legs div{width:6px;height:20px;background:var(--wood-dk)}

/* 桌子 */
.table{position:absolute;bottom:186px;left:50%;transform:translateX(-50%);width:180px;height:48px;z-index:4}
.table-top{width:100%;height:16px;background:var(--wood);border:3px solid var(--wood-dk);box-shadow:4px 4px 0 rgba(0,0,0,0.15)}
.table-legs{display:flex;justify-content:space-between;padding:0 16px}
.table-legs div{width:12px;height:32px;background:var(--wood-dk)}

/* 茶壶 - 精细化 */
.teapot{position:absolute;bottom:220px;left:50%;transform:translateX(-50%);z-index:5;width:36px;height:26px;background:var(--jade);border:3px solid var(--ink-md)}
.teapot::before{content:'';position:absolute;top:-10px;left:6px;width:14px;height:10px;background:var(--jade);border:3px solid var(--ink-md);border-bottom:none;border-radius:2px 2px 0 0}
.teapot::after{content:'';position:absolute;right:-14px;top:6px;width:14px;height:5px;background:var(--jade);border:2px solid var(--ink-md)}
.teapot-lid{position:absolute;bottom:246px;left:50%;transform:translateX(-50%);width:10px;height:6px;background:var(--jade-dk);border:2px solid var(--ink-md);z-index:6;border-radius:2px 2px 0 0}
.teapot-lid::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:var(--gold-dk);border:2px solid var(--ink-md);border-radius:50%}

/* 热气 */
.steam{position:absolute;bottom:254px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}
.steam i{display:block;width:4px;height:12px;background:rgba(255,255,255,0.25);position:absolute;animation:steamRise 2.5s ease-in-out infinite}
.steam i:nth-child(1){left:-4px;animation-delay:0s}
.steam i:nth-child(2){left:2px;animation-delay:0.8s}
.steam i:nth-child(3){left:8px;animation-delay:1.6s}
@keyframes steamRise{0%{opacity:0;transform:translateY(0) scaleX(1)}40%{opacity:0.4}100%{opacity:0;transform:translateY(-24px) scaleX(2)}}

/* 茶杯 */
.teacup{position:absolute;bottom:200px;z-index:5;width:14px;height:12px;background:var(--paper);border:2px solid var(--ink-md)}
.teacup::after{content:'';position:absolute;right:-6px;top:2px;width:6px;height:6px;border:2px solid var(--ink-md);border-left:none;border-radius:0 3px 3px 0}

/* 花盆 - 修复 */
.plant{position:absolute;bottom:186px;z-index:4}
.plant-pot{width:32px;height:24px;background:var(--brick);border:3px solid var(--brick-dk);clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 2px) 100%,2px 100%)}
.plant-pot::after{content:'';position:absolute;bottom:-4px;left:4px;right:4px;height:4px;background:var(--brick-dk)}
.plant-stem{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:4px;height:16px;background:var(--jade-dk)}
.plant-leaf-l{position:absolute;bottom:34px;left:calc(50% - 12px);width:12px;height:10px;background:var(--jade);border:2px solid var(--jade-dk);border-radius:0 50% 50% 50%;transform:rotate(-30deg)}
.plant-leaf-r{position:absolute;bottom:36px;left:calc(50% + 2px);width:10px;height:8px;background:var(--jade);border:2px solid var(--jade-dk);border-radius:50% 50% 50% 0;transform:rotate(20deg)}

/* 灯笼 */
.lantern{position:absolute;top:56px;z-index:3}
.lantern-body{width:28px;height:36px;background:var(--red);border:3px solid var(--red-lt);border-radius:40%;box-shadow:0 0 12px rgba(200,60,60,0.3);animation:lanternSway 4s ease-in-out infinite}
.lantern-string{width:2px;height:16px;background:var(--ink-md);margin:0 auto}
.lantern-tassel{width:4px;height:14px;background:var(--gold);margin:2px auto 0;animation:lanternSway 4s ease-in-out infinite reverse}
@keyframes lanternSway{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}

/* 画卷 */
.scroll-painting{position:absolute;top:72px;z-index:3;width:52px;height:80px;border:4px solid var(--wood);background:var(--paper-dk);box-shadow:2px 2px 0 rgba(0,0,0,0.1)}
.scroll-painting::before{content:'';position:absolute;top:0;left:-8px;width:8px;height:80px;background:var(--wood-dk);border-radius:4px 0 0 4px}
.scroll-painting::after{content:'';position:absolute;top:0;right:-8px;width:8px;height:80px;background:var(--wood-dk);border-radius:0 4px 4px 0}
.scroll-painting-inner{position:absolute;inset:6px 10px;background:linear-gradient(180deg,#A8C8D0 0%,#C0D8B0 50%,#E0D8C0 100%);opacity:0.5}
.scroll-mountain{position:absolute;bottom:8px;left:10px;right:10px;height:20px;pointer-events:none}
.scroll-mountain::before{content:'';position:absolute;bottom:0;left:0;width:0;height:0;border-left:12px solid transparent;border-right:8px solid transparent;border-bottom:18px solid rgba(100,120,100,0.3)}
.scroll-mountain::after{content:'';position:absolute;bottom:0;right:0;width:0;height:0;border-left:10px solid transparent;border-right:14px solid transparent;border-bottom:16px solid rgba(100,120,100,0.2)}

/* 祖先牌位 */
.ancestral-shrine{position:absolute;bottom:186px;left:50%;transform:translateX(-50%);z-index:3;opacity:0;pointer-events:none}
.ancestral-shrine.visible{opacity:1;transition:opacity 1s;pointer-events:auto}
.shrine-base{width:60px;height:36px;background:var(--wood-dk);border:3px solid var(--ink-md);position:relative}
.shrine-inscription{font-family:'Ma Shan Zheng',cursive;font-size:0.65rem;color:var(--gold);text-align:center;padding:4px;line-height:1.4;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}

/* 场景物件提示 */
.scene-tooltip{position:absolute;z-index:55;background:var(--paper);border:3px solid var(--ink-md);padding:6px 12px;font-size:0.75rem;color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,0.15);pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;font-family:'Ma Shan Zheng',cursive}
.scene-tooltip.visible{opacity:1}

/* ===== 角色系统 ===== */
.character{position:absolute;z-index:10;transition:left 1.2s ease-in-out;cursor:default}
.character.idle{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.px-head{width:36px;height:36px;border:3px solid var(--ink);position:relative;margin:0 auto}
.px-hair{position:absolute;top:0;left:0;right:0;height:14px}
.px-eyes{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.px-eyes div{width:5px;height:5px;background:var(--ink);border-radius:0}
.px-mouth{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:8px;height:3px;border-bottom:2px solid var(--ink)}
.px-blush{position:absolute;top:20px;width:6px;height:4px;background:rgba(200,100,100,0.25);border-radius:0}
.px-blush.l{left:2px}.px-blush.r{right:2px}

.px-body{width:32px;height:40px;margin:-2px auto 0;border:3px solid var(--ink);position:relative}
.px-arms{position:absolute;top:2px;left:-12px;right:-12px;display:flex;justify-content:space-between}
.px-arm{width:10px;height:26px;border:3px solid var(--ink);transition:transform 0.2s}
.px-legs{display:flex;justify-content:center;gap:4px;margin-top:-1px}
.px-leg{width:12px;height:18px;border:3px solid var(--ink)}

.character.walking .px-leg:first-child{animation:legWalk 0.4s ease-in-out infinite}
.character.walking .px-leg:last-child{animation:legWalk 0.4s ease-in-out infinite 0.2s}
@keyframes legWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.character.talking{animation:talkBounce 0.5s ease-in-out infinite}
@keyframes talkBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(1deg)}75%{transform:translateY(-2px) rotate(-1deg)}}

/* 表情：开心 */
.expression-happy .px-mouth{border-bottom:none;border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-right:3px solid var(--ink);width:12px;height:6px;bottom:3px;border-radius:0}
.expression-happy .px-blush{opacity:1}

.char-nameplate{text-align:center;margin-top:4px;font-family:'Ma Shan Zheng',cursive;font-size:0.78rem;color:var(--ink);white-space:nowrap;text-shadow:1px 1px 0 var(--paper),-1px -1px 0 var(--paper),1px -1px 0 var(--paper),-1px 1px 0 var(--paper)}

/* 配件 */
.accessory-glasses{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:22px;height:8px;border:2px solid var(--ink)}
.accessory-apron{position:absolute;top:6px;left:3px;right:3px;bottom:4px;background:rgba(255,255,255,0.3);border-bottom:2px solid var(--ink)}

/* ===== 对话系统 ===== */
#dialog-area{position:absolute;bottom:0;left:0;right:0;height:200px;z-index:50;padding:0 32px 28px;display:flex;flex-direction:column;justify-content:center;pointer-events:none;opacity:0;transition:opacity 0.4s ease}
#dialog-area.active{opacity:1;pointer-events:auto}
.dialog-box{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,0.25);padding:20px 24px;position:relative;max-width:860px;margin:0 auto;width:100%}
.dialog-box::before{content:'';position:absolute;top:-16px;left:80px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:16px solid var(--paper)}
.dialog-box::after{content:'';position:absolute;top:-20px;left:78px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:18px solid var(--ink)}

.dialog-speaker{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dialog-speaker-avatar{width:36px;height:36px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Ma Shan Zheng',cursive;color:white;font-size:0.9rem}
.dialog-speaker-info{display:flex;flex-direction:column;gap:1px}
.dialog-speaker-name{font-family:'Ma Shan Zheng',cursive;font-size:1.05rem;color:var(--ink);font-weight:700}
.dialog-speaker-role{font-size:0.7rem;color:var(--ink-lt)}
.dialog-text{font-size:0.95rem;color:var(--ink);line-height:1.8;min-height:48px}
.dialog-text .cursor{display:inline-block;width:8px;height:14px;background:var(--ink);margin-left:2px;animation:cursorBlink 0.6s step-end infinite}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

.dialog-action{position:absolute;bottom:16px;right:24px;background:var(--ink);color:var(--paper);border:3px solid var(--ink-md);padding:6px 20px;font-family:'ZCOOL QingKe HuangYou',sans-serif;font-size:0.85rem;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,0.2);transition:all 0.15s;display:none}
.dialog-action:hover{background:var(--ink-md);transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,0,0,0.2)}
.dialog-action.visible{display:block}

.dialog-box.narration{background:var(--ink);border-color:var(--gold);text-align:center}
.dialog-box.narration .dialog-text{color:var(--paper);font-style:italic}
.dialog-box.narration::after{border-bottom-color:var(--gold)}
.dialog-box.narration::before{border-bottom-color:var(--ink)}

.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice-btn{background:var(--paper);border:3px solid var(--ink);padding:10px 20px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-size:0.9rem;color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,0.15);transition:all 0.15s;text-align:left}
.choice-btn:hover{background:var(--gold);color:var(--ink);transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,0.15)}

/* 音符 */
.music-note{position:absolute;font-size:14px;color:var(--gold);pointer-events:none;opacity:0;z-index:6;animation:noteFloat 4s ease-in-out forwards}
@keyframes noteFloat{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:0.5}80%{opacity:0.3}100%{opacity:0;transform:translateY(-60px) translateX(20px) rotate(15deg)}}

/* 闪光 */
.flash-overlay{position:absolute;inset:0;background:white;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.1s}
.flash-overlay.active{opacity:1;transition:opacity 0.05s}

/* ===== 闭环：通关屏 ===== */
.end-screen{position:absolute;inset:0;z-index:160;background:linear-gradient(180deg,#3A2E20 0%,#4A3C2A 40%,#5C4E3A 100%);display:none;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}
.end-screen.active{display:flex}
.end-card{background:var(--paper);border:4px solid var(--ink-md);padding:20px 24px;max-width:520px;width:100%;max-height:calc(100vh - 60px);overflow-y:auto;box-shadow:8px 8px 0 rgba(0,0,0,0.3);text-align:center;position:relative}
.end-card h2{font-family:'Ma Shan Zheng',cursive;font-size:1.8rem;color:var(--ink);margin-bottom:4px}
.end-card .end-sub{font-size:0.8rem;color:var(--ink-lt);margin-bottom:20px}
.end-divider{width:80px;height:3px;background:var(--gold);margin:0 auto 20px;border-radius:2px}

/* 家族名片 */
.family-card{background:var(--paper-dk);border:3px solid var(--ink-md);padding:12px;margin:10px 0;text-align:left;position:relative}
.family-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.family-card h3{font-family:'Ma Shan Zheng',cursive;font-size:1rem;color:var(--ink);margin-bottom:6px}
.family-card .fc-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:0.78rem;color:var(--ink)}
.family-card .fc-dot{width:6px;height:6px;border:2px solid;flex-shrink:0}
.family-card .fc-name{font-weight:600;min-width:50px}
.family-card .fc-desc{color:var(--ink-lt);font-size:0.72rem}

/* 关系图谱 */
.tree-map{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0;padding:10px;background:rgba(139,115,85,0.06);border:2px dashed var(--ink-lt)}
.tree-gen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.tree-gen-label{font-family:'Ma Shan Zheng',cursive;font-size:0.68rem;color:var(--gold-dk);writing-mode:vertical-rl;letter-spacing:0.15em}
.tree-node{display:flex;flex-direction:column;align-items:center;gap:1px}
.tree-node-avatar{width:24px;height:24px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Ma Shan Zheng',cursive;color:white;font-size:0.55rem}
.tree-node-name{font-size:0.6rem;color:var(--ink)}
.tree-connector{width:2px;height:10px;background:var(--ink-lt)}

/* 结尾按钮 */
.end-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.end-btn{background:var(--wood);color:var(--paper);border:3px solid var(--wood-dk);padding:8px 24px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-size:0.85rem;box-shadow:3px 3px 0 rgba(0,0,0,0.2);transition:all 0.15s}
.end-btn:hover{background:var(--wood-dk);transform:translate(1px,1px)}
.end-btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold-dk)}

// ===== 启动 =====

  document.getElementById('title-screen').classList.add('hidden');

// ===== 构建角色 =====
function buildCharacter(m){
  const el = document.createElement('div');
  el.className = 'character'; el.id = 'char-'+m.id;
  el.style.left = '-80px'; el.style.bottom = '200px';
  if(m.id==='chen-dehou') el.style.bottom = '210px';

  const isFemale = m.id==='wang-xiufang'||m.id==='chen-shuhua'||m.id==='chen-meiling';
  const hairStyle = isFemale ?
    `border-radius:0 0 50% 50%;height:16px;top:0;left:0;right:0;background:${m.hairColor}` :
    `border-radius:0;height:14px;top:0;left:0;right:0;background:${m.hairColor}`;

  let accHTML = '';
  if(m.accessories.includes('glasses')) accHTML+='<div class="accessory-glasses"></div>';
  if(m.accessories.includes('apron')) accHTML+='<div class="accessory-apron"></div>';
  const blushHTML = m.expression==='happy' ? '<div class="px-blush l"></div><div class="px-blush r"></div>' : '';

  el.innerHTML = `
    <div style="position:relative">
      <div class="px-head" style="background:${m.skinColor}">
        <div class="px-hair" style="${hairStyle}"></div>
        <div class="px-eyes"><div></div><div></div></div>
        <div class="px-mouth"></div>
        ${blushHTML}${accHTML}
      </div>
      <div class="px-body" style="background:${m.color}">
        <div class="px-arms"><div class="px-arm" style="background:${m.color}"></div><div class="px-arm" style="background:${m.color}"></div></div>
        <div class="px-legs"><div class="px-leg" style="background:${m.color}"></div><div class="px-leg" style="background:${m.color}"></div></div>
      </div>
    </div>
    <div class="char-nameplate">${m.title}</div>`;
  return el;
}

// ===== 初始化 =====
function init(){
  const c = document.getElementById('characters');
  CLAN.members.forEach(m=>{
    if(m.id==='chen-siyuan') return;
    const el = buildCharacter(m);
    el.style.display = m.id==='chen-dehou'?'none':'none';
    c.appendChild(el);
    charElements[m.id] = el;
  });
  const dots = document.getElementById('progress-dots');
  for(let i=0;i<10;i++){
    const d = document.createElement('div'); d.className='progress-dot'; dots.appendChild(d);
  }
  setupSceneTooltips();
}

// ===== 场景物件hover提示 =====
function setupSceneTooltips(){
  const tooltip = document.getElementById('scene-tooltip');
  SCENE_OBJECTS.forEach(obj=>{
    const target = document.querySelector(obj.el);
    if(!target) return;
    target.style.cursor = 'pointer';
    target.addEventListener('mouseenter',e=>{
      const rect = target.getBoundingClientRect();
      const gameRect = document.getElementById('game').getBoundingClientRect();
      tooltip.textContent = obj.text;
      tooltip.style.left = (rect.left - gameRect.left + rect.width/2) + 'px';
      tooltip.style.top = (rect.top - gameRect.top - 32) + 'px';
      tooltip.style.transform = 'translateX(-50%)';
      tooltip.classList.add('visible');
    });
    target.addEventListener('mouseleave',()=>{ tooltip.classList.remove('visible'); });
  });
}

// ===== 剧情引擎 =====
function findLabel(label){
  for(let i=0;i<SCRIPT.length;i++){if(SCRIPT[i].id===label)return i;}
  return -1;
}
function gotoLabel(label){
  const idx = typeof label==='number'?label:findLabel(label);
  if(idx>=0){step=idx;runStep();}
  else{console.error('Label not found:',label);step++;runStep();}
}
function runStep(){
  if(step >= SCRIPT.length) return;
  const s = SCRIPT[step];
  switch(s.type){
    case 'narration': runNarration(s); break;
    case 'enter': runEnter(s); break;
    case 'dialogue': runDialogue(s); break;
    case 'choice': runChoice(s); break;
    case 'goto': gotoLabel(s.goto); return; // goto自行控制step，不走step++
    case 'if_not_seen': gotoLabel(seenChars.has(s.charId)?s.else:s.then); return;
    case 'show_shrine': document.getElementById('ancestral-shrine').classList.add('visible'); step++; runStep(); break;
    case 'photo': runPhoto(); break;
    case 'ending': runEnding(s); break;
    default: step++; runStep(); break; // 标签节点（id only）自动跳过
  }
  updateProgress();
}

// ===== 旁白 =====
function runNarration(s){
  const area=document.getElementById('dialog-area'),box=document.getElementById('dialog-box'),
        speaker=document.getElementById('dialog-speaker'),text=document.getElementById('dialog-text'),
        action=document.getElementById('dialog-action'),choices=document.getElementById('dialog-choices');
  area.classList.add('active'); box.classList.add('narration'); speaker.style.display='none';
  choices.innerHTML=''; action.classList.remove('visible');
  typeText(s.text,()=>{
    action.classList.add('visible'); action.textContent='▶ 继续';
    action.onclick=()=>{completedInteractions++;step++;runStep();};
  });
}

// ===== 角色入场 =====
function runEnter(s){
  const el = charElements[s.charId];
  if(!el){step++;runStep();return;}
  el.classList.add('walking'); el.classList.remove('idle','talking','expression-happy');
  el.style.left = (s.from==='left'?'-80px':'1040px');
  el.style.bottom = s.charId==='chen-dehou'?'210px':'200px';
  el.style.display='block';
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{el.style.left=(s.targetX||380)+'px';});});
  setTimeout(()=>{el.classList.remove('walking');el.classList.add('idle');step++;runStep();},1300);
}

// ===== 对话 =====
function runDialogue(s){
  const m = CLAN.members.find(c=>c.id===s.charId);
  if(!m){step++;runStep();return;}
  seenChars.add(s.charId);
  const el = charElements[s.charId];
  el.classList.remove('idle'); el.classList.add('talking');
  if(m.expression==='happy') el.classList.add('expression-happy');

  const area=document.getElementById('dialog-area'),box=document.getElementById('dialog-box'),
        speaker=document.getElementById('dialog-speaker'),text=document.getElementById('dialog-text'),
        action=document.getElementById('dialog-action'),choices=document.getElementById('dialog-choices');
  area.classList.add('active'); box.classList.remove('narration'); choices.innerHTML=''; action.classList.remove('visible');
  speaker.style.display='flex';
  speaker.innerHTML=`<div class="dialog-speaker-avatar" style="background:${m.color}">${m.title.charAt(0)}</div><div class="dialog-speaker-info"><div class="dialog-speaker-name">${m.title} · ${m.name}</div><div class="dialog-speaker-role">${m.snippet}</div></div>`;
  const fullDialogue = s.lines.map(i=>m.dialogue[i]).join('\n');
  typeText(fullDialogue,()=>{
    action.classList.add('visible'); action.textContent='▶ 继续';
    action.onclick=()=>{completedInteractions++;el.classList.remove('talking','expression-happy');el.classList.add('idle');step++;runStep();};
  });
}

// ===== 选择 =====
function runChoice(s){
  const box=document.getElementById('dialog-box'),speaker=document.getElementById('dialog-speaker'),
        text=document.getElementById('dialog-text'),action=document.getElementById('dialog-action'),
        choices=document.getElementById('dialog-choices');
  box.classList.remove('narration'); speaker.style.display='none'; action.classList.remove('visible'); choices.innerHTML='';
  text.innerHTML = s.prompt;
  s.options.forEach(opt=>{
    const btn = document.createElement('button'); btn.className='choice-btn'; btn.textContent='▸ '+opt.text;
    btn.onclick=()=>{completedInteractions++;choices.innerHTML='';gotoLabel(opt.goto||opt.next);}; choices.appendChild(btn);
  });
}

// ===== 打字机 =====
function typeText(text,onComplete){
  const el=document.getElementById('dialog-text');
  typing=true; charIndex=0; fullText=text; pendingCallback=onComplete;
  clearInterval(typingTimer); el.innerHTML='<span class="cursor"></span>';
  typingTimer=setInterval(()=>{
    if(charIndex>=fullText.length){clearInterval(typingTimer);typing=false;el.textContent=fullText;if(onComplete)onComplete();return;}
    charIndex++;el.innerHTML=fullText.substring(0,charIndex).replace(/\n/g,'<br>')+'<span class="cursor"></span>';
  },35);
}

function advanceDialog(){
  if(typing){clearInterval(typingTimer);typing=false;document.getElementById('dialog-text').innerHTML=fullText.replace(/\n/g,'<br>');if(pendingCallback)pendingCallback();}
}

// ===== Tab切换 =====
function switchTab(tabName){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`button[onclick="switchTab('${tabName}')"]`).classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

// ===== 像素画生成 =====
function generatePixelArt(scene){
  const colors = {
    family: ['#8B6C42','#D4A843','#4A8A8A','#E8C8A0','#6B4423','#3A2E20'],
    dinner: ['#8B4513','#D4A843','#4A6C8A','#E0BC90','#8B6C42','#3A2E20'],
    ancestor: ['#4A3C2A','#D4A843','#8B6C42','#E8C8A0','#2A2015','#3A2E20'],
    tea: ['#8B6C42','#D4A843','#4A8A8A','#E8C8A0','#6B8E5A','#3A2E20']
  };
  const palette = colors[scene] || colors.family;
  let html = '<div class="pixel-art">';
  const pixels = 12 * 8;
  for(let i=0;i<pixels;i++){
    const color = palette[Math.floor(Math.random()*palette.length)];
    const opacity = Math.random() > 0.3 ? 1 : 0.3;
    html += `<div class="pixel" style="background:${color};opacity:${opacity}"></div>`;
  }
  html += '</div>';
  return html;
}

// ===== 删除成员 =====
function deleteMember(id){
  if(confirm('确定要删除这位家族成员吗？')){
    const idx = CLAN.members.findIndex(c=>c.id===id);
    if(idx>-1){
      CLAN.members.splice(idx,1);
      seenChars.delete(id);
      runEnding({style:lastEndingStyle});
    }
  }
}

// ===== 聊天功能 =====
const chatReplies = {
  '爷爷':['好！好！','孩子们都回来了。','记得常回来看看。','好好好！'],
  '奶奶':['回来就好！','饭马上就好。','给你留着炸酱面呢。','快坐下歇歇。'],
  '二叔':['哈哈，年轻人有想法！','说得好！','有道理。','不错不错。'],
  '姑姑':['哎呀，真懂事！','长大了啊。','真让人高兴。','好孩子。'],
  '堂哥':['哈哈，说得对！','有意思！','可以啊！','够意思！'],
  '堂姐':['哇，真棒！','太好啦！','真不错！','好厉害！']
};

function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;

  window.familyMessages.push({
    author:'你',
    text:text,
    time:'刚刚',
    me:true
  });
  input.value='';
  runEnding({style:lastEndingStyle});

  setTimeout(()=>{
    const authors = Object.keys(chatReplies);
    const randomAuthor = authors[Math.floor(Math.random()*authors.length)];
    const replies = chatReplies[randomAuthor];
    const randomReply = replies[Math.floor(Math.random()*replies.length)];
    
    window.familyMessages.push({
      author:randomAuthor,
      text:randomReply,
      time:'刚刚',
      me:false
    });
    runEnding({style:lastEndingStyle});
  },1500 + Math.random() * 1000);
}

// ===== 添加新成员 =====
function addNewMember(){
  const name = document.getElementById('new-member-name').value.trim();
  const title = document.getElementById('new-member-title').value.trim();
  const snippet = document.getElementById('new-member-snippet').value.trim();
  if(!name || !title){
    alert('请填写姓名和称谓');
    return;
  }
  const colors = ['#4A8A8A','#6A8CAA','#8A4A6A','#8A6C8A','#6B8E5A','#4A6C8A'];
  const newMember = {
    id:'new-'+Date.now(),
    name:name,
    title:title,
    gen:3,
    color:colors[Math.floor(Math.random()*colors.length)],
    hairColor:'#333',
    skinColor:'#E8C8A0',
    accessories:[],
    snippet:snippet || '新加入的家族成员',
    dialogue:['你好！很高兴认识大家。']
  };
  CLAN.members.push(newMember);
  seenChars.add(newMember.id);
  document.getElementById('new-member-name').value='';

  document.getElementById('new-member-snippet').value='';
  runEnding({style:lastEndingStyle});
}

// ===== 进度 =====
function updateProgress(){
  const dots=document.querySelectorAll('.progress-dot');
  const progress = Math.min(completedInteractions, dots.length - 1);
  dots.forEach((d,i)=>{d.classList.remove('active','done');if(i<progress)d.classList.add('done');if(i===progress)d.classList.add('active');});
}

// ===== 重新开始 =====
function restartGame(){
  step=0;seenChars.clear();gameEnded=false;completedInteractions=0;
  document.getElementById('dialog-area').classList.remove('active');
  document.getElementById('photo-frame').classList.remove('active');
  document.getElementById('end-screen').classList.remove('active');
  document.getElementById('ancestral-shrine').classList.remove('visible');
  document.getElementById('restart-btn').style.opacity='0.5';
  document.getElementById('progress-dots').innerHTML='';
  CLAN.members.forEach(m=>{if(m.id==='chen-siyuan')return;const el=charElements[m.id];el.classList.remove('walking','talking','idle','expression-happy');el.style.left='-80px';el.style.bottom='200px';el.style.display='none';});
  const dots=document.getElementById('progress-dots');
  for(let i=0;i<10;i++){const d=document.createElement('div');d.className='progress-dot';dots.appendChild(d);}
  const ts=document.getElementById('title-screen');ts.style.display='flex';ts.classList.remove('hidden');
}

  const notes=['♪','♫','♩'];

});

init();
