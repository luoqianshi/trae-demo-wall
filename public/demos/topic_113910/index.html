<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#faf6f1">
  <title>AI私人咖啡甜度师</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 屏幕内容区（由 JS 动态渲染） -->
    <main id="screen"></main>

    <!-- 底部导航 -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-screen="home">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </button>
      <button class="nav-item" data-screen="recommend">
        <span class="nav-icon">🎯</span>
        <span>推荐</span>
      </button>
      <button class="nav-item" data-screen="history">
        <span class="nav-icon">📋</span>
        <span>历史</span>
      </button>
      <button class="nav-item" data-screen="profile">
        <span class="nav-icon">⚙️</span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 脚本（顺序：数据层 → 引擎 → UI → 主控制器） -->
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
