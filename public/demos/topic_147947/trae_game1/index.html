<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图幻 3D · 图片一键裸眼立体转换</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0f1a;
            --panel: #111827;
            --panel-border: #1f2937;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .hero {
            text-align: center;
            max-width: 640px;
        }
        .hero h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; letter-spacing: -1px; }
        .hero p { color: var(--text-muted); font-size: 16px; line-height: 1.7; margin-bottom: 32px; }
        .card-preview {
            width: 280px;
            height: 380px;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            transform: perspective(1000px) rotateY(-15deg) rotateX(5deg);
            animation: float 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        .card-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }
        .card-preview span { font-size: 64px; }
        @keyframes float {
            0%, 100% { transform: perspective(1000px) rotateY(-15deg) rotateX(5deg) translateY(0); }
            50% { transform: perspective(1000px) rotateY(-15deg) rotateX(5deg) translateY(-12px); }
        }
        .btn {
            display: inline-block;
            padding: 16px 36px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.15s, transform 0.15s;
            box-shadow: 0 10px 30px -10px rgba(59,130,246,0.4);
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .features {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 32px;
        }
        .feature {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }
        footer {
            margin-top: 48px;
            font-size: 12px;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="card-preview"><span>🖼️</span></div>
        <h1>图幻 3D</h1>
        <p>上传图片、添加文字，通过摄像头追踪人眼位置，让卡片跟随视线 3D 倾斜。无需上传服务器，全部在本地浏览器运行。</p>
        <a href="./card.html" class="btn">开始制作 3D 卡片</a>
        <div class="features">
            <div class="feature">📷 摄像头眼动追踪</div>
            <div class="feature">🖱️ 鼠标模拟模式</div>
            <div class="feature">💾 PNG 一键导出</div>
            <div class="feature">🔒 纯本地处理</div>
        </div>
    </div>
    <footer>参赛作品 · 纯前端单页工具</footer>
</body>
</html>
