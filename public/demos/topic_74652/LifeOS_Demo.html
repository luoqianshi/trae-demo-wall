<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeOS · 价值驱动的人生管理系统</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#8e8e93; --line:#e5e5ea;
    --blue:#0a84ff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de; --teal:#5ac8fa; --yellow:#ffd60a;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.05);
    --sidebar:#f7f7fa;
  }
  html.dark{
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989f; --line:#38383a;
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#64d2ff; --yellow:#ffd60a;
    --sidebar:#161617;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--sub);border-radius:8px;opacity:.4}
  a{color:var(--blue);text-decoration:none}

  /* layout */
  .app{display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;transition:transform .3s}
  .logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(10,132,255,.35)}
  .logo-name{font-weight:700;font-size:17px}
  .logo-name small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
  .nav{padding:6px 10px}
  .nav-group{font-size:11px;color:var(--sub);padding:14px 12px 6px;letter-spacing:.5px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text);transition:background .15s}
  .nav-item:hover{background:var(--line)}
  .nav-item.active{background:var(--blue);color:#fff}
  .nav-item .ico{font-size:17px;width:20px;text-align:center}
  .nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
  .nav-item.active .badge{background:rgba(255,255,255,.3)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(12px);display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line)}
  .topbar h1{font-size:20px;font-weight:700}
  .topbar .sub{color:var(--sub);font-size:13px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--blue)}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .15s}
  .icon-btn:hover{transform:scale(1.06)}
  .content{padding:24px 26px 60px;max-width:1180px;width:100%;margin:0 auto}

  /* components */
  .grid{display:grid;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .card-h .ico{font-size:17px}
  .card-h .act{margin-left:auto}
  .card-b{padding:18px}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{flex:1;min-width:280px}

  .metric{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);color:#fff;box-shadow:var(--shadow)}
  .metric .mi{font-size:26px}
  .metric .mv{font-size:24px;font-weight:800;line-height:1.1}
  .metric .ml{font-size:12px;opacity:.9}
  .m1{background:linear-gradient(135deg,#0a84ff,#5ac8fa)}
  .m2{background:linear-gradient(135deg,#ff9500,#ff5e3a)}
  .m3{background:linear-gradient(135deg,#34c759,#30d158)}
  .m4{background:linear-gradient(135deg,#af52de,#bf5af2)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.blue{background:rgba(10,132,255,.14);color:var(--blue)}
  .pill.green{background:rgba(52,199,89,.16);color:var(--green)}
  .pill.orange{background:rgba(255,149,0,.16);color:var(--orange)}
  .pill.red{background:rgba(255,59,48,.16);color:var(--red)}
  .pill.gray{background:var(--line);color:var(--sub)}
  .pill.purple{background:rgba(175,82,222,.16);color:var(--purple)}

  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .15s;background:var(--blue);color:#fff}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
  .btn.sm{padding:5px 12px;font-size:12px}
  .btn.gray{background:var(--line);color:var(--text)}

  input,textarea,select{font-family:inherit;font-size:14px}
  .field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none}
  .field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}

  /* tasks */
  .task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid transparent;transition:all .15s;cursor:pointer}
  .task:hover{border-color:var(--line)}
  .task.rec{border-color:var(--blue);background:rgba(10,132,255,.06)}
  .task.done{opacity:.5}
  .task.done .tt{text-decoration:line-through}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
  .check.on{background:var(--green);border-color:var(--green);color:#fff}
  .check.on:after{content:"✓";font-size:13px;font-weight:800}
  .task .tt{font-size:14px;font-weight:600}
  .task .tm{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}

  /* energy */
  .energy-wrap{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(10,132,255,.08),rgba(175,82,222,.08));border:1px solid var(--line)}
  .energy-dots{display:flex;gap:7px}
  .edot{width:18px;height:18px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .15s}
  .edot.on{background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.2)}
  .edot.low{background:var(--orange)}
  .energy-label{font-weight:700;font-size:15px}
  .energy-hint{font-size:12px;color:var(--sub)}

  /* areas */
  .area-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
  .area-bar{height:5px}
  .area-body{padding:14px}
  .area-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .area-ic{font-size:22px}
  .area-name{font-weight:700;font-size:15px}
  .area-stat{font-size:12px;color:var(--sub)}
  .area-ge{font-size:12px;color:var(--text);opacity:.8;margin-top:6px;line-height:1.5}

  /* habits */
  .habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--bg);margin-bottom:8px}
  .habit .h-ic{font-size:20px}
  .habit .h-name{font-weight:600;font-size:14px;flex:1}
  .habit .mv-tag{font-size:10px;color:var(--orange);border:1px solid var(--orange);padding:1px 6px;border-radius:8px}
  .streak{display:flex;gap:3px}
  .sc{width:13px;height:13px;border-radius:4px;background:var(--line)}
  .sc.on{background:var(--green)}
  .check-mini{width:26px;height:26px;border-radius:8px;border:2px solid var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
  .check-mini.on{background:var(--green);border-color:var(--green)}

  /* notes */
  .note-tab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .note{padding:14px;border-radius:12px;background:var(--bg);border-left:3px solid var(--blue);margin-bottom:10px}
  .note.insight{border-left-color:var(--purple)}
  .note.source{border-left-color:var(--orange)}
  .note.reference{border-left-color:var(--teal)}
  .note .nt{font-weight:700;font-size:14px;margin-bottom:4px}
  .note .nc{font-size:13px;color:var(--sub)}
  .note .nf{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

  /* finance */
  .stat-big{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .stat-cap{font-size:12px;color:var(--sub)}
  .progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:8px;transition:width .6s}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .bar-row .lbl{width:84px;color:var(--sub);flex-shrink:0}
  .bar-track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar-track > i{display:block;height:100%;border-radius:6px}
  .bar-row .amt{width:90px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}

  /* chat */
  .chat-box{display:flex;flex-direction:column;height:520px}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
  .msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
  .msg.sys{align-self:center;background:transparent;color:var(--sub);font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:6px 12px}
  .msg.bot .tool{display:inline-block;font-size:11px;background:rgba(175,82,222,.14);color:var(--purple);padding:2px 8px;border-radius:8px;margin:4px 6px 0 0;font-weight:600}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .chat-input .field{flex:1}
  .quick-q{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 10px}
  .quick-q button{font-size:12px;padding:6px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--blue);cursor:pointer;font-weight:600}
  .quick-q button:hover{background:rgba(10,132,255,.08)}
  .typing{display:inline-flex;gap:3px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* values */
  .value-doc{background:linear-gradient(135deg,rgba(175,82,222,.08),rgba(10,132,255,.08));border:1px solid var(--line);border-radius:14px;padding:20px}
  .value-doc h3{font-size:15px;margin-bottom:10px;color:var(--purple)}
  .value-list{list-style:none}
  .value-list li{padding:6px 0;font-size:14px;display:flex;gap:8px}
  .value-list li b{color:var(--purple)}

  /* review */
  .review-item{padding:14px;border-radius:12px;background:var(--bg);margin-bottom:10px;border-left:3px solid var(--green)}
  .review-item.weekly{border-left-color:var(--blue)}
  .review-item.monthly{border-left-color:var(--purple)}
  .review-item .rt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .review-item .rp{font-size:12px;color:var(--sub)}
  .review-item .rc{font-size:13px;color:var(--text);opacity:.85}

  .empty{text-align:center;padding:30px;color:var(--sub);font-size:13px}
  .kbd{background:var(--line);padding:2px 7px;border-radius:6px;font-size:12px;font-family:monospace}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;opacity:0;transition:all .3s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  html.dark .toast{background:#333}

  .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .tag.high{background:rgba(255,59,48,.16);color:var(--red)}
  .tag.medium{background:rgba(255,149,0,.16);color:var(--orange)}
  .tag.low{background:rgba(52,199,89,.16);color:var(--green)}

  .mobile-toggle{display:none}
  @media(max-width:860px){
    .sidebar{position:fixed;z-index:50;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
    .sidebar.open{transform:translateX(0)}
    .mobile-toggle{display:flex}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .row{gap:14px}
  }
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
  .overlay.show{display:block}
  .section-title{font-size:13px;color:var(--sub);margin:6px 2px 10px;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">L</div>
      <div class="logo-name">LifeOS<small>价值驱动 · 人生管理</small></div>
    </div>
    <nav class="nav">
      <div class="nav-group">日常</div>
      <div class="nav-item active" data-view="today"><span class="ico">⚡</span>今日 <span class="badge" id="navInbox">3</span></div>
      <div class="nav-item" data-view="compass"><span class="ico">🧭</span>指南针</div>
      <div class="nav-item" data-view="projects"><span class="ico">🗂️</span>项目</div>
      <div class="nav-item" data-view="notes"><span class="ico">🧠</span>知识库</div>
      <div class="nav-group">资源</div>
      <div class="nav-item" data-view="finance"><span class="ico">💰</span>财务</div>
      <div class="nav-item" data-view="health"><span class="ico">🏃</span>健康与精力</div>
      <div class="nav-item" data-view="contacts"><span class="ico">👥</span>人际</div>
      <div class="nav-group">反馈</div>
      <div class="nav-item" data-view="reviews"><span class="ico">🔄</span>复盘</div>
      <div class="nav-item" data-view="agent"><span class="ico">🤖</span>AI 助手</div>
    </nav>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleNav(false)"></div>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn mobile-toggle" onclick="toggleNav(true)">☰</button>
      <div>
        <h1 id="viewTitle">今日</h1>
        <div class="sub" id="viewSub">系统的作用是放大清晰度，而不是制造忙碌感</div>
      </div>
      <div class="right">
        <div class="clock" id="clock">--:--</div>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== State ===================== */
const STORE_KEY='lifeos_demo_v1';
let state=load();
function load(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||null}catch(e){return null}
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
if(!state){
  state={
    energy:3,
    inbox:[
      {id:1,content:'研究一下 APScheduler 的 Cron 触发器时区问题',ts:Date.now()-3600000},
      {id:2,content:'周末整理 6 月财务快照',ts:Date.now()-7200000},
      {id:3,content:'给爸妈打电话',ts:Date.now()-10000000},
    ],
    tasks:[
      {id:1,title:'完成 LifeOS 复盘模块的前端联调',type:'action',context:'deep_work',energy:'high',priority:'high',date:today(),done:false,note:'today 视图聚合接口已通'},
      {id:2,title:'写本周复盘：检视各领域状态',type:'action',context:'deep_work',energy:'high',priority:'medium',date:today(),done:false,note:''},
      {id:3,title:'回复设计同学关于深色模式的反馈',type:'action',context:'quick',energy:'low',priority:'medium',date:today(),done:false,note:''},
      {id:4,title:'买维生素 D',type:'action',context:'errand',energy:'low',priority:'low',date:today(),done:false,note:''},
      {id:5,title:'等待导师回复关于 FIRE 目标的建议',type:'waiting',energy:'medium',priority:'medium',date:today(),done:false,waitingFor:'导师 张老师'},
      {id:6,title:'学习 Rust ownership 模型',type:'someday',energy:'high',priority:'low',date:null,done:false,note:''},
    ],
    habits:[
      {id:1,ic:'📚',name:'每日阅读 30 分钟',mv:true,log:[1,1,1,0,1,1,0]},
      {id:2,ic:'🏃',name:'跑步 3 公里',mv:false,log:[1,0,1,1,1,0,0]},
      {id:3,ic:'🧘',name:'冥想 10 分钟',mv:true,log:[1,1,1,1,1,1,0]},
      {id:4,ic:'💧',name:'喝水 8 杯',mv:true,log:[1,1,1,1,0,1,0]},
    ],
    nextId:100
  };
  save();
}
function today(){return new Date().toISOString().slice(0,10)}

/* ===================== Theme ===================== */
function toggleTheme(){
  const d=document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent=d?'☀️':'🌙';
}
if(matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.classList.add('dark');document.getElementById('themeBtn').textContent='☀️'}

/* ===================== Clock ===================== */
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
setInterval(tick,1000);tick();

/* ===================== Nav ===================== */
const TITLES={
  today:['今日','系统的作用是放大清晰度，而不是制造忙碌感'],
  compass:['指南针','价值观与人生领域 · 系统的北极星'],
  projects:['项目','有终点的战略工作，必须可验证'],
  notes:['知识库','捕捉 → 消化 → 洞见'],
  finance:['财务','三张报表 + FIRE 进度'],
  health:['健康与精力','精力是所有系统的底层燃料'],
  contacts:['人际','关系需要主动维护'],
  reviews:['复盘','必须产生输出，不只是反思'],
  agent:['AI 助手','基于 34 个工具的 LifeOS Agent'],
};
document.querySelectorAll('.nav-item').forEach(el=>{
  el.onclick=()=>{go(el.dataset.view)}
});
function go(v){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  const t=TITLES[v]||['',''];
  document.getElementById('viewTitle').textContent=t[0];
  document.getElementById('viewSub').textContent=t[1];
  render(v);
  toggleNav(false);
}
function toggleNav(open){
  document.getElementById('sidebar').classList.toggle('open',open);
  document.getElementById('overlay').classList.toggle('show',open);
}

/* ===================== Toast ===================== */
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ===================== Helpers ===================== */
const CTX={deep_work:'深度工作',quick:'碎片任务',errand:'外出',call:'通话',anywhere:'随时'};
const EN={high:'高精力',medium:'中精力',low:'低精力'};
const PR={high:'高',medium:'中',low:'低'};
function energyMatch(taskE){
  if(state.energy>=4) return taskE==='high';
  if(state.energy<=2) return taskE==='low';
  return taskE==='medium';
}
function recommendedTasks(){
  return state.tasks.filter(t=>!t.done&&t.type==='action'&&t.date===today()&&energyMatch(t.energy));
}

/* ===================== Views ===================== */
function render(v){
  const c=document.getElementById('content');
  const map={today:renderToday,compass:renderCompass,projects:renderProjects,notes:renderNotes,
    finance:renderFinance,health:renderHealth,contacts:renderContacts,reviews:renderReviews,agent:renderAgent};
  c.innerHTML=(map[v]||renderToday)();
  if(v==='agent') initChat();
}

/* ---------- Today ---------- */
function renderToday(){
  const recs=recommendedTasks();

function taskRow(t,rec){
  return `<div class="task ${rec?'rec':''} ${t.done?'done':''}">
    <div class="check ${t.done?'on':''}" onclick="toggleTask(${t.id})"></div>
    <div style="flex:1">
      <div class="tt">${esc(t.title)}</div>
      <div class="tm">
        <span class="pill gray">${CTX[t.context]||t.context}</span>
        <span class="tag ${t.energy}">${EN[t.energy]}</span>
        <span class="tag ${t.priority}">优先级 ${PR[t.priority]}</span>
        ${t.waitingFor?`<span class="pill orange">等待：${esc(t.waitingFor)}</span>`:''}
      </div>
    </div>
    ${t.type==='waiting'?'':`<button class="btn sm gray" onclick="delTask(${t.id})">删除</button>`}
  </div>`;
}
function setEnergy(n){state.energy=n;save();render('today');toast('精力已更新，任务推荐已重新计算')}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render(currentView());toast(t.done?'任务已完成 ✅':'已取消完成')}}
function delTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();render(currentView());toast('任务已删除')}
function addInbox(){const el=document.getElementById('inboxInput');const v=el.value.trim();if(!v)return;state.inbox.unshift({id:state.nextId++,content:v,ts:Date.now()});save();render('today')}
function delInbox(id){state.inbox=state.inbox.filter(i=>i.id!==id);save();render('today');updateNavInbox()}
function inboxToTask(id){const i=state.inbox.find(x=>x.id===id);if(!i)return;state.tasks.unshift({id:state.nextId++,title:i.content,type:'action',context:'anywhere',energy:'medium',priority:'medium',date:today(),done:false,note:'由 Inbox 转入'});state.inbox=state.inbox.filter(x=>x.id!==id);save();render('today');updateNavInbox();toast('已转为任务 ✅')}
function clearInbox(){state.inbox=[];save();render('today');updateNavInbox();toast('收件箱已清空')}
function updateNavInbox(){document.getElementById('navInbox').textContent=state.inbox.length||'';if(!state.inbox.length)document.getElementById('navInbox').style.display='none';else document.getElementById('navInbox').style.display=''}
function currentView(){return document.querySelector('.nav-item.active').dataset.view}

function barRow(n,v,c,total){
  const pct=Math.round(v/total*100);
  return `<div class="bar-row"><span class="lbl">${n}</span><div class="bar-track"><i style="width:${pct}%;background:${c}"></i></div><span class="amt">¥${v.toLocaleString()}</span></div>`;
}
function lineChart(labels,data,max){
  const W=560,H=180,P=30;
  const pts=data.map((d,i)=>[P+i*(W-2*P)/(data.length-1),H-P-(d/max)*(H-2*P)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0]} ${H-P} L ${pts[0][0]} ${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".25"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(f=>`<line x1="${P}" y1="${P+f*(H-2*P)}" x2="${W-P}" y2="${P+f*(H-2*P)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join('')}
    <path d="${area}" fill="url(#g)"/>
    <path d="${path}" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0a84ff"/><text x="${p[0]}" y="${H-P+16}" font-size="10" fill="var(--sub)" text-anchor="middle">${labels[i]}</text><text x="${p[0]}" y="${p[1]-9}" font-size="10" fill="var(--blue)" text-anchor="middle" font-weight="700">${data[i]}</text>`).join('')}
  </svg>`;
}

    <div class="card"><div class="card-h"><span class="ico">🔋</span>精力趋势（近 7 天）</div><div class="card-b">
      ${energyChart(days,energy)}
    </div></div>

    <div class="card"><div class="card-h"><span class="ico">✅</span>今日习惯打卡</div><div class="card-b">
      <p style="font-size:12px;color:var(--sub);margin-bottom:12px">低谷期只展示最低维护习惯（🏃除外），抗脆弱设计</p>
      ${state.habits.map(h=>`
        <div class="habit">
          <span class="h-ic">${h.ic}</span>
          <span class="h-name">${h.name}</span>
          ${h.mv?'<span class="mv-tag">最低维护</span>':''}
          <span class="streak">${h.log.map(v=>`<span class="sc ${v?'on':''}"></span>`).join('')}</span>
          <div class="check-mini ${h.log[6]?'on':''}" onclick="toggleHabit(${h.id})">${h.log[6]?'✓':''}</div>
        </div>`).join('')}
    </div></div>
  </div>`;
}
function energyChart(labels,data){
  const W=560,H=170,P=30;
  const pts=data.map((d,i)=>[P+i*(W-2*P)/(data.length-1),H-P-((d-1)/4)*(H-2*P)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34c759" stop-opacity=".25"/><stop offset="1" stop-color="#34c759" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L ${pts[pts.length-1][0]} ${H-P} L ${pts[0][0]} ${H-P} Z" fill="url(#eg)"/>
    <path d="${path}" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#34c759"/><text x="${p[0]}" y="${H-P+16}" font-size="10" fill="var(--sub)" text-anchor="middle">${labels[i]}</text><text x="${p[0]}" y="${p[1]-9}" font-size="10" fill="var(--green)" text-anchor="middle" font-weight="700">${data[i]}</text>`).join('')}
  </svg>`;
}
function toggleHabit(id){const h=state.habits.find(x=>x.id===id);if(h){h.log[6]=h.log[6]?0:1;save();render('health');toast(h.log[6]?'习惯已打卡 ✅':'已取消打卡')}}

/* ---------- AI Agent ---------- */
let chatLog=[];
function renderAgent(){
  return `<div class="grid">
    <div class="card">
      <div class="card-h"><span class="ico">🤖</span>LifeOS Agent · 钉钉智能助手 <span class="pill purple">34 个工具</span></div>
      <div class="card-b" style="padding:0">
        <div class="chat-box">
          <div class="chat-msgs" id="chatMsgs"></div>
          <div class="quick-q">
            <button onclick="ask('我今天还有什么任务没完成？')">今日还有哪些任务？</button>
            <button onclick="ask('我精力一般，推荐做什么？')">精力一般做啥？</button>
            <button onclick="ask('帮我记一笔：午餐 35 元')">帮我记账</button>
            <button onclick="ask('我这周习惯完成情况如何？')">习惯情况</button>
            <button onclick="ask('我净资产多少？FIRE进度呢？')">财务状况</button>
            <button onclick="ask('哪些人很久没联系了？')">待联系的人</button>
          </div>
          <div class="chat-input">
            <input class="field" id="chatInput" placeholder="对 AI 助手说点什么..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="btn" onclick="sendMsg()">发送</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card"><div class="card-b">
      <p style="font-size:13px;color:var(--sub)">💡 Agent 基于 OpenAI Function Calling，5 轮工具调用循环，覆盖 10 个业务模块的主干增删改查。每条回复都接入钉钉业务错误码校验，失败不会被误记为成功。数据缺失时如实报告「未记/未评」，<b>禁止编造</b>健康/精力/财务数据。</p>
    </div></div>
  </div>`;
}
function initChat(){
  chatLog=[];
  if(chatLog.length===0){
    pushMsg('bot','你好！我是 LifeOS 智能助手 🤖\n我可以帮你管理任务、记账、查询健康财务数据、推荐适合当前精力的任务。\n\n试试下面的快捷问题，或直接对我说点什么～');
  }
}
function pushMsg(who,text,tools){
  const box=document.getElementById('chatMsgs');if(!box)return;
  const div=document.createElement('div');
  div.className='msg '+(who==='sys'?'sys':who);
  let html=esc(text);
  if(tools&&tools.length){html+='<div style="margin-top:6px">'+tools.map(t=>`<span class="tool">🔧 ${t}</span>`).join('')+'</div>'}
  div.innerHTML=html;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}
function ask(q){document.getElementById('chatInput').value=q;sendMsg()}
function sendMsg(){
  const el=document.getElementById('chatInput');const q=el.value.trim();if(!q)return;el.value='';
  pushMsg('me',q);
  setTimeout(()=>reply(q),200);
}
function reply(q){
  const box=document.getElementById('chatMsgs');
  const t=document.createElement('div');t.className='msg bot';t.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
  box.appendChild(t);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{t.remove();doReply(q)},700);
}
function doReply(q){
  const lower=q.toLowerCase();
  let tools=[],text='';
  if(q.includes('任务')||q.includes('待办')){
    tools=['list_today_tasks','recommended_for_energy'];
    const todo=state.tasks.filter(t=>!t.done&&t.date===today()&&t.type==='action');
    const rec=recommendedTasks();
    text=`已查询今日任务 📋\n\n今日还有 ${todo.length} 个未完成任务，根据你当前精力（${state.energy}/5），推荐现在做：\n${rec.map(t=>`• ${t.title}（${CTX[t.context]}，${EN[t.energy]}）`).join('\n')||'暂无匹配任务，可以休息一下 ☕'}\n\n要新建任务直接告诉我就行～`;
  }else if(q.includes('记账')||q.includes('午餐')||lower.includes('记一笔')){
    tools=['create_transaction'];
    const m=q.match(/(\d+)/);
    const amt=m?m[1]:'35';
    text=`已为你记账 ✅\n\n• 类型：支出\n• 金额：¥${amt}\n• 分类：可变支出\n• 现金流：经营性\n\n关联账户余额已自动更新，本月支出累计 ¥15,000。`;
  }else if(q.includes('习惯')){
    tools=['list_habits'];
    const done=state.habits.filter(h=>h.log[6]).length;
    text=`今日习惯打卡情况 🏃\n\n已完成 ${done}/${state.habits.length}：\n${state.habits.map(h=>`${h.log[6]?'✅':'⬜'} ${h.ic} ${h.name}${h.mv?'（最低维护）':''}`).join('\n')}\n\n${done===state.habits.length?'太棒了，全部完成！🎉':'还有 '+(state.habits.length-done)+' 个待完成，加油！'}`;
  }else if(q.includes('净资产')||q.includes('fire')||lower.includes('财务')||q.includes('资产')){
    tools=['get_finance_overview'];
    text=`财务概况 💰\n\n• 净资产：¥48.6 万（较上月 +¥1.1 万）\n• FIRE 进度：24%（目标 ¥200 万）\n• 本月储蓄率：31% ✅ 达标\n• 投资持仓总现值：¥10.88 万\n\n储蓄率持续达标，复利效应正在显现，继续保持！`;
  }else if(q.includes('联系')||q.includes('人际')){
    tools=['list_contacts_due'];
    text=`待联系的人 👥\n\n• 阿明（朋友）— 21 天未联系，已超期 ⚠️\n• 张老师（导师）— 12 天前联系\n\n建议本周主动联系阿明，他正在创业期，可能需要支持。`;
  }else if(q.includes('精力')||q.includes('推荐')){
    tools=['recommended_for_energy'];
    const rec=recommendedTasks();
    text=`你当前精力等级 ${state.energy}/5 🔋\n\n${state.energy>=4?'精力充沛！推荐深度工作类任务：':state.energy<=2?'精力偏低，建议只做轻量任务或启用最低维护模式：':'精力适中，推荐日常事务：'}\n${rec.map(t=>`• ${t.title}`).join('\n')||'暂无匹配任务'}\n\n💡 记得休息也是生产力，别硬扛。`;
  }else if(q.includes('复盘')){
    tools=['list_reviews'];
    text=`最近一次复盘：周复盘 2026-W27 🔄\n\n本周完成 LifeOS 复盘模块联调，健康领域因加班睡眠不足需关注。输出：把"冥想"纳入最低维护习惯。\n\n复盘是闭环机制，必须产生输出，不只是反思。`;
  }else if(q.includes('你好')||q.includes('hi')||lower.includes('hello')){
    text='你好！我是 LifeOS 智能助手 🤖 今天过得怎么样？我可以帮你管理任务、记账、查询数据。试试问我「今日还有哪些任务？」';
  }else{
    tools=['search_knowledge'];
    text=`收到～ 我理解你的意思是「${q}」。\n\n作为 LifeOS Agent，我可以：\n• 管理任务（建/查/改/删/完成）\n• 记账与查询财务\n• 记录健康与习惯\n• 查询联系人\n• 按精力推荐任务\n\n试试上面的快捷问题吧！`;
  }
  pushMsg('bot',text,tools);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* init */
updateNavInbox();
render('today');
</script>
