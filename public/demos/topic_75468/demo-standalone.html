<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微光 MindGlow - 校园霸凌即时求助平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F5F0E1',
            'cream-light': '#FBF7EE',
            sand: '#D4C4A8',
            terracotta: '#C67B5C',
            'terracotta-deep': '#A85A3E',
            clay: '#B5651D',
            olive: '#6B7B3C',
            'olive-deep': '#4A5A2C',
            ink: '#3D2E26',
            'ink-soft': '#6B5852',
            'ink-muted': '#9A8B82',
          },
          fontFamily: {
            heading: ['Varela Round', 'sans-serif'],
            body: ['Nunito Sans', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Nunito Sans', sans-serif; background: #F5F0E1; color: #3D2E26; -webkit-font-smoothing: antialiased; }

    /* ===== 光影系统（纯色，无渐变）===== */
    .card-soft {
      background: #FFFFFF;
      box-shadow:
        0 1px 2px rgba(61, 46, 38, 0.04),
        0 6px 16px rgba(61, 46, 38, 0.06),
        0 24px 48px rgba(198, 123, 92, 0.05);
    }
    .card-warm {
      background: #FBF7EE;
      box-shadow:
        0 1px 2px rgba(61, 46, 38, 0.04),
        0 6px 16px rgba(61, 46, 38, 0.06),
        0 24px 48px rgba(198, 123, 92, 0.05);
    }
    .card-ember {
      background: #FFF7ED;
      box-shadow:
        0 1px 2px rgba(168, 90, 62, 0.05),
        0 4px 12px rgba(168, 90, 62, 0.06);
      border: 1px solid rgba(168, 90, 62, 0.15);
    }

    .btn-primary {
      background: #C67B5C;
      color: #FFFFFF;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 -2px 0 rgba(168, 90, 62, 0.5) inset,
        0 4px 12px rgba(198, 123, 92, 0.3),
        0 8px 24px rgba(198, 123, 92, 0.12);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 -2px 0 rgba(168, 90, 62, 0.5) inset,
        0 6px 16px rgba(198, 123, 92, 0.4),
        0 12px 32px rgba(198, 123, 92, 0.16);
    }
    .btn-primary:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(168, 90, 62, 0.4) inset; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: #FFFFFF;
      color: #3D2E26;
      box-shadow:
        0 1px 2px rgba(61, 46, 38, 0.04),
        0 4px 8px rgba(61, 46, 38, 0.04);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 2px 4px rgba(61, 46, 38, 0.06),
        0 8px 16px rgba(198, 123, 92, 0.1);
    }

    .btn-danger {
      background: #A85A3E;
      color: #FFFFFF;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.2) inset,
        0 -2px 0 rgba(120, 50, 30, 0.5) inset,
        0 4px 12px rgba(168, 90, 62, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-danger:hover { transform: translateY(-1px); }

    .logo-glow {
      background: #C67B5C;
      box-shadow:
        0 6px 16px rgba(198, 123, 92, 0.35),
        0 16px 40px rgba(198, 123, 92, 0.2),
        0 1px 0 rgba(255, 255, 255, 0.2) inset;
    }

    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
    }

    .urgency-option {
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(61, 46, 38, 0.04), 0 4px 8px rgba(61, 46, 38, 0.04);
      cursor: pointer;
      border: 2px solid transparent;
    }
    .urgency-option:hover { transform: translateY(-2px); }
    .urgency-option.selected.normal { border-color: #6B7B3C; background: #FBF7EE; }
    .urgency-option.selected.urgent { border-color: #B5651D; background: #FFF7ED; }
    .urgency-option.selected.critical { border-color: #A85A3E; background: #FEF2F2; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }

    .input-soft {
      background: #FBF7EE;
      border: 1px solid rgba(212, 196, 168, 0.3);
      transition: all 0.2s ease;
    }
    .input-soft:focus {
      background: #FFFFFF;
      border-color: #C67B5C;
      box-shadow: 0 0 0 3px rgba(198, 123, 92, 0.1);
      outline: none;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-olive { background: rgba(107, 123, 60, 0.12); color: #4A5A2C; }
    .tag-clay { background: rgba(181, 101, 29, 0.12); color: #B5651D; }
    .tag-terra { background: rgba(168, 90, 62, 0.12); color: #A85A3E; }
    .tag-grey { background: rgba(154, 139, 130, 0.15); color: #6B5852; }

    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .pulse-ring { animation: pulseRing 2s ease-out infinite; }
    @keyframes pulseRing { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.8); opacity: 0; } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .breathe { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
    .spin-slow { animation: spinSlow 2s linear infinite; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .call-wave {
      position: absolute;
      border: 2px solid #C67B5C;
      border-radius: 50%;
      opacity: 0;
      animation: callWave 2s ease-out infinite;
    }
    @keyframes callWave {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .call-wave:nth-child(2) { animation-delay: 0.5s; }
    .call-wave:nth-child(3) { animation-delay: 1s; }

    @media (prefers-reduced-motion: reduce) {
      .float, .pulse-ring, .fade-in, .breathe, .spin-slow, .call-wave { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script>
    // ========== Mock 后端（localStorage 模拟，无需真实后端）==========
    // 数据存储：localStorage（file:// 协议下也可用）
    // 用户隔离：sessionStorage（不同标签页独立登录）
    // 跨标签页通信：BroadcastChannel（file:// 协议下也能可靠工作）+ storage 事件备份

    // 初始化跨标签页通信通道（双击打开 file:// 也能工作）
    const channel = new BroadcastChannel('mindglow_channel');

    const DB = {
      get(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } },
      set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
      getUsers() { return this.get('mg_users'); },
      setUsers(v) { this.set('mg_users', v); },
      getRequests() { return this.get('mg_requests'); },
      setRequests(v) { this.set('mg_requests', v); },
      getCalls() { return this.get('mg_calls'); },
      setCalls(v) { this.set('mg_calls', v); },
      getInvitations() { return this.get('mg_invitations'); },
      setInvitations(v) { this.set('mg_invitations', v); },
      // 通知其他标签页数据已变更（BroadcastChannel 主通道 + storage 事件备份）
      notify(event) {
        const payload = { ...event, ts: Date.now() };
        // 主通道：BroadcastChannel（file:// 下可靠）
        try { channel.postMessage(payload); } catch(e) {}
        // 备份通道：storage 事件（http:// 下可靠，file:// 下部分浏览器不触发）
        localStorage.setItem('mg_event', JSON.stringify(payload));
      },
    };

    // 初始化 Mock 数据
    function initMockData() {
      if (!localStorage.getItem('mg_users')) {
        DB.setUsers([
          { id: 'u-seeker', role: 'seeker', nickname: '匿名用户' + Math.random().toString(36).slice(2, 8) },
          { id: 'u-helper-1', role: 'helper', nickname: '张老师', helperProfile: { level: 5, specialty: 'psychology', acceptCount: 128 } },
          { id: 'u-helper-2', role: 'helper', nickname: '李警官', helperProfile: { level: 5, specialty: 'safety', acceptCount: 96 } },
          { id: 'u-helper-3', role: 'helper', nickname: '王医生', helperProfile: { level: 4, specialty: 'medical', acceptCount: 72 } },
        ]);
      }
      if (!localStorage.getItem('mg_requests')) DB.setRequests([]);
      if (!localStorage.getItem('mg_calls')) DB.setCalls([]);
      if (!localStorage.getItem('mg_invitations')) DB.setInvitations([]);
    }

    // 获取当前标签页登录的用户（sessionStorage 隔离不同标签页）
    function getCurrentUser() {
      const userId = sessionStorage.getItem('mg_current_user_id');
      if (!userId) return null;
      return DB.getUsers().find(u => u.id === userId);
    }

    // ========== Mock API（接口与原版完全一致）==========
    const API = {
      async login(code) {
        let user;
        if (code === 'mock-code') {
          user = DB.getUsers().find(u => u.id === 'u-seeker');
        } else {
          const num = code.split('-').pop();
          user = DB.getUsers().find(u => u.id === `u-helper-${num}`);
        }
        if (!user) throw new Error('用户不存在');
        return { accessToken: 'mock-token-' + user.id, user };
      },

      async getProfile() {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        return user;
      },

      async createRequest(data) {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        const requests = DB.getRequests();
        const request = {
          id: 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          seekerId: user.id,
          urgency: data.urgency,
          description: data.description || '',
          status: 'matching',
          matchedCount: 0,
          createdAt: new Date().toISOString(),
        };
        requests.push(request);
        DB.setRequests(requests);

        // 模拟匹配引擎：为所有守护者创建邀请
        const invitations = DB.getInvitations();
        const helpers = DB.getUsers().filter(u => u.role === 'helper');
        const totalTime = data.urgency === 'critical' ? 30 : data.urgency === 'urgent' ? 60 : 120;
        helpers.forEach(h => {
          invitations.push({
            id: 'inv-' + Date.now() + '-' + h.id + '-' + Math.random().toString(36).slice(2, 4),
            requestId: request.id,
            helperId: h.id,
            status: 'pending',
            score: Math.floor(Math.random() * 30) + 70,
            remainingSeconds: totalTime,
            totalTime: totalTime,
            createdAt: new Date().toISOString(),
          });
        });
        DB.setInvitations(invitations);

        // 更新匹配数
        request.matchedCount = helpers.length;
        DB.setRequests(requests);

        DB.notify({ type: 'request_created', requestId: request.id });
        return request;
      },

      async getStatus(requestId) {
        const requests = DB.getRequests();
        const req = requests.find(r => r.id === requestId);
        if (!req) throw new Error('求助不存在');
        return { status: req.status, matchedCount: req.matchedCount };
      },

      async cancelRequest(requestId) {
        const requests = DB.getRequests();
        const req = requests.find(r => r.id === requestId);
        if (!req) throw new Error('求助不存在');
        if (['completed', 'cancelled', 'timeout'].includes(req.status)) throw new Error('当前状态不可取消');
        req.status = 'cancelled';
        DB.setRequests(requests);
        DB.notify({ type: 'request_cancelled', requestId });
      },

      async getHistory() {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        const requests = DB.getRequests();
        return requests
          .filter(r => r.seekerId === user.id)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      },

      async getPending() {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        const invitations = DB.getInvitations();
        const requests = DB.getRequests();
        const now = Date.now();
        return invitations
          .filter(inv => inv.helperId === user.id && inv.status === 'pending')
          .map(inv => {
            const req = requests.find(r => r.id === inv.requestId);
            if (!req) return null;
            // 动态计算剩余时间
            const elapsed = Math.floor((now - new Date(inv.createdAt).getTime()) / 1000);
            inv.remainingSeconds = Math.max(0, (inv.totalTime || 60) - elapsed);
            // 超时自动标记 expired
            if (inv.remainingSeconds <= 0) {
              inv.status = 'expired';
              return null;
            }
            // 只返回 matching 或 matched 状态的求助
            if (!['matching', 'matched'].includes(req.status)) return null;
            return { ...inv, request: req };
          })
          .filter(inv => inv !== null);
      },

      async acceptInvitation(invId) {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        const invitations = DB.getInvitations();
        const inv = invitations.find(i => i.id === invId);
        if (!inv) throw new Error('邀请不存在');
        if (inv.status !== 'pending') throw new Error('邀请已处理（状态: ' + inv.status + '）');
        inv.status = 'accepted';
        inv.acceptedAt = new Date().toISOString();
        DB.setInvitations(invitations);

        // 标记求助为 matched
        const requests = DB.getRequests();
        const req = requests.find(r => r.id === inv.requestId);
        if (req) {
          req.status = 'matched';
          req.matchedHelperId = inv.helperId;
          DB.setRequests(requests);
        }

        // 其他 pending 邀请标记为 missed
        invitations.forEach(i => {
          if (i.requestId === inv.requestId && i.id !== invId && i.status === 'pending') {
            i.status = 'missed';
          }
        });
        DB.setInvitations(invitations);

        DB.notify({ type: 'invitation_accepted', requestId: inv.requestId });
        return { requestId: inv.requestId };
      },

      async startCall(requestId) {
        const user = getCurrentUser();
        if (!user) throw new Error('未登录');
        const calls = DB.getCalls();
        const requests = DB.getRequests();
        const req = requests.find(r => r.id === requestId);
        if (!req) throw new Error('求助不存在');

        // 检查是否已有活跃通话
        const existing = calls.find(c => c.requestId === requestId && ['ringing', 'connected'].includes(c.status));
        if (existing) throw new Error('已有进行中的通话');

        const call = {
          id: 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          requestId: requestId,
          seekerId: req.seekerId,
          helperId: user.id,
          status: 'ringing',
          startedAt: new Date().toISOString(),
          duration: 0,
        };
        calls.push(call);
        DB.setCalls(calls);

        // 更新求助状态为 in_call
        req.status = 'in_call';
        DB.setRequests(requests);

        DB.notify({ type: 'call_started', callId: call.id, requestId });
        return { callId: call.id, status: 'ringing' };
      },

      async answerCall(callId) {
        const calls = DB.getCalls();
        const call = calls.find(c => c.id === callId);
        if (!call) throw new Error('通话不存在');
        call.status = 'connected';
        call.answeredAt = new Date().toISOString();
        DB.setCalls(calls);
        DB.notify({ type: 'call_answered', callId });
        return { status: 'connected' };
      },

      async endCall(callId) {
        const calls = DB.getCalls();
        const call = calls.find(c => c.id === callId);
        if (!call) throw new Error('通话不存在');
        call.status = 'ended';
        call.endedAt = new Date().toISOString();
        if (call.answeredAt) {
          call.duration = Math.floor((new Date(call.endedAt) - new Date(call.answeredAt)) / 1000);
        }
        DB.setCalls(calls);

        // 更新求助状态为 completed
        const requests = DB.getRequests();
        const req = requests.find(r => r.id === call.requestId);
        if (req && req.status === 'in_call') {
          req.status = 'completed';
          DB.setRequests(requests);
        }

        DB.notify({ type: 'call_ended', callId, requestId: call.requestId });
        return { duration: call.duration };
      },

      async getCallStatus(callId) {
        const calls = DB.getCalls();
        const call = calls.find(c => c.id === callId);
        if (!call) throw new Error('通话不存在');
        return { status: call.status, duration: call.duration || 0 };
      },

      async getActiveCall(requestId) {
        const calls = DB.getCalls();
        const user = getCurrentUser();
        if (!user) return { hasActiveCall: false, hasRecentCall: false };

        // 查找该求助最近的通话
        const call = calls
          .filter(c => c.requestId === requestId)
          .sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt))[0];

        if (!call) return { hasActiveCall: false, hasRecentCall: false };

        // 权限检查：只有求助者或守护者能查看
        const isSeeker = call.seekerId === user.id;
        const isHelper = call.helperId === user.id;
        if (!isSeeker && !isHelper) return { hasActiveCall: false, hasRecentCall: false };

        const isActive = ['ringing', 'connected'].includes(call.status);
        return {
          hasActiveCall: isActive,
          hasRecentCall: true,
          callId: call.id,
          status: call.status,
          requestId: call.requestId,
          duration: call.duration,
          peerRole: isSeeker ? 'helper' : 'seeker',
        };
      },
    };

    // ========== 状态管理（与原版完全一致）==========
    const state = {
      view: 'login',
      token: '',
      user: null,
      requestId: '',
      callId: '',
      callStatus: '',
      matchedCount: 0,
      pendingList: [],
      history: [],
      pollTimer: null,
      callTimer: null,
      callSeconds: 0,
    };

    // ========== SVG 图标库（与原版完全一致）==========
    const ICON = {
      moon: '<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M28 20a10 10 0 1 1-10-10 8 8 0 0 0 10 10z" fill="white" opacity="0.95"/><path d="M30 6l1.5 4.5L36 12l-4.5 1.5L30 18l-1.5-4.5L24 12l4.5-1.5L30 6z" fill="white" opacity="0.8"/><circle cx="10" cy="30" r="1.5" fill="white" opacity="0.6"/><circle cx="32" cy="32" r="1" fill="white" opacity="0.5"/></svg>',
      moonSm: '<svg width="20" height="20" viewBox="0 0 40 40" fill="none"><path d="M28 20a10 10 0 1 1-10-10 8 8 0 0 0 10 10z" fill="white" opacity="0.95"/><path d="M30 6l1.5 4.5L36 12l-4.5 1.5L30 18l-1.5-4.5L24 12l4.5-1.5L30 6z" fill="white" opacity="0.8"/></svg>',
      shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
      logout: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
      alert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      chat: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C67B5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
      phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
      clock: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',

    async function loginAs(role) {
      try {
        const code = role === 'seeker' ? 'mock-code' : `mock-helper-${role.split('-')[1]}`;
        const result = await API.login(code);
        state.token = result.accessToken;
        state.user = result.user;
        // 用 sessionStorage 记住当前标签页的用户（不同标签页独立）
        sessionStorage.setItem('mg_current_user_id', result.user.id);
        state.view = result.user.role === 'helper' ? 'helper' : 'seeker';
        render();
      } catch (e) {
        showToast('登录失败: ' + e.message);
      }
    }
    window.loginAs = loginAs;

    // ========== 求助者端（与原版完全一致）==========
    function renderSeeker() {

    function bindSeeker() {
      loadHistory();
    }

    let selectedUrgency = 'urgent';
    window.selectUrgency = function(u) {
      selectedUrgency = u;
      ['normal', 'urgent', 'critical'].forEach(k => {
        const el = document.getElementById('urg-' + k);
        if (!el) return;
        if (k === u) el.classList.add('selected');
        else el.classList.remove('selected');
      });
    };

    window.submitRequest = async function() {
      const desc = document.getElementById('desc').value;
      const btn = document.getElementById('submit-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span>提交中...</span>'; }
      try {
        const result = await API.createRequest({ urgency: selectedUrgency, description: desc });
        state.requestId = result.id;
        document.getElementById('match-section').classList.remove('hidden');
        if (btn) { btn.disabled = false; btn.innerHTML = `${ICON.phone}一键求助`; }
        startPolling();
      } catch (e) {
        showToast('发起求助失败: ' + e.message);
        if (btn) { btn.disabled = false; btn.innerHTML = `${ICON.phone}一键求助`; }
      }
    };

    // 求助者端：挂断标志，防止重入（提前声明，供 startCallPolling 和 endCall 共用）
    let isEndingCall = false;

    function startPolling() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        try {
          const status = await API.getStatus(state.requestId);
          state.matchedCount = status.matchedCount || 0;
          updateMatchUI(status);
          // matched 或 in_call 都进入等待通话（守护者可能已快速 startCall）
          if (status.status === 'matched' || status.status === 'in_call') {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            waitForHelperCall();
          } else if (status.status === 'completed') {
            // 通话已结束（可能守护者已挂断）
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            state.callStatus = 'ended';
            showCallUI();
          } else if (status.status === 'timeout' || status.status === 'cancelled') {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
          }
        } catch (e) { console.error(e); }
      }, 2000);
      updateMatchUI({ status: 'matching', matchedCount: 0 });
    }

    function updateMatchUI(status) {
      const content = document.getElementById('match-content');
      if (!content) return;
      if (status.status === 'matching') {
        content.innerHTML = `
          <div class="text-center py-6">
            <div class="relative inline-block mb-4">
              <div class="w-16 h-16 rounded-full bg-terracotta flex items-center justify-center">
                <div class="breathe">${ICON.clock}</div>
              </div>
              <div class="absolute inset-0 rounded-full border-2 border-terracotta pulse-ring"></div>
            </div>
            <p class="font-heading text-lg text-ink">正在为你匹配守护者</p>
            <p class="text-sm text-ink-muted mt-1">已通知 <span class="font-bold text-terracotta">${status.matchedCount || 0}</span> 位守护者</p>
            <button onclick="cancelRequest()" class="mt-4 text-sm text-ink-muted hover:text-terracotta-deep font-medium cursor-pointer">取消求助</button>
          </div>
        `;
      } else if (status.status === 'matched') {
        content.innerHTML = `
          <div class="text-center py-6">
            <div class="w-16 h-16 rounded-full bg-olive flex items-center justify-center mx-auto mb-4">${ICON.checkCircle}</div>
            <p class="font-heading text-lg text-olive-deep">已匹配到守护者！</p>
            <p class="text-sm text-ink-muted mt-2">正在为你建立通话...</p>
          </div>
        `;
      } else if (status.status === 'timeout') {
        content.innerHTML = `
          <div class="text-center py-6">
            <div class="w-16 h-16 rounded-full bg-sand/20 flex items-center justify-center mx-auto mb-4">${ICON.moonNight}</div>
            <p class="font-heading text-lg text-ink">暂无守护者接单</p>
            <p class="text-sm text-ink-muted mt-2 mb-4">可以再试一次</p>
            <button onclick="retryRequest()" class="btn-primary px-6 py-2 rounded-xl text-sm font-medium">再试一次</button>
          </div>
        `;
      } else if (status.status === 'cancelled') {
        content.innerHTML = `<div class="text-center py-6 text-ink-muted">求助已取消</div>`;
      }
    }

    window.cancelRequest = async function() {
      try {
        await API.cancelRequest(state.requestId);
        if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
        updateMatchUI({ status: 'cancelled' });
      } catch (e) { showToast('取消失败: ' + e.message); }
    };

    window.retryRequest = function() {
      document.getElementById('match-section').classList.add('hidden');
      state.requestId = '';
    };

    // 求助者端：等待守护者发起通话，轮询 getActiveCall
    function waitForHelperCall() {
      let attempts = 0;
      let connectedHandled = false; // 防止重复处理 connected
      state.pollTimer = setInterval(async () => {
        attempts++;
        try {
          const active = await API.getActiveCall(state.requestId);

          // 情况1：有活跃通话（ringing 或 connected）
          if (active.hasActiveCall) {
            state.callId = active.callId;

            if (active.status === 'connected' && !connectedHandled) {
              // 守护者已接听，进入通话
              connectedHandled = true;
              clearInterval(state.pollTimer);
              state.pollTimer = null;
              state.callStatus = 'connected';
              startCallTimer();
              showCallUI();
              // 持续轮询检测挂断
              startCallPolling();
            } else if (active.status === 'ringing' && state.callStatus !== 'connecting') {
              // 守护者已发起通话，等待接听
              state.callStatus = 'connecting';
              showCallUI();
            }
          }
          // 情况2：无活跃通话，但有最近通话记录（说明通话已结束）
          else if (active.hasRecentCall) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            state.callId = active.callId;
            if (active.status === 'ended') {
              state.callStatus = 'ended';
            } else if (active.status === 'missed') {
              state.callStatus = 'missed';
            } else if (active.status === 'failed') {
              state.callStatus = 'ended';
            }
            showCallUI();
            setTimeout(() => loadHistory(), 2000);
          }
          // 情况3：无任何通话记录，继续等待（matched 状态，守护者还未 startCall）

          if (attempts > 45) {
            // 90秒超时
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            showToast('守护者未发起通话，请稍后重试');
            state.callStatus = '';
            state.requestId = '';
            document.getElementById('match-section').classList.add('hidden');
            loadHistory();
          }
        } catch (e) { console.error(e); }
      }, 2000);
      // 立即显示"正在连接"状态
      state.callStatus = 'connecting';
      showCallUI();
    }

    function startCallPolling() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        // 如果正在挂断，停止轮询
        if (isEndingCall) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          return;
        }
        try {
          const status = await API.getCallStatus(state.callId);
          if (status.status === 'connected') {
            // 首次检测到 connected，启动计时器并更新 UI
            if (state.callStatus !== 'connected') {
              state.callStatus = 'connected';
              startCallTimer();
              showCallUI();
            }
          } else if (status.status === 'missed' || status.status === 'ended' || status.status === 'failed') {
            // 通话已结束（守护者挂断或超时），立即停止轮询
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
            // 防止与 endCall 竞争：只有非挂断中才更新 UI
            if (!isEndingCall) {
              state.callStatus = status.status === 'missed' ? 'missed' : 'ended';
              showCallUI();
              setTimeout(() => {
                document.getElementById('match-section').classList.add('hidden');
                state.requestId = '';
                state.callId = '';
                state.callStatus = '';
                loadHistory();
              }, 2500);
            }
          }
        } catch (e) {}
      }, 2000);
    }

    function startCallTimer() {
      state.callSeconds = 0;
      if (state.callTimer) clearInterval(state.callTimer);
      state.callTimer = setInterval(() => {
        state.callSeconds++;
        const timerEl = document.getElementById('call-timer');
        if (timerEl) {
          const m = String(Math.floor(state.callSeconds / 60)).padStart(2, '0');
          const s = String(state.callSeconds % 60).padStart(2, '0');
          timerEl.textContent = `${m}:${s}`;
        }
      }, 1000);
    }

    function showCallUI() {
      const content = document.getElementById('match-content');
      if (!content) return;
      if (state.callStatus === 'connecting') {
        content.innerHTML = `
          <div class="text-center py-8">
            <div class="relative inline-block mb-6">
              <div class="w-20 h-20 rounded-full bg-terracotta flex items-center justify-center relative z-10">
                <div class="breathe">${ICON.phoneCall}</div>
              </div>
              <div class="absolute inset-0 rounded-full border-2 border-terracotta pulse-ring"></div>
            </div>
            <p class="font-heading text-lg text-ink">守护者已接单</p>
            <p class="text-sm text-ink-muted mt-2">正在建立通话连接...</p>
            <button onclick="cancelConnecting()" class="mt-6 btn-secondary px-6 py-2 rounded-xl text-sm font-medium text-terracotta-deep">取消</button>
          </div>
        `;
      } else if (state.callStatus === 'ringing') {
        content.innerHTML = `
          <div class="text-center py-8">
            <div class="relative inline-block mb-6">
              <div class="w-20 h-20 rounded-full bg-terracotta flex items-center justify-center relative z-10">
                <div class="breathe">${ICON.phoneCall}</div>
              </div>
              <div class="absolute inset-0 rounded-full border-2 border-terracotta pulse-ring"></div>
            </div>
            <p class="font-heading text-lg text-ink">正在连接守护者</p>
            <p class="text-sm text-ink-muted mt-2">请稍候...</p>
            <button onclick="endCall()" class="mt-6 btn-secondary px-6 py-2 rounded-xl text-sm font-medium text-terracotta-deep">取消</button>
          </div>
        `;
      } else if (state.callStatus === 'connected') {
        content.innerHTML = `
          <div class="text-center py-8">
            <div class="relative inline-block mb-4">
              <div class="w-20 h-20 rounded-full bg-terracotta flex items-center justify-center relative z-10">
                <div class="breathe">${ICON.phoneCall}</div>
              </div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
            </div>
            <p class="font-heading text-lg text-ink">通话中</p>
            <p id="call-timer" class="text-3xl font-mono text-terracotta mt-2 mb-1">00:00</p>
            <p class="text-sm text-ink-muted">匿名通话 · 安全加密</p>
            <button onclick="endCall()" class="mt-6 btn-danger px-8 py-3 rounded-xl font-medium flex items-center justify-center gap-2 mx-auto">${ICON.phoneHangup}结束通话</button>
          </div>
        `;
      } else if (state.callStatus === 'ended') {
        if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
        content.innerHTML = `
          <div class="text-center py-8">
            <div class="w-16 h-16 rounded-full bg-olive flex items-center justify-center mx-auto mb-4">${ICON.checkCircle}</div>
            <p class="font-heading text-lg text-ink">通话已结束</p>
            <p class="text-sm text-ink-muted mt-2 mb-4">感谢你的勇敢，你不是一个人</p>
            <button onclick="closeCall()" class="btn-primary px-6 py-2 rounded-xl text-sm font-medium">返回</button>
          </div>
        `;
      } else if (state.callStatus === 'missed') {
        content.innerHTML = `
          <div class="text-center py-8">
            <div class="w-16 h-16 rounded-full bg-sand/20 flex items-center justify-center mx-auto mb-4">${ICON.moonNight}</div>
            <p class="font-heading text-lg text-ink">守护者暂未接听</p>
            <p class="text-sm text-ink-muted mt-2 mb-4">可能正在处理其他求助</p>
            <button onclick="closeCall()" class="btn-primary px-6 py-2 rounded-xl text-sm font-medium">返回</button>
          </div>
        `;
      }
    }

    // 求助者端：等待连接阶段取消
    window.cancelConnecting = async function() {
      if (isEndingCall) return;
      isEndingCall = true;
      // 立即停止所有轮询和计时器
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
      if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
      try {
        // 如果已有通话，结束它
        if (state.callId) {
          try { await API.endCall(state.callId); } catch(e) {}
        }
        // 取消求助
        if (state.requestId) {
          try { await API.cancelRequest(state.requestId); } catch(e) {}
        }
        state.callId = '';
        state.callStatus = '';
        state.requestId = '';
        document.getElementById('match-section').classList.add('hidden');
        showToast('已取消');
        loadHistory();
      } finally {
        isEndingCall = false;
      }
    };

    // 求助者端：挂断标志已提前声明，此处 endCall 使用
    window.endCall = async function() {
      // 防重入：如果正在挂断，直接返回
      if (isEndingCall) return;
      isEndingCall = true;

      // 立即停止所有轮询和计时器，防止 UI 被覆盖
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
      if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }

      try {
        if (state.callId) {
          // 通话已建立，调用后端结束通话
          try { await API.endCall(state.callId); } catch(e) { console.error('endCall API:', e); }
        } else {
          // 等待阶段无通话，取消求助
          if (state.requestId) {
            try { await API.cancelRequest(state.requestId); } catch(e) { console.error('cancel:', e); }
          }
        }
        // 显示结束界面
        state.callStatus = 'ended';
        showCallUI();
        setTimeout(() => {
          // 自动收起匹配区域，返回首页
          document.getElementById('match-section').classList.add('hidden');
          state.requestId = '';
          state.callId = '';
          state.callStatus = '';
          loadHistory();
        }, 2000);
      } catch (e) {
        showToast('结束失败: ' + e.message);
      } finally {
        isEndingCall = false;
      }
    };

    window.closeCall = function() {
      // 清理所有状态和计时器
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
      if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
      document.getElementById('match-section').classList.add('hidden');
      state.requestId = '';
      state.callId = '';
      state.callStatus = '';
      state.callSeconds = 0;
      loadHistory();
    };

    async function loadHistory() {
      try {
        const list = await API.getHistory();
        const el = document.getElementById('history-list');
        if (!el) return;
        if (!list || list.length === 0) {
          el.innerHTML = '<p class="text-sm text-ink-muted text-center py-4">暂无求助记录</p>';
          return;
        }
        const urgencyMap = { normal: { label: '一般', cls: 'tag-olive' }, urgent: { label: '紧急', cls: 'tag-clay' }, critical: { label: '危急', cls: 'tag-terra' } };
        const statusMap = { matching: '匹配中', matched: '已匹配', in_call: '通话中', completed: '已完成', cancelled: '已取消', timeout: '已超时' };
        el.innerHTML = list.map(r => {
          const u = urgencyMap[r.urgency] || urgencyMap.normal;
          return `
            <div class="flex items-center justify-between py-3 border-b border-sand/20 last:border-0">
              <div class="flex items-center gap-2">
                <span class="tag ${u.cls}">${u.label}</span>
                <span class="text-sm text-ink-soft font-medium">${statusMap[r.status] || r.status}</span>
              </div>
              <span class="text-xs text-ink-muted">${new Date(r.createdAt).toLocaleString('zh-CN')}</span>
            </div>
          `;
        }).join('');
      } catch (e) { console.error(e); }
    }

    // ========== 守护者端（与原版完全一致）==========
    function renderHelper() {
      return `
        <div class="min-h-screen p-6 max-w-2xl mx-auto fade-in relative overflow-hidden">
          <div class="glow-blob bg-terracotta w-72 h-72 -top-20 -right-20" style="opacity:0.12"></div>

          <div class="flex items-center justify-between mb-6 relative z-10">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 logo-glow rounded-xl flex items-center justify-center">${ICON.shield}</div>
              <div>
                <h1 class="font-heading text-xl text-ink">守护者 · 接单大厅</h1>
                <p class="text-xs text-ink-muted flex items-center gap-1.5">
                  <span class="status-dot" style="color:#6B7B3C;background:#6B7B3C"></span>
                  ${state.user.nickname} · L${state.user.helperProfile?.level || '?'} · 在线
                </p>
              </div>
            </div>
            <button onclick="logout()" class="text-sm text-ink-muted hover:text-ink font-medium flex items-center gap-1 cursor-pointer">${ICON.logout}退出</button>
          </div>

          <!-- 在线状态 -->
          <div class="card-warm rounded-2xl p-4 mb-6 relative z-10">
            <div class="flex items-center gap-2">
              <div class="status-dot" style="color:#6B7B3C;background:#6B7B3C"></div>
              <span class="text-sm text-ink-soft font-medium">在线 · 等待求助</span>
              <button onclick="loadPending()" class="ml-auto text-sm text-terracotta font-semibold hover:text-terracotta-deep flex items-center gap-1 cursor-pointer">${ICON.refresh}刷新</button>
            </div>
          </div>

          <div id="pending-list" class="relative z-10"></div>
        </div>
      `;
    }

    function bindHelper() {
      loadPending();
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(() => loadPending(true), 5000);
    }

    async function loadPending(silent) {
      try {
        const list = await API.getPending();
        state.pendingList = list || [];
        const el = document.getElementById('pending-list');
        if (!el) return;
        if (state.pendingList.length === 0) {
          el.innerHTML = `
            <div class="card-soft rounded-2xl p-12 text-center fade-in">
              <div class="w-16 h-16 rounded-full bg-sand/20 flex items-center justify-center mx-auto mb-4">${ICON.moonNight}</div>
              <p class="text-ink-soft font-medium">暂无待接单求助</p>
              <p class="text-sm text-ink-muted mt-1">有求助时会自动出现在这里</p>
            </div>
          `;
          return;
        }
        const urgencyMap = { normal: { label: '一般', cls: 'tag-olive' }, urgent: { label: '紧急', cls: 'tag-clay' }, critical: { label: '危急', cls: 'tag-terra' } };
        el.innerHTML = state.pendingList.map(inv => {
          const u = urgencyMap[inv.request.urgency] || urgencyMap.normal;
          const isCritical = inv.request.urgency === 'critical';
          return `
            <div class="card-soft rounded-2xl p-5 mb-3 fade-in ${isCritical ? 'ring-2 ring-terracotta-deep/20' : ''}">
              <div class="flex items-center gap-2 mb-3">
                <span class="tag ${u.cls}">${u.label}</span>
                <span class="text-sm text-ink-muted">评分 ${inv.score}</span>
                <span class="ml-auto text-sm text-terracotta-deep font-medium flex items-center gap-1">${ICON.clockSm}剩余 ${inv.remainingSeconds}秒</span>
              </div>
              ${inv.request.description ? `<p class="text-sm text-ink-soft mb-4 leading-relaxed">${inv.request.description}</p>` : '<p class="text-sm text-ink-muted mb-4">（无描述）</p>'}
              <button onclick="acceptOrder('${inv.id}', '${inv.request.id}')" class="btn-primary w-full py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5">${ICON.check}立即接单</button>
            </div>
          `;
        }).join('');
      } catch (e) { if (!silent) console.error(e); }
    }

    let accepting = false;
    window.acceptOrder = async function(invId, requestId) {
      if (accepting) return;
      accepting = true;
      try {
        if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
        await API.acceptInvitation(invId);
        state.requestId = requestId;
        showToast('接单成功！正在进入通话...');
        setTimeout(() => startHelperCall(), 800);
      } catch (e) {
        showToast('接单失败: ' + e.message);
        loadPending();
      } finally {
        accepting = false;
      }
    };

    async function startHelperCall() {
      try {
        const call = await API.startCall(state.requestId);
        state.callId = call.callId;
        // 接单后直接接听，跳过 ringing 环节，立即进入通话
        try { await API.answerCall(state.callId); } catch(e) {}
        state.callStatus = 'connected';
        showHelperCallUI();
      } catch (e) {
        // 可能求助者已发起，尝试获取活跃通话
        try {
          const active = await API.getActiveCall(state.requestId);
          if (active.hasActiveCall) {
            state.callId = active.callId;
            // 如果是 ringing，自动接听
            if (active.status === 'ringing') {
              try { await API.answerCall(state.callId); } catch(e) {}
            }
            state.callStatus = 'connected';
            showHelperCallUI();
          } else { showToast('进入通话失败: ' + e.message); }
        } catch (e2) { showToast('进入通话失败: ' + e.message); }
      }
    }

    function showHelperCallUI() {
      const el = document.getElementById('pending-list');
      if (!el) return;
      if (state.callStatus === 'connected') {
        startCallTimer();
        el.innerHTML = `
          <div class="card-soft rounded-2xl p-8 text-center fade-in">
            <div class="relative inline-block mb-4">
              <div class="w-20 h-20 rounded-full bg-terracotta flex items-center justify-center relative z-10">
                <div class="breathe">${ICON.phoneCall}</div>
              </div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
              <div class="call-wave" style="width:80px;height:80px;top:0;left:0;"></div>
            </div>
            <p class="font-heading text-lg text-ink">通话中</p>
            <p id="call-timer" class="text-3xl font-mono text-terracotta mt-2 mb-1">00:00</p>
            <p class="text-sm text-ink-muted">匿名求助者</p>
            <button onclick="endCall()" class="mt-6 btn-danger px-8 py-3 rounded-xl font-medium flex items-center justify-center gap-2 mx-auto">${ICON.phoneHangup}结束通话</button>
          </div>
        `;
        // 守护者端也启动挂断检测轮询
        startHelperCallPolling();
      }
    }

    // 守护者端：检测求助者挂断
    function startHelperCallPolling() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        if (isEndingCall) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          return;
        }
        try {
          const status = await API.getCallStatus(state.callId);
          if (status.status === 'ended' || status.status === 'missed' || status.status === 'failed') {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
            if (!isEndingCall) {
              showToast('对方已挂断');
              state.callId = '';
              state.callStatus = '';
              state.requestId = '';
              setTimeout(() => loadPending(), 1500);
            }
          }
        } catch (e) {}
      }, 2000);
    }

    window.answerCall = async function() {
      try {
        await API.answerCall(state.callId);
        state.callStatus = 'connected';
        showHelperCallUI();
      } catch (e) { showToast('接听失败: ' + e.message); }
    };

    window.rejectCall = async function() {
      await endCallCommon();
      loadPending();
    };

    window.endCall = async function() { await endCallCommon(); };

    async function endCallCommon() {
      if (isEndingCall) return;
      isEndingCall = true;
      try {
        if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
        if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
        if (state.callId) {
          try { await API.endCall(state.callId); } catch(e) {}
        }
        state.callId = '';
        state.callStatus = '';
        state.requestId = '';
        showToast('通话已结束');
        loadPending();
      } catch (e) { console.error(e); } finally {
        isEndingCall = false;
      }
    }

    // ========== 通用（与原版完全一致）==========
    function showToast(msg) {
      const existing = document.getElementById('toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-ink text-white px-6 py-3 rounded-xl shadow-lg z-50 text-sm fade-in font-medium';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; }, 2500);
      setTimeout(() => toast.remove(), 3000);
    }
    window.showToast = showToast;

    window.logout = function() {
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
      if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
      state.token = '';
      state.user = null;
      state.view = 'login';
      sessionStorage.removeItem('mg_current_user_id');
      render();
    };

    // ========== 跨标签页通信（BroadcastChannel 主通道 + storage 事件备份）==========
    // 处理跨标签页事件（双击打开 file:// 也能工作）
    function handleCrossTabEvent(event) {
      // 守护者端：有新求助时立即刷新待接单列表
      if (event.type === 'request_created' && state.view === 'helper' && !state.callId) {
        loadPending(true);
      }
      // 求助者端：通话状态变化由轮询处理（2秒内感知）
      // 守护者端：通话被对方挂断由 startHelperCallPolling 处理
    }

    // 主通道：BroadcastChannel（file:// 下可靠）
    channel.onmessage = (e) => {
      if (e.data) handleCrossTabEvent(e.data);
    };

    // 备份通道：storage 事件（http:// 下可靠）
    window.addEventListener('storage', (e) => {
      if (e.key === 'mg_event' && e.newValue) {
        try { handleCrossTabEvent(JSON.parse(e.newValue)); } catch (err) {}
      }
    });

    // ========== 启动 ==========
    initMockData();
    render();
  </script>
</body>
</html>
