<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声纹智转 - 基于深度学习的实时录音转写系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#06B6D4',
                        accent: '#F59E0B',
                        ai: '#8B5CF6',
                        success: '#10B981',
                        warning: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="app" class="flex h-screen w-full overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="flex-shrink-0"></aside>
        
        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- Header -->
            <header id="header" class="flex-shrink-0"></header>
            
            <!-- Page Content -->
            <div id="content" class="flex-1 overflow-auto"></div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"></div>

    <!-- Core Scripts -->
    <script src="js/data.js?v=2"></script>
    <script src="js/router.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/header.js"></script>
    
    <!-- Module Scripts -->
    <script src="js/modules/showcase.js"></script>
    <script src="js/modules/realtime.js"></script>
    <script src="js/modules/offline.js"></script>
    <script src="js/modules/summary.js"></script>
    <script src="js/modules/qa.js"></script>
    <script src="js/modules/history.js"></script>
    <script src="js/modules/notes.js"></script>
    <script src="js/modules/tasks.js"></script>
    <script src="js/modules/speakers.js"></script>
    <script src="js/modules/translate.js"></script>
    <script src="js/modules/team.js"></script>
    <script src="js/modules/templates.js"></script>
    <script src="js/modules/export.js"></script>
    <script src="js/modules/plugins.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/settings.js"></script>
    
    <!-- App Entry -->
    <script src="js/app.js"></script>
</body>
</html>
