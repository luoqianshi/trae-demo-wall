  let i, sum = 348;
  for(i=0x8000; i>0x8; i>>=1) sum += (lunarInfo[y-1900] & i) ? 1 : 0;

  if(leapMonth(y)) return (lunarInfo[y-1900] & 0x10000) ? 30 : 29;

function leapMonth(y) {
  return lunarInfo[y-1900] & 0xf;

function monthDays(y, m) {
  return (lunarInfo[y-1900] & (0x10000 >> m)) ? 30 : 29;

  for(i=1900; i<2101 && offset>0; i++) {
    temp = lYearDays(i);
    offset -= temp;

  if(offset < 0) { offset += temp; i--; }

  let lunarYear = i;
  leap = leapMonth(i);
  let isLeap = false;

  for(i=1; i<13 && offset>0; i++) {

  return {
    year: lunarYear,
    month: i,

    ganZhiYear: Gan[(lunarYear-4)%10] + Zhi[(lunarYear-4)%12],

function lunarToSolar(lYear, lMonth, lDay, isLeap) {
  if(lYear < 1900 || lYear > 2100) return null;
  let leap = leapMonth(lYear);
  if(isLeap && leap !== lMonth) return null;

  let offset = 0;
  for(let i=1900; i<lYear; i++) offset += lYearDays(i);

  for(let i=1; i<lMonth; i++) {
    if(leap > 0 && i === leap) offset += leapDays(lYear);
    offset += monthDays(lYear, i);
  }
  if(isLeap) offset += monthDays(lYear, lMonth);
  offset += lDay - 1;

  let d = new Date(baseDate.getTime() + offset * 86400000);
  return d;
}

function getSolarTerm(year, month, day) {

  let target = new Date(year, month-1, day);

    let termDate = Math.floor(365.242*(year-1900)+termInfo[i]/86400);

function daysUntil(targetDate) {
  let today = new Date();
  today.setHours(0,0,0,0);
  let target = new Date(targetDate);
  target.setHours(0,0,0,0);
  return Math.ceil((target - today) / 86400000);
}

// ==================== UI Logic ====================
let direction = 'solar-to-lunar'; // or 'lunar-to-solar'

function init() {
  populateSolarSelects();
  populateLunarSelects();
  populateBirthdaySelects();
  updateHeader();
  onSolarChange();
  renderBirthdays();
  renderFestivals();
  renderSolarTerms();
}

function populateSolarSelects() {
  const sy = document.getElementById('solar-year');
  const sm = document.getElementById('solar-month');
  const sd = document.getElementById('solar-day');
  const today = new Date();

  for(let y=1900; y<=2100; y++) {
    let opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if(y === today.getFullYear()) opt.selected = true;
    sy.appendChild(opt);
  }
  for(let m=1; m<=12; m++) {
    let opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    if(m === today.getMonth()+1) opt.selected = true;
    sm.appendChild(opt);
  }
  for(let d=1; d<=31; d++) {
    let opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    if(d === today.getDate()) opt.selected = true;
    sd.appendChild(opt);
  }
}

function populateLunarSelects() {
  const ly = document.getElementById('lunar-year');
  const lm = document.getElementById('lunar-month');
  const ld = document.getElementById('lunar-day');
  const today = solarToLunar(new Date());

  for(let y=1900; y<=2100; y++) {
    let opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if(y === today.year) opt.selected = true;
    ly.appendChild(opt);
  }
  for(let m=1; m<=12; m++) {
    let opt = document.createElement('option');
    opt.value = m; opt.textContent = LunarMonths[m-1]+'月';
    if(m === today.month) opt.selected = true;
    lm.appendChild(opt);
  }
  for(let d=1; d<=30; d++) {
    let opt = document.createElement('option');
    opt.value = d; opt.textContent = LunarDays[d-1];
    if(d === today.day) opt.selected = true;
    ld.appendChild(opt);
  }
}

function populateBirthdaySelects() {
  const by = document.getElementById('bd-year');
  const bm = document.getElementById('bd-month');
  const bd = document.getElementById('bd-day');
  const today = solarToLunar(new Date());

  for(let y=1920; y<=today.year; y++) {
    let opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if(y === 1980) opt.selected = true;
    by.appendChild(opt);
  }
  for(let m=1; m<=12; m++) {
    let opt = document.createElement('option');
    opt.value = m; opt.textContent = LunarMonths[m-1]+'月';
    bm.appendChild(opt);
  }
  for(let d=1; d<=30; d++) {
    let opt = document.createElement('option');
    opt.value = d; opt.textContent = LunarDays[d-1];
    bd.appendChild(opt);
  }
}

function onSolarChange() {
  if(direction !== 'solar-to-lunar') return;
  const y = +document.getElementById('solar-year').value;
  const m = +document.getElementById('solar-month').value;
  const d = +document.getElementById('solar-day').value;
  const date = new Date(y, m-1, d);

  // Validate day
  const maxDay = new Date(y, m, 0).getDate();
  const daySel = document.getElementById('solar-day');
  daySel.innerHTML = '';
  for(let i=1; i<=maxDay; i++) {
    let opt = document.createElement('option');
    opt.value = i; opt.textContent = i;
    if(i === d) opt.selected = true;
    daySel.appendChild(opt);
  }

  const l = solarToLunar(date);
  if(!l) return;

  document.getElementById('lunar-year').value = l.year;
  document.getElementById('lunar-month').value = l.month;
  document.getElementById('lunar-day').value = l.day;
  document.getElementById('lunar-leap').checked = l.isLeap;

  updateResult(date, l);
}

function onLunarChange() {
  if(direction !== 'lunar-to-solar') return;
  const y = +document.getElementById('lunar-year').value;
  const m = +document.getElementById('lunar-month').value;
  const d = +document.getElementById('lunar-day').value;
  const isLeap = document.getElementById('lunar-leap').checked;

  const s = lunarToSolar(y, m, d, isLeap);
  if(!s) return;

  document.getElementById('solar-year').value = s.getFullYear();
  document.getElementById('solar-month').value = s.getMonth()+1;
  const daySel = document.getElementById('solar-day');
  const maxDay = new Date(s.getFullYear(), s.getMonth()+1, 0).getDate();
  daySel.innerHTML = '';
  for(let i=1; i<=maxDay; i++) {
    let opt = document.createElement('option');
    opt.value = i; opt.textContent = i;
    if(i === s.getDate()) opt.selected = true;
    daySel.appendChild(opt);
  }

  const l = solarToLunar(s);
  updateResult(s, l);
}

function updateResult(solarDate, lunar) {
  const term = getSolarTerm(solarDate.getFullYear(), solarDate.getMonth()+1, solarDate.getDate());
  const weekdays = ['日','一','二','三','四','五','六'];
  const wd = weekdays[solarDate.getDay()];

  if(direction === 'solar-to-lunar') {
    document.getElementById('result-big').textContent = formatLunar(lunar);
    document.getElementById('result-sub').innerHTML =
      `<span>${lunar.ganZhiYear}年 · ${lunar.animal}年</span>`;
  } else {
    const s = `${solarDate.getFullYear()}年${solarDate.getMonth()+1}月${solarDate.getDate()}日`;
    document.getElementById('result-big').textContent = s;
    document.getElementById('result-sub').innerHTML =
      `<span>星期${wd} · ${lunar.ganZhiYear}年 · ${lunar.animal}年</span>`;
  }

  let tags = '';
  if(term) tags += `<span class="tag tag-green">🌿 ${term}</span>`;
  tags += `<span class="tag tag-red">生肖 ${lunar.animal}</span>`;
  tags += `<span class="tag tag-gray">干支 ${lunar.ganZhiYear}</span>`;
  if(lunar.isLeap) tags += `<span class="tag tag-gray">闰月</span>`;
  document.getElementById('result-tags').innerHTML = tags;

  // Today overview
  const today = new Date();
  const isToday = solarDate.toDateString() === today.toDateString();
  if(isToday) {
    document.getElementById('today-overview').innerHTML = `
      <div class="result-display">
        <div class="big-date">${formatLunar(lunar)}</div>
        <div class="sub-info">${lunar.ganZhiYear}年 · ${lunar.animal}年 · 星期${wd}${term ? ' · ' + term : ''}</div>
        <div class="tag-row">${tags}</div>
      </div>
    `;
  }
}

function swapDirection() {
  direction = direction === 'solar-to-lunar' ? 'lunar-to-solar' : 'solar-to-lunar';
  if(direction === 'solar-to-lunar') onSolarChange();
  else onLunarChange();
}

function updateHeader() {
  const today = new Date();
  const l = solarToLunar(today);
  document.getElementById('header-today-lunar').textContent = formatLunar(l);
  document.getElementById('header-today-solar').textContent =
    `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
}

// ==================== Tabs ====================
function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

// ==================== Birthdays ====================
let birthdays = [
  {name:'外婆', year:1950, month:8, day:8, leap:false},
  {name:'父亲', year:1965, month:1, day:12, leap:false},
  {name:'小明', year:1990, month:5, day:25, leap:false}
];

function addBirthday() {
  const name = document.getElementById('bd-name').value.trim();
  if(!name) return alert('请输入姓名');
  birthdays.push({
    name: name,
    year: +document.getElementById('bd-year').value,
    month: +document.getElementById('bd-month').value,
    day: +document.getElementById('bd-day').value,
    leap: document.getElementById('bd-leap').checked
  });
  document.getElementById('bd-name').value = '';
  renderBirthdays();
}

function renderBirthdays() {
  const container = document.getElementById('birthday-list');
  if(birthdays.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">🎂</div><p>还没有添加生日，快去添加吧</p></div>`;
    return;
  }

  const today = new Date();
  const currentYear = today.getFullYear();
  let html = '';

  birthdays.forEach((bd, idx) => {
    // Find next occurrence
    let solar = lunarToSolar(currentYear, bd.month, bd.day, bd.leap);
    if(!solar || solar < today) {
      solar = lunarToSolar(currentYear+1, bd.month, bd.day, bd.leap);
    }
    if(!solar) return;

    const d = daysUntil(solar);
    const dText = d === 0 ? '今天' : d > 0 ? `${d}天后` : `${-d}天前`;

    html += `
      <div class="birthday-item">
        <div class="birthday-info">
          <h4>${bd.name}</h4>
          <p>农历${bd.leap?'闰':''}${LunarMonths[bd.month-1]}月${LunarDays[bd.day-1]} · ${bd.year}年生</p>
        </div>
        <div class="birthday-next">
          <div class="day">${dText}</div>
          <div class="solar-date">${solar.getMonth()+1}月${solar.getDate()}日</div>
          <div class="label">${solar.getFullYear()}年公历</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

  {name:'元宵', lunar:'正月十五', emoji:'🏮', m:1, d:15},
  {name:'龙头节', lunar:'二月初二', emoji:'🐉', m:2, d:2},
  {name:'清明', lunar:'三月初七', emoji:'🌿', m:3, d:7},
  {name:'端午', lunar:'五月初五', emoji:'🐲', m:5, d:5},
  {name:'七夕', lunar:'七月初七', emoji:'💕', m:7, d:7},
  {name:'中元', lunar:'七月十五', emoji:'🕯️', m:7, d:15},
  {name:'中秋', lunar:'八月十五', emoji:'🥮', m:8, d:15},
  {name:'重阳', lunar:'九月初九', emoji:'🌼', m:9, d:9},
  {name:'腊八', lunar:'腊月初八', emoji:'🥣', m:12, d:8},
  {name:'小年', lunar:'腊月廿三', emoji:'🧹', m:12, d:23},
  {name:'除夕', lunar:'腊月三十', emoji:'🎆', m:12, d:30}
];

function renderFestivals() {
  const grid = document.getElementById('festival-grid');
  const today = new Date();
  let html = '';

  festivals.forEach(f => {
    const solar = lunarToSolar(2026, f.m, f.d, false);
    if(!solar) return;
    const isPast = solar < today;
    const d = daysUntil(solar);
    const dText = d === 0 ? '今天' : d > 0 ? `还有${d}天` : '已过';

    html += `
      <div class="festival-card ${isPast?'past':''}" onclick="showFestival('${f.name}', '${f.lunar}', '${solar.getMonth()+1}月${solar.getDate()}日', '${f.emoji}', '${dText}')">
        <div class="emoji">${f.emoji}</div>
        <div class="name">${f.name}</div>
        <div class="lunar">农历${f.lunar}</div>
        <div class="solar">${solar.getMonth()+1}月${solar.getDate()}日 · ${dText}</div>
      </div>
    `;
  });
  grid.innerHTML = html;
}

  {name:'小寒', m:1, d:5}, {name:'大寒', m:1, d:20},
  {name:'立春', m:2, d:4}, {name:'雨水', m:2, d:18},
  {name:'惊蛰', m:3, d:5}, {name:'春分', m:3, d:20},
  {name:'清明', m:4, d:5}, {name:'谷雨', m:4, d:20},
  {name:'立夏', m:5, d:5}, {name:'小满', m:5, d:21},

  {name:'小暑', m:7, d:7}, {name:'大暑', m:7, d:22},
  {name:'立秋', m:8, d:7}, {name:'处暑', m:8, d:23},
  {name:'白露', m:9, d:7}, {name:'秋分', m:9, d:23},
  {name:'寒露', m:10, d:8}, {name:'霜降', m:10, d:23},

  {name:'大雪', m:12, d:7}, {name:'冬至', m:12, d:21}
];

function renderSolarTerms() {
  const grid = document.getElementById('solar-term-grid');
  const today = new Date();
  let html = '';

  solarTerms2026.forEach(t => {
    const date = new Date(2026, t.m-1, t.d);
    const isPast = date < today;
    const d = daysUntil(date);
    const dText = d === 0 ? '今天' : d > 0 ? `${d}天后` : '已过';

    html += `
      <div class="festival-card ${isPast?'past':''}" onclick="showFestival('${t.name}', '', '${t.m}月${t.d}日', '🌿', '${dText}')">
        <div class="emoji">🌿</div>
        <div class="name">${t.name}</div>
        <div class="solar">${t.m}月${t.d}日 · ${dText}</div>
      </div>
    `;
  });
  grid.innerHTML = html;
}

// ==================== Modal ====================
function showFestival(name, lunar, solar, emoji, status) {
  document.getElementById('modal-content').innerHTML = `
    <h3>${emoji} ${name}</h3>
    <p><strong>公历：</strong>${solar}</p>
    ${lunar ? `<p><strong>农历：</strong>${lunar}</p>` : ''}
    <p><strong>状态：</strong>${status}</p>
    <p style="margin-top:1rem; color:var(--muted); font-size:0.9rem;">
      ${name}是中国重要的传统节日${lunar?'之一':'节气之一'}，承载着丰富的文化内涵。
    </p>
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal(e) {
  if(!e || e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('show');
  }
}

// Init
init();
