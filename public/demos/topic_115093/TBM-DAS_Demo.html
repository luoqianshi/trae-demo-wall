<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBM-DAS 盾构对接智能决策辅助系统</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* ============================================
   CSS 变量 & 基础样式
   ============================================ */
:root {
  --bg-primary: #080c18;
  --bg-panel: #0f1628;
  --border-color: #1a2744;
  --cyan: #00e5ff;
  --green: #00e676;
  --yellow: #ffab00;
  --orange: #ff6d00;
  --red: #ff1744;
  --text-primary: #e0e6f0;
  --text-secondary: #7a8ba8;
  --font-cn: 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-cn);
  overflow: hidden;
  user-select: none;
}

/* ============================================
   顶部标题栏
   ============================================ */
header {
  height: 54px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: linear-gradient(180deg, #111b30 0%, var(--bg-panel) 100%);
  border-bottom: 1px solid var(--border-color);
  position: relative;
  z-index: 20;
}
header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--cyan) 50%, transparent 100%);
  opacity: 0.4;
}
.system-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.5px;
  text-shadow: 0 0 20px rgba(0,229,255,0.3);
}
.system-title .logo-diamond {
  width: 18px; height: 18px;
  background: var(--cyan);
  transform: rotate(45deg);
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(0,229,255,0.5);
}
.system-subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 300;
  margin-left: 4px;
}

/* 风险等级指示器 */
.risk-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
}
.risk-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
}
.risk-dots {
  display: flex;
  gap: 6px;
  align-items: center;
}
.risk-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  opacity: 0.2;
  transition: all 0.5s ease;
}
.risk-dot.low    { background: var(--green);  }
.risk-dot.medium { background: var(--yellow); }
.risk-dot.high   { background: var(--orange); }
.risk-dot.critical { background: var(--red); }
.risk-dot.active {
  opacity: 1;
  transform: scale(1.35);
}
.risk-dot.low.active    { box-shadow: 0 0 10px var(--green); }
.risk-dot.medium.active { box-shadow: 0 0 10px var(--yellow); }
.risk-dot.high.active   { box-shadow: 0 0 10px var(--orange); }
.risk-dot.critical.active { box-shadow: 0 0 10px var(--red); }
.risk-text {
  font-size: 13px;
  font-weight: 600;
  min-width: 32px;
  transition: color 0.5s ease;
}

/* ============================================
   主内容区
   ============================================ */
main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* 左侧面板 - 流程图 */
.left-panel {
  width: 44%;
  min-width: 420px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-color);
  background-image:
    linear-gradient(rgba(26,39,68,0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,39,68,0.18) 1px, transparent 1px);
  background-size: 32px 32px;
}
.panel-header {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-color);
  background: rgba(15,22,40,0.9);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-header::before {
  content: '';
  width: 3px; height: 14px;
  background: var(--cyan);
  border-radius: 2px;
}
.flowchart-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 16px;
}
.flowchart-scroll::-webkit-scrollbar { width: 6px; }
.flowchart-scroll::-webkit-scrollbar-track { background: transparent; }
.flowchart-scroll::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 3px;
}
.flowchart-scroll::-webkit-scrollbar-thumb:hover { background: #2a3f66; }

/* SVG 流程图节点样式 */
.flow-node { transition: all 0.3s ease; cursor: default; }
.flow-node .node-shape { transition: all 0.3s ease; }
.flow-node .node-text { transition: all 0.3s ease; pointer-events: none; }
.flow-node .node-overlay { transition: all 0.3s ease; pointer-events: none; }
.flow-node .node-check { transition: all 0.3s ease; pointer-events: none; }

/* 待执行状态 */
.flow-node.pending { opacity: 0.35; }
.flow-node.pending .node-shape { stroke: #2a3654 !important; }

/* 当前活跃状态 */
.flow-node.active .node-shape {
  stroke: var(--cyan) !important;
  stroke-width: 2.5 !important;
  filter: drop-shadow(0 0 10px rgba(0,229,255,0.5));
  animation: nodeGlow 2s ease-in-out infinite;
}
.flow-node.active .node-text { fill: #fff !important; }
@keyframes nodeGlow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(0,229,255,0.3)); }
  50%      { filter: drop-shadow(0 0 16px rgba(0,229,255,0.7)); }
}

/* 已完成状态 */
.flow-node.completed .node-overlay { opacity: 1 !important; }
.flow-node.completed .node-check { opacity: 1 !important; }

/* 箭头样式 */
.arrow-line { transition: stroke 0.3s ease, stroke-width 0.3s ease; }
.arrow-line.completed { stroke: var(--cyan) !important; stroke-width: 2 !important; }
.arrow-line.pending   { stroke: #1e2d4a !important; }
.arrow-no { stroke: #661525 !important; }
.arrow-return { stroke: #661525 !important; stroke-dasharray: 6 4 !important; }

/* 红色处理框闪烁 */
@keyframes redFlash {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
.red-box-flash .node-shape {
  stroke: var(--red) !important;
  stroke-width: 3 !important;
  animation: redFlash 0.3s ease 4;
}

/* ============================================
   右侧面板 - 仪表盘
   ============================================ */
.right-panel {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background-image:
    linear-gradient(rgba(26,39,68,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,39,68,0.1) 1px, transparent 1px);
  background-size: 32px 32px;
}
.right-panel::-webkit-scrollbar { width: 6px; }
.right-panel::-webkit-scrollbar-track { background: transparent; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

/* 数据卡片网格 */
.data-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.data-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 14px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  box-shadow: inset 0 1px 0 rgba(0,229,255,0.06), 0 2px 8px rgba(0,0,0,0.25);
}
.data-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--cyan);
  opacity: 0.4;
  transition: opacity 0.3s ease;
}
.data-card:hover { border-color: #253556; }
.data-card.warning {
  border-color: var(--yellow) !important;
  box-shadow: inset 0 1px 0 rgba(255,171,0,0.15), 0 0 12px rgba(255,171,0,0.1);
}
.data-card.warning::before { background: var(--yellow); opacity: 0.8; }
.data-card.danger {
  border-color: var(--red) !important;
  animation: cardDanger 1.5s ease infinite;
  box-shadow: inset 0 1px 0 rgba(255,23,68,0.15), 0 0 14px rgba(255,23,68,0.15);
}
.data-card.danger::before { background: var(--red); opacity: 1; }
@keyframes cardDanger {
  0%, 100% { box-shadow: inset 0 1px 0 rgba(255,23,68,0.15), 0 0 8px rgba(255,23,68,0.1); }
  50%      { box-shadow: inset 0 1px 0 rgba(255,23,68,0.2), 0 0 18px rgba(255,23,68,0.25); }
}
.data-card .card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.data-card .card-name {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  transition: all 0.3s ease;
}
.status-dot.green  { background: var(--green); box-shadow: 0 0 6px rgba(0,230,118,0.5); }
.status-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px rgba(255,171,0,0.5); }
.status-dot.red    { background: var(--red); box-shadow: 0 0 6px rgba(255,23,68,0.5); }
.data-card .card-value {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
  transition: color 0.3s ease;
}
.data-card .card-unit {
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  margin-top: 4px;
}
@keyframes valueFlash {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.08); color: var(--cyan); }
  100% { transform: scale(1); }
}
.value-flash { animation: valueFlash 0.35s ease; }

/* 图表区域 */
.chart-section {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.chart-title {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chart-title::before {
  content: '';
  width: 8px; height: 3px;
  background: var(--cyan);
  border-radius: 2px;
}
.chart-wrapper { height: 180px; position: relative; }

/* AI 辅助决策区域 */
.ai-section {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  border-left: 3px solid var(--cyan);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25), -2px 0 12px rgba(0,229,255,0.05);
  flex-shrink: 0;
}
.ai-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.ai-icon {
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--cyan), #0091ea);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #080c18;
  font-weight: 700;
}
.ai-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--cyan);
}
.ai-content {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-primary);
  min-height: 40px;
  margin-bottom: 12px;
}
.ai-cursor {
  display: inline-block;
  width: 2px; height: 14px;
  background: var(--cyan);
  vertical-align: middle;
  margin-left: 2px;
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.ai-buttons { display: flex; gap: 10px; }

/* ============================================
   按钮
   ============================================ */
.btn {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-cn);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.25s ease;
  outline: none;
}
.btn:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
.btn-primary {
  background: var(--cyan);
  color: #080c18;
  font-weight: 600;
}
.btn-primary:hover { background: #33ecff; box-shadow: 0 0 14px rgba(0,229,255,0.35); }
.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}
.btn-outline:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.btn-danger-outline {
  background: transparent;
  color: var(--red);
  border: 1px solid rgba(255,23,68,0.4);
}
.btn-danger-outline:hover { background: rgba(255,23,68,0.1); border-color: var(--red); }
.btn-accept {
  background: rgba(0,229,255,0.12);
  color: var(--cyan);
  border: 1px solid rgba(0,229,255,0.3);
  font-size: 12px;
  padding: 6px 14px;
}
.btn-accept:hover { background: rgba(0,229,255,0.22); }
.btn-dismiss {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  font-size: 12px;
  padding: 6px 14px;
}
.btn-dismiss:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed !important;
  box-shadow: none !important;
}

/* ============================================
   底部控制栏
   ============================================ */
footer {
  height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-color);
}
.footer-left { display: flex; gap: 10px; align-items: center; }
.footer-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.step-counter {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-secondary);
}
.step-counter .current { color: var(--cyan); font-weight: 700; font-size: 18px; }
.step-counter .total { color: var(--text-secondary); }
.step-progress {
  width: 200px; height: 4px;
  background: var(--border-color);
  border-radius: 2px;
  overflow: hidden;
}
.step-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), #00b0ff);
  border-radius: 2px;
  transition: width 0.4s ease;
  box-shadow: 0 0 8px rgba(0,229,255,0.4);
}

/* ============================================
   模态框
   ============================================ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(4,6,14,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: linear-gradient(180deg, #141e35 0%, var(--bg-panel) 100%);
  border: 2px solid var(--cyan);
  border-radius: 12px;
  padding: 28px 32px;
  max-width: 520px;
  width: 92%;
  box-shadow: 0 0 40px rgba(0,229,255,0.15), 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.modal-icon {
  width: 36px; height: 36px;
  background: rgba(233,30,99,0.15);
  border: 1px solid rgba(233,30,99,0.3);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(45deg);
}
.modal-icon-inner {
  transform: rotate(-45deg);
  font-size: 14px;
  color: #e91e63;
  font-weight: 700;
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}
.modal-body {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 24px;
  padding: 16px;
  background: rgba(8,12,24,0.5);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.modal-body strong { color: var(--cyan); font-weight: 600; }
.modal-body .warning-val { color: var(--yellow); font-weight: 600; }
.modal-body .danger-val { color: var(--red); font-weight: 600; }
.modal-footer { display: flex; gap: 12px; justify-content: flex-end; }
.modal-footer .btn { min-width: 120px; padding: 10px 24px; }
</style>
</head>
<body>

<!-- ======== 顶部标题栏 ======== -->
<header>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="system-title">
      <div class="logo-diamond"></div>
      <span>TBM-DAS 盾构对接智能决策辅助系统</span>
    </div>
    <span class="system-subtitle">TRAE AI 创造力大赛 · 初赛作品</span>
  </div>
  <div class="risk-indicator">
    <span class="risk-label">风险等级:</span>
    <div class="risk-dots">
      <div class="risk-dot low active" id="riskDot0" title="低"></div>
      <div class="risk-dot medium" id="riskDot1" title="中"></div>
      <div class="risk-dot high" id="riskDot2" title="高"></div>
      <div class="risk-dot critical" id="riskDot3" title="极高"></div>
    </div>
    <span class="risk-text" id="riskText" style="color:var(--green);">低</span>
  </div>
</header>

<!-- ======== 主内容区 ======== -->
<main>
  <!-- 左侧面板 - 交互式流程图 -->
  <div class="left-panel">
    <div class="panel-header">交互式流程图</div>
    <div class="flowchart-scroll" id="flowchartContainer"></div>
  </div>

  <!-- 右侧面板 - 实时监控 -->
  <div class="right-panel">
    <div class="panel-header">实时监控数据</div>

    <!-- 6个数据卡片 -->
    <div class="data-cards">
      <div class="data-card" id="card-speed">
        <div class="card-top">
          <span class="card-name">掘进速度</span>
          <span class="status-dot green" id="dot-speed"></span>
        </div>
        <div class="card-value" id="val-speed">--</div>
        <div class="card-unit">mm/min</div>
      </div>
      <div class="data-card" id="card-rpm">
        <div class="card-top">
          <span class="card-name">刀盘转速</span>
          <span class="status-dot green" id="dot-rpm"></span>
        </div>
        <div class="card-value" id="val-rpm">--</div>
        <div class="card-unit">rpm</div>
      </div>
      <div class="data-card" id="card-pressure">
        <div class="card-top">
          <span class="card-name">土仓压力</span>
          <span class="status-dot green" id="dot-pressure"></span>
        </div>
        <div class="card-value" id="val-pressure">--</div>
        <div class="card-unit">MPa</div>
      </div>
      <div class="data-card" id="card-deviation">
        <div class="card-top">
          <span class="card-name">姿态偏差</span>
          <span class="status-dot green" id="dot-deviation"></span>
        </div>
        <div class="card-value" id="val-deviation">--</div>
        <div class="card-unit">mm</div>
      </div>
      <div class="data-card" id="card-seepage">
        <div class="card-top">
          <span class="card-name">渗水量</span>
          <span class="status-dot green" id="dot-seepage"></span>
        </div>
        <div class="card-value" id="val-seepage">--</div>
        <div class="card-unit">L/min</div>
      </div>
      <div class="data-card" id="card-distance">
        <div class="card-top">
          <span class="card-name">剩余距离</span>
          <span class="status-dot green" id="dot-distance"></span>
        </div>
        <div class="card-value" id="val-distance">--</div>
        <div class="card-unit">m</div>
      </div>
    </div>

    <!-- 参数趋势图 -->
    <div class="chart-section">
      <div class="chart-title">参数趋势曲线</div>
      <div class="chart-wrapper">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

    <!-- AI 辅助决策 -->
    <div class="ai-section">
      <div class="ai-header">
        <div class="ai-icon">AI</div>
        <span class="ai-title">智能辅助决策</span>
      </div>
      <div class="ai-content" id="aiContent"><span style="color:var(--text-secondary);">等待系统启动...</span></div>
      <div class="ai-buttons">
        <button class="btn btn-accept" id="btnAccept" onclick="acceptSuggestion()">采纳建议</button>
        <button class="btn btn-dismiss" id="btnDismiss" onclick="dismissSuggestion()">忽略并继续</button>
      </div>
    </div>
  </div>
</main>

<!-- ======== 底部控制栏 ======== -->
<footer>
  <div class="footer-left">
    <button class="btn btn-outline" id="btnPrev" onclick="prevStep()" disabled>
      &#9664; 上一步
    </button>
    <button class="btn btn-primary" id="btnNext" onclick="nextStep()">
      下一步 &#9654;
    </button>

// ============================================
// 4. SVG 布局计算
// ============================================
const CX = 170;    // 主流程列中心 X
const RED_CX = 410; // 红色框列中心 X
const RECT_W = 240, RECT_H = 46, RECT_RX = 5;
const MILE_W = 264, MILE_H = 50;
const DIAM_HW = 128;  // 菱形半宽
const SUC_W = 180, SUC_H = 46;
const RED_W = 174, RED_H = 46;
const GAP = 20, DGAP = 26;
const START_Y = 24;

// 计算每个节点的 Y 坐标和尺寸
function computePositions() {
  const pos = [];
  let y = START_Y;
  NODES.forEach((n, i) => {
    let w, h;
    switch (n.type) {
      case 'rect':      w = RECT_W; h = RECT_H; break;
      case 'milestone': w = MILE_W; h = MILE_H; break;
      case 'diamond':   w = DIAM_HW * 2; h = n.lines.length > 2 ? 128 : 108; break;
      case 'success':   w = SUC_W; h = SUC_H; break;
    }
    pos.push({ y, w, h, cy: y + h / 2 });
    const prev = i > 0 ? NODES[i - 1].type : null;
    const gap = (n.type === 'diamond' || prev === 'diamond') ? DGAP : GAP;
    y += h + gap;
  });
  return pos;
}

const POS = computePositions();
const SVG_H = POS[POS.length - 1].y + POS[POS.length - 1].h + 30;

// ============================================
// 5. SVG 流程图生成
// ============================================
function buildFlowchartSVG() {
  let s = '';
  s += `<svg xmlns="http://www.w3.org/2000/svg" width="530" height="${SVG_H}" viewBox="0 0 530 ${SVG_H}" style="display:block;margin:0 auto;">`;

  // --- Defs：箭头标记 ---
  s += `<defs>`;
  s += `<marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1e2d4a"/></marker>`;
  s += `<marker id="arrCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00e5ff"/></marker>`;
  s += `<marker id="arrRed"  markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c62828"/></marker>`;
  // 发光滤镜
  s += `<filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  s += `</defs>`;

  // --- 绘制连线（先画，在节点下层） ---
  for (let i = 0; i < NODES.length - 1; i++) {
    const a = POS[i], b = POS[i + 1];
    const x1 = CX, y1 = a.y + a.h;
    const x2 = CX, y2 = b.y;
    const isDecision = DECISION_INDICES.has(i + 1);
    s += `<line id="arrow-${i}-${i+1}" class="arrow-line pending" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1e2d4a" stroke-width="1.5" marker-end="url(#arrGray)"/>`;
    // 判断节点的"是"标签
    if (DECISION_INDICES.has(i)) {
      s += `<text x="${CX + 16}" y="${y1 + 14}" fill="#00e676" font-size="11" font-family="'Noto Sans SC'" font-weight="600">是</text>`;
    }
  }

  // --- 判断节点"否"分支连线 & 红色处理框 ---
  RED_BOXES.forEach(rb => {
    const ni = rb.nodeIdx;
    const dp = POS[ni]; // 判断节点位置
    const redY = dp.cy - RED_H / 2;
    const redX = RED_CX - RED_W / 2;

    // "否"标签
    const labelX = (CX + DIAM_HW + RED_CX - RED_W / 2) / 2;
    s += `<text x="${labelX}" y="${dp.cy - 8}" fill="#e57373" font-size="11" font-family="'Noto Sans SC'" text-anchor="middle" font-weight="500">否</text>`;

    // 菱形右侧 → 红色框左侧
    s += `<line id="arrow-no-${ni}" class="arrow-no" x1="${CX + DIAM_HW}" y1="${dp.cy}" x2="${RED_CX - RED_W / 2}" y2="${dp.cy}" stroke="#661525" stroke-width="1.5" marker-end="url(#arrRed)"/>`;

    // 红色框 → 虚线返回（返回到判断节点上方）
    const returnRight = RED_CX + RED_W / 2 + 14;
    const returnTop = dp.y - 12;
    const pathD = `M${RED_CX + RED_W / 2},${dp.cy} H${returnRight} V${returnTop} H${CX} V${dp.y}`;
    s += `<path id="arrow-ret-${ni}" class="arrow-return" d="${pathD}" fill="none" stroke="#661525" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>`;

    // 红色处理框节点
    s += `<g class="flow-node red-box-node" id="svg-${rb.id}">`;
    s += `<rect class="node-shape" x="${redX}" y="${redY}" width="${RED_W}" height="${RED_H}" rx="4" fill="#4a0e0e" stroke="#8b1a1a" stroke-width="1.5"/>`;
    const tLines = rb.lines;
    const tY0 = dp.cy - (tLines.length - 1) * 8;
    tLines.forEach((ln, li) => {
      s += `<text class="node-text" x="${RED_CX}" y="${tY0 + li * 16}" text-anchor="middle" fill="#ef9a9a" font-size="11" font-family="'Noto Sans SC'">${ln}</text>`;
    });
    s += `</g>`;
  });

  // --- 绘制主流程节点 ---
  NODES.forEach((node, i) => {
    const p = POS[i];
    s += `<g class="flow-node pending" id="svg-${node.id}">`;

    if (node.type === 'rect' || node.type === 'milestone') {
      const w = node.type === 'milestone' ? MILE_W : RECT_W;
      const h = node.type === 'milestone' ? MILE_H : RECT_H;
      const x = CX - w / 2;
      s += `<rect class="node-shape" x="${x}" y="${p.y}" width="${w}" height="${h}" rx="${RECT_RX}" fill="${node.fill}" stroke="${node.stroke}" stroke-width="1.5"/>`;
      // 完成叠加层
      s += `<rect class="node-overlay" x="${x}" y="${p.y}" width="${w}" height="${h}" rx="${RECT_RX}" fill="rgba(0,230,118,0.12)" stroke="#00e676" stroke-width="2" opacity="0"/>`;
      // 文本
      const tY0 = p.cy - (node.lines.length - 1) * 9;
      node.lines.forEach((ln, li) => {
        s += `<text class="node-text" x="${CX}" y="${tY0 + li * 18}" text-anchor="middle" dominant-baseline="middle" fill="#e0e6f0" font-size="13" font-family="'Noto Sans SC'" font-weight="${node.type === 'milestone' ? 500 : 400}">${ln}</text>`;
      });
    } else if (node.type === 'diamond') {
      const pts = `${CX},${p.y} ${CX + DIAM_HW},${p.cy} ${CX},${p.y + p.h} ${CX - DIAM_HW},${p.cy}`;
      s += `<polygon class="node-shape" points="${pts}" fill="${node.fill}" stroke="${node.stroke}" stroke-width="1.5"/>`;
      s += `<polygon class="node-overlay" points="${pts}" fill="rgba(0,230,118,0.12)" stroke="#00e676" stroke-width="2" opacity="0"/>`;
      const tY0 = p.cy - (node.lines.length - 1) * 10;
      node.lines.forEach((ln, li) => {
        s += `<text class="node-text" x="${CX}" y="${tY0 + li * 19}" text-anchor="middle" dominant-baseline="middle" fill="#f8bbd0" font-size="12" font-family="'Noto Sans SC'" font-weight="400">${ln}</text>`;
      });
    } else if (node.type === 'success') {
      const x = CX - SUC_W / 2;
      s += `<rect class="node-shape" x="${x}" y="${p.y}" width="${SUC_W}" height="${SUC_H}" rx="23" fill="${node.fill}" stroke="${node.stroke}" stroke-width="2"/>`;
      s += `<rect class="node-overlay" x="${x}" y="${p.y}" width="${SUC_W}" height="${SUC_H}" rx="23" fill="rgba(0,230,118,0.15)" stroke="#00e676" stroke-width="2" opacity="0"/>`;
      s += `<text class="node-text" x="${CX}" y="${p.cy}" text-anchor="middle" dominant-baseline="middle" fill="#a5d6a7" font-size="15" font-family="'Noto Sans SC'" font-weight="700">${node.lines[0]}</text>`;
    }

    // 完成勾号
    const ckX = node.type === 'diamond' ? CX - DIAM_HW + 12 : CX - (node.type === 'success' ? SUC_W / 2 : (node.type === 'milestone' ? MILE_W / 2 : RECT_W / 2)) + 10;
    const ckY = p.y + 12;
    s += `<text class="node-check" x="${ckX}" y="${ckY}" fill="#fff" font-size="13" font-weight="700" opacity="0">&#10003;</text>`;

    s += `</g>`;
  });

  s += `</svg>`;
  return s;
}

// ============================================
// 6. 流程图状态更新
// ============================================
function updateFlowchartState() {
  NODES.forEach((node, i) => {
    const g = document.getElementById('svg-' + node.id);
    if (!g) return;
    g.classList.remove('completed', 'active', 'pending');
    if (i < currentStep) {
      g.classList.add('completed');
    } else if (i === currentStep) {
      g.classList.add('active');
    } else {
      g.classList.add('pending');
    }
  });

  // 更新箭头状态
  for (let i = 0; i < NODES.length - 1; i++) {
    const line = document.getElementById(`arrow-${i}-${i + 1}`);
    if (!line) continue;
    line.classList.remove('completed', 'pending');
    if (i < currentStep) {
      line.classList.add('completed');
      line.setAttribute('stroke', '#00e5ff');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('marker-end', 'url(#arrCyan)');
    } else {
      line.classList.add('pending');
      line.setAttribute('stroke', '#1e2d4a');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('marker-end', 'url(#arrGray)');
    }
  }

  // 滚动到当前节点
  const activeNode = document.getElementById('svg-' + NODES[currentStep].id);
  if (activeNode) {
    const container = document.getElementById('flowchartContainer');
    const nodeTop = activeNode.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop;
    container.scrollTo({ top: nodeTop - container.clientHeight / 3, behavior: 'smooth' });
  }
}

function nextStep() {
  if (currentStep >= NODES.length - 1 || modalOpen) return;

  const nextIdx = currentStep + 1;

  if (DECISION_INDICES.has(nextIdx)) {
    // 下一步是判断节点 → 先推进到该节点，然后弹窗
    currentStep = nextIdx;
    decisionNodeIdx = nextIdx;
    updateAll();
    showDecisionModal(nextIdx);
  } else {
    currentStep = nextIdx;
    addChartPoint();
    updateAll();
  }
}

function prevStep() {
  if (currentStep <= 0 || modalOpen) return;
  currentStep--;
  if (chartHistory.length > 1) chartHistory.pop();
  updateAll();
  updateChartData();
}

  if (modalOpen) hideModal();

  decisionNodeIdx = -1;

}

  const body = document.getElementById('modalBody');

  const d = curData;
  let html = '';

  switch (nodeIdx) {
    case 6:
      title.textContent = '条件确认：姿态锁定 & 泥水压力';
      const devOk = d.deviation <= 10;
      const prsOk = d.pressure >= 0.3 && d.pressure <= 0.5;
      html = `<div>姿态偏差：<strong class="${devOk ? '' : 'danger-val'}">${d.deviation} mm</strong>（要求 ≤ 10mm）${devOk ? ' ✓' : ' ✗'}</div>`;
      html += `<div>泥水压力：<strong class="${prsOk ? '' : 'warning-val'}">${d.pressure.toFixed(2)} MPa</strong>（要求 0.3～0.5MPa）${prsOk ? ' ✓' : ' ✗'}</div>`;
      html += `<div style="margin-top:8px;color:var(--text-secondary);">以上指标是否满足对接前提条件？</div>`;
      break;
    case 8:
      title.textContent = '条件确认：对接条件';
      const gapOk = d.distance >= 0.5 && d.distance <= 1.0;
      const cDevOk = d.deviation <= 10;
      const sepOk = d.seepage <= 80;
      html = `<div>盾构间距：<strong class="${gapOk ? '' : 'warning-val'}">${d.distance} m</strong>（要求 0.5～1.0m）${gapOk ? ' ✓' : ' ✗'}</div>`;
      html += `<div>中心偏差：<strong class="${cDevOk ? '' : 'danger-val'}">${d.deviation} mm</strong>（要求 ≤ ±10mm）${cDevOk ? ' ✓' : ' ✗'}</div>`;
      html += `<div>渗水量：<strong class="${sepOk ? '' : (d.seepage > 80 ? 'danger-val' : 'warning-val')}">${d.seepage} L/min</strong>（要求 ≤ 80L/min）${sepOk ? ' ✓' : ' ✗'}</div>`;
      html += `<div style="margin-top:8px;color:var(--text-secondary);">对接条件是否全部满足？</div>`;
      break;
    case 10:
      title.textContent = '条件确认：加固效果';
      html = `<div>取芯抗压强度：模拟值 <strong>1.8 MPa</strong>（要求 ≥ 1.5MPa） ✓</div>`;
      html += `<div>渗透系数：模拟值 <strong>6.2×10⁻⁶ cm/s</strong>（要求 ≤ 10⁻⁵cm/s） ✓</div>`;
      html += `<div style="margin-top:8px;color:var(--text-secondary);">加固效果是否达到设计要求？</div>`;
      break;
    case 12:
      title.textContent = '条件确认：止水效果';
      html = `<div>焊缝超声波探伤：模拟结果 <strong>100% 合格</strong> ✓</div>`;
      html += `<div>整体渗漏检测：当前渗水量 <strong>${d.seepage} L/min</strong>（检测通过） ✓</div>`;
      html += `<div style="margin-top:8px;color:var(--text-secondary);">止水效果是否满足要求？</div>`;
      break;
  }

  body.innerHTML = html;
  overlay.classList.add('active');
  updateControls();
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  modalOpen = false;
  updateControls();
}

function handleDecision(choice) {
  const ni = decisionNodeIdx;
  hideModal();

  if (choice === 'yes') {
    // 判断通过，推进到下一步
    addChartPoint();
    if (currentStep < NODES.length - 1) {
      currentStep++;
    }
    updateAll();
  } else {
    // "否" → 闪烁红色处理框，回退
    const rbMap = { 6:'r7', 8:'r9', 10:'r11', 12:'r13' };
    const rbId = rbMap[ni];
    if (rbId) {
      const rbEl = document.getElementById('svg-' + rbId);
      if (rbEl) {
        rbEl.classList.add('red-box-flash');
        setTimeout(() => rbEl.classList.remove('red-box-flash'), 1500);
      }
    }
    // 延迟后回退到判断节点前一步
    setTimeout(() => {
      if (currentStep > 0) {
        currentStep = ni - 1;
      }
      if (chartHistory.length > 1) chartHistory.pop();
      updateAll();
      updateChartData();
    }, 1600);
  }
}

function acceptSuggestion() {
  // 采纳建议：若模态框打开则自动选"是"，否则自动前进一步
  if (modalOpen) {
    handleDecision('yes');
  } else if (currentStep < NODES.length - 1) {
    nextStep();
  }
}

function dismissSuggestion() {
  const el = document.getElementById('aiContent');
  el.innerHTML = '<span style="color:var(--text-secondary);font-style:italic;">已忽略建议</span>';
}

// ============================================
// 8. 数据模拟
// ============================================
function rand(min, max) {
  return min + Math.random() * (max - min);
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function initStepData() {
  const p = STEP_PARAMS[currentStep];
  curData.speed    = rand(p.speed[0], p.speed[1]);
  curData.rpm      = rand(p.rpm[0], p.rpm[1]);
  curData.pressure = rand(p.pressure[0], p.pressure[1]);
  curData.deviation= rand(p.deviation[0], p.deviation[1]);
  curData.seepage  = rand(p.seepage[0], p.seepage[1]);
  curData.distance = p.distance;
  updateDataCards();
}

function updateDataSimulation() {
  const p = STEP_PARAMS[currentStep];
  const t = 0.3; // 平滑系数

  // 在当前步骤范围内随机波动
  const tgtSpeed = rand(p.speed[0], p.speed[1]);
  const tgtRpm   = rand(p.rpm[0], p.rpm[1]);
  const tgtPrs   = rand(p.pressure[0], p.pressure[1]);
  const tgtDev   = rand(p.deviation[0], p.deviation[1]);
  const tgtSep   = rand(p.seepage[0], p.seepage[1]);

  curData.speed    = lerp(curData.speed,    tgtSpeed, t);
  curData.rpm      = lerp(curData.rpm,      tgtRpm,   t);
  curData.pressure = lerp(curData.pressure, tgtPrs,   t);
  curData.deviation= lerp(curData.deviation,tgtDev,   t);
  curData.seepage  = lerp(curData.seepage,  tgtSep,   t);

  updateDataCards();
  updateRiskLevel();
}

function startDataLoop() {
  if (dataTimer) clearInterval(dataTimer);
  dataTimer = setInterval(updateDataSimulation, 2000);
}

// ============================================
// 9. 数据卡片更新
// ============================================
function getParamStatus(key, val) {
  const th = THRESHOLDS[key];
  if (!th) return 'green';
  if (th.warnLow !== undefined) {
    // 有上下限的参数（pressure）
    if (val < th.dangerLow || val > th.dangerHigh) return 'red';
    if (val < th.warnLow || val > th.warnHigh) return 'yellow';
  } else {
    if (val >= th.danger) return 'red';
    if (val >= th.warn) return 'yellow';
  }
  return 'green';
}

function updateDataCards() {
  const items = [
    { key:'speed',    val: curData.speed,    fmt: v => v.toFixed(1) },
    { key:'rpm',      val: curData.rpm,      fmt: v => v.toFixed(2) },
    { key:'pressure', val: curData.pressure, fmt: v => v.toFixed(2) },
    { key:'deviation',val: curData.deviation,fmt: v => '±' + Math.round(v) },
    { key:'seepage',  val: curData.seepage,  fmt: v => Math.round(v).toString() },
    { key:'distance', val: curData.distance, fmt: v => Math.round(v).toString() },
  ];

  items.forEach(item => {
    const valEl = document.getElementById('val-' + item.key);
    const dotEl = document.getElementById('dot-' + item.key);
    const cardEl = document.getElementById('card-' + item.key);
    if (!valEl) return;

    const newText = item.fmt(item.val);
    if (valEl.textContent !== newText) {
      valEl.textContent = newText;
      valEl.classList.remove('value-flash');
      void valEl.offsetWidth;
      valEl.classList.add('value-flash');
    }

    const status = getParamStatus(item.key, item.val);
    dotEl.className = 'status-dot ' + status;
    cardEl.classList.remove('warning', 'danger');
    if (status === 'yellow') cardEl.classList.add('warning');
    if (status === 'red') cardEl.classList.add('danger');
  });
}

// ============================================
// 10. 风险等级计算
// ============================================
function calculateRisk() {
  let warns = 0, dangers = 0;
  ['speed','rpm','pressure','deviation','seepage'].forEach(k => {
    const s = getParamStatus(k, curData[k]);
    if (s === 'red') dangers++;
    else if (s === 'yellow') warns++;
  });
  // 判断节点本身增加风险感
  if (DECISION_INDICES.has(currentStep) && (dangers > 0 || warns > 0)) dangers++;

  if (dangers >= 2) return 3;      // 极高
  if (dangers >= 1) return 2;      // 高
  if (warns >= 1)  return 1;       // 中
  return 0;                         // 低
}

const RISK_CONFIG = [
  { cls:'low',      color:'var(--green)',  text:'低' },
  { cls:'medium',   color:'var(--yellow)', text:'中' },
  { cls:'high',     color:'var(--orange)', text:'高' },
  { cls:'critical', color:'var(--red)',    text:'极高' },
];

function updateRiskLevel() {
  const level = calculateRisk();
  const cfg = RISK_CONFIG[level];
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('riskDot' + i);
    dot.classList.toggle('active', i <= level);
  }
  const txt = document.getElementById('riskText');
  txt.textContent = cfg.text;
  txt.style.color = cfg.color;
}

function addChartPoint() {
  chartHistory.push({
    step: currentStep + 1,
    speed: curData.speed,
    deviation: curData.deviation,
    seepage: curData.seepage,
  });
  updateChartData();
}

function updateChartData() {
  const last20 = chartHistory.slice(-20);
  trendChart.data.labels = last20.map(d => 'S' + d.step);
  trendChart.data.datasets[0].data = last20.map(d => parseFloat(d.speed.toFixed(1)));
  trendChart.data.datasets[1].data = last20.map(d => parseFloat(d.deviation.toFixed(1)));
  trendChart.data.datasets[2].data = last20.map(d => parseFloat(d.seepage.toFixed(0)));
  trendChart.update();
}

// ============================================
// 12. AI 建议（打字机效果）
// ============================================
function showAISuggestion() {
  if (typewriterTimer) { clearInterval(typewriterTimer); typewriterTimer = null; }

  const tpl = AI_TEMPLATES[currentStep];
  let text = tpl
    .replace('{speed}', curData.speed.toFixed(1))
    .replace('{rpm}', curData.rpm.toFixed(2))
    .replace('{pressure}', curData.pressure.toFixed(2))
    .replace('{deviation}', Math.round(curData.deviation).toString())
    .replace('{seepage}', Math.round(curData.seepage).toString())
    .replace('{distance}', curData.distance.toString());

  const el = document.getElementById('aiContent');
  el.innerHTML = '';
  let idx = 0;
  const cursor = document.createElement('span');
  cursor.className = 'ai-cursor';

  typewriterTimer = setInterval(() => {
    if (idx < text.length) {
      // 处理换行
      if (text[idx] === '\n') {
        el.appendChild(document.createElement('br'));
      } else {
        el.appendChild(document.createTextNode(text[idx]));
      }
      idx++;
      // 保持光标在末尾
      if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
      el.appendChild(cursor);
    } else {
      clearInterval(typewriterTimer);
      typewriterTimer = null;
      // 打字完成后移除光标
      setTimeout(() => { if (cursor.parentNode) cursor.remove(); }, 1500);
    }
  }, 30);
}

// ============================================
// 13. 控件状态更新
// ============================================
function updateControls() {
  document.getElementById('btnPrev').disabled = currentStep <= 0 || modalOpen;
  document.getElementById('btnNext').disabled = currentStep >= NODES.length - 1 || modalOpen;
  document.getElementById('stepCurrent').textContent = currentStep + 1;
  document.getElementById('progressBar').style.width = ((currentStep + 1) / NODES.length * 100) + '%';
}

// ============================================
// 14. 综合更新
// ============================================
function updateAll() {
  updateFlowchartState();
  updateDataCards();
  updateRiskLevel();
  updateControls();
  showAISuggestion();
}

// ============================================
// 15. 初始化
// ============================================
function init() {
  // 生成 SVG 流程图
  document.getElementById('flowchartContainer').innerHTML = buildFlowchartSVG();

  // 初始化图表
  initChart();

  // 初始化数据
  initStepData();
  addChartPoint();

  // 首次渲染
  updateAll();

  // 启动数据模拟循环
  startDataLoop();

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (modalOpen) {
      if (e.key === 'y' || e.key === 'Y') handleDecision('yes');
      if (e.key === 'n' || e.key === 'N') handleDecision('no');
      return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
    if (e.key === 'r' || e.key === 'R') resetDemo();
  });
}

window.addEventListener('DOMContentLoaded', init);
