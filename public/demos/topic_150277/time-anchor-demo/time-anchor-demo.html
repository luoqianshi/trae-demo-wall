  <main class="app">
    <aside class="side">
      <div class="brand"><div class="logo">锚</div><div><h1>时光锚点</h1><p>把普通日子温柔收藏</p></div></div>
      <form id="diaryForm" class="form">
        <label class="field">今日标题<input id="title" value="把蓝天留在今天"></label>
        <div class="row"><label class="field">时间<input id="time" readonly></label><label class="field">天气<select id="weather"><option>晴，微风，24℃</option><option>多云，22℃</option><option>小雨，19℃</option></select></label></div>
        <label class="field">定位位置<input id="location" value="公司楼下的梧桐路口附近"></label>
        <div class="row"><label class="field">心情<select id="mood"><option>平静</option><option>开心</option><option>被治愈</option><option>勇敢</option><option>有点低落</option></select></label><label class="field">心情来源<select id="source"><option>自己选择</option><option>智能手表</option></select></label></div>
        <label class="field">事件<input id="event" value="下班路上抬头看见蓝天"></label>
        <label class="field">今天发生了什么<textarea id="content">今天工作有点忙，但回家路上风很舒服。我在路口等红灯时抬头看见蓝天，突然觉得这一刻值得被记住。</textarea></label>
        <label class="field">给未来自己的短句<input id="note" value="如果某天难过，就回来看看：你曾经也被很小的事情照亮过。"></label>
      </form>
      <button id="save" class="primary wide">保存今天的锚点</button>
      <button id="random" class="secondary wide">换一个生活瞬间</button>
    </aside>
    <section class="main">
      <header class="top"><div><h2 id="viewTitle">今日记录</h2><p>照片、时间、定位、天气、心情与事件一起组成一页轻量日记。</p></div><div class="stats"><div class="stat"><b id="count">3</b> 篇</div><div class="stat"><b id="happy">2</b> 次治愈</div></div></header>
      <div class="content">
        <section id="today" class="view active">
