<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠迹 - 宠物友好地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --primary: #f97316;
  --primary-dark: #ea580c;
  --bg: #f8f9fa;
  --sidebar-bg: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 380px;
  height: 100vh;
  background: var(--sidebar-bg);
  box-shadow: var(--shadow);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition);
}

.sidebar-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--primary), #fb923c);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 24px;
}

.brand-name { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.brand-sub { font-size: 12px; color: var(--text-secondary); font-weight: 400; }

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Search */
.search-box {
  display: flex; align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  gap: 8px;
  transition: border-color var(--transition);
}
.search-box:focus-within { border-color: var(--primary); }
.search-box svg { flex-shrink: 0; color: var(--text-secondary); }
.search-box input {
  border: none; background: none; outline: none;
  font-size: 14px; width: 100%; color: var(--text);
}
.search-box input::placeholder { color: #94a3b8; }

/* Category filters */
.filter-section h3 {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.filter-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--text);
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
}
.filter-chip:hover { border-color: #cbd5e1; background: #f1f5f9; }
.filter-chip.active {
  background: var(--chip-color);
  border-color: var(--chip-color);
  color: #fff;
  font-weight: 500;
}

/* Location list */
.location-list { display: flex; flex-direction: column; gap: 8px; }

.location-card {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all var(--transition);
  background: #fff;
}
.location-card:hover {
  border-color: var(--primary);
  box-shadow: 0 2px 12px rgba(249,115,22,0.1);
  transform: translateX(4px);
}
.location-card .card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px;
}
.location-card .card-name {
  font-size: 15px; font-weight: 600; flex: 1;
}
.location-card .card-cat {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 12px;
  color: #fff;
  font-weight: 500;
  white-space: nowrap;
}
.location-card .card-addr {
  font-size: 12px; color: var(--text-secondary);
  margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.location-card .card-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; font-size: 11px; color: #94a3b8;
}
.location-card .card-meta .user-tag {
  background: #fef3c7; color: #d97706;
  padding: 1px 8px; border-radius: 10px; font-weight: 500;
}

/* ========== MAP ========== */
.map-container {
  position: fixed;
  top: 0; left: 380px;
  width: calc(100% - 380px);
  height: 100vh;
  z-index: 1;
}

#map { width: 100%; height: 100%; }

/* ========== FAB ========== */
.fab {
  position: fixed;
  bottom: 32px; right: 40px;
  z-index: 1001;
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--primary), #fb923c);
  border-radius: 50%;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(249,115,22,0.4);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  transition: all var(--transition);
}
.fab:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 28px rgba(249,115,22,0.5);
}

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal {
  background: #fff;
  border-radius: 16px;
  width: 480px; max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  transform: translateY(20px);
  transition: transform 0.25s ease;
}
.modal-overlay.show .modal { transform: translateY(0); }

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border: none; background: var(--bg);
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.modal-close:hover { background: #e2e8f0; color: var(--text); }

.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
  font-size: 13px; font-weight: 600; color: var(--text);
}
.form-group input, .form-group textarea, .form-group select {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition);
  resize: vertical;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--primary);
}
.form-group textarea { min-height: 80px; }

.map-picker {
  width: 100%; height: 200px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  overflow: hidden;
  cursor: crosshair;
}

.coord-display {
  font-size: 13px; color: var(--text-secondary);
  background: var(--bg); padding: 6px 12px;
  border-radius: 6px;
}
.coord-display span { color: var(--primary); font-weight: 500; }

.btn {
  padding: 11px 24px;
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #fb923c);
  color: #fff;
}
.btn-primary:hover { background: linear-gradient(135deg, var(--primary-dark), #f97316); }
.btn-secondary {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: #e2e8f0; }

.modal-footer {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 16px 24px; border-top: 1px solid var(--border);
}

/* ========== DETAIL MODAL ========== */
.detail-image {
  width: 100%; height: 180px;
  background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px;
}
.detail-info-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; color: var(--text-secondary);
}
.detail-info-row svg { flex-shrink: 0; }

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b; color: #fff;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 3000;
  opacity: 0; pointer-events: none;
  transition: all 0.3s ease;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== MOBILE TOGGLE ========== */
.mobile-toggle {
  display: none;
  position: fixed; top: 16px; left: 16px;
  z-index: 1100;
  width: 40px; height: 40px;
  background: #fff;
  border: none; border-radius: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  align-items: center; justify-content: center;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
    width: 100%; max-width: 360px;
  }
  .sidebar.open { transform: translateX(0); }
  .map-container { left: 0; width: 100%; }
  .mobile-toggle { display: flex; }
  .fab { bottom: 20px; right: 20px; }
}

/* ========== MARKER STYLE ========== */
.custom-marker {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #fff;
  transition: transform 0.2s;
}
.custom-marker:hover { transform: scale(1.2); }

/* empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* counter badge */
.counter-badge {
  background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 600;
  padding: 2px 10px; border-radius: 10px;
}

/* Leaflet overrides */
.leaflet-control-zoom a { border-radius: 8px !important; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">🐾</div>
    <div>
      <div class="brand-name">宠 迹</div>
      <div class="brand-sub">Pet-Friendly Map</div>
    </div>
    <span class="counter-badge" id="locationCount" style="margin-left:auto">0</span>
  </div>

  <div class="sidebar-body">
    <!-- Search -->
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索地点名称或地址...">
    </div>

    <!-- Category Filters -->
    <div class="filter-section">
      <h3>🏷️ 地点分类</h3>
      <div class="filter-chips" id="filterChips">
        <div class="filter-chip active" data-cat="all" style="--chip-color: #64748b">全部</div>
        <div class="filter-chip" data-cat="dog_lawn" style="--chip-color: #4CAF50">🐕 遛狗草坪</div>
        <div class="filter-chip" data-cat="pet_mall" style="--chip-color: #2196F3">🏬 宠物友好商场</div>
        <div class="filter-chip" data-cat="pet_park" style="--chip-color: #FF9800">🌳 宠物公园</div>
        <div class="filter-chip" data-cat="cat_cafe" style="--chip-color: #E91E63">🐱 撸猫小店</div>
        <div class="filter-chip" data-cat="other" style="--chip-color: #8B5CF6">🐾 其他场所</div>
      </div>
    </div>

    <!-- Location List -->
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h3 style="font-size:13px;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.5px">📍 发现地点</h3>
    </div>
    <div class="location-list" id="locationList">
      <div class="empty-state">
        <div class="empty-icon">🗺️</div>
        <p>加载中...</p>
      </div>
    </div>
  </div>
</aside>

<!-- Map -->
<div class="map-container"><div id="map"></div></div>

<!-- Mobile Toggle -->
<button class="mobile-toggle" id="mobileToggle" title="菜单">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- FAB -->
<button class="fab" id="fabAdd" title="添加宠物友好地点">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="addModalTitle">🐾 添加宠物友好地点</h2>
      <button class="modal-close" onclick="closeAddModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>📍 地点名称 *</label>
        <input type="text" id="addName" placeholder="例如：奥森公园遛狗区" maxlength="50">
      </div>
      <div class="form-group">
        <label>🏷️ 分类 *</label>
        <select id="addCategory">
          <option value="">请选择分类</option>
          <option value="dog_lawn">🐕 遛狗草坪</option>
          <option value="pet_mall">🏬 宠物友好商场</option>
          <option value="pet_park">🌳 宠物公园</option>
          <option value="cat_cafe">🐱 撸猫小店</option>
          <option value="other">🐾 其他宠物场所</option>
        </select>
      </div>
      <div class="form-group">
        <label>📝 描述</label>
        <textarea id="addDesc" placeholder="描述一下这个地方的特色、适合什么宠物、有什么设施..." maxlength="300"></textarea>
      </div>
      <div class="form-group">
        <label>📮 地址</label>
        <input type="text" id="addAddress" placeholder="输入地址后点击「搜索定位」或直接在地图上点击选择位置">
      </div>
      <button class="btn btn-secondary" type="button" onclick="searchAddress()" style="align-self:flex-start">
        🔍 搜索定位
      </button>
      <div class="form-group">
        <label>📍 在地图上点击选择精确位置 *</label>
        <div class="map-picker" id="mapPicker"></div>
        <div class="map-picker-hint" style="font-size:11px;color:var(--text-secondary);margin-top:2px">👆 点击上方地图设定地点坐标</div>
      </div>
      <div class="coord-display" id="coordDisplay">
        坐标：<span>未设置</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="submitLocation()">✅ 提交地点</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">地点详情</h2>
      <button class="modal-close" onclick="closeDetailModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== 宠迹 - 宠物友好地图 ====================

// ---------- CATEGORY CONFIG ----------
const CATEGORIES = {
  dog_lawn:  { label: '遛狗草坪',    emoji: '🐕', color: '#4CAF50', icon: '🦮' },
  pet_mall:  { label: '宠物友好商场', emoji: '🏬', color: '#2196F3', icon: '🛍️' },
  pet_park:  { label: '宠物公园',    emoji: '🌳', color: '#FF9800', icon: '🏞️' },
  cat_cafe:  { label: '撸猫小店',    emoji: '🐱', color: '#E91E63', icon: '☕' },
  other:     { label: '其他宠物场所', emoji: '🐾', color: '#8B5CF6', icon: '🏠' }
};

// ---------- SAMPLE DATA ----------
const SAMPLE_LOCATIONS = [
  { id:'s1',  name:'奥林匹克森林公园',      category:'dog_lawn',  lat:40.0200, lng:116.3925, address:'北京市朝阳区北辰东路15号',        desc:'北京最大的城市公园之一，南园有大片草坪和专门的遛狗区域，环境优美，是狗狗社交的好去处。',          submittedBy:'system' },
  { id:'s2',  name:'朝阳公园',              category:'dog_lawn',  lat:39.9438, lng:116.4785, address:'北京市朝阳区朝阳公园南路1号',       desc:'市区内的大型综合公园，有大片绿地可供遛狗，周末人气很旺，还有宠物友好咖啡车。',                  submittedBy:'system' },
  { id:'s3',  name:'三里屯太古里',          category:'pet_mall',  lat:39.9329, lng:116.4556, address:'北京市朝阳区三里屯路19号',           desc:'北京时尚地标，部分区域允许携带宠物进入，多家店铺提供宠物饮水处，潮人遛宠圣地。',                submittedBy:'system' },
  { id:'s4',  name:'猫小院主题咖啡馆',        category:'cat_cafe',  lat:39.9390, lng:116.4130, address:'北京市东城区鼓楼东大街',              desc:'超治愈的猫咪主题咖啡馆，十多只品种猫随意互动，撸猫+下午茶的完美组合，猫奴必打卡。',              submittedBy:'system' },
  { id:'s5',  name:'朝阳大悦城',            category:'pet_mall',  lat:39.9219, lng:116.5199, address:'北京市朝阳区朝阳北路101号',            desc:'设有宠物友好楼层，可租借宠物推车，部分餐厅允许宠物入座户外区域，配套宠物商店齐全。',              submittedBy:'system' },
  { id:'s6',  name:'世纪公园',              category:'pet_park',  lat:31.2130, lng:121.5453, address:'上海市浦东新区锦绣路1001号',           desc:'上海最大的生态城市公园，有专门的宠物活动草坪区，环境优美，周末遛狗聚会圣地。',                  submittedBy:'system' },
  { id:'s7',  name:'徐汇滨江绿地',          category:'dog_lawn',  lat:31.1850, lng:121.4585, address:'上海市徐汇区龙腾大道',                 desc:'黄浦江畔的开放绿地，设有专门遛狗区域和狗狗饮水点，傍晚江景配遛狗，惬意十足。',                  submittedBy:'system' },
  { id:'s8',  name:'静安嘉里中心',          category:'pet_mall',  lat:31.2265, lng:121.4520, address:'上海市静安区南京西路1515号',           desc:'高端宠物友好商场，提供宠物推车租赁，多家宠物精品店，天台花园也可携宠进入。',                    submittedBy:'system' },

// ---------- STATE ----------
const STORAGE_KEY = 'chongji_user_locations';
let allLocations = [];
let userLocations = [];
let mapMarkers = [];
let activeFilter = 'all';
let pickerMarker = null;
let pendingCoord = null;

// ---------- HELPERS ----------
function genId() { return 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function catColor(cat) { return CATEGORIES[cat] ? CATEGORIES[cat].color : '#64748b'; }
function catLabel(cat) { return CATEGORIES[cat] ? CATEGORIES[cat].label : cat; }
function catEmoji(cat) { return CATEGORIES[cat] ? CATEGORIES[cat].emoji : '🐾'; }
function catIcon(cat) { return CATEGORIES[cat] ? CATEGORIES[cat].icon : '🏠'; }

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  userLocations = raw ? JSON.parse(raw) : [];
  allLocations = [...SAMPLE_LOCATIONS, ...userLocations];
}

function saveUserData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(userLocations));
}

function getFilteredLocations() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = allLocations;
  if (activeFilter !== 'all') list = list.filter(function(l) { return l.category === activeFilter; });
  if (search) list = list.filter(function(l) { return l.name.toLowerCase().indexOf(search) !== -1 || (l.address||'').toLowerCase().indexOf(search) !== -1; });
  return list;
}

// ---------- TOAST ----------
var toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ---------- MARKER FACTORY ----------
function createMarkerIcon(category) {
  var color = catColor(category);
  var emoji = catIcon(category);
  return L.divIcon({
    className: 'custom-marker-wrapper',
    html: '<div class="custom-marker" style="background:' + color + '">' + emoji + '</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -18]
  });
}

function buildPopup(loc) {
  var cat = catLabel(loc.category);
  var userBadge = loc.submittedBy === 'user' ? ' <span style="background:#fef3c7;color:#d97706;font-size:11px;padding:1px 6px;border-radius:8px;margin-left:4px;">用户投稿</span>' : '';
  var parts = [];
  parts.push('<div style="min-width:200px;font-family:inherit">');
  parts.push('<strong style="font-size:15px">' + loc.name + '</strong>' + userBadge);
  parts.push('<span style="display:inline-block;background:' + catColor(loc.category) + ';color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px">' + cat + '</span>');
  if (loc.address) parts.push('<p style="margin:6px 0 2px;font-size:12px;color:#666">📍 ' + loc.address + '</p>');
  if (loc.desc) parts.push('<p style="margin:4px 0 0;font-size:12px;color:#444;line-height:1.5">' + loc.desc + '</p>');
  parts.push('<button onclick="showDetail(\'' + loc.id + '\')" style="margin-top:8px;padding:5px 14px;background:#f97316;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">查看详情 →</button>');
  parts.push('</div>');
  return parts.join('');
}

// ---------- MAP ----------
var map;
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([35.0, 110.0], 5);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | 宠迹',
    maxZoom: 19
  }).addTo(map);

  // Location button
  var LocateControl = L.Control.extend({
    onAdd: function() {
      var btn = L.DomUtil.create('button');
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
      btn.title = '定位到我';
      btn.style.cssText = 'width:34px;height:34px;background:#fff;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,0.2);font-size:16px';
      L.DomEvent.on(btn, 'click', function(e) {
        L.DomEvent.stopPropagation(e);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function(pos) {
            map.setView([pos.coords.latitude, pos.coords.longitude], 15);
            L.circleMarker([pos.coords.latitude, pos.coords.longitude], {radius:12,color:'#f97316',fillColor:'#f97316',fillOpacity:0.3,weight:2}).addTo(map).bindPopup('📍 你的位置').openPopup();
          }, function() { showToast('无法获取位置，请检查定位权限'); });
        } else { showToast('浏览器不支持定位'); }
      });
      return btn;
    }
  });
  new LocateControl({ position: 'bottomright' }).addTo(map);

  // Close sidebar when clicking map on mobile
  map.on('click', function() {
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.remove('open');
    }
  });
}

function clearMarkers() {
  mapMarkers.forEach(function(m) { map.removeLayer(m); });
  mapMarkers = [];
}

function renderMarkers(locations) {
  clearMarkers();
  var bounds = [];
  locations.forEach(function(loc) {
    var marker = L.marker([loc.lat, loc.lng], { icon: createMarkerIcon(loc.category) })
      .addTo(map)
      .bindPopup(buildPopup(loc));
    marker._chongjiId = loc.id;
    mapMarkers.push(marker);
    bounds.push([loc.lat, loc.lng]);
  });
  if (bounds.length > 0) {
    try { map.fitBounds(bounds, { padding: [60, 60], maxZoom: 14 }); } catch(e) {}
  }
}

// ---------- LIST RENDERING ----------
function renderLocationList() {
  var container = document.getElementById('locationList');
  var filtered = getFilteredLocations();
  document.getElementById('locationCount').textContent = allLocations.length;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到匹配的地点</p></div>';
  } else {
    container.innerHTML = filtered.map(function(loc) {
      return '<div class="location-card" onclick="focusLocation(\'' + loc.id + '\')">'
        + '<div class="card-header">'
        + '<span class="card-name">' + loc.name + '</span>'
        + '<span class="card-cat" style="background:' + catColor(loc.category) + '">' + catLabel(loc.category) + '</span>'
        + '</div>'
        + (loc.address ? '<div class="card-addr">📍 ' + loc.address + '</div>' : '')
        + '<div class="card-meta">'
        + '<span>' + catIcon(loc.category) + '</span>'
        + (loc.submittedBy === 'user' ? '<span class="user-tag">用户投稿</span>' : '<span>官方推荐</span>')
        + '</div></div>';
    }).join('');
  }
}

function focusLocation(id) {
  var loc = allLocations.find(function(l) { return l.id === id; });
  if (!loc) return;
  map.setView([loc.lat, loc.lng], 16);
  mapMarkers.forEach(function(m) {
    if (m._chongjiId === id) m.openPopup();
  });
  document.getElementById('sidebar').classList.remove('open');
}

// ---------- FILTERS ----------
document.getElementById('filterChips').addEventListener('click', function(e) {
  var chip = e.target.closest('.filter-chip');
  if (!chip) return;
  this.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  activeFilter = chip.dataset.cat;
  var filtered = getFilteredLocations();
  renderLocationList();
  renderMarkers(filtered);
});

document.getElementById('searchInput').addEventListener('input', function() {
  var filtered = getFilteredLocations();
  renderLocationList();
  renderMarkers(filtered);
});

// ---------- MOBILE TOGGLE ----------
document.getElementById('mobileToggle').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
});

// ---------- ADD LOCATION ----------
var pickerMapInstance = null;

function openAddModal() {
  document.getElementById('addModalOverlay').classList.add('show');
  document.getElementById('addName').value = '';
  document.getElementById('addCategory').value = '';
  document.getElementById('addDesc').value = '';
  document.getElementById('addAddress').value = '';
  document.getElementById('coordDisplay').innerHTML = '坐标：<span>未设置</span>';
  pendingCoord = null;
  document.getElementById('addModalTitle').textContent = '🐾 添加宠物友好地点';
  setTimeout(initPickerMap, 200);
}

function closeAddModal() {
  document.getElementById('addModalOverlay').classList.remove('show');
  if (pickerMapInstance) { pickerMapInstance.remove(); pickerMapInstance = null; }
  pickerMarker = null;
}

function initPickerMap() {
  var container = document.getElementById('mapPicker');
  if (pickerMapInstance) pickerMapInstance.remove();

  pickerMapInstance = L.map(container, { zoomControl: true, attributionControl: false }).setView([35.0, 110.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pickerMapInstance);

  pickerMapInstance.on('click', function(e) {
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;
    pendingCoord = { lat: lat, lng: lng };
    document.getElementById('coordDisplay').innerHTML = '坐标：<span>' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</span>';
    if (pickerMarker) pickerMapInstance.removeLayer(pickerMarker);
    pickerMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className:'', html:'<div style="width:20px;height:20px;background:#f97316;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>', iconSize:[20,20], iconAnchor:[10,10] })
    }).addTo(pickerMapInstance);
  });

  setTimeout(function() { if (pickerMapInstance) pickerMapInstance.invalidateSize(); }, 100);
}

function searchAddress() {
  var addr = document.getElementById('addAddress').value.trim();
  if (!addr) { showToast('请先输入地址'); return; }

  showToast('正在搜索定位...');
  fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(addr) + '&limit=1&accept-language=zh')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.length === 0) { showToast('未找到该地址，请尝试更详细的地址或直接在地图上点击'); return; }
      var lat = parseFloat(data[0].lat);
      var lng = parseFloat(data[0].lon);
      pendingCoord = { lat: lat, lng: lng };
      document.getElementById('coordDisplay').innerHTML = '坐标：<span>' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</span>';
      if (pickerMapInstance) {
        pickerMapInstance.setView([lat, lng], 16);
        if (pickerMarker) pickerMapInstance.removeLayer(pickerMarker);
        pickerMarker = L.marker([lat, lng], {
          icon: L.divIcon({ className:'', html:'<div style="width:20px;height:20px;background:#f97316;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>', iconSize:[20,20], iconAnchor:[10,10] })
        }).addTo(pickerMapInstance);
      }
      showToast('✅ 已定位到该地址');
    })
    .catch(function() { showToast('搜索失败，请检查网络连接'); });
}

function submitLocation() {
  var name = document.getElementById('addName').value.trim();
  var category = document.getElementById('addCategory').value;
  var desc = document.getElementById('addDesc').value.trim();
  var address = document.getElementById('addAddress').value.trim();

  if (!name) { showToast('请输入地点名称'); return; }
  if (!category) { showToast('请选择分类'); return; }
  if (!pendingCoord) { showToast('请在地图上点击选择位置'); return; }

  var newLoc = {
    id: genId(),
    name: name,
    category: category,
    desc: desc,
    address: address,
    lat: pendingCoord.lat,
    lng: pendingCoord.lng,
    submittedBy: 'user',
    createdAt: new Date().toISOString()
  };

  userLocations.push(newLoc);
  saveUserData();
  loadData();

  closeAddModal();
  renderLocationList();
  renderMarkers(getFilteredLocations());
  map.setView([pendingCoord.lat, pendingCoord.lng], 16);
  showToast('🎉 地点添加成功！感谢你的贡献');
}

document.getElementById('fabAdd').addEventListener('click', openAddModal);
document.getElementById('addModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});
document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetailModal();
});

// ---------- DETAIL MODAL ----------
function showDetail(id) {
  var loc = allLocations.find(function(l) { return l.id === id; });
  if (!loc) return;

  document.getElementById('detailTitle').textContent = loc.name;
  var body = document.getElementById('detailBody');
  var footer = document.getElementById('detailFooter');

  var cat = catLabel(loc.category);
  var isUser = loc.submittedBy === 'user';

  var html = '';
  html += '<div class="detail-image">' + catIcon(loc.category) + '</div>';
  html += '<div style="display:inline-flex;align-items:center;gap:8px">';
  html += '<span style="background:' + catColor(loc.category) + ';color:#fff;padding:4px 14px;border-radius:14px;font-size:13px;font-weight:500">' + catEmoji(loc.category) + ' ' + cat + '</span>';
  html += isUser ? '<span class="user-tag" style="background:#fef3c7;color:#d97706;padding:3px 12px;border-radius:10px;font-size:12px;font-weight:500">👤 用户投稿</span>' : '<span style="font-size:12px;color:#94a3b8">✅ 官方推荐</span>';
  html += '</div>';
  if (loc.desc) html += '<p style="font-size:14px;color:var(--text);line-height:1.7">' + loc.desc + '</p>';
  if (loc.address) {
    html += '<div class="detail-info-row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>' + loc.address + '</span></div>';
  }
  html += '<div class="detail-info-row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg><span>' + loc.lat.toFixed(5) + ', ' + loc.lng.toFixed(5) + '</span></div>';
  body.innerHTML = html;

  if (isUser) {
    footer.innerHTML = '<button class="btn btn-primary" style="background:#ef4444" onclick="deleteLocation(\'' + loc.id + '\')">🗑️ 删除此地点</button><button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>';
  } else {
    footer.innerHTML = '<button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>';
  }

  document.getElementById('detailModalOverlay').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModalOverlay').classList.remove('show');
}

function deleteLocation(id) {
  if (!confirm('确定要删除这个地点吗？此操作不可撤销。')) return;
  userLocations = userLocations.filter(function(l) { return l.id !== id; });
  saveUserData();
  loadData();
  closeDetailModal();
  renderLocationList();
  renderMarkers(getFilteredLocations());
  showToast('🗑️ 地点已删除');
}

// ---------- KEYBOARD ----------
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAddModal();
    closeDetailModal();
    document.getElementById('sidebar').classList.remove('open');
  }
});

// ---------- INIT ----------
function init() {
  loadData();
  initMap();
  renderLocationList();
  renderMarkers(allLocations);
}

window.addEventListener('DOMContentLoaded', function() {
  setTimeout(init, 100);
});
</script>
