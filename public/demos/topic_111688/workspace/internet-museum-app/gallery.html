<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展厅 | Internet Museum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">&#127963;</span>
        Internet Museum
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="import.html">导入内容</a>
        <a href="gallery.html" class="active">展厅</a>
        <a href="profile.html">画像</a>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <!-- Gallery List View -->
    <div id="gallery-list-view">
      <section class="page-hero">
        <div class="container">
          <div class="section-label">所有展厅</div>
          <h1>浏览你的展厅</h1>
          <p>每个展厅都是一段认知旅程。AI 根据主题、时间和关联自动策展。</p>
        </div>
      </section>

      <section style="margin-bottom: 4rem;">
        <div class="container">
          <div class="grid-3" id="all-galleries">
            <!-- Rendered by JS -->
          </div>
        </div>
      </section>
    </div>

    <!-- Gallery Detail View -->
    <div id="gallery-detail-view" class="hidden">
      <!-- Cover -->
      <div id="detail-cover" style="position: relative; height: 360px; overflow: hidden;">
        <img id="detail-cover-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,0.7));"></div>
        <div class="container" style="position: absolute; bottom: 0; left: 0; right: 0; padding-bottom: 2rem; color: white;">
          <div style="font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem;" id="detail-theme"></div>
          <h1 style="color: white; font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 0.5rem;" id="detail-title"></h1>
          <p style="color: rgba(255,255,255,0.8); max-width: 600px;" id="detail-desc"></p>
        </div>
      </div>

      <section style="padding: 3rem 0;">
        <div class="container">
          <!-- Back + Actions -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <a href="gallery.html" class="btn btn-ghost btn-sm">&larr; 返回展厅列表</a>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <span class="tag" id="detail-count"></span>
              <span class="tag" id="detail-updated"></span>
            </div>
          </div>

          <!-- Curator Note -->
          <div class="curator-card mb-4">
            <div class="curator-label">AI 策展人短评</div>
            <div class="curator-note" id="detail-curator-note"></div>
          </div>

          <!-- Gallery Tags -->
          <div style="margin-bottom: 2rem;">
            <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem;">展厅标签</div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="detail-gallery-tags"></div>
          </div>

          <!-- Tabs -->
          <div class="tabs">
            <div class="tab active" data-detail-tab="items">&#128196; 展品</div>
            <div class="tab" data-detail-tab="timeline">&#128197; 时间线</div>
            <div class="tab" data-detail-tab="tags">&#127991; 展品标签</div>
          </div>

          <!-- Items Tab -->
          <div id="detail-tab-items" class="detail-tab-panel">
            <div class="item-list" id="detail-items">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Timeline Tab -->
          <div id="detail-tab-timeline" class="detail-tab-panel hidden">
            <div class="timeline" id="detail-timeline">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Tags Tab -->
          <div id="detail-tab-tags" class="detail-tab-panel hidden">
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;" id="detail-tags">
              <!-- Rendered by JS -->
            </div>
            <div class="mt-4" id="tag-related-items">
              <!-- Related items by selected tag -->
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer style="border-top: 1px solid var(--rule); padding: 3rem 0; text-align: center;">
      <div class="container">
        <div class="nav-brand" style="justify-content: center; margin-bottom: 1rem;">
          <span class="brand-icon">&#127963;</span>
          Internet Museum
        </div>
        <p style="font-size: 0.85rem; color: var(--light);">互联网私人博物馆 &middot; AI 驱动的个人信息策展系统</p>
      </div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const galleryId = urlParams.get('id');

    if (galleryId) {
      showGalleryDetail(galleryId);
    } else {
      showGalleryList();
    }

    function showGalleryList() {
      document.getElementById('gallery-list-view').classList.remove('hidden');
      document.getElementById('gallery-detail-view').classList.add('hidden');
      renderGalleryList();
    }

    function showGalleryDetail(id) {
      document.getElementById('gallery-list-view').classList.add('hidden');
      document.getElementById('gallery-detail-view').classList.remove('hidden');
      renderGalleryDetail(id);
    }

    function renderGalleryList() {
      const galleries = Storage.getGalleries();
      const grid = document.getElementById('all-galleries');
      if (galleries.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">&#127963;</div>
            <div class="empty-state-title">还没有展厅</div>
            <div class="empty-state-desc">先导入一些内容，AI 会自动为你生成展厅</div>
            <a href="import.html" class="btn btn-primary mt-2">去导入</a>
          </div>
        `;
        return;
      }
      grid.innerHTML = galleries.map(g => `
        <a href="gallery.html?id=${g.id}" class="card" style="text-decoration: none; color: inherit;">
          <div style="position: relative;">
            <img src="${g.coverImage}" alt="${Utils.escapeHtml(g.name)}" class="card-cover" style="aspect-ratio: 16/10;">
            <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 1rem 1rem; background: linear-gradient(transparent, rgba(0,0,0,0.6)); color: white;">
              <div style="font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.1em;">${g.theme}</div>
              <div style="font-family: var(--font-heading); font-size: 1.3rem; font-weight: 700;">${Utils.escapeHtml(g.name)}</div>
            </div>
          </div>
          <div class="card-body">
            <p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${Utils.escapeHtml(g.curatorNote || g.description)}</p>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              ${g.tags.slice(0, 3).map(t => `<span class="tag tag-sm">${Utils.escapeHtml(t)}</span>`).join('')}
            </div>
            <div class="exhibit-meta" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--rule);">
              <span>&#128196; ${g.itemCount} 件展品</span>
              <span>更新于 ${g.updatedAt}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    function renderGalleryDetail(id) {
      const data = Storage.load();
      const gallery = data.galleries.find(g => g.id === id);
      if (!gallery) { showGalleryList(); return; }

      const items = data.items.filter(i => i.galleryId === id);
      const timeline = data.timeline.filter(t => t.galleryId === id);

      // Cover
      document.getElementById('detail-cover-img').src = gallery.coverImage;
      document.getElementById('detail-cover-img').alt = gallery.name;
      document.getElementById('detail-theme').textContent = gallery.theme;
      document.getElementById('detail-title').textContent = gallery.name;
      document.getElementById('detail-desc').textContent = gallery.description;
      document.getElementById('detail-count').textContent = items.length + ' 件展品';
      document.getElementById('detail-updated').textContent = '更新于 ' + gallery.updatedAt;

      // Curator Note
      document.getElementById('detail-curator-note').textContent = gallery.curatorNote || 'AI 策展人正在观察这些展品背后的故事。';

      // Gallery Tags
      const galleryTags = document.getElementById('detail-gallery-tags');
      galleryTags.innerHTML = gallery.tags && gallery.tags.length
        ? gallery.tags.map(t => `<span class="tag">${Utils.escapeHtml(t)}</span>`).join('')
        : '<span class="tag">未分类</span>';

      // Items
      const itemsContainer = document.getElementById('detail-items');
      if (items.length === 0) {
        itemsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128196;</div>
            <div class="empty-state-title">展厅为空</div>
            <div class="empty-state-desc">这个展厅还没有展品。去导入一些相关内容吧。</div>
            <a href="import.html" class="btn btn-primary mt-2">导入内容</a>
          </div>
        `;
      } else {
        itemsContainer.innerHTML = items.map(item => `
          <div class="item-row">
            <div class="item-row-icon">${Utils.getTypeIcon(item.type)}</div>
            <div class="item-row-content">
              <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.15rem; flex-wrap: wrap;">
                <div class="item-row-title">${Utils.escapeHtml(item.title)}</div>
                <span class="source-badge">${Utils.getSourceLabel(item)}</span>
              </div>
              <div class="item-row-meta">${Utils.getTypeLabel(item.type)} &middot; ${item.dateAdded} &middot; ${item.source}</div>
              ${item.excerpt ? `<div style="font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem;">${Utils.escapeHtml(item.excerpt)}</div>` : ''}
              ${item.curationReason ? `<div class="curation-reason">${Utils.escapeHtml(item.curationReason)}</div>` : ''}
            </div>
            <div style="display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end;">
              ${item.tags.slice(0, 2).map(t => `<span class="tag tag-sm">${Utils.escapeHtml(t)}</span>`).join('')}
            </div>
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="flex-shrink: 0;">访问 &rarr;</a>` : ''}
          </div>
        `).join('');
      }

      // Timeline
      const timelineContainer = document.getElementById('detail-timeline');
      if (timeline.length === 0) {
        timelineContainer.innerHTML = `
          <div class="empty-state" style="padding: 2rem 0;">
            <div class="empty-state-icon">&#128197;</div>
            <div class="empty-state-title">暂无时间线数据</div>
          </div>
        `;
      } else {
        timelineContainer.innerHTML = timeline.map((t, i) => `
          <div class="timeline-item ${i === 0 ? 'active' : ''}">
            <div class="timeline-date">${t.date}</div>
            <span class="timeline-stage">${Utils.escapeHtml(t.stage || '探索期')}</span>
            <div class="timeline-title">${Utils.escapeHtml(t.title)}</div>
            ${t.description ? `<div class="timeline-desc">收藏：${Utils.escapeHtml(t.description)}</div>` : ''}
            ${t.aiInsight ? `<div class="timeline-insight">${Utils.escapeHtml(t.aiInsight)}</div>` : ''}
          </div>
        `).join('');
      }

      // Tags
      const allTags = [...new Set(items.flatMap(i => i.tags || []))];
      const tagsContainer = document.getElementById('detail-tags');
      tagsContainer.innerHTML = allTags.length
        ? allTags.map(tag => `
            <button class="tag" style="cursor: pointer; font-size: 0.85rem; padding: 0.4rem 0.9rem;"
                    onclick="filterByTag('${tag}', '${id}')">${Utils.escapeHtml(tag)}</button>
          `).join('')
        : '<span class="text-muted" style="font-size: 0.9rem;">暂无标签</span>';

      // Detail tabs
      document.querySelectorAll('[data-detail-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('[data-detail-tab]').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.detail-tab-panel').forEach(p => p.classList.add('hidden'));
          tab.classList.add('active');
          document.getElementById('detail-tab-' + tab.dataset.detailTab).classList.remove('hidden');
        });
      });
    }

    function filterByTag(tag, galleryId) {
      const data = Storage.load();
      const items = data.items.filter(i => i.galleryId === galleryId && (i.tags || []).includes(tag));
      const container = document.getElementById('tag-related-items');
      container.innerHTML = `
        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);">
          <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">标签 "${tag}" 下的展品</h3>
          <div class="item-list">
            ${items.map(item => `
              <div class="item-row">
                <div class="item-row-icon">${Utils.getTypeIcon(item.type)}</div>
                <div class="item-row-content">
                  <div class="item-row-title">${Utils.escapeHtml(item.title)}</div>
                  <div class="item-row-meta">${Utils.getTypeLabel(item.type)} &middot; ${item.dateAdded}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
