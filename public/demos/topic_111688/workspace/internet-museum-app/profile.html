<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的互联网画像 | Internet Museum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">&#127963;</span>
        Internet Museum
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="import.html">导入内容</a>
        <a href="gallery.html">展厅</a>
        <a href="profile.html" class="active">画像</a>
      </div>
      <a href="import.html" class="nav-cta">+ 添加展品</a>
    </div>
  </nav>

  <div class="page-wrapper">
    <!-- Hero -->
    <section class="persona-hero">
      <div class="container">
        <div class="section-label">AI 眼中的你</div>
        <h1>这是你的互联网画像</h1>
        <p style="max-width: 560px; color: var(--muted); margin-bottom: 2rem;">AI 根据你的数字足迹，重新认识你。</p>

        <div class="persona-hero-inner">
          <div class="persona-avatar">&#128100;</div>
          <div>
            <div class="persona-name" id="persona-user-name">Alex</div>
            <div class="persona-title" id="persona-title">正在生成画像…</div>
            <div class="keyword-cloud" id="persona-keywords">
              <!-- rendered by JS -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="container">
      <!-- Summary -->
      <section class="profile-section">
        <div class="exhibit-card">
          <div class="exhibit-label">画像摘要</div>
          <p id="persona-summary" style="font-size: 1.05rem; color: var(--ink); line-height: 1.8;"></p>
          <p id="persona-evolution" style="margin-top: 1rem; color: var(--muted); font-size: 0.95rem;"></p>
        </div>
      </section>

      <!-- Radar + Top Themes -->
      <section class="profile-section">
        <div class="grid-2" style="gap: 2rem; align-items: start;">
          <div>
            <div class="profile-section-header">
              <div class="section-label">兴趣分布</div>
              <h2 class="section-title">兴趣雷达图</h2>
            </div>
            <div class="radar-chart" id="radar-chart">
              <!-- SVG rendered by JS -->
            </div>
            <div class="radar-legend" id="radar-legend">
              <!-- rendered by JS -->
            </div>
          </div>

          <div>
            <div class="profile-section-header">
              <div class="section-label">我的主题展厅</div>
              <h2 class="section-title">你最关注的 Top 5 主题</h2>
            </div>
            <div class="top-theme-list" id="top-theme-list">
              <!-- rendered by JS -->
            </div>
          </div>
        </div>
      </section>

      <!-- Curator Message -->
      <section class="profile-section">
        <div class="profile-section-header">
          <div class="section-label">AI 策展人寄语</div>
          <h2 class="section-title">写给你的话</h2>
        </div>
        <div class="curator-message-card">
          <div class="curator-message-text" id="curator-message"></div>
          <div class="curator-message-signature">—— AI 策展人</div>
        </div>
      </section>

      <!-- Traits -->
      <section class="profile-section" style="margin-bottom: 5rem;">
        <div class="profile-section-header">
          <div class="section-label">人格画像</div>
          <h2 class="section-title">你的特质标签</h2>
        </div>
        <div class="keyword-cloud" id="persona-traits">
          <!-- rendered by JS -->
        </div>
      </section>
    </div>

    <footer style="border-top: 1px solid var(--rule); padding: 3rem 0; text-align: center;">
      <div class="container">
        <div class="nav-brand" style="justify-content: center; margin-bottom: 1rem;">
          <span class="brand-icon">&#127963;</span>
          Internet Museum
        </div>
        <p style="font-size: 0.85rem; color: var(--light);">互联网私人博物馆 &middot; AI 驱动的个人信息策展系统</p>
      </div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script>
    function renderPersona() {
      const persona = Storage.getPersona() || {};
      const galleries = Storage.getGalleries();

      // Defaults for empty persona
      const title = persona.title || '好奇的探索者';
      const summary = persona.summary || '你的博物馆还在积累足迹，AI 会在你收藏更多内容后生成画像。';
      const evolution = persona.evolution || '';
      const traits = persona.personalityTraits || ['正在探索'];
      const interests = persona.interests || [];
      const curatorMessage = persona.curatorMessage || '每一次收藏，都在让这幅画像更清晰。';
      const radar = persona.radar || {};
      const topThemes = persona.topThemes || [];

      document.getElementById('persona-title').textContent = title;
      document.getElementById('persona-summary').textContent = summary;
      document.getElementById('persona-evolution').textContent = evolution;
      document.getElementById('curator-message').textContent = curatorMessage;

      const keywordsContainer = document.getElementById('persona-keywords');
      keywordsContainer.innerHTML = interests.length
        ? interests.map(k => `<span class="keyword-pill">${Utils.escapeHtml(k)}</span>`).join('')
        : '<span class="keyword-pill">探索中</span>';

      const traitsContainer = document.getElementById('persona-traits');
      traitsContainer.innerHTML = traits.map(t => `<span class="keyword-pill">${Utils.escapeHtml(t)}</span>`).join('');

      renderRadar(radar);
      renderTopThemes(topThemes, galleries);
    }

    function renderRadar(radar) {
      const axes = [
        { key: 'AI技术', label: 'AI 技术' },
        { key: '设计审美', label: '设计审美' },
        { key: '城市探索', label: '城市探索' },
        { key: '创业商业', label: '创业商业' },
        { key: '学习研究', label: '学习研究' }
      ];
      const values = axes.map(a => radar[a.key] || 0);
      const maxValue = 100;
      const size = 200;
      const center = size / 2;
      const radius = 70;
      const n = axes.length;

      function point(value, index) {
        const angle = (Math.PI * 2 * index) / n - Math.PI / 2;
        const r = (value / maxValue) * radius;
        return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
      }

      // Concentric webs
      let webs = '';
      for (let i = 1; i <= 4; i++) {
        const pts = axes.map((_, idx) => point((maxValue / 4) * i, idx)).join(' ');
        webs += `<polygon points="${pts}" fill="none" stroke="var(--rule)" stroke-width="1" />`;
      }

      // Axes lines
      let axisLines = '';
      axes.forEach((_, idx) => {
        const angle = (Math.PI * 2 * idx) / n - Math.PI / 2;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);
        axisLines += `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="var(--rule)" stroke-width="1" />`;
      });

      // Data polygon
      const dataPts = values.map((v, i) => point(v, i)).join(' ');
      const dataPolygon = `<polygon points="${dataPts}" fill="rgba(184,149,106,0.22)" stroke="var(--accent)" stroke-width="2" />`;

      // Data points
      let dots = '';
      values.forEach((v, i) => {
        const [cx, cy] = point(v, i).split(',');
        dots += `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--accent2)" />`;
      });

      // Labels
      let labels = '';
      axes.forEach((a, idx) => {
        const angle = (Math.PI * 2 * idx) / n - Math.PI / 2;
        const x = center + (radius + 18) * Math.cos(angle);
        const y = center + (radius + 18) * Math.sin(angle);
        const anchor = Math.abs(angle - (-Math.PI/2)) < 0.1 || Math.abs(angle - (Math.PI/2)) < 0.1 ? 'middle' : (angle > -Math.PI/2 && angle < Math.PI/2 ? 'start' : 'end');
        labels += `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="var(--muted)" font-size="9" font-family="var(--font-body)">${a.label}</text>`;
      });

      document.getElementById('radar-chart').innerHTML = `
        <svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
          ${webs}
          ${axisLines}
          ${dataPolygon}
          ${dots}
          ${labels}
        </svg>
      `;

      document.getElementById('radar-legend').innerHTML = axes.map((a, i) => `
        <div class="radar-legend-item">
          <span class="radar-legend-label">${a.label}</span>
          <span class="radar-legend-value">${values[i]}%</span>
        </div>
      `).join('');
    }

    function renderTopThemes(topThemes, galleries) {
      const container = document.getElementById('top-theme-list');
      if (!topThemes || topThemes.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 2rem 0;">
            <div class="empty-state-icon">&#127963;</div>
            <div class="empty-state-title">还没有足够数据</div>
            <div class="empty-state-desc">导入更多内容后，AI 会为你生成关注的主题。</div>
          </div>
        `;
        return;
      }

      const maxScore = Math.max(1, ...topThemes.map(t => t.score || t.count));
      container.innerHTML = topThemes.map((t, i) => {
        const gallery = galleries.find(g => g.theme === t.name);
        const width = Math.round(((t.score || t.count) / maxScore) * 100);
        return `
          <div class="top-theme-item">
            <div class="top-theme-rank">${i + 1}</div>
            <div class="top-theme-info">
              <div class="top-theme-name">${Utils.escapeHtml(t.name)}</div>
              <div class="top-theme-bar-wrap">
                <div class="top-theme-bar" style="width: ${width}%;"></div>
              </div>
            </div>
            <div class="top-theme-count">
              ${t.count || 0} 件展品
              ${gallery ? `<br><a href="gallery.html?id=${gallery.id}" style="font-size: 0.75rem;">进入展厅 &rarr;</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPersona();
    });
  </script>
</body>
</html>
