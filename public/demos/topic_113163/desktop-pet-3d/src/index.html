<link rel="stylesheet" href="./styles.css">
<div id="pet-root">
  <div id="prop-layer" aria-hidden="true">
    <div id="pet-bed"></div>
  </div>
  <video id="pet-video-a" class="pet-video-layer is-active" muted playsinline preload="auto"></video>
  <video id="pet-video-b" class="pet-video-layer" muted playsinline preload="auto"></video>
  <div id="fallback-pet" aria-label="video desktop pet">
    <div class="cat-ear cat-ear-left"></div>
    <div class="cat-ear cat-ear-right"></div>
    <div class="cat-body">
      <div class="cat-face">
        <span class="cat-eye cat-eye-left"></span>
        <span class="cat-eye cat-eye-right"></span>
        <span class="cat-nose"></span>
      </div>
      <div class="cat-tail"></div>
    </div>
    <div class="cat-paw cat-paw-left"></div>
    <div class="cat-paw cat-paw-right"></div>
  </div>
  <div id="speech-bubble">点我试试</div>
</div>
<script type="module" src="./renderer.js"></script>
