function getNotices(f){var l=DATA.notices.slice();if(f&&f.type)l=l.filter(function(n){return n.type===f.type});l.sort(function(a,b){return b.publishTime.localeCompare(a.publishTime)});return l}
function getNoticeById(id){return DATA.notices.find(function(n){return n.id===id})||null}
function getHousekeepingProviders(f){var l=DATA.housekeeping.slice();if(f&&f.type)l=l.filter(function(h){return h.type===f.type});return l}
function getProviderById(id){return DATA.housekeeping.find(function(h){return h.id===id})||null}
function getEldercareServices(f){var l=DATA.eldercare.slice();if(f&&f.type)l=l.filter(function(e){return e.type===f.type});return l}
function getServiceById(id){return DATA.eldercare.find(function(e){return e.id===id})||null}
function getUserExchangeItems(){try{var r=localStorage.getItem(EXCHANGE_KEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function getExchangeItems(f){var u=getUserExchangeItems();var a=DATA.exchange.concat(u);if(f&&f.type)return a.filter(function(e){return e.type===f.type});return a}
function getItemById(id){var p=DATA.exchange.find(function(e){return e.id===id});if(p)return p;var u=getUserExchangeItems();return u.find(function(e){return e.id===id})||null}
function publishItem(item){var u=getUserExchangeItems();var n={id:'ex_user_'+Date.now(),name:item.name,type:item.type,description:item.description,status:'可用',contactPhone:item.contactPhone,isUserPublished:true};u.push(n);try{localStorage.setItem(EXCHANGE_KEY,JSON.stringify(u));return{success:true}}catch(e){return{success:false,error:'存储失败，请重试'}}}
function getGuides(f){var l=DATA.guides.slice();if(f&&f.type)l=l.filter(function(g){return g.type===f.type});return l}
function getGuideById(id){return DATA.guides.find(function(g){return g.id===id})||null}
function getPref(k){try{var r=localStorage.getItem(PREFS_KEY);var p=r?JSON.parse(r):{};return p[k]||null}catch(e){return null}}
function setPref(k,v){try{var r=localStorage.getItem(PREFS_KEY);var p=r?JSON.parse(r):{};p[k]=v;localStorage.setItem(PREFS_KEY,JSON.stringify(p))}catch(e){}}

function renderExchangePublish(container){
  container.innerHTML='<div class="page-content"><div class="back-btn" onclick="window.location.hash=\'#/exchange\'">← 返回闲置互助列表</div><h1 class="detail-title">发布闲置物品</h1><form class="publish-form" id="publishForm"><div class="form-group"><label class="form-label">物品名称<span class="required">*</span></label><input type="text" class="form-input" id="itemName" maxlength="20" placeholder="请输入物品名称"><div class="form-error" id="nameError"></div></div><div class="form-group"><label class="form-label">物品分类<span class="required">*</span></label><select class="form-select" id="itemType"><option value="">请选择分类</option><option value="家具家电">家具家电</option><option value="衣物鞋帽">衣物鞋帽</option><option value="书籍文具">书籍文具</option><option value="儿童用品">儿童用品</option><option value="其他">其他</option></select><div class="form-error" id="typeError"></div></div><div class="form-group"><label class="form-label">物品描述<span class="required">*</span></label><textarea class="form-textarea" id="itemDesc" maxlength="200" placeholder="请描述物品情况（免费赠予，请勿填写价格信息）"></textarea><div class="form-error" id="descError"></div></div><div class="form-group"><label class="form-label">联系方式<span class="required">*</span></label><input type="tel" class="form-input" id="itemPhone" maxlength="11" placeholder="请输入11位手机号"><div class="form-error" id="phoneError"></div></div><button type="submit" class="btn btn-primary" style="width:100%;margin-top:var(--spacing-md)">提交发布</button></form></div>';
  container.querySelector('#publishForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('itemName').value.trim();
    var type=document.getElementById('itemType').value;
    var desc=document.getElementById('itemDesc').value.trim();
    var phone=document.getElementById('itemPhone').value.trim();
    var valid=true;
    ['nameError','typeError','descError','phoneError'].forEach(function(id){document.getElementById(id).textContent=''});
    if(!name){document.getElementById('nameError').textContent='此项为必填';valid=false}
    if(!type){document.getElementById('typeError').textContent='此项为必填';valid=false}
    if(!desc){document.getElementById('descError').textContent='此项为必填';valid=false}
    else if(PRICE_RE.test(desc)){document.getElementById('descError').textContent='本板块仅支持免费赠予，请勿填写价格信息';valid=false}
    if(!phone){document.getElementById('phoneError').textContent='此项为必填';valid=false}
    else if(!/^1\d{10}$/.test(phone)){document.getElementById('phoneError').textContent='请输入正确的联系电话格式';valid=false}
    if(valid){
      var r=publishItem({name:name,type:type,description:desc,contactPhone:phone});
      if(r.success){alert('发布成功！您的物品已出现在列表中。');navigate('/exchange')}
      else{alert(r.error||'发布失败，请重试')}
    }
  });
}

function resolveParams(page,param){
  if(!param)return{};
  var allTypes={notice:NOTICE_TYPES.slice(1),housekeeping:HK_TYPES.slice(1),eldercare:EC_TYPES.slice(1),exchange:EX_TYPES.slice(1),guide:GUIDE_TYPES.slice(1)};
  var types=allTypes[page]||[];
  if(page==='exchange'&&param==='publish')return{action:'publish'};
  if(types.indexOf(param)!==-1)return{type:param};
  return{id:param};
}

function handleRoute(){
  var hash=window.location.hash.slice(1)||'/home';
  var parts=hash.split('/').filter(Boolean);
  var app=document.getElementById('app');
  if(parts.length===0||parts[0]==='home'){renderHome(app);window.scrollTo(0,0);return}
  var page=parts[0];
  var param=parts[1]?decodeURIComponent(parts[1]):null;
  var params=resolveParams(page,param);
  switch(page){
    case'notice':params.id?renderNoticeDetail(app,params.id):renderNoticeList(app,params.type);break;
    case'housekeeping':params.id?renderHousekeepingDetail(app,params.id):renderHousekeepingList(app,params.type);break;
    case'eldercare':params.id?renderEldercareDetail(app,params.id):renderEldercareList(app,params.type);break;
    case'exchange':params.action==='publish'?renderExchangePublish(app):params.id?renderExchangeDetail(app,params.id):renderExchangeList(app,params.type);break;
    case'guide':params.id?renderGuideDetail(app,params.id):renderGuideList(app,params.type);break;
    default:renderHome(app);
  }
  window.scrollTo(0,0);
}

function initSearchUI(){
  var searchBtn=document.getElementById('searchBtn');
  var searchPanel=document.getElementById('searchPanel');
  var searchInput=document.getElementById('searchInput');
  var searchResults=document.getElementById('searchResults');
  if(!searchBtn||!searchPanel)return;
  searchBtn.addEventListener('click',function(){searchPanel.classList.add('open');if(searchInput)searchInput.focus()});
  searchPanel.addEventListener('click',function(e){if(e.target===searchPanel)searchPanel.classList.remove('open')});
  if(searchInput){
    var timer=null;
    searchInput.addEventListener('input',function(){
      clearTimeout(timer);
      timer=setTimeout(function(){
        var kw=searchInput.value.trim().toLowerCase();
        if(!kw){searchResults.innerHTML='<div class="empty-state">请输入关键词</div>';return}
        var results=doSearch(kw);
        if(results.length===0){searchResults.innerHTML='<div class="empty-state">未找到相关信息，请尝试其他关键词</div>';return}
        searchResults.innerHTML=results.map(function(g){return '<div class="search-result-group"><div class="search-result-group-title">'+escapeHtml(g.categoryLabel)+'</div>'+g.items.map(function(it){return '<div class="list-item search-result-item" data-route="'+it.route+'"><div class="list-item-content"><div class="list-item-title">'+highlightText(it.title,kw)+'</div><div class="list-item-sub">'+highlightText(it.snippet,kw)+'</div></div></div>'}).join('')+'</div>'}).join('');
        searchResults.querySelectorAll('.search-result-item').forEach(function(el){
          el.addEventListener('click',function(){searchPanel.classList.remove('open');searchInput.value='';navigate(el.dataset.route)});
        });
      },300);
    });
  }
}

function doSearch(kw){
  var results=[];
  var notices=getNotices().filter(function(n){return n.title.toLowerCase().indexOf(kw)!==-1||n.content.toLowerCase().indexOf(kw)!==-1});
  if(notices.length)results.push({category:'notice',categoryLabel:'便民通知',items:notices.map(function(n){return{id:n.id,title:n.title,snippet:n.content.slice(0,80),category:'notice',categoryLabel:'便民通知',route:'/notice/'+n.id}})});
  var hks=getHousekeepingProviders().filter(function(p){return p.name.toLowerCase().indexOf(kw)!==-1||p.description.toLowerCase().indexOf(kw)!==-1||p.type.toLowerCase().indexOf(kw)!==-1});
  if(hks.length)results.push({category:'housekeeping',categoryLabel:'家政预约',items:hks.map(function(p){return{id:p.id,title:p.name,snippet:p.description.slice(0,80),category:'housekeeping',categoryLabel:'家政预约',route:'/housekeeping/'+p.id}})});
  var ecs=getEldercareServices().filter(function(s){return s.name.toLowerCase().indexOf(kw)!==-1||s.description.toLowerCase().indexOf(kw)!==-1||s.type.toLowerCase().indexOf(kw)!==-1});
  if(ecs.length)results.push({category:'eldercare',categoryLabel:'养老服务',items:ecs.map(function(s){return{id:s.id,title:s.name,snippet:s.description.slice(0,80),category:'eldercare',categoryLabel:'养老服务',route:'/eldercare/'+s.id}})});
  var exs=getExchangeItems().filter(function(e){return e.name.toLowerCase().indexOf(kw)!==-1||e.description.toLowerCase().indexOf(kw)!==-1||e.type.toLowerCase().indexOf(kw)!==-1});
  if(exs.length)results.push({category:'exchange',categoryLabel:'闲置互助',items:exs.map(function(e){return{id:e.id,title:e.name,snippet:e.description.slice(0,80),category:'exchange',categoryLabel:'闲置互助',route:'/exchange/'+e.id}})});
  var gs=getGuides().filter(function(g){return g.name.toLowerCase().indexOf(kw)!==-1||g.type.toLowerCase().indexOf(kw)!==-1||g.materials.some(function(m){return m.toLowerCase().indexOf(kw)!==-1})||g.process.some(function(p){return p.description.toLowerCase().indexOf(kw)!==-1})});
  if(gs.length)results.push({category:'guide',categoryLabel:'办事指南',items:gs.map(function(g){return{id:g.id,title:g.name,snippet:g.type+' - '+g.location,category:'guide',categoryLabel:'办事指南',route:'/guide/'+g.id}})});
  return results;
}

function highlightText(text,keyword){
  if(!keyword)return escapeHtml(text);
  var escaped=escapeHtml(text);
  var regex=new RegExp('('+keyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escaped.replace(regex,'<mark>$1</mark>');
}

  initA11y();
  window.addEventListener('hashchange',handleRoute);
  handleRoute();
  initSearchUI();
  document.querySelectorAll('.font-size-btn').forEach(function(btn){btn.addEventListener('click',function(){setFontSize(btn.dataset.size)})});
});

})();
