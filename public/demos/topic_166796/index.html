<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌宠学堂 — 陪伴式虚拟宠物学习应用</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="screen active" style="display:flex;align-items:center;justify-content:center;flex:1;">
    <div class="loading-spinner"></div>
    <p style="margin-left:1rem;color:var(--muted);">加载中...</p>
  </div>
</div>
<script src="js/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
// 家长报告图表初始化
const observer = new MutationObserver(() => {
  const chartEl = document.getElementById('report-radar-chart');
  if (chartEl && !chartEl.dataset.init) {
    chartEl.dataset.init = '1';
    setTimeout(() => {
      try {
        if (typeof echarts === 'undefined') return;
        const style = getComputedStyle(document.documentElement);
        const accent = style.getPropertyValue('--accent').trim();
        const accent2 = style.getPropertyValue('--accent2').trim();
        const ink = style.getPropertyValue('--ink').trim();
        const muted = style.getPropertyValue('--muted').trim();
        const rule = style.getPropertyValue('--rule').trim();

        const categoryNames = ['自然科学', '历史人文', '数学思维', '语言表达', '生活常识', '艺术审美'];
        const child = Store.activeChild();
        const allVideos = Data.getAllVideos();
        const allQuizzes = Data.getAllQuizzes();
        // 按分类统计答题正确率
        const catStats = {};
        categoryNames.forEach(c => { catStats[c] = { total: 0, answered: 0 }; });
        if (child) {
          child.history.forEach(h => {
            const v = allVideos.find(vv => vv.id === h.videoId);
            if (!v || !categoryNames.includes(v.category)) return;
            const quizzes = allQuizzes[h.videoId] || [];
            const taken = h.quizzesTaken || 0;
            if (taken > 0) {
              catStats[v.category].total += quizzes.length;
              catStats[v.category].answered += Math.min(taken, quizzes.length);
            }
          });
        }
        // 用全局答题正确率作为估算
        const correctRate = child && child.stats.quizzesAnswered > 0
          ? child.stats.quizzesCorrect / child.stats.quizzesAnswered : 0;
        const radarValues = categoryNames.map(c => {
          const s = catStats[c];
          if (s.total === 0) return 0;
          return Math.round(Math.min(100, (s.answered / s.total) * 100 * Math.max(correctRate, 0.5)));
        });

        const chart = echarts.init(chartEl, null, { renderer: 'svg' });
        chart.setOption({
          animation: false,
          radar: {
            indicator: categoryNames.map(n => ({ name: n, max: 100 })),
            axisName: { color: ink, fontSize: 11 },
            splitArea: { show: false },
            axisLine: { lineStyle: { color: rule } },
            splitLine: { lineStyle: { color: rule } }
          },
          series: [{
            type: 'radar',
            data: [{
              value: radarValues,
              name: '掌握度',
              lineStyle: { color: accent2, width: 2 },
              itemStyle: { color: accent2 },
              areaStyle: { color: accent2 + '25' }
            }],
            tooltip: { appendToBody: true }
          }]
        });
        window.addEventListener('resize', () => chart.resize());
      } catch(e) {}
    }, 100);
  }
});
observer.observe(document.getElementById('app'), { childList: true, subtree: true });
</script>
</body>
</html>
