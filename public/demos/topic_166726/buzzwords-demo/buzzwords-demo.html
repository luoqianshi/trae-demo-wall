<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>说人话 - 互联网黑话解谜游戏</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ===== 顶部导航 ===== -->
    <nav class="top-bar">
      <div class="logo" onclick="backToSelect()">说人话 <em>- 黑话解谜</em></div>
      <button class="back-btn" id="backBtn" style="display:none;">← 返回选关</button>
    </nav>

    <!-- ===== 选关页面 ===== -->
    <div class="screen active" id="selectScreen">
      <div class="puzzle-select">
        <div class="puzzle-select-header">
          <h1>解谜<em>挑战</em></h1>
          <p>互联网人嘴里的每个"高级词汇"，背后都藏着一个大白话。<br>看穿几层包装，就是你的事了。</p>
        </div>
        <div class="puzzle-cards" id="puzzleCards"></div>

        <!-- 支线功能入口 -->
        <div class="toolbox-entry" onclick="enterToolbox()">
          <div class="toolbox-entry-icon">🔧</div>
          <div class="toolbox-entry-body">
            <div class="toolbox-entry-title">支线工具箱</div>
            <div class="toolbox-entry-desc">黑话翻译器 · 人话染黑器 · 黑话词典搜索</div>
          </div>
          <div class="toolbox-entry-arrow">→</div>
        </div>

        <!-- Demo 演示入口（仅比赛 Demo 用） -->
        <div class="demo-walkthrough-entry" onclick="openDemoWalkthrough()">演示解题流程</div>
      </div>
    </div>

    <!-- ===== Demo 解题演示弹窗 ===== -->
    <div class="demo-overlay" id="demoOverlay">
      <div class="demo-modal">
        <div class="demo-modal-header">
          <h2>解题演示</h2>
          <button class="demo-close-btn" onclick="closeDemoWalkthrough()">✕</button>
        </div>
        <div class="demo-notice">
          以下内容仅为比赛评审展示解题设计，正式游戏中不会出现。
        </div>
        <div class="demo-content" id="demoContent"></div>
      </div>
    </div>

    <!-- ===== 游戏页面 ===== -->
    <div class="screen" id="gameScreen">
      <div class="game-screen">

        <!-- 谜题标题 -->
        <div class="puzzle-title-bar">
          <span class="puzzle-title-label">当前谜题</span>
          <span class="puzzle-title-word" id="gameTitle"></span>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar"></div>

        <!-- 关卡标题 -->
        <div class="level-header">
          <div class="level-tag" id="levelTag"></div>
          <div class="level-title" id="levelTitle"></div>
        </div>

        <!-- 谜题区域 -->
        <div class="puzzle-area" id="puzzleArea">
          <!-- 步骤指示器 -->
          <div class="step-indicator" id="stepIndicator"></div>

          <!-- 步骤提示 -->
          <div class="step-prompt" id="stepPrompt"></div>

          <!-- 步骤内容 -->
          <div class="step-content" id="stepContent"></div>

          <!-- 输入区 -->
          <div class="input-area" id="inputArea"></div>

          <!-- 反馈区 -->
          <div class="feedback" id="feedback"></div>

          <!-- 答案揭示 -->
          <div class="answer-reveal" id="answerReveal">
            <div class="reveal-label" id="revealLabel"></div>
            <div class="reveal-value" id="revealValue"></div>
          </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
          <div class="left-actions">
            <button class="btn btn-ghost" id="hintBtn">提示 (1次)</button>
          </div>
          <div class="right-actions">
            <!-- 预留：后续可放设置等按钮 -->
          </div>
        </div>

      </div>
    </div>

    <!-- ===== 工具箱页面 ===== -->
    <div class="screen" id="toolboxScreen">
      <div class="toolbox-screen">

        <!-- 工具箱标题 -->
        <div class="toolbox-header">
          <h1>支线<em>工具箱</em></h1>
          <p>解谜之外的轻量工具 — 翻译黑话、染黑人话、查词典</p>
        </div>

        <!-- Tab 切换 -->
        <div class="tool-tabs">
          <button class="tool-tab active" data-tab="dictionary">黑话词典</button>
          <button class="tool-tab" data-tab="wash">黑话翻译（洗白）</button>
          <button class="tool-tab" data-tab="darken">人话染黑</button>
        </div>

        <!-- 词典面板 -->
        <div class="tool-panel active" data-panel="dictionary">
          <div class="tool-panel-inner">
            <!-- 搜索栏 -->
            <div class="dict-search-bar">
              <input type="text" id="dictSearchInput" placeholder="搜索黑话词语、人话释义、分类…" />
            </div>
            <!-- 分类筛选 -->
            <div class="dict-categories">
              <button class="dict-cat-btn active" data-category="all">全部</button>
              <button class="dict-cat-btn" data-category="管理类">管理类</button>
              <button class="dict-cat-btn" data-category="执行类">执行类</button>
              <button class="dict-cat-btn" data-category="流程类">流程类</button>
              <button class="dict-cat-btn" data-category="沟通类">沟通类</button>
              <button class="dict-cat-btn" data-category="分析类">分析类</button>
              <button class="dict-cat-btn" data-category="品牌类">品牌类</button>
              <button class="dict-cat-btn" data-category="策略类">策略类</button>
              <button class="dict-cat-btn" data-category="战略类">战略类</button>
              <button class="dict-cat-btn" data-category="知识类">知识类</button>
            </div>
            <!-- 词条列表 -->
            <div class="dict-results" id="dictResults"></div>
          </div>
        </div>

        <!-- 洗白面板 -->
        <div class="tool-panel" data-panel="wash">
          <div class="tool-panel-inner">
            <div class="tool-desc">输入含有黑话的文本，系统会把黑话翻译成人话。</div>
            <textarea class="tool-textarea" id="washInput" placeholder="把老板发言、OKR 文档片段贴进来…" rows="4"></textarea>
            <div class="tool-actions">
              <button class="btn" id="washBtn">开始翻译</button>
              <button class="btn btn-ghost" id="washExampleBtn">填入示例</button>
              <button class="btn btn-ghost" id="washClearBtn">清空</button>
            </div>
            <div class="tool-message" id="washMessage"></div>
            <div class="wash-output">
              <div class="wash-column">
                <div class="wash-col-label">原文（黑话标红）</div>
                <div class="wash-col-content" id="washOriginal"></div>
              </div>
              <div class="wash-column">
                <div class="wash-col-label">人话翻译（替换标绿）</div>
                <div class="wash-col-content" id="washTranslated"></div>
              </div>
            </div>
            <div class="mapping-list" id="washMappingList"></div>
          </div>
        </div>

        <!-- 染黑面板 -->
        <div class="tool-panel" data-panel="darken">
          <div class="tool-panel-inner">
            <div class="tool-desc">输入大白话，系统帮你"包装"成互联网黑话版本。</div>
            <textarea class="tool-textarea" id="darkenInput" placeholder="把你的大白话贴进来，看看能染多黑…" rows="4"></textarea>
            <div class="tool-actions">
              <button class="btn" id="darkenBtn">开始染黑</button>
              <button class="btn btn-ghost" id="darkenExampleBtn">填入示例</button>
              <button class="btn btn-ghost" id="darkenClearBtn">清空</button>
              <button class="btn btn-secondary" id="darkenCopyBtn">复制结果</button>
            </div>
            <div class="tool-message" id="darkenMessage"></div>
            <div class="wash-output">
              <div class="wash-column">
                <div class="wash-col-label">原文（将替换部分标红）</div>
                <div class="wash-col-content" id="darkenOriginal"></div>
              </div>
              <div class="wash-column">
                <div class="wash-col-label">染黑结果（黑话标金）</div>
                <div class="wash-col-content" id="darkenResult"></div>
              </div>
            </div>
            <div class="mapping-list" id="darkenMappingList"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- ===== 知识卡弹层 ===== -->
  <div class="knowledge-overlay" id="knowledgeOverlay">
    <div class="knowledge-card" id="knowledgeCard">
      <div class="card-inner">
        <!-- 正面 -->
        <div class="card-face card-front">
          <div class="card-word"></div>
          <div class="card-category"></div>
          <div class="card-toxicity"></div>
          <div class="card-tox-label"></div>
          <div class="card-flip-hint">点击翻转查看 →</div>
        </div>
        <!-- 背面 -->
        <div class="card-face card-back">
          <div class="card-label">人间真实例句</div>
          <div class="card-example"></div>
          <div class="card-label">滥用场景</div>
          <div class="card-abuse"></div>
          <div class="knowledge-close">
            <button class="btn" id="knowledgeCloseBtn">继续</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 通关画面 ===== -->
  <div class="complete-overlay" id="completeOverlay">
    <div class="complete-content">
      <div class="complete-icon">★</div>
      <div class="complete-title">完美通关！</div>
      <div class="complete-subtitle"></div>
      <div class="complete-actions">
        <button class="btn btn-ghost" id="completeBackBtn">返回选关</button>
        <button class="btn" id="completeNextBtn">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- ===== 脚本 ===== -->
  <script src="js/puzzles-data.js"></script>
  <script src="js/dictionary-data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
