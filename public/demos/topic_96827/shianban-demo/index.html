<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食安伴 - AI智慧助老饮食助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Aurora Background - Dynamic Diffuse -->
    <div class="aurora-bg">
        <div class="aurora-orb aurora-orb-1"></div>
        <div class="aurora-orb aurora-orb-2"></div>
        <div class="aurora-orb aurora-orb-3"></div>
    </div>

    <div class="demo-container">
        <header class="demo-header">
            <div class="logo-wrap">
                <div class="logo-icon">🥗</div>
                <div class="logo-text">
                    <h1>食安伴</h1>
                    <p>AI智慧助老饮食助手</p>
                </div>
            </div>
            <div class="feature-tags">
                <span class="tag">🤖 AI智能配餐</span>
                <span class="tag">📷 拍照识食</span>
                <span class="tag">👨‍👩‍👧 家庭关爱</span>
                <span class="tag">🔊 适老化设计</span>
            </div>
        </header>

        <div class="main-content">
            <div class="phone-container">
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-screen" id="phoneScreen">
                        <!-- iOS Status Bar -->
                        <div class="ios-status-bar dark" id="iosStatusBar">
                            <span class="time">9:41</span>
                            <div class="ios-status-icons">
                                <span>📶</span>
                                <span>🔋</span>
                            </div>
                        </div>
                        <!-- iOS Navigation Bar -->
                        <div class="ios-nav-bar transparent dark" id="iosNavBar">
                            <div class="ios-nav-back" id="iosNavBack" style="display:none;">‹</div>
                            <div class="ios-nav-title" id="iosNavTitle">食安伴</div>
                            <div class="ios-nav-capsule">
                    <div class="ios-capsule-btn">○</div>
                    <div class="ios-capsule-divider"></div>
                    <div class="ios-capsule-btn">×</div>
                </div>
                        </div>
                        <!-- Page Content -->
                        <div class="ios-page-content with-tabbar" id="appContent">
                        </div>
                        <!-- iOS TabBar -->
                        <div class="ios-tabbar" id="iosTabbar">
                            <div class="ios-tab-item active" data-tab="home">
                                <div class="ios-tab-icon">🏠</div>
                                <div class="ios-tab-label">首页</div>
                            </div>
                            <div class="ios-tab-item" data-tab="recipe">
                                <div class="ios-tab-icon">🍱</div>
                                <div class="ios-tab-label">食谱</div>
                            </div>
                            <div class="ios-tab-item" data-tab="report">
                                <div class="ios-tab-icon">📊</div>
                                <div class="ios-tab-label">报告</div>
                            </div>
                            <div class="ios-tab-item" data-tab="profile">
                                <div class="ios-tab-icon">👤</div>
                                <div class="ios-tab-label">我的</div>
                            </div>
                        </div>
                        <!-- Home Indicator -->
                        <div class="phone-home-bar"></div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="panel-section">
                    <h3>功能导航</h3>
                    <div class="nav-grid">
                        <button class="nav-btn active" data-page="home">
                            <span class="nav-icon">🏠</span>
                            <span class="nav-label">首页</span>
                        </button>
                        <button class="nav-btn" data-page="recipe">
                            <span class="nav-icon">🍱</span>
                            <span class="nav-label">AI配餐</span>
                        </button>
                        <button class="nav-btn" data-page="recognize">
                            <span class="nav-icon">📷</span>
                            <span class="nav-label">拍照识食</span>
                        </button>
                        <button class="nav-btn" data-page="voice">
                            <span class="nav-icon">🎤</span>
                            <span class="nav-label">语音记录</span>
                        </button>
                        <button class="nav-btn" data-page="family">
                            <span class="nav-icon">👨‍👩‍👧</span>
                            <span class="nav-label">家庭关爱</span>
                        </button>
                        <button class="nav-btn" data-page="report">
                            <span class="nav-icon">📊</span>
                            <span class="nav-label">健康报告</span>
                        </button>
                        <button class="nav-btn" data-page="devices">
                            <span class="nav-icon">📱</span>
                            <span class="nav-label">设备同步</span>
                        </button>
                        <button class="nav-btn" data-page="nutritionist">
                            <span class="nav-icon">👩‍⚕️</span>
                            <span class="nav-label">营养师</span>
                        </button>
                        <button class="nav-btn" data-page="community">
                            <span class="nav-icon">🏘️</span>
                            <span class="nav-label">社区配餐</span>
                        </button>
                        <button class="nav-btn" data-page="mall">
                            <span class="nav-icon">🛒</span>
                            <span class="nav-label">健康商城</span>
                        </button>
                        <button class="nav-btn" data-page="settings">
                            <span class="nav-icon">⚙️</span>
                            <span class="nav-label">设置</span>
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>字体大小</h3>
                    <div class="font-btns">
                        <button class="font-btn" data-size="normal">标准</button>
                        <button class="font-btn active" data-size="large">大字</button>
                        <button class="font-btn" data-size="xlarge">超大字</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>✨ 核心亮点</h3>
                    <ul class="feature-list">
                        <li>🎯 专为老人设计，大字体高对比度</li>
                        <li>🗣️ 全程语音交互，操作零门槛</li>
                        <li>❤️ 子女远程关爱，健康随时掌握</li>
                        <li>🤖 AI智能配餐，慢病饮食调理</li>
                        <li>📸 一拍即识，营养自动计算</li>
                        <li>📊 周报月报，健康趋势一目了然</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
