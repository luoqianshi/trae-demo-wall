<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字生视频 - TRAE开发工程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: white;
        }
        
        .form-section {
            padding: 20px;
        }
        
        .form-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #374151;
        }
        
        .form-section textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .form-section textarea:focus {
            outline: none;
            border-color: #f093fb;
        }
        
        .settings-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .setting-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
        }
        
        .setting-item label {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .setting-item input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .setting-item input:focus {
            outline: none;
            border-color: #f093fb;
        }
        
        .btn-primary {
            width: calc(100% - 40px);
            margin: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(240, 147, 251, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-section {
            padding: 20px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-message {
            color: #6B7280;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .result-section {
            padding: 20px;
            display: none;
        }
        
        .video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .video-container video {
            width: 100%;
            display: block;
        }
        
        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-success {
            padding: 10px 25px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            padding: 10px 25px;
            background: #6B7280;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
        }
        
        .btn-warning {
            padding: 10px 25px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-warning:hover {
            transform: translateY(-2px);
        }
        
        .code-container {
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            overflow-x: auto;
        }
        
        .code-container pre {
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .history-section {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .history-section h2 {
            font-size: 1.2em;
            color: #374151;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
        }
        
        .history-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .history-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .history-status.pending {
            background: #FEF3C7;
            color: #D97706;
        }
        
        .history-status.processing {
            background: #DBEAFE;
            color: #2563EB;
        }
        
        .history-status.completed {
            background: #D1FAE5;
            color: #059669;
        }
        
        .history-status.failed {
            background: #FEE2E2;
            color: #DC2626;
        }
        
        .history-time {
            font-size: 0.8rem;
            color: #6B7280;
        }
        
        .history-input {
            color: #374151;
            font-size: 0.9rem;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        
        .btn-danger {
            padding: 5px 12px;
            background: #DC2626;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        
        .btn-danger:hover {
            background: #B91C1C;
        }
        
        .empty-message {
            text-align: center;
            color: #9CA3AF;
            padding: 20px;
        }
        
        .footer {
            padding: 20px;
            text-align: center;
            color: #9CA3AF;
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">
                <i class="bi bi-arrow-left"></i> 返回首页
            </a>
            <h1>🎬 文字生视频</h1>
            <p>输入描述，AI为您生成动画视频</p>
            <p style="font-size: 12px; opacity: 0.8; margin-top: 8px;">⚠️ AI生成仅供参考，请勿处理涉密和商秘</p>
        </div>
        
        <div class="form-section">
            <label for="user-input">动画描述</label>
            <textarea id="user-input" placeholder="例如：生成15秒安全培训视频，提醒戴安全帽穿反光衣，蓝色科技风格，带粒子效果"></textarea>
            
            <div class="settings-row">
                <div class="setting-item">
                    <label for="duration">视频时长（秒）</label>
                    <input type="number" id="duration" value="15" min="5" max="60">
                </div>
                <div class="setting-item">
                    <label for="width">宽度</label>
                    <input type="number" id="width" value="1280" min="640" max="1920">
                </div>
                <div class="setting-item">
                    <label for="height">高度</label>
                    <input type="number" id="height" value="720" min="360" max="1080">
                </div>
            </div>
            
            <button class="btn-primary" id="generate-btn">生成动画</button>
        </div>
        
        <div class="progress-section" id="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-message" id="progress-text">等待生成...</div>
        </div>
        
        <div class="result-section" id="result-section">
            <div class="video-container">
                <video id="video-player" controls></video>
            </div>
            <div class="result-actions">
                <a id="download-btn" class="btn-success" download><i class="bi bi-download"></i> 下载视频</a>
                <button id="show-code-btn" class="btn-secondary"><i class="bi bi-code"></i> 查看代码</button>
                <button id="regenerate-btn" class="btn-warning"><i class="bi bi-arrow-repeat"></i> 重新生成</button>
            </div>
            <div class="code-container" id="code-container">
                <pre id="generated-code"></pre>
            </div>
        </div>
        
        <div class="history-section">
            <h2><i class="bi bi-history"></i> 生成历史</h2>
            <div class="history-list" id="history-list"></div>
        </div>
        
        <div class="footer">
            <p>文字生视频 - TRAE开发工程</p>
        </div>
    </div>
    
    <script>
        let currentTaskId = null;
        
        document.getElementById('generate-btn').addEventListener('click', generateAnimation);
        document.getElementById('show-code-btn').addEventListener('click', showCode);
        document.getElementById('regenerate-btn').addEventListener('click', regenerateCurrentTask);
        
        function generateAnimation() {
            const userInput = document.getElementById('user-input').value.trim();
            const duration = parseInt(document.getElementById('duration').value);
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);
            
            if (!userInput) {
                alert('请输入动画描述');
                return;
            }
            
            document.getElementById('generate-btn').disabled = true;
            document.getElementById('generate-btn').textContent = '生成中...';
            
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = '等待生成...';
            
            fetch('/api/video/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_input: userInput,
                    duration: duration,
                    width: width,
                    height: height
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentTaskId = data.task_id;
                    streamProgress(currentTaskId);
                } else {
                    alert('生成失败: ' + data.error);
                    document.getElementById('generate-btn').disabled = false;
                    document.getElementById('generate-btn').textContent = '生成动画';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('progress-text').textContent = '生成失败: ' + error.message;
                document.getElementById('generate-btn').disabled = false;
                document.getElementById('generate-btn').textContent = '生成动画';
            });
        }
        
        function streamProgress(taskId) {
            const eventSource = new EventSource(`/api/video/stream/status/${taskId}`);
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (!data.success) {
                    eventSource.close();
                    return;
                }
                
                document.getElementById('progress-fill').style.width = data.progress + '%';
                
                const statusMessages = {
                    'pending': '等待处理...',
                    'processing': '正在处理请求...',
                    'generating_code': 'AI正在生成脚本...',
                    'rendering': `正在渲染帧... ${data.progress}%`,
                    'composing': '正在合成视频...',
                    'completed': '生成完成！',
                    'failed': '生成失败'
                };
                
                document.getElementById('progress-text').textContent = statusMessages[data.status] || data.status;
                
                if (data.status === 'completed') {
                    eventSource.close();
                    showResult(data.video_path);
                    document.getElementById('generate-btn').disabled = false;
                    document.getElementById('generate-btn').textContent = '生成动画';
                    loadHistory();
                } else if (data.status === 'failed') {
                    eventSource.close();
                    alert('生成失败: ' + data.error_message);
                    document.getElementById('generate-btn').disabled = false;
                    document.getElementById('generate-btn').textContent = '生成动画';
                }
            };
            
            eventSource.onerror = function() {
                eventSource.close();
                document.getElementById('progress-text').textContent = '连接中断，正在轮询状态...';
                pollStatus(taskId);
            };
        }
        
        function pollStatus(taskId) {
            const interval = setInterval(() => {
                fetch(`/api/video/status/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        clearInterval(interval);
                        return;
                    }
                    
                    document.getElementById('progress-fill').style.width = data.progress + '%';
                    
                    const statusMessages = {
                        'pending': '等待处理...',
                        'processing': '正在处理请求...',
                        'generating_code': 'AI正在生成脚本...',
                        'rendering': `正在渲染帧... ${data.progress}%`,
                        'composing': '正在合成视频...',
                        'completed': '生成完成！',
                        'failed': '生成失败'
                    };
                    
                    document.getElementById('progress-text').textContent = statusMessages[data.status] || data.status;
                    
                    if (data.status === 'completed') {
                        clearInterval(interval);
                        showResult(data.video_path);
                        document.getElementById('generate-btn').disabled = false;
                        document.getElementById('generate-btn').textContent = '生成动画';
                        loadHistory();
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        alert('生成失败: ' + data.error_message);
                        document.getElementById('generate-btn').disabled = false;
                        document.getElementById('generate-btn').textContent = '生成动画';
                    }
                })
                .catch(() => {
                    clearInterval(interval);
                });
            }, 2000);
        }
        
        function showResult(videoPath) {
            const videoPlayer = document.getElementById('video-player');
            const downloadBtn = document.getElementById('download-btn');
            
            videoPlayer.src = '/api/video/download/' + currentTaskId;
            downloadBtn.href = '/api/video/download/' + currentTaskId;
            
            document.getElementById('result-section').style.display = 'block';
        }
        
        function showCode() {
            const codeContainer = document.getElementById('code-container');
            const codeElement = document.getElementById('generated-code');
            
            if (codeContainer.style.display === 'none') {
                fetch(`/api/video/code/${currentTaskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        codeElement.textContent = data.code || '暂无代码';
                        codeContainer.style.display = 'block';
                        document.getElementById('show-code-btn').textContent = '隐藏代码';
                    }
                });
            } else {
                codeContainer.style.display = 'none';
                document.getElementById('show-code-btn').textContent = '查看代码';
            }
        }
        
        function regenerateCurrentTask() {
            if (!currentTaskId) return;
            
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = '重新生成中...';
            
            fetch(`/api/video/regenerate/${currentTaskId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentTaskId = data.task_id;
                    streamProgress(currentTaskId);
                }
            });
        }
        
        function regenerateTask(taskId) {
            if (!confirm('确定要重新生成此动画吗？')) return;
            
            fetch(`/api/video/regenerate/${taskId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadHistory();
                }
            });
        }
        
        function deleteTask(taskId) {
            if (!confirm('确定要删除此记录吗？')) return;
            
            fetch(`/api/video/delete/${taskId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadHistory();
                }
            });
        }
        
        function loadHistory() {
            fetch('/api/video/history')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const historyList = document.getElementById('history-list');
                    
                    if (data.tasks.length === 0) {
                        historyList.innerHTML = '<p class="empty-message">暂无生成记录</p>';
                        return;
                    }
                    
                    historyList.innerHTML = data.tasks.map(task => `
                        <div class="history-item">
                            <div class="history-info">
                                <span class="history-status ${task.status}">${task.status}</span>
                                <span class="history-time">${task.created_at}</span>
                            </div>
                            <p class="history-input">${task.user_input}</p>
                            <div class="history-actions">
                                ${task.video_path ? `<a href="/api/video/download/${task.id}" class="btn-success btn-sm">下载</a>` : ''}
                                <button class="btn-warning btn-sm" onclick="regenerateTask(${task.id})">重新生成</button>
                                <button class="btn-danger btn-sm" onclick="deleteTask(${task.id})">删除</button>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
