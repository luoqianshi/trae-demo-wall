<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公文整理 - TRAE开发工程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: white;
        }
        
        .form-section {
            padding: 20px;
        }
        
        .form-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #374151;
        }
        
        .form-section textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .form-section textarea:focus {
            outline: none;
            border-color: #10B981;
        }
        
        .form-section input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: #f9fafb;
            cursor: pointer;
        }
        
        .form-section input[type="file"]:hover {
            border-color: #10B981;
            background: #ecfdf5;
        }
        
        .form-section input[type="file"]:focus {
            outline: none;
            border-color: #10B981;
        }
        
        .options-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .option-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .option-item:hover {
            border-color: #10B981;
            background: #ecfdf5;
        }
        
        .option-item.selected {
            border-color: #10B981;
            background: #ecfdf5;
        }
        
        .option-icon {
            font-size: 2rem;
            color: #10B981;
            margin-bottom: 10px;
        }
        
        .option-name {
            font-weight: bold;
            color: #374151;
        }
        
        .option-desc {
            font-size: 0.85rem;
            color: #6B7280;
            margin-top: 5px;
        }
        
        .btn-primary {
            width: calc(100% - 40px);
            margin: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-section {
            padding: 20px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10B981 0%, #059669 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-message {
            color: #6B7280;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .result-section {
            padding: 20px;
            display: none;
        }
        
        .result-card {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }
        
        .result-card h3 {
            font-size: 1.2em;
            color: #374151;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .result-content {
            background: white;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: inherit;
            color: #374151;
            line-height: 1.6;
        }
        
        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-success {
            padding: 10px 25px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            padding: 10px 25px;
            background: #6B7280;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
        }
        
        .footer {
            padding: 20px;
            text-align: center;
            color: #9CA3AF;
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
        }
        
        .info-box {
            background: #ecfdf5;
            border-left: 4px solid #10B981;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }
        
        .info-box p {
            margin: 0;
            color: #065f46;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">
                <i class="bi bi-arrow-left"></i> 返回首页
            </a>
            <h1>📄 公文整理</h1>
            <p>智能分析公文内容，提取关键信息，生成结构化文档</p>
            <p style="font-size: 12px; opacity: 0.8; margin-top: 8px;">⚠️ AI生成仅供参考，请勿处理涉密和商秘</p>
        </div>
        
        <div class="form-section">
            <div class="info-box">
                <p><i class="bi bi-info-circle"></i> 支持粘贴文本内容或上传文档文件进行智能整理分析</p>
            </div>
            
            <label for="document-content">公文内容</label>
            <textarea id="document-content" placeholder="请粘贴公文内容，例如：

关于开展2024年度安全生产检查的通知

各部门、各单位：

为深入贯彻落实习近平总书记关于安全生产的重要论述，切实做好2024年度安全生产工作，有效防范和坚决遏制各类生产安全事故发生，经研究决定，在全公司范围内开展安全生产检查活动。现将有关事项通知如下：

一、检查范围
公司所属各生产经营单位、在建工程项目。

二、检查内容
1. 安全生产责任制落实情况
2. 安全隐患排查治理情况
3. 应急预案制定及演练情况
4. 安全培训教育情况

三、检查时间
2024年3月1日至3月31日

四、工作要求
1. 高度重视，加强领导
2. 全面排查，不留死角
3. 严格整改，闭环管理
4. 认真总结，及时报告

特此通知。

XX公司安全生产委员会
2024年2月20日"></textarea>
            
            <label for="document-file" style="margin-top: 20px;">或上传文件</label>
            <input type="file" id="document-file" accept=".doc,.docx,.pdf,.txt">
            
            <div class="options-row">
                <div class="option-item selected" data-option="summary">
                    <div class="option-icon"><i class="bi bi-file-text"></i></div>
                    <div class="option-name">内容摘要</div>
                    <div class="option-desc">提取核心要点</div>
                </div>
                <div class="option-item" data-option="structure">
                    <div class="option-icon"><i class="bi bi-list-ul"></i></div>
                    <div class="option-name">结构分析</div>
                    <div class="option-desc">分析文档结构</div>
                </div>
                <div class="option-item" data-option="extract">
                    <div class="option-icon"><i class="bi bi-search"></i></div>
                    <div class="option-name">信息提取</div>
                    <div class="option-desc">提取关键信息</div>
                </div>
            </div>
            
            <button class="btn-primary" id="process-btn">开始整理</button>
        </div>
        
        <div class="progress-section" id="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-message" id="progress-text">等待处理...</div>
        </div>
        
        <div class="result-section" id="result-section">
            <div class="result-card">
                <h3><i class="bi bi-file-earmark-check"></i> 整理结果</h3>
                <div class="result-content" id="result-content"></div>
            </div>
            <div class="result-actions">
                <button class="btn-success" id="download-btn"><i class="bi bi-download"></i> 下载文档</button>
                <button class="btn-secondary" id="reset-btn"><i class="bi bi-arrow-counterclockwise"></i> 重新整理</button>
            </div>
        </div>
        
        <div class="footer">
            <p>公文整理 - TRAE开发工程</p>
        </div>
    </div>
    
    <script>
        let selectedOption = 'summary';
        
        document.querySelectorAll('.option-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
                selectedOption = this.dataset.option;
            });
        });
        
        document.getElementById('process-btn').addEventListener('click', processDocument);
        document.getElementById('reset-btn').addEventListener('click', resetForm);
        
        function processDocument() {
            const content = document.getElementById('document-content').value.trim();
            const file = document.getElementById('document-file').files[0];
            
            if (!content && !file) {
                alert('请输入内容或上传文件');
                return;
            }
            
            document.getElementById('process-btn').disabled = true;
            document.getElementById('process-btn').textContent = '处理中...';
            
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = '正在分析...';
            
            setTimeout(() => {
                document.getElementById('progress-fill').style.width = '50%';
                document.getElementById('progress-text').textContent = '正在整理内容...';
            }, 500);
            
            setTimeout(() => {
                document.getElementById('progress-fill').style.width = '100%';
                document.getElementById('progress-text').textContent = '整理完成！';
                
                setTimeout(() => {
                    showResult();
                    document.getElementById('process-btn').disabled = false;
                    document.getElementById('process-btn').textContent = '开始整理';
                }, 500);
            }, 1500);
        }
        
        function showResult() {
            const content = document.getElementById('document-content').value.trim();
            let resultText = '';
            
            if (!content) {
                resultText = '【公文整理结果】\n\n由于您尚未输入具体的公文内容，公文整理功能将在后续开发中完善。\n\n功能特点：\n- 支持多种格式文档上传（DOC、DOCX、PDF、TXT）\n- AI智能分析文档内容\n- 自动提取关键信息（时间、地点、人物、事项等）\n- 生成结构化摘要\n- 支持文档格式转换\n\n敬请期待功能上线！';
            } else {
                switch(selectedOption) {
                    case 'summary':
                        resultText = '【内容摘要】\n\n根据您输入的公文内容，系统已完成智能摘要提取。\n\n主要内容包括：\n1. 发文目的：' + (content.includes('通知') ? '发布通知事项' : '开展相关工作') + '\n2. 涉及范围：' + (content.includes('各') ? '多个部门/单位' : '特定对象') + '\n3. 核心要求：详见原文各项条款\n\n完整摘要将在功能完善后提供。';
                        break;
                    case 'structure':
                        resultText = '【结构分析】\n\n文档结构分析结果：\n\n一、文档类型：' + (content.includes('通知') ? '通知类' : content.includes('报告') ? '报告类' : '公文类') + '\n\n二、章节结构：\n' + extractStructure(content) + '\n\n三、建议优化：\n- 建议增加目录导航\n- 建议对关键数据进行可视化展示\n- 建议补充相关附件说明';
                        break;
                    case 'extract':
                        resultText = '【信息提取】\n\n提取的关键信息：\n\n📅 时间信息：' + extractDates(content) + '\n\n🏢 单位信息：' + extractOrganizations(content) + '\n\n📋 事项信息：' + extractItems(content) + '\n\n更多详细信息提取功能将在后续版本中完善。';
                        break;
                }
            }
            
            document.getElementById('result-content').textContent = resultText;
            document.getElementById('result-section').style.display = 'block';
        }
        
        function extractStructure(content) {
            const lines = content.split('\n');
            const headings = lines.filter(line => line.startsWith('一') || line.startsWith('二') || 
                line.startsWith('三') || line.startsWith('四') || line.startsWith('第'));
            if (headings.length > 0) {
                return headings.slice(0, 5).map((h, i) => `${i + 1}. ${h.trim()}`).join('\n');
            }
            return '未检测到明显章节结构';
        }
        
        function extractDates(content) {
            const datePattern = /(\d{4}年\d{1,2}月\d{1,2}日)|(\d{4}-\d{2}-\d{2})|(\d{4}\.\d{2}\.\d{2})/g;
            const dates = content.match(datePattern);
            if (dates) {
                return dates.join('、');
            }
            return '未检测到具体日期';
        }
        
        function extractOrganizations(content) {
            const orgPattern = /([\u4e00-\u9fa5]+公司|[\u4e00-\u9fa5]+委员会|[\u4e00-\u9fa5]+部门)/g;
            const orgs = content.match(orgPattern);
            if (orgs) {
                return orgs.join('、');
            }
            return '未检测到具体单位';
        }
        
        function extractItems(content) {
            const itemPattern = /([（(]\d+[)）][^\n]+)/g;
            const items = content.match(itemPattern);
            if (items) {
                return '\n' + items.slice(0, 5).join('\n');
            }
            return '未检测到具体事项';
        }
        
        function resetForm() {
            document.getElementById('document-content').value = '';
            document.getElementById('document-file').value = '';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('progress-section').style.display = 'none';
        }
        
        document.getElementById('download-btn').addEventListener('click', function() {
            const content = document.getElementById('result-content').textContent;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '公文整理结果.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
