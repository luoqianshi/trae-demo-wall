<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT助手 - AI智能生成演示文稿</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .feature-section {
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
            margin: 20px;
            border: 2px solid #dbeafe;
        }
        
        .feature-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .toggle-label {
            font-size: 1.1em;
            font-weight: bold;
            color: #1F2937;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
        }
        
        input:checked + .slider {
            background-color: #3B82F6;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .slider.round {
            border-radius: 34px;
        }
        
        .slider.round:before {
            border-radius: 50%;
        }
        
        .form-group {
            padding: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #374151;
        }
        
        .form-group textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .form-group textarea:focus {
            outline: none;
            border-color: #3B82F6;
        }
        
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #3B82F6;
        }
        
        .template-section {
            padding: 20px;
        }
        
        .template-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 15px;
            color: #374151;
        }
        
        .template-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .template-card {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .template-card:hover {
            border-color: #3B82F6;
            transform: translateY(-2px);
        }
        
        .template-card.selected {
            border-color: #3B82F6;
            background-color: #eff6ff;
        }
        
        .template-color {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 3px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .template-name {
            font-weight: bold;
            color: #374151;
            margin-bottom: 5px;
        }
        
        .template-desc {
            font-size: 12px;
            color: #6B7280;
        }
        
        .btn {
            width: calc(100% - 40px);
            margin: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-container {
            padding: 20px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6 0%, #1E40AF 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-message {
            color: #6B7280;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .download-link {
            display: none;
            padding: 20px;
            text-align: center;
        }
        
        .download-link a {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .download-link a:hover {
            transform: translateY(-2px);
        }
        
        .footer {
            padding: 20px;
            text-align: center;
            color: #9CA3AF;
            font-size: 14px;
        }
        
        .feature-desc {
            color: #6B7280;
            font-size: 14px;
        }
        
        .svg-preview-container {
            padding: 20px;
            display: none;
        }
        
        .svg-preview-title {
            font-weight: bold;
            color: #374151;
            margin-bottom: 15px;
        }
        
        .svg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .svg-item {
            aspect-ratio: 16/9;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #f9fafb;
        }
        
        .svg-item svg {
            width: 100%;
            height: 100%;
        }
        
        .nav-tabs {
            margin: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .nav-tabs button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            color: #6B7280;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .nav-tabs button.active {
            color: #3B82F6;
            border-bottom-color: #3B82F6;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 PPT 助手</h1>
            <p>AI增强版 · 智能生成专业演示文稿</p>
            <p style="font-size: 12px; opacity: 0.8; margin-top: 8px;">⚠️ AI生成仅供参考，请勿处理涉密和商秘</p>
        </div>
        
        <div class="nav-tabs">
            <button class="active" onclick="switchTab('generate')">✨ 生成PPT</button>
            <button onclick="switchTab('preview')">👁️ 预览</button>
        </div>
        
        <div id="generateTab" class="tab-content active">
            <div class="feature-section">
                <div class="feature-toggle">
                    <span class="toggle-label">🚀 启用AI智能优化</span>
                    <label class="switch">
                        <input type="checkbox" id="aiToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <p class="feature-desc">AI优化可以自动分析内容结构、优化排版建议，生成更专业的PPT</p>
            </div>
            
            <div class="template-section">
                <label for="templates">🎨 选择设计模板</label>
                <div class="template-grid" id="templateGrid">
                    <div class="template-card selected" data-id="default">
                        <div class="template-color" style="background: #1E40AF;"></div>
                        <div class="template-name">默认</div>
                        <div class="template-desc">经典商务风格</div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="projectName">项目名称</label>
                <input type="text" id="projectName" placeholder="输入项目名称，如：2024年度总结">
            </div>
            
            <div class="form-group">
                <label for="content">内容描述</label>
                <textarea id="content" placeholder="请输入PPT内容描述，例如：

# 2024年度工作总结

## 一、工作成果
- 完成了3个重点项目
- 团队协作效率提升30%
- 客户满意度达到95%

## 二、存在问题
- 资源分配不均衡
- 部分流程需要优化

## 三、下一步计划
- 优化资源配置
- 推进数字化转型"></textarea>
            </div>
            
            <button class="btn" id="generateBtn">✨ 生成PPT</button>
            
            <div class="progress-container" id="progressContainer">
                <div class="status-message" id="statusMessage">正在准备...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <div class="download-link" id="downloadLink">
                <p style="margin-bottom: 10px; color: #374151;">🎉 PPT生成完成！</p>
                <a href="#" id="downloadBtn">下载PPT</a>
            </div>
        </div>
        
        <div id="previewTab" class="tab-content">
            <div class="svg-preview-container" id="svgPreviewContainer">
                <div class="svg-preview-title">📄 幻灯片预览</div>
                <div class="svg-grid" id="svgGrid"></div>
            </div>
            <div style="padding: 20px; text-align: center; color: #9CA3AF;" id="noPreviewMessage">
                请先生成PPT以查看预览
            </div>
        </div>
        
        <div class="footer">
            <p>PPT助手 - 独立模块</p>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const content = document.getElementById('content');
        const projectName = document.getElementById('projectName');
        const aiToggle = document.getElementById('aiToggle');
        const templateGrid = document.getElementById('templateGrid');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLink = document.getElementById('downloadLink');
        const downloadBtn = document.getElementById('downloadBtn');
        const svgPreviewContainer = document.getElementById('svgPreviewContainer');
        const svgGrid = document.getElementById('svgGrid');
        const noPreviewMessage = document.getElementById('noPreviewMessage');
        
        let selectedTemplate = null;
        let currentProjectName = '';
        
        function switchTab(tabName) {
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'preview' && currentProjectName) {
                loadSvgPreview();
            }
        }
        
        function selectTemplate(templateId) {
            document.querySelectorAll('.template-card').forEach(card => {
                card.classList.remove('selected');
            });
            const selectedCard = document.querySelector(`[data-id="${templateId}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            selectedTemplate = templateId === 'default' ? null : templateId;
            console.log('选中模板:', selectedTemplate);
        }
        
        templateGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.template-card');
            if (card) {
                selectTemplate(card.dataset.id);
            }
        });
        
        async function loadTemplates() {
            try {
                const response = await fetch('/api/templates');
                const result = await response.json();
                const templates = result.value || result;
                
                if (templates.length > 0) {
                    templateGrid.innerHTML = '';
                    
                    const defaultCard = document.createElement('div');
                    defaultCard.className = 'template-card selected';
                    defaultCard.dataset.id = 'default';
                    defaultCard.innerHTML = `
                        <div class="template-color" style="background: #1E40AF;"></div>
                        <div class="template-name">默认</div>
                        <div class="template-desc">经典商务风格</div>
                    `;
                    templateGrid.appendChild(defaultCard);
                    
                    templates.forEach(template => {
                        if (template.id === 'default') return;
                        
                        const card = document.createElement('div');
                        card.className = 'template-card';
                        card.dataset.id = template.id;
                        card.innerHTML = `
                            <div class="template-color" style="background: ${template.primary_color};"></div>
                            <div class="template-name">${template.name}</div>
                            <div class="template-desc">${template.description}</div>
                        `;
                        templateGrid.appendChild(card);
                    });
                    
                    console.log('模板加载完成:', templates.length, '个模板');
                }
            } catch (error) {
                console.error('加载模板失败:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadTemplates);
        
        generateBtn.addEventListener('click', async () => {
            if (!content.value.trim()) {
                alert('请输入内容描述');
                return;
            }
            
            generateBtn.disabled = true;
            progressContainer.style.display = 'block';
            downloadLink.style.display = 'none';
            progressFill.style.width = '0%';
            statusMessage.textContent = '正在准备...';
            
            const requestData = {
                user_input: content.value,
                project_name: projectName.value.trim() || null,
                use_ai: aiToggle.checked,
                template_id: selectedTemplate
            };
            
            try {
                statusMessage.textContent = '正在优化内容...';
                progressFill.style.width = '10%';
                
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    progressFill.style.width = '100%';
                    statusMessage.textContent = 'PPT生成完成';
                    
                    currentProjectName = result.project_name;
                    downloadBtn.href = result.download_url;
                    
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        downloadLink.style.display = 'block';
                        generateBtn.disabled = false;
                    }, 500);
                } else {
                    alert('生成失败: ' + result.error);
                    generateBtn.disabled = false;
                    progressContainer.style.display = 'none';
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
                generateBtn.disabled = false;
                progressContainer.style.display = 'none';
            }
        });
        
        async function loadSvgPreview() {
            if (!currentProjectName) return;
            
            try {
                const response = await fetch(`/api/project/${currentProjectName}/svg_list`);
                const result = await response.json();
                
                if (result.success && result.svg_files.length > 0) {
                    svgGrid.innerHTML = '';
                    svgPreviewContainer.style.display = 'block';
                    noPreviewMessage.style.display = 'none';
                    
                    result.svg_files.forEach(svgFile => {
                        const svgItem = document.createElement('div');
                        svgItem.className = 'svg-item';
                        svgItem.innerHTML = svgFile.content;
                        svgGrid.appendChild(svgItem);
                    });
                } else {
                    svgPreviewContainer.style.display = 'none';
                    noPreviewMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('加载SVG预览失败:', error);
            }
        }
    </script>
</body>
</html>
