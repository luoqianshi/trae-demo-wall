<div id="app">

  </div>

    <div class="home-hero">
      <div class="mascot"><span class="iconify" data-icon="lucide:book-open" style="font-size:3.5rem;color:var(--accent);"></span></div>
      <h1>知阅<span>词堂</span></h1>
      <p>二年级AI速读训练</p>

      <div class="stat-item">
        <div class="num" id="statTotal">0</div>
        <div class="label">阅读篇数</div>
      </div>
      <div class="stat-item">
        <div class="num" id="statTime">0</div>
        <div class="label">累计分钟</div>
      </div>
      <div class="stat-item">
        <div class="num" id="statScore">0</div>
        <div class="label">平均正确率</div>
      </div>
    </div>

    <div class="room-preview" onclick="showPage('pageRoom')">
      <div class="room-icon">
        <img id="homeRoomImg" src="assets/tr_room1_hut.jpg" alt="书房">
        <canvas id="homeFxCanvas"></canvas>
      </div>
      <div class="room-name" id="roomName">我的茅草屋</div>
      <div class="room-progress"><div class="room-progress-bar" id="roomBar" style="width:0%"></div></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">

    </div>

  </div>

      <span class="timer-icon"><span class="iconify" data-icon="lucide:timer" style="font-size:1.2rem;vertical-align:-0.15em;"></span></span>
      <span class="timer-text" id="timerDisplay">00:00</span>
    </div>
    <div class="article-title" id="readTitle"></div>
    <div class="pinyin-text" id="readContent"></div>
    <div class="read-actions">

      <button class="btn btn-primary" onclick="finishRead()"><span class="iconify" data-icon="lucide:pen-line" style="font-size:0.95rem;vertical-align:-0.15em;"></span> 读完出题</button>
    </div>
  </div>

      <div class="result-label">正确率</div>

function init() {
  renderArticleList();
  renderStats();
  renderRoom();

function renderStats() {
  document.getElementById('statTotal').textContent = state.totalRead;
  document.getElementById('statTime').textContent = state.totalMin;
  const avg = state.totalRead > 0 ? Math.round(state.totalScore / state.totalRead) : 0;
  document.getElementById('statScore').textContent = avg + '%';
}

function renderArticleList() {
  const el = document.getElementById('articleList');
  el.innerHTML = ARTICLES.map(a => `
    <div class="article-card" onclick="startArticle(${a.id})">
      <div class="art-icon"><span class="iconify" data-icon="${a.icon}" style="font-size:1.8rem;color:var(--accent);"></span></div>
      <div class="art-info">
        <div class="art-title">${a.title}</div>
        <div class="art-meta">约 ${a.wordCount} 字 &#x00b7; 5 道题</div>
      </div>
      <div class="art-arrow">&#x203a;</div>
    </div>
  `).join('');
}

        x: Math.random() * canvas.width,
        y: canvas.height * (0.03 + Math.random() * 0.12),
        w: canvas.width * (0.12 + Math.random() * 0.15),
        speed: 0.15 + Math.random() * 0.25,
        opacity: 0.3 + Math.random() * 0.35,
      });
    }
  },

  initButterflies(canvas) {
    this.butterflies = [];
    const colors = ['#ff9ecd','#ffd166','#a0e4ff','#c4b5fd','#fca5a5'];
    for (let i = 0; i < 3; i++) {
      this.butterflies.push({
        x: Math.random() * canvas.width,
        y: canvas.height * (0.25 + Math.random() * 0.35),
        baseY: 0,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.5,
        wingPhase: Math.random() * Math.PI * 2,
        color: colors[i % colors.length],
        size: 3 + Math.random() * 2,
        dir: Math.random() > 0.5 ? 1 : -1,
      });
      this.butterflies[i].baseY = this.butterflies[i].y;
    }
  },

  drawCloud(ctx, c) {
    ctx.fillStyle = `rgba(255,255,255,${c.opacity})`;
    const h = c.w * 0.35;
    // Simple pixel cloud: stack of rounded rects
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w * 0.5, h * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.25, c.y + h * 0.15, c.w * 0.3, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.28, c.y + h * 0.1, c.w * 0.32, h * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  },

  drawButterfly(ctx, b, time) {
    const wingFlap = Math.sin(time * 0.012 + b.wingPhase) * 0.8;
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.dir < 0) ctx.scale(-1, 1);

    // Body
    ctx.fillStyle = '#333';
    ctx.fillRect(-0.5, -b.size * 1.5, 1, b.size * 3);

    // Wings (upper pair)
    ctx.fillStyle = b.color;
    ctx.save();
    ctx.transform(1, 0, wingFlap * 0.6, 1, 0, -b.size * 0.3);
    ctx.beginPath();
    ctx.ellipse(-b.size * 1.5, -b.size * 0.5, b.size * 1.5, b.size * 1.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Wings (lower pair)
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.7;
    ctx.save();
    ctx.transform(1, 0, wingFlap * 0.4, 1, 0, b.size * 0.3);
    ctx.beginPath();
    ctx.ellipse(-b.size * 1.2, b.size * 0.5, b.size * 1.1, b.size * 0.9, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Wing spots
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-b.size * 1.5, -b.size * 0.5, b.size * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  },

  tick(canvasId, imgId) {
    const canvas = document.getElementById(canvasId);
    const img = document.getElementById(imgId);
    if (!canvas || !img) return;

    const resize = () => {
      canvas.width = img.clientWidth * 2;
      canvas.height = img.clientHeight * 2;
      if (this.clouds.length === 0) this.initClouds(canvas);
      if (this.butterflies.length === 0) this.initButterflies(canvas);
    };

    const key = canvasId;
    if (this.timers[key]) cancelAnimationFrame(this.timers[key]);

    resize();
    const time = { v: Date.now() };

    const loop = () => {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      time.v = Date.now();

      // Update & draw clouds
      this.clouds.forEach(c => {
        c.x += c.speed;
        if (c.x - c.w > canvas.width) c.x = -c.w;
        this.drawCloud(ctx, c);
      });

      // Update & draw butterflies
      this.butterflies.forEach(b => {
        b.phase += 0.015;
        b.x += b.speed * b.dir;
        b.y = b.baseY + Math.sin(b.phase) * canvas.height * 0.04;

        // Bounce off edges
        if (b.x > canvas.width * 0.9) { b.dir = -1; }
        if (b.x < canvas.width * 0.1) { b.dir = 1; }

        this.drawButterfly(ctx, b, time.v);
      });

      this.timers[key] = requestAnimationFrame(loop);
    };
    loop();
  }
};

function renderRoom() {
  const level = getCurrentLevel();
  const next = ROOM_LEVELS[level.idx + 1];
  const progress = next ? Math.min(100, (state.totalMin / next.req) * 100) : 100;

  document.getElementById('homeRoomImg').src = level.img;
  document.getElementById('roomName').textContent = '我的' + level.name;
  document.getElementById('roomBar').style.width = progress + '%';

  if (next) {
    const need = next.req - state.totalMin;
    document.getElementById('roomInfo').textContent = `再阅读 ${need} 分钟可升级成${next.name}`;
  } else {
    document.getElementById('roomInfo').textContent = '已达到最高等级！';
  }

  startHomeNPC(level);
}

function renderRoomPage() {
  const level = getCurrentLevel();
  document.getElementById('rsBg').src = level.img;
  document.getElementById('rsName').textContent = '我的' + level.name;
  document.getElementById('rsDesc').textContent = `累计阅读 ${state.totalMin} 分钟`;

  RoomFX.tick('roomFxCanvas', 'rsBg');

  document.getElementById('levelList').innerHTML = ROOM_LEVELS.map((l, i) => {
    const isCurrent = i === level.idx;
    const isDone = i < level.idx;
    const locked = i > level.idx;
    return `
      <div class="level-item ${isCurrent ? 'current' : ''} ${locked ? 'locked' : ''}">
        <div class="li-icon"><img src="${l.thumb}" alt="${l.name}"></div>
        <div class="li-info">
          <div class="li-name">${l.name}</div>
          <div class="li-req">需要累计 ${l.req} 分钟 &#x00b7; ${l.desc}</div>
        </div>
        <div class="li-status ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
          ${isDone ? '<span class="iconify" data-icon="lucide:circle-check" style="font-size:0.85rem;vertical-align:-0.15em;"></span> 已解锁' : isCurrent ? '<span class="iconify" data-icon="lucide:star" style="font-size:0.85rem;vertical-align:-0.15em;"></span> 当前' : '<span class="iconify" data-icon="lucide:lock" style="font-size:0.85rem;vertical-align:-0.15em;"></span> 未解锁'}
        </div>
      </div>
    `;
  }).join('');

  startRoomNPC(level);
}

function getCurrentLevel() {
  for (let i = ROOM_LEVELS.length - 1; i >= 0; i--) {
    if (state.totalMin >= ROOM_LEVELS[i].req) return { ...ROOM_LEVELS[i], idx: i };
  }
  return { ...ROOM_LEVELS[0], idx: 0 };
}

// ===================== NAVIGATION =====================
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  const showHeader = pageId !== 'pageHome';
  document.getElementById('headerBar').style.display = showHeader ? 'flex' : 'none';
  window.scrollTo(0, 0);
}

function goBack() {
  const active = document.querySelector('.page.active');
  if (active.id === 'pageReading') {
    if (confirm('确定要退出阅读吗？进度将不会保存。')) showPage('pageHome');
  } else if (active.id === 'pageQuiz') {
    if (confirm('确定要退出答题吗？')) showPage('pageHome');
  } else {
    showPage('pageHome');
  }
}

// ===================== READING =====================
function startArticle(id) {
  showLoading('AI正在生成文章...');
  setTimeout(() => {
    hideLoading();
    state.currentArticle = ARTICLES.find(a => a.id === id);
    state.answers = [];
    state.currentQ = 0;
    state.sec = 0;
    state.showPinyin = true;
    state.lookbackCount = 0;

    document.getElementById('readTitle').textContent = state.currentArticle.title;
    renderArticleContent();
    startTimer();
    showPage('pageReading');
  }, 1200);
}

function renderArticleContent() {
  const article = state.currentArticle;
  let html = '';
  let firstPara = true;
  article.content.forEach(para => {
    if (!firstPara) html += '<span class="paragraph-break"></span>';
    firstPara = false;
    html += '<span class="indent">';
    para.forEach(item => {
      if (item.p === null) {
        html += `<span style="margin:0 2px;">${item.h}</span>`;
      } else if (state.showPinyin) {
        html += `<span class="char-pair"><span class="pinyin">${item.p}</span><span class="hanzi">${item.h}</span></span>`;
      } else {
        html += `<span class="hanzi">${item.h}</span>`;
      }
    });
    html += '</span>';
  });
  document.getElementById('readContent').innerHTML = html;
  document.getElementById('btnPinyin').innerHTML = state.showPinyin ? '<span class="iconify" data-icon="lucide:languages" style="font-size:0.95rem;vertical-align:-0.15em;"></span> 隐藏拼音' : '<span class="iconify" data-icon="lucide:languages" style="font-size:0.95rem;vertical-align:-0.15em;"></span> 显示拼音';
}

function togglePinyin() {
  state.showPinyin = !state.showPinyin;
  renderArticleContent();
}

function startTimer() {
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.sec++;
    const m = String(Math.floor(state.sec / 60)).padStart(2, '0');
    const s = String(state.sec % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  }, 1000);
}

function finishRead() {
  clearInterval(state.timer);
  state.lookbackCount = Math.floor(Math.random() * 3);
  showLoading('AI正在出题...');
  setTimeout(() => {
    hideLoading();
    renderQuiz();
    showPage('pageQuiz');
  }, 1000);
}

// ===================== QUIZ =====================
function renderQuiz() {
  const questions = state.currentArticle.questions;
  const progressEl = document.getElementById('quizProgress');
  progressEl.innerHTML = questions.map((_, i) => {
    let cls = '';
    if (i < state.currentQ) cls = 'done';
    else if (i === state.currentQ) cls = 'current';
    return `<div class="dot ${cls}"></div>`;
  }).join('');

  const q = questions[state.currentQ];
  const qNum = state.currentQ + 1;
  const total = questions.length;
  const typeLabel = q.type === 'choice' ? '选择题' : '判断题';

  let optionsHtml = '';
  if (q.type === 'choice') {
    optionsHtml = q.options.map((opt, i) => `
      <button class="option-btn ${state.answers[state.currentQ] === i ? 'selected' : ''}"
        onclick="selectAnswer(${i})">${String.fromCharCode(65 + i)}. ${opt}</button>
    `).join('');
  } else {
    optionsHtml = `
      <button class="option-btn ${state.answers[state.currentQ] === 1 ? 'selected' : ''}"
        onclick="selectAnswer(1)"><span class="iconify" data-icon="lucide:check" style="font-size:0.85rem;vertical-align:-0.15em;color:var(--success);"></span> 正确</button>
      <button class="option-btn ${state.answers[state.currentQ] === 0 ? 'selected' : ''}"
        onclick="selectAnswer(0)"><span class="iconify" data-icon="lucide:x" style="font-size:0.85rem;vertical-align:-0.15em;color:var(--error);"></span> 错误</button>
    `;
  }

  document.getElementById('quizContent').innerHTML = `
    <div class="question-card">
      <div class="q-num">第 ${qNum}/${total} 题</div>
      <div class="q-type">${typeLabel}</div>
      <div class="q-text">${q.text}</div>
      ${optionsHtml}
    </div>
  `;

  const btn = document.getElementById('btnSubmit');
  if (state.currentQ < total - 1) {
    btn.textContent = '下一题';
    btn.disabled = state.answers[state.currentQ] === undefined;
  } else {
    btn.textContent = '提交答案';
    btn.disabled = state.answers[state.currentQ] === undefined;
  }
}

function selectAnswer(idx) {
  state.answers[state.currentQ] = idx;
  renderQuiz();
}

function submitQuiz() {
  if (state.currentQ < state.currentArticle.questions.length - 1) {
    state.currentQ++;
    renderQuiz();
  } else {
    showResult();
  }
}

// ===================== RESULT =====================
function showResult() {
  const article = state.currentArticle;
  const questions = article.questions;
  let correct = 0;
  questions.forEach((q, i) => {
    if (q.type === 'choice' && state.answers[i] === q.correct) correct++;
    if (q.type === 'tf' && state.answers[i] === (q.correct ? 1 : 0)) correct++;
  });
  const score = Math.round((correct / questions.length) * 100);

  state.totalRead++;
  state.totalMin += Math.ceil(state.sec / 60);
  state.totalScore += score;
  localStorage.setItem('rp_totalRead', state.totalRead);
  localStorage.setItem('rp_totalMin', state.totalMin);
  localStorage.setItem('rp_totalScore', state.totalScore);
  renderStats();
  renderRoom();
  renderRoomPage();

  const speed = Math.round(article.wordCount / (state.sec / 60));
  document.getElementById('resultScore').textContent = score + '%';
  document.getElementById('resultScore').style.color = score >= 80 ? 'var(--success)' : score >= 50 ? 'var(--warn)' : 'var(--error)';
  document.getElementById('resultIcon').innerHTML = score >= 80 ? '<span class="iconify" data-icon="lucide:party-popper" style="font-size:2.8rem;color:var(--warn);"></span>' : score >= 50 ? '<span class="iconify" data-icon="lucide:trophy" style="font-size:2.8rem;color:var(--accent);"></span>' : '<span class="iconify" data-icon="lucide:lightbulb" style="font-size:2.8rem;color:var(--warn);"></span>';
  document.getElementById('resTime').textContent = formatTime(state.sec);
  document.getElementById('resSpeed').textContent = speed + ' 字/分钟';
  document.getElementById('resCount').textContent = correct + '/' + (questions.length - correct);
  document.getElementById('resLookback').textContent = state.lookbackCount + ' 次';

  document.getElementById('reviewList').innerHTML = questions.map((q, i) => {
    let userAns, isCorrect;
    if (q.type === 'choice') {
      userAns = q.options[state.answers[i]];
      isCorrect = state.answers[i] === q.correct;
    } else {
      userAns = state.answers[i] === 1 ? '正确' : '错误';
      isCorrect = state.answers[i] === (q.correct ? 1 : 0);
    }
    const correctAns = q.type === 'choice' ? q.options[q.correct] : (q.correct ? '正确' : '错误');
    const hint = (!isCorrect && q.hint) ? q.hint : null;
    return `
      <div class="review-item ${!isCorrect ? 'wrong' : ''}">
        <div class="ri-status">${isCorrect ? '<span class="iconify" data-icon="lucide:check-circle-2" style="font-size:1.2rem;color:var(--success);"></span>' : '<span class="iconify" data-icon="lucide:x-circle" style="font-size:1.2rem;color:var(--error);"></span>'}</div>
        <div class="ri-content">
          <div class="ri-q">${i + 1}. ${q.text}</div>
          <div class="ri-a">
            你的答案：<span class="your">${userAns}</span>
            ${!isCorrect ? `<br>正确答案：<span class="correct">${correctAns}</span>` : ''}
          </div>
          ${hint ? `<div class="ri-hint"><span class="iconify" data-icon="lucide:sparkles" style="font-size:0.85rem;color:var(--accent);vertical-align:-0.1em;"></span> <strong>AI解题思路：</strong>${hint}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const aiEl = document.getElementById('aiAnalysis');
  if (score === 100) {
    aiEl.style.display = 'block';
    document.getElementById('aiText').textContent = '太棒了！你全对了！说明你对这篇文章理解得非常透彻，阅读能力很强哦！';
    document.getElementById('aiTip').textContent = '继续保持，可以尝试挑战更多文章，或者关闭拼音试试裸读模式！';
  } else if (score >= 60) {
    aiEl.style.display = 'block';
    document.getElementById('aiText').textContent = article.analysis;
    document.getElementById('aiTip').textContent = '建议把错题对应的文章段落再读一遍，注意人物的想法和故事细节。下次加油！';
  } else {
    aiEl.style.display = 'block';
    document.getElementById('aiText').textContent = '这次的成绩不太理想，但不要灰心！可能阅读时有点着急，建议放慢速度，逐字逐句地理解文章内容。';
    document.getElementById('aiTip').textContent = '可以先不答题，把文章多读几遍，理解大意后再尝试答题。坚持就是胜利！';
  }

  showPage('pageResult');
  showToast(`获得 ${Math.ceil(state.sec / 60)} 分钟阅读时长！`);
}

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

// ===================== UTILS =====================
function showLoading(text) {
  document.getElementById('loading').classList.add('active');
  document.querySelector('.load-text').textContent = text;
}

function hideLoading() {
  document.getElementById('loading').classList.remove('active');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===================== BOOT =====================
init();
</script>
