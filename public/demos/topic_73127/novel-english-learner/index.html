<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>爽文英语 - 在爽文中轻松学英语</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Home Page -->
    <div id="page-home" class="page active"></div>
    
    <!-- Words Page -->
    <div id="page-words" class="page"></div>
    
    <!-- Profile Page -->
    <div id="page-profile" class="page"></div>
    
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item" data-page="words">
        <span class="nav-icon">📚</span>
        <span>生词</span>
      </button>
      <button class="nav-item active" data-page="home">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="profile">
        <span class="nav-icon">👤</span>
        <span>个人</span>
      </button>
    </nav>
    
    <!-- Word Detail Modal -->
    <div id="word-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="close-modal">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>
  
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
