<script>
// ============================================================
//  G.Weapons - 武器系统模块
// ============================================================
(function(G) {
    const Weapons = {};
    let player = null;

    Weapons.init = function(p) {
        player = p;
    };

    Weapons.has = function(id) {
        return player.weapons.find(w => w.id === id);
    };

    Weapons.add = function(id) {
        if (player.weapons.length >= CFG.MAX_WEAPONS && !CFG.WEAPONS[id].isEvolved) return false;
        if (Weapons.has(id)) return false;
        player.weapons.push({ id, level: 0 });
        player.weaponCooldowns[id] = 0;
        return true;
    };

    Weapons.upgrade = function(id) {
        const w = player.weapons.find(w => w.id === id);
        if (!w) return false;
        const def = CFG.WEAPONS[id];
        if (w.level >= def.levels.length - 1) return false;
        w.level++;
        return true;
    };

    Weapons.addPassive = function(id) {
        if (player.passives.length >= CFG.MAX_PASSIVES) return false;
        if (Weapons.hasPassive(id)) return false;
        player.passives.push({ id, level: 1 });
        return true;
    };

    Weapons.upgradePassive = function(id) {
        const p = player.passives.find(p => p.id === id);
        if (!p) return false;
        const def = CFG.PASSIVES[id];
        if (p.level >= def.max) return false;
        p.level++;
        return true;
    };

    Weapons.hasPassive = function(id) {
        return !!player.passives.find(p => p.id === id);
    };

    Weapons.passiveLevel = function(id) {
        const p = player.passives.find(p => p.id === id);
        return p ? p.level : 0;
    };

    Weapons.tryEvolve = function(baseId) {
        const wd = CFG.WEAPONS[baseId];
        if (!wd || !wd.evolvePassive) return false;
        if (player.weapons.length < CFG.MAX_WEAPONS) return false;
        const w = player.weapons.find(w => w.id === baseId);
        if (!w) return false;
        if (w.level < wd.levels.length - 1) return false;
        const pLv = Weapons.passiveLevel(wd.evolvePassive);
        if (pLv < CFG.PASSIVES[wd.evolvePassive].max) return false;
        // Evolve!
        w.id = wd.evolvedId;
        w.level = 0;
        player.weaponCooldowns[wd.evolvedId] = 0;
        FX.addBurst(player.x, player.y, '#ffc040', 30);
        FX.addFloatText(player.x, player.y - 50, '进化! ' + CFG.WEAPONS[wd.evolvedId].name, '#ffc040', 20);
        return true;
    };

    Weapons.getLevel = function(id) {
        const w = player.weapons.find(w => w.id === id);
        return w ? w.level : -1;
    };

    // ---- 武器开火逻辑 ----
    Weapons.update = function(dt, state, enemies) {
        if (state.levelUp || state.chestOpen || state.gameOver || state.victory) return;
        const p = player;
        for (const w of p.weapons) {
            const def = CFG.WEAPONS[w.id];
            const lv = def.levels[w.level];
            p.weaponCooldowns[w.id] -= dt;
            if (def.type === 'orbit' || def.type === 'mirror_evo') {
                Weapons.updateOrbit(w, def, lv, dt, enemies, state);
            } else if (def.type === 'fire') {
                Weapons.updateFire(w, def, lv, dt, state);
            } else if (def.type === 'fire_evo') {
                Weapons.updateFireEvo(w, def, lv, dt, enemies, state);
            } else if (def.type === 'coinrain') {
                Weapons.updateCoinRain(w, def, lv, dt, enemies, state);
            }
            const isCdBased = (def.type === 'melee' || def.type === 'projectile' || def.type === 'boomerang' || def.type === 'shockwave');
            if (isCdBased && p.weaponCooldowns[w.id] <= 0 && lv.cd > 0) {
                p.weaponCooldowns[w.id] = lv.cd * p.stats.cdMul;
                switch (def.type) {
                    case 'melee': Weapons.fireMelee(def, lv, enemies, state); break;
                    case 'projectile': Weapons.fireProjectile(def, lv, enemies, state); break;
                    case 'boomerang': Weapons.fireBoomerang(def, lv, enemies, state); break;
                    case 'shockwave': Weapons.fireShockwave(def, lv, enemies, state); break;
                }
            }
        }
    };

    Weapons.fireMelee = function(def, lv, enemies, state) {
        const p = player;
        const stats = p.stats;
        // 增大寻敌范围，确保能锁定到目标
        const searchRange = lv.area * stats.areaMul + 180;
        const target = Enemies.findNearest(p.x, p.y, searchRange);
        const faceAng = target ? Math.atan2(target.y - p.y, target.x - p.x) : p.facing;
        const area = lv.area * stats.areaMul;
        const count = lv.count;
        for (let i = 0; i < count; i++) {
            const spread = (i - (count - 1) / 2) * (count > 1 ? 0.8 : 0);
            const ang = faceAng + spread;
            // 基础武器（桃木剑）使用更大攻击角度，进化武器360度
            const arc = def.isEvolved ? Math.PI * 2 : (count === 1 ? Math.PI * 1.2 : Math.PI * 0.7);
            const slash = {
                x: p.x, y: p.y,
                angle: ang,
                arc: arc,
                radius: area,
                life: def.isEvolved ? 0.25 : 0.2,
                maxLife: def.isEvolved ? 0.25 : 0.2,
                dmg: lv.dmg,
                dmgMul: (lv.dmgMul || 1),
                color: def.color,
                hitSet: new Set(),
            };
            G.Entities.slashes.push(slash);
            // 挥砍特效粒子
            if (!def.isEvolved) {
                for (let s = 0; s < 6; s++) {
                    const sa = ang + U.rand(-arc/2, arc/2);
                    const sr = U.rand(area*0.3, area*0.8);
                    FX.addParticle(p.x + Math.cos(sa)*sr*0.5, p.y + Math.sin(sa)*sr*0.5, def.color, {
                        vx: Math.cos(sa)*U.rand(80,150), vy: Math.sin(sa)*U.rand(80,150),
                        life: 0.2, size: U.rand(2,4), glow: true, drag: 3
                    });
                }
            }
        }
    };

    Weapons.fireProjectile = function(def, lv, enemies, state) {
        const p = player;
        const stats = p.stats;
        const count = lv.count;
        for (let i = 0; i < count; i++) {
            let target = null;
            let bestD = 999999;
            for (const e of enemies) {
                if (e.dead) continue;
                const d = U.dist2(p, e);
                if (d < bestD) { bestD = d; target = e; }
            }
            let ang;
            if (target) {
                ang = Math.atan2(target.y - p.y, target.x - p.x);
            } else {
                ang = p.facing + U.rand(-0.3, 0.3);
            }
            ang += U.rand(-0.15, 0.15) + (i - (count - 1) / 2) * 0.2;
            const spd = lv.speed;
            G.Entities.projectiles.push({
                x: p.x, y: p.y,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                dmg: lv.dmg, dmgMul: (lv.dmgMul || 1) * stats.dmgMul,
                radius: (lv.area || 12) * stats.areaMul * (lv.areaMul || 1),
                pierce: lv.pierce,
                life: 2 * stats.durMul,
                homing: true,
                color: def.color,
                chain: lv.chain || false,
                hitSet: new Set(),
                trail: [],
            });
        }
    };

    Weapons.updateOrbit = function(w, def, lv, dt, enemies, state) {
        const p = player;
        const stats = p.stats;
        if (!w.orbits) {
            w.orbits = [];
            const radius = 50;
            for (let i = 0; i < lv.count; i++) {
                w.orbits.push({ angle: (i / lv.count) * U.TAU, hitSet: new Set() });
            }
        }
        const area = (lv.area || 24) * stats.areaMul * (lv.areaMul || 1);
        const dmg = lv.dmg * (lv.dmgMul || 1);
        const orbitR = 75 + (def.isEvolved ? 25 : 0);  // 增大轨道半径
        const spd = lv.speed;
        for (let i = 0; i < w.orbits.length; i++) {
            const o = w.orbits[i];
            o.angle += spd * dt;
            const ox = p.x + Math.cos(o.angle) * orbitR;
            const oy = p.y + Math.sin(o.angle) * orbitR;
            o.x = ox; o.y = oy; o.radius = area;
            for (const e of enemies) {
                if (e.dead) continue;
                if (o.hitSet.has(e)) continue;
                if (U.dist2({ x: ox, y: oy }, e) < (area + e.radius) * (area + e.radius)) {
                    Enemies.damageEnemy(e, dmg, 1, ox, oy, state);
                    o.hitSet.add(e);
                    FX.addBurst(ox, oy, def.color, 4, { minSpeed: 20, maxSpeed: 60 });
                }
            }
            // Clear hit set for enemies outside range
            for (const e of Array.from(o.hitSet)) {
                if (U.dist2({ x: ox, y: oy }, e) > (area + e.radius + 20) * (area + e.radius + 20)) {
                    o.hitSet.delete(e);
                }
            }
            // Reflect projectiles for mirror evo
            if (lv.reflect) {
                for (const proj of G.Entities.enemyProjectiles) {
                    if (proj.reflected) continue;
                    if (U.dist2({ x: ox, y: oy }, proj) < (area + proj.radius) * (area + proj.radius)) {
                        proj.reflected = true;
                        proj.fromPlayer = true;
                        proj.dmg = dmg * 0.5;
                        proj.dmgMul = 1;
                        proj.life = 2;
                        const ang = Math.atan2(p.y - proj.y, p.x - proj.x);
                        proj.vx = Math.cos(ang) * 300;
                        proj.vy = Math.sin(ang) * 300;
                    }
                }
            }
        }
    };

    Weapons.updateFire = function(w, def, lv, dt, state) {
        const p = player;
        p.fireTrailCd -= dt;
        if (p.moving && p.fireTrailCd <= 0) {
            p.fireTrailCd = lv.cd;
            const area = (lv.area || 50) * p.stats.areaMul * (lv.areaMul || 1);
            G.Entities.fires.push({
                x: p.x, y: p.y,
                radius: area,
                life: lv.dur * p.stats.durMul,
                maxLife: lv.dur * p.stats.durMul,
                dmg: lv.dmg * (lv.dmgMul || 1),
                tickRate: lv.tickRate,
                tick: lv.tickRate,
                color: def.color,
                hitSet: new Set(),
            });
        }
    };

    Weapons.updateFireEvo = function(w, def, lv, dt, enemies, state) {
        const p = player;
        p.coinRainT = (p.coinRainT || 0) + dt;
        if (p.coinRainT >= lv.cd) {
            p.coinRainT = 0;
            for (let i = 0; i < lv.count; i++) {
                const tgt = Enemies.findNearest(p.x + U.rand(-200, 200), p.y + U.rand(-200, 200), 999999);
                if (!tgt) continue;
                const sx = tgt.x + U.rand(-60, 60);
                const sy = tgt.y - 250;
                G.Entities.projectiles.push({
                    x: sx, y: sy,
                    vx: 0, vy: lv.speed || 500,
                    dmg: lv.dmg, dmgMul: (lv.dmgMul || 1),
                    radius: (lv.area || 14) * p.stats.areaMul * (lv.areaMul || 1),
                    pierce: 99,
                    life: 1.5,
                    homing: false,
                    color: def.color,
                    hitSet: new Set(),
                    fire: true,
                    leaveFire: true,
                    fireDur: lv.dur,
                });
            }
        }
    };

    Weapons.updateCoinRain = function(w, def, lv, dt, enemies, state) {
        const p = player;
        p.coinRainT = (p.coinRainT || 0) + dt;
        if (p.coinRainT >= lv.cd) {
            p.coinRainT = 0;
            for (let i = 0; i < lv.count; i++) {
                const sx = p.x + U.rand(-400, 400);
                const sy = p.y - 300;
                G.Entities.projectiles.push({
                    x: sx, y: sy,
                    vx: U.rand(-30, 30), vy: 500,
                    dmg: lv.dmg, dmgMul: (lv.dmgMul || 1),
                    radius: (lv.area || 14) * p.stats.areaMul * (lv.areaMul || 1),
                    pierce: lv.pierce,
                    life: 3,
                    homing: false,
                    color: def.color,
                    hitSet: new Set(),
                    gold: true,
                });
            }
        }
    };

    Weapons.fireBoomerang = function(def, lv, enemies, state) {
        const p = player;
        const stats = p.stats;
        for (let i = 0; i < lv.count; i++) {
            const tgt = Enemies.findNearest(p.x, p.y, 600);
            let ang = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : p.facing;
            ang += (i - (lv.count - 1) / 2) * 0.3;
            G.Entities.projectiles.push({
                x: p.x, y: p.y,
                vx: Math.cos(ang) * lv.speed,
                vy: Math.sin(ang) * lv.speed,
                dmg: lv.dmg, dmgMul: (lv.dmgMul || 1) * stats.dmgMul,
                radius: (lv.area || 14) * stats.areaMul * (lv.areaMul || 1),
                pierce: lv.pierce,
                life: 1.5,
                maxRange: lv.range,
                startX: p.x, startY: p.y,
                returning: false,
                boomerang: true,
                color: def.color,
                hitSet: new Set(),
                returnHitSet: new Set(),
                trail: [],
                rot: 0,
            });
        }
    };

    Weapons.fireShockwave = function(def, lv, enemies, state) {
        const p = player;
        const stats = p.stats;
        const area = (lv.area || 130) * stats.areaMul * (lv.areaMul || 1);
        G.Entities.shockwaves.push({
            x: p.x, y: p.y,
            radius: 10,
            maxRadius: area,
            life: area / (lv.speed || 260),
            maxLife: area / (lv.speed || 260),
            dmg: lv.dmg * (lv.dmgMul || 1),
            color: def.color,
            hitSet: new Set(),
        });
        FX.addBurst(p.x, p.y, def.color, 20, { minSpeed: 100, maxSpeed: 300 });
    };

    G.Weapons = Weapons;
})(window);

</script>

<script>
// ============================================================
//  G.Player - 玩家模块
// ============================================================
(function(G) {
    const PlayerSys = {};
    let player = null;

    PlayerSys.get = function() { return player; };
    PlayerSys.set = function(p) { player = p; };
    PlayerSys.reset = function() { player = null; };
    PlayerSys.getLevel = function() { return player ? player.level : 1; };

    PlayerSys.create = function(charId) {
        const ch = CFG.CHARACTERS.find(c => c.id === charId);
        player = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            hp: ch.hp,
            maxHp: ch.hp,
            speed: ch.speed,
            radius: 14,
            char: ch,
            facing: 0,
            dirX: 1, dirY: 0,
            moving: false,
            xp: 0,
            level: 1,
            xpNext: 5,
            weapons: [],
            passives: [],
            weaponCooldowns: {},
            stats: null,
            iframe: 0,
            fireTrailCd: 0,
            coinRainT: 0,
            lastDir: { x: 1, y: 0 },
            hurtFlash: 0,
        };
        G.Weapons.init(player);
        G.Weapons.add(ch.startWeapon);
        G.PlayerSys.recalcStats();
        return player;
    };

    PlayerSys.recalcStats = function() {
        const ch = player.char;
        const s = {
            maxHp: ch.hp,
            speed: ch.speed,
            dmgMul: 1,
            areaMul: 1,
            speedMul: 1,
            cdMul: 1,
            durMul: 1,
            def: 0,
            luck: 0,
            xpMul: 1,
            pickupMul: 1,
            bonusDmg: ch.bonusDmg || 0,
            bonusDef: ch.bonusDef || 0,
            bonusSpeed: ch.bonusSpeed || 0,
        };
        for (const p of player.passives) {
            const pd = CFG.PASSIVES[p.id];
            if (!pd) continue;
            const lv = p.level;
            if (pd.stat === 'maxHp')     s.maxHp += pd.val * lv;
            else if (pd.stat === 'def')       s.def += pd.val * lv;
            else if (pd.stat === 'pickupMul') s.pickupMul *= Math.pow(1 + pd.val, lv);
            else if (pd.stat === 'xpMul')     s.xpMul *= Math.pow(1 + pd.val, lv);
            else if (pd.stat === 'luck')      s.luck += pd.val * lv;
            else if (pd.stat === 'speedMul')  s.speedMul *= Math.pow(1 + pd.val, lv);
            else if (pd.stat === 'dmgMul')    s.dmgMul *= Math.pow(1 + pd.val, lv);
            else if (pd.stat === 'areaMul')   s.areaMul *= Math.pow(1 + pd.val, lv);
            else if (pd.stat === 'durMul')    s.durMul *= Math.pow(1 + pd.val, lv);
        }
        s.dmgMul *= (1 + s.bonusDmg);
        s.def += s.bonusDef;
        s.speedMul *= (1 + s.bonusSpeed);
        player.maxHp = s.maxHp;
        player.hp = Math.min(player.hp, player.maxHp);
        player.speed = s.speed * s.speedMul;
        player.stats = s;
    };

    PlayerSys.gainXp = function(amt) {
        const mult = player.stats.xpMul;
        player.xp += amt * mult;
        let leveled = false;
        while (player.xp >= player.xpNext) {
            player.xp -= player.xpNext;
            player.level++;
            player.xpNext = Math.floor(5 + player.level * 4 + player.level * player.level * 0.5);
            leveled = true;
        }
        return leveled;
    };

    PlayerSys.damagePlayer = function(amt, state) {
        if (state.invuln > 0 || player.iframe > 0) return;
        const def = player.stats.def;
        const reduction = def / (def + 14);
        const finalDmg = Math.max(1, Math.round(amt * (1 - reduction)));
        player.hp -= finalDmg;
        player.iframe = 0.5;
        player.hurtFlash = 0.3;
        // 受伤震动增强（根据伤害量）
        const shakeAmt = Math.min(12, 4 + finalDmg * 0.3);
        FX.screenShake(state, shakeAmt);
        if (finalDmg > 20) FX.screenShakeStrong(state, 0.3);
        // 受伤红色闪屏
        FX.screenFlash(state, finalDmg > 20 ? '#cc2020' : '#802020', finalDmg > 20 ? 0.25 : 0.15);
        // 命中停顿
        FX.hitStop(state, 0.08);
        // 受伤飘字和血色粒子
        FX.addFloatText(player.x, player.y - 30, '-' + finalDmg, '#ff4040', 18);
        for (let i = 0; i < 8; i++) {
            const a = Math.random() * U.TAU;
            FX.addParticle(player.x, player.y, '#ff3030', {
                vx: Math.cos(a)*U.rand(80,200), vy: Math.sin(a)*U.rand(80,200) - 50,
                life: U.rand(0.3,0.6), size: U.rand(2,5), gravity: 200, glow: true, drag: 0.8
            });
        }
        // 低血量红色边缘提示
        if (player.hp / player.maxHp < 0.3) {
            FX.screenTint(state, '#800000', 0.5, 0.2);
        }
        if (player.hp <= 0) {
            player.hp = 0;
            return true; // dead
        }
        return false;
    };

    PlayerSys.update = function(dt, state, enemies) {
        player.iframe = Math.max(0, player.iframe - dt);
        player.hurtFlash = Math.max(0, player.hurtFlash - dt);
        state.invuln = Math.max(0, state.invuln - dt);
        state.dashCd = Math.max(0, state.dashCd - dt);
        state.dashActive = Math.max(0, state.dashActive - dt);
        state.ultimateActive = Math.max(0, state.ultimateActive - dt);

        const ax = Input.axis();
        player.moving = ax.mag > 0;

        if (state.dashActive > 0) {
            const dashSpeed = 600;
            player.vx = state.dashDir.x * dashSpeed;
            player.vy = state.dashDir.y * dashSpeed;
            player.moving = true;
            if (Math.random() < 0.5) {
                FX.addParticle(player.x, player.y, player.char.color, {
                    vx: U.rand(-20, 20), vy: U.rand(-20, 20), life: 0.3, size: U.rand(3, 6)
                });
            }
        } else {
            player.vx = ax.x * player.speed;
            player.vy = ax.y * player.speed;
        }

        if (Input.consumeDash() && state.dashCd <= 0 && ax.mag > 0) {
            state.dashActive = 0.2;
            state.dashCd = 1.2;
            state.invuln = Math.max(state.invuln, 0.25);
            state.dashDir = { x: ax.x, y: ax.y };
            FX.addBurst(player.x, player.y, '#ffffff', 15, { minSpeed: 80, maxSpeed: 200 });
            FX.screenShake(state, 3);
            // 冲刺残影粒子
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    if (player) {
                        FX.addParticle(player.x, player.y, player.char.color, {
                            vx: U.rand(-30,30), vy: U.rand(-30,30),
                            life: 0.3, size: U.rand(3,6), glow: true, drag: 2
                        });
                    }
                }, i * 20);
            }
        }

        if (Input.consumeUlt() && state.dragonMeter >= state.dragonMax && state.ultimateActive <= 0) {
            state.ultimateActive = 3.0;
            state.invuln = 3.0;
            state.dragonMeter = 0;
            // 龙脉觉醒 - 最强特效
            FX.screenFlash(state, '#ffc040', 0.8);
            FX.screenShakeStrong(state, 25);
            FX.slowMotion(state, 0.2, 0.8);
            FX.screenTint(state, '#c9a84c', 1.5, 0.3);
            // 金色光柱和多重冲击环
            FX.addLightBeam(player.x, player.y, '#ffd040', 700, 2.0);
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    FX.addRing(player.x, player.y, '#ffd040', 200 + i*100, 0.6, 5);
                    FX.addGoldBurst(player.x, player.y, 20);
                }, i * 100);
            }
            FX.addFloatText(player.x, player.y - 60, '★ 龙脉觉醒 ★', '#ffd040', 30);
            for (const e of enemies) {
                if (e.dead) continue;
                G.Enemies.damageEnemy(e, 150, 1, player.x, player.y, state);
            }
            G.Entities.clearEnemyProjectiles();
        }

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        if (ax.mag > 0) {
            player.lastDir = { x: ax.x, y: ax.y };
            player.facing = Math.atan2(ax.y, ax.x);
        } else {
            const tgt = G.Enemies.findNearest(player.x, player.y, 400);
            if (tgt) player.facing = Math.atan2(tgt.y - player.y, tgt.x - player.x);
        }

        state.dragonMeter = Math.min(state.dragonMax, state.dragonMeter + dt * 2);

        state.camera.x = U.lerp(state.camera.x, player.x, Math.min(1, dt * 6));
        state.camera.y = U.lerp(state.camera.y, player.y, Math.min(1, dt * 6));
    };

    G.PlayerSys = PlayerSys;
})(window);

</script>

<script>
// ============================================================
//  G.Quests - 任务系统模块
// ============================================================
(function(G) {
    const Quests = {};

    // 任务类型定义
    const QUEST_TYPES = [
        {
            type: 'kill_total',
            name: '斩妖除魔',
            gen: (t) => {
                const target = 10 + Math.floor(t / 60) * 5 + Math.floor(Math.random() * 8);
                return { target, desc: '击杀 ' + target + ' 个妖怪' };
            },
            reward: (target) => Math.floor(target * 8 + 20),
        },
        {
            type: 'kill_normal',
            name: '清扫小鬼',
            gen: (t) => {
                const target = 15 + Math.floor(t / 60) * 5 + Math.floor(Math.random() * 10);
                return { target, desc: '击杀 ' + target + ' 个普通妖怪' };
            },
            reward: (target) => Math.floor(target * 6 + 15),
            checkEnemy: (e) => !e.boss && !e.elite,
        },
        {
            type: 'kill_elite',
            name: '诛杀精英',
            gen: (t) => {
                const target = 2 + Math.floor(t / 180) + Math.floor(Math.random() * 2);
                return { target, desc: '击杀 ' + target + ' 个精英妖怪' };
            },
            reward: (target) => Math.floor(target * 40 + 30),
            checkEnemy: (e) => e.elite && !e.boss,
        },
        {
            type: 'collect_gold',
            name: '收集财宝',
            gen: (t) => {
                const target = 20 + Math.floor(t / 60) * 10 + Math.floor(Math.random() * 15);
                return { target, desc: '收集 ' + target + ' 枚金币' };
            },
            reward: (target) => Math.floor(target * 3 + 25),
        },
        {
            type: 'reach_level',
            name: '修炼提升',
            gen: (t, state) => {
                const curLv = G.PlayerSys.getLevel();
                const target = curLv + 2 + Math.floor(Math.random() * 2);
                return { target, desc: '达到等级 ' + target };
            },
            reward: (target) => Math.floor(target * 25 + 30),
        },
        {
            type: 'survive_time',
            name: '坚持战斗',
            gen: (t) => {
                const addSec = 60 + Math.floor(Math.random() * 60);
                const target = Math.floor(t + addSec);
                const mins = Math.floor(addSec / 60);
                const secs = addSec % 60;
                return { target, desc: '存活 ' + mins + '分' + (secs > 0 ? secs + '秒' : '') };
            },
            reward: (target) => 50,
        },
    ];

    // 怪物类型中文名映射
    const ENEMY_NAMES = {
        skeleton: '骷髅',
        zombie: '僵尸',
        ghost: '鬼魂',
        wraith: '厉鬼',
        jiangshi: '粽子',
        boss1: '白骨将军',
        boss2: '血尸王',
        boss3: '幽冥鬼王',
        final_boss: '龙脉之主',
    };

    Quests.init = function(state) {
        state.quests = [];
        state.killStats = {}; // 按类型统计击杀
        state.totalKills = 0;
        state.goldCollected = 0;
        Quests.generateNewQuests(state, 3);
    };

    // 生成新任务
    Quests.generateNewQuests = function(state, count) {
        const t = state.time;
        for (let i = 0; i < count; i++) {
            // 根据游戏进度选择可用任务类型
            let available = QUEST_TYPES.slice();
            // 前期不生成精英任务
            if (t < 120) {
                available = available.filter(q => q.type !== 'kill_elite');
            }
            // 随机选一个
            const qDef = available[Math.floor(Math.random() * available.length)];
            const qData = qDef.gen(t, state);
            const quest = {
                id: 'q_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2,5),
                type: qDef.type,
                name: qDef.name,
                desc: qData.desc,
                target: qData.target,
                progress: 0,
                reward: qDef.reward(qData.target),
                completed: false,
                checkEnemy: qDef.checkEnemy,
            };
            state.quests.push(quest);
        }
        // 保持最多5个任务
        while (state.quests.length > 5) {
            state.quests.shift();
        }
    };

    // 击杀回调
    Quests.onKill = function(enemy, state) {
        state.totalKills++;
        // 统计击杀类型
        const eType = enemy.typeId || (enemy.boss ? 'boss' : 'normal');
        state.killStats[eType] = (state.killStats[eType] || 0) + 1;

        for (const q of state.quests) {
            if (q.completed) continue;
            switch (q.type) {
                case 'kill_total':
                    q.progress++;
                    break;
                case 'kill_normal':
                    if (q.checkEnemy && q.checkEnemy(enemy)) q.progress++;
                    break;
                case 'kill_elite':
                    if (q.checkEnemy && q.checkEnemy(enemy)) q.progress++;
                    break;
            }
            Quests.checkComplete(q, state);
        }
    };

    // 金币收集回调
    Quests.onGold = function(amount, state) {
        state.goldCollected += amount;
        for (const q of state.quests) {
            if (q.completed) continue;
            if (q.type === 'collect_gold') {
                q.progress += amount;
            }
            Quests.checkComplete(q, state);
        }
    };

    // 升级回调
    Quests.onLevelUp = function(newLevel, state) {
        for (const q of state.quests) {
            if (q.completed) continue;
            if (q.type === 'reach_level') {
                q.progress = newLevel;
            }
            Quests.checkComplete(q, state);
        }
    };

    // 更新时间类任务
    Quests.update = function(dt, state) {
        for (const q of state.quests) {
            if (q.completed) continue;
            if (q.type === 'survive_time') {
                q.progress = Math.floor(state.time);
            }
            Quests.checkComplete(q, state);
        }
    };

    // 检查任务完成
    Quests.checkComplete = function(quest, state) {
        if (quest.completed) return;
        if (quest.progress >= quest.target) {
            quest.completed = true;
            quest.completeTime = state.time;
            // 给予经验奖励
            const p = G.PlayerSys.get();
            const leveled = G.PlayerSys.gainXp(quest.reward);
            // 任务完成特效
            FX.addFloatText(p.x, p.y - 60, '任务完成! +' + quest.reward + ' XP', '#60ff80', 20);
            FX.addGoldBurst(p.x, p.y, 15);
            FX.screenShake(state, 4);
            if (leveled) {
                state.levelUp = true;
                state.levelChoices = G.UI.getUpgradeChoices();
                FX.levelUpEffect(p.x, p.y, state);
                G.UI.showLevelUp(state);
            }
            // 延迟生成新任务
            setTimeout(() => {
                if (!state.gameOver && !state.victory) {
                    Quests.generateNewQuests(state, 1);
                }
            }, 1500);
        }
    };

    // 获取击杀统计摘要
    Quests.getKillSummary = function(state) {
        const stats = state.killStats || {};
        const total = state.totalKills || 0;
        const bossKills = Object.entries(stats)
            .filter(([k,v]) => k.startsWith('boss'))
            .reduce((s,[k,v]) => s+v, 0);
        const eliteKills = stats.elite || 0;
        return { total, bossKills, eliteKills, byType: stats };
    };

    G.Quests = Quests;
})(window);

</script>
