<script>
// ============================================================
//  G.Render - 渲染模块
// ============================================================
(function(G) {
    const Render = {};
    let ctx = null;
    let torchSeed = 0;
    // 大气尘埃粒子系统
    const dustParticles = [];
    const DUST_COUNT = 40;
    // 雾气层
    const fogLayers = [];
    const FOG_LAYERS = 3;
    // 石砖纹理（离屏canvas生成的无缝贴图）
    let floorPattern = null;
    const TILE_SIZE = 64; // 石砖纹理大小

    // 生成无缝石砖纹理
    function generateFloorTexture() {
        const tCtx = document.createElement('canvas');
        const TS = TILE_SIZE * 2; // 2x2石砖组
        tCtx.width = TS;
        tCtx.height = TS;
        const t = tCtx.getContext('2d');

        // 石砖底色（古墓青石 - 稍微亮一点以增加可见度）
        const baseGrad = t.createLinearGradient(0, 0, TS, TS);
        baseGrad.addColorStop(0, '#3a2d1e');
        baseGrad.addColorStop(0.5, '#35281a');
        baseGrad.addColorStop(1, '#3d3020');
        t.fillStyle = baseGrad;
        t.fillRect(0, 0, TS, TS);

        // 添加噪点纹理（石材质感 - 增强噪点）
        const imgData = t.getImageData(0, 0, TS, TS);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const noise = (Math.random() - 0.5) * 35;
            data[i] = Math.max(0, Math.min(255, data[i] + noise));     // R
            data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise * 0.8)); // G
            data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise * 0.6)); // B
            // 随机暗色斑点（石材质感）
            if (Math.random() < 0.02) {
                const dark = U.rand(20, 40);
                data[i] = Math.max(0, data[i] - dark);
                data[i+1] = Math.max(0, data[i+1] - dark);
                data[i+2] = Math.max(0, data[i+2] - dark);
            }
        }
        t.putImageData(imgData, 0, 0);

        // 绘制石砖接缝（深色缝隙 - 增强对比度）
        t.fillStyle = '#0c0805';
        t.fillRect(TS/2 - 2, 0, 4, TS); // 竖缝
        t.fillRect(0, TS/2 - 2, TS, 4); // 横缝

        // 接缝阴影（内侧高光 - 增强立体感）
        t.fillStyle = 'rgba(90,70,40,0.4)';
        t.fillRect(TS/2 + 2, 0, 2, TS); // 右侧高光
        t.fillRect(0, TS/2 + 2, TS, 2); // 下方高光

        // 每块石砖的边缘磨损和裂纹
        const bricks = [
            {x:0,y:0,w:TS/2,h:TS/2},
            {x:TS/2,y:0,w:TS/2,h:TS/2},
            {x:0,y:TS/2,w:TS/2,h:TS/2},
            {x:TS/2,y:TS/2,w:TS/2,h:TS/2},
        ];
        for (const b of bricks) {
            // 砖面渐变（边缘暗化 - 增强立体感）
            const bg = t.createRadialGradient(
                b.x + b.w*0.4, b.y + b.h*0.4, 5,
                b.x + b.w/2, b.y + b.h/2, b.w*0.75
            );
            bg.addColorStop(0, 'rgba(100,80,50,0.12)');
            bg.addColorStop(0.6, 'rgba(40,30,15,0.08)');
            bg.addColorStop(1, 'rgba(0,0,0,0.35)');
            t.fillStyle = bg;
            t.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);

            // 砖边暗化
            const edgeG = t.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
            edgeG.addColorStop(0, 'rgba(0,0,0,0.2)');
            edgeG.addColorStop(0.05, 'rgba(0,0,0,0)');
            edgeG.addColorStop(0.95, 'rgba(0,0,0,0)');
            edgeG.addColorStop(1, 'rgba(0,0,0,0.2)');
            t.fillStyle = edgeG;
            t.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);

            // 随机裂纹
            t.strokeStyle = 'rgba(15,10,5,0.5)';
            t.lineWidth = 1.5;
            const crackCount = 2 + Math.floor(Math.random()*3);
            for (let c = 0; c < crackCount; c++) {
                t.beginPath();
                const sx = b.x + 6 + Math.random()*(b.w-12);
                const sy = b.y + 6 + Math.random()*(b.h-12);
                t.moveTo(sx, sy);
                let cx = sx, cy = sy;
                const segments = 2 + Math.floor(Math.random()*3);
                for (let s = 0; s < segments; s++) {
                    cx += (Math.random()-0.5)*16;
                    cy += (Math.random()-0.5)*16;
                    cx = Math.max(b.x+4, Math.min(b.x+b.w-4, cx));
                    cy = Math.max(b.y+4, Math.min(b.y+b.h-4, cy));
                    t.lineTo(cx, cy);
                }
                t.stroke();
            }

            // 青苔痕迹（暗绿色斑块 - 增强可见度）
            const mossCount = 1 + Math.floor(Math.random()*2);
            for (let m = 0; m < mossCount; m++) {
                const mx = b.x + 5 + Math.random()*(b.w-10);
                const my = b.y + 5 + Math.random()*(b.h-10);
                const mossR = 6 + Math.random()*10;
                const mossG = t.createRadialGradient(mx, my, 0, mx, my, mossR);
                mossG.addColorStop(0, 'rgba(50,90,40,0.35)');
                mossG.addColorStop(0.5, 'rgba(30,60,25,0.2)');
                mossG.addColorStop(1, 'rgba(15,30,10,0)');
                t.fillStyle = mossG;
                t.beginPath();
                t.arc(mx, my, mossR, 0, U.TAU);
                t.fill();
            }

            // 磨损高光（石头被踩踏的光亮处）
            if (Math.random() < 0.5) {
                const wx = b.x + 10 + Math.random()*(b.w-20);
                const wy = b.y + 10 + Math.random()*(b.h-20);
                const wG = t.createRadialGradient(wx, wy, 0, wx, wy, 8+Math.random()*6);
                wG.addColorStop(0, 'rgba(120,100,70,0.15)');
                wG.addColorStop(1, 'rgba(80,60,40,0)');
                t.fillStyle = wG;
                t.beginPath();
                t.arc(wx, wy, 10+Math.random()*8, 0, U.TAU);
                t.fill();
            }
        }

        // 整体风化效果（边缘暗角 - 减弱）
        const edgeG = t.createRadialGradient(TS/2, TS/2, TS*0.3, TS/2, TS/2, TS*0.75);
        edgeG.addColorStop(0, 'rgba(0,0,0,0)');
        edgeG.addColorStop(1, 'rgba(0,0,0,0.12)');
        t.fillStyle = edgeG;
        t.fillRect(0, 0, TS, TS);

        // 创建pattern
        floorPattern = ctx.createPattern(tCtx, 'repeat');
    }

    Render.init = function(context) {
        ctx = context;
        // 生成石砖地板纹理
        generateFloorTexture();
        // 初始化世界空间尘埃粒子（随地面移动的微尘）
        for (let i = 0; i < DUST_COUNT; i++) {
            dustParticles.push({
                x: U.rand(-CFG.MAP_W/2, CFG.MAP_W/2),
                y: U.rand(-CFG.MAP_H/2, CFG.MAP_H/2),
                size: U.rand(0.3, 1.0),  // 缩小尺寸，避免与怪物混淆
                vx: U.rand(-5, 5),
                vy: U.rand(-8, -2),     // 缓慢向上漂浮
                alpha: U.rand(0.04, 0.12),  // 降低透明度
                flicker: Math.random() * U.TAU,
                flickerSpeed: U.rand(0.3, 1.2),
                life: U.rand(5, 15),
            });
        }
        // 初始化雾气层
        for (let i = 0; i < FOG_LAYERS; i++) {
            fogLayers.push({
                offset: Math.random() * 1000,
                speed: 0.05 + i * 0.03,
                alpha: 0.03 + i * 0.02,
                scale: 0.5 + i * 0.3,
            });
        }
    };

    Render.draw = function(state) {
        const W = CFG.W, H = CFG.H;
        const p = G.PlayerSys.get();
        if (!p) return;
        const cam = state.camera;
        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;

        // 移动端拉远相机（0.78x缩放 ≈ 视野增大28%）
        const zoom = Input.isMobile ? 0.78 : 1.0;
        Render._zoom = zoom;

        ctx.save();
        if (zoom !== 1.0) {
            ctx.translate(W / 2, H / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-W / 2, -H / 2);
        }
        ctx.translate(shakeX, shakeY);

        // Background
        Render.drawBackground(cam, W, H);

        // 符文地板（古墓地砖符文）
        FX.drawRunes(ctx, cam, W, H, state);

        // 雾气层（在实体之下）
        Render.drawFog(cam, W, H, state);

        // 世界空间尘埃粒子（微尘随地面移动）
        Render.drawDust(cam, W, H, state);

        // World entities
        Render.drawFires(cam, W, H);
        Render.drawPickups(cam, W, H);
        Render.drawShockwaves(cam, W, H);
        Render.drawOrbits(cam, W, H);
        Render.drawEnemies(cam, W, H);
        Render.drawSlashes(cam, W, H);
        Render.drawProjectiles(cam, W, H);
        Render.drawPlayer(cam, W, H, state);
        Render.drawParticles(cam, W, H);
        Render.drawFloatTexts(cam, W, H);

        ctx.restore();

        // 鬼火（屏幕空间-围绕玩家漂浮的磷火）
        FX.drawGhosts(ctx, cam, W, H);

        // 屏幕染色（死亡红色等）
        FX.drawScreenTint(ctx, W, H, state);

        // 龙脉觉醒全屏特效
        if (state.ultimateActive > 0) {
            Render.drawUltimateEffect(W, H, state);
        }

        // Vignette (screen space)
        Render.drawVignette(W, H, state);

        // Flash overlay
        if (state.flash > 0) {
            ctx.globalAlpha = Math.min(0.6, state.flash);
            ctx.fillStyle = state.flashColor || '#fff';
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
        }

        // Minimap
        Render.drawMinimap(state, W, H);

        // Mobile touch controls (screen space)
        Render.drawMobileControls(W, H, state);
    };

    Render.drawBackground = function(cam, W, H) {
        const zoom = Render._zoom || 1.0;
        const padX = zoom < 1 ? (W / zoom - W) / 2 + 20 : 0;
        const padY = zoom < 1 ? (H / zoom - H) / 2 + 20 : 0;
        const eW = W + padX * 2;
        const eH = H + padY * 2;
        const ox = -padX, oy = -padY;

        // 深底色渐变（古墓深处的黑暗感 - 稍微调亮以显示石砖）
        const bgGrad = ctx.createRadialGradient(W/2, H/2, H*0.1, W/2, H/2, H*0.9);
        bgGrad.addColorStop(0, '#281e12');
        bgGrad.addColorStop(0.5, '#1c140a');
        bgGrad.addColorStop(1, '#0e0905');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(ox, oy, eW, eH);

        // 石砖地板纹理（无缝贴图）
        if (floorPattern) {
            ctx.save();
            // 计算纹理偏移以跟随相机
            const patternX = -((cam.x + padX) % (TILE_SIZE*2)) + ox;
            const patternY = -((cam.y + padY) % (TILE_SIZE*2)) + oy;
            ctx.translate(patternX, patternY);
            ctx.fillStyle = floorPattern;
            // 填充覆盖整个扩展区域（多填充一圈避免边缘）
            ctx.fillRect(-TILE_SIZE*2, -TILE_SIZE*2, eW + TILE_SIZE*6, eH + TILE_SIZE*6);
            ctx.restore();
        }

        // 石砖上的微妙阴影网格（增强立体感）
        const tileSize = TILE_SIZE;
        const offX = -(((cam.x + padX) % tileSize) + tileSize) % tileSize + ox;
        const offY = -(((cam.y + padY) % tileSize) + tileSize) % tileSize + oy;
        ctx.strokeStyle = 'rgba(10,8,4,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = offX; x < eW; x += tileSize) {
            ctx.moveTo(x, oy); ctx.lineTo(x, eH);
        }
        for (let y = offY; y < eH; y += tileSize) {
            ctx.moveTo(ox, y); ctx.lineTo(eW, y);
        }
        ctx.stroke();

        // Torches (decorative)
        torchSeed += 0.016;
        const torchSpacing = 300;
        const viewLeft = cam.x - W / 2 - padX;
        const viewRight = cam.x + W / 2 + padX;
        const viewTop = cam.y - H / 2 - padY;
        const viewBot = cam.y + H / 2 + padY;
        const startX = Math.floor(viewLeft / torchSpacing) * torchSpacing;
        const startY = Math.floor(viewTop / torchSpacing) * torchSpacing;
        for (let tx = startX; tx < viewRight + torchSpacing; tx += torchSpacing) {
            for (let ty = startY; ty < viewBot + torchSpacing; ty += torchSpacing) {
                if ((Math.floor(tx / torchSpacing) + Math.floor(ty / torchSpacing)) % 2 !== 0) continue;
                const sx = tx - cam.x + W / 2;
                const sy = ty - cam.y + H / 2;
                // Torch pole (bronze holder)
                ctx.fillStyle = '#2a1a0a';
                ctx.fillRect(sx - 3, sy - 8, 6, 24);
                // Holder bracket
                ctx.fillStyle = '#4a3018';
                ctx.fillRect(sx - 6, sy - 10, 12, 4);
                ctx.fillStyle = '#6a4820';
                ctx.fillRect(sx - 5, sy - 10, 10, 2);
                // Flame with enhanced glow
                const flicker = Math.sin(torchSeed * 8 + tx + ty) * 3 + Math.sin(torchSeed * 13 + tx) * 1.5;
                const fg = ctx.createRadialGradient(sx, sy - 14, 2, sx, sy - 14, 20 + flicker);
                fg.addColorStop(0, '#ffffc0');
                fg.addColorStop(0.2, '#ffe080');
                fg.addColorStop(0.5, '#ff8030');
                fg.addColorStop(0.8, '#ff4010');
                fg.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.fillStyle = fg;
                ctx.beginPath();
                ctx.arc(sx, sy - 14, 20 + flicker, 0, U.TAU);
                ctx.fill();
                // Inner flame core
                const fcore = ctx.createRadialGradient(sx, sy - 12, 0, sx, sy - 12, 6);
                fcore.addColorStop(0, '#ffffff');
                fcore.addColorStop(0.5, '#ffe080');
                fcore.addColorStop(1, 'rgba(255,200,60,0)');
                ctx.fillStyle = fcore;
                ctx.beginPath();
                ctx.arc(sx, sy - 12, 6, 0, U.TAU);
                ctx.fill();
                // Light glow on ground (enhanced - warm torch light on stone)
                const gl = ctx.createRadialGradient(sx, sy + 5, 5, sx, sy + 5, 160);
                gl.addColorStop(0, 'rgba(255,160,50,0.25)');
                gl.addColorStop(0.3, 'rgba(255,120,30,0.12)');
                gl.addColorStop(1, 'rgba(255,80,0,0)');
                ctx.fillStyle = gl;
                ctx.fillRect(sx - 160, sy - 160, 320, 320);
            }
        }
    };

    Render.drawVignette = function(W, H, state) {
        // Enhanced tomb vignette - darker corners with warm tint
        const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.9);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.6, 'rgba(0,0,0,0.3)');
        g.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // Warm edge tint from torch light
        const warm = ctx.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, H * 0.7);
        warm.addColorStop(0, 'rgba(0,0,0,0)');
        warm.addColorStop(1, 'rgba(40,20,5,0.3)');
        ctx.fillStyle = warm;
        ctx.fillRect(0, 0, W, H);

        // Low HP red edge effect
        const p = G.PlayerSys.get();
        if (p && p.hp / p.maxHp < 0.3) {
            const pulse = (Math.sin(performance.now() / 200) + 1) / 2;
            const hpIntensity = (1 - p.hp / p.maxHp) * 0.4 * (0.5 + pulse * 0.5);
            const redVg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
            redVg.addColorStop(0, 'rgba(0,0,0,0)');
            redVg.addColorStop(1, 'rgba(180,20,20,' + hpIntensity + ')');
            ctx.fillStyle = redVg;
            ctx.fillRect(0, 0, W, H);
        }
    };

    // 雾气效果
    Render.drawFog = function(cam, W, H, state) {
        const t = performance.now() / 1000;
        ctx.save();
        for (let i = 0; i < fogLayers.length; i++) {
            const layer = fogLayers[i];
            const px = (t * layer.speed * 20 + layer.offset) % (W + 200) - 100;
            const py = Math.sin(t * 0.2 + i) * 20;
            ctx.globalAlpha = layer.alpha;
            // Create wispy fog patches
            for (let j = 0; j < 5; j++) {
                const fx = ((px + j * 200 + i * 80) % (W + 300)) - 150;
                const fy = H * 0.3 + py + Math.sin(t * 0.3 + j + i) * 50 + j * 60;
                const fogGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 120 * layer.scale);
                fogGrad.addColorStop(0, 'rgba(180,160,120,0.3)');
                fogGrad.addColorStop(0.5, 'rgba(120,100,70,0.15)');
                fogGrad.addColorStop(1, 'rgba(60,40,20,0)');
                ctx.fillStyle = fogGrad;
                ctx.beginPath();
                ctx.arc(fx, fy, 120 * layer.scale, 0, U.TAU);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    };

    // 世界空间尘埃粒子（随地面移动的微尘）
    Render.drawDust = function(cam, W, H, state) {
        const dt = 1/60; // 近似帧时间
        const p = G.PlayerSys.get();
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const d of dustParticles) {
            d.life -= dt;
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            d.flicker += d.flickerSpeed * dt;

            // 超出视野或生命周期结束时，在相机附近重生
            const screenX = d.x - cam.x + W/2;
            const screenY = d.y - cam.y + H/2;
            const viewMargin = 100;
            if (d.life <= 0 || screenX < -viewMargin || screenX > W + viewMargin || screenY < -viewMargin || screenY > H + viewMargin) {
                // 在视野范围内随机位置重生（偏向相机前方）
                const ang = Math.random() * U.TAU;
                const dist = U.rand(W*0.3, W*0.7);
                d.x = cam.x + Math.cos(ang) * dist;
                d.y = cam.y + Math.sin(ang) * dist;
                d.vx = U.rand(-8, 8);
                d.vy = U.rand(-10, -3);
                d.size = U.rand(0.3, 1.0);
                d.alpha = U.rand(0.04, 0.12);
                d.life = U.rand(6, 18);
            }

            // 只绘制视野内的粒子
            if (screenX < -20 || screenX > W + 20 || screenY < -20 || screenY > H + 20) continue;

            const flick = (Math.sin(d.flicker) + 1) / 2;
            const a = d.alpha * (0.4 + flick * 0.6);
            ctx.globalAlpha = a;
            // 暖色微尘（被火把照亮）
            ctx.fillStyle = '#c8a060';
            ctx.beginPath();
            ctx.arc(screenX, screenY, d.size, 0, U.TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    };

    // 龙脉觉醒全屏特效
    Render.drawUltimateEffect = function(W, H, state) {
        const t = state.ultimateActive;
        const maxT = 8; // 8 seconds duration
        const progress = 1 - t / maxT;
        ctx.save();
        // Golden radial burst from center
        const burst = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H * 0.8);
        const intensity = Math.min(1, t < 0.5 ? t * 2 : (t < maxT - 0.5 ? 1 : (maxT - t) * 2));
        burst.addColorStop(0, 'rgba(255,220,100,' + (0.25 * intensity) + ')');
        burst.addColorStop(0.3, 'rgba(255,180,50,' + (0.15 * intensity) + ')');
        burst.addColorStop(1, 'rgba(200,120,20,0)');
        ctx.fillStyle = burst;
        ctx.fillRect(0, 0, W, H);
        // Rotating dragon energy rings
        const ringCount = 3;
        const time = performance.now() / 1000;
        for (let i = 0; i < ringCount; i++) {
            const rot = time * (0.5 + i * 0.3) * (i % 2 === 0 ? 1 : -1);
            const radius = H * (0.3 + i * 0.15) * (0.9 + Math.sin(time * 2 + i) * 0.1);
            ctx.save();
            ctx.translate(W/2, H/2);
            ctx.rotate(rot);
            ctx.globalAlpha = 0.15 * intensity;
            ctx.strokeStyle = i === 0 ? '#ffe080' : (i === 1 ? '#ffc040' : '#ff8020');
            ctx.lineWidth = 3 - i;
            // Draw segmented ring (dragon scale pattern)
            ctx.beginPath();
            const segments = 12 + i * 4;
            for (let s = 0; s <= segments; s++) {
                const a = (s / segments) * U.TAU;
                const r = radius + Math.sin(a * 6 + time * 3) * 8;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                if (s === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }
        // Screen edge gold glow
        const edgeGlow = ctx.createRadialGradient(W/2, H/2, H*0.5, W/2, H/2, H*0.75);
        edgeGlow.addColorStop(0, 'rgba(0,0,0,0)');
        edgeGlow.addColorStop(1, 'rgba(255,200,80,' + (0.2 * intensity) + ')');
        ctx.fillStyle = edgeGlow;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.restore();
    };

    Render.drawPlayer = function(cam, W, H, state) {
        const p = G.PlayerSys.get();
        const sx = p.x - cam.x + W / 2;
        const sy = p.y - cam.y + H / 2;
        ctx.save();
        ctx.translate(sx, sy);
        // Ground shadow
        const shadowG = ctx.createRadialGradient(0, p.radius * 0.6, 0, 0, p.radius * 0.6, p.radius * 1.2);
        shadowG.addColorStop(0, 'rgba(0,0,0,0.4)');
        shadowG.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shadowG;
        ctx.beginPath(); ctx.ellipse(0, p.radius * 0.6, p.radius * 1.2, p.radius * 0.4, 0, 0, U.TAU); ctx.fill();
        // Invincibility flash
        if (p.iframe > 0) {
            ctx.globalAlpha = 0.4 + Math.sin(performance.now() / 50) * 0.3;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, 0, p.radius + 8, 0, U.TAU); ctx.fill();
            ctx.globalAlpha = 1;
        }
        // Aura glow (enhanced with multiple layers)
        const isUlt = state && state.ultimateActive > 0;
        const auraBaseColor = isUlt ? '#ffd060' : p.char.color;
        const auraSize = p.radius + (isUlt ? 25 : 15);
        // Outer aura
        const auraG1 = ctx.createRadialGradient(0, 0, 0, 0, 0, auraSize + 5);
        auraG1.addColorStop(0, U.hexA(auraBaseColor, isUlt ? 0.35 : 0.2));
        auraG1.addColorStop(0.6, U.hexA(auraBaseColor, isUlt ? 0.1 : 0.05));
        auraG1.addColorStop(1, U.hexA(auraBaseColor, 0));
        ctx.fillStyle = auraG1;
        ctx.beginPath(); ctx.arc(0, 0, auraSize + 5, 0, U.TAU); ctx.fill();
        // Inner aura pulse
        if (isUlt) {
            const pulse = (Math.sin(performance.now() / 150) + 1) / 2;
            const auraG2 = ctx.createRadialGradient(0, 0, 0, 0, 0, auraSize + 15);
            auraG2.addColorStop(0, 'rgba(255,220,100,' + (0.15 + pulse * 0.15) + ')');
            auraG2.addColorStop(0.4, 'rgba(255,180,50,' + (0.08 + pulse * 0.08) + ')');
            auraG2.addColorStop(1, 'rgba(255,120,20,0)');
            ctx.fillStyle = auraG2;
            ctx.beginPath(); ctx.arc(0, 0, auraSize + 15, 0, U.TAU); ctx.fill();
        }
        // Body
        ctx.rotate(p.facing);
        const bodyCol = p.hurtFlash > 0 ? '#fff' : p.char.color;
        const bodyG = ctx.createRadialGradient(-2, -2, 2, 0, 0, p.radius);
        bodyG.addColorStop(0, U.shadeColor(bodyCol, 25));
        bodyG.addColorStop(0.7, bodyCol);
        bodyG.addColorStop(1, U.shadeColor(bodyCol, -35));
        ctx.fillStyle = bodyG;
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, U.TAU); ctx.fill();
        ctx.strokeStyle = U.shadeColor(bodyCol, -50);
        ctx.lineWidth = 2;
        ctx.stroke();
        // Inner highlight
        ctx.fillStyle = U.hexA('#ffffff', 0.2);
        ctx.beginPath(); ctx.arc(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.4, 0, U.TAU); ctx.fill();
        // Headpiece
        ctx.fillStyle = U.shadeColor(bodyCol, -15);
        if (p.char.id === 'daoshi') {
            // Taoist topknot
            ctx.beginPath(); ctx.arc(0, -p.radius - 4, 5, 0, U.TAU); ctx.fill();
            ctx.fillStyle = '#ff4040';
            ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 4;
            ctx.beginPath(); ctx.arc(0, -p.radius - 4, 2.5, 0, U.TAU); ctx.fill();
            ctx.shadowBlur = 0;
            // Hair band
            ctx.fillStyle = U.shadeColor(bodyCol, -20);
            ctx.fillRect(-p.radius * 0.8, -p.radius * 0.8, p.radius * 1.6, 2);
        } else if (p.char.id === 'fashi') {
            // Monk crown
            ctx.fillStyle = '#c9a84c';
            ctx.shadowColor = '#c9a84c'; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.arc(0, -p.radius - 5, 5, 0, U.TAU); ctx.fill();
            ctx.shadowBlur = 0;
            // Mark on forehead
            ctx.fillStyle = '#ff6030';
            ctx.beginPath(); ctx.arc(0, -p.radius * 0.3, 2, 0, U.TAU); ctx.fill();
        } else if (p.char.id === 'wushi') {
            // Warrior headband
            ctx.fillStyle = '#e04040';
            ctx.shadowColor = '#e04040'; ctx.shadowBlur = 4;
            ctx.fillRect(-p.radius * 0.9, -p.radius * 0.85, p.radius * 1.8, 3);
            ctx.shadowBlur = 0;
            // Headband tails
            ctx.fillStyle = '#c03030';
            ctx.beginPath();
            ctx.moveTo(-p.radius * 0.8, -p.radius * 0.7);
            ctx.lineTo(-p.radius * 1.3, -p.radius * 0.3);
            ctx.lineTo(-p.radius * 0.9, -p.radius * 0.4);
            ctx.fill();
        }
        // Sword with enhanced glow
        ctx.save();
        const swordSwing = Math.sin(performance.now() / 200) * 0.2;
        ctx.rotate(swordSwing);
        ctx.shadowColor = isUlt ? '#ffe080' : '#ffe080';
        ctx.shadowBlur = isUlt ? 15 : 8;
        // Sword blade
        const bladeG = ctx.createLinearGradient(p.radius, 0, p.radius + 20, 0);
        bladeG.addColorStop(0, '#fff8c0');
        bladeG.addColorStop(0.5, '#e8c86c');
        bladeG.addColorStop(1, '#a08030');
        ctx.fillStyle = bladeG;
        ctx.beginPath();
        ctx.moveTo(p.radius - 2, -2);
        ctx.lineTo(p.radius + 20, -1);
        ctx.lineTo(p.radius + 22, 0);
        ctx.lineTo(p.radius + 20, 1);
        ctx.lineTo(p.radius - 2, 2);
        ctx.fill();
        // Blade edge highlight
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(p.radius, -1.5, 18, 0.8);
        // Sword guard
        ctx.fillStyle = '#8a6030';
        ctx.fillRect(p.radius - 6, -4, 5, 8);
        ctx.fillStyle = '#c9a84c';
        ctx.fillRect(p.radius - 5, -5, 3, 10);
        // Sword grip
        ctx.fillStyle = '#5a3a18';
        ctx.fillRect(p.radius - 12, -2, 6, 4);
        ctx.shadowBlur = 0;
        ctx.restore();
        ctx.restore();
    };

    Render.drawEnemies = function(cam, W, H) {
        for (const e of G.Enemies.list) {
            const sx = e.x - cam.x + W / 2;
            const sy = e.y - cam.y + H / 2;
            if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
            ctx.save();
            ctx.translate(sx, sy);
            // Draw dragon segments
            if (e.segments) {
                for (let i = e.segments.length - 1; i >= 0; i--) {
                    const seg = e.segments[i];
                    const ssx = seg.x - cam.x + W / 2 - sx;
                    const ssy = seg.y - cam.y + H / 2 - sy;
                    const sz = e.radius * (1 - i / e.segments.length * 0.5);
                    const segCol = U.shadeColor(e.color, -i * 3);
                    ctx.fillStyle = segCol;
                    ctx.beginPath(); ctx.arc(ssx, ssy, sz, 0, U.TAU); ctx.fill();
                    ctx.strokeStyle = U.shadeColor(segCol, -30);
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    if (i % 3 === 0) {
                        ctx.fillStyle = '#c9a84c';
                        ctx.beginPath(); ctx.arc(ssx - sz * 0.3, ssy, sz * 0.2, 0, U.TAU); ctx.fill();
                        ctx.beginPath(); ctx.arc(ssx + sz * 0.3, ssy, sz * 0.2, 0, U.TAU); ctx.fill();
                    }
                }
            }
            const col = e.hitFlash > 0 ? '#fff' : e.color;
            if (e.shape === 'zombie' || e.shape === 'jiangshi') {
                // Body
                ctx.fillStyle = U.shadeColor(col, -20);
                ctx.fillRect(-e.radius * 0.7, -e.radius * 0.5, e.radius * 1.4, e.radius * 1.2);
                // Head
                const hg = ctx.createRadialGradient(-2, -2, 2, 0, 0, e.radius);
                hg.addColorStop(0, U.shadeColor(col, 10));
                hg.addColorStop(1, U.shadeColor(col, -20));
                ctx.fillStyle = hg;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, U.TAU); ctx.fill();
                ctx.strokeStyle = U.shadeColor(col, -40);
                ctx.lineWidth = 2;
                ctx.stroke();
                // Hat
                ctx.fillStyle = U.shadeColor(col, -40);
                ctx.fillRect(-e.radius * 0.9, -e.radius - 6, e.radius * 1.8, 5);
                ctx.fillRect(-e.radius * 0.6, -e.radius - 12, e.radius * 1.2, 8);
                ctx.fillStyle = '#c9a84c';
                ctx.beginPath(); ctx.arc(0, -e.radius - 8, 2, 0, U.TAU); ctx.fill();
                // Rot spots
                ctx.fillStyle = U.shadeColor(col, -30);
                ctx.beginPath(); ctx.arc(-4, 3, 2, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(5, -2, 2, 0, U.TAU); ctx.fill();
                // Eyes
                ctx.fillStyle = '#ff2020';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 6;
                ctx.beginPath(); ctx.arc(-4, -2, 2, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -2, 2, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath(); ctx.arc(-4, -2, 1, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -2, 1, 0, U.TAU); ctx.fill();
                // Teeth
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(-3, 8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(3, 5); ctx.lineTo(3, 8); ctx.stroke();
            } else if (e.shape === 'bat') {
                const flap = Math.sin(e.wobble * 4) * 0.4;
                // Wings
                ctx.fillStyle = U.shadeColor(col, -15);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-e.radius * 1.8, -e.radius * (1 + flap), -e.radius * 1.5, e.radius * 0.3);
                ctx.quadraticCurveTo(-e.radius * 0.8, -e.radius * 0.2, 0, 0);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(e.radius * 1.8, -e.radius * (1 + flap), e.radius * 1.5, e.radius * 0.3);
                ctx.quadraticCurveTo(e.radius * 0.8, -e.radius * 0.2, 0, 0);
                ctx.fill();
                // Inner wing
                ctx.fillStyle = U.shadeColor(col, 10);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-e.radius * 1.2, -e.radius * (0.5 + flap), -e.radius, e.radius * 0.1);
                ctx.quadraticCurveTo(-e.radius * 0.5, -e.radius * 0.1, 0, 0);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(e.radius * 1.2, -e.radius * (0.5 + flap), e.radius, e.radius * 0.1);
                ctx.quadraticCurveTo(e.radius * 0.5, -e.radius * 0.1, 0, 0);
                ctx.fill();
                // Body
                ctx.fillStyle = U.shadeColor(col, 10);
                ctx.beginPath(); ctx.ellipse(0, 0, e.radius * 0.6, e.radius * 0.8, 0, 0, U.TAU); ctx.fill();
                // Ears
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.moveTo(-3, -e.radius * 0.7); ctx.lineTo(-5, -e.radius); ctx.lineTo(-1, -e.radius * 0.7); ctx.fill();
                ctx.beginPath(); ctx.moveTo(3, -e.radius * 0.7); ctx.lineTo(5, -e.radius); ctx.lineTo(1, -e.radius * 0.7); ctx.fill();
                // Eyes
                ctx.fillStyle = '#ff2020';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 5;
                ctx.beginPath(); ctx.arc(-2, -2, 1.5, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(2, -2, 1.5, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
            } else if (e.shape === 'skeleton') {
                // Skull
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(0, -2, e.radius * 0.8, 0, U.TAU); ctx.fill();
                ctx.strokeStyle = U.shadeColor(col, -30);
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // Jaw
                ctx.fillStyle = U.shadeColor(col, -10);
                ctx.fillRect(-e.radius * 0.4, e.radius * 0.4, e.radius * 0.8, e.radius * 0.3);
                // Eye sockets
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-4, -3, 3, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 3, 0, U.TAU); ctx.fill();
                ctx.fillStyle = '#00ff80';
                ctx.shadowColor = '#00ff80';
                ctx.shadowBlur = 6;
                ctx.beginPath(); ctx.arc(-4, -3, 1.5, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 1.5, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                // Ribs
                ctx.strokeStyle = col;
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-6, e.radius * 0.1 + i * 4);
                    ctx.lineTo(6, e.radius * 0.1 + i * 4);
                    ctx.stroke();
                }
            } else if (e.shape === 'ghost') {
                ctx.globalAlpha = 0.8;
                // Wispy body
                const g = ctx.createRadialGradient(0, 0, 0, 0, 0, e.radius);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.3, col);
                g.addColorStop(1, U.hexA(col, 0));
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(-e.radius, e.radius * 0.5);
                ctx.quadraticCurveTo(-e.radius, -e.radius, 0, -e.radius);
                ctx.quadraticCurveTo(e.radius, -e.radius, e.radius, e.radius * 0.5);
                const wav = Math.sin(e.wobble * 3) * 3;
                ctx.quadraticCurveTo(e.radius * 0.7, e.radius + wav, e.radius * 0.3, e.radius * 0.5);
                ctx.quadraticCurveTo(0, e.radius - wav, -e.radius * 0.3, e.radius * 0.5);
                ctx.quadraticCurveTo(-e.radius * 0.7, e.radius + wav, -e.radius, e.radius * 0.5);
                ctx.fill();
                ctx.globalAlpha = 1;
                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-4, -3, 3, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 3, 0, U.TAU); ctx.fill();
                ctx.fillStyle = '#ff4040';
                ctx.beginPath(); ctx.arc(-4, -3, 1.5, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 1.5, 0, U.TAU); ctx.fill();
            } else if (e.shape === 'terracotta') {
                // Armor body
                ctx.fillStyle = U.shadeColor(col, -20);
                ctx.fillRect(-e.radius * 0.8, -e.radius * 0.3, e.radius * 1.6, e.radius * 1.2);
                // Head
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(0, -e.radius * 0.5, e.radius * 0.6, 0, U.TAU); ctx.fill();
                ctx.strokeStyle = U.shadeColor(col, -30);
                ctx.lineWidth = 2;
                ctx.stroke();
                // Helmet
                ctx.fillStyle = U.shadeColor(col, -30);
                ctx.beginPath();
                ctx.arc(0, -e.radius * 0.6, e.radius * 0.65, Math.PI, 0);
                ctx.fill();
                // Armor plates
                ctx.strokeStyle = U.shadeColor(col, -40);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-e.radius * 0.8, -e.radius * 0.1);
                ctx.lineTo(e.radius * 0.8, -e.radius * 0.1);
                ctx.moveTo(-e.radius * 0.8, e.radius * 0.2);
                ctx.lineTo(e.radius * 0.8, e.radius * 0.2);
                ctx.stroke();
                // Eyes
                ctx.fillStyle = '#ff6000';
                ctx.shadowColor = '#ff6000';
                ctx.shadowBlur = 4;
                ctx.beginPath(); ctx.arc(-4, -e.radius * 0.5, 2, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -e.radius * 0.5, 2, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
            } else if (e.shape === 'elite') {
                // Elite glow
                ctx.shadowColor = col;
                ctx.shadowBlur = 15;
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Crown
                ctx.fillStyle = '#c9a84c';
                ctx.beginPath();
                ctx.moveTo(-e.radius * 0.6, -e.radius);
                ctx.lineTo(-e.radius * 0.3, -e.radius * 1.3);
                ctx.lineTo(0, -e.radius);
                ctx.lineTo(e.radius * 0.3, -e.radius * 1.3);
                ctx.lineTo(e.radius * 0.6, -e.radius);
                ctx.closePath();
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#ff0000';
                ctx.beginPath(); ctx.arc(-6, -2, 3, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(6, -2, 3, 0, U.TAU); ctx.fill();
            } else if (e.shape === 'boss') {
                // Boss body
                ctx.shadowColor = col;
                ctx.shadowBlur = 20;
                const bg = ctx.createRadialGradient(-5, -5, 5, 0, 0, e.radius);
                bg.addColorStop(0, U.shadeColor(col, 20));
                bg.addColorStop(1, U.shadeColor(col, -30));
                ctx.fillStyle = bg;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                // Horns
                ctx.fillStyle = U.shadeColor(col, -40);
                ctx.beginPath();
                ctx.moveTo(-e.radius * 0.5, -e.radius * 0.7);
                ctx.lineTo(-e.radius * 0.8, -e.radius * 1.3);
                ctx.lineTo(-e.radius * 0.3, -e.radius * 0.9);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(e.radius * 0.5, -e.radius * 0.7);
                ctx.lineTo(e.radius * 0.8, -e.radius * 1.3);
                ctx.lineTo(e.radius * 0.3, -e.radius * 0.9);
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(-e.radius * 0.25, -e.radius * 0.1, 5, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(e.radius * 0.25, -e.radius * 0.1, 5, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                // Mouth
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, e.radius * 0.2, e.radius * 0.3, 0.2, Math.PI - 0.2);
                ctx.stroke();
            } else if (e.shape === 'dragon') {
                // Dragon head (body segments drawn above)
                ctx.shadowColor = col;
                ctx.shadowBlur = 30;
                const dg = ctx.createRadialGradient(-8, -8, 8, 0, 0, e.radius);
                dg.addColorStop(0, '#ffe080');
                dg.addColorStop(0.5, col);
                dg.addColorStop(1, U.shadeColor(col, -40));
                ctx.fillStyle = dg;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff8c0';
                ctx.lineWidth = 3;
                ctx.stroke();
                // Horns
                ctx.fillStyle = '#8a6030';
                ctx.beginPath();
                ctx.moveTo(-e.radius * 0.4, -e.radius * 0.7);
                ctx.lineTo(-e.radius * 0.6, -e.radius * 1.4);
                ctx.lineTo(-e.radius * 0.2, -e.radius * 0.8);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(e.radius * 0.4, -e.radius * 0.7);
                ctx.lineTo(e.radius * 0.6, -e.radius * 1.4);
                ctx.lineTo(e.radius * 0.2, -e.radius * 0.8);
                ctx.fill();
                // Whiskers
                ctx.strokeStyle = col;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-e.radius * 0.5, e.radius * 0.3);
                ctx.quadraticCurveTo(-e.radius * 1.2, e.radius * 0.5, -e.radius * 1.5, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.radius * 0.5, e.radius * 0.3);
                ctx.quadraticCurveTo(e.radius * 1.2, e.radius * 0.5, e.radius * 1.5, 0);
                ctx.stroke();
                // Eyes
                ctx.fillStyle = '#ff2020';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(-e.radius * 0.3, -e.radius * 0.2, 7, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(e.radius * 0.3, -e.radius * 0.2, 7, 0, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-e.radius * 0.3, -e.radius * 0.2, 3, 0, U.TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(e.radius * 0.3, -e.radius * 0.2, 3, 0, U.TAU); ctx.fill();
            }
            ctx.restore();
            // HP bar
            if (e.boss || e.elite || e.hp < e.maxHp) {
                const barW = e.boss ? 80 : (e.elite ? 50 : 30);
                const barH = e.boss ? 6 : 3;
                const barY = sy - e.radius - (e.boss ? 20 : 12);
                ctx.fillStyle = '#000';
                ctx.fillRect(sx - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
                ctx.fillStyle = '#400';
                ctx.fillRect(sx - barW / 2, barY, barW, barH);
                ctx.fillStyle = e.boss ? '#ff4040' : (e.elite ? '#c040c0' : '#60c060');
                ctx.fillRect(sx - barW / 2, barY, barW * (e.hp / e.maxHp), barH);
            }
            // Burn effect
            if (e.burn > 0) {
                ctx.save();
                ctx.translate(sx, sy);
                for (let i = 0; i < 3; i++) {
                    const fa = Math.random() * U.TAU;
                    const fd = U.rand(0, e.radius);
                    ctx.fillStyle = '#ff6030';
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(Math.cos(fa) * fd, Math.sin(fa) * fd - 5, U.rand(2, 4), 0, U.TAU);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }
            // Freeze effect
            if (e.freeze > 0) {
                ctx.save();
                ctx.translate(sx, sy);
                ctx.strokeStyle = '#80c0ff';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                for (let i = 0; i < 4; i++) {
                    const a = (i / 4) * U.TAU + performance.now() / 500;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * e.radius, Math.sin(a) * e.radius);
                    ctx.lineTo(Math.cos(a) * (e.radius + 5), Math.sin(a) * (e.radius + 5));
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }
    };

    Render.drawProjectiles = function(cam, W, H) {
        // Player projectiles
        for (const pr of Entities.projectiles) {
            const sx = pr.x - cam.x + W / 2;
            const sy = pr.y - cam.y + H / 2;
            if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;
            // Trail
            if (pr.trail) {
                for (let i = 0; i < pr.trail.length; i++) {
                    const t = pr.trail[i];
                    const tsx = t.x - cam.x + W / 2;
                    const tsy = t.y - cam.y + H / 2;
                    ctx.globalAlpha = (i / pr.trail.length) * 0.5;
                    ctx.fillStyle = pr.color;
                    ctx.beginPath(); ctx.arc(tsx, tsy, pr.radius * (i / pr.trail.length), 0, U.TAU); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            ctx.shadowColor = pr.color;
            ctx.shadowBlur = 10;
            ctx.fillStyle = pr.color;
            if (pr.boomerang) {
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(pr.rot);
                ctx.fillRect(-pr.radius, -pr.radius * 0.3, pr.radius * 2, pr.radius * 0.6);
                ctx.fillRect(-pr.radius * 0.3, -pr.radius, pr.radius * 0.6, pr.radius * 2);
                ctx.beginPath();
                ctx.arc(0, 0, pr.radius * 0.4, 0, U.TAU);
                ctx.fillStyle = '#fff8c0';
                ctx.fill();
                ctx.restore();
            } else if (pr.fire) {
                const fg = ctx.createRadialGradient(sx, sy, 0, sx, sy, pr.radius * 1.5);
                fg.addColorStop(0, '#ffff80');
                fg.addColorStop(0.5, pr.color);
                fg.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.fillStyle = fg;
                ctx.beginPath(); ctx.arc(sx, sy, pr.radius * 1.5, 0, U.TAU); ctx.fill();
            } else if (pr.gold) {
                ctx.save();
                ctx.translate(sx, sy);
                ctx.fillStyle = '#ffd040';
                ctx.beginPath(); ctx.arc(0, 0, pr.radius, 0, U.TAU); ctx.fill();
                ctx.fillStyle = '#fff8c0';
                ctx.beginPath(); ctx.arc(-pr.radius * 0.3, -pr.radius * 0.3, pr.radius * 0.3, 0, U.TAU); ctx.fill();
                ctx.strokeStyle = '#8a6020';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(sx, sy, pr.radius, 0, U.TAU); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(sx - pr.radius * 0.3, sy - pr.radius * 0.3, pr.radius * 0.3, 0, U.TAU); ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        // Enemy projectiles
        for (const pr of Entities.enemyProjectiles) {
            const sx = pr.x - cam.x + W / 2;
            const sy = pr.y - cam.y + H / 2;
            if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
            ctx.shadowColor = pr.color;
            ctx.shadowBlur = 8;
            ctx.fillStyle = pr.color;
            ctx.beginPath(); ctx.arc(sx, sy, pr.radius, 0, U.TAU); ctx.fill();
            ctx.shadowBlur = 0;
        }
    };

    Render.drawOrbits = function(cam, W, H) {
        const p = G.PlayerSys.get();
        for (const w of p.weapons) {
            const def = CFG.WEAPONS[w.id];
            if ((def.type !== 'orbit' && def.type !== 'mirror_evo') || !w.orbits) continue;
            const lv = def.levels[w.level];
            for (const o of w.orbits) {
                const sx = o.x - cam.x + W / 2;
                const sy = o.y - cam.y + H / 2;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.shadowColor = def.color;
                ctx.shadowBlur = 12;
                // Mirror disc
                const mg = ctx.createRadialGradient(-3, -3, 2, 0, 0, o.radius);
                mg.addColorStop(0, '#ffffff');
                mg.addColorStop(0.5, def.color);
                mg.addColorStop(1, U.shadeColor(def.color, -40));
                ctx.fillStyle = mg;
                ctx.beginPath(); ctx.arc(0, 0, o.radius, 0, U.TAU); ctx.fill();
                ctx.strokeStyle = def.isEvolved ? '#ffc040' : '#8ab4f8';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Bagua pattern
                ctx.strokeStyle = U.shadeColor(def.color, -30);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, o.radius * 0.6, 0, U.TAU);
                ctx.stroke();
                ctx.fillStyle = U.shadeColor(def.color, -30);
                ctx.beginPath(); ctx.arc(0, -o.radius * 0.3, o.radius * 0.3, 0, Math.PI); ctx.fill();
                ctx.beginPath(); ctx.arc(0, o.radius * 0.3, o.radius * 0.3, Math.PI, U.TAU); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }
    };

    Render.drawFires = function(cam, W, H) {
        for (const f of Entities.fires) {
            const sx = f.x - cam.x + W / 2;
            const sy = f.y - cam.y + H / 2;
            if (sx < -f.radius || sx > W + f.radius || sy < -f.radius || sy > H + f.radius) continue;
            const a = Math.min(1, f.life / 0.5);
            const fg = ctx.createRadialGradient(sx, sy, 0, sx, sy, f.radius);
            fg.addColorStop(0, U.hexA('#ffff80', a * 0.6));
            fg.addColorStop(0.3, U.hexA('#ff8030', a * 0.4));
            fg.addColorStop(1, U.hexA('#ff2000', 0));
            ctx.fillStyle = fg;
            ctx.beginPath(); ctx.arc(sx, sy, f.radius, 0, U.TAU); ctx.fill();
            // Small flame particles
            for (let i = 0; i < 2; i++) {
                const fa = Math.random() * U.TAU;
                const fr = U.rand(0, f.radius * 0.7);
                ctx.fillStyle = Math.random() < 0.5 ? '#ffc040' : '#ff6030';
                ctx.globalAlpha = a * 0.7;
                ctx.beginPath();
                ctx.arc(sx + Math.cos(fa) * fr, sy + Math.sin(fa) * fr, U.rand(2, 5), 0, U.TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    };

    Render.drawSlashes = function(cam, W, H) {
        for (const s of Entities.slashes) {
            const sx = s.x - cam.x + W / 2;
            const sy = s.y - cam.y + H / 2;
            const a = s.life / s.maxLife;
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(s.angle);
            ctx.globalAlpha = a * 0.8;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 15;
            const sg = ctx.createRadialGradient(0, 0, s.radius * 0.3, 0, 0, s.radius);
            sg.addColorStop(0, '#ffffff');
            sg.addColorStop(0.5, s.color);
            sg.addColorStop(1, U.hexA(s.color, 0));
            ctx.fillStyle = sg;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, s.radius, -s.arc / 2, s.arc / 2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.restore();
        }
    };

    Render.drawShockwaves = function(cam, W, H) {
        for (const sw of Entities.shockwaves) {
            const sx = sw.x - cam.x + W / 2;
            const sy = sw.y - cam.y + H / 2;
            if (sx < -sw.radius || sx > W + sw.radius || sy < -sw.radius || sy > H + sw.radius) continue;
            const a = sw.life / sw.maxLife;
            ctx.globalAlpha = a * 0.7;
            ctx.strokeStyle = sw.color;
            ctx.lineWidth = 6 * a;
            ctx.shadowColor = sw.color;
            ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(sx, sy, sw.radius, 0, U.TAU); ctx.stroke();
            ctx.lineWidth = 2 * a;
            ctx.strokeStyle = '#fff';
            ctx.beginPath(); ctx.arc(sx, sy, sw.radius, 0, U.TAU); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    };

    Render.drawPickups = function(cam, W, H) {
        for (const pk of Entities.pickups) {
            const sx = pk.x - cam.x + W / 2;
            const sy = pk.y - cam.y + H / 2 + Math.sin(pk.bob) * 3;
            if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
            if (pk.type === 'chest') {
                ctx.save();
                ctx.translate(sx, sy);
                const bobOffset = Math.sin(pk.bob) * 3;
                ctx.translate(0, bobOffset);
                // Chest glow
                ctx.shadowColor = '#c9a84c';
                ctx.shadowBlur = 20 + Math.sin(performance.now() / 200) * 8;
                // Chest body
                ctx.fillStyle = '#5a3a18';
                ctx.fillRect(-pk.radius, -pk.radius * 0.5, pk.radius * 2, pk.radius * 1.2);
                // Chest lid
                ctx.fillStyle = '#7a4a20';
                ctx.beginPath();
                ctx.moveTo(-pk.radius - 2, -pk.radius * 0.5);
                ctx.lineTo(-pk.radius - 2, -pk.radius * 0.9);
                ctx.quadraticCurveTo(0, -pk.radius * 1.3, pk.radius + 2, -pk.radius * 0.9);
                ctx.lineTo(pk.radius + 2, -pk.radius * 0.5);
                ctx.fill();
                // Gold trim
                ctx.fillStyle = '#c9a84c';
                ctx.fillRect(-pk.radius * 1.1, -pk.radius * 0.55, pk.radius * 2.2, pk.radius * 0.15);
                ctx.fillRect(-pk.radius * 1.1, pk.radius * 0.55, pk.radius * 2.2, pk.radius * 0.15);
                // Lock
                ctx.fillStyle = '#ffd040';
                ctx.shadowColor = '#ffd040';
                ctx.shadowBlur = 10;
                ctx.fillRect(-4, -pk.radius * 0.2, 8, 8);
                ctx.fillStyle = '#8a6020';
                ctx.fillRect(-2, 0, 4, 3);
                // Corner brackets
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#a08030';
                ctx.fillRect(-pk.radius, -pk.radius * 0.5, 4, 4);
                ctx.fillRect(pk.radius - 4, -pk.radius * 0.5, 4, 4);
                ctx.fillRect(-pk.radius, pk.radius * 0.5, 4, 4);
                ctx.fillRect(pk.radius - 4, pk.radius * 0.5, 4, 4);
                // Outline
                ctx.strokeStyle = '#3a2010';
                ctx.lineWidth = 2;
                ctx.strokeRect(-pk.radius, -pk.radius * 0.5, pk.radius * 2, pk.radius * 1.2);
                ctx.shadowBlur = 0;
                ctx.restore();
            } else {
                ctx.shadowColor = pk.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = pk.color;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(0, -pk.radius);
                ctx.lineTo(pk.radius, 0);
                ctx.lineTo(0, pk.radius);
                ctx.lineTo(-pk.radius, 0);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(0, -pk.radius * 0.5);
                ctx.lineTo(pk.radius * 0.3, 0);
                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }
    };

    Render.drawParticles = function(cam, W, H) {
        FX.drawParticles(ctx, cam, W, H);
    };

    Render.drawFloatTexts = function(cam, W, H) {
        FX.drawFloatTexts(ctx, cam, W, H);
    };

    Render.drawMinimap = function(state, W, H) {
        const p = G.PlayerSys.get();
        const mapSize = 110;
        const mapX = W - mapSize - 15;
        const mapY = 100; // 移到时间面板下方
        const scale = mapSize / CFG.MAP_W;
        // Outer frame
        ctx.fillStyle = 'rgba(10,6,2,0.85)';
        ctx.fillRect(mapX - 3, mapY - 3, mapSize + 6, mapSize + 6);
        ctx.strokeStyle = '#8a6a2a';
        ctx.lineWidth = 2;
        ctx.strokeRect(mapX - 3, mapY - 3, mapSize + 6, mapSize + 6);
        // Inner glow line
        ctx.strokeStyle = 'rgba(201,168,76,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(mapX - 1, mapY - 1, mapSize + 2, mapSize + 2);
        // Map background
        const mapBg = ctx.createLinearGradient(mapX, mapY, mapX, mapY + mapSize);
        mapBg.addColorStop(0, 'rgba(30,20,10,0.95)');
        mapBg.addColorStop(1, 'rgba(20,12,5,0.95)');
        ctx.fillStyle = mapBg;
        ctx.fillRect(mapX, mapY, mapSize, mapSize);
        // Map grid lines (subtle)
        ctx.strokeStyle = 'rgba(80,60,30,0.15)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            const gx = mapX + (mapSize / 4) * i;
            const gy = mapY + (mapSize / 4) * i;
            ctx.beginPath(); ctx.moveTo(gx, mapY); ctx.lineTo(gx, mapY + mapSize); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(mapX, gy); ctx.lineTo(mapX + mapSize, gy); ctx.stroke();
        }
        // Enemies
        for (const e of G.Enemies.list) {
            if (e.dead) continue;
            const mx = mapX + (e.x + CFG.MAP_W / 2) * scale;
            const my = mapY + (e.y + CFG.MAP_H / 2) * scale;
            if (mx < mapX || mx > mapX + mapSize || my < mapY || my > mapY + mapSize) continue;
            if (e.boss || (e.shape === 'dragon')) {
                ctx.fillStyle = '#ff4040';
                ctx.shadowColor = '#ff4040';
                ctx.shadowBlur = 6;
                ctx.fillRect(mx - 4, my - 4, 8, 8);
                ctx.shadowBlur = 0;
            } else if (e.elite) {
                ctx.fillStyle = '#c040c0';
                ctx.shadowColor = '#c040c0';
                ctx.shadowBlur = 4;
                ctx.fillRect(mx - 2, my - 2, 4, 4);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = 'rgba(200,80,80,0.4)';
                ctx.fillRect(mx - 1, my - 1, 2, 2);
            }
        }
        // Player
        const px = mapX + (p.x + CFG.MAP_W / 2) * scale;
        const py = mapY + (p.y + CFG.MAP_H / 2) * scale;
        // Player direction indicator
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p.facing);
        ctx.fillStyle = 'rgba(96,255,96,0.4)';
        ctx.beginPath();
        ctx.moveTo(6, 0);
        ctx.lineTo(-3, -3);
        ctx.lineTo(-3, 3);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        // Player dot
        ctx.fillStyle = '#60ff60';
        ctx.shadowColor = '#60ff60';
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(px, py, 3.5, 0, U.TAU); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 1.5, 0, U.TAU); ctx.fill();
        ctx.shadowBlur = 0;
        // Map label
        ctx.fillStyle = 'rgba(201,168,76,0.6)';
        ctx.font = '9px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.fillText('地图', mapX + mapSize/2, mapY + mapSize + 10);
    };

    // ---- 移动端虚拟摇杆和按钮 ----
    // 布局常量（屏幕坐标，基于960x720逻辑分辨率）
    const MOBILE_UI = {
        // 摇杆：屏幕中下部偏左
        joyX: 170, joyY: 560, joyBaseR: 80, joyStickR: 36, joyMaxDist: 55,
        // 冲刺按钮：右下方
        dashX: 820, dashY: 590, dashR: 55,
        // 龙脉觉醒：冲刺按钮左上方
        ultX: 700, ultY: 470, ultR: 60,
    };

    Render.drawMobileControls = function(W, H, state) {
        if (!Input.isMobile) return;
        const p = G.PlayerSys.get();
        if (!p) return;
        const ui = MOBILE_UI;

        // 半透明背景遮罩在控制区域，让玩家知道哪里可以操作
        ctx.save();

        // ===== 虚拟摇杆区域（左下中） =====
        const jv = Input.getJoystickVisual();
        const joyDrawX = jv ? jv.baseX : ui.joyX;
        const joyDrawY = jv ? jv.baseY : ui.joyY;
        // 摇杆底座（固定提示圈）
        ctx.globalAlpha = jv ? 0.5 : 0.25;
        ctx.fillStyle = 'rgba(201,168,76,0.15)';
        ctx.strokeStyle = jv ? 'rgba(201,168,76,0.7)' : 'rgba(201,168,76,0.4)';
        ctx.lineWidth = jv ? 4 : 2;
        if (!jv) ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(joyDrawX, joyDrawY, ui.joyBaseR, 0, U.TAU); ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
        // 方向十字指示（静止时）
        if (!jv) {
            ctx.globalAlpha = 0.2;
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(joyDrawX - 25, joyDrawY); ctx.lineTo(joyDrawX + 25, joyDrawY);
            ctx.moveTo(joyDrawX, joyDrawY - 25); ctx.lineTo(joyDrawX, joyDrawY + 25);
            ctx.stroke();
        }
        // 摇杆头
        if (jv) {
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = 'rgba(201,168,76,0.5)';
            ctx.strokeStyle = 'rgba(255,224,128,0.9)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(jv.stickX, jv.stickY, ui.joyStickR, 0, U.TAU); ctx.fill(); ctx.stroke();
            // 摇杆头中心点
            ctx.fillStyle = 'rgba(255,224,128,0.6)';
            ctx.beginPath(); ctx.arc(jv.stickX, jv.stickY, 8, 0, U.TAU); ctx.fill();
        } else {
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = 'rgba(201,168,76,0.3)';
            ctx.beginPath(); ctx.arc(ui.joyX, ui.joyY, ui.joyStickR, 0, U.TAU); ctx.fill();
        }

        // ===== 冲刺按钮（右下，大） =====
        const dashReady = state.dashCd <= 0;
        ctx.globalAlpha = dashReady ? 0.8 : 0.35;
        // 外圈光晕（可用时）
        if (dashReady) {
            ctx.shadowColor = '#60ff60';
            ctx.shadowBlur = 15;
        }
        ctx.fillStyle = dashReady ? 'rgba(80,180,80,0.45)' : 'rgba(80,80,80,0.3)';
        ctx.strokeStyle = dashReady ? '#60d060' : '#555';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ui.dashX, ui.dashY, ui.dashR, 0, U.TAU); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        // 冲刺图标
        ctx.fillStyle = dashReady ? '#ffffff' : '#888';
        ctx.font = 'bold 20px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('冲刺', ui.dashX, ui.dashY - 2);
        // CD显示
        if (!dashReady) {
            ctx.globalAlpha = 0.9;
            ctx.font = 'bold 16px "Microsoft YaHei"';
            ctx.fillStyle = '#ffc040';
            ctx.fillText(state.dashCd.toFixed(1), ui.dashX, ui.dashY + 20);
            // CD遮罩
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(ui.dashX, ui.dashY);
            ctx.arc(ui.dashX, ui.dashY, ui.dashR, -Math.PI / 2, -Math.PI / 2 + U.TAU * (state.dashCd / 1.2));
            ctx.closePath();
            ctx.fill();
        }

        // ===== 龙脉觉醒按钮（冲刺左上，大） =====
        const ultReady = state.dragonMeter >= state.dragonMax;
        const ultActive = state.ultimateActive > 0;
        ctx.globalAlpha = ultReady || ultActive ? 0.85 : 0.45;
        if (ultActive) {
            ctx.shadowColor = '#ffc040';
            ctx.shadowBlur = 30;
        } else if (ultReady) {
            ctx.shadowColor = '#ffd060';
            ctx.shadowBlur = 18;
        }
        ctx.fillStyle = ultActive ? 'rgba(255,180,40,0.6)' : (ultReady ? 'rgba(201,168,76,0.5)' : 'rgba(60,45,20,0.4)');
        ctx.strokeStyle = ultActive ? '#ffe080' : (ultReady ? '#d4b050' : '#4a3a20');
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ui.ultX, ui.ultY, ui.ultR, 0, U.TAU); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        // 文字
        ctx.fillStyle = ultReady || ultActive ? '#fff4c0' : '#706040';
        ctx.font = 'bold 18px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('龙脉', ui.ultX, ui.ultY - 10);
        ctx.fillText('觉醒', ui.ultX, ui.ultY + 12);
        // 充能进度环
        if (!ultReady && !ultActive) {
            const pct = state.dragonMeter / state.dragonMax;
            ctx.globalAlpha = 0.8;
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(ui.ultX, ui.ultY, ui.ultR + 6, -Math.PI / 2, -Math.PI / 2 + U.TAU * pct);
            ctx.stroke();
            ctx.lineCap = 'butt';
        }
        // 满能量脉冲环
        if (ultReady && !ultActive) {
            const pulse = (Math.sin(U.now() * 5) + 1) / 2;
            ctx.globalAlpha = 0.3 + pulse * 0.3;
            ctx.strokeStyle = '#ffe080';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ui.ultX, ui.ultY, ui.ultR + 10 + pulse * 8, 0, U.TAU);
            ctx.stroke();
        }

        ctx.restore();
    };

    G.Render = Render;
})(window);

</script>
