<script>
// ============================================================
//  G.UI - DOM界面模块
// ============================================================
(function(G) {
    const UI = {};
    let uiEl = null;

    UI.init = function(el) {
        uiEl = el;
    };

    UI.clear = function() {
        uiEl.innerHTML = '';
    };

    // ---- 升级选项 ----
    UI.getUpgradeChoices = function() {
        const p = G.PlayerSys.get();
        const choices = [];
        const weaponsOwned = p.weapons.map(w => w.id);
        const passivesOwned = p.passives.map(pas => pas.id);
        const canNewWeapon = p.weapons.length < CFG.MAX_WEAPONS;
        const canNewPassive = p.passives.length < CFG.MAX_PASSIVES;

        // Weapon upgrades
        for (const w of p.weapons) {
            const def = CFG.WEAPONS[w.id];
            if (def.isEvolved) continue;
            if (w.level < def.levels.length - 1) {
                choices.push({
                    type: 'weapon', id: w.id,
                    icon: def.icon, name: def.name, color: def.color,
                    desc: '升级 Lv.' + (w.level + 2),
                    subDesc: def.desc,
                    rarity: 'common',
                });
            } else {
                // Maxed weapon: check for evolution
                if (def.evolvePassive) {
                    const pd = CFG.PASSIVES[def.evolvePassive];
                    const pasLv = Weapons.passiveLevel(def.evolvePassive);
                    if (pasLv >= pd.max) {
                        const evo = CFG.WEAPONS[def.evolvedId];
                        choices.push({
                            type: 'evolve', id: def.evolvedId, baseId: w.id,
                            icon: evo.icon, name: evo.name, color: '#ff6030',
                            desc: '【进化】' + evo.name,
                            subDesc: evo.desc,
                            rarity: 'legend',
                            evolved: true,
                        });
                    }
                }
            }
        }
        // New weapons
        if (canNewWeapon) {
            for (const [id, def] of Object.entries(CFG.WEAPONS)) {
                if (def.isEvolved) continue;
                if (weaponsOwned.includes(id)) continue;
                choices.push({
                    type: 'new_weapon', id,
                    icon: def.icon, name: def.name, color: def.color,
                    desc: '新武器',
                    subDesc: def.desc,
                    rarity: 'common',
                });
            }
        }
        // Passive upgrades
        for (const pas of p.passives) {
            const def = CFG.PASSIVES[pas.id];
            if (pas.level < def.max) {
                choices.push({
                    type: 'passive', id: pas.id,
                    icon: def.icon, name: def.name, color: def.color,
                    desc: '升级 Lv.' + (pas.level + 1),
                    subDesc: def.desc,
                    rarity: 'uncommon',
                });
            }
        }
        // New passives
        if (canNewPassive) {
            for (const [id, def] of Object.entries(CFG.PASSIVES)) {
                if (passivesOwned.includes(id)) continue;
                choices.push({
                    type: 'new_passive', id,
                    icon: def.icon, name: def.name, color: def.color,
                    desc: '新道具',
                    subDesc: def.desc,
                    rarity: 'uncommon',
                });
            }
        }
        // Pick 3 random
        U.shuffle(choices);
        // Heal as fallback
        const picked = choices.slice(0, 3);
        while (picked.length < 3) {
            picked.push({
                type: 'heal', icon: '+', name: '恢复生命', color: '#60ff60',
                desc: '恢复30%生命',
                subDesc: '吃一口馒头',
                rarity: 'common',
            });
        }
        return picked;
    };

    UI.getChestChoices = function() {
        // Chests give 3 random upgrades
        return UI.getUpgradeChoices();
    };

    UI.showLevelUp = function(state) {
        UI.showChoiceModal(state, '升级！Lv.' + G.PlayerSys.get().level, state.levelChoices);
    };

    UI.showChest = function(state) {
        UI.showChoiceModal(state, '宝箱！选择奖励', state.chestChoices, true);
    };

    UI.showChoiceModal = function(state, title, choices, isChest) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const isEvo = choices.some(c => c.evolved);
        overlay.innerHTML = '<div class="modal-box' + (isEvo ? ' evolve-modal' : '') + '">' +
            (isChest ? '<div class="modal-chest-deco">◆</div>' : '') +
            '<div class="modal-title' + (isEvo ? ' evolve-title' : '') + '">' + title + '</div>' +
            '<div class="modal-deco-line"></div>' +
            '<div class="choice-row"></div>' +
            '</div>';
        const row = overlay.querySelector('.choice-row');
        choices.forEach((c, idx) => {
            const card = document.createElement('div');
            const isNew = c.type === 'new_weapon' || c.type === 'new_passive';
            const rarityClass = 'rarity-' + c.rarity + (c.evolved ? ' evolved' : '');
            card.className = 'choice-card ' + rarityClass;
            card.style.animationDelay = (idx * 0.08) + 's';
            card.innerHTML =
                (isNew ? '<div class="card-new-tag">新</div>' : '') +
                (c.evolved ? '<div class="card-evo-tag">★ 进化 ★</div>' : '') +
                '<div class="card-icon" style="color:' + c.color + ';border-color:' + c.color + ';box-shadow:0 0 12px ' + c.color + '60">' + c.icon + '</div>' +
                '<div class="card-rarity-dot rarity-' + c.rarity + '"></div>' +
                '<div class="card-name">' + c.name + '</div>' +
                '<div class="card-desc">' + c.desc + '</div>' +
                '<div class="card-sub">' + c.subDesc + '</div>';
            card.onclick = () => {
                UI.applyChoice(c, state);
                overlay.remove();
                if (isChest) {
                    state.chestOpen = false;
                } else {
                    state.levelUp = false;
                    // Check for evolution after upgrade
                    for (const w of G.PlayerSys.get().weapons) {
                        Weapons.tryEvolve(w.id);
                    }
                    G.PlayerSys.recalcStats();
                }
            };
            row.appendChild(card);
        });
        uiEl.appendChild(overlay);
    };

    UI.applyChoice = function(c, state) {
        if (c.type === 'weapon' || c.type === 'new_weapon') {
            if (c.type === 'new_weapon') Weapons.add(c.id);
            else Weapons.upgrade(c.id);
        } else if (c.type === 'evolve') {
            const p = G.PlayerSys.get();
            const w = p.weapons.find(w => w.id === c.baseId);
            if (w) {
                w.id = c.id;
                w.level = 0;
                p.weaponCooldowns[c.id] = 0;
                // 进化特效！
                FX.evolveEffect(p.x, p.y, state);
            }
        } else if (c.type === 'passive' || c.type === 'new_passive') {
            if (c.type === 'new_passive') Weapons.addPassive(c.id);
            else Weapons.upgradePassive(c.id);
            G.PlayerSys.recalcStats();
        } else if (c.type === 'heal') {
            const p = G.PlayerSys.get();
            p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.3);
            FX.addHeal(p.x, p.y);
        }
    };

    // ---- HUD ----
    UI.updateHUD = function(state) {
        const p = G.PlayerSys.get();
        if (!p) return;
        let hud = U.$('hud');
        if (!hud) {
            hud = document.createElement('div');
            hud.id = 'hud';
            hud.className = 'hud';
            uiEl.appendChild(hud);
        }
        const hpPct = (p.hp / p.maxHp * 100).toFixed(0);
        const xpPct = (p.xp / p.xpNext * 100).toFixed(0);
        const mins = Math.floor(state.time / 60);
        const secs = Math.floor(state.time % 60);
        const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        const dragonPct = (state.dragonMeter / state.dragonMax * 100).toFixed(0);
        let weaponSlots = '';
        for (let i = 0; i < CFG.MAX_WEAPONS; i++) {
            const w = p.weapons[i];
            if (w) {
                const def = CFG.WEAPONS[w.id];
                const lv = w.level + 1;
                const maxLv = def.levels.length;
                const evoClass = def.isEvolved ? ' evolved' : '';
                weaponSlots += '<div class="slot weapon' + evoClass + '" style="border-color:' + def.color + '">' +
                    '<div class="slot-icon" style="color:' + def.color + '">' + def.icon + '</div>' +
                    '<div class="slot-lv">' + (def.isEvolved ? '★' : lv) + '</div>' +
                    '</div>';
            } else {
                weaponSlots += '<div class="slot weapon empty"><div class="slot-icon">+</div></div>';
            }
        }
        let passiveSlots = '';
        for (let i = 0; i < CFG.MAX_PASSIVES; i++) {
            const pas = p.passives[i];
            if (pas) {
                const def = CFG.PASSIVES[pas.id];
                passiveSlots += '<div class="slot passive" style="border-color:' + def.color + '">' +
                    '<div class="slot-icon" style="color:' + def.color + '">' + def.icon + '</div>' +
                    '<div class="slot-lv">' + pas.level + '</div>' +
                    '</div>';
            } else {
                passiveSlots += '<div class="slot passive empty"><div class="slot-icon">+</div></div>';
            }
        }
        hud.innerHTML =
            '<div class="hud-top-left">' +
                '<div class="char-name" style="color:' + p.char.color + '">' + p.char.name + ' <span class="lv-badge">Lv.' + p.level + '</span></div>' +
                '<div class="bar-wrap"><div class="bar-label">HP</div><div class="bar hp-bar"><div class="bar-fill" style="width:' + hpPct + '%;background:linear-gradient(90deg,#c02020,#ff4040)"></div><div class="bar-text">' + Math.ceil(p.hp) + ' / ' + Math.ceil(p.maxHp) + '</div></div></div>' +
                '<div class="bar-wrap"><div class="bar-label">XP</div><div class="bar xp-bar"><div class="bar-fill" style="width:' + xpPct + '%;background:linear-gradient(90deg,#2060c0,#40a0ff)"></div></div></div>' +
                '<div class="bar-wrap"><div class="bar-label">龙脉</div><div class="bar dragon-bar"><div class="bar-fill" style="width:' + dragonPct + '%;background:linear-gradient(90deg,#8a6020,#c9a84c)"></div><div class="bar-text">' + (state.ultimateActive > 0 ? '觉醒中!' : (state.dragonMeter >= state.dragonMax ? '[Q] 龙脉觉醒' : dragonPct + '%')) + '</div></div></div>' +
                '<div class="dash-info">冲刺 [空格] ' + (state.dashCd <= 0 ? '就绪' : state.dashCd.toFixed(1) + 's') + '</div>' +
            '</div>' +
            '<div class="hud-top-right">' +
                '<div class="time-display">' + timeStr + '</div>' +
                '<div class="kills-display"><span class="kill-dot"></span>击杀: ' + state.kills + '</div>' +
                '<div class="goal-display">目标: 存活20分钟</div>' +
                UI.renderQuests(state) +
            '</div>' +
            '<div class="hud-bottom">' +
                '<div class="slots-label">武器</div>' +
                '<div class="slots-row">' + weaponSlots + '</div>' +
                '<div class="slots-label passive-label">道具</div>' +
                '<div class="slots-row">' + passiveSlots + '</div>' +
            '</div>';
    };

    // 渲染任务面板
    UI.renderQuests = function(state) {
        if (!state.quests || state.quests.length === 0) return '';
        let html = '<div class="quest-panel">';
        html += '<div class="quest-title">◆ 任务</div>';
        const activeQuests = state.quests.filter(q => !q.completed).slice(0, 3);
        for (const q of activeQuests) {
            const pct = Math.min(100, (q.progress / q.target) * 100);
            html += '<div class="quest-item' + (q.completed ? ' completed' : '') + '">' +
                '<div class="quest-name">' + q.name + '</div>' +
                '<div class="quest-desc">' + q.desc + '</div>' +
                '<div class="quest-progress-bar"><div class="quest-progress-fill" style="width:' + pct + '%"></div></div>' +
                '<div class="quest-progress-text">' + Math.min(q.progress, q.target) + ' / ' + q.target + ' <span class="quest-reward">+' + q.reward + 'XP</span></div>' +
            '</div>';
        }
        // 显示刚完成的任务（短暂显示）
        const recentlyCompleted = state.quests.filter(q => q.completed && state.time - q.completeTime < 2).slice(0, 1);
        for (const q of recentlyCompleted) {
            html += '<div class="quest-item completed just-completed">' +
                '<div class="quest-name">✓ ' + q.name + '</div>' +
                '<div class="quest-reward-big">+' + q.reward + ' XP</div>' +
            '</div>';
        }
        html += '</div>';
        return html;
    };

    UI.showTitle = function(onStart) {
        UI.clear();
        const overlay = document.createElement('div');
        overlay.className = 'title-screen';
        const controlsText = Input.isMobile
            ? '<div class="controls-info">左侧摇杆移动 · 右下按钮冲刺/觉醒 · 武器自动攻击</div>'
            : '<div class="controls-info"><span class="key">WASD</span> 移动 · <span class="key">空格</span> 冲刺 · <span class="key">Q</span> 龙脉觉醒 · 武器自动攻击</div>';
        overlay.innerHTML =
            '<div class="title-embers"></div>' +
            '<div class="title-main">龙陵秘藏</div>' +
            '<div class="title-sub">— 幸存者 —</div>' +
            '<div class="title-desc">深入古墓，斩妖除魔。存活 20 分钟，击败龙脉神龙！</div>' +
            controlsText +
            '<div class="char-select-title">选择角色</div>' +
            '<div class="char-row"></div>';
        const row = overlay.querySelector('.char-row');
        CFG.CHARACTERS.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'char-card';
            card.innerHTML =
                '<div class="char-icon" style="color:' + ch.color + ';border-color:' + ch.color + ';box-shadow:0 0 20px ' + ch.color + '40">' + ch.name[0] + '</div>' +
                '<div class="char-name" style="color:' + ch.color + '">' + ch.name + '</div>' +
                '<div class="char-desc">' + ch.desc + '</div>' +
                '<div class="char-stats">HP: ' + ch.hp + ' · 速度: ' + ch.speed + '</div>' +
                (ch.bonusDmg ? '<div class="char-bonus ' + (ch.bonusDmg > 0 ? 'positive' : 'negative') + '">攻击' + (ch.bonusDmg > 0 ? '+' : '') + Math.round(ch.bonusDmg * 100) + '%</div>' : '') +
                (ch.bonusDef ? '<div class="char-bonus ' + (ch.bonusDef > 0 ? 'positive' : 'negative') + '">防御' + (ch.bonusDef > 0 ? '+' : '') + ch.bonusDef + '</div>' : '') +
                (ch.bonusSpeed ? '<div class="char-bonus ' + (ch.bonusSpeed > 0 ? 'positive' : 'negative') + '">速度' + (ch.bonusSpeed > 0 ? '+' : '') + Math.round(ch.bonusSpeed * 100) + '%</div>' : '');
            card.onclick = () => {
                overlay.remove();
                onStart(ch.id);
            };
            row.appendChild(card);
        });
        uiEl.appendChild(overlay);
    };

    UI.showGameOver = function(state, onRestart) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const mins = Math.floor(state.time / 60);
        const secs = Math.floor(state.time % 60);
        const ks = G.Quests.getKillSummary(state);
        const bossNames = { boss1:'白骨将军', boss2:'血尸王', boss3:'幽冥鬼王', final_boss:'龙脉之主' };
        let bossKillsHtml = '';
        for (const [bid, bname] of Object.entries(bossNames)) {
            const cnt = state.killStats[bid] || 0;
            if (cnt > 0) {
                bossKillsHtml += '<div class="kill-detail boss-kill"><span class="kill-name">' + bname + '</span><span class="kill-cnt">×' + cnt + '</span></div>';
            }
        }
        overlay.innerHTML = '<div class="modal-box gameover">' +
            '<div class="modal-deco-corner tl"></div>' +
            '<div class="modal-deco-corner tr"></div>' +
            '<div class="modal-deco-corner bl"></div>' +
            '<div class="modal-deco-corner br"></div>' +
            '<div class="gameover-title">你死了</div>' +
            '<div class="gameover-sub">古墓之中，又添一缕孤魂...</div>' +
            '<div class="modal-deco-line dark"></div>' +
            '<div class="stats-grid">' +
                '<div class="stat-item"><div class="stat-val">' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '</div><div class="stat-lbl">存活时间</div></div>' +
                '<div class="stat-item"><div class="stat-val">' + ks.total + '</div><div class="stat-lbl">击杀妖魔</div></div>' +
                '<div class="stat-item"><div class="stat-val">Lv.' + G.PlayerSys.get().level + '</div><div class="stat-lbl">最终等级</div></div>' +
            '</div>' +
            (bossKillsHtml ? '<div class="kill-stats-title">击败Boss</div><div class="kill-stats">' + bossKillsHtml + '</div>' : '') +
            '<div class="kill-stats-title">击杀统计</div>' +
            '<div class="kill-stats">' +
                '<div class="kill-detail"><span class="kill-name">普通妖怪</span><span class="kill-cnt">' + Math.max(0, ks.total - ks.eliteKills - ks.bossKills) + '</span></div>' +
                '<div class="kill-detail elite-kill"><span class="kill-name">精英妖怪</span><span class="kill-cnt">' + ks.eliteKills + '</span></div>' +
                '<div class="kill-detail"><span class="kill-name">金币收集</span><span class="kill-cnt">' + state.gold + '</span></div>' +
            '</div>' +
            '<button class="btn btn-restart" id="btn-restart">重新挑战</button>' +
            '</div>';
        uiEl.appendChild(overlay);
        U.$('btn-restart').onclick = () => {
            overlay.remove();
            onRestart();
        };
    };

    UI.showVictory = function(state, onRestart) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay victory-overlay';
        const mins = Math.floor(state.time / 60);
        const secs = Math.floor(state.time % 60);
        const ks = G.Quests.getKillSummary(state);
        overlay.innerHTML = '<div class="modal-box victory">' +
            '<div class="victory-particles"></div>' +
            '<div class="modal-deco-corner tl gold"></div>' +
            '<div class="modal-deco-corner tr gold"></div>' +
            '<div class="modal-deco-corner bl gold"></div>' +
            '<div class="modal-deco-corner br gold"></div>' +
            '<div class="victory-title">胜利！</div>' +
            '<div class="victory-sub">✦ 龙脉秘宝，尽归汝手 ✦</div>' +
            '<div class="victory-desc">你击败了龙脉之主，带着千年秘宝逃出古墓！</div>' +
            '<div class="modal-deco-line gold"></div>' +
            '<div class="stats-grid gold">' +
                '<div class="stat-item"><div class="stat-val">' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '</div><div class="stat-lbl">通关时间</div></div>' +
                '<div class="stat-item"><div class="stat-val">' + ks.total + '</div><div class="stat-lbl">斩妖除魔</div></div>' +
                '<div class="stat-item"><div class="stat-val">Lv.' + G.PlayerSys.get().level + '</div><div class="stat-lbl">最终等级</div></div>' +
            '</div>' +

                '<div class="kill-detail"><span class="kill-name">普通妖怪</span><span class="kill-cnt">' + Math.max(0, ks.total - ks.eliteKills - ks.bossKills) + '</span></div>' +
                '<div class="kill-detail elite-kill"><span class="kill-name">精英妖怪</span><span class="kill-cnt">' + ks.eliteKills + '</span></div>' +
                '<div class="kill-detail boss-kill"><span class="kill-name">白骨将军</span><span class="kill-cnt">×' + (state.killStats.boss1 || 0) + '</span></div>' +
                '<div class="kill-detail boss-kill"><span class="kill-name">血尸王</span><span class="kill-cnt">×' + (state.killStats.boss2 || 0) + '</span></div>' +
                '<div class="kill-detail boss-kill"><span class="kill-name">幽冥鬼王</span><span class="kill-cnt">×' + (state.killStats.boss3 || 0) + '</span></div>' +
                '<div class="kill-detail boss-kill"><span class="kill-name">龙脉之主</span><span class="kill-cnt">×' + (state.killStats.final_boss || 0) + '</span></div>' +
                '<div class="kill-detail"><span class="kill-name">金币收集</span><span class="kill-cnt">' + state.gold + '</span></div>' +
            '</div>' +
            '<button class="btn btn-restart btn-gold" id="btn-restart2">再来一局</button>' +
            '</div>';
        uiEl.appendChild(overlay);
        U.$('btn-restart2').onclick = () => {
            overlay.remove();
            onRestart();
        };
    };

    G.UI = UI;
})(window);

</script>

<script>
// ============================================================
//  G.Game - 游戏核心模块（主循环/状态管理）
// ============================================================
(function(G) {
    const Game = {};
    let canvas, ctx;
    let state = null;
    let lastTime = 0;
    let running = false;

    Game.createState = function() {
        return {
            time: 0,
            kills: 0,
            gold: 0,
            camera: { x: 0, y: 0 },
            shake: 0,
            shakeStrong: 0,
            flash: 0,
            flashColor: '#fff',
            hitStop: 0,
            slowMoTime: 0,
            slowMoFactor: 1,
            timeScale: 1,
            tintColor: null,
            tintTime: 0,
            tintAlpha: 0,
            spawnTimer: 0,
            levelUp: false,
            levelChoices: null,
            chestOpen: false,
            chestChoices: null,
            gameOver: false,
            victory: false,
            bossSpawned1: false,
            bossSpawned2: false,
            bossSpawned3: false,
            finalBossSpawned: false,
            invuln: 0,
            dashCd: 0,
            dashActive: 0,
            dashDir: { x: 1, y: 0 },
            dragonMeter: 0,
            dragonMax: 100,
            ultimateActive: 0,
        };
    };

    Game.init = function(canvasEl) {
        canvas = canvasEl;
        ctx = canvas.getContext('2d');
        Render.init(ctx);
        Input.init(canvas);
        UI.init(document.getElementById('ui-layer'));
    };

    Game.start = function(charId) {
        // Reset all systems
        state = Game.createState();
        FX.init();
        Entities.init();
        Enemies.init();
        PlayerSys.reset();
        const p = PlayerSys.create(charId);
        Weapons.init(p);
        Quests.init(state);  // 初始化任务系统
        running = true;
        lastTime = U.now();
        UI.clear();
        requestAnimationFrame(Game.loop);
    };

    Game.loop = function() {
        if (!running) return;
        const now = U.now();
        let dt = Math.min(0.05, now - lastTime);
        lastTime = now;

        // 计算时间缩放（hitStop/slowMotion）
        let timeScale = 1;
        if (state.hitStop > 0) {
            state.hitStop -= dt;
            timeScale = 0;
        }
        if (state.slowMoTime > 0) {
            state.slowMoTime -= dt;
            timeScale *= state.slowMoFactor;
        }
        state.timeScale = timeScale;
        const effDt = dt * timeScale;

        if (!state.gameOver && !state.victory && !state.levelUp && !state.chestOpen) {
            state.time += effDt;
            // Update all systems with scaled dt
            PlayerSys.update(effDt, state, Enemies.list);
            const p = PlayerSys.get();
            Weapons.update(effDt, state, Enemies.list);
            Enemies.updateSpawning(effDt, state, state.camera, CFG.W, CFG.H);
            Enemies.update(effDt, state);
            Entities.updateAll(effDt, state);
            FX.update(dt, state, true); // 传true表示timeScale已在外部计算
            Quests.update(effDt, state);  // 更新任务进度

            // Check death
            if (p.hp <= 0) {
                state.gameOver = true;
                FX.deathEffect(p.x, p.y, state);
                setTimeout(() => UI.showGameOver(state, () => Game.showTitle()), 1500);
            }
            // Check victory
            if (state.victory) {
                setTimeout(() => UI.showVictory(state, () => Game.showTitle()), 1500);
            }
            // Check time up (fail safe)
            if (state.time > CFG.SURVIVE_TIME + 30 && !state.finalBossSpawned) {
                // Force spawn final boss
                state.finalBossSpawned = true;
                Enemies.list = Enemies.list.filter(e => e.boss);
                Enemies.spawnAtEdge('final_boss', state.camera, CFG.W, CFG.H, state.time);
                FX.screenFlash(state, '#c9a84c', 1.0);
            }
        } else {
            // Still update particles and effects in pause (use full dt for feel)
            FX.update(dt, state, true);
        }

        // Render
        Render.draw(state);
        UI.updateHUD(state);

        requestAnimationFrame(Game.loop);
    };

    Game.showTitle = function() {
        running = false;
        UI.showTitle(charId => Game.start(charId));
    };

    G.Game = Game;
})(window);

</script>
