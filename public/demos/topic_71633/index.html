<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高考志愿填报系统 · 高校地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --c-primary:#1E4FD8;
  --c-primary-dark:#163A9E;
  --c-primary-light:#4F7AE6;
  --c-accent:#3B82F6;
  --c-cyan:#00C2FF;
  --c-mist:#EAF2FF;
  --c-mist-2:#DCE8FB;
  --c-bg:#F5F9FF;
  --c-card:#FFFFFF;
  --c-ink:#0F1B3D;
  --c-ink-2:#5B6B8C;
  --c-ink-3:#94A3B8;
  --c-line:#E2E8F4;
  --c-warm:#FF7A45;
  --c-green:#18B884;
  --shadow-sm:0 1px 2px rgba(30,79,216,.06),0 1px 3px rgba(30,79,216,.05);
  --shadow-md:0 6px 20px rgba(30,79,216,.10);
  --shadow-lg:0 16px 40px rgba(30,79,216,.16);
  --shadow-glow:0 0 0 4px rgba(30,79,216,.10);
  --radius:12px;
  --radius-sm:8px;
  --radius-xs:6px;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--c-ink);
  background:
    radial-gradient(1200px 600px at 12% -8%, #DCE8FB 0%, rgba(220,232,251,0) 55%),
    radial-gradient(1000px 500px at 100% 0%, #E6F1FF 0%, rgba(230,241,255,0) 50%),
    var(--c-bg);
  background-attachment:fixed;
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
  display:grid;
  grid-template-rows:var(--nav-h) 1fr;
}
.serif{font-family:'Noto Serif SC',serif}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7D6F0;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#9FB6E6}

/* ============ NAVBAR ============ */
.navbar{
  position:relative;z-index:50;
  display:flex;align-items:center;gap:20px;
  padding:0 22px;
  background:rgba(255,255,255,.78);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid rgba(226,232,244,.9);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, var(--shadow-sm);
  animation:slideDown .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-cyan) 100%);
  display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(30,79,216,.35),inset 0 1px 0 rgba(255,255,255,.4);
  position:relative;overflow:hidden;
}
.brand-logo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 50%)}
.brand-logo svg{width:21px;height:21px;color:#fff;position:relative;z-index:1}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text .t1{font-family:'Noto Serif SC';font-weight:900;font-size:16px;color:var(--c-ink);letter-spacing:.5px}
.brand-text .t2{font-size:10.5px;color:var(--c-ink-2);letter-spacing:2px;text-transform:uppercase;font-weight:500}

.nav-divider{width:1px;height:28px;background:var(--c-line)}

.region-tabs{display:flex;align-items:center;gap:4px;background:var(--c-mist);padding:4px;border-radius:10px}
.region-tab{
  padding:6px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--c-ink-2);
  transition:all .25s;position:relative;
}
.region-tab:hover{color:var(--c-primary)}
.region-tab.active{background:#fff;color:var(--c-primary);box-shadow:var(--shadow-sm);font-weight:600}

.nav-search{position:relative;flex:1;max-width:340px;margin-left:auto}
.nav-search input{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--c-line);
  background:rgba(255,255,255,.7);padding:0 14px 0 38px;font-size:13px;color:var(--c-ink);
  transition:all .25s;
}
.nav-search input:focus{outline:none;border-color:var(--c-accent);background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--c-ink-3)}
.nav-search .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:none;place-items:center;color:var(--c-ink-3)}
.nav-search .clear-btn:hover{background:var(--c-mist);color:var(--c-ink)}
.nav-search.has-val .clear-btn{display:grid}

.stat-cards{display:flex;gap:10px;flex-shrink:0}
.stat-card{
  background:linear-gradient(135deg,#fff 0%,var(--c-mist) 100%);
  border:1px solid var(--c-line);border-radius:10px;padding:6px 14px;
  display:flex;flex-direction:column;align-items:center;min-width:74px;
  box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s;
}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.stat-card .num{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--c-primary);line-height:1.1}
.stat-card .lbl{font-size:10px;color:var(--c-ink-2);margin-top:2px;letter-spacing:.5px}
.stat-card.cyan .num{color:var(--c-cyan)}
.stat-card.warm .num{color:var(--c-warm)}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  height:38px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:600;
  transition:all .22s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-dark) 100%);color:#fff;box-shadow:0 4px 12px rgba(30,79,216,.30)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(30,79,216,.40)}
.btn-ghost{background:rgba(255,255,255,.6);color:var(--c-ink);border:1px solid var(--c-line)}
.btn-ghost:hover{background:#fff;border-color:var(--c-accent);color:var(--c-primary)}
.btn-icon{width:38px;height:38px;padding:0;justify-content:center}

/* ============ WORKSPACE ============ */
.workspace{display:grid;grid-template-columns:300px 1fr 380px;height:calc(100vh - var(--nav-h));overflow:hidden}
.workspace.left-collapsed{grid-template-columns:0 1fr 380px}
.workspace.right-collapsed{grid-template-columns:300px 1fr 0}
.workspace.left-collapsed.right-collapsed{grid-template-columns:0 1fr 0}

/* ============ LEFT SIDEBAR ============ */
.sidebar{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);
  border-right:1px solid var(--c-line);
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:slideRight .6s .15s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideRight{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.sidebar-head{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-family:'Noto Serif SC';font-weight:700;font-size:15px;color:var(--c-ink);display:flex;align-items:center;gap:8px}
.sidebar-title svg{width:16px;height:16px;color:var(--c-primary)}
.collapse-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--c-ink-2);transition:all .2s}
.collapse-btn:hover{background:var(--c-mist);color:var(--c-primary)}

.sidebar-body{flex:1;overflow-y:auto;padding:0 18px 18px}

.filter-block{margin-bottom:18px;animation:fadeUp .5s .3s both}
.filter-block:nth-child(2){animation-delay:.38s}
.filter-block:nth-child(3){animation-delay:.46s}
.filter-block:nth-child(4){animation-delay:.54s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.filter-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.filter-label .lbl{font-size:12px;font-weight:600;color:var(--c-ink-2);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.filter-label .lbl svg{width:13px;height:13px;color:var(--c-accent)}
.filter-label .val{font-family:'JetBrains Mono';font-size:12px;font-weight:700;color:var(--c-primary)}

/* dual range slider */
.range-wrap{position:relative;height:38px;padding:0 8px}
.range-track{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:6px;border-radius:6px;background:var(--c-mist-2);overflow:hidden}
.range-fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--c-primary) 0%,var(--c-cyan) 100%);border-radius:6px}
.range-wrap input[type=range]{
  position:absolute;left:0;right:0;top:0;width:100%;height:38px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;
}
.range-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:3px solid var(--c-primary);box-shadow:0 2px 8px rgba(30,79,216,.35);
  pointer-events:auto;cursor:grab;transition:transform .15s;margin-top:0;
}
.range-wrap input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.range-wrap input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
.range-wrap input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--c-primary);
  box-shadow:0 2px 8px rgba(30,79,216,.35);pointer-events:auto;cursor:grab;
}
.range-bubbles{display:flex;justify-content:space-between;margin-top:2px;padding:0 4px}
.range-bubbles .b{font-family:'JetBrains Mono';font-size:11px;color:var(--c-ink-2);font-weight:500}

.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.preset-chip{
  padding:5px 11px;border-radius:14px;font-size:11.5px;font-weight:500;
  background:#fff;border:1px solid var(--c-line);color:var(--c-ink-2);transition:all .2s;
}
.preset-chip:hover{border-color:var(--c-accent);color:var(--c-primary);transform:translateY(-1px)}
.preset-chip.active{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(30,79,216,.3)}

.type-tags{display:flex;flex-wrap:wrap;gap:7px}
.type-tag{
  padding:7px 13px;border-radius:18px;font-size:12px;font-weight:600;
  background:#fff;border:1px solid var(--c-line);color:var(--c-ink-2);
  transition:all .22s;display:inline-flex;align-items:center;gap:5px;
}
.type-tag .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.type-tag:hover{border-color:var(--c-accent);color:var(--c-primary)}
.type-tag.active{color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.type-tag[data-type="985"].active{background:linear-gradient(135deg,#7C3AED,#5B21B6)}
.type-tag[data-type="211"].active{background:linear-gradient(135deg,#1E4FD8,#163A9E)}
.type-tag[data-type="双一流"].active{background:linear-gradient(135deg,#00C2FF,#0095D9)}
.type-tag[data-type="普通本科"].active{background:linear-gradient(135deg,#18B884,#0F8A62)}

.ownership-toggle{display:flex;gap:7px;margin-top:9px}
.own-btn{flex:1;padding:7px;border-radius:8px;font-size:11.5px;font-weight:500;background:#fff;border:1px solid var(--c-line);color:var(--c-ink-2);transition:all .2s}
.own-btn:hover{border-color:var(--c-accent)}
.own-btn.active{background:var(--c-mist);color:var(--c-primary);border-color:var(--c-accent);font-weight:600}

.sort-row{display:flex;gap:6px}
.sort-btn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:500;background:#fff;border:1px solid var(--c-line);color:var(--c-ink-2);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.sort-btn svg{width:13px;height:13px}
.sort-btn:hover{border-color:var(--c-accent);color:var(--c-primary)}
.sort-btn.active{background:var(--c-mist);color:var(--c-primary);border-color:var(--c-accent);font-weight:600}

.list-count{font-size:11.5px;color:var(--c-ink-2);font-weight:500}
.school-list{display:flex;flex-direction:column;gap:9px}
.school-card{
  position:relative;background:#fff;border:1px solid var(--c-line);border-radius:var(--radius-sm);
  padding:11px 13px 11px 16px;cursor:pointer;transition:all .22s;overflow:hidden;
  animation:cardIn .4s both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.school-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar-color,var(--c-accent))}
.school-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--c-accent)}
.school-card.active{border-color:var(--c-primary);box-shadow:0 0 0 2px rgba(30,79,216,.15),var(--shadow-md);background:linear-gradient(135deg,#fff,var(--c-mist))}
.school-card .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.school-card .sc-name{font-weight:700;font-size:13.5px;color:var(--c-ink);line-height:1.3}
.school-card .sc-score{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--c-primary);line-height:1}
.school-card .sc-score .unit{font-size:9.5px;color:var(--c-ink-2);font-weight:500;margin-left:1px}
.school-card .sc-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.school-card .sc-loc{font-size:11px;color:var(--c-ink-2);display:flex;align-items:center;gap:3px}
.school-card .sc-loc svg{width:11px;height:11px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.3px}
.badge-985{background:#EDE9FE;color:#6D28D9}
.badge-211{background:var(--c-mist);color:var(--c-primary-dark)}
.badge-double{background:#E0F7FF;color:#0095D9}
.badge-normal{background:#E6F7F0;color:#0F8A62}
.badge-private{background:#FFF0EA;color:#C8531F}
.badge-public{background:var(--c-mist);color:var(--c-ink-2)}
.school-card .sc-trend{font-family:'JetBrains Mono';font-size:10px;color:var(--c-green);margin-top:5px;display:flex;align-items:center;gap:3px}
.school-card .sc-trend.down{color:var(--c-warm)}
.school-card.custom-flag{border-style:dashed}
.school-card.custom-flag .custom-mark{font-size:9px;color:var(--c-warm);font-weight:600;margin-left:4px}

/* ============ MAP AREA ============ */
.map-area{position:relative;display:flex;flex-direction:column;overflow:hidden}
.map-header{
  position:absolute;top:14px;left:14px;right:14px;z-index:20;
  display:flex;align-items:center;gap:10px;pointer-events:none;
}
.map-header > *{pointer-events:auto}
.breadcrumb{
  display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);border:1px solid var(--c-line);border-radius:10px;
  padding:6px 10px;box-shadow:var(--shadow-sm);
}
.crumb{font-size:12.5px;font-weight:500;color:var(--c-ink-2);cursor:pointer;transition:color .2s;padding:2px 4px;border-radius:5px}
.crumb:hover{color:var(--c-primary);background:var(--c-mist)}
.crumb.current{color:var(--c-primary);font-weight:700}
.crumb-sep{color:var(--c-ink-3);font-size:11px}
.province-select{
  height:32px;border-radius:8px;border:1px solid var(--c-line);background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);padding:0 10px;font-size:12.5px;color:var(--c-ink);box-shadow:var(--shadow-sm);
}
.province-select:focus{outline:none;border-color:var(--c-accent)}

.map-legend{
  position:absolute;bottom:14px;left:14px;z-index:20;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border:1px solid var(--c-line);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow-sm);
  font-size:11px;
}
.map-legend .lg-title{font-weight:700;color:var(--c-ink);margin-bottom:6px;font-size:11.5px;display:flex;align-items:center;gap:5px}
.map-legend .lg-title svg{width:13px;height:13px;color:var(--c-primary)}
.legend-bar{width:180px;height:8px;border-radius:8px;background:linear-gradient(90deg,#EAF2FF,#7AA8F0,#1E4FD8,#0B2A7A);margin-bottom:4px}
.legend-labels{display:flex;justify-content:space-between;color:var(--c-ink-2);font-family:'JetBrains Mono';font-size:10px}

.map-toggle-group{position:absolute;top:14px;right:14px;z-index:20;display:flex;gap:6px}
.map-tip{
  position:absolute;bottom:14px;right:14px;z-index:20;
  background:rgba(15,27,61,.82);color:#fff;border-radius:10px;padding:8px 12px;font-size:11px;
  display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-md);max-width:260px;
}
.map-tip svg{width:13px;height:13px;color:var(--c-cyan);flex-shrink:0}

#chart{width:100%;height:100%;min-height:400px;animation:mapIn .8s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes mapIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

.map-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(245,249,255,.9);z-index:30;transition:opacity .4s}
.map-loading.hidden{opacity:0;pointer-events:none}
.loader-ring{width:48px;height:48px;border:4px solid var(--c-mist-2);border-top-color:var(--c-primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.map-loading .lt{font-size:13px;color:var(--c-ink-2);font-weight:500}

/* ============ RIGHT DETAIL ============ */
.detail{
  background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
  border-left:1px solid var(--c-line);overflow-y:auto;
  animation:slideLeft .6s .25s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideLeft{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 24px;text-align:center}
.detail-empty .de-icon{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,var(--c-mist),var(--c-mist-2));display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.detail-empty .de-icon svg{width:38px;height:38px;color:var(--c-primary);opacity:.7}
.detail-empty .de-title{font-family:'Noto Serif SC';font-weight:700;font-size:16px;color:var(--c-ink)}
.detail-empty .de-desc{font-size:12.5px;color:var(--c-ink-2);line-height:1.7;max-width:240px}

.detail-content{padding:0}
.dc-hero{position:relative;height:170px;overflow:hidden;background:linear-gradient(135deg,var(--c-primary),var(--c-cyan))}
.dc-hero img{width:100%;height:100%;object-fit:cover;display:block}
.dc-hero .hero-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px;background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-cyan) 100%)}
.dc-hero .hero-fallback .hf-name{font-family:'Noto Serif SC';font-weight:900;font-size:22px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.dc-hero .hero-fallback .hf-loc{font-size:12px;opacity:.9}
.dc-hero .hero-nav{position:absolute;bottom:10px;right:10px;display:flex;gap:5px}
.dc-hero .hero-tab{padding:4px 10px;border-radius:12px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(4px);cursor:pointer;transition:all .2s}
.dc-hero .hero-tab.active{background:rgba(255,255,255,.92);color:var(--c-primary)}
.dc-hero .hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.35) 100%);pointer-events:none}

.dc-body{padding:16px 18px 24px}
.dc-header{margin-bottom:14px}
.dc-name{font-family:'Noto Serif SC';font-weight:900;font-size:20px;color:var(--c-ink);line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dc-loc{font-size:12px;color:var(--c-ink-2);margin-top:8px;display:flex;align-items:center;gap:5px}
.dc-loc svg{width:13px;height:13px;color:var(--c-accent)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.info-cell{background:#fff;border:1px solid var(--c-line);border-radius:9px;padding:10px 12px}
.info-cell .ic-lbl{font-size:10.5px;color:var(--c-ink-2);letter-spacing:.4px;font-weight:500}
.info-cell .ic-val{font-family:'JetBrains Mono';font-weight:700;font-size:17px;color:var(--c-primary);margin-top:2px;line-height:1}
.info-cell .ic-val .small{font-size:11px;color:var(--c-ink-2);font-weight:500;margin-left:2px}
.info-cell.full{grid-column:span 2}
.info-cell .ic-val.text{font-family:'Noto Sans SC';font-size:13px;color:var(--c-ink);font-weight:600}

.section-title{font-family:'Noto Serif SC';font-weight:700;font-size:13px;color:var(--c-ink);margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.section-title svg{width:14px;height:14px;color:var(--c-primary)}
.section-title .st-line{flex:1;height:1px;background:linear-gradient(90deg,var(--c-line),transparent)}

.score-chart{width:100%;height:130px}
.score-table{width:100%;font-size:11.5px;border-collapse:collapse}
.score-table th{text-align:left;color:var(--c-ink-2);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--c-line)}
.score-table td{padding:7px 8px;color:var(--c-ink);border-bottom:1px solid var(--c-line);font-family:'JetBrains Mono';font-weight:600}
.score-table td.year{font-family:'Noto Sans SC';color:var(--c-ink-2);font-weight:500}

.major-list{display:flex;flex-direction:column;gap:7px}
.major-item{background:#fff;border:1px solid var(--c-line);border-radius:9px;padding:10px 12px;transition:all .2s}
.major-item:hover{border-color:var(--c-accent);transform:translateX(2px)}
.major-item .mi-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.major-item .mi-name{font-size:12.5px;font-weight:600;color:var(--c-ink)}
.major-item .mi-score{font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--c-primary)}
.major-item .mi-code{font-family:'JetBrains Mono';font-size:10px;color:var(--c-ink-3);margin-top:3px}
.major-item .mi-desc{font-size:11px;color:var(--c-ink-2);margin-top:4px;line-height:1.5}

.dc-actions{display:flex;gap:8px;margin-top:18px}
.dc-actions .btn{flex:1;height:36px;font-size:12.5px}

/* ============ MODAL ============ */
.modal-mask{
  position:fixed;inset:0;z-index:100;background:rgba(15,27,61,.45);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-mask.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:560px;max-width:100%;max-height:90vh;overflow-y:auto;
  background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);
  animation:modalIn .35s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--c-line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-family:'Noto Serif SC';font-weight:700;font-size:17px;color:var(--c-ink);display:flex;align-items:center;gap:9px}
.modal-title svg{width:18px;height:18px;color:var(--c-primary)}
.modal-close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--c-ink-2);transition:all .2s}
.modal-close:hover{background:var(--c-mist);color:var(--c-ink)}
.modal-body{padding:20px 22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-row.full{grid-column:span 2}
.form-row label{font-size:12px;font-weight:600;color:var(--c-ink-2)}
.form-row label .req{color:var(--c-warm);margin-left:2px}
.form-row input,.form-row select,.form-row textarea{
  height:38px;border:1px solid var(--c-line);border-radius:8px;padding:0 12px;font-size:13px;color:var(--c-ink);
  background:#fff;transition:all .2s;
}
.form-row textarea{height:auto;padding:9px 12px;resize:vertical;min-height:64px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.form-row .hint{font-size:10.5px;color:var(--c-ink-3)}
.form-row .err{font-size:10.5px;color:var(--c-warm);display:none}
.form-row.invalid input,.form-row.invalid select{border-color:var(--c-warm)}
.form-row.invalid .err{display:block}

.coord-picker{display:flex;gap:8px;align-items:center}
.coord-picker input{flex:1}
.coord-pick-btn{height:38px;padding:0 12px;border-radius:8px;background:var(--c-mist);color:var(--c-primary);font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap}
.coord-pick-btn:hover{background:var(--c-mist-2)}
.coord-pick-btn.picking{background:var(--c-primary);color:#fff}
.coord-pick-btn svg{width:14px;height:14px}

.majors-editor{display:flex;flex-direction:column;gap:8px}
.major-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center}
.major-row input{height:34px;font-size:12px}
.major-add{align-self:flex-start;padding:6px 12px;border-radius:7px;background:var(--c-mist);color:var(--c-primary);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.major-add:hover{background:var(--c-mist-2)}
.major-del{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--c-ink-3)}
.major-del:hover{background:#FFF0EA;color:var(--c-warm)}

.modal-foot{padding:14px 22px;border-top:1px solid var(--c-line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;top:calc(var(--nav-h) + 14px);right:14px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#fff;border:1px solid var(--c-line);border-left:4px solid var(--c-green);
  border-radius:9px;padding:11px 16px;font-size:13px;color:var(--c-ink);box-shadow:var(--shadow-md);
  display:flex;align-items:center;gap:9px;min-width:240px;
  animation:toastIn .35s cubic-bezier(.22,1,.36,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast.err{border-left-color:var(--c-warm)}
.toast.info{border-left-color:var(--c-accent)}
.toast svg{width:17px;height:17px;flex-shrink:0}
.toast.success svg{color:var(--c-green)}
.toast.err svg{color:var(--c-warm)}
.toast.info svg{color:var(--c-accent)}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* picker overlay */
.pick-overlay{position:fixed;inset:0;z-index:150;background:rgba(15,27,61,.5);display:none;align-items:center;justify-content:center}
.pick-overlay.show{display:flex}
.pick-panel{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow-lg);max-width:90vw}
.pick-panel .pp-title{font-weight:700;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.pick-panel .pp-title svg{width:16px;height:16px;color:var(--c-primary)}
#pickChart{width:min(720px,86vw);height:min(520px,70vh);border-radius:10px;overflow:hidden}
.pick-hint{font-size:11.5px;color:var(--c-ink-2);margin-top:8px;text-align:center}

/* ============ FAB & collapsed restore ============ */
.restore-btn{
  position:absolute;top:14px;width:30px;height:30px;border-radius:8px;background:#fff;
  border:1px solid var(--c-line);box-shadow:var(--shadow-sm);display:none;place-items:center;color:var(--c-ink-2);z-index:25;
}
.restore-btn:hover{color:var(--c-primary);border-color:var(--c-accent)}
.restore-btn.left{left:14px}
.restore-btn.right{right:14px}
.workspace.left-collapsed .restore-btn.left{display:grid}
.workspace.right-collapsed .restore-btn.right{display:grid}

/* ============ RESPONSIVE ============ */
@media (max-width:1279px){
  .workspace{grid-template-columns:260px 1fr 340px}
  .nav-search{max-width:220px}
  .stat-cards .stat-card{min-width:64px;padding:5px 10px}
}
@media (max-width:1023px){
  .workspace{grid-template-columns:240px 1fr}
  .workspace.right-collapsed{grid-template-columns:240px 1fr}
  .detail{position:fixed;right:0;top:var(--nav-h);bottom:0;width:340px;z-index:60;transform:translateX(100%);transition:transform .3s;box-shadow:var(--shadow-lg)}
  .detail.open{transform:translateX(0)}
  .stat-cards{display:none}
}
@media (max-width:767px){
  .workspace{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:var(--nav-h);bottom:0;width:88vw;max-width:320px;z-index:60;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .workspace.left-collapsed .restore-btn.left{display:grid}
  .navbar{padding:0 12px;gap:10px}
  .brand-text{display:none}
  .nav-divider,.region-tabs{display:none}
  .nav-search{max-width:none}
  .map-legend{display:none}
  .form-grid{grid-template-columns:1fr}
  .form-row.full{grid-column:span 1}
  .modal{width:100%;border-radius:12px 12px 0 0}
  .modal-mask{align-items:flex-end;padding:0}
}
</style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    </div>
    <div class="brand-text">
      <span class="t1">高考志愿地图</span>
      <span class="t2">GAOKAO ATLAS</span>
    </div>
  </div>
  <div class="nav-divider"></div>
  <div class="region-tabs" id="regionTabs">
    <button class="region-tab active" data-level="country">全国</button>
    <button class="region-tab" data-level="province">省</button>
    <button class="region-tab" data-level="city">市</button>
  </div>
  <div class="nav-search" id="navSearch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索学校名称或城市…" autocomplete="off"/>
    <button class="clear-btn" id="searchClear" aria-label="清除">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><span class="num" id="statTotal">0</span><span class="lbl">在册高校</span></div>
    <div class="stat-card cyan"><span class="num" id="statShown">0</span><span class="lbl">符合筛选</span></div>
    <div class="stat-card warm"><span class="num" id="statAvg">—</span><span class="lbl">均分</span></div>
  </div>
  <button class="btn btn-primary" id="addSchoolBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    添加学校
  </button>
</nav>

<!-- ============ WORKSPACE ============ -->
<div class="workspace" id="workspace">

  <!-- LEFT -->
  <aside class="sidebar" id="leftSidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
        智能筛选
      </div>
      <button class="collapse-btn" id="collapseLeft" title="收起侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div class="sidebar-body">

      <div class="filter-block">
        <div class="filter-label">
          <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>分数区间</span>
          <span class="val" id="rangeVal">400 – 700</span>
        </div>
        <div class="range-wrap">
          <div class="range-track"><div class="range-fill" id="rangeFill"></div></div>
          <input type="range" id="rangeMin" min="400" max="700" value="400" step="5"/>
          <input type="range" id="rangeMax" min="400" max="700" value="700" step="5"/>
        </div>
        <div class="range-bubbles"><span class="b">400</span><span class="b">700</span></div>
        <div class="presets" id="presets">
          <button class="preset-chip" data-min="400" data-max="520">本科线附近</button>
          <button class="preset-chip" data-min="500" data-max="580">一本线段</button>
          <button class="preset-chip" data-min="560" data-max="630">特招线段</button>
          <button class="preset-chip" data-min="600" data-max="700">211 冲刺</button>
          <button class="preset-chip" data-min="640" data-max="700">985 冲刺</button>
        </div>
      </div>

      <div class="filter-block">
        <div class="filter-label"><span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/></svg>学校类型</span></div>
        <div class="type-tags" id="typeTags">
          <button class="type-tag active" data-type="985"><span class="dot"></span>985</button>
          <button class="type-tag active" data-type="211"><span class="dot"></span>211</button>
          <button class="type-tag active" data-type="双一流"><span class="dot"></span>双一流</button>
          <button class="type-tag active" data-type="普通本科"><span class="dot"></span>普通本科</button>
        </div>
        <div class="ownership-toggle" id="ownershipToggle">
          <button class="own-btn active" data-own="公办">公办</button>
          <button class="own-btn active" data-own="民办">民办</button>
        </div>
      </div>

      <div class="filter-block">
        <div class="filter-label"><span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M3 18h18"/></svg>排序</span></div>
        <div class="sort-row" id="sortRow">
          <button class="sort-btn active" data-sort="desc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 11l6 6 6-6"/></svg>分数降序
          </button>
          <button class="sort-btn" data-sort="asc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 13l6-6 6 6"/></svg>分数升序
          </button>
        </div>
      </div>

      <div class="filter-block">
        <div class="filter-label">
          <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>学校列表</span>
          <span class="list-count" id="listCount">0 所</span>
        </div>
        <div class="school-list" id="schoolList"></div>
      </div>

    </div>
  </aside>

  <!-- CENTER MAP -->
  <section class="map-area">
    <button class="restore-btn left" id="restoreLeft" title="展开筛选">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="map-header">
      <div class="breadcrumb" id="breadcrumb">
        <span class="crumb current" data-level="country">全国</span>
      </div>
      <select class="province-select" id="provinceSelect" style="display:none"></select>
    </div>
    <div class="map-legend">
      <div class="lg-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l9-3 9 3v12l-9 3-9-3V6z"/><path d="M12 3v18"/></svg>各省平均录取线</div>
      <div class="legend-bar"></div>
      <div class="legend-labels"><span id="legendMin">400</span><span id="legendMax">700</span></div>
    </div>
    <div class="map-tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>滚轮缩放 · 拖拽平移 · 点击省份下钻 · 点击坐标点查看学校</span>
    </div>
    <div class="map-loading" id="mapLoading">
      <div class="loader-ring"></div>
      <div class="lt">正在加载中国地图数据…</div>
    </div>
    <div id="chart"></div>
  </section>

  <!-- RIGHT DETAIL -->
  <aside class="detail" id="rightDetail">
    <div class="detail-empty" id="detailEmpty">
      <div class="de-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="de-title">点击学校查看详情</div>
      <div class="de-desc">在左侧列表点击任意学校卡片，或直接点击地图上的坐标点，即可在此查看校园风光、录取分数与专业目录。</div>
    </div>
    <div class="detail-content" id="detailContent" style="display:none"></div>
  </aside>

  <button class="restore-btn right" id="restoreRight" title="展开详情">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
</div>

<!-- ============ ADD SCHOOL MODAL ============ -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        添加未收录学校
      </div>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row full">
          <label>学校名称<span class="req">*</span></label>
          <input type="text" id="fName" placeholder="例如：深圳大学"/>
          <span class="err">请填写学校名称</span>
        </div>
        <div class="form-row">
          <label>学校类型<span class="req">*</span></label>
          <select id="fType">
            <option value="985">985</option>
            <option value="211">211</option>
            <option value="双一流">双一流</option>
            <option value="普通本科" selected>普通本科</option>
          </select>
        </div>
        <div class="form-row">
          <label>办学性质<span class="req">*</span></label>
          <select id="fOwn">
            <option value="公办" selected>公办</option>
            <option value="民办">民办</option>
          </select>
        </div>
        <div class="form-row">
          <label>所在省<span class="req">*</span></label>
          <input type="text" id="fProvince" placeholder="例如：广东省"/>
        </div>
        <div class="form-row">
          <label>所在市<span class="req">*</span></label>
          <input type="text" id="fCity" placeholder="例如：深圳市"/>
        </div>
        <div class="form-row full">
          <label>所在区/县</label>
          <input type="text" id="fDistrict" placeholder="例如：南山区"/>
        </div>
        <div class="form-row">
          <label>经度<span class="req">*</span></label>
          <div class="coord-picker">
            <input type="number" id="fLng" step="0.0001" placeholder="114.05"/>
            <button class="coord-pick-btn" id="pickCoordBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
              地图点选
            </button>
          </div>
          <span class="err">请填写经度</span>
        </div>
        <div class="form-row">
          <label>纬度<span class="req">*</span></label>
          <input type="number" id="fLat" step="0.0001" placeholder="22.53"/>
          <span class="err">请填写纬度</span>
        </div>
        <div class="form-row">
          <label>2023 录取分</label>
          <input type="number" id="fS2023" placeholder="500"/>
        </div>
        <div class="form-row">
          <label>2024 录取分</label>
          <input type="number" id="fS2024" placeholder="510"/>
        </div>
        <div class="form-row">

var LS_KEY = 'gaokao_custom_schools_v1';
var state = {
  schools: [],
  filters: { min:400, max:700, types:{'985':true,'211':true,'双一流':true,'普通本科':true}, own:{公办:true,民办:true}, search:'', sort:'desc' },
  region: { level:'country', province:null, city:null, mapName:'china' },
  selectedId: null,
  geoCache: {}
};
var chart = null;

/* ---------- 工具函数 ---------- */
function $(id){ return document.getElementById(id); }
function latestScore(s){ return s.scores[2025] || s.scores[2024] || s.scores[2023] || 0; }
function avgScore(s){ var v=s.scores; var n=0,t=0; [2023,2024,2025].forEach(function(y){ if(v[y]){n++;t+=v[y];} }); return n?Math.round(t/n):0; }
function trend(s){ var a=s.scores[2024],b=s.scores[2025]; if(!a||!b)return 0; return b-a; }
function normalizeProvince(p){
  if(!p) return null;
  if(PROVINCE_ADCODE[p]) return p;
  if(PROVINCE_ALIAS[p]) return PROVINCE_ALIAS[p];
  // 去掉"省/市/自治区"等后缀做模糊匹配
  for(var k in PROVINCE_ADCODE){ if(k.indexOf(p)>=0||p.indexOf(k)>=0) return k; }
  for(var a in PROVINCE_ALIAS){ if(p.indexOf(a)>=0) return PROVINCE_ALIAS[a]; }
  return p;
}
function provinceAdcode(p){ var n=normalizeProvince(p); return PROVINCE_ADCODE[n]; }
function typeColor(t){
  return {'985':'#7C3AED','211':'#1E4FD8','双一流':'#00C2FF','普通本科':'#18B884'}[t]||'#3B82F6';
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* 图片 URL：trae text_to_image 服务，失败回退由 onerror 处理 */
var IMG_SIZE='landscape_4_3';
function imageUrl(prompt){ return 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt='+encodeURIComponent(prompt+' 中国大学校园 高清摄影')+'&image_size='+IMG_SIZE; }

/* ---------- 数据加载（内置 + localStorage） ---------- */
function loadSchools(){
  var custom = [];
  try{ var raw = localStorage.getItem(LS_KEY); if(raw) custom = JSON.parse(raw) || []; }catch(e){ custom = []; }
  // 标记 custom
  custom.forEach(function(s){ s.custom = true; });
  state.schools = BUILTIN.concat(custom);
}
function saveCustom(arr){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; }catch(e){ return false; }
}
function getCustom(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){ return []; } }
function addCustom(school){
  var arr = getCustom();
  arr.push(school);
  return saveCustom(arr);
}

/* ---------- 筛选 ---------- */
function filteredSchools(){
  var f = state.filters;
  var list = state.schools.filter(function(s){
    var sc = latestScore(s);
    if(sc < f.min || sc > f.max) return false;
    if(!f.types[s.type]) return false;
    if(!f.own[s.ownership]) return false;
    if(f.search){
      var q = f.search.toLowerCase();
      if((s.name||'').toLowerCase().indexOf(q)<0 && (s.city||'').toLowerCase().indexOf(q)<0 && (s.province||'').toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    var d = latestScore(b)-latestScore(a);
    return f.sort==='desc' ? d : -d;
  });
  return list;
}

/* 当前区域应显示的学校（基于地图区域，不影响列表筛选，但坐标点只显示区域内的） */
function schoolsInRegion(){
  var r = state.region;
  if(r.level==='country') return state.schools;
  if(r.level==='province') return state.schools.filter(function(s){ return normalizeProvince(s.province)===r.province; });
  if(r.level==='city') return state.schools.filter(function(s){ return s.city===r.city; });
  return state.schools;
}

/* ---------- 省均分聚合 ---------- */
function provinceAvgData(){
  var map = {};
  state.schools.forEach(function(s){
    var p = normalizeProvince(s.province);
    if(!p) return;
    if(!map[p]) map[p] = { sum:0, n:0 };
    var sc = latestScore(s);
    if(sc){ map[p].sum += sc; map[p].n++; }
  });
  var arr = [];
  for(var p in map){
    var v = map[p].n ? Math.round(map[p].sum/map[p].n) : 0;
    arr.push({ name:p, value:v });
  }
  return arr;
}

/* ---------- GeoJSON 加载 ---------- */
function loadGeo(adcode){
  var url = 'https://geo.datav.aliyun.com/areas_v3/bound/'+adcode+'_full.json';
  if(state.geoCache[adcode]) return Promise.resolve(state.geoCache[adcode]);
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error('geo http '+r.status);
    return r.json();
  }).then(function(geo){
    state.geoCache[adcode] = geo;
    return geo;
  });
}

/* ---------- 地图渲染 ---------- */
function buildMapOption(){
  var mapName = state.region.mapName;
  var provAvg = provinceAvgData();
  var values = provAvg.map(function(d){return d.value;}).filter(function(v){return v>0;});
  var vMin = values.length ? Math.min.apply(null,values) : 400;
  var vMax = values.length ? Math.max.apply(null,values) : 700;
  // 同步图例
  $('legendMin').textContent = vMin;
  $('legendMax').textContent = vMax;

  // 坐标点：当前区域内 + 符合筛选（地图上显示筛选后的点）
  var regionSchools = schoolsInRegion();
  var f = state.filters;
  var scatterData = [];
  var filtered = filteredSchools();
  var filteredIds = {}; filtered.forEach(function(s){ filteredIds[s.id]=true; });
  regionSchools.forEach(function(s){
    if(!filteredIds[s.id]) return;
    if(!s.lng||!s.lat) return;
    scatterData.push({
      name: s.name,
      value: [s.lng, s.lat, latestScore(s)],
      schoolId: s.id
    });
  });

  var selectedId = state.selectedId;
  var option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor:'rgba(15,27,61,.88)', borderColor:'transparent',
      textStyle:{ color:'#fff', fontSize:12 },
      padding:[8,12], borderRadius:8,
      formatter: function(p){
        if(p.seriesType==='effectScatter'||p.seriesType==='scatter'){
          var s = findSchool(p.data.schoolId);
          if(!s) return p.name;
          var sc = latestScore(s);
          var t = trend(s);
          var tStr = t>0?('▲'+t):t<0?('▼'+(-t)):'持平';
          var tColor = t>=0?'#18B884':'#FF7A45';
          return '<div style="font-weight:700;font-size:13px;margin-bottom:4px">'+escapeHTML(s.name)+'</div>'+
            '<div style="color:#9FB6E6;font-size:11px">'+escapeHTML(s.city)+' · '+escapeHTML(s.type)+'</div>'+
            '<div style="margin-top:6px;font-family:JetBrains Mono"><span style="font-size:18px;font-weight:700;color:#00C2FF">'+sc+'</span> <span style="color:'+tColor+';font-size:11px">'+tStr+'</span></div>'+
            '<div style="color:#94A3B8;font-size:10px;margin-top:4px">点击查看详情</div>';
        }
        if(p.seriesType==='map'||p.componentSubType==='map'){
          var v = p.value;
          return '<div style="font-weight:700;font-size:13px">'+escapeHTML(p.name)+'</div>'+
            '<div style="color:#9FB6E6;font-size:11px;margin-top:3px">高校均分：<b style="color:#00C2FF;font-family:JetBrains Mono">'+(v||'—')+'</b></div>'+
            '<div style="color:#94A3B8;font-size:10px;margin-top:3px">点击进入该省</div>';
        }
        return p.name;
      }
    },
    geo: {
      map: mapName,
      roam: true,
      scaleLimit: { min:0.9, max:8 },
      zoom: 1.15,
      itemStyle: {
        areaColor: '#EAF2FF',
        borderColor: '#B7CCEA',
        borderWidth: 0.8
      },
      emphasis: {
        itemStyle: { areaColor:'#CDDDF7', borderColor:'#3B82F6', borderWidth:1.2 },
        label: { show:true, color:'#1E4FD8', fontWeight:600, fontSize:11 }
      },
      select: { disabled:true }
    },
    visualMap: {
      type: 'continuous', seriesIndex: 0, min: vMin, max: vMax,
      calculable: true,
      inRange: { color: ['#EAF2FF','#A9C4EE','#5F8DD9','#1E4FD8','#0B2A7A'] },
      textStyle: { color:'#5B6B8C', fontSize:10 },
      left: 14, bottom: 60,
      show: false  // 用自定义图例
    },
    series: [
      {
        name:'省均分', type:'map', geoIndex:0, map: mapName,
        data: provAvg
      },
      {
        name:'高校坐标', type:'effectScatter', coordinateSystem:'geo',
        data: scatterData,
        symbolSize: function(val){ return Math.max(7, Math.min(16, (val[2]-400)/22)); },
        rippleEffect: { brushType:'stroke', scale:3.2, period:3 },
        showEffectOn:'render',
        itemStyle: {
          color: function(p){ var s=findSchool(p.data.schoolId); return s?typeColor(s.type):'#00C2FF'; },
          shadowBlur: 10, shadowColor: 'rgba(0,194,255,.55)'
        },
        emphasis: {
          scale: 1.6,
          itemStyle:{ borderColor:'#fff', borderWidth:2, shadowBlur:18 }
        },
        selectedMode:'single',
        selectedItemStyle:{ borderColor:'#FF7A45', borderWidth:3 },
        label: { show:false },
        zlevel: 2
      }
    ]
  };
  return option;
}

function findSchool(id){ for(var i=0;i<state.schools.length;i++){ if(state.schools[i].id===id) return state.schools[i]; } return null; }

function renderMap(){
  var opt = buildMapOption();
  chart.setOption(opt, true);
  // 若有选中学校，定位
  if(state.selectedId){
    var s = findSchool(state.selectedId);
    if(s && s.lng && s.lat){
      try{
        chart.setOption({ geo:{ center:[s.lng, s.lat], zoom: 3 } });
      }catch(e){}
    }
  }
}

/* 初始化中国地图 */

/* ---------- 区域下钻 / 面包屑 ---------- */
function updateBreadcrumb(){
  var r = state.region;
  var bc = $('breadcrumb'); bc.innerHTML = '';
  var c1 = el('span','crumb'+(r.level==='country'?' current':''),'全国');
  c1.onclick = function(){ goCountry(); };
  bc.appendChild(c1);
  if(r.province){
    bc.appendChild(el('span','crumb-sep','›'));
    var c2 = el('span','crumb'+(r.level==='province'?' current':''), shortProvince(r.province));
    c2.onclick = function(){ goProvince(r.province); };
    bc.appendChild(c2);
  }
  if(r.city){
    bc.appendChild(el('span','crumb-sep','›'));
    bc.appendChild(el('span','crumb current', r.city));
  }
}
function shortProvince(p){ return p.replace(/(省|市|自治区|维吾尔自治区|壮族自治区|回族自治区|特别行政区)/,''); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

function goCountry(){
  state.region = { level:'country', province:null, city:null, mapName:'china' };
  state.selectedId = null;
  updateRegionTabs(); updateBreadcrumb(); renderMap(); renderList(); renderDetail();
}
function goProvince(prov){
  prov = normalizeProvince(prov);
  var adcode = provinceAdcode(prov);
  if(!adcode){ toast('未能识别该省份','err'); return; }
  var mapName = 'prov_'+adcode;
  loadGeo(adcode).then(function(geo){
    echarts.registerMap(mapName, geo);
    state.region = { level:'province', province:prov, city:null, mapName:mapName };
    state.selectedId = null;
    updateRegionTabs(); updateBreadcrumb(); renderMap(); renderList(); renderDetail();
  }).catch(function(e){
    toast('该省地图加载失败','err'); console.error(e);
  });
}
function goCity(city, prov){
  // 通过省份 adcode 查找城市 adcode（从已加载 geo 中匹配）
  var padcode = provinceAdcode(prov);
  if(!padcode){ goProvince(prov); return; }
  loadGeo(padcode).then(function(geo){
    var cityAd = null;
    (geo.features||[]).forEach(function(f){
      var n = f.properties && (f.properties.name||f.properties.NAME);
      if(n && (n===city || n.indexOf(city)>=0 || city.indexOf(n)>=0)){
        cityAd = f.properties.adcode;
      }
    });
    if(!cityAd){ state.region={level:'province',province:normalizeProvince(prov),city:city,mapName:'prov_'+padcode}; updateRegionTabs(); updateBreadcrumb(); renderMap(); return; }
    var mapName = 'city_'+cityAd;
    loadGeo(cityAd).then(function(cgeo){
      echarts.registerMap(mapName, cgeo);
      state.region = { level:'city', province:normalizeProvince(prov), city:city, mapName:mapName };
      state.selectedId = null;
      updateRegionTabs(); updateBreadcrumb(); renderMap(); renderList(); renderDetail();
    }).catch(function(){
      // 市级 geo 失败，回退省级但聚焦该市
      state.region={level:'province',province:normalizeProvince(prov),city:city,mapName:'prov_'+padcode};
      updateRegionTabs(); updateBreadcrumb(); renderMap();
    });
  });
}
function updateRegionTabs(){
  var r = state.region;
  document.querySelectorAll('.region-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.level===r.level);
  });
  // 省级以下才显示省份选择器
}

/* ---------- 列表渲染 ---------- */
function renderList(){
  var list = filteredSchools();
  // 区域内优先（在省份/市视图下，列表仍可显示全国结果，但区域内的排前）
  var c = $('schoolList');
  c.innerHTML = '';
  $('listCount').textContent = list.length+' 所';
  if(!list.length){
    c.innerHTML = '<div style="padding:24px 8px;text-align:center;color:var(--c-ink-3);font-size:12px">没有符合筛选条件的学校<br>试试调整分数区间或类型</div>';
    return;
  }
  list.slice(0,200).forEach(function(s,i){
    var card = document.createElement('div');
    card.className = 'school-card'+(state.selectedId===s.id?' active':'')+(s.custom?' custom-flag':'');
    card.style.setProperty('--bar-color', typeColor(s.type));
    card.style.animationDelay = (Math.min(i,30)*0.02)+'s';
    var sc = latestScore(s);
    var t = trend(s);
    var tStr = t>0?('▲'+t):(t<0?('▼'+(-t)):'—');
    var tCls = t>0?'':(t<0?' down':'');
    var badge = typeBadge(s.type) + (s.ownership==='民办'?' <span class="badge badge-private">民办</span>':' <span class="badge badge-public">公办</span>');
    card.innerHTML =
      '<div class="sc-head">'+
        '<div class="sc-name">'+escapeHTML(s.name)+(s.custom?'<span class="custom-mark">自定义</span>':'')+'</div>'+
        '<div class="sc-score">'+sc+'<span class="unit">分</span></div>'+
      '</div>'+
      '<div class="sc-meta">'+
        '<span class="badge '+badgeClass(s.type)+'">'+s.type+'</span>'+
        badge+
        '<span class="sc-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2"/></svg>'+escapeHTML(shortProvince(s.province))+' · '+escapeHTML(s.city)+'</span>'+
      '</div>'+
      '<div class="sc-trend'+tCls+'">'+(t>=0?'↑':'↓')+' 同比 '+tStr+'</div>';
    card.onclick = function(){ selectSchool(s.id, true); };
    c.appendChild(card);
  });
}
function typeBadge(t){ return ''; }
function badgeClass(t){ return {'985':'badge-985','211':'badge-211','双一流':'badge-double','普通本科':'badge-normal'}[t]||'badge-211'; }

/* ---------- 选中学校：联动地图 + 详情 ---------- */
function selectSchool(id, focusMap){
  state.selectedId = id;
  var s = findSchool(id);
  if(!s) return;
  renderList();   // 高亮
  renderDetail();
  if(focusMap && s.lng && s.lat){
    // 定位地图：若学校不在当前区域，先切到其所在省
    var inRegion = (state.region.level==='country') ||
      (state.region.level==='province' && normalizeProvince(s.province)===state.region.province) ||
      (state.region.level==='city' && s.city===state.region.city);
    if(!inRegion){
      goProvince(s.province);
      setTimeout(function(){ focusMapOn(s); }, 600);
    } else {
      focusMapOn(s);
    }
  }
  // 移动端打开右侧抽屉
  if(window.innerWidth <= 1023){ $('rightDetail').classList.add('open'); }
}
function focusMapOn(s){
  try{
    chart.setOption({ geo:{ center:[s.lng, s.lat], zoom: Math.max(3, chart.getOption().geo[0].zoom||3) } }, false);
    chart.dispatchAction({ type:'highlight', seriesIndex:1, name:s.name });
  }catch(e){}
}

function renderScoreChart(s){

    }]
  });
}

/* ---------- 统计卡 ---------- */
function updateStats(){
  $('statTotal').textContent = state.schools.length;
  var list = filteredSchools();
  $('statShown').textContent = list.length;
  if(list.length){
    var sum=0; list.forEach(function(s){ sum+=latestScore(s); });
    $('statAvg').textContent = Math.round(sum/list.length);
  } else { $('statAvg').textContent='—'; }
}

/* ---------- 统一刷新 ---------- */
function refreshAll(){
  renderMap(); renderList(); updateStats();
}

/* ---------- Toast ---------- */
function toast(msg, type){
  var wrap = $('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast '+(type||'success');
  var icon = type==='err'?
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>';
  t.innerHTML = icon + '<span>'+escapeHTML(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); }, 320); }, 2600);
}

/* ---------- 双滑块 ---------- */
function updateRangeFill(){
  var mn = +$('rangeMin').value, mx = +$('rangeMax').value;
  if(mn>mx){ var tmp=mn;mn=mx;mx=tmp; }
  var min=400,max=700;
  var lp = (mn-min)/(max-min)*100, rp = (mx-min)/(max-min)*100;
  $('rangeFill').style.left = lp+'%';
  $('rangeFill').style.width = (rp-lp)+'%';
  $('rangeVal').textContent = mn+' – '+mx;
  state.filters.min = mn; state.filters.max = mx;
}
function initRange(){
  var rMin = $('rangeMin'), rMax = $('rangeMax');
  function handler(){
    var a=+rMin.value, b=+rMax.value;
    if(a>b){ if(this===rMin) rMax.value=a; else rMin.value=b; }
    updateRangeFill(); refreshAll();
    clearPresetActive();
  }
  rMin.addEventListener('input', handler);
  rMax.addEventListener('input', handler);
  updateRangeFill();
}
function clearPresetActive(){
  document.querySelectorAll('.preset-chip').forEach(function(c){c.classList.remove('active');});
}

/* ---------- 预设 ---------- */
function initPresets(){
  document.querySelectorAll('.preset-chip').forEach(function(chip){
    chip.onclick = function(){
      var mn=+chip.dataset.min, mx=+chip.dataset.max;
      $('rangeMin').value=mn; $('rangeMax').value=mx;
      updateRangeFill(); refreshAll();
      document.querySelectorAll('.preset-chip').forEach(function(c){c.classList.remove('active');});
      chip.classList.add('active');
    };
  });
}

/* ---------- 类型 / 性质 / 排序 ---------- */
function initTypeFilters(){
  document.querySelectorAll('.type-tag').forEach(function(t){
    t.onclick = function(){
      t.classList.toggle('active');
      state.filters.types[t.dataset.type] = t.classList.contains('active');
      refreshAll();
    };
  });
  document.querySelectorAll('.own-btn').forEach(function(b){
    b.onclick = function(){
      b.classList.toggle('active');
      state.filters.own[b.dataset.own] = b.classList.contains('active');
      refreshAll();
    };
  });
  document.querySelectorAll('.sort-btn').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.sort-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      state.filters.sort = b.dataset.sort;
      renderList();
    };
  });
}

/* ---------- 搜索 ---------- */
function initSearch(){
  var inp = $('searchInput'), wrap = $('navSearch');
  var timer = null;
  inp.addEventListener('input', function(){
    wrap.classList.toggle('has-val', !!inp.value);
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.filters.search = inp.value.trim();
      refreshAll();
    }, 180);
  });
  $('searchClear').onclick = function(){
    inp.value=''; wrap.classList.remove('has-val'); state.filters.search=''; refreshAll(); inp.focus();
  };
}

/* ---------- 区域 Tabs ---------- */
function initRegionTabs(){
  document.querySelectorAll('.region-tab').forEach(function(t){
    t.onclick = function(){
      var lvl = t.dataset.level;
      if(lvl==='country'){ goCountry(); }
      else if(lvl==='province'){
        // 弹出省份选择：通过点击地图或列表城市进入；这里给出快捷：聚焦广东
        toast('请在地图上点击省份，或点击列表卡片自动跳转','info');
      } else if(lvl==='city'){
        toast('进入省份后点击城市区域可下钻到市级','info');
      }
    };
  });
}

/* ---------- 折叠侧栏 ---------- */
function initCollapse(){
  $('collapseLeft').onclick = function(){ $('workspace').classList.add('left-collapsed'); setTimeout(function(){ chart&&chart.resize(); }, 320); };
  $('restoreLeft').onclick = function(){ $('workspace').classList.remove('left-collapsed'); setTimeout(function(){ chart&&chart.resize(); }, 320); };
}

/* ---------- 地图点击 ---------- */
function initMapEvents(){
  chart.on('click', function(p){
    if(p.seriesType==='effectScatter' || p.seriesType==='scatter'){
      if(p.data && p.data.schoolId){ selectSchool(p.data.schoolId, false); }
    } else if(p.componentSubType==='map' || p.seriesType==='map'){
      // 点击省份/城市区域
      var name = p.name;
      if(!name) return;
      if(state.region.level==='country'){
        // 进入省份
        var prov = normalizeProvince(name);
        if(prov) goProvince(prov);
      } else if(state.region.level==='province'){
        // 进入城市
        goCity(name, state.region.province);
      }
    }
  });
}

/* ---------- 添加学校弹窗 ---------- */
function initAddModal(){
  $('addSchoolBtn').onclick = openAddModal;
  $('modalClose').onclick = closeAddModal;
  $('modalCancel').onclick = closeAddModal;
  $('modalSave').onclick = saveAddModal;
  $('majorAdd').onclick = addMajorRow;
  document.querySelectorAll('#majorsEditor .major-del').forEach(function(b){ b.onclick=function(){ b.closest('.major-row').remove(); }; });
  $('modalSave');
  // 回车提交
  $('addModal').addEventListener('click', function(e){ if(e.target===$('addModal')) closeAddModal(); });
}
function openAddModal(){
  $('fName').value=''; $('fProvince').value=''; $('fCity').value=''; $('fDistrict').value='';
  $('fLng').value=''; $('fLat').value=''; $('fS2023').value=''; $('fS2024').value=''; $('fS2025').value=''; $('fRank').value='';
  $('fType').value='普通本科'; $('fOwn').value='公办';
  // 重置专业行
  var me = $('majorsEditor'); me.innerHTML='';
  addMajorRow();
  clearErrors();
  $('addModal').classList.add('show');
  setTimeout(function(){ $('fName').focus(); }, 100);
}
function closeAddModal(){ $('addModal').classList.remove('show'); }
function addMajorRow(){
  var row = document.createElement('div');
  row.className = 'major-row';
  row.innerHTML = '<input type="text" class="m-name" placeholder="专业名称"/><input type="text" class="m-code" placeholder="代码"/><input type="number" class="m-score" placeholder="分数"/><button class="major-del" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>';
  row.querySelector('.major-del').onclick = function(){ row.remove(); };
  $('majorsEditor').appendChild(row);
}
function clearErrors(){ document.querySelectorAll('.form-row.invalid').forEach(function(r){ r.classList.remove('invalid'); }); }
function markErr(id){ $(id).closest('.form-row').classList.add('invalid'); }
function saveAddModal(){
  clearErrors();
  var ok = true;
  var name = $('fName').value.trim();
  var province = $('fProvince').value.trim();
  var city = $('fCity').value.trim();
  var lng = parseFloat($('fLng').value);
  var lat = parseFloat($('fLat').value);
  if(!name){ markErr('fName'); ok=false; }
  if(!province){ markErr('fProvince'); ok=false; }
  if(!city){ markErr('fCity'); ok=false; }
  if(isNaN(lng)){ markErr('fLng'); ok=false; }
  if(isNaN(lat)){ markErr('fLat'); ok=false; }
  if(!ok){ toast('请补全必填项','err'); return; }
  var scores = {};
  if($('fS2023').value) scores[2023] = +$('fS2023').value;
  if($('fS2024').value) scores[2024] = +$('fS2024').value;
  if($('fS2025').value) scores[2025] = +$('fS2025').value;
  var majors = [];
  document.querySelectorAll('#majorsEditor .major-row').forEach(function(r){
    var mn = r.querySelector('.m-name').value.trim();
    if(mn) majors.push({ name:mn, code:r.querySelector('.m-code').value.trim(), score:+r.querySelector('.m-score').value||0, desc:'' });
  });
  var school = {
    id: 'c_'+Date.now(),
    name: name, type: $('fType').value, ownership: $('fOwn').value,
    province: normalizeProvince(province)||province, city: city, district: $('fDistrict').value.trim(),
    lng: lng, lat: lat, rank: $('fRank').value?+$('fRank').value:0,
    scores: scores, majors: majors,
    images: { campus:[name+'校园风光'], dorm:[name+'学生宿舍'], other:[name+'图书馆'] },
    custom: true
  };
  if(addCustom(school)){
    loadSchools();
    closeAddModal();
    refreshAll();
    toast('已保存「'+name+'」到本地');
    // 自动选中新学校
    setTimeout(function(){ selectSchool(school.id, true); }, 200);
  } else {
    toast('保存失败，可能是浏览器禁用了本地存储','err');
  }
}

/* ---------- 坐标点选 ---------- */
var pickChart = null;
function initCoordPicker(){
  $('pickCoordBtn').onclick = function(){
    $('pickOverlay').classList.add('show');
    $('pickCoordBtn').classList.add('picking');
    setTimeout(initPickChart, 60);
  };
}
function initPickChart(){
  if(!pickChart){
    pickChart = echarts.init($('pickChart'));
    pickChart.on('click', function(p){
      if(p.event && p.event.offsetX!=null){
        // geo 坐标转换
        var pt = pickChart.convertFromPixel('geo', [p.event.offsetX, p.event.offsetY]);
        if(pt && pt.length===2 && !isNaN(pt[0]) && !isNaN(pt[1])){
          $('fLng').value = pt[0].toFixed(4);
          $('fLat').value = pt[1].toFixed(4);
          toast('已选取坐标：'+pt[0].toFixed(3)+', '+pt[1].toFixed(3),'info');
          closePick();
        }
      }
    });
  }
  if(state.geoCache[100000]){
    echarts.registerMap('china_pick', state.geoCache[100000]);
    pickChart.setOption({
      backgroundColor:'transparent',
      geo:{ map:'china_pick', roam:true, zoom:1.1,
        itemStyle:{ areaColor:'#EAF2FF', borderColor:'#B7CCEA' },
        emphasis:{ itemStyle:{ areaColor:'#CDDDF7' }, label:{ show:true, color:'#1E4FD8', fontSize:10 } }
      },
      tooltip:{ formatter:'<div style="font-size:12px">点击此处选取坐标</div>', backgroundColor:'rgba(15,27,61,.85)', borderColor:'transparent', textStyle:{color:'#fff'} }
    });
    pickChart.resize();
  } else {
    loadGeo(100000).then(function(geo){
      echarts.registerMap('china_pick', geo);
      initPickChart();
    });
  }
}
function closePick(){
  $('pickOverlay').classList.remove('show');
  $('pickCoordBtn').classList.remove('picking');
}

/* ---------- 初始化 ---------- */
function init(){
  loadSchools();
  chart = echarts.init($('chart'));
  initRange();
  initPresets();
  initTypeFilters();
  initSearch();
  initRegionTabs();
  initCollapse();
  initMapEvents();
  initAddModal();
  initCoordPicker();

  // 响应式
  window.addEventListener('resize', function(){
    if(chart) chart.resize();
    if(pickChart) pickChart.resize();
  });

  // ESC 关闭弹窗
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if($('addModal').classList.contains('show')) closeAddModal();
      if($('pickOverlay').classList.contains('show')) closePick();
    }
  });

  // 面包屑初始
  updateBreadcrumb();
  updateRegionTabs();

  // 加载地图（隐藏 loading 在成功后）
  initChinaMap();
  // 首次渲染列表与统计（即使地图尚未加载）
  renderList(); updateStats();

  // 欢迎提示
  setTimeout(function(){ toast('已加载 '+state.schools.length+' 所高校，可筛选或点击地图探索'); }, 800);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else { init(); }

})();
</script>
</body>
</html>
