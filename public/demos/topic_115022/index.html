<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>双色球推荐助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>双色球推荐助手</h1>
      <p>历史数据分析 / 智能推荐 / 个性化选号</p>
    </header>

    <nav>
      <ul>
        <li><a href="#" class="nav-link active" data-section="history"><span class="nav-icon">📋</span><span class="nav-text">历史开奖</span></a></li>
        <li><a href="#" class="nav-link" data-section="analysis"><span class="nav-icon">📊</span><span class="nav-text">数据分析</span></a></li>
        <li><a href="#" class="nav-link" data-section="recommend"><span class="nav-icon">🎯</span><span class="nav-text">智能推荐</span></a></li>
        <li><a href="#" class="nav-link" data-section="favorites"><span class="nav-icon">⭐</span><span class="nav-text">我的收藏</span></a></li>
      </ul>
    </nav>

    <!-- 历史开奖记录 -->
    <div id="history-section" class="section active">
      <h2>历史开奖记录</h2>
      <div class="form-row form-row-inline">
        <div class="form-group">
          <button class="btn btn-primary" onclick="loadHistoryData()">刷新数据</button>
          <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
        </div>
      </div>
      <div id="history-alert"></div>
      <div id="history-content">
        <div class="loading">
          <div class="spinner"></div>
          <p>正在加载数据...</p>
        </div>
      </div>
      <div class="history-card-list" id="history-card-list"></div>
      <div class="pagination" id="history-pagination"></div>
    </div>

    <!-- 数据分析 -->
    <div id="analysis-section" class="section">
      <h2>历史数据分析</h2>
      <div class="form-row">
        <div class="form-group">
          <label>分析期数</label>
          <select id="analysis-period">
            <option value="30">最近30期</option>
            <option value="50">最近50期</option>
            <option value="100" selected>最近100期</option>
            <option value="200">最近200期</option>
          </select>
        </div>
        <div class="form-group">
          <label>分析维度</label>
          <select id="analysis-dimension">
            <option value="all">综合分析</option>
            <option value="oddEven">奇偶比</option>
            <option value="threeZone">三区分布</option>
            <option value="sumTrend">和值趋势</option>
            <option value="hotCold">冷热号</option>
            <option value="size">大小比</option>
            <option value="consecutive">连号分析</option>
          </select>
        </div>
        <div class="form-group" style="display: flex; align-items: flex-end;">
          <button class="btn btn-primary btn-full" onclick="runAnalysis()">开始分析</button>
        </div>
      </div>
      <div id="analysis-content"></div>
    </div>

    <!-- 智能推荐 -->
    <div id="recommend-section" class="section">
      <h2>个性化推荐</h2>
      <div class="info-panel">
        <h4>推荐说明</h4>
        <ul>
          <li>根据历史数据规律生成投注方案</li>
          <li>自动过滤历史已开出过二等奖及以上的组合</li>
          <li>支持多维度条件筛选，提高推荐精准度</li>
        </ul>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>参考近期期数</label>
          <select id="recommend-period">
            <option value="30">最近30期</option>
            <option value="50" selected>最近50期</option>
            <option value="100">最近100期</option>
          </select>
        </div>
        <div class="form-group">
          <label>推荐注数</label>
          <input type="number" id="recommend-count" value="5" min="1" max="50">
        </div>
      </div>
      <div class="form-group">
        <label>分析维度（可多选）</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" value="hotCold" checked> 冷热号比例</label>
          <label class="checkbox-item"><input type="checkbox" value="sumRange" checked> 总和区间</label>
          <label class="checkbox-item"><input type="checkbox" value="oddEven" checked> 奇偶比</label>
          <label class="checkbox-item"><input type="checkbox" value="threeZone"> 三区分布</label>
          <label class="checkbox-item"><input type="checkbox" value="sizeRatio"> 大小比</label>
        </div>
      </div>
      <div class="form-row form-row-inline">
        <div class="form-group" style="flex: 0 0 auto;">
          <button class="btn btn-primary btn-full" onclick="generateRecommendations()">生成推荐</button>
        </div>
      </div>
      <div id="recommend-content"></div>
    </div>

    <!-- 我的收藏 -->
    <div id="favorites-section" class="section">
      <h2>我的收藏</h2>
      <div id="favorites-content">
        <div class="empty-state">
          <div class="empty-state-icon">⭐</div>
          <p>暂无收藏记录</p>
          <p style="font-size: 14px; margin-top: 10px;">在智能推荐页面点击收藏按钮保存喜欢的方案</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== 数据管理 ====================
    const API_BASE = 'https://api.huiniao.top/interface/home/lotteryHistory';
    const STORAGE_KEY = 'ssq_history_data';
    const FAVORITES_KEY = 'ssq_favorites';
    let historyData = [];
    let currentPage = 1;
    const pageSize = 20;

    // 初始化数据
    async function initData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        historyData = JSON.parse(stored);
        renderHistoryTable();
      } else {
        await loadHistoryData();
      }
    }

    // 加载历史数据
    async function loadHistoryData() {
      const contentDiv = document.getElementById('history-content');
      contentDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在加载数据...</p></div>';

      try {
        const allData = [];
        for (let page = 1; page <= 5; page++) {
          const response = await fetch(`${API_BASE}?type=ssq&page=${page}&limit=100`);
          const result = await response.json();
          if (result.code === 1 && result.data && result.data.data && result.data.data.list) {
            allData.push(...result.data.data.list);
          }
          await new Promise(r => setTimeout(r, 300));
        }

        historyData = allData.map(item => ({
          code: item.code,
          day: item.day,
          redBalls: [item.one, item.two, item.three, item.four, item.five, item.six].map(Number).sort((a, b) => a - b),
          blueBall: Number(item.seven),
          openTime: item.open_time
        }));

        localStorage.setItem(STORAGE_KEY, JSON.stringify(historyData));
        showAlert('history-alert', '数据加载成功，共 ' + historyData.length + ' 条记录', 'info');
        currentPage = 1;
        renderHistoryTable();
      } catch (error) {
        console.error('加载数据失败:', error);
        showAlert('history-alert', '数据加载失败，使用本地缓存数据', 'warning');
        if (historyData.length === 0) {
          contentDiv.innerHTML = '<div class="alert alert-error">数据加载失败，请检查网络连接后重试</div>';
        }
      }
    }

    // 导出数据
    function exportData() {
      const dataStr = JSON.stringify(historyData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ssq_history_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ==================== 历史记录渲染 ====================
    function renderHistoryTable() {
      const contentDiv = document.getElementById('history-content');
      const cardListDiv = document.getElementById('history-card-list');
      const totalPages = Math.ceil(historyData.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = historyData.slice(start, end);

      // 桌面端表格
      let html = '<table class="data-table"><thead><tr>';
      html += '<th>期号</th><th>开奖日期</th><th>红球</th><th>蓝球</th>';
      html += '</tr></thead><tbody>';

      pageData.forEach(item => {
        html += `<tr>
          <td>${item.code}</td>
          <td>${item.day}</td>
          <td class="balls-cell">${item.redBalls.map(n => `<span class="ball ball-red">${String(n).padStart(2, '0')}</span>`).join('')}</td>
          <td><span class="ball ball-blue">${String(item.blueBall).padStart(2, '0')}</span></td>
        </tr>`;
      });

      html += '</tbody></table>';
      contentDiv.innerHTML = html;

      // 移动端卡片列表
      let cardHtml = '';
      pageData.forEach(item => {
        cardHtml += `<div class="history-card-item">
          <div class="history-card-header">
            <span class="history-card-code">第${item.code}期</span>
            <span class="history-card-date">${item.day}</span>
          </div>
          <div class="history-card-balls">
            ${item.redBalls.map(n => `<span class="ball ball-red">${String(n).padStart(2, '0')}</span>`).join('')}
            <span class="ball ball-blue">${String(item.blueBall).padStart(2, '0')}</span>
          </div>
        </div>`;
      });
      cardListDiv.innerHTML = cardHtml;

      // 分页
      const paginationDiv = document.getElementById('history-pagination');
      paginationDiv.innerHTML = `
        <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
        <span class="page-info">第 ${currentPage} / ${totalPages} 页 (共 ${historyData.length} 条)</span>
        <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
      `;
    }

    function changePage(page) {
      const totalPages = Math.ceil(historyData.length / pageSize);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderHistoryTable();
    }

    // ==================== 数据分析 ====================
    function runAnalysis() {
      const period = parseInt(document.getElementById('analysis-period').value);
      const dimension = document.getElementById('analysis-dimension').value;
      const data = historyData.slice(0, period);

      if (data.length === 0) {
        document.getElementById('analysis-content').innerHTML = '<div class="alert alert-warning">暂无数据，请先加载历史数据</div>';
        return;
      }

      let html = '<div class="analysis-charts">';

      if (dimension === 'all' || dimension === 'oddEven') {
        html += renderOddEvenAnalysis(data);
      }
      if (dimension === 'all' || dimension === 'threeZone') {
        html += renderThreeZoneAnalysis(data);
      }
      if (dimension === 'all' || dimension === 'sumTrend') {
        html += renderSumTrendAnalysis(data);
      }
      if (dimension === 'all' || dimension === 'hotCold') {
        html += renderHotColdAnalysis(data);
      }
      if (dimension === 'all' || dimension === 'size') {
        html += renderSizeAnalysis(data);
      }
      if (dimension === 'all' || dimension === 'consecutive') {
        html += renderConsecutiveAnalysis(data);
      }

      html += '</div>';
      document.getElementById('analysis-content').innerHTML = html;
    }

    // 奇偶比分析
    function renderOddEvenAnalysis(data) {
      const stats = {};
      data.forEach(item => {
        const odd = item.redBalls.filter(n => n % 2 === 1).length;
        const even = 6 - odd;
        const key = `${odd}:${even}`;
        stats[key] = (stats[key] || 0) + 1;
      });

      let html = '<div class="analysis-chart"><h4>奇偶比分布</h4>';
      html += '<div class="bar-chart">';
      const maxVal = Math.max(...Object.values(stats));
      Object.entries(stats).sort((a, b) => b[1] - a[1]).forEach(([key, val]) => {
        const height = (val / maxVal * 150) + 'px';
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${key}</div>
        </div>`;
      });
      html += '</div></div>';
      return html;
    }

    // 三区分布分析
    function renderThreeZoneAnalysis(data) {
      const stats = {};
      data.forEach(item => {
        const z1 = item.redBalls.filter(n => n >= 1 && n <= 11).length;
        const z2 = item.redBalls.filter(n => n >= 12 && n <= 22).length;
        const z3 = item.redBalls.filter(n => n >= 23 && n <= 33).length;
        const key = `${z1}:${z2}:${z3}`;
        stats[key] = (stats[key] || 0) + 1;
      });

      let html = '<div class="analysis-chart"><h4>三区分布 (1-11 : 12-22 : 23-33)</h4>';
      html += '<div class="bar-chart">';
      const maxVal = Math.max(...Object.values(stats));
      Object.entries(stats).sort((a, b) => b[1] - a[1]).slice(0, 15).forEach(([key, val]) => {
        const height = (val / maxVal * 150) + 'px';
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${key}</div>
        </div>`;
      });
      html += '</div></div>';
      return html;
    }

    // 和值趋势分析
    function renderSumTrendAnalysis(data) {
      const sums = data.map(item => ({
        code: item.code,
        sum: item.redBalls.reduce((a, b) => a + b, 0)
      })).reverse();

      const ranges = { '0-60': 0, '61-80': 0, '81-100': 0, '101-120': 0, '121-140': 0, '141-160': 0, '161+': 0 };
      sums.forEach(s => {
        if (s.sum <= 60) ranges['0-60']++;
        else if (s.sum <= 80) ranges['61-80']++;
        else if (s.sum <= 100) ranges['81-100']++;
        else if (s.sum <= 120) ranges['101-120']++;
        else if (s.sum <= 140) ranges['121-140']++;
        else if (s.sum <= 160) ranges['141-160']++;
        else ranges['161+']++;
      });

      let html = '<div class="analysis-chart"><h4>和值区间分布</h4>';
      html += '<div class="bar-chart">';
      const maxVal = Math.max(...Object.values(ranges));
      Object.entries(ranges).forEach(([key, val]) => {
        const height = (val / maxVal * 150) + 'px';
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${key}</div>
        </div>`;
      });
      html += '</div>';

      // 平均和值
      const avgSum = Math.round(sums.reduce((a, s) => a + s.sum, 0) / sums.length);
      html += `<p style="margin-top: 15px; color: #666;">平均和值: <strong style="color: #e60012;">${avgSum}</strong></p>`;
      html += '</div>';
      return html;
    }

    // 冷热号分析
    function renderHotColdAnalysis(data) {
      const redCount = {};
      const blueCount = {};
      for (let i = 1; i <= 33; i++) redCount[i] = 0;
      for (let i = 1; i <= 16; i++) blueCount[i] = 0;

      data.forEach(item => {
        item.redBalls.forEach(n => redCount[n]++);
        blueCount[item.blueBall]++;
      });

      const sortedRed = Object.entries(redCount).sort((a, b) => b[1] - a[1]);
      const hotRed = sortedRed.slice(0, 10);
      const coldRed = sortedRed.slice(-10);

      let html = '<div class="analysis-chart"><h4>红球冷热号</h4>';
      html += '<p style="margin-bottom: 10px; color: #666;"><span class="tag tag-hot">热号</span> 出现频率最高的号码</p>';
      html += '<div style="margin-bottom: 15px;">';
      hotRed.forEach(([num, count]) => {
        html += `<span class="ball ball-red">${String(num).padStart(2, '0')}</span>`;
      });
      html += '</div>';

      html += '<p style="margin-bottom: 10px; color: #666;"><span class="tag tag-cold">冷号</span> 出现频率最低的号码</p>';
      html += '<div style="margin-bottom: 15px;">';
      coldRed.forEach(([num, count]) => {
        html += `<span class="ball ball-red">${String(num).padStart(2, '0')}</span>`;
      });
      html += '</div>';

      // 蓝球冷热
      const sortedBlue = Object.entries(blueCount).sort((a, b) => b[1] - a[1]);
      html += '<p style="margin-bottom: 10px; color: #666;"><span class="tag tag-hot">热蓝</span> 出现频率最高的蓝球</p>';
      html += '<div>';
      sortedBlue.slice(0, 5).forEach(([num, count]) => {
        html += `<span class="ball ball-blue">${String(num).padStart(2, '0')}</span>`;
      });
      html += '</div>';

      html += '</div>';
      return html;
    }

    // 大小比分析
    function renderSizeAnalysis(data) {
      const stats = {};
      data.forEach(item => {
        const big = item.redBalls.filter(n => n >= 17).length;
        const small = 6 - big;
        const key = `${big}:${small}`;
        stats[key] = (stats[key] || 0) + 1;
      });

      let html = '<div class="analysis-chart"><h4>大小比分布 (大≥17 : 小≤16)</h4>';
      html += '<div class="bar-chart">';
      const maxVal = Math.max(...Object.values(stats));
      Object.entries(stats).sort((a, b) => b[1] - a[1]).forEach(([key, val]) => {
        const height = (val / maxVal * 150) + 'px';
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${key}</div>
        </div>`;
      });
      html += '</div></div>';
      return html;
    }

    // 连号分析
    function renderConsecutiveAnalysis(data) {
      // 统计连号对数分布 (0对、1对、2对、3对)
      const pairStats = { '0对': 0, '1对': 0, '2对': 0, '3对': 0 };

      // 统计具体连号对出现频次
      const pairFreq = {};
      for (let i = 1; i <= 32; i++) {
        pairFreq[`${String(i).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`] = 0;
      }

      // 统计连号长度分布
      const lengthStats = {};

      // 统计每期是否有连号
      let hasConsecutive = 0;

      data.forEach(item => {
        const balls = item.redBalls;
        let pairs = 0;
        const consecutivePairs = [];

        for (let i = 0; i < balls.length - 1; i++) {
          if (balls[i + 1] - balls[i] === 1) {
            pairs++;
            const pairKey = `${String(balls[i]).padStart(2,'0')}-${String(balls[i+1]).padStart(2,'0')}`;
            consecutivePairs.push(pairKey);
            if (pairFreq[pairKey] !== undefined) pairFreq[pairKey]++;
          }
        }

        // 统计最长连号长度
        let maxLen = 0, curLen = 0;
        for (let i = 0; i < balls.length - 1; i++) {
          if (balls[i + 1] - balls[i] === 1) {
            curLen++;
            if (curLen + 1 > maxLen) maxLen = curLen + 1;
          } else {
            curLen = 0;
          }
        }
        lengthStats[maxLen] = (lengthStats[maxLen] || 0) + 1;

        if (pairs === 0) pairStats['0对']++;
        else if (pairs === 1) pairStats['1对']++;
        else if (pairs === 2) pairStats['2对']++;
        else pairStats['3对']++;

        if (pairs > 0) hasConsecutive++;

        consecutivePairs.forEach(p => { /* 已统计 */ });
      });

      const total = data.length;
      const consecutiveRate = ((hasConsecutive / total) * 100).toFixed(1);

      let html = '<div class="analysis-chart"><h4>连号出现频率</h4>';
      html += `<p style="margin-bottom: 10px; color: #666; font-size: 13px;">近${total}期中有 <strong style="color: #e60012;">${hasConsecutive}</strong> 期出现连号，占比 <strong style="color: #e60012;">${consecutiveRate}%</strong></p>`;
      html += '<div class="bar-chart">';
      const maxVal = Math.max(...Object.values(pairStats));
      Object.entries(pairStats).forEach(([key, val]) => {
        const height = (val / maxVal * 150) + 'px';
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${key}</div>
        </div>`;
      });
      html += '</div></div>';

      // 最长连号长度分布
      html += '<div class="analysis-chart"><h4>最长连号长度分布</h4>';
      html += '<div class="bar-chart">';
      const lenKeys = Object.keys(lengthStats).sort((a, b) => Number(a) - Number(b));
      const maxLenVal = Math.max(...Object.values(lengthStats));
      lenKeys.forEach(key => {
        const val = lengthStats[key];
        const height = (val / maxLenVal * 150) + 'px';
        const label = key === '1' ? '无连号' : `${key}连号`;
        html += `<div class="bar-item">
          <div class="bar-value">${val}次</div>
          <div class="bar" style="height: ${height}"></div>
          <div class="bar-label">${label}</div>
        </div>`;
      });
      html += '</div></div>';

      // 热门连号对 TOP 10
      const sortedPairs = Object.entries(pairFreq).sort((a, b) => b[1] - a[1]).slice(0, 10);
      html += '<div class="analysis-chart"><h4>热门连号对 TOP 10</h4>';
      html += '<div style="margin-bottom: 10px; color: #666; font-size: 13px;">出现次数最多的相邻号码组合</p>';
      html += '<div style="display: flex; flex-direction: column; gap: 6px;">';
      sortedPairs.forEach(([pair, count], idx) => {
        const [n1, n2] = pair.split('-');
        const barWidth = Math.max(20, (count / sortedPairs[0][1] * 100));
        html += `<div style="display: flex; align-items: center; gap: 8px;">
          <span style="min-width: 24px; color: #999; font-size: 12px; text-align: right;">${idx + 1}</span>
          <span class="ball ball-red" style="width: 28px; height: 28px; font-size: 12px; margin: 0;">${n1}</span>
          <span style="color: #999; font-size: 11px;">-</span>
          <span class="ball ball-red" style="width: 28px; height: 28px; font-size: 12px; margin: 0;">${n2}</span>
          <div style="flex: 1; background: #f0f0f0; border-radius: 3px; height: 14px; overflow: hidden;">
            <div style="width: ${barWidth}%; background: linear-gradient(90deg, #e60012, #ff6666); height: 100%; border-radius: 3px; min-width: 2px;"></div>
          </div>
          <span style="min-width: 40px; color: #666; font-size: 12px;">${count}次</span>
        </div>`;
      });
      html += '</div></div>';

      return html;
    }

    // ==================== 智能推荐 ====================
    function generateRecommendations() {
      const period = parseInt(document.getElementById('recommend-period').value);
      const count = parseInt(document.getElementById('recommend-count').value);
      const checkboxes = document.querySelectorAll('#recommend-section .checkbox-item input:checked');
      const dimensions = Array.from(checkboxes).map(cb => cb.value);

      if (historyData.length < period) {
        document.getElementById('recommend-content').innerHTML = '<div class="alert alert-warning">历史数据不足，请先加载数据</div>';
        return;
      }

      const recentData = historyData.slice(0, period);
      const recommendations = [];
      let attempts = 0;
      const maxAttempts = count * 200;

      while (recommendations.length < count && attempts < maxAttempts) {
        attempts++;
        const candidate = generateCandidate(recentData, dimensions);
        if (candidate && !isHistoricalMatch(candidate)) {
          recommendations.push(candidate);
        }
      }

      renderRecommendations(recommendations, attempts);
    }

    function generateCandidate(data, dimensions) {
      const redCount = {};
      for (let i = 1; i <= 33; i++) redCount[i] = 0;
      data.forEach(item => {
        item.redBalls.forEach(n => redCount[n]++);
      });

      // 计算冷热权重
      const sortedByCount = Object.entries(redCount).sort((a, b) => b[1] - a[1]);
      const hotNumbers = sortedByCount.slice(0, 10).map(([n]) => Number(n));
      const coldNumbers = sortedByCount.slice(-10).map(([n]) => Number(n));
      const warmNumbers = sortedByCount.slice(10, 20).map(([n]) => Number(n));

      let redBalls = [];

      if (dimensions.includes('hotCold')) {
        // 根据冷热比例选号: 3热 2温 1冷
        const hot = pickRandom(hotNumbers, 3);
        const warm = pickRandom(warmNumbers.filter(n => !hot.includes(n)), 2);
        const cold = pickRandom(coldNumbers.filter(n => !hot.includes(n) && !warm.includes(n)), 1);
        redBalls = [...hot, ...warm, ...cold];
      } else {
        redBalls = pickRandom(Array.from({ length: 33 }, (_, i) => i + 1), 6);
      }

      redBalls.sort((a, b) => a - b);

      // 检查总和区间
      const sum = redBalls.reduce((a, b) => a + b, 0);
      if (dimensions.includes('sumRange')) {
        const avgSum = Math.round(data.reduce((acc, item) => acc + item.redBalls.reduce((a, b) => a + b, 0), 0) / data.length);
        if (sum < avgSum - 30 || sum > avgSum + 30) return null;
      }

      // 检查奇偶比
      if (dimensions.includes('oddEven')) {
        const odd = redBalls.filter(n => n % 2 === 1).length;
        if (odd < 2 || odd > 4) return null;
      }

      // 检查三区分布
      if (dimensions.includes('threeZone')) {
        const z1 = redBalls.filter(n => n <= 11).length;
        const z2 = redBalls.filter(n => n > 11 && n <= 22).length;
        const z3 = redBalls.filter(n => n > 22).length;
        if (z1 === 0 || z2 === 0 || z3 === 0) return null;
        if (z1 > 4 || z2 > 4 || z3 > 4) return null;
      }

      // 检查大小比
      if (dimensions.includes('sizeRatio')) {
        const big = redBalls.filter(n => n >= 17).length;
        if (big < 2 || big > 4) return null;
      }

      // 选择蓝球
      const blueCount = {};
      for (let i = 1; i <= 16; i++) blueCount[i] = 0;
      data.forEach(item => blueCount[item.blueBall]++);
      const sortedBlue = Object.entries(blueCount).sort((a, b) => a[1] - b[1]);
      const coldBlues = sortedBlue.slice(0, 5).map(([n]) => Number(n));
      const blueBall = coldBlues[Math.floor(Math.random() * coldBlues.length)];

      return { redBalls, blueBall, sum, id: Date.now() + Math.random() };
    }

    function pickRandom(arr, count) {
      const shuffled = [...arr].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function isHistoricalMatch(candidate) {
      // 检查是否与历史记录匹配（二等奖及以上要求：6红全中）
      for (const item of historyData) {
        const matchRed = candidate.redBalls.every(n => item.redBalls.includes(n));
        if (matchRed) return true; // 6红全中 = 二等奖及以上
      }
      return false;
    }

    function renderRecommendations(recommendations, attempts) {
      const contentDiv = document.getElementById('recommend-content');
      if (recommendations.length === 0) {
        contentDiv.innerHTML = '<div class="alert alert-warning">未能生成符合条件的推荐，请调整筛选条件后重试</div>';
        return;
      }

      let html = `<div style="margin-bottom: 15px; color: #666;">成功生成 ${recommendations.length} 注推荐 (过滤了 ${attempts} 次尝试)</div>`;

      recommendations.forEach((rec, index) => {
        const odd = rec.redBalls.filter(n => n % 2 === 1).length;
        const even = 6 - odd;
        const big = rec.redBalls.filter(n => n >= 17).length;
        const small = 6 - big;
        const z1 = rec.redBalls.filter(n => n <= 11).length;
        const z2 = rec.redBalls.filter(n => n > 11 && n <= 22).length;
        const z3 = rec.redBalls.filter(n => n > 22).length;

        html += `<div class="recommendation-item">
          <div class="recommendation-header">
            <span class="recommendation-title">推荐方案 ${index + 1}</span>
            <div class="recommendation-actions">
              <button class="favorite-btn" onclick="toggleFavorite(${rec.id}, this)">♥</button>
            </div>
          </div>
          <div class="balls-cell">
            ${rec.redBalls.map(n => `<span class="ball ball-red">${String(n).padStart(2, '0')}</span>`).join('')}
            <span class="ball ball-blue">${String(rec.blueBall).padStart(2, '0')}</span>
          </div>
          <div style="margin-top: 10px; font-size: 12px; color: #666;">
            <span class="tag">和值: ${rec.sum}</span>
            <span class="tag">奇偶: ${odd}:${even}</span>
            <span class="tag">大小: ${big}:${small}</span>
            <span class="tag">三区: ${z1}:${z2}:${z3}</span>
          </div>
        </div>`;

        // 存储推荐数据用于收藏
        rec.index = index;
        window._recommendations = window._recommendations || {};
        window._recommendations[rec.id] = rec;
      });

      contentDiv.innerHTML = html;
    }

    // ==================== 收藏管理 ====================
    function toggleFavorite(id, btn) {
      const rec = window._recommendations?.[id];
      if (!rec) return;

      let favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
      const existingIndex = favorites.findIndex(f => f.id === id);

      if (existingIndex >= 0) {
        favorites.splice(existingIndex, 1);
        btn.classList.remove('active');
      } else {
        favorites.push({
          id: rec.id,
          redBalls: rec.redBalls,
          blueBall: rec.blueBall,
          sum: rec.sum,
          createdAt: new Date().toISOString()
        });
        btn.classList.add('active');
      }

      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      renderFavorites();
    }

    function renderFavorites() {
      const favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
      const contentDiv = document.getElementById('favorites-content');

      if (favorites.length === 0) {
        contentDiv.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⭐</div>
            <p>暂无收藏记录</p>
            <p style="font-size: 14px; margin-top: 10px;">在智能推荐页面点击收藏按钮保存喜欢的方案</p>
          </div>
        `;
        return;
      }

      let html = '';
      favorites.forEach((fav, index) => {
        const odd = fav.redBalls.filter(n => n % 2 === 1).length;
        const even = 6 - odd;
        const big = fav.redBalls.filter(n => n >= 17).length;
        const small = 6 - big;
        const z1 = fav.redBalls.filter(n => n <= 11).length;
        const z2 = fav.redBalls.filter(n => n > 11 && n <= 22).length;
        const z3 = fav.redBalls.filter(n => n > 22).length;

        html += `<div class="recommendation-item">
          <div class="recommendation-header">
            <span class="recommendation-title">收藏方案 ${index + 1}</span>
            <div class="recommendation-actions">
              <button class="btn btn-secondary" onclick="deleteFavorite(${fav.id})">删除</button>
            </div>
          </div>
          <div class="balls-cell">
            ${fav.redBalls.map(n => `<span class="ball ball-red">${String(n).padStart(2, '0')}</span>`).join('')}
            <span class="ball ball-blue">${String(fav.blueBall).padStart(2, '0')}</span>
          </div>
          <div style="margin-top: 10px; font-size: 12px; color: #666;">
            <span class="tag">和值: ${fav.sum}</span>
            <span class="tag">奇偶: ${odd}:${even}</span>
            <span class="tag">大小: ${big}:${small}</span>
            <span class="tag">三区: ${z1}:${z2}:${z3}</span>
          </div>
          <div style="margin-top: 5px; font-size: 12px; color: #999;">
            收藏时间: ${new Date(fav.createdAt).toLocaleString()}
          </div>
        </div>`;
      });

      contentDiv.innerHTML = html;
    }

    function deleteFavorite(id) {
      let favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
      favorites = favorites.filter(f => f.id !== id);
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      renderFavorites();
    }

    // ==================== 工具函数 ====================
    function showAlert(containerId, message, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // 导航切换
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const section = link.dataset.section;

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        link.classList.add('active');
        document.getElementById(`${section}-section`).classList.add('active');

        if (section === 'favorites') {
          renderFavorites();
        }
      });
    });

    // 初始化
    initData();
  </script>
</body>
</html>
