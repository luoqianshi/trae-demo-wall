<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>Codex Session 可视化汇总工具 - Demo</title>

  <style>
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'JetBrainsMono';
      src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');
      font-weight: 400;
    }
  </style>

  <style>
    :root {
      --bg: #0f1117;
      --bg2: #181b24;
      --bg3: #1e2230;
      --bg4: #252a3a;
      --ink: #e8eaf0;
      --ink2: #c5c8d4;
      --muted: #8b90a0;
      --rule: #2a2e3c;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --green: #4ade80;
      --orange: #fb923c;
      --red: #f87171;
      --yellow: #fbbf24;
      --font: 'InstrumentSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrainsMono', 'SF Mono', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }

    /* === App Layout === */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    /* === Header === */
    .header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: white;
    }
    .search-box {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 0.55rem 0.9rem 0.55rem 2.2rem;
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
    }
    .header-stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .stat-value {
      color: var(--ink);
      font-weight: 600;
      font-family: var(--font-mono);
    }

    /* === Main Layout === */
    .main {
      display: grid;
      grid-template-columns: 240px 360px 1fr;
      overflow: hidden;
    }

    /* === Sidebar: Projects === */
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--rule);
      overflow-y: auto;
      padding: 1rem 0;
    }
    .sidebar-title {
      padding: 0 1.25rem 0.75rem;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .project-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.25rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--ink2);
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .project-item:hover {
      background: var(--bg3);
      color: var(--ink);
    }
    .project-item.active {
      background: var(--bg3);
      border-left-color: var(--accent);
      color: var(--ink);
    }
    .project-checkbox {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--muted);
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: transparent;
    }
    .project-item.active .project-checkbox {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .project-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-count {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* === Sessions List === */
    .sessions {
      background: var(--bg);
      border-right: 1px solid var(--rule);
      overflow-y: auto;
    }
    .sessions-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .sessions-title {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sort-btn {
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--rule);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
    }
    .sort-btn:hover { color: var(--ink); border-color: var(--muted); }

    .session-item {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.15s;
    }
    .session-item:hover { background: var(--bg2); }
    .session-item.active { background: var(--bg3); border-left: 3px solid var(--accent); padding-left: calc(1.25rem - 3px); }
    .session-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .session-project {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
    }
    .session-preview {
      font-size: 0.85rem;
      color: var(--ink2);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }
    .session-preview mark {
      background: var(--yellow);
      color: var(--bg);
      padding: 0 2px;
      border-radius: 2px;
    }
    .session-stats {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .session-stat { display: flex; align-items: center; gap: 0.25rem; }

    /* === Detail Panel === */
    .detail {
      overflow-y: auto;
      padding: 1.5rem 2rem;
    }
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 0.75rem;
    }
    .empty-icon { font-size: 3rem; opacity: 0.5; }

    .detail-header {
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 1.5rem;
    }
    .detail-project {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .detail-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .detail-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .message {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .message.user .avatar { background: var(--green); color: var(--bg); }
    .message.assistant .avatar { background: var(--accent); color: white; }
    .message-body {
      max-width: 80%;
      background: var(--bg2);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--ink);
    }
    .message.user .message-body { background: var(--bg3); }
    .message-body p { margin-bottom: 0.6rem; }
    .message-body p:last-child { margin-bottom: 0; }
    .message-body mark {
      background: var(--yellow);
      color: var(--bg);
      padding: 0 2px;
      border-radius: 2px;
    }

    .code-block {
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin: 0.6rem 0;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--green);
      overflow-x: auto;
      line-height: 1.5;
      position: relative;
    }
    .code-block .lang {
      position: absolute;
      top: 0.4rem;
      right: 0.6rem;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .code-block .keyword { color: var(--accent2); }
    .code-block .string { color: var(--orange); }
    .code-block .comment { color: var(--muted); }
    .code-block .function { color: var(--yellow); }

    .tool-call {
      background: var(--bg3);
      border-left: 3px solid var(--orange);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      margin: 0.6rem 0;
      font-size: 0.8rem;
      font-family: var(--font-mono);
    }
    .tool-call-label {
      color: var(--orange);
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tool-call-content { color: var(--ink2); }

    .file-change {
      background: var(--bg3);
      border-left: 3px solid var(--green);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      margin: 0.6rem 0;
      font-size: 0.8rem;
      font-family: var(--font-mono);
    }
    .file-change-label {
      color: var(--green);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .file-change-add { color: var(--green); }
    .file-change-del { color: var(--red); }

    /* === Scrollbars === */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* === Responsive === */
    @media (max-width: 1024px) {
      .main { grid-template-columns: 200px 280px 1fr; }
    }
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      .sidebar, .sessions { display: none; }
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- ===== Header ===== -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">{"</>"}</div>
        <span>Codex Session Viewer</span>
      </div>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索所有 session 的对话内容... (按 Esc 清除)">
      </div>
      <div class="header-stats">
        <div><span class="stat-value" id="projectCount">0</span> 个项目</div>
        <div><span class="stat-value" id="sessionCount">0</span> 个 session</div>
        <div><span class="stat-value" id="messageCount">0</span> 条消息</div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <div class="main">

      <!-- Sidebar: Projects -->
      <aside class="sidebar">
        <div class="sidebar-title">项目</div>
        <div id="projectList"></div>
      </aside>

      <!-- Sessions List -->
      <div class="sessions">
        <div class="sessions-header">
          <div class="sessions-title">Session 列表</div>
          <button class="sort-btn" id="sortBtn">↓ 时间倒序</button>
        </div>
        <div id="sessionList"></div>
      </div>

      <!-- Detail Panel -->
      <main class="detail" id="detailPanel">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>选择左侧的 session 查看对话详情</div>
        </div>
      </main>

    </div>

  </div>

  <script src="assets/data.js"></script>
