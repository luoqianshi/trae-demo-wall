<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙点状文明模拟器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#03060d;
  --panel:rgba(6,14,30,0.92);
  --panel-border:rgba(40,180,220,0.15);
  --accent:#00d4ff;
  --accent2:#ff6a3d;
  --accent3:#00ff88;
  --danger:#ff2255;
  --warning:#ffaa00;
  --text:#c8dce8;
  --text-dim:#5a7088;
  --text-bright:#eaf4ff;
  --glow-cyan:0 0 20px rgba(0,212,255,0.3);
  --glow-orange:0 0 20px rgba(255,106,61,0.3);
  --font-display:'Orbitron',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-mono)}

#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

canvas{display:block}

/* Scanline overlay */
#canvas-container::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,180,255,0.015) 2px,rgba(0,180,255,0.015) 4px);
  pointer-events:none;z-index:1;
}

/* === HUD panels === */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}

/* Top bar */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:linear-gradient(180deg,rgba(3,6,13,0.95) 0%,rgba(3,6,13,0) 100%);
  border-bottom:1px solid var(--panel-border);
}

.top-bar .title{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:var(--accent);
  text-shadow:var(--glow-cyan);
}

.top-bar .title span{color:var(--text-dim);font-weight:400;font-size:11px;letter-spacing:1px;margin-left:12px}

.stats-row{display:flex;gap:24px;align-items:center}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);font-family:var(--font-mono)}
.stat .value{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text-bright)}
.stat .value.cyan{color:var(--accent)}
.stat .value.green{color:var(--accent3)}
.stat .value.orange{color:var(--accent2)}
.stat .value.red{color:var(--danger)}

/* Control bar */
.control-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:12px;padding:8px 20px;
  background:linear-gradient(0deg,rgba(3,6,13,0.95) 0%,rgba(3,6,13,0) 100%);
  border-top:1px solid var(--panel-border);
}

.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-group label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);white-space:nowrap}

.ctrl-btn{
  font-family:var(--font-mono);font-size:11px;font-weight:600;
  background:rgba(0,212,255,0.08);color:var(--accent);
  border:1px solid rgba(0,212,255,0.25);border-radius:3px;
  padding:5px 12px;cursor:pointer;transition:all 0.2s;
  text-transform:uppercase;letter-spacing:1px;
}
.ctrl-btn:hover{background:rgba(0,212,255,0.18);border-color:rgba(0,212,255,0.5);box-shadow:var(--glow-cyan)}
.ctrl-btn.active{background:rgba(0,212,255,0.2);color:#fff;border-color:var(--accent)}
.ctrl-btn.danger{color:var(--danger);border-color:rgba(255,34,85,0.25);background:rgba(255,34,85,0.08)}
.ctrl-btn.danger:hover{background:rgba(255,34,85,0.18);box-shadow:0 0 20px rgba(255,34,85,0.3)}

.ctrl-slider{
  -webkit-appearance:none;width:120px;height:4px;
  background:rgba(0,212,255,0.15);border-radius:2px;outline:none;
}
.ctrl-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:var(--glow-cyan);
}

.sep{width:1px;height:24px;background:var(--panel-border);margin:0 4px}

.speed-display{
  font-family:var(--font-display);font-size:13px;font-weight:700;
  color:var(--accent);min-width:40px;text-align:center;
}

/* Right panel */
.right-panel{
  position:fixed;top:52px;right:0;width:320px;bottom:48px;z-index:15;
  background:var(--panel);border-left:1px solid var(--panel-border);
  overflow-y:auto;transform:translateX(100%);
  transition:transform 0.35s cubic-bezier(0.22,1,0.36,1);
  scrollbar-width:thin;scrollbar-color:rgba(0,212,255,0.2) transparent;
}
.right-panel.open{transform:translateX(0)}
.right-panel::-webkit-scrollbar{width:4px}
.right-panel::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}

.panel-header{
  position:sticky;top:0;z-index:2;padding:12px 16px;
  background:rgba(6,14,30,0.98);border-bottom:1px solid var(--panel-border);
  display:flex;align-items:center;justify-content:space-between;
}
.panel-header h2{
  font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--accent);
}
.panel-close{
  font-size:16px;color:var(--text-dim);cursor:pointer;
  background:none;border:none;font-family:var(--font-mono);
  transition:color 0.2s;
}
.panel-close:hover{color:var(--danger)}

.param-section{padding:12px 16px;border-bottom:1px solid rgba(40,180,220,0.08)}
.param-section h3{
  font-family:var(--font-display);font-size:9px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);
  margin-bottom:8px;
}

.param-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:11px;
}
.param-row .param-name{color:var(--text-dim)}
.param-row .param-val{color:var(--text-bright);font-weight:600}
.param-row .param-val.cyan{color:var(--accent)}
.param-row .param-val.green{color:var(--accent3)}
.param-row .param-val.orange{color:var(--accent2)}
.param-row .param-val.red{color:var(--danger)}

.civ-type-badge{
  display:inline-block;padding:2px 8px;border-radius:2px;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.civ-type-badge.type1{background:rgba(0,212,255,0.15);color:var(--accent);border:1px solid rgba(0,212,255,0.3)}
.civ-type-badge.type2{background:rgba(0,255,136,0.15);color:var(--accent3);border:1px solid rgba(0,255,136,0.3)}
.civ-type-badge.type3{background:rgba(255,106,61,0.15);color:var(--accent2);border:1px solid rgba(255,106,61,0.3)}

.resource-bar{
  height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-top:4px;
}
.resource-bar-fill{height:100%;border-radius:3px;transition:width 0.3s}

/* Event log - removed from bottom, now in left sidebar */
.event-log-deprecated{display:none}

/* Left sidebar - Interaction Events */
.left-sidebar{
  position:fixed;top:52px;left:0;bottom:48px;width:360px;z-index:14;
  background:var(--panel);border-right:1px solid var(--panel-border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sidebar-header{
  padding:12px 16px;border-bottom:1px solid var(--panel-border);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(6,14,30,0.98);flex-shrink:0;
}
.sidebar-header h2{
  font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--accent);
}
.sidebar-toggle{
  font-size:14px;color:var(--text-dim);cursor:pointer;
  background:none;border:none;font-family:var(--font-mono);
  transition:color 0.2s;padding:2px 6px;
}
.sidebar-toggle:hover{color:var(--accent)}

.sidebar-stats{
  display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid rgba(40,180,220,0.08);
  flex-shrink:0;
}
.sidebar-stat{
  display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;
}
.sidebar-stat .s-label{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim)}
.sidebar-stat .s-val{font-family:var(--font-display);font-size:14px;font-weight:700}
.sidebar-stat .s-val.red{color:var(--danger)}
.sidebar-stat .s-val.cyan{color:var(--accent)}
.sidebar-stat .s-val.green{color:var(--accent3)}
.sidebar-stat .s-val.orange{color:var(--accent2)}

.sidebar-tabs{
  display:flex;padding:0 8px;border-bottom:1px solid rgba(40,180,220,0.08);flex-shrink:0;
}
.sidebar-tab{
  flex:1;padding:6px 0;text-align:center;
  font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;
  font-family:var(--font-display);
}
.sidebar-tab:hover{color:var(--text)}
.sidebar-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sidebar-tab .tab-count{
  display:inline-block;background:rgba(255,255,255,0.06);padding:1px 5px;
  border-radius:2px;margin-left:4px;font-size:8px;
}

.sidebar-event-list{
  flex:1;overflow-y:auto;padding:4px 12px;
  scrollbar-width:thin;scrollbar-color:rgba(0,212,255,0.15) transparent;
}
.sidebar-event-list::-webkit-scrollbar{width:3px}
.sidebar-event-list::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.15);border-radius:2px}

.event-item{
  padding:6px 8px;margin-bottom:2px;border-radius:3px;
  font-size:10px;line-height:1.5;
  background:rgba(255,255,255,0.02);
  border-left:3px solid transparent;
  animation:slideIn 0.25s ease-out;
}
.event-item:hover{background:rgba(255,255,255,0.04)}
.event-item.attack{border-left-color:var(--danger)}
.event-item.comm{border-left-color:var(--accent)}
.event-item.trade{border-left-color:var(--accent3)}
.event-item.death{border-left-color:var(--warning)}
.event-item.system{border-left-color:var(--text-dim)}
.event-item .e-time{font-size:8px;color:var(--text-dim);margin-bottom:1px}
.event-item .e-type{
  display:inline-block;font-size:8px;font-weight:700;letter-spacing:1px;
  padding:0 4px;border-radius:2px;margin-right:4px;text-transform:uppercase;
}
.event-item.attack .e-type{background:rgba(255,34,85,0.15);color:var(--danger)}
.event-item.comm .e-type{background:rgba(0,212,255,0.15);color:var(--accent)}
.event-item.trade .e-type{background:rgba(0,255,136,0.15);color:var(--accent3)}
.event-item.death .e-type{background:rgba(255,170,0,0.15);color:var(--warning)}
.event-item.system .e-type{background:rgba(170,136,255,0.15);color:#aa88ff}
.event-item .e-msg{color:var(--text)}

@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* Collapsed sidebar */
.left-sidebar.collapsed{
  width:0;border-right:none;
}
.left-sidebar.collapsed .sidebar-header,
.left-sidebar.collapsed .sidebar-stats,
.left-sidebar.collapsed .sidebar-tabs,
.left-sidebar.collapsed .sidebar-event-list{display:none}

/* Rules panel */
.rules-panel{
  position:fixed;bottom:48px;right:0;width:320px;z-index:12;
  padding:10px 16px;
  background:var(--panel);border:1px solid var(--panel-border);border-right:none;
  border-radius:4px 0 0 4px;
  font-size:10px;line-height:1.7;
  max-height:160px;overflow-y:auto;
}
.rules-panel h3{
  font-family:var(--font-display);font-size:9px;font-weight:700;
  letter-spacing:2px;color:var(--accent);margin-bottom:6px;text-transform:uppercase;
}
.rules-panel .rule{color:var(--text-dim);padding:1px 0}
.rules-panel .rule span{color:var(--text)}
.rules-panel .rule .key{color:var(--accent2)}

/* Tooltip */
.tooltip{
  position:fixed;z-index:50;padding:6px 10px;
  background:rgba(6,14,30,0.95);border:1px solid var(--panel-border);
  border-radius:3px;font-size:10px;color:var(--text);
  pointer-events:none;opacity:0;transition:opacity 0.15s;
  max-width:200px;
}
.tooltip.show{opacity:1}

/* Mini map */
.minimap{
  position:fixed;top:60px;left:12px;width:140px;height:140px;z-index:12;
  border:1px solid var(--panel-border);border-radius:4px;
  overflow:hidden;background:rgba(3,6,13,0.85);
}
.minimap canvas{width:100%;height:100%}
.minimap .minimap-label{
  position:absolute;top:4px;left:6px;
  font-family:var(--font-display);font-size:8px;letter-spacing:2px;
  color:var(--text-dim);text-transform:uppercase;
}

/* Crosshair */
.crosshair{
  position:fixed;top:50%;left:50%;z-index:5;
  width:20px;height:20px;margin:-10px 0 0 -10px;
  pointer-events:none;opacity:0.3;
}
.crosshair::before,.crosshair::after{
  content:'';position:absolute;background:var(--accent);
}
.crosshair::before{width:1px;height:100%;left:50%;transform:translateX(-50%)}
.crosshair::after{height:1px;width:100%;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="title">宇宙文明模拟器 <span>v2.0 / 30万文明</span></div>
  <div class="stats-row">
    <div class="stat">
      <span class="label">宇宙年龄</span>
      <span class="value cyan" id="stat-time">0.00 百万年</span>
    </div>
    <div class="stat">
      <span class="label">存活</span>
      <span class="value green" id="stat-alive">0</span>
    </div>
    <div class="stat">
      <span class="label">已毁灭</span>
      <span class="value red" id="stat-dead">0</span>
    </div>
    <div class="stat">
      <span class="label">攻击</span>
      <span class="value orange" id="stat-attacks">0</span>
    </div>
    <div class="stat">
      <span class="label">通信</span>
      <span class="value cyan" id="stat-comms">0</span>
    </div>
  </div>
  <div class="stats-row" style="gap:16px">
    <div class="stat">
      <span class="label">交流型</span>
      <span class="value cyan" id="stat-ratio-t1" style="font-size:12px">--</span>
    </div>
    <div class="stat">
      <span class="label">孤立型</span>
      <span class="value green" id="stat-ratio-t2" style="font-size:12px">--</span>
    </div>
    <div class="stat">
      <span class="label">攻击型</span>
      <span class="value orange" id="stat-ratio-t3" style="font-size:12px">--</span>
    </div>
  </div>
</div>

<!-- Control Bar -->
<div class="control-bar">
  <div class="ctrl-group">
    <button class="ctrl-btn active" id="btn-play" onclick="togglePlay()">⏸ 暂停</button>
    <button class="ctrl-btn" onclick="stepOnce()">⏭ 单步</button>
    <button class="ctrl-btn" onclick="resetSim()">↺ 重置</button>
    <button class="ctrl-btn" onclick="randomCiv()" style="border-color:rgba(170,136,255,0.4);color:#aa88ff;background:rgba(170,136,255,0.08)">🎲 随机观察</button>
  </div>
  <div class="sep"></div>
  <div class="ctrl-group">
    <label>速度</label>
    <input type="range" class="ctrl-slider" id="speed-slider" min="0" max="5" step="1" value="2" oninput="setSpeed(this.value)">
    <span class="speed-display" id="speed-display">1x</span>
  </div>
  <div class="sep"></div>
  <div class="ctrl-group">
    <label>步长</label>
    <input type="range" class="ctrl-slider" id="step-slider" min="100" max="100000" step="100" value="1000" oninput="setStepSize(this.value)">
    <span class="speed-display" id="step-display">1000 年</span>
  </div>
  <div class="sep"></div>
  <div class="ctrl-group">
    <label>筛选</label>
    <button class="ctrl-btn" id="btn-filter-all" onclick="setFilter('all')">全部</button>
    <button class="ctrl-btn" id="btn-filter-1" onclick="setFilter(1)">交流型</button>
    <button class="ctrl-btn" id="btn-filter-2" onclick="setFilter(2)">孤立型</button>
    <button class="ctrl-btn" id="btn-filter-3" onclick="setFilter(3)">攻击型</button>
  </div>
</div>

<!-- Right Panel (selected civ info) -->
<div class="right-panel" id="right-panel">
  <div class="panel-header">
    <h2 id="panel-civ-id">文明 #--</h2>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="panel-content"></div>
</div>

<!-- Left Sidebar - Interaction Events -->
<div class="left-sidebar" id="left-sidebar">
  <div class="sidebar-header">
    <h2>交互事件</h2>
    <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
  </div>
  <!-- Minimap embedded in sidebar -->
  <div class="minimap" id="minimap-container" style="top:auto;left:auto;position:relative;width:100%;height:130px;border:none;border-bottom:1px solid var(--panel-border);flex-shrink:0">
    <canvas id="minimap-canvas" width="360" height="130"></canvas>
    <div class="minimap-label">X-Z 平面投影</div>
  </div>
  <div class="sidebar-stats">
    <div class="sidebar-stat">
      <span class="s-label">攻击</span>
      <span class="s-val red" id="side-attacks">0</span>
    </div>
    <div class="sidebar-stat">
      <span class="s-label">通信</span>
      <span class="s-val cyan" id="side-comms">0</span>
    </div>
    <div class="sidebar-stat">
      <span class="s-label">贸易</span>
      <span class="s-val green" id="side-trades">0</span>
    </div>
    <div class="sidebar-stat">
      <span class="s-label">毁灭</span>
      <span class="s-val orange" id="side-deaths">0</span>
    </div>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" id="tab-all" onclick="setEventTab('all')">全部</button>
    <button class="sidebar-tab" id="tab-attack" onclick="setEventTab('attack')">攻击</button>
    <button class="sidebar-tab" id="tab-comm" onclick="setEventTab('comm')">通信</button>
    <button class="sidebar-tab" id="tab-trade" onclick="setEventTab('trade')">贸易</button>
  </div>
  <div class="sidebar-event-list" id="sidebar-events"></div>
</div>

<!-- Sidebar expand button (when collapsed) -->
<button class="ctrl-btn" id="sidebar-expand-btn" style="position:fixed;top:60px;left:8px;z-index:15;display:none;font-size:9px;padding:4px 8px" onclick="toggleSidebar()">展开 ◀</button>

<!-- Event Log (hidden, data source only) -->
<div class="event-log-deprecated" id="event-log">
  <div class="log-title">事件日志</div>
  <div id="log-entries"></div>
</div>

<!-- Rules Panel -->
<div class="rules-panel">
  <h3>交互规则</h3>
  <div class="rule"><span class="key">攻击</span> <span>P = 科技差 / (距离 + 科技差)</span></div>
  <div class="rule"><span class="key">通信</span> <span>延迟 = 距离 / 光速</span></div>
  <div class="rule"><span class="key">贸易</span> <span>双方获得资源；信任度 +0.1</span></div>
  <div class="rule"><span class="key">存续</span> <span>可维持年数 = 储备量 / 消耗率</span></div>
  <div class="rule"><span class="key">马尔萨斯</span> <span>资源低于警戒线 → 科技倒退</span></div>
  <div class="rule"><span class="key">类型转变</span> <span>资源匮乏时所有类型 → 攻击型</span></div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
//  UNIVERSAL CIVILIZATION SIMULATOR - Core Engine
// ============================================================

const C = {
  CIV_COUNT: 300000,
  RADIUS: 5000,          // 10000 ly radius → 5000 units
  C_LIGHT: 100,         // light-speed in units/year (normalized)
  TECH_MIN: 0.1,
  TECH_MAX: 100,
  RESOURCE_MIN: 50,
  RESOURCE_MAX: 10000,
  POP_MIN: 100,
  POP_MAX: 1e9,
  DETECT_RANGE: 200,     // base detection range
  ATTACK_COST: 5,
  COMM_COST: 1,
  TRADE_GAIN: 2,
  SPAWN_START: 50,       // Myr - when first civs appear (50 million years)
  SPAWN_END: 8000,       // Myr - when last civs appear (8 billion years)
  // Type weights for random generation
  TYPE_WEIGHTS: [0, 0.25, 0.45, 0.3],  // index 0 unused, 1=comm, 2=isolation, 3=aggressive
};

// ============================================================
//  DATA LAYER - Typed Arrays for 300K civilizations
// ============================================================
let civData = {};

function initData() {
  const N = C.CIV_COUNT;
  civData = {
    // Spatial
    px: new Float32Array(N), py: new Float32Array(N), pz: new Float32Array(N),
    density: new Float32Array(N), distCore: new Float32Array(N),
    // Identity
    type: new Uint8Array(N),       // 1=comm, 2=iso, 3=aggro
    kLevel: new Float32Array(N),   // Kardashev 0.1-3.0
    birthTime: new Float32Array(N),
    motherStar: new Uint8Array(N), // spectral: 0=G,1=K,2=M
    // Resources
    stockpile: new Float32Array(N),
    growthRate: new Float32Array(N),
    consumeRate: new Float32Array(N),
    warningLevel: new Float32Array(N),
    // Tech & Development
    tech: new Float32Array(N),
    expandSpeed: new Float32Array(N),
    detectRange: new Float32Array(N),
    hasDoomsday: new Uint8Array(N),
    // Social
    visibility: new Float32Array(N),
    population: new Float32Array(N),
    maxAge: new Float32Array(N),
    malthusTrigger: new Float32Array(N),
    // State
    alive: new Uint8Array(N),
    knownCivs: new Uint16Array(N), // count of known civs (simplified)
    exposed: new Uint8Array(N),
    // Color (encoded for rendering)
    cr: new Float32Array(N), cg: new Float32Array(N), cb: new Float32Array(N), ca: new Float32Array(N),
  };
}

function generateCivs() {
  const N = C.CIV_COUNT;
  for (let i = 0; i < N; i++) {
    // Spherical distribution
    const r = C.RADIUS * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    civData.px[i] = r * Math.sin(phi) * Math.cos(theta);
    civData.py[i] = r * Math.sin(phi) * Math.sin(theta);
    civData.pz[i] = r * Math.cos(phi);
    civData.distCore[i] = r;
    civData.density[i] = 1 - (r / C.RADIUS); // denser near core

    // Type
    const rng = Math.random();
    civData.type[i] = rng < C.TYPE_WEIGHTS[1] ? 1 : (rng < C.TYPE_WEIGHTS[1] + C.TYPE_WEIGHTS[2] ? 2 : 3);

    // Kardashev & Tech (log-normal distribution)
    civData.tech[i] = C.TECH_MIN + Math.pow(Math.random(), 3) * (C.TECH_MAX - C.TECH_MIN);
    civData.kLevel[i] = Math.min(3.0, civData.tech[i] / 33.3);

    // Resources - give low-tech civs more buffer
    const techFactor = civData.tech[i] / C.TECH_MAX;
    civData.stockpile[i] = C.RESOURCE_MIN + Math.random() * (C.RESOURCE_MAX - C.RESOURCE_MIN) * (0.3 + 0.7 * techFactor);
    // growthRate and consumeRate balanced: net positive for most civs
    civData.growthRate[i] = 2 + techFactor * 15;
    civData.consumeRate[i] = 1 + Math.random() * 3 * (0.3 + techFactor * 0.7);
    civData.warningLevel[i] = civData.stockpile[i] * 0.2;

    // Tech params
    civData.expandSpeed[i] = 0.1 + techFactor * 5;
    civData.detectRange[i] = C.DETECT_RANGE * (0.2 + techFactor * 0.8);
    civData.hasDoomsday[i] = civData.tech[i] > 70 ? 1 : 0;

    // Social
    civData.visibility[i] = civData.type[i] === 1 ? 0.6 + Math.random() * 0.4 :
                            civData.type[i] === 2 ? 0.1 + Math.random() * 0.2 : 0.3 + Math.random() * 0.3;
    civData.population[i] = C.POP_MIN + Math.pow(Math.random(), 2) * (C.POP_MAX - C.POP_MIN);
    civData.maxAge[i] = 500 + Math.random() * 2000; // Myr lifespan (500 to 2500 Myr)
    civData.malthusTrigger[i] = civData.stockpile[i] * 0.15;

    // Birth - spread across universe timeline (50 to 8000 Myr)
    // Distribution peaks around 2000-4000 Myr
    civData.birthTime[i] = C.SPAWN_START + Math.pow(Math.random(), 0.7) * (C.SPAWN_END - C.SPAWN_START);
    civData.motherStar[i] = Math.random() < 0.4 ? 0 : (Math.random() < 0.5 ? 1 : 2);

    // State - start dormant (not yet born)
    civData.alive[i] = 0;  // NOT alive at start - will awaken at birthTime
    civData.exposed[i] = 0;
    civData.knownCivs[i] = 0;

    // Color encoding (dim for dormant)
    civData.cr[i] = 0.04; civData.cg[i] = 0.04; civData.cb[i] = 0.06; civData.ca[i] = 0.15;
  }
}

function civColor(i) {
  if (!civData.alive[i]) {
    civData.cr[i] = 0.08; civData.cg[i] = 0.08; civData.cb[i] = 0.1; civData.ca[i] = 0.12;
    return;
  }
  const t = civData.type[i];
  const tf = Math.min(1, civData.tech[i] / C.TECH_MAX);
  // Boost base brightness for visibility
  const base = 0.4 + tf * 0.6; // 0.4 to 1.0
  if (t === 1) { // cyan family
    civData.cr[i] = 0.1 * base; civData.cg[i] = (0.6 + tf * 0.4) * base; civData.cb[i] = (0.8 + tf * 0.2) * base;
  } else if (t === 2) { // green family
    civData.cr[i] = 0.1 * base; civData.cg[i] = (0.7 + tf * 0.3) * base; civData.cb[i] = (0.3 + tf * 0.3) * base;
  } else { // orange family
    civData.cr[i] = (0.9 + tf * 0.1) * base; civData.cg[i] = (0.3 + tf * 0.3) * base; civData.cb[i] = 0.05 * base;
  }
  civData.ca[i] = 0.5 + tf * 0.5;
}

// ============================================================
//  SIMULATION ENGINE
// ============================================================
let simTime = 0;        // in million years
let stepSize = 1000;     // 1000 years default (in years)
let speedMultiplier = 1;
let playing = false;
let totalAttacks = 0, totalComms = 0;
let selectedCivIdx = -1;
let filterMode = 'all';
let highlightRing = null;
let highlightGlow = null;
let simStats = { alive: 0, dead: 0, attacks: 0, comms: 0 };
let colorsDirty = true; // only sync colors when needed
let pendingLogs = [];   // batch log writes

function simStep() {
  const N = C.CIV_COUNT;
  const dt = stepSize; // years
  let attacks = 0, comms = 0, deaths = 0, births = 0;
  pendingLogs = [];

  // Phase 0: Awakening (civs whose birthTime has arrived)
  for (let i = 0; i < N; i++) {
    if (civData.alive[i]) continue;
    // birthTime and simTime are both in Myr
    if (simTime >= civData.birthTime[i]) {
      civData.alive[i] = 1;
      civColor(i);
      colorsDirty = true;
      births++;
      if (births <= 2) {
        pendingLogs.push({ type: 'system', msg: '文明 #' + i + ' 在 ' + civData.birthTime[i].toFixed(0) + '百万年诞生 (' + (civData.type[i] === 1 ? '交流型' : civData.type[i] === 2 ? '孤立型' : '攻击型') + ')' });
      }
    }
  }
  if (births > 0) {
    pendingLogs.push({ type: 'system', msg: '本轮新增 ' + births + ' 个文明' });
  }

  // Phase 1: Resource updates & natural events
  for (let i = 0; i < N; i++) {
    if (!civData.alive[i]) continue;

    // Age check (both in Myr)
    if (simTime > civData.birthTime[i] + civData.maxAge[i]) {
      // Small random chance of natural death per step (not guaranteed)
      if (Math.random() < 0.00001 * dt) {
        civData.alive[i] = 0; deaths++;
        civColor(i); colorsDirty = true; continue;
      }
    }

    // Resource dynamics: dt is in years (e.g., 1000)
    // growthRate is per-year, consumeRate is per-year
    // Net change per step: (growthRate - consumeRate) * dt
    civData.stockpile[i] += civData.growthRate[i] * dt;
    civData.stockpile[i] -= civData.consumeRate[i] * dt;

    // Malthus trap - use dt-normalized factors
    if (civData.stockpile[i] < civData.malthusTrigger[i]) {
      // Tech decays slowly: 0.1% per 1000yr step, not 1000%!
      civData.tech[i] *= Math.max(0.99, 1 - 0.00001 * dt);
      civData.consumeRate[i] *= Math.max(0.99, 1 - 0.000005 * dt);
      civData.type[i] = 3;
      civColor(i); colorsDirty = true;
    }

    // Starvation death
    if (civData.stockpile[i] <= 0) {
      civData.alive[i] = 0; deaths++;
      civColor(i); colorsDirty = true; continue;
    }

    // Tech growth (very slow)
    civData.tech[i] += 0.0001 * Math.pow(civData.tech[i], 0.5) * dt;
    civData.tech[i] = Math.min(C.TECH_MAX, civData.tech[i]);
    civData.kLevel[i] = Math.min(3.0, civData.tech[i] / 33.3);
    civData.detectRange[i] = C.DETECT_RANGE * (0.2 + (civData.tech[i] / C.TECH_MAX) * 0.8);
    civData.expandSpeed[i] = 0.1 + (civData.tech[i] / C.TECH_MAX) * 5;
  }

  // Phase 2: Sparse interaction sampling
  const sampleCount = 5000; // reduced for performance with 5Myr steps
  for (let s = 0; s < sampleCount; s++) {
    const i = Math.floor(Math.random() * N);
    const j = Math.floor(Math.random() * N);
    if (i === j || !civData.alive[i] || !civData.alive[j]) continue;

    const dx = civData.px[i] - civData.px[j];
    const dy = civData.py[i] - civData.py[j];
    const dz = civData.pz[i] - civData.pz[j];
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

    // Detection check
    const maxDetect = Math.max(civData.detectRange[i], civData.detectRange[j]);
    if (dist > maxDetect) continue;

    // Interaction probability based on visibility
    const visI = civData.visibility[i];
    const visJ = civData.visibility[j];
    const detectChance = (visI + visJ) * 0.5;

    if (Math.random() > detectChance * 0.1) continue;

    // Decide interaction type
    const typeI = civData.type[i];
    const typeJ = civData.type[j];

    // Attack
    if ((typeI === 3 || typeJ === 3) && Math.random() < 0.05) {
      const attacker = typeI === 3 ? i : j;
      const defender = typeI === 3 ? j : i;
      const techDiff = Math.abs(civData.tech[attacker] - civData.tech[defender]);
      const successProb = techDiff / (dist + techDiff + 0.01);
      if (Math.random() < successProb) {
        if (civData.hasDoomsday[attacker] && Math.random() < 0.1) {
          civData.alive[defender] = 0;
          civData.stockpile[attacker] *= 0.9;
          deaths++;
          pendingLogs.push({ type: 'death', msg: `末日打击: #${attacker} 湮灭了 #${defender} (距离:${dist.toFixed(0)})` });
          civColor(defender); colorsDirty = true;
        } else {
          civData.stockpile[defender] -= civData.stockpile[defender] * 0.2 * (civData.tech[attacker] / C.TECH_MAX);
          civData.stockpile[attacker] -= C.ATTACK_COST;
          if (civData.stockpile[defender] <= 0) {
            civData.alive[defender] = 0; deaths++;
            pendingLogs.push({ type: 'death', msg: `摧毁: #${attacker} 消灭了 #${defender}` });
            civColor(defender); colorsDirty = true;
          }
        }
        attacks++;
        civData.exposed[attacker] = 1;
        civData.exposed[defender] = 1;
      }
    }

    // Communication (type 1 or type 2)
    if ((typeI === 1 || typeI === 2) && (typeJ === 1 || typeJ === 2) && Math.random() < 0.03) {
      const delay = dist / C.C_LIGHT;
      if (delay < stepSize) {
        civData.stockpile[i] -= C.COMM_COST * 0.5;
        civData.stockpile[j] -= C.COMM_COST * 0.5;
        comms++;
        civData.knownCivs[i]++;
        civData.knownCivs[j]++;
        if (Math.random() < 0.02) {
          pendingLogs.push({ type: 'comm', msg: `信号: #${i} ↔ #${j} (延迟:${delay.toFixed(1)}光年)` });
        }
      }
    }

    // Trade (type 1 with type 1)
    if (typeI === 1 && typeJ === 1 && Math.random() < 0.02) {
      civData.stockpile[i] += C.TRADE_GAIN;
      civData.stockpile[j] += C.TRADE_GAIN;
      if (Math.random() < 0.01) {
        pendingLogs.push({ type: 'trade', msg: `贸易: #${i} ↔ #${j} (各+${C.TRADE_GAIN})` });
      }
    }
  }

  // Phase 3: Update colors (only if dirty)
  if (colorsDirty) {
    // already updated inline above, just reset flag
    colorsDirty = true; // keep dirty for buffer sync
  }

  // Flush pending logs (batch insert)
  if (pendingLogs.length > 0) {
    flushLogs();
  }

  // Update stats
  let alive = 0, typeCount = [0, 0, 0, 0]; // index 0 unused
  for (let i = 0; i < N; i++) {
    if (civData.alive[i]) {
      alive++;
      typeCount[civData.type[i]]++;
    }
  }
  totalAttacks += attacks;
  totalComms += comms;

  return { alive, deaths, attacks, comms, typeCount };
}

// ============================================================
//  THREE.JS RENDERING
// ============================================================
let scene, camera, renderer, controls, points, geometry;
let positionAttr, colorAttr;
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 3;
const mouse = new THREE.Vector2();

function initThree() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030610, 0.00003);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 50000);
  camera.position.set(0, 4000, 6000);

  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x03060d, 1);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.5;
  controls.zoomSpeed = 0.8;
  controls.minDistance = 100;
  controls.maxDistance = 25000;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.3;

  // Background stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 8000;
  const starPos = new Float32Array(starCount * 3);
  const starCol = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 15000 + Math.random() * 35000;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    starPos[i * 3] = r * Math.sin(p) * Math.cos(t);
    starPos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
    starPos[i * 3 + 2] = r * Math.cos(p);
    const b = 0.3 + Math.random() * 0.7;
    starCol[i * 3] = b; starCol[i * 3 + 1] = b; starCol[i * 3 + 2] = b;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  const starMat = new THREE.PointsMaterial({ size: 3, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.6 });
  scene.add(new THREE.Points(starGeo, starMat));

  // Grid sphere (boundary)
  const gridGeo = new THREE.SphereGeometry(C.RADIUS, 24, 16);
  const gridMat = new THREE.MeshBasicMaterial({ color: 0x0a2040, wireframe: true, transparent: true, opacity: 0.06 });
  scene.add(new THREE.Mesh(gridGeo, gridMat));

  // Core glow
  const coreGeo = new THREE.SphereGeometry(200, 16, 16);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0x112244, transparent: true, opacity: 0.3 });
  scene.add(new THREE.Mesh(coreGeo, coreMat));

  // Civ points
  geometry = new THREE.BufferGeometry();
  positionAttr = new THREE.BufferAttribute(civData.px, 3); // we'll use interleaved copy
  const positions = new Float32Array(C.CIV_COUNT * 3);
  const colors = new Float32Array(C.CIV_COUNT * 3);

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 6,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  points = new THREE.Points(geometry, material);
  scene.add(points);

  // Highlight ring - much larger and visible
  const ringGeo = new THREE.RingGeometry(40, 60, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false });
  highlightRing = new THREE.Mesh(ringGeo, ringMat);
  highlightRing.visible = false;
  scene.add(highlightRing);

  // Highlight glow sprite (large visible marker)
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 128; glowCanvas.height = 128;
  const glowCtx = glowCanvas.getContext('2d');
  const gradient = glowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.2, 'rgba(200,230,255,0.8)');
  gradient.addColorStop(0.5, 'rgba(100,180,255,0.3)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  glowCtx.fillStyle = gradient;
  glowCtx.fillRect(0, 0, 128, 128);
  const glowTexture = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.SpriteMaterial({ map: glowTexture, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9, depthWrite: false });
  highlightGlow = new THREE.Sprite(glowMat);
  highlightGlow.scale.set(150, 150, 1);
  highlightGlow.visible = false;
  scene.add(highlightGlow);

  // Events
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onCanvasClick);
  renderer.domElement.addEventListener('mousemove', onCanvasMouseMove);
}

function syncBuffers() {
  const pos = geometry.attributes.position.array;
  const col = geometry.attributes.color.array;
  const N = C.CIV_COUNT;
  // Positions: always sync (needed for initial)
  for (let i = 0; i < N; i++) {
    pos[i * 3] = civData.px[i];
    pos[i * 3 + 1] = civData.py[i];
    pos[i * 3 + 2] = civData.pz[i];
  }
  geometry.attributes.position.needsUpdate = true;
  // Colors: only sync when dirty
  if (colorsDirty) {
    for (let i = 0; i < N; i++) {
      if (filterMode !== 'all') {
        const show = civData.type[i] === filterMode && civData.alive[i];
        col[i * 3] = show ? civData.cr[i] : 0.03;
        col[i * 3 + 1] = show ? civData.cg[i] : 0.03;
        col[i * 3 + 2] = show ? civData.cb[i] : 0.05;
      } else {
        col[i * 3] = civData.cr[i];
        col[i * 3 + 1] = civData.cg[i];
        col[i * 3 + 2] = civData.cb[i];
      }
    }
    geometry.attributes.color.needsUpdate = true;
    colorsDirty = false;
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onCanvasClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(points);
  if (intersects.length > 0) {
    const idx = intersects[0].index;
    selectCiv(idx);
  } else {
    closePanel();
  }
}

function onCanvasMouseMove(event) {
  const tooltip = document.getElementById('tooltip');
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(points);
  if (intersects.length > 0) {
    const idx = intersects[0].index;
    if (civData.alive[idx]) {
      tooltip.innerHTML = `<b>#${idx}</b> 类型:${civData.type[idx]} 科技:${civData.tech[idx].toFixed(1)} 储备:${civData.stockpile[idx].toFixed(0)}`;
      tooltip.style.left = (event.clientX + 12) + 'px';
      tooltip.style.top = (event.clientY + 12) + 'px';
      tooltip.classList.add('show');
    } else {
      tooltip.classList.remove('show');
    }
  } else {
    tooltip.classList.remove('show');
  }
}

    <div class="param-section">
      <h3>空间位置</h3>
      <div class="param-row"><span class="param-name">X</span><span class="param-val">${d.px[idx].toFixed(1)} 光年</span></div>
      <div class="param-row"><span class="param-name">Y</span><span class="param-val">${d.py[idx].toFixed(1)} 光年</span></div>

      <h3>资源与经济</h3>
      <div class="param-row"><span class="param-name">储备量</span><span class="param-val ${d.stockpile[idx] < d.warningLevel[idx] ? 'red' : 'cyan'}">${d.stockpile[idx].toFixed(0)}</span></div>
      <div class="resource-bar"><div class="resource-bar-fill" style="width:${Math.min(100, (d.stockpile[idx] / C.RESOURCE_MAX) * 100).toFixed(1)}%;background:${d.stockpile[idx] < d.warningLevel[idx] ? 'var(--danger)' : 'var(--accent)'}"></div></div>
      <div class="param-row"><span class="param-name">增长率</span><span class="param-val green">+${d.growthRate[idx].toFixed(2)}/年</span></div>
      <div class="param-row"><span class="param-name">消耗率</span><span class="param-val orange">-${d.consumeRate[idx].toFixed(2)}/年</span></div>
      <div class="param-row"><span class="param-name">警戒线</span><span class="param-val">${d.warningLevel[idx].toFixed(0)}</span></div>
      <div class="param-row"><span class="param-name">可维持年数 (S÷E)</span><span class="param-val ${d.stockpile[idx] / d.consumeRate[idx] < 50 ? 'red' : ''}">${(d.stockpile[idx] / Math.max(0.01, d.consumeRate[idx])).toFixed(0)} 年</span></div>
    </div>

    <div class="param-section">
      <h3>科技与发展</h3>
      <div class="param-row"><span class="param-name">科技等级</span><span class="param-val cyan">${d.tech[idx].toFixed(2)}</span></div>
      <div class="param-row"><span class="param-name">扩张速度</span><span class="param-val">${d.expandSpeed[idx].toFixed(2)} 光年/年</span></div>
      <div class="param-row"><span class="param-name">探测范围</span><span class="param-val">${d.detectRange[idx].toFixed(0)} 光年</span></div>
      <div class="param-row"><span class="param-name">末日武器</span><span class="param-val ${d.hasDoomsday[idx] ? 'red' : ''}">${d.hasDoomsday[idx] ? '已装备' : '无'}</span></div>
    </div>

    <div class="param-section">
      <h3>社会与行为</h3>
      <div class="param-row"><span class="param-name">可见度</span><span class="param-val">${(d.visibility[idx] * 100).toFixed(0)}%</span></div>
      <div class="param-row"><span class="param-name">人口规模</span><span class="param-val">${d.population[idx].toExponential(2)}</span></div>
      <div class="param-row"><span class="param-name">最大寿命</span><span class="param-val">${(d.maxAge[idx]).toFixed(0)} 百万年</span></div>
      <div class="param-row"><span class="param-name">马尔萨斯触发</span><span class="param-val">${d.malthusTrigger[idx].toFixed(0)}</span></div>
    </div>

    <div class="param-section">
      <h3>交互状态</h3>
      <div class="param-row"><span class="param-name">已知文明数</span><span class="param-val">${d.knownCivs[idx]}</span></div>
      <div class="param-row"><span class="param-name">坐标暴露</span><span class="param-val ${d.exposed[idx] ? 'red' : 'green'}">${d.exposed[idx] ? '已暴露 ⚠' : '隐藏中'}</span></div>
    </div>
  `;
  document.getElementById('panel-content').innerHTML = html;

  // Position highlight ring and glow
  highlightRing.visible = true;
  highlightRing.position.set(d.px[idx], d.py[idx], d.pz[idx]);
  highlightRing.lookAt(camera.position);
  highlightGlow.visible = true;
  highlightGlow.position.set(d.px[idx], d.py[idx], d.pz[idx]);
}

function closePanel() {
  document.getElementById('right-panel').classList.remove('open');
  selectedCivIdx = -1;
  highlightRing.visible = false;
  highlightGlow.visible = false;
}

function randomCiv() {
  // Collect all alive civs, pick one at random
  const alive = [];
  for (let i = 0; i < C.CIV_COUNT; i++) {
    if (civData.alive[i]) alive.push(i);
  }
  if (alive.length === 0) return;
  const idx = alive[Math.floor(Math.random() * alive.length)];
  selectCiv(idx);
}

// ============================================================
//  EVENT LOG & SIDEBAR
// ============================================================
const logEntries = [];
const MAX_LOG = 200;
let eventTabFilter = 'all';
let eventCounts = { attack: 0, comm: 0, trade: 0, death: 0 };
let sidebarNeedsRender = false;

function addLog(type, msg) {
  const timeStr = simTime < 0.001 ? '初始纪元' : simTime.toFixed(1) + ' 百万年';
  logEntries.unshift({ type, msg, time: timeStr, id: logEntries.length });
  if (logEntries.length > MAX_LOG) logEntries.pop();

  if (type === 'attack') eventCounts.attack++;
  else if (type === 'comm') eventCounts.comm++;
  else if (type === 'trade') eventCounts.trade++;
  else if (type === 'death') eventCounts.death++;

  sidebarNeedsRender = true;
}

function flushLogs() {
  const timeStr = simTime < 0.001 ? '初始纪元' : simTime.toFixed(1) + ' 百万年';
  for (let k = 0; k < pendingLogs.length; k++) {
    const p = pendingLogs[k];
    logEntries.unshift({ type: p.type, msg: p.msg, time: timeStr, id: logEntries.length });
    if (logEntries.length > MAX_LOG) logEntries.pop();
    if (p.type === 'attack') eventCounts.attack++;
    else if (p.type === 'comm') eventCounts.comm++;
    else if (p.type === 'trade') eventCounts.trade++;
    else if (p.type === 'death') eventCounts.death++;
  }
  pendingLogs = [];
  sidebarNeedsRender = true;
}

const typeLabels = {
  attack: '攻击', comm: '通信', trade: '贸易', death: '毁灭', system: '系统'
};

function renderSidebarEvents() {
  const container = document.getElementById('sidebar-events');
  if (!container) return;

  const filtered = eventTabFilter === 'all' ? logEntries : logEntries.filter(e => e.type === eventTabFilter);
  const display = filtered.slice(0, 50);

  let html = '';
  for (let k = 0; k < display.length; k++) {
    const e = display[k];
    html += '<div class="event-item ' + e.type + '"><div class="e-time">[' + e.time + ']</div><span class="e-type">' + (typeLabels[e.type] || e.type) + '</span><span class="e-msg">' + e.msg + '</span></div>';
  }
  container.innerHTML = html;
}

function updateSidebarStats() {
  const el = (id) => document.getElementById(id);
  if (el('side-attacks')) el('side-attacks').textContent = eventCounts.attack.toLocaleString();
  if (el('side-comms')) el('side-comms').textContent = eventCounts.comm.toLocaleString();
  if (el('side-trades')) el('side-trades').textContent = eventCounts.trade.toLocaleString();
  if (el('side-deaths')) el('side-deaths').textContent = eventCounts.death.toLocaleString();

  // Update tab counts
  if (el('tab-all')) el('tab-all').innerHTML = '全部';
  if (el('tab-attack')) el('tab-attack').innerHTML = `攻击 <span class="tab-count">${eventCounts.attack}</span>`;
  if (el('tab-comm')) el('tab-comm').innerHTML = `通信 <span class="tab-count">${eventCounts.comm}</span>`;
  if (el('tab-trade')) el('tab-trade').innerHTML = `贸易 <span class="tab-count">${eventCounts.trade}</span>`;
}

function setEventTab(tab) {
  eventTabFilter = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderSidebarEvents();
}

function toggleSidebar() {
  const sidebar = document.getElementById('left-sidebar');
  const expandBtn = document.getElementById('sidebar-expand-btn');
  sidebar.classList.toggle('collapsed');
  if (sidebar.classList.contains('collapsed')) {
    expandBtn.style.display = 'block';
  } else {
    expandBtn.style.display = 'none';
  }
}

// ============================================================
//  MINIMAP
// ============================================================
const minimapCtx = document.getElementById('minimap-canvas').getContext('2d');

function drawMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const scale = Math.min(w, h) / (C.RADIUS * 2.2);
  minimapCtx.fillStyle = 'rgba(3,6,13,0.9)';
  minimapCtx.fillRect(0, 0, w, h);

  // Boundary circle
  minimapCtx.strokeStyle = 'rgba(40,180,220,0.15)';
  minimapCtx.lineWidth = 1;
  minimapCtx.beginPath();
  minimapCtx.arc(cx, cy, C.RADIUS * scale, 0, Math.PI * 2);
  minimapCtx.stroke();

  // Sample points for minimap (draw subset - reduced for perf)
  const sample = 5000;
  const step = Math.floor(C.CIV_COUNT / sample);
  for (let i = 0; i < C.CIV_COUNT; i += step) {
    if (!civData.alive[i]) continue;
    const x = cx + civData.px[i] * scale;
    const y = cy + civData.pz[i] * scale;
    if (x < 0 || x > w || y < 0 || y > h) continue;
    const t = civData.type[i];
    minimapCtx.fillStyle = t === 1 ? 'rgba(0,200,255,0.5)' : t === 2 ? 'rgba(0,255,120,0.4)' : 'rgba(255,120,50,0.4)';
    minimapCtx.fillRect(x, y, 1, 1);
  }

  // Selected civ marker
  if (selectedCivIdx >= 0 && civData.alive[selectedCivIdx]) {
    const sx = cx + civData.px[selectedCivIdx] * scale;
    const sy = cy + civData.pz[selectedCivIdx] * scale;
    minimapCtx.strokeStyle = '#ffffff';
    minimapCtx.lineWidth = 2;
    minimapCtx.beginPath();
    minimapCtx.arc(sx, sy, 4, 0, Math.PI * 2);
    minimapCtx.stroke();
  }
}

// ============================================================
//  CONTROLS
// ============================================================
const SPEED_MAP = [0, 0.25, 1, 4, 16, 64];
const SPEED_LABELS = ['0x', '0.25x', '1x', '4x', '16x', '64x'];

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('btn-play');
  btn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btn.classList.toggle('active', playing);
}

function stepOnce() {
  if (!playing) {
    simTime += stepSize / 1e6;
    const r = simStep();
    syncBuffers();
    updateStatsDisplay(r);
    drawMinimap();
    if (selectedCivIdx >= 0 && civData.alive[selectedCivIdx]) selectCiv(selectedCivIdx);
  }
}

function resetSim() {
  simTime = 0;
  totalAttacks = 0; totalComms = 0;
  logEntries.length = 0;
  pendingLogs = [];
  eventCounts = { attack: 0, comm: 0, trade: 0, death: 0 };
  colorsDirty = true;
  sidebarNeedsRender = false;
  renderSidebarEvents();
  updateSidebarStats();
  initData();
  generateCivs();
  syncBuffers();
  updateStatsDisplay({ alive: 0, deaths: 0, attacks: 0, comms: 0, typeCount: [0, 0, 0, 0] });
  drawMinimap();
  closePanel();
}

function setSpeed(val) {
  speedMultiplier = SPEED_MAP[val];
  document.getElementById('speed-display').textContent = SPEED_LABELS[val];
}

function setStepSize(val) {
  stepSize = parseInt(val);
  if (stepSize >= 1000) {
    document.getElementById('step-display').textContent = (stepSize / 1000).toFixed(1) + ' 千年';
  } else {
    document.getElementById('step-display').textContent = stepSize + ' 年';
  }
}

function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.ctrl-btn[id^="btn-filter"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-filter-' + (mode === 'all' ? 'all' : mode)).classList.add('active');
  syncBuffers();
}

function updateStatsDisplay(result) {
  document.getElementById('stat-time').textContent = simTime.toFixed(1) + ' 百万年';
  document.getElementById('stat-alive').textContent = result.alive.toLocaleString();
  document.getElementById('stat-dead').textContent = (C.CIV_COUNT - result.alive).toLocaleString();
  document.getElementById('stat-attacks').textContent = totalAttacks.toLocaleString();
  document.getElementById('stat-comms').textContent = totalComms.toLocaleString();

  // Type ratios
  if (result.typeCount) {
    const alive = Math.max(1, result.alive);
    const t1 = (result.typeCount[1] / alive * 100).toFixed(1);
    const t2 = (result.typeCount[2] / alive * 100).toFixed(1);
    const t3 = (result.typeCount[3] / alive * 100).toFixed(1);
    document.getElementById('stat-ratio-t1').textContent = t1 + '%';
    document.getElementById('stat-ratio-t2').textContent = t2 + '%';
    document.getElementById('stat-ratio-t3').textContent = t3 + '%';
  }

  // Sidebar render deferred
  if (sidebarNeedsRender) {
    renderSidebarEvents();
    updateSidebarStats();
    sidebarNeedsRender = false;
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastSimTime = 0;
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  frameCount++;

  controls.update();

  // Simulation tick
  if (playing && speedMultiplier > 0) {
    // With 1000yr steps, run multiple steps per frame based on speed
    const stepsPerFrame = Math.max(1, Math.min(16, Math.round(speedMultiplier)));
    let lastResult = null;
    for (let s = 0; s < stepsPerFrame; s++) {
      simTime += stepSize / 1e6; // convert years to Myr
      const r = simStep();
      lastResult = r;
    }
    // Sync GPU buffers once per frame
    syncBuffers();
    updateStatsDisplay(lastResult);

    // Update selected panel less frequently
    if (selectedCivIdx >= 0 && frameCount % 20 === 0) {
      if (civData.alive[selectedCivIdx]) selectCiv(selectedCivIdx);
    }

    // Minimap update very infrequently
    if (frameCount % 30 === 0) drawMinimap();
  }

  // Highlight ring face camera + glow pulse
  if (highlightRing.visible) {
    highlightRing.lookAt(camera.position);
    // Pulsing glow
    const pulse = 0.85 + 0.15 * Math.sin(frameCount * 0.08);
    highlightGlow.material.opacity = pulse;
    highlightGlow.scale.set(130 + 20 * Math.sin(frameCount * 0.05), 130 + 20 * Math.sin(frameCount * 0.05), 1);
    highlightRing.material.opacity = 0.5 + 0.3 * Math.sin(frameCount * 0.06);
  }

  renderer.render(scene, camera);
}

// ============================================================
//  INIT
// ============================================================
function init() {
  initData();
  generateCivs();
  initThree();
  syncBuffers();
  // All civs start dormant (alive=0)
  updateStatsDisplay({ alive: 0, deaths: 0, attacks: 0, comms: 0, typeCount: [0, 0, 0, 0] });
  drawMinimap();

  // Set default filter active
  document.getElementById('btn-filter-all').classList.add('active');

  animate();

  console.log('宇宙文明模拟器已初始化: ' + C.CIV_COUNT + ' 个文明等待诞生，球体半径 ' + (C.RADIUS * 2) + ' 光年');
}

init();
</script>
