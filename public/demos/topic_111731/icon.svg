<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Calculator body -->
  <rect x="140" y="160" width="232" height="280" rx="20" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Calculator screen -->
  <rect x="160" y="180" width="192" height="60" rx="8" fill="#FFF8F0" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Screen text -->
  <text x="256" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">123</text>
  
  <!-- Calculator buttons - row 1 -->
  <circle cx="190" cy="270" r="22" fill="#FFE4B5"/>
  <circle cx="256" cy="270" r="22" fill="#FFE4B5"/>
  <circle cx="322" cy="270" r="22" fill="#FFE4B5"/>
  
  <!-- Calculator buttons - row 2 -->
  <circle cx="190" cy="320" r="22" fill="#FFE4B5"/>
  <circle cx="256" cy="320" r="22" fill="#FFE4B5"/>
  <circle cx="322" cy="320" r="22" fill="#FF8C00"/>
  
  <!-- Calculator buttons - row 3 -->
  <circle cx="190" cy="370" r="22" fill="#FFE4B5"/>
  <circle cx="256" cy="370" r="22" fill="#FFE4B5"/>
  <circle cx="322" cy="370" r="22" fill="#FFE4B5"/>
  
  <!-- Calculator buttons - row 4 -->
  <circle cx="190" cy="420" r="22" fill="#FFE4B5"/>
  <circle cx="256" cy="420" r="22" fill="#FF8C00"/>
  <circle cx="322" cy="420" r="22" fill="#FF8C00"/>
  
  <!-- Trophy on top -->
  <g transform="translate(256, 100)">
    <!-- Trophy cup -->
    <path d="M-40 0 L-40 40 Q-40 70 0 70 Q40 70 40 40 L40 0 Z" fill="#FFD700"/>
    <!-- Trophy handles -->
    <path d="M-40 10 Q-70 10 -70 35 Q-70 50 -45 50" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
    <path d="M40 10 Q70 10 70 35 Q70 50 45 50" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
    <!-- Trophy base -->
    <rect x="-25" y="70" width="50" height="15" rx="3" fill="#FFD700"/>
    <rect x="-35" y="85" width="70" height="12" rx="3" fill="#FFB347"/>
    <!-- Trophy star -->
    <polygon points="0,15 5,25 16,25 7,32 10,43 0,36 -10,43 -7,32 -16,25 -5,25" fill="#FFF8F0"/>
  </g>
  
  <!-- Decorative stars -->
  <text x="100" y="140" font-size="40">⭐</text>
  <text x="380" y="130" font-size="30">✨</text>
  <text x="400" y="420" font-size="35">🌟</text>
</svg>
