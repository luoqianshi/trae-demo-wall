<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杀死那个撒谎者 - Demo演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #0F0F23 50%, #1F2937 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 90%, rgba(139, 92, 246, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(6, 182, 212, 0.18) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        .demo-container {
            display: flex;
            gap: 50px;
            max-width: 980px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .extension-mock {
            width: 420px;
            flex-shrink: 0;
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.35), 
                0 0 60px rgba(139, 92, 246, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
        }

        .extension-mock::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            z-index: 10;
        }

        .info-panel {
            flex: 1;
            color: #F9FAFB;
            padding-top: 40px;
        }

        .info-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 40%, #06B6D4 80%, #22D3EE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .info-subtitle {
            font-size: 14px;
            color: #9CA3AF;
            margin-bottom: 28px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .info-desc {
            font-size: 14px;
            line-height: 1.85;
            color: #D1D5DB;
            margin-bottom: 28px;
        }

        .feature-list {
            list-style: none;
            margin-bottom: 28px;
        }

        .feature-list li {
            padding: 14px 18px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #D1D5DB;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(139, 92, 246, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .feature-list li:hover {
            transform: translateX(4px);
            border-color: rgba(139, 92, 246, 0.25);
            background: rgba(31, 41, 55, 0.7);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.1);
        }

        .feature-list li::before {
            content: '⚡';
            font-size: 16px;
            filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.5));
        }

        .test-data-section {
            margin-top: 28px;
            padding: 22px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(10px);
        }

        .test-data-title {
            font-size: 15px;
            font-weight: 700;
            color: #F9FAFB;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-data-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, #8B5CF6, #06B6D4);
            border-radius: 2px;
        }

        .test-data-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 50%, #06B6D4 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .test-data-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .test-data-btn:hover::before {
            left: 100%;
        }

        .test-data-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }

        .test-data-btn:active {
            transform: translateY(0);
        }

        .test-data-btn.secondary {
            background: rgba(139, 92, 246, 0.1);
            color: #8B5CF6;
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .test-data-btn.secondary:hover {
            background: rgba(139, 92, 246, 0.2);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
        }

        @media (max-width: 900px) {
            .demo-container {
                flex-direction: column;
                align-items: center;
            }

            .info-panel {
                text-align: center;
                padding-top: 0;
            }

            .feature-list li {
                justify-content: center;
            }

            .test-data-title {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="extension-mock">
            <iframe 
                id="extensionFrame" 
                src="popup.html" 
                style="width: 100%; height: 600px; border: none;"
            ></iframe>
        </div>
        <div class="info-panel">
            <h1 class="info-title">杀死那个撒谎者</h1>
            <div class="info-subtitle">⚔️ AI引用两阶段验真工具</div>
            <p class="info-desc">
                AI引用两阶段验真工具，让虚假引用无处遁形。
                通过Crossref学术数据库验证论文是否存在，
                并通过语义相似度比对判断AI描述是否准确。
            </p>
            
            <ul class="feature-list">
                <li>第一阶段：存在性验真（打假幽灵论文）</li>
                <li>第二阶段：内容一致性验真（打假张冠李戴）</li>
                <li>基于Crossref API的真实学术数据查询</li>
                <li>余弦相似度+Jaccard相似度算法</li>
                <li>综合可信度评分</li>
                <li>双栏对比视图</li>
                <li>历史记录保存</li>
            </ul>

            <div class="test-data-section">
                <div class="test-data-title">🎯 快速体验</div>
                <button class="test-data-btn" onclick="loadTestData()">一键演示（推荐）</button>
                <button class="test-data-btn secondary" onclick="loadRealPapers()">真实论文测试</button>
                <button class="test-data-btn secondary" onclick="loadMixedData()">混合场景测试</button>
            </div>
        </div>
    </div>

    <script>
        const testData = `1. Zhang, Y. (2021). "Attention Is All You Need: Transformer Architecture for NLP." 该论文提出了Transformer架构，完全基于注意力机制，摒弃了传统的循环神经网络结构，在机器翻译任务上取得了state-of-the-art的效果。
2. Li, M. (2022). "Deep Learning for Medical Imaging Diagnosis." 该论文研究了深度学习在医学影像诊断中的应用，提出了一种基于CNN的肺炎检测模型，准确率达到99%。
3. Wang, L. (2019). "AI Ethics in Autonomous Vehicles." 该论文认为自动驾驶的伦理决策应基于功利主义框架，提出了三层决策模型。
4. FakePaper, X. (2025). "The Future of AI Generated Fake Research." Journal of Nonexistent Studies. 这是一篇完全编造的不存在的论文，用于测试工具的识别能力。
5. Chen, H. (2020). "Reinforcement Learning for Robotics Manipulation." 该论文研究了强化学习在机器人抓取任务中的应用，提出了一种新的奖励函数设计方法，在多个基准测试上取得了显著提升。
6. Liu, S. (2018). "Quantum Computing for Optimization Problems." 该论文探讨了量子计算在组合优化问题中的应用，与经典模拟退火算法进行了详细对比分析。`;

        const realPapersData = `1. Vaswani, A. (2017). "Attention Is All You Need." arXiv preprint arXiv:1706.03762. 该论文提出了Transformer架构，一种完全基于注意力机制的神经网络模型，用于序列到序列的自然语言处理任务。
2. He, K. (2016). "Deep Residual Learning for Image Recognition." Proceedings of the IEEE conference on computer vision and pattern recognition. 该论文提出了残差网络（ResNet），通过跳跃连接解决了深度神经网络的退化问题。
3. Brown, T. B. (2020). "Language Models are Few-Shot Learners." Advances in neural information processing systems. 该论文介绍了GPT-3语言模型，展示了大语言模型在少样本学习方面的强大能力。
4. FakePaper, X. (2025). "The Future of AI Generated Fake Research." Journal of Nonexistent Studies. 这是一篇完全编造的不存在的论文，用于测试工具的识别能力。
5. LeCun, Y. (2015). "Deep Learning." Nature, 521(7553), 436-444. 该论文综述了深度学习的发展历史、核心技术和应用前景，由深度学习三位奠基人共同撰写。`;

        const mixedData = `1. Smith, J. (2020). "Deep Learning for Medical Imaging." Nature Medicine. 该论文提出了一种新的CNN架构，在肺炎诊断中准确率达99%。
2. Vaswani, A. (2017). "Attention Is All You Need." 该论文提出了Transformer架构，在机器翻译任务上取得了突破性进展。
3. Wang, L. (2019). "AI Ethics in Autonomous Vehicles." 该论文认为自动驾驶的伦理决策应基于功利主义框架。
4. FakeAuthor, Z. (2024). "Nonexistent Paper About Quantum AI." Journal of Fake Research. 这是一篇编造的论文，声称实现了量子AI突破。
5. LeCun, Y. (2015). "Deep Learning." Nature. 该论文综述了深度学习的核心技术和应用前景。
6. Zhang, H. (2021). "Reinforcement Learning for Game Playing." 该论文研究了强化学习在Atari游戏中的应用，提出了一种新的DQN改进方法。`;

        function loadTestData() {
            const iframe = document.getElementById('extensionFrame');
            iframe.contentWindow.postMessage({
                action: 'loadTestData',
                data: testData
            }, '*');
        }

        function loadRealPapers() {
            const iframe = document.getElementById('extensionFrame');
            iframe.contentWindow.postMessage({
                action: 'loadTestData',
                data: realPapersData
            }, '*');
        }

        function loadMixedData() {
            const iframe = document.getElementById('extensionFrame');
            iframe.contentWindow.postMessage({
                action: 'loadTestData',
                data: mixedData
            }, '*');
        }
    </script>
</body>
</html>
