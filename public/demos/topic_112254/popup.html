<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杀死那个撒谎者</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">🔍</div>
            <h1 class="title">杀死那个撒谎者</h1>
            <p class="subtitle">AI引用两阶段验真工具</p>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 输入区 -->
            <div class="input-section">
                <div class="section-label">
                    <span class="icon">📝</span>
                    <span>粘贴AI生成的论文引用列表</span>
                </div>
                <textarea 
                    id="inputText" 
                    class="input-textarea"
                    placeholder="例如：
1. Smith, J. (2020). &quot;Deep Learning for Medical Imaging.&quot; Nature Medicine. 该论文提出了一种新的CNN架构，在肺炎诊断中准确率达99%。
2. Wang, L. (2019). &quot;AI Ethics in Autonomous Vehicles.&quot; 该论文认为自动驾驶的伦理决策应基于功利主义框架。"
                    rows="6"
                ></textarea>
                <button id="verifyBtn" class="verify-btn">
                    <span class="btn-icon">⚔️</span>
                    <span class="btn-text">开始验真</span>
                </button>
            </div>

            <!-- 进度条 -->
            <div id="progressSection" class="progress-section hidden">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">正在验证...</span>
                </div>
            </div>

            <!-- 统计区 -->
            <div id="statsSection" class="stats-section hidden">
                <div class="stats-header">
                    <span class="icon">📊</span>
                    <span>验证结果统计</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item total">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">总计</div>
                    </div>
                    <div class="stat-item pass">
                        <div class="stat-number" id="passCount">0</div>
                        <div class="stat-label">✅ 可信</div>
                    </div>
                    <div class="stat-item warning">
                        <div class="stat-number" id="warningCount">0</div>
                        <div class="stat-label">⚠️ 部分歪曲</div>
                    </div>
                    <div class="stat-item fail">
                        <div class="stat-number" id="failCount">0</div>
                        <div class="stat-label">❌ 造假</div>
                    </div>
                </div>
                <div class="credibility-box">
                    <div class="credibility-label">AI回答综合可信度</div>
                    <div class="credibility-score" id="credibilityScore">0%</div>
                </div>
            </div>

            <!-- 结果列表 -->
            <div id="resultsSection" class="results-section hidden">
                <div class="results-header">
                    <span class="icon">📋</span>
                    <span>详细结果</span>
                </div>
                <div id="resultsList" class="results-list"></div>
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">💡</div>
                <div class="empty-title">开始你的第一次验真</div>
                <div class="empty-desc">粘贴AI生成的论文引用，一键识别虚假引用</div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <span>TRAE AI创造力大赛 · 学习工作赛道</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
