<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="盲人手机输入法 - 基于盲文原理的触屏输入系统">
    <title>盲文输入法 - 基于盲文原理的触屏输入系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --dot-active: #2563eb;
            --dot-inactive: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border-color: #334155;
                --dot-active: #60a5fa;
                --dot-inactive: #475569;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .main-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .output-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            min-height: 120px;
        }

        .output-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-text {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-primary);
            min-height: 60px;
            word-break: break-all;
        }

        .output-cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background: var(--primary-color);
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .current-input-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .current-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            min-height: 40px;
            align-items: center;
        }

        .dot-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--dot-inactive);
            transition: all 0.2s ease;
        }

        .dot-indicator.active {
            background: var(--dot-active);
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--dot-active);
        }

        .braille-display {
            text-align: center;
            font-size: 48px;
            color: var(--text-primary);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .braille-char {
            font-family: monospace;
        }

        .pinyin-display {
            text-align: center;
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 4px;
            min-height: 24px;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .mode-tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-tab.active {
            background: var(--primary-color);
            color: white;
        }

        .mode-tab:active {
            transform: scale(0.98);
        }

        .braille-keyboard {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 16px;
            box-shadow: var(--shadow);
        }

        .keyboard-title {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 280px;
            margin: 0 auto 20px;
            padding: 0 20px;
        }

        .dot-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .dot-btn::before {
            content: attr(data-number);
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .dot-btn:active,
        .dot-btn.pressed {
            background: var(--dot-active);
            border-color: var(--dot-active);
            color: white;
            transform: scale(0.95);
        }

        .dot-btn:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action-btn {
            padding: 16px 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .action-btn .icon {
            font-size: 20px;
        }

        .action-btn.secondary {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .action-btn.primary {
            background: var(--primary-color);
            color: white;
        }

        .action-btn.danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .suggestions-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        .suggestions-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .suggestions-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .suggestion-item {
            flex-shrink: 0;
            padding: 10px 16px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-item:active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: scale(0.96);
        }

        .tutorial-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .tutorial-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .tutorial-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .tutorial-content .letter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 2px 4px;
            padding: 4px 8px;
            background: var(--bg-color);
            border-radius: 6px;
            font-family: monospace;
        }

        .settings-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            z-index: 200;
            transition: all 0.2s ease;
        }

        .settings-toggle:active {
            transform: scale(0.92);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .settings-panel.open {
            display: flex;
        }

        .settings-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-header h2 {
            font-size: 18px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--border-color);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .setting-item .setting-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .toggle-switch {
            position: relative;
            width: 52px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.3s;
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--primary-color);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .voice-select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .speed-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }

        .welcome-overlay h1 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-overlay p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 320px;
            line-height: 1.6;
        }

        .start-btn {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }

        .start-btn:active {
            transform: scale(0.96);
        }

        .braille-reference {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .braille-ref-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: var(--bg-color);
            border-radius: 8px;
        }

        .braille-ref-item .dots-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px;
            margin-bottom: 4px;
        }

        .dot-mini {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-inactive);
        }

        .dot-mini.filled {
            background: var(--dot-active);
        }

        .braille-ref-item .letter {
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 360px) {
            .dots-grid {
                gap: 12px;
            }
            
            .dot-btn {
                font-size: 20px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="welcome-overlay" id="welcomeOverlay">
        <h1>🔤 盲文输入法</h1>
        <p>基于盲文原理的触屏输入系统<br>让视障用户用"母语"连接数字世界</p>
        <button class="start-btn" onclick="startApp()">开始体验</button>
    </div>

    <div class="app-container" id="appContainer">
        <header class="header">
            <h1>🔤 盲文输入法</h1>
            <p>基于盲文六点制的触屏输入系统</p>
        </header>

        <main class="main-content">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">输入字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="speedCount">0</div>
                    <div class="stat-label">字/分钟</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="accuracyCount">100%</div>
                    <div class="stat-label">准确率</div>
                </div>
            </div>

            <div class="output-section">
                <div class="output-label">
                    <span>📝 输入内容</span>
                    <span style="cursor: pointer;" onclick="clearAll()" title="清空全部">🗑️ 清空</span>
                </div>
                <div class="output-text" id="outputText">
                    <span class="output-cursor"></span>
                </div>
            </div>

            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="braille" onclick="switchMode('braille')">盲文模式</button>
                <button class="mode-tab" data-mode="number" onclick="switchMode('number')">数字模式</button>
                <button class="mode-tab" data-mode="symbol" onclick="switchMode('symbol')">符号模式</button>
            </div>

            <div class="current-input-section">
                <div class="current-dots" id="currentDots">
                    <div class="dot-indicator" data-dot="1"></div>
                    <div class="dot-indicator" data-dot="2"></div>
                    <div class="dot-indicator" data-dot="3"></div>
                    <div class="dot-indicator" data-dot="4"></div>
                    <div class="dot-indicator" data-dot="5"></div>
                    <div class="dot-indicator" data-dot="6"></div>
                </div>
                <div class="braille-display" id="brailleDisplay">⠀</div>
                <div class="pinyin-display" id="pinyinDisplay">点击盲文点位开始输入...</div>
            </div>

            <div class="braille-keyboard">
                <div class="keyboard-title" id="keyboardTitle">盲文六点输入面板</div>
                <div class="dots-grid" id="dotsGrid">
                    <button class="dot-btn" data-number="1" data-dot="1" aria-label="点位1"></button>
                    <button class="dot-btn" data-number="4" data-dot="4" aria-label="点位4"></button>
                    <button class="dot-btn" data-number="2" data-dot="2" aria-label="点位2"></button>
                    <button class="dot-btn" data-number="5" data-dot="5" aria-label="点位5"></button>
                    <button class="dot-btn" data-number="3" data-dot="3" aria-label="点位3"></button>
                    <button class="dot-btn" data-number="6" data-dot="6" aria-label="点位6"></button>
                </div>
                <div class="action-buttons">
                    <button class="action-btn secondary" onclick="deleteLastChar()">
                        <span class="icon">⌫</span>
                        <span>退格</span>
                    </button>
                    <button class="action-btn primary" onclick="confirmInput()">
                        <span class="icon">✓</span>
                        <span>确认输入</span>
                    </button>
                    <button class="action-btn secondary" onclick="clearCurrent()">
                        <span class="icon">↻</span>
                        <span>重选</span>
                    </button>
                </div>
            </div>

            <div class="suggestions-section">
                <div class="suggestions-label">💡 联想候选（点击选择）</div>
                <div class="suggestions-list" id="suggestionsList">
                    <div class="suggestion-item" onclick="insertSuggestion('你好')">你好</div>
                    <div class="suggestion-item" onclick="insertSuggestion('谢谢')">谢谢</div>
                    <div class="suggestion-item" onclick="insertSuggestion('再见')">再见</div>
                    <div class="suggestion-item" onclick="insertSuggestion('好的')">好的</div>
                </div>
            </div>

            <div class="tutorial-section">
                <h3>📖 盲文速查表</h3>
                <div class="tutorial-content">
                    <p>盲文六点制：左侧1、2、3点，右侧4、5、6点</p>
                    <div class="braille-reference">
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">a / 1</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">b / 2</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">c / 3</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">d / 4</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">e / 5</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">f / 6</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>
                                <div class="dot-mini"></div><div class="dot-mini"></div>
                            </div>
                            <span class="letter">g / 7</span>
                        </div>
                        <div class="braille-ref-item">
                            <div class="dots-mini">
                                <div class="dot-mini filled"></div><div class="dot-mini"></div>
                                <div class="dot-mini filled"></div><div class="dot-mini filled"></div>

        let currentPinyin = '';
        let pinyinBuffer = '';

        function init() {
            setupDots();
            setupVoice();
            loadSettings();
            updateStats();
        }

        function setupDots() {
            const dotBtns = document.querySelectorAll('.dot-btn');
            
            dotBtns.forEach(btn => {
                const dotNum = btn.getAttribute('data-dot');
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    toggleDot(dotNum, btn);
                });
                
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    toggleDot(dotNum, btn);
                });

                btn.addEventListener('keydown', (e) => {
                    if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        toggleDot(dotNum, btn);
                    }
                });
            });
        }

        function toggleDot(dotNum, btn) {
            if (state.selectedDots.has(dotNum)) {
                state.selectedDots.delete(dotNum);
                btn.classList.remove('pressed');
            } else {
                state.selectedDots.add(dotNum);
                btn.classList.add('pressed');
                
                if (state.settings.vibration && navigator.vibrate) {
                    navigator.vibrate(30);
                }
                
                if (state.settings.voice) {
                    speak(`点位${dotNum}`);
                }
                
                if (state.settings.sound) {
                    playClickSound();
                }
            }
            
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
        }

        function updateDotIndicators() {
            const indicators = document.querySelectorAll('.dot-indicator');
            indicators.forEach(indicator => {
                const dotNum = indicator.getAttribute('data-dot');
                if (state.selectedDots.has(dotNum)) {
                    indicator.classList.add('active');
                } else {
                    indicator.classList.remove('active');
                }
            });
        }

        function getDotsKey() {
            return Array.from(state.selectedDots).sort().join('');
        }

        function getCurrentMap() {
            switch (state.currentMode) {
                case 'number': return numberMap;
                case 'symbol': return symbolMap;
                default: return brailleMap;
            }
        }

        function updateCurrentDisplay() {
            const dotsKey = getDotsKey();
            const map = getCurrentMap();
            const entry = map[dotsKey] || map[''];
            
            document.getElementById('brailleDisplay').textContent = entry.braille || '⠀';
            
            if (state.currentMode === 'braille') {
                if (entry.char) {
                    pinyinBuffer += entry.char;
                    const hanzi = pinyinDict[pinyinBuffer];
                    if (hanzi) {
                        document.getElementById('pinyinDisplay').textContent = 
                            `${pinyinBuffer} - ${hanzi.slice(0, 3).join('、')}`;
                    } else {
                        document.getElementById('pinyinDisplay').textContent = pinyinBuffer;
                    }
                } else {
                    document.getElementById('pinyinDisplay').textContent = 
                        pinyinBuffer || '点击盲文点位开始输入...';
                }
            } else if (state.currentMode === 'number') {
                document.getElementById('pinyinDisplay').textContent = 
                    entry.char ? `数字 ${entry.char}（${entry.label}）` : '选择点位输入数字...';
            } else if (state.currentMode === 'symbol') {
                document.getElementById('pinyinDisplay').textContent = 
                    entry.char ? `符号 ${entry.char}（${entry.label}）` : '选择点位输入符号...';
            }
        }

        function updateSuggestions() {
            const list = document.getElementById('suggestionsList');
            
            if (state.currentMode === 'braille' && pinyinBuffer) {
                const hanzi = pinyinDict[pinyinBuffer];
                if (hanzi && hanzi.length > 0) {
                    list.innerHTML = hanzi.slice(0, 8).map(h => 
                        `<div class="suggestion-item" onclick="insertSuggestion('${h}')">${h}</div>`
                    ).join('');
                    return;
                }
            }
            
            list.innerHTML = `
                <div class="suggestion-item" onclick="insertSuggestion('你好')">你好</div>
                <div class="suggestion-item" onclick="insertSuggestion('谢谢')">谢谢</div>
                <div class="suggestion-item" onclick="insertSuggestion('再见')">再见</div>
                <div class="suggestion-item" onclick="insertSuggestion('好的')">好的</div>
            `;
        }

        function insertSuggestion(text) {
            state.outputText += text;
            updateOutput();
            state.charCount += text.length;
            pinyinBuffer = '';
            state.selectedDots.clear();
            clearDotButtons();
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
            updateStats();
            
            if (state.settings.voice) {
                speak(text);
            }
            
            if (state.settings.vibration && navigator.vibrate) {
                navigator.vibrate([50, 30, 50]);
            }
        }

        function confirmInput() {
            const dotsKey = getDotsKey();
            const map = getCurrentMap();
            const entry = map[dotsKey];
            
            if (!entry || !entry.char) {
                if (state.settings.voice) {
                    speak('请先选择点位');
                }
                return;
            }
            
            if (state.currentMode === 'braille') {
                if (pinyinBuffer && pinyinDict[pinyinBuffer]) {
                    const hanzi = pinyinDict[pinyinBuffer][0];
                    state.outputText += hanzi;
                    state.charCount++;
                    
                    if (state.settings.voice) {
                        speak(hanzi);
                    }
                } else {
                    state.outputText += entry.char;
                    state.charCount++;
                    
                    if (state.settings.voice) {
                        speak(entry.char);
                    }
                }
            } else {
                state.outputText += entry.char;
                state.charCount++;
                
                if (state.settings.voice) {
                    speak(entry.label || entry.char);
                }
            }
            
            updateOutput();
            state.selectedDots.clear();
            pinyinBuffer = '';
            clearDotButtons();
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
            updateStats();
            
            if (state.settings.vibration && navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        function clearCurrent() {
            state.selectedDots.clear();
            pinyinBuffer = '';
            clearDotButtons();
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
            
            if (state.settings.voice) {
                speak('已清除当前选择');
            }
        }

        function clearDotButtons() {
            document.querySelectorAll('.dot-btn').forEach(btn => {
                btn.classList.remove('pressed');
            });
        }

        function deleteLastChar() {
            if (state.outputText.length > 0) {
                state.outputText = state.outputText.slice(0, -1);
                state.charCount = Math.max(0, state.charCount - 1);
                updateOutput();
                updateStats();
                
                if (state.settings.voice) {
                    speak('删除');
                }
                
                if (state.settings.vibration && navigator.vibrate) {
                    navigator.vibrate(20);
                }
            }
        }

        function clearAll() {
            if (state.outputText.length === 0) return;
            
            state.outputText = '';
            state.charCount = 0;
            pinyinBuffer = '';
            state.selectedDots.clear();
            clearDotButtons();
            updateOutput();
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
            updateStats();
            
            if (state.settings.voice) {
                speak('已清空全部内容');
            }
        }

        function updateOutput() {
            const outputEl = document.getElementById('outputText');
            outputEl.innerHTML = state.outputText + '<span class="output-cursor"></span>';
        }

        function switchMode(mode) {
            state.currentMode = mode;
            state.selectedDots.clear();
            pinyinBuffer = '';
            clearDotButtons();
            
            document.querySelectorAll('.mode-tab').forEach(tab => {
                if (tab.getAttribute('data-mode') === mode) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            const titles = {
                braille: '盲文六点输入面板',
                number: '数字输入面板',
                symbol: '符号输入面板'
            };
            document.getElementById('keyboardTitle').textContent = titles[mode];
            
            updateDotIndicators();
            updateCurrentDisplay();
            updateSuggestions();
            
            if (state.settings.voice) {
                speak(`切换到${mode === 'braille' ? '盲文' : mode === 'number' ? '数字' : '符号'}模式`);
            }
        }

        function setupVoice() {
            if ('speechSynthesis' in window) {
                const loadVoices = () => {
                    state.voices = speechSynthesis.getVoices();
                    const select = document.getElementById('voiceSelect');
                    select.innerHTML = '';
                    
                    const chineseVoices = state.voices.filter(v => 
                        v.lang.includes('zh') || v.lang.includes('cmn')
                    );
                    const otherVoices = state.voices.filter(v => 
                        !v.lang.includes('zh') && !v.lang.includes('cmn')
                    );
                    
                    [...chineseVoices, ...otherVoices].forEach((voice, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        select.appendChild(option);
                    });
                };
                
                loadVoices();
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        function speak(text) {
            if (!state.settings.voice || !('speechSynthesis' in window)) return;
            
            speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = state.settings.voiceRate;
            utterance.lang = 'zh-CN';
            
            if (state.voices.length > 0) {
                const voiceIndex = Math.min(state.settings.voiceIndex, state.voices.length - 1);
                utterance.voice = state.voices[voiceIndex];
            }
            
            speechSynthesis.speak(utterance);
        }

        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function updateSettings() {
            state.settings.voice = document.getElementById('voiceToggle').checked;
            state.settings.vibration = document.getElementById('vibrationToggle').checked;
            state.settings.sound = document.getElementById('soundToggle').checked;
            state.settings.voiceIndex = parseInt(document.getElementById('voiceSelect').value) || 0;
            saveSettings();
        }

        function updateVoiceRate() {
            const rate = document.getElementById('voiceRate').value;
            state.settings.voiceRate = parseFloat(rate);
            document.getElementById('voiceRateValue').textContent = rate + 'x';
            saveSettings();
        }

        function toggleDarkMode() {
            state.settings.darkMode = document.getElementById('darkModeToggle').checked;
            if (state.settings.darkMode) {
                document.documentElement.style.setProperty('--bg-color', '#0f172a');
                document.documentElement.style.setProperty('--card-bg', '#1e293b');
                document.documentElement.style.setProperty('--text-primary', '#f1f5f9');
                document.documentElement.style.setProperty('--text-secondary', '#94a3b8');
                document.documentElement.style.setProperty('--border-color', '#334155');
                document.documentElement.style.setProperty('--dot-active', '#60a5fa');
                document.documentElement.style.setProperty('--dot-inactive', '#475569');
            } else {
                document.documentElement.style.setProperty('--bg-color', '#f8fafc');
                document.documentElement.style.setProperty('--card-bg', '#ffffff');
                document.documentElement.style.setProperty('--text-primary', '#1e293b');
                document.documentElement.style.setProperty('--text-secondary', '#64748b');
                document.documentElement.style.setProperty('--border-color', '#e2e8f0');
                document.documentElement.style.setProperty('--dot-active', '#2563eb');
                document.documentElement.style.setProperty('--dot-inactive', '#cbd5e1');
            }
            saveSettings();
        }

        function toggleLargeButtons() {
            state.settings.largeButtons = document.getElementById('largeButtonsToggle').checked;
            const grid = document.getElementById('dotsGrid');
            if (state.settings.largeButtons) {
                grid.style.maxWidth = '340px';
                grid.style.gap = '20px';
            } else {
                grid.style.maxWidth = '280px';
                grid.style.gap = '16px';
            }
            saveSettings();
        }

        function saveSettings() {
            try {
                localStorage.setItem('brailleInputSettings', JSON.stringify(state.settings));
            } catch (e) {}
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('brailleInputSettings');
                if (saved) {
                    state.settings = { ...state.settings, ...JSON.parse(saved) };
                    
                    document.getElementById('voiceToggle').checked = state.settings.voice;
                    document.getElementById('vibrationToggle').checked = state.settings.vibration;
                    document.getElementById('soundToggle').checked = state.settings.sound;
                    document.getElementById('darkModeToggle').checked = state.settings.darkMode;
                    document.getElementById('largeButtonsToggle').checked = state.settings.largeButtons;
                    document.getElementById('voiceRate').value = state.settings.voiceRate;
                    document.getElementById('voiceRateValue').textContent = state.settings.voiceRate + 'x';
                    
                    if (state.settings.darkMode) toggleDarkMode();
                    if (state.settings.largeButtons) toggleLargeButtons();
                }
            } catch (e) {}
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('open');
        }

        function updateStats() {
            document.getElementById('charCount').textContent = state.charCount;
            
            if (!state.startTime && state.charCount > 0) {
                state.startTime = Date.now();
            }
            
            if (state.startTime && state.charCount > 0) {
                const minutes = (Date.now() - state.startTime) / 60000;
                const speed = Math.round(state.charCount / Math.max(minutes, 0.1));
                document.getElementById('speedCount').textContent = speed;
            }
        }

        function startApp() {
            document.getElementById('welcomeOverlay').classList.add('hidden');
            init();
            
            setTimeout(() => {
                speak('欢迎使用盲文输入法，请点击点位开始输入');
            }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const panel = document.getElementById('settingsPanel');
                if (panel.classList.contains('open')) {
                    toggleSettings();
                }
            }
            
            if (e.key === 'Enter') {
                confirmInput();
            }
            
            if (e.key === 'Backspace') {
                deleteLastChar();
            }
            
            const keyMap = {
                'q': '1', 'Q': '1',
                'a': '2', 'A': '2',
                'z': '3', 'Z': '3',
                'p': '4', 'P': '4',
                'l': '5', 'L': '5',
                'm': '6', 'M': '6'
            };
            
            if (keyMap[e.key]) {
                const dotNum = keyMap[e.key];
                const btn = document.querySelector(`.dot-btn[data-dot="${dotNum}"]`);
                if (btn) {
                    toggleDot(dotNum, btn);
                }
            }
        });

        document.getElementById('settingsPanel').addEventListener('click', (e) => {
            if (e.target.id === 'settingsPanel') {
                toggleSettings();
            }
        });
    </script>
