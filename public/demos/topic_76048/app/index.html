<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML魔术师 · 工作台 | 把想法变成页面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 背景星光层 -->
<div class="bg-stars" aria-hidden="true"></div>
<div class="bg-spotlight" aria-hidden="true"></div>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-hat">🎩</span>
    <span class="brand-name">HTML魔术师</span>
    <span class="brand-sub">HTML Magician</span>
  </div>
  <nav class="topnav">
    <a href="../html-magician.html" class="nav-link">← 返回介绍页</a>
  </nav>
</header>

<!-- 主工作区 -->
<main class="workspace">

  <!-- 左栏：输入控制 -->
  <section class="control-panel" aria-label="输入控制区">

    <!-- 场景模板选择 -->
    <div class="block">
      <div class="block-head">
        <span class="block-label">① 选个场景</span>
        <span class="block-hint">可选，魔术师也能自己猜</span>
      </div>
      <div class="scene-tags" id="sceneTags"></div>
    </div>

    <!-- 自然语言输入 -->
    <div class="block">
      <div class="block-head">
        <span class="block-label">② 描述你想要的页面</span>
        <span class="block-hint">像跟朋友说话一样</span>
      </div>
      <textarea id="promptInput" class="prompt-input"
        placeholder="比如：帮我做一个暖橘色色调的周末小市集活动页，包含活动时间地点、商品列表和价格、还有报名按钮…"></textarea>
      <div class="examples">
        <span class="examples-label">试试这些：</span>
        <div class="example-chips" id="exampleChips"></div>
      </div>
    </div>

    <!-- 生成按钮 -->
    <button id="generateBtn" class="magic-btn" type="button">
      <span class="magic-btn-glow"></span>
      <span class="magic-btn-text">✨ 施展魔法</span>
      <span class="magic-btn-spark" aria-hidden="true"></span>
    </button>

    <!-- 修改指令 -->
    <div class="block modify-block">
      <div class="block-head">
        <span class="block-label">③ 想改哪里？告诉魔术师</span>
        <span class="block-hint">先生成一次才能修改</span>
      </div>
      <div class="modify-row">
        <input id="modifyInput" class="modify-input" type="text"
          placeholder="比如：换成粉色 / 标题改成「夏日狂欢」/ 加个报名表单">
        <button id="modifyBtn" class="modify-btn" type="button">应用</button>
      </div>
      <div class="quick-modify" id="quickModify"></div>
    </div>

    <!-- 操作工具栏 -->
    <div class="toolbar">
      <button id="downloadBtn" class="tool-btn" type="button" title="下载为 HTML 文件">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>下载</span>
      </button>
      <button id="newWindowBtn" class="tool-btn" type="button" title="在新窗口打开">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>新窗口</span>
      </button>
      <button id="copyBtn" class="tool-btn" type="button" title="复制源码">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>复制源码</span>
      </button>
      <button id="clearBtn" class="tool-btn tool-btn-warn" type="button" title="清空重来">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>清空</span>
      </button>
    </div>

    <!-- 生成历史 -->
    <div class="history-block" id="historyBlock" hidden>
      <div class="block-head">
        <span class="block-label">最近的魔法</span>
        <span class="block-hint">点一下可回看</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

  </section>

  <!-- 右栏：预览 -->
  <section class="preview-panel" aria-label="预览区">

    <div class="preview-toolbar">
      <div class="view-toggle" role="tablist">
        <button class="view-btn active" data-view="desktop" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          桌面
        </button>
        <button class="view-btn" data-view="mobile" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          手机
        </button>
      </div>
      <div class="preview-status" id="previewStatus">🪄 等待你施展第一个魔法</div>
    </div>

    <div class="preview-stage" id="previewStage">
      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="empty-icon">🎭</div>
        <div class="empty-title">舞台已经搭好</div>
        <div class="empty-desc">在左边描述你想要的页面，<br>魔术师会在这里为你变出来。</div>
      </div>
      <iframe id="previewFrame" class="preview-frame" title="页面预览" hidden></iframe>
    </div>

  </section>

</main>

<!-- 生成中魔法覆盖层 -->
<div class="magic-overlay" id="magicOverlay" hidden>
  <div class="magic-aura"></div>
  <div class="magic-circle">
    <svg viewBox="0 0 200 200" class="circle-outer">
      <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 8"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 10"/>
      <defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd166"/>
          <stop offset="100%" stop-color="#c44569"/>
        </linearGradient>
      </defs>
    </svg>
    <svg viewBox="0 0 200 200" class="circle-inner">
      <polygon points="100,28 117,86 176,86 128,122 146,180 100,144 54,180 72,122 24,86 83,86"
        fill="none" stroke="#f5b942" stroke-width="1.2"/>
    </svg>
    <div class="circle-core">🎩</div>
  </div>
  <div class="magic-text" id="magicText">正在施展魔法…</div>
  <div class="magic-particles" id="magicParticles" aria-hidden="true"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<script src="js/templates.js"></script>
<script src="js/generator.js"></script>
<script src="js/modifier.js"></script>
<script src="js/app.js"></script>
</body>
</html>
