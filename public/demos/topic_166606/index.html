<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>人间焰火</title>
  <style>
:root {
  --paper: #f7f2e8;
  --paper-deep: #efe8d7;
  --ink: #0b0b0d;
  --pixel-gray: #2a2a2e;
  --line: #6e6e73;
  --line-soft: #c6beaf;
  --red: #e31b23;
  --yellow: #ffd42a;
  --green: #7da06f;
  --shadow: rgba(11, 11, 13, 0.1);
}

* {
  box-sizing: border-box;
  border-radius: 0;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background:
    linear-gradient(180deg, #f1ece0 0%, #eae3d5 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 1px solid var(--ink);
  background: var(--paper);
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 12px 10px;
  outline: none;
}

textarea {
  min-height: 88px;
  resize: none;
}

.stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.app-shell {
  width: min(100%, 430px);
  height: min(940px, calc(100vh - 28px));
  background: var(--paper);
  border: 2px solid var(--ink);
  display: grid;
  grid-template-rows: auto 1fr auto;
  box-shadow: 0 18px 60px rgba(11, 11, 13, 0.16);
  overflow: hidden;
}

.app-statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--ink);
  background: #fbf7ee;
  font-size: 12px;
  letter-spacing: 0.08em;
}

.app-main {
  position: relative;
  overflow: auto;
  background: linear-gradient(180deg, #faf7ef 0%, #f7f2e8 100%);
}

.app-tabbar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--ink);
  background: #fbf7ee;
}

.tab-button {
  padding: 11px 4px 12px;
  border: 0;
  border-right: 1px solid var(--ink);
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  letter-spacing: 0.04em;
}

.tab-button:last-child {
  border-right: 0;
}

.tab-button.is-active {
  background: var(--ink);
  color: var(--paper);
}

.tab-glyph {
  font-size: 14px;
  font-weight: 700;
}

.screen {
  min-height: 100%;
}

.screen-scroll {
  padding: 14px 14px 96px;
}

.topbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border-bottom: 1px solid var(--ink);
  background: rgba(251, 247, 238, 0.94);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand-row,
.control-row,
.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.control-row {
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
}

.control-note {
  flex: 0 1 auto;
  padding-left: 8px;
  line-height: 1.35;
  text-align: right;
  white-space: nowrap;
}

.brand-block {
  min-width: 0;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.03em;
}

.brand-logo-image {
  display: block;
  width: 116px;
  height: auto;
  object-fit: contain;
}

.brand-fallback-text {
  display: none;
}

.brand-logo-image[src=""],
.brand-logo-image:not([src]) {
  display: none;
}

.brand-mark:has(.brand-logo-image[src=""]) .brand-fallback-text,
.brand-mark:has(.brand-logo-image:not([src])) .brand-fallback-text {
  display: inline;
}

.region-note,
.section-note,
.meta-note,
.helper-text {
  color: var(--line);
  font-size: 12px;
}

.ghost-button,
.line-button,
.icon-button,
.chip-button,
.primary-button,
.secondary-button {
  min-height: 38px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.ghost-button,
.line-button,
.icon-button,
.chip-button,
.secondary-button {
  background: transparent;
}

.primary-button {
  background: var(--ink);
  color: var(--paper);
}

.danger-button {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

.search-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
}

.search-box {
  border: 1px solid var(--ink);
  background: #fbf8f1;
  min-height: 42px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.search-placeholder {
  color: var(--line);
}

.mode-switch,
.chip-row,
.rank-tabs,
.owner-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

.mode-switch::-webkit-scrollbar,
.chip-row::-webkit-scrollbar,
.rank-tabs::-webkit-scrollbar,
.owner-tabs::-webkit-scrollbar {
  display: none;
}

.switch-button,
.chip-button,
.rank-tab,
.owner-tab {
  min-width: fit-content;
  border: 1px solid var(--ink);
  padding: 9px 12px;
  background: transparent;
}

.switch-button.is-active,
.chip-button.is-active,
.rank-tab.is-active,
.owner-tab.is-active {
  background: var(--ink);
  color: var(--paper);
}

.map-panel {
  margin: 14px;
  border: 1px solid var(--ink);
  background:
    linear-gradient(180deg, #f9f5eb 0%, #f2eadb 100%);
  min-height: 490px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.map-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(110, 110, 115, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(110, 110, 115, 0.1) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

.road,
.block-shape,
.scene-label,
.scene-strip,
.stall-marker,
.map-hint {
  position: absolute;
}

.road {
  background: rgba(42, 42, 46, 0.18);
}

.road.vertical {
  width: 8px;
}

.road.horizontal {
  height: 8px;
}

.block-shape {
  border: 1px solid rgba(42, 42, 46, 0.14);
  background: rgba(255, 255, 255, 0.18);
}

.scene-label {
  border: 1px solid var(--ink);
  background: rgba(247, 242, 232, 0.92);
  padding: 4px 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.scene-strip {
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  background: rgba(227, 27, 35, 0.08);
  font-size: 11px;
  padding: 4px 6px;
  letter-spacing: 0.08em;
}

.map-hint {
  right: 10px;
  bottom: 10px;
  background: rgba(11, 11, 13, 0.92);
  color: var(--paper);
  padding: 8px 10px;
  font-size: 11px;
}

.stall-marker {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  background: transparent;
  border: 0;
  padding: 8px;
  z-index: 8;
  width: max-content;
}

.marker-core {
  width: 14px;
  height: 14px;
  border: 2px solid var(--ink);
  background: #d2cdc2;
  position: relative;
  box-shadow: 0 0 0 1px rgba(11, 11, 13, 0.08);
}

.marker-core::before,
.marker-core::after {
  content: "";
  position: absolute;
  background: var(--ink);
}

.marker-core::before {
  width: 2px;
  height: 20px;
  top: -3px;
  left: 4px;
}

.marker-core::after {
  height: 2px;
  width: 20px;
  top: 4px;
  left: -3px;
}

.stall-marker.is-open .marker-core {
  background: var(--yellow);
  border-color: var(--red);
  box-shadow:
    0 0 0 1px rgba(227, 27, 35, 0.18),
    0 0 14px rgba(255, 212, 42, 0.35);
}

.stall-marker.is-pending .marker-core {
  background: transparent;
  border-style: dashed;
}

.stall-marker.is-selected .marker-core {
  transform: scale(1.16);
}

.stall-marker.is-selected {
  z-index: 12;
}

.marker-label {
  border: 1px solid var(--ink);
  background: rgba(247, 242, 232, 0.96);
  padding: 3px 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.marker-meta {
  font-size: 10px;
  color: var(--line);
}

.map-footer-card {
  margin: 0 14px 14px;
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 8px 9px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
  padding-bottom: 24px;
}

.card-top,
.card-actions,
.metric-row,
.list-meta,
.rank-item-top,
.row-between,
.owner-metric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.stall-title,
.section-title,
.panel-title,
.overlay-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.03em;
}

.status-badge {
  border: 1px solid var(--ink);
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.status-open {
  background: rgba(255, 212, 42, 0.36);
}

.status-closed {
  background: rgba(110, 110, 115, 0.12);
}

.status-pending {
  background: rgba(227, 27, 35, 0.08);
}

.metrics-grid,
.discover-grid,
.entry-grid,
.owner-grid,
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.metric-box,
.entry-box,
.scene-entry,
.stats-box {
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 10px;
}

.entry-box {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  text-align: left;
}

.metric-box strong,
.stats-box strong,
.entry-box strong {
  display: block;
  font-size: 20px;
  margin-bottom: 6px;
}

.section-block,
.list-card,
.discover-card,
.review-card,
.rank-card,
.submission-card,
.owner-panel,
.detail-panel {
  border: 1px solid var(--ink);
  background: #fbf8f1;
}

.section-block {
  margin-bottom: 12px;
  padding: 12px;
}

.section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.section-head.compact {
  margin-bottom: 8px;
}

.section-lead {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.section-lead-icon {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(11, 11, 13, 0.14);
  background: rgba(255, 255, 255, 0.75);
  flex: 0 0 auto;
}

.section-inline-icon {
  width: 15px;
  height: 15px;
}

.tone-red { --icon-color: #d13d32; background: #ffe1dc; }
.tone-amber { --icon-color: #b77b12; background: #fff0c8; }
.tone-blue { --icon-color: #2c79ca; background: #dcecff; }
.tone-violet { --icon-color: #6856c8; background: #e7e1ff; }
.tone-pink { --icon-color: #cf5a86; background: #ffe0ee; }
.tone-yellow { --icon-color: #d96036; background: #ffe3cf; }

.section-title {
  font-size: 16px;
}

.list-stack,
.review-stack,
.rank-stack,
.submission-stack,
.detail-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.list-card,
.discover-card,
.review-card,
.rank-card,
.submission-card,
.owner-panel,
.detail-panel {
  padding: 12px;
}

.list-card {
  position: relative;
  padding-bottom: 26px;
}

.list-card.is-selected {
  border-width: 2px;
  background: #fffdf7;
}

.card-subline,
.eyebrow,
.overlay-subline,
.detail-kicker {
  color: var(--line);
  font-size: 12px;
  margin: 0;
}

.price-line,
.quote-line,
.reason-line,
.menu-line {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
}

.card-actions {
  margin-top: 6px;
  flex-wrap: wrap;
}

.list-mode {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 96px;
}

.discover-banner {
  border: 1px solid var(--ink);
  padding: 14px;
  background:
    linear-gradient(135deg, rgba(255, 212, 42, 0.18) 0%, rgba(227, 27, 35, 0.12) 100%),
    #fbf8f1;
}

.discover-grid,
.entry-grid,
.owner-grid,
.stats-grid {
  grid-template-columns: 1fr 1fr;
}

.review-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.review-quote {
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}

.rank-tabs {
  padding: 14px 14px 0;
}

.rank-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.rank-number {
  flex: 0 0 42px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
}

.rank-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.profile-head {
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.profile-badge {
  border: 1px solid var(--ink);
  min-width: 54px;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  background: var(--yellow);
}

.entry-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--line);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.entry-inline-icon {
  width: 14px;
  height: 14px;
  --icon-color: #6e6e73;
}

.summary-box {
  border-color: rgba(11, 11, 13, 0.14);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(243, 237, 227, 0.96) 100%);
}

.summary-box strong {
  font-size: 24px;
}

.action-entry {
  min-height: 108px;
  padding: 12px 12px 12px 14px;
  border-color: rgba(11, 11, 13, 0.2);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(252, 247, 240, 0.98) 100%);
  box-shadow:
    4px 4px 0 rgba(11, 11, 13, 0.05),
    inset 4px 0 0 rgba(227, 27, 35, 0.82);
}

.action-entry .meta-note {
  max-width: calc(100% - 18px);
}

.entry-icon-badge {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(11, 11, 13, 0.14);
  background: rgba(255, 255, 255, 0.84);
}

.entry-panel-icon {
  width: 15px;
  height: 15px;
}

.entry-arrow {
  position: absolute;
  top: 10px;
  right: 10px;
  color: var(--red);
  font-weight: 800;
  font-size: 16px;
  line-height: 1;
}

.submission-status-row,
.owner-action-row,
.sticky-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(247, 242, 232, 0.98);
  z-index: 50;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.overlay-header {
  display: grid;
  grid-template-columns: 72px 1fr 72px;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border-bottom: 1px solid var(--ink);
  background: #fbf7ee;
}

.overlay-header > :nth-child(2) {
  min-width: 0;
  text-align: center;
}

.overlay-header > :last-child {
  justify-self: end;
}

.overlay-header .line-button {
  min-width: 64px;
  justify-content: center;
}

.overlay-header .icon-square-button {
  width: 32px;
}

.overlay-content {
  overflow: auto;
  padding: 14px 14px 100px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.overlay-footer {
  border-top: 1px solid var(--ink);
  background: #fbf7ee;
  padding: 12px 14px;
}

.hero-strip {
  border: 1px solid var(--ink);
  background: linear-gradient(180deg, rgba(227, 27, 35, 0.08) 0%, rgba(255, 212, 42, 0.08) 100%);
  padding: 12px;
}

.tag-row,
.review-tags,
.inline-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag,
.mini-tag {
  border: 1px solid var(--ink);
  padding: 4px 8px;
  font-size: 11px;
  background: #fbf8f1;
}

.product-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.product-line,
.owner-line,
.ledger-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 8px;
}

.product-line:last-child,
.owner-line:last-child,
.ledger-line:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.chart-box {
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 10px;
}

.chart-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  align-items: end;
  min-height: 120px;
  margin-top: 12px;
}

.chart-bar {
  border: 1px solid var(--ink);
  background: linear-gradient(180deg, var(--yellow) 0%, var(--red) 100%);
  position: relative;
}

.chart-bar span {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--line);
}

.chart-values {
  display: flex;
  justify-content: space-between;
  margin-top: 28px;
  color: var(--line);
  font-size: 12px;
}

.form-grid {
  display: grid;
  gap: 12px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.photo-placeholder {
  border: 1px dashed var(--ink);
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(135deg, rgba(255, 212, 42, 0.1) 0%, rgba(227, 27, 35, 0.05) 100%);
}

.success-panel {
  border: 1px solid var(--ink);
  background: #fbf8f1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.signal-box {
  border: 1px solid var(--ink);
  padding: 10px;
  background: rgba(227, 27, 35, 0.06);
}

.sticky-actions {
  justify-content: space-between;
}

.sticky-actions button {
  flex: 1;
}

.owner-tabs {
  padding-bottom: 4px;
}

.owner-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.divider {
  border-top: 1px solid var(--ink);
  margin: 4px 0;
}

.app-shell {
  position: relative;
}

.app-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 212, 42, 0.08), transparent 28%),
    radial-gradient(circle at 84% 14%, rgba(227, 27, 35, 0.06), transparent 24%),
    radial-gradient(circle at 72% 76%, rgba(104, 86, 200, 0.06), transparent 26%);
  mix-blend-mode: multiply;
}

.app-tabbar.is-hidden {
  display: none;
}

.ui-icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-color, var(--ink));
  flex: 0 0 auto;
}

.ui-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.inline-icon {
  width: 16px;
  height: 16px;
}

.tab-button {
  gap: 6px;
  padding-top: 7px;
  padding-bottom: 7px;
  background:

function getSearchResults() {
  const q = state.searchQuery.trim().toLowerCase();
  const candidates = stalls.slice().sort((a, b) => a.distanceValue - b.distanceValue);
  if (!q) {
    return candidates.slice(0, 6);
  }
  return candidates.filter((stall) => {
    const hay = [stall.name, stall.scene, stall.locationText, stall.mainProducts.join(" "), getCategoryMeta(stall).label].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

}

function renderIcon(key, options = {}) {
  const meta = options.meta || categoryMetaMap[key] || {};
  const cls = options.className || "ui-icon";
  const label = options.label ? ` aria-label="${options.label}"` : ` aria-hidden="true"`;
  const style = ` style="--icon-color:${options.color || meta.color || "#0b0b0d"}; --icon-bg:${options.bg || meta.bg || "transparent"};"`;
  return `<span class="${cls}"${style}${label}>${renderSvgIcon(key)}</span>`;
}

function renderCategoryBadge(input) {
  const meta = getCategoryMeta(input);
  return `
    <span class="category-badge" style="--category-color:${meta.color}; --category-bg:${meta.bg};">
      ${renderIcon(meta.iconKey, { meta, className: "ui-icon category-icon" })}
      <span>${meta.label}</span>
    </span>
  `;
}

function renderIconOnlyButton(action, stallId, iconKey, label, extraClass = "") {
  return `
    <button class="icon-square-button ${extraClass}" data-action="${action}" data-stall-id="${stallId}" aria-label="${label}" title="${label}">
      ${renderIcon(iconKey, { className: "ui-icon inline-icon" })}
    </button>
  `;
}

function renderCardCategoryCorner(stall) {
  return `
    <div class="card-category-corner">
      ${renderCategoryBadge(stall)}
    </div>
  `;
}

function getStallById(id) {
  return stalls.find((stall) => stall.id === id);
}

function getOwnerStall() {
  return getStallById(state.ownerStallId);
}

function getStatusLabel(stall) {
  if (stall.verification === "pending") {
    return "用户推荐待确认";
  }
  return stall.isOpen ? "出摊中" : "已收摊";
}

function getStatusClass(stall) {
  if (stall.verification === "pending") {
    return "status-pending";
  }
  return stall.isOpen ? "status-open" : "status-closed";
}

function getStatusIcon(stall) {
  if (stall.verification === "pending") {
    return "pending";
  }
  return stall.isOpen ? "open" : "closed";
}

function matchFilter(stall, filterKey) {
  switch (filterKey) {
    case "open":
      return stall.isOpen;
    case "grill":
      return getStallKind(stall) === "grill";
    case "snack":
      return getStallKind(stall) === "snack";
    case "drink":
      return getStallKind(stall) === "drink";
    case "dessert":
      return getStallKind(stall) === "dessert";
    case "handmade":
      return getStallKind(stall) === "handmade";
    case "market":
      return getStallKind(stall) === "market";
    case "recommended":
      return getStallKind(stall) === "recommended" || stall.verification === "pending";
    default:
      return true;
  }
}

function getFilteredStalls() {
  return stalls.filter((stall) => matchFilter(stall, state.filter));
}

function ensureSelectedStall() {
  const filtered = getFilteredStalls();
  const selectedIsVisible = filtered.some((stall) => stall.id === state.selectedStallId);
  if (!selectedIsVisible && filtered.length > 0) {
    state.selectedStallId = filtered[0].id;
  }
  if (!state.selectedStallId && filtered.length > 0) {
    state.selectedStallId = filtered[0].id;
  }
}

function getSelectedStall() {
  ensureSelectedStall();
  return getStallById(state.selectedStallId);
}

function formatFavoriteCount(stall) {
  return stall.favoriteCount + (state.favorites.has(stall.id) ? 1 : 0);
}

function formatStatusTag(stall) {
  return `
    <span class="status-badge ${getStatusClass(stall)}">
      ${renderIcon(getStatusIcon(stall), { className: "ui-icon status-icon" })}
      <span>${getStatusLabel(stall)}</span>
    </span>
  `;
}

function renderMapMarkers() {
  return getFilteredStalls()
    .map((stall) => {
      const classes = [
        "stall-marker",
        stall.isOpen ? "is-open" : "",
        stall.verification === "pending" ? "is-pending" : "",
        state.selectedStallId === stall.id ? "is-selected" : ""
      ]
        .filter(Boolean)
        .join(" ");
      return `
        <button
          class="${classes}"
          style="left:calc(${stall.mapX}% - 18px); top:calc(${stall.mapY}% - 18px);"
          data-action="select-stall"
          data-stall-id="${stall.id}"
          aria-label="${stall.name}"
        >
          <span class="marker-core" style="--marker-color:${getCategoryMeta(stall).color}; --marker-bg:${getCategoryMeta(stall).bg};">
            ${renderIcon(getCategoryMeta(stall).iconKey, { meta: getCategoryMeta(stall), className: "ui-icon marker-icon" })}
          </span>
          <span class="marker-label">${stall.name}</span>
          <span class="marker-meta">${stall.distance}</span>
        </button>
      `;
    })
    .join("");
}

function getRankMetric(stall) {
  const score = rankScoreMap[stall.id]?.[state.activeRank] || 0;
  switch (state.activeRank) {
    case "treasure":
      return `宝藏指数 ${score}`;
    case "return":
      return `复访强度 ${score}`;
    case "lights":
      return `亮灯热度 ${score}`;
    default:
      return `附近热度 ${score}`;
  }
}

  switch (state.activeRank) {

        <div>
          <h3 class="overlay-title">分享摊位</h3>
          <p class="overlay-subline">把这家摊发给朋友或继续安利。</p>
        </div>
        <span class="status-badge status-open">可分享</span>
      </header>
      <div class="overlay-content">
        <section class="detail-panel">
          <div class="signal-box">
            <strong>${stall.name}</strong>
            <div class="meta-note">${stall.scene} · ${stall.distance} · ${getStatusLabel(stall)}</div>
          </div>
          <p class="review-quote">“${stall.reviewHighlight}”</p>
          <p class="reason-line">推荐理由：${stall.treasureReason}</p>
        </section>
      </div>
      <footer class="overlay-footer">
        <div class="sticky-actions">
          <button class="secondary-button" data-action="close-overlay">先不分享</button>
          <button class="primary-button" data-action="recommend-from-detail" data-stall-id="${stall.id}">我也推荐</button>
        </div>
      </footer>
    </section>
  `;
}

function mapSubmissionStatus(status) {
  if (status === "approved") {
    return "已点亮";
  }
  if (status === "need_more_info") {
    return "需要补充信息";
  }
  return "待审核";
}

function mapSceneToFilter(scene) {
  if (scene === "下班夜宵") return "grill";
  if (scene === "学校门口") return "all";
  if (scene === "周末市集") return "market";
  if (scene === "深夜甜品") return "dessert";
  if (scene === "手作小摊") return "handmade";
  if (scene === "地铁口补给") return "drink";
  return "all";
}

function normalizeRecommendCategory(value, stall) {
  if (!value && stall) {
    const stallKind = getStallKind(stall);
    if (stallKind === "grill") return "夜宵";
    if (stallKind === "snack") return "小吃";
    if (stallKind === "dessert") return "甜品";
    if (stallKind === "drink") return "饮品";
    if (stallKind === "handmade") return "手作";
    if (stallKind === "market" || stallKind === "recommended") return "市集";
  }
  return recommendCategoryOptions.includes(value) ? value : "饮品";
}

function viewStall(stallId) {
  state.selectedStallId = stallId;
  state.recentViewed = [stallId, ...state.recentViewed.filter((id) => id !== stallId)].slice(0, 6);
}

function openRecommend(prefill = {}) {
  state.recommendDraft = {
    stallName: prefill.stallName || "",
    category: normalizeRecommendCategory(prefill.category, prefill.stall),
    locationText: prefill.locationText || "",
    usualOpenTime: prefill.usualOpenTime || "",
    reason: prefill.reason || "",
    contact: prefill.contact || ""
  };
  state.overlay = { type: "recommend" };
}

function openDetail(stallId) {
  viewStall(stallId);
  state.reviewDraft = {
    score: String(getStallScore(getStallById(stallId) || stalls[0])),
    text: ""
  };
  state.overlay = { type: "detail", stallId };
}

function handleAction(actionEl) {
  const action = actionEl.dataset.action;
  if (!action) {
    return;
  }

  switch (action) {
    case "switch-tab":
      state.activeTab = actionEl.dataset.tab;
      state.overlay = null;
      break;
    case "goto-tab":
      state.activeTab = actionEl.dataset.tab;
      state.overlay = null;
      break;
    case "set-mode":
      state.nearbyMode = actionEl.dataset.mode;
      break;
    case "set-filter":
      state.filter = actionEl.dataset.filter;
      if (state.activeTab !== "nearby") {
        state.activeTab = "nearby";
        state.nearbyMode = "map";
      }
      break;
    case "select-stall":
      viewStall(actionEl.dataset.stallId);
      if (state.activeTab !== "nearby") {
        state.activeTab = "nearby";
      }
      break;
    case "open-detail":
      openDetail(actionEl.dataset.stallId);
      break;
    case "open-search":
      state.searchQuery = "";
      state.overlay = { type: "search" };
      break;
    case "quick-search":
      state.searchQuery = actionEl.dataset.query || "";
      state.overlay = { type: "search" };
      break;
    case "close-overlay":
      state.overlay = null;
      break;
    case "open-recommend":
      openRecommend();
      break;
    case "recommend-from-detail": {
      const stall = getStallById(actionEl.dataset.stallId);
      openRecommend({
        stall,
        stallName: stall ? stall.name : "",
        category: stall ? stall.category : "饮品",
        locationText: stall ? stall.locationText : "",
        usualOpenTime: stall ? stall.openTime : "",
        reason: stall ? `我也推荐 ${stall.name}，${stall.reviewHighlight}` : ""
      });
      break;
    }
    case "open-submissions":
      state.overlay = { type: "submissions" };
      break;
    case "continue-nearby":
      state.overlay = null;
      state.activeTab = "nearby";
      break;
    case "set-rank":
      state.activeRank = actionEl.dataset.rank;
      break;
    case "toggle-favorite": {
      const stallId = actionEl.dataset.stallId;
      if (state.favorites.has(stallId)) {
        state.favorites.delete(stallId);
      } else {
        state.favorites.add(stallId);
      }
      break;
    }
    case "toggle-light": {
      const stallId = actionEl.dataset.stallId;
      if (state.litStalls.has(stallId)) {
        state.litStalls.delete(stallId);
      } else {
        state.litStalls.add(stallId);
      }
      break;
    }
    case "toggle-checkin": {
      const stallId = actionEl.dataset.stallId;
      const current = getCheckinCount(stallId);
      if (current < 3) {
        state.checkinsToday[stallId] = current + 1;
      }
      break;
    }
    case "focus-review": {
      const reviewSection = document.getElementById("detailReviewSection");
      if (reviewSection) {
        reviewSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      return;
    }
    case "toggle-save": {
      const stallId = actionEl.dataset.stallId;
      if (state.saved.has(stallId)) {
        state.saved.delete(stallId);
      } else {
        state.saved.add(stallId);
      }
      break;
    }
    case "open-owner":
      state.ownerPanel = actionEl.dataset.ownerPanel || "control";
      state.overlay = { type: "owner" };
      break;
    case "set-owner-panel":
      state.ownerPanel = actionEl.dataset.ownerPanel;
      if (!state.overlay || state.overlay.type !== "owner") {
        state.overlay = { type: "owner" };
      }
      break;
    case "toggle-owner-open": {
      const owner = getOwnerStall();
      if (owner) {
        owner.isOpen = !owner.isOpen;
        owner.ownerNotice = owner.isOpen ? "已一键出摊，地图点位已同步亮起。" : "已一键收摊，地图点位已切回历史状态。";
      }
      break;
    }
    case "save-owner": {
      const owner = getOwnerStall();
      if (owner) {
        owner.locationText = state.ownerDraft.locationText;
        owner.openTime = state.ownerDraft.openTime;
        owner.ownerNotice = state.ownerDraft.notice;
        owner.menu = state.ownerDraft.menuDraft
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const parts = line.split(" ");
            return {
              name: parts.slice(0, -1).join(" ") || line,
              price: parts[parts.length - 1] || "--",
              note: "已同步"
            };
          });
        state.ownerPanel = "control";
      }
      break;
    }
    case "open-route":
      state.overlay = { type: "route", stallId: actionEl.dataset.stallId, routeId: `${actionEl.dataset.stallId}-main` };
      break;
    case "choose-route":
      state.overlay = { type: "route", stallId: actionEl.dataset.stallId, routeId: actionEl.dataset.routeId };
      break;
    case "like-route": {
      const routeId = actionEl.dataset.routeId;
      state.routeLikes[routeId] = getRouteLikeCount(routeId, 8) + 1;
      break;
    }
    case "open-share":
      state.overlay = { type: "share", stallId: actionEl.dataset.stallId };
      break;
    default:
      break;
  }

  render();
}

function handleRecommendSubmit(form) {
  const formData = new FormData(form);
  const submission = {
    id: `sub-${Date.now().toString().slice(-5)}`,
    stallName: String(formData.get("stallName") || "").trim() || "未命名摊位",
    category: String(formData.get("category") || "饮品"),
    locationText: String(formData.get("locationText") || "").trim() || "位置待补充",
    usualOpenTime: String(formData.get("usualOpenTime") || "").trim(),
    reason: String(formData.get("reason") || "").trim() || "用户提交了新的宝藏线索。",
    status: "pending"
  };

  state.submissions.unshift(submission);
  state.overlay = { type: "recommend-success", submission };
  state.recommendDraft = {
    stallName: "",
    category: "饮品",
    locationText: "",
    usualOpenTime: "",
    reason: "",
    contact: ""
  };

  render();
}

function handleDetailReviewSubmit(form) {
  const stall = state.overlay && state.overlay.type === "detail" ? getStallById(state.overlay.stallId) : null;
  if (!stall) {
    return;
  }
  const formData = new FormData(form);
  const score = Number(formData.get("score") || state.reviewDraft.score || getStallScore(stall));
  const text = String(formData.get("reviewText") || state.reviewDraft.text || "").trim();
  if (text) {
    stall.reviews.unshift(`${score} 分 · ${text}`);
  }
  stall.score100 = Math.round((getStallScore(stall) * 4 + score) / 5);
  state.reviewDraft = {
    score: String(stall.score100),
    text: ""
  };
  render();
}

function handleModelInput(input) {
  const model = input.dataset.model;
  if (!model) {
    return;
  }
  const value = input.value;
  if (model === "owner.locationText") state.ownerDraft.locationText = value;
  if (model === "owner.openTime") state.ownerDraft.openTime = value;
  if (model === "owner.notice") state.ownerDraft.notice = value;
  if (model === "owner.menuDraft") state.ownerDraft.menuDraft = value;
  if (model === "search.query") state.searchQuery = value;
  if (model === "review.score") state.reviewDraft.score = value;
  if (model === "review.text") state.reviewDraft.text = value;
  render();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("'", "&#39;");
}

function render() {
  ensureSelectedStall();
  appMain.innerHTML = `${renderActiveScreen()}${renderOverlay()}`;
  appTabbar.innerHTML = renderTabbar();
  appTabbar.classList.toggle("is-hidden", Boolean(state.overlay && state.overlay.type === "detail"));
}

document.addEventListener("click", (event) => {
  const actionEl = event.target.closest("[data-action]");
  if (!actionEl) {
    return;
  }
  handleAction(actionEl);
});

document.addEventListener("submit", (event) => {
  const form = event.target;
  if (form.id === "recommendForm") {
    event.preventDefault();
    handleRecommendSubmit(form);
    return;
  }
  if (form.id === "detailReviewForm") {
    event.preventDefault();
    handleDetailReviewSubmit(form);
  }
});

document.addEventListener("input", (event) => {
  const target = event.target;
  if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) {
    return;
  }
  handleModelInput(target);
});

render();

  </script>
</body>
</html>
