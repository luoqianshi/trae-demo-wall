<!DOCTYPE html>
<html lang="zh-CN">

/* ============================================
   饭合 Preview Styles
   Converted from WXSS to standard CSS
   rpx → px (divided by 2)
   ============================================ */

/* ============================================
   1. Phone Frame Styles
   ============================================ */

/* Phone Frame */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #1a1a1a;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: var(--color-background);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
}

.status-bar {
  height: 44px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}

.status-time {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.page-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
}

.page-container::-webkit-scrollbar { display: none; }

.home-indicator {
  height: 34px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.home-indicator::after {
  content: '';
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: var(--color-text-primary);
  opacity: 0.8;
}

.tab-bar {
  position: absolute;
  bottom: 34px;
  left: 0;
  right: 0;
  height: 50px;
  background: #FFFDF9;
  border-top: 1px solid #EDE5DB;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  padding-bottom: 8px;
  z-index: 100;
}

/* TabBar hidden state */
.tab-bar.hidden { display: none; }

/* Icon styles */
.icon-svg {
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}

/* Page transitions */
.transition-overlay {
  position: absolute;
  inset: 0;
  background: var(--color-background);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 200ms ease;
}

.transition-overlay.active {
  opacity: 1;
}

/* Sticky positioning fix for HTML */
.sticky { position: sticky; }


/* ============================================
   2. CSS Variables (from app.wxss)
   ============================================ */

:root {
  /* Brand Colors */
  --color-primary: #D4845A;
  --color-primary-hover: #C07548;
  --color-primary-active: #A8643E;
  --color-primary-light: #F5EDE3;
  --color-primary-50: #FBF7F2;
  --color-primary-100: #F0E5D5;

  --color-secondary: #7B9E6B;
  --color-secondary-light: #EEF5EB;
  --color-secondary-hover: #6B8C5C;

  --color-accent: #E8C87A;
  --color-accent-light: #FDF6E8;
  --color-accent-hover: #D4B56A;

  /* Background & Surface */
  --color-background: #F5EDE3;
  --color-surface: #FFFDF9;
  --color-surface-elevated: #FFFFFF;
  --color-surface-dim: #F0E8DF;

  /* Text */
  --color-text-primary: #2C2420;
  --color-text-secondary: #6B5D52;
  --color-text-tertiary: #A09589;
  --color-text-inverse: #FFFDF9;
  --color-text-link: #D4845A;

  /* Border */
  --color-border: #EDE5DB;
  --color-border-light: #F5EDE3;

  /* Semantic */
  --state-success: #5A9E6B;
  --state-success-light: #EEF5EB;
  --state-warning: #D4A05A;
  --state-warning-light: #FDF6E8;
  --state-error: #D45A5A;
  --state-error-light: #FBEDED;
  --state-info: #5A8E9E;

  /* Credit */
  --credit-positive: #5A9E6B;
  --credit-positive-bg: #EEF5EB;
  --credit-warning: #D4A05A;
  --credit-warning-bg: #FDF6E8;
  --credit-negative: #D45A5A;
  --credit-negative-bg: #FBEDED;

  /* Radius */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 0.5px 1px rgba(44, 36, 32, 0.04);
  --shadow-sm: 0 0.5px 1.5px rgba(44, 36, 32, 0.06);
  --shadow-md: 0 1px 4px rgba(44, 36, 32, 0.07);
  --shadow-card: 0 1px 6px rgba(44, 36, 32, 0.06);
  --shadow-elevated: 0 4px 12px rgba(44, 36, 32, 0.12);
  --shadow-primary: 0 1px 4px rgba(212, 132, 90, 0.25);

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
  --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);

  background: var(--color-background);
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  color: var(--color-text-primary);
  font-size: 14px;
  line-height: 1.5;
}


/* ============================================
   3. Global Utility Classes (from app.wxss)
   ============================================ */

/* ── 字体工具类 ── */
.font-serif { font-family: 'Songti SC', 'STSong', 'SimSun', Georgia, serif; }
.font-sans { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }

/* ── 文字颜色 ── */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-inverse { color: var(--color-text-inverse); }
.text-brand { color: var(--color-primary); }
.text-olive { color: var(--color-secondary); }
.text-golden { color: var(--color-accent); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

/* ── 背景色 ── */
.bg-brand { background: var(--color-primary); }
.bg-brand-light { background: var(--color-primary-light); }
.bg-surface { background: var(--color-surface); }
.bg-surface-dim { background: var(--color-surface-dim); }
.bg-background { background: var(--color-background); }
.bg-olive-light { background: var(--color-secondary-light); }
.bg-golden-light { background: var(--color-accent-light); }

/* ── 阴影 ── */
.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-primary { box-shadow: var(--shadow-primary); }

/* ── 圆角 ── */
.radius-sm { border-radius: var(--radius-sm); }
.radius-md { border-radius: var(--radius-md); }
.radius-lg { border-radius: var(--radius-lg); }
.radius-xl { border-radius: var(--radius-xl); }
.radius-full { border-radius: var(--radius-full); }

/* ── 卡片基础 ── */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

/* ── 交互态 ── */
.card-lift {
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}
.card-lift:active {
  transform: translateY(-1px);
  box-shadow: var(--shadow-elevated);
}

.btn-press {
  transition: transform var(--transition-fast);
}
.btn-press:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.meal-card {
  transition: transform 200ms ease, opacity 200ms ease;
}
.meal-card:active {
  transform: scale(0.98);
  opacity: 0.95;
}

/* ── 按钮样式 ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 16px;
  height: 40px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 14px;
  font-weight: 600;
  border: none;
  box-shadow: var(--shadow-primary);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 16px;
  height: 40px;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--color-accent);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--color-accent);
}

.btn-card-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 13px;
  font-weight: 600;
  border: none;
  box-shadow: var(--shadow-primary);
}

.btn-card-disabled {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  font-size: 13px;
  font-weight: 600;
  border: none;
}

/* ── 标签/Pill ── */
.cuisine-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  background: var(--color-primary-light);
  color: var(--color-primary);
}

.dish-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  background: var(--color-surface-dim);
  color: var(--color-text-secondary);
}

.credit-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}

.credit-tag.positive {
  background: var(--credit-positive-bg);
  color: var(--credit-positive);
}

.credit-tag.warning {
  background: var(--credit-warning-bg);
  color: var(--credit-warning);
}

/* ── 食人格徽章 ── */
.personality-badge {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

.personality-mini {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

/* ── 滤镜Pill ── */
.filter-pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border: 1.5px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  transition: all 200ms ease;
}

.filter-pill.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-color: var(--color-primary);
}

/* ── 进度条 ── */
.progress-mini {
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: var(--color-surface-dim);
  overflow: hidden;
}

.progress-mini-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--color-secondary);
}

/* ── 通知红点 ── */
.notif-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--state-error);
  border: 2px solid var(--color-background);
}

/* ── 金色分隔线 ── */
.golden-divider {
  width: 40px;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
  margin: 0 auto;
}

/* ── 横向滚动隐藏滚动条 ── */
.scroll-x {
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}
.scroll-x::-webkit-scrollbar {
  display: none;
  height: 0;
}

/* ── 页面动画 ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes goldenBreath {
  0%, 100% { box-shadow: 0 0 0 2px rgba(232, 200, 122, 0.15); }
  50% { box-shadow: 0 0 0 6px rgba(232, 200, 122, 0.08); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes creditPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
}

.fade-in { animation: fadeIn 250ms ease forwards; }
.fade-slide-up { animation: fadeSlideUp 350ms ease forwards; }

/* ── 自定义导航栏容器 ── */
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--color-surface);
  border-bottom: 0.5px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.nav-bar .nav-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.nav-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── 状态徽章 ── */
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

/* ── 安全区域 ── */
.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── 底部CTA固定栏 ── */
.bottom-cta {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 0.5px solid var(--color-border);
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 20;
}

.bottom-cta .cta-button {
  width: 100%;
  height: 48px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 16px;
  font-weight: 700;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-primary);
}


/* ============================================
   4. Component Styles
   ============================================ */

/* ── custom-tab-bar ── */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: #FFFDF9;
  border-top: 0.5px solid #EDE5DB;

  align-items: flex-end;

}

.tab-item.active .tab-text {

}

.tab-item.inactive .tab-text {

.tab-icon-wrap {

.tab-center {

.tab-center-btn {

}

.tab-text-center {
  margin-top: 4px;

}

/* ── icon ── */
.icon-img {
  display: inline-block;
  flex-shrink: 0;
}

   5. Page Styles

   Home Page (pages/home/home.wxss)

}

  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.match-score {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-primary);
}

.match-label {
  font-size: 10px;
  color: var(--color-text-tertiary);
}

/* 信用标签 */
.initiator-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}

/* 食人格描述 mini 卡 */
.personality-desc-card {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--radius-md);
  background: var(--color-accent-light);
  border: 0.5px solid rgba(232, 200, 122, 0.3);
}

.desc-header {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 6px;
}

.desc-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.desc-body {
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.6;
  font-style: italic;
}

/* ── 底部CTA栏 ── */
.cta-hint {
  display: block;
  text-align: center;
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-top: 6px;
}


/* ════════════════════════════════════════════
   Meal Create Page (pages/meal-create/meal-create.wxss)
   ════════════════════════════════════════════ */
.page {
  min-height: 100vh;
  background: var(--color-background);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ════════════════════════════════════════ */
/* 顶部导航栏 + 步骤指示器                    */
/* ════════════════════════════════════════ */
.nav-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-surface);
  border-bottom: 0.5px solid var(--color-border-light);
}

.nav-bar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  height: 44px;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.nav-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* 步骤指示器 */
.step-indicator {
  padding: 0 20px 12px;
}

.step-track {
  height: 2px;
  background: var(--color-border);
  border-radius: 1px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}

.step-progress {
  height: 100%;
  background: var(--color-primary);
  border-radius: 1px;
  transition: width 300ms ease;
}

.step-dots {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.step-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid var(--color-border);
  transition: all 200ms ease;
}

.step-dot.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(212, 132, 90, 0.3);
}

.step-dot.done {
  background: var(--color-secondary);
  color: var(--color-text-inverse);
  border-color: var(--color-secondary);
}

.step-check {
  font-size: 11px;
  font-weight: 700;
}

.step-labels {
  display: flex;
  justify-content: space-between;
}

.step-label {
  font-size: 10px;
  color: var(--color-text-tertiary);
  font-weight: 500;
  text-align: center;
  flex: 1;
}

.step-label.active {
  color: var(--color-primary);
  font-weight: 600;
}

/* ════════════════════════════════════════ */
/* 内容区域                                   */
/* ════════════════════════════════════════ */
.content-wrap {
  padding: 16px 20px 0;
}

.page-header {
  margin-bottom: 16px;
}

.page-title {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 6px;
}

.page-subtitle {
  display: block;
  font-size: 13px;
  color: var(--color-text-secondary);
}

.section {
  margin-top: 18px;
}

.section-title {
  display: block;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}

.section-hint {
  display: block;
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-bottom: 12px;
}

/* ════════════════════════════════════════ */
/* Step 1: 选餐厅                             */
/* ════════════════════════════════════════ */

/* 搜索框 */
.search-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--color-surface-dim);
  border-radius: var(--radius-full);
  margin-bottom: 12px;
}

.search-input {
  flex: 1;
  font-size: 14px;
  color: var(--color-text-primary);
}

.search-placeholder {
  color: var(--color-text-tertiary);
}

/* 快捷标签 */
.quick-tags {
  margin-bottom: 12px;
  white-space: nowrap;
}

.quick-tags-inner {
  display: inline-flex;
  gap: 8px;
}

.quick-tag {
  display: inline-flex;
  align-items: center;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  font-size: 13px;
  color: var(--color-text-secondary);
  font-weight: 500;
}

.quick-tag-active {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border-color: var(--color-primary);
  font-weight: 600;
}

/* 餐厅列表 */
.restaurant-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.restaurant-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  position: relative;
  transition: all 200ms ease;
}

.restaurant-card.selected {
  border: 1px solid var(--color-primary);
  background: var(--color-primary-50);
}

.restaurant-thumb {
  width: 70px;
  height: 70px;
  border-radius: var(--radius-md);
  flex-shrink: 0;
}

.restaurant-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.restaurant-name-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.restaurant-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.restaurant-meta-row {
  display: flex;
  align-items: center;
  gap: 3px;
}

.restaurant-meta {
  font-size: 12px;
  color: var(--color-text-secondary);
}

.meta-dot {
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin: 0 2px;
}

.restaurant-price {
  font-size: 12px;
  color: var(--color-text-secondary);
}

.restaurant-rating-row {
  display: flex;
  align-items: center;
  gap: 3px;
}

.rating-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-primary);
}

.rating-label {
  font-size: 11px;
  color: var(--color-text-tertiary);
}

.selected-check {
  flex-shrink: 0;
}

/* ════════════════════════════════════════ */
/* Step 2: 时间人数                           */
/* ════════════════════════════════════════ */
.form-card {
  padding: 4px 16px;
  margin-bottom: 8px;
}

.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
}

.form-label-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
}

.form-picker {
  display: flex;
  align-items: center;
  gap: 4px;
}

.picker-value {
  font-size: 14px;
  color: var(--color-text-primary);
  font-weight: 500;
}

.form-divider {
  height: 0.5px;
  background: var(--color-border-light);
}

/* 人数选择 */
.people-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.people-card {
  display: flex;
  align-items: baseline;
  justify-content: center;
  padding: 16px 8px;
  border-radius: var(--radius-lg);
  gap: 2px;
  transition: all 200ms ease;
}

.people-card.selected {
  background: var(--color-primary-50);
  border: 1px solid var(--color-primary);
}

.people-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.people-card.selected .people-num {
  color: var(--color-primary);
}

.people-unit {
  font-size: 12px;
  color: var(--color-text-tertiary);
}

/* ════════════════════════════════════════ */
/* Step 3: 预算菜单                           */
/* ════════════════════════════════════════ */
.budget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 12px;
}

.budget-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-primary);
}

.budget-slider {
  margin: 0 0 6px;
}

.budget-range {
  display: flex;
  justify-content: space-between;
}

.range-label {
  font-size: 11px;
  color: var(--color-text-tertiary);
}

/* 菜品标签 */
.dish-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.dish-tag {
  display: inline-flex;
  align-items: center;
  padding: 7px 16px;
  border-radius: var(--radius-full);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  font-size: 13px;
  color: var(--color-text-secondary);
  font-weight: 500;
  transition: all 200ms ease;
}

.dish-tag.selected {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border-color: var(--color-primary);
  font-weight: 600;
}

.dish-count {
  margin-top: 10px;
  text-align: right;
}

.dish-count-text {
  font-size: 12px;
  color: var(--color-text-tertiary);
}

/* ════════════════════════════════════════ */
/* Step 4: 氛围偏好                           */
/* ════════════════════════════════════════ */
.vibe-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.vibe-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 12px;
  border-radius: var(--radius-lg);
  position: relative;
  transition: all 200ms ease;
}

.vibe-card.selected {
  background: var(--color-primary-50);
  border: 1px solid var(--color-primary);
}

.vibe-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.vibe-body {
  flex: 1;
  min-width: 0;
}

.vibe-label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 2px;
}

.vibe-desc {
  display: block;
  font-size: 12px;
  color: var(--color-text-secondary);
}

.vibe-check {
  flex-shrink: 0;
}

/* ════════════════════════════════════════ */
/* Step 5: 确认发布                           */
/* ════════════════════════════════════════ */
.preview-card {
  padding: 4px 16px;
}

.preview-section {
  padding: 14px 0;
}

.preview-label-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
}

.preview-label {
  font-size: 12px;
  color: var(--color-text-tertiary);
  font-weight: 500;
}

.preview-value {
  font-size: 14px;
  color: var(--color-text-primary);
  font-weight: 600;
}

.preview-divider {
  height: 0.5px;
  background: var(--color-border-light);
}

.preview-dishes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.preview-dish {
  display: inline-flex;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--color-accent-light);
  color: var(--color-accent-hover);
  font-size: 12px;
  font-weight: 500;
}

/* 备注输入 */
.note-input {
  width: 100%;
  height: 90px;
  padding: 12px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  font-size: 14px;
  color: var(--color-text-primary);
  box-sizing: border-box;
  line-height: 1.6;
}

.note-placeholder {
  color: var(--color-text-tertiary);
}

.note-count {
  display: block;
  text-align: right;
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-top: 4px;
}

/* 协议 */
.agreement {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-top: 18px;
  padding: 10px 12px;
  background: var(--color-surface-dim);
  border-radius: var(--radius-md);
}

.agreement-text {
  flex: 1;
  font-size: 11px;
  color: var(--color-text-tertiary);
  line-height: 1.5;
}

/* ════════════════════════════════════════ */
/* 底部操作栏                                 */
/* ════════════════════════════════════════ */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 0.5px solid var(--color-border-light);
  padding: 10px 20px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 20;
}

.bottom-prev {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 14px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--color-surface-dim);
  font-size: 14px;
  color: var(--color-text-secondary);
  font-weight: 600;
  flex-shrink: 0;
}

.bottom-prev-placeholder {
  width: 80px;
  flex-shrink: 0;
}

.bottom-next {
  flex: 1;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 15px;
  font-weight: 700;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow-primary);
  line-height: 44px;
  padding: 0;
}

.bottom-next::after {
  border: none;
}

.bottom-next.disabled {
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  box-shadow: none;
}


/* ════════════════════════════════════════════
   Personality Quiz Page (pages/personality-quiz/personality-quiz.wxss)
   ════════════════════════════════════════════ */
.page {
  min-height: 100vh;
  background: var(--color-background);
}

/* ════════════════════════════════════════ */
/* 顶部进度条 (sticky)                       */
/* ════════════════════════════════════════ */
.quiz-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-surface);
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px 6px;
}

.skip-btn {
  font-size: 13px;
  color: var(--color-text-tertiary);
  padding: 4px 0;
}

.q-counter {
  font-size: 13px;
  color: var(--color-text-tertiary);
  font-weight: 600;
}

.progress-track {
  height: 1.5px;
  background: var(--color-border);
  margin: 0 20px 10px;
  border-radius: 1px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--color-primary);
  border-radius: 1px;
  transition: width 350ms ease;
}

/* ════════════════════════════════════════ */
/* 问题卡                                    */
/* ════════════════════════════════════════ */
.question-card {
  position: relative;
  margin: 16px 20px;
  padding: 28px 24px;
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, #FFFDF9 0%, #F5EDE3 100%);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.deco-icons {
  position: absolute;
  top: 14px;
  right: 18px;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  opacity: 0.4;
  z-index: 0;
}

.question-label {
  display: block;
  font-size: 11px;
  color: var(--color-text-tertiary);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 12px;
  position: relative;
  z-index: 1;
}

.question-text {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text-primary);
  line-height: 1.5;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
}

/* 答案选项 */
.options-wrap {
  position: relative;
  z-index: 1;
}

.option-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  transition: all 200ms ease;
}

.option-card.selected {
  border-color: var(--color-primary);
  background: var(--color-primary-50);
}

.option-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all 200ms ease;
}

.option-card.selected .option-badge {
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.option-text {
  flex: 1;
  font-size: 14px;
  color: var(--color-text-primary);
  line-height: 1.5;
}

.or-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.or-text {
  font-size: 12px;
  color: var(--color-text-tertiary);
  font-style: italic;
}

/* ════════════════════════════════════════ */
/* 维度指示器                                */
/* ════════════════════════════════════════ */
.dim-indicator {
  margin: 0 20px 16px;
  padding: 14px 16px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.dim-label {
  display: block;
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-bottom: 10px;
  text-align: center;
}

.dim-groups {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.dim-group {
  display: flex;
  gap: 5px;
}

.dim-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-border);
}

.dim-dot.lit {
  background: var(--color-primary);
}

/* ════════════════════════════════════════ */
/* 生成中预览                                */
/* ════════════════════════════════════════ */
.gen-preview {
  margin: 0 20px 16px;
}

.gen-label {
  display: block;
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.gen-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 800ms linear infinite;
  flex-shrink: 0;
}

.gen-text {
  font-size: 13px;
  color: var(--color-text-secondary);
}

/* ════════════════════════════════════════ */
/* 上一题预览                                */
/* ════════════════════════════════════════ */
.prev-preview {
  margin: 0 20px 20px;
}

.prev-divider {
  height: 0.5px;
  background: var(--color-border);
  margin-bottom: 12px;
}

.prev-text {
  font-size: 12px;
  color: var(--color-text-tertiary);
}


/* ════════════════════════════════════════════
   Personality Result Page (pages/personality-result/personality-result.wxss)
   ════════════════════════════════════════════ */
.page {
  min-height: 100vh;
  background: var(--color-background);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ════════════════════════════════════════ */
/* 导航栏 (sticky)                           */
/* ════════════════════════════════════════ */
.nav-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-surface);
}

.result-nav {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;

.result-nav .nav-title {

/* ════════════════════════════════════════ */

}

.hero-deco-1 {

  right: -25px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--color-accent);
  opacity: 0.08;
}

.hero-deco-2 {
  position: absolute;
  bottom: -20px;
  left: -20px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--color-primary);
  opacity: 0.06;
}

.mascot-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;

.personality-name {

  font-weight: 700;

.hero-card .golden-divider {

  z-index: 1;
}

.tagline {
  display: block;
  font-size: 14px;
  font-style: italic;
  color: var(--color-secondary);
  line-height: 1.6;
  margin-bottom: 18px;

  z-index: 1;
}

/* 2x2 维度徽章 */

  flex-wrap: wrap;
  gap: 8px;

  z-index: 1;
}

.dim-badge {

  align-items: center;

}

.dim-badge.terracotta { background: #FBF0E8; color: #C07548; }
.dim-badge.olive { background: #EEF5EB; color: #5E8450; }
.dim-badge.amber { background: #FDF6E8; color: #B8923A; }
.dim-badge.slate { background: #E5EDEB; color: #5A7E76; }

.dim-letter {
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
}

.dim-label {
  font-size: 12px;
  line-height: 1;
  font-weight: 600;
}

/* ════════════════════════════════════════ */
/* 通用内容卡片                              */
/* ════════════════════════════════════════ */
.section-card {
  margin: 0 20px 12px;
  padding: 18px 16px;
}

.card-title {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 10px;
}

.card-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.card-title-row .card-title {
  margin-bottom: 0;
}

.desc-text {
  display: block;
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.8;
}

.kw {
  color: var(--color-primary);
  font-weight: 700;
}

/* 适合的餐厅 pill */

  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.restaurant-pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--color-accent-light);
  color: var(--color-accent-hover);
  font-size: 13px;
  font-weight: 600;
}

/* 推荐拼桌食人格 */
.match-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.match-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 0.5px solid var(--color-border-light);
  border-left: 4px solid var(--color-border);
}

.match-card.terracotta { border-left-color: #D4845A; }
.match-card.olive { border-left-color: #7B9E6B; }
.match-card.amber { border-left-color: #E8C87A; }
.match-card.slate { border-left-color: #5A7E76; }

.match-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

.match-info {
  flex: 1;
  min-width: 0;
}

.match-name {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 2px;
}

.match-desc {
  font-size: 12px;
  color: var(--color-text-tertiary);
}

/* 雷区提醒 */
.warning-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.warning-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.warning-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--state-warning);
  margin-top: 6px;
  flex-shrink: 0;
}

.warning-text {
  flex: 1;
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.6;
}

/* ════════════════════════════════════════ */
/* 经典引用                                  */
/* ════════════════════════════════════════ */
.quote-section {
  position: relative;
  margin: 8px 20px 16px;
  padding: 20px 16px;
  text-align: center;
}

.quote-mark {
  display: block;
  font-size: 40px;
  font-family: Georgia, serif;
  color: var(--color-accent);
  line-height: 1;
  margin-bottom: 4px;
  opacity: 0.5;
}

.quote-text {
  display: block;
  font-size: 15px;
  font-style: italic;
  color: var(--color-primary);
  line-height: 1.7;
}

/* ════════════════════════════════════════ */
/* 分享卡片预览                              */
/* ════════════════════════════════════════ */
.share-preview-wrap {
  margin: 0 20px 16px;
}

.preview-label {
  display: block;
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
}

.share-preview-card {
  padding: 20px 16px 14px;
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, #FFFDF9 0%, #FBF7F2 100%);
  border: 1px solid var(--color-accent);
  text-align: center;
}

.sp-mascot {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 8px;
  overflow: hidden;
}

.sp-code {
  display: block;
  font-size: 16px;
  font-weight: 800;
  color: var(--color-primary);
  letter-spacing: 3px;
  margin-bottom: 4px;
}

.sp-name {
  display: block;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}

.sp-tagline {
  display: block;
  font-size: 11px;
  font-style: italic;
  color: var(--color-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}

.sp-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding-top: 10px;
  border-top: 0.5px solid var(--color-border);
}

.sp-brand-text {
  font-size: 10px;
  color: var(--color-text-tertiary);
}

/* ════════════════════════════════════════ */
/* 底部固定操作栏                            */
/* ════════════════════════════════════════ */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 0.5px solid var(--color-border);
  padding: 10px 20px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  z-index: 20;
}

.bottom-bar-inner {
  display: flex;
  gap: 12px;
}

.action-btn {
  flex: 1;
  height: 44px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 15px;
  font-weight: 700;
}

.action-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  box-shadow: var(--shadow-primary);
}

.action-outline {
  background: transparent;
  color: var(--color-primary);
  border: 1.5px solid var(--color-primary);
}


/* ════════════════════════════════════════════
   Invite Code Page (pages/invite-code/invite-code.wxss)
   ════════════════════════════════════════════ */
.page {
  min-height: 100vh;
  background: var(--color-background);
}

/* ── 导航栏 ── */
.nav-bar-custom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--color-surface);
  border-bottom: 0.5px solid var(--color-border-light);
}

.nav-back {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--color-text-primary);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.nav-right {
  width: 32px;
  height: 32px;
}

/* ── Hero 区域 ── */
.hero-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px 24px;
  text-align: center;
}

.hero-ring {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 3px solid var(--color-accent);
  background: linear-gradient(135deg, var(--color-accent-light), var(--color-primary-50));
  box-shadow: 0 4px 16px rgba(232, 200, 122, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.hero-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 8px;
}

.hero-subtitle {
  font-size: 16px;
  color: var(--color-text-secondary);
  margin-bottom: 6px;
}

.hero-tagline {
  font-size: 14px;
  font-style: italic;
  color: var(--color-text-tertiary);
}

/* ── 输入区域 ── */
.input-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 24px;
}

.code-input {
  width: 280px;
  height: 56px;
  background: var(--color-surface-dim);
  border-radius: var(--radius-lg);
  border: 1.5px solid transparent;
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--color-text-primary);
  letter-spacing: 4px;
  font-family: 'SF Mono', 'Menlo', monospace;
  margin-bottom: 20px;
  box-sizing: border-box;
}

.code-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 4px rgba(232, 200, 122, 0.15);
  background: var(--color-surface);
}

.code-placeholder {
  color: var(--color-text-tertiary);
  font-weight: 600;
  letter-spacing: 4px;
}

/* 验证按钮 */
.verify-btn {
  width: 200px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 16px;
  font-weight: 700;
  border: none;
  box-shadow: var(--shadow-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 44px;
  padding: 0;
}

.verify-btn::after {
  border: none;
}

.verify-btn-disabled {
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  box-shadow: none;
}

/* 帮助文字 */
.help-text {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 16px;
}

.help-main {
  font-size: 12px;
  color: var(--color-text-tertiary);
}

.help-link {
  font-size: 13px;
  color: var(--color-primary);
  text-decoration: underline;
  font-weight: 600;
}

/* ── 通用间距 ── */
.section-px { padding-left: 20px; padding-right: 20px; }
.section-mb { margin-bottom: 24px; }

/* ── 信息卡片 ── */
.info-card {
  padding: 18px 16px;
}

.info-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.info-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.info-body {
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.8;
}

.keyword {
  color: var(--color-primary);
  font-weight: 700;
}

/* ── 成功状态预览 ── */
.success-preview {
  opacity: 0.7;
}

.success-label {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
  padding-left: 4px;
}

.success-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1.5px dashed var(--color-border);
  text-align: center;
}

.success-check {
  margin-bottom: 10px;
}

.success-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--state-success);
  margin-bottom: 6px;
}

.success-desc {
  font-size: 13px;
  color: var(--color-text-secondary);
  line-height: 1.6;
}


/* ════════════════════════════════════════════
   Messages Page (pages/messages/messages.wxss)
   ════════════════════════════════════════════ */
.page {
  min-height: 100vh;
  background: var(--color-background);
}

/* ── 顶部栏 (sticky) ── */
.header-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-background);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 10px;
  position: relative;
}

.top-bar-left {
  width: 60px;
}

.top-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.read-all-btn {
  font-size: 12px;
  color: var(--color-primary);
  font-weight: 600;
  width: 60px;
  text-align: right;
}

/* ── 筛选标签栏 ── */
.filter-bar {
  padding: 0 20px 12px;
  white-space: nowrap;
}

.msg-filter-pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 18px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  margin-right: 10px;
  background: var(--color-surface-dim);
  color: var(--color-text-secondary);

}

.msg-filter-pill.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

/* ── 消息列表 ── */
.msg-list {
  padding-top: 4px;
}

.section-px { padding-left: 20px; padding-right: 20px; }

.section-label {
  display: block;
  font-size: 12px;
  color: var(--color-text-tertiary);
  font-weight: 600;
  padding: 12px 20px 8px;
}

.notif-gap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 通知卡片 */
.notif-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.notif-muted {
  opacity: 0.65;
}

/* 左侧图标 */
.notif-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* 右侧内容 */
.notif-content {
  flex: 1;
  min-width: 0;
}

.notif-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.notif-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-primary);
  flex: 1;
  min-width: 0;
}

.unread-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-primary);
  flex-shrink: 0;
  margin-left: 8px;
}

.notif-body {
  font-size: 13px;
  color: var(--color-text-secondary);
  line-height: 1.5;
  margin-bottom: 5px;
}

.notif-time {
  font-size: 11px;
  color: var(--color-text-tertiary);

/* ── 空状态 ── */
.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;

.empty-text {

  color: var(--color-text-tertiary);
}


/* ════════════════════════════════════════════

.credit-level-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  background: var(--credit-positive-bg);
  color: var(--credit-positive);
}

/* 指标网格 */
.metrics-grid {
  display: flex;
  justify-content: space-between;
  margin-bottom: 16px;
}

.metric-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

/* 进度环 */
.progress-ring {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 3px solid var(--state-success);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(90, 158, 107, 0.1);
}

.ring-value {
  font-size: 12px;
  font-weight: 700;
  color: var(--state-success);
}

/* 综合评分环（金色渐变 + 赤陶色边框） */
.ring-score {
  border: 3px solid var(--color-primary);
  background: linear-gradient(135deg, var(--color-accent-light), var(--color-primary-50));
}

.ring-value-score {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-primary);
}

.metric-label {
  font-size: 11px;
  color: var(--color-text-secondary);
}

/* 信用标签行 */
.credit-tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 12px;
  border-top: 0.5px solid var(--color-border-light);
}

/* ════════════════════════════════════════ */
/* 入席名额卡片                               */
/* ════════════════════════════════════════ */
.quota-card {
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.quota-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 12px;
}

.quota-dots {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.quota-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}

.dot-filled {
  background: var(--color-secondary);
}

.dot-empty {
  background: transparent;
  border: 1.5px solid var(--color-border);
}

.quota-text {
  font-size: 13px;
  color: var(--color-text-secondary);
  margin-bottom: 14px;
}

.invite-friend-btn {
  width: 100%;
  height: 42px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 15px;
  font-weight: 700;
  border: none;
  box-shadow: var(--shadow-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 42px;
  padding: 0;
}

.invite-friend-btn::after {
  border: none;
}

/* ════════════════════════════════════════ */
/* 菜单列表                                   */
/* ════════════════════════════════════════ */
.menu-card {
  padding: 4px 16px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--color-border-light);
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-icon-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.menu-label {
  flex: 1;
  font-size: 15px;
  color: var(--color-text-primary);
  font-weight: 500;
}

/* ════════════════════════════════════════ */
/* 退出登录                                   */
/* ════════════════════════════════════════ */
.logout-wrap {
  display: flex;
  justify-content: center;
  padding: 8px 0 12px;
}

.logout-text {
  font-size: 14px;
  color: var(--color-text-tertiary);
}
