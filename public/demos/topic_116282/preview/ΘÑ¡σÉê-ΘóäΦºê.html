<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>饭合 · 预览</title>
  <style>
/* ============================================
   饭合 Preview Styles - 内嵌版本
   ============================================ */

/* Phone Frame */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #1a1a1a;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: var(--color-background);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
}

.status-bar {
  height: 44px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}

.status-time {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.page-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
}

.page-container::-webkit-scrollbar { display: none; }

.home-indicator {
  height: 34px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.home-indicator::after {
  content: '';
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: var(--color-text-primary);
  opacity: 0.8;
}

.tab-bar {
  position: absolute;
  bottom: 34px;
  left: 0;
  right: 0;
  height: 50px;
  background: #FFFDF9;
  border-top: 1px solid #EDE5DB;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  padding-bottom: 8px;
  z-index: 100;
}

.tab-bar.hidden { display: none; }

.icon-svg {
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}

.transition-overlay {
  position: absolute;
  inset: 0;
  background: var(--color-background);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 200ms ease;
}

.transition-overlay.active {
  opacity: 1;
}

.sticky { position: sticky; }


/* ============================================
   2. CSS Variables (from app.wxss)
   ============================================ */

:root {
  /* Brand Colors */
  --color-primary: #D4845A;
  --color-primary-hover: #C07548;
  --color-primary-active: #A8643E;
  --color-primary-light: #F5EDE3;
  --color-primary-50: #FBF7F2;
  --color-primary-100: #F0E5D5;

  --color-secondary: #7B9E6B;
  --color-secondary-light: #EEF5EB;
  --color-secondary-hover: #6B8C5C;

  --color-accent: #E8C87A;
  --color-accent-light: #FDF6E8;
  --color-accent-hover: #D4B56A;

  /* Background & Surface */
  --color-background: #F5EDE3;
  --color-surface: #FFFDF9;
  --color-surface-elevated: #FFFFFF;
  --color-surface-dim: #F0E8DF;

  /* Text */
  --color-text-primary: #2C2420;
  --color-text-secondary: #6B5D52;
  --color-text-tertiary: #A09589;
  --color-text-inverse: #FFFDF9;
  --color-text-link: #D4845A;

  /* Border */
  --color-border: #EDE5DB;
  --color-border-light: #F5EDE3;

  /* Semantic */
  --state-success: #5A9E6B;
  --state-success-light: #EEF5EB;
  --state-warning: #D4A05A;
  --state-warning-light: #FDF6E8;
  --state-error: #D45A5A;
  --state-error-light: #FBEDED;
  --state-info: #5A8E9E;

  /* Credit */
  --credit-positive: #5A9E6B;
  --credit-positive-bg: #EEF5EB;
  --credit-warning: #D4A05A;
  --credit-warning-bg: #FDF6E8;
  --credit-negative: #D45A5A;
  --credit-negative-bg: #FBEDED;

  /* Radius */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 0.5px 1px rgba(44, 36, 32, 0.04);
  --shadow-sm: 0 0.5px 1.5px rgba(44, 36, 32, 0.06);
  --shadow-md: 0 1px 4px rgba(44, 36, 32, 0.07);
  --shadow-card: 0 1px 6px rgba(44, 36, 32, 0.06);
  --shadow-elevated: 0 4px 12px rgba(44, 36, 32, 0.12);
  --shadow-primary: 0 1px 4px rgba(212, 132, 90, 0.25);

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
  --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);

  background: var(--color-background);
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  color: var(--color-text-primary);
  font-size: 14px;
  line-height: 1.5;
}


/* ============================================
   3. Global Utility Classes
   ============================================ */

.font-serif { font-family: 'Songti SC', 'STSong', 'SimSun', Georgia, serif; }
.font-sans { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-inverse { color: var(--color-text-inverse); }
.text-brand { color: var(--color-primary); }
.text-olive { color: var(--color-secondary); }
.text-golden { color: var(--color-accent); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-brand { background: var(--color-primary); }
.bg-brand-light { background: var(--color-primary-light); }
.bg-surface { background: var(--color-surface); }
.bg-surface-dim { background: var(--color-surface-dim); }
.bg-background { background: var(--color-background); }
.bg-olive-light { background: var(--color-secondary-light); }
.bg-golden-light { background: var(--color-accent-light); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-primary { box-shadow: var(--shadow-primary); }

.radius-sm { border-radius: var(--radius-sm); }
.radius-md { border-radius: var(--radius-md); }
.radius-lg { border-radius: var(--radius-lg); }
.radius-xl { border-radius: var(--radius-xl); }
.radius-full { border-radius: var(--radius-full); }

.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.card-lift {
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}
.card-lift:active {
  transform: translateY(-1px);
  box-shadow: var(--shadow-elevated);
}

.btn-press {
  transition: transform var(--transition-fast);
}
.btn-press:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.meal-card {
  transition: transform 200ms ease, opacity 200ms ease;
}
.meal-card:active {
  transform: scale(0.98);
  opacity: 0.95;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 16px;
  height: 40px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 14px;
  font-weight: 600;
  border: none;
  box-shadow: var(--shadow-primary);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 16px;
  height: 40px;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--color-accent);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--color-accent);
}

.btn-card-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 13px;
  font-weight: 600;
  border: none;
  box-shadow: var(--shadow-primary);
}

.btn-card-disabled {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--color-surface-dim);
  color: var(--color-text-tertiary);
  font-size: 13px;
  font-weight: 600;
  border: none;
}

.cuisine-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  background: var(--color-primary-light);
  color: var(--color-primary);
}

.dish-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  background: var(--color-surface-dim);
  color: var(--color-text-secondary);
}

.credit-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}

.credit-tag.positive {
  background: var(--credit-positive-bg);
  color: var(--credit-positive);
}

.credit-tag.warning {
  background: var(--credit-warning-bg);
  color: var(--credit-warning);
}

.personality-badge {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

.personality-mini {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

.filter-pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border: 1.5px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  transition: all 200ms ease;
}

.filter-pill.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-color: var(--color-primary);
}

.progress-mini {
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: var(--color-surface-dim);
  overflow: hidden;
}

.progress-mini-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--color-secondary);
}

.notif-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--state-error);
  border: 2px solid var(--color-background);
}

.golden-divider {
  width: 40px;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
  margin: 0 auto;
}

.scroll-x {
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}
.scroll-x::-webkit-scrollbar {
  display: none;
  height: 0;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes goldenBreath {
  0%, 100% { box-shadow: 0 0 0 2px rgba(232, 200, 122, 0.15); }
  50% { box-shadow: 0 0 0 6px rgba(232, 200, 122, 0.08); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes creditPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
}

.fade-in { animation: fadeIn 250ms ease forwards; }
.fade-slide-up { animation: fadeSlideUp 350ms ease forwards; }

.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--color-surface);
  border-bottom: 0.5px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.nav-bar .nav-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-primary);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.nav-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-cta {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 0.5px solid var(--color-border);
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 20;
}

.bottom-cta .cta-button {
  width: 100%;
  height: 48px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 16px;
  font-weight: 700;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-primary);
}


/* ============================================
   4. Component Styles
   ============================================ */

.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: #FFFDF9;
  border-top: 0.5px solid #EDE5DB;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
  flex: 1;
  padding-bottom: 8px;
}

.tab-text {
  font-size: 10px;
  font-weight: 500;
}

.tab-item.active .tab-text {
  color: #D4845A;
}

.tab-item.inactive .tab-text {
  color: #A09589;
}

.tab-icon-wrap {
  position: relative;
}

.tab-badge {
  position: absolute;
  top: -2px;
  right: -4px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #D45A5A;
  border: 1.5px solid #FFFDF9;
}

.tab-center {
  margin-top: -16px;
  padding-bottom: 8px;
}

.tab-center-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #D4845A;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(212, 132, 90, 0.35);
}

.tab-text-center {
  margin-top: 4px;
  color: #A09589;
}

.icon-img {
  display: inline-block;
  flex-shrink: 0;
}


/* ============================================
   5. Page Styles (核心样式)
   ============================================ */

.page {
  min-height: 100vh;
  background: var(--color-background);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 8px;
}

.city-selector {
  display: flex;
  align-items: center;
  gap: 4px;
}

.city-name {
  font-weight: 700;
  font-size: 15px;
  color: var(--color-text-primary);
}

.bell-wrap {
  position: relative;
}

.section-px { padding-left: 20px; padding-right: 20px; }
.section-mb { margin-bottom: 20px; }
.section-mb-lg { margin-bottom: 32px; }

.section-header-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.section-subtitle {
  font-size: 12px;
  color: var(--color-text-tertiary);
}

.section-more {
  font-size: 13px;
  color: var(--color-primary);
  font-weight: 600;
}

/* 英雄区 */
.hero-section {
  padding: 24px 20px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.deco {
  position: absolute;
  border-radius: 50%;
  z-index: 0;
}
.deco-1 {
  top: 10px; left: 20px;
  width: 40px; height: 40px;
  background: var(--color-accent);
  opacity: 0.08;
}
.deco-2 {
  top: 30px; right: 30px;
  width: 60px; height: 60px;
  background: var(--color-secondary);
  opacity: 0.06;
}
.deco-3 {
  bottom: 20px; left: 50%;
  width: 30px; height: 30px;
  background: var(--color-primary);
  opacity: 0.05;
}

.mascot-circle {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

.mascot-inner {
  width: 120px !important;
  height: 120px !important;
  border-radius: 50% !important;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.hero-title {
  display: block;
  font-size: 24px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.hero-subtitle {
  display: block;
  font-style: italic;
  font-size: 16px;
  color: var(--color-text-secondary);
  margin-bottom: 20px;
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

/* 概念卡片 */
.concept-card {
  padding: 20px;
}

.concept-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}

.concept-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--color-text-primary);
}

.concept-body {
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.75;
  margin-bottom: 16px;
}

.feature-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.feature-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
}

.feature-pill-golden {
  background: var(--color-accent-light);
  color: var(--color-accent-hover);
}

.feature-pill-olive {
  background: var(--color-secondary-light);
  color: var(--color-secondary);
}

.feature-pill-terracotta {
  background: var(--color-primary-light);
  color: var(--color-primary);
}

/* CTA卡片 */
.cta-card {
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(44, 36, 32, 0.08);
  position: relative;
  overflow: hidden;
}

.cta-deco-1 {
  position: absolute;
  top: -20px; right: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--color-accent);
  opacity: 0.08;
}

.cta-deco-2 {
  position: absolute;
  bottom: -20px; left: -20px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--color-primary);
  opacity: 0.06;
}

.cta-icon-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.cta-icon-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid var(--color-accent);
  background: var(--color-accent-light);
  opacity: 0.5;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cta-title {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.cta-desc {
  display: block;
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.6;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
}

.cta-btn {
  width: 240px;
  height: 48px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: 16px;
  font-weight: 700;
  border: none;
  box-shadow: 0 4px 16px rgba(212, 132, 90, 0.35);
  position: relative;
  z-index: 1;
}

.cta-helper {
  display: block;
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-top: 12px;
  position: relative;
  z-index: 1;
}

/* 模糊饭局预览 */
.preview-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 8px;
}

.preview-subtitle {

function iconHTML(name, color, size, strokeWidth) {
  const path = iconPaths[name];
  if (!path) return '';
  const sw = strokeWidth || 2;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">' + path + '</svg>';
}

function showToast(title) {
  const existing = document.getElementById('fanhe-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'fanhe-toast';
  toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.78);color:#fff;padding:12px 28px;border-radius:12px;font-size:14px;z-index:10000;pointer-events:none;max-width:80%;text-align:center;white-space:nowrap;';
  toast.textContent = title;
  document.body.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.remove(); }, 1800);
}

function splitHighlights(text, keywords) {
  if (!keywords || !keywords.length) return [{ text: text, highlight: false }];
  var escaped = keywords.map(function(k) { return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  var re = new RegExp('(' + escaped.join('|') + ')', 'g');
  var parts = text.split(re).filter(function(p) { return p; });
  return parts.map(function(p) { return { text: p, highlight: keywords.indexOf(p) >= 0 }; });
}
