    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    }

    }

      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;

    }

    .brand-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {

    }

    .brand-title {
      font-size: 36px;
      font-weight: bold;
      margin: 0 0 10px 0;
    }

    .brand-subtitle {

      opacity: 0.9;
      margin: 0;
    }

    .illustration {
      width: 100%;
      max-width: 500px;
      margin-bottom: 40px;
    }

    .ai-visual {
      position: relative;
      width: 100%;
      height: 280px;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: float 6s ease-in-out infinite;
    }

    .circle-1 {
      width: 120px;
      height: 120px;
      top: 20px;
      left: 40px;
      animation-delay: 0s;
    }

    .circle-2 {
      width: 80px;
      height: 80px;
      top: 100px;
      right: 60px;
      animation-delay: 2s;
    }

    .circle-3 {
      width: 60px;
      height: 60px;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      animation-delay: 4s;
    }

    .cube {
      position: absolute;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      animation: float 8s ease-in-out infinite;
    }

    .cube-1 {
      width: 50px;
      height: 50px;
      top: 60px;
      right: 100px;
      animation-delay: 1s;
    }

    .cube-2 {
      width: 40px;
      height: 40px;
      bottom: 60px;
      left: 80px;
      animation-delay: 3s;
    }

    .cube-3 {
      width: 60px;
      height: 60px;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .feature-list {
      display: flex;
      gap: 40px;
    }

    .feature-item {

      flex-direction: column;
      align-items: center;
      gap: 8px;

    }

    .feature-icon {
      font-size: 24px;
    }

    .login-right {

      justify-content: center;
      align-items: center;

    .login-form-wrapper {

    .loading-icon {

    .download-content {

    .download-info {

    .file-name {

      font-weight: bold;

      align-items: center;
      gap: 8px;
    }

    .slides-container {

      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .slide-card {
      border: 1px solid #e4e7ed;
      border-radius: 12px;
      overflow: hidden;
      background: #fafafa;
      transition: all 0.3s;
    }

    .slide-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      transform: translateY(-4px);
    }

    .slide-thumbnail {
      height: 180px;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e7ed 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    .slide-number {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(64, 158, 255, 0.1);
      color: #409EFF;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .slide-title-preview {
      font-size: 16px;
      font-weight: bold;
      color: #303133;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .slide-content-preview {
      font-size: 13px;
      color: #606266;
      text-align: center;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .slide-footer {
      padding: 12px 16px;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slide-type {
      font-size: 12px;
      color: #909399;
    }

    .slide-badge {
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
      .login-left {
        width: 100%;
        padding: 40px 20px;
      }
      .login-right {
        width: 100%;
        padding: 40px 20px;
      }
      .header {
        padding: 12px 20px;
      }
      .main-content {
        padding: 30px 20px;
      }
      .hero-title {
        font-size: 32px;
      }
      .input-wrapper {
        flex-direction: column;
      }
      .generate-btn {
        width: 100%;
      }
    }
  </style>
</head>

                <el-button type="text" @click="loadHistory">刷新</el-button>
              </div>

              <div v-if="historyLoading" class="loading-wrapper">
                <el-skeleton :rows="5" animated />
              </div>

              <div v-else-if="taskList.length === 0" class="empty-state">
                <el-icon class="empty-icon"><Document /></el-icon>
                <p>暂无生成记录</p>
                <p class="empty-hint">输入主题开始生成您的第一个 PPT</p>
              </div>

              <el-table v-else :data="taskList" class="task-table" stripe border>
                <el-table-column prop="topic" label="主题" min-width="200" />
                <el-table-column prop="numSlides" label="页数" width="80" />
                <el-table-column prop="status" label="状态" width="100">
                  <template #default="scope">
                    <el-tag :type="getStatusType(scope.row.status)">{{ getStatusText(scope.row.status) }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="createdAt" label="创建时间" width="180">
                  <template #default="scope">{{ formatTime(scope.row.createdAt) }}</template>
                </el-table-column>
                <el-table-column label="操作" width="200" fixed="right">
                  <template #default="scope">
                    <el-button v-if="scope.row.status === 'COMPLETED'" type="primary" size="small" @click="downloadPpt(scope.row.id)">
                      <el-icon><Download /></el-icon>
                      下载
                    </el-button>
                    <el-button type="danger" size="small" @click="deleteTask(scope.row.id)">
                      <el-icon><Delete /></el-icon>
                      删除
                    </el-button>
                  </template>
                </el-table-column>
              </el-table>

              <div v-if="totalElements > 0" class="pagination-wrapper">
                <el-pagination v-model:current-page="currentPageNum" v-model:page-size="pageSize" :total="totalElements" :page-sizes="[10, 20, 50]" layout="total, sizes, prev, pager, next, jumper" @size-change="handlePageChange" @current-change="handlePageChange" />
              </div>
            </section>
          </main>

          <el-dialog v-model="showDownloadDialog" title="下载 PPT" width="400px" @close="handleDialogClose">
            <div v-if="downloadLoading" class="download-loading">
              <el-icon class="loading-icon"><Loading /></el-icon>
              <p>正在生成下载链接...</p>
            </div>
            <div v-else-if="downloadTokenUrl" class="download-content">
              <div class="download-info">
                <p class="file-name">{{ downloadFileName }}</p>
                <p class="file-size">文件大小：{{ formatFileSize(downloadFileSize) }}</p>
                <p class="expire-time">链接剩余时间：<span class="countdown-num">{{ countdownText || '计算中...' }}</span></p>
              </div>
              <el-button type="primary" size="large" style="width: 100%" @click="handleDownload">
                <el-icon><Download /></el-icon>
                点击下载
              </el-button>
            </div>
          </el-dialog>
        </div>
      `,
      setup() {
        const currentPage = ref('login')
        const form = ref({ username: '', password: '' })
        const registerForm = ref({ username: '', email: '', password: '' })
        const loading = ref(false)
        const registerLoading = ref(false)
        const showRegister = ref(false)
        
        const topic = ref('')
        const generating = ref(false)
        const historyLoading = ref(false)
        const taskList = ref([])
        const currentPageNum = ref(1)
        const pageSize = ref(10)
        const totalElements = ref(0)
        const showDownloadDialog = ref(false)
        const downloadLoading = ref(false)
        const downloadUrl = ref('')
        const downloadTokenUrl = ref('')
        const downloadFileName = ref('')
        const downloadFileSize = ref(0)
        const downloadExpiresAt = ref('')
        const countdownText = ref('')
        const showPreview = ref(false)
        const currentTopic = ref('')
        const slidePreviews = ref([])
        
        let countdownTimer = null

        const userInfo = ref({ username: '演示用户' })

        const quickTopics = [
          '人工智能发展趋势',
          '市场分析报告',
          '产品发布会',
          '年终总结汇报'
        ]

        const rules = {
          username: [
            { required: true, message: '请输入用户名', trigger: 'blur' },
            { min: 3, max: 20, message: '用户名长度在 3 到 20 个字符', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' },
            { min: 6, max: 32, message: '密码长度在 6 到 32 个字符', trigger: 'blur' }
          ]
        }

        const registerRules = {
          username: [
            { required: true, message: '请输入用户名', trigger: 'blur' },
            { min: 3, max: 20, message: '用户名长度在 3 到 20 个字符', trigger: 'blur' }
          ],
          email: [
            { required: true, message: '请输入邮箱', trigger: 'blur' },
            { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' },
            { min: 6, max: 32, message: '密码长度在 6 到 32 个字符', trigger: 'blur' }
          ]
        }

        const handleLogin = async () => {
          if (!form.value.username || !form.value.password) {
            ElMessage.warning('请输入用户名和密码')
            return
          }
          loading.value = true
          await new Promise(resolve => setTimeout(resolve, 1500))
          ElMessage.success('登录成功')
          currentPage.value = 'home'
          userInfo.value = { username: form.value.username }
          loadHistory()
          loading.value = false
        }

        const handleRegister = async () => {
          if (!registerForm.value.username || !registerForm.value.email || !registerForm.value.password) {
            ElMessage.warning('请填写完整信息')
            return
          }
          registerLoading.value = true
          await new Promise(resolve => setTimeout(resolve, 1500))
          ElMessage.success('注册成功，请登录')
          showRegister.value = false
          registerForm.value = { username: '', email: '', password: '' }
          registerLoading.value = false
        }

        const handleUserCommand = (command) => {
          if (command === 'logout') {
            currentPage.value = 'login'
            form.value = { username: '', password: '' }
            ElMessage.success('已退出登录')
          }
        }

        const selectTopic = (t) => {
          topic.value = t
        }

        const handleGenerate = async () => {
          if (!topic.value.trim()) {
            ElMessage.warning('请输入主题')
            return
          }

          generating.value = true
          await new Promise(resolve => setTimeout(resolve, 3000))
          
          currentTopic.value = topic.value.trim()
          slidePreviews.value = generateMockSlides(topic.value.trim())
          showPreview.value = true
          
          const newTask = {
            id: 'task-' + Date.now(),
            topic: topic.value.trim(),
            numSlides: slidePreviews.value.length,
            status: 'COMPLETED',
            createdAt: new Date().toISOString(),
            fileName: topic.value.trim() + '.pptx',
            fileSize: Math.floor(Math.random() * 2000000) + 1000000
          }
          taskList.value.unshift(newTask)
          totalElements.value = taskList.value.length

          ElMessage.success('PPT生成成功！')
          topic.value = ''
          generating.value = false
        }

        const generateMockSlides = (topic) => {
          return [
            { id: 1, title: topic, content: '专业汇报演示文档', type: '封面' },
            { id: 2, title: '目录', content: '一、项目背景\n二、核心内容\n三、成果展示\n四、未来规划', type: '目录' },
            { id: 3, title: '项目背景', content: '本项目旨在解决行业痛点，提升工作效率，为用户创造价值。', type: '要点' },
            { id: 4, title: '核心数据', content: '完成率：95%\n用户满意度：4.8/5\n成本节约：30%', type: '数据' },
            { id: 5, title: '关键成果', content: '1. 产品上线并稳定运行\n2. 用户量突破预期目标\n3. 获得行业认可与好评', type: '成果' },
            { id: 6, title: '问题与挑战', content: '面对市场竞争压力，我们持续优化产品体验，提升核心竞争力。', type: '分析' },
            { id: 7, title: '未来规划', content: '下一阶段将持续迭代优化，拓展新功能，提升市场占有率。', type: '展望' },
            { id: 8, title: 'Q&A', content: '感谢聆听\n欢迎提问', type: '结束' }
          ]
        }

        const loadHistory = async () => {
          historyLoading.value = true
          await new Promise(resolve => setTimeout(resolve, 500))
          taskList.value = [...mockTaskList]
          totalElements.value = taskList.value.length
          historyLoading.value = false
        }

        const handlePageChange = () => {
          loadHistory()
        }

        const getStatusType = (status) => {
          const map = {
            PENDING: 'info',
            PROCESSING: 'warning',
            COMPLETED: 'success',
            FAILED: 'danger',
            CANCELLED: 'default'
          }
          return map[status] || 'default'
        }

        const getStatusText = (status) => {
          const map = {
            PENDING: '等待处理',
            PROCESSING: '处理中',
            COMPLETED: '已完成',
            FAILED: '失败',
            CANCELLED: '已取消'
          }
          return map[status] || status
        }

        const getSlideTypeTag = (type) => {
          const map = {
            '封面': 'primary',
            '目录': 'info',
            '数据': 'warning',
            '要点': 'success',
            '案例': 'primary',
            '分析': 'danger',
            '展望': 'success',
            '结束': 'default',
            '成果': 'warning'
          }
          return map[type] || 'default'
        }

        const formatTime = (time) => {
          if (!time) return ''
          const date = new Date(time)
          return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          })
        }

        const formatFileSize = (size) => {
          if (!size) return '未知'
          if (size < 1024) return size + ' B'
          if (size < 1024 * 1024) return (size / 1024).toFixed(2) + ' KB'
          return (size / (1024 * 1024)).toFixed(2) + ' MB'
        }

        const downloadPpt = async (taskId) => {
          showDownloadDialog.value = true
          downloadLoading.value = true
          downloadUrl.value = ''
          downloadExpiresAt.value = ''
          
          await new Promise(resolve => setTimeout(resolve, 1500))
          
          const task = taskList.value.find(t => t.id === taskId) || { fileName: '演示文档.pptx', fileSize: 2456789 }
          downloadFileName.value = task.fileName
          downloadFileSize.value = task.fileSize
          downloadTokenUrl.value = 'mock-download-url'
          
          const expireTime = new Date(Date.now() + 30 * 60 * 1000)
          downloadExpiresAt.value = expireTime.toISOString()
          startCountdown(expireTime.toISOString())
          
          downloadLoading.value = false
        }

        const startCountdown = (expiresAt) => {
          if (countdownTimer) {
            clearInterval(countdownTimer)
          }
          
          const updateCountdown = () => {
            const expiresTime = new Date(expiresAt).getTime()
            const now = new Date().getTime()
            const remaining = expiresTime - now
            
            if (remaining <= 0) {
              countdownText.value = '链接已过期'
              clearInterval(countdownTimer)
              return
            }
            
            const hours = Math.floor(remaining / (1000 * 60 * 60))
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60))
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000)
            
            if (hours > 0) {
              countdownText.value = `${hours}小时${minutes}分${seconds}秒`
            } else if (minutes > 0) {
              countdownText.value = `${minutes}分${seconds}秒`
            } else {
              countdownText.value = `${seconds}秒`
            }
          }
          
          updateCountdown()
          countdownTimer = setInterval(updateCountdown, 1000)
        }

        const handleDownload = async () => {
          if (!downloadTokenUrl.value) return
          
          if (downloadExpiresAt.value) {
            const expiresTime = new Date(downloadExpiresAt.value).getTime()
            const now = new Date().getTime()
            if (now > expiresTime) {
              ElMessage.error('下载链接已过期，请重新获取')
              showDownloadDialog.value = false
              return
            }
          }
          
          downloadLoading.value = true
          await new Promise(resolve => setTimeout(resolve, 1000))
          
          const content = '这是一个演示PPT文件内容，实际应用中将是真实的.pptx文件。'
          const blob = new Blob([content], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' })
          const blobUrl = window.URL.createObjectURL(blob)
          const link = document.createElement('a')
          link.href = blobUrl
          link.download = downloadFileName.value
          document.body.appendChild(link)
          link.click()
          document.body.removeChild(link)
          window.URL.revokeObjectURL(blobUrl)
          
          ElMessage.success('下载成功')
          downloadLoading.value = false
          showDownloadDialog.value = false
        }

        const handleDialogClose = () => {
          downloadTokenUrl.value = ''
          downloadExpiresAt.value = ''
          countdownText.value = ''
          if (countdownTimer) {
            clearInterval(countdownTimer)
            countdownTimer = null
          }
        }

        const deleteTask = async (taskId) => {
          await ElMessageBox.confirm('确定要删除这个任务吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          })
          
          taskList.value = taskList.value.filter(t => t.id !== taskId)
          totalElements.value = taskList.value.length
          ElMessage.success('删除成功')
        }

        onMounted(() => {
          if (currentPage.value === 'home') {
            loadHistory()
          }
        })

        onUnmounted(() => {
          if (countdownTimer) {
            clearInterval(countdownTimer)
          }
        })

        return {
          currentPage,
          form,
          registerForm,
          loading,
          registerLoading,
          showRegister,
          topic,
          generating,
          historyLoading,
          taskList,
          currentPageNum,
          pageSize,
          totalElements,
          showDownloadDialog,
          downloadLoading,
          downloadUrl,
          downloadTokenUrl,
          downloadFileName,
          downloadFileSize,
          downloadExpiresAt,
          countdownText,
          showPreview,
          currentTopic,
          slidePreviews,
          userInfo,
          quickTopics,
          rules,
          registerRules,
          handleLogin,
          handleRegister,
          handleUserCommand,
          selectTopic,
          handleGenerate,
          loadHistory,
          handlePageChange,
          getStatusType,
          getStatusText,
          getSlideTypeTag,
          formatTime,
          formatFileSize,
          downloadPpt,
          startCountdown,
          handleDownload,
          handleDialogClose,
          deleteTask
        }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
