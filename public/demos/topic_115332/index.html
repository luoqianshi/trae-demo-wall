的插件也真是一点一点长出来的额，自己就是用户自己体验",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-006",title:"Get笔记浏览器插件开发迭代全记录（v1.0.5 → v1.4.6）",content:"从一个简单的浏览器插件出发，经历 31 次提交、22 个版本标签，逐步迭代成一个功能完善的 AI 对话 + 笔记保存工具。以下是整个开发过程的完整复盘。  ---  ## 📦 v1.0.x — 基础功能（原始版本）  v1.0.5 是最初的版本，只有基础的页面内容提取、保存到 Get笔记、AI 对话、右键菜单这些功能。v1.0.9 做了一次基线备份，为后续大规模重构做准备。  ## 📦",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-007",title:"操作展示选题 ｜ focusee的解读说明｜ 我的提示词插件功能",content:"看看迭代过程",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-008",title:"贴图选题 北瓜要及时摘",content:"公众号选题  有点那种反卷的能量站的意思，就是有成果发了，才能继续长  贴图发个",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-009",title:"视频选题 ｜产品思维越来越重要：小步快跑，笨笨用户画像——视频选题",content:"get笔记和公众号排版助手的更新——小步快跑，结合产品思维30讲里面的内容——这个可以做视频选题  还有之前那个网页资料内容  关系建立伙伴的春天——越来越容易——趋势",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-010",title:"盖洛普四维度Agent讨论工具",content:"核心想法：34个才干→4个智能体，代表4个维度：  1. 战略思维型（分析、战略、学习、前瞻）- 深度思考、逻辑分析、长远规划 2. 关系建立型（交往、体谅、和谐、伯乐）- 关注人际关系、情感共鸣、团队和谐 3. 影响力型（沟通、取悦、统率、自信）- 表达能力强、善于影响他人、领导力 4. 执行力型（成就、责任、排难、统筹）- 行动导向、注重结果、高效执行  主Agent：判断场景→调用子Agen",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-011",title:"关于开发图片风格提示词插件的想法",content:"我想做一个插件，这个插件主要是用于图片风格的助手，或者至少可以把图片风格沉淀下来，方便直接复制使用。这个图片风格是存量的，可以把它保存下来，然后复制到不同的网页端。因为网页端和其他端口不打通，所以在网页端也可以方便地生成图片或套图，特别是像ChatGPT这种生成套图的场景。  这个插件可以作为提示词的集合体，不用绑定在codex或者cloud code里面。只需要放一个提示词集合器，甚至还可以分享",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-012",title:"写作模板加工工具",content:"【点子】连接Get笔记，提供多种写作加工方式的模板工具  【背景】 有很多写作需求，希望有一个工具可以： - 从Get笔记中读取内容 - 应用不同的加工模板 - 输出不同风格/格式的文本  【可能的加工方式】 - 改写润色 - 扩写缩写 - 风格转换（正式/口语/文艺等） - 结构重组 - 提炼摘要 - 多角度改写  【下一步】 - 设计工具架构 - 确定与Get笔记的集成方式 - 开发模板系统",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-013",title:"图片整理、文案整理的skill 拔取视频的流程",content:"这些其实都可以做为案例给大家分享  扒取视频，截屏，作为素材，给agent用",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-014",title:"布伦森 文班",content:"",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-015",title:"co code与codex操作流程及录屏分享",content:"突然有了这个选题，正好可以把co code和codex这两个内容串起来给大家讲一讲。还有skill，而且是在电脑端操作，我会把整个过程录下来，大家可以感受一下这个威力。我觉得还挺有意思的，就是从如何把这个视频弄下来，到后续的操作流程。",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-016",title:"识人识己播客·才干主题索引（规划）",content:"# 识人识己播客 · 才干主题索引（待做）  ## 目标  把 140 期识人识己播客按盖洛普 34 项才干做交叉索引。  ## 数据源  - 文档：`识人识己V2.0_全140期_深度整理版.docx`（5.2MB，xue-laoshi skill references） - 订阅知识库：识人识己（JawzWzlY，141条笔记）  ## 索引结构（按四大维度 × 34项才干）  ### 战略思",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-017",title:"",content:"自己的Skill怎么做的？包括自己的那个插件怎么用？我觉得好像可以给其他人用的。",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-018",title:"【选题】Skill实战分享③：薛老师视角——用外部视角照镜子",content:'## 选题定位 系列第三篇：展示最复杂的 Skill——如何把一个人的思维方式"装进"AI。  ## 薛老师视角是什么 当需要外部视角提醒时，用薛老师的积累给出回应。不是复盘、不是整理，是"从外部照镜子"。触发词："来份薛老师""薛老师视角"。  ## Skill 文件结构（最复杂的一个） ``` xue-laoshi/ ├── SKILL.md                          ',category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-019",title:"【选题】Skill实战分享②：好事珍珠项链——随时记录，定期串成文",content:"## 选题定位 系列第二篇：展示 Skill 如何融入日常生活，变成一种习惯。  ## 好事珍珠项链是什么 随时随地记录觉察碎片（珍珠），然后串成完整的文章（项链）。两个核心动作：捡珍珠 + 串项链。  ## Skill 文件结构 ``` pearl-necklace/ ├── SKILL.md          # 主文件（约200行） └── save-pearl.js     # 保存珍珠的",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-020",title:"【选题】Skill实战分享①：内容梳理助手——把口述变成走心文稿",content:"## 选题定位 系列第一篇：从最实用的场景切入，让大家看到 Skill 能解决什么具体问题。  ## 内容梳理助手是什么 把原始口述稿梳理成适合个人影响力账号（蓝莓坚持）风格的分享文稿。核心原则：保留人味、结构清晰、符合人设。  ## Skill 文件结构 ``` 内容梳理助手/ └── SKILL.md          # 主文件（唯一文件，约100行） ``` **特点：最轻量的 Skill",category:"topic",source:"Get笔记",createdAt:"2026-06-30T02:35:58.105Z",isFavorite:!1},{id:"insp-021",title:"古典——职场变化",content:"古典老师那个说未来几年有很大的职场变化，也挺有启发的，未来职场内部的晋升不太乐观  我是觉得这个可以整一个公众号，视频分享之类",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-022",title:"关于开发一个模拟多人讨论的玩具想法-盖洛普",content:'突然有一个想法，我觉得可以做一个小玩具。这个玩具有四个角色，相当于四个孩子。当你说"我想怎么做"或者"我想复盘一件事"的时候，这四个孩子会轮流给你提意见。另外还有一个综合性的小人，可以帮你综合建议和意见。我觉得可以试一试。',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-023",title:"选题：Claude Code 的打断式交互 vs 串行处理",content:"## 发现  Claude Code 有一个特别好的点：它在中间干活的时候，你跟它说点什么，它能结合你说的内容来中间调整方向。  ## 对比  **Claude Code（打断式交互）** - 正在干活 → 你打断它说一句话 → 它能及时获取这个信息 → 调整方向  **ChatBox / OpenClaw（串行处理）** - 你发了3条消息 → 它先处理第1条 → 处理完才看第2条 - 在处理",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-024",title:"选题：AI日新月异，越来越好用",content:"## 最近用AI的感受  最近重新高强度使用AI，发现有很多有意思的改进：  ### 1. Hermes 智能体的安全机制 - 对带引号的「危险操作」会真的在对话框里问你 - 你确认了才执行，更安全 - 比如重启网关这种操作，它会先问「你人在电脑前吗？」  ### 2. OpenClaw 的「梦境」功能 - 每天晚上会沉淀自己的记忆 - 自动整理和反思，像人在睡觉时大脑在整理信息  ### 3. ",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-025",title:"调整心态后更愿意尝试和分享",content:"现在有了这种心态之后，我去分享或者尝试什么事情都没问题，反正我也能承受这些问题，对我不会有太大影响，还能积累一些经验，觉得这样也挺好。",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-026",title:"让AI发挥他的优势改善我的生活决策",content:"AI擅长的东西是分析和量化  这是个很好得信息参考  拥抱ai而不是被ai吞噬  我感觉他说的和我的一些体感接近，可能让ai发挥他的分析长处，但是要有自己的判断很重要。另外要有自己的思考输出和脱离ai的部分很重要。   拥抱ai，但是不被ai吞噬。   供参考  [https://mp.weixin.qq.com/s/9\\_Ccd57WK5Wdin\\_IrhFMow](https://mp.wei",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-027",title:"【教训】涉及Skill时为什么要优先照着文档做",content:'# 【教训】涉及 Skill 时，为什么要优先照着文档做  > 2026-04-20，鑫仔发现虾宝在腾讯会议 Skill 调用中的行为模式问题  ---  ## 问题描述  鑫仔让虾堡帮忙把一段"给薛老师的话"保存到 GetNotes 素材灵感知识库。  在执行过程中，虾堡发现：鑫仔提供的"要保存的内容"实际上是虾堡自己之前发的',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-028",title:"选题灵感 001 | 从聊天中长出来的选题（2026-04-17）",content:"## 选题灵感 001 | 从聊天中长出来的选题（2026-04-17）  ---  ### 背景小记  今天和妻妻（北京-关系教练）聊天，她问了两个很有质量的问题：  > 一个是你提到一个事情只需要做两遍，第二遍的时候就是它适合去做成 skill 的时刻，你能不能分享一两个案例？ > > 第二个是你说到你做了一个薛老师的蒸馏，你可以告诉我你是怎么蒸馏薛老师的吗？  聊天过程中自然冒出了几个选题",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-029",title:"skill的使用启蒙和生长",content:"忽然意识到，就是很多skill，是生长出来的，不是规划出来的，就是我好像还有很多这样的例子——比如之前那个正反打——万维钢老师——文章阅读那个  还有比如今天这个对谈内容的梳理过程   ​   ​关于时不存在了那个点，也挺有意思的  ![](https://get-notes.umiwi.com/get_notes_prod%2F202604161529%2Fgetnotes_img_1a7823",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-030",title:"为什么要用Skill Creator——去魅之后再看",content:"## 选题：为什么要用Skill Creator——去魅之后再看  很多人觉得Skill是一个特别高大上的东西。但其实，它得像昨天三文鱼说的那样，帮助你节省时间，真的帮、对你的生活有益处，你再去学。  最大的感受就是：要对它去魅。去魅之后，再想想这个东西对你是不是真的有益处。  ---  ## 我的Skill使用经历  ### 从Chatbox开始  最开始的时候是从Chatbox那边，每次都要重",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-031",title:"鑫仔闲聊：为什么我们停不下来",content:'# 鑫仔闲聊：为什么我们停不下来  ## 核心洞察  我们为什么会不停做各种事情？  - **和谐#1**：别人有需求，你很难说不 - **排难#8**：看到问题就忍不住要去解决 - **交往#2**：被人需要的感觉很好 - **分析#3**：研究"我为什么会这样"这个过程本身也很爽  所以停下来很难——不是因为没目标，而是你的才干结构让你很难停。  ## 好问题：时不时问自己  **"最近做的事，',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-032",title:"AI帮我理解领导视角：一个关于任务分配的洞察",content:"# 素材灵感 | AI帮我理解领导视角  和多个AI对话的过程中，发现自己在天然地做「任务分配」：  - 微信主号那边的AI → 跑通过什么任务，带着相关记忆 → 自然往那个方向派活 - 不同session → 如同不同的员工，有各自的上下文和经验  这个过程让我对「管理」这件事有了非常多的换位理解——  **核心洞察：** 当你把任务分配给不同的AI时，你就是在做一个管理者的事情： - 判断哪个",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-033",title:"Plan Mode：AI开发工具的核心交互模式（Claude Code启发）",content:'# Plan Mode ：AI开发工具的核心交互模式  **来源**：B站视频《15分钟Claude Code小白入门》   **链接**：[https://b23.tv/NMMJ5hH](https://b23.tv/NMMJ5hH)   **笔记ID**：1907203606370375816  ---  ## 一、Plan Mode 是什么  Claude Code（视频中称"color c',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-034",title:"鑫仔想问薛老师的备选问题（整合版）",content:'# 鑫仔想问薛老师的备选问题  > 状态：初步有感觉的方向，待进一步打磨成具体问题  ---  ## 备选问题一  **方向：为什么我不停地做各种各样的事情？**  **背景描述：** - 我一直在做各种事情：觉察日记、AI探索、副业研究、工具学习…… - 但停下来的时候，我其实不太清楚"做什么样的事情对我来说才是对的" - 我甚至对自己的行动动机很好奇——为什么停不下来？ - 我知道"完成比完美',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-035",title:"灵感：四个子Agent架构（34才干×4维度）盖洛普",content:"## 鑫仔灵感：四个子Agent架构  来源：看完王静答疑后想到的灵感  ### 核心想法  34个才干 → 捏4个智能体，分别代表4个维度：  - 子Agent 1：战略思维型（分析、战略、学习、前瞻） - 子Agent 2：关系建立型（交往、体谅、和谐、伯乐） - 子Agent 3：影响力型（沟通、取悦、统率、自信） - 子Agent 4：执行力型（成就、责任、排难、统筹）  然后有一个主Ag",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-036",title:"鑫仔想探索：圆桌skill + 蒸馏牛人智慧",content:'## 鑫仔想探索的两个方向  ### 方向一：圆桌 skill——请了好多大人才帮我出谋划策  我想研究怎么做"圆桌"的 skill。  类似于：我有一个问题，放到圆桌里，好多大人在帮我出主意，每个人从自己的视角给建议。  这个和"蒸馏"相关——本质上是把很多人的智慧汇聚在一起。  ---  ### 方向二：蒸馏身边的牛人——像蒸馏薛老师那样  我想把身边厉害的人的智慧"蒸馏"出来。  比如薛老师',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-037",title:"虾堡向上管理案例：主动确认再执行",content:'# 虾堡的向上管理案例：主动停下来确认  我发现自己的虾堡，现在越来越会向上管理了——在做一些长城的复杂的任务，我说不清楚的时候（有些地方没有澄清的时候），它会先给我一些方案，或者提醒我补充一些内容，再来具体执行  ---  ## 案例背景  鑫仔让虾堡帮忙把一段"给薛老师的话"保存到 GetNotes 素材灵感知识库。  在执行过程中，虾堡发现：鑫仔提供的"要保存的内容"实际上是虾堡自己之前发的',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-038",title:"别为最优解纠结，先找满意的答案",content:'从Gap的迷茫到对决策机制的深度剖析，再到对自由职业路径的探索，你今天在理想与现实之间反复权衡。薛老师的解答像一把手术刀，精准切开了"憋大招"背后的心理机制，也为你指明了一条更务实的行动路径——这种对自我认知的诚实追问，本身就是一种清醒的勇气。  ---  ## 01. 诺贝尔奖得主的"满意解"  > **🌱 种子** > 因为笔记中反复提到"憋大招""想找到最优解才行动"，这很容易让人联想到追',category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-039",title:"AI Skills 自我强化：答疑整理案例与交互偏好沉淀",content:"# AI Skills 自我强化：答疑整理案例与交互偏好  ---  ## 一、鑫仔给薛老师的话  薛老师，我用AI帮忙整理了一下咱们的答疑内容，感觉去读的时候特别有节奏感，感觉也更能留下一些东西（加粗高亮，洞察提前，我能更快地抓住重点去慢一点理解感受）。  然后我感觉看思达这个对我也挺有启发的：  **思考别人需要什么，而不是我们有什么；**  **找到自己核心需要的是什么，不能什么都要，什么都",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1},{id:"insp-040",title:"有记忆的AI vs 没有记忆的AI是完全不同的工具",content:"【核心洞察】一个有记忆的AI vs 一个没有记忆的AI，是完全不同的工具  鑫仔之前会用 Gemini/DeepSeek 做自我探索类对话，但最近很久没去了。  原因是那些平台没有关于他的真正记忆，无法定制，每次对话都要重新介绍自己，无法做到真正定制化的自我探索。  只有龙虾（OpenClaw 主 session）有他的记忆——MEMORY.md、盖洛普才干、每日日志、过往对话记录——所以能真正做到",category:"material",source:"Get笔记",createdAt:"2026-06-30T02:35:58.448Z",isFavorite:!1}],nu=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36),up=()=>g1.map((i,o)=>({...i,id:i.id&&i.id!=="undefined"?i.id:nu(),createdAt:i.createdAt||new Date(Date.now()-o*864e5).toISOString()})),Rs=tu()(ru((i,o)=>({inspirations:up(),addInspiration:c=>{const p={...c,id:nu(),createdAt:new Date().toISOString(),isFavorite:!1};i(u=>({inspirations:[p,...u.inspirations]}))},add:c=>o().addInspiration(c),toggleFavorite:c=>{i(p=>({inspirations:p.inspirations.map(u=>u.id===c?{...u,isFavorite:!u.isFavorite}:u)}))},remove:c=>{i(p=>({inspirations:p.inspirations.filter(u=>u.id!==c)}))},archiveInspiration:c=>{i(p=>({inspirations:p.inspirations.map(u=>u.id===c?{...u,isArchived:!0}:u)}))},unarchiveInspiration:c=>{i(p=>({inspirations:p.inspirations.map(u=>u.id===c?{...u,isArchived:!1}:u)}))},filterByCategory:c=>{const{inspirations:p}=o();return c==="all"?p:p.filter(u=>u.category===c)},search:c=>{const p=c.toLowerCase();return o().inspirations.filter(u=>u.title.toLowerCase().includes(p)||u.content.toLowerCase().includes(p))}}),{name:"ir-inspiration-storage",version:3,migrate:(i,o)=>{if(o<3){const c=(i==null?void 0:i.inspirations)||[],p=up(),u=new Set(p.map(m=>m.id)),d=c.filter(m=>m&&m.id&&m.id!=="undefined"&&!u.has(m.id));return{inspirations:[...p,...d]}}return i}})),js="random",Ps=[{id:"zen",name:"慢灵魂",emoji:"🧘",tagline:"温柔地，把旧想法重新端到你面前",style:`你的说话风格：像一杯温茶。语速慢、不催促、留白多。

        .main-wrap {
          max-width: 1200px;
          margin: 0 auto;
          padding: 40px 24px;
          position: relative;
          z-index: 1;
        }
        .layout-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 28px;
          align-items: stretch;
        }
        @media (max-width: 900px) {
          .layout-grid { grid-template-columns: 1fr; gap: 32px; }
          .card-slot { width: 300px !important; height: 340px !important; }
          .card-stage { height: 340px !important; }
          .greeting-title { font-size: 26px !important; }
        }
        .greeting-block { margin-bottom: 18px; }
        .greeting-title {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 32px;
          font-weight: 700;
          color: var(--ir-text-primary);
          line-height: 1.2;
          margin-bottom: 8px;
        }
        .greeting-sub { font-size: 14px; color: var(--ir-text-muted); margin-bottom: 12px; }
        .expectation-hint {
          margin: 10px 0 0;
          padding: 12px 18px;
          border-radius: 12px;
          background: linear-gradient(135deg, rgba(196,144,60,0.08), rgba(212,164,77,0.05));
          border: 1px solid var(--ir-glass-border);
          font-size: 13px;
          color: var(--ir-text-secondary);
          display: inline-flex;
          align-items: center;
          gap: 8px;
        }
        .expectation-hint svg { width: 16px; height: 16px; color: var(--ir-primary); }
        .interest-section { margin-bottom: 18px; }
        .interest-label { font-size: 13px; color: var(--ir-text-secondary); margin-bottom: 10px; font-weight: 600; }
        .interest-chips { display: flex; flex-wrap: wrap; gap: 10px; }
        .interest-chip {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 9px 14px;
          border-radius: 12px;
          font-size: 13px;
          font-weight: 500;
          background: var(--ir-glass-bg);
          backdrop-filter: blur(12px);
          border: 1px solid var(--ir-glass-border);
          color: var(--ir-text-secondary);
          transition: all 250ms;
          cursor: pointer;
          white-space: nowrap;
          font-family: inherit;
        }
        .interest-chip svg { width: 15px; height: 15px; opacity: 0.6; transition: all 250ms; }
        .interest-chip:hover { border-color: rgba(196,144,60,0.35); color: var(--ir-primary); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(196,144,60,0.1); }
        .interest-chip:hover svg { opacity: 1; }
        .interest-chip.active {
          background: var(--ir-primary);
          border-color: var(--ir-primary);
          color: #fff;
          box-shadow: 0 4px 16px rgba(196,144,60,0.25);
        }
        .interest-chip.active svg { opacity: 1; color: #fff; }
        .generate-btn {
          width: 100%;
          padding: 16px 20px;

.trae-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

  cursor: pointer;
  box-sizing: border-box;
  border-radius: 6px;
  position: fixed;
  padding: 8px 8px 8px 10px;
  height: 28px;
  width: 130px;
  z-index: 9999;
}

.trae-badge:hover.trae-badge--light {
  background-color: #EDEFF2;
}

.trae-badge:hover.trae-badge--dark {
  background-color: #2A2D31;
}

.trae-badge-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.trae-badge-logo {
  flex-shrink: 0;
}

.trae-badge-share {
  flex-shrink: 0;

.trae-badge:hover.trae-badge--light .trae-badge-share {
  color: rgba(38, 41, 44, 1);
}

.trae-badge:hover.trae-badge--dark .trae-badge-share {
  color: #D1D3DB;
}

  right: -8px;
  width: 16px;

  opacity: 0;
  visibility: hidden;
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000000;
}

  visibility: visible !important;
}

          function getLuminance(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          function parseColor(color) {
            const rgbaMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
            if (rgbaMatch) {
              return [parseInt(rgbaMatch[1]), parseInt(rgbaMatch[2]), parseInt(rgbaMatch[3])];
            }
            
            const hexMatch = color.match(/^#([0-9a-f]{6})$/i);
            if (hexMatch) {
              const hex = hexMatch[1];
              return [
                parseInt(hex.substr(0, 2), 16),
                parseInt(hex.substr(2, 2), 16),
                parseInt(hex.substr(4, 2), 16)
              ];
            }
            
            const hexShortMatch = color.match(/^#([0-9a-f]{3})$/i);
            if (hexShortMatch) {
              const hex = hexShortMatch[1];
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16)
              ];
            }
            
            return null;
          }
          
          function detectBackgroundColor(element) {
            let targetElement;
            
            if (typeof element === 'string') {
              const found = document.querySelector(element);
              console.debug('Target element found:', found);
              if (!found) return 'rgb(255, 255, 255)';
              targetElement = found;
            } else if (element) {
              targetElement = element;
            } else {
              targetElement = document.body;
            }
            
            let currentElement = targetElement;
            
            while (currentElement && currentElement !== document.documentElement) {
              const computedStyle = window.getComputedStyle(currentElement);
              const backgroundColor = computedStyle.backgroundColor;
              
              console.debug('Checking element:', currentElement.tagName, currentElement.id, currentElement.className);
              console.debug('Background color:', backgroundColor);
              
              if (backgroundColor && backgroundColor !== 'rgba(0, 0, 0, 0)' && backgroundColor !== 'transparent') {
                console.debug('Found background color:', backgroundColor, 'on element:', currentElement);
                return backgroundColor;
              }
              
              currentElement = currentElement.parentElement;
            }
            
            const bodyStyle = window.getComputedStyle(document.body);
            const bodyBackground = bodyStyle.backgroundColor;
            console.debug('Body background:', bodyBackground);
            if (bodyBackground && bodyBackground !== 'rgba(0, 0, 0, 0)' && bodyBackground !== 'transparent') {
              return bodyBackground;
            }
            
            const htmlStyle = window.getComputedStyle(document.documentElement);
            const htmlBackground = htmlStyle.backgroundColor;
            console.debug('HTML background:', htmlBackground);
            if (htmlBackground && htmlBackground !== 'rgba(0, 0, 0, 0)' && htmlBackground !== 'transparent') {
              return htmlBackground;
            }
            
            console.debug('No background found, returning default white');
            return 'rgb(255, 255, 255)';
          }
          
          function autoSelectTheme(container) {
            const backgroundColor = detectBackgroundColor(container);
            const rgb = parseColor(backgroundColor);
            
            console.debug('TRAE Badge Plugin - Background detection:', {
              container,
              backgroundColor,
              rgb
            });
            
            if (!rgb) {
              console.debug('TRAE Badge Plugin - No RGB found, using dark theme');
              return 'dark';
            }
            
            const [r, g, b] = rgb;
            const luminance = getLuminance(r, g, b);
            const selectedTheme = luminance > 128 ? 'dark' : 'light';
            
            console.debug('TRAE Badge Plugin - Theme selection:', {
              luminance,
              selectedTheme,
              reason: luminance > 128 ? 'Light background -> Dark badge' : 'Dark background -> Light badge'
            });
            
            return selectedTheme;
          }
        
              
              // 注入样式
              const style = document.createElement('style');
              style.id = 'trae-badge-plugin-styles';
              style.textContent = css;
              document.head.appendChild(style);
              
              // 创建 Badge 函数
              function createBadge() {
                // 移除已存在的 badge
                const existingBadge = document.getElementById('trae-badge-plugin');
                if (existingBadge) {
                  existingBadge.remove();
                }
                
                // 确定主题
                let variant = 'dark';
                if (true) {
                  variant = autoSelectTheme('#root');
                }
                
                const isDarkBackground = variant === 'dark';
                const logoType = isDarkBackground ? 'light' : 'dark';
                const cancelIcon = isDarkBackground ? cancelLight : cancelDark;
                
                const badge = document.createElement('div');
                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#root');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();
          </script>
        
</body>
