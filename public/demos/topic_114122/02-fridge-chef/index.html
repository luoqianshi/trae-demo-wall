<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Chef 冰箱剩菜 AI 配菜师</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">生活娱乐赛道</p>
      <h1>Fridge Chef 冰箱剩菜 AI 配菜师</h1>
      <p class="subtitle">拍一拍冰箱，AI 帮你把剩菜变成一桌菜</p>
    </div>
    <div class="actions">
      <button id="seedBtn" class="ghost">示例食材</button>
      <button id="exportBtn" class="ghost">导出</button>
      <label class="ghost file-btn">导入<input id="importFile" type="file" accept="application/json"></label>
      <button id="resetBtn" class="danger">清空</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>冰箱库存</h2>
        <span id="stockSummary" class="muted"></span>
      </div>

      <div class="ai-upload">
        <label class="upload-zone" for="fridgePhoto">
          <span class="upload-icon">📷</span>
          <span class="upload-text">点击上传冰箱照片，AI 自动识别食材</span>
          <span class="upload-hint">纯前端演示：模拟 AI 视觉识别常见食材</span>
        </label>
        <input id="fridgePhoto" type="file" accept="image/*">
        <div id="aiResult" class="ai-result hidden"></div>
      </div>

      <form id="foodForm" class="food-form">
        <input type="hidden" id="foodId">
        <div class="quick-chips">
          <span class="quick-label">快速添加:</span>
          <span class="chip" data-name="鸡蛋" data-cat="肉蛋奶" data-unit="个">鸡蛋</span>
          <span class="chip" data-name="番茄" data-cat="蔬菜" data-unit="个">番茄</span>
          <span class="chip" data-name="鸡胸肉" data-cat="肉蛋奶" data-unit="克">鸡胸肉</span>
          <span class="chip" data-name="猪肉" data-cat="肉蛋奶" data-unit="克">猪肉</span>
          <span class="chip" data-name="土豆" data-cat="蔬菜" data-unit="个">土豆</span>
          <span class="chip" data-name="青椒" data-cat="蔬菜" data-unit="个">青椒</span>
          <span class="chip" data-name="胡萝卜" data-cat="蔬菜" data-unit="根">胡萝卜</span>
          <span class="chip" data-name="豆腐" data-cat="肉蛋奶" data-unit="盒">豆腐</span>
          <span class="chip" data-name="西兰花" data-cat="蔬菜" data-unit="克">西兰花</span>
          <span class="chip" data-name="黄瓜" data-cat="蔬菜" data-unit="根">黄瓜</span>
          <span class="chip" data-name="米饭" data-cat="主食" data-unit="碗">米饭</span>
          <span class="chip" data-name="面条" data-cat="主食" data-unit="份">面条</span>
          <span class="chip" data-name="牛奶" data-cat="肉蛋奶" data-unit="盒">牛奶</span>
          <span class="chip" data-name="香蕉" data-cat="水果" data-unit="根">香蕉</span>
        </div>
        <div class="grid four">
          <label>食材<input id="foodName" required placeholder="番茄"></label>
          <label>数量<input id="foodAmount" type="number" min="0" step="0.5" value="1"></label>
          <label>单位<input id="foodUnit" placeholder="个 / 克 / 份"></label>
          <label>分类<select id="foodCategory"><option>蔬菜</option><option>肉蛋奶</option><option>主食</option><option>调味</option><option>水果</option><option>其他</option></select></label>
        </div>
        <div class="grid three">
          <label>到期日期<input id="foodExpiry" type="date"></label>
          <label>存放位置<select id="foodPlace"><option>冷藏</option><option>冷冻</option><option>常温</option></select></label>
          <label>备注<input id="foodNote" placeholder="已开封 / 需要优先用"></label>
        </div>
        <div class="toolbar">
          <button type="submit">保存食材</button>
          <button id="cancelEditBtn" type="button" class="ghost hidden">取消编辑</button>
        </div>
      </form>
      <div class="filters">
        <input id="searchInput" placeholder="搜索食材">
        <select id="categoryFilter"><option value="">全部分类</option><option>蔬菜</option><option>肉蛋奶</option><option>主食</option><option>调味</option><option>水果</option><option>其他</option></select>
        <select id="expiryFilter"><option value="">全部期限</option><option value="soon">3天内到期</option><option value="expired">已过期</option></select>
      </div>
      <div id="inventoryList" class="inventory-list"></div>
    </section>

    <aside class="panel">
      <h2>推荐条件</h2>
      <label>用餐人数<input id="servings" type="number" min="1" max="12" value="2"></label>
      <label>偏好<select id="preference"><option value="">不限</option><option value="快手">快手</option><option value="清淡">清淡</option><option value="高蛋白">高蛋白</option><option value="主食">主食</option><option value="下饭菜">下饭菜</option></select></label>
      <label class="check"><input id="useExpiringFirst" type="checkbox" checked> 优先消耗临期食材</label>
      <button id="matchBtn">重新匹配菜谱</button>
      <button id="planBtn" class="ghost">生成今日菜单</button>

      <div class="metric"><span id="wasteCount">0</span><small>需要优先处理</small></div>
      <div class="shopping">
        <div class="panel-head">
          <h2>购物清单</h2>
          <button id="clearShoppingBtn" class="ghost small">清空</button>
        </div>
        <div id="shoppingList"></div>
      </div>
    </aside>

    <section class="panel recipes">
      <div class="panel-head">
        <h2>菜谱匹配</h2>
        <span id="recipeSummary" class="muted"></span>
      </div>
      <div id="recipePlan" class="recipe-plan hidden"></div>
      <div id="recipeList" class="recipe-list"></div>
    </section>
  </main>

  <div id="recipeModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    本方案由 TRAE Work 生成，用于 TRAE AI 创造力大赛报名。AI 识别为前端模拟演示。
  </footer>

  <script src="./app.js"></script>
</body>
</html>
