<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>拥有的积极心理</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fdf5df;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { touch-action: manipulation; }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #fff6d6 0%, #ffe8ba 45%, #f8cfa1 100%);
    }
    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #uiLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .panel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 560px);
      max-height: min(82vh, 900px);
      overflow-y: auto;
      border-radius: 24px;
      padding: 18px 16px 20px;
      background: rgba(255, 251, 242, 0.96);
      border: 4px solid #7f5c43;
      box-shadow: 0 18px 40px rgba(92, 60, 39, 0.18);
      pointer-events: auto;
      color: #5a3d2b;
    }
    .panel h2 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(22px, 4.6vw, 30px);
      color: #6b3f2f;
    }
    .panel p {
      margin: 0 0 12px;
      line-height: 1.7;
      font-size: clamp(14px, 3.4vw, 18px);
    }
    .prompt {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: #7b4e37;
      font-size: clamp(15px, 3.4vw, 18px);
    }
    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 16px;
      border: 3px solid #d7b38e;
      outline: none;
      background: #fffdfa;
      color: #5c3f2f;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: inset 0 2px 8px rgba(160, 126, 88, 0.08);
    }
    textarea:focus { border-color: #f29d62; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .field {
      padding: 10px;
      background: #fff5e7;
      border-radius: 16px;
      border: 2px dashed #deb98e;
    }
    .field label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #895839; }
    .field textarea { min-height: 78px; }
    .actions { display: flex; justify-content: center; margin-top: 14px; }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      min-width: 160px;
      background: linear-gradient(180deg, #ffb877 0%, #f28c5b 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 0 #cb6f43;
      cursor: pointer;
    }
    button:active { transform: translateY(4px); box-shadow: 0 4px 0 #cb6f43; }
    #errorBox {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(84, 45, 36, 0.72);
      color: #fff8f2;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      font-size: clamp(18px, 4.5vw, 24px);
      line-height: 1.7;
    }
    #errorBox.show { display: flex; }
    #customAlert {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(84, 45, 36, 0.55);
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: auto;
      z-index: 100;
    }
    #customAlert.show { display: flex; }
    #customAlert .alertBox {
      background: rgba(255, 251, 242, 0.98);
      border: 4px solid #7f5c43;
      border-radius: 24px;
      padding: 28px 24px 22px;
      max-width: min(86vw, 420px);
      text-align: center;
      color: #5a3d2b;
      box-shadow: 0 18px 40px rgba(92, 60, 39, 0.22);
    }
    #customAlert .alertBox p {
      margin: 0 0 18px;
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.6;
    }
    #customAlert .alertBox button {
      min-width: 120px;
      padding: 12px 24px;
      font-size: 17px;
    }
    @media (min-width: 720px) {
      .grid.two-col { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
      <div id="inputPanel" class="panel" style="display:none;"></div>
      <div id="errorBox">哎呀，出错了，请重启试试吧~</div>
      <div id="customAlert"><div class="alertBox"><p id="alertText"></p><button id="alertBtn" type="button">知道了</button></div></div>
    </div>
  </div>

  <script>
  (function () {
    var ERROR_TEXT = "哎呀，出错了，请重启试试吧~";
    try {
      /* ── 基础引用 ── */
      var canvas = document.getElementById("gameCanvas");
      var ctx = canvas.getContext("2d");
      var app = document.getElementById("app");
      var inputPanel = document.getElementById("inputPanel");
      var errorBox = document.getElementById("errorBox");
      var customAlert = document.getElementById("customAlert");
      var alertText = document.getElementById("alertText");
      var alertBtn = document.getElementById("alertBtn");

      /* ── 全局状态 ── */
      var state = {
        width: 0, height: 0,
        dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
        scene: "start",
        potionCount: 0,
        startButton: null, restartButton: null,
        fireworks: [], rockets: [], sparkles: [], petals: [],
        sceneEnteredAt: performance.now(),
        transition: null,
        text1: "", text3: "",
        game2Answers: ["","","","","",""],
        lastTime: performance.now(),
        audioCtx: null, audioUnlocked: false,
        bgmPlaying: false, bgmTimer: null
      };

      var COLORS = {
        ink: "#5e4333", line: "#7a563e", panel: "#fff8ef",
        panelSoft: "#fff2dc", accent: "#f49763", accentDeep: "#d76b4a",
        green: "#93c47d", blue: "#74b9ff", pink: "#f9a8c1",
        cream: "#fff8dc", shadow: "rgba(83,53,35,0.16)"
      };

      /* ══════════════════════════════════════
         错误处理
         ══════════════════════════════════════ */
      function showError() { errorBox.textContent = ERROR_TEXT; errorBox.classList.add("show"); }
      function showAlert(text) {
        alertText.textContent = text;
        customAlert.classList.add("show");
        alertBtn.focus();
      }
      function safe(fn) {
        return function () {
          try { return fn.apply(this, arguments); }
          catch (err) { console.error(err); showError(); }
        };
      }

      /* ══════════════════════════════════════
         画布尺寸
         ══════════════════════════════════════ */
      function resize() {
        state.width = app.clientWidth;
        state.height = app.clientHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        createAmbientPetals();
        draw();
      }

      /* ══════════════════════════════════════
         环境花瓣
         ══════════════════════════════════════ */
      function createAmbientPetals() {
        state.petals = [];
        for (var i = 0; i < 18; i++)
          state.petals.push(makePetal(Math.random() * state.width, Math.random() * state.height, 0.4 + Math.random() * 0.6));
      }
      function makePetal(x, y, sp) {
        return {
          x: x, y: y,
          vx: 12 + Math.random() * 18 * sp, vy: 10 + Math.random() * 18 * sp,
          sway: Math.random() * Math.PI * 2,
          size: 8 + Math.random() * 9, rot: Math.random() * Math.PI * 2,
          vr: -0.8 + Math.random() * 1.6,
          color: ["#ffd7e4","#fff4b8","#cfe9ff","#ffe0c2"][Math.floor(Math.random() * 4)]
        };
      }

      /* ══════════════════════════════════════
         音效系统 — 纯离线 Web Audio
         ══════════════════════════════════════ */
      function ensureAudio() {
        try {
          if (!state.audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            state.audioCtx = new AC();
          }
          if (state.audioCtx.state === "suspended") state.audioCtx.resume();
          state.audioUnlocked = true;
        } catch (e) { console.warn("音频初始化失败", e); }
      }

      function playTone(freq, dur, type, vol, when, slideTo) {
        try {
          if (!state.audioCtx || !state.audioUnlocked) return;
          var now = state.audioCtx.currentTime + (when || 0);
          var osc = state.audioCtx.createOscillator();
          var g = state.audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + dur);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol || 0.04), now + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(g); g.connect(state.audioCtx.destination);
          osc.start(now); osc.stop(now + dur + 0.03);
        } catch (e) {}
      }

      function playNoise(dur, vol, when, hpFreq) {
        try {
          if (!state.audioCtx || !state.audioUnlocked) return;
          var sr = state.audioCtx.sampleRate;
          var len = Math.max(1, Math.floor(sr * dur));
          var buf = state.audioCtx.createBuffer(1, len, sr);
          var d = buf.getChannelData(0);
          for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
          var src = state.audioCtx.createBufferSource();
          var flt = state.audioCtx.createBiquadFilter();
          var g = state.audioCtx.createGain();
          var now = state.audioCtx.currentTime + (when || 0);
          src.buffer = buf;
          flt.type = "highpass"; flt.frequency.value = hpFreq || 500;
          g.gain.setValueAtTime(vol || 0.02, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          src.connect(flt); flt.connect(g); g.connect(state.audioCtx.destination);
          src.start(now); src.stop(now + dur + 0.02);
        } catch (e) {}
      }

      /* -- 具体音效 -- */
      function playUiClick() {
        playTone(660, 0.06, "triangle", 0.03, 0, 880);
        playTone(880, 0.04, "sine", 0.015, 0.03);
      }
      function playSceneWhoosh() {
        playNoise(0.22, 0.015, 0, 400);
        playTone(200, 0.28, "sine", 0.025, 0, 480);
        playTone(400, 0.18, "sine", 0.01, 0.08, 300);
      }
      function playSuccess() {
        playTone(523, 0.16, "triangle", 0.045, 0, 659);
        playTone(659, 0.16, "triangle", 0.045, 0.1, 784);
        playTone(784, 0.28, "triangle", 0.05, 0.2, 1047);
        playTone(1047, 0.32, "sine", 0.03, 0.34, 1319);
      }
      function playFireworkLaunch() {
        playNoise(0.25, 0.015, 0, 2000);
        playTone(150, 0.3, "sawtooth", 0.018, 0, 600);
      }
      function playFireworkBoom() {
        playNoise(0.18, 0.025, 0, 300);
        playTone(180, 0.22, "sawtooth", 0.03, 0.01, 80);
        playTone(620, 0.14, "triangle", 0.02, 0.03, 1100);
      }
      function playPotionGet() {
        playTone(880, 0.12, "sine", 0.04, 0, 1109);
        playTone(1109, 0.12, "sine", 0.04, 0.08, 1319);
        playTone(1319, 0.24, "sine", 0.035, 0.16, 1760);
        playTone(1760, 0.3, "sine", 0.025, 0.28);
        playNoise(0.08, 0.008, 0.2, 3000);
      }
      function playStartBgm() {
        if (state.bgmPlaying || !state.audioCtx || !state.audioUnlocked) return;
        state.bgmPlaying = true;
        var melody = [
          [523,0.4],[587,0.4],[659,0.8],[587,0.4],[523,0.4],[440,0.8],[0,0.4],
          [392,0.4],[440,0.4],[523,0.8],[440,0.4],[392,0.4],[349,0.8],[0,0.6],
          [523,0.4],[659,0.4],[784,0.8],[659,0.4],[523,0.4],[440,0.8],[0,0.4],
          [392,0.4],[523,0.4],[440,0.8],[392,0.6],[0,0.8]
        ];
        var time = 0;
        function playNext() {
          if (!state.bgmPlaying) return;
          if (time >= melody.length) { time = 0; }
          var note = melody[time];
          if (note[0] > 0) {
            playTone(note[0], note[1] * 0.7, "sine", 0.012, 0);
            playTone(note[0] * 0.5, note[1] * 0.7, "sine", 0.006, 0);
          }
          time++;
          state.bgmTimer = setTimeout(playNext, note[1] * 420);
        }
        playNext();
      }
      function stopBgm() {
        state.bgmPlaying = false;
        if (state.bgmTimer) { clearTimeout(state.bgmTimer); state.bgmTimer = null; }
      }
      function playEndingBgm() {
        stopBgm();
        if (!state.audioCtx || !state.audioUnlocked) return;
        var melody = [
          [523,0.5],[659,0.5],[784,0.5],[1047,1.0],[0,0.3],
          [880,0.5],[784,0.5],[659,0.5],[784,1.2],[0,0.5],
          [1047,0.5],[880,0.5],[784,0.5],[1047,1.5],[0,1.0],
          [1319,0.8],[1047,0.8],[784,1.0],[659,0.5],[784,1.5]
        ];
        var time = 0;
        function playNext() {
          if (time >= melody.length) { time = 0; }
          var note = melody[time];
          if (note[0] > 0) {
            playTone(note[0], note[1] * 0.65, "triangle", 0.018, 0);
            playTone(note[0] * 0.5, note[1] * 0.65, "sine", 0.008, 0);
            playTone(note[0] * 1.5, note[1] * 0.4, "sine", 0.005, note[1] * 0.2);
          }
          time++;
          state.bgmTimer = setTimeout(playNext, note[1] * 480);
        }
        state.bgmTimer = setTimeout(playNext, 0);
      }

      /* ══════════════════════════════════════
         转场动画系统
         ══════════════════════════════════════ */
      function setScene(scene) {
        var prevScene = state.scene;
        state.transition = {
          phase: "fadeOut",
          alpha: 0,
          duration: 0.35,
          elapsed: 0,
          targetScene: scene,
          fromScene: prevScene,
          particles: [],
          sparkleBurst: []
        };
        for (var i = 0; i < 12; i++) {
          state.transition.particles.push({
            angle: Math.random() * Math.PI * 2,
            dist: 0,
            speed: 120 + Math.random() * 200,
            size: 3 + Math.random() * 5,
            color: ["#ffd166","#ff9bd6","#7bdff2","#c3f584"][Math.floor(Math.random() * 4)]
          });
        }
        for (var j = 0; j < 8; j++) {
          state.transition.sparkleBurst.push({
            x: state.width * (0.2 + Math.random() * 0.6),
            y: state.height * (0.2 + Math.random() * 0.6),
            size: 0, maxSize: 10 + Math.random() * 14,
            alpha: 1
          });
        }
        playSceneWhoosh();
        if (prevScene !== "ending" && scene === "ending") {
          state._pendingEndingInit = true;
        }
        /* 延迟到场景真正切换后再渲染输入面板 */
        if (scene === "game1_input" || scene === "game2_input" || scene === "game3_input") {
          /* 输入场景：延迟到 hold 阶段切换 scene 后再调用 */
          state._pendingInputRender = true;
        } else {
          /* 非输入场景：立即隐藏面板（不能调 renderInputPanel，因为 state.scene 还是旧值） */
          inputPanel.style.display = "none";
          inputPanel.innerHTML = "";
        }
      }

      function updateTransition(dt) {
        var tr = state.transition;
        if (!tr) return;
        tr.elapsed += dt;
        if (tr.phase === "fadeOut") {
          tr.alpha = Math.min(1, tr.elapsed / tr.duration);
          var ease = tr.alpha * tr.alpha;
          for (var i = 0; i < tr.particles.length; i++) {
            tr.particles[i].dist = tr.particles[i].speed * ease;
          }
          for (var j = 0; j < tr.sparkleBurst.length; j++) {
            tr.sparkleBurst[j].size = tr.sparkleBurst[j].maxSize * ease;
          }
          if (tr.elapsed >= tr.duration) {
            tr.phase = "hold";
            tr.elapsed = 0;
            tr.duration = 0.08;
            state.scene = tr.targetScene;
            state.sceneEnteredAt = performance.now();
            if (state._pendingInputRender) {
              state._pendingInputRender = false;
              renderInputPanel();
            }
            if (state._pendingEndingInit) {
              state._pendingEndingInit = false;
              initEndingFireworks();
              playEndingBgm();
            }
            if (tr.targetScene === "start") { stopBgm(); }
          }
        } else if (tr.phase === "hold") {
          if (tr.elapsed >= tr.duration) {
            tr.phase = "fadeIn";
            tr.elapsed = 0;
            tr.duration = 0.5;
            tr.alpha = 1;
            for (var k = 0; k < tr.particles.length; k++) {
              tr.particles[k].dist = tr.particles[k].speed;
            }
          }
        } else if (tr.phase === "fadeIn") {
          tr.alpha = Math.max(0, 1 - tr.elapsed / tr.duration);
          var easeIn = 1 - tr.alpha;
          for (var m = 0; m < tr.particles.length; m++) {
            tr.particles[m].dist = tr.particles[m].speed + easeIn * 180;
            tr.particles[m].alpha = Math.max(0, 1 - easeIn * 1.5);
          }
          if (tr.elapsed >= tr.duration) { state.transition = null; }
        }
      }

      function drawTransition() {
        var tr = state.transition;
        if (!tr) return;
        if (tr.alpha > 0.01) {
          ctx.fillStyle = "rgba(255,248,230," + (tr.alpha * 0.92).toFixed(3) + ")";
          ctx.fillRect(0, 0, state.width, state.height);
          ctx.fillStyle = "rgba(255,255,255," + (tr.alpha * 0.25).toFixed(3) + ")";
          ctx.fillRect(0, 0, state.width, state.height);
        }
        if (tr.phase === "fadeOut" || tr.phase === "hold") {
          var cx = state.width / 2, cy = state.height / 2;
          for (var i = 0; i < tr.particles.length; i++) {
            var p = tr.particles[i];
            var px = cx + Math.cos(p.angle) * p.dist;
            var py = cy + Math.sin(p.angle) * p.dist;
            var a = Math.max(0, tr.alpha * 0.8);
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fillStyle = hexToRgba(p.color, a);
            ctx.fill();
          }
        }
        if (tr.phase === "fadeIn" && tr.particles) {
          var cx2 = state.width / 2, cy2 = state.height / 2;
          for (var j = 0; j < tr.particles.length; j++) {
            var pp = tr.particles[j];
            var px2 = cx2 + Math.cos(pp.angle) * pp.dist;
            var py2 = cy2 + Math.sin(pp.angle) * pp.dist;
            var aa = pp.alpha !== undefined ? pp.alpha : Math.max(0, tr.alpha * 0.6);
            if (aa > 0.01) {
              ctx.beginPath();
              ctx.arc(px2, py2, pp.size * (1 + (1 - tr.alpha) * 0.5), 0, Math.PI * 2);
              ctx.fillStyle = hexToRgba(pp.color, aa);
              ctx.fill();
            }
          }
        }
        if (tr.phase === "fadeIn" && tr.sparkleBurst) {
          for (var k = 0; k < tr.sparkleBurst.length; k++) {
            var sb = tr.sparkleBurst[k];
            var sa = Math.max(0, tr.alpha * 1.2);
            if (sa > 0.01) drawSparkle(sb.x, sb.y, sb.size * tr.alpha + 4, sa);
          }
        }
      }

      /* ══════════════════════════════════════
         烟花系统 — 多阶段增强版
         ══════════════════════════════════════ */
      var FW_PALETTES = [
        ["#ff7b7b","#ff9e9e","#ffd166","#ffe599"],
        ["#7bdff2","#a4e8fc","#c3f584","#d9f5a8"],
        ["#cba6ff","#d9bbff","#ff9bd6","#ffbde0"],
        ["#ffd166","#ffe599","#ff9bd6","#ffaad5"],
        ["#7bdff2","#cba6ff","#c3f584","#ffd166"],
        ["#ff7b7b","#cba6ff","#7bdff2","#ffd166"]
      ];

      function launchRocket() {
        var tx = state.width * (0.15 + Math.random() * 0.7);
        var ty = state.height * (0.1 + Math.random() * 0.3);
        var sx = tx + (Math.random() - 0.5) * 80;
        var palette = FW_PALETTES[Math.floor(Math.random() * FW_PALETTES.length)];
        state.rockets.push({
          x: sx, y: state.height + 10,
          tx: tx, ty: ty,
          progress: 0,
          speed: 0.6 + Math.random() * 0.5,
          palette: palette,
          trail: [],
          size: 28 + Math.random() * 18
        });
        playFireworkLaunch();
      }

      function explodeRocket(r) {
        var count = r.size + Math.floor(Math.random() * 8);
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
          var speed = 2 + Math.random() * 5;
          var color = r.palette[i % r.palette.length];
          state.fireworks.push({
            x: r.x, y: r.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - Math.random() * 1.5,
            life: 55 + Math.random() * 40,
            age: 0,
            color: color,
            size: 2.5 + Math.random() * 3.5,
            trail: [],
            canMiniExplode: Math.random() < 0.2
          });
        }
        for (var j = 0; j < 24; j++) {
          state.sparkles.push({
            x: r.x + (Math.random() - 0.5) * 50,
            y: r.y + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -0.5 - Math.random() * 1.2,
            life: 30 + Math.random() * 20,
            age: 0,
            size: 3 + Math.random() * 5,
            color: "#fff7cc"
          });
        }
        playFireworkBoom();
      }

      function miniExplode(p) {
        var count = 5 + Math.floor(Math.random() * 4);
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count;
          var speed = 1 + Math.random() * 2;
          state.fireworks.push({
            x: p.x, y: p.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 25 + Math.random() * 15,
            age: 0,
            color: p.color,
            size: 1.5 + Math.random() * 2,
            trail: [],
            canMiniExplode: false
          });
        }
        state.sparkles.push({
          x: p.x, y: p.y, vx: 0, vy: -0.3,
          life: 18, age: 0, size: 8, color: "#fff"
        });
      }

      function initEndingFireworks() {
        state.fireworks = [];
        state.rockets = [];
        state.sparkles = [];
        for (var i = 0; i < 5; i++) {
          setTimeout(function() { launchRocket(); }, i * 300);
        }
      }

      function updateRockets(dt) {
        state.rockets = state.rockets.filter(function (r) {
          r.progress += r.speed * dt;
          var t = Math.min(1, r.progress);
          var ease = 1 - Math.pow(1 - t, 3);
          r.x = r.x + (r.tx - r.x) * ease * dt * 4;
          r.y = r.y + (r.ty - r.y) * ease * dt * 4;
          r.trail.push({ x: r.x, y: r.y });
          if (r.trail.length > 12) r.trail.shift();
          if (r.progress >= 1) {
            explodeRocket(r);
            return false;
          }
          return true;
        });
      }

      function updateFireworks(dt) {
        if (state.scene === "ending" && !state._pendingEndingInit) {
          if (Math.random() < dt * 1.0) launchRocket();
          if (Math.random() < dt * 0.15) launchRocket();
        }
        state.fireworks = state.fireworks.filter(function (p) {
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 8) p.trail.shift();
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.vy += 0.035;
          p.vx *= 0.992;
          p.age += 60 * dt;
          if (p.canMiniExplode && p.age > p.life * 0.6 && Math.random() < 0.05) {
            miniExplode(p);
            p.canMiniExplode = false;
          }
          return p.age < p.life;
        });
      }

      function drawRockets() {
        state.rockets.forEach(function (r) {
          for (var i = 0; i < r.trail.length; i++) {
            var t = r.trail[i];
            var alpha = (i + 1) / r.trail.length * 0.5;
            var sz = 2 + (i / r.trail.length) * 2;
            ctx.beginPath();
            ctx.arc(t.x, t.y, sz, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,220,150," + alpha.toFixed(2) + ")";
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(r.x, r.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#fff8e0";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(r.x, r.y, 8, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,220,150,0.3)";
          ctx.fill();
        });
      }

      function drawFireworks() {
        drawRockets();
        state.fireworks.forEach(function (p) {
          for (var i = 0; i < p.trail.length; i++) {
            var t = p.trail[i];
            var alpha = (i + 1) / p.trail.length * 0.22;
            ctx.beginPath();
            ctx.arc(t.x, t.y, p.size * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = hexToRgba(p.color, alpha);
            ctx.fill();
          }
          var lifeRatio = 1 - p.age / p.life;
          var alpha = lifeRatio;
          var glowR = p.size + lifeRatio * 5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, glowR + 3, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(p.color, alpha * 0.15);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size + lifeRatio * 3, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(p.color, alpha);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, p.size * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255," + (alpha * 0.7).toFixed(2) + ")";
          ctx.fill();
        });
        state.sparkles.forEach(function (p) {
          var alpha = 1 - p.age / p.life;
          drawSparkle(p.x, p.y, p.size * alpha, alpha * 0.9);
        });
      }

      /* ══════════════════════════════════════
         更新循环
         ══════════════════════════════════════ */
      function update(dt) {
        updateTransition(dt);
        updateFireworks(dt);
        updateRockets(dt);
        updateAmbient(dt);
      }

      function updateAmbient(dt) {
        state.petals.forEach(function (p) {
          p.sway += dt * 1.8;
          p.x += p.vx * dt + Math.sin(p.sway) * 0.3;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;
          if (p.y > state.height + 20 || p.x > state.width + 20)
            Object.assign(p, makePetal(-20 - Math.random() * 50, Math.random() * state.height * 0.4, 0.4 + Math.random() * 0.6));
        });
        state.sparkles = state.sparkles.filter(function (p) {
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.age += 60 * dt;
          return p.age < p.life;
        });
      }

      /* ══════════════════════════════════════
         绘制工具
         ══════════════════════════════════════ */
      function roundedRect(x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
      }

      function ovalShadow(x, y, w, h, a) {
        ctx.beginPath();
        ctx.fillStyle = "rgba(92,64,45," + a + ")";
        ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSparkle(x, y, size, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = "rgba(255,255,255," + alpha.toFixed(2) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
        ctx.moveTo(0, -size); ctx.lineTo(0, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255," + (alpha * 0.5).toFixed(2) + ")";
        ctx.lineWidth = 1.5;
        var s2 = size * 0.55;
        ctx.moveTo(-s2, -s2); ctx.lineTo(s2, s2);
        ctx.moveTo(s2, -s2); ctx.lineTo(-s2, s2);
        ctx.stroke();
        ctx.restore();
      }

      function drawAmbientPetals() {
        state.petals.forEach(function (p) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.9, p.size * 0.5, 0.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.restore();
        });
      }

      /* ══════════════════════════════════════
         背景绘制
         ══════════════════════════════════════ */
      function drawBackground() {
        var g = ctx.createLinearGradient(0, 0, 0, state.height);
        g.addColorStop(0, "#fff5d8");
        g.addColorStop(0.52, "#ffe8bf");
        g.addColorStop(1, "#ffd3a9");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, state.width, state.height);

        var sun = ctx.createRadialGradient(
          state.width * 0.82, state.height * 0.16, 10,
          state.width * 0.82, state.height * 0.16, state.width * 0.18
        );
        sun.addColorStop(0, "rgba(255,247,202,0.95)");
        sun.addColorStop(1, "rgba(255,247,202,0)");
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, state.width, state.height);

        ctx.fillStyle = "rgba(255,255,255,0.46)";
        for (var i = 0; i < 7; i++) {
          var x = state.width * (0.1 + i * 0.14);
          var y = state.height * (0.08 + (i % 3) * 0.03);
          ctx.beginPath();
          ctx.arc(x, y, 24, 0, Math.PI * 2);
          ctx.arc(x + 22, y + 8, 18, 0, Math.PI * 2);
          ctx.arc(x - 22, y + 10, 18, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#c2e0a0";
        ctx.fillRect(0, state.height * 0.72, state.width, state.height * 0.08);
        ctx.fillStyle = "#e6c287";
        ctx.fillRect(0, state.height * 0.8, state.width, state.height * 0.2);

        for (var j = 0; j < 20; j++) {
          var fx = (j / 20) * state.width + 10;
          var fy = state.height * 0.77 + ((j % 2) * 8);
          drawFlower(fx, fy, 0.74 + (j % 3) * 0.1);
        }
        drawAmbientPetals();
      }

      function drawFlower(x, y, s) {
        ctx.save();
        ctx.translate(x, y); ctx.scale(s, s);
        ctx.fillStyle = "#6aa84f";
        ctx.fillRect(-1, 0, 3, 18);
        var petals = ["#ff8db1","#f9d65c","#9ec9ff","#f2a66a"];
        for (var i = 0; i < 5; i++) {
          var a = (Math.PI * 2 * i) / 5;
          ctx.beginPath();
          ctx.fillStyle = petals[i % petals.length];
          ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath(); ctx.fillStyle = "#fff2b2";
        ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

        ctx.fillText("小游戏三：温暖赞美", 26, 46);

        var t = performance.now() * 0.003;
        drawGirl(state.width * 0.72, state.height * 0.62 + Math.sin(t) * 4, Math.min(state.width, state.height) * 0.0033, done);
        var bubbleText = done ? "谢谢你，真的很温暖。" : "我长得不好看呜呜呜。";
        drawSpeechBubble(bubbleText, state.width * 0.48, state.height * 0.2, state.width * 0.38, state.height * 0.2);
        var boxText = done
          ? "小女孩感激地送了你一瓶幸福药水。"
          : "任务要求：请你用几句话赞美她，让她高兴起来吧~";
        drawTaskBox(done ? "奖励" : "任务要求", boxText, state.width * 0.08, state.height * 0.25, state.width * 0.34, state.height * 0.32);
        if (done) {
          drawSparkle(state.width * 0.2, state.height * 0.32, 10, 0.8);
          drawPotionIcon(state.width * 0.18, state.height * 0.56, 0.85);
        }
        drawHint("点击屏幕任意处继续...");
      }

      function drawEndingScene() {
        drawBackground();
        drawFireworks();

        var w = Math.min(state.width * 0.86, 620);
        var h = Math.min(state.height * 0.56, 440);
        var x = (state.width - w) / 2;
        var y = state.height * 0.18;
        roundedRect(x, y, w, h, 30, "rgba(255,251,242,0.97)", COLORS.line);
        ctx.save();
        ctx.beginPath(); ctx.rect(x + 4, y + 4, w - 8, h - 8); ctx.clip();
        ctx.fillStyle = "#aa654c";
        ctx.font = "700 " + fontSize(24, 0.04) + "px Microsoft YaHei";
        ctx.textAlign = "center";
        ctx.fillText("你已圆满完成游戏", state.width / 2, y + 52);
        drawSparkle(state.width / 2 - 80, y + 20, 9, 0.85);
        drawSparkle(state.width / 2 + 80, y + 20, 9, 0.85);
        ctx.textAlign = "start";

        /* 三瓶药水 */
        drawPotionIcon(x + w * 0.25, y + 82, 0.8);
        drawPotionIcon(x + w * 0.5, y + 78, 0.9);
        drawPotionIcon(x + w * 0.75, y + 82, 0.8);

        ctx.fillStyle = COLORS.ink;
        ctx.font = "500 " + fontSize(15, 0.023) + "px Microsoft YaHei";
        wrapText(
          "你已成功收集了幸福药水，幸福其实很简单，把幸福药水喝下去你的幸福感就提升了！这个游戏可以重复玩很多次，坚持玩一段时间后，你会发现自己更少抑郁，更加幸福。",
          x + 26, y + 116, w - 52, lineH(28, 0.038)
        );

        var bw = Math.min(220, state.width * 0.34);
        var bh = 64;
        var bx = state.width / 2 - bw / 2;
        var by = y + h - 94;
        state.restartButton = { x: bx, y: by, w: bw, h: bh };
        roundedRect(bx, by, bw, bh, 32, COLORS.accent, COLORS.accentDeep);
        ctx.fillStyle = "#fff";
        ctx.font = "700 " + fontSize(19, 0.032) + "px Microsoft YaHei";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("再玩一次", bx + bw / 2, by + bh / 2 + 1);
        ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
        ctx.restore();
      }

      function drawInputBackdrop() {
        if (state.scene === "game1_input") drawGame1Intro(false);
        else if (state.scene === "game2_input") drawGame2Intro("intro");
        else if (state.scene === "game3_input") drawGame3Intro(false);
        ctx.fillStyle = "rgba(89,61,42,0.2)";
        ctx.fillRect(0, 0, state.width, state.height);
      }

      /* ══════════════════════════════════════
         文本工具
         ══════════════════════════════════════ */
      function wrapText(text, x, y, maxW, lh) {
        var chars = String(text).split("");
        var line = "", cy = y;
        for (var i = 0; i < chars.length; i++) {
          var test = line + chars[i];
          if (ctx.measureText(test).width > maxW && line) {
            ctx.fillText(line, x, cy);
            line = chars[i]; cy += lh;
          } else { line = test; }
        }
        if (line) ctx.fillText(line, x, cy);
      }

      /* 根据屏幕尺寸计算自适应字号，有上限约束 */
      function fontSize(minPx, vwFactor) {
        return Math.min(minPx + 16, Math.max(minPx, state.width * vwFactor));
      }
      function lineH(minPx, vwFactor) {
        return Math.min(minPx + 10, Math.max(minPx, state.width * vwFactor));
      }

      function hexToRgba(hex, alpha) {
        var v = hex.replace("#", "");
        var n = parseInt(v, 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + alpha + ")";
      }

      /* ══════════════════════════════════════
         主绘制
         ══════════════════════════════════════ */
      function draw() {
        ctx.clearRect(0, 0, state.width, state.height);
        state.startButton = null; state.restartButton = null;

        if (state.scene === "start") drawStartScene();
        if (state.scene === "rules") drawCenteredRuleScene();
        if (state.scene === "game1_intro") drawGame1Intro(false);
        if (state.scene === "game1_done") drawGame1Intro(true);
        if (state.scene === "game2_intro") drawGame2Intro("intro");
        if (state.scene === "game2_done_a") drawGame2Intro("doneA");
        if (state.scene === "game2_done_b") drawGame2Intro("doneB");
        if (state.scene === "game3_intro") drawGame3Intro(false);
        if (state.scene === "game3_done") drawGame3Intro(true);
        if (state.scene === "game1_input" || state.scene === "game2_input" || state.scene === "game3_input") drawInputBackdrop();
        if (state.scene === "ending") drawEndingScene();

        drawTransition();
      }

      /* ══════════════════════════════════════
         输入面板
         ══════════════════════════════════════ */
      function renderInputPanel() {
        inputPanel.style.display = "none";
        inputPanel.innerHTML = "";

        if (state.scene === "game1_input") {
          inputPanel.style.display = "block";
          inputPanel.innerHTML =
            '<h2>写一封感恩信</h2>' +
            '<p>请写下一段想表达感谢的话，越具体越好。</p>' +
            '<label class="prompt" for="gratitudeInput">你的内容</label>' +
            '<textarea id="gratitudeInput" placeholder="例如：谢谢你在我低落的时候陪着我，让我重新有了勇气。">' + escapeHtml(state.text1) + '</textarea>' +
            '<div class="actions"><button id="submitGame1" type="button">提交</button></div>';
          document.getElementById("submitGame1").addEventListener("click", safe(submitGame1));
          setTimeout(function () { var el = document.getElementById("gratitudeInput"); if (el) el.focus(); }, 60);
        }

        if (state.scene === "game2_input") {
          inputPanel.style.display = "block";
          inputPanel.innerHTML =
            '<h2>写下三件好事</h2>' +
            '<p>请写下昨天发生过的三件好事，以及它们发生的原因。</p>' +
            '<div class="grid two-col">' +
              createFieldHtml("g2_0", "事件一", state.game2Answers[0]) +
              createFieldHtml("g2_1", "原因一", state.game2Answers[1]) +
              createFieldHtml("g2_2", "事件二", state.game2Answers[2]) +
              createFieldHtml("g2_3", "原因二", state.game2Answers[3]) +
              createFieldHtml("g2_4", "事件三", state.game2Answers[4]) +
              createFieldHtml("g2_5", "原因三", state.game2Answers[5]) +
            '</div>' +
            '<div class="actions"><button id="submitGame2" type="button">提交</button></div>';
          document.getElementById("submitGame2").addEventListener("click", safe(submitGame2));
        }

        if (state.scene === "game3_input") {
          inputPanel.style.display = "block";
          inputPanel.innerHTML =
            '<h2>写下温暖赞美</h2>' +
            '<p>请用几句话真诚地赞美她，让她开心起来。</p>' +
            '<label class="prompt" for="praiseInput">你的内容</label>' +
            '<textarea id="praiseInput" placeholder="例如：你很可爱，也很认真，戴眼镜的样子特别有气质。">' + escapeHtml(state.text3) + '</textarea>' +
            '<div class="actions"><button id="submitGame3" type="button">提交</button></div>';
          document.getElementById("submitGame3").addEventListener("click", safe(submitGame3));
          setTimeout(function () { var el = document.getElementById("praiseInput"); if (el) el.focus(); }, 60);
        }
      }

      function createFieldHtml(id, label, value) {
        return '<div class="field"><label for="' + id + '">' + label + '</label>' +
          '<textarea id="' + id + '" placeholder="请填写...">' + escapeHtml(value) + '</textarea></div>';
      }

      function escapeHtml(str) {
        return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }

      function submitGame1() {
        ensureAudio();
        var val = document.getElementById("gratitudeInput").value.trim();
        if (val.length < 6) { showAlert("请再多写一点点，让感谢更具体哦。"); return; }
        state.text1 = val;
        state.potionCount = 1;
        playSuccess(); playPotionGet();
        setScene("game1_done");
      }

      function submitGame2() {
        ensureAudio();
        var ids = ["g2_0","g2_1","g2_2","g2_3","g2_4","g2_5"];
        var vals = ids.map(function (id) { return document.getElementById(id).value.trim(); });
        if (vals.some(function (v) { return v.length < 2; })) { showAlert("六个框都要认真填写完成哦。"); return; }
        state.game2Answers = vals;
        state.potionCount = 2;
        playSuccess(); playPotionGet();
        setScene("game2_done_a");
      }

      function submitGame3() {
        ensureAudio();
        var val = document.getElementById("praiseInput").value.trim();
        if (val.length < 4) { showAlert("请写下几句更温暖的赞美吧。"); return; }
        state.text3 = val;
        state.potionCount = 3;
        playSuccess(); playPotionGet();
        setScene("game3_done");
      }

      /* ══════════════════════════════════════
         交互处理
         ══════════════════════════════════════ */
      function isInside(pos, rect) {
        return rect && pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h;
      }

      function handlePointer(clientX, clientY) {
        if (errorBox.classList.contains("show")) return;
        if (inputPanel.style.display === "block") return;
        if (state.transition) return;

        ensureAudio(); playUiClick();

        var rect = canvas.getBoundingClientRect();
        var pos = { x: clientX - rect.left, y: clientY - rect.top };

        if (state.scene === "start") {
          if (isInside(pos, state.startButton)) { setScene("rules"); playStartBgm(); }
          return;
        }
        if (state.scene === "rules") { setScene("game1_intro"); return; }
        if (state.scene === "game1_intro") { setScene("game1_input"); return; }
        if (state.scene === "game1_done") { setScene("game2_intro"); return; }
        if (state.scene === "game2_intro") { setScene("game2_input"); return; }
        if (state.scene === "game2_done_a") { setScene("game2_done_b"); return; }
        if (state.scene === "game2_done_b") { setScene("game3_intro"); return; }
        if (state.scene === "game3_intro") { setScene("game3_input"); return; }
        if (state.scene === "game3_done") { setScene("ending"); return; }
        if (state.scene === "ending") {
          if (isInside(pos, state.restartButton)) { restartGame(); }
          else { launchRocket(); }
        }
      }

      function restartGame() {
        state.potionCount = 0;
        state.text1 = ""; state.text3 = "";
        state.game2Answers = ["","","","","",""];
        state.fireworks = []; state.rockets = []; state.sparkles = [];
        stopBgm();
        setScene("start");
      }

      canvas.addEventListener("pointerdown", safe(function (e) { handlePointer(e.clientX, e.clientY); }));
      alertBtn.addEventListener("click", safe(function () { customAlert.classList.remove("show"); }));
      window.addEventListener("resize", safe(resize));
      window.addEventListener("error", function () { showError(); });

      /* ══════════════════════════════════════
         主循环
         ══════════════════════════════════════ */
      function loop(now) {
        try {
          var dt = Math.min(0.033, (now - state.lastTime) / 1000 || 0.016);
          state.lastTime = now;
          update(dt);
          draw();
        } catch (err) { console.error(err); showError(); }
        requestAnimationFrame(loop);
      }

      resize();
      renderInputPanel();
      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      var eb = document.getElementById("errorBox");
      if (eb) { eb.textContent = ERROR_TEXT; eb.classList.add("show"); }
    }
  })();
  </script>
</body>
