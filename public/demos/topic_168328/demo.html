<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生沙盒 2.0 — 职业模拟体验</title>
  <style>
    :root {
      --bg: #0B0D14;
      --bg2: #141725;
      --bg3: #1E2235;
      --bg4: #282D42;
      --ink: #F0F0F5;
      --muted: #7A7F95;
      --rule: #2A2F45;
      --accent: #FF6B6B;
      --accent2: #38D9A9;
      --accent3: #FFA94D;
      --accent4: #B197FC;
      --accent5: #4DABF7;
      --radius: 16px;
      --radius-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Keyframes ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(0, 40px); }
    }
    @keyframes gridMoveFast {
      0% { transform: translate(0, 0); }
      100% { transform: translate(0, 40px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes walkSlideIn {
      from { transform: translateX(-120px); }
      to { transform: translateX(0); }
    }
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes starSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slideOutUp {
      to { opacity: 0; transform: translateY(-40px); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rippleExpand {
      to { transform: scale(4); opacity: 0; }
    }
    @keyframes springBounce {
      0% { width: var(--from-width); }
      40% { width: calc(var(--target-width) + 8%); }
      70% { width: calc(var(--target-width) - 3%); }
      100% { width: var(--target-width); }
    }
    @keyframes loadingChar {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pixelDissolve {
      0% { opacity: 1; filter: blur(0); transform: scale(1); }
      50% { opacity: 0.6; filter: blur(2px); }
      100% { opacity: 0; filter: blur(8px); transform: scale(0.8); }
    }
    @keyframes achieveIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes achieveOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(80px); }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(255,107,107,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,107,107,0.6), 0 0 40px rgba(255,107,107,0.2); }
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.05); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }
    @keyframes endBounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ===== Grid Background with Parallax ===== */
    .grid-bg {
      position: fixed;
      top: -40px; left: -40px; right: -40px; bottom: -40px;
      background-image:
        linear-gradient(rgba(56,217,169,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,217,169,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      transition: transform 0.3s ease-out;
    }
    .grid-bg.fast {
      animation: gridMoveFast 0.3s linear infinite;
    }

    /* ===== Pages ===== */
    .page {
      display: none;
      position: relative;
      z-index: 1;
    }
    .page.active { display: block; }
    .page.animating-out {
      animation: slideOutUp 0.35s ease-in forwards;
    }
    .page.animating-in {
      animation: slideInUp 0.4s ease-out forwards;
    }

    /* ===== Pixel Character ===== */
    .pixel-character {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .pixel-character.walking {
      animation: walkSlideIn 1.2s ease-out forwards;
    }
    .pixel-character .char-bubble {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      animation: bubbleFloat 2s ease-in-out infinite;
      display: none;
      white-space: nowrap;
    }
    .pixel-character .char-bubble.visible { display: block; }
    .pixel-character .char-float-icons {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 2px;
    }
    .pixel-character .char-float-icons.visible { display: flex; }
    .pixel-char-wrap {
      position: relative;
      width: 24px;
      height: 24px;
      transform: scale(3);
      transform-origin: bottom center;
    }
    .pixel-char-wrap.anim-walk .pixel-base {
      animation: walkBounce 0.3s infinite;
    }
    .pixel-base {
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow:
        /* Row 0: hair top */
        4px 0px 0 0 var(--ink), 6px 0px 0 0 var(--ink), 8px 0px 0 0 var(--ink), 10px 0px 0 0 var(--ink), 12px 0px 0 0 var(--ink), 14px 0px 0 0 var(--ink),
        /* Row 1: hair */
        2px 2px 0 0 var(--ink), 4px 2px 0 0 var(--ink), 6px 2px 0 0 var(--ink), 8px 2px 0 0 var(--ink), 10px 2px 0 0 var(--ink), 12px 2px 0 0 var(--ink), 14px 2px 0 0 var(--ink), 16px 2px 0 0 var(--ink),
        /* Row 2: face */
        4px 4px 0 0 #FFD699, 6px 4px 0 0 #FFD699, 8px 4px 0 0 #FFD699, 10px 4px 0 0 #FFD699, 12px 4px 0 0 #FFD699, 14px 4px 0 0 #FFD699,
        /* Row 3: eyes */
        4px 6px 0 0 #FFD699, 6px 6px 0 0 #333, 8px 6px 0 0 #FFD699, 10px 6px 0 0 #FFD699, 12px 6px 0 0 #333, 14px 6px 0 0 #FFD699,
        /* Row 4: mouth/cheeks */
        4px 8px 0 0 #FFD699, 6px 8px 0 0 #FFD699, 8px 8px 0 0 #FFD699, 10px 8px 0 0 #FF9999, 12px 8px 0 0 #FFD699, 14px 8px 0 0 #FFD699,
        /* Row 5: neck */
        8px 10px 0 0 #FFD699, 10px 10px 0 0 #FFD699,
        /* Row 6: body top */
        4px 12px 0 0 var(--accent5), 6px 12px 0 0 var(--accent5), 8px 12px 0 0 var(--accent5), 10px 12px 0 0 var(--accent5), 12px 12px 0 0 var(--accent5), 14px 12px 0 0 var(--accent5),
        /* Row 7: body */
        4px 14px 0 0 var(--accent5), 6px 14px 0 0 var(--accent5), 8px 14px 0 0 var(--accent5), 10px 14px 0 0 var(--accent5), 12px 14px 0 0 var(--accent5), 14px 14px 0 0 var(--accent5),
        /* Row 8: body bottom */
        4px 16px 0 0 var(--accent5), 6px 16px 0 0 var(--accent5), 8px 16px 0 0 var(--accent5), 10px 16px 0 0 var(--accent5), 12px 16px 0 0 var(--accent5), 14px 16px 0 0 var(--accent5),
        /* Row 9: legs */
        6px 18px 0 0 var(--bg3), 8px 18px 0 0 var(--bg3), 10px 18px 0 0 var(--bg3), 12px 18px 0 0 var(--bg3),
        /* Row 10: feet */
        4px 20px 0 0 #888, 6px 20px 0 0 #888, 10px 20px 0 0 #888, 14px 20px 0 0 #888;
    }
    .pixel-base.upgraded {
      box-shadow:
        /* Row 0: hair top - fluffier */
        2px 0px 0 0 var(--ink), 4px 0px 0 0 var(--ink), 6px 0px 0 0 var(--ink), 8px 0px 0 0 var(--ink), 10px 0px 0 0 var(--ink), 12px 0px 0 0 var(--ink), 14px 0px 0 0 var(--ink), 16px 0px 0 0 var(--ink),
        /* Row 1: hair */
        2px 2px 0 0 var(--ink), 4px 2px 0 0 var(--ink), 6px 2px 0 0 var(--ink), 8px 2px 0 0 var(--ink), 10px 2px 0 0 var(--ink), 12px 2px 0 0 var(--ink), 14px 2px 0 0 var(--ink), 16px 2px 0 0 var(--ink),
        /* Row 2: face */
        4px 4px 0 0 #FFD699, 6px 4px 0 0 #FFD699, 8px 4px 0 0 #FFD699, 10px 4px 0 0 #FFD699, 12px 4px 0 0 #FFD699, 14px 4px 0 0 #FFD699,
        /* Row 3: eyes - star eyes */
        4px 6px 0 0 #FFD699, 6px 6px 0 0 var(--accent3), 8px 6px 0 0 #FFD699, 10px 6px 0 0 #FFD699, 12px 6px 0 0 var(--accent3), 14px 6px 0 0 #FFD699,
        /* Row 4: smile */
        4px 8px 0 0 #FFD699, 6px 8px 0 0 #FFD699, 8px 8px 0 0 #FF9999, 10px 8px 0 0 #FF9999, 12px 8px 0 0 #FFD699, 14px 8px 0 0 #FFD699,
        /* Row 5: neck */
        8px 10px 0 0 #FFD699, 10px 10px 0 0 #FFD699,
        /* Row 6-8: body */
        2px 12px 0 0 var(--accent2), 4px 12px 0 0 var(--accent2), 6px 12px 0 0 var(--accent2), 8px 12px 0 0 var(--accent2), 10px 12px 0 0 var(--accent2), 12px 12px 0 0 var(--accent2), 14px 12px 0 0 var(--accent2), 16px 12px 0 0 var(--accent2),
        2px 14px 0 0 var(--accent2), 4px 14px 0 0 var(--accent2), 6px 14px 0 0 var(--accent2), 8px 14px 0 0 var(--accent2), 10px 14px 0 0 var(--accent2), 12px 14px 0 0 var(--accent2), 14px 14px 0 0 var(--accent2), 16px 14px 0 0 var(--accent2),
        2px 16px 0 0 var(--accent2), 4px 16px 0 0 var(--accent2), 6px 16px 0 0 var(--accent2), 8px 16px 0 0 var(--accent2), 10px 16px 0 0 var(--accent2), 12px 16px 0 0 var(--accent2), 14px 16px 0 0 var(--accent2), 16px 16px 0 0 var(--accent2),
        /* Row 9: legs */
        4px 18px 0 0 var(--bg3), 6px 18px 0 0 var(--bg3), 10px 18px 0 0 var(--bg3), 12px 18px 0 0 var(--bg3),
        /* Row 10: feet */
        2px 20px 0 0 var(--accent3), 4px 20px 0 0 var(--accent3), 10px 20px 0 0 var(--accent3), 14px 20px 0 0 var(--accent3);
    }
    /* Equipment overlays */
    .pixel-equip {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      background: transparent;
      display: none;
    }
    .pixel-equip.visible { display: block; }
    .pixel-equip.eq-tie {
      box-shadow:
        /* Tie */
        8px 12px 0 0 var(--accent), 10px 12px 0 0 var(--accent),
        9px 14px 0 0 var(--accent),
        8px 16px 0 0 var(--accent), 10px 16px 0 0 var(--accent);
    }
    .pixel-equip.eq-hat {
      box-shadow:
        /* Hat brim */
        2px -2px 0 0 var(--accent4), 4px -2px 0 0 var(--accent4), 6px -2px 0 0 var(--accent4), 8px -2px 0 0 var(--accent4), 10px -2px 0 0 var(--accent4), 12px -2px 0 0 var(--accent4), 14px -2px 0 0 var(--accent4), 16px -2px 0 0 var(--accent4),
        /* Hat top */
        6px -4px 0 0 var(--accent4), 8px -4px 0 0 var(--accent4), 10px -4px 0 0 var(--accent4), 12px -4px 0 0 var(--accent4);
    }
    .pixel-equip.eq-glasses {
      box-shadow:
        /* Left lens */
        4px 5px 0 0 var(--accent5), 6px 5px 0 0 var(--accent5), 8px 5px 0 0 var(--accent5),
        /* Right lens */
        10px 5px 0 0 var(--accent5), 12px 5px 0 0 var(--accent5), 14px 5px 0 0 var(--accent5),
        /* Bridge */
        8px 6px 0 0 var(--accent5), 10px 6px 0 0 var(--accent5);
    }

    /* ===== Loading Screen ===== */
    .loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .loading-screen.active { display: flex; }
    .loading-screen.dissolving {
      animation: pixelDissolve 0.5s ease-in forwards;
    }
    .loading-text-pixel {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: 4px;
      display: flex;
      gap: 0;
    }
    .loading-text-pixel span {
      opacity: 0;
      display: inline-block;
    }
    .loading-bar-pixel {
      width: 200px;
      height: 8px;
      background: var(--bg3);
      border: 1px solid var(--rule);
      position: relative;
      overflow: hidden;
    }
    .loading-bar-pixel::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      background: var(--accent2);
      transition: width 0.3s;
    }
    .loading-bar-pixel.fill::after {
      width: 100%;
    }

    /* ===== Landing ===== */
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .landing-badge {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.25);
      border-radius: 100px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 1.5rem;
      animation: fadeInDown 0.6s ease-out;
    }
    .landing h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 0.6s ease-out 0.1s both;
    }
    .landing-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 2.5rem;
      line-height: 1.8;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 32px rgba(255,107,107,0.25);
      font-family: inherit;
      animation: fadeInUp 0.6s ease-out 0.3s both;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(255,107,107,0.35);
    }
    .landing-steps {
      display: flex;
      gap: 2rem;
      margin-top: 4rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }
    .land-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.6;
    }
    .land-step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg3);
      border: 2px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }
    .land-step-label { font-size: 0.75rem; color: var(--muted); }

    /* ===== Ripple ===== */
    .ripple {
      position: fixed;
      border-radius: 50%;
      background: rgba(56, 217, 169, 0.3);
      pointer-events: none;
      z-index: 300;
      animation: rippleExpand 0.6s ease-out forwards;
    }

    /* ===== Page Header ===== */
    .page-header {
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(11,13,20,0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .page-title {
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
    }
    .progress-bar {
      width: 200px;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent5));
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .progress-text { font-size: 0.75rem; color: var(--muted); margin-left: 0.8rem; }

    /* ===== Portrait (Chat) ===== */
    .chat-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      padding-bottom: 100px;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg-ai, .msg-user {
      max-width: 85%;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.7;
      animation: fadeInUp 0.3s ease-out;
    }
    .msg-ai {
      background: var(--bg2);
      border: 1px solid var(--rule);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg-ai-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .ai-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }
    .ai-name { font-size: 0.75rem; font-weight: 600; color: var(--accent); }
    .msg-user {
      background: rgba(56,217,169,0.1);
      border: 1px solid rgba(56,217,169,0.2);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      color: var(--ink);
    }
    /* AI Thinking Terminal */
    .msg-thinking {
      max-width: 85%;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      align-self: flex-start;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: var(--accent2);
      line-height: 1.8;
      animation: fadeInUp 0.3s ease-out;
    }
    .msg-thinking .think-line {
      opacity: 0;
    }
    .msg-thinking .think-line.visible {
      opacity: 1;
    }
    .msg-thinking .think-prompt::after {
      content: '_';
      animation: cursorBlink 0.7s infinite;
    }
    /* Typewriter cursor */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent2);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursorBlink 0.7s infinite;
    }

    .options-area {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-card {
      padding: 1rem 1.2rem;
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 0.9rem;
      color: var(--muted);
      text-align: left;
      font-family: inherit;
      line-height: 1.5;
      position: relative;
      overflow: hidden;
    }
    .option-card:hover {
      border-color: var(--accent2);
      color: var(--ink);
      background: rgba(56,217,169,0.05);
      transform: translateX(4px);
    }
    .option-card.selected {
      border-color: var(--accent2);
      background: rgba(56,217,169,0.12);
      color: var(--ink);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(56,217,169,0.15);
    }
    .option-card.not-selected {
      opacity: 0.4;
      transform: scale(0.97);
      pointer-events: none;
    }
    .option-card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* ===== Recommendation ===== */
    .rec-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      padding-bottom: 100px;
    }
    .rec-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .rec-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    .rec-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .rec-card {
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    .rec-card:hover {
      border-color: var(--accent2);
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }
    .rec-card.not-selected {
      opacity: 0.35;
      transform: scale(0.96);
      pointer-events: none;
    }
    .rec-match {
      position: absolute;
      top: 1rem; right: 1rem;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent2);
    }
    .rec-match span {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }
    .rec-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .rec-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .rec-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .rec-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .rec-tag {
      padding: 0.2rem 0.6rem;
      background: var(--bg3);
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ===== Trial ===== */
    .trial-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      padding-bottom: 100px;
    }
    .trial-scene {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .trial-role {
      font-size: 0.75rem;
      color: var(--accent3);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
    }
    .trial-scene-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--ink);
    }
    .trial-scene-text strong { color: var(--accent3); }
    .trial-feedback {
      background: rgba(177,151,252,0.08);
      border: 1px solid rgba(177,151,252,0.2);
      border-radius: var(--radius-sm);
      padding: 1.2rem;
      margin-top: 1rem;
      font-size: 0.88rem;
      line-height: 1.7;
      animation: fadeInUp 0.4s ease-out;
    }
    .trial-feedback strong { color: var(--accent4); }
    .skill-pills {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }
    .skill-pill {
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
    }
    .pill-up { background: rgba(56,217,169,0.15); color: var(--accent2); }
    .pill-down { background: rgba(255,107,107,0.15); color: var(--accent); }

    /* ===== Growth ===== */
    .growth-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      padding-bottom: 100px;
    }
    .growth-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
    }
    .skill-tree {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .skill-tree h3 {
      font-size: 0.9rem;
      margin-bottom: 1rem;
      color: var(--accent2);
    }
    .tree-node {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--rule);
      font-size: 0.85rem;
    }
    .tree-node:last-child { border-bottom: none; }
    .tree-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .tree-icon.locked { background: var(--bg3); color: var(--muted); }
    .tree-icon.unlocked { background: rgba(56,217,169,0.15); color: var(--accent2); }
    .task-list {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .task-list h3 {
      font-size: 0.9rem;
      margin-bottom: 1rem;
      color: var(--accent3);
    }
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      padding: 0.8rem;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1.5px solid transparent;
    }
    .task-item:hover { border-color: var(--accent2); }
    .task-item.done { opacity: 0.5; }
    .task-check {
      width: 20px; height: 20px;
      border: 2px solid var(--rule);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .task-item.done .task-check {
      background: var(--accent2);
      border-color: var(--accent2);
      color: var(--bg);
    }
    .task-content { flex: 1; }
    .task-title {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .task-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .task-resource {
      margin-top: 0.4rem;
    }
    .task-resource a {
      color: var(--accent5);
      text-decoration: none;
      font-size: 0.75rem;
      border-bottom: 1px dashed var(--accent5);
      transition: opacity 0.2s;
    }
    .task-resource a:hover { opacity: 0.8; }
    .growth-progress {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg3);
      border-radius: var(--radius-sm);
    }
    .growth-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }
    .growth-bar {
      height: 8px;
      background: var(--bg4);
      border-radius: 4px;
      overflow: hidden;
    }
    .growth-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent5));
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ===== Assessment ===== */
    .assess-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      padding-bottom: 100px;
    }
    .quiz-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--rule);
    }
    .quiz-num { font-size: 0.8rem; color: var(--muted); }
    .quiz-timer {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent3);
      font-family: monospace;
    }
    .quiz-question {
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }
    .quiz-opt {
      padding: 1rem 1.2rem;
      background: var(--bg3);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: left;
      font-family: inherit;
    }
    .quiz-opt:hover {
      border-color: var(--accent2);
      color: var(--ink);
    }
    .quiz-opt.correct {
      border-color: var(--accent2);
      background: rgba(56,217,169,0.1);
      color: var(--ink);
    }
    .quiz-opt.wrong {
      border-color: var(--accent);
      background: rgba(255,107,107,0.1);
      color: var(--ink);
    }
    .quiz-opt.disabled { pointer-events: none; }
    .quiz-opt.not-selected { opacity: 0.4; pointer-events: none; }
    .quiz-explain {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(77,171,247,0.08);
      border: 1px solid rgba(77,171,247,0.2);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      line-height: 1.7;
      animation: fadeInUp 0.3s ease;
    }

    /* ===== Report ===== */
    .report-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      padding-bottom: 100px;
    }
    .report-hero {
      text-align: center;
      padding: 2rem 0;
    }
    .report-match {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent2), var(--accent5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .report-match-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .report-career {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 1rem;
    }
    /* Ending */
    .ending-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      margin: 1.5rem 0;
      animation: endBounceIn 0.6s ease-out;
    }
    .ending-icon { font-size: 3rem; margin-bottom: 0.8rem; }
    .ending-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
    .ending-text { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }
    .radar-section {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      margin: 1.5rem 0;
    }
    .radar-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .radar-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .radar-label {
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 70px;
      text-align: right;
    }
    .radar-bar-bg {
      flex: 1;
      height: 10px;
      background: var(--bg3);
      border-radius: 5px;
      overflow: hidden;
    }
    .radar-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s ease;
    }
    .radar-score {
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 32px;
    }
    .report-section {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 1rem 0;
    }
    .report-section h3 {
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      color: var(--accent2);
    }
    .report-section ul {
      list-style: none;
      padding: 0;
    }
    .report-section li {
      padding: 0.4rem 0;
      padding-left: 1.2rem;
      position: relative;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .report-section li::before {
      content: '';
      position: absolute;
      left: 0; top: 0.7em;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent2);
    }
    .report-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .btn-secondary {
      padding: 0.8rem 1.5rem;
      background: var(--bg3);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-secondary:hover {
      border-color: var(--accent2);
      background: rgba(56,217,169,0.05);
    }

    /* ===== Skill Dashboard (Right Panel) ===== */
    .skill-dashboard {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 150;
      transition: transform 0.3s ease;
    }
    .skill-dashboard.collapsed {
      transform: translateY(-50%) translateX(calc(100% - 36px));
    }
    .skill-dash-toggle {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translate(-100%, -50%);
      width: 36px;
      height: 72px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-right: none;
      border-radius: 8px 0 0 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent2);
      font-size: 0.8rem;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .skill-dash-toggle:hover { background: var(--bg3); }
    .skill-dash-body {
      background: rgba(20, 23, 37, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--rule);
      border-right: none;
      border-radius: 12px 0 0 12px;
      padding: 1rem;
      min-width: 180px;
    }
    .skill-dash-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
    }
    .skill-dash-item {
      margin-bottom: 0.6rem;
    }
    .skill-dash-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      margin-bottom: 2px;
    }
    .skill-dash-label span:first-child { color: var(--muted); }
    .skill-dash-label span:last-child { color: var(--ink); font-weight: 600; }
    .skill-dash-bar {
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
    }
    .skill-dash-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0s;
    }
    .skill-dash-bar-fill.spring {
      animation: springBounce 0.8s ease-out forwards;
    }

    /* ===== Achievement Toast ===== */
    .achievement-container {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .achievement-toast {
      background: var(--bg2);
      border: 1px solid var(--accent3);
      border-radius: var(--radius-sm);
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 220px;
      animation: achieveIn 0.4s ease-out forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .achievement-toast.leaving {
      animation: achieveOut 0.3s ease-in forwards;
    }
    .achievement-icon { font-size: 1.2rem; }
    .achievement-text { font-size: 0.78rem; }
    .achievement-name { font-weight: 600; color: var(--accent3); }
    .achievement-desc { font-size: 0.7rem; color: var(--muted); }

    /* ===== Loading Spinner ===== */
    .loading-box {
      text-align: center;
      padding: 4rem 2rem;
    }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--bg3);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .landing-steps { gap: 1rem; }
      .rec-cards { grid-template-columns: 1fr; }
      .chat-container { padding: 1rem; padding-bottom: 100px; }
      .page-header { padding: 1rem; }
      .progress-bar { width: 100px; }
      .growth-grid { grid-template-columns: 1fr; }
      .skill-dashboard { display: none; }
      .pixel-character { bottom: 16px; }
      .trial-container, .growth-container, .assess-container, .report-container {
        padding-bottom: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg" id="gridBg"></div>

  <!-- ========== LOADING SCREEN ========== -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-text-pixel" id="loadingTextPixel">LOADING...</div>
    <div class="loading-bar-pixel" id="loadingBarPixel"></div>
  </div>

  <!-- ========== PIXEL CHARACTER ========== -->
  <div class="pixel-character" id="pixelChar" style="display:none;">
    <div class="char-bubble" id="charBubble"></div>
    <div style="position:relative;">
      <div class="pixel-char-wrap" id="charWrap">
        <div class="pixel-base" id="pixelBase"></div>
        <div class="pixel-equip eq-tie" id="eqTie"></div>
        <div class="pixel-equip eq-hat" id="eqHat"></div>
        <div class="pixel-equip eq-glasses" id="eqGlasses"></div>
      </div>
      <div class="char-float-icons" id="charFloatIcons"></div>
    </div>
  </div>

  <!-- ========== SKILL DASHBOARD ========== -->
  <div class="skill-dashboard collapsed" id="skillDash" style="display:none;">
    <div class="skill-dash-toggle" onclick="app.toggleDash()">能力面板</div>
    <div class="skill-dash-body" id="skillDashBody"></div>
  </div>

  <!-- ========== ACHIEVEMENT CONTAINER ========== -->
  <div class="achievement-container" id="achievementContainer"></div>

  <!-- ========== LANDING ========== -->
  <div id="page-landing" class="page active">
    <div class="landing">
      <span class="landing-badge">DEMO 体验版</span>
      <h1>人生沙盒 2.0</h1>
      <p class="landing-subtitle">
        不是测试，是「预活」<br>
        AI 陪你走完职业全周期，体验过才知道自己真正适合什么
      </p>
      <button class="btn-primary" onclick="app.start()">
        &#9654; 进入沙盒
      </button>
      <div class="landing-steps">
        <div class="land-step">
          <div class="land-step-num">1</div>
          <span class="land-step-label">深度画像</span>
        </div>
        <div class="land-step">
          <div class="land-step-num">2</div>
          <span class="land-step-label">职业试炼</span>
        </div>
        <div class="land-step">
          <div class="land-step-num">3</div>
          <span class="land-step-label">能力成长</span>
        </div>
        <div class="land-step">
          <div class="land-step-num">4</div>
          <span class="land-step-label">能力评估</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== PORTRAIT ========== -->
  <div id="page-portrait" class="page">
    <div class="page-header">
      <span class="page-title">人生沙盒 2.0</span>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="portrait-progress" style="width:0%"></div></div>
        <span class="progress-text" id="portrait-progress-text">0/6</span>
      </div>
    </div>
    <div class="chat-container">
      <div class="chat-messages" id="portrait-messages"></div>
      <div class="options-area" id="portrait-options"></div>
    </div>
  </div>

  <!-- ========== RECOMMENDATION ========== -->
  <div id="page-recommendation" class="page">
    <div class="page-header">
      <span class="page-title">人生沙盒 2.0</span>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div>
        <span class="progress-text">1/4</span>
      </div>
    </div>
    <div class="rec-container">
      <div id="rec-loading" class="loading-box">
        <div class="loading-spinner"></div>
        <p class="loading-text">AI 正在分析你的画像，为你匹配最适合的职业方向...</p>
      </div>
      <div id="rec-content" style="display:none">
        <h2 class="rec-title">&#10024; 为你推荐的职业方向</h2>
        <p class="rec-subtitle">基于你的性格、兴趣和能力倾向，AI 为你筛选出以下匹配度最高的岗位</p>
        <div class="rec-cards" id="rec-cards"></div>
      </div>
    </div>
  </div>

  <!-- ========== TRIAL ========== -->
  <div id="page-trial" class="page">
    <div class="page-header">
      <span class="page-title">人生沙盒 2.0</span>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
        <span class="progress-text">2/4</span>
      </div>
    </div>
    <div class="trial-container">
      <div class="trial-scene" id="trial-scene"></div>
      <div class="options-area" id="trial-options"></div>
    </div>
  </div>

  <!-- ========== GROWTH ========== -->
  <div id="page-growth" class="page">
    <div class="page-header">
      <span class="page-title">人生沙盒 2.0</span>

  // ===== INIT =====
  init() {
    this.setupParallax();

  // ===== PARALLAX =====
  setupParallax() {
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      const grid = document.getElementById('gridBg');
      if (grid) {
        grid.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
      }
    });

  // ===== START =====
  start() {
    this.showAchievement('enter');
    this.showLoadingScreen(() => {
      this.portraitIndex = 0;
      this.portraitScores = { communication: 10, logic: 10, empathy: 10, execution: 10, creativity: 10, resilience: 10 };
      this.trialScores = { communication: 0, logic: 0, empathy: 0, execution: 0, creativity: 0, resilience: 0 };
      this.unlockedAchievements = new Set();
      this.showAchievement('enter');

      // Show pixel character
      const char = document.getElementById('pixelChar');
      char.style.display = 'flex';
      char.classList.add('walking');
      setTimeout(() => char.classList.remove('walking'), 1200);

      // Show skill dashboard
      document.getElementById('skillDash').style.display = 'block';
      this.updateSkillDash();

      this.setCharacterStage('landing');
      this.transitionTo('portrait');
      setTimeout(() => this.renderPortrait(), 400);
    });
  },

  // ===== LOADING SCREEN =====
  showLoadingScreen(callback) {
    const screen = document.getElementById('loadingScreen');
    const textEl = document.getElementById('loadingTextPixel');
    const barEl = document.getElementById('loadingBarPixel');
    const grid = document.getElementById('gridBg');

    screen.classList.add('active');
    grid.classList.add('fast');

    // Animate "LOADING..." characters one by one
    const text = 'LOADING...';
    textEl.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
      const span = document.createElement('span');
      span.textContent = text[i];
      textEl.appendChild(span);
      setTimeout(() => {
        span.style.opacity = '1';
        span.style.animation = 'loadingChar 0.3s ease-out';
      }, i * 120);
    }

    // Animate loading bar
    setTimeout(() => barEl.classList.add('fill'), 200);

    // Dissolve and callback
    setTimeout(() => {
      grid.classList.remove('fast');
      screen.classList.add('dissolving');
      setTimeout(() => {
        screen.classList.remove('active', 'dissolving');
        barEl.classList.remove('fill');
        if (callback) callback();
      }, 500);
    }, 2000);
  },

  // ===== PAGE TRANSITIONS =====
  transitionTo(pageId) {
    const oldPage = document.querySelector('.page.active');
    if (oldPage) {
      oldPage.classList.add('animating-out');
      setTimeout(() => {
        oldPage.classList.remove('active', 'animating-out');
        this.activatePage(pageId);
      }, 350);
    } else {
      this.activatePage(pageId);
    }
  },

  activatePage(id) {
    const page = document.getElementById('page-' + id);
    page.classList.add('active', 'animating-in');
    this.currentPage = id;
    window.scrollTo(0, 0);
    setTimeout(() => page.classList.remove('animating-in'), 400);
  },

  showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    this.currentPage = id;
    window.scrollTo(0, 0);
  },

  // ===== PIXEL CHARACTER =====
  setCharacterStage(stage) {
    const bubble = document.getElementById('charBubble');

    const eqGlasses = document.getElementById('eqGlasses');

        floatIcons.innerHTML = '<span style="animation:floatIcon 2s ease-in-out infinite;font-size:10px;position:absolute;top:-14px;left:-12px;">&#128214;</span><span style="animation:floatIcon 2s ease-in-out infinite 0.5s;font-size:10px;position:absolute;top:-10px;left:18px;">&#128295;</span>';

  // ===== SKILL DASHBOARD =====
  toggleDash() {
    const dash = document.getElementById('skillDash');
    this.dashCollapsed = !this.dashCollapsed;
    if (this.dashCollapsed) {
      dash.classList.add('collapsed');

  updateSkillDash(animScores) {
    const body = document.getElementById('skillDashBody');
    if (!body) return;
    const scores = this.getDisplayScores();
    let html = '<div class="skill-dash-title">能力面板</div>';
    Object.entries(skillLabels).forEach(key => {
      const val = Math.min(100, Math.max(0, Math.round(scores[key])));

      html += '<div class="skill-dash-item">' +
        '<div class="skill-dash-label"><span>' + skillLabels[key] + '</span><span>' + val + '</span></div>' +
        '<div class="skill-dash-bar"><div class="skill-dash-bar-fill ' + animClass + '" style="width:' + val + '%;background:' + skillColors[key] + ';--target-width:' + val + '%;--from-width:' + (val - 5) + '%"></div></div>' +
        '</div>';
    });
    body.innerHTML = html;

  getDisplayScores() {
    const base = { ...this.portraitScores };
    Object.entries(this.trialScores).forEach(([k, v]) => {
      base[k] += v * 2;
    });
    return base;

  // ===== RIPPLE =====
  createRipple(e) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    const size = 40;
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - size / 2) + 'px';
    ripple.style.top = (e.clientY - size / 2) + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  },

  // ===== TYPEWRITER =====
  typeWriter(element, html, speed, callback) {
    this.clearTypingTimers();
    // Parse html and type text content only, keep tags
    element.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className = 'typewriter-cursor';
    element.appendChild(cursor);

    // Simple approach: extract plain text, type it, then set final html
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const plainText = temp.textContent;

    let i = 0;
    const type = () => {
      if (i < plainText.length) {
        cursor.before(document.createTextNode(plainText[i]));
        i++;
        const tid = setTimeout(type, speed || 30);
        this.typingTimers.push(tid);
        element.parentElement && (element.parentElement.scrollTop = element.parentElement.scrollHeight);
      } else {
        cursor.remove();
        element.innerHTML = html;
        if (callback) callback();
      }
    };
    type();

    // Click to skip
    element.onclick = () => {
      this.clearTypingTimers();
      cursor.remove();
      element.innerHTML = html;
      element.onclick = null;
      if (callback) callback();
    };
  },

  clearTypingTimers() {
    this.typingTimers.forEach(t => clearTimeout(t));
    this.typingTimers = [];
  },

  // ===== AI THINKING TERMINAL =====
  showThinking(containerId, steps, callback) {
    const container = document.getElementById(containerId);
    const thinkDiv = document.createElement('div');
    thinkDiv.className = 'msg-thinking';
    let linesHtml = '';
    steps.forEach((s, i) => {
      linesHtml += '<div class="think-line" id="think-' + containerId + '-' + i + '">' + s + '</div>';
    });
    linesHtml += '<div class="think-line think-prompt" id="think-' + containerId + '-done">></div>';
    thinkDiv.innerHTML = linesHtml;
    container.appendChild(thinkDiv);

    let delay = 0;
    steps.forEach((s, i) => {
      delay += 500 + Math.random() * 400;
      setTimeout(() => {
        const line = document.getElementById('think-' + containerId + '-' + i);
        if (line) line.classList.add('visible');
        container.scrollTop = container.scrollHeight;
      }, delay);
    });
    delay += 400;
    setTimeout(() => {
      const doneLine = document.getElementById('think-' + containerId + '-done');
      if (doneLine) doneLine.remove();
      if (callback) callback();
    }, delay);
  },

  // ===== PORTRAIT =====
  renderPortrait() {
    const container = document.getElementById('portrait-messages');

    const progress = document.getElementById('portrait-progress');

      this.setCharacterStage('portrait');
      this.addAIMessage('portrait-messages', '&#127918; 欢迎来到「人生沙盒 2.0」深度画像环节。<br><br>我是你的沙盒向导 AI。接下来我会问你 6 个情景问题，不需要标准答案，选你最真实的反应就好。<br><br>准备好了吗？我们开始了！');

  showPortraitQuestion() {
    const q = portraitQuestions[this.portraitIndex];
    const optionsArea = document.getElementById('portrait-options');

    const steps = ['正在分析上一个回答...', '评估能力维度...', '生成下一个问题...'];
    this.showThinking('portrait-messages', steps, () => {
      this.addAIMessage('portrait-messages', '<strong>问题 ' + (this.portraitIndex + 1) + '：</strong>' + q.question);
      optionsArea.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-card';
        btn.innerHTML = opt.text;
        btn.onclick = (e) => {
          this.createRipple(e);
          this.selectPortraitOption(i);
        };
        optionsArea.appendChild(btn);
      });
    });

  selectPortraitOption(optionIndex) {
    const q = portraitQuestions[this.portraitIndex];
    const selected = q.options[optionIndex];

    // Check achievements
    if (selected.scores.communication && selected.scores.communication >= 3) {
      this.showAchievement('comm');
    }
    if (selected.scores.logic && selected.scores.logic >= 3) {
      this.showAchievement('logic');
    }

    this.addUserMessage('portrait-messages', selected.text);

    Object.entries(selected.scores).forEach(([key, val]) => {
      this.portraitScores[key] += val;
    });

    // Ripple effect on options
    document.querySelectorAll('#portrait-options .option-card').forEach((btn, i) => {
      if (i === optionIndex) {
        btn.classList.add('selected');
        btn.classList.add('disabled');
      } else {
        btn.classList.add('not-selected');
      }
    });

    this.updateSkillDash(true);

    this.portraitIndex++;
    setTimeout(() => {
      document.getElementById('portrait-options').innerHTML = '';
      this.renderPortrait();
    }, 1000);
  },

    const optionsArea = document.getElementById('portrait-options');
    optionsArea.innerHTML = '';

    const steps = ['汇总画像数据...', '计算能力匹配度...', '生成推荐方案...'];
    this.showThinking('portrait-messages', steps, () => {
      this.addAIMessage('portrait-messages', '&#10024; 画像完成！我已经了解了你的性格、兴趣和能力倾向。<br><br>正在为你分析匹配的职业方向...');

        this.transitionTo('recommendation');
        setTimeout(() => this.showRecommendation(), 400);

  // ===== RECOMMENDATION =====
  showRecommendation() {
    document.getElementById('rec-loading').style.display = 'block';
    document.getElementById('rec-content').style.display = 'none';

    setTimeout(() => {
      document.getElementById('rec-loading').style.display = 'none';
      document.getElementById('rec-content').style.display = 'block';

      const cards = document.getElementById('rec-cards');
      cards.innerHTML = '';

      const matches = careers.map(c => {
        let score = 0;
        Object.entries(c.weights).forEach(([key, weight]) => {
          score += this.portraitScores[key] * weight;
        });
        return { career: c, score: Math.round(score / 10) };
      }).sort((a, b) => b.score - a.score);

      matches.slice(0, 3).forEach((m, i) => {
        const card = document.createElement('div');
        card.className = 'rec-card';
        card.style.animationDelay = (i * 0.15) + 's';
        card.style.animation = 'fadeInUp 0.5s ease-out forwards';
        card.style.opacity = '0';
        card.innerHTML = '<div class="rec-match">' + m.score + '<span>%</span></div>' +
          '<div class="rec-icon">' + m.career.icon + '</div>' +
          '<div class="rec-name">' + m.career.name + '</div>' +

          '<div class="rec-tags">' + m.career.tags.map(t => '<span class="rec-tag">' + t + '</span>').join('') + '</div>';
        card.onclick = (e) => {
          this.createRipple(e);
          this.selectCareer(m.career, cards);
        };
        cards.appendChild(card);
      });
    }, 2500);
  },

  selectCareer(career, cardsEl) {
    // Ripple effect: selected card up, others down
    if (cardsEl) {
      cardsEl.querySelectorAll('.rec-card').forEach(card => {
        if (card.querySelector('.rec-name').textContent === career.name) {
          card.classList.add('selected');
          card.style.animation = 'glowPulse 1.5s ease-in-out infinite';
        } else {
          card.classList.add('not-selected');
        }
      });
    }

    this.selectedCareer = career;
    this.trialIndex = 0;
    this.trialScores = { communication: 0, logic: 0, empathy: 0, execution: 0, creativity: 0, resilience: 0 };

    setTimeout(() => {
      this.setCharacterStage('trial');
      this.transitionTo('trial');
      setTimeout(() => this.renderTrial(), 400);
    }, 800);
  },

  // ===== TRIAL =====
  renderTrial() {
    const scene = document.getElementById('trial-scene');
    const options = document.getElementById('trial-options');

    if (this.trialIndex >= this.selectedCareer.scenarios.length) {
      this.finishTrial();
      return;
    }

    const s = this.selectedCareer.scenarios[this.trialIndex];
    scene.innerHTML = '<div class="trial-role">' + s.role + '</div>' +
      '<div class="trial-scene-text">' + s.text + '</div>';
    scene.style.animation = 'fadeInUp 0.4s ease-out';

    options.innerHTML = '';
    s.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-card';
      btn.innerHTML = opt.text;
      btn.onclick = (e) => {
        this.createRipple(e);
        this.selectTrialOption(i);
      };
      options.appendChild(btn);
    });
  },

  selectTrialOption(optionIndex) {
    const s = this.selectedCareer.scenarios[this.trialIndex];
    const selected = s.options[optionIndex];

    // Check challenge achievement (resilience >= 2 in trial)
    if (selected.scores.resilience && selected.scores.resilience >= 2) {
      this.showAchievement('challenge');
    }
    if (selected.scores.communication && selected.scores.communication >= 3) {
      this.showAchievement('comm');
    }
    if (selected.scores.logic && selected.scores.logic >= 3) {
      this.showAchievement('logic');
    }

    Object.entries(selected.scores).forEach(([key, val]) => {
      this.trialScores[key] += val;
    });

    // Ripple effect
    document.querySelectorAll('#trial-options .option-card').forEach((btn, i) => {
      if (i === optionIndex) {
        btn.classList.add('selected');
        btn.classList.add('disabled');
      } else {
        btn.classList.add('not-selected');
      }
    });

    this.updateSkillDash(true);

    // Show feedback with thinking
    const steps = ['正在分析你的选择...', '评估能力变化...'];
    this.showThinkingForTrial(steps, () => {
      const scene = document.getElementById('trial-scene');
      const feedbackDiv = document.createElement('div');
      feedbackDiv.className = 'trial-feedback';

      const pills = Object.entries(selected.scores)
        .filter(([_, v]) => v !== 0)
        .map(([k, v]) => '<span class="skill-pill ' + (v > 0 ? 'pill-up' : 'pill-down') + '">' + skillLabels[k] + ' ' + (v > 0 ? '+' : '') + v + '</span>')
        .join('');

      feedbackDiv.innerHTML = '<strong>&#10024; 试炼官点评：</strong><br>' + selected.feedback + '<div class="skill-pills">' + pills + '</div>';
      scene.appendChild(feedbackDiv);

      this.trialIndex++;
      setTimeout(() => {
        this.renderTrial();
      }, 2500);
    });
  },

  showThinkingForTrial(steps, callback) {
    const scene = document.getElementById('trial-scene');
    const thinkDiv = document.createElement('div');
    thinkDiv.className = 'msg-thinking';
    thinkDiv.style.marginTop = '1rem';
    let linesHtml = '';
    steps.forEach((s, i) => {
      linesHtml += '<div class="think-line" id="trial-think-' + i + '">' + s + '</div>';
    });
    thinkDiv.innerHTML = linesHtml;
    scene.appendChild(thinkDiv);

    let delay = 0;
    steps.forEach((s, i) => {
      delay += 400 + Math.random() * 300;
      setTimeout(() => {
        const line = document.getElementById('trial-think-' + i);
        if (line) line.classList.add('visible');
      }, delay);
    });
    setTimeout(() => {
      thinkDiv.remove();
      if (callback) callback();
    }, delay + 300);
  },

  finishTrial() {
    const scene = document.getElementById('trial-scene');
    const options = document.getElementById('trial-options');

    scene.innerHTML = '<div style="text-align:center;padding:2rem 0">' +
      '<div style="font-size:3rem;margin-bottom:1rem">&#127942;</div>' +
      '<h3 style="margin-bottom:0.5rem">职业试炼完成！</h3>' +
      '<p style="color:var(--muted)">你在 ' + this.selectedCareer.name + ' 的试炼中表现如何？接下来进入能力成长阶段。</p></div>';
    options.innerHTML = '<button class="btn-primary" onclick="app.enterGrowth()" style="width:100%">进入能力成长 &#8594;</button>';
  },

  enterGrowth() {
    this.setCharacterStage('growth');
    this.transitionTo('growth');
    setTimeout(() => this.renderGrowth(), 400);
  },

  // ===== GROWTH =====
  renderGrowth() {
    this.completedTasks = 0;

    const treeContent = document.getElementById('skill-tree-content');
    const skills = [
      { icon: '&#128161;', name: '需求分析', unlocked: true },
      { icon: '&#128200;', name: '数据思维', unlocked: true },
      { icon: '&#128172;', name: '沟通表达', unlocked: true },
      { icon: '&#127912;', name: '设计审美', unlocked: false },
      { icon: '&#128295;', name: '项目管理', unlocked: false },
      { icon: '&#10024;', name: '战略思维', unlocked: false }
    ];
    treeContent.innerHTML = skills.map(s =>
      '<div class="tree-node"><div class="tree-icon ' + (s.unlocked ? 'unlocked' : 'locked') + '">' + (s.unlocked ? '&#10004;' : '&#128274;') + '</div>' +
      '<span style="color:' + (s.unlocked ? 'var(--ink)' : 'var(--muted)') + '">' + s.name + '</span></div>'
    ).join('');

    const taskContent = document.getElementById('task-list-content');
    taskContent.innerHTML = '';
    this.selectedCareer.tasks.forEach((task, i) => {
      const div = document.createElement('div');
      div.className = 'task-item';
      div.id = 'task-' + i;
      let resourceHtml = '';
      if (task.resource && task.url) {
        resourceHtml = '<div class="task-resource"><a href="' + task.url + '" target="_blank" rel="noopener">' + task.resource + ' &#8599;</a></div>';
      }
      div.innerHTML = '<div class="task-check"></div>' +
        '<div class="task-content"><div class="task-title">' + task.title + '</div><div class="task-desc">' + task.desc + '</div>' + resourceHtml + '</div>';
      div.onclick = (e) => {
        if (e.target.tagName === 'A') return;
        this.toggleTask(i, e);
      };
      taskContent.appendChild(div);
    });

    this.updateGrowthProgress();
  },

  toggleTask(index, event) {
    if (event) this.createRipple(event);
    const taskEl = document.getElementById('task-' + index);
    const isDone = taskEl.classList.contains('done');

    if (isDone) {
      taskEl.classList.remove('done');
      this.completedTasks--;
    } else {
      taskEl.classList.add('done');
      this.completedTasks++;
    }

    this.updateGrowthProgress();

    // Check study achievement
    if (this.completedTasks >= this.selectedCareer.tasks.length) {
      this.showAchievement('study');
    }
  },

  updateGrowthProgress() {
    const total = this.selectedCareer.tasks.length;
    const pct = Math.round((this.completedTasks / total) * 100);
    document.getElementById('growth-percent').textContent = pct + '%';
    document.getElementById('growth-bar-fill').style.width = pct + '%';

    const nextBtn = document.getElementById('growth-next-btn');
    if (pct >= 50) {
      nextBtn.style.opacity = '1';
      nextBtn.style.pointerEvents = 'auto';
    } else {
      nextBtn.style.opacity = '0.5';
      nextBtn.style.pointerEvents = 'none';
    }
  },

  goToAssessment() {
    this.quizIndex = 0;
    this.quizScore = 0;
    this.quizAnswered = false;
    this.transitionTo('assessment');
    setTimeout(() => this.renderQuiz(), 400);
  },

  // ===== ASSESSMENT =====
  renderQuiz() {
    const card = document.getElementById('quiz-card');
    const quiz = this.selectedCareer.quiz[this.quizIndex];

    card.innerHTML = '<div class="quiz-header">' +
      '<span class="quiz-num">题目 ' + (this.quizIndex + 1) + ' / ' + this.selectedCareer.quiz.length + '</span>' +
      '<span class="quiz-timer">&#9201; ' + this.selectedCareer.name + ' 能力考核</span></div>' +
      '<div class="quiz-question">' + quiz.q + '</div>' +
      '<div class="quiz-options" id="quiz-options"></div>';
    card.style.animation = 'fadeInUp 0.4s ease-out';

    const opts = document.getElementById('quiz-options');
    quiz.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
      btn.onclick = (e) => {
        this.createRipple(e);
        this.selectQuizOption(i);
      };
      opts.appendChild(btn);
    });
  },

  selectQuizOption(optionIndex) {
    if (this.quizAnswered) return;
    this.quizAnswered = true;

    const quiz = this.selectedCareer.quiz[this.quizIndex];
    const isCorrect = optionIndex === quiz.correct;

    if (isCorrect) this.quizScore++;

    document.querySelectorAll('#quiz-options .quiz-opt').forEach((btn, i) => {
      btn.classList.add('disabled');
      if (i === quiz.correct) {
        btn.classList.add('correct');
      } else if (i !== optionIndex) {
        btn.classList.add('not-selected');
      } else if (i === optionIndex && !isCorrect) {
        btn.classList.add('wrong');
      }
    });

    const explain = document.createElement('div');
    explain.className = 'quiz-explain';
    explain.innerHTML = '<strong>' + (isCorrect ? '&#10024; 回答正确！' : '&#128161; 解析：') + '</strong><br>' + quiz.explain;
    document.getElementById('quiz-options').appendChild(explain);

    setTimeout(() => {
      this.quizIndex++;
      this.quizAnswered = false;
      if (this.quizIndex < this.selectedCareer.quiz.length) {
        this.renderQuiz();
      } else {
        this.showAchievement('clear');
        this.showReport();
      }
    }, 3000);
  },

  // ===== REPORT =====
  showReport() {
    this.setCharacterStage('report');
    this.transitionTo('report');

    setTimeout(() => {
      const baseScores = { ...this.portraitScores };
      Object.entries(this.trialScores).forEach(([k, v]) => {
        baseScores[k] += v * 3;
      });

      const finalScores = {};
      Object.entries(baseScores).forEach(([k, v]) => {
        finalScores[k] = Math.min(100, Math.max(20, v * 2));
      });

      const career = this.selectedCareer;
      let matchScore = 0;
      let totalWeight = 0;
      Object.entries(career.weights).forEach(([k, w]) => {
        const normalizedScore = finalScores[k];
        const idealScore = 80;
        const diff = Math.abs(normalizedScore - idealScore);
        const match = Math.max(0, 100 - diff * 1.5);
        matchScore += match * w;
        totalWeight += w;
      });
      const overallMatch = Math.round(matchScore / totalWeight);

      const sortedSkills = Object.entries(finalScores).sort((a, b) => b[1] - a[1]);

      // Determine ending
      let ending = endings[endings.length - 1];
      for (let i = 0; i < endings.length; i++) {
        if (overallMatch >= endings[i].min) {
          ending = endings[i];
          break;
        }
      }

      const content = document.getElementById('report-content');
      content.innerHTML = '<div class="report-hero">' +
        '<div class="report-match" id="report-match-num">0%</div>' +
        '<div class="report-match-label">与 ' + career.name + ' 的匹配度</div>' +
        '<div class="report-career">' + career.icon + ' ' + career.name + '</div></div>' +

        '<div class="ending-card">' +
        '<div class="ending-icon">' + ending.icon + '</div>' +
        '<div class="ending-title">' + ending.title + '</div>' +
        '<div class="ending-text">' + ending.text + '</div></div>' +

        '<div class="radar-section">' +
        '<div class="radar-title">&#128200; 能力雷达图</div>' +
        sortedSkills.map(([k, v]) =>
          '<div class="radar-item"><span class="radar-label">' + skillLabels[k] + '</span>' +
          '<div class="radar-bar-bg"><div class="radar-bar-fill" style="width:0%;background:' + skillColors[k] + '" data-target="' + Math.round(v) + '"></div></div>' +
          '<span class="radar-score">' + Math.round(v) + '</span></div>'
        ).join('') + '</div>' +

        '<div class="report-section"><h3>&#10024; 你的核心优势</h3><ul>' +
        '<li><strong>' + skillLabels[sortedSkills[0][0]] + '</strong> 得分最高（' + Math.round(sortedSkills[0][1]) + '分），这是你在 ' + career.name + ' 岗位上最突出的竞争力</li>' +
        '<li><strong>' + skillLabels[sortedSkills[1][0]] + '</strong> 表现优秀，与岗位核心能力高度匹配</li>' +
        '<li>考核正确率 <strong>' + Math.round(this.quizScore / career.quiz.length * 100) + '%</strong>，理论掌握' + (this.quizScore >= 2 ? '扎实' : '有待加强') + '</li></ul></div>' +

        '<div class="report-section"><h3>&#128161; 提升建议</h3><ul>' +
        '<li><strong>' + skillLabels[sortedSkills[5][0]] + '</strong> 相对较弱，建议重点加强相关训练</li>' +
        '<li>' + (sortedSkills[4][1] < 50 ? '整体基础能力需要更多系统性学习' : '继续保持学习节奏，持续提升综合能力') + '</li>' +
        '<li>多参与实际项目，在真实场景中锻炼 ' + skillLabels[sortedSkills[3][0]] + '</li></ul></div>' +

        '<div class="report-section"><h3>&#128640; 下一步行动</h3><ul>' +
        '<li>完成「能力成长」阶段剩余的学习任务</li>' +
        '<li>寻找一个 ' + career.name + ' 相关的实习或项目实践机会</li>' +
        '<li>加入相关行业社群，与从业者交流学习</li></ul></div>' +

        '<div class="report-actions">' +
        '<button class="btn-primary" onclick="app.restart()">&#8634; 重新开始</button>' +
        '<button class="btn-secondary" onclick="app.exploreOther()">&#128269; 探索其他职业</button></div>';

      // Animate match number
      setTimeout(() => {
        this.animateNumber('report-match-num', overallMatch, '%');
      }, 300);

      // Animate bars
      setTimeout(() => {
        document.querySelectorAll('.radar-bar-fill').forEach(bar => {
          bar.style.width = bar.getAttribute('data-target') + '%';
        });
      }, 600);
    }, 450);
  },

  animateNumber(id, target, suffix) {
    const el = document.getElementById(id);
    if (!el) return;
    let current = 0;
    const step = Math.ceil(target / 40);
    const timer = setInterval(() => {
      current += step;
      if (current >= target) {
        current = target;
        clearInterval(timer);
      }
      el.textContent = current + suffix;
    }, 25);
  },

  restart() {
    this.clearTypingTimers();
    this.showPage('landing');
    document.getElementById('pixelChar').style.display = 'none';
    document.getElementById('skillDash').style.display = 'none';
    this.dashCollapsed = true;
    document.getElementById('skillDash').classList.add('collapsed');
  },

  exploreOther() {
    this.clearTypingTimers();
    this.showPage('recommendation');
    this.setCharacterStage('recommendation');
    this.showRecommendation();
  }
};

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  app.init();
});
</script>
</body>
