<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>体重管理</title>
  <link rel="stylesheet" href="lib/element-plus.css" />
  <link rel="stylesheet" href="lib/element-dark.css" />
  <style>
    :root{--bg-primary:#1a1a2e;--bg-secondary:#16213e;--bg-card:#0f3460;--accent:#00d2a0;--danger:#e94560;--text-primary:#eaeaea;--text-secondary:#a0a0b0;--text-muted:#6c6c80;--border-color:#2a2a4a;--tab-height:56px}
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px;-webkit-tap-highlight-color:transparent}
    html.dark{color-scheme:dark}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#0d0d1a;color:var(--text-primary);min-height:100vh;min-height:100dvh}
    #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg-primary);box-shadow:0 0 40px rgba(0,0,0,.5)}
    .page-container{padding:16px;padding-bottom:calc(var(--tab-height) + 24px);min-height:100vh}
    .el-input__wrapper,.el-textarea__inner,.el-select__wrapper{background-color:var(--bg-secondary)!important;box-shadow:0 0 0 1px var(--border-color) inset!important;color:var(--text-primary)!important}
    .el-input__inner,.el-textarea__inner{color:var(--text-primary)!important}
    .el-form-item__label{color:var(--text-secondary)!important}
    .el-card{--el-card-bg-color:var(--bg-secondary);border-color:var(--border-color)!important}
    .el-dialog{--el-dialog-bg-color:var(--bg-secondary)}
    .el-collapse-item__header{background-color:var(--bg-secondary)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important}
    .el-collapse-item__wrap{background-color:var(--bg-primary)!important;border-color:var(--border-color)!important}
    .el-collapse-item__content{color:var(--text-primary)!important}
    .btn-touch{min-height:44px;min-width:44px}
    .section-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-left:4px}
    .stat-card{background:var(--bg-card);border-radius:12px;padding:16px;border:1px solid var(--border-color)}
    .stat-value{font-size:24px;font-weight:700;color:var(--accent);line-height:1.2}
    .stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
    .tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--tab-height);background:var(--bg-secondary);border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-around;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
    .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--text-muted);transition:color .2s;min-height:44px}
    .tab-item.active{color:var(--accent)}
    .tab-label{font-size:11px;line-height:1}
    .auth-page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:var(--bg-primary)}
    .auth-header{text-align:center;margin-bottom:40px}
    .auth-header h1{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:8px}
    .auth-header p{color:var(--text-secondary);font-size:14px}
    .auth-card{background:var(--bg-secondary);border-radius:16px;padding:24px;border:1px solid var(--border-color)}
    .auth-footer{text-align:center;margin-top:20px;font-size:14px;color:var(--text-secondary)}
    .auth-footer a{color:var(--accent);text-decoration:none;cursor:pointer}
    .tips-carousel{background:var(--bg-card);border-radius:10px;margin-bottom:16px;overflow:hidden;border:1px solid var(--border-color)}
    .tip-text{height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);padding:0 16px}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .target-bar{background:var(--bg-card);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border:1px solid var(--border-color)}
    .target-label{font-size:13px;color:var(--text-secondary)}
    .target-value{font-size:16px;font-weight:600;color:var(--accent)}
    .chart-container{padding:12px}
    .sub-tabs{display:flex;gap:0;background:var(--bg-secondary);border-radius:10px;padding:4px;margin-bottom:16px;border:1px solid var(--border-color)}
    .sub-tabs span{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text-secondary);transition:all .2s}
    .sub-tabs span.active{background:var(--bg-card);color:var(--accent);font-weight:600}
    .trend-btns{float:right}
    .record-item{margin-bottom:8px}
    .record-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .record-date{font-weight:600;font-size:14px}
    .record-data{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text-secondary)}
    .summary-bar{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:16px}
    .summary-item{flex-shrink:0}
    .summary-chart{flex:1;display:flex;justify-content:center}
    .summary-legend{display:flex;flex-direction:column;gap:4px;font-size:11px}
    .diet-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-color)}
    .diet-item:last-child{border-bottom:none}
    .diet-info{display:flex;flex-direction:column}
    .diet-name{font-size:14px;font-weight:500}
    .diet-detail{font-size:12px;color:var(--text-secondary)}
    .preview-nutrients{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--text-secondary)}
    .exercise-item{margin-bottom:8px}
    .exercise-row{display:flex;justify-content:space-between;align-items:center}
    .exercise-name{font-size:15px;font-weight:500;margin-bottom:4px}
    .exercise-detail{font-size:12px;color:var(--text-secondary)}
    .med-item{margin-bottom:8px}
    .med-row{display:flex;justify-content:space-between;align-items:center}
    .med-name{font-size:15px;font-weight:500}
    .med-dosage{font-size:12px;color:var(--accent);margin-left:6px}
    .med-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .checkup-item{margin-bottom:8px}
    .checkup-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .checkup-date{font-weight:600;font-size:14px}
    .checkup-data{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--text-secondary)}
    .profile-header{text-align:center;padding:32px 0 24px}
    .avatar{width:64px;height:64px;border-radius:50%;background:var(--bg-card);color:var(--accent);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:2px solid var(--accent)}
    .profile-name{font-size:18px;font-weight:600}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .info-item{display:flex;flex-direction:column;gap:2px}
    .info-label{font-size:12px;color:var(--text-muted)}
    .info-value{font-size:14px;color:var(--text-primary)}
    .period-select{display:flex;gap:8px}
    .export-btns{display:flex;flex-wrap:wrap;gap:8px}
  </style>
</head>
<body>
<div id="app">
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#1a1a2e;color:#00d2a0;font-size:18px">加载中...</div>
  <!-- Auth -->
  <div v-if="!isLoggedIn" class="auth-page">
    <div class="auth-header">
      <h1>体重管理</h1>
      <p>记录每一天，遇见更好的自己</p>
    </div>
    <div class="auth-card">
      <div class="sub-tabs" style="margin-bottom:20px">
        <span :class="{active:authMode==='email'}" @click="authMode='email'">邮箱</span>
        <span :class="{active:authMode==='phone'}" @click="authMode='phone'">手机号</span>
      </div>
      <!-- Email -->
      <div v-if="authMode==='email'">
        <div style="margin-bottom:12px"><input v-model="authForm.email" placeholder="邮箱" type="email" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;min-height:44px" /></div>
        <div style="margin-bottom:12px"><input v-model="authForm.password" placeholder="密码(至少6位)" type="password" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;min-height:44px" /></div>
        <div v-if="isRegister" style="margin-bottom:12px"><input v-model="authForm.confirmPwd" placeholder="确认密码" type="password" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;min-height:44px" /></div>
        <button @click="handleAuth" :disabled="authLoading" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;min-height:44px">{{isRegister?'注册':'登录'}}</button>
      </div>
      <!-- Phone -->
      <div v-if="authMode==='phone'">
        <div style="margin-bottom:12px"><input v-model="authForm.phone" placeholder="手机号" type="tel" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;min-height:44px" /></div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input v-model="authForm.code" placeholder="验证码" type="text" style="flex:1;padding:12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;min-height:44px" />
          <button @click="sendCode" :disabled="countdown>0" style="padding:12px 16px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;cursor:pointer;min-height:44px;white-space:nowrap">{{countdown>0?countdown+'s':'获取验证码'}}</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">演示模式：点击获取验证码后自动填入</p>
        <button @click="handleAuth" :disabled="authLoading" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;min-height:44px">{{isRegister?'注册':'登录'}}</button>
      </div>
      <div class="auth-footer" style="margin-top:20px">{{isRegister?'已有账号？':'还没有账号？'}}<a @click="isRegister=!isRegister" style="cursor:pointer">{{isRegister?'去登录':'立即注册'}}</a></div>
    </div>
  </div>

  <!-- Main -->
  <template v-if="isLoggedIn">
    <!-- Home -->
    <div v-if="currentTab==='home'" class="page-container">
      <div class="tips-carousel">
        <el-carousel height="40px" indicator-position="none" :interval="3000" arrow="never">
          <el-carousel-item v-for="(tip,i) in tips" :key="i"><div class="tip-text">{{tip}}</div></el-carousel-item>
        </el-carousel>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">{{todayWeight||'--'}}</div><div class="stat-label">今日体重(kg)</div></div>
        <div class="stat-card"><div class="stat-value">{{todayIntake}}</div><div class="stat-label">摄入热量(kcal)</div></div>
        <div class="stat-card"><div class="stat-value">{{todayBurned}}</div><div class="stat-label">消耗热量(kcal)</div></div>
        <div class="stat-card"><div class="stat-value" :style="{color:todayDeficit>0?'#e94560':'#00d2a0'}">{{todayDeficit}}</div><div class="stat-label">热量缺口(kcal)</div></div>
      </div>
      <div v-if="user.target_weight" class="target-bar"><span class="target-label">目标体重</span><span class="target-value">{{user.target_weight}} kg</span></div>
      <div class="section-title">近7天体重趋势</div>
      <div class="stat-card chart-container"><div ref="weekChart" style="width:100%;height:220px"></div></div>
    </div>

    <!-- Record -->
    <div v-if="currentTab==='record'" class="page-container">
      <div class="sub-tabs">
        <span :class="{active:recordSub==='body'}" @click="recordSub='body'">身体数据</span>
        <span :class="{active:recordSub==='medicine'}" @click="recordSub='medicine'">药物管理</span>
        <span :class="{active:recordSub==='checkup'}" @click="recordSub='checkup'">体检报告</span>
      </div>
      <!-- Body -->
      <template v-if="recordSub==='body'">
        <div class="section-title">记录身体数据</div>
        <div class="stat-card" style="margin-bottom:16px">
          <el-form label-width="80px">
            <el-form-item label="日期"><el-date-picker v-model="bodyForm.date" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
            <el-form-item label="体重(kg)"><el-input-number v-model="bodyForm.weight" :min="20" :max="300" :step="0.1" :precision="1" style="width:100%" /></el-form-item>
            <el-form-item label="腰围(cm)"><el-input-number v-model="bodyForm.waist" :min="0" :max="200" :step="0.1" :precision="1" style="width:100%" /></el-form-item>
            <el-form-item label="臀围(cm)"><el-input-number v-model="bodyForm.hip" :min="0" :max="200" :step="0.1" :precision="1" style="width:100%" /></el-form-item>
            <el-form-item label="大腿围(cm)"><el-input-number v-model="bodyForm.thigh" :min="0" :max="100" :step="0.1" :precision="1" style="width:100%" /></el-form-item>
            <el-form-item label="小腿围(cm)"><el-input-number v-model="bodyForm.calf" :min="0" :max="80" :step="0.1" :precision="1" style="width:100%" /></el-form-item>
            <el-form-item><el-button type="primary" @click="addBody" :loading="saving" class="btn-touch" style="width:100%">保存记录</el-button></el-form-item>
          </el-form>
        </div>
        <div class="section-title">趋势图表 <div class="trend-btns"><el-button :type="trendDays===7?'primary':'default'" size="small" @click="trendDays=7">7天</el-button><el-button :type="trendDays===30?'primary':'default'" size="small" @click="trendDays=30">30天</el-button></div></div>
        <div class="stat-card chart-container"><div ref="trendChart" style="width:100%;height:240px"></div></div>
        <div class="section-title">历史记录</div>
        <div v-for="r in bodyRecords" :key="r.id" class="record-item stat-card">
          <div class="record-row"><span class="record-date">{{r.date}}</span><el-button type="danger" size="small" text @click="deleteBody(r.id)">删除</el-button></div>
          <div class="record-data">
            <span>体重: {{r.weight}}kg</span>
            <span v-if="r.bmi">BMI: <span :style="{color:bmiCat(r.bmi).color}">{{r.bmi}} {{bmiCat(r.bmi).text}}</span></span>
            <span v-if="r.waist">腰围: {{r.waist}}cm</span>
            <span v-if="r.hip">臀围: {{r.hip}}cm</span>
          </div>
        </div>
      </template>
      <!-- Medicine -->
      <template v-if="recordSub==='medicine'">
        <div class="section-title">药物管理</div>
        <div class="stat-card" style="margin-bottom:16px">
          <el-form label-width="60px">
            <el-form-item label="日期"><el-date-picker v-model="medForm.date" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
            <el-form-item label="药名"><el-input v-model="medForm.name" placeholder="药品名称" /></el-form-item>
            <el-form-item label="剂量"><el-input v-model="medForm.dosage" placeholder="如: 1片" /></el-form-item>
            <el-form-item label="时间"><el-time-picker v-model="medForm.time" format="HH:mm" value-format="HH:mm" placeholder="选择时间" style="width:100%" /></el-form-item>
            <el-form-item label="备注"><el-input v-model="medForm.note" type="textarea" :rows="2" placeholder="可选备注" /></el-form-item>
            <el-form-item><el-button type="primary" @click="addMed" :loading="saving" class="btn-touch" style="width:100%">保存用药记录</el-button></el-form-item>
          </el-form>
        </div>
        <div class="section-title">用药历史</div>
        <div v-for="r in medRecords" :key="r.id" class="med-item stat-card">
          <div class="med-row">
            <div><div class="med-name">{{r.name}} <span class="med-dosage">{{r.dosage}}</span></div><div class="med-meta">{{r.date}} {{r.time}}<span v-if="r.note"> | {{r.note}}</span></div></div>
            <el-button type="danger" size="small" text @click="deleteMed(r.id)">删除</el-button>
          </div>
        </div>
      </template>
      <!-- Checkup -->
      <template v-if="recordSub==='checkup'">
        <div class="section-title">体检报告</div>
        <div class="stat-card" style="margin-bottom:16px">
          <el-form label-width="80px">
            <el-form-item label="日期"><el-date-picker v-model="checkupForm.date" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
            <el-form-item label="血糖(mmol/L)"><el-input-number v-model="checkupForm.blood_sugar" :precision="1" :step="0.1" style="width:100%" /></el-form-item>
            <el-form-item label="收缩压(mmHg)"><el-input-number v-model="checkupForm.systolic" :min="60" :max="250" style="width:100%" /></el-form-item>
            <el-form-item label="舒张压(mmHg)"><el-input-number v-model="checkupForm.diastolic" :min="40" :max="150" style="width:100%" /></el-form-item>
            <el-form-item label="总胆固醇"><el-input-number v-model="checkupForm.cholesterol" :precision="2" :step="0.1" style="width:100%" /></el-form-item>
            <el-form-item label="甘油三酯"><el-input-number v-model="checkupForm.triglyceride" :precision="2" :step="0.1" style="width:100%" /></el-form-item>
            <el-form-item label="尿酸(umol/L)"><el-input-number v-model="checkupForm.uric_acid" :step="1" style="width:100%" /></el-form-item>
            <el-form-item><el-button type="primary" @click="addCheckup" :loading="saving" class="btn-touch" style="width:100%">保存体检记录</el-button></el-form-item>
          </el-form>
        </div>
        <div class="section-title">历次指标趋势</div>
        <div class="stat-card chart-container"><div ref="checkupChart" style="width:100%;height:280px"></div></div>
        <div class="section-title" style="margin-top:16px">历史记录</div>
        <div v-for="r in checkupRecords" :key="r.id" class="checkup-item stat-card">
          <div class="checkup-row"><span class="checkup-date">{{r.date}}</span><el-button type="danger" size="small" text @click="deleteCheckup(r.id)">删除</el-button></div>
          <div class="checkup-data">
            <span :style="{color:isAbnormal('blood_sugar',r.blood_sugar)?'#e94560':''}">血糖: {{r.blood_sugar}}</span>
            <span :style="{color:isAbnormal('systolic',r.systolic)?'#e94560':''}">血压: {{r.systolic}}/{{r.diastolic}}</span>
            <span :style="{color:isAbnormal('cholesterol',r.cholesterol)?'#e94560':''}">胆固醇: {{r.cholesterol}}</span>
            <span :style="{color:isAbnormal('triglyceride',r.triglyceride)?'#e94560':''}">甘油三酯: {{r.triglyceride}}</span>
            <span :style="{color:isAbnormal('uric_acid',r.uric_acid)?'#e94560':''}">尿酸: {{r.uric_acid}}</span>
          </div>
        </div>
      </template>
    </div>

    <!-- Diet -->
    <div v-if="currentTab==='diet'" class="page-container">
      <div class="section-title">饮食记录 <span style="float:right;font-size:13px;color:var(--text-secondary)">{{todayStr}}</span></div>
      <div class="stat-card summary-bar" v-if="dietSummary.total_calories">
        <div class="summary-item"><div class="stat-value" style="font-size:20px">{{dietSummary.total_calories}}</div><div class="stat-label">总热量(kcal)</div></div>
        <div class="summary-chart"><div ref="pieChart" style="width:120px;height:120px"></div></div>
        <div class="summary-legend">
          <span style="color:#00d2a0">蛋白质 {{dietSummary.total_protein}}g</span>
          <span style="color:#ffa726">脂肪 {{dietSummary.total_fat}}g</span>
          <span style="color:#4fc3f7">碳水 {{dietSummary.total_carbs}}g</span>
        </div>
      </div>
      <el-collapse v-model="activeMeals">
        <el-collapse-item v-for="meal in mealTypes" :key="meal.key" :title="meal.label" :name="meal.key">
          <div v-for="r in mealRecords(meal.key)" :key="r.id" class="diet-item">
            <div class="diet-info"><span class="diet-name">{{r.food_name}}</span><span class="diet-detail">{{r.grams}}g / {{r.calories}}kcal</span></div>
            <el-button type="danger" size="small" text @click="deleteDiet(r.id)">删除</el-button>
          </div>
          <el-button type="primary" plain size="small" @click="openDietDialog(meal.key)" class="btn-touch" style="width:100%;margin-top:8px">+ 添加{{meal.label}}</el-button>
        </el-collapse-item>
      </el-collapse>
      <el-dialog v-model="dietDialogVisible" :title="'添加'+currentMealLabel" width="90%" style="max-width:400px">
        <el-form label-width="60px">

  getUsers() { return this._get('users') || [] },

  getCurrentUserId() { return this._get('currentUserId') },
  setCurrentUserId(id) { this._set('currentUserId', id) },
  getData(type) { const uid = this.getCurrentUserId(); return this._get(uid+'_'+type) || [] },
  setData(type, data) { const uid = this.getCurrentUserId(); this._set(uid+'_'+type, data) },

// ========== Vue App ==========
const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

const app = createApp({
  setup() {
    const todayStr = new Date().toISOString().split('T')[0];

    // Auth
    const currentUserId = ref(DB.getCurrentUserId() || null);
    const isLoggedIn = computed(() => !!currentUserId.value);
    const isRegister = ref(false);
    const authMode = ref('email');
    const authForm = ref({ email:'', password:'', confirmPwd:'', phone:'', code:'' });
    const authLoading = ref(false);
    const countdown = ref(0);

    function handleAuth() {
      try {
        const f = authForm.value;
        if (authMode.value === 'email') {
          if (!f.email || !f.password) { alert('请填写完整'); return; }
          if (isRegister.value) {
            if (f.password.length < 6) { alert('密码至少6位'); return; }
            if (f.password !== f.confirmPwd) { alert('密码不一致'); return; }
            const users = DB.getUsers();
            if (users.find(u => u.email === f.email)) { alert('邮箱已注册'); return; }
            const newId = users.length ? Math.max(...users.map(u=>u.id)) + 1 : 1;
            users.push({ id: newId, email: f.email, password: f.password, phone: null, name: '', gender: '', height: null, birthday: '', target_weight: null });
            DB.setUsers(users);
            currentUserId.value = newId;
            DB.setCurrentUserId(newId);
            alert('注册成功！');
          } else {
            const users = DB.getUsers();
            const found = users.find(u => u.email === f.email && u.password === f.password);
            if (!found) { alert('邮箱或密码错误'); return; }
            currentUserId.value = found.id;
            DB.setCurrentUserId(found.id);
            alert('登录成功！');
          }
        } else {
          if (!f.phone) { alert('请输入手机号'); return; }
          if (!f.code) { alert('请先获取验证码'); return; }
          if (f.code !== '123456') { alert('验证码错误，请重新获取'); return; }
          const users = DB.getUsers();
          const found = users.find(u => u.phone === f.phone);
          if (found) {
            currentUserId.value = found.id;
            DB.setCurrentUserId(found.id);
            alert('登录成功！');
          } else {
            const newId = users.length ? Math.max(...users.map(u=>u.id)) + 1 : 1;
            users.push({ id: newId, email: null, password: null, phone: f.phone, name: '', gender: '', height: null, birthday: '', target_weight: null });
            DB.setUsers(users);
            currentUserId.value = newId;
            DB.setCurrentUserId(newId);
            alert('注册成功！');
          }
        }
        loadAll();
      } catch(err) { alert('操作出错：' + err.message); }
    }

    function sendCode() {
      if (!authForm.value.phone) { alert('请输入手机号'); return; }
      authForm.value.code = '123456';
      alert('演示模式：验证码 123456 已自动填入');
      countdown.value = 60;
      const t = setInterval(() => { countdown.value--; if (countdown.value <= 0) clearInterval(t); }, 1000);
    }

    function logout() {
      ElementPlus.ElMessageBox.confirm('确认退出登录？','提示').then(() => {
        currentUserId.value = null; DB.setCurrentUserId(null);
        ElementPlus.ElMessage.success('已退出');
      }).catch(()=>{});

    // User

    function loadUser() {
      const users = DB.getUsers();

    const tabs = [

      { key:'exercise', label:'运动', icon: ElementPlusIconsVue.Timer },
      { key:'profile', label:'我的', icon: ElementPlusIconsVue.User },

    const currentTab = ref('home');

    // Helpers
    function bmiCat(bmi) { if(!bmi)return{text:'-',color:'#a0a0b0'}; if(bmi<18.5)return{text:'偏瘦',color:'#4fc3f7'}; if(bmi<24)return{text:'正常',color:'#00d2a0'}; if(bmi<28)return{text:'超重',color:'#ffa726'}; return{text:'肥胖',color:'#e94560'}; }
    const abRanges = {blood_sugar:[3.9,6.1],systolic:[90,140],diastolic:[60,90],cholesterol:[0,5.2],triglyceride:[0,1.7],uric_acid:[150,420]};
    function isAbnormal(f,v) { if(v==null)return false; const r=abRanges[f]; return r?(v<r[0]||v>r[1]):false; }
    function calcBmi(w,h) { return (w&&h&&h>0)?Math.round(w/((h/100)**2)*10)/10:null; }
    function latestWeight() { const recs=DB.getData('body'); if(!recs.length)return 70; return recs.sort((a,b)=>b.date.localeCompare(a.date))[0].weight||70; }

    // Dashboard
    const tips = ref(['每天喝够2L水，帮助代谢和排毒','早餐要在9点前吃，启动一天代谢','每餐先吃蔬菜，增加饱腹感再吃主食','每周至少运动3次，每次30分钟以上','睡前3小时不进食，让身体充分休息']);
    const weekChart = ref(null);
    const todayWeight = computed(() => { const r=DB.getData('body').find(x=>x.date===todayStr); return r?r.weight:null; });
    const todayIntake = computed(() => { return DB.getData('diet').filter(x=>x.date===todayStr).reduce((s,r)=>s+(r.calories||0),0).toFixed(1); });

    function renderWeekChart() {
      if(!weekChart.value)return;

        series:[{type:'line',data:last7.map(r=>r.weight),smooth:true,symbol:'circle',symbolSize:6,lineStyle:{color:'#00d2a0',width:2},itemStyle:{color:'#00d2a0'},

    function addBody() {
      if(!bodyForm.value.weight)return ElementPlus.ElMessage.warning('请输入体重');

      recs.push({...bodyForm.value, id, bmi});
      DB.setData('body',recs);
      bodyForm.value={date:todayStr,weight:null,waist:null,hip:null,thigh:null,calf:null};

      nextTick(()=>{renderTrendChart();renderWeekChart();});

        let recs=DB.getData('body').filter(r=>r.id!==id); DB.setData('body',recs);
        nextTick(renderTrendChart);
      }).catch(()=>{});
    }
    function renderTrendChart() {
      if(!trendChart.value)return;
      const recs=DB.getData('body').sort((a,b)=>a.date.localeCompare(b.date));
      const sliced=recs.slice(-trendDays.value);
      const chart=echarts.init(trendChart.value,'dark');
      chart.setOption({backgroundColor:'transparent',grid:{top:30,right:50,bottom:24,left:50},
        xAxis:{type:'category',data:sliced.map(r=>r.date),axisLabel:{fontSize:10,color:'#a0a0b0'}},
        yAxis:[{type:'value',name:'体重(kg)',axisLabel:{fontSize:10,color:'#a0a0b0'},splitLine:{lineStyle:{color:'#2a2a4a'}}},{type:'value',name:'BMI',axisLabel:{fontSize:10,color:'#a0a0b0'},splitLine:{show:false}}],
        series:[{name:'体重',type:'line',data:sliced.map(r=>r.weight),smooth:true,lineStyle:{color:'#00d2a0'},itemStyle:{color:'#00d2a0'}},{name:'BMI',type:'line',yAxisIndex:1,data:sliced.map(r=>r.bmi),smooth:true,lineStyle:{color:'#ffa726'},itemStyle:{color:'#ffa726'}}],
        tooltip:{trigger:'axis'},legend:{textStyle:{color:'#a0a0b0'},top:0}});
    }
    watch(trendDays, () => nextTick(renderTrendChart));

    // Medicine
    const medForm = ref({date:todayStr,name:'',dosage:'',time:'',note:''});
    const medRecords = computed(() => DB.getData('medicine').sort((a,b)=>b.date.localeCompare(a.date)));
    function addMed() {
      if(!medForm.value.name)return ElementPlus.ElMessage.warning('请输入药名');
      const recs=DB.getData('medicine'); const id=recs.length?Math.max(...recs.map(r=>r.id))+1:1;
      recs.push({...medForm.value,id}); DB.setData('medicine',recs);
      medForm.value={date:todayStr,name:'',dosage:'',time:'',note:''};
      ElementPlus.ElMessage.success('记录成功');
    }
    function deleteMed(id) { ElementPlus.ElMessageBox.confirm('确认删除？','提示',{type:'warning'}).then(()=>{DB.setData('medicine',DB.getData('medicine').filter(r=>r.id!==id))}).catch(()=>{}); }

    // Checkup
    const checkupForm = ref({date:todayStr,blood_sugar:null,systolic:null,diastolic:null,cholesterol:null,triglyceride:null,uric_acid:null});
    const checkupRecords = computed(() => DB.getData('checkup').sort((a,b)=>b.date.localeCompare(a.date)));
    const checkupChart = ref(null);
    function addCheckup() {
      const recs=DB.getData('checkup'); const id=recs.length?Math.max(...recs.map(r=>r.id))+1:1;
      recs.push({...checkupForm.value,id}); DB.setData('checkup',recs);
      checkupForm.value={date:todayStr,blood_sugar:null,systolic:null,diastolic:null,cholesterol:null,triglyceride:null,uric_acid:null};
      ElementPlus.ElMessage.success('记录成功');
      nextTick(renderCheckupChart);
    }
    function deleteCheckup(id) { ElementPlus.ElMessageBox.confirm('确认删除？','提示',{type:'warning'}).then(()=>{DB.setData('checkup',DB.getData('checkup').filter(r=>r.id!==id));nextTick(renderCheckupChart)}).catch(()=>{}); }
    function renderCheckupChart() {
      if(!checkupChart.value)return;
      const recs=DB.getData('checkup').sort((a,b)=>a.date.localeCompare(b.date));
      if(!recs.length)return;
      const chart=echarts.init(checkupChart.value,'dark');
      const colors=['#00d2a0','#e94560','#ffa726','#4fc3f7','#ab47bc','#78909c'];
      const fields=['blood_sugar','systolic','diastolic','cholesterol','triglyceride','uric_acid'];
      const labels=['血糖','收缩压','舒张压','胆固醇','甘油三酯','尿酸'];
      chart.setOption({backgroundColor:'transparent',grid:{top:30,right:16,bottom:24,left:40},
        xAxis:{type:'category',data:recs.map(r=>r.date),axisLabel:{fontSize:10,color:'#a0a0b0'}},
        yAxis:{type:'value',axisLabel:{fontSize:10,color:'#a0a0b0'},splitLine:{lineStyle:{color:'#2a2a4a'}}},
        series:fields.map((f,i)=>({name:labels[i],type:'line',data:recs.map(r=>r[f]),smooth:true,lineStyle:{color:colors[i]},itemStyle:{color:colors[i]}})),
        tooltip:{trigger:'axis'},legend:{textStyle:{color:'#a0a0b0',fontSize:10},top:0,itemWidth:12,itemHeight:8}});
    }

    // Diet
    const foods = FOODS;
    const activeMeals = ref(['breakfast','lunch','dinner']);
    const mealTypes = [{key:'breakfast',label:'早餐'},{key:'lunch',label:'午餐'},{key:'dinner',label:'晚餐'}];
    const dietDialogVisible = ref(false);
    const dietAddForm = ref({food_id:null,grams:100});
    const currentMeal = ref('breakfast');
    const currentMealLabel = computed(() => mealTypes.find(m=>m.key===currentMeal.value)?.label||'');
    const selectedFood = computed(() => foods.find(f=>f.id===dietAddForm.value.food_id));
    const pieChart = ref(null);

    const todayDietRecords = computed(() => DB.getData('diet').filter(r=>r.date===todayStr));
    function mealRecords(meal) { return todayDietRecords.value.filter(r=>r.meal_type===meal); }
    const dietSummary = computed(() => {
      const recs=todayDietRecords.value;
      return {total_calories:recs.reduce((s,r)=>s+(r.calories||0),0).toFixed(1),total_protein:recs.reduce((s,r)=>s+(r.protein||0),0).toFixed(1),total_fat:recs.reduce((s,r)=>s+(r.fat||0),0).toFixed(1),total_carbs:recs.reduce((s,r)=>s+(r.carbs||0),0).toFixed(1)};
    });
    function calcNut(field) { return selectedFood.value?((selectedFood.value[field]||0)*dietAddForm.value.grams/100).toFixed(1):0; }
    function openDietDialog(meal) { currentMeal.value=meal; dietAddForm.value={food_id:null,grams:100}; dietDialogVisible.value=true; }
    function addDiet() {
      if(!dietAddForm.value.food_id)return ElementPlus.ElMessage.warning('请选择食物');
      const food=selectedFood.value; const g=dietAddForm.value.grams; const ratio=g/100;
      const recs=DB.getData('diet'); const id=recs.length?Math.max(...recs.map(r=>r.id))+1:1;
      recs.push({id,date:todayStr,meal_type:currentMeal.value,food_id:food.id,food_name:food.name,grams:g,calories:Math.round(food.calories*ratio*10)/10,protein:Math.round(food.protein*ratio*10)/10,fat:Math.round(food.fat*ratio*10)/10,carbs:Math.round(food.carbs*ratio*10)/10});
      DB.setData('diet',recs); dietDialogVisible.value=false; ElementPlus.ElMessage.success('添加成功');
      nextTick(renderPieChart);
    }
    function deleteDiet(id) { ElementPlus.ElMessageBox.confirm('确认删除？','提示',{type:'warning'}).then(()=>{DB.setData('diet',DB.getData('diet').filter(r=>r.id!==id));nextTick(renderPieChart)}).catch(()=>{}); }
    function renderPieChart() {
      if(!pieChart.value)return;
      const s=dietSummary.value; if(!parseFloat(s.total_calories))return;
      const chart=echarts.init(pieChart.value,'dark');
      chart.setOption({backgroundColor:'transparent',series:[{type:'pie',radius:['50%','75%'],
        data:[{value:s.total_protein,name:'蛋白质',itemStyle:{color:'#00d2a0'}},{value:s.total_fat,name:'脂肪',itemStyle:{color:'#ffa726'}},{value:s.total_carbs,name:'碳水',itemStyle:{color:'#4fc3f7'}}],
        label:{show:false}}],tooltip:{trigger:'item',formatter:'{b}: {c}g ({d}%)'}});
    }

    // Exercise
    const exTypes = EX_TYPES;
    const exDialogVisible = ref(false);
    const exAddForm = ref({exercise_type_id:null,duration_min:30});
    const todayExRecords = computed(() => DB.getData('exercise').filter(r=>r.date===todayStr));
    const exRecords = todayExRecords;
    const exSummary = computed(() => ({total_calories_burned:todayExRecords.value.reduce((s,r)=>s+(r.calories_burned||0),0).toFixed(1)}));
    function addEx() {
      if(!exAddForm.value.exercise_type_id)return ElementPlus.ElMessage.warning('请选择运动');
      const et=exTypes.find(e=>e.id===exAddForm.value.exercise_type_id);
      const w=latestWeight(); const dur=exAddForm.value.duration_min;
      const burned=Math.round(et.met*w*(dur/60)*10)/10;
      const recs=DB.getData('exercise'); const id=recs.length?Math.max(...recs.map(r=>r.id))+1:1;
      recs.push({id,date:todayStr,exercise_type_id:et.id,exercise_name:et.name,duration_min:dur,calories_burned:burned});
      DB.setData('exercise',recs); exDialogVisible.value=false; ElementPlus.ElMessage.success('添加成功');
    }
    function deleteEx(id) { ElementPlus.ElMessageBox.confirm('确认删除？','提示',{type:'warning'}).then(()=>{DB.setData('exercise',DB.getData('exercise').filter(r=>r.id!==id))}).catch(()=>{}); }

    // Analysis
    const analysisMode = ref(false);
    const analysisPeriod = ref(30);
    const analysisWeightChart = ref(null);
    const analysisCalorieChart = ref(null);
    function loadAnalysis() {
      nextTick(() => {
        const days = analysisPeriod.value;
        const startDate = new Date(); startDate.setDate(startDate.getDate()-days+1);
        const startStr = startDate.toISOString().split('T')[0];
        const bodyRecs = DB.getData('body').filter(r=>r.date>=startStr).sort((a,b)=>a.date.localeCompare(b.date));
        const dietRecs = DB.getData('diet').filter(r=>r.date>=startStr);
        const exRecs = DB.getData('exercise').filter(r=>r.date>=startStr);
        const allDates = [...new Set([...bodyRecs.map(r=>r.date),...dietRecs.map(r=>r.date),...exRecs.map(r=>r.date)])].sort();
        const weightMap = Object.fromEntries(bodyRecs.map(r=>[r.date,r.weight]));
        const intakeMap = {}; dietRecs.forEach(r=>{intakeMap[r.date]=(intakeMap[r.date]||0)+(r.calories||0)});
        const burnMap = {}; exRecs.forEach(r=>{burnMap[r.date]=(burnMap[r.date]||0)+(r.calories_burned||0)});

        if(analysisWeightChart.value) {
          const c1=echarts.init(analysisWeightChart.value,'dark');
          c1.setOption({backgroundColor:'transparent',grid:{top:20,right:16,bottom:24,left:40},
            xAxis:{type:'category',data:allDates,axisLabel:{fontSize:10,color:'#a0a0b0'}},
            yAxis:{type:'value',axisLabel:{fontSize:10,color:'#a0a0b0'},splitLine:{lineStyle:{color:'#2a2a4a'}}},
            series:[{type:'line',data:allDates.map(d=>weightMap[d]||null),smooth:true,lineStyle:{color:'#00d2a0',width:2},itemStyle:{color:'#00d2a0'},
              areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,210,160,0.3)'},{offset:1,color:'rgba(0,210,160,0.02)'}])}}],
            tooltip:{trigger:'axis'}});
        }
        if(analysisCalorieChart.value) {
          const c2=echarts.init(analysisCalorieChart.value,'dark');
          c2.setOption({backgroundColor:'transparent',grid:{top:30,right:16,bottom:24,left:40},
            xAxis:{type:'category',data:allDates,axisLabel:{fontSize:10,color:'#a0a0b0'}},
            yAxis:{type:'value',axisLabel:{fontSize:10,color:'#a0a0b0'},splitLine:{lineStyle:{color:'#2a2a4a'}}},
            series:[{name:'摄入',type:'bar',data:allDates.map(d=>Math.round(intakeMap[d]||0)),itemStyle:{color:'#ffa726'},barWidth:'30%'},{name:'消耗',type:'bar',data:allDates.map(d=>Math.round(burnMap[d]||0)),itemStyle:{color:'#00d2a0'},barWidth:'30%'}],
            tooltip:{trigger:'axis'},legend:{textStyle:{color:'#a0a0b0'},top:0}});
        }
      });
    }
    function exportCSV(type) {
      let csv = ''; const BOM = '\uFEFF';
      if(type==='body') {
        csv = '日期,体重(kg),腰围(cm),臀围(cm),大腿围(cm),小腿围(cm),BMI\n';
        DB.getData('body').sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{csv+=`${r.date},${r.weight},${r.waist||''},${r.hip||''},${r.thigh||''},${r.calf||''},${r.bmi||''}\n`});
      } else if(type==='diet') {
        csv = '日期,餐次,食物,克数,热量(kcal),蛋白质(g),脂肪(g),碳水(g)\n';
        DB.getData('diet').sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{csv+=`${r.date},${r.meal_type},${r.food_name},${r.grams},${r.calories},${r.protein},${r.fat},${r.carbs}\n`});
      } else {
        csv = '日期,运动,时长(分钟),消耗(kcal)\n';
        DB.getData('exercise').sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{csv+=`${r.date},${r.exercise_name},${r.duration_min},${r.calories_burned}\n`});
      }
      const blob = new Blob([BOM+csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=type+'_data.csv'; a.click();
      URL.revokeObjectURL(url);
    }

    function loadAll() { loadUser(); nextTick(()=>{renderWeekChart();}); }

    onMounted(() => { if(isLoggedIn.value) loadAll(); });

    return {
      todayStr,isLoggedIn,isRegister,authMode,authForm,authLoading,countdown,handleAuth,sendCode,logout,
      tabs,currentTab,switchTab,saving,
      user,editingProfile,profileForm,startEditProfile,saveProfile,
      dash:{},tips,weekChart,todayWeight,todayIntake,todayBurned,todayDeficit,
      recordSub,bodyForm,bodyRecords,trendDays,trendChart,addBody,deleteBody,bmiCat,
      medForm,medRecords,addMed,deleteMed,
      checkupForm,checkupRecords,checkupChart,addCheckup,deleteCheckup,isAbnormal,
      foods,activeMeals,mealTypes,dietDialogVisible,dietAddForm,currentMeal,currentMealLabel,selectedFood,pieChart,mealRecords,dietSummary,calcNut,openDietDialog,addDiet,deleteDiet,
      exTypes,exRecords,exSummary,exDialogVisible,exAddForm,addEx,deleteEx,
      analysisMode,analysisPeriod,analysisWeightChart,analysisCalorieChart,loadAnalysis,exportCSV,
      nextTick,
    };
  }
});

app.use(ElementPlus);
for(const [key,component] of Object.entries(ElementPlusIconsVue)){app.component(key,component);}
try {
  app.mount('#app');
  var ld = document.getElementById('loading');
  if(ld) ld.style.display = 'none';
} catch(e) {
  var ld2 = document.getElementById('loading');
  if(ld2) ld2.innerHTML = '页面加载出错: ' + e.message;
}
</script>
</body>
