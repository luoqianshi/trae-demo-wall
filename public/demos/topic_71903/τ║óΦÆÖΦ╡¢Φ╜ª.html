<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红蒙赛车</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a15;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer { position: relative; image-rendering: pixelated; image-rendering: crisp-edges; }
        #gameCanvas {
            display: block;
            background: #1a1a2e;
            border: 4px solid #00fff5;
            box-shadow: 0 0 20px rgba(0,255,245,0.5), inset 0 0 20px rgba(0,255,245,0.1);
        }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none;
        }
        .screen { display: none; flex-direction: column; align-items: center; text-align: center; pointer-events: auto; }
        .screen.active { display: flex; }
        .title {
            font-size: 48px; color: #00fff5;
            text-shadow: 0 0 10px #00fff5, 0 0 20px #00fff5, 4px 4px 0 #e94560;
            margin-bottom: 20px; letter-spacing: 4px;
            animation: titlePulse 2s ease-in-out infinite;
        }
        @keyframes titlePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .subtitle { font-size: 16px; color: #f5a623; margin-bottom: 40px; text-shadow: 0 0 5px #f5a623; }
        .btn {
            font-family: 'Courier New', monospace; font-size: 20px; padding: 15px 40px;
            background: transparent; border: 3px solid #00fff5; color: #00fff5;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; margin: 10px;
        }
        .btn:hover { background: #00fff5; color: #1a1a2e; box-shadow: 0 0 20px #00fff5; transform: scale(1.05); }
        .instructions { font-size: 14px; color: #888; margin-top: 30px; line-height: 1.8; }
        .instructions span { color: #00ff88; }
        .instructions .warn { color: #e94560; }
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: none; justify-content: space-between;
            font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000;
        }
        #hud.active { display: flex; }
        .score-display { color: #00fff5; }
        .speed-display { color: #f5a623; }
        .battery-display { color: #00ff88; }
        .game-over-title {
            font-size: 36px; color: #e94560;
            text-shadow: 0 0 10px #e94560, 4px 4px 0 #1a1a2e;
            margin-bottom: 30px;
        }
        .game-over-title.wj {
            color: #f5a623;
            text-shadow: 0 0 10px #f5a623, 4px 4px 0 #1a1a2e;
            animation: shake 0.5s ease-in-out;
        }
        .game-over-title.dead {
            color: #4488ff;
            text-shadow: 0 0 10px #4488ff, 4px 4px 0 #1a1a2e;
        }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
        .final-score { font-size: 24px; color: #fff; margin-bottom: 10px; }
        .high-score { font-size: 18px; color: #f5a623; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="hud">
            <div class="score-display">分数: <span id="score">0</span></div>
            <div class="battery-display">电量: <span id="battery">100</span>%</div>
            <div class="speed-display">速度: <span id="speed">0</span> km/h</div>
        </div>
        <div id="ui">
            <div id="menuScreen" class="screen active">
                <div class="title">红蒙赛车</div>
                <div class="subtitle">车主睡着了！作为智能驾驶车辆！</div>
                <button class="btn" id="startBtn">开始游戏</button>
                <div class="instructions">
                    <span>← →</span> 或 <span>A D</span> 移动<br>
                    <span>↑ ↓</span> 或 <span>W S</span> 加速/减速<br>
                    躲避大米汽车，路过充电站补电！<br>
                    <span class="warn">注意：</span>长时间大幅转向会崴脚！<br>
                    <span class="warn">注意：</span>电量耗尽也会抛锚！
                </div>
            </div>
            <div id="gameOverScreen" class="screen">
                <div class="game-over-title" id="gameOverTitle">游戏结束</div>
                <div class="final-score">最终分数: <span id="finalScore">0</span></div>
                <div class="high-score">最高分: <span id="highScore">0</span></div>
                <button class="btn" id="restartBtn">再来一次</button>
            </div>
        </div>
    </div>

            return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');

        // ========== 绘制道路 ==========
        function drawRoad() {
            const isPaused = state === STATE.OVER;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            for (const s of stars) {
                if (!isPaused) {
                    s.y += s.sp * speed * 0.1;
                    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
                }
                ctx.fillRect(s.x, s.y, s.s, s.s);
            }
            ctx.fillStyle = '#12122a';
            for (let i = 0; i < W; i += 4) {
                const mh = Math.sin(i * 0.02) * 20 + Math.sin(i * 0.05) * 10 + 30;
                ctx.fillRect(i, 60 - mh * 0.3, 4, mh * 0.3);
            }
            ctx.fillStyle = '#2a2a40';
            ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);
            ctx.fillStyle = '#3a3a50';
            ctx.fillRect(ROAD_LEFT - 10, 0, 10, H);
            ctx.fillRect(ROAD_RIGHT, 0, 10, H);
            if (!isPaused) {
                roadY = (roadY + speed) % 30;
            }
            for (let j = -1; j < H / 30 + 1; j++) {
                const ly = j * 30 + roadY;
                ctx.fillStyle = '#f5a623';
                ctx.fillRect(ROAD_LEFT - 8, ly, 6, 15);
                ctx.fillRect(ROAD_RIGHT + 2, ly, 6, 15);
                ctx.fillStyle = '#222';
                ctx.fillRect(ROAD_LEFT - 8, ly + 15, 6, 15);
                ctx.fillRect(ROAD_RIGHT + 2, ly + 15, 6, 15);
            }
            ctx.fillStyle = '#ffffff';
            for (let i = 1; i < LANE_COUNT; i++) {
                const lx = ROAD_LEFT + i * LANE_W;
                for (let j = -1; j < H / 40 + 1; j++) {
                    const ly = j * 40 + roadY;
                    ctx.fillRect(lx - 2, ly, 4, 20);
                }
            }
        }

        // ========== 生成敌方车辆（密集车流） ==========
        function spawnEnemy() {
            const lane = Math.floor(Math.random() * LANE_COUNT);
            const lx = ROAD_LEFT + lane * LANE_W + LANE_W / 2 - EW / 2;
            const colors = ['#e94560', '#f5a623', '#00ff88', '#aa55ff', '#ff6633'];
            enemies.push({
                x: lx, y: -EH,
                w: EW, h: EH,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: speed * 0.4
            });
        }

        // ========== 生成充电站 ==========
        function spawnCharger() {
            // 只在左侧或右侧车道生成（lane 0 或 lane 2）
            const lane = Math.random() < 0.5 ? 0 : 2;
            const lx = ROAD_LEFT + lane * LANE_W + LANE_W / 2 - CS_W / 2;
            chargers.push({
                x: lx, y: -CS_H,
                w: CS_W, h: CS_H,
                speed: speed * 0.3
            });
        }

        // ========== 碰撞检测 ==========
        function hitTest(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // ========== 创建起火爆炸（仅碰撞用） ==========
        function createFireExplosion(cx, cy) {
            for (let i = 0; i < 40; i++) {
                fires.push({
                    x: cx + (Math.random() - 0.5) * 30,
                    y: cy + (Math.random() - 0.5) * 30,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 5 - 1,
                    life: 1, size: Math.random() * 8 + 4, type: 'fire'
                });
            }
            for (let i = 0; i < 20; i++) {
                fires.push({
                    x: cx + (Math.random() - 0.5) * 40,
                    y: cy + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 3 - 0.5,
                    life: 1, size: Math.random() * 10 + 6, type: 'smoke'
                });
            }
            for (let i = 0; i < 25; i++) {
                debris.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    life: 1,
                    color: ['#f5a623','#e94560','#ff6633','#ffcc00'][Math.floor(Math.random()*4)],
                    size: Math.random() * 5 + 2
                });
            }
            for (let i = 0; i < 15; i++) {
                sparks.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -Math.random() * 6 - 2,
                    life: 1, size: Math.random() * 3 + 1
                });
            }
        }

        // ========== 创建充电特效 ==========
        function createChargeEffect(cx, cy) {
            for (let i = 0; i < 20; i++) {
                chargeEffects.push({

                    y: cy + Math.random() * 30,

        // ========== 创建崴脚特效（不起火，只冒烟） ==========
        function createOversteerEffect(cx, cy) {
            for (let i = 0; i < 15; i++) {
                fires.push({
                    x: cx + (Math.random() - 0.5) * 30,
                    y: cy + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 2 - 0.5,
                    life: 0.8, size: Math.random() * 8 + 4, type: 'smoke'
                });
            }
            for (let i = 0; i < 10; i++) {
                sparks.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 3 - 1,
                    life: 0.6, size: Math.random() * 2 + 1
                });

        }

        // ========== 大幅转向检测 ==========
        function checkOversteer() {
            let dir = 0;
            if (keys.left) dir = -1;
            if (keys.right) dir = 1;
            if (dir !== 0) {
                if (dir === steerDir) {
                    steerFrames++;
                    if (steerFrames >= OVERSTEER_THRESHOLD) return true;
                } else {
                    steerDir = dir;
                    steerFrames = 1;
                }
            } else {
                steerFrames = 0;
                steerDir = 0;
            }
            return false;
        }

        // ========== 绘制转向警告条 ==========
        function drawSteerWarning() {
            if (steerFrames < WARNING_START || steerDir === 0) return;
            const ratio = (steerFrames - WARNING_START) / (OVERSTEER_THRESHOLD - WARNING_START);
            const alpha = 0.3 + ratio * 0.7 * (0.5 + 0.5 * Math.sin(frame * 0.5));
            const barW = 40, barH = 6;
            const bx = player.x + PW / 2 - barW / 2;
            const by = player.y - 14;
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#333';
            ctx.fillRect(bx, by, barW, barH);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = ratio > 0.7 ? '#ff2222' : '#f5a623';
            ctx.fillRect(bx, by, barW * ratio, barH);
            if (ratio > 0.5) {
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ff4444';
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('危险!', player.x + PW / 2, by - 3);
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'start';
        }

        // ========== 绘制电量条 ==========
        function drawBatteryBar() {
            const bx = player.x + PW / 2 - 20;
            const by = player.y + PH + 4;
            const bw = 40, bh = 5;
            // 背景
            ctx.fillStyle = '#333';
            ctx.fillRect(bx, by, bw, bh);
            // 电量
            const ratio = battery / 100;
            let col;
            if (ratio > 0.5) col = '#00ff88';
            else if (ratio > 0.2) col = '#f5a623';
            else col = '#ff2222';
            ctx.fillStyle = col;
            ctx.fillRect(bx, by, bw * ratio, bh);
            // 低电量闪烁
            if (ratio <= 0.2 && Math.sin(frame * 0.3) > 0) {
                ctx.fillStyle = '#ff0000';
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('低电量!', player.x + PW / 2, by + 16);
                ctx.textAlign = 'start';
            }
        }

        // ========== 更新 ==========
        function update() {
            if (state !== STATE.PLAY) return;
            frame++;

            speed = Math.min(15, 5 + frame * 0.001);

            // 电量损耗
            battery -= BATTERY_DRAIN * (speed / 5);
            if (battery <= 0) {
                battery = 0;
                reason = 'battery';
                endGame();
                return;
            }

            // 崴脚检测（不起火）
            if (checkOversteer()) {
                reason = 'oversteer';
                createOversteerEffect(player.x + PW / 2, player.y + PH / 2);
                endGame();
                return;
            }

            // 玩家移动
            if (keys.left) player.tx -= 6;
            if (keys.right) player.tx += 6;
            player.tx = Math.max(ROAD_LEFT + 5, Math.min(ROAD_RIGHT - PW - 5, player.tx));
            player.x += (player.tx - player.x) * 0.2;

            if (keys.up) speed = Math.min(15, speed + 0.1);
            if (keys.down) speed = Math.max(2, speed - 0.1);

            // 密集车流：生成间隔更短
            const rate = Math.max(15, 45 - frame * 0.01);
            if (frame % Math.floor(rate) === 0) spawnEnemy();

            // 充电站生成（每300-500帧生成一个）
            if (frame % Math.floor(300 + Math.random() * 200) === 0) spawnCharger();

            const pBox = { x: player.x, y: player.y, w: PW, h: PH };

            // 更新敌方
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += speed + e.speed;
                if (e.y > H) { enemies.splice(i, 1); score += 10; continue; }
                if (hitTest(pBox, { x: e.x, y: e.y, w: e.w, h: e.h })) {
                    reason = 'crash';
                    createFireExplosion(player.x + PW / 2, player.y + PH / 2);
                    endGame();
                    return;
                }
            }

            // 更新充电站
            for (let i = chargers.length - 1; i >= 0; i--) {
                const c = chargers[i];
                c.y += speed + c.speed;
                if (c.y > H) { chargers.splice(i, 1); continue; }
                if (hitTest(pBox, { x: c.x, y: c.y, w: c.w, h: c.h })) {
                    battery = CHARGE_AMOUNT;
                    createChargeEffect(player.x + PW / 2, player.y);
                    playChargeSound();
                    chargers.splice(i, 1);
                    score += 50;
                }
            }

            // 更新粒子
            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.x += d.vx; d.y += d.vy; d.vy += 0.3; d.life -= 0.02;
                if (d.life <= 0) debris.splice(i, 1);
            }
            for (let i = fires.length - 1; i >= 0; i--) {
                const f = fires[i];
                f.x += f.vx; f.y += f.vy;
                if (f.type === 'fire') { f.life -= 0.025; f.size *= 0.98; }
                else { f.life -= 0.008; f.size *= 1.02; }
                if (f.life <= 0) fires.splice(i, 1);
            }
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.vy += 0.15; s.life -= 0.04;
                if (s.life <= 0) sparks.splice(i, 1);
            }
            for (let i = chargeEffects.length - 1; i >= 0; i--) {
                const c = chargeEffects[i];
                c.y += c.vy; c.life -= 0.03;
                if (c.life <= 0) chargeEffects.splice(i, 1);
            }

            score += Math.floor(speed * 0.1);
            scoreEl.textContent = score;
            speedEl.textContent = Math.floor(speed * 20);
            batteryEl.textContent = Math.floor(battery);
        }

        // ========== 渲染 ==========
        function render() {
            drawRoad();

            // 充电站
            for (const c of chargers) drawCharger(c.x, c.y);

            // 敌方车辆
            for (const e of enemies) drawXiaomi(e.x, e.y, e.color);

            // 玩家
            if (state === STATE.PLAY || state === STATE.OVER) {
                drawM9(player.x, player.y);
                if (state === STATE.PLAY) drawBatteryBar();
            }

            drawSteerWarning();

            // 火焰和烟雾
            for (const f of fires) {
                ctx.globalAlpha = f.life;
                if (f.type === 'fire') {
                    if (f.life > 0.7) ctx.fillStyle = '#ffff00';
                    else if (f.life > 0.4) ctx.fillStyle = '#ff8800';
                    else ctx.fillStyle = '#cc2200';
                } else {
                    ctx.fillStyle = 'rgba(60,60,60,0.6)';
                }
                ctx.fillRect(f.x, f.y, f.size, f.size);
            }
            ctx.globalAlpha = 1;
            // 碎片
            for (const d of debris) {
                ctx.globalAlpha = d.life;
                ctx.fillStyle = d.color;
                ctx.fillRect(d.x, d.y, d.size, d.size);
            }
            ctx.globalAlpha = 1;
            // 火花
            for (const s of sparks) {
                ctx.globalAlpha = s.life;
                ctx.fillStyle = '#ffffaa';
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }
            ctx.globalAlpha = 1;
            // 充电特效（绿色上升粒子）
            for (const c of chargeEffects) {
                ctx.globalAlpha = c.life;
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(c.x, c.y, c.size, c.size);
            }
            ctx.globalAlpha = 1;
        }

        // ========== 游戏循环 ==========
        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // ========== 开始/结束 ==========
        function startGame() {
            initAudio();
            state = STATE.PLAY;
            score = 0;
            speed = 5;
            frame = 0;
            battery = 100;
            enemies = []; chargers = []; debris = []; fires = []; sparks = []; chargeEffects = [];
            reason = 'crash';
            player.x = W / 2 - PW / 2;
            player.tx = player.x;
            steerFrames = 0;
            steerDir = 0;
            menuScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            hudEl.classList.add('active');
        }

        function endGame() {
            state = STATE.OVER;
            hudEl.classList.remove('active');
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }
            finalScoreEl.textContent = score;
            highScoreEl.textContent = highScore;
            gameOverTitleEl.classList.remove('wj', 'dead');

            if (reason === 'oversteer') {
                gameOverTitleEl.textContent = '崴脚了！';
                gameOverTitleEl.classList.add('wj');
                setTimeout(() => playYaoyaoLingxian(), 300);
            } else if (reason === 'battery') {
                gameOverTitleEl.textContent = '没电抛锚了！';
                gameOverTitleEl.classList.add('dead');
            } else {
                gameOverTitleEl.textContent = '游戏结束';
            }
            setTimeout(() => { gameOverScreen.classList.add('active'); }, 800);
        }

        // ========== 事件 ==========
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
        });
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // ========== 音效系统 ==========
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playYaoyaoLingxian() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [
                { freq: 440, start: 0, dur: 0.15 },
                { freq: 554, start: 0.15, dur: 0.15 },
                { freq: 659, start: 0.3, dur: 0.15 },
                { freq: 880, start: 0.45, dur: 0.3 }
            ];
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = note.freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0, now + note.start);
                gain.gain.linearRampToValueAtTime(0.3, now + note.start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + note.start + note.dur);
                osc.start(now + note.start);
                osc.stop(now + note.start + note.dur);
            });
        }
        function playChargeSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [
                { freq: 523, start: 0, dur: 0.1 },
                { freq: 659, start: 0.1, dur: 0.1 },
                { freq: 784, start: 0.2, dur: 0.15 }
            ];
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = note.freq;
                osc.type = 'square';
                gain.gain.setValueAtTime(0, now + note.start);
                gain.gain.linearRampToValueAtTime(0.15, now + note.start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + note.start + note.dur);
                osc.start(now + note.start);
                osc.stop(now + note.start + note.dur);
            });
        }

        // ========== 初始化 ==========
        initStars();
        highScoreEl.textContent = highScore;
        requestAnimationFrame(loop);
    })();
    </script>
