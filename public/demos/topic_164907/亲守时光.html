          ]),
        ]),
        h('div', { class: 'watch-strap watch-strap--top' }),
        h('div', { class: 'watch-strap watch-strap--bottom' }),
      ]),
    ]),
    // 中间：电量条 + 状态
    h('div', { class: 'watch-info' }, [
      h('div', { class: 'watch-info-row' }, [
        h('div', { class: 'watch-battery' }, [
          h('div', { class: `watch-battery-shell ${batteryClass}` }, [
            h('div', { class: 'watch-battery-cap' }),
            h('div', { class: 'watch-battery-fill', style: { width: batteryLevel + '%' } }),
          ]),
          h('div', { class: 'watch-battery-text' }, [
            h('span', { class: 'watch-battery-num' }, [String(battery)]),
            h('span', { class: 'watch-battery-unit' }, ['%']),
          ]),
        ]),
        h('div', { class: 'watch-signal' }, [
          ...[1, 2, 3, 4].map(i => h('div', {
            class: 'watch-signal-bar' + (i <= signalBars ? ' is-on' : ''),
            style: { height: (3 + i * 2) + 'px' },
          })),
        ]),
        h('div', { class: 'watch-status', style: { color: statusColor } }, [
          h('span', { class: 'watch-status-dot', style: { background: statusColor } }),
          statusText,
        ]),
      ]),
      // 详细信息（仅子女端展开更多）
      h('div', { class: 'watch-meta' }, [
        variant === 'child'
          ? h('div', { class: 'watch-meta-line' }, [
              h('span', { class: 'watch-meta-label' }, ['型号']),
              h('span', { class: 'watch-meta-value' }, [device.model]),
            ])
          : h('div', { class: 'watch-meta-line' }, [
              h('span', { class: 'watch-meta-label' }, ['设备']),
              h('span', { class: 'watch-meta-value' }, [device.id]),
            ]),
        h('div', { class: 'watch-meta-line' }, [
          h('span', { class: 'watch-meta-label' }, ['同步']),
          h('span', { class: 'watch-meta-value' }, [
            isOffline ? '已失联 6 小时' : (typeof relativeTime === 'function' ? relativeTime(device.lastSyncAt) : formatTime(device.lastSyncAt) + ' 前'),
          ]),
        ]),
        ...(variant === 'child' ? [
          h('div', { class: 'watch-meta-line' }, [

            h('div', { class: 'watch-tags' }, [
              ...(device.functions || []).map(fn => h('span', { class: 'watch-tag' }, [fn])),

        ] : []),
      ]),
    ]),
  ]);
}

// 隐私姓名：管理端展示用，保留姓氏+性别（X先生 / X女士 / 角色）
function privateName(user) {
  if (!user) return '未知';
  const role = user.role;
  if (role === 'system' || role === 'community') return user.name || '系统';
  if (role === 'admin') return '管理员';
  const surname = (user.name || '?').slice(0, 1) || '?';
  let gender = user.gender;
  if (!gender && user.name) {
    gender = /[娟芬芳英梅兰秀莲翠敏静华丽珍燕玲花红云凤美君]/i.test(user.name) ? '女' : '男';
  }
  gender = gender || '男';
  const title = gender === '女' ? '女士' : '先生';
  return `${surname}${title}`;
}

// 简易姓名→姓氏+性别：管理端展示用，支持 user 对象 / 字符串姓名
function maskName(name) {
  if (!name) return '未知';
  if (typeof name === 'object' && name !== null) {
    return privateName(name);
  }
  const str = String(name);
  if (str === 'system') return '系统';
  const surname = str.slice(0, 1) || '?';
  const isFemale = /[娟芬芳英梅兰秀莲翠敏静华丽珍燕玲花红云凤美君]/i.test(str);
  return `${surname}${isFemale ? '女士' : '先生'}`;
}

// 文本内嵌姓名脱敏：把字符串里所有已知用户姓名替换为"X先生/女士"
function maskTextInLog(text, users) {
  if (!text) return text;
  let result = String(text);
  // 按姓名长度倒序排，避免短名先匹配导致长名残留
  const items = (users || [])
    .filter(u => u && u.name && u.name !== '系统提醒')
    .map(u => ({ name: u.name, user: u }))
    .sort((a, b) => b.name.length - a.name.length);
  items.forEach(({ name, user }) => {
    if (result.includes(name)) {
      result = result.split(name).join(maskName(user));
    }
  });
  return result;
}

// 获取特定老人今日服药任务（合并 plans + records）
// 注意：必须从 store.state 读取 records，才能响应 store 的变化
function getTodayTasks(elderId) {
  // 延迟引入避免循环依赖
  const state = storeState();
  const plans = state.plans.filter(p => p.elderId === elderId && p.status === 'active');
  const records = state.records.filter(r => r.elderId === elderId);
  const tasks = [];
  plans.forEach(plan => {
    plan.times.forEach((t, idx) => {
      const medicine = state.medicines.find(m => m.id === plan.medicineId);
      // 查找对应时间点的记录（优先按 time 字段匹配，fallback 到小时匹配）
      const record = records.find(r => r.planId === plan.id && (
        r.time === t ||
        (r.takenAt && new Date(r.takenAt).getHours() === parseInt(t.split(':')[0]))
      ));
      tasks.push({
        id: record?.id ?? `pending-${plan.id}-${idx}`,
        planId: plan.id,
        medicineId: plan.medicineId,
        medicineName: medicine?.name || '',
        indication: medicine?.indication || '',
        dosage: plan.dosage,
        time: t,
        beforeAfter: plan.beforeAfter,
        status: record?.status ?? 'pending',
        confirmType: record?.confirmType ?? null,
        takenAt: record?.takenAt ?? null,
      });
    });
  });
  return tasks.sort((a, b) => a.time.localeCompare(b.time));
}

function getStats(elderId) {
  const tasks = getTodayTasks(elderId);
  return {
    total: tasks.length,
    taken: tasks.filter(t => t.status === 'taken').length,
    missed: tasks.filter(t => t.status === 'missed').length,
    pending: tasks.filter(t => t.status === 'pending').length,
  };
}

function getUserById(id) {
  return storeState().users.find(u => u.id === id);
}

function getMedicineById(id) {
  return storeState().medicines.find(m => m.id === id);
}

// 获取特定老人的 7 天服药率
function getMedHistory(elderId) {
  const state = storeState();
  return state.medHistory.find(h => h.elderId === elderId)?.data || [];
}

// 获取全局 7 天平均服药率
function getAvgMedHistory() {
  const state = storeState();
  const all = state.medHistory;
  if (!all.length) return [];
  const days = all[0].data.length;
  const result = [];
  for (let i = 0; i < days; i++) {
    const sum = all.reduce((s, h) => s + (h.data[i] || 0), 0);
    result.push(Math.round(sum / all.length));
  }
  return result;
}

// 获取血压 / 血糖历史

  return storeState().bpHistory[elderId] || [];
}
function getGluHistory(elderId) {

}

// 工具：从 store 读取当前 state
// 通过 globalThis 注入的 store 引用（main.js 启动时设置）

  }
  // 回退：返回 mockData 快照

}

  confirmMedication(taskId, confirmType = 'click', timeSlot = null) {
    let planId, targetTime = timeSlot;

    if (typeof taskId === 'string' && taskId.startsWith('pending-')) {
      // 格式: pending-{planId}-{idx}

      };
      if (!this.state.lastLocations) this.state.lastLocations = {};
      this.state.lastLocations[elderId] = location;
    }
    const locationText = location ? `📍 位置：${location.address}（${location.lat}, ${location.lng}）` : '';

    // 通知所有绑定子女
    bindings.forEach(b => {
      this.sendMessage({
        fromId: elderId,
        toId: b.childId,
        type: 'sos',
        content: `🚨 ${elder.name} 触发 SOS 紧急求助${locationText ? '\n' + locationText : ''}`,
        location: location || undefined,
      });
    });

    // 同步通知所属社区服务人员
    let notifiedCommunityNames = [];
    if (settings.sosNotifyCommunity !== false) {
      const myCommunity = communityBindings[0]?.community;
      const matchedWorkers = communityWorkers.filter(w => w.community === myCommunity);
      matchedWorkers.forEach(w => {
        // 用 toId = 999（系统提醒）占位，因为社区人员不在 users 表中
        this.sendMessage({
          fromId: elderId,
          toId: 999,
          type: 'system',
          content: `🚨 [社区联动] ${elder.name} 触发 SOS，所属社区：${myCommunity}，请立即上门查看。${locationText ? '\n' + locationText : ''}`,
          targetType: 'community',
          targetId: w.id,
          targetName: w.name,
          targetRole: w.role,
          location: location || undefined,
        });
        notifiedCommunityNames.push(`${w.name}（${w.role}）`);
      });
    }

    // 写一条 alert 供管理后台展示
    const alertId = Math.max(0, ...(this.state.alerts || []).map(a => a.id)) + 1;
    if (!this.state.alerts) this.state.alerts = [];
    this.state.alerts.unshift({
      id: alertId,
      elderId,
      elder: elder.name,  // 保留全名以供老人端/子女端展示，admin 端在 render 时脱敏
      type: 'sos',
      level: 'critical',
      title: `${elder.name} 触发 SOS`,
      detail: `手表端 SOS 按钮被按下${locationText ? '，已上传位置' : ''}${notifiedCommunityNames.length ? '，已联动 ' + notifiedCommunityNames.join('、') : ''}`,
      location: location || undefined,
      communityNotified: notifiedCommunityNames,
      status: 'open',
      createdAt: ts,
    });
    this.notify();
    return { location, notifiedCommunityNames };
  }

  // 重置数据
  reset() {
    localStorage.removeItem(STORAGE_KEY);
    this.state = structuredClone(mockData);
    if (typeof globalThis !== 'undefined') globalThis.__qinshouLastUpdate = null;
    this.notify();
  }
}

const store = new Store();
const getState = () => store.state;

// === exports of js/store.js ===
window.QS_JS_STORE_JS = { getState, store };
})();

   合并自: js/components/overlay.js
   exports: ['confirm', 'openModal', 'toast']
   ============================================ */
(function() {
// =========================================================
// 亲守时光 Demo · 通用组件：Toast / Modal
// =========================================================

const { h } = window.QS_JS_UTILS_JS;


let toastHost = null;
function getHost() {
  if (!toastHost) toastHost = document.getElementById('toast-host');
  return toastHost;
}

function toast(msg, type = 'default', duration = 2400) {
  const host = getHost();
  if (!host) return;
  const cls = type === 'success' ? 'toast toast--success'
            : type === 'warning' ? 'toast toast--warning'
            : 'toast';
  const el = h('div', { class: cls }, [msg]);
  host.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 200ms, transform 200ms';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-8px)';
    setTimeout(() => el.remove(), 220);
  }, duration);
}

// —— Modal ——
let modalHost = null;
function getModalHost() {
  if (!modalHost) modalHost = document.getElementById('modal-host');
  return modalHost;
}

function openModal({ title, body, actions = [], className = '' }) {
  const host = getModalHost();
  host.hidden = false;
  host.innerHTML = '';
  const close = () => { host.hidden = true; host.innerHTML = ''; };
  const modal = h('div', { class: `modal ${className}`.trim() }, [
    h('div', { class: 'modal-title' }, [title || '']),
    h('div', { class: 'modal-body' }, [body || '']),
    h('div', { class: 'modal-actions' }, actions.map((a, i) =>
      h('button', {
        class: `btn ${a.variant === 'primary' ? 'btn-primary' : 'btn-ghost'}`,
        onclick: () => { a.onClick?.(close); if (a.closeOnClick !== false) close(); }
      }, [a.label])
    )),
  ]);
  // 点击背景关闭
  host.addEventListener('click', (e) => { if (e.target === host) close(); }, { once: true });
  host.appendChild(modal);
  return { close };
}

function confirm({ title, body, confirmText = '确定', cancelText = '取消', onConfirm }) {
  return openModal({
    title,
    body,
    actions: [
      { label: cancelText, variant: 'ghost', onClick: () => {} },
      {
        label: confirmText,
        variant: 'primary',
        // 延迟到外层 close 之后再触发，避免 onConfirm 链式打开的新弹窗被 close 清掉
        onClick: () => { if (onConfirm) setTimeout(onConfirm, 0); },
      },
    ],
  });
}

// === exports of js/components/overlay.js ===
window.QS_JS_COMPONENTS_OVERLAY_JS = { confirm, openModal, toast };
})();

        ]),
        children,
      ]),
      h('div', { class: 'device-label' }, [label]),
    ]),

// 报平安粒子动画
function heartBurst() {
  const host = document.getElementById('particles-host');
  if (!host) return;
  host.hidden = false;
  const hearts = ['💕', '💖', '✨', '🌸', '💗'];
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18;
    const dist = 100 + Math.random() * 80;
    const el = document.createElement('div');
    el.className = 'heart-particle';
    el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    el.style.left = '50%';
    el.style.top = '50%';
    el.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    el.style.setProperty('--dy', `${Math.sin(angle) * dist - 60}px`);
    el.style.setProperty('--rot', `${(Math.random() * 60 - 30)}deg`);
    el.style.animationDelay = `${i * 30}ms`;
    host.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
  setTimeout(() => { host.hidden = true; host.innerHTML = ''; }, 2000);
}

  const hr = Math.floor(min / 60);

  const input = document.getElementById('elder-reply-input');
  if (!input) return;
  const text = (input.value || '').trim();

    if (typeof window.QS_JS_COMPONENTS_OVERLAY_JS !== 'undefined') {
      const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;
      toast('请输入回复内容', 'warning');

  const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;
  if (!childId) {

  btn.dataset.recording = '1';
  btn.classList.add('is-recording');

  // 模拟语音识别结果池

    '我很好，你们放心',

    '记得给我买点水果',

function renderRing(rate, stats) {
  const r = 40;
  const c = 2 * Math.PI * r;
  const dash = (rate / 100) * c;
  return h('svg', { width: 96, height: 96, class: 'ring-svg' }, [
    h('circle', { cx: 48, cy: 48, r, class: 'ring-bg' }),
    h('circle', {
      cx: 48, cy: 48, r, class: 'ring-fg ring-fg--primary',
      'stroke-dasharray': `${c}`,
      'stroke-dashoffset': `${c - dash}`,
      'stroke-width': 8,
    }),
  ]);
}

function simulateElderAction(elderId) {
  const tasks = getTodayTasks(elderId);
  const pending = tasks.find(t => t.status === 'pending');
  if (!pending) {
    toast('今天已没有待服药品了', 'default');
    return;
  }
  // 传 task.id（可能是数字 record.id 或 'pending-{planId}-{idx}' 字符串）
  // 和 task.time（时间槽如 '14:00'），store 才能精确定位记录
  store.confirmMedication(pending.id, 'click', pending.time);
  // 记录本次更新的 (planId, time, takenAt)，供渲染时精确定位"刚由红转绿"的那一项
  globalThis.__qinshouLastUpdate = {
    planId: pending.planId,
    time: pending.time,
    takenAt: new Date().toISOString(),
  };
  const medicine = getMedicineById(pending.medicineId);
  // 更醒目的弹窗：使用 banner 样式提示
  showMedicationToast(medicine?.name || '药品', pending.dosage, pending.time);
  // 标记刚更新的项并滚动到
  setTimeout(() => {
    const el = document.querySelector('.timeline-item.is-just-updated');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 150);
}

// 醒目的服药完成弹窗（替代普通 toast）
function showMedicationToast(name, dosage, time) {
  // 找下一个待服的
  const state = getState();
  let nextText = '';
  if (state) {
    const next = getTodayTasks(state.currentElderId || 1).find(t => t.status === 'pending');
    if (next) {
      const m = getMedicineById(next.medicineId);
      nextText = `下一项 ${next.time} · ${m?.name || ''} ${next.dosage}`;
    } else {
      nextText = '今日药品已全部完成 ✓';
    }
  }
  // 移除已有
  document.querySelectorAll('.medication-toast').forEach(el => el.remove());
  const el = h('div', { class: 'medication-toast' }, [
    h('div', { class: 'medication-toast-icon' }, ['✓']),
    h('div', { class: 'medication-toast-body' }, [
      h('div', { class: 'medication-toast-title' }, [
        `${time} · ${name} ${dosage} 已记录`,
      ]),
      h('div', { class: 'medication-toast-sub' }, [nextText]),
    ]),
  ]);
  document.body.appendChild(el);
  // 入场动画
  requestAnimationFrame(() => el.classList.add('is-visible'));
  // 3.5s 后淡出移除
  setTimeout(() => {
    el.classList.remove('is-visible');
    setTimeout(() => el.remove(), 400);
  }, 3500);
}

function renderDateBadge(visitTime) {

function onMarkComplete(v) {

(function() {
// =========================================================
// 亲守时光 Demo · 子女端 - 配药管理
// =========================================================

const { h, formatDate } = window.QS_JS_UTILS_JS;

const { getState, store } = window.QS_JS_STORE_JS;

const { getMedicineById } = window.QS_JS_MOCK_JS;

const { toast, openModal, confirm } = window.QS_JS_COMPONENTS_OVERLAY_JS;


// 添加药品免责声明（"其他"输入新药品前的前置确认）
function confirmMedicineDisclaimer(onAgree) {
  confirm({
    title: '⚠️ 添加药品免责声明',
    body: h('div', { style: { fontSize: '14px', lineHeight: 1.7, color: 'var(--color-text)' } }, [
      h('div', { style: {
        padding: '10px 14px', marginBottom: '12px',
        background: 'rgba(184,61,42,0.08)', borderLeft: '4px solid var(--color-warning)',

      } }, ['为保障老人用药安全，请仔细阅读：']),
      h('div', { style: { marginBottom: '8px' } }, [
        '• ',
        h('strong', {}, ['请勿添加']),
        '处方外、非正式渠道购买或效果未知的药物。',
      ]),
      h('div', { style: { marginBottom: '8px' } }, [
        '• ',
        h('strong', {}, ['请勿添加']),
        '无国家药品监督管理局批准文号的药品。',
      ]),
      h('div', { style: { marginBottom: '8px' } }, [
        '• 老人用药前请务必咨询专业医生或药师，并按医嘱服用。',
      ]),
      h('div', { style: {
        marginTop: '14px', padding: '8px 12px',
        background: 'var(--color-bg-soft)', borderRadius: '6px',
        fontSize: '12px', color: 'var(--color-text-muted)',
      } }, [
        h('strong', { style: { color: 'var(--color-warning)' } }, ['特别提示：']),
        '若违反上述约定添加药品，由此产生的一切后果，',
        h('strong', {}, ['本平台不负任何责任']),
        '。',
      ]),
    ]),
    confirmText: '我已阅读并同意',
    cancelText: '取消',
    onConfirm: () => onAgree && onAgree(),
  });
}


function renderChildRefill() {
  const state = getState();
  const elderId = state.currentElderId || 1;
  const refills = state.refills
    .filter(r => r.elderId === elderId)
    .sort((a, b) => a.daysLeft - b.daysLeft); // 余量最少排前面
  // 按 medicineId 分组：只要同种药品任一药房库存 >= 3 天，就视为库存充足（消除低库存报警）
  const maxDaysByMed = refills.reduce((acc, r) => {
    acc[r.medicineId] = Math.max(acc[r.medicineId] || 0, r.daysLeft || 0);
    return acc;
  }, {});
  const lowStockMeds = new Set(
    Object.entries(maxDaysByMed)
      .filter(([, d]) => d < 3)
      .map(([id]) => Number(id))
  );
  const lowStock = refills.filter(r => lowStockMeds.has(r.medicineId));
  const total = refills.length;

  return h('div', { class: 'child-app page-enter' }, [
    // 顶部
    h('div', { class: 'child-header' }, [
      h('div', {}, [
        h('div', { class: 'child-elder-name' }, ['配药管理']),
        h('div', { class: 'child-elder-meta' }, [
          h('span', {}, [`共 ${total} 种药品`]),
          lowStock.length > 0
            ? h('span', { style: { color: 'var(--color-warning)' } }, [` · ⚠ ${lowStock.length} 种即将用完`])
            : h('span', { style: { color: 'var(--color-success)' } }, [' · ✓ 库存充足']),
        ]),
      ]),
      h('button', { class: 'btn btn-primary', onclick: () => confirmMedicineDisclaimer(() => openRefillEditor()) }, ['+ 新增']),
    ]),

    // 库存预警条（仅在有低库存药品时显示）
    lowStock.length > 0
      ? h('div', { class: 'alert-banner', style: { margin: '0 20px 12px' } }, [
          h('div', { class: 'alert-banner-text' }, [
            h('strong', {}, ['⚠ 补药提醒']),
            h('small', {}, [
              '以下药品即将用完,建议尽快补充：',
              [...new Set(lowStock.map(r => getMedicineById(r.medicineId)?.name).filter(Boolean))].join('、'),
            ]),
          ]),
          h('button', {
            class: 'alert-banner-close',
            onclick: () => toast('已通知药房备货', 'success'),
          }, ['✕']),
        ])
      : null,

    // 配药列表
    h('div', { class: 'section-title' }, ['配药记录']),
    h('div', { style: { padding: '0 20px' } }, [
      ...(refills.length === 0
        ? [h('div', { class: 'text-muted', style: { textAlign: 'center', padding: '40px 0' } }, ['暂无配药记录'])]
        : refills.map(r => {
            const m = getMedicineById(r.medicineId);
            // 是否低库存：以"按药品分组后是否所有药房都 < 3 天"为准
            // 只要该 medicineId 进入了 lowStockMeds（即所有药房 max<3），才显示感叹号
            const isLow = lowStockMeds.has(r.medicineId);
            return h('div', {
              class: 'card',
              style: {
                marginBottom: '12px',
                borderColor: isLow ? 'var(--color-warning)' : 'var(--color-border)',
              },
            }, [
              h('div', { class: 'flex', style: { alignItems: 'center', gap: '12px' } }, [
                h('div', { style: {
                  width: '44px', height: '44px', borderRadius: '12px',
                  background: isLow ? 'var(--color-warning-soft, rgba(184,61,42,0.12))' : 'var(--color-secondary-tint)',
                  color: isLow ? 'var(--color-warning)' : 'var(--color-secondary)',
                  display: 'grid', placeItems: 'center', fontSize: '22px', flexShrink: 0,
                } }, [isLow ? '⚠️' : '💊']),
                h('div', { style: { flex: 1, minWidth: 0 } }, [
                  h('div', { style: { fontWeight: 600, fontSize: '15px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, [
                    m?.name || '未知药品',
                  ]),
                  h('div', { class: 'text-muted', style: { fontSize: '12px', marginTop: '2px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, [
                    `${r.quantity} 片/丸 · ${r.pharmacy}`,
                  ]),
                  h('div', { class: 'text-muted', style: { fontSize: '12px', marginTop: '2px' } }, [
                    `配药日期：${formatDate(r.refillDate)}`,
                  ]),
                ]),
                h('div', { style: { textAlign: 'right', flexShrink: 0 } }, [
                  h('div', { style: {
                    fontSize: '22px', fontWeight: 700, lineHeight: 1.1,
                    color: isLow ? 'var(--color-warning)' : 'var(--color-success)',
                    fontFamily: 'var(--font-serif)',
                  } }, [String(r.daysLeft)]),
                  h('div', { style: { fontSize: '11px', color: 'var(--color-text-muted)', whiteSpace: 'nowrap' } }, [
                    isLow ? '天即将用完' : '天剩余',
                  ]),
                ]),
              ]),
            ]);
          })
      ),
    ]),
  ]);
}

function openRefillEditor() {
  const state = getState();
  const medicines = state.medicines;

  let selectedMedicineId = medicines[0]?.id;
  let quantity = 30;
  let pharmacy = '海王星辰（苏州街店）';
  // 自定义新药品（选择"其他"时）
  let isCustomMedicine = false;
  let customName = '';
  let customSpec = '';

  function save() {
    const elderId = state.currentElderId || 1;
    // 若选了"其他"且填写了新药品，先创建药品记录
    if (isCustomMedicine) {
      const name = (customName || '').trim();
      const spec = (customSpec || '').trim();
      if (!name) { toast('请输入新药品名称', 'warning'); return; }
      const created = store.upsertMedicine({
        name, spec, category: '西药', form: '其他',
      });
      if (!created) { toast('创建新药品失败', 'warning'); return; }
      selectedMedicineId = created.id;
      toast(`已新增药品：${created.name}`, 'success');
    }
    const samePharmacy = state.refills.some(
      r => r.elderId === elderId && r.medicineId === selectedMedicineId && r.pharmacy === pharmacy
    );
    const sameMedDifferentPharmacy = state.refills.some(
      r => r.elderId === elderId && r.medicineId === selectedMedicineId && r.pharmacy !== pharmacy
    );
    store.addRefill({
      medicineId: selectedMedicineId,
      quantity: quantity,
      pharmacy: pharmacy,
      refillDate: new Date().toISOString().slice(0, 10),
      daysLeft: Math.floor(quantity / 1.5),
    });
    const medName = medicines.find(m => m.id === selectedMedicineId)?.name || customName || '药品';
    if (samePharmacy) {
      toast(`已合并 ${medName}（${pharmacy}）：库存自动累加`, 'success');
    } else if (sameMedDifferentPharmacy) {
      toast(`已新增 ${medName}（${pharmacy}）：保留独立记录，多药房库存任一充足即可消除低库存报警`, 'success');
    } else {
      toast('已记录配药信息', 'success');
    }
  }

  openModal({
    title: '新增配药记录',
    body: h('div', { style: { minWidth: '300px' } }, [
      h('div', { style: { marginBottom: '12px' } }, [
        h('div', { style: { fontSize: '12px', color: 'var(--color-text-muted)', marginBottom: '4px' } }, ['药品']),
        h('select', {
          id: 'refill-medicine-select',
          class: 'data-table-search', style: { width: '100%', padding: '8px 12px' },
          onchange: (e) => {
            const v = e.target.value;
            if (v === '__other') {
              isCustomMedicine = true;
              const box = document.getElementById('refill-custom-medicine-box');
              if (box) box.style.display = 'block';
            } else {
              isCustomMedicine = false;
              selectedMedicineId = parseInt(v, 10);
              const box = document.getElementById('refill-custom-medicine-box');
              if (box) box.style.display = 'none';
            }
          }
        }, [
          ...medicines.map(m => h('option', { value: m.id, selected: m.id === selectedMedicineId }, [m.name])),
          h('option', { value: '__other' }, ['➕ 其他（输入新药品）…']),

(function() {
// =========================================================
// 亲守时光 Demo · 子女端 - 消息中心

const { h, relativeTime } = window.QS_JS_UTILS_JS;

const { getState, store } = window.QS_JS_STORE_JS;

const { getUserById } = window.QS_JS_MOCK_JS;

const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;


function renderChildMessages() {
  const state = getState();
  const childId = state.currentChildId || 4;
  const elderId = state.currentElderId || 1;

  // 子女发给老人的 + 老人发给子女的 + 系统发给子女的提醒
  const messages = state.messages.filter(m =>
    (m.fromId === childId && m.toId === elderId) ||
    (m.fromId === elderId && m.toId === childId) ||
    (m.type === 'system' && m.toId === childId)
  ).slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

  const elder = getUserById(elderId);

  return h('div', { class: 'child-app page-enter' }, [
    h('div', { class: 'child-header' }, [
      h('div', {}, [
        h('div', { class: 'child-elder-name' }, ['与 ', h('span', { style: { color: 'var(--color-primary)' } }, [elder.name]), ' 的对话']),
        h('div', { class: 'child-elder-meta' }, [
          h('span', {}, [`共 ${messages.length} 条消息`]),
        ]),
      ]),
    ]),

    h('div', { class: 'child-conversation' }, [
      messages.length === 0
        ? h('div', { class: 'text-muted', style: { textAlign: 'center', padding: '40px 0' } }, ['暂无对话，发送一条消息吧'])
        : messages.map(m => {
            // 系统消息（如配药提醒）：居中、无头像、显示"系统提醒"
            if (m.type === 'system') {
              return h('div', { class: 'message-system' }, [
                h('div', { class: 'message-system-bubble' }, [
                  h('div', { class: 'message-system-from' }, ['🔔 系统提醒']),
                  h('div', {}, [m.content]),
                  h('div', { class: 'message-system-time' }, [relativeTime(m.createdAt)]),
                ]),
              ]);
            }
            const from = getUserById(m.fromId);
            const isMine = m.fromId === childId;
            return h('div', { style: {
              display: 'flex', gap: '10px', marginBottom: '16px',
              flexDirection: isMine ? 'row-reverse' : 'row',
            } }, [
              h('div', { class: `avatar avatar-sm ${isMine ? '' : ''}`, style: {
                background: isMine ? 'var(--color-secondary)' : 'var(--color-primary-tint)',
                color: isMine ? 'white' : 'var(--color-primary)',
              } }, [from?.avatar || '?']),
              h('div', { style: {
                background: isMine ? 'var(--color-primary)' : 'var(--color-bg-elevated)',
                color: isMine ? 'white' : 'var(--color-text)',
                borderRadius: '16px',
                padding: '10px 14px',
                maxWidth: '70%',
                fontSize: '14px',
                lineHeight: 1.5,
                boxShadow: 'var(--shadow-xs)',
                border: isMine ? 'none' : '1px solid var(--color-border)',
              } }, [
                h('div', {}, [m.type === 'voice' ? '🎤 ' + m.content : m.content]),
                h('div', { style: {
                  fontSize: '11px', marginTop: '4px',
                  opacity: 0.6, textAlign: 'right'
                } }, [relativeTime(m.createdAt)]),
              ]),
            ]);
          }),
    ]),

    // 底部回复输入框
    h('div', { class: 'reply-bar' }, [
      h('input', {
        class: 'reply-input',
        type: 'text',
        id: 'child-msg-input',
        placeholder: `给 ${elder.name} 留言…`,
        onkeydown: (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            onSend(childId, elderId);
          }
        },
      }),
      h('button', {
        class: 'btn btn-primary reply-send',
        onclick: () => onSend(childId, elderId),
      }, ['发送']),
    ]),
  ]);
}

function onSend(fromId, toId) {
  const input = document.getElementById('child-msg-input');
  if (!input) return;
  const text = (input.value || '').trim();
  if (!text) {
    toast('请输入消息内容', 'warning');
    input.focus();
    return;
  }
  store.sendMessage({ fromId, toId, type: 'text', content: text });
  input.value = '';
  toast('消息已发送', 'success');
  // store 订阅会自动重渲；重渲后滚到最底部，让新消息可见
  if (typeof globalThis.__qinshouRender === 'function') {
    // 让主 render() 跑完，再找对话流容器滚到底
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const el = document.querySelector('.child-conversation');
      if (el) el.scrollTop = el.scrollHeight;
    }));
  }
}

// === exports of js/pages/child/messages.js ===
window.QS_JS_PAGES_CHILD_MESSAGES_JS = { renderChildMessages };

function setupVisitCharts() {
  if (typeof window.echarts === 'undefined') return;
  chartInstances.forEach(c => c.dispose && c.dispose());
  chartInstances = [];

  const state = getState();
  const visits = state.visits || [];

  // 医院分布
  const hospitalCount = {};
  visits.forEach(v => { hospitalCount[v.hospital] = (hospitalCount[v.hospital] || 0) + 1; });
  const topHospitals = Object.entries(hospitalCount).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const barDom = document.getElementById('chart-hospital-bar');
  if (barDom) {
    const bar = window.echarts.init(barDom);
    bar.setOption({
      grid: { left: 100, right: 30, top: 20, bottom: 30 },
      xAxis: { type: 'value', axisLine: { lineStyle: { color: '#D4C8B0' } }, splitLine: { lineStyle: { color: '#F0E8D8' } } },
      yAxis: { type: 'category', data: topHospitals.map(item => item[0]).reverse(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#5A4A3A', fontSize: 11 } },
      series: [{
        type: 'bar',
        data: topHospitals.map(item => item[1]).reverse(),
        itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#4A6B5D' }, { offset: 1, color: '#6B8B7D' }] }, borderRadius: [0, 4, 4, 0] },
        label: { show: true, position: 'right', color: '#5A4A3A', fontSize: 12 },
      }],
    });
    chartInstances.push(bar);
  }

  // 科室分布
  const deptCount = {};
  visits.forEach(v => { deptCount[v.department] = (deptCount[v.department] || 0) + 1; });
  const pieData = Object.entries(deptCount).map(([k, v]) => ({ name: k, value: v }));

  const pieDom = document.getElementById('chart-dept-pie');
  if (pieDom) {
    const pie = window.echarts.init(pieDom);
    pie.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} 次 ({d}%)' },
      legend: { bottom: 0, textStyle: { color: '#5A4A3A', fontSize: 11 } },
      series: [{
        type: 'pie',
        radius: ['45%', '70%'],
        center: ['50%', '45%'],
        avoidLabelOverlap: true,
        itemStyle: { borderRadius: 6, borderColor: '#FAF3E7', borderWidth: 2 },
        label: { show: false },
        emphasis: { label: { show: true, fontSize: 13, fontWeight: 600 } },
        data: pieData,
      }],
      color: ['#4A6B5D', '#C8553D', '#D4A574', '#8B9DAF', '#B83D2A', '#6B8B7D'],
    });
    chartInstances.push(pie);
  }
}

                  h('td', { class: 'text-muted' }, [formatTime(m.createdAt)]),

                      m.status === 'unread' ? '未读' : '已读',

function kpiCard(icon, label, value, unit, color) {
  return h('div', { class: `kpi-card ${color ? `kpi-card--${color}` : ''}` }, [
    h('div', { class: 'kpi-icon' }, [icon]),
    h('div', { class: 'kpi-body' }, [

        h('span', {}, [String(value)]),
        h('small', {}, [unit]),

    ]),
  ]);
}

function typeIcon(type) {
  return ({ text: '💬', voice: '🎙️', photo: '📷' }[type] || '📝');
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) {
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function openSystemNotificationList(group) {

}

/* ============================================

(function() {
// =========================================================
// 亲守时光 Demo · 管理后台 - 公告管理

        h('div', { class: 'admin-page-desc' }, ['系统公告编辑、发布与撤回']),
      ]),
      h('div', { class: 'header-actions' }, [
        h('button', { class: 'btn btn--primary', onclick: () => openAnnouncementEditor(null) }, ['+ 新建公告']),

    h('div', { class: 'kpi-grid' }, [

      kpiCard('👁️', '总曝光', Math.round(published.length * 168), '次', 'info', '估算值'),
      kpiCard('💬', '总评论', Math.round(published.length * 23), '条', 'primary', '估算值'),

    // 已发布公告
    h('div', { class: 'chart-card' }, [
      h('div', { class: 'chart-title' }, [

      ]),
      published.length > 0
        ? h('div', { class: 'announcement-list' }, [
            ...published.map(a => h('div', { class: 'announcement-item' }, [
              h('div', { class: 'announcement-icon' }, ['📢']),
              h('div', { class: 'announcement-body' }, [
                h('div', { class: 'announcement-title' }, [a.title]),

function kpiCard(icon, label, value, unit, color, sub) {

function onChangeStatus(id, status) {

  const a = state.announcements.find(x => x.id === id);
  if (a) {
    a.status = status;
    if (typeof globalThis.__qinshouStore !== 'undefined') globalThis.__qinshouStore.notify();
    toast(status === 'published' ? '已发布' : '已撤回', 'success');
  }
}

function onDelete(id) {
  if (confirm('确定删除此公告吗？')) {
    const state = getState();
    const idx = state.announcements.findIndex(a => a.id === id);
    if (idx >= 0) {
      state.announcements.splice(idx, 1);
      if (typeof globalThis.__qinshouStore !== 'undefined') globalThis.__qinshouStore.notify();
      toast('已删除', 'success');
    }
  }
}

function openAnnouncementEditor(a) {
  const state = getState();
  const isEdit = !!a;
  // 初始值 — 编辑时把原始内容预填到表单
  const initTitle = a?.title ?? '';
  const initContent = a?.content ?? '';
  const initStatus = a?.status ?? 'draft';

  const inputStyle = { width: '100%', padding: '8px 12px', border: '1px solid var(--color-border)', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', background: 'white' };

  const titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.value = initTitle;
  titleInput.placeholder = '请输入公告标题';
  titleInput.style.cssText = inputStyle;
  titleInput.id = 'ann-title';

  const contentArea = document.createElement('textarea');
  contentArea.value = initContent;
  contentArea.rows = 14;
  contentArea.placeholder = '请输入公告内容';
  contentArea.style.cssText = inputStyle;
  contentArea.id = 'ann-content';
  contentArea.style.minHeight = '320px';
  contentArea.style.resize = 'none';
  contentArea.style.lineHeight = '1.7';

  const statusSelect = document.createElement('select');
  statusSelect.style.cssText = inputStyle;
  statusSelect.id = 'ann-status';
  ['draft', 'published'].forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s === 'draft' ? '📝 草稿' : '📢 已发布';
    if (s === initStatus) opt.selected = true;
    statusSelect.appendChild(opt);
  });

  const body = h('div', { style: { width: '100%' } }, [
    h('div', { style: { marginBottom: '16px' } }, [
      h('div', { style: { fontSize: '12px', color: 'var(--color-text-muted)', marginBottom: '6px' } }, ['标题 *']),
      titleInput,
    ]),
    h('div', { style: { marginBottom: '16px' } }, [
      h('div', { style: { fontSize: '12px', color: 'var(--color-text-muted)', marginBottom: '6px' } }, ['内容 *']),
      contentArea,
    ]),
    h('div', { style: { marginBottom: '16px' } }, [
      h('div', { style: { fontSize: '12px', color: 'var(--color-text-muted)', marginBottom: '6px' } }, ['状态']),
      statusSelect,
    ]),
  ]);

  openModal({
    title: isEdit ? `编辑公告：${a.title}` : '新建公告',
    body,
    className: 'modal--wide',
    actions: [
      { label: '取消', variant: 'ghost' },
      {
        label: '保存', variant: 'primary',
        onClick: () => {
          // 直接从 DOM 读取最新值，避免闭包变量与输入不同步
          const titleEl = document.getElementById('ann-title');
          const contentEl = document.getElementById('ann-content');
          const statusEl = document.getElementById('ann-status');
          const title = titleEl?.value ?? '';
          const content = contentEl?.value ?? '';
          const status = statusEl?.value ?? 'draft';
          if (!title.trim()) { toast('请输入标题', 'warning'); return; }
          if (a) {
            // 编辑模式：保留 ID、publisher、createdAt 等其它字段，仅更新内容
            a.title = title;
            a.content = content;
            a.status = status;
            a.updatedAt = new Date().toISOString().slice(0, 10);
          } else {
            const newId = Math.max(0, ...state.announcements.map(x => x.id)) + 1;
            state.announcements.push({
              id: newId, title, content, status,
              publisher: '孙志强',
              createdAt: new Date().toISOString().slice(0, 10),
            });

          if (typeof globalThis.__qinshouStore !== 'undefined') globalThis.__qinshouStore.notify();
          toast(isEdit ? '已更新' : '已创建', 'success');
        },
      },
    ],
  });
}

// === exports of js/pages/admin/announcements.js ===

(function() {
// =========================================================
// 亲守时光 Demo · 管理后台 - 告警监控

const { h, privateName, maskName, maskTextInLog } = window.QS_JS_UTILS_JS;

const { getState, store } = window.QS_JS_STORE_JS;

const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;


function renderAdminAlerts() {
  const state = getState();
  const allAlerts = (state.alerts || []).slice();
  const pendingAlerts = allAlerts
    .filter(a => !a.handled)
    .sort((a, b) => new Date(b.time || b.createdAt) - new Date(a.time || a.createdAt));
  const handledAlerts = allAlerts
    .filter(a => a.handled)
    .sort((a, b) => new Date(b.handledAt || b.time || b.createdAt) - new Date(a.handledAt || a.time || a.createdAt));
  const users = state.users || [];
  const bindings = state.bindings || [];

  const byLevel = {
    urgent: pendingAlerts.filter(a => a.level === 'urgent' || a.level === 'critical'),
    warning: pendingAlerts.filter(a => a.level === 'warning'),
  };
  const byType = {};
  pendingAlerts.forEach(a => { byType[a.type] = (byType[a.type] || 0) + 1; });

  // 查找某位老人名下的主联系子女
  function findChildNameByElderId(elderId) {
    if (!elderId) return null;
    const elderBindings = bindings.filter(b => b.elderId === elderId);
    const primary = elderBindings.find(b => b.primary) || elderBindings[0];
    if (!primary) return null;
    const child = users.find(u => u.id === primary.childId);
    return child ? child.name : null;
  }

  // 渲染单条告警（不分组）
  function renderAlertItem(a, mode) {
    const typeInfo = {
      'missed-medication': { icon: '💊', label: '漏服检测', cls: 'warning' },
      'low-stock':         { icon: '📦', label: '低库存',   cls: 'warning' },
      'sos':               { icon: '🚨', label: 'SOS 紧急', cls: 'urgent'  },
      'inactive':          { icon: '😴', label: '长期未活动', cls: 'warning' },
    }[a.type] || { icon: '📢', label: a.type, cls: 'normal' };
    return h('div', { class: `alert-item alert-item--${typeInfo.cls}${mode === 'handled' ? ' alert-item--handled' : ''}` }, [
      h('div', { class: 'alert-icon' }, [typeInfo.icon]),
      h('div', { class: 'alert-body' }, [
        h('div', { class: 'alert-header' }, [
          h('span', { class: `alert-type alert-type--${typeInfo.cls}` }, [typeInfo.label]),
          h('span', { class: 'alert-time' }, [formatTime(a.time || a.createdAt)]),
        ]),
        h('div', { class: 'alert-elder' }, [
          '👴 ', maskName(a.elder),
          a.notified ? h('span', { class: 'alert-notified' }, [`  · 已通知 ${maskName(a.notified)}`]) : null,
        ]),
        h('div', { class: 'alert-detail' }, [maskTextInLog(a.detail, users)]),
        mode === 'handled' && a.handledAt
          ? h('div', { class: 'alert-handled-time' }, [`✓ 已处理 · ${formatTime(a.handledAt)}`])
          : null,
      ]),
      h('div', { class: 'alert-actions' }, [
        mode === 'pending'
          ? h('button', {
              class: 'btn-mini',
              onclick: () => {

        h('button', {

      ]),

    // KPI
    h('div', { class: 'kpi-grid' }, [
      kpiCard('🚨', '紧急告警', byLevel.urgent.length, '条', 'danger'),
      kpiCard('⚠️', '警告', byLevel.warning.length, '条', 'warning'),
      kpiCard('📞', '已通知家属', allAlerts.filter(a => a.notified).length, '人次', 'success'),
      kpiCard('⏰', '本周告警', allAlerts.length, '条', 'info'),
    ]),

    // 实时告警流 - 分为未处理 / 已处理
    h('div', { class: 'chart-card' }, [
      h('div', { class: 'chart-title' }, [
        h('span', {}, ['📡 告警流']),
        h('span', { class: 'chart-title-meta' }, [
          `未处理 ${pendingAlerts.length} · 已处理 ${handledAlerts.length} · 按时间倒序`,

      // 未处理分区
      h('div', { class: 'alert-section' }, [
        h('div', { class: 'alert-section-header' }, [
          h('span', { class: 'alert-section-title' }, ['🟠 未处理']),

            ])

      ]),

      // 已处理分区
      h('div', { class: 'alert-section' }, [
        h('div', { class: 'alert-section-header' }, [
          h('span', { class: 'alert-section-title' }, ['🟢 已处理']),
          h('span', { class: 'alert-section-count' }, [`${handledAlerts.length} 条`]),
        ]),
        handledAlerts.length > 0
          ? h('div', { class: 'alert-list' }, [
              ...handledAlerts.map(a => renderAlertItem(a, 'handled')),
            ])

      ]),

      h('div', {
        style: {
          marginTop: '12px', padding: '8px 12px',
          background: 'var(--color-bg-soft)', borderRadius: 'var(--radius-sm)',

// 手表 SOS：模拟 3 秒倒计时
function onWatchSOS(elder) {
  const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;
  toast('SOS 求助中…再按 3 秒发送', 'warning');
  setTimeout(() => {
    store.confirmSOS(elder.id);
    toast('🚨 已向所有紧急联系人发送 SOS 求助', 'success');
  }, 3000);
}

// 一键呼叫：弹个 toast
function onWatchCall(contact, elder) {
  const { toast } = window.QS_JS_COMPONENTS_OVERLAY_JS;
  if (!contact) {
    toast('暂未绑定主联系人', 'warning');
    return;
  }
  toast(`📞 正在呼叫 ${contact.name}（${contact.relation || '家人'}）…`, 'default');
  setTimeout(() => {
    toast(`通话结束：与 ${contact.name} 通话 32 秒`, 'success');
  }, 1500);
}

// 每秒更新一次时间
let _watchClockTimer = null;
function startWatchClock() {
  if (_watchClockTimer) return;
  _watchClockTimer = setInterval(() => {
    const el = document.getElementById('w-clock-hm');
    if (!el) return;
    const d = new Date();
    el.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }, 1000);
}
function stopWatchClock() {
  if (_watchClockTimer) {
    clearInterval(_watchClockTimer);
    _watchClockTimer = null;
  }
}

// === exports of js/pages/watch/home.js ===
window.QS_JS_PAGES_WATCH_HOME_JS = { renderWatchHome, startWatchClock, stopWatchClock };
})();

(function() {

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  tabs.forEach(t => {

}

function updateTime() {
  const d = new Date();
  const date = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (metaTime) metaTime.textContent = `${date}  ${time}`;
}

// —— 顶部用户身份 ——
function updateUser() {
  const map = {
    overview: '访客 · 演示模式',
    elder: '张女士（72岁）· 老人端',
    child: '陈女士（42岁）· 子女端',
    watch: '张女士（72岁）· 手表端',
    admin: '孙先生（35岁）· 管理员',
  };
  if (metaUser) metaUser.textContent = map[currentRole] || '';
}

// —— 主渲染 ——
function render() {
  updateTime();
  updateUser();
  stage.innerHTML = '';
  stage.classList.add('page-enter');
  // 暴露给其他 IIFE 触发 re-render
  globalThis.__qinshouRender = render;

  let content;
  if (currentRole === 'overview') {
    content = renderOverview();
  } else if (currentRole === 'elder') {
    content = renderElder();
  } else if (currentRole === 'child') {
    content = renderChild();
  } else if (currentRole === 'watch') {
    content = renderWatch();
    // 启动 / 停止手表时钟
    const { startWatchClock, stopWatchClock } = window.QS_JS_PAGES_WATCH_HOME_JS || {};
    if (content) { if (startWatchClock) startWatchClock(); }
    else { if (stopWatchClock) stopWatchClock(); }
  } else if (currentRole === 'admin') {
    content = renderAdmin();
  }
  stage.appendChild(content);
  // 触发图表初始化
  if (currentRole === 'admin' && adminTab === 'overview') {
    requestAnimationFrame(setupCharts);
  } else if (currentRole === 'admin' && adminTab === 'med-stats') {
    requestAnimationFrame(setupMedChart);
  } else if (currentRole === 'admin' && adminTab === 'refill-stats') {
    requestAnimationFrame(setupRefillCharts);
  } else if (currentRole === 'admin' && adminTab === 'visit-stats') {
    requestAnimationFrame(setupVisitCharts);
  }
}

function renderElder() {
  let body;
  if (elderTab === 'home') body = renderElderHome();
  else if (elderTab === 'records') body = renderElderRecords();
  else if (elderTab === 'plans') body = renderElderPlans();
  else if (elderTab === 'messages') body = renderElderMessages();
  else body = renderElderHome();

  return h('div', {}, [
    phoneFrame({
      label: '亲守时光 · 老人端 / WeChat MiniApp',
      children: h('div', { style: { display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' } }, [
        h('div', { style: { flex: 1, overflow: 'auto' } }, [body]),
        renderElderTabbar(),
      ]),
    }),
  ]);
}

function renderElderTabbar() {
  return h('div', { class: 'elder-tabbar' }, [
    tabBtn('🏠', '首页', elderTab === 'home', () => { elderTab = 'home'; render(); }),
    tabBtn('📋', '记录', elderTab === 'records', () => { elderTab = 'records'; render(); }),
    tabBtn('🏥', '问诊', elderTab === 'plans', () => { elderTab = 'plans'; render(); }),
    tabBtn('💌', '消息', elderTab === 'messages', () => { elderTab = 'messages'; render(); }),
  ]);
}

function renderChild() {
  let body;
  if (childTab === 'dashboard') body = renderChildDashboard();
  else if (childTab === 'plan') body = renderChildPlanManage();
  else if (childTab === 'refill') body = renderChildRefill();
  else if (childTab === 'visit') body = renderChildVisit();
  else if (childTab === 'messages') body = renderChildMessages();
  else body = renderChildDashboard();

  return h('div', {}, [
    phoneFrame({
      label: '亲守时光 · 子女端 / WeChat H5',
      children: h('div', { style: { display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' } }, [
        h('div', { style: { flex: 1, overflow: 'auto' } }, [body]),
        renderChildTabbar(),
      ]),
    }),
  ]);
}

function renderWatch() {
  let body;
  if (watchTab === 'home') body = renderWatchHome();
  else body = renderWatchHome();

  return h('div', { class: 'watch-stage' }, [
    body,
  ]);
}

function renderChildTabbar() {
  const unread = getState().messages.filter(m => m.toId === 1 && m.status === 'unread').length;
  return h('div', { class: 'child-tabbar' }, [
    tabBtn('📊', '仪表盘', childTab === 'dashboard', () => { childTab = 'dashboard'; render(); }),
    tabBtn('💊', '计划', childTab === 'plan', () => { childTab = 'plan'; render(); }),
    tabBtn('🛒', '配药', childTab === 'refill', () => { childTab = 'refill'; render(); }),
    tabBtn('🏥', '问诊', childTab === 'visit', () => { childTab = 'visit'; render(); }),
    tabBtn('💌', '消息', childTab === 'messages', () => { childTab = 'messages'; render(); }, unread),
  ]);
}

function renderAdmin() {
  return h('div', { class: 'admin-stage' }, [
    h('div', { class: 'admin-sidebar' }, [
      h('div', { class: 'admin-brand' }, [
        h('div', { class: 'brand-mark' }, ['亲']),
        h('div', {}, [
          h('div', { class: 'admin-brand-name' }, ['亲守时光管理后台']),
          h('span', { class: 'admin-brand-tag' }, ['ADMIN']),
        ]),
      ]),
      h('nav', { class: 'admin-nav' }, [
        navGroup('数据洞察'),
        navItem('📊', '数据概览', adminTab === 'overview', () => { adminTab = 'overview'; render(); }),
        navItem('💊', '服药统计', adminTab === 'med-stats', () => { adminTab = 'med-stats'; render(); }),
        navItem('📈', '配药统计', adminTab === 'refill-stats', () => { adminTab = 'refill-stats'; render(); }),
        navItem('🏥', '问诊统计', adminTab === 'visit-stats', () => { adminTab = 'visit-stats'; render(); }),

        navItem('💊', '药品库', adminTab === 'medicines', () => { adminTab = 'medicines'; render(); }),
