<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>亲守时光 · 家庭健康守护平台 Demo</title>
  <meta name="description" content="亲守时光 — 以亲情守护为核心的老年人健康陪伴平台。吃药提醒、配药管理、问诊计划，陪父母慢慢变老。" />

  <!-- ECharts（管理后台图表用） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

  <style>

/* ---------- styles/reset.css ---------- */
/* 极简 reset */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
img, picture, video, canvas, svg { display: block; max-width: 100%; }
input, button, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
h1, h2, h3, h4, h5, h6 { font-weight: inherit; }
[hidden] { display: none !important; }

/* ---------- styles/tokens.css ---------- */
/* =========================================================
   亲守时光 Demo · 设计 Token
   隐喻：温暖家书 / 数字剪贴簿
   ========================================================= */

:root {
  /* —— 颜色：纸张与墨 —— */
  --color-bg: #F4ECDC;             /* 牛皮纸底 */
  --color-bg-soft: #FAF3E7;        /* 米白纸张 */
  --color-bg-elevated: #FFFCF5;    /* 卡片白 */
  --color-bg-dark: #2C1810;        /* 深咖（强调背景） */

  --color-primary: #C8553D;        /* 暖陶土主色 */
  --color-primary-hover: #B04A35;
  --color-primary-soft: #E8B4A0;   /* 浅陶土 */
  --color-primary-tint: #FAE2D6;   /* 更浅陶土 */

  --color-secondary: #4A6B5D;      /* 墨绿 */
  --color-secondary-soft: #B8C9BC;
  --color-secondary-tint: #E0E8E1;

  --color-success: #6B8E5A;        /* 草绿 */
  --color-warning: #B83D2A;        /* 警示朱 */
  --color-warning-soft: #F5C9B8;
  --color-info: #6B7B8C;           /* 钢青灰 */

  --color-text: #2C1810;           /* 主文字 */
  --color-text-muted: #6B5D54;     /* 灰咖 */
  --color-text-faint: #9A8A7E;     /* 浅灰咖 */
  --color-text-on-dark: #FAF3E7;
  --color-text-inverse: #FFFCF5;

  --color-border: #E8DFD0;         /* 纸纹边 */
  --color-border-strong: #C9B89B;
  --color-divider: rgba(44, 24, 16, 0.06);

  /* —— 字体 —— */
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-sans: 'Noto Sans SC', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-handwriting: 'Long Cang', 'Kaiti SC', 'STKaiti', cursive;
  --font-mono: 'SF Mono', 'Consolas', monospace;

  /* —— 字号 —— */
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px;
  --fs-md: 16px; --fs-lg: 18px; --fs-xl: 20px; --fs-2xl: 24px;
  --fs-3xl: 30px; --fs-4xl: 36px; --fs-5xl: 48px; --fs-6xl: 64px;

  /* —— 间距 —— */
  --space-0: 0;
  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-7: 32px; --space-8: 40px; --space-9: 56px; --space-10: 80px;

  /* —— 圆角 —— */
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 24px; --radius-2xl: 32px; --radius-full: 999px;

  /* —— 阴影（纸张感）—— */
  --shadow-xs: 0 1px 2px rgba(44, 24, 16, 0.05);
  --shadow-sm: 0 1px 0 rgba(44, 24, 16, 0.04), 0 2px 6px rgba(44, 24, 16, 0.05);
  --shadow-md: 0 2px 4px rgba(44, 24, 16, 0.04), 0 6px 16px rgba(44, 24, 16, 0.08);
  --shadow-lg: 0 4px 8px rgba(44, 24, 16, 0.06), 0 16px 32px rgba(44, 24, 16, 0.10);
  --shadow-xl: 0 12px 40px rgba(44, 24, 16, 0.14);
  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);

  /* —— 动效 —— */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-soft: cubic-bezier(0.4, 0.0, 0.2, 1);
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 420ms;
  --dur-page: 600ms;

  /* —— 布局 —— */
  --phone-w: 375px;
  --phone-h: 812px;
  --phone-radius: 44px;
  --phone-bezel: 12px;
  --admin-sidebar-w: 232px;
  --topbar-h: 64px;
}

/* —— 纸张纹理背景 —— */
.paper-bg {
  background-color: var(--color-bg);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(200, 85, 61, 0.04) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(74, 107, 93, 0.04) 0%, transparent 40%),
    repeating-linear-gradient(0deg, rgba(44, 24, 16, 0.015) 0 1px, transparent 1px 4px);
}

/* —— 噪点叠加（SVG inline 纹理）—— */
.noise-overlay::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.17 0 0 0 0 0.09 0 0 0 0 0.06 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.6;
  mix-blend-mode: multiply;
}

/* ---------- styles/shared.css ---------- */
/* =========================================================
   亲守时光 Demo · 全局共享样式
   ========================================================= */

html, body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.6;
  min-height: 100%;
}

body {
  background-color: var(--color-bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(200, 85, 61, 0.06) 0%, transparent 35%),
    radial-gradient(circle at 85% 90%, rgba(74, 107, 93, 0.06) 0%, transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(232, 180, 160, 0.05) 0%, transparent 60%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
}

/* —— 顶部导航 —— */
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-6);
  background: rgba(250, 243, 231, 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.brand { display: flex; align-items: center; gap: var(--space-3); }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-family: var(--font-serif);
  font-size: var(--fs-2xl); font-weight: 700;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm), var(--shadow-inset);
  transform: rotate(-3deg);
}
.brand-name {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1.1;
}
.brand-sub {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.05em;
}

.role-switcher {
  display: flex;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  padding: 4px;
  box-shadow: var(--shadow-xs);
}
.role-tab {
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  transition: all var(--dur-base) var(--ease-out);
  font-weight: 500;
  white-space: nowrap;
}
.role-tab:hover { color: var(--color-text); }
.role-tab.is-active {
  background: var(--color-text);
  color: var(--color-text-on-dark);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.topbar-meta { display: flex; align-items: center; gap: var(--space-2); }
.meta-pill {
  padding: 6px 12px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  font-family: var(--font-mono);
}
.meta-pill--accent {
  background: var(--color-primary-tint);
  border-color: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 500;
  font-family: var(--font-sans);
}

/* —— 主舞台 —— */
.stage {
  flex: 1;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: var(--space-6);
  min-height: calc(100vh - var(--topbar-h));
}

/* —— 通用卡片 —— */
.card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  position: relative;
}
.card-title {
  font-family: var(--font-serif);
  font-size: var(--fs-lg);
  font-weight: 700;
  margin-bottom: var(--space-4);
  display: flex; align-items: center; gap: var(--space-2);
}
.card-title-en {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  color: var(--color-text-faint);
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* —— 通用按钮 —— */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  font-weight: 500;
  transition: all var(--dur-base) var(--ease-out);
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
  background: var(--color-primary-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-primary:active { transform: translateY(0); }
.btn-ghost {
  background: transparent;
  color: var(--color-text);
  border-color: var(--color-border);
}
.btn-ghost:hover {
  background: var(--color-bg-soft);
  border-color: var(--color-border-strong);
}
.btn-soft {
  background: var(--color-primary-tint);
  color: var(--color-primary);
}

/* —— 徽章 —— */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px;
  font-size: var(--fs-xs);
  border-radius: var(--radius-full);
  background: var(--color-bg-soft);
  color: var(--color-text-muted);
  font-weight: 500;
}
.badge--success { background: rgba(107, 142, 90, 0.15); color: var(--color-success); }
.badge--warning { background: rgba(184, 61, 42, 0.12); color: var(--color-warning); }
.badge--info { background: rgba(107, 123, 140, 0.12); color: var(--color-info); }
.badge--primary { background: var(--color-primary-tint); color: var(--color-primary); }
.badge--secondary { background: var(--color-secondary-tint); color: var(--color-secondary); }

/* —— 头像 —— */
.avatar {
  display: grid; place-items: center;
  background: var(--color-primary-tint);
  color: var(--color-primary);
  font-family: var(--font-serif);
  font-weight: 700;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}
.avatar-sm { width: 32px; height: 32px; font-size: var(--fs-sm); }
.avatar-md { width: 40px; height: 40px; font-size: var(--fs-base); }
.avatar-lg { width: 56px; height: 56px; font-size: var(--fs-xl); }
.avatar-xl { width: 80px; height: 80px; font-size: var(--fs-2xl); }

/* —— Toast —— */
.toast-host {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 9999;
  display: flex; flex-direction: column; gap: var(--space-2);
  pointer-events: none;
}
.toast {
  background: var(--color-text);
  color: var(--color-text-on-dark);
  padding: 12px 20px;
  border-radius: var(--radius-full);
  font-size: var(--fs-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: var(--space-2);
  animation: toast-in var(--dur-slow) var(--ease-out);
}
.toast--success { background: var(--color-secondary); }
.toast--warning { background: var(--color-warning); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* —— Modal —— */
.modal-host {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(44, 24, 16, 0.45);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  animation: fade-in var(--dur-base) var(--ease-out);
}
.modal {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  padding: var(--space-7);
  max-width: 480px; width: 90%;
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--color-border);
  animation: modal-in var(--dur-page) var(--ease-out);
}
.modal-title {
  font-family: var(--font-serif);
  font-size: var(--fs-2xl);
  font-weight: 700;
  margin-bottom: var(--space-3);
}
.modal-body { color: var(--color-text-muted); margin-bottom: var(--space-6); }
.modal-actions { display: flex; gap: var(--space-3); justify-content: flex-end; }

/* —— 宽屏弹窗（公告编辑等需要横向填满） —— */
.modal.modal--wide {
  max-width: min(1200px, 96vw);
  width: 96vw;
}
.modal.modal--wide .modal-body {
  width: 100%;
}
.modal.modal--wide .modal-body > div {
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
}
.modal.modal--wide input,
.modal.modal--wide textarea,
.modal.modal--wide select {
  width: 100% !important;
}
.modal.modal--wide textarea {
  resize: none !important;
  min-height: 320px;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* —— 粒子层（报平安）—— */
.particles-host {
  position: fixed; inset: 0; z-index: 9500;
  pointer-events: none;
  display: grid; place-items: center;
}
.heart-particle {
  position: absolute;
  font-size: 28px;
  color: var(--color-primary);
  animation: heart-float 1.6s var(--ease-out) forwards;
  user-select: none;
}
@keyframes heart-float {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-10deg); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -200px))) scale(0.6) rotate(var(--rot, 20deg)); }
}

/* —— 页面进入动画 —— */
.page-enter { animation: page-in var(--dur-page) var(--ease-out); }
@keyframes page-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* —— 工具 —— */
.text-muted { color: var(--color-text-muted); }
.text-faint { color: var(--color-text-faint); }
.text-primary { color: var(--color-primary); }
.text-success { color: var(--color-success); }
.text-warning { color: var(--color-warning); }
.font-serif { font-family: var(--font-serif); }
.font-handwriting { font-family: var(--font-handwriting); }
.serif-quote { font-family: var(--font-serif); font-style: italic; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: var(--space-1); } .gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); } .gap-4 { gap: var(--space-4); }
.mt-1 { margin-top: var(--space-1); } .mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); } .mt-4 { margin-top: var(--space-4); }
.mt-5 { margin-top: var(--space-5); } .mt-6 { margin-top: var(--space-6); }

/* ---------- styles/elder.css ---------- */
/* =========================================================
   亲守时光 Demo · 老人端样式
   移动端优先，大字体、大按钮、暖色调
   ========================================================= */

/* —— 设备框 —— */
.phone-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-9);
  flex-wrap: wrap;
  width: 100%;
}

.phone-frame {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  background: #1A1A1A;
  border-radius: var(--phone-radius);
  padding: var(--phone-bezel);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.2),
    0 30px 80px -20px rgba(44, 24, 16, 0.4),
    0 10px 30px -10px rgba(44, 24, 16, 0.2);
  flex-shrink: 0;
}
.phone-screen {
  position: relative;
  width: 100%; height: 100%;
  background: var(--color-bg-soft);
  border-radius: calc(var(--phone-radius) - var(--phone-bezel));
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 刘海 */
.phone-notch {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 28px;
  background: #1A1A1A;
  border-radius: 0 0 18px 18px;
  z-index: 10;
}
.phone-status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-6);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-text);
  flex-shrink: 0;
}
.phone-status-bar .right { display: flex; gap: 6px; align-items: center; }

/* —— 老人端主屏 —— */
.elder-app {
  flex: 1;
  display: flex; flex-direction: column;
  padding: var(--space-4);
  gap: var(--space-4);
  overflow-y: auto;
  position: relative;
}
.elder-app::-webkit-scrollbar { display: none; }

/* —— 老人端底部回复输入框 —— */
.reply-bar {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
  margin-top: auto;
}
.reply-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: var(--fs-md);
  font-family: inherit;
  color: var(--color-text);
  padding: 6px 4px;
  min-width: 0;
}
.reply-input::placeholder { color: var(--color-text-muted); }
.reply-send {
  flex-shrink: 0;
  padding: 8px 18px;
  font-size: var(--fs-sm);
  border-radius: var(--radius-md);
}

/* —— 老人端快捷回复（点一下就发） —— */
.quick-replies {
  flex-shrink: 0;
  display: flex; flex-direction: column; gap: 6px;
  padding: 0 4px;
}
.quick-replies-label {
  font-size: 13px;
  color: var(--color-text-muted);
  font-weight: 500;
}
.quick-replies-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.quick-reply-chip {
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--color-primary-soft);
  background: var(--color-primary-tint);
  color: var(--color-primary);
  cursor: pointer;
  font-family: inherit;
  transition: transform 200ms var(--ease-out), background 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  white-space: nowrap;
}
.quick-reply-chip:hover { background: var(--color-primary); color: white; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.quick-reply-chip:active { transform: scale(0.96); }

/* —— 语音输入按钮 —— */
.reply-voice {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  width: 60px; height: 44px;
  border: 1px solid var(--color-secondary-tint);
  background: var(--color-secondary-tint);
  color: var(--color-secondary);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  flex-direction: column; justify-content: center;
  padding: 0;
  transition: background 200ms var(--ease-out), color 200ms var(--ease-out), transform 100ms var(--ease-out);
  position: relative;
}
.reply-voice:hover { background: var(--color-secondary); color: white; }
.reply-voice:active { transform: scale(0.95); }
.reply-voice-icon { font-size: 18px; line-height: 1; }
.reply-voice-tip { font-size: 9px; line-height: 1.1; }
/* 录音中：脉冲 + 红圈 */
.reply-voice.is-recording {
  background: var(--color-warning);
  color: white;
  animation: voice-pulse 1s ease-in-out infinite;
}
@keyframes voice-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(184, 61, 42, 0.5); }
  50%      { box-shadow: 0 0 0 10px rgba(184, 61, 42, 0); }
}

/* —— 监控手表状态卡 —— */
.watch-card {
  display: flex; align-items: stretch; gap: 14px;
  padding: 14px 16px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  transition: border-color 400ms var(--ease-out), background 400ms var(--ease-out);
}
.watch-card.is-low { border-color: var(--color-warning); background: linear-gradient(135deg, var(--color-bg-elevated) 0%, rgba(184, 61, 42, 0.04) 100%); }
.watch-card.is-offline { border-color: var(--color-warning); background: linear-gradient(135deg, var(--color-bg-elevated) 0%, rgba(184, 61, 42, 0.08) 100%); }

/* 手表图标 */
.watch-icon-wrap { display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0; }
.watch-icon { position: relative; width: 56px; height: 70px; display: flex; align-items: center; justify-content: center; }
.watch-bezel {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.1);
  transition: background 400ms var(--ease-out);
}
.watch-bezel--ok    { background: linear-gradient(135deg, #4A6B5D 0%, #2F4A40 100%); }
.watch-bezel--low   { background: linear-gradient(135deg, #C8553D 0%, #8B3A26 100%); }
.watch-bezel--offline { background: linear-gradient(135deg, #6B6259 0%, #4A4239 100%); }
.watch-screen {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #0F1815;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}
.watch-screen-icon {
  color: #FAF3E7;
  font-size: 14px;
  font-weight: 700;
  z-index: 2;
  text-shadow: 0 0 4px rgba(250, 243, 231, 0.6);
}
.watch-pulse {
  position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(250, 243, 231, 0.6);
  transform: translate(-50%, -50%);
  z-index: 1;
}
.watch-pulse.is-pulsing { animation: heart-pulse 1.4s ease-in-out infinite; }
@keyframes heart-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.6; }
  35%      { transform: translate(-50%, -50%) scale(2.2); opacity: 0;   }
}
.watch-strap {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 24px; height: 12px;
  background: linear-gradient(180deg, #6B6259 0%, #4A4239 100%);
  border-radius: 4px;
}
.watch-strap--top    { top: 0; }
.watch-strap--bottom { bottom: 0; }

/* 信息区 */
.watch-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.watch-info-row {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: nowrap;
}

/* 电量条 */
.watch-battery { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.watch-battery-shell {
  position: relative;
  width: 36px; height: 16px;
  border: 1.5px solid var(--color-text-muted);
  border-radius: 3px;
  padding: 1.5px;
  background: transparent;
}
.watch-battery-cap {
  position: absolute; right: -3px; top: 50%;
  transform: translateY(-50%);
  width: 2px; height: 6px;
  background: var(--color-text-muted);
  border-radius: 1px;
}
.watch-battery-fill {
  height: 100%;
  border-radius: 1px;
  transition: width 600ms var(--ease-out), background 400ms var(--ease-out);
}
.watch-battery--ok .watch-battery-fill      { background: var(--color-success); }
.watch-battery--low .watch-battery-fill     { background: var(--color-warning); }
.watch-battery--offline .watch-battery-fill { background: var(--color-text-muted); }
.watch-battery-text { display: flex; align-items: baseline; gap: 1px; font-family: var(--font-mono); line-height: 1; }
.watch-battery-num { font-size: 16px; font-weight: 700; }
.watch-battery-unit { font-size: 10px; color: var(--color-text-muted); }

/* 信号 */
.watch-signal { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; flex-shrink: 0; }
.watch-signal-bar {
  width: 2.5px;
  background: var(--color-divider);
  border-radius: 1px;
  transition: background 400ms var(--ease-out);
}
.watch-signal-bar.is-on { background: var(--color-secondary); }

/* 状态 */
.watch-status {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600;
  white-space: nowrap;
  flex: 1; min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.watch-status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px currentColor;
  opacity: 0.85;
  animation: status-blink 1.6s ease-in-out infinite;
}
@keyframes status-blink {
  0%, 100% { box-shadow: 0 0 0 2px currentColor; }
  50%      { box-shadow: 0 0 0 4px transparent; }
}
.watch-card.is-offline .watch-status-dot { animation: none; }

/* 详细信息 */
.watch-meta {
  display: flex; flex-direction: column; gap: 2px;
  font-size: 11px;
  color: var(--color-text-muted);
  border-top: 1px dashed var(--color-divider);
  padding-top: 6px;
}
.watch-meta-line { display: flex; align-items: center; gap: 6px; }
.watch-meta-label { color: var(--color-text-muted); flex-shrink: 0; min-width: 32px; }
.watch-meta-value { color: var(--color-text); font-weight: 500; }
.watch-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.watch-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--color-secondary-tint);
  color: var(--color-secondary);
  white-space: nowrap;
}

/* ============================================================
   手表端 真实手表样式（页面 + 设备 + UI）
   ============================================================ */
.watch-stage {
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px 60px;
  min-height: calc(100vh - 200px);
  background: linear-gradient(180deg, var(--color-bg) 0%, rgba(45, 42, 38, 0.03) 100%);
}
.watch-screen-page {
  display: flex; flex-direction: column; align-items: center; gap: 28px;
  width: 100%;
}

/* 手表包装：腕带 + 设备 */
.watch-device-wrap {
  position: relative;
  width: 230px;
  display: flex; flex-direction: column; align-items: center;
}
/* 腕带 */
.watch-band {
  width: 100px;
  height: 64px;
  background: linear-gradient(180deg, #6B6259 0%, #3D362D 100%);
  position: relative;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.3);
}
.watch-band::before {
  content: ''; position: absolute; inset: 8px 0;
  background-image: linear-gradient(180deg, transparent 0 6px, rgba(0,0,0,0.25) 6px 8px, transparent 8px);
  background-size: 100% 14px;
  background-repeat: repeat-y;
}
.watch-band--top    { border-radius: 12px 12px 4px 4px; }
.watch-band--bottom { border-radius: 4px 4px 12px 12px; }

/* 手表本体（屏幕 + 边框） */
.watch-device {
  position: relative;
  width: 230px;
  height: 280px;
  background: linear-gradient(135deg, #2D2A26 0%, #1A1815 100%);
  border-radius: 38px;
  padding: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
  color: #FAF3E7;
  z-index: 1;
  margin: -8px 0;
}
/* 表冠（右侧装饰按钮） */
.w-crown {
  position: absolute;
  right: -3px;
  width: 5px;
  height: 22px;
  background: linear-gradient(180deg, #6B6259 0%, #3D362D 100%);
  border-radius: 2px;
  box-shadow: -1px 0 2px rgba(0,0,0,0.3);
}
.w-crown--right  { top: 60px; }
.w-crown--lower  { top: 100px; height: 14px; }

/* 顶部状态条 */
.w-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px;
  height: 18px;
  font-size: 9px;
  font-weight: 600;
  color: #FAF3E7;
  flex-shrink: 0;
}
.w-net { display: flex; align-items: center; gap: 2px; }
.w-net-bar {
  width: 1.5px;
  background: rgba(250, 243, 231, 0.25);
  border-radius: 1px;
  transition: background 400ms var(--ease-out);
}
.w-net-bar.is-on { background: #FAF3E7; }
.w-net--offline .w-net-bar.is-on { background: transparent; }
.w-net-label {
  margin-left: 3px;
  font-size: 8px;
  white-space: nowrap;
  color: rgba(250, 243, 231, 0.7);
}
.w-net--offline .w-net-label { color: #FF6B5C; }

.w-battery { display: flex; align-items: center; gap: 3px; }
.w-battery-icon {
  width: 16px; height: 8px;
  border: 1px solid rgba(250, 243, 231, 0.6);
  border-radius: 2px;
  position: relative;
  padding: 1px;
}
.w-battery-icon::after {
  content: ''; position: absolute; right: -2px; top: 50%;
  transform: translateY(-50%);
  width: 1.5px; height: 4px;
  background: rgba(250, 243, 231, 0.6);
  border-radius: 0 1px 1px 0;
}
.w-battery-fill {
  height: 100%;
  background: #4ADE80;
  border-radius: 1px;
  transition: width 600ms var(--ease-out), background 400ms var(--ease-out);
}
.w-battery-num { font-size: 9px; font-family: var(--font-mono); line-height: 1; }
.w-battery-pct { font-size: 7px; color: rgba(250, 243, 231, 0.6); }

/* 中心时钟 */
.w-clock-wrap {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 4px 0;
}
.w-clock-hm {
  font-family: var(--font-mono);
  font-size: 56px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -1px;
  color: #FAF3E7;
  text-shadow: 0 0 12px rgba(250, 243, 231, 0.4);
}
.w-clock-date {
  font-size: 11px;
  color: rgba(250, 243, 231, 0.7);
  margin-top: 6px;
  font-weight: 500;
}

/* SOS 按钮 */
.w-sos {
  position: relative;
  width: 78px; height: 78px;
  margin: 8px auto;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}
.w-sos-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: rgba(220, 38, 38, 0.15);
  border: 2px solid #DC2626;
  animation: w-sos-pulse 2.4s ease-in-out infinite;
}
.w-sos-inner {
  position: absolute; inset: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5), inset 0 -2px 4px rgba(0,0,0,0.3);
  transition: transform 200ms var(--ease-out);
}
.w-sos:hover .w-sos-inner { transform: scale(0.96); }
.w-sos:active .w-sos-inner { transform: scale(0.92); }
.w-sos-text {
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 800;
  color: white;
  letter-spacing: 1px;
  line-height: 1;
}
.w-sos-sub {
  font-size: 7px;
  color: rgba(255, 255, 255, 0.85);
  margin-top: 2px;
  white-space: nowrap;
}
@keyframes w-sos-pulse {
  0%, 100% { transform: scale(1);    opacity: 1;   }
  50%      { transform: scale(1.18); opacity: 0.4; }
}

/* 底部一行：呼叫 + 步数 + 心率 */
.w-bottom {
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 4px;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 4px;
}
.w-action {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px;
  background: rgba(74, 107, 93, 0.85);
  border: 1px solid rgba(74, 107, 93, 0.9);
  border-radius: 12px;
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 9px;
  font-weight: 600;
  transition: transform 100ms var(--ease-out), background 200ms var(--ease-out);
}
.w-action:hover { background: #4A6B5D; }
.w-action:active { transform: scale(0.95); }
.w-action:disabled { opacity: 0.4; cursor: not-allowed; }
.w-action-icon { font-size: 14px; line-height: 1; }
.w-action-label { font-size: 8px; line-height: 1.1; }

.w-stat {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 36px;
  padding: 4px 2px;
  background: rgba(250, 243, 231, 0.08);
  border-radius: 8px;
}
.w-stat-icon { font-size: 12px; line-height: 1; }
.w-stat-icon--pulse { animation: w-pulse 1.4s ease-in-out infinite; display: inline-block; color: #FF6B5C; }
@keyframes w-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.3); }
}
.w-stat-value { font-size: 11px; font-weight: 700; line-height: 1; color: #FAF3E7; }
.w-stat-label { font-size: 7px; color: rgba(250, 243, 231, 0.6); line-height: 1.1; }

/* 手表下方的说明卡 */
.watch-side-info {
  display: flex; flex-direction: column; gap: 12px;
  width: 100%;
  max-width: 480px;
}
.watch-info-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.watch-info-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--color-text);
}
.watch-info-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 13px;
  color: var(--color-text);
  padding: 4px 0;
  line-height: 1.6;
}
.watch-info-row .text-muted { color: var(--color-text-muted); font-size: 12px; }

.elder-greeting {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: var(--space-2) var(--space-2) var(--space-3);
}
.elder-greeting-text {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--color-text);
}
.elder-greeting-sub {
  font-size: var(--fs-md);
  color: var(--color-text-muted);
  margin-top: 4px;
}
.elder-weather {
  display: flex; flex-direction: column; align-items: center;
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
}
.elder-weather-icon { font-size: 28px; }

/* —— SOS 按钮 —— */
.sos-button {
  width: 100%;
  padding: var(--space-5) var(--space-4);
  background: linear-gradient(135deg, #C8553D 0%, #B83D2A 100%);
  color: white;
  border-radius: var(--radius-xl);
  font-size: 22px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  box-shadow:
    0 4px 0 #8B2E1F,
    0 10px 20px rgba(200, 85, 61, 0.3);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.1em;
  transition: transform var(--dur-fast) var(--ease-out);
}
.sos-button::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 50%);
  pointer-events: none;
}
.sos-button:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #8B2E1F, 0 4px 10px rgba(200, 85, 61, 0.3);
}
.sos-icon {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.25);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px;
}

/* —— 服药提醒卡片 —— */
.med-card {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: all var(--dur-base) var(--ease-out);
}
.med-card.is-taken {
  background: linear-gradient(135deg, var(--color-secondary-tint) 0%, var(--color-bg-elevated) 100%);
  border-color: var(--color-secondary-soft);
}
.med-card.is-missed {
  background: linear-gradient(135deg, var(--color-warning-soft) 0%, var(--color-bg-elevated) 100%);
  border-color: var(--color-warning);
}
.med-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: var(--space-3);
}
.med-card-time {
  font-family: var(--font-mono);
  font-size: var(--fs-2xl);
  font-weight: 600;
  color: var(--color-text);
  line-height: 1;
}
.med-card-time small {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  font-weight: 400;
  margin-left: 4px;
}
.med-card-name {
  font-size: var(--fs-xl);
  font-weight: 600;
  color: var(--color-text);
  font-family: var(--font-serif);
}
.med-card-dosage {
  font-size: var(--fs-md);
  color: var(--color-text-muted);
  margin-top: 2px;
}
.med-card-actions {
  display: flex; gap: var(--space-3);
  margin-top: var(--space-4);
}
.med-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius-md);
  font-size: var(--fs-md);
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--dur-base) var(--ease-out);
}
.med-btn-primary {
  background: var(--color-success);
  color: white;
  box-shadow: 0 2px 0 #4F6B43;
}
.med-btn-primary:active { transform: translateY(1px); box-shadow: 0 1px 0 #4F6B43; }
.med-btn-ghost {
  background: var(--color-bg-soft);
  color: var(--color-text);
  border: 1px solid var(--color-border);
}
.med-btn-ghost:active { background: var(--color-primary-tint); }

/* —— 大操作按钮组（拍照/语音）—— */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.action-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-3);
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-base) var(--ease-out);
  cursor: pointer;
}
.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.action-card:active { transform: translateY(0); }
.action-card-icon {
  font-size: 36px;
  margin-bottom: var(--space-2);
  line-height: 1;
}
.action-card-label {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--color-text);
}

/* —— 报平安按钮 —— */
.safety-button {
  width: 100%;
  padding: var(--space-5) var(--space-4);
  background: linear-gradient(135deg, #6B8E5A 0%, #4F6B43 100%);
  color: white;
  border-radius: var(--radius-xl);
  font-size: 22px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  box-shadow: 0 4px 0 #3A4F30, 0 10px 20px rgba(107, 142, 90, 0.3);
  letter-spacing: 0.1em;
  transition: transform var(--dur-fast) var(--ease-out);
}
.safety-button:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #3A4F30, 0 4px 10px rgba(107, 142, 90, 0.3);
}
.safety-button.is-confirmed {
  background: var(--color-secondary);
  pointer-events: none;
}

/* —— 子女留言 —— */
.message-strip {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  display: flex; gap: var(--space-3); align-items: center;
  cursor: pointer;
  transition: all var(--dur-base) var(--ease-out);
}
.message-strip:hover { background: var(--color-primary-tint); }
.message-avatar {
  width: 40px; height: 40px;
  background: var(--color-primary);
  color: white;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700;
  flex-shrink: 0;
}
.message-content { flex: 1; min-width: 0; }
.message-from { font-size: var(--fs-xs); color: var(--color-text-muted); }
.message-preview {
  font-size: var(--fs-md);
  color: var(--color-text);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-handwriting);
  font-size: 18px;
}

/* —— 系统消息（居中无头像） —— */
.message-system {
  display: flex;
  justify-content: center;
  margin: 12px 0;
  padding: 0 4px;
}
.message-system-bubble {
  background: var(--color-bg-soft);
  color: var(--color-text);
  padding: 10px 16px;
  border-radius: 14px;
  border: 1px dashed var(--color-border-strong);
  text-align: center;
  max-width: 80%;
  font-size: 13px;
  line-height: 1.6;
  font-family: var(--font-handwriting);
}
.message-system-from {
  font-size: 11px;
  color: var(--color-primary);
  margin-bottom: 4px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.message-system-time {
  font-size: 10px;
  color: var(--color-text-muted);
  margin-top: 4px;
  opacity: 0.7;
  font-family: var(--font-sans);
}

/* —— 老人端对话流（按时间排序，与子女端一致） —— */
.elder-conversation {
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.elder-msg-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-direction: row;
}
.elder-msg-row--mine {
  flex-direction: row-reverse;
}
.elder-msg-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--color-primary);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
}
.elder-msg-avatar--mine {
  background: var(--color-secondary);
}
.elder-msg-bubble-wrap {
  max-width: 72%;
  min-width: 0;
}
.elder-msg-from {
  font-size: 12px;
  color: var(--color-text-muted);
  margin-bottom: 4px;
  padding: 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.elder-msg-bubble {
  background: var(--color-bg-elevated);
  color: var(--color-text);
  border-radius: 16px;
  padding: 10px 14px;
  border: 1px solid var(--color-border);
  font-size: 15px;
  line-height: 1.6;
  font-family: var(--font-handwriting);
  box-shadow: var(--shadow-xs);
  word-break: break-word;
}
.elder-msg-bubble--mine {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

/* —— 底部导航 —— */
.elder-tabbar {
  height: 64px;
  background: var(--color-bg-elevated);
  border-top: 1px solid var(--color-border);
  display: flex;
  flex-shrink: 0;
}
.elder-tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  transition: color var(--dur-base) var(--ease-out);
}
.elder-tab.is-active { color: var(--color-primary); }
.elder-tab-icon { font-size: 20px; }

/* —— 端标签（demo 用）—— */
.device-label {
  position: absolute;
  bottom: -36px; left: 50%; transform: translateX(-50%);
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.1em;
  font-family: var(--font-mono);
  text-transform: uppercase;
  white-space: nowrap;
}

/* ---------- styles/child.css ---------- */
/* =========================================================
   亲守时光 Demo · 子女端样式
   移动端 / 平板端仪表盘
   ========================================================= */

.child-app {
  flex: 1;
  display: flex; flex-direction: column;
  overflow-y: auto;
  background: var(--color-bg-soft);
}
.child-app::-webkit-scrollbar { display: none; }

/* —— 子女端对话流（自动填满 + 滚动） —— */
.child-conversation {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 20px 20px;
}
.child-conversation::-webkit-scrollbar { width: 4px; }
.child-conversation::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: 999px;
}

/* —— 顶部老人信息条 —— */
.child-header {
  padding: var(--space-5) var(--space-5) var(--space-4);
  background: linear-gradient(180deg, var(--color-bg-elevated) 0%, var(--color-bg-soft) 100%);
}
.child-elder-card {
  display: flex; align-items: center; gap: var(--space-3);
  min-width: 0;
}
.child-elder-info { flex: 1; min-width: 0; }
.child-elder-name {
  font-family: var(--font-serif);
  font-size: var(--fs-2xl);
  font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
  min-width: 0;
}
.child-elder-name > span {
  white-space: nowrap;
  flex-shrink: 0;
}
.child-elder-meta {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  margin-top: 2px;
  display: flex; gap: 12px; flex-wrap: wrap;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.child-elder-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.online-dot {
  width: 8px; height: 8px;
  background: var(--color-success);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(107, 142, 90, 0.2);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(107, 142, 90, 0.2); }
  50% { box-shadow: 0 0 0 6px rgba(107, 142, 90, 0.0); }
}

/* —— 漏服警告横幅 —— */
.alert-banner {
  margin: 0 var(--space-5) var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: linear-gradient(135deg, #F8D7CF 0%, #F5C9B8 100%);
  border: 1px solid #E8A893;
  border-radius: var(--radius-md);
  display: flex; align-items: center; gap: var(--space-3);
  font-size: var(--fs-sm);
  color: #8B2E1F;
  position: relative;
  overflow: hidden;
}
.alert-banner::before {
  content: '⚠';
  width: 32px; height: 32px;
  background: var(--color-warning);
  color: white;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.alert-banner-text { flex: 1; }
.alert-banner-text strong { display: block; font-weight: 600; }
.alert-banner-text small { font-size: var(--fs-xs); opacity: 0.8; }
.alert-banner-close {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: #8B2E1F;
  opacity: 0.6;
  font-size: 18px;
}
.alert-banner-close:hover { opacity: 1; background: rgba(139, 46, 31, 0.1); }

/* —— 进度环卡片 —— */
.ring-card {
  margin: 0 var(--space-5) var(--space-4);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  display: flex; align-items: center; gap: var(--space-3);
  box-shadow: var(--shadow-sm);
}
.ring-card-chart { flex-shrink: 0; position: relative; width: 96px; height: 96px; }
.ring-card-info { flex: 1; min-width: 0; overflow: hidden; }
.ring-card-label {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.ring-card-value {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  display: flex; align-items: baseline; gap: 4px;
  white-space: nowrap;
}
.ring-card-value small { font-size: var(--fs-md); color: var(--color-text-muted); font-weight: 400; white-space: nowrap; }
.ring-card-detail {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  margin-top: var(--space-2);
  display: flex; gap: var(--space-2);
  flex-wrap: wrap;
  white-space: nowrap;
}
.ring-card-detail-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot--taken { background: var(--color-success); }
.dot--pending { background: var(--color-primary-soft); }
.dot--missed { background: var(--color-warning); }

/* —— 统计数字卡片组 —— */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--space-3);
  padding: 0 var(--space-5);
  margin-bottom: var(--space-4);
}
.stat-tile {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  text-align: center;
}
.stat-tile-value {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  color: var(--color-primary);
  line-height: 1.2;
}
.stat-tile-value--secondary { color: var(--color-secondary); }
.stat-tile-value--success { color: var(--color-success); }
.stat-tile-label {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  margin-top: 2px;
}

/* —— 时间线 —— */
.section-title {
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  font-weight: 700;
  margin: 0 var(--space-5) var(--space-3);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  white-space: nowrap;
}
.section-title > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-title-meta { font-size: var(--fs-xs); color: var(--color-text-faint); font-weight: 400; white-space: nowrap; flex-shrink: 0; }

.timeline {
  margin: 0 var(--space-5) var(--space-5);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
}
.timeline-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px dashed var(--color-divider);
  position: relative;
  transition: background 600ms var(--ease-out), border-color 600ms var(--ease-out);
}
.timeline-item:last-child { border-bottom: none; }
.timeline-item.is-just-updated {
  background: linear-gradient(90deg, rgba(74, 107, 93, 0.12) 0%, rgba(74, 107, 93, 0.04) 100%);
  border-radius: var(--radius-sm);
  margin: 0 -8px;
  padding-left: 8px; padding-right: 8px;
  animation: timeline-flash 1.6s var(--ease-out);
  border-left: 3px solid var(--color-success);
  transition: background 600ms var(--ease-out), border-color 600ms var(--ease-out);
}
@keyframes timeline-flash {
  0%   { background: rgba(74, 107, 93, 0.35); transform: translateX(0) scale(1.02); }
  30%  { background: rgba(74, 107, 93, 0.25); transform: translateX(0) scale(1.005); }
  100% { background: rgba(74, 107, 93, 0.08); transform: translateX(0) scale(1); }
}
/* 状态变化时的颜色平滑过渡：红(pending) → 绿(taken) */
.timeline-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid var(--color-bg-elevated);
  box-shadow: 0 0 0 2px var(--color-border);
  transition: background 600ms var(--ease-out), box-shadow 600ms var(--ease-out), transform 600ms var(--ease-out);
}
.timeline-dot--taken { background: var(--color-success); box-shadow: 0 0 0 2px var(--color-success); }
.timeline-dot--pending { background: var(--color-primary-soft); box-shadow: 0 0 0 2px var(--color-primary); }
.timeline-dot--missed { background: var(--color-warning); box-shadow: 0 0 0 2px var(--color-warning); }
/* 刚转绿的项：点放大一下做脉冲，强化"红→绿"瞬间感 */
.timeline-item.is-just-updated .timeline-dot {
  animation: dot-pulse 1.2s var(--ease-out);
}
@keyframes dot-pulse {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.55); box-shadow: 0 0 0 6px rgba(74, 107, 93, 0.35); }
  100% { transform: scale(1); }
}
.timeline-time {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  width: 48px;
  flex-shrink: 0;
}
.timeline-content { flex: 1; min-width: 0; overflow: hidden; }
.timeline-name { font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline-sub { font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline-action {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  background: var(--color-bg-soft);
  flex-shrink: 0;
  white-space: nowrap;
}

/* —— 快捷操作 —— */
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
  padding: 0 var(--space-5);
  margin-bottom: var(--space-4);
}
.quick-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex; align-items: center; gap: var(--space-3);
  transition: all var(--dur-base) var(--ease-out);
  cursor: pointer;
}
.quick-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--color-primary-soft); }
.quick-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: grid; place-items: center;
  font-size: 18px;
}
.quick-icon--primary { background: var(--color-primary-tint); color: var(--color-primary); }
.quick-icon--secondary { background: var(--color-secondary-tint); color: var(--color-secondary); }
.quick-icon--info { background: rgba(107, 123, 140, 0.12); color: var(--color-info); }
.quick-icon--warning { background: rgba(184, 61, 42, 0.12); color: var(--color-warning); }
.quick-label { font-size: var(--fs-sm); font-weight: 500; }

/* —— 演示操作条 —— */
.demo-action-bar {
  margin: 0 var(--space-5) var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: linear-gradient(135deg, var(--color-text) 0%, #4A3528 100%);
  color: var(--color-text-on-dark);
  border-radius: var(--radius-md);
  display: flex; align-items: center; gap: var(--space-3);
  font-size: var(--fs-sm);
  box-shadow: var(--shadow-md);
}
.demo-action-bar-text { flex: 1; min-width: 0; }
.demo-action-bar-text > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-action-bar-text small { display: block; font-size: var(--fs-xs); opacity: 0.7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-action-bar button {
  background: var(--color-primary);
  color: white;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}

/* —— 子女端底部 Tab —— */
.child-tabbar {
  height: 60px;
  background: var(--color-bg-elevated);
  border-top: 1px solid var(--color-border);
  display: flex;
  flex-shrink: 0;
}
.child-tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  transition: color var(--dur-base) var(--ease-out);
  position: relative;
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
}
.child-tab.is-active { color: var(--color-primary); }
.child-tab.is-active::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 2px;
  background: var(--color-primary);
  border-radius: 0 0 2px 2px;
}
.child-tab-icon { font-size: 20px; }
.child-tab-badge {
  position: absolute; top: 6px; right: 30%;
  background: var(--color-warning);
  color: white;
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: grid; place-items: center;
  padding: 0 4px;
  font-weight: 600;
}

/* —— 环 SVG —— */
.ring-svg { transform: rotate(-90deg); display: block; }
.ring-bg { fill: none; stroke: var(--color-bg); stroke-width: 10; }
.ring-fg { fill: none; stroke-linecap: round; transition: stroke-dashoffset 800ms var(--ease-out); }
.ring-fg--primary { stroke: var(--color-primary); }
.ring-fg--success { stroke: var(--color-success); }
.ring-text {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 20px;
  line-height: 1.1;
  pointer-events: none;
  white-space: nowrap;
}
.ring-text-sub {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 10px;
  color: var(--color-text-muted);
  margin-top: 2px;
}

/* —— 服药完成弹窗（替代普通 toast） —— */
.medication-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  z-index: 1000;
  background: linear-gradient(135deg, var(--color-success) 0%, #3a5648 100%);
  color: white;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: flex; align-items: center; gap: 12px;
  min-width: 280px; max-width: 90vw;
  opacity: 0;
  transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
  pointer-events: none;
}
.medication-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.medication-toast-icon {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px; font-weight: 700;
  flex-shrink: 0;
}
.medication-toast-body { flex: 1; min-width: 0; }
.medication-toast-title {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.medication-toast-sub {
  font-size: 12px; opacity: 0.85; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- styles/admin.css ---------- */
/* =========================================================
   亲守时光 Demo · 管理后台样式
   桌面端：左侧导航 + 主内容

.admin-nav { display: flex; flex-direction: column; gap: 2px; }
.admin-nav-group {

  text-transform: uppercase;
  margin: var(--space-4) var(--space-2) var(--space-2);

}
.admin-nav-group:first-child { margin-top: 0; }
.admin-nav-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 9px var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  transition: all var(--dur-base) var(--ease-out);

  cursor: pointer;
}
.admin-nav-item:hover { background: var(--color-bg-soft); color: var(--color-text); }
.admin-nav-item.is-active {

  box-shadow: var(--shadow-sm);
}
.admin-nav-item.is-active .admin-nav-icon { background: rgba(255, 255, 255, 0.2); }
.admin-nav-icon {
  width: 22px; height: 22px;
  background: var(--color-bg-soft);
  border-radius: var(--radius-xs);
  display: grid; place-items: center;
  font-size: 13px;
}
.admin-nav-item.is-active .admin-nav-icon { background: rgba(255, 255, 255, 0.2); }

/* —— 主内容区 —— */
.admin-main {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-sm);
  min-height: 600px;
}
.admin-page-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: var(--space-6);
  padding-bottom: var(--space-5);
  border-bottom: 1px solid var(--color-border);
}
.admin-page-title {
  font-family: var(--font-serif);
  font-size: var(--fs-3xl);
  font-weight: 700;
  line-height: 1.2;
}
.admin-page-title-en {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--color-text-faint);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.admin-page-desc {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  margin-top: var(--space-2);
  max-width: 600px;
}
.admin-page-actions { display: flex; gap: var(--space-2); }

/* —— 数据卡片组 —— */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.metric-card {
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  position: relative;
  overflow: hidden;
}
.metric-card::after {
  content: '';
  position: absolute; right: -10px; top: -10px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--color-primary-tint);
  opacity: 0.4;
}
.metric-card-label {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: var(--space-2);
}
.metric-card-value {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  color: var(--color-text);
}
.metric-card-trend {
  font-size: var(--fs-xs);
  margin-top: var(--space-2);
  display: flex; align-items: center; gap: 4px;
}
.metric-card-trend--up { color: var(--color-success); }
.metric-card-trend--down { color: var(--color-warning); }
.metric-card-unit { font-size: var(--fs-md); color: var(--color-text-muted); font-weight: 400; margin-left: 2px; }

/* —— 图表卡片 —— */
.chart-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.chart-card {
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.chart-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--space-3);
}
.chart-title {
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  font-weight: 700;
}
.chart-container { width: 100%; height: 280px; }

/* —— 表格 —— */
.data-table-wrap {
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.data-table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-elevated);
}
.data-table-search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  width: 280px;
}
.data-table-search input {
  flex: 1; border: none; background: transparent; outline: none;
  font-size: var(--fs-sm);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
}
.data-table thead th {
  text-align: left;
  padding: 10px var(--space-4);
  font-weight: 600;
  color: var(--color-text-muted);
  font-size: var(--fs-xs);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--color-bg-soft);
  border-bottom: 1px solid var(--color-border);
}
.data-table tbody td {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-divider);
}
.data-table tbody tr { transition: background var(--dur-base); }
.data-table tbody tr:hover { background: var(--color-bg-soft); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--color-border);
  background: var(--color-bg-elevated);
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
}

/* —— 顶部摘要卡（活动列表）—— */
.activity-list { display: flex; flex-direction: column; gap: var(--space-3); }
.activity-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3);
  background: var(--color-bg-soft);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
}
.activity-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--color-primary);
  flex-shrink: 0;
}
.activity-dot--success { background: var(--color-success); }
.activity-dot--warning { background: var(--color-warning); }
.activity-content { flex: 1; min-width: 0; }
.activity-title { font-size: var(--fs-sm); font-weight: 500; }
.activity-sub { font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: 2px; }
.activity-time { font-size: var(--fs-xs); color: var(--color-text-faint); font-family: var(--font-mono); }

/* —— 故事页（开场）—— */
.story-stage {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-5);
}
.story-hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: var(--space-8);
  align-items: center;
}
.story-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--color-primary);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: var(--space-3);
  display: inline-flex; align-items: center; gap: 8px;
}
.story-eyebrow::before {
  content: '';
  width: 28px; height: 1px;
  background: var(--color-primary);
}
.story-title {
  font-family: var(--font-serif);
  font-size: 64px;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: var(--space-5);
  letter-spacing: -0.02em;
}
.story-title em {
  font-style: normal;
  color: var(--color-primary);
  position: relative;
  display: inline-block;
}
.story-title em::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 4px;
  height: 12px;
  background: var(--color-primary-tint);
  z-index: -1;
}
.story-quote {
  font-family: var(--font-serif);
  font-size: var(--fs-lg);
  line-height: 1.7;
  color: var(--color-text-muted);
  margin-bottom: var(--space-5);
  padding-left: var(--space-4);
  border-left: 3px solid var(--color-primary);
  font-style: italic;
}
.story-cta { display: flex; gap: var(--space-3); margin-top: var(--space-6); }

.story-illustration {
  position: relative;
  aspect-ratio: 1;
  background: var(--color-bg-elevated);
  border-radius: var(--radius-2xl);
  border: 1px solid var(--color-border);
  padding: var(--space-6);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.story-illustration::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(200, 85, 61, 0.1) 0%, transparent 50%);
}
.illust-stamp {
  position: absolute;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  box-shadow: var(--shadow-md);
  font-family: var(--font-serif);
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--fs-sm);
  animation: float 6s ease-in-out infinite;
}
.illust-stamp--1 { top: 6%; left: 4%; animation-delay: 0s; }
.illust-stamp--2 { top: 6%; right: 4%; animation-delay: 1.5s; }
.illust-stamp--3 { bottom: 6%; left: 4%; animation-delay: 3s; }
.illust-stamp--4 { bottom: 6%; right: 4%; animation-delay: 4.5s; }
.illust-stamp-icon {
  width: 36px; height: 36px;
  background: var(--color-primary-tint);
  color: var(--color-primary);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.illust-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 60%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
  display: grid; place-items: center;
  color: white;
  font-family: var(--font-serif);
  font-size: 80px;
  font-weight: 700;
  box-shadow: 0 20px 60px rgba(200, 85, 61, 0.4);
  letter-spacing: 0.1em;
}

.story-pain {
  margin-top: var(--space-9);
  padding: var(--space-7) 0;
  border-top: 1px solid var(--color-border);
}
.story-pain-title {
  font-family: var(--font-serif);
  font-size: var(--fs-2xl);
  font-weight: 700;
  margin-bottom: var(--space-5);
  text-align: center;
}
.story-pain-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-4);
}
.pain-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  position: relative;
  overflow: hidden;
}
.pain-card-num {
  font-family: var(--font-mono);
  font-size: 64px;
  font-weight: 700;
  color: var(--color-primary-tint);
  position: absolute; right: -8px; top: -16px;
  line-height: 1;
}
.pain-card-title {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: 700;
  margin-bottom: var(--space-2);
  position: relative;
}
.pain-card-body {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  line-height: 1.7;
  position: relative;
}

.story-flow {
  margin-top: var(--space-9);
  padding: var(--space-7);
  background: var(--color-text);
  color: var(--color-text-on-dark);
  border-radius: var(--radius-xl);
  position: relative;
  overflow: hidden;
}
.story-flow::before {
  content: '';
  position: absolute; right: -100px; top: -100px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 85, 61, 0.3) 0%, transparent 70%);
}
.story-flow-title {
  font-family: var(--font-serif);
  font-size: var(--fs-2xl);
  font-weight: 700;
  margin-bottom: var(--space-5);
  position: relative;
}
.story-flow-list {
  display: flex; flex-direction: column; gap: var(--space-4);
  position: relative;
}
.flow-step {
  display: flex; align-items: center; gap: var(--space-4);
  position: relative;
}
.flow-step-arrow {
  position: absolute; left: 18px; top: 100%;
  width: 1px; height: var(--space-4);
  background: var(--color-primary-soft);
  opacity: 0.5;
}
.flow-step:last-child .flow-step-arrow { display: none; }
.flow-step-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--color-primary);
  color: white;
  display: grid; place-items: center;
  font-family: var(--font-serif);
  font-weight: 700;
  flex-shrink: 0;
  position: relative; z-index: 1;
}
.flow-step-text { font-family: var(--font-serif); font-size: var(--fs-md); }

.story-actions {
  margin-top: var(--space-7);
  display: flex; gap: var(--space-3); justify-content: center;
}

/* =========================================================
   亲守时光 Demo · 管理后台 - 补充组件样式
   KPI 卡片、标签、按钮、徽章、家庭关系、告警、日志等
   ========================================================= */

/* —— 页面进入动画 —— */
.page-enter {
  animation: pageFadeIn var(--dur-page) var(--ease-out);
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* —— KPI 卡片组 —— */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}
.kpi-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex; align-items: center; gap: var(--space-3);
  position: relative;
  overflow: hidden;
  transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.kpi-card--primary { border-left: 4px solid var(--color-primary); }
.kpi-card--success { border-left: 4px solid var(--color-success); }
.kpi-card--warning { border-left: 4px solid var(--color-warning); }
.kpi-card--danger  { border-left: 4px solid var(--color-warning); background: linear-gradient(90deg, rgba(184, 61, 42, 0.04), transparent 40%); }
.kpi-card--info    { border-left: 4px solid var(--color-info); }
.kpi-card--normal  { border-left: 4px solid var(--color-border-strong); }
.kpi-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  background: var(--color-primary-tint);
  color: var(--color-primary);
  display: grid; place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.kpi-card--success .kpi-icon { background: var(--color-secondary-tint); color: var(--color-success); }
.kpi-card--warning .kpi-icon { background: var(--color-warning-soft); color: var(--color-warning); }
.kpi-card--info    .kpi-icon { background: rgba(107, 123, 140, 0.15); color: var(--color-info); }
.kpi-card--danger  .kpi-icon { background: var(--color-warning-soft); color: var(--color-warning); }
.kpi-card--normal  .kpi-icon { background: var(--color-bg-soft); color: var(--color-text-muted); }
.kpi-body { flex: 1; min-width: 0; }
.kpi-label {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kpi-value {
  font-family: var(--font-serif);
  font-size: 24px; font-weight: 700;
  color: var(--color-text);
  line-height: 1.1;
  display: flex; align-items: baseline; gap: 4px;
}
.kpi-value small {
  font-size: var(--fs-sm); font-weight: 400;
  color: var(--color-text-muted);
  font-family: var(--font-sans);
}
.kpi-sub {
  font-size: var(--fs-2xs);
  color: var(--color-text-faint);
  margin-top: 4px;
}

/* —— 标签 Tag —— */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  font-size: var(--fs-xs);
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.5;
  background: var(--color-bg-soft);
  color: var(--color-text-muted);
}
.tag--primary { background: var(--color-primary-tint); color: var(--color-primary); }
.tag--success { background: var(--color-secondary-tint); color: var(--color-success); }
.tag--warning { background: var(--color-warning-soft); color: var(--color-warning); }
.tag--danger  { background: var(--color-warning-soft); color: var(--color-warning); }
.tag--info    { background: rgba(107, 123, 140, 0.15); color: var(--color-info); }
.tag--default { background: var(--color-bg-soft); color: var(--color-text-muted); }

/* —— 头像 Avatar —— */
.avatar {
  display: grid; place-items: center;
  background: var(--color-primary-tint);
  color: var(--color-primary);
  font-family: var(--font-serif);
  font-weight: 600;
  border-radius: 50%;
  flex-shrink: 0;
  user-select: none;
}
.avatar--sm { width: 28px; height: 28px; font-size: var(--fs-xs); }
.avatar--md { width: 36px; height: 36px; font-size: var(--fs-sm); }
.avatar--lg { width: 48px; height: 48px; font-size: var(--fs-md); }

/* —— 单元格组合 —— */
.cell-flex {
  display: flex; align-items: center; gap: 8px;
  min-width: 0;
}
.cell-flex > div:last-child {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}

/* —— 按钮 —— */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-bg-elevated);
  color: var(--color-text);
  font-size: var(--fs-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
  font-family: var(--font-sans);
}
.btn:hover { background: var(--color-bg-soft); }
.btn--primary {
  background: var(--color-primary);
  color: var(--color-text-on-dark);
  border-color: var(--color-primary);
}
.btn--primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
}
.btn-mini {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xs);
  background: var(--color-bg-elevated);
  color: var(--color-text);
  font-size: var(--fs-xs);
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all var(--dur-fast) var(--ease-out);
  white-space: nowrap;
}
.btn-mini:hover { background: var(--color-bg-soft); border-color: var(--color-border-strong); }
.btn-mini--primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
.btn-mini--primary:hover { background: var(--color-primary-hover); }
.btn-mini--danger  { background: var(--color-warning-soft); color: var(--color-warning); border-color: var(--color-warning-soft); }
.btn-mini--danger:hover { background: var(--color-warning); color: white; }
.btn-mini--warning { background: var(--color-warning-soft); color: var(--color-warning); border-color: var(--color-warning-soft); }
.btn-mini--warning:hover { background: var(--color-warning); color: white; }

.header-actions { display: flex; gap: var(--space-2); }

/* —— 文本辅助 —— */
.text-muted { color: var(--color-text-muted); }

/* —— 图表标题副文 —— */
.chart-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-3);
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--color-text);
}
.chart-title-meta {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: 400;
  color: var(--color-text-muted);
}

/* —— 家庭关系（绑定）—— */
.binding-tree {
  display: flex; flex-direction: column; gap: var(--space-3);
}
.binding-tree-item {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: var(--space-4);
  align-items: stretch;
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  transition: all var(--dur-base) var(--ease-out);
}
.binding-tree-item:hover {
  border-color: var(--color-primary-soft);
  box-shadow: var(--shadow-sm);
}
.binding-elder {
  display: flex; align-items: center; gap: var(--space-3);
  min-width: 0;
}
.binding-elder-info { flex: 1; min-width: 0; }
.binding-elder-name {
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.binding-elder-meta {
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.binding-elder-status { margin-top: 4px; }
.binding-children {
  display: flex; flex-direction: column; gap: 8px;
  min-width: 0;
}
.binding-child {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 8px 12px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  min-width: 0;
}
.binding-child.is-primary {
  border-left: 3px solid var(--color-primary);
  background: linear-gradient(90deg, var(--color-primary-tint) 0%, var(--color-bg-elevated) 40%);
}

  return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}

function formatDateTime(iso) {
  if (!iso) return '';
  return formatDate(iso) + ' ' + formatTime(iso);
}

function relativeTime(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return `${min} 分钟前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} 小时前`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day} 天前`;
  return formatDate(iso);
}

// 取一个元素并执行回调
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

// 创建元素
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') {
      el.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === 'html') el.innerHTML = v;
    else if (v === false || v == null) continue;
    else el.setAttribute(k, v);
  }
  // 递归处理 children：支持数组（含 .map / 条件 ? a : b 返回的数组）以及嵌套数组
  const appendAll = (parent, nodes) => {
    if (nodes == null || nodes === false) return;
    if (Array.isArray(nodes)) {
      nodes.forEach(n => appendAll(parent, n));
      return;
    }
    if (nodes instanceof Node) {
      parent.appendChild(nodes);
      return;
    }
    // 数字 / 布尔 / 字符串 / 对象等：转成文本
    parent.appendChild(document.createTextNode(String(nodes)));
  };
  appendAll(el, children);
  return el;
}

// 监控手表状态卡（供老人端首页 / 子女端首页共用）

// variant: 'elder' | 'child'  决定详情多少
function watchStatusCard(device, variant = 'child') {
  if (!device) return null;
  const battery = device.battery;
  const isOffline = !device.online;
  const isLow = battery < 20;
  const batteryLevel = isOffline ? 0 : battery;
  const batteryClass = isOffline ? 'watch-battery--offline' : isLow ? 'watch-battery--low' : 'watch-battery--ok';
  // 状态文案
  let statusText, statusColor;
  if (isOffline) {
    statusText = '离线';
    statusColor = 'var(--color-warning)';
  } else if (battery < 10) {
    statusText = '电量耗尽风险';
    statusColor = 'var(--color-warning)';
  } else if (battery < 20) {
    statusText = '电量偏低';
    statusColor = 'var(--color-warning)';
  } else if (battery < 50) {
    statusText = '运行中';
    statusColor = 'var(--color-secondary)';
  } else {
    statusText = '运行正常';
    statusColor = 'var(--color-success)';
  }
  // 信号强度
  const signalBars = isOffline ? 0 : (device.signal === 'strong' ? 4 : device.signal === 'medium' ? 3 : device.signal === 'weak' ? 2 : 0);

  return h('div', { class: `watch-card watch-card--${variant}${isOffline ? ' is-offline' : ''}${isLow ? ' is-low' : ''}` }, [
    // 左侧：手表图标 + 心跳动画
    h('div', { class: 'watch-icon-wrap' }, [
      h('div', { class: 'watch-icon' }, [
        h('div', { class: `watch-bezel watch-bezel--${isOffline ? 'offline' : isLow ? 'low' : 'ok'}` }, [
          h('div', { class: 'watch-screen' }, [
            h('div', { class: 'watch-screen-icon' }, [isOffline ? '⚠' : '♥']),
