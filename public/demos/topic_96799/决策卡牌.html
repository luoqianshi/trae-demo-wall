let currentCategory = null;
let selectedCard = null;
let isFlipping = false;

// ==================== 首页 ====================
function renderHome() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = categories.map((cat, i) => `
    <button class="card-btn fade-in" style="animation-delay: ${i * 0.08}s" onclick="selectCategory('${cat.id}')">
      <div class="icon">${cat.icon}</div>
      <div class="name">${cat.name}</div>
    </button>
  `).join('');
}

function selectCategory(id) {
  currentCategory = categories.find(c => c.id === id);
  document.getElementById('home').classList.remove('active');
  document.getElementById('cardPage').classList.add('active');
  document.getElementById('categoryName').textContent = currentCategory.name;
  document.getElementById('categoryHint').textContent = '选择一张卡牌';
  selectedCard = null;
  isFlipping = false;
  renderCards();
}

function goHome() {
  document.getElementById('cardPage').classList.remove('active');
  document.getElementById('home').classList.add('active');
  currentCategory = null;
  selectedCard = null;
  isFlipping = false;
}

// ==================== 卡牌页 ====================
function renderCards() {
  const container = document.getElementById('cardContainer');
  if (!currentCategory) return;

  // 随机选两个不同的选项
  const shuffled = [...currentCategory.options].sort(() => Math.random() - 0.5);
  const options = [shuffled[0], shuffled[1]];

  container.innerHTML = options.map((opt, i) => `
    <div class="flip-card-wrap" id="card${i}" onclick="flipCard(${i}, '${opt.name}', '${opt.desc}', '${opt.icon}')">
      <div class="flip-card-inner" id="cardInner${i}">
        <div class="flip-card-face flip-card-front">
          <div class="mystery-icon">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

              <circle cx="20" cy="20" r="8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
              <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.3)"/>
            </svg>
          </div>
          <div class="mystery-text">???</div>
        </div>
        <div class="flip-card-face flip-card-back">
          <div class="result-icon">${opt.icon}</div>
          <div class="result-name">${opt.name}</div>
          <div class="result-desc">${opt.desc}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function flipCard(index, name, desc, icon) {
  if (isFlipping) return;
  isFlipping = true;

  const inner = document.getElementById(`cardInner${index}`);
  const wrap = document.getElementById(`card${index}`);
  const otherIndex = index === 0 ? 1 : 0;
  const otherWrap = document.getElementById(`card${otherIndex}`);

  // 隐藏另一张卡
  if (otherWrap) {
    otherWrap.style.transition = 'opacity 0.5s, transform 0.5s';
    otherWrap.style.opacity = '0';
    otherWrap.style.transform = 'scale(0.8)';
    setTimeout(() => { otherWrap.style.display = 'none'; }, 500);
  }

  // 翻转选中的卡
  inner.classList.add('flipped');
  document.getElementById('categoryHint').textContent = '揭晓结果...';

  // 放大并居中
  setTimeout(() => {
    wrap.classList.add('centered');
    wrap.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
  }, 400);

  // 播放音效（Web Audio API）
  playFlipSound();

  // 3秒后允许返回
  setTimeout(() => {
    document.getElementById('categoryHint').textContent = name;
  }, 1000);
}

function playFlipSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1047, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}
