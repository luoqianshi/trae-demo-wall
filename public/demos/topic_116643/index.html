<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>房产税费速算通 - 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #165DFF 0%, #0E42D2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .logo {
    width: 88px;
    height: 88px;
    background: rgba(255,255,255,0.15);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { font-size: 14px; opacity: 0.85; margin-bottom: 32px; }
  .loading {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .loading span {
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite both;
  }
  .loading span:nth-child(1) { animation-delay: -0.32s; }
  .loading span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  .tips {
    position: absolute;
    bottom: 40px;
    font-size: 12px;
    opacity: 0.6;
    text-align: center;
    padding: 0 24px;
  }
</style>
</head>
<body>
  <div class="logo">🏠</div>
  <div class="title">房产税费速算通</div>
  <div class="subtitle">新房 / 二手房 / 商铺 一键测算</div>
  <div class="loading"><span></span><span></span><span></span></div>
  <div class="tips">正在启动 Demo...<br>请使用 Chrome / Edge / Safari 浏览器获得最佳体验</div>

  <script>
    // 根据当前文件位置计算相对路径，兼容 file:// 和 http:// 两种协议
    setTimeout(function() {
      var currentPath = window.location.href;
      var basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
      window.location.href = basePath + '/pages/splash/splash.html';
    }, 1200);
  </script>
</body>
</html>
