<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的收藏 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .favorites-page {
    min-height: 100vh;
    background: var(--bg);
  }
  .fav-card {
    background: var(--bg-white);
    margin: 0 16px 10px;
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    display: flex;
    gap: 12px;
  }
  .fav-card:active {
    background: var(--bg);
  }
  .fav-card .fav-thumb {
    width: 80px;
    height: 60px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .fav-card .fav-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .fav-card .fav-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-title);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .fav-card .fav-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-aux);
    margin-top: 8px;
  }
  .fav-card .remove-btn {
    font-size: 13px;
    color: var(--danger);
    padding: 4px 8px;
  }
</style>
</head>
<body>
<div class="favorites-page page">
  <div class="page-header">
    <div class="back-btn" onclick="Router.goBack()">←</div>
    <div class="title">我的收藏</div>
  </div>

  <div class="page-content" id="favoritesContainer"></div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script src="../../js/newsData.js?v=1.0"></script>
<script>
  function renderFavorites() {
    var favs = Storage.getFavorites();
    var container = document.getElementById('favoritesContainer');

    if (favs.length === 0) {
      container.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">⭐</div>' +
        '<div class="empty-text">暂无收藏政策</div>' +
        '<button class="btn btn-primary" onclick="Router.switchTab(\'news\')">去浏览资讯</button>' +
        '</div>';
      return;
    }

    var html = '';
    favs.forEach(function(fav) {
      var news = NEWS_DATA.list.find(function(n) { return n.id === fav.id; });
      if (!news) return;

      html += '<div class="fav-card" onclick="Router.navigateTo(\'newsDetail\', {id: ' + news.id + '})">' +
        '<div class="fav-thumb" style="background:' + news.color + ';">' + news.category + '</div>' +
        '<div class="fav-info">' +
          '<div class="fav-title">' + news.title + '</div>' +
          '<div class="fav-meta">' +
            '<span>' + news.city + ' · ' + news.date + '</span>' +
            '<span class="remove-btn" onclick="event.stopPropagation(); removeFav(' + news.id + ')">取消收藏</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    });

    container.innerHTML = html;
  }

  function removeFav(id) {
    Storage.toggleFavorite({ id: id });
    renderFavorites();
    showToast('已取消收藏');
  }

  renderFavorites();
</script>
</body>
</html>
