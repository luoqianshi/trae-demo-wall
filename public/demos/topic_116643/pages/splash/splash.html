<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>启动 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .splash-page {
    min-height: 100vh;
    background: linear-gradient(160deg, #165DFF 0%, #0E42D2 50%, #0830A8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .splash-page::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -30%;
    width: 80%;
    height: 60%;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .splash-page::after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -20%;
    width: 70%;
    height: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .splash-logo-wrap {
    width: 110px;
    height: 110px;
    background: rgba(255,255,255,0.12);
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: logoPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }
  @keyframes logoPop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .splash-logo {
    font-size: 64px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
  }
  .splash-title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: 1px;
    animation: fadeUp 0.7s ease 0.2s both;
  }
  .splash-subtitle {
    font-size: 15px;
    opacity: 0.85;
    margin-bottom: 48px;
    animation: fadeUp 0.7s ease 0.35s both;
  }
  @keyframes fadeUp {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .splash-loader {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .splash-footer {
    position: absolute;
    bottom: 44px;
    font-size: 12px;
    opacity: 0.6;
    animation: fadeUp 0.7s ease 0.5s both;
  }
</style>
</head>
<body>
<div class="splash-page">
  <div class="splash-logo-wrap">
    <div class="splash-logo">🏠</div>
  </div>
  <h1 class="splash-title">房产税费速算通</h1>
  <p class="splash-subtitle">新房 / 二手房 / 商铺 税费一键测算</p>
  <div class="splash-loader"></div>
  <div class="splash-footer">专业购房税费计算工具</div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script>
  setTimeout(function() {
    if (Storage.isLoggedIn()) {
      Router.switchTab('index');
    } else {
      Router.navigateTo('login');
    }
  }, 2000);
</script>
</body>
</html>
