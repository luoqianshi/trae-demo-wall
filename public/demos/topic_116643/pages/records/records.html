<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>测算记录 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .records-page {
    min-height: 100vh;
    background: var(--bg);
  }
  .record-card {
    background: var(--bg-white);
    margin: 0 16px 10px;
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .record-card .record-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .record-card .record-type {
    font-size: 13px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--primary-light);
    color: var(--primary);
  }
  .record-card .record-time {
    font-size: 12px;
    color: var(--text-aux);
  }
  .record-card .record-detail {
    font-size: 14px;
    color: var(--text-body);
    margin-bottom: 4px;
  }
  .record-card .record-total {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }
  .record-card .delete-btn {
    position: absolute;
    right: 14px;
    bottom: 14px;
    font-size: 13px;
    color: var(--danger);
    padding: 4px 8px;
  }
  .clear-all-bar {
    text-align: center;
    padding: 16px;
  }
  .clear-all-bar .clear-btn {
    font-size: 14px;
    color: var(--text-aux);
    padding: 8px 16px;
  }
  .type-tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 100px;
    margin-right: 8px;
  }
  .type-new { background: #E8F5E9; color: #2E7D32; }
  .type-second { background: #FFF3E0; color: #E65100; }
  .type-shop { background: #F3E5F5; color: #6A1B9A; }
</style>
</head>
<body>
<div class="records-page page">
  <div class="page-header">
    <div class="back-btn" onclick="Router.goBack()">←</div>
    <div class="title">测算记录</div>
  </div>

  <div class="page-content" id="recordsContainer"></div>

  <div class="clear-all-bar" id="clearAllBar" style="display:none;">
    <button class="clear-btn" onclick="clearAllRecords()">清空全部记录</button>
  </div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script>
  function renderRecords() {
    var records = Storage.getRecords();
    var container = document.getElementById('recordsContainer');
    var clearBar = document.getElementById('clearAllBar');

    if (records.length === 0) {
      container.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">📋</div>' +
        '<div class="empty-text">暂无测算记录</div>' +
        '<button class="btn btn-primary" onclick="Router.switchTab(\'calculate\')">快去测算房屋税费</button>' +
        '</div>';
      clearBar.style.display = 'none';
      return;
    }

    clearBar.style.display = 'block';

    var typeMap = { 'new': '新房', 'second': '二手房', 'shop': '商铺' };
    var typeClassMap = { 'new': 'type-new', 'second': 'type-second', 'shop': 'type-shop' };

    var html = '';
    records.forEach(function(record) {
      var timeStr = new Date(record.time).toLocaleString('zh-CN');
      var typeName = typeMap[record.tradeType] || '测算';
      var typeClass = typeClassMap[record.tradeType] || '';

      html += '<div class="record-card">' +
        '<div class="record-header">' +
          '<div><span class="type-tag ' + typeClass + '">' + typeName + '</span></div>' +
          '<div class="record-time">' + timeStr + '</div>' +
        '</div>' +
        '<div class="record-detail">总价：' + record.price + '万元 | 面积：' + record.area + '㎡</div>' +
        '<div class="record-total">税费合计：' + formatMoney(record.total) + '</div>';

      if (record.loan) {
        html += '<div class="record-detail" style="margin-top:4px;">月供：' + formatMoney(record.loan.monthlyPayment || record.loan.firstMonth) + '</div>';
      }

      html += '<button class="delete-btn" onclick="deleteRecord(' + record.id + ')">删除</button>' +
        '</div>';
    });

    container.innerHTML = html;
  }

  function deleteRecord(id) {
    showConfirm('删除记录', '确定删除这条测算记录吗？', function() {
      Storage.deleteRecord(id);
      renderRecords();
      showToast('已删除');
    });
  }

  function clearAllRecords() {
    showConfirm('清空记录', '确定清空全部测算记录？此操作不可恢复', function() {
      Storage.clearRecords();
      renderRecords();
      showToast('已清空全部记录');
    });
  }

  renderRecords();
</script>
</body>
</html>
