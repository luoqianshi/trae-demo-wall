<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>个人信息 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .userinfo-page {
    min-height: 100vh;
    background: var(--bg);
  }
  .avatar-section {
    text-align: center;
    padding: 24px 0 16px;
    background: var(--bg-white);
    margin-bottom: 12px;
  }
  .avatar-section .avatar-img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 8px;
    position: relative;
  }
  .avatar-section .avatar-camera {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 28px;
    height: 28px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
  }
  .avatar-section .avatar-hint {
    font-size: 13px;
    color: var(--text-aux);
  }
  .form-card {
    background: var(--bg-white);
    margin: 0 16px 12px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .form-card .form-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .form-card .form-item:last-child {
    border-bottom: none;
  }
  .form-card .item-label {
    width: 80px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-title);
    flex-shrink: 0;
  }
  .form-card .item-value {
    flex: 1;
    font-size: 15px;
    color: var(--text-body);
    text-align: right;
  }
  .form-card .item-input {
    flex: 1;
    text-align: right;
    font-size: 15px;
    color: var(--text-title);
  }
  .form-card .item-input::placeholder {
    color: var(--text-disabled);
  }
  .form-card .item-arrow {
    color: var(--text-disabled);
    margin-left: 4px;
  }
  .save-bar {
    padding: 16px;
  }
</style>
</head>
<body>
<div class="userinfo-page page">
  <div class="page-header">
    <div class="back-btn" onclick="Router.goBack()">←</div>
    <div class="title">个人信息</div>
  </div>

  <div class="page-content">
    <!-- Avatar -->
    <div class="avatar-section">
      <div class="avatar-img" onclick="changeAvatar()">
        👤
        <div class="avatar-camera">📷</div>
      </div>
      <div class="avatar-hint">点击更换头像</div>
    </div>

    <!-- Editable Fields -->
    <div class="form-card">
      <div class="form-item">
        <span class="item-label">昵称</span>
        <input type="text" id="nickname" class="item-input" placeholder="请输入昵称" value="">
      </div>
      <div class="form-item" onclick="showCityPicker()">
        <span class="item-label">常住城市</span>
        <span class="item-value" id="cityDisplay">北京</span>
        <span class="item-arrow">›</span>
      </div>
    </div>

    <!-- Read-only -->
    <div class="form-card">
      <div class="form-item">
        <span class="item-label">绑定手机</span>
        <span class="item-value" id="phoneDisplay"></span>
      </div>
    </div>

    <div class="save-bar">
      <button class="btn btn-primary btn-block" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script>
  var user = Storage.getUser();
  var selectedCity = user.city || '北京';

  document.getElementById('nickname').value = user.nickname || '';
  document.getElementById('cityDisplay').textContent = selectedCity;
  document.getElementById('phoneDisplay').textContent = user.phone || '未绑定';

  function changeAvatar() {
    showToast('头像更换功能开发中（Demo模式）');
  }

  function showCityPicker() {
    var cities = ['北京', '上海', '广州', '深圳', '杭州', '南京', '成都', '武汉', '重庆', '天津', '苏州', '西安', '长沙', '青岛', '郑州'];
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.alignItems = 'flex-end';
    var html = '<div class="modal-content" style="width:100%; border-radius:16px 16px 0 0; max-height:60vh; overflow-y:auto; padding:0;">';
    html += '<div style="padding:16px; text-align:center; font-weight:600; border-bottom:1px solid var(--border);">选择城市</div>';
    cities.forEach(function(city) {
      html += '<div style="padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; font-size:15px;' +
        (city === selectedCity ? 'color:var(--primary);font-weight:600;' : '') +
        '" onclick="selectCity(\'' + city + '\')">' + city + '</div>';
    });
    html += '<div style="padding:14px 16px; text-align:center; cursor:pointer; color:var(--text-aux);" onclick="this.closest(\'.modal-overlay\').remove()">取消</div>';
    html += '</div>';
    overlay.innerHTML = html;
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  function selectCity(city) {
    selectedCity = city;
    document.getElementById('cityDisplay').textContent = city;
    document.querySelector('.modal-overlay').remove();
  }

  function saveProfile() {
    var nickname = document.getElementById('nickname').value.trim();
    if (!nickname) {
      showToast('请输入昵称');
      return;
    }
    Storage.saveUser({ nickname: nickname, city: selectedCity });
    showToast('保存成功');
    setTimeout(function() {
      Router.goBack();
    }, 500);
  }
</script>
</body>
</html>
