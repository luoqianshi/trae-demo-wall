<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>政策资讯 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .news-page {
    min-height: 100vh;
    background: var(--bg);
  }
  .category-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg-white);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .category-bar::-webkit-scrollbar {
    display: none;
  }
  .category-bar .tag {
    flex-shrink: 0;
    cursor: pointer;
  }
  .news-list {
    padding: 12px 0;
  }
  .news-card {
    background: var(--bg-white);
    margin: 0 16px 10px;
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    display: flex;
    gap: 12px;
  }
  .news-card:active {
    background: var(--bg);
  }
  .news-card .news-thumb {
    width: 100px;
    height: 75px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .news-card .news-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .news-card .news-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-title);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card .news-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-aux);
  }
  .news-card .news-meta .favorite-btn {
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
  }
  .load-more {
    text-align: center;
    padding: 16px;
    font-size: 14px;
    color: var(--text-aux);
  }
  .pull-hint {
    text-align: center;
    padding: 12px;
    font-size: 13px;
    color: var(--text-disabled);
  }
</style>
</head>
<body>
<div class="news-page page">
  <!-- Category Tabs -->
  <div class="category-bar">
    <span class="tag tag-active" onclick="selectCategory('all', this)">全部</span>
    <span class="tag tag-default" onclick="selectCategory('new', this)">新房政策</span>
    <span class="tag tag-default" onclick="selectCategory('second', this)">二手房税费</span>
    <span class="tag tag-default" onclick="selectCategory('fund', this)">公积金贷款</span>
    <span class="tag tag-default" onclick="selectCategory('tax', this)">税费知识</span>
  </div>

  <!-- News List -->
  <div class="news-list" id="newsList"></div>

  <div class="load-more" id="loadMore" onclick="loadMore()">点击加载更多</div>

  <!-- Bottom Navigation -->
  <div id="bottomNavContainer"></div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script src="../../js/newsData.js?v=1.0"></script>
<script>
  var currentCategory = 'all';
  var currentPage = 1;
  var pageSize = 5;



  // Load bottom nav and highlight current tab
  renderBottomNav('bottomNavContainer', 'news');

  function selectCategory(cat, el) {
    currentCategory = cat;
    currentPage = 1;
    document.querySelectorAll('.category-bar .tag').forEach(function(t) {
      t.classList.remove('tag-active');
      t.classList.add('tag-default');
    });
    el.classList.remove('tag-default');
    el.classList.add('tag-active');
    renderNews();
  }

  var currentKeyword = '';

  function renderNews() {
    var filtered = NEWS_DATA.list;
    if (currentCategory !== 'all') {
      filtered = NEWS_DATA.list.filter(function(n) { return n.category === currentCategory; });
    }
    if (currentKeyword) {
      filtered = filtered.filter(function(n) {
        return n.title.toLowerCase().indexOf(currentKeyword.toLowerCase()) > -1 ||
               n.city.toLowerCase().indexOf(currentKeyword.toLowerCase()) > -1;
      });
    }

    var total = filtered.length;
    var end = currentPage * pageSize;
    var pageData = filtered.slice(0, end);

    var html = '';
    if (pageData.length === 0) {
      html = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无相关政策</div></div>';
    } else {
      pageData.forEach(function(item) {
        var isFav = Storage.isFavorite(item.id);
        html += '<div class="news-card" onclick="Router.navigateTo(\'newsDetail\', {id: ' + item.id + '})">' +
          '<div class="news-thumb" style="background:' + item.color + ';">' + item.category + '</div>' +
          '<div class="news-info">' +
            '<div class="news-title">' + item.title + '</div>' +
            '<div class="news-meta">' +
              '<span>' + item.city + ' · ' + item.date + '</span>' +
              '<span class="favorite-btn" onclick="event.stopPropagation(); toggleFav(' + item.id + ', this)">' + (isFav ? '⭐' : '☆') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    document.getElementById('newsList').innerHTML = html;

    var loadMore = document.getElementById('loadMore');
    if (end >= total) {
      loadMore.textContent = filtered.length === 0 ? '' : '—— 已加载全部 ——';
      loadMore.style.pointerEvents = 'none';
    } else {
      loadMore.textContent = '点击加载更多';
      loadMore.style.pointerEvents = 'auto';
    }
  }

  function loadMore() {
    currentPage++;
    renderNews();
  }

  function toggleFav(id, el) {
    if (!requireLogin()) return;
    var newsItem = NEWS_DATA.list.find(function(n) { return n.id === id; });
    var added = Storage.toggleFavorite({ id: id, title: newsItem ? newsItem.title : '' });
    el.textContent = added ? '⭐' : '☆';
    showToast(added ? '收藏成功' : '已取消收藏');
  }

  // Initial render
  renderNews();

  // Handle keyword search from home page
  (function() {
    var params = Router.getParams();
    if (params.keyword) {
      currentKeyword = decodeURIComponent(params.keyword);
      currentPage = 1;
      showToast('搜索：' + currentKeyword);
      renderNews();
    }
  })();
</script>
</body>
</html>
