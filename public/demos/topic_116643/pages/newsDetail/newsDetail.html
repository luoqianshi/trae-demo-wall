<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>资讯详情 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .detail-page {
    min-height: 100vh;
    background: var(--bg-white);
  }
  .detail-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-header .detail-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-title);
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .detail-header .detail-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-aux);
  }
  .detail-header .detail-meta .fav-btn {
    font-size: 20px;
    padding: 4px;
    cursor: pointer;
  }
  .detail-body {
    padding: 16px;
    font-size: 15px;
    color: var(--text-body);
    line-height: 1.8;
  }
  .detail-body p {
    margin-bottom: 12px;
  }
  .detail-body h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-title);
    margin: 20px 0 10px;
  }
  .detail-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-white);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 12px;
  }
  .detail-bottom-bar .btn {
    flex: 1;
  }
  .detail-content-placeholder {
    padding-bottom: 80px;
  }
</style>
</head>
<body>
<div class="detail-page page">
  <div class="page-header">
    <div class="back-btn" onclick="Router.goBack()">←</div>
    <div class="title">资讯详情</div>
  </div>

  <div class="detail-content-placeholder">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-meta">
        <span id="detailMeta"></span>
        <span class="fav-btn" id="favBtn" onclick="toggleFav()">☆</span>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <div class="detail-bottom-bar">
    <button class="btn btn-outline" onclick="copyContent()">📋 复制文本</button>
    <button class="btn btn-primary" onclick="toggleFav()">⭐ 收藏</button>
  </div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script src="../../js/newsData.js?v=1.0"></script>
<script>
  var currentNewsId = null;

  (function() {
    var params = Router.getParams();
    var id = parseInt(params.id) || 1;
    currentNewsId = id;
    var news = NEWS_DATA.detail[id] || NEWS_DATA.detail[1];

    document.getElementById('detailTitle').textContent = news.title;
    document.getElementById('detailMeta').textContent = news.category + ' · ' + news.city + ' · ' + news.date;
    document.getElementById('detailBody').innerHTML = news.content;

    if (Storage.isFavorite(id)) {
      document.getElementById('favBtn').textContent = '⭐';
    }
  })();

  function toggleFav() {
    if (!requireLogin()) return;
    var news = NEWS_DATA.detail[currentNewsId];
    var added = Storage.toggleFavorite({ id: currentNewsId, title: news.title });
    document.getElementById('favBtn').textContent = added ? '⭐' : '☆';
    showToast(added ? '收藏成功' : '已取消收藏');
  }

  function copyContent() {
    var news = NEWS_DATA.detail[currentNewsId];
    var text = news.title + '\n\n';
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = news.content;
    text += tempDiv.textContent;
    copyToClipboard(text);
  }
</script>
</body>
</html>
