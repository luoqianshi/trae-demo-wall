<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .mine-page {
    min-height: 100vh;
    background: var(--bg);
  }
  .user-header {
    background: var(--primary);
    padding: 32px 20px 28px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .user-header .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .user-header .user-info {
    flex: 1;
  }
  .user-header .user-name {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .user-header .user-phone {
    font-size: 13px;
    opacity: 0.8;
  }
  .user-header .edit-btn {
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 100px;
    color: #fff;
    transition: all 0.2s;
  }
  .user-header .edit-btn:active {
    background: rgba(255,255,255,0.15);
  }
  .menu-section {
    margin: 12px 16px;
    background: var(--bg-white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .menu-section .menu-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-aux);
    padding: 12px 16px 4px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .menu-item:last-child {
    border-bottom: none;
  }
  .menu-item:active {
    background: var(--bg);
  }
  .menu-item .menu-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-item .menu-icon {
    font-size: 20px;
    width: 28px;
    text-align: center;
  }
  .menu-item .menu-label {
    font-size: 15px;
    color: var(--text-title);
  }
  .menu-item .menu-right {
    font-size: 14px;
    color: var(--text-aux);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .menu-item .menu-arrow {
    font-size: 14px;
    color: var(--text-disabled);
  }
  .menu-item .menu-badge {
    background: var(--danger);
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 4px;
  }
  .logout-section {
    padding: 24px 16px;
    text-align: center;
  }
  .logout-btn {
    display: inline-block;
    padding: 10px 40px;
    font-size: 15px;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    background: none;
  }
  .logout-btn:active {
    background: #FFF0F0;
  }
  .stats-row {
    display: flex;
    padding: 16px 0;
    margin: 0 16px;
    background: var(--bg-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .stats-row .stat-item {
    flex: 1;
    text-align: center;
  }
  .stats-row .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
  }
  .stats-row .stat-label {
    font-size: 12px;
    color: var(--text-aux);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="mine-page page">
  <!-- User Header -->
  <div class="user-header" id="userHeader">
    <div class="avatar" id="userAvatar">👤</div>
    <div class="user-info">
      <div class="user-name" id="userName">点击登录</div>
      <div class="user-phone" id="userPhone">解锁测算记录与收藏</div>
    </div>
    <button class="edit-btn" id="editBtn" onclick="handleEdit()" style="display:none;">编辑资料</button>
  </div>

  <!-- Stats -->
  <div class="stats-row" style="margin-top: 12px;">
    <div class="stat-item">
      <div class="stat-value" id="recordCount">0</div>
      <div class="stat-label">测算记录</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="favCount">0</div>
      <div class="stat-label">收藏政策</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="loginDays">0</div>
      <div class="stat-label">使用天数</div>
    </div>
  </div>

  <!-- Menu Section -->
  <div class="menu-section">
    <div class="menu-item" onclick="goToPage('records')">
      <div class="menu-left">
        <span class="menu-icon">📋</span>
        <span class="menu-label">我的测算记录</span>
      </div>
      <div class="menu-right">
        <span class="menu-badge" id="recordBadge" style="display:none;">0</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>
    <div class="menu-item" onclick="goToPage('favorites')">
      <div class="menu-left">
        <span class="menu-icon">⭐</span>
        <span class="menu-label">我的收藏</span>
      </div>
      <div class="menu-right">
        <span class="menu-arrow">›</span>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-item" onclick="goToPage('userInfo')">
      <div class="menu-left">
        <span class="menu-icon">✏️</span>
        <span class="menu-label">个人信息配置</span>
      </div>
      <div class="menu-right">
        <span class="menu-arrow">›</span>
      </div>
    </div>
    <div class="menu-item" onclick="goToPage('setting')">
      <div class="menu-left">
        <span class="menu-icon">⚙️</span>
        <span class="menu-label">系统设置</span>
      </div>
      <div class="menu-right">
        <span class="menu-arrow">›</span>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-item" onclick="showToast('意见反馈功能开发中')">
      <div class="menu-left">
        <span class="menu-icon">💬</span>
        <span class="menu-label">意见反馈</span>
      </div>
      <div class="menu-right">
        <span class="menu-arrow">›</span>
      </div>
    </div>
    <div class="menu-item" onclick="showToast('房产税费速算通 V1.0.0')">
      <div class="menu-left">
        <span class="menu-icon">ℹ️</span>
        <span class="menu-label">关于我们</span>
      </div>
      <div class="menu-right">
        <span style="font-size:13px;">V1.0.0</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>
  </div>

  <!-- Logout -->
  <div class="logout-section" id="logoutSection" style="display:none;">
    <button class="logout-btn" onclick="handleLogout()">退出登录</button>
  </div>

  <!-- Bottom Navigation -->
  <div id="bottomNavContainer"></div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script>
  // Load bottom nav and highlight current tab
  renderBottomNav('bottomNavContainer', 'mine');

  function goToPage(page) {
    if (!Storage.isLoggedIn() && (page === 'records' || page === 'favorites' || page === 'userInfo')) {
      Router.navigateTo('login', { redirect: page });
      return;
    }
    Router.navigateTo(page);
  }

  function handleEdit() {
    if (Storage.isLoggedIn()) {
      Router.navigateTo('userInfo');
    } else {
      Router.navigateTo('login');
    }
  }

  function handleLogout() {
    showConfirm('确认退出', '退出后需重新登录才能查看测算记录', function() {
      Storage.logout();
      showToast('已退出登录');
      renderPage();
    });
  }

  function renderPage() {
    var loggedIn = Storage.isLoggedIn();
    var user = Storage.getUser();
    var records = Storage.getRecords();
    var favs = Storage.getFavorites();

    if (loggedIn) {
      document.getElementById('userAvatar').textContent = '👤';
      document.getElementById('userName').textContent = user.nickname || '用户';
      document.getElementById('userPhone').textContent = user.phone || '';
      document.getElementById('editBtn').style.display = 'block';
      document.getElementById('logoutSection').style.display = 'block';
    } else {
      document.getElementById('userAvatar').textContent = '👤';
      document.getElementById('userName').textContent = '点击登录';
      document.getElementById('userPhone').textContent = '解锁测算记录与收藏';
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('logoutSection').style.display = 'none';
    }

    document.getElementById('recordCount').textContent = records.length;
    document.getElementById('favCount').textContent = favs.length;
    var loginDays = 0;
    if (loggedIn) {
      var loginInfo = Storage.get(STORAGE_KEYS.LOGIN) || {};
      var loginTime = loginInfo.time || Date.now();
      loginDays = Math.max(1, Math.ceil((Date.now() - loginTime) / 86400000));
    }
    document.getElementById('loginDays').textContent = loginDays;

    var badge = document.getElementById('recordBadge');
    if (records.length > 0) {
      badge.style.display = 'inline';
      badge.textContent = records.length;
    } else {
      badge.style.display = 'none';
    }
  }

  // Click user header to login
  document.getElementById('userHeader').onclick = function() {
    if (!Storage.isLoggedIn()) {
      Router.navigateTo('login');
    }
  };

  renderPage();
</script>
</body>
</html>
