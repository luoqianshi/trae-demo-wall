<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>登录 - 房产税费速算通</title>
<link rel="stylesheet" href="../../css/global.css?v=1.0">
<style>
  .login-page { min-height: 100vh; background: var(--bg-white); display: flex; flex-direction: column; }
  .login-header { display: flex; align-items: center; height: 44px; padding: 0 16px; }
  .login-header .back { font-size: 20px; color: var(--text-title); }
  .login-body { flex: 1; padding: 0 32px; display: flex; flex-direction: column; }
  .login-logo { text-align: center; margin: 40px 0 32px; }
  .login-logo .logo-icon { font-size: 56px; margin-bottom: 12px; }
  .login-logo h1 { font-size: 24px; font-weight: 700; color: var(--text-title); margin-bottom: 6px; }
  .login-logo p { font-size: 14px; color: var(--text-aux); }
  .login-tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
  .login-tabs .tab { flex: 1; text-align: center; padding: 12px 0; font-size: 16px; font-weight: 500; color: var(--text-aux); cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .login-tabs .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .sms-input-row { display: flex; gap: 12px; }
  .sms-input-row .form-input { flex: 1; }
  .sms-btn { height: 48px; padding: 0 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; white-space: nowrap; background: var(--primary-light); color: var(--primary); min-width: 110px; }
  .sms-btn:disabled { background: var(--bg); color: var(--text-disabled); }
  .sms-btn.counting { background: var(--bg); color: var(--text-aux); }
  .agreement { display: flex; align-items: center; gap: 8px; margin: 20px 0 24px; font-size: 13px; color: var(--text-aux); }
  .agreement input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
  .agreement a { color: var(--primary); }
  .login-footer { text-align: center; padding: 20px 0; font-size: 12px; color: var(--text-disabled); }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-header">
    <a class="back" onclick="Router.goBack()">←</a>
  </div>
  <div class="login-body">
    <div class="login-logo">
      <div class="logo-icon">🏠</div>
      <h1>房产税费速算通</h1>
      <p>新房/二手房一键测算契税、个税、贷款月供</p>
    </div>
    <div class="login-tabs">
      <div class="tab active" onclick="switchLoginTab('sms')">验证码登录</div>
      <div class="tab" onclick="switchLoginTab('pwd')">密码登录</div>
    </div>
    <div id="smsPanel">
      <div class="form-group">
        <label class="form-label">手机号码</label>
        <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" maxlength="11" oninput="checkLoginForm()">
      </div>
      <div class="form-group">
        <label class="form-label">验证码</label>
        <div class="sms-input-row">
          <input type="text" id="smsCode" class="form-input" placeholder="请输入验证码" maxlength="6" oninput="checkLoginForm()">
          <button class="sms-btn" id="smsBtn" onclick="sendSms()">获取验证码</button>
        </div>
      </div>
    </div>
    <div id="pwdPanel" style="display:none">
      <div class="form-group">
        <label class="form-label">手机号码</label>
        <input type="tel" id="phone2" class="form-input" placeholder="请输入手机号" maxlength="11" oninput="checkLoginForm()">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" id="password" class="form-input" placeholder="请输入密码" oninput="checkLoginForm()">
      </div>
    </div>
    <div class="agreement">
      <input type="checkbox" id="agree" onchange="checkLoginForm()">
      <span>已阅读并同意 <a href="javascript:void(0)" onclick="showToast('《用户服务协议》详情')">《用户服务协议》</a> 和 <a href="javascript:void(0)" onclick="showToast('《隐私政策》详情')">《隐私政策》</a></span>
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" disabled onclick="doLogin()">立即登录</button>
    <div style="text-align:center; margin-top: 16px;">
      <span style="color:var(--text-aux); font-size:14px;">第三方快捷登录</span>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top: 12px; color: #07C160;" onclick="showToast('微信登录功能开发中')">
      💬 微信快捷登录
    </button>
  </div>
  <div class="login-footer">专业购房税费计算工具</div>
</div>

<script src="../../js/storage.js?v=1.0"></script>
<script src="../../js/router.js?v=1.0"></script>
<script>
  var loginType = 'sms';
  var countdown = 0;

  function switchLoginTab(type) {
    loginType = type;
    document.querySelectorAll('.login-tabs .tab').forEach(function(t, i) {
      t.classList.toggle('active', (i === 0 && type === 'sms') || (i === 1 && type === 'pwd'));
    });
    document.getElementById('smsPanel').style.display = type === 'sms' ? 'block' : 'none';
    document.getElementById('pwdPanel').style.display = type === 'pwd' ? 'block' : 'none';
    checkLoginForm();
  }

  function checkLoginForm() {
    var phone = document.getElementById(loginType === 'sms' ? 'phone' : 'phone2').value;
    var agree = document.getElementById('agree').checked;
    var valid = false;
    if (loginType === 'sms') {
      var code = document.getElementById('smsCode').value;
      valid = phone.length === 11 && code.length >= 4 && agree;
    } else {
      var pwd = document.getElementById('password').value;
      valid = phone.length === 11 && pwd.length >= 6 && agree;
    }
    document.getElementById('loginBtn').disabled = !valid;
  }

  function sendSms() {
    var phone = document.getElementById('phone').value;
    if (phone.length !== 11) { showToast('请输入正确的手机号'); return; }
    if (countdown > 0) return;
    countdown = 60;
    var btn = document.getElementById('smsBtn');
    btn.classList.add('counting');
    btn.textContent = countdown + 's后重发';
    btn.disabled = true;
    var timer = setInterval(function() {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btn.textContent = '获取验证码';
        btn.classList.remove('counting');
        btn.disabled = false;
      } else {
        btn.textContent = countdown + 's后重发';
      }
    }, 1000);
    showToast('验证码已发送，Demo模式下输入任意4位数字即可');
  }

  function doLogin() {
    var phone = document.getElementById(loginType === 'sms' ? 'phone' : 'phone2').value;
    if (phone.length !== 11) { showToast('请输入正确的手机号'); return; }
    Storage.login(phone);
    Storage.saveUser({ phone: phone });
    showToast('登录成功');
    setTimeout(function() {
      Router.switchTab('index');
    }, 500);
  }
</script>
</body>
</html>
