<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048情绪版</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
        radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
    animation: float 20s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-30px, 30px) rotate(2deg); }
}

.top-bar {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    z-index: 1;
}

.back-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(-3px);
}

.game-title {
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 10px rgba(236, 72, 153, 0.5);
}

.collection-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}

.collection-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(3px);
}

.score-panel {
    width: 100%;
    max-width: 500px;
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    z-index: 1;
}

.score-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 16px;
    padding: 15px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.score-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 5px;
}

.score-value {
    font-size: 24px;
    font-weight: bold;
    color: white;
}

.best-score .score-value {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.game-container {
    position: relative;
    z-index: 1;
}

.board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
}

.cell {
    width: 80px;
    height: 80px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    transition: all 0.15s ease;
    position: relative;
}

.cell.tile {
    animation: pop 0.2s ease;
}

@keyframes pop {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

.cell.merged {
    animation: merge 0.3s ease;
}

@keyframes merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

.cell[data-level="1"] { background: linear-gradient(135deg, #94a3b8, #64748b); }
.cell[data-level="2"] { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
.cell[data-level="3"] { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
.cell[data-level="4"] { background: linear-gradient(135deg, #f472b6, #ec4899); }
.cell[data-level="5"] { background: linear-gradient(135deg, #fb923c, #f97316); }
.cell[data-level="6"] { background: linear-gradient(135deg, #facc15, #eab308); }
.cell[data-level="7"] { background: linear-gradient(135deg, #4ade80, #22c55e); }
.cell[data-level="8"] { background: linear-gradient(135deg, #2dd4bf, #14b8a6); }
.cell[data-level="9"] { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
.cell[data-level="10"] { background: linear-gradient(135deg, #f472b6, #8b5cf6); box-shadow: 0 0 30px rgba(236, 72, 153, 0.6); }

.controls {
    width: 100%;
    max-width: 500px;
    display: flex;
    gap: 15px;
    margin-top: 25px;
    z-index: 1;
}

.btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.tip {
    margin-top: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    text-align: center;
    z-index: 1;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal {
    background: rgba(30, 30, 60, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
}

.collection-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.collection-item {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
    transition: all 0.3s;
}

.collection-item.locked {
    filter: grayscale(1) brightness(0.5);
}

.collection-item.locked::after {
    content: '🔒';
    position: absolute;
    font-size: 16px;
}

.collection-item.unlocked:hover {
    transform: scale(1.1);
}

.collection-item.unlocked {
    animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
    50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
}

.modal-close {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.modal-close:hover {
    transform: scale(1.02);
}

.game-over-modal .modal {
    text-align: center;
}

.game-over-emoji {
    font-size: 64px;
    margin-bottom: 15px;
}

.game-over-text {
    color: white;
    font-size: 18px;
    margin-bottom: 10px;
}

.game-over-score {
    color: #fbbf24;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

@media (max-width: 400px) {
    .cell {
        width: 65px;
        height: 65px;
        font-size: 32px;
    }
    
    .board {
        gap: 8px;
        padding: 8px;
    }
    
    .game-title {
        font-size: 22px;
    }
}
</style>
</head>
<body>
    <div class="top-bar">
        <a href="game-hub.html" class="back-btn">← 返回</a>
        <h1 class="game-title">😊 2048情绪版</h1>
        <button class="collection-btn" onclick="showCollection()">📚 图鉴</button>
    </div>
    
    <div class="score-panel">
        <div class="score-box">
            <div class="score-label">当前分数</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box best-score">
            <div class="score-label">最高分</div>
            <div class="score-value" id="bestScore">0</div>
        </div>
    </div>
    
    <div class="game-container">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn btn-secondary" onclick="resetGame()">🔄 重新开始</button>
    </div>
    
    <p class="tip">使用方向键或滑动屏幕来移动表情<br>合成更高级的表情，收集全部10种！</p>
    
    <div class="modal-overlay" id="collectionModal">
        <div class="modal">
            <h2>📚 表情图鉴</h2>
            <div class="collection-grid" id="collectionGrid"></div>
            <button class="modal-close" onclick="closeCollection()">关闭</button>
        </div>
    </div>
    
    <div class="modal-overlay game-over-modal" id="gameOverModal">
        <div class="modal">
            <div class="game-over-emoji" id="gameOverEmoji">😢</div>
            <div class="game-over-text">游戏结束！</div>
            <div class="game-over-score" id="gameOverScore">0</div>
            <button class="modal-close" onclick="resetGame(); closeGameOver();">再来一局</button>
        </div>
    </div>

<script>
const EMOJIS = ['😐', '😊', '🤩', '🥳', '🤗', '😇', '🥰', '😍', '🌟', '💫'];
const GRID_SIZE = 4;
let grid = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem('2048_best') || '0');
let unlockedEmojis = JSON.parse(localStorage.getItem('2048_unlocked') || '[1, 2]');

function init() {
    document.getElementById('bestScore').textContent = bestScore;
    resetGame();
    setupControls();
}

function resetGame() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
    score = 0;
    updateScore();
    addRandomTile();
    addRandomTile();
    render();
}

function addRandomTile() {
    const empty = [];
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            if (grid[i][j] === 0) empty.push([i, j]);
        }
    }
    if (empty.length === 0) return false;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 1 : 2;
    return true;
}

function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (grid[i][j] > 0) {
                cell.classList.add('tile');
                cell.dataset.level = grid[i][j];
                cell.textContent = EMOJIS[grid[i][j] - 1];
            }
            board.appendChild(cell);
        }
    }
}

function updateScore() {
    document.getElementById('score').textContent = score;
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048_best', bestScore);
        document.getElementById('bestScore').textContent = bestScore;
    }
}

function unlockEmoji(level) {
    if (!unlockedEmojis.includes(level)) {
        unlockedEmojis.push(level);
        unlockedEmojis.sort((a, b) => a - b);
        localStorage.setItem('2048_unlocked', JSON.stringify(unlockedEmojis));
    }
}

function move(direction) {
    let moved = false;
    let merged = [];
    
    const newGrid = grid.map(row => [...row]);
    
    if (direction === 'left' || direction === 'right') {
        for (let i = 0; i < GRID_SIZE; i++) {
            let row = newGrid[i].filter(x => x !== 0);
            if (direction === 'right') row.reverse();
            
            const newRow = [];
            for (let j = 0; j < row.length; j++) {
                if (j < row.length - 1 && row[j] === row[j + 1]) {
                    const newLevel = row[j] + 1;
                    newRow.push(newLevel);
                    score += Math.pow(2, newLevel);
                    unlockEmoji(newLevel);
                    merged.push([i, direction === 'right' ? GRID_SIZE - 1 - newRow.length + 1 : newRow.length - 1]);
                    j++;
                } else {
                    newRow.push(row[j]);
                }
            }
            while (newRow.length < GRID_SIZE) newRow.push(0);
            if (direction === 'right') newRow.reverse();
            
            for (let j = 0; j < GRID_SIZE; j++) {
                if (newGrid[i][j] !== newRow[j]) moved = true;
                newGrid[i][j] = newRow[j];
            }
        }
    } else {
        for (let j = 0; j < GRID_SIZE; j++) {
            let col = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                if (newGrid[i][j] !== 0) col.push(newGrid[i][j]);
            }
            if (direction === 'down') col.reverse();
            
            const newCol = [];
            for (let i = 0; i < col.length; i++) {
                if (i < col.length - 1 && col[i] === col[i + 1]) {
                    const newLevel = col[i] + 1;
                    newCol.push(newLevel);
                    score += Math.pow(2, newLevel);
                    unlockEmoji(newLevel);
                    i++;
                } else {
                    newCol.push(col[i]);
                }
            }
            while (newCol.length < GRID_SIZE) newCol.push(0);
            if (direction === 'down') newCol.reverse();
            
            for (let i = 0; i < GRID_SIZE; i++) {
                if (newGrid[i][j] !== newCol[i]) moved = true;
                newGrid[i][j] = newCol[i];
            }
        }
    }
    
    if (moved) {
        grid = newGrid;
        addRandomTile();
        updateScore();
        render();
        checkGameOver();
    }
}

function checkGameOver() {
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            if (grid[i][j] === 0) return;
            if (j < GRID_SIZE - 1 && grid[i][j] === grid[i][j + 1]) return;
            if (i < GRID_SIZE - 1 && grid[i][j] === grid[i + 1][j]) return;
        }
    }
    showGameOver();
}

function showGameOver() {
    document.getElementById('gameOverScore').textContent = score;
    document.getElementById('gameOverModal').classList.add('active');
}

function closeGameOver() {
    document.getElementById('gameOverModal').classList.remove('active');
}

function showCollection() {
    const grid = document.getElementById('collectionGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
        const item = document.createElement('div');
        item.className = 'collection-item ' + (unlockedEmojis.includes(i) ? 'unlocked' : 'locked');
        item.textContent = EMOJIS[i - 1];
        item.title = '等级 ' + i;
        grid.appendChild(item);
    }
    document.getElementById('collectionModal').classList.add('active');
}

function closeCollection() {
    document.getElementById('collectionModal').classList.remove('active');
}

function setupControls() {
    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': e.preventDefault(); move('up'); break;
            case 'ArrowDown': e.preventDefault(); move('down'); break;
            case 'ArrowLeft': e.preventDefault(); move('left'); break;
            case 'ArrowRight': e.preventDefault(); move('right'); break;
        }
    });
    
    let touchStartX, touchStartY;
    const board = document.getElementById('board');
    
    board.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    
    board.addEventListener('touchend', (e) => {
        if (!touchStartX || !touchStartY) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        
        if (Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 30) {
                move(dx > 0 ? 'right' : 'left');
            }
        } else {
            if (Math.abs(dy) > 30) {
                move(dy > 0 ? 'down' : 'up');
            }
        }
        touchStartX = null;
        touchStartY = null;
    }, { passive: true });
}

init();
</script>
</body>
</html>
