<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>写给未来 · 心迹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fff0f0 0%, #ffe4e1 30%, #ffdab9 60%, #fff8dc 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.3;
      animation: float-up 15s linear infinite;
    }

    @keyframes float-up {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 50px 20px 20px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 400;
      color: #8b4513;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
    }

    .header p {
      font-size: 13px;
      color: #a0522d;
      font-weight: 300;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      color: #8b4513;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-weight: 400;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.85);
    }

    .mailbox-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      color: #8b4513;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mailbox-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
    }

    .mailbox-btn.has-new::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .letter-container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .letter-paper {
      background: linear-gradient(180deg, #fffaf0 0%, #fff8dc 100%);
      border-radius: 5px;
      padding: 40px 30px 30px;
      box-shadow: 0 10px 40px rgba(139, 69, 19, 0.15);
      position: relative;
      min-height: 400px;
    }

    .letter-paper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 15px;
      background: repeating-linear-gradient(
        -45deg,
        #ffdab9,
        #ffdab9 10px,
        #deb887 10px,
        #deb887 20px
      );
      border-radius: 5px 5px 0 0;
    }

    .letter-lines {
      position: absolute;
      top: 55px;
      left: 30px;
      right: 30px;
      bottom: 30px;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 27px,
        #deb887 27px,
        #deb887 28px
      );
      pointer-events: none;
      opacity: 0.4;
    }

    .date-label {
      font-size: 13px;
      color: #a0522d;
      margin-bottom: 20px;
      font-weight: 300;
      position: relative;
    }

    .letter-title {
      font-size: 18px;
      color: #8b4513;
      margin-bottom: 20px;
      font-weight: 500;
      position: relative;
    }

    .letter-textarea {
      width: 100%;
      min-height: 200px;
      border: none;
      background: transparent;
      font-size: 15px;
      line-height: 28px;
      color: #5d4e37;
      font-family: "楷体", "KaiTi", "STKaiti", serif;
      resize: none;
      outline: none;
      position: relative;
      z-index: 1;
    }

    .letter-textarea::placeholder {
      color: #d2b48c;
    }

    .time-select {
      margin-top: 25px;
      position: relative;
      z-index: 1;
    }

    .time-label {
      font-size: 13px;
      color: #a0522d;
      margin-bottom: 12px;
      font-weight: 400;
    }

    .time-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .time-option {
      flex: 1;
      min-width: 80px;
      padding: 12px 10px;
      background: rgba(255, 248, 220, 0.5);
      border: 2px solid transparent;
      border-radius: 12px;
      color: #8b4513;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      font-weight: 300;
    }

    .time-option:hover {
      background: rgba(255, 218, 185, 0.6);
    }

    .time-option.selected {
      background: rgba(255, 182, 193, 0.4);
      border-color: #ff6b6b;
      color: #8b4513;
    }

    .send-btn {
      display: block;
      margin: 30px auto 0;
      padding: 14px 50px;
      background: linear-gradient(135deg, #ffb6c1 0%, #ff6b6b 100%);
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 400;
      letter-spacing: 2px;
      box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
    }

    .send-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .send-btn:active {
      transform: translateY(-1px);
    }

    .envelope-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 69, 19, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      backdrop-filter: blur(5px);
    }

    .envelope-animation.show {
      display: flex;
    }

    .envelope {
      width: 200px;
      height: 140px;
      background: linear-gradient(135deg, #deb887 0%, #d2691e 100%);
      border-radius: 5px;
      position: relative;
      animation: envelope-fly 2s ease-in-out forwards;
    }

    @keyframes envelope-fly {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateY(-100px) rotate(-10deg) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translateY(-500px) rotate(20deg) scale(0.5);
        opacity: 0;
      }
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 70px solid #f5deb3;
      border-radius: 5px 5px 0 0;
    }

    .stamp {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 50px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ffb6c1 100%);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transform: rotate(10deg);
    }

    .mailbox {
      position: absolute;
      bottom: 10%;
      right: 10%;
      font-size: 100px;
      opacity: 0;
      animation: mailbox-appear 1s ease-out 1.5s forwards;
    }

    @keyframes mailbox-appear {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 69, 19, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #fffaf0 0%, #fff8dc 100%);
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 450px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 60px rgba(139, 69, 19, 0.2);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 500;
      color: #8b4513;
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-close {
      display: block;
      margin: 20px auto 0;
      padding: 10px 30px;
      background: linear-gradient(135deg, #deb887 0%, #d2691e 100%);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .modal-close:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(210, 105, 30, 0.4);
    }

    .mailbox-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mail-item {
      background: rgba(255, 248, 220, 0.6);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .mail-item:hover {
      background: rgba(255, 228, 225, 0.8);
      transform: translateX(5px);
    }

    .mail-item.unread {
      border-color: #ff6b6b;
      background: rgba(255, 182, 193, 0.3);
    }

    .mail-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .mail-item-title {
      font-size: 14px;
      color: #8b4513;
      font-weight: 500;
    }

    .mail-item-date {
      font-size: 11px;
      color: #a0522d;
      font-weight: 300;
    }

    .mail-item-preview {
      font-size: 12px;
      color: #a0522d;
      opacity: 0.7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mail-empty {
      text-align: center;
      padding: 40px 20px;
      color: #d2b48c;
      font-size: 14px;
    }

    .mail-empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .letter-view {
      font-family: "楷体", "KaiTi", "STKaiti", serif;
      font-size: 15px;
      line-height: 2;
      color: #5d4e37;
      white-space: pre-wrap;
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 10px;
    }

    .letter-from {
      text-align: right;
      margin-top: 15px;
      font-size: 13px;
      color: #a0522d;
      font-style: italic;
    }

    .new-letter-banner {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, #ffb6c1 0%, #ff6b6b 100%);
      color: white;
      padding: 12px 25px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 200;
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
    }

    .new-letter-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .stamp-selector {
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .stamp-label {
      font-size: 13px;
      color: #a0522d;
      margin-bottom: 10px;
      font-weight: 400;
    }

    .stamp-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stamp-option {
      width: 45px;
      height: 55px;
      background: rgba(255, 248, 220, 0.5);
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .stamp-option:hover {
      transform: translateY(-3px);
    }

    .stamp-option.selected {
      border-color: #ff6b6b;
      background: rgba(255, 182, 193, 0.3);
    }

    @media (max-width: 480px) {
      .letter-paper {
        padding: 35px 20px 25px;
      }
      .letter-lines {
        left: 20px;
        right: 20px;
      }
      .header h1 {
        font-size: 24px;
      }
      .time-option {
        min-width: 70px;
        padding: 10px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floatingHearts"></div>

  <button class="back-btn" onclick="window.location.href='game-hub.html'">← 返回长廊</button>
  <button class="mailbox-btn" id="mailboxBtn">📮 信箱</button>

  <div class="new-letter-banner" id="newLetterBanner" onclick="openMailbox()">
    ✉️ 有新来信啦！点击查看
  </div>

  <div class="header">
    <h1>写给未来</h1>
    <p>写一封信，给未来的自己</p>
  </div>

  <div class="letter-container">
    <div class="letter-paper">
      <div class="letter-lines"></div>
      <div class="date-label" id="dateLabel"></div>
      <div class="letter-title">亲爱的未来的自己：</div>
      <textarea 
        class="letter-textarea" 
        id="letterText" 
        placeholder="你想对未来的自己说点什么呢...&#10;&#10;也许是现在的心情，&#10;也许是小小的愿望，&#10;也许是某个重要的决定..."
      ></textarea>
      
      <div class="stamp-selector">
        <div class="stamp-label">选一张邮票 🎨</div>
        <div class="stamp-options" id="stampOptions">
          <div class="stamp-option selected" data-stamp="🌸">🌸</div>
          <div class="stamp-option" data-stamp="🌙">🌙</div>
          <div class="stamp-option" data-stamp="⭐">⭐</div>
          <div class="stamp-option" data-stamp="🍀">🍀</div>
          <div class="stamp-option" data-stamp="💝">💝</div>
          <div class="stamp-option" data-stamp="🌈">🌈</div>
        </div>
      </div>

      <div class="time-select">
        <div class="time-label">什么时候寄到？⏰</div>
        <div class="time-options" id="timeOptions">
          <div class="time-option selected" data-days="7">1周后</div>
          <div class="time-option" data-days="30">1个月后</div>
          <div class="time-option" data-days="90">3个月后</div>
          <div class="time-option" data-days="365">1年后</div>
        </div>
      </div>

      <button class="send-btn" id="sendBtn">装进信封寄出</button>
    </div>
  </div>

  <div class="envelope-animation" id="envelopeAnimation">
    <div class="envelope">
      <div class="stamp" id="animationStamp">🌸</div>
    </div>
    <div class="mailbox">📮</div>
  </div>

  <div class="modal" id="mailboxModal">
    <div class="modal-content">
      <div class="modal-title">📮 我的信箱</div>
      <div class="mailbox-list" id="mailboxList"></div>
      <button class="modal-close" onclick="closeMailbox()">关闭</button>
    </div>
  </div>

  <div class="modal" id="letterModal">
    <div class="modal-content">
      <div class="modal-title" id="letterModalTitle">一封信</div>
      <div class="letter-view" id="letterContent"></div>
      <div class="letter-from" id="letterFrom"></div>
      <button class="modal-close" onclick="closeLetterModal()">关闭</button>
    </div>
  </div>

  <script>
    const replyTemplates = [
      {
        condition: 'sad',
        replies: [
          '亲爱的过去的我，谢谢你写下这些。现在的我想告诉你，那些你以为熬不过去的日子，其实都变成了让你更坚强的养分。你比想象中更勇敢。',
          '嗨，过去的自己。看到你写的这些，好想抱抱当时的你。想告诉你，一切都会好起来的，真的。现在的我，正在阳光下微笑呢。',
          '过去的我，你好吗？我知道你现在很难过，但请相信，时间真的有魔法。那些让你流泪的事，有一天你会笑着说出来。加油，我在未来等你。'
        ]
      },
      {
        condition: 'happy',
        replies: [
          '哇！看到过去的自己这么开心，我也跟着笑了。谢谢你把这份快乐记录下来，现在读起来还是暖暖的。要一直这么开心下去哦！',
          '亲爱的我，你知道吗？你当时的快乐真的感染到现在的我了。那些美好的时刻，我都好好珍藏着。谢谢你这么努力地生活着。',
          '哈哈，看到你写的这些，嘴角不自觉地上扬。那时候的快乐真的好纯粹啊。现在的我也在继续创造更多美好的回忆呢！'
        ]
      },
      {
        condition: 'calm',
        replies: [
          '你好呀，过去的自己。谢谢你写下的这些平静的心情。现在的我偶尔也会感到迷茫，但想起这份平静，就觉得心安了。',
          '嗨，看到你写的话，心里暖暖的。你说的那些小小的幸福，我现在还能感受到呢。生活就是这样，平淡中藏着温柔。',
          '亲爱的我，谢谢你记录下这些平静的时光。现在的我明白了，平静也是一种力量。愿我们都能一直拥有这份从容。'
        ]
      },
      {
        condition: 'default',
        replies: [
          '亲爱的过去的自己，谢谢你写下这封信。时间过得真快啊，现在读起来，好像又回到了那个时候。想告诉你，你经历的一切都有意义。',
          '你好呀，我是未来的你。看到这封信的时候，我笑了。谢谢你没有放弃，谢谢你一直这么努力。现在的我，正在往更好的方向走。',
          '嗨，过去的我。你猜怎么着？你担心的那些事，很多都没有发生呢。而你期待的那些，有些已经实现了。生活还是很美好的，对吧？',
          '亲爱的自己，谢谢你写这封信给我。看到你的文字，我想起了很多差点忘记的事。想告诉你，你真的很棒，以后也会一直棒下去的。',
          '你好，过去的自己。时间真的是个神奇的东西，它带走了一些，也带来了一些。但不管怎样，谢谢你当时的坚持和温柔。',
          '嗨，我收到你的信啦！虽然我们是同一个人，但读起来还是很感动。想对你说：你做得很好，继续加油，我在未来等你。'
        ]
      }
    ];

    let selectedDays = 7;
    let selectedStamp = '🌸';
    let letters = JSON.parse(localStorage.getItem('futureLetters') || '[]');

    const dateLabel = document.getElementById('dateLabel');
    const letterText = document.getElementById('letterText');
    const timeOptions = document.getElementById('timeOptions');
    const stampOptions = document.getElementById('stampOptions');
    const sendBtn = document.getElementById('sendBtn');
    const mailboxBtn = document.getElementById('mailboxBtn');
    const mailboxModal = document.getElementById('mailboxModal');
    const mailboxList = document.getElementById('mailboxList');
    const letterModal = document.getElementById('letterModal');
    const letterModalTitle = document.getElementById('letterModalTitle');
    const letterContent = document.getElementById('letterContent');
    const letterFrom = document.getElementById('letterFrom');
    const envelopeAnimation = document.getElementById('envelopeAnimation');
    const animationStamp = document.getElementById('animationStamp');
    const newLetterBanner = document.getElementById('newLetterBanner');
    const floatingHearts = document.getElementById('floatingHearts');

    function formatDate(date) {
      const d = new Date(date);
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();
      return `${year}年${month}月${day}日`;
    }

    dateLabel.textContent = formatDate(new Date());

    function createFloatingHearts() {
      const hearts = ['💕', '💗', '💖', '💝', '🌸', '✨'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
        heart.style.animationDelay = Math.random() * 15 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        floatingHearts.appendChild(heart);
      }
    }

    timeOptions.addEventListener('click', (e) => {
      const option = e.target.closest('.time-option');
      if (!option) return;
      
      document.querySelectorAll('.time-option').forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      selectedDays = parseInt(option.dataset.days);
    });

    stampOptions.addEventListener('click', (e) => {
      const option = e.target.closest('.stamp-option');
      if (!option) return;
      
      document.querySelectorAll('.stamp-option').forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      selectedStamp = option.dataset.stamp;
    });

    sendBtn.addEventListener('click', () => {
      const text = letterText.value.trim();
      if (!text) {
        showToast('写点什么再寄吧~');
        return;
      }

      animationStamp.textContent = selectedStamp;
      envelopeAnimation.classList.add('show');

      setTimeout(() => {
        const sendDate = new Date();
        const arriveDate = new Date(sendDate.getTime() + selectedDays * 24 * 60 * 60 * 1000);
        
        const letter = {
          id: Date.now(),
          content: text,
          sendDate: sendDate.toISOString(),
          arriveDate: arriveDate.toISOString(),
          stamp: selectedStamp,
          days: selectedDays,
          isRead: false,
          hasReply: false,
          reply: ''
        };

        letters.push(letter);
        localStorage.setItem('futureLetters', JSON.stringify(letters));

        letterText.value = '';
        
        envelopeAnimation.classList.remove('show');
        showToast('📮 信已经寄出去啦！');
        
        updateMailboxStatus();
      }, 2500);
    });

    function generateReply(letterContent) {
      const happyWords = ['开心', '快乐', '高兴', '幸福', '棒', '好', '喜欢', '爱', '甜', '暖', '阳光', '希望', '期待'];
      const sadWords = ['难过', '伤心', '哭', '痛', '累', '烦', '焦虑', '担心', '害怕', '孤单', '失落', '痛苦', '悲伤'];
      const calmWords = ['平静', '安静', '温柔', '舒服', '放松', '宁静', '安心', '稳定', '平和', '淡然'];
      
      let happyScore = 0, sadScore = 0, calmScore = 0;
      
      happyWords.forEach(w => { if (letterContent.includes(w)) happyScore++; });
      sadWords.forEach(w => { if (letterContent.includes(w)) sadScore++; });
      calmWords.forEach(w => { if (letterContent.includes(w)) calmScore++; });
      
      let template;
      if (sadScore > happyScore && sadScore > calmScore) {
        template = replyTemplates.find(t => t.condition === 'sad');
      } else if (happyScore > sadScore && happyScore > calmScore) {
        template = replyTemplates.find(t => t.condition === 'happy');
      } else if (calmScore > 0) {
        template = replyTemplates.find(t => t.condition === 'calm');
      } else {
        template = replyTemplates.find(t => t.condition === 'default');
      }
      
      const replies = template.replies;
      return replies[Math.floor(Math.random() * replies.length)];
    }

    function checkArrivedLetters() {
      const now = new Date();
      let hasNew = false;

      letters.forEach(letter => {
        const arriveDate = new Date(letter.arriveDate);
        if (now >= arriveDate && !letter.hasReply) {
          letter.hasReply = true;
          letter.reply = generateReply(letter.content);
          hasNew = true;
        }
      });

      if (hasNew) {
        localStorage.setItem('futureLetters', JSON.stringify(letters));
        showNewLetterBanner();
      }

      updateMailboxStatus();
    }

    function showNewLetterBanner() {
      newLetterBanner.classList.add('show');
      setTimeout(() => {
        newLetterBanner.classList.remove('show');
      }, 5000);
    }

    function updateMailboxStatus() {
      const unreadCount = letters.filter(l => l.hasReply && !l.isRead).length;
      if (unreadCount > 0) {
        mailboxBtn.classList.add('has-new');
      } else {
        mailboxBtn.classList.remove('has-new');
      }
    }

    function openMailbox() {
      mailboxList.innerHTML = '';
      
      const arrivedLetters = letters.filter(l => l.hasReply).sort((a, b) => 
        new Date(b.arriveDate) - new Date(a.arriveDate)
      );

      if (arrivedLetters.length === 0) {
        mailboxList.innerHTML = `
          <div class="mail-empty">
            <div class="mail-empty-icon">📭</div>
            <div>还没有收到信哦~</div>
            <div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">写一封信给未来的自己吧</div>
          </div>
        `;
      } else {
        arrivedLetters.forEach(letter => {
          const item = document.createElement('div');
          item.className = 'mail-item' + (letter.isRead ? '' : ' unread');
          item.innerHTML = `
            <div class="mail-item-header">
              <span class="mail-item-title">${letter.stamp} 来自过去的信</span>
              <span class="mail-item-date">${formatDate(letter.arriveDate)}</span>
            </div>
            <div class="mail-item-preview">${letter.content.substring(0, 30)}...</div>
          `;
          item.addEventListener('click', () => openLetter(letter.id));
          mailboxList.appendChild(item);
        });
      }

      mailboxModal.classList.add('show');
      newLetterBanner.classList.remove('show');
    }

    function closeMailbox() {
      mailboxModal.classList.remove('show');
    }

    function openLetter(id) {
      const letter = letters.find(l => l.id === id);
      if (!letter) return;

      letter.isRead = true;
      localStorage.setItem('futureLetters', JSON.stringify(letters));
      updateMailboxStatus();

      letterModalTitle.textContent = `${letter.stamp} 来自${formatDate(letter.sendDate)}的信`;
      
      const fullContent = `【你写给未来的信】\n\n${letter.content}\n\n—— 过去的你，${formatDate(letter.sendDate)}\n\n\n【未来的回信】\n\n${letter.reply}\n\n—— 未来的你，${formatDate(letter.arriveDate)}`;
      
      letterContent.textContent = fullContent;
      letterFrom.textContent = '';
      
      mailboxModal.classList.remove('show');
      letterModal.classList.add('show');
    }

    function closeLetterModal() {
      letterModal.classList.remove('show');
    }

    function showToast(text) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        background: rgba(139, 69, 19, 0.9);
        color: white;
        padding: 15px 30px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 2000;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: blur(10px);
      `;
      toast.textContent = text;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 10);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -50%) scale(0.8)';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    mailboxBtn.addEventListener('click', openMailbox);

    mailboxModal.addEventListener('click', (e) => {
      if (e.target === mailboxModal) closeMailbox();
    });

    letterModal.addEventListener('click', (e) => {
      if (e.target === letterModal) closeLetterModal();
    });

    createFloatingHearts();
    checkArrivedLetters();
  </script>
</body>
</html>
