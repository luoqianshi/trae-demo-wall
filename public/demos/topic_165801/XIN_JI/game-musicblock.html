<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 音乐方块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a56 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.9);
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 1em;
    cursor: pointer;
    font-weight: bold;
    color: #ff6b35;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: all 0.3s;
    font-family: inherit;
    z-index: 100;
  }
  .back-btn:hover { transform: scale(1.1); background: #fff; }
  h1 {
    color: #fff;
    font-size: 2.5em;
    text-shadow: 3px 3px 0 #ff6b35, 6px 6px 10px rgba(0,0,0,0.2);
    margin: 10px 0 15px 0;
  }
  .game-container {
    background: rgba(255,255,255,0.95);
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    max-width: 600px;
    width: 100%;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .info-item {
    background: linear-gradient(135deg, #ff9a56, #ff6b35);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.95em;
  }
  .combo-display {
    font-size: 1.3em;
    text-align: center;
    color: #ff6b35;
    font-weight: bold;
    height: 30px;
    margin-bottom: 10px;
    transition: transform 0.1s;
  }
  .combo-display.pop {
    transform: scale(1.3);
  }
  .canvas-container {
    position: relative;
    background: linear-gradient(180deg, #2c1810 0%, #4a2c2a 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 15px;
  }
  canvas {
    display: block;
    width: 100%;
    cursor: pointer;
    touch-action: none;
  }
  .track-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 15px;
  }
  .track-btn {
    flex: 1;
    max-width: 120px;
    height: 70px;
    border: none;
    border-radius: 20px;
    font-size: 2em;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.1s;
    font-family: inherit;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
  }
  .track-btn:active, .track-btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .track-btn:nth-child(1) {
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
  }
  .track-btn:nth-child(2) {
    background: linear-gradient(135deg, #a8edea, #fed6e3);
  }
  .track-btn:nth-child(3) {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
  }
  .selectors {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  .selector-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .selector-label {
    color: #ff6b35;
    font-weight: bold;
    font-size: 0.9em;
  }
  .selector-buttons {
    display: flex;
    gap: 5px;
  }
  .sel-btn {
    background: #fff;
    border: 2px solid #ff9a56;
    padding: 6px 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: bold;
    color: #ff6b35;
    transition: all 0.3s;
    font-family: inherit;
  }
  .sel-btn:hover { transform: scale(1.05); }
  .sel-btn.active {
    background: linear-gradient(135deg, #ff9a56, #ff6b35);
    color: white;
  }
  .action-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .action-btn {
    background: linear-gradient(135deg, #ff9a56, #ff6b35);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 1.1em;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    font-family: inherit;
  }
  .action-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255,107,53,0.5); }
  .action-btn.secondary {
    background: linear-gradient(135deg, #a8e6cf, #88d8b0);
  }
  .modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: linear-gradient(135deg, #fff5e6, #ffe0c4);
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.5s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal h2 {
    color: #ff6b35;
    font-size: 2em;
    margin-bottom: 15px;
  }
  .modal-emoji {
    font-size: 5em;
    margin: 10px 0;
  }
  .result-stats {
    background: rgba(255,255,255,0.8);
    border-radius: 15px;
    padding: 15px;
    margin: 15px 0;
    text-align: left;
    line-height: 2;
    color: #666;
  }
  .result-stats span {
    float: right;
    font-weight: bold;
    color: #ff6b35;
  }
  .high-score-badge {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: white;
    padding: 5px 15px;
    border-radius: 15px;
    font-weight: bold;
    display: inline-block;
    margin-top: 10px;
    animation: shine 1s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .hit-effect {
    position: absolute;
    pointer-events: none;
    font-size: 2em;
    animation: hitPop 0.5s ease-out forwards;
    z-index: 10;
  }
  @keyframes hitPop {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>
  <button class="back-btn" onclick="location.href='game-hub.html'">← 返回长廊</button>
  <h1>🎵 音乐方块 🎹</h1>

  <div class="game-container">
    <div class="info-bar">
      <div class="info-item">🏆 <span id="score">0</span></div>
      <div class="info-item">⭐ 最高: <span id="highScore">0</span></div>
      <div class="info-item">🎯 进度: <span id="progress">0%</span></div>
    </div>

    <div class="combo-display" id="comboDisplay"></div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="500" height="400"></canvas>
    </div>

    <div class="track-buttons">
      <button class="track-btn" data-track="0" onmousedown="hitTrack(0)" ontouchstart="hitTrack(0)">🎵</button>
      <button class="track-btn" data-track="1" onmousedown="hitTrack(1)" ontouchstart="hitTrack(1)">🎶</button>
      <button class="track-btn" data-track="2" onmousedown="hitTrack(2)" ontouchstart="hitTrack(2)">🎼</button>
    </div>

    <div class="selectors">
      <div class="selector-group">
        <div class="selector-label">🎵 歌曲</div>
        <div class="selector-buttons">
          <button class="sel-btn active" data-song="0" onclick="setSong(0)">小星星</button>
          <button class="sel-btn" data-song="1" onclick="setSong(1)">欢乐颂</button>
          <button class="sel-btn" data-song="2" onclick="setSong(2)">生日快乐</button>
        </div>
      </div>
      <div class="selector-group">
        <div class="selector-label">⚡ 难度</div>
        <div class="selector-buttons">
          <button class="sel-btn active" data-diff="easy" onclick="setDifficulty('easy')">简单</button>
          <button class="sel-btn" data-diff="normal" onclick="setDifficulty('normal')">普通</button>
          <button class="sel-btn" data-diff="hard" onclick="setDifficulty('hard')">困难</button>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="action-btn" onclick="startGame()">▶️ 开始演奏</button>
      <button class="action-btn secondary" onclick="togglePause()">⏸️ 暂停</button>
    </div>
  </div>

  <div class="modal" id="resultModal">
    <div class="modal-content">
      <div class="modal-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">演奏完成！</h2>
      <div class="result-stats">
        <div>最终得分 <span id="finalScore">0</span></div>
        <div>最高连击 <span id="finalCombo">0</span></div>
        <div>完美 <span id="perfectCount">0</span></div>
        <div>优秀 <span id="greatCount">0</span></div>
        <div>良好 <span id="goodCount">0</span></div>
        <div>失误 <span id="missCount">0</span></div>
      </div>
      <div id="newHighScore" style="display:none;">
        <div class="high-score-badge">🏆 新纪录！</div>
      </div>
      <br>
      <button class="action-btn" onclick="startGame()">🔄 再来一次</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(frequency, duration = 0.2, type = 'sine') {
  initAudio();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
  
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  oscillator.start(audioCtx.currentTime);
  oscillator.stop(audioCtx.currentTime + duration);
}

const noteFreqs = {
  'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
  'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
  'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99
};

const songs = {
  twinkle: {
    name: '小星星',
    notes: [
      {n: 'C4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'G4', d: 0.5},
      {n: 'A4', d: 0.5}, {n: 'A4', d: 0.5}, {n: 'G4', d: 1},
      {n: 'F4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5},
      {n: 'D4', d: 0.5}, {n: 'D4', d: 0.5}, {n: 'C4', d: 1},
      {n: 'G4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'F4', d: 0.5},
      {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'D4', d: 1},
      {n: 'G4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'F4', d: 0.5},
      {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'D4', d: 1},
      {n: 'C4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'G4', d: 0.5},
      {n: 'A4', d: 0.5}, {n: 'A4', d: 0.5}, {n: 'G4', d: 1},
      {n: 'F4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5},
      {n: 'D4', d: 0.5}, {n: 'D4', d: 0.5}, {n: 'C4', d: 1}
    ]
  },
  odeToJoy: {
    name: '欢乐颂',
    notes: [
      {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'G4', d: 0.5},
      {n: 'G4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'D4', d: 0.5},
      {n: 'C4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'D4', d: 0.5}, {n: 'E4', d: 0.5},
      {n: 'E4', d: 0.75}, {n: 'D4', d: 0.25}, {n: 'D4', d: 1},
      {n: 'E4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'G4', d: 0.5},
      {n: 'G4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'D4', d: 0.5},
      {n: 'C4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'D4', d: 0.5}, {n: 'E4', d: 0.5},
      {n: 'D4', d: 0.75}, {n: 'C4', d: 0.25}, {n: 'C4', d: 1}
    ]
  },
  birthday: {
    name: '生日快乐',
    notes: [
      {n: 'C4', d: 0.375}, {n: 'C4', d: 0.125}, {n: 'D4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 1},
      {n: 'C4', d: 0.375}, {n: 'C4', d: 0.125}, {n: 'D4', d: 0.5}, {n: 'C4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'F4', d: 1},
      {n: 'C4', d: 0.375}, {n: 'C4', d: 0.125}, {n: 'C5', d: 0.5}, {n: 'A4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'E4', d: 0.5}, {n: 'D4', d: 1},
      {n: 'A4', d: 0.375}, {n: 'A4', d: 0.125}, {n: 'G4', d: 0.5}, {n: 'F4', d: 0.5}, {n: 'G4', d: 0.5}, {n: 'F4', d: 1}
    ]
  }
};

const trackColors = [
  ['#ff9a9e', '#fecfef'],
  ['#a8edea', '#fed6e3'],
  ['#ffecd2', '#fcb69f']
];

let gameRunning = false;
let gamePaused = false;
let animationId = null;

let currentSongIndex = 0;
let currentDifficulty = 'easy';
let blocks = [];
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let goodCount = 0;
let missCount = 0;

let songTime = 0;
let noteIndex = 0;
let baseSpeed = 2;
let hitLineY = 350;

const difficulties = {
  easy: { speed: 1.5, judgeWindow: { perfect: 25, great: 50, good: 80 } },
  normal: { speed: 2.5, judgeWindow: { perfect: 20, great: 40, good: 60 } },
  hard: { speed: 3.5, judgeWindow: { perfect: 15, great: 30, good: 50 } }
};

function resizeCanvas() {
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 400;
  hitLineY = canvas.height - 60;
}

function setSong(index) {
  currentSongIndex = index;
  document.querySelectorAll('[data-song]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-song="${index}"]`).classList.add('active');
}

function setDifficulty(diff) {
  currentDifficulty = diff;
  document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-diff="${diff}"]`).classList.add('active');
}

function noteToTrack(note) {
  const notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F5', 'G5'];
  const idx = notes.indexOf(note);
  if (idx === -1) return 1;
  return idx % 3;
}

function spawnBlock(note) {
  const track = noteToTrack(note.n);
  const trackWidth = canvas.width / 3;
  blocks.push({
    track: track,
    x: track * trackWidth + trackWidth / 2,
    y: -30,
    size: 50,
    note: note.n,
    speed: difficulties[currentDifficulty].speed,
    hit: false,
    color: trackColors[track]
  });
}

function hitTrack(trackIndex) {
  if (!gameRunning || gamePaused) return;
  initAudio();
  
  const btn = document.querySelectorAll('.track-btn')[trackIndex];
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 100);
  
  const diff = difficulties[currentDifficulty];
  let closestBlock = null;
  let closestDist = Infinity;
  
  blocks.forEach(block => {
    if (block.track === trackIndex && !block.hit) {
      const dist = Math.abs(block.y - hitLineY);
      if (dist < closestDist) {
        closestDist = dist;
        closestBlock = block;
      }
    }
  });
  
  if (closestBlock && closestDist < diff.judgeWindow.good) {
    closestBlock.hit = true;
    
    let judgment = '';
    let points = 0;
    let color = '';
    
    if (closestDist < diff.judgeWindow.perfect) {
      judgment = 'PERFECT!';
      points = 100;
      color = '#ffd700';
      perfectCount++;
    } else if (closestDist < diff.judgeWindow.great) {
      judgment = 'GREAT!';
      points = 75;
      color = '#ff6b35';
      greatCount++;
    } else {
      judgment = 'GOOD';
      points = 50;
      color = '#4caf50';
      goodCount++;
    }
    
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const comboBonus = Math.floor(combo / 10) * 10;
    score += points + comboBonus;
    
    document.getElementById('score').textContent = score;
    updateCombo();
    showHitEffect(trackIndex, judgment, color);
    
    const freq = noteFreqs[closestBlock.note] || 440;
    playNote(freq, 0.3, 'triangle');
    
  } else {
    combo = 0;
    updateCombo();
  }
}

function updateCombo() {
  const display = document.getElementById('comboDisplay');
  if (combo >= 2) {
    display.textContent = `🔥 ${combo} 连击！`;
    display.classList.remove('pop');
    void display.offsetWidth;
    display.classList.add('pop');
  } else {
    display.textContent = '';
  }
}

function showHitEffect(trackIndex, text, color) {
  const container = document.getElementById('canvasContainer');
  const trackWidth = canvas.width / 3;
  const x = trackIndex * trackWidth + trackWidth / 2;
  
  const effect = document.createElement('div');
  effect.className = 'hit-effect';
  effect.textContent = text;
  effect.style.color = color;
  effect.style.left = (x / canvas.width * 100) + '%';
  effect.style.top = (hitLineY / canvas.height * 100) + '%';
  effect.style.transform = 'translateX(-50%)';
  effect.style.textShadow = '2px 2px 4px rgba(0,0,0,0.3)';
  effect.style.fontWeight = 'bold';
  container.appendChild(effect);
  
  setTimeout(() => effect.remove(), 500);
}

function update() {
  if (!gameRunning || gamePaused) return;
  
  const songKeys = Object.keys(songs);
  const song = songs[songKeys[currentSongIndex]];
  const bpm = 100;
  const beatDuration = 60 / bpm;
  
  songTime += 1/60;
  
  let cumulativeTime = 0;
  for (let i = 0; i < noteIndex; i++) {
    cumulativeTime += song.notes[i].d * beatDuration;
  }
  
  while (noteIndex < song.notes.length && cumulativeTime <= songTime) {
    spawnBlock(song.notes[noteIndex]);
    noteIndex++;
    if (noteIndex < song.notes.length) {
      cumulativeTime += song.notes[noteIndex].d * beatDuration;
    }
  }
  
  blocks = blocks.filter(block => {
    if (!block.hit) {
      block.y += block.speed;
      
      if (block.y > canvas.height + 50) {
        combo = 0;
        missCount++;
        updateCombo();
        return false;
      }
    } else {
      block.y += block.speed * 2;
      if (block.y > canvas.height + 50) return false;
    }
    return true;
  });
  
  const totalNotes = song.notes.length;
  const progress = Math.min(100, Math.floor((noteIndex / totalNotes) * 100));
  document.getElementById('progress').textContent = progress + '%';
  
  if (noteIndex >= song.notes.length && blocks.filter(b => !b.hit).length === 0) {
    endGame();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const trackWidth = canvas.width / 3;
  
  for (let i = 0; i < 3; i++) {
    const gradient = ctx.createLinearGradient(i * trackWidth, 0, (i+1) * trackWidth, 0);
    gradient.addColorStop(0, 'rgba(255,255,255,0.05)');
    gradient.addColorStop(0.5, 'rgba(255,255,255,0.1)');
    gradient.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = gradient;
    ctx.fillRect(i * trackWidth, 0, trackWidth, canvas.height);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i * trackWidth, 0);
    ctx.lineTo(i * trackWidth, canvas.height);
    ctx.stroke();
  }
  
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(0, hitLineY - 2, canvas.width, 4);
  
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'center';
  for (let i = 0; i < 3; i++) {
    ctx.fillText(['🎵', '🎶', '🎼'][i], i * trackWidth + trackWidth/2, hitLineY + 35);
  }
  
  blocks.forEach(block => {
    const gradient = ctx.createRadialGradient(block.x, block.y, 0, block.x, block.y, block.size/2);
    gradient.addColorStop(0, block.color[0]);
    gradient.addColorStop(1, block.color[1]);
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(block.x - block.size/2, block.y - block.size/2, block.size, block.size, 12);
    ctx.fill();
    
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    if (!block.hit) {
      ctx.font = '24px Arial';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♪', block.x, block.y);
    }
  });
}

function gameLoop() {
  update();
  draw();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('resultModal').classList.remove('show');
  
  blocks = [];
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  goodCount = 0;
  missCount = 0;
  songTime = 0;
  noteIndex = 0;
  
  document.getElementById('score').textContent = '0';
  document.getElementById('progress').textContent = '0%';
  updateCombo();
  
  gameRunning = true;
  gamePaused = false;
  
  if (animationId) cancelAnimationFrame(animationId);
  gameLoop();
}

function togglePause() {
  if (!gameRunning) return;
  gamePaused = !gamePaused;
}

function endGame() {
  gameRunning = false;
  
  const songKeys = Object.keys(songs);
  const songName = songs[songKeys[currentSongIndex]].name;
  const highScoreKey = `musicBlock_${songName}_${currentDifficulty}`;
  const oldHighScore = parseInt(localStorage.getItem(highScoreKey) || '0');
  
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalCombo').textContent = maxCombo;
  document.getElementById('perfectCount').textContent = perfectCount;
  document.getElementById('greatCount').textContent = greatCount;
  document.getElementById('goodCount').textContent = goodCount;
  document.getElementById('missCount').textContent = missCount;
  
  const totalNotes = perfectCount + greatCount + goodCount + missCount;
  const accuracy = totalNotes > 0 ? (perfectCount + greatCount * 0.75 + goodCount * 0.5) / totalNotes : 0;
  
  if (accuracy > 0.9) {
    document.getElementById('resultEmoji').textContent = '🏆';
    document.getElementById('resultTitle').textContent = '完美演奏！';
  } else if (accuracy > 0.7) {
    document.getElementById('resultEmoji').textContent = '😄';
    document.getElementById('resultTitle').textContent = '做得很棒！';
  } else if (accuracy > 0.5) {
    document.getElementById('resultEmoji').textContent = '😊';
    document.getElementById('resultTitle').textContent = '继续加油！';
  } else {
    document.getElementById('resultEmoji').textContent = '💪';
    document.getElementById('resultTitle').textContent = '多多练习！';
  }
  
  if (score > oldHighScore) {
    localStorage.setItem(highScoreKey, score);
    document.getElementById('newHighScore').style.display = 'block';
    document.getElementById('highScore').textContent = score;
  } else {
    document.getElementById('newHighScore').style.display = 'none';
  }
  
  document.getElementById('resultModal').classList.add('show');
}

function updateHighScoreDisplay() {
  const songKeys = Object.keys(songs);
  const songName = songs[songKeys[currentSongIndex]].name;
  const highScoreKey = `musicBlock_${songName}_${currentDifficulty}`;
  const highScore = localStorage.getItem(highScoreKey) || '0';
  document.getElementById('highScore').textContent = highScore;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'd' || e.key === 'D') hitTrack(0);
  if (e.key === 'f' || e.key === 'F') hitTrack(1);
  if (e.key === 'j' || e.key === 'J') hitTrack(2);
});

document.querySelectorAll('[data-song]').forEach(btn => {
  btn.addEventListener('click', updateHighScoreDisplay);
});
document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', updateHighScoreDisplay);
});

window.addEventListener('resize', resizeCanvas);

resizeCanvas();
updateHighScoreDisplay();
draw();
</script>
</body>
</html>
