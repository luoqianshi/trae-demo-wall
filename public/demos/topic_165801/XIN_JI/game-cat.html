<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>猫咪陪你 · 心迹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #2c3e50 0%, #34495e 30%, #4a5568 70%, #5d6d7e 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .raindrop {
      position: absolute;
      width: 2px;
      height: 20px;
      background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.5));
      animation: fall linear infinite;
      border-radius: 1px;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0.3;
      }
    }

    .window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      height: 70vh;
      max-height: 500px;
      background: linear-gradient(180deg, rgba(255, 248, 240, 0.15) 0%, rgba(255, 248, 240, 0.08) 100%);
      border-radius: 30px;
      border: 3px solid rgba(255, 248, 240, 0.2);
      backdrop-filter: blur(5px);
      z-index: 5;
      overflow: hidden;
    }

    .window-sill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(180deg, #deb887 0%, #d2a679 100%);
      border-radius: 0 0 27px 27px;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
    }

    .window-sill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 15px;
      background: linear-gradient(180deg, #f5deb3 0%, #deb887 100%);
    }

    .cat-container {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 10;
      touch-action: none;
    }

    .cat {
      position: relative;
      width: 180px;
      height: 160px;
    }

    .cat-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 100px;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c00 100%);
      border-radius: 50% 50% 45% 45%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .cat-stripe {
      position: absolute;
      background: rgba(205, 102, 0, 0.3);
      border-radius: 50%;
    }

    .cat-stripe:nth-child(1) {
      width: 40px;
      height: 8px;
      top: 20px;
      left: 30px;
      transform: rotate(-10deg);
    }

    .cat-stripe:nth-child(2) {
      width: 35px;
      height: 7px;
      top: 35px;
      left: 85px;
      transform: rotate(5deg);
    }

    .cat-stripe:nth-child(3) {
      width: 30px;
      height: 6px;
      top: 55px;
      left: 40px;
      transform: rotate(-5deg);
    }

    .cat-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 100px;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c00 100%);
      border-radius: 50% 50% 45% 45%;
      z-index: 2;
    }

    .cat-ear {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 40px solid #ff8c00;
      top: -25px;
    }

    .cat-ear.left {
      left: 5px;
      transform: rotate(-15deg);
    }

    .cat-ear.right {
      right: 5px;
      transform: rotate(15deg);
    }

    .cat-ear-inner {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #ffb6c1;
      top: 10px;
    }

    .cat-ear.left .cat-ear-inner {
      left: -7px;
    }

    .cat-ear.right .cat-ear-inner {
      right: -7px;
    }

    .cat-face {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 60px;
    }

    .cat-eye {
      position: absolute;
      width: 18px;
      height: 22px;
      background: #2c2c2c;
      border-radius: 50%;
      top: 10px;
      transition: all 0.3s;
      overflow: hidden;
    }

    .cat-eye.left {
      left: 15px;
    }

    .cat-eye.right {
      right: 15px;
    }

    .cat-eye::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 4px;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
    }

    .cat.closed-eyes .cat-eye {
      height: 3px;
      border-radius: 3px;
      top: 20px;
    }

    .cat.closed-eyes .cat-eye::after {
      display: none;
    }

    .cat.happy .cat-eye {
      height: 15px;
      border-radius: 50% 50% 50% 50% / 0% 0% 100% 100%;
      background: transparent;
      border: 3px solid #2c2c2c;
      border-top: none;
    }

    .cat.happy .cat-eye::after {
      display: none;
    }

    .cat-nose {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 8px;
      background: #ffb6c1;
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    }

    .cat-mouth {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 15px;
    }

    .cat-mouth::before,
    .cat-mouth::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 10px;
      border: 2px solid #2c2c2c;
      border-top: none;
      border-right: none;
      border-radius: 0 0 0 50%;
      top: 0;
    }

    .cat-mouth::before {
      left: 2px;
      transform: rotate(-5deg);
    }

    .cat-mouth::after {
      right: 2px;
      transform: scaleX(-1) rotate(-5deg);
    }

    .cat.happy .cat-mouth::before,
    .cat.happy .cat-mouth::after {
      border-color: #ff6b6b;
      height: 12px;
    }

    .cat-whiskers {
      position: absolute;
      top: 35px;
      width: 100%;
    }

    .cat-whisker {
      position: absolute;
      width: 25px;
      height: 1.5px;
      background: rgba(44, 44, 44, 0.6);
      border-radius: 1px;
    }

    .cat-whisker.left1 {
      left: -15px;
      top: 0;
      transform: rotate(-10deg);
    }

    .cat-whisker.left2 {
      left: -15px;
      top: 8px;
      transform: rotate(5deg);
    }

    .cat-whisker.right1 {
      right: -15px;
      top: 0;
      transform: rotate(10deg);
    }

    .cat-whisker.right2 {
      right: -15px;
      top: 8px;
      transform: rotate(-5deg);
    }

    .cat-tail {
      position: absolute;
      bottom: 30px;
      right: -15px;
      width: 50px;
      height: 30px;
      border: 8px solid #ff8c00;
      border-left: none;
      border-bottom: none;
      border-radius: 0 50% 0 0;
      transform-origin: bottom left;
      animation: tail-wag 3s ease-in-out infinite;
    }

    @keyframes tail-wag {
      0%, 100% {
        transform: rotate(-10deg);
      }
      50% {
        transform: rotate(20deg);
      }
    }

    .cat.purring .cat-tail {
      animation: tail-wag-fast 0.5s ease-in-out infinite;
    }

    @keyframes tail-wag-fast {
      0%, 100% {
        transform: rotate(-20deg);
      }
      50% {
        transform: rotate(30deg);
      }
    }

    .cat-paw {
      position: absolute;
      width: 30px;
      height: 25px;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c00 100%);
      border-radius: 50% 50% 40% 40%;
      bottom: -5px;
      z-index: 3;
    }

    .cat-paw.left {
      left: 25px;
    }

    .cat-paw.right {
      right: 25px;
    }

    .cat-paw::before {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 12px;
      background: #ffb6c1;
      border-radius: 50%;
      opacity: 0.5;
    }

    .cat.stretching .cat-body {
      animation: stretch 2s ease-in-out;
    }

    @keyframes stretch {
      0%, 100% {
        transform: translateX(-50%) scaleX(1);
      }
      30% {
        transform: translateX(-50%) scaleX(1.15) scaleY(0.9);
      }
      60% {
        transform: translateX(-50%) scaleX(1.15) scaleY(0.9);
      }
    }

    .cat.yawning .cat-mouth {
      animation: yawn 2.5s ease-in-out;
    }

    @keyframes yawn {
      0%, 100% {
        transform: translateX(-50%) scale(1);
      }
      30%, 60% {
        transform: translateX(-50%) scale(1.8) translateY(5px);
      }
    }

    .cat.yawning .cat-mouth::before,
    .cat.yawning .cat-mouth::after {
      background: #ff6b6b;
      border-color: #ff6b6b;
    }

    .cat.yawning .cat-eye {
      height: 4px;
      top: 22px;
      border-radius: 2px;
    }

    .purr-text {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      color: #ffb6c1;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(255, 182, 193, 0.5);
      animation: float-up 1.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float-up {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(0);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
      }
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: heart-float 2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes heart-float {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.5);
      }
      50% {
        opacity: 1;
        transform: translateY(-40px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(0.8);
      }
    }

    .fish-treat {
      position: absolute;
      font-size: 30px;
      animation: fish-fly 1.2s ease-in forwards;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes fish-fly {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-200px) rotate(360deg) scale(0.5);
      }
    }

    .header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 100;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 400;
      color: #fff8f0;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
    }

    .header p {
      font-size: 12px;
      color: rgba(255, 248, 240, 0.6);
      font-weight: 300;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 22px;
      background: rgba(255, 248, 240, 0.15);
      border: 1.5px solid rgba(255, 248, 240, 0.25);
      border-radius: 20px;
      color: #fff8f0;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-weight: 400;
    }

    .back-btn:hover {
      background: rgba(255, 248, 240, 0.25);
    }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .control-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 15px 20px;
      background: rgba(255, 248, 240, 0.15);
      border: 1.5px solid rgba(255, 248, 240, 0.25);
      border-radius: 18px;
      color: #fff8f0;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      font-weight: 300;
    }

    .control-btn:hover {
      background: rgba(255, 248, 240, 0.25);
      transform: translateY(-3px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-icon {
      font-size: 28px;
    }

    .flower-counter {
      position: fixed;
      top: 80px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 248, 240, 0.15);
      border: 1.5px solid rgba(255, 248, 240, 0.25);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      z-index: 100;
      transition: transform 0.3s;
    }

    .flower-counter.bump {
      transform: scale(1.15);
    }

    .flower-icon {
      font-size: 22px;
    }

    .flower-count {
      font-size: 18px;
      color: #fff8f0;
      font-weight: 300;
    }

    .mood-bar {
      position: fixed;
      top: 80px;
      left: 20px;
      padding: 12px 18px;
      background: rgba(255, 248, 240, 0.15);
      border: 1.5px solid rgba(255, 248, 240, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      z-index: 100;
      min-width: 120px;
    }

    .mood-label {
      font-size: 11px;
      color: rgba(255, 248, 240, 0.7);
      margin-bottom: 6px;
      font-weight: 300;
    }

    .mood-bar-fill {
      height: 8px;
      background: rgba(255, 248, 240, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .mood-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #ffb6c1, #ff6b6b);
      border-radius: 4px;
      transition: width 0.5s ease;
      width: 50%;
    }

    .hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 248, 240, 0.5);
      z-index: 100;
      font-weight: 300;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    @media (max-width: 480px) {
      .cat {
        transform: scale(0.85);
      }
      .controls {
        bottom: 20px;
      }
      .control-btn {
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="rain-container" id="rainContainer"></div>

  <button class="back-btn" onclick="window.location.href='game-hub.html'">← 返回长廊</button>

  <div class="header">
    <h1>猫咪陪你</h1>
    <p>雨夜，有只小猫陪着你</p>
  </div>

  <div class="mood-bar">
    <div class="mood-label">心情值</div>
    <div class="mood-bar-fill">
      <div class="mood-bar-inner" id="moodBar"></div>
    </div>
  </div>

  <div class="flower-counter" id="flowerCounter">
    <span class="flower-icon">🌸</span>
    <span class="flower-count" id="flowerCount">0</span>
  </div>

  <div class="window">
    <div class="window-sill"></div>
    <div class="cat-container" id="catContainer">
      <div class="cat closed-eyes" id="cat">
        <div class="cat-ear left">
          <div class="cat-ear-inner"></div>
        </div>
        <div class="cat-ear right">
          <div class="cat-ear-inner"></div>
        </div>
        <div class="cat-head">
          <div class="cat-face">
            <div class="cat-eye left"></div>
            <div class="cat-eye right"></div>
            <div class="cat-nose"></div>
            <div class="cat-mouth"></div>
            <div class="cat-whiskers">
              <div class="cat-whisker left1"></div>
              <div class="cat-whisker left2"></div>
              <div class="cat-whisker right1"></div>
              <div class="cat-whisker right2"></div>
            </div>
          </div>
        </div>
        <div class="cat-body">
          <div class="cat-stripe"></div>
          <div class="cat-stripe"></div>
          <div class="cat-stripe"></div>
        </div>
        <div class="cat-paw left"></div>
        <div class="cat-paw right"></div>
        <div class="cat-tail"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">摸摸小猫，它会很开心的~</div>

  <div class="controls">
    <button class="control-btn" id="feedBtn">
      <span class="control-icon">🐟</span>
      <span>喂小鱼干</span>
    </button>
    <button class="control-btn" id="petBtn">
      <span class="control-icon">✋</span>
      <span>摸摸头</span>
    </button>
  </div>

  <script>
    const cat = document.getElementById('cat');
    const catContainer = document.getElementById('catContainer');
    const rainContainer = document.getElementById('rainContainer');
    const moodBar = document.getElementById('moodBar');
    const flowerCount = document.getElementById('flowerCount');
    const flowerCounter = document.getElementById('flowerCounter');
    const feedBtn = document.getElementById('feedBtn');
    const petBtn = document.getElementById('petBtn');
    const hint = document.getElementById('hint');

    let mood = 50;
    let flowers = parseInt(localStorage.getItem('catFlowers') || '0');
    let isPetting = false;
    let lastPetTime = 0;
    let purrTimeout = null;
    let animationTimeout = null;

    flowerCount.textContent = flowers;
    moodBar.style.width = mood + '%';

    function createRain() {
      for (let i = 0; i < 60; i++) {
        const drop = document.createElement('div');
        drop.className = 'raindrop';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        drop.style.animationDelay = Math.random() * 2 + 's';
        drop.style.opacity = Math.random() * 0.5 + 0.2;
        rainContainer.appendChild(drop);
      }
    }

    function updateMood(change) {
      mood = Math.max(0, Math.min(100, mood + change));
      moodBar.style.width = mood + '%';

      if (mood >= 80 && Math.random() < 0.3) {
        giveFlower();
      }

      updateCatExpression();
    }

    function updateCatExpression() {
      cat.classList.remove('happy', 'closed-eyes');
      
      if (mood >= 70) {
        cat.classList.add('happy');
      } else if (mood <= 30) {
        cat.classList.add('closed-eyes');
      }
    }

    function giveFlower() {
      flowers++;
      localStorage.setItem('catFlowers', flowers.toString());
      flowerCount.textContent = flowers;
      flowerCounter.classList.add('bump');
      setTimeout(() => flowerCounter.classList.remove('bump'), 300);

      const flower = document.createElement('div');
      flower.className = 'heart';
      flower.textContent = '🌸';
      flower.style.left = '50%';
      flower.style.top = '20px';
      flower.style.transform = 'translateX(-50%)';
      catContainer.appendChild(flower);
      
      setTimeout(() => flower.remove(), 2000);
    }

    function petCat() {
      const now = Date.now();
      if (now - lastPetTime < 100) return;
      lastPetTime = now;

      if (!isPetting) {
        isPetting = true;
        cat.classList.add('purring', 'happy');
        showPurrText();
        hideHint();
      }

      updateMood(2);

      if (Math.random() < 0.4) {
        showHeart();
      }

      clearTimeout(purrTimeout);
      purrTimeout = setTimeout(() => {
        isPetting = false;
        cat.classList.remove('purring');
        updateCatExpression();
      }, 1500);
    }

    function showPurrText() {
      const purrTexts = ['呼噜~呼噜~', '喵~', '舒服~', '嘻嘻~', '再来~'];
      const text = purrTexts[Math.floor(Math.random() * purrTexts.length)];
      
      const purr = document.createElement('div');
      purr.className = 'purr-text';
      purr.textContent = text;
      purr.style.left = (Math.random() * 60 + 20) + '%';
      catContainer.appendChild(purr);
      
      setTimeout(() => purr.remove(), 1500);
    }

    function showHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = ['❤️', '💕', '💗', '💖'][Math.floor(Math.random() * 4)];
      heart.style.left = (Math.random() * 80 + 10) + '%';
      heart.style.top = (Math.random() * 40 + 20) + '%';
      catContainer.appendChild(heart);
      
      setTimeout(() => heart.remove(), 2000);
    }

    function feedCat() {
      const fish = document.createElement('div');
      fish.className = 'fish-treat';
      fish.textContent = '🐟';
      fish.style.left = '50%';
      fish.style.bottom = '50px';
      fish.style.transform = 'translateX(-50%)';
      catContainer.appendChild(fish);

      hideHint();
      updateMood(15);

      setTimeout(() => {
        fish.remove();
        cat.classList.add('happy');
        
        const nom = document.createElement('div');
        nom.className = 'purr-text';
        nom.textContent = '好吃！😋';
        nom.style.left = '50%';
        catContainer.appendChild(nom);
        setTimeout(() => nom.remove(), 1500);

        setTimeout(() => updateCatExpression(), 2000);
      }, 1000);
    }

    function randomAction() {
      const actions = ['blink', 'yawn', 'stretch', 'sleep'];
      const action = actions[Math.floor(Math.random() * actions.length)];

      if (isPetting) {
        setTimeout(randomAction, Math.random() * 10000 + 8000);
        return;
      }

      switch(action) {
        case 'blink':
          cat.classList.add('closed-eyes');
          setTimeout(() => {
            cat.classList.remove('closed-eyes');
            updateCatExpression();
          }, 300);
          break;
        case 'yawn':
          if (mood < 60) {
            cat.classList.add('yawning', 'closed-eyes');
            setTimeout(() => {
              cat.classList.remove('yawning', 'closed-eyes');
              updateCatExpression();
            }, 2500);
          }
          break;
        case 'stretch':
          if (mood < 60) {
            cat.classList.add('stretching');
            setTimeout(() => cat.classList.remove('stretching'), 2000);
          }
          break;
        case 'sleep':
          if (mood < 40) {
            cat.classList.add('closed-eyes');
            setTimeout(() => updateCatExpression(), Math.random() * 5000 + 3000);
          }
          break;
      }

      setTimeout(randomAction, Math.random() * 8000 + 5000);
    }

    function hideHint() {
      hint.style.opacity = '0';
    }

    catContainer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      petCat();
    });

    catContainer.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        e.preventDefault();
        petCat();
      }
    });

    catContainer.addEventListener('touchstart', (e) => {
      e.preventDefault();
      petCat();
    });

    catContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
      petCat();
    });

    feedBtn.addEventListener('click', feedCat);
    petBtn.addEventListener('click', () => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => petCat(), i * 200);
      }
    });

    createRain();
    setTimeout(randomAction, 3000);

    setInterval(() => {
      if (!isPetting) {
        updateMood(-1);
      }
    }, 3000);
  </script>
</body>
</html>
