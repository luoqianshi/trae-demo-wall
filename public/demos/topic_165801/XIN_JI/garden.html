<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心迹·情绪花园</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #1a1a2e;
      --bg-mid: #16213e;
      --bg-light: #0f3460;
      --primary: #6C63FF;
      --accent-color: #6C63FF;
      --accent-color-soft: rgba(108, 99, 255, 0.35);
      --mood-1: #6B7280;
      --mood-2: #93C5FD;
      --mood-3: #C4B5FD;
      --mood-4: #FDBA74;
      --mood-5: #FCD34D;
      --text-light: rgba(255,255,255,0.9);
      --text-muted: rgba(255,255,255,0.6);
      --glass-bg: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.15);
      --header-height: 60px;
      --bottom-height: 140px;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 50%, var(--bg-light) 100%);
      background-attachment: fixed;
      color: var(--text-light);
      position: relative;
      transition: background 1.5s ease;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(100px);
      opacity: 0.2;
    }
    body::before {
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
      animation: bgDrift 30s ease-in-out infinite;
    }
    body::after {
      bottom: -200px;
      right: -200px;
      background: radial-gradient(circle, var(--accent-color-soft) 0%, transparent 70%);
      animation: bgDrift 30s ease-in-out infinite reverse;
    }
    @keyframes bgDrift {
      0%, 100% { transform: translate(-5%, -5%) scale(1); opacity: 0.2; }
      50% { transform: translate(5%, 5%) scale(1.15); opacity: 0.3; }
    }

    /* ========== 顶部栏 ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: linear-gradient(to bottom, rgba(26,26,46,0.8), transparent);
      z-index: 100;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: translateX(-2px);
    }

    .title-group {
      text-align: center;
    }
    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text-light);
    }
    .app-title span {
      display: inline-block;
      animation: heartPulse 2s ease-in-out infinite;
      margin-right: 4px;
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }
    .top-action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-light);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .top-action-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.1);
    }

    /* ========== 花园区域 ========== */
    .garden-area {
      position: absolute;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: var(--bottom-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1;
    }

    .garden-greeting {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
    .garden-greeting .weather-icon {
      margin-right: 4px;
    }

    .garden-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .garden-cell {
      border-radius: 20px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
      border: 1px dashed rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .garden-cell.has-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
    }

    .garden-item {
      font-size: clamp(24px, 5vw, 48px);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .garden-item:hover {
      transform: scale(1.2);
    }
    .garden-item:active {
      transform: scale(0.9);
    }

    .garden-item.sway {
      animation: itemSway 3s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes itemSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    .garden-item.bounce {
      animation: itemBounce 2s ease-in-out infinite;
    }
    @keyframes itemBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12%); }
    }

    .garden-item.float {
      animation: itemFloat 4s ease-in-out infinite;
    }
    @keyframes itemFloat {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(8%, -8%); }
      50% { transform: translate(0, -12%); }
      75% { transform: translate(-8%, -8%); }
    }

    .garden-item.flutter {
      animation: itemFlutter 2.5s ease-in-out infinite;
    }
    @keyframes itemFlutter {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(10%, -8%) rotate(12deg); }
      50% { transform: translate(0, -12%) rotate(0deg); }
      75% { transform: translate(-10%, -8%) rotate(-12deg); }
    }

    .garden-item.shimmer {
      animation: itemShimmer 2s ease-in-out infinite;
    }
    @keyframes itemShimmer {
      0%, 100% { filter: brightness(1) drop-shadow(0 2px 8px rgba(0,0,0,0.3)); }
      50% { filter: brightness(1.5) drop-shadow(0 0 16px rgba(255,255,200,0.5)); }
    }

    /* ========== 底部信息栏 ========== */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-height);
      background: linear-gradient(to top, rgba(26,26,46,0.95), rgba(26,26,46,0.8));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      padding: 16px 20px 20px;
      z-index: 100;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 12px;
    }
    .stat-item {
      text-align: center;
      flex: 1;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--mood-4), var(--mood-5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .progress-section {
      margin-bottom: 12px;
    }
    .progress-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-label .next-reward {
      color: var(--mood-4);
      font-weight: 500;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--mood-4));
      border-radius: 10px;
      transition: width 0.6s ease;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: progressShine 2s ease-in-out infinite;
    }
    @keyframes progressShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn:hover {
      background: rgba(108, 99, 255, 0.2);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), #9b59ff);
      border-color: transparent;
    }
    .btn.primary:hover {
      box-shadow: 0 4px 20px var(--accent-color-soft);
    }
    .btn-icon {
      margin-right: 4px;
    }

    /* ========== 调试区 ========== */
    .debug-toggle {
      position: fixed;
      bottom: var(--bottom-height);
      right: 10px;
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.3;
      cursor: pointer;
      padding: 4px 8px;
      z-index: 101;
      transition: opacity 0.2s;
    }
    .debug-toggle:hover {
      opacity: 0.8;
    }

    .debug-panel {
      position: fixed;
      bottom: calc(var(--bottom-height) + 24px);
      right: 10px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 12px;
      z-index: 101;
      display: none;
      max-width: 280px;
    }
    .debug-panel.show {
      display: block;
      animation: fadeSlideUp 0.3s ease;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .debug-title {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      opacity: 0.7;
    }
    .debug-btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .debug-btn {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .debug-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-light);
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.85);
      opacity: 0;
      animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes modalPop {
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .modal-close:hover {
      background: rgba(255,255,255,0.15);
      transform: rotate(90deg);
    }

    /* 物品详情 */
    .item-detail {
      text-align: center;
    }
    .item-detail-emoji {
      font-size: 72px;
      margin-bottom: 12px;
      animation: itemBounce 2s ease-in-out infinite;
    }
    .item-detail-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .item-detail-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .item-detail-date {
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* 解锁弹窗 */
    .unlock-modal {
      text-align: center;
    }
    .unlock-badge {
      font-size: 14px;
      color: var(--mood-4);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .unlock-item {
      font-size: 90px;
      margin: 20px 0;
      animation: unlockItem 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
    }
    @keyframes unlockItem {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .unlock-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .unlock-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .unlock-streak {
      font-size: 13px;
      color: var(--mood-4);
      margin-bottom: 20px;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      animation: sparkleFly 1.5s ease-out forwards;
    }
    @keyframes sparkleFly {
      0% { transform: translate(0, 0) scale(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* 图鉴 */
    .collection-section {
      margin-bottom: 20px;
    }
    .collection-section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .collection-section-title .count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .collection-item {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .collection-item.locked {
      opacity: 0.3;
      filter: grayscale(1);
      font-size: 18px;
    }
    .collection-item.unlocked:hover {
      background: rgba(108, 99, 255, 0.2);
      transform: scale(1.1);
    }

    .collection-summary {
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--glass-border);
    }
    .collection-progress {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--mood-4), var(--mood-5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .collection-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--accent-color);
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 14px;
      color: var(--text-light);
      box-shadow: 0 8px 32px var(--accent-color-soft);
      z-index: 2000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      pointer-events: none;
      max-width: 90vw;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 粒子效果容器 */
    #particlesContainer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 500;
      overflow: hidden;
    }

    /* 响应式微调 */
    @media (min-width: 768px) {
      :root {
        --bottom-height: 160px;
      }
      .stat-value {
        font-size: 28px;
      }
      .garden-grid {
        gap: 16px;
      }
    }

    @media (max-width: 480px) {
      :root {
        --bottom-height: 150px;
      }
      .stats-row {
        margin-bottom: 8px;
      }
      .progress-section {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="title-group">
      <div class="app-title"><span>🌿</span>情绪花园</div>
      <div class="app-subtitle">每一次记录，都是一朵花的绽放</div>
    </div>
    <div class="top-actions">
      <button class="top-action-btn" onclick="openCollection()" title="图鉴">📖</button>
    </div>
  </div>

  <!-- 花园区域 -->
  <div class="garden-area">
    <div class="garden-greeting">
      <span class="weather-icon">🌤️</span>
      <span id="greetingText">今天也是适合种花的一天</span>
    </div>
    <div id="gardenGrid" class="garden-grid"></div>
  </div>

  <!-- 调试面板切换 -->
  <div class="debug-toggle" onclick="toggleDebug()">🔧 调试</div>
  <div class="debug-panel" id="debugPanel">
    <div class="debug-title">开发调试工具</div>
    <div class="debug-btn-row">
      <button class="debug-btn" onclick="debugAddStreak(1)">+1天</button>
      <button class="debug-btn" onclick="debugAddStreak(7)">+7天</button>
      <button class="debug-btn" onclick="debugAddStreak(30)">+30天</button>
      <button class="debug-btn" onclick="debugAddStreak(60)">+60天</button>
      <button class="debug-btn" onclick="debugReset()">重置</button>
      <button class="debug-btn" onclick="debugUnlockAll()">全解锁</button>
    </div>
  </div>

  <!-- 底部信息栏 -->
  <div class="bottom-bar">
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-value" id="streakValue">0</div>
        <div class="stat-label">连续签到</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalValue">0</div>
        <div class="stat-label">累计签到</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="levelValue">1</div>
        <div class="stat-label">花园等级</div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>下一个奖励</span>
        <span class="next-reward" id="nextRewardText">种子（1天）</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="simulateCheckin()">
        <span class="btn-icon">🌸</span>模拟今日签到
      </button>
      <button class="btn" onclick="openCollection()">
        <span class="btn-icon">📖</span>物品图鉴
      </button>
    </div>
  </div>

  <!-- 物品详情弹窗 -->
  <div class="modal-overlay" id="itemDetailModal">
    <div class="modal item-detail" style="position: relative;">
      <button class="modal-close" onclick="closeItemDetail()">✕</button>

  <!-- 解锁弹窗 -->
  <div class="modal-overlay" id="unlockModal">
    <div class="modal unlock-modal" style="position: relative;">
      <div class="unlock-badge">✨ 新解锁 ✨</div>

  <!-- 图鉴弹窗 -->
  <div class="modal-overlay" id="collectionModal">
    <div class="modal" style="position: relative;">
      <button class="modal-close" onclick="closeCollection()">✕</button>
      <div class="modal-title">📖 物品图鉴</div>
      <div id="collectionContent"></div>
      <div class="collection-summary">
        <div class="collection-progress" id="collectionProgress">0 / 0</div>
        <div class="collection-hint">继续签到，解锁更多花园伙伴～</div>
      </div>

  </div>

  <div id="toast" class="toast"></div>
  <div id="particlesContainer"></div>

  <script>
  (function() {
    'use strict';

    /* ==================== 常量定义 ==================== */
    var STORAGE_PREFIX = 'xinji_garden_';

    var ITEMS = {
      // 植物类 (0-9)
      plant_seed:     { id:'plant_seed',     name:'种子',     emoji:'🌱', category:'plant',  unlockType:'streak', unlockDays:1,  level:1, anim:'sway',      desc:'一颗小小的种子，蕴含着无限可能。' },
      plant_sprout:   { id:'plant_sprout',   name:'小芽',     emoji:'🌿', category:'plant',  unlockType:'streak', unlockDays:3,  level:2, anim:'sway',      desc:'破土而出的小芽，勇敢又可爱。' },
      plant_pink:     { id:'plant_pink',     name:'粉色小花', emoji:'🌸', category:'plant',  unlockType:'streak', unlockDays:7,  level:3, anim:'sway',      desc:'一朵温柔的小花，在阳光下轻轻绽放。' },
      plant_yellow:   { id:'plant_yellow',   name:'向日葵',   emoji:'🌻', category:'plant',  unlockType:'total',  unlockDays:10, level:3, anim:'sway',      desc:'永远追着阳光的向日葵，和你一样温暖。' },
      plant_tulip:    { id:'plant_tulip',    name:'郁金香',   emoji:'🌷', category:'plant',  unlockType:'streak', unlockDays:14, level:4, anim:'sway',      desc:'优雅的郁金香，盛开在花园中央。' },
      plant_rose:     { id:'plant_rose',     name:'玫瑰',     emoji:'🌹', category:'plant',  unlockType:'total',  unlockDays:20, level:4, anim:'sway',      desc:'带刺的玫瑰，美丽又坚韧。' },
      plant_tree:     { id:'plant_tree',     name:'小树',     emoji:'🌳', category:'plant',  unlockType:'total',  unlockDays:30, level:5, anim:'sway',      desc:'一棵安静的树，默默守护着花园。' },
      plant_cactus:   { id:'plant_cactus',   name:'仙人掌',   emoji:'🌵', category:'plant',  unlockType:'total',  unlockDays:45, level:5, anim:'bounce',    desc:'坚强的仙人掌，就算难过也会好好长大。' },
      plant_mushroom: { id:'plant_mushroom', name:'小蘑菇',   emoji:'🍄', category:'plant',  unlockType:'total',  unlockDays:50, level:6, anim:'bounce',    desc:'雨后冒出的小蘑菇，圆滚滚的很可爱。' },
      plant_cherry:   { id:'plant_cherry',   name:'樱花树',   emoji:'🌸', category:'plant',  unlockType:'streak', unlockDays:60, level:6, anim:'sway',      desc:'盛开的樱花树，花瓣随风飘落。' },

      // 动物类 (10-15)
      animal_butterfly:{ id:'animal_butterfly', name:'花蝴蝶',  emoji:'🦋', category:'animal', unlockType:'streak', unlockDays:14, level:4, anim:'flutter',   desc:'翩跹起舞的蝴蝶，为花园带来生机。' },
      animal_bee:     { id:'animal_bee',      name:'小蜜蜂',  emoji:'🐝', category:'animal', unlockType:'total',  unlockDays:25, level:4, anim:'flutter',   desc:'勤劳的小蜜蜂，嗡嗡嗡地采花蜜。' },
      animal_bird:    { id:'animal_bird',     name:'小鸟',    emoji:'🐦', category:'animal', unlockType:'total',  unlockDays:35, level:5, anim:'bounce',    desc:'停在枝头唱歌的小鸟，歌声很动听。' },
      animal_ladybug: { id:'animal_ladybug',  name:'瓢虫',    emoji:'🐞', category:'animal', unlockType:'total',  unlockDays:40, level:5, anim:'bounce',    desc:'红底黑点的小瓢虫，是花园的小幸运。' },
      animal_cat:     { id:'animal_cat',      name:'小猫咪',  emoji:'🐱', category:'animal', unlockType:'total',  unlockDays:50, level:6, anim:'bounce',    desc:'慵懒的小猫咪，喜欢在阳光下打盹。' },
      animal_rabbit:  { id:'animal_rabbit',   name:'小兔子',  emoji:'🐰', category:'animal', unlockType:'streak', unlockDays:45, level:6, anim:'bounce',    desc:'蹦蹦跳跳的小兔子，爱吃胡萝卜。' },

      // 天象类 (16-21)
      sky_cloud:      { id:'sky_cloud',      name:'小云朵',  emoji:'☁️', category:'sky',    unlockType:'total',  unlockDays:15, level:3, anim:'float',     desc:'软绵绵的小云朵，飘来飘去。' },
      sky_sun:        { id:'sky_sun',        name:'太阳',    emoji:'☀️', category:'sky',    unlockType:'streak', unlockDays:21, level:4, anim:'shimmer',   desc:'温暖的太阳，照亮整个花园。' },
      sky_rainbow:    { id:'sky_rainbow',    name:'彩虹',    emoji:'🌈', category:'sky',    unlockType:'streak', unlockDays:30, level:5, anim:'shimmer',   desc:'雨后的彩虹，是希望的颜色。' },
      sky_star:       { id:'sky_star',       name:'星星',    emoji:'⭐', category:'sky',    unlockType:'streak', unlockDays:60, level:6, anim:'shimmer',   desc:'一闪一闪的小星星，在夜里守护你。' },
      sky_moon:       { id:'sky_moon',       name:'月亮',    emoji:'🌙', category:'sky',    unlockType:'total',  unlockDays:75, level:6, anim:'float',     desc:'温柔的月亮，晚安。' },
      sky_snow:       { id:'sky_snow',       name:'雪花',    emoji:'❄️', category:'sky',    unlockType:'total',  unlockDays:90, level:6, anim:'float',     desc:'洁白的雪花，冬天的小惊喜。' },

      // 装饰类 (22-27)
      // 注意：🪔(油灯)和🪑(椅子)是Unicode 13.0，Windows旧版不支持
      // 替换为 💡(灯泡)和 💺(座椅)，都是Unicode 6.0，兼容性好
      deco_fence:     { id:'deco_fence',     name:'小栅栏',  emoji:'🚪', category:'deco',   unlockType:'total',  unlockDays:20, level:3, anim:'',          desc:'可爱的小栅栏，把花园围起来。' },
      deco_house:     { id:'deco_house',     name:'小木屋',  emoji:'🏡', category:'deco',   unlockType:'total',  unlockDays:60, level:6, anim:'',          desc:'温馨的小木屋，是花仙子的家。' },
      deco_lamp:      { id:'deco_lamp',      name:'小路灯',  emoji:'💡', category:'deco',   unlockType:'total',  unlockDays:55, level:6, anim:'shimmer',   desc:'暖暖的小路灯，夜晚也不怕黑。' },
      deco_swing:     { id:'deco_swing',     name:'秋千',    emoji:'🎠', category:'deco',   unlockType:'streak', unlockDays:50, level:6, anim:'sway',      desc:'轻轻摇晃的秋千，承载着童年的梦。' },
      deco_fountain:  { id:'deco_fountain',  name:'喷泉',    emoji:'⛲', category:'deco',   unlockType:'streak', unlockDays:60, level:6, anim:'bounce',    desc:'叮咚作响的喷泉，清凉又治愈。' },
      deco_bench:     { id:'deco_bench',     name:'长椅',    emoji:'💺', category:'deco',   unlockType:'total',  unlockDays:40, level:5, anim:'',          desc:'安静的长椅，累了就坐一会儿吧。' }
    };

    var CATEGORIES = [
      { id: 'plant',  name: '🌱 植物',  items: Object.values(ITEMS).filter(function(i){ return i.category === 'plant'; }) },
      { id: 'animal', name: '🦋 动物',  items: Object.values(ITEMS).filter(function(i){ return i.category === 'animal'; }) },
      { id: 'sky',    name: '🌈 天象',  items: Object.values(ITEMS).filter(function(i){ return i.category === 'sky'; }) },
      { id: 'deco',   name: '🏡 装饰',  items: Object.values(ITEMS).filter(function(i){ return i.category === 'deco'; }) }
    ];

    var LEVEL_NAMES = ['', '荒地', '萌芽', '小花圃', '小花园', '秘密花园', '星空花园'];

    var GREETINGS = {
      morning: ['早安，花园里的花还带着露珠呢 🌅','新的一天开始了，花儿也醒了 🌻','早上好，今天也要开心呀 ☀️'],
      noon: ['中午好，花儿正在晒太阳呢 🌞','午饭时间到，小蜜蜂也去吃饭了 🐝','午后的阳光，暖暖的很舒服 🌤️'],
      afternoon: ['下午好，风吹过花园很舒服 🍃','下午茶时间，要休息一下吗 ☕','下午的花园，静悄悄的 🌿'],
      evening: ['晚上好，花园亮起了小灯 💡','辛苦一天了，来花园坐会儿吧 🏡','夜幕降临，星星快要出来了 ✨'],
      night: ['这么晚还没睡呀，月亮陪着你 🌙','晚安，花儿也睡着了 🌸','夜很深了，早点休息哦 💤']
    };

    /* ==================== 存储模块 ==================== */
    function getStorageKey(key) {
      return STORAGE_PREFIX + key;
    }

    function getData(key, defaultValue) {
      try {
        var val = localStorage.getItem(getStorageKey(key));
        return val !== null ? JSON.parse(val) : defaultValue;
      } catch(e) {
        return defaultValue;
      }
    }

    function setData(key, value) {
      localStorage.setItem(getStorageKey(key), JSON.stringify(value));
    }

    /* ==================== 状态 ==================== */
    var state = {
      streak: 0,
      total: 0,
      lastCheckin: null,
      unlocked: [],
      positions: {},
      unlockDates: {},
      level: 1,
      gridCols: 5,
      gridRows: 3
    };

    function loadState() {
      state.streak = parseInt(getData('streak', '0'));
      state.total = parseInt(getData('total', '0'));
      state.lastCheckin = getData('lastCheckin', null);
      state.unlocked = getData('unlocked', []);
      state.positions = getData('positions', {});
      state.unlockDates = getData('unlockDates', {});
      state.level = parseInt(getData('level', '1'));
    }

    function saveState() {
      setData('streak', String(state.streak));
      setData('total', String(state.total));
      setData('lastCheckin', state.lastCheckin);
      setData('unlocked', state.unlocked);
      setData('positions', state.positions);
      setData('unlockDates', state.unlockDates);
      setData('level', String(state.level));
    }

    /* ==================== 日期工具 ==================== */
    function getToday() {
      return new Date();
    }

    function formatDate(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function formatDateCN(dateStr) {
      var parts = dateStr.split('-');
      return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
    }

    function getYesterday() {
      var d = new Date();
      d.setDate(d.getDate() - 1);
      return d;
    }

    /* ==================== 网格计算 ==================== */
    function calculateGrid() {
      var area = document.querySelector('.garden-area');
      if (!area) return;

      var w = area.clientWidth - 40; // padding
      var h = area.clientHeight - 60; // greeting + padding

      var cellSize = 80; // 目标格子大小
      var cols = Math.max(3, Math.min(10, Math.floor(w / cellSize)));
      var rows = Math.max(2, Math.min(8, Math.floor(h / cellSize)));

      state.gridCols = cols;
      state.gridRows = rows;

      var grid = document.getElementById('gardenGrid');
      if (grid) {
        grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
        grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
      }
    }

    /* ==================== 签到逻辑 ==================== */
    function checkin() {
      var today = getToday();
      var todayStr = formatDate(today);

      if (state.lastCheckin === todayStr) {
        showToast('今天已经签到过啦，明天再来吧 🌸');
        return { success: false, alreadyChecked: true };
      }

      var yesterday = formatDate(getYesterday());
      var isConsecutive = (state.lastCheckin === yesterday);

      if (isConsecutive) {
        state.streak++;
      } else {
        state.streak = 1;
      }
      state.total++;
      state.lastCheckin = todayStr;

      var newUnlocks = checkUnlocks();
      updateLevel();
      saveState();
      renderGarden();
      updateStats();

      return {
        success: true,
        streak: state.streak,
        total: state.total,
        newUnlocks: newUnlocks
      };
    }

    function checkUnlocks() {
      var newUnlocks = [];
      var todayStr = formatDate(getToday());

      Object.values(ITEMS).forEach(function(item) {
        if (state.unlocked.indexOf(item.id) >= 0) return;

        var unlocked = false;
        if (item.unlockType === 'streak' && state.streak >= item.unlockDays) {
          unlocked = true;
        } else if (item.unlockType === 'total' && state.total >= item.unlockDays) {
          unlocked = true;
        }

        if (unlocked) {
          state.unlocked.push(item.id);
          state.unlockDates[item.id] = todayStr;
          autoPlaceItem(item.id);
          newUnlocks.push(item);
        }
      });

      return newUnlocks;
    }

    function updateLevel() {
      var level = 1;
      if (state.streak >= 60) level = 6;
      else if (state.streak >= 30) level = 5;
      else if (state.streak >= 14) level = 4;
      else if (state.streak >= 7) level = 3;
      else if (state.streak >= 3) level = 2;
      state.level = level;
    }

    function autoPlaceItem(itemId) {
      var totalCells = state.gridCols * state.gridRows;
      var availableSlots = [];

      for (var i = 0; i < totalCells; i++) {
        var occupied = false;
        for (var key in state.positions) {
          if (state.positions[key] === i) {
            occupied = true;
            break;
          }
        }
        if (!occupied) {
          availableSlots.push(i);
        }
      }

      if (availableSlots.length > 0) {
        var randomIndex = availableSlots[Math.floor(Math.random() * availableSlots.length)];
        state.positions[itemId] = randomIndex;
      }
    }

    /* ==================== 渲染 ==================== */
    function renderGarden() {
      var grid = document.getElementById('gardenGrid');
      if (!grid) return;

      grid.innerHTML = '';

      var totalCells = state.gridCols * state.gridRows;

      for (var i = 0; i < totalCells; i++) {
        var cell = document.createElement('div');
        cell.className = 'garden-cell';

        var itemId = null;
        for (var key in state.positions) {
          if (state.positions[key] === i) {
            itemId = key;
            break;
          }
        }

        if (itemId && ITEMS[itemId]) {
          cell.classList.add('has-item');
          var itemEl = document.createElement('div');
          itemEl.className = 'garden-item ' + ITEMS[itemId].anim;
          itemEl.textContent = ITEMS[itemId].emoji;
          itemEl.title = ITEMS[itemId].name;
          (function(id) {
            itemEl.addEventListener('click', function() { showItemDetail(id); });
          })(itemId);
          cell.appendChild(itemEl);
        }

        grid.appendChild(cell);
      }
    }

    function updateStats() {
      document.getElementById('streakValue').textContent = state.streak;
      document.getElementById('totalValue').textContent = state.total;
      document.getElementById('levelValue').textContent = state.level;

      var nextReward = getNextReward();
      if (nextReward) {
        var progress = 0;
        if (nextReward.unlockType === 'streak') {
          progress = Math.min(100, (state.streak / nextReward.unlockDays) * 100);
        } else {
          progress = Math.min(100, (state.total / nextReward.unlockDays) * 100);
        }
        document.getElementById('nextRewardText').textContent =
          nextReward.emoji + ' ' + nextReward.name + '（' +
          (nextReward.unlockType === 'streak' ? '连续' : '累计') + nextReward.unlockDays + '天）';
        document.getElementById('progressFill').style.width = progress + '%';
      } else {
        document.getElementById('nextRewardText').textContent = '🎉 已全部解锁！';
        document.getElementById('progressFill').style.width = '100%';
      }
    }

    function getNextReward() {
      var next = null;
      var minDays = Infinity;

      Object.values(ITEMS).forEach(function(item) {
        if (state.unlocked.indexOf(item.id) >= 0) return;
        var current = item.unlockType === 'streak' ? state.streak : state.total;
        var remaining = item.unlockDays - current;
        if (remaining > 0 && remaining < minDays) {
          minDays = remaining;
          next = item;
        }
      });

      return next;
    }

    function updateGreeting() {
      var hour = getToday().getHours();
      var pool;
      if (hour >= 6 && hour < 12) pool = GREETINGS.morning;
      else if (hour >= 12 && hour < 14) pool = GREETINGS.noon;
      else if (hour >= 14 && hour < 18) pool = GREETINGS.afternoon;
      else if (hour >= 18 && hour < 22) pool = GREETINGS.evening;
      else pool = GREETINGS.night;

      var text = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('greetingText').textContent = text;
    }

    /* ==================== 弹窗 ==================== */
    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById('toast');
      if (!toast) return;
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2500);
    }

    function showItemDetail(itemId) {
      var item = ITEMS[itemId];
      if (!item) return;

      document.getElementById('detailEmoji').textContent = item.emoji;
      document.getElementById('detailName').textContent = item.name;
      document.getElementById('detailDesc').textContent = item.desc;

      var dateStr = state.unlockDates[itemId];
      if (dateStr) {
        document.getElementById('detailDate').textContent = '解锁于 ' + formatDateCN(dateStr);
      } else {
        document.getElementById('detailDate').textContent = '';
      }

      document.getElementById('itemDetailModal').classList.add('show');
    }

    function closeItemDetail() {
      document.getElementById('itemDetailModal').classList.remove('show');
    }

    function showUnlockModal(item) {
      document.getElementById('unlockEmoji').textContent = item.emoji;
      document.getElementById('unlockName').textContent = item.name;
      document.getElementById('unlockDesc').textContent = item.desc;
      document.getElementById('unlockStreak').textContent =
        (item.unlockType === 'streak' ? '连续签到 ' : '累计签到 ') + item.unlockDays + ' 天达成！';

      document.getElementById('unlockModal').classList.add('show');
      createUnlockParticles();
    }

    function closeUnlockModal() {
      document.getElementById('unlockModal').classList.remove('show');
    }

    function createUnlockParticles() {
      var container = document.getElementById('particlesContainer');
      if (!container) return;

      var emojis = ['✨', '🌟', '💫', '⭐', '🌸', '💖'];
      var centerX = window.innerWidth / 2;
      var centerY = window.innerHeight / 2;

      for (var i = 0; i < 25; i++) {
        var p = document.createElement('div');
        p.className = 'sparkle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = centerX + 'px';
        p.style.top = centerY + 'px';
        p.style.fontSize = (14 + Math.random() * 20) + 'px';

        var angle = Math.random() * Math.PI * 2;
        var distance = 120 + Math.random() * 200;
        p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

        container.appendChild(p);
        (function(el) {
          setTimeout(function() { el.remove(); }, 1500);
        })(p);
      }
    }

    /* ==================== 图鉴 ==================== */
    function openCollection() {
      renderCollection();
      document.getElementById('collectionModal').classList.add('show');
    }

    function closeCollection() {
      document.getElementById('collectionModal').classList.remove('show');
    }

    function renderCollection() {
      var content = document.getElementById('collectionContent');
      if (!content) return;

      content.innerHTML = '';

      CATEGORIES.forEach(function(cat) {
        var section = document.createElement('div');
        section.className = 'collection-section';

        var unlockedCount = cat.items.filter(function(i) {
          return state.unlocked.indexOf(i.id) >= 0;
        }).length;

        var title = document.createElement('div');
        title.className = 'collection-section-title';
        title.innerHTML = cat.name + ' <span class="count">(' + unlockedCount + '/' + cat.items.length + ')</span>';
        section.appendChild(title);

        var grid = document.createElement('div');
        grid.className = 'collection-grid';

        cat.items.forEach(function(item) {
          var itemEl = document.createElement('div');
          var isUnlocked = state.unlocked.indexOf(item.id) >= 0;
          itemEl.className = 'collection-item ' + (isUnlocked ? 'unlocked' : 'locked');
          itemEl.textContent = isUnlocked ? item.emoji : '❓';
          itemEl.title = isUnlocked ? item.name : '未解锁';

          if (isUnlocked) {
            itemEl.addEventListener('click', function() {
              closeCollection();
              setTimeout(function() { showItemDetail(item.id); }, 200);
            });
          }

          grid.appendChild(itemEl);
        });

        section.appendChild(grid);
        content.appendChild(section);
      });

      var totalCount = Object.keys(ITEMS).length;
      var unlockedTotal = state.unlocked.length;
      document.getElementById('collectionProgress').textContent = unlockedTotal + ' / ' + totalCount;
    }

    /* ==================== 调试功能 ==================== */
    var debugOpen = false;

    function toggleDebug() {
      debugOpen = !debugOpen;
      var panel = document.getElementById('debugPanel');
      if (panel) {
        panel.classList.toggle('show', debugOpen);
      }
    }

    function debugAddStreak(days) {
      for (var i = 0; i < days; i++) {
        state.streak++;
        state.total++;
      }
      var newUnlocks = checkUnlocks();
      updateLevel();
      saveState();
      renderGarden();
      updateStats();

      if (newUnlocks.length > 0) {
        setTimeout(function() {
          showUnlockModal(newUnlocks[newUnlocks.length - 1]);
        }, 300);
      }
      showToast('已增加 ' + days + ' 天连续签到');
    }

    function debugReset() {
      if (!confirm('确定要重置花园吗？所有进度都会清空哦')) return;
      state.streak = 0;
      state.total = 0;
      state.lastCheckin = null;
      state.unlocked = [];
      state.positions = {};
      state.unlockDates = {};
      state.level = 1;
      saveState();
      renderGarden();
      updateStats();
      showToast('花园已重置');
    }

    function debugUnlockAll() {
      Object.values(ITEMS).forEach(function(item) {
        if (state.unlocked.indexOf(item.id) < 0) {
          state.unlocked.push(item.id);
          state.unlockDates[item.id] = formatDate(getToday());
          autoPlaceItem(item.id);
        }
      });
      state.streak = Math.max(state.streak, 60);
      state.total = Math.max(state.total, 90);
      updateLevel();
      saveState();
      renderGarden();
      updateStats();
      showToast('已解锁全部物品 🎉');
    }

    /* ==================== 模拟签到 ==================== */
    function simulateCheckin() {
      var result = checkin();
      if (!result.success) return;

      if (result.newUnlocks.length > 0) {
        setTimeout(function() {
          showUnlockModal(result.newUnlocks[result.newUnlocks.length - 1]);
        }, 500);
      }
      showToast('签到成功！连续 ' + result.streak + ' 天 🌸');
    }

    /* ==================== 返回 ==================== */
    function goBack() {
      if (document.referrer) {
        window.history.back();
      } else {
        showToast('这是独立页面，没有上一页哦');
      }
    }

    /* ==================== 窗口大小变化 ==================== */
    var resizeTimer = null;
    function handleResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        calculateGrid();
        renderGarden();
      }, 150);
    }

    /* ==================== 初始化 ==================== */
    function init() {
      loadState();
      calculateGrid();

      if (state.unlocked.length === 0) {
        state.unlocked.push('plant_seed');
        state.unlockDates['plant_seed'] = formatDate(getToday());
        autoPlaceItem('plant_seed');
        saveState();
      }

      renderGarden();
      updateStats();
      updateGreeting();

      document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            overlay.classList.remove('show');
          }
        });
      });

      window.addEventListener('resize', handleResize);

      console.log('🌿 情绪花园已加载');
      console.log('网格:', state.gridCols, 'x', state.gridRows);
      console.log('连续签到:', state.streak, '天');
      console.log('累计签到:', state.total, '天');
      console.log('已解锁:', state.unlocked.length, '/', Object.keys(ITEMS).length, '件物品');
    }

    window.simulateCheckin = simulateCheckin;
    window.openCollection = openCollection;
    window.closeCollection = closeCollection;
    window.closeItemDetail = closeItemDetail;
    window.closeUnlockModal = closeUnlockModal;
    window.debugAddStreak = debugAddStreak;
    window.debugReset = debugReset;
    window.debugUnlockAll = debugUnlockAll;
    window.toggleDebug = toggleDebug;
    window.goBack = goBack;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
