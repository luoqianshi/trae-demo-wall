<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>砸玻璃 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .rage-bar-container {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 280px;
    }

    .rage-label {
      text-align: center;
      color: #fff;
      font-size: 12px;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .rage-bar {
      height: 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
    }

    .rage-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #ff6b6b);
      background-size: 200% 100%;
      width: 0%;
      transition: width 0.2s ease;
      border-radius: 10px;
      animation: rageGlow 2s ease-in-out infinite;
    }

    .rage-fill.ready {
      animation: ragePulse 0.5s ease-in-out infinite;
    }

    @keyframes rageGlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes ragePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 107, 107, 0.5); }
      50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(255, 107, 107, 0.8); }
    }

    .ultimate-btn {
      position: fixed;
      top: 110px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      z-index: 100;
      padding: 10px 30px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d);
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      font-family: inherit;
      letter-spacing: 2px;
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.5);
    }

    .ultimate-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
      animation: ultimateBounce 1s ease-in-out infinite;
    }

    @keyframes ultimateBounce {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
    }

    .stats-panel {
      position: fixed;
      top: 160px;
      left: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      min-width: 100px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .stat-label {
      color: rgba(255,255,255,0.6);
    }

    .stat-value {
      font-weight: 600;
    }

    .glass-guide {
      position: fixed;
      top: 160px;
      right: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 120px;
    }

    .guide-title {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-align: center;
    }

    .guide-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 10px;
    }

    .guide-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 26px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(-50%) scale(1.05);
    }

    .healing-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .healing-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .tea-cup {
      font-size: 80px;
      margin-bottom: 24px;
      animation: cupFloat 3s ease-in-out infinite;
    }

    @keyframes cupFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .steam {
      position: absolute;
      font-size: 30px;
      opacity: 0;
      animation: steamRise 2s ease-in-out infinite;
    }

    .steam:nth-child(2) { animation-delay: 0.5s; }
    .steam:nth-child(3) { animation-delay: 1s; }

    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
    }

    .healing-text {
      color: #fff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.5s;
    }

    .healing-sub {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.8s;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .healing-btn {
      padding: 12px 32px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      font-family: inherit;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 1.2s;
    }

    .healing-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }

    .screen-shake {
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .ultimate-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 400;
      opacity: 0;
      pointer-events: none;
    }

    .ultimate-flash.flash {
      animation: flashAnim 0.5s ease;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      30% { opacity: 0.8; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>砸玻璃</h1>
    <p>用力砸，释放所有不开心</p>
  </div>

  <div class="rage-bar-container">
    <div class="rage-label">怒气值</div>
    <div class="rage-bar">
      <div class="rage-fill" id="rageFill"></div>
    </div>
  </div>

  <button class="ultimate-btn" id="ultimateBtn">💥 全屏粉碎!</button>

  <div class="stats-panel">
    <div class="stat-item">
      <span class="stat-label">已砸碎</span>
      <span class="stat-value" id="smashedCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">连击</span>
      <span class="stat-value" id="comboCount">0</span>
    </div>
  </div>

  <div class="glass-guide">
    <div class="guide-title">玻璃类型</div>
    <div class="guide-item">
      <div class="guide-dot" style="background: rgba(200, 220, 255, 0.6);"></div>
      <span>普通玻璃</span>
    </div>
    <div class="guide-item">
      <div class="guide-dot" style="background: rgba(100, 149, 237, 0.8);"></div>
      <span>钢化玻璃 x3</span>
    </div>
    <div class="guide-item">
      <div class="guide-dot" style="background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);"></div>
      <span>彩色玻璃</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="ultimate-flash" id="ultimateFlash"></div>

  <div class="healing-overlay" id="healingOverlay">
    <div style="position: relative;">
      <div class="steam" style="left: 30px; top: -20px;">☁️</div>
      <div class="steam" style="left: 50px; top: -25px;">☁️</div>
      <div class="steam" style="left: 70px; top: -20px;">☁️</div>
      <div class="tea-cup">🍵</div>
    </div>
    <div class="healing-text">辛苦了，喝杯温水吧</div>
    <div class="healing-sub">愿你被这世界温柔以待</div>
    <button class="healing-btn" onclick="restartGame()">再玩一次</button>
  </div>

  <button class="back-btn" onclick="location.href='game-hub.html'">返回游戏长廊</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let glasses = [];
    let particles = [];
    let crackEffects = [];
    let smashedCount = 0;
    let rage = 0;
    let combo = 0;
    let lastSmashTime = 0;
    const comboTimeout = 2000;
    let gameEnded = false;
    let smashToHeal = 30;

    const smashedCountEl = document.getElementById('smashedCount');
    const comboCountEl = document.getElementById('comboCount');
    const rageFill = document.getElementById('rageFill');
    const ultimateBtn = document.getElementById('ultimateBtn');
    const ultimateFlash = document.getElementById('ultimateFlash');
    const healingOverlay = document.getElementById('healingOverlay');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSmashSound(intensity = 1) {
      if (!audioCtx) return;

      const bufferSize = audioCtx.sampleRate * 0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2) * intensity;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(500, audioCtx.currentTime);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.3 * intensity, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      source.start();
    }

    function playUltimateSound() {
      if (!audioCtx) return;

      const bufferSize = audioCtx.sampleRate * 1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);

      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      source.start();
    }

    const GLASS_TYPES = {
      NORMAL: { name: 'normal', hp: 1, color: 'rgba(200, 220, 255, 0.4)', edgeColor: 'rgba(200, 220, 255, 0.8)', points: 10 },
      TOUGH: { name: 'tough', hp: 3, color: 'rgba(100, 149, 237, 0.5)', edgeColor: 'rgba(100, 149, 237, 0.9)', points: 30 },
      COLOR: { name: 'color', hp: 1, color: null, edgeColor: null, points: 20 }
    };

    class Glass {
      constructor() {
        this.reset();
      }

      reset() {
        const w = Math.random() * 100 + 80;
        const h = Math.random() * 120 + 100;
        this.w = w;
        this.h = h;
        this.x = Math.random() * (width - w - 40) + 20;
        this.y = Math.random() * (height - h - 200) + 180;

        const rand = Math.random();
        if (rand < 0.15) {
          this.type = GLASS_TYPES.TOUGH;
        } else if (rand < 0.3) {
          this.type = GLASS_TYPES.COLOR;
          this.hue = Math.random() * 360;
        } else {
          this.type = GLASS_TYPES.NORMAL;
        }

        this.hp = this.type.hp;
        this.maxHp = this.type.hp;
        this.broken = false;
        this.cracks = [];
        this.breakTime = 0;
        this.opacity = 0;
        this.targetOpacity = 0.7;
        this.scale = 0.8;
        this.targetScale = 1;
        this.rotation = (Math.random() - 0.5) * 0.05;
      }

      hit(x, y) {
        if (this.broken) return false;

        this.hp--;

        const crack = {
          x: x - this.x,
          y: y - this.y,
          lines: this.generateCrackLines(x - this.x, y - this.y)
        };
        this.cracks.push(crack);

        if (this.hp <= 0) {
          this.broken = true;
          this.breakTime = Date.now();
          return true;
        }
        return false;
      }

      generateCrackLines(cx, cy) {
        const lines = [];
        const count = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5;
          const length = Math.random() * 40 + 20;
          let x = cx;
          let y = cy;
          const points = [{ x, y }];
          const segments = 3 + Math.floor(Math.random() * 3);
          for (let j = 0; j < segments; j++) {
            const segLen = length / segments;
            x += Math.cos(angle + (Math.random() - 0.5) * 0.8) * segLen;
            y += Math.sin(angle + (Math.random() - 0.5) * 0.8) * segLen;
            points.push({ x, y });
          }
          lines.push(points);
        }
        return lines;
      }

      update() {
        this.opacity += (this.targetOpacity - this.opacity) * 0.1;
        this.scale += (this.targetScale - this.scale) * 0.1;

        if (this.broken) {
          const elapsed = Date.now() - this.breakTime;
          if (elapsed > 500) {
            this.reset();
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.rotate(this.rotation);
        ctx.scale(this.scale, this.scale);

        const x = -this.w / 2;
        const y = -this.h / 2;

        if (this.broken) {
          const elapsed = Date.now() - this.breakTime;
          const alpha = Math.max(0, 1 - elapsed / 500);
          ctx.globalAlpha = alpha;
        }

        if (this.type === GLASS_TYPES.COLOR) {
          const gradient = ctx.createLinearGradient(x, y, x + this.w, y + this.h);
          gradient.addColorStop(0, `hsla(${this.hue}, 80%, 70%, ${this.opacity * 0.5})`);
          gradient.addColorStop(0.5, `hsla(${(this.hue + 60) % 360}, 80%, 70%, ${this.opacity * 0.5})`);
          gradient.addColorStop(1, `hsla(${(this.hue + 120) % 360}, 80%, 70%, ${this.opacity * 0.5})`);
          ctx.fillStyle = gradient;
        } else {
          ctx.fillStyle = this.type.color.replace(/[\d.]+\)$/, `${this.opacity * 0.5})`);
        }

        roundRect(ctx, x, y, this.w, this.h, 8);
        ctx.fill();

        ctx.strokeStyle = this.type === GLASS_TYPES.COLOR
          ? `hsla(${this.hue}, 80%, 80%, ${this.opacity})`
          : this.type.edgeColor.replace(/[\d.]+\)$/, `${this.opacity})`);
        ctx.lineWidth = 2;
        roundRect(ctx, x, y, this.w, this.h, 8);
        ctx.stroke();

        ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 10);
        ctx.lineTo(x + this.w * 0.4, y + 10);
        ctx.lineTo(x + 10, y + this.h * 0.5);
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.6})`;
        ctx.lineWidth = 1.5;
        this.cracks.forEach(crack => {
          crack.lines.forEach(line => {
            if (line.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x - this.w / 2, line[0].y - this.h / 2);
            for (let i = 1; i < line.length; i++) {
              ctx.lineTo(line[i].x - this.w / 2, line[i].y - this.h / 2);
            }
            ctx.stroke();
          });
        });

        if (this.type === GLASS_TYPES.TOUGH && this.hp > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(this.hp.toString(), 0, 5);
        }

        ctx.restore();
      }

      isClicked(mx, my) {
        return mx >= this.x && mx <= this.x + this.w &&
               my >= this.y && my <= this.y + this.h;
      }
    }

    class Particle {
      constructor(x, y, color, size, speed, angle) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.3;
        this.gravity = 0.15;
        this.alpha = 1;
        this.decay = 0.015 + Math.random() * 0.01;
        this.shape = Math.random() > 0.5 ? 'triangle' : 'shard';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        if (this.shape === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -this.size);
          ctx.lineTo(this.size * 0.8, this.size * 0.6);
          ctx.lineTo(-this.size * 0.8, this.size * 0.6);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(-this.size * 0.5, -this.size);
          ctx.lineTo(this.size * 0.5, -this.size * 0.3);
          ctx.lineTo(this.size * 0.3, this.size);
          ctx.lineTo(-this.size * 0.6, this.size * 0.5);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      isDead() {
        return this.alpha <= 0 || this.y > height + 50;
      }
    }

    function createShatterParticles(glass) {
      const cx = glass.x + glass.w / 2;
      const cy = glass.y + glass.h / 2;
      const count = 30 + Math.floor(Math.random() * 20);

      let color;
      if (glass.type === GLASS_TYPES.COLOR) {
        color = `hsl(${glass.hue}, 80%, 75%)`;
      } else if (glass.type === GLASS_TYPES.TOUGH) {
        color = 'rgba(100, 149, 237, 0.9)';
      } else {
        color = 'rgba(200, 220, 255, 0.9)';
      }

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        const size = Math.random() * 12 + 5;

        const px = glass.x + Math.random() * glass.w;
        const py = glass.y + Math.random() * glass.h;

        particles.push(new Particle(px, py, color, size, speed, angle));
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function updateUI() {
      smashedCountEl.textContent = smashedCount;
      comboCountEl.textContent = combo;

      const ragePercent = Math.min(100, rage);
      rageFill.style.width = ragePercent + '%';

      if (ragePercent >= 100) {
        rageFill.classList.add('ready');
        ultimateBtn.classList.add('show');
      } else {
        rageFill.classList.remove('ready');
        ultimateBtn.classList.remove('show');
      }
    }

    function smashGlass(glass, mx, my) {
      const wasBroken = glass.hit(mx, my);

      if (wasBroken) {
        createShatterParticles(glass);
        playSmashSound(glass.type === GLASS_TYPES.TOUGH ? 1.5 : 1);

        const now = Date.now();
        if (now - lastSmashTime < comboTimeout) {
          combo++;
        } else {
          combo = 1;
        }
        lastSmashTime = now;

        const rageGain = glass.type === GLASS_TYPES.TOUGH ? 15 : (glass.type === GLASS_TYPES.COLOR ? 10 : 8);
        rage = Math.min(100, rage + rageGain + combo);

        smashedCount++;

        document.body.classList.add('screen-shake');
        setTimeout(() => document.body.classList.remove('screen-shake'), 300);

        if (smashedCount >= smashToHeal && !gameEnded) {
          setTimeout(() => {
            endGame();
          }, 500);
        }
      } else {
        playSmashSound(0.5);
        rage = Math.min(100, rage + 2);
      }

      updateUI();
    }

    function activateUltimate() {
      if (rage < 100 || gameEnded) return;

      rage = 0;
      updateUI();

      ultimateFlash.classList.add('flash');
      setTimeout(() => ultimateFlash.classList.remove('flash'), 500);

      playUltimateSound();

      document.body.classList.add('screen-shake');
      setTimeout(() => document.body.classList.remove('screen-shake'), 500);

      glasses.forEach(glass => {
        if (!glass.broken) {
          glass.hp = 0;
          glass.broken = true;
          glass.breakTime = Date.now();
          createShatterParticles(glass);
          smashedCount++;
        }
      });

      for (let i = 0; i < 100; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 15 + 5;
        const size = Math.random() * 15 + 5;
        const hue = Math.random() * 360;
        particles.push(new Particle(x, y, `hsl(${hue}, 80%, 75%)`, size, speed, angle));
      }

      if (smashedCount >= smashToHeal && !gameEnded) {
        setTimeout(() => {
          endGame();
        }, 1000);
      }
    }

    function endGame() {
      gameEnded = true;
      healingOverlay.classList.add('show');
    }

    function restartGame() {
      gameEnded = false;
      smashedCount = 0;
      rage = 0;
      combo = 0;
      healingOverlay.classList.remove('show');
      glasses.forEach(g => g.reset());
      updateUI();
    }

    function handleClick(e) {
      initAudio();
      if (gameEnded) return;

      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      for (let i = glasses.length - 1; i >= 0; i--) {
        if (glasses[i].isClicked(mx, my)) {
          smashGlass(glasses[i], mx, my);
          break;
        }
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      glasses.forEach(glass => {
        glass.update();
        glass.draw();
      });

      particles = particles.filter(p => {
        p.update();
        p.draw();
        return !p.isDead();
      });

      if (combo > 0 && Date.now() - lastSmashTime > comboTimeout) {
        combo = 0;
        updateUI();
      }

      requestAnimationFrame(animate);
    }

    function init() {
      resize();

      const glassCount = window.innerWidth < 768 ? 5 : 8;
      for (let i = 0; i < glassCount; i++) {
        glasses.push(new Glass());
      }

      updateUI();
      animate();
    }

    ultimateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      activateUltimate();
    });

    window.addEventListener('resize', () => {
      resize();
    });

    canvas.addEventListener('click', handleClick);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleClick(e.touches[0]);
    }, { passive: false });

    document.addEventListener('click', initAudio, { once: true });

    init();
  </script>
</body>
</html>
