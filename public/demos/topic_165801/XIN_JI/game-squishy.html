<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>捏捏乐 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #gameCanvas:active {
      cursor: grabbing;
    }

    .skin-selector {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.08);
      padding: 10px 16px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .skin-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .skin-btn:hover {
      transform: scale(1.1);
      background: rgba(255,255,255,0.15);
    }

    .skin-btn.active {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.2);
      transform: scale(1.15);
    }

    .stats-panel {
      position: fixed;
      top: 150px;
      left: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      min-width: 100px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .stat-label {
      color: rgba(255,255,255,0.6);
    }

    .stat-value {
      font-weight: 600;
    }

    .tip-panel {
      position: fixed;
      top: 150px;
      right: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 130px;
    }

    .tip-title {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-align: center;
    }

    .tip-text {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
      text-align: center;
    }

    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 26px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(-50%) scale(1.05);
    }

    .easter-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255, 215, 0, 0.15);
      padding: 20px 36px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 215, 0, 0.4);
      text-align: center;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 300;
    }

    .easter-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .easter-emoji {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .easter-text {
      font-size: 14px;
      color: #ffd700;
      margin-bottom: 4px;
    }

    .easter-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    .floating-hearts {
      position: fixed;
      pointer-events: none;
      z-index: 200;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 1.5s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>捏捏乐</h1>
    <p>捏一捏，软乎乎的治愈</p>
  </div>

  <div class="skin-selector">
    <button class="skin-btn active" data-skin="cat" title="小猫">🐱</button>
    <button class="skin-btn" data-skin="dino" title="恐龙">🦕</button>
    <button class="skin-btn" data-skin="cloud" title="云朵">☁️</button>
    <button class="skin-btn" data-skin="slime" title="史莱姆">🟢</button>
  </div>

  <div class="stats-panel">
    <div class="stat-item">
      <span class="stat-label">捏捏次数</span>
      <span class="stat-value" id="squishCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">彩蛋</span>
      <span class="stat-value" id="easterCount">0</span>
    </div>
  </div>

  <div class="tip-panel">
    <div class="tip-title">小提示</div>
    <div class="tip-text">
      按住拖动可以捏变形<br>
      不同角度有小表情彩蛋哦~
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="easter-popup" id="easterPopup">
    <div class="easter-emoji" id="easterEmoji">🎉</div>
    <div class="easter-text" id="easterText">发现彩蛋!</div>
    <div class="easter-sub" id="easterSub">你找到小表情了~</div>
  </div>

  <button class="back-btn" onclick="location.href='game-hub.html'">返回游戏长廊</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let squishCount = 0;
    let easterCount = 0;
    let currentSkin = 'cat';
    let isDragging = false;
    let dragPos = { x: 0, y: 0 };
    let lastSquishTime = 0;
    let discoveredEggs = new Set();

    const squishCountEl = document.getElementById('squishCount');
    const easterCountEl = document.getElementById('easterCount');
    const easterPopup = document.getElementById('easterPopup');
    const easterEmoji = document.getElementById('easterEmoji');
    const easterText = document.getElementById('easterText');
    const easterSub = document.getElementById('easterSub');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSquishSound(intensity = 1) {
      if (!audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime);

      gainNode.gain.setValueAtTime(0.2 * intensity, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

      oscillator.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.2);
    }

    function playBounceSound() {
      if (!audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);

      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.15);
    }

    function playEasterSound() {
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);

        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
      });
    }

    const SKINS = {
      cat: {
        name: '小猫',
        baseColor: '#FFB6C1',
        gradientColors: ['#FFE4E8', '#FFB6C1', '#FF91A4'],
        ears: true,
        eyes: true,
        blush: true,
        emoji: '🐱',
        eggs: [
          { angle: 0, name: '笑脸猫', emoji: '😺', trigger: 'top' },
          { angle: Math.PI, name: '倒吊猫', emoji: '🙀', trigger: 'bottom' },
          { angle: Math.PI / 2, name: '歪头杀', emoji: '😽', trigger: 'right' },
        ]
      },
      dino: {
        name: '恐龙',
        baseColor: '#90EE90',
        gradientColors: ['#98FB98', '#90EE90', '#3CB371'],
        spikes: true,
        eyes: true,
        emoji: '🦕',
        eggs: [
          { angle: 0, name: '霸王龙', emoji: '🦖', trigger: 'top' },
          { angle: Math.PI, name: '翻肚肚', emoji: '😋', trigger: 'bottom' },
        ]
      },
      cloud: {
        name: '云朵',
        baseColor: '#FFFFFF',
        gradientColors: ['#FFFFFF', '#F0F8FF', '#E6E6FA'],
        fluffy: true,
        eyes: true,
        blush: true,
        emoji: '☁️',
        eggs: [
          { angle: 0, name: '下雨云', emoji: '🌧️', trigger: 'top' },
          { angle: Math.PI / 2, name: '闪电云', emoji: '⚡', trigger: 'right' },
          { angle: Math.PI, name: '彩虹云', emoji: '🌈', trigger: 'bottom' },
        ]
      },
      slime: {
        name: '史莱姆',
        baseColor: '#98FB98',
        gradientColors: ['#98FB98', '#00FA9A', '#00CED1'],
        translucent: true,
        eyes: true,
        blush: true,
        emoji: '🟢',
        eggs: [
          { angle: 0, name: '史莱姆王', emoji: '👑', trigger: 'top' },
          { angle: Math.PI, name: '融化了', emoji: '💚', trigger: 'bottom' },
        ]
      }
    };

    class Squishy {
      constructor() {
        this.points = [];
        this.numPoints = 24;
        this.baseRadius = 100;
        this.centerX = 0;
        this.centerY = 0;
        this.velocities = [];
        this.springStrength = 0.1;
        this.damping = 0.85;
        this.eyeOffset = { x: 0, y: 0 };
        this.mouthOffset = 0;
        this.currentEgg = null;
        this.eggTimer = 0;
        this.initPoints();
      }

      initPoints() {
        this.points = [];
        this.velocities = [];
        for (let i = 0; i < this.numPoints; i++) {
          const angle = (Math.PI * 2 / this.numPoints) * i;
          this.points.push({
            x: Math.cos(angle) * this.baseRadius,
            y: Math.sin(angle) * this.baseRadius,
            baseX: Math.cos(angle) * this.baseRadius,
            baseY: Math.sin(angle) * this.baseRadius,
            angle: angle
          });
          this.velocities.push({ x: 0, y: 0 });
        }
      }

      setPosition(x, y) {
        this.centerX = x;
        this.centerY = y;
      }

      applyForce(fx, fy, radius = 80) {
        for (let i = 0; i < this.numPoints; i++) {
          const p = this.points[i];
          const worldX = this.centerX + p.x;
          const worldY = this.centerY + p.y;
          const dx = worldX - fx;
          const dy = worldY - fy;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < radius) {
            const force = (1 - dist / radius) * 30;
            const angle = Math.atan2(dy, dx);
            this.velocities[i].x += Math.cos(angle) * force;
            this.velocities[i].y += Math.sin(angle) * force;
          }
        }
      }

      update() {
        for (let i = 0; i < this.numPoints; i++) {
          const p = this.points[i];
          const v = this.velocities[i];

          const dx = p.baseX - p.x;
          const dy = p.baseY - p.y;
          v.x += dx * this.springStrength;
          v.y += dy * this.springStrength;

          v.x *= this.damping;
          v.y *= this.damping;

          p.x += v.x;
          p.y += v.y;
        }

        const totalDeformation = this.points.reduce((sum, p, i) => {
          const dx = p.x - p.baseX;
          const dy = p.y - p.baseY;
          return sum + Math.sqrt(dx * dx + dy * dy);
        }, 0) / this.numPoints;

        this.eyeOffset.x *= 0.9;
        this.eyeOffset.y *= 0.9;
        this.mouthOffset *= 0.9;

        if (this.eggTimer > 0) {
          this.eggTimer--;
          if (this.eggTimer === 0) {
            this.currentEgg = null;
          }
        }

        return totalDeformation;
      }

      checkEasterEgg(dragX, dragY) {
        if (this.eggTimer > 0) return;

        const skin = SKINS[currentSkin];
        if (!skin.eggs) return;

        const dx = dragX - this.centerX;
        const dy = dragY - this.centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 30) return;

        const angle = Math.atan2(dy, dx);

        for (const egg of skin.eggs) {
          let angleDiff = Math.abs(angle - egg.angle);
          if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

          if (angleDiff < 0.5) {
            const eggKey = `${currentSkin}_${egg.name}`;
            if (!discoveredEggs.has(eggKey)) {
              discoveredEggs.add(eggKey);
              easterCount++;
              easterCountEl.textContent = easterCount;
              showEasterPopup(egg.emoji, `发现彩蛋！`, egg.name);
              playEasterSound();
              this.currentEgg = egg;
              this.eggTimer = 120;
            } else {
              this.currentEgg = egg;
              this.eggTimer = 60;
            }
            break;
          }
        }
      }

      draw() {
        const skin = SKINS[currentSkin];

        ctx.save();
        ctx.translate(this.centerX, this.centerY);

        if (skin.translucent) {
          ctx.globalAlpha = 0.85;
        }

        const gradient = ctx.createRadialGradient(-30, -30, 0, 0, 0, this.baseRadius * 1.2);
        gradient.addColorStop(0, skin.gradientColors[0]);
        gradient.addColorStop(0.5, skin.gradientColors[1]);
        gradient.addColorStop(1, skin.gradientColors[2]);

        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.numPoints; i++) {
          const p = this.points[i];
          const prevP = this.points[i - 1];
          const cpx = (prevP.x + p.x) / 2;
          const cpy = (prevP.y + p.y) / 2;
          ctx.quadraticCurveTo(prevP.x, prevP.y, cpx, cpy);
        }
        const lastP = this.points[this.numPoints - 1];
        const firstP = this.points[0];
        const cpx = (lastP.x + firstP.x) / 2;
        const cpy = (lastP.y + firstP.y) / 2;
        ctx.quadraticCurveTo(lastP.x, lastP.y, cpx, cpy);
        ctx.closePath();

        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.strokeStyle = skin.gradientColors[2];
        ctx.lineWidth = 3;
        ctx.stroke();

        if (skin.ears) {
          this.drawCatEars();
        }
        if (skin.spikes) {
          this.drawDinoSpikes();
        }
        if (skin.fluffy) {
          this.drawFluff();
        }

        if (skin.eyes) {
          this.drawFace();
        }

        if (skin.blush) {
          this.drawBlush();
        }

        ctx.restore();
      }

      drawCatEars() {
        const skin = SKINS[currentSkin];
        const earSize = 35;
        const earY = -this.baseRadius * 0.7;

        ctx.fillStyle = skin.gradientColors[1];
        ctx.strokeStyle = skin.gradientColors[2];
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(-this.baseRadius * 0.5, earY);
        ctx.lineTo(-this.baseRadius * 0.3, earY - earSize);
        ctx.lineTo(-this.baseRadius * 0.1, earY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.baseRadius * 0.5, earY);
        ctx.lineTo(this.baseRadius * 0.3, earY - earSize);
        ctx.lineTo(this.baseRadius * 0.1, earY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#FFB6C1';
        ctx.beginPath();
        ctx.moveTo(-this.baseRadius * 0.38, earY - 5);
        ctx.lineTo(-this.baseRadius * 0.3, earY - earSize + 10);
        ctx.lineTo(-this.baseRadius * 0.22, earY - 5);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(this.baseRadius * 0.38, earY - 5);
        ctx.lineTo(this.baseRadius * 0.3, earY - earSize + 10);
        ctx.lineTo(this.baseRadius * 0.22, earY - 5);
        ctx.closePath();
        ctx.fill();
      }

      drawDinoSpikes() {
        const skin = SKINS[currentSkin];
        const spikeSize = 20;

        ctx.fillStyle = skin.gradientColors[2];

        for (let i = 0; i < 5; i++) {
          const angle = -Math.PI / 2 + (i - 2) * 0.3;
          const x = Math.cos(angle) * this.baseRadius * 0.9;
          const y = Math.sin(angle) * this.baseRadius * 0.9;

          ctx.beginPath();
          ctx.moveTo(x - spikeSize / 2, y);
          ctx.lineTo(x, y - spikeSize);
          ctx.lineTo(x + spikeSize / 2, y);
          ctx.closePath();
          ctx.fill();
        }
      }

      drawFluff() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';

        for (let i = 0; i < this.numPoints; i++) {
          const p = this.points[i];
          if (p.y < -this.baseRadius * 0.3) {
            ctx.beginPath();
            ctx.arc(p.x, p.y - 5, 15, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.beginPath();
        ctx.arc(0, -this.baseRadius * 0.9, 25, 0, Math.PI * 2);
        ctx.fill();
      }

      drawFace() {
        const skin = SKINS[currentSkin];
        const eyeY = -15;
        const eyeSpacing = 30;

        if (this.currentEgg) {
          ctx.font = 'bold 40px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.currentEgg.emoji, 0, eyeY);
          return;
        }

        ctx.fillStyle = '#333';

        const leftEyeX = -eyeSpacing + this.eyeOffset.x;
        const rightEyeX = eyeSpacing + this.eyeOffset.x;
        const eyeYPos = eyeY + this.eyeOffset.y;

        ctx.beginPath();
        ctx.ellipse(leftEyeX, eyeYPos, 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(rightEyeX, eyeYPos, 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(leftEyeX - 3, eyeYPos - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(rightEyeX - 3, eyeYPos - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 10 + this.mouthOffset, 12, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        if (currentSkin === 'cat') {
          ctx.fillStyle = '#FFB6C1';
          ctx.beginPath();
          ctx.moveTo(0, 5);
          ctx.lineTo(-5, 0);
          ctx.lineTo(5, 0);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-25, 5);
          ctx.lineTo(-45, 0);
          ctx.moveTo(-25, 10);
          ctx.lineTo(-45, 12);
          ctx.moveTo(25, 5);
          ctx.lineTo(45, 0);
          ctx.moveTo(25, 10);
          ctx.lineTo(45, 12);
          ctx.stroke();
        }
      }

      drawBlush() {
        ctx.fillStyle = 'rgba(255, 150, 150, 0.4)';
        ctx.beginPath();
        ctx.ellipse(-40, 10, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(40, 10, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      isPointInside(px, py) {
        const dx = px - this.centerX;
        const dy = py - this.centerY;
        return Math.sqrt(dx * dx + dy * dy) < this.baseRadius * 1.2;
      }
    }

    const squishy = new Squishy();

    function showEasterPopup(emoji, text, sub) {
      easterEmoji.textContent = emoji;
      easterText.textContent = text;
      easterSub.textContent = sub;
      easterPopup.classList.add('show');

      setTimeout(() => {
        easterPopup.classList.remove('show');
      }, 2000);
    }

    function spawnHeart(x, y) {
      const hearts = ['💖', '💗', '💕', '💝', '✨'];
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1500);
    }

    function handlePointerDown(e) {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      if (squishy.isPointInside(x, y)) {
        isDragging = true;
        dragPos = { x, y };
        squishy.applyForce(x, y, 60);
        playSquishSound(0.8);
      }
    }

    function handlePointerMove(e) {
      if (!isDragging) return;

      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      dragPos = { x, y };
      squishy.applyForce(x, y, 50);

      const now = Date.now();
      if (now - lastSquishTime > 150) {
        playSquishSound(0.5);
        lastSquishTime = now;
        squishCount++;
        squishCountEl.textContent = squishCount;

        if (Math.random() < 0.3) {
          spawnHeart(x, y);
        }
      }
    }

    function handlePointerUp(e) {
      if (isDragging) {
        isDragging = false;
        playBounceSound();
        squishy.checkEasterEgg(dragPos.x, dragPos.y);
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      squishy.setPosition(width / 2, height / 2 + 20);
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      const deformation = squishy.update();
      squishy.draw();

      requestAnimationFrame(animate);
    }

    document.querySelectorAll('.skin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSkin = btn.dataset.skin;
        playBounceSound();
        squishy.initPoints();
      });
    });

    window.addEventListener('resize', resize);
    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('mouseleave', handlePointerUp);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointerDown(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointerMove(e);
    }, { passive: false });
    canvas.addEventListener('touchend', handlePointerUp);

    document.addEventListener('click', initAudio, { once: true });

    resize();
    animate();
  </script>
</body>
</html>
