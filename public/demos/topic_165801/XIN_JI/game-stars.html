<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晚安星空 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 标题 */
    .header {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      z-index: 100;
      opacity: 0.9;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(100, 149, 237, 0.5);
    }

    .header p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-weight: 200;
    }

    /* Canvas */
    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 左侧成就面板 */
    .achievements {
      position: fixed;
      top: 100px;
      left: 20px;
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 160px;
    }

    .achievements-title {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
      text-align: center;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 5px;
      opacity: 0.4;
      transition: all 0.3s;
    }

    .achievement-item.unlocked {
      opacity: 1;
      background: rgba(255, 215, 0, 0.15);
    }

    .achievement-icon {
      font-size: 18px;
    }

    .achievement-text {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
    }

    /* 中央计数器 */
    .counter {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.08);
      padding: 18px 40px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      color: #fff;
      z-index: 100;
    }

    .counter-number {
      font-size: 42px;
      font-weight: 200;
      margin-bottom: 5px;
      color: #fffacd;
      text-shadow: 0 0 30px rgba(255, 250, 205, 0.6);
      transition: transform 0.2s;
    }

    .counter-number.bump {
      transform: scale(1.15);
    }

    .counter-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-weight: 200;
      letter-spacing: 2px;
    }

    /* 底部提示 */
    .hint {
      position: fixed;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      z-index: 100;
      font-weight: 200;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* 流星提示 */
    .meteor-message {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.15);
      padding: 18px 30px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      color: #fff;
      font-size: 15px;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 200;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .meteor-message.show {
      opacity: 1;
    }

    /* 成就解锁弹窗 */
    .unlock-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
      padding: 30px 50px;
      border-radius: 20px;
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 215, 0, 0.3);
      text-align: center;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 300;
    }

    .unlock-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .unlock-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .unlock-title {
      font-size: 18px;
      margin-bottom: 5px;
      color: #ffd700;
    }

    .unlock-text {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    /* 星座进度条 */
    .constellation-progress {
      position: fixed;
      top: 100px;
      right: 20px;
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 160px;
    }

    .constellation-title {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
      text-align: center;
    }

    .constellation-name {
      font-size: 14px;
      text-align: center;
      margin-bottom: 8px;
      color: #fffacd;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #64b5f6, #ffd700);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>晚安星空</h1>
    <p>点亮星星，让夜晚温柔起来</p>
  </div>

  <button class="back-btn" onclick="window.history.back()">返回心迹</button>

  <!-- 成就面板 -->
  <div class="achievements">
    <div class="achievements-title">成就图鉴</div>
    <div class="achievement-item" id="ach-10">
      <span class="achievement-icon">⭐</span>
      <span class="achievement-text">初见星光 (10颗)</span>
    </div>
    <div class="achievement-item" id="ach-50">
      <span class="achievement-icon">🌟</span>
      <span class="achievement-text">繁星点点 (50颗)</span>
    </div>
    <div class="achievement-item" id="ach-100">
      <span class="achievement-icon">✨</span>
      <span class="achievement-text">星光璀璨 (100颗)</span>
    </div>
    <div class="achievement-item" id="ach-200">
      <span class="achievement-icon">🌌</span>
      <span class="achievement-text">银河漫步 (200颗)</span>
    </div>
    <div class="achievement-item" id="ach-500">
      <span class="achievement-icon">🌠</span>
      <span class="achievement-text">许愿大师 (500颗)</span>
    </div>
  </div>

  <!-- 星座进度 -->
  <div class="constellation-progress">
    <div class="constellation-title">当前星座</div>
    <div class="constellation-name" id="constellationName">猎户座</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 7 颗</div>
  </div>

  <canvas id="starCanvas"></canvas>

  <div class="counter">
    <div class="counter-number" id="starCount">0</div>
    <div class="counter-label">颗星星</div>
  </div>

  <div class="hint">点击任意位置点亮星星 · 集满星座解锁更多</div>

  <div class="meteor-message" id="meteorMessage">流星划过，快许愿 ✨</div>

  <div class="unlock-popup" id="unlockPopup">
    <div class="unlock-icon">🎉</div>
    <div class="unlock-title" id="unlockTitle">成就解锁！</div>
    <div class="unlock-text" id="unlockText">初见星光</div>
  </div>

  <script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];
    let meteors = [];
    let backgroundStars = [];
    let starCount = 0;
    const countEl = document.getElementById('starCount');
    const meteorMessage = document.getElementById('meteorMessage');
    const unlockPopup = document.getElementById('unlockPopup');
    const unlockTitle = document.getElementById('unlockTitle');
    const unlockText = document.getElementById('unlockText');

    // 星座配置
    const constellations = [
      { name: '猎户座', stars: 7, desc: '冬日夜空的猎人' },
      { name: '北斗七星', stars: 7, desc: '指引方向的明灯' },
      { name: '天蝎座', stars: 9, desc: '夏夜的神秘使者' },
      { name: '狮子座', stars: 8, desc: '勇敢的王者之星' },
      { name: '仙女座', stars: 10, desc: '夜空中的公主' },
    ];
    let currentConstellation = 0;
    let constellationProgress = 0;

    // 成就配置
    const achievements = {
      10: { name: '初见星光', icon: '⭐', unlocked: false },
      50: { name: '繁星点点', icon: '🌟', unlocked: false },
      100: { name: '星光璀璨', icon: '✨', unlocked: false },
      200: { name: '银河漫步', icon: '🌌', unlocked: false },
      500: { name: '许愿大师', icon: '🌠', unlocked: false },
    };

    // 颜色配置
    const starColors = [
      { r: 173, g: 216, b: 230 }, // 淡蓝
      { r: 255, g: 250, b: 205 }, // 浅金
      { r: 230, g: 230, b: 250 }, // 柔紫
      { r: 255, g: 239, b: 213 }, // 暖橙
      { r: 245, g: 245, b: 255 }, // 银白
      { r: 255, g: 192, b: 203 }  // 粉色
    ];

    // 背景星星类
    class BackgroundStar {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random();
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinklePhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.twinklePhase += this.twinkleSpeed;
        this.alpha = 0.3 + Math.sin(this.twinklePhase) * 0.3;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.fill();
      }
    }

    // 点亮星星类
    class Star {
      constructor(x, y, special = false) {
        this.x = x;
        this.y = y;
        this.color = starColors[Math.floor(Math.random() * starColors.length)];
        this.radius = special ? 4 : (Math.random() * 2 + 1.5);
        this.maxRadius = this.radius;
        this.currentRadius = 0;
        this.growing = true;
        this.vy = -(Math.random() * 0.3 + 0.1);
        this.alpha = 1;
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.tail = [];
        this.special = special;
      }

      update() {
        if (this.growing) {
          this.currentRadius += 0.15;
          if (this.currentRadius >= this.maxRadius) {
            this.growing = false;
          }
        }

        this.y += this.vy;

        if (this.y > 0) {
          this.tail.push({ x: this.x, y: this.y, alpha: 0.5 });
          if (this.tail.length > 20) {
            this.tail.shift();
          }
        }

        this.twinklePhase += 0.05;

        if (this.y < 50) {
          this.alpha -= 0.008;
        }
      }

      draw() {
        // 尾迹
        this.tail.forEach((point, i) => {
          const tailAlpha = (i / this.tail.length) * 0.3 * this.alpha;
          ctx.beginPath();
          ctx.arc(point.x, point.y, this.currentRadius * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${tailAlpha})`;
          ctx.fill();
        });

        // 星星本体
        const twinkle = 0.7 + Math.sin(this.twinklePhase) * 0.3;
        const drawRadius = this.currentRadius * twinkle;

        // 十字星芒
        if (this.special) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha * 0.6})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(this.x - drawRadius * 2, this.y);
          ctx.lineTo(this.x + drawRadius * 2, this.y);
          ctx.moveTo(this.x, this.y - drawRadius * 2);
          ctx.lineTo(this.x, this.y + drawRadius * 2);
          ctx.stroke();
        }

        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.currentRadius * 2
        );
        gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
        gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.6})`);
        gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);

        ctx.beginPath();
        ctx.arc(this.x, this.y, drawRadius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      isDead() {
        return this.alpha <= 0 || this.y < 0;
      }
    }

    // 流星类
    class Meteor {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height * 0.3;
        this.length = Math.random() * 120 + 80;
        this.speed = Math.random() * 15 + 12;
        this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
        this.alpha = 1;
        this.active = true;
      }

      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        if (this.x > width || this.y > height) {
          this.active = false;
        }
      }

      draw() {
        const tailX = this.x - Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;

        const gradient = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
        gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 1)');

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      }
    }

    // 调整画布大小
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      backgroundStars = [];
      for (let i = 0; i < 120; i++) {
        backgroundStars.push(new BackgroundStar());
      }
    }

    // 点击处理
    function handleClick(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 生成1-3颗星星（增加满足感）
      const numStars = Math.floor(Math.random() * 2) + 1;
      for (let i = 0; i < numStars; i++) {
        const offsetX = (Math.random() - 0.5) * 30;
        const offsetY = (Math.random() - 0.5) * 30;
        stars.push(new Star(x + offsetX, y + offsetY));
      }

      starCount += numStars;
      countEl.textContent = starCount;
      countEl.classList.add('bump');
      setTimeout(() => countEl.classList.remove('bump'), 200);

      // 检查成就
      checkAchievements();

      // 更新星座进度
      updateConstellation(numStars);

      // 每15颗触发流星
      if (starCount % 15 === 0) {
        createMeteor();
        showMeteorMessage();
      }
    }

    // 检查成就
    function checkAchievements() {
      Object.keys(achievements).forEach(key => {
        const target = parseInt(key);
        if (starCount >= target && !achievements[target].unlocked) {
          achievements[target].unlocked = true;
          const el = document.getElementById('ach-' + key);
          if (el) el.classList.add('unlocked');
          showUnlockPopup(achievements[target].icon, '成就解锁！', achievements[target].name);
        }
      });
    }

    // 更新星座进度
    function updateConstellation(added) {
      const current = constellations[currentConstellation];
      const prevProgress = constellationProgress;
      constellationProgress += added;

      const percentage = Math.min((constellationProgress / current.stars) * 100, 100);
      document.getElementById('progressFill').style.width = percentage + '%';
      document.getElementById('progressText').textContent =
        Math.min(constellationProgress, current.stars) + ' / ' + current.stars + ' 颗';

      // 星座完成
      if (prevProgress < current.stars && constellationProgress >= current.stars) {
        showUnlockPopup('🌟', '星座完成！', current.name + ' - ' + current.desc);

        // 生成一组特殊星星庆祝
        for (let i = 0; i < 10; i++) {
          setTimeout(() => {
            const sx = Math.random() * width;
            const sy = height * 0.3 + Math.random() * height * 0.4;
            stars.push(new Star(sx, sy, true));
          }, i * 100);
        }

        // 进入下一个星座
        setTimeout(() => {
          currentConstellation = (currentConstellation + 1) % constellations.length;
          constellationProgress = 0;
          document.getElementById('constellationName').textContent = constellations[currentConstellation].name;
          document.getElementById('progressFill').style.width = '0%';
          document.getElementById('progressText').textContent = '0 / ' + constellations[currentConstellation].stars + ' 颗';
        }, 2000);
      }
    }

    // 创建流星
    function createMeteor() {
      meteors.push(new Meteor());
      // 有时候同时来2颗
      if (Math.random() > 0.6) {
        setTimeout(() => meteors.push(new Meteor()), 500);
      }
    }

    // 显示流星提示
    function showMeteorMessage() {
      meteorMessage.classList.add('show');
      setTimeout(() => {
        meteorMessage.classList.remove('show');
      }, 2000);
    }

    // 显示成就弹窗
    function showUnlockPopup(icon, title, text) {
      unlockPopup.querySelector('.unlock-icon').textContent = icon;
      unlockTitle.textContent = title;
      unlockText.textContent = text;
      unlockPopup.classList.add('show');
      setTimeout(() => {
        unlockPopup.classList.remove('show');
      }, 2500);
    }

    // 动画循环
    function animate() {
      ctx.fillStyle = 'rgba(9, 10, 15, 0.15)';
      ctx.fillRect(0, 0, width, height);

      backgroundStars.forEach(star => {
        star.update();
        star.draw();
      });

      stars = stars.filter(star => {
        star.update();
        star.draw();
        return !star.isDead();
      });

      meteors = meteors.filter(meteor => {
        if (meteor.active) {
          meteor.update();
          meteor.draw();
          return true;
        }
        return false;
      });

      requestAnimationFrame(animate);
    }

    // 初始化
    window.addEventListener('resize', resize);
    canvas.addEventListener('click', handleClick);

    document.getElementById('constellationName').textContent = constellations[0].name;
    document.getElementById('progressText').textContent = '0 / ' + constellations[0].stars + ' 颗';

    resize();
    animate();
  </script>
</body>
</html>
