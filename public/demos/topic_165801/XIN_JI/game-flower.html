<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>种一朵花 · 心迹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 30%, #e0f7fa 60%, #fff9e6 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      filter: blur(2px);
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    .cloud1 {
      width: 100px;
      height: 40px;
      top: 10%;
      left: -120px;
      animation: cloud-move 30s linear infinite;
    }

    .cloud1::before {
      width: 50px;
      height: 50px;
      top: -25px;
      left: 15px;
    }

    .cloud1::after {
      width: 40px;
      height: 40px;
      top: -20px;
      left: 50px;
    }

    .cloud2 {
      width: 80px;
      height: 30px;
      top: 20%;
      left: -100px;
      animation: cloud-move 25s linear infinite;
      animation-delay: -10s;
    }

    .cloud2::before {
      width: 40px;
      height: 40px;
      top: -20px;
      left: 10px;
    }

    .cloud2::after {
      width: 35px;
      height: 35px;
      top: -15px;
      left: 40px;
    }

    .cloud3 {
      width: 120px;
      height: 45px;
      top: 5%;
      left: -140px;
      animation: cloud-move 35s linear infinite;
      animation-delay: -20s;
    }

    .cloud3::before {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 20px;
    }

    .cloud3::after {
      width: 50px;
      height: 50px;
      top: -25px;
      left: 60px;
    }

    @keyframes cloud-move {
      0% {
        left: -150px;
      }
      100% {
        left: calc(100% + 50px);
      }
    }

    .draggable-cloud {
      position: fixed;
      width: 120px;
      height: 50px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50px;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      cursor: grab;
      z-index: 50;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
      touch-action: none;
      transition: transform 0.1s;
    }

    .draggable-cloud::before {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      top: -30px;
      left: 15px;
    }

    .draggable-cloud::after {
      content: '';
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      top: -25px;
      right: 20px;
    }

    .draggable-cloud.dragging {
      cursor: grabbing;
      transform: translateX(-50%) scale(1.05);
    }

    .cloud-hint {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      font-weight: 300;
    }

    .sun {
      position: fixed;
      top: 60px;
      right: 60px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #fff9c4 0%, #ffeb3b 50%, #ffc107 100%);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(255, 235, 59, 0.5);
      z-index: 5;
      animation: sun-pulse 4s ease-in-out infinite;
    }

    @keyframes sun-pulse {
      0%, 100% {
        box-shadow: 0 0 60px rgba(255, 235, 59, 0.5);
      }
      50% {
        box-shadow: 0 0 80px rgba(255, 235, 59, 0.7);
      }
    }

    .ground {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30vh;
      background: linear-gradient(180deg, #90EE90 0%, #3CB371 50%, #228B22 100%);
      border-radius: 50% 50% 0 0 / 20% 20% 0 0;
      z-index: 10;
    }

    .ground::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background: linear-gradient(180deg, #98FB98 0%, transparent 100%);
    }

    #flowerCanvas {
      position: fixed;
      bottom: 25vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    .header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 100;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 400;
      color: #2d5016;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
    }

    .header p {
      font-size: 12px;
      color: rgba(45, 80, 22, 0.6);
      font-weight: 300;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      color: #2d5016;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-weight: 400;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.85);
    }

    .stats {
      position: fixed;
      top: 80px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 10px 15px;
      min-width: 100px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    .stat-label {
      font-size: 11px;
      color: rgba(45, 80, 22, 0.7);
      margin-bottom: 5px;
      font-weight: 300;
    }

    .stat-bar {
      height: 8px;
      background: rgba(45, 80, 22, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .stat-fill.water {
      background: linear-gradient(90deg, #87ceeb, #4169e1);
      width: 30%;
    }

    .stat-fill.sun {
      background: linear-gradient(90deg, #ffeb3b, #ff9800);
      width: 30%;
    }

    .stat-fill.love {
      background: linear-gradient(90deg, #ffb6c1, #ff6b6b);
      width: 30%;
    }

    .garden-btn {
      position: fixed;
      top: 80px;
      right: 20px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: #2d5016;
      font-size: 13px;
      cursor: pointer;
      z-index: 100;
      font-weight: 400;
      transition: all 0.3s;
    }

    .garden-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
    }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .control-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      color: #2d5016;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 300;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-3px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-icon {
      font-size: 28px;
    }

    .water-drop {
      position: fixed;
      font-size: 25px;
      animation: water-fall 1s ease-in forwards;
      pointer-events: none;
      z-index: 30;
    }

    @keyframes water-fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(300px) rotate(10deg);
      }
    }

    .stage-label {
      position: fixed;
      bottom: calc(30vh + 200px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      color: #2d5016;
      font-weight: 400;
      z-index: 100;
      background: rgba(255, 255, 255, 0.6);
      padding: 8px 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #fff9e6 0%, #fff0f0 100%);
      border-radius: 25px;
      padding: 30px 25px;
      max-width: 380px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 500;
      color: #2d5016;
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-close {
      display: block;
      margin: 20px auto 0;
      padding: 10px 30px;
      background: linear-gradient(135deg, #90EE90 0%, #3CB371 100%);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .modal-close:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(60, 179, 113, 0.4);
    }

    .talk-input {
      width: 100%;
      padding: 15px;
      border: 2px solid rgba(144, 238, 144, 0.5);
      border-radius: 15px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      background: rgba(255, 255, 255, 0.8);
      color: #2d5016;
      outline: none;
      transition: border-color 0.3s;
    }

    .talk-input:focus {
      border-color: #3CB371;
    }

    .talk-submit {
      display: block;
      margin: 15px auto 0;
      padding: 12px 40px;
      background: linear-gradient(135deg, #ffb6c1 0%, #ff6b6b 100%);
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .talk-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
    }

    .garden-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .garden-item {
      aspect-ratio: 1;
      background: rgba(144, 238, 144, 0.2);
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed rgba(60, 179, 113, 0.3);
    }

    .garden-item.has-flower {
      border-style: solid;
      border-color: rgba(60, 179, 113, 0.5);
      background: rgba(255, 255, 255, 0.5);
    }

    .garden-flower-icon {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .garden-flower-date {
      font-size: 10px;
      color: rgba(45, 80, 22, 0.6);
    }

    .garden-empty {
      font-size: 11px;
      color: rgba(45, 80, 22, 0.4);
      text-align: center;
    }

    .message-popup {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 20px 30px;
      border-radius: 20px;
      color: #2d5016;
      font-size: 15px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 500;
      pointer-events: none;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .message-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .new-seed-btn {
      display: block;
      margin: 15px auto 0;
      padding: 12px 30px;
      background: linear-gradient(135deg, #ffd54f 0%, #ff8f00 100%);
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .new-seed-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 143, 0, 0.4);
    }

    .new-seed-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 480px) {
      .controls {
        bottom: 20px;
        gap: 10px;
      }
      .control-btn {
        padding: 12px 15px;
      }
      .stat-item {
        min-width: 80px;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div class="sun"></div>

  <div class="draggable-cloud" id="draggableCloud">
    <span class="cloud-hint">拖动云朵遮阳</span>
  </div>

  <button class="back-btn" onclick="window.location.href='game-hub.html'">← 返回长廊</button>

  <div class="header">
    <h1>种一朵花</h1>
    <p>用心照顾，等待花开</p>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-label">💧 水分</div>
      <div class="stat-bar">
        <div class="stat-fill water" id="waterBar"></div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-label">☀️ 阳光</div>
      <div class="stat-bar">
        <div class="stat-fill sun" id="sunBar"></div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-label">💕 关爱</div>
      <div class="stat-bar">
        <div class="stat-fill love" id="loveBar"></div>
      </div>
    </div>
  </div>

  <button class="garden-btn" id="gardenBtn">🌷 我的花园</button>

  <div class="stage-label" id="stageLabel">种子阶段</div>

  <canvas id="flowerCanvas" width="300" height="350"></canvas>

  <div class="ground"></div>

  <div class="controls">
    <button class="control-btn" id="waterBtn">
      <span class="control-icon">💧</span>
      <span>浇水</span>
    </button>
    <button class="control-btn" id="talkBtn">
      <span class="control-icon">💬</span>
      <span>说话</span>
    </button>
    <button class="control-btn" id="harvestBtn" style="display: none;">
      <span class="control-icon">🌱</span>
      <span>收种子</span>
    </button>
  </div>

  <div class="message-popup" id="messagePopup"></div>

  <div class="modal" id="talkModal">
    <div class="modal-content">
      <div class="modal-title">💬 对花儿说点什么</div>
      <textarea class="talk-input" id="talkInput" rows="4" placeholder="今天的心情怎么样呢..."></textarea>
      <button class="talk-submit" id="talkSubmit">说给花儿听 🌸</button>
      <button class="modal-close" onclick="closeTalkModal()">取消</button>
    </div>
  </div>

  <div class="modal" id="gardenModal">
    <div class="modal-content">
      <div class="modal-title">🌷 我的小花园</div>
      <div class="garden-grid" id="gardenGrid"></div>
      <button class="modal-close" onclick="closeGardenModal()">关闭</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');
    const waterBar = document.getElementById('waterBar');
    const sunBar = document.getElementById('sunBar');
    const loveBar = document.getElementById('loveBar');
    const stageLabel = document.getElementById('stageLabel');
    const waterBtn = document.getElementById('waterBtn');
    const talkBtn = document.getElementById('talkBtn');
    const harvestBtn = document.getElementById('harvestBtn');
    const gardenBtn = document.getElementById('gardenBtn');
    const talkModal = document.getElementById('talkModal');
    const gardenModal = document.getElementById('gardenModal');
    const talkInput = document.getElementById('talkInput');
    const talkSubmit = document.getElementById('talkSubmit');
    const gardenGrid = document.getElementById('gardenGrid');
    const messagePopup = document.getElementById('messagePopup');
    const draggableCloud = document.getElementById('draggableCloud');

    const STAGES = ['种子', '发芽', '长叶', '开花', '花谢'];
    let currentStage = 0;
    let water = 30;
    let sun = 30;
    let love = 30;
    let growth = 0;
    let flowerColor = '#ff6b6b';
    let flowerShape = 0;
    let moodWords = '';
    let isDraggingCloud = false;
    let cloudStartX = 0;
    let cloudCurrentX = 0;

    let garden = JSON.parse(localStorage.getItem('flowerGarden') || '[]');
    let savedState = localStorage.getItem('currentFlower');
    
    if (savedState) {
      const state = JSON.parse(savedState);
      currentStage = state.stage || 0;
      water = state.water || 30;
      sun = state.sun || 30;
      love = state.love || 30;
      growth = state.growth || 0;
      flowerColor = state.color || '#ff6b6b';
      flowerShape = state.shape || 0;
      moodWords = state.words || '';
    }

    function saveState() {
      localStorage.setItem('currentFlower', JSON.stringify({
        stage: currentStage,
        water,
        sun,
        love,
        growth,
        color: flowerColor,
        shape: flowerShape,
        words: moodWords
      }));
    }

    function updateBars() {
      waterBar.style.width = water + '%';
      sunBar.style.width = sun + '%';
      loveBar.style.width = love + '%';
    }

    function updateStage() {
      stageLabel.textContent = STAGES[currentStage] + '阶段';
      harvestBtn.style.display = currentStage === 4 ? 'flex' : 'none';
    }

    function showMessage(text, duration = 2000) {
      messagePopup.textContent = text;
      messagePopup.classList.add('show');
      setTimeout(() => messagePopup.classList.remove('show'), duration);
    }

    function waterPlant() {
      if (currentStage >= 4) return;
      
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const drop = document.createElement('div');
          drop.className = 'water-drop';
          drop.textContent = '💧';
          drop.style.left = (canvas.offsetLeft + Math.random() * 200 + 50) + 'px';
          drop.style.top = (canvas.offsetTop + 20) + 'px';
          document.body.appendChild(drop);
          setTimeout(() => drop.remove(), 1000);
        }, i * 100);
      }

      water = Math.min(100, water + 20);
      growth += 5;
      updateBars();
      checkGrowth();
      saveState();
      showMessage('咕嘟咕嘟~ 喝饱啦 💧');
    }

    function talkToPlant() {
      if (currentStage >= 4) return;
      talkModal.classList.add('show');
      talkInput.focus();
    }

    function closeTalkModal() {
      talkModal.classList.remove('show');
    }

    function submitTalk() {
      const text = talkInput.value.trim();
      if (!text) {
        showMessage('说点什么吧~');
        return;
      }

      moodWords = text;
      love = Math.min(100, love + 25);
      growth += 10;
      
      generateFlowerFromMood(text);
      
      talkInput.value = '';
      closeTalkModal();
      updateBars();
      checkGrowth();
      saveState();
      showMessage('花儿听到啦 💕');
    }

    function generateFlowerFromMood(text) {
      const happyWords = ['开心', '快乐', '高兴', '幸福', '棒', '好', '喜欢', '爱', '甜', '暖', '阳光', '希望'];
      const sadWords = ['难过', '伤心', '哭', '痛', '累', '烦', '焦虑', '担心', '害怕', '孤单', '失落'];
      const calmWords = ['平静', '安静', '温柔', '舒服', '放松', '宁静', '安心', '稳定', '平和'];
      
      let happyScore = 0, sadScore = 0, calmScore = 0;
      
      happyWords.forEach(w => { if (text.includes(w)) happyScore++; });
      sadWords.forEach(w => { if (text.includes(w)) sadScore++; });
      calmWords.forEach(w => { if (text.includes(w)) calmScore++; });
      
      if (sadScore > happyScore && sadScore > calmScore) {
        flowerColor = '#9370db';
        flowerShape = 2;
      } else if (calmScore > happyScore && calmScore > sadScore) {
        flowerColor = '#87ceeb';
        flowerShape = 1;
      } else if (happyScore > 0) {
        flowerColor = '#ff6b6b';
        flowerShape = 0;
      } else {
        const colors = ['#ff6b6b', '#ffb347', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff6b9d'];
        flowerColor = colors[Math.floor(Math.random() * colors.length)];
        flowerShape = Math.floor(Math.random() * 3);
      }
    }

    function checkGrowth() {
      const total = water + sun + love;
      
      if (currentStage === 0 && total >= 60) {
        currentStage = 1;
        showMessage('🌱 发芽啦！');
      } else if (currentStage === 1 && total >= 150) {
        currentStage = 2;
        showMessage('🍃 长出叶子了！');
      } else if (currentStage === 2 && total >= 240) {
        currentStage = 3;
        showMessage('🌸 开花啦！好美~');
      }
      
      updateStage();
      drawFlower();
    }

    function harvestSeeds() {
      const seed = {
        color: flowerColor,
        shape: flowerShape,
        words: moodWords,
        date: new Date().toLocaleDateString('zh-CN')
      };
      garden.push(seed);
      localStorage.setItem('flowerGarden', JSON.stringify(garden));
      
      currentStage = 0;
      water = 30;
      sun = 30;
      love = 30;
      growth = 0;
      flowerColor = '#ff6b6b';
      flowerShape = 0;
      moodWords = '';
      
      updateBars();
      updateStage();
      drawFlower();
      saveState();
      showMessage('🌱 收到了新种子！');
    }

    function openGarden() {
      gardenGrid.innerHTML = '';
      
      for (let i = 0; i < 9; i++) {
        const item = document.createElement('div');
        item.className = 'garden-item';
        
        if (garden[i]) {
          item.classList.add('has-flower');
          item.innerHTML = `
            <span class="garden-flower-icon">🌸</span>
            <span class="garden-flower-date">${garden[i].date}</span>
          `;
        } else {
          item.innerHTML = '<span class="garden-empty">空位</span>';
        }
        
        gardenGrid.appendChild(item);
      }
      
      gardenModal.classList.add('show');
    }

    function closeGardenModal() {
      gardenModal.classList.remove('show');
    }

    function drawFlower() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const centerX = canvas.width / 2;
      const groundY = canvas.height - 30;
      
      if (currentStage === 0) {
        drawSeed(centerX, groundY);
      } else if (currentStage === 1) {
        drawSprout(centerX, groundY);
      } else if (currentStage === 2) {
        drawPlant(centerX, groundY);
      } else if (currentStage >= 3) {
        drawFullFlower(centerX, groundY, currentStage === 4);
      }
    }

    function drawSeed(x, y) {
      ctx.save();
      ctx.translate(x, y - 15);
      
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#A0522D';
      ctx.beginPath();
      ctx.ellipse(-3, -5, 5, 8, -0.3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    function drawSprout(x, y) {
      ctx.save();
      ctx.translate(x, y);
      
      ctx.strokeStyle = '#228B22';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(5, -30, 0, -50);
      ctx.stroke();
      
      ctx.fillStyle = '#32CD32';
      ctx.beginPath();
      ctx.ellipse(-12, -40, 15, 8, -0.5, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(12, -45, 15, 8, 0.5, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    function drawPlant(x, y) {
      ctx.save();
      ctx.translate(x, y);
      
      ctx.strokeStyle = '#228B22';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(8, -80, 0, -120);
      ctx.stroke();
      
      ctx.fillStyle = '#32CD32';
      ctx.beginPath();
      ctx.ellipse(-25, -90, 25, 12, -0.6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(25, -70, 22, 10, 0.6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(-20, -50, 20, 9, -0.4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    function drawFullFlower(x, y, wilted) {
      ctx.save();
      ctx.translate(x, y);
      
      const stemHeight = 150;
      const flowerY = -stemHeight;
      
      ctx.strokeStyle = wilted ? '#6B8E23' : '#228B22';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(wilted ? 20 : 8, -80, 0, -stemHeight);
      ctx.stroke();
      
      ctx.fillStyle = wilted ? '#6B8E23' : '#32CD32';
      ctx.beginPath();
      ctx.ellipse(-25, -100, 28, 14, -0.6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(28, -80, 25, 12, 0.6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.save();
      ctx.translate(0, flowerY);
      
      if (wilted) {
        ctx.globalAlpha = 0.6;
        ctx.rotate(0.5);
      }
      
      const petalCount = flowerShape === 0 ? 8 : (flowerShape === 1 ? 6 : 5);
      const petalSize = flowerShape === 2 ? 35 : (flowerShape === 1 ? 30 : 25);
      
      for (let i = 0; i < petalCount; i++) {
        ctx.save();
        ctx.rotate((i / petalCount) * Math.PI * 2);
        
        ctx.fillStyle = wilted ? '#b8860b' : flowerColor;
        ctx.beginPath();
        
        if (flowerShape === 0) {
          ctx.ellipse(0, -petalSize - 5, petalSize * 0.6, petalSize, 0, 0, Math.PI * 2);
        } else if (flowerShape === 1) {
          ctx.ellipse(0, -petalSize - 8, petalSize * 0.8, petalSize * 0.9, 0, 0, Math.PI * 2);
        } else {
          ctx.ellipse(0, -petalSize - 10, petalSize * 0.7, petalSize * 1.1, 0, 0, Math.PI * 2);
        }
        
        ctx.fill();
        ctx.restore();
      }
      
      ctx.fillStyle = wilted ? '#daa520' : '#ffd93d';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = wilted ? '#b8860b' : '#ff8c00';
      for (let i = 0; i < 12; i++) {
        ctx.save();
        ctx.rotate((i / 12) * Math.PI * 2);
        ctx.beginPath();
        ctx.arc(0, -8, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      
      ctx.restore();
      ctx.restore();
    }

    function initCloudDrag() {
      draggableCloud.addEventListener('mousedown', startDrag);
      draggableCloud.addEventListener('touchstart', startDrag, { passive: false });
      
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, { passive: false });
      
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);
    }

    function startDrag(e) {
      isDraggingCloud = true;
      draggableCloud.classList.add('dragging');
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const rect = draggableCloud.getBoundingClientRect();
      cloudStartX = clientX - rect.left - rect.width / 2;
      
      const currentLeft = draggableCloud.offsetLeft;
      if (draggableCloud.style.transform) {
        draggableCloud.style.left = currentLeft + 'px';
        draggableCloud.style.transform = 'none';
      }
    }

    function drag(e) {
      if (!isDraggingCloud) return;
      e.preventDefault();
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const newX = clientX - cloudStartX - draggableCloud.offsetWidth / 2;
      
      draggableCloud.style.left = Math.max(0, Math.min(window.innerWidth - draggableCloud.offsetWidth, newX)) + 'px';
      
      checkSunlight();
    }

    function endDrag() {
      isDraggingCloud = false;
      draggableCloud.classList.remove('dragging');
    }

    function checkSunlight() {
      const cloudRect = draggableCloud.getBoundingClientRect();
      const flowerCenterX = canvas.offsetLeft + canvas.width / 2;
      
      const cloudCenterX = cloudRect.left + cloudRect.width / 2;
      const distance = Math.abs(cloudCenterX - flowerCenterX);
      
      if (distance < 100) {
        sun = Math.max(0, sun - 0.5);
      } else {
        sun = Math.min(100, sun + 0.2);
      }
      
      updateBars();
    }

    waterBtn.addEventListener('click', waterPlant);
    talkBtn.addEventListener('click', talkToPlant);
    talkSubmit.addEventListener('click', submitTalk);
    harvestBtn.addEventListener('click', harvestSeeds);
    gardenBtn.addEventListener('click', openGarden);

    talkInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitTalk();
      }
    });

    initCloudDrag();
    updateBars();
    updateStage();
    drawFlower();

    setInterval(() => {
      if (currentStage < 4) {
        water = Math.max(0, water - 0.3);
        updateBars();
        
        if (currentStage === 3) {
          growth += 0.1;
          if (growth > 100) {
            currentStage = 4;
            updateStage();
            drawFlower();
            showMessage('🌸 花谢了，可以收种子了~', 3000);
          }
        }
        
        saveState();
      }
    }, 2000);

    setInterval(() => {
      if (!isDraggingCloud && currentStage < 4) {
        checkSunlight();
        saveState();
      }
    }, 3000);
  </script>
</body>
</html>
