<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呼吸节拍器 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* 标题 */
    .header {
      text-align: center;
      margin-bottom: 30px;
      z-index: 10;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.4);
    }

    .header p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    /* 模式选择 */
    .mode-select {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .mode-btn {
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .mode-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .mode-btn.active {
      background: rgba(138, 130, 255, 0.3);
      border-color: rgba(138, 130, 255, 0.5);
      color: #fff;
    }

    /* 呼吸圆圈容器 */
    .breathing-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 外圈光晕 */
    .outer-ring {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 130, 255, 0.25) 0%, transparent 70%);
      animation: pulseOuter 4s ease-in-out infinite;
    }

    @keyframes pulseOuter {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
    }

    /* 呼吸圆圈 */
    .breathing-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #8a82ff 0%, #6366f1 100%);
      box-shadow: 0 0 50px rgba(138, 130, 255, 0.5);
      position: relative;
      z-index: 2;
    }

    .breathing-circle.inhale {
      animation: inhale 4s ease-out forwards;
    }

    .breathing-circle.hold {
      animation: hold 7s ease-in-out forwards;
    }

    .breathing-circle.exhale {
      animation: exhale 8s ease-in forwards;
    }

    @keyframes inhale {
      0% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(138, 130, 255, 0.5);
      }
      100% {
        transform: scale(2.4);
        box-shadow: 0 0 90px rgba(138, 130, 255, 0.8);
      }
    }

    @keyframes hold {
      0%, 100% {
        transform: scale(2.4);
        box-shadow: 0 0 70px rgba(138, 130, 255, 0.7);
      }
      50% {
        box-shadow: 0 0 110px rgba(138, 130, 255, 1);
      }
    }

    @keyframes exhale {
      0% {
        transform: scale(2.4);
        box-shadow: 0 0 90px rgba(138, 130, 255, 0.8);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(138, 130, 255, 0.5);
      }
    }

    /* 中央文字 */
    .breath-text {
      position: absolute;
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      z-index: 3;
    }

    /* 倒计时（在圆圈内） */
    .breath-countdown {
      position: absolute;
      font-size: 48px;
      font-weight: 100;
      color: rgba(255,255,255,0.9);
      z-index: 4;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .breath-countdown.show {
      opacity: 1;
    }

    /* 计数器 */
    .counter {
      position: fixed;
      top: 80px;
      right: 25px;
      background: rgba(255,255,255,0.08);
      padding: 12px 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      z-index: 100;
    }

    .counter-number {
      font-size: 30px;
      font-weight: 200;
      margin-bottom: 3px;
    }

    .counter-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

    /* 总倒计时显示（当设定了轮数时） */
    .total-timer {
      position: fixed;
      top: 160px;
      right: 25px;
      background: rgba(255,255,255,0.08);
      padding: 12px 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      color: #fff;
      z-index: 100;
    }

    .total-timer-value {
      font-size: 20px;
      font-weight: 200;
      margin-bottom: 3px;
    }

    .total-timer-label {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
    }

    /* 底部控制 */
    .controls {
      position: fixed;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }

    .main-btns {
      display: flex;
      gap: 12px;
    }

    .control-btn {
      padding: 12px 28px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }

    .control-btn.primary {
      background: rgba(138, 130, 255, 0.3);
      border-color: rgba(138, 130, 255, 0.5);
    }

    /* 轮数选择 */
    .round-select {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.06);
      padding: 8px 15px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .round-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .round-btns {
      display: flex;
      gap: 6px;
    }

    .round-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .round-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .round-btn.active {
      background: rgba(138, 130, 255, 0.4);
      border-color: rgba(138, 130, 255, 0.6);
      color: #fff;
    }

    /* 声音开关 */
    .sound-toggle {
      position: fixed;
      top: 80px;
      left: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.08);
      padding: 10px 15px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
    }

    .sound-toggle:hover {
      background: rgba(255,255,255,0.12);
    }

    .sound-toggle span {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .sound-icon {
      font-size: 16px;
    }

    /* 完成弹窗 */
    .complete-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      backdrop-filter: blur(5px);
    }

    .complete-modal.show {
      display: flex;
    }

    .complete-content {
      background: linear-gradient(135deg, rgba(138, 130, 255, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
      padding: 40px 50px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
      backdrop-filter: blur(20px);
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .complete-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .complete-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .complete-text {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .complete-stats {
      display: flex;
      gap: 25px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .complete-stat {
      text-align: center;
    }

    .complete-stat-value {
      font-size: 24px;
      font-weight: 200;
    }

    .complete-stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.history.back()">返回心迹</button>

  <div class="header">
    <h1>呼吸节拍器</h1>
    <p>4-7-8 呼吸法 · 跟随节奏慢慢呼吸</p>
  </div>

  <div class="sound-toggle" id="soundToggle">
    <span class="sound-icon" id="soundIcon">🔊</span>
    <span id="soundLabel">提示音开</span>
  </div>

  <div class="counter">
    <div class="counter-number" id="roundCount">0</div>
    <div class="counter-label">已完成轮数</div>
  </div>

  <div class="total-timer" id="totalTimer" style="display:none;">
    <div class="total-timer-value" id="totalTime">03:00</div>
    <div class="total-timer-label">剩余时间</div>
  </div>

  <div class="breathing-container">
    <div class="outer-ring"></div>
    <div class="breathing-circle" id="breathingCircle"></div>
    <div class="breath-text" id="breathText">准备</div>
    <div class="breath-countdown" id="breathCountdown">4</div>
  </div>

  <div class="controls">
    <div class="round-select">
      <span class="round-label">目标轮数：</span>
      <div class="round-btns">
        <button class="round-btn active" data-rounds="0">∞</button>
        <button class="round-btn" data-rounds="3">3</button>
        <button class="round-btn" data-rounds="5">5</button>
        <button class="round-btn" data-rounds="10">10</button>
      </div>
    </div>

    <div class="main-btns">
      <button class="control-btn primary" id="startBtn">开始呼吸</button>
      <button class="control-btn" id="pauseBtn">暂停</button>
      <button class="control-btn" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- 完成弹窗 -->
  <div class="complete-modal" id="completeModal">
    <div class="complete-content">
      <div class="complete-icon">✨</div>
      <div class="complete-title">太棒了！</div>
      <div class="complete-text">
        你完成了呼吸练习<br>
        愿此刻的平静与你同在
      </div>
      <div class="complete-stats">
        <div class="complete-stat">
          <div class="complete-stat-value" id="finalRounds">0</div>
          <div class="complete-stat-label">完成轮数</div>
        </div>
        <div class="complete-stat">
          <div class="complete-stat-value" id="finalTime">00:00</div>
          <div class="complete-stat-label">总时长</div>
        </div>
      </div>
      <button class="control-btn primary" onclick="closeComplete()">好的</button>
    </div>
  </div>

  <script>
    const circle = document.getElementById('breathingCircle');
    const text = document.getElementById('breathText');
    const countdown = document.getElementById('breathCountdown');
    const roundCountEl = document.getElementById('roundCount');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const soundToggle = document.getElementById('soundToggle');
    const soundLabel = document.getElementById('soundLabel');
    const soundIcon = document.getElementById('soundIcon');
    const totalTimer = document.getElementById('totalTimer');
    const totalTimeEl = document.getElementById('totalTime');

    let isRunning = false;
    let isPaused = false;
    let roundCount = 0;
    let targetRounds = 0; // 0 = 无限
    let currentPhase = 'idle';
    let phaseRemaining = 0;
    let soundEnabled = true;
    let totalSeconds = 0;
    let totalTimerInterval = null;

    // 每轮时长（秒）：4 + 7 + 8 = 19
    const phaseDurations = {
      inhale: 4,
      hold: 7,
      exhale: 8
    };

    // 音频上下文
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 播放引导音
    function playGuideSound(type) {
      if (!soundEnabled || !audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.type = 'sine';

      if (type === 'inhale') {
        oscillator.frequency.setValueAtTime(330, audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'hold') {
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'exhale') {
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(330, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
      }
    }

    // 更新倒计时显示
    function updateCountdown(seconds) {
      countdown.textContent = seconds;
      countdown.classList.add('show');
      text.style.opacity = '0';
    }

    function hideCountdown() {
      countdown.classList.remove('show');
      text.style.opacity = '1';
    }

    // 吸气阶段
    function startInhale() {
      currentPhase = 'inhale';
      phaseRemaining = phaseDurations.inhale;
      circle.className = 'breathing-circle inhale';
      text.textContent = '吸~';
      hideCountdown();
      playGuideSound('inhale');

      const interval = setInterval(() => {
        if (!isRunning || isPaused) return;
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          startHold();
        }
      }, 1000);
    }

    // 屏息阶段
    function startHold() {
      currentPhase = 'hold';
      phaseRemaining = phaseDurations.hold;
      circle.className = 'breathing-circle hold';
      text.textContent = '屏住';
      playGuideSound('hold');

      const interval = setInterval(() => {
        if (!isRunning || isPaused) return;
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          startExhale();
        }
      }, 1000);
    }

    // 呼气阶段
    function startExhale() {
      currentPhase = 'exhale';
      phaseRemaining = phaseDurations.exhale;
      circle.className = 'breathing-circle exhale';
      text.textContent = '呼~';
      playGuideSound('exhale');

      const interval = setInterval(() => {
        if (!isRunning || isPaused) return;
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          completeRound();
        }
      }, 1000);
    }

    // 完成一轮
    function completeRound() {
      if (!isRunning || isPaused) return;

      roundCount++;
      roundCountEl.textContent = roundCount;
      roundCountEl.style.transform = 'scale(1.2)';
      setTimeout(() => roundCountEl.style.transform = 'scale(1)', 150);

      // 检查是否达到目标轮数
      if (targetRounds > 0 && roundCount >= targetRounds) {
        endSession();
        return;
      }

      // 继续下一轮
      setTimeout(() => {
        if (isRunning && !isPaused) startInhale();
      }, 500);
    }

    // 开始
    function start() {
      initAudio();
      isRunning = true;
      isPaused = false;
      startBtn.textContent = '进行中';
      startBtn.style.opacity = '0.7';
      pauseBtn.textContent = '暂停';

      // 总计时器
      if (targetRounds > 0) {
        const totalSecs = targetRounds * 19;
        totalSeconds = totalSecs;
        totalTimer.style.display = 'block';
        updateTotalTime();
        totalTimerInterval = setInterval(() => {
          if (isRunning && !isPaused) {
            totalSeconds--;
            updateTotalTime();
            if (totalSeconds <= 0) {
              clearInterval(totalTimerInterval);
            }
          }
        }, 1000);
      } else {
        totalTimer.style.display = 'none';
      }

      startInhale();
    }

    // 更新总剩余时间显示
    function updateTotalTime() {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const secs = (totalSeconds % 60).toString().padStart(2, '0');
      totalTimeEl.textContent = `${mins}:${secs}`;
    }

    // 暂停/继续
    function togglePause() {
      if (!isRunning) return;

      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.textContent = '继续';
        text.textContent = '已暂停';
        hideCountdown();
      } else {
        pauseBtn.textContent = '暂停';
        // 继续当前阶段
        if (currentPhase === 'inhale') resumeInhale();
        else if (currentPhase === 'hold') resumeHold();
        else if (currentPhase === 'exhale') resumeExhale();
      }
    }

    // 继续吸气
    function resumeInhale() {
      circle.className = 'breathing-circle inhale';
      text.textContent = '吸~';
      const interval = setInterval(() => {
        if (!isRunning || isPaused) { clearInterval(interval); return; }
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          startHold();
        }
      }, 1000);
    }

    // 继续屏息
    function resumeHold() {
      circle.className = 'breathing-circle hold';
      text.textContent = '屏住';
      const interval = setInterval(() => {
        if (!isRunning || isPaused) { clearInterval(interval); return; }
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          startExhale();
        }
      }, 1000);
    }

    // 继续呼气
    function resumeExhale() {
      circle.className = 'breathing-circle exhale';
      text.textContent = '呼~';
      const interval = setInterval(() => {
        if (!isRunning || isPaused) { clearInterval(interval); return; }
        phaseRemaining--;
        updateCountdown(phaseRemaining);
        if (phaseRemaining <= 0) {
          clearInterval(interval);
          completeRound();
        }
      }, 1000);
    }

    // 重置
    function reset() {
      isRunning = false;
      isPaused = false;
      roundCount = 0;
      currentPhase = 'idle';
      phaseRemaining = 0;

      if (totalTimerInterval) {
        clearInterval(totalTimerInterval);
        totalTimerInterval = null;
      }

      roundCountEl.textContent = '0';
      circle.className = 'breathing-circle';
      text.textContent = '准备';
      hideCountdown();
      startBtn.textContent = '开始呼吸';
      startBtn.style.opacity = '1';
      pauseBtn.textContent = '暂停';
      totalTimer.style.display = 'none';
    }

    // 结束练习
    function endSession() {
      isRunning = false;
      if (totalTimerInterval) clearInterval(totalTimerInterval);

      const totalMins = Math.floor((targetRounds * 19) / 60);
      const totalSecs = (targetRounds * 19) % 60;
      document.getElementById('finalRounds').textContent = roundCount;
      document.getElementById('finalTime').textContent =
        `${totalMins.toString().padStart(2, '0')}:${totalSecs.toString().padStart(2, '0')}`;
      document.getElementById('completeModal').classList.add('show');
    }

    function closeComplete() {
      document.getElementById('completeModal').classList.remove('show');
      reset();
    }

    // 声音开关
    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundLabel.textContent = '提示音开';
        soundIcon.textContent = '🔊';
      } else {
        soundLabel.textContent = '提示音关';
        soundIcon.textContent = '🔇';
      }
    }

    // 轮数选择
    document.querySelectorAll('.round-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        targetRounds = parseInt(btn.dataset.rounds);
        if (isRunning) reset();
      });
    });

    // 事件绑定
    startBtn.addEventListener('click', () => {
      if (!isRunning) start();
    });
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', reset);
    soundToggle.addEventListener('click', toggleSound);
  </script>
</body>
</html>
