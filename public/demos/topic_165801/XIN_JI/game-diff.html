<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不同</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
        radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
    animation: float 20s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-30px, 30px) rotate(2deg); }
}

.top-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    z-index: 1;
}

.back-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(-3px);
}

.game-title {
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 10px rgba(59, 130, 246, 0.5);
}

.sticker-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}

.sticker-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(3px);
}

.info-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
    z-index: 1;
    flex-wrap: wrap;
    justify-content: center;
}

.info-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 14px;
    padding: 10px 18px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
    min-width: 100px;
}

.info-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 3px;
}

.info-value {
    font-size: 20px;
    font-weight: bold;
    color: white;
}

.info-value.timer-warning {
    color: #ef4444;
    animation: pulse 0.5s ease infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.images-container {
    display: flex;
    gap: 20px;
    z-index: 1;
    flex-wrap: wrap;
    justify-content: center;
}

.image-wrapper {
    position: relative;
    width: 400px;
    height: 300px;
    background: linear-gradient(180deg, #87ceeb 0%, #98d8c8 100%);
    border-radius: 20px;
    overflow: hidden;
    cursor: crosshair;
    border: 3px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
}

.image-wrapper.shake {
    animation: shake 0.4s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}

.scene-item {
    position: absolute;
    font-size: 32px;
    transition: all 0.3s;
}

.diff-marker {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 3px solid #22c55e;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: markPop 0.5s ease;
    pointer-events: none;
}

.diff-marker::before {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #22c55e;
    font-size: 24px;
    font-weight: bold;
}

@keyframes markPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fbbf24;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle 0.6s ease-out forwards;
}

@keyframes sparkle {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(2) rotate(180deg); opacity: 0; }
}

.controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    gap: 12px;
    margin-top: 20px;
    z-index: 1;
    flex-wrap: wrap;
    justify-content: center;
}

.btn {
    padding: 12px 24px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(59, 130, 246, 0.5);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-hint {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
}

.btn-hint:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal {
    background: rgba(30, 30, 60, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px;
    max-width: 450px;
    width: 90%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
}

.modal p {
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.6;
}

.mode-buttons, .level-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.mode-btn, .level-btn {
    flex: 1;
    min-width: 120px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.mode-btn:hover, .level-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

.mode-btn.selected, .level-btn.selected {
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.2);
}

.modal-close {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.modal-close:hover {
    transform: scale(1.02);
}

.sticker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.sticker-item {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    transition: all 0.3s;
    position: relative;
}

.sticker-item.locked {
    filter: grayscale(1) brightness(0.4);
}

.sticker-item.locked::after {
    content: '🔒';
    position: absolute;
    font-size: 20px;
    bottom: 8px;
}

.sticker-item.unlocked {
    background: rgba(251, 191, 36, 0.15);
    border: 2px solid rgba(251, 191, 36, 0.4);
    animation: stickerGlow 2s ease-in-out infinite;
}

@keyframes stickerGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
    50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
}

.sticker-name {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 4px;
}

.victory-emoji {
    font-size: 64px;
    text-align: center;
    margin-bottom: 15px;
    animation: bounce 1s ease infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.level-select-container {
    text-align: center;
}

.level-title {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 12px;
}

@media (max-width: 850px) {
    .image-wrapper {
        width: 100%;
        max-width: 350px;
        height: 260px;
    }
    
    .scene-item {
        font-size: 26px;
    }
}
</style>
</head>
<body>
    <div class="top-bar">
        <a href="game-hub.html" class="back-btn">← 返回</a>
        <h1 class="game-title">🔍 找不同</h1>
        <button class="sticker-btn" onclick="showStickers()">🏆 贴纸</button>
    </div>
    
    <div class="info-bar">
        <div class="info-box">
            <div class="info-label">关卡</div>
            <div class="info-value" id="levelDisplay">1/3</div>
        </div>
        <div class="info-box">
            <div class="info-label">找到</div>
            <div class="info-value" id="foundDisplay">0/5</div>
        </div>
        <div class="info-box" id="timerBox" style="display:none;">
            <div class="info-label">时间</div>
            <div class="info-value" id="timerDisplay">60</div>
        </div>
        <div class="info-box">
            <div class="info-label">模式</div>
            <div class="info-value" id="modeDisplay" style="font-size:14px;">休闲</div>
        </div>
    </div>
    
    <div class="images-container">
        <div class="image-wrapper" id="image1" onclick="handleImageClick(event, 0)"></div>
        <div class="image-wrapper" id="image2" onclick="handleImageClick(event, 1)"></div>
    </div>
    
    <div class="controls">
        <button class="btn btn-secondary" onclick="showStartModal()">🎮 选择关卡</button>
        <button class="btn btn-hint" id="hintBtn" onclick="useHint()">🔍 放大镜 (3)</button>
    </div>
    
    <div class="modal-overlay" id="startModal">
        <div class="modal">
            <h2>🎮 开始游戏</h2>
            <div class="level-select-container">
                <div class="level-title">选择模式</div>
                <div class="mode-buttons">
                    <div class="mode-btn selected" data-mode="casual" onclick="selectMode('casual')">
                        <div style="font-size:28px; margin-bottom:5px;">😌</div>
                        <div>休闲模式</div>
                        <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px;">无时间限制</div>
                    </div>
                    <div class="mode-btn" data-mode="timed" onclick="selectMode('timed')">
                        <div style="font-size:28px; margin-bottom:5px;">⏱️</div>
                        <div>限时模式</div>
                        <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px;">60秒挑战</div>
                    </div>
                </div>
                <div class="level-title">选择关卡</div>
                <div class="level-buttons">
                    <div class="level-btn selected" data-level="0" onclick="selectLevel(0)">
                        <div style="font-size:28px; margin-bottom:5px;">🏫</div>
                        <div>校园</div>
                    </div>
                    <div class="level-btn" data-level="1" onclick="selectLevel(1)">
                        <div style="font-size:28px; margin-bottom:5px;">🦁</div>
                        <div>动物园</div>
                    </div>
                    <div class="level-btn" data-level="2" onclick="selectLevel(2)">
                        <div style="font-size:28px; margin-bottom:5px;">🍜</div>
                        <div>美食街</div>
                    </div>
                </div>
            </div>
            <button class="modal-close" onclick="startGame()">开始游戏</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="stickerModal">
        <div class="modal">
            <h2>🏆 贴纸收集</h2>
            <div class="sticker-grid" id="stickerGrid"></div>
            <button class="modal-close" onclick="closeStickers()">关闭</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="victoryModal">
        <div class="modal" style="text-align:center;">
            <div class="victory-emoji" id="victoryEmoji">🎉</div>
            <h2 id="victoryTitle">太棒了！</h2>
            <p id="victoryText">你找到了所有不同！</p>
            <div style="margin-bottom:20px;">
                <span style="font-size:48px;" id="newSticker">🎖️</span>
                <p style="color:#fbbf24; margin-top:8px;" id="stickerUnlock">获得新贴纸！</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="modal-close" style="flex:1;" onclick="nextLevel()">下一关</button>
                <button class="modal-close btn-secondary" style="flex:1; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.2);" onclick="closeVictory()">返回</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal" style="text-align:center;">
            <div style="font-size:64px; margin-bottom:15px;">😢</div>
            <h2>时间到！</h2>
            <p>你找到了 <span id="gameOverFound" style="color:#fbbf24; font-weight:bold;">0</span>/5 处不同</p>
            <p style="margin-top:10px;">再试一次吧！</p>
            <button class="modal-close" style="margin-top:20px;" onclick="retryLevel()">再试一次</button>
        </div>
    </div>

<script>
const LEVELS = [
    {
        name: '校园',
        emoji: '🏫',
        bg: 'linear-gradient(180deg, #87ceeb 0%, #98fb98 70%, #90ee90 100%)',
        sticker: '🎒',
        items: [
            { emoji: '🏫', x: 50, y: 30, size: 60 },
            { emoji: '🌳', x: 15, y: 55, size: 45 },
            { emoji: '🌳', x: 85, y: 60, size: 45 },
            { emoji: '☀️', x: 80, y: 10, size: 35 },
            { emoji: '🎒', x: 30, y: 70, size: 30 },
            { emoji: '📚', x: 60, y: 75, size: 28 },
            { emoji: '🦋', x: 45, y: 20, size: 24 },
            { emoji: '🌼', x: 20, y: 85, size: 22 },
            { emoji: '🌼', x: 70, y: 88, size: 22 },
            { emoji: '🐦', x: 25, y: 15, size: 20 },
        ],
        diffs: [
            { index: 3, prop: 'emoji', value: '⛅', desc: '太阳变云' },
            { index: 5, prop: 'emoji', value: '📖', desc: '书本变化' },
            { index: 6, prop: 'x', value: 55, desc: '蝴蝶移动' },
            { index: 7, prop: 'emoji', value: '🌸', desc: '花朵变化' },
            { index: 9, prop: 'size', value: 28, desc: '小鸟变大' },
        ]
    },
    {
        name: '动物园',
        emoji: '🦁',
        bg: 'linear-gradient(180deg, #ffd89b 0%, #19547b 100%)',
        sticker: '🦁',
        items: [
            { emoji: '🦁', x: 50, y: 50, size: 55 },
            { emoji: '🐘', x: 20, y: 55, size: 50 },
            { emoji: '🦒', x: 75, y: 35, size: 50 },
            { emoji: '🌴', x: 10, y: 30, size: 45 },
            { emoji: '🌴', x: 90, y: 25, size: 45 },
            { emoji: '🐒', x: 85, y: 70, size: 30 },
            { emoji: '🦜', x: 15, y: 15, size: 25 },
            { emoji: '🌿', x: 35, y: 80, size: 28 },
            { emoji: '🌿', x: 65, y: 82, size: 28 },
            { emoji: '🦋', x: 40, y: 25, size: 22 },
        ],
        diffs: [
            { index: 0, prop: 'emoji', value: '🐯', desc: '狮子变老虎' },
            { index: 2, prop: 'size', value: 60, desc: '长颈鹿变大' },
            { index: 5, prop: 'emoji', value: '🐵', desc: '猴子变化' },
            { index: 6, prop: 'x', value: 25, desc: '鹦鹉移动' },
            { index: 9, prop: 'emoji', value: '🐝', desc: '蝴蝶变蜜蜂' },
        ]
    },
    {
        name: '美食街',
        emoji: '🍜',
        bg: 'linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%)',
        sticker: '🍡',
        items: [
            { emoji: '🍜', x: 30, y: 40, size: 55 },
            { emoji: '🍣', x: 65, y: 35, size: 50 },
            { emoji: '🍡', x: 50, y: 60, size: 45 },
            { emoji: '🍦', x: 15, y: 55, size: 40 },
            { emoji: '🧋', x: 80, y: 65, size: 40 },
            { emoji: '🍰', x: 50, y: 20, size: 35 },
            { emoji: '🥟', x: 25, y: 75, size: 32 },
            { emoji: '🍪', x: 70, y: 80, size: 30 },
            { emoji: '🍓', x: 85, y: 25, size: 28 },
            { emoji: '🍒', x: 10, y: 30, size: 26 },
        ],
        diffs: [
            { index: 0, prop: 'emoji', value: '🍲', desc: '拉面变火锅' },
            { index: 3, prop: 'size', value: 50, desc: '冰淇淋变大' },
            { index: 5, prop: 'emoji', value: '🎂', desc: '蛋糕变化' },
            { index: 7, prop: 'x', value: 78, desc: '饼干移动' },
            { index: 9, prop: 'emoji', value: '🍇', desc: '樱桃变葡萄' },
        ]
    }
];

let currentLevel = 0;
let currentMode = 'casual';
let foundDiffs = [];
let hintsRemaining = 3;
let timeLeft = 60;
let timerInterval = null;
let stickers = JSON.parse(localStorage.getItem('diff_stickers') || '[]');

function init() {
    showStartModal();
}

function selectMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
}

function selectLevel(level) {
    currentLevel = level;
    document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('selected'));
    document.querySelector(`[data-level="${level}"]`).classList.add('selected');
}

function startGame() {
    closeStartModal();
    foundDiffs = [];
    hintsRemaining = 3;
    timeLeft = 60;
    
    document.getElementById('levelDisplay').textContent = `${currentLevel + 1}/3`;
    document.getElementById('foundDisplay').textContent = `0/5`;
    document.getElementById('modeDisplay').textContent = currentMode === 'casual' ? '休闲' : '限时';
    document.getElementById('hintBtn').textContent = `🔍 放大镜 (${hintsRemaining})`;
    document.getElementById('hintBtn').disabled = false;
    
    if (currentMode === 'timed') {
        document.getElementById('timerBox').style.display = 'block';
        document.getElementById('timerDisplay').textContent = timeLeft;
        document.getElementById('timerDisplay').classList.remove('timer-warning');
        startTimer();
    } else {
        document.getElementById('timerBox').style.display = 'none';
        stopTimer();
    }
    
    renderScenes();
}

function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').textContent = timeLeft;
        
        if (timeLeft <= 10) {
            document.getElementById('timerDisplay').classList.add('timer-warning');
        }
        
        if (timeLeft <= 0) {
            stopTimer();
            showGameOver();
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

function renderScenes() {
    const level = LEVELS[currentLevel];
    const image1 = document.getElementById('image1');
    const image2 = document.getElementById('image2');
    
    image1.style.background = level.bg;
    image2.style.background = level.bg;
    image1.innerHTML = '';
    image2.innerHTML = '';
    
    level.items.forEach((item, idx) => {
        const el1 = createSceneItem(item);
        el1.dataset.index = idx;
        image1.appendChild(el1);
        
        const item2 = { ...item };
        const diff = level.diffs.find(d => d.index === idx);
        if (diff) {
            item2[diff.prop] = diff.value;
        }
        const el2 = createSceneItem(item2);
        el2.dataset.index = idx;
        image2.appendChild(el2);
    });
    
    foundDiffs.forEach(idx => {
        markDiff(idx);
    });
}

function createSceneItem(item) {
    const el = document.createElement('div');
    el.className = 'scene-item';
    el.textContent = item.emoji;
    el.style.left = item.x + '%';
    el.style.top = item.y + '%';
    el.style.fontSize = item.size + 'px';
    el.style.transform = 'translate(-50%, -50%)';
    return el;
}

function handleImageClick(event, imageIndex) {
    const rect = event.currentTarget.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 100;
    const y = ((event.clientY - rect.top) / rect.height) * 100;
    
    const level = LEVELS[currentLevel];
    let found = false;
    
    for (const diff of level.diffs) {
        if (foundDiffs.includes(diff.index)) continue;
        
        const item = level.items[diff.index];
        let itemX = item.x;
        let itemY = item.y;
        
        if (diff.prop === 'x') itemX = diff.value;
        
        const distance = Math.sqrt(Math.pow(x - itemX, 2) + Math.pow(y - itemY, 2));
        
        if (distance < 15) {
            found = true;
            foundDiffs.push(diff.index);
            markDiff(diff.index);
            createSparkles(event.clientX, event.clientY);
            playSound('correct');
            
            document.getElementById('foundDisplay').textContent = `${foundDiffs.length}/5`;
            
            if (foundDiffs.length === 5) {
                stopTimer();
                setTimeout(showVictory, 500);
            }
            break;
        }
    }
    
    if (!found) {
        event.currentTarget.classList.add('shake');
        setTimeout(() => event.currentTarget.classList.remove('shake'), 400);
        playSound('wrong');
    }
}

function markDiff(index) {
    const level = LEVELS[currentLevel];
    const diff = level.diffs.find(d => d.index === index);
    const item = level.items[index];
    let itemX = item.x;
    let itemY = item.y;
    
    const marker1 = document.createElement('div');
    marker1.className = 'diff-marker';
    marker1.style.left = item.x + '%';
    marker1.style.top = item.y + '%';
    document.getElementById('image1').appendChild(marker1);
    
    if (diff.prop === 'x') itemX = diff.value;
    const marker2 = document.createElement('div');
    marker2.className = 'diff-marker';
    marker2.style.left = itemX + '%';
    marker2.style.top = itemY + '%';
    document.getElementById('image2').appendChild(marker2);
}

function createSparkles(x, y) {
    for (let i = 0; i < 8; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = x + (Math.random() - 0.5) * 40 + 'px';
        sparkle.style.top = y + (Math.random() - 0.5) * 40 + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 600);
    }
}

function useHint() {
    if (hintsRemaining <= 0) return;
    
    const level = LEVELS[currentLevel];
    const unfound = level.diffs.filter(d => !foundDiffs.includes(d.index));
    
    if (unfound.length === 0) return;
    
    const hint = unfound[Math.floor(Math.random() * unfound.length)];
    const item = level.items[hint.index];
    
    const image = document.getElementById('image1');
    const rect = image.getBoundingClientRect();
    const hintX = rect.left + (item.x / 100) * rect.width;
    const hintY = rect.top + (item.y / 100) * rect.height;
    
    const hintCircle = document.createElement('div');
    hintCircle.style.cssText = `
        position: fixed;
        width: 80px;
        height: 80px;
        border: 3px solid #f59e0b;
        border-radius: 50%;
        left: ${hintX}px;
        top: ${hintY}px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 50;
        animation: hintGlow 1.5s ease-in-out 2;
    `;
    document.body.appendChild(hintCircle);
    setTimeout(() => hintCircle.remove(), 3000);
    
    hintsRemaining--;
    document.getElementById('hintBtn').textContent = `🔍 放大镜 (${hintsRemaining})`;
    
    if (hintsRemaining <= 0) {
        document.getElementById('hintBtn').disabled = true;
    }
}

function showVictory() {
    const level = LEVELS[currentLevel];
    const isNew = !stickers.includes(currentLevel);
    
    if (isNew) {
        stickers.push(currentLevel);
        localStorage.setItem('diff_stickers', JSON.stringify(stickers));
    }
    
    document.getElementById('victoryEmoji').textContent = isNew ? '🎊' : '🎉';
    document.getElementById('victoryTitle').textContent = isNew ? '恭喜通关！' : '太棒了！';
    document.getElementById('newSticker').textContent = level.sticker;
    document.getElementById('stickerUnlock').textContent = isNew ? '获得新贴纸：' + level.name + '！' : '已收集此贴纸';
    
    document.getElementById('victoryModal').classList.add('active');
}

function nextLevel() {
    closeVictory();
    if (currentLevel < LEVELS.length - 1) {
        currentLevel++;
        selectLevel(currentLevel);
        startGame();
    } else {
        showStartModal();
    }
}

function showGameOver() {
    document.getElementById('gameOverFound').textContent = foundDiffs.length;
    document.getElementById('gameOverModal').classList.add('active');
}

function retryLevel() {
    document.getElementById('gameOverModal').classList.remove('active');
    startGame();
}

function showStickers() {
    const grid = document.getElementById('stickerGrid');
    grid.innerHTML = '';
    
    LEVELS.forEach((level, idx) => {
        const item = document.createElement('div');
        item.className = 'sticker-item ' + (stickers.includes(idx) ? 'unlocked' : 'locked');
        item.innerHTML = `
            ${level.sticker}
            <div class="sticker-name">${level.name}</div>
        `;
        grid.appendChild(item);
    });
    
    document.getElementById('stickerModal').classList.add('active');
}

function closeStickers() {
    document.getElementById('stickerModal').classList.remove('active');
}

function showStartModal() {
    document.getElementById('startModal').classList.add('active');
}

function closeStartModal() {
    document.getElementById('startModal').classList.remove('active');
}

function closeVictory() {
    document.getElementById('victoryModal').classList.remove('active');
}

function playSound(type) {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'correct') {
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        } else {
            oscillator.frequency.value = 200;
            oscillator.type = 'sawtooth';
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        }
        
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
}

const style = document.createElement('style');
style.textContent = `
    @keyframes hintGlow {
        0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    }
`;
document.head.appendChild(style);

init();
</script>
