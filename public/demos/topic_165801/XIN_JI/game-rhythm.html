<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节奏大师 - 霓虹节拍</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d1a2d);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(255, 0, 150, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 0, 0.1) 0%, transparent 50%);
  animation: bgShift 8s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes bgShift {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.1) rotate(-5deg); }
}
body.cosmic {
  background: linear-gradient(135deg, #000011, #110033, #000022);
}
body.cosmic::before {
  background: 
    radial-gradient(circle at 10% 20%, rgba(100, 0, 200, 0.4) 0%, transparent 35%),
    radial-gradient(circle at 90% 80%, rgba(0, 100, 200, 0.4) 0%, transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(200, 0, 150, 0.2) 0%, transparent 60%);
}
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 25px;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  z-index: 100;
  transition: all 0.3s;
  cursor: pointer;
}
.back-btn:hover {
  background: rgba(255, 0, 255, 0.3);
  border-color: #ff00ff;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
  transform: translateX(-5px);
}
.game-container {
  z-index: 1;
  text-align: center;
}
h1 {
  color: #fff;
  font-size: 2rem;
  margin-bottom: 15px;
  text-shadow: 
    0 0 10px #ff00ff,
    0 0 20px #ff00ff,
    0 0 40px #00ffff;
  animation: titlePulse 1.5s ease-in-out infinite alternate;
}
@keyframes titlePulse {
  0% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
  100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #ff00ff; }
}
.info-panel {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.info-box {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 10px 22px;
  color: #fff;
  min-width: 90px;
}
.info-box .label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 5px;
}
.info-box .value {
  font-size: 26px;
  font-weight: bold;
  text-shadow: 0 0 10px currentColor;
}
.mode-selector {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.mode-btn {
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 20px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  font-weight: bold;
}
.mode-btn:hover {
  transform: scale(1.05);
  border-color: #00ffff;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
}
.mode-btn.selected {
  background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.3));
  border-color: #ff00ff;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
}
#game-canvas {
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.3);
  box-shadow: 
    0 0 40px rgba(255, 0, 255, 0.3),
    0 0 80px rgba(0, 255, 255, 0.2),
    inset 0 0 60px rgba(0, 0, 0, 0.5);
  background: radial-gradient(circle, rgba(20, 10, 40, 0.9), rgba(10, 5, 25, 0.95));
  cursor: pointer;
}
.hint {
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  margin-top: 15px;
}
.judgment-text {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 56px;
  font-weight: bold;
  pointer-events: none;
  z-index: 2000;
  animation: judgmentAnim 0.8s ease-out forwards;
}
.judgment-text.perfect {
  color: #ffd700;
  text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6600;
}
.judgment-text.good {
  color: #00ff88;
  text-shadow: 0 0 20px #00ff88, 0 0 40px #00ffff;
}
.judgment-text.miss {
  color: #ff4444;
  text-shadow: 0 0 20px #ff4444;
}
@keyframes judgmentAnim {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
}
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  backdrop-filter: blur(5px);
}
.modal-content {
  background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 30px;
  padding: 40px;
  text-align: center;
  color: #fff;
  max-width: 90%;
}
.modal-content h2 {
  font-size: 2rem;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff00ff;
}
.modal-content p {
  font-size: 1.1rem;
  margin-bottom: 12px;
}
.modal-content button {
  padding: 15px 40px;
  font-size: 1.2rem;
  background: linear-gradient(135deg, #ff00ff, #00ffff);
  border: none;
  border-radius: 30px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: all 0.3s;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
}
.modal-content button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
}
.combo-display {
  position: fixed;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 72px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff;
  pointer-events: none;
  z-index: 1500;
  opacity: 0;
  transition: opacity 0.3s;
}
.combo-display.show {
  opacity: 1;
  animation: comboPulse 0.3s ease-out;
}
@keyframes comboPulse {
  0% { transform: translateX(-50%) scale(1.5); }
  100% { transform: translateX(-50%) scale(1); }
}
.cosmic-text {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff, 0 0 90px #ff00ff;
  pointer-events: none;
  z-index: 2500;
  animation: cosmicAnim 2s ease-out forwards;
}
@keyframes cosmicAnim {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<a href="game-hub.html" class="back-btn">← 返回长廊</a>
<div class="game-container">
  <h1>🎵 节奏大师 霓虹版 🎵</h1>
  <div class="info-panel">
    <div class="info-box">
      <div class="label">得分</div>
      <div class="value" id="score-display" style="color: #ff00ff;">0</div>
    </div>
    <div class="info-box">
      <div class="label">连击</div>
      <div class="value" id="combo-display" style="color: #00ffff;">0</div>
    </div>
    <div class="info-box">
      <div class="label">最高分</div>
      <div class="value" id="highscore-display" style="color: #ffd700;">0</div>
    </div>
  </div>
  <div class="mode-selector">
    <button class="mode-btn selected" data-mode="heartbeat">💓 心跳模式</button>
    <button class="mode-btn" data-mode="disco">🎉 蹦迪模式</button>
    <button class="mode-btn" data-mode="random">🎲 随机模式</button>
  </div>
  <canvas id="game-canvas" width="400" height="400"></canvas>
  <div class="hint">圆圈扩大到外圈判定圈时点击中心！Perfect得100分，Good得50分</div>
</div>

<div class="combo-display" id="combo-big"></div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const comboDisplay = document.getElementById('combo-display');
const highscoreDisplay = document.getElementById('highscore-display');
const comboBig = document.getElementById('combo-big');

const W = canvas.width;
const H = canvas.height;
const CENTER_X = W / 2;
const CENTER_Y = H / 2;

let score = 0;
let combo = 0;
let highScore = parseInt(localStorage.getItem('rhythmHighScore')) || 0;
highscoreDisplay.textContent = highScore;

let currentMode = 'heartbeat';
const MODES = {
  heartbeat: { name: '心跳模式', baseInterval: 1200, intervalVariation: 200, speed: 0.8 },
  disco: { name: '蹦迪模式', baseInterval: 600, intervalVariation: 150, speed: 1.5 },
  random: { name: '随机模式', baseInterval: 900, intervalVariation: 500, speed: 1.2 }
};

let rings = [];
let particles = [];
let stars = [];
let gameStarted = false;
let gameOver = false;
let missCount = 0;
const MAX_MISSES = 5;

let isCosmic = false;
let cosmicTimer = 0;
let audioContext = null;

function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(frequency, duration, type = 'sine', volume = 0.3) {
  if (!audioContext) return;
  
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();
  
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
  
  gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
  
  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);
  
  oscillator.start(audioContext.currentTime);
  oscillator.stop(audioContext.currentTime + duration);
}

function playHitSound(judgment) {
  if (judgment === 'perfect') {
    playTone(880, 0.15, 'sine', 0.4);
    setTimeout(() => playTone(1100, 0.1, 'sine', 0.3), 50);
  } else if (judgment === 'good') {
    playTone(660, 0.12, 'sine', 0.3);
  } else {
    playTone(200, 0.2, 'sawtooth', 0.2);
  }
}

function spawnRing() {
  if (gameOver) return;
  
  const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff6600', '#00ff66', '#ff0066', '#9966ff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  
  rings.push({
    radius: 10,
    targetRadius: 140,
    speed: MODES[currentMode].speed * (0.8 + Math.random() * 0.4),
    color,
    opacity: 1,
    hit: false,
    missed: false
  });
  
  const interval = MODES[currentMode].baseInterval 
    + (Math.random() - 0.5) * MODES[currentMode].intervalVariation;
  
  setTimeout(spawnRing, Math.max(300, interval));
}

function createExplosionParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 3 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 4 + Math.random() * 8,
      color,
      life: 1,
      decay: 0.015 + Math.random() * 0.01
    });
  }
}

function showJudgment(judgment) {
  const el = document.createElement('div');
  el.className = `judgment-text ${judgment}`;
  el.textContent = judgment === 'perfect' ? 'PERFECT!' : judgment === 'good' ? 'GOOD!' : 'MISS';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function updateComboDisplay() {
  comboDisplay.textContent = combo;
  if (combo >= 5) {
    comboBig.textContent = `${combo} COMBO!`;
    comboBig.classList.remove('show');
    void comboBig.offsetWidth;
    comboBig.classList.add('show');
  }
  
  if (combo >= 20 && !isCosmic) {
    activateCosmic();
  }
}

function activateCosmic() {
  isCosmic = true;
  cosmicTimer = 600;
  document.body.classList.add('cosmic');
  
  const cosmicText = document.createElement('div');
  cosmicText.className = 'cosmic-text';
  cosmicText.textContent = '🚀 飞升宇宙！🚀';
  document.body.appendChild(cosmicText);
  setTimeout(() => cosmicText.remove(), 2000);
}

function handleClick(e) {
  if (gameOver) return;
  
  if (!gameStarted) {
    startGame();
    return;
  }
  
  initAudio();
  
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;
  
  const distFromCenter = Math.sqrt(
    Math.pow(clickX - CENTER_X, 2) + 
    Math.pow(clickY - CENTER_Y, 2)
  );
  
  if (distFromCenter > 160) return;
  
  let closestRing = null;
  let closestDiff = Infinity;
  
  for (const ring of rings) {
    if (ring.hit || ring.missed) continue;
    const diff = Math.abs(ring.radius - ring.targetRadius);
    if (diff < closestDiff) {
      closestDiff = diff;
      closestRing = ring;
    }
  }
  
  if (!closestRing) {
    handleMiss();
    return;
  }
  
  const diff = Math.abs(closestRing.radius - closestRing.targetRadius);
  let judgment;
  let points;
  
  if (diff < 15) {
    judgment = 'perfect';
    points = 100;
    combo++;
    closestRing.hit = true;
    createExplosionParticles(CENTER_X, CENTER_Y, closestRing.color, 30);
    playHitSound('perfect');
  } else if (diff < 35) {
    judgment = 'good';
    points = 50;
    combo++;
    closestRing.hit = true;
    createExplosionParticles(CENTER_X, CENTER_Y, closestRing.color, 20);
    playHitSound('good');
  } else {
    judgment = 'miss';
    points = 0;
    handleMiss();
    playHitSound('miss');
  }
  
  if (judgment !== 'miss') {
    score += points + Math.floor(combo * 2);
    scoreDisplay.textContent = score;
    updateComboDisplay();
  }
  
  showJudgment(judgment);
}

function handleMiss() {
  combo = 0;
  missCount++;
  updateComboDisplay();
  
  if (missCount >= MAX_MISSES) {
    endGame();
  }
}

function update() {
  if (!gameStarted || gameOver) return;
  
  for (let i = rings.length - 1; i >= 0; i--) {
    const ring = rings[i];
    if (ring.hit) {
      rings.splice(i, 1);
      continue;
    }
    
    ring.radius += ring.speed;
    
    if (ring.radius > ring.targetRadius + 40 && !ring.missed) {
      ring.missed = true;
      handleMiss();
      showJudgment('miss');
      playHitSound('miss');
    }
    
    if (ring.radius > 200) {
      rings.splice(i, 1);
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
  
  stars.forEach(star => {
    star.y += star.speed * (isCosmic ? 3 : 1);
    star.twinkle += 0.05;
    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }
  });
  
  if (isCosmic) {
    cosmicTimer--;
    if (cosmicTimer <= 0) {
      isCosmic = false;
      document.body.classList.remove('cosmic');
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  if (isCosmic) {
    const gradient = ctx.createRadialGradient(CENTER_X, CENTER_Y, 0, CENTER_X, CENTER_Y, W / 2);
    gradient.addColorStop(0, 'rgba(50, 0, 100, 0.8)');
    gradient.addColorStop(0.5, 'rgba(20, 0, 50, 0.9)');
    gradient.addColorStop(1, 'rgba(0, 0, 20, 1)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }
  
  stars.forEach(star => {
    const brightness = 0.4 + Math.sin(star.twinkle) * 0.3;
    ctx.fillStyle = isCosmic 
      ? `rgba(255, 215, 0, ${brightness})`
      : `rgba(255, 255, 255, ${brightness * 0.6})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, 140, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, 155, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, 125, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  
  rings.forEach(ring => {
    if (ring.hit) return;
    
    ctx.save();
    
    const alpha = ring.missed ? 0.3 : ring.opacity;
    
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = 6;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = ring.color;
    ctx.shadowBlur = 20;
    
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, ring.radius, 0, Math.PI * 2);
    ctx.stroke();
    
    const gradient = ctx.createRadialGradient(
      CENTER_X, CENTER_Y, ring.radius * 0.9,
      CENTER_X, CENTER_Y, ring.radius
    );
    gradient.addColorStop(0, 'transparent');
    gradient.addColorStop(1, ring.color + '40');
    ctx.fillStyle = gradient;
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, ring.radius, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  });
  
  const centerGlowSize = 40 + Math.sin(Date.now() / 200) * 5;
  const centerGradient = ctx.createRadialGradient(
    CENTER_X, CENTER_Y, 0,
    CENTER_X, CENTER_Y, centerGlowSize
  );
  centerGradient.addColorStop(0, isCosmic ? 'rgba(255, 215, 0, 0.8)' : 'rgba(255, 255, 255, 0.6)');
  centerGradient.addColorStop(0.5, isCosmic ? 'rgba(255, 150, 0, 0.4)' : 'rgba(255, 0, 255, 0.3)');
  centerGradient.addColorStop(1, 'transparent');
  
  ctx.fillStyle = centerGradient;
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, centerGlowSize, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.save();
  ctx.fillStyle = isCosmic ? '#ffd700' : '#fff';
  ctx.shadowColor = isCosmic ? '#ffd700' : '#ff00ff';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, 25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  
  ctx.fillStyle = isCosmic ? '#ff6600' : '#ff00ff';
  ctx.font = '24px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎵', CENTER_X, CENTER_Y);
  
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  
  if (!gameStarted) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.font = 'bold 24px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 20;
    ctx.fillText('点击开始游戏', CENTER_X, CENTER_Y + 80);
    ctx.font = '16px Microsoft YaHei';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.shadowBlur = 10;
    ctx.fillText('圆圈到达外圈时点击中心', CENTER_X, CENTER_Y + 110);
  }
  
  if (gameStarted && !gameOver) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.font = '14px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.fillText(`失误: ${missCount} / ${MAX_MISSES}`, 20, H - 20);
  }
}

function startGame() {
  initAudio();
  gameStarted = true;
  gameOver = false;
  score = 0;
  combo = 0;
  missCount = 0;
  rings = [];
  particles = [];
  isCosmic = false;
  cosmicTimer = 0;
  document.body.classList.remove('cosmic');
  
  scoreDisplay.textContent = score;
  updateComboDisplay();
  
  setTimeout(spawnRing, 1000);
}

function endGame() {
  gameOver = true;
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('rhythmHighScore', highScore);
    highscoreDisplay.textContent = highScore;
  }
  
  setTimeout(() => {
    showGameOver();
  }, 1000);
}

function showGameOver() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h2>🎶 游戏结束 🎶</h2>
      <p>最终得分：<span style="color: #ff00ff; font-size: 2.5rem; font-weight: bold;">${score}</span></p>
      <p>最高连击：<span style="color: #00ffff;">${document.getElementById('combo-display').textContent}</span></p>
      <p>最高分：${highScore}</p>
      <button onclick="restartGame()">再来一次</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.restartGame = function() {
  document.querySelector('.modal').remove();
  gameStarted = false;
};

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (gameStarted && !gameOver) return;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentMode = btn.dataset.mode;
  });
});

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e.touches[0]);
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

initStars();
gameLoop();
</script>
</body>
</html>
