<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳一跳 - 情绪跳跃</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 15% 85%, rgba(255, 100, 200, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(100, 200, 255, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(200, 255, 100, 0.15) 0%, transparent 50%);
  animation: bgShift 12s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes bgShift {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.2) rotate(-6deg); }
}
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 25px;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  z-index: 100;
  transition: all 0.3s;
  cursor: pointer;
}
.back-btn:hover {
  background: rgba(255, 0, 255, 0.3);
  border-color: #ff00ff;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
  transform: translateX(-5px);
}
.game-container {
  z-index: 1;
  text-align: center;
}
h1 {
  color: #fff;
  font-size: 2rem;
  margin-bottom: 15px;
  text-shadow: 
    0 0 10px #00ff88,
    0 0 20px #00ff88,
    0 0 40px #00ffff;
  animation: titlePulse 2s ease-in-out infinite alternate;
}
@keyframes titlePulse {
  0% { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88; }
  100% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
}
.info-panel {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.info-box {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 10px 25px;
  color: #fff;
  min-width: 100px;
}
.info-box .label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 5px;
}
.info-box .value {
  font-size: 28px;
  font-weight: bold;
  text-shadow: 0 0 10px currentColor;
}
#game-canvas {
  border-radius: 20px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 
    0 0 30px rgba(0, 255, 255, 0.2),
    inset 0 0 30px rgba(0, 0, 0, 0.3);
  background: linear-gradient(180deg, rgba(20, 10, 40, 0.8), rgba(40, 20, 60, 0.8));
  cursor: pointer;
}
.hint {
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  margin-top: 15px;
}
.power-bar-container {
  width: 300px;
  height: 20px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 10px;
  margin: 15px auto;
  border: 2px solid rgba(255, 255, 255, 0.3);
  overflow: hidden;
}
.power-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ff88, #ffff00, #ff6600, #ff0066);
  border-radius: 8px;
  transition: none;
  box-shadow: 0 0 10px currentColor;
}
.skin-selector {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.skin-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.3);
  font-size: 30px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.skin-btn:hover {
  transform: scale(1.1);
  border-color: #00ffff;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
}
.skin-btn.selected {
  border-color: #ff00ff;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
  background: rgba(255, 0, 255, 0.2);
}
.skin-btn.locked {
  opacity: 0.5;
  cursor: not-allowed;
}
.skin-btn.locked::after {
  content: '🔒';
  position: absolute;
  font-size: 16px;
  bottom: -5px;
  right: -5px;
}
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  backdrop-filter: blur(5px);
}
.modal-content {
  background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 30px;
  padding: 40px;
  text-align: center;
  color: #fff;
  max-width: 90%;
}
.modal-content h2 {
  font-size: 2rem;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #00ffff;
}
.modal-content p {
  font-size: 1.2rem;
  margin-bottom: 15px;
}
.modal-content button {
  padding: 15px 40px;
  font-size: 1.2rem;
  background: linear-gradient(135deg, #00ffff, #ff00ff);
  border: none;
  border-radius: 30px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: all 0.3s;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}
.modal-content button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
}
.god-mode-text {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 60px;
  font-weight: bold;
  color: #ffd700;
  text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6600, 0 0 60px #ff0000;
  pointer-events: none;
  z-index: 2000;
  animation: godModeAnim 1.5s ease-out forwards;
}
@keyframes godModeAnim {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<a href="game-hub.html" class="back-btn">← 返回长廊</a>
<div class="game-container">
  <h1>🤖 跳一跳 情绪版 🐰</h1>
  <div class="info-panel">
    <div class="info-box">
      <div class="label">得分</div>
      <div class="value" id="score-display" style="color: #00ffff;">0</div>
    </div>
    <div class="info-box">
      <div class="label">连击</div>
      <div class="value" id="combo-display" style="color: #ffeb3b;">0</div>
    </div>
    <div class="info-box">
      <div class="label">最高分</div>
      <div class="value" id="highscore-display" style="color: #ff80ab;">0</div>
    </div>
  </div>
  <div class="skin-selector">
    <button class="skin-btn selected" data-skin="robot" title="小机器人">🤖</button>
    <button class="skin-btn locked" data-skin="bunny" title="小兔子 (100分解锁)">🐰</button>
    <button class="skin-btn locked" data-skin="star" title="小星星 (300分解锁)">⭐</button>
  </div>
  <canvas id="game-canvas" width="500" height="400"></canvas>
  <div class="power-bar-container">
    <div class="power-bar" id="power-bar"></div>
  </div>
  <div class="hint">按住屏幕/鼠标蓄力，松开起跳！落在中心+2分，连中触发超神模式！</div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const comboDisplay = document.getElementById('combo-display');
const highscoreDisplay = document.getElementById('highscore-display');
const powerBar = document.getElementById('power-bar');

const W = canvas.width;
const H = canvas.height;

let score = 0;
let combo = 0;
let highScore = parseInt(localStorage.getItem('jumpHighScore')) || 0;
let bestScore = parseInt(localStorage.getItem('jumpBestScore')) || 0;
highscoreDisplay.textContent = highScore;

let currentSkin = 'robot';
const SKINS = {
  robot: { emoji: '🤖', color: '#00ffff' },
  bunny: { emoji: '🐰', color: '#ff80ab', unlockScore: 100 },
  star: { emoji: '⭐', color: '#ffeb3b', unlockScore: 300 }
};

let player = {
  x: 100,
  y: 0,
  vy: 0,
  vx: 0,
  size: 40,
  isJumping: false,
  isCharging: false,
  squash: 1
};

let platforms = [];
let currentPlatformIndex = 0;
let cameraX = 0;

let isCharging = false;
let chargeStart = 0;
let power = 0;
let gameOver = false;
let godMode = false;
let godModeTimer = 0;

const PLATFORM_THEMES = [
  { name: '情绪小岛', color: '#ff80ab', topColor: '#ffb6c1', emoji: '🏝️' },
  { name: '云朵', color: '#87ceeb', topColor: '#e0f0ff', emoji: '☁️' },
  { name: '音符', color: '#9c27b0', topColor: '#ce93d8', emoji: '🎵' },
  { name: '美食', color: '#ff9800', topColor: '#ffcc80', emoji: '🍰' },
  { name: '彩虹', color: '#e91e63', topColor: '#f48fb1', emoji: '🌈' }
];

function initGame() {
  score = 0;
  combo = 0;
  gameOver = false;
  godMode = false;
  godModeTimer = 0;
  cameraX = 0;
  currentPlatformIndex = 0;
  platforms = [];
  
  platforms.push(createPlatform(100, H - 100, 80, 0));
  
  for (let i = 1; i < 10; i++) {
    addPlatform();
  }
  
  player.x = platforms[0].x + platforms[0].width / 2;
  player.y = platforms[0].y - player.size / 2;
  player.vy = 0;
  player.vx = 0;
  player.isJumping = false;
  player.isCharging = false;
  player.squash = 1;
  
  updateScore();
  checkSkinUnlocks();
}

function createPlatform(x, y, width, themeIndex) {
  const theme = PLATFORM_THEMES[themeIndex % PLATFORM_THEMES.length];
  return {
    x, y, width,
    height: 25,
    theme,
    themeIndex,
    hasPoint: Math.random() < 0.3,
    pointCollected: false
  };
}

function addPlatform() {
  const lastPlatform = platforms[platforms.length - 1];
  const gap = 80 + Math.random() * 120 + Math.min(score * 0.5, 100);
  const width = Math.max(40, 90 - Math.random() * 30 - score * 0.2);
  const yVariation = (Math.random() - 0.5) * 80;
  let newY = lastPlatform.y + yVariation;
  newY = Math.max(100, Math.min(H - 80, newY));
  const themeIndex = Math.floor(Math.random() * PLATFORM_THEMES.length);
  platforms.push(createPlatform(lastPlatform.x + lastPlatform.width / 2 + gap - width / 2, newY, width, themeIndex));
}

function drawPlatform(platform) {
  const x = platform.x - cameraX;
  const y = platform.y;
  const w = platform.width;
  const h = platform.height;
  
  if (x + w < -50 || x > W + 50) return;
  
  ctx.save();
  
  ctx.shadowColor = platform.theme.color;
  ctx.shadowBlur = 15;
  
  const gradient = ctx.createLinearGradient(x, y, x, y + h);
  gradient.addColorStop(0, platform.theme.topColor);
  gradient.addColorStop(1, platform.theme.color);
  ctx.fillStyle = gradient;
  
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 12);
  ctx.fill();
  
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.beginPath();
  ctx.roundRect(x + 5, y + 3, w - 10, 5, 3);
  ctx.fill();
  
  const centerX = x + w / 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(centerX, y + 5);
  ctx.lineTo(centerX, y - 15);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.beginPath();
  ctx.arc(centerX, y - 18, 4, 0, Math.PI * 2);
  ctx.fill();
  
  if (platform.hasPoint && !platform.pointCollected) {
    const pulseSize = 10 + Math.sin(Date.now() / 200) * 3;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffd700';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('⭐', centerX, y - 35 + Math.sin(Date.now() / 300) * 5);
    ctx.shadowBlur = 0;
  }
  
  ctx.restore();
}

function drawPlayer() {
  const x = player.x - cameraX;
  const y = player.y;
  
  ctx.save();
  ctx.translate(x, y);
  
  const scaleX = player.squash;
  const scaleY = 2 - player.squash;
  ctx.scale(scaleX, scaleY);
  
  if (godMode) {
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 30 + Math.sin(Date.now() / 100) * 15;
    
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, player.size);
    gradient.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
    gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, player.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.shadowColor = SKINS[currentSkin].color;
  ctx.shadowBlur = godMode ? 25 : 15;
  
  ctx.font = `${player.size}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(SKINS[currentSkin].emoji, 0, 0);
  
  ctx.restore();
}

function drawBackground() {
  const bgGradient = ctx.createLinearGradient(0, 0, 0, H);
  if (godMode) {
    bgGradient.addColorStop(0, '#1a0033');
    bgGradient.addColorStop(0.5, '#330066');
    bgGradient.addColorStop(1, '#0d001a');
  } else {
    bgGradient.addColorStop(0, 'rgba(20, 10, 50, 0.3)');
    bgGradient.addColorStop(1, 'rgba(40, 20, 70, 0.3)');
  }
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);
  
  const starCount = godMode ? 100 : 50;
  for (let i = 0; i < starCount; i++) {
    const sx = ((i * 137 + cameraX * 0.1) % W + W) % W;
    const sy = (i * 89) % H;
    const size = (i % 3) + 1;
    const brightness = 0.3 + Math.sin(Date.now() / 500 + i) * 0.3;
    ctx.fillStyle = godMode 
      ? `rgba(255, 215, 0, ${brightness})` 
      : `rgba(255, 255, 255, ${brightness})`;
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function update() {
  if (gameOver) return;
  
  if (player.isJumping) {
    player.vy += 0.6;
    player.x += player.vx;
    player.y += player.vy;
    
    if (player.vy > 0) {
      for (let i = 0; i < platforms.length; i++) {
        const p = platforms[i];
        const px = p.x + p.width / 2;
        const playerBottom = player.y + player.size / 2;
        
        if (player.x >= p.x && player.x <= p.x + p.width) {
          if (playerBottom >= p.y && playerBottom <= p.y + 20 && player.vy > 0) {
            player.y = p.y - player.size / 2;
            player.vy = 0;
            player.vx = 0;
            player.isJumping = false;
            
            const distFromCenter = Math.abs(player.x - px);
            const isCenter = distFromCenter < 12;
            
            if (i > currentPlatformIndex) {
              currentPlatformIndex = i;
              let points = 1;
              
              if (isCenter) {
                points = 2;
                combo++;
                if (combo >= 5 && !godMode) {
                  activateGodMode();
                }
              } else {
                combo = 0;
              }
              
              if (p.hasPoint && !p.pointCollected) {
                p.pointCollected = true;
                points += 5;
                createParticles(player.x, player.y, '#ffd700', 15);
              }
              
              score += points;
              updateScore();
              checkSkinUnlocks();
              
              player.squash = 0.7;
              animateSquash();
              
              createParticles(player.x, player.y, p.theme.color, isCenter ? 20 : 10);
            }
            
            while (platforms.length < currentPlatformIndex + 10) {
              addPlatform();
            }
            
            break;
          }
        }
      }
    }
    
    if (player.y > H + 100) {
      endGame();
    }
  }
  
  const targetCameraX = player.x - W / 3;
  cameraX += (targetCameraX - cameraX) * 0.1;
  
  if (godMode) {
    godModeTimer--;
    if (godModeTimer <= 0) {
      godMode = false;
    }
  }
}

function animateSquash() {
  const startTime = Date.now();
  function anim() {
    const t = (Date.now() - startTime) / 200;
    if (t >= 1) {
      player.squash = 1;
      return;
    }
    player.squash = 0.7 + (1 - 0.7) * (1 - Math.pow(1 - t, 3));
    requestAnimationFrame(anim);
  }
  anim();
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x: x - cameraX,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 3 + Math.random() * 6,
      color,
      life: 1
    });
  }
}

let particles = [];

function updateAndDrawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.02;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function activateGodMode() {
  godMode = true;
  godModeTimer = 180;
  
  const godText = document.createElement('div');
  godText.className = 'god-mode-text';
  godText.textContent = '✨ 超神模式！✨';
  document.body.appendChild(godText);
  setTimeout(() => godText.remove(), 1500);
}

function jump() {
  if (player.isJumping || gameOver) return;
  
  const jumpPower = Math.min(power, 1);
  const jumpVX = 4 + jumpPower * 12;
  const jumpVY = -10 - jumpPower * 8;
  
  player.vx = jumpVX;
  player.vy = jumpVY;
  player.isJumping = true;
  player.squash = 1.3;
  animateSquash();
  
  isCharging = false;
  power = 0;
  powerBar.style.width = '0%';
  
  createParticles(player.x, player.y + player.size / 2, '#00ffff', 8);
}

function startCharge() {
  if (player.isJumping || gameOver) return;
  isCharging = true;
  chargeStart = Date.now();
  player.isCharging = true;
}

function updateCharge() {
  if (!isCharging) return;
  const elapsed = Date.now() - chargeStart;
  power = Math.min(elapsed / 1500, 1);
  powerBar.style.width = (power * 100) + '%';
  
  if (player.squash > 0.6) {
    player.squash = 1 - power * 0.35;
  }
}

function endGame() {
  gameOver = true;
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('jumpHighScore', highScore);
    highscoreDisplay.textContent = highScore;
  }
  
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('jumpBestScore', bestScore);
  }
  
  setTimeout(() => {
    showGameOver();
  }, 500);
}

function showGameOver() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h2>💫 游戏结束 💫</h2>
      <p>最终得分：<span style="color: #00ffff; font-size: 2.5rem; font-weight: bold;">${score}</span></p>
      <p>最高分：${highScore}</p>
      <button onclick="restartGame()">再来一次</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.restartGame = function() {
  document.querySelector('.modal').remove();
  initGame();
};

function updateScore() {
  scoreDisplay.textContent = score;
  comboDisplay.textContent = combo;
}

function checkSkinUnlocks() {
  document.querySelectorAll('.skin-btn').forEach(btn => {
    const skin = btn.dataset.skin;
    if (SKINS[skin].unlockScore && highScore >= SKINS[skin].unlockScore) {
      btn.classList.remove('locked');
    }
  });
}

document.querySelectorAll('.skin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('locked')) return;
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentSkin = btn.dataset.skin;
  });
});

canvas.addEventListener('mousedown', startCharge);
canvas.addEventListener('mouseup', jump);
canvas.addEventListener('mouseleave', () => {
  if (isCharging) {
    jump();
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startCharge();
});
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  jump();
});

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  drawBackground();
  
  platforms.forEach(p => drawPlatform(p));
  
  updateAndDrawParticles();
  
  drawPlayer();
  
  if (isCharging) {
    const x = player.x - cameraX;
    const y = player.y + player.size / 2;
    ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + power * 0.5})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + power * 80, y - power * 60);
    ctx.stroke();
    
    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + power * 0.5})`;
    ctx.beginPath();
    ctx.arc(x + power * 80, y - power * 60, 5 + power * 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function gameLoop() {
  updateCharge();
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

initGame();
gameLoop();
</script>
