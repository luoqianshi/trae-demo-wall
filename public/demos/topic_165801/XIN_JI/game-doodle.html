<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>涂鸦画板 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    /* 标题 */
    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #333;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      color: #666;
    }

    /* 画布容器 */
    .canvas-container {
      position: relative;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    #drawCanvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* 工具栏 */
    .toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      background: rgba(255,255,255,0.95);
      padding: 15px 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      z-index: 100;
    }

    /* 颜色区域 */
    .color-palette {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .color-btn:hover {
      transform: scale(1.2);
    }

    .color-btn.active {
      border-color: #333;
      transform: scale(1.15);
    }

    /* 笔刷大小控制区 */
    .size-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .size-label {
      font-size: 12px;
      color: #666;
      min-width: 50px;
    }

    .size-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #e0e0e0;
      outline: none;
    }

    .size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .size-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .size-value {
      font-size: 13px;
      color: #333;
      font-weight: 600;
      min-width: 35px;
      text-align: right;
    }

    /* 笔刷预览 */
    .brush-preview {
      width: 50px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid #eee;
      padding-left: 10px;
    }

    .brush-dot {
      border-radius: 50%;
      background: #333;
      transition: all 0.1s;
    }

    /* 工具按钮行 */
    .tool-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 分隔线 */
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(0,0,0,0.1);
    }

    /* 功能按钮 */
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tool-btn:hover {
      background: #e0e0e0;
      transform: scale(1.05);
    }

    .tool-btn.active {
      background: #6366f1;
      color: #fff;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      color: #333;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
    }

    .back-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    /* 撤销/重做 */
    .action-btns {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>涂鸦画板</h1>
    <p>随意涂抹，让情绪流淌在指尖</p>
  </div>

  <button class="back-btn" onclick="window.history.back()">返回心迹</button>

  <div class="canvas-container">
    <canvas id="drawCanvas" width="800" height="480"></canvas>
  </div>

  <div class="toolbar">
    <!-- 颜色选择区 -->
    <div class="color-palette" id="colorPalette"></div>

    <!-- 笔刷大小控制 -->
    <div class="size-controls">
      <span class="size-label">笔刷粗细</span>
      <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="8">
      <span class="size-value" id="sizeValue">8px</span>
      <div class="brush-preview">
        <div class="brush-dot" id="brushDot"></div>
      </div>
    </div>

    <!-- 工具按钮 -->
    <div class="tool-row">
      <div class="action-btns">
        <button class="tool-btn" id="undoBtn" title="撤销">↶</button>
        <button class="tool-btn" id="redoBtn" title="重做">↷</button>
      </div>

      <div class="divider"></div>

      <button class="tool-btn" id="eraserBtn" title="橡皮擦">🧽</button>
      <button class="tool-btn" id="clearBtn" title="清空画布">🗑️</button>
      <button class="tool-btn" id="saveBtn" title="保存图片">💾</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const brushDot = document.getElementById('brushDot');
    const colorPalette = document.getElementById('colorPalette');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');

    // 颜色配置（15种颜色，按色系排列）
    const colors = [
      '#1a1a1a', '#6b7280', '#9ca3af', // 黑白灰
      '#ef4444', '#f97316', '#f59e0b', // 暖色
      '#eab308', '#84cc16', '#10b981', // 黄绿
      '#06b6d4', '#3b82f6', '#6366f1', // 冷色
      '#8b5cf6', '#d946ef', '#ec4899'  // 紫粉
    ];

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let currentColor = '#1a1a1a';
    let brushSize = 8;
    let isEraser = false;

    // 撤销/重做栈
    let history = [];
    let historyStep = -1;

    // 初始化颜色面板
    function initColorPalette() {
      colors.forEach((color, index) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn' + (index === 0 ? ' active' : '');
        btn.style.background = color;
        btn.dataset.color = color;
        btn.addEventListener('click', () => selectColor(btn, color));
        colorPalette.appendChild(btn);
      });
    }

    // 选择颜色
    function selectColor(btn, color) {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentColor = color;
      isEraser = false;
      document.getElementById('eraserBtn').classList.remove('active');
      updateBrushPreview();
    }

    // 更新笔刷预览
    function updateBrushPreview() {
      const size = Math.min(brushSize, 25);
      brushDot.style.width = size + 'px';
      brushDot.style.height = size + 'px';
      brushDot.style.background = isEraser ? '#e5e5e5' : currentColor;
    }

    // 保存历史记录
    function saveHistory() {
      historyStep++;
      if (historyStep < history.length) {
        history = history.slice(0, historyStep);
      }
      history.push(canvas.toDataURL());
      // 限制历史记录数量
      if (history.length > 30) {
        history.shift();
        historyStep--;
      }
      updateUndoRedoState();
    }

    // 更新撤销重做按钮状态
    function updateUndoRedoState() {
      undoBtn.style.opacity = historyStep > 0 ? '1' : '0.4';
      redoBtn.style.opacity = historyStep < history.length - 1 ? '1' : '0.4';
    }

    // 撤销
    function undo() {
      if (historyStep > 0) {
        historyStep--;
        restoreFromHistory(history[historyStep]);
      }
    }

    // 重做
    function redo() {
      if (historyStep < history.length - 1) {
        historyStep++;
        restoreFromHistory(history[historyStep]);
      }
    }

    // 从历史记录恢复
    function restoreFromHistory(dataUrl) {
      const img = new Image();
      img.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = dataUrl;
    }

    // 初始化画布背景
    function initCanvas() {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveHistory();
    }

    // 开始绘制
    function startDrawing(e) {
      isDrawing = true;
      const pos = getPosition(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    // 绘制
    function draw(e) {
      if (!isDrawing) return;

      const pos = getPosition(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
    }

    // 停止绘制
    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveHistory();
      }
    }

    // 获取位置
    function getPosition(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      if (e.touches) {
        return {
          x: (e.touches[0].clientX - rect.left) * scaleX,
          y: (e.touches[0].clientY - rect.top) * scaleY
        };
      } else {
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }
    }

    // 事件绑定
    sizeSlider.addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value);
      sizeValue.textContent = brushSize + 'px';
      updateBrushPreview();
    });

    document.getElementById('eraserBtn').addEventListener('click', function() {
      isEraser = !isEraser;
      this.classList.toggle('active');
      if (isEraser) {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      }
      updateBrushPreview();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('确定要清空画布吗？')) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveHistory();
      }
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `心迹涂鸦_${Date.now()}.png`;
      link.href = canvas.toDataURL();
      link.click();
    });

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') {
          e.preventDefault();
          if (e.shiftKey) {
            redo();
          } else {
            undo();
          }
        }
      }
    });

    // 鼠标事件
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    // 触摸事件
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startDrawing(e);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      draw(e);
    });
    canvas.addEventListener('touchend', stopDrawing);

    // 响应式画布
    function resizeCanvas() {
      const maxWidth = Math.min(window.innerWidth - 40, 800);
      const ratio = canvas.height / canvas.width;

      canvas.style.width = maxWidth + 'px';
      canvas.style.height = (maxWidth * ratio) + 'px';
    }

    window.addEventListener('resize', resizeCanvas);

    // 初始化
    initColorPalette();
    initCanvas();
    updateBrushPreview();
    resizeCanvas();
  </script>
</body>
</html>
