<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>气泡漫天 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 标题 */
    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      color: #fff;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    /* Canvas */
    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 顶部状态栏 */
    .status-bar {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    .status-item {
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      text-align: center;
      min-width: 90px;
    }

    .status-value {
      font-size: 24px;
      font-weight: 200;
      margin-bottom: 2px;
      transition: transform 0.15s;
    }

    .status-value.bump {
      transform: scale(1.2);
    }

    .status-label {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
    }

    /* 连击显示 */
    .combo-display {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 200;
      color: #ffd700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: all 0.2s;
    }

    .combo-display.show {
      opacity: 1;
      animation: comboPop 0.3s ease-out;
    }

    @keyframes comboPop {
      0% { transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .combo-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      margin-top: 5px;
    }

    /* 左侧成就 */
    .achievements {
      position: fixed;
      top: 130px;
      left: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 140px;
    }

    .ach-title {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-align: center;
    }

    .ach-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 6px;
      margin-bottom: 4px;
      opacity: 0.35;
      font-size: 10px;
      transition: all 0.3s;
    }

    .ach-item.unlocked {
      opacity: 1;
      background: rgba(255, 215, 0, 0.15);
    }

    .ach-icon {
      font-size: 14px;
    }

    /* 右侧特殊气泡说明 */
    .special-bubbles {
      position: fixed;
      top: 130px;
      right: 15px;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      width: 140px;
    }

    .sb-title {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-align: center;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 10px;
    }

    .sb-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 26px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(-50%) scale(1.05);
    }

    /* 成就解锁弹窗 */
    .unlock-popup {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
      padding: 25px 40px;
      border-radius: 18px;
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 215, 0, 0.3);
      text-align: center;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 300;
    }

    .unlock-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .unlock-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .unlock-title {
      font-size: 16px;
      margin-bottom: 4px;
      color: #ffd700;
    }

    .unlock-text {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>气泡漫天</h1>
    <p>戳破气泡，释放压力</p>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="status-value" id="popCount">0</div>
      <div class="status-label">已戳破</div>
    </div>
    <div class="status-item">
      <div class="status-value" id="scoreCount">0</div>
      <div class="status-label">得分</div>
    </div>
    <div class="status-item">
      <div class="status-value" id="comboCount">0</div>
      <div class="status-label">连击</div>
    </div>
  </div>

  <!-- 成就面板 -->
  <div class="achievements">
    <div class="ach-title">成就目标</div>
    <div class="ach-item" id="ach-10">
      <span class="ach-icon">🎯</span>
      <span>初见成效 (10)</span>
    </div>
    <div class="ach-item" id="ach-50">
      <span class="ach-icon">💥</span>
      <span>爆裂大师 (50)</span>
    </div>
    <div class="ach-item" id="ach-100">
      <span class="ach-icon">🔥</span>
      <span>百戳百中 (100)</span>
    </div>
    <div class="ach-item" id="ach-combo10">
      <span class="ach-icon">⚡</span>
      <span>10连击</span>
    </div>
    <div class="ach-item" id="ach-rainbow">
      <span class="ach-icon">🌈</span>
      <span>戳到彩虹气泡</span>
    </div>
  </div>

  <!-- 特殊气泡说明 -->
  <div class="special-bubbles">
    <div class="sb-title">特殊气泡</div>
    <div class="sb-item">
      <div class="sb-dot" style="background: radial-gradient(circle, #fff 0%, #ffd700 100%);"></div>
      <span>金色 +10分</span>
    </div>
    <div class="sb-item">
      <div class="sb-dot" style="background: conic-gradient(red, orange, yellow, green, blue, purple, red);"></div>
      <span>彩虹 +20分</span>
    </div>
    <div class="sb-item">
      <div class="sb-dot" style="background: radial-gradient(circle, #fff 0%, #c0c0c0 100%);"></div>
      <span>银色 时间减速</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="combo-display" id="comboDisplay">
    <div id="comboText">5 连击!</div>
    <div class="combo-sub" id="comboBonus">+5 奖励分</div>
  </div>

  <div class="unlock-popup" id="unlockPopup">
    <div class="unlock-icon">🎉</div>
    <div class="unlock-title">成就解锁！</div>
    <div class="unlock-text" id="unlockText">初见成效</div>
  </div>

  <button class="back-btn" onclick="window.history.back()">返回心迹</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let bubbles = [];
    let particles = [];
    let popCount = 0;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let lastPopTime = 0;
    const comboTimeout = 1500;

    const popCountEl = document.getElementById('popCount');
    const scoreCountEl = document.getElementById('scoreCount');
    const comboCountEl = document.getElementById('comboCount');
    const comboDisplay = document.getElementById('comboDisplay');
    const comboText = document.getElementById('comboText');
    const comboBonus = document.getElementById('comboBonus');

    // 成就配置
    const achievements = {
      'ach-10': { target: 10, type: 'count', name: '初见成效', icon: '🎯', unlocked: false },
      'ach-50': { target: 50, type: 'count', name: '爆裂大师', icon: '💥', unlocked: false },
      'ach-100': { target: 100, type: 'count', name: '百戳百中', icon: '🔥', unlocked: false },
      'ach-combo10': { target: 10, type: 'combo', name: '10连击达成', icon: '⚡', unlocked: false },
      'ach-rainbow': { target: 1, type: 'rainbow', name: '彩虹猎手', icon: '🌈', unlocked: false },
    };

    let timeScale = 1;
    let slowMoUntil = 0;

    // 音频上下文
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 爆裂音效（根据类型不同）
    function playPopSound(type = 'normal') {
      if (!audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'gold') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'rainbow') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.15);
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'silver') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.3);
      } else {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.12);
      }
    }

    // 气泡类
    class Bubble {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 80;
        this.radius = Math.random() * 25 + 20;
        this.maxRadius = this.radius;
        this.currentRadius = 0;
        this.growing = true;
        this.baseSpeed = Math.random() * 1.2 + 0.4;
        this.speed = this.baseSpeed;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.03 + 0.01;

        // 类型：normal / gold / rainbow / silver
        const rand = Math.random();
        if (rand < 0.03) {
          this.type = 'rainbow';
        } else if (rand < 0.08) {
          this.type = 'gold';
        } else if (rand < 0.12) {
          this.type = 'silver';
        } else {
          this.type = 'normal';
        }

        // 颜色
        if (this.type === 'normal') {
          const colors = [
            { r: 147, g: 112, b: 219 },
            { r: 135, g: 206, b: 250 },
            { r: 255, g: 182, b: 193 },
            { r: 152, g: 251, b: 152 },
            { r: 255, g: 218, b: 185 },
          ];
          this.color = colors[Math.floor(Math.random() * colors.length)];
        } else if (this.type === 'gold') {
          this.color = { r: 255, g: 215, b: 0 };
        } else if (this.type === 'silver') {
          this.color = { r: 192, g: 192, b: 192 };
        } else {
          this.color = { r: 255, g: 0, b: 0 }; // rainbow will be drawn specially
        }

        this.alpha = 0;
        this.rotation = 0;
        this.rotationSpeed = (Math.random() - 0.5) * 0.02;
      }

      update() {
        const dt = timeScale;

        if (this.growing) {
          this.currentRadius += 0.5 * dt;
          this.alpha = Math.min(this.alpha + 0.02 * dt, 0.7);
          if (this.currentRadius >= this.maxRadius) {
            this.growing = false;
          }
        }

        this.speed = this.baseSpeed * dt;
        this.y -= this.speed;

        this.wobble += this.wobbleSpeed * dt;
        this.x += Math.sin(this.wobble) * 0.5 * dt;

        this.rotation += this.rotationSpeed * dt;

        if (this.y + this.currentRadius < 0) {
          // 漏掉气泡，连击清零
          if (combo > 0) {
            combo = 0;
            comboCountEl.textContent = combo;
          }
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.type === 'rainbow') {
          // 彩虹气泡
          const gradient = ctx.createConicGradient
            ? ctx.createConicGradient(0, 0, 0)
            : ctx.createRadialGradient(0, 0, 0, 0, 0, this.currentRadius);

          if (ctx.createConicGradient) {
            gradient.addColorStop(0, 'rgba(255, 0, 0, 0.8)');
            gradient.addColorStop(0.17, 'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(0.33, 'rgba(255, 255, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(0, 255, 0, 0.8)');
            gradient.addColorStop(0.67, 'rgba(0, 0, 255, 0.8)');
            gradient.addColorStop(0.83, 'rgba(75, 0, 130, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0.8)');
          } else {
            gradient.addColorStop(0, 'rgba(255, 0, 0, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 255, 0.8)');
          }

          ctx.beginPath();
          ctx.arc(0, 0, this.currentRadius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();
        } else {
          // 普通气泡
          ctx.beginPath();
          ctx.arc(0, 0, this.currentRadius, 0, Math.PI * 2);

          const gradient = ctx.createRadialGradient(
            -this.currentRadius * 0.3,
            -this.currentRadius * 0.3,
            0,
            0, 0, this.currentRadius
          );
          gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha * 0.6})`);
          gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`);
          gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.3})`);

          ctx.fillStyle = gradient;
          ctx.fill();
        }

        // 高光
        ctx.beginPath();
        ctx.arc(
          -this.currentRadius * 0.3,
          -this.currentRadius * 0.3,
          this.currentRadius * 0.2,
          0, Math.PI * 2
        );
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.9})`;
        ctx.fill();

        ctx.restore();
      }

      isClicked(mx, my) {
        const dx = mx - this.x;
        const dy = my - this.y;
        return Math.sqrt(dx * dx + dy * dy) <= this.currentRadius;
      }
    }

    // 粒子类
    class Particle {
      constructor(x, y, color, type = 'normal') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * (type === 'rainbow' ? 12 : 8);
        this.vy = (Math.random() - 0.5) * (type === 'rainbow' ? 12 : 8);
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.type = type;
      }

      update() {
        const dt = timeScale;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 0.1 * dt;
        this.alpha -= this.decay * dt;
      }

      draw() {
        if (this.type === 'rainbow') {
          const hue = (Date.now() / 5) % 360;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${this.alpha})`;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
          ctx.fill();
        }
      }

      isDead() {
        return this.alpha <= 0;
      }
    }

    // 创建爆裂粒子
    function createParticles(x, y, color, type) {
      const count = type === 'rainbow' ? 25 : (type === 'gold' || type === 'silver' ? 20 : 12);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, type));
      }
    }

    // 检查成就
    function checkAchievements() {
      Object.keys(achievements).forEach(key => {
        const ach = achievements[key];
        if (ach.unlocked) return;

        let reached = false;
        if (ach.type === 'count' && popCount >= ach.target) reached = true;
        if (ach.type === 'combo' && maxCombo >= ach.target) reached = true;
        if (ach.type === 'rainbow' && rainbowPopped) reached = true;

        if (reached) {
          ach.unlocked = true;
          const el = document.getElementById(key);
          if (el) el.classList.add('unlocked');
          showUnlock(ach.icon, '成就解锁！', ach.name);
        }
      });
    }

    let rainbowPopped = false;

    // 显示成就
    function showUnlock(icon, title, text) {
      const popup = document.getElementById('unlockPopup');
      popup.querySelector('.unlock-icon').textContent = icon;
      popup.querySelector('.unlock-title').textContent = title;
      document.getElementById('unlockText').textContent = text;
      popup.classList.add('show');
      setTimeout(() => popup.classList.remove('show'), 2000);
    }

    // 显示连击
    function showCombo(comboNum) {
      if (comboNum < 3) return;
      comboText.textContent = comboNum + ' 连击!';
      const bonus = Math.floor(comboNum * 2);
      comboBonus.textContent = '+' + bonus + ' 奖励分';
      comboDisplay.classList.add('show');
      setTimeout(() => comboDisplay.classList.remove('show'), 500);
    }

    // 调整画布
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    // 点击处理
    function handleClick(e) {
      initAudio();

      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        if (bubbles[i].isClicked(mx, my)) {
          const b = bubbles[i];
          createParticles(b.x, b.y, b.color, b.type);
          playPopSound(b.type);

          // 计分
          let points = 1;
          if (b.type === 'gold') points = 10;
          else if (b.type === 'rainbow') points = 20;
          else if (b.type === 'silver') points = 5;

          // 连击
          const now = Date.now();
          if (now - lastPopTime < comboTimeout) {
            combo++;
          } else {
            combo = 1;
          }
          lastPopTime = now;
          if (combo > maxCombo) maxCombo = combo;

          // 连击加分
          if (combo >= 3) {
            points += Math.floor(combo * 2);
          }

          // 银色气泡：时间减速
          if (b.type === 'silver') {
            slowMoUntil = now + 3000;
          }

          // 彩虹气泡
          if (b.type === 'rainbow') {
            rainbowPopped = true;
          }

          popCount++;
          score += points;

          // 更新UI
          popCountEl.textContent = popCount;
          popCountEl.classList.add('bump');
          setTimeout(() => popCountEl.classList.remove('bump'), 150);

          scoreCountEl.textContent = score;
          scoreCountEl.classList.add('bump');
          setTimeout(() => scoreCountEl.classList.remove('bump'), 150);

          comboCountEl.textContent = combo;
          comboCountEl.classList.add('bump');
          setTimeout(() => comboCountEl.classList.remove('bump'), 150);

          showCombo(combo);
          checkAchievements();

          b.reset();
          break;
        }
      }
    }

    // 动画循环
    function animate() {
      // 时间减速检查
      if (Date.now() < slowMoUntil) {
        timeScale = 0.4;
      } else {
        timeScale = 1;
      }

      ctx.clearRect(0, 0, width, height);

      bubbles.forEach(bubble => {
        bubble.update();
        bubble.draw();
      });

      particles = particles.filter(particle => {
        particle.update();
        particle.draw();
        return !particle.isDead();
      });

      requestAnimationFrame(animate);
    }

    // 定期添加气泡
    setInterval(() => {
      const targetCount = Math.min(25, 10 + Math.floor(popCount / 20));
      if (bubbles.length < targetCount) {
        bubbles.push(new Bubble());
      }
    }, 1500);

    // 连击超时检查
    setInterval(() => {
      if (combo > 0 && Date.now() - lastPopTime > comboTimeout) {
        combo = 0;
        comboCountEl.textContent = combo;
      }
    }, 200);

    // 初始化
    window.addEventListener('resize', resize);
    canvas.addEventListener('click', handleClick);

    resize();
    for (let i = 0; i < 12; i++) {
      const b = new Bubble();
      b.y = Math.random() * height;
      bubbles.push(b);
    }
    animate();
  </script>
</body>
</html>
