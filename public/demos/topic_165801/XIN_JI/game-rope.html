<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻花绳</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
        radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
    animation: float 20s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-30px, 30px) rotate(2deg); }
}

.top-bar {
    width: 100%;
    max-width: 600px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    z-index: 1;
}

.back-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(-3px);
}

.game-title {
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 10px rgba(34, 197, 94, 0.5);
}

.tutorial-btn {
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}

.tutorial-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(3px);
}

.mode-indicator {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 14px;
    padding: 10px 20px;
    margin-bottom: 15px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 1;
    max-width: 600px;
    width: 100%;
}

.mode-name {
    font-size: 18px;
    font-weight: bold;
    color: white;
}

.step-info {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 5px;
}

.pattern-name {
    font-size: 16px;
    color: #4ade80;
    margin-top: 5px;
}

.canvas-container {
    position: relative;
    z-index: 1;
}

canvas {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

.controls {
    width: 100%;
    max-width: 600px;
    display: flex;
    gap: 12px;
    margin-top: 20px;
    z-index: 1;
    flex-wrap: wrap;
    justify-content: center;
}

.btn {
    padding: 12px 24px;
    background: linear-gradient(135deg, #22c55e, #14b8a6);
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(34, 197, 94, 0.5);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-prev:disabled,
.btn-next:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.tip {
    margin-top: 15px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    text-align: center;
    z-index: 1;
    max-width: 600px;
    line-height: 1.6;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal {
    background: rgba(30, 30, 60, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px;
    max-width: 500px;
    width: 90%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.3s ease;
    max-height: 85vh;
    overflow-y: auto;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
}

.pattern-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.pattern-item {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.pattern-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
    border-color: rgba(34, 197, 94, 0.5);
}

.pattern-emoji {
    font-size: 36px;
    margin-bottom: 8px;
}

.pattern-label {
    color: white;
    font-size: 14px;
    font-weight: bold;
}

.pattern-desc {
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
    margin-top: 4px;
}

.modal-close {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #22c55e, #14b8a6);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.modal-close:hover {
    transform: scale(1.02);
}

.success-flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    animation: successPop 1s ease-out forwards;
}

@keyframes successPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
}

.mode-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.mode-select-btn {
    flex: 1;
    padding: 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.mode-select-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.mode-select-btn.selected {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.2);
}

.step-hint {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    color: #86efac;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
}

@media (max-width: 550px) {
    canvas {
        width: 100%;
        height: auto;
    }
}
</style>
</head>
<body>
    <div class="top-bar">
        <a href="game-hub.html" class="back-btn">← 返回</a>
        <h1 class="game-title">🪢 翻花绳</h1>
        <button class="tutorial-btn" onclick="showTutorialModal()">📖 教程</button>
    </div>
    
    <div class="mode-indicator">
        <div class="mode-name" id="modeName">自由模式</div>
        <div class="pattern-name" id="patternName">自由玩耍</div>
        <div class="step-info" id="stepInfo" style="display:none;">第 0/0 步</div>
        <div class="step-hint" id="stepHint" style="display:none;"></div>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas" width="500" height="400"></canvas>
    </div>
    
    <div class="controls">
        <button class="btn btn-secondary" onclick="resetRope()">🔄 重置</button>
        <button class="btn btn-prev" id="prevBtn" onclick="prevStep()" style="display:none;">⬅️ 上一步</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextStep()" style="display:none;">下一步 ➡️</button>
        <button class="btn btn-secondary" onclick="showPatternModal()">🎨 选择花样</button>
    </div>
    
    <p class="tip">拖动绳子上的节点来翻出各种花样<br>教程模式下按照提示一步步操作，自由模式随意玩耍~</p>
    
    <div class="modal-overlay" id="tutorialModal">
        <div class="modal">
            <h2>📖 选择模式</h2>
            <div class="mode-buttons">
                <div class="mode-select-btn selected" data-mode="free" onclick="selectTutorialMode('free')">
                    <div style="font-size:28px; margin-bottom:5px;">🎮</div>
                    <div>自由模式</div>
                    <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px;">随意玩耍</div>
                </div>
                <div class="mode-select-btn" data-mode="tutorial" onclick="selectTutorialMode('tutorial')">
                    <div style="font-size:28px; margin-bottom:5px;">📚</div>
                    <div>教程模式</div>
                    <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px;">学习8种花样</div>
                </div>
            </div>
            
            <div id="patternSelector" style="display:none;">
                <h2 style="font-size:18px;">选择花样</h2>
                <div class="pattern-grid" id="patternGrid"></div>
            </div>
            
            <button class="modal-close" onclick="startMode()">开始</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="patternModal">
        <div class="modal">
            <h2>🎨 选择花样</h2>
            <p style="margin-bottom:15px;">选择一个花样直接查看效果</p>
            <div class="pattern-grid" id="patternGrid2"></div>
            <button class="modal-close" onclick="closePatternModal()">关闭</button>
        </div>
    </div>
    
    <div class="success-flash" id="successFlash">✨</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const PATTERNS = [
    {
        name: '面条',
        emoji: '🍜',
        desc: '最基础的花样',
        steps: [
            { hint: '将绳子套在双手拇指和小指上', nodes: generateNoodleShape() },
        ]
    },
    {
        name: '大桥',
        emoji: '🌉',
        desc: '像一座大桥',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '用中指勾取对面的绳子', nodes: generateBridgeShape() },
        ]
    },
    {
        name: '剪刀',
        emoji: '✂️',
        desc: '像一把剪刀',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '交叉两根绳子形成剪刀', nodes: generateScissorsShape() },
        ]
    },
    {
        name: '五角星',
        emoji: '⭐',
        desc: '美丽的五角星',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '开始编织五角星', nodes: generateBridgeShape() },
            { hint: '完成五角星形状', nodes: generateStarShape() },
        ]
    },
    {
        name: '蜘蛛网',
        emoji: '🕸️',
        desc: '像蜘蛛网一样',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '编织第一层', nodes: generateBridgeShape() },
            { hint: '编织第二层', nodes: generateStarShape() },
            { hint: '完成蜘蛛网', nodes: generateWebShape() },
        ]
    },
    {
        name: '降落伞',
        emoji: '🪂',
        desc: '像降落伞一样',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '开始编织', nodes: generateBridgeShape() },
            { hint: '完成降落伞', nodes: generateParachuteShape() },
        ]
    },
    {
        name: '铁塔',
        emoji: '🗼',
        desc: '像埃菲尔铁塔',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '搭建底座', nodes: generateBridgeShape() },
            { hint: '搭建塔身', nodes: generateStarShape() },
            { hint: '完成铁塔', nodes: generateTowerShape() },
        ]
    },
    {
        name: '渔网',
        emoji: '🕸️',
        desc: '像捕鱼的渔网',
        steps: [
            { hint: '基础面条形状', nodes: generateNoodleShape() },
            { hint: '编织第一行', nodes: generateBridgeShape() },
            { hint: '编织第二行', nodes: generateWebShape() },
            { hint: '完成渔网', nodes: generateFishnetShape() },
        ]
    }
];

function generateNoodleShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        nodes.push({
            x: cx + Math.cos(angle) * 120,
            y: cy + Math.sin(angle) * 100,
            originalX: cx + Math.cos(angle) * 120,
            originalY: cy + Math.sin(angle) * 100,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[5].pinned = true;
    nodes[10].pinned = true;
    nodes[15].pinned = true;
    return nodes;
}

function generateBridgeShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        let r = 120;
        if (i >= 3 && i <= 7) r = 80;
        if (i >= 13 && i <= 17) r = 80;
        nodes.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * 100,
            originalX: cx + Math.cos(angle) * r,
            originalY: cy + Math.sin(angle) * 100,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[5].pinned = true;
    nodes[10].pinned = true;
    nodes[15].pinned = true;
    nodes[3].pinned = true;
    nodes[7].pinned = true;
    return nodes;
}

function generateScissorsShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        let x = cx + Math.cos(angle) * 120;
        let y = cy + Math.sin(angle) * 100;
        if (i >= 2 && i <= 8) {
            x = cx - 50 + (i - 2) * 25;
            y = cy - 50 + (i - 2) * 15;
        }
        if (i >= 12 && i <= 18) {
            x = cx + 50 - (i - 12) * 25;
            y = cy + 50 - (i - 12) * 15;
        }
        nodes.push({
            x: x,
            y: y,
            originalX: x,
            originalY: y,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[5].pinned = true;
    nodes[10].pinned = true;
    nodes[15].pinned = true;
    return nodes;
}

function generateStarShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    const outerR = 130;
    const innerR = 60;
    for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 === 0 ? outerR : innerR;
        nodes.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r * 0.85,
            originalX: cx + Math.cos(angle) * r,
            originalY: cy + Math.sin(angle) * r * 0.85,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[4].pinned = true;
    nodes[8].pinned = true;
    nodes[12].pinned = true;
    nodes[16].pinned = true;
    return nodes;
}

function generateWebShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2;
        const r = 80 + Math.sin(angle * 6) * 40;
        nodes.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r * 0.85,
            originalX: cx + Math.cos(angle) * r,
            originalY: cy + Math.sin(angle) * r * 0.85,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[6].pinned = true;
    nodes[12].pinned = true;
    nodes[18].pinned = true;
    return nodes;
}

function generateParachuteShape() {
    const nodes = [];
    const cx = 250, cy = 180;
    for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI;
        let x = cx + Math.cos(angle + Math.PI) * 100;
        let y = cy + Math.sin(angle + Math.PI) * 80;
        if (i >= 15) {
            x = cx + (i - 17.5) * 15;
            y = cy + 80 + (i - 15) * 10;
        }
        if (i <= 5) {
            x = cx + (i - 2.5) * 15;
            y = cy + 80 + (5 - i) * 10;
        }
        nodes.push({
            x: x,
            y: y,
            originalX: x,
            originalY: y,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[5].pinned = true;
    nodes[10].pinned = true;
    nodes[15].pinned = true;
    return nodes;
}

function generateTowerShape() {
    const nodes = [];
    const cx = 250;
    for (let i = 0; i < 20; i++) {
        let x, y;
        if (i < 5) {
            x = cx - 120 + i * 48;
            y = 320;
        } else if (i < 10) {
            const t = i - 5;
            x = cx + 120 - t * 20;
            y = 320 - t * 40;
        } else if (i < 15) {
            const t = i - 10;
            x = cx + 20 - t * 20;
            y = 120 + t * 20;
        } else {
            const t = i - 15;
            x = cx - 80 + t * 20;
            y = 220 + t * 25;
        }
        nodes.push({
            x: x,
            y: y,
            originalX: x,
            originalY: y,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[4].pinned = true;
    nodes[9].pinned = true;
    nodes[14].pinned = true;
    return nodes;
}

function generateFishnetShape() {
    const nodes = [];
    const cx = 250, cy = 200;
    for (let i = 0; i < 28; i++) {
        const angle = (i / 28) * Math.PI * 2;
        const r = 100 + Math.sin(angle * 8) * 30;
        nodes.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r * 0.8,
            originalX: cx + Math.cos(angle) * r,
            originalY: cy + Math.sin(angle) * r * 0.8,
            vx: 0,
            vy: 0,
            pinned: false
        });
    }
    nodes[0].pinned = true;
    nodes[7].pinned = true;
    nodes[14].pinned = true;
    nodes[21].pinned = true;
    return nodes;
}

let nodes = [];
let currentMode = 'free';
let currentPattern = 0;
let currentStep = 0;
let draggingNode = null;
let mouseX = 0, mouseY = 0;
let swingTime = 0;
let unlockedPatterns = JSON.parse(localStorage.getItem('rope_unlocked') || '[0]');

function init() {
    nodes = generateNoodleShape();
    setupControls();
    animate();
    renderPatternGrids();
}

function renderPatternGrids() {
    const grid1 = document.getElementById('patternGrid');
    const grid2 = document.getElementById('patternGrid2');
    grid1.innerHTML = '';
    grid2.innerHTML = '';
    
    PATTERNS.forEach((pattern, idx) => {
        const item1 = createPatternItem(pattern, idx, true);
        const item2 = createPatternItem(pattern, idx, false);
        grid1.appendChild(item1);
        grid2.appendChild(item2);
    });
}

function createPatternItem(pattern, idx, forTutorial) {
    const item = document.createElement('div');
    item.className = 'pattern-item';
    const unlocked = unlockedPatterns.includes(idx);
    if (!unlocked && forTutorial) {
        item.style.opacity = '0.5';
        item.style.filter = 'grayscale(0.8)';
    }
    item.innerHTML = `
        <div class="pattern-emoji">${pattern.emoji}</div>
        <div class="pattern-label">${pattern.name}</div>
        <div class="pattern-desc">${pattern.desc}</div>
        ${!unlocked && forTutorial ? '<div style="font-size:11px; color:#fbbf24; margin-top:4px;">🔒 未解锁</div>' : ''}
    `;
    item.onclick = () => {
        if (forTutorial) {
            selectPattern(idx);
        } else {
            showPatternDirectly(idx);
        }
    };
    return item;
}

function selectTutorialMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-select-btn').forEach(btn => btn.classList.remove('selected'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
    document.getElementById('patternSelector').style.display = mode === 'tutorial' ? 'block' : 'none';
}

function selectPattern(idx) {
    if (!unlockedPatterns.includes(idx)) return;
    currentPattern = idx;
    document.querySelectorAll('#patternGrid .pattern-item').forEach((item, i) => {
        item.style.borderColor = i === idx ? '#22c55e' : '';
        item.style.background = i === idx ? 'rgba(34, 197, 94, 0.2)' : '';
    });
}

function startMode() {
    closeTutorialModal();
    
    if (currentMode === 'free') {
        document.getElementById('modeName').textContent = '自由模式';
        document.getElementById('patternName').textContent = '自由玩耍';
        document.getElementById('stepInfo').style.display = 'none';
        document.getElementById('stepHint').style.display = 'none';
        document.getElementById('prevBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        nodes = generateNoodleShape();
    } else {
        currentStep = 0;
        document.getElementById('modeName').textContent = '教程模式';
        document.getElementById('patternName').textContent = PATTERNS[currentPattern].name;
        document.getElementById('stepInfo').style.display = 'block';
        document.getElementById('stepHint').style.display = 'block';
        document.getElementById('prevBtn').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'block';
        loadStep(0);
    }
}

function loadStep(step) {
    const pattern = PATTERNS[currentPattern];
    if (step < 0 || step >= pattern.steps.length) return;
    
    currentStep = step;
    const stepData = pattern.steps[step];
    nodes = JSON.parse(JSON.stringify(stepData.nodes));
    
    document.getElementById('stepInfo').textContent = `第 ${step + 1}/${pattern.steps.length} 步`;
    document.getElementById('stepHint').textContent = '💡 ' + stepData.hint;
    document.getElementById('prevBtn').disabled = step === 0;
    document.getElementById('nextBtn').disabled = step === pattern.steps.length - 1;
    
    if (step === pattern.steps.length - 1) {
        setTimeout(() => {
            showSuccess();
            unlockPattern(currentPattern + 1);
        }, 500);
    }
}

function prevStep() {
    if (currentStep > 0) {
        loadStep(currentStep - 1);
    }
}

function nextStep() {
    const pattern = PATTERNS[currentPattern];
    if (currentStep < pattern.steps.length - 1) {
        loadStep(currentStep + 1);
    }
}

function unlockPattern(idx) {
    if (idx >= PATTERNS.length) return;
    if (!unlockedPatterns.includes(idx)) {
        unlockedPatterns.push(idx);
        localStorage.setItem('rope_unlocked', JSON.stringify(unlockedPatterns));
        renderPatternGrids();
    }
}

function showSuccess() {
    const flash = document.getElementById('successFlash');
    flash.style.animation = 'none';
    flash.offsetHeight;
    flash.style.animation = 'successPop 1s ease-out forwards';
    playDingSound();
}

function playDingSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.frequency.value = 1200;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.4);
        
        setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.frequency.value = 1600;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc2.start(audioCtx.currentTime);
            osc2.stop(audioCtx.currentTime + 0.3);
        }, 150);
    } catch (e) {}
}

function resetRope() {
    if (currentMode === 'tutorial') {
        loadStep(0);
    } else {
        nodes = generateNoodleShape();
    }
}

function showPatternDirectly(idx) {
    closePatternModal();
    const pattern = PATTERNS[idx];
    const lastStep = pattern.steps[pattern.steps.length - 1];
    nodes = JSON.parse(JSON.stringify(lastStep.nodes));
    document.getElementById('modeName').textContent = '花样预览';
    document.getElementById('patternName').textContent = pattern.name;
    document.getElementById('stepInfo').style.display = 'none';
    document.getElementById('stepHint').style.display = 'none';
    document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    showSuccess();
}

function setupControls() {
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('mouseleave', endDrag);
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        startDrag({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        drag({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });
    
    canvas.addEventListener('touchend', endDrag);
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function startDrag(e) {
    const pos = getCanvasPos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    
    let closest = null;
    let minDist = 30;
    
    for (const node of nodes) {
        const dist = Math.sqrt(Math.pow(node.x - pos.x, 2) + Math.pow(node.y - pos.y, 2));
        if (dist < minDist) {
            minDist = dist;
            closest = node;
        }
    }
    
    if (closest) {
        draggingNode = closest;
    }
}

function drag(e) {
    const pos = getCanvasPos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    
    if (draggingNode) {
        draggingNode.x = pos.x;
        draggingNode.y = pos.y;
        draggingNode.vx = 0;
        draggingNode.vy = 0;
    }
}

function endDrag() {
    draggingNode = null;
}

function animate() {
    swingTime += 0.02;
    
    if (!draggingNode) {
        for (const node of nodes) {
            if (node.pinned) {
                node.x = node.originalX + Math.sin(swingTime + node.originalX * 0.01) * 2;
                node.y = node.originalY + Math.cos(swingTime * 0.8 + node.originalY * 0.01) * 1.5;
            } else {
                const dx = node.originalX - node.x;
                const dy = node.originalY - node.y;
                node.vx += dx * 0.02;
                node.vy += dy * 0.02;
                node.vx *= 0.92;
                node.vy *= 0.92;
                node.x += node.vx;
                node.y += node.vy;
            }
        }
    }
    
    draw();
    requestAnimationFrame(animate);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const gradient = ctx.createRadialGradient(250, 200, 0, 250, 200, 250);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (nodes.length < 2) return;
    
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(236, 72, 153, 0.8)';
    
    const ropeGradient = ctx.createLinearGradient(
        nodes[0].x, nodes[0].y,
        nodes[Math.floor(nodes.length / 2)].x, nodes[Math.floor(nodes.length / 2)].y
    );
    ropeGradient.addColorStop(0, '#ec4899');
    ropeGradient.addColorStop(0.5, '#8b5cf6');
    ropeGradient.addColorStop(1, '#3b82f6');
    
    ctx.strokeStyle = ropeGradient;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    ctx.moveTo(nodes[0].x, nodes[0].y);
    for (let i = 1; i < nodes.length; i++) {
        const xc = (nodes[i].x + nodes[i - 1].x) / 2;
        const yc = (nodes[i].y + nodes[i - 1].y) / 2;
        ctx.quadraticCurveTo(nodes[i - 1].x, nodes[i - 1].y, xc, yc);
    }
    const xc = (nodes[nodes.length - 1].x + nodes[0].x) / 2;
    const yc = (nodes[nodes.length - 1].y + nodes[0].y) / 2;
    ctx.quadraticCurveTo(nodes[nodes.length - 1].x, nodes[nodes.length - 1].y, xc, yc);
    ctx.closePath();
    ctx.stroke();
    
    ctx.shadowBlur = 0;
    
    for (const node of nodes) {
        if (node.pinned) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
            ctx.fill();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }
}

function showTutorialModal() {
    document.getElementById('tutorialModal').classList.add('active');
}

function closeTutorialModal() {
    document.getElementById('tutorialModal').classList.remove('active');
}

function showPatternModal() {
    document.getElementById('patternModal').classList.add('active');
}

function closePatternModal() {
    document.getElementById('patternModal').classList.remove('active');
}

init();
</script>
