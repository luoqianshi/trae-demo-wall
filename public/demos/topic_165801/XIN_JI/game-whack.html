<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打地鼠情绪版 · 心迹解压小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(80px);
      opacity: 0.35;
    }

    body::before {
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, #6C63FF 0%, transparent 70%);
      animation: bgDriftSlow 30s ease-in-out infinite;
    }

    body::after {
      bottom: -200px;
      right: -200px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.35) 0%, transparent 70%);
      animation: bgDriftSlow 30s ease-in-out infinite reverse;
    }

    @keyframes bgDriftSlow {
      0%, 100% { transform: translate(-6%, -6%) scale(1); opacity: 0.30; }
      50% { transform: translate(6%, 6%) scale(1.08); opacity: 0.40; }
    }

    .header {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .game-container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      padding-top: 80px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .status-card {
      flex: 1;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      color: #fff;
    }

    .status-value {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 2px;
      transition: transform 0.15s;
    }

    .status-value.bump {
      transform: scale(1.2);
    }

    .status-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

    .time-bar-container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      height: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .time-bar {
      height: 100%;
      background: linear-gradient(90deg, #6C63FF, #00D4FF);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .time-bar.warning {
      background: linear-gradient(90deg, #FF6B6B, #FFD93D);
      animation: timePulse 0.5s ease-in-out infinite;
    }

    @keyframes timePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .combo-display {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 52px;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.7), 0 0 60px rgba(255, 215, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      letter-spacing: 4px;
    }

    .combo-display.show {
      animation: comboPop 0.5s ease-out;
    }

    @keyframes comboPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(5deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    .combo-sub {
      font-size: 16px;
      color: rgba(255,255,255,0.9);
      text-align: center;
      margin-top: 8px;
      font-weight: 400;
      text-shadow: none;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .hole {
      aspect-ratio: 1;
      position: relative;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%);
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.4);
    }

    .hole::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 40%;
      background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%);
      border-radius: 50%;
    }

    .monster {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 75%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .monster.up {
      bottom: 10%;
    }

    .monster.hit {
      animation: hitAnim 0.3s ease-out;
    }

    @keyframes hitAnim {
      0% { transform: translateX(-50%) scale(1); }
      30% { transform: translateX(-50%) scale(1.3) rotate(10deg); }
      100% { transform: translateX(-50%) scale(0.5) rotate(-20deg); opacity: 0; }
    }

    .hit-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hit-effect.show {
      animation: hitEffectPop 0.4s ease-out;
    }

    @keyframes hitEffectPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
    }

    .rage-mode .hole {
      animation: rageGlow 0.3s ease-in-out infinite;
    }

    @keyframes rageGlow {
      0%, 100% { box-shadow: inset 0 8px 20px rgba(0,0,0,0.4), 0 0 10px rgba(255, 107, 107, 0.3); }
      50% { box-shadow: inset 0 8px 20px rgba(0,0,0,0.4), 0 0 20px rgba(255, 107, 107, 0.6); }
    }

    .monster-guide {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .guide-title {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .guide-items {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 8px;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .guide-emoji {
      font-size: 24px;
    }

    .guide-text {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
    }

    .guide-points {
      font-size: 10px;
      color: #FFD700;
    }

    .start-screen, .end-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }

    .start-screen.hidden, .end-screen.hidden {
      display: none;
    }

    .screen-title {
      font-size: 32px;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .screen-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 30px;
    }

    .screen-emoji {
      font-size: 70px;
      margin-bottom: 20px;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .start-btn, .restart-btn {
      padding: 16px 50px;
      background: linear-gradient(135deg, #6C63FF, #00D4FF);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.5);
      letter-spacing: 2px;
    }

    .start-btn:hover, .restart-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 30px rgba(108, 99, 255, 0.6);
    }

    .start-btn:active, .restart-btn:active {
      transform: scale(0.95);
    }

    .final-score {
      font-size: 60px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 10px 0;
    }

    .final-label {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 5px;
    }

    .final-stats {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .final-stat {
      text-align: center;
    }

    .final-stat-value {
      font-size: 24px;
      color: #fff;
      font-weight: 600;
    }

    .final-stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    .leaderboard {
      background: rgba(255,255,255,0.06);
      border-radius: 15px;
      padding: 16px;
      margin: 20px 0;
      width: 100%;
      max-width: 300px;
    }

    .leaderboard-title {
      text-align: center;
      color: #FFD700;
      font-size: 14px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .leaderboard-item:nth-child(2) { background: rgba(255, 215, 0, 0.15); }
    .leaderboard-item:nth-child(3) { background: rgba(192, 192, 192, 0.1); }
    .leaderboard-item:nth-child(4) { background: rgba(205, 127, 50, 0.1); }

    .leaderboard-rank {
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      width: 25px;
    }

    .leaderboard-score {
      color: #fff;
      font-weight: 600;
    }

    .leaderboard-date {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    .new-record {
      color: #FFD700;
      font-size: 14px;
      margin-top: 10px;
      animation: newRecordPulse 0.8s ease-in-out infinite;
    }

    @keyframes newRecordPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 26px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      z-index: 100;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(-50%) scale(1.05);
    }

    .screen-shake {
      animation: shake 0.2s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    @media (max-height: 700px) {
      .game-container {
        padding-top: 70px;
      }
      .monster {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>打地鼠情绪版</h1>
    <p>把烦恼小怪兽打回去！</p>
  </div>

  <div class="combo-display" id="comboDisplay">
    <div id="comboText">5 连击!</div>
    <div class="combo-sub" id="comboBonus">暴走模式开启！</div>
  </div>

  <div class="game-container">
    <div class="status-bar">
      <div class="status-card">
        <div class="status-value" id="scoreDisplay">0</div>
        <div class="status-label">得分</div>
      </div>
      <div class="status-card">
        <div class="status-value" id="comboCountDisplay">0</div>
        <div class="status-label">连击</div>
      </div>
      <div class="status-card">
        <div class="status-value" id="timeDisplay">30</div>
        <div class="status-label">剩余秒</div>
      </div>
    </div>

    <div class="time-bar-container">
      <div class="time-bar" id="timeBar"></div>
    </div>

    <div class="game-grid" id="gameGrid">
    </div>

    <div class="monster-guide">
      <div class="guide-title">烦恼怪兽图鉴</div>
      <div class="guide-items">
        <div class="guide-item">
          <span class="guide-emoji">📚</span>
          <span class="guide-text">作业怪</span>
          <span class="guide-points">+10分</span>
        </div>
        <div class="guide-item">
          <span class="guide-emoji">📝</span>
          <span class="guide-text">考试怪</span>
          <span class="guide-points">+15分</span>
        </div>
        <div class="guide-item">
          <span class="guide-emoji">👥</span>
          <span class="guide-text">社交怪</span>
          <span class="guide-points">+20分</span>
        </div>
        <div class="guide-item">
          <span class="guide-emoji">⏰</span>
          <span class="guide-text">早起怪</span>
          <span class="guide-points">+25分</span>
        </div>
      </div>
    </div>
  </div>

  <div class="start-screen" id="startScreen">
    <div class="screen-emoji">🔨</div>
    <div class="screen-title">准备开打！</div>
    <div class="screen-subtitle">30秒内打跑所有烦恼怪兽</div>
    <button class="start-btn" id="startBtn">开始游戏</button>
  </div>

  <div class="end-screen hidden" id="endScreen">
    <div class="screen-emoji" id="endEmoji">🎉</div>
    <div class="final-label">最终得分</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="new-record hidden" id="newRecord">🏆 新纪录！</div>
    <div class="final-stats">
      <div class="final-stat">
        <div class="final-stat-value" id="finalHits">0</div>
        <div class="final-stat-label">击中数</div>
      </div>
      <div class="final-stat">
        <div class="final-stat-value" id="finalMaxCombo">0</div>
        <div class="final-stat-label">最高连击</div>
      </div>
      <div class="final-stat">
        <div class="final-stat-value" id="finalAccuracy">0%</div>
        <div class="final-stat-label">命中率</div>
      </div>
    </div>
    <div class="leaderboard" id="leaderboard">
      <div class="leaderboard-title">🏆 排行榜 TOP 5</div>
      <div id="leaderboardList"></div>
    </div>
    <button class="restart-btn" id="restartBtn">再玩一次</button>
  </div>

  <button class="back-btn" onclick="location.href='game-hub.html'">返回游戏长廊</button>

  <script>
    const MONSTERS = [
      { emoji: '📚', name: '作业怪', points: 10, speed: 1.0, weight: 4 },
      { emoji: '📝', name: '考试怪', points: 15, speed: 1.1, weight: 3 },
      { emoji: '👥', name: '社交怪', points: 20, speed: 1.2, weight: 2 },
      { emoji: '⏰', name: '早起怪', points: 25, speed: 1.4, weight: 1 },
    ];

    const HOLE_COUNT = 9;
    const GAME_DURATION = 30;

    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let timeLeft = GAME_DURATION;
    let hits = 0;
    let misses = 0;
    let isPlaying = false;
    let isRageMode = false;
    let rageModeTimer = null;
    let gameLoop = null;
    let spawnTimer = null;
    let timeLoop = null;

    const holes = [];
    const gameGrid = document.getElementById('gameGrid');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboCountDisplay = document.getElementById('comboCountDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const timeBar = document.getElementById('timeBar');
    const comboDisplay = document.getElementById('comboDisplay');
    const comboText = document.getElementById('comboText');
    const comboBonus = document.getElementById('comboBonus');
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScore = document.getElementById('finalScore');
    const finalHits = document.getElementById('finalHits');
    const finalMaxCombo = document.getElementById('finalMaxCombo');
    const finalAccuracy = document.getElementById('finalAccuracy');
    const newRecord = document.getElementById('newRecord');
    const leaderboardList = document.getElementById('leaderboardList');
    const endEmoji = document.getElementById('endEmoji');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playHitSound(comboLevel = 0) {
      if (!audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'square';
      const baseFreq = 400 + comboLevel * 100;
      oscillator.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);

      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.1);
    }

    function playMissSound() {
      if (!audioCtx) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);

      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.15);
    }

    function playComboSound(level) {
      if (!audioCtx) return;

      const notes = level >= 5 
        ? [523.25, 659.25, 783.99, 1046.50, 1318.51]
        : [523.25, 659.25, 783.99];

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);

        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + i * 0.08);
        osc.stop(audioCtx.currentTime + i * 0.08 + 0.2);
      });
    }

    function getRandomMonster() {
      const totalWeight = MONSTERS.reduce((sum, m) => sum + m.weight, 0);
      let rand = Math.random() * totalWeight;
      for (const monster of MONSTERS) {
        rand -= monster.weight;
        if (rand <= 0) return monster;
      }
      return MONSTERS[0];
    }

    function createHoles() {
      gameGrid.innerHTML = '';
      holes.length = 0;

      for (let i = 0; i < HOLE_COUNT; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;

        const monster = document.createElement('div');
        monster.className = 'monster';
        hole.appendChild(monster);

        const hitEffect = document.createElement('div');
        hitEffect.className = 'hit-effect';
        hitEffect.textContent = '💥';
        hole.appendChild(hitEffect);

        hole.addEventListener('click', () => handleHoleClick(i));
        hole.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleHoleClick(i);
        }, { passive: false });

        gameGrid.appendChild(hole);
        holes.push({
          element: hole,
          monster: monster,
          hitEffect: hitEffect,
          active: false,
          monsterType: null,
          timeout: null
        });
      }
    }

    function spawnMonster() {
      if (!isPlaying) return;

      const availableHoles = holes.filter(h => !h.active);
      if (availableHoles.length === 0) return;

      const hole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      const monsterType = getRandomMonster();

      hole.active = true;
      hole.monsterType = monsterType;
      hole.monster.textContent = monsterType.emoji;
      hole.monster.classList.remove('hit');
      hole.monster.classList.add('up');

      const baseStayTime = 1200 / monsterType.speed;
      const stayTime = isRageMode 
        ? baseStayTime * 0.6 
        : baseStayTime * (0.8 + Math.random() * 0.4);

      hole.timeout = setTimeout(() => {
        if (hole.active) {
          hideMonster(hole);
          combo = 0;
          updateUI();
        }
      }, stayTime);
    }

    function hideMonster(hole) {
      hole.active = false;
      hole.monster.classList.remove('up');
      if (hole.timeout) {
        clearTimeout(hole.timeout);
        hole.timeout = null;
      }
    }

    function handleHoleClick(index) {
      initAudio();
      if (!isPlaying) return;

      const hole = holes[index];

      if (hole.active && hole.monsterType) {
        hits++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;

        const comboMultiplier = isRageMode ? 2 : (combo >= 10 ? 2 : combo >= 5 ? 1.5 : 1);
        const points = Math.floor(hole.monsterType.points * comboMultiplier);
        score += points;

        hole.monster.classList.add('hit');
        hole.hitEffect.classList.remove('show');
        void hole.hitEffect.offsetWidth;
        hole.hitEffect.classList.add('show');

        playHitSound(Math.min(combo, 5));

        if (combo === 3 || combo === 5 || combo === 10) {
          showComboEffect(combo);
          playComboSound(combo);
        }

        if (combo >= 5 && !isRageMode) {
          activateRageMode();
        }

        document.querySelector('.game-container').classList.add('screen-shake');
        setTimeout(() => {
          document.querySelector('.game-container').classList.remove('screen-shake');
        }, 200);

        setTimeout(() => hideMonster(hole), 200);
      } else {
        misses++;
        if (combo > 0) {
          combo = 0;
          if (isRageMode) {
            deactivateRageMode();
          }
        }
        playMissSound();
      }

      updateUI();
    }

    function showComboEffect(comboNum) {
      let text = '';
      let bonus = '';

      if (comboNum >= 10) {
        text = '🔥 10 连击!';
        bonus = '双倍得分！';
      } else if (comboNum >= 5) {
        text = '💥 5 连击!';
        bonus = '暴走模式开启！';
      } else if (comboNum >= 3) {
        text = '✨ 3 连击!';
        bonus = '继续保持！';
      }

      comboText.textContent = text;
      comboBonus.textContent = bonus;
      comboDisplay.classList.remove('show');
      void comboDisplay.offsetWidth;
      comboDisplay.classList.add('show');
    }

    function activateRageMode() {
      isRageMode = true;
      gameGrid.classList.add('rage-mode');

      if (rageModeTimer) clearTimeout(rageModeTimer);
      rageModeTimer = setTimeout(() => {
        deactivateRageMode();
      }, 5000);
    }

    function deactivateRageMode() {
      isRageMode = false;
      gameGrid.classList.remove('rage-mode');
      if (rageModeTimer) {
        clearTimeout(rageModeTimer);
        rageModeTimer = null;
      }
    }

    function updateUI() {
      scoreDisplay.textContent = score;
      scoreDisplay.classList.remove('bump');
      void scoreDisplay.offsetWidth;
      scoreDisplay.classList.add('bump');

      comboCountDisplay.textContent = combo;
      timeDisplay.textContent = Math.ceil(timeLeft);

      const percent = (timeLeft / GAME_DURATION) * 100;
      timeBar.style.width = percent + '%';

      if (timeLeft <= 10) {
        timeBar.classList.add('warning');
      } else {
        timeBar.classList.remove('warning');
      }
    }

    function startGame() {
      score = 0;
      combo = 0;
      maxCombo = 0;
      timeLeft = GAME_DURATION;
      hits = 0;
      misses = 0;
      isPlaying = true;
      isRageMode = false;

      startScreen.classList.add('hidden');
      endScreen.classList.add('hidden');

      holes.forEach(h => hideMonster(h));
      gameGrid.classList.remove('rage-mode');

      updateUI();

      timeLoop = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          endGame();
          return;
        }
        updateUI();
      }, 100);

      function scheduleNextSpawn() {
        if (!isPlaying) return;

        const baseInterval = isRageMode ? 400 : 800;
        const interval = baseInterval * (0.6 + Math.random() * 0.8);
        const minInterval = Math.max(200, interval - timeLeft * 10);

        spawnMonster();

        spawnTimer = setTimeout(scheduleNextSpawn, minInterval);
      }

      scheduleNextSpawn();
    }

    function endGame() {
      isPlaying = false;

      clearInterval(timeLoop);
      clearTimeout(spawnTimer);
      deactivateRageMode();

      holes.forEach(h => hideMonster(h));

      const totalClicks = hits + misses;
      const accuracy = totalClicks > 0 ? Math.round((hits / totalClicks) * 100) : 0;

      finalScore.textContent = score;
      finalHits.textContent = hits;
      finalMaxCombo.textContent = maxCombo;
      finalAccuracy.textContent = accuracy + '%';

      if (score >= 500) {
        endEmoji.textContent = '🏆';
      } else if (score >= 300) {
        endEmoji.textContent = '🎉';
      } else if (score >= 100) {
        endEmoji.textContent = '😊';
      } else {
        endEmoji.textContent = '💪';
      }

      const isNewRecord = saveScore(score);
      if (isNewRecord) {
        newRecord.classList.remove('hidden');
      } else {
        newRecord.classList.add('hidden');
      }

      displayLeaderboard();

      endScreen.classList.remove('hidden');
    }

    function getLeaderboard() {
      try {
        const data = localStorage.getItem('whack_leaderboard');
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveScore(score) {
      const leaderboard = getLeaderboard();
      const date = new Date().toLocaleDateString('zh-CN');
      leaderboard.push({ score, date });
      leaderboard.sort((a, b) => b.score - a.score);
      const top5 = leaderboard.slice(0, 5);

      try {
        localStorage.setItem('whack_leaderboard', JSON.stringify(top5));
      } catch (e) {}

      return top5[0].score === score && leaderboard.filter(l => l.score === score).length === 1;
    }

    function displayLeaderboard() {
      const leaderboard = getLeaderboard();
      if (leaderboard.length === 0) {
        leaderboardList.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:12px;padding:10px;">暂无记录</div>';
        return;
      }

      const medals = ['🥇', '🥈', '🥉', '4.', '5.'];
      leaderboardList.innerHTML = leaderboard.map((item, i) => `
        <div class="leaderboard-item">
          <span class="leaderboard-rank">${medals[i] || (i + 1) + '.'}</span>
          <span class="leaderboard-score">${item.score} 分</span>
          <span class="leaderboard-date">${item.date}</span>
        </div>
      `).join('');
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });

    document.addEventListener('click', initAudio, { once: true });

    createHoles();
    displayLeaderboard();
  </script>
</body>
</html>
