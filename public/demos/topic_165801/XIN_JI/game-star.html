<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消灭星星 - 情绪版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 10% 90%, rgba(255, 0, 100, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(0, 200, 255, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 200, 0, 0.15) 0%, transparent 50%);
  animation: bgShift 10s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes bgShift {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.15) rotate(8deg); }
}
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 25px;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  z-index: 100;
  transition: all 0.3s;
  cursor: pointer;
}
.back-btn:hover {
  background: rgba(255, 0, 255, 0.3);
  border-color: #ff00ff;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
  transform: translateX(-5px);
}
.game-container {
  z-index: 1;
  text-align: center;
}
h1 {
  color: #fff;
  font-size: 2rem;
  margin-bottom: 15px;
  text-shadow: 
    0 0 10px #ff6600,
    0 0 20px #ff6600,
    0 0 40px #ff00ff;
  animation: titlePulse 2s ease-in-out infinite alternate;
}
@keyframes titlePulse {
  0% { text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600; }
  100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
}
.info-panel {
  display: flex;
  justify-content: space-around;
  gap: 20px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.info-box {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 10px 20px;
  color: #fff;
  min-width: 100px;
}
.info-box .label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 5px;
}
.info-box .value {
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 10px currentColor;
}
#game-board {
  display: grid;
  gap: 4px;
  padding: 15px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 20px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 
    0 0 30px rgba(255, 0, 255, 0.2),
    inset 0 0 30px rgba(0, 0, 0, 0.3);
}
.star {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: all 0.2s ease;
  position: relative;
  user-select: none;
}
.star:hover {
  transform: scale(1.15);
  z-index: 10;
}
.star.selected {
  transform: scale(1.2);
  animation: selectedPulse 0.5s ease-in-out infinite alternate;
}
@keyframes selectedPulse {
  0% { filter: brightness(1.2); }
  100% { filter: brightness(1.5); }
}
.star.happy { background: radial-gradient(circle at 30% 30%, #ffeb3b, #ff9800); box-shadow: 0 0 15px #ff9800; }
.star.love { background: radial-gradient(circle at 30% 30%, #ff80ab, #e91e63); box-shadow: 0 0 15px #e91e63; }
.star.cool { background: radial-gradient(circle at 30% 30%, #80d8ff, #2196f3); box-shadow: 0 0 15px #2196f3; }
.star.laugh { background: radial-gradient(circle at 30% 30%, #b9f6ca, #4caf50); box-shadow: 0 0 15px #4caf50; }
.star.cry { background: radial-gradient(circle at 30% 30%, #d1c4e9, #9c27b0); box-shadow: 0 0 15px #9c27b0; }
.star.bomb { background: radial-gradient(circle at 30% 30%, #fff, #333); box-shadow: 0 0 20px #ff0000; animation: bombPulse 0.8s ease-in-out infinite; }
@keyframes bombPulse {
  0%, 100% { box-shadow: 0 0 20px #ff0000; }
  50% { box-shadow: 0 0 35px #ff6600, 0 0 50px #ff0000; }
}
.star.rainbow { 
  background: conic-gradient(#ff0000, #ff9900, #ffff00, #00ff00, #0099ff, #9900ff, #ff0000);
  box-shadow: 0 0 20px #fff;
  animation: rainbowSpin 2s linear infinite;
}
@keyframes rainbowSpin {
  100% { filter: hue-rotate(360deg); }
}
.star.popping {
  animation: pop 0.4s ease-out forwards;
}
@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}
.star.falling {
  animation: fall 0.3s ease-in forwards;
}
@keyframes fall {
  from { transform: translateY(-50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 1000;
}
.shake {
  animation: shake 0.3s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-8px, 4px); }
  50% { transform: translate(8px, -4px); }
  75% { transform: translate(-4px, 8px); }
}
.combo-text {
  position: fixed;
  font-size: 48px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
  pointer-events: none;
  z-index: 2000;
  animation: comboAnim 1s ease-out forwards;
}
@keyframes comboAnim {
  0% { transform: scale(0.5) translateY(0); opacity: 1; }
  50% { transform: scale(1.5) translateY(-30px); opacity: 1; }
  100% { transform: scale(1) translateY(-60px); opacity: 0; }
}
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  backdrop-filter: blur(5px);
}
.modal-content {
  background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 30px;
  padding: 40px;
  text-align: center;
  color: #fff;
  max-width: 90%;
}
.modal-content h2 {
  font-size: 2rem;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff00ff;
}
.modal-content p {
  font-size: 1.2rem;
  margin-bottom: 15px;
}
.modal-content button {
  padding: 15px 40px;
  font-size: 1.2rem;
  background: linear-gradient(135deg, #ff00ff, #00ffff);
  border: none;
  border-radius: 30px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: all 0.3s;
  box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
}
.modal-content button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
}
.hint {
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  margin-top: 15px;
}
.level-complete {
  animation: levelComplete 0.5s ease-out;
}
@keyframes levelComplete {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<a href="game-hub.html" class="back-btn">← 返回长廊</a>
<div class="game-container">
  <h1>⭐ 消灭星星 情绪版 ⭐</h1>
  <div class="info-panel">
    <div class="info-box">
      <div class="label">关卡</div>
      <div class="value" id="level-display" style="color: #ffeb3b;">1</div>
    </div>
    <div class="info-box">
      <div class="label">得分</div>
      <div class="value" id="score-display" style="color: #00ffff;">0</div>
    </div>
    <div class="info-box">
      <div class="label">目标</div>
      <div class="value" id="target-display" style="color: #ff80ab;">1000</div>
    </div>
    <div class="info-box">
      <div class="label">最高分</div>
      <div class="value" id="highscore-display" style="color: #b9f6ca;">0</div>
    </div>
  </div>
  <div id="game-board"></div>
  <div class="hint">点击相邻同色星星一起消除，消除越多得分越高！</div>
</div>

<script>
const COLS = 10;
const ROWS = 12;
const EMOTIONS = ['happy', 'love', 'cool', 'laugh', 'cry'];
const EMOJIS = {
  happy: '😊',
  love: '😍',
  cool: '😎',
  laugh: '🤣',
  cry: '😭',
  bomb: '💣',
  rainbow: '🌈'
};

let board = [];
let score = 0;
let level = 1;
let targetScore = 1000;
let highScore = parseInt(localStorage.getItem('starHighScore')) || 0;
let selectedGroup = [];
let isAnimating = false;

const gameBoard = document.getElementById('game-board');
const scoreDisplay = document.getElementById('score-display');
const levelDisplay = document.getElementById('level-display');
const targetDisplay = document.getElementById('target-display');
const highscoreDisplay = document.getElementById('highscore-display');

highscoreDisplay.textContent = highScore;

function initBoard() {
  board = [];
  for (let row = 0; row < ROWS; row++) {
    board[row] = [];
    for (let col = 0; col < COLS; col++) {
      board[row][col] = getRandomStar();
    }
  }
  renderBoard();
}

function getRandomStar() {
  const rand = Math.random();
  if (rand < 0.02 && level >= 3) return 'bomb';
  if (rand < 0.04 && level >= 5) return 'rainbow';
  const numColors = Math.min(3 + Math.floor(level / 3), 5);
  return EMOTIONS[Math.floor(Math.random() * numColors)];
}

function renderBoard() {
  gameBoard.innerHTML = '';
  gameBoard.style.gridTemplateColumns = `repeat(${COLS}, 40px)`;
  gameBoard.style.gridTemplateRows = `repeat(${ROWS}, 40px)`;
  
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const star = document.createElement('div');
      star.className = `star ${board[row][col]}`;
      star.textContent = EMOJIS[board[row][col]] || '';
      star.dataset.row = row;
      star.dataset.col = col;
      star.addEventListener('click', () => handleClick(row, col));
      star.addEventListener('mouseenter', () => highlightGroup(row, col));
      gameBoard.appendChild(star);
    }
  }
}

function findGroup(row, col, targetType, visited = new Set()) {
  const key = `${row},${col}`;
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return [];
  if (visited.has(key)) return [];
  if (!board[row][col]) return [];
  
  const isRainbow = board[row][col] === 'rainbow';
  const targetIsRainbow = targetType === 'rainbow';
  
  if (!isRainbow && !targetIsRainbow && board[row][col] !== targetType) {
    return [];
  }
  
  visited.add(key);
  let group = [{row, col}];
  
  const neighbors = [
    [row - 1, col], [row + 1, col],
    [row, col - 1], [row, col + 1]
  ];
  
  for (const [nr, nc] of neighbors) {
    group = group.concat(findGroup(nr, nc, targetType, visited));
  }
  
  return group;
}

function highlightGroup(row, col) {
  if (isAnimating || !board[row][col]) return;
  
  document.querySelectorAll('.star.selected').forEach(s => s.classList.remove('selected'));
  
  const group = findGroup(row, col, board[row][col]);
  if (group.length >= 2) {
    group.forEach(({row: r, col: c}) => {
      const idx = r * COLS + c;
      gameBoard.children[idx].classList.add('selected');
    });
  }
}

function handleClick(row, col) {
  if (isAnimating || !board[row][col]) return;
  
  const group = findGroup(row, col, board[row][col]);
  
  if (group.length < 2 && board[row][col] !== 'bomb') return;
  
  isAnimating = true;
  
  const hasBomb = group.some(({row: r, col: c}) => board[r][c] === 'bomb');
  const hasRainbow = group.some(({row: r, col: c}) => board[r][c] === 'rainbow');
  
  let finalGroup = [...group];
  
  if (hasBomb) {
    const bombCell = group.find(({row: r, col: c}) => board[r][c] === 'bomb');
    for (let dr = -2; dr <= 2; dr++) {
      for (let dc = -2; dc <= 2; dc++) {
        const nr = bombCell.row + dr;
        const nc = bombCell.col + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc]) {
          if (!finalGroup.some(c => c.row === nr && c.col === nc)) {
            finalGroup.push({row: nr, col: nc});
          }
        }
      }
    }
    screenShake();
  }
  
  if (hasRainbow) {
    const rainbowCell = group.find(({row: r, col: c}) => board[r][c] === 'rainbow');
    const allColorCells = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] && EMOTIONS.includes(board[r][c])) {
          allColorCells.push({row: r, col: c});
        }
      }
    }
    const mostCommon = findMostCommonColor(allColorCells);
    const rainbowGroup = findGroup(rainbowCell.row, rainbowCell.col, mostCommon);
    rainbowGroup.forEach(cell => {
      if (!finalGroup.some(c => c.row === cell.row && c.col === cell.col)) {
        finalGroup.push(cell);
      }
    });
  }
  
  const points = calculateScore(finalGroup.length);
  score += points;
  scoreDisplay.textContent = score;
  
  if (finalGroup.length >= 5) {
    showComboText(finalGroup.length, row, col);
    if (finalGroup.length >= 8) {
      screenShake();
    }
  }
  
  createParticles(finalGroup);
  
  finalGroup.forEach(({row: r, col: c}) => {
    const idx = r * COLS + c;
    if (gameBoard.children[idx]) {
      gameBoard.children[idx].classList.add('popping');
    }
  });
  
  setTimeout(() => {
    finalGroup.forEach(({row: r, col: c}) => {
      board[r][c] = null;
    });
    
    applyGravity();
    shiftColumns();
    fillBoard();
    renderBoard();
    
    isAnimating = false;
    
    checkLevelComplete();
    checkGameOver();
  }, 400);
}

function findMostCommonColor(cells) {
  const counts = {};
  cells.forEach(({row, col}) => {
    const color = board[row][col];
    if (EMOTIONS.includes(color)) {
      counts[color] = (counts[color] || 0) + 1;
    }
  });
  let max = 0;
  let mostCommon = EMOTIONS[0];
  for (const color in counts) {
    if (counts[color] > max) {
      max = counts[color];
      mostCommon = color;
    }
  }
  return mostCommon;
}

function calculateScore(count) {
  if (count <= 1) return 0;
  return count * count * 5;
}

function applyGravity() {
  for (let col = 0; col < COLS; col++) {
    let writePos = ROWS - 1;
    for (let row = ROWS - 1; row >= 0; row--) {
      if (board[row][col]) {
        if (row !== writePos) {
          board[writePos][col] = board[row][col];
          board[row][col] = null;
        }
        writePos--;
      }
    }
  }
}

function shiftColumns() {
  let writeCol = 0;
  for (let col = 0; col < COLS; col++) {
    let hasStars = false;
    for (let row = 0; row < ROWS; row++) {
      if (board[row][col]) {
        hasStars = true;
        break;
      }
    }
    if (hasStars) {
      if (col !== writeCol) {
        for (let row = 0; row < ROWS; row++) {
          board[row][writeCol] = board[row][col];
          board[row][col] = null;
        }
      }
      writeCol++;
    }
  }
}

function fillBoard() {
  for (let col = 0; col < COLS; col++) {
    for (let row = 0; row < ROWS; row++) {
      if (!board[row][col]) {
        board[row][col] = getRandomStar();
      }
    }
  }
}

function createParticles(group) {
  const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff6600', '#00ff66', '#ff0066'];
  group.forEach(({row, col}) => {
    const idx = row * COLS + col;
    const starEl = gameBoard.children[idx];
    if (!starEl) return;
    const rect = starEl.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    
    for (let i = 0; i < 8; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = 6 + Math.random() * 10;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      document.body.appendChild(particle);
      
      const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
      const speed = 50 + Math.random() * 100;
      const dx = Math.cos(angle) * speed;
      const dy = Math.sin(angle) * speed;
      
      particle.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
      ], {
        duration: 600 + Math.random() * 400,
        easing: 'ease-out'
      }).onfinish = () => particle.remove();
    }
  });
}

function showComboText(count, row, col) {
  const idx = row * COLS + col;
  const starEl = gameBoard.children[idx];
  if (!starEl) return;
  const rect = starEl.getBoundingClientRect();
  
  const combo = document.createElement('div');
  combo.className = 'combo-text';
  combo.textContent = `${count}连消！`;
  combo.style.left = rect.left + 'px';
  combo.style.top = rect.top + 'px';
  document.body.appendChild(combo);
  
  setTimeout(() => combo.remove(), 1000);
}

function screenShake() {
  gameBoard.classList.add('shake');
  setTimeout(() => gameBoard.classList.remove('shake'), 300);
}

function checkLevelComplete() {
  if (score >= targetScore) {
    showLevelComplete();
  }
}

function showLevelComplete() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content level-complete">
      <h2>🎉 第 ${level} 关通过！🎉</h2>
      <p>当前得分：<span style="color: #00ffff; font-size: 2rem; font-weight: bold;">${score}</span></p>
      <p>准备挑战第 ${level + 1} 关！</p>
      <button onclick="nextLevel()">下一关 →</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.nextLevel = function() {
  level++;
  targetScore = 1000 + (level - 1) * 800;
  levelDisplay.textContent = level;
  targetDisplay.textContent = targetScore;
  document.querySelector('.modal').remove();
  initBoard();
};

function checkGameOver() {
  let hasMove = false;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (board[row][col]) {
        const group = findGroup(row, col, board[row][col]);
        if (group.length >= 2 || board[row][col] === 'bomb') {
          hasMove = true;
          break;
        }
      }
    }
    if (hasMove) break;
  }
  
  if (!hasMove && score < targetScore) {
    showGameOver();
  }
}

function showGameOver() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('starHighScore', highScore);
    highscoreDisplay.textContent = highScore;
  }
  
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h2>💫 游戏结束 💫</h2>
      <p>最终得分：<span style="color: #ffeb3b; font-size: 2rem; font-weight: bold;">${score}</span></p>
      <p>到达关卡：第 ${level} 关</p>
      <p>最高分：${highScore}</p>
      <button onclick="restartGame()">再玩一次</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.restartGame = function() {
  score = 0;
  level = 1;
  targetScore = 1000;
  scoreDisplay.textContent = score;
  levelDisplay.textContent = level;
  targetDisplay.textContent = targetScore;
  document.querySelector('.modal').remove();
  initBoard();
};

initBoard();
</script>
</body>
</html>
