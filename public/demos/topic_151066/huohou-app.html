<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火候 — 记录每一次试做，看见厨艺真的在涨</title>
<style>
/* ========== Reset & Variables ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fdf6f0;
  --bg-warm: #f9efe4;
  --card: #ffffff;
  --ink: #3c2415;
  --ink-soft: #6b4e3a;
  --muted: #9a8270;
  --muted-light: #c4b5a4;
  --rule: #ede0d3;
  --accent: #e07b4c;
  --accent-light: #f09a6a;
  --accent-dark: #c5633a;
  --accent-bg: #fce8dc;
  --success: #7d9d6c;
  --success-bg: #e8f0e0;
  --fail: #d9706a;
  --fail-bg: #f8e4e2;
  --pending: #d4a544;
  --pending-bg: #faf0d9;
  --untried: #9a8270;
  --untried-bg: #efe8e0;
  --shadow: 0 2px 12px rgba(60, 36, 21, 0.06);
  --shadow-hover: 0 6px 24px rgba(60, 36, 21, 0.12);
  --radius: 12px;
  --radius-sm: 8px;
}

html { font-size: 15px; }

body {
  font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: 
    radial-gradient(ellipse at 20% 0%, rgba(224,123,76,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(224,123,76,0.03) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

.serif { font-family: 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', serif; }

/* ========== Layout ========== */
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
  position: relative;
  z-index: 1;
}

/* ========== Header ========== */
.header {
  text-align: center;
  margin-bottom: 2rem;
  position: relative;
}
.header-flame {
  display: inline-block;
  width: 28px; height: 28px;
  vertical-align: middle;
  margin-right: 0.5rem;
}
.header h1 {
  font-family: 'STSong', 'Songti SC', 'Noto Serif SC', serif;
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--ink);
  display: inline-block;
  vertical-align: middle;
}
.header-tagline {
  font-size: 0.9rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-top: 0.3rem;
}
.header-seal {
  position: absolute;
  top: 0; right: 0;
  width: 40px; height: 40px;
  background: #c44a3a;
  color: #fdf6f0;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'STSong', serif; font-size: 1rem; font-weight: 700;
  transform: rotate(-6deg);
  box-shadow: 0 3px 10px rgba(196,74,58,0.25);
}

/* ========== Stats Bar ========== */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.25rem 1rem;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s;
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
}
.stat-card:nth-child(1)::before { background: var(--accent); }
.stat-card:nth-child(2)::before { background: var(--success); }
.stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--success), var(--accent)); }
.stat-card:nth-child(4)::before { background: var(--fail); }

.stat-num {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 2rem;
  font-weight: 900;
  line-height: 1.2;
}
.stat-card:nth-child(1) .stat-num { color: var(--accent); }
.stat-card:nth-child(2) .stat-num { color: var(--success); }
.stat-card:nth-child(3) .stat-num { color: var(--accent-dark); }
.stat-card:nth-child(4) .stat-num { color: var(--fail); }

.stat-label {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 0.25rem;
  letter-spacing: 0.05em;
}

/* ========== Main Layout ========== */
.main {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1.5rem;
  margin-bottom: 2rem;
}

/* ========== Recipe List ========== */
.list-section {
  background: transparent;
}
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.list-title {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--ink);
}
.list-title .count {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 400;
  margin-left: 0.3rem;
}

.filters {
  display: flex;
  gap: 0.15rem;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 1rem;
}
.filter-btn {
  padding: 0.5rem 0.9rem;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  font-size: 0.85rem;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-bottom: -1px;
}
.filter-btn:hover { color: var(--accent); }
.filter-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.filter-count {
  font-size: 0.75rem;
  color: var(--muted-light);
  margin-left: 0.15rem;
  font-weight: 400;
}
.filter-btn.active .filter-count { color: var(--accent-light); }

.recipe-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  max-height: 600px;
  overflow-y: auto;
  padding-right: 4px;
}

.recipe-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--rule);
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: default;
  position: relative;
}
.recipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

.recipe-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}
.recipe-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  font-family: 'STSong', 'Songti SC', serif;
}
.recipe-date {
  font-size: 0.75rem;
  color: var(--muted-light);
  white-space: nowrap;
}

.recipe-meta {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 0.5rem;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 0.15rem 0.6rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.tag.category { background: var(--bg-warm); color: var(--ink-soft); }
.tag.source { background: var(--accent-bg); color: var(--accent-dark); }

.tag.source-link {
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.tag.source-link:hover {
  background: var(--accent);
  color: #fff;
}
.tag.source-link .link-icon {
  margin-left: 0.2rem;
  font-size: 0.7rem;
  opacity: 0.8;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.2rem 0.7rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  border: 1px dashed transparent;
}
.status-badge:hover { opacity: 0.8; border-color: currentColor; }
.status-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status-badge.untried { background: var(--untried-bg); color: var(--untried); }
.status-badge.success { background: var(--success-bg); color: var(--success); }
.status-badge.fail { background: var(--fail-bg); color: var(--fail); }
.status-badge.pending { background: var(--pending-bg); color: var(--pending); }

.recipe-notes {
  font-size: 0.85rem;
  color: var(--ink-soft);
  background: var(--bg-warm);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.75rem;
  margin-top: 0.5rem;
  border-left: 3px solid var(--accent-light);
  line-height: 1.6;
  font-style: italic;
}
.recipe-notes .notes-label {
  font-style: normal;
  font-weight: 600;
  color: var(--accent);
  font-size: 0.75rem;
  margin-right: 0.3rem;
}

.recipe-card-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--rule);
}
.card-btn {
  font-size: 0.78rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.card-btn:hover { border-color: var(--accent); color: var(--accent); }
.card-btn.danger:hover { border-color: var(--fail); color: var(--fail); }

/* Icon buttons */
.icon-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--muted-light);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.95rem;
  font-family: inherit;
  line-height: 1;
}
.icon-btn:hover { background: var(--bg-warm); color: var(--accent); }
.icon-btn.danger:hover { background: var(--fail-bg); color: var(--fail); }
.icon-btn svg { width: 15px; height: 15px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3.5rem 1.5rem;
  color: var(--muted);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
.empty-state .empty-title {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.15rem;
  color: var(--ink-soft);
  margin-bottom: 0.5rem;
}
.empty-state .empty-desc {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.7;
  max-width: 320px;
  margin: 0 auto;
}

/* ========== Form Section ========== */
.form-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--rule);
  height: fit-content;
  position: sticky;
  top: 1rem;
}
.form-title {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--rule);
}

.form-group { margin-bottom: 0.85rem; }
.form-label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 0.3rem;
  letter-spacing: 0.03em;
}
.form-label .req { color: var(--accent); }

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  color: var(--ink);
  background: var(--bg);
  transition: border-color 0.2s, background 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--card);
}
.form-textarea {
  resize: vertical;
  min-height: 70px;
  line-height: 1.6;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

.form-submit {
  width: 100%;
  padding: 0.7rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.05em;
  margin-top: 0.25rem;
}
.form-submit:hover { background: var(--accent-dark); }
.form-submit:active { transform: scale(0.98); }

/* ========== Quote Section ========== */
.quote-section {
  text-align: center;
  padding: 1.5rem;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.quote-section::before {
  content: '';
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 3px;
  background: var(--accent);
  border-radius: 2px;
}
.quote-text {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.05rem;
  color: var(--ink-soft);
  line-height: 1.8;
  font-style: italic;
}
.quote-author {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 0.5rem;
}
.quote-refresh {
  display: inline-block;
  margin-left: 0.5rem;
  font-size: 0.75rem;
  color: var(--accent);
  cursor: pointer;
  transition: opacity 0.2s;
  user-select: none;
}
.quote-refresh:hover { opacity: 0.7; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: #fff;
  padding: 0.6rem 1.5rem;
  border-radius: 24px;
  font-size: 0.85rem;
  box-shadow: 0 6px 20px rgba(60,36,21,0.2);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(60,36,21,0.35);
  display: none;
  align-items: center; justify-content: center;
  z-index: 999;
  backdrop-filter: blur(3px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem;
  width: 90%; max-width: 480px;
  box-shadow: 0 12px 40px rgba(60,36,21,0.2);
}
.modal-title {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--ink);
}

/* Delete confirm modal */
.delete-modal-body {
  text-align: center;
  padding: 0.5rem 0;
}
.delete-modal-icon {
  font-size: 2rem;
  margin-bottom: 0.5rem;
}
.delete-modal-msg {
  font-size: 0.95rem;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 0.5rem;
}
.delete-modal-sub {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 1.25rem;
}
.delete-modal-actions {
  display: flex;
  gap: 0.75rem;
}
.delete-modal-actions button {
  flex: 1;
  padding: 0.6rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-cancel { background: var(--bg-warm); color: var(--muted); }
.btn-cancel:hover { background: var(--rule); }
.btn-confirm { background: var(--fail); color: #fff; }
.btn-confirm:hover { background: #c45f5a; }

/* ========== Attempt Count ========== */
.attempt-count {
  margin-left: auto;
  font-size: 0.75rem;
  color: var(--muted-light);
  font-style: italic;
}

/* ========== Inline Notes Editor ========== */
.notes-inline-editor {
  margin-top: 0.5rem;
  padding: 0.75rem;
  background: var(--accent-bg);
  border-radius: var(--radius-sm);
  border: 1px dashed var(--accent-light);
}
.notes-inline-textarea {
  width: 100%;
  padding: 0.5rem 0.65rem;
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--ink);
  background: var(--card);
  resize: vertical;
  min-height: 60px;
  line-height: 1.6;
  transition: border-color 0.2s;
}
.notes-inline-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.notes-inline-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.notes-inline-actions .card-btn {
  background: var(--card);
}
.notes-inline-actions .card-btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.notes-inline-actions .card-btn.primary:hover {
  background: var(--accent-dark);
  color: #fff;
}

/* ========== Timeline Section ========== */
.timeline-section {
  margin-bottom: 2rem;
}
.timeline-title {
  font-family: 'STSong', 'Songti SC', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.timeline-title::before {
  content: '';
  width: 3px; height: 1rem;
  background: var(--accent);
  border-radius: 2px;
}
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.timeline-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.6rem 1rem;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  border: 1px solid var(--rule);
  transition: transform 0.2s, box-shadow 0.2s;
}
.timeline-item:hover { transform: translateX(3px); box-shadow: var(--shadow-hover); }
.timeline-date {
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
  padding-top: 0.1rem;
  min-width: 3.5rem;
}
.timeline-icon {
  font-size: 0.95rem;
  padding-top: 0.1rem;
}
.timeline-content { flex: 1; min-width: 0; }
.timeline-dish {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
}
.timeline-notes {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 0.1rem;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .app { padding: 1.5rem 1rem 2rem; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .main {
    grid-template-columns: 1fr;
    display: flex;
    flex-direction: column;
  }
  .form-section { position: static; order: 1; }
  .list-section { order: 2; }
  .header-seal { display: none; }
  .recipe-list { max-height: 500px; }
}
@media (max-width: 480px) {
  .stats { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
  .stat-num { font-size: 1.6rem; }
  .header h1 { font-size: 1.8rem; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-seal serif">火</div>
    <h1>
      <svg class="header-flame" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C12 2 8 6 8 11C8 14 10 16 12 16C14 16 16 14 16 11C16 8 14 7 14 7C14 9 13 10 12 10C11 10 10 9 10 8C10 6 12 5 12 2Z" fill="#e07b4c"/>
        <path d="M12 22C8 22 5 19 5 15C5 12 7 10 7 10C7 12 8 13 9 13C10 13 10 12 10 11C10 9 12 8 12 8C12 8 12 11 13 12C14 13 15 13 15 15C15 18 14 19 14 19C14 17 13 16 12 16C11 16 10 17 10 18C10 20 12 22 12 22Z" fill="#f09a6a" opacity="0.6"/>
      </svg>
      火候
    </h1>
    <p class="header-tagline">记录每一次试做，看见厨艺真的在涨</p>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">总尝试次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-success">0</div>
      <div class="stat-label">成功次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-rate">0%</div>

        <button class="filter-btn" data-filter="fail">翻车<span class="filter-count" id="count-fail">(0)</span></button>

          <input class="form-input" id="f-dish" placeholder="今天想试什么菜？" required maxlength="30">

          <div class="form-group">

            <select class="form-select" id="f-source">

            <label class="form-label">分类</label>
            <select class="form-select" id="f-category">
              <option value="炒菜">炒菜</option>
              <option value="烘焙">烘焙</option>
              <option value="面点">面点</option>
              <option value="汤粥">汤粥</option>
              <option value="凉菜">凉菜</option>

            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">来源链接</label>

          <label class="form-label">试做心得</label>

  <!-- Quote -->

    <div class="quote-text" id="quote-text"></div>
    <div class="quote-author">
      —— <span id="quote-author"></span>
      <span class="quote-refresh" id="quote-refresh">换一条</span>
    </div>
  </div>

</div>

  <div class="modal">
    <div class="modal-title">编辑方子</div>
    <form id="edit-form">
      <input type="hidden" id="e-id">

        <label class="form-label">菜名 <span class="req">*</span></label>

      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">来源平台</label>
          <select class="form-select" id="e-source">
            <option value="小红书">小红书</option>
            <option value="抖音">抖音</option>
            <option value="下厨房">下厨房</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">分类</label>
          <select class="form-select" id="e-category">
            <option value="炒菜">炒菜</option>
            <option value="烘焙">烘焙</option>
            <option value="面点">面点</option>
            <option value="汤粥">汤粥</option>
            <option value="凉菜">凉菜</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">来源链接</label>
        <input class="form-input" id="e-link" placeholder="粘贴小红书/抖音/下厨房的链接（选填）">
      </div>
      <div class="form-group">
        <label class="form-label">方子内容</label>
        <textarea class="form-textarea" id="e-content"></textarea>
      </div>

        <label class="form-label">试做心得</label>

        <button type="button" class="form-submit" style="background:var(--muted-light)" id="e-cancel">取消</button>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal" style="max-width:380px;">
    <div class="delete-modal-body">
      <div class="delete-modal-icon">🍳</div>
      <div class="delete-modal-msg" id="delete-msg"></div>
      <div class="delete-modal-sub">这个方子的所有试做记录会一起消失</div>
      <div class="delete-modal-actions">
        <button type="button" class="btn-cancel" id="del-cancel">再想想</button>
        <button type="button" class="btn-confirm" id="del-confirm">删了吧</button>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  /* ========== Data Layer ========== */
  var STORAGE_KEY = 'huohou_recipes';

  function loadRecipes() {
    try {
      var data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch(e) { return []; }
  }

  function saveRecipes(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  var recipes = loadRecipes();
  var currentFilter = 'all';
  var editingNotesId = null;
  var pendingDeleteId = null;

  /* ========== DOM Refs ========== */
  var $ = function(id) { return document.getElementById(id); };
  var recipeList = $('recipe-list');
  var toastEl = $('toast');

  /* ========== Utils ========== */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  function formatDate(ts) {
    var d = new Date(ts);
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate());
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function() { toastEl.classList.remove('show'); }, 2000);
  }

  var statusOrder = ['untried', 'success', 'fail', 'pending'];
  var statusLabels = {
    untried: '未试',
    success: '成功',
    fail: '翻车',
    pending: '待改进'
  };

  /* ========== Stats ========== */
  function renderStats() {
    var total = recipes.length;
    var success = recipes.filter(function(r) { return r.status === 'success'; }).length;
    var fail = recipes.filter(function(r) { return r.status === 'fail'; }).length;
    var rate = total > 0 ? Math.round((success / total) * 100) : 0;

    $('stat-total').textContent = total;
    $('stat-success').textContent = success;
    $('stat-rate').textContent = rate + '%';
    $('stat-fail').textContent = fail;

    $('list-count').textContent = total > 0 ? '(' + total + ')' : '';
  }

  /* ========== Recipe List ========== */
  function renderList() {
    var filtered = recipes;
    if (currentFilter !== 'all') {
      filtered = recipes.filter(function(r) { return r.status === currentFilter; });
    }

    // Sort by creation time descending
    filtered = filtered.slice().sort(function(a, b) {
      return b.createdAt - a.createdAt;
    });

    if (filtered.length === 0) {
      recipeList.innerHTML = '<div class="empty-state">' +
        '<div class="icon">\uD83D\uDD25</div>' +
        '<div class="empty-title">' + (recipes.length === 0 ? '还没有方子，记下你的第一道菜吧' : '这个分类下还没有方子') + '</div>' +
        (recipes.length === 0 ? '<div class="empty-desc">从小红书、抖音上看到的方子，动手试试，把做成了的留下来</div>' : '') +
      '</div>';
      return;
    }

    var html = filtered.map(function(r) {
      var notesHtml = r.notes && r.notes.trim()
        ? '<div class="recipe-notes"><span class="notes-label">心得</span>' + escapeHtml(r.notes.trim()) + '</div>'
        : '';

      var contentPreview = r.content && r.content.trim()
        ? '<div style="font-size:0.82rem;color:var(--muted);margin-top:0.25rem;line-height:1.5;max-height:2.4rem;overflow:hidden;">' + escapeHtml(r.content.trim()) + '</div>'
        : '';

      var attemptHtml = r.attemptCount && r.attemptCount > 0
        ? '<span class="attempt-count">试过 ' + r.attemptCount + ' 次</span>'
        : '';

      var notesEditorHtml = '';
      if (editingNotesId === r.id) {
        notesEditorHtml = '<div class="notes-inline-editor">' +
          '<textarea class="notes-inline-textarea" placeholder="记一笔：火候大了还是小了？下次怎么改？">' + escapeHtml(r.notes || '') + '</textarea>' +
          '<div class="notes-inline-actions">' +
            '<button class="card-btn primary" data-action="save-notes" data-id="' + r.id + '">保存心得</button>' +
            '<button class="card-btn" data-action="skip-notes" data-id="' + r.id + '">先不写</button>' +
          '</div>' +
        '</div>';
      }

      var sourceTagHtml = r.sourceLink && r.sourceLink.trim()
        ? '<a class="tag source source-link" href="' + escapeHtml(r.sourceLink.trim()) + '" target="_blank" rel="noopener">' + escapeHtml(r.source) + '<span class="link-icon">\u2197</span></a>'
        : '<span class="tag source">' + escapeHtml(r.source) + '</span>';

      return '<div class="recipe-card" data-id="' + r.id + '">' +
        '<div class="recipe-card-top">' +
          '<div class="recipe-name">' + escapeHtml(r.dishName) + '</div>' +
          '<div class="recipe-date">' + formatDate(r.createdAt) + '</div>' +
        '</div>' +
        '<div class="recipe-meta">' +
          '<span class="tag category">' + escapeHtml(r.category) + '</span>' +
          sourceTagHtml +
          '<span class="status-badge ' + r.status + '" data-id="' + r.id + '" title="点击切换状态">' + statusLabels[r.status] + '</span>' +
        '</div>' +
        contentPreview +
        notesHtml +
        notesEditorHtml +
        '<div class="recipe-card-actions">' +
          '<button class="icon-btn" data-action="edit" data-id="' + r.id + '" title="编辑">\u270E</button>' +
          '<button class="icon-btn danger" data-action="delete" data-id="' + r.id + '" title="删除">&times;</button>' +
          attemptHtml +
        '</div>' +
      '</div>';
    }).join('');

    recipeList.innerHTML = html;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAll() {
    renderStats();
    renderFilters();
    renderTimeline();
    renderList();
  }

  /* ========== Filters ========== */
  function renderFilters() {
    var counts = {
      all: recipes.length,
      success: recipes.filter(function(r) { return r.status === 'success'; }).length,
      fail: recipes.filter(function(r) { return r.status === 'fail'; }).length,
      pending: recipes.filter(function(r) { return r.status === 'pending'; }).length
    };
    $('count-all').textContent = '(' + counts.all + ')';
    $('count-success').textContent = '(' + counts.success + ')';
    $('count-fail').textContent = '(' + counts.fail + ')';
    $('count-pending').textContent = '(' + counts.pending + ')';
  }

  /* ========== Timeline ========== */
  function renderTimeline() {
    var tried = recipes.filter(function(r) {
      return r.status !== 'untried' && r.notes && r.notes.trim();
    });

    tried = tried.sort(function(a, b) {
      return (b.lastTriedAt || b.createdAt) - (a.lastTriedAt || a.createdAt);
    }).slice(0, 5);

    var section = $('timeline-section');
    if (tried.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';

    var statusIcons = {
      success: '\u2705',
      fail: '\u274C',
      pending: '\uD83D\uDD27'
    };

    var html = tried.map(function(r) {
      var ts = r.lastTriedAt || r.createdAt;
      var d = new Date(ts);
      var dateStr = (d.getMonth()+1) + '\u6708' + d.getDate() + '\u65E5';
      return '<div class="timeline-item">' +
        '<div class="timeline-date">' + dateStr + '</div>' +
        '<div class="timeline-icon">' + (statusIcons[r.status] || '') + '</div>' +
        '<div class="timeline-content">' +
          '<div class="timeline-dish">' + escapeHtml(r.dishName) + '</div>' +
          '<div class="timeline-notes">' + escapeHtml(r.notes.trim()) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    $('timeline-list').innerHTML = html;
  }

  /* ========== Actions ========== */
  function addRecipe(data) {
    recipes.push({
      id: uid(),
      dishName: data.dishName,
      source: data.source,
      sourceLink: data.sourceLink,
      category: data.category,
      content: data.content,
      status: 'untried',
      notes: data.notes,
      attemptCount: 0,
      lastTriedAt: null,
      createdAt: Date.now()
    });
    saveRecipes(recipes);
    renderAll();
  }

  function updateRecipe(id, data) {
    var r = recipes.find(function(r) { return r.id === id; });
    if (r) {
      r.dishName = data.dishName;
      r.source = data.source;
      r.sourceLink = data.sourceLink;
      r.category = data.category;
      r.content = data.content;
      r.notes = data.notes;
      saveRecipes(recipes);
      renderAll();
    }
  }

  function deleteRecipe(id) {
    recipes = recipes.filter(function(r) { return r.id !== id; });
    saveRecipes(recipes);
    renderAll();
    showToast('已删除');
  }

  function cycleStatus(id) {
    var r = recipes.find(function(r) { return r.id === id; });
    if (r) {
      var oldStatus = r.status;
      var idx = statusOrder.indexOf(r.status);
      r.status = statusOrder[(idx + 1) % statusOrder.length];

      // Increment attempt count when leaving 'untried'
      if (oldStatus === 'untried' && r.status !== 'untried') {
        r.attemptCount = (r.attemptCount || 0) + 1;
        r.lastTriedAt = Date.now();
      }

      // Show notes editor when transitioning to success or fail
      if (r.status === 'success' || r.status === 'fail') {
        editingNotesId = id;
      } else {
        editingNotesId = null;
      }

      saveRecipes(recipes);
      renderAll();
    }
  }

  /* ========== Event Handlers ========== */

  // Form submit
  $('recipe-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var dishName = $('f-dish').value.trim();
    if (!dishName) { showToast('菜名不能为空'); return; }

    addRecipe({
      dishName: dishName,
      source: $('f-source').value,
      sourceLink: $('f-link').value.trim(),
      category: $('f-category').value,
      content: $('f-content').value.trim(),
      notes: $('f-notes').value.trim()
    });

    this.reset();
    showToast('记下了，去试试吧');
  });

  // Filter buttons
  document.querySelector('.filters').addEventListener('click', function(e) {
    var btn = e.target.closest('.filter-btn');
    if (btn) {
      document.querySelectorAll('.filter-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    }
  });

  // Recipe list interactions (event delegation)
  recipeList.addEventListener('click', function(e) {
    var target = e.target;

    // Status badge click
    if (target.classList.contains('status-badge')) {
      cycleStatus(target.dataset.id);
      return;
    }

    // Edit button
    if (target.dataset.action === 'edit') {
      openEditModal(target.dataset.id);
      return;
    }

    // Delete button
    if (target.dataset.action === 'delete') {
      var id = target.dataset.id;
      var r = recipes.find(function(r) { return r.id === id; });
      if (r) {
        pendingDeleteId = id;
        $('delete-msg').textContent = '确定要删除「' + r.dishName + '」吗？';
        $('delete-modal').classList.add('show');
      }
      return;
    }

    // Save inline notes
    if (target.dataset.action === 'save-notes') {
      var nid = target.dataset.id;
      var card = target.closest('.recipe-card');
      var textarea = card.querySelector('.notes-inline-textarea');
      var notesVal = textarea ? textarea.value.trim() : '';
      var nr = recipes.find(function(r) { return r.id === nid; });
      if (nr) {
        nr.notes = notesVal;
        saveRecipes(recipes);
      }
      editingNotesId = null;
      renderAll();
      if (notesVal) showToast('心得已记下');
      return;
    }

    // Skip inline notes
    if (target.dataset.action === 'skip-notes') {
      editingNotesId = null;
      renderAll();
      return;
    }
  });

  // Edit modal
  function openEditModal(id) {
    var r = recipes.find(function(r) { return r.id === id; });
    if (!r) return;
    $('e-id').value = r.id;
    $('e-dish').value = r.dishName;
    $('e-source').value = r.source;
    $('e-category').value = r.category;
    $('e-link').value = r.sourceLink || '';
    $('e-content').value = r.content || '';
    $('e-notes').value = r.notes || '';
    $('edit-modal').classList.add('show');
  }

  function closeEditModal() {
    $('edit-modal').classList.remove('show');
  }

  $('e-cancel').addEventListener('click', closeEditModal);
  $('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  $('edit-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = $('e-id').value;
    var dishName = $('e-dish').value.trim();
    if (!dishName) { showToast('菜名不能为空'); return; }
    updateRecipe(id, {
      dishName: dishName,
      source: $('e-source').value,
      sourceLink: $('e-link').value.trim(),
      category: $('e-category').value,
      content: $('e-content').value.trim(),
      notes: $('e-notes').value.trim()
    });
    closeEditModal();
    showToast('已更新');
  });

  // Delete confirm modal
  $('del-cancel').addEventListener('click', function() {
    pendingDeleteId = null;
    $('delete-modal').classList.remove('show');
  });

  $('delete-modal').addEventListener('click', function(e) {
    if (e.target === this) {
      pendingDeleteId = null;
      this.classList.remove('show');
    }
  });

  $('del-confirm').addEventListener('click', function() {
    if (pendingDeleteId) {
      deleteRecipe(pendingDeleteId);
      pendingDeleteId = null;
    }
    $('delete-modal').classList.remove('show');
  });

  /* ========== Quotes ========== */
  var quotes = [
    { text: ' cooking 是一门需要耐心的艺术，火候到了，味道自然就来了。', author: '一位老厨师' },
    { text: '好厨子不是靠菜谱喂出来的，是靠一次次上灶练出来的。', author: '厨房里的话' },
    { text: '翻车不可怕，可怕的是翻完了不知道为什么翻。', author: '某位翻车无数次的人' },
    { text: '做菜和做人一样，火候不到不熟，火候过了就糊。', author: '老火慢炖' },
    { text: '最好的菜谱，是你自己记在笔记本上的那本。', author: '一位母亲' },
    { text: '盐少许、适量、少许——中餐的精髓全在这模糊里。', author: '厨房哲学' },
    { text: '第一次做翻车了，那叫经验。第二次还翻，那叫没记性。', author: '火候用户' },
    { text: '刀工可以慢慢练，但对火候的感觉，只能靠一次次试。', author: '灶台前的感悟' },
    { text: '做菜这件事，最怕的不是难，是做了就忘。', author: '一个爱做饭的人' },
    { text: '每个大厨的背后，都有一堆烧焦的锅和切歪的萝卜。', author: '厨房真相' },
    { text: '食材有脾气，你得摸透了它才听你的话。', author: '市井智慧' },
    { text: '成功的菜谱可以分享，但手艺只能自己长。', author: '灶台独白' },
    { text: '别总想着复制别人的味道，找到自己的味才是正经事。', author: '一位私厨' },
    { text: '做菜最快乐的事，是发现上次翻车的菜，这次居然成了。', author: '厨房里的小确幸' },
    { text: '所谓秘方，不过是试了一百次以后留下来的那个。', author: '老味道' },
    { text: '翻车是通向成功的必经之路。', author: '灶台箴言' },
    { text: '比别人多做一次，就比别人多会一道。', author: '厨房日课' },
    { text: '收藏一千个方子，不如亲手试一次。', author: '火候用户' },
    { text: '火候到了，味道自然来。', author: '灶台口诀' },
    { text: '厨房里没有天才，只有不肯放弃的人。', author: '深夜食堂' }

  function renderQuote() {
