<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水电到家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #app-frame { width: 100%; height: 100%; border: none; display: block; }
    .boot { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #1456d9; font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div id="boot" class="boot">正在加载水电到家…</div>
  <iframe id="app-frame" style="display:none;"></iframe>
  <script>
    (function() {
      var routeMap = {
        '/': 'pages/index/index.html',
        '/services': 'pages/services/services.html',
        '/search': 'pages/search/search.html',
        '/orders': 'pages/orders/orders.html',
        '/profile': 'pages/profile/profile.html',
        '/detail': 'pages/detail/detail.html',
        '/repair': 'pages/repair/repair.html',
        '/order': 'pages/order/order.html'
      };

      var frame = document.getElementById('app-frame');
      var boot = document.getElementById('boot');

      function getRouteFromHash() {
        var hash = window.location.hash.slice(1) || '/';
        var parts = hash.split('?');
        return { path: parts[0], query: parts[1] || '' };
      }

      function loadPage() {
        var route = getRouteFromHash();
        var htmlFile = routeMap[route.path] || routeMap['/'];
        var src = route.query ? htmlFile + '#' + route.query : htmlFile;

        frame.style.display = 'none';
        boot.style.display = 'flex';
        frame.src = src;

        frame.onload = function() {
          boot.style.display = 'none';
          frame.style.display = 'block';
          try {
            var title = frame.contentDocument.title;
            if (title) document.title = title;
          } catch(e) {}
        };
      }

      window.addEventListener('hashchange', loadPage);

      if (!window.location.hash) {
        window.location.hash = '/';
        // hashchange 事件会自动触发 loadPage，无需手动调用
      } else {
        loadPage();
      }
    })();
  </script>
</body>
</html>
