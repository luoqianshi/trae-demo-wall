<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单详情</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="order.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body>
  <div id="app" class="page">
    <div class="custom-nav">
      <div class="nav-content">
        <button class="nav-left" onclick="window.onBack()" aria-label="返回">
          <span class="back">‹</span>
        </button>
        <div class="nav-mid"><span class="nav-title">订单详情</span></div>
        <div class="nav-right"></div>
      </div>
    </div>

    <div class="order-page">
      <div id="loading-state" class="state-card">
        <div class="state-pulse"></div>
        <span>正在读取本地订单…</span>
      </div>

      <div id="error-state" class="state-card error-state" style="display: none;">
        <div class="state-icon">!</div>
        <div class="state-title">订单暂时无法显示</div>
        <div id="error-message" class="state-message"></div>
        <button class="primary-button compact" onclick="window.onRetry()">重新读取</button>
        <button class="text-button" onclick="window.onGoHome()">返回首页</button>
      </div>

      <div id="content-area" style="display: none;">
        <div class="success-hero">
          <div class="success-mark">✓</div>
          <div class="success-copy">
            <span class="success-kicker">报修已提交</span>
            <div id="matched-title" class="success-title"></div>
            <div class="success-note">当前为初赛 Demo 模拟状态，不会发起真实服务。</div>
          </div>
        </div>

        <div class="order-strip">
          <div>
            <span class="meta-label">订单编号</span>
            <div id="order-id" class="order-id"></div>
          </div>
          <div class="status-badge">待上门</div>
        </div>

        <div class="provider-card">
          <div class="card-heading">
            <span class="card-kicker">匹配结果</span>
            <span id="provider-type" class="provider-type"></span>
          </div>
          <div id="provider-name" class="provider-name"></div>
          <div id="provider-subtitle" class="provider-subtitle"></div>
          <div class="provider-metrics">
            <div class="metric">
              <span id="rating-text" class="metric-value"></span>
              <span class="metric-label">用户评分</span>
            </div>
            <div class="metric">
              <span id="distance-text" class="metric-value"></span>
              <span class="metric-label">参考距离</span>
            </div>
            <div class="metric emphasize">
              <span id="arrival-text" class="metric-value"></span>
              <span class="metric-label">预计到达</span>
            </div>
          </div>
          <button class="secondary-button" onclick="window.onViewProvider()" id="view-provider-btn"></button>
        </div>

        <div class="info-card">
          <div class="card-title">本次报修</div>
          <div class="info-row">
            <span class="info-label">服务类型</span>
            <span id="service-name" class="info-value"></span>
          </div>
          <div class="info-row">
            <span class="info-label">上门安排</span>
            <span id="appointment-label" class="info-value"></span>
          </div>
          <div class="info-row">
            <span class="info-label">联系电话</span>
            <span id="contact-phone" class="info-value"></span>
          </div>
          <div class="info-row address-row">
            <span class="info-label">服务地址</span>
            <span id="address" class="info-value"></span>
          </div>
          <div id="issue-box" class="issue-box"></div>
        </div>

        <div class="price-card">
          <div class="card-title light">费用预估</div>
          <div class="price-row">
            <span>上门检测费</span>
            <span id="visit-fee" class="price-value"></span>
          </div>
          <div class="price-row">
            <span>预计人工费</span>
            <span id="labor-text" class="price-value accent"></span>
          </div>
          <div class="price-row note-row">
            <span>材料费</span>
            <span id="material-note" class="material-note"></span>
          </div>
          <div class="price-guarantee">未确认不施工 · 未经同意不加价</div>
        </div>

        <div class="timeline-card">
          <div class="card-title">服务进度</div>
          <div class="timeline-note">初赛演示只推进至"待上门"，后续阶段用于说明完整保障流程。</div>
          <div id="timeline" class="timeline"></div>
        </div>

        <button class="primary-button" onclick="window.onGoHome()">返回首页</button>
        <div class="support-note">如需帮助，请在真实版本中通过订单联系平台客服。</div>
      </div>
    </div>
  </div>

  <script type="module" src="order.js"></script>
</body>
</html>
