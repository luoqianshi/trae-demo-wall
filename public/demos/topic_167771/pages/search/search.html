<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找维修师傅</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="../../components/bottom-navigation.css">
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="featured.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body class="has-bottom-nav">
  <div id="app" class="page">
    <div class="custom-nav">
      <div class="nav-content">
        <div class="nav-left"></div>
        <div class="nav-mid"><span class="nav-title">找维修师傅</span></div>
        <div class="nav-right"></div>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-box">
        <span class="search-glyph" aria-hidden="true"></span>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="搜索师傅、企业或技能（如 水管）"
          aria-label="搜索师傅、企业或技能"
        />
        <button id="clear-btn" class="clear-btn" onclick="window.onClear()" aria-label="清空搜索内容" style="display: none;">清空</button>
      </div>
    </div>

    <div id="init-view" class="init">
      <div class="section">
        <div class="section-hd">
          <span class="section-title">历史搜索</span>
          <button id="clear-history-btn" class="link" onclick="window.onClearHistory()" aria-label="清空全部搜索历史" style="display: none;">清空全部</button>
        </div>
        <div id="empty-hint" class="empty-hint">
          <span>搜索后，常用关键词会保存在本机。</span>
        </div>
        <div id="history-chips" class="chips"></div>
      </div>

      <div class="section">
        <div class="section-hd">
          <span class="section-title">热门搜索</span>
        </div>
        <div id="hot-chips" class="chips"></div>
      </div>

      <div class="section featured-section">
        <div class="section-hd">
          <span class="section-title">推荐服务方</span>
          <span class="section-note">10 位师傅 · 10 家企业</span>
        </div>
        <div id="featured-state" class="featured-state" role="status">正在加载推荐服务方…</div>
        <div id="featured-list" class="list featured-list"></div>
      </div>
    </div>

    <div id="result-view" class="results" style="display: none;">
      <div id="loading-state" class="state" style="display: none;">
        <span>正在搜索…</span>
      </div>

      <div id="error-state" class="state error" style="display: none;">
        <span id="error-text" class="error-text"></span>
        <button class="btn" onclick="window.onRetry()">重试</button>
      </div>

      <div id="empty-state" class="state" style="display: none;">
        <span class="title">未找到相关内容</span>
        <span class="sub">试试“水管”“电工”或“旧房改造”</span>
      </div>

      <div id="result-list" class="list"></div>

      <div id="more-hint" class="more"></div>
    </div>
  </div>

  <nav id="bottom-navigation"></nav>

  <script type="module" src="search.js"></script>
</body>
</html>
