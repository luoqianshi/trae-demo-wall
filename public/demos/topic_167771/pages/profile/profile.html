<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的</title>
  <link rel="stylesheet" href="../../styles/global.css"><link rel="stylesheet" href="../../components/navigation-bar.css"><link rel="stylesheet" href="../../components/bottom-navigation.css"><link rel="stylesheet" href="profile.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body class="has-bottom-nav">
  <div id="navigation-bar"></div>
  <main class="profile-page">
    <section class="visitor-card"><span class="visitor-avatar" aria-hidden="true"><i></i><b></b></span><span><strong>游客模式</strong><small>订单与搜索记录仅保存在本机</small></span><em>Demo</em></section>
    <button id="open-orders" class="summary-card"><span><strong>我的订单</strong><small>查看报修进度和价格记录</small></span><span class="summary-count"><b id="order-count">0</b><i class="css-arrow"></i></span></button>
    <section class="utility-group">
      <button data-dialog="address"><span><strong>常用地址</strong><small>演示版暂不保存真实地址</small></span><i class="css-arrow"></i></button>
      <button data-dialog="guarantees"><span><strong>平台保障</strong><small>了解报价、资质与售后规则</small></span><i class="css-arrow"></i></button>
      <button data-dialog="guide"><span><strong>使用说明</strong><small>快速完成一次模拟报修</small></span><i class="css-arrow"></i></button>
      <button data-dialog="about"><span><strong>关于水电到家</strong><small>项目定位与演示范围</small></span><i class="css-arrow"></i></button>
    </section>
    <button id="clear-orders" class="clear-button" disabled>清除演示订单</button>
    <p class="privacy-note">不上传通讯录、位置或真实身份信息</p>
  </main>
  <nav id="bottom-navigation"></nav>
  <script type="module" src="profile.js"></script>
</body>
</html>
