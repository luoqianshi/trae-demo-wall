<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交报修</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="repair.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body>
  <div id="app" class="page">
    <div class="custom-nav">
      <div class="nav-content">
        <button class="nav-left" onclick="window.onBack()" aria-label="返回">
          <span class="back">‹</span>
        </button>
        <div class="nav-mid"><span class="nav-title">提交报修</span></div>
        <div class="nav-right"></div>
      </div>
    </div>

    <div class="repair-page">
      <div class="intro">
        <span class="eyebrow">1 分钟填写 · 费用先说明</span>
        <div class="page-title">把故障说清楚，师傅更快到</div>
        <div class="page-subtitle">本页为初赛 Demo，提交后生成本地模拟订单，不会产生真实费用。</div>
      </div>

      <div id="preferred-card" class="preferred-card" style="display: none;">
        <div class="preferred-badge">已预选</div>
        <div class="preferred-copy">
          <span id="preferred-name" class="preferred-name"></span>
          <span id="preferred-note" class="preferred-note"></span>
        </div>
      </div>

      <form id="repair-form" onsubmit="event.preventDefault(); window.onSubmit();">
        <div class="form-section">
          <div class="section-heading">
            <span class="section-index">01</span>
            <span class="section-title">故障信息</span>
          </div>

          <div id="service-field" class="field-group">
            <span class="field-label">服务类型</span>
            <select id="service-select" class="select-control" onchange="window.onServiceChange(event)" aria-label="服务类型">
            </select>
            <span id="service-error" class="error-text" style="display: none;"></span>
          </div>

          <div id="description-field" class="field-group">
            <span class="field-label">问题描述</span>
            <span class="field-help">请写清故障位置和现象，例如“厨房水槽下方持续滴水”。</span>
            <textarea
              id="issue-description"
              class="textarea-control"
              maxlength="200"
              placeholder="请至少填写 5 个字"
              aria-label="问题描述"
              oninput="window.onFieldInput(event)"
              onblur="window.onFieldBlur(event)"
            ></textarea>
            <span id="description-error" class="error-text" style="display: none;"></span>
          </div>
        </div>

        <div class="form-section">
          <div class="section-heading">
            <span class="section-index">02</span>
            <span class="section-title">上门安排</span>
          </div>

          <div id="address-field" class="field-group">
            <span class="field-label">服务地址</span>
            <input
              id="address"
              class="input-control"
              maxlength="80"
              placeholder="例如：朝阳区示例小区 3 号楼 1202"
              aria-label="服务地址"
              oninput="window.onFieldInput(event)"
              onblur="window.onFieldBlur(event)"
            />
            <span id="address-error" class="error-text" style="display: none;"></span>
          </div>

          <div id="appointment-field" class="field-group">
            <span class="field-label">希望上门时间</span>
            <div class="appointment-list">
              <label id="appointment-asap" class="appointment-option" onclick="window.onAppointmentChange('asap')">
                <input type="radio" name="appointment" value="asap" checked />
                <div class="appointment-copy">
                  <span class="appointment-label">尽快上门</span>
                  <span class="appointment-hint">预计 30–60 分钟响应</span>
                </div>
              </label>
              <label id="appointment-today" class="appointment-option" onclick="window.onAppointmentChange('today')">
                <input type="radio" name="appointment" value="today" />
                <div class="appointment-copy">
                  <span class="appointment-label">今天</span>
                  <span class="appointment-hint">当天安排时段</span>
                </div>
              </label>
              <label id="appointment-tomorrow" class="appointment-option" onclick="window.onAppointmentChange('tomorrow')">
                <input type="radio" name="appointment" value="tomorrow" />
                <div class="appointment-copy">
                  <span class="appointment-label">明天</span>
                  <span class="appointment-hint">明日优先安排</span>
                </div>
              </label>
            </div>
            <span id="appointment-error" class="error-text" style="display: none;"></span>
          </div>

          <div id="phone-field" class="field-group">
            <span class="field-label">联系电话</span>
            <span class="field-help">仅用于师傅联系上门，订单页会隐藏中间四位。</span>
            <input
              id="contact-phone"
              class="input-control phone-control"
              type="tel"
              maxlength="11"
              placeholder="请输入 11 位手机号"
              aria-label="联系电话"
              oninput="window.onFieldInput(event)"
              onblur="window.onFieldBlur(event)"
            />
            <span id="phone-error" class="error-text" style="display: none;"></span>
          </div>
        </div>

        <div class="price-card">
          <div class="price-head">
            <div>
              <span class="price-kicker">透明预估价</span>
              <div id="price-title" class="price-title"></div>
            </div>
            <span class="demo-tag">Demo 参考</span>
          </div>
          <div class="price-row">
            <span class="price-label">上门检测费</span>
            <span id="visit-fee" class="price-value"></span>
          </div>
          <div class="price-row">
            <span class="price-label">预计人工费</span>
            <span id="labor-text" class="price-value strong"></span>
          </div>
          <div class="price-row material-row">
            <span class="price-label">材料费</span>
            <span id="material-note" class="price-note"></span>
          </div>
          <div class="price-promise">✓ 师傅现场确认方案后，需你二次确认报价才开工</div>
        </div>

        <div id="confirm-group" class="confirm-group">
          <label class="confirm-label">
            <input id="price-confirmed" type="checkbox" onchange="window.onConfirmChange(event)" />
            <span>我已了解：以上为预估价，最终以现场检测和本人确认的报价单为准。</span>
          </label>
          <span id="confirm-error" class="error-text" style="display: none;"></span>
        </div>

        <div id="error-summary" class="error-summary" style="display: none;" role="alert"></div>

        <button id="submit-btn" class="submit-button" type="submit">确认提交报修</button>
        <div class="submit-footnote">模拟下单 · 不调用真实支付 · 订单本机保存</div>
      </form>
    </div>
  </div>

  <script type="module" src="repair.js"></script>
</body>
</html>
