<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报修服务</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="../../components/navigation-bar.css">
  <link rel="stylesheet" href="../../components/bottom-navigation.css">
  <link rel="stylesheet" href="services.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body class="has-bottom-nav">
  <div id="navigation-bar"></div>
  <main class="services-page">
    <header class="services-intro">
      <span class="intro-kicker">先选问题，再看价格</span>
      <h1>家里哪里需要维修？</h1>
      <p>选择最接近的故障类型，我们会提前展示预估人工费和上门费。</p>
    </header>
    <section id="shortcut-grid" class="shortcut-grid" aria-label="维修服务分类"></section>
    <button id="other-entry" class="other-entry">
      <span><strong>不确定是什么问题？</strong><small>直接描述现象，平台安排师傅检测</small></span>
      <span class="css-arrow" aria-hidden="true"></span>
    </button>
    <aside class="price-promise">
      <span class="promise-mark" aria-hidden="true"><span class="promise-check"></span></span>
      <span><strong>报价确认后再施工</strong><small>材料和人工明细由你确认，未经同意不加价。</small></span>
    </aside>
  </main>
  <nav id="bottom-navigation"></nav>
  <script type="module" src="services.js"></script>
</body>
</html>
