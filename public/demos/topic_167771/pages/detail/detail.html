<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>详情</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="detail.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body>
  <div id="app" class="page">
    <div class="custom-nav">
      <div class="nav-content">
        <button class="nav-left" onclick="window.onBack()" aria-label="返回">
          <span class="back">‹</span>
        </button>
        <div class="nav-mid">
          <span id="nav-title" class="nav-title">详情</span>
        </div>
        <div class="nav-right"></div>
      </div>
    </div>

    <div id="loading-state" class="state" style="display: none;">
      <span>正在加载详情…</span>
    </div>

    <div id="error-state" class="state error" style="display: none;">
      <span id="error-text" class="error-text"></span>
      <button class="btn" onclick="window.onRetry()">重试</button>
    </div>

    <div id="content-area" class="content" style="display: none;">
      <div class="header-card">
        <div class="header-row">
          <span id="entity-name" class="name"></span>
          <div id="entity-tag" class="tag"></div>
        </div>
        <div id="entity-subtitle" class="subtitle"></div>
        <div class="rating-summary">
          <span id="rating-num" class="rating-num"></span>
          <div class="stars">
            <span class="stars-bg">★★★★★</span>
            <span id="stars-fg" class="stars-fg"></span>
          </div>
          <span id="rating-count" class="rating-count"></span>
        </div>
        <div class="trust-summary">
          <span>✓ 实名信息已核验</span>
          <span>✓ 平台订单留痕</span>
          <span>✓ 报价确认后施工</span>
        </div>
        <div class="kv">
          <span class="k">电话</span>
          <span id="phone-display" class="v"></span>
        </div>
        <div class="action-row">
          <button id="book-btn" class="book-btn" onclick="window.onBook()">预约</button>
          <button id="call-btn" class="call-btn" onclick="window.onCall()">电话咨询</button>
        </div>
        <div class="phone-hint">
          <span>预约进入平台保障流程；电话仅作为咨询方式。</span>
        </div>
      </div>

      <div id="worker-section"></div>
      <div id="enterprise-section"></div>

      <div class="card">
        <div class="card-title">服务评价</div>
        <div id="review-list"></div>
        <button id="toggle-reviews-btn" class="link-btn" onclick="window.onToggleReviews()" style="display: none;"></button>
      </div>

      <div class="card">
        <div class="card-title">其他推荐</div>
        <div id="recommend-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="detail.js"></script>
</body>
</html>
