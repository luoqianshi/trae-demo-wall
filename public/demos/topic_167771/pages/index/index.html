<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水电到家</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="../../components/navigation-bar.css">
  <link rel="stylesheet" href="../../components/bottom-navigation.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="data-sections.css">
  <script src="../../styles/rpx-polyfill.js"></script>
</head>
<body class="has-bottom-nav">
  <div id="navigation-bar"></div>
  <main class="home-page">
    <section class="hero">
      <div class="brand-line"><span class="brand-mark">水电</span><span class="brand-note">可信赖的家庭维修服务</span></div>
      <h1>透明报价，<br>放心维修。</h1>
      <p>认证师傅上门，方案与费用确认后再施工。</p>
      <button id="emergency-card" class="emergency-card" aria-label="水管漏水紧急报修，最快约三十分钟响应">
        <span><small>紧急报修</small><strong>漏水、断电？现在就处理</strong><em>最快约 30 分钟响应 · 先看预估价</em></span>
        <i aria-hidden="true"><b></b></i>
      </button>
    </section>
    <div id="home-state" class="home-state" role="status">正在准备本地服务数据…</div>
    <div id="home-content" hidden>
      <section class="content-card">
        <header class="section-header"><span><small>常用服务</small><h2>家里问题，一站解决</h2></span><button id="all-services">全部服务</button></header>
        <div id="service-list" class="service-grid"></div>
      </section>
      <section class="content-card">
        <header class="section-header"><span><small>附近好评</small><h2>推荐维修师傅</h2></span><button id="all-providers">查看全部</button></header>
        <div id="provider-list" class="provider-list" aria-label="推荐维修师傅"></div>
      </section>
      <section class="content-card">
        <header><span>平台保障</span><h2>维修过程，清清楚楚</h2></header>
        <div id="guarantee-list" class="guarantee-list"></div>
      </section>
      <section class="content-card">
        <header class="order-header"><span><small>服务进度</small><h2>最近订单</h2></span><button id="all-orders" hidden>全部订单</button></header>
        <div id="recent-order"></div>
      </section>
      <p class="demo-disclaimer">初赛演示版 · 本地模拟数据 · 不产生真实交易</p>
    </div>
  </main>
  <nav id="bottom-navigation"></nav>
  <script type="module" src="index.js"></script>
</body>
</html>
