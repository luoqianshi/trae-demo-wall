<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI陪练剧场 · 六智能体协作职场训练系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f4f7fb;--card:#ffffff;--accent:#f59e0b;
  --director:#8b5cf6;--coach:#d97706;--pressure:#dc2626;--judge:#db2777;--archive:#059669;
  --text:#1e293b;--text-dim:#475569;--text-mute:#94a3b8;
  --glass:rgba(255,255,255,0.82);--border:rgba(15,23,42,0.08);
  --shadow:0 10px 30px rgba(15,23,42,0.08);
  --tint:rgba(15,23,42,0.04);
}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);background-attachment:fixed;color:var(--text);min-height:100vh;overflow-x:hidden;}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;}
.bg-glow::before{top:-15%;left:-8%;width:520px;height:520px;background:radial-gradient(circle,rgba(245,158,11,0.14) 0%,transparent 70%);}
.bg-glow::after{bottom:-12%;right:-10%;width:640px;height:640px;background:radial-gradient(circle,rgba(139,92,246,0.12) 0%,transparent 70%);}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px);background:rgba(255,255,255,0.85);border-bottom:1px solid var(--border);padding:0 1.5rem;height:62px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 rgba(15,23,42,0.03);}
.header-logo{display:flex;align-items:center;gap:12px;font-size:1.1rem;font-weight:700;cursor:pointer;}
.header-logo .icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#f97316);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 14px rgba(245,158,11,0.35);}
.header-logo .sub{font-size:0.65rem;color:var(--text-mute);font-weight:400;letter-spacing:1px;}
.header-nav{display:flex;gap:6px;}
.header-nav button{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:7px 18px;border-radius:8px;cursor:pointer;font-size:0.85rem;transition:all 0.3s;}
.header-nav button:hover{border-color:var(--accent);color:var(--accent);}
.header-nav button.active{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(245,158,11,0.04));border-color:var(--accent);color:var(--accent);font-weight:600;}

/* Pages */
.page{display:none;padding:82px 1.5rem 2rem;min-height:100vh;position:relative;z-index:1;}
.page.active{display:block;animation:fadeIn 0.4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Hero */
.hero{text-align:center;margin:1rem auto 2rem;max-width:760px;}
.hero h1{font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,#1e293b,#f59e0b 55%,#d97706);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.6rem;}
.hero p{color:var(--text-dim);font-size:0.92rem;line-height:1.6;}
.hero .agent-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:1rem;}
.hero .agent-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:0.75rem;background:var(--glass);border:1px solid var(--border);}
.hero .agent-chip .dot{width:8px;height:8px;border-radius:50%;}

/* Phases */
.phase-section{margin-bottom:2.2rem;max-width:1100px;margin-left:auto;margin-right:auto;}
.phase-header{display:flex;align-items:center;gap:12px;margin-bottom:1.1rem;}
.phase-badge{padding:5px 14px;border-radius:20px;font-size:0.72rem;font-weight:700;letter-spacing:1.5px;}
.phase-1 .phase-badge{background:linear-gradient(135deg,rgba(37,99,235,0.16),rgba(37,99,235,0.04));color:#2563eb;border:1px solid rgba(37,99,235,0.28);}
.phase-2 .phase-badge{background:linear-gradient(135deg,rgba(5,150,105,0.16),rgba(5,150,105,0.04));color:var(--archive);border:1px solid rgba(5,150,105,0.28);}
.phase-3 .phase-badge{background:linear-gradient(135deg,rgba(139,92,246,0.16),rgba(139,92,246,0.04));color:var(--director);border:1px solid rgba(139,92,246,0.28);}
.phase-title{font-size:1.15rem;font-weight:700;}
.phase-sub{font-size:0.78rem;color:var(--text-mute);margin-left:auto;}
.levels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;}
@media(max-width:760px){.levels-grid{grid-template-columns:1fr;}}
.level-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:1.5rem 1.2rem;cursor:pointer;transition:all 0.35s;position:relative;overflow:hidden;}
.level-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity 0.3s;}
.level-card:hover:not(.locked){transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(245,158,11,0.35);}
.level-card:hover:not(.locked)::before{opacity:1;}
.level-card.locked{opacity:0.42;cursor:not-allowed;filter:grayscale(0.5);}
.level-card.completed{border-color:rgba(16,185,129,0.35);}
.level-card.completed::before{opacity:1;background:linear-gradient(90deg,var(--archive),transparent);}
.level-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem;}
.level-icon{font-size:2.2rem;}
.level-num{font-size:0.7rem;color:var(--text-mute);font-weight:700;letter-spacing:1px;}
.level-title{font-size:1.02rem;font-weight:700;margin-bottom:0.35rem;}
.level-desc{font-size:0.78rem;color:var(--text-dim);line-height:1.5;margin-bottom:0.8rem;}
.level-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.7rem;}
.level-tag{font-size:0.68rem;padding:2px 8px;border-radius:10px;background:rgba(15,23,42,0.05);color:var(--text-dim);}
.level-stars{display:flex;align-items:center;gap:4px;}
.level-stars .star{font-size:1rem;color:rgba(15,23,42,0.14);}
.level-stars .star.filled{color:var(--accent);text-shadow:0 0 8px rgba(245,158,11,0.4);}
.level-stars .lock{margin-left:auto;font-size:0.95rem;}
.level-stars .opp{margin-left:auto;font-size:0.72rem;color:var(--text-mute);}

/* Training page */
.train-header{display:flex;align-items:center;gap:14px;max-width:920px;margin:0 auto 1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
.train-back{background:var(--glass);border:1px solid var(--border);color:var(--text-dim);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1.1rem;transition:all 0.3s;}
.train-back:hover{color:var(--accent);border-color:var(--accent);}
.train-title{flex:1;}
.train-title h2{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.train-title .opp-line{font-size:0.75rem;color:var(--text-mute);margin-top:3px;}
.mode-toggle{display:flex;background:var(--glass);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.mode-toggle button{background:transparent;border:none;color:var(--text-dim);padding:7px 14px;cursor:pointer;font-size:0.78rem;transition:all 0.3s;}
.mode-toggle button.active{background:rgba(245,158,11,0.18);color:var(--accent);font-weight:600;}

.chat-wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:480px;}
.chat-area{flex:1;overflow-y:auto;padding:0.5rem 0.5rem 1rem;display:flex;flex-direction:column;gap:0.9rem;scrollbar-width:thin;}
.chat-area::-webkit-scrollbar{width:6px;}
.chat-area::-webkit-scrollbar-thumb{background:rgba(15,23,42,0.14);border-radius:3px;}

/* Agent message */
.msg{display:flex;flex-direction:column;max-width:84%;animation:msgIn 0.4s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;padding:0 4px;}
.msg-head .av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.95rem;background:rgba(15,23,42,0.05);}
.msg-head .nm{font-size:0.8rem;font-weight:700;}
.msg-head .role{font-size:0.65rem;color:var(--text-mute);padding:1px 7px;border-radius:8px;background:rgba(15,23,42,0.05);}
.msg.left{align-self:flex-start;}
.msg.right{align-self:flex-end;align-items:flex-end;}
.msg.right .msg-head{flex-direction:row-reverse;}
.bubble{padding:0.8rem 1rem;border-radius:14px;font-size:0.88rem;line-height:1.6;position:relative;}
.msg.left .bubble{border-top-left-radius:4px;border:1px solid var(--border);background:var(--card);}
.msg.right .bubble{border-top-right-radius:4px;background:linear-gradient(135deg,var(--accent),#f97316);color:#1a1206;border:none;font-weight:500;}

/* Agent colored borders */
.msg.director .bubble{border-left:3px solid var(--director);background:linear-gradient(90deg,rgba(139,92,246,0.12),var(--card) 30%);box-shadow:0 2px 10px rgba(15,23,42,0.04);}
.msg.director .nm{color:var(--director);}
.msg.director .av{background:rgba(139,92,246,0.15);}
.msg.coach .bubble{border-left:3px solid var(--coach);background:linear-gradient(90deg,rgba(217,119,6,0.12),var(--card) 30%);box-shadow:0 2px 10px rgba(15,23,42,0.04);}
.msg.coach .nm{color:var(--coach);}
.msg.coach .av{background:rgba(217,119,6,0.15);}
.msg.opponent .bubble{border-left:3px solid #2563eb;background:linear-gradient(90deg,rgba(37,99,235,0.10),var(--card) 30%);box-shadow:0 2px 10px rgba(15,23,42,0.04);}
.msg.opponent .nm{color:#2563eb;}
.msg.opponent .av{background:rgba(37,99,235,0.13);}
.msg.pressure .bubble{border-left:3px solid var(--pressure);background:linear-gradient(90deg,rgba(220,38,38,0.12),var(--card) 30%);box-shadow:0 0 0 1px rgba(220,38,38,0.2),0 2px 10px rgba(15,23,42,0.04);}
.msg.pressure .nm{color:var(--pressure);}
.msg.pressure .av{background:rgba(220,38,38,0.16);animation:pulseRed 1.6s infinite;}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.4);}50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}
.msg.judge .bubble{border-left:3px solid var(--judge);box-shadow:0 2px 10px rgba(15,23,42,0.04);}
.msg.judge .nm{color:var(--judge);}
.msg.judge .av{background:rgba(219,39,119,0.15);}
.msg.archive .bubble{border-left:3px solid var(--archive);background:linear-gradient(90deg,rgba(5,150,105,0.12),var(--card) 30%);box-shadow:0 2px 10px rgba(15,23,42,0.04);}
.msg.archive .nm{color:var(--archive);}
.msg.archive .av{background:rgba(5,150,105,0.15);}

/* Typing indicator */
.typing .bubble{display:flex;gap:4px;align-items:center;padding:0.7rem 1rem;}
.typing .bubble span{width:7px;height:7px;border-radius:50%;background:var(--text-mute);animation:blink 1.3s infinite;}
.typing .bubble span:nth-child(2){animation-delay:0.2s;}
.typing .bubble span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,60%,100%{opacity:0.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

/* Feedback panel */
.feedback{background:var(--card);border:1px solid rgba(236,72,153,0.25);border-left:3px solid var(--judge);border-radius:14px;padding:1.1rem;margin-top:0.4rem;animation:msgIn 0.4s ease;}
.fb-score-row{display:flex;align-items:center;gap:14px;margin-bottom:0.9rem;padding-bottom:0.9rem;border-bottom:1px dashed var(--border);}
.fb-score{font-size:2rem;font-weight:800;line-height:1;}
.fb-score-label{font-size:0.75rem;padding:3px 10px;border-radius:10px;font-weight:600;}
.fb-score-label.excellent{background:rgba(16,185,129,0.18);color:var(--archive);}
.fb-score-label.good{background:rgba(37,99,235,0.14);color:#2563eb;}
.fb-score-label.avg{background:rgba(245,158,11,0.18);color:var(--coach);}
.fb-score-label.poor{background:rgba(239,68,68,0.18);color:var(--pressure);}
.fb-score-meta{font-size:0.72rem;color:var(--text-mute);margin-top:3px;}
.fb-section{margin-bottom:0.7rem;}
.fb-section-title{font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;display:flex;align-items:center;gap:5px;}
.fb-section.good .fb-section-title{color:var(--archive);}
.fb-section.bad .fb-section-title{color:var(--pressure);}
.fb-section.sug .fb-section-title{color:var(--coach);}
.fb-section.focus .fb-section-title{color:var(--judge);}
.fb-section ul{list-style:none;padding-left:1.2rem;}
.fb-section li{font-size:0.82rem;color:var(--text);line-height:1.55;margin-bottom:3px;position:relative;}
.fb-section li::before{content:'';position:absolute;left:-0.8rem;top:8px;width:4px;height:4px;border-radius:50%;background:var(--text-mute);}
.fb-model{background:rgba(37,99,235,0.07);border:1px solid rgba(37,99,235,0.22);border-radius:10px;padding:0.7rem 0.85rem;font-size:0.82rem;line-height:1.6;color:#1e40af;}
.fb-dims{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-top:0.6rem;}
@media(max-width:600px){.fb-dims{grid-template-columns:repeat(2,1fr);}}
.fb-dim{background:rgba(15,23,42,0.03);border-radius:8px;padding:0.4rem 0.5rem;}
.fb-dim-name{font-size:0.7rem;color:var(--text-dim);margin-bottom:2px;}
.fb-dim-bar{height:5px;background:rgba(15,23,42,0.08);border-radius:3px;overflow:hidden;}
.fb-dim-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--judge),#f472b6);transition:width 0.8s ease;}
.fb-dim-val{font-size:0.68rem;color:var(--text-mute);margin-top:2px;text-align:right;}

/* Input area */
.input-area{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;padding:0.85rem;margin-top:0.6rem;}
.options-wrap{display:flex;flex-direction:column;gap:0.55rem;}
.opt-btn{text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.7rem 0.9rem;border-radius:10px;cursor:pointer;font-size:0.85rem;line-height:1.5;transition:all 0.25s;display:flex;gap:9px;align-items:flex-start;}
.opt-btn:hover{border-color:var(--accent);background:rgba(245,158,11,0.06);transform:translateX(2px);}
.opt-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.opt-btn .opt-tag{flex-shrink:0;font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(15,23,42,0.06);color:var(--text-dim);}
.free-wrap{display:flex;gap:8px;}
.free-wrap textarea{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:0.7rem 0.9rem;font-size:0.85rem;font-family:inherit;resize:none;min-height:54px;max-height:120px;outline:none;transition:border-color 0.3s;}
.free-wrap textarea:focus{border-color:var(--accent);}
.free-wrap textarea::placeholder{color:var(--text-mute);}
.send-btn{background:linear-gradient(135deg,var(--accent),#f97316);border:none;color:#1a1206;padding:0 1.2rem;border-radius:10px;cursor:pointer;font-size:0.85rem;font-weight:700;transition:transform 0.2s,box-shadow 0.2s;align-self:stretch;}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(245,158,11,0.35);}
.send-btn:disabled{opacity:0.5;cursor:not-allowed;}
.input-hint{text-align:center;font-size:0.72rem;color:var(--text-mute);margin-top:0.5rem;}
.train-end{display:flex;gap:0.6rem;justify-content:center;margin-top:0.7rem;}
.train-end button{background:var(--glass);border:1px solid var(--border);color:var(--text);padding:0.55rem 1.1rem;border-radius:10px;cursor:pointer;font-size:0.82rem;transition:all 0.3s;}
.train-end button:hover{border-color:var(--accent);color:var(--accent);}
.train-end button.primary{background:linear-gradient(135deg,var(--accent),#f97316);color:#1a1206;border:none;font-weight:700;}

/* Growth report */
.report-wrap{max-width:1000px;margin:0 auto;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.1rem;}
@media(max-width:760px){.report-grid{grid-template-columns:1fr;}}
.report-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:1.3rem;}
.report-card h3{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.overall-score{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.overall-score .big{font-size:3.4rem;font-weight:800;background:linear-gradient(135deg,#1e293b,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.overall-score .lbl{font-size:0.85rem;color:var(--text-dim);margin-top:0.3rem;}
.overall-score .stats{display:flex;gap:1.5rem;margin-top:1rem;}
.overall-score .stat{text-align:center;}
.overall-score .stat .v{font-size:1.1rem;font-weight:700;color:var(--accent);}
.overall-score .stat .k{font-size:0.68rem;color:var(--text-mute);}
.radar-wrap{display:flex;justify-content:center;}
.dim-list{display:flex;flex-direction:column;gap:0.7rem;}
.dim-row{display:flex;align-items:center;gap:0.7rem;}
.dim-row .nm{width:60px;font-size:0.82rem;font-weight:600;}
.dim-row .bar{flex:1;height:8px;background:rgba(15,23,42,0.06);border-radius:5px;overflow:hidden;}
.dim-row .fill{height:100%;border-radius:5px;transition:width 0.8s ease;}
.dim-row .val{width:34px;text-align:right;font-size:0.78rem;font-weight:700;}
.dim-row .tag{font-size:0.62rem;padding:1px 7px;border-radius:8px;}
.tag.low{background:rgba(239,68,68,0.18);color:var(--pressure);}
.tag.mid{background:rgba(245,158,11,0.18);color:var(--coach);}
.tag.high{background:rgba(16,185,129,0.18);color:var(--archive);}
.trend-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:0.5rem 0;}
.trend-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.trend-bar .bar{width:100%;max-width:42px;background:linear-gradient(180deg,var(--accent),#f97316);border-radius:6px 6px 0 0;min-height:3px;transition:height 0.8s ease;position:relative;}
.trend-bar .bar:hover::after{content:attr(data-val);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:#fff;background:var(--accent);padding:1px 5px;border-radius:4px;border:1px solid var(--border);}
.trend-bar .lbl{font-size:0.65rem;color:var(--text-mute);}
.history-list{display:flex;flex-direction:column;gap:0.55rem;max-height:280px;overflow-y:auto;}
.history-item{display:flex;align-items:center;gap:0.7rem;padding:0.55rem 0.7rem;background:rgba(15,23,42,0.03);border-radius:10px;border:1px solid var(--border);}
.history-item .ic{font-size:1.3rem;}
.history-item .info{flex:1;}
.history-item .t{font-size:0.82rem;font-weight:600;}
.history-item .d{font-size:0.7rem;color:var(--text-mute);}
.history-item .sc{font-size:0.9rem;font-weight:700;color:var(--accent);}
.history-empty{text-align:center;color:var(--text-mute);font-size:0.85rem;padding:1.5rem;}
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:0.7rem;}
@media(max-width:600px){.recs{grid-template-columns:1fr;}}
.rec-card{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:12px;padding:0.85rem;}
.rec-card.mid{background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2);}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem;}
.rec-dim{font-size:0.85rem;font-weight:700;color:var(--pressure);}
.rec-card.mid .rec-dim{color:var(--coach);}
.rec-priority{font-size:0.65rem;padding:2px 8px;border-radius:8px;background:rgba(239,68,68,0.2);color:var(--pressure);}
.rec-card.mid .rec-priority{background:rgba(245,158,11,0.2);color:var(--coach);}
.rec-levels{display:flex;flex-wrap:wrap;gap:5px;}
.rec-level{font-size:0.72rem;padding:3px 9px;border-radius:8px;background:rgba(15,23,42,0.05);color:var(--text-dim);cursor:pointer;transition:all 0.3s;}
.rec-level:hover{background:rgba(245,158,11,0.15);color:var(--accent);}

/* Toast */

/* ===================== STATE ===================== */
const STORAGE_KEY = 'ai-coach-theater-v2';
const DEFAULT_STATE = {
  unlocked:[0],
  stars:{}, // {levelId: 0-3}
  history:[], // {levelId, title, icon, score, date, dims}
  dims:{表达力:0,逻辑力:0,应变力:0,协作力:0,执行力:0,复习力:0},
  totalScore:0,
  trainCount:0
};
let state = loadState();
let currentLevel = null;
let currentMode = 'option'; // option | free
let flowState = null; // training flow state

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && s.unlocked) return Object.assign({},DEFAULT_STATE,s);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ===================== PAGE NAV ===================== */
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.header-nav button').forEach(b=>b.classList.remove('active'));
  const navBtn = document.getElementById('nav-'+name) || document.getElementById('nav-home');
  if(navBtn) navBtn.classList.add('active');
  if(name==='home') renderLevels();
  if(name==='report') renderReport();
  window.scrollTo(0,0);
}
function goHome(){ showPage('home'); }

/* ===================== HOME: LEVEL MAP ===================== */
function renderLevels(){
  const c = document.getElementById('levels-container');
  const phases = [
    {n:1, name:'求职面试', sub:'Phase 1', cls:'phase-1', range:[0,1,2]},
    {n:2, name:'入职适应', sub:'Phase 2', cls:'phase-2', range:[3,4,5]},
    {n:3, name:'独立工作', sub:'Phase 3', cls:'phase-3', range:[6,7,8]}
  ];
  let html='';
  phases.forEach(ph=>{
    html += `<div class="phase-section ${ph.cls}">
      <div class="phase-header">
        <span class="phase-badge">${ph.sub}</span>
        <span class="phase-title">${ph.name}</span>
        <span class="phase-sub">3 个关卡</span>
      </div>
      <div class="levels-grid">`;
    ph.range.forEach(id=>{
      const lv = LEVELS[id];
      const unlocked = state.unlocked.includes(id);
      const stars = state.stars[id]||0;
      const completed = stars>0;
      html += `<div class="level-card ${unlocked?'':'locked'} ${completed?'completed':''}" onclick="${unlocked?`startLevel(${id})`:''}">
        <div class="level-head">
          <div class="level-icon">${lv.icon}</div>
          <div class="level-num">L${id}</div>
        </div>
        <div class="level-title">${lv.title}</div>
        <div class="level-desc">${lv.desc}</div>
        <div class="level-tags">
          ${lv.dim.map(d=>`<span class="level-tag">${d}</span>`).join('')}
          <span class="level-tag">${lv.diff}</span>
        </div>
        <div class="level-stars">
          ${[0,1,2].map(i=>`<span class="star ${i<stars?'filled':''}">★</span>`).join('')}
          ${unlocked?`<span class="opp">${lv.opp.name}</span>`:`<span class="lock">🔒</span>`}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
}

/* ===================== TRAINING ===================== */
function startLevel(id){
  currentLevel = LEVELS[id];
  currentMode = 'option';
  document.getElementById('mode-opt').classList.add('active');
  document.getElementById('mode-free').classList.remove('active');
  document.getElementById('train-title').innerHTML = `${currentLevel.icon} ${currentLevel.title}`;
  document.getElementById('train-opp').textContent = `对手角色：${currentLevel.opp.name} · 难度 ${currentLevel.diff} · 训练维度：${currentLevel.dim.join('、')}`;
  document.getElementById('chat-area').innerHTML='';
  document.getElementById('input-area').innerHTML='';
  showPage('train');
  // init flow state
  flowState = { levelId:id, step:0, roundIdx:0, scores:[], dimAcc:{}, pressureDone:false, finished:false };
  runFlow();
}

function setMode(m){
  currentMode = m;
  document.getElementById('mode-opt').classList.toggle('active', m==='option');
  document.getElementById('mode-free').classList.toggle('active', m==='free');
  renderInput();
}

/* Flow controller:
   step 0: director opening
   step 1: coach pre-hint
   step 2: round 1 opponent question
   step 3: wait user response (round 1)
   step 4: judge feedback (round 1)
   step 5: round 2 opponent question
   step 6: wait user (round 2)
   step 7: judge feedback (round 2)
   step 8: pressure officer interrupts
   step 9: wait user (pressure)
   step 10: judge feedback (pressure)
   step 11: final judge summary
   step 12: archive officer closing
*/
function runFlow(){
  const s = flowState;
  if(s.finished) return;
  const lv = currentLevel;
  if(s.step===0){ agentSay('director', lv.director, true, ()=>{ s.step=1; runFlow(); }); }
  else if(s.step===1){ agentSay('coach', lv.coach, false, ()=>{ s.step=2; runFlow(); }); }
  else if(s.step===2){ // round 1 opponent question
    const r = lv.rounds[0];
    agentSayOpponent(r.q, ()=>{ s.step=3; s.awaiting='round1'; renderInput(); });
  }
  else if(s.step===3){ /* waiting user round1 - renderInput handles */ }
  else if(s.step===4){ // judge feedback round 1
    showJudgeFeedback(s.lastFb, ()=>{ s.step=5; runFlow(); });
  }
  else if(s.step===5){ // round 2 opponent question
    const r = lv.rounds[1];
    agentSayOpponent(r.q, ()=>{ s.step=6; s.awaiting='round2'; renderInput(); });
  }
  else if(s.step===6){ /* waiting user round2 */ }
  else if(s.step===7){ // judge feedback round 2
    showJudgeFeedback(s.lastFb, ()=>{ s.step=8; runFlow(); });
  }
  else if(s.step===8){ // pressure officer interrupts
    agentSay('pressure', '⚡ '+lv.pressure.msg, false, ()=>{ s.step=9; s.awaiting='pressure'; renderInput(); });
  }
  else if(s.step===9){ /* waiting user pressure */ }
  else if(s.step===10){ // judge feedback pressure
    showJudgeFeedback(s.lastFb, ()=>{ s.step=11; runFlow(); });
  }
  else if(s.step===11){ // final judge summary
    agentSay('judge', '🏆 '+lv.finalJudge, false, ()=>{ s.step=12; runFlow(); });
  }
  else if(s.step===12){ // archive officer closing + finish
    agentSay('archive', lv.archive, false, ()=>{ finishLevel(); });
  }
}

/* ===================== AGENT MESSAGE RENDERING ===================== */
function agentSay(agentKey, text, isScene, after){
  const a = AGENTS[agentKey];
  const area = document.getElementById('chat-area');
  // typing placeholder
  const typing = document.createElement('div');
  typing.className = `msg left ${a.cls} typing`;
  typing.id = 'typing-'+Date.now();
  typing.innerHTML = `<div class="msg-head"><div class="av">${a.avatar}</div><span class="nm">${a.name}</span><span class="role">${a.role}</span></div><div class="bubble"><span></span><span></span><span></span></div>`;
  area.appendChild(typing);
  scrollChat();
  const delay = 700 + Math.min(1400, text.length*8);
  setTimeout(()=>{
    typing.remove();
    const msg = document.createElement('div');
    let bubbleClass = 'bubble';
    if(isScene) bubbleClass += ' scene-card';
    msg.className = `msg left ${a.cls}`;
    msg.innerHTML = `<div class="msg-head"><div class="av">${a.avatar}</div><span class="nm">${a.name}</span><span class="role">${a.role}</span></div><div class="${bubbleClass}">${formatText(text)}</div>`;
    area.appendChild(msg);
    scrollChat();
    if(after) setTimeout(after, 250);
  }, delay);
}

function agentSayOpponent(text, after){
  const lv = currentLevel;
  const a = AGENTS.opponent;
  // override avatar/name with level opponent
  const area = document.getElementById('chat-area');
  const typing = document.createElement('div');
  typing.className = `msg left ${a.cls} typing`;

/* ===================== INPUT RENDERING ===================== */
function renderInput(){
  const area = document.getElementById('input-area');

  if(!s || s.finished){ renderEndActions(); return; }
  if(!s.awaiting){ area.innerHTML='<div class="input-hint">智能体正在准备…</div>'; return; }
  const lv = currentLevel;
  let data;
  if(s.awaiting==='round1') data = lv.rounds[0];
  else if(s.awaiting==='round2') data = lv.rounds[1];
  else if(s.awaiting==='pressure') data = lv.pressure;

  if(currentMode==='option'){
    let html = '<div class="options-wrap">';
    const tags = ['A','B','C','D'];
    data.options.forEach((o,i)=>{
      html += `<button class="opt-btn" onclick="handleOption('${s.awaiting}', ${i})"><span class="opt-tag">${tags[i]}</span><span>${escapeHtml(o.t)}</span></button>`;
    });

    html += '<div class="input-hint">点击选项作答 · 可切换至自由输入模式获得个性化评估</div>';

    area.innerHTML = `<div class="free-wrap"><textarea id="free-input" placeholder="${ph}" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();submitFree();}"></textarea><button class="send-btn" onclick="submitFree()">发送</button></div><div class="input-hint">Ctrl/⌘ + Enter 快速发送 · 关键词评分引擎将分析你的回答</div>`;

}

function renderEndActions(){
  const area = document.getElementById('input-area');
  const next = flowState.levelId + 1;
  const hasNext = next < LEVELS.length && state.unlocked.includes(next);
  area.innerHTML = `<div class="train-end">
    <button onclick="startLevel(${flowState.levelId})">重新训练</button>
    <button onclick="goHome()">返回关卡地图</button>

    ${hasNext?`<button class="primary" onclick="startLevel(${next})">下一关 →</button>`:''}

}

/* ===================== RESPONSE HANDLING ===================== */
function handleOption(awaiting, idx){
  const lv = currentLevel;
  let data, fb;
  if(awaiting==='round1'){ data = lv.rounds[0]; fb = data.options[idx]; }
  else if(awaiting==='round2'){ data = lv.rounds[1]; fb = data.options[idx]; }
  else if(awaiting==='pressure'){ data = lv.pressure; fb = data.options[idx]; }
  userSay(fb.t);
  flowState.scores.push(fb.s);
  flowState.awaiting = null;
  document.getElementById('input-area').innerHTML='<div class="input-hint">成长评委正在评估…</div>';
  // build feedback object: use option score, blend with round fb dims
  const baseFb = data.fb;
  const blended = Object.assign({}, baseFb, { score: fb.s });
  // adjust dims slightly based on option score
  const adj = {};
  for(const k in baseFb.dims){
    adj[k] = Math.round(baseFb.dims[k] * (0.6 + 0.4 * (fb.s/90)));
  }
  blended.dims = adj;
  flowState.lastFb = blended;
  accumulateDims(adj);
  setTimeout(()=>{
    if(awaiting==='round1'){ flowState.step=4; runFlow(); }
    else if(awaiting==='round2'){ flowState.step=7; runFlow(); }
    else if(awaiting==='pressure'){ flowState.step=10; runFlow(); }
  }, 500);
}

function submitFree(){
  const ta = document.getElementById('free-input');
  if(!ta) return;
  const text = ta.value.trim();
  if(text.length < 5){ showToast('请输入更完整的回答（至少5个字）'); return; }
  const awaiting = flowState.awaiting;
  const lv = currentLevel;
  let data;
  if(awaiting==='round1') data = lv.rounds[0];
  else if(awaiting==='round2') data = lv.rounds[1];
  else if(awaiting==='pressure') data = lv.pressure;
  userSay(text);
  flowState.awaiting = null;
  document.getElementById('input-area').innerHTML='<div class="input-hint">成长评委正在评估…</div>';
  const { score, analysis } = evalFreeInput(text);
  flowState.scores.push(score);
  // build feedback: use base fb structure but custom analysis
  const baseFb = data.fb;
  const blended = Object.assign({}, baseFb);
  blended.score = score;
  blended.good = analysis.good.length ? analysis.good : ['回答有自己的思考'];
  blended.bad = analysis.bad.length ? analysis.bad : ['可以更结构化、更具体'];
  blended.sug = analysis.sug || baseFb.sug;
  blended.model = baseFb.model; // keep model answer
  blended.focus = baseFb.focus;
  const adj = {};
  for(const k in baseFb.dims){
    adj[k] = Math.round(baseFb.dims[k] * (0.5 + 0.5 * (score/88)));
  }
  blended.dims = adj;
  flowState.lastFb = blended;
  accumulateDims(adj);
  setTimeout(()=>{
    if(awaiting==='round1'){ flowState.step=4; runFlow(); }
    else if(awaiting==='round2'){ flowState.step=7; runFlow(); }
    else if(awaiting==='pressure'){ flowState.step=10; runFlow(); }
  }, 500);
}

/* ===================== FREE INPUT EVALUATION ===================== */
function evalFreeInput(text){
  let score = 40;
  const good = [], bad = [], sugParts = [];
  const len = text.length;
  // length
  if(len >= 80){ score += 12; good.push('回答篇幅充分，展开了细节'); }
  else if(len >= 40){ score += 6; }
  else { score -= 8; bad.push('回答偏简短，缺乏展开'); sugParts.push('多补充具体细节'); }
  // data / numbers
  const numMatch = text.match(/\d+%|\d+\.?\d*万?|\d+\/\d+|p值|ROI|AB|A\/B/gi);
  if(numMatch && numMatch.length >= 1){ score += 14; good.push(`使用了数据/量化指标(${numMatch.length}处)`); }
  else { bad.push('缺少数据支撑'); sugParts.push('加入具体数字、百分比、对比数据'); }
  // structure markers
  const structKw = ['首先','其次','第一','第二','第三','1.','2.','3.','①','②','③','STAR','situation','task','action','result','背景','任务','行动','结果','结论','复盘','计划','优先级','P0','P1','P2'];
  let structHits = 0;
  structKw.forEach(k=>{ if(text.toLowerCase().includes(k.toLowerCase())) structHits++; });
  if(structHits >= 2){ score += 14; good.push('结构清晰，使用了要点化表达'); }
  else if(structHits >= 1){ score += 6; }
  else { bad.push('缺乏结构，表达较散'); sugParts.push('用"首先/其次"或编号分点组织'); }
  // specific actions
  const actKw = ['主导','负责','设计','优化','调研','分析','拆解','推动','主导','实施','搭建','验证','迭代','调整'];
  let actHits = 0;
  actKw.forEach(k=>{ if(text.includes(k)) actHits++; });
  if(actHits >= 2){ score += 12; good.push('具体描述了行动动作'); }
  else if(actHits >= 1){ score += 5; }
  else { bad.push('行动描述模糊'); sugParts.push('明确"你做了什么"的具体动作'); }
  // results
  const resKw = ['提升','增长','降低','减少','提升','完成','达到','超过','缩短','提高','下降','转化','留存','日活','月活'];
  let resHits = 0;
  resKw.forEach(k=>{ if(text.includes(k)) resHits++; });
  if(resHits >= 1){ score += 10; good.push('给出了结果与产出'); }
  else { sugParts.push('补充结果数据与影响'); }
  // thinking process
  const thinkKw = ['因为','所以','通过','由于','考虑到','基于','判断','发现','对比','分析','推理','归因','验证'];
  let thinkHits = 0;
  thinkKw.forEach(k=>{ if(text.includes(k)) thinkHits++; });
  if(thinkHits >= 2){ score += 8; good.push('展现了思考过程与因果推理'); }
  // vague negative
  const vagueKw = ['可能','大概','差不多','随便','看情况','不太清楚','应该吧','很多','一些'];
  let vagueHits = 0;
  vagueKw.forEach(k=>{ if(text.includes(k)) vagueHits++; });
  if(vagueHits >= 2){ score -= 6; bad.push('存在模糊用词(可能/差不多等)'); sugParts.push('用确定的数据替代模糊表述'); }
  score = Math.max(20, Math.min(96, score));
  let sug = sugParts.length ? sugParts.join('；') + '。' : '继续保持，可对照示范版本查漏补缺。';
  if(score >= 80 && good.length) sug = '整体优秀，' + sugParts.join('；') + '。';
  return { score: Math.round(score), analysis: { good: good.slice(0,3), bad: bad.slice(0,2), sug } };
}

/* ===================== LEVEL COMPLETION ===================== */
function finishLevel(){
  flowState.finished = true;
  const lv = currentLevel;
  // average score
  const avg = Math.round(flowState.scores.reduce((a,b)=>a+b,0) / flowState.scores.length);
  // stars
  let stars = 1;
  if(avg >= 85) stars = 3;
  else if(avg >= 70) stars = 2;
  if(avg < 60) stars = 0; // not passed
  const passed = avg >= 60;
  // update state
  if(passed){
    state.stars[flowState.levelId] = Math.max(state.stars[flowState.levelId]||0, stars);
    // unlock next
    const next = flowState.levelId + 1;
    if(next < LEVELS.length && !state.unlocked.includes(next)){
      state.unlocked.push(next);
    }
  }
  // accumulate dims into state (average of this session's dims, weighted into running avg)
  state.trainCount = (state.trainCount||0) + 1;
  for(const k in flowState.dimAcc){
    const sessionAvg = flowState.dimAcc[k] / flowState.scores.length;
    if(state.dims[k] === 0 || state.dims[k] == null){
      state.dims[k] = Math.round(sessionAvg);
    } else {
      // running average: 70% old + 30% new to reflect growth
      state.dims[k] = Math.round(state.dims[k] * 0.7 + sessionAvg * 0.3);
    }
  }
  // history
  state.history.unshift({
    levelId: flowState.levelId,
    title: lv.title,
    icon: lv.icon,
    score: avg,
    stars: stars,
    passed: passed,
    date: new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  });
  if(state.history.length > 20) state.history = state.history.slice(0,20);
  // total score
  state.totalScore = (state.totalScore||0) + avg;
  saveState();
  renderEndActions();
  if(passed){
    if(stars === 3) showToast(`🎉 训练完成！评级优秀，获得 ${stars}★`);
    else showToast(`✅ 训练通过！获得 ${stars}★，下一关已解锁`);
  } else {
    showToast(`本次未达标（${avg}分），再练一次会更好`);
  }
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

function buildRecommendations(dims){
  const dimToLevels = {
    '表达力':[0,1,8],
    '逻辑力':[0,5,8],
    '应变力':[1,7],
    '协作力':[3,7],
    '执行力':[4,6],
    '复习力':[8,6]
  };
  // sort dims by score asc
  const sorted = DIMS.map(d=>({d, v:dims[d]||0})).sort((a,b)=>a.v-b.v);
  // pick weakest 4 (or all if <4)
  const targets = sorted.slice(0,4);
  let html='';
  targets.forEach((t,i)=>{
    const isHigh = i>=2;
    const lvIds = dimToLevels[t.d];
    const levels = lvIds.map(id=>LEVELS[id]);
    const priority = i===0?'最高优先':i===1?'高优先':'建议关注';
    html += `<div class="rec-card ${isHigh?'mid':''}">
      <div class="rec-head">
        <span class="rec-dim">${t.d} · ${t.v}分</span>
        <span class="rec-priority">${priority}</span>
      </div>
      <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:0.5rem;">推荐训练关卡：</div>
      <div class="rec-levels">
        ${levels.map(l=>`<span class="rec-level" onclick="startLevel(${l.id})">${l.icon} ${l.title}</span>`).join('')}
      </div>
    </div>`;
  });
  if(!state.history.length){
    html = `<div style="grid-column:1/-1;text-align:center;color:var(--text-mute);padding:1rem;">完成首次训练后，将根据你的薄弱维度生成个性化训练路径。</div>`;
  }
  return html;
}

/* ===================== SVG RADAR CHART ===================== */
function radarSvg(vals){
  const size = 240, cx = size/2, cy = size/2, R = 88;
  const n = DIMS.length;
  const labels = ['表达力','逻辑力','应变力','协作力','执行力','复习力'];
  let pts = [];
  let grid = [];
  for(let level=1; level<=4; level++){
    let g = [];
    for(let i=0;i<n;i++){
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const r = R*level/4;
      g.push([cx + r*Math.cos(ang), cy + r*Math.sin(ang)]);
    }
    grid.push(g);
  }
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    pts.push([cx + R*Math.cos(ang), cy + R*Math.sin(ang)]);
  }
  // data polygon
  let dataPts = [];
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = R * (vals[i]||0)/100;
    dataPts.push([cx + r*Math.cos(ang), cy + r*Math.sin(ang)]);
  }
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  // grid polygons
  grid.forEach((g,idx)=>{
    const poly = g.map(p=>p.join(',')).join(' ');
    svg += `<polygon points="${poly}" fill="none" stroke="rgba(15,23,42,0.10)" stroke-width="1"/>`;
  });
  // axes
  for(let i=0;i<n;i++){
    svg += `<line x1="${cx}" y1="${cy}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="rgba(15,23,42,0.10)" stroke-width="1"/>`;
  }
  // data polygon
  const dataPoly = dataPts.map(p=>p.join(',')).join(' ');
  svg += `<polygon points="${dataPoly}" fill="rgba(219,39,119,0.22)" stroke="#db2777" stroke-width="2"/>`;
  // data points
  dataPts.forEach(p=>{
    svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#db2777"/>`;
  });
  // labels
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const lr = R + 18;
    const lx = cx + lr*Math.cos(ang);
    const ly = cy + lr*Math.sin(ang);
    const v = vals[i]||0;
    svg += `<text x="${lx}" y="${ly-2}" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">${labels[i]}</text>`;
    svg += `<text x="${lx}" y="${ly+11}" text-anchor="middle" fill="${v>=75?'#059669':v>=50?'#d97706':'#dc2626'}" font-size="10" font-weight="700">${v}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

/* ===================== INIT ===================== */
renderLevels();
</script>
