<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BACKROOMS ESCAPE · 后室逃生</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root{
    --mustard:#d4c86a;
    --mustard-dark:#a89a48;
    --mustard-dim:#7a7038;
    --beige:#c9b981;
    --beige-dark:#968a5a;
    --wall-dark:#6b5a2e;
    --wall-darker:#3d3418;
    --blood:#c0392b;
    --blood-dark:#7a1e15;
    --toxic:#2ecc71;
    --toxic-dim:#1a7a40;
    --dark:#1a1408;
    --darker:#0d0a04;
    --ink:#e8dcb0;
    --dim:#8a7d50;
    --warn:#e67e22;
    --flash:#fffde7;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#000;
    font-family:'VT323', monospace;
    color:var(--ink);
    image-rendering:pixelated;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #1a1408 0%, #0a0804 70%, #000 100%);
  }
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 1.3333));
    aspect-ratio:4/3;
    background:#000;
    box-shadow:0 0 0 2px var(--wall-darker), 0 0 40px rgba(212,200,106,.15), 0 0 80px rgba(0,0,0,.5);
    overflow:hidden;
  }
  #game{
    display:block;
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  /* 扫描线 + 暗角 CRT 效果 */
  #crt{
    position:absolute; inset:0; pointer-events:none; z-index:40;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.15) 3px,
        rgba(0,0,0,0) 4px
      );
    mix-blend-mode:multiply;
  }
  #crt::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.65) 100%);
  }

  /* 通用像素按钮 */
  .pbtn{
    font-family:'Press Start 2P', monospace;
    font-size:11px; letter-spacing:1px;
    color:var(--ink);
    background:linear-gradient(180deg,var(--wall-dark),var(--wall-darker));
    border:2px solid var(--mustard-dim);
    padding:12px 18px;
    cursor:pointer;
    position:relative;
    transition:transform .08s,border-color .12s,color .12s,box-shadow .12s;
    text-transform:uppercase;
  }
  .pbtn::before{
    content:""; position:absolute; inset:2px;
    border:1px solid rgba(255,255,255,.04); pointer-events:none;
  }
  .pbtn:hover{
    color:var(--flash);
    border-color:var(--toxic);
    box-shadow:0 0 0 1px var(--toxic), 0 0 14px rgba(46,204,113,.4);
    transform:translateY(-2px);
  }
  .pbtn:active{ transform:translateY(0); }
  .pbtn.active{ border-color:var(--mustard); color:var(--flash); box-shadow:0 0 0 1px var(--mustard),0 0 14px rgba(212,200,106,.4); }

  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  .hidden{ display:none !important; }

  /* ===== 标题界面 ===== */
  #title{
    background:
      radial-gradient(ellipse at 50% 30%, rgba(212,200,106,.08), transparent 60%),
      linear-gradient(180deg, rgba(26,20,8,.92), rgba(10,8,4,.98));
    gap:0;
  }
  #title .logo{
    font-family:'Press Start 2P', monospace;
    line-height:1.6;
    margin-bottom:8px;
    position:relative;
  }
  #title .logo .l1{ font-size:clamp(22px,4.5vw,44px); color:var(--mustard); text-shadow:0 0 16px rgba(212,200,106,.5), 3px 3px 0 var(--wall-darker); }
  #title .logo .l2{ font-size:clamp(16px,3vw,30px); color:var(--beige); text-shadow:0 0 12px rgba(201,185,129,.4), 2px 2px 0 var(--wall-darker); display:block; margin-top:4px; }
  #title .logo .l3{ font-size:clamp(18px,3.4vw,34px); color:var(--blood); text-shadow:0 0 14px rgba(192,57,43,.5), 3px 3px 0 #2a0804; display:block; margin-top:6px; }
  /* 摇曳灯光 */
  #title .logo::before{
    content:""; position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    width:80%; height:4px;
    background:var(--mustard);
    border-radius:2px;
    box-shadow:0 0 20px 6px rgba(212,200,106,.4);
    animation:flicker 3s infinite steps(8);
  }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    10%{ opacity:.7; }
    12%{ opacity:1; }
    25%{ opacity:.9; }
    42%{ opacity:.6; }
    44%{ opacity:1; }
    70%{ opacity:.85; }
    72%{ opacity:.95; }
    85%{ opacity:.75; }
  }
  #title .sub{
    font-family:'Press Start 2P', monospace; font-size:10px;
    color:var(--dim); margin:24px 0 24px;
    letter-spacing:2px; animation:blink 1.4s steps(2) infinite;
  }
  @keyframes blink{ 50%{ opacity:.2; } }
  .modes{ display:flex; gap:16px; margin-bottom:26px; flex-wrap:wrap; justify-content:center; }

  .keys{
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
    font-size:20px; margin-top:10px;
  }
  .keys .col{
    background:rgba(30,24,10,.75); border:1px solid var(--wall-dark);
    padding:10px 16px; min-width:220px;
  }
  .keys .col h4{
    font-family:'Press Start 2P', monospace; font-size:9px; margin-bottom:8px;
    letter-spacing:1px;
  }
  .keys .col.p1 h4{ color:var(--mustard); }
  .keys .col.p2 h4{ color:var(--beige); }
  .keys .row{ display:flex; justify-content:space-between; padding:2px 0; }
  .keys .row b{ color:var(--toxic); font-weight:normal; letter-spacing:1px; }
  #title .ver{ position:absolute; bottom:10px; right:14px; font-size:16px; color:var(--dim); }
  #title .warn{
    position:absolute; bottom:32px; left:0; right:0; text-align:center;
    font-size:18px; color:var(--blood); letter-spacing:3px;
    animation:blink 1.8s steps(2) infinite;
  }

  /* ===== HUD ===== */
  #hud{ position:absolute; top:0; left:0; right:0; z-index:20; padding:10px 14px; pointer-events:none; }
  .hud-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .side{ width:42%; font-size:18px; }
  .side.left{ text-align:left; }
  .side.right{ text-align:right; }
  .side .name{
    font-family:'Press Start 2P', monospace; font-size:10px;
    margin-bottom:4px; letter-spacing:1px;
  }
  .side.left .name{ color:var(--mustard); text-shadow:0 0 6px rgba(212,200,106,.4); }
  .side.right .name{ color:var(--beige); text-shadow:0 0 6px rgba(201,185,129,.4); }

  .bar{
    position:relative; height:14px; background:var(--darker);
    border:2px solid var(--wall-dark);
    overflow:hidden;
  }
  .bar .fill{
    position:absolute; top:0; bottom:0;
    transition:width .15s linear;
  }
  .side.left .bar .fill{ left:0; background:linear-gradient(90deg, var(--blood-dark), var(--blood)); box-shadow:inset 0 0 6px rgba(255,255,255,.2); }
  .side.right .bar{ direction:rtl; }
  .side.right .bar .fill{ right:0; background:linear-gradient(270deg, var(--blood-dark), var(--blood)); box-shadow:inset 0 0 6px rgba(255,255,255,.2); }

  .obar{ height:8px; margin-top:3px; border-width:1px; }
  .side.left .obar .fill{ background:linear-gradient(90deg, var(--toxic-dim), var(--toxic)); }
  .side.right .obar .fill{ background:linear-gradient(270deg, var(--toxic-dim), var(--toxic)); }

  .items{ margin-top:4px; font-size:16px; color:var(--dim); }
  .items .fb{ color:var(--flash); }

  .center{ text-align:center; flex:0 0 auto; }
  .level-badge{
    font-family:'Press Start 2P', monospace;
    font-size:12px; color:var(--mustard);
    text-shadow:0 0 8px rgba(212,200,106,.5);
    padding:6px 12px;
    background:rgba(20,16,6,.8);
    border:1px solid var(--wall-dark);
  }
  .level-badge.low{ color:var(--blood); animation:blink .6s steps(2) infinite; }

  /* 小地图 */
  #minimap{
    position:absolute; right:10px; bottom:10px; z-index:20;
    width:140px; height:140px;
    background:rgba(10,8,4,.85);
    border:2px solid var(--wall-dark);
    image-rendering:pixelated;
  }

  /* 底部提示 */
  #hint{
    position:absolute; bottom:6px; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; padding:0 14px;
    font-size:16px; color:var(--dim); pointer-events:none;
  }

  /* ===== 结算界面 ===== */
  #result{
    background:rgba(5,3,0,.88);
    gap:14px;
  }
  #result .big{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(28px,6vw,64px);
    color:var(--blood);
    text-shadow:0 0 24px rgba(192,57,43,.6), 4px 4px 0 #1a0402;
    animation:kopop .6s cubic-bezier(.2,1.6,.4,1) both;
    letter-spacing:4px;
  }
  @keyframes kopop{ 0%{ transform:scale(.2) rotate(-6deg); opacity:0; } 60%{ transform:scale(1.1) rotate(2deg); } 100%{ transform:scale(1) rotate(0); } }
  #result .info{
    font-size:22px; color:var(--ink);
    line-height:1.6;
  }
  #result .info span{ color:var(--mustard); }
  #result .actions{ display:flex; gap:14px; margin-top:10px; }

  /* 血溅特效覆盖 */
  #bloodoverlay{
    position:absolute; inset:0; pointer-events:none; z-index:35;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(192,57,43,.35), transparent 40%),
      radial-gradient(ellipse at 75% 65%, rgba(192,57,43,.25), transparent 35%),
      radial-gradient(ellipse at 50% 85%, rgba(122,30,21,.3), transparent 30%);
    opacity:0;
    transition:opacity .3s;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="side left">
          <div class="name" id="p1name">ALPHA · 1P</div>
          <div class="bar"><div class="fill" id="p1hp" style="width:100%"></div></div>
          <div class="bar obar"><div class="fill" id="p1ox" style="width:100%"></div></div>
          <div class="items">闪光弹: <span class="fb" id="p1fb">3</span></div>
        </div>
        <div class="center">
          <div class="level-badge" id="levelBadge">LEVEL 0</div>
        </div>
        <div class="side right">
          <div class="name" id="p2name">BRAVO · AI</div>
          <div class="bar"><div class="fill" id="p2hp" style="width:100%"></div></div>
          <div class="bar obar"><div class="fill" id="p2ox" style="width:100%"></div></div>
          <div class="items">闪光弹: <span class="fb" id="p2fb">3</span></div>
        </div>
      </div>
    </div>

    <!-- 小地图 -->
    <canvas id="minimap" class="hidden" width="140" height="140"></canvas>

    <!-- 底部按键提示 -->
    <div id="hint" class="hidden">
      <div>P1: WASD移动·J攻击·K闪光弹·L格挡</div>
      <div>P2: 方向键·1攻击·2闪光弹·3格挡</div>
    </div>

    <!-- 血溅覆盖 -->
    <div id="bloodoverlay"></div>

    <!-- 标题界面 -->
    <div id="title" class="overlay">
      <div class="logo">
        <span class="l1">BACKROOMS</span>
        <span class="l2">ESCAPE</span>
        <span class="l3">后 室 逃 生</span>
      </div>
      <div class="sub">不要相信墙壁 · 不要回头</div>
      <div class="modes">
        <button class="pbtn active" id="mode1p">1P SOLO</button>
        <button class="pbtn" id="mode2p">2P CO-OP</button>
      </div>
      <div class="keys">
        <div class="col p1">
          <h4>P1 · ALPHA</h4>
          <div class="row"><span>移动</span><b>W A S D</b></div>
          <div class="row"><span>近战</span><b>J</b></div>
          <div class="row"><span>闪光弹</span><b>K</b></div>
          <div class="row"><span>格挡</span><b>L</b></div>
        </div>
        <div class="col p2">
          <h4>P2 · BRAVO</h4>
          <div class="row"><span>移动</span><b>↑ ↓ ← →</b></div>
          <div class="row"><span>近战</span><b>1</b></div>
          <div class="row"><span>闪光弹</span><b>2</b></div>
          <div class="row"><span>格挡</span><b>3</b></div>
        </div>
      </div>
      <div class="warn">WARNING: NO EXIT</div>
      <div class="ver">v1.0 · 按 Enter 开始</div>
    </div>

    <!-- 结算界面 -->
    <div id="result" class="overlay hidden">
      <div class="big" id="endTitle">YOU DIED</div>
      <div class="info">
        到达层数: <span id="endLevel">0</span><br/>
        存活时间: <span id="endTime">0s</span><br/>
        击杀数: <span id="endKills">0</span>
      </div>
      <div class="actions">
        <button class="pbtn" id="retry">TRY AGAIN</button>
        <button class="pbtn" id="tomenu">MAIN MENU</button>
      </div>
    </div>

    <!-- CRT 扫描线 -->
    <div id="crt"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
