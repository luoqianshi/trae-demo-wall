<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIXEL MECHA DUEL · 像素机甲对决</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* ===== 全局重置与像素基色 ===== */
  :root{
    --bg:#070713;
    --bg2:#0e0e22;
    --grid:#161630;
    --red:#ff2d55;
    --red-dim:#7a1530;
    --blue:#00d4ff;
    --blue-dim:#0a5a73;
    --gold:#ffd700;
    --energy:#ffe600;
    --warn:#ff8c00;
    --ink:#cfe8ff;
    --dim:#5a6a90;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#000;
    font-family:'VT323', monospace;
    color:var(--ink);
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #10102a 0%, #050510 70%, #000 100%);
  }

  /* ===== 游戏容器：固定 16:9 逻辑画布，CSS 缩放 ===== */
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 1.7778));
    aspect-ratio:16/9;
    background:#000;
    box-shadow:0 0 0 2px #1a1a2e, 0 0 40px rgba(0,212,255,.12), 0 0 80px rgba(255,45,85,.08);
    overflow:hidden;
  }
  #game{
    display:block;
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  /* ===== CRT 扫描线 + 暗角 ===== */
  #crt{
    position:absolute; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.18) 3px,
        rgba(0,0,0,0) 4px
      );
    mix-blend-mode:multiply;
  }
  #crt::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ===== 通用像素按钮 ===== */
  .pbtn{
    font-family:'Press Start 2P', monospace;
    font-size:12px; letter-spacing:1px;
    color:var(--ink);
    background:linear-gradient(180deg,#1a1a3a,#0d0d20);
    border:2px solid var(--dim);
    padding:14px 18px;
    cursor:pointer;
    position:relative;
    transition:transform .08s, border-color .12s, color .12s, box-shadow .12s;
    text-transform:uppercase;
  }
  .pbtn::before{
    content:""; position:absolute; inset:2px;
    border:1px solid rgba(255,255,255,.04); pointer-events:none;
  }
  .pbtn:hover{
    color:#fff;
    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(255,215,0,.35);
    transform:translateY(-2px);
  }
  .pbtn:active{ transform:translateY(0); }
  .pbtn.red:hover{ border-color:var(--red); box-shadow:0 0 0 1px var(--red),0 0 18px rgba(255,45,85,.4); }
  .pbtn.blue:hover{ border-color:var(--blue); box-shadow:0 0 0 1px var(--blue),0 0 18px rgba(0,212,255,.4); }
  .pbtn.active{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(255,215,0,.3); }

  /* ===== 覆盖层基类 ===== */
  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  .hidden{ display:none !important; }

  /* ===== 标题界面 ===== */
  #title{
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,45,85,.10), transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(0,212,255,.10), transparent 60%),
      linear-gradient(180deg, rgba(7,7,19,.92), rgba(7,7,19,.98));
    gap:0;
  }
  #title .logo{
    font-family:'Press Start 2P', monospace;
    line-height:1.5;
    margin-bottom:6px;
  }
  #title .logo .l1{ font-size:clamp(22px,5vw,52px); color:var(--red); text-shadow:0 0 18px rgba(255,45,85,.6), 4px 4px 0 #2a0008; }
  #title .logo .l2{ font-size:clamp(22px,5vw,52px); color:var(--blue); text-shadow:0 0 18px rgba(0,212,255,.6), 4px 4px 0 #001a22; display:block; }
  #title .logo .l3{ font-size:clamp(18px,4vw,40px); color:var(--gold); text-shadow:0 0 14px rgba(255,215,0,.5), 3px 3px 0 #2a2000; display:block; margin-top:6px; }
  #title .sub{
    font-family:'Press Start 2P', monospace; font-size:11px; color:var(--ink);
    margin:22px 0 26px; animation:blink 1.1s steps(2) infinite; letter-spacing:2px;
  }
  @keyframes blink{ 50%{ opacity:.15; } }
  .modes{ display:flex; gap:18px; margin-bottom:26px; flex-wrap:wrap; justify-content:center; }
  .keys{
    display:flex; gap:36px; flex-wrap:wrap; justify-content:center;
    font-family:'VT323', monospace; font-size:20px;
  }
  .keys .col{
    background:rgba(10,10,30,.7); border:1px solid var(--grid);
    padding:12px 18px; min-width:230px;
  }
  .keys .col h4{
    font-family:'Press Start 2P', monospace; font-size:10px; margin-bottom:10px;
    letter-spacing:1px;
  }
  .keys .col.p1 h4{ color:var(--red); }
  .keys .col.p2 h4{ color:var(--blue); }
  .keys .row{ display:flex; justify-content:space-between; padding:2px 0; color:var(--ink); }
  .keys .row b{ color:var(--gold); font-weight:normal; letter-spacing:1px; }
  #title .ver{ position:absolute; bottom:10px; right:14px; font-size:16px; color:var(--dim); }

  /* ===== HUD ===== */
  #hud{ position:absolute; top:0; left:0; right:0; z-index:20; padding:14px 18px; pointer-events:none; }
  .hud-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .side{ width:42%; }
  .side .name{
    font-family:'Press Start 2P', monospace; font-size:12px; margin-bottom:6px;
    letter-spacing:1px;
  }
  .side.left{ text-align:left; }
  .side.right{ text-align:right; }
  .side.left .name{ color:var(--red); text-shadow:0 0 8px rgba(255,45,85,.5); }
  .side.right .name{ color:var(--blue); text-shadow:0 0 8px rgba(0,212,255,.5); }

  .bar{
    position:relative; height:18px; background:#000;
    border:2px solid var(--dim);
    overflow:hidden;
  }
  .bar .fill{
    position:absolute; top:0; bottom:0;
    transition:width .12s linear;
  }
  .side.left .bar .fill{ left:0; background:linear-gradient(90deg, var(--red-dim), var(--red)); box-shadow:inset 0 0 8px rgba(255,255,255,.25); }
  .side.right .bar{ direction:rtl; }
  .side.right .bar .fill{ right:0; background:linear-gradient(270deg, var(--blue-dim), var(--blue)); box-shadow:inset 0 0 8px rgba(255,255,255,.25); }
  .bar .chip{
    position:absolute; top:0; bottom:0; width:3px; background:rgba(255,255,255,.5);
  }
  .ebar{ height:8px; margin-top:5px; border-width:1px; }
  .side.left .ebar .fill{ background:linear-gradient(90deg, #7a6500, var(--energy)); }
  .side.right .ebar .fill{ background:linear-gradient(270deg, #7a6500, var(--energy)); }
  .ebar.full .fill{ animation:epulse .5s steps(2) infinite; }
  @keyframes epulse{ 50%{ filter:brightness(1.6); } }

  .center{ text-align:center; flex:0 0 auto; }
  .rounds{ display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
  .dot{ width:12px; height:12px; border:2px solid var(--dim); background:#000; }
  .dot.win{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px rgba(255,215,0,.6); }
  .timer{
    font-family:'Press Start 2P', monospace; font-size:22px; color:var(--ink);
    text-shadow:0 0 8px rgba(0,212,255,.4);
  }
  .timer.low{ color:var(--warn); animation:blink .5s steps(2) infinite; }

  /* ===== 结算界面 ===== */
  #result{ background:rgba(5,5,12,.85); gap:18px; }
  #result .ko{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(40px,9vw,96px); color:var(--gold);
    text-shadow:0 0 30px rgba(255,215,0,.7), 6px 6px 0 #2a2000;
    animation:kopop .5s cubic-bezier(.2,1.6,.4,1) both;
    letter-spacing:6px;
  }
  @keyframes kopop{ 0%{ transform:scale(.2) rotate(-8deg); opacity:0; } 60%{ transform:scale(1.15) rotate(2deg); } 100%{ transform:scale(1) rotate(0); } }
  #result .winner{
    font-family:'Press Start 2P', monospace; font-size:16px; color:var(--ink);
    margin-bottom:4px; letter-spacing:2px;
  }
  #result .winner span{ color:var(--gold); }
  #result .actions{ display:flex; gap:16px; margin-top:14px; }

  /* ===== 战斗提示条 ===== */
  #announce{
    position:absolute; top:38%; left:0; right:0; z-index:25;
    text-align:center; pointer-events:none;
    font-family:'Press Start 2P', monospace;
    font-size:clamp(24px,5vw,52px);
    text-shadow:0 0 20px currentColor, 4px 4px 0 #000;
  }

  /* ===== 底部操作提示 ===== */
  #hint{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; padding:8px 16px;
    font-family:'VT323', monospace; font-size:17px; color:var(--dim);
    pointer-events:none;
    background:linear-gradient(0deg, rgba(0,0,0,.5), transparent);
  }
  #hint .h1{ color:#9a4050; } #hint .h2{ color:#3a7a90; }

  /* 暂停 */
  #pause{
    position:absolute; inset:0; z-index:40;
    background:rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P', monospace; font-size:22px; color:var(--gold);
    letter-spacing:3px;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="side left">
          <div class="name" id="p1name">CRIMSON</div>
          <div class="bar"><div class="fill" id="p1hp" style="width:100%"></div></div>
          <div class="bar ebar" id="p1ebar"><div class="fill" id="p1en" style="width:0%"></div></div>
        </div>
        <div class="center">
          <div class="rounds">
            <div class="dot" id="p1r0"></div>
            <div class="dot" id="p1r1"></div>
            <div class="dot" id="p2r0"></div>
            <div class="dot" id="p2r1"></div>
          </div>
          <div class="timer" id="timer">60</div>
        </div>
        <div class="side right">
          <div class="name" id="p2name">AZURE</div>
          <div class="bar"><div class="fill" id="p2hp" style="width:100%"></div></div>
          <div class="bar ebar" id="p2ebar"><div class="fill" id="p2en" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- 战斗中央播报 -->
    <div id="announce" class="hidden"></div>

    <!-- 底部按键提示 -->
    <div id="hint" class="hidden">
      <div class="h1">P1: WASD移动·J轻击·K重击·L格挡·U必杀</div>
      <div class="h2">P2: 方向键移动·1轻击·2重击·3格挡·4必杀</div>
    </div>

    <!-- 暂停 -->
    <div id="pause" class="hidden">PAUSED</div>

    <!-- 标题界面 -->
    <div id="title" class="overlay">
      <div class="logo">
        <span class="l1">PIXEL</span>
        <span class="l2">MECHA</span>
        <span class="l3">D U E L</span>
      </div>
      <div class="sub">SELECT BATTLE MODE</div>
      <div class="modes">
        <button class="pbtn red active" id="mode1p">1P vs CPU</button>
        <button class="pbtn blue" id="mode2p">2P LOCAL</button>
      </div>
      <div class="keys">
        <div class="col p1">
          <h4>P1 · CRIMSON</h4>
          <div class="row"><span>移动</span><b>A / D</b></div>
          <div class="row"><span>跳跃</span><b>W</b></div>
          <div class="row"><span>轻击</span><b>J</b></div>
          <div class="row"><span>重击</span><b>K</b></div>
          <div class="row"><span>格挡</span><b>L</b></div>
          <div class="row"><span>必杀</span><b>U</b></div>
        </div>
        <div class="col p2">
          <h4>P2 · AZURE</h4>
          <div class="row"><span>移动</span><b>← / →</b></div>
          <div class="row"><span>跳跃</span><b>↑</b></div>
          <div class="row"><span>轻击</span><b>1</b></div>
          <div class="row"><span>重击</span><b>2</b></div>
          <div class="row"><span>格挡</span><b>3</b></div>
          <div class="row"><span>必杀</span><b>4</b></div>
        </div>
      </div>
      <div class="ver">v1.0 · PRESS A MODE TO START</div>
    </div>

    <!-- 结算界面 -->
    <div id="result" class="overlay hidden">
      <div class="ko" id="koText">K.O.</div>
      <div class="winner" id="winText">CRIMSON WINS</div>
      <div class="actions">
        <button class="pbtn" id="rematch">REMATCH</button>
        <button class="pbtn" id="tomenu">MAIN MENU</button>
      </div>
    </div>

    <!-- CRT 扫描线 -->
    <div id="crt"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
