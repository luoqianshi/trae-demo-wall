<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古境 - 鸿门宴</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0D0D17;
            --bg-card: #161625;
            --bg-card-hover: #1E1E30;
            --brand-purple: #7C5CFC;
            --brand-purple-light: #9B7FFF;
            --brand-purple-dark: #6345E0;
            --accent-cyan: #00D4AA;
            --accent-cyan-dark: #00B894;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --text-muted: #6E6E8A;
            --border-color: #2A2A3E;
            --danger: #FF4757;
            --warning: #FFA502;
            --success: #00D4AA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* App Container */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: var(--bg-primary);
        }

        /* Status Bar */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 13, 23, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
        }

        .status-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--brand-purple), var(--brand-purple-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .status-info {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-item .label {
            color: var(--text-muted);
        }

        .status-item .value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px 8px;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.4;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-dot.active {
            background: var(--brand-purple);
            opacity: 1;
            box-shadow: 0 0 12px rgba(124, 92, 252, 0.5);
            transform: scale(1.3);
        }

        .progress-dot.completed {
            background: var(--accent-cyan);
            opacity: 1;
        }

        /* Main Content */
        .main-content {
            padding: 0 20px 100px;
        }

        /* Character Banner */
        .character-banner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .character-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2D1B69, #1a0f3c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid var(--brand-purple);
            flex-shrink: 0;
        }

        .character-info h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .character-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Scenario Card */
        .scenario-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.6s ease-out;
        }

        .scenario-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(124, 92, 252, 0.15);
            color: var(--brand-purple-light);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .scenario-content {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .scenario-content p {
            margin-bottom: 12px;
        }

        .scenario-content p:last-child {
            margin-bottom: 0;
        }

        /* Decision Title */
        .decision-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .option-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-item:hover {
            border-color: var(--brand-purple);
            background: var(--bg-card-hover);
        }

        .option-item.selected {
            border-color: var(--brand-purple);
            background: rgba(124, 92, 252, 0.1);
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.15);
        }

        .option-item.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-item.selected .option-letter {
            background: var(--brand-purple);
            color: white;
        }

        .option-text {
            font-size: 15px;
            line-height: 1.5;
            padding-top: 2px;
        }

        /* Free Input */
        .free-input-container {
            margin-bottom: 20px;
        }

        .free-input {
            width: 100%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            resize: none;
        }

        .free-input:focus {
            border-color: var(--brand-purple);
        }

        .free-input::placeholder {
            color: var(--text-muted);
        }

        .free-input.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Confirm Button */
        .confirm-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--brand-purple), var(--brand-purple-dark));
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            font-family: inherit;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 92, 252, 0.4);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        .confirm-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
            box-shadow: none;
        }

        /* Analysis Result */
        .analysis-result {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.8s ease-out;
            display: none;
        }

        .analysis-result.show {
            display: block;
        }

        .analysis-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .analysis-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-purple), var(--brand-purple-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .analysis-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .analysis-section {
            margin-bottom: 20px;
        }

        .analysis-section:last-child {
            margin-bottom: 0;
        }

        .analysis-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--brand-purple-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .analysis-section-content {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .quote-box {
            background: rgba(124, 92, 252, 0.08);
            border-left: 3px solid var(--brand-purple);
            padding: 14px 16px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
            font-family: 'Noto Serif SC', serif;
        }

        .quote-box .quote-source {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .quote-box .quote-text {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.7;
        }

        /* Next Button */
        .next-btn {
            width: 100%;
            background: transparent;
            color: var(--brand-purple-light);
            border: 2px solid var(--brand-purple);
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .next-btn:hover {
            background: rgba(124, 92, 252, 0.1);
        }

        /* Summary Page */
        .summary-page {
            display: none;
            padding: 20px 0 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        .summary-page.show {
            display: block;
        }

        .summary-header {
            text-align: center;
            margin-bottom: 32px;
            padding: 20px 0;
        }

        .summary-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-cyan-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(0, 212, 170, 0.3);
        }

        .summary-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .summary-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .summary-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .summary-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .summary-item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .summary-item-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-match {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent-cyan);
        }

        .badge-differ {
            background: rgba(255, 71, 87, 0.15);
            color: var(--danger);
        }

        .badge-partial {
            background: rgba(255, 165, 2, 0.15);
            color: var(--warning);
        }

        .summary-item-choice {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .summary-item-choice strong {
            color: var(--brand-purple-light);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, var(--brand-purple), var(--brand-purple-dark));
            color: white;
            border: none;
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 92, 252, 0.4);
        }

        .action-btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .action-btn-secondary:hover {
            border-color: var(--brand-purple);
        }

        .coming-soon-badge {
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(255, 165, 2, 0.2);
            color: var(--warning);
            border-radius: 10px;
            margin-left: 8px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .status-bar {
                padding: 10px 16px;
            }

            .main-content {
                padding: 0 16px 80px;
            }

            .scenario-card,
            .analysis-result,
            .summary-card {
                padding: 16px;
            }

            .decision-title {
                font-size: 18px;
            }
        }

        /* Decorative Elements */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 0%, rgba(124, 92, 252, 0.08) 0%, transparent 50%);
        }

        .content-layer {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="content-layer">
        <div class="app-container">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-bar-inner">
                    <div class="logo">
                        <div class="logo-icon">古</div>
                        <span>古境</span>
                    </div>
                    <div class="status-info">
                        <div class="status-item">
                            <span class="label">人物</span>
                            <span class="value">刘邦</span>
                        </div>
                        <div class="status-item">
                            <span class="label">场景</span>
                            <span class="value">1/1</span>
                        </div>
                        <div class="status-item">
                            <span class="label">决策</span>
                            <span class="value" id="decision-counter">1/5</span>
                        </div>
                    </div>
                </div>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-dot active" data-index="0"></div>
                    <div class="progress-dot" data-index="1"></div>
                    <div class="progress-dot" data-index="2"></div>
                    <div class="progress-dot" data-index="3"></div>
                    <div class="progress-dot" data-index="4"></div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content" id="main-content">
                <!-- Character Banner -->
                <div class="character-banner">
                    <div class="character-avatar">邦</div>
                    <div class="character-info">
                        <h2>刘邦</h2>
                        <p>汉王 · 鸿门宴赴宴者</p>
                    </div>
                </div>

                <!-- Scenario Card -->
                <div class="scenario-card" id="scenario-card">
                    <div class="scenario-tag">
                        <span>📜</span>
                        <span>【情境还原】</span>
                    </div>
                    <div class="scenario-content" id="scenario-content">
                        <!-- Dynamic content -->
                    </div>
                </div>

                <!-- Decision Title -->
                <h2 class="decision-title" id="decision-title">
                    <!-- Dynamic content -->
                </h2>

                <!-- Options -->
                <div class="options-container" id="options-container">
                    <!-- Dynamic options -->
                </div>

                <!-- Free Input -->
                <div class="free-input-container">
                    <textarea 
                        class="free-input" 
                        id="free-input" 
                        rows="3" 
                        placeholder="或者输入你自己的想法..."
                    ></textarea>
                </div>

                <!-- Confirm Button -->
                <button class="confirm-btn" id="confirm-btn">确认选择</button>

                <!-- Analysis Result -->
                <div class="analysis-result" id="analysis-result">
                    <div class="analysis-header">
                        <div class="analysis-icon">⚡</div>
                        <h3>AI 历史分析</h3>
                    </div>
                    <div id="analysis-content">
                        <!-- Dynamic analysis -->
                    </div>
                </div>

                <!-- Next Button -->
                <button class="next-btn" id="next-btn" style="display: none;">
                    进入下一场景
                    <span>→</span>
                </button>
            </div>

            <!-- Summary Page -->
            <div class="summary-page" id="summary-page">
                <div class="summary-header">
                    <div class="summary-icon">✓</div>
                    <h2>章节完成</h2>
                    <p>鸿门宴 · 刘邦视角</p>
                </div>

                <div class="summary-card">
                    <h3><span>📋</span> 决策回顾</h3>
                    <div id="summary-content">
                        <!-- Dynamic summary -->
                    </div>
                </div>

                <div class="summary-card">
                    <h3><span>📚</span> 原文延伸阅读</h3>
                    <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px;">
                        《史记·项羽本纪》详细记载了鸿门宴的全过程，是司马迁笔下最精彩的篇章之一。
                    </p>
                    <a href="https://www.shidianguji.com/" target="_blank" class="action-btn action-btn-secondary" style="margin: 0;">
                        <span>📖</span>
                        前往史籍阅读
                    </a>
                </div>

                <div class="action-buttons">
                    <button class="action-btn action-btn-primary" onclick="shareExperience()">
                        <span>🔗</span>
                        分享体验
                    </button>
                    <button class="action-btn action-btn-secondary" onclick="showComingSoon()">
                        <span>👤</span>
                        体验其他人物
                        <span class="coming-soon-badge">即将上线</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ DATA ============
        const decisions = [
            {
                scenario: `
                    <p>秦二世三年（公元前207年），刘邦先项羽一步攻入关中，秦王子婴投降。刘邦听从谋士建议，封存秦宫府库，还军霸上，并与关中百姓约法三章，深得民心。</p>
                    <p>项羽听闻刘邦欲王关中，勃然大怒。此时项羽拥兵四十万，驻军鸿门；刘邦仅有十万大军，实力悬殊。项羽的谋士范增更是极力劝说项羽趁机除掉刘邦，认为刘邦有天子之气，"此其志不在小"。</p>
                    <p>危急时刻，项羽的叔父项伯因与刘邦谋士张良有旧交，连夜潜入刘邦军营，私下会见张良，劝他速速离去。张良则将消息告知刘邦，刘邦面临人生最重要的抉择。</p>
                `,
                question: "去不去鸿门宴？",
                options: [
                    {
                        letter: "A",
                        text: "果断赴宴，当面解释误会，以表忠心",
                        analysisType: "history_match"
                    },
                    {
                        letter: "B",
                        text: "称病不去，连夜撤出关中，退回沛县",
                        analysisType: "escape"
                    },
                    {
                        letter: "C",
                        text: "集结兵力，据守函谷关，与项羽正面对抗",
                        analysisType: "confront"
                    }

                        text: "不辞而别，从小路速回军营，礼物由张良转交",
                        analysisType: "history_match"
                    },
                    {
                        letter: "B",
                        text: "返回帐中，正式向项羽辞行，以示光明磊落",
                        analysisType: "formal"
                    },
                    {
                        letter: "C",
                        text: "邀请项羽回访，以进一步缓和双方关系",
                        analysisType: "reciprocate"
                    }
                ],
                analysis: {
                    A: { text: "这是最优解。你先走，张良用礼物稳住场面，等刘邦安全到达军营后再暴露你已经离开的事实。历史上刘邦说'从此道至吾军，不过二十里耳。度我至军中，公乃入'——精确计算了路程时间，确保自己到安全地带后才让张良入帐告罪。张良献上白璧和玉斗，项羽欣然接受，范增拔剑撞碎玉斗，叹'竖子不足与谋'。这是典型的'金蝉脱壳'——用体面的形式掩盖果断的逃亡。" },
                    B: { text: "你的直觉是对的——赶紧走。但直接骑马离开有几个问题：一是不礼貌，可能激怒项羽派人追杀；二是你还没跟张良交代好后续事宜，没有人在帐内帮你收拾残局；三是从小路骑马，路上可能遇到伏兵。历史上刘邦虽然也是骑马离开，但他做了两件关键的事：一是让张良留下善后，献上礼物稳住场面；二是精确计算了路程时间，确保张良在自己安全后才入帐。" },
                    C: { text: "你想要体面地离开，这个想法可以理解。但问题是，项羽虽然暂时放过了你，范增还在旁边虎视眈眈。正式告辞意味着要走完整个礼仪流程——向项羽行礼、说一番客套话、等待项羽回应——这给了范增再次进言的时间窗口。范增的执念是'此其志不在小'，一旦你多留一分钟，他就多一分钟劝杀你的机会。《史记》记载刘邦'起如厕，因招樊哙出'后，没有返回帐中，而是直接从小路回军——不辞而别恰恰是保命的关键。" },
                    custom: { text: "你提出了自己的想法，宴会如何脱身确实是最后也是最关键的一步。樊哙已经说得很到位了：'大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？'在生死面前，体面是奢侈品。历史上刘邦选择了最务实的方案——张良善后、自己先撤、精算时间——每一步都是为了保命。" },
                    history: "历史上，刘邦选择不辞而别，从小路骑马急归霸上。他让张良留下辞谢，并献上白璧、玉斗作为礼物。这一决定体现了刘邦'务实第一'的性格——在生死存亡之际，礼节是次要的，活下来才是首要目标。",
                    connection: "'大行不顾细谨，大礼不辞小让'——这是樊哙对刘邦说的，也是刘邦一生的行为准则。在关键时刻，不要被形式主义束缚。刘邦的不辞而别，看似失礼，实则保全了自己和整个集团。范增的叹息'竖子不足与谋'，正是对项羽错失良机的痛心。",
                    quote: "沛公谓张良曰：'从此道至吾军，不过二十里耳。度我至军中，公乃入。'沛公已去，间至军中。张良入谢，曰：'沛公不胜桮杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下，玉斗一双，再拜奉大将军足下。'项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰：'唉！竖子不足与谋！夺项王天下者，必沛公也。吾属今为之虏矣！'",
                    source: "《史记·项羽本纪》"
                }
            }
        ];

        // ============ STATE ============
        let currentDecision = 0;
        let userChoices = [];
        let selectedOption = null;
        let hasConfirmed = false;

        // ============ DOM ELEMENTS ============
        const els = {
            decisionCounter: document.getElementById('decision-counter'),
            progressDots: document.querySelectorAll('.progress-dot'),
            scenarioContent: document.getElementById('scenario-content'),
            decisionTitle: document.getElementById('decision-title'),
            optionsContainer: document.getElementById('options-container'),
            freeInput: document.getElementById('free-input'),
            confirmBtn: document.getElementById('confirm-btn'),
            analysisResult: document.getElementById('analysis-result'),
            analysisContent: document.getElementById('analysis-content'),
            nextBtn: document.getElementById('next-btn'),
            mainContent: document.getElementById('main-content'),
            summaryPage: document.getElementById('summary-page'),
            summaryContent: document.getElementById('summary-content')
        };

        // ============ FUNCTIONS ============
        function init() {
            renderDecision();
            updateProgress();
        }

        function updateProgress() {
            els.decisionCounter.textContent = `${currentDecision + 1}/5`;
            els.progressDots.forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                if (index < currentDecision) {
                    dot.classList.add('completed');
                } else if (index === currentDecision) {
                    dot.classList.add('active');
                }
            });
        }

        function renderDecision() {
            const decision = decisions[currentDecision];
            
            // Reset state
            selectedOption = null;
            hasConfirmed = false;
            
            // Render scenario
            els.scenarioContent.innerHTML = decision.scenario;
            
            // Render question
            els.decisionTitle.textContent = decision.question;
            
            // Render options
            els.optionsContainer.innerHTML = decision.options.map((opt, index) => `
                <div class="option-item" data-index="${index}" onclick="selectOption(${index})">
                    <div class="option-letter">${opt.letter}</div>
                    <div class="option-text">${opt.text}</div>
                </div>
            `).join('');
            
            // Reset inputs
            els.freeInput.value = '';
            els.freeInput.classList.remove('disabled');
            els.freeInput.disabled = false;
            
            // Reset buttons
            els.confirmBtn.disabled = false;
            els.confirmBtn.textContent = '确认选择';
            
            // Hide analysis and next
            els.analysisResult.classList.remove('show');
            els.nextBtn.style.display = 'none';
        }

        function selectOption(index) {
            if (hasConfirmed) return;
            
            selectedOption = index;
            
            // Update UI
            document.querySelectorAll('.option-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
            
            // Clear free input
            els.freeInput.value = '';
        }

        // Free input handler
        els.freeInput.addEventListener('input', function() {
            if (hasConfirmed) return;
            
            if (this.value.trim()) {
                // Clear option selection
                selectedOption = null;
                document.querySelectorAll('.option-item').forEach(item => {
                    item.classList.remove('selected');
                });
            }
        });

        els.confirmBtn.addEventListener('click', function() {
            if (hasConfirmed) return;
            
            const freeText = els.freeInput.value.trim();
            
            if (selectedOption === null && !freeText) {
                shakeElement(els.confirmBtn);
                return;
            }
            
            hasConfirmed = true;
            
            // Disable options and input
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.add('disabled');
            });
            els.freeInput.classList.add('disabled');
            els.freeInput.disabled = true;
            els.confirmBtn.disabled = true;
            els.confirmBtn.textContent = '已确认';
            
            // Record choice
            const decision = decisions[currentDecision];
            let choiceText;
            if (selectedOption !== null) {
                choiceText = decision.options[selectedOption].text;
            } else {
                choiceText = freeText;
            }
            userChoices.push({
                decisionIndex: currentDecision,
                choiceText: choiceText,
                question: decision.question,
                isCustom: selectedOption === null,
                selectedLetter: selectedOption !== null ? decision.options[selectedOption].letter : 'custom'
            });
            
            // Show analysis
            renderAnalysis(decision);
            els.analysisResult.classList.add('show');
            
            // Show next button or finish
            if (currentDecision < 4) {
                els.nextBtn.style.display = 'flex';
            } else {
                els.nextBtn.style.display = 'flex';
                els.nextBtn.textContent = '查看章节总结';
            }
        });

        function renderAnalysis(decision) {
            const a = decision.analysis;
            // Determine which choice analysis to show based on user's selection
            const lastChoice = userChoices[userChoices.length - 1];
            let choiceAnalysisText = '';
            if (lastChoice.isCustom) {
                choiceAnalysisText = a.custom ? a.custom.text : '';
            } else {
                const letter = lastChoice.selectedLetter;
                choiceAnalysisText = a[letter] ? a[letter].text : '';
            }
            
            els.analysisContent.innerHTML = `
                <div class="analysis-section">
                    <div class="analysis-section-title">
                        <span>💡</span>
                        <span>你的选择分析</span>
                    </div>
                    <div class="analysis-section-content">
                        ${choiceAnalysisText}
                    </div>
                </div>
                <div class="analysis-section">
                    <div class="analysis-section-title">
                        <span>📜</span>
                        <span>历史实际</span>
                    </div>
                    <div class="analysis-section-content">
                        ${a.history}
                    </div>
                </div>
                <div class="analysis-section">
                    <div class="analysis-section-title">
                        <span>🔗</span>
                        <span>古今连接</span>
                    </div>
                    <div class="analysis-section-content">
                        ${a.connection}
                    </div>
                </div>
                <div class="analysis-section">
                    <div class="analysis-section-title">
                        <span>📖</span>
                        <span>《史记》原文</span>
                    </div>
                    <div class="quote-box">
                        <div class="quote-text">${a.quote}</div>
                        <div class="quote-source">—— ${a.source}</div>
                    </div>
                </div>
            `;
        }

        els.nextBtn.addEventListener('click', function() {
            if (currentDecision < 4) {
                currentDecision++;
                renderDecision();
                updateProgress();
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showSummary();
            }
        });

        function showSummary() {
            els.mainContent.style.display = 'none';
            els.summaryPage.classList.add('show');
            document.querySelector('.status-bar').style.display = 'none';
            
            // Generate summary content
            let summaryHTML = '';
            userChoices.forEach((choice, index) => {
                const decision = decisions[choice.decisionIndex];
                let badgeClass = 'badge-differ';
                let badgeText = '不同';
                
                if (!choice.isCustom) {
                    const selectedOpt = decision.options[choice.decisionIndex === index ? 
                        decision.options.findIndex(o => o.text === choice.choiceText) : 0];
                    if (selectedOpt && selectedOpt.analysisType === 'history_match') {
                        badgeClass = 'badge-match';
                        badgeText = '相符';
                    }
                }
                
                summaryHTML += `
                    <div class="summary-item">
                        <div class="summary-item-header">
                            <span class="summary-item-title">决策 ${index + 1}：${choice.question}</span>
                            <span class="summary-item-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="summary-item-choice">
                            <strong>你的选择：</strong>${choice.choiceText}
                        </div>
                        <div class="summary-item-choice" style="margin-top: 4px;">
                            <strong>历史做法：</strong>${getHistoryChoice(index)}
                        </div>
                    </div>
                `;
            });
            
            els.summaryContent.innerHTML = summaryHTML;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getHistoryChoice(index) {
            const historyChoices = [
                "果断赴宴，当面解释误会",
                "卑辞厚礼，把误会归咎于小人挑拨",
                "借如厕之名离席，暂避杀机",
                "默许樊哙为自己辩护，打破僵局",
                "不辞而别，从小路速归军营"
            ];
            return historyChoices[index] || "见《史记》记载";
        }

        function shareExperience() {
            const text = `我在【古境】体验了刘邦的鸿门宴，做出了5个关键决策。如果是你，能否比刘邦做得更好？`;
            if (navigator.share) {
                navigator.share({
                    title: '古境 - 鸿门宴',
                    text: text,
                    url: window.location.href
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(text + ' ' + window.location.href).then(() => {
                    alert('分享文案已复制到剪贴板');
                });
            }
        }

        function showComingSoon() {
            alert('其他人物视角即将上线，敬请期待！');
        }

        function shakeElement(element) {
            element.style.animation = 'none';
            element.offsetHeight; // Trigger reflow
            element.style.animation = 'shake 0.5s ease-in-out';
            setTimeout(() => {
                element.style.animation = '';
            }, 500);
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // Initialize
        init();
    </script>
</body>
</html>
