es})}),l},K0=no("c001",[{question:"您好，请问您对北京肿瘤医院乳腺肿瘤内科的流程熟悉吗？",answer:"非常熟悉，我每个月在那边至少20单，从挂号、分诊、抽血、做检查到取药取报告，整个流程都熟门熟路。乳腺内科在门诊楼3层B区，主任是王教授，周二周四出诊，副主任李医师周一三五全天。抽血在2楼检验科，一般8点开始叫号，建议7:45到能排前面。B超在4层影像科，乳腺钼靶要去医技楼1层。",score:9.5,notes:"对医院和科室非常熟悉，能说出具体医生出诊时间和各检查科室位置，细节丰富，可信度高。",time:"2026-07-13T09:00:00"},{question:"请介绍一下您的专业背景，以及为什么适合乳腺肿瘤患者的陪诊？",answer:"我之前是三甲医院肿瘤科的护士，干了20年临床护理，退休后做陪诊已经8年了。乳腺肿瘤患者的特点是情绪波动大，需要更多心理安抚，我在肿瘤科工作时见过太多这样的患者，知道怎么跟她们沟通。复查的项目、各项指标怎么看，我也能给患者讲明白，让她们不用太焦虑。而且我自己也是女性，患者跟我在一起也比较自在。",score:9.2,notes:"专业背景扎实，20年肿瘤科护士经验，理解乳腺肿瘤患者的心理特点，性别优势明显。",time:"2026-07-13T09:02:00"},{question:"如果是乳腺肿瘤复查，您一般的服务流程是怎样的？",answer:"复查的话，我一般提前一天跟患者确认好时间和注意事项，提醒空腹、带齐之前的病历资料。当天我会提前半小时到医院，先帮患者取号、刷报到。然后陪患者见医生，医生开了检查单我马上去缴费预约。需要抽血的话先抽，因为空腹嘛。然后根据检查预约的时间安排顺序，尽量减少等待。所有结果出来后，我会整理好再带患者去找医生看结果，医生说的话我都会详细记下来，最后帮患者取药，把医嘱和注意事项一条条跟患者和家属说清楚。",score:9,notes:"服务流程清晰完整，考虑周到，注重效率和患者体验，有记录和反馈意识。",time:"2026-07-13T09:04:00"},{question:"如果患者在就诊过程中突然情绪低落或者哭了，您会怎么处理？",answer:'这种情况太常见了，特别是看到检查结果不理想的时候。我一般不会急着劝，先给她递张纸巾，陪她坐一会儿，等她稍微平复一点再慢慢说。我会跟她说"我见过很多比这情况还复杂的，最后都好好的"，给她一些信心。如果需要的话，我也会帮她跟医生多问问治疗方案，让她心里有底。总之就是多陪伴、多倾听，让她觉得不是一个人在面对。',score:9.3,notes:"情绪处理能力强，有共情能力，方法得当，体现了丰富的临床经验和人文关怀。",time:"2026-07-13T09:06:00"},{question:"您的复查套餐价格是598元，具体包含哪些服务？有没有额外收费的项目？",answer:"复查套餐是从患者到医院开始，到所有看完取完药结束，一般是半天到一天，不按时间卡。包含挂号取号、陪同就诊、各项检查陪同等，取药取报告也都包含。如果需要帮患者邮寄药品或者报告，顺丰到付就行，我不收跑腿费。要是患者中午还没看完，我帮忙买个饭什么的也都是应该的。总之就是确保这次复查的所有事情我都帮着弄好，没有额外收费。",score:8.8,notes:"价格说明清晰，服务范围明确，不额外收费的承诺增加了信任感。",time:"2026-07-13T09:08:00"},{question:"最后一个问题，如果患者的检查结果不好，需要进一步治疗，您会怎么跟患者和家属沟通？",answer:"我一般不会直接跟患者说结果不好，都是先跟家属沟通清楚，然后商量怎么跟患者说比较合适。有的患者心理承受能力强，可以直说；有的就需要慢慢渗透。医生那边我也会提前沟通好，让医生说话的时候注意方式。后续如果需要住院、约手术、找专家，我也可以帮着联系，告诉家属下一步该怎么走。毕竟我在这行干这么久，各方面的资源还是有的。",score:9.4,notes:"沟通策略成熟，考虑周全，能提供超出陪诊本身的增值服务，资源丰富。",time:"2026-07-13T09:10:00"}]),G0=no("c002",[{question:"您好，请问您对北京肿瘤医院乳腺肿瘤内科的流程熟悉吗？",answer:"北京肿瘤医院我去过不少次，但主要是陪其他科室的患者，乳腺内科专门陪的不多，大概十几次吧。医院的整体布局我是熟悉的，挂号、缴费、取药这些流程都没问题。具体到乳腺内科的话，在门诊楼3层，这个我知道，但具体哪个医生擅长什么、检查的先后顺序这些，我可能需要提前做点功课。不过您放心，我提前去踩个点，肯定不会耽误事的。",score:7,notes:"对医院整体熟悉，但乳腺内科专科经验有限，坦诚说明情况，态度积极。",time:"2026-07-13T09:15:00"},{question:"请介绍一下您的专业背景，以及为什么适合乳腺肿瘤患者的陪诊？",answer:"我之前是内科主治医师，从医30年，退休后做陪诊6年了。虽然不是肿瘤科专科，但内科的基础很扎实，各种化验报告、检查结果我都能看懂，医生说的话我能准确理解并传达给患者。乳腺肿瘤的复查，主要就是看各项指标、评估疗效，这方面我的医学背景是有优势的。患者有什么疑问，我也能从专业角度给一些解释，不会一问三不知。",score:8.5,notes:"内科医生背景，医学知识扎实，能理解和解释医疗信息，对患者很有帮助。",time:"2026-07-13T09:17:00"},{question:"如果是乳腺肿瘤复查，您一般的服务流程是怎样的？",answer:"我的流程是这样的：提前一天跟患者确认注意事项，特别是空腹、带资料这些。当天我会提前到医院，先把号取了。陪患者看诊的时候，我会把医生说的都记下来，特别是治疗方案的变化。检查的话，我会合理安排顺序，尽量不让患者多跑路。结果出来后，我会先帮着看看有没有异常，心里有个数，然后再带患者找医生。最后取药的时候，我会把每种药怎么吃、有什么注意事项，都写在药盒上，免得患者记混。",score:8.2,notes:"流程规范，注重医嘱记录和用药指导，体现了医生的职业习惯。",time:"2026-07-13T09:19:00"},{question:"如果患者在就诊过程中突然情绪低落或者哭了，您会怎么处理？",answer:'情绪问题确实很常见，我一般会先让患者冷静一下，然后跟她说"既来之则安之，现在医学这么发达，总有办法的"。我会把医生的话再给她解释一遍，让她明白病情到底是什么情况，不要自己瞎想。很多时候患者情绪不好是因为不了解、害怕，把道理讲清楚了就好了。如果实在严重，我会建议家属多陪陪，或者找心理医生看看。',score:7.5,notes:"有一定的情绪处理能力，但偏理性分析，共情和情感支持相对弱一些。",time:"2026-07-13T09:21:00"},{question:"您的复查套餐价格是558元，具体包含哪些服务？有没有额外收费的项目？",answer:"558元就是陪诊一天的费用，从上午到下午下班，中间所有陪诊服务都包含。挂号费、检查费这些是医院收的，患者自己付。如果需要我帮忙买药、寄东西，实报实销，我不加钱。一般复查半天就够了，要是上午就能看完，也还是这个价，不会因为时间短就便宜。我觉得做事情要有始有终，不能按时间算那么死。",score:8,notes:"价格合理，服务范围清晰，态度实在。",time:"2026-07-13T09:23:00"},{question:"最后一个问题，如果患者的检查结果不好，需要进一步治疗，您会怎么跟患者和家属沟通？",answer:"这种情况我会如实跟家属说，毕竟家属有知情权。至于跟不跟患者说、说到什么程度，由家属来决定，我配合。作为医生出身，我可以帮家属分析一下病情，解释一下各种治疗方案的利弊，让家属心里有数。后续如果需要转诊、找专家，我也可以给些建议，但最终还是要家属自己拿主意。",score:8.3,notes:"沟通方式稳妥，能提供医学专业建议，边界感清晰。",time:"2026-07-13T09:25:00"},{question:"再问一下，您近期在北京肿瘤医院乳腺内科有陪诊过吗？对最新的就诊流程有没有了解？",answer:"最近一次是去年年底陪一个亲戚去过，这半年确实没怎么去乳腺内科。不过医院的流程变化不会太大，再说我做了这么多年陪诊，适应能力还是很强的，提前去了解一下肯定没问题。如果您担心的话，我可以提前一天去医院踩个点，把流程都摸清楚，保证当天顺顺利利的。",score:7.2,notes:"近期乳腺内科经验不足，但愿意提前准备，态度诚恳。",time:"2026-07-13T09:27:00"}]),X0=no("c008",[{question:"您好，请问您对北京肿瘤医院乳腺肿瘤内科的流程熟悉吗？",answer:"太熟悉了，北京肿瘤医院是我最常去的医院，每个月二三十单是有的，其中乳腺内科占了将近一半。乳腺内科在门诊楼3层B区，一共8个诊室，1-4是初诊，5-8是复诊。王主任周二周四上午专家号，李副主任周一三下午，这个月新加了个年轻的张医生，周五上午专科门诊。抽血在2楼，B超4层，钼靶医技楼1层，骨扫描在核医学科要提前预约。我跟不少护士都熟，有时候排不上队还能帮帮忙。",score:9.8,notes:"对医院科室极其熟悉，细节非常丰富，甚至了解医生排班变化和人脉资源，专业度极高。",time:"2026-07-13T09:30:00"},{question:"请介绍一下您的专业背景，以及为什么适合乳腺肿瘤患者的陪诊？",answer:"我做陪诊9年了，之前是外科护士，有15年临床经验。我陪过的肿瘤患者没有一千也有八百，乳腺肿瘤更是最常见的。我太了解这些患者了，刚确诊的恐惧、复查前的焦虑、看到结果不好的崩溃，我都见得多了。我不仅能陪她们看病，还能陪她们聊天，帮她们疏解情绪。我还有营养师证，术后恢复、饮食调理这些我也能给建议。说句实在话，很多患者跟我处得比亲戚还亲。",score:9.6,notes:"经验极其丰富，专业背景强，不仅有护理经验还有营养师证，能提供全方位支持。",time:"2026-07-13T09:32:00"},{question:"如果是乳腺肿瘤复查，您一般的服务流程是怎样的？",answer:"复查我可有一套标准流程了。提前两天我就会跟患者和家属通个电话，确认时间、提醒注意事项，还会问问最近身体怎么样，有没有哪里不舒服，提前心里有数。前一天我会把患者之前的病历、检查报告都整理一遍，列个时间线，见医生的时候一目了然。当天我至少提前40分钟到，先取号、刷报到，能提前约的检查我先约上。患者到了直接就能看，不等。看完医生，我会把所有注意事项整理成文字发给家属，怕她们记不住。过个三五天，我还会回访一下，问问情况。",score:9.7,notes:"服务流程非常完善，超出预期，有提前准备、过程管理和后续跟进，极其专业。",time:"2026-07-13T09:34:00"},{question:"如果患者在就诊过程中突然情绪低落或者哭了，您会怎么处理？",answer:'哎呀，这个太有经验了。我一般先不说大道理，就是抱着她拍拍背，让她哭出来，憋在心里反而不好。等她哭够了，我就给她讲讲我陪过的类似情况的患者，现在都挺好的，给她希望。有时候我还会把之前患者给我发的微信给她看，说"你看这个阿姨，当初比你还严重呢，现在都跳广场舞去了"。人嘛，就怕没个盼头，有了榜样就有力量了。我常跟患者说，你就把我当你老姐妹，有啥话都能跟我说。',score:9.8,notes:"情绪处理能力极强，有温度有方法，善于用真实案例鼓励患者，共情能力满分。",time:"2026-07-13T09:36:00"},{question:"您的复查套餐价格是668元，比其他陪诊师要高一些，能说说为什么吗？",answer:"确实，我的价格不是最便宜的，但我敢说我的服务绝对值这个价。第一，我经验多，9年了，什么情况都遇到过，不会慌；第二，我专业，护士出身还有营养师证，能给的建议比一般陪诊师多；第三，我服务到位，提前整理病历、事后回访，这些很多人不做的；第四，我在北京肿瘤医院人头熟，有时候加号、约检查，我去说句话就管用。最重要的是，我是真心把患者当家人，不是为了赚这一单的钱，很多患者都跟我成了朋友，年年给我寄特产呢。",score:9,notes:"价格虽高但价值清晰，能说出具体的差异化优势，有理有据。",time:"2026-07-13T09:38:00"},{question:"最后一个问题，如果患者的检查结果不好，需要进一步治疗，您会怎么跟患者和家属沟通？",answer:"这个事情很重要，得讲究方式方法。我一般是先把家属拉到一边，把情况实打实说清楚，包括病情到什么程度了、接下来有哪些选择、大概要花多少钱、预后怎么样，让家属心里有底。然后跟家属商量，患者那边怎么说。有的患者性格坚强，可以直说；有的就需要慢慢来。我还会帮着出主意，比如下一步该找哪个专家、要不要去其他医院再看看、有没有临床试验可以参加，这些我门儿清。总之一句话，天塌下来有高个儿顶着，我陪着她们一起想办法。",score:9.7,notes:"沟通策略非常成熟，考虑周全，能提供实质性的资源和建议，给人很强的安全感。",time:"2026-07-13T09:40:00"}]),Z0=[{id:Sr,patientId:"p001",patientNeeds:{hospital:"北京肿瘤医院",department:"乳腺肿瘤内科",date:"2026-07-26",requirements:["复查陪诊","情绪安抚","报告解读","取药取报告"],specialNotes:"患者62岁女性，乳腺癌术后3年复查，性格偏内向，容易焦虑，需要有耐心、善于沟通的陪诊师。之前一直是李慧珍陪诊，但这次想看看有没有更合适的选择。"},status:"completed",companionsInterviewed:["c001","c002","c008"],companionsSelected:["c008","c001"],interviews:[{compa
