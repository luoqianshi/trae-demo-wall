<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当局者 - 过来人说</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #FAF6F1;
    --card: #FFFFFF;
    --accent: #A67C52;
    --accent-light: #C49A6C;
    --fg: #2C2418;
    --muted: #9B8E7E;
    --border: rgba(166, 124, 82, 0.12);
    --shadow: rgba(44, 36, 24, 0.06);
    --shadow-accent: rgba(166, 124, 82, 0.25);
    --radius: 16px;
  }

  html {
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* ========== Header ========== */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .back-btn {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: none;
    background: var(--card);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--accent);
    text-decoration: none;
    font-size: 20px;
    line-height: 1;
  }

  .back-btn:hover {
    box-shadow: 0 4px 16px var(--shadow-accent);
    transform: translateY(-50%) scale(1.05);
  }

  .header-tag {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 2px;
    padding: 4px 16px;
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px var(--shadow);
  }

  /* ========== Main Content ========== */
  .main {
    flex: 1;
    padding: 8px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .guide-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--fg);
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  .guide-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* ========== Age Cards Grid ========== */
  .age-grid {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .age-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    text-decoration: none;
    color: var(--fg);
    transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    box-shadow: 0 2px 10px var(--shadow);
    opacity: 0;
    transform: translateY(24px);
    animation: cardFadeIn 0.5s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .age-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 0 4px 4px 0;
  }

  .age-card:hover,
  .age-card:active {
    border-color: var(--accent-light);
    box-shadow: 0 6px 24px var(--shadow-accent);
    transform: translateY(-2px) scale(1.01);
  }

  .age-card:hover::before,
  .age-card:active::before,
  .age-card.selected::before {
    opacity: 1;
  }

  .age-card.selected {
    border-color: var(--accent);
    box-shadow: 0 4px 20px var(--shadow-accent), 0 0 0 3px rgba(166, 124, 82, 0.1);
    background: linear-gradient(135deg, #FFFCF8 0%, #FFFFFF 100%);
  }

  .age-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #F5EDE4 0%, #EDE3D7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    transition: transform 0.3s, background 0.3s;
  }

  .age-card:hover .age-icon,
  .age-card.selected .age-icon {
    background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
    transform: scale(1.08);
  }

  .age-icon span {
    filter: grayscale(0.3);
    transition: filter 0.3s ease;
  }

  .age-card:hover .age-icon span,
  .age-card.selected .age-icon span {
    filter: grayscale(0);
  }

  .age-info {
    flex: 1;
    min-width: 0;
  }

  .age-range {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }

  .age-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.4;
  }

  .age-arrow {
    color: var(--border);
    font-size: 16px;
    flex-shrink: 0;
    transition: transform 0.3s;
  }

  .age-card:hover .age-arrow,
  .age-card.selected .age-arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  /* ========== Stagger Animation ========== */
  @keyframes cardFadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .age-card:nth-child(1) { animation-delay: 0.08s; }
  .age-card:nth-child(2) { animation-delay: 0.16s; }
  .age-card:nth-child(3) { animation-delay: 0.24s; }
  .age-card:nth-child(4) { animation-delay: 0.32s; }
  .age-card:nth-child(5) { animation-delay: 0.40s; }
  .age-card:nth-child(6) { animation-delay: 0.48s; }

  /* ========== Footer Slogan ========== */
  .footer {
    text-align: center;
    padding: 20px 24px 32px;
    width: 100%;
  }

  .slogan {
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    opacity: 0.8;
    opacity: 0;
    animation: fadeInSlow 0.8s ease 0.7s forwards;
  }

  @keyframes fadeInSlow {
    to { opacity: 0.8; }
  }

  /* ========== Decorative ambient ========== */
  .ambient-glow {
    position: fixed;
    top: -120px;
    right: -80px;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(166, 124, 82, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .ambient-glow-bottom {
    position: fixed;
    bottom: -80px;
    left: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(196, 154, 108, 0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ========== Responsive fine-tuning ========== */
  @media (max-width: 360px) {
    .guide-text { font-size: 19px; }
    .age-card { padding: 16px 18px; gap: 12px; }
    .age-icon { width: 42px; height: 42px; font-size: 20px; }
    .age-range { font-size: 15px; }
  }

  @media (min-width: 481px) {
    body { padding-top: 20px; }
  }

  .back-btn:focus-visible, .age-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .age-card {
    touch-action: manipulation;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- Decorative ambient glows -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-bottom"></div>

  <!-- Header -->
  <header class="header">
    <a href="guolai-ren-gate.html" class="back-btn" aria-label="返回">&larr;</a>
    <h1 class="header-tag" style="font-size:inherit;font-weight:inherit;margin:0;">当局者</h1>
  </header>

  <!-- Main Content -->
  <main class="main">
    <p class="guide-text">我正处在人生的第___年</p>
    <p class="guide-sub">选择你当前的人生阶段</p>

    <div class="age-grid">

      <!-- 18岁以下 -->
      <a href="guolai-ren-demo-young.html" class="age-card" data-age="0-18" onclick="selectAge(this, event)">
        <div class="age-icon"><span>&#127807;</span></div>
        <div class="age-info">
          <div class="age-range">18岁以下</div>
          <div class="age-label">天真烂漫 &middot; 少年时光</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 18-25 -->
      <a href="guolai-ren-demo-young.html" class="age-card" data-age="18-25" onclick="selectAge(this, event)">
        <div class="age-icon"><span>&#127804;</span></div>
        <div class="age-info">
          <div class="age-range">18&ndash;25岁</div>
          <div class="age-label">不知天高地厚 &middot; 初入社会</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 25-30 -->
      <a href="guolai-ren-demo-young.html" class="age-card" data-age="25-30" onclick="selectAge(this, event)">
        <div class="age-icon"><span>&#127793;</span></div>
        <div class="age-info">
          <div class="age-range">25&ndash;30岁</div>
          <div class="age-label">摸索前行 &middot; 成家立业</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 30-40 -->
      <a href="guolai-ren-demo-young.html" class="age-card" data-age="30-40" onclick="selectAge(this, event)">
        <div class="age-icon"><span>&#127752;</span></div>
        <div class="age-info">
          <div class="age-range">30&ndash;40岁</div>
          <div class="age-label">上有老下有小 &middot; 中年承压</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 40-50 -->
      <a href="guolai-ren-demo-young.html" class="age-card" data-age="40-50" onclick="selectAge(this, event)">
        <div class="age-icon"><span>&#127810;</span></div>
        <div class="age-info">
          <div class="age-range">40&ndash;50岁</div>
          <div class="age-label">回头看路 &middot; 知天命</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="slogan">把我人生的咸，化你生活的甜</p>
  </footer>

  <script>
    function selectAge(card, event) {
      // Remove previous selection
      document.querySelectorAll('.age-card.selected').forEach(c => c.classList.remove('selected'));
      // Add selection with a brief delay for visual feedback before navigation
      card.classList.add('selected');

      // Store selected age in sessionStorage for downstream pages
      const age = card.getAttribute('data-age');
      if (typeof sessionStorage !== 'undefined') {
        sessionStorage.setItem('guolai-ren-age', age);
      }

      // Let the link navigate naturally (href handles it)
    }
  </script>

</body>
</html>
