<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <title>过来人说</title>
  <style>

    :root {
      --bg: #0B1426;
      --bg-deep: #070E1A;
      --ink: #D4CFC7;
      --muted: #7A7670;
      --accent: #C9A96E;
      --accent-glow: rgba(201, 169, 110, 0.35);
      --accent-dim: rgba(201, 169, 110, 0.12);
      --cool-border: rgba(130, 155, 195, 0.3);
      --cool-glow: rgba(130, 155, 195, 0.2);
      --font: 'Noto Sans SC', sans-serif;
      --font-serif: 'Noto Serif SC', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: page-fade-in 1.2s ease-out 0.1s forwards;
    }

    @keyframes page-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== LAYOUT ===== */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== FULL-SCREEN PARTICLE CANVAS ===== */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      max-width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER (sticky) ===== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: rgba(11, 20, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(201, 169, 110, 0.08);
    }

    .app-header h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(201, 169, 110, 0.12);
    }

    .app-header .slogan {
      font-family: var(--font-serif);
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.1em;
      font-style: italic;
    }

    /* ===== MAIN BODY ===== */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 120px);
    }

    /* ===== GUIDING TEXT ===== */
    .guide-text {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--ink);
      text-align: center;
      line-height: 2;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: element-rise 0.8s ease-out 0.5s forwards;
      position: relative;
    }

    .guide-text::before,
    .guide-text::after {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto;
    }

    .guide-text::before { margin-bottom: 1.2rem; }
    .guide-text::after  { margin-top: 1.2rem; }

    @keyframes element-rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== CARDS ===== */
    .cards-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .gate-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 18px;
      padding: 1.5rem 1.5rem 1.5rem 1.75rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Card 1: 当局者 — warm amber */
    .gate-card.card-warm {
      background: rgba(201, 169, 110, 0.06);
      border: 1px solid rgba(201, 169, 110, 0.2);
    }

    .gate-card.card-warm::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 19px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(201, 169, 110, 0.25), rgba(201, 169, 110, 0.05), rgba(201, 169, 110, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .gate-card.card-warm:hover,
    .gate-card.card-warm:focus-visible {
      transform: translateY(-2px);
      box-shadow:
        0 0 20px rgba(201, 169, 110, 0.15),
        0 0 40px rgba(201, 169, 110, 0.08),
        0 8px 32px rgba(0, 0, 0, 0.3);
      border-color: rgba(201, 169, 110, 0.4);
    }

    /* Card 2: 过来人 — cool gray-blue */
    .gate-card.card-cool {
      background: rgba(130, 155, 195, 0.05);
      border: 1px solid rgba(130, 155, 195, 0.18);
    }

    .gate-card.card-cool::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 19px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(130, 155, 195, 0.25), rgba(130, 155, 195, 0.05), rgba(130, 155, 195, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .gate-card.card-cool:hover,
    .gate-card.card-cool:focus-visible {
      transform: translateY(-2px);
      box-shadow:
        0 0 20px rgba(130, 155, 195, 0.15),
        0 0 40px rgba(130, 155, 195, 0.08),
        0 8px 32px rgba(0, 0, 0, 0.3);
      border-color: rgba(130, 155, 195, 0.4);
    }

    .card-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-text {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }

    .card-warm .card-title {
      color: var(--accent);
      text-shadow: 0 0 16px rgba(201, 169, 110, 0.2);
    }

    .card-cool .card-title {
      color: #8A9FC3;
      text-shadow: 0 0 16px rgba(130, 155, 195, 0.2);
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--ink);
      opacity: 0.85;
      margin-bottom: 0.35rem;
      line-height: 1.5;
    }

    .card-age-hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .card-arrow {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-warm .card-arrow {
      background: rgba(201, 169, 110, 0.12);
      color: var(--accent);
    }

    .card-cool .card-arrow {
      background: rgba(130, 155, 195, 0.12);
      color: #8A9FC3;
    }

    .gate-card:hover .card-arrow,
    .gate-card:focus-visible .card-arrow {
      transform: translateX(3px);
    }

    .card-warm:hover .card-arrow {
      box-shadow: 0 0 12px rgba(201, 169, 110, 0.25);
    }

    .card-cool:hover .card-arrow {
      box-shadow: 0 0 12px rgba(130, 155, 195, 0.25);
    }

    .card-arrow svg {
      width: 18px;
      height: 18px;
    }

    /* Staggered entrance */
    .gate-card:nth-child(1) {
      opacity: 0;
      animation: element-rise 0.7s ease-out 0.8s forwards;
    }
    .gate-card:nth-child(2) {
      opacity: 0;
      animation: element-rise 0.7s ease-out 1.05s forwards;
    }

    /* ===== FOOTER ===== */
    .app-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 1rem 2rem;
      opacity: 0;
      animation: element-rise 0.6s ease-out 1.4s forwards;
    }

    .app-footer p {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0.7;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      #particle-canvas {
        width: 100vw;
      }
    }

    @media (min-width: 481px) {
      body {
        background: var(--bg-deep);
      }
      .app-container {
        border-left: 1px solid rgba(201, 169, 110, 0.06);
        border-right: 1px solid rgba(201, 169, 110, 0.06);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.5);
      }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(201, 169, 110, 0.3); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(201, 169, 110, 0.5); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div class="app-container">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <h1>过来人说</h1>
      <p class="slogan">把我人生的咸，化你生活的甜</p>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="app-main">
      <p class="guide-text">每个人都是过来人，也都正处在当局中</p>

      <div class="cards-stack">

        <!-- Card 1: 过来人 -->
        <a href="guolai-ren-age-elderly.html" class="gate-card card-cool">
          <div class="card-inner">
            <div class="card-text">
              <div class="card-title">过来人</div>
              <div class="card-subtitle">走过半生，拥有回望的智慧</div>
              <div class="card-age-hint">51 ~ 100岁</div>
              <div class="card-desc">分享你的人生经验，化为盐粒</div>
            </div>
            <div class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="M13 6l6 6-6 6"/>
              </svg>
            </div>
          </div>
        </a>

        <!-- Card 2: 当局者 -->
        <a href="guolai-ren-age-young.html" class="gate-card card-warm">
          <div class="card-inner">
            <div class="card-text">
              <div class="card-title">当局者</div>
              <div class="card-subtitle">所有弯路都是必经之路</div>
              <div class="card-age-hint">0 ~ 50岁</div>
              <div class="card-desc">探索过来人留下的智慧锦囊</div>
            </div>
            <div class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="M13 6l6 6-6 6"/>
              </svg>
            </div>
          </div>
        </a>

      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
      <p>TRAE AI 创造力大赛 · 智慧助老赛道</p>
    </footer>

  </div>

  <script>
    // ===== PARTICLE ANIMATION =====
    // Amber gold salt grains drifting in deep space with gravity and twinkle
    (function () {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let W, H;

      function resize() {
        W = canvas.width = canvas.offsetWidth;
        H = canvas.height = canvas.offsetHeight;
      }

      function createParticle(randomY) {
        var isGold = Math.random() > 0.35;
        return {
          x: Math.random() * W,
          y: randomY ? Math.random() * H : H + Math.random() * 40,
          size: Math.random() * 2.2 + 0.4,
          speedX: (Math.random() - 0.5) * 0.25,
          speedY: -(Math.random() * 0.15 + 0.03),
          opacity: Math.random() * 0.5 + 0.15,
          twinkleSpeed: Math.random() * 0.015 + 0.004,
          twinklePhase: Math.random() * Math.PI * 2,
          // Amber gold tones
          r: isGold ? 201 : 180,
          g: isGold ? 169 : 165,
          b: isGold ? 110 : 130
        };
      }

      function init() {
        resize();
        particles = [];
        var count = Math.min(100, Math.floor(W * H / 500));
        for (var i = 0; i < count; i++) {
          particles.push(createParticle(true));
        }
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);

        var cx = W / 2;
        var cy = H / 2;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];

          // Drift
          p.x += p.speedX;
          p.y += p.speedY;

          // Gentle gravitational pull toward center
          var dx = cx - p.x;
          var dy = cy - p.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          p.speedX += dx / dist * 0.00025;
          p.speedY += dy / dist * 0.00025;

          // Damping
          p.speedX *= 0.998;
          p.speedY *= 0.998;

          // Wrap
          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          if (p.y < -10) p.y = H + 10;
          if (p.y > H + 10) p.y = -10;

          // Twinkle
          p.twinklePhase += p.twinkleSpeed;
          var twinkle = (Math.sin(p.twinklePhase) + 1) / 2;
          var alpha = p.opacity * (0.4 + twinkle * 0.6);

          // Draw particle
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha.toFixed(3) + ')';
          ctx.fill();

          // Glow for larger particles
          if (p.size > 1.2) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (alpha * 0.1).toFixed(3) + ')';
            ctx.fill();
          }
        }

        requestAnimationFrame(animate);
      }

      init();
      animate();

      window.addEventListener('resize', function () {
        resize();
        // Re-distribute some particles
        var count = Math.min(100, Math.floor(W * H / 500));
        while (particles.length < count) particles.push(createParticle(true));
        while (particles.length > count) particles.pop();
      });
    })();
  </script>
</body>
</html>
