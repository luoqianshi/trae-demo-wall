<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当局者迷 - 过来人说</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button, a { touch-action: manipulation; }

  :root {
    --bg: #FAF6F1;
    --bg2: #FFFFFF;
    --ink: #2C2418;
    --brown: #7B5B3A;
    --amber: #A67C52;
    --amber-glow: rgba(166,124,82,0.18);
    --amber-light: #C49A6C;
    --warm-white: #F5EDE3;
    --text: #2C2418;
    --muted: #9B8E7E;
    --card-bg: rgba(255,255,255,0.92);
    --card-border: rgba(166,124,82,0.12);
    --shadow: 0 2px 12px rgba(44,36,24,0.06);
    --shadow-lg: 0 8px 32px rgba(44,36,24,0.1);
    --sugar: #E8C87A;
    --sugar-glow: rgba(232,200,122,0.4);
    --font: 'Noto Sans SC', sans-serif;
    --font-serif: 'Noto Serif SC', serif;
    --radius: 16px;
  }

  html { font-size: 16px; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* ========== Background Canvas ========== */
  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ========== Header ========== */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: rgba(250,246,241,0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--card-border);
  }
  .header-back {
    width: 40px;
    height: 40px;
    border: none;
    background: var(--bg2);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    color: var(--amber);
    font-size: 20px;
    text-decoration: none;
    transition: color 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .header-back:hover { box-shadow: 0 4px 16px var(--amber-glow); transform: scale(1.05); }
  .header-slogan-inline {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
    font-family: 'Noto Serif SC', serif;
  }
  .header-bell .bell-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    background: var(--amber);
    border-radius: 50%;
    border: 2px solid var(--bg2);
    display: none;
  }
  .header-bell.has-badge .bell-badge { display: block; }

  /* ========== Main Content ========== */
  .app-main {
    flex: 1;
    padding: 0 12px 100px;
    position: relative;
    z-index: 1;
  }

  /* ========== Banner ========== */
  .banner {
    text-align: center;
    padding: 32px 16px 28px;
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute;
    top: -40%;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
    pointer-events: none;
  }
  .banner-title {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    position: relative;
  }
  .banner-subtitle {
    font-size: 0.92rem;
    color: var(--muted);
    font-weight: 400;
    position: relative;
  }

  /* ========== Card List: Waterfall (Xiaohongshu style) ========== */
  #card-list {
    columns: 2;
    column-gap: 12px;
    padding: 0 0 100px;
  }

  .sugar-card {
    break-inside: avoid;
    margin-bottom: 12px;
    display: inline-block;
    width: 100%;
  }

  @media (max-width: 360px) {
    #card-list {
      columns: 1;
    }
  }

  /* ========== Sugar Crystal Card ========== */
  .sugar-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 12px 12px;
    font-size: 0.88rem;
    border: 1px solid var(--card-border);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease;
  }
  .sugar-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .sugar-card:hover {
    box-shadow: var(--shadow-lg), 0 0 20px var(--amber-glow);
    transform: translateY(-1px);
  }
  .sugar-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sugar), var(--amber-light), var(--sugar), transparent);
    opacity: 0.7;
  }
  .sugar-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  .sugar-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .tag-category {
    display: inline-flex;
    align-items: center;
    background: var(--amber);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  /* Category colored backgrounds */
  .sugar-card[data-tag="#过日子"] { border-left: 3px solid #E8A87C; background: linear-gradient(135deg, rgba(232,168,124,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#养孩子"] { border-left: 3px solid #F0C75E; background: linear-gradient(135deg, rgba(240,199,94,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#婚姻"] { border-left: 3px solid #E891B9; background: linear-gradient(135deg, rgba(232,145,185,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#工作"] { border-left: 3px solid #7BAFD4; background: linear-gradient(135deg, rgba(123,175,212,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#健康"] { border-left: 3px solid #7BC49A; background: linear-gradient(135deg, rgba(123,196,154,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#识人"] { border-left: 3px solid #B09ED8; background: linear-gradient(135deg, rgba(176,158,216,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#扛事"] { border-left: 3px solid #D4A574; background: linear-gradient(135deg, rgba(212,165,116,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#教训"] { border-left: 3px solid #D4827A; background: linear-gradient(135deg, rgba(212,130,122,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#邻里"] { border-left: 3px solid #82C4B8; background: linear-gradient(135deg, rgba(130,196,184,0.06), var(--card-bg)); }
  .sugar-card[data-tag="#手艺"] { border-left: 3px solid #C9A06C; background: linear-gradient(135deg, rgba(201,160,108,0.06), var(--card-bg)); }

  /* Tag category colors per tag */
  .sugar-card[data-tag="#过日子"] .tag-category { background: rgba(232,168,124,0.15); color: #C47845; }
  .sugar-card[data-tag="#养孩子"] .tag-category { background: rgba(240,199,94,0.15); color: #B8960A; }
  .sugar-card[data-tag="#婚姻"] .tag-category { background: rgba(232,145,185,0.15); color: #C4648E; }
  .sugar-card[data-tag="#工作"] .tag-category { background: rgba(123,175,212,0.15); color: #4A8CB8; }
  .sugar-card[data-tag="#健康"] .tag-category { background: rgba(123,196,154,0.15); color: #3E9B6A; }
  .sugar-card[data-tag="#识人"] .tag-category { background: rgba(176,158,216,0.15); color: #7B5FB5; }
  .sugar-card[data-tag="#扛事"] .tag-category { background: rgba(212,165,116,0.15); color: #A87030; }
  .sugar-card[data-tag="#教训"] .tag-category { background: rgba(212,130,122,0.15); color: #B85545; }
  .sugar-card[data-tag="#邻里"] .tag-category { background: rgba(130,196,184,0.15); color: #3E8B7D; }
  .sugar-card[data-tag="#手艺"] .tag-category { background: rgba(201,160,108,0.15); color: #9A7030; }

  /* Sugar crystal icon - diamond shape */
  .sugar-crystal-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    position: relative;
    top: 2px;
  }
  .sugar-crystal-icon::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    background: var(--sugar);
    border-radius: 2px;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 0 8px var(--sugar-glow), 0 0 16px var(--sugar-glow);
    animation: crystal-glow 3s ease-in-out infinite;
  }
  .sugar-crystal-icon::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }
  @keyframes crystal-glow {
    0%, 100% { box-shadow: 0 0 6px var(--sugar-glow), 0 0 12px rgba(232,200,122,0.2); }
    50% { box-shadow: 0 0 10px var(--sugar-glow), 0 0 24px rgba(232,200,122,0.35); }
  }
  .sugar-card-text {
    font-family: var(--font-serif);
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .sugar-card-author {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  .sugar-card-actions {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--card-border);
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.78rem;
    padding: 4px 0;
    transition: color 0.2s, transform 0.15s;
    font-family: inherit;
  }

  .action-btn:hover {
    color: var(--amber);
  }

  .action-btn:active {
    transform: scale(0.92);
  }

  .action-btn.liked .action-icon {
    color: #E85D5D;
  }

  .action-icon {
    font-size: 1rem;
    transition: transform 0.2s;
  }

  .action-btn:hover .action-icon {
    transform: scale(1.15);
  }

  .action-btn.liked .action-icon {
    animation: heartBeat 0.4s ease;
  }

  @keyframes heartBeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .action-count {
    font-size: 0.75rem;
  }

  /* ========== Floating Ask Button ========== */
  .fab-ask {
    position: fixed;
    bottom: 28px;
    right: calc(50% - 240px + 20px);
    right: max(20px, calc(50% - 260px));
    z-index: 90;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .fab-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--amber), var(--amber-light));
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(166,124,82,0.35), 0 0 30px rgba(166,124,82,0.15);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 6px 28px rgba(166,124,82,0.45), 0 0 40px rgba(166,124,82,0.25);
  }
  .fab-btn:active { transform: scale(1.02); }
  .fab-label {
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
    background: var(--bg2);
    padding: 3px 10px;
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* ========== Ask Overlay ========== */
  .overlay-mask {
    position: fixed;
    inset: 0;
    background: rgba(44,36,24,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    border: none;
    cursor: pointer;
  }
  .overlay-mask.show { opacity: 1; pointer-events: auto; }

  /* Ask Panel - bottom slide up */
  .ask-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    z-index: 210;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
  }
  .ask-panel.show { transform: translateX(-50%) translateY(0); }
  .ask-handle {
    width: 36px;
    height: 4px;
    background: var(--muted);
    border-radius: 2px;
    margin: 12px auto 0;
    opacity: 0.5;
    flex-shrink: 0;
  }
  .ask-header {
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--card-border);
  }
  .ask-header h3 {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink);
  }
  .ask-close {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--warm-white);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .ask-close:hover { background: var(--card-border); color: var(--ink); }
  .ask-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 24px;
    overscroll-behavior: contain;
  }

  /* Input mode switch */
  .input-mode-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--bg2);
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    font-family: var(--font);
  }
  .mode-btn.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #fff;
  }
  .mode-btn:hover:not(.active) { border-color: var(--amber); color: var(--amber); }

  /* Text input */
  .text-input-area textarea {
    width: 100%;
    min-height: 150px;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    font-size: 1.05rem;
    font-family: var(--font);
    color: var(--text);
    background: var(--warm-white);
    resize: vertical;
    line-height: 1.8;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .text-input-area textarea::placeholder { color: var(--muted); opacity: 0.5; }
  .text-input-area textarea:focus {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 12px var(--amber-glow);
  }
  textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: -1px;
  }
  .char-count { text-align: right; font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

  /* Voice input */
  .voice-input-area { display: none; }
  .voice-input-area.active { display: block; }
  .voice-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 0;
  }
  .voice-waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 36px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .voice-waveform.active { opacity: 1; }
  .waveform-bar {
    width: 4px;
    background: var(--amber);
    border-radius: 2px;
    transition: height 0.1s;
    height: 4px;
  }
  .voice-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid var(--amber);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.15s;
    position: relative;
  }
  .voice-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--amber-glow); }
  .voice-btn.recording {
    background: var(--amber);
    border-color: var(--amber);
    animation: pulse-ring 1.5s ease-in-out infinite;
  }
  .voice-btn.recording::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    opacity: 0;
    animation: pulse-ring 1.5s ease-in-out infinite;
  }
  .voice-btn.recording::after {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    opacity: 0;
    animation: pulse-ring 1.5s ease-in-out 0.3s infinite;
  }
  @keyframes pulse-ring {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .voice-icon { font-size: 2rem; color: var(--amber); }
  .voice-btn.recording .voice-icon { color: #fff; }
  .voice-status { font-size: 0.92rem; color: var(--muted); text-align: center; min-height: 1.5rem; }
  .voice-status.recording { color: var(--amber); font-weight: 600; }
  .voice-transcript {
    width: 100%;
    min-height: 80px;
    background: var(--warm-white);
    border-radius: 14px;
    padding: 14px;
    font-size: 1rem;
    color: var(--text);
    line-height: 1.8;
    margin-top: 8px;
    display: none;
  }
  .voice-transcript.has-content { display: block; }
  .voice-transcript::before {
    content: '您的问题：';
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  /* Submit button */
  .btn-submit {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--amber), var(--amber-light));
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    font-family: var(--font);
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(166,124,82,0.3);
  }
  .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(166,124,82,0.4); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ========== Sugar Crystals Page ========== */
  .sugar-crystals-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 1rem 1.25rem;
    position: sticky;
    top: 0;
    background: rgba(250,246,241,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 5;
    border-bottom: 1px solid var(--card-border);
  }

  .sc-back-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--card-bg);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: var(--ink);
    transition: box-shadow 0.2s;
    flex-shrink: 0;
  }

  .sc-back-btn:hover {
    box-shadow: 0 2px 12px var(--amber-glow);
  }

  .sc-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
  }

  .sc-points {
    text-align: center;
    padding: 1.5rem 0 1rem;
  }

  .sc-points-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.75rem;
  }

  .sc-grains-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 0.5rem 0;
  }

  /* Individual sugar grain */
  .sc-grain {
    width: 32px;
    height: 32px;

let myQuestions = JSON.parse(localStorage.getItem('guolai_ren_my_questions') || '[]');
let isRecording = false;
let askRecognition = null;
let waveformAnimId = null;

// ============================================================
//  RENDER CARDS
// ============================================================
function renderCards() {
  const container = document.getElementById('card-list');
  container.innerHTML = sugarCards.map((card, i) => `
    <article class="sugar-card" data-tag="${card.tag}" style="animation-delay: ${i * 80}ms">
      <div class="sugar-card-top">
        <div class="sugar-card-tags">
          <span class="tag-category">&#x1F4C1; ${card.tag}</span>
        </div>
        <div class="sugar-crystal-icon" title="糖晶"></div>
      </div>
      <div class="sugar-card-author">
        <span>&#x1F464; ${card.stage} · ${card.location}</span>
      </div>
      <div class="sugar-card-text">${card.text}</div>
      <div class="sugar-card-actions">
        <button class="action-btn" onclick="toggleLike(this, ${card.id})" aria-label="有用">
          <span class="action-icon">&#x2764;</span>
          <span class="action-count">${card.useful}</span>
        </button>
        <button class="action-btn" onclick="openComment(this, ${card.id})" aria-label="评论">
          <span class="action-icon">&#x1F4AC;</span>
          <span class="action-count">${card.saved}</span>
        </button>
      </div>
    </article>
  `).join('');

  // Scroll reveal with IntersectionObserver
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.sugar-card').forEach(card => observer.observe(card));
}

// ============================================================
//  CARD INTERACTIONS
// ============================================================
function toggleLike(el, id) {
  const card = sugarCards.find(c => c.id === id);
  const countEl = el.querySelector('.action-count');
  if (card && !el.classList.contains('liked')) {
    card.useful++;
    el.classList.add('liked');
    countEl.textContent = card.useful;
  } else if (card && el.classList.contains('liked')) {
    card.useful--;
    el.classList.remove('liked');
    countEl.textContent = card.useful;
  }
}

function openAskPanel() {
  document.getElementById('ask-mask').classList.add('show');
  document.getElementById('ask-panel').classList.add('show');

}
function closeAskPanel() {

  document.body.style.overflow = '';
  if (isRecording) stopAskRecording();
}

function switchAskMode(mode) {
  document.getElementById('ask-text-area').style.display = mode === 'text' ? 'block' : 'none';
  const voiceArea = document.getElementById('ask-voice-area');
  voiceArea.className = mode === 'voice' ? 'voice-input-area active' : 'voice-input-area';
  document.getElementById('ask-mode-text').classList.toggle('active', mode === 'text');
  document.getElementById('ask-mode-voice').classList.toggle('active', mode === 'voice');
  if (mode === 'text' && isRecording) stopAskRecording();
}

function updateAskCharCount() {
  document.getElementById('ask-char-count').textContent = document.getElementById('ask-textarea').value.length;
}

// ============================================================
//  VOICE RECORDING (Ask Panel)
// ============================================================
function initWaveform(id) {
  const container = document.getElementById(id);
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'waveform-bar';
    bar.style.height = '4px';
    container.appendChild(bar);
  }
}

function toggleAskRecording() {
  if (!isRecording) {
    startAskRecording();
  } else {
    stopAskRecording();
  }
}

function startAskRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('ask-voice-status').textContent = '您的浏览器不支持语音识别，请使用 Chrome';
    document.getElementById('ask-voice-status').style.color = '#C75050';
    return;
  }
  askRecognition = new SpeechRecognition();
  askRecognition.lang = 'zh-CN';
  askRecognition.continuous = true;
  askRecognition.interimResults = true;

  let finalTranscript = '';
  askRecognition.onresult = function(event) {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    const el = document.getElementById('ask-voice-transcript');
    el.textContent = finalTranscript + interim;
    el.classList.add('has-content');
  };
  askRecognition.onerror = function(event) {
    if (event.error === 'not-allowed') {
      document.getElementById('ask-voice-status').textContent = '请允许使用麦克风';
      stopAskRecording();
    }
  };
  askRecognition.onend = function() {
    if (isRecording) { try { askRecognition.start(); } catch(e) {} }
  };

  try {
    askRecognition.start();
    isRecording = true;
    document.getElementById('ask-voice-btn').classList.add('recording');
    document.getElementById('ask-voice-status').textContent = '正在聆听...再次点击停止';
    document.getElementById('ask-voice-status').classList.add('recording');
    document.getElementById('ask-voice-icon').textContent = '\u{1F515}';
    document.getElementById('ask-waveform').classList.add('active');
    animateWaveform('ask-waveform');
  } catch(e) {
    document.getElementById('ask-voice-status').textContent = '语音识别启动失败，请刷新页面重试';
  }
}

function stopAskRecording() {
  if (askRecognition) { askRecognition.stop(); askRecognition = null; }
  isRecording = false;
  document.getElementById('ask-voice-btn').classList.remove('recording');
  document.getElementById('ask-voice-status').textContent = '点击麦克风重新录制';
  document.getElementById('ask-voice-status').classList.remove('recording');
  document.getElementById('ask-voice-icon').textContent = '\u{1F3A4}';
  document.getElementById('ask-waveform').classList.remove('active');
  if (waveformAnimId) cancelAnimationFrame(waveformAnimId);
}

function animateWaveform(containerId) {
  const bars = document.getElementById(containerId).querySelectorAll('.waveform-bar');
  function animate() {
    bars.forEach(bar => { bar.style.height = (Math.random() * 24 + 4) + 'px'; });
    waveformAnimId = requestAnimationFrame(animate);
  }
  animate();
}

// ============================================================
function autoExtractKeywords(text) {
  const tagMap = {
    '过日子': ['过日子','生活','买菜','做饭','腌','酱','收拾','打扫','省钱','花销','消费'],
    '养孩子': ['养孩子','孩子','育儿','带孙子','孙子','孙女','教育','长大'],
    '识人': ['识人','看人','交朋友','朋友','借钱','靠谱','人品','人心'],
    '扛事': ['扛事','最难','困难','撑','熬','挺过去','扛过去','不容易'],
    '教训': ['教训','后悔','吃亏','上当','踩坑','傻事','不应该'],
    '手艺': ['手艺','窍门','技巧','缝补','织','修','做','腌制'],
    '婚姻': ['婚姻','夫妻','老伴','吵架','结婚','离婚','磨合'],
    '邻里': ['邻居','邻里','远亲','近邻','街坊','老乡'],
    '健康': ['健康','养生','身体','保养','医院','看病','吃药'],
    '工作': ['工作','上班','职场','退休','工资','同事','领导']
  };

  let detectedTag = '过日子';
  let maxScore = 0;
  for (const [tag, keywords] of Object.entries(tagMap)) {
    let score = 0;
    for (const kw of keywords) { if (text.includes(kw)) score++; }
    if (score > maxScore) { maxScore = score; detectedTag = tag; }
  }

  // Extract age relevance
  const ageMap = {
    '18-25': ['刚工作','毕业','租房','找工作','大学','实习'],
    '25-30': ['结婚','买房','孩子','新生儿','创业'],
    '30-40': ['孩子上学','中年','压力','房贷','升职'],
    '40-50': ['四十','中年','回头','大半辈子'],
    '50-60': ['退休','知天命','五十','六十'],
    '60-70': ['养老','孙子','晚年','六十','七十'],
    '70-80': ['长寿','八十','古稀','保养','老'],
  };
  let detectedAge = '';
  for (const [age, keywords] of Object.entries(ageMap)) {
    for (const kw of keywords) { if (text.includes(kw)) { detectedAge = age; break; } }
    if (detectedAge) break;
  }

  return { tag: detectedTag, age: detectedAge };
}

// ============================================================
//  SUBMIT QUESTION
// ============================================================
function submitQuestion() {
  const textArea = document.getElementById('ask-textarea');
  const transcriptEl = document.getElementById('ask-voice-transcript');
  const text = textArea.value.trim() || transcriptEl.textContent.trim();

  if (!text) {
    showToast('请先写下或说出您的问题');
    return;
  }

  if (text.length > 300) {
    showToast('问题太长了，请控制在300字以内');
    return;
  }

  const { tag, age } = autoExtractKeywords(text);

  // Save question
  const question = {
    id: Date.now(),
    text: text,
    tag: '#' + tag,
    targetAge: age || '全年龄段',
    date: new Date().toLocaleDateString('zh-CN'),
    status: 'waiting',
    answers: []
  };

  myQuestions.unshift(question);
  localStorage.setItem('guolai_ren_my_questions', JSON.stringify(myQuestions));

  // Reset inputs
  textArea.value = '';
  transcriptEl.textContent = '';
  transcriptEl.classList.remove('has-content');
  document.getElementById('ask-char-count').textContent = '0';

  // Update badge
  updateBellBadge();

  // Simulate: after 3 seconds, auto-add an answer
  setTimeout(() => {
    const q = myQuestions.find(q => q.id === question.id);
    if (q && q.status === 'waiting') {
      q.status = 'answered';
      q.answers.push({
        age: '过来人 · 55岁',
        text: '这个问题我想了很久，给你说说我当年的经验。当年我也碰到过类似的情况，后来我发现，最重要的是心态。不管遇到什么，先让自己冷静下来，想清楚再做决定。希望对你有帮助。',
        date: new Date().toLocaleDateString('zh-CN'),
        useful: 0,
        saved: 0
      });
      localStorage.setItem('guolai_ren_my_questions', JSON.stringify(myQuestions));
      if (document.getElementById('sugar-crystals-page').style.display !== 'none') {
        renderBellPanel();
      }
      updateBellBadge();
    }
  }, 3000);

  closeAskPanel();
  showToast('问题已发送，等待过来人回答');
}

// ============================================================
//  BELL PANEL (My Sugar Crystals)
// ============================================================
function openBellPanel() {
  renderBellPanel();
  document.getElementById('sugar-crystals-page').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeBellPanel() {
  document.getElementById('sugar-crystals-page').style.display = 'none';
  document.body.style.overflow = '';
}

function updateBellBadge() {
  const answeredCount = myQuestions.filter(q => q.status === 'answered').length;
  const btn = document.getElementById('bell-btn');
  if (answeredCount > 0) {
    btn.classList.add('has-badge');
  } else {
    btn.classList.remove('has-badge');
  }
}

function renderBellPanel() {
  const grainCount = myQuestions.length; // 每个问题一颗糖晶
  document.getElementById('sc-points-title').textContent = '你拥有 ' + grainCount + ' 颗人生糖晶';
  
  // Render grain animations
  const grainContainer = document.getElementById('sc-grains-container');
  if (grainCount > 0) {
    let grainsHtml = '';
    for (let i = 0; i < grainCount; i++) {
      grainsHtml += '<div class="sc-grain" style="animation-delay:' + (i * 0.2) + 's"></div>';
    }
    grainContainer.innerHTML = grainsHtml;
  } else {
    grainContainer.innerHTML = '';
  }
  
  // Update card count
  document.getElementById('sc-card-count').textContent = myQuestions.length + ' 条';
  
  const listEl = document.getElementById('sc-cards-list');
  
  if (myQuestions.length === 0) {
    listEl.innerHTML = `
      <div class="sc-empty-state">
        <div class="sc-empty-icon">&#x1F4DC;</div>
        <p>还没有提过问题哦<br>点击右下角按钮向过来人提问吧</p>
      </div>
    `;
    return;
  }
  
  listEl.innerHTML = myQuestions.map(q => {
    const statusHtml = q.status === 'waiting'
      ? '<span class="sc-q-status waiting">&#x23F3; 等待回答</span>'
      : '<span class="sc-q-status answered">&#x2728; 已有回答</span>';
    
    const answersHtml = q.answers && q.answers.length > 0
      ? q.answers.map(a => `
          <div class="sc-q-answer">
            <div class="sc-q-answer-label">&#x1F4AC; ${a.stage || '过来人'} 的回答</div>
            <div class="sc-q-answer-text">${a.text}</div>
          </div>
        `).join('')
      : '';
    
    return `
      <div class="sc-q-item">
        <div class="sc-q-text">${q.text}</div>
        <div class="sc-q-meta">
          ${statusHtml}
          <span>&#x1F4C5; ${q.date}</span>
          <span>&#x1F4C1; ${q.tag}</span>
        </div>
        ${answersHtml}
      </div>
    `;
  }).join('');
}

// ============================================================

// ============================================================
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// ============================================================
//  PARTICLE ANIMATION (warm amber, softer density)
// ============================================================
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createParticle() {
    const isSugar = Math.random() > 0.45;
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speedX: (Math.random() - 0.5) * 0.2,
      speedY: (Math.random() - 0.5) * 0.15 - 0.05,
      opacity: Math.random() * 0.35 + 0.1,
      twinkleSpeed: Math.random() * 0.015 + 0.004,
      twinklePhase: Math.random() * Math.PI * 2,
      color: isSugar ? 'rgba(232,200,122,0.4)' : 'rgba(166,124,82,0.25)'
    };
  }

  function initParticles() {
    particles = [];
    const count = Math.min(35, Math.floor(canvas.width * canvas.height / 12000));
    for (let i = 0; i < count; i++) {
      particles.push(createParticle());
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      // Gentle drift
      p.speedX += (Math.random() - 0.5) * 0.005;
      p.speedY += (Math.random() - 0.5) * 0.005;
      p.speedX *= 0.998;
      p.speedY *= 0.998;

      // Wrap
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
      if (p.y < -10) p.y = canvas.height + 10;
      if (p.y > canvas.height + 10) p.y = -10;

      // Twinkle
      p.twinklePhase += p.twinkleSpeed;
      const twinkle = (Math.sin(p.twinklePhase) + 1) / 2;
      const alpha = p.opacity * (0.4 + twinkle * 0.6);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.fill();

      // Soft glow for larger particles
      if (p.size > 1.2) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha * 0.08;
        ctx.fill();
      }
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  resize();
  initParticles();
  animate();

  window.addEventListener('resize', () => { resize(); initParticles(); });
})();
