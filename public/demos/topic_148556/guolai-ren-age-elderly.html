<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>过来人说 - 年龄选择</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #F0EFF3;
    --card: #FAFBFD;
    --accent: #5C6B82;
    --accent-light: #7A8BA3;
    --fg: #1A1D23;
    --muted: #7A8290;
    --border: rgba(92, 107, 130, 0.1);
    --shadow: rgba(26, 29, 35, 0.05);
    --shadow-accent: rgba(92, 107, 130, 0.2);
    --slate: #4A5568;
    --radius: 16px;
  }

  html {
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* ========== Header ========== */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .back-btn {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: none;
    background: var(--card);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--accent);
    text-decoration: none;
    font-size: 20px;
    line-height: 1;
  }

  .back-btn:hover {
    box-shadow: 0 4px 16px var(--shadow-accent);
    transform: translateY(-50%) scale(1.05);
  }

  .header-tag {
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 2px;
    padding: 5px 18px;
    background: var(--accent);
    border-radius: 20px;
    box-shadow: 0 2px 10px var(--shadow-accent);
  }

  /* ========== Main Content ========== */
  .main {
    flex: 1;
    padding: 12px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .guide-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--fg);
    text-align: center;
    margin-bottom: 6px;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  .guide-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* ========== Age Cards Grid ========== */
  .age-grid {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .age-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 22px 22px 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    text-decoration: none;
    color: var(--fg);
    transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    box-shadow: 0 2px 10px var(--shadow);
    opacity: 0;
    transform: translateY(24px);
    animation: cardFadeIn 0.5s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .age-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--slate));
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 0 4px 4px 0;
  }

  .age-card:hover,
  .age-card:active {
    border-color: var(--accent-light);
    box-shadow: 0 6px 24px var(--shadow-accent);
    transform: translateY(-2px) scale(1.01);
  }

  .age-card:hover::before,
  .age-card:active::before,
  .age-card.selected::before {
    opacity: 1;
  }

  .age-card.selected {
    border-color: var(--accent);
    box-shadow: 0 4px 20px var(--shadow-accent), 0 0 0 3px rgba(92, 107, 130, 0.08);
    background: linear-gradient(135deg, #F5F6FA 0%, #FAFBFD 100%);
  }

  .age-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: linear-gradient(135deg, #E8EAF0 0%, #DEE1E8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s, background 0.3s;
  }

  .age-icon-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
    text-align: center;
    transition: color 0.3s ease;
  }

  .age-card:hover .age-icon,
  .age-card.selected .age-icon {
    background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
    transform: scale(1.08);
  }

  .age-card:hover .age-icon-text,
  .age-card.selected .age-icon-text {
    color: #FFFFFF;
  }

  .age-info {
    flex: 1;
    min-width: 0;
  }

  .age-range {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }

  .age-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.4;
  }

  .age-classical {
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    opacity: 0.7;
    margin-top: 2px;
    letter-spacing: 0.5px;
    transition: opacity 0.3s ease;
  }

  .age-card:hover .age-classical,
  .age-card.selected .age-classical {
    opacity: 1;
  }

  .age-arrow {
    color: var(--border);
    font-size: 16px;
    flex-shrink: 0;
    transition: transform 0.3s;
  }

  .age-card:hover .age-arrow,
  .age-card.selected .age-arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  /* ========== Stagger Animation ========== */
  @keyframes cardFadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .age-card:nth-child(1) { animation-delay: 0.08s; }
  .age-card:nth-child(2) { animation-delay: 0.16s; }
  .age-card:nth-child(3) { animation-delay: 0.24s; }
  .age-card:nth-child(4) { animation-delay: 0.32s; }
  .age-card:nth-child(5) { animation-delay: 0.40s; }
  .age-card:nth-child(6) { animation-delay: 0.48s; }

  /* ========== Footer Slogan ========== */
  .footer {
    text-align: center;
    padding: 20px 24px 32px;
    width: 100%;
  }

  .slogan {
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    opacity: 0;
    animation: fadeInSlow 0.8s ease 0.7s forwards;
  }

  @keyframes fadeInSlow {
    to { opacity: 0.8; }
  }

  /* ========== Decorative ambient ========== */
  .ambient-glow {
    position: fixed;
    top: -120px;
    right: -80px;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(92, 107, 130, 0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .ambient-glow-bottom {
    position: fixed;
    bottom: -80px;
    left: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(74, 85, 104, 0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ========== Responsive fine-tuning ========== */
  @media (max-width: 360px) {
    .guide-text { font-size: 19px; }
    .age-card { padding: 16px 18px 16px 20px; gap: 12px; }
    .age-icon { width: 44px; height: 44px; }
    .age-icon-text { font-size: 13px; }
    .age-range { font-size: 15px; }
  }

  @media (min-width: 481px) {
    body { padding-top: 20px; }
  }

  .back-btn:focus-visible, .age-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .age-card {
    touch-action: manipulation;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- Decorative ambient glows -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-bottom"></div>

  <!-- Header -->
  <header class="header">
    <a href="guolai-ren-gate.html" class="back-btn" aria-label="返回">&larr;</a>
    <h1 class="header-tag" style="font-size:inherit;font-weight:inherit;margin:0;">过来人</h1>
  </header>

  <!-- Main Content -->
  <main class="main">
    <p class="guide-text">我已经走过了人生的第___年</p>
    <p class="guide-sub">选择你已走过的人生阶段</p>

    <div class="age-grid">

      <!-- 50-60 知天命 -->
      <a href="guolai-ren-demo-elderly.html" class="age-card" data-age="50-60" onclick="selectAge(this, event)">
        <div class="age-icon">
          <span class="age-icon-text">五十</span>
        </div>
        <div class="age-info">
          <div class="age-range">50&ndash;60岁</div>
          <div class="age-label">知天命 · 懂得了何为珍贵</div>
          <div class="age-classical">知天命</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 60-70 耳顺之年 -->
      <a href="guolai-ren-demo-elderly.html" class="age-card" data-age="60-70" onclick="selectAge(this, event)">
        <div class="age-icon">
          <span class="age-icon-text">六十</span>
        </div>
        <div class="age-info">
          <div class="age-range">60&ndash;70岁</div>
          <div class="age-label">耳顺之年 · 心静如水安然</div>
          <div class="age-classical">耳顺之年</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 70-80 古稀之年 -->
      <a href="guolai-ren-demo-elderly.html" class="age-card" data-age="70-80" onclick="selectAge(this, event)">
        <div class="age-icon">
          <span class="age-icon-text">七十</span>
        </div>
        <div class="age-info">
          <div class="age-range">70&ndash;80岁</div>
          <div class="age-label">古稀之年 · 人寿七十古来稀</div>
          <div class="age-classical">古稀之年</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 80-90 耄耋之年 -->
      <a href="guolai-ren-demo-elderly.html" class="age-card" data-age="80-90" onclick="selectAge(this, event)">
        <div class="age-icon">
          <span class="age-icon-text">八十</span>
        </div>
        <div class="age-info">
          <div class="age-range">80&ndash;90岁</div>
          <div class="age-label">耄耋之年 · 岁月沉淀的智慧</div>
          <div class="age-classical">耄耋之年</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

      <!-- 90岁以上 期颐之年 -->
      <a href="guolai-ren-demo-elderly.html" class="age-card" data-age="90+" onclick="selectAge(this, event)">
        <div class="age-icon">
          <span class="age-icon-text">百岁</span>
        </div>
        <div class="age-info">
          <div class="age-range">90岁以上</div>
          <div class="age-label">期颐之年 &middot; 百年人生的见证</div>
          <div class="age-classical">期颐之年</div>
        </div>
        <div class="age-arrow">&#8250;</div>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="slogan">把我人生的咸，化你生活的甜</p>
  </footer>

  <script>
    function selectAge(card, event) {
      // Remove previous selection
      document.querySelectorAll('.age-card.selected').forEach(function(c) {
        c.classList.remove('selected');
      });
      // Add selection with a brief delay for visual feedback before navigation
      card.classList.add('selected');

      // Store selected age in sessionStorage for downstream pages
      var age = card.getAttribute('data-age');
      if (typeof sessionStorage !== 'undefined') {
        sessionStorage.setItem('guolai-ren-age', age);
        sessionStorage.setItem('guolai-ren-role', 'elderly');
      }

      // Let the link navigate naturally (href handles it)
    }
  </script>

</body>
</html>
