<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的公益足迹 | 微光汇爱</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .mine-container {
            padding: 8rem 2rem 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .profile-header {
            background: linear-gradient(135deg, #FF9A5C 0%, #FFB88C 40%, #87D8C6 100%);
            border-radius: 30px;
            padding: 3rem;
            color: white;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3.5rem;
            position: relative;
            z-index: 1;
        }

        .profile-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .profile-header .tagline {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .edit-profile-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .edit-profile-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .identity-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .donation-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            position: relative;
            z-index: 1;
        }

        .summary-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .summary-item:hover {
            transform: translateY(-5px);
        }

        .summary-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.3rem;
        }

        .summary-label {
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px rgba(255, 154, 92, 0.1);
            border: 1px solid rgba(255, 154, 92, 0.1);
        }

        .section-card h2 {
            font-size: 1.5rem;
            color: var(--bg-dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 154, 92, 0.1);
        }

        .section-card h2 i {
            color: var(--primary-brown);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
        }

        .achievement-badge {
            text-align: center;
            padding: 1.5rem 1rem;
            background: linear-gradient(145deg, #FAF8F5, #FFF5EE);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .achievement-badge:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 154, 92, 0.15);
        }

        .achievement-badge.unlocked {
            background: linear-gradient(145deg, rgba(255, 154, 92, 0.1), rgba(135, 216, 198, 0.1));
            border: 1px solid rgba(255, 154, 92, 0.2);
        }

        .achievement-badge.locked {
            opacity: 0.4;
            filter: grayscale(0.8);
        }

        .badge-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 0.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary-brown), var(--secondary-teal));
            color: white;
        }

        .achievement-badge.unlocked .badge-icon {
            background: linear-gradient(135deg, var(--primary-brown), var(--secondary-teal));
        }

        .achievement-badge.locked .badge-icon {
            background: #ccc;
        }

        .achievement-badge h4 {
            font-size: 0.95rem;
            color: var(--bg-dark);
            margin-bottom: 0.3rem;
        }

        .achievement-badge p {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .donation-history {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .donation-item {
            display: flex;
            align-items: center;
            padding: 1.2rem;
            background: linear-gradient(145deg, #FAF8F5, #FFF5EE);
            border-radius: 12px;
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary-brown);
        }

        .donation-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(255, 154, 92, 0.1);
        }

        .donation-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 1.2rem;
            flex-shrink: 0;
        }

        .donation-icon.mental {
            background: rgba(255, 154, 92, 0.1);
            color: var(--primary-brown);
        }

        .donation-icon.aging {
            background: rgba(135, 216, 198, 0.1);
            color: var(--secondary-teal);
        }

        .donation-icon.edu {
            background: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
        }

        .donation-icon.cyber {
            background: rgba(102, 126, 234, 0.1);
            color: #667EEA;
        }

        .donation-info {
            flex: 1;
        }

        .donation-info h4 {
            font-size: 1rem;
            color: var(--bg-dark);
            margin-bottom: 0.3rem;
        }

        .donation-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .donation-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-brown);
        }

        .donation-timeline {
            position: relative;
            padding-left: 30px;
        }

        .donation-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary-brown), var(--secondary-teal));
            border-radius: 1px;
        }

        .timeline-item {
            position: relative;
            padding: 1.5rem;
            background: linear-gradient(145deg, #FAF8F5, #FFF5EE);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 20px;
            width: 12px;
            height: 12px;
            background: white;
            border: 3px solid var(--primary-brown);
            border-radius: 50%;
            z-index: 1;
        }

        .timeline-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(255, 154, 92, 0.1);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .timeline-header h4 {
            font-size: 1rem;
            color: var(--bg-dark);
        }

        .timeline-date {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .timeline-amount {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-brown);
            margin-bottom: 0.5rem;
        }

        .timeline-desc {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--bg-dark);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        .btn-donate {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-brown), var(--primary-brown-light));
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 92, 0.4);
        }

        .btn-donate:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 154, 92, 0.5);
        }

        .level-badge {
            display: inline-block;
            padding: 4px 16px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #B8860B;
            margin-left: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .edit-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .edit-modal-overlay.active {
            display: flex;
        }

        .edit-modal {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 154, 92, 0.1);
        }

        .edit-modal-header h3 {
            font-size: 1.3rem;
            color: var(--bg-dark);
        }

        .edit-modal-close {
            width: 35px;
            height: 35px;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-light);
        }

        .edit-modal-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--bg-dark);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 154, 92, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border-color: var(--primary-brown);
            box-shadow: 0 0 0 3px rgba(255, 154, 92, 0.1);
        }

        .avatar-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .avatar-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            background: #FAF8F5;
        }

        .avatar-option:hover {
            transform: scale(1.1);
        }

        .avatar-option.selected {
            border-color: var(--primary-brown);
            background: rgba(255, 154, 92, 0.1);
        }

        .identity-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .identity-option {
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid rgba(255, 154, 92, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .identity-option:hover {
            border-color: var(--primary-brown);
        }

        .identity-option.selected {
            background: linear-gradient(135deg, var(--primary-brown), var(--primary-brown-light));
            border-color: var(--primary-brown);
            color: white;
        }

        .edit-modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(255, 154, 92, 0.1);
            display: flex;
            gap: 1rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 154, 92, 0.2);
            border-radius: 12px;
            background: white;
            color: var(--text-dark);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #FAF8F5;
        }

        .btn-save {
            flex: 2;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-brown), var(--primary-brown-light));
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 92, 0.4);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 154, 92, 0.5);
        }

        @media (max-width: 768px) {
            .mine-container {
                padding: 7rem 1rem 2rem;
            }

            .profile-header {
                padding: 2rem 1.5rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 2.8rem;
            }

            .profile-header h1 {
                font-size: 1.6rem;
            }

            .donation-summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .summary-number {
                font-size: 1.5rem;
            }

            .achievements-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }

            .achievement-badge {
                padding: 1rem 0.5rem;
            }

            .badge-icon {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .donation-item {
                flex-direction: column;
                text-align: center;
                padding: 1rem;
            }

            .donation-icon {
                margin-right: 0;
                margin-bottom: 0.8rem;
            }

            .donation-amount {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>

            <div class="edit-modal-body">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> 昵称</label>
                    <input type="text" id="editNameInput" placeholder="请输入您的昵称">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-smile"></i> 选择头像</label>
                    <div class="avatar-selector" id="avatarSelector">
                        <div class="avatar-option" data-icon="fa-user"><i class="fas fa-user"></i></div>
                        <div class="avatar-option" data-icon="fa-smile"><i class="fas fa-smile"></i></div>
                        <div class="avatar-option" data-icon="fa-heart"><i class="fas fa-heart"></i></div>
                        <div class="avatar-option" data-icon="fa-star"><i class="fas fa-star"></i></div>
                        <div class="avatar-option" data-icon="fa-sun"><i class="fas fa-sun"></i></div>
                        <div class="avatar-option" data-icon="fa-moon"><i class="fas fa-moon"></i></div>
                        <div class="avatar-option" data-icon="fa-cloud"><i class="fas fa-cloud"></i></div>

                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> 选择身份</label>
                    <div class="identity-selector" id="identitySelector">
                        <div class="identity-option" data-identity="爱心志愿者">爱心志愿者</div>
                        <div class="identity-option" data-identity="公益捐赠者">公益捐赠者</div>
                        <div class="identity-option" data-identity="心理咨询师">心理咨询师</div>
                        <div class="identity-option" data-identity="教育工作者">教育工作者</div>
                        <div class="identity-option" data-identity="医护人员">医护人员</div>
                        <div class="identity-option" data-identity="学生">学生</div>
                    </div>
                </div>
            </div>
            <div class="edit-modal-footer">
                <button class="btn-cancel" id="btnCancel">取消</button>
                <button class="btn-save" id="btnSave">保存</button>
            </div>
        </div>
    </div>

    <script>
        const achievements = [
            { id: 1, name: '初入公益', icon: 'fa-heart', desc: '首次捐款', unlocked: true },
            { id: 2, name: '温暖使者', icon: 'fa-star', desc: '累计捐款500元', unlocked: true },
            { id: 3, name: '爱心达人', icon: 'fa-trophy', desc: '累计捐款1000元', unlocked: true },
            { id: 4, name: '公益新星', icon: 'fa-rocket', desc: '参与3个项目', unlocked: true },
            { id: 5, name: '持之以恒', icon: 'fa-calendar', desc: '连续捐款3个月', unlocked: false },
            { id: 6, name: '大爱无疆', icon: 'fa-globe', desc: '累计捐款5000元', unlocked: false },
            { id: 7, name: '心灵守护者', icon: 'fa-brain', desc: '关注心理健康项目', unlocked: true },
            { id: 8, name: '长者之友', icon: 'fa-users', desc: '关注老龄化项目', unlocked: true },
            { id: 9, name: '未来之光', icon: 'fa-graduation-cap', desc: '关注教育公平项目', unlocked: false },
            { id: 10, name: '网络卫士', icon: 'fa-shield-alt', desc: '关注网络文明项目', unlocked: false },
            { id: 11, name: '月度之星', icon: 'fa-moon', desc: '月捐款次数最多', unlocked: false },
            { id: 12, name: '年度先锋', icon: 'fa-sun', desc: '年度捐款总额最高', unlocked: false }
        ];

        const donationRecords = [
            { id: 1, project: '心理健康帮扶计划', category: 'mental', amount: 200, date: '2024-01-15', desc: '帮助青少年心理健康咨询服务' },
            { id: 2, project: '空巢老人陪伴项目', category: 'aging', amount: 150, date: '2024-02-20', desc: '为独居老人提供日常陪伴和关怀' },
            { id: 3, project: '乡村教育支持计划', category: 'edu', amount: 300, date: '2024-03-10', desc: '为乡村学校捐赠图书和学习用品' },
            { id: 4, project: '心理健康帮扶计划', category: 'mental', amount: 100, date: '2024-04-05', desc: '支持心理辅导课程开展' },
            { id: 5, project: '网络文明宣传活动', category: 'cyber', amount: 200, date: '2024-05-18', desc: '抵制网络暴力宣传物料制作' },
            { id: 6, project: '空巢老人陪伴项目', category: 'aging', amount: 250, date: '2024-06-22', desc: '端午节老人关怀活动' }
        ];

        function getCategoryIcon(category) {
            const icons = {
                mental: 'fa-brain',
                aging: 'fa-users',
                edu: 'fa-graduation-cap',
                cyber: 'fa-shield-alt'
            };
            return icons[category] || 'fa-heart';
        }

        function loadUserData() {
            let data = localStorage.getItem('gongyi_user_data');
            if (!data) {
                data = JSON.stringify({
                    totalDonation: 1200,
                    totalTimes: 6,
                    totalProjects: 4,
                    donationRecords: donationRecords,
                    name: '爱心使者',
                    avatar: 'fa-user',
                    identity: '爱心志愿者'
                });
                localStorage.setItem('gongyi_user_data', data);
            }
            return JSON.parse(data);
        }

        function saveUserData(data) {
            localStorage.setItem('gongyi_user_data', JSON.stringify(data));
        }

        function renderProfile(userData) {
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const userIdentity = document.getElementById('userIdentity');
            
            if (userName) {
                userName.innerHTML = userData.name + '<span class="level-badge">Lv.3 温暖守护者</span>';
            }
            if (userAvatar) {
                userAvatar.innerHTML = '<i class="fas ' + userData.avatar + '"></i>';
            }
            if (userIdentity) {
                userIdentity.textContent = userData.identity;
            }
        }

        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            const unlockedCount = achievements.filter(a => a.unlocked).length;
            
            document.getElementById('achievementCount').textContent = unlockedCount;
            
            grid.innerHTML = achievements.map(achievement => `
                <div class="achievement-badge ${achievement.unlocked ? 'unlocked' : 'locked'}">
                    <div class="badge-icon">
                        <i class="fas ${achievement.icon}"></i>
                    </div>
                    <h4>${achievement.name}</h4>
                    <p>${achievement.desc}</p>
                </div>
            `).join('');
        }

        function renderDonationTimeline(records) {
            const timeline = document.getElementById('donationTimeline');
            
            if (records.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clock"></i>
                        <h3>暂无捐款记录</h3>
                        <p>您还没有捐款记录，快去参与公益吧！</p>
                        <a href="action.html" class="btn-donate">
                            <i class="fas fa-heart"></i> 立即捐款
                        </a>
                    </div>
                `;
                return;
            }

            timeline.innerHTML = records.map(record => `
                <div class="timeline-item">
                    <div class="timeline-header">
                        <h4>${record.project}</h4>
                        <span class="timeline-date">${record.date}</span>
                    </div>
                    <div class="timeline-amount">¥${record.amount}</div>
                    <div class="timeline-desc">${record.desc}</div>
                </div>
            `).join('');
        }

        function renderDonationHistory(records) {
            const history = document.getElementById('donationHistory');
            
            if (records.length === 0) {
                history.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>暂无捐款记录</h3>
                        <p>您还没有捐款记录，快去参与公益吧！</p>
                        <a href="action.html" class="btn-donate">
                            <i class="fas fa-heart"></i> 立即捐款
                        </a>
                    </div>
                `;
                return;
            }

            history.innerHTML = records.map(record => `
                <div class="donation-item">
                    <div class="donation-icon ${record.category}">
                        <i class="fas ${getCategoryIcon(record.category)}"></i>
                    </div>
                    <div class="donation-info">
                        <h4>${record.project}</h4>
                        <p>${record.date}</p>
                    </div>
                    <div class="donation-amount">¥${record.amount}</div>
                </div>
            `).join('');
        }

        function animateValue(id, end, duration = 1500) {
            const element = document.getElementById(id);
            const start = 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                const current = Math.floor(start + (end - start) * easeOutQuart);
                
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = end;
                }
            }

            requestAnimationFrame(update);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const userData = loadUserData();
            
            animateValue('totalDonation', userData.totalDonation);
            animateValue('totalTimes', userData.totalTimes);
            animateValue('totalProjects', userData.totalProjects);
            
            renderProfile(userData);
            renderAchievements();
            renderDonationTimeline(userData.donationRecords);
            renderDonationHistory(userData.donationRecords);

            const editProfileBtn = document.getElementById('editProfileBtn');
            const editModalOverlay = document.getElementById('editModalOverlay');
            const editModalClose = document.getElementById('editModalClose');
            const btnCancel = document.getElementById('btnCancel');
            const btnSave = document.getElementById('btnSave');
            const editNameInput = document.getElementById('editNameInput');
            const avatarSelector = document.getElementById('avatarSelector');
            const identitySelector = document.getElementById('identitySelector');

            let selectedAvatar = userData.avatar;
            let selectedIdentity = userData.identity;

            function openEditModal() {
                editNameInput.value = userData.name;
                selectedAvatar = userData.avatar;
                selectedIdentity = userData.identity;
                
                avatarSelector.querySelectorAll('.avatar-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.icon === selectedAvatar);
                });
                
                identitySelector.querySelectorAll('.identity-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.identity === selectedIdentity);
                });
                
                editModalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeEditModal() {
                editModalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            avatarSelector.addEventListener('click', function(e) {
                const option = e.target.closest('.avatar-option');
                if (option) {
                    avatarSelector.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedAvatar = option.dataset.icon;
                }
            });

            identitySelector.addEventListener('click', function(e) {
                const option = e.target.closest('.identity-option');
                if (option) {
                    identitySelector.querySelectorAll('.identity-option').forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedIdentity = option.dataset.identity;
                }
            });

            btnSave.addEventListener('click', function() {
                const newName = editNameInput.value.trim() || '爱心使者';
                
                userData.name = newName;
                userData.avatar = selectedAvatar;
                userData.identity = selectedIdentity;
                
                saveUserData(userData);
                renderProfile(userData);
                closeEditModal();
            });

            editProfileBtn.addEventListener('click', openEditModal);
            editModalClose.addEventListener('click', closeEditModal);
            btnCancel.addEventListener('click', closeEditModal);
            
            editModalOverlay.addEventListener('click', function(e) {
                if (e.target === editModalOverlay) {
                    closeEditModal();
                }
            });
        });
    </script>
    <script src="common.js"></script>
</body>
</html>
