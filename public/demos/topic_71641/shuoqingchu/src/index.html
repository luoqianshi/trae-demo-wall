<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>说清楚点</title>
  <style>
    /* ===== DESIGN_SPEC 深色科技风 ===== */
    :root {
      --bg: #0B1020; --bg2: #121A38;
      --ink: #EDF2FF; --muted: #9AA6CC; --faint: #5B678C;
      --accent: #5B8CFF; --accent2: #6EE7F9;
      --warn: #FFB454; --good: #5FE3A1;
      --glass: rgba(255,255,255,.045); --glass-line: rgba(255,255,255,.09);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* 背景光晕 */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -3; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%, rgba(91,140,255,.1), transparent),
        radial-gradient(ellipse 50% 50% at 85% 15%, rgba(110,231,249,.07), transparent),
        radial-gradient(ellipse 40% 40% at 90% 85%, rgba(150,100,255,.05), transparent);
    }
    /* 网格 */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 25%, black 30%, transparent 70%);
      mask-image: radial-gradient(ellipse 60% 50% at 50% 25%, black 30%, transparent 70%);
    }
    /* 粒子 canvas */
    #bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

    /* ---- 头部 ---- */
    header { text-align: center; padding: 40px 24px 30px; }
    .eyebrow {
      font-size: 13px; text-transform: uppercase; letter-spacing: .28em;
      color: var(--accent2); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent2); box-shadow: 0 0 8px var(--accent2);
      display: inline-block;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 68px); font-weight: 800;
      background: linear-gradient(135deg, #fff 20%, var(--accent) 50%, var(--accent2) 80%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub { color: var(--muted); font-size: 18px; margin-top: 8px; }

    /* ---- 布局 ---- */
    main {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
      max-width: 1240px; margin: 0 auto; padding: 0 24px 100px;
    }

    /* ---- 玻璃卡片 ---- */
    .card {
      background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 16px; padding: 20px 22px; margin-bottom: 16px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .card h3 { margin: 0 0 12px; font-size: 19px; color: var(--ink); }
    .card-label {
      font-size: 12px; text-transform: uppercase; letter-spacing: .2em;
      color: var(--faint); margin-bottom: 10px;
    }
    .card-label::before {
      content: ''; display: inline-block;
      width: 24px; height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      vertical-align: middle; margin-right: 10px;
    }

    /* ---- 输入区 ---- */
    textarea {
      width: 100%; min-height: 360px; font-size: 18px; padding: 16px;
      border: 1px solid var(--glass-line); border-radius: 14px;
      background: rgba(6,10,24,.5); color: var(--ink);
      resize: vertical; font-family: inherit; line-height: 1.7;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 16px rgba(91,140,255,.25); }
    textarea::placeholder { color: var(--faint); }

    .controls { margin-top: 14px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

    /* ---- 主按钮 ---- */
    .btn-primary {
      font-size: 17px; padding: 10px 24px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; cursor: pointer; font-weight: 600;
      box-shadow: 0 4px 20px rgba(91,140,255,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(91,140,255,.5); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ---- 演示模式开关 ---- */
    .toggle-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--muted); cursor: pointer; user-select: none;
    }
    .toggle-label input { display: none; }
    .toggle-track {
      width: 40px; height: 22px; border-radius: 11px;
      background: rgba(255,255,255,.12); position: relative; transition: background .25s;
    }
    .toggle-track::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--muted); transition: transform .25s, background .25s;
    }
    .toggle-label input:checked + .toggle-track { background: var(--accent); }
    .toggle-label input:checked + .toggle-track::after { transform: translateX(18px); background: #fff; }

    /* ---- 朗读按钮 ---- */
    .speak-btn {
      float: right; padding: 4px 12px; font-size: 14px; border-radius: 20px;
      border: 1px solid var(--glass-line); background: var(--glass);
      color: var(--ink); cursor: pointer; transition: background .2s;
    }
    .speak-btn:hover { background: rgba(255,255,255,.1); }

    /* ---- 大白话 ---- */
    #plain { font-size: 20px; line-height: 1.75; color: var(--ink); }

    /* ---- 划重点：菱形标记 ---- */
    #keypoints { list-style: none; padding: 0; }
    #keypoints li {
      position: relative; padding-left: 20px; margin-bottom: 8px; line-height: 1.6;
    }
    #keypoints li::before {
      content: ''; position: absolute; left: 2px; top: 7px;
      width: 9px; height: 9px; background: var(--accent); transform: rotate(45deg);
    }

    /* ---- 要注意的坑：琥珀警示卡 ---- */
    .card-warn { background: rgba(255,180,84,.06); border-color: rgba(255,180,84,.2); }
    .card-warn h3 { color: var(--warn); }
    #warnings { list-style: none; padding: 0; }
    #warnings li {
      position: relative; padding-left: 22px; margin-bottom: 8px; line-height: 1.6;
      color: var(--warn);
    }
    #warnings li::before {
      content: '!'; position: absolute; left: 0; top: 0;
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(255,180,84,.2); color: var(--warn);
      font-size: 12px; font-weight: 700; text-align: center; line-height: 16px;
    }

    /* ---- 顾问建议：绿色建设性卡片 ---- */
    .card-advice { background: rgba(95,227,161,.05); border-color: rgba(95,227,161,.15); }
    .card-advice h3 { color: var(--good); }
    #advice { color: var(--good); line-height: 1.7; }

    /* ---- 扫描光效 ---- */
    #result.loading .card {
      position: relative; overflow: hidden;
    }
    #result.loading .card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(91,140,255,.1) 50%, transparent 70%);
      animation: scan 1.2s ease-in-out infinite;
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ---- 底部免责声明 ---- */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; text-align: center;
      padding: 10px; font-size: 13px; color: var(--faint);
      background: rgba(11,16,32,.7);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--glass-line);
    }

    /* ---- 响应式 ---- */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    /* ---- 无障碍：关动画 ---- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0s !important; animation-iteration-count: 1 !important;
        transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <header>
    <div class="eyebrow"><span class="dot"></span>AI · 文字解读器</div>
    <h1>说清楚点</h1>
    <div class="sub">把合同、条款、报告里看不懂的文字，一键变成大白话。</div>
  </header>

  <main>
    <!-- 左侧：输入 -->
    <section>
      <div class="card input-card">
        <div class="card-label">原文 · 粘进来</div>
        <textarea id="input" placeholder="把合同条款、说明书、体检报告、政策通知等粘进来……"></textarea>
        <div class="controls">
          <button id="btn" class="btn-primary">解读 ▸</button>
          <label class="toggle-label">
            <input type="checkbox" id="demoMode" />
            <span class="toggle-track"></span>
            演示模式
          </label>
        </div>
      </div>
    </section>

    <!-- 右侧：结果 -->
    <section id="result">
      <div class="card"><h3>大白话 <button id="speakBtn" class="speak-btn">🔊 朗读</button></h3><div id="plain">结果会显示在这里。</div></div>
      <div class="card"><h3>划重点</h3><ul id="keypoints"></ul></div>
      <div class="card card-warn"><h3>要注意的坑</h3><ul id="warnings"></ul></div>
      <div class="card card-advice"><h3>顾问建议</h3><div id="advice"></div></div>
    </section>
  </main>

  <footer>仅供理解参考，以原文为准</footer>

  <script>
    // =====================================================================
    // 以下为骨架，函数体留空 / TODO，交由现场 TRAE Agent 实现。
    // 参考：AGENTS.md、PRD.md、prompts/system_prompt.md
    // =====================================================================

    const $ = (id) => document.getElementById(id);

    // 演示模式内置示例（内容来自 prompts/demo_sample.json）
    const DEMO_SAMPLE = {"plain":"这份合同说的是：你租这套房子，押金两个月、每月按时交房租；如果你要提前退租，押金不退，还得再赔一个月房租当违约金。","keypoints":["押金是 2 个月房租，符合条件退租时才退。","每月 5 号前交房租，晚交每天按房租的 1% 收滞纳金。","合同期一年，到期想续租要提前 30 天说。"],"warnings":["提前退租不仅押金不退，还要多赔 1 个月房租，成本很高。","'房屋自然损耗'范围没写清，退房可能被扣钱，入住时先拍照留证。","维修责任写的是'由承租方负责'，一些本该房东修的也可能算到你头上。"],"advice":"签约前建议争取删除或改写'自然损耗由承租方维修'这条，并把提前退租的违约金上限谈低；入住当天对房屋现状逐处拍照留存，作为退租时的凭证。"};

    // 设置 loading 态：按钮禁用 + 文案切换 + 结果区扫描光效
    function setLoading(loading) {
      const btn = $('btn');
      btn.disabled = loading;
      btn.textContent = loading ? '解读中…' : '解读 ▸';
      $('result').classList.toggle('loading', loading);
    }

    // 安全解析 content：JSON.parse → 去 markdown 围栏 → 兜底
    function safeParse(content) {
      try {
        return JSON.parse(content);
      } catch (_) {
        // 尝试去掉 markdown 围栏 ```json ... ``` 或 ``` ... ```
        const cleaned = content.replace(/^```(?:json)?\s*([\s\S]*?)\s*```$/i, '$1').trim();
        try {
          return JSON.parse(cleaned);
        } catch (__) {
          // 彻底失败：把原文放进 plain，不乱码不白屏
          return { plain: content, keypoints: [], warnings: [], advice: '' };
        }
      }
    }

    // 点击「解读」的主流程
    async function onExplain() {
      const textarea = $('input');
      const text = textarea.value.trim();
      if (!text) { textarea.focus(); return; }

      setLoading(true);
      try {
        let data;
        if ($('demoMode').checked) {
          // 演示模式：直接用内置常量，不调后端
          data = DEMO_SAMPLE;
        } else {
          const res = await fetch('/api/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          const json = await res.json();
          if (json.error) {
            // 后端返回错误，兜底显示错误信息
            data = { plain: `请求失败：${json.error}`, keypoints: [], warnings: [], advice: '' };
          } else {
            data = safeParse(json.content);
          }
        }
        render(data);
      } catch (e) {
        // 网络异常兜底
        render({ plain: `请求出错：${e.message || String(e)}`, keypoints: [], warnings: [], advice: '' });
      } finally {
        setLoading(false);
      }
    }

    // 把 {plain, keypoints, warnings, advice} 渲染到右侧四块
    function render(data) {
      const d = data || {};
      // 大白话
      $('plain').textContent = d.plain || '';

      // 划重点：数组逐条 li，用 textContent 防注入
      const kp = $('keypoints');
      kp.innerHTML = '';
      (d.keypoints || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        kp.appendChild(li);
      });

      // 要注意的坑：数组逐条 li
      const w = $('warnings');
      w.innerHTML = '';
      (d.warnings || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        w.appendChild(li);
      });

      // 顾问建议：字符串填入
      $('advice').textContent = d.advice || '';
    }

    // 朗读 plain 文本，使用浏览器 speechSynthesis（lang='zh-CN'）
    function onSpeak() {
      const text = ($('plain').textContent || '').trim();
      if (!text) return;

      const synth = window.speechSynthesis;
      // 朗读前先取消正在播放的
      synth.cancel();

      const doSpeak = () => {
        const voices = synth.getVoices();
        // 优先选中文语音（lang 含 zh，或 name 含 zh/中文）
        let voice = voices.find(v => v.lang.includes('zh') || v.name.includes('zh') || v.name.includes('中文'));
        if (!voice && voices.length > 0) voice = voices[0];

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN';
        if (voice) utter.voice = voice;
        synth.speak(utter);
      };

      // 处理首次点击没声的坑：声音是异步加载的
      if (synth.getVoices().length > 0) {
        doSpeak();
      } else {
        let fired = false;
        const handler = () => { if (!fired) { fired = true; doSpeak(); } };
        synth.onvoiceschanged = handler;
        // setTimeout 兜底：500ms 后无论如何都执行
        setTimeout(() => { if (!fired) { fired = true; doSpeak(); } }, 500);
      }
    }

    $('btn').addEventListener('click', onExplain);
    $('speakBtn').addEventListener('click', onSpeak);

    // ===== 粒子星座背景（canvas） =====
    (() => {
      const canvas = document.getElementById('bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let w, h;
      const particles = [];
      const MAX = 60;
      const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // 粒子数按屏幕面积算，上限 MAX
      const count = Math.min(MAX, Math.max(35, Math.floor(w * h / 18000)));
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
          r: Math.random() * 1.5 + .5
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        // 邻近粒子间连线
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              const alpha = (1 - dist / 140) * .2;
              ctx.strokeStyle = `rgba(91,140,255,${alpha})`;
              ctx.lineWidth = .5;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
        // 光点
        for (const p of particles) {
          ctx.fillStyle = 'rgba(110,231,249,.55)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function update() {
        for (const p of particles) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
          if (p.y < -10) p.y = h + 10;
          if (p.y > h + 10) p.y = -10;
        }
      }

      function loop() {
        update(); draw();
        if (!REDUCED) requestAnimationFrame(loop);
      }

      if (REDUCED) { draw(); }
      else { requestAnimationFrame(loop); }
    })();
  </script>
</body>
</html>
