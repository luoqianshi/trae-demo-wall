<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>说清楚点 · AI 文字解读器</title>
  <!-- 【完整可用 · 科技风参考版】Agent 造不出来时，复制到 src/index.html 即可。单文件、零依赖、离线可用（不含真实调用时）。 -->
  <style>
    :root{
      --bg:#0B1020; --bg2:#121A38; --line:rgba(120,140,200,.14);
      --ink:#EDF2FF; --muted:#9AA6CC; --faint:#5B678C;
      --accent:#5B8CFF; --accent2:#6EE7F9; --warn:#FFB454; --good:#5FE3A1;
      --glass:rgba(255,255,255,.045); --glass-line:rgba(255,255,255,.09);
      --radius:16px;
    }
    *{box-sizing:border-box;} html,body{height:100%;}
    body{
      margin:0; color:var(--ink);
      font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.7; background:var(--bg); position:relative; overflow-x:hidden;
    }
    /* 背景光晕 + 网格，制造纵深科技感 */
    #bg{position:fixed; inset:0; z-index:-1; pointer-events:none;}
    body::before{
      content:""; position:fixed; inset:0; z-index:-3;
      background:
        radial-gradient(600px 400px at 12% -5%, rgba(91,140,255,.22), transparent 60%),
        radial-gradient(700px 500px at 100% 0%, rgba(110,231,249,.14), transparent 55%),
        radial-gradient(600px 600px at 80% 110%, rgba(120,90,255,.14), transparent 60%),
        var(--bg);
    }
    body::after{
      content:""; position:fixed; inset:0; z-index:-2; opacity:.5;
      background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:44px 44px; mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 78%);
    }
    .wrap{max-width:1240px; margin:0 auto; padding:40px 32px 96px;}

    /* 头部 */
    .eyebrow{
      display:inline-flex; align-items:center; gap:8px;
      font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent2);
      font-weight:600; margin-bottom:14px;
    }
    .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2);}
    h1{
      margin:0; font-size:clamp(40px,6vw,68px); font-weight:800; letter-spacing:.02em;
      background:linear-gradient(100deg,#EDF2FF 20%,var(--accent) 60%,var(--accent2) 90%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    .sub{color:var(--muted); font-size:18px; margin-top:10px;}

    main{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:36px; align-items:start;}
    @media(max-width:900px){ main{grid-template-columns:1fr;} }

    .panel{
      background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--radius);
      padding:22px; backdrop-filter:blur(10px);
    }
    .plabel{
      display:flex; align-items:center; gap:10px; font-size:13px; letter-spacing:.2em;
      text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:14px;
    }
    .plabel::before{content:""; width:18px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px;}

    textarea{
      width:100%; min-height:360px; resize:vertical; color:var(--ink); font-size:18px; line-height:1.7;
      background:rgba(6,10,24,.5); border:1px solid var(--glass-line); border-radius:12px; padding:16px;
      font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s;
    }
    textarea::placeholder{color:var(--faint);}
    textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,140,255,.18);}

    .controls{display:flex; align-items:center; gap:18px; margin-top:16px; flex-wrap:wrap;}
    .btn{
      position:relative; border:none; cursor:pointer; color:#061024; font-weight:700; font-size:17px;
      padding:13px 26px; border-radius:12px; letter-spacing:.02em;
      background:linear-gradient(100deg,var(--accent),var(--accent2));
      box-shadow:0 8px 24px rgba(91,140,255,.35); transition:transform .15s, box-shadow .2s, filter .2s;
    }
    .btn:hover{transform:translateY(-1px); box-shadow:0 12px 30px rgba(91,140,255,.5);}
    .btn:active{transform:translateY(0);}
    .btn:disabled{filter:grayscale(.4) brightness(.9); cursor:not-allowed; box-shadow:none;}
    .btn .arrow{margin-left:8px;}

    /* 演示模式开关 */
    .toggle{display:inline-flex; align-items:center; gap:10px; color:var(--muted); font-size:15px; cursor:pointer; user-select:none;}
    .toggle input{position:absolute; opacity:0; pointer-events:none;}
    .track{width:44px; height:24px; border-radius:20px; background:rgba(255,255,255,.12); border:1px solid var(--glass-line); position:relative; transition:background .2s;}
    .track::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#cfd8f5; transition:transform .2s, background .2s;}
    .toggle input:checked + .track{background:linear-gradient(100deg,var(--accent),var(--accent2));}
    .toggle input:checked + .track::after{transform:translateX(20px); background:#061024;}
    .toggle input:focus-visible + .track{box-shadow:0 0 0 3px rgba(91,140,255,.3);}

    /* 结果区 */
    .results{display:flex; flex-direction:column; gap:18px; position:relative;}
    .card{background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--radius); padding:20px 22px; transition:border-color .2s;}
    .card h3{margin:0 0 12px; font-size:15px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; display:flex; align-items:center; justify-content:space-between;}
    #plain{font-size:20px; color:var(--ink); line-height:1.75;}
    .card ul{margin:0; padding:0; list-style:none;}
    .card li{position:relative; padding-left:26px; margin:12px 0; font-size:17px; color:#DCE4FF;}
    .card.key li::before{content:""; position:absolute; left:2px; top:11px; width:9px; height:9px; border-radius:2px; transform:rotate(45deg); background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 0 10px rgba(91,140,255,.6);}
    /* “坑”卡片：琥珀警示，视觉优先级最高 */
    .card.warn{border-color:rgba(255,180,84,.35); background:linear-gradient(180deg,rgba(255,180,84,.08),var(--glass));}
    .card.warn h3{color:var(--warn);}
    .card.warn li{color:#FCE9CC;}
    .card.warn li::before{content:"!"; position:absolute; left:0; top:0; width:18px; height:18px; border-radius:50%; background:rgba(255,180,84,.16); color:var(--warn); font-size:12px; font-weight:800; text-align:center; line-height:18px;}
    /* 「意见建议」卡：顾问口吻，绿色建设性色调 */
    .card.advice{border-color:rgba(95,227,161,.3); background:linear-gradient(180deg,rgba(95,227,161,.07),var(--glass));}
    .card.advice h3{color:var(--good);}
    #advice{font-size:17px; color:#DFF6EA; line-height:1.75;}

    .speak{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; font-size:13px; letter-spacing:normal; text-transform:none; cursor:pointer; color:var(--accent2); background:rgba(110,231,249,.1); border:1px solid rgba(110,231,249,.25); border-radius:20px; transition:background .2s;}
    .speak:hover{background:rgba(110,231,249,.2);}
    .speak.on{animation:pulse 1s infinite;}
    @keyframes pulse{50%{opacity:.55;}}

    /* 解码中的扫描光效（signature） */
    .results.loading .card{position:relative; overflow:hidden;}
    .results.loading .card::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(100deg,transparent 20%,rgba(110,231,249,.14) 50%,transparent 80%);
      transform:translateX(-100%); animation:scan 1.2s infinite;
    }
    @keyframes scan{to{transform:translateX(100%);}}
    .err{color:var(--warn);}

    footer{position:fixed; bottom:0; left:0; right:0; text-align:center; padding:12px; font-size:13px; color:var(--faint); background:rgba(11,16,32,.7); backdrop-filter:blur(8px); border-top:1px solid var(--line);}
    @media(prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="wrap">
    <header>
      <span class="eyebrow"><span class="dot"></span>AI · 文字解读器</span>
      <h1>说清楚点</h1>
      <div class="sub">把合同、条款、报告里看不懂的文字，一键变成大白话。</div>
    </header>

    <main>
      <section class="panel">
        <div class="plabel">原文 · 粘进来</div>
        <textarea id="input" placeholder="把合同条款、说明书、体检报告、政策通知等粘进来，点“解读”……"></textarea>
        <div class="controls">
          <button class="btn" id="btn">解读<span class="arrow">▸</span></button>
          <label class="toggle"><input type="checkbox" id="demoMode" /><span class="track"></span>演示模式</label>
        </div>
      </section>

      <section class="results" id="results">
        <div class="card">
          <h3>大白话 <button class="speak" id="speakBtn">🔊 朗读</button></h3>
          <div id="plain">结果会显示在这里。</div>
        </div>
        <div class="card key">
          <h3>划重点</h3>
          <ul id="keypoints"></ul>
        </div>
        <div class="card warn">
          <h3>要注意的坑</h3>
          <ul id="warnings"></ul>
        </div>
        <div class="card advice">
          <h3>顾问建议</h3>
          <div id="advice"></div>
        </div>
      </section>
    </main>
  </div>

  <footer>仅供理解参考，以原文为准</footer>

  <script>
    const $=(id)=>document.getElementById(id), sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

    const DEMO_SAMPLE={
      plain:"这份合同说的是：你租这套房子，押金两个月、每月按时交房租；如果你要提前退租，押金不退，还得再赔一个月房租当违约金。",
      keypoints:["押金是 2 个月房租，符合条件退租时才退。","每月 5 号前交房租，晚交每天按房租的 1% 收滞纳金。","合同期一年，到期想续租要提前 30 天说。"],
      warnings:["提前退租不仅押金不退，还要多赔 1 个月房租，成本很高。","‘房屋自然损耗’范围没写清，退房可能被扣钱，入住时先拍照留证。","维修责任写的是‘由承租方负责’，一些本该房东修的也可能算到你头上。"],
      advice:"签约前建议争取删除或改写‘自然损耗由承租方维修’这条，并把提前退租的违约金上限谈低；入住当天对房屋现状逐处拍照留存，作为退租时的凭证。"
    };

    function setLoading(on){
      $('btn').disabled=on; $('btn').innerHTML = on ? '解读中…' : '解读<span class="arrow">▸</span>';
      $('results').classList.toggle('loading', on);
    }
    function safeParse(s){
      if(!s) return null;
      try{return JSON.parse(s);}catch(_){}
      const c=s.replace(/```json|```/g,'').trim();
      try{return JSON.parse(c);}catch(_){}
      return {plain:s,keypoints:[],warnings:[]};
    }
    function fill(ulId,arr){
      const ul=$(ulId); ul.innerHTML='';
      (arr||[]).forEach(t=>{const li=document.createElement('li'); li.textContent=t; ul.appendChild(li);});
    }
    function render(d){ $('plain').textContent=d.plain||'（无结果）'; fill('keypoints',d.keypoints); fill('warnings',d.warnings); $('advice').textContent=d.advice||''; }
    function showError(msg){
      $('plain').innerHTML='<span class="err"></span>';
      $('plain').firstChild.textContent='出错了：'+msg+'（可勾选“演示模式”继续演示）';
      fill('keypoints',[]); fill('warnings',[]); $('advice').textContent='';
    }

    async function onExplain(){
      const text=$('input').value.trim();
      if(!text){ $('input').focus(); return; }
      setLoading(true);
      try{
        let data;
        if($('demoMode').checked){ await sleep(700); data=DEMO_SAMPLE; }
        else{
          const r=await fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
          const raw=await r.json();
          if(raw.error) throw new Error(raw.error);
          data=safeParse(raw.content)||{plain:'（解析失败）',keypoints:[],warnings:[]};
        }
        render(data);
      }catch(e){ showError(e.message||String(e)); }
      finally{ setLoading(false); }
    }

    // —— 朗读：修复“首次点击没声音”的语音加载坑 ——
    function loadVoices(){
      return new Promise(res=>{
        let v=speechSynthesis.getVoices();
        if(v.length){res(v);return;}
        speechSynthesis.onvoiceschanged=()=>res(speechSynthesis.getVoices());
        setTimeout(()=>res(speechSynthesis.getVoices()),300); // 兜底，防止事件不触发
      });
    }
    async function onSpeak(){
      const t=$('plain').textContent.trim();
      if(!t || !window.speechSynthesis) return;
      const voices=await loadVoices();
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t);
      u.lang='zh-CN';
      const zh=voices.find(v=>/zh|chinese|中文/i.test((v.lang||'')+(v.name||'')));
      if(zh) u.voice=zh;
      const b=$('speakBtn'); b.classList.add('on');
      u.onend=()=>b.classList.remove('on'); u.onerror=()=>b.classList.remove('on');
      speechSynthesis.speak(u);
    }
    if(window.speechSynthesis) speechSynthesis.getVoices(); // 预热语音列表

    $('btn').addEventListener('click',onExplain);
    $('speakBtn').addEventListener('click',onSpeak);

    // —— 背景粒子星座动画（canvas，零依赖）——
    (function(){
      const c=document.getElementById('bg'); if(!c) return;
      let ctx; try{ ctx=c.getContext('2d'); }catch(e){ return; } if(!ctx) return; // 无 canvas 环境(如测试)直接退出
      const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
      let w,h,dpr,ps,raf;
      function resize(){
        dpr=Math.min(window.devicePixelRatio||1,2);
        w=c.width=innerWidth*dpr; h=c.height=innerHeight*dpr;
        c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
        const n=Math.min(70,Math.floor(innerWidth*innerHeight/22000));
        ps=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,
          vx:(Math.random()-.5)*0.18*dpr,vy:(Math.random()-.5)*0.18*dpr,r:(Math.random()*1.6+0.6)*dpr}));
      }
      function step(){
        ctx.clearRect(0,0,w,h);
        const L=130*dpr;
        for(let i=0;i<ps.length;i++){
          const p=ps[i];
          if(!reduce){ p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x+=w; if(p.x>w)p.x-=w; if(p.y<0)p.y+=h; if(p.y>h)p.y-=h; }
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle='rgba(110,231,249,.55)'; ctx.fill();
          for(let j=i+1;j<ps.length;j++){
            const q=ps[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
            if(d<L){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
              ctx.strokeStyle='rgba(91,140,255,'+(0.18*(1-d/L))+')'; ctx.lineWidth=dpr; ctx.stroke(); }
          }
        }
        if(!reduce) raf=requestAnimationFrame(step);
      }
      addEventListener('resize',()=>{cancelAnimationFrame(raf); resize(); raf=requestAnimationFrame(step);});
      resize(); raf=requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
