<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物愈诊室 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --green:#3A7D44;--green-light:#5AAE68;--green-bg:rgba(58,125,68,0.08);
    --orange:#C46B3A;--orange-light:#E8945A;--orange-bg:rgba(196,107,58,0.08);
    --red:#D94F4F;--red-bg:rgba(217,79,79,0.08);
    --bg:#FAFAF6;--bg2:#F0EFEB;--ink:#2C2C2C;--muted:#8A8A82;
    --rule:#D8D6CF;--white:#fff;--shadow:0 2px 12px rgba(0,0,0,0.06);
  }
  html{font-size:16px;-webkit-font-smoothing:antialiased}
  body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}

  .header{background:linear-gradient(135deg,#2D5E35 0%,#3A7D44 100%);color:#fff;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .header-left{display:flex;align-items:center;gap:0.75rem}
  .header-logo{width:36px;height:36px;background:rgba(255,255,255,0.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
  .header h1{font-size:1.15rem;font-weight:700;letter-spacing:0.01em}
  .header h1 span{font-size:0.78rem;font-weight:400;opacity:0.75;margin-left:0.5rem;padding:0.15rem 0.5rem;background:rgba(255,255,255,0.15);border-radius:20px}
  .badge-demo{font-size:0.7rem;font-weight:700;padding:0.2rem 0.6rem;background:var(--orange);color:#fff;border-radius:20px;letter-spacing:0.05em}

  .main{max-width:480px;margin:0 auto;padding:1.5rem 1rem 3rem}

  .upload-area{border:2px dashed var(--rule);border-radius:16px;padding:3rem 1.5rem;text-align:center;cursor:pointer;transition:all 0.3s;background:var(--bg2)}
  .upload-area:hover,.upload-area.dragover{border-color:var(--green);background:var(--green-bg)}
  .upload-icon{font-size:3rem;margin-bottom:0.75rem;opacity:0.6}
  .upload-title{font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:0.3rem}
  .upload-hint{font-size:0.82rem;color:var(--muted)}
  .upload-area input{display:none}

  .preview-section{margin-top:1.25rem;display:none}
  .preview-wrapper{position:relative;border-radius:12px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
  .preview-wrapper img{width:100%;display:block}
  .preview-wrapper canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  .preview-actions{display:flex;gap:0.75rem;margin-top:1rem}

  .btn{flex:1;padding:0.75rem 1rem;border:none;border-radius:10px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.4rem}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:#32703B}
  .btn-primary:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}
  .btn-secondary{background:var(--bg2);color:var(--muted);border:1px solid var(--rule)}
  .btn-secondary:hover{background:var(--rule)}

  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.85);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
  .loading-overlay.active{display:flex}
  .spinner{width:44px;height:44px;border:3px solid var(--rule);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:0.9rem;color:var(--muted);font-weight:500}

  .result-section{margin-top:1.5rem;display:none}
  .result-card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--rule)}

  .status-banner{padding:1.25rem 1.5rem;display:flex;align-items:center;gap:0.75rem}
  .status-banner.healthy{background:var(--green-bg);border-bottom:1px solid rgba(58,125,68,0.15)}
  .status-banner.sub-health{background:var(--orange-bg);border-bottom:1px solid rgba(196,107,58,0.15)}
  .status-banner.unhealthy{background:var(--red-bg);border-bottom:1px solid rgba(217,79,79,0.15)}
  .status-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
  .status-banner.healthy .status-icon{background:var(--green);color:#fff}
  .status-banner.sub-health .status-icon{background:var(--orange);color:#fff}
  .status-banner.unhealthy .status-icon{background:var(--red);color:#fff}
  .status-info h2{font-size:1.1rem;font-weight:700;line-height:1.3}
  .status-banner.healthy h2{color:var(--green)}
  .status-banner.sub-health h2{color:var(--orange)}
  .status-banner.unhealthy h2{color:var(--red)}
  .status-info p{font-size:0.82rem;color:var(--muted);margin-top:0.15rem}

  .metrics{padding:1rem 1.5rem;display:flex;gap:1rem}
  .metric{flex:1;text-align:center;padding:0.75rem 0.5rem;background:var(--bg2);border-radius:10px}
  .metric-value{font-size:1.5rem;font-weight:700;line-height:1.2}
  .metric-value.green{color:var(--green)}
  .metric-value.orange{color:var(--orange)}
  .metric-value.red{color:var(--red)}
  .metric-label{font-size:0.72rem;color:var(--muted);margin-top:0.15rem;font-weight:500}

  .diagnosis-list{padding:0 1.5rem 1rem}
  .diagnosis-item{padding:0.85rem 0;border-bottom:1px solid var(--rule);display:flex;gap:0.75rem;align-items:flex-start}
  .diagnosis-item:last-child{border-bottom:none}
  .diagnosis-dot{width:8px;height:8px;border-radius:50%;margin-top:0.45rem;flex-shrink:0}
  .diagnosis-dot.green{background:var(--green)}
  .diagnosis-dot.orange{background:var(--orange)}
  .diagnosis-dot.red{background:var(--red)}
  .diagnosis-text h4{font-size:0.88rem;font-weight:700;line-height:1.3}
  .diagnosis-text p{font-size:0.8rem;color:var(--muted);margin-top:0.15rem;line-height:1.5}

  .advice-section{padding:1.25rem 1.5rem;background:var(--bg2);border-top:1px solid var(--rule)}
  .advice-section h3{font-size:0.85rem;font-weight:700;color:var(--green);margin-bottom:0.6rem;display:flex;align-items:center;gap:0.35rem}
  .advice-text{font-size:0.85rem;color:var(--ink);line-height:1.7;white-space:pre-line}

  .chat-section{margin-top:1.25rem;display:none}
  .chat-card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--rule);overflow:hidden}
  .chat-header{padding:0.85rem 1.25rem;background:var(--green);color:#fff;font-size:0.85rem;font-weight:700;display:flex;align-items:center;gap:0.4rem}
  .chat-messages{padding:1rem;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:0.6rem;min-height:80px}
  .chat-msg{font-size:0.82rem;line-height:1.6;padding:0.6rem 0.85rem;border-radius:10px;max-width:88%;white-space:pre-line;word-break:break-word}
  .chat-msg.bot{background:var(--bg2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:2px}
  .chat-msg.user{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
  .chat-input-row{display:flex;padding:0.75rem;border-top:1px solid var(--rule);gap:0.5rem}
  .chat-input{flex:1;border:1px solid var(--rule);border-radius:8px;padding:0.6rem 0.85rem;font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 0.2s}
  .chat-input:focus{border-color:var(--green)}
  .chat-send{background:var(--green);color:#fff;border:none;border-radius:8px;padding:0.6rem 1rem;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer;transition:background 0.2s}
  .chat-send:hover{background:#32703B}
  .chat-send:disabled{background:var(--rule);cursor:not-allowed}

  @media(min-width:600px){.main{padding:2rem 1.5rem 3rem}}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-logo">🌿</div>
    <h1>植物愈诊室 <span>TRAE AI Demo</span></h1>
  </div>
  <div class="badge-demo">DEMO</div>
</header>

<main class="main">
  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📸</div>
    <div class="upload-title">拍一张植物照片</div>
    <div class="upload-hint">点击上传或拖拽图片到这里<br>支持 JPG / PNG / WEBP</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-section" id="previewSection">
    <div class="preview-wrapper">
      <img id="previewImg" alt="植物照片">
      <canvas id="overlayCanvas"></canvas>
    </div>
    <div class="preview-actions">
      <button class="btn btn-primary" id="diagnoseBtn">开始诊断</button>
      <button class="btn btn-secondary" id="retakeBtn">重新拍照</button>
    </div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-card">
      <div class="status-banner" id="statusBanner">
        <div class="status-icon" id="statusIcon"></div>
        <div class="status-info">
          <h2 id="statusTitle"></h2>
          <p id="statusDesc"></p>
        </div>
      </div>
      <div class="metrics" id="metricsRow"></div>
      <div class="diagnosis-list" id="diagnosisList"></div>
      <div class="advice-section">
        <h3>💡 养护建议</h3>
        <div class="advice-text" id="adviceText"></div>
      </div>
    </div>
  </div>

  <div class="chat-section" id="chatSection">
    <div class="chat-card">
      <div class="chat-header">🌱 AI 养护顾问</div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot">诊断完成！你可以继续问我关于这盆植物的任何问题，比如浇水频率、光照需求、施肥建议等。</div>
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chatInput" placeholder="例如：这个情况严重吗？" maxlength="200">
        <button class="chat-send" id="chatSend">发送</button>
      </div>
    </div>
  </div>
</main>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">正在分析植物健康状况...</div>
</div>

<canvas id="analysisCanvas" style="display:none"></canvas>

<script>
(function(){
  // ===== STATE =====
  let currentResult = null;

  // ===== DOM =====
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const previewSection = document.getElementById('previewSection');
  const previewImg = document.getElementById('previewImg');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const diagnoseBtn = document.getElementById('diagnoseBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const resultSection = document.getElementById('resultSection');
  const chatSection = document.getElementById('chatSection');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatMessages = document.getElementById('chatMessages');
  const analysisCanvas = document.getElementById('analysisCanvas');

  // ===== UPLOAD =====
  uploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault(); uploadArea.classList.remove('dragover');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file){
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewImg.onload = () => {
        overlayCanvas.width = previewImg.naturalWidth;
        overlayCanvas.height = previewImg.naturalHeight;
        clearOverlay();
        uploadArea.style.display = 'none';
        previewSection.style.display = 'block';
        resultSection.style.display = 'none';
        chatSection.style.display = 'none';
      };
    };
    reader.readAsDataURL(file);
  }

  retakeBtn.addEventListener('click', () => {
    previewSection.style.display = 'none';
    resultSection.style.display = 'none';
    chatSection.style.display = 'none';
    uploadArea.style.display = '';
    fileInput.value = '';
    currentResult = null;
    chatMessages.innerHTML = '<div class="chat-msg bot">诊断完成！你可以继续问我关于这盆植物的任何问题。</div>';
  });

  function clearOverlay(){
    const ctx = overlayCanvas.getContext('2d');
    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  }

  // ===== COLOR CONVERSION UTILS =====
  // Convert RGB to HSV matching OpenCV's convention: H:0-180, S:0-255, V:0-255
  // This ensures thresholds are directly comparable to the Python backend
  function rgbToHsv(r, g, b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0, s=max===0?0:d/max, v=max;
    if(d!==0){
      if(max===r) h=((g-b)/d+(g<b?6:0))/6;
      else if(max===g) h=((b-r)/d+2)/6;
      else h=((r-g)/d+4)/6;
    }
    return [h*180, s*255, v*255]; // H: 0-180, S: 0-255, V: 0-255 (OpenCV range)
  }

  // ===== CORE ANALYSIS ENGINE =====
  function analyzeImage(imgElement){
    // Draw image to offscreen canvas and read pixel data
    const w = imgElement.naturalWidth;
    const h = imgElement.naturalHeight;
    // Downscale for performance if very large
    const maxDim = 800;
    let sw = w, sh = h;
    if(w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w, h);
      sw = Math.round(w * scale);
      sh = Math.round(h * scale);
    }
    analysisCanvas.width = sw;
    analysisCanvas.height = sh;
    const ctx = analysisCanvas.getContext('2d', {willReadFrequently: true});
    ctx.drawImage(imgElement, 0, 0, sw, sh);
    const imageData = ctx.getImageData(0, 0, sw, sh);
    const data = imageData.data;
    const total = sw * sh;

    let plantPixels = 0;
    let greenCount = 0, yellowCount = 0, brownCount = 0, whiteCount = 0, darkCount = 0;

    // Also collect anomaly positions for region detection
    const yellowPositions = [];
    const brownPositions = [];
    const whitePositions = [];
    const darkPositions = [];

    // Grid for region detection (divide image into cells)
    const cellSize = 20;
    const cols = Math.ceil(sw / cellSize);
    const rows = Math.ceil(sh / cellSize);
    const yellowGrid = Array.from({length: rows}, () => new Array(cols).fill(false));
    const brownGrid = Array.from({length: rows}, () => new Array(cols).fill(false));
    const whiteGrid = Array.from({length: rows}, () => new Array(cols).fill(false));
    const darkGrid  = Array.from({length: rows}, () => new Array(cols).fill(false));

    for(let i=0; i<data.length; i+=4){
      const r=data[i], g=data[i+1], b=data[i+2];
      const [hue, sat, val] = rgbToHsv(r, g, b);

      // Plant mask: has saturation, not too dark or too bright (matching OpenCV thresholds)
      const isPlant = sat > 15 && val > 30 && val < 245;
      if(isPlant) plantPixels++;

      if(!isPlant) continue;

      // Green: H 25-90, S>40 (matching OpenCV)
      if(hue>=25 && hue<=90 && sat>40){
        greenCount++;
      }
      // Yellow: H 18-35, S>40
      if(hue>=18 && hue<=35 && sat>40){
        yellowCount++;
        const px=(i/4)%sw, py=Math.floor((i/4)/sw);
        yellowPositions.push([px,py]);
        const cx=Math.min(Math.floor(px/cellSize),cols-1);
        const cy=Math.min(Math.floor(py/cellSize),rows-1);
        yellowGrid[cy][cx] = true;
      }
      // Brown: H 5-25 (or H 170-180 wrapping), S>30, V>20, V<180
      if(((hue>=5 && hue<=25) || (hue>=170)) && sat>30 && val>20 && val<180){
        brownCount++;
        const px=(i/4)%sw, py=Math.floor((i/4)/sw);
        brownPositions.push([px,py]);
        const cx=Math.min(Math.floor(px/cellSize),cols-1);
        const cy=Math.min(Math.floor(py/cellSize),rows-1);
        brownGrid[cy][cx] = true;
      }
      // White/gray: low saturation, high value (matching OpenCV)
      if(sat<50 && val>180){
        whiteCount++;
        const px=(i/4)%sw, py=Math.floor((i/4)/sw);
        const cx=Math.min(Math.floor(px/cellSize),cols-1);
        const cy=Math.min(Math.floor(py/cellSize),rows-1);
        whiteGrid[cy][cx] = true;
      }
      // Dark: low value (matching OpenCV)
      if(val<60){
        darkCount++;
        const px=(i/4)%sw, py=Math.floor((i/4)/sw);
        const cx=Math.min(Math.floor(px/cellSize),cols-1);
        const cy=Math.min(Math.floor(py/cellSize),rows-1);
        darkGrid[cy][cx] = true;
      }
    }

    if(plantPixels < total * 0.02){
      return {
        green_ratio:0.3, yellow_ratio:0.05, brown_ratio:0.02,
        white_ratio:0.01, dark_ratio:0.02, plant_ratio:0,
        anomalies:[]
      };
    }

    const ratios = {
      green_ratio: greenCount / plantPixels,
      yellow_ratio: yellowCount / plantPixels,
      brown_ratio: brownCount / plantPixels,
      white_ratio: whiteCount / plantPixels,
      dark_ratio: darkCount / plantPixels,
      plant_ratio: plantPixels / total
    };

    // Detect anomaly regions from grids
    const anomalies = [];
    const minCellArea = 4; // minimum cells to form a region

    function extractRegionsFromGrid(grid, color, label, threshold){
      if(ratios[threshold.replace('_ratio','')] < (threshold==='yellow_ratio'?0.08:threshold==='brown_ratio'?0.05:0.03)) return;
      const visited = Array.from({length:rows}, ()=>new Array(cols).fill(false));
      const regions = [];

      for(let r=0; r<rows; r++){
        for(let c=0; c<cols; c++){
          if(grid[r][c] && !visited[r][c]){
            // BFS flood fill
            const queue = [[r,c]];
            visited[r][c] = true;
            let minR=r,maxR=r,minC=c,maxC=c,count=0;
            while(queue.length){
              const [cr,cc] = queue.shift();
              count++;
              minR=Math.min(minR,cr); maxR=Math.max(maxR,cr);
              minC=Math.min(minC,cc); maxC=Math.max(maxC,cc);
              const neighbors = [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1],[cr-1,cc-1],[cr-1,cc+1],[cr+1,cc-1],[cr+1,cc+1]];
              for(const [nr,nc] of neighbors){
                if(nr>=0 && nr<rows && nc>=0 && nc<cols && grid[nr][nc] && !visited[nr][nc]){
                  visited[nr][nc] = true;
                  queue.push([nr,nc]);
                }
              }
            }
            if(count >= minCellArea){
              const pad = 0.5;
              const x = Math.max(0, (minC*cellSize - pad*cellSize) / sw);
              const y = Math.max(0, (minR*cellSize - pad*cellSize) / sh);
              const w2 = Math.min(1-x, ((maxC-minC+1)*cellSize + pad*2*cellSize) / sw);
              const h2 = Math.min(1-y, ((maxR-minR+1)*cellSize + pad*2*cellSize) / sh);
              regions.push({x,y,w:w2,h:h2,area:w2*h2});
            }
          }
        }
      }
      // Sort by area, take top N
      regions.sort((a,b) => b.area - a.area);
      const maxBoxes = label==='疑似霉层'||label==='深色病斑'?2:3;
      for(const r of regions.slice(0,maxBoxes)){
        anomalies.push({x:r.x, y:r.y, w:r.w, h:r.h, color, label});
      }
    }

    extractRegionsFromGrid(yellowGrid, 'rgb(236, 179, 18)', '叶片黄化', 'yellow_ratio');
    extractRegionsFromGrid(brownGrid, 'rgb(180, 83, 9)', '枯褐斑点', 'brown_ratio');
    extractRegionsFromGrid(whiteGrid, 'rgb(168, 162, 158)', '疑似霉层', 'white_ratio');
    extractRegionsFromGrid(darkGrid, 'rgb(120, 53, 15)', '深色病斑', 'dark_ratio');

    ratios.anomalies = anomalies;
    return ratios;
  }

  // ===== DIAGNOSIS GENERATION =====
  function generateDiagnosis(ratios){
    const {green_ratio:green, yellow_ratio:yellow, brown_ratio:brown, white_ratio:white, dark_ratio:dark} = ratios;
    const anomalies = ratios.anomalies || [];

    let unhealth = 0;
    unhealth += Math.min(yellow*200, 40);
    unhealth += Math.min(brown*300, 35);
    unhealth += Math.min(white*400, 15);
    unhealth += Math.min(dark*250, 10);
    const healthScore = Math.max(0, Math.min(100, Math.round(100 - unhealth)));

    const findings = [];
    const adviceParts = [];

    if(healthScore >= 80){
      findings.push({title:'叶色翠绿', desc:'绿色健康叶片占比高，植物光合作用状态良好', color:'green'});
      if(yellow > 0.05){
        findings.push({title:'轻微黄化迹象', desc:'检测到约 '+( yellow*100).toFixed(0)+'% 的叶片区域偏黄，属于正常的老叶代谢', color:'orange'});
      }
      adviceParts.push('当前养护状态良好，继续保持即可。');
    } else if(healthScore >= 50){
      if(yellow > 0.1){
        findings.push({title:'叶片黄化（约 '+(yellow*100).toFixed(0)+'%）', desc:'较多叶片区域偏黄，可能是浇水过多、光照不足或营养缺乏', color:'orange'});
        adviceParts.push('黄化可能与浇水过多有关——检查土壤是否积水，减少浇水频率，等表层土壤干燥 2-3cm 后再浇。');
        adviceParts.push('如果黄化集中在新叶，可能是缺铁；如果是老叶先黄，可能是缺氮。');
      }
      if(brown > 0.05){
        findings.push({title:'叶缘焦枯（约 '+(brown*100).toFixed(0)+'%）', desc:'检测到褐色区域，常见于空气干燥、施肥过量或根系受损', color:'orange'});
        adviceParts.push('叶缘焦枯通常与空气湿度过低或盐分积累有关——可以尝试用清水冲洗土壤表面，增加喷雾增湿。');
      }
      if(white > 0.03){
        findings.push({title:'疑似白色霉层', desc:'叶片表面检测到白色覆盖物，可能是白粉病或灰尘沉积', color:'orange'});
        adviceParts.push('如果白色粉末状物质可被擦除后重新出现，可能是白粉病——需隔离植物，增加通风，可用稀释的小苏打水喷洒。');
      }
    } else {
      if(yellow > 0.15){
        findings.push({title:'严重黄化（约 '+(yellow*100).toFixed(0)+'%）', desc:'大面积叶片发黄，植物整体光合能力严重下降', color:'red'});
        adviceParts.push('严重黄化说明问题已经持续了一段时间。最优先检查：根系是否腐烂（轻轻拔出查看根部颜色，健康为白色，腐烂为褐色发软）。');
      }
      if(brown > 0.08){
        findings.push({title:'大面积褐变坏死（约 '+(brown*100).toFixed(0)+'%）', desc:'检测到大量褐色枯死组织，可能为真菌感染或严重干旱损伤', color:'red'});
        adviceParts.push('大面积褐变需要及时修剪病变叶片，避免病害蔓延。用消毒剪刀剪去病叶，切口涂抹多菌灵粉末。');
      }
      if(dark > 0.08){
        findings.push({title:'深色病斑（约 '+(dark*100).toFixed(0)+'%）', desc:'检测到明显的深色/黑色斑点，高度怀疑真菌性病害感染', color:'red'});
        adviceParts.push('深色斑点可能是叶斑病或黑斑病，需使用广谱杀菌剂（如代森锰锌）喷洒，每 7 天一次，连续 2-3 次。');
      }
      if(white > 0.05){
        findings.push({title:'明显白色霉层', desc:'叶片表面覆盖大量白色物质，白粉病可能性大', color:'red'});
        adviceParts.push('白粉病感染较重，需立即隔离，加强通风光照，使用专用杀菌剂或稀释的白醋水喷洒。');
      }
      if(!adviceParts.length){
        adviceParts.push('植物整体状态较差，建议检查：是否长期缺水、是否被暴晒、是否施肥过量。');
      }
    }

    if(!findings.length){
      findings.push({title:'整体状态待评估', desc:'图像中植物特征不够明显，建议近距离拍摄叶片细节以获得更准确的诊断', color:'green'});
      adviceParts.push('建议：靠近植物拍摄，确保画面中有清晰的叶片细节，避免背景占比过大。');
    }

    // Add recovery hope for non-healthy states
    if(healthScore < 80 && green > 0.3){
      findings.push({title:'健康叶片占比 '+(green*100).toFixed(0)+'%', desc:'仍有较多绿色健康组织，及时干预有较大恢复希望', color:'green'});
    }

    // Metrics
    const metrics = [
      {value:String(healthScore), label:'健康评分', color: healthScore>=80?'green':(healthScore>=50?'orange':'red')},
      {value:(green*100).toFixed(0)+'%', label:'绿色占比', color:'green'},
      {value:(yellow*100).toFixed(0)+'%', label:'黄化率', color: yellow<0.08?'green':(yellow<0.15?'orange':'red')}
    ];
    if(brown > 0.02){
      metrics.push({value:(brown*100).toFixed(0)+'%', label:'褐变率', color: brown<0.08?'orange':'red'});
    }

    // Status
    let statusClass, statusIcon, statusLabel, statusDesc;
    if(healthScore >= 80){
      statusClass='healthy'; statusIcon='✅'; statusLabel='状态良好';
      statusDesc='综合健康评分 '+healthScore+'/100，植物整体状态不错';
    } else if(healthScore >= 50){
      statusClass='sub-health'; statusIcon='⚠️'; statusLabel='亚健康状态';
      statusDesc='综合健康评分 '+healthScore+'/100，植物出现了一些需要关注的问题';
    } else {
      statusClass='unhealthy'; statusIcon='🔴'; statusLabel='需要立即关注';
      statusDesc='综合健康评分仅 '+healthScore+'/100，植物出现了较严重的健康问题';
    }

    return {
      status_class:statusClass, status_icon:statusIcon, status_label:statusLabel, status_desc:statusDesc,
      metrics, findings, advice: adviceParts.join('\n\n'),
      anomalies,
      raw_ratios: {green_ratio:green, yellow_ratio:yellow, brown_ratio:brown, white_ratio:white, dark_ratio:dark}
    };
  }

  // ===== OVERLAY DRAWING =====
  function drawOverlay(anomalies){
    const ctx = overlayCanvas.getContext('2d');
    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    anomalies.forEach(a => {
      ctx.strokeStyle = a.color;
      ctx.lineWidth = Math.max(2, overlayCanvas.width * 0.005);
      ctx.setLineDash([8, 6]);
      const rx = a.x * overlayCanvas.width;
      const ry = a.y * overlayCanvas.height;
      const rw = a.w * overlayCanvas.width;
      const rh = a.h * overlayCanvas.height;
      const r = 6;
      ctx.beginPath();
      ctx.moveTo(rx+r, ry);
      ctx.lineTo(rx+rw-r, ry); ctx.arcTo(rx+rw, ry, rx+rw, ry+r, r);
      ctx.lineTo(rx+rw, ry+rh-r); ctx.arcTo(rx+rw, ry+rh, rx+rw-r, ry+rh, r);
      ctx.lineTo(rx+r, ry+rh); ctx.arcTo(rx, ry+rh, rx, ry+rh-r, r);
      ctx.lineTo(rx, ry+r); ctx.arcTo(rx, ry, rx+r, ry, r);
      ctx.closePath();
      ctx.stroke();
      // Semi-transparent fill
      ctx.fillStyle = a.color.replace('rgb','rgba').replace(')',',0.08)');
      ctx.fill();
      // Label
      ctx.setLineDash([]);
      ctx.font = 'bold '+Math.max(14, overlayCanvas.width*0.025)+'px sans-serif';
      ctx.fillStyle = a.color;
      const labelY = ry > overlayCanvas.height*0.08 ? ry-6 : ry+rh+18;
      ctx.fillText(a.label, rx+4, labelY);
    });
  }

  // ===== RENDER RESULT =====
  function renderResult(r){
    const banner = document.getElementById('statusBanner');
    const icon = document.getElementById('statusIcon');
    const title = document.getElementById('statusTitle');
    const desc = document.getElementById('statusDesc');
    banner.className = 'status-banner ' + r.status_class;
    icon.textContent = r.status_icon;
    title.textContent = r.status_label;
    desc.textContent = r.status_desc;

    document.getElementById('metricsRow').innerHTML = r.metrics.map(m =>
      '<div class="metric"><div class="metric-value '+m.color+'">'+m.value+'</div><div class="metric-label">'+m.label+'</div></div>'
    ).join('');

    document.getElementById('diagnosisList').innerHTML = r.findings.map(f =>
      '<div class="diagnosis-item"><div class="diagnosis-dot '+f.color+'"></div><div class="diagnosis-text"><h4>'+f.title+'</h4><p>'+f.desc+'</p></div></div>'
    ).join('');

    document.getElementById('adviceText').textContent = r.advice;
  }

  // ===== DIAGNOSE (pure client-side) =====
  diagnoseBtn.addEventListener('click', () => {
    diagnoseBtn.disabled = true;
    loadingOverlay.classList.add('active');

    // Use setTimeout to let the loading UI render before heavy computation
    setTimeout(() => {
      try {
        const ratios = analyzeImage(previewImg);
        currentResult = generateDiagnosis(ratios);
        renderResult(currentResult);
        drawOverlay(currentResult.anomalies);
        resultSection.style.display = 'block';
        chatSection.style.display = 'block';
      } catch(err){
        console.error(err);
        alert('诊断出错：' + err.message);
      } finally {
        diagnoseBtn.disabled = false;
        loadingOverlay.classList.remove('active');
      }
    }, 100);
  });

  // ===== CHAT =====
  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });

  function sendChat(){
    const msg = chatInput.value.trim();
    if(!msg) return;
    chatInput.value = '';
    appendMsg('user', msg);
    // Simulate typing delay
    const typing = document.createElement('div');
    typing.className = 'chat-msg bot';
    typing.textContent = '正在思考...';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    setTimeout(() => {
      typing.remove();
      appendMsg('bot', generateChatReply(msg, currentResult));
    }, 400 + Math.random()*400);
  }

  function appendMsg(role, text){
    const el = document.createElement('div');
    el.className = 'chat-msg '+role;
    el.textContent = text;
    chatMessages.appendChild(el);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // ===== CHAT RULES =====
  function generateChatReply(message, ctx){
    if(!ctx) return '请先上传植物照片并点击"开始诊断"。';
    const r = ctx.raw_ratios || {};
    const yellow = (r.yellow_ratio||0)*100;
    const brown = (r.brown_ratio||0)*100;
    const green = (r.green_ratio||0)*100;
    const status = ctx.status_label || '';
    const m = message.toLowerCase();

    if(/严重|要紧|会不会死|能救|危险/.test(m)){
      if(status.includes('良好')) return '目前情况不严重，植物整体状态不错，继续保持现在的养护方式就可以了。';
      if(status.includes('亚健康')) return '目前不算严重，但需要及时调整。如果按照建议的养护方案执行，1-2 周内应该能看到改善。';
      return '目前情况比较严重，需要立即采取行动。好消息是健康叶片占比约 '+green.toFixed(0)+'%，只要及时处理，恢复的可能性还是存在的。优先检查根系和浇水情况。';
    }
    if(/浇水|浇多少|湿度|干湿/.test(m)){
      if(yellow>15) return '根据诊断，你的植物黄化率较高，很可能是浇水过多。\n\n建议：\n1. 立即停止浇水 3-5 天\n2. 检查盆底是否有积水\n3. 恢复浇水后，等土壤表面干燥 2-3 厘米再浇\n4. 确保花盆有排水孔';
      if(brown>5) return '叶缘焦枯可能与空气干燥或水质有关。\n\n建议：\n1. 增加周围空气湿度（放水盘、喷雾）\n2. 避免直接用自来水浇灌\n3. 浇水时间选在早晨';
      return '根据诊断，浇水方面没有明显异常。\n\n建议：遵循"见干见湿"原则——表层土壤干燥后再浇，浇则浇透，确保花盆有排水孔。';
    }
    if(/光照|阳光|晒|放哪里|位置|窗户/.test(m)){
      if(yellow>10) return '叶片黄化可能与光照不足有关。\n\n建议：\n1. 放在朝东或朝北的窗台\n2. 避免正午阳光直射\n3. 每周转动花盆 90 度均匀受光';
      return '根据诊断，光照方面没有明显问题。\n\n大多数室内绿植适合明亮散射光，放在距离窗户 1-2 米的位置通常比较理想。';
    }
    if(/施肥|肥料|营养|缺什么/.test(m)){
      return '关于施肥：\n\n1. 如果植物状态不好，先不要施肥\n2. 等恢复健康后，生长季每 2-4 周施一次稀释液肥\n3. 秋冬减少或停止施肥\n4. 薄肥勤施，浓度控制在推荐量 1/2 到 1/3';
    }
    if(/换盆|换土|土壤/.test(m)){
      return '关于换盆：\n\n1. 根系从盆底冒出或浇水立即流出时需要换盆\n2. 最佳时间是春季\n3. 新盆比旧盆大 5-10 厘米\n4. 使用疏松透气的营养土\n5. 换盆后 1 周内不施肥，放阴凉处缓苗';
    }
    return '根据诊断结果，当前状态为「'+status+'」，健康叶片占比约 '+green.toFixed(0)+'%。\n\n主要建议：\n1. 确保浇水不过量\n2. 保持通风良好\n3. 定期检查叶片正反面\n4. 如有异常可再次拍照诊断追踪变化\n\n你也可以问我浇水频率、光照需求、施肥方法、是否需要换盆等具体问题。';
  }
})();
</script>
