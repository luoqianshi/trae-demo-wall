<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI全流程求职智能管家 - 测试控制台</title>
<style>
  :root {
    --primary: #667eea;
    --primary-dark: #5a6fd6;
    --primary-light: #eef0ff;
    --success: #52c41a;
    --warning: #faad14;
    --danger: #ff4d4f;
    --info: #1890ff;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #e8ecf1;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --radius: 12px;
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --transition: 0.2s ease;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  .header .badge {
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .tab-btn {
    padding: 14px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    border-bottom: 3px solid transparent;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover { color: var(--primary); }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  /* Main */
  .main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }
  .tab-content { display: none; animation: fadeIn 0.3s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Card */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: all var(--transition);
    background: var(--surface);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .form-group input.filled, .form-group select.filled {
    background: #f0fdf4;
    border-color: var(--success);
  }

  /* Button */
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #46a814; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats Cards */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    text-align: center;
    transition: all var(--transition);
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .stat-card .stat-value { font-size: 32px; font-weight: 700; color: var(--primary); }
  .stat-card .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .stat-card.success .stat-value { color: var(--success); }
  .stat-card.warning .stat-value { color: var(--warning); }
  .stat-card.info .stat-value { color: var(--info); }

  /* Delivery Table */
  .delivery-table { width: 100%; border-collapse: collapse; }
  .delivery-table th {
    text-align: left;
    padding: 12px 16px;
    background: var(--bg);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }
  .delivery-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .delivery-table tr:hover { background: var(--bg); }
  .status-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    display: inline-block;
  }
  .status-badge.applied { background: #e6f7ff; color: #1890ff; }
  .status-badge.viewed { background: #fff7e6; color: #fa8c16; }
  .status-badge.interview { background: #f6ffed; color: #52c41a; }
  .status-badge.offer { background: #f9f0ff; color: #722ed1; }
  .status-badge.rejected { background: #fff1f0; color: #f5222d; }

  /* Flow Steps */
  .flow-container { display: flex; align-items: center; justify-content: center; gap: 0; margin: 40px 0; flex-wrap: wrap; }
  .flow-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 120px;
  }
  .flow-step .step-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    transition: all 0.4s ease;
    border: 3px solid transparent;
  }
  .flow-step.active .step-circle {
    background: var(--primary);
    color: white;
    box-shadow: 0 0 0 4px var(--primary-light);
    transform: scale(1.1);
  }
  .flow-step.done .step-circle {
    background: var(--success);
    color: white;
  }
  .flow-step .step-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .flow-step.active .step-label { color: var(--primary); font-weight: 600; }
  .flow-step.done .step-label { color: var(--success); }
  .flow-arrow { color: var(--border); font-size: 20px; margin: 0 4px; }
  .flow-arrow.active { color: var(--success); }

  /* Timeline */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding: 8px 0 8px 24px;
    font-size: 14px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 14px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid white;
    box-shadow: 0 0 0 2px var(--primary);
  }
  .timeline-item.success::before { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
  .timeline-item.error::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
  .timeline-item .time { font-size: 12px; color: var(--text-muted); margin-right: 8px; }
  .timeline-item .action { font-weight: 600; }
  .timeline-item .detail { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

  /* AI Q&A */
  .qa-input { width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; }
  .qa-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .qa-output {
    background: #f8faff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 100px;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
  }
  .qa-output .typing { color: var(--text-muted); font-style: italic; }
  .quick-questions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .quick-q {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--surface);
  }
  .quick-q:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

  /* Progress Bar */
  .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 12px 0; }
  .progress-bar .fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s ease; }
  .progress-bar .fill.success { background: var(--success); }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.3s ease;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--info); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Action Area */
  .action-area { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .result-area { margin-top: 16px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 14px; display: none; }
  .result-area.show { display: block; }
  .result-area.error { background: #fef2f2; border-color: #fecaca; }

  /* Funnel */
  .funnel { display: flex; align-items: center; gap: 4px; margin: 20px 0; }
  .funnel-step {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    transition: all var(--transition);
  }
  .funnel-step.s1 { background: #1890ff; }
  .funnel-step.s2 { background: #fa8c16; }
  .funnel-step.s3 { background: #52c41a; }
  .funnel-step.s4 { background: #722ed1; }
  .funnel-arrow { color: var(--text-muted); font-size: 18px; }

  .section-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <h1>AI全流程求职智能管家</h1>
    <div class="subtitle">智联招聘AI创新大赛 - 综合测试控制台</div>
  </div>
  <div class="badge">测试模式 v1.0</div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('fill', this)">📝 一键填充表单</button>
  <button class="tab-btn" onclick="switchTab('ai', this)">💬 AI开放问题</button>
</div>

<!-- Main -->
<div class="main">

  <!-- Tab 1: 一键填充表单 -->
  <div class="tab-content active" id="tab-fill">
    <div class="card">
      <div class="card-title">📝 简历信息表单（模拟BOSS直聘志愿者页面）</div>
      <p class="section-desc">点击"一键填充"按钮，自动填充以下表单字段。模拟Chrome扩展在真实网站上的填充行为。</p>
      <div class="progress-bar" id="fill-progress"><div class="fill" style="width:0%"></div></div>
      <div class="form-grid">
        <div class="form-group"><label>姓名</label><input id="f-name" placeholder="请输入姓名"></div>
        <div class="form-group"><label>性别</label><select id="f-gender"><option value="">请选择</option><option>男</option><option>女</option></select></div>
        <div class="form-group"><label>出生日期</label><input id="f-birth" placeholder="YYYY/MM/DD"></div>
        <div class="form-group"><label>移动电话</label><input id="f-phone" placeholder="请输入手机号"></div>
        <div class="form-group"><label>电子邮箱</label><input id="f-email" placeholder="请输入邮箱"></div>
        <div class="form-group"><label>身份证号码</label><input id="f-idcard" placeholder="请输入身份证号"></div>
        <div class="form-group"><label>民族</label><select id="f-ethnicity"><option value="">请选择</option><option>汉族</option><option>蒙古族</option><option>回族</option><option>满族</option></select></div>
        <div class="form-group"><label>政治面貌</label><select id="f-political"><option value="">请选择</option><option>共青团员</option><option>中共党员</option><option>群众</option></select></div>
        <div class="form-group"><label>籍贯</label><input id="f-native" placeholder="省/市/区"></div>
        <div class="form-group"><label>户籍类型</label><select id="f-hukou"><option value="">请选择</option><option>城镇户籍</option><option>农村户籍</option></select></div>
      </div>
      <div class="form-group" style="margin-top:16px"><label>教育经历1 - 学校</label><input id="f-school1" placeholder="请输入学校"></div>
      <div class="form-grid">
        <div class="form-group"><label>学历</label><select id="f-degree1"><option value="">请选择</option><option>本科</option><option>硕士研究生</option></select></div>
        <div class="form-group"><label>专业</label><input id="f-major1" placeholder="请输入专业"></div>
      </div>
      <div class="action-area">
        <button class="btn btn-primary" id="btn-fill" onclick="fillForm()">📝 一键填充表单</button>
        <button class="btn btn-warning" onclick="clearForm()">清空表单</button>
      </div>
      <div class="result-area" id="fill-result"></div>
    </div>
  </div>

  <!-- Tab 2: AI开放问题 -->
  <div class="tab-content" id="tab-ai">
    <div class="card">
      <div class="card-title">💬 AI智能回答开放问题</div>
      <p class="section-desc">输入开放性问题，AI根据简历数据生成个性化回答。模拟Chrome扩展在真实表单中的AI填充功能。</p>
      <textarea class="qa-input" id="qa-input" placeholder="输入你的开放性问题，如：请简要自我介绍..."></textarea>
      <div class="quick-questions">
        <span class="quick-q" onclick="setQuestion('请简要自我介绍')">请简要自我介绍</span>
        <span class="quick-q" onclick="setQuestion('为什么选择我们公司')">为什么选择我们公司</span>
        <span class="quick-q" onclick="setQuestion('你的最大优势是什么')">你的最大优势是什么</span>
        <span class="quick-q" onclick="setQuestion('未来三年的职业规划')">未来三年的职业规划</span>
        <span class="quick-q" onclick="setQuestion('为什么适合这个岗位')">为什么适合这个岗位</span>
      </div>
      <div class="action-area">
        <button class="btn btn-primary" id="btn-ai" onclick="aiAnswer()">🤖 AI生成回答</button>
      </div>
      <div class="qa-output" id="qa-output"><span class="typing">AI回答将显示在这里...</span></div>
    </div>
  </div>

</div>

<script>
// ========== 模拟简历数据（虚构，仅用于测试演示） ==========
const RESUME_DATA = {
  name: '李文博', gender: '男', birthDate: '2001/03/22',
  phone: '13800138000', email: 'liwenbo@example.com', idCard: '110101200103221234',
  ethnicity: '汉族', politicalStatus: '群众',
  nativePlace: '北京市海淀区', hukouType: '城镇户籍',
  school1: '北京工业大学', degree1: '本科', major1: '计算机科学与技术',
  school2: '清华大学', degree2: '硕士研究生', major2: '人工智能',
  skills: 'Python, Java, 机器学习, SQL, 数据分析',
  selfEval: '热爱技术，学习能力强，对人工智能和软件开发有浓厚兴趣，具备良好的团队协作精神和沟通能力。'
};

// ========== 全局状态 ==========
let logs = [];

// ========== Tab切换 ==========
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ========== 一键填充表单 ==========
async function fillForm() {
  const btn = document.getElementById('btn-fill');
  btn.disabled = true;
  btn.textContent = '⏳ 填充中...';
  const fields = [
    { id: 'f-name', value: RESUME_DATA.name },
    { id: 'f-gender', value: RESUME_DATA.gender },
    { id: 'f-birth', value: RESUME_DATA.birthDate },
    { id: 'f-phone', value: RESUME_DATA.phone },
    { id: 'f-email', value: RESUME_DATA.email },
    { id: 'f-idcard', value: RESUME_DATA.idCard },
    { id: 'f-ethnicity', value: RESUME_DATA.ethnicity },
    { id: 'f-political', value: RESUME_DATA.politicalStatus },
    { id: 'f-native', value: RESUME_DATA.nativePlace },
    { id: 'f-hukou', value: RESUME_DATA.hukouType },
    { id: 'f-school1', value: RESUME_DATA.school1 },
    { id: 'f-degree1', value: RESUME_DATA.degree1 },
    { id: 'f-major1', value: RESUME_DATA.major1 },
  ];
  const progressBar = document.querySelector('#fill-progress .fill');
  let filled = 0;
  const fillDetails = [];
  for (const field of fields) {
    await sleep(150);
    const el = document.getElementById(field.id);
    if (el) {
      el.value = field.value;
      el.classList.add('filled');
      el.style.backgroundColor = '#f0fdf4';
      el.style.borderColor = '#52c41a';
      filled++;
      progressBar.style.width = (filled / fields.length * 100) + '%';
      fillDetails.push({ label: field.id.replace('f-',''), value: field.value, ok: true });
    } else {
      fillDetails.push({ label: field.id, value: 'NOT_FOUND', ok: false });
    }
  }
  await sleep(300);
  progressBar.classList.add('success');
  const result = document.getElementById('fill-result');
  result.className = 'result-area show';
  const detailList = fillDetails.map(d =>
    `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ddd;">
      <span>${d.label}</span>
      <strong style="color:${d.ok ? '#52c41a' : '#f5222d'}">${d.ok ? '✓ ' : '✗ '}${d.value}</strong>
    </div>`
  ).join('');
  result.innerHTML = `✅ <strong>填充完成</strong> — 成功填充 ${filled}/${fields.length} 个字段，填充率 ${Math.round(filled/fields.length*100)}%
    <div style="margin-top:12px;padding:8px;background:white;border-radius:6px;font-size:13px;">${detailList}</div>`;
  btn.disabled = false;
  btn.textContent = '📝 一键填充表单';
  addLog('一键填充表单', `成功填充 ${filled}/${fields.length} 个字段`, 'success');
  showToast('表单填充成功！', 'success');
}

function clearForm() {
  document.querySelectorAll('input, select, textarea').forEach(el => {
    if (el.id && el.id.startsWith('f-')) {
      el.value = '';
      el.classList.remove('filled');
      el.style.backgroundColor = '';
      el.style.borderColor = '';
    }
  });
  const progressBar = document.querySelector('#fill-progress .fill');
  progressBar.style.width = '0%';
  progressBar.classList.remove('success');
  document.getElementById('fill-result').classList.remove('show');
  showToast('表单已清空', 'info');
}

// ========== AI开放问题 ==========
function setQuestion(q) {
  document.getElementById('qa-input').value = q;
}

async function aiAnswer() {
  const question = document.getElementById('qa-input').value.trim();
  if (!question) { showToast('请输入问题', 'error'); return; }
  const btn = document.getElementById('btn-ai');
  btn.disabled = true;
  const output = document.getElementById('qa-output');
  output.innerHTML = '<span class="typing">🤖 AI正在思考...</span>';

  await sleep(800);
  const answer = generateAnswer(question);
  output.innerHTML = '';
  await typeText(output, answer, 30);
  btn.disabled = false;
  addLog('AI回答开放问题', `问题: "${question.substring(0,30)}..." → 生成${answer.length}字回答`, 'success');
  showToast('AI回答生成完成', 'success');
}

function generateAnswer(question) {
  const q = question.toLowerCase();

async function typeText(el, text, speed) {
  for (let i = 0; i < text.length; i++) {
    el.textContent = text.substring(0, i + 1);
    await sleep(speed);
  }
}

// ========== 工具函数 ==========
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showToast(msg, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

function addLog(action, detail, type = 'info') {
  console.log(`[${action}] ${detail}`);
}
