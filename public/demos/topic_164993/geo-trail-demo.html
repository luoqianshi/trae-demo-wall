  left: 0;

  height: 100%;

.compare-after-clip {
  overflow: hidden;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: white;
  z-index: 3;
  cursor: ew-resize;
}

.compare-slider-handle {
  position: absolute;

  left: 50%;

  height: 28px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.4);

// ====== 数据持久化 ======
const STORAGE_KEY = 'geotrail_data_v1';

function saveState() {
  try {
    const data = {
      version: 1,
      geoPoints: GEO_POINTS,
      samplePoints: SAMPLE_POINTS,
      disasterPoints: DISASTER_POINTS,
      patrolPoints: PATROL_POINTS,
      savedAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      showToast('存储空间已满，请导出数据后清理');
    }
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.version !== 1) return false;
    if (data.geoPoints && data.geoPoints.length > 0) {
      GEO_POINTS.length = 0;
      GEO_POINTS.push(...data.geoPoints);
    }
    if (data.samplePoints) {
      SAMPLE_POINTS.length = 0;
      SAMPLE_POINTS.push(...data.samplePoints);
    }
    if (data.disasterPoints) {
      DISASTER_POINTS.length = 0;
      DISASTER_POINTS.push(...data.disasterPoints);
    }
    if (data.patrolPoints) {
      PATROL_POINTS.length = 0;
      PATROL_POINTS.push(...data.patrolPoints);
    }
    return true;
  } catch(e) {
    return false;
  }
}

function clearStoredData() {
  localStorage.removeItem(STORAGE_KEY);
}

// 主题切换
function toggleTheme() {
  // 触发图标旋转动画
  const switchIcon = document.getElementById('themeSwitchIcon');
  if (switchIcon) {
    switchIcon.classList.remove('switching');
    void switchIcon.offsetWidth; // 强制重排以重启动画
    switchIcon.classList.add('switching');
  }
  
  // 手机屏幕过渡动画
  const screen = document.querySelector('.phone-screen');
  if (screen) {
    screen.classList.add('theme-transitioning');
  }
  
  // 延迟一帧后切换主题（等动画启动）
  requestAnimationFrame(() => {
    document.body.classList.toggle('outdoor-theme');
    const isOutdoor = document.body.classList.contains('outdoor-theme');

    // 更新外层按钮图标和文字
    const switchLabel = document.getElementById('themeSwitchLabel');
    if (switchLabel) {
      switchLabel.textContent = isOutdoor ? '切换夜间模式' : '切换户外模式';
    }
    if (switchIcon) {
      switchIcon.innerHTML = isOutdoor
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'

// 更新产状示意图
function updateAttitude() {
  const strike = parseInt(document.getElementById('f-strike')?.value) || 0;
  const dip = parseInt(document.getElementById('f-trend')?.value) || 0;
  const plunge = parseInt(document.getElementById('f-plunge')?.value) || 0;
  const svg = document.getElementById('attitudeSvg');
  if (!svg) return;

  const cx = 24, cy = 24, r = 18;
  // 走向线（双向，用粗实线表示）
  const strikeRad = (strike * Math.PI) / 180;
  const sx1 = cx - r * Math.cos(strikeRad), sy1 = cy - r * Math.sin(strikeRad);
  const sx2 = cx + r * Math.cos(strikeRad), sy2 = cy + r * Math.sin(strikeRad);

  // 倾向箭头方向
  const dipRad = (dip * Math.PI) / 180;
  const ax = cx + 12 * Math.cos(dipRad);
  const ay = cy + 12 * Math.sin(dipRad);

  svg.innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}" stroke="#00d4ff" stroke-width="2.5"/>
    <line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="${ax}" cy="${ay}" r="2" fill="#f59e0b"/>
    <text x="${cx}" y="${cy + 30}" text-anchor="middle" fill="#94a3b8" font-size="6">∠${plunge}°</text>
  `;
}

function calcStrikeFromDip() {
  const dip = parseInt(document.getElementById('f-trend').value) || 0;
  const strike = (dip + 90) % 360;
  document.getElementById('f-strike').value = strike;
  updateAttitude();
  showToast('走向已计算：' + strike + '°');
}

function calcDipFromStrike() {
  const strike = parseInt(document.getElementById('f-strike').value) || 0;
  const dip = (strike + 90) % 360;
  document.getElementById('f-trend').value = dip;
  updateAttitude();
  showToast('倾向已计算：' + dip + '°');
}

// 保存地质观察点数据
function saveGeoPoint() {
  if (!State.selectedPoint) return;
  const p = State.selectedPoint;
  // 输入校验
  const trend = parseInt(document.getElementById('f-trend').value);
  const plunge = parseInt(document.getElementById('f-plunge').value);
  const strike = parseInt(document.getElementById('f-strike').value);
  const errors = [];
  
  if (!isNaN(trend) && (trend < 0 || trend > 360)) errors.push('倾向应在0~360°之间');
  if (!isNaN(plunge) && (plunge < 0 || plunge > 90)) errors.push('倾角应在0~90°之间');
  if (!isNaN(strike) && (strike < 0 || strike > 360)) errors.push('走向应在0~360°之间');
  if (!isNaN(strike) && !isNaN(trend) && Math.abs(((strike - trend + 360) % 360) - 90) > 5 && Math.abs(((strike - trend + 360) % 360) - 270) > 5) {
    errors.push('走向与倾向应相差90°（当前偏差较大，请确认）');
  }
  
  if (errors.length > 0) {
    showToast(errors[0]);
    return;
  }
  p.lithology = document.getElementById('f-lithology').value.split(' (')[0];
  p.era = document.getElementById('f-era').value;
  p.strike = parseInt(document.getElementById('f-strike').value) || 0;
  p.trend = parseInt(document.getElementById('f-trend').value) || 0;
  p.plunge = parseInt(document.getElementById('f-plunge').value) || 0;
  p.contact = document.getElementById('f-contact').value;
  p.structure = document.getElementById('f-structure').value;
  p.weathering = document.getElementById('f-weathering').value;
  p.fossil = document.getElementById('f-fossil').value;
  p.desc = document.getElementById('f-desc').value;
  p.collected = true;
  saveState();
  closeDrawer();
  showToast('数据已保存（离线缓存）');
  // 刷新地图
  setTimeout(() => renderModeContent(), 100);
}

// 跳转到下一个未采集的观察点
function nextGeoPoint() {
  if (!State.selectedPoint) return;
  const idx = GEO_POINTS.findIndex(p => p.id === State.selectedPoint.id);
  const next = GEO_POINTS.find((p, i) => i > idx && !p.collected);
  if (next) {
    setTimeout(() => openGeoPoint(next.id), 200);
  } else {
    showToast('所有观察点已采集完成！');
  }
}

// 生成地层柱状图
function generateColumnChart() {
  const layers = [
    { era:'第四系(Q)', lithology:'残坡积层', thickness:8, pattern:'soil', contact:'整合' },
    { era:'白垩系(K)', lithology:'花岗岩', thickness:45, pattern:'granite', contact:'侵入接触' },
    { era:'白垩系(K)', lithology:'花岗闪长岩', thickness:60, pattern:'granite_diorite', contact:'整合' },
    { era:'奥陶系(O)', lithology:'灰岩', thickness:35, pattern:'limestone', contact:'平行不整合' },
    { era:'寒武系(∈)', lithology:'砂岩', thickness:25, pattern:'sandstone', contact:'整合' },
    { era:'寒武系(∈)', lithology:'页岩', thickness:18, pattern:'shale', contact:'整合' },
    { era:'元古宇(Pt)', lithology:'黑云母片岩', thickness:50, pattern:'schist', contact:'角度不整合' },
  ];

  const colW = 50, colX = 100;
  const topY = 20, maxH = 380, maxThick = layers.reduce((s,l)=>s+l.thickness,0);
  const scale = maxH / maxThick;
  let y = topY;
  const W = 360, H = 460;

  // 岩性花纹定义
  function drawPattern(type, x, y, w, h) {
    let s = '';
    if (type === 'soil') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#8B7355" opacity="0.6"/>`;
      for (let i = 0; i < h; i += 4) s += `<line x1="${x}" y1="${y+i}" x2="${x+w}" y2="${y+i}" stroke="#5C4033" stroke-width="0.3" opacity="0.5"/>`;
    } else if (type === 'granite') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#d4a8a0" opacity="0.4"/>`;
      for (let py = y+5; py < y+h; py += 8) for (let px = x+5; px < x+w; px += 8) s += `<circle cx="${px+Math.random()*3}" cy="${py+Math.random()*3}" r="1" fill="#fff" opacity="0.6"/>`;
    } else if (type === 'granite_diorite') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#c9a0a0" opacity="0.4"/>`;
      for (let py = y+4; py < y+h; py += 6) for (let px = x+4; px < x+w; px += 6) { s += `<circle cx="${px}" cy="${py}" r="0.8" fill="#fff" opacity="0.5"/>`; s += `<circle cx="${px+3}" cy="${py+3}" r="0.6" fill="#000" opacity="0.3"/>`; }
    } else if (type === 'limestone') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#a8b8c8" opacity="0.4"/>`;
      for (let py = y; py < y+h; py += 6) { s += `<line x1="${x}" y1="${py}" x2="${x+w}" y2="${py}" stroke="#6b7b8b" stroke-width="0.4"/>`; s += `<line x1="${x}" y1="${py}" x2="${x+w*0.7}" y2="${py+4}" stroke="#6b7b8b" stroke-width="0.3"/>`; }
    } else if (type === 'sandstone') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e8d8a8" opacity="0.4"/>`;
      for (let py = y; py < y+h; py += 3) s += `<line x1="${x}" y1="${py}" x2="${x+w}" y2="${py}" stroke="#b8a878" stroke-width="0.3" opacity="0.6"/>`;
    } else if (type === 'shale') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#7a8a7a" opacity="0.4"/>`;
      for (let py = y; py < y+h; py += 2) s += `<line x1="${x}" y1="${py}" x2="${x+w}" y2="${py}" stroke="#5a6a5a" stroke-width="0.2" opacity="0.5"/>`;
    } else if (type === 'schist') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#6b6b8b" opacity="0.4"/>`;
      for (let i = 0; i < h; i += 5) { const wave = Math.sin(i*0.3)*2; s += `<line x1="${x}" y1="${y+i}" x2="${x+w}" y2="${y+i+wave}" stroke="#4b4b6b" stroke-width="0.3" opacity="0.6"/>`; }
    }
    return s;
  }

  // 接触关系符号
  function drawContact(type, x, y, w) {
    if (type === '整合') return `<line x1="${x-3}" y1="${y}" x2="${x+w+3}" y2="${y}" stroke="#94a3b8" stroke-width="1"/>`;
    if (type === '平行不整合') return `<line x1="${x-3}" y1="${y}" x2="${x+w+3}" y2="${y}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>`;
    if (type === '角度不整合') return `<path d="M${x-3},${y} Q${x},${y-3} ${x+5},${y} T${x+15},${y} T${x+25},${y} T${x+35},${y} T${x+w+3},${y}" fill="none" stroke="#ef4444" stroke-width="1"/>`;
    if (type === '断层接触') return `<line x1="${x-3}" y1="${y}" x2="${x+w+3}" y2="${y}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>`;
    if (type === '侵入接触') return `<line x1="${x-3}" y1="${y}" x2="${x+w+3}" y2="${y}" stroke="#d4a843" stroke-width="1" stroke-dasharray="1 3"/>`;
    return `<line x1="${x-3}" y1="${y}" x2="${x+w+3}" y2="${y}" stroke="#94a3b8" stroke-width="1"/>`;
  }

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;">`;
  // 标题
  svg += `<text x="${W/2}" y="14" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">实测地层柱状剖面图</text>`;
  // 比例尺
  svg += `<line x1="${colX}" y1="${topY}" x2="${colX-20}" y2="${topY}" stroke="#94a3b8" stroke-width="0.5"/>`;
  svg += `<text x="${colX-22}" y="${topY+3}" text-anchor="end" fill="#94a3b8" font-size="5">0m</text>`;
  svg += `<line x1="${colX-20}" y1="${topY+50}" x2="${colX-20}" y2="${topY}" stroke="#94a3b8" stroke-width="0.5"/>`;
  svg += `<text x="${colX-22}" y="${topY+53}" text-anchor="end" fill="#94a3b8" font-size="5">${Math.round(50/scale)}</text>`;
  // 表头
  svg += `<text x="${colX+colW/2}" y="${topY-4}" text-anchor="middle" fill="#94a3b8" font-size="5">柱状图</text>`;
  svg += `<text x="${colX+colW+50}" y="${topY-4}" text-anchor="middle" fill="#94a3b8" font-size="5">层厚/岩性</text>`;

  layers.forEach((layer, i) => {
    const h = Math.max(3, layer.thickness * scale);
    // 岩性花纹
    svg += drawPattern(layer.pattern, colX, y, colW, h);
    // 柱边框
    svg += `<rect x="${colX}" y="${y}" width="${colW}" height="${h}" fill="none" stroke="#64748b" stroke-width="0.5"/>`;
    // 接触关系符号
    if (i > 0) svg += drawContact(layer.contact, colX, y, colW);
    // 层厚标注
    svg += `<text x="${colX+colW+5}" y="${y+h/2+1}" fill="#cbd5e1" font-size="4.5">${layer.thickness}m</text>`;
    // 岩性描述
    svg += `<text x="${colX+colW+30}" y="${y+h/2+1}" fill="#94a3b8" font-size="4.5">${layer.lithology}</text>`;
    // 时代标注
    svg += `<text x="${colX+colW+30}" y="${y+h/2-3}" fill="#60a5fa" font-size="4">${layer.era}</text>`;
    y += h;
  });

  // 比例尺底部
  svg += `<line x1="${colX-20}" y1="${y}" x2="${colX-20}" y2="${topY}" stroke="#94a3b8" stroke-width="0.5"/>`;
  svg += `<text x="${colX-22}" y="${y+3}" text-anchor="end" fill="#94a3b8" font-size="5">${Math.round(maxThick)}</text>`;
  svg += `</svg>`;

  let html = `
    <div style="padding:12px 16px;">
      <div style="font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">📊 实测地层柱状剖面图</div>
      <div style="font-size:0.65rem;color:var(--text3);margin-bottom:12px;">基于野外实测数据 · 含岩性花纹与接触关系</div>
      <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;overflow-x:auto;">
        ${svg}
      </div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.6rem;color:var(--text3);">
        <div>📐 比例尺：1:${Math.round(maxThick * 50)}</div>
        <div>🪨 岩性花纹：7种标准类型</div>
        <div>⚡ 接触关系：5类标注</div>
        <div>📏 总厚度：${maxThick}m</div>
      </div>
      <div style="margin-top:12px;padding:8px 12px;background:rgba(96,165,250,0.05);border-radius:6px;border:1px solid rgba(96,165,250,0.1);">
        <div style="font-size:0.65rem;color:var(--text2);line-height:1.5;">
          <b>📋 符号说明：</b><br>
          ━ 整合 &nbsp; ╌ 平行不整合 &nbsp; ∿ 角度不整合 &nbsp; ╌╌ 断层 &nbsp; ⋯ 侵入
        </div>
      </div>
      <button class="btn-sm btn-primary btn-block" style="margin-top:12px;" onclick="exportColumnChart()">📥 导出柱状图(PNG)</button>
    </div>
  `;
  openDrawer('地层柱状图', html);
}

function exportColumnChart() {
  const svg = document.querySelector('.drawer-content svg');
  if (!svg) { showToast('未找到图表'); return; }
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 720; canvas.height = 920;
  ctx.fillStyle = '#0a1628'; ctx.fillRect(0, 0, 720, 920);
  const data = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  img.onload = function() {
    ctx.drawImage(img, 0, 0, 720, 920);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(b) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'geotrail_column_chart.png';
      a.click();
    });
  };
  img.src = url;
  showToast('柱状图已导出');
}

// 罗盘功能
let compassHandler = null;

function startCompass() {
  const status = document.getElementById('compassStatus');
  const btn = document.getElementById('compassBtn');
  if (!status || !btn) return;
  
  // 检查是否支持设备方向API
  if (!window.DeviceOrientationEvent) {
    showToast('当前设备不支持罗盘功能');
    return;
  }
  
  // iOS 13+ 需要请求权限
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          enableCompass(status, btn);
        } else {
          showToast('需要获取设备方向权限');
        }
      })
      .catch(() => {
        showToast('权限请求失败，请手动输入');
      });
  } else {
    enableCompass(status, btn);
  }
}

function enableCompass(status, btn) {
  status.style.display = 'block';
  status.textContent = '正在读取罗盘数据... 请保持手机稳定';
  btn.textContent = '读取中...';
  btn.disabled = true;
  
  let readings = [];
  let count = 0;
  
  compassHandler = function(e) {
    count++;
    // alpha: 指南针方向 (0-360)
    // beta: 前后倾斜 (-180~180)
    // gamma: 左右倾斜 (-90~90)
    const alpha = e.alpha || 0;
    const beta = e.beta || 0;
    const gamma = e.gamma || 0;
    
    // 计算倾向（alpha 是磁北方向，岩层倾向 = alpha）
    // ★ 修正：岩层倾角 = 层面与水平面的二面角
    // 测量时手机背面贴层面，沿倾向方向放置
    // dip = 90° - (手机z轴与重力向量的夹角)
    // 注：磁方位需加速度计倾角补偿，公式：
    // Xh = x·cos(pitch) + y·sin(roll)·sin(pitch) - z·cos(roll)·sin(pitch)
    // Yh = y·cos(roll) + z·sin(roll)
    // heading = atan2(-Yh, Xh) + 磁偏角
    // 设备方向 API 仅提供 beta(前后倾)/gamma(左右倾)，此处取二者合成倾斜量并限幅 0~90° 作为倾角
    const dipAngle = Math.min(90, Math.round(Math.sqrt(beta * beta + gamma * gamma)));
    const dipDir = Math.round((360 - alpha) % 360);
    
    readings.push({ dipDir, dipAngle });
    
    if (count >= 10) {
      // 取平均值
      const avgDipDir = Math.round(readings.reduce((s, r) => s + r.dipDir, 0) / readings.length);
      const avgDipAngle = Math.round(readings.reduce((s, r) => s + r.dipAngle, 0) / readings.length);
      
      document.getElementById('f-trend').value = avgDipDir;
      document.getElementById('f-plunge').value = avgDipAngle;
      updateAttitude();
      
      status.textContent = `已获取：倾向 ${avgDipDir}° ∠ ${avgDipAngle}°`;
      status.style.color = 'var(--green)';
      btn.textContent = '📡 罗盘';
      btn.disabled = false;
      
      window.removeEventListener('deviceorientation', compassHandler);
      compassHandler = null;
      showToast(`罗盘读数：倾向 ${avgDipDir}° ∠ ${avgDipAngle}°`);
    } else {
      status.textContent = `采样中... ${count}/10`;
    }
  };
  
  window.addEventListener('deviceorientation', compassHandler);
  
  // 5秒后自动停止
  setTimeout(() => {
    if (compassHandler) {
      window.removeEventListener('deviceorientation', compassHandler);
      compassHandler = null;
      if (readings.length > 0) {
        const avgDipDir = Math.round(readings.reduce((s, r) => s + r.dipDir, 0) / readings.length);
        const avgDipAngle = Math.round(readings.reduce((s, r) => s + r.dipAngle, 0) / readings.length);
        document.getElementById('f-trend').value = avgDipDir;
        document.getElementById('f-plunge').value = avgDipAngle;
        updateAttitude();
        status.textContent = `已获取：倾向 ${avgDipDir}° ∠ ${avgDipAngle}°`;
        status.style.color = 'var(--green)';
      } else {
        status.textContent = '未获取到有效数据，请手动输入';
        status.style.color = 'var(--red)';
      }
      btn.textContent = '📡 罗盘';
      btn.disabled = false;
    }
  }, 6000);
}

// GPS坐标格式切换
function switchCoordFormat(format, pointId) {
  const p = GEO_POINTS.find(pt => pt.id === pointId);
  if (!p) return;
  
  const display = document.getElementById('coordDisplay');
  if (!display) return;
  
  // 原始坐标：E119°23'45" N35°22'18"
  const lonDeg = 119, lonMin = 23, lonSec = 45;
  const latDeg = 35, latMin = 22, latSec = 18;
  
  switch(format) {
    case 'dms':
      display.textContent = `E${lonDeg}°${lonMin}'${lonSec}" N${latDeg}°${latMin}'${latSec}"`;
      break;
    case 'dd':
      const lonDD = (lonDeg + lonMin/60 + lonSec/3600).toFixed(6);
      const latDD = (latDeg + latMin/60 + latSec/3600).toFixed(6);
      display.textContent = `${lonDD}°E, ${latDD}°N`;
      break;
    case 'utm':
      display.textContent = '50S 754321 3912345';
      break;
    case 'cgcs2000':
      display.textContent = 'CGCS2000: 3912345.67, 39754321.89';
      break;
  }
  
  showToast('已切换为' + (format==='dms'?'度分秒':format==='dd'?'十进制度':format==='utm'?'UTM':'CGCS2000') + '格式');
}

// 灾前/灾后对比滑块全局事件处理器（用于 removeEventListener）
let _sliderDragging = false;
function _sliderMouseMove(e) {
  if (!_sliderDragging) return;
  e.preventDefault();
  _updateSliderPos(e.clientX);
}
function _sliderTouchMove(e) {
  if (!_sliderDragging) return;
  e.preventDefault();
  _updateSliderPos(e.touches[0].clientX);
}
function _sliderMouseUp() { _sliderDragging = false; }
function _sliderTouchEnd() { _sliderDragging = false; }

function _updateSliderPos(clientX) {
  const container = document.getElementById('compareContainer');
  const afterClip = document.getElementById('compareAfter');
  const line = document.getElementById('compareLine');
  const handle = document.getElementById('compareHandle');
  if (!container || !afterClip) return;
  const rect = container.getBoundingClientRect();
  let x = (clientX - rect.left) / rect.width;
  x = Math.max(0, Math.min(1, x));
  const pct = (x * 100).toFixed(1);
  afterClip.style.clipPath = `inset(0 ${100 - x * 100}% 0 0)`;
  line.style.left = pct + '%';
  handle.style.left = pct + '%';
}

// 初始化灾前/灾后对比滑块
function initCompareSlider() {
  const handle = document.getElementById('compareHandle');
  if (!handle) return;

  // 先移除旧的 document 级监听器，防止重复绑定
  document.removeEventListener('mousemove', _sliderMouseMove);
  document.removeEventListener('touchmove', _sliderTouchMove, { passive: false });
  document.removeEventListener('mouseup', _sliderMouseUp);
  document.removeEventListener('touchend', _sliderTouchEnd);

  // 重新绑定 document 级监听器
  document.addEventListener('mousemove', _sliderMouseMove);
  document.addEventListener('touchmove', _sliderTouchMove, { passive: false });
  document.addEventListener('mouseup', _sliderMouseUp);
  document.addEventListener('touchend', _sliderTouchEnd);

  // handle 级监听器（每次重新绑定）
  handle.onmousedown = function (e) {
    _sliderDragging = true;
    e.preventDefault();
  };
  handle.ontouchstart = function (e) {
    _sliderDragging = true;
    e.preventDefault();
  };
}

function exportData(format) {
  const now = new Date();
  const ts = now.getFullYear() + 
    String(now.getMonth()+1).padStart(2,'0') + 
    String(now.getDate()).padStart(2,'0') + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0');
  let content, filename, mime;

  if (format === 'json') {
    content = JSON.stringify({
      version: 1,
      exportDate: now.toISOString(),
      geoPoints: GEO_POINTS,
      samplePoints: SAMPLE_POINTS,
      disasterPoints: DISASTER_POINTS,
      patrolPoints: PATROL_POINTS
    }, null, 2);
    filename = `geotrail_${ts}.json`;
    mime = 'application/json';
  } else if (format === 'csv') {
    const headers = ['编号','岩性','符号','地层时代','走向','倾向','倾角','接触关系','构造','风化程度','化石','坐标','高程','描述'];
    const rows = GEO_POINTS.map(p => [
      p.code, p.lithology, p.symbol, p.era,
      p.strike||'', p.trend||'', p.plunge||'',
      p.contact||'', p.structure||'', p.weathering||'', p.fossil||'',
      p.coord, p.elevation, (p.desc||'').replace(/,/g,'，')
    ]);
    content = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
    filename = `geotrail_${ts}.csv`;
    mime = 'text/csv;charset=utf-8';
  } else if (format === 'geojson') {
    const features = GEO_POINTS.map(p => {
      const coordParts = p.coord.match(/E(\d+)°(\d+)'(\d+)"\s*N(\d+)°(\d+)'(\d+)"/);
      let lng = 0, lat = 0;
      if (coordParts) {
        lng = parseFloat(coordParts[1]) + parseFloat(coordParts[2])/60 + parseFloat(coordParts[3])/3600;
        lat = parseFloat(coordParts[4]) + parseFloat(coordParts[5])/60 + parseFloat(coordParts[6])/3600;
      }
      return {
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [lng, lat] },
        properties: {
          id: p.id, code: p.code, lithology: p.lithology, symbol: p.symbol,
          era: p.era, strike: p.strike||0, dipDirection: p.trend||0, dip: p.plunge||0,
          contact: p.contact||'', structure: p.structure||'', weathering: p.weathering||'',
          fossil: p.fossil||'', elevation: p.elevation, description: p.desc||'', collected: p.collected
        }
      };
    });
    content = JSON.stringify({ type: 'FeatureCollection', features }, null, 2);
    filename = `geotrail_${ts}.geojson`;
    mime = 'application/geo+json';
  } else if (format === 'kml') {
    const placemarks = GEO_POINTS.map(p => {
      const coordParts = p.coord.match(/E(\d+)°(\d+)'(\d+)"\s*N(\d+)°(\d+)'(\d+)"/);
      let lng = 0, lat = 0;
      if (coordParts) {
        lng = parseFloat(coordParts[1]) + parseFloat(coordParts[2])/60 + parseFloat(coordParts[3])/3600;
        lat = parseFloat(coordParts[4]) + parseFloat(coordParts[5])/60 + parseFloat(coordParts[6])/3600;
      }
      return `      <Placemark>
        <name>${p.code} - ${p.lithology}</name>
        <description><![CDATA[时代: ${p.era}<br>产状: ${p.strike||0}°/${p.trend||0}°∠${p.plunge||0}°<br>接触: ${p.contact||''}<br>${p.desc||''}]]></description>
        <Point><coordinates>${lng},${lat},${p.elevation}</coordinates></Point>
        <ExtendedData>
          <Data name="strike"><value>${p.strike||0}</value></Data>
          <Data name="dipDirection"><value>${p.trend||0}</value></Data>
          <Data name="dip"><value>${p.plunge||0}</value></Data>
        </ExtendedData>
      </Placemark>`;
    }).join('\n');
    content = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>地质足迹 GeoTrail 导出</name>
${placemarks}
  </Document>
</kml>`;
    filename = `geotrail_${ts}.kml`;
    mime = 'application/vnd.google-earth.kml+xml';
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeDrawer();
  showToast(`已导出 ${filename}`);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.geoPoints && Array.isArray(data.geoPoints)) {
        GEO_POINTS.length = 0;
        GEO_POINTS.push(...data.geoPoints);
      }
      if (data.samplePoints) { SAMPLE_POINTS.length = 0; SAMPLE_POINTS.push(...data.samplePoints); }
      if (data.disasterPoints) { DISASTER_POINTS.length = 0; DISASTER_POINTS.push(...data.disasterPoints); }
      if (data.patrolPoints) { PATROL_POINTS.length = 0; PATROL_POINTS.push(...data.patrolPoints); }
      // 也支持GeoJSON格式
      if (data.type === 'FeatureCollection' && data.features) {
        data.features.forEach(f => {
          if (f.properties && f.properties.code) {
            const existing = GEO_POINTS.find(p => p.code === f.properties.code);
            if (existing) Object.assign(existing, f.properties);
          }
        });
      }
      saveState();
      if (State.currentNav) renderPage(State.currentNav);
      showToast('数据导入成功！');
    } catch(err) {
      showToast('导入失败：文件格式错误');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ====== 粒子动画 ======
(function() {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  const pts = [];
  for (let i = 0; i < 40; i++) {
    pts.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.5 + 0.5,
      dx: (Math.random() - 0.5) * 0.2,
      dy: (Math.random() - 0.5) * 0.2,
      a: Math.random() * 0.3 + 0.1
    });
  }
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    pts.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0) p.x = c.width;
      if (p.x > c.width) p.x = 0;
      if (p.y < 0) p.y = c.height;
      if (p.y > c.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,212,255,' + p.a + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', function() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
})();

function startOnboarding() {
  if (localStorage.getItem('geotrail_onboarded')) return;
  const overlay = document.getElementById('onboardingOverlay');
  if (!overlay) return;
  overlay.style.display = 'block';
  onboardingStep = 0;
  showOnboardingStep();
}

function showOnboardingStep() {
  const step = onboardingSteps[onboardingStep];
  document.getElementById('onboardingIcon').textContent = step.icon;
  document.getElementById('onboardingTitle').textContent = step.title;
  document.getElementById('onboardingDesc').textContent = step.desc;
  const dots = onboardingSteps.map((_, i) =>
    `<div style="width:6px;height:6px;border-radius:50%;background:${i===onboardingStep?'var(--accent)':'rgba(255,255,255,0.2)'};"></div>`
  ).join('');
  document.getElementById('onboardingDots').innerHTML = dots;
  const btn = document.querySelector('#onboardingCard .btn-primary');
  if (btn) btn.textContent = onboardingStep === onboardingSteps.length - 1 ? '开始使用' : '下一步';
}

function nextOnboarding() {
  onboardingStep++;
  if (onboardingStep >= onboardingSteps.length) {
    skipOnboarding();
  } else {
    showOnboardingStep();
  }
}

function skipOnboarding() {
  const overlay = document.getElementById('onboardingOverlay');
  if (overlay) overlay.style.display = 'none';
  localStorage.setItem('geotrail_onboarded', '1');
}

// 启动引导（延迟1秒等页面加载完）
