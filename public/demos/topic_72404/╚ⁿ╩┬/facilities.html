<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>周围设施</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #faf7f2;
    color: #3d3427;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .page-header {
    background: linear-gradient(180deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    padding: 32px 18px 26px;
    position: relative;
    box-shadow: 0 6px 20px rgba(89,70,46,0.22);
  }
  .page-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding-left: 12px;
    border-left: 4px solid #fef3d5;
  }
  .page-sub {
    font-size: 0.78rem;
    opacity: 0.82;
    margin-top: 8px;
    padding-left: 12px;
    letter-spacing: 0.02em;
  }

  .container { padding: 16px; max-width: 760px; margin: 0 auto; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    color: #fef3d5;
    text-decoration: none;
    opacity: 0.85;
    margin-bottom: 10px;
    padding: 4px 10px 4px 6px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); opacity: 1; }

  .address-bar {
    background: linear-gradient(135deg, #fff9ed 0%, #fff 100%);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 14px 0 0;
    box-shadow: 0 4px 16px rgba(89,70,46,0.12);
    border: 1px solid rgba(89,70,46,0.12);
  }
  .address-bar .label { font-size: 0.72rem; color: #8b6b3d; letter-spacing: 0.04em; }
  .address-bar .value { font-size: 0.95rem; font-weight: 600; color: #3d3427; margin-top: 4px; line-height: 1.5; }
  .address-bar .value.placeholder { color: #b5ada0; font-weight: 400; font-style: italic; }
  .address-bar .addr-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .reselect-btn {
    flex-shrink: 0;
    margin-top: 4px;
    padding: 5px 12px;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    border: none;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    white-space: nowrap;
    transition: box-shadow 0.2s;
  }
  .reselect-btn:hover { box-shadow: 0 4px 12px rgba(89,70,46,0.3); }
  .no-address-tip {
    background: #fff;
    border-radius: 14px;
    padding: 28px 20px;
    margin: 20px 16px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(89,70,46,0.08);
    border: 1px solid rgba(89,70,46,0.08);
  }
  .no-address-tip .icon { font-size: 2.6rem; margin-bottom: 10px; }
  .no-address-tip .title { font-size: 1rem; font-weight: 700; color: #3d3427; margin-bottom: 8px; }
  .no-address-tip .desc { font-size: 0.82rem; color: #8a8070; line-height: 1.7; margin-bottom: 16px; }
  .no-address-tip .action-btn {
    display: inline-block;
    padding: 9px 24px;
    background: linear-gradient(135deg, #8b6b3d 0%, #6b4f2a 100%);
    color: #fef3d5;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .bottom-nav .nav-current {
    display: inline-block;
    margin-left: 2px;
    font-size: 0.7rem;
    font-weight: 500;
    opacity: 0.9;
  }
  .data-source {
    text-align: right;
    font-size: 0.7rem;
    color: #a0978a;
    margin: 10px 4px 4px;
    opacity: 0.85;
    font-style: italic;
    letter-spacing: 0.02em;
  }
  .data-source strong { color: #8b6b3d; }

  .cat-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 16px 4px;
    max-width: 760px;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .cat-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    background: #fff;
    border: 1.5px solid rgba(89,70,46,0.18);
    border-radius: 999px;
    font-size: 0.82rem;
    color: #5a4a30;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-tab .ic { font-size: 0.95rem; }
  .cat-tab:hover { background: #fff9ed; border-color: #8b6b3d; }
  .cat-tab.active {
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    border-color: #6b4f2a;
    color: #fef3d5;
    box-shadow: 0 4px 12px rgba(89,70,46,0.35);
  }

  .facility-list { padding: 12px 16px 20px; max-width: 760px; margin: 0 auto; }
  .facility-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(89,70,46,0.08);
    border: 1px solid rgba(89,70,46,0.08);
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: transform 0.2s;
  }
  .facility-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(89,70,46,0.14); }

  .facility-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #fef3d5 0%, #ffe9c9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: #8b6b3d;
    border: 1px solid rgba(139,115,85,0.18);
  }
  .facility-content { flex: 1; min-width: 0; }
  .facility-name { font-size: 1rem; font-weight: 700; color: #3d3427; margin-bottom: 6px; }
  .facility-addr { font-size: 0.8rem; color: #8a8070; margin-bottom: 8px; line-height: 1.5; }
  .facility-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px dashed rgba(89,70,46,0.14);
  }
  .facility-distance {
    font-size: 0.85rem;
    color: #8b6b3d;
    font-weight: 600;
    background: #fef3d5;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .facility-status {
    font-size: 0.75rem;
    color: #6b8a6b;
    background: #e5f0e5;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .facility-status.closed { color: #8a6b6b; background: #f0e5e5; }
  .facility-extra {
    font-size: 0.72rem;
    color: #8b6b3d;
    margin-left: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #b5ada0;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.7; }
  .empty-state .title { font-size: 0.95rem; font-weight: 600; color: #8a8070; margin-bottom: 6px; }
  .empty-state .desc { font-size: 0.78rem; line-height: 1.7; }

  .retry-btn {
    margin-top: 16px;
    padding: 8px 22px;
    background: linear-gradient(135deg, #8b6b3d 0%, #6b4f2a 100%);
    color: #fef3d5;
    border: none;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .retry-btn:hover { box-shadow: 0 4px 12px rgba(89,70,46,0.3); }

  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.25) 100%);
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.5);
  }
  .bottom-nav::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: linear-gradient(90deg, transparent 0%, rgba(107,79,42,0.3) 50%, transparent 100%);
    border-radius: 2px;
    pointer-events: none;
  }
  .bottom-nav a {
    text-decoration: none;
    color: #5a4a30;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .bottom-nav a.active, .bottom-nav a:hover {
    color: #fef3d5;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    box-shadow: 0 4px 12px rgba(89,70,46,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  @media (max-width: 640px) {
    .bottom-nav { gap: 0; padding: 4px 6px; }
    .bottom-nav a { padding: 8px 14px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a href="experience.html" class="back-btn">‹ 返回首页</a>
  <div class="page-title">周围设施</div>
  <div class="page-sub">根据您选好的位置，推送附近真实设施</div>
</div>

<!-- 地址展示 -->
<div class="container" style="padding-top: 8px;">
  <div class="address-bar">
    <div class="label">搜索中心</div>
    <div class="addr-row">
      <div class="value placeholder" id="addrValue">尚未设置地址，请先在首页选择省、市、区、街道</div>
      <a href="experience.html" class="reselect-btn">重新选择地址</a>
    </div>
    <div class="data-source" id="dataSource" style="display:none;"></div>
  </div>
</div>

<!-- 未设置地址提示 -->
<div id="noAddressTip" style="display:none;">
  <div class="no-address-tip">
    <div class="icon">📍</div>
    <div class="title">尚未设置地址</div>
    <div class="desc">使用「周围设施」前，请先在首页选择省、市、区、街道，以便推送附近真实设施。</div>
    <a href="experience.html" class="action-btn">去选择地址 ›</a>
  </div>
</div>

<!-- 分类切换 -->
<div class="cat-tabs" id="catTabs"></div>

<!-- 设施列表 -->
<div class="facility-list" id="facilityList"></div>

<!-- 底部灵动岛菜单栏 -->
<nav class="bottom-nav">
  <a href="experience.html">首页</a>
  <a href="facilities.html" class="active">附近资源<span class="nav-current">·设施</span></a>
  <a href="merchant.html">商家中心</a>
  <a href="admin.html">管理后台</a>
  <a href="my.html">我的</a>
</nav>

<script src="store.js"></script>
<script src="api-client.js"></script>
<script src="facilities-data.js"></script>
<script>
  // ============ 分类数据 ============
  var CATEGORIES = [
    { key: 'subway', name: '地铁', icon: '🚇', keywords: ['地铁站', '地铁', 'subway station', 'station'] },
    { key: 'bus', name: '公交', icon: '🚌', keywords: ['公交车站', '公交站', 'bus stop', 'bus station'] },
    { key: 'hospital', name: '医院', icon: '🏥', keywords: ['医院', '诊所', 'hospital', 'clinic', 'medical'] },
    { key: 'pharmacy', name: '药店', icon: '💊', keywords: ['药店', '药房', 'pharmacy', 'drugstore'] },
    { key: 'supermarket', name: '超市', icon: '🛒', keywords: ['超市', 'supermarket', 'grocery'] },
    { key: 'convenience', name: '便利店', icon: '🏪', keywords: ['便利店', '商店', 'convenience store', 'mall'] },
    { key: 'school', name: '学校', icon: '🏫', keywords: ['学校', '小学', '中学', '大学', '幼儿园', 'school', 'university', 'college', 'kindergarten'] },
    { key: 'park', name: '公园', icon: '🌳', keywords: ['公园', '广场', 'park', 'garden', '广场'] }
  ];

  var SEARCH_RADIUS = 2000;
  var CACHE = {};

  // ============ 工具函数 ============
  function metersToText(m) {
    m = parseInt(m, 10) || 0;
    if (m < 1000) return m + 'm';
    return (m / 1000).toFixed(1).replace(/\.0$/, '') + 'km';
  }

  function getDistance(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var toRad = Math.PI / 180;
    var dLat = (lat2 - lat1) * toRad;
    var dLng = (lng2 - lng1) * toRad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Math.round(R * c);
  }

  function loadAddress() {
    try {
      var raw = localStorage.getItem('app_user_address_v2');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function renderAddress() {
    var addr = loadAddress();
    var el = document.getElementById('addrValue');
    if (!addr || !addr.province) {
      el.textContent = '尚未设置地址，请先在首页选择省、市、区、街道';
      el.classList.add('placeholder');
      return;
    }
    el.classList.remove('placeholder');
    var parts = [];
    if (addr.province) parts.push(addr.province);
    if (addr.city && addr.city !== addr.province) parts.push(addr.city);
    if (addr.district) parts.push(addr.district);
    if (addr.street) parts.push(addr.street);
    el.textContent = parts.join(' ') || '尚未设置';
  }

  function setNoAddressVisible(show) {
    var tip = document.getElementById('noAddressTip');
    var tabs = document.getElementById('catTabs');
    var list = document.getElementById('facilityList');
    if (tip) tip.style.display = show ? 'block' : 'none';
    if (tabs) tabs.style.display = show ? 'none' : 'flex';
    if (list) list.style.display = show ? 'none' : 'block';
  }

  // ============ 分类渲染 ============
  var currentCat = 'subway';
  function renderTabs() {
    var box = document.getElementById('catTabs');
    var html = '';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      var cls = c.key === currentCat ? 'cat-tab active' : 'cat-tab';
      html += '<button class="' + cls + '" data-key="' + c.key + '" onclick="selectCat(\'' + c.key + '\')">' +
        '<span class="ic">' + c.icon + '</span>' + c.name + '</button>';
    }
    box.innerHTML = html;
  }
  function selectCat(key) {
    currentCat = key;
    renderTabs();
    renderList();
  }

  function getCatByKey(key) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].key === key) return CATEGORIES[i];
    }
    return null;
  }

  // ============ 配置：高德地图 Web 服务 key（可选，提升中国区域 POI 数据质量）============
  // 申请地址：https://console.amap.com/dev/key/app （个人免费）
  // 填入 KEY 后优先使用高德地图，留空则跳过
  var AMAP_KEY = ''; // 例如：'YOUR_AMAP_KEY_HERE'

  // ============ 查询函数：从静态数据中匹配真实设施 ============
  function queryFacilities(addr, categoryKey) {
    if (!addr) return [];
    var province = addr.province || '';
    var city = addr.city || '';
    var district = addr.district || '';
    var street = addr.street || '';

    // 使用 facilities-data.js 中的查询函数
    if (typeof findRealFacilities === 'function') {
      var results = findRealFacilities(province, city, district, street, categoryKey);
      if (results && results.length > 0) return results;
    }

    // 如果静态数据中没有，返回空数组
    return [];
  }

  // ============ 渲染函数 ============
  function renderFacilityCards(items, cat) {
    var box = document.getElementById('facilityList');
    if (!items || items.length === 0) return false;
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html +=
        '<div class="facility-card">' +
          '<div class="facility-icon">' + (cat.icon || '📍') + '</div>' +
          '<div class="facility-content">' +
            '<div class="facility-name">' + it.name + '</div>' +
            '<div class="facility-addr">' + (it.address || '') + '</div>' +
            '<div class="facility-footer">' +
              '<span class="facility-distance">' + (it.distance ? '步行约 ' + metersToText(it.distance) : '') + '</span>' +
              '<span class="facility-status">营业中</span>' +
              (it.extra ? '<span class="facility-extra">' + it.extra + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
    }
    box.innerHTML = html;
    return true;
  }

  function setDataSource(name) {
    var el = document.getElementById('dataSource');
    if (!el) return;
    if (!name) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = '数据来源：<strong>' + name + '</strong>';
  }

  // ============ 主渲染函数：直接从静态数据查询 ============
  function renderList() {
    var box = document.getElementById('facilityList');
    var cat = getCatByKey(currentCat);

    var addr = loadAddress();
    if (!addr || !addr.province) {
      setNoAddressVisible(true);
      setDataSource(null);
      return;
    }
    setNoAddressVisible(false);

    // 从静态数据查询
    var items = queryFacilities(addr, currentCat);

    if (items.length > 0) {
      setDataSource('真实数据');
      renderFacilityCards(items, cat);
    } else {
      box.innerHTML = '<div class="empty-state">' +
        '<div class="icon">🔍</div>' +
        '<div class="title">暂无数据</div>' +
        '<div class="desc">' +
          '当前区域「' + (addr.district || '') + (addr.street ? ' · ' + addr.street : '') + '」暂无「' + cat.name + '」数据。<br>' +
          '数据持续更新中，敬请期待。' +
        '</div>' +
      '</div>';
      setDataSource('暂无数据');
    }
  }

  // ============ 启动 ============
  renderAddress();
  renderTabs();
  renderList();
</script>

</body>
</html>
