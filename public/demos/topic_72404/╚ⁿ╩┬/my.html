<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>我的</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f4f1ea;
    color: #3a342c;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .page-header {
    background: linear-gradient(135deg, #8b6b3d 0%, #6b4f2a 100%);
    color: #fff;
    padding: 44px 20px 60px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 20px rgba(107, 79, 42, 0.25);
  }
  .page-header h1 { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  .page-header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 6px; }

  .content-wrap {
    max-width: 520px;
    margin: -40px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }

  /* ---- 卡片基础 ---- */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(107, 79, 42, 0.08);
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    color: #3a342c;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title .hint { font-size: 12px; color: #a0978a; font-weight: 400; }

  /* ---- 表单 ---- */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #6b5e4e;
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1.5px solid #e5ddd0;
    border-radius: 12px;
    font-size: 15px;
    color: #3a342c;
    background: #faf7f2;
    outline: none;
    transition: all 0.2s;
  }
  .form-input:focus {
    border-color: #8b6b3d;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(139, 107, 61, 0.1);
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row .form-input { flex: 1; }

  /* ---- 按钮 ---- */
  .btn {
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #8b6b3d 0%, #6b4f2a 100%);
    color: #fff;
    padding: 14px;
    width: 100%;
    box-shadow: 0 4px 12px rgba(107, 79, 42, 0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(107, 79, 42, 0.3); }
  .btn-primary:disabled { background: #c9bfae; box-shadow: none; cursor: not-allowed; transform: none; opacity: 0.7; }

  .btn-secondary {
    background: #e5ddd0;
    color: #6b4f2a;
    padding: 12px 20px;
    white-space: nowrap;
  }
  .btn-secondary:hover { background: #d9cfbf; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-danger {
    background: #fff;
    border: 1.5px solid #c47a6b;
    color: #a8452e;
    padding: 12px;
    width: 100%;
  }
  .btn-danger:hover { background: #fbe9e5; }

  /* ---- 状态徽标 ---- */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-user { background: #e8e1d4; color: #6b5e4e; }
  .badge-admin { background: #fce4d6; color: #8b4a2a; }
  .badge-property { background: #dce9d8; color: #4a6b45; }
  .badge-restaurant { background: #e8d5d0; color: #8b4a3a; }
  .badge-pending { background: #fceac8; color: #8b6b2a; }
  .badge-approved { background: #dce9d8; color: #4a6b45; }
  .badge-rejected { background: #f5dcd5; color: #8b3d2a; }

  /* ---- 用户头像 ---- */
  .user-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15), inset 0 -4px 12px rgba(0,0,0,0.15), inset 0 2px 6px rgba(255,255,255,0.2);
    position: relative;
  }
  .user-phone {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #3a342c;
    margin-bottom: 6px;
  }
  .user-meta {
    text-align: center;
    font-size: 13px;
    color: #8a7f6f;
    margin-bottom: 18px;
  }

  /* ---- 菜单项 ---- */
  .menu-item {
    display: flex;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f0eadf;
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 8px;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: #faf7f2; padding-left: 6px; padding-right: 6px; }
  .menu-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #f4efdf;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .menu-text { flex: 1; font-size: 15px; color: #3a342c; }
  .menu-sub { font-size: 12px; color: #a0978a; margin-top: 3px; }
  .menu-arrow { color: #c9bfae; font-size: 18px; }

  /* ---- 通知 ---- */
  .notice {
    background: #fdf3e0;
    border: 1px solid #e8c98a;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    color: #7a5c2a;
    line-height: 1.6;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .notice.success { background: #e8f0e0; border-color: #b8ce9b; color: #4a6b45; }
  .notice.error { background: #f5dcd5; border-color: #d9a89d; color: #8b3d2a; }
  .notice-icon { font-size: 18px; flex-shrink: 0; }
  .notice-content { flex: 1; }

  /* ---- 底部导航（毛玻璃灵动岛） ---- */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.25) 100%);
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.1),
      0 2px 8px rgba(0,0,0,0.05),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.5);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .bottom-nav::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(58,56,51,0.3) 50%,
      transparent 100%
    );
    border-radius: 2px;
    pointer-events: none;
  }

  .bottom-nav:hover {
    box-shadow:
      0 12px 40px rgba(0,0,0,0.15),
      0 4px 12px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.8),
      inset 0 -1px 0 rgba(0,0,0,0.04);
  }

  .bottom-nav a {
    text-decoration: none;
    color: #555;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
    position: relative;
  }

  .bottom-nav a.active,
  .bottom-nav a:hover {
    color: #fff;
    background: linear-gradient(135deg, #5c5247 0%, #8b7355 100%);
    box-shadow:
      0 4px 12px rgba(139,115,85,0.35),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* ---- 弹窗 ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 24, 18, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    background: #fff;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: #3a342c;
    margin-bottom: 6px;
  }
  .modal-sub {
    font-size: 13px;
    color: #8a7f6f;
    margin-bottom: 18px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions .btn { flex: 1; padding: 13px; }

  /* 人机验证 */
  .captcha {
    background: #faf7f2;
    border: 1.5px solid #e5ddd0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 4px;
  }
  .captcha-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .captcha-label {
    font-size: 14px;
    color: #6b5e4e;
    font-weight: 500;
  }
  .captcha-puzzle {
    background: linear-gradient(135deg, #6b4f2a, #8b6b3d);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    user-select: none;
    font-family: Georgia, serif;
    text-decoration: line-through;
    text-decoration-color: rgba(255, 255, 255, 0.4);
    text-decoration-thickness: 2px;
  }
  .captcha-question {
    background: linear-gradient(135deg, #6b4f2a, #8b6b3d);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
  }
  .captcha-hint {
    font-size: 11px;
    color: #a0978a;
    display: block;
    margin-top: 4px;
  }

  /* 文件上传 */
  .upload-area {
    border: 2px dashed #d9cfbf;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    background: #faf7f2;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 14px;
  }
  .upload-area:hover { border-color: #8b6b3d; background: #fff; }
  .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: #6b5e4e; }
  .upload-hint { font-size: 12px; color: #a0978a; margin-top: 4px; }

  .file-preview-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  .file-preview {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 8px;
    overflow: hidden;
    background: #faf7f2;
    border: 1px solid #e5ddd0;
  }
  .file-preview img { width: 100%; height: 100%; object-fit: cover; }
  .file-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(139, 61, 42, 0.9);
    color: #fff;
    border: none;
    font-size: 12px;
    cursor: pointer;
    line-height: 20px;
  }

  textarea.form-input {
    height: auto;
    padding: 12px 16px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    line-height: 1.6;
  }

  /* 管理员入口链接 */
  .admin-entry {
    background: linear-gradient(135deg, #8b3d2a 0%, #6b2a1c 100%);
    color: #fff;
    border-radius: 14px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(139, 61, 42, 0.25);
    transition: transform 0.2s;
  }
  .admin-entry:hover { transform: translateY(-1px); }
  .admin-entry-icon {
    font-size: 28px;
    background: rgba(255, 255, 255, 0.2);
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .admin-entry-text { flex: 1; }
  .admin-entry-title { font-size: 15px; font-weight: 600; }
  .admin-entry-desc { font-size: 12px; opacity: 0.88; margin-top: 2px; }
  .admin-entry-arrow { font-size: 22px; opacity: 0.9; }

  .divider {
    height: 1px;
    background: #f0eadf;
    margin: 14px 0;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 14px;
  }
  .info-row .label { color: #8a7f6f; }
  .info-row .value { color: #3a342c; font-weight: 500; }

  @media (max-width: 500px) {
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1 id="pageTitle">我的</h1>
</div>

<div class="content-wrap">

  <!-- ======== 登录状态时显示 ======== -->
  <div id="viewLoggedIn" style="display:none;">
    <!-- 卡片1：用户信息 -->
    <div class="card">
      <div class="user-avatar" id="userAvatar"></div>
      <div class="user-phone" id="userPhone">—</div>
      <div class="user-meta">
        <span id="userBadge"></span>
      </div>
    </div>

    <!-- 物业认证入口（仅 property 账号显示） -->
    <div id="propertyCertArea" style="display:none;"></div>
    <!-- 餐饮商家认证入口（仅 restaurant 账号显示） -->
    <div id="restaurantCertArea" style="display:none;"></div>

    <!-- 管理员入口（仅 admin 显示） -->
    <div id="adminEntryArea" style="display:none;">
      <div class="admin-entry" onclick="location.href='admin.html'">
        <div class="admin-entry-icon">⚙</div>
        <div class="admin-entry-text">
          <div class="admin-entry-title">管理后台</div>
          <div class="admin-entry-desc">用户管理 · 物业审核 · 公告管理</div>
        </div>
        <div class="admin-entry-arrow">›</div>
      </div>
    </div>

    <!-- 卡片2：账户操作 -->
    <div class="card">
      <div class="card-title">账户设置 <span class="hint">Account</span></div>
      <div class="menu-item" id="menuChangePhone">
        <div class="menu-icon">📱</div>
        <div class="menu-text">
          更换手机号
          <div class="menu-sub">用户名即手机号</div>
        </div>
        <div class="menu-arrow">›</div>
      </div>
      <div class="menu-item" id="menuLogout">
        <div class="menu-icon" style="background:#f5dcd5;">↪</div>
        <div class="menu-text">退出登录</div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <!-- 卡片3：账号信息 -->
    <div class="card" id="accountInfoCard">
      <div class="card-title">账号信息</div>
      <div class="info-row"><span class="label">账号类型</span><span class="value" id="infoRole">—</span></div>
      <div class="info-row"><span class="label">注册时间</span><span class="value" id="infoCreatedAt">—</span></div>
      <div class="info-row"><span class="label">最近登录</span><span class="value" id="infoLoginAt">—</span></div>
    </div>
  </div>

  <!-- ======== 未登录 —— 登录表单 ======== -->
  <div id="viewLogin" style="display:none;">

    <!-- 手机号登录 -->
    <div class="card">
      <div class="card-title">手机号登录</div>

      <div id="loginNotice"></div>

      <div class="form-group">
        <label>手机号</label>
        <input type="tel" class="form-input" id="phoneInput" maxlength="11" placeholder="请输入 11 位手机号" />
      </div>

      <div class="form-group">
        <label>验证码</label>
        <div class="input-row">
          <input type="tel" class="form-input" id="codeInput" maxlength="6" placeholder="请输入6位验证码（当前为测试阶段咱不使用验证码，随机输入6个数字）" />
          <button class="btn btn-secondary" id="getCodeBtn">获取验证码</button>
        </div>
      </div>

      <!-- 人机验证（获取验证码时弹出） -->
      <div class="captcha" id="captchaArea" style="display:none;">
        <div class="captcha-row">
          <span class="captcha-label">请计算：</span>
          <span class="captcha-question" id="captchaQuestion">—</span>
        </div>
        <input type="tel" class="form-input" id="captchaInput" placeholder="输入计算结果" maxlength="4" />
        <span class="captcha-hint">通过人机验证后才能获取验证码</span>
      </div>

      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>
  </div>

</div>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <a href="experience.html">首页</a>
  <a href="nearby.html">附近资源</a>
  <a href="merchant.html">商家中心</a>
  <a href="admin.html">管理后台</a>
  <a href="my.html" class="active">我的</a>
</nav>

<!-- 弹窗：绑定社区 -->
<div class="modal-overlay" id="modalBindCommunity">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-title" id="bindCommunityTitle">绑定社区</div>
    <div class="modal-sub" id="bindCommunitySub">请输入社区邀请码，绑定后即可查看本小区公告</div>

    <div id="bindCommunityNotice"></div>

    <div class="form-group">
      <label>邀请码</label>
      <input type="text" class="form-input" id="bindInviteCode" placeholder="请输入社区邀请码" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="bindCommunityCancel" onclick="closeModal('modalBindCommunity')">取消</button>
      <button class="btn btn-primary" id="bindCommunityConfirm">确认绑定</button>
    </div>
  </div>
</div>

<!-- 弹窗：更改手机号 -->
<div class="modal-overlay" id="modalChangePhone">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-title">更换手机号</div>
    <div class="modal-sub">用户名即手机号，更换后下次登录请使用新手机号</div>

    <div id="changePhoneNotice"></div>

    <div class="form-group">
      <label>当前手机号</label>
      <input type="text" class="form-input" id="oldPhoneInput" readonly style="background:#f4f1ea; color:#8a7f6f;" />
    </div>

    <div class="form-group">
      <label>新手机号</label>
      <input type="tel" class="form-input" id="newPhoneInput" maxlength="11" placeholder="请输入新的 11 位手机号" />
    </div>

    <div class="form-group">
      <label>新手机号验证码</label>
      <div class="input-row">
        <input type="tel" class="form-input" id="newPhoneCode" maxlength="6" placeholder="6 位验证码" />
        <button class="btn btn-secondary" id="newPhoneGetCode">获取验证码</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modalChangePhone')">取消</button>
      <button class="btn btn-primary" id="changePhoneConfirm">确认更换</button>
    </div>
  </div>
</div>

<!-- 弹窗：物业认证 -->
<div class="modal-overlay" id="modalCertification">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-title">物业企业认证</div>
    <div class="modal-sub">请填写企业信息并上传相关证明材料，提交后由超级管理员审核</div>

    <div id="certNotice"></div>

    <div class="form-group">
      <label>物业企业名称 / 小区名称</label>
      <input type="text" class="form-input" id="certCompany" placeholder="如：XX物业服务有限公司" />
    </div>

    <div class="form-group">
      <label>社区邀请码</label>
      <input type="text" class="form-input" id="certInviteCode" placeholder="请设置本小区的邀请码（不可与其他物业重复）" />
      <span style="font-size:12px;color:#a0978a;">该邀请码将用于业主绑定本小区，审核通过后不可修改</span>
    </div>

    <div class="form-group">
      <label>联系人</label>
      <input type="text" class="form-input" id="certContact" placeholder="联系人姓名" />
    </div>

    <div class="form-group">
      <label>证明材料（营业执照、资质证书等）</label>
      <label class="upload-area" for="certFileInput">
        <div class="upload-icon">📎</div>
        <div class="upload-text">点击上传图片或 PDF 文件</div>
        <div class="upload-hint">支持多张，单张建议小于 2MB</div>
      </label>
      <input type="file" id="certFileInput" accept="image/*,.pdf" multiple style="display:none;" />
      <div class="file-preview-list" id="certFilePreview"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="certCancelBtn" onclick="closeModal('modalCertification')">取消</button>
      <button class="btn btn-primary" id="certSubmitBtn">提交审核</button>
    </div>
  </div>
</div>

    <div id="restCertNotice"></div>

    <div class="form-group">

      <label>后厨照片</label>
      <label class="upload-area" for="restKitchenInput">
        <div class="upload-icon">🍳</div>
        <div class="upload-text">点击上传后厨照片</div>
        <div class="upload-hint">建议上传 1-3 张后厨环境照片</div>
      </label>
      <input type="file" id="restKitchenInput" accept="image/*" multiple style="display:none;" />
      <div class="file-preview-list" id="restKitchenPreview"></div>
    </div>

    <div class="form-group">
      <label>店铺门脸照片</label>
      <label class="upload-area" for="restShopInput">
        <div class="upload-icon">🏪</div>
        <div class="upload-text">点击上传店铺门脸照片</div>
        <div class="upload-hint">建议上传 1-3 张店铺外观照片</div>
      </label>
      <input type="file" id="restShopInput" accept="image/*" multiple style="display:none;" />
      <div class="file-preview-list" id="restShopPreview"></div>

    <div class="form-group">
      <label>营业执照照片</label>
      <label class="upload-area" for="restLicenseInput">

        <div class="upload-text">点击上传营业执照照片</div>
        <div class="upload-hint">营业执照需清晰可辨，建议 1-2 张</div>
      </label>
      <input type="file" id="restLicenseInput" accept="image/*" style="display:none;" />
      <div class="file-preview-list" id="restLicensePreview"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="restCertCancelBtn" onclick="closeModal('modalRestaurantCert')">取消</button>
      <button class="btn btn-primary" id="restCertSubmitBtn">提交审核</button>

<script src="store.js"></script>
<script src="api-client.js"></script>
<script>
  // ============================================================
  //  初始化
  // ============================================================
  ensureSeedData();

  function ensureSeedData() {
    // store.js 已自动创建 admin 用户
  }

  function isValidPhone(phone) {
    return /^1[3-9]\d{9}$/.test(String(phone).trim());
  }

  // ============================================================
  //  渲染：登录态检测
  // ============================================================
  render();

  async function render() {
    var user = await ApiClient.currentUser();
    if (!user) {
      showLoginView();
    } else {
      await showLoggedInView(user);
    }
  }

  function showLoginView() {
    document.getElementById('viewLogin').style.display = 'block';
    document.getElementById('viewLoggedIn').style.display = 'none';
    document.getElementById('pageTitle').textContent = '登录';
  }

  async function showLoggedInView(user) {
    document.getElementById('viewLogin').style.display = 'none';
    document.getElementById('viewLoggedIn').style.display = 'block';
    document.getElementById('pageTitle').textContent = '个人中心';

    // 头像：根据手机号生成稳定的随机渐变（同手机号颜色不变）
    var avatarEl = document.getElementById('userAvatar');
    var gradients = [
      'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
      'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
      'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
      'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
      'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
      'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
      'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)',
      'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
      'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
      'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
      'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
      'linear-gradient(135deg, #5ee7df 0%, #b490ca 100%)'
    ];
    var idx = 0;
    for (var g = 0; g < user.phone.length; g++) {
      idx = (idx * 31 + user.phone.charCodeAt(g)) % gradients.length;
    }
    avatarEl.style.background = gradients[idx];
    avatarEl.textContent = '';

    document.getElementById('userPhone').textContent = maskPhone(user.phone);

    // 角色徽标
    var badge = '';
    if (user.role === 'admin') badge = '<span class="badge badge-admin">超级管理员</span>';
    else if (user.role === 'property') badge = '<span class="badge badge-property">物业账号</span>';
    else if (user.role === 'restaurant') badge = '<span class="badge badge-restaurant">餐饮商家</span>';
    else badge = '<span class="badge badge-user">普通用户</span>';
    document.getElementById('userBadge').innerHTML = badge;

    // 状态（仅物业和餐饮商家账号显示认证状态）
    if (user.role === 'property' || user.role === 'restaurant') {
      var cert = user.certification || {};
      var certBadge = '';
      if (cert.status === 'pending') certBadge = '<span class="badge badge-pending">认证审核中</span>';
      else if (cert.status === 'approved') certBadge = '<span class="badge badge-approved">已通过企业认证</span>';
      else if (cert.status === 'rejected') certBadge = '<span class="badge badge-rejected">认证未通过</span>';
      else certBadge = '<span class="badge badge-pending">未提交认证</span>';
      document.getElementById('userBadge').innerHTML = certBadge + ' ' + document.getElementById('userBadge').innerHTML;
    }

    // 账号信息
    var roleText = { 'admin': '超级管理员', 'property': '物业账号', 'restaurant': '餐饮商家', 'user': '普通用户' };
    document.getElementById('infoRole').textContent = roleText[user.role] || user.role;
    // 管理员用户：提示去管理后台
    if (user.role === 'admin') {
      document.getElementById('viewLogin').style.display = 'none';
      document.getElementById('viewLoggedIn').style.display = 'block';
      document.getElementById('pageTitle').textContent = '个人中心';
      document.getElementById('userPhone').textContent = maskPhone(user.phone);
      document.getElementById('userBadge').innerHTML = '<span class="badge badge-admin">超级管理员</span>';
      document.getElementById('infoRole').textContent = '超级管理员';
      document.getElementById('infoCreatedAt').textContent = fmtTime(user.createdAt);
      var session = await ApiClient.getSession();
      document.getElementById('infoLoginAt').textContent = session && session.loginAt ? fmtTime(session.loginAt) : '—';
      // 头像仍用渐变色
      document.getElementById('userAvatar').textContent = '';
      var logView = document.getElementById('viewLoggedIn');
      // 移除可能已存在的提示卡
      var existing = document.getElementById('adminHintCard');
      if (existing) existing.remove();
      var hintCard = document.createElement('div');
      hintCard.id = 'adminHintCard';
      hintCard.className = 'card';
      hintCard.style.marginTop = '14px';
      hintCard.innerHTML =
        '<div class="notice" style="margin-bottom:0;">' +
          '<span class="notice-icon">ℹ</span>' +
          '<div class="notice-content">' +
            '<b>您是超级管理员</b><br>' +
            '请在管理后台进行账号管理、物业认证审核和公告发布等操作。' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-primary" style="margin-top:14px;" onclick="location.href=\'admin.html\'">进入管理后台</button>' +
        '<button class="btn btn-danger" style="margin-top:10px;" onclick="if(confirm(\'确定退出登录吗？\')){ApiClient.logout().then(function(){location.href=\'experience.html\';});}">退出登录</button>';
      logView.appendChild(hintCard);
      document.getElementById('propertyCertArea').style.display = 'none';
      document.getElementById('restaurantCertArea').style.display = 'none';
      document.getElementById('adminEntryArea').style.display = 'none';
      return;
    }

    document.getElementById('infoCreatedAt').textContent = fmtTime(user.createdAt);
    var session = await ApiClient.getSession();
    document.getElementById('infoLoginAt').textContent = session && session.loginAt ? fmtTime(session.loginAt) : '—';

    // 显示/修改社区绑定
    await renderCommunityArea(user);

    // 认证区
    renderCertArea(user);

    // 强制弹窗：普通用户未绑定社区 / 物业餐饮未认证
    setTimeout(function () { checkForcedModal(user); }, 100);
  }

  async function renderCommunityArea(user) {
    var existing = document.getElementById('communityInfoCard');
    if (existing) existing.remove();

    var container = document.getElementById('viewLoggedIn');
    var card = document.createElement('div');
    card.id = 'communityInfoCard';
    card.className = 'card';

    var community = null;
    if (user.communityId) {
      community = await ApiClient.findCommunityById(user.communityId);
    }

    var title = '我的社区';
    var html = '<div class="card-title">' + title + '</div>';

    if (community) {
      html +=
        '<div class="info-row"><span class="label">社区名称</span><span class="value">' + escapeHtml(community.name) + '</span></div>' +
        '<div class="info-row"><span class="label">邀请码</span><span class="value">' + escapeHtml(community.inviteCode) + '</span></div>';
    } else {
      html +=
        '<div class="notice" style="margin-bottom:0;">' +
          '<span class="notice-icon">ℹ</span>' +
          '<div class="notice-content">尚未绑定社区，绑定后可查看本小区公告</div>' +
        '</div>';
    }

    // 普通用户可以修改邀请码；物业账号认证后不可修改
    var canModify = (user.role === 'user') || (user.role === 'restaurant');
    if (user.role === 'property' && user.status === 'active' && user.communityId) {
      canModify = false;
    }

    if (canModify) {
      html += '<button class="btn btn-secondary" style="width:100%; margin-top:14px;" onclick="openBindCommunityModal()">' +
        (community ? '修改邀请码' : '绑定社区') + '</button>';
    } else if (user.role === 'property') {
      html += '<div style="font-size:12px;color:#a0978a;margin-top:10px;">物业账号邀请码已固定，不可修改</div>';
    }

    card.innerHTML = html;
    // 插入到账号信息卡片之前
    var infoCard = document.getElementById('accountInfoCard');
    if (infoCard) {
      container.insertBefore(card, infoCard);
    } else {
      container.appendChild(card);
    }
  }

  function checkForcedModal(user) {
    // 普通用户未绑定社区
    if (user.role === 'user' && !user.communityId) {
      openBindCommunityModal(true);
      return;
    }
    // 物业/餐饮未认证或认证未通过
    if (user.role === 'property' || user.role === 'restaurant') {
      var cert = user.certification || {};
      if (cert.status !== 'approved') {
        if (user.role === 'property') openCertModal(true);
        else openRestCertModal(true);
      }
    }
  }

  async function openBindCommunityModal(forced) {
    var user = await ApiClient.currentUser();
    if (!user) return;
    var community = user.communityId ? await ApiClient.findCommunityById(user.communityId) : null;
    document.getElementById('bindCommunityTitle').textContent = community ? '修改邀请码' : '绑定社区';
    document.getElementById('bindCommunitySub').textContent = community
      ? '当前社区：' + community.name + '，输入新邀请码可切换社区'
      : '请输入社区邀请码，绑定后即可查看本小区公告';
    document.getElementById('bindInviteCode').value = community ? community.inviteCode : '';
    clearNotice('bindCommunityNotice');

    var overlay = document.getElementById('modalBindCommunity');
    overlay.dataset.forced = forced ? '1' : '';
    var cancelBtn = document.getElementById('bindCommunityCancel');
    if (forced) {
      cancelBtn.style.display = 'none';
    } else {
      cancelBtn.style.display = 'inline-block';
    }
    openModal('modalBindCommunity');
  }

  document.getElementById('bindCommunityConfirm').addEventListener('click', async function () {
    var user = await ApiClient.currentUser();
    if (!user) return;
    var code = document.getElementById('bindInviteCode').value.trim();
    if (!code) {
      showNotice('bindCommunityNotice', 'error', '请输入邀请码');
      return;
    }
    var result = await ApiClient.bindCommunity(code);
    if (!result.ok) {
      showNotice('bindCommunityNotice', 'error', result.reason);
      return;
    }
    showNotice('bindCommunityNotice', 'success', '社区绑定成功：' + result.data.community.name);
    setTimeout(async function () {
      closeModal('modalBindCommunity');
      await render();
    }, 700);
  });

  function maskPhone(phone) {
    if (phone === 'admin') return 'admin';
    if (!phone || phone.length < 11) return phone;
    return phone.slice(0, 3) + '****' + phone.slice(7);
  }

  // ============================================================
  //  认证区渲染（物业 & 餐饮商家共用）
  // ============================================================
  function renderCertArea(user) {
    var propArea = document.getElementById('propertyCertArea');
    var restArea = document.getElementById('restaurantCertArea');
    propArea.style.display = 'none';
    restArea.style.display = 'none';

    if (user.role === 'property') {
      renderPropertyCertArea(user, propArea);
    } else if (user.role === 'restaurant') {
      renderRestaurantCertArea(user, restArea);
    }
  }

  // ---- 物业认证区 ----
  function renderPropertyCertArea(user, area) {
    var cert = user.certification || {};
    var status = cert.status || 'pending';

    if (status === 'pending' && !cert.submittedAt) {
      // 未提交过 —— 引导提交
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice">' +
          '<span class="notice-icon">ℹ</span>' +
          '<div class="notice-content">' +
            '<b style="color:#8b3d2a;">物业账号认证</b><br>' +
            '请上传物业企业证明材料（营业执照、资质证书等），由管理员审核通过后即可发布社区公告。' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">物业认证 <span class="hint">尚未提交</span></div>' +
          '<button class="btn btn-primary" onclick="openCertModal()">提交企业认证</button>' +
        '</div>';
    } else if (status === 'pending') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice">' +
          '<span class="notice-icon">⏳</span>' +
          '<div class="notice-content">' +
            '<b>认证材料已提交，等待管理员审核</b><br>' +
            '提交时间：' + fmtTime(cert.submittedAt) + '<br>' +
            '审核通过后即可发布社区公告。' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">认证状态 <span class="hint">审核中</span></div>' +
          '<div class="info-row"><span class="label">企业名称</span><span class="value">' + escapeHtml(cert.companyName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">联系人</span><span class="value">' + escapeHtml(cert.contactName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">提交时间</span><span class="value">' + fmtTime(cert.submittedAt) + '</span></div>' +
          '<button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="openCertModal()">重新提交</button>' +
        '</div>';
    } else if (status === 'approved') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice success">' +
          '<span class="notice-icon">✓</span>' +
          '<div class="notice-content">' +
            '<b>物业企业认证已通过</b><br>' +
            '您现在可以发布社区公告。<br>' +
            '审核时间：' + fmtTime(cert.reviewedAt) +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">企业信息 <span class="hint">已认证</span></div>' +
          '<div class="info-row"><span class="label">企业名称</span><span class="value">' + escapeHtml(cert.companyName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">联系人</span><span class="value">' + escapeHtml(cert.contactName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">审核通过</span><span class="value">' + fmtTime(cert.reviewedAt) + '</span></div>' +
          '<button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="location.href=\'admin.html\'">前往管理后台 · 发布公告</button>' +
        '</div>';
    } else if (status === 'rejected') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice error">' +
          '<span class="notice-icon">✕</span>' +
          '<div class="notice-content">' +
            '<b>认证未通过</b><br>' +
            '审核意见：' + (cert.reviewNote || '未填写') + '<br>' +
            '审核时间：' + fmtTime(cert.reviewedAt) +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">重新认证 <span class="hint">Retrial</span></div>' +
          '<button class="btn btn-primary" onclick="openCertModal()">重新提交企业认证</button>' +
        '</div>';
    }
  }

  // ---- 餐饮商家认证区 ----
  function renderRestaurantCertArea(user, area) {
    var cert = user.certification || {};
    var restData = cert.restaurantData || {};
    var status = cert.status || 'pending';

    if (status === 'pending' && !cert.submittedAt) {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice">' +
          '<span class="notice-icon">ℹ</span>' +
          '<div class="notice-content">' +
            '<b style="color:#8b4a3a;">餐饮商家认证</b><br>' +
            '请上传后厨照片、店铺门脸照片和营业执照，由管理员审核通过后即可发布相关信息。' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">商家认证 <span class="hint">尚未提交</span></div>' +
          '<button class="btn btn-primary" onclick="openRestCertModal()">提交商家认证</button>' +
        '</div>';
    } else if (status === 'pending') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice">' +
          '<span class="notice-icon">⏳</span>' +
          '<div class="notice-content">' +
            '<b>认证材料已提交，等待管理员审核</b><br>' +
            '提交时间：' + fmtTime(cert.submittedAt) + '<br>' +
            '审核通过后即可发布商家信息。' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">认证状态 <span class="hint">审核中</span></div>' +
          '<div class="info-row"><span class="label">店铺名称</span><span class="value">' + escapeHtml(restData.shopName || cert.companyName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">联系人</span><span class="value">' + escapeHtml(cert.contactName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">提交时间</span><span class="value">' + fmtTime(cert.submittedAt) + '</span></div>' +
          '<button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="openRestCertModal()">重新提交</button>' +
        '</div>';
    } else if (status === 'approved') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice success">' +
          '<span class="notice-icon">✓</span>' +
          '<div class="notice-content">' +
            '<b>餐饮商家认证已通过</b><br>' +
            '审核时间：' + fmtTime(cert.reviewedAt) +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">商家信息 <span class="hint">已认证</span></div>' +
          '<div class="info-row"><span class="label">店铺名称</span><span class="value">' + escapeHtml(restData.shopName || cert.companyName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">联系人</span><span class="value">' + escapeHtml(cert.contactName || '—') + '</span></div>' +
          '<div class="info-row"><span class="label">审核通过</span><span class="value">' + fmtTime(cert.reviewedAt) + '</span></div>' +
          '<button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="location.href=\'merchant.html\'">🏪 进入商家中心</button>' +
          '<button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="location.href=\'admin.html\'">管理后台</button>' +
        '</div>';
    } else if (status === 'rejected') {
      area.style.display = 'block';
      area.innerHTML =
        '<div class="notice error">' +
          '<span class="notice-icon">✕</span>' +
          '<div class="notice-content">' +
            '<b>认证未通过</b><br>' +
            '审核意见：' + (cert.reviewNote || '未填写') + '<br>' +
            '审核时间：' + fmtTime(cert.reviewedAt) +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">重新认证 <span class="hint">Retrial</span></div>' +
          '<button class="btn btn-primary" onclick="openRestCertModal()">重新提交商家认证</button>' +
        '</div>';
    }
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ============================================================
  //  登录：获取验证码（含人机验证）
  // ============================================================
  var captchaAnswer = null;
  var codeCountdownTimer = null;

  function refreshCaptcha() {
    // 数学题：两个 1-20 的整数 + / -
    var a = 1 + Math.floor(Math.random() * 20);
    var b = 1 + Math.floor(Math.random() * 20);
    var ops = ['+', '-', '×'];
    var op = ops[Math.floor(Math.random() * ops.length)];
    var result;
    if (op === '+') result = a + b;
    else if (op === '-') {
      if (b > a) { var t = a; a = b; b = t; }
      result = a - b;
    } else result = a * b;

    captchaAnswer = result;
    document.getElementById('captchaQuestion').textContent =
      a + ' ' + op + ' ' + b + ' = ?';
    document.getElementById('captchaInput').value = '';
  }

  function showNotice(containerId, type, html) {
    var c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML =
      '<div class="notice ' + (type || '') + '">' +
        '<span class="notice-icon">' + (type === 'error' ? '✕' : type === 'success' ? '✓' : 'ℹ') + '</span>' +
        '<div class="notice-content">' + html + '</div>' +
      '</div>';
  }
  function clearNotice(containerId) {
    var c = document.getElementById(containerId);
    if (c) c.innerHTML = '';
  }

  document.getElementById('getCodeBtn').addEventListener('click', async function () {
    var phone = document.getElementById('phoneInput').value.trim();
    if (!isValidPhone(phone)) {
      showNotice('loginNotice', 'error', '请输入有效的 11 位手机号');
      return;
    }

    var area = document.getElementById('captchaArea');
    if (area.style.display === 'none') {
      // 首次点击 —— 显示人机验证
      area.style.display = 'block';
      refreshCaptcha();
      this.textContent = '再次点击获取';
      return;
    }

    // 校验人机验证
    var answer = document.getElementById('captchaInput').value.trim();
    if (answer === '' || Number(answer) !== captchaAnswer) {
      showNotice('loginNotice', 'error',
        '人机验证未通过，正确答案是 <b>' + captchaAnswer + '</b>，请重新计算后再试。');
      refreshCaptcha();
      return;
    }

    // 生成验证码
    var result = await ApiClient.generateCode(phone);
    if (!result.ok) {
      showNotice('loginNotice', 'error', result.reason || '验证码发送失败');
      return;
    }
    var code = result.data.code;
    showNotice('loginNotice', 'success',
      '验证码已发送！<br>【演示模式】您的验证码是：<b style="font-size:16px;">' + code + '</b>（5 分钟内有效）');

    // 60 秒倒计时
    var btn = this;
    btn.disabled = true;
    var sec = 60;
    btn.textContent = sec + ' 秒后重发';
    codeCountdownTimer = setInterval(function () {
      sec--;
      if (sec <= 0) {
        clearInterval(codeCountdownTimer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = sec + ' 秒后重发';
      }
    }, 1000);

    refreshCaptcha();
  });

  document.getElementById('loginBtn').addEventListener('click', async function () {
    var phone = document.getElementById('phoneInput').value.trim();
    var code = document.getElementById('codeInput').value.trim();

    if (!isValidPhone(phone)) {
      showNotice('loginNotice', 'error', '请输入有效的 11 位手机号');
      return;
    }
    if (!code) {
      showNotice('loginNotice', 'error', '请输入验证码');
      return;
    }

    var result = await ApiClient.login(phone, code);
    if (!result.ok) {
      showNotice('loginNotice', 'error', result.reason || '登录失败');
      return;
    }

    showNotice('loginNotice', 'success', '登录成功，欢迎您！');
    setTimeout(async function () { await render(); }, 600);
  });

  // ============================================================
  //  菜单项：退出登录 / 改手机号
  // ============================================================
  document.getElementById('menuLogout').addEventListener('click', async function () {
    if (!confirm('确定要退出登录吗？')) return;
    await ApiClient.logout();
    location.href = 'experience.html';
  });

  document.getElementById('menuChangePhone').addEventListener('click', async function () {
    var user = await ApiClient.currentUser();
    if (!user) return;
    if (user.phone !== 'admin' && user.role === 'user') {
      alert('提示：用户名即手机号，更换手机号即为更换登录账号。');
    } else if (user.role === 'admin' && user.phone === 'admin') {
      if (!confirm('⚠ 您正在修改超级管理员的初始账号。\n修改后，您下次登录将使用新的手机号。\n是否继续？')) return;
    }
    openModal('modalChangePhone');
    document.getElementById('oldPhoneInput').value = user.phone;
    document.getElementById('newPhoneInput').value = '';
    document.getElementById('newPhoneCode').value = '';
    clearNotice('changePhoneNotice');
  });

  // 弹窗：改手机号 —— 获取新手机号验证码
  var changePhoneCaptchaShown = false;
  var changePhoneCaptchaAnswer = null;

  function refreshChangePhoneCaptcha() {
    var a = 2 + Math.floor(Math.random() * 18);
    var b = 2 + Math.floor(Math.random() * 12);
    changePhoneCaptchaAnswer = a + b;
  }

  document.getElementById('newPhoneGetCode').addEventListener('click', async function () {
    var newPhone = document.getElementById('newPhoneInput').value.trim();
    if (!isValidPhone(newPhone)) {
      showNotice('changePhoneNotice', 'error', '请输入有效的 11 位新手机号');
      return;
    }
    if (!changePhoneCaptchaShown) {
      changePhoneCaptchaShown = true;
      refreshChangePhoneCaptcha();
      showNotice('changePhoneNotice', '',
        '请完成人机验证：<b>' + changePhoneCaptchaAnswer + '</b>？请输入下面问题的答案后再次点击「获取验证码」<br>' +
        '<input type="tel" class="form-input" id="changePhoneCaptchaInput" placeholder="输入计算结果" style="margin-top:8px;" />' +
        '<input type="hidden" id="changePhoneCaptchaExpected" value="' + changePhoneCaptchaAnswer + '" />'
      );
      this.textContent = '再次点击获取';
      return;
    }
    var inp = document.getElementById('changePhoneCaptchaInput');
    if (inp) {
      var ans = inp.value.trim();
      if (Number(ans) !== changePhoneCaptchaAnswer) {
        refreshChangePhoneCaptcha();
        document.getElementById('changePhoneCaptchaExpected').value = changePhoneCaptchaAnswer;
        showNotice('changePhoneNotice', 'error',
          '人机验证未通过。新题目：请计算并输入正确答案后再次点击「获取验证码」。<br>' +
          '<input type="tel" class="form-input" id="changePhoneCaptchaInput" placeholder="输入计算结果" style="margin-top:8px;" />' +
          '<input type="hidden" id="changePhoneCaptchaExpected" value="' + changePhoneCaptchaAnswer + '" />'
        );
        return;
      }
    }

    var result = await ApiClient.generateCode(newPhone);
    if (!result.ok) {
      showNotice('changePhoneNotice', 'error', result.reason || '验证码发送失败');
      return;
    }
    var code = result.data.code;
    showNotice('changePhoneNotice', 'success',
      '验证码已发送到 ' + newPhone + '，【演示验证码：' + code + '】');

    var btn = this;
    btn.disabled = true;
    var sec = 60;
    btn.textContent = sec + ' 秒后重发';
    var t = setInterval(function () {
      sec--;
      if (sec <= 0) {
        clearInterval(t);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = sec + ' 秒后重发';
      }
    }, 1000);
  });

  document.getElementById('changePhoneConfirm').addEventListener('click', async function () {
    var user = await ApiClient.currentUser();
    if (!user) return;
    var newPhone = document.getElementById('newPhoneInput').value.trim();
    var code = document.getElementById('newPhoneCode').value.trim();

    if (!isValidPhone(newPhone)) {
      showNotice('changePhoneNotice', 'error', '请输入有效的 11 位新手机号');
      return;
    }
    var verify = await ApiClient.verifyCode(newPhone, code);
    if (!verify.ok) {
      showNotice('changePhoneNotice', 'error', verify.reason || '验证码校验失败');
      return;
    }
    var result = await ApiClient.changePhone(newPhone);
    if (!result.ok) {
      showNotice('changePhoneNotice', 'error', result.reason);
      return;
    }
    showNotice('changePhoneNotice', 'success', '手机号已成功更换为 ' + newPhone + '，下次登录请使用新号码');
    setTimeout(async function () {
      closeModal('modalChangePhone');
      changePhoneCaptchaShown = false;
      await render();
    }, 900);
  });

  // ============================================================
  //  物业认证弹窗
  // ============================================================
  var certFiles = []; // { name, dataUrl }

  async function openCertModal(forced) {
    var user = await ApiClient.currentUser();
    if (!user) return;
    var cert = user.certification || {};
    document.getElementById('certCompany').value = cert.companyName || '';
    document.getElementById('certInviteCode').value = cert.inviteCode || '';
    document.getElementById('certContact').value = cert.contactName || '';
    certFiles = [];
    renderCertFiles();
    clearNotice('certNotice');
    openModal('modalCertification');

    // 强制弹窗时不允许点击遮罩关闭，且隐藏取消按钮
    var overlay = document.getElementById('modalCertification');
    overlay.dataset.forced = forced ? '1' : '';
    var cancelBtn = document.getElementById('certCancelBtn');
    if (cancelBtn) cancelBtn.style.display = forced ? 'none' : 'inline-block';
  }

  function renderCertFiles() {
    var list = document.getElementById('certFilePreview');
    list.innerHTML = '';
    for (var i = 0; i < certFiles.length; i++) {
      (function (i) {
        var f = certFiles[i];
        var div = document.createElement('div');
        div.className = 'file-preview';
        if (f.isImage) {
          div.innerHTML =
            '<img src="' + f.dataUrl + '" />' +
            '<button class="file-remove" type="button">✕</button>';
        } else {
          div.innerHTML =
            '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#faf7f2;">📄</div>' +
            '<button class="file-remove" type="button">✕</button>';
        }
        div.querySelector('.file-remove').addEventListener('click', function (ev) {
          ev.stopPropagation();
          certFiles.splice(i, 1);
          renderCertFiles();
        });
        list.appendChild(div);
      })(i);
    }
  }

  document.getElementById('certFileInput').addEventListener('change', function (ev) {
    var files = ev.target.files;
    if (!files || !files.length) return;

    var remaining = files.length;
    for (var i = 0; i < files.length; i++) {
      (function (file) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var isImage = file.type && file.type.indexOf('image/') === 0;
          certFiles.push({
            name: file.name,
            dataUrl: e.target.result,
            isImage: isImage
          });
          remaining--;
          if (remaining <= 0) renderCertFiles();
        };
        reader.readAsDataURL(file);
      })(files[i]);
    }
    // 清空 input，允许重复选择同一文件
    ev.target.value = '';
  });

  document.getElementById('certSubmitBtn').addEventListener('click', async function () {
    var user = await ApiClient.currentUser();
    if (!user) return;

    var company = document.getElementById('certCompany').value.trim();
    var inviteCode = document.getElementById('certInviteCode').value.trim();
    var contact = document.getElementById('certContact').value.trim();

    if (!company) {
      showNotice('certNotice', 'error', '请填写企业名称');
      return;
    }
    if (!inviteCode) {
      showNotice('certNotice', 'error', '请填写社区邀请码');
      return;
    }
    if (!contact) {
      showNotice('certNotice', 'error', '请填写联系人');
      return;
    }
    if (certFiles.length === 0) {
      showNotice('certNotice', 'error', '请至少上传 1 份证明材料');
      return;
    }

    var payload = {
      companyName: company,
      contactName: contact,
      inviteCode: inviteCode,
      documents: certFiles.map(function (f) { return f.dataUrl; })
    };

    var result = await ApiClient.submitCertification(payload);
    if (!result.ok) {
      showNotice('certNotice', 'error', result.reason);
      return;
    }
    showNotice('certNotice', 'success', '已提交审核！请等待超级管理员审批。');
    setTimeout(async function () {
      closeModal('modalCertification');
      await render();
    }, 900);
  });

  // ============================================================
  //  餐饮商家认证弹窗
  // ============================================================
  var restKitchenFiles = []; // { name, dataUrl }
  var restShopFiles = [];   // { name, dataUrl }
  var restLicenseFiles = []; // { name, dataUrl }

  async function openRestCertModal(forced) {
    var user = await ApiClient.currentUser();
    if (!user) return;
    var cert = user.certification || {};
    var restData = cert.restaurantData || {};
    document.getElementById('restShopName').value = restData.shopName || cert.companyName || '';
    document.getElementById('restCertContact').value = cert.contactName || '';
    restKitchenFiles = [];
    restShopFiles = [];
    restLicenseFiles = [];
    renderRestFilePreviews('restKitchenPreview', restKitchenFiles);
    renderRestFilePreviews('restShopPreview', restShopFiles);
    renderRestFilePreviews('restLicensePreview', restLicenseFiles);
    clearNotice('restCertNotice');
    openModal('modalRestaurantCert');

    // 强制弹窗时不允许点击遮罩关闭，且隐藏取消按钮
    var overlay = document.getElementById('modalRestaurantCert');
    overlay.dataset.forced = forced ? '1' : '';
    var cancelBtn = document.getElementById('restCertCancelBtn');
    if (cancelBtn) cancelBtn.style.display = forced ? 'none' : 'inline-block';
  }

  function renderRestFilePreviews(previewId, files) {
    var list = document.getElementById(previewId);
    if (!list) return;
    list.innerHTML = '';
    for (var i = 0; i < files.length; i++) {
      (function (i, flist, pid) {
        var f = flist[i];
        var div = document.createElement('div');
        div.className = 'file-preview';
        div.innerHTML =
          '<img src="' + f.dataUrl + '" />' +
          '<button class="file-remove" type="button">✕</button>';
        div.querySelector('.file-remove').addEventListener('click', function (ev) {
          ev.stopPropagation();
          flist.splice(i, 1);
          renderRestFilePreviews(pid, flist);
        });
        list.appendChild(div);
      })(i, files, previewId);
    }
  }

  function setupRestFileInput(inputId, previewId, fileArray) {
    var el = document.getElementById(inputId);
    if (!el) return;
    el.addEventListener('change', function (ev) {
      var files = ev.target.files;
      if (!files || !files.length) return;
      var remaining = files.length;
      for (var i = 0; i < files.length; i++) {
        (function (file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            fileArray.push({ name: file.name, dataUrl: e.target.result });
            remaining--;
            if (remaining <= 0) renderRestFilePreviews(previewId, fileArray);
          };
          reader.readAsDataURL(file);
        })(files[i]);
      }
      ev.target.value = '';
    });
  }
  setupRestFileInput('restKitchenInput', 'restKitchenPreview', restKitchenFiles);
  setupRestFileInput('restShopInput', 'restShopPreview', restShopFiles);
  setupRestFileInput('restLicenseInput', 'restLicensePreview', restLicenseFiles);

  document.getElementById('restCertSubmitBtn').addEventListener('click', async function () {
    var user = await ApiClient.currentUser();
    if (!user) return;

    var shopName = document.getElementById('restShopName').value.trim();
    var contact = document.getElementById('restCertContact').value.trim();

    if (!shopName) {
      showNotice('restCertNotice', 'error', '请填写店铺名称');
      return;
    }
    if (!contact) {
      showNotice('restCertNotice', 'error', '请填写联系人');
      return;
    }
    if (restKitchenFiles.length === 0) {
      showNotice('restCertNotice', 'error', '请至少上传 1 张后厨照片');
      return;
    }
    if (restShopFiles.length === 0) {
      showNotice('restCertNotice', 'error', '请至少上传 1 张店铺门脸照片');
      return;
    }
    if (restLicenseFiles.length === 0) {
      showNotice('restCertNotice', 'error', '请上传营业执照照片');
      return;
    }

    var payload = {
      companyName: shopName,
      contactName: contact,
      documents: [].concat(
        restKitchenFiles.map(function (f) { return f.dataUrl; }),
        restShopFiles.map(function (f) { return f.dataUrl; }),
        restLicenseFiles.map(function (f) { return f.dataUrl; })
      ),
      restaurantData: {
        shopName: shopName,
        kitchenPhotos: restKitchenFiles.map(function (f) { return f.dataUrl; }),
        shopPhotos: restShopFiles.map(function (f) { return f.dataUrl; }),
        licensePhoto: restLicenseFiles[0] ? restLicenseFiles[0].dataUrl : null
      }
    };

    var result = await ApiClient.submitCertification(payload);
    if (!result.ok) {
      showNotice('restCertNotice', 'error', result.reason);
      return;
    }
    showNotice('restCertNotice', 'success', '已提交审核！请等待超级管理员审批。');
    setTimeout(async function () {
      closeModal('modalRestaurantCert');
      await render();
    }, 900);
  });

  // ============================================================
  //  通用弹窗
  // ============================================================
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  // 点击遮罩关闭（强制弹窗除外）
  document.querySelectorAll('.modal-overlay').forEach(function (ov) {
    ov.addEventListener('click', function (ev) {
      if (ev.target !== ov) return;
      if (ov.dataset.forced === '1') return;
      ov.classList.remove('open');
    });
  });
</script>
</body>
</html>
