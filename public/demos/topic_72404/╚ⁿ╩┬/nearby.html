<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>附近资源</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #faf7f2;
    color: #3d3427;
    min-height: 100vh;
    padding-bottom: 120px;
  }

  .page-header {
    background: linear-gradient(180deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    padding: 32px 18px 26px;
    position: relative;
    box-shadow: 0 6px 20px rgba(89,70,46,0.22);
  }
  .page-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding-left: 12px;
    border-left: 4px solid #fef3d5;
  }
  .page-sub {
    font-size: 0.78rem;
    opacity: 0.82;
    margin-top: 8px;
    padding-left: 12px;
    letter-spacing: 0.02em;
  }

  .container { padding: 16px; max-width: 760px; margin: 0 auto; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    color: #fef3d5;
    text-decoration: none;
    opacity: 0.85;
    margin-bottom: 10px;
    padding: 4px 10px 4px 6px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); opacity: 1; }

  .address-bar {
    background: linear-gradient(135deg, #fff9ed 0%, #fff 100%);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 14px 0 0;
    box-shadow: 0 4px 16px rgba(89,70,46,0.12);
    border: 1px solid rgba(89,70,46,0.12);
  }
  .address-bar .label { font-size: 0.72rem; color: #8b6b3d; letter-spacing: 0.04em; }
  .address-bar .value { font-size: 0.95rem; font-weight: 600; color: #3d3427; margin-top: 4px; line-height: 1.5; }
  .address-bar .value.placeholder { color: #b5ada0; font-weight: 400; font-style: italic; }

  .action-bar {
    padding: 12px 16px 0;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    box-shadow: 0 4px 12px rgba(89,70,46,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(89,70,46,0.4); }
  .btn-secondary {
    background: #fff;
    color: #5a4a30;
    border: 1.5px solid rgba(89,70,46,0.2);
  }
  .btn-secondary:hover { background: #fff9ed; }
  .btn-success {
    background: linear-gradient(135deg, #15803d 0%, #22c55e 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(21,128,61,0.3);
  }
  .btn-success:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .cat-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 16px 4px;
    max-width: 760px;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .cat-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    background: #fff;
    border: 1.5px solid rgba(89,70,46,0.18);
    border-radius: 999px;
    font-size: 0.82rem;
    color: #5a4a30;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-tab:hover { background: #fff9ed; border-color: #8b6b3d; }
  .cat-tab.active {
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    border-color: #6b4f2a;
    color: #fef3d5;
    box-shadow: 0 4px 12px rgba(89,70,46,0.35);
  }

  .grid {
    padding: 12px 16px 20px;
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .item-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 4px 16px rgba(89,70,46,0.08);
    border: 1px solid rgba(89,70,46,0.08);
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  .item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(89,70,46,0.14); }

  .item-photo {
    width: 100%;
    height: 150px;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    color: rgba(89,70,46,0.4);
  }
  .item-photo.food { background: linear-gradient(135deg, #fff5e8 0%, #ffe9c9 100%); }
  .item-photo.item { background: linear-gradient(135deg, #f2f5ed 0%, #e5ede5 100%); }
  .item-badge {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(107,79,42,0.85);
    color: #fef3d5;
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .item-badge.free { background: rgba(107,140,107,0.9); }
  .item-badge.sale { background: rgba(140,107,79,0.9); }
  .item-badge.food-remain { background: rgba(200,120,60,0.9); }

  .item-info { display: flex; flex-direction: column; gap: 6px; }
  .item-title { font-size: 0.95rem; font-weight: 700; color: #3d3427; line-height: 1.4; }
  .item-desc { font-size: 0.8rem; color: #8a8070; line-height: 1.5; }
  .item-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #8a8070; margin-top: 4px; padding-top: 10px; border-top: 1px dashed rgba(89,70,46,0.14); }
  .item-price { font-size: 1rem; font-weight: 700; color: #c2410c; }
  .item-price.free { color: #6b8a6b; }
  .item-merchant { font-size: 0.72rem; color: #8b6b3d; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #b5ada0;
    grid-column: 1 / -1;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.7; }
  .empty-state .title { font-size: 0.95rem; font-weight: 600; color: #8a8070; margin-bottom: 6px; }
  .empty-state .desc { font-size: 0.78rem; line-height: 1.7; }

  .loading {
    text-align: center;
    padding: 40px;
    color: #8a8070;
    grid-column: 1 / -1;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
  }
  .modal-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #3d3427;
    margin-bottom: 16px;
    text-align: center;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f5f0e8;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: #8a8070;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 0.82rem;
    color: #5a4a30;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid rgba(89,70,46,0.15);
    border-radius: 10px;
    font-size: 0.9rem;
    color: #3d3427;
    background: #faf7f2;
    font-family: inherit;
    transition: all 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: #8b6b3d;
    background: #fff;
  }
  .form-textarea { resize: vertical; min-height: 80px; }

  .pay-methods { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .pay-method {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 2px solid rgba(89,70,46,0.12);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pay-method:hover { border-color: rgba(89,70,46,0.25); background: #faf7f2; }
  .pay-method.selected {
    border-color: #8b6b3d;
    background: #fff9ed;
  }
  .pay-method-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .pay-method-icon.wechat { background: #e5f5e5; }
  .pay-method-icon.alipay { background: #e5efff; }
  .pay-method-info { flex: 1; }
  .pay-method-name { font-weight: 600; color: #3d3427; font-size: 0.95rem; }
  .pay-method-desc { font-size: 0.75rem; color: #8a8070; margin-top: 2px; }
  .pay-method-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(89,70,46,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
  }
  .pay-method.selected .pay-method-check {
    background: #8b6b3d;
    border-color: #8b6b3d;
    color: #fff;
  }

  .order-summary {
    background: #faf7f2;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .order-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.85rem;
    color: #5a4a30;
  }
  .order-row.total {
    font-size: 1rem;
    font-weight: 700;
    color: #c2410c;
    padding-top: 10px;
    margin-top: 6px;
    border-top: 1px dashed rgba(89,70,46,0.15);
  }

  .qr-box {
    text-align: center;
    padding: 20px;
    margin-bottom: 16px;
  }
  .qr-code {
    width: 200px;
    height: 200px;
    margin: 0 auto 12px;
    border: 2px solid #eee;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    background: #fff;
  }
  .qr-tip { font-size: 0.85rem; color: #5a4a30; }
  .qr-amount {
    font-size: 1.5rem;
    font-weight: 700;
    color: #c2410c;
    margin-bottom: 8px;
  }

  .product-detail-photo {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    margin-bottom: 16px;
  }
  .product-detail-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #3d3427;
    margin-bottom: 8px;
  }
  .product-detail-price {
    font-size: 1.4rem;
    font-weight: 700;
    color: #c2410c;
    margin-bottom: 12px;
  }
  .product-detail-desc {
    font-size: 0.9rem;
    color: #5a4a30;
    line-height: 1.6;
    margin-bottom: 16px;
    padding: 12px;
    background: #faf7f2;
    border-radius: 10px;
  }
  .product-detail-meta {
    display: flex;
    gap: 12px;
    font-size: 0.8rem;
    color: #8a8070;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .product-detail-meta span {
    background: #f5f0e8;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.25) 100%);
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.5);
  }
  .bottom-nav::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: linear-gradient(90deg, transparent 0%, rgba(107,79,42,0.3) 50%, transparent 100%);
    border-radius: 2px;
    pointer-events: none;
  }
  .bottom-nav a {
    text-decoration: none;
    color: #5a4a30;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .bottom-nav a.active, .bottom-nav a:hover {
    color: #fef3d5;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    box-shadow: 0 4px 12px rgba(89,70,46,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  @media (max-width: 640px) {
    .bottom-nav { gap: 0; padding: 4px 6px; }
    .bottom-nav a { padding: 8px 14px; font-size: 0.8rem; }
  }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    z-index: 2000;
    font-size: 0.9rem;
    display: none;
  }
  .toast.show { display: block; }

  .local-notice {
    background: #fff9ed;
    border: 1px solid rgba(139,107,61,0.25);
    color: #6b4f2a;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="page-header">
  <a href="experience.html" class="back-btn">‹ 返回首页</a>
  <div class="page-title">附近资源</div>
  <div class="page-sub">闲置物品交换与周边商家当日剩食低价售卖</div>
</div>

<div class="container" style="padding-top: 8px;">
  <div class="address-bar">
    <div class="label">附近范围</div>
    <div class="value placeholder" id="addrValue">尚未设置地址，请先在首页选择省、市、区、街道</div>
  </div>
  <div class="local-notice" id="localNotice" style="display:none; margin-top:12px;">
    <span>ℹ️</span>
    <span>当前为本地预览模式，交易功能需启动后端服务（npm start）后使用</span>
  </div>
</div>

<div class="action-bar">
  <button class="btn btn-primary" onclick="openPublishModal()">
    <span>📢</span> 发布资源
  </button>
  <button class="btn btn-secondary" onclick="openMyOrders()">
    <span>📋</span> 我的订单
  </button>
</div>

<div class="cat-tabs" id="catTabs"></div>

<div class="grid" id="itemGrid">
  <div class="loading">加载中...</div>
</div>

<nav class="bottom-nav">
  <a href="experience.html">首页</a>
  <a href="nearby.html" class="active">附近资源</a>
  <a href="merchant.html">商家中心</a>
  <a href="admin.html">管理后台</a>
  <a href="my.html">我的</a>
</nav>

<div class="modal-overlay" id="publishModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('publishModal')">×</button>
    <div class="modal-title">发布资源</div>
    <div class="form-group">
      <label class="form-label">资源类型</label>
      <select class="form-select" id="pubCat">
        <option value="food">🍱 商家剩食</option>
        <option value="item">📦 闲置物品</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">标题</label>
      <input class="form-input" id="pubTitle" placeholder="例如：当日面包集合、九成新自行车" />
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <textarea class="form-textarea" id="pubDesc" placeholder="详细描述商品信息、取货方式等"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">价格（元，免费填0）</label>
      <input class="form-input" id="pubPrice" type="number" min="0" step="0.01" placeholder="0" />
    </div>
    <div class="form-group">
      <label class="form-label">图标/emoji</label>
      <input class="form-input" id="pubPhoto" placeholder="例如：🍞、🚲、📚" />
    </div>
    <div class="form-group">
      <label class="form-label">详细地址</label>
      <input class="form-input" id="pubAddress" placeholder="例如：社区3号楼、中心广场地下一层" />
    </div>
    <div class="form-group">
      <label class="form-label">发布者名称</label>
      <input class="form-input" id="pubMerchant" placeholder="例如：社区便利店、张女士" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="submitPublish()">发布</button>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" onclick="closeDetailModal()">×</button>
    <div class="modal-title" id="detailModalTitle">商品详情</div>
    <div id="detailContent"></div>
    <button class="btn btn-primary" style="width:100%; margin-top:16px; display:none;" id="detailModalConfirm">确认</button>
  </div>
</div>

<script src="store.js"></script>
<script src="api-client.js"></script>

<script>
  function closeDetailModal() {
    document.getElementById('detailModalTitle').textContent = '商品详情';
    var confirmBtn = document.getElementById('detailModalConfirm');
    confirmBtn.style.display = 'none';
    confirmBtn.onclick = null;
    closeModal('detailModal');
  }
</script>

<div class="modal-overlay" id="payModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('payModal')">×</button>
    <div class="modal-title">选择支付方式</div>
    <div class="order-summary" id="payOrderSummary"></div>
    <div class="pay-methods">
      <div class="pay-method selected" data-method="wechat" onclick="selectPayMethod('wechat')">
        <div class="pay-method-icon wechat">💬</div>
        <div class="pay-method-info">
          <div class="pay-method-name">微信支付</div>
          <div class="pay-method-desc">使用微信扫码支付</div>
        </div>
        <div class="pay-method-check">✓</div>
      </div>
      <div class="pay-method" data-method="alipay" onclick="selectPayMethod('alipay')">
        <div class="pay-method-icon alipay">💰</div>
        <div class="pay-method-info">
          <div class="pay-method-name">支付宝</div>
          <div class="pay-method-desc">使用支付宝扫码支付</div>
        </div>
        <div class="pay-method-check">✓</div>
      </div>
    </div>
    <button class="btn btn-success" style="width:100%;" onclick="confirmPay()">立即支付</button>
  </div>
</div>

<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('qrModal')">×</button>
    <div class="modal-title" id="qrTitle">扫码支付</div>
    <div class="qr-box">
      <div class="qr-amount" id="qrAmount">¥0.00</div>
      <div class="qr-code" id="qrCode">📱</div>
      <div class="qr-tip" id="qrTip">请使用微信扫码支付</div>
      <div id="qrPayUrl" style="margin-top:10px;text-align:center;"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="simulatePay()">模拟支付成功（测试）</button>
    <p style="text-align:center; font-size:0.75rem; color:#a0978a; margin-top:10px;">
      订单号：<span id="qrOrderNo"></span>
    </p>
  </div>
</div>

<div class="modal-overlay" id="ordersModal">
  <div class="modal" style="max-width:500px;">
    <button class="modal-close" onclick="closeModal('ordersModal')">×</button>
    <div class="modal-title">我的订单</div>
    <div id="ordersList" style="max-height:60vh; overflow-y:auto;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var API_BASE = (function() {
    if (location.protocol === 'file:') return '';
    var basePath = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1).replace(/\/$/, '');
    return location.origin + basePath;
  })();

  var CATEGORIES = [
    { key: 'all', name: '全部', icon: '🌐' },
    { key: 'food', name: '商家剩食', icon: '🍱' },
    { key: 'item', name: '闲置物品', icon: '📦' }
  ];

  var currentCat = 'all';
  var products = [];
  var currentProduct = null;
  var currentOrder = null;
  var selectedPayMethod = 'wechat';
  var backendAvailable = false;

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  async function isLoggedIn() {
    if (typeof ApiClient !== 'undefined' && ApiClient.currentUser) {
      try {
        var user = await ApiClient.currentUser();
        if (user) return true;
      } catch (e) {}
    }
    try {
      var raw = localStorage.getItem('app_session_v1');
      if (!raw) return false;
      var s = JSON.parse(raw);
      return !!s.userId;
    } catch (e) { return false; }
  }

  async function requireLogin() {
    if (await isLoggedIn()) return true;
    showToast('请先登录');
    setTimeout(function() { location.href = 'my.html'; }, 1200);
    return false;
  }

  function loadAddress() {
    try {
      var raw = localStorage.getItem('app_user_address_v2');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function renderAddress() {
    var addr = loadAddress();
    var el = document.getElementById('addrValue');
    if (!addr || !addr.province) {
      el.textContent = '尚未设置地址，请先在首页选择省、市、区、街道';
      el.classList.add('placeholder');
      return;
    }
    el.classList.remove('placeholder');
    var parts = [];
    if (addr.province) parts.push(addr.province);
    if (addr.city && addr.city !== addr.province) parts.push(addr.city);
    if (addr.district) parts.push(addr.district);
    if (addr.street) parts.push(addr.street);
    el.textContent = parts.join(' ') || '尚未设置';
  }

  function renderTabs() {
    var box = document.getElementById('catTabs');
    var html = '';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      var cls = c.key === currentCat ? 'cat-tab active' : 'cat-tab';
      html += '<button class="' + cls + '" onclick="selectCat(\'' + c.key + '\')">' +
        '<span class="ic">' + c.icon + '</span>' + c.name + '</button>';
    }
    box.innerHTML = html;
  }
  function selectCat(key) {
    currentCat = key;
    renderTabs();
    renderGrid();
  }

  async function apiCall(url, options) {
    var opts = options || {};
    var token = await getToken();
    if (token) {
      if (!opts.headers) opts.headers = {};
      opts.headers['Authorization'] = 'Bearer ' + token;
    }
    var r = await fetch(API_BASE + url, opts);
    return await r.json();
  }

  async function getToken() {
    if (typeof ApiClient !== 'undefined' && ApiClient.getSession) {
      try {
        var sess = await ApiClient.getSession();
        if (sess && sess.token) return sess.token;
      } catch (e) {}
    }
    try {
      var raw = localStorage.getItem('app_session_v1');
      if (!raw) return '';
      var s = JSON.parse(raw);
      return s.token || '';
    } catch(e) { return ''; }
  }

  function loadProducts() {
    var box = document.getElementById('itemGrid');
    box.innerHTML = '<div class="loading">加载中...</div>';

    function applyLocalProducts() {
      ApiClient.getProducts().then(function(res) {
        var list = [];
        if (res.ok && res.data && Array.isArray(res.data.list)) list = res.data.list;
        if (!list.length) list = loadNearbyLocalProducts();
        products = list;
        renderGrid();
      }).catch(function() {
        products = loadNearbyLocalProducts();
        renderGrid();
      });
    }

    if (backendAvailable) {
      var addr = loadAddress() || {};
      var params = new URLSearchParams();
      if (currentCat && currentCat !== 'all') params.append('cat', currentCat);
      if (addr.city) params.append('city', addr.city);
      if (addr.district) params.append('district', addr.district);
      if (addr.street) params.append('street', addr.street);

      apiCall('/api/products?' + params.toString()).then(function(res) {
        if (res.ok) {
          products = res.list || [];
          renderGrid();
        } else {
          showToast(res.reason || '加载失败，已切换本地预览');
          applyLocalProducts();
        }
      }).catch(function(err) {
        showToast('网络异常，已切换本地预览');
        applyLocalProducts();
      });
    } else {
      applyLocalProducts();
    }
  }

  function loadNearbyLocalProducts() {
    try {
      var raw = localStorage.getItem('nearby_products_v1');
      return raw ? JSON.parse(raw) : getDefaultProducts();
    } catch (e) {
      return getDefaultProducts();
    }
  }

  function getDefaultProducts() {
    return [
      { id: 'demo1', cat: 'food', title: '社区便利店 · 当日面包集合', desc: '当日未售出面包 1 折处理，先到先得。', photo: '🥐', price: 5, merchantName: '社区便利店', address: '文化路 · 社区东门', createdAt: Date.now() - 7200000 },
      { id: 'demo2', cat: 'food', title: '日式料理 · 当日寿司套餐', desc: '营业结束前清仓，数量有限。', photo: '🍣', price: 28, merchantName: '日式料理店', address: '中心广场 · 地下一层', createdAt: Date.now() - 10800000 },
      { id: 'demo3', cat: 'item', title: '九成新儿童自行车', desc: '孩子长大用不上了，8 成新，原价 399。', photo: '🚲', price: 0, merchantName: '张女士', address: '社区 3 号楼', createdAt: Date.now() - 3600000 },
      { id: 'demo4', cat: 'item', title: '闲置书籍一批', desc: '文学历史类书籍，约 20 本，打包优先。', photo: '📚', price: 0, merchantName: '李先生', address: '社区 5 号楼', createdAt: Date.now() - 86400000 }
    ];
  }

  function renderGrid() {
    var box = document.getElementById('itemGrid');
    var items = products;
    if (currentCat !== 'all') {
      items = items.filter(function (x) { return x.cat === currentCat; });
    }
    if (!items.length) {
      box.innerHTML = '<div class="empty-state">' +
        '<div class="icon">📭</div>' +
        '<div class="title">暂无资源</div>' +
        '<div class="desc">该类别下暂时没有可用资源。<br>点击"发布资源"成为第一个发布者吧！</div>' +
      '</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var isFree = !it.price || it.price === 0;
      var photoClass = it.cat === 'food' ? 'food' : 'item';
      var badgeClass = isFree ? 'free' : (it.cat === 'food' ? 'food-remain' : 'sale');
      var badgeText = isFree ? '免费' : (it.cat === 'food' ? '商家剩食' : '低价转让');
      html +=
        '<div class="item-card" onclick="openDetail(\'' + it.id + '\')">' +
          '<div class="item-photo ' + photoClass + '">' +
            '<span class="item-badge ' + badgeClass + '">' + badgeText + '</span>' +
            '<span>' + escapeHtml(it.photo || (it.cat === 'food' ? '🍱' : '📦')) + '</span>' +
          '</div>' +
          '<div class="item-info">' +
            '<div class="item-title">' + escapeHtml(it.title) + '</div>' +
            '<div class="item-desc">' + escapeHtml((it.desc || '').substring(0, 40)) + '</div>' +
            '<div class="item-meta">' +
              '<span class="item-merchant">' + escapeHtml(it.merchantName || '商家') + '</span>' +
              '<span class="item-price' + (isFree ? ' free' : '') + '">' + (isFree ? '免费' : '¥' + it.price) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  function openDetail(id) {
    var p = products.find(function(x) { return x.id === id; });
    if (!p) return;
    currentProduct = p;
    var isFree = !p.price || p.price === 0;
    var photoClass = p.cat === 'food' ? 'food' : 'item';
    var html =
      '<div class="product-detail-photo ' + photoClass + '">' + escapeHtml(p.photo || '📦') + '</div>' +
      '<div class="product-detail-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="product-detail-price">' + (isFree ? '免费' : '¥' + p.price) + '</div>' +
      '<div class="product-detail-desc">' + escapeHtml(p.desc || '暂无描述') + '</div>' +
      '<div class="product-detail-meta">' +
        '<span>👤 ' + escapeHtml(p.merchantName || '匿名') + '</span>' +
        (p.address ? '<span>📍 ' + escapeHtml(p.address) + '</span>' : '') +
        '<span>🕐 ' + fmtRelative(p.createdAt) + '</span>' +
      '</div>' +
      (isFree ?
        '<button class="btn btn-secondary" style="width:100%;" onclick="handleContact()">联系发布者</button>' :
        '<button class="btn btn-success" style="width:100%;" onclick="handleBuy()">立即购买</button>'
      );
    document.getElementById('detailContent').innerHTML = html;
    var confirmBtn = document.getElementById('detailModalConfirm');
    confirmBtn.style.display = 'none';
    openModal('detailModal');
  }

  async function openPublishModal() {
    if (!(await requireLogin())) return;
    openModal('publishModal');
  }

  async function handleBuy() {
    if (!(await requireLogin())) return;
    closeDetailModal();
    openPayModal();
  }

  async function handleContact() {
    if (!(await requireLogin())) return;
    showToast('请联系发布者自取');
  }

  function submitPublish() {
    var cat = document.getElementById('pubCat').value;
    var title = document.getElementById('pubTitle').value.trim();
    var desc = document.getElementById('pubDesc').value.trim();
    var price = parseFloat(document.getElementById('pubPrice').value) || 0;
    var photo = document.getElementById('pubPhoto').value.trim();
    var address = document.getElementById('pubAddress').value.trim();
    var merchant = document.getElementById('pubMerchant').value.trim();

    if (!title) { showToast('请填写标题'); return; }

    var addr = loadAddress() || {};
    var data = {
      title: title,
      desc: desc,
      price: price,
      cat: cat,
      photo: photo || (cat === 'food' ? '🍱' : '📦'),
      address: address,
      merchantName: merchant || '匿名发布者',
      merchantId: '',
      city: addr.city || '',
      district: addr.district || '',
      street: addr.street || ''
    };

    apiCall('/api/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function(res) {
      if (res.ok) {
        showToast('发布成功');
        closeModal('publishModal');
        document.getElementById('pubTitle').value = '';
        document.getElementById('pubDesc').value = '';
        document.getElementById('pubPrice').value = '';
        document.getElementById('pubPhoto').value = '';
        document.getElementById('pubAddress').value = '';
        document.getElementById('pubMerchant').value = '';
        loadProducts();
      } else {
        showToast(res.reason || '发布失败');
      }
    }).catch(function() {
      products.unshift({
        id: 'local_' + Date.now(),
        ...data,
        createdAt: Date.now()
      });
      try { localStorage.setItem('nearby_products_v1', JSON.stringify(products)); } catch(e) {}
      showToast('发布成功（本地模式）');
      closeModal('publishModal');
      renderGrid();
    });
  }

  function openPayModal() {
    if (!currentProduct) return;
    closeModal('detailModal');
    selectPayMethod('wechat');
    var html =
      '<div class="order-row"><span>商品</span><span>' + escapeHtml(currentProduct.title) + '</span></div>' +
      '<div class="order-row"><span>单价</span><span>¥' + currentProduct.price + '</span></div>' +
      '<div class="order-row total"><span>实付</span><span>¥' + currentProduct.price + '</span></div>';
    document.getElementById('payOrderSummary').innerHTML = html;
    openModal('payModal');
  }

  function selectPayMethod(method) {
    selectedPayMethod = method;
    document.querySelectorAll('.pay-method').forEach(function(el) {
      el.classList.toggle('selected', el.dataset.method === method);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function openBuyerForm(order, callback) {
    var html =
      '<div class="form-group">' +
        '<label class="form-label">姓名</label>' +
        '<input class="form-input" id="buyerName" placeholder="请输入您的姓名" />' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">电话</label>' +
        '<input class="form-input" id="buyerPhone" placeholder="请输入您的电话" type="tel" />' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">取货地址</label>' +
        '<input class="form-input" id="buyerAddress" placeholder="请输入取货地址" />' +
      '</div>';
    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailModalTitle').textContent = '填写订单信息';
    var confirmBtn = document.getElementById('detailModalConfirm');
    confirmBtn.style.display = 'block';
    confirmBtn.textContent = '确认';
    openModal('detailModal');

    confirmBtn.onclick = function() {
      var buyerName = document.getElementById('buyerName').value.trim();
      var buyerPhone = document.getElementById('buyerPhone').value.trim();
      var buyerAddress = document.getElementById('buyerAddress').value.trim();
      if (!buyerName) { showToast('请输入姓名'); return; }
      if (!buyerPhone) { showToast('请输入电话'); return; }
      callback({ buyerName: buyerName, buyerPhone: buyerPhone, buyerAddress: buyerAddress });
    };
  }

  function confirmPay() {
    if (!currentProduct) return;
    closeModal('payModal');
    var orderData = {
      productId: currentProduct.id,
      payMethod: selectedPayMethod
    };
    if (currentProduct.price > 0) {
      openBuyerForm(orderData, function(buyerInfo) {
        orderData.buyerName = buyerInfo.buyerName;
        orderData.buyerPhone = buyerInfo.buyerPhone;
        orderData.buyerAddress = buyerInfo.buyerAddress;
        doCreateOrder(orderData);
        closeModal('detailModal');
        document.getElementById('detailModalTitle').textContent = '商品详情';
      });
    } else {
      doCreateOrder(orderData);
    }
  }

  function doCreateOrder(orderData) {
    apiCall('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    }).then(function(res) {
      if (res.ok) {
        currentOrder = res.order;
        showQrCode(res.order);
      } else {
        showToast(res.reason || '创建订单失败');
      }
    }).catch(function() {
      currentOrder = {
        id: 'local_' + Date.now(),
        orderNo: 'ORD' + Date.now(),
        productId: currentProduct.id,
        productTitle: currentProduct.title,
        price: currentProduct.price,
        payMethod: selectedPayMethod,
        status: 'pending'
      };
      showQrCode(currentOrder);
    });
  }

  function showQrCode(order) {
    closeModal('payModal');
    document.getElementById('qrAmount').textContent = '¥' + order.price;
    document.getElementById('qrOrderNo').textContent = order.orderNo;
    document.getElementById('qrPayUrl').innerHTML = '';
    if (selectedPayMethod === 'wechat') {
      document.getElementById('qrTitle').textContent = '微信支付';
      document.getElementById('qrTip').textContent = '请使用微信扫码支付';
      document.getElementById('qrCode').textContent = '💬';
    } else {
      document.getElementById('qrTitle').textContent = '支付宝';
      document.getElementById('qrTip').textContent = '请使用支付宝扫码支付';
      document.getElementById('qrCode').textContent = '💰';
    }
    apiCall('/api/pay/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId: order.id, payMethod: selectedPayMethod })
    }).then(function(res) {
      if (res.ok) {
        if (res.qrCode) {
          document.getElementById('qrCode').innerHTML = '<img src="' + res.qrCode + '" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentNode.textContent=\'二维码加载失败\'" />';
        } else {
          document.getElementById('qrTip').textContent = '暂无收款码，请联系商家或管理员配置';
        }
        if (res.payUrl) {
          var label = selectedPayMethod === 'wechat' ? '点击跳转微信支付' : '点击跳转支付宝支付';
          document.getElementById('qrPayUrl').innerHTML = '<a href="' + res.payUrl + '" target="_blank" class="btn btn-success" style="display:inline-block;width:auto;padding:10px 22px;text-decoration:none;">' + label + '</a>';
        }
      } else {
        document.getElementById('qrTip').textContent = (res.reason || '获取支付信息失败') + '，请联系商家或管理员';
      }
    }).catch(function() {
      document.getElementById('qrTip').textContent = '网络异常，请稍后重试或联系商家';
    });
    openModal('qrModal');
  }

  function simulatePay() {
    if (!currentOrder) return;
    apiCall('/api/pay/simulate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId: currentOrder.id })
    }).then(function(res) {
      if (res.ok) {
        showToast('支付成功');
        closeModal('qrModal');
      } else {
        showToast(res.reason || '支付失败');
      }
    }).catch(function() {
      showToast('支付成功（模拟）');
      closeModal('qrModal');
    });
  }

  async function openMyOrders() {
    if (!(await requireLogin())) return;
    var box = document.getElementById('ordersList');
    box.innerHTML = '<div class="loading">加载中...</div>';
    apiCall('/api/orders').then(function(res) {
      if (res.ok) renderOrders(res.list || []);
      else box.innerHTML = '<div class="empty-state"><div class="title">暂无订单</div></div>';
    }).catch(function() {
      var local = [];
      try {
        var raw = localStorage.getItem('nearby_orders_v1');
        if (raw) local = JSON.parse(raw);
      } catch(e) {}
      renderOrders(local);
    });
    openModal('ordersModal');
  }

  function renderOrders(list) {
    var box = document.getElementById('ordersList');
    if (!list.length) {
      box.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="title">暂无订单</div><div class="desc">还没有购买记录，去看看有什么好东西吧</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      var statusText = o.status === 'paid' ? '已支付' : '待支付';
      var statusClass = o.status === 'paid' ? 'color:#15803d;' : 'color:#c2410c;';
      html +=
        '<div style="padding:14px; background:#faf7f2; border-radius:12px; margin-bottom:10px;">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
            '<div style="font-weight:600; color:#3d3427;">' + escapeHtml(o.productTitle) + '</div>' +
            '<div style="font-size:0.8rem; ' + statusClass + ' font-weight:600;">' + statusText + '</div>' +
          '</div>' +
          '<div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#8a8070;">' +
            '<span>订单号：' + escapeHtml(o.orderNo) + '</span>' +
            '<span style="font-weight:700; color:#c2410c;">¥' + o.price + '</span>' +
          '</div>' +
          '<div style="font-size:0.75rem; color:#a0978a; margin-top:6px;">' +
            '支付方式：' + (o.payMethod === 'wechat' ? '微信支付' : '支付宝') +
            ' · ' + fmtTime(o.createdAt) +
          '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  function fmtTime(t) {
    if (!t) return '—';
    var d = new Date(t);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtRelative(t) {
    if (!t) return '';
    var diff = Date.now() - t;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 30 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + '天前';
    return fmtTime(t).slice(0, 10);
  }

  function init() {
    ApiClient.checkBackend().then(function(ok) {
      backendAvailable = ok;
      if (!ok) {
        var notice = document.getElementById('localNotice');
        if (notice) notice.style.display = 'flex';
      }
      loadProducts();
    }).catch(function() {
      backendAvailable = false;
      var notice = document.getElementById('localNotice');
      if (notice) notice.style.display = 'flex';
      loadProducts();
    });
  }

  renderAddress();
  renderTabs();
  init();
</script>

</body>
</html>
