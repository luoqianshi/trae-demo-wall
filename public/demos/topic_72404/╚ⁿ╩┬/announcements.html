<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>社区公告</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #faf7f2;
    color: #3d3427;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* 页面顶部 */
  .page-header {
    background: linear-gradient(180deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    padding: 32px 18px 26px;
    position: relative;
    box-shadow: 0 6px 20px rgba(89,70,46,0.22);
  }
  .page-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding-left: 12px;
    border-left: 4px solid #fef3d5;
  }
  .page-sub {
    font-size: 0.78rem;
    opacity: 0.82;
    margin-top: 8px;
    padding-left: 12px;
    letter-spacing: 0.02em;
  }

  /* 通用 */
  .container { padding: 16px; max-width: 760px; margin: 0 auto; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    color: #fef3d5;
    text-decoration: none;
    opacity: 0.85;
    margin-bottom: 10px;
    padding: 4px 10px 4px 6px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); opacity: 1; }

  /* 地址栏 */
  .address-bar {
    background: linear-gradient(135deg, #fff9ed 0%, #fff 100%);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 14px 0 0;
    box-shadow: 0 4px 16px rgba(89,70,46,0.12);
    border: 1px solid rgba(89,70,46,0.12);
  }
  .address-bar .label { font-size: 0.72rem; color: #8b6b3d; letter-spacing: 0.04em; }
  .address-bar .value { font-size: 0.95rem; font-weight: 600; color: #3d3427; margin-top: 4px; line-height: 1.5; }
  .address-bar .value.placeholder { color: #b5ada0; font-weight: 400; font-style: italic; }

  /* 分隔 */
  .section-title {
    font-size: 0.86rem;
    font-weight: 700;
    color: #5a4a30;
    padding: 18px 8px 10px;
    letter-spacing: 0.04em;
    border-bottom: 2px solid rgba(139,115,85,0.2);
    margin: 0 16px 14px;
  }

  /* 公告卡片 */
  .announcement-list { padding: 4px 16px 20px; max-width: 760px; margin: 0 auto; }
  .announcement-card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(89,70,46,0.08);
    border: 1px solid rgba(89,70,46,0.08);
    position: relative;
    overflow: hidden;
  }
  .announcement-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #8b6b3d 0%, #d8b88e 100%);
  }
  .announcement-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .announcement-icon { font-size: 1.5rem; }
  .announcement-meta { font-size: 0.7rem; color: #8a8070; letter-spacing: 0.02em; }
  .announcement-title { font-size: 1.02rem; font-weight: 700; color: #3d3427; margin-bottom: 10px; line-height: 1.4; }
  .announcement-body { font-size: 0.86rem; color: #5a4a30; line-height: 1.7; white-space: pre-wrap; }
  .announcement-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(89,70,46,0.15);
    font-size: 0.72rem;
    color: #8a8070;
  }
  .announcement-author { font-weight: 600; color: #6b4f2a; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #b5ada0;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.7; }
  .empty-state .title { font-size: 0.95rem; font-weight: 600; color: #8a8070; margin-bottom: 6px; }
  .empty-state .desc { font-size: 0.78rem; line-height: 1.7; }

  /* 底部灵动岛菜单栏 */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.25) 100%);
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.5);
  }
  .bottom-nav::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: linear-gradient(90deg, transparent 0%, rgba(107,79,42,0.3) 50%, transparent 100%);
    border-radius: 2px;
    pointer-events: none;
  }
  .bottom-nav a {
    text-decoration: none;
    color: #5a4a30;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .bottom-nav a.active, .bottom-nav a:hover {
    color: #fef3d5;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    box-shadow: 0 4px 12px rgba(89,70,46,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  @media (max-width: 640px) {
    .bottom-nav { gap: 0; padding: 4px 6px; font-size: 0.78rem; }
    .bottom-nav a { padding: 8px 14px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a href="experience.html" class="back-btn">‹ 返回首页</a>
  <div class="page-title">智慧社区 · 公告</div>
  <div class="page-sub">由物业或管理员发布的正式通知</div>
</div>

<!-- 当前社区 / 绑定提示 -->
<div class="container" style="padding-top: 8px;">
  <div class="address-bar">
    <div class="label">当前社区</div>
    <div class="value placeholder" id="communityValue">尚未绑定社区，请先在「我的」页面输入邀请码</div>
  </div>
</div>

<!-- 公告列表 -->
<div class="section-title" id="annSectionTitle">社区公告</div>
<div class="announcement-list" id="annList"></div>

<!-- 底部灵动岛菜单栏 -->
<nav class="bottom-nav">
  <a href="experience.html">首页</a>
  <a href="nearby.html">附近资源</a>
  <a href="merchant.html">商家中心</a>
  <a href="admin.html">管理后台</a>
  <a href="my.html">我的</a>
</nav>

<script src="store.js"></script>
<script src="api-client.js"></script>
<script>
  // ============ 当前社区 / 绑定状态 ============
  async function renderCommunityBar() {
    var user = await ApiClient.currentUser();
    var el = document.getElementById('communityValue');
    if (!user) {
      el.textContent = '请先登录，登录后绑定社区即可查看公告';
      el.classList.add('placeholder');
      return null;
    }
    if (!user.communityId) {
      el.innerHTML = '尚未绑定社区，<a href="my.html" style="color:#6b4f2a;text-decoration:underline;">去「我的」页面输入邀请码</a>';
      el.classList.add('placeholder');
      return null;
    }
    var community = await ApiClient.findCommunityById(user.communityId);
    el.classList.remove('placeholder');
    el.textContent = community ? community.name + '（邀请码：' + community.inviteCode + '）' : '已绑定社区';
    document.getElementById('annSectionTitle').textContent = '社区公告 · ' + (community ? community.name : '');
    return user.communityId;
  }

  // ============ 公告列表 ============
  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function maskPhone(p) {
    if (!p || p.length < 7) return p || '';
    return p.substring(0, 3) + '****' + p.substring(p.length - 4);
  }
  async function renderAnnouncements() {
    var communityId = await renderCommunityBar();
    var box = document.getElementById('annList');
    if (!communityId) {
      box.innerHTML = '<div class="empty-state">' +
        '<div class="icon">🔒</div>' +
        '<div class="title">暂不可查看</div>' +
        '<div class="desc">您尚未绑定社区，请先输入邀请码绑定本小区。<br>绑定后只显示本小区的公告。</div>' +
      '</div>';
      return;
    }

    var list = (await ApiClient.getAnnouncements(communityId)).data.list;
    if (!list.length) {
      box.innerHTML = '<div class="empty-state">' +
        '<div class="icon">📭</div>' +
        '<div class="title">暂无公告</div>' +
        '<div class="desc">管理员或认证物业账号发布公告后，<br>将在此页面按时间倒序显示。</div>' +
      '</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      html +=
        '<div class="announcement-card">' +
          '<div class="announcement-head">' +
            '<div class="announcement-icon">📢</div>' +
            '<div class="announcement-meta">' + fmtTime(a.createdAt) + '</div>' +
          '</div>' +
          '<div class="announcement-title">' + escapeHtml(a.title || '无标题') + '</div>' +
          '<div class="announcement-body">' + escapeHtml(a.content || '') + '</div>' +
          '<div class="announcement-foot">' +
            '<span>发布人：<span class="announcement-author">' + (a.authorPhone === 'admin' ? '管理员' : '物业') + ' ' + maskPhone(a.authorPhone) + '</span></span>' +
            '<span>正式发布</span>' +
          '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  // ============ 启动 ============
  renderAnnouncements();
</script>

</body>
</html>
