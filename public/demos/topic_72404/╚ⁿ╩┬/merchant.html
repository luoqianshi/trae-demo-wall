<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>商家中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #faf7f2;
    color: #3d3427;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .page-header {
    background: linear-gradient(180deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    padding: 32px 18px 26px;
    position: relative;
    box-shadow: 0 6px 20px rgba(89,70,46,0.22);
  }
  .shop-info {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .shop-avatar {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .shop-name {
    font-size: 1.2rem;
    font-weight: 700;
  }
  .shop-desc {
    font-size: 0.78rem;
    opacity: 0.82;
    margin-top: 4px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    color: #fef3d5;
    text-decoration: none;
    opacity: 0.85;
    margin-bottom: 14px;
    padding: 4px 10px 4px 6px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); opacity: 1; }

  .container { padding: 16px; max-width: 760px; margin: 0 auto; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(89,70,46,0.06);
    border: 1px solid rgba(89,70,46,0.06);
  }
  .stat-num {
    font-size: 1.4rem;
    font-weight: 700;
    color: #8b6b3d;
  }
  .stat-label {
    font-size: 0.72rem;
    color: #8a8070;
    margin-top: 4px;
  }

  .section-title {
    font-size: 1rem;
    font-weight: 700;
    color: #3d3427;
    margin: 20px 0 12px;
    padding-left: 10px;
    border-left: 3px solid #8b6b3d;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(89,70,46,0.06);
    border: 1px solid rgba(89,70,46,0.06);
    margin-bottom: 14px;
  }

  .pay-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(89,70,46,0.08);
  }
  .pay-item:last-child { border-bottom: none; }
  .pay-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .pay-icon.wechat { background: #e5f5e5; }
  .pay-icon.alipay { background: #e5efff; }
  .pay-info { flex: 1; }
  .pay-name { font-weight: 600; color: #3d3427; font-size: 0.95rem; }
  .pay-status { font-size: 0.75rem; color: #8a8070; margin-top: 2px; }
  .pay-status.enabled { color: #15803d; }
  .pay-action {
    font-size: 0.8rem;
    color: #8b6b3d;
    font-weight: 500;
    cursor: pointer;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
  }
  .modal-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #3d3427;
    margin-bottom: 16px;
    text-align: center;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f5f0e8;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: #8a8070;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 0.82rem;
    color: #5a4a30;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .qr-upload {
    text-align: center;
    padding: 10px 0;
  }
  .qr-preview {
    width: 160px;
    height: 160px;
    margin: 0 auto 14px;
    border: 2px dashed rgba(89,70,46,0.2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    color: #a0978a;
    background: #faf7f2;
    overflow: hidden;
  }
  .qr-preview img { width: 100%; height: 100%; object-fit: contain; }
  .upload-btn {
    display: inline-block;
    padding: 10px 24px;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
  }
  .switch-label {
    font-size: 0.9rem;
    color: #3d3427;
    font-weight: 500;
  }
  .switch {
    position: relative;
    width: 48px;
    height: 26px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #d4cdc0;
    transition: .3s;
    border-radius: 26px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
  }
  input:checked + .slider:before { transform: translateX(22px); }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    box-shadow: 0 4px 12px rgba(89,70,46,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); }

  .product-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .product-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #faf7f2;
    border-radius: 10px;
  }
  .product-photo {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: #fff;
    flex-shrink: 0;
  }
  .product-info { flex: 1; min-width: 0; }
  .product-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: #3d3427;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-desc {
    font-size: 0.75rem;
    color: #8a8070;
    margin-top: 4px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-price {
    font-size: 0.95rem;
    font-weight: 700;
    color: #c2410c;
    margin-top: 6px;
  }
  .product-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }
  .product-action-btn {
    padding: 4px 10px;
    font-size: 0.72rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: #fff;
    color: #5a4a30;
    border: 1px solid rgba(89,70,46,0.15);
  }
  .product-action-btn.delete { color: #c2410c; }

  .fab-btn {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    color: #fef3d5;
    border: none;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(89,70,46,0.4);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .fab-btn:hover { transform: scale(1.05); }

  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.25) 100%);
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.5);
  }
  .bottom-nav a {
    text-decoration: none;
    color: #5a4a30;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .bottom-nav a.active, .bottom-nav a:hover {
    color: #fef3d5;
    background: linear-gradient(135deg, #6b4f2a 0%, #8b6b3d 100%);
    box-shadow: 0 4px 12px rgba(89,70,46,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    z-index: 2000;
    font-size: 0.9rem;
    display: none;
  }
  .toast.show { display: block; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #b5ada0;
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.7; }
  .empty-state .title { font-size: 0.9rem; font-weight: 600; color: #8a8070; margin-bottom: 6px; }
  .empty-state .desc { font-size: 0.78rem; line-height: 1.7; }

  .notice-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .notice-bar.warn {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
  }
  .notice-bar.warn code {
    background: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
  }
  .notice-bar.info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
  }
  .notice-bar a {
    color: inherit;
    font-weight: 600;
    text-decoration: underline;
  }

  .form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid rgba(89,70,46,0.15);
    border-radius: 10px;
    font-size: 0.9rem;
    color: #3d3427;
    background: #faf7f2;
    font-family: inherit;
    transition: all 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: #8b6b3d;
    background: #fff;
  }
  .form-textarea { resize: vertical; min-height: 80px; }
</style>
</head>
<body>

<div class="page-header">
  <a href="my.html" class="back-btn">‹ 返回</a>
  <div class="shop-info">
    <div class="shop-avatar">🏪</div>
    <div>
      <div class="shop-name" id="shopName">商家中心</div>
      <div class="shop-desc" id="shopDesc">管理收款码和发布商品</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="notice-bar info" id="loginNotice">
    <span>🔒</span>
    <span>您尚未登录，<a href="my.html">立即登录</a> 以使用商家中心。</span>
  </div>
  <div class="notice-bar warn" id="backendNotice">
    <span>ℹ️</span>
    <span>后端服务未启动，请在项目目录运行 <code>npm start</code> 后再发布商品和管理订单。</span>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statProducts">0</div>
      <div class="stat-label">在售商品</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOrders">0</div>
      <div class="stat-label">订单数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAmount">¥0</div>
      <div class="stat-label">收入</div>
    </div>
  </div>

  <div class="section-title">收款设置</div>
  <div class="card">
    <div class="pay-item">
      <div class="pay-icon wechat">💬</div>
      <div class="pay-info">
        <div class="pay-name">微信收款</div>
        <div class="pay-status" id="wechatStatus">未设置</div>
      </div>
      <div class="pay-action" onclick="openPayModal('wechat')">设置 ›</div>
    </div>
    <div class="pay-item">
      <div class="pay-icon alipay">💰</div>
      <div class="pay-info">
        <div class="pay-name">支付宝收款</div>
        <div class="pay-status" id="alipayStatus">未设置</div>
      </div>
      <div class="pay-action" onclick="openPayModal('alipay')">设置 ›</div>
    </div>
  </div>

  <div class="section-title">我的商品</div>
  <div class="card">
    <div id="productList" class="product-list">
      <div class="empty-state">
        <div class="icon">📦</div>
        <div class="title">暂无商品</div>
        <div class="desc">点击右下角 + 号发布第一个商品</div>
      </div>
    </div>
  </div>
</div>

<button class="fab-btn" onclick="openPublishModal()">+</button>

<nav class="bottom-nav">
  <a href="experience.html">首页</a>
  <a href="nearby.html">附近资源</a>
  <a href="merchant.html" class="active">商家中心</a>
  <a href="admin.html">管理后台</a>
  <a href="my.html">我的</a>
</nav>

<div class="modal-overlay" id="payModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('payModal')">×</button>
    <div class="modal-title" id="payModalTitle">设置收款码</div>
    <div class="qr-upload">
      <div class="qr-preview" id="qrPreview">📱</div>
      <p style="font-size:0.8rem; color:#7a6f5f; margin-bottom:14px;">
        上传您的个人收款码图片<br>用户扫码后直接向您付款
      </p>
      <label class="upload-btn">
        选择图片
        <input type="file" accept="image/*" style="display:none;" onchange="handleQrUpload(event)" />
      </label>
    </div>
    <div class="switch-row">
      <div class="switch-label">启用该收款方式</div>
      <label class="switch">
        <input type="checkbox" id="payEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="savePayConfig()">保存设置</button>
  </div>
</div>

<div class="modal-overlay" id="publishModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('publishModal')">×</button>
    <div class="modal-title">发布商品</div>
    <div class="form-group">
      <label class="form-label">商品类型</label>
      <select class="form-select" id="pubCat">
        <option value="food">🍱 商家剩食</option>
        <option value="item">📦 闲置物品</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">商品标题</label>
      <input class="form-input" id="pubTitle" placeholder="例如：当日面包集合" />
    </div>
    <div class="form-group">
      <label class="form-label">商品描述</label>
      <textarea class="form-textarea" id="pubDesc" placeholder="详细描述商品信息"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">价格（元，免费填0）</label>
      <input class="form-input" id="pubPrice" type="number" min="0" step="0.01" placeholder="0" />
    </div>
    <div class="form-group">
      <label class="form-label">图标/emoji</label>
      <input class="form-input" id="pubPhoto" placeholder="例如：🍞、🥐、🍣" />
    </div>
    <div class="form-group">
      <label class="form-label">取货地址</label>
      <input class="form-input" id="pubAddress" placeholder="例如：社区便利店" />
    </div>
    <button class="btn btn-primary" onclick="submitPublish()">发布商品</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script src="api-client.js"></script>
<script>
  var API_BASE = (function() {
    if (location.protocol === 'file:') return '';
    var basePath = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1).replace(/\/$/, '');
    return location.origin + basePath;
  })();
  var currentPayType = 'wechat';
  var currentQrCode = '';
  var merchantId = 'merchant_demo';
  var merchantName = '我的店铺';
  var backendAvailable = true;

  function getToken() {
    try {
      var raw = localStorage.getItem('app_session_v1');
      if (!raw) return '';
      var s = JSON.parse(raw);
      return s.token || '';
    } catch(e) { return ''; }
  }

  function authHeaders() {
    var token = getToken();
    var h = { 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getCurrentUser() {
    try {
      var raw = localStorage.getItem('app_session_v1');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function loadAddress() {
    try {
      var raw = localStorage.getItem('app_user_address_v2');
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) { return {}; }
  }

  function isLoggedIn() {
    return ApiClient.getSession().then(function(session) {
      return !!(session && session.token);
    });
  }

  function showLoginNotice() {
    document.getElementById('loginNotice').style.display = 'flex';
    showToast('请先登录');
    setTimeout(function() { location.href = 'my.html'; }, 2000);
  }

  function showBackendNotice() {
    document.getElementById('backendNotice').style.display = 'flex';
    showToast('后端服务未启动，发布商品等功能不可用');
  }

  function initPage() {
    isLoggedIn().then(function(loggedIn) {
      if (!loggedIn) {
        showLoginNotice();
        return;
      }
      initShopInfo();
      ApiClient.checkBackend().then(function(ok) {
        backendAvailable = ok;
        if (!ok) showBackendNotice();
        loadPayStatus();
        loadProducts();
        loadOrders();
      });
    });
  }

  function initShopInfo() {
    var user = getCurrentUser();
    if (user && user.phone) {
      merchantId = 'm_' + user.userId;
      merchantName = user.phone;
      document.getElementById('shopName').textContent = '商家：' + user.phone;
    }
  }

  function openPayModal(type) {
    currentPayType = type;
    document.getElementById('payModalTitle').textContent =
      type === 'wechat' ? '微信收款设置' : '支付宝收款设置';
    currentQrCode = '';
    document.getElementById('qrPreview').innerHTML = type === 'wechat' ? '💬' : '💰';
    document.getElementById('payEnabled').checked = false;

    fetch(API_BASE + '/api/merchants/' + merchantId + '/pay', { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok && res.config) {
          var cfg = res.config[type] || {};
          document.getElementById('payEnabled').checked = cfg.enabled || false;
          if (cfg.qrCode) {
            currentQrCode = cfg.qrCode;
            document.getElementById('qrPreview').innerHTML = '<img src="' + cfg.qrCode + '" />';
          }
        }
      })
      .catch(function(err) {
        if (backendAvailable) showToast('获取收款配置失败：' + (err.message || '网络异常'));
      });

    openModal('payModal');
  }

  function handleQrUpload(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      currentQrCode = e.target.result;
      document.getElementById('qrPreview').innerHTML = '<img src="' + currentQrCode + '" />';
    };
    reader.readAsDataURL(file);
  }

  function savePayConfig() {
    var data = {};
    data[currentPayType] = {
      enabled: document.getElementById('payEnabled').checked,
      qrCode: currentQrCode
    };
    fetch(API_BASE + '/api/merchants/' + merchantId + '/pay', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.ok) {
        showToast('保存成功');
        closeModal('payModal');
        loadPayStatus();
      } else {
        showToast(res.reason || '保存失败');
      }
    })
    .catch(function(err) {
      showToast('保存失败：' + (err.message || '网络异常'));
    });
  }

  function loadPayStatus() {
    fetch(API_BASE + '/api/merchants/' + merchantId + '/pay', { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok && res.config) {
          updateStatusText('wechat', res.config.wechat && res.config.wechat.enabled);
          updateStatusText('alipay', res.config.alipay && res.config.alipay.enabled);
        }
      })
      .catch(function(err) {
        if (backendAvailable) showToast('获取收款状态失败：' + (err.message || '网络异常'));
      });
  }

  function updateStatusText(type, enabled) {
    var el = document.getElementById(type + 'Status');
    el.textContent = enabled ? '已启用' : '未设置';
    el.className = 'pay-status' + (enabled ? ' enabled' : '');
  }

  function openPublishModal() { openModal('publishModal'); }

  function submitPublish() {
    var cat = document.getElementById('pubCat').value;
    var title = document.getElementById('pubTitle').value.trim();
    var desc = document.getElementById('pubDesc').value.trim();
    var price = parseFloat(document.getElementById('pubPrice').value) || 0;
    var photo = document.getElementById('pubPhoto').value.trim();
    var address = document.getElementById('pubAddress').value.trim();

    if (!title) { showToast('请填写商品标题'); return; }

    var addr = loadAddress();
    var data = {
      title: title,
      desc: desc,
      price: price,
      cat: cat,
      photo: photo || (cat === 'food' ? '🍱' : '📦'),
      address: address,
      merchantId: merchantId,
      merchantName: merchantName,
      city: addr.city || '',
      district: addr.district || '',
      street: addr.street || ''
    };

    fetch(API_BASE + '/api/products', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.ok) {
        showToast('发布成功');
        closeModal('publishModal');
        document.getElementById('pubTitle').value = '';
        document.getElementById('pubDesc').value = '';
        document.getElementById('pubPrice').value = '';
        document.getElementById('pubPhoto').value = '';
        document.getElementById('pubAddress').value = '';
        loadProducts();
      } else {
        showToast(res.reason || '发布失败');
      }
    })
    .catch(function(err) {
      showToast('发布失败：' + (err.message || '网络异常'));
    });
  }

  function loadProducts() {
    fetch(API_BASE + '/api/products?merchantId=' + encodeURIComponent(merchantId), { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          renderProducts(res.list || []);
          updateStats(res.list || []);
        }
      })
      .catch(function() {
        document.getElementById('productList').innerHTML =
          '<div class="empty-state"><div class="icon">📦</div><div class="title">暂无商品</div><div class="desc">启动后端服务后可管理商品</div></div>';
      });
  }

  function renderProducts(list) {
    var box = document.getElementById('productList');
    if (!list.length) {
      box.innerHTML = '<div class="empty-state"><div class="icon">📦</div><div class="title">暂无商品</div><div class="desc">点击右下角 + 号发布第一个商品</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var isFree = !p.price || p.price === 0;
      html +=
        '<div class="product-item">' +
          '<div class="product-photo">' + escapeHtml(p.photo || '📦') + '</div>' +
          '<div class="product-info">' +
            '<div class="product-title">' + escapeHtml(p.title) + '</div>' +
            '<div class="product-desc">' + escapeHtml(p.desc || '') + '</div>' +
            '<div class="product-price">' + (isFree ? '免费' : '¥' + p.price) + '</div>' +
          '</div>' +
          '<div class="product-actions">' +
            '<button class="product-action-btn delete" onclick="deleteProduct(\'' + p.id + '\')">删除</button>' +
          '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  function deleteProduct(id) {
    if (!confirm('确定删除这个商品？')) return;
    fetch(API_BASE + '/api/products/' + id, { method: 'DELETE', headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          showToast('已删除');
          loadProducts();
        } else {
          showToast(res.reason || '删除失败');
        }
      })
      .catch(function(err) { showToast('删除失败：' + (err.message || '网络异常')); });
  }

  function updateStats(products) {
    document.getElementById('statProducts').textContent = products.filter(function(p) { return p.status === 'active'; }).length;
  }

  function loadOrders() {
    fetch(API_BASE + '/api/orders?merchantId=' + encodeURIComponent(merchantId), { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          var orders = res.list || [];
          var paid = orders.filter(function(o) { return o.status === 'paid'; });
          var total = paid.reduce(function(s, o) { return s + (o.price || 0); }, 0);
          document.getElementById('statOrders').textContent = orders.length;
          document.getElementById('statAmount').textContent = '¥' + total.toFixed(2);
        }
      })
      .catch(function(err) {
        if (backendAvailable) showToast('获取订单数据失败：' + (err.message || '网络异常'));
      });
  }

  initPage();
</script>

</body>
</html>
