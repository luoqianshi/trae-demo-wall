<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>管理员登录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #2e1a0e 0%, #4a2e18 40%, #3a2416 100%);
    color: #e8d8c0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
  }
  .logo-area {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-icon {
    font-size: 56px;
    margin-bottom: 10px;
  }
  .logo-title {
    font-size: 24px;
    font-weight: 700;
    color: #f0e0c8;
    letter-spacing: 3px;
  }
  .logo-sub {
    font-size: 13px;
    color: #a08060;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: #f0e0c8;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-title-icon { font-size: 22px; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #a08060;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .form-input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    font-size: 15px;
    color: #f0e0c8;
    background: rgba(255, 255, 255, 0.08);
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  .form-input::placeholder { color: #6a5040; }
  .form-input:focus {
    border-color: #c4956a;
    background: rgba(255, 255, 255, 0.13);
    box-shadow: 0 0 0 3px rgba(196, 149, 106, 0.15);
  }
  .input-row { display: flex; gap: 10px; }
  .input-row .form-input { flex: 1; }

  .btn {
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #c4956a 0%, #a0724a 100%);
    color: #1a0e08;
    padding: 14px;
    width: 100%;
    box-shadow: 0 4px 16px rgba(196, 149, 106, 0.3);
    letter-spacing: 1px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(196, 149, 106, 0.4); }
  .btn-primary:disabled { background: rgba(196, 149, 106, 0.3); color: #6a5040; box-shadow: none; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    color: #c4956a;
    padding: 12px 20px;
    white-space: nowrap;
  }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .captcha {
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px;
    margin-top: 4px;
  }
  .captcha-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .captcha-label { font-size: 14px; color: #a08060; }
  .captcha-question {
    background: linear-gradient(135deg, #c4956a, #a0724a);
    color: #1a0e08;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    user-select: none;
    font-family: Georgia, serif;
    text-decoration: line-through;
    text-decoration-color: rgba(26, 14, 8, 0.4);
  }
  .captcha-hint { font-size: 11px; color: #6a5040; display: block; margin-top: 4px; }

  .notice {
    background: rgba(196, 149, 106, 0.12);
    border: 1px solid rgba(196, 149, 106, 0.3);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    color: #c4956a;
    line-height: 1.6;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .notice.error { background: rgba(200, 80, 60, 0.1); border-color: rgba(200, 80, 60, 0.3); color: #e08070; }
  .notice.success { background: rgba(100, 180, 100, 0.1); border-color: rgba(100, 180, 100, 0.3); color: #90d090; }
  .notice-icon { font-size: 16px; flex-shrink: 0; }

  .back-link {
    text-align: center;
    margin-top: 20px;
  }
  .back-link a {
    color: #6a5040;
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
  }
  .back-link a:hover { color: #c4956a; }

  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
    margin: 20px 0;
  }

  .switch-mode {
    text-align: center;
    font-size: 13px;
    color: #6a5040;
    margin-top: 16px;
  }
  .switch-mode a { color: #c4956a; text-decoration: none; font-weight: 500; }
  .switch-mode a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-area">
    <div class="logo-icon">⚙</div>
    <div class="logo-title">管理后台</div>
  </div>

  <div class="card">
    <div class="card-title">
      <span class="card-title-icon">🔐</span>
      管理员登录
    </div>

    <div id="loginNotice"></div>

    <!-- 模式A：admin 账号未改手机号 → 用密码登录 -->
    <div id="modePassword">
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" class="form-input" id="adminIdInput" value="admin" readonly style="opacity:0.6;cursor:not-allowed;" />
      </div>
      <div class="form-group">
        <label>登录密码</label>
        <input type="password" class="form-input" id="adminPwdInput" placeholder="请输入管理员密码" />
      </div>
      <button class="btn btn-primary" id="pwdLoginBtn">登录</button>

      <div class="switch-mode">
        如已修改为手机号账号，
        <a href="#" id="switchToPhone">点击此处使用手机号登录</a>
      </div>
    </div>

    <!-- 模式B：admin 已改手机号 → 用手机号 + 验证码登录 -->
    <div id="modePhone" style="display:none;">
      <div class="form-group">
        <label>手机号</label>
        <input type="tel" class="form-input" id="adminPhoneInput" maxlength="11" placeholder="请输入管理员绑定的手机号" />
      </div>

      <div class="form-group">
        <label>验证码</label>
        <div class="input-row">
          <input type="tel" class="form-input" id="adminCodeInput" maxlength="6" placeholder="请输入6位验证码（当前为测试阶段咱不使用验证码，随机输入6个数字）" />
          <button class="btn btn-secondary" id="adminGetCodeBtn">获取验证码</button>
        </div>
      </div>

      <!-- 人机验证 -->
      <div class="captcha" id="adminCaptchaArea" style="display:none;">
        <div class="captcha-row">
          <span class="captcha-label">请计算：</span>
          <span class="captcha-question" id="captchaQuestion">—</span>
        </div>
        <input type="tel" class="form-input" id="adminCaptchaInput" placeholder="输入计算结果" maxlength="4" />
        <span class="captcha-hint">通过人机验证后才能获取验证码</span>
      </div>

      <button class="btn btn-primary" id="phoneLoginBtn">登录</button>

      <div class="switch-mode" id="switchToPwdArea" style="display:none;">
        仍使用初始密码账号？
        <a href="#" id="switchToPwd">点击此处</a>
      </div>
    </div>
  </div>

  <div class="back-link">
    <a href="my.html">← 返回用户登录</a>
    <span style="color:#4a3020;margin:0 10px;">|</span>
    <a href="experience.html">返回首页</a>
  </div>
</div>

<script src="store.js"></script>
<script src="api-client.js"></script>
<script>
  (async function () {
    // ============================================================
    //  检测 admin 当前的手机号
    // ============================================================
    var adminUsersRes = await ApiClient.getUsers({ role: 'admin' });
    var adminUser = null;
    if (adminUsersRes.ok && adminUsersRes.data && adminUsersRes.data.list && adminUsersRes.data.list.length) {
      adminUser = adminUsersRes.data.list[0];
    }
    var adminPhoneIsAdmin = !adminUser || adminUser.phone === 'admin';

    function showNotice(type, html) {
      var el = document.getElementById('loginNotice');
      el.innerHTML =
        '<div class="notice ' + (type || '') + '">' +
          '<span class="notice-icon">' + (type === 'error' ? '✕' : type === 'success' ? '✓' : 'ℹ') + '</span>' +
          '<div>' + html + '</div>' +
        '</div>';
    }
    function clearNotice() { document.getElementById('loginNotice').innerHTML = ''; }

    // ============================================================
    //  根据 admin 当前状态显示登录模式
    // ============================================================
    if (adminPhoneIsAdmin) {
      // 模式A：密码登录
      document.getElementById('modePassword').style.display = 'block';
      document.getElementById('modePhone').style.display = 'none';
    } else {
      // 模式B：手机号登录
      document.getElementById('modePassword').style.display = 'none';
      document.getElementById('modePhone').style.display = 'block';
      document.getElementById('adminPhoneInput').value = adminUser ? adminUser.phone : '';
      document.getElementById('switchToPwdArea').style.display = 'block';
    }

    // ============================================================
    //  切换登录模式
    // ============================================================
    document.getElementById('switchToPhone').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('modePassword').style.display = 'none';
      document.getElementById('modePhone').style.display = 'block';
      clearNotice();
    });

    document.getElementById('switchToPwd').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('modePassword').style.display = 'block';
      document.getElementById('modePhone').style.display = 'none';
      clearNotice();
    });

    // ============================================================
    //  模式A：密码登录
    // ============================================================
    document.getElementById('pwdLoginBtn').addEventListener('click', async function () {
      var pwd = document.getElementById('adminPwdInput').value;
      if (!pwd) {
        showNotice('error', '请输入登录密码');
        return;
      }
      var result = await ApiClient.adminLogin(pwd);
      if (!result.ok) {
        showNotice('error', result.reason + '<br>（默认密码：admin888）');
        return;
      }
      showNotice('success', '登录成功，正在进入管理后台...');
      setTimeout(function () { location.href = 'admin.html'; }, 600);
    });

    // ============================================================
    //  模式B：手机号 + 验证码登录
    // ============================================================
    var captchaAnswer = null;
    var codeCountdownTimer = null;

    function refreshCaptcha() {
      var a = 2 + Math.floor(Math.random() * 18);
      var b = 2 + Math.floor(Math.random() * 12);
      var op = ['+', '-', '×'][Math.floor(Math.random() * 3)];
      var result;
      if (op === '+') result = a + b;
      else if (op === '-') {
        if (b > a) { var t = a; a = b; b = t; }
        result = a - b;
      } else result = a * b;
      captchaAnswer = result;
      document.getElementById('captchaQuestion').textContent = a + ' ' + op + ' ' + b + ' = ?';
      document.getElementById('adminCaptchaInput').value = '';
    }

    document.getElementById('adminGetCodeBtn').addEventListener('click', async function () {
      var phone = document.getElementById('adminPhoneInput').value.trim();

      // 先做手机号格式检查
      if (!Store.isValidPhone(phone)) {
        showNotice('error', '请输入有效的 11 位手机号');
        return;
      }

      // 检查是否是 admin 用户
      if (!adminUser || adminUser.phone !== phone) {
        showNotice('error', '该手机号未注册为管理员账号');
        return;
      }

      var area = document.getElementById('adminCaptchaArea');
      if (area.style.display === 'none') {
        area.style.display = 'block';
        refreshCaptcha();
        this.textContent = '再次点击获取';
        return;
      }

      var answer = document.getElementById('adminCaptchaInput').value.trim();
      if (answer === '' || Number(answer) !== captchaAnswer) {
        showNotice('error', '人机验证未通过，正确答案是 <b>' + captchaAnswer + '</b>，请重新计算后再试。');
        refreshCaptcha();
        return;
      }

      var codeRes = await ApiClient.generateCode(phone);
      if (!codeRes.ok) {
        showNotice('error', codeRes.reason || '获取验证码失败');
        return;
      }
      var code = codeRes.data.code;
      showNotice('success', '验证码已发送！<br>【演示模式】您的验证码是：<b style="font-size:16px;">' + code + '</b>（5 分钟内有效）');

      var btn = this;
      btn.disabled = true;
      var sec = 60;
      btn.textContent = sec + ' 秒后重发';
      codeCountdownTimer = setInterval(function () {
        sec--;
        if (sec <= 0) {
          clearInterval(codeCountdownTimer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = sec + ' 秒后重发';
        }
      }, 1000);

      refreshCaptcha();
    });

    document.getElementById('phoneLoginBtn').addEventListener('click', async function () {
      var phone = document.getElementById('adminPhoneInput').value.trim();
      var code = document.getElementById('adminCodeInput').value.trim();

      if (!Store.isValidPhone(phone)) {
        showNotice('error', '请输入有效的 11 位手机号');
        return;
      }
      if (!code) {
        showNotice('error', '请输入验证码');
        return;
      }

      var result = await ApiClient.login(phone, code);
      if (!result.ok) {
        showNotice('error', result.reason);
        return;
      }

      // 检查是否是 admin 角色
      var user = await ApiClient.currentUser();
      if (!user || user.role !== 'admin') {
        await ApiClient.logout();
        showNotice('error', '该账号不是管理员账号');
        return;
      }

      showNotice('success', '登录成功，正在进入管理后台...');
      setTimeout(function () { location.href = 'admin.html'; }, 600);
    });

    // 回车触发表单提交
    document.getElementById('adminPwdInput').addEventListener('keyup', function (e) {
      if (e.key === 'Enter') document.getElementById('pwdLoginBtn').click();
    });
    document.getElementById('adminCodeInput').addEventListener('keyup', function (e) {
      if (e.key === 'Enter') document.getElementById('phoneLoginBtn').click();
    });
  })();
</script>
</body>
</html>
