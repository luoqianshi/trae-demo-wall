<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token 账本 - AI 用量管理仪表盘</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08080f; --surface: #0f0f1a; --surface2: #161628; --surface3: #1c1c36;
      --border: #252545; --border2: #303060;
      --text: #eeedf5; --text2: #9898b8; --text3: #606080;
      --accent: #7c6cff; --accent2: #a29bfe; --accent-soft: rgba(124,108,255,0.12);
      --green: #00d2a0; --green-soft: rgba(0,210,160,0.12);
      --orange: #ffb347; --orange-soft: rgba(255,179,71,0.12);
      --red: #ff6b6b; --red-soft: rgba(255,107,107,0.12);
      --blue: #64b5f6; --blue-soft: rgba(100,181,246,0.12);
      --gold: #ffd700;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border2); }

    /* 背景光晕 */
    .bg-glow { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-glow::before { content:''; position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(124,108,255,0.08) 0%, transparent 70%); }
    .bg-glow::after { content:''; position: absolute; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(ellipse, rgba(0,210,160,0.05) 0%, transparent 70%); }

    /* Header */
    .header { background: rgba(15,15,26,0.85); border-bottom: 1px solid var(--border); padding: 14px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
    .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #7c6cff, #a29bfe); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; box-shadow: 0 4px 20px rgba(124,108,255,0.3); }
    .logo-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff, #c0bfff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-text p { font-size: 12px; color: var(--text3); font-weight: 500; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .period-selector { display: flex; background: var(--surface2); border-radius: 10px; padding: 4px; border: 1px solid var(--border); }
    .period-btn { padding: 7px 16px; border: none; background: transparent; color: var(--text3); font-size: 13px; font-weight: 600; border-radius: 7px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
    .period-btn:hover { color: var(--text); }
    .period-btn.active { background: linear-gradient(135deg, var(--accent), #6a5acd); color: white; box-shadow: 0 2px 10px rgba(124,108,255,0.3); }
    .demo-badge { padding: 7px 14px; border-radius: 8px; background: var(--green-soft); border: 1px solid rgba(0,210,160,0.2); color: var(--green); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    /* Main */
    .main { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 28px; }

    /* Welcome Banner */
    .welcome-banner { background: linear-gradient(135deg, rgba(124,108,255,0.1), rgba(0,210,160,0.05)); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .welcome-text h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .welcome-text p { font-size: 13px; color: var(--text2); }
    .budget-display { display: flex; align-items: center; gap: 12px; }
    .budget-info { text-align: right; }
    .budget-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .budget-value { font-size: 18px; font-weight: 800; color: var(--green); }
    .budget-bar-wrap { width: 120px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .budget-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--green), var(--accent)); transition: width 0.8s ease; }
    .budget-bar.warning { background: linear-gradient(90deg, var(--orange), var(--red)); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; transition: all 0.3s ease; position: relative; overflow: hidden; }
    .stat-card::before { content:''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card:nth-child(1)::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .stat-card:nth-child(2)::before { background: linear-gradient(90deg, var(--green), transparent); }
    .stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--blue), transparent); }
    .stat-card:nth-child(4)::before { background: linear-gradient(90deg, var(--orange), transparent); }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-label { font-size: 13px; color: var(--text2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .stat-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .stat-icon.purple { background: var(--accent-soft); }
    .stat-icon.green { background: var(--green-soft); }
    .stat-icon.blue { background: var(--blue-soft); }
    .stat-icon.orange { background: var(--orange-soft); }
    .stat-trend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .stat-trend.up { background: var(--red-soft); color: var(--red); }
    .stat-trend.down { background: var(--green-soft); color: var(--green); }
    .stat-value { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; margin-bottom: 6px; }
    .stat-value.gradient { background: linear-gradient(135deg, #fff, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: var(--blue); }
    .stat-value.orange { color: var(--orange); }
    .stat-sub { font-size: 12px; color: var(--text3); }

    /* Charts */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; transition: border-color 0.2s; }
    .chart-card:hover { border-color: var(--border2); }
    .chart-card.full-width { grid-column: 1 / -1; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .chart-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .chart-badge { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent2); font-weight: 600; }

    /* Platform List */
    .platform-list { display: flex; flex-direction: column; gap: 14px; }
    .platform-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; transition: background 0.2s; cursor: pointer; }
    .platform-item:hover { background: var(--surface2); }
    .platform-info { min-width: 90px; display: flex; align-items: center; gap: 10px; }
    .platform-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .platform-name { font-size: 14px; font-weight: 600; }
    .platform-bar-container { flex: 1; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; position: relative; }
    .platform-bar { height: 100%; border-radius: 5px; transition: width 1s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden; }
    .platform-bar::after { content:''; position: absolute; top:0;left:0;right:0;bottom:0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
    .platform-stats { min-width: 110px; text-align: right; }
    .platform-tokens { font-weight: 700; font-size: 14px; }
    .platform-cost { font-size: 12px; color: var(--green); font-weight: 600; }
    .platform-pct { font-size: 11px; color: var(--text3); }

    /* Insights Cards */
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; gap: 14px; align-items: flex-start; }
    .insight-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .insight-icon.tip { background: var(--blue-soft); }
    .insight-icon.warn { background: var(--orange-soft); }
    .insight-icon.save { background: var(--green-soft); }
    .insight-content h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .insight-content p { font-size: 13px; color: var(--text2); line-height: 1.5; }

    /* Records Table */
    .records-table { width: 100%; border-collapse: collapse; }
    .records-table th { text-align: left; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .records-table td { padding: 12px 14px; border-bottom: 1px solid rgba(37,37,69,0.5); font-size: 13px; }
    .records-table tr:last-child td { border-bottom: none; }
    .records-table tr { transition: background 0.15s; }
    .records-table tbody tr:hover { background: var(--surface2); }
    .platform-badge { display: inline-block; padding: 3px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
    .cost-cell { color: var(--green); font-weight: 700; }
    .date-cell { color: var(--text3); font-size: 12px; }
    .task-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
    .model-tag { font-size: 11px; color: var(--text3); font-family: 'SF Mono', monospace; background: var(--surface2); padding: 2px 6px; border-radius: 4px; }
    .token-num { font-family: 'SF Mono', monospace; font-weight: 600; font-size: 13px; }

    /* Footer */
    .footer { text-align: center; padding: 30px; color: var(--text3); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }

    @media (max-width: 640px) {
      .header-inner { flex-direction: column; padding: 12px 16px; }
      .main { padding: 16px; }
      .stat-value { font-size: 26px; }
      .welcome-banner { padding: 16px; }
    }

    /* Animate in */
    @keyframes fadeInUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
    .stat-card, .chart-card, .insight-card { animation: fadeInUp 0.5s ease forwards; opacity:0; }
    .stat-card:nth-child(1){animation-delay:0.05s} .stat-card:nth-child(2){animation-delay:0.1s}
    .stat-card:nth-child(3){animation-delay:0.15s} .stat-card:nth-child(4){animation-delay:0.2s}
    .chart-card:nth-child(1){animation-delay:0.25s} .chart-card:nth-child(2){animation-delay:0.3s}
  </style>
</head>
<body>
<div class="bg-glow"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, BarChart, Bar, Legend } = Recharts;

const PLATFORM_COLORS = { 'ChatGPT': '#00d2a0', 'Claude': '#ffb347', 'Gemini': '#64b5f6', 'Trae': '#a29bfe' };
const MODELS = { 'ChatGPT': ['gpt-4o', 'gpt-4-turbo', 'gpt-3.5-turbo'], 'Claude': ['claude-3.5-sonnet', 'claude-3-opus'], 'Gemini': ['gemini-1.5-pro', 'gemini-1.5-flash'], 'Trae': ['trae-default'] };
const TASKS = ['代码重构','文档撰写','Bug 调试','方案设计','数据处理','内容创作','代码审查','API 调试','学习总结','翻译校对','Prompt 优化','架构讨论'];

function seededRandom(seed) { const x = Math.sin(seed) * 10000; return x - Math.floor(x); }

function generateData() {
  const platforms = ['ChatGPT', 'Claude', 'Gemini', 'Trae'];
  const records = []; let id = 1;
  for (let day = 29; day >= 0; day--) {
    const base = 8 + Math.floor(seededRandom(day+1)*10);
    for (let i = 0; i < base; i++) {
      const plat = platforms[Math.floor(seededRandom(day*100+i)*platforms.length)];
      const input = 600 + Math.floor(seededRandom(day*50+i*3)*3800);
      const output = 200 + Math.floor(seededRandom(day*30+i*7)*2000);
      const pricing = { 'ChatGPT':[3,15], 'Claude':[3,15], 'Gemini':[0.15,0.6], 'Trae':[0,0] };
      const [ip,op] = pricing[plat];
      const cost = (input*ip+output*op)/1e6;
      const d = new Date(); d.setDate(d.getDate()-day);
      d.setHours(Math.floor(seededRandom(day*20+i)*24), Math.floor(seededRandom(day*40+i)*60), 0, 0);
      records.push({ id:id++, platform:plat, model:MODELS[plat][Math.floor(seededRandom(day*10+i)*MODELS[plat].length)],
        input_tokens:input, output_tokens:output, total_tokens:input+output, cost:parseFloat(cost.toFixed(6)),
        task_name:TASKS[Math.floor(seededRandom(day*70+i)*TASKS.length)], recorded_at:d.toISOString() });
    }
  }
  return records.sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
}

const ALL_RECORDS = generateData();
const MONTHLY_BUDGET = 10;

const fmt = n => n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toString();
const costFmt = n => '$'+(n||0).toFixed(2);
const relTime = ds => { const d=new Date(ds), diff=Date.now()-d; if(diff<36e5)return Math.floor(diff/6e4)+'分钟前'; if(diff<864e5)return Math.floor(diff/36e5)+'小时前'; return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); };
const inDays = (ds,days) => new Date(ds) >= new Date(Date.now()-days*864e5);
const filter = (recs,p) => { switch(p){case'day':return recs.filter(r=>inDays(r.recorded_at,1));case'week':return recs.filter(r=>inDays(r.recorded_at,7));case'month':return recs.filter(r=>inDays(r.recorded_at,30));default:return recs} };

function CustomTooltip({active,payload,label}) {
  if(!active||!payload||!payload.length) return null;
  return <div style={{background:'#161628',border:'1px solid #252545',borderRadius:'10px',padding:'12px 16px',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
    <p style={{fontSize:12,color:'#9898b8',marginBottom:6}}>{label}</p>
    {payload.map((p,i)=><p key={i} style={{fontSize:13,fontWeight:600,color:p.color}}>{p.name}: {p.name.includes('费用')?costFmt(p.value):fmt(p.value* (p.name.includes('K')?1000:1))}</p>)}
  </div>;
}

export default function App() {
  const [period, setPeriod] = useState('month');
  const records = useMemo(()=>filter(ALL_RECORDS,period),[period]);

  const summary = records.reduce((a,r)=>({total_tokens:a.total_tokens+r.total_tokens,input_tokens:a.input_tokens+r.input_tokens,output_tokens:a.output_tokens+r.output_tokens,total_cost:a.total_cost+r.cost,total_requests:a.total_requests+1}),{total_tokens:0,input_tokens:0,output_tokens:0,total_cost:0,total_requests:0});
  summary.total_cost = parseFloat(summary.total_cost.toFixed(4));
  const monthlyRecs = filter(ALL_RECORDS,'month');
  const monthlyCost = parseFloat(monthlyRecs.reduce((s,r)=>s+r.cost,0).toFixed(4));
  const budgetPct = Math.min((monthlyCost/MONTHLY_BUDGET)*100, 100);
  const budgetOver = monthlyCost > MONTHLY_BUDGET * 0.7;

  const pMap = {};
  records.forEach(r=>{if(!pMap[r.platform])pMap[r.platform]={platform:r.platform,total_tokens:0,cost:0,requests:0,color:PLATFORM_COLORS[r.platform]};pMap[r.platform].total_tokens+=r.total_tokens;pMap[r.platform].cost+=r.cost;pMap[r.platform].requests+=1});
  const byPlatform = Object.values(pMap).map(p=>({...p,cost:parseFloat(p.cost.toFixed(4))})).sort((a,b)=>b.total_tokens-a.total_tokens);

  const dMap = {};
  records.forEach(r=>{const d=r.recorded_at.split('T')[0];if(!dMap[d])dMap[d]={date:d,tokens:0,cost:0};dMap[d].tokens+=r.total_tokens;dMap[d].cost+=r.cost});
  const trend = Object.values(dMap).map(d=>({...d,cost:parseFloat(d.cost.toFixed(4)),tokensK:d.tokens/1000,date:d.date.slice(5)})).sort((a,b)=>a.date.localeCompare(b.date));

  const maxT = Math.max(...byPlatform.map(x=>x.total_tokens));
  const pieData = byPlatform.map(p=>({name:p.platform,value:p.total_tokens,color:p.color}));
  const topPlat = byPlatform[0];
  const cheapestPlat = [...byPlatform].sort((a,b)=>(a.cost/a.total_tokens)-(b.cost/b.total_tokens))[0];

  return (
    <div>
      <header className="header">
        <div className="header-inner">
          <div className="logo">
            <div className="logo-icon">T</div>
            <div className="logo-text"><h1>Token 账本</h1><p>AI 用量可视化管理</p></div>
          </div>
          <div className="header-actions">
            <div className="period-selector">
              {[{k:'day',l:'今日'},{k:'week',l:'本周'},{k:'month',l:'本月'},{k:'all',l:'全部'}].map(p=><button key={p.k} className={`period-btn ${period===p.k?'active':''}`} onClick={()=>setPeriod(p.k)}>{p.l}</button>)}
            </div>
            <span className="demo-badge"><span className="live-dot"></span>Demo 演示版</span>
          </div>
        </div>
      </header>
      <main className="main">
        <div className="welcome-banner">
          <div className="welcome-text">
            <h2>👋 欢迎回来！这是你的 AI 消费概览</h2>
            <p>已持续追踪你的 AI 用量 30 天，下面是{period==='day'?'今日':period==='week'?'本周':period==='month'?'本月':'全部'}的统计数据</p>
          </div>
          <div className="budget-display">
            <div className="budget-bar-wrap"><div className={`budget-bar ${budgetOver?'warning':''}`} style={{width:budgetPct+'%'}}></div></div>
            <div className="budget-info">
              <div className="budget-label">本月预算</div>
              <div className="budget-value">${monthlyCost.toFixed(2)} / ${MONTHLY_BUDGET}</div>
            </div>
          </div>
        </div>

        <div className="stats-grid">
          <div className="stat-card">
            <div className="stat-header">
              <div className="stat-label"><div className="stat-icon purple">📊</div>总 Token 消耗</div>
              <span className="stat-trend up">+12.5%</span>
            </div>
            <div className="stat-value gradient">{fmt(summary.total_tokens)}</div>
            <div className="stat-sub">输入 {fmt(summary.input_tokens)} · 输出 {fmt(summary.output_tokens)}</div>
          </div>
          <div className="stat-card">
            <div className="stat-header">
              <div className="stat-label"><div className="stat-icon green">💰</div>总费用</div>
              <span className="stat-trend up">+8.3%</span>
            </div>
            <div className="stat-value green">{costFmt(summary.total_cost)}</div>
            <div className="stat-sub">平均每次 ${(summary.total_cost/Math.max(summary.total_requests,1)).toFixed(4)}</div>
          </div>
          <div className="stat-card">
            <div className="stat-header">
              <div className="stat-label"><div className="stat-icon blue">🔢</div>请求次数</div>
              <span className="stat-trend up">+15.2%</span>
            </div>
            <div className="stat-value blue">{summary.total_requests}</div>
            <div className="stat-sub">平均每次 {fmt(Math.round(summary.total_tokens/Math.max(summary.total_requests,1)))}</div>
          </div>
          <div className="stat-card">
            <div className="stat-header">
              <div className="stat-label"><div className="stat-icon orange">🤖</div>活跃平台</div>
              <span className="stat-trend down">→</span>
            </div>
            <div className="stat-value orange">{byPlatform.length}</div>
            <div className="stat-sub">{byPlatform.map(p=>p.platform).join(' · ')}</div>
          </div>
        </div>

        <div className="insights-grid">
          <div className="insight-card">
            <div className="insight-icon tip">💡</div>
            <div className="insight-content">
              <h4>使用洞察</h4>
              <p>你最常用的平台是 <b style={{color:topPlat?.color}}>{topPlat?.platform}</b>，占总用量的 <b>{Math.round(topPlat?.total_tokens/summary.total_tokens*100)}%</b></p>
            </div>
          </div>
          <div className="insight-card">
            <div className="insight-icon save">✅</div>
            <div className="insight-content">
              <h4>成本优化建议</h4>
              <p><b style={{color:cheapestPlat?.color}}>{cheapestPlat?.platform}</b> 性价比最高，简单任务可优先使用，预计可节省 20% 费用</p>
            </div>
          </div>
          <div className="insight-card">
            <div className="insight-icon warn">⚠️</div>
            <div className="insight-content">
              <h4>预算提醒</h4>
              <p>本月预算已使用 <b style={{color:budgetOver?'var(--orange)':'var(--green)'}}>{budgetPct.toFixed(0)}%</b>，{budgetOver?'建议控制非必要使用':'预算状态健康'}</p>
            </div>
          </div>
        </div>

        <div className="charts-grid">
          <div className="chart-card full-width">
            <div className="chart-header"><span className="chart-title">📈 用量趋势</span><span className="chart-badge">30 天</span></div>
            <div style={{width:'100%',height:260}}>
              <ResponsiveContainer>
                <AreaChart data={trend} margin={{top:5,right:20,left:0,bottom:5}}>
                  <defs><linearGradient id="g1" x1="0"y1="0"x2="0"y2="1"><stop offset="0%"stopColor="#7c6cff"stopOpacity={0.25}/><stop offset="100%"stopColor="#7c6cff"stopOpacity={0}/></linearGradient></defs>
                  <CartesianGrid strokeDasharray="3 6" stroke="#1c1c36" vertical={false}/>
                  <XAxis dataKey="date" stroke="#606080" fontSize={11} tickLine={false} axisLine={false}/>
                  <YAxis stroke="#606080" fontSize={11} tickLine={false} axisLine={false} tickFormatter={v=>(v/1).toFixed(0)+'K'}/>
                  <Tooltip content={<CustomTooltip/>}/>
                  <Area type="monotone" dataKey="tokensK" name="Token 用量 (K)" stroke="#7c6cff" strokeWidth={2.5} fill="url(#g1)" isAnimationActive={true} animationDuration={1200}/>
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>
          <div className="chart-card">
            <div className="chart-header"><span className="chart-title">🥧 平台分布</span></div>
            <div style={{width:'100%',height:240,display:'flex',alignItems:'center'}}>
              <ResponsiveContainer>
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={55} outerRadius={90} paddingAngle={3} dataKey="value" strokeWidth={0} animationDuration={1000}>
                    {pieData.map((e,i)=><Cell key={i} fill={e.color}/>)}
                  </Pie>
                  <Tooltip contentStyle={{background:'#161628',border:'1px solid #252545',borderRadius:'10px',color:'#eeedf5',fontSize:13}} formatter={(v,n)=>[fmt(v)+' tokens',n]}/>
                </PieChart>
              </ResponsiveContainer>
            </div>
            <div style={{display:'flex',justifyContent:'center',gap:'18px',flexWrap:'wrap',marginTop:'8px'}}>
              {pieData.map(p=><div key={p.name} style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'12px'}}><div style={{width:'8px',height:'8px',borderRadius:'50%',background:p.color,boxShadow:`0 0 6px ${p.color}`}}></div><span style={{color:'#9898b8',fontWeight:500}}>{p.name}</span></div>)}
            </div>
          </div>
          <div className="chart-card">
            <div className="chart-header"><span className="chart-title">📊 平台用量对比</span></div>
            <div className="platform-list">
              {byPlatform.map((p,i)=>(
                <div key={p.platform} className="platform-item">
                  <div className="platform-info"><div className="platform-dot" style={{background:p.color,color:p.color}}></div><span className="platform-name">{p.platform}</span></div>
                  <div className="platform-bar-container"><div className="platform-bar" style={{width:(p.total_tokens/maxT*100)+'%',background:`linear-gradient(90deg, ${p.color}, ${p.color}88)`}}></div></div>
                  <div className="platform-stats">
                    <div className="platform-tokens">{fmt(p.total_tokens)}</div>
                    <div className="platform-cost">{costFmt(p.cost)}</div>
                    <div className="platform-pct">{Math.round(p.total_tokens/summary.total_tokens*100)}%</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-header"><span className="chart-title">📋 最近使用记录</span><span className="chart-badge">最新 20 条</span></div>
          <div style={{overflowX:'auto'}}>
            <table className="records-table">
              <thead><tr><th>平台</th><th>模型</th><th>任务</th><th>Token</th><th>费用</th><th>时间</th></tr></thead>
              <tbody>
                {ALL_RECORDS.slice(0,20).map(r=>(
                  <tr key={r.id}>
                    <td><span className="platform-badge" style={{background:PLATFORM_COLORS[r.platform]+'22',color:PLATFORM_COLORS[r.platform]}}>{r.platform}</span></td>
                    <td><span className="model-tag">{r.model}</span></td>
                    <td className="task-cell" title={r.task_name}>{r.task_name}</td>
                    <td className="token-num">{fmt(r.total_tokens)}</td>
                    <td className="cost-cell">{costFmt(r.cost)}</td>
                    <td className="date-cell">{relTime(r.recorded_at)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </main>
      <div className="footer">Token 账本 — 由 TRAE Work 全栈开发 · Chrome 扩展 + Web 仪表盘 · Demo 演示版</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
