  --ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1);
  --r:6px;--rs:4px;--rl:10px;--rx:14px;
}

html,body{height:100%;overflow:hidden}

/* ═══════════════════ WELCOME ═══════════════════ */
#welcome{justify-content:center;align-items:center;overflow:hidden}

/* Subtle grain overlay */
#welcome::before{content:'';position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

/* Horizontal grid lines for "studio" feel */
.w-bg .grid{position:absolute;inset:0;background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 80px;opacity:.3}

.wc{position:relative;z-index:1;text-align:center;max-width:480px;padding:0 2rem}

.wc-logo{display:inline-flex;align-items:center;gap:.6rem;margin-bottom:3rem;opacity:0;animation:riseIn .7s var(--bounce) .15s forwards}
.wc-logo .ico{width:40px;height:40px;background:var(--accent);border-radius:var(--r);display:grid;place-items:center;box-shadow:0 0 32px var(--a20)}

.wc-logo .name{font-family:var(--f);font-size:1.3rem;font-weight:700;letter-spacing:-.03em}

.wc h1{font-family:var(--f);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.12;letter-spacing:-.04em;margin-bottom:.7rem;opacity:0;animation:riseIn .7s var(--bounce) .3s forwards}
.wc h1 em{font-style:normal;color:var(--accent)}

.wc .sub{font-size:.95rem;color:var(--ink2);line-height:1.65;margin-bottom:2.5rem;opacity:0;animation:riseIn .6s ease .45s forwards;max-width:380px;margin-left:auto;margin-right:auto}

.wc-acts{opacity:0;animation:riseIn .6s ease .6s forwards}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.5rem;border-radius:100px;font-size:.85rem;font-weight:600;transition:all .2s var(--ease);white-space:nowrap;text-decoration:none}
.btn-p{background:var(--accent);color:var(--bg);box-shadow:0 0 20px var(--a10),0 2px 8px rgba(0,0,0,.3)}

.btn-p:active{transform:translateY(0) scale(.98)}
.btn-o{border:1px solid var(--rule2);color:var(--ink2)}
.btn-o:hover{border-color:var(--muted);color:var(--ink);background:var(--s2)}

.wc-metrics{display:flex;gap:3rem;justify-content:center;margin-top:3.5rem;opacity:0;animation:riseIn .6s ease .8s forwards}
.wm{text-align:center}
.wm .val{font-family:var(--f);font-size:1.6rem;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.02em}
.wm .lbl{font-size:.68rem;color:var(--muted);margin-top:.2rem;letter-spacing:.02em}

/* ═══════════════════ TOPBAR ═══════════════════ */
.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;border-bottom:1px solid var(--rule);flex-shrink:0;background:var(--s1);backdrop-filter:blur(12px)}
.tb-l{display:flex;align-items:center;gap:.5rem}

.tb-tabs button:hover{color:var(--ink2)}
.tb-tabs button.on{color:var(--accent);background:var(--a10)}
.tb-r{display:flex;align-items:center;gap:.4rem}
.rec-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .2s}
.rec-dot.on{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tb-status{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ═══════════════════ PRACTICE LAYOUT ═══════════════════ */
.prac{flex:1;display:flex;overflow:hidden}

/* ── LEFT: TELEPROMPTER ── */
.tp{width:25%;min-width:240px;max-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--s1)}
.tp-head{padding:.65rem .85rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.tp-head h3{font-family:var(--f);font-size:.72rem;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:.3rem;letter-spacing:-.01em}
.tp-head .live-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 2s ease infinite}
.tp-head .mode-toggle{display:flex;gap:1px;background:var(--s3);border-radius:var(--rs);padding:1px}
.tp-head .mode-toggle button{padding:.15rem .5rem;border-radius:3px;font-size:.62rem;font-weight:500;color:var(--muted);transition:all .15s}
.tp-head .mode-toggle button.on{background:var(--s4);color:var(--ink2)}

.tp-list{flex:1;overflow-y:auto;padding:.6rem}
.tp-sec{padding:.6rem .7rem;border-radius:var(--r);border-left:2px solid var(--rule);margin-bottom:.35rem;transition:all .25s var(--ease);opacity:.35}
.tp-sec.active{opacity:1;border-left-color:var(--accent);background:var(--a10)}
.tp-sec.done{opacity:.2}
.tp-sec .sec-lbl{font-family:var(--mo);font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem}
.tp-sec .kw-row{display:flex;flex-wrap:wrap;gap:3px}

.kw{padding:.12rem .45rem;border-radius:100px;font-size:.72rem;font-weight:500;color:var(--ink2);background:var(--s2);border:1px solid var(--rule);transition:all .2s var(--ease);cursor:pointer;line-height:1.4}
.kw:hover{border-color:var(--accent);color:var(--ink)}
.tp-sec.active .kw{border-color:var(--rule2)}
.kw.spoken{border-color:var(--accent);background:var(--a10);color:var(--accent)}
.kw.open{border-color:var(--blue);background:var(--b10);color:var(--blue)}

/* Expandable hints */
.kw-hints{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s var(--ease),opacity .25s ease,margin .25s ease;margin:0}
.kw-hints.show{max-height:180px;opacity:1;margin:.25rem 0 .15rem}
.kw-hints ul{list-style:none;padding:.3rem .5rem;background:var(--s2);border-radius:var(--rs);border:1px solid var(--rule)}
.kw-hints li{font-size:.67rem;color:var(--ink2);padding:.12rem 0;line-height:1.45;display:flex;align-items:flex-start;gap:.25rem}
.kw-hints li::before{content:'→';color:var(--muted);font-size:.6rem;flex-shrink:0;margin-top:1px}

/* Teleprompter progress */
.tp-foot{padding:.4rem .85rem;border-top:1px solid var(--rule);display:flex;align-items:center;gap:.5rem}
.tp-foot .p-lbl{font-size:.6rem;color:var(--muted);white-space:nowrap;min-width:2.2em}
.p-track{flex:1;height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.p-fill{height:100%;width:0%;background:var(--accent);border-radius:1px;transition:width .5s var(--ease)}
.p-pct{font-size:.6rem;color:var(--accent);font-family:var(--mo);min-width:2.2em;text-align:right}

/* ── CENTER: WORKSPACE ── */
.ws{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}

/* Recording indicator line */
.rec-bar{height:2px;background:var(--s1);flex-shrink:0;transition:all .3s}
.rec-bar.on{background:linear-gradient(90deg,var(--red),var(--amber),var(--red));background-size:200% 100%;animation:recShift 3s linear infinite}
@keyframes recShift{0%{background-position:0% 0%}100%{background-position:200% 0%}}

/* Waveform area */
.wf-wrap{height:80px;border-bottom:1px solid var(--rule);position:relative;overflow:hidden;background:var(--s1)}
#waveCanvas{width:100%;height:100%;display:block}
.wf-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wf-timer{font-family:var(--f);font-size:1.6rem;font-weight:700;color:var(--ink);letter-spacing:.04em;text-shadow:0 2px 20px rgba(0,0,0,.85)}
.wf-timer .ms{font-size:.85rem;color:var(--muted);font-weight:500}

/* Speech area */
.speech-area{flex:1;padding:.8rem 1rem;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.sp-line{font-size:15px;line-height:1.9;color:var(--ink2);min-height:1.4em;position:relative;margin-bottom:6px;opacity:.88}
.sp-line:last-child{opacity:1}

/* Character animations */
.sp-line .c{display:inline;opacity:0;animation:cIn .3s ease-out both}
@keyframes cIn{from{opacity:0;filter:blur(3px);transform:translateY(4px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.sp-line .c.red{color:var(--red);font-weight:600;background:var(--r10);padding:0 1.5px;border-radius:3px;animation:cFlash .6s ease-out forwards;box-shadow:0 0 8px var(--r40)}
@keyframes cFlash{0%{opacity:0;filter:blur(3px);background:var(--red);color:#fff;transform:scale(1.15) translateY(4px)}25%{opacity:1;filter:blur(0);transform:scale(1.05) translateY(0)}50%{transform:scale(1)}100%{opacity:1;transform:scale(1);background:var(--r10);box-shadow:0 0 8px var(--r40)}}
.sp-line .c.green{color:var(--accent);font-weight:600;animation:cIn .3s ease-out both}
.sp-line .cur{display:inline-block;width:1.5px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:1px;animation:cursorBlink 1s step-end infinite;border-radius:1px}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* Idle state */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:var(--muted);user-select:none}
.idle svg{opacity:.15;stroke-width:1.2}
.idle span{opacity:.35;font-size:.82rem}

/* Pause reminder */
.pause-tip{display:none;align-items:center;gap:.4rem;padding:.3rem .65rem;background:var(--a10);border:1px solid rgba(0,232,156,.1);border-radius:var(--rs);font-size:.7rem;color:var(--accent);margin-top:.15rem;animation:breathe 2.5s ease-in-out infinite}
.pause-tip.show{display:inline-flex}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

/* Bottom control bar */
.ctrl-bar{height:52px;border-top:1px solid var(--rule);background:var(--s1);display:flex;align-items:center;justify-content:center;gap:.6rem;flex-shrink:0}
.btn-rec{height:36px;padding:0 1.4rem;border-radius:100px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.35rem;transition:all .2s var(--ease)}
.btn-rec svg{width:14px;height:14px}
.btn-rec.idle-state{background:var(--accent);color:var(--bg);box-shadow:0 0 16px var(--a10)}
.btn-rec.idle-state:hover{box-shadow:0 0 28px var(--a20);transform:translateY(-1px)}
.btn-rec.rec-state{background:var(--amber);color:var(--bg);box-shadow:0 0 16px var(--am10)}
.btn-rec.rec-state:hover{box-shadow:0 0 24px rgba(240,160,48,.2)}
.btn-stop{height:36px;padding:0 1rem;border-radius:100px;border:1px solid var(--rule2);color:var(--muted);font-size:.78rem;font-weight:500;display:none;align-items:center;gap:.3rem;transition:all .2s var(--ease)}
.btn-stop:hover{border-color:var(--red);color:var(--red);background:var(--r10)}
.btn-stop svg{width:12px;height:12px}

/* ── RIGHT: FEEDBACK ── */
.fp{width:230px;min-width:200px;border-left:1px solid var(--rule);background:var(--s1);display:flex;flex-direction:column;overflow-y:auto}
.fp-sec{padding:.75rem .8rem;border-bottom:1px solid var(--rule)}

.sug{padding:.5rem .6rem;border-radius:var(--r);font-size:.75rem;line-height:1.5;transition:all .35s var(--ease);min-height:2.2rem;display:flex;align-items:center;border-left:2.5px solid var(--accent);background:var(--a10);color:var(--ink2)}
.sug.warn{border-left-color:var(--amber);background:var(--am10)}

.sug.info{border-left-color:var(--blue);background:var(--b10)}
.sug.struct{border-left-color:var(--blue);background:var(--b10)}
.sug.empty{font-size:.72rem;color:var(--muted);opacity:.4;justify-content:center;border-left-color:var(--rule);background:none}

.cw-list{display:flex;flex-direction:column;gap:2px}

.cw-item .cw-word{color:var(--ink2);font-weight:500;min-width:2.8em}
.cw-item .cw-track{flex:1;height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.cw-item .cw-bar{height:100%;background:var(--red);border-radius:1px;transition:width .4s var(--ease)}
.cw-item .cw-count{font-family:var(--mo);font-size:.68rem;color:var(--red);font-weight:600;min-width:1.2em;text-align:right}
.cw-none{font-size:.68rem;color:var(--muted);opacity:.35;padding:.4rem 0;text-align:center}

/* Structure progress */
.struct-bar{display:flex;gap:2px;align-items:center}
.struct-step{flex:1;height:3px;border-radius:2px;background:var(--s3);transition:all .3s var(--ease)}
.struct-step.done{background:var(--accent)}
.struct-step.current{background:var(--accent);box-shadow:0 0 6px var(--a20);animation:stepPulse 1.5s ease infinite}
@keyframes stepPulse{0%,100%{box-shadow:0 0 4px var(--a10)}50%{box-shadow:0 0 10px var(--a20)}}
.struct-labels{display:flex;justify-content:space-between;margin-top:.2rem}
.struct-labels span{font-size:.5rem;color:var(--muted);flex:1;text-align:center}

.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.score-item{padding:.35rem .4rem;border-radius:var(--rs);background:var(--s2)}
.score-item .s-label{font-size:.56rem;color:var(--muted);margin-bottom:.05rem}
.score-item .s-val{font-family:var(--f);font-size:.9rem;font-weight:700;letter-spacing:-.02em}
.score-item .s-val.good{color:var(--accent)}
.score-item .s-val.mid{color:var(--amber)}
.score-item .s-val.bad{color:var(--red)}

/* ═══════════════════ REVIEW ═══════════════════ */
#review{background:var(--bg)}
.rv-body{flex:1;overflow-y:auto;padding:1.5rem;max-width:820px;margin:0 auto;width:100%}
.rv-header{margin-bottom:1.8rem}

.rv-header p{color:var(--muted);font-size:.82rem}

.rv-radar{display:flex;gap:1.5rem;align-items:center;margin-bottom:1.8rem;flex-wrap:wrap}
#radarCanvas{width:240px;height:240px;flex-shrink:0}
.rv-legend{flex:1;min-width:160px}
.lg-row{display:flex;align-items:center;gap:.45rem;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.lg-row:last-child{border-bottom:none}
.lg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.lg-label{font-size:.78rem;color:var(--ink2);flex:1}
.lg-score{font-family:var(--f);font-weight:700;font-size:.85rem}

.rv-cw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.4rem;margin-bottom:1.8rem}
.rv-cw-card{padding:.6rem .7rem;border-radius:var(--r);background:var(--s2);border:1px solid var(--rule)}
.rv-cw-card .cw-word{font-weight:600;font-size:.88rem;color:var(--red);margin-bottom:.1rem}
.rv-cw-card .cw-track{height:2px;background:var(--rule);border-radius:1px;margin:.25rem 0;overflow:hidden}
.rv-cw-card .cw-fill{height:100%;background:var(--red);border-radius:1px;transition:width 1s var(--ease)}
.rv-cw-card .cw-meta{display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted)}

.rv-transcript{margin-bottom:1.8rem}
.rv-transcript h3{font-family:var(--f);font-size:.88rem;font-weight:600;margin-bottom:.6rem}
.tr-line{padding:.4rem .6rem;border-radius:var(--rs);font-size:.82rem;line-height:1.6;color:var(--ink2);border-left:2px solid var(--rule);margin-bottom:1px}
.tr-line .tg{color:var(--accent);font-weight:500;background:var(--a10);padding:0 2px;border-radius:2px}
.tr-line .tr{color:var(--red);font-weight:600;background:var(--r10);padding:0 2px;border-radius:2px}

.rv-trend{margin-bottom:1.8rem}
.rv-trend h3{font-family:var(--f);font-size:.88rem;font-weight:600;margin-bottom:.6rem}
#trendCanvas{width:100%;height:110px;border-radius:var(--r);background:var(--s2);border:1px solid var(--rule)}

.rv-ai{padding:.8rem 1rem;border-radius:var(--rl);background:var(--s2);border:1px solid var(--rule);margin-bottom:1.2rem}
.rv-ai .ai-head{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem}
.rv-ai .ai-icon{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center}
.rv-ai .ai-icon svg{width:9px;height:9px}
.rv-ai .ai-head span{font-family:var(--f);font-weight:600;font-size:.82rem}
.rv-ai ul{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.rv-ai li{font-size:.78rem;color:var(--ink2);line-height:1.5;padding-left:.7rem;position:relative}
.rv-ai li::before{content:'';position:absolute;left:0;top:.45rem;width:3px;height:3px;border-radius:50%}
.rv-ai li.g::before{background:var(--accent)}.rv-ai li.r::before{background:var(--red)}.rv-ai li.b::before{background:var(--blue)}

.rv-actions{display:flex;gap:.5rem;justify-content:center;padding:1rem 0}

/* ═══════════════════ REVIEW MODULES ═══════════════════ */

/* Module 1: Core Insights */
.mod-insight{padding:1rem 1.2rem;border-radius:var(--rl);background:var(--s2);border:1px solid var(--rule);margin-bottom:1.2rem}
.mod-insight h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;color:var(--ink);letter-spacing:-.01em}
.ins-list{display:flex;flex-direction:column;gap:.55rem}
.ins-item{font-size:.82rem;line-height:1.7;color:var(--ink2);padding:.3rem 0;padding-left:1.2rem;position:relative}
.ins-item::before{content:'›';position:absolute;left:0;color:var(--accent);font-weight:700;font-size:1rem;top:-1px}
.ins-item .ins-hl{color:var(--red);font-weight:600}
.ins-item .ins-num{color:var(--accent);font-weight:600;font-family:var(--mo)}

/* Module 2: Sentence Analysis */
.mod-sent{margin-bottom:1.2rem}
.mod-sent h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;letter-spacing:-.01em}
.sent-card{padding:.7rem .9rem;border-radius:var(--r);background:var(--s2);border:1px solid var(--rule);margin-bottom:.5rem}
.sent-original{font-size:.85rem;line-height:1.7;color:var(--ink);margin-bottom:.35rem}
.sent-original .sw{color:var(--red);font-weight:600;background:var(--r10);padding:0 2px;border-radius:2px}
.sent-arrow{font-size:.8rem;color:var(--muted);margin-bottom:.2rem}
.sent-suggest{font-size:.82rem;line-height:1.6;color:var(--accent);margin-bottom:.3rem;padding-left:.6rem;border-left:2px solid var(--accent)}
.sent-tags{display:flex;flex-wrap:wrap;gap:.25rem}
.sent-tag{font-size:.62rem;padding:.1rem .4rem;border-radius:3px;font-weight:500}
.sent-tag.fill{background:var(--am10);color:var(--amber);border:1px solid rgba(240,160,48,.15)}
.sent-tag.vague{background:var(--b10);color:var(--blue);border:1px solid rgba(56,128,255,.15)}
.sent-tag.struct{background:var(--a10);color:var(--accent);border:1px solid rgba(0,232,156,.15)}

/* Module 3: Word Replacement */
.mod-replace{margin-bottom:1.2rem}
.mod-replace h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;letter-spacing:-.01em}
.replace-table{width:100%;border-collapse:collapse;font-size:.8rem}
.replace-table th{text-align:left;padding:.4rem .6rem;color:var(--muted);font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--rule)}
.replace-table td{padding:.45rem .6rem;border-bottom:1px solid var(--rule);color:var(--ink2)}
.replace-table td .bad{color:var(--red);font-weight:600}
.replace-table td .good{color:var(--accent);font-weight:600}
.replace-table td .alt{color:var(--muted);font-size:.75rem}

/* Module 4: Behavior Pattern */
.mod-behavior{margin-bottom:1.2rem}
.mod-behavior h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;letter-spacing:-.01em}
.bh-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.bh-card{padding:.7rem .8rem;border-radius:var(--r);background:var(--s2);border:1px solid var(--rule)}
.bh-card h4{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.bh-card .bh-val{font-family:var(--f);font-size:1.6rem;font-weight:800;margin-bottom:.15rem;letter-spacing:-.02em}
.bh-card .bh-val.good{color:var(--accent)}
.bh-card .bh-val.mid{color:var(--amber)}
.bh-card .bh-val.bad{color:var(--red)}
.bh-card .bh-desc{font-size:.72rem;color:var(--ink2);line-height:1.5}
.bh-card .bh-desc strong{color:var(--ink);font-weight:600}
.bh-card .bh-desc .bh-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.62rem;font-weight:500;margin-top:.2rem}
.bh-card .bh-desc .bh-tag.fill{background:var(--am10);color:var(--amber)}
.bh-card .bh-desc .bh-tag.conflict{background:var(--r10);color:var(--red)}
.bh-card .bh-desc .bh-tag.indirect{background:var(--b10);color:var(--blue)}

/* Module 5: Practice Focus */
.mod-focus{margin-bottom:1.2rem}
.mod-focus h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;letter-spacing:-.01em}
.focus-list{display:flex;flex-direction:column;gap:.4rem}
.focus-item{padding:.6rem .8rem;border-radius:var(--r);background:var(--s2);border:1px solid var(--rule);display:flex;gap:.6rem;align-items:flex-start}
.focus-num{font-family:var(--f);font-size:1.1rem;font-weight:800;color:var(--accent);flex-shrink:0;min-width:1.4rem}
.focus-body{flex:1}
.focus-title{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:.15rem}
.focus-why{font-size:.75rem;color:var(--ink2);line-height:1.55}
.focus-why strong{color:var(--red);font-weight:600}

/* Module 6: Score Calculation */
.mod-score{margin-bottom:1.2rem}
.mod-score h3{font-family:var(--f);font-size:.85rem;font-weight:600;margin-bottom:.7rem;letter-spacing:-.01em}
.score-big{display:flex;align-items:center;gap:1.2rem;padding:1rem 1.2rem;border-radius:var(--rl);background:var(--s2);border:1px solid var(--rule);margin-bottom:.8rem}
.score-ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.score-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring-wrap circle{fill:none;stroke-width:5;stroke-linecap:round}
.score-ring-wrap .bg{stroke:var(--s4)}
.score-ring-wrap .fg{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
.score-ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring-val .val{font-family:var(--f);font-size:1.6rem;font-weight:800;line-height:1}
.score-ring-val .lbl{font-size:.55rem;color:var(--muted);margin-top:1px}
.score-grade{font-family:var(--f);font-size:2rem;font-weight:800;letter-spacing:-.02em}
.score-grade.A{color:var(--accent)}
.score-grade.B{color:var(--amber)}
.score-grade.C{color:var(--red)}
.score-breakdown{flex:1}
.sc-row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.76rem;color:var(--ink2);border-bottom:1px solid var(--rule)}
.sc-row:last-child{border-bottom:none}
.sc-row .sc-name{flex:1}

.sc-row .sc-val.neg{color:var(--red)}
.sc-row .sc-val.pos{color:var(--accent)}
.sc-formula{margin-top:.5rem;padding:.4rem .6rem;border-radius:var(--rs);background:var(--s1);font-size:.7rem;color:var(--muted);font-family:var(--mo);line-height:1.6}

/* ═══════════════════ SCREEN TRANSITIONS ═══════════════════ */
function switchTo(fromId, toId) {
  const from = document.getElementById(fromId);
  const to = document.getElementById(toId);
  from.classList.remove('on');
  from.classList.add('out');
  setTimeout(() => from.classList.remove('out'), 450);
  setTimeout(() => to.classList.add('on'), 80);
  ST.screen = toId;
}

/* ═══════════════════ WELCOME → PRACTICE ═══════════════════ */

/* ═══════════════════ TELEPROMPTER ═══════════════════ */
function buildTeleprompter() {
  const el = document.getElementById('tpList');
  el.innerHTML = '';
  SECTIONS.forEach((sec, i) => {
    const div = document.createElement('div');
    div.className = 'tp-sec' + (i === 0 ? ' active' : '');
    div.id = 'sec' + i;
    const kwHTML = sec.kw.map(k =>
      `<span class="kw" id="kw_${i}_${k}" data-sec="${i}" data-kw="${k}" onclick="toggleKwHint(this)">${k}</span>`
    ).join('');
    div.innerHTML = `<div class="sec-lbl">${sec.label}</div><div class="kw-row">${kwHTML}</div><div class="kw-hints" id="hints_${i}"></div>`;
    el.appendChild(div);
  });
}

function toggleKwHint(el) {
  const secIdx = el.dataset.sec;
  const kw = el.dataset.kw;
  const hintsDiv = document.getElementById('hints_' + secIdx);
  const hints = SECTIONS[secIdx].hints[kw];
  if (!hints) return;

  // Close others in same section
  el.closest('.tp-sec').querySelectorAll('.kw.open').forEach(k => {
    if (k !== el) {
      k.classList.remove('open');
      const hd = document.getElementById('hints_' + k.dataset.sec);
      if (hd) hd.classList.remove('show');
    }
  });

  el.classList.toggle('open');
  hintsDiv.classList.toggle('show');
  if (hintsDiv.classList.contains('show')) {
    hintsDiv.innerHTML = '<ul>' + hints.map(h => `<li>${h}</li>`).join('') + '</ul>';
  }
}

/* ═══════════════════ RECORDING CONTROLS ═══════════════════ */
function handleMain() {
  if (!ST.rec) startRecording();
  else if (!ST.pau) pauseRecording();
  else resumeRecording();
}

function startRecording() {
  ST.rec = true; ST.pau = false;
  ST.tm = 0; ST.curSec = 0; ST.structStep = 0;
  ST.lines = []; ST.simIdx = 0; ST.cw = {}; ST.typing = false;

  // Remove idle
  const idle = document.getElementById('idleState');
  if (idle) idle.remove();

  // Button → pause state
  const btn = document.getElementById('mainBtn');
  btn.className = 'btn-rec rec-state';
  document.getElementById('mainIco').innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  document.getElementById('mainLbl').textContent = '暂停';
  document.getElementById('stopBtn').style.display = 'flex';

  // Status
  document.getElementById('recDot').classList.add('on');
  document.getElementById('statusTxt').textContent = '直播中';
  document.getElementById('statusTxt').style.color = 'var(--red)';
  document.getElementById('fbDot').classList.add('on');
  document.getElementById('recBar').classList.add('on');

  // Reset panels
  document.getElementById('cwList').innerHTML = '<div class="cw-none">暂无</div>';
  buildTeleprompter(); buildStructBar(); buildScoreGrid();

  // Start timer
  ST.tmI = setInterval(() => { ST.tm += 10; updateTimer(); }, 10);

  // Start waveform & simulation
  startWaveform();
  typeLine(0);
}

function pauseRecording() {
  ST.pau = true;
  if (ST.simTO) clearTimeout(ST.simTO);
  clearInterval(ST.tmI);
  stopWaveform();
  ST.typing = false;

  const btn = document.getElementById('mainBtn');
  btn.className = 'btn-rec idle-state';
  document.getElementById('mainIco').innerHTML = '<polygon points="6 3 20 12 6 21"/>';
  document.getElementById('mainLbl').textContent = '继续';

  document.getElementById('recDot').classList.remove('on');
  document.getElementById('statusTxt').textContent = '已暂停';
  document.getElementById('statusTxt').style.color = 'var(--amber)';
  document.getElementById('fbDot').classList.remove('on');
  document.getElementById('recBar').classList.remove('on');

  // Remove cursor
  document.querySelectorAll('.cur').forEach(c => c.remove());
}

function resumeRecording() {
  ST.pau = false;
  ST.tmI = setInterval(() => { ST.tm += 10; updateTimer(); }, 10);
  startWaveform();

  const btn = document.getElementById('mainBtn');
  btn.className = 'btn-rec rec-state';
  document.getElementById('mainIco').innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  document.getElementById('mainLbl').textContent = '暂停';

  document.getElementById('recDot').classList.add('on');
  document.getElementById('statusTxt').textContent = '直播中';
  document.getElementById('statusTxt').style.color = 'var(--red)';
  document.getElementById('fbDot').classList.add('on');
  document.getElementById('recBar').classList.add('on');

  updateSuggestion({type:'info', text:'继续直播...'});

  // Re-add cursor to last line
  const lastLine = document.querySelector('.speech-area .sp-line:last-child');
  if (lastLine) {
    const cur = document.createElement('span');
    cur.className = 'cur';
    lastLine.appendChild(cur);
  }
  typeLine(ST.simIdx);
}

function stopPractice() {
  ST.rec = false; ST.pau = false;
  clearInterval(ST.tmI);
  if (ST.simTO) clearTimeout(ST.simTO);
  stopWaveform();
  document.querySelectorAll('.cur').forEach(c => c.remove());

  document.getElementById('recDot').classList.remove('on');
  document.getElementById('statusTxt').textContent = '待机';
  document.getElementById('statusTxt').style.color = 'var(--muted)';
  document.getElementById('fbDot').classList.remove('on');
  document.getElementById('recBar').classList.remove('on');

  buildReview();
  switchTo('practice', 'review');
}

function updateTimer() {
  const m = Math.floor(ST.tm / 6000);
  const s = Math.floor((ST.tm % 6000) / 100);
  const ms = ST.tm % 100;
  document.getElementById('tMin').textContent = String(m).padStart(2, '0');
  document.getElementById('tSec').textContent = String(s).padStart(2, '0');
  document.getElementById('tMs').textContent = '.' + String(ms).padStart(2, '0');
}

/* ═══════════════════ SUGGESTION ═══════════════════ */
function updateSuggestion(ev) {
  const card = document.getElementById('sugCard');
  const type = ev.type || '';
  card.style.opacity = '0';
  card.style.transform = 'translateY(3px)';
  setTimeout(() => {
    card.className = 'sug ' + type;
    card.textContent = ev.text;
    card.style.opacity = '1';
    card.style.transform = 'translateY(0)';
  }, 120);
}

/* ═══════════════════ CW STATS ═══════════════════ */
function updateCWStats() {
  const el = document.getElementById('cwList');
  const entries = Object.entries(ST.cw).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  if (!entries.length) { el.innerHTML = '<div class="cw-none">暂无</div>'; return; }
  const max = entries[0][1];
  el.innerHTML = entries.map(([word, count]) => {
    const pct = Math.min(count / Math.max(max, 1) * 100, 100);
    return `<div class="cw-item"><span class="cw-word">${word}</span><div class="cw-track"><div class="cw-bar" style="width:${pct}%"></div></div><span class="cw-count">${count}</span></div>`;
  }).join('');
}

/* ═══════════════════ TYPING ENGINE ═══════════════════ */
function typeLine(idx) {
  if (!ST.rec || ST.pau || idx >= SIM.length) {
    if (ST.rec && !ST.pau && idx >= SIM.length) setTimeout(stopPractice, 500);
    return;
  }
  ST.typing = true;
  const line = SIM[idx];
  const area = document.getElementById('speechArea');

  // Remove previous cursor
  document.querySelectorAll('.cur').forEach(c => c.remove());

  // Parse {keyword} markup into character segments
  const chars = [];
  const raw = line.t;
  let pos = 0;
  while (pos < raw.length) {
    if (raw[pos] === '{') {
      const end = raw.indexOf('}', pos);
      if (end !== -1) {
        const word = raw.substring(pos + 1, end);
        const isCW = word === line.cw;
        for (let c = 0; c < word.length; c++) {
          chars.push({ ch: word[c], type: isCW ? 'red' : 'green' });
        }
        pos = end + 1;
      } else {
        chars.push({ ch: raw[pos], type: 'n' }); pos++;
      }
    } else {
      chars.push({ ch: raw[pos], type: 'n' }); pos++;
    }
  }

  // Create line element with cursor
  const div = document.createElement('div');
  div.className = 'sp-line';
  const cursor = document.createElement('span');
  cursor.className = 'cur';
  div.appendChild(cursor);
  area.appendChild(div);

  const lineSpeed = line.speed || 1;
  let ci = 0;
  function nextChar() {
    if (!ST.rec || ST.pau) { ST.typing = false; return; }
    if (ci >= chars.length) {
      // Line complete
      cursor.remove();
      ST.lines.push(line);

      // Trigger feedback
      if (line.cw) { ST.cw[line.cw] = (ST.cw[line.cw] || 0) + 1; updateCWStats(); }
      if (line.fb) updateSuggestion(line.fb);

      // Mark keywords in teleprompter
      const sec = ST.curSec;
      if (sec < SECTIONS.length) {
        SECTIONS[sec].kw.forEach(k => {
          if (line.t.includes(k)) {
            const kwEl = document.getElementById(`kw_${sec}_${k}`);
            if (kwEl && !kwEl.classList.contains('spoken')) kwEl.classList.add('spoken');
          }
        });
      }

      // Progress
      const pct = ((idx + 1) / SIM.length) * 100;
      document.getElementById('pFill').style.width = pct + '%';
      document.getElementById('pPct').textContent = Math.round(pct) + '%';

      // Structure step
      const newStep = Math.min(Math.floor((idx + 1) / (SIM.length / 5)), 4);
      if (newStep !== ST.structStep) {
        const oldStep = document.getElementById('stStep' + ST.structStep);
        if (oldStep) { oldStep.classList.remove('current'); oldStep.classList.add('done'); }
        ST.structStep = newStep;
        const newStepEl = document.getElementById('stStep' + ST.structStep);
        if (newStepEl) newStepEl.classList.add('current');
        // Advance teleprompter section
        if (ST.curSec < SECTIONS.length - 1) {
          document.getElementById('sec' + ST.curSec).classList.remove('active');
          document.getElementById('sec' + ST.curSec).classList.add('done');
          ST.curSec++;
          document.getElementById('sec' + ST.curSec).classList.add('active');
        }
      }

      updateScores(idx);

      // Random pause tip
      if (!line.cw && Math.random() < .08) {
        const tip = document.getElementById('pauseTip');
        tip.classList.add('show');
        setTimeout(() => tip.classList.remove('show'), 1500);
      }

      area.scrollTop = area.scrollHeight;
      ST.typing = false;
      ST.simIdx = idx + 1;

      // Next line with natural delay (also affected by speed)
      const delay = (250 + Math.random() * 500) / lineSpeed;
      ST.simTO = setTimeout(() => typeLine(ST.simIdx), delay);
      return;
    }

    // Render next character
    const c = chars[ci];
    const span = document.createElement('span');
    span.textContent = c.ch;
    if (c.type === 'red') span.className = 'c red';
    else if (c.type === 'green') span.className = 'c green';
    else span.className = 'c';
    div.insertBefore(span, cursor);
    ci++;
    area.scrollTop = area.scrollHeight;

    // Typing speed modulated by line.speed: <1 = slower (nervous/hesitant), >1 = faster
    // Base: 55-80ms per char, multiplied by 1/speed
    const baseSpeed = (55 + Math.random() * 25) / lineSpeed;
    ST.simTO = setTimeout(nextChar, baseSpeed);
  }
  nextChar();
}

/* ═══════════════════ SCORES ═══════════════════ */
function updateScores(step) {
  const p = (step + 1) / SIM.length;
  const raw = {
    fluency: Math.min(10, 3 + p * 6 + (Math.random() - .3) * 2),
    logic: Math.min(10, 4 + p * 5 + (Math.random() - .2) * 1.5),
    emotion: Math.min(10, 3.5 + p * 4.5 + (Math.random() - .4) * 2),
    density: Math.min(10, 5 + p * 4 + (Math.random() - .3) * 1.5),
    interaction: Math.min(10, 2 + p * 6 + (Math.random() - .2) * 2)
  };
  Object.entries(raw).forEach(([k, v]) => {
    const el = document.getElementById('sc_' + k);
    if (!el) return;
    const val = Math.max(1, Math.min(10, v)).toFixed(1);
    el.textContent = val;
    el.className = 's-val';
    el.classList.add(v >= 7 ? 'good' : v >= 5 ? 'mid' : 'bad');
  });
}

/* ═══════════════════ WAVEFORM ═══════════════════ */
let wCtx, wCanvas;
function startWaveform() {
  wCanvas = document.getElementById('waveCanvas');
  wCtx = wCanvas.getContext('2d');
  resizeWave();
  window.addEventListener('resize', resizeWave);
  animateWave();
}
function resizeWave() {
  const r = wCanvas.parentElement.getBoundingClientRect();
  wCanvas.width = r.width * devicePixelRatio;
  wCanvas.height = r.height * devicePixelRatio;
  wCtx.scale(devicePixelRatio, devicePixelRatio);
}
function stopWaveform() {
  if (ST.afId) cancelAnimationFrame(ST.afId);
  ST.waveData = ST.waveData.map(() => 0);
  if (wCtx && wCanvas) {
    const w = wCanvas.width / devicePixelRatio, h = wCanvas.height / devicePixelRatio;
    wCtx.clearRect(0, 0, w, h);
    wCtx.strokeStyle = 'rgba(0,232,156,0.06)';
    wCtx.lineWidth = 1;
    wCtx.beginPath(); wCtx.moveTo(0, h / 2); wCtx.lineTo(w, h / 2); wCtx.stroke();
  }
}
function animateWave() {
  if (!ST.rec || ST.pau) return;
  const w = wCanvas.width / devicePixelRatio, h = wCanvas.height / devicePixelRatio;
  ST.waveData.shift();
  ST.waveData.push(.25 + Math.random() * .5);
  wCtx.clearRect(0, 0, w, h);

  // Center line
  wCtx.strokeStyle = 'rgba(0,232,156,0.04)';
  wCtx.lineWidth = 1;
  wCtx.beginPath(); wCtx.moveTo(0, h / 2); wCtx.lineTo(w, h / 2); wCtx.stroke();

  // Smooth wave curve
  const n = ST.waveData.length;
  const bw = w / n;
  const pts = ST.waveData.map((v, i) => ({
    x: i * bw,
    y: h / 2 - (v - .5) * h * .75
  }));

  // Fill area under curve (gradient)
  const fillGrad = wCtx.createLinearGradient(0, 0, 0, h);
  fillGrad.addColorStop(0, 'rgba(0,232,156,0.25)');
  fillGrad.addColorStop(.5, 'rgba(0,232,156,0.08)');
  fillGrad.addColorStop(1, 'rgba(0,232,156,0.02)');
  wCtx.beginPath();
  wCtx.moveTo(pts[0].x, h / 2);
  wCtx.lineTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i - 1], p1 = pts[i];
    const cpx = (p0.x + p1.x) / 2;
    wCtx.bezierCurveTo(cpx, p0.y, cpx, p1.y, p1.x, p1.y);
  }
  wCtx.lineTo(pts[pts.length - 1].x, h / 2);
  wCtx.closePath();
  wCtx.fillStyle = fillGrad;
  wCtx.fill();

  // Main wave line (glow + line)
  wCtx.beginPath();
  wCtx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i - 1], p1 = pts[i];
    const cpx = (p0.x + p1.x) / 2;
    wCtx.bezierCurveTo(cpx, p0.y, cpx, p1.y, p1.x, p1.y);
  }
  wCtx.strokeStyle = 'rgba(0,232,156,0.7)';
  wCtx.lineWidth = 1.5;
  wCtx.shadowColor = 'rgba(0,232,156,0.4)';
  wCtx.shadowBlur = 6;
  wCtx.stroke();
  wCtx.shadowBlur = 0;

  ST.afId = requestAnimationFrame(animateWave);
}

/* ═══════════════════ SCORE CALCULATION ═══════════════════ */
function calcScore(totalCW, dur, totalLines) {
  const base = 100;
  const cwDeduction = Math.min(40, totalCW * 3);
  const density = totalLines > 0 ? Math.round((totalLines - totalCW) / totalLines * 100) : 80;
  const densityDeduction = density < 80 ? Math.round((80 - density) * 0.5) : 0;
  const negativeDeduction = 0;
  const positiveBonus = Math.min(10, Math.floor(totalLines / 3) * 2);
  const final = Math.max(0, Math.min(100, base - cwDeduction - densityDeduction - negativeDeduction + positiveBonus));
  let grade = 'D';
  if (final >= 70) grade = 'B+';
  else if (final >= 40) grade = 'C';
  return { base, totalCW, cwDeduction, density, densityDeduction, negativeDeduction, positiveBonus, final, grade };
}

/* ═══════════════════ REVIEW MODULE BUILDERS ═══════════════════ */

function buildScoreModule(sd) {
  const circumference = 2 * Math.PI * 35;
  const offset = circumference - (sd.final / 100) * circumference;
  const gradeColor = sd.grade === 'B+' ? 'var(--accent)' : sd.grade === 'C' ? 'var(--amber)' : 'var(--red)';
  return `
    <div class="mod-score">
      <h3>综合评分</h3>
      <div class="score-big">
        <div class="score-ring-wrap">
          <svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="35"/><circle class="fg" cx="40" cy="40" r="35" style="stroke-dasharray:${circumference};stroke-dashoffset:${circumference};transition:stroke-dashoffset 1.2s ease" id="scoreRing"/></svg>
          <div class="score-ring-val"><div class="val" style="color:${gradeColor}">${sd.final}</div><div class="lbl">分</div></div>
        </div>
        <div class="score-grade ${sd.grade === 'B+' ? 'A' : sd.grade === 'C' ? 'B' : 'C'}" style="color:${gradeColor}">${sd.grade}</div>
        <div class="score-breakdown">
          <div class="sc-row"><span class="sc-name">基础分</span><span class="sc-val">${sd.base}</span></div>
          <div class="sc-row"><span class="sc-name">填充词扣分 (${sd.totalCW}次 × 3)</span><span class="sc-val neg">-${sd.cwDeduction}</span></div>
          <div class="sc-row"><span class="sc-name">密度扣分 (密度${sd.density}%)</span><span class="sc-val neg">-${sd.densityDeduction}</span></div>
          <div class="sc-row"><span class="sc-name">正面情绪加分</span><span class="sc-val pos">+${sd.positiveBonus}</span></div>
          <div class="sc-row"><span class="sc-name" style="color:var(--ink);font-weight:600">最终得分</span><span class="sc-val" style="color:${gradeColor};font-weight:700">${sd.final}</span></div>
        </div>
      </div>
      <div class="sc-formula">公式：100 - min(40, 填充词×3) - 密度扣分 + min(10, 正面词×2) = ${sd.final}</div>
    </div>`;
}

function animateScoreRing(final) {
  const ring = document.getElementById('scoreRing');
  if (!ring) return;
  const circumference = 2 * Math.PI * 35;
  const offset = circumference - (final / 100) * circumference;
  setTimeout(() => { ring.style.strokeDashoffset = offset; }, 50);
}

function buildInsightModule(totalCW, dur) {
  const sortedCW = Object.entries(ST.cw).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const topCW = sortedCW.length > 0 ? sortedCW[0] : ['然后', 0];
  const topPct = totalCW > 0 ? Math.round(topCW[1] / totalCW * 100) : 0;
  const density = ST.lines.length > 0 ? Math.round((ST.lines.length - totalCW) / ST.lines.length * 100) : 80;
  const hasCTA = ST.lines.some(l => /下单|拍下|链接|现在拍/.test(l.t));
  const hasExample = ST.lines.some(l => /比如|例如|想象一下|体验/.test(l.t));
  
  const items = [];
  if (totalCW > 0) {
    items.push(`共 <span class="ins-num">${totalCW}</span> 次填充词，「<span class="ins-hl">${topCW[0]}</span>」出现 ${topCW[1]} 次，占比 ${topPct}%，是最需要消灭的口头禅`);
  }
  items.push(`表达密度 <span class="ins-num">${density}%</span>，${density < 70 ? '有效信息占比偏低，大量时间被填充词占据' : '信息密度尚可，继续保持'}`);
  if (!hasCTA) items.push('缺少行动引导（CTA），观众看完不知道该做什么');
  if (!hasExample) items.push('全程缺少具体举例，观众难以产生画面感');
  
  return `
    <div class="mod-insight">
      <h3>核心洞察</h3>
      <div class="ins-list">${items.map(t => `<div class="ins-item">${t}</div>`).join('')}</div>
    </div>`;
}

function buildSentenceModule() {
  const vagueWords = { '非常': '极为', '很好': '出色', '真的': '确实', '特别': '格外', '比较': '相当' };
  const cards = ST.lines.map((l, i) => {
    if (!l.cw) return '';
    let original = l.t;
    if (l.cw) original = original.replace(new RegExp('\\{' + l.cw + '\\}', 'g'), `<span class="sw">${l.cw}</span>`);
    
    // Build suggestion
    let suggest = '';
    const tags = [];
    if (l.cw) {
      suggest = `删除「${l.cw}」，直接陈述。停顿 1 秒比填充词更有力量。`;
      tags.push('<span class="sent-tag fill">填充词过多</span>');
    }
    
    // Check vague words
    Object.entries(vagueWords).forEach(([bad, good]) => {
      if (l.t.includes(bad)) {
        suggest += suggest ? ` 「${bad}」→「${good}」。` : `「${bad}」→「${good}」。`;
        if (!tags.some(t => t.includes('vague'))) tags.push('<span class="sent-tag vague">词语模糊</span>');
      }
    });
    
    if (!suggest) return '';
    return `
      <div class="sent-card">
        <div class="sent-original">${original}</div>
        <div class="sent-arrow">↳</div>
        <div class="sent-suggest">${suggest}</div>
        <div class="sent-tags">${tags.join('')}</div>
      </div>`;
  }).filter(Boolean);
  
  if (!cards.length) return '';
  return `
    <div class="mod-sent">
      <h3>逐句精析</h3>
      ${cards.join('')}
    </div>`;
}

function buildReplaceModule() {
  const replacements = [
    { bad: '非常', good: '极为', alts: '格外、尤其、分外' },
    { bad: '很好', good: '出色', alts: '惊艳、超预期、令人满意' },
    { bad: '真的', good: '确实', alts: '的确、事实上' },
    { bad: '特别', good: '格外', alts: '尤为、分外、极其' },
    { bad: '比较', good: '相当', alts: '颇为、较为' },
    { bad: '东西', good: '产品', alts: '商品、好物' },
  ];
  return `
    <div class="mod-replace">
      <h3>词语替换建议</h3>
      <table class="replace-table">
        <tr><th>模糊词</th><th>首选替换</th><th>备选</th></tr>
        ${replacements.map(r => `<tr><td><span class="bad">${r.bad}</span></td><td><span class="good">${r.good}</span></td><td class="alt">${r.alts}</td></tr>`).join('')}
      </table>
    </div>`;
}

function buildBehaviorModule(totalCW, dur) {
  const sortedCW = Object.entries(ST.cw).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const topCW = sortedCW.length > 0 ? sortedCW[0] : ['然后', 0];
  const freq = dur > 0 ? (totalCW / (dur / 60)).toFixed(1) : '0';
  
  // Directness score (1-10)
  const indirectWords = ['就是说', '也就是', '其实', '对吧'];
  const indirectCount = ST.lines.filter(l => indirectWords.some(w => l.t.includes(w))).length;
  const directness = Math.max(1, Math.min(10, 10 - indirectCount * 1.5 - totalCW * 0.3));
  
  // Persuasion structure
  const hasPain = ST.lines.some(l => /坑|踩|骗|假/.test(l.t));
  const hasSolution = ST.lines.some(l => /优势|核心|材质|工艺/.test(l.t));
  const hasProof = ST.lines.some(l => /销量|好评|检测|十万/.test(l.t));
  const hasCTA = ST.lines.some(l => /下单|拍下|现在拍|限量/.test(l.t));
  const structureScore = [hasPain, hasSolution, hasProof, hasCTA].filter(Boolean).length;
  
  return `
    <div class="mod-behavior">
      <h3>行为模式分析</h3>
      <div class="bh-grid">
        <div class="bh-card">
          <h4>填充词模式</h4>
          <div class="bh-val ${totalCW <= 3 ? 'good' : totalCW <= 6 ? 'mid' : 'bad'}">${totalCW}<span style="font-size:.9rem;color:var(--muted)">次</span></div>
          <div class="bh-desc">
            最突出：「<strong>${topCW[0]}</strong>」${topCW[1]}次<br>
            频率：${freq}次/分钟<br>
            <span class="bh-tag ${totalCW > 5 ? 'conflict' : 'fill'}">${totalCW > 5 ? '思考卡顿型' : '过渡使用型'}</span>
          </div>
        </div>
        <div class="bh-card">
          <h4>直接性评分</h4>
          <div class="bh-val ${directness >= 7 ? 'good' : directness >= 4 ? 'mid' : 'bad'}">${directness.toFixed(1)}<span style="font-size:.9rem;color:var(--muted)">/10</span></div>
          <div class="bh-desc">
            ${directness >= 7 ? '表达直接，观点清晰' : directness >= 4 ? '部分间接表达，需精简' : '大量迂回表达，不够有力'}<br>
            间接词：${indirectCount}次<br>
            <span class="bh-tag ${directness >= 7 ? 'fill' : 'indirect'}">${directness >= 7 ? '直接型' : '间接表达型'}</span>
          </div>
        </div>
        <div class="bh-card">
          <h4>说服力结构</h4>
          <div class="bh-val ${structureScore >= 3 ? 'good' : structureScore >= 2 ? 'mid' : 'bad'}">${structureScore}<span style="font-size:.9rem;color:var(--muted)">/4</span></div>
          <div class="bh-desc">
            ${hasPain ? '✓ 痛点' : '✗ 痛点'} · ${hasSolution ? '✓ 方案' : '✗ 方案'}<br>
            ${hasProof ? '✓ 证明' : '✗ 证明'} · ${hasCTA ? '✓ CTA' : '✗ CTA'}<br>
            <span class="bh-tag ${structureScore >= 3 ? 'fill' : 'indirect'}">${structureScore >= 3 ? '结构完整' : '结构缺失'}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function buildFocusModule(totalCW) {
  const sortedCW = Object.entries(ST.cw).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const topCW = sortedCW.length > 0 ? sortedCW[0] : ['然后', 0];
  const hasCTA = ST.lines.some(l => /下单|拍下|链接|现在拍/.test(l.t));
  const hasExample = ST.lines.some(l => /比如|例如|想象一下|体验/.test(l.t));
  
  const focuses = [];
  if (topCW[1] >= 2) {
    focuses.push({
      title: `消灭「${topCW[0]}」`,
      why: `「${topCW[0]}」出现了 <strong>${topCW[1]} 次</strong>，是占比最高的口头禅。过渡时直接说下一句，用停顿替代填充词。消灭它能立刻提升专业感。`
    });
  }
  if (!hasCTA) {
    focuses.push({
      title: '每次讲完卖点后必须引导行动',
      why: '缺少 CTA 是直播转化率低的核心原因之一。加一句"点击下方链接""现在拍下"。'
    });
  }
  if (!hasExample) {
    focuses.push({
      title: '多用具体例子增加画面感',
      why: '没有具体例子的产品介绍，观众听完就忘。用"你想象一下……""我自己的体验是……"等句式。'
    });
  }
  focuses.push({
    title: '丰富词汇量',
    why: '将"很好"、"非常"、"真的"替换为更精确的表达。精确的词汇能显著提升说服力和专业感。'
  });
  focuses.push({
    title: '刻意练习停顿',
    why: '每次停顿 2 秒而非用"然后""额"填充。停顿是专业表达的标志，沉默比废话有力得多。'
  });
  
  return `
    <div class="mod-focus">
      <h3>下次练习重点</h3>
      <div class="focus-list">
        ${focuses.map((f, i) => `
          <div class="focus-item">
            <div class="focus-num">${i + 1}</div>
            <div class="focus-body">
              <div class="focus-title">${f.title}</div>
              <div class="focus-why">${f.why}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function buildReview() {
  const body = document.getElementById('rvBody');
  const dur = (ST.tm / 100).toFixed(0);
  const totalCW = Object.values(ST.cw).reduce((a, c) => a + c, 0);

  // Module 6: Score calculation
  const scoreData = calcScore(totalCW, dur, ST.lines.length);

  body.innerHTML = `
    <div class="rv-header">
      <h2>练习复盘</h2>
      <p>时长 ${dur}s · 冗余词 ${totalCW} 次 · 综合 ${scoreData.final}分 · ${scoreData.grade}</p>
    </div>
    ${buildScoreModule(scoreData)}
    ${buildInsightModule(totalCW, dur)}
    ${buildSentenceModule()}
    ${buildReplaceModule()}
    ${buildBehaviorModule(totalCW, dur)}
    ${buildFocusModule(totalCW)}
    <div class="rv-actions">
      <button class="btn btn-p" onclick="backToPractice()">再练一次</button>
      <button class="btn btn-o" onclick="switchTo('review','welcome');document.getElementById('welcome').classList.add('on')">返回首页</button>
    </div>
  `;
  
  setTimeout(() => animateScoreRing(scoreData.final), 100);
}
