<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学智云学习平台 v3.0 - 1-9年级在线学习</title>

    <!-- 引入Element UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <!-- 引入ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- 引入MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- 应用容器 -->
    <div id="app">
        <!-- 导航栏 -->
        <nav id="navbar" class="navbar">
            <div class="navbar-brand">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=学智云学习平台logo，蓝色科技风格，简洁现代&image_size=square" alt="学智云" class="logo">
                <span class="brand-name">学智云</span>
            </div>

            <div class="navbar-menu">
                <a href="#/home" class="nav-item active" data-route="home">
                    <i class="el-icon-s-home"></i>
                    <span>首页</span>
                </a>
                <a href="#/practice" class="nav-item" data-route="practice">
                    <i class="el-icon-edit"></i>
                    <span>题库练习</span>
                </a>
                <a href="#/courses" class="nav-item" data-route="courses">
                    <i class="el-icon-video-camera-solid"></i>
                    <span>视频课程</span>
                </a>
                <a href="#/ai-tutor" class="nav-item" data-route="ai-tutor">
                    <i class="el-icon-chat-dot-round"></i>
                    <span>AI辅导</span>
                </a>
                <a href="#/report" class="nav-item" data-route="report">
                    <i class="el-icon-data-analysis"></i>
                    <span>学习报告</span>
                </a>
            </div>

            <div class="navbar-user">
                <div class="user-info" id="userInfo">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=用户头像图标，简约风格，绿色背景&image_size=square" alt="用户头像" class="avatar">
                    <span class="username">未登录</span>
                </div>
                <button class="login-btn" id="loginBtn">登录</button>
                <button class="logout-btn hidden" id="logoutBtn">退出</button>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <main id="main-content" class="main-content">
            <!-- 页面内容将通过JavaScript动态加载 -->
        </main>

        <!-- 侧边栏（移动端为抽屉式） -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <div class="grade-selector">
                    <h3>选择年级</h3>
                    <div class="grade-buttons">
                        <button class="grade-btn active" data-grade="1">一年级</button>
                        <button class="grade-btn" data-grade="2">二年级</button>
                        <button class="grade-btn" data-grade="3">三年级</button>
                        <button class="grade-btn" data-grade="4">四年级</button>
                        <button class="grade-btn" data-grade="5">五年级</button>
                        <button class="grade-btn" data-grade="6">六年级</button>
                        <button class="grade-btn" data-grade="7">七年级</button>
                        <button class="grade-btn" data-grade="8">八年级</button>
                        <button class="grade-btn" data-grade="9">九年级</button>
                    </div>
                </div>

                <div class="quick-links">
                    <h3>快速入口</h3>
                    <a href="#/profile" class="quick-link">
                        <i class="el-icon-user"></i>
                        <span>个人中心</span>
                    </a>
                    <a href="#/mistakes" class="quick-link">
                        <i class="el-icon-document"></i>
                        <span>错题本</span>
                    </a>
                    <a href="#/history" class="quick-link">
                        <i class="el-icon-time"></i>
                        <span>学习历史</span>
                    </a>
                </div>

                <div class="study-stats">
                    <h3>今日学习</h3>
                    <div class="stat-item">
                        <i class="el-icon-time"></i>
                        <span>学习时长: <strong id="todayTime">0分钟</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="el-icon-edit"></i>
                        <span>完成题目: <strong id="todayQuestions">0题</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="el-icon-success"></i>
                        <span>正确率: <strong id="todayAccuracy">0%</strong></span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>用户登录</h2>
                <button class="close-btn" onclick="closeLoginModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label>手机号/邮箱</label>
                        <input type="text" id="loginPhone" placeholder="请输入手机号或邮箱" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                    <div class="form-group">
                        <label>用户类型</label>
                        <select id="loginRole">
                            <option value="student">学生</option>
                            <option value="parent">家长</option>
                            <option value="teacher">教师</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">登录</button>
                    <p class="register-link">还没有账号？<a href="#/register">立即注册</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- 引入Element UI JS -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

    <!-- 引入自定义JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/utils/charts.js"></script>
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/home.js"></script>
    <script src="js/components/practice.js"></script>
    <script src="js/components/courses.js"></script>
    <script src="js/components/ai-tutor.js"></script>
    <script src="js/components/report.js"></script>
    <script src="js/components/profile.js"></script>
    <script src="js/components/auth-components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
