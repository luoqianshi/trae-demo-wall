<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创业体验 - 人生预演</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/experience.css">
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" data-page="create">

  <div id="nav-root"></div>

  <main class="flex-1">

    <!-- Hero -->
    <section class="bg-gradient-to-b from-amber-50 to-[var(--background)] border-b border-[var(--border)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
        <div class="max-w-3xl">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-medium mb-4">
            <i data-lucide="rocket" class="w-3.5 h-3.5"></i>
            创造模式
          </span>
          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-[var(--foreground)] tracking-tight" style="text-wrap: balance; word-break: keep-all;">
            选择一个方向，创办你的公司
          </h1>
          <p class="mt-4 text-base sm:text-lg text-[var(--muted-foreground)] leading-relaxed max-w-2xl">
            从市场调研、产品定义，到融资谈判、应对突发危机。每个决策都会影响最终的财务数据和市场份额。
          </p>
        </div>
        <div class="mt-6 flex flex-wrap items-center gap-2 text-sm">
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-[var(--border)] text-[var(--muted-foreground)]">
            <i data-lucide="zap" class="w-4 h-4 text-amber-600"></i>
            <span><strong id="startup-count">0</strong> 个创业方向</span>
          </span>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-[var(--border)] text-[var(--muted-foreground)]">
            <i data-lucide="clock" class="w-4 h-4 text-amber-600"></i>
            <span>单次约 10-15 分钟</span>
          </span>
          <a href="archive.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 font-medium hover:bg-amber-200 transition-colors">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>查看我的成长档案</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- Startup Grid -->
    <section class="py-12 sm:py-16">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight">创业方向</h2>
          <div class="hidden sm:flex items-center gap-2 text-xs text-[var(--muted-foreground)]">
            <i data-lucide="info" class="w-3.5 h-3.5"></i>
            <span>选择一个方向开启你的创业预演</span>
          </div>
        </div>
        <div id="startup-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <!-- injected by create-page.js -->
        </div>
      </div>
    </section>

    <!-- Flow Preview -->
    <section class="py-12 sm:py-16 bg-[var(--muted)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight text-center mb-10">创业的 5 个关键阶段</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          <div class="bg-white rounded-xl p-4 border border-[var(--border)] text-center">
            <div class="w-10 h-10 mx-auto rounded-full bg-amber-500 text-white flex items-center justify-center mb-2 font-bold">1</div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">市场调研</div>
            <div class="text-[11px] text-[var(--muted-foreground)]">查看 AI 生成的市场数据</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)] text-center">
            <div class="w-10 h-10 mx-auto rounded-full bg-amber-400 text-white flex items-center justify-center mb-2 font-bold">2</div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">产品定位</div>
            <div class="text-[11px] text-[var(--muted-foreground)]">定义 MVP 核心能力</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)] text-center">
            <div class="w-10 h-10 mx-auto rounded-full bg-orange-400 text-white flex items-center justify-center mb-2 font-bold">3</div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">团队组建</div>
            <div class="text-[11px] text-[var(--muted-foreground)]">选择你的合伙人</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)] text-center">
            <div class="w-10 h-10 mx-auto rounded-full bg-rose-400 text-white flex items-center justify-center mb-2 font-bold">4</div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">融资谈判</div>
            <div class="text-[11px] text-[var(--muted-foreground)]">与投资人路演</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)] text-center">
            <div class="w-10 h-10 mx-auto rounded-full bg-sky-400 text-white flex items-center justify-center mb-2 font-bold col-span-2 sm:col-span-1">5</div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">应对危机</div>
            <div class="text-[11px] text-[var(--muted-foreground)]">处理突发挑战</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="js/main.js"></script>
  <script src="js/experience.js"></script>
  <script src="js/create-page.js"></script>
</body>
</html>
