<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成长档案 - 人生预演</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/experience.css">
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" data-page="archive">

  <div id="nav-root"></div>

  <main class="flex-1">

    <!-- Hero -->
    <section class="bg-gradient-to-b from-amber-50 to-[var(--background)] border-b border-[var(--border)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
        <div class="max-w-3xl">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-medium mb-4">
            <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
            我的成长档案
          </span>
          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-[var(--foreground)] tracking-tight" style="text-wrap: balance; word-break: keep-all;">
            你的预演轨迹
          </h1>
          <p class="mt-4 text-base sm:text-lg text-[var(--muted-foreground)] leading-relaxed max-w-2xl">
            每一个完成过的职业、创办过的公司，都会成为你认知世界的一部分。数据保存在你的浏览器本地。
          </p>
        </div>

        <!-- Stat Cards -->
        <div class="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
          <div class="bg-white rounded-xl p-4 border border-[var(--border)]">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">总经验值</div>
            <div class="text-2xl sm:text-3xl font-bold text-[var(--color-primary)] counter" data-target="0">0</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)]">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">完成次数</div>
            <div class="text-2xl sm:text-3xl font-bold text-[var(--foreground)] counter" data-target="0">0</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)]">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">职业解锁</div>
            <div class="text-2xl sm:text-3xl font-bold text-[var(--foreground)] counter" data-target="0">0</div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-[var(--border)]">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">公司创办</div>
            <div class="text-2xl sm:text-3xl font-bold text-[var(--foreground)] counter" data-target="0">0</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Sessions -->
    <section class="py-12 sm:py-16">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight">体验记录</h2>
          <button id="clear-archive" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-[var(--border)] text-xs font-medium text-[var(--muted-foreground)] hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-colors">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>清空数据</span>
          </button>
        </div>
        <div id="session-list">
          <!-- injected by archive-page.js -->
        </div>
      </div>
    </section>

    <!-- Unlocked Map -->
    <section class="py-12 sm:py-16 bg-[var(--muted)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight mb-6">职业解锁地图</h2>
        <div id="job-map" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          <!-- injected by archive-page.js -->
        </div>
        <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight mt-10 mb-6">创业解锁地图</h2>
        <div id="startup-map" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <!-- injected by archive-page.js -->
        </div>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="js/main.js"></script>
  <script src="js/experience.js"></script>
  <script src="js/archive-page.js"></script>
</body>
</html>
