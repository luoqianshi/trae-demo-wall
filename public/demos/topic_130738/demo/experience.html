<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体验中 - 人生预演</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/experience.css">
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" data-page="experience">

  <div id="nav-root"></div>

  <main class="flex-1">

    <!-- Age Switcher Bar -->
    <div class="bg-[var(--accent)] border-b border-amber-100">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-sm text-[var(--muted-foreground)]">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          <span class="hidden sm:inline">年龄段：</span>
        </div>
        <div id="age-switcher" class="inline-flex rounded-lg bg-white p-1 border border-[var(--border)] shadow-sm text-sm font-medium">
          <button data-age="6-10" class="age-tab px-3 py-1.5 rounded-md transition-colors">6-10 岁</button>
          <button data-age="11-15" class="age-tab px-3 py-1.5 rounded-md transition-colors">11-15 岁</button>
          <button data-age="16-18" class="age-tab px-3 py-1.5 rounded-md transition-colors">16-18 岁</button>
        </div>
      </div>
    </div>

    <!-- Header / Progress -->
    <section class="bg-[var(--background)] border-b border-[var(--border)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 text-xs font-medium text-[var(--color-primary)] mb-2">
              <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
              <span id="xp-scenario-tag">就业体验</span>
            </div>
            <h1 id="xp-title" class="text-2xl sm:text-3xl font-bold text-[var(--foreground)] tracking-tight" style="text-wrap: balance; word-break: keep-all;">
              加载中...
            </h1>
            <p id="xp-subtitle" class="mt-2 text-sm sm:text-base text-[var(--muted-foreground)]">—</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 text-xs font-medium">
              <i data-lucide="trophy" class="w-3.5 h-3.5"></i>
              <span>XP <strong id="xp-total">0</strong></span>
            </div>
            <button id="xp-restart" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-[var(--border)] text-xs font-medium text-[var(--foreground)] hover:bg-amber-50 transition-colors">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              <span>重新开始</span>
            </button>
          </div>
        </div>

        <!-- Stepper -->
        <div id="xp-stepper" class="mt-6 flex items-center gap-1 sm:gap-2 overflow-x-auto no-scrollbar">
          <!-- steps injected by JS -->
        </div>
      </div>
    </section>

    <!-- Stage Container -->
    <section class="py-8 sm:py-12">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="xp-stage" class="bg-[var(--card)] rounded-2xl border border-[var(--border)] overflow-hidden" style="box-shadow: var(--shadow-md);">
          <!-- stage content injected by JS -->
        </div>

        <!-- Stage Navigation -->
        <div class="mt-6 flex items-center justify-between gap-3">
          <button id="xp-prev" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg border border-[var(--border)] text-sm font-medium text-[var(--foreground)] hover:bg-amber-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>上一步</span>
          </button>
          <div class="text-xs text-[var(--muted-foreground)]" id="xp-stage-hint">—</div>
          <button id="xp-next" class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-[var(--color-primary)] text-white text-sm font-semibold hover:bg-[var(--color-primary-dark)] transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            <span>下一步</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="js/main.js"></script>
  <script src="js/experience.js"></script>
  <script src="js/experience-runner.js"></script>
</body>
</html>
