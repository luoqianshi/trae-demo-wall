<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Lens - 结构化数据可视化工作台</title>
  <style>
    /* ==================== CSS 变量与主题定义 ==================== */
    :root {
      /* 暗色主题变量（默认） */
      --bg: #0f1115;
      --surface: #161922;
      --surface-2: #1e212b;
      --editor-bg: #0d0f14;
      --text: #e8eaf0;
      --text-secondary: #9aa3b2;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.12);
      --accent: #22d3ee;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --string: #a5d6ff;
      --number: #fca5a5;
      --bool: #fde047;
      --null: #9ca3af;
      --key: #86efac;
      --highlight: rgba(251, 191, 36, 0.25);
      --radius: 8px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    /* 亮色主题变量，通过 body.theme-light 作用域覆盖 */
    body.theme-light {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #f4f5f7;
      --editor-bg: #f4f5f7;
      --text: #1f2329;
      --text-secondary: #5f6a7a;
      --border: rgba(0, 0, 0, 0.08);
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.08);
      --accent: #0891b2;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --string: #0369a1;
      --number: #dc2626;
      --bool: #ca8a04;
      --null: #6b7280;
      --key: #16a34a;
      --highlight: rgba(251, 191, 36, 0.35);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* ==================== 基础重置 ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ==================== 顶部工具栏 ==================== */
    .toolbar {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      font-weight: 800;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      color: #fff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* ==================== 主体布局 ==================== */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .editor-panel {
      border-right: 1px solid var(--border);
    }

    /* 编辑器区域 */
    #json-editor {
      flex: 1;
      width: 100%;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      background: var(--editor-bg);
      color: var(--text);
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    #json-editor::placeholder {
      color: var(--text-secondary);
    }

    /* 可视化树区域 */
    .tree-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #search-input {
      flex: 1;
      min-width: 120px;
      padding: 6px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--editor-bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    #search-input:focus {
      border-color: var(--primary);
    }

    #search-info {
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 40px;
      text-align: center;
    }

    .tree-content {
      flex: 1;
      overflow: auto;
      padding: 14px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      text-align: center;
      padding: 20px;
    }

    .error-banner {
      flex-shrink: 0;
      padding: 10px 14px;
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      display: none;
    }

    .error-banner.visible {
      display: block;
    }

    /* ==================== 树形节点样式 ==================== */
    .tree-node {
      position: relative;
      padding-left: 18px;
    }

    .node-header {
      display: flex;
      align-items: baseline;
      padding: 2px 0;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s ease;
    }

    .node-header:hover {
      background: var(--primary-soft);
    }

    .node-toggle {
      position: absolute;
      left: 0;
      width: 18px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 10px;
      cursor: pointer;
      user-select: none;
    }

    .node-toggle:hover {
      color: var(--primary);
    }

    .node-key {
      color: var(--key);
      margin-right: 6px;
    }

    .node-colon {
      color: var(--text-secondary);
      margin-right: 6px;
    }

    .node-value {
      word-break: break-all;
    }

    .node-value.string {
      color: var(--string);
    }

    .node-value.number {
      color: var(--number);
    }

    .node-value.boolean {
      color: var(--bool);
    }

    .node-value.null {
      color: var(--null);
    }

    .node-preview {
      color: var(--text-secondary);
      margin-left: 6px;
    }

    .node-count {
      color: var(--text-secondary);
      font-size: 11px;
      margin-left: 6px;
    }

    .node-children {
      padding-left: 8px;
      border-left: 1px dashed var(--border);
      margin-left: 4px;
    }

    .node-children.collapsed {
      display: none;
    }

    .match-highlight {
      background: var(--highlight);
      border-radius: 2px;
      padding: 0 1px;
    }

    .current-match > .node-header {
      outline: 1px solid var(--warning);
      background: var(--highlight);
    }

    /* ==================== 底部状态栏 ==================== */
    .status-bar {
      flex-shrink: 0;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-bar .status-valid {
      color: var(--success);
    }

    .status-bar .status-invalid {
      color: var(--danger);
    }

    /* ==================== 提示组件 ==================== */
    .toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 18px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .tooltip {
      position: fixed;
      padding: 6px 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 12px;
      max-width: 320px;
      word-break: break-all;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    .tooltip.visible {
      opacity: 1;
    }

    /* ==================== 移动端 Tab 切换 ==================== */
    .tabs-mobile {
      display: none;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    /* ==================== 响应式适配 ==================== */
    @media (max-width: 768px) {
      .toolbar {
        height: auto;
        min-height: 48px;
        flex-wrap: wrap;
        padding: 8px 12px;
        gap: 8px;
      }

      .toolbar-actions {
        flex-wrap: wrap;
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        font-size: 12px;
      }

      .main-container {
        flex-direction: column;
      }

      .tabs-mobile {
        display: flex;
      }

      .panel {
        display: none;
        flex: 1;
      }

      .panel.active {
        display: flex;
      }

      .editor-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .status-bar {
        height: auto;
        min-height: 28px;
        flex-wrap: wrap;
        padding: 6px 12px;
        gap: 10px;
      }
    }

    @media (max-width: 360px) {
      .logo-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏：包含 Logo 与主要操作按钮 -->
  <header class="toolbar">
    <div class="logo">
      <div class="logo-icon">JL</div>
      <span class="logo-text">JSON Lens</span>
    </div>
    <div class="toolbar-actions">
      <button class="btn" id="btn-import" title="导入本地 JSON 文件">导入</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button class="btn" id="btn-export" title="导出为 .json 文件">导出</button>
      <button class="btn" id="btn-format" title="按 2 空格缩进格式化">格式化</button>
      <button class="btn" id="btn-minify" title="压缩为单行 JSON">压缩</button>
      <button class="btn" id="btn-clear" title="清空编辑器">清空</button>
      <button class="btn btn-primary" id="btn-theme" title="切换亮/暗主题">主题</button>
    </div>
  </header>

  <!-- 主体区域：左侧编辑器 + 右侧可视化树 -->
  <div class="main-container">
    <!-- 移动端 Tab 切换栏 -->
    <div class="tabs-mobile">
      <button class="tab-btn active" data-tab="editor">编辑器</button>
      <button class="tab-btn" data-tab="tree">可视化树</button>
    </div>

    <!-- 编辑器面板 -->
    <section class="panel editor-panel active" id="editor-panel">
      <textarea id="json-editor" placeholder="在此粘贴或输入 JSON 文本，也可以拖拽 .json 文件到此处..."></textarea>
    </section>

    <!-- 可视化树面板 -->
    <section class="panel tree-panel" id="tree-panel">
      <div class="error-banner" id="error-banner"></div>
      <div class="tree-toolbar">
        <input type="text" id="search-input" placeholder="搜索 key 或 value...">
        <button class="btn btn-sm" id="btn-search-prev" title="上一个匹配">↑</button>
        <button class="btn btn-sm" id="btn-search-next" title="下一个匹配">↓</button>
        <span id="search-info">0/0</span>
        <button class="btn btn-sm" id="btn-expand-all" title="展开所有节点">全部展开</button>
        <button class="btn btn-sm" id="btn-collapse-all" title="折叠所有节点">全部折叠</button>
      </div>
      <div class="tree-content" id="tree-content">
        <div class="empty-state">在左侧编辑器中粘贴 JSON，或点击顶部工具栏加载示例</div>
      </div>
    </section>
  </div>

  <!-- 底部状态栏 -->
  <footer class="status-bar">
    <span id="status-parse">等待输入</span>
    <span id="status-nodes">节点总数：0</span>
    <span id="status-path">路径：-</span>
  </footer>

  <!-- 全局提示与悬浮提示 -->
  <div class="toast" id="toast"></div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    /* ============================================================
       JSON Lens 单文件应用
       采用 JSONLens 命名空间 + ES6 Class 实现模块化组织
       不依赖任何外部框架或 CDN
       ============================================================ */

    // ==================== 配置常量模块 ====================
    const JSONLens = {};

    /**
     * 配置常量
     * 集中管理默认展开深度、debounce 时间、性能阈值等参数
     */
    JSONLens.Config = {
      // 对象/数组默认展开的嵌套深度
      DEFAULT_EXPAND_DEPTH: 2,
      // 编辑器输入后触发解析的防抖延迟（毫秒）
      DEBOUNCE_MS: 300,
      // 搜索框输入后触发搜索的防抖延迟（毫秒）
      SEARCH_DEBOUNCE_MS: 150,
      // 单次渲染的最大节点数，超过时进行截断保护
      MAX_RENDER_NODES: 5000,
      // 树中字符串值截断阈值
      LONG_STRING_LIMIT: 200,
      // 页面初始化时加载的示例 JSON
      SAMPLE_JSON: `{
  "project": "JSON Lens",
  "version": 1.0,
  "local": true,
  "features": ["tree view", "search", "export", "theme switch"],
  "team": {
    "frontend": 2,
    "backend": 1
  },
  "metadata": {
    "created": "2026-07-08",
    "tags": ["json", "visualization", "offline"]
  }
}`
    };

    // ==================== 全局状态模块 ====================
    /**
     * 全局状态对象
     * 保存应用运行期间的当前文本、解析结果、节点树、搜索状态、主题等信息
     */
    JSONLens.State = {
      // 当前编辑器中的原始文本
      currentText: '',
      // 最近一次成功解析的 JSON 数据
      parsedData: null,
      // 当前节点树根节点
      rootNode: null,
      // 上一次成功渲染的节点树，解析失败时用于保留视图
      lastValidRootNode: null,
      // 当前搜索关键字
      searchKeyword: '',
      // 搜索匹配到的节点 ID 列表
      matches: [],
      // 当前高亮的匹配项索引
      matchIndex: -1,
      // 当前主题：'dark' 或 'light'
      theme: 'dark',
      // 最近一次解析错误信息
      error: null,
      // 节点总数统计
      totalNodes: 0
    };

    // ==================== 通用工具模块 ====================
    /**
     * 通用工具函数集合
     */
    JSONLens.Utils = {
      /**
       * 防抖函数
       * @param {Function} fn - 需要防抖执行的函数
       * @param {number} delay - 延迟时间（毫秒）
       * @returns {Function} 包装后的防抖函数
       */
      debounce(fn, delay) {
        let timer = null;
        return function (...args) {
          if (timer) clearTimeout(timer);
          timer = setTimeout(() => {
            fn.apply(this, args);
          }, delay);
        };
      },

      /**
       * HTML 转义，防止 XSS 与特殊字符渲染异常
       * @param {string} str - 原始字符串
       * @returns {string} 转义后的字符串
       */
      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },

      /**
       * 复制文本到剪贴板
       * @param {string} text - 待复制文本
       */
      async copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          JSONLens.Utils.showToast('已复制到剪贴板：' + text);
        } catch (err) {
          // 兼容不支持 clipboard API 的环境，使用降级方案
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            JSONLens.Utils.showToast('已复制到剪贴板：' + text);
          } catch (e) {
            JSONLens.Utils.showToast('复制失败，请手动复制');
          }
          document.body.removeChild(textarea);
        }
      },

      /**
       * 显示临时提示信息
       * @param {string} message - 提示内容
       * @param {number} duration - 显示时长（毫秒），默认 2000
       */
      showToast(message, duration = 2000) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('visible');
        if (toast._timer) clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
          toast.classList.remove('visible');
        }, duration);
      },

      /**
       * 根据节点类型返回对应的 CSS 类名
       * @param {string} type - 节点类型
       * @returns {string} CSS 类名
       */
      getTypeColorClass(type) {
        const map = {
          string: 'string',
          number: 'number',
          boolean: 'boolean',
          null: 'null'
        };
        return map[type] || '';
      },

      /**
       * 截断超长字符串用于预览
       * @param {string} str - 原始字符串
       * @param {number} limit - 最大长度
       * @returns {string} 截断后的字符串
       */
      truncateString(str, limit) {
        if (str.length <= limit) return str;
        return str.substring(0, limit) + '...';
      }
    };

    // ==================== JSON 解析模块 ====================
    /**
     * JSON 解析与内部节点树构建
     */
    JSONLens.Parser = {
      /**
       * 解析 JSON 文本并构建节点树
       * @param {string} text - JSON 文本
       * @returns {Object|null} 包含 data、rootNode、totalNodes 的对象；解析失败返回 null
       */
      parseJson(text) {
        const trimmed = text.trim();
        if (!trimmed) {
          return { data: null, rootNode: null, totalNodes: 0 };
        }
        try {
          const data = JSON.parse(trimmed);
          const rootNode = this.buildNode(null, data, '', 0);
          const totalNodes = this.countNodes(rootNode);
          return { data, rootNode, totalNodes };
        } catch (error) {
          throw error;
        }
      },

      /**
       * 递归构建内部节点
       * @param {string|null} key - 字段名，根节点为 null
       * @param {*} value - 字段值
       * @param {string} path - 当前完整访问路径
       * @param {number} depth - 当前嵌套深度
       * @returns {Object} 内部节点对象
       */
      buildNode(key, value, path, depth) {
        const type = this.getValueType(value);
        const node = {
          id: 'node-' + Math.random().toString(36).slice(2) + '-' + depth,
          key,
          value,
          type,
          path,
          depth,
          isExpanded: depth < JSONLens.Config.DEFAULT_EXPAND_DEPTH,
          children: []
        };

        if (type === 'object' && value !== null) {
          const keys = Object.keys(value);
          node.childCount = keys.length;
          node.children = keys.map((childKey) => {
            // 根节点路径为空时，子节点路径直接使用 key，避免前导点号
            const childPath = path === '' ? childKey : path + '.' + childKey;
            return this.buildNode(childKey, value[childKey], childPath, depth + 1);
          });
        } else if (type === 'array') {
          node.childCount = value.length;
          node.children = value.map((item, index) => {
            const childPath = path + '[' + index + ']';
            return this.buildNode(String(index), item, childPath, depth + 1);
          });
        }

        return node;
      },

      /**
       * 获取值的类型名称
       * @param {*} value - 任意值
       * @returns {string} 类型：object/array/string/number/boolean/null
       */
      getValueType(value) {
        if (value === null) return 'null';
        if (Array.isArray(value)) return 'array';
        return typeof value;
      },

      /**
       * 统计节点总数（含自身）
       * @param {Object} node - 节点
       * @returns {number} 节点数
       */
      countNodes(node) {
        if (!node) return 0;
        let count = 1;
        for (const child of node.children) {
          count += this.countNodes(child);
        }
        return count;
      },

      /**
       * 从解析异常中提取错误位置与行号信息
       * @param {Error} error - JSON.parse 抛出的异常
       * @param {string} text - 原始文本
       * @returns {Object} 包含 message、position、line 的对象
       */
      extractErrorPosition(error, text) {
        const result = { message: error.message, position: null, line: null };
        const match = error.message.match(/position\s+(\d+)/i);
        if (match) {
          result.position = parseInt(match[1], 10);
          result.line = text.substring(0, result.position).split('\n').length;
        }
        return result;
      }
    };

    // ==================== 树形渲染模块 ====================
    /**
     * 树形可视化渲染器
     */
    JSONLens.Renderer = {
      // 渲染目标容器
      container: null,
      // 当前渲染的节点数量，用于性能保护
      renderedCount: 0,

      /**
       * 渲染整棵节点树
       * @param {Object} rootNode - 根节点
       * @param {HTMLElement} container - 渲染容器
       */
      renderTree(rootNode, container) {
        this.container = container;
        this.renderedCount = 0;
        container.innerHTML = '';

        if (!rootNode) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = '在左侧编辑器中粘贴 JSON，或点击顶部工具栏加载示例';
          container.appendChild(empty);
          return;
        }

        // 性能保护：节点数超过阈值时给出提示
        if (JSONLens.State.totalNodes > JSONLens.Config.MAX_RENDER_NODES) {
          const warn = document.createElement('div');
          warn.className = 'error-banner visible';
          warn.style.color = 'var(--warning)';
          warn.style.background = 'rgba(251, 191, 36, 0.1)';
          warn.textContent = `节点数较多（${JSONLens.State.totalNodes}），为保证性能仅渲染关键层级，建议压缩或折叠查看。`;
          container.appendChild(warn);
        }

        const rootEl = this.createNodeElement(rootNode);
        container.appendChild(rootEl);
      },

      /**
       * 递归创建单个节点的 DOM 元素
       * @param {Object} node - 内部节点
       * @returns {HTMLElement} 节点 DOM
       */
      createNodeElement(node) {
        this.renderedCount++;
        const el = document.createElement('div');
        el.className = 'tree-node';
        el.dataset.nodeId = node.id;

        // 节点头部：包含箭头、key、冒号、值/预览
        const header = document.createElement('div');
        header.className = 'node-header';

        // 展开/折叠箭头
        if (node.type === 'object' || node.type === 'array') {
          const toggle = document.createElement('span');
          toggle.className = 'node-toggle';
          toggle.textContent = node.isExpanded ? '▼' : '▶';
          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            this.toggleNode(node);
          });
          el.appendChild(toggle);

          header.addEventListener('click', () => {
            this.toggleNode(node);
          });
        } else {
          // 占位，保持标量节点与容器节点对齐
          const spacer = document.createElement('span');
          spacer.className = 'node-toggle';
          spacer.textContent = '';
          el.appendChild(spacer);
        }

        // key 部分（根节点无 key）
        if (node.key !== null) {
          const keySpan = document.createElement('span');
          keySpan.className = 'node-key';
          keySpan.textContent = node.type === 'array' ? node.key : JSON.stringify(node.key);
          header.appendChild(keySpan);

          const colon = document.createElement('span');
          colon.className = 'node-colon';
          colon.textContent = ':';
          header.appendChild(colon);
        }

        // value 部分
        if (node.type === 'object' || node.type === 'array') {
          // 容器类型显示数量与预览
          const preview = document.createElement('span');
          preview.className = 'node-preview';
          if (node.type === 'object') {
            preview.textContent = node.isExpanded
              ? `{${node.childCount} keys}`
              : this.buildObjectPreview(node);
          } else {
            preview.textContent = node.isExpanded
              ? `[${node.childCount} items]`
              : this.buildArrayPreview(node);
          }
          header.appendChild(preview);

          // 同时显示简短数量标签
          const count = document.createElement('span');
          count.className = 'node-count';
          count.textContent = node.type === 'object' ? `{${node.childCount}}` : `[${node.childCount}]`;
          header.appendChild(count);
        } else {
          // 标量类型直接渲染值
          const valueSpan = document.createElement('span');
          valueSpan.className = 'node-value ' + JSONLens.Utils.getTypeColorClass(node.type);
          const displayValue = node.type === 'string'
            ? JSON.stringify(JSONLens.Utils.truncateString(node.value, JSONLens.Config.LONG_STRING_LIMIT))
            : String(node.value);
          valueSpan.textContent = displayValue;

          // 超长字符串通过 tooltip 展示完整内容
          if (node.type === 'string' && node.value.length > JSONLens.Config.LONG_STRING_LIMIT) {
            valueSpan.title = node.value;
            valueSpan.dataset.tooltip = node.value;
          }
          header.appendChild(valueSpan);
        }

        // 路径复制与 tooltip
        header.dataset.path = node.path || '(root)';
        header.addEventListener('click', () => {
          if (node.path !== '') {
            JSONLens.Utils.copyToClipboard(node.path);
          } else {
            JSONLens.Utils.copyToClipboard('(root)');
          }
        });

        el.appendChild(header);

        // 递归渲染子节点
        if (node.children && node.children.length > 0) {
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'node-children';
          if (!node.isExpanded) {
            childrenContainer.classList.add('collapsed');
          }

          for (const child of node.children) {
            // 性能保护：超过最大渲染节点数时停止深层渲染
            if (this.renderedCount >= JSONLens.Config.MAX_RENDER_NODES) {
              const tip = document.createElement('div');
              tip.className = 'node-preview';
              tip.textContent = '...（已截断）';
              childrenContainer.appendChild(tip);
              break;
            }
            childrenContainer.appendChild(this.createNodeElement(child));
          }
          el.appendChild(childrenContainer);
        }

        return el;
      },

      /**
       * 切换节点的展开/折叠状态
       * @param {Object} node - 内部节点
       */
      toggleNode(node) {
        if (node.type !== 'object' && node.type !== 'array') return;
        node.isExpanded = !node.isExpanded;
        // 重新渲染整棵树以保持状态一致性
        this.renderTree(JSONLens.State.rootNode, this.container);
        // 渲染后恢复搜索高亮
        JSONLens.Search.highlightMatches();
      },

      /**
       * 展开所有节点
       */
      expandAll() {
        this.setAllExpanded(JSONLens.State.rootNode, true);
        this.renderTree(JSONLens.State.rootNode, this.container);
        JSONLens.Search.highlightMatches();
      },

      /**
       * 折叠所有节点（仅保留根节点展开）
       */
      collapseAll() {
        this.setAllExpanded(JSONLens.State.rootNode, false);
        if (JSONLens.State.rootNode) {
          JSONLens.State.rootNode.isExpanded = true;
        }
        this.renderTree(JSONLens.State.rootNode, this.container);
        JSONLens.Search.highlightMatches();
      },

      /**
       * 递归设置所有节点的展开状态
       * @param {Object} node - 当前节点
       * @param {boolean} expanded - 是否展开
       */
      setAllExpanded(node, expanded) {
        if (!node) return;
        node.isExpanded = expanded;
        for (const child of node.children) {
          this.setAllExpanded(child, expanded);
        }
      },

      /**
       * 构建对象折叠预览文本
       * @param {Object} node - 对象节点
       * @returns {string} 预览字符串
       */
      buildObjectPreview(node) {
        const keys = node.children.slice(0, 3).map(child => child.key);
        const prefix = keys.join(', ');
        const suffix = node.childCount > 3 ? ', ...' : '';
        return `{${prefix}${suffix}}`;
      },

      /**
       * 构建数组折叠预览文本
       * @param {Object} node - 数组节点
       * @returns {string} 预览字符串
       */
      buildArrayPreview(node) {
        const items = node.children.slice(0, 3).map(child => {
          if (child.type === 'object') return '{...}';
          if (child.type === 'array') return '[...]';
          return String(child.value);
        });
        const prefix = items.join(', ');
        const suffix = node.childCount > 3 ? ', ...' : '';
        return `[${prefix}${suffix}]`;
      }
    };

    // ==================== 搜索模块 ====================
    /**
     * 树中关键字搜索与导航
     */
    JSONLens.Search = {
      /**
       * 执行搜索
       * @param {string} keyword - 搜索关键字
       */
      search(keyword) {
        JSONLens.State.searchKeyword = keyword.trim();
        JSONLens.State.matches = [];
        JSONLens.State.matchIndex = -1;

        if (!JSONLens.State.searchKeyword || !JSONLens.State.rootNode) {
          this.updateSearchInfo();
          this.clearHighlight();
          return;
        }

        // 收集所有匹配节点
        this.collectMatches(JSONLens.State.rootNode, JSONLens.State.searchKeyword);
        JSONLens.State.matchIndex = JSONLens.State.matches.length > 0 ? 0 : -1;
        this.updateSearchInfo();
        this.highlightMatches();

        if (JSONLens.State.matches.length > 0) {
          this.navigateTo(0);
        }
      },

      /**
       * 递归收集匹配节点，并自动展开匹配节点的父级
       * @param {Object} node - 当前节点
       * @param {string} keyword - 关键字
       */
      collectMatches(node, keyword) {
        if (!node) return;
        const lowerKeyword = keyword.toLowerCase();
        const keyMatch = node.key !== null && String(node.key).toLowerCase().includes(lowerKeyword);
        const valueMatch = node.type !== 'object' && node.type !== 'array' &&
          String(node.value).toLowerCase().includes(lowerKeyword);

        if (keyMatch || valueMatch) {
          JSONLens.State.matches.push(node);
          this.expandAncestors(node);
        }

        for (const child of node.children) {
          this.collectMatches(child, keyword);
        }
      },

      /**
       * 展开指定节点的所有祖先节点，使其可见
       * @param {Object} node - 目标节点
       */
      expandAncestors(node) {
        // 通过路径重建祖先链并展开
        const pathParts = this.parsePath(node.path);
        let current = JSONLens.State.rootNode;
        current.isExpanded = true;
        for (const part of pathParts) {
          if (!current || (current.type !== 'object' && current.type !== 'array')) break;
          const child = current.children.find(c => c.key === part.key);
          if (child) {
            child.isExpanded = true;
            current = child;
          }
        }
      },

      /**
       * 将路径字符串解析为访问步骤数组
       * @param {string} path - 如 users[0].name
       * @returns {Array<{type:string, key:string}>} 步骤数组
       */
      parsePath(path) {
        const parts = [];
        if (!path) return parts;
        // 按 .key 或 [index] 分割
        const regex = /\.(?![^\[]*\])([^.\[]+)|\[(\d+)\]/g;
        let match;
        while ((match = regex.exec(path)) !== null) {
          if (match[1] !== undefined) {
            parts.push({ type: 'object', key: match[1] });
          } else if (match[2] !== undefined) {
            parts.push({ type: 'array', key: match[2] });
          }
        }
        return parts;
      },

      /**
       * 高亮所有匹配项
       */
      highlightMatches() {
        this.clearHighlight();
        if (!JSONLens.State.searchKeyword) return;

        // 重新渲染树以反映展开的祖先节点
        JSONLens.Renderer.renderTree(JSONLens.State.rootNode, JSONLens.Renderer.container);

        const keyword = JSONLens.State.searchKeyword.toLowerCase();
        const nodes = JSONLens.State.matches;

        for (let i = 0; i < nodes.length; i++) {
          const node = nodes[i];
          const el = this.findNodeElement(node.id);
          if (!el) continue;

          // 高亮 key
          const keyEl = el.querySelector('.node-key');
          if (keyEl && node.key !== null && String(node.key).toLowerCase().includes(keyword)) {
            keyEl.innerHTML = this.highlightText(keyEl.textContent, keyword);
          }

          // 高亮 value
          const valueEl = el.querySelector('.node-value');
          if (valueEl && node.type !== 'object' && node.type !== 'array' &&
              String(node.value).toLowerCase().includes(keyword)) {
            valueEl.innerHTML = this.highlightText(valueEl.textContent, keyword);
          }

          if (i === JSONLens.State.matchIndex) {
            el.classList.add('current-match');
          }
        }
      },

      /**
       * 在文本中高亮关键字
       * @param {string} text - 原始文本
       * @param {string} keyword - 关键字
       * @returns {string} 带高亮标签的 HTML
       */
      highlightText(text, keyword) {
        if (!keyword) return JSONLens.Utils.escapeHtml(text);
        const lowerText = text.toLowerCase();
        const lowerKeyword = keyword.toLowerCase();
        let result = '';
        let start = 0;
        let index = lowerText.indexOf(lowerKeyword);
        while (index !== -1) {
          result += JSONLens.Utils.escapeHtml(text.substring(start, index));
          result += '<span class="match-highlight">' +
            JSONLens.Utils.escapeHtml(text.substring(index, index + keyword.length)) +
            '</span>';
          start = index + keyword.length;
          index = lowerText.indexOf(lowerKeyword, start);
        }
        result += JSONLens.Utils.escapeHtml(text.substring(start));
        return result;
      },

      /**
       * 清除所有高亮样式
       */
      clearHighlight() {
        const highlighted = document.querySelectorAll('.match-highlight, .current-match');
        for (const el of highlighted) {
          el.classList.remove('current-match');
          if (el.classList.contains('match-highlight')) {
            // 仅移除 match-highlight 类，文本恢复由重新渲染完成
            el.outerHTML = el.textContent;
          }
        }
      },

      /**
       * 跳转到上一个匹配项
       */
      prevMatch() {
        const count = JSONLens.State.matches.length;
        if (count === 0) return;
        let nextIndex = JSONLens.State.matchIndex - 1;
        if (nextIndex < 0) nextIndex = count - 1;
        this.navigateTo(nextIndex);
      },

      /**
       * 跳转到下一个匹配项
       */
      nextMatch() {
        const count = JSONLens.State.matches.length;
        if (count === 0) return;
        let nextIndex = JSONLens.State.matchIndex + 1;
        if (nextIndex >= count) nextIndex = 0;
        this.navigateTo(nextIndex);
      },

      /**
       * 导航到指定匹配项
       * @param {number} index - 匹配项索引
       */
      navigateTo(index) {
        JSONLens.State.matchIndex = index;
        this.updateSearchInfo();
        this.highlightMatches();

        const node = JSONLens.State.matches[index];
        if (!node) return;
        const el = this.findNodeElement(node.id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      },

      /**
       * 根据节点 ID 查找对应的 DOM 元素
       * @param {string} nodeId - 节点 ID
       * @returns {HTMLElement|null}
       */
      findNodeElement(nodeId) {
        return JSONLens.Renderer.container.querySelector('[data-node-id="' + nodeId + '"]');
      },

      /**
       * 更新搜索信息文本
       */
      updateSearchInfo() {
        const info = document.getElementById('search-info');
        const count = JSONLens.State.matches.length;
        if (count === 0) {
          info.textContent = '0/0';
        } else {
          info.textContent = (JSONLens.State.matchIndex + 1) + '/' + count;
        }
      },

      /**
       * 清空搜索状态
       */
      clearSearch() {
        JSONLens.State.searchKeyword = '';
        JSONLens.State.matches = [];
        JSONLens.State.matchIndex = -1;
        document.getElementById('search-input').value = '';
        this.updateSearchInfo();
        this.highlightMatches();
      }
    };

    // ==================== 文件导入导出模块 ====================
    /**
     * 本地文件导入与 JSON 导出
     */
    JSONLens.FileIO = {
      /**
       * 导入本地 JSON 文件
       * @param {File} file - 用户选择的文件对象
       */
      importFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          document.getElementById('json-editor').value = content;
          JSONLens.App.onEditorInput();
          JSONLens.Utils.showToast('文件导入成功：' + file.name);
        };
        reader.onerror = () => {
          JSONLens.Utils.showToast('文件读取失败，请重试');
        };
        reader.readAsText(file);
      },

      /**
       * 处理拖拽导入事件
       * @param {DragEvent} event - 拖拽事件
       */
      handleDrop(event) {
        event.preventDefault();
        event.stopPropagation();
        const files = event.dataTransfer.files;
        if (files.length > 0) {
          this.importFile(files[0]);
        }
      },

      /**
       * 将当前编辑器内容导出为 .json 文件
       */
      exportJson() {
        const text = JSONLens.State.currentText;
        if (!text.trim()) {
          JSONLens.Utils.showToast('编辑器为空，无需导出');
          return;
        }
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'export.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        JSONLens.Utils.showToast('导出成功：export.json');
      }
    };

    // ==================== 主题与快捷键模块 ====================
    /**
     * 主题切换与键盘快捷键
     */
    JSONLens.Theme = {
      /**
       * 初始化主题与快捷键
       */
      init() {
        this.applyTheme(JSONLens.State.theme);
        this.bindShortcuts();
      },

      /**
       * 切换亮/暗主题
       */
      toggle() {
        JSONLens.State.theme = JSONLens.State.theme === 'dark' ? 'light' : 'dark';
        this.applyTheme(JSONLens.State.theme);
      },

      /**
       * 应用指定主题
       * @param {string} theme - 'dark' 或 'light'
       */
      applyTheme(theme) {
        if (theme === 'light') {
          document.body.classList.add('theme-light');
        } else {
          document.body.classList.remove('theme-light');
        }
      },

      /**
       * 绑定全局键盘快捷键
       */
      bindShortcuts() {
        document.addEventListener('keydown', (e) => {
          const isCtrl = e.ctrlKey || e.metaKey;
          const key = e.key.toLowerCase();

          // Ctrl/Cmd + F：聚焦搜索框
          if (isCtrl && key === 'f') {
            e.preventDefault();
            document.getElementById('search-input').focus();
            // 移动端自动切换到可视化树面板
            JSONLens.App.switchTab('tree');
          }

          // Ctrl/Cmd + S：导出 JSON
          if (isCtrl && key === 's') {
            e.preventDefault();
            JSONLens.FileIO.exportJson();
          }
        });
      }
    };

    // ==================== 应用初始化模块 ====================
    /**
     * 应用入口与事件绑定
     */
    JSONLens.App = {
      // DOM 元素缓存
      elements: {},

      /**
       * 初始化应用
       */
      init() {
        this.cacheElements();
        this.bindEvents();
        JSONLens.Theme.init();

        // 加载默认示例 JSON
        this.elements.editor.value = JSONLens.Config.SAMPLE_JSON;
        this.onEditorInput();
      },

      /**
       * 缓存常用 DOM 元素，避免重复查询
       */
      cacheElements() {
        this.elements = {
          editor: document.getElementById('json-editor'),
          treeContent: document.getElementById('tree-content'),
          errorBanner: document.getElementById('error-banner'),
          searchInput: document.getElementById('search-input'),
          searchInfo: document.getElementById('search-info'),
          statusParse: document.getElementById('status-parse'),
          statusNodes: document.getElementById('status-nodes'),
          statusPath: document.getElementById('status-path'),
          fileInput: document.getElementById('file-input'),
          btnImport: document.getElementById('btn-import'),
          btnExport: document.getElementById('btn-export'),
          btnFormat: document.getElementById('btn-format'),
          btnMinify: document.getElementById('btn-minify'),
          btnClear: document.getElementById('btn-clear'),
          btnTheme: document.getElementById('btn-theme'),
          btnExpandAll: document.getElementById('btn-expand-all'),
          btnCollapseAll: document.getElementById('btn-collapse-all'),
          btnSearchPrev: document.getElementById('btn-search-prev'),
          btnSearchNext: document.getElementById('btn-search-next'),
          tabBtns: document.querySelectorAll('.tab-btn'),
          tooltip: document.getElementById('tooltip')
        };
      },

      /**
       * 绑定所有交互事件
       */
      bindEvents() {
        const { elements } = this;

        // 编辑器输入事件，使用防抖触发解析
        elements.editor.addEventListener('input', JSONLens.Utils.debounce(() => {
          this.onEditorInput();
        }, JSONLens.Config.DEBOUNCE_MS));

        // 编辑器拖拽导入事件
        elements.editor.addEventListener('dragover', (e) => {
          e.preventDefault();
          elements.editor.style.border = '2px dashed var(--primary)';
        });
        elements.editor.addEventListener('dragleave', () => {
          elements.editor.style.border = 'none';
        });
        elements.editor.addEventListener('drop', (e) => {
          elements.editor.style.border = 'none';
          JSONLens.FileIO.handleDrop(e);
        });

        // 文件导入按钮
        elements.btnImport.addEventListener('click', () => {
          elements.fileInput.click();
        });
        elements.fileInput.addEventListener('change', (e) => {
          if (e.target.files.length > 0) {
            JSONLens.FileIO.importFile(e.target.files[0]);
          }
          // 重置 input，允许重复选择同一文件
          e.target.value = '';
        });

        // 导出按钮
        elements.btnExport.addEventListener('click', () => {
          JSONLens.FileIO.exportJson();
        });

        // 格式化按钮
        elements.btnFormat.addEventListener('click', () => {
          this.formatJson();
        });

        // 压缩按钮
        elements.btnMinify.addEventListener('click', () => {
          this.minifyJson();
        });

        // 清空按钮
        elements.btnClear.addEventListener('click', () => {
          elements.editor.value = '';
          this.onEditorInput();
          JSONLens.Search.clearSearch();
        });

        // 主题切换按钮
        elements.btnTheme.addEventListener('click', () => {
          JSONLens.Theme.toggle();
        });

        // 全部展开/折叠按钮
        elements.btnExpandAll.addEventListener('click', () => {
          JSONLens.Renderer.expandAll();
        });
        elements.btnCollapseAll.addEventListener('click', () => {
          JSONLens.Renderer.collapseAll();
        });

        // 搜索相关事件
        elements.searchInput.addEventListener('input', JSONLens.Utils.debounce(() => {
          JSONLens.Search.search(elements.searchInput.value);
        }, JSONLens.Config.SEARCH_DEBOUNCE_MS));

        elements.btnSearchPrev.addEventListener('click', () => {
          JSONLens.Search.prevMatch();
        });
        elements.btnSearchNext.addEventListener('click', () => {
          JSONLens.Search.nextMatch();
        });

        // 移动端 Tab 切换
        elements.tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            this.switchTab(btn.dataset.tab);
          });
        });

        // 监听鼠标在树节点上的移动，显示路径 tooltip
        elements.treeContent.addEventListener('mouseover', (e) => {
          const header = e.target.closest('.node-header');
          if (header && header.dataset.path) {
            this.showTooltip(e, header.dataset.path);
          }
        });
        elements.treeContent.addEventListener('mouseout', () => {
          this.hideTooltip();
        });
        elements.treeContent.addEventListener('mousemove', (e) => {
          const header = e.target.closest('.node-header');
          if (header && header.dataset.path) {
            this.moveTooltip(e);
          }
        });

        // 编辑器光标位置变化时更新底部路径显示
        elements.editor.addEventListener('click', () => this.updateCursorPath());
        elements.editor.addEventListener('keyup', () => this.updateCursorPath());
        elements.editor.addEventListener('scroll', () => this.updateCursorPath());
      },

      /**
       * 编辑器内容变化时的处理逻辑
       */
      onEditorInput() {
        const text = this.elements.editor.value;
        JSONLens.State.currentText = text;

        if (!text.trim()) {
          // 空输入时清空状态并显示占位提示
          JSONLens.State.parsedData = null;
          JSONLens.State.rootNode = null;
          JSONLens.State.error = null;
          JSONLens.State.totalNodes = 0;
          JSONLens.Renderer.renderTree(null, this.elements.treeContent);
          this.syncStatusBar();
          return;
        }

        try {
          const result = JSONLens.Parser.parseJson(text);
          JSONLens.State.parsedData = result.data;
          JSONLens.State.rootNode = result.rootNode;
          JSONLens.State.totalNodes = result.totalNodes;
          JSONLens.State.error = null;
          JSONLens.State.lastValidRootNode = result.rootNode;

          JSONLens.Renderer.renderTree(result.rootNode, this.elements.treeContent);
          // 如果当前有搜索关键字，重新执行搜索
          if (JSONLens.State.searchKeyword) {
            JSONLens.Search.search(JSONLens.State.searchKeyword);
          }
        } catch (error) {
          JSONLens.State.error = JSONLens.Parser.extractErrorPosition(error, text);
          // 保留上一次合法视图
          JSONLens.Renderer.renderTree(JSONLens.State.lastValidRootNode, this.elements.treeContent);
        }

        this.syncStatusBar();
      },

      /**
       * 格式化当前 JSON
       */
      formatJson() {
        if (!JSONLens.State.parsedData) {
          JSONLens.Utils.showToast('当前 JSON 不合法，无法格式化');
          return;
        }
        const formatted = JSON.stringify(JSONLens.State.parsedData, null, 2);
        this.elements.editor.value = formatted;
        this.onEditorInput();
      },

      /**
       * 压缩当前 JSON
       */
      minifyJson() {
        if (!JSONLens.State.parsedData) {
          JSONLens.Utils.showToast('当前 JSON 不合法，无法压缩');
          return;
        }
        const minified = JSON.stringify(JSONLens.State.parsedData);
        this.elements.editor.value = minified;
        this.onEditorInput();
      },

      /**
       * 同步底部状态栏信息
       */
      syncStatusBar() {
        const { statusParse, statusNodes } = this.elements;

        if (JSONLens.State.error) {
          statusParse.className = 'status-invalid';
          let msg = 'JSON 非法：' + JSONLens.State.error.message;
          if (JSONLens.State.error.line) {
            msg += '（第 ' + JSONLens.State.error.line + ' 行）';
          }
          statusParse.textContent = msg;
          this.elements.errorBanner.textContent = msg;
          this.elements.errorBanner.classList.add('visible');
        } else if (!JSONLens.State.currentText.trim()) {
          statusParse.className = '';
          statusParse.textContent = '等待输入';
          this.elements.errorBanner.classList.remove('visible');
        } else {
          statusParse.className = 'status-valid';
          statusParse.textContent = 'JSON 合法';
          this.elements.errorBanner.classList.remove('visible');
        }

        statusNodes.textContent = '节点总数：' + JSONLens.State.totalNodes;
      },

      /**
       * 根据光标位置估算当前所在路径
       */
      updateCursorPath() {
        const editor = this.elements.editor;
        const text = editor.value;
        const cursor = editor.selectionStart;
        const beforeCursor = text.substring(0, cursor);
        const line = beforeCursor.split('\n').length;
        this.elements.statusPath.textContent = '行号：' + line + ' | 路径：-';
      },

      /**
       * 切换移动端 Tab
       * @param {string} tab - 'editor' 或 'tree'
       */
      switchTab(tab) {
        const editorPanel = document.getElementById('editor-panel');
        const treePanel = document.getElementById('tree-panel');
        if (tab === 'editor') {
          editorPanel.classList.add('active');
          treePanel.classList.remove('active');
        } else {
          editorPanel.classList.remove('active');
          treePanel.classList.add('active');
        }
        this.elements.tabBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
      },

      /**
       * 显示路径 tooltip
       * @param {MouseEvent} e - 鼠标事件
       * @param {string} text - 提示内容
       */
      showTooltip(e, text) {
        const tooltip = this.elements.tooltip;
        tooltip.textContent = '路径：' + text;
        tooltip.classList.add('visible');
        this.moveTooltip(e);
      },

      /**
       * 隐藏路径 tooltip
       */
      hideTooltip() {
        this.elements.tooltip.classList.remove('visible');
      },

      /**
       * 跟随鼠标移动 tooltip 位置
       * @param {MouseEvent} e - 鼠标事件
       */
      moveTooltip(e) {
        const tooltip = this.elements.tooltip;
        const x = e.clientX + 12;
        const y = e.clientY + 12;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      }
    };

    // ==================== 应用启动 ====================
    // DOM 加载完成后初始化应用
    document.addEventListener('DOMContentLoaded', () => {
      JSONLens.App.init();
    });
  </script>
</body>
</html>
