<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消费降级劝退助手</title>
<style>
:root{--primary:#0d9488;--primary-light:#14b8a6;--primary-dark:#0f766e;--accent:#f59e0b;--accent-light:#fbbf24;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.1);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;background:var(--surface);min-height:100vh;position:relative;overflow:hidden}
.header{padding:24px 16px 16px;text-align:center;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;position:relative;overflow:hidden}
.header::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 60%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.1);opacity:.8}}
.header h1{font-size:24px;font-weight:800;margin-bottom:6px;position:relative;z-index:1;letter-spacing:-.5px}
.header p{font-size:13px;opacity:.9;position:relative;z-index:1}
.header-badge{display:inline-block;margin-top:10px;padding:4px 12px;background:rgba(255,255,255,.2);border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.progress{display:flex;align-items:center;justify-content:center;padding:16px;gap:8px;background:#fff;border-bottom:1px solid var(--border)}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .3s}
.progress-dot.active{background:var(--primary);transform:scale(1.2);box-shadow:0 0 8px rgba(13,148,136,.4)}
.progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;max-width:120px}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .4s ease}
.content{padding:16px;padding-bottom:100px;min-height:calc(100vh - 180px)}
.step-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text);letter-spacing:-.3px}
.step-desc{font-size:14px;color:var(--text-secondary);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text)}
input[type="text"],textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:inherit;transition:all .2s;background:#fff}
input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
textarea{resize:vertical;min-height:90px}
.options{display:flex;flex-direction:column;gap:10px}
.option-card{display:flex;align-items:center;padding:16px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:#fff;position:relative;overflow:hidden}
.option-card:hover{border-color:var(--primary-light);transform:translateY(-1px);box-shadow:var(--shadow)}
.option-card.selected{border-color:var(--primary);background:rgba(13,148,136,.06);transform:translateY(-1px)}
.option-card .check{width:22px;height:22px;border:2px solid var(--border);border-radius:50%;margin-right:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.option-card.selected .check{border-color:var(--primary);background:var(--primary)}
.option-card.selected .check::after{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.option-text{font-size:15px;font-weight:600}
.budget-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.budget-card{text-align:center;padding:18px 12px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:#fff}
.budget-card:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:var(--shadow)}
.budget-card.selected{border-color:var(--primary);background:rgba(13,148,136,.06);transform:translateY(-2px)}
.budget-card .amount{font-size:20px;font-weight:800;color:var(--text)}
.budget-card.selected .amount{color:var(--primary)}
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px 24px;background:#fff;border-top:1px solid var(--border);display:flex;gap:12px;z-index:10}
.btn{flex:1;padding:14px 20px;border-radius:var(--radius);font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s;text-align:center;letter-spacing:.3px}
.btn-secondary{background:var(--bg);color:var(--text-secondary);border:2px solid var(--border)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.3)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(245,158,11,.3)}

/* Welcome */
.welcome{text-align:center;padding:40px 20px}
.welcome-icon{font-size:64px;margin-bottom:16px;display:block;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h2{font-size:22px;font-weight:800;margin-bottom:8px}
.welcome p{color:var(--text-secondary);font-size:14px;margin-bottom:32px;line-height:1.7}
.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:32px}
.feature-item{padding:16px;background:var(--bg);border-radius:var(--radius);text-align:center;border:1.5px solid var(--border)}
.feature-item .emoji{font-size:28px;margin-bottom:6px;display:block}
.feature-item .label{font-size:12px;font-weight:600;color:var(--text)}
.stats-row{display:flex;justify-content:center;gap:24px;margin-bottom:24px}
.stat-item{text-align:center}
.stat-item .num{font-size:24px;font-weight:800;color:var(--primary)}
.stat-item .label{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* Results */
.result-section{margin-bottom:28px}
.result-section-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.result-section-title .icon{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.radar-container{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.radar-container canvas{max-width:100%}
.risk-card{padding:16px;border-radius:var(--radius);margin-bottom:12px;font-size:14px;position:relative;overflow:hidden}
.risk-card.low{background:rgba(34,197,94,.08);border-left:4px solid var(--success);color:#166534}
.risk-card.medium{background:rgba(245,158,11,.08);border-left:4px solid var(--warning);color:#92400e}
.risk-card.high{background:rgba(239,68,68,.08);border-left:4px solid var(--danger);color:#991b1b}
.risk-title{font-weight:700;margin-bottom:6px;font-size:15px}
.risk-score{font-size:32px;font-weight:800;position:absolute;top:12px;right:16px;opacity:.15}
.recommend-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:all .2s;position:relative}
.recommend-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.recommend-badge{position:absolute;top:-1px;right:16px;padding:4px 10px;border-radius:0 0 8px 8px;font-size:11px;font-weight:700;color:#fff}
.recommend-badge.gold{background:var(--accent)}
.recommend-badge.silver{background:var(--text-secondary)}
.recommend-badge.bronze{background:#b45309}
.recommend-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.recommend-type{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(13,148,136,.1);color:var(--primary-dark);font-weight:700}
.recommend-coverage{font-size:13px;color:var(--text-secondary);font-weight:600}
.recommend-name{font-size:17px;font-weight:700;margin-bottom:4px}
.recommend-price{color:var(--primary);font-size:20px;font-weight:800}
.recommend-price .original{text-decoration:line-through;color:var(--text-secondary);font-size:13px;font-weight:500;margin-left:8px}
.recommend-note{font-size:13px;color:var(--text-secondary);margin-top:10px;line-height:1.6}
.coverage-bar{height:8px;background:var(--border);border-radius:4px;margin-top:10px;overflow:hidden}
.coverage-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.advice-list{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:18px}
.advice-item{display:flex;gap:12px;margin-bottom:14px;font-size:14px;align-items:flex-start}
.advice-item:last-child{margin-bottom:0}
.advice-item .icon-bg{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.export-area{background:#f1f5f9;border:2px solid var(--border);border-radius:var(--radius);padding:18px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:monospace;margin-top:16px;overflow-x:auto}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.slide-in{animation:slideIn .35s ease}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.scale-in{animation:scaleIn .4s ease}

/* Analysis loading */
.analyzing{text-align:center;padding:48px 20px}
.analyzing-spinner{width:56px;height:56px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing p{color:var(--text-secondary);font-size:14px;margin-bottom:8px}
.analyzing-dots{display:inline-flex;gap:4px}
.analyzing-dots span{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:dotPulse 1.4s ease-in-out infinite both}
.analyzing-dots span:nth-child(1){animation-delay:-.32s}
.analyzing-dots span:nth-child(2){animation-delay:-.16s}
@keyframes dotPulse{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Matrix */
.matrix-container{position:relative;width:100%;height:240px;background:#fff;border:2px solid var(--border);border-radius:var(--radius);overflow:hidden}
.matrix-bg{position:absolute;inset:0}
.matrix-bg .q{width:50%;height:50%;float:left;opacity:.12}
.matrix-bg .q1{background:var(--success)}
.matrix-bg .q2{background:var(--warning)}
.matrix-bg .q3{background:var(--danger)}
.matrix-bg .q4{background:var(--border)}
.matrix-label{position:absolute;font-size:10px;color:var(--text-secondary);font-weight:600}
.matrix-label.lt{top:6px;left:6px}
.matrix-label.rt{top:6px;right:6px}
.matrix-label.lb{bottom:6px;left:6px}
.matrix-label.rb{bottom:6px;right:6px}
.matrix-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);transform:translate(-50%,-50%);animation:dotPulse2 2s ease-in-out infinite}
@keyframes dotPulse2{0%,100%{box-shadow:0 2px 8px rgba(13,148,136,.3)}50%{box-shadow:0 2px 16px rgba(13,148,136,.6)}}

/* Comparison table */
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
.compare-table th,.compare-table td{padding:12px 10px;text-align:left;border-bottom:1.5px solid var(--border)}
.compare-table th{color:var(--text-secondary);font-weight:600;font-size:12px;background:var(--bg)}
.compare-table td{font-weight:600}
.compare-table .highlight{color:var(--primary);font-weight:700;font-size:14px}
.compare-table tr:hover td{background:rgba(13,148,136,.03)}

/* History */
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{padding:14px 16px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s}
.history-item:hover{border-color:var(--primary-light);background:rgba(13,148,136,.04)}
.history-item .name{font-size:14px;font-weight:600;margin-bottom:4px}
.history-item .meta{font-size:12px;color:var(--text-secondary)}
.history-empty{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px}

/* Responsive */
@media(min-width:481px){.app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>消费降级劝退助手</h1>
    <p>买之前先被 AI 劝一遍，消费降级不降质</p>
    <div class="header-badge">TRAE AI 创造力大赛 · 生活娱乐赛道</div>
  </div>
  <div class="progress" id="progressBar">
    <div class="progress-dot active"></div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:0%"></div></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer">
    <button class="btn btn-secondary" id="btnPrev" onclick="prevStep()" style="display:none">上一步</button>
    <button class="btn btn-primary" id="btnNext" onclick="nextStep()">开始体验</button>
  </div>
</div>

<script>
// ===== Knowledge Base =====
const knowledgeBase={categories:[{name:"美妆个护",items:[{name:"SK-II 神仙水 230ml",price:1690,category:"护肤精华",substitutes:[{name:"肌活糙米水 215ml",price:198,coverage:85,note:"同样含发酵滤液，控油维稳效果接近"},{name:"自然之名酵母水 200ml",price:89,coverage:75,note:"平价酵母精华水，基础保湿维稳"}],audience:"油皮/混油皮"},{name:"雅诗兰黛小棕瓶 50ml",price:935,category:"护肤精华",substitutes:[{name:"欧莱雅黑精华 50ml",price:299,coverage:80,note:"同集团同源二裂酵母，抗初老功效接近"},{name:"Purid 2号精华 50ml",price:119,coverage:70,note:"主打修护维稳，性价比极高"}],audience:"初老肌"},{name:"戴森吹风机 HD15",price:3199,category:"美发电器",substitutes:[{name:"徕芬 LF03",price:599,coverage:90,note:"同样11万转高速马达，温控和风力接近"},{name:"米家高速吹风机 H501",price:249,coverage:80,note:"2亿负离子，基础速干需求满足"}],audience:"中长发"},{name:"Lamer 面霜 60ml",price:3080,category:"面霜",substitutes:[{name:"FAB 急救面霜 170g",price:189,coverage:75,note:"同样主打修护屏障，急救舒缓效果好"},{name:"薇诺娜特护霜 50g",price:268,coverage:80,note:"国货修护标杆，敏感肌友好"}],audience:"敏感肌"}]},{name:"数码家电",items:[{name:"AirPods Pro 2",price:1899,category:"耳机",substitutes:[{name:"漫步者 Lolli Pro3",price:359,coverage:82,note:"同样支持 LDAC 高清解码和主动降噪"},{name:"Redmi Buds 5 Pro",price:399,coverage:80,note:"52dB 降噪深度，同价位性能突出"}],audience:"通勤族"},{name:"iPad Pro 11寸 256G",price:7599,category:"平板电脑",substitutes:[{name:"小米平板 6S Pro 12.4",price:3299,coverage:85,note:"同样骁龙8Gen2，屏幕更大分辨率更高"},{name:"vivo Pad3 Pro",price:2999,coverage:80,note:"天玑9300，影音和笔记体验优秀"}],audience:"学生/轻办公"},{name:"索尼 WH-1000XM5",price:2499,category:"头戴耳机",substitutes:[{name:"漫步者 W860NB Pro",price:549,coverage:80,note:"同样支持 LDAC 和主动降噪，续航更长"},{name:"QCY H3",price:199,coverage:70,note:"43dB 降噪，基础头戴降噪需求满足"}],audience:"长途飞行"},{name:"戴森吸尘器 V12",price:4499,category:"清洁电器",substitutes:[{name:"追觅 V12S",price:1699,coverage:88,note:"同样15万转马达，绿光显尘功能"},{name:"米家无线吸尘器 2 Pro",price:1299,coverage:80,note:"190AW吸力，满足日常清洁需求"}],audience:"养宠家庭"}]},{name:"日用百货",items:[{name:"The Laundress 洗衣液 1L",price:210,category:"衣物清洁",substitutes:[{name:"绽家洗衣液 1.2L",price:69,coverage:88,note:"同样植萃配方，留香持久，洗护合一"},{name:"蓝月亮至尊浓缩",price:45,coverage:80,note:"浓缩配方，清洁力达标"}],audience:"精致衣物护理"},{name:"Tempo 抽纸 18包",price:76,category:"纸品",substitutes:[{name:"维达棉韧 24包",price:45,coverage:90,note:"同样4层加厚，触感接近"},{name:"洁柔 Face 24包",price:39,coverage:85,note:"可湿水，柔韧度好"}],audience:"家庭囤货"},{name:"无印良品收纳盒 大号",price:98,category:"收纳",substitutes:[{name:"太力收纳箱 同款尺寸",price:29,coverage:90,note:"同样PP材质，可叠加设计"},{name:"宜家 SAMLA",price:19,coverage:85,note:"透明可视，性价比极高"}],audience:"租房/小户型"},{name:"象印保温杯 480ml",price:299,category:"杯具",substitutes:[{name:"富光保温杯 500ml",price:59,coverage:88,note:"同样316不锈钢，保温效果接近"},{name:"小米保温杯 2 500ml",price:79,coverage:85,note:"极简设计，保温性能优秀"}],audience:"日常通勤"}]},{name:"服装鞋包",items:[{name:"Canada Goose 羽绒服",price:9500,category:"羽绒服",substitutes:[{name:"波司登极寒系列",price:1999,coverage:90,note:"同样鹅绒填充，蓬松度700+，御寒等级相当"},{name:"凯乐石羽绒服",price:1200,coverage:85,note:"专业户外品牌，保暖性能优秀"}],audience:"北方严寒"},{name:"New Balance 990v6",price:1999,category:"运动鞋",substitutes:[{name:"安踏 C37 3.0",price:399,coverage:82,note:"同样强调缓震舒适，日常通勤脚感接近"},{name:"李宁 越影 3 Pro",price:498,coverage:80,note:"全掌䨻科技，缓震回弹优秀"}],audience:"日常通勤"},{name:"Longchamp 饺子包",price:1100,category:"通勤包",substitutes:[{name:"龙骧同款尼龙包",price:89,coverage:85,note:"1688同源工厂，材质和容量一致"},{name:"优衣库饺子包",price:149,coverage:80,note:"同样轻便防水，多色可选"}],audience:"上班族"},{name:"始祖鸟 Beta Jacket",price:4500,category:"冲锋衣",substitutes:[{name:"凯乐石 Mont-X",price:1800,coverage:88,note:"同样Gore-Tex面料，专业户外性能接近"},{name:"伯希和 北极星",price:899,coverage:80,note:"eVent面料，透气性优秀"}],audience:"户外爱好者"}]}]};

// ===== State =====
let state={step:-1,input:{productName:"",scenarios:[],budgetRange:"",priorities:[],concerns:""},analysis:null,recommendations:null,advice:null};
const scenarios=[{id:"commute",label:"日常通勤",weight:30},{id:"home",label:"居家办公",weight:25},{id:"travel",label:"户外旅行",weight:10},{id:"social",label:"社交聚会",weight:15},{id:"work",label:"专业工作",weight:20},{id:"other",label:"其他",weight:15}];
const budgets=[{id:"<100",label:"100元以内",max:100},{id:"100-500",label:"100-500元",max:500},{id:"500-1000",label:"500-1000元",max:1000},{id:"1000-3000",label:"1000-3000元",max:3000},{id:">3000",label:"3000元以上",max:99999}];
const priorities=[{id:"function",label:"功能优先"},{id:"brand",label:"品牌认同"},{id:"design",label:"颜值设计"},{id:"quality",label:"耐用品质"},{id:"social",label:"社交属性"}];

// ===== Render =====
function render(){
  const content=document.getElementById('content');
  const btnPrev=document.getElementById('btnPrev');
  const btnNext=document.getElementById('btnNext');
  updateProgress();
  if(state.step===-1)renderWelcome(content);
  else if(state.step===0)renderStep0(content);
  else if(state.step===1)renderStep1(content);
  else if(state.step===2)renderStep2(content);
  else if(state.step===3)renderStep3(content);
  else if(state.step===4)renderStep4(content);
  else if(state.step===5)renderAnalyzing(content);
  else if(state.step===6)renderResults(content);
  else if(state.step===99)renderHistory(content);
  if(state.step===-1){btnPrev.style.display='none';btnNext.textContent='开始体验';btnNext.disabled=false;}
  else if(state.step===0){btnPrev.style.display='none';btnNext.textContent='下一步';btnNext.disabled=!state.input.productName.trim();}
  else if(state.step===1){btnPrev.style.display='block';btnNext.textContent='下一步';btnNext.disabled=state.input.scenarios.length===0;}
  else if(state.step===2){btnPrev.style.display='block';btnNext.textContent='下一步';btnNext.disabled=!state.input.budgetRange;}
  else if(state.step===3){btnPrev.style.display='block';btnNext.textContent='下一步';btnNext.disabled=state.input.priorities.length===0;}
  else if(state.step===4){btnPrev.style.display='block';btnNext.textContent='开始分析';btnNext.disabled=false;}
  else if(state.step===5){btnNext.style.display='none';btnPrev.style.display='none';}
  else if(state.step===6){btnNext.style.display='block';btnNext.textContent='查看历史';btnNext.disabled=false;btnNext.onclick=()=>{state.step=99;render();};btnPrev.style.display='block';btnPrev.textContent='再测一个';btnPrev.onclick=()=>{location.reload();};}
  else if(state.step===99){btnNext.style.display='block';btnNext.textContent='开始体验';btnNext.onclick=()=>{state.step=-1;render();};btnPrev.style.display='none';}
}

function updateProgress(){
  const dots=document.querySelectorAll('.progress-dot');

  if(state.step<0||state.step>4){bar.style.display='none';return;}

  const pct=(state.step+1)*20;
  fill.style.width=pct+'%';
  dots.forEach((d,i)=>d.classList.toggle('active',i<=state.step));
}

// ===== Analysis Engine =====
function doAnalysis(){
  const inp=state.input;
  const funcScore=Math.min(100,(inp.scenarios.includes('work')?20:0)+(inp.priorities.includes('function')?30:0)+(inp.priorities.includes('quality')?15:0)+30);
  const emoScore=Math.min(100,(inp.priorities.includes('design')?25:0)+(inp.priorities.includes('brand')?20:0)+20);
  const socScore=Math.min(100,(inp.scenarios.includes('social')?30:0)+(inp.priorities.includes('social')?40:0)+10);
  state.analysis={functional:funcScore,emotional:emoScore,social:socScore};
  let riskScore=0,riskReasons=[];
  const maxBudget=budgets.find(b=>b.id===inp.budgetRange)?.max||99999;
  const matchedItem=findMatchedItem(inp.productName);
  if(matchedItem&&maxBudget>matchedItem.price*2){riskScore+=20;riskReasons.push('预算远超商品 typical 价格，存在过度消费倾向');}
  if(inp.scenarios.length===1&&inp.scenarios[0]==='travel'){riskScore+=25;riskReasons.push('仅用于低频场景（户外旅行），使用频率可能很低');}
  if(inp.priorities.length===1&&(inp.priorities[0]==='brand'||inp.priorities[0]==='social')){riskScore+=30;riskReasons.push('决策权重过于侧重品牌/社交，功能价值可能被忽视');}
  if(inp.concerns.trim().length>0&&!/[不没难慢坏差]/.test(inp.concerns)){riskScore+=15;riskReasons.push('已有替代品但未表达明确不满，替换动力不足');}
  state.analysis.riskScore=Math.min(100,riskScore);
  state.analysis.riskReasons=riskReasons.length?riskReasons:['需求描述较为理性，暂未发现明显风险'];
  const freqWeight={commute:30,home:25,travel:10,social:15,work:20,other:15};
  const freqScore=inp.scenarios.reduce((sum,s)=>sum+(freqWeight[s]||15),0);
  const irreplaceability=inp.concerns.trim()?70:50;
  state.analysis.frequency=Math.min(100,freqScore);
  state.analysis.irreplaceability=irreplaceability;
  state.recommendations=generateRecommendations(inp,matchedItem);
  state.advice=generateAdvice(inp,state.analysis,matchedItem);
  state.step=6;
  saveHistory();
}

function findMatchedItem(productName){
  const pn=productName.toLowerCase();
  for(const cat of knowledgeBase.categories){
    for(const item of cat.items){
      const itemName=item.name.toLowerCase();
      const keywords=itemName.split(/[\s\-]+/).filter(w=>w.length>1);
      for(const kw of keywords){if(pn.includes(kw))return item;}
      if(itemName.includes(pn))return item;
    }
  }
  for(const cat of knowledgeBase.categories){
    for(const item of cat.items){
      if(pn.includes(cat.name.slice(0,2)))return item;
    }
  }
  return null;
}

function generateRecommendations(inp,matchedItem){
  const recs=[];
  const maxB=budgets.find(b=>b.id===inp.budgetRange)?.max||99999;
  if(matchedItem){
    matchedItem.substitutes.forEach(sub=>{
      if(sub.price<=maxB){
        const valueScore=(sub.coverage/100)/(sub.price/Math.max(matchedItem.price,1))*100;
        recs.push({type:'direct',original:matchedItem,substitute:sub,similarityScore:sub.coverage,valueScore:Math.round(valueScore)});
      }
    });
  }
  if(recs.length===0){
    for(const cat of knowledgeBase.categories){
      for(const item of cat.items){
        if(inp.productName.includes(cat.name.slice(0,2))){
          item.substitutes.forEach(sub=>{
            if(sub.price<=maxB){
              const valueScore=(sub.coverage/100)/(sub.price/Math.max(item.price,1))*100;
              recs.push({type:'direct',original:item,substitute:sub,similarityScore:sub.coverage,valueScore:Math.round(valueScore)});
            }
          });
        }
      }
    }
  }
  recs.sort((a,b)=>b.valueScore-a.valueScore);
  return recs.slice(0,3);
}

function generateAdvice(inp,analysis,matchedItem){
  const advices=[];
  const risk=analysis.riskScore;
  const freq=analysis.frequency;
  if(risk>60)advices.push({icon:'&#9208;',text:'<b>建议暂缓购买</b>，观察 30 天是否仍有需求。高伪需求风险商品往往冲动消费后吃灰。'});
  else if(risk>30)advices.push({icon:'&#128197;',text:'<b>非急需</b>，建议等大促（618 / 双11 / 黑五）再入手，通常能省 15-30%。'});
  else if(freq>60)advices.push({icon:'&#9989;',text:'<b>真实高频需求</b>，建议立即购买。高频使用意味着单次使用成本极低。'});
  else advices.push({icon:'&#129300;',text:'<b>需求频率一般</b>，可考虑二手或租赁方案，进一步降低试错成本。'});
  const pn=inp.productName.toLowerCase();
  if(pn.includes('手机')||pn.includes('耳机')||pn.includes('平板')||pn.includes('吹风')||pn.includes('吸尘')||pn.includes('键盘')||pn.includes('显示')){
    advices.push({icon:'&#128722;',text:'<b>数码家电推荐渠道</b>：京东自营（售后保障）/ 拼多多百亿补贴（价格优势）'});
  }else if(pn.includes('霜')||pn.includes('精华')||pn.includes('水')||pn.includes('面膜')||pn.includes('洁面')){
    advices.push({icon:'&#128722;',text:'<b>美妆个护推荐渠道</b>：天猫旗舰店（正品保障）/ 中免日上（免税价格）'});
  }else if(pn.includes('洗衣')||pn.includes('纸')||pn.includes('收纳')||pn.includes('杯')){
    advices.push({icon:'&#128722;',text:'<b>日用百货推荐渠道</b>：1688 同源工厂（批发价）/ 天猫超市（次日达）'});
  }else{
    advices.push({icon:'&#128722;',text:'<b>综合推荐</b>：京东自营 / 天猫旗舰店，大促期间叠加满减券最优'});
  }
  advices.push({icon:'&#128161;',text:'<b>省钱策略</b>：开通京东 Plus / 88VIP 享额外折扣，或通过返利平台下单再省 3-10%'});
  if(matchedItem){
    const save=matchedItem.price-(matchedItem.substitutes[0]?.price||0);
    if(save>0)advices.push({icon:'&#128176;',text:`<b>选择推荐平替可预估节省 &yen;${save}</b>，相当于原价的 ${Math.round(save/matchedItem.price*100)}%`});
  }
  return advices;
}

function drawRadar(){
  const canvas=document.getElementById('radarChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=300,h=260;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  const cx=w/2,cy=h/2+15,radius=78;
  const dims=[{label:'功能性',score:state.analysis.functional},{label:'情感价值',score:state.analysis.emotional},{label:'社交属性',score:state.analysis.social},{label:'使用频率',score:state.analysis.frequency},{label:'不可替代',score:state.analysis.irreplaceability}];
  const angleStep=(Math.PI*2)/dims.length;
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  for(let level=1;level<=4;level++){
    ctx.beginPath();
    for(let i=0;i<=dims.length;i++){const angle=i*angleStep-Math.PI/2;const dist=(radius/4)*level;const x=cx+Math.cos(angle)*dist;const y=cy+Math.sin(angle)*dist;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.closePath();ctx.stroke();
  }
  ctx.beginPath();
  for(let i=0;i<dims.length;i++){const angle=i*angleStep-Math.PI/2;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*radius,cy+Math.sin(angle)*radius);}
  ctx.stroke();
  ctx.beginPath();ctx.fillStyle='rgba(13,148,136,0.18)';ctx.strokeStyle='var(--primary)';ctx.lineWidth=2.5;
  for(let i=0;i<=dims.length;i++){const dim=dims[i%dims.length];const angle=(i%dims.length)*angleStep-Math.PI/2;const dist=(dim.score/100)*radius;const x=cx+Math.cos(angle)*dist;const y=cy+Math.sin(angle)*dist;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.closePath();ctx.fill();ctx.stroke();
  for(let i=0;i<dims.length;i++){const dim=dims[i];const angle=i*angleStep-Math.PI/2;const dist=(dim.score/100)*radius;const x=cx+Math.cos(angle)*dist;const y=cy+Math.sin(angle)*dist;ctx.beginPath();ctx.fillStyle='var(--primary)';ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='var(--text-secondary)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<dims.length;i++){const angle=i*angleStep-Math.PI/2;const x=cx+Math.cos(angle)*(radius+22);const y=cy+Math.sin(angle)*(radius+22);ctx.fillText(dims[i].label,x,y);}
}

function generateExportText(){
  const inp=state.input,r=state.recommendations;
  let text=`【消费降级劝退助手 · 购买清单】\n&#128230; 商品：${inp.productName}\n`;
  if(r.length){
    text+=`&#128161; 推荐平替：${r[0].substitute.name}\n&#128176; 预估节省：&yen;${r[0].original.price-r[0].substitute.price} (${Math.round((r[0].original.price-r[0].substitute.price)/r[0].original.price*100)}%)\n`;
  }
  text+=`&#128205; 推荐渠道：京东自营 / 天猫旗舰店\n&#9200; 购买时机：${state.analysis.riskScore>30?'建议等大促':'真实需求，可立即购买'}\n&#128161; 省钱Tips：开通会员享折扣，或通过返利平台下单\n\n&#127775; 需求风险评分：${state.analysis.riskScore}/100\n&#128200; 使用频率：${state.analysis.frequency}/100\n&#128273; 不可替代性：${state.analysis.irreplaceability}/100`;
  return text;
}
function copyExport(){
  const text=document.getElementById('exportArea').textContent;
  navigator.clipboard?.writeText(text).then(()=>{
    const btn=document.querySelector('.btn-accent');
    const orig=btn.innerHTML;btn.innerHTML='&#9989; 已复制';
    setTimeout(()=>btn.innerHTML=orig,2000);
  });
}

// Init
render();
</script>
