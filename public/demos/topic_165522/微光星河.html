.text-gradient-pink{background:linear-gradient(135deg,#F472B6,#FDE047,#60A5FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

@keyframes bounce-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.modal{animation:fade-in 0.2s ease-out}

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    saveData(INITIAL_DATA);
    return JSON.parse(JSON.stringify(INITIAL_DATA));
  }
  function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {} }
  function resetData() { localStorage.removeItem(STORAGE_KEY); location.reload(); }

  // ================== Tiny React-like Renderer ==================
  // 极简虚拟DOM渲染器
  function h(tag, props, ...children) {
    props = props || {};
    return { tag, props, children: children.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false) };
  }

  function escapeHtml(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderToHtml(node) {
    if (node === null || node === undefined || node === false) return '';
    if (typeof node === 'string' || typeof node === 'number') return escapeHtml(String(node));
    if (Array.isArray(node)) return node.map(renderToHtml).join('');
    if (typeof node === 'object' && node.tag) {
      const { tag, props, children } = node;
      const className = props.className ? ' class="' + escapeHtml(props.className) + '"' : '';
      const style = props.style ? ' style="' + escapeHtml(props.style) + '"' : '';
      const onclick = props.onClick ? ' onclick="window.__app.handleEvent(\'' + props.__eventId + '\', event)"' : '';
      const attrs = [];
      for (const k in props) {
        if (k === 'className' || k === 'children' || k === 'style' || k === 'onClick' || k === '__eventId') continue;
        const v = props[k];
        if (v === true) attrs.push(k);
        else if (v !== false && v !== null && v !== undefined) attrs.push(k + '="' + escapeHtml(String(v)) + '"');
      }
      const attrStr = (className + style + onclick + (attrs.length ? ' ' + attrs.join(' ') : ''));
      if (tag === 'img' || tag === 'input' || tag === 'br' || tag === 'hr' || tag === 'meta' || tag === 'link') {
        return '<' + tag + attrStr + '/>';
      }
      const inner = children.map(renderToHtml).join('');
      return '<' + tag + attrStr + '>' + inner + '</' + tag + '>';
    }
    return '';
  }

    showLetterModal: false,
    letterContent: '',
    flowers: 3,
    listeners: [],
    subscribe(fn) { this.listeners.push(fn); },
    notify() { this.listeners.forEach(fn => fn()); saveData(this.data); },
    navigate(route, params) {
      this.route = route;
      if (params && params.wishId) this.wishDetailId = params.wishId;
      window.scrollTo(0, 0);
      this.notify();
    }
  };

  // ================== Event Handlers ==================
  App.handleEvent = function(eventId, e) {
    e = e || window.event;
    const [type, ...args] = eventId.split('|');
    if (type === 'nav') {
      this.navigate(args[0]);
    } else if (type === 'wish-tab') {
      this.wishesTab = args[0]; this.notify();
    } else if (type === 'wish-detail') {
      this.navigate('wishDetail', { wishId: args[0] });
    } else if (type === 'publish-type') {
      this.publishType = args[0]; this.publishForm.type = ''; this.notify();
    } else if (type === 'help-type') {
      this.publishForm.type = args[0]; this.notify();
    } else if (type === 'input-title') {
      this.publishForm.title = e.target.value;
    } else if (type === 'input-desc') {
      this.publishForm.description = e.target.value;
    } else if (type === 'input-letter') {
      this.letterContent = e.target.value;
    } else if (type === 'publish-submit') {
      this.submitWish();
    } else if (type === 'claim') {
      this.claimWish(args[0]);
    } else if (type === 'complete') {
      this.showCompleteModal = true; this.notify();
    } else if (type === 'submit-photo') {
      this.submitComplete();
    } else if (type === 'letter-open') {
      this.showLetterModal = true; this.notify();
    } else if (type === 'flowers') {
      this.flowers = parseInt(args[0]); this.notify();
    } else if (type === 'submit-letter') {
      this.submitLetter();
    } else if (type === 'building') {
      const b = this.data.buildings.find(x => x.id === args[0]);
      this.selectedBuilding = b; this.notify();
    } else if (type === 'close-building') {
      this.selectedBuilding = null; this.notify();
    } else if (type === 'close-modal') {
      this.showCompleteModal = false; this.showLetterModal = false; this.notify();
    } else if (type === 'back') {
      this.navigate('home');
    } else if (type === 'reset-data') {
      if (confirm('确定要重置所有数据吗？')) resetData();
    }
  };

  // ================== Business Logic ==================
  App.submitWish = function() {
    const f = this.publishForm;
    if (!f.title || !f.description.trim()) { alert('请填写完整信息'); return; }
    const content = f.title + f.description;
    const tags = [];
    if (content.indexOf('老人') >= 0 || content.indexOf('奶奶') >= 0 || content.indexOf('爷爷') >= 0) tags.push('老人');
    if (content.indexOf('陪伴') >= 0 || content.indexOf('聊天') >= 0) tags.push('陪伴');
    if (content.indexOf('快递') >= 0) tags.push('取快递');
    if (content.indexOf('垃圾') >= 0) tags.push('扔垃圾');
    if (content.indexOf('手机') >= 0 || content.indexOf('教') >= 0) tags.push('教学');
    if (tags.length === 0) tags.push('其他');

    const u = this.data.currentUser;
    const bid = parseInt(u.building);
    const wish = {
      id: genId(),
      type: this.publishType,
      title: f.title,
      description: f.description,
      publisherId: u.id,
      publisherNickname: u.nickname,
      publisherBuilding: u.building + '栋' + u.unit,
      targetBuilding: u.building + '栋',
      tags: tags,
      verified: this.publishType === 'help',
      status: 'open',
      helperId: null,
      helperNickname: null,
      buildingId: 'b' + (bid < 10 ? '0' + bid : bid),
      createdAt: Date.now()
    };
    this.data.wishes.unshift(wish);
    this.publishForm = { title: '', description: '', type: '' };
    this.publishType = 'help';
    this.navigate('publishSuccess');
  };

  App.claimWish = function(wishId) {
    const w = this.data.wishes.find(x => x.id === wishId);
    if (!w) return;
    if (w.publisherId === this.data.currentUser.id) { alert('不能认领自己发布的心愿'); return; }
    w.status = 'in_progress';
    w.helperId = this.data.currentUser.id;
    w.helperNickname = this.data.currentUser.nickname;
    this.notify();
    alert('已认领，快去帮助邻居吧！');
  };

  App.submitComplete = function() {
    const w = this.data.wishes.find(x => x.id === this.wishDetailId);
    if (!w) return;
    w.status = 'completed';
    w.completedPhoto = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120"><rect fill="%2334D399" width="200" height="120"/><text x="50%" y="50%" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle">✓ 温暖瞬间</text></svg>';
    w.completedAt = Date.now();
    const b = this.data.buildings.find(x => x.id === w.buildingId);
    if (b) b.stars += 1;
    this.data.currentUser.totalHelps += 1;
    this.data.currentUser.totalPoints += 10;
    this.data.currentUser.exp += 10;
    this.data.currentUser.level = getLevelInfo(this.data.currentUser.exp).level;
    this.showCompleteModal = false;
    this.showLetterModal = true;
    this.notify();
  };

  App.submitLetter = function() {
    if (this.letterContent.length < 10) { alert('感谢信至少需要10个字'); return; }
    const w = this.data.wishes.find(x => x.id === this.wishDetailId);
    if (!w) return;
    this.data.letters.unshift({
      id: genId(),
      wishId: w.id,
      fromUserId: w.publisherId,
      fromNickname: w.publisherNickname,
      toUserId: w.helperId,

      content: this.letterContent,
      flowers: this.flowers,
      createdAt: Date.now()
    });
    this.showLetterModal = false;
    this.letterContent = '';
    this.notify();
    this.navigate('letters');
  };

            ),
            h('div', { className: 'flex items-center gap-1' },
              [...Array(Math.min(5, letters.length))].map(() => h('span', { className: 'text-lg' }, '🌸'))
            )
          )
        )
      ),
      h('div', { className: 'px-4 pb-6 space-y-4' },
        letters.length === 0 ? h('div', { className: 'text-center py-16' },
          h('div', { className: 'w-24 h-24 bg-star-blue-light/30 rounded-full flex items-center justify-center mx-auto mb-6' }, Icon('Heart', 48, 'text-star-blue-lighter')),
          h('p', { className: 'text-star-blue-lighter text-lg' }, '暂无感谢信')
        ) : letters.map((l, i) => h('div', { className: 'bg-card rounded-2xl p-5 animate-slide-up', style: 'animation-delay:' + (i * 0.05) + 's' },
          h('div', { className: 'flex items-center justify-between mb-4' },
            h('div', { className: 'flex items-center gap-3' },
              h('div', { className: 'w-10 h-10 rounded-full bg-pink-warm/20 flex items-center justify-center' }, Icon('Heart', 20, 'text-pink-warm')),
              h('div', null,
                h('p', { className: 'text-white font-medium' }, l.fromNickname),
                h('p', { className: 'text-star-blue-lighter text-xs' }, '写给 ' + l.toNickname)
              )
            ),
            h('span', { className: 'text-star-blue-lighter text-xs' }, formatTime(l.createdAt))
          ),
          h('div', { className: 'relative' },
            h('div', { className: 'absolute -top-2 -left-2 text-2xl text-pink-warm/30' }, '"'),
            h('p', { className: 'text-white leading-relaxed pl-4 italic' }, l.content),
            h('div', { className: 'absolute -bottom-2 -right-2 text-2xl text-pink-warm/30', style: 'transform:rotate(180deg)' }, '"')
          ),
          h('div', { className: 'flex items-center justify-between mt-4 pt-4 border-t border-star-blue-lighter/30' },
            h('div', { className: 'flex items-center gap-1' },
              [...Array(l.flowers)].map(() => h('span', { className: 'text-lg' }, '🌸'))
            ),
            h('span', { className: 'text-pink-warm text-xs font-medium' }, l.flowers + '朵小花')
          )
        ))
      )
    ));
  }

  // ---- Profile ----
  function renderProfile() {
    const u = App.data.currentUser;
    const lv = getLevelInfo(u.exp);
    const credit = getCreditLevel(u.creditScore || 60);
    const nextLv = LEVELS.find(l => l.level === u.level + 1);
    const progress = nextLv ? ((u.exp - lv.minExp) / (nextLv.minExp - lv.minExp)) * 100 : 100;

    return renderLayout(h('div', { className: 'min-h-screen' },
      h('div', { className: 'bg-gradient-to-b from-star-blue-light/80 to-star-blue p-6 pb-24' },
        h('div', { className: 'flex items-center gap-4' },
          h('div', { className: 'relative' },
            h('div', { className: 'w-20 h-20 rounded-full bg-card-warm flex items-center justify-center border-2 border-warm-yellow shadow-glow-yellow' }, Icon('User', 40, 'text-warm-yellow')),
            h('span', { className: 'absolute -bottom-1 -right-1 text-2xl' }, lv.icon)
          ),
          h('div', null,
            h('h2', { className: 'text-xl font-bold text-white' }, u.nickname),
            h('p', { className: 'text-star-blue-lighter text-sm' }, u.building + '栋 ' + u.unit),
            h('div', { className: 'flex items-center gap-2 mt-2' },
              h('span', { className: 'px-2.5 py-1 bg-warm-yellow/20 text-warm-yellow rounded-full text-xs font-medium' }, lv.icon + ' ' + lv.name),
              u.verified ? h('span', { className: 'px-2.5 py-1 bg-green-soft/20 text-green-soft rounded-full text-xs font-medium flex items-center gap-1' }, Icon('ShieldCheck', 12), '已认证') : null
            )
          )
        ),
        nextLv ? h('div', { className: 'mt-6' },
          h('div', { className: 'flex justify-between text-xs text-star-blue-lighter mb-2' },
            h('span', null, '经验值 ' + u.exp),
            h('span', null, '距离下一级还需 ' + (nextLv.minExp - u.exp))
          ),
          h('div', { className: 'relative h-3 bg-star-blue/50 rounded-full overflow-hidden' },
            h('div', { className: 'absolute inset-y-0 left-0 bg-gradient-to-r from-warm-yellow to-warm-yellow-dark rounded-full', style: 'width:' + progress + '%' })
          )
        ) : null
      ),
      h('div', { className: 'px-4 relative', style: 'margin-top:-64px' },
        h('div', { className: 'bg-card rounded-3xl p-5 border border-star-blue-lighter shadow-medium' },
          h('div', { className: 'grid grid-cols-3 gap-4 text-center' },
            h('div', { className: 'p-3 bg-star-blue/50 rounded-2xl' },
              h('p', { className: 'text-2xl font-bold text-gradient-warm' }, String(u.totalHelps)),
              h('p', { className: 'text-xs text-star-blue-lighter mt-1' }, '温暖次数')
            ),
            h('div', { className: 'p-3 bg-star-blue/50 rounded-2xl' },
              h('p', { className: 'text-2xl font-bold text-gradient-pink' }, String(u.totalPoints)),
              h('p', { className: 'text-xs text-star-blue-lighter mt-1' }, '善能积分')
            ),
            h('div', { className: 'p-3 bg-star-blue/50 rounded-2xl' },
              h('p', { className: 'text-2xl font-bold text-blue-sky' }, String((u.badges || []).length)),
              h('p', { className: 'text-xs text-star-blue-lighter mt-1' }, '获得勋章')
            )
          )
        )
      ),
      h('div', { className: 'px-4 mt-6' },
        h('div', { className: 'bg-card rounded-3xl p-5 border border-star-blue-lighter' },
          h('h3', { className: 'text-white font-bold mb-4 flex items-center gap-2' }, Icon('Sparkles', 20, 'text-warm-yellow'), '个人星河档案馆'),
          h('div', { className: 'space-y-3' },
            h('div', { className: 'flex items-center gap-4 p-4 bg-star-blue/50 rounded-xl' },
              h('div', { className: 'w-12 h-12 rounded-full bg-green-soft/20 flex items-center justify-center' }, Icon('Gauge', 24, credit.color)),
              h('div', { className: 'flex-1' },
                h('p', { className: 'text-white font-medium' }, '互助信用分'),
                h('p', { className: 'text-star-blue-lighter text-xs' }, '当前 ' + (u.creditScore || 60) + ' 分 · ' + credit.label)
              ),
              h('span', { className: 'text-2xl font-bold ' + credit.color }, String(u.creditScore || 60))
            ),
            h('div', { className: 'flex items-center gap-4 p-4 bg-star-blue/50 rounded-xl' },
              h('div', { className: 'w-12 h-12 rounded-full ' + (u.verified ? 'bg-green-soft/20' : 'bg-pink-warm/20') + ' flex items-center justify-center' }, Icon('ShieldCheck', 24, u.verified ? 'text-green-soft' : 'text-pink-warm')),
              h('div', { className: 'flex-1' },
                h('p', { className: 'text-white font-medium' }, '实名认证'),
                h('p', { className: 'text-star-blue-lighter text-xs' }, u.verified ? '已认证' : '未认证，完成可获+10分')
              ),
              h('span', { className: 'text-xs font-medium px-3 py-1 rounded-full ' + (u.verified ? 'bg-green-soft/20 text-green-soft' : 'bg-pink-warm/20 text-pink-warm') }, u.verified ? '已认证' : '去认证')
            ),
            h('div', { className: 'flex items-center gap-4 p-4 bg-star-blue/50 rounded-xl' },
              h('div', { className: 'w-12 h-12 rounded-full ' + (u.communityBound ? 'bg-blue-sky/20' : 'bg-pink-warm/20') + ' flex items-center justify-center' }, Icon('Home', 24, u.communityBound ? 'text-blue-sky' : 'text-pink-warm')),
              h('div', { className: 'flex-1' },
                h('p', { className: 'text-white font-medium' }, '小区绑定'),
                h('p', { className: 'text-star-blue-lighter text-xs' }, u.communityBound ? u.communityName : '未绑定')
              ),
              h('span', { className: 'text-xs font-medium px-3 py-1 rounded-full ' + (u.communityBound ? 'bg-blue-sky/20 text-blue-sky' : 'bg-pink-warm/20 text-pink-warm') }, u.communityBound ? '已绑定' : '去绑定')
            ),
            h('div', { className: 'flex items-center gap-4 p-4 bg-star-blue/50 rounded-xl' },
              h('div', { className: 'w-12 h-12 rounded-full bg-purple-magic/20 flex items-center justify-center' }, Icon('Lock', 24, 'text-purple-magic')),
              h('div', { className: 'flex-1' },
                h('p', { className: 'text-white font-medium' }, '隐私保护'),
                h('p', { className: 'text-star-blue-lighter text-xs' }, '互评完成前隐藏具体门牌号和手机号')
              ),
              h('span', { className: 'text-xs font-medium px-3 py-1 rounded-full bg-purple-magic/20 text-purple-magic' }, '已开启')
            )
          )
        )
      ),
      (u.badges || []).length > 0 ? h('div', { className: 'px-4 mt-6' },
        h('h3', { className: 'text-white font-semibold mb-3 flex items-center gap-2' }, Icon('Award', 20, 'text-warm-yellow'), '我的勋章'),
        h('div', { className: 'bg-card rounded-2xl p-4 border border-star-blue-lighter/30' },
          h('div', { className: 'flex flex-wrap gap-3' },
            (u.badges || []).map((badge, i) => h('div', { className: 'flex items-center gap-2 px-4 py-2.5 bg-warm-yellow/10 rounded-xl border border-warm-yellow/30' },
              h('span', { className: 'text-base' }, '🏅'),
              h('span', { className: 'text-sm font-medium text-white' }, badge)
            ))
          )
        )
      ) : null,
      h('div', { className: 'px-4 mt-6 pb-6' },
        h('button', { className: 'w-full py-3 bg-star-blue-light border border-star-blue-lighter rounded-xl text-star-blue-lighter text-sm cursor-pointer', __eventId: 'reset-data' }, '重置演示数据')
      )
    ));
  }

  // ================== Main Render ==================
  function render() {
    const root = document.getElementById('root');
    let content;
    switch (App.route) {
      case 'home': content = renderHome(); break;
      case 'wishes': content = renderWishes(); break;
      case 'publish': content = renderPublish(); break;
      case 'publishSuccess': content = renderPublishSuccess(); break;
      case 'wishDetail': content = renderWishDetail(); break;
      case 'letters': content = renderLetters(); break;
      case 'profile': content = renderProfile(); break;
      default: content = renderHome();
    }
    root.innerHTML = renderToHtml(content);
  }

  App.subscribe(render);
  render();
  window.__app = App;
})();
</script>
</body>
</html>
