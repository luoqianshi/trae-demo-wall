<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷题通 · 管理后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#fafafa;--border:#e5e7eb;
  --text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
  --accent:#6366f1;--accent2:#4f46e5;--green:#16a34a;--red:#dc2626;
  --amber:#d97706;--radius:12px;--radius2:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);padding:40px 36px;border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:400px;text-align:center}
.login-card h1{font-size:1.5rem;margin-bottom:6px;color:var(--accent)}
.login-card .sub{font-size:.82rem;color:var(--text2);margin-bottom:28px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius2);font-size:.95rem;margin-bottom:14px;font-family:inherit;transition:.15s}
.login-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.login-card .btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius2);font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.login-card .btn:hover{background:var(--accent2)}
.login-card .err{color:var(--red);font-size:.82rem;margin-top:10px;display:none}

/* Layout */
.layout{display:none;min-height:100vh}
.layout.on{display:flex}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{padding:0 20px 20px;font-size:1.1rem;font-weight:800;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar .nav-item{padding:11px 20px;cursor:pointer;font-size:.88rem;color:var(--text2);transition:.15s;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.sidebar .nav-item:hover{background:var(--surface2);color:var(--text)}
.sidebar .nav-item.active{color:var(--accent);background:rgba(99,102,241,.08);border-left-color:var(--accent);font-weight:600}
.sidebar .nav-item .ico{font-size:1.05rem;width:22px;text-align:center}
.sidebar .logout{margin-top:auto;padding:11px 20px;cursor:pointer;font-size:.82rem;color:var(--red);border-top:1px solid var(--border);transition:.15s}
.sidebar .logout:hover{background:rgba(220,38,38,.06)}

.main{flex:1;padding:28px 32px;overflow-y:auto;max-height:100vh}
.main h2{font-size:1.2rem;margin-bottom:20px;font-weight:700}
.main h3{font-size:.95rem;margin-bottom:12px;color:var(--text2)}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--surface);padding:22px 20px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.card .card-label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card .card-val{font-size:1.6rem;font-weight:800}
.card .card-sub{font-size:.78rem;color:var(--text2);margin-top:4px}
.card .card-ico{font-size:1.8rem;margin-bottom:8px}

/* Config */
.config-section{background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.config-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.config-row:last-child{margin-bottom:0}
.config-row label{width:110px;font-size:.85rem;font-weight:600;flex-shrink:0}
.config-row input,.config-row select{flex:1;min-width:200px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius2);font-size:.9rem;font-family:inherit;transition:.15s}
.config-row input:focus,.config-row select:focus{outline:none;border-color:var(--accent)}
.config-row .btn-save{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius2);font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.config-row .btn-save:hover{background:var(--accent2)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.on{background:var(--green)}
.status-dot.off{background:var(--red)}

/* Table */
.table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 16px;text-align:left;font-size:.84rem;border-bottom:1px solid var(--border)}
th{background:var(--surface2);font-weight:600;color:var(--text2);font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.tag-s{background:rgba(99,102,241,.1);color:var(--accent)}
.tag-m{background:rgba(217,119,6,.1);color:var(--amber)}
.tag-j{background:rgba(22,163,74,.1);color:var(--green)}
.tag-e{background:rgba(8,145,178,.1);color:#0891b2}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:.88rem}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 24px;border-radius:var(--radius2);font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.toast.err{background:var(--red)}

/* Page visibility */
.page{display:none}
.page.on{display:block}

/* Mobile admin sidebar */
.admin-hamburger{display:none;font-size:1.3rem;cursor:pointer;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:inherit;line-height:1;color:var(--text)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90}
@media(max-width:768px){
  .admin-hamburger{display:inline-flex;align-items:center;justify-content:center}
  .sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:100;transition:left .25s}
  .sidebar.open{left:0}
  .sidebar-overlay.on{display:block}
  .layout.on{display:block}
  .main{padding:16px;overflow-x:auto;max-height:none;-webkit-overflow-scrolling:touch}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:600px}
  .card-grid{grid-template-columns:1fr}
  .config-row{flex-direction:column;align-items:flex-start}
  .config-row label{width:auto;margin-bottom:4px}
  .config-row input,.config-row select{min-width:100%;width:100%}
}
</style>
</head>
<body>

<!-- ========== 登录 ========== -->
<div class="login-wrap" id="loginPage">
  <div class="login-card">
    <h1>刷题通</h1>
    <div class="sub">管理后台 · 仅限管理员</div>
    <input type="password" id="loginPwd" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr">密码错误</div>
  </div>
</div>

<!-- ========== 主布局 ========== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeAdminSidebar()"></div>
<div class="layout" id="mainLayout">
  <div class="sidebar">
    <div class="logo">刷题通 管理</div>
    <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
      <span class="ico">📊</span> 仪表盘
    </div>
    <div class="nav-item" data-page="config" onclick="switchPage('config')">
      <span class="ico">⚙️</span> API 配置
    </div>
    <div class="nav-item" data-page="uploads" onclick="switchPage('uploads')">
      <span class="ico">📄</span> 上传记录
    </div>
    <div class="nav-item" data-page="users" onclick="switchPage('users')">
      <span class="ico">👥</span> 用户管理
    </div>
    <div class="nav-item" data-page="password" onclick="switchPage('password')">
      <span class="ico">🔑</span> 修改密码
    </div>
    <div class="logout" onclick="doLogout()">退出登录</div>
  </div>

  <div class="main">
    <button class="admin-hamburger" onclick="toggleAdminSidebar()" title="菜单" style="margin-bottom:12px">☰ 菜单</button>
    <!-- 仪表盘 -->
    <div class="page on" id="page-dashboard">
      <h2>仪表盘</h2>
      <div class="card-grid" id="statsGrid">
        <div class="card">
          <div class="card-ico">🔑</div>
          <div class="card-label">API Key 状态</div>
          <div class="card-val" id="statApiStatus">--</div>
          <div class="card-sub" id="statApiModel">--</div>
        </div>
        <div class="card">
          <div class="card-ico">📤</div>
          <div class="card-label">今日上传</div>
          <div class="card-val" id="statTodayUploads">0</div>
          <div class="card-sub">文件数</div>
        </div>
        <div class="card">
          <div class="card-ico">📝</div>
          <div class="card-label">今日解析</div>
          <div class="card-val" id="statTodayQuestions">0</div>
          <div class="card-sub">题目数</div>
        </div>
        <div class="card">
          <div class="card-ico">📊</div>
          <div class="card-label">累计解析</div>
          <div class="card-val" id="statTotalQuestions">0</div>
          <div class="card-sub">题目数</div>
        </div>
      </div>
      <h3>最近上传</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>文件名</th><th>题目数</th><th>状态</th></tr></thead>
          <tbody id="recentUploads"><tr><td class="empty" colspan="4">暂无记录</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- API 配置 -->
    <div class="page" id="page-config">
      <h2>API 配置</h2>
      <div class="config-section">
        <div class="config-row">
          <label>API Key</label>
          <input type="password" id="cfgApiKey" placeholder="sk-...">
        </div>
        <div class="config-row">
          <label>API Base URL</label>
          <input type="text" id="cfgApiBase" placeholder="https://api.openai.com/v1">
        </div>
        <div class="config-row">
          <label>模型</label>
          <input type="text" id="cfgModel" placeholder="gpt-4o / deepseek-chat">
        </div>
        <div class="config-row">
          <label></label>
          <button class="btn-save" onclick="saveConfig()">保存配置</button>
          <span style="font-size:.82rem;color:var(--green);display:none" id="cfgSaved">已保存</span>
        </div>
      </div>
      <!-- Skills 管理 -->
      <div class="config-section" style="margin-top:20px">
        <h3 style="margin-bottom:12px">文档解析 Skills</h3>
        <div id="skillsList" style="font-size:.85rem;color:var(--text2)">加载中...</div>
      </div>
    </div>

    <!-- 上传记录（含题目浏览） -->
    <div class="page" id="page-uploads">
      <h2>上传记录</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>文件名</th><th>格式</th><th>上传者</th><th>题目数</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="uploadTable"><tr><td class="empty" colspan="7">暂无记录</td></tr></tbody>
        </table>
      </div>
      <!-- 题目详情（内联展示） -->
      <div id="uploadDetailQuestions" style="display:none;margin-top:20px"></div>
      <div id="uploadDetailRaw" style="display:none;margin-top:20px"></div>
    </div>

    <!-- 用户管理 -->
    <div class="page" id="page-users">
      <h2>用户管理</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>用户名</th><th>密码哈希</th><th>IP 地址</th><th>最后登录</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="userTable"><tr><td class="empty" colspan="7">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 修改管理员密码 -->
    <div class="page" id="page-password">
      <h2>修改管理员密码</h2>
      <div class="config-section">
        <div class="config-row">
          <label>旧密码</label>
          <input type="password" id="pwdOldPwd" placeholder="请输入当前密码">
        </div>
        <div class="config-row">
          <label>新密码</label>
          <input type="password" id="pwdNewPwd" placeholder="新密码（至少4位）">
        </div>
        <div class="config-row">
          <label>确认密码</label>
          <input type="password" id="pwdConfirmPwd" placeholder="再次输入新密码">
        </div>
        <div class="config-row">
          <label></label>
          <button class="btn-save" onclick="changePassword()">修改密码</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 用户密码重置弹窗 -->
<div class="modal-overlay" id="resetPwdModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:var(--radius);padding:28px 24px;width:90%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.12)">
    <h3 style="margin-bottom:16px;font-size:1rem">重置用户密码</h3>
    <p style="font-size:.82rem;color:var(--text2);margin-bottom:14px">将为用户 <strong id="resetPwdUser">--</strong> 设置新密码</p>
    <input type="password" id="resetPwdInput" placeholder="新密码（至少4位）" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius2);font-size:.9rem;font-family:inherit;margin-bottom:16px">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeResetPwdModal()" style="padding:9px 20px;border:1.5px solid var(--border);border-radius:var(--radius2);background:var(--surface);cursor:pointer;font-family:inherit;font-size:.85rem">取消</button>
      <button onclick="doResetUserPwd()" style="padding:9px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius2);cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600">确认重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 状态
// ============================================================
var TOKEN = localStorage.getItem('st_admin_token') || '';

// ============================================================
// 登录/登出
// ============================================================
function doLogin() {
  var pwd = document.getElementById('loginPwd').value;
  if (!pwd) return;
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pwd })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      TOKEN = d.token;
      localStorage.setItem('st_admin_token', TOKEN);
      showMain();
    } else {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('loginErr').textContent = d.error || '密码错误';
    }
  })
  .catch(function() {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('loginErr').textContent = '服务器连接失败';
  });
}

function doLogout() {
  TOKEN = '';
  localStorage.removeItem('st_admin_token');
  document.getElementById('mainLayout').classList.remove('on');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPwd').value = '';
}

function showMain() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainLayout').classList.add('on');
  document.getElementById('loginErr').style.display = 'none';
  switchPage('dashboard');
}

// 自动登录
if (TOKEN) {
  fetch('/api/admin/verify', {
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) { showMain(); }
    else { TOKEN = ''; localStorage.removeItem('st_admin_token'); }
  })
  .catch(function() {});
}

// ============================================================
// 页面切换
// ============================================================
function switchPage(name) {
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.page === name);
  });
  document.querySelectorAll('.page').forEach(function(el) {
    el.classList.toggle('on', el.id === 'page-' + name);
  });
  if (name === 'dashboard') loadDashboard();
  if (name === 'config') { loadConfig(); loadSkills(); }
  if (name === 'uploads') loadUploads();
  if (name === 'users') loadUsers();
  // 移动端切换页面后收起左边栏
  closeAdminSidebar();
}

// ============================================================
// 移动端左边栏
// ============================================================
function toggleAdminSidebar() {
  var sb = document.querySelector('.sidebar');
  var ov = document.getElementById('sidebarOverlay');
  if (sb.classList.contains('open')) {
    sb.classList.remove('open');
    ov.classList.remove('on');
  } else {
    sb.classList.add('open');
    ov.classList.add('on');
  }
}
function closeAdminSidebar() {
  var sb = document.querySelector('.sidebar');
  var ov = document.getElementById('sidebarOverlay');
  sb.classList.remove('open');
  ov.classList.remove('on');
}

// ============================================================
// API 调用
// ============================================================
function apiGet(url) {
  return fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function(r) {
      if (r.status === 401) { doLogout(); throw new Error('Unauthorized'); }
      return r.json();
    });
}

function apiPost(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify(data)
  })
  .then(function(r) {
    if (r.status === 401) { doLogout(); throw new Error('Unauthorized'); }
    return r.json();
  });
}

// ============================================================
// 仪表盘
// ============================================================
function loadDashboard() {
  apiGet('/api/admin/stats').then(function(d) {
    var hasKey = d.api_configured;
    document.getElementById('statApiStatus').innerHTML =
      '<span class="status-dot ' + (hasKey ? 'on' : 'off') + '"></span>' +
      (hasKey ? '已配置' : '未配置');
    document.getElementById('statApiModel').textContent = '模型: ' + (d.model || '--');
    document.getElementById('statTodayUploads').textContent = d.today_uploads || 0;
    document.getElementById('statTodayQuestions').textContent = d.today_questions || 0;
    document.getElementById('statTotalQuestions').textContent = d.total_questions || 0;

    var logs = d.recent_logs || [];
    var tbody = document.getElementById('recentUploads');
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td class="empty" colspan="4">暂无记录</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(function(l) {
      var statusClass = l.success ? 'tag-s' : 'tag-j';
      var statusText = l.success ? '成功' : '失败';
      return '<tr>' +
        '<td>' + escHtml(l.time || '') + '</td>' +
        '<td>' + escHtml(l.filename || '') + '</td>' +
        '<td>' + (l.question_count || 0) + '</td>' +
        '<td><span class="tag ' + statusClass + '">' + statusText + '</span></td>' +
        '</tr>';
    }).join('');
  }).catch(function() {});
}

// ============================================================
// API 配置
// ============================================================
function loadConfig() {
  apiGet('/api/admin/config').then(function(d) {
    document.getElementById('cfgApiKey').value = d.api_key_masked || '';
    document.getElementById('cfgApiBase').value = d.api_base || 'https://api.openai.com/v1';
    document.getElementById('cfgModel').value = d.model || 'gpt-4o';
  }).catch(function() {});
}

function saveConfig() {
  var data = {
    api_key: document.getElementById('cfgApiKey').value,
    api_base: document.getElementById('cfgApiBase').value,
    model: document.getElementById('cfgModel').value
  };
  // 如果 api_key 没有变化（是 masked 值），不发送
  if (data.api_key && data.api_key.indexOf('*') >= 0) {
    delete data.api_key;
  }
  // 不发送空字符串
  for (var k in data) {
    if (!data[k]) delete data[k];
  }

  apiPost('/api/admin/config', data).then(function(d) {
    if (d.success) {
      var el = document.getElementById('cfgSaved');
      el.style.display = 'inline';
      setTimeout(function() { el.style.display = 'none'; }, 2000);
      document.getElementById('cfgAdminPwd').value = '';
    } else {
      showToast('保存失败: ' + (d.error || ''), true);
    }
  }).catch(function() {});
}

function changePassword() {
  var oldPwd = document.getElementById('pwdOldPwd').value;
  var newPwd = document.getElementById('pwdNewPwd').value;
  var confirmPwd = document.getElementById('pwdConfirmPwd').value;

  if (!oldPwd) { showToast('请输入旧密码', true); return; }
  if (!newPwd || newPwd.length < 4) { showToast('新密码至少需要 4 位', true); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', true); return; }
  if (newPwd === oldPwd) { showToast('新密码不能与旧密码相同', true); return; }

  apiPost('/api/admin/change-password', {
    old_password: oldPwd,
    new_password: newPwd,
    confirm_password: confirmPwd
  }).then(function(d) {
    if (d.success) {
      showToast('密码修改成功');
      document.getElementById('pwdOldPwd').value = '';
      document.getElementById('pwdNewPwd').value = '';
      document.getElementById('pwdConfirmPwd').value = '';
    } else {
      showToast('修改失败: ' + (d.detail || d.error || ''), true);
    }
  }).catch(function() {
    showToast('修改失败，请重试', true);
  });
}

// ============================================================
// Skills 管理
// ============================================================
function loadSkills() {
  apiGet('/api/admin/skills').then(function(d) {
    var skills = d.skills || [];
    var container = document.getElementById('skillsList');
    if (skills.length === 0) {
      container.innerHTML = '<span style="color:var(--text3)">暂无已注册的 Skills</span>';
      return;
    }
    var html = '<table style="width:100%;border-collapse:collapse">' +
      '<thead><tr><th style="text-align:left;padding:8px;border-bottom:1px solid var(--border)">Skill 名称</th>' +
      '<th style="text-align:left;padding:8px;border-bottom:1px solid var(--border)">描述</th>' +
      '<th style="text-align:center;padding:8px;border-bottom:1px solid var(--border)">状态</th>' +
      '<th style="text-align:center;padding:8px;border-bottom:1px solid var(--border)">操作</th></tr></thead><tbody>';
    skills.forEach(function(s) {
      var enabled = s.enabled !== false;
      html += '<tr>' +
        '<td style="padding:8px;border-bottom:1px solid var(--border);font-weight:600">' + escHtml(s.name) + '</td>' +
        '<td style="padding:8px;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--text2)">' + escHtml(s.description || '') + '</td>' +
        '<td style="padding:8px;border-bottom:1px solid var(--border);text-align:center">' +
          '<span class="status-dot ' + (enabled ? 'on' : 'off') + '"></span>' + (enabled ? '启用' : '禁用') +
        '</td>' +
        '<td style="padding:8px;border-bottom:1px solid var(--border);text-align:center">' +
          '<button onclick="toggleSkill(\'' + escHtml(s.name).replace(/'/g, "\\'") + '\',' + enabled + ')" ' +
          'style="padding:4px 14px;border:1.5px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-family:inherit;font-size:.8rem;' +
          'background:' + (enabled ? 'rgba(220,38,38,.08)' : 'rgba(22,163,74,.08)') + ';' +
          'color:' + (enabled ? 'var(--red)' : 'var(--green)') + '">' +
          (enabled ? '禁用' : '启用') +
          '</button>' +
        '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }).catch(function() {});
}

function toggleSkill(name, currentEnabled) {
  var newEnabled = !currentEnabled;
  apiPost('/api/admin/skills/toggle', { name: name, enabled: newEnabled }).then(function(d) {
    if (d.success) {
      loadSkills();
    } else {
      showToast('操作失败: ' + (d.error || ''), true);
    }
  }).catch(function() {
    showToast('操作失败，请重试', true);
  });
}
// ============================================================
function loadUploads() {
  apiGet('/api/admin/logs?limit=100').then(function(d) {
    var logs = d.logs || [];
    var tbody = document.getElementById('uploadTable');
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td class="empty" colspan="7">暂无记录</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(function(l, i) {
      var statusClass = l.success ? 'tag-s' : 'tag-j';
      var statusText = l.success ? '成功' : '失败';
      var hasRaw = l.raw_text && l.raw_text.length > 0;
      var hasFile = l.saved_file_path && l.saved_file_path.length > 0;
      var dlLink = hasFile ? ' <a href="/api/admin/download/' + l.log_index + '" style="color:var(--green);font-size:.82rem;margin-left:8px">下载源文件</a>' : '';
      var jsonLink = l.success ? ' <a href="/api/admin/download-json/' + l.log_index + '" style="color:var(--accent);font-size:.82rem;margin-left:8px">下载JSON</a>' : '';
      return '<tr>' +
        '<td>' + escHtml(l.time || '') + '</td>' +
        '<td>' + escHtml(l.filename || '') + '</td>' +
        '<td>' + escHtml(l.format || '') + '</td>' +
        '<td>' + escHtml(l.username || '--') + '</td>' +
        '<td>' + (l.question_count || 0) + '</td>' +
        '<td><span class="tag ' + statusClass + '">' + statusText + '</span></td>' +
        '<td>' +
          (l.success ? '<a href="#" onclick="viewQuestions(' + i + ');return false" style="color:var(--accent);font-size:.82rem">查看题目</a>' : '--') +
          (hasRaw ? ' <a href="#" onclick="viewRawText(' + i + ');return false" style="color:var(--amber);font-size:.82rem;margin-left:8px">查看原文</a>' : '') +
          dlLink +
          jsonLink +
        '</td>' +
        '</tr>';
    }).join('');
    window._uploadLogs = logs;
  }).catch(function() {});
}

function viewQuestions(idx) {
  var log = window._uploadLogs[idx];
  if (!log || !log.questions) return;
  var questions = log.questions;
  var html = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
      '<h3 style="margin:0">题目详情 - ' + escHtml(log.filename || '') + '</h3>' +
      '<button onclick="hideUploadDetail()" style="padding:8px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-family:inherit;font-size:.85rem">返回记录列表</button>' +
    '</div>' +
    '<div class="table-wrap"><table>' +
    '<thead><tr><th>#</th><th>题目</th><th>题型</th><th>答案</th></tr></thead><tbody>';
  questions.forEach(function(q, qi) {
    var typeTag = {'s': '单选','m':'多选','j':'判断','e':'问答'}[q.type] || q.type;
    html += '<tr><td>' + (qi+1) + '</td><td>' + escHtml(q.question || '') + '</td>' +
      '<td><span class="tag tag-' + (q.type||'s') + '">' + typeTag + '</span></td>' +
      '<td>' + escHtml(q.answer || '') + '</td></tr>';
  });
  html += '</tbody></table></div></div>';
  var detailDiv = document.getElementById('uploadDetailQuestions');
  detailDiv.innerHTML = html;
  detailDiv.style.display = 'block';
  document.getElementById('uploadDetailRaw').style.display = 'none';
  // 隐藏上传表格
  document.querySelector('#page-uploads .table-wrap').style.display = 'none';
}

function viewRawText(idx) {
  var log = window._uploadLogs[idx];
  if (!log || !log.raw_text) return;
  var html = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
      '<h3 style="margin:0">文件原文 - ' + escHtml(log.filename || '') + '</h3>' +
      '<button onclick="hideUploadDetail()" style="padding:8px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-family:inherit;font-size:.85rem">返回记录列表</button>' +
    '</div>' +
    '<div style="font-size:.82rem;color:var(--text2);margin-bottom:10px">上传者: ' + escHtml(log.username || '--') + ' | 时间: ' + escHtml(log.time) + '</div>' +
    '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;max-height:500px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;font-size:.82rem;line-height:1.6">' +
      escHtml(log.raw_text) +
    '</div>' +
    '</div>';
  var detailDiv = document.getElementById('uploadDetailRaw');
  detailDiv.innerHTML = html;
  detailDiv.style.display = 'block';
  document.getElementById('uploadDetailQuestions').style.display = 'none';
  // 隐藏上传表格
  document.querySelector('#page-uploads .table-wrap').style.display = 'none';
}

function hideUploadDetail() {
  document.getElementById('uploadDetailQuestions').style.display = 'none';
  document.getElementById('uploadDetailRaw').style.display = 'none';
  document.querySelector('#page-uploads .table-wrap').style.display = '';
}

// ============================================================
// 用户管理
// ============================================================
function loadUsers() {
  apiGet('/api/admin/users').then(function(d) {
    var users = d.users || [];
    var tbody = document.getElementById('userTable');
    if (users.length === 0) {
      tbody.innerHTML = '<tr><td class="empty" colspan="7">暂无注册用户</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(function(u) {
      var shortHash = u.password_hash ? u.password_hash.substring(0, 8) + '...' : '--';
      return '<tr>' +
        '<td>' + u.id + '</td>' +
        '<td><strong>' + escHtml(u.username) + '</strong></td>' +
        '<td style="font-family:monospace;font-size:.72rem">' +
          '<span id="pwhash_' + u.id + '" style="cursor:pointer" title="点击查看完整哈希" onclick="togglePwdHash(' + u.id + ',\'' + escHtml(u.password_hash || '').replace(/'/g, "\\'") + '\')">' + shortHash + '</span>' +
        '</td>' +
        '<td>' + escHtml(u.ip_address || '--') + '</td>' +
        '<td>' + escHtml(u.last_login || '--') + '</td>' +
        '<td>' + escHtml(u.created_at || '--') + '</td>' +
        '<td>' +
          '<a href="#" onclick="showResetPwdModal(' + u.id + ',\'' + escHtml(u.username).replace(/'/g, "\\'") + '\');return false" style="color:var(--accent);font-size:.82rem">重置密码</a>' +
          ' <a href="#" onclick="deleteUser(' + u.id + ',\'' + escHtml(u.username).replace(/'/g, "\\'") + '\');return false" style="color:var(--red);font-size:.82rem;margin-left:6px">删除</a>' +
        '</td>' +
        '</tr>';
    }).join('');
  }).catch(function() {});
}

function deleteUser(userId, username) {
  if (!confirm('确定要删除用户「' + username + '」吗？\n此操作将同时删除该用户的云端同步数据，不可恢复！')) return;
  fetch('/api/admin/users/' + userId, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      showToast('用户「' + username + '」已删除');
      loadUsers();
    } else {
      showToast('删除失败: ' + (d.detail || ''), true);
    }
  })
  .catch(function() {
    showToast('删除失败，请重试', true);
  });
}

// ============================================================
// 用户密码管理
// ============================================================
var _resetPwdUserId = 0;

function togglePwdHash(userId, fullHash) {
  var el = document.getElementById('pwhash_' + userId);
  if (!el) return;
  if (el.textContent.length > 12) {
    el.textContent = fullHash.substring(0, 8) + '...';
    el.title = '点击查看完整哈希';
  } else {
    el.textContent = fullHash;
    el.title = '点击收起';
  }
}

function showResetPwdModal(userId, userName) {
  _resetPwdUserId = userId;
  document.getElementById('resetPwdUser').textContent = userName;
  document.getElementById('resetPwdInput').value = '';
  document.getElementById('resetPwdModal').style.display = 'flex';
  setTimeout(function() {
    document.getElementById('resetPwdInput').focus();
  }, 100);
}

function closeResetPwdModal() {
  document.getElementById('resetPwdModal').style.display = 'none';
  _resetPwdUserId = 0;
}

function doResetUserPwd() {
  var newPwd = document.getElementById('resetPwdInput').value.trim();
  if (!newPwd || newPwd.length < 4) {
    showToast('新密码至少需要 4 位', true);
    return;
  }
  if (!_resetPwdUserId) return;

  apiPost('/api/admin/users/' + _resetPwdUserId + '/reset-password', {
    new_password: newPwd
  }).then(function(d) {
    if (d.success) {
      showToast('密码已重置');
      closeResetPwdModal();
      loadUsers();
    } else {
      showToast('重置失败: ' + (d.detail || d.error || ''), true);
    }
  }).catch(function() {
    showToast('重置失败，请重试', true);
  });
}

// ============================================================
// 工具函数
// ============================================================
function escHtml(s) {
  if (!s) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  setTimeout(function() { t.className = 'toast'; }, 2500);
}
</script>
