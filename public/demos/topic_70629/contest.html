    },

    _bindFormEvents: function (wrapper, form) {
      var self = this;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        self._saveFeedback(wrapper, form);
      });

      wrapper.querySelector('#feedback-reset').addEventListener('click', function () {
        form.reset();
        form.querySelector('input[name="date"]').value = Utils.getTodayInputValue();
        form.querySelector('input[name="id"]').value = '';
        form.querySelector('input[name="rating"]').value = '0';
        self._resetStars(form);
      });

      // 评分星星
      form.querySelectorAll('.feedback-star-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var val = Number(btn.dataset.value);
          form.querySelector('input[name="rating"]').value = val;
          self._updateStars(form, val);
        });
      });

      // 添加知识点行
      wrapper.querySelector('#feedback-kp-add').addEventListener('click', function () {
        self._addKpRow(wrapper);
      });

      // 添加错题行
      wrapper.querySelector('#feedback-error-add').addEventListener('click', function () {
        self._addErrorRow(wrapper);
      });

      // AI 总结
      wrapper.querySelector('#feedback-ai-summarize').addEventListener('click', function () {
        self._aiSummarize(wrapper, form);
      });

      // 初始绑定删除按钮
      self._bindRemoveButtons(wrapper);
    },

    _updateStars: function (form, value) {
      form.querySelectorAll('.feedback-star-btn').forEach(function (btn) {
        var v = Number(btn.dataset.value);
        var icon = btn.querySelector('i');
        if (v <= value) {
          icon.style.color = '#4b3fe3';
          icon.setAttribute('data-lucide', 'star');
        } else {
          icon.style.color = '#d4d4d8';
          icon.setAttribute('data-lucide', 'star');
        }
      });
      Utils.refreshIcons(form);
    },

    _resetStars: function (form) {
      this._updateStars(form, 0);
    },

    _addKpRow: function (wrapper) {
      var container = wrapper.querySelector('#feedback-kp-container');
      var row = document.createElement('div');
      row.className = 'feedback-kp-row flex flex-wrap items-center gap-2';
      row.innerHTML =
        '<input type="text" class="input-field feedback-kp-name" style="flex:1;min-width:160px;" placeholder="知识点名称">' +
        '<select class="input-field feedback-kp-level" style="width:auto;min-width:100px;">' +
          '<option value="mastered">已掌握</option>' +
          '<option value="partial">部分掌握</option>' +
          '<option value="weak">薄弱</option>' +
        '</select>' +
        '<button type="button" class="btn-ghost btn-icon feedback-kp-remove"><i data-lucide="x" style="width:16px;height:16px;"></i></button>';
      container.appendChild(row);
      this._bindRemoveButtons(wrapper);
      Utils.refreshIcons(container);
    },

    _addErrorRow: function (wrapper) {
      var container = wrapper.querySelector('#feedback-error-container');
      var row = document.createElement('div');
      row.className = 'feedback-error-row flex flex-wrap items-start gap-2';
      row.innerHTML =
        '<input type="text" class="input-field feedback-error-desc" style="flex:1;min-width:200px;" placeholder="错题描述（如：第3题，解方程计算错误）">' +
        '<input type="text" class="input-field feedback-error-type" style="width:auto;min-width:120px;" placeholder="错误类型">' +
        '<button type="button" class="btn-ghost btn-icon feedback-error-remove" style="margin-top:0.25rem;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>';
      container.appendChild(row);
      this._bindRemoveButtons(wrapper);
      Utils.refreshIcons(container);
    },

    _bindRemoveButtons: function (wrapper) {
      // 知识点删除
      wrapper.querySelectorAll('.feedback-kp-remove').forEach(function (btn) {
        btn.onclick = function () {
          var rows = wrapper.querySelectorAll('.feedback-kp-row');
          if (rows.length > 1) {
            btn.closest('.feedback-kp-row').remove();
          }
        };
      });

      // 错题删除
      wrapper.querySelectorAll('.feedback-error-remove').forEach(function (btn) {
        btn.onclick = function () {
          var rows = wrapper.querySelectorAll('.feedback-error-row');
          if (rows.length > 1) {
            btn.closest('.feedback-error-row').remove();
          }
        };
      });

      // 显示/隐藏删除按钮
      var kpRows = wrapper.querySelectorAll('.feedback-kp-row');
      kpRows.forEach(function (row) {
        var removeBtn = row.querySelector('.feedback-kp-remove');
        if (removeBtn) removeBtn.style.display = kpRows.length > 1 ? 'inline-flex' : 'none';
      });

      var errorRows = wrapper.querySelectorAll('.feedback-error-row');
      errorRows.forEach(function (row) {
        var removeBtn = row.querySelector('.feedback-error-remove');
        if (removeBtn) removeBtn.style.display = errorRows.length > 1 ? 'inline-flex' : 'none';
      });
    },

    _collectFormData: function (wrapper, form) {
      var id = form.querySelector('input[name="id"]').value;

      // 收集知识点
      var knowledgePoints = [];
      wrapper.querySelectorAll('.feedback-kp-row').forEach(function (row) {
        var name = row.querySelector('.feedback-kp-name').value.trim();
        var level = row.querySelector('.feedback-kp-level').value;
        if (name) knowledgePoints.push({ name: name, level: level });
      });

      // 收集错题
      var errors = [];
      wrapper.querySelectorAll('.feedback-error-row').forEach(function (row) {
        var desc = row.querySelector('.feedback-error-desc').value.trim();
        var type = row.querySelector('.feedback-error-type').value.trim();
        if (desc) errors.push({ description: desc, type: type });
      });

      return {
        id: id ? Number(id) : undefined,
        date: form.querySelector('input[name="date"]').value,
        studentId: Number(form.querySelector('select[name="studentId"]').value),
        recordId: form.querySelector('select[name="recordId"]').value ? Number(form.querySelector('select[name="recordId"]').value) : null,
        topic: form.querySelector('input[name="topic"]').value.trim(),
        rating: Number(form.querySelector('input[name="rating"]').value),
        performance: form.querySelector('textarea[name="performance"]').value.trim(),
        knowledgePoints: knowledgePoints,
        errors: errors,
        homework: form.querySelector('textarea[name="homework"]').value.trim(),
        reflection: form.querySelector('textarea[name="reflection"]').value.trim()
      };
    },

    _saveFeedback: async function (wrapper, form) {
      var data = this._collectFormData(wrapper, form);

      if (!data.date || !data.studentId || !data.topic) {
        Utils.showToast('请填写日期、学生和课题', 'error');
        return;
      }

      try {
        var isNew = !data.id;
        var existing = isNew ? null : await global.DB.get(STORE, data.id);
        data.createdAt = existing ? existing.createdAt : Date.now();

        var id = await global.DB.put(STORE, data);
        data.id = id;
        form.querySelector('input[name="id"]').value = id;

        // ===== 数据同步 =====
        await this._syncToAnalysis(data);
        await this._syncToAssessments(data, isNew, existing);
        await this._syncToStudent(data, isNew, existing);

        // 新建反馈后重置表单
        if (isNew) {
          form.reset();
          form.querySelector('input[name="date"]').value = Utils.getTodayInputValue();
          form.querySelector('input[name="id"]').value = '';
          form.querySelector('input[name="rating"]').value = '0';
          this._resetStars(form);
          wrapper.querySelector('#feedback-kp-container').innerHTML =
            '<div class="feedback-kp-row flex flex-wrap items-center gap-2">' +
              '<input type="text" class="input-field feedback-kp-name" style="flex:1;min-width:160px;" placeholder="知识点名称">' +
              '<select class="input-field feedback-kp-level" style="width:auto;min-width:100px;">' +
                '<option value="mastered">已掌握</option>' +
                '<option value="partial">部分掌握</option>' +
                '<option value="weak">薄弱</option>' +
              '</select>' +
              '<button type="button" class="btn-ghost btn-icon feedback-kp-remove" style="display:none;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>' +
            '</div>';
          wrapper.querySelector('#feedback-error-container').innerHTML =
            '<div class="feedback-error-row flex flex-wrap items-start gap-2">' +
              '<input type="text" class="input-field feedback-error-desc" style="flex:1;min-width:200px;" placeholder="错题描述（如：第3题，解方程计算错误）">' +
              '<input type="text" class="input-field feedback-error-type" style="width:auto;min-width:120px;" placeholder="错误类型">' +
              '<button type="button" class="btn-ghost btn-icon feedback-error-remove" style="display:none;margin-top:0.25rem;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>' +
            '</div>';
          Utils.refreshIcons(wrapper);
        }

        Utils.showToast('反馈已保存，数据已同步到学生档案和错题分析', 'success');

        var feedbacks = [];
        try { feedbacks = await global.DB.getAll(STORE); } catch (e) { feedbacks = []; }
        var students = [];
        try { students = await global.DB.getAll(STUDENTS_STORE); } catch (e) { students = []; }
        var records = [];
        try { records = await global.DB.getAll(RECORDS_STORE); } catch (e) { records = []; }
        this._renderList(wrapper, feedbacks, students, records);
      } catch (err) {
        Utils.showToast('保存失败：' + err.message, 'error');
      }
    },

    // 同步到错题分析模块
    _syncToAnalysis: async function (data) {
      if (!data.errors || data.errors.length === 0) return;

      try {
        // 检查是否已有同日同学生的错题分析记录
        var existing = await global.DB.getAll(ANALYSIS_STORE);
        var todayExisting = existing.find(function (r) {
          return r.studentId === data.studentId &&
                 r.source === '课后反馈' &&
                 r.feedbackDate === data.date;
        });

        var errorText = data.errors.map(function (e, i) {
          return (i + 1) + '. ' + e.description + (e.type ? '（错误类型：' + e.type + '）' : '');
        }).join('\n');

        var analysisResult = '## 课后反馈错题记录\n\n' +
          '**课题：** ' + data.topic + '\n\n' +
          '**日期：** ' + data.date + '\n\n' +
          '### 错题列表\n\n' + errorText + '\n\n';

        if (data.knowledgePoints && data.knowledgePoints.length > 0) {
          analysisResult += '### 知识点掌握情况\n\n';
          data.knowledgePoints.forEach(function (kp) {
            var levelText = { mastered: '已掌握', partial: '部分掌握', weak: '薄弱' };
            analysisResult += '- **' + kp.name + '**：' + (levelText[kp.level] || kp.level) + '\n';
          });
        }

        if (data.performance) {
          analysisResult += '\n### 学生表现\n\n' + data.performance + '\n';
        }

        var record = {
          id: todayExisting ? todayExisting.id : undefined,
          studentId: data.studentId,
          images: [],
          result: analysisResult,
          source: '课后反馈',
          feedbackDate: data.date,
          feedbackId: data.id,
          createdAt: todayExisting ? todayExisting.createdAt : Date.now()
        };

        await global.DB.put(ANALYSIS_STORE, record);
      } catch (err) {
        console.error('同步到错题分析失败', err);
      }
    },

    // 同步到学生画像测评
    _syncToAssessments: async function (data, isNew, existing) {
      try {
        // 编辑时先清理旧的同步记录
        if (!isNew && existing) {
          var oldAssessments = await global.DB.getAll(ASSESSMENTS_STORE);
          for (var i = 0; i < oldAssessments.length; i++) {
            var a = oldAssessments[i];
            if (a.feedbackId === existing.id || (a.source === '课后反馈' && a.date === existing.date && a.studentId === existing.studentId)) {
              await global.DB.delete(ASSESSMENTS_STORE, a.id);
            }
          }
        }

        var levelScores = { mastered: 0.9, partial: 0.6, weak: 0.3 };
        var ratingScore = data.rating / 5;

        for (var i = 0; i < data.knowledgePoints.length; i++) {
          var kp = data.knowledgePoints[i];
          var score = levelScores[kp.level] || 0.5;

          var cognitiveLevel = 'understand';
          if (kp.level === 'mastered') cognitiveLevel = 'apply';
          if (kp.level === 'weak') cognitiveLevel = 'understand';

          var record = {
            studentId: data.studentId,
            date: data.date,
            topic: kp.name,
            cognitiveLevel: cognitiveLevel,
            score: score,
            errorType: kp.level === 'weak' ? '知识薄弱' : '',
            source: '课后反馈',
            feedbackId: data.id,
            rawText: data.performance || ''
          };
          await global.DB.put(ASSESSMENTS_STORE, record);
        }

        // 如果有评分，也记录一条综合测评
        if (data.rating > 0) {
          await global.DB.put(ASSESSMENTS_STORE, {
            studentId: data.studentId,
            date: data.date,
            topic: data.topic + '（综合表现）',
            cognitiveLevel: 'evaluate',
            score: ratingScore,
            errorType: '',
            source: '课后反馈',
            feedbackId: data.id,
            rawText: data.performance || ''
          });
        }
      } catch (err) {
        console.error('同步到画像测评失败', err);
      }
    },

    // 同步到学生管理（更新最后上课时间等）
    _syncToStudent: async function (data, isNew, existing) {
      try {
        var student = await global.DB.get(STUDENTS_STORE, data.studentId);
        if (!student) return;

        student.lastLessonDate = data.date;
        student.lastLessonTopic = data.topic;
        student.lastPerformance = data.performance;
        student.lastRating = data.rating;

        // 重新计算课时数，避免编辑时重复累加
        var allFeedbacks = await global.DB.getAll(STORE);
        student.lessonCount = allFeedbacks.filter(function (fb) { return fb.studentId === data.studentId; }).length;

        // 重新统计薄弱知识点：先移除该反馈旧数据贡献的薄弱点，再添加新数据
        var oldWeakNames = [];
        if (existing && existing.knowledgePoints) {
          oldWeakNames = existing.knowledgePoints.filter(function (kp) { return kp.level === 'weak'; }).map(function (kp) { return kp.name; });
        }
        var newWeakNames = [];
        if (data.knowledgePoints && data.knowledgePoints.length > 0) {
          newWeakNames = data.knowledgePoints.filter(function (kp) { return kp.level === 'weak'; }).map(function (kp) { return kp.name; });
        }

        student.weakPoints = student.weakPoints || [];
        oldWeakNames.forEach(function (name) {
          var idx = student.weakPoints.indexOf(name);
          if (idx > -1) student.weakPoints.splice(idx, 1);
        });
        newWeakNames.forEach(function (name) {
          if (student.weakPoints.indexOf(name) === -1) student.weakPoints.push(name);
        });

        await global.DB.put(STUDENTS_STORE, student);
      } catch (err) {
        console.error('同步到学生档案失败', err);
      }
    },

    _aiSummarize: async function (wrapper, form) {
      var data = this._collectFormData(wrapper, form);

      if (!data.studentId || !data.topic) {
        Utils.showToast('请先填写学生和课题', 'error');
        return;
      }

      var btn = wrapper.querySelector('#feedback-ai-summarize');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin" style="width:16px;height:16px;"></i><span>AI 生成中...</span>';
      Utils.refreshIcons(btn);

      Utils.showToast('AI 正在生成教学总结...', 'info');

      try {
        var students = await global.DB.getAll(STUDENTS_STORE);
        var student = students.find(function (s) { return s.id === data.studentId; });
        var studentName = student ? student.name : '学生';

        var prompt = '你是一位资深家教老师，请根据以下课后反馈信息，生成一份结构化的教学总结，包括：\n' +
          '1. 课堂整体评价\n' +
          '2. 知识点掌握情况分析\n' +
          '3. 存在的问题\n' +
          '4. 下一步教学建议\n\n' +
          '用 Markdown 格式输出。\n\n' +
          '学生：' + studentName + '\n' +
          '课题：' + data.topic + '\n' +
          '日期：' + data.date + '\n' +
          '评分（1-5）：' + data.rating + '\n' +
          '表现描述：' + (data.performance || '无') + '\n' +
          '知识点掌握：' + (data.knowledgePoints.length > 0 ? data.knowledgePoints.map(function (kp) { return kp.name + '(' + kp.level + ')'; }).join('、') : '未记录') + '\n' +
          '错题：' + (data.errors.length > 0 ? data.errors.map(function (e) { return e.description; }).join('、') : '无') + '\n' +
          '作业：' + (data.homework || '无') + '\n' +
          '教学反思：' + (data.reflection || '无');

        var result = await global.LLM.chat([{ role: 'user', content: prompt }]);

        // 写入教学反思
        var reflectionField = form.querySelector('textarea[name="reflection"]');
        var existing = reflectionField.value.trim();
        reflectionField.value = existing ? existing + '\n\n---\n\n## AI 教学总结\n\n' + result : '## AI 教学总结\n\n' + result;

        Utils.showToast('AI 总结已生成，请查看教学反思', 'success');
      } catch (err) {
        Utils.showToast('AI 生成失败：' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="sparkles" style="width:16px;height:16px;"></i><span>AI 生成总结</span>';
        Utils.refreshIcons(btn);
      }
    },

    _renderList: function (wrapper, feedbacks, students, records) {
      var list = wrapper.querySelector('#feedback-list');
      list.innerHTML = '';

      if (!feedbacks || feedbacks.length === 0) {
        list.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-state-icon"><i data-lucide="message-square"></i></div>' +
            '<div class="empty-state-title">暂无课后反馈</div>' +
            '<div class="empty-state-text">填写上方表单，记录第一次课后反馈。</div>' +
          '</div>';
        Utils.refreshIcons(list);
        return;
      }

      var sorted = feedbacks.slice().sort(function (a, b) {
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      });

      var studentMap = {};
      students.forEach(function (s) { studentMap[s.id] = s; });

      var self = this;

      sorted.forEach(function (fb) {
        var student = studentMap[fb.studentId];
        var studentName = student ? Utils.getStudentOptionText(student) : '未知学生';

        var ratingStars = '';
        for (var i = 1; i <= 5; i++) {
          ratingStars += i <= fb.rating ? '★' : '☆';
        }

        var weakCount = (fb.knowledgePoints || []).filter(function (kp) { return kp.level === 'weak'; }).length;
        var errorCount = (fb.errors || []).length;

        var item = document.createElement('div');
        item.className = 'list-item cursor-pointer';
        item.innerHTML =
          '<div class="list-item-content">' +
            '<div class="list-item-icon"><i data-lucide="message-square-plus"></i></div>' +
            '<div>' +
              '<div class="list-item-title">' + Utils.escapeHtml(fb.topic) +
                '<span class="tag tag-primary ml-2">' + Utils.escapeHtml(fb.date) + '</span>' +
                '<span style="color:#4b3fe3;margin-left:0.5rem;font-size:0.8125rem;">' + ratingStars + '</span>' +
              '</div>' +
              '<div class="list-item-meta">' +
                Utils.escapeHtml(studentName) +
                (errorCount > 0 ? ' · ' + errorCount + '道错题' : '') +
                (weakCount > 0 ? ' · ' + weakCount + '个薄弱点' : '') +
                (fb.homework ? ' · 有作业' : '') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="list-item-actions">' +
            '<button type="button" class="feedback-edit-btn btn-secondary btn-sm" data-id="' + fb.id + '"><i data-lucide="pencil" style="width:16px;height:16px;"></i><span>编辑</span></button>' +
            '<button type="button" class="feedback-delete-btn btn-danger btn-sm" data-id="' + fb.id + '"><i data-lucide="trash-2" style="width:16px;height:16px;"></i><span>删除</span></button>' +
          '</div>';

        item.querySelector('.feedback-edit-btn').addEventListener('click', function (e) {
          e.stopPropagation();
          self._loadFeedback(wrapper, fb.id);
        });

        item.querySelector('.feedback-delete-btn').addEventListener('click', function (e) {
          e.stopPropagation();
          if (confirm('确定删除这条反馈记录吗？')) {
            self._deleteFeedback(wrapper, fb.id);
          }
        });

        item.addEventListener('click', function () {
          self._loadFeedback(wrapper, fb.id);
        });

        list.appendChild(item);
      });

      Utils.refreshIcons(list);
    },

    _loadFeedback: async function (wrapper, id) {
      try {
        var fb = await global.DB.get(STORE, Number(id));
        if (!fb) return;

        var form = wrapper.querySelector('#feedback-form');
        form.querySelector('input[name="id"]').value = fb.id;
        form.querySelector('input[name="date"]').value = fb.date || '';
        form.querySelector('select[name="studentId"]').value = fb.studentId || '';
        form.querySelector('select[name="recordId"]').value = fb.recordId || '';
        form.querySelector('input[name="topic"]').value = fb.topic || '';
        form.querySelector('textarea[name="performance"]').value = fb.performance || '';
        form.querySelector('textarea[name="homework"]').value = fb.homework || '';
        form.querySelector('textarea[name="reflection"]').value = fb.reflection || '';

        // 评分
        form.querySelector('input[name="rating"]').value = fb.rating || 0;
        this._updateStars(form, fb.rating || 0);

        // 知识点
        var kpContainer = wrapper.querySelector('#feedback-kp-container');
        kpContainer.innerHTML = '';
        var kps = (fb.knowledgePoints && fb.knowledgePoints.length > 0) ? fb.knowledgePoints : [{ name: '', level: 'partial' }];
        var self = this;

    renderStudentHome: async function (container) {
      var students = await global.DB.getAll('students');
      var currentId = this.getCurrentStudentId();
      var student = students.find(function (s) { return s.id === currentId; }) || students[0];

      // 加载该学生最近 3 条备课记录
      var allRecords = [];
      var analyses = [];
      var assessments = [];
      try { allRecords = await global.DB.getAll('records'); } catch (e) {}
      try { analyses = await global.DB.getAll('analysis'); } catch (e) {}
      try { assessments = await global.DB.getAll('student_assessments'); } catch (e) {}

      var studentRecords = [];
      if (student) {
        studentRecords = allRecords
          .filter(function (r) { return r.studentId === student.id; })
          .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); })
          .slice(0, 3);
      }

      // 学习成就指标
      var errorCount = student
        ? analyses.filter(function (a) { return a.studentId === student.id; }).length
        : 0;
      var lessonCount = student ? (student.lessonCount || 0) : 0;
      var studentAssessments = student
        ? assessments.filter(function (a) { return a.studentId === student.id; })
        : [];
      var avgScore = 0;
      if (studentAssessments.length > 0) {
        var sum = studentAssessments.reduce(function (acc, a) { return acc + (a.score || 0); }, 0);
        avgScore = Math.round(sum / studentAssessments.length);
      }

      // 三个圆形进度条的最大值
      var errorMax = Math.max(errorCount, 10);
      var lessonMax = Math.max(lessonCount, 20);
      var errorPct = Math.min(100, Math.round((errorCount / errorMax) * 100));
      var lessonPct = Math.min(100, Math.round((lessonCount / lessonMax) * 100));
      var scorePct = Math.min(100, avgScore);

      var root = document.createElement('div');
      root.className = 'space-y-6';

      var welcomeTitle = student ? '你好，' + Utils.escapeHtml(student.name) : '你好，同学';
      var welcomeText = student
        ? '保持节奏，今日的努力就是明天的实力，加油完成今天的学习任务吧！'
        : '当前还没有绑定学生档案，请在设置中选择或联系老师添加。';

      // 圆形进度条颜色配置
      var errColor = '#ec4899';
      var lessonColor = '#06b6d4';
      var scoreColor = '#10b981';

      function conicGradient(pct, color) {
        return 'background:conic-gradient(' + color + ' 0% ' + pct + '%, rgba(0,0,0,0.06) ' + pct + '% 100%);';
      }

      // 今日任务 HTML
      var tasksHtml = '';
      if (studentRecords.length === 0) {
        tasksHtml = Utils.emptyState('clipboard-list', '暂无今日任务', '老师还没有为你布置备课任务。');
      } else {
        tasksHtml = '<div class="space-y-2">' + studentRecords.map(function (r) {
          var title = r.topic || '未命名备课';
          var dateStr = Utils.formatDate(r.date || r.createdAt);
          return '<div class="task-check-item">' +
            '<div class="task-check-circle"></div>' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.875rem;font-weight:600;color:var(--color-text-heading);">' + Utils.escapeHtml(title) + '</div>' +
              '<div style="font-size:0.75rem;color:var(--color-muted);margin-top:0.25rem;">' +
                '<i data-lucide="calendar" style="width:12px;height:12px;display:inline-block;vertical-align:-1px;"></i> ' + dateStr +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
      }

      root.innerHTML =
        '<div class="hero-card" style="background:linear-gradient(145deg,#6a6fff 0%,#4b3fe3 35%,#8b5cf6 70%,#a855f7 100%);">' +
          '<div class="hero-dots"></div>' +
          '<h1 class="hero-title">' + welcomeTitle + '</h1>' +
          '<p class="hero-text">' + welcomeText + '</p>' +
        '</div>' +

        '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
          '<div class="card">' +
            '<div class="card-title"><span class="card-title-icon"><i data-lucide="list-checks" style="width:16px;height:16px;"></i></span>今日任务</div>' +
            '<p class="text-sm text-slate-500 mt-2" style="margin-bottom:0.75rem;">老师为你准备的最近学习内容，完成后记得回顾错题。</p>' +
            tasksHtml +
          '</div>' +
          '<div class="card">' +
            '<div class="card-title"><span class="card-title-icon secondary"><i data-lucide="trophy" style="width:16px;height:16px;"></i></span>学习成就</div>' +
            '<p class="text-sm text-slate-500 mt-2" style="margin-bottom:1rem;">你的学习数据汇总，持续努力解锁更高成就。</p>' +
            '<div class="grid grid-cols-3 gap-2" style="align-items:start;">' +
              '<div class="circle-progress-wrap">' +
                '<div class="circle-progress" style="' + conicGradient(errorPct, errColor) + '">' +
                  '<span class="circle-progress-value" style="color:' + errColor + ';">' + errorCount + '</span>' +
                '</div>' +
                '<div class="circle-progress-label">已分析错题</div>' +
              '</div>' +
              '<div class="circle-progress-wrap">' +
                '<div class="circle-progress" style="' + conicGradient(lessonPct, lessonColor) + '">' +
                  '<span class="circle-progress-value" style="color:' + lessonColor + ';">' + lessonCount + '</span>' +
                '</div>' +
                '<div class="circle-progress-label">累计课时</div>' +
              '</div>' +
              '<div class="circle-progress-wrap">' +
                '<div class="circle-progress" style="' + conicGradient(scorePct, scoreColor) + '">' +
                  '<span class="circle-progress-value" style="color:' + scoreColor + ';">' + avgScore + '</span>' +
                '</div>' +
                '<div class="circle-progress-label">能力评分</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-title"><span class="card-title-icon"><i data-lucide="layout-grid" style="width:16px;height:16px;"></i></span>学生快捷入口</div>' +
          '<div class="mt-4" style="display:flex;flex-wrap:wrap;gap:0.625rem;">' +
            '<a class="pill-link" href="#student-learning"><i data-lucide="book-open" style="width:14px;height:14px;"></i><span>学习看板</span></a>' +
            '<a class="pill-link" href="#student-schedule"><i data-lucide="calendar-days" style="width:14px;height:14px;"></i><span>我的进度</span></a>' +

            '<a class="pill-link" href="#student-profile"><i data-lucide="pie-chart" style="width:14px;height:14px;"></i><span>我的画像</span></a>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-title"><span class="card-title-icon secondary"><i data-lucide="sparkles" style="width:16px;height:16px;"></i></span>AI 学习助手</div>' +
          '<p class="text-sm text-slate-500 mt-2">你可以在学习看板中查看老师为你准备的教学资料、进度安排和个性化讲解。</p>' +
          '<div class="mt-4 flex gap-3">' +
            '<a href="#student-learning" class="btn-secondary"><i data-lucide="book-open"></i><span>进入学习看板</span></a>' +
          '</div>' +

      container.appendChild(root);
