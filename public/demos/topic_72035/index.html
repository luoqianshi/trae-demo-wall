<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校招智能匹配助手</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SheetJS for Excel parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- localForage for IndexedDB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <!-- PDF.js for PDF text extraction (v3 UMD build) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- mammoth.js for Word document extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- Tesseract.js for OCR (image to text) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

  <!-- Custom Theme -->
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <i class="fas fa-rocket"></i>
        </div>
        <div class="logo-text">
          <div class="logo-title">校招助手</div>
          <div class="logo-subtitle">智能匹配引擎</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="nav-menu">
        <a href="#dashboard" class="nav-item" data-route="dashboard">
          <i class="fas fa-chart-pie"></i>
          <span>仪表盘</span>
        </a>
        <a href="#companies" class="nav-item" data-route="companies">
          <i class="fas fa-building"></i>
          <span>企业库</span>
        </a>
        <a href="#import" class="nav-item" data-route="import">
          <i class="fas fa-file-import"></i>
          <span>数据导入</span>
        </a>
        <a href="#match" class="nav-item" data-route="match">
          <i class="fas fa-magic-wand-sparkles"></i>
          <span>智能匹配</span>
          <span class="nav-badge">AI</span>
        </a>
        <a href="#pipeline" class="nav-item" data-route="pipeline">
          <i class="fas fa-clipboard-check"></i>
          <span>我的投递</span>
        </a>
        <a href="#settings" class="nav-item" data-route="settings">
          <i class="fas fa-gear"></i>
          <span>设置</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="version-tag">v1.1</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Page content rendered here -->
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- Default Data -->
  <script src="js/defaultData.js"></script>
  <!-- Database layer -->
  <script src="js/db.js"></script>
  <!-- Utils -->
  <script src="js/utils.js"></script>
  <!-- Resume Parser -->
  <script src="js/resumeParser.js"></script>
  <!-- AI Client -->
  <script src="js/aiClient.js"></script>
  <!-- Main App -->
  <script src="js/app.js"></script>
</body>
</html>
