<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>美食捕手</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 手机外壳 -->
  <div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="icons">●●●● ● 🔋</span>
    </div>

    <!-- 应用容器 -->
    <div class="app-container">
      <!-- 页面内容区（可滚动） -->
      <div class="page-content"></div>

      <!-- 全局浮动按钮 -->
      <button class="fab hidden" id="global-fab" aria-label="添加美食">+</button>

      <!-- 底部 Tab 栏 -->
      <div class="tab-bar-slot"></div>
    </div>
  </div>

  <!-- ========== JS 模块加载（按依赖顺序） ========== -->

  <!-- 核心基础设施 -->
  <script src="js/store.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/router.js"></script>

  <!-- 公共组件 -->
  <script src="components/food-card.js"></script>
  <script src="components/stat-bar.js"></script>
  <script src="components/filter-tabs.js"></script>
  <script src="components/rating-stars.js"></script>
  <script src="components/tab-bar.js"></script>
  <script src="components/nav-bar.js"></script>
  <script src="components/empty-state.js"></script>

  <!-- UI 工具 -->
  <script src="js/ui.js"></script>

  <!-- 页面模块 -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/discover.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/form.js"></script>
  <script src="js/pages/checkin.js"></script>

  <!-- 应用入口 -->
  <script src="js/app.js"></script>
</body>
</html>
