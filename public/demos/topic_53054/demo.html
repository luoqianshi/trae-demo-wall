<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      flex-direction: column;

      background: #fff;

      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .card-label { font-size: 13px; font-weight: 600; color: #8E8E93; }
    .card-label-row { display: flex; align-items: center; gap: 8px; }
    .source-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      display: none;
    }
    .source-tag-normal { background: rgba(0,122,255,0.1); color: #007AFF; }
    .source-tag-fuzzy { background: rgba(255,149,0,0.1); color: #FF9500; }
    .source-tag-none { background: rgba(142,142,147,0.15); color: #8E8E93; }
    .input-card { flex: 1; margin-bottom: 10px; }
    .input-area {
      flex: 1;
      width: 100%;
      font-size: 18px;
      color: #1C1C1E;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
      min-height: 100px;
      background: transparent;
    }
    .input-area::placeholder { color: #C7C7CC; font-size: 18px; }
    .translate-bar { display: flex; justify-content: center; margin-bottom: 10px; }
    .translate-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 32px;
      background: #007AFF;
      border-radius: 24px;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .translate-button:active { opacity: 0.7; }
    .output-card { flex: 1; }
    .speak-button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F5F5F7;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
      cursor: pointer;
    }
    .output-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
    }
    .result { font-size: 18px; color: #1C1C1E; line-height: 1.6; word-break: break-word; }
    .explanation {
      font-size: 13px;
      color: #8E8E93;
      line-height: 1.5;
      word-break: break-word;
      padding-top: 10px;
      border-top: 1px solid #E5E5EA;
    }
    .empty-text { font-size: 18px; color: #C7C7CC; }
    .feedback-btn {
      align-self: flex-start;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid #007AFF;
      color: #007AFF;
      font-size: 12px;
      cursor: pointer;
    }
    .feedback-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: #F5F5F7;
      border-radius: 10px;
    }
    .feedback-input {
      width: 100%;
      font-size: 14px;
      border: none;
      outline: none;
      min-height: 40px;
      resize: none;
    }
    .feedback-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .feedback-cancel, .feedback-submit {
      padding: 6px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .feedback-cancel { background: transparent; color: #8E8E93; }
    .feedback-submit { background: #007AFF; color: #fff; }
    @media (min-width: 768px) {
      body { max-width: 600px; margin: 0 auto; padding: 20px; }
      .input-area, .result { font-size: 20px; }
      .translate-button { padding: 12px 40px; }
    }
  </style>
</head>
<body>
  <div class="card input-card">

    <textarea class="input-area" id="inputText" placeholder="输入要翻译的内容"></textarea>
  </div>

      <span>翻译</span>

      <div id="speakButton" class="speak-button">🔊</div>
    </div>
    <div id="outputContent" class="output-content">
      <span class="empty-text">翻译结果将显示在这里</span>

    function levenshtein(a, b) {
      var m = a.length, n = b.length;
      var dp = [];
      for (var i = 0; i <= m; i++) {
        dp[i] = [];
        dp[i][0] = i;
      }
      for (var j = 0; j <= n; j++) dp[0][j] = j;
      for (var i = 1; i <= m; i++) {
        for (var j = 1; j <= n; j++) {
          dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) + 1;
        }
      }
      return dp[m][n];
    }

    function translateText(text) {
      if (!text || !text.trim()) {
        return {success: false, result: '', source: 'none', matched: false};
      }

      var lowerText = text.toLowerCase().trim();
      var words = lowerText.split(/[\s，。！？、；：]/).filter(function(w) { return w.length > 0; });

      for (var i = 0; i < dictData.length; i++) {
        var item = dictData[i];
        var lowerWord = item.w.toLowerCase();
        if (lowerWord === lowerText) {
          return {success: true, result: item.m, explanation: item.e, source: 'dictionary', matched: true};
        }
        for (var j = 0; j < words.length; j++) {
          if (lowerWord === words[j]) {
            return {success: true, result: item.m, explanation: item.e, source: 'dictionary', matched: true};
          }
        }
      }

      var bestScore = 0, bestMatch = null;
      for (var i = 0; i < dictData.length; i++) {
        var item = dictData[i];
        var lowerWord = item.w.toLowerCase();
        var maxLen = Math.max(lowerText.length, lowerWord.length);
        if (maxLen === 0) continue;
        var distance = levenshtein(lowerText, lowerWord);
        var similarity = 1 - distance / maxLen;
        if (similarity > bestScore && similarity >= 0.7) {
          bestScore = similarity;
          bestMatch = item;
        }
      }

      if (bestMatch) {
        return {
          success: true,
          result: bestMatch.m,
          explanation: '猜你想翻「' + bestMatch.w + '」：' + (bestMatch.e || ''),
          source: 'fuzzy',
          matched: true
        };
      }

      return {
        success: true,
        result: text,
        explanation: '暂未收录该词汇，你可以提交反馈帮助我们完善词库',
        source: 'none',
        matched: false
      };
    }

    var currentResult = '';

    function handleTranslate() {
      try {
        var inputText = document.getElementById('inputText').value;
        if (!inputText || !inputText.trim()) return;

        var translationResult = translateText(inputText);
        currentResult = translationResult.result;

        var outputContent = document.getElementById('outputContent');
        var sourceTag = document.getElementById('sourceTag');
        var speakButton = document.getElementById('speakButton');

        if (translationResult.success) {
          var html = '<span class="result">' + escapeHtml(translationResult.result) + '</span>';
          if (translationResult.explanation) {
            html += '<span class="explanation">' + escapeHtml(translationResult.explanation) + '</span>';
          }
          if (!translationResult.matched) {
            html += '<div class="feedback-btn" onclick="showFeedback()">提交反馈</div>';
          }
          outputContent.innerHTML = html;

          sourceTag.textContent = sourceLabels[translationResult.source] || '';
          sourceTag.style.display = 'inline-block';
          sourceTag.className = 'source-tag ' + (translationResult.source === 'dictionary' ? 'source-tag-normal' : translationResult.source === 'fuzzy' ? 'source-tag-fuzzy' : 'source-tag-none');

          speakButton.style.display = translationResult.result ? 'flex' : 'none';
        }
      } catch(e) {
        console.error('Translation error:', e);
        alert('翻译出错，请重试');
      }
    }

    function showFeedback() {
      var outputContent = document.getElementById('outputContent');
      var inputText = document.getElementById('inputText').value;
      outputContent.innerHTML = '<span class="result">' + escapeHtml(inputText) + '</span><span class="explanation">暂未收录该词汇，请提交正确的翻译</span><div class="feedback-box"><textarea class="feedback-input" id="feedbackInput" placeholder="输入正确的翻译..."></textarea><div class="feedback-actions"><button class="feedback-cancel" onclick="hideFeedback()">取消</button><button class="feedback-submit" onclick="submitFeedback()">提交</button></div></div>';
    }

    function hideFeedback() {
      handleTranslate();
    }

    function submitFeedback() {
      var feedbackInput = document.getElementById('feedbackInput');
      if (feedbackInput && feedbackInput.value.trim()) {
        alert('感谢反馈！你的建议将帮助我们完善词库。');
        hideFeedback();
      } else {
        alert('请输入翻译建议');
      }
    }

    function handleSpeak() {
      if ('speechSynthesis' in window && currentResult) {
        var utterance = new SpeechSynthesisUtterance(currentResult);
        utterance.lang = 'zh-CN';
        speechSynthesis.speak(utterance);
      }
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('translateBtn').addEventListener('click', handleTranslate);
      document.getElementById('speakButton').addEventListener('click', handleSpeak);
      document.getElementById('inputText').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleTranslate();
        }
      });
    });
  </script>
</body>
</html>
