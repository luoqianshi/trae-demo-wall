<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f3e9d2" />
<title>人情簿 · 礼俗小巷</title>
<style>
/* ============================================================
   视觉令牌：宣纸 / 墨色 / 朱红 / 鎏金 / 玉色
   ============================================================ */
:root{
  --paper:#f3e9d2;
  --paper-2:#efe2c4;
  --paper-line:#d8c79f;
  --ink:#2b2a26;
  --ink-soft:#5a544a;
  --ink-faint:#8a8175;
  --vermilion:#b03a3a;
  --vermilion-deep:#8c2d2d;
  --gold:#b8924a;
  --gold-soft:#d8b878;
  --jade:#5e8a72;
  --jade-soft:#9bbfae;
  --shadow:0 1px 3px rgba(60,42,15,.12);
  --shadow-2:0 4px 14px rgba(60,42,15,.16);
  --radius:14px;
  --radius-sm:10px;
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(184,146,74,.05) 0, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(176,58,58,.04) 0, transparent 40%),
    repeating-linear-gradient(0deg, transparent 0, transparent 24px, rgba(139,107,52,.03) 24px, rgba(139,107,52,.03) 25px);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* ============================================================
   应用容器：390 桌面居中
   ============================================================ */
.app-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:64px;
  position:relative;
  background:linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  box-shadow:0 0 30px rgba(60,42,15,.06);
}
@media(min-width:560px){
  .app-shell{margin-top:18px;margin-bottom:18px;min-height:calc(100vh - 36px);border-radius:18px;overflow:hidden}
}

/* ============================================================
   顶部栏
   ============================================================ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  border-bottom:1px solid var(--paper-line);
  background:rgba(243,233,210,.9);
  position:sticky;top:0;z-index:5;
}
.topbar .brand{display:flex;align-items:center;gap:8px}
.topbar .brand .seal{
  width:28px;height:28px;border-radius:6px;
  background:var(--vermilion);
  color:#fbf3df;font-family:var(--serif);font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.topbar .brand .title{font-family:var(--serif);font-size:18px;letter-spacing:1px;color:var(--ink)}
.topbar .right{display:flex;align-items:center;gap:6px}
.topbar .icon-btn{
  width:36px;height:36px;border:none;background:transparent;
  border-radius:8px;color:var(--ink-soft);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.topbar .icon-btn:hover{background:rgba(176,58,58,.08)}
.topbar .family-btn{
  height:32px;padding:0 12px;border-radius:16px;
  background:var(--ink);color:var(--paper);font-size:13px;border:none;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}

/* ============================================================
   页面容器
   ============================================================ */
.page{padding:16px;display:none}
.page.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.section-title{
  font-family:var(--serif);font-size:16px;letter-spacing:1px;
  color:var(--ink);margin:18px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-title::before{
  content:"";width:3px;height:14px;background:var(--vermilion);border-radius:2px;
}

/* ============================================================
   卡片
   ============================================================ */
.card{
  background:rgba(255,251,240,.85);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card.jade-edge{border-color:var(--jade-soft);background:rgba(155,191,174,.08)}
.card.gold-edge{border-color:var(--gold-soft)}

/* 欢迎语 */
.greeting{
  font-family:var(--serif);font-size:18px;line-height:1.6;
  color:var(--ink);margin:6px 2px 14px;
}
.greeting small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-top:4px;letter-spacing:.5px}

/* 快捷按钮 */
.quick-row{display:flex;gap:10px;margin-bottom:14px}
.quick-btn{
  flex:1;padding:12px;border-radius:var(--radius);border:1px solid var(--paper-line);
  background:rgba(255,251,240,.7);color:var(--ink);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.quick-btn:hover{border-color:var(--vermilion);color:var(--vermilion)}
.quick-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--vermilion)}

/* 统计四宫格 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{
  background:rgba(255,251,240,.85);
  border:1px solid var(--paper-line);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);cursor:pointer;
}
.stat-card .label{font-size:12px;color:var(--ink-faint);letter-spacing:.5px}
.stat-card .value{font-family:var(--serif);font-size:22px;margin-top:4px;color:var(--ink)}
.stat-card .value.out{color:var(--vermilion)}
.stat-card .value.in{color:var(--jade)}
.stat-card .sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.stat-card .value.masked{letter-spacing:2px}

/* 待回礼 */
.todo-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(216,199,159,.18);margin-bottom:8px;
}
.todo-item .left{display:flex;flex-direction:column;gap:2px}
.todo-item .name{font-size:14px;color:var(--ink)}
.todo-item .meta{font-size:11px;color:var(--ink-faint)}
.todo-item .actions{display:flex;gap:6px}
.todo-item .actions button{
  height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--vermilion);
  background:transparent;color:var(--vermilion);font-size:12px;cursor:pointer;
}
.todo-item .actions button.primary{background:var(--vermilion);color:#fbf3df}

/* 记录条目 */
.record-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-sm);cursor:pointer;
  background:rgba(255,251,240,.6);
}
.record-row:hover{background:rgba(255,251,240,.95)}
.record-row .badge{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:13px;
}
.record-row .badge.out{background:var(--vermilion);color:#fbf3df}
.record-row .badge.in{background:var(--jade);color:#fbf3df}
.record-row .info{flex:1;min-width:0}
.record-row .name{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-row .meta{font-size:11px;color:var(--ink-faint);margin-top:1px}
.record-row .amount{font-family:var(--serif);font-size:15px}
.record-row .amount.out{color:var(--vermilion)}
.record-row .amount.in{color:var(--jade)}

/* 底部导航 */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  display:flex;justify-content:space-around;align-items:center;
  height:60px;
  background:rgba(43,42,38,.96);
  border-top:1px solid var(--paper-line);
  z-index:10;
  backdrop-filter:blur(8px);
}
@media(min-width:560px){
  .app-shell{padding-bottom:78px}
  .tabbar{bottom:18px;border-radius:0 0 18px 18px}
}
.tab-btn{
  flex:1;background:transparent;border:none;color:#c8bfa9;
  font-size:11px;cursor:pointer;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:color .2s;
}
.tab-btn .ic{font-family:var(--serif);font-size:16px;line-height:1}
.tab-btn.active{color:var(--gold-soft)}
.tab-btn.active .ic{color:var(--vermilion);background:rgba(176,58,58,.12);border-radius:6px;padding:2px 6px}

/* 表单 */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:4px;letter-spacing:.5px}
.form-group .req{color:var(--vermilion)}
.form-control{
  width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:rgba(255,251,240,.8);color:var(--ink);font-size:14px;font-family:var(--sans);
  outline:none;
}
.form-control:focus{border-color:var(--vermilion)}
textarea.form-control{resize:vertical;min-height:60px}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.seg{
  display:flex;gap:0;border:1px solid var(--paper-line);border-radius:var(--radius-sm);overflow:hidden;
}
.seg button{
  flex:1;padding:8px;background:transparent;border:none;cursor:pointer;
  font-size:13px;color:var(--ink-soft);
}
.seg button.active{background:var(--ink);color:var(--paper)}
.quick-amounts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick-amounts button{
  padding:4px 10px;border-radius:14px;border:1px solid var(--paper-line);
  background:transparent;font-size:12px;color:var(--ink-soft);cursor:pointer;
}
.quick-amounts button:hover{border-color:var(--gold);color:var(--gold)}

.suggest-list{
  border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:rgba(255,251,240,.9);max-height:160px;overflow-y:auto;
}
.suggest-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--paper-line);font-size:13px}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:rgba(176,58,58,.06)}
.suggest-item small{color:var(--ink-faint);margin-left:6px}

/* 主按钮 */
.btn{
  height:44px;padding:0 18px;border:none;border-radius:22px;
  font-size:14px;cursor:pointer;font-family:var(--sans);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;
}
.btn.primary{background:var(--vermilion);color:#fbf3df}
.btn.primary:hover{background:var(--vermilion-deep)}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fbf3df}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--vermilion);border:1px solid var(--vermilion)}

/* 筛选条 */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:16px;
  border:1px solid var(--paper-line);background:rgba(255,251,240,.6);
  font-size:12px;color:var(--ink-soft);cursor:pointer;
  min-height:34px;display:inline-flex;align-items:center;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 推荐三档 */
.tier-grid{display:flex;flex-direction:column;gap:10px}
.tier-card{
  border:1px solid var(--paper-line);border-radius:var(--radius);
  padding:12px;background:rgba(255,251,240,.7);cursor:pointer;
}
.tier-card.recommended{border-color:var(--gold);background:rgba(184,146,74,.08);position:relative}
.tier-card.recommended::after{
  content:"推荐";position:absolute;top:-8px;right:10px;
  background:var(--gold);color:#fbf3df;font-size:10px;padding:1px 8px;border-radius:8px;
}
.tier-card .tier-name{font-family:var(--serif);font-size:14px;color:var(--ink)}
.tier-card .tier-amount{font-family:var(--serif);font-size:22px;color:var(--vermilion);margin:4px 0}
.tier-card .tier-range{font-size:11px;color:var(--ink-faint)}
.tier-card .tier-explain{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
.tier-card .tier-share{font-size:11px;color:var(--gold);margin-top:4px}

.breakdown{
  margin-top:10px;padding:10px;border-radius:var(--radius-sm);
  background:rgba(216,199,159,.15);font-size:12px;color:var(--ink-soft);line-height:1.7;
}
.breakdown .step{display:flex;justify-content:space-between;gap:8px}
.breakdown .step.total{border-top:1px dashed var(--paper-line);padding-top:6px;margin-top:4px;color:var(--ink)}

/* 弹层 */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,15,5,.4);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:480px;max-height:85vh;
  background:var(--paper);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{
  padding:14px 16px;border-bottom:1px solid var(--paper-line);
  display:flex;align-items:center;justify-content:space-between;
}
.sheet-head .title{font-family:var(--serif);font-size:16px}
.sheet-head .close{
  width:28px;height:28px;border:none;background:transparent;
  color:var(--ink-faint);font-size:18px;cursor:pointer;border-radius:50%;
}
.sheet-body{padding:16px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--paper-line);display:flex;gap:8px}

/* Toast */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:78px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;
  width:calc(100% - 32px);max-width:448px;pointer-events:none;
}
.toast{
  background:var(--ink);color:var(--paper);
  padding:10px 14px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;
  animation:toastIn .25s ease;pointer-events:auto;max-width:100%;
}
.toast .toast-action{
  background:var(--gold);color:#fbf3df;border:none;border-radius:6px;
  padding:3px 10px;font-size:12px;cursor:pointer;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 礼俗占位 */
.community-placeholder{
  text-align:center;padding:30px 20px;
}
.community-placeholder .gate{
  width:100%;max-width:280px;margin:0 auto 16px;
}
.community-placeholder .gate-title{
  font-family:var(--serif);font-size:24px;letter-spacing:6px;color:var(--vermilion);
  margin:8px 0 4px;
}
.community-placeholder .gate-sub{font-size:13px;color:var(--ink-faint);letter-spacing:2px}
.community-placeholder .desc{
  margin-top:18px;font-size:14px;line-height:1.8;color:var(--ink-soft);
  background:rgba(255,251,240,.7);padding:14px;border-radius:var(--radius);
  border:1px dashed var(--paper-line);
}
.coming-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:rgba(184,146,74,.15);color:var(--gold);margin-top:10px;letter-spacing:.5px;
}

/* ============================================================
   礼俗小巷
   ============================================================ */
.alley-header{
  text-align:center;padding:8px 0 14px;
}
.alley-header .gate-svg{width:100%;max-width:280px;margin:0 auto 6px}
.alley-header .gate-title{
  font-family:var(--serif);font-size:22px;letter-spacing:6px;color:var(--vermilion);
  margin:4px 0 2px;
}
.alley-header .gate-sub{font-size:12px;color:var(--ink-faint);letter-spacing:2px}
.alley-header .alley-quote{
  margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.7;
  background:rgba(255,251,240,.7);padding:10px 14px;border-radius:var(--radius);
  border:1px dashed var(--paper-line);
}
.alley-header .alley-quote b{color:var(--vermilion)}

.region-row{
  display:flex;align-items:center;gap:6px;margin-bottom:12px;
  font-size:12px;color:var(--ink-faint);
}
.region-row select{
  flex:1;padding:6px 8px;border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:rgba(255,251,240,.8);color:var(--ink);font-size:13px;font-family:var(--sans);
}

.circle-row{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;
  -webkit-overflow-scrolling:touch;
}
.circle-row::-webkit-scrollbar{display:none}
.circle-chip{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--paper-line);
  background:rgba(255,251,240,.6);cursor:pointer;min-width:74px;
}
.circle-chip .cic-icon{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;color:#fbf3df;
}
.circle-chip .cic-name{font-size:11px;color:var(--ink-soft)}
.circle-chip.active{border-color:var(--vermilion);background:rgba(176,58,58,.08)}
.circle-chip.joined .cic-icon::after{
  content:"✓";position:absolute;font-size:9px;
}
.circle-chip .cic-icon{position:relative}
.circle-chip .join-flag{
  position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
  background:var(--jade);color:#fbf3df;font-size:9px;display:none;
  align-items:center;justify-content:center;
}
.circle-chip.joined .join-flag{display:flex}

.topic-banner{
  background:linear-gradient(135deg, rgba(184,146,74,.12), rgba(176,58,58,.08));
  border:1px solid var(--gold-soft);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;cursor:pointer;
}
.topic-banner .tb-label{font-size:11px;color:var(--gold);letter-spacing:1px}
.topic-banner .tb-title{font-family:var(--serif);font-size:15px;color:var(--ink);margin-top:4px}
.topic-banner .tb-desc{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6}

.alley-search{
  display:flex;gap:6px;margin-bottom:8px;
}
.alley-search input{
  flex:1;padding:8px 12px;border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:rgba(255,251,240,.8);color:var(--ink);font-size:13px;outline:none;
}
.alley-search input:focus{border-color:var(--vermilion)}
.alley-search button{
  padding:0 12px;border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:transparent;color:var(--ink-soft);font-size:12px;cursor:pointer;
}

.alley-filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.alley-filter-bar::-webkit-scrollbar{display:none}

.content-section-title{
  font-family:var(--serif);font-size:14px;color:var(--ink);margin:16px 0 8px;
  display:flex;align-items:center;gap:6px;
}
.content-section-title::before{
  content:"";width:3px;height:12px;background:var(--gold);border-radius:2px;
}
.content-section-title .count{font-size:11px;color:var(--ink-faint);font-family:var(--sans)}

.post-card{
  background:rgba(255,251,240,.85);border:1px solid var(--paper-line);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);
  cursor:pointer;
}
.post-card.elder{border-left:3px solid var(--jade)}
.post-card.story{border-left:3px solid var(--gold)}
.post-card.ritual{border-left:3px solid var(--vermilion)}
.post-card.aid{border-left:3px solid var(--jade-soft)}
.post-card .pc-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.post-card .pc-tag{
  font-size:10px;padding:1px 6px;border-radius:8px;
  background:rgba(184,146,74,.15);color:var(--gold);
}
.post-card .pc-region{font-size:11px;color:var(--ink-faint)}
.post-card .pc-scene{font-size:11px;color:var(--vermilion);background:rgba(176,58,58,.08);padding:1px 6px;border-radius:8px}
.post-card .pc-title{font-family:var(--serif);font-size:14px;color:var(--ink);margin-bottom:4px}
.post-card .pc-body{font-size:13px;color:var(--ink-soft);line-height:1.65}
.post-card .pc-diff{
  margin-top:6px;font-size:11px;color:var(--ink-faint);
  background:rgba(216,199,159,.12);padding:5px 8px;border-radius:6px;
}
.post-card .pc-source{font-size:11px;color:var(--ink-faint);margin-top:6px}
.post-card .pc-coauthor{
  display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;
  background:rgba(94,138,114,.15);color:var(--jade);margin-left:4px;
}
.post-card .pc-aid-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

.reaction-row{
  display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;
}
.react-btn{
  padding:4px 10px;border-radius:14px;border:1px solid var(--paper-line);
  background:transparent;font-size:11px;color:var(--ink-soft);cursor:pointer;
  display:flex;align-items:center;gap:3px;
}
.react-btn:hover{border-color:var(--gold);color:var(--gold)}
.react-btn.active{background:rgba(184,146,74,.15);border-color:var(--gold);color:var(--gold)}
.react-btn .rc-count{font-size:10px;color:var(--ink-faint)}
.react-btn.active .rc-count{color:var(--gold)}

.differs-hint{
  margin-top:6px;padding:8px 10px;border-radius:6px;
  background:rgba(94,138,114,.1);font-size:11px;color:var(--ink-soft);line-height:1.6;
  border:1px dashed var(--jade-soft);
}

.empty-alley{
  padding:36px 20px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.7;
}
.empty-alley .ea-icon{font-family:var(--serif);font-size:28px;color:var(--paper-line);margin-bottom:8px}

.alley-bottom-bar{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;padding:10px 16px;
  background:linear-gradient(180deg, transparent, var(--paper) 30%);
  z-index:8;display:flex;
}
@media(min-width:560px){
  .alley-bottom-bar{bottom:78px}
}
.alley-bottom-bar .btn{width:100%}

.privacy-bottom{
  margin:16px 0;padding:12px;border-radius:var(--radius);
  background:rgba(232,230,223,.5);border:1px dashed var(--ink-faint);
}
.privacy-bottom .pb-title{font-family:var(--serif);font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.privacy-bottom ul{margin:0;padding-left:18px;font-size:11px;color:var(--ink-faint);line-height:1.8}

/* 投稿表单 */
.post-form .form-group{margin-bottom:10px}
.post-form .privacy-warn{
  margin-top:8px;padding:8px 10px;border-radius:6px;
  background:rgba(176,58,58,.08);border:1px dashed var(--vermilion);
  font-size:11px;color:var(--vermilion);line-height:1.6;
}
.post-form .privacy-warn:empty{display:none}
.post-form .switch-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.post-form .switch-row input{width:auto}

.draft-card{
  background:rgba(255,251,240,.7);border:1px dashed var(--paper-line);
  border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;
}
.draft-card .dc-title{font-size:13px;color:var(--ink);margin-bottom:4px}
.draft-card .dc-meta{font-size:11px;color:var(--ink-faint)}
.draft-card .dc-actions{display:flex;gap:6px;margin-top:8px}
.draft-card .dc-actions button{
  height:26px;padding:0 10px;border-radius:13px;font-size:11px;cursor:pointer;border:1px solid var(--paper-line);
  background:transparent;color:var(--ink-soft);
}
.draft-card .dc-actions button.primary{background:var(--jade);color:#fbf3df;border-color:var(--jade)}
.draft-card .dc-actions button.danger{color:var(--vermilion);border-color:var(--vermilion)}

/* 详情字段表 */
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
.detail-grid .k{color:var(--ink-faint)}
.detail-grid .v{color:var(--ink)}

.empty{padding:30px 16px;text-align:center;color:var(--ink-faint);font-size:13px}

/* 白事降噪 */
body.funeral-mode{background:#e8e6df;background-image:none}
body.funeral-mode .topbar{background:rgba(232,230,223,.9)}
body.funeral-mode .brand .seal{background:#5a544a}
body.funeral-mode .tab-btn.active .ic{color:#5a544a;background:rgba(90,84,74,.12)}
body.funeral-mode .vermilion-text{color:#5a544a!important}
body.funeral-mode .tier-card.recommended{border-color:#7a7468;background:rgba(122,116,104,.08)}
body.funeral-mode .tier-card.recommended::after{background:#7a7468}
body.funeral-mode .tier-card .tier-amount{color:#3a3530}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ============================================================
   阶段二新增：朱印动效 / 置信度 / 批量 / 麦克风
   ============================================================ */
/* 朱印动效 */
.seal-overlay{
  position:fixed;inset:0;z-index:80;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,15,5,0);
}
.seal-overlay.show{animation:sealFlash .9s ease forwards}
@keyframes sealFlash{
  0%{background:rgba(20,15,5,0)}
  20%{background:rgba(20,15,5,.18)}
  100%{background:rgba(20,15,5,0)}
}
.seal-stamp{
  width:120px;height:120px;border-radius:50%;
  background:var(--vermilion);color:#fbf3df;
  font-family:var(--serif);font-size:32px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  letter-spacing:4px;
  box-shadow:0 0 0 4px rgba(176,58,58,.18), inset 0 0 0 2px rgba(255,255,255,.15);
  opacity:0;transform:scale(1.8) rotate(-12deg);
}
.seal-overlay.show .seal-stamp{animation:sealStamp .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sealStamp{
  0%{opacity:0;transform:scale(1.8) rotate(-12deg)}
  30%{opacity:1;transform:scale(1.05) rotate(-6deg)}
  60%{opacity:1;transform:scale(1) rotate(-3deg)}
  100%{opacity:0;transform:scale(.9) rotate(-3deg)}
}

/* 置信度 */
.conf-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.conf-row .conf-k{color:var(--ink-faint);width:54px;flex-shrink:0}
.conf-row .conf-v{color:var(--ink);flex:1}
.conf-row .conf-bar{
  width:48px;height:5px;border-radius:3px;background:rgba(139,107,52,.18);overflow:hidden;flex-shrink:0;
}
.conf-row .conf-bar i{display:block;height:100%;border-radius:3px}
.conf-row .conf-tag{font-size:10px;padding:1px 6px;border-radius:8px;flex-shrink:0}
.conf-row.high .conf-bar i{background:var(--jade)}
.conf-row.high .conf-tag{background:rgba(94,138,114,.15);color:var(--jade)}
.conf-row.mid .conf-bar i{background:var(--gold)}
.conf-row.mid .conf-tag{background:rgba(184,146,74,.15);color:var(--gold)}
.conf-row.low .conf-bar i{background:var(--vermilion)}
.conf-row.low .conf-tag{background:rgba(176,58,58,.12);color:var(--vermilion)}
.conf-warn{
  margin-top:8px;padding:6px 10px;border-radius:8px;
  background:rgba(176,58,58,.08);border:1px dashed var(--vermilion);
  font-size:11px;color:var(--vermilion);line-height:1.5;
}

/* 麦克风按钮 */
.mic-btn{
  width:64px;height:64px;border-radius:50%;border:none;
  background:var(--vermilion);color:#fbf3df;font-size:24px;
  cursor:pointer;box-shadow:0 4px 12px rgba(176,58,58,.35);
  display:flex;align-items:center;justify-content:center;
  margin:10px auto;
}
.mic-btn:disabled{background:var(--ink-faint);cursor:not-allowed;box-shadow:none}
.mic-btn.recording{animation:micPulse 1.2s ease-in-out infinite}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(176,58,58,.45)}
  50%{box-shadow:0 0 0 12px rgba(176,58,58,0)}
}
.mic-hint{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:4px}

/* 批量面板 */
.batch-row{
  display:flex;align-items:center;gap:6px;margin-bottom:6px;
  padding:6px;background:rgba(255,251,240,.7);border-radius:8px;
  border:1px solid var(--paper-line);
}
.batch-row.error{border-color:var(--vermilion);background:rgba(176,58,58,.05)}
.batch-row input{
  border:1px solid var(--paper-line);border-radius:6px;padding:5px 8px;
  font-size:13px;background:rgba(255,251,240,.9);color:var(--ink);
}
.batch-row input[name="name"]{flex:1;min-width:0}
.batch-row input[name="amount"]{width:78px}
.batch-row .del-row{
  width:28px;height:28px;border:none;background:transparent;
  color:var(--vermilion);font-size:16px;cursor:pointer;border-radius:6px;
}
.batch-row .row-warn{font-size:10px;color:var(--vermilion);width:100%;margin-top:2px}
.batch-toolbar{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}

/* 草稿警告 toast */
.toast.warn{background:var(--gold);color:#fbf3df}
.toast.warn .toast-action{background:#fbf3df;color:var(--gold)}

/* ============================================================
   阶段四：往来中心 / 星图 / 日历 / 年度 / 互助 / 祝福 / 共簿
   ============================================================ */
/* 往来中心子视图切换 */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--paper-line);margin-bottom:12px;overflow-x:auto}
.sub-tabs button{
  border:none;background:transparent;padding:10px 14px;font-size:13px;
  color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.sub-tabs button.active{color:var(--vermilion);border-bottom-color:var(--vermilion);font-weight:600}

/* 搜索框 */
.search-box{
  display:flex;gap:6px;margin-bottom:10px;
}
.search-box input{
  flex:1;border:1px solid var(--paper-line);border-radius:10px;
  padding:8px 12px;font-size:13px;background:rgba(255,251,240,.9);color:var(--ink);
}

/* 联系人卡片 */
.contact-card{
  display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;
  background:rgba(255,251,240,.7);border-radius:10px;border:1px solid var(--paper-line);
  cursor:pointer;
}
.contact-card .cc-dot{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:15px;color:#fbf3df;
}
.contact-card .cc-info{flex:1;min-width:0}
.contact-card .cc-name{font-size:14px;color:var(--ink);font-weight:500}
.contact-card .cc-meta{font-size:11px;color:var(--ink-faint);margin-top:2px}
.contact-card .cc-todo{
  width:8px;height:8px;border-radius:50%;background:var(--vermilion);flex-shrink:0;
}

/* 时间轴 */
.timeline{position:relative;padding-left:18px;margin-top:8px}
.timeline:before{
  content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;
  background:var(--paper-line);border-radius:1px;
}
.tl-item{position:relative;padding:0 0 12px 4px}
.tl-item:before{
  content:'';position:absolute;left:-16px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--gold);border:2px solid var(--paper);
}
.tl-item.help:before{background:var(--jade)}
.tl-item.in:before{background:var(--vermilion)}
.tl-date{font-size:11px;color:var(--ink-faint)}
.tl-text{font-size:13px;color:var(--ink);margin-top:2px}

/* 礼数日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{
  border:1px solid var(--paper-line);background:rgba(255,251,240,.8);
  border-radius:8px;padding:4px 12px;font-size:13px;color:var(--ink);cursor:pointer;
}
.cal-head .cal-month{font-family:var(--serif);font-size:15px;color:var(--vermilion)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .cal-dow{
  text-align:center;font-size:11px;color:var(--ink-faint);padding:4px 0;
}
.cal-cell{
  aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink);background:rgba(255,251,240,.5);position:relative;
  cursor:default;
}
.cal-cell.empty{background:transparent}
.cal-cell.today{background:rgba(176,58,58,.1);font-weight:600}
.cal-cell.has-todo{cursor:pointer}
.cal-cell .cal-dot{
  width:6px;height:6px;border-radius:50%;background:var(--vermilion);margin-top:2px;
}
.cal-cell .cal-dot.decided{background:var(--gold)}
.cal-cell .cal-dot.done{background:var(--jade)}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink-faint);flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* 年度回顾 */
.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.year-stat{
  background:rgba(255,251,240,.7);border-radius:10px;padding:12px;border:1px solid var(--paper-line);
}
.year-stat .ys-label{font-size:11px;color:var(--ink-faint)}
.year-stat .ys-value{font-size:20px;font-family:var(--serif);color:var(--vermilion);margin-top:4px}
.year-stat .ys-sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.warm-card{
  background:rgba(155,191,174,.1);border-radius:10px;padding:10px 12px;
  border:1px solid var(--jade-soft);margin-bottom:6px;
}
.warm-card .wc-tag{font-size:10px;color:var(--jade)}
.warm-card .wc-text{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.6}

/* 人情星图 */
.starmap-wrap{
  background:rgba(255,251,240,.6);border-radius:12px;border:1px solid var(--paper-line);
  padding:8px;margin-bottom:12px;
}
.starmap-wrap svg{display:block;width:100%;height:auto}
.sm-node{cursor:pointer}
.sm-node:hover circle{filter:brightness(1.1)}
.sm-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--ink-faint)}
.sm-legend span{display:flex;align-items:center;gap:3px}
.sm-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* 邻里互助扩展 */
.aid-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.aid-actions button{
  font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--paper-line);
  background:rgba(255,251,240,.8);color:var(--ink-soft);cursor:pointer;
}
.aid-actions button.active{background:var(--jade);color:#fbf3df;border-color:var(--jade)}
.aid-actions button.danger{color:var(--vermilion)}
.aid-resolved{font-size:10px;color:var(--jade);margin-top:4px}
.aid-form-row{margin-bottom:8px}
.aid-form-row label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:3px}
.aid-form-row input,.aid-form-row select{
  width:100%;border:1px solid var(--paper-line);border-radius:8px;
  padding:7px 10px;font-size:13px;background:rgba(255,251,240,.9);color:var(--ink);
}

/* 祝福话术 */
.blessing-tone{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.blessing-tone button{
  font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--paper-line);
  background:rgba(255,251,240,.8);color:var(--ink-soft);cursor:pointer;
}
.blessing-tone button.active{background:var(--gold);color:#fbf3df;border-color:var(--gold)}
.blessing-card{
  background:rgba(255,251,240,.7);border-radius:10px;padding:10px 12px;
  border:1px solid var(--paper-line);margin-bottom:8px;
}
.blessing-card textarea{
  width:100%;border:1px solid var(--paper-line);border-radius:8px;
  padding:8px;font-size:13px;background:rgba(255,251,240,.9);color:var(--ink);
  min-height:60px;resize:vertical;font-family:inherit;line-height:1.6;
}
.blessing-card .bc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.blessing-card .bc-foot button{
  font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--paper-line);
  background:rgba(255,251,240,.8);color:var(--ink-soft);cursor:pointer;
}
.blessing-card .bc-foot button.primary{background:var(--jade);color:#fbf3df;border-color:var(--jade)}

/* 夫妻共簿 - 家庭动态 */
.feed-list{margin-top:8px}
.feed-item{
  display:flex;gap:8px;padding:8px 10px;margin-bottom:5px;
  background:rgba(255,251,240,.6);border-radius:8px;font-size:12px;
}
.feed-item .fi-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;
}
.feed-item .fi-text{color:var(--ink-soft);line-height:1.5}
.feed-item .fi-text b{color:var(--ink)}

/* 邀请伴侣卡 */
.invite-card{
  text-align:center;padding:16px;background:rgba(184,146,74,.06);
  border-radius:12px;border:1px dashed var(--gold);margin-top:10px;
}
.invite-qr{
  width:120px;height:120px;margin:8px auto;background:#fbf3df;
  border:2px solid var(--ink-soft);border-radius:8px;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:1px;padding:6px;
}
.invite-qr i{background:var(--ink)}
.invite-code{
  font-family:var(--serif);font-size:24px;letter-spacing:8px;color:var(--vermilion);
  margin:10px 0 4px;
}
.invite-note{font-size:11px;color:var(--ink-faint);line-height:1.5}

/* 切换行 */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.switch-row .sr-label{font-size:13px;color:var(--ink)}
.switch-row .sr-note{font-size:11px;color:var(--ink-faint);margin-top:2px}
.switch-toggle{
  width:40px;height:22px;border-radius:11px;background:var(--paper-line);
  position:relative;cursor:pointer;border:none;flex-shrink:0;
}
.switch-toggle.on{background:var(--jade)}
.switch-toggle:after{
  content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fbf3df;transition:transform .2s;
}
.switch-toggle.on:after{transform:translateX(18px)}

/* 详情按钮组 */
.sheet-foot .btn{flex:1}
.sheet-foot{display:flex;gap:6px;flex-wrap:wrap}
.detail-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.detail-actions button{
  font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--paper-line);
  background:rgba(255,251,240,.8);color:var(--ink-soft);cursor:pointer;
}
.detail-actions button.primary{background:var(--vermilion);color:#fbf3df;border-color:var(--vermilion)}
.detail-actions button.danger{color:var(--vermilion)}
</style>
</head>
<body>
<div class="app-shell" id="appShell">
  <header class="topbar">
    <div class="brand">
      <span class="seal">簿</span>
      <span class="title">人情簿</span>
    </div>
    <div class="right">
      <button class="icon-btn" data-action="toggle-mask" aria-label="金额遮罩" title="金额遮罩">
        <span id="maskIcon">⊙</span>
      </button>
      <button class="family-btn" data-action="open-settings">
        <span>我们家</span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- 五个页面由 JS 渲染 -->
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-action="switch-tab" data-tab="home"><span class="ic">家</span><span>首页</span></button>
    <button class="tab-btn" data-action="switch-tab" data-tab="add"><span class="ic">记</span><span>记账</span></button>
    <button class="tab-btn" data-action="switch-tab" data-tab="advisor"><span class="ic">参</span><span>参谋</span></button>
    <button class="tab-btn" data-action="switch-tab" data-tab="community"><span class="ic">俗</span><span>礼俗</span></button>
    <button class="tab-btn" data-action="switch-tab" data-tab="records"><span class="ic">往</span><span>往来</span></button>
  </nav>
</div>

  <div class="sheet" id="sheetEl" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<div class="seal-overlay" id="sealOverlay"><div class="seal-stamp">已记</div></div>

<script>
"use strict";

/* ============================================================
   01. Constants and enums
   ============================================================ */
const STORAGE_KEY = 'renqing-community-demo-v1';
const DEMO_TODAY = '2026-07-14'; // 固定演示日期

const EVENT_TYPES = ['婚礼','满月','乔迁','升学','白事','生日'];
const RELATIONS = ['长辈','亲戚','朋友','同学','同事','邻居'];
const CITIES = ['杭州','上海','苏州','三线及以下'];
const DIRECTIONS = [{key:'OUT',label:'我随出'},{key:'IN',label:'对方给我'}];
const CONTRIBUTION_TYPES = [

let state = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ state = buildSeedState(); saveState(); return; }
    state = JSON.parse(raw);
    if(!state || state.schemaVersion !== 1){
      state = buildSeedState();
      saveState();
      return;
    }
    // 迁移：补齐社区字段（老版本 state 没有）
    const seed = buildSeedState();
    let migrated = false;
    if(!state.circles){ state.circles = seed.circles; migrated = true; }
    if(!state.joinedCircleIds){ state.joinedCircleIds = ['c-family']; migrated = true; }
    if(!state.communityPosts){ state.communityPosts = seed.communityPosts; migrated = true; }
    if(!state.communityDrafts){ state.communityDrafts = []; migrated = true; }
    if(!state.mutualAidPosts){ state.mutualAidPosts = seed.mutualAidPosts; migrated = true; }
    if(!state.reactions){ state.reactions = {}; migrated = true; }
    // 阶段四字段迁移
    if(!state.userSettings){ state.userSettings = seed.userSettings; migrated = true; }
    if(!state.amountMaskedByUser){ state.amountMaskedByUser = seed.amountMaskedByUser; migrated = true; }
    if(!state.communityDraftsByUser){ state.communityDraftsByUser = seed.communityDraftsByUser; migrated = true; }
    if(!state.familyFeed){ state.familyFeed = seed.familyFeed; migrated = true; }
    if(!state.familyRituals){ state.familyRituals = seed.familyRituals; migrated = true; }
    if(!state.inviteState){ state.inviteState = seed.inviteState; migrated = true; }
    // 迁移互助卡新字段
    state.mutualAidPosts.forEach(p => {
      if(p.favorited === undefined){ p.favorited = false; migrated = true; }
      if(p.resolved === undefined){ p.resolved = false; migrated = true; }
      if(p.ownerId === undefined){ p.ownerId = null; migrated = true; }
    });
    // 同步当前用户的隔离设置到运行时
    if(state.amountMaskedByUser[state.currentUserId] !== undefined){
      state.amountMasked = state.amountMaskedByUser[state.currentUserId];
    }
    if(migrated) saveState();
  }catch(e){
    console.warn('loadState 失败，重置为演示数据', e);
    state = buildSeedState();
    saveState();
  }
}

  try{

function getContactById(id){
  return state.contacts.find(c => c.id === id) || null;
}
function getRecordById(id){
  return state.records.find(r => r.id === id) || null;
}
function getActiveRecords(){
  return state.records.filter(r => !r.deletedAt);
}
function getActiveTodos(){
  return state.todos.filter(t => t.status !== 'DONE');
}

function formatFenToYuan(fen){
  // 整数分 -> "1,200" 字符串
  const yuan = Math.round(fen / 100);
  return yuan.toLocaleString('zh-CN');
}
function formatYuanWithSign(fen, direction){
  const sign = direction === 'OUT' ? '-' : '+';
  return sign + '¥' + formatFenToYuan(fen);
}
function maskAmount(fen){
  // 用点位遮罩
  return '¥••••';
}
function displayAmount(fen, direction){
  if(state.amountMasked) return maskAmount(fen);
  return formatYuanWithSign(fen, direction);
}

function getDisplayName(contactId){
  const c = getContactById(contactId);
  if(!c) return '未知';
  // 同名检测
  const sameName = state.contacts.filter(x => x.name === c.name);
  if(sameName.length > 1){
    return c.name + '（' + (c.sharedNote || c.relation) + '）';
  }
  return c.name;
}

// 统计
function calcStats(){
  const records = getActiveRecords();
  let outFen = 0, inFen = 0;
  const contactSet = new Set();
  records.forEach(r => {
    if(r.contributionType === 'MONEY'){
      if(r.direction === 'OUT') outFen += r.amountFen;
      else inFen += r.amountFen;
    }
    contactSet.add(r.contactId);
  });
  return {
    outFen, inFen,
    recordCount: records.length,
    contactCount: contactSet.size,
    pendingTodoCount: getActiveTodos().length
  };
}

function getRecentRecords(limit){
  const records = getActiveRecords()
    .slice()
    .sort((a,b) => (b.date < a.date ? -1 : b.date > a.date ? 1 : 0));
  return records.slice(0, limit || 5);
}

function daysBetween(d1, d2){
  const t1 = new Date(d1).getTime();
  const t2 = new Date(d2).getTime();
  return Math.round((t2 - t1) / 86400000);
}

function renderStarMapSvg(){
  const nodes = getStarMapData();
  const cx = 150, cy = 160, r = 110;
  const maxCount = Math.max(1, ...nodes.map(n => n.count));
  let html = '<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">';
  // 连线
  nodes.forEach((n, i) => {
    const angle = (i / Math.max(1, nodes.length)) * Math.PI * 2 - Math.PI/2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const op = 0.15 + 0.5 * (n.count / maxCount);
    html += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#b8924a" stroke-width="${(0.5 + 1.5*n.count/maxCount).toFixed(1)}" stroke-opacity="${op.toFixed(2)}"/>`;
  });
  // 中心节点
  html += `<circle cx="${cx}" cy="${cy}" r="22" fill="#b03a3a" stroke="#8c2d2d" stroke-width="2"/>`;
  html += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Songti SC,serif" font-size="12" fill="#fbf3df">我们家</text>`;
  // 联系人节点
  nodes.forEach((n, i) => {
    const angle = (i / Math.max(1, nodes.length)) * Math.PI * 2 - Math.PI/2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const radius = 8 + 10 * (n.count / maxCount);
    html += `<g class="sm-node" data-action="open-contact" data-id="${n.id}">`;
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${n.color}" stroke="#fbf3df" stroke-width="1.5"/>`;
    if(n.hasTodo){
      html += `<circle cx="${(x+radius*0.7).toFixed(1)}" cy="${(y-radius*0.7).toFixed(1)}" r="4" fill="#b03a3a" stroke="#fbf3df" stroke-width="1"/>`;
    }
    const labelY = y + radius + 10;
    html += `<text x="${x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="9" fill="#5a544a">${escapeHTML(n.name)}</text>`;
    html += `</g>`;
  });
  html += '</svg>';
  // 图例
  const relColors = {'长辈':'#b03a3a','亲戚':'#b8924a','朋友':'#5e8a72','同学':'#5a544a','同事':'#8a8175','邻居':'#9bbfae'};
  const rels = [...new Set(nodes.map(n => n.relation))];
  html += '<div class="sm-legend">';
  html += rels.map(r => `<span><i style="background:${relColors[r]||'#8a8175'}"></i>${escapeHTML(r)}</span>`).join('');
  html += '<span><i style="background:#b03a3a"></i>有待办</span>';
  html += '</div>';
  return html;
}

   05. Recommendation engine
   ============================================================ */

// 计算与某联系人的历史平均金额
function getHistoryWithContact(contactId, eventType){
  const records = getActiveRecords().filter(r =>
    r.contactId === contactId &&
    r.contributionType === 'MONEY' &&
    (!eventType || r.eventType === eventType)
  );
  if(records.length === 0) return null;
  const sum = records.reduce((s,r) => s + r.amountFen, 0);
  return Math.round(sum / records.length);
}

// 吉利数取整：绝不超过 maxAmount
function chooseLuckyAmount(target, maxAmount, eventType){
  if(maxAmount <= 0) return 0;
  // 白事：使用单数 +1（301/501...），不出现 6/8/9 等喜庆尾数
  if(eventType === '白事'){
    let base = Math.floor(Math.min(target, maxAmount) / 100) * 100;
    let candidate = base + 1;
    while(candidate > maxAmount && base > 0){
      base -= 100;
      candidate = base + 1;
    }
    return Math.max(candidate, 101);
  }
  // 喜庆：候选尾数 66/88/99/68/86，严格不超过预算
  const cappedTarget = Math.min(target, maxAmount);
  const base = Math.floor(cappedTarget / 100) * 100;
  const candidates = [base + 66, base + 88, base + 99, base + 68, base + 86, base];
  const valid = candidates.filter(c => c > 0 && c <= maxAmount);
  if(valid.length === 0){
    return Math.max(Math.floor(maxAmount / 100) * 100, 100);
  }
  // 选最接近 target 的
  return valid.reduce((best, c) =>
    Math.abs(c - cappedTarget) < Math.abs(best - cappedTarget) ? c : best
  );
}

// 推荐主算法
function calculateRecommendation(input){
  // input: { contactId, eventType, city, monthlySalaryFen, budgetCapFen, attendees }
  const contact = getContactById(input.contactId);
  const city = input.city || (contact ? contact.city : '杭州') || '杭州';
  const eventType = input.eventType || '婚礼';
  const monthlySalaryFen = input.monthlySalaryFen || 0;
  const budgetCapFen = input.budgetCapFen || 0;
  const attendees = input.attendees || 1;
  const isFuneral = eventType === '白事';

  // 1. 基础金额：优先历史，否则城市基准
  const historyAvg = getHistoryWithContact(input.contactId, eventType);
  let baseAmountYuan;
  let baseSource;
  if(historyAvg != null){
    baseAmountYuan = historyAvg / 100;
    baseSource = '历史平均 ¥' + formatFenToYuan(historyAvg);
  }else{
    baseAmountYuan = REGIONAL_DB[city][eventType] || 500;
    baseSource = city + ' 行情 ¥' + baseAmountYuan;
  }

  // 2. 关系系数
  const relation = contact ? contact.relation : '朋友';
  const relationFactor = RELATION_FACTORS[relation] || 1.0;

  // 3. 事件系数
  const eventFactor = EVENT_FACTORS[eventType] || 1.0;

  // 4. 时间折算：取最近一次记录到现在的时间差 × 通胀
  let timeFactor = 1.0;
  const lastRec = getActiveRecords()
    .filter(r => r.contactId === input.contactId)
    .sort((a,b) => (b.date < a.date ? -1 : 1))[0];
  const isFirstTime = !lastRec;
  let timeExplain = '首次记录';
  if(lastRec){
    const years = daysBetween(lastRec.date, DEMO_TODAY) / 365;
    timeFactor = 1 + years * ANNUAL_INFLATION;
    timeExplain = '距上次 ' + Math.max(1, Math.round(years * 12)) + ' 月 ×5%';
  }

  // 5. 出席人数调整
  const attendFactor = ATTENDANCE_FACTORS[attendees] || 1.0;

  // 计算中位金额
  const targetYuan = baseAmountYuan * relationFactor * eventFactor * timeFactor * attendFactor;
  const targetFen = Math.round(targetYuan * 100);

  // 6. 月薪上限（建议不超过月薪 5%）
  const salaryCapFen = monthlySalaryFen > 0 ? Math.round(monthlySalaryFen * 0.05) : Infinity;

  // 7. 三档：量力 70% / 稳妥 100% / 体面 130%
  const tiers = [
    {key:'conservative', name:'量力', factor:0.7, explain:'量力而行，不给生活添压'},
    {key:'stable',       name:'稳妥', factor:1.0, explain:'参考当地做法，多数人会选择', recommended:true},
    {key:'decent',       name:isFuneral?'慰问心意':'体面', factor:1.3, explain:isFuneral?'人到心意到，慰问为重':'体面出席，关系较近时合适'}
  ];

  const results = tiers.map(t => {
    const rawTarget = Math.round(targetFen * t.factor);
    // 上限取最小值（月薪 + 预算）
    const hardCap = Math.min(salaryCapFen, budgetCapFen || Infinity);
    const finalCap = isFinite(hardCap) ? hardCap : rawTarget;
    const finalAmount = chooseLuckyAmount(rawTarget, finalCap, eventType);
    const minRange = Math.max(100, Math.round(finalAmount * 0.85));
    const maxRange = finalCap;
    const sharePct = monthlySalaryFen > 0 ? (finalAmount / monthlySalaryFen * 100) : null;
    return {
      key: t.key,
      name: t.name,
      amountFen: finalAmount,
      amountYuan: finalAmount / 100,
      minRangeFen: minRange,
      maxRangeFen: maxRange,
      explain: t.explain,
      recommended: !!t.recommended,
      sharePct: sharePct,
      capped: rawTarget > finalCap
    };
  });

  // 可信度：综合历史/数据完整度/上限收敛情况
  // - 有历史记录 +0.25
  // - 月薪已填 +0.15
  // - 预算已填 +0.15
  // - 关系明确 +0.15
  // - 城市行情完整 +0.15
  // - 出席人数 ≥2 +0.05
  // - 至少有一档被预算收敛 -0.10
  let confidence = 0.45;
  if(!isFirstTime) confidence += 0.25;
  if(monthlySalaryFen > 0) confidence += 0.15;
  if(budgetCapFen > 0) confidence += 0.15;
  if(contact && contact.relation) confidence += 0.15;
  if(REGIONAL_DB[city] && REGIONAL_DB[city][eventType]) confidence += 0.15;
  if(attendees >= 2) confidence += 0.05;
  if(results.some(t => t.capped)) confidence -= 0.10;
  confidence = Math.max(0.3, Math.min(0.97, confidence));

  return {
    contactName: contact ? contact.name : '',
    contactId: input.contactId,
    eventType: eventType,
    city: city,
    isFuneral: isFuneral,
    isFirstTime: isFirstTime,
    baseSource: baseSource,
    confidence: confidence,
    breakdown: {
      base: baseAmountYuan,
      baseSource: baseSource,
      relation: relation,
      relationFactor: relationFactor,
      eventType: eventType,
      eventFactor: eventFactor,
      timeExplain: timeExplain,
      timeFactor: timeFactor,
      attendees: attendees,
      attendFactor: attendFactor,
      salaryCapFen: salaryCapFen,
      budgetCapFen: budgetCapFen
    },
    tiers: results
  };
}

// 中文金额解析：支持 五百 / 一千二 / 一千二百 / 六百六十六 / 两千零八十八 / 500块
function parseChineseAmount(text){
  if(!text) return null;
  // 1. 先尝试阿拉伯数字
  const arabMatch = String(text).match(/(\d+(?:\.\d+)?)/);
  if(arabMatch){
    const n = parseFloat(arabMatch[1]);
    if(!isNaN(n) && n > 0) return Math.round(n);
  }
  // 2. 中文数字
  const digits = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const units  = {'十':10,'百':100,'千':1000,'万':10000};
  const valid = Object.assign({}, digits, units);
  // 抽取连续中文数字段
  let start = -1, end = -1;
  for(let i = 0; i < text.length; i++){
    if(valid[text[i]] !== undefined){
      if(start === -1) start = i;
      end = i + 1;
    }else if(start !== -1) break;
  }
  if(start === -1) return null;
  const s = text.slice(start, end);

  let total = 0;
  let section = 0;
  let current = 0;
  let hasCurrent = false;
  let lastUnit = 0;

  for(const ch of s){
    if(digits[ch] !== undefined){
      current = digits[ch];
      hasCurrent = true;
    }else if(units[ch] !== undefined){
      const u = units[ch];
      if(u === 10000){
        section = (section + (hasCurrent ? current : 0)) * u;
        total += section;
        section = 0;
        current = 0;
        hasCurrent = false;
        lastUnit = 0;
      }else{
        if(!hasCurrent) current = 1; // "十" 单独出现 = 10
        section += current * u;
        current = 0;
        hasCurrent = false;
        lastUnit = u;
      }
    }
  }
  // 处理尾部省略，如 "一千二" → 2 应解释为 2*100
  let trailing = 0;
  if(hasCurrent){
    if(lastUnit === 1000) trailing = current * 100;
    else if(lastUnit === 100) trailing = current * 10;
    else trailing = current;
  }
  return total + section + trailing || null;
}

// 从任意文本尝试解析出语音字段（用于真实 Web Speech API 结果）
function parseVoiceFreeText(text){
  if(!text) return null;
  const original = text;
  // 联系人：去掉金额、城市、事件词后的剩余主语片段
  let name = '', amount = null, direction = 'OUT', eventType = '', date = DEMO_TODAY, city = '';

  // 金额（中文或阿拉伯）
  amount = parseChineseAmount(text);
  // 事件
  for(const e of EVENT_TYPES){
    if(text.includes(e)){ eventType = e; break; }
  }
  // 方向
  if(/给我|送我|收到|给我们/.test(text)) direction = 'IN';
  else if(/我随|我给|我出|随了|给了|我送/.test(text)) direction = 'OUT';
  // 城市
  for(const c of CITIES){ if(text.includes(c)){ city = c; break; } }
  // 日期线索
  if(/去年/.test(text)) date = '2025-09-15';
  if(/今天/.test(text)) date = DEMO_TODAY;
  if(/前年/.test(text)) date = '2024-09-15';
  // 联系人：尝试取 "给/随了/送" 前的 2-3 个汉字
  const m = text.match(/([\u4e00-\u9fa5]{2,4})(?:给我们|给我|结婚|白事|乔迁|满月|升学|生日|父亲|母亲)/);
  if(m) name = m[1];
  // 进一步：去掉常见动词前缀
  if(name){
    name = name.replace(/^(我给|我随|给|随了|今天给|去年给|前年给)/, '');
  }

  // 计算置信度（基于解析完整度）
  const confidence = {
    name:    name ? 0.68 : 0.20,
    amount:  amount ? 0.75 : 0.20,
    direction: 0.60,
    eventType: eventType ? 0.70 : 0.20,
    date:    0.50,
    city:    city ? 0.65 : 0.20
  };

  return {
    text: original,
    parse: {name, amount: amount || 0, direction, eventType: eventType || '婚礼', date, city: city || ''},
    confidence,
    freeform: true
  };
}

// 批量记账固定演示句解析："王芳六百、李伟八百、张叔一千。"
function parseBatchSentence(text){
  if(!text) return [];
  // 按顿号、逗号、分号、空格切分
  const parts = text.split(/[、，,；;\s]+/).map(s => s.trim()).filter(Boolean);
  const rows = [];
  for(const part of parts){
    // 匹配 "姓名 + 中文/阿拉伯金额"
    // 姓名：开头连续 2-4 个汉字
    // 金额：剩余部分
    const m = part.match(/^([\u4e00-\u9fa5]{2,4})(.+)$/);
    if(m){
      const name = m[1];
      const amountText = m[2].replace(/[元块:,。.]/g, '').trim();
      const amount = parseChineseAmount(amountText);
      rows.push({name, amount: amount || 0, raw: amountText});
    }
  }
  return rows;
}

function bindBatchPanel(){
  const be = document.getElementById('batch-event');
  if(be) be.addEventListener('change', e => { batchState.eventType = e.target.value; });
  const bd = document.getElementById('batch-direction');
  if(bd) bd.addEventListener('change', e => { batchState.direction = e.target.value; });
  const bdate = document.getElementById('batch-date');
  if(bdate) bdate.addEventListener('input', e => { batchState.date = e.target.value; });
  // 行内输入
  document.querySelectorAll('[data-batch-idx]').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.batchIdx, 10);
      const field = e.target.dataset.batchField;
      if(!batchState.rows[idx]) return;
      if(field === 'amount'){
        // 兼容中文金额
        const v = parseChineseAmount(e.target.value);
        batchState.rows[idx].amount = v || 0;
        batchState.rows[idx].raw = e.target.value;
      }else{
        batchState.rows[idx][field] = e.target.value;
      }
      // 实时校验该行
      batchState.errors[idx] = validateBatchRow(batchState.rows[idx], idx);
      // 局部更新错误显示，避免重渲染失焦
      const row = e.target.closest('.batch-row');
      if(row){
        row.classList.toggle('error', !!batchState.errors[idx]);
        let warn = row.querySelector('.row-warn');
        if(batchState.errors[idx]){
          if(!warn){
            warn = document.createElement('div');
            warn.className = 'row-warn';
            row.appendChild(warn);
          }
          warn.textContent = batchState.errors[idx];
        }else if(warn){
          warn.remove();
        }
      }
    });
  });
}

function validateBatchRow(row, idx){
  if(!row.name || !row.name.trim()) return '姓名不能为空';
  // 同批内重复姓名
  for(let i = 0; i < batchState.rows.length; i++){
    if(i !== idx && batchState.rows[i].name === row.name){
      return '同批姓名重复，需区分';
    }
  }
  // 异常金额
  if(!row.amount || row.amount <= 0) return '金额需为正数';
  if(row.amount > 50000) return '金额异常偏大，请核对';
  return null;
}

function filterAlleyPosts(){
  return getPublishedPosts().filter(p => {
    if(alleyFilter.circleId !== 'ALL' && p.circleId !== alleyFilter.circleId) return false;
    if(alleyFilter.region !== 'ALL' && p.region !== alleyFilter.region) return false;
    if(alleyFilter.eventType !== 'ALL' && p.eventType !== alleyFilter.eventType) return false;
    if(alleyFilter.type !== 'ALL' && p.type !== alleyFilter.type) return false;
    if(alleyFilter.keyword){

      const hay = (p.title + p.content + p.region + p.eventType).toLowerCase();

function renderAdvisorResult(res){

  const maskedBaseSource = mask ? escapeHTML(breakdown.baseSource.replace(/¥[\d,]+/g, '¥••••')) : escapeHTML(breakdown.baseSource);
  const maskedResBase = mask ? escapeHTML(res.baseSource.replace(/¥[\d,]+/g, '¥••••')) : escapeHTML(res.baseSource);
  let tiersHtml = res.tiers.map(t => {
    const amountText = mask ? '¥••••' : ('¥' + formatFenToYuan(t.amountFen));
    const rangeText = mask ? '¥•••• – ¥••••' : ('¥' + formatFenToYuan(t.minRangeFen) + ' – ¥' + formatFenToYuan(t.maxRangeFen));
    const shareText = t.sharePct != null ? ('约占月薪 ' + t.sharePct.toFixed(1) + '%') : '';
    const cappedNote = t.capped ? '<div style="font-size:11px;color:var(--vermilion);margin-top:4px">已按预算上限收敛</div>' : '';
    const adoptLabel = isFuneral ? '采用并记一笔' : '采用并记一笔';

        <div class="tier-name">${escapeHTML(t.name)}</div>
        <div class="tier-amount">${amountText}</div>

  let breakdownHtml = `

  const todayTopic = ALLEY_TOPICS[daysBetween('2026-01-01', DEMO_TODAY) % ALLEY_TOPICS.length];
  const regionOptions = ['ALL'].concat(CITIES).concat(['职场','江浙']);
  const typeOptions = [
    {key:'ALL',label:'全部'},
    {key:'CUSTOM',label:'地方礼俗'},
    {key:'ELDER_QUOTE',label:'长辈口述'},
    {key:'STORY',label:'温暖故事'}
  ];

  const filtered = filterAlleyPosts();
  const ritualPosts = filtered.filter(p => p.type === 'CUSTOM');
  const elderPosts  = filtered.filter(p => p.type === 'ELDER_QUOTE');
  const storyPosts  = filtered.filter(p => p.type === 'STORY');
  const aidPosts    = state.mutualAidPosts.filter(p => {
    if(alleyFilter.circleId !== 'ALL' && alleyFilter.circleId !== 'c-hangzhou') return false;
    if(alleyFilter.region !== 'ALL' && alleyFilter.region !== '杭州') return false;
    if(alleyFilter.eventType !== 'ALL' && p.scene !== alleyFilter.eventType) return false;
    if(alleyFilter.type !== 'ALL' && alleyFilter.type !== 'MUTUAL_AID' && alleyFilter.type !== 'ALL') return false;
    return true;
  });

  const hasFilter = alleyFilter.circleId !== 'ALL' || alleyFilter.region !== 'ALL' ||
                    alleyFilter.eventType !== 'ALL' || alleyFilter.type !== 'ALL' || alleyFilter.keyword;
  const allEmpty = ritualPosts.length === 0 && elderPosts.length === 0 && storyPosts.length === 0 && aidPosts.length === 0;

  let bodyHtml = '';
  if(hasFilter && allEmpty){
    bodyHtml = `
      <div class="empty-alley">
        <div class="ea-icon">巷</div>
        这条小巷还没人留下记录，<br>要不要写下你们那里的做法？
      </div>`;
  }else{
    if(ritualPosts.length){
      bodyHtml += `
        <div class="content-section-title">地方礼俗 <span class="count">${ritualPosts.length} 条</span></div>
        ${ritualPosts.map(p => renderPostCard(p)).join('')}`;
    }
    if(elderPosts.length){
      bodyHtml += `
        <div class="content-section-title">长辈口述 <span class="count">${elderPosts.length} 条</span></div>
        ${elderPosts.map(p => renderPostCard(p)).join('')}`;
    }
    if(storyPosts.length){
      bodyHtml += `
        <div class="content-section-title">温暖故事 <span class="count">${storyPosts.length} 条</span></div>
        ${storyPosts.map(p => renderPostCard(p)).join('')}`;
    }
    if(aidPosts.length && alleyFilter.type !== 'CUSTOM' && alleyFilter.type !== 'ELDER_QUOTE' && alleyFilter.type !== 'STORY'){
      bodyHtml += `
        <div class="content-section-title">邻里互助 <span class="count">${aidPosts.length} 条</span></div>
        ${aidPosts.map(p => renderAidCard(p)).join('')}
        <button class="btn ghost block" data-action="new-aid" style="margin-top:6px">发布一条</button>`;
    }
  }

  return `
    <div class="alley-header">
      <svg class="gate-svg" viewBox="0 0 280 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3e9d2"/>
            <stop offset="100%" stop-color="#e8d8b0"/>
          </linearGradient>
        </defs>
        <rect x="20" y="50" width="240" height="60" fill="url(#paperGrad)" stroke="#b8924a" stroke-width="1.5" rx="3"/>
        <path d="M10,50 L140,15 L270,50 Z" fill="#b03a3a" stroke="#8c2d2d" stroke-width="1"/>
        <rect x="10" y="48" width="260" height="6" fill="#8c2d2d"/>
        <rect x="35" y="50" width="14" height="60" fill="#b03a3a" opacity=".85"/>
        <rect x="231" y="50" width="14" height="60" fill="#b03a3a" opacity=".85"/>
        <rect x="125" y="50" width="14" height="60" fill="#b8924a" opacity=".85"/>
        <rect x="141" y="50" width="14" height="60" fill="#b8924a" opacity=".85"/>
        <rect x="100" y="22" width="80" height="22" fill="#fbf3df" stroke="#b8924a"/>
        <text x="140" y="38" text-anchor="middle" font-family="Songti SC, serif" font-size="13" fill="#b03a3a" letter-spacing="3">礼俗小巷</text>
        <circle cx="55" cy="62" r="6" fill="#b03a3a" stroke="#8c2d2d"/>
        <circle cx="225" cy="62" r="6" fill="#b03a3a" stroke="#8c2d2d"/>
        <rect x="118" y="86" width="44" height="14" fill="none" stroke="#b03a3a" stroke-width="1"/>
        <text x="140" y="96" text-anchor="middle" font-family="Songti SC, serif" font-size="9" fill="#b03a3a">人情簿印</text>
      </svg>
      <div class="gate-title">礼俗小巷</div>
      <div class="gate-sub">街坊 · 茶桌 · 地方记忆</div>
      <div class="alley-quote">
        在这里，<b>礼数可以参考，心意不该排名</b>。<br>
        我们聊的是：当地通常怎么做、长辈为什么这样做、哪些禁忌要尊重、除了红包还能怎样表达心意。
      </div>
    </div>

    <div class="region-row">
      <span>当前地区</span>
      <select data-action="filter-region">
        ${regionOptions.map(r => `<option value="${r}" ${alleyFilter.region===r?'selected':''}>${r==='ALL'?'全部地区':r}</option>`).join('')}
      </select>
    </div>

    <div class="circle-row">
      ${state.circles.map(c => {
        const joined = isCircleJoined(c.id);
        const active = alleyFilter.circleId === c.id;
        return `
          <div class="circle-chip ${joined?'joined':''} ${active?'active':''}" data-action="filter-circle" data-id="${c.id}">
            <div class="cic-icon" style="background:${c.color}">${escapeHTML(c.icon)}
              <span class="join-flag">✓</span>
            </div>
            <div class="cic-name">${escapeHTML(c.name)}</div>
          </div>`;
      }).join('')}
      <div class="circle-chip ${alleyFilter.circleId==='ALL'?'active':''}" data-action="filter-circle" data-id="ALL">
        <div class="cic-icon" style="background:var(--ink-faint)">全</div>
        <div class="cic-name">全部</div>
      </div>
    </div>

    <div class="topic-banner" data-action="filter-topic" data-id="${todayTopic.id}">
      <div class="tb-label">今日话题</div>
      <div class="tb-title">#${escapeHTML(todayTopic.title)}</div>
      <div class="tb-desc">${escapeHTML(todayTopic.desc)}</div>
    </div>

    <div class="alley-search">
      <input type="text" id="alleyKeyword" placeholder="搜索礼俗、故事、关键词…" value="${escapeAttr(alleyFilter.keyword)}" />
      <button data-action="clear-alley-filter">重置</button>
    </div>

    <div class="alley-filter-bar">
      ${typeOptions.map(t => `<button class="chip ${alleyFilter.type===t.key?'active':''}" data-action="filter-content-type" data-v="${t.key}">${t.label}</button>`).join('')}
    </div>
    <div class="alley-filter-bar">
      <button class="chip ${alleyFilter.eventType==='ALL'?'active':''}" data-action="filter-content-scene" data-v="ALL">全部场景</button>
      ${EVENT_TYPES.map(e => `<button class="chip ${alleyFilter.eventType===e?'active':''}" data-action="filter-content-scene" data-v="${e}">${e}</button>`).join('')}
    </div>

    ${bodyHtml}

    <div class="privacy-bottom">
      <div class="pb-title">礼俗小巷的底线</div>
      <ul>
        <li>不晒具体联系人和礼金；</li>
        <li>不制作地区红包排行榜；</li>
        <li>不评价谁大方或小气；</li>
        <li>不把地方做法说成统一标准；</li>
        <li>私人账本内容不会自动进入社区；</li>
        <li>白事、民族、宗教内容应更加谨慎。</li>
      </ul>
    </div>

    <div style="height:60px"></div>
    <div class="alley-bottom-bar">
      <button class="btn ghost" data-action="open-draft-box" style="flex:0 0 auto;padding:0 14px">草稿箱</button>
      <button class="btn primary" data-action="new-post" style="flex:1">写下我们那里的做法</button>
    </div>
  `;
}

function renderPostCard(p){
  const circle = getCircleById(p.circleId);
  const reacts = getPostReactions(p.id);
  const typeClass = p.type === 'ELDER_QUOTE' ? 'elder' : (p.type === 'STORY' ? 'story' : 'ritual');
  const isDiffersOpen = differsOpenIds[p.id];
  const authorText = p.isAnonymous ? '匿名' : escapeHTML(p.authorLabel);
  const coauthorTag = p._coauthor ? '<span class="pc-coauthor">我的共创</span>' : '';
  return `
    <div class="post-card ${typeClass}" data-action="open-post" data-id="${p.id}">
      <div class="pc-head">
        <span class="pc-tag">${escapeHTML(getTypeLabel(p.type))}</span>
        <span class="pc-region">${escapeHTML(p.region)}</span>
        <span class="pc-scene">${escapeHTML(p.eventType)}</span>
        ${circle ? `<span class="pc-region">· ${escapeHTML(circle.name)}</span>` : ''}
        ${coauthorTag}
      </div>
      <div class="pc-title">${escapeHTML(p.title)}</div>
      <div class="pc-body">${escapeHTML(p.content)}</div>
      ${p.diffHint ? `<div class="pc-diff">差异提醒：${escapeHTML(p.diffHint)}</div>` : ''}
      <div class="reaction-row">
        <button class="react-btn ${isReacted(p.id,'useful')?'active':''}" data-action="react-post" data-id="${p.id}" data-kind="useful">这很受用 <span class="rc-count">${reacts.useful}</span></button>
        <button class="react-btn ${isReacted(p.id,'sameHere')?'active':''}" data-action="react-post" data-id="${p.id}" data-kind="sameHere">我们那里也这样 <span class="rc-count">${reacts.sameHere}</span></button>
        <button class="react-btn ${isReacted(p.id,'supplement')?'active':''}" data-action="react-post" data-id="${p.id}" data-kind="supplement">补充一点 <span class="rc-count">${reacts.supplement}</span></button>
        <button class="react-btn ${isReacted(p.id,'differs')?'active':''}" data-action="react-post" data-id="${p.id}" data-kind="differs">各地可能不同 <span class="rc-count">${reacts.differs}</span></button>
      </div>
      ${isDiffersOpen ? `<div class="differs-hint">礼俗常因地区、家庭和代际而不同，欢迎补充你的经历。</div>` : ''}
      <div class="pc-source">${escapeHTML(p.sourceLabel)} · ${authorText}</div>
    </div>
  `;
}

function renderAidCard(p){
  const isOwner = p.ownerId === state.currentUserId;
  return `
    <div class="post-card aid">
      <div class="pc-head">
        <span class="pc-tag">邻里互助</span>
        <span class="pc-scene">${escapeHTML(p.scene)}</span>
        ${isOwner ? '<span class="pc-region">· 我发布的</span>' : ''}
      </div>
      <div class="pc-title">${escapeHTML(p.offer)}</div>
      ${p.resolved ? '<div class="aid-resolved">✓ 已标记为解决</div>' : ''}
      <div class="pc-aid-meta">
        <span class="pc-source">已有 ${p.helperCount} 人搭把手 · 演示内容</span>
      </div>
      <div class="aid-actions">
        <button class="${p.joined?'active':''}" data-action="join-aid" data-id="${p.id}">${p.joined?'已搭把手':'我能搭把手'}</button>
        <button class="${p.favorited?'active':''}" data-action="fav-aid" data-id="${p.id}">${p.favorited?'已收藏':'收藏备用'}</button>
        <button data-action="record-aid" data-id="${p.id}">记为非金钱心意</button>
        ${isOwner && !p.resolved ? '<button class="danger" data-action="resolve-aid" data-id="'+p.id+'">标记已解决</button>' : ''}
      </div>
    </div>
  `;
}

function bindCommunity(){
  const kwInput = document.getElementById('alleyKeyword');
  if(kwInput){
    let timer = null;
    kwInput.addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        alleyFilter.keyword = e.target.value;
        renderTab('community');
        // 恢复焦点
        const newInput = document.getElementById('alleyKeyword');
        if(newInput){
          newInput.focus();
          newInput.setSelectionRange(newInput.value.length, newInput.value.length);
        }
      }, 300);
    });
  }
  // 地区 select change
  const regionSel = document.querySelector('[data-action="filter-region"]');
  if(regionSel){
    regionSel.addEventListener('change', e => {
      alleyFilter.region = e.target.value;
      renderTab('community');
    });
  }
}

/* 读取投稿表单 */
function readPostForm(){
  const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const checked = id => { const el = document.getElementById(id); return el ? el.checked : false; };
  return {
    region: get('pf-region'),
    eventType: get('pf-scene'),
    type: get('pf-type'),
    title: get('pf-title'),
    content: get('pf-content'),
    sourceLabel: get('pf-source'),
    isAnonymous: checked('pf-anonymous'),
    privacyConfirmed: checked('pf-privacy')
  };
}

/* 绑定投稿表单：实时隐私检查 */
function bindPostForm(){
  const fields = ['pf-title','pf-content'];
  let timer = null;
  fields.forEach(fid => {
    const el = document.getElementById(fid);
    if(el){
      el.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const form = readPostForm();
          const warns = checkPostPrivacy(form);
          const warnEl = document.getElementById('pf-warn');
          if(warnEl){
            warnEl.innerHTML = warns.map(w => '<div>· ' + escapeHTML(w) + '</div>').join('');
          }
        }, 400);
      });
    }
  });
}

  }else{
    listHtml = drafts.map(d => `
      <div class="draft-card">

          <button data-action="publish-draft" data-id="${d.id}" class="primary">模拟审核通过</button>
          <button data-action="edit-draft" data-id="${d.id}">编辑</button>
          <button data-action="delete-draft" data-id="${d.id}" class="danger">删除</button>

      </div>

  return `
    <div class="sheet-head">
      <span class="title">我的礼俗草稿箱</span>
      <button class="close" data-action="close-sheet" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:10px;line-height:1.7">

        "模拟审核通过"会把草稿放进本地内容流，并标注"我的共创"。

      ${listHtml}

    <div class="sheet-foot">
      <button class="btn primary block" data-action="new-post">写一条新的</button>
    </div>

}

/* 投稿隐私检查（本地规则，非 AI 审核） */
function checkPostPrivacy(form){
  const warns = [];
  const text = (form.title || '') + (form.content || '');
  // 检测手机号
  if(/1[3-9]\d{9}/.test(text)) warns.push('检测到疑似手机号，请核对是否暴露他人联系方式。');
  // 检测具体金额（数字+元/块/¥）
  if(/\d{2,}\s*(元|块|¥)/.test(text)) warns.push('检测到具体金额，礼俗小巷不晒礼金，请删除或改写。');
  // 检测"某某给了我/给了"句式
  if(/.{1,4}(给了我|给了|随了|收了).{0,6}\d/.test(text)) warns.push('检测到可能暴露他人的描述，请核对。');
  // 检测连续3-4个中文字符+金额
  if(/[\u4e00-\u9fa5]{3,4}\s*\d{2,}/.test(text)) warns.push('检测到"姓名+金额"式描述，请改为脱敏表达。');
  return warns;
}

function renderCalendarView(){
  const cal = getCalendarData(calendarMonth);
  const todayStr = DEMO_TODAY;
  const dows = ['日','一','二','三','四','五','六'];
  let cellsHtml = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  // 空白填充
  for(let i = 0; i < cal.firstDay; i++){
    cellsHtml += '<div class="cal-cell empty"></div>';
  }
  for(let d = 1; d <= cal.daysInMonth; d++){
    const dd = String(d).padStart(2,'0');
    const dayData = cal.days[dd];
    const dateStr = calendarMonth + '-' + dd;
    const isToday = dateStr === todayStr;
    let dotHtml = '';
    let cellClass = 'cal-cell';
    if(dayData && dayData.todos.length){
      cellClass += ' has-todo';
      const t = dayData.todos[0];
      const dotClass = t.status === 'done' ? 'done' : (t.status === 'decided' ? 'decided' : '');
      dotHtml = '<div class="cal-dot '+dotClass+'"></div>';
    }
    if(isToday) cellClass += ' today';
    const action = dayData && dayData.todos.length ? `data-action="open-cal-day" data-date="${dateStr}"` : '';
    cellsHtml += `<div class="${cellClass}" ${action}><span>${d}</span>${dotHtml}</div>`;
  }

  return `
    <div class="cal-head">
      <button data-action="shift-month" data-v="-1">‹ 上月</button>
      <span class="cal-month">${cal.year}年 ${cal.month}月</span>
      <button data-action="shift-month" data-v="1">下月 ›</button>
    </div>
    <div class="cal-grid">${cellsHtml}</div>
    <div class="cal-legend">
      <span><i style="background:var(--vermilion)"></i>待决定</span>
      <span><i style="background:var(--gold)"></i>已决定</span>
      <span><i style="background:var(--jade)"></i>已随礼</span>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.6">

    </div>
  `;
}

function contributionLabel(key){
  const t = CONTRIBUTION_TYPES.find(x => x.key === key);
  return t ? t.label : key;
}

function filterRecords(filters){
  return getActiveRecords()
    .filter(r => {
      if(filters.direction !== 'ALL' && r.direction !== filters.direction) return false;
      if(filters.eventType !== 'ALL' && r.eventType !== filters.eventType) return false;
      if(filters.keyword){
        const kw = filters.keyword.toLowerCase();
        const c = getContactById(r.contactId);
        const hay = (r.eventType + (r.note||'') + (c?c.name:'') + (c?c.relation:'')).toLowerCase();
        if(hay.indexOf(kw) < 0) return false;
      }
      return true;
    })
    .sort((a,b) => (b.date < a.date ? -1 : b.date > a.date ? 1 : 0));
}

/* ============================================================
   09. Actions and mutations
   ============================================================ */
let undoTimer = null;
let pendingUndo = null;

function addRecord(payload){
  // payload: { name, amountYuan, direction, eventType, relation, date, note, contributionType, contactId? }
  // 通过姓名匹配或新建联系人；同名时需依赖 contactId
  let contact;
  if(payload.contactId){
    contact = getContactById(payload.contactId);
  }
  if(!contact){
    // 查找同名 + 同关系
    const matches = state.contacts.filter(c =>
      c.name === payload.name && c.relation === payload.relation
    );
    if(matches.length === 1){
      contact = matches[0];
    }else if(matches.length > 1){
      // 多个同名同关系，不自动选择，返回提示
      return {ok:false, error:'存在多个同名同关系的联系人，请从下拉建议中选择。'};
    }else{
      // 新建联系人
      contact = {
        id: 'c-' + Date.now() + '-' + Math.floor(Math.random()*1000),
        name: payload.name,
        aliases: [],
        relation: payload.relation || '朋友',
        city: payload.city || '杭州',
        sharedNote: '',
        privateNotesByUser: {}
      };
      state.contacts.push(contact);
    }
  }

  const isHelp = payload.contributionType && payload.contributionType !== 'MONEY';
  let amountFen = 0;
  if(!isHelp){
    const yuan = parseFloat(payload.amountYuan);
    if(!yuan || yuan <= 0 || isNaN(yuan)){
      return {ok:false, error:'金额必须是正数'};
    }
    amountFen = Math.round(yuan * 100);
  }

  const record = {
    id: 'r-' + Date.now() + '-' + Math.floor(Math.random()*1000),
    contactId: contact.id,
    amountFen: amountFen,
    direction: payload.direction || 'OUT',
    eventType: payload.eventType || '婚礼',
    date: payload.date || DEMO_TODAY,
    note: payload.note || '',
    source: payload.source || 'MANUAL',
    contributionType: payload.contributionType || 'MONEY',
    createdBy: state.currentUserId,
    batchId: payload.batchId || null,
    deletedAt: null
  };
  state.records.push(record);
  saveState();
  addFamilyFeed('record', `新增了一条${record.eventType}记录（${contact.name}）`);
  return {ok:true, record};
}

function softDeleteRecord(id){
  const r = getRecordById(id);
  if(!r) return false;
  r.deletedAt = new Date().toISOString();
  saveState();
  // 设置 5 秒撤销窗口
  pendingUndo = { recordId: id };
  if(undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    pendingUndo = null;
  }, 5000);
  return true;
}

function undoDelete(){
  if(!pendingUndo) return false;
  const r = getRecordById(pendingUndo.recordId);
  if(r){
    r.deletedAt = null;
    saveState();
  }
  pendingUndo = null;
  if(undoTimer){ clearTimeout(undoTimer); undoTimer = null; }
  return true;
}

function completeTodoWithRecord(todoId, recordId){
  const t = state.todos.find(x => x.id === todoId);
  if(t){
    t.status = 'DONE';
    saveState();
  }
}

// 批量记账：所有记录共享同一 batchId，便于整批撤销
function addBatchRecords(rows, common){
  // common: {eventType, direction, date}
  const batchId = 'b-' + Date.now() + '-' + Math.floor(Math.random()*1000);
  const created = [];
  const errors = [];
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const err = validateBatchRow(r, i);
    if(err){
      errors.push({index:i, message:err});
      continue;
    }
    const result = addRecord({
      name: r.name.trim(),
      amountYuan: String(r.amount),
      direction: common.direction,
      eventType: common.eventType,
      relation: '朋友',
      city: '杭州',
      date: common.date,
      note: '批量记账',
      contributionType: 'MONEY',
      source: 'BATCH',
      batchId: batchId
    });
    if(result.ok) created.push(result.record);
    else errors.push({index:i, message:result.error || '保存失败'});
  }
  if(created.length > 0){
    state.lastBatchId = batchId;
    saveState();
  }
  return {ok: created.length > 0, batchId, created, errors};
}

function undoLastBatch(){
  if(!state.lastBatchId) return {ok:false, count:0};
  const bid = state.lastBatchId;
  let count = 0;
  state.records.forEach(r => {
    if(r.batchId === bid && !r.deletedAt){
      r.deletedAt = new Date().toISOString();
      count++;
    }
  });
  state.lastBatchId = null;
  saveState();
  return {ok:count>0, count};
}

function createTodo(payload){

    eventType: payload.eventType || '婚礼',
