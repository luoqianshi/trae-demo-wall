    decidedAmountFen: payload.decidedAmountFen || null,
    status: 'PENDING',
    note: payload.note || ''
  };
  state.todos.push(t);
  saveState();
  const contact = getContactById(payload.contactId);
  const cname = contact ? contact.name : '联系人';
  if(payload.decidedAmountFen){
    addFamilyFeed('todo', `决定了${cname}${t.eventType}的待办金额`);

  return t;
}

/* ============================================================
   10. Event delegation
   ============================================================ */
function handleActionClick(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;

  switch(action){
    case 'switch-tab':
      setActiveTab(btn.dataset.tab);
      break;

    case 'toggle-mask':
      state.amountMasked = !state.amountMasked;
      if(!state.amountMaskedByUser) state.amountMaskedByUser = {};
      state.amountMaskedByUser[state.currentUserId] = state.amountMasked;
      saveState();
      renderTab(currentTab);
      document.getElementById('maskIcon').textContent = state.amountMasked ? '⊕' : '⊙';
      break;

    case 'open-settings':
      openSheet(renderSettingsSheet());
      break;

    case 'close-sheet':
      closeSheet();
      break;

    case 'switch-user': {
      state.currentUserId = id;
      // 同步该用户的隔离设置到运行时
      if(state.amountMaskedByUser && state.amountMaskedByUser[id] !== undefined){
        state.amountMasked = state.amountMaskedByUser[id];
      }
      // 同步该用户的预算到参谋表单
      const ms = getMySettings();
      advisorState.monthlySalaryYuan = ms.monthlySalaryYuan || '';
      advisorState.budgetCapYuan = ms.budgetCapYuan || '';
      saveState();
      document.getElementById('maskIcon').textContent = state.amountMasked ? '⊕' : '⊙';
      openSheet(renderSettingsSheet());
      renderTab(currentTab);
      showToast('已切换到 ' + (state.users.find(u=>u.id===id)||{}).name + ' 的视角');
      break;
    }

    case 'set-mask':
      state.amountMasked = (btn.dataset.v === 'true');
      if(!state.amountMaskedByUser) state.amountMaskedByUser = {};
      state.amountMaskedByUser[state.currentUserId] = state.amountMasked;
      saveState();
      openSheet(renderSettingsSheet());
      renderTab(currentTab);
      document.getElementById('maskIcon').textContent = state.amountMasked ? '⊕' : '⊙';
      break;

    case 'open-demo-help':
      openSheet(renderDemoHelpSheet());
      break;

    case 'request-reset':
      // 二次确认
      showToast('确认清空所有数据并恢复演示数据？', {actionText:'确认重置', action:'confirm-reset', duration:6000});
      break;

    case 'confirm-reset':
    case 'reset-demo':
      resetDemo();
      closeSheet();
      recordsFilter = {direction:'ALL', eventType:'ALL', keyword:''};
      recordsView = 'list';
      contactsViewMode = 'list';
      calendarMonth = new Date(DEMO_TODAY).toISOString().slice(0,7);
      // 重置后加载默认用户的预算
      const resetSettings = getMySettings();
      advisorState = {
        contactId: state.contacts[0].id,
        eventType:'婚礼', city:'杭州',
        monthlySalaryYuan: resetSettings.monthlySalaryYuan || '',
        budgetCapYuan: resetSettings.budgetCapYuan || '',
        attendees:1, result:null
      };
      addFormState = {
        method:'MANUAL', name:'', amountYuan:'',
        direction:'OUT', eventType:'婚礼', relation:'朋友',
        city:'杭州', date:DEMO_TODAY, note:'', contributionType:'MONEY'
      };
      addFormDirty = false;
      pendingTabSwitch = null;
      batchState = {
        rows: [], eventType: '婚礼', direction: 'OUT',
        date: DEMO_TODAY, errors: []
      };
      alleyFilter = {circleId:'ALL', region:'ALL', eventType:'ALL', type:'ALL', keyword:''};
      postFormState = null;
      differsOpenIds = {};
      blessingState = {eventType:'婚礼', relation:'朋友', attend:'yes', tone:'steady', drafts:[]};
      document.body.classList.remove('funeral-mode');
      setActiveTab('home');
      showToast('已恢复标准演示数据');
      break;

    case 'switch-method': {
      // 不依赖全局 event
      switchInputMethod(btn.dataset.method);
      break;
    }

    case 'set-contribution':
      addFormState.contributionType = btn.dataset.v;
      refreshAddForm();
      break;

    case 'set-direction':
      addFormState.direction = btn.dataset.v;
      refreshAddForm();
      break;

    case 'quick-amount':
      addFormState.amountYuan = btn.dataset.v;
      refreshAddForm();
      break;

    case 'pick-contact': {
      const c = getContactById(id);
      if(c){
        addFormState.name = c.name;
        addFormState.relation = c.relation;
        addFormState._contactId = c.id;
        refreshAddForm();
      }
      break;
    }

    case 'save-record':
      handleSaveRecord();
      break;

    case 'voice-demo': {
      const res = parseVoiceDemo(id);
      if(res){
        window._lastVoiceResult = res;
        const resultEl = document.getElementById('voiceResult');
        if(resultEl){
          resultEl.innerHTML = `
            <div class="card" style="background:rgba(155,191,174,.12);border-color:var(--jade-soft)">
              <div style="font-size:12px;color:var(--ink-faint)">正在聆听…</div>
            </div>`;
          setTimeout(() => {

    case 'resolve-aid': {
      const p = state.mutualAidPosts.find(x => x.id === id);
      if(p){
        p.resolved = true;
        saveState();
        renderTab('community');
        showToast('已标记为解决');
      }
      break;
    }

    /* ===== 夫妻共簿 actions ===== */
    case 'save-my-settings': {
      const sEl = document.getElementById('setSalary');
      const bEl = document.getElementById('setBudget');
      const ms = getMySettings();
      if(sEl) ms.monthlySalaryYuan = sEl.value;
      if(bEl) ms.budgetCapYuan = bEl.value;
      // 同步到参谋表单
      advisorState.monthlySalaryYuan = ms.monthlySalaryYuan || '';
      advisorState.budgetCapYuan = ms.budgetCapYuan || '';
      saveState();
      showToast('已保存' + getCurrentUser().name + '的个人预算');
      break;
    }

    case 'save-private-note': {
      const c = getContactById(id);
      if(!c) break;
      if(!c.privateNotesByUser) c.privateNotesByUser = {};
      const ta = document.getElementById('fld-private-note');
      c.privateNotesByUser[state.currentUserId] = ta ? ta.value : '';
      saveState();
      showToast('已保存个人备注（仅你可见）');
      break;
    }

    case 'open-invite':
      openSheet(renderInviteSheet());
      break;

    case 'simulate-join':
      state.inviteState.partnerJoined = true;
      saveState();
      openSheet(renderInviteSheet());
      showToast('林晓已加入（模拟）');
      break;

    case 'fav-ritual': {
      const postId = id;
      const title = btn.dataset.title || '礼俗';
      if(!state.familyRituals) state.familyRituals = [];
      const exists = state.familyRituals.find(r => r.postId === postId);
      if(exists){
        showToast('这条礼俗已在家庭收藏中');
      }else{
        state.familyRituals.unshift({
          id: 'fr-' + Date.now(),
          postId: postId,
          title: title,
          addedBy: state.currentUserId,
          addedAt: DEMO_TODAY
        });
        const actor = getCurrentUser().name;
        addFamilyFeed('ritual', '收藏了礼俗「' + title + '」');
        saveState();
        showToast('已收进家庭礼俗收藏');
      }
      break;
    }

    case 'favorite-ritual': {
      // 首页"记进我的礼俗"按钮：收进家庭礼俗收藏（用今日话题）
      if(!state.familyRituals) state.familyRituals = [];
      const topic = ALLEY_TOPICS[daysBetween('2026-01-01', DEMO_TODAY) % ALLEY_TOPICS.length];
      state.familyRituals.unshift({
        id: 'fr-' + Date.now(),
        postId: topic.id,
        title: topic.title,
        addedBy: state.currentUserId,
        addedAt: DEMO_TODAY
      });
      addFamilyFeed('ritual', '收藏了礼俗「' + topic.title + '」');
      saveState();
      showToast('已收进家庭礼俗收藏');
      break;
    }
  }
}

// 语音结果卡片：含置信度展示
function renderVoiceResultCard(res){
  const p = res.parse;
  const c = res.confidence || {};
  const fields = [
    {k:'name',    label:'姓名',  value:p.name,                 conf:c.name},
    {k:'amount',  label:'金额',  value:p.amount?('¥'+p.amount):'(未识别)', conf:c.amount},
    {k:'direction',label:'方向', value:p.direction==='OUT'?'我随出':'对方给我', conf:c.direction},
    {k:'eventType',label:'事由', value:p.eventType||'(未识别)', conf:c.eventType},
    {k:'date',    label:'日期',  value:p.date||'(未识别)',     conf:c.date},
    {k:'city',    label:'城市',  value:p.city||'(未识别)',     conf:c.city}
  ];
  const lowConfFields = fields.filter(f => f.conf != null && f.conf < 0.6);

  let rowsHtml = fields.map(f => {
    const conf = f.conf != null ? f.conf : 0.5;
    let cls = 'mid';
    if(conf >= 0.8) cls = 'high';
    else if(conf < 0.6) cls = 'low';
    const pct = Math.round(conf * 100);
    return `
      <div class="conf-row ${cls}">
        <span class="conf-k">${escapeHTML(f.label)}</span>
        <span class="conf-v">${escapeHTML(String(f.value))}</span>
        <span class="conf-bar"><i style="width:${pct}%"></i></span>
        <span class="conf-tag">${pct}%</span>
      </div>`;
  }).join('');

  let warnHtml = '';
  if(lowConfFields.length > 0){
    warnHtml = `<div class="conf-warn">以下字段置信度偏低，请重点核对：
      <b>${escapeHTML(lowConfFields.map(f=>f.label).join('、'))}</b></div>`;
  }

  return `
    <div class="card" style="background:rgba(155,191,174,.12);border-color:var(--jade-soft)">
      <div style="font-family:var(--serif);font-size:13px;color:var(--jade)">原文</div>
      <div style="font-size:13px;margin-top:4px">${escapeHTML(res.text)}</div>
      <div style="font-family:var(--serif);font-size:13px;color:var(--jade);margin-top:10px">解析字段与置信度</div>
      <div style="margin-top:4px">${rowsHtml}</div>
      ${warnHtml}
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px">语音结果不会自动落库，请确认后回填表单。</div>
      <button class="btn primary block" data-action="apply-voice" style="margin-top:10px">确认并回填表单</button>
    </div>
  `;
}

// Web Speech API 真实识别
let _recognition = null;
function startRealVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast('当前浏览器不支持 Web Speech API');
    return;
  }
  const micBtn = document.getElementById('micBtn');
  const micHint = document.getElementById('micHint');
  const resultEl = document.getElementById('voiceResult');

  if(_recognition){
    // 正在录音，停止
    try{ _recognition.stop(); }catch(e){}
    return;
  }

  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  if(micBtn){ micBtn.classList.add('recording'); micBtn.textContent = '■'; }
  if(micHint){ micHint.textContent = '正在聆听…（点击停止）'; }
  if(resultEl){
    resultEl.innerHTML = `<div class="card" style="background:rgba(176,58,58,.08);border-color:var(--vermilion)">
      <div style="font-size:13px;color:var(--vermilion)">● 正在聆听…</div>
    </div>`;
  }

  rec.onresult = (event) => {
    const text = event.results[0][0].transcript;
    const res = parseVoiceFreeText(text);
    if(resultEl){
      resultEl.innerHTML = renderVoiceResultCard(res);
    }
    window._lastVoiceResult = res;
  };
  rec.onerror = (event) => {
    if(resultEl){
      resultEl.innerHTML = `<div class="card" style="background:rgba(184,146,74,.08)">
        <div style="font-size:13px;color:var(--ink-soft)">识别失败：${escapeHTML(event.error||'未知错误')}。可使用下方演示句。</div>
      </div>`;
    }
  };
  rec.onend = () => {
    if(micBtn){ micBtn.classList.remove('recording'); micBtn.textContent = '🎙'; }
    if(micHint){ micHint.textContent = '点击麦克风开始'; }
    _recognition = null;
  };

  try{
    rec.start();
    _recognition = rec;
  }catch(e){
    showToast('启动麦克风失败：' + (e.message || ''));
    if(micBtn){ micBtn.classList.remove('recording'); micBtn.textContent = '🎙'; }
    _recognition = null;
  }
}

function handleSaveRecord(){
  const name = (document.getElementById('fld-name') || {}).value || addFormState.name;
  const amountYuan = (document.getElementById('fld-amount') || {}).value;
  const date = (document.getElementById('fld-date') || {}).value || addFormState.date;
  const note = (document.getElementById('fld-note') || document.getElementById('fld-note-help') || {}).value || addFormState.note;
  const eventType = (document.getElementById('fld-event') || {}).value || addFormState.eventType;
  const relation = (document.getElementById('fld-relation') || {}).value || addFormState.relation;
  const city = (document.getElementById('fld-city') || {}).value || addFormState.city || '杭州';

  if(!name || !name.trim()){
    showToast('请填写姓名');
    return;
  }
  if(addFormState.contributionType === 'MONEY'){
    if(!amountYuan || parseFloat(amountYuan) <= 0 || isNaN(parseFloat(amountYuan))){
      showToast('金额必须是正数');
      return;
    }
  }

  const isEdit = !!addFormState._editId;
  const payload = {
    name: name.trim(),
    amountYuan: amountYuan,
    direction: addFormState.direction,
    eventType: eventType,
    relation: relation,
    city: city,
    date: date,
    note: note,
    contributionType: addFormState.contributionType,
    contactId: addFormState._contactId || null,
    source: addFormState.method === 'VOICE' ? 'VOICE' : (addFormState.method === 'OCR' ? 'OCR' : 'MANUAL')
  };

  if(isEdit){
    // 编辑模式：直接更新原记录
    const r = getRecordById(addFormState._editId);
    if(!r){
      showToast('原记录已不存在');
      return;
    }
    // 若改名或改关系，可能需要更新联系人；这里简化：仅在原 contactId 上更新字段
    r.amountFen = payload.contributionType === 'MONEY' ? Math.round(parseFloat(payload.amountYuan) * 100) : 0;
    r.direction = payload.direction;
    r.eventType = payload.eventType;
    r.date = payload.date;
    r.note = payload.note;
    r.contributionType = payload.contributionType;
    r.source = payload.source;
    saveState();
    showSealAnimation();
    addFormDirty = false;
    const editId = addFormState._editId;
    addFormState = {
      method:'MANUAL', name:'', amountYuan:'',
      direction:'OUT', eventType:'婚礼', relation:'朋友',
      city:'杭州', date:DEMO_TODAY, note:'', contributionType:'MONEY'
    };
    showToast('记录已更新');
    refreshAddForm();
    // 返回往来列表
    if(currentTab === 'add') setActiveTab('records');
    return;
  }

  const result = addRecord(payload);
  if(!result.ok){
    showToast(result.error);
    return;
  }

  // 自动完成匹配的待办（同联系人 + 同事件 + 日期接近）
  let autoDoneCount = 0;
  state.todos.forEach(t => {
    if(t.status === 'PENDING' && t.contactId === result.record.contactId && t.eventType === result.record.eventType){
      t.status = 'GIFTED';
      t.linkedRecordId = result.record.id;
      autoDoneCount++;
    }
  });
  if(autoDoneCount > 0) saveState();

  // 保存成功：朱印动效 + 清除草稿脏标记 + 5 秒撤销
  showSealAnimation();
  addFormDirty = false;

  // 重置表单
  addFormState = {
    method:'MANUAL', name:'', amountYuan:'',
    direction:'OUT', eventType:'婚礼', relation:'朋友',
    city:'杭州', date:DEMO_TODAY, note:'', contributionType:'MONEY'
  };
  const undoMsg = autoDoneCount > 0
    ? '已记下，并自动完成 ' + autoDoneCount + ' 个待办'
    : '已记下';
  showToast(undoMsg, {actionText:'撤销', action:'undo-last-add', recordId: result.record.id});
  refreshAddForm();
}

/* ============================================================
   11. Toast
   ============================================================ */
function showToast(message, opts){
  opts = opts || {};
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (opts.kind === 'warn' ? ' warn' : '');
  const span = document.createElement('span');
  span.textContent = message;
  t.appendChild(span);
  let dismissed = false;
  if(opts.actionText){
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = opts.actionText;
    btn.addEventListener('click', () => {
      if(opts.action === 'undo-delete'){
        document.dispatchEvent(new CustomEvent('app:undo-delete'));
      }else if(opts.action === 'undo-last-add'){
        if(opts.recordId){
          softDeleteRecord(opts.recordId);
          renderTab(currentTab);
          showToast('已撤销刚才的记录');
        }
      }else if(opts.action === 'undo-last-batch'){
        const r = undoLastBatch();
        renderTab(currentTab);
        showToast(r.count > 0 ? ('已撤销 ' + r.count + ' 条') : '没有可撤销的批次');
      }else if(opts.action === 'keep-draft'){
        // 用户选择继续编辑，清除待切换
        pendingTabSwitch = null;
      }else if(opts.action === 'confirm-reset'){
        // 触发重置（复用 handleActionClick 逻辑）
        const fakeBtn = document.createElement('button');
        fakeBtn.dataset.action = 'confirm-reset';
        handleActionClick({target: fakeBtn});
      }
      dismissed = true;
      t.remove();
    });
    t.appendChild(btn);
  }
  wrap.appendChild(t);
  const duration = opts.duration || 4500;
  setTimeout(() => {
    if(!dismissed && t.parentNode){
      t.remove();
      dismissed = true;
      // 草稿警告超时：继续切到目标 tab
      if(opts.action === 'keep-draft' && pendingTabSwitch){
        const next = pendingTabSwitch;
        pendingTabSwitch = null;
        addFormDirty = false; // 不再拦截
        setActiveTab(next);
      }
    }
  }, duration);
}

// 朱印动效
function showSealAnimation(){
  const overlay = document.getElementById('sealOverlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  // 强制重排以重启动画
  void overlay.offsetWidth;
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 900);
}

/* ============================================================
   Helpers: 安全转义
   ============================================================ */
function escapeHTML(value){
  if(value == null) return '';
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}
function escapeAttr(value){
  return escapeHTML(value);
}
