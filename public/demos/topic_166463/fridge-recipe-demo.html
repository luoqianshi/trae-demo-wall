<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冰箱食材AI菜谱生成器</title>
<style>
  :root {
    --primary: #2ecc71;
    --primary-dark: #27ae60;
    --primary-light: #a8e6cf;
    --secondary: #ff6b6b;
    --accent: #ffd93d;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #2d3436;
    --text-light: #636e72;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }
  /* Status Bar */
  .status-bar {
    background: var(--primary);
    height: 24px;
    width: 100%;
  }
  /* Tab Bar */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 20px;
    box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
    z-index: 100;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.3s;
    border: none;
    background: none;
    font-size: 12px;
    color: var(--text);
  }
  .tab-item.active { opacity: 1; color: var(--primary); }
  .tab-item svg { width: 24px; height: 24px; }
  /* Pages */
  .page { display: none; padding-bottom: 80px; min-height: 100vh; }
  .page.active { display: block; }
  /* Header */
  .page-header {
    background: var(--primary);
    padding: 20px 20px 30px;
    border-radius: 0 0 30px 30px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .page-header h1 { font-size: 22px; font-weight: 700; }
  .page-header p { font-size: 14px; opacity: 0.9; margin-top: 6px; }
  .page-header-simple {
    background: var(--primary);
    padding: 16px 20px 20px;
    color: white;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .page-header-simple .back-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
  }
  .page-header-simple h1 { font-size: 18px; font-weight: 600; }
  /* Section */
  .section { padding: 16px 20px; }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* Ingredient Tags */
  .ingredient-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .ingredient-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 2px solid var(--primary-light);
    border-radius: 25px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .ingredient-tag:active { transform: scale(0.95); }
  .ingredient-tag.selected {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .ingredient-tag .emoji { font-size: 18px; }
  /* Input */
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .search-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--primary-light);
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    background: var(--card);
    transition: border-color 0.3s;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-input::placeholder { color: #b2bec3; }
  .add-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .add-btn:active { transform: scale(0.95); }
  /* Flavor Options */
  .flavor-options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .flavor-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 2px solid #eee;
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .flavor-btn.selected {
    border-color: var(--primary);
    background: #e8f8f0;
    color: var(--primary-dark);
    font-weight: 600;
  }
  /* Selected Ingredients Bar */
  .selected-bar {
    background: var(--card);
    margin: -15px 20px 0;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    position: relative;
    z-index: 10;
  }
  .selected-bar .label { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
  .selected-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 32px;
    align-items: center;
  }
  .selected-tag {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #e8f8f0;
    color: var(--primary-dark);
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 13px;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .selected-tag .remove {
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    margin-left: 2px;
  }
  .selected-empty { font-size: 13px; color: #b2bec3; }
  /* Generate Button */
  .generate-btn {
    display: block;
    width: calc(100% - 40px);
    margin: 16px auto 0;
    padding: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(46,204,113,0.35);
    transition: all 0.2s;
  }
  .generate-btn:active { transform: translateY(2px); box-shadow: 0 3px 10px rgba(46,204,113,0.35); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  /* Recipe Result Card */
  .recipe-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin: 12px 20px;
    overflow: hidden;
    transition: all 0.3s;
    animation: slideUp 0.4s ease;
    cursor: pointer;
  }
  .recipe-card:active { transform: scale(0.98); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .recipe-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }
  .recipe-img-placeholder {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .recipe-info { padding: 16px; }
  .recipe-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .recipe-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .recipe-meta span {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .recipe-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .recipe-tag {
    background: #e8f8f0;
    color: var(--primary-dark);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
  }
  .recipe-match {
    background: #fff3e0;
    color: #e67e22;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  /* Recipe Detail Page */
  .detail-hero { position: relative; }
  .detail-hero .recipe-img-placeholder { height: 220px; }
  .detail-content { padding: 20px; }
  .detail-content h2 { font-size: 22px; margin-bottom: 8px; }
  .step-list { margin-top: 16px; }
  .step-item {
    display: flex;
    gap: 14px;
    margin-bottom: 16px;
  }
  .step-num {
    width: 28px;
    height: 28px;
    background: var(--primary);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .step-text { font-size: 14px; line-height: 1.7; color: var(--text); }
  .nutrition-bar {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
    box-shadow: var(--shadow);
  }
  .nutrition-bar h3 { font-size: 15px; margin-bottom: 12px; }
  .nutrition-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .nutrition-label { font-size: 13px; width: 50px; color: var(--text-light); }
  .nutrition-track {
    flex: 1;
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
  }
  .nutrition-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .nutrition-value { font-size: 12px; width: 40px; text-align: right; color: var(--text-light); }
  /* Fridge Page */
  .fridge-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin: 10px 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .fridge-emoji { font-size: 36px; }
  .fridge-info { flex: 1; }
  .fridge-name { font-size: 15px; font-weight: 600; }
  .fridge-date { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .fridge-status {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .status-fresh { background: #e8f8f0; color: var(--primary-dark); }
  .status-warning { background: #fff3e0; color: #e67e22; }
  .status-danger { background: #ffe0e0; color: var(--secondary); }
  .empty-state {
    text-align: center;
    padding: 60px 40px;
    color: var(--text-light);
  }
  .empty-state .emoji { font-size: 60px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  /* Profile Page */
  .profile-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    margin: -40px 20px 16px;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 12px;
  }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-stats {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
  .stat-item { text-align: center; cursor: pointer; transition: transform 0.2s; }
  .stat-item:active { transform: scale(0.92); }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .menu-list { padding: 0 20px; }
  .menu-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }
  .menu-item:active { background: #f8f9fa; }
  .menu-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .menu-icon.green { background: #e8f8f0; }
  .menu-icon.orange { background: #fff3e0; }
  .menu-icon.blue { background: #e3f2fd; }
  .menu-icon.pink { background: #fce4ec; }
  .menu-text { flex: 1; font-size: 14px; font-weight: 500; }
  .menu-arrow { color: #b2bec3; font-size: 14px; }
  /* Loading Animation */
  .loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: rgba(255,255,255,0.9);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .loading-overlay.show { display: flex; }
  .loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: var(--text-light); }
  /* Toast */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(45,52,54,0.9);
    color: white;
    padding: 10px 24px;
    border-radius: 25px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* History */
  .history-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 8px 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .history-emoji { font-size: 28px; }
  .history-info { flex: 1; }
  .history-name { font-size: 14px; font-weight: 600; }
  .history-time { font-size: 11px; color: var(--text-light); margin-top: 2px; }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">AI 正在为你匹配菜谱...</div>
</div>

<!-- ========== PAGE: Home ========== -->
<div class="page active" id="page-home">
  <div class="page-header">
    <h1>冰箱食材AI菜谱生成器</h1>
    <p>打开冰箱，AI 告诉你今天吃什么</p>
  </div>

  <div class="selected-bar">
    <div class="label">已选食材（点击下方添加）</div>
    <div class="selected-tags" id="selectedTags">
      <span class="selected-empty">还没有选择食材哦~</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">手动添加</div>
    <div class="search-box">
      <input type="text" class="search-input" id="ingredientInput" placeholder="输入食材名称，如：鸡蛋">
      <button class="add-btn" onclick="addCustomIngredient()">添加</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">常见食材（点击选择）</div>
    <div class="ingredient-grid" id="ingredientGrid"></div>
  </div>

  <div class="section">
    <div class="section-title">口味偏好</div>
    <div class="flavor-options" id="flavorOptions">
      <div class="flavor-btn selected" data-flavor="all" onclick="selectFlavor(this)">全部</div>
      <div class="flavor-btn" data-flavor="light" onclick="selectFlavor(this)">清淡</div>
      <div class="flavor-btn" data-flavor="spicy" onclick="selectFlavor(this)">麻辣</div>
      <div class="flavor-btn" data-flavor="sweet" onclick="selectFlavor(this)">酸甜</div>
      <div class="flavor-btn" data-flavor="quick" onclick="selectFlavor(this)">快手菜</div>
      <div class="flavor-btn" data-flavor="healthy" onclick="selectFlavor(this)">健康低脂</div>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn" onclick="generateRecipes()" disabled>
    AI 推荐菜谱
  </button>

  <div class="section" id="resultSection" style="display:none;">
    <div class="section-title">为你推荐</div>
    <div id="recipeList"></div>
  </div>
</div>

<!-- ========== PAGE: Detail ========== -->
<div class="page" id="page-detail">
  <div class="page-header-simple">
    <button class="back-btn" onclick="showPage('home')">&larr;</button>
    <h1>菜谱详情</h1>
  </div>
  <div class="detail-hero">
    <div class="recipe-img-placeholder" id="detailImg"></div>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<!-- ========== PAGE: Fridge ========== -->
<div class="page" id="page-fridge">
  <div class="page-header">
    <h1>我的冰箱</h1>
    <p>管理食材，减少浪费</p>
  </div>
  <div class="section">
    <div class="section-title">添加食材</div>
    <div class="search-box">
      <input type="text" class="search-input" id="fridgeNameInput" placeholder="食材名称">
      <input type="text" class="search-input" id="fridgeQtyInput" placeholder="数量（如3个）" style="max-width:100px;">
    </div>
    <div class="search-box">
      <div style="flex:1;display:flex;align-items:center;gap:8px;">
        <label style="font-size:13px;color:var(--text-light);white-space:nowrap;">购买日期</label>
        <input type="date" class="search-input" id="fridgeAddedInput" style="padding:10px 12px;">
      </div>
      <div style="flex:1;display:flex;align-items:center;gap:8px;">
        <label style="font-size:13px;color:var(--text-light);white-space:nowrap;">到期日期</label>
        <input type="date" class="search-input" id="fridgeExpireInput" style="padding:10px 12px;">
      </div>
    </div>
    <button class="add-btn" style="width:100%;padding:14px;font-size:15px;" onclick="addFridgeItem()">➕ 添加到冰箱</button>
  </div>
  <div id="fridgeList"></div>
</div>

<!-- ========== PAGE: Profile ========== -->
<div class="page" id="page-profile">
  <div class="page-header">
    <h1>个人中心</h1>
  </div>
  <div class="profile-card">
    <div class="profile-avatar">👨‍🍳</div>
    <div class="profile-name">美食探索家</div>
    <div class="profile-stats">
      <div class="stat-item" onclick="showHistory()">
        <div class="stat-num" id="statRecipes">0</div>
        <div class="stat-label">已做菜谱</div>
      </div>
      <div class="stat-item" onclick="showSavedDetail()">
        <div class="stat-num" id="statSaved">0</div>
        <div class="stat-label">减少浪费</div>
      </div>
      <div class="stat-item" onclick="showDaysDetail()">
        <div class="stat-num" id="statDays">7</div>
        <div class="stat-label">使用天数</div>
      </div>
    </div>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="showPage('home')">
      <div class="menu-icon green">🍳</div>
      <div class="menu-text">AI 推荐菜谱</div>
      <div class="menu-arrow">&gt;</div>
    </div>
    <div class="menu-item" onclick="showPage('fridge')">
      <div class="menu-icon orange">❄️</div>
      <div class="menu-text">我的冰箱</div>
      <div class="menu-arrow">&gt;</div>
    </div>
    <div class="menu-item" onclick="showHistory()">
      <div class="menu-icon blue">📜</div>
      <div class="menu-text">历史记录</div>
      <div class="menu-arrow">&gt;</div>
    </div>
    <div class="menu-item">
      <div class="menu-icon pink">⚙️</div>
      <div class="menu-text">设置</div>
      <div class="menu-arrow">&gt;</div>
    </div>
  </div>
</div>

<!-- ========== PAGE: History ========== -->
<div class="page" id="page-history">
  <div class="page-header-simple">
    <button class="back-btn" onclick="showPage('profile')">&larr;</button>
    <h1>历史记录</h1>
  </div>
  <div id="historyList"></div>
</div>

<!-- ========== PAGE: Saved Detail ========== -->
<div class="page" id="page-saved">
  <div class="page-header-simple">
    <button class="back-btn" onclick="showPage('profile')">&larr;</button>
    <h1>减少浪费</h1>
  </div>
  <div id="savedContent"></div>
</div>

<!-- ========== PAGE: Days Detail ========== -->
<div class="page" id="page-days">
  <div class="page-header-simple">
    <button class="back-btn" onclick="showPage('profile')">&larr;</button>
    <h1>使用天数</h1>
  </div>
  <div id="daysContent"></div>
</div>

<!-- Tab Bar -->

// ============ State ============
let selectedIngredients = [];
let selectedFlavor = 'all';
let cookHistory = [];
let statsRecipes = 12;
let statsSaved = 5;

// ============ Init ============
function init() {
  renderIngredientGrid();
  renderFridgeList();
  updateStats();
}

// ============ Navigation ============
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  const tabMap = { home: 'home', fridge: 'fridge', profile: 'profile' };
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.page === tabMap[pageId]);
  });
  window.scrollTo(0, 0);
}

function switchTab(btn) {
  showPage(btn.dataset.page);
}

// ============ Ingredients ============
function renderIngredientGrid() {
  const grid = document.getElementById('ingredientGrid');
  grid.innerHTML = commonIngredients.map(i => `
    <div class="ingredient-tag" onclick="toggleIngredient(this, '${i.name}')">
      <span class="emoji">${i.emoji}</span>
      <span>${i.name}</span>
    </div>
  `).join('');
}

function toggleIngredient(el, name) {
  const idx = selectedIngredients.indexOf(name);
  if (idx >= 0) {
    selectedIngredients.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    selectedIngredients.push(name);
    el.classList.add('selected');
  }
  updateSelectedBar();
}

function addCustomIngredient() {
  const input = document.getElementById('ingredientInput');
  const name = input.value.trim();
  if (!name) return;
  if (selectedIngredients.includes(name)) {
    showToast('已经添加过了');
    return;
  }
  selectedIngredients.push(name);
  updateSelectedBar();
  input.value = '';
  showToast('已添加: ' + name);
}

function removeIngredient(name) {
  selectedIngredients = selectedIngredients.filter(n => n !== name);
  document.querySelectorAll('.ingredient-tag').forEach(el => {
    if (el.textContent.includes(name)) el.classList.remove('selected');
  });
  updateSelectedBar();
}

function updateSelectedBar() {
  const bar = document.getElementById('selectedTags');
  const btn = document.getElementById('generateBtn');
  if (selectedIngredients.length === 0) {
    bar.innerHTML = '<span class="selected-empty">还没有选择食材哦~</span>';
    btn.disabled = true;
  } else {
    bar.innerHTML = selectedIngredients.map(n => `
      <span class="selected-tag">
        ${n}
        <span class="remove" onclick="removeIngredient('${n}')">&times;</span>
      </span>
    `).join('');
    btn.disabled = false;
  }
}

// ============ Flavor ============
function selectFlavor(el) {
  document.querySelectorAll('.flavor-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedFlavor = el.dataset.flavor;
}

// ============ Generate ============
function generateRecipes() {
  if (selectedIngredients.length === 0) return;
  const loading = document.getElementById('loading');
  loading.classList.add('show');
  document.getElementById('resultSection').style.display = 'none';

  setTimeout(() => {
    loading.classList.remove('show');

    let results = recipeDB.filter(r => {
      const matchCount = r.ingredients.filter(ri =>
        selectedIngredients.some(si => ri === si)
      ).length;
      return matchCount >= 1;
    });

    if (selectedFlavor !== 'all') {
      results = results.filter(r => r.flavor.includes(selectedFlavor));
    }

    results.sort((a, b) => {
      const aMatch = a.ingredients.filter(i => selectedIngredients.includes(i)).length;
      const bMatch = b.ingredients.filter(i => selectedIngredients.includes(i)).length;
      return bMatch - aMatch;
    });

    if (results.length === 0) {
      renderNoResult();
      return;
    }

    results = results.slice(0, 4);
    renderRecipes(results);
  }, 1500);
}

function renderRecipes(recipes) {
  const list = document.getElementById('recipeList');
  list.innerHTML = recipes.map((r, i) => {
    const matchCount = r.ingredients.filter(ri => selectedIngredients.includes(ri)).length;
    const matchPercent = Math.round((matchCount / r.ingredients.length) * 100);
    const bgColor = i === 0 ? '#e8f8f0' : i === 1 ? '#fff3e0' : i === 2 ? '#e3f2fd' : '#fce4ec';
    return `
      <div class="recipe-card" onclick="showDetail(${recipeDB.indexOf(r)})" style="animation-delay:${i * 0.1}s">
        <div class="recipe-img-placeholder" style="background:${bgColor}">${r.emoji}</div>
        <div class="recipe-info">
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-meta">
            <span>⏱️ ${r.time}分钟</span>
            <span>📊 ${r.difficulty}</span>
            <span>🔥 ${r.calories}kcal</span>
          </div>
          <div class="recipe-tags">
            <span class="recipe-match">匹配度 ${matchPercent}%</span>
            ${r.tags.map(t => `<span class="recipe-tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

function cookComplete(name) {

  showToast('太棒了！记录已保存 🎉');

// ============ Fridge ============
function renderFridgeList() {
  const list = document.getElementById('fridgeList');
  const today = new Date('2026-07-11');
  const sorted = [...fridgeData].sort((a, b) => new Date(a.expire) - new Date(b.expire));

  const dangerItems = sorted.filter(f => new Date(f.expire) <= new Date(today.getTime() + 2 * 86400000));
  const freshItems = sorted.filter(f => new Date(f.expire) > new Date(today.getTime() + 2 * 86400000));

  let html = '';
  if (fridgeData.length === 0) {
    html = '<div class="empty-state"><div class="emoji">❄️</div><p>冰箱空空的<br>点击上方添加你的食材吧</p></div>';
  } else {
    if (dangerItems.length > 0) {
      html += '<div class="section"><div class="section-title" style="color:var(--secondary);">⚠️ 即将过期</div>';
      dangerItems.forEach((f, i) => {
        const daysLeft = Math.ceil((new Date(f.expire) - today) / 86400000);
        const status = daysLeft <= 0 ? 'status-danger' : 'status-warning';
        const statusText = daysLeft <= 0 ? '已过期' : `${daysLeft}天后过期`;
        const realIdx = fridgeData.indexOf(f);
        html += `
          <div class="fridge-item">
            <div class="fridge-emoji" onclick="quickUse('${f.name}')" title="点击推荐菜谱">${f.emoji}</div>
            <div class="fridge-info" onclick="quickUse('${f.name}')" style="cursor:pointer;">
              <div class="fridge-name">${f.name} <small style="color:var(--text-light);font-weight:normal;">${f.qty}</small></div>
              <div class="fridge-date">到期: ${f.expire}</div>
            </div>
            <div class="fridge-status ${status}">${statusText}</div>
            <div style="cursor:pointer;font-size:18px;color:#ccc;margin-left:6px;" onclick="removeFridgeItem(${realIdx})" title="删除">&times;</div>
          </div>
        `;
      });
      html += '</div>';
    }

    html += '<div class="section"><div class="section-title">✅ 新鲜食材</div>';
    freshItems.forEach(f => {
      const daysLeft = Math.ceil((new Date(f.expire) - today) / 86400000);
      const realIdx = fridgeData.indexOf(f);
      html += `
        <div class="fridge-item">
          <div class="fridge-emoji" onclick="quickUse('${f.name}')" title="点击推荐菜谱">${f.emoji}</div>
          <div class="fridge-info" onclick="quickUse('${f.name}')" style="cursor:pointer;">
            <div class="fridge-name">${f.name} <small style="color:var(--text-light);font-weight:normal;">${f.qty}</small></div>
            <div class="fridge-date">到期: ${f.expire} · 还剩${daysLeft}天</div>
          </div>
          <div class="fridge-status status-fresh">新鲜</div>
          <div style="cursor:pointer;font-size:18px;color:#ccc;margin-left:6px;" onclick="removeFridgeItem(${realIdx})" title="删除">&times;</div>
        </div>
      `;
    });
    html += '</div>';
  }

  list.innerHTML = html;
}

function getEmojiForIngredient(name) {
  const emojiMap = {
    '鸡蛋': '🥚', '番茄': '🍅', '豆腐': '🧈', '青菜': '🥬', '土豆': '🥔',
    '胡萝卜': '🥕', '白菜': '🥬', '猪肉': '🥩', '鸡肉': '🍗', '虾': '🦐',
    '黄瓜': '🥒', '葱': '🧅', '姜': '🫚', '蒜': '🧄', '米饭': '🍚',
    '面条': '🍜', '牛奶': '🥛', '辣椒': '🌶️', '洋葱': '🧅', '蘑菇': '🍄',
    '牛肉': '🥩', '鱼': '🐟', '螃蟹': '🦀', '生菜': '🥬', '菠菜': '🥬',
    '芹菜': '🥬', '茄子': '🍆', '玉米': '🌽', '南瓜': '🎃', '花生': '🥜',
    '苹果': '🍎', '香蕉': '🍌', '橙子': '🍊', '西瓜': '🍉', '葡萄': '🍇',
    '草莓': '🍓', '面包': '🍞', '奶酪': '🧀', '酸奶': '🥛', '意大利面': '🍝',
    '包子': '🥟', '饺子': '🥟', '火锅': '🍲', '米饭': '🍚', '火腿': '🥓',
    '香肠': '🌭', '牛奶': '🥛', '豆腐干': '🧈', '粉条': '🍜', '木耳': '🍄'
  };
  for (const key in emojiMap) {
    if (name.includes(key) || key.includes(name)) return emojiMap[key];
  }
  return '🍽️';
}

function addFridgeItem() {
  const name = document.getElementById('fridgeNameInput').value.trim();
  const qty = document.getElementById('fridgeQtyInput').value.trim() || '适量';
  const added = document.getElementById('fridgeAddedInput').value;
  const expire = document.getElementById('fridgeExpireInput').value;

  if (!name) { showToast('请输入食材名称'); return; }
  if (!added || !expire) { showToast('请选择购买日期和到期日期'); return; }

  fridgeData.push({
    name: name,
    emoji: getEmojiForIngredient(name),
    qty: qty,
    added: added,
    expire: expire
  });

  document.getElementById('fridgeNameInput').value = '';
  document.getElementById('fridgeQtyInput').value = '';
  document.getElementById('fridgeAddedInput').value = '';
  document.getElementById('fridgeExpireInput').value = '';

  renderFridgeList();
  showToast('已添加: ' + name + ' 到冰箱');
}

function removeFridgeItem(idx) {
  const item = fridgeData[idx];
  fridgeData.splice(idx, 1);
  renderFridgeList();
  showToast('已从冰箱移除: ' + item.name);
}

function quickUse(name) {
  const item = fridgeData.find(f => f.name === name);
  const today = new Date('2026-07-11');
  if (item) {
    const daysLeft = Math.ceil((new Date(item.expire) - today) / 86400000);
    if (daysLeft <= 0) {
      showToast('⚠️ ' + name + ' 已过期，建议不要食用，请丢弃');
      return;
    }
  }
  if (!selectedIngredients.includes(name)) {
    selectedIngredients.push(name);
  }
  updateSelectedBar();
  showPage('home');
  showToast('已添加临期食材: ' + name + '，请尽快使用！');
}

  calendarHtml += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">';

}
