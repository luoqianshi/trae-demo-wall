<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口语跟读 - 多语学堂</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .speaking-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .speaking-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        .sentence-number {
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .sentence-text {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .sentence-translation {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .speak-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .mic-btn:hover {
            transform: scale(1.1);
        }

        .mic-btn.recording {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, #eb3349, #f45c43);
            box-shadow: 0 5px 20px rgba(235, 51, 73, 0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .mic-text {
            color: #666;
            font-size: 14px;
        }

        .play-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .result-section {
            background: #f5f7fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .result-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .your-text {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-style: italic;
            color: #333;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn.prev {
            background: #f0f2f5;
            color: #666;
        }

        .nav-btn.next {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .sentence-text {
                font-size: 22px;
            }

            .mic-btn {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌍</span>
                <span>多语学堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#languages">语言课程</a></li>
                <li><a href="../index.html#modules" class="active">学习模块</a></li>
                <li><a href="community.html">学习社区</a></li>
            </ul>
            <div class="user-area">
                <button class="login-btn" id="loginBtn">登录/注册</button>
                <div class="user-avatar" id="userAvatar" style="display: none;" onclick="toggleUserMenu(event)">
                    <span id="avatarText">U</span>
                    <div class="user-dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="event.preventDefault(); logout(); closeUserMenu();">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="speaking-container">
        <div class="page-title">
            <h1>🎤 口语跟读</h1>
            <p>AI语音评测，纠正发音问题</p>
        </div>

        <div class="lang-selector">
            <button class="lang-btn active" onclick="switchLang('en')">🇺🇸 英语</button>
            <button class="lang-btn" onclick="switchLang('ja')">🇯🇵 日语</button>
            <button class="lang-btn" onclick="switchLang('ko')">🇰🇷 韩语</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 20%;"></div>
        </div>

        <div class="speaking-card">
            <div class="sentence-number" id="sentenceNumber">第 1 句 / 共 5 句</div>
            <div class="sentence-text" id="sentenceText">Hello, nice to meet you.</div>
            <div class="sentence-translation" id="sentenceTranslation">你好，很高兴见到你。</div>
            
            <button class="play-btn" onclick="playOriginal()">
                <span>🔊</span> 播放原音
            </button>

            <div class="speak-section">
                <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
                <div class="mic-text" id="micText">点击麦克风开始跟读</div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="score-circle" id="scoreCircle">85</div>
                <div class="result-title">📝 评测结果</div>
                <div class="result-text">你的发音：</div>
                <div class="your-text" id="yourText">Hello, nice to meet you.</div>
                <div class="result-text" id="resultFeedback">发音不错，继续保持！部分单词的重音可以再加强。</div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn prev" id="prevBtn" onclick="prevSentence()" disabled>← 上一句</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextSentence()">下一句 →</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">关于我们</a></li>
                <li><a href="#">使用条款</a></li>
                <li><a href="#">隐私政策</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
            <p class="footer-copy">© 2026 多语学堂 - 沉浸式语言学习平台</p>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 class="modal-title" id="modalTitle">用户登录</h3>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="form-btn" id="submitBtn">登录</button>
                <p class="form-switch">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink" onclick="switchForm()">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script>
        let currentLang = 'en';
        let currentIndex = 0;
        let sentences = [];
        let isRecording = false;
        let recognition = null;
        let scores = [];

        function init() {
            updateUserDisplay();
            loadSentences();
            initSpeechRecognition();
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = getLangCode(currentLang);

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    evaluatePronunciation(transcript);
                };

                recognition.onerror = function(event) {
                    stopRecording();
                    Utils.showToast('识别失败，请重试', 'error');
                };

                recognition.onend = function() {
                    stopRecording();
                };
            }
        }

        function getLangCode(lang) {
            const codes = { en: 'en-US', ja: 'ja-JP', ko: 'ko-KR' };
            return codes[lang] || 'en-US';
        }

        function loadSentences() {
            sentences = AppData.speaking[currentLang];
            currentIndex = 0;
            scores = [];
            showSentence();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.toggle('active', ['en', 'ja', 'ko'][i] === lang);
            });
            if (recognition) {
                recognition.lang = getLangCode(lang);
            }
            loadSentences();
        }

        function showSentence() {
            const sentence = sentences[currentIndex];
            document.getElementById('sentenceNumber').textContent = `第 ${currentIndex + 1} 句 / 共 ${sentences.length} 句`;
            document.getElementById('sentenceText').textContent = sentence.text;
            document.getElementById('sentenceTranslation').textContent = sentence.translation;
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('progressFill').style.width = ((currentIndex + 1) / sentences.length * 100) + '%';
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').textContent = currentIndex === sentences.length - 1 ? '完成 ✓' : '下一句 →';
        }

        function playOriginal() {
            const sentence = sentences[currentIndex];
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(sentence.text);
                utterance.lang = getLangCode(currentLang);
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            } else {
                Utils.showToast('您的浏览器不支持语音播放', 'error');
            }
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            if (!recognition) {
                Utils.showToast('您的浏览器不支持语音识别，使用模拟评测', 'info');
                simulateRecording();
                return;
            }
            
            try {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micText').textContent = '正在聆听...请朗读';
                recognition.start();
            } catch (e) {
                simulateRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micText').textContent = '点击麦克风开始跟读';
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function simulateRecording() {
            isRecording = true;
            document.getElementById('micBtn').classList.add('recording');
            document.getElementById('micText').textContent = '正在聆听...请朗读';
            
            setTimeout(() => {
                const sentence = sentences[currentIndex];
                evaluatePronunciation(sentence.text);
            }, 2000);
        }

        function evaluatePronunciation(userText) {
            stopRecording();
            const sentence = sentences[currentIndex];
            const original = sentence.text.toLowerCase();
            const user = userText.toLowerCase().trim();
            
            let score = 0;
            const originalWords = original.split(/\s+/);
            const userWords = user.split(/\s+/);
            
            let matchCount = 0;
            originalWords.forEach(word => {
                if (userWords.includes(word)) matchCount++;
            });
            
            score = Math.round((matchCount / originalWords.length) * 100);
            score = Math.min(100, Math.max(50, score + Math.floor(Math.random() * 15)));
            
            scores.push(score);
            
            document.getElementById('yourText').textContent = userText;
            document.getElementById('scoreCircle').textContent = score;
            
            let feedback = '';
            if (score >= 90) {
                feedback = '🎉 太棒了！发音非常标准，继续保持！';
            } else if (score >= 75) {
                feedback = '👍 不错！发音基本准确，注意个别单词的重音和语调。';
            } else if (score >= 60) {
                feedback = '💪 继续加油！多听多练，注意单词的发音细节。';
            } else {
                feedback = '📖 还需要多加练习哦，建议先听原音再跟读。';
            }
            document.getElementById('resultFeedback').textContent = feedback;
            document.getElementById('resultSection').classList.add('show');

            if (score >= 90) {
                Utils.showToast('发音很棒！', 'success');
            }
        }

        function prevSentence() {
            if (currentIndex > 0) {
                currentIndex--;
                showSentence();
            }
        }

        function nextSentence() {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                showSentence();
            } else {
                finishPractice();
            }
        }

        function finishPractice() {
            const avgScore = scores.length > 0 
                ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) 
                : 0;
            Utils.showToast(`练习完成！平均得分：${avgScore}分`, 'success');
            Storage.addStudyTime(10);

            if (avgScore >= 90) {
                if (Storage.unlockAchievement('口语达人')) {
                    setTimeout(() => Utils.showToast('🏆 解锁成就：口语达人', 'success'), 1500);
                }
            }
        }

        let isLogin = true;

        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function switchForm() {
            isLogin = !isLogin;
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');

            if (isLogin) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('登录成功！', 'success');
            } else {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('注册成功！', 'success');
            }
            
            closeModal();
            updateUserDisplay();
        });

        function updateUserDisplay() {
            const user = Storage.getUser();
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'flex';
                document.getElementById('avatarText').textContent = user.avatar;
            }
        }

        function logout() {
            Storage.clearUser();
            Utils.showToast('已退出登录', 'info');
            updateUserDisplay();
        }

        init();
    </script>
</body>
</html>
