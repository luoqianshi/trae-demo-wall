<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>语法练习 - 多语学堂</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .grammar-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .grammar-topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .topic-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .topic-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .topic-card.active {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .topic-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .topic-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .topic-desc {
            font-size: 12px;
            color: #666;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .question-type {
            font-size: 12px;
            color: #666;
            background: #f0f2f5;
            padding: 5px 12px;
            border-radius: 15px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #333;
        }

        .choice-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .choice-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .choice-option.correct {
            border-color: #38ef7d;
            background: #e8fff0;
            color: #11998e;
        }

        .choice-option.wrong {
            border-color: #f45c43;
            background: #fff0f0;
            color: #eb3349;
        }

        .fill-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .fill-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .fill-input.correct {
            border-color: #38ef7d;
            background: #e8fff0;
        }

        .fill-input.wrong {
            border-color: #f45c43;
            background: #fff0f0;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .next-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }

        .next-btn.show {
            display: block;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .result-detail {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }

        .explanation {
            background: #f5f7ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #667eea;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        @media (max-width: 768px) {
            .question-text {
                font-size: 16px;
            }

            .grammar-topics {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌍</span>
                <span>多语学堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#languages">语言课程</a></li>
                <li><a href="../index.html#modules" class="active">学习模块</a></li>
                <li><a href="community.html">学习社区</a></li>
            </ul>
            <div class="user-area">
                <button class="login-btn" id="loginBtn">登录/注册</button>
                <div class="user-avatar" id="userAvatar" style="display: none;" onclick="toggleUserMenu(event)">
                    <span id="avatarText">U</span>
                    <div class="user-dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="event.preventDefault(); logout(); closeUserMenu();">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="grammar-container">
        <div class="page-title">
            <h1>📖 语法练习</h1>
            <p>系统学习语法，夯实语言基础</p>
        </div>

        <div class="lang-selector">
            <button class="lang-btn active" onclick="switchLang('en')">🇺🇸 英语</button>
            <button class="lang-btn" onclick="switchLang('ja')">🇯🇵 日语</button>
            <button class="lang-btn" onclick="switchLang('ko')">🇰🇷 韩语</button>
        </div>

        <div id="topicSection">
            <h3 style="text-align: center; margin-bottom: 20px; color: #333;">选择语法主题</h3>
            <div class="grammar-topics" id="topicsList"></div>
        </div>

        <div id="quizSection" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <button class="btn-secondary" onclick="backToTopics()">← 返回主题</button>
                <span style="color: #666; font-size: 14px; align-self: center;" id="progressText">1 / 4</span>
            </div>
            
            <div class="question-card" id="questionCard">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">第 1 题</span>
                    <span class="question-type" id="questionType">选择题</span>
                </div>
                <div class="question-text" id="questionText">She ___ to school every day.</div>
                <div id="answerArea"></div>
                <div class="explanation" id="explanation"></div>
                <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
            </div>
        </div>

        <div id="resultSection" style="display: none;">
            <div class="result-card">
                <div class="result-score" id="finalScore">85%</div>
                <div class="result-text">本次练习得分</div>
                <div class="result-detail" id="resultDetail">答对 17 题 / 共 20 题</div>
                <button class="btn-primary" onclick="backToTopics()">继续练习</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">关于我们</a></li>
                <li><a href="#">使用条款</a></li>
                <li><a href="#">隐私政策</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
            <p class="footer-copy">© 2026 多语学堂 - 沉浸式语言学习平台</p>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 class="modal-title" id="modalTitle">用户登录</h3>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="form-btn" id="submitBtn">登录</button>
                <p class="form-switch">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink" onclick="switchForm()">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script>
        let currentLang = 'en';
        let currentTopicIndex = -1;
        let currentQuestionIndex = 0;
        let questions = [];
        let selectedAnswer = -1;
        let fillAnswer = '';
        let correctCount = 0;
        let answered = false;

        function init() {
            updateUserDisplay();
            renderTopics();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.toggle('active', ['en', 'ja', 'ko'][i] === lang);
            });
            renderTopics();
        }

        function renderTopics() {
            const topics = AppData.grammar[currentLang];
            const topicIcons = ['📝', '⏳', '🔮', '📊'];
            const html = topics.map((topic, i) => `
                <div class="topic-card" onclick="startTopic(${i})">
                    <div class="topic-icon">${topicIcons[i] || '📚'}</div>
                    <div class="topic-title">${topic.title}</div>
                    <div class="topic-desc">${topic.description}</div>
                </div>
            `).join('');
            document.getElementById('topicsList').innerHTML = html;
        }

        function startTopic(index) {
            currentTopicIndex = index;
            currentQuestionIndex = 0;
            correctCount = 0;
            answered = false;
            questions = AppData.grammar[currentLang][index].questions;
            
            document.getElementById('topicSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            
            showQuestion();
        }

        function backToTopics() {
            document.getElementById('topicSection').style.display = 'block';
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';
            currentTopicIndex = -1;
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentQuestionIndex];
            answered = false;
            selectedAnswer = -1;
            fillAnswer = '';

            document.getElementById('questionNumber').textContent = `第 ${currentQuestionIndex + 1} 题`;
            document.getElementById('questionType').textContent = q.type === 'choice' ? '选择题' : '填空题';
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('progressText').textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('explanation').classList.remove('show');
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').classList.remove('show');

            const answerArea = document.getElementById('answerArea');
            if (q.type === 'choice') {
                answerArea.innerHTML = `
                    <div class="choice-options">
                        ${q.options.map((opt, i) => 
                            `<div class="choice-option" data-index="${i}" onclick="selectChoice(${i})">${String.fromCharCode(65 + i)}. ${opt}</div>`
                        ).join('')}
                    </div>
                `;
            } else {
                answerArea.innerHTML = `
                    <input type="text" class="fill-input" id="fillInput" placeholder="请输入答案..." oninput="fillAnswer = this.value">
                `;
            }
        }

        function selectChoice(index) {
            if (answered) return;
            selectedAnswer = index;
            document.querySelectorAll('.choice-option').forEach((opt, i) => {
                opt.style.borderColor = i === index ? '#667eea' : '#e0e0e0';
                opt.style.background = i === index ? '#f5f7ff' : 'white';
            });
        }

        function submitAnswer() {
            const q = questions[currentQuestionIndex];
            let isCorrect = false;

            if (q.type === 'choice') {
                if (selectedAnswer === -1) {
                    Utils.showToast('请先选择答案', 'error');
                    return;
                }
                isCorrect = selectedAnswer === q.answer;
                const options = document.querySelectorAll('.choice-option');
                options.forEach((opt, i) => {
                    if (i === q.answer) {
                        opt.classList.add('correct');
                    } else if (i === selectedAnswer && !isCorrect) {
                        opt.classList.add('wrong');
                    }
                });
            } else {
                const input = document.getElementById('fillInput');
                fillAnswer = input.value.trim();
                if (!fillAnswer) {
                    Utils.showToast('请输入答案', 'error');
                    return;
                }
                isCorrect = fillAnswer.toLowerCase() === q.answer.toLowerCase();
                if (isCorrect) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('wrong');
                }
            }

            answered = true;
            if (isCorrect) {
                correctCount++;
                Utils.showToast('回答正确！', 'success');
            } else {
                Utils.showToast('回答错误', 'error');
            }

            document.getElementById('explanation').textContent = 
                isCorrect ? '🎉 回答正确，继续加油！' : `💡 正确答案是：${q.answer}`;
            document.getElementById('explanation').classList.add('show');

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResult() {
            const total = questions.length;
            const score = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('finalScore').textContent = score + '%';
            document.getElementById('resultDetail').textContent = `答对 ${correctCount} 题 / 共 ${total} 题`;

            Storage.addStudyTime(15);

            if (score >= 90) {
                if (Storage.unlockAchievement('优秀学员')) {
                    Utils.showToast('🏆 解锁成就：优秀学员', 'success');
                }
            }
        }

        let isLogin = true;

        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function switchForm() {
            isLogin = !isLogin;
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');

            if (isLogin) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('登录成功！', 'success');
            } else {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('注册成功！', 'success');
            }
            
            closeModal();
            updateUserDisplay();
        });

        function updateUserDisplay() {
            const user = Storage.getUser();
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'flex';
                document.getElementById('avatarText').textContent = user.avatar;
            }
        }

        function logout() {
            Storage.clearUser();
            Utils.showToast('已退出登录', 'info');
            updateUserDisplay();
        }

        init();
    </script>
</body>
</html>
