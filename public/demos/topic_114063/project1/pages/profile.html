<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人中心 - 多语学堂</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-level {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-item {
            margin-bottom: 20px;
        }

        .progress-item:last-child {
            margin-bottom: 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .progress-name {
            font-weight: 500;
            color: #333;
        }

        .progress-percent {
            color: #667eea;
            font-weight: 600;
        }

        .progress-bar-bg {
            height: 12px;
            background: #f0f2f5;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 6px;
            transition: width 0.5s;
        }

        .progress-detail {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
        }

        .achievement-item {
            text-align: center;
            padding: 20px 10px;
            background: #f8f9fa;
            border-radius: 15px;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .achievement-item:hover {
            transform: translateY(-3px);
        }

        .achievement-item.locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .achievement-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .achievement-name {
            font-size: 12px;
            font-weight: 500;
            color: #333;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-item:hover {
            background: #f0f2f5;
            transform: translateX(5px);
        }

        .menu-icon {
            font-size: 24px;
        }

        .menu-text {
            flex: 1;
            font-weight: 500;
            color: #333;
        }

        .menu-arrow {
            color: #ccc;
        }

        .streak-section {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .streak-icon {
            font-size: 60px;
        }

        .streak-info h3 {
            font-size: 24px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 5px;
        }

        .streak-info p {
            font-size: 14px;
            color: #d35400;
        }

        .login-prompt {
            text-align: center;
            padding: 60px 20px;
        }

        .login-prompt h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .login-prompt p {
            color: #666;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .profile-stats {
                gap: 20px;
            }

            .achievements-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌍</span>
                <span>多语学堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#languages">语言课程</a></li>
                <li><a href="../index.html#modules">学习模块</a></li>
                <li><a href="community.html">学习社区</a></li>
            </ul>
            <div class="user-area">
                <button class="login-btn" id="loginBtn">登录/注册</button>
                <div class="user-avatar" id="userAvatar" style="display: none;" onclick="toggleUserMenu(event)">
                    <span id="avatarText">U</span>
                    <div class="user-dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="event.preventDefault(); logout(); closeUserMenu();">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <div id="profileContent">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-name" id="profileName">用户</div>
                <div class="profile-level">语言学习爱好者 · Lv.5</div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalDays">12</div>
                        <div class="stat-label">学习天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalWords">256</div>
                        <div class="stat-label">单词量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalHours">8</div>
                        <div class="stat-label">学习时长(h)</div>
                    </div>
                </div>
            </div>

            <div class="streak-section">
                <div class="streak-icon">🔥</div>
                <div class="streak-info">
                    <h3 id="streakDays">12 天</h3>
                    <p>连续学习中，继续保持！</p>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">📊 学习进度</div>
                <div id="progressList"></div>
            </div>

            <div class="section-card">
                <div class="section-title">🏆 我的成就</div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="section-card">
                <div class="section-title">⚙️ 设置</div>
                <div class="menu-list">
                    <div class="menu-item" onclick="Utils.showToast('功能开发中')">
                        <span class="menu-icon">🔔</span>
                        <span class="menu-text">消息通知</span>
                        <span class="menu-arrow">→</span>
                    </div>
                    <div class="menu-item" onclick="Utils.showToast('功能开发中')">
                        <span class="menu-icon">🎯</span>
                        <span class="menu-text">学习目标</span>
                        <span class="menu-arrow">→</span>
                    </div>
                    <div class="menu-item" onclick="Utils.showToast('功能开发中')">
                        <span class="menu-icon">🌙</span>
                        <span class="menu-text">深色模式</span>
                        <span class="menu-arrow">→</span>
                    </div>
                    <div class="menu-item" onclick="logout(); closeUserMenu();">
                        <span class="menu-icon">🚪</span>
                        <span class="menu-text" style="color: #e74c3c;">退出登录</span>
                        <span class="menu-arrow">→</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="loginPrompt" class="login-prompt" style="display: none;">
            <div style="font-size: 80px; margin-bottom: 20px;">👤</div>
            <h2>登录后查看学习进度</h2>
            <p>登录后可以追踪你的学习数据，解锁更多功能</p>
            <button class="btn-primary" onclick="showLogin()">立即登录</button>
        </div>
    </div>

    <footer>
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">关于我们</a></li>
                <li><a href="#">使用条款</a></li>
                <li><a href="#">隐私政策</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
            <p class="footer-copy">© 2026 多语学堂 - 沉浸式语言学习平台</p>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 class="modal-title" id="modalTitle">用户登录</h3>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="form-btn" id="submitBtn">登录</button>
                <p class="form-switch">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink" onclick="switchForm()">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script>
        function init() {
            const user = Storage.getUser();
            if (user) {
                showProfile(user);
            } else {
                document.getElementById('profileContent').style.display = 'none';
                document.getElementById('loginPrompt').style.display = 'block';
            }
            updateUserDisplay();
        }

        function showProfile(user) {
            document.getElementById('profileContent').style.display = 'block';
            document.getElementById('loginPrompt').style.display = 'none';
            
            document.getElementById('profileAvatar').textContent = user.avatar;
            document.getElementById('profileName').textContent = user.nickname || user.email.split('@')[0];
            
            const progress = Storage.getProgress();
            const streak = Storage.getStreak();
            const enWords = Storage.getLearnedWords('en').length;
            const jaWords = Storage.getLearnedWords('ja').length;
            const koWords = Storage.getLearnedWords('ko').length;
            const totalWords = enWords + jaWords + koWords;
            const totalMinutes = progress.totalMinutes || 0;
            const totalHours = Math.floor(totalMinutes / 60);
            
            document.getElementById('streakDays').textContent = streak + ' 天';
            document.getElementById('totalDays').textContent = streak;
            document.getElementById('totalWords').textContent = totalWords;
            document.getElementById('totalHours').textContent = totalHours;

            renderProgress();
            renderAchievements();
        }

        function renderProgress() {
            const langs = [
                { code: 'en', name: '英语', icon: '🇺🇸', total: 100 },
                { code: 'ja', name: '日语', icon: '🇯🇵', total: 100 },
                { code: 'ko', name: '韩语', icon: '🇰🇷', total: 100 }
            ];

            const html = langs.map(lang => {
                const learned = Storage.getLearnedWords(lang.code).length;
                const percent = Math.min(100, Math.round((learned / lang.total) * 100));
                return `
                    <div class="progress-item">
                        <div class="progress-header">
                            <span class="progress-name">${lang.icon} ${lang.name}</span>
                            <span class="progress-percent">${percent}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="progress-detail">已掌握 ${learned} 个单词 · 目标 ${lang.total} 个</div>
                    </div>
                `;
            }).join('');

            document.getElementById('progressList').innerHTML = html;
        }

        function renderAchievements() {
            const unlocked = Storage.getAchievements();
            const html = AppData.achievements.map(ach => {
                const isUnlocked = unlocked.includes(ach.name);
                return `
                    <div class="achievement-item ${isUnlocked ? '' : 'locked'}" title="${ach.desc}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-name">${ach.name}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('achievementsGrid').innerHTML = html;
        }

        function showLogin() {
            document.getElementById('loginModal').classList.add('active');
        }

        let isLogin = true;

        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function switchForm() {
            isLogin = !isLogin;
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');

            if (isLogin) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('登录成功！', 'success');
            } else {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('注册成功！', 'success');
            }
            
            closeModal();
            init();
        });

        function updateUserDisplay() {
            const user = Storage.getUser();
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'flex';
                document.getElementById('avatarText').textContent = user.avatar;
            }
        }

        function logout() {
            Storage.clearUser();
            Utils.showToast('已退出登录', 'info');
            init();
        }

        init();
    </script>
</body>
</html>
