<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词记忆 - 多语学堂</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .vocab-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 30px;
            background: #f0f2f5;
            border-radius: 25px;
            padding: 5px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-tab {
            flex: 1;
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .mode-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .flashcard {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
            padding: 30px;
            text-align: center;
        }

        .flashcard:hover {
            transform: translateY(-5px);
        }

        .flashcard.flipped .card-front {
            transform: rotateY(180deg);
        }

        .flashcard.flipped .card-back {
            transform: rotateY(0);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            transition: transform 0.6s;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .word-text {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .word-phonetic {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .word-meaning {
            font-size: 24px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .word-example {
            font-size: 16px;
            color: #666;
            font-style: italic;
            max-width: 80%;
            line-height: 1.6;
        }

        .card-hint {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #999;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        .btn-known {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-unknown {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .quiz-question {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        .quiz-word {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .quiz-option {
            padding: 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .quiz-option.correct {
            border-color: #38ef7d;
            background: #e8fff0;
            color: #11998e;
        }

        .quiz-option.wrong {
            border-color: #f45c43;
            background: #fff0f0;
            color: #eb3349;
        }

        .quiz-result {
            text-align: center;
            padding: 40px 20px;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .word-text {
                font-size: 36px;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }

            .flashcard {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌍</span>
                <span>多语学堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#languages">语言课程</a></li>
                <li><a href="../index.html#modules" class="active">学习模块</a></li>
                <li><a href="community.html">学习社区</a></li>
            </ul>
            <div class="user-area">
                <button class="login-btn" id="loginBtn">登录/注册</button>
                <div class="user-avatar" id="userAvatar" style="display: none;" onclick="toggleUserMenu(event)">
                    <span id="avatarText">U</span>
                    <div class="user-dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="event.preventDefault(); logout(); closeUserMenu();">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="vocab-container">
        <div class="page-title">
            <h1>📚 单词记忆</h1>
            <p>卡片式记忆法，高效积累词汇量</p>
        </div>

        <div class="lang-selector">
            <button class="lang-btn active" onclick="switchLang('en')">🇺🇸 英语</button>
            <button class="lang-btn" onclick="switchLang('ja')">🇯🇵 日语</button>
            <button class="lang-btn" onclick="switchLang('ko')">🇰🇷 韩语</button>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" onclick="switchMode('flashcard')">卡片记忆</button>
            <button class="mode-tab" onclick="switchMode('quiz')">选词测试</button>
        </div>

        <div class="progress-info">
            <span id="progressText">进度: 0 / 10</span>
            <span id="correctText">正确: 0</span>
        </div>

        <div id="flashcardMode" class="flashcard-mode">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-front">
                    <div class="word-text" id="cardWord">apple</div>
                    <div class="word-phonetic" id="cardPhonetic">/ˈæpl/</div>
                    <div class="card-hint">点击卡片查看释义</div>
                </div>
                <div class="card-back">
                    <div class="word-meaning" id="cardMeaning">苹果</div>
                    <div class="word-example" id="cardExample">I eat an apple every day.</div>
                    <div class="card-hint">点击卡片返回</div>
                </div>
            </div>
            <div class="card-actions">
                <button class="action-btn btn-unknown" onclick="markWord(false)">❌ 不认识</button>
                <button class="action-btn btn-known" onclick="markWord(true)">✅ 认识</button>
            </div>
        </div>

        <div id="quizMode" class="quiz-container">
            <div class="quiz-question" id="quizQuestion">
                <div class="quiz-word" id="quizWord">apple</div>
                <div class="quiz-options" id="quizOptions">
                    <div class="quiz-option" onclick="selectAnswer(0)">苹果</div>
                    <div class="quiz-option" onclick="selectAnswer(1)">香蕉</div>
                    <div class="quiz-option" onclick="selectAnswer(2)">橙子</div>
                    <div class="quiz-option" onclick="selectAnswer(3)">葡萄</div>
                </div>
            </div>
        </div>

        <div id="resultScreen" style="display: none;">
            <div class="card quiz-result">
                <div class="result-score" id="resultScore">80%</div>
                <div class="result-text">本次练习正确率</div>
                <button class="btn-primary" onclick="restartQuiz()">再来一轮</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">关于我们</a></li>
                <li><a href="#">使用条款</a></li>
                <li><a href="#">隐私政策</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
            <p class="footer-copy">© 2026 多语学堂 - 沉浸式语言学习平台</p>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 class="modal-title" id="modalTitle">用户登录</h3>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="form-btn" id="submitBtn">登录</button>
                <p class="form-switch">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink" onclick="switchForm()">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script>
        let currentLang = 'en';
        let currentMode = 'flashcard';
        let currentIndex = 0;
        let wordList = [];
        let correctCount = 0;
        let isFlipped = false;
        let currentAnswer = -1;

        function init() {
            updateUserDisplay();
            loadWords();
        }

        function loadWords() {
            wordList = Utils.shuffleArray([...AppData.vocabulary[currentLang]]);
            currentIndex = 0;
            correctCount = 0;
            updateProgress();
            showCurrentWord();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.toggle('active', ['en', 'ja', 'ko'][i] === lang);
            });
            loadWords();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.includes(mode === 'flashcard' ? '卡片' : '测试'));
            });
            document.getElementById('flashcardMode').style.display = mode === 'flashcard' ? 'block' : 'none';
            document.getElementById('quizMode').classList.toggle('active', mode === 'quiz');
            document.getElementById('resultScreen').style.display = 'none';
            
            if (mode === 'quiz') {
                loadWords();
            } else {
                currentIndex = 0;
                correctCount = 0;
                updateProgress();
                showCurrentWord();
            }
        }

        function showCurrentWord() {
            if (currentIndex >= wordList.length) {
                showResult();
                return;
            }

            const word = wordList[currentIndex];
            document.getElementById('cardWord').textContent = word.word;
            document.getElementById('cardPhonetic').textContent = word.phonetic;
            document.getElementById('cardMeaning').textContent = word.meaning;
            document.getElementById('cardExample').textContent = word.example;
            
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');

            if (currentMode === 'quiz') {
                generateQuizOptions(word);
            }
        }

        function generateQuizOptions(word) {
            const allMeanings = AppData.vocabulary[currentLang].map(w => w.meaning);
            const wrongOptions = Utils.shuffleArray(allMeanings.filter(m => m !== word.meaning)).slice(0, 3);
            const options = Utils.shuffleArray([word.meaning, ...wrongOptions]);
            currentAnswer = options.indexOf(word.meaning);

            document.getElementById('quizWord').textContent = word.word;
            const optionsHtml = options.map((opt, i) => 
                `<div class="quiz-option" onclick="selectAnswer(${i})">${opt}</div>`
            ).join('');
            document.getElementById('quizOptions').innerHTML = optionsHtml;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function markWord(known) {
            if (known) {
                correctCount++;
                Storage.addLearnedWord(currentLang, wordList[currentIndex].word);
                Utils.showToast('已掌握该单词！', 'success');
            } else {
                Utils.showToast('将加入复习队列', 'info');
            }
            
            currentIndex++;
            updateProgress();
            showCurrentWord();
        }

        function selectAnswer(index) {
            const options = document.querySelectorAll('.quiz-option');
            if (index === currentAnswer) {
                options[index].classList.add('correct');
                correctCount++;
                Utils.showToast('回答正确！', 'success');
                Storage.addLearnedWord(currentLang, wordList[currentIndex].word);
            } else {
                options[index].classList.add('wrong');
                options[currentAnswer].classList.add('correct');
                Utils.showToast('回答错误', 'error');
            }

            setTimeout(() => {
                currentIndex++;
                updateProgress();
                showCurrentWord();
            }, 1000);
        }

        function updateProgress() {
            const total = wordList.length;
            document.getElementById('progressText').textContent = `进度: ${currentIndex} / ${total}`;
            document.getElementById('correctText').textContent = `正确: ${correctCount}`;
        }

        function showResult() {
            const total = wordList.length;
            const score = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('resultScore').textContent = score + '%';
            
            if (currentMode === 'flashcard') {
                document.getElementById('flashcardMode').style.display = 'none';
            } else {
                document.getElementById('quizMode').classList.remove('active');
            }
            document.getElementById('resultScreen').style.display = 'block';

            Storage.addStudyTime(10);
            checkAchievements();
        }

        function restartQuiz() {
            document.getElementById('resultScreen').style.display = 'none';
            if (currentMode === 'flashcard') {
                document.getElementById('flashcardMode').style.display = 'block';
            } else {
                document.getElementById('quizMode').classList.add('active');
            }
            loadWords();
        }

        function checkAchievements() {
            const learned = Storage.getLearnedWords(currentLang).length;
            if (learned >= 10) {
                if (Storage.unlockAchievement('单词大师')) {
                    Utils.showToast('🏆 解锁成就：单词大师', 'success');
                }
            }
        }

        let isLogin = true;

        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function switchForm() {
            isLogin = !isLogin;
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');

            if (isLogin) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('登录成功！', 'success');
            } else {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('注册成功！', 'success');
            }
            
            closeModal();
            updateUserDisplay();
        });

        function updateUserDisplay() {
            const user = Storage.getUser();
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'flex';
                document.getElementById('avatarText').textContent = user.avatar;
            }
        }

        function logout() {
            Storage.clearUser();
            Utils.showToast('已退出登录', 'info');
            updateUserDisplay();
        }

        init();
    </script>
</body>
</html>
