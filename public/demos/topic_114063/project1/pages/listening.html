<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>听力训练 - 多语学堂</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .listening-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .audio-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .audio-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .audio-info {
            flex: 1;
        }

        .audio-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .audio-desc {
            font-size: 12px;
            color: #666;
        }

        .quiz-section {
            display: none;
        }

        .quiz-section.active {
            display: block;
        }

        .back-btn {
            margin-bottom: 20px;
        }

        .player-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .player-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.secondary {
            width: 45px;
            height: 45px;
            font-size: 18px;
            background: #f0f2f5;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .script-toggle {
            background: none;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            color: #666;
            margin-top: 10px;
        }

        .script-toggle:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .audio-script {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            display: none;
            text-align: left;
        }

        .audio-script.show {
            display: block;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
        }

        .question-header {
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .question-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question-option {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .question-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .question-option.correct {
            border-color: #38ef7d;
            background: #e8fff0;
            color: #11998e;
        }

        .question-option.wrong {
            border-color: #f45c43;
            background: #fff0f0;
            color: #eb3349;
        }

        .submit-section {
            margin-top: 20px;
            text-align: center;
        }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .player-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌍</span>
                <span>多语学堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#languages">语言课程</a></li>
                <li><a href="../index.html#modules" class="active">学习模块</a></li>
                <li><a href="community.html">学习社区</a></li>
            </ul>
            <div class="user-area">
                <button class="login-btn" id="loginBtn">登录/注册</button>
                <div class="user-avatar" id="userAvatar" style="display: none;" onclick="toggleUserMenu(event)">
                    <span id="avatarText">U</span>
                    <div class="user-dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="event.preventDefault(); logout(); closeUserMenu();">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="listening-container">
        <div class="page-title">
            <h1>🎧 听力训练</h1>
            <p>海量听力材料，提升理解能力</p>
        </div>

        <div class="lang-selector">
            <button class="lang-btn active" onclick="switchLang('en')">🇺🇸 英语</button>
            <button class="lang-btn" onclick="switchLang('ja')">🇯🇵 日语</button>
            <button class="lang-btn" onclick="switchLang('ko')">🇰🇷 韩语</button>
        </div>

        <div id="listSection">
            <h3 style="text-align: center; margin-bottom: 20px; color: #333;">选择听力材料</h3>
            <div class="audio-list" id="audioList"></div>
        </div>

        <div id="quizSection" class="quiz-section">
            <div class="back-btn">
                <button class="btn-secondary" onclick="backToList()">← 返回列表</button>
            </div>

            <div class="player-card">
                <div class="player-title" id="playerTitle">日常对话 - 购物</div>
                <div class="audio-controls">
                    <button class="control-btn secondary" onclick="rewind()">⏪</button>
                    <button class="control-btn" id="playBtn" onclick="togglePlay()">▶️</button>
                    <button class="control-btn secondary" onclick="forward()">⏩</button>
                </div>
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <button class="script-toggle" onclick="toggleScript()">📝 查看原文</button>
                <div class="audio-script" id="audioScript"></div>
            </div>

            <div id="questionsContainer"></div>

            <div class="submit-section">
                <button class="btn-primary" id="submitBtn" onclick="submitAnswers()">提交答案</button>
            </div>
        </div>

        <div id="resultSection" style="display: none;">
            <div class="result-card">
                <div class="result-score" id="finalScore">90%</div>
                <div class="result-text">本次听力测试得分</div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn-secondary" onclick="backToList()">返回列表</button>
                    <button class="btn-primary" onclick="retryAudio()">再听一次</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">关于我们</a></li>
                <li><a href="#">使用条款</a></li>
                <li><a href="#">隐私政策</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
            <p class="footer-copy">© 2026 多语学堂 - 沉浸式语言学习平台</p>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 class="modal-title" id="modalTitle">用户登录</h3>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="form-btn" id="submitBtn">登录</button>
                <p class="form-switch">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink" onclick="switchForm()">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script>
        let currentLang = 'en';
        let currentAudioIndex = -1;
        let isPlaying = false;
        let currentTime = 0;
        let totalDuration = 30;
        let playInterval = null;
        let selectedAnswers = {};
        let submitted = false;

        function init() {
            updateUserDisplay();
            renderAudioList();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.toggle('active', ['en', 'ja', 'ko'][i] === lang);
            });
            renderAudioList();
        }

        function renderAudioList() {
            const list = AppData.listening[currentLang];
            const html = list.map((item, i) => `
                <div class="audio-item" onclick="selectAudio(${i})">
                    <div class="audio-icon">🎵</div>
                    <div class="audio-info">
                        <div class="audio-title">${item.title}</div>
                        <div class="audio-desc">${item.questions.length} 道题 · 约2分钟</div>
                    </div>
                    <div style="color: #667eea; font-size: 24px;">→</div>
                </div>
            `).join('');
            document.getElementById('audioList').innerHTML = html;
        }

        function selectAudio(index) {
            currentAudioIndex = index;
            const audio = AppData.listening[currentLang][index];
            
            document.getElementById('listSection').style.display = 'none';
            document.getElementById('quizSection').classList.add('active');
            document.getElementById('resultSection').style.display = 'none';
            
            document.getElementById('playerTitle').textContent = audio.title;
            document.getElementById('audioScript').textContent = audio.audioText;
            selectedAnswers = {};
            submitted = false;
            resetPlayer();
            
            renderQuestions(audio.questions);
        }

        function renderQuestions(questions) {
            const html = questions.map((q, i) => `
                <div class="question-card">
                    <div class="question-header">第 ${i + 1} 题：${q.question}</div>
                    <div class="question-options">
                        ${q.options.map((opt, j) => `
                            <div class="question-option" data-q="${i}" data-a="${j}" onclick="selectAnswer(${i}, ${j}, this)">
                                ${String.fromCharCode(65 + j)}. ${opt}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('questionsContainer').innerHTML = html;
        }

        function selectAnswer(qIndex, aIndex, el) {
            if (submitted) return;
            selectedAnswers[qIndex] = aIndex;
            
            const siblings = el.parentElement.querySelectorAll('.question-option');
            siblings.forEach(s => {
                s.style.borderColor = '#e0e0e0';
                s.style.background = 'white';
            });
            el.style.borderColor = '#667eea';
            el.style.background = '#f5f7ff';
        }

        function backToList() {
            stopPlay();
            document.getElementById('listSection').style.display = 'block';
            document.getElementById('quizSection').classList.remove('active');
            document.getElementById('resultSection').style.display = 'none';
        }

        function togglePlay() {
            if (isPlaying) {
                stopPlay();
            } else {
                startPlay();
            }
        }

        function startPlay() {
            if (currentTime >= totalDuration) {
                currentTime = 0;
            }
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸️';
            
            playInterval = setInterval(() => {
                currentTime += 0.5;
                if (currentTime >= totalDuration) {
                    currentTime = totalDuration;
                    stopPlay();
                }
                updateProgress();
            }, 500);

            speakText();
        }

        function speakText() {
            if ('speechSynthesis' in window) {
                const audio = AppData.listening[currentLang][currentAudioIndex];
                const utterance = new SpeechSynthesisUtterance(audio.audioText);
                const langCodes = { en: 'en-US', ja: 'ja-JP', ko: 'ko-KR' };
                utterance.lang = langCodes[currentLang];
                utterance.rate = 0.85;
                speechSynthesis.speak(utterance);
            }
        }

        function stopPlay() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️';
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        }

        function rewind() {
            currentTime = Math.max(0, currentTime - 5);
            updateProgress();
        }

        function forward() {
            currentTime = Math.min(totalDuration, currentTime + 5);
            updateProgress();
        }

        function seekAudio(event) {
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            currentTime = percent * totalDuration;
            updateProgress();
        }

        function updateProgress() {
            const percent = (currentTime / totalDuration) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentTime').textContent = formatTime(currentTime);
            document.getElementById('totalTime').textContent = formatTime(totalDuration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function resetPlayer() {
            stopPlay();
            currentTime = 0;
            updateProgress();
            document.getElementById('audioScript').classList.remove('show');
        }

        function toggleScript() {
            document.getElementById('audioScript').classList.toggle('show');
        }

        function submitAnswers() {
            const audio = AppData.listening[currentLang][currentAudioIndex];
            const total = audio.questions.length;
            
            const answered = Object.keys(selectedAnswers).length;
            if (answered < total) {
                Utils.showToast('请完成所有题目', 'error');
                return;
            }

            submitted = true;
            let correctCount = 0;

            audio.questions.forEach((q, i) => {
                const userAnswer = selectedAnswers[i];
                const options = document.querySelectorAll(`[data-q="${i}"]`);
                options.forEach((opt, j) => {
                    if (j === q.answer) {
                        opt.classList.add('correct');
                    } else if (j === userAnswer && userAnswer !== q.answer) {
                        opt.classList.add('wrong');
                    }
                });
                if (userAnswer === q.answer) correctCount++;
            });

            const score = Math.round((correctCount / total) * 100);
            
            setTimeout(() => {
                document.getElementById('quizSection').classList.remove('active');
                document.getElementById('resultSection').style.display = 'block';
                document.getElementById('finalScore').textContent = score + '%';
                stopPlay();
            }, 1500);

            Storage.addStudyTime(15);
            
            const progress = Storage.getProgress();
            progress.listeningCount = (progress.listeningCount || 0) + 1;
            Storage.setProgress(progress);

            if (progress.listeningCount >= 5) {
                if (Storage.unlockAchievement('听力高手')) {
                    setTimeout(() => Utils.showToast('🏆 解锁成就：听力高手', 'success'), 2000);
                }
            }
        }

        function retryAudio() {
            selectAudio(currentAudioIndex);
        }

        let isLogin = true;

        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function switchForm() {
            isLogin = !isLogin;
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');

            if (isLogin) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('登录成功！', 'success');
            } else {
                Storage.setUser({ email, avatar: email.charAt(0).toUpperCase(), nickname: email.split('@')[0] });
                Utils.showToast('注册成功！', 'success');
            }
            
            closeModal();
            updateUserDisplay();
        });

        function updateUserDisplay() {
            const user = Storage.getUser();
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userAvatar').style.display = 'flex';
                document.getElementById('avatarText').textContent = user.avatar;
            }
        }

        function logout() {
            Storage.clearUser();
            Utils.showToast('已退出登录', 'info');
            updateUserDisplay();
        }

        init();
    </script>
</body>
</html>
