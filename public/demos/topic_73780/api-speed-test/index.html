<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 模型测速台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2027;
      --panel-2: #232b34;
      --border: #2d3744;
      --text: #e6eaf0;
      --text-dim: #8b95a3;
      --accent: #4a9eff;
      --accent-hover: #6bb0ff;
      --success: #4ade80;
      --error: #f87171;
      --warn: #fbbf24;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seed-badge {
      font-size: 11px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      background: #f59e0b;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      line-height: 1.4;
    }

    /* 模拟数据开关 */
    .seed-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      margin-left: auto;
    }
    .seed-toggle-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-dim);
    }
    .seed-toggle input {
      display: none;
    }
    .seed-toggle-slider {
      position: relative;
      width: 32px;
      height: 18px;
      background: var(--border);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .seed-toggle-slider::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .seed-toggle input:checked + .seed-toggle-slider {
      background: #f59e0b;
    }
    .seed-toggle input:checked + .seed-toggle-slider::after {
      transform: translateX(14px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--text-dim);
    }

    .field input,
    .field textarea,
    .field select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .field textarea {
      resize: vertical;
      min-height: 70px;
      font-family: inherit;
    }

    .field .hint {
      font-size: 12px;
      color: var(--text-dim);
    }

    .btn-row {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover:not(:disabled) {
      background: var(--border);
    }

    button.danger {
      background: transparent;
      border: 1px solid var(--error);
      color: var(--error);
    }

    button.danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.1);
    }

    /* 自定义确认对话框（替代原生 confirm，避免内置浏览器不阻塞） */
    dialog.confirm-dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 20px;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    dialog.confirm-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }
    dialog.confirm-dialog .confirm-msg {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.6;
    }
    dialog.confirm-dialog .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 结果卡片 */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    .card-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
    }

    .card-value.success {
      color: var(--success);
    }

    .card-value.error {
      color: var(--error);
    }

    /* 表格 */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--panel-2);
      color: var(--text-dim);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.row-error td {
      color: var(--error);
    }

    .status-ok {
      color: var(--success);
    }

    .status-fail {
      color: var(--error);
    }

    /* 错误详情 */
    .error-dist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--text-dim);
      max-height: 200px;
      overflow-y: auto;
      padding: 8px 0;
    }

    .error-dist span {
      padding: 4px 8px;
      background: var(--panel-2);
      border-radius: 4px;
      border-left: 3px solid var(--error);
      word-break: break-all;
    }

    .error-dist span b {
      color: var(--error);
      margin-left: 4px;
      font-weight: 500;
    }

    /* 状态条 */
    .status-bar {
      padding: 10px 14px;
      background: var(--panel-2);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 14px;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .status-bar.running {
      color: var(--warn);
    }

    .status-bar.done {
      color: var(--success);
    }

    .status-bar.failed {
      color: var(--error);
    }

    /* 历史记录 */
    .history-row {
      cursor: pointer;
    }

    .history-row:hover {
      background: var(--panel-2);
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 30px;
      font-size: 13px;
    }

    /* 进度条 */
    .progress {
      height: 4px;
      background: var(--panel-2);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
      display: none;
    }

    .progress.active {
      display: block;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar input,
    .filter-bar button {
      flex: 0 1 auto;
      min-width: 0;
    }

    .filter-bar input,
    .filter-bar select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }

    .filter-bar input:focus,
    .filter-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-bar input[type="date"] {
      width: 150px;
    }

    .filter-bar button {
      padding: 8px 16px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* 批量操作按钮行 */
    .batch-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .batch-row button {
      padding: 8px 16px;
      font-size: 13px;
    }

    /* 对比面板 */
    #comparePanel {
      transition: opacity 0.2s;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-bar {
        flex-direction: column;
      }

      .filter-bar input[type="date"] {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- 自定义确认对话框 -->
  <dialog class="confirm-dialog" id="confirmDialog">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="secondary" id="confirmCancel">取消</button>
      <button class="danger" id="confirmOk">确定</button>
    </div>
  </dialog>

  <div class="container">
    <h1>API 模型测速台</h1>

    <!-- 配置区 -->
    <div class="panel">
      <div class="panel-title">配置</div>
      <div class="form-grid">
        <div class="field full">
          <label>Base URL</label>
          <input type="text" id="baseUrl" placeholder="https://api.example.com/v1">
        </div>
        <div class="field full">
          <label>API 路径</label>
          <input type="text" id="apiPath" value="/chat/completions" placeholder="/chat/completions">
          <span class="hint">拼接在 Base URL 后面的路径</span>
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="text" id="apiKey" placeholder="sk-...">
        </div>
        <div class="field">
          <label>模型名称</label>
          <input type="text" id="model" placeholder="model-name">
        </div>
        <div class="field full">
          <label>测试消息 (Prompt)</label>
          <textarea id="prompt" placeholder="输入测试消息...">任意输出100字</textarea>
        </div>
        <div class="field">
          <label>并发次数</label>
          <input type="number" id="concurrency" value="5" min="1" max="20">
          <span class="hint">默认 5 次，取中位数</span>
        </div>
        <div class="field">
          <label>超时 (秒)</label>
          <input type="number" id="timeout" value="60" min="5" max="300">
        </div>
        <div class="btn-row">
          <button id="startBtn">开始测速</button>
          <button id="stopBtn" class="secondary" disabled>停止</button>
        </div>
      </div>
    </div>

    <!-- 结果区 -->
    <div class="panel" id="resultPanel" style="display:none;">
      <div class="panel-title">测试结果 — <span id="resultModel"></span></div>

      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="status-bar" id="statusBar">准备中...</div>

      <div class="cards">
        <div class="card">
          <div class="card-label">TTFT (中位)</div>
          <div class="card-value" id="cardTtft">-</div>
        </div>
        <div class="card">
          <div class="card-label">TPS (中位)</div>
          <div class="card-value" id="cardTps">-</div>
        </div>
        <div class="card">
          <div class="card-label">总耗时 (中位)</div>
          <div class="card-value" id="cardTotal">-</div>
        </div>
        <div class="card">
          <div class="card-label">成功率</div>
          <div class="card-value" id="cardSuccess">-</div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>请求 #</th>
              <th>状态</th>
              <th>首Token延迟</th>
              <th>总耗时</th>
              <th>输出 Tokens</th>
              <th>每秒Token数</th>
              <th>错误详情</th>
            </tr>
          </thead>
          <tbody id="detailTbody"></tbody>
        </table>
      </div>

      <div class="error-dist" id="errorDist"></div>
    </div>

    <!-- 历史记录 -->
    <div class="panel">
      <div class="panel-title">历史记录
        <label class="seed-toggle" id="seedToggleWrap" style="display:none;">
          <span class="seed-toggle-label">模拟数据</span>
          <input type="checkbox" id="seedToggle">
          <span class="seed-toggle-slider"></span>
        </label>
      </div>
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <input type="text" id="filterModel" placeholder="模型名称">
        <select id="filterBaseUrl">
          <option value="">全部 Base URL</option>
        </select>
      </div>
      <!-- 批量操作按钮行（移到表格上方） -->
      <div class="batch-row" id="batchActions" style="display:none;">
        <button id="compareBtn">对比选中 (<span id="selectedCount">0</span>)</button>
        <button id="batchRetestBtn" class="secondary">批量重测 (<span id="retestCount">0</span>)</button>
        <button class="danger" id="clearHistoryBtn" style="margin-left:auto;">删除选中记录 (<span id="deleteCount">0</span>)</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>模型</th>
              <th>Base URL</th>
              <th>首Token延迟</th>
              <th>每秒Token数</th>
              <th>总耗时</th>
              <th>成功率</th>
            </tr>
          </thead>
          <tbody id="historyTbody">
            <tr>
              <td colspan="7" class="empty-state">暂无历史记录</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 对比图表面板 -->
    <div class="panel" id="comparePanel" style="display:none;">
      <div class="panel-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>模型对比</span>
        <button class="danger" id="closeCompareBtn">关闭</button>
      </div>
      <div style="position:relative; height:400px;">
        <canvas id="compareChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // ============ 工具函数 ============
    function median(arr) {
      if (!arr.length) return 0;
      const sorted = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function avg(arr) {
      if (!arr.length) return 0;
      return arr.reduce((s, v) => s + v, 0) / arr.length;
    }

    function fmtSeconds(ms) {
      if (ms == null || isNaN(ms)) return "-";
      return (ms / 1000).toFixed(2) + "s";
    }

    function fmtNow(ts) {
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
        `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // ============ 测速引擎 ============
    /**
     * 执行单次流式请求并测量指标
     * @param {Object} config - {baseUrl, apiKey, model, prompt, timeoutMs}
     * @param {number} index - 请求序号
     * @param {AbortSignal} signal - 中断信号
     * @param {Object} abortReasonRef - 共享对象 {value: "timeout"|"manual"|null}，用于区分超时与手动停止
     * @returns {Promise<Object>} 结果对象
     */
    async function runSingleRequest(config, index, signal, abortReasonRef) {
      const startTime = performance.now();
      let firstChunkTime = null;
      let usage = null;

      // 构造请求体（baseUrl + apiPath 拼接为完整 URL）
      const body = {
        model: config.model,
        messages: [{ role: "user", content: config.prompt }],
        stream: true,
        stream_options: { include_usage: true },
        _target_url: config.baseUrl.replace(/\/+$/, "") + "/" + config.apiPath.replace(/^\/+/, ""),
      };

      let resp;
      try {
        resp = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": config.apiKey,
          },
          body: JSON.stringify(body),
          signal,
        });
      } catch (e) {
        if (e.name === "AbortError") {
          // 根据中断原因分类：超时→timeout，手动停止→aborted
          const errorType = abortReasonRef && abortReasonRef.value === "timeout" ? "timeout" : "aborted";
          return { index, success: false, errorType };
        }
        return { index, success: false, errorType: "other", errorMsg: e.message };
      }

      // 非 2xx 状态码：分类错误
      if (!resp.ok) {
        let errorType = "other";
        if (resp.status === 401 || resp.status === 403) errorType = "auth_error";
        else if (resp.status === 429) errorType = "rate_limit";
        let errMsg = `HTTP ${resp.status}`;
        try {
          const errBody = await resp.text();
          errMsg += `: ${errBody.slice(0, 200)}`;
        } catch (_) { }
        return { index, success: false, errorType, errorMsg: errMsg };
      }

      // 读取流
      if (!resp.body) {
        // 非流式回退：直接读 JSON。将 firstChunkTime 设为 endTime，
        // 使 TTFT≈totalTime、TPS=0（符合"若 TTFT≈total_time 则 TPS=0"）
        try {
          const data = await resp.json();
          const endTime = performance.now();
          firstChunkTime = endTime;
          usage = data.usage || null;
          return computeResult(index, startTime, firstChunkTime, endTime, usage, true);
        } catch (e) {
          return { index, success: false, errorType: "other", errorMsg: e.message };
        }
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          if (firstChunkTime === null) firstChunkTime = performance.now();
          buffer += decoder.decode(value, { stream: true });

          // 按行解析 SSE
          const lines = buffer.split("\n");
          buffer = lines.pop() || ""; // 保留最后未完整的一行

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data:")) continue;
            const payload = trimmed.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const chunk = JSON.parse(payload);
              if (chunk.usage) usage = chunk.usage;
            } catch (_) {
              // 忽略解析错误（可能是部分 JSON）
            }
          }
        }
        // 处理 buffer 残留
        if (buffer.trim().startsWith("data:")) {
          const payload = buffer.trim().slice(5).trim();
          if (payload && payload !== "[DONE]") {
            try {
              const chunk = JSON.parse(payload);
              if (chunk.usage) usage = chunk.usage;
            } catch (_) { }
          }
        }
      } catch (e) {
        if (e.name === "AbortError") {
          const errorType = abortReasonRef && abortReasonRef.value === "timeout" ? "timeout" : "aborted";
          return { index, success: false, errorType };
        }
        return { index, success: false, errorType: "other", errorMsg: e.message };
      } finally {
        try { reader.releaseLock(); } catch (_) { }
      }

      const endTime = performance.now();
      // 空响应（无任何 chunk）视为失败，避免污染 TTFT/TPS 统计
      if (firstChunkTime === null) {
        return { index, success: false, errorType: "other", errorMsg: "空响应（未收到任何数据）" };
      }
      return computeResult(index, startTime, firstChunkTime, endTime, usage, true);
    }

    /**
     * 根据时间点计算结果指标
     */
    function computeResult(index, startTime, firstChunkTime, endTime, usage, success) {
      const ttft = firstChunkTime - startTime;
      const totalTime = endTime - startTime;
      const outputTokens = usage ? (usage.completion_tokens || 0) : 0;
      // TPS = 输出 tokens / (总耗时 - TTFT)，若 TTFT ≈ 总耗时则 0
      const genTime = totalTime - ttft;
      const tps = genTime > 50 ? outputTokens / (genTime / 1000) : 0;
      return {
        index,
        success,
        ttft,
        totalTime,
        outputTokens,
        tps,
        usage: usage || null,
      };
    }

    // ============ 并发执行 ============
    /**
 * 并发执行多次请求
 * @param {Object} config - 测速配置
 * @param {number} concurrency - 并发数
 * @param {Object} callbacks - {onProgress, onDetail}
 * @param {AbortSignal} signal - 中断信号
 * @param {Object} abortReasonRef - 共享对象 {value: "timeout"|"manual"|null}
 */
    async function runTest(config, concurrency, callbacks, signal, abortReasonRef) {
      const promises = [];
      let completed = 0;

      for (let i = 0; i < concurrency; i++) {
        const p = runSingleRequest(config, i, signal, abortReasonRef).then((res) => {
          completed++;
          if (callbacks.onProgress) callbacks.onProgress(completed, concurrency);
          if (callbacks.onDetail) callbacks.onDetail(res);
          return res;
        });
        promises.push(p);
      }

      const results = await Promise.all(promises);

      // 汇总
      const successful = results.filter((r) => r.success);
      const failed = results.filter((r) => !r.success);

      const errorDist = { timeout: 0, rate_limit: 0, auth_error: 0, other: 0, aborted: 0 };
      for (const r of failed) {
        if (errorDist.hasOwnProperty(r.errorType)) errorDist[r.errorType]++;
        else errorDist.other++;
      }

      // 收集失败请求的原始错误信息
      const errorDetails = failed.map((r) => ({
        index: r.index,
        errorType: r.errorType || "unknown",
        errorMsg: r.errorMsg || "",
      }));

      return {
        results,
        summary: {
          successRate: successful.length / concurrency,
          ttft: median(successful.map((r) => r.ttft)),
          tps: median(successful.map((r) => r.tps)),
          totalTime: median(successful.map((r) => r.totalTime)),
          avgTokens: avg(successful.map((r) => r.outputTokens)),
          errorDist,
          errorDetails,
          successCount: successful.length,
          totalCount: concurrency,
        },
      };
    }

    // ============ UI 渲染 ============
    const $ = (id) => document.getElementById(id);

    const els = {
      baseUrl: $("baseUrl"),
      apiPath: $("apiPath"),
      apiKey: $("apiKey"),
      model: $("model"),
      prompt: $("prompt"),
      concurrency: $("concurrency"),
      timeout: $("timeout"),
      startBtn: $("startBtn"),
      stopBtn: $("stopBtn"),
      clearHistoryBtn: $("clearHistoryBtn"),
      resultPanel: $("resultPanel"),
      resultModel: $("resultModel"),
      statusBar: $("statusBar"),
      progress: $("progress"),
      progressBar: $("progressBar"),
      cardTtft: $("cardTtft"),
      cardTps: $("cardTps"),
      cardTotal: $("cardTotal"),
      cardSuccess: $("cardSuccess"),
      detailTbody: $("detailTbody"),
      errorDist: $("errorDist"),
      historyTbody: $("historyTbody"),
    };

    function setStatus(text, type) {
      els.statusBar.textContent = text;
      els.statusBar.className = "status-bar" + (type ? " " + type : "");
    }

    function setProgress(done, total) {
      const pct = total > 0 ? (done / total) * 100 : 0;
      els.progressBar.style.width = pct + "%";
    }

    function renderDetailRow(res) {
      const tr = document.createElement("tr");
      if (!res.success) tr.className = "row-error";

      const statusCell = res.success
        ? '<td class="status-ok">✓ 成功</td>'
        : '<td class="status-fail">✗ 失败</td>';

      tr.innerHTML = `
    <td>#${res.index + 1}</td>
    ${statusCell}
    <td>${res.success ? fmtSeconds(res.ttft) : "-"}</td>
    <td>${res.success ? fmtSeconds(res.totalTime) : "-"}</td>
    <td>${res.success ? res.outputTokens : "-"}</td>
    <td>${res.success ? res.tps.toFixed(2) : "-"}</td>
    <td>${res.success ? "-" : escapeHtml(res.errorMsg ? `${res.errorType}: ${res.errorMsg}` : (res.errorType || "unknown"))}</td>
  `;
      els.detailTbody.appendChild(tr);
    }

    function renderSummary(summary) {
      els.cardTtft.textContent = fmtSeconds(summary.ttft);
      els.cardTps.textContent = summary.tps.toFixed(2);
      els.cardTotal.textContent = fmtSeconds(summary.totalTime);
      const ratePct = (summary.successRate * 100).toFixed(0) + "%";
      els.cardSuccess.textContent = ratePct;
      els.cardSuccess.className = "card-value " +
        (summary.successRate === 1 ? "success" :
          summary.successRate === 0 ? "error" : "");

      // 错误详情：显示原始错误信息
      const details = summary.errorDetails || [];
      if (details.length > 0) {
        els.errorDist.innerHTML = details.map((d) => {
          const label = d.errorMsg ? `${d.errorType}: ${d.errorMsg}` : d.errorType;
          return `<span>#${d.index + 1} <b>${escapeHtml(label)}</b></span>`;
        }).join("");
      } else {
        els.errorDist.innerHTML = '<span style="color:var(--success)">无错误</span>';
      }
    }

    // ============ 历史记录（后端 SQLite） ============
    async function loadHistory(filters) {
      let url = "/api/history?limit=50";
      if (filters) {
        const params = [];
        if (filters.model) params.push("model=" + encodeURIComponent(filters.model));
        if (filters.base_url) params.push("base_url=" + encodeURIComponent(filters.base_url));
        if (filters.start) params.push("start=" + filters.start);
        if (filters.end) params.push("end=" + filters.end);
        if (params.length) url += "&" + params.join("&");
      }
      try {
        const resp = await fetch(url);
        if (!resp.ok) return [];
        const list = await resp.json();
        return Array.isArray(list) ? list : [];
      } catch (e) {
        console.warn("加载历史记录失败:", e);
        return [];
      }
    }

    async function addHistory(record) {
      try {
        const resp = await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(record),
        });
        if (!resp.ok) console.warn("保存历史记录失败:", resp.status);
      } catch (e) {
        console.warn("保存历史记录失败:", e);
      }
      await renderHistory();
    }

    // 全局变量
    let chartInstance = null;
    window._historyList = [];

    async function renderHistory() {
      const filters = getFilterParams();
      const [list, seedResp] = await Promise.all([
        loadHistory(filters),
        fetch("/api/seed_mode").then(r => r.json()).catch(() => ({seed_mode: false})),
      ]);
      const wrap = document.getElementById("seedToggleWrap");
      const toggle = document.getElementById("seedToggle");
      if (wrap) wrap.style.display = "inline-flex";
      if (toggle) toggle.checked = seedResp.seed_mode;
      window._historyList = list;
      if (!list.length) {
        els.historyTbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无历史记录</td></tr>';
        updateBatchActions();
        return;
      }
      els.historyTbody.innerHTML = list.map((r) => `
    <tr class="history-row" data-id="${r.id}">
      <td>${fmtNow(r.timestamp * 1000)}</td>
      <td>${escapeHtml(r.model)}</td>
      <td>${escapeHtml(r.base_url)}</td>
      <td>${fmtSeconds(r.ttft)}</td>
      <td>${r.tps ? r.tps.toFixed(2) : "-"}</td>
      <td>${fmtSeconds(r.total_time)}</td>
      <td>${r.success_rate != null ? (r.success_rate * 100).toFixed(0) + "%" : "-"}</td>
    </tr>
  `).join("");

      // 点击历史记录回填配置
      els.historyTbody.querySelectorAll(".history-row").forEach((row) => {
        const id = parseInt(row.dataset.id, 10);
        const rec = list.find((r) => r.id === id);
        if (!rec) return;
        row.addEventListener("click", () => {
          els.baseUrl.value = rec.base_url;
          if (rec.api_path) els.apiPath.value = rec.api_path;
          els.model.value = rec.model;
          // API Key 不回填，避免覆盖
          if (rec.prompt) els.prompt.value = rec.prompt;
        });
      });

      // 默认全选所有行（用于对比/重测）
      window._allSelected = true;
      updateBatchActions();
      populateBaseUrlFilter(list);
    }

    function populateBaseUrlFilter(list) {
      const sel = document.getElementById("filterBaseUrl");
      if (!sel) return;
      const currentValue = sel.value;
      // 收集所有不重复的 base_url
      const urls = [...new Set(list.map((r) => r.base_url).filter(Boolean))];
      // 保留第一个选项（"全部"）
      sel.innerHTML = '<option value="">全部 Base URL</option>';
      urls.forEach((url) => {
        const opt = document.createElement("option");
        opt.value = url;
        opt.textContent = url;
        sel.appendChild(opt);
      });
      // 恢复选中值
      sel.value = currentValue;
    }

    function getFilterParams() {
      const model = document.getElementById("filterModel")?.value.trim() || "";
      const base_url = document.getElementById("filterBaseUrl")?.value.trim() || "";
      const params = {};
      if (model) params.model = model;
      if (base_url) params.base_url = base_url;
      return params;
    }

    function updateBatchActions() {
      const list = window._historyList || [];
      const count = window._allSelected ? list.length : 0;
      const batchActions = document.getElementById("batchActions");
      if (count > 0) {
        batchActions.style.display = "flex";
      } else {
        batchActions.style.display = "none";
      }
      document.getElementById("selectedCount").textContent = count;
      document.getElementById("retestCount").textContent = count;
      document.getElementById("deleteCount").textContent = count;
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    // ============ 主流程 ============
    let currentAbortController = null;
    let currentAbortReasonRef = null;

    /**
     * 开始测速
     * @param {Object|null} externalConfig - 外部传入配置（用于批量重测），为 null 时从表单读取
     */
    async function startTest(externalConfig) {
      let config;
      let concurrency;
      if (externalConfig) {
        config = externalConfig;
        concurrency = Math.max(1, Math.min(20, parseInt(els.concurrency.value, 10) || 5));
      } else {
        config = {
          baseUrl: els.baseUrl.value.trim(),
          apiPath: els.apiPath.value.trim(),
          apiKey: els.apiKey.value.trim(),
          model: els.model.value.trim(),
          prompt: els.prompt.value.trim(),
          timeoutMs: (parseInt(els.timeout.value, 10) || 60) * 1000,
        };
        concurrency = Math.max(1, Math.min(20, parseInt(els.concurrency.value, 10) || 5));

        // 校验
        if (!config.baseUrl) { alert("请填写 Base URL"); return; }
        if (!config.apiKey) { alert("请填写 API Key"); return; }
        if (!config.model) { alert("请填写模型名称"); return; }
        if (!config.prompt) { alert("请填写测试消息"); return; }
      }

      // 准备 UI
      els.resultPanel.style.display = "block";
      els.resultModel.textContent = config.model;
      els.detailTbody.innerHTML = "";
      els.errorDist.innerHTML = "";
      els.cardTtft.textContent = "-";
      els.cardTps.textContent = "-";
      els.cardTotal.textContent = "-";
      els.cardSuccess.textContent = "-";
      els.cardSuccess.className = "card-value";

      els.startBtn.disabled = true;
      els.stopBtn.disabled = false;
      els.progress.classList.add("active");
      setProgress(0, concurrency);
      setStatus(`正在并发执行 ${concurrency} 次请求...`, "running");

      currentAbortController = new AbortController();
      const signal = currentAbortController.signal;
      // 共享对象：区分超时("timeout")与手动停止("manual")
      const abortReasonRef = { value: null };
      currentAbortReasonRef = abortReasonRef;

      // 超时定时器：触发时标记为超时
      const timeoutTimer = setTimeout(() => {
        abortReasonRef.value = "timeout";
        currentAbortController.abort();
      }, config.timeoutMs);

      const t0 = Date.now();
      try {
        const { results, summary } = await runTest(
          config,
          concurrency,
          {
            onProgress: (done, total) => setProgress(done, total),
            onDetail: (res) => renderDetailRow(res),
          },
          signal,
          abortReasonRef
        );

        renderSummary(summary);

        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);
        if (summary.successCount === 0) {
          setStatus(`测试完成 (耗时 ${elapsed}s) — 全部失败`, "failed");
        } else {
          setStatus(`测试完成 (耗时 ${elapsed}s) — 成功 ${summary.successCount}/${summary.totalCount}`, "done");
        }

        // 保存历史到后端
        await addHistory({
          timestamp: Date.now() / 1000,
          model: config.model,
          baseUrl: config.baseUrl,
          apiPath: config.apiPath,
          apiKey: config.apiKey,
          prompt: config.prompt,
          ttft: summary.ttft,
          tps: summary.tps,
          totalTime: summary.totalTime,
          avgTokens: summary.avgTokens,
          successRate: summary.successRate,
          errorDist: summary.errorDist,
        });
      } catch (e) {
        if (e.name === "AbortError") {
          setStatus("测试已中止", "failed");
        } else {
          setStatus(`测试出错: ${e.message}`, "failed");
        }
      } finally {
        clearTimeout(timeoutTimer);
        currentAbortController = null;
        currentAbortReasonRef = null;
        els.startBtn.disabled = false;
        els.stopBtn.disabled = true;
        els.progress.classList.remove("active");
      }
    }

    function stopTest() {
      if (currentAbortController) {
        // 标记为手动停止，用于错误分类
        if (currentAbortReasonRef) currentAbortReasonRef.value = "manual";
        currentAbortController.abort();
        setStatus("正在中止...", "failed");
      }
    }

    // ============ 对比图表 ============
    function openCompareChart() {
      const records = window._historyList || [];
      if (!records.length) return;

      const panel = document.getElementById("comparePanel");
      panel.style.display = "block";

      const ctx = document.getElementById("compareChart").getContext("2d");

      // 销毁旧图表
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      const labels = records.map((r) => {
        const timeStr = fmtNow(r.timestamp * 1000);
        return `${r.model} (${timeStr})`;
      });

      // 将数组按 Min-Max 归一化到 0~100;若所有值相同(无差异)返回全 0
      function normalizeToPct(arr) {
        const min = Math.min(...arr);
        const max = Math.max(...arr);
        if (max === min) return arr.map(() => 0);
        return arr.map((v) => ((v - min) / (max - min)) * 100);
      }

      // 原始值(带单位),供 tooltip 展示
      const ttftRaw = records.map((r) => (r.ttft != null ? +(r.ttft / 1000).toFixed(3) : 0));             // 秒
      const tpsRaw = records.map((r) => (r.tps != null ? +r.tps.toFixed(2) : 0));                          // tokens/秒
      const totalRaw = records.map((r) => (r.total_time != null ? +(r.total_time / 1000).toFixed(3) : 0)); // 秒
      const successRaw = records.map((r) => (r.success_rate != null ? +(r.success_rate * 100).toFixed(1) : 0)); // %

      // 三个性能指标各自独立 Min-Max 归一化到 0~100;成功率保留原值
      const ttftData = normalizeToPct(ttftRaw);
      const tpsData = normalizeToPct(tpsRaw);
      const totalData = normalizeToPct(totalRaw);
      const successData = successRaw;

      chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [
            { label: "TTFT", data: ttftData, backgroundColor: "#4a9eff", yAxisID: "y", _raw: ttftRaw, _unit: "s" },
            { label: "TPS", data: tpsData, backgroundColor: "#4ade80", yAxisID: "y", _raw: tpsRaw, _unit: "tokens/s" },
            { label: "总耗时", data: totalData, backgroundColor: "#fbbf24", yAxisID: "y", _raw: totalRaw, _unit: "s" },
            { label: "成功率", data: successData, backgroundColor: "#f87171", yAxisID: "y", _raw: successRaw, _unit: "%" },
          ],
        },
        options: {
          indexAxis: "x",
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false,
          },
          plugins: {
            legend: { labels: { color: "#e6eaf0" } },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  const ds = ctx.dataset;
                  const raw = ds._raw[ctx.dataIndex];
                  const pct = ctx.parsed.y;
                  // 成功率:直接显示绝对百分比
                  if (ds.label === "成功率") {
                    return `${ds.label}: ${raw.toFixed(1)}%`;
                  }
                  // 其他指标:显示归一化比例 + 原始值
                  return `${ds.label}: ${pct.toFixed(1)}% (原始: ${raw} ${ds._unit || ""})`;
                },
              },
            },
          },
          scales: {
            x: {
              ticks: { color: "#8b95a3", maxRotation: 45, autoSkip: true },
              grid: { color: "#2d3744" },
            },
            y: {
              type: "linear",
              display: true,
              position: "left",
              beginAtZero: true,
              min: 0,
              max: 100,
              ticks: { color: "#8b95a3", callback: (v) => v + "%" },
              grid: { color: "#2d3744" },
              title: { display: true, text: "相对比例 (%) — 成功率为绝对值", color: "#8b95a3" },
            },
          },
        },
      });
    }

    function closeCompareChart() {
      const panel = document.getElementById("comparePanel");
      panel.style.display = "none";
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
    }

    // ============ 批量重测（并行） ============
    /**
     * 执行单次测速并返回结果（不操作 UI、不保存历史）
     * @param {Object} config - 测速配置
     * @param {number} concurrency - 并发数
     * @returns {Promise<Object>} {results, summary}
     */
    async function runSingleTest(config, concurrency) {
      const abortController = new AbortController();
      const abortReasonRef = { value: null };
      const timeoutTimer = setTimeout(() => {
        abortReasonRef.value = "timeout";
        abortController.abort();
      }, config.timeoutMs);
      try {
        const { results, summary } = await runTest(
          config,
          concurrency,
          { onProgress: () => {}, onDetail: () => {} },
          abortController.signal,
          abortReasonRef
        );
        return { results, summary };
      } finally {
        clearTimeout(timeoutTimer);
      }
    }

    async function batchRetest() {
      const ids = (window._historyList || []).map((r) => r.id);
      if (!ids.length) return;

      if (!(await customConfirm(`确定要批量重测 ${ids.length} 条记录吗？`))) return;

      // 显示批量重测进度条
      els.progress.classList.add("active");
      setProgress(0, ids.length);
      setStatus(`批量重测: 0/${ids.length} — 正在获取配置...`, "running");

      // 1. 并发获取所有历史记录的配置
      const configs = await Promise.allSettled(
        ids.map(async (id) => {
          const resp = await fetch(`/api/history/${id}`);
          if (!resp.ok) throw new Error(`获取记录 #${id} 失败`);
          const rec = await resp.json();
          return {
            id,
            config: {
              baseUrl: rec.base_url || "",
              apiPath: rec.api_path || "/chat/completions",
              apiKey: rec.api_key || "",
              model: rec.model || "",
              prompt: rec.prompt || "任意输出100字",
              timeoutMs: 60000,
            },
          };
        })
      );

      const validConfigs = configs.filter((r) => r.status === "fulfilled").map((r) => r.value);
      const failedFetch = configs.filter((r) => r.status === "rejected").length;
      if (!validConfigs.length) {
        setStatus(`批量重测失败：所有记录均无法获取配置`, "failed");
        els.progress.classList.remove("active");
        return;
      }

      // 2. 并发执行所有测速
      const concurrency = Math.max(1, Math.min(20, parseInt(els.concurrency.value, 10) || 5));
      setStatus(`批量重测: 共 ${validConfigs.length} 条，正在并行测速...`, "running");

      const testResults = await Promise.allSettled(
        validConfigs.map(async ({ id, config }, idx) => {
          const { summary } = await runSingleTest(config, concurrency);
          return { id, config, summary };
        })
      );

      // 3. 收集成功的结果，一次性保存历史
      const successResults = testResults
        .filter((r) => r.status === "fulfilled")
        .map((r) => r.value);

      const failedTest = testResults.filter((r) => r.status === "rejected").length;

      // 批量保存历史（并行）
      await Promise.allSettled(
        successResults.map(({ config, summary }) =>
          fetch("/api/history", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              timestamp: Date.now() / 1000,
              model: config.model,
              baseUrl: config.baseUrl,
              apiPath: config.apiPath,
              apiKey: config.apiKey,
              prompt: config.prompt,
              ttft: summary.ttft,
              tps: summary.tps,
              totalTime: summary.totalTime,
              avgTokens: summary.avgTokens,
              successRate: summary.successRate,
              errorDist: summary.errorDist,
            }),
          })
        )
      );

      // 4. 一次性刷新 UI
      els.progress.classList.remove("active");
      await renderHistory();

      const total = validConfigs.length;
      const success = successResults.length;
      const parts = [`批量重测完成: ${success}/${total} 条成功`];
      if (failedFetch) parts.push(`获取配置失败 ${failedFetch} 条`);
      if (failedTest) parts.push(`测速失败 ${failedTest} 条`);
      setStatus(parts.join("，"), failedTest || failedFetch ? "failed" : "done");
    }

    // ============ 自定义确认对话框 ============
    // 使用 <dialog> 实现模态确认，避免内置浏览器中 confirm() 不阻塞的问题
    const confirmDialog = document.getElementById("confirmDialog");
    const confirmMsg = document.getElementById("confirmMsg");
    const confirmOk = document.getElementById("confirmOk");
    const confirmCancel = document.getElementById("confirmCancel");

    /**
     * 显示自定义确认对话框
     * @param {string} message - 提示文本
     * @returns {Promise<boolean>} 用户点击"确定"返回 true，"取消"或关闭返回 false
     */
    function customConfirm(message) {
      confirmMsg.textContent = message;
      confirmDialog.returnValue = "";  // 重置返回值
      confirmDialog.showModal();
      return new Promise((resolve) => {
        function onClose() {
          confirmOk.removeEventListener("click", onOk);
          confirmCancel.removeEventListener("click", onCancel);
          confirmDialog.removeEventListener("close", onClose);
          resolve(confirmDialog.returnValue === "ok");
        }
        function onOk() { confirmDialog.close("ok"); }
        function onCancel() { confirmDialog.close(""); }
        confirmOk.addEventListener("click", onOk);
        confirmCancel.addEventListener("click", onCancel);
        confirmDialog.addEventListener("close", onClose);
      });
    }

    // ============ 事件绑定 ============
    els.startBtn.addEventListener("click", () => startTest());
    els.stopBtn.addEventListener("click", stopTest);
    els.clearHistoryBtn.addEventListener("click", async () => {
      const filters = getFilterParams();
      const list = window._historyList || [];
      if (!list.length) return;
      const hasFilter = Object.values(filters).some(v => v);
      const msg = hasFilter
        ? `确定删除筛选后的 ${list.length} 条记录？`
        : `当前无筛选条件，是否删除全部 ${list.length} 条记录？`;
      if (await customConfirm(msg)) {
        try {
          const params = new URLSearchParams(filters);
          await fetch(`/api/history?${params.toString()}`, { method: "DELETE" });
        } catch (_) { }
        await renderHistory();
      }
    });

    // 筛选条件变化时自动筛选
    document.getElementById("filterModel").addEventListener("input", renderHistory);
    document.getElementById("filterBaseUrl").addEventListener("change", renderHistory);

    // 模拟数据开关切换
    document.getElementById("seedToggle").addEventListener("change", async (e) => {
      try {
        await fetch("/api/seed_mode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ seed_mode: e.target.checked }),
        });
      } catch (_) { }
      await renderHistory();
    });

    // 对比
    document.getElementById("compareBtn").addEventListener("click", () => {
      openCompareChart();
      // 点击后滚动到对比图表面板
      const panel = document.getElementById("comparePanel");
      if (panel.style.display !== "none") {
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
    document.getElementById("closeCompareBtn").addEventListener("click", closeCompareChart);

    // 批量重测
    document.getElementById("batchRetestBtn").addEventListener("click", batchRetest);

    // 初始化
    (async () => {
      await renderHistory();
    })();
  </script>
</body>

</html>
