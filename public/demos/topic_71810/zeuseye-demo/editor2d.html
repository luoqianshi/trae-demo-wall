<body>
  <div class="editor-header">

<script>
let chart2d = null;
let sceneNodes = [];
let sceneLinks = [];
let selectedNode = null;
let nodeIdCounter = 1;

const CATEGORY_MAP = {
  core: { name: '核心设备', color: '#00c3ff', size: 50 },
  switch: { name: '核心设备', color: '#00c3ff', size: 48 },
  firewall: { name: '安全设备', color: '#00ff88', size: 45 },
  waf: { name: '安全设备', color: '#00ff88', size: 42 },
  server: { name: '服务器', color: '#ffa500', size: 38 },
  db: { name: '服务器', color: '#ff4757', size: 38 },
  pc: { name: '终端设备', color: '#8b5cf6', size: 28 },
  printer: { name: '终端设备', color: '#8b5cf6', size: 26 }
};

function init2d() {
  chart2d = echarts.init(document.getElementById('editor2d'), null, { renderer: 'canvas' });
  renderScene();
  window.addEventListener('resize', () => chart2d && chart2d.resize());

  chart2d.on('click', function(params) {
    if (params.dataType === 'node') {
      selectedNode = params.data;
      showProperties(params.data);
    }
  });
}

function renderScene() {
  const data = sceneNodes.map(n => ({
    name: n.name,
    value: n.value,
    x: n.x,
    y: n.y,
    category: n.category,
    symbolSize: n.size,
    itemStyle: { color: n.color, borderColor: '#fff', borderWidth: 1, shadowBlur: 10, shadowColor: n.color + '40' },
    label: { show: true, position: 'bottom', color: '#e0e6f0', fontSize: 11, formatter: n.name }
  }));

  const links = sceneLinks.map(l => ({
    source: l.source.name,
    target: l.target.name,
    lineStyle: { color: 'source', curveness: 0.1, width: 1.5, opacity: 0.6 }
  }));

  const categories = [
    { name: '核心设备', itemStyle: { color: '#00c3ff' } },
    { name: '安全设备', itemStyle: { color: '#00ff88' } },
    { name: '服务器', itemStyle: { color: '#ffa500' } },
    { name: '终端设备', itemStyle: { color: '#8b5cf6' } }
  ];

  chart2d.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', formatter: '{b}<br/>类型: {c}' },
    series: [{
      type: 'graph',
      layout: 'none',
      roam: true,
      label: { show: true, position: 'bottom', color: '#e0e6f0', fontSize: 11 },
      edgeSymbol: ['none', 'arrow'],
      edgeSymbolSize: [0, 8],
      data: data,
      links: links,
      categories: categories,
      lineStyle: { color: 'source', curveness: 0.1, width: 1.5, opacity: 0.6 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 3, opacity: 1 } },
      itemStyle: { borderColor: '#fff', borderWidth: 1, shadowBlur: 10, shadowColor: 'rgba(0,195,255,0.3)' }
    }]
  }, true);

  document.getElementById('nodeCount').textContent = sceneNodes.length;
  document.getElementById('linkCount').textContent = sceneLinks.length;
}

function dragStart(e, type) {
  e.dataTransfer.setData('nodeType', type);
}

function allowDrop(e) { e.preventDefault(); }

function drop(e) {
  e.preventDefault();
  const type = e.dataTransfer.getData('nodeType');
  if (!type) return;

  const rect = document.getElementById('canvasArea').getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const preset = CATEGORY_MAP[type] || CATEGORY_MAP.server;
  const node = {
    id: nodeIdCounter++,
    name: preset.name.replace('设备','').replace('器','') + '-' + nodeIdCounter,
    type: type,
    x: x,
    y: y,
    value: [x, y],
    color: preset.color,
    size: preset.size,
    category: preset.name
  };

  // Rename with counter
  const names = { core: '核心路由器', switch: '核心交换机', firewall: '防火墙', waf: 'WAF', server: '服务器', db: '数据库', pc: 'PC', printer: '打印机' };
  node.name = (names[type] || '节点') + '-' + (nodeIdCounter - 1);
  sceneNodes.push(node);

  // Auto-connect to nearest node
  if (sceneNodes.length > 1) {
    let nearest = null, minDist = Infinity;
    for (const n of sceneNodes.slice(0, -1)) {
      const d = Math.sqrt((n.x - x) ** 2 + (n.y - y) ** 2);
      if (d < minDist) { minDist = d; nearest = n; }
    }
    if (nearest && minDist < 300) {
      sceneLinks.push({ source: nearest, target: node });
    }
  }

  renderScene();
  document.getElementById('tooltipHint').style.display = 'none';
}

function showProperties(node) {
  const panel = document.getElementById('propPanel');
  panel.innerHTML = `
    <div class="prop-group"><label>节点名称</label><input type="text" id="propName" value="${node.name}" onchange="updateNode('name', this.value)"></div>
    <div class="prop-group"><label>节点类型</label><select id="propType" onchange="updateNode('type', this.value)">
      <option value="core" ${node.type==='core'?'selected':''}>核心设备</option>
      <option value="security" ${node.type==='security'?'selected':''}>安全设备</option>
      <option value="server" ${node.type==='server'?'selected':''}>服务器</option>
      <option value="terminal" ${node.type==='terminal'?'selected':''}>终端设备</option>
    </select></div>
    <div class="prop-group"><label>坐标 (X, Y)</label><div class="coord-row">
      <input type="number" id="propX" value="${Math.round(node.value[0])}" onchange="updateCoord(0, this.value)">
      <input type="number" id="propY" value="${Math.round(node.value[1])}" onchange="updateCoord(1, this.value)">
    </div></div>
    <div class="prop-group"><label>节点大小</label><input type="range" min="20" max="80" value="${node.symbolSize || 40}" onchange="updateNode('size', parseInt(this.value))" style="width:100%"></div>
    <div class="prop-group"><button style="width:100%;padding:8px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff4757;border-radius:6px;cursor:pointer" onclick="deleteSelectedNode()">删除节点</button></div>
  `;
}

function updateNode(key, value) {
  if (!selectedNode) return;
  const n = sceneNodes.find(x => x.name === selectedNode.name);
  if (!n) return;
  if (key === 'name') {
    // Update links that reference this node
    const oldName = n.name;
    n.name = value;
    sceneLinks.forEach(l => {
      if (l.source.name === oldName) l.source.name = value;
      if (l.target.name === oldName) l.target.name = value;
    });
  }
  if (key === 'type') {
    n.type = value;
    const colors = { core: '#00c3ff', security: '#00ff88', server: '#ffa500', terminal: '#8b5cf6' };
    n.color = colors[value] || '#00c3ff';
  }
  if (key === 'size') n.size = value;
  renderScene();
}

function updateCoord(idx, value) {
  if (!selectedNode) return;
  const n = sceneNodes.find(x => x.name === selectedNode.name);
  if (!n) return;
  const v = parseFloat(value);
  if (idx === 0) { n.x = v; n.value[0] = v; }
  if (idx === 1) { n.y = v; n.value[1] = v; }
  renderScene();
}

function deleteSelectedNode() {
  if (!selectedNode) return;
  sceneNodes = sceneNodes.filter(x => x.name !== selectedNode.name);
  sceneLinks = sceneLinks.filter(l => l.source.name !== selectedNode.name && l.target.name !== selectedNode.name);
  selectedNode = null;
  document.getElementById('propPanel').innerHTML = '<div class="hint">点击画布中的节点以编辑属性</div>';
  renderScene();
}

function clearScene() {
  if (!confirm('确定要清空场景吗？')) return;
  sceneNodes = []; sceneLinks = []; selectedNode = null;
  document.getElementById('propPanel').innerHTML = '<div class="hint">点击画布中的节点以编辑属性</div>';
  renderScene();
}
