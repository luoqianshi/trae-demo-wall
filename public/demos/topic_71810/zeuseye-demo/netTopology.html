      srcIp: '104.181.97.196', srcCountry: '美国', srcProvince: '-', srcBiz: '外部网络',
      dstIp: '39.134.66.88', dstBiz: 'IoT设备', disposeResult: '已隔离', disposeTime: '2026-04-23 07:36:00', analysis: '真实攻击，已处置' }},
];

// ===================== Three.js 场景 =====================
let scene, camera, renderer, controls, raycaster, mouse;
let nodeMeshes = [];
let edgeLines = [];
let labelElements = [];
let autoRotate = false;
let animationId;

function initThree() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth, h = container.clientHeight;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050714, 0.02);

  camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 1000);
  camera.position.set(18, 14, 22);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x050714, 1);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.5;
  controls.maxDistance = 50;
  controls.minDistance = 5;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // 灯光
  const ambient = new THREE.AmbientLight(0x404080, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);
  const pointLight = new THREE.PointLight(0x00c3ff, 0.3, 30);
  pointLight.position.set(0, 5, 0);
  scene.add(pointLight);

  // 网格地面
  const gridHelper = new THREE.GridHelper(30, 30, 0x1a1f3a, 0x0f1224);
  scene.add(gridHelper);

  // 星空背景粒子
  const starsGeo = new THREE.BufferGeometry();
  const starCount = 800;
  const posArr = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) {
    posArr[i] = (Math.random() - 0.5) * 80;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const starsMat = new THREE.PointsMaterial({ color: 0x4a5a8a, size: 0.08, transparent: true, opacity: 0.6 });
  const stars = new THREE.Points(starsGeo, starsMat);
  scene.add(stars);

  buildNodes();
  buildEdges();
  buildLabels();

  renderer.domElement.addEventListener('click', onCanvasClick);
  renderer.domElement.addEventListener('mousemove', onCanvasMove);
  window.addEventListener('resize', onResize);

  animate();
}

function buildNodes() {
  NODES.forEach(node => {
    let geometry, material;
    const glowColor = node.color;

    if (node.group === 'core') {
      geometry = new THREE.OctahedronGeometry(node.size, 0);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.3, shininess: 100 });
    } else if (node.group === 'security') {
      geometry = new THREE.BoxGeometry(node.size, node.size, node.size);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.2, shininess: 80 });
    } else if (node.group === 'attack') {
      geometry = new THREE.SphereGeometry(node.size, 16, 16);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: 0xff6600, emissiveIntensity: 0.4, transparent: true, opacity: 0.9 });
    } else if (node.group === 'server') {
      geometry = new THREE.CylinderGeometry(node.size * 0.6, node.size * 0.6, node.size * 1.2, 16);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.15 });
    } else if (node.group === 'honeypot') {
      geometry = new THREE.IcosahedronGeometry(node.size, 0);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.3, wireframe: true });
    } else {
      geometry = new THREE.SphereGeometry(node.size * 0.7, 12, 12);
      material = new THREE.MeshPhongMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.15 });
    }

    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(node.x, node.y, node.z);
    mesh.userData = node;
    scene.add(mesh);
    nodeMeshes.push(mesh);

    // 发光环
    if (node.group !== 'attack') {
      const ringGeo = new THREE.RingGeometry(node.size * 1.2, node.size * 1.4, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(node.x, node.y, node.z);
      ring.rotation.x = -Math.PI / 2;
      scene.add(ring);

      // 脉冲动画
      const pulseGeo = new THREE.SphereGeometry(node.size * 1.5, 16, 16);
      const pulseMat = new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.05, wireframe: true });
      const pulse = new THREE.Mesh(pulseGeo, pulseMat);
      pulse.position.set(node.x, node.y, node.z);
      pulse.userData = { isPulse: true, baseScale: 1, speed: 0.5 + Math.random() * 0.5 };
      scene.add(pulse);
      nodeMeshes.push(pulse);
    }
  });
}

function buildEdges() {
  EDGES.forEach(([srcId, dstId]) => {
    const src = NODES.find(n => n.id === srcId);
    const dst = NODES.find(n => n.id === dstId);
    if (!src || !dst) return;

    const isAttack = src.group === 'attack' || dst.group === 'attack';
    const color = isAttack ? 0xffd700 : 0x1a3a5a;
    const opacity = isAttack ? 0.6 : 0.25;

    const points = [
      new THREE.Vector3(src.x, src.y, src.z),
      new THREE.Vector3(dst.x, dst.y, dst.z)
    ];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    edgeLines.push(line);

    // 攻击流动效果
    if (isAttack) {
      const flowGeo = new THREE.SphereGeometry(0.1, 8, 8);
      const flowMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
      const flow = new THREE.Mesh(flowGeo, flowMat);
      flow.userData = { isFlow: true, src: points[0], dst: points[1], progress: 0, speed: 0.02 };
      scene.add(flow);
      nodeMeshes.push(flow);
    }
  });
}

function buildLabels() {
  const overlay = document.getElementById('labelOverlay');
  NODES.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node-label' + (node.isAttack ? ' attack' : '');
    el.innerHTML = (node.type ? `<div class="label-type">${node.type}</div>` : '') + node.name;
    el.dataset.nodeId = node.id;
    overlay.appendChild(el);
    labelElements.push({ element: el, node: node });
  });
}

function updateLabels() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth, h = container.clientHeight;

  labelElements.forEach(({ element, node }) => {
    const pos = new THREE.Vector3(node.x, node.y + node.size * 1.5, node.z);
    pos.project(camera);
    const x = (pos.x * 0.5 + 0.5) * w;
    const y = (-pos.y * 0.5 + 0.5) * h;

    if (pos.z > 1 || x < -50 || x > w + 50 || y < -50 || y > h + 50) {
      element.style.display = 'none';
    } else {
      element.style.display = 'block';
      element.style.left = x + 'px';
      element.style.top = y + 'px';
    }
  });
}

function onCanvasClick(event) {
  const container = document.getElementById('canvas-container');
  const rect = container.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeMeshes.filter(m => m.userData.id));

  if (intersects.length > 0) {
    const node = intersects[0].object.userData;
    showNodePopup(node, event.clientX - rect.left, event.clientY - rect.top);
  } else {
    hideNodePopup();
  }
}

function onCanvasMove(event) {
  const container = document.getElementById('canvas-container');
  const rect = container.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeMeshes.filter(m => m.userData.id));

  container.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
}

function showNodePopup(node, x, y) {
  const popup = document.getElementById('nodePopup');
  document.getElementById('popupTitle').textContent = node.name;
  document.getElementById('popupType').textContent = '类型: ' + node.type;
  document.getElementById('popupIp').textContent = 'ID: ' + node.id;
  document.getElementById('popupStatus').textContent = '状态: ' + (node.isAttack ? '攻击中' : '正常');
  popup.style.left = (x + 15) + 'px';
  popup.style.top = (y + 15) + 'px';
  popup.classList.add('show');
}

function hideNodePopup() {
  document.getElementById('nodePopup').classList.remove('show');
}

function onResize() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  animationId = requestAnimationFrame(animate);

  // 脉冲动画
  nodeMeshes.forEach(mesh => {
    if (mesh.userData.isPulse) {
      const t = Date.now() * 0.001 * mesh.userData.speed;
      const s = mesh.userData.baseScale + Math.sin(t) * 0.15;
      mesh.scale.set(s, s, s);
    }
    if (mesh.userData.isFlow) {
      mesh.userData.progress += mesh.userData.speed;
      if (mesh.userData.progress > 1) mesh.userData.progress = 0;
      const p = new THREE.Vector3().lerpVectors(mesh.userData.src, mesh.userData.dst, mesh.userData.progress);
      mesh.position.copy(p);
    }
  });

  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}

// ===================== UI 交互 =====================
function toggleAuto() {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  document.getElementById('btnAuto').classList.toggle('active', autoRotate);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

let legendVisible = true;
function toggleLegend() {
  legendVisible = !legendVisible;
  document.getElementById('legendOverlay').style.display = legendVisible ? 'block' : 'none';
}

let panelCollapsed = false;
function togglePanel() {
  panelCollapsed = !panelCollapsed;
  document.getElementById('sidePanel').classList.toggle('collapsed', panelCollapsed);
  document.getElementById('panelToggle').classList.toggle('collapsed', panelCollapsed);
  document.getElementById('panelToggle').innerHTML = panelCollapsed ? '&lsaquo;' : '&rsaquo;';
  setTimeout(onResize, 350);
}

let detailCollapsed = false;
function toggleDetail() {
  detailCollapsed = !detailCollapsed;
  document.getElementById('detailPanel').classList.toggle('collapsed', detailCollapsed);
  document.getElementById('detailToggleIcon').textContent = detailCollapsed ? '+' : '\u2212';
}

// ===================== 事件表格 =====================
function renderEvents() {
  const tbody = document.getElementById('eventTbody');
  const filter = document.getElementById('filterLevel').value;

  const filtered = filter === 'all' ? EVENTS : EVENTS.filter(e => e.layer === filter);

  tbody.innerHTML = filtered.map((evt, idx) => {
    const levelClass = evt.level === '高' ? 'tag-high' : evt.level === '中' ? 'tag-medium' : 'tag-low';
    return `<tr data-id="${evt.id}" onclick="selectEvent(${evt.id})">
      <td>${evt.time}</td>
      <td>${evt.name}</td>
      <td><span class="tag ${levelClass}">${evt.level}</span></td>
      <td>${evt.handler}</td>
      <td><span class="tag tag-done">${evt.status}</span></td>
    </tr>`;
  }).join('');
}

function filterEvents() {
  renderEvents();
}

let selectedEventId = null;
function selectEvent(id) {
  selectedEventId = id;
  document.querySelectorAll('#eventTbody tr').forEach(tr => tr.classList.remove('selected'));
  const row = document.querySelector(`#eventTbody tr[data-id="${id}"]`);
  if (row) row.classList.add('selected');

  const evt = EVENTS.find(e => e.id === id);
  if (!evt) return;
  const d = evt.detail;

  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="detail-row"><span class="label">发现事件安全设备</span><span class="value">${d.device}</span></div>
    <div class="detail-row"><span class="label">发生时间</span><span class="value">${d.time}</span></div>
    <div class="detail-row"><span class="label">事件名称</span><span class="value attack">${d.name}</span></div>
    <div class="detail-row"><span class="label">攻击结果</span><span class="value attack">${d.result}</span></div>
    <div class="detail-row"><span class="label">源IP</span><span class="value ip">${d.srcIp}</span></div>
    <div class="detail-row"><span class="label">源IP国家</span><span class="value">${d.srcCountry}</span></div>
    <div class="detail-row"><span class="label">源IP省</span><span class="value">${d.srcProvince}</span></div>
    <div class="detail-row"><span class="label">源IP业务系统</span><span class="value">${d.srcBiz}</span></div>
    <div class="detail-row"><span class="label">目的IP</span><span class="value ip">${d.dstIp}</span></div>
    <div class="detail-row"><span class="label">目的IP业务系统</span><span class="value">${d.dstBiz}</span></div>
    <div class="detail-row"><span class="label">处置结果</span><span class="value">${d.disposeResult}</span></div>
    <div class="detail-row"><span class="label">处置时间</span><span class="value">${d.disposeTime}</span></div>
    <div class="detail-row"><span class="label">事件研判</span><span class="value attack">${d.analysis}</span></div>
  `;

  // 展开详情面板
  if (detailCollapsed) toggleDetail();
}

// ===================== 初始化 =====================
window.addEventListener('DOMContentLoaded', () => {
  initThree();
  renderEvents();
});
</script>
