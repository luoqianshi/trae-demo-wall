    .status-bar span { display: flex; align-items: center; gap: 6px; }

</head>
<body>
  <div class="editor-header">
    <h1>3D拓扑编辑器</h1>
    <div class="actions">
      <button onclick="alert('DEMO: 加载配置')">加载配置</button>
      <button onclick="alert('DEMO: 保存配置')">保存配置</button>
      <button class="primary" onclick="alert('DEMO: 预览拓扑')">预览拓扑</button>
      <button class="danger" onclick="clearScene()">清空场景</button>
    </div>
  </div>

  <div class="editor-body">
    <div class="panel-left">
      <h3>模型库</h3>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'core')">
        <div class="model-icon core">🌐</div>
        <div class="model-info"><div class="model-name">核心路由器</div><div class="model-type">网络设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'switch')">
        <div class="model-icon core">🔀</div>
        <div class="model-info"><div class="model-name">核心交换机</div><div class="model-type">网络设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'firewall')">
        <div class="model-icon security">🛡️</div>
        <div class="model-info"><div class="model-name">防火墙</div><div class="model-type">安全设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'waf')">
        <div class="model-icon security">🔒</div>
        <div class="model-info"><div class="model-name">WAF</div><div class="model-type">安全设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'server')">
        <div class="model-icon server">🖥️</div>
        <div class="model-info"><div class="model-name">服务器</div><div class="model-type">计算设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'db')">
        <div class="model-icon server">🗄️</div>
        <div class="model-info"><div class="model-name">数据库</div><div class="model-type">存储设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'pc')">
        <div class="model-icon terminal">💻</div>
        <div class="model-info"><div class="model-name">终端PC</div><div class="model-type">终端设备</div></div>
      </div>
      <div class="model-item" draggable="true" ondragstart="dragStart(event, 'printer')">
        <div class="model-icon terminal">🖨️</div>
        <div class="model-info"><div class="model-name">打印机</div><div class="model-type">终端设备</div></div>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea" ondrop="drop(event)" ondragover="allowDrop(event)">
      <div id="editor3d"></div>
      <div class="tooltip-hint" id="tooltipHint">拖拽左侧模型到画布添加节点 | 滚轮缩放 | 拖拽旋转视角</div>
      <div class="status-bar">
        <span><span class="status-dot"></span>就绪</span>
        <span>节点: <span id="nodeCount">0</span></span>
        <span>连线: <span id="linkCount">0</span></span>
      </div>
    </div>

    <div class="panel-right">
      <h3>属性面板</h3>
      <div id="propPanel">
        <div class="hint">点击画布中的节点以编辑属性</div>
      </div>
    </div>
  </div>

<script>
let chart3d = null;
let sceneNodes = [];
let sceneLinks = [];
let selectedNode = null;
let nodeIdCounter = 1;

function init3d() {
  chart3d = echarts.init(document.getElementById('editor3d'));
  renderScene();
  window.addEventListener('resize', () => chart3d && chart3d.resize());

  chart3d.on('click', function(params) {
    if (params.dataType === 'node') {
      selectedNode = params.data;
      showProperties(params.data);
    }
  });
}

function renderScene() {
  const data = sceneNodes.map(n => ({
    name: n.name,
    value: [n.x, n.y, n.z],
    itemStyle: { color: n.color },
    symbolSize: n.size || 12,
    label: { show: true, formatter: n.name, position: 'top', color: '#e0e6f0', fontSize: 11 }
  }));

  const lines = sceneLinks.map(l => ({
    coords: [[l.source.x, l.source.y, l.source.z], [l.target.x, l.target.y, l.target.z]],
    lineStyle: { color: 'rgba(0,195,255,0.4)', width: 1.5 }
  }));

  chart3d.setOption({
    backgroundColor: 'transparent',
    tooltip: {},
    xAxis3D: { type: 'value', min: -200, max: 200, axisLine: { lineStyle: { color: 'rgba(0,195,255,0.2)' } }, axisLabel: { color: '#8a95ad', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(0,195,255,0.06)' } } },
    yAxis3D: { type: 'value', min: -200, max: 200, axisLine: { lineStyle: { color: 'rgba(0,195,255,0.2)' } }, axisLabel: { color: '#8a95ad', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(0,195,255,0.06)' } } },
    zAxis3D: { type: 'value', min: -100, max: 100, axisLine: { lineStyle: { color: 'rgba(0,195,255,0.2)' } }, axisLabel: { color: '#8a95ad', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(0,195,255,0.06)' } } },
    grid3D: {
      boxWidth: 400, boxHeight: 200, boxDepth: 200,
      viewControl: { projection: 'perspective', autoRotate: false, distance: 500, alpha: 30, beta: 30 },
      light: { main: { intensity: 1.2, shadow: true }, ambient: { intensity: 0.3 } },
      environment: '#0c0e1a'
    },
    series: [
      {
        type: 'scatter3D',
        data: data,
        itemStyle: { opacity: 0.9, borderColor: '#fff', borderWidth: 1 },
        emphasis: { itemStyle: { opacity: 1, borderColor: '#00ff88', borderWidth: 2 } }
      },
      {
        type: 'line3D',
        data: lines,
        lineStyle: { width: 2, opacity: 0.6 },
        effect: { show: true, period: 4, trailLength: 0.1, color: '#00c3ff', symbolSize: 4 }
      }
    ]
  });

  document.getElementById('nodeCount').textContent = sceneNodes.length;
  document.getElementById('linkCount').textContent = sceneLinks.length;
}

function dragStart(e, type) {
  e.dataTransfer.setData('nodeType', type);
}

function allowDrop(e) { e.preventDefault(); }

function drop(e) {
  e.preventDefault();
  const type = e.dataTransfer.getData('nodeType');
  if (!type) return;

  const rect = document.getElementById('canvasArea').getBoundingClientRect();
  const x = ((e.clientX - rect.left - rect.width/2) / rect.width) * 300;
  const y = ((e.clientY - rect.top - rect.height/2) / rect.height) * 200;
  const z = (Math.random() - 0.5) * 80;

  const presets = {
    core: { name: '核心路由器-' + nodeIdCounter, color: '#00c3ff', size: 16 },
    switch: { name: '核心交换机-' + nodeIdCounter, color: '#00c3ff', size: 14 },
    firewall: { name: '防火墙-' + nodeIdCounter, color: '#00ff88', size: 14 },
    waf: { name: 'WAF-' + nodeIdCounter, color: '#00ff88', size: 12 },
    server: { name: '服务器-' + nodeIdCounter, color: '#ffa500', size: 12 },
    db: { name: '数据库-' + nodeIdCounter, color: '#ff4757', size: 12 },
    pc: { name: 'PC-' + nodeIdCounter, color: '#8b5cf6', size: 10 },
    printer: { name: '打印机-' + nodeIdCounter, color: '#8b5cf6', size: 10 }
  };

  const preset = presets[type] || presets.server;
  const node = { id: nodeIdCounter++, name: preset.name, type, x, y, z, color: preset.color, size: preset.size };
  sceneNodes.push(node);

  // Auto-connect to nearest node
  if (sceneNodes.length > 1) {
    let nearest = null, minDist = Infinity;
    for (const n of sceneNodes.slice(0, -1)) {
      const d = Math.sqrt((n.x-x)**2 + (n.y-y)**2 + (n.z-z)**2);
      if (d < minDist) { minDist = d; nearest = n; }
    }
    if (nearest && minDist < 200) {
      sceneLinks.push({ source: nearest, target: node });
    }
  }

  renderScene();
  document.getElementById('tooltipHint').style.display = 'none';
}

function showProperties(node) {
  const panel = document.getElementById('propPanel');
  panel.innerHTML = `
    <div class="prop-group"><label>节点名称</label><input type="text" id="propName" value="${node.name}" onchange="updateNode('name', this.value)"></div>
    <div class="prop-group"><label>节点类型</label><select id="propType" onchange="updateNode('type', this.value)">
      <option value="core" ${node.type==='core'?'selected':''}>核心设备</option>
      <option value="security" ${node.type==='security'?'selected':''}>安全设备</option>
      <option value="server" ${node.type==='server'?'selected':''}>服务器</option>
      <option value="terminal" ${node.type==='terminal'?'selected':''}>终端设备</option>
    </select></div>
    <div class="prop-group"><label>坐标 (X, Y, Z)</label><div class="coord-row">
      <input type="number" id="propX" value="${Math.round(node.value[0])}" onchange="updateCoord(0, this.value)">
      <input type="number" id="propY" value="${Math.round(node.value[1])}" onchange="updateCoord(1, this.value)">
      <input type="number" id="propZ" value="${Math.round(node.value[2])}" onchange="updateCoord(2, this.value)">
    </div></div>
    <div class="prop-group"><label>节点大小</label><input type="range" min="5" max="30" value="${node.symbolSize || 12}" onchange="updateNode('size', parseInt(this.value))" style="width:100%"></div>
    <div class="prop-group"><button class="btn" style="width:100%;padding:8px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff4757;border-radius:6px;cursor:pointer" onclick="deleteSelectedNode()">删除节点</button></div>
  `;
}

function updateNode(key, value) {
  if (!selectedNode) return;
  const n = sceneNodes.find(x => x.name === selectedNode.name);
  if (!n) return;
  if (key === 'name') n.name = value;
  if (key === 'type') {
    n.type = value;
    const colors = { core: '#00c3ff', security: '#00ff88', server: '#ffa500', terminal: '#8b5cf6' };
    n.color = colors[value] || '#00c3ff';
  }
  if (key === 'size') n.size = value;
  renderScene();
}

function updateCoord(idx, value) {
  if (!selectedNode) return;
  const n = sceneNodes.find(x => x.name === selectedNode.name);
  if (!n) return;
  const v = parseFloat(value);
  if (idx === 0) n.x = v;
  if (idx === 1) n.y = v;
  if (idx === 2) n.z = v;
  renderScene();
}

function deleteSelectedNode() {
  if (!selectedNode) return;
  sceneNodes = sceneNodes.filter(x => x.name !== selectedNode.name);
  sceneLinks = sceneLinks.filter(l => l.source.name !== selectedNode.name && l.target.name !== selectedNode.name);
  selectedNode = null;
  document.getElementById('propPanel').innerHTML = '<div class="hint">点击画布中的节点以编辑属性</div>';
  renderScene();
}

function clearScene() {
  if (!confirm('确定要清空场景吗？')) return;
  sceneNodes = []; sceneLinks = []; selectedNode = null;
  document.getElementById('propPanel').innerHTML = '<div class="hint">点击画布中的节点以编辑属性</div>';
  renderScene();
}

// Demo: preload some nodes
function preloadDemo() {
  sceneNodes = [
    { id: 1, name: '互联网出口', type: 'core', x: 0, y: -120, z: 0, color: '#00c3ff', size: 16 },
    { id: 2, name: '防火墙-主', type: 'security', x: 0, y: -60, z: 10, color: '#00ff88', size: 14 },
    { id: 3, name: '核心交换机', type: 'core', x: 0, y: 0, z: 0, color: '#00c3ff', size: 14 },
    { id: 4, name: 'Web服务器-01', type: 'server', x: -60, y: 60, z: -10, color: '#ffa500', size: 12 },
    { id: 5, name: '数据库-主', type: 'server', x: 60, y: 60, z: 10, color: '#ff4757', size: 12 },
    { id: 6, name: '办公PC-01', type: 'terminal', x: -100, y: 120, z: 0, color: '#8b5cf6', size: 10 },
  ];
  sceneLinks = [
    { source: sceneNodes[0], target: sceneNodes[1] },
    { source: sceneNodes[1], target: sceneNodes[2] },
    { source: sceneNodes[2], target: sceneNodes[3] },
    { source: sceneNodes[2], target: sceneNodes[4] },
    { source: sceneNodes[3], target: sceneNodes[4] },
    { source: sceneNodes[2], target: sceneNodes[5] },
  ];
  nodeIdCounter = 7;
  renderScene();
}

window.addEventListener('load', function() {
  init3d();
  setTimeout(preloadDemo, 500);
});
</script>
