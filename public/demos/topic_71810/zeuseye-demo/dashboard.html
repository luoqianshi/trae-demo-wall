// ========== 工具函数 ==========
function formatDate(d) { return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }); }
function formatTime(d) { return d.toLocaleTimeString('zh-CN', { hour12: false }); }

function updateNavTime() {
  const now = new Date();
  const el = document.getElementById('navTime');
  if (el) el.innerHTML = `<span class="time-date">${formatDate(now)}</span><span>${String(now.getHours()).padStart(2,'0')}<span class="time-separator">:</span>${String(now.getMinutes()).padStart(2,'0')}<span class="time-separator">:</span>${String(now.getSeconds()).padStart(2,'0')}</span>`;
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'login.html';
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.querySelector('.sidebar-footer-text').textContent = sidebarCollapsed ? '展开菜单' : '收起菜单';
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  const active = document.querySelector(`.menu-item[data-page="${page}"]`);
  if (active) active.classList.add('active');

  const container = document.getElementById('mainContent');
  container.innerHTML = PAGE_CONTENTS[page] ? PAGE_CONTENTS[page]() : PAGE_CONTENTS.welcome();

  // 初始化页面特定逻辑
  if (page === 'welcome') initWelcome();
  if (page === 'user') renderTable('userTableBody', MOCK_USERS, renderUserRow);
  if (page === 'role') renderTable('roleTableBody', MOCK_ROLES, renderRoleRow);
  if (page === 'menu') renderTable('menuTableBody', MOCK_MENUS, renderMenuRow);
  if (page === 'basicAttack') renderTable('attackTableBody', MOCK_ATTACKS, renderAttackRow);
  if (page === 'basicNode') renderTable('nodeTableBody', MOCK_NODES, renderNodeRow);
  if (page === 'basicNodeIp') renderTable('nodeIpTableBody', MOCK_NODE_IPS, renderNodeIpRow);
  if (page === 'basicVulnerability') renderTable('vulnTableBody', MOCK_VULNERABILITIES, renderVulnRow);
  if (page === 'basicThreat') renderTable('threatTableBody', MOCK_THREATS, renderThreatRow);
}

function renderTable(tbodyId, data, rowFn) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="99" style="text-align:center">暂无数据</td></tr>'; return; }
  tbody.innerHTML = data.map(rowFn).join('');
}

function renderUserRow(u) {
  return `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.name}</td><td><span class="tag ${u.status==='启用'?'tag-success':'tag-danger'}">${u.status}</span></td><td>${u.createTime}</td><td><button class="btn" onclick="alert('DEMO: 编辑用户 - ${u.username}')">编辑</button> <button class="btn btn-danger" onclick="alert('DEMO: 删除用户 - ${u.username}')">删除</button></td></tr>`;
}
function renderRoleRow(r) {
  return `<tr><td>${r.id}</td><td>${r.name}</td><td>${r.code}</td><td>${r.desc}</td><td><span class="tag ${r.status==='启用'?'tag-success':'tag-danger'}">${r.status}</span></td><td><button class="btn" onclick="showRoleMenuModal(${r.id})">权限</button> <button class="btn" onclick="alert('DEMO: 编辑角色 - ${r.name}')">编辑</button> <button class="btn btn-danger" onclick="alert('DEMO: 删除角色 - ${r.name}')">删除</button></td></tr>`;
}
function renderMenuRow(m) {
  const parentName = m.parentId === 0 ? '根目录' : (MOCK_MENUS.find(p => p.id === m.parentId)?.name || m.parentId);
  return `<tr><td>${m.id}</td><td>${m.name}</td><td>${parentName}</td><td><span class="tag tag-info">${m.type}</span></td><td>${m.path || '-'}</td><td>${m.sort}</td><td><button class="btn" onclick="alert('DEMO: 编辑菜单 - ${m.name}')">编辑</button> <button class="btn btn-danger" onclick="alert('DEMO: 删除菜单 - ${m.name}')">删除</button></td></tr>`;
}
function renderAttackRow(a) {
  const levelClass = a.menaceGrade === '高危' ? 'tag-danger' : a.menaceGrade === '中危' ? 'tag-warning' : 'tag-success';
  const resultClass = a.result === '已拦截' ? 'tag-success' : a.result === '已隔离' ? 'tag-info' : 'tag-warning';
  return `<tr><td>${a.eventTime}</td><td>${a.eventName}</td><td>${a.category}</td><td><span class="tag ${levelClass}">${a.menaceGrade}</span></td><td>${a.srcIp}</td><td>${a.dstIp}</td><td><span class="tag ${resultClass}">${a.result}</span></td><td><button class="btn" onclick="alert('DEMO: 查看详情 - ${a.eventName}')">详情</button></td></tr>`;
}
function renderNodeRow(n) {
  return `<tr><td>${n.id}</td><td>${n.name}</td><td>${n.type}</td><td>${n.module}</td><td>${n.subModule}</td><td>${n.deviceType}</td><td>${n.sysType}</td><td>${n.coord}</td><td><button class="btn" onclick="alert('DEMO: 编辑节点 - ${n.name}')">编辑</button> <button class="btn btn-danger" onclick="alert('DEMO: 删除节点 - ${n.name}')">删除</button></td></tr>`;

// ========== Modal System ==========
function showModal(title, bodyHtml, actionsHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalActions').innerHTML = actionsHtml || '<button class="btn" onclick="closeModal()">关闭</button>';
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function showRoleMenuModal(roleId) {
  const role = MOCK_ROLES.find(r => r.id === roleId);
  const menuTreeHtml = buildMenuTreeHtml();
  showModal(
    `菜单权限 - ${role ? role.name : '角色'}`,
    `<div class="form-group"><label>角色编码</label><input type="text" value="${role ? role.code : ''}" readonly></div>
     <div class="form-group"><label>菜单权限</label><div class="menu-tree-container">${menuTreeHtml}</div></div>`,
    '<button class="btn btn-success" onclick="alert(\'DEMO: 保存权限设置\');closeModal()">保存</button><button class="btn" onclick="closeModal()">取消</button>'
  );
}

function buildMenuTreeHtml() {
  const roots = MOCK_MENUS.filter(m => m.parentId === 0);
  let html = '';
  roots.forEach(root => {
    html += `<div class="menu-tree-item"><input type="checkbox" checked id="menu_${root.id}"><label class="tree-label" for="menu_${root.id}">${root.name}</label></div>`;
    const children = MOCK_MENUS.filter(m => m.parentId === root.id);
    children.forEach(child => {
      html += `<div class="menu-tree-item"><div class="tree-indent"></div><input type="checkbox" checked id="menu_${child.id}"><label class="tree-label" for="menu_${child.id}">${child.name}</label></div>`;
    });
  });
  return html;
}

function initWelcome() {
  // Dashboard already rendered with static data
}

function filterTable(input, tbodyId) {
  const term = input.value.toLowerCase();
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  Array.from(tbody.children).forEach(tr => {
    const text = tr.textContent.toLowerCase();
    tr.style.display = text.includes(term) ? '' : 'none';
  });
}

function handlePasswordSubmit(e) {
  e.preventDefault();
  const oldPwd = document.getElementById('oldPwd');
  const newPwd = document.getElementById('newPwd');
  const confirmPwd = document.getElementById('confirmPwd');
  let valid = true;

  document.querySelectorAll('#pwdForm .form-group').forEach(g => g.classList.remove('error'));

  if (!oldPwd.value.trim()) {
    document.getElementById('fgOldPwd').classList.add('error');
    valid = false;
  }
  if (!newPwd.value.trim() || newPwd.value.length < 6) {
    document.getElementById('fgNewPwd').classList.add('error');
    valid = false;
  }
  if (newPwd.value !== confirmPwd.value) {
    document.getElementById('fgConfirmPwd').classList.add('error');
    valid = false;
  }

  if (valid) {
    alert('DEMO: 密码修改成功');
    oldPwd.value = ''; newPwd.value = ''; confirmPwd.value = '';
  }
}

// ========== 初始化 ==========
(function init() {
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = 'login.html'; return; }

  const user = JSON.parse(localStorage.getItem('user') || '{}');
  document.getElementById('userName').textContent = user.name || user.nickname || user.username || '管理员';
  document.getElementById('userAvatar').textContent = (user.name || user.nickname || user.username || 'A').charAt(0);

  updateNavTime();
  setInterval(updateNavTime, 1000);

  switchPage('welcome');
})();
