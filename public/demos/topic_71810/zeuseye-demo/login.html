<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络空间安全可视化平台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: #050714;
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 粒子背景 */
    .particles {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: #00c3ff;
      border-radius: 50%;
      opacity: 0.4;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* 扫描线 */
    .tech-lines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    .tech-lines::before, .tech-lines::after {
      content: '';
      position: absolute;
      width: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 195, 255, 0.06), transparent);
      height: 1px;
      animation: scanLine 6s linear infinite;
    }
    .tech-lines::before { top: 25%; animation-delay: 0s; }
    .tech-lines::after { top: 75%; animation-delay: 3s; }
    @keyframes scanLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 左侧面板 */
    .left-panel {
      width: 55%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background:
        radial-gradient(circle at 40% 50%, rgba(0, 100, 200, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 60% 30%, rgba(0, 200, 150, 0.05) 0%, transparent 50%);
    }

    /* 太阳系视觉 */
    .hero-visual {
      position: relative;
      width: 400px;
      height: 400px;
      margin-bottom: 40px;
    }

    /* 轨道环 */
    .orbit-ring {
      position: absolute;
      border: 1px solid rgba(0, 195, 255, 0.15);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .orbit-ring.ring1 {
      width: 280px; height: 280px;
      animation: orbitSpin 12s linear infinite;
    }
    .orbit-ring.ring2 {
      width: 220px; height: 220px;
      border-color: rgba(0, 255, 136, 0.12);
      animation: orbitSpin 18s linear infinite reverse;
    }
    .orbit-ring.ring3 {
      width: 160px; height: 160px;
      border-color: rgba(100, 150, 255, 0.1);
      animation: orbitSpin 8s linear infinite;
    }
    @keyframes orbitSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* 行星 */
    .planet {
      position: absolute;
      border-radius: 50%;
    }
    .planet.p1 {
      width: 10px; height: 10px;
      background: radial-gradient(circle, #00c3ff, transparent);
      box-shadow: 0 0 8px rgba(0, 195, 255, 0.6);
      top: 0; left: 50%;
      transform: translate(-50%, -50%);
    }
    .planet.p2 {
      width: 8px; height: 8px;
      background: radial-gradient(circle, #00ff88, transparent);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
      top: 50%; right: 0;
      transform: translate(50%, -50%);
    }
    .planet.p3 {
      width: 6px; height: 6px;
      background: radial-gradient(circle, #6496ff, transparent);
      box-shadow: 0 0 6px rgba(100, 150, 255, 0.6);
      bottom: 0; left: 50%;
      transform: translate(-50%, 50%);
    }
    .planet.p1b {
      width: 7px; height: 7px;
      background: radial-gradient(circle, #ffaa00, transparent);
      box-shadow: 0 0 6px rgba(255, 170, 0, 0.5);
      top: 50%; left: 0;
      transform: translate(-50%, -50%);
    }
    .planet.p2b {
      width: 5px; height: 5px;
      background: radial-gradient(circle, #ff6b6b, transparent);
      box-shadow: 0 0 6px rgba(255, 107, 107, 0.5);
      top: 15%; right: 15%;
    }

    /* 中心太阳 */
    .center-sun {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 80px;
    }
    .sun-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(0, 195, 255, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      animation: sunPulse 3s ease-in-out infinite alternate;
    }
    @keyframes sunPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }
    .sun-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90px; height: 90px;
      border: 1px dashed rgba(0, 195, 255, 0.3);
      border-radius: 50%;
      animation: sunRingRotate 10s linear infinite;
    }
    @keyframes sunRingRotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .sun-core {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #00c3ff, #0088cc);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 195, 255, 0.5), inset 0 0 10px rgba(255,255,255,0.2);
    }
    .sun-core svg {
      width: 26px; height: 26px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 左侧标题 */
    .hero-subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      color: rgba(0, 195, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }
    .hero-title {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #00c3ff, #00ff88, #00c3ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s linear infinite;
      margin-bottom: 16px;
      text-align: center;
    }
    @keyframes gradientShift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .hero-desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 6px;
      text-align: center;
    }

    /* 右侧面板 */
    .right-panel {
      width: 45%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    /* 垂直分割线 */
    .right-panel::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      bottom: 15%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(0, 195, 255, 0.4), rgba(0, 255, 136, 0.3), transparent);
      animation: dividerGlow 4s ease-in-out infinite alternate;
    }
    @keyframes dividerGlow {
      0% { opacity: 0.4; box-shadow: 0 0 5px rgba(0, 195, 255, 0.2); }
      100% { opacity: 1; box-shadow: 0 0 15px rgba(0, 195, 255, 0.4); }
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 400px;
      background: rgba(12, 16, 35, 0.75);
      border: 1px solid rgba(0, 195, 255, 0.2);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow:
        0 0 30px rgba(0, 195, 255, 0.1),
        0 0 60px rgba(0, 195, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 35px;
    }
    .login-header h1 {
      font-size: 22px;
      font-weight: 600;
      background: linear-gradient(90deg, #00c3ff, #00ff88, #00c3ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s linear infinite;
      margin-bottom: 8px;
    }
    .login-header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0 16px 0 46px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: rgba(0, 195, 255, 0.5);
      background: rgba(0, 195, 255, 0.06);
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.15);
    }
    .input-wrapper input::placeholder { color: rgba(255, 255, 255, 0.25); }
    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.4;
    }

    .login-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(90deg, #00a8e0, #00c3ff, #00ff88);
      background-size: 200% auto;
      border: none;
      border-radius: 10px;
      color: #050714;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      letter-spacing: 4px;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 25px rgba(0, 195, 255, 0.35);
      background-position: 100% center;
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: #ff4757;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      text-shadow: 0 0 8px rgba(255, 71, 87, 0.3);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .left-panel { display: none; }
      .right-panel {
        width: 100%;
        min-height: 100vh;
      }
      .right-panel::before { display: none; }
      .login-container {
        width: 90%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="tech-lines"></div>

  <!-- 左侧面板 -->
  <div class="left-panel">
    <div class="hero-visual">
      <!-- 轨道环 -->
      <div class="orbit-ring ring1">
        <div class="planet p1"></div>
        <div class="planet p1b"></div>
      </div>
      <div class="orbit-ring ring2">
        <div class="planet p2"></div>
        <div class="planet p2b"></div>
      </div>
      <div class="orbit-ring ring3">
        <div class="planet p3"></div>
      </div>
      <!-- 中心太阳 -->
      <div class="center-sun">
        <div class="sun-glow"></div>
        <div class="sun-ring"></div>
        <div class="sun-core">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="hero-subtitle">CYBERSPACE SECURITY VISUALIZATION PLATFORM</div>
    <div class="hero-title">网络空间安全可视化平台</div>
    <div class="hero-desc">看得见的网络安全</div>
  </div>

  <!-- 右侧面板 -->
  <div class="right-panel">
    <div class="login-container">
      <div class="login-header">
        <h1>欢迎登录</h1>
        <p>Cyberspace Security Visualization Platform</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="请输入用户名" value="admin" required>
          </div>
        </div>

        <div class="form-group">
          <label>密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="请输入密码" value="123456" required>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script>
    // 生成粒子
    const particles = document.getElementById('particles');
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 6) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      const size = Math.random() * 2 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      const colors = ['#00c3ff', '#00ff88', '#6496ff', '#a0a0ff'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      particles.appendChild(p);
    }

    // 登录处理 - DEMO模式：点击直接跳转
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(function() {
        // DEMO：直接设置 token 和用户信息并跳转
        localStorage.setItem('token', 'demo-token-' + Date.now());
        localStorage.setItem('user', JSON.stringify({
          username: 'admin',
          name: '系统管理员',
          nickname: '管理员'
        }));
        window.location.href = 'dashboard.html';
      }, 400);
    });
  </script>
</body>
</html>
