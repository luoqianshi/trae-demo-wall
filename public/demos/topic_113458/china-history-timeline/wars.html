        "长平之战": { a: [60, 15, 95, 90], b: [45, 40, 35, 18] },
        "淝水之战": { a: [8, 1, 88, 86], b: [80, 30, 30, 20] },
        "甲午战争": { a: [24, 3, 88, 84], b: [63, 35, 38, 22] },
        "抗美援朝战争": { a: [135, 19, 82, 70], b: [93, 14, 68, 55] }
      };
      const picked = known[w.name];
      if (picked) {
        w.metricsA = picked.a;
        w.metricsB = picked.b;
        return w;
      }
      const aTroops = 5 + (base % 96);
      const bTroops = 5 + ((base * 7) % 96);
      const aLoss = Math.max(1, Math.round(aTroops * (18 + (base % 38)) / 100));
      const bLoss = Math.max(1, Math.round(bTroops * (24 + ((base * 3) % 42)) / 100));
      const aInfluence = 45 + ((base * 5) % 51);
      const bInfluence = 35 + ((base * 11) % 55);
      const aWin = Math.max(5, Math.min(95, Math.round(50 + (aInfluence - bInfluence) / 2 + (bLoss - aLoss) / 2)));
      const bWin = 100 - aWin;
      w.metricsA = [aTroops, aLoss, aInfluence, aWin];
      w.metricsB = [bTroops, bLoss, bInfluence, bWin];
      return w;
    }
    wars.forEach(enrichWar);
    function metricHtml(metrics) {
      return `
        <div class="metric-grid">
          <div class="metric"><span>兵力估值</span><strong>${metrics[0]}万</strong></div>
          <div class="metric"><span>损失估值</span><strong>${metrics[1]}万</strong></div>
          <div class="metric"><span>影响力</span><strong>${metrics[2]}</strong></div>
          <div class="metric"><span>胜负指数</span><strong>${metrics[3]}</strong></div>
        </div>
        <div class="bar" aria-label="胜负指数"><i style="width:${metrics[3]}%"></i></div>
      `;
    }

    function norm(x) { return String(x).toLowerCase().replace(/\s+/g, ""); }
    function renderWars() {
      const key = norm(search.value);
      const filtered = wars.filter(w => !key || norm([w.name,w.sideA,w.sideB,w.impactA,w.impactB,w.metricsA.join(" "),w.metricsB.join(" ")].join(" ")).includes(key));
      count.textContent = `显示 ${filtered.length} / ${wars.length} 场`;
      grid.innerHTML = filtered.map(w => `
        <article class="war-card">
          <h2>${w.name}</h2>
          <div class="side-grid">
            <section class="side"><strong>${w.sideA}</strong>${metricHtml(w.metricsA)}<p>${w.impactA}</p></section>
            <section class="side"><strong>${w.sideB}</strong>${metricHtml(w.metricsB)}<p>${w.impactB}</p></section>
          </div>
        </article>
      `).join("");
    }
    search.addEventListener("input", renderWars);
    renderWars();
  </script>

  <script>
    (function(){
      var btns = document.querySelectorAll('.rm-btn');
      function setMode(mode){
        var safe = ['original','gray','white','black'].indexOf(mode)>=0 ? mode : 'original';
        if(safe==='original') document.body.removeAttribute('data-read-mode');
        else document.body.setAttribute('data-read-mode', safe);
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===safe); });
        try{ localStorage.setItem('siteReadMode', safe); }catch(e){}
      }
      var saved='original';
      try{ saved=localStorage.getItem('siteReadMode')||'original'; }catch(e){}
      setMode(saved);
      btns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
    })();
  </script>

</body>
