    const list = document.getElementById("reformList");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");

    function renderReforms(keyword) {
      const k = keyword ? keyword.toLowerCase().replace(/\s+/g, "") : "";
      const filtered = reformsData.filter(r => {
        const text = [r.year, r.era, r.title, r.background, r.pro, r.con, r.impact].join(" ");
        return !k || text.toLowerCase().includes(k);
      });

      if (filtered.length === 0) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      list.innerHTML = filtered.map((r, i) => `
        <article class="reform-card" data-index="${i}">
          <div class="reform-head" role="button" tabindex="0" aria-expanded="false">
            <span class="reform-era">${r.year}</span>
            <h3 class="reform-title">${r.title} <span style="color:var(--muted);font-size:0.85rem;font-family:ReportSans,sans-serif;">— ${r.era}</span></h3>
            <span class="reform-toggle" aria-hidden="true">▼</span>
          </div>
          <div class="reform-body">
            <div class="reform-section">
              <h4>历史背景</h4>
              <p>${r.background}</p>
            </div>
            <div class="reform-section">
              <h4>主要内容</h4>
              <ul>${r.content.map(c => `<li>${c}</li>`).join("")}</ul>
            </div>
            <div class="reform-procon">
              <div class="procon-card pro">
                <h4>变法之利</h4>
                <p>${r.pro}</p>
              </div>
              <div class="procon-card con">
                <h4>变法之弊</h4>
                <p>${r.con}</p>
              </div>
            </div>
            <div class="impact-section">
              <strong>历史影响：</strong>${r.impact}
            </div>
          </div>
        </article>
      `).join("");

      list.querySelectorAll(".reform-head").forEach(head => {
        head.addEventListener("click", () => {
          const card = head.closest(".reform-card");
          const isOpen = card.classList.toggle("open");
          head.setAttribute("aria-expanded", String(isOpen));
        });
        head.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            head.click();
          }
        });
      });
    }

    search.addEventListener("input", () => renderReforms(search.value));

    document.getElementById("expandAll").addEventListener("click", () => {
      list.querySelectorAll(".reform-card").forEach(card => {
        card.classList.add("open");
        card.querySelector(".reform-head").setAttribute("aria-expanded", "true");
      });
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      list.querySelectorAll(".reform-card").forEach(card => {
        card.classList.remove("open");
        card.querySelector(".reform-head").setAttribute("aria-expanded", "false");
      });
    });

    renderReforms();
  </script>

  <script>
    (function(){
      var btns = document.querySelectorAll('.rm-btn');
      function setMode(mode){
        var safe = ['original','gray','white','black'].indexOf(mode)>=0 ? mode : 'original';
        if(safe==='original') document.body.removeAttribute('data-read-mode');
        else document.body.setAttribute('data-read-mode', safe);
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===safe); });
        try{ localStorage.setItem('siteReadMode', safe); }catch(e){}
      }
      var saved='original';
      try{ saved=localStorage.getItem('siteReadMode')||'original'; }catch(e){}
      setMode(saved);
      btns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
    })();
  </script>
