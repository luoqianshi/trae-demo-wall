    function yearRank(label) {
      const text = String(label);
      if (text.includes("约前") || text.includes("前")) {
        const match = text.match(/前(\d+)/);
        return match ? -Number(match[1]) : -9999;
      }
      if (text.includes("世纪")) {
        const match = text.match(/(\d+)/);
        return match ? Number(match[1]) * 100 - 50 : 0;
      }
      const match = text.match(/(\d+)/);
      return match ? Number(match[1]) : 0;
    }

        "交通": ["缩短空间距离，促进贸易、迁徙和文化交流。", "交通网络也可能加速战争、疾病传播和资源掠夺。", "交通事件改变世界连接方式，也放大连接带来的风险。"],
        "航海": ["打开跨海联系，促进全球交流、贸易和地理认知。", "航海扩张常与殖民、奴役和原住民灾难相伴。", "航海事件既是全球化开端，也是殖民体系扩张的通道。"],

        "思想": ["提供解释世界和改造社会的新框架。", "思想被绝对化后可能走向教条，甚至服务压迫和冲突。", "思想事件应看它是否促进批判能力和人的自由。"],

        "安全": ["促使国家和社会重视风险防范、情报协作和公共安全。", "安全优先也可能压缩自由、制造恐惧和扩大冲突。", "安全事件需要在保护生命和维护权利之间取得平衡。"]
      };
      const picked = map[type];
      if (!picked) return base;
      return { pro: picked[0], con: picked[1], judgement: picked[2] };
    }

    function render() {
      const key = norm(search.value);
      const shown = events.filter(e => {
        const text = norm(e.join(" "));
        return (currentType === "全部" || e[3] === currentType) && (!key || text.includes(key));
      });
      empty.style.display = shown.length ? "none" : "block";
      timeline.innerHTML = shown.map((e, i) => `
        <article class="event-card">
          <button class="event-head" type="button" aria-expanded="false">
            <span class="year">${e[0]}</span>
            <span><h3>${e[1]}</h3><span class="meta">${e[2]}｜${e[3]}</span></span>
            <span class="toggle" aria-hidden="true">▼</span>
          </button>
          <div class="event-body">
            <p class="note">${e[4]}</p>
            <div class="impact"><strong>世界影响：</strong>${e[5]}</div>
            <div class="procon-grid">
              <div class="analysis-card pro"><strong>事件之利</strong><p>${analyzeEvent(e).pro}</p></div>
              <div class="analysis-card con"><strong>事件之弊</strong><p>${analyzeEvent(e).con}</p></div>
            </div>
            <div class="judgement"><strong>综合判断：</strong>${analyzeEvent(e).judgement}</div>
          </div>
        </article>
      `).join("");
      timeline.querySelectorAll(".event-head").forEach(btn => {
        btn.addEventListener("click", () => {
          const card = btn.closest(".event-card");
          const open = card.classList.toggle("open");
          btn.setAttribute("aria-expanded", String(open));
        });
      });
    }
    filters.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        currentType = btn.dataset.type;
        filters.querySelectorAll(".pill").forEach(b => b.classList.toggle("active", b === btn));
        render();
      });
    });
    search.addEventListener("input", render);
    document.getElementById("expandAll").addEventListener("click", () => {
      timeline.querySelectorAll(".event-card").forEach(card => {
        card.classList.add("open");
        card.querySelector(".event-head").setAttribute("aria-expanded", "true");
      });
    });
    document.getElementById("collapseAll").addEventListener("click", () => {
      timeline.querySelectorAll(".event-card").forEach(card => {
        card.classList.remove("open");
        card.querySelector(".event-head").setAttribute("aria-expanded", "false");
      });
    });
    render();
  </script>

  <script>
    (function(){
      var btns = document.querySelectorAll('.rm-btn');
      function setMode(mode){
        var safe = ['original','gray','white','black'].indexOf(mode)>=0 ? mode : 'original';
        if(safe==='original') document.body.removeAttribute('data-read-mode');
        else document.body.setAttribute('data-read-mode', safe);
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===safe); });
        try{ localStorage.setItem('siteReadMode', safe); }catch(e){}
      }
      var saved='original';
      try{ saved=localStorage.getItem('siteReadMode')||'original'; }catch(e){}
      setMode(saved);
      btns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
    })();
  </script>
