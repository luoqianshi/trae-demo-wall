    };
    function portraitHtml(person, className) {
      const src = portraitMap[person.name];
      if (!src) return `<span class="${className.includes("figure") ? "figure-initial" : "person-initial"}">${person.initial}</span>`;
      return `<img class="${className}" src="${src}" alt="${person.name}真实画像" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: '${className.includes("figure") ? "figure-initial" : "person-initial"}', textContent: '${person.initial}' }))" />`;
    }
    const people = peopleData.map(row => ({
      name: row[0], initial: row[1], sortYear: row[2], time: row[3], era: row[4], role: row[5], line: row[6], pro: row[7], con: row[8]
    })).sort((a, b) => a.sortYear - b.sortYear || a.initial.localeCompare(b.initial) || a.name.localeCompare(b.name, "zh-CN"));
    const search = document.getElementById("peopleSearch");
    const eraFilter = document.getElementById("eraFilter");
    const grid = document.getElementById("peopleGrid");
    const count = document.getElementById("peopleCount");
    document.getElementById("peopleTotal").textContent = people.length;
    const eras = ["全部时代", ...Array.from(new Set(people.map(p => p.era)))];
    eraFilter.innerHTML = eras.map(era => `<option value="${era}">${era}</option>`).join("");
    function normalized(text) { return String(text).toLowerCase().replace(/\s+/g, ""); }
    function renderPeople() {
      const keyword = normalized(search.value);
      const era = eraFilter.value;
      const filtered = people.filter(p => {
        const haystack = normalized([p.name, p.initial, p.time, p.era, p.role, p.line, p.pro, p.con].join(" "));
        return (era === "全部时代" || p.era === era) && (!keyword || haystack.includes(keyword));
      });
      count.textContent = `显示 ${filtered.length} / ${people.length} 位`;
      grid.innerHTML = filtered.map(p => `
        <article class="person-card">
          <div class="person-head">
            ${portraitHtml(p, "person-portrait")}
            <div>
              <h2>${p.name}</h2>
              <p class="person-meta">${p.time}｜${p.era}｜${p.role}</p>
            </div>
          </div>
          <p class="person-line">${p.line}</p>
          <div class="mini-procon">
            <section class="good"><h3>人物之利</h3><p>${p.pro}</p></section>
            <section class="bad"><h3>人物之弊</h3><p>${p.con}</p></section>
          </div>
        </article>
      `).join("");
    }
    function renderFigureMap() {
      const figureGrid = document.getElementById("figureGrid");
      figureGrid.innerHTML = people.map(p => `
        <button class="figure-card" type="button" data-name="${p.name}" title="${p.name}：${p.role}">
          ${portraitHtml(p, "figure-portrait")}
          <span>
            <strong>${p.name}</strong>
            <span>${p.time}｜${p.era}</span>
            <span>${p.role}</span>
          </span>
        </button>
      `).join("");
      figureGrid.querySelectorAll(".figure-card").forEach(btn => {
        btn.addEventListener("click", () => {
          search.value = btn.dataset.name;
          renderPeople();
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }
    search.addEventListener("input", renderPeople);
    eraFilter.addEventListener("change", renderPeople);
    renderFigureMap();
    renderPeople();
  </script>

  <script>
    (function(){
      var btns = document.querySelectorAll('.rm-btn');
      function setMode(mode){
        var safe = ['original','gray','white','black'].indexOf(mode)>=0 ? mode : 'original';
        if(safe==='original') document.body.removeAttribute('data-read-mode');
        else document.body.setAttribute('data-read-mode', safe);
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===safe); });
        try{ localStorage.setItem('siteReadMode', safe); }catch(e){}
      }
      var saved='original';
      try{ saved=localStorage.getItem('siteReadMode')||'original'; }catch(e){}
      setMode(saved);
      btns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
    })();
  </script>
