<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>慢病忌口助手 - 吃前30s，全家都能吃</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 免责声明弹窗 -->
    <div id="disclaimer-modal" class="modal hidden">
        <div class="modal-content">
            <h3>⚠️ 重要提示</h3>
            <p>本工具仅供参考，不构成医疗建议。如有不适或指标异常，请及时就医。</p>
            <button type="button" onclick="app.closeDisclaimer()" class="btn-primary">我知道了</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div id="app">
        <!-- 页面头部 -->
        <header class="app-header">
            <div class="header-inner">
                <h1>🍽️ 慢病忌口助手</h1>
                <p class="brand-tag">忌口雷达 · 家庭版</p>
                <p class="subtitle">吃前30s，全家都能吃</p>
                <button type="button" id="elder-toggle" class="elder-toggle" onclick="app.toggleElderMode()">
                    <span class="elder-icon">A</span>
                    <span class="elder-label">长辈模式</span>
                </button>
            </div>
        </header>

        <!-- 页面内容 -->
        <main id="main-content">
            <!-- 首页 -->
            <section id="home-page" class="page active">
                <div class="card welcome-card">
                    <h2>欢迎使用</h2>
                    <p>建立健康档案，快速了解家人饮食禁忌</p>
                    <div class="action-buttons">
                        <button type="button" onclick="app.navigateTo('health-card')" class="btn-primary">
                            🏥 管理健康卡
                        </button>
                        <button type="button" onclick="app.navigateTo('analyze')" class="btn-secondary">
                            🔍 开始分析
                        </button>
                    </div>
                </div>

                <!-- 快速开始 -->
                <div class="card quick-start">
                    <h3>快速开始</h3>
                    <div class="steps">
                        <div class="step">
                            <span class="step-num">1</span>
                            <span>创建健康卡</span>
                        </div>
                        <div class="step">
                            <span class="step-num">2</span>
                            <span>选择分析对象</span>
                        </div>
                        <div class="step">
                            <span class="step-num">3</span>
                            <span>输入食物</span>
                        </div>
                        <div class="step">
                            <span class="step-num">4</span>
                            <span>查看建议</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 健康卡管理页 -->
            <section id="health-card-page" class="page">
                <div class="page-header">
                    <button type="button" onclick="app.navigateTo('home')" class="btn-back">← 返回</button>
                    <h2>健康卡管理</h2>
                </div>

                <!-- 个人健康卡 -->
                <div class="card">
                    <div class="card-header">
                        <h3>👤 个人健康卡</h3>
                        <button type="button" onclick="app.showPersonForm()" class="btn-small">+ 新建</button>
                    </div>
                    <div id="person-list" class="list">
                        <!-- 动态渲染 -->
                    </div>
                </div>

                <!-- 家庭组 -->
                <div class="card">
                    <div class="card-header">
                        <h3>👨‍👩‍👧‍👦 家庭组</h3>
                        <button type="button" onclick="app.showFamilyForm()" class="btn-small">+ 新建</button>
                    </div>
                    <div id="family-list" class="list">
                        <!-- 动态渲染 -->
                    </div>
                </div>
            </section>

            <!-- 个人健康卡表单 -->
            <section id="person-form-page" class="page">
                <div class="page-header">
                    <button type="button" onclick="app.navigateTo('health-card')" class="btn-back">← 返回</button>
                    <h2 id="person-form-title">新建个人健康卡</h2>
                </div>
                <form id="person-form" class="card form-card" onsubmit="app.savePerson(event)">
                    <input type="hidden" id="person-id">
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" id="person-name" required placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label>年龄</label>
                        <input type="number" id="person-age" min="1" max="120" placeholder="请输入年龄">
                    </div>
                    <div class="form-group">
                        <label>血脂</label>
                        <select id="person-lipid">
                            <option value="">请选择</option>
                            <option value="normal">正常</option>
                            <option value="high-normal">偏高</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>血压</label>
                        <select id="person-blood-pressure">
                            <option value="">请选择</option>
                            <option value="normal">正常</option>
                            <option value="high-normal">偏高</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>血糖</label>
                        <select id="person-glucose">
                            <option value="">请选择</option>
                            <option value="normal">正常</option>
                            <option value="high-normal">偏高</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>尿酸</label>
                        <select id="person-uric-acid">
                            <option value="">请选择</option>
                            <option value="normal">正常</option>
                            <option value="high-normal">偏高</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>症状描述</label>
                        <textarea id="person-symptoms" rows="3" placeholder="请描述其他症状或注意事项"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">保存</button>
                        <button type="button" onclick="app.navigateTo('health-card')" class="btn-secondary">取消</button>
                    </div>
                </form>
            </section>

            <!-- 家庭组表单 -->
            <section id="family-form-page" class="page">
                <div class="page-header">
                    <button type="button" onclick="app.navigateTo('health-card')" class="btn-back">← 返回</button>
                    <h2 id="family-form-title">新建家庭组</h2>
                </div>
                <form id="family-form" class="card form-card" onsubmit="app.saveFamily(event)">
                    <input type="hidden" id="family-id">
                    <div class="form-group">
                        <label>家庭名称 <span class="required">*</span></label>
                        <input type="text" id="family-name" required placeholder="如：爷爷奶奶家">
                    </div>
                    <div class="form-group">
                        <label>选择成员</label>
                        <div id="family-member-select" class="member-select">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">保存</button>
                        <button type="button" onclick="app.navigateTo('health-card')" class="btn-secondary">取消</button>
                    </div>
                </form>
            </section>

            <!-- 分析页 -->
            <section id="analyze-page" class="page">
                <div class="page-header">
                    <button type="button" onclick="app.navigateTo('home')" class="btn-back">← 返回</button>
                    <h2>饮食分析</h2>
                </div>

                <!-- 选择分析对象 -->
                <div class="card">
                    <h3>选择分析对象</h3>
                    <div class="tab-switch">
                        <button type="button" onclick="app.switchAnalyzeMode('person')" id="tab-person" class="tab active">单人</button>
                        <button type="button" onclick="app.switchAnalyzeMode('family')" id="tab-family" class="tab">家庭组</button>
                    </div>
                    <div id="analyze-target-select" class="target-select">
                        <!-- 动态渲染 -->
                    </div>
                </div>

                <!-- 食物输入 -->
                <div class="card">
                    <h3>输入食物</h3>
                    <div class="input-methods">
                        <div class="input-method" onclick="app.selectInputMethod('image', this)">
                            <span class="icon">📷</span>
                            <span>图片上传</span>
                        </div>
                        <div class="input-method" onclick="app.selectInputMethod('voice', this)">
                            <span class="icon">🎤</span>
                            <span>语音输入</span>
                        </div>
                        <div class="input-method active" onclick="app.selectInputMethod('text', this)">
                            <span class="icon">⌨️</span>
                            <span>文字输入</span>
                        </div>
                    </div>

                    <!-- 图片上传 -->
                    <div id="input-image" class="input-area hidden">
                        <input type="file" id="image-file" accept="image/*" onchange="app.handleImageUpload(event)">
                        <div class="upload-area" onclick="document.getElementById('image-file').click()">
                            <span class="upload-icon">📤</span>
                            <p>点击上传食物图片</p>
                            <p class="hint">支持 JPG、PNG 格式</p>
                        </div>
                        <div id="image-preview" class="preview hidden"></div>
                    </div>

                    <!-- 语音输入 -->
                    <div id="input-voice" class="input-area hidden">
                        <button type="button" onclick="app.startVoiceInput()" id="voice-btn" class="voice-btn">
                            <span class="icon">🎤</span>
                            <span id="voice-text">按住说话</span>
                        </button>
                        <div id="voice-result" class="voice-result"></div>
                    </div>

                    <!-- 文字输入 -->
                    <div id="input-text" class="input-area">
                        <textarea id="food-text" rows="3" placeholder="请输入食物名称，如：虾滑、牛肉卷、青菜"></textarea>
                    </div>

                    <button type="button" onclick="app.startAnalyze()" class="btn-primary btn-full">开始分析</button>
                </div>
            </section>

            <!-- 分析结果页 -->
            <section id="result-page" class="page">
                <div class="page-header">
                    <button type="button" onclick="app.navigateTo('analyze')" class="btn-back">← 返回</button>
                    <h2>分析结果</h2>
                </div>

                <!-- 分析对象信息 -->
                <div id="result-target-info" class="target-info"></div>

                <!-- 食物卡片列表 -->
                <div id="result-cards" class="result-cards"></div>

                <!-- 结果汇总 -->
                <div id="result-summary" class="card summary-card"></div>

                <!-- 朗读按钮 -->
                <button type="button" id="play-all-btn" onclick="app.playAllReadings()" class="btn-primary btn-full">
                    🎙️ 播放全部朗读
                </button>

                <!-- 重新分析 -->
                <button type="button" onclick="app.navigateTo('analyze')" class="btn-secondary btn-full">
                    重新分析
                </button>
            </section>
        </main>

        <!-- 页面底部 -->
        <footer class="app-footer">
            <p>⚠️ 本工具仅供参考，不构成医疗建议</p>
        </footer>
    </div>

    <!-- 加载脚本 -->
    <script src="js/storage.js"></script>
    <script src="js/llm-client.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
