<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>租房避坑雷达 - 创意产物</title>
<style>
:root{--bg:#0a0a1a;--bg2:#0f0f23;--bg3:#16162e;--ink:#e2e8f0;--muted:rgba(226,232,240,0.5);--rule:rgba(255,255,255,0.06);--accent:#a78bfa;--accent2:#c084fc;--card:rgba(255,255,255,0.025);--danger:#fb7185;--warn:#fbbf24;--safe:#34d399;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;overflow-x:hidden}
.app-frame{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule);overflow:hidden}
.status-bar{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}
.nav-bar{display:flex;align-items:center;justify-content:center;padding:12px 16px;border-bottom:1px solid var(--rule);position:relative}
.nav-title{font-weight:700;font-size:16px}
.nav-back{position:absolute;left:16px;font-size:18px;cursor:pointer;color:var(--muted)}
.page{display:none;min-height:calc(100vh - 80px);padding-bottom:80px}
.page.active{display:block;animation:fadeIn 0.35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:var(--bg2);border-top:1px solid var(--rule);z-index:100}
.tab-item{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--muted);cursor:pointer;transition:all 0.2s}
.tab-item.active{color:var(--accent)}
.tab-item .tab-icon{font-size:20px;display:block;margin-bottom:2px}

/* Home */
.home-header{text-align:center;padding:2.5rem 1.5rem 1.5rem}
.home-icon{font-size:3.5rem;margin-bottom:0.5rem}
.home-title{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--ink),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{color:var(--muted);font-size:0.85rem;margin-top:0.5rem}

.upload-area{margin:1rem 1.5rem;padding:2rem;border:2px dashed var(--rule);border-radius:16px;text-align:center;background:var(--card);cursor:pointer;transition:all 0.3s}
.upload-area:hover{border-color:var(--accent)}
.upload-area .upload-icon{font-size:2.5rem;margin-bottom:0.5rem}
.upload-area .upload-text{color:var(--muted);font-size:0.85rem}
.upload-area .upload-hint{font-size:0.75rem;color:var(--muted);margin-top:0.5rem;opacity:0.7}

.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.8rem;margin:1rem 1.5rem}
.feature-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1rem;text-align:center;cursor:pointer;transition:all 0.2s}
.feature-card:hover{border-color:var(--accent)}
.feature-card .feature-icon{font-size:1.8rem;margin-bottom:0.3rem}
.feature-card .feature-title{font-size:0.8rem;font-weight:600}
.feature-card .feature-desc{font-size:0.7rem;color:var(--muted);margin-top:0.2rem}

/* Checklist */
.check-item{display:flex;align-items:flex-start;gap:0.8rem;padding:1rem;margin:0 1rem;background:var(--card);border:1px solid var(--rule);border-radius:12px;margin-bottom:0.6rem;cursor:pointer;transition:all 0.2s}
.check-item:hover{border-color:var(--accent)}
.check-item .check-box{width:22px;height:22px;border:2px solid var(--rule);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all 0.2s}
.check-item.checked .check-box{background:var(--accent);border-color:var(--accent)}
.check-item .check-content{flex:1}
.check-item .check-title{font-weight:600;font-size:0.9rem}
.check-item .check-desc{font-size:0.8rem;color:var(--muted);margin-top:0.2rem}
.check-item .risk-tag{font-size:0.65rem;padding:2px 8px;border-radius:20px;margin-top:0.4rem;display:inline-block}
.risk-high{background:rgba(251,113,133,0.15);color:var(--danger)}
.risk-mid{background:rgba(251,191,36,0.15);color:var(--warn)}
.risk-low{background:rgba(52,211,153,0.15);color:var(--safe)}

/* Report */
.report-card{margin:1rem;padding:1.2rem;background:var(--card);border:1px solid var(--rule);border-radius:16px}
.report-score{text-align:center;margin-bottom:1.5rem}
.report-score .score-num{font-size:3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.report-score .score-label{font-size:0.8rem;color:var(--muted)}
.score-ring{width:120px;height:120px;margin:0 auto;border-radius:50%;border:6px solid var(--bg3);border-top-color:var(--accent);display:flex;align-items:center;justify-content:center;animation:spinScore 1.5s ease forwards}
@keyframes spinScore{from{transform:rotate(-90deg)}to{transform:rotate(0deg)}}

.risk-list .risk-item{display:flex;align-items:center;gap:0.8rem;padding:0.8rem 0;border-bottom:1px solid var(--rule)}
.risk-list .risk-item:last-child{border-bottom:none}
.risk-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.risk-text{flex:1;font-size:0.9rem}
.risk-level{font-size:0.75rem;padding:2px 10px;border-radius:20px}

/* Chat bubble for negotiation */
.chat-bubble{background:var(--bg3);border-radius:12px;padding:1rem;margin:0.5rem 1rem;font-size:0.9rem;position:relative}
.chat-bubble::before{content:"💡";position:absolute;left:-8px;top:-8px;font-size:1.2rem}
.chat-bubble .chat-title{font-weight:700;color:var(--accent);margin-bottom:0.3rem;font-size:0.8rem}

/* Buttons */
.btn-primary{display:block;width:calc(100% - 2rem);margin:1rem auto;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-align:center}
.btn-primary:hover{opacity:0.9;transform:translateY(-2px)}
.btn-secondary{display:block;width:calc(100% - 2rem);margin:0.5rem auto;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:12px;font-size:0.9rem;cursor:pointer;transition:all 0.2s;text-align:center}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin:1rem}
.photo-cell{aspect-ratio:1;background:var(--bg3);border-radius:10px;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.photo-cell:hover{border-color:var(--accent)}
.photo-cell.has-photo{background:linear-gradient(135deg,#1a1a3a,#2a1a4a);border-color:var(--accent)}
.photo-cell .photo-label{position:absolute;bottom:4px;left:4px;font-size:0.6rem;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px}

/* Scan animation */
.scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 10px var(--accent);animation:scan 2s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{top:0}50%{top:100%}100%{top:0}}
.scanning{position:relative;overflow:hidden}

.section-title{font-size:1.1rem;font-weight:700;margin:1.2rem 1rem 0.6rem}
</style>
</head>
