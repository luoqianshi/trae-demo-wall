<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>租房避坑雷达 - 首页</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/home.css">
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>9:41</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-title">租房避坑雷达</span></div>

  <div class="content-wrap">
  <div class="home-header">
    <div class="home-icon">🏠</div>
    <div class="home-title">租房避坑雷达</div>
    <div class="home-sub">AI 智能验房，让中介不敢再坑你</div>
  </div>

  <div class="upload-area" onclick="goPage('upload.html')">
    <div class="upload-icon">📷</div>
    <div class="upload-text">拍照上传房间照片</div>
    <div class="upload-hint">支持客厅、卧室、厨房、卫生间</div>
  </div>

  <div class="feature-grid">
    <div class="feature-card" onclick="goPage('checklist.html')">
      <div class="feature-icon">📋</div>
      <div class="feature-title">验房清单</div>
      <div class="feature-desc">逐项排查风险点</div>
    </div>
    <div class="feature-card" onclick="goPage('report.html')">
      <div class="feature-icon">📊</div>
      <div class="feature-title">AI 报告</div>
      <div class="feature-desc">智能风险评估</div>
    </div>
    <div class="feature-card" onclick="goPage('chat.html')">
      <div class="feature-icon">💬</div>
      <div class="feature-title">谈判话术</div>
      <div class="feature-desc">砍价与维权指南</div>
    </div>
    <div class="feature-card" onclick="goPage('map.html')">
      <div class="feature-icon">🗺️</div>
      <div class="feature-title">踩坑地图</div>
      <div class="feature-desc">真实房源评价</div>
    </div>
  </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item" onclick="goPage('checklist.html')">
      <span class="tab-icon">📋</span>
      <span>清单</span>
    </div>
    <div class="tab-item" onclick="goPage('report.html')">
      <span class="tab-icon">📊</span>
      <span>报告</span>
    </div>
    <div class="tab-item" onclick="goPage('chat.html')">
      <span class="tab-icon">💬</span>
      <span>话术</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/home.js"></script>
</body>
</html>
