<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindWeave · 知识图谱笔记 Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #F7F5FF;
    --bg2: #FFFFFF;
    --ink: #1B1733;
    --muted: #625B7A;
    --rule: #DDD6F3;
    --accent: #5B42D6;
    --accent-light: #ECE7FF;
    --accent2: #18A999;
    --accent2-light: #E8FAF7;
    --warning: #F59E0B;
    --warning-light: #FEF3C7;
    --danger: #EF4444;
    --danger-light: #FEE2E2;
    --shadow: 0 18px 50px rgba(48, 35, 120, 0.12);
    --shadow-sm: 0 4px 16px rgba(48, 35, 120, 0.08);
    --radius: 16px;
    --radius-lg: 24px;
    --font: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-scale: 1;
    --fs-xs: calc(11px * var(--font-scale));
    --fs-sm: calc(12px * var(--font-scale));
    --fs-base: calc(13px * var(--font-scale));
    --fs-md: calc(14px * var(--font-scale));
    --fs-lg: calc(16px * var(--font-scale));
    --fs-xl: calc(18px * var(--font-scale));
    --fs-2xl: calc(20px * var(--font-scale));
    --fs-3xl: calc(24px * var(--font-scale));
    --fs-4xl: calc(32px * var(--font-scale));
    --fs-5xl: calc(48px * var(--font-scale));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app-container {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    overflow: hidden;
  }

  /* ===== 顶部工具栏 ===== */
  .toolbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--rule);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    z-index: 100;
  }

  .toolbar .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 12px;
    margin-right: 4px;
    border-right: 1px solid var(--rule);
    font-weight: 900;
    font-size: var(--fs-xl);
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .toolbar .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-light);
  }

  .tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s ease;
    font-size: var(--fs-xl);
  }

  .tool-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    transform: scale(1.05);
  }

  .tool-btn.active {
    background: var(--accent);
    color: white;
  }

  .tool-divider {
    width: 1px;
    height: 24px;
    background: var(--rule);
    margin: 0 4px;
  }

  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(48, 35, 120, 0.05);
    padding: 4px;
    border-radius: 12px;
  }

  .zoom-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: var(--fs-md);
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .zoom-btn:hover {
    background: rgba(48, 35, 120, 0.1);
    color: var(--accent);
  }

  .zoom-value {
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--muted);
    min-width: 48px;
    text-align: center;
  }

  .connect-dropdown {
    position: relative;
    display: inline-block;
  }

  .connect-submenu {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 6px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
    box-shadow: var(--shadow-sm);
    z-index: 100;
    flex-direction: column;
    align-items: center;
  }

  .connect-dropdown:hover .connect-submenu,
  .connect-submenu.show {
    display: flex;
  }

  .submenu-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: var(--fs-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    color: var(--muted);
  }

  .submenu-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    transform: scale(1.1);
  }

  .submenu-btn.active {
    background: var(--accent-light);
    color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .mode-switch {
    display: flex;
    background: var(--bg);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .mode-btn {
    padding: 6px 14px;
    border: none;
    background: transparent;
    border-radius: 999px;
    cursor: pointer;
    font-size: var(--fs-base);
    font-weight: 500;
    color: var(--muted);
    transition: all 0.25s ease;
    font-family: var(--font);
  }

  .mode-btn.active {
    background: white;
    color: var(--accent);
    box-shadow: var(--shadow-sm);
    font-weight: 700;
  }

  .confirm-btn {
    margin-left: 8px;
    padding: 9px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #7C3AED);
    color: white;
    font-weight: 700;
    font-size: var(--fs-md);
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font);
    box-shadow: 0 4px 14px rgba(91, 66, 214, 0.3);
  }

  .confirm-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(91, 66, 214, 0.4);
  }

  .confirm-btn:active {
    transform: translateY(0);
  }

  /* ===== 画布区域 ===== */
  .canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 20% 20%, rgba(91, 66, 214, 0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(24, 169, 153, 0.04), transparent 40%),
      var(--bg);
    cursor: grab;
    overflow: hidden;
  }

  .canvas-container.grabbing { cursor: grabbing; }

  #graph-svg {
    width: 100%;
    height: 100%;
  }

  .grid-pattern { opacity: 0.5; }

  /* ===== 节点样式 ===== */
  .node-group {
    cursor: move;
    transition: filter 0.2s ease;
  }

  .node-group:hover { filter: drop-shadow(0 8px 24px rgba(48, 35, 120, 0.2)); }

  .node-group.selected .node-shape {
    stroke: var(--accent);
    stroke-width: 3;
    stroke-dasharray: 6 3;
    animation: dash 1s linear infinite;
  }

  @keyframes dash {
    to { stroke-dashoffset: -9; }
  }

  .node-group.weak .node-shape {
    stroke: var(--warning) !important;
    stroke-width: 3 !important;
  }

  .node-group.weak .weak-badge {
    display: block;
  }

  .node-shape {
    transition: all 0.3s ease;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08));
  }

  .node-text-main {
    font-family: var(--font);
    font-weight: 700;
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(0,0,0,0.2);
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .node-text-sub {
    font-family: var(--font);
    fill: rgba(255,255,255,0.85);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .node-icon-custom {
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .weak-badge {
    display: none;
    animation: weakPulse 1.5s ease-in-out infinite;
  }

  @keyframes weakPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }

  /* ===== 连线样式 - 树枝 ===== */
  .edge-branch {
    fill: none;
    stroke-linecap: round;
    transition: stroke-width 0.2s, stroke-opacity 0.2s;
    cursor: pointer;
    filter: url(#branch-shadow);
  }

  .edge-branch:hover {
    filter: drop-shadow(0 0 8px currentColor) url(#branch-shadow);
  }

  .edge-branch-part {
    fill: none;
    stroke-linecap: round;
    transition: stroke-width 0.2s, stroke-opacity 0.2s;
  }

  /* ===== 连线样式 - 梯子 ===== */
  .edge-ladder {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    cursor: pointer;
    transition: stroke-width 0.2s;
  }

  .edge-ladder:hover {
    stroke-width: 1.5 !important;
    stroke-opacity: 0.9 !important;
  }

  .ladder-rungs line {
    transition: stroke-width 0.2s, stroke-opacity 0.2s;
  }

  .ladder-rungs:hover line {
    stroke-width: 1.5 !important;
    stroke-opacity: 0.9 !important;
  }

  .edge-group.selected .edge-branch-part {
    stroke-opacity: 1 !important;
    filter: drop-shadow(0 0 4px currentColor);
  }

  .edge-group.selected .edge-ladder {
    stroke-opacity: 1 !important;
    stroke-width: 1.5 !important;
    filter: drop-shadow(0 0 4px currentColor);
  }

  .edge-group.selected .ladder-rungs line {
    stroke-opacity: 1 !important;
    stroke-width: 1.5 !important;
  }

  /* ===== 控制点样式 ===== */
  .edge-control-point {
    cursor: move;
    transition: transform 0.1s;
    opacity: 0;
    pointer-events: none;
  }

  .edge-group.selected .edge-control-point {
    opacity: 1;
    pointer-events: auto;
  }

  .edge-control-point:hover {
    transform: scale(1.5);
  }

  .edge-control-point circle {
    transition: all 0.2s;
  }

  .edge-control-point:hover circle {
    fill: var(--accent-light);
    stroke-width: 2;
  }

  .control-line {
    stroke: var(--muted);
    stroke-width: 1;
    stroke-dasharray: 3 3;
    stroke-opacity: 0.4;
    pointer-events: none;
    opacity: 0;
  }

  .edge-group.selected .control-line {
    opacity: 1;
  }

  .edge-label {
    font-family: var(--font);
    font-size: var(--fs-xs);
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: white;
    stroke-width: 4;
    stroke-linejoin: round;
  }

  .temp-edge {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 5 5;
    stroke-opacity: 0.6;
    pointer-events: none;
  }

  /* ===== 右侧面板 ===== */
  .side-panel {
    position: fixed;
    top: 80px;
    right: 20px;
    width: 340px;
    max-height: calc(100vh - 120px);
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 90;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
  }

  .side-panel.hidden {
    transform: translateX(380px);
    opacity: 0;
    pointer-events: none;
  }

  .panel-header {
    padding: 18px 20px 14px;
    background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
    border-bottom: 1px solid var(--rule);
  }

  .panel-header h3 {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .panel-header p {
    font-size: var(--fs-sm);
    color: var(--muted);
  }

  .panel-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb {
    background: var(--rule);
    border-radius: 3px;
  }

  /* ===== 追问卡片 ===== */
  .question-card {
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .question-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .question-card.answered { opacity: 0.6; }

  .q-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: var(--fs-md);
    margin-bottom: 8px;
  }

  .q-text {
    font-size: var(--fs-base);
    line-height: 1.6;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .q-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .q-tag {
    font-size: var(--fs-xs);
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    font-weight: 500;
  }

  .q-tag.structure { background: #DBEAFE; color: #1D4ED8; }
  .q-tag.knowledge { background: var(--accent2-light); color: #065F46; }
  .q-tag.relation { background: var(--warning-light); color: #92400E; }

  /* ===== 复习题目 ===== */
  .quiz-card {
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .quiz-question {
    font-size: var(--fs-md);
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quiz-option {
    padding: 10px 14px;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    font-size: var(--fs-base);
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--bg);
  }

  .quiz-option:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .quiz-option.correct {
    border-color: var(--accent2);
    background: var(--accent2-light);
    color: #065F46;
    font-weight: 600;
  }

  .quiz-option.wrong {
    border-color: var(--danger);
    background: var(--danger-light);
    color: #991B1B;
  }

  .quiz-feedback {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    font-size: var(--fs-sm);
    line-height: 1.5;
    display: none;
  }

  .quiz-feedback.show { display: block; }
  .quiz-feedback.correct { background: var(--accent2-light); color: #065F46; }
  .quiz-feedback.wrong { background: var(--danger-light); color: #991B1B; }

  /* ===== 节点属性面板 ===== */
  .prop-group {
    margin-bottom: 16px;
  }

  .prop-label {
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .prop-input {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    font-size: var(--fs-base);
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    transition: border-color 0.2s;
  }

  .prop-input:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }

  .prop-textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    font-size: var(--fs-base);
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    resize: vertical;
    min-height: 60px;
    transition: border-color 0.2s;
  }

  .prop-textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }

  .color-picker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }

  .color-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .color-btn:hover { transform: scale(1.15); }
  .color-btn.active { border-color: var(--ink); }
  .color-btn.active::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid var(--accent);
  }

  .shape-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .shape-btn {
    padding: 10px 4px;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    background: var(--bg);
    font-size: var(--fs-2xl);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .shape-btn:hover { border-color: var(--accent); }
  .shape-btn.active {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .font-picker {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .font-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .font-btn:hover { border-color: var(--accent); background: var(--hover); }
  .font-btn.active { border-color: var(--accent); background: rgba(91, 66, 214, 0.1); }

  .font-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 36px;
    color: var(--ink);
    line-height: 1;
    font-family: var(--font);
    flex-shrink: 0;
  }

  .font-label {
    font-size: var(--fs-base);
    color: var(--muted);
    font-weight: 500;
  }

  .icon-picker {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    max-height: 120px;
    overflow-y: auto;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    background: var(--bg);
    font-size: var(--fs-lg);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover { border-color: var(--accent); transform: scale(1.1); }
  .icon-btn.active {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .delete-btn {
    width: 100%;
    padding: 10px;
    border: 1.5px solid #FECACA;
    border-radius: 10px;
    background: #FEF2F2;
    color: #DC2626;
    font-size: var(--fs-base);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
  }

  .delete-btn:hover {
    background: #FEE2E2;
    border-color: #FCA5A5;
  }

  /* ===== 底部状态栏 ===== */
  .status-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: var(--fs-sm);
    color: var(--muted);
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent2);
  }

  .status-divider {
    width: 1px;
    height: 14px;
    background: var(--rule);
  }

  /* ===== 图层切换按钮 ===== */
  .layer-toggle {
    position: fixed;

  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(91,66,214,0.35); }

  /* ===== 详细层样式 ===== */
  .detail-layer {

  @keyframes detailAppear {

  .detail-box {
    border-radius: 12px;

  .detail-box::before {

  .detail-box.arrow-left::before {

  }

  .detail-box.arrow-top::before {

  .detail-box.arrow-bottom::before {

  .detail-box.draft {

  .detail-box.material .detail-close:hover { background: rgba(24, 169, 153, 0.25); }

  .detail-textarea {

  }
</style>
</head>
<body>
<div id="app-container" class="app-container">

<!-- 欢迎弹窗 -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-modal">
    <div class="welcome-icon">🕸️</div>
    <h2>欢迎来到 MindWeave</h2>
    <p>一款面向课后自主整理与复习的网络状笔记工具。先亲手搭建知识图谱，再让 AI 帮你发现理解漏洞。</p>
    <div class="welcome-steps">
      <div class="welcome-step">
        <div class="step-num">1</div>
        <div class="step-text"><strong>自由搭建</strong><br><span>双击画布创建节点，拖拽移动，连接节点形成知识图谱</span></div>
      </div>
      <div class="welcome-step">
        <div class="step-num">2</div>
        <div class="step-text"><strong>AI 复检</strong><br><span>点击"确认完成"，AI 会分析你的知识结构并提出追问</span></div>
      </div>
      <div class="welcome-step">
        <div class="step-num">3</div>
        <div class="step-text"><strong>复习考察</strong><br><span>切换到复习模式，检验你对知识关系的理解程度</span></div>
      </div>
    </div>
    <button class="start-btn" onclick="startApp()">开始探索 →</button>
  </div>
</div>

<!-- 顶部工具栏 -->
<div class="toolbar">
  <div class="logo"><div class="logo-dot"></div>MindWeave</div>
  <button class="tool-btn" id="btn-add" title="添加节点" onclick="addNodeAtCenter()">＋</button>
  <div class="connect-dropdown">
    <button class="tool-btn" id="btn-connect" title="连接模式" onclick="toggleConnectMode()">🔗</button>
    <div class="connect-submenu" id="connectSubmenu">
      <button class="submenu-btn active" id="btn-edge-branch" onclick="setEdgeStyle('branch')" title="树枝线条">🌿</button>
      <button class="submenu-btn" id="btn-edge-ladder" onclick="setEdgeStyle('ladder')" title="梯子线条">🪜</button>
    </div>
  </div>
  <div class="tool-divider"></div>
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="build" onclick="switchMode('build')">搭建</button>
    <button class="mode-btn" data-mode="review" onclick="switchMode('review')">复检</button>
    <button class="mode-btn" data-mode="quiz" onclick="switchMode('quiz')">复习</button>
  </div>
  <button class="confirm-btn" id="confirmBtn" onclick="confirmAndReview()">✨ 确认完成，AI 复检</button>
  <div class="tool-divider"></div>
  <div class="zoom-controls">

    <div class="layer-indicator"></div>全部显示
  </button>
  <button class="layer-btn" onclick="toggleLayer('title')">
    <div class="layer-indicator"></div>标题层
  </button>
</div>

<!-- 画布 -->
<div class="canvas-container" id="canvasContainer">
  <svg id="graph-svg">
    <defs>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse" class="grid-pattern">
        <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#DDD6F3" stroke-width="1"/>
      </pattern>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#5B42D6" fill-opacity="0.5"/>
      </marker>
      <marker id="arrowhead-bridge" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#18A999" fill-opacity="0.6"/>
      </marker>
      <linearGradient id="branch-gradient-template" x1="0%" y1="0%" x2="100%" y2="0%">

<div class="status-bar">
  <div class="status-item"><div class="status-dot"></div><span id="modeLabel">搭建模式</span></div>
  <div class="status-divider"></div>
  <div class="status-item"><span>节点：<strong id="nodeCount">0</strong></span></div>
  <div class="status-item"><span>连线：<strong id="edgeCount">0</strong></span></div>

</div>

<script>
// ==================== 状态管理 ====================
const state = {
  nodes: [], edges: [],
  selectedNodeId: null, selectedEdgeId: null, mode: 'build', connectMode: false, connectFromId: null,
  zoom: 1, panX: 0, panY: 0,
  isDragging: false, isPanning: false,
  dragNodeId: null, dragOffset: { x: 0, y: 0 },
  panStart: { x: 0, y: 0 },
  reviewQuestions: [], answeredQuestions: new Set(),
  quizCurrent: 0, quizQuestions: [], quizScore: 0,
  weakNodeIds: new Set(),
  currentLayer: 'all',
  edgeStyle: 'branch',
  isDraggingControlPoint: false,
  draggingControlPoint: { edgeId: null, index: null },
  fontScale: 1,
  expandedDetails: {}
};

let nodeIdCounter = 0, edgeIdCounter = 0;

const nodeColors = ['#5B42D6','#18A999','#3B82F6','#EC4899','#F59E0B','#8B5CF6','#14B8A6','#EF4444','#06B6D4','#F97316','#84CC16','#A855F7','#6366F1','#D946EF','#10B981','#7C3AED','#0EA5E9','#FB923C','#E11D48','#65A30D'];

function getNodeLayer(node) {
  if (node.type === 'topic') return 0;
  if (node.type === 'concept') return 1;
  return 2;
}

function getNodeRadius(layer, totalInLayer, index) {
  const baseR = layer === 0 ? 0 : layer === 1 ? 160 : 280;
  if (layer === 0) return { r: 0, angle: 0 };
  const angle = (2 * Math.PI / totalInLayer) * index - Math.PI / 2;
  return { r: baseR, angle };
}

function applyRadialLayout() {
  const layers = [[], [], []];
  state.nodes.forEach(n => {
    const layer = getNodeLayer(n);
    layers[layer].push(n);
  });

  const svg = document.getElementById('graph-svg');
  const cx = svg.clientWidth / 2, cy = svg.clientHeight / 2;

  layers.forEach((layerNodes, layerIdx) => {
    layerNodes.forEach((node, idx) => {
      const { r, angle } = getNodeRadius(layerIdx, layerNodes.length, idx);
      if (layerIdx === 0) {
        node.x = cx; node.y = cy;
      } else {
        node.x = cx + r * Math.cos(angle);
        node.y = cy + r * Math.sin(angle);
      }
    });
  });
}

function applyRadialLayoutWithOffset() {
  const svg = document.getElementById('graph-svg');
  const cx = svg.clientWidth / 2, cy = svg.clientHeight / 2;
  
  const layers = [[], [], []];
  state.nodes.forEach(n => {
    layers[getNodeLayer(n)].push(n);
  });

  layers.forEach((layerNodes, layerIdx) => {
    layerNodes.forEach((node, idx) => {
      const { r, angle } = getNodeRadius(layerIdx, layerNodes.length, idx);
      if (layerIdx === 0) {
        node.x = cx; node.y = cy;
      } else {
        const jitterX = (Math.random() - 0.5) * 30;
        const jitterY = (Math.random() - 0.5) * 30;
        node.x = cx + r * Math.cos(angle) + jitterX;
        node.y = cy + r * Math.sin(angle) + jitterY;
      }
    });
  });
}

// ==================== 事件监听 ====================
function setupEventListeners() {
  const svg = document.getElementById('graph-svg');
  const container = document.getElementById('canvasContainer');
  svg.addEventListener('dblclick', handleCanvasDblClick);
  svg.addEventListener('mousedown', handleMouseDown);
  svg.addEventListener('contextmenu', handleContextMenu);
  window.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('mouseup', handleMouseUp);
  container.addEventListener('wheel', handleWheel, { passive: false });
  window.addEventListener('keydown', handleKeyDown);
}

function getSVGPoint(e) {
  const svg = document.getElementById('graph-svg');
  const rect = svg.getBoundingClientRect();
  return { x: (e.clientX - rect.left - state.panX) / state.zoom, y: (e.clientY - rect.top - state.panY) / state.zoom };
}

function handleCanvasDblClick(e) {
  if (state.mode !== 'build') return;
  if (e.target.closest('.node-group')) return;
  const point = getSVGPoint(e);
  addNode(point.x, point.y);
}

function handleMouseDown(e) {
  if (e.button !== 0) return;
  
  // 检查是否点击了控制点
  const controlPoint = e.target.closest('.edge-control-point');
  if (controlPoint) {
    const edgeId = controlPoint.dataset.edgeId;
    const index = parseInt(controlPoint.dataset.index);
    state.isDraggingControlPoint = true;
    state.draggingControlPoint = { edgeId, index };
    e.stopPropagation();
    return;
  }
  
  // 检查是否点击了连线
  const edgeGroup = e.target.closest('.edge-group');
  if (edgeGroup) {
    const edgeId = edgeGroup.dataset.id;
    selectEdge(edgeId);
    e.stopPropagation();
    return;
  }
  
  const nodeGroup = e.target.closest('.node-group');
  if (state.connectMode && nodeGroup) {
    const nodeId = nodeGroup.dataset.id;
    if (!state.connectFromId) { state.connectFromId = nodeId; showConnectHint('点击另一个节点完成连线，按 Esc 取消'); }
    else if (nodeId !== state.connectFromId) { addEdge(state.connectFromId, nodeId); state.connectFromId = null; state.connectMode = false; document.getElementById('btn-connect').classList.remove('active'); hideConnectHint(); }
    return;
  }
  if (nodeGroup) {
    const nodeId = nodeGroup.dataset.id;
    selectNode(nodeId);
    state.isDragging = true; state.dragNodeId = nodeId;
    const point = getSVGPoint(e);
    const node = state.nodes.find(n => n.id === nodeId);
    state.dragOffset = { x: point.x - node.x, y: point.y - node.y };
    
    state.prevNodePositions = {};
    state.edges.forEach(edge => {
      if (edge.sourceId === nodeId || edge.targetId === nodeId) {
        const source = state.nodes.find(n => n.id === edge.sourceId);
        const target = state.nodes.find(n => n.id === edge.targetId);
        if (source) state.prevNodePositions[edge.sourceId] = { x: source.x, y: source.y };
        if (target) state.prevNodePositions[edge.targetId] = { x: target.x, y: target.y };
      }
    });
    
    nodeGroup.style.cursor = 'grabbing';
  } else {
    deselectEdge();
    state.isPanning = true;
    state.panStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
    document.getElementById('canvasContainer').classList.add('grabbing');
  }
}

function handleMouseMove(e) {
  if (state.isDraggingControlPoint && state.draggingControlPoint.edgeId) {
    const point = getSVGPoint(e);
    const edge = state.edges.find(ed => ed.id === state.draggingControlPoint.edgeId);
    if (edge && edge.controlPoints) {
      edge.controlPoints[state.draggingControlPoint.index] = { x: point.x, y: point.y };
      edge.controlPointsAdjusted = true;
      updateEdgePath(edge);
    }
    return;
  }
  if (state.isDragging && state.dragNodeId) {
    const point = getSVGPoint(e);
    const node = state.nodes.find(n => n.id === state.dragNodeId);
    if (node) { node.x = point.x - state.dragOffset.x; node.y = point.y - state.dragOffset.y; updateNodePosition(node); updateConnectedEdges(node.id); updateDetailPosition(node); }
  }
  if (state.isPanning) {
    state.panX = e.clientX - state.panStart.x;
    state.panY = e.clientY - state.panStart.y;
    updateTransform();
  }
  if (state.connectMode && state.connectFromId) {
    const point = getSVGPoint(e);
    const fromNode = state.nodes.find(n => n.id === state.connectFromId);
    if (fromNode) {
      const tempEdge = document.getElementById('temp-edge');
      tempEdge.style.display = 'block';
      const mx = (fromNode.x + point.x) / 2, my = Math.min(fromNode.y, point.y) - 30;
      tempEdge.setAttribute('d', `M ${fromNode.x} ${fromNode.y} Q ${mx} ${my} ${point.x} ${point.y}`);
    }
  }
}

function handleMouseUp(e) {
  if (state.isDraggingControlPoint) {
    state.isDraggingControlPoint = false;
    state.draggingControlPoint = { edgeId: null, index: null };
  }
  if (state.isDragging) { state.isDragging = false; state.dragNodeId = null; const g = document.querySelector('.node-group.selected'); if (g) g.style.cursor = 'move'; }
  if (state.isPanning) { state.isPanning = false; document.getElementById('canvasContainer').classList.remove('grabbing'); }
}

function handleWheel(e) {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.3, Math.min(2.5, state.zoom * delta));
  const rect = e.currentTarget.getBoundingClientRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  state.panX = mouseX - (mouseX - state.panX) * (newZoom / state.zoom);
  state.panY = mouseY - (mouseY - state.panY) * (newZoom / state.zoom);
  state.zoom = newZoom;
  updateTransform();
}

function handleKeyDown(e) {
  if (e.key === 'Escape') {
    if (state.connectMode) { state.connectMode = false; state.connectFromId = null; document.getElementById('btn-connect').classList.remove('active'); document.getElementById('temp-edge').style.display = 'none'; hideConnectHint(); }
    deselectNode();
    deselectEdge();
  }
  if (e.key === 'Delete') {
    if (state.selectedNodeId) deleteNode(state.selectedNodeId);
    if (state.selectedEdgeId) deleteEdge(state.selectedEdgeId);
  }
}

      width: 100%; padding: 8px 12px; text-align: left; border: none;
      background: ${item.active ? 'rgba(91,66,214,0.1)' : 'transparent'};
      border-radius: 8px; cursor: pointer; font-size: ${13 * state.fontScale}px;
      color: ${item.active ? '#5B42D6' : 'var(--ink)'}; font-family: var(--font);
      display: flex; align-items: center; gap: 8px;
    `;
    btn.innerHTML = `${item.label}${item.active ? ' ✓' : ''}`;
    btn.onclick = () => {
      handleDetailMenuClick(nodeId, item.key);
      hideDetailMenu();
    };
    btn.onmouseover = () => btn.style.background = 'rgba(91,66,214,0.05)';
    btn.onmouseout = () => btn.style.background = item.active ? 'rgba(91,66,214,0.1)' : 'transparent';
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);
  document.addEventListener('click', hideDetailMenu, { once: true });
}

function hideDetailMenu() {
  document.getElementById('detail-menu')?.remove();
}

function handleDetailMenuClick(nodeId, key) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) return;

  if (!state.expandedDetails[nodeId]) {
    state.expandedDetails[nodeId] = { draft: false, material: false };
  }

  if (key === 'close') {
    state.expandedDetails[nodeId] = { draft: false, material: false };
    removeDetailLayer(nodeId);
  } else {
    state.expandedDetails[nodeId][key] = !state.expandedDetails[nodeId][key];
    renderDetailLayer(node);
  }
}

function nodeToScreen(x, y) {
  return {
    x: x * state.zoom + state.panX,
    y: y * state.zoom + state.panY
  };
}

function autoResizeTextarea(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(36, ta.scrollHeight) + 'px';
}

function renderDetailLayer(node) {
  removeDetailLayer(node.id);
  const details = state.expandedDetails[node.id];
  if (!details || (!details.draft && !details.material)) return;

  ensureDetailArrowMarkers();

  const boxCount = (details.draft ? 1 : 0) + (details.material ? 1 : 0);
  const container = document.getElementById('detail-overlay-container');
  const layer = document.createElement('div');
  layer.className = `detail-layer ${boxCount === 2 ? 'dual' : 'single'}`;
  layer.id = `detail-${node.id}`;
  layer.style.pointerEvents = 'auto';

  if (details.draft) {
    const draftBox = document.createElement('div');
    draftBox.className = 'detail-box draft';
    draftBox.innerHTML = `
      <div class="detail-header">
        <span>📝 草稿</span>
        <span class="detail-close" onclick="toggleDetailBox('${node.id}', 'draft')">✕</span>
      </div>
      <textarea class="detail-textarea" placeholder="写下你对「${node.title}」的理解和草稿..." data-field="draft" data-node-id="${node.id}">${node.draft || ''}</textarea>
    `;
    layer.appendChild(draftBox);
  }

  if (details.material) {
    const materialBox = document.createElement('div');
    materialBox.className = 'detail-box material';
    materialBox.innerHTML = `
      <div class="detail-header">
        <span>📚 资料</span>
        <span class="detail-close" onclick="toggleDetailBox('${node.id}', 'material')">✕</span>
      </div>
      <textarea class="detail-textarea" placeholder="粘贴「${node.title}」的参考资料和笔记..." data-field="material" data-node-id="${node.id}">${node.material || ''}</textarea>
    `;
    layer.appendChild(materialBox);
  }

  container.appendChild(layer);

  layer.querySelectorAll('.detail-textarea').forEach(ta => {
    autoResizeTextarea(ta);
    ta.addEventListener('input', (e) => {
      const n = state.nodes.find(n => n.id === e.target.dataset.nodeId);
      if (n) n[e.target.dataset.field] = e.target.value;
      autoResizeTextarea(e.target);
      updateDetailPosition(node);
    });
    ta.addEventListener('mousedown', (e) => e.stopPropagation());
  });
  layer.addEventListener('mousedown', (e) => e.stopPropagation());

  updateDetailPosition(node);
  renderDetailConnector(node);
}

function toggleDetailBox(nodeId, boxType) {
  if (!state.expandedDetails[nodeId]) return;
  state.expandedDetails[nodeId][boxType] = false;
  const node = state.nodes.find(n => n.id === nodeId);
  if (node) renderDetailLayer(node);
}

function removeDetailLayer(nodeId) {
  document.getElementById(`detail-${nodeId}`)?.remove();
  document.getElementById(`detail-connector-${nodeId}-draft`)?.remove();
  document.getElementById(`detail-connector-${nodeId}-material`)?.remove();
}

function getAllNodeRects() {
  return state.nodes.map(n => {
    const { w, h } = getNodeSize(n);
    return {
      id: n.id,
      x: n.x * state.zoom + state.panX,
      y: n.y * state.zoom + state.panY,
      w: w * state.zoom,
      h: h * state.zoom
    };
  });
}

function rectsOverlap(r1, r2, padding = 4) {
  return !(r1.x + r1.w + padding < r2.x || r2.x + r2.w + padding < r1.x ||
           r1.y + r1.h + padding < r2.y || r2.y + r2.h + padding < r1.y);
}

function updateDetailPosition(node) {
  const layer = document.getElementById(`detail-${node.id}`);
  if (!layer) return;
  const { w, h } = getNodeSize(node);
  const container = document.getElementById('canvasContainer');
  const containerRect = container.getBoundingClientRect();

  layer.style.left = '0px';
  layer.style.top = '0px';
  layer.style.transform = `scale(${state.zoom})`;
  const layerRect = layer.getBoundingClientRect();
  const layerW = layerRect.width;
  const layerH = layerRect.height;

  const nodeScreenX = node.x * state.zoom + state.panX;
  const nodeScreenY = node.y * state.zoom + state.panY;
  const nodeW = w * state.zoom;
  const nodeH = h * state.zoom;

  const gap = 16 * state.zoom;
  const otherNodes = getAllNodeRects().filter(r => r.id !== node.id);
  const otherDetails = [];
  document.querySelectorAll('.detail-layer').forEach(dl => {
    if (dl.id !== layer.id) {
      const r = dl.getBoundingClientRect();
      otherDetails.push({ x: r.left, y: r.top, w: r.width, h: r.height });
    }
  });

  const nodeCx = nodeScreenX + nodeW / 2;
  const nodeCy = nodeScreenY + nodeH / 2;

  const positions = [];
  
  const angles = [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI, 5 * Math.PI / 4, 3 * Math.PI / 2, 7 * Math.PI / 4];
  const distances = [nodeW / 2 + gap + layerW / 2, nodeW / 2 + gap + layerW / 2 + 20, nodeW / 2 + gap + layerW / 2 - 20];
  
  angles.forEach(angle => {
    distances.forEach(dist => {
      const left = nodeCx - layerW / 2 + Math.cos(angle) * dist;
      const top = nodeCy - layerH / 2 + Math.sin(angle) * dist;
      positions.push({ left, top, angle });
    });
  });

  positions.push(
    { left: nodeScreenX + nodeW + gap, top: nodeScreenY },
    { left: nodeScreenX - layerW - gap, top: nodeScreenY },
    { left: nodeScreenX, top: nodeScreenY - layerH - gap },
    { left: nodeScreenX, top: nodeScreenY + nodeH + gap },
    { left: nodeScreenX + nodeW + gap, top: nodeScreenY - layerH },
    { left: nodeScreenX + nodeW + gap, top: nodeScreenY + nodeH },
    { left: nodeScreenX - layerW - gap, top: nodeScreenY - layerH },
    { left: nodeScreenX - layerW - gap, top: nodeScreenY + nodeH },
    { left: nodeScreenX - layerW / 2 + nodeW / 2, top: nodeScreenY - layerH - gap },
    { left: nodeScreenX - layerW / 2 + nodeW / 2, top: nodeScreenY + nodeH + gap },
    { left: nodeScreenX + nodeW + gap, top: nodeScreenY + nodeH / 2 - layerH / 2 },
    { left: nodeScreenX - layerW - gap, top: nodeScreenY + nodeH / 2 - layerH / 2 }
  );

  let bestPos = null;
  let bestScore = -Infinity;

  positions.forEach(pos => {
    let left = pos.left;
    let top = pos.top;
    left = Math.max(4, Math.min(left, containerRect.width - layerW - 4));
    top = Math.max(4, Math.min(top, containerRect.height - layerH - 4));
    const r = { x: left, y: top, w: layerW, h: layerH };
    let score = 0;
    const dist = Math.sqrt(Math.pow(left + layerW / 2 - nodeCx, 2) + Math.pow(top + layerH / 2 - nodeCy, 2));
    score -= dist * 0.02;
    otherNodes.forEach(or => { if (rectsOverlap(r, or)) score -= 2000; });
    otherDetails.forEach(or => { if (rectsOverlap(r, or)) score -= 1500; });
    const nodeRect = { x: nodeScreenX, y: nodeScreenY, w: nodeW, h: nodeH };
    if (rectsOverlap(r, nodeRect)) score -= 3000;
    if (left >= 4 && left + layerW <= containerRect.width - 4) score += 20;
    if (top >= 4 && top + layerH <= containerRect.height - 4) score += 20;
    const cx = left + layerW / 2;
    const cy = top + layerH / 2;
    const distFromCenter = Math.sqrt(Math.pow(cx - containerRect.width / 2, 2) + Math.pow(cy - containerRect.height / 2, 2));
    score -= distFromCenter * 0.005;
    if (score > bestScore) { bestScore = score; bestPos = { left, top }; }
  });

  if (bestPos) {
    layer.style.left = bestPos.left + 'px';
    layer.style.top = bestPos.top + 'px';
  }
  layer.style.transform = `scale(${state.zoom})`;
  renderDetailConnector(node);
}

function renderDetailConnector(node) {
  const layer = document.getElementById(`detail-${node.id}`);
  const details = state.expandedDetails[node.id];
  if (!layer || !details) return;

  document.querySelectorAll(`#detail-connector-${node.id}-draft, #detail-connector-${node.id}-material`).forEach(el => el.remove());

  const { w, h } = getNodeSize(node);
  const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
  const nodeScreenX = node.x * state.zoom + state.panX + w / 2;
  const nodeScreenY = node.y * state.zoom + state.panY + h / 2;

  const boxes = layer.querySelectorAll('.detail-box');
  boxes.forEach(box => {
    const boxRect = box.getBoundingClientRect();
    const boxCx = boxRect.left + boxRect.width / 2;
    const boxCy = boxRect.top + boxRect.height / 2;

    const dx = nodeScreenX - boxCx;
    const dy = nodeScreenY - boxCy;
    const angle = Math.atan2(dy, dx);

    box.classList.remove('arrow-left', 'arrow-right', 'arrow-top', 'arrow-bottom');

    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) {
        box.classList.add('arrow-right');
      } else {
        box.classList.add('arrow-left');
      }
    } else {
      if (dy > 0) {
        box.classList.add('arrow-bottom');
      } else {
        box.classList.add('arrow-top');
      }
    }

    const arrowPos = Math.abs(dx) > Math.abs(dy) ? Math.min(boxRect.height / 2 - 8, Math.max(10, Math.abs((nodeScreenY - boxRect.top) - boxRect.height / 2))) : Math.min(boxRect.width / 2 - 8, Math.max(10, Math.abs((nodeScreenX - boxRect.left) - boxRect.width / 2)));
    
    if (box.classList.contains('arrow-left') || box.classList.contains('arrow-right')) {
      box.style.setProperty('--arrow-pos', arrowPos + 'px');
    } else {
      box.style.setProperty('--arrow-pos', arrowPos + 'px');
    }
  });
}

function ensureDetailArrowMarkers() {
  const defs = document.querySelector('#graph-svg defs');
  if (!defs) return;
  if (document.getElementById('detail-arrow-draft')) return;

  const markers = [
    { id: 'detail-arrow-draft', color: '#D97706' },
    { id: 'detail-arrow-material', color: '#0D9488' }
  ];

  markers.forEach(({ id, color }) => {
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    marker.setAttribute('id', id);
    marker.setAttribute('viewBox', '0 0 12 12');
    marker.setAttribute('refX', '11');
    marker.setAttribute('refY', '6');
    marker.setAttribute('markerWidth', '9');
    marker.setAttribute('markerHeight', '9');
    marker.setAttribute('orient', 'auto');
    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    polygon.setAttribute('points', '0 0, 12 6, 0 12');
    polygon.setAttribute('fill', color);
    polygon.setAttribute('fill-opacity', '0.95');
    marker.appendChild(polygon);
    defs.appendChild(marker);
  });
}

function updateAllDetailPositions() {
  const nodeIds = Object.keys(state.expandedDetails);
  nodeIds.forEach(nodeId => {
    const node = state.nodes.find(n => n.id === nodeId);
    if (node) {
      const details = state.expandedDetails[nodeId];
      if (details && (details.draft || details.material)) {
        updateDetailPosition(node);
      } else {
        delete state.expandedDetails[nodeId];
        removeDetailLayer(nodeId);
      }
    } else {
      delete state.expandedDetails[nodeId];
      removeDetailLayer(nodeId);
    }
  });
  nodeIds.forEach(nodeId => {
    const node = state.nodes.find(n => n.id === nodeId);
    if (node) {
      const details = state.expandedDetails[nodeId];
      if (details && (details.draft || details.material)) {
        updateDetailPosition(node);
      }
    }
  });
}

function updateTransform() {
  const transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
  ['nodes-group', 'edges-group', 'detail-connectors-group', 'temp-edge'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.transform = transform; el.style.transformOrigin = '0 0'; }
  });
  updateAllDetailPositions();
}

function zoomIn() { state.zoom = Math.min(2.5, state.zoom * 1.2); updateTransform(); }
function zoomOut() { state.zoom = Math.max(0.3, state.zoom * 0.8); updateTransform(); }
function resetView() { state.zoom = 1; state.panX = 0; state.panY = 0; updateTransform(); }

// ==================== 节点管理 ====================
function addNode(x, y) {
  const id = `n${nodeIdCounter++}`;
  const node = { id, title: '新节点', type: 'concept', desc: '双击编辑', icon: '💡', color: nodeColors[Math.floor(Math.random() * nodeColors.length)], shape: 'rounded', x, y, fontSize: 'body', draft: '', material: '' };
  state.nodes.push(node);
  renderNode(node);
  selectNode(id);
  updateStats();
}

function addNodeAtCenter() {
  const svg = document.getElementById('graph-svg');
  const rect = svg.getBoundingClientRect();
  addNode((rect.width / 2 - state.panX) / state.zoom, (rect.height / 2 - state.panY) / state.zoom);
}

function getFontSize(node) {
  const preset = fontSizePresets[node.fontSize] || fontSizePresets.body;
  const scale = state.fontScale;
  return {
    mainSize: preset.size * scale,
    subSize: preset.subSize * scale,
    iconSize: preset.iconSize * scale,
    weight: preset.weight
  };
}

function getNodeSize(node) {
  const fs = getFontSize(node);
  const charWidth = fs.mainSize * 0.6;
  const baseW = 20 + node.title.length * charWidth;
  const minW = 60 + fs.iconSize;
  const maxW = 80 + fs.mainSize * 8;
  const w = Math.max(minW, Math.min(baseW, maxW));
  const h = state.currentLayer === 'title' 
    ? Math.max(40 + fs.mainSize, w * 0.6) 
    : (node.desc ? Math.max(50 + fs.mainSize + fs.subSize, w * 0.7) : Math.max(40 + fs.mainSize, w * 0.6));
  return { w, h };
}

function renderNode(node) {
  const nodesGroup = document.getElementById('nodes-group');
  const { w, h } = getNodeSize(node);
  const shapeFn = nodeShapes[node.shape] || nodeShapes.rounded;

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', `node-group appearing`);
  g.setAttribute('data-id', node.id);
  g.setAttribute('transform', `translate(${node.x - w/2}, ${node.y - h/2})`);

  shapeFn.draw(g, w, h, node.color);

  const fs = getFontSize(node);
  
  const iconEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  iconEl.setAttribute('class', 'node-icon-custom');
  iconEl.setAttribute('x', w / 2);
  iconEl.setAttribute('y', h / 2 - fs.mainSize * 0.3);
  iconEl.setAttribute('font-size', fs.iconSize + 'px');
  iconEl.textContent = node.icon || '💡';
  g.appendChild(iconEl);

  const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  textEl.setAttribute('class', 'node-text-main');
  textEl.setAttribute('x', w / 2);
  textEl.setAttribute('y', h / 2 + fs.mainSize * 0.7);
  textEl.setAttribute('font-size', fs.mainSize + 'px');
  textEl.setAttribute('font-weight', fs.weight);
  textEl.textContent = node.title;
  g.appendChild(textEl);

  if (node.desc && state.currentLayer !== 'title') {
    const descEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    descEl.setAttribute('class', 'node-text-sub');
    descEl.setAttribute('x', w / 2);
    descEl.setAttribute('y', h / 2 + fs.mainSize * 0.7 + fs.subSize * 1.2);
    descEl.setAttribute('font-size', fs.subSize + 'px');
    descEl.textContent = node.desc;
    g.appendChild(descEl);
  }

  const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  badge.setAttribute('class', 'weak-badge');
  badge.setAttribute('x', w - 4);
  badge.setAttribute('y', 14);
  badge.setAttribute('font-size', '14');
  badge.textContent = '⚠';
  g.appendChild(badge);

  nodesGroup.appendChild(g);
  setTimeout(() => g.classList.remove('appearing'), 500);
}

function updateNodePosition(node) {
  const g = document.querySelector(`.node-group[data-id="${node.id}"]`);
  if (!g) return;
  const { w, h } = getNodeSize(node);
  g.setAttribute('transform', `translate(${node.x - w/2}, ${node.y - h/2})`);
}

function reRenderNode(node) {
  const g = document.querySelector(`.node-group[data-id="${node.id}"]`);
  if (g) g.remove();
  renderNode(node);
  if (state.weakNodeIds.has(node.id)) {
    const g2 = document.querySelector(`.node-group[data-id="${node.id}"]`);
    if (g2) g2.classList.add('weak');
  }
}

function selectNode(id) {
  deselectNode();
  deselectEdge();
  state.selectedNodeId = id;
  const g = document.querySelector(`.node-group[data-id="${id}"]`);
  if (g) g.classList.add('selected');
  showNodePanel(id);
}

function deselectNode() {
  if (state.selectedNodeId) {
    const g = document.querySelector(`.node-group[data-id="${state.selectedNodeId}"]`);
    if (g) g.classList.remove('selected');
  }
  state.selectedNodeId = null;
  if (state.mode === 'build') hidePanel();
}

function selectEdge(edgeId) {
  deselectEdge();
  deselectNode();
  state.selectedEdgeId = edgeId;
  const g = document.querySelector(`.edge-group[data-id="${edgeId}"]`);
  if (g) {
    g.classList.add('selected');
  }
  showEdgePanel(edgeId);
}

function deselectEdge() {
  if (state.selectedEdgeId) {
    const g = document.querySelector(`.edge-group[data-id="${state.selectedEdgeId}"]`);
    if (g) g.classList.remove('selected');
  }
  state.selectedEdgeId = null;
  if (state.mode === 'build') hidePanel();
}

function deleteNode(id) {
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(e => e.sourceId !== id && e.targetId !== id);
  state.weakNodeIds.delete(id);
  delete state.expandedDetails[id];
  removeDetailLayer(id);
  document.querySelector(`.node-group[data-id="${id}"]`)?.remove();
  state.edges.forEach(e => document.querySelector(`.edge-group[data-id="${e.id}"]`)?.remove());
  renderAllEdges();
  state.selectedNodeId = null;
  hidePanel();
  updateStats();
}

// ==================== 连线管理 ====================
function addEdge(sourceId, targetId) {
  const id = `e${edgeIdCounter++}`;
  const source = state.nodes.find(n => n.id === sourceId);
  const target = state.nodes.find(n => n.id === targetId);
  
  let controlPoints = null;
  let controlPointsAdjusted = false;
  
  if (source && target) {
    const midX = (source.x + target.x) / 2;
    const midY = (source.y + target.y) / 2;
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;
    const offset = Math.min(dist * 0.2, 40);
    
    controlPoints = [
      { x: midX + Math.cos(perpAngle) * offset * 0.5, y: midY + Math.sin(perpAngle) * offset * 0.5 },
      { x: midX - Math.cos(perpAngle) * offset * 0.5, y: midY - Math.sin(perpAngle) * offset * 0.5 }
    ];
  }
  
  const edge = { id, sourceId, targetId, label: '相关', type: 'relatedTo', style: state.edgeStyle, controlPoints, controlPointsAdjusted };
  state.edges.push(edge);
  renderEdge(edge);
  updateStats();
}

function setEdgeStyle(style) {
  state.edgeStyle = style;
  document.getElementById('btn-edge-branch').classList.toggle('active', style === 'branch');
  document.getElementById('btn-edge-ladder').classList.toggle('active', style === 'ladder');
  if (state.connectMode) {
    document.getElementById('connectSubmenu').classList.add('show');
  }
}

function isHierarchicalEdge(edge) {
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  if (!source || !target) return false;
  const sLayer = getNodeLayer(source), tLayer = getNodeLayer(target);
  return Math.abs(sLayer - tLayer) === 1;
}

function getEdgeColor(edge) {
  const source = state.nodes.find(n => n.id === edge.sourceId);
  if (source) return source.color;
  return '#5B42D6';
}

function renderEdge(edge) {
  const edgesGroup = document.getElementById('edges-group');
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  if (!source || !target) return;

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'edge-group');
  g.setAttribute('data-id', edge.id);

  const color = getBranchColor(edge);
  const style = edge.style || 'branch';
  
  if (style === 'branch') {
    for (let i = 0; i < 3; i++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'edge-branch-part' + (i === 0 ? ' growing' : ''));
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-opacity', i === 0 ? '0.9' : i === 1 ? '0.7' : '0.5');
      path.setAttribute('data-part', i);
      g.appendChild(path);
    }
    
    // 添加控制点
    if (edge.controlPoints) {
      edge.controlPoints.forEach((cp, index) => {
        const cpGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        cpGroup.setAttribute('class', 'edge-control-point');
        cpGroup.setAttribute('data-index', index);
        cpGroup.setAttribute('data-edge-id', edge.id);
        cpGroup.style.cursor = 'move';

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'control-line');
        cpGroup.appendChild(line);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('r', '2');
        circle.setAttribute('fill', 'white');
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '1');
        cpGroup.appendChild(circle);

        g.appendChild(cpGroup);
      });
    }
  } else {
    const ladderPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ladderPath.setAttribute('class', 'edge-ladder');
    ladderPath.setAttribute('stroke', color);
    ladderPath.setAttribute('stroke-width', '1');
    ladderPath.setAttribute('stroke-opacity', '0.6');
    ladderPath.setAttribute('fill', 'none');
    g.appendChild(ladderPath);

    const ladderRungs = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    ladderRungs.setAttribute('class', 'ladder-rungs');
    g.appendChild(ladderRungs);

    // 添加控制点
    if (edge.controlPoints) {
      edge.controlPoints.forEach((cp, index) => {
        const cpGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        cpGroup.setAttribute('class', 'edge-control-point');
        cpGroup.setAttribute('data-index', index);
        cpGroup.setAttribute('data-edge-id', edge.id);
        cpGroup.style.cursor = 'move';

        // 控制点连线
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'control-line');
        cpGroup.appendChild(line);

        // 控制点圆点 (1mm ≈ 4px)
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('r', '2');
        circle.setAttribute('fill', 'white');
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '1');
        cpGroup.appendChild(circle);

        g.appendChild(cpGroup);
      });
    }
  }

  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('class', 'edge-label');
  label.textContent = edge.label;
  g.appendChild(label);

  edgesGroup.appendChild(g);
  updateEdgePath(edge);
}

function getBranchColor(edge) {
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  if (!source || !target) return '#5B42D6';
  
  const rootNode = state.nodes.find(n => n.type === 'topic');
  if (!rootNode) return source.color;
  
  const branchColor = findBranchColor(rootNode.id, edge);
  return branchColor || source.color;
}

function findBranchColor(rootId, edge) {
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  
  if (source.id === rootId) {
    return target.color;
  }
  
  const visited = new Set();
  const queue = [{ nodeId: source.id, path: [] }];
  visited.add(source.id);
  
  while (queue.length > 0) {
    const { nodeId, path } = queue.shift();
    
    const incomingEdges = state.edges.filter(e => e.targetId === nodeId);
    
    for (const e of incomingEdges) {
      if (e.sourceId === rootId) {
        const childNode = state.nodes.find(n => n.id === nodeId);
        return childNode ? childNode.color : '#5B42D6';
      }
      
      if (!visited.has(e.sourceId)) {
        visited.add(e.sourceId);
        queue.push({ nodeId: e.sourceId, path: [...path, e.sourceId] });
      }
    }
  }
  
  return null;
}

function updateEdgePath(edge) {
  const g = document.querySelector(`.edge-group[data-id="${edge.id}"]`);
  if (!g) return;
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  if (!source || !target) return;

  const label = g.querySelector('.edge-label');
  const style = edge.style || 'branch';

  if (style === 'branch') {
    const paths = g.querySelectorAll('path');
    const dx = target.x - source.x, dy = target.y - source.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // 获取或初始化控制点
    if (!edge.controlPoints) {
      const midX = (source.x + target.x) / 2;
      const midY = (source.y + target.y) / 2;
      const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;
      const offset = Math.min(dist * 0.2, 40);
      edge.controlPoints = [
        { x: midX + Math.cos(perpAngle) * offset * 0.5, y: midY + Math.sin(perpAngle) * offset * 0.5 },
        { x: midX - Math.cos(perpAngle) * offset * 0.5, y: midY - Math.sin(perpAngle) * offset * 0.5 }
      ];
    }
    
    const cp1 = edge.controlPoints[0];
    const cp2 = edge.controlPoints[1];
    
    const widths = [4, 2.5, 1.5];
    const offsets = [0, 5, -5];
    
    paths.forEach((path, i) => {
      const offsetAngle = Math.atan2(dy, dx) + Math.PI / 2;
      const offsetX = Math.cos(offsetAngle) * offsets[i];
      const offsetY = Math.sin(offsetAngle) * offsets[i];
      
      const d = `M ${source.x} ${source.y} C ${cp1.x + offsetX} ${cp1.y + offsetY}, ${cp2.x + offsetX} ${cp2.y + offsetY}, ${target.x} ${target.y}`;
      path.setAttribute('d', d);
      path.setAttribute('stroke-width', widths[i]);
    });
    
    // 更新控制点位置和连线
    const controlPoints = g.querySelectorAll('.edge-control-point');
    controlPoints.forEach((cpGroup, index) => {
      const cp = edge.controlPoints[index];
      const line = cpGroup.querySelector('.control-line');
      
      if (index === 0) {
        line.setAttribute('x1', source.x);
        line.setAttribute('y1', source.y);
      } else {
        line.setAttribute('x1', target.x);
        line.setAttribute('y1', target.y);
      }
      line.setAttribute('x2', cp.x);
      line.setAttribute('y2', cp.y);
      
      cpGroup.setAttribute('transform', `translate(${cp.x}, ${cp.y})`);
    });

    const midX = (source.x + cp1.x + cp2.x + target.x) / 4;
    const midY = (source.y + cp1.y + cp2.y + target.y) / 4 - 15;
    label.setAttribute('x', midX);
    label.setAttribute('y', midY);
  } else {
    const ladderPath = g.querySelector('.edge-ladder');
    const rungsGroup = g.querySelector('.ladder-rungs');
    
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // 获取或初始化控制点
    if (!edge.controlPoints) {
      const midX = (source.x + target.x) / 2;
      const midY = (source.y + target.y) / 2;
      const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;
      const offset = Math.min(dist * 0.2, 40);
      edge.controlPoints = [
        { x: midX + Math.cos(perpAngle) * offset * 0.5, y: midY + Math.sin(perpAngle) * offset * 0.5 },
        { x: midX - Math.cos(perpAngle) * offset * 0.5, y: midY - Math.sin(perpAngle) * offset * 0.5 }
      ];
    }
    
    const cp1 = edge.controlPoints[0];
    const cp2 = edge.controlPoints[1];
    
    // 使用三次贝塞尔曲线计算路径上的点
    function getBezierPoint(t, p0, p1, p2, p3) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }
    
    // 计算贝塞尔曲线的切线方向（用于垂直偏移）
    function getBezierTangent(t, p0, p1, p2, p3) {
      const u = 1 - t;
      return {
        x: 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
        y: 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
      };
    }
    
    const rungWidth = 3;
    const rungCount = Math.max(6, Math.floor(dist / 20));
    const sideOffset = rungWidth / 2;
    
    // 绘制主路径（两条弧线）
    let pathD = '';
    const points = [];
    
    for (let i = 0; i <= rungCount; i++) {
      const t = i / rungCount;
      const point = getBezierPoint(t, source, cp1, cp2, target);
      const tangent = getBezierTangent(t, source, cp1, cp2, target);
      const perpAngle = Math.atan2(tangent.y, tangent.x) + Math.PI / 2;
      
      const x1 = point.x + Math.cos(perpAngle) * sideOffset;
      const y1 = point.y + Math.sin(perpAngle) * sideOffset;
      const x2 = point.x - Math.cos(perpAngle) * sideOffset;
      const y2 = point.y - Math.sin(perpAngle) * sideOffset;
      
      points.push({ x1, y1, x2, y2 });
      
      if (i === 0) {
        pathD = `M ${x1} ${y1}`;
      } else {
        pathD += ` L ${x1} ${y1}`;
      }
    }
    
    // 添加右侧返回路径
    for (let i = rungCount; i >= 0; i--) {
      pathD += ` L ${points[i].x2} ${points[i].y2}`;
    }
    
    pathD += ' Z';
    ladderPath.setAttribute('d', pathD);
    
    // 绘制横档
    rungsGroup.innerHTML = '';
    for (let i = 1; i < rungCount; i++) {
      const rung = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      rung.setAttribute('x1', points[i].x1);
      rung.setAttribute('y1', points[i].y1);
      rung.setAttribute('x2', points[i].x2);
      rung.setAttribute('y2', points[i].y2);
      rung.setAttribute('stroke', getEdgeColor(edge));
      rung.setAttribute('stroke-width', '1');
      rung.setAttribute('stroke-opacity', '0.6');
      rungsGroup.appendChild(rung);
    }
    
    // 更新控制点位置和连线
    const controlPoints = g.querySelectorAll('.edge-control-point');
    controlPoints.forEach((cpGroup, index) => {
      const cp = edge.controlPoints[index];
      const line = cpGroup.querySelector('.control-line');
      const circle = cpGroup.querySelector('circle');
      
      // 更新连线（从节点到控制点）
      if (index === 0) {
        line.setAttribute('x1', source.x);
        line.setAttribute('y1', source.y);
      } else {
        line.setAttribute('x1', target.x);
        line.setAttribute('y1', target.y);
      }
      line.setAttribute('x2', cp.x);
      line.setAttribute('y2', cp.y);
      
      // 更新圆点位置
      cpGroup.setAttribute('transform', `translate(${cp.x}, ${cp.y})`);
    });

    const midPoint = getBezierPoint(0.5, source, cp1, cp2, target);
    label.setAttribute('x', midPoint.x);
    label.setAttribute('y', midPoint.y - 15);
  }
}

function updateConnectedEdges(nodeId) {
  state.edges.filter(e => e.sourceId === nodeId || e.targetId === nodeId).forEach(e => {
    adjustControlPoints(e, nodeId);
    updateEdgePath(e);
  });
}

function adjustControlPoints(edge, movedNodeId) {
  if (!edge.controlPoints) return;
  
  const source = state.nodes.find(n => n.id === edge.sourceId);
  const target = state.nodes.find(n => n.id === edge.targetId);
  if (!source || !target) return;
  
  if (edge.controlPointsAdjusted) {
    const movedNode = state.nodes.find(n => n.id === movedNodeId);
    if (!movedNode) return;
    
    const prevSource = state.prevNodePositions ? state.prevNodePositions[edge.sourceId] : null;
    const prevTarget = state.prevNodePositions ? state.prevNodePositions[edge.targetId] : null;
    
    if (prevSource && prevTarget) {
      const dx = (source.x - prevSource.x) + (target.x - prevTarget.x);
      const dy = (source.y - prevSource.y) + (target.y - prevTarget.y);
      
      edge.controlPoints[0].x += dx;
      edge.controlPoints[0].y += dy;
      edge.controlPoints[1].x += dx;
      edge.controlPoints[1].y += dy;
    }
  } else {
    const midX = (source.x + target.x) / 2;
    const midY = (source.y + target.y) / 2;
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;
    
    const offset = Math.min(dist * 0.2, 40);
    
    edge.controlPoints[0] = {
      x: midX + Math.cos(perpAngle) * offset * 0.5,
      y: midY + Math.sin(perpAngle) * offset * 0.5
    };
    
    edge.controlPoints[1] = {
      x: midX - Math.cos(perpAngle) * offset * 0.5,
      y: midY - Math.sin(perpAngle) * offset * 0.5
    };
  }
}

}

function deleteEdge(edgeId) {
  state.edges = state.edges.filter(e => e.id !== edgeId);
  document.querySelector(`.edge-group[data-id="${edgeId}"]`)?.remove();
  state.selectedEdgeId = null;
  hidePanel();
  updateStats();
}

function reRenderEdge(edge) {
  const oldGroup = document.querySelector(`.edge-group[data-id="${edge.id}"]`);
  if (oldGroup) oldGroup.remove();
  renderEdge(edge);
}

function hidePanel() { document.getElementById('sidePanel').classList.add('hidden'); }

// ==================== 图层切换 ====================
function toggleLayer(layer) {
  state.currentLayer = layer;
  document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
  event.target.closest('.layer-btn').classList.add('active');
  
  if (layer === 'all') {
    state.nodes.forEach(node => {
      if (!state.expandedDetails[node.id]) {
        state.expandedDetails[node.id] = { draft: false, material: true };
      } else if (!state.expandedDetails[node.id].material) {
        state.expandedDetails[node.id].material = true;
      }
    });
  } else {
    Object.keys(state.expandedDetails).forEach(nodeId => {
      state.expandedDetails[nodeId] = { draft: false, material: false };
    });
  }
  
  renderAll();
}

// ==================== 模式切换 ====================
function switchMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
  const modeLabels = { build: '搭建模式', review: 'AI 复检模式', quiz: '复习考察模式' };
  document.getElementById('modeLabel').textContent = modeLabels[mode];
  const hints = { build: '双击空白创建 · 拖拽移动 · 滚轮缩放', review: '点击下方追问，查看 AI 发现的问题', quiz: '回答问题，检验你的知识理解程度' };
  document.getElementById('hintText').textContent = hints[mode];
  deselectNode();
  if (mode === 'review') { if (state.reviewQuestions.length === 0) generateReviewQuestions(); showReviewPanel(); }
  else if (mode === 'quiz') { if (state.quizQuestions.length === 0) generateQuizQuestions(); showQuizPanel(); }
  else { hidePanel(); state.connectMode = false; state.connectFromId = null; document.getElementById('btn-connect').classList.remove('active'); document.getElementById('temp-edge').style.display = 'none'; }
  document.getElementById('confirmBtn').style.display = mode === 'build' ? 'block' : 'none';
}

// ==================== AI 复检 ====================
function confirmAndReview() { switchMode('review'); }

function generateReviewQuestions() {
  const questions = [];
  const connectedIds = new Set();
  state.edges.forEach(e => { connectedIds.add(e.sourceId); connectedIds.add(e.targetId); });
  const isolatedNodes = state.nodes.filter(n => !connectedIds.has(n.id));
  if (isolatedNodes.length > 0) questions.push({ id: 'q1', type: 'structure', icon: '🔍', text: `发现 ${isolatedNodes.length} 个孤立节点，"${isolatedNodes[0].title}" 还没有与其他知识建立连接。它和主题有什么关系？`, relatedNodeIds: isolatedNodes.map(n => n.id) });

  const conceptNodes = state.nodes.filter(n => n.type === 'concept');
  if (conceptNodes.length < 3) questions.push({ id: 'q2', type: 'structure', icon: '🧩', text: `知识图谱中只有 ${conceptNodes.length} 个核心概念，你还能想到哪些相关概念？`, relatedNodeIds: conceptNodes.map(n => n.id) });

  const exampleNodes = state.nodes.filter(n => n.type === 'example');
  if (exampleNodes.length < 2) questions.push({ id: 'q3', type: 'knowledge', icon: '📚', text: '例子偏少。能为核心概念再补充 1-2 个具体例子吗？', relatedNodeIds: conceptNodes.slice(0, 2).map(n => n.id) });

  const mistakeNodes = state.nodes.filter(n => n.type === 'misconception');
  if (mistakeNodes.length === 0) questions.push({ id: 'q4', type: 'knowledge', icon: '⚠️', text: '还没有记录易错点。这个知识领域有什么容易混淆的概念或常见误区吗？', relatedNodeIds: state.nodes.filter(n => n.type === 'topic').map(n => n.id) });

  if (state.edges.length > 2) {
    const randomEdge = state.edges[Math.floor(Math.random() * state.edges.length)];
    const source = state.nodes.find(n => n.id === randomEdge.sourceId);
    const target = state.nodes.find(n => n.id === randomEdge.targetId);
    if (source && target) questions.push({ id: 'q5', type: 'relation', icon: '🔗', text: `"${source.title}" 和 "${target.title}" 的关系标记为"${randomEdge.label}"。能具体解释一下它们是如何相互影响的吗？`, relatedNodeIds: [source.id, target.id] });
  }

  questions.push({ id: 'q6', type: 'knowledge', icon: '💡', text: '如果要用一句话向别人解释这个知识领域的核心，你会怎么说？它最大的价值或应用场景是什么？', relatedNodeIds: state.nodes.filter(n => n.type === 'topic').map(n => n.id) });
  state.reviewQuestions = questions;
}

function showReviewPanel() {
  const panel = document.getElementById('sidePanel');
  const header = document.getElementById('panelHeader');
  const body = document.getElementById('panelBody');
  header.innerHTML = `<h3>AI 复检报告</h3><p>发现 ${state.reviewQuestions.length} 个值得思考的问题</p>`;
  const answeredCount = state.answeredQuestions.size;
  const progress = state.reviewQuestions.length > 0 ? Math.round((answeredCount / state.reviewQuestions.length) * 100) : 0;

  let html = `
    <div class="ai-thinking"><div class="ai-avatar">🤖</div><div class="ai-thinking-text"><strong>AI 复检完成</strong><span>分析了 ${state.nodes.length} 个节点和 ${state.edges.length} 条关系</span></div></div>
    <div class="stats-grid"><div class="stat-card"><div class="stat-num">${state.reviewQuestions.length}</div><div class="stat-label">追问数</div></div><div class="stat-card weak"><div class="stat-num">${state.weakNodeIds.size}</div><div class="stat-label">薄弱节点</div></div></div>
    <div style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);"><span>复检进度</span><span>${answeredCount}/${state.reviewQuestions.length}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div></div>
  `;

  state.reviewQuestions.forEach(q => {
    const answered = state.answeredQuestions.has(q.id);
    const typeLabels = { structure: { label: '结构', cls: 'structure' }, knowledge: { label: '知识', cls: 'knowledge' }, relation: { label: '关系', cls: 'relation' } };
    const typeInfo = typeLabels[q.type] || typeLabels.knowledge;
    html += `<div class="question-card ${answered ? 'answered' : ''}" onclick="focusQuestion('${q.id}')"><div class="q-icon">${q.icon}</div><div class="q-text">${q.text}</div><div class="q-meta"><span class="q-tag ${typeInfo.cls}">${typeInfo.label}问题</span>${answered ? '<span class="q-tag" style="background:var(--accent2-light);color:#065F46;">✓ 已思考</span>' : ''}</div></div>`;
  });

  html += `<div class="summary-card"><h4>📝 复习建议</h4><ul class="summary-list"><li>优先补充孤立节点的连接关系</li><li>多举具体例子来检验理解</li><li>记录易错点并反复对照</li><li>尝试用自己的话解释每个概念</li></ul></div>`;
  body.innerHTML = html;
  panel.classList.remove('hidden');
}

function focusQuestion(qId) {
  const q = state.reviewQuestions.find(x => x.id === qId);
  if (!q) return;
  state.answeredQuestions.add(qId);
  document.querySelectorAll('.node-group').forEach(g => g.style.opacity = '0.3');
  document.querySelectorAll('.edge-path').forEach(p => { p.style.strokeOpacity = '0.2'; });
  q.relatedNodeIds.forEach(nid => {
    const g = document.querySelector(`.node-group[data-id="${nid}"]`);
    if (g) { g.style.opacity = '1'; g.classList.add('selected'); setTimeout(() => g.classList.remove('selected'), 2000); }
  });
  q.relatedNodeIds.forEach(nid => {
    state.weakNodeIds.add(nid);
    const g = document.querySelector(`.node-group[data-id="${nid}"]`);
    if (g) g.classList.add('weak');
  });
  setTimeout(() => { document.querySelectorAll('.node-group').forEach(g => g.style.opacity = '1'); document.querySelectorAll('.edge-path').forEach(p => { p.style.strokeOpacity = '0.5'; }); }, 2000);
  showReviewPanel();
}

// ==================== 复习考察 ====================
function generateQuizQuestions() {
  const questions = [];
  const edgesWithNodes = state.edges.map(e => ({ edge: e, source: state.nodes.find(n => n.id === e.sourceId), target: state.nodes.find(n => n.id === e.targetId) })).filter(x => x.source && x.target);
  edgesWithNodes.slice(0, 4).forEach((item, idx) => {
    const otherNodes = state.nodes.filter(n => n.id !== item.source.id && n.id !== item.target.id);
    const wrongOptions = otherNodes.sort(() => Math.random() - 0.5).slice(0, 2).map(n => n.title);
    const allOptions = [item.target.title, ...wrongOptions].sort(() => Math.random() - 0.5);
    const correctIndex = allOptions.indexOf(item.target.title);
    questions.push({ id: `quiz_${idx}`, question: `"${item.source.title}" 和 "${item.edge.label}" 关系最紧密的是？`, options: allOptions, correctIndex, relatedNodeIds: [item.source.id, item.target.id] });
  });
  const conceptNodes = state.nodes.filter(n => n.type === 'concept');
  if (conceptNodes.length > 0) {
    const n = conceptNodes[0];
    questions.push({ id: `quiz_type`, question: `关于"${n.title}"，以下哪个说法最准确？`, options: [`它是一个核心概念，需要理解其内涵和边界`, `它只是一个具体的例子，不需要深入理解`, `它和主题完全没有关系`, `它是一个易混点，不需要掌握`], correctIndex: 0, relatedNodeIds: [n.id] });
  }
  state.quizQuestions = questions; state.quizCurrent = 0; state.quizScore = 0;
}

function showQuizPanel() {
  const panel = document.getElementById('sidePanel');
  const header = document.getElementById('panelHeader');
  const body = document.getElementById('panelBody');
  const total = state.quizQuestions.length, current = state.quizCurrent;
  header.innerHTML = `<h3>复习考察</h3><p>检验你对知识关系的理解 · 第 ${Math.min(current + 1, total)}/${total} 题</p>`;

  let html = `<div class="stats-grid"><div class="stat-card edges"><div class="stat-num">${state.quizScore}</div><div class="stat-label">答对</div></div><div class="stat-card weak"><div class="stat-num">${current - state.quizScore}</div><div class="stat-label">答错</div></div></div><div style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);"><span>答题进度</span><span>${current}/${total}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${(current/total)*100}%"></div></div></div>`;

  if (current < total) {
    const q = state.quizQuestions[current];
    html += `<div class="quiz-card"><div class="quiz-question">${q.question}</div><div class="quiz-options">${q.options.map((opt, i) => `<div class="quiz-option" onclick="answerQuiz(${i})">${opt}</div>`).join('')}</div><div class="quiz-feedback" id="quizFeedback"></div></div>`;
  } else {
    const scorePercent = total > 0 ? Math.round((state.quizScore / total) * 100) : 0;
    html += `<div class="summary-card" style="text-align:center;padding:24px;"><div style="font-size:var(--fs-5xl);margin-bottom:12px;">${scorePercent >= 80 ? '🎉' : scorePercent >= 60 ? '👍' : '💪'}</div><h4 style="font-size:var(--fs-xl);margin-bottom:8px;">复习完成！</h4><p style="font-size:var(--fs-3xl);font-weight:900;color:var(--accent);font-family:var(--font-mono);margin-bottom:16px;">${state.quizScore} / ${total}</p><p style="font-size:var(--fs-sm);color:var(--muted);line-height:1.7;">${scorePercent >= 80 ? '太棒了！你对这部分知识的掌握很扎实。' : scorePercent >= 60 ? '还不错！继续巩固薄弱节点，理解会更深入。' : '加油！建议回到搭建模式，重新梳理一下知识关系。'}</p></div><button class="confirm-btn" style="width:100%;margin-bottom:12px;" onclick="restartQuiz()">🔄 再练一次</button><button class="tool-btn" style="width:100%;height:auto;padding:12px;border-radius:12px;background:var(--bg);color:var(--muted);" onclick="switchMode('build')">返回搭建模式</button>`;
  }
  body.innerHTML = html;
  panel.classList.remove('hidden');
}

function answerQuiz(index) {
  const q = state.quizQuestions[state.quizCurrent];
  if (!q) return;
  const options = document.querySelectorAll('.quiz-option');
  const feedback = document.getElementById('quizFeedback');
  options.forEach((opt, i) => { opt.style.pointerEvents = 'none'; if (i === q.correctIndex) opt.classList.add('correct'); if (i === index && i !== q.correctIndex) opt.classList.add('wrong'); });
  const isCorrect = index === q.correctIndex;
  if (isCorrect) { state.quizScore++; feedback.className = 'quiz-feedback show correct'; feedback.textContent = '✅ 回答正确！你对这个关系理解得很清楚。'; }
  else { feedback.className = 'quiz-feedback show wrong'; feedback.textContent = '❌ 再想想看。理解知识之间的关系比记忆更重要哦。'; q.relatedNodeIds.forEach(nid => { state.weakNodeIds.add(nid); const g = document.querySelector(`.node-group[data-id="${nid}"]`); if (g) g.classList.add('weak'); }); }
  document.querySelectorAll('.node-group').forEach(g => g.style.opacity = '0.4');
  q.relatedNodeIds.forEach(nid => { const g = document.querySelector(`.node-group[data-id="${nid}"]`); if (g) g.style.opacity = '1'; });
  setTimeout(() => { state.quizCurrent++; showQuizPanel(); document.querySelectorAll('.node-group').forEach(g => g.style.opacity = '1'); }, 1800);
}

function restartQuiz() { state.quizCurrent = 0; state.quizScore = 0; state.quizQuestions = []; generateQuizQuestions(); showQuizPanel(); }

// ==================== 工具函数 ====================
function updateStats() { document.getElementById('nodeCount').textContent = state.nodes.length; document.getElementById('edgeCount').textContent = state.edges.length; }
</script>
</div>
</body>
</html>
