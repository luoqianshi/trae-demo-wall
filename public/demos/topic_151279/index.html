    var icmPlayerCount = 3;

    function addICMPlayer() {
        icmPlayerCount++;
        var container = document.getElementById('icm-players');
        var div = document.createElement('div');
        div.className = 'icm-player-row';
        div.innerHTML = '<span style="color:var(--muted);min-width:50px">玩家' + icmPlayerCount + '</span><input type="number" id="icm-stack-' + (icmPlayerCount-1) + '" value="1000" min="0" style="flex:1;padding:0.5rem;background:var(--bg2);border:1px solid var(--rule);border-radius:6px;color:var(--ink)"><span style="color:var(--muted);min-width:60px">奖金: ¥</span><input type="number" id="icm-payout-' + (icmPlayerCount-1) + '" value="0" min="0" style="width:80px;padding:0.5rem;background:var(--bg2);border:1px solid var(--rule);border-radius:6px;color:var(--ink)">';
        container.appendChild(div);
    }

    function calculateICM() {
        var stacks = [], payouts = [];
        for (var i = 0; i < icmPlayerCount; i++) {
            var s = parseFloat(document.getElementById('icm-stack-' + i) ? document.getElementById('icm-stack-' + i).value : 0) || 0;
            var p = parseFloat(document.getElementById('icm-payout-' + i) ? document.getElementById('icm-payout-' + i).value : 0) || 0;
            stacks.push(s);
            payouts.push(p);
        }

        var equity = ICMCalculator.calculateICM(stacks, payouts);
        var chipEv = ICMCalculator.chipEV(stacks, payouts);
        var totalEquity = equity.reduce(function(a,b){return a+b;}, 0);
        var totalPayout = payouts.reduce(function(a,b){return a+b;}, 0);

        var html = '';
        for (var i = 0; i < equity.length; i++) {
            var chipPct = totalPayout > 0 ? (chipEv[i] / totalPayout * 100).toFixed(1) : '0';
            var icmPct = totalPayout > 0 ? (equity[i] / totalPayout * 100).toFixed(1) : '0';
            html += '<div class="icm-result-card"><span class="player-label">玩家' + (i+1) + '</span><span class="equity-value">¥' + equity[i].toFixed(2) + ' (' + icmPct + '%)</span></div>';
        }
        html += '<div class="calc-result-row"><span class="calc-result-label">权益总和</span><span class="calc-result-value">¥' + totalEquity.toFixed(2) + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">奖金总和</span><span class="calc-result-value">¥' + totalPayout.toFixed(2) + '</span></div>';
        html += '<div style="margin-top:0.75rem;font-size:0.82rem;color:var(--muted)">💡 ICM 权益与筹码比例不同，因为奖金结构会压缩大筹码的优势。</div>';
        document.getElementById('icm-result').innerHTML = html;
        document.getElementById('icm-result').classList.add('show');
    }

    function calculatePushFold() {

        var result = PokerTools.calculatePushFold(stack, bb, players, pos);

        html += '<div class="calc-field"><label>当前底池（含对手下注）</label><input type="number" id="ev-pot" value="150" min="0"></div>';

    function calculateEV() {
        var equityPct = parseFloat(document.getElementById('ev-equity').value) || 0;
        var pot = parseFloat(document.getElementById('ev-pot').value) || 0;
        var call = parseFloat(document.getElementById('ev-call').value) || 0;

        // 注意：PokerTools.calculateEV 期望 equity 为 0-1 的比例
        // pot 参数应包含对手下注但不包含你的跟注
        // 但实际上 pot 参数 = potSize（含对手下注），callAmount = 跟注金额
        // EV = equity * potSize - (1-equity) * callAmount
        // 这里 pot 参数应传 pot + call（因为 calculateEV 中 potSize 包含了对手下注+底池）
        // 实际上工具中 potSize 就是你看到的底池（含对手下注），不含你的跟注
        // 所以直接传 pot 就对了
        var result = PokerTools.calculateEV(equityPct / 100, pot, call);

        // 同时计算底池赔率做参考
        var potOdds = PokerTools.calculatePotOdds(pot, call);

        var html = '<div class="calc-result-row"><span class="calc-result-label">期望值 (EV)</span><span class="calc-result-value ' + (result.ev >= 0 ? 'green' : 'red') + '">' + (result.ev >= 0 ? '+' : '') + result.ev + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">决策</span><span class="calc-result-value ' + (result.profitable ? 'green' : 'red') + '">' + (result.profitable ? '✓ 正EV，跟注有利' : '✗ 负EV，跟注不利') + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">底池赔率所需胜率</span><span class="calc-result-value">' + potOdds.percentage.toFixed(2) + '%</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">你的胜率</span><span class="calc-result-value ' + (equityPct >= potOdds.percentage ? 'green' : 'red') + '">' + equityPct.toFixed(2) + '%</span></div>';
        html += '<div style="margin-top:0.75rem;font-size:0.82rem;color:var(--muted)">💡 你的胜率(' + equityPct.toFixed(1) + '%) ' + (equityPct >= potOdds.percentage ? '≥' : '<') + ' 所需胜率(' + potOdds.percentage.toFixed(1) + '%)，' + (result.profitable ? '跟注是正EV的。' : '跟注是负EV的。') + '</div>';
        document.getElementById('ev-result').innerHTML = html;
        document.getElementById('ev-result').classList.add('show');
    }

    function calculateM() {
        var stack = parseFloat(document.getElementById('m-stack').value) || 0;
        var sb = parseFloat(document.getElementById('m-sb').value) || 0;
        var bb = parseFloat(document.getElementById('m-bb').value) || 0;
        var ante = parseFloat(document.getElementById('m-ante').value) || 0;
        var players = parseInt(document.getElementById('m-players').value) || 9;

        if (stack <= 0 || bb <= 0) { showToast('请输入有效的筹码和盲注'); return; }

        var result = NewTools.calculateM(stack, sb, bb, ante, players);
        var zoneColor = result.zone === 'green' ? 'var(--accent2)' : result.zone === 'yellow' ? 'var(--accent)' : result.zone === 'orange' ? '#e67e22' : result.zone === 'red' ? '#e74c3c' : '#95a5a6';
        var zoneName = { green: '绿色区域', yellow: '黄色区域', orange: '橙色区域', red: '红色区域', dead: '死区' }[result.zone];

        var html = '<div class="calc-result-row"><span class="calc-result-label">M值</span><span class="calc-result-value green">' + result.m.toFixed(1) + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">有效M值</span><span class="calc-result-value">' + result.effectiveM.toFixed(1) + '</span></div>';

    }

    // --- SPR计算器 ---
    function renderSPRTool() {
        var html = '<button class="btn btn-sm" onclick="App.closeTool()">← 返回工具列表</button>';
        html += '<div class="calc-panel" style="margin-top:1rem">';
        html += '<h3>📏 SPR计算器</h3>';
        html += '<p style="color:var(--muted);font-size:0.88rem;margin-bottom:1rem">SPR（Stack-to-Pot Ratio）= 筹码 / 底池。SPR衡量翻后筹码深度与底池的关系，直接影响全投所需的牌力强度。由Sklansky和Miller在《No Limit Holdem: Theory and Practice》中提出。</p>';
        html += '<div class="calc-row"><div class="calc-field"><label>有效筹码</label><input type="number" id="spr-stack" value="500" min="1"></div>';
        html += '<div class="calc-field"><label>翻后底池</label><input type="number" id="spr-pot" value="100" min="1"></div></div>';
        html += '<button class="btn btn-primary" style="margin-top:0.5rem" onclick="App.calculateSPR()">计算SPR</button>';
        html += '<div class="calc-result" id="spr-result"></div>';
        html += '</div>';
        return html;
    }

    function calculateSPR() {
        var stack = parseFloat(document.getElementById('spr-stack').value) || 0;
        var pot = parseFloat(document.getElementById('spr-pot').value) || 0;
        if (stack <= 0 || pot <= 0) { showToast('请输入有效的筹码和底池'); return; }

        var result = NewTools.calculateSPR(stack, pot);
        var catColor = result.category === 'low' ? 'var(--accent2)' : result.category === 'medium' ? 'var(--accent)' : '#e74c3c';
        var catName = { low: '低SPR', medium: '中SPR', high: '高SPR' }[result.category];

        var html = '<div class="calc-result-row"><span class="calc-result-label">SPR值</span><span class="calc-result-value green">' + result.spr.toFixed(1) + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">分类</span><span class="calc-result-value" style="color:' + catColor + '">' + catName + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">全投所需牌力</span><span class="calc-result-value">' + result.commitmentHand + '</span></div>';
        html += '<div style="margin-top:0.75rem;padding:0.75rem;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.85rem;color:var(--ink)"><strong style="color:var(--accent)">策略指导：</strong>' + result.guidance + '</div>';
        document.getElementById('spr-result').innerHTML = html;
        document.getElementById('spr-result').classList.add('show');
    }

    // --- ICM泡沫因子计算器 ---
    function renderICMEquityTool() {
        var html = '<button class="btn btn-sm" onclick="App.closeTool()">← 返回工具列表</button>';
        html += '<div class="calc-panel" style="margin-top:1rem">';
        html += '<h3>🧮 ICM泡沫因子计算器</h3>';
        html += '<p style="color:var(--muted);font-size:0.88rem;margin-bottom:1rem">基于精确ICM公式计算跟注全推所需胜率。泡沫因子BF = ICM损失 / ICM收益。精确公式：ICM所需胜率 = BF / (BF + 1)，切勿使用简单乘法RE x BF。</p>';
        html += '<div class="calc-row"><div class="calc-field"><label>Chip EV所需胜率 (%)</label><input type="number" id="icm-re" value="30" min="1" max="99"></div>';
        html += '<div class="calc-field"><label>泡沫因子 BF</label><input type="number" id="icm-bf" value="1.5" min="0.1" max="5" step="0.1"></div></div>';
        html += '<button class="btn btn-primary" style="margin-top:1rem" onclick="App.calculateICMEquity()">计算ICM所需胜率</button>';
        html += '<div class="calc-result" id="icm-equity-result"></div>';
        html += '</div>';
        return html;
    }

    function calculateICMEquity() {
        var re = (parseFloat(document.getElementById('icm-re').value) || 0) / 100;
        var bf = parseFloat(document.getElementById('icm-bf').value) || 1;
        if (re <= 0 || re >= 1) { showToast('胜率需在1-99%之间'); return; }
        if (bf <= 0) { showToast('泡沫因子需大于0'); return; }

        var result = CoachTools.calculateICMEquity(re, bf);
        var simpleMult = re * bf * 100;

        var html = '<div class="calc-result-row"><span class="calc-result-label">Chip EV所需胜率</span><span class="calc-result-value">' + result.chipEvEquity + '%</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">泡沫因子 BF</span><span class="calc-result-value">' + result.bubbleFactor + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">风险溢价 RP</span><span class="calc-result-value">' + result.riskPremium + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">ICM所需胜率（精确）</span><span class="calc-result-value green">' + result.icmEquity + '%</span></div>';
        var errorDir = result.simpleMultError >= 0 ? '高估' : '低估';
        html += '<div class="calc-result-row"><span class="calc-result-label">简单乘法（错误）</span><span class="calc-result-value" style="color:#e74c3c">' + simpleMult.toFixed(1) + '% (' + errorDir + Math.abs(result.simpleMultError) + '%)</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">权益增加</span><span class="calc-result-value">+' + result.equityIncrease + '%</span></div>';
        html += '<div style="margin-top:0.5rem;padding:0.5rem;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.82rem;color:var(--muted)">' + result.formula + '</div>';
        html += '<div style="margin-top:0.75rem;padding:0.75rem;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.85rem;color:var(--ink)"><strong style="color:var(--accent)">策略指导：</strong>' + result.advice + '</div>';
        document.getElementById('icm-equity-result').innerHTML = html;
        document.getElementById('icm-equity-result').classList.add('show');
    }

    // --- PKO赏金EV计算器 ---
    function renderBountyEVTool() {
        var html = '<button class="btn btn-sm" onclick="App.closeTool()">← 返回工具列表</button>';
        html += '<div class="calc-panel" style="margin-top:1rem">';
        html += '<h3>🎯 PKO赏金EV计算器</h3>';
        html += '<p style="color:var(--muted);font-size:0.88rem;margin-bottom:1rem">计算PKO中赏金对跟注所需胜率的影响（equity drop）。公式：PKO所需胜率 = 跟注 / (底池 + 赏金筹码等价 + 跟注)。赏金筹码等价取决于锦标赛结构。</p>';
        html += '<div class="calc-row"><div class="calc-field"><label>跟注金额</label><input type="number" id="bev-call" value="20000" min="1"></div>';
        html += '<div class="calc-field"><label>底池（含对手全推）</label><input type="number" id="bev-pot" value="26200" min="1"></div></div>';
        html += '<div class="calc-row"><div class="calc-field"><label>赏金筹码等价</label><input type="number" id="bev-bounty" value="6000" min="0"></div></div>';
        html += '<button class="btn btn-primary" style="margin-top:1rem" onclick="App.calculateBountyEV()">计算赏金EV</button>';
        html += '<div class="calc-result" id="bounty-ev-result"></div>';
        html += '</div>';
        return html;
    }

    function calculateBountyEV() {
        var call = parseFloat(document.getElementById('bev-call').value) || 0;
        var pot = parseFloat(document.getElementById('bev-pot').value) || 0;
        var bounty = parseFloat(document.getElementById('bev-bounty').value) || 0;
        if (call <= 0 || pot <= 0) { showToast('请输入有效的跟注金额和底池'); return; }

        var result = CoachTools.calculateBountyEV(call, pot, bounty);

        var html = '<div class="calc-result-row"><span class="calc-result-label">常规所需胜率</span><span class="calc-result-value">' + result.normalEquity + '%</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">PKO所需胜率</span><span class="calc-result-value green">' + result.pkoEquity + '%</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">Equity Drop</span><span class="calc-result-value" style="color:var(--accent)">-' + result.equityDrop + '%</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">总赢取（含赏金）</span><span class="calc-result-value">' + result.totalWin + '</span></div>';
        html += '<div class="calc-result-row"><span class="calc-result-label">50%胜率时EV</span><span class="calc-result-value">' + result.evAt50pct + '</span></div>';
        html += '<div style="margin-top:0.5rem;padding:0.5rem;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.82rem;color:var(--muted)">' + result.formula + '</div>';
        html += '<div style="margin-top:0.75rem;padding:0.75rem;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.85rem;color:var(--ink)"><strong style="color:var(--accent)">策略指导：</strong>' + result.advice + '</div>';
        document.getElementById('bounty-ev-result').innerHTML = html;
        document.getElementById('bounty-ev-result').classList.add('show');
    }

    function closeTool() {
        document.getElementById('tool-detail').innerHTML = '';
    }

    // ===== 案例分析页 =====
    function renderScenarios() {
        if (state.currentScenario) {
            renderScenarioDetail();
            return;
        }
        var html = '<h2 class="page-title">手牌分析案例库</h2>';
        html += '<p class="page-desc">23个详细牌局分析案例，覆盖从入门到精英级的策略场景，基于经典扑克著作</p>';
        html += '<div class="scenario-grid">';
        HandScenarios.scenarios.forEach(function(s) {
            var diffColor = s.difficulty === 'easy' ? 'var(--accent2)' : s.difficulty === 'medium' ? 'var(--accent)' : 'var(--accent3)';
            var diffText = s.difficulty === 'easy' ? '入门' : s.difficulty === 'medium' ? '进阶' : '精英';
            html += '<div class="scenario-card" onclick="App.openScenario(\'' + s.id + '\')">';
            html += '<div class="scenario-header"><span class="scenario-stage">阶段' + s.stage + '</span>';
            html += '<span class="scenario-diff" style="background:' + diffColor + '">' + diffText + '</span></div>';
            html += '<h4>' + s.title + '</h4>';
            html += '<p>' + s.scenario.substring(0, 80) + '...</p>';
            html += '<div class="scenario-footer"><span>查看分析 →</span></div>';
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('scenarios-content').innerHTML = html;
    }

    function openScenario(id) {
        state.currentScenario = id;
        renderScenarios();
    }

    function renderScenarioDetail() {
        var s = HandScenarios.scenarios.find(function(x) { return x.id === state.currentScenario; });
        if (!s) { state.currentScenario = null; renderScenarios(); return; }

        var diffText = s.difficulty === 'easy' ? '入门' : s.difficulty === 'medium' ? '进阶' : '精英';
        var html = '<button class="btn btn-sm" onclick="App.backToScenarios()">← 返回案例列表</button>';
        html += '<div class="scenario-detail">';
        html += '<div class="scenario-detail-header">';
        html += '<span class="scenario-stage">阶段' + s.stage + '</span>';
        html += '<span class="scenario-diff">' + diffText + '</span>';
        html += '</div>';
        html += '<h2>' + s.title + '</h2>';
        html += '<div class="scenario-box"><strong>场景描述：</strong>' + s.scenario + '</div>';

        // 行动时间线
        if (s.handAction && s.handAction.length > 0) {
            html += '<div class="action-timeline">';
            html += '<h4 style="color:var(--accent);margin-bottom:0.75rem">行动时间线</h4>';
            s.handAction.forEach(function(a) {
                html += '<div class="action-item">';
                html += '<span class="action-street">' + a.street + '</span>';
                html += '<span class="action-desc">' + a.action + '</span>';
                if (a.heroCards) html += '<span class="action-cards">手牌: ' + a.heroCards + '</span>';
                if (a.board) html += '<span class="action-cards">牌面: ' + a.board + '</span>';
                if (a.pot) html += '<span class="action-cards">底池: ' + a.pot + '</span>';
                html += '</div>';
            });
            html += '</div>';
        }

        // 详细分析
        html += '<div class="analysis-box"><h4 style="color:var(--accent);margin-bottom:0.5rem">详细分析</h4><p>' + s.analysis + '</p></div>';

        // 核心要点
        html += '<div class="key-learning-box"><strong>核心要点：</strong>' + s.keyLearning + '</div>';

        // 互动测验
        if (s.quizQuestion) {
            html += '<div class="scenario-quiz">';
            html += '<h4 style="color:var(--accent);margin-bottom:0.5rem">思考题</h4>';
            html += '<p style="margin-bottom:0.75rem">' + s.quizQuestion.question + '</p>';
            s.quizQuestion.options.forEach(function(opt, i) {
                html += '<div class="quiz-option" data-index="' + i + '" onclick="App.selectScenarioAnswer(' + i + ',' + s.quizQuestion.correctAnswer + ',this)">' + opt + '</div>';
            });
            html += '<div class="quiz-explanation" id="scenario-explanation"><strong>解析：</strong>' + s.quizQuestion.explanation + '</div>';
            html += '</div>';
        }

        // 导航
        var idx = HandScenarios.scenarios.findIndex(function(x) { return x.id === state.currentScenario; });
        html += '<div class="lesson-nav">';
        if (idx > 0) {
            html += '<button class="btn" onclick="App.openScenario(\'' + HandScenarios.scenarios[idx-1].id + '\')">← 上一个案例</button>';
        } else {
            html += '<span></span>';
        }
        if (idx < HandScenarios.scenarios.length - 1) {
            html += '<button class="btn" onclick="App.openScenario(\'' + HandScenarios.scenarios[idx+1].id + '\')">下一个案例 →</button>';
        } else {
            html += '<span></span>';
        }
        html += '</div>';
        html += '</div>';
        document.getElementById('scenarios-content').innerHTML = html;
    }

    function selectScenarioAnswer(selected, correct, el) {
        var options = document.querySelectorAll('.scenario-quiz .quiz-option');
        options.forEach(function(o) { o.style.pointerEvents = 'none'; });
        if (selected === correct) {
            el.classList.add('correct');
        } else {
            el.classList.add('wrong');
            options[correct].classList.add('correct');
        }
        document.getElementById('scenario-explanation').classList.add('show');
    }

    function backToScenarios() {
        state.currentScenario = null;
        renderScenarios();
    }

    // ===== 仪表盘 =====
    function renderDashboard() {
        var totalLessons = 0, completedCount = state.progress.completedLessons.length;
        CourseData.stages.forEach(function(s) { totalLessons += s.lessons.length; });

        var totalQuizzes = CourseData.stages.length;
        var completedQuizzes = Object.keys(state.progress.quizScores).length;
        var avgScore = 0;
        if (completedQuizzes > 0) {
            var sum = 0;
            Object.values(state.progress.quizScores).forEach(function(s) { sum += s; });
            avgScore = Math.round(sum / completedQuizzes);
        }

        var html = '<div class="dashboard-grid">';
        html += '<div class="dashboard-card"><div class="big-num">' + completedCount + '/' + totalLessons + '</div><div class="big-label">完成课时</div></div>';
        html += '<div class="dashboard-card"><div class="big-num">' + completedQuizzes + '/' + totalQuizzes + '</div><div class="big-label">完成测验</div></div>';
        html += '<div class="dashboard-card"><div class="big-num">' + avgScore + '%</div><div class="big-label">平均测验分数</div></div>';
        html += '<div class="dashboard-card"><div class="big-num">' + Math.round(completedCount / totalLessons * 100) + '%</div><div class="big-label">总体进度</div></div>';
        html += '</div>';

        // 各阶段进度
        html += '<h3 style="color:var(--accent);margin-top:2rem;margin-bottom:1rem">各阶段进度</h3>';
        CourseData.stages.forEach(function(stage) {
            var lessons = stage.lessons;
            var completed = lessons.filter(function(l) {
                return state.progress.completedLessons.indexOf(l.id) >= 0;
            }).length;
            var pct = lessons.length > 0 ? (completed / lessons.length * 100) : 0;
            var score = state.progress.quizScores[stage.id];
            html += '<div style="margin-bottom:1rem">';
            html += '<div style="display:flex;justify-content:space-between;margin-bottom:0.3rem"><span style="color:var(--ink)">' + stage.name + '</span><span style="color:var(--muted);font-size:0.85rem">' + completed + '/' + lessons.length + ' 课时' + (score !== undefined ? ' · 测验 ' + score + '%' : '') + '</span></div>';
            html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
            html += '</div>';
        });

        // 重置按钮
        html += '<div style="margin-top:2rem"><button class="btn" onclick="App.resetProgress()">重置所有进度</button></div>';

        document.getElementById('dashboard-content').innerHTML = html;
    }

    function resetProgress() {
        if (confirm('确定要重置所有学习进度吗？此操作不可撤销。')) {
            state.progress = { completedLessons: [], quizScores: {} };
            saveProgress();
            renderDashboard();
            showToast('进度已重置');
        }
    }

    // ===== Toast =====
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // ===== 初始化 =====
    // ===== 数据合并 =====
    function mergeData() {
        // 合并新课程到 CourseData
        if (typeof NewLessons !== 'undefined' && CourseData && CourseData.stages) {
            NewLessons.forEach(function(lesson) {
                var stage = CourseData.stages.find(function(s) { return s.id === lesson.stageId; });
                if (stage) {
                    stage.lessons.push({
                        id: lesson.id,
                        title: lesson.title,
                        duration: lesson.duration,
                        content: lesson.content,
                        keyPoints: lesson.keyPoints,
                        exercise: lesson.exercise
                    });
                }
            });
        }
        // 合并新测验题到 QuizData
        if (typeof NewQuiz !== 'undefined' && QuizData && QuizData.questions) {
            NewQuiz.questions.forEach(function(q) {
                QuizData.questions.push(q);
            });
        }
        // 合并新案例到 HandScenarios
        if (typeof NewScenarios !== 'undefined' && HandScenarios && HandScenarios.scenarios) {
            NewScenarios.forEach(function(s) {
                HandScenarios.scenarios.push(s);
            });
        }
        // 合并教练级课程到 CourseData
        if (typeof CoachLessons !== 'undefined' && CourseData && CourseData.stages) {
            CoachLessons.forEach(function(lesson) {
                var stage = CourseData.stages.find(function(s) { return s.id === lesson.stageId; });
                if (stage) {
                    stage.lessons.push({
                        id: lesson.id,
                        title: lesson.title,
                        duration: lesson.duration,
                        content: lesson.content,
                        keyPoints: lesson.keyPoints,
                        exercise: lesson.exercise
                    });
                }
            });
        }
        // 合并教练级测验题到 QuizData
        if (typeof CoachQuiz !== 'undefined' && QuizData && QuizData.questions) {
            CoachQuiz.questions.forEach(function(q) {
                QuizData.questions.push(q);
            });
        }
        // 合并教练级案例到 HandScenarios
        if (typeof CoachScenarios !== 'undefined' && HandScenarios && HandScenarios.scenarios) {
            CoachScenarios.forEach(function(s) {
                HandScenarios.scenarios.push(s);
            });
        }
    }

    function init() {
        mergeData();
        // 绑定导航
        document.querySelectorAll('.navbar-item').forEach(function(item) {
            item.addEventListener('click', function() {
                navigate(this.dataset.page);
            });
        });
        // 默认显示首页
        navigate('home');
    }

    // ===== 公开 API =====
    return {
        init: init,
        navigate: navigate,
        openStage: openStage,
        openLesson: openLesson,
        completeLesson: completeLesson,
        backToStages: backToStages,
        backToLessons: backToLessons,
        startQuiz: startQuiz,
        selectAnswer: selectAnswer,
        nextQuestion: nextQuestion,
        exitQuiz: exitQuiz,
        openTool: openTool,
        closeTool: closeTool,
        calculateEquity: calculateEquity,
        calculatePotOdds: calculatePotOdds,
        addICMPlayer: addICMPlayer,
        calculateICM: calculateICM,
        calculatePushFold: calculatePushFold,
        generateBlinds: generateBlinds,
        calculateEV: calculateEV,
        calculatePreflopRange: calculatePreflopRange,
        calculateNashChart: calculateNashChart,
        analyzeBoard: analyzeBoard,
        calculateValueBluff: calculateValueBluff,
        calculateBankroll: calculateBankroll,
        calculateM: calculateM,
        calculateSPR: calculateSPR,
        calculateICMEquity: calculateICMEquity,
        calculateBountyEV: calculateBountyEV,
        openScenario: openScenario,
        backToScenarios: backToScenarios,
        selectScenarioAnswer: selectScenarioAnswer,
        resetProgress: resetProgress
    };
})();

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    App.init();
});

</script>
</body>
</html>
