<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 识别确认</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    :root {
      --confirm-bg: #fbfbfa;
      --confirm-card: rgba(255, 255, 255, 0.96);
      --confirm-line: rgba(226, 226, 223, 0.86);
      --confirm-shadow: 0 8px 22px rgba(23, 23, 23, 0.055);
    }

    .app {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98) 0%, var(--confirm-bg) 46%, #f7f7f5 100%);
    }

    .nav-bar.confirm-nav {
      height: 48px;
      align-items: center;
      padding-top: 0;
    }

    .confirm-nav .nav-title {
      font-size: 25px;
      font-weight: 690;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    .confirm-nav .nav-btn {
      color: #171717;
    }

    .confirm-page {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px calc(var(--home-indicator-h) + 18px);
      overscroll-behavior: contain;
    }

    .confirm-subtitle {
      margin-top: 0;
      text-align: center;
      color: #747474;
      font-size: 13px;
      font-weight: 430;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .outfit-preview {
      margin-top: 8px;
      width: 100%;
      height: 284px;
      border-radius: 18px;
      overflow: hidden;
      background: #eeece8;
      box-shadow: 0 6px 16px rgba(23, 23, 23, 0.055);
    }

    .outfit-preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 48%;
    }

    .recognized-items {
      margin-top: 10px;
      display: grid;
      gap: 7px;
    }

    .recognition-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 7px 10px 7px 7px;
      border: 1px solid var(--confirm-line);
      border-radius: 13px;
      background: var(--confirm-card);
      box-shadow: 0 4px 12px rgba(23, 23, 23, 0.04);
    }

    .item-photo {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      background: #efefec;
      box-shadow: inset 0 0 0 1px rgba(23,23,23,0.04);
      flex: 0 0 auto;
    }

    .item-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .crop-cardigan { object-position: 49% 30%; transform: scale(1.85); }
    .crop-top { object-position: 48% 37%; transform: scale(2.15); }
    .crop-pants { object-position: 49% 67%; transform: scale(1.75); }
    .crop-shoes { object-position: 50% 94%; transform: scale(2.35); }
    .crop-bag { object-position: 69% 35%; transform: scale(2.2); }

    .item-info {
      min-width: 0;
      align-self: center;
    }

    .item-name {
      color: #171717;
      font-size: 15.5px;
      font-weight: 620;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .item-meta {
      margin-top: 4px;
      color: #6c6c6c;
      font-size: 11px;
      font-weight: 430;
      line-height: 1.15;
      letter-spacing: 0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #4d4d4d;
      flex: 0 0 auto;
    }

    .status-check {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1.5px solid #8488e8;
      border-radius: 50%;
      color: #8488e8;
      background: rgba(255,255,255,0.82);
    }

    .edit-button {
      min-width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: #4d4d4d;
      font: 500 13px/1 var(--font-body);
      letter-spacing: 0;
      cursor: pointer;
      padding: 0;
    }

    .ai-row {
      width: 100%;
      min-height: 58px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 8px;
      padding: 10px 11px;
      border: 1px solid var(--confirm-line);
      border-radius: 11px;
      background: var(--confirm-card);
      box-shadow: 0 4px 12px rgba(23, 23, 23, 0.04);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .ai-spark {
      width: 20px;
      height: 20px;
      color: #8488e8;
    }

    .ai-heading {
      display: block;
      color: #232323;
      font-size: 14px;
      font-weight: 610;
      line-height: 1.12;
      letter-spacing: -0.005em;
    }

    .ai-copy {
      display: block;
      margin-top: 2px;
      color: #747474;
      font-size: 11px;
      font-weight: 420;
      line-height: 1.2;
      letter-spacing: 0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      color: #6d6d6d;
    }

    .actions {
      display: grid;
      gap: 7px;
      margin: 10px 0 0;
    }

    .primary-action,
    .secondary-action {
      width: 100%;
      min-height: 45px;
      border-radius: 11px;
      font: 620 15px/1 var(--font-body);
      letter-spacing: -0.005em;
      cursor: pointer;
    }

    .primary-action {
      border: 0;
      color: #fff;
      background:
        radial-gradient(circle at 72% 24%, rgba(255,255,255,0.12), transparent 28%),
        #171717;
      box-shadow: 0 7px 16px rgba(23, 23, 23, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .primary-action svg {
      color: #aeb1ff;
    }

    .secondary-action {
      border: 1px solid rgba(226, 226, 223, 0.9);
      color: #5f5f5f;
      background: rgba(255,255,255,0.62);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .toast {
      z-index: 80;
    }

    @media (max-height: 820px) {
      .nav-bar.confirm-nav { height: 44px; }
      .outfit-preview { height: 252px; margin-top: 7px; }
      .recognized-items { gap: 6px; margin-top: 9px; }
      .recognition-row {
        min-height: 56px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .actions { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">09:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="18" height="4" rx="1"/><rect x="2" y="4" width="14" height="4" rx="1"/><rect x="4" y="0" width="10" height="4" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 1 4.5 4.5v4a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V6A4.5 4.5 0 0 1 8 1.5z"/></svg>
      </div>
    </div>

    <div class="app">
      <div class="nav-bar confirm-nav">
        <button class="nav-btn left" aria-label="返回" type="button" onclick="history.back()">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="nav-title">识别确认</div>
        <div class="nav-btn right" aria-hidden="true"></div>
      </div>

      <main class="confirm-page">
        <p class="confirm-subtitle">AI 已识别出以下穿搭单品，你可以编辑或调整</p>

        <section class="outfit-preview" aria-label="待确认穿搭照片">
          <img src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="待确认的全身穿搭自拍" />
        </section>

        <section class="recognized-items" aria-label="识别到的穿搭单品">
          <article class="recognition-row">
            <div class="item-photo">
              <img class="crop-cardigan" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="针织开衫缩略图" />
            </div>
            <div class="item-info">
              <div class="item-name">针织开衫</div>
              <div class="item-meta">灰色　｜　基础款　｜　春秋</div>
            </div>
            <div class="row-actions">
              <span class="status-check" aria-label="已确认">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <button class="edit-button" type="button" data-item="针织开衫">编辑</button>
            </div>
          </article>

          <article class="recognition-row">
            <div class="item-photo">
              <img class="crop-top" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="内搭上衣缩略图" />
            </div>
            <div class="item-info">
              <div class="item-name">内搭上衣</div>
              <div class="item-meta">米白色　｜　V领　｜　春秋</div>
            </div>
            <div class="row-actions">
              <span class="status-check" aria-label="已确认">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <button class="edit-button" type="button" data-item="内搭上衣">编辑</button>
            </div>
          </article>

          <article class="recognition-row">
            <div class="item-photo">
              <img class="crop-pants" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="阔腿长裤缩略图" />
            </div>
            <div class="item-info">
              <div class="item-name">阔腿长裤</div>
              <div class="item-meta">米色　｜　高腰　｜　垂坠感</div>
            </div>
            <div class="row-actions">
              <span class="status-check" aria-label="已确认">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <button class="edit-button" type="button" data-item="阔腿长裤">编辑</button>
            </div>
          </article>

          <article class="recognition-row">
            <div class="item-photo">
              <img class="crop-shoes" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="浅口单鞋缩略图" />
            </div>
            <div class="item-info">
              <div class="item-name">浅口单鞋</div>
              <div class="item-meta">米色　｜　简约　｜　通勤</div>
            </div>
            <div class="row-actions">
              <span class="status-check" aria-label="已确认">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <button class="edit-button" type="button" data-item="浅口单鞋">编辑</button>
            </div>
          </article>

          <article class="recognition-row">
            <div class="item-photo">
              <img class="crop-bag" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="单肩包缩略图" />
            </div>
            <div class="item-info">
              <div class="item-name">单肩包</div>
              <div class="item-meta">深棕/黑色　｜　柔软皮质　｜　通勤</div>
            </div>
            <div class="row-actions">
              <span class="status-check" aria-label="已确认">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <button class="edit-button" type="button" data-item="单肩包">编辑</button>
            </div>
          </article>
        </section>

        <button class="ai-row" id="insightButton" type="button" aria-label="查看 AI 穿搭洞察">
          <svg class="ai-spark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7L11 3.5z" fill="currentColor"/>
            <path d="M18.5 14.5l.85 2.15L21.5 17.5l-2.15.85-.85 2.15-.85-2.15-2.15-.85 2.15-.85.85-2.15z" fill="currentColor" opacity="0.66"/>
          </svg>
          <span>
            <span class="ai-heading">AI 穿搭洞察</span>
            <span class="ai-copy">整体风格简约柔和，配色和谐，适合日常通勤与约会场景。</span>
          </span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <div class="actions">
          <button class="primary-action" id="saveResult" type="button">
            <span>确认并保存穿搭</span>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" fill="currentColor"/>
              <path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75L19 15z" fill="currentColor" opacity="0.72"/>
            </svg>
          </button>
          <button class="secondary-action" id="retryRecognition" type="button">
            <span>重新识别</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </main>

      <div class="toast" id="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="toastText">已保存到衣橱，并生成今日参考</span>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    (function () {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      const saveResult = document.getElementById('saveResult');
      const retryRecognition = document.getElementById('retryRecognition');
      const insightButton = document.getElementById('insightButton');

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add('show');
        window.setTimeout(() => toast.classList.remove('show'), 1200);
      }

      document.querySelectorAll('.edit-button').forEach(button => {
        button.addEventListener('click', () => {
          showToast(`${button.dataset.item} 可以在保存后继续编辑`);
        });
      });

      insightButton.addEventListener('click', () => {
        showToast('这套适合日常通勤与轻约会场景');
      });

      retryRecognition.addEventListener('click', () => {
        window.location.href = 'ai-capture.html';
      });

      saveResult.addEventListener('click', () => {
        showToast('已保存到衣橱，并生成今日参考');
        window.setTimeout(() => {
          window.location.href = 'memory-detail.html';
        }, 850);
      });
    })();
  </script>
</body>
</html>
