<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 我的</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    body {
      background: #efefed;
    }

    .device {
      background:
        radial-gradient(circle at 16% 0%, rgba(255,255,255,0.96), transparent 26%),
        linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .status-bar {
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
    }

    .app {
      background: transparent;
    }

    .me-page {
      height: 100%;
      overflow-y: auto;
      padding: 4px 24px 98px;
      scrollbar-width: none;
    }

    .me-page::-webkit-scrollbar {
      display: none;
    }

    .top-action {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 2px;
    }

    .bell-btn {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
    }

    .profile {
      display: grid;
      grid-template-columns: 66px 1fr;
      gap: 14px;
      align-items: center;
      margin-top: 0;
    }

    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      overflow: hidden;
      background: #e7e4dc;
      box-shadow: 0 10px 26px rgba(23,23,23,0.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 28%;
      filter: saturate(0.94) contrast(0.98);
    }

    .identity-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .me-name {
      font-family: "SF Pro Display", "PingFang SC", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.06;
      font-weight: 620;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .edit-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      color: var(--tertiary);
      display: grid;
      place-items: center;
    }

    .wearwell-id {
      margin-top: 7px;
      font-size: 12.5px;
      line-height: 1.2;
      font-weight: 500;
      color: #85858f;
      letter-spacing: -0.01em;
    }

    .profile-note {
      margin-top: 12px;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 500;
      color: #85858f;
      letter-spacing: -0.01em;
    }

    .ai-card {
      margin-top: 16px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--ai-accent) 22%, white);
      background:
        radial-gradient(circle at 84% 50%, color-mix(in srgb, var(--ai-accent) 18%, transparent) 0 18%, transparent 29%),
        rgba(255,255,255,0.74);
      display: grid;
      grid-template-columns: 1fr 38px;
      align-items: center;
      padding: 0 12px 0 14px;
      box-shadow: 0 12px 34px rgba(138,143,216,0.07);
    }

    .ai-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      line-height: 1.1;
      font-weight: 640;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .pro-pill {
      height: 18px;
      padding: 0 7px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--ai-accent) 82%, white);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
    }

    .ai-sub {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.2;
      color: #85858f;
      letter-spacing: -0.01em;
    }

    .ai-visual {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: color-mix(in srgb, var(--ai-accent) 52%, white);
    }

    .ai-spark {
      color: color-mix(in srgb, var(--ai-accent) 52%, white);
    }

    .ai-arrow {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--ai-accent) 12%, white);
      color: #666676;
      display: grid;
      place-items: center;
    }

    .group {
      margin-top: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.78);
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(23,23,23,0.045);
    }

    .group:first-of-type {
      margin-top: 14px;
    }

    .setting-row {
      width: 100%;
      min-height: 48px;
      border: 0;
      background: transparent;
      display: grid;
      grid-template-columns: 30px 1fr auto 16px;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      color: var(--fg);
      text-align: left;
      font: inherit;
      position: relative;
      text-decoration: none;
    }

    .setting-row + .setting-row::before {
      content: "";
      position: absolute;
      top: 0;
      left: 42px;
      right: 12px;
      height: 1px;
      background: rgba(226,226,223,0.92);
    }

    .row-icon {
      width: 21px;
      height: 21px;
      color: #171717;
      display: grid;
      place-items: center;
    }

    .row-title {
      font-size: 14.5px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--fg);
    }

    .row-value {
      max-width: 126px;
      color: #85858f;
      font-size: 12.5px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 16px;
      height: 16px;
      color: #85858f;
    }

    .footer-brand {
      margin: 14px 0 2px;
      text-align: center;
      color: #9a9aa2;
    }

    .version {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
    }

    .mini-brand {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 560;
      color: #909098;
    }

    .mini-w {
      width: 24px;
      height: 16px;
      color: #909098;
    }

    .settings-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
    }

    .settings-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 12px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
      letter-spacing: 0;
    }

    .settings-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
      stroke-width: 1.7;
    }

    .settings-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .settings-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 12px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .settings-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .settings-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .home-indicator {
      bottom: 8px;
    }

    .toast {
      bottom: 104px;
    }

    @media (max-height: 820px) {
      .me-page {
        padding-top: 2px;
      }

      .profile {
        grid-template-columns: 60px 1fr;
        gap: 12px;
      }

      .avatar {
        width: 56px;
        height: 56px;
      }

      .me-name {
        font-size: 22px;
      }

      .profile-note {
        margin-top: 10px;
      }

      .ai-card {
        margin-top: 14px;
      }

      .setting-row {
        min-height: 46px;
      }
    }
  </style>
</head>

  <script>
    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.querySelector('span').textContent = text;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1600);
    }

    document.querySelectorAll('[data-toast]').forEach((item) => {
      item.addEventListener('click', () => showToast(item.dataset.toast));
    });

    document.getElementById('notifyBtn').addEventListener('click', () => {
      showToast('暂无新的提醒');
    });

    document.getElementById('aiAssistant').addEventListener('click', () => {
      showToast('AI 助手已准备好');
    });
  </script>
