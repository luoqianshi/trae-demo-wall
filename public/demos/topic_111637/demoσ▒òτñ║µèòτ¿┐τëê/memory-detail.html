<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 穿搭详情</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    .detail-view {
      position: relative;
      min-height: 100%;
      padding: 0 28px 104px;
      background:
        radial-gradient(circle at 50% 5%, rgba(255,255,255,0.95), transparent 34%),
        var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .detail-topbar {
      height: 52px;
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
      border-radius: 50%;
      text-decoration: none;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.75;
      flex: 0 0 auto;
    }

    .more-dots svg {
      width: 20px;
      height: 20px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-align: center;
    }

    .hero-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1.12 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: #eee;
      box-shadow: 0 18px 48px rgba(23,23,23,0.1);
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .edit-chip {
      position: absolute;
      right: 12px;
      bottom: 12px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(36,31,26,0.58);
      color: #fff;
      font-size: 13px;
      font-weight: 520;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .edit-chip svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.85;
    }

    .info-card,
    .items-card,
    .insight-card {
      margin-top: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(226,226,223,0.72);
      box-shadow: 0 12px 34px rgba(23,23,23,0.06);
    }

    .info-card {
      padding: 15px 16px 14px;
    }

    .info-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    .look-name {
      font-size: 18px;
      font-weight: 620;
      line-height: 1.16;
      letter-spacing: -0.012em;
    }

    .meta-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3f3f3d;
      font-size: 12px;
      line-height: 1;
    }

    .meta-sep {
      width: 1px;
      height: 12px;
      background: var(--border);
    }

    .meta-weather {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-weather svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.65;
      color: #555552;
    }

    .tag-row {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }

    .soft-pill {
      min-width: 46px;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: #F1F1EF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #555552;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .note-row {
      position: relative;
      margin-top: 12px;
      min-height: 54px;
      padding: 12px 34px 12px 36px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(247,247,245,0.96), rgba(246,246,244,0.78));
      color: #5f5f5c;
      font-size: 12.5px;
      line-height: 1.46;
      letter-spacing: 0;
    }

    .quote-mark {
      position: absolute;
      left: 14px;
      top: 10px;
      color: #DDDDD9;
      font-size: 27px;
      font-family: Georgia, serif;
      line-height: 1;
    }

    .note-edit {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 18px;
      height: 18px;
      color: #8e8e8b;
    }

    .items-card {
      padding: 14px 14px 13px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.006em;
    }

    .item-strip {
      margin-top: 11px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .item-chip {
      min-width: 0;
      text-align: center;
      color: var(--fg);
      text-decoration: none;
    }

    .item-thumb {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #F0F0EE;
      display: grid;
      place-items: center;
      position: relative;
    }

    .item-illustration {
      width: 74%;
      height: 74%;
      display: block;
      position: relative;
    }

    .item-illustration::before,
    .item-illustration::after {
      content: "";
      position: absolute;
      display: block;
    }

    .item-jacket {
      width: 76%;
      height: 72%;
      border-radius: 12px 12px 10px 10px;
      background: #242424;
      box-shadow: inset 0 -16px 0 rgba(255,255,255,0.04);
    }

    .item-jacket::before {
      width: 34%;
      height: 62%;
      left: -13%;
      top: 16%;
      border-radius: 11px;
      background: #2F2F2F;
      transform: rotate(12deg);
    }

    .item-jacket::after {
      width: 34%;
      height: 62%;
      right: -13%;
      top: 16%;
      border-radius: 11px;
      background: #2F2F2F;
      transform: rotate(-12deg);
    }

    .item-top {
      width: 68%;
      height: 64%;
      border-radius: 13px 13px 11px 11px;
      background: #F7F7F2;
      border: 1px solid #D9D9D3;
    }

    .item-top::before {
      width: 38%;
      height: 16%;
      left: 31%;
      top: -1px;
      border-radius: 0 0 999px 999px;
      background: #F0F0EA;
      border: 1px solid #D9D9D3;
      border-top: 0;
    }

    .item-top::after {
      width: 116%;
      height: 22%;
      left: -8%;
      top: 18%;
      border-radius: 999px;
      background: #F7F7F2;
      border: 1px solid #D9D9D3;
    }

    .item-pants {
      width: 58%;
      height: 78%;
    }

    .item-pants::before,
    .item-pants::after {
      width: 42%;
      height: 100%;
      top: 0;
      border-radius: 9px 9px 12px 12px;
      background: #363634;
    }

    .item-pants::before { left: 4%; transform: rotate(2deg); }
    .item-pants::after { right: 4%; transform: rotate(-2deg); }

    .item-shoes {
      width: 80%;
      height: 50%;
    }

    .item-shoes::before,
    .item-shoes::after {
      width: 46%;
      height: 42%;
      bottom: 18%;
      border-radius: 999px 999px 10px 12px;
      background: #202020;
    }

    .item-shoes::before { left: 0; transform: rotate(-8deg); }
    .item-shoes::after { right: 0; transform: rotate(8deg); }

    .item-bag {
      width: 68%;
      height: 62%;
      border-radius: 13px 13px 10px 10px;
      background: #252525;
      top: 7%;
    }

    .item-bag::before {
      width: 48%;
      height: 28%;
      left: 26%;
      top: -23%;
      border: 3px solid #252525;
      border-bottom: 0;
      border-radius: 999px 999px 0 0;
    }

    .item-bag::after {
      width: 18%;
      height: 5%;
      left: 41%;
      top: 45%;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
    }

    .item-name {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.2;
      color: #333331;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .insight-card {
      padding: 14px 16px 15px;
    }

    .insight-head {
      display: grid;
      grid-template-columns: 32px 1fr 18px;
      gap: 9px;
      align-items: center;
    }

    .ai-spark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--ai-accent);
    }

    .ai-spark svg {
      width: 25px;
      height: 25px;
    }

    .insight-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .insight-copy {
      margin: 8px 22px 0 41px;
      color: #5f5f5c;
      font-size: 12.5px;
      line-height: 1.48;
    }

    .detail-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 10px;
    }

    .primary-action,
    .secondary-action {
      height: 52px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 610;
      text-decoration: none;
      letter-spacing: 0;
    }

    .primary-action {
      background: linear-gradient(180deg, #272727 0%, #171717 100%);
      color: #fff;
      box-shadow: 0 12px 22px rgba(23,23,23,0.18);
    }

    .secondary-action {
      background: rgba(255,255,255,0.72);
      border-color: rgba(226,226,223,0.95);
      color: var(--fg);
    }

    .primary-action svg,
    .secondary-action svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.95;
    }

    .detail-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .detail-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 11px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .detail-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .detail-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .detail-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 11px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .detail-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .detail-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .home-indicator { bottom: 8px; }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%) translateY(12px);
      min-width: 180px;
      padding: 11px 16px;
      border-radius: 999px;
      background: rgba(23,23,23,0.88);
      color: #fff;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-height: 820px) {
      .detail-view { padding-left: 26px; padding-right: 26px; }
      .hero-card { border-radius: 17px; }
      .info-card, .items-card, .insight-card { margin-top: 13px; }
      .note-row { min-height: 62px; padding-top: 13px; padding-bottom: 13px; }
      .detail-actions { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="4" height="4" rx="1"/><rect x="6" y="5" width="4" height="7" rx="1"/><rect x="12" y="2" width="4" height="10" rx="1"/></svg>
        <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 5.5a9 9 0 0 1 13 0"/><path d="M5 8.5a5 5 0 0 1 7 0"/><path d="M8.5 11h.01"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x="1" y="2" width="19" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="4" width="15" height="4" rx="1" fill="currentColor"/><path d="M22 5v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="app">
      <main class="detail-view" aria-label="穿搭详情">
        <header class="detail-topbar">
          <a href="memory.html" class="icon-btn" aria-label="返回穿搭列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.5 4.5 8 12l7.5 7.5"></path>
            </svg>
          </a>
          <h1 class="detail-title">穿搭详情</h1>
          <button class="icon-btn more-dots" type="button" id="moreBtn" aria-label="更多操作">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5.5" cy="12" r="1.7"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <circle cx="18.5" cy="12" r="1.7"></circle>
            </svg>
          </button>
        </header>

        <section class="hero-card" aria-label="穿搭照片">
          <img src="assets/hero-outfit.jpg" alt="黑色短外套、白色内搭与深色长裤通勤穿搭照片" />
          <button class="edit-chip" id="editPhoto" type="button" aria-label="编辑穿搭照片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            编辑
          </button>
        </section>

        <section class="info-card" aria-label="穿搭信息">
          <div class="info-head">
            <div>
              <div class="look-name">黑白灰通勤 · 干净利落</div>
              <div class="meta-row">
                <span>6月21日</span>
                <span class="meta-sep" aria-hidden="true"></span>
                <span>周二</span>
                <span class="meta-sep" aria-hidden="true"></span>
                <span class="meta-weather">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6.8 18.5h10.4a4.2 4.2 0 0 0 .5-8.4 6 6 0 0 0-11.4-1.9A5 5 0 0 0 6.8 18.5z"></path>
                  </svg>
                  18°C
                </span>
              </div>
            </div>
            <div class="tag-row" aria-label="穿搭标签">
              <span class="soft-pill">通勤</span>
              <span class="soft-pill">显精神</span>
            </div>
          </div>

          <div class="note-row">
            <span class="quote-mark" aria-hidden="true">“</span>
            黑色短外套和深色长裤让整体更利落，白色内搭把重心提亮，适合需要显精神的通勤日。
            <svg class="note-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </div>
        </section>

        <section class="items-card" aria-label="识别单品">
          <h2 class="section-title">识别单品</h2>
          <div class="item-strip">
            <a href="closet.html" class="item-chip">
              <span class="item-thumb" aria-label="黑色短外套"><span class="item-illustration item-jacket"></span></span>
              <span class="item-name">黑色外套</span>
            </a>
            <a href="closet.html" class="item-chip">
              <span class="item-thumb" aria-label="白色内搭"><span class="item-illustration item-top"></span></span>
              <span class="item-name">白色内搭</span>
            </a>
            <a href="closet.html" class="item-chip">
              <span class="item-thumb" aria-label="深色长裤"><span class="item-illustration item-pants"></span></span>
              <span class="item-name">深色长裤</span>
            </a>
            <a href="closet.html" class="item-chip">
              <span class="item-thumb" aria-label="黑色皮鞋"><span class="item-illustration item-shoes"></span></span>
              <span class="item-name">黑色皮鞋</span>
            </a>
            <a href="closet.html" class="item-chip">
              <span class="item-thumb" aria-label="黑色包"><span class="item-illustration item-bag"></span></span>
              <span class="item-name">黑色包</span>
            </a>
          </div>
        </section>

        <section class="insight-card" aria-label="AI 穿搭洞察">
          <div class="insight-head">
            <span class="ai-spark" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="currentColor">
                <path d="M17 4.6 20.8 15.6 32 19.7 20.8 24 17 35.2 12.8 24 2 19.7 12.8 15.6 17 4.6z"></path>
                <path d="M31.5 5.5 33 9.5l4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5 1.5-4z"></path>
              </svg>
            </span>
            <div class="insight-title">AI 穿搭洞察</div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 5 7 7-7 7"></path>
            </svg>
          </div>
          <p class="insight-copy">这套以黑白灰为主，层次清楚但不夸张。微凉天气可以直接作为今天参考；如果外套暂不可穿，可以换成灰色短夹克。</p>

          <div class="detail-actions">
            <button class="primary-action" id="wearToday" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12 4 4L19 6"></path>
              </svg>
              今天穿这套
            </button>
            <a class="secondary-action" href="preview.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 1-15.4 6.4"></path>
                <path d="M3 12A9 9 0 0 1 18.4 5.6"></path>
                <path d="M18.4 10V5.6H22"></path>
                <path d="M5.6 14v4.4H2"></path>
              </svg>
              换一件
            </a>
          </div>
        </section>
      </main>

      <nav class="tab-bar detail-tab-bar" aria-label="底部导航">
        <a href="today.html" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10.4 12 3l8 7.4v8.1a2 2 0 0 1-2 2h-3.8v-6h-4.4v6H6a2 2 0 0 1-2-2v-8.1z"></path>
          </svg>
          今天
        </a>
        <a href="memory.html" class="tab active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5.2c0-1.1.8-2 1.9-2 1 0 1.9.8 1.9 1.8 0 1.2-1 1.9-2.2 2.5L12 8.3"></path>
            <path d="M12 8.3 5.2 12.8a1.6 1.6 0 0 0 .9 2.9h11.8a1.6 1.6 0 0 0 .9-2.9L12 8.3z"></path>
            <path d="M8.5 15.8h7"></path>
          </svg>
          搭配
        </a>
        <a href="ai-capture.html" class="tab capture-tab">

  <script>
    const toast = document.getElementById('toast');
    let toastTimer = 0;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1500);
    }

    document.getElementById('wearToday').addEventListener('click', () => {
      showToast('已加入今日候选');
    });

    document.getElementById('editPhoto').addEventListener('click', () => {
      showToast('已进入编辑状态');
    });

    document.getElementById('moreBtn').addEventListener('click', () => {
      showToast('更多操作');
    });
