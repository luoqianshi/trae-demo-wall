<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 替换预览</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    .preview-canvas {
      margin: 8px var(--inset) 0;
      border-radius: var(--r-xl);
      background: var(--surface);
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .collage {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1px;
      background: var(--border);
      height: 360px;
    }
    .collage-main,
    .collage-side {
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }
    .collage-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .collage-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }
    .slot {
      position: relative;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--muted);
      overflow: hidden;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .slot-label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 4px 7px;
      border-radius: 7px;
      background: rgba(255,255,255,0.86);
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
    }
    .changed-ring {
      position: absolute;
      inset: 8px;
      border: 1.5px solid var(--accent);
      border-radius: var(--r-md);
      pointer-events: none;
    }
    .disclaimer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 var(--inset);
      -webkit-overflow-scrolling: touch;
    }
    .selector::-webkit-scrollbar { display: none; }
    .replace-card {
      flex: 0 0 112px;
      border-radius: var(--r-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--dur-quick), transform 0.1s;
    }
    .replace-card:active { transform: scale(0.97); }
    .replace-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .replace-thumb {
      height: 96px;
      background: var(--bg);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .replace-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .replace-info {
      padding: 8px;
    }
    .replace-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .replace-meta {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }
    .segmented {
      display: flex;
      padding: 3px;
      border-radius: var(--r-pill);
      background: rgba(120,120,120,0.1);
    }
    .segmented button {
      flex: 1;
      height: 32px;
      border: 0;
      border-radius: var(--r-pill);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--fg);
      box-shadow: var(--shadow-1);
    }
    .bottom-action {
      position: absolute;
      left: var(--inset);
      right: var(--inset);
      bottom: calc(var(--home-indicator-h) + 16px);
      z-index: 35;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">09:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="18" height="4" rx="1"/><rect x="2" y="4" width="14" height="4" rx="1"/><rect x="4" y="0" width="10" height="4" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 1.5a4.5 4.5 0 0 1 4.5 4.5v4a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V6A4.5 4.5 0 0 1 8 1.5z"/></svg>
      </div>
    </div>

    <div class="app">
      <div class="nav-bar">
        <button class="nav-btn left" aria-label="返回" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="nav-title">换一件后的感觉</div>
        <button class="nav-btn right" id="regenerate">重试</button>
      </div>

      <div class="scroll-view no-tab">
        <div class="preview-canvas">
          <div class="collage" id="collage">
            <div class="collage-main">
              <img src="assets/hero-outfit.jpg" alt="原穿搭参考" />
              <span class="slot-label">原穿搭</span>
            </div>
            <div class="collage-side">
              <div class="slot" id="replaceSlot" style="background:#777D82;">
                <span class="slot-label" id="replaceLabel">灰色短夹克</span>
                <span class="changed-ring"></span>
              </div>
              <div class="slot">
                <img src="assets/wardrobe-flatlay.jpg" alt="保留单品" />
                <span class="slot-label">米白衬衫</span>
              </div>
            </div>
          </div>
          <div class="disclaimer">这是基于你的衣橱生成的风格参考，不代表真实试穿效果。</div>
        </div>

        <div class="content">
          <div class="section">
            <div class="row-between">
              <div>
                <div class="label">替换项</div>
                <div class="headline mt-2">原单品：黑色外套</div>
                <div class="footnote text-muted mt-2">替换为：灰色短夹克</div>
              </div>
              <span class="tag">外套</span>
            </div>
          </div>
        </div>

        <div class="selector mt-6" id="selector">
          <div class="replace-card active" data-name="灰色短夹克" data-color="#777D82" data-meta="通勤 · 适合今天">
            <div class="replace-thumb" style="background:#777D82;"></div>
            <div class="replace-info">
              <div class="replace-name">灰色短夹克</div>
              <div class="replace-meta">通勤 · 适合今天</div>
            </div>
          </div>
          <div class="replace-card" data-name="藏青夹克" data-color="#1F2933" data-meta="休闲 · 可穿">
            <div class="replace-thumb" style="background:#1F2933;"></div>
            <div class="replace-info">
              <div class="replace-name">藏青夹克</div>
              <div class="replace-meta">休闲 · 可穿</div>
            </div>
          </div>
          <div class="replace-card" data-name="奶油开衫" data-color="#d6cfc2" data-meta="休闲 · 可穿">
            <div class="replace-thumb" style="background:#d6cfc2;"></div>
            <div class="replace-info">
              <div class="replace-name">奶油开衫</div>
              <div class="replace-meta">休闲 · 可穿</div>
            </div>
          </div>
        </div>

        <div class="content">
          <div class="section">
            <div class="segmented" id="modeSwitch">
              <button class="active" data-mode="fit">同类优先</button>
              <button data-mode="contrast">相近颜色</button>
              <button data-mode="note">适合今天</button>
            </div>
          </div>
          <div class="section mb-8">
            <div class="note-card card-flat p-8" id="explainBox">
              <div class="label">好好穿建议</div>
              <div class="callout mt-4">灰色短夹克和原本的深色裤装仍然保持干净利落，也更适合今天的温度。</div>
            </div>
          </div>
          <div style="height:112px;"></div>
        </div>
      </div>

      <div class="bottom-action">
        <button class="btn btn-secondary btn-fluid" id="saveDraft">继续换一件</button>
        <button class="btn btn-primary btn-fluid" id="wearPlan">加入今日候选</button>
      </div>

      <div class="toast" id="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        已保存替换方案
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    const slot = document.getElementById('replaceSlot');
    const label = document.getElementById('replaceLabel');
    const explain = document.getElementById('explainBox');
    const messages = {
      fit: '灰色短夹克和原本的深色裤装仍然保持干净利落，也更适合今天的温度。',
      contrast: '原方案更沉稳；替换后更轻、更日常。黑白灰比例仍然清楚，不会偏向电商式搭配。',
      note: '今天 18–25°C，短夹克比厚外套更省心。若傍晚降温，可以把奶油开衫作为备选。'
    };

    document.querySelectorAll('.replace-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.replace-card').forEach(item => item.classList.remove('active'));
        card.classList.add('active');
        slot.style.background = card.dataset.color;
        label.textContent = card.dataset.name;
        explain.querySelector('.callout').textContent = `${card.dataset.name}已替换到风格参考中。${card.dataset.meta}，可以继续换一件或加入今日候选。`;
      });
    });

    document.querySelectorAll('#modeSwitch button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('#modeSwitch button').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        explain.querySelector('.callout').textContent = messages[button.dataset.mode];
      });
    });

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.lastChild.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    document.getElementById('saveDraft').addEventListener('click', () => showToast('已切换下一组候选'));
    document.getElementById('wearPlan').addEventListener('click', () => showToast('已加入今日候选'));
    document.getElementById('regenerate').addEventListener('click', () => {
      slot.animate([
        { transform: 'scale(0.96)', filter: 'blur(3px)' },
        { transform: 'scale(1)', filter: 'blur(0)' }
      ], { duration: 520, easing: 'cubic-bezier(0.32, 0.72, 0, 1)' });
      showToast('已重新生成风格参考');
    });
  </script>
</body>
</html>
