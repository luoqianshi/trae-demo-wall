<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 我的穿搭</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    body { background: #efefed; }

    .device {
      background:
        radial-gradient(circle at 18% 2%, rgba(255,255,255,0.98), transparent 26%),
        linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .status-bar {
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
    }

    .app { background: transparent; }

    .looks-view {
      height: 100%;
      overflow-y: auto;
      padding: 0 29px 102px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .looks-view::-webkit-scrollbar { display: none; }

    .looks-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin: 0 0 18px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 38px;
      border-radius: 11px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.42);
      flex: 0 0 auto;
    }

    .brand-mark img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 640;
      line-height: 1.04;
      letter-spacing: -0.025em;
      color: var(--fg);
    }

    .brand-sub {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 430;
      line-height: 1;
      color: #8a8a87;
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 7px;
    }

    .tool-btn {
      width: 26px;
      height: 30px;
      border: 0;
      background: transparent;
      color: #151515;
      display: grid;
      place-items: center;
      padding: 0;
      text-decoration: none;
    }

    .tool-btn svg {
      width: 25px;
      height: 25px;
      display: block;
      stroke-width: 1.9;
    }

    .search-panel {
      display: none;
      margin: -6px 0 12px;
    }

    .search-panel.open { display: block; }

    .search-field {
      position: relative;
      display: block;
    }

    .search-field svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: #878783;
      pointer-events: none;
    }

    .search-field input {
      width: 100%;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.72);
      background: rgba(255,255,255,0.7);
      padding: 0 16px 0 40px;
      color: var(--fg);
      outline: none;
      font-size: 14px;
      font-weight: 440;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
    }

    .category-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -29px 18px;
      padding: 0 29px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-strip::-webkit-scrollbar { display: none; }

    .category-pill {
      height: 33px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      background: rgba(237,237,235,0.9);
      color: #242424;
      font-size: 14px;
      font-weight: 540;
      letter-spacing: 0;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .category-pill.active {
      background: #202020;
      color: #fff;
      box-shadow: 0 6px 13px rgba(23,23,23,0.12);
    }

    .ai-replay-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      min-height: 72px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(226,226,223,0.7);
      box-shadow: 0 12px 28px rgba(23,23,23,0.045);
      color: var(--fg);
      text-decoration: none;
      margin-bottom: 20px;
    }

    .ai-star {
      width: 30px;
      height: 30px;
      color: #8a8fd8;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .ai-star svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .ai-title {
      display: block;
      font-size: 16px;
      font-weight: 620;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .ai-copy {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.2;
      color: #6d6d69;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ai-replay-card > svg {
      width: 21px;
      height: 21px;
      color: #5a5a56;
    }

    .looks-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 15px;
    }

    .look-card {
      min-width: 0;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.86);
      color: var(--fg);
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(23,23,23,0.055);
      border: 1px solid rgba(226,226,223,0.62);
      position: relative;
    }

    .look-photo {
      position: relative;
      aspect-ratio: 3 / 4;
      background: #ececea;
      overflow: hidden;
    }

    .look-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .weather-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.84);
      color: #292927;
      font-size: 13px;
      font-weight: 520;
      line-height: 1;
      box-shadow: 0 6px 16px rgba(23,23,23,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .weather-badge svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.7;
      flex: 0 0 16px;
    }

    .look-info {
      position: relative;
      min-height: 78px;
      padding: 12px 40px 12px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));
    }

    .look-date {
      font-size: 16px;
      font-weight: 560;
      line-height: 1.1;
      letter-spacing: -0.015em;
      color: #252525;
      white-space: nowrap;
    }

    .look-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 9px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .look-tag {
      height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: #efefed;
      color: #676763;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
    }

    .card-more {
      position: absolute;
      right: 12px;
      bottom: 20px;
      width: 22px;
      height: 22px;
      color: #444440;
      display: grid;
      place-items: center;
    }

    .card-more svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    .empty-state {
      margin-top: 20px;
      padding: 22px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(226,226,223,0.72);
      text-align: center;
    }

    .empty-state.hidden { display: none; }
    .empty-title { font-size: 17px; font-weight: 620; margin-bottom: 6px; }
    .empty-body { font-size: 13px; line-height: 1.45; color: #777774; margin-bottom: 14px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 108px;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      pointer-events: none;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(23,23,23,0.9);
      color: #fff;
      font-size: 12px;
      font-weight: 520;
      z-index: 40;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .looks-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
    }

    .looks-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 12px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .looks-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .looks-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .looks-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 12px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .looks-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .looks-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .home-indicator { bottom: 8px; }

    @media (max-height: 760px) {
      .looks-view { padding-left: 25px; padding-right: 25px; }
      .looks-header { margin-bottom: 14px; }
      .category-strip { margin-bottom: 14px; }
      .ai-replay-card { min-height: 64px; margin-bottom: 16px; }
      .looks-grid { gap: 14px 12px; }
      .look-info { min-height: 72px; padding-top: 10px; padding-bottom: 10px; }
    }
  </style>
</head>

  <script>
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('lookSearch');
    const searchBtn = document.getElementById('searchBtn');
    const filterBtn = document.getElementById('filterBtn');
    const sortBtn = document.getElementById('sortBtn');
    const cards = Array.from(document.querySelectorAll('.look-card'));
    const pills = Array.from(document.querySelectorAll('.category-pill'));
    const empty = document.getElementById('emptyLooks');
    const grid = document.getElementById('looksGrid');
    const toast = document.getElementById('toast');
    let activeFilter = '全部';
    let newestFirst = true;
    let toastTimer = 0;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;

      cards.forEach((card) => {
        const tagText = card.dataset.tags.toLowerCase();
        const dateText = card.querySelector('.look-date').textContent.toLowerCase();
        const matchCategory = activeFilter === '全部' || card.dataset.tags.includes(activeFilter);
        const matchQuery = !query || tagText.includes(query) || dateText.includes(query);
        const show = matchCategory && matchQuery;
        card.hidden = !show;
        if (show) visible += 1;
      });

      empty.classList.toggle('hidden', visible !== 0);
    }

    pills.forEach((pill) => {
      pill.addEventListener('click', () => {
        pills.forEach((item) => item.classList.remove('active'));
        pill.classList.add('active');
        activeFilter = pill.dataset.filter;
        applyFilters();
      });
    });

    searchBtn.addEventListener('click', () => {
      searchPanel.classList.toggle('open');
      if (searchPanel.classList.contains('open')) searchInput.focus();
    });

    searchInput.addEventListener('input', applyFilters);

    filterBtn.addEventListener('click', () => {
      const currentIndex = pills.findIndex((pill) => pill.classList.contains('active'));
      const next = pills[(currentIndex + 1) % pills.length];
      next.click();
      showToast(`已筛选：${next.textContent}`);
    });

    sortBtn.addEventListener('click', () => {
      newestFirst = !newestFirst;
      const sorted = cards.slice().sort((a, b) => {
        return newestFirst
          ? b.dataset.date.localeCompare(a.dataset.date)
          : a.dataset.date.localeCompare(b.dataset.date);
      });
      sorted.forEach((card) => grid.appendChild(card));
      showToast(newestFirst ? '已按最新排序' : '已按最早排序');
    });

  </script>
