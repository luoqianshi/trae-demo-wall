<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 启动页</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    body {
      background: #efefed;
    }

    .device {
      background: linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .splash-screen {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 54px 32px 40px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 62% 36%, rgba(138,143,216,0.12), transparent 22%),
        linear-gradient(180deg, #fbfbfa 0%, #f5f5f3 100%);
    }

    .splash-core {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-18px);
      animation: riseIn 720ms var(--ease) both;
    }

    .logo-wrap {
      width: 86px;
      height: 82px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.62);
      box-shadow: 0 18px 44px rgba(23,23,23,0.08), inset 0 0 0 1px rgba(255,255,255,0.72);
      position: relative;
    }

    .logo-wrap img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      display: block;
    }

    .ai-spark {
      position: absolute;
      top: 9px;
      right: 8px;
      width: 15px;
      height: 15px;
      color: var(--ai-accent);
      animation: sparkOnce 1200ms ease-out 240ms both;
    }

    .brand-cn {
      margin-top: 22px;
      font-family: "SF Pro Display", "PingFang SC", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 640;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .brand-en {
      margin-top: 7px;
      font-size: 14px;
      line-height: 1;
      font-weight: 560;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .slogan {
      margin-top: 22px;
      max-width: 230px;
      text-align: center;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 450;
      letter-spacing: 0;
      color: color-mix(in srgb, var(--fg) 74%, white);
    }

    .enter-link {
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      height: 38px;
      padding: 0 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.58);
      color: var(--fg);
      text-decoration: none;
      font-size: 13px;
      font-weight: 560;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 0 1px rgba(23,23,23,0.06);
      animation: fadeIn 520ms ease-out 760ms both;
    }

    .home-indicator {
      background: color-mix(in srgb, var(--fg) 30%, transparent);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(0) scale(0.98); }
      to { opacity: 1; transform: translateY(-18px) scale(1); }
    }

    @keyframes sparkOnce {
      0% { opacity: 0; transform: scale(0.64) rotate(-18deg); }
      38% { opacity: 1; transform: scale(1.08) rotate(0deg); }
      100% { opacity: 0.72; transform: scale(1) rotate(0deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><path d="M1 10c2.6-3.1 4.9-4.6 7.5-4.6s4.9 1.5 7.5 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 10c1.4-1.7 2.8-2.5 4.5-2.5s3.1.8 4.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="1" y="3" width="3" height="7" rx="1" fill="currentColor"/><rect x="6" y="1" width="3" height="9" rx="1" fill="currentColor"/><rect x="11" width="3" height="10" rx="1" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="currentColor" stroke-width="1.2"/><path d="M23 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="3" y="3" width="14" height="6" rx="2" fill="currentColor"/></svg>
      </div>
    </div>

    <main class="app splash-screen" aria-label="好好穿 Wearwell 启动页">
      <section class="splash-core">
        <div class="logo-wrap" aria-hidden="true">
          <img src="mqtr7hq3-ChatGPT-Image-2026年6月26日-01_03_14.png" alt="" />
          <svg class="ai-spark" viewBox="0 0 24 24" fill="none">
            <path d="M12 3.5l1.7 5.1 5.1 1.7-5.1 1.7L12 17.2l-1.7-5.2-5.1-1.7 5.1-1.7L12 3.5z" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="brand-cn">好好穿</h1>
        <div class="brand-en">Wearwell</div>
        <p class="slogan">每天不用想太多，也能穿得不错</p>
      </section>
      <a class="enter-link" href="today.html">进入 Today</a>
    </main>

    <div class="home-indicator"></div>
  </div>

  <script>
    window.setTimeout(function () {
      window.location.href = "today.html";
    }, 1250);
  </script>
</body>
</html>
