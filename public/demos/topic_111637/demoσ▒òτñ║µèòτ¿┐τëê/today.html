<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好好穿 Wearwell — 今天</title>
  <link rel="stylesheet" href="css/vestige.css">
  <style>
    body {
      background: #efefed;
    }

    .device {
      background:
        radial-gradient(circle at 18% 2%, rgba(255,255,255,0.96), transparent 28%),
        linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .status-bar {
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
    }

    .app {
      background: transparent;
    }

    .scroll-view {
      padding-bottom: 0;
      overflow: hidden;
    }

    .today-content {
      height: 100%;
      padding: 2px 29px 0;
      display: flex;
      flex-direction: column;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0;
      flex: 0 0 auto;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark {
      width: 30px;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255,255,255,0.55);
      display: grid;
      place-items: center;
    }

    .brand-mark img {
      width: 86%;
      height: 86%;
      display: block;
      object-fit: contain;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 650;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      margin-top: 1px;
      font-size: 12px;
      color: var(--tertiary);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .more-btn {
      width: 40px;
      height: 40px;
      position: relative;
      color: var(--fg);
      display: grid;
      place-items: center;
      text-decoration: none;
    }

    .more-btn::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.2px solid color-mix(in srgb, var(--fg) 82%, white);
      background: rgba(255,255,255,0.36);
    }

    .more-btn svg {
      position: relative;
      width: 16px;
      height: 16px;
      z-index: 1;
    }

    .today-hero {
      margin-top: 12px;
      flex: 0 0 auto;
    }

    .today-question {
      font-family: "SF Pro Display", "PingFang SC", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 31px;
      line-height: 1;
      font-weight: 610;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .weather-row {
      margin-top: 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 500;
      color: color-mix(in srgb, var(--fg) 88%, white);
      letter-spacing: -0.01em;
    }

    .weather-row .divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .cloud-icon {
      color: var(--tertiary);
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .context-chips {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .context-chips::-webkit-scrollbar {
      display: none;
    }

    .context-chip {
      min-width: 49px;
      height: 27px;
      padding: 0 11px;
      border-radius: 999px;
      border: 0;
      background: rgba(235,235,233,0.72);
      color: color-mix(in srgb, var(--fg) 76%, white);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .recommend-card {
      position: relative;
      margin: 9px 0 0;
      width: 100%;
      aspect-ratio: 3 / 4;
      height: auto;
      border-radius: 22px;
      overflow: hidden;
      background: #eeeeeb;
      box-shadow: 0 16px 34px rgba(23, 23, 23, 0.07);
      text-decoration: none;
      display: block;
    }

    .recommend-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      filter: saturate(0.96) contrast(0.98);
    }

    .recommend-card::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.56) 100%);
      pointer-events: none;
    }

    .recommend-meta {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      color: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .today-badge {
      width: fit-content;
      height: 27px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(28,28,28,0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 620;
      letter-spacing: -0.01em;
    }

    .recommend-title {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .recommend-sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 520;
      opacity: 0.9;
    }

    .arrow-cta {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(28,28,28,0.82);
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    }

    .arrow-cta svg {
      width: 21px;
      height: 21px;
    }

    .ai-note {
      margin-top: 8px;
      min-height: 56px;
      padding: 11px 15px 11px 50px;
      border-radius: 20px;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 12px 32px rgba(23,23,23,0.07);
      position: relative;
      color: var(--fg);
      font-size: 15px;
      line-height: 1.32;
      font-weight: 470;
      letter-spacing: -0.015em;
    }

    .ai-star {
      position: absolute;
      left: 18px;
      top: 15px;
      width: 23px;
      height: 23px;
      color: var(--ai-accent);
      filter: drop-shadow(0 7px 14px rgba(138, 143, 216, 0.22));
    }

    .backup-head {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .backup-title {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .shuffle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 540;
      cursor: pointer;
    }

    .shuffle-btn svg {
      width: 16px;
      height: 16px;
    }

    .backup-strip {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      padding-bottom: 0;
    }

    .backup-card {
      min-width: 0;
      height: 126px;
      border-radius: 13px;
      overflow: hidden;
      background: #eeeeeb;
      border: 0;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(23,23,23,0.05);
    }

    .backup-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
    }

    .today-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
    }

    .today-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 12px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .today-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .today-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .today-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 12px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .today-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .today-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .home-indicator {
      bottom: 8px;
    }
  </style>
</head>
<body>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          </svg>

            <path d="M12 4v16"></path>
            <path d="M9 12h.01M15 12h.01"></path>
          </svg>
          衣橱
        </a>
        <a href="settings.html" class="tab">

          </svg>

      <div class="home-indicator"></div>

  </div>

  <script>
    const todayLooks = [
      {
        image: 'assets/hero-outfit.jpg',
        title: '清爽简约通勤装',
        sub: '黑色短外套 + 白 T 恤 + 深蓝直筒裤',
        note: '今天适合轻薄外套，早晚微凉，通勤和室内都舒服。'
      },
      {
        image: 'assets/outfit-weekend.jpg',
        title: '浅蓝衬衫日常装',
        sub: '牛仔衬衫 + 白 T 恤 + 卡其直筒裤',
        note: '这套更松弛，适合日常办公和短距离外出，24° 穿着负担很低。'
      },
      {
        image: 'assets/outfit-evening.jpg',
        title: '利落黑白灰搭配',
        sub: '黑色外套 + 米白内搭 + 深灰西裤',
        note: '如果今天想显得更精神，这套线条更干净，也适合室内会议。'
      }
    ];

    const recommendImage = document.getElementById('recommendImage');
    const recommendTitle = document.getElementById('recommendTitle');
    const recommendSub = document.getElementById('recommendSub');
    const aiNoteText = document.getElementById('aiNoteText');
    const shuffleBtn = document.getElementById('shuffleBtn');
    let currentLook = 0;

    function renderLook(index) {
      currentLook = index % todayLooks.length;
      if (currentLook < 0) currentLook = todayLooks.length - 1;
      const look = todayLooks[currentLook];
      recommendImage.src = look.image;
      recommendTitle.textContent = look.title;
      recommendSub.textContent = look.sub;
      aiNoteText.textContent = look.note;
    }

    document.querySelectorAll('.backup-card').forEach((card) => {
      card.addEventListener('click', () => {
        renderLook(Number(card.dataset.index || 0));
      });
    });

    shuffleBtn.addEventListener('click', () => {
      renderLook(currentLook + 1);
    });
  </script>




</body></html>
