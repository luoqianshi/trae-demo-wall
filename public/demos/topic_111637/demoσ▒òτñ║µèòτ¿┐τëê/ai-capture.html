<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好好穿 Wearwell — 记录</title>
  <link rel="stylesheet" href="css/vestige.css">
  <style>
    body {
      background: #efefed;
    }

    .device {
      background: #161616;
    }

    .status-bar {
      position: absolute;
      inset: 0 0 auto;
      color: #fff;
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
      z-index: 70;
    }

    .app {
      background: #161616;
    }

    .capture-screen {
      position: relative;
      flex: 1;
      overflow: hidden;
      color: #fff;
      background: #20201f;
    }

    .camera-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(0.88) contrast(0.96);
      transform: scale(1.02);
    }

    .camera-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.36) 0%, rgba(0,0,0,0.08) 32%, rgba(0,0,0,0.18) 63%, rgba(0,0,0,0.42) 100%),
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.08), transparent 45%);
      pointer-events: none;
    }

    .capture-top {
      position: absolute;
      top: 92px;
      left: 30px;
      right: 30px;
      z-index: 8;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .capture-brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .capture-logo {
      width: 54px;
      height: 43px;
      display: grid;
      place-items: center;
    }

    .capture-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: brightness(0) invert(1) drop-shadow(0 8px 20px rgba(0,0,0,0.22));
    }

    .capture-title {
      font-size: 26px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .capture-subtitle {
      margin-top: 6px;
      font-size: 17px;
      line-height: 1;
      font-weight: 430;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.82);
      text-shadow: 0 8px 20px rgba(0,0,0,0.16);
    }

    .capture-more {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.3px solid rgba(255,255,255,0.64);
      background: rgba(255,255,255,0.12);
      color: #fff;
      display: grid;
      place-items: center;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .capture-more svg {
      width: 18px;
      height: 18px;
    }

    .viewfinder {
      position: absolute;
      top: 188px;
      left: 50%;
      width: min(74vw, 298px);
      aspect-ratio: 3 / 4;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 46px;
      height: 46px;
      border-color: rgba(255,255,255,0.72);
    }

    .corner.tl {
      top: 0;
      left: 0;
      border-top: 2px solid;
      border-left: 2px solid;
      border-top-left-radius: 15px;
    }

    .corner.tr {
      top: 0;
      right: 0;
      border-top: 2px solid;
      border-right: 2px solid;
      border-top-right-radius: 15px;
    }

    .corner.bl {
      bottom: 0;
      left: 0;
      border-bottom: 2px solid;
      border-left: 2px solid;
      border-bottom-left-radius: 15px;
    }

    .corner.br {
      right: 0;
      bottom: 0;
      border-right: 2px solid;
      border-bottom: 2px solid;
      border-bottom-right-radius: 15px;
    }

    .guide-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 55%;
      border-top: 1px dashed rgba(255,255,255,0.38);
    }

    .capture-hint {
      position: absolute;
      left: 50%;
      bottom: 176px;
      transform: translateX(-50%);
      z-index: 8;
      min-height: 31px;
      padding: 0 15px;
      border-radius: 999px;
      background: rgba(120,116,108,0.56);
      color: rgba(255,255,255,0.92);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 15px;
      line-height: 1;
      font-weight: 510;
      letter-spacing: -0.01em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .camera-actions {
      position: absolute;
      left: 42px;
      right: 42px;
      bottom: 100px;
      z-index: 9;
      display: grid;
      grid-template-columns: 58px 1fr 58px;
      align-items: center;
      justify-items: center;
    }

    .round-tool {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      background: rgba(224,220,211,0.76);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .round-tool svg {
      width: 29px;
      height: 29px;
      stroke-width: 1.85;
    }

    .shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.94);
      background: rgba(255,255,255,0.95);
      box-shadow:
        inset 0 0 0 5px rgba(42,42,42,0.12),
        0 14px 32px rgba(0,0,0,0.22);
      cursor: pointer;
    }

    .capture-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.62);
      background: rgba(255,255,255,0.86);
      box-shadow: 0 12px 42px rgba(23,23,23,0.18);
      align-items: center;
      overflow: visible;
      z-index: 50;
    }

    .capture-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 12px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .capture-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .capture-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .capture-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 12px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .capture-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .capture-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .capture-sheet {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 104px;
      z-index: 30;
      display: none;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,0.93);
      color: var(--fg);
      box-shadow: 0 18px 50px rgba(0,0,0,0.20);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .capture-sheet.active {
      display: block;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-title {
      font-size: 17px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .sheet-copy {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .sheet-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sheet-btn {
      height: 43px;
      border-radius: 999px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 610;
    }

    .sheet-btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .sheet-btn.secondary {
      background: var(--brand-soft);
      color: var(--fg);
    }

    .home-indicator {
      bottom: 8px;
      background: rgba(255,255,255,0.88);
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="18" height="4" rx="1"></rect><rect x="2" y="4" width="14" height="4" rx="1"></rect><rect x="4" y="0" width="10" height="4" rx="1"></rect></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 1.5a4.5 4.5 0 0 1 4.5 4.5v4a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V6A4.5 4.5 0 0 1 8 1.5z"></path></svg>
      </div>
    </div>

    <div class="app">
      <main class="capture-screen" aria-label="记录穿搭拍摄页">
        <img class="camera-bg" src="mquh79qn-ChatGPT-Image-2026年6月26日-13_13_27.png" alt="穿搭拍摄预览背景">
        <div class="camera-scrim"></div>

        <header class="capture-top">
          <div class="capture-brand" aria-label="好好穿 Wearwell 记录页">
            <div class="capture-logo" aria-hidden="true">

            </div>
            <div>


            </div>
          </div>
          <a href="settings.html" class="capture-more" aria-label="打开我的设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="12" r="1.25"></circle>
              <circle cx="12" cy="12" r="1.25"></circle>
              <circle cx="18" cy="12" r="1.25"></circle>
            </svg>
          </a>
        </header>

        <section class="viewfinder" aria-label="3:4 穿搭取景框">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <span class="guide-line"></span>
        </section>

        <div class="capture-hint">记录今日穿搭，获取 AI 搭配建议</div>

        <div class="camera-actions" aria-label="拍摄操作">
          <button class="round-tool" id="btnLibrary" type="button" aria-label="从相册选择">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="5" width="16" height="14" rx="2"></rect>
              <circle cx="9" cy="10" r="1.8"></circle>
              <path d="m20 15-4.2-4.2L7 19"></path>
            </svg>
          </button>
          <button class="shutter" id="btnCamera" type="button" aria-label="拍照"></button>
          <button class="round-tool" id="btnFlip" type="button" aria-label="切换摄像头">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 7.5 19 10l-2.5 2.5"></path>
              <path d="M5 10h14"></path>
              <path d="M7.5 16.5 5 14l2.5-2.5"></path>
              <path d="M19 14H5"></path>
            </svg>
          </button>
        </div>

        <div class="capture-sheet" id="captureSheet" role="dialog" aria-live="polite" aria-label="照片已准备确认">
          <div class="sheet-head">
            <div>
              <div class="sheet-title">已捕捉这套穿搭</div>
              <div class="sheet-copy">下一步确认场景标签，再让 AI 识别里面的单品。</div>
            </div>
          </div>
          <div class="sheet-actions">
            <button class="sheet-btn secondary" id="btnRetake" type="button">重新拍</button>
            <a class="sheet-btn primary" href="ai-confirm.html">继续确认</a>
          </div>
        </div>
      </main>

      <nav class="tab-bar capture-tab-bar" aria-label="底部导航">
        <a href="today.html" class="tab">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 10.4 12 3l8 7.4v8.1a2 2 0 0 1-2 2h-3.8v-6h-4.4v6H6a2 2 0 0 1-2-2v-8.1z"></path>
          </svg>
          今天
        </a>
        <a href="memory.html" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5.2c0-1.1.8-2 1.9-2 1 0 1.9.8 1.9 1.8 0 1.2-1 1.9-2.2 2.5L12 8.3"></path>
            <path d="M12 8.3 5.2 12.8a1.6 1.6 0 0 0 .9 2.9h11.8a1.6 1.6 0 0 0 .9-2.9L12 8.3z"></path>
            <path d="M8.5 15.8h7"></path>
          </svg>
          搭配
        </a>
        <a href="ai-capture.html" class="tab capture-tab active" aria-current="page">
          <span class="capture-orb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9a2 2 0 0 1 2-2h2.3l1.2-1.8A2 2 0 0 1 11.2 4h1.6a2 2 0 0 1 1.7 1.2L15.7 7H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9z"></path>
              <circle cx="12" cy="13" r="3.2"></circle>
            </svg>
          </span>
          <span>记录</span>
        </a>
        <a href="closet.html" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="4" width="14" height="16" rx="2"></rect>
            <path d="M12 4v16"></path>
            <path d="M9 12h.01M15 12h.01"></path>
          </svg>
          衣橱
        </a>
        <a href="settings.html" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4"></circle>
            <path d="M5.5 20a6.8 6.8 0 0 1 13 0"></path>
          </svg>
          我的
        </a>
      </nav>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    const captureSheet = document.getElementById('captureSheet');
    const btnCamera = document.getElementById('btnCamera');
    const btnLibrary = document.getElementById('btnLibrary');
    const btnRetake = document.getElementById('btnRetake');
    const btnFlip = document.getElementById('btnFlip');

    function showCaptureSheet() {
      captureSheet.classList.add('active');
    }

    btnCamera.addEventListener('click', showCaptureSheet);
    btnLibrary.addEventListener('click', showCaptureSheet);
    btnRetake.addEventListener('click', () => {
      captureSheet.classList.remove('active');
    });
    btnFlip.addEventListener('click', () => {
      btnFlip.animate(
        [{ transform: 'rotate(0deg)' }, { transform: 'rotate(180deg)' }],
        { duration: 220, easing: 'cubic-bezier(0.32, 0.72, 0, 1)' }
      );
    });
  </script>


</body></html>
