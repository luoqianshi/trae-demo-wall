<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好好穿 Wearwell — 单品详情</title>
  <link rel="stylesheet" href="css/vestige.css">
  <style>
    body { background: #efefed; }

    .device {
      background:
        radial-gradient(circle at 50% 4%, rgba(255,255,255,0.96), transparent 32%),
        linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .status-bar {
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
    }

    .app { background: transparent; }

    .item-detail-view {
      height: 100%;
      overflow-y: auto;
      padding: 0 28px 106px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .item-detail-view::-webkit-scrollbar { display: none; }

    .detail-topbar {
      height: 46px;
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
      text-decoration: none;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
      display: block;
    }

    .more-dots svg {
      width: 20px;
      height: 20px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 620;
      line-height: 1;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .hero-item-card {
      position: relative;
      height: 236px;
      margin-top: 8px;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,0.96), transparent 34%),
        linear-gradient(145deg, #f2f2f0 0%, #fafafa 52%, #ededeb 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.78),
        0 14px 34px rgba(23,23,23,0.06);
    }

    .hero-garment {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 236px;
      height: 212px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 15px 20px rgba(23,23,23,0.16));
    }

    .hero-garment svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .photo-count {
      position: absolute;
      right: 17px;
      bottom: 17px;
      min-width: 52px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(23,23,23,0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #2a2a28;
      font-size: 17px;
      font-weight: 520;
      letter-spacing: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .item-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .item-title {
      font-size: 25px;
      font-weight: 650;
      line-height: 1.1;
      letter-spacing: -0.025em;
    }

    .edit-inline {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #8c8c89;
      display: grid;
      place-items: center;
    }

    .edit-inline svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    .tag-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tag-row::-webkit-scrollbar { display: none; }

    .soft-pill {
      height: 27px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(238,238,236,0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #292927;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .info-card {
      margin-top: 13px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(226,226,223,0.78);
      box-shadow: 0 12px 30px rgba(23,23,23,0.055);
    }

    .info-row {
      height: 48px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto 20px;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      color: #242422;
      text-decoration: none;
    }

    .info-row + .info-row {
      border-top: 1px solid rgba(226,226,223,0.86);
    }

    .info-icon {
      width: 24px;
      height: 24px;
      color: #333331;
      display: grid;
      place-items: center;
    }

    .info-icon svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.75;
    }

    .info-label {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .info-value {
      color: #2e2e2c;
      font-size: 14px;
      font-weight: 450;
      white-space: nowrap;
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: #9b9b98;
    }

    .section-head {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 620;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .section-title span {
      margin-left: 4px;
      color: #8d8d8a;
      font-weight: 450;
    }

    .section-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #777774;
      text-decoration: none;
      font-size: 13px;
      font-weight: 460;
      white-space: nowrap;
    }

    .section-link svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.8;
    }

    .looks-strip {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .look-card {
      min-width: 0;
      color: var(--fg);
      text-decoration: none;
      display: block;
    }

    .look-photo {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      overflow: hidden;
      background: #efefed;
      box-shadow: 0 10px 22px rgba(23,23,23,0.06);
    }

    .look-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .look-name {
      margin-top: 6px;
      font-size: 11.5px;
      line-height: 1.2;
      font-weight: 520;
      letter-spacing: -0.01em;
      color: #2a2a28;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .look-date {
      display: block;
      margin-top: 4px;
      color: #8d8d8a;
      font-size: 11.5px;
      line-height: 1;
      font-weight: 450;
    }

    .ai-card {
      margin-top: 14px;
      min-height: 78px;
      border-radius: 18px;
      border: 1px solid rgba(226,226,223,0.72);
      background: rgba(255,255,255,0.86);
      box-shadow: 0 12px 32px rgba(23,23,23,0.07);
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 20px;
      gap: 8px;
      align-items: start;
      padding: 12px 13px;
      color: var(--fg);
      text-decoration: none;
    }

    .ai-spark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--ai-accent);
      filter: drop-shadow(0 8px 14px rgba(138,143,216,0.24));
    }

    .ai-spark svg {
      width: 28px;
      height: 28px;
    }

    .ai-title {
      font-size: 14px;
      line-height: 1.1;
      font-weight: 620;
      letter-spacing: -0.005em;
    }

    .ai-copy {
      margin-top: 5px;
      color: #5e5e5b;
      font-size: 13px;
      line-height: 1.48;
      font-weight: 440;
    }

    .ai-card > svg {
      width: 18px;
      height: 18px;
      margin-top: 30px;
      color: #8b8b88;
      justify-self: end;
      stroke-width: 1.85;
    }

    .detail-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-action,
    .secondary-action {
      height: 48px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 610;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .primary-action {
      border: 0;
      background: linear-gradient(180deg, #272727 0%, #171717 100%);
      color: #fff;
      box-shadow: 0 13px 26px rgba(23,23,23,0.18);
    }

    .secondary-action {
      background: rgba(255,255,255,0.72);
      border-color: rgba(210,210,207,0.98);
      color: var(--fg);
    }

    .primary-action svg,
    .secondary-action svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.85;
    }

    .item-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .item-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 11px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .item-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .item-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .item-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 11px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .item-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .item-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%) translateY(12px);
      min-width: 168px;
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(23,23,23,0.88);
      color: #fff;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .home-indicator { bottom: 8px; }

    @media (max-height: 820px) {
      .item-detail-view { padding-left: 26px; padding-right: 26px; }
      .hero-item-card { height: 222px; margin-top: 6px; }
      .item-head { margin-top: 10px; }
      .info-card { margin-top: 12px; }
      .section-head { margin-top: 14px; }
      .looks-strip { margin-top: 9px; }
      .look-name { font-size: 11.5px; }
      .ai-card { margin-top: 12px; }
      .detail-actions { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="4" height="4" rx="1"></rect><rect x="6" y="5" width="4" height="7" rx="1"></rect><rect x="12" y="2" width="4" height="10" rx="1"></rect></svg>
        <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 5.5a9 9 0 0 1 13 0"></path><path d="M5 8.5a5 5 0 0 1 7 0"></path><path d="M8.5 11h.01"></path></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x="1" y="2" width="19" height="8" rx="2" stroke="currentColor" stroke-width="1.5"></rect><rect x="3" y="4" width="15" height="4" rx="1" fill="currentColor"></rect><path d="M22 5v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      </div>
    </div>

    <div class="app">
      <main class="item-detail-view" aria-label="单品详情">
        <header class="detail-topbar" style="height: 32px;">
          <a href="closet.html" class="icon-btn" aria-label="返回衣橱">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.5 4.5 8 12l7.5 7.5"></path>
            </svg>
          </a>
          <h1 class="page-title">单品详情</h1>
          <button class="icon-btn more-dots" type="button" id="moreBtn" aria-label="更多操作">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5.5" cy="12" r="1.7"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <circle cx="18.5" cy="12" r="1.7"></circle>
            </svg>
          </button>
        </header>

        <section class="hero-item-card" aria-label="针织开衫图片">
          <div class="hero-garment" aria-hidden="true">
            <svg viewBox="0 0 240 220" role="img">
              <defs>
                <linearGradient id="knit" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#c4c1b8"></stop>
                  <stop offset="0.5" stop-color="#aaa79e"></stop>
                  <stop offset="1" stop-color="#cbc8bf"></stop>
                </linearGradient>
                <pattern id="rib" width="8" height="8" patternUnits="userSpaceOnUse">
                  <path d="M1 0v8M5 0v8" stroke="rgba(255,255,255,0.28)" stroke-width="1"></path>
                </pattern>
              </defs>
              <path d="M72 33 98 50 120 41 142 50 168 33l25 38-17 17v88c0 10-7 16-17 16H81c-10 0-17-6-17-16V88L47 71 72 33z" fill="url(#knit)"></path>
              <path d="M72 33 98 50 120 41 142 50 168 33l25 38-17 17v88c0 10-7 16-17 16H81c-10 0-17-6-17-16V88L47 71 72 33z" fill="url(#rib)" opacity=".42"></path>
              <path d="M82 44 102 67l18-26 18 26 20-23" fill="none" stroke="#e9e7df" stroke-width="5" stroke-linejoin="round"></path>
              <path d="M120 42v149" stroke="#e8e4dc" stroke-width="5" stroke-linecap="round"></path>
              <path d="M70 158h100M74 178h92" stroke="#938f86" stroke-width="4" opacity=".38"></path>
              <path d="M64 88c-16 20-22 48-25 78" stroke="#aaa69d" stroke-width="20" stroke-linecap="round"></path>
              <path d="M176 88c16 20 22 48 25 78" stroke="#aaa69d" stroke-width="20" stroke-linecap="round"></path>
              <circle cx="120" cy="76" r="4" fill="#e8e4dc" stroke="#918d84" stroke-width="1"></circle>
              <circle cx="120" cy="101" r="4" fill="#e8e4dc" stroke="#918d84" stroke-width="1"></circle>
              <circle cx="120" cy="126" r="4" fill="#e8e4dc" stroke="#918d84" stroke-width="1"></circle>
              <circle cx="120" cy="151" r="4" fill="#e8e4dc" stroke="#918d84" stroke-width="1"></circle>
              <path d="M86 58c4 37 5 75 1 115M154 58c-4 37-5 75-1 115" stroke="rgba(255,255,255,0.34)" stroke-width="2"></path>
            </svg>
          </div>
          <span class="photo-count">1/5</span>
        </section>

        <section aria-label="单品基础信息">
          <div class="item-head">
            <h2 class="item-title" style="font-size: 25px;">针织开衫</h2>
            <button class="edit-inline" type="button" id="editName" aria-label="编辑单品名称">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
          </div>
          <div class="tag-row" aria-label="单品标签">
            <span class="soft-pill">上衣</span>
            <span class="soft-pill">灰色</span>
            <span class="soft-pill">春秋</span>
            <span class="soft-pill">基础款</span>
          </div>
        </section>

        <section class="info-card" aria-label="单品数据">
          <a class="info-row" href="settings.html" aria-label="查看添加时间">
            <span class="info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="5" width="16" height="15" rx="3"></rect>
                <path d="M8 3v4M16 3v4M4 10h16"></path>
                <path d="M8 14h.01M12 14h.01M16 14h.01"></path>
              </svg>
            </span>
            <span class="info-label">添加时间</span>
            <span class="info-value">2024年3月22日</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
          </a>
          <a class="info-row" href="memory.html" aria-label="查看穿着次数">
            <span class="info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8.5 5 12 3l3.5 2 3.5 1.4-2 4.1V21H7V10.5l-2-4.1L8.5 5z"></path>
                <path d="M9.5 5.5c.6 1.5 1.4 2.3 2.5 2.3s1.9-.8 2.5-2.3"></path>
              </svg>
            </span>
            <span class="info-label">穿着次数</span>
            <span class="info-value">12 次</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
          </a>
        </section>

        <section aria-label="搭配记录">
          <div class="section-head">
            <h2 class="section-title">搭配记录 <span>(3)</span></h2>
            <a class="section-link" href="memory.html">
              全部搭配
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
            </a>
          </div>

          <div class="looks-strip">
            <a class="look-card" href="memory-detail.html">
              <span class="look-photo"><img src="assets/hero-outfit.jpg" alt="灰色针织开衫搭配白色长裤"></span>
              <span class="look-name">清爽通勤 · 舒适日常</span>
              <span class="look-date">4月22日</span>
            </a>
            <a class="look-card" href="memory-detail.html">
              <span class="look-photo"><img src="assets/outfit-weekend.jpg" alt="灰色针织开衫搭配牛仔裤"></span>
              <span class="look-name">简约出行 · 轻松自在</span>
              <span class="look-date">4月10日</span>
            </a>
            <a class="look-card" href="memory-detail.html">
              <span class="look-photo"><img src="assets/outfit-evening.jpg" alt="灰色针织开衫搭配黑色半裙"></span>
              <span class="look-name">都市休闲 · 气质利落</span>
              <span class="look-date">4月3日</span>
            </a>
          </div>
        </section>

        <a class="ai-card" href="settings.html" aria-label="查看 AI 助理洞察">
          <span class="ai-spark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="currentColor">
              <path d="M17 4.6 20.8 15.6 32 19.7 20.8 24 17 35.2 12.8 24 2 19.7 12.8 15.6 17 4.6z"></path>
              <path d="M31.5 5.5 33 9.5l4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5 1.5-4z"></path>
            </svg>
          </span>
          <span>
            <span class="ai-title">AI 助理洞察</span>
            <span class="ai-copy">这件针织开衫百搭实用，柔软舒适，适合春秋季节。在你的衣橱中出镜率很高，常用于通勤与日常搭配。</span>
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
        </a>

        <section class="detail-actions" aria-label="单品操作">

  <script>
    const toast = document.getElementById('toast');
    let toastTimer = 0;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1500);
    }

    document.getElementById('addToday').addEventListener('click', () => showToast('已加入今日搭配'));
    document.getElementById('editItem').addEventListener('click', () => showToast('已进入单品编辑'));
    document.getElementById('editName').addEventListener('click', () => showToast('编辑单品名称'));
    document.getElementById('moreBtn').addEventListener('click', () => showToast('更多操作'));
  </script>
