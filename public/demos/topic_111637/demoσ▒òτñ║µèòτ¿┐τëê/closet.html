<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好好穿 Wearwell — 衣橱</title>
  <link rel="stylesheet" href="css/vestige.css" />
  <style>
    body { background: #efefed; }

    .device {
      background:
        radial-gradient(circle at 18% 3%, rgba(255,255,255,0.96), transparent 28%),
        linear-gradient(180deg, #fbfbfa 0%, #f4f4f2 100%);
    }

    .status-bar {
      background: transparent;
      padding-left: 28px;
      padding-right: 28px;
    }

    .app { background: transparent; }

    .closet-view {
      height: 100%;
      overflow-y: auto;
      padding: 0 29px 98px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .closet-view::-webkit-scrollbar { display: none; }

    .closet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0;
      margin-bottom: 18px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark {
      width: 30px;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.5);
    }

    .brand-mark img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 620;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .brand-sub {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      color: var(--tertiary);
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .circle-action {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      border: 1.25px solid color-mix(in srgb, var(--fg) 84%, white);
      background: rgba(255,255,255,0.32);
      color: var(--fg);
      display: grid;
      place-items: center;
      text-decoration: none;
    }

    .circle-action svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .search-field {
      position: relative;
      min-width: 0;
    }

    .search-field svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #8f8f8d;
      pointer-events: none;
    }

    .search-field input {
      width: 100%;
      height: 39px;
      border: 1px solid rgba(226,226,223,0.74);
      border-radius: 999px;
      background: rgba(255,255,255,0.54);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.62);
      padding: 0 15px 0 39px;
      font-size: 14px;
      font-weight: 450;
      color: var(--fg);
      outline: none;
    }

    .search-field input::placeholder { color: #9a9a98; }

    .text-action {
      height: 34px;
      border: 0;
      background: transparent;
      color: #555553;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      font-size: 14px;
      font-weight: 510;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .text-action svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      stroke-width: 1.8;
    }

    .action-divider {
      width: 1px;
      height: 18px;
      background: rgba(210,210,207,0.78);
    }

    .category-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -29px 18px;
      padding: 0 29px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-strip::-webkit-scrollbar { display: none; }

    .category-pill {
      height: 33px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      background: rgba(237,237,235,0.9);
      color: #242424;
      font-size: 14px;
      font-weight: 540;
      white-space: nowrap;
      letter-spacing: 0;
      flex: 0 0 auto;
    }

    .category-pill.active {
      background: #202020;
      color: #fff;
      box-shadow: 0 6px 13px rgba(23,23,23,0.12);
    }

    .closet-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .item-count {
      font-size: 14px;
      font-weight: 470;
      color: #6b6b69;
      letter-spacing: -0.01em;
    }

    .view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 62px;
      height: 32px;
      padding: 3px;
      gap: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(226,226,223,0.75);
      box-shadow: 0 8px 18px rgba(23,23,23,0.05);
    }

    .view-toggle button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #7b7b78;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .view-toggle button.active {
      background: #fff;
      color: #171717;
      box-shadow: 0 5px 12px rgba(23,23,23,0.07);
    }

    .view-toggle svg {
      width: 15px;
      height: 15px;
    }

    .wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 10px;
    }

    .wardrobe-grid.list-mode {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .wardrobe-item {
      min-width: 0;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      color: var(--fg);
      text-decoration: none;
    }

    .item-photo {
      width: 100%;
      aspect-ratio: 1 / 1.18;
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,0.9), transparent 36%),
        linear-gradient(180deg, #f6f6f4 0%, #ebebe8 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.72),
        0 10px 24px rgba(23,23,23,0.045);
      position: relative;
      display: grid;
      place-items: center;
    }

    .garment {
      width: 78%;
      height: 78%;
      filter: drop-shadow(0 8px 9px rgba(23,23,23,0.13));
    }

    .garment svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .item-name {
      margin: 7px 0 3px;
      font-size: 13px;
      line-height: 1.1;
      font-weight: 560;
      letter-spacing: -0.01em;
      color: #181818;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-type {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      line-height: 1;
      font-weight: 450;
      color: #777774;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ai-accent);
      flex: 0 0 6px;
    }

    .type-dot.warm { background: #c5b495; }
    .type-dot.cool { background: #8a8fd8; }
    .type-dot.dark { background: #1f1f1f; }
    .type-dot.soft { background: #b9aaa5; }

    .wardrobe-grid.list-mode .item-photo { aspect-ratio: 1 / 0.72; }
    .wardrobe-grid.list-mode .garment { width: 58%; height: 72%; }
    .wardrobe-grid.list-mode .item-name { font-size: 14px; }

    .ai-closet-card {
      margin-top: 18px;
      min-height: 62px;
      border-radius: 15px;
      border: 1px solid rgba(226,226,223,0.72);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 30px rgba(23,23,23,0.08);
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: var(--fg);
      text-decoration: none;
    }

    .ai-star {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--ai-accent);
      filter: drop-shadow(0 7px 14px rgba(138,143,216,0.25));
    }

    .ai-title {
      font-size: 14px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .ai-copy {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.25;
      color: #777774;
      font-weight: 450;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ai-closet-card > svg {
      width: 17px;
      height: 17px;
      color: #777774;
      justify-self: end;
    }

    .empty-state {
      margin-top: 26px;
      padding: 24px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(226,226,223,0.72);
      text-align: center;
    }

    .empty-state.hidden { display: none; }
    .empty-title { font-size: 17px; font-weight: 610; margin-bottom: 6px; }
    .empty-body { font-size: 13px; color: #777774; margin-bottom: 14px; }

    .closet-tab-bar {
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 66px;
      padding: 5px 8px 7px;
      border-radius: 999px;
      border: 1px solid rgba(226,226,223,0.82);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 42px rgba(23,23,23,0.12);
      align-items: center;
      overflow: visible;
    }

    .closet-tab-bar .tab {
      height: 53px;
      gap: 4px;
      font-size: 12px;
      color: #8c8c8a;
      border-radius: 999px;
      flex: 1 1 0;
    }

    .closet-tab-bar .tab svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      aspect-ratio: 1;
      display: block;
    }

    .closet-tab-bar .tab.active:not(.capture-tab) {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 12px 24px rgba(23,23,23,0.08);
    }

    .closet-tab-bar .capture-tab {
      position: relative;
      transform: translateY(-6px);
      color: var(--fg);
      font-size: 12px;
      font-weight: 540;
      gap: 2px;
    }

    .capture-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #353535 0%, #171717 100%);
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      box-shadow: 0 8px 16px rgba(23,23,23,0.18);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .closet-tab-bar .capture-tab svg {
      width: 19px;
      height: 19px;
      flex-basis: 19px;
      stroke-width: 1.7;
      color: #fff;
    }

    .closet-tab-bar .capture-tab span:last-child {
      margin-top: -2px;
      color: var(--fg);
    }

    .home-indicator { bottom: 8px; }
  </style>
</head>

  <script>
    const searchInput = document.getElementById('closetSearch');
    const items = Array.from(document.querySelectorAll('.wardrobe-item'));
    const pills = Array.from(document.querySelectorAll('.category-pill'));
    const empty = document.getElementById('emptyCloset');
    const itemCount = document.getElementById('itemCount');
    const grid = document.getElementById('wardrobeGrid');
    const gridMode = document.getElementById('gridMode');
    const listMode = document.getElementById('listMode');
    let activeFilter = '全部';
    let sortAsc = false;

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;

      items.forEach((item) => {
        const matchCategory = activeFilter === '全部' || item.dataset.category === activeFilter;
        const matchQuery = !query || item.dataset.keywords.toLowerCase().includes(query);
        const show = matchCategory && matchQuery;
        item.hidden = !show;
        if (show) visible += 1;
      });

      empty.classList.toggle('hidden', visible !== 0);
      itemCount.textContent = query || activeFilter !== '全部' ? `共 ${visible} 件衣物` : '共 36 件衣物';
    }

    pills.forEach((pill) => {
      pill.addEventListener('click', () => {
        pills.forEach((item) => item.classList.remove('active'));
        pill.classList.add('active');
        activeFilter = pill.dataset.filter;
        applyFilters();
      });
    });

    searchInput.addEventListener('input', applyFilters);

    document.getElementById('resetFilters').addEventListener('click', () => {
      searchInput.value = '';
      activeFilter = '全部';
      pills.forEach((pill) => pill.classList.toggle('active', pill.dataset.filter === '全部'));
      applyFilters();
    });

    document.getElementById('sortItems').addEventListener('click', () => {
      sortAsc = !sortAsc;
      const sorted = items.slice().sort((a, b) => {
        const nameA = a.querySelector('.item-name').textContent;
        const nameB = b.querySelector('.item-name').textContent;
        return sortAsc ? nameA.localeCompare(nameB, 'zh-CN') : nameB.localeCompare(nameA, 'zh-CN');
      });
      sorted.forEach((item) => grid.appendChild(item));
      applyFilters();
    });

    gridMode.addEventListener('click', () => {
      grid.classList.remove('list-mode');
      gridMode.classList.add('active');
      listMode.classList.remove('active');
    });

    listMode.addEventListener('click', () => {
      grid.classList.add('list-mode');
      listMode.classList.add('active');
      gridMode.classList.remove('active');
    });
  </script>
