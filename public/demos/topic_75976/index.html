<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灵感捕手 - Inspiration Catcher</title>
<style>
  /* ===== CSS Variables ===== */
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #8A8A8A;
    --rule: #E8E8E4;
    --accent: #2A6B6B;
    --accent-light: #E8F2F2;
    --accent2: #D4894A;
    --danger: #C44B4B;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100%;
    overflow: hidden;
  }

  /* ===== App Container ===== */
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }

  /* ===== Page Transition ===== */
  .page {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: none;
    animation: fadeIn 0.25s ease;
    padding-bottom: 80px;
  }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @keyframes soundWave {
    0%, 100% { height: 6px; }
    50% { height: 28px; }
  }

  /* ===== Header ===== */
  .header {
    padding: 16px 20px 12px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-size: 18px;
    transition: transform 0.15s;
  }
  .icon-btn:active { transform: scale(0.92); }

  /* ===== Input Card ===== */
  .input-card {
    margin: 0 16px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    animation: slideUp 0.35s ease;
  }
  .input-area {
    width: 100%;
    min-height: 100px;
    border: none;
    outline: none;
    font-size: 16px;
    line-height: 1.6;
    resize: none;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
  }
  .input-area::placeholder { color: #BDBDBD; }

  .input-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }
  .toolbar-left {
    display: flex;
    gap: 8px;
  }
  .toolbar-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--rule);
    background: var(--bg);
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .save-btn {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .save-btn:not(:disabled):active { transform: scale(0.95); }

  /* ===== Voice Recording Overlay ===== */
  .voice-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 26, 26, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .voice-overlay.active { display: flex; }
  .voice-hint { font-size: 15px; margin-bottom: 32px; opacity: 0.8; }
  .voice-waves {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 40px;
    margin-bottom: 32px;
  }
  .voice-waves span {
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    animation: soundWave 1s ease infinite;
  }
  .voice-waves span:nth-child(2) { animation-delay: 0.1s; }
  .voice-waves span:nth-child(3) { animation-delay: 0.2s; }
  .voice-waves span:nth-child(4) { animation-delay: 0.3s; }
  .voice-waves span:nth-child(5) { animation-delay: 0.15s; }
  .voice-timer { font-size: 42px; font-weight: 200; font-variant-numeric: tabular-nums; }
  .voice-stop {
    margin-top: 40px;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: transparent;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .voice-stop:active { background: rgba(255,255,255,0.15); transform: scale(0.95); }

  /* ===== Stats Bar ===== */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin: 0 16px 16px;
  }
  .stat-item {
    flex: 1;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ===== Recent Section ===== */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  /* ===== Inspiration Card ===== */
  .inspiration-card {
    margin: 0 16px 12px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeIn 0.3s ease;
  }
  .inspiration-card:active { transform: scale(0.98); }
  .card-content {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--accent-light);
    color: var(--accent);
  }
  .tag.auto { background: #F0E8F2; color: #7B5A8C; }
  .card-time {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ===== Filter Tabs ===== */
  .filter-tabs {
    display: flex;
    gap: 8px;
    margin: 0 16px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--rule);
    background: var(--surface);
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ===== List Page ===== */
  .list-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-size: 16px;
  }
  .list-header h2 {
    font-size: 18px;
    font-weight: 700;
  }

  .group-header {
    margin: 16px 16px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ===== Detail Page ===== */
  .detail-card {
    margin: 0 16px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    animation: slideUp 0.35s ease;
  }
  .detail-content {
    font-size: 17px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 20px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .detail-meta {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }
  .detail-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .detail-meta-row .label {
    font-weight: 600;
    color: var(--ink);
    min-width: 60px;
  }
  .detail-actions {
    display: flex;
    gap: 12px;
    margin: 24px 16px 0;
  }
  .detail-btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .detail-btn.primary { background: var(--accent); color: #fff; }
  .detail-btn.danger { background: #FCE8E8; color: var(--danger); }
  .detail-btn:active { transform: scale(0.97); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Bottom Nav ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
    max-width: 480px;
    margin: 0 auto;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 0;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 11px;
    transition: color 0.2s;
  }
  .nav-item .nav-icon { font-size: 22px; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  /* ===== Scrollbar ===== */
  .page::-webkit-scrollbar { width: 0; }

  /* ===== Tag Input Popup ===== */
  .tag-popup {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px;
    z-index: 500;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    max-width: 480px;
    margin: 0 auto;
  }
  .tag-popup.active { transform: translateY(0); }
  .tag-popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 400;
    display: none;
  }
  .tag-popup-overlay.active { display: block; }
  .tag-popup h3 {
    font-size: 16px;
    margin-bottom: 12px;
  }
  .tag-popup input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  .tag-popup input:focus { border-color: var(--accent); }
  .quick-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .quick-tag {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid var(--rule);
    background: var(--bg);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag-popup-actions {
    display: flex;
    gap: 10px;
  }
  .tag-popup-actions button {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tag-popup-actions .cancel { background: var(--bg); color: var(--muted); }
  .tag-popup-actions .confirm { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<div id="app">

  <!-- ===== HOME PAGE ===== -->
  <div class="page active" id="page-home">
    <div class="header">
      <div class="header-top">
        <div>
          <h1>灵感捕手</h1>
          <div class="subtitle">捕捉每一刻灵光一闪</div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-num" id="stat-count">0</div>
        <div class="stat-label">灵感数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-streak">0</div>
        <div class="stat-label">连续天数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-today">0</div>
        <div class="stat-label">今日记录</div>
      </div>
    </div>

    <div class="input-card">
      <textarea class="input-area" id="input-area" placeholder="想到什么？赶紧记下来..." maxlength="1000"></textarea>
      <div class="input-toolbar">
        <div class="toolbar-left">
          <button class="toolbar-btn" id="btn-voice" title="语音输入">🎤 语音</button>
          <button class="toolbar-btn" id="btn-add-tag" title="添加标签"># 标签</button>
        </div>
        <button class="save-btn" id="btn-save">保存</button>
      </div>
    </div>

    <div class="section-title">
      最近灵感
      <a href="#" onclick="navigateTo('list')">查看全部 →</a>
    </div>
    <div id="recent-list"></div>
  </div>

  <!-- ===== LIST PAGE ===== -->
  <div class="page" id="page-list">
    <div class="list-header">
      <button class="back-btn" onclick="navigateTo('home')">←</button>
      <h2>灵感列表</h2>
    </div>

    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="today">今天</button>
      <button class="filter-tab" data-filter="week">本周</button>
      <button class="filter-tab" data-filter="work">工作</button>
      <button class="filter-tab" data-filter="life">生活</button>
      <button class="filter-tab" data-filter="creative">创意</button>
    </div>

    <div id="full-list"></div>
  </div>

  <!-- ===== DETAIL PAGE ===== -->
  <div class="page" id="page-detail">
    <div class="list-header">
      <button class="back-btn" onclick="goBack()">←</button>
      <h2>灵感详情</h2>
    </div>

    <div class="detail-card">
      <div class="detail-content" id="detail-content"></div>
      <div class="detail-meta">
        <div class="detail-meta-row">
          <span class="label">标签</span>
          <span id="detail-tags"></span>
        </div>
        <div class="detail-meta-row">
          <span class="label">创建</span>
          <span id="detail-time"></span>
        </div>
        <div class="detail-meta-row">
          <span class="label">分类</span>
          <span id="detail-category"></span>
        </div>
      </div>
    </div>

    <div class="detail-actions">
      <button class="detail-btn danger" onclick="deleteCurrent()">🗑 删除</button>
      <button class="detail-btn primary" onclick="copyContent()">📋 复制</button>
    </div>
  </div>

  <!-- ===== VOICE OVERLAY ===== -->
  <div class="voice-overlay" id="voice-overlay">
    <div class="voice-hint">正在聆听，请说出你的想法...</div>
    <div class="voice-waves">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="voice-timer" id="voice-timer">00:00</div>
    <button class="voice-stop" id="voice-stop">结束</button>
  </div>

  <!-- ===== TAG POPUP ===== -->
  <div class="tag-popup-overlay" id="tag-popup-overlay"></div>
  <div class="tag-popup" id="tag-popup">
    <h3>添加标签</h3>
    <input type="text" id="tag-input" placeholder="输入标签，按回车确认" maxlength="20">
    <div class="quick-tags">
      <span class="quick-tag" data-tag="工作">工作</span>
      <span class="quick-tag" data-tag="生活">生活</span>
      <span class="quick-tag" data-tag="创意">创意</span>
      <span class="quick-tag" data-tag="待办">待办</span>
      <span class="quick-tag" data-tag="读书">读书</span>
      <span class="quick-tag" data-tag="灵感">灵感</span>
    </div>
    <div class="tag-popup-actions">
      <button class="cancel" onclick="closeTagPopup()">取消</button>
      <button class="confirm" onclick="confirmTag()">确定</button>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span class="nav-icon">✍️</span>
      <span>记录</span>
    </button>
    <button class="nav-item" data-page="list">
      <span class="nav-icon">📚</span>
      <span>列表</span>
    </button>
  </nav>

</div>

<script>
(function() {
  'use strict';

  // ===== State =====
  let inspirations = [];
  let currentTags = [];
  let currentDetailId = null;
  let recognition = null;
  let voiceTimer = null;
  let voiceSeconds = 0;
  let lastPage = 'home';

  // ===== Init =====
  function init() {
    loadData();
    renderHome();
    bindEvents();
    initSpeech();
  }

  // ===== Data =====
  function loadData() {
    try {
      const data = localStorage.getItem('inspirations');
      if (data) inspirations = JSON.parse(data);
    } catch(e) { inspirations = []; }
  }

  function saveData() {
    localStorage.setItem('inspirations', JSON.stringify(inspirations));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const isYesterday = new Date(now - 86400000).toDateString() === d.toDateString();
    const timeStr = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    if (isToday) return '今天 ' + timeStr;
    if (isYesterday) return '昨天 ' + timeStr;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + timeStr;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function getCategory(text) {
    const t = text.toLowerCase();
    if (/工作|项目|会议|产品|需求|客户|老板/.test(t)) return '工作';
    if (/创意|想法|设计|文案|策划|灵感/.test(t)) return '创意';
    if (/读书|学习|课程|笔记|知识/.test(t)) return '学习';
    return '生活';
  }

  function getStreak() {
    if (!inspirations.length) return 0;
    const dates = [...new Set(inspirations.map(i => new Date(i.created).toDateString()))].sort((a, b) => new Date(b) - new Date(a));
    if (new Date(dates[0]).toDateString() !== new Date().toDateString()) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      if (dates[0] !== yesterday) return 0;
    }
    let streak = 1;
    for (let i = 1; i < dates.length; i++) {
      const curr = new Date(dates[i - 1]);
      const prev = new Date(dates[i]);
      if ((curr - prev) / 86400000 === 1) streak++;
      else break;
    }
    return streak;
  }

  // ===== Rendering =====
  function renderHome() {
    const todayStr = new Date().toDateString();
    const todayCount = inspirations.filter(i => new Date(i.created).toDateString() === todayStr).length;

    document.getElementById('stat-count').textContent = inspirations.length;
    document.getElementById('stat-streak').textContent = getStreak();
    document.getElementById('stat-today').textContent = todayCount;

    const recent = inspirations.slice(0, 5);
    const container = document.getElementById('recent-list');
    if (!recent.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="emoji">💡</div>
          <p>还没有记录任何灵感<br>在上方输入框写下第一个想法吧</p>
        </div>
      `;
      return;
    }
    container.innerHTML = recent.map(item => renderCard(item)).join('');
    bindCardClicks(container);
  }

  function renderList(filter = 'all') {
    let list = [...inspirations];
    const now = new Date();

    if (filter === 'today') {
      const todayStr = now.toDateString();
      list = list.filter(i => new Date(i.created).toDateString() === todayStr);
    } else if (filter === 'week') {
      const weekAgo = Date.now() - 7 * 86400000;
      list = list.filter(i => i.created > weekAgo);
    } else if (['work', 'life', 'creative'].includes(filter)) {
      const map = { work: '工作', life: '生活', creative: '创意' };
      list = list.filter(i => i.category === map[filter] || i.tags.includes(map[filter]));
    }

    const container = document.getElementById('full-list');
    if (!list.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🔍</div>
          <p>该分类下暂无灵感</p>
        </div>
      `;
      return;
    }

    // Group by date
    const groups = {};
    list.forEach(item => {
      const dateKey = new Date(item.created).toDateString();
      if (!groups[dateKey]) groups[dateKey] = [];
      groups[dateKey].push(item);
    });

    let html = '';
    Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).forEach(dateKey => {
      const items = groups[dateKey];
      const isToday = dateKey === now.toDateString();
      const isYesterday = dateKey === new Date(now - 86400000).toDateString();
      const label = isToday ? '今天' : isYesterday ? '昨天' : formatDate(items[0].created);
      html += `<div class="group-header">${label} · ${items.length}条</div>`;
      html += items.map(item => renderCard(item)).join('');
    });
    container.innerHTML = html;
    bindCardClicks(container);
  }

  function renderCard(item) {
    const tagsHtml = item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    return `
      <div class="inspiration-card" data-id="${item.id}">
        <div class="card-content">${escapeHtml(item.text)}</div>
        <div class="card-meta">
          <div class="card-tags">${tagsHtml}</div>
          <span class="card-time">${formatTime(item.created)}</span>
        </div>
      </div>
    `;
  }

  function renderDetail(id) {
    const item = inspirations.find(i => i.id === id);
    if (!item) return navigateTo('home');
    currentDetailId = id;

    document.getElementById('detail-content').textContent = item.text;
    document.getElementById('detail-tags').innerHTML = item.tags.length
      ? item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
      : '<span style="color:var(--muted)">无标签</span>';
    document.getElementById('detail-time').textContent = formatDate(item.created) + ' ' + new Date(item.created).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('detail-category').innerHTML = `<span class="tag auto">${item.category}</span>`;
  }

  function bindCardClicks(container) {
    container.querySelectorAll('.inspiration-card').forEach(card => {
      card.addEventListener('click', () => {
        navigateTo('detail', card.dataset.id);
      });
    });
  }

  // ===== Actions =====
  function saveInspiration() {
    const textarea = document.getElementById('input-area');
    const text = textarea.value.trim();
    if (!text) { showToast('请先输入内容'); return; }

    const item = {
      id: generateId(),
      text: text,
      tags: [...currentTags],
      category: getCategory(text),
      created: Date.now()
    };

    inspirations.unshift(item);
    saveData();

    textarea.value = '';
    currentTags = [];
    updateTagBtn();

    renderHome();
    showToast('灵感已保存 ✓');
  }

  function deleteCurrent() {
    if (!currentDetailId) return;
    if (!confirm('确定要删除这条灵感吗？')) return;
    inspirations = inspirations.filter(i => i.id !== currentDetailId);
    saveData();
    showToast('已删除');
    navigateTo('home');
  }

  function copyContent() {
    const item = inspirations.find(i => i.id === currentDetailId);
    if (!item) return;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(item.text).then(() => showToast('已复制到剪贴板'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = item.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制到剪贴板');
    }
  }

  // ===== Speech Recognition =====
  function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      document.getElementById('btn-voice').style.display = 'none';
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
      let final = '';
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        const ta = document.getElementById('input-area');
        ta.value = (ta.value ? ta.value + ' ' : '') + final;
      }
    };

    recognition.onerror = (e) => {
      stopVoice();
      if (e.error !== 'aborted') showToast('语音识别出错: ' + e.error);
    };

    recognition.onend = () => {
      stopVoice();
    };
  }

  function startVoice() {
    if (!recognition) { showToast('您的浏览器不支持语音识别'); return; }
    try {
      recognition.start();
      voiceSeconds = 0;
      document.getElementById('voice-timer').textContent = '00:00';
      document.getElementById('voice-overlay').classList.add('active');
      voiceTimer = setInterval(() => {
        voiceSeconds++;
        const m = Math.floor(voiceSeconds / 60).toString().padStart(2, '0');
        const s = (voiceSeconds % 60).toString().padStart(2, '0');
        document.getElementById('voice-timer').textContent = `${m}:${s}`;
        if (voiceSeconds >= 60) stopVoice();
      }, 1000);
    } catch(e) { showToast('无法启动语音识别'); }
  }

  function stopVoice() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    clearInterval(voiceTimer);
    document.getElementById('voice-overlay').classList.remove('active');
  }

  // ===== Tag Popup =====
  function openTagPopup() {
    document.getElementById('tag-popup').classList.add('active');
    document.getElementById('tag-popup-overlay').classList.add('active');
    document.getElementById('tag-input').value = '';
    setTimeout(() => document.getElementById('tag-input').focus(), 100);
  }

  function closeTagPopup() {
    document.getElementById('tag-popup').classList.remove('active');
    document.getElementById('tag-popup-overlay').classList.remove('active');
  }

  function confirmTag() {
    const input = document.getElementById('tag-input');
    const val = input.value.trim();
    if (val && !currentTags.includes(val)) currentTags.push(val);
    updateTagBtn();
    closeTagPopup();
  }

  function updateTagBtn() {
    const btn = document.getElementById('btn-add-tag');
    if (currentTags.length) {
      btn.textContent = '# ' + currentTags.join(', ');
      btn.classList.add('active');
    } else {
      btn.textContent = '# 标签';
      btn.classList.remove('active');
    }
  }

  // ===== Navigation =====
  window.navigateTo = function(page, param) {
    lastPage = document.querySelector('.page.active')?.id.replace('page-', '') || 'home';

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    document.getElementById('page-' + page).classList.add('active');
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

    if (page === 'home') renderHome();
    if (page === 'list') renderList('all');
    if (page === 'detail' && param) renderDetail(param);

    window.scrollTo(0, 0);
  };

  window.goBack = function() {
    navigateTo(lastPage === 'detail' ? 'home' : lastPage);
  };

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ===== Utils =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Events =====
  function bindEvents() {
    // Save
    document.getElementById('btn-save').addEventListener('click', saveInspiration);

    // Voice
    document.getElementById('btn-voice').addEventListener('click', startVoice);
    document.getElementById('voice-stop').addEventListener('click', stopVoice);

    // Tag
    document.getElementById('btn-add-tag').addEventListener('click', openTagPopup);
    document.getElementById('tag-popup-overlay').addEventListener('click', closeTagPopup);
    document.getElementById('tag-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmTag(); }
    });
    document.querySelectorAll('.quick-tag').forEach(el => {
      el.addEventListener('click', () => {
        const tag = el.dataset.tag;
        if (!currentTags.includes(tag)) currentTags.push(tag);
        updateTagBtn();
        closeTagPopup();
      });
    });

    // Nav
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => navigateTo(el.dataset.page));
    });

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderList(tab.dataset.filter);
      });
    });

    // Textarea auto-focus on load
    setTimeout(() => document.getElementById('input-area').focus(), 300);
  }

  // ===== Demo Data =====
  function seedDemoData() {
    if (inspirations.length) return;
    const demos = [
      { text: '做一个可以把每天的灵感自动生成思维导图的工具，这样就能看到自己思路的变化轨迹', tags: ['创意', '产品'], category: '创意' },
      { text: '下周要和设计团队讨论新版首页的视觉风格，参考一下Pinterest上的极简风格', tags: ['工作', '待办'], category: '工作' },
      { text: '读到一句话：写作的本质是思考。要多记录，才能多思考。', tags: ['读书', '灵感'], category: '学习' },
      { text: '洗澡的时候想到，如果把语音笔记和AI分类结合起来，会不会做出一个不一样的产品', tags: ['灵感', '产品'], category: '创意' },
      { text: '周末想去试试那家新开的咖啡馆，据说手冲很不错', tags: ['生活'], category: '生活' }
    ];
    const now = Date.now();
    inspirations = demos.map((d, i) => ({
      id: generateId(),
      text: d.text,
      tags: d.tags,
      category: d.category,
      created: now - i * 3600000 * (i + 1)
    }));
    saveData();
  }

  // ===== Start =====
  seedDemoData();
  init();
})();
</script>
