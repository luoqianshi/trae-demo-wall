<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能错题归集工具</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --accent-color: #F5A623;
            --background-color: #F8F9FA;
            --card-color: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --border-color: #E1E8ED;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
            
            /* 标签预设颜色 */
            --tag-math: #5B9BD5;
            --tag-chinese: #ED7D31;
            --tag-english: #70AD47;
            --tag-physics: #FFC000;
            --tag-chemistry: #9E480E;
            --tag-biology: #99AFD3;
            --tag-history: #8B5CF6;
            --tag-geography: #EC4899;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* 头部导航 */
        .header {
            background: var(--card-color);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
        }

        .header-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-number {
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 上传区域 */
        .upload-area {
            background: var(--card-color);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background: rgba(74, 144, 226, 0.05);
        }

        .upload-area.dragover {
            transform: scale(1.02);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .upload-text {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        #fileInput {
            display: none;
        }

        /* 标签区域 */
        .tags-section {
            background: var(--card-color);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .tags-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tags-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .add-tag-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-tag-btn:hover {
            background: #3A7BC8;
            transform: translateY(-2px);
        }

        .tags-container {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--background-color);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-size: 0.9rem;
        }

        .tag:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .tag.active {
            border-color: currentColor;
            background: currentColor;
            color: white;
        }

        .tag-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .tag-name {
            font-weight: 500;
        }

        .tag-count {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .tag-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tag:hover .tag-actions {
            opacity: 1;
        }

        .tag-edit, .tag-delete {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .tag-edit:hover, .tag-delete:hover {
            transform: scale(1.2);
        }

        /* 图片网格 */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .image-card {
            background: var(--card-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .image-card.selected {
            outline: 3px solid var(--primary-color);
        }

        .image-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-checkbox {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            width: 24px;
            height: 24px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }

        .image-card:hover .image-checkbox,
        .image-card.selected .image-checkbox {
            opacity: 1;
        }

        .image-card.selected .image-checkbox {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .image-checkbox svg {
            color: white;
            opacity: 0;
        }

        .image-card.selected .image-checkbox svg {
            opacity: 1;
        }

        .image-info {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .image-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .image-tag-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            color: white;
        }

        .image-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .image-delete {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
            color: #E74C3C;
        }

        .image-card:hover .image-delete {
            opacity: 1;
        }

        .image-delete:hover {
            background: #E74C3C;
            color: white;
            transform: scale(1.1);
        }

        /* 空白状态 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .empty-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .empty-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .empty-description {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 操作工具栏 */
        .toolbar {
            background: var(--card-color);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            bottom: 1rem;
            z-index: 50;
        }

        .toolbar-left {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .select-all-btn {
            background: var(--background-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .select-all-btn:hover {
            background: var(--border-color);
        }

        .selected-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .toolbar-right {
            display: flex;
            gap: 1rem;
        }

        .toolbar-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-btn:hover {
            background: #3A7BC8;
            transform: translateY(-2px);
        }

        .toolbar-btn.delete-btn {
            background: #E74C3C;
        }

        .toolbar-btn.delete-btn:hover {
            background: #C0392B;
        }

        .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-color);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .color-picker {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: var(--text-primary);
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .modal-btn.primary {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .modal-btn.primary:hover {
            background: #3A7BC8;
        }

        .modal-btn.secondary {
            background: var(--background-color);
            color: var(--text-primary);
            border: none;
        }

        .modal-btn.secondary:hover {
            background: var(--border-color);
        }

        /* 图片预览模态框 */
        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 2rem;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .preview-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-primary);
            transition: transform 0.2s;
        }

        .preview-close:hover {
            transform: scale(1.1);
        }

        /* 标签选择模态框 */
        .tag-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .tag-select-item {
            padding: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tag-select-item:hover {
            border-color: var(--primary-color);
        }

        .tag-select-item.selected {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        /* 打印样式 */
        @media print {
            .header, .upload-area, .tags-section, .toolbar, .modal, .preview-modal, 
            .image-checkbox, .image-delete, .image-actions {
                display: none !important;
            }

            body {
                background: white;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            .images-grid {
                display: block;
                page-break-inside: avoid;
            }

            .image-card {
                page-break-inside: avoid;
                margin-bottom: 1rem;
                display: inline-block;
                width: calc(50% - 0.5rem);
                box-shadow: none;
                border: 1px solid var(--border-color);
            }

            .image-wrapper {
                height: 300px;
            }

            .image-info {
                padding: 0.5rem;
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .header-stats {
                font-size: 0.8rem;
                gap: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .upload-area {
                padding: 2rem 1rem;
            }

            .upload-icon {
                width: 48px;
                height: 48px;
            }

            .upload-text {
                font-size: 1rem;
            }

            .tags-container {
                gap: 0.5rem;
            }

            .tag {
                padding: 0.4rem 0.75rem;
                font-size: 0.85rem;
            }

            .images-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .image-wrapper {
                height: 150px;
            }

            .toolbar {
                padding: 0.75rem;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 0;
            }

            .toolbar-btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .modal-content {
                margin: 1rem;
            }
        }

        @media (min-width: 1024px) {
            .images-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1280px) {
            .images-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* 加载动画 */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--text-primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
            z-index: 400;
            animation: slideIn 0.3s ease;
            max-width: 300px;
        }

        .toast.error {
            background: #E74C3C;
        }

        .toast.success {
            background: #27AE60;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s;
        }

        /* 拖拽时的视觉效果 */
        .upload-area.dragover .upload-icon {
            animation: bounce 0.5s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 禁用状态 */
        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    <path d="M9 14l2 2 4-4"/>
                </svg>
                智能错题归集
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span class="stat-number" id="totalImages">0</span> 张错题
                </div>
                <div class="stat-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
                        <line x1="7" y2="7" x2="7.01" y2="7"/>
                    </svg>
                    <span class="stat-number" id="totalTags">0</span> 个标签
                </div>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="upload-text">拖拽图片到这里上传</div>
            <div class="upload-hint">或点击选择文件（支持 JPG、PNG、GIF、WEBP，单个文件最大 10MB）</div>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <!-- 标签区域 -->
        <div class="tags-section">
            <div class="tags-header">
                <div class="tags-title">学科标签分类</div>
                <button class="add-tag-btn" onclick="openTagModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加标签
                </button>
            </div>
            <div class="tags-container" id="tagsContainer"></div>
        </div>

        <!-- 图片网格 -->
        <div id="imagesContainer"></div>

        <!-- 操作工具栏 -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-left">
                <button class="select-all-btn" onclick="toggleSelectAll()">全选 / 取消全选</button>
                <span class="selected-count">已选择 <span id="selectedCount">0</span> 张</span>
            </div>
            <div class="toolbar-right">
                <button class="toolbar-btn delete-btn" onclick="deleteSelected()" id="deleteBtn" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                    删除
                </button>
                <button class="toolbar-btn" onclick="printImages()" id="printBtn" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    打印 / 导出
                </button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑标签模态框 -->
    <div class="modal" id="tagModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="tagModalTitle">添加标签</h3>
                <button class="modal-close" onclick="closeTagModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">标签名称</label>
                    <input type="text" class="form-input" id="tagNameInput" placeholder="例如：数学、语文">
                </div>
                <div class="form-group">
                    <label class="form-label">标签颜色</label>
                    <div class="color-picker" id="colorPicker"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeTagModal()">取消</button>
                <button class="modal-btn primary" onclick="saveTag()">保存</button>
            </div>
        </div>
    </div>

    <!-- 图片标签选择模态框 -->
    <div class="modal" id="imageTagModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">选择标签</h3>
                <button class="modal-close" onclick="closeImageTagModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="tag-select-grid" id="tagSelectGrid"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeImageTagModal()">取消</button>
                <button class="modal-btn primary" onclick="saveImageTags()">保存</button>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="preview-modal" id="previewModal">
        <img class="preview-image" id="previewImage" src="" alt="预览">
        <button class="preview-close" onclick="closePreview()">×</button>
    </div>

    <script>
        // 应用状态
        const state = {
            images: [],
            tags: [],
            imageTags: [],
            selectedImages: [],
            activeTag: null,
            editingTagId: null,
            currentImageId: null,
            selectedColorIndex: 0
        };

        // 预设颜色
        const presetColors = [
            '#5B9BD5', '#ED7D31', '#70AD47', '#FFC000',
            '#9E480E', '#99AFD3', '#8B5CF6', '#EC4899'
        ];

        // 预设标签
        const defaultTags = [
            { id: 'tag-1', name: '数学', color: '#5B9BD5', createTime: new Date().toISOString() },
            { id: 'tag-2', name: '语文', color: '#ED7D31', createTime: new Date().toISOString() },
            { id: 'tag-3', name: '英语', color: '#70AD47', createTime: new Date().toISOString() },
            { id: 'tag-4', name: '物理', color: '#FFC000', createTime: new Date().toISOString() },
            { id: 'tag-5', name: '化学', color: '#9E480E', createTime: new Date().toISOString() },
            { id: 'tag-6', name: '生物', color: '#99AFD3', createTime: new Date().toISOString() },
            { id: 'tag-7', name: '历史', color: '#8B5CF6', createTime: new Date().toISOString() },
            { id: 'tag-8', name: '地理', color: '#EC4899', createTime: new Date().toISOString() }
        ];

        // 初始化应用
        function init() {
            loadFromStorage();
            if (state.tags.length === 0) {
                state.tags = defaultTags;
                saveToStorage();
            }
            renderTags();
            renderImages();
            setupUploadArea();
            updateStats();
            initColorPicker();
        }

        // 从本地存储加载
        function loadFromStorage() {
            try {
                const savedTags = localStorage.getItem('wrongQuestions_tags');
                const savedImages = localStorage.getItem('wrongQuestions_images');
                const savedImageTags = localStorage.getItem('wrongQuestions_imageTags');

                if (savedTags) state.tags = JSON.parse(savedTags);
                if (savedImages) state.images = JSON.parse(savedImages);
                if (savedImageTags) state.imageTags = JSON.parse(savedImageTags);
            } catch (e) {
                console.error('加载存储数据失败:', e);
            }
        }

        // 保存到本地存储
        function saveToStorage() {
            try {
                localStorage.setItem('wrongQuestions_tags', JSON.stringify(state.tags));
                localStorage.setItem('wrongQuestions_images', JSON.stringify(state.images));
                localStorage.setItem('wrongQuestions_imageTags', JSON.stringify(state.imageTags));
            } catch (e) {
                showToast('存储空间不足，请清理浏览器缓存', 'error');
            }
        }

        // 生成唯一ID
        function generateId() {
            return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // 设置上传区域
        function setupUploadArea() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            // 点击上传
            uploadArea.addEventListener('click', () => fileInput.click());

            // 文件选择
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                fileInput.value = '';
            });

            // 拖拽上传
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
        }

        // 处理上传文件
        function handleFiles(files) {
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            const maxSize = 10 * 1024 * 1024; // 10MB

            let validFiles = [];
            for (let file of files) {
                if (!validTypes.includes(file.type)) {
                    showToast(`文件 ${file.name} 格式不支持`, 'error');
                    continue;
                }
                if (file.size > maxSize) {
                    showToast(`文件 ${file.name} 大于10MB`, 'error');
                    continue;
                }
                validFiles.push(file);
            }

            if (validFiles.length === 0) return;

            // 显示上传进度
            const uploadArea = document.getElementById('uploadArea');
            const originalContent = uploadArea.innerHTML;
            uploadArea.innerHTML = `
                <div class="loading-spinner"></div>
                <div>正在上传 ${validFiles.length} 张图片...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            `;

            let processed = 0;
            validFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const imageData = {
                            id: generateId(),
                            fileName: file.name,
                            dataUrl: e.target.result,
                            uploadTime: new Date().toISOString(),
                            width: img.width,
                            height: img.height,
                            size: file.size
                        };

                        state.images.unshift(imageData);
                        processed++;

                        // 更新进度
                        const progress = (processed / validFiles.length) * 100;
                        document.getElementById('progressFill').style.width = progress + '%';

                        if (processed === validFiles.length) {
                            setTimeout(() => {
                                uploadArea.innerHTML = originalContent;
                                saveToStorage();
                                renderImages();
                                updateStats();
                                showToast(`成功上传 ${validFiles.length} 张图片`);
                            }, 500);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 渲染标签
        function renderTags() {
            const container = document.getElementById('tagsContainer');
            container.innerHTML = '';

            // 全部标签
            const allTag = document.createElement('div');
            allTag.className = 'tag' + (state.activeTag === null ? ' active' : '');
            allTag.style.color = '#7F8C8D';
            allTag.innerHTML = `
                <span class="tag-name">全部</span>
                <span class="tag-count">${state.images.length}</span>
            `;
            allTag.onclick = () => filterByTag(null);
            container.appendChild(allTag);

            // 学科标签
            state.tags.forEach(tag => {
                const count = state.imageTags.filter(it => it.tagId === tag.id).length;
                const tagEl = document.createElement('div');
                tagEl.className = 'tag' + (state.activeTag === tag.id ? ' active' : '');
                tagEl.style.color = tag.color;
                tagEl.innerHTML = `
                    <span class="tag-color" style="background-color: ${tag.color}"></span>
                    <span class="tag-name">${escapeHtml(tag.name)}</span>
                    <span class="tag-count">${count}</span>
                    <div class="tag-actions">
                        <button class="tag-edit" onclick="editTag('${tag.id}')">✎</button>
                        <button class="tag-delete" onclick="deleteTag('${tag.id}')">✕</button>
                    </div>
                `;
                tagEl.onclick = (e) => {
                    if (!e.target.closest('.tag-actions')) {
                        filterByTag(tag.id);
                    }
                };
                container.appendChild(tagEl);
            });
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 按标签筛选
        function filterByTag(tagId) {
            state.activeTag = tagId;
            state.selectedImages = [];
            renderTags();
            renderImages();
            updateSelectedCount();
        }

        // 渲染图片
        function renderImages() {
            const container = document.getElementById('imagesContainer');

            // 筛选图片
            let filteredImages = state.images;
            if (state.activeTag !== null) {
                filteredImages = state.images.filter(img => {
                    return state.imageTags.some(it => it.imageId === img.id && it.tagId === state.activeTag);
                });
            }

            // 空白状态
            if (filteredImages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <h3 class="empty-title">${state.activeTag ? '该标签下暂无错题' : '暂无错题记录'}</h3>
                        <p class="empty-description">
                            ${state.activeTag ? '请上传相关学科的错题图片' : '开始上传你的错题图片，系统化管理学习内容'}
                        </p>
                    </div>
                `;
                return;
            }

            // 图片网格
            const grid = document.createElement('div');
            grid.className = 'images-grid';

            filteredImages.forEach(image => {
                const imageTags = state.imageTags
                    .filter(it => it.imageId === image.id)
                    .map(it => state.tags.find(t => t.id === it.tagId))
                    .filter(t => t);

                const isSelected = state.selectedImages.includes(image.id);

                const card = document.createElement('div');
                card.className = 'image-card' + (isSelected ? ' selected' : '');
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${image.dataUrl}" alt="${escapeHtml(image.fileName)}" loading="lazy">
                        <div class="image-checkbox" onclick="toggleImageSelect('${image.id}', event)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <button class="image-delete" onclick="deleteImage('${image.id}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="image-info">
                        <div class="image-tags">
                            ${imageTags.map(tag => `
                                <span class="image-tag-badge" style="background-color: ${tag.color}">
                                    ${escapeHtml(tag.name)}
                                </span>
                            `).join('')}
                            <button class="image-tag-badge" style="background-color: var(--text-secondary)" 
                                    onclick="openImageTagModal('${image.id}', event)">
                                + 添加标签
                            </button>
                        </div>
                        <div class="image-date">${formatDate(image.uploadTime)}</div>
                    </div>
                `;

                card.onclick = (e) => {
                    if (!e.target.closest('.image-checkbox') && 
                        !e.target.closest('.image-delete') && 
                        !e.target.closest('.image-tag-badge')) {
                        openPreview(image.dataUrl);
                    }
                };

                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return '今天上传';
            if (days === 1) return '昨天上传';
            if (days < 7) return `${days}天前上传`;
            return date.toLocaleDateString('zh-CN');
        }

        // 图片选择
        function toggleImageSelect(imageId, event) {
            event.stopPropagation();
            const index = state.selectedImages.indexOf(imageId);
            if (index === -1) {
                state.selectedImages.push(imageId);
            } else {
                state.selectedImages.splice(index, 1);
            }
            renderImages();
            updateSelectedCount();
        }

        // 更新选中数量
        function updateSelectedCount() {
            const count = state.selectedImages.length;
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('deleteBtn').disabled = count === 0;
            document.getElementById('printBtn').disabled = count === 0;
        }

        // 全选/取消全选
        function toggleSelectAll() {
            let filteredImages = state.images;
            if (state.activeTag !== null) {
                filteredImages = state.images.filter(img => {
                    return state.imageTags.some(it => it.imageId === img.id && it.tagId === state.activeTag);
                });
            }

            if (state.selectedImages.length === filteredImages.length) {
                state.selectedImages = [];
            } else {
                state.selectedImages = filteredImages.map(img => img.id);
            }

            renderImages();
            updateSelectedCount();
        }

        // 删除单张图片
        function deleteImage(imageId) {
            if (!confirm('确定删除这张图片吗？')) return;

            state.images = state.images.filter(img => img.id !== imageId);
            state.imageTags = state.imageTags.filter(it => it.imageId !== imageId);
            state.selectedImages = state.selectedImages.filter(id => id !== imageId);

            saveToStorage();
            renderImages();
            renderTags();
            updateStats();
            updateSelectedCount();
            showToast('图片已删除');
        }

        // 删除选中的图片
        function deleteSelected() {
            if (state.selectedImages.length === 0) return;
            if (!confirm(`确定删除 ${state.selectedImages.length} 张图片吗？`)) return;

            state.images = state.images.filter(img => !state.selectedImages.includes(img.id));
            state.imageTags = state.imageTags.filter(it => !state.selectedImages.includes(it.imageId));
            state.selectedImages = [];

            saveToStorage();
            renderImages();
            renderTags();
            updateStats();
            updateSelectedCount();
            showToast('批量删除成功');
        }

        // 打印图片
        function printImages() {
            if (state.selectedImages.length === 0) {
                showToast('请先选择要打印的图片', 'error');
                return;
            }

            const selectedImageData = state.images.filter(img => state.selectedImages.includes(img.id));
            const container = document.getElementById('imagesContainer');

            // 创建临时打印容器
            const printContainer = document.createElement('div');
            printContainer.className = 'images-grid';

            selectedImageData.forEach(image => {
                const imageTags = state.imageTags
                    .filter(it => it.imageId === image.id)
                    .map(it => state.tags.find(t => t.id === it.tagId))
                    .filter(t => t);

                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${image.dataUrl}" alt="${escapeHtml(image.fileName)}">
                    </div>
                    <div class="image-info">
                        <div class="image-tags">
                            ${imageTags.map(tag => `
                                <span class="image-tag-badge" style="background-color: ${tag.color}">
                                    ${escapeHtml(tag.name)}
                                </span>
                            `).join('')}
                        </div>
                        <div class="image-date">${formatDate(image.uploadTime)}</div>
                    </div>
                `;
                printContainer.appendChild(card);
            });

            // 临时替换内容
            const originalContent = container.innerHTML;
            container.innerHTML = '';
            container.appendChild(printContainer);

            // 打印
            setTimeout(() => {
                window.print();
                // 恢复原内容
                setTimeout(() => {
                    container.innerHTML = originalContent;
                }, 100);
            }, 100);
        }

        // 图片预览
        function openPreview(imageUrl) {
            document.getElementById('previewImage').src = imageUrl;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        // 标签模态框
        function initColorPicker() {
            const picker = document.getElementById('colorPicker');
            picker.innerHTML = presetColors.map((color, index) => `
                <div class="color-option ${index === state.selectedColorIndex ? 'selected' : ''}" 
                     style="background-color: ${color}"
                     onclick="selectColor(${index})"></div>
            `).join('');
        }

        function selectColor(index) {
            state.selectedColorIndex = index;
            initColorPicker();
        }

        function openTagModal(tagId = null) {
            state.editingTagId = tagId;
            document.getElementById('tagModalTitle').textContent = tagId ? '编辑标签' : '添加标签';

            if (tagId) {
                const tag = state.tags.find(t => t.id === tagId);
                document.getElementById('tagNameInput').value = tag.name;
                const colorIndex = presetColors.indexOf(tag.color);
                if (colorIndex !== -1) {
                    state.selectedColorIndex = colorIndex;
                    initColorPicker();
                }
            } else {
                document.getElementById('tagNameInput').value = '';
                state.selectedColorIndex = 0;
                initColorPicker();
            }

            document.getElementById('tagModal').classList.add('active');
            document.getElementById('tagNameInput').focus();
        }

        function closeTagModal() {
            document.getElementById('tagModal').classList.remove('active');
        }

        function saveTag() {
            const name = document.getElementById('tagNameInput').value.trim();
            if (!name) {
                showToast('请输入标签名称', 'error');
                return;
            }

            const color = presetColors[state.selectedColorIndex];

            if (state.editingTagId) {
                const tag = state.tags.find(t => t.id === state.editingTagId);
                tag.name = name;
                tag.color = color;
            } else {
                state.tags.push({
                    id: generateId(),
                    name: name,
                    color: color,
                    createTime: new Date().toISOString()
                });
            }

            saveToStorage();
            renderTags();
            updateStats();
            closeTagModal();
            showToast(state.editingTagId ? '标签已更新' : '标签已添加');
        }

        function editTag(tagId) {
            openTagModal(tagId);
        }

        function deleteTag(tagId) {
            if (!confirm('确定删除这个标签吗？')) return;

            state.tags = state.tags.filter(t => t.id !== tagId);
            state.imageTags = state.imageTags.filter(it => it.tagId !== tagId);

            if (state.activeTag === tagId) {
                state.activeTag = null;
            }

            saveToStorage();
            renderTags();
            renderImages();
            updateStats();
            showToast('标签已删除');
        }

        // 图片标签选择
        function openImageTagModal(imageId, event) {
            event.stopPropagation();
            state.currentImageId = imageId;

            const grid = document.getElementById('tagSelectGrid');
            grid.innerHTML = state.tags.map(tag => {
                const isSelected = state.imageTags.some(
                    it => it.imageId === imageId && it.tagId === tag.id
                );
                return `
                    <div class="tag-select-item ${isSelected ? 'selected' : ''}" 
                         onclick="toggleImageTag('${tag.id}')"
                         style="border-color: ${tag.color}">
                        <span style="background-color: ${tag.color}; width: 24px; height: 24px; border-radius: 50%; display: inline-block;"></span>
                        <span>${escapeHtml(tag.name)}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('imageTagModal').classList.add('active');
        }

        function closeImageTagModal() {
            document.getElementById('imageTagModal').classList.remove('active');
        }

        function toggleImageTag(tagId) {
            const existing = state.imageTags.findIndex(
                it => it.imageId === state.currentImageId && it.tagId === tagId
            );

            if (existing === -1) {
                state.imageTags.push({
                    imageId: state.currentImageId,
                    tagId: tagId
                });
            } else {
                state.imageTags.splice(existing, 1);
            }

            // 更新UI
            const grid = document.getElementById('tagSelectGrid');
            grid.innerHTML = state.tags.map(tag => {
                const isSelected = state.imageTags.some(
                    it => it.imageId === state.currentImageId && it.tagId === tag.id
                );
                return `
                    <div class="tag-select-item ${isSelected ? 'selected' : ''}" 
                         onclick="toggleImageTag('${tag.id}')"
                         style="border-color: ${tag.color}">
                        <span style="background-color: ${tag.color}; width: 24px; height: 24px; border-radius: 50%; display: inline-block;"></span>
                        <span>${escapeHtml(tag.name)}</span>
                    </div>
                `;
            }).join('');
        }

        function saveImageTags() {
            saveToStorage();
            renderImages();
            renderTags();
            closeImageTagModal();
            showToast('标签已保存');
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('totalImages').textContent = state.images.length;
            document.getElementById('totalTags').textContent = state.tags.length;
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeTagModal();
                closeImageTagModal();
                closePreview();
            }
        });

        // 点击模态框外部关闭
        document.getElementById('tagModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeTagModal();
            }
        });

        document.getElementById('imageTagModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeImageTagModal();
            }
        });

        document.getElementById('previewModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('preview-modal') || e.target.classList.contains('preview-close')) {
                closePreview();
            }
        });

        // 启动应用
        init();
    </script>
</body>
</html>
