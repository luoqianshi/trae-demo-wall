<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style id="theme-vars">
:root {
  /* === Color System === */
  --color-primary: #FF6B9D;
  --color-primary-light: #FFA0C0;
  --color-primary-lighter: #FFD6E5;
  --color-primary-lightest: #FFF0F5;
  --color-primary-dark: #E8447A;
  --color-primary-darker: #C4265E;

  --color-secondary: #7C5CFC;
  --color-secondary-light: #A78BFA;
  --color-secondary-lighter: #DDD6FE;
  --color-secondary-lightest: #F3EEFF;
  --color-secondary-dark: #6341E0;
  --color-secondary-darker: #4C28C7;

  --color-accent-warm: #FFB347;
  --color-accent-warm-light: #FFD699;
  --color-accent-warm-lighter: #FFF3E0;
  --color-accent-mint: #4ECDC4;
  --color-accent-mint-light: #7EDDD7;
  --color-accent-mint-lighter: #E0F7F5;

  --color-bg: #FFFAF9;
  --color-bg-secondary: #FFF5F3;
  --color-bg-tertiary: #FFEDE8;

  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFFFF;

  --color-border: #FFE4DE;
  --color-border-light: #FFF0EC;
  --color-divider: #FFE8E2;

  --color-text-primary: #2D1B30;
  --color-text-secondary: #6B5570;
  --color-text-tertiary: #A08DA5;
  --color-text-inverse: #FFFFFF;

  --color-state-success: #34D399;
  --color-state-success-light: #D1FAE5;
  --color-state-warning: #FBBF24;
  --color-state-warning-light: #FEF3C7;
  --color-state-error: #F87171;
  --color-state-error-light: #FEE2E2;
  --color-state-info: #60A5FA;
  --color-state-info-light: #DBEAFE;

  /* === Typography === */
  --font-family-display: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-body: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --font-size-xs: 0.6875rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.9375rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 2rem;
  --font-size-4xl: 2.5rem;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.02em;

  /* === Spacing === */
  --spacing-1: 0.25rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-8: 2rem;
  --spacing-10: 2.5rem;
  --spacing-12: 3rem;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-xs: 0 1px 2px rgba(45, 27, 48, 0.04);
  --shadow-sm: 0 2px 8px rgba(45, 27, 48, 0.06);
  --shadow-md: 0 4px 16px rgba(45, 27, 48, 0.08);
  --shadow-lg: 0 8px 24px rgba(45, 27, 48, 0.10);
  --shadow-xl: 0 12px 32px rgba(45, 27, 48, 0.12);
  --shadow-float: 0 12px 40px rgba(124, 92, 252, 0.18);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">

  <!-- Mini Program Nav Bar -->
  <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm flex items-center justify-between px-4 h-11">
    <span class="w-8"></span>
    <span class="text-sm font-semibold" style="color: var(--color-text-primary);">徽章交换</span>
    <div class="flex items-center gap-1">
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/></svg>
    </div>
  </div>

  <main class="pb-[70px]">

    <!-- Hero Banner -->
    <div class="relative mx-3 mt-3 rounded-2xl overflow-hidden" style="height: 180px;">
      <img src="../assets/image_0_yi19x4.jpg" alt="首页banner插画" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent rounded-2xl"></div>
      <div class="absolute bottom-0 left-0 right-0 p-4">
        <h2 class="text-white font-bold text-xl mb-2">发现你的下一枚徽章</h2>
        <div class="flex items-center bg-white/90 rounded-full px-3 py-2">
          <svg class="w-4 h-4 mr-2 flex-shrink-0" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="text-xs" style="color: var(--color-text-tertiary);">搜索徽章、用户...</span>
        </div>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="flex gap-2 px-4 mt-4 overflow-x-auto no-scrollbar">
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold text-white" style="background: var(--color-primary);">全部</span>
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border" style="color: var(--color-text-secondary); border-color: var(--color-border); background: var(--color-surface);">奥运系列</span>
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border" style="color: var(--color-text-secondary); border-color: var(--color-border); background: var(--color-surface);">迪士尼</span>
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border" style="color: var(--color-text-secondary); border-color: var(--color-border); background: var(--color-surface);">校园</span>
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border" style="color: var(--color-text-secondary); border-color: var(--color-border); background: var(--color-surface);">动漫</span>
      <span class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border" style="color: var(--color-text-secondary); border-color: var(--color-border); background: var(--color-surface);">城市纪念</span>
    </div>

    <!-- Hot Recommendations -->
    <div class="px-4 mt-5">
      <h3 class="text-base font-bold mb-3" style="color: var(--color-text-primary);">热门推荐</h3>
      <div class="grid grid-cols-2 gap-3">

        <!-- Badge Card 1 -->
        <a href="#" data-dom-id="link-detail" class="bg-white rounded-2xl overflow-hidden border" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="aspect-square overflow-hidden">
            <img src="../assets/image_1_yi19x4.jpg" alt="奥运徽章" class="w-full h-full object-cover">
          </div>
          <div class="p-2.5">
            <p class="text-xs font-semibold truncate" style="color: var(--color-text-primary);">2024巴黎奥运徽章</p>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[10px]" style="color: var(--color-text-tertiary);">小王同学</span>
              <svg class="w-3.5 h-3.5" style="color: var(--color-primary);" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
          </div>
        </a>

        <!-- Badge Card 2 -->
        <a href="#" data-dom-id="link-detail" class="bg-white rounded-2xl overflow-hidden border" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="aspect-square overflow-hidden">
            <img src="../assets/image_1_yi19x4.jpg" alt="迪士尼徽章" class="w-full h-full object-cover" style="object-position: 20% 30%;">
          </div>
          <div class="p-2.5">
            <p class="text-xs font-semibold truncate" style="color: var(--color-text-primary);">迪士尼100周年</p>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[10px]" style="color: var(--color-text-tertiary);">收藏家阿花</span>
              <svg class="w-3.5 h-3.5" style="color: var(--color-primary-light);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
          </div>
        </a>

        <!-- Badge Card 3 -->
        <a href="#" data-dom-id="link-detail" class="bg-white rounded-2xl overflow-hidden border" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="aspect-square overflow-hidden">
            <img src="../assets/image_1_yi19x4.jpg" alt="校园徽章" class="w-full h-full object-cover" style="object-position: 60% 50%;">
          </div>
          <div class="p-2.5">
            <p class="text-xs font-semibold truncate" style="color: var(--color-text-primary);">清华校徽纪念版</p>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[10px]" style="color: var(--color-text-tertiary);">小明同学</span>
              <svg class="w-3.5 h-3.5" style="color: var(--color-primary);" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
          </div>
        </a>

        <!-- Badge Card 4 -->
        <a href="#" data-dom-id="link-detail" class="bg-white rounded-2xl overflow-hidden border" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="aspect-square overflow-hidden">
            <img src="../assets/image_1_yi19x4.jpg" alt="动漫徽章" class="w-full h-full object-cover" style="object-position: 40% 70%;">
          </div>
          <div class="p-2.5">
            <p class="text-xs font-semibold truncate" style="color: var(--color-text-primary);">龙珠超限定徽章</p>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[10px]" style="color: var(--color-text-tertiary);">徽章达人小王</span>
              <svg class="w-3.5 h-3.5" style="color: var(--color-primary-light);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
          </div>
        </a>

      </div>
    </div>

    <!-- New Friends Section -->
    <div class="px-4 mt-6 mb-4">
      <h3 class="text-base font-bold mb-3" style="color: var(--color-text-primary);">新朋友</h3>
      <div class="flex gap-3 overflow-x-auto no-scrollbar">

        <div class="flex-shrink-0 bg-white rounded-2xl p-3 border flex flex-col items-center w-28" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-200 to-pink-300 mb-2"></div>
          <p class="text-xs font-semibold" style="color: var(--color-text-primary);">徽章达人小王</p>
          <p class="text-[10px] mt-0.5" style="color: var(--color-text-tertiary);">128枚徽章</p>
        </div>

        <div class="flex-shrink-0 bg-white rounded-2xl p-3 border flex flex-col items-center w-28" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-200 to-purple-300 mb-2"></div>
          <p class="text-xs font-semibold" style="color: var(--color-text-primary);">收藏家阿花</p>
          <p class="text-[10px] mt-0.5" style="color: var(--color-text-tertiary);">96枚徽章</p>
        </div>

        <div class="flex-shrink-0 bg-white rounded-2xl p-3 border flex flex-col items-center w-28" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-200 to-amber-300 mb-2"></div>
          <p class="text-xs font-semibold" style="color: var(--color-text-primary);">小明同学</p>
          <p class="text-[10px] mt-0.5" style="color: var(--color-text-tertiary);">45枚徽章</p>
        </div>

      </div>
    </div>

  </main>

  <!-- Bottom Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]" style="border-color: var(--color-border);" data-nav-key="home">
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-home" data-tab-key="home" style="color: var(--color-primary); font-weight: 600;">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-square" data-tab-key="square" style="color: var(--color-text-tertiary);">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>广场</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-cabinet" data-tab-key="cabinet" style="color: var(--color-text-tertiary);">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>展柜</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs relative" data-dom-id="nav-messages" data-tab-key="messages" style="color: var(--color-text-tertiary);">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span class="absolute -top-0.5 -right-1 w-2 h-2 rounded-full" style="background: var(--color-state-error);"></span>
      <span>消息</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-profile" data-tab-key="profile" style="color: var(--color-text-tertiary);">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </a>
  </nav>

</body>
</html>
