<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的展柜</title>
    <style id="theme-vars">
:root {
  --color-primary: #FF6B9D;
  --color-primary-light: #FFA0C0;
  --color-primary-lighter: #FFD6E5;
  --color-primary-lightest: #FFF0F5;
  --color-primary-dark: #E8447A;
  --color-primary-darker: #C4265E;
  --color-secondary: #7C5CFC;
  --color-secondary-light: #A78BFA;
  --color-secondary-lighter: #DDD6FE;
  --color-secondary-lightest: #F3EEFF;
  --color-secondary-dark: #6341E0;
  --color-secondary-darker: #4C28C7;
  --color-accent-warm: #FFB347;
  --color-accent-warm-light: #FFD699;
  --color-accent-warm-lighter: #FFF3E0;
  --color-accent-mint: #4ECDC4;
  --color-accent-mint-light: #7EDDD7;
  --color-accent-mint-lighter: #E0F7F5;
  --color-bg: #FFFAF9;
  --color-bg-secondary: #FFF5F3;
  --color-bg-tertiary: #FFEDE8;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFFFF;
  --color-border: #FFE4DE;
  --color-border-light: #FFF0EC;
  --color-divider: #FFE8E2;
  --color-text-primary: #2D1B30;
  --color-text-secondary: #6B5570;
  --color-text-tertiary: #A08DA5;
  --color-text-inverse: #FFFFFF;
  --color-state-success: #34D399;
  --color-state-success-light: #D1FAE5;
  --color-state-warning: #FBBF24;
  --color-state-warning-light: #FEF3C7;
  --color-state-error: #F87171;
  --color-state-error-light: #FEE2E2;
  --color-state-info: #60A5FA;
  --color-state-info-light: #DBEAFE;
  --font-family-display: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-body: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-size-xs: 0.6875rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.9375rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 2rem;
  --font-size-4xl: 2.5rem;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.02em;
  --spacing-1: 0.25rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-8: 2rem;
  --spacing-10: 2.5rem;
  --spacing-12: 3rem;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(45, 27, 48, 0.04);
  --shadow-sm: 0 2px 8px rgba(45, 27, 48, 0.06);
  --shadow-md: 0 4px 16px rgba(45, 27, 48, 0.08);
  --shadow-lg: 0 8px 24px rgba(45, 27, 48, 0.10);
  --shadow-xl: 0 12px 32px rgba(45, 27, 48, 0.12);
  --shadow-float: 0 12px 40px rgba(124, 92, 252, 0.18);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">

  <!-- Mini Program Nav Bar -->
  <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm flex items-center justify-between px-4 h-11">
    <span class="w-8"></span>
    <span class="text-sm font-semibold" style="color: var(--color-text-primary);">我的展柜</span>
    <div class="flex items-center gap-1">
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/></svg>
    </div>
  </div>

  <main class="pb-[100px]">

    <div class="mx-4 mt-3 rounded-2xl p-5 text-white" style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));">
      <div class="flex items-center gap-3">
        <div class="w-[60px] h-[60px] rounded-full border-2 border-white/40 bg-gradient-to-br from-white/30 to-white/10 flex-shrink-0"></div>
        <div>
          <p class="font-bold text-base">徽章达人小王</p>
          <p class="text-xs text-white/80 mt-0.5">收集世界各地的精美徽章</p>
        </div>
      </div>
      <div class="flex justify-around mt-4 pt-3 border-t border-white/20">
        <div class="text-center"><p class="font-bold text-lg">128</p><p class="text-[10px] text-white/80">收藏</p></div>
        <div class="text-center"><p class="font-bold text-lg">23</p><p class="text-[10px] text-white/80">交换</p></div>
        <div class="text-center"><p class="font-bold text-lg">56</p><p class="text-[10px] text-white/80">关注</p></div>
      </div>
    </div>

    <div class="flex gap-1 mx-4 mt-4 bg-white rounded-full p-1 border" style="border-color: var(--color-border-light);">
      <span class="flex-1 text-center py-1.5 rounded-full text-xs font-semibold text-white" style="background: var(--color-primary);">全部</span>
      <span class="flex-1 text-center py-1.5 rounded-full text-xs font-medium" style="color: var(--color-text-secondary);">可交换</span>
      <span class="flex-1 text-center py-1.5 rounded-full text-xs font-medium" style="color: var(--color-text-secondary);">仅展示</span>
      <span class="flex-1 text-center py-1.5 rounded-full text-xs font-medium" style="color: var(--color-text-secondary);">心愿单</span>
    </div>

    <div class="grid grid-cols-3 gap-3 px-4 mt-4">
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-pink-300 to-rose-400"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">巴黎奥运</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-violet-300 to-fuchsia-400"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">迪士尼100</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-amber-200 to-orange-300"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">龙珠超</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-teal-200 to-cyan-300"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">清华校徽</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-rose-200 to-pink-400"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">城市纪念</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-sky-200 to-blue-300"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">动漫限定</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-lime-200 to-green-300"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">校园系列</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-fuchsia-200 to-pink-300"></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-secondary);">环球旅行</span></div>
      <div class="flex flex-col items-center gap-1"><div class="w-full aspect-square rounded-2xl border-2 border-dashed flex items-center justify-center" style="border-color: var(--color-primary-light);"><svg class="w-6 h-6" style="color: var(--color-primary-light);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><span class="text-[10px] truncate w-full text-center" style="color: var(--color-text-tertiary);">添加</span></div>
    </div>

  </main>

  <div class="fixed bottom-20 right-4 w-12 h-12 rounded-full flex items-center justify-center" style="background: var(--color-primary); box-shadow: var(--shadow-md);">
    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]" style="border-color: var(--color-border);" data-nav-key="cabinet">
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-home" data-tab-key="home" style="color: var(--color-text-tertiary); ">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-square" data-tab-key="square" style="color: var(--color-text-tertiary); ">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>广场</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-cabinet" data-tab-key="cabinet" style="color: var(--color-primary); font-weight: 600;">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>展柜</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs relative" data-dom-id="nav-messages" data-tab-key="messages" style="color: var(--color-text-tertiary); ">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span class="absolute -top-0.5 -right-1 w-2 h-2 rounded-full" style="background: var(--color-state-error);"></span>
      <span>消息</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 text-xs" data-dom-id="nav-profile" data-tab-key="profile" style="color: var(--color-text-tertiary); ">
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </a>
  </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
