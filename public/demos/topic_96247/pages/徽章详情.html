<!DOCTYPE html>

    <style id="theme-vars">

  --color-accent-warm: #FFB347;
  --color-accent-warm-light: #FFD699;
  --color-accent-warm-lighter: #FFF3E0;
  --color-accent-mint: #4ECDC4;
  --color-accent-mint-light: #7EDDD7;

  --color-state-warning-light: #FEF3C7;

  --font-family-display: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-body: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-size-xs: 0.6875rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.9375rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 2rem;
  --font-size-4xl: 2.5rem;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;

  --line-height-relaxed: 1.625;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.02em;
  --spacing-1: 0.25rem;

  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">

  <!-- Mini Program Nav Bar -->
  <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm flex items-center justify-between px-4 h-11">
          <a href="#" data-dom-id="back-previous" class="w-8 h-8 flex items-center justify-center">
        <svg class="w-5 h-5" style="color: var(--color-text-primary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    <span class="text-sm font-semibold" style="color: var(--color-text-primary);">徽章详情</span>
    <div class="flex items-center gap-1">
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/></svg>
    </div>
  </div>

  <main class="pb-[100px]">

    <div class="px-4 mt-4">
      <div class="rounded-[20px] overflow-hidden" style="box-shadow: var(--shadow-sm);">
        <img src="../assets/image_2_yi19x4.jpg" alt="徽章细节展示" class="w-full aspect-square object-cover">
      </div>
    </div>

    <div class="px-4 mt-4">
      <div class="bg-white rounded-2xl p-4 border" style="border-color: var(--color-border-light);">
        <h2 class="text-lg font-bold" style="color: var(--color-text-primary);">2024巴黎奥运限量徽章</h2>
        <div class="flex flex-wrap gap-2 mt-2">
          <span class="px-3 py-1 rounded-full text-[11px] font-medium" style="background: var(--color-primary-lightest); color: var(--color-primary-dark);">金属</span>
          <span class="px-3 py-1 rounded-full text-[11px] font-medium" style="background: var(--color-primary-lightest); color: var(--color-primary-dark);">奥运系列</span>
          <span class="px-3 py-1 rounded-full text-[11px] font-medium" style="background: var(--color-primary-lightest); color: var(--color-primary-dark);">限量</span>
        </div>
        <p class="text-sm mt-3 leading-relaxed" style="color: var(--color-text-secondary);">2024年巴黎奥运会官方纪念徽章，金属材质珐琅工艺，限量发行5000枚。</p>
      </div>
    </div>

    <div class="px-4 mt-3">
      <div class="bg-white rounded-2xl p-4 border" style="border-color: var(--color-border-light);">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-pink-200 to-pink-300 flex-shrink-0"></div>
          <div class="flex-1">
            <p class="text-sm font-semibold" style="color: var(--color-text-primary);">徽章达人小王</p>
            <div class="flex gap-3 mt-1">
              <span class="text-[11px]" style="color: var(--color-text-tertiary);">收藏 128枚</span>
              <span class="text-[11px]" style="color: var(--color-text-tertiary);">交换 23次</span>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full text-xs font-semibold border" style="color: var(--color-primary); border-color: var(--color-primary);">关注</button>
        </div>
      </div>
    </div>

  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t px-4 py-3 pb-[max(0.75rem,calc(env(safe-area-inset-bottom)+0.5rem))]" style="border-color: var(--color-border);">
    <a href="#" data-dom-id="cta-exchange" class="block w-full py-3 rounded-[12px] text-center text-sm font-semibold text-white" style="background: var(--color-primary);">发起交换</a>
  </div>

    <script>lucide.createIcons();</script>
