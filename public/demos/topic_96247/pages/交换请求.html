<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交换请求</title>
    <style id="theme-vars">
:root {
  --color-primary: #FF6B9D;
  --color-primary-light: #FFA0C0;
  --color-primary-lighter: #FFD6E5;
  --color-primary-lightest: #FFF0F5;
  --color-primary-dark: #E8447A;
  --color-primary-darker: #C4265E;
  --color-secondary: #7C5CFC;
  --color-secondary-light: #A78BFA;
  --color-secondary-lighter: #DDD6FE;
  --color-secondary-lightest: #F3EEFF;
  --color-secondary-dark: #6341E0;
  --color-secondary-darker: #4C28C7;
  --color-accent-warm: #FFB347;
  --color-accent-warm-light: #FFD699;
  --color-accent-warm-lighter: #FFF3E0;
  --color-accent-mint: #4ECDC4;
  --color-accent-mint-light: #7EDDD7;
  --color-accent-mint-lighter: #E0F7F5;
  --color-bg: #FFFAF9;
  --color-bg-secondary: #FFF5F3;
  --color-bg-tertiary: #FFEDE8;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFFFF;
  --color-border: #FFE4DE;
  --color-border-light: #FFF0EC;
  --color-divider: #FFE8E2;
  --color-text-primary: #2D1B30;
  --color-text-secondary: #6B5570;
  --color-text-tertiary: #A08DA5;
  --color-text-inverse: #FFFFFF;
  --color-state-success: #34D399;
  --color-state-success-light: #D1FAE5;
  --color-state-warning: #FBBF24;
  --color-state-warning-light: #FEF3C7;
  --color-state-error: #F87171;
  --color-state-error-light: #FEE2E2;
  --color-state-info: #60A5FA;
  --color-state-info-light: #DBEAFE;
  --font-family-display: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-body: 'Quicksand', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-size-xs: 0.6875rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.9375rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 2rem;
  --font-size-4xl: 2.5rem;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.02em;
  --spacing-1: 0.25rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-8: 2rem;
  --spacing-10: 2.5rem;
  --spacing-12: 3rem;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(45, 27, 48, 0.04);
  --shadow-sm: 0 2px 8px rgba(45, 27, 48, 0.06);
  --shadow-md: 0 4px 16px rgba(45, 27, 48, 0.08);
  --shadow-lg: 0 8px 24px rgba(45, 27, 48, 0.10);
  --shadow-xl: 0 12px 32px rgba(45, 27, 48, 0.12);
  --shadow-float: 0 12px 40px rgba(124, 92, 252, 0.18);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">

  <!-- Mini Program Nav Bar -->
  <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm flex items-center justify-between px-4 h-11">
          <a href="#" data-dom-id="back-previous" class="w-8 h-8 flex items-center justify-center">
        <svg class="w-5 h-5" style="color: var(--color-text-primary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    <span class="text-sm font-semibold" style="color: var(--color-text-primary);">发起交换</span>
    <div class="flex items-center gap-1">
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/></svg>
    </div>
  </div>

  <main class="pb-[100px]">

    <div class="flex items-center justify-center gap-2 px-4 mt-4">
      <div class="flex items-center gap-1.5"><div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style="background: var(--color-primary);">1</div><span class="text-xs font-semibold" style="color: var(--color-primary);">选择徽章</span></div>
      <div class="w-8 h-px" style="background: var(--color-border);"></div>
      <div class="flex items-center gap-1.5"><div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold border" style="color: var(--color-text-tertiary); border-color: var(--color-border);">2</div><span class="text-xs" style="color: var(--color-text-tertiary);">填写说明</span></div>
      <div class="w-8 h-px" style="background: var(--color-border);"></div>
      <div class="flex items-center gap-1.5"><div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold border" style="color: var(--color-text-tertiary); border-color: var(--color-border);">3</div><span class="text-xs" style="color: var(--color-text-tertiary);">确认发送</span></div>
    </div>

    <div class="px-4 mt-5">
      <p class="text-xs font-semibold mb-3" style="color: var(--color-text-secondary);">对方想要</p>
      <div class="bg-white rounded-2xl p-4 border flex items-center gap-3" style="border-color: var(--color-border-light); box-shadow: var(--shadow-xs);">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-300 to-pink-400 flex-shrink-0"></div>
        <p class="text-sm font-semibold" style="color: var(--color-text-primary);">2024巴黎奥运限量徽章</p>
      </div>
    </div>

    <div class="flex justify-center my-4">
      <svg class="w-5 h-5" style="color: var(--color-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div class="px-4">
      <p class="text-xs font-semibold mb-3" style="color: var(--color-text-secondary);">我愿意提供</p>
      <div class="grid grid-cols-3 gap-3">
        <div class="relative aspect-square rounded-2xl bg-gradient-to-br from-rose-200 to-orange-300 border-2" style="border-color: var(--color-primary);"><div class="absolute top-1 right-1 w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);"><svg class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div></div>
        <div class="relative aspect-square rounded-2xl bg-gradient-to-br from-violet-200 to-fuchsia-300 border-2" style="border-color: var(--color-primary);"><div class="absolute top-1 right-1 w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);"><svg class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div></div>
        <div class="aspect-square rounded-2xl bg-gradient-to-br from-teal-200 to-cyan-300 border" style="border-color: var(--color-border-light);"></div>
        <div class="aspect-square rounded-2xl bg-gradient-to-br from-amber-200 to-orange-300 border" style="border-color: var(--color-border-light);"></div>
        <div class="aspect-square rounded-2xl bg-gradient-to-br from-sky-200 to-blue-300 border" style="border-color: var(--color-border-light);"></div>
        <div class="aspect-square rounded-2xl bg-gradient-to-br from-lime-200 to-green-300 border" style="border-color: var(--color-border-light);"></div>
      </div>
    </div>

    <div class="px-4 mt-5">
      <div class="bg-white rounded-2xl p-3 border" style="border-color: var(--color-border-light);">
        <p class="text-xs leading-relaxed" style="color: var(--color-text-tertiary);">写点什么吧，让对方更想交换~</p>
      </div>
    </div>

  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t px-4 py-3 pb-[max(0.75rem,calc(env(safe-area-inset-bottom)+0.5rem))]" style="border-color: var(--color-border);">
    <a href="#" class="block w-full py-3 rounded-full text-center text-sm font-semibold text-white" style="background: var(--color-primary);">下一步</a>
  </div>

    <script>lucide.createIcons();</script>
</body>
</html>
