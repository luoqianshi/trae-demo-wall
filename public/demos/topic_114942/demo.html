<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarTrail 星途 — Demo</title>
<link rel="stylesheet" href="css/style.css?v=115">
</head>
<body>

<!-- Canvas: 星环动画 -->
<canvas id="orbitCanvas"></canvas>

<!-- 左侧控件栏（毛玻璃，始终固定） -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-icons">
    <button class="sidebar-btn active" data-panel="orbit" title="星轨">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-15 12 12)"/>
        <ellipse cx="12" cy="12" rx="6" ry="2.5" transform="rotate(10 12 12)"/>
        <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      </svg>
    </button>
    <button class="sidebar-btn" data-panel="portrait" title="画像">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
        <circle cx="12" cy="8" r="4"/>
      </svg>
    </button>
    <button class="sidebar-btn" data-panel="settings" title="设置">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
      </svg>
    </button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-tier">
    <button class="tier-btn active" data-tier="BALANCED">Balanced</button>
    <button class="tier-btn" data-tier="ENHANCED">Enhanced</button>
    <button class="tier-btn" data-tier="HAKAI">Hakai</button>
  </div>
</aside>

<!-- 右下角控件浮层（参与混合淡出） -->
<div id="rightDock" class="right-dock">
  <div class="dock-item">
    <span class="dock-label">光子</span>
    <span class="dock-value" id="photonCount">0</span>
  </div>
  <div class="dock-item">
    <span class="dock-label">星环</span>
    <span class="dock-value" id="ringCount">3</span>
  </div>
  <div class="dock-item">
    <span class="dock-label">境界</span>
    <span class="dock-value" id="evolutionTier" style="font-size:11px;">太初</span>
  </div>
  <div class="dock-item">
    <span class="dock-label">FPS</span>
    <span class="dock-value" id="fpsDisplay">60</span>
  </div>
  <div class="dock-item" id="refreshRateItem" style="display:none;">
    <span class="dock-label">刷新率</span>
    <span class="dock-value" id="refreshRate" style="font-size:11px;">—</span>
  </div>
  <div class="dock-item zoom-controls">
    <button class="zoom-btn" id="zoomOut" title="缩小">
      <svg viewBox="0 0 12 12"><line x1="2.5" y1="6" x2="9.5" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span class="zoom-value" id="zoomValue">100%</span>
    <button class="zoom-btn" id="zoomIn" title="放大">
      <svg viewBox="0 0 12 12"><line x1="2.5" y1="6" x2="9.5" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="6" y1="2.5" x2="6" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<!-- 右上角流速控制 + 亮暗切换 -->
<div id="speedDock" class="speed-dock">
  <button class="zoom-btn" id="speedDown" title="减速">
    <svg viewBox="0 0 12 12"><path d="M8 2L4 6L8 10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="zoom-value" id="speedValue">1.0×</span>
  <button class="zoom-btn" id="speedUp" title="加速">
    <svg viewBox="0 0 12 12"><path d="M4 2L8 6L4 10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="zoom-btn" id="globalPause" title="暂停">
    <svg viewBox="0 0 12 12" id="pauseIcon"><rect x="3" y="2" width="2" height="8" rx="0.5" fill="currentColor"/><rect x="7" y="2" width="2" height="8" rx="0.5" fill="currentColor"/></svg>
  </button>
  <div style="width:1px;height:16px;background:var(--sidebar-border);margin:0 6px;opacity:0.6;"></div>
  <button class="zoom-btn" id="themeToggle" title="切换亮暗">☽</button>
</div>

<!-- 悬浮提示卡片 -->
<div id="hoverCard" class="hover-card hidden">
  <div class="card-icon" id="cardIcon"></div>
  <div class="card-content">
    <div class="card-title" id="cardTitle"></div>
    <div class="card-detail" id="cardDetail"></div>
    <div class="card-weight" id="cardWeight"></div>
  </div>
</div>

<!-- 模拟事件控制面板（Demo 专用） -->
<div id="demoPanel" class="demo-panel visible">
  <div class="demo-panel-title">模拟事件</div>
  <button class="demo-btn" id="simulateClick">模拟点击 ×1</button>
  <button class="demo-btn" id="simulateSwitch">模拟应用切换</button>
  <button class="demo-btn" id="simulateFocus">模拟专注 30min</button>
  <button class="demo-btn" id="simulateLong">模拟长时事件 2h</button>
  <div class="demo-panel-title" style="margin-top:12px;">星环演化</div>
  <button class="demo-btn" id="simulateLeap">光子跃迁</button>
  <button class="demo-btn" id="spawnQueuingPhoton">排队光子生成</button>
  <div class="demo-panel-title" style="margin-top:12px;">演示</div>
  <button class="demo-btn" id="simulateEventEnd">事件结束</button>
  <div class="demo-panel-title" style="margin-top:12px;">清空</div>
  <button class="demo-btn danger" id="clearPhotons">清空光子</button>
  <button class="demo-btn danger" id="clearRings">清空星环</button>
</div>

<!-- 设置面板 -->
<div id="settingsPanel" class="settings-panel hidden">
  <div class="settings-title">隐私控制</div>
  <label class="toggle-row">
    <span>鼠标点击采集</span>
    <input type="checkbox" id="toggleMouse" checked>
    <span class="toggle-switch"></span>
  </label>
  <label class="toggle-row">
    <span>键盘活跃统计</span>
    <input type="checkbox" id="toggleKeyboard" checked>
    <span class="toggle-switch"></span>
  </label>
  <label class="toggle-row">
    <span>应用使用时长</span>
    <input type="checkbox" id="toggleApp" checked>
    <span class="toggle-switch"></span>
  </label>
  <div class="settings-title" style="margin-top:16px">数据保留</div>
  <div class="retention-options">
    <button class="retention-btn active" data-days="30">30 天</button>
    <button class="retention-btn" data-days="90">90 天</button>
    <button class="retention-btn" data-days="0">永久</button>
  </div>
</div>

<!-- 画像面板 -->
<div id="portraitPanel" class="portrait-panel hidden">
  <div class="portrait-title">今日画像</div>
  <div id="portraitContent" class="portrait-content">
    <p class="portrait-placeholder">画像将在你使用一段时间后生成</p>
  </div>
</div>

<script src="js/config.js?v=115"></script>
<script src="js/math-utils.js?v=115"></script>
<script src="js/ring.js?v=115"></script>
<script src="js/photon.js?v=115"></script>
<script src="js/evolution.js?v=115"></script>
<script src="js/engine.js?v=115"></script>
<script src="js/app.js?v=115"></script>
</body>
</html>
