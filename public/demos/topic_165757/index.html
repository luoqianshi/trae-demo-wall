        badgeClass: 'card',
        items: [
          { title: 'Q: 进程与线程的区别？', author: '操作系统 · 卡片', color: '#f0a030', answer: '进程是资源分配的最小单位，线程是CPU调度的最小单位。一个进程可包含多个线程，线程间共享进程资源。' },
          { title: 'Q: TCP 三次握手过程？', author: '计算机网络 · 卡片', color: '#e94560', answer: '客户端发SYN，服务端回SYN+ACK，客户端再发ACK，连接建立。' },
          { title: 'Q: 什么是闭包？', author: 'JavaScript · 卡片', color: '#00d4aa', answer: '函数与其词法环境的引用组合。内部函数可访问外部函数作用域中的变量。' },
          { title: 'Q: HashMap 底层原理？', author: 'Java · 卡片', color: '#23ade5', answer: '数组+链表/红黑树。hash冲突时链表长度>8转红黑树，数组长度>64时才转换。' },
          { title: 'word: ephemeral', author: '英语 · 单词卡', color: '#fb7299', answer: 'adj. 短暂的，瞬息的。同义: transient, fleeting。例: ephemeral beauty。' },
          { title: 'Q: 虚拟内存的作用？', author: '操作系统 · 卡片', color: '#9b59b6', answer: '扩展可用内存空间，实现进程隔离，支持内存共享，提供页面换入换出机制。' },
        ]
      }
    };

    const feedItems = [
      { title: '今日热门：AI 又出新模型了', meta: '233万播放 · 科技区' },
      { title: '这个美食视频看饿了...', meta: '89万播放 · 美食区' },
      { title: '考研上岸经验分享', meta: '156万播放 · 学习区' },
      { title: '一键搞定 PPT 排版', meta: '67万播放 · 职场区' },
      { title: '深夜运动 Vlog', meta: '42万播放 · 生活区' },
      { title: '新番推荐：这个季度必看', meta: '198万播放 · 番剧区' },
    ];
    const gradients = [
      'linear-gradient(135deg, #1a1a3e, #2a1a4e)', 'linear-gradient(135deg, #0d2b3e, #1a1a3e)',
      'linear-gradient(135deg, #2a1a2e, #1a2a3e)', 'linear-gradient(135deg, #1a2a1e, #1a1a3e)',
      'linear-gradient(135deg, #2e2a1a, #1a1a3e)', 'linear-gradient(135deg, #1a1a3e, #2e1a3e)',
    ];

    // === Generate feed ===
    const feedContent = document.getElementById('feedContent');
    feedItems.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'feed-item';
      div.innerHTML = `
        <div style="position:absolute;inset:0;background:${gradients[i % gradients.length]}"></div>
        <div class="feed-overlay">
          <div class="feed-title">${item.title}</div>
          <div class="feed-meta">${item.meta}</div>
        </div>
        <button class="feed-like-btn" onclick="this.classList.toggle('liked')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          收藏
        </button>`;
      feedContent.appendChild(div);
    });

    // === Player state ===
    let currentSource = 'video';
    let currentIndex = 0;
    let isPlaying = true;
    let progress = 0;
    let progressTimer = null;

    const fpTitle = document.getElementById('fpTitle');
    const fpSub = document.getElementById('fpSub');
    const fpProgress = document.getElementById('fpProgress');
    const fpVideoBg = document.getElementById('fpVideoBg');
    const fpVideoArea = document.getElementById('fpVideoArea');
    const fpPhotoArea = document.getElementById('fpPhotoArea');
    const fpCardArea = document.getElementById('fpCardArea');
    const fpPhotoBg = document.getElementById('fpPhotoBg');
    const fpPhotoLabel = document.getElementById('fpPhotoLabel');
    const fpCardQ = document.getElementById('fpCardQ');
    const fpCardA = document.getElementById('fpCardA');
    const fpTypeBadge = document.getElementById('fpTypeBadge');
    const btnPlay = document.getElementById('btnPlay');
    const floatPlayer = document.getElementById('floatPlayer');

    // === Switch content source ===
    function switchSource(source) {
      currentSource = source;
      currentIndex = 0;
      progress = 0;

      // Update tabs
      document.querySelectorAll('.source-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.source === source);
      });

      // Update float player width based on type
      if (source === 'video') floatPlayer.style.width = '200px';
      else if (source === 'photo') floatPlayer.style.width = '140px';
      else if (source === 'card') floatPlayer.style.width = '180px';

      updatePlayer();
      renderQueue();
      startProgress();
    }

    // === Render queue ===
    function renderQueue() {
      const queueList = document.getElementById('queueList');
      const items = sources[currentSource].items;
      queueList.innerHTML = '';
      document.getElementById('queueCount').textContent = items.length + ' 项';

      items.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'queue-item' + (i === currentIndex ? ' now-playing ' + currentSource + '-source' : '');
        div.dataset.index = i;
        div.onclick = () => playItem(i);
        const badge = sources[currentSource].badgeClass;
        const icon = currentSource === 'video' ? '&#9654;' : currentSource === 'photo' ? '&#128247;' : '&#128221;';
        div.innerHTML = `
          <div class="queue-num">${i === currentIndex ? '&#9654;' : (i + 1)}</div>
          <div class="queue-thumb">
            <div class="queue-thumb-inner" style="background:${item.color}22;border:1px solid ${item.color}44">${icon}</div>
          </div>
          <div class="queue-info">
            <div class="queue-item-title">${item.title}</div>
            <div class="queue-item-author">${item.author}</div>
          </div>
          <span class="queue-type-tag ${badge}">${sources[currentSource].label}</span>`;
        queueList.appendChild(div);
      });
    }

    // === Update player display ===
    function updatePlayer() {
      const items = sources[currentSource].items;
      const item = items[currentIndex];
      const badgeClass = sources[currentSource].badgeClass;

      fpTitle.textContent = item.title;
      fpSub.textContent = item.author;
      fpTypeBadge.className = 'fp-type-badge ' + badgeClass;
      fpTypeBadge.textContent = sources[currentSource].label;
      fpProgress.style.width = '0%';

      // Show/hide areas based on source
      fpVideoArea.style.display = currentSource === 'video' ? 'block' : 'none';
      fpPhotoArea.style.display = currentSource === 'photo' ? 'flex' : 'none';
      fpCardArea.style.display = currentSource === 'card' ? 'flex' : 'none';

      if (currentSource === 'video') {
        fpVideoBg.style.background = `linear-gradient(135deg, ${item.color}33, ${item.color}11)`;
        fpVideoBg.querySelectorAll('.bar').forEach(bar => bar.style.background = item.color);
      } else if (currentSource === 'photo') {
        fpPhotoBg.style.background = `linear-gradient(135deg, ${item.color}22, ${item.color}08)`;
        fpPhotoLabel.textContent = item.title.length > 15 ? item.title.substring(0, 15) + '...' : item.title;
      } else if (currentSource === 'card') {
        fpCardQ.textContent = item.title;
        fpCardA.textContent = item.answer || '';
        fpCardArea.style.background = `linear-gradient(135deg, ${item.color}18, var(--bg3))`;
      }

      // Update queue highlight
      document.querySelectorAll('.queue-item').forEach((el, i) => {
        el.classList.toggle('now-playing', i === currentIndex);
        el.classList.toggle('photo-source', currentSource === 'photo' && i === currentIndex);
        el.classList.toggle('card-source', currentSource === 'card' && i === currentIndex);
        el.querySelector('.queue-num').innerHTML = i === currentIndex ? '&#9654;' : (i + 1);
      });
    }

    function playItem(index) {
      currentIndex = index;
      progress = 0;
      updatePlayer();
      startProgress();
    }

    function startProgress() {
      clearInterval(progressTimer);
      if (!isPlaying) return;
      const interval = currentSource === 'card' ? 100 : currentSource === 'photo' ? 120 : 150;
      progressTimer = setInterval(() => {
        progress += 0.8;
        if (progress >= 100) {
          progress = 0;
          const items = sources[currentSource].items;
          currentIndex = (currentIndex + 1) % items.length;
          updatePlayer();
        }
        fpProgress.style.width = progress + '%';
      }, interval);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      btnPlay.innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
      fpVideoBg.classList.toggle('paused', !isPlaying);
      if (isPlaying) startProgress();
      else clearInterval(progressTimer);
    }

    btnPlay.onclick = togglePlay;
    document.getElementById('btnPrev').onclick = () => {
      const items = sources[currentSource].items;
      playItem((currentIndex - 1 + items.length) % items.length);
    };
    document.getElementById('btnNext').onclick = () => {
      const items = sources[currentSource].items;
      playItem((currentIndex + 1) % items.length);
    };

    // Initialize
    renderQueue();
    updatePlayer();
    startProgress();

    // Minimize
    document.getElementById('btnMin').onclick = (e) => {
      e.stopPropagation();
      floatPlayer.classList.toggle('minimized');
    };
    document.querySelector('.fp-minimized-icon').onclick = (e) => {
      e.stopPropagation();
      floatPlayer.classList.remove('minimized');
    };

    // Toggle visibility
    function togglePlayer() {
      const toggle = document.getElementById('toggleFloat');
      toggle.classList.toggle('on');
      floatPlayer.style.display = toggle.classList.contains('on') ? 'block' : 'none';
    }

    // === Drag ===
    (function() {
      const player = document.getElementById('floatPlayer');
      const phone = document.getElementById('phone');
      let isDragging = false, startX, startY, origX, origY;

      function onStart(e) {
        if (e.target.closest('.fp-btn') || e.target.closest('.fp-minimized-icon')) return;
        isDragging = true;
        const touch = e.touches ? e.touches[0] : e;
        const rect = player.getBoundingClientRect();
        const parentRect = phone.getBoundingClientRect();
        startX = touch.clientX; startY = touch.clientY;
        origX = rect.left - parentRect.left;
        origY = rect.top - parentRect.top;
        player.style.transition = 'none';
        e.preventDefault();
      }
      function onMove(e) {
        if (!isDragging) return;
        const touch = e.touches ? e.touches[0] : e;
        const parentRect = phone.getBoundingClientRect();
        let newX = origX + (touch.clientX - startX);
        let newY = origY + (touch.clientY - startY);
        newX = Math.max(0, Math.min(newX, parentRect.width - player.offsetWidth));
        newY = Math.max(0, Math.min(newY, parentRect.height - player.offsetHeight));
        player.style.left = newX + 'px';
        player.style.top = newY + 'px';
        player.style.right = 'auto';
        e.preventDefault();
      }
      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        player.style.transition = '';
      }
      player.addEventListener('mousedown', onStart);
      player.addEventListener('touchstart', onStart, { passive: false });
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    })();
  </script>
</body>
</html>
