<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家庭收纳记录系统</title>
<style>
/* ========== Reset & Base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; color: #333; background: #e8e8e8; }
button { border: none; background: none; cursor: pointer; font-family: inherit; }
input, textarea { font-family: inherit; outline: none; }

/* ========== Phone Frame ========== */
#app {
  width: 375px; height: 100vh; max-height: 812px; margin: 0 auto; background: #f5f5f5;
  display: flex; flex-direction: column; position: relative; overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.15);
}
@media (min-height: 850px) {
  #app { border-radius: 24px; margin-top: 20px; margin-bottom: 20px; height: calc(100vh - 40px); }
  body { display: flex; align-items: center; justify-content: center; }
}

/* ========== Navigation Bar ========== */
.nav-bar {
  height: 44px; background: #fff; display: flex; align-items: center; justify-content: center;
  position: relative; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; z-index: 10;
}
.nav-title { font-size: 17px; font-weight: 600; color: #333; }
.nav-back {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 22px; color: #1890ff; padding: 4px 8px; cursor: pointer;
}
.nav-right {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 15px; color: #1890ff; padding: 4px 8px; cursor: pointer;
}

/* ========== Content Area ========== */
.content-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.content-area::-webkit-scrollbar { width: 0; }

/* ========== TabBar ========== */
.tab-bar {
  height: 50px; background: #fff; display: flex; border-top: 1px solid #f0f0f0; flex-shrink: 0;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 10px; color: #999; cursor: pointer; transition: color 0.2s; gap: 2px;
}
.tab-item.active { color: #1890ff; }
.tab-icon { font-size: 22px; line-height: 1; }

/* ========== Common Styles ========== */
.container { padding: 12px; }
.card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.btn-primary { background: #1890ff; color: #fff; border-radius: 8px; padding: 10px 20px; font-size: 15px; text-align: center; border: none; cursor: pointer; display: block; width: 100%; }
.btn-primary:active { background: #096dd9; }
.btn-secondary { background: #fff; color: #1890ff; border: 1px solid #1890ff; border-radius: 8px; padding: 9px 20px; font-size: 15px; text-align: center; cursor: pointer; }
.btn-danger { background: #ff4d4f; color: #fff; border-radius: 8px; padding: 10px 20px; font-size: 15px; text-align: center; border: none; cursor: pointer; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
.section-title { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: #333; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; }
.empty-icon { font-size: 60px; color: #d9d9d9; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: #999; margin-bottom: 20px; }

/* ========== Modal ========== */
.modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal-content { background: #fff; border-radius: 12px; padding: 20px; width: 85%; max-width: 300px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; text-align: center; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn-primary, .modal-actions .btn-secondary { flex: 1; }
.input-field { border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 12px; width: 100%; }
.input-field:focus { border-color: #1890ff; }

/* ========== Toast ========== */
#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 2000; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
#toast.show { opacity: 1; }

/* ========== Index Page ========== */
.mode-badge { background: #e6f7ff; color: #1890ff; padding: 6px 12px; border-radius: 6px; font-size: 12px; text-align: center; margin-bottom: 12px; }
.family-header { background: linear-gradient(135deg, #1890ff, #096dd9); color: #fff; border-radius: 12px; padding: 20px; margin-bottom: 12px; }
.family-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.family-members { font-size: 12px; opacity: 0.9; }
.stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-card { flex: 1; background: #fff; border-radius: 8px; padding: 16px 8px; text-align: center; box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer; }
.stat-number { font-size: 28px; font-weight: 700; color: #1890ff; }
.stat-label { font-size: 12px; color: #999; margin-top: 4px; }
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.action-item { background: #fff; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.action-icon { font-size: 28px; margin-bottom: 6px; }
.action-text { font-size: 13px; color: #666; }
.guide-card { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.guide-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.guide-step { font-size: 13px; color: #666; line-height: 1.8; }
.floorplan-item { display: flex; align-items: center; justify-content: space-between; }
.floorplan-info { flex: 1; }
.floorplan-name { font-size: 15px; font-weight: 600; }
.floorplan-meta { font-size: 12px; color: #999; margin-top: 2px; }
.floorplan-arrow { font-size: 20px; color: #ccc; }
.reset-link { text-align: center; color: #999; font-size: 13px; padding: 16px; cursor: pointer; }

/* ========== Floorplan List ========== */
.fp-create-btn { position: sticky; top: 0; padding: 12px; background: #f5f5f5; z-index: 5; }
.fp-card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer; position: relative; }
.fp-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fp-card-icon { font-size: 24px; }
.fp-card-name { font-size: 16px; font-weight: 600; flex: 1; }
.fp-card-meta { font-size: 12px; color: #999; display: flex; gap: 12px; }

/* ========== Floorplan Editor ========== */
.editor-container { display: flex; flex-direction: column; height: 100%; }
.editor-toolbar { display: flex; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid #f0f0f0; gap: 6px; flex-shrink: 0; overflow-x: auto; }
.editor-toolbar::-webkit-scrollbar { display: none; }
.tool-btn { display: flex; flex-direction: column; align-items: center; padding: 6px 10px; font-size: 11px; color: #666; border-radius: 8px; background: #f5f5f5; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.tool-btn:active { background: #e6e6e6; }
.tool-btn.active { color: #1890ff; background: #e6f7ff; }
.tool-btn-icon { font-size: 18px; margin-bottom: 2px; }
.mode-bar { display: flex; align-items: center; padding: 8px 12px; background: #fffbe6; border-bottom: 1px solid #ffe58f; font-size: 12px; color: #ad6800; flex-shrink: 0; gap: 6px; }
.mode-bar-close { margin-left: auto; color: #1890ff; cursor: pointer; padding: 2px 8px; }
.canvas-area { flex: 1; overflow: auto; position: relative; background: #e8e8e8; }
.canvas-stage { position: relative; background: #fff; transform-origin: top left; }
.grid-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px); pointer-events: none; }
.room-shape { position: absolute; border: 2px solid rgba(0,0,0,0.2); border-radius: 4px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 4px; overflow: hidden; }
.room-name { font-size: 12px; color: #666; font-weight: 500; }
.drawing-preview { position: absolute; border: 2px dashed #1890ff; background: rgba(24,144,255,0.15); border-radius: 4px; pointer-events: none; }
.drawing-size-badge { position: absolute; top: -20px; left: 0; background: #1890ff; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.furniture-view { position: absolute; cursor: grab; display: flex; align-items: center; justify-content: center; }
.furniture-view:active { cursor: grabbing; }
.furniture-view.selected { z-index: 10; }
.furniture-view.selected .furniture-inner { box-shadow: 0 0 0 3px #1890ff; }
.furniture-inner { width: 100%; height: 100%; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.furniture-type-icon { font-size: 20px; }
.furniture-label { font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.furniture-count { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.5); color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 4px; }
.status-bar { padding: 6px 12px; background: #fff; border-top: 1px solid #f0f0f0; font-size: 12px; color: #999; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.floating-toolbar { position: absolute; bottom: 50px; left: 12px; right: 12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.15); padding: 12px; z-index: 20; }
.float-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.float-name { font-size: 14px; font-weight: 600; }
.float-close { font-size: 18px; color: #999; cursor: pointer; }
.float-actions { display: flex; gap: 8px; }
.float-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 8px; background: #f5f5f5; cursor: pointer; font-size: 11px; color: #666; }
.float-btn:active { background: #e6e6e6; }
.float-btn.danger { color: #ff4d4f; }
.float-icon { font-size: 18px; margin-bottom: 2px; }

/* ========== Furniture Detail ========== */
.furniture-info { display: flex; align-items: center; gap: 12px; }
.furniture-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.furniture-meta { flex: 1; }
.furniture-name { font-size: 17px; font-weight: 600; }
.furniture-type { font-size: 12px; color: #999; margin-top: 2px; }
.furniture-stats { font-size: 13px; color: #666; margin-top: 8px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; }
.add-btn { color: #1890ff; font-size: 14px; cursor: pointer; }
.item-card { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border-radius: 8px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer; }
.item-card-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.item-card-info { flex: 1; min-width: 0; }
.item-card-name { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.item-card-meta { font-size: 12px; color: #999; margin-top: 2px; }
.item-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.item-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #f0f0f0; color: #666; }
.item-important { color: #ff4d4f; }
.item-qty { font-size: 13px; color: #1890ff; font-weight: 600; flex-shrink: 0; }

/* ========== Item Edit ========== */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 14px; color: #333; margin-bottom: 6px; display: block; }
.form-input { border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; }
.form-input:focus { border-color: #1890ff; }
.form-textarea { border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; min-height: 80px; resize: vertical; }
.quantity-control { display: flex; align-items: center; gap: 12px; }
.qty-btn { width: 36px; height: 36px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.qty-btn:active { background: #e6e6e6; }
.qty-value { font-size: 18px; font-weight: 600; min-width: 30px; text-align: center; }
.category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.category-item { padding: 8px; text-align: center; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; cursor: pointer; }
.category-item.selected { border-color: #1890ff; background: #e6f7ff; color: #1890ff; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-item { display: flex; align-items: center; gap: 4px; background: #e6f7ff; color: #1890ff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.tag-remove { cursor: pointer; font-size: 14px; }
.tag-input-row { display: flex; gap: 8px; }
.tag-input-row .form-input { flex: 1; }
.important-toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #e8e8e8; border-radius: 8px; }
.switch { position: relative; width: 44px; height: 24px; background: #ccc; border-radius: 12px; cursor: pointer; transition: background 0.3s; }
.switch.on { background: #1890ff; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform 0.3s; }
.switch.on::after { transform: translateX(20px); }

/* ========== Search Page ========== */
.search-box { display: flex; gap: 8px; padding: 12px; background: #fff; border-bottom: 1px solid #f0f0f0; }
.search-input { flex: 1; border: 1px solid #e8e8e8; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.search-btn { background: #1890ff; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; cursor: pointer; }
.category-filter { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; background: #fff; border-bottom: 1px solid #f0f0f0; }
.category-filter::-webkit-scrollbar { display: none; }
.cat-filter-item { padding: 4px 12px; border-radius: 16px; background: #f5f5f5; font-size: 12px; color: #666; white-space: nowrap; cursor: pointer; }
.cat-filter-item.selected { background: #1890ff; color: #fff; }
.search-history { padding: 12px; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.history-title { font-size: 14px; color: #666; }
.history-clear { font-size: 12px; color: #999; cursor: pointer; }
.history-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.history-tag { padding: 4px 12px; background: #f5f5f5; border-radius: 16px; font-size: 12px; color: #666; cursor: pointer; }
.search-result { padding: 0 12px; }
.result-item { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer; }
.result-name { font-size: 15px; font-weight: 500; }
.result-location { font-size: 12px; color: #999; margin-top: 4px; }
.result-category { font-size: 11px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }

/* ========== Statistics Page ========== */
.stats-overview { display: flex; gap: 8px; padding: 12px; }
.overview-card { flex: 1; background: #fff; border-radius: 8px; padding: 16px 8px; text-align: center; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.overview-number { font-size: 24px; font-weight: 700; color: #1890ff; }
.overview-label { font-size: 11px; color: #999; margin-top: 4px; }
.chart-container { background: #fff; border-radius: 8px; padding: 16px; margin: 0 12px 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.pie-chart-wrap { display: flex; align-items: center; gap: 16px; }
.pie-chart { width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0; position: relative; }
.pie-legend { flex: 1; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; }
.legend-color { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.legend-name { flex: 1; color: #666; }
.legend-value { color: #333; font-weight: 500; }
.bar-chart-item { margin-bottom: 10px; }
.bar-label { font-size: 12px; color: #666; margin-bottom: 4px; display: flex; justify-content: space-between; }
.bar-track { height: 20px; background: #f5f5f5; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 11px; color: #fff; }
.recent-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
.recent-item:last-child { border-bottom: none; }
.recent-name { flex: 1; font-size: 14px; }
.recent-cat { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.recent-qty { font-size: 12px; color: #999; }

/* ========== Family Manage ========== */
.invite-card { background: linear-gradient(135deg, #1890ff, #096dd9); color: #fff; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 12px; }
.invite-title { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
.invite-code { font-size: 32px; font-weight: 700; letter-spacing: 4px; margin-bottom: 12px; }
.invite-actions { display: flex; gap: 8px; }
.invite-btn { flex: 1; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
.member-list { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.member-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #f5f5f5; }
.member-item:last-child { border-bottom: none; }
.member-avatar { width: 36px; height: 36px; border-radius: 50%; background: #1890ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.member-info { flex: 1; }
.member-name { font-size: 14px; font-weight: 500; }
.member-role { font-size: 12px; color: #999; }
.role-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; }
.role-owner { background: #fff7e6; color: #d48806; }
.role-member { background: #e6f7ff; color: #1890ff; }
.member-remove { color: #ff4d4f; font-size: 12px; cursor: pointer; }

/* ========== Settings Page ========== */
.settings-group { background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.settings-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
.settings-item:last-child { border-bottom: none; }
.settings-label { font-size: 15px; color: #333; }
.settings-value { font-size: 13px; color: #999; }
.settings-arrow { color: #ccc; }

/* ========== Room Type Grid ========== */
.room-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.room-type-item { display: flex; flex-direction: column; align-items: center; padding: 10px; border: 1px solid #e8e8e8; border-radius: 8px; cursor: pointer; }
.room-type-item:active { background: #f5f5f5; }
.room-type-icon { font-size: 24px; margin-bottom: 4px; }
.room-type-name { font-size: 12px; color: #666; }
.custom-name-section { display: flex; gap: 8px; margin-bottom: 12px; }
.custom-name-section .form-input { flex: 1; }

/* ========== Furniture Selector ========== */
.furniture-selector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.furniture-selector-item { display: flex; flex-direction: column; align-items: center; padding: 12px 8px; border: 1px solid #e8e8e8; border-radius: 8px; cursor: pointer; }
.furniture-selector-item:active { background: #f5f5f5; }
.fs-icon { font-size: 28px; margin-bottom: 4px; }
.fs-name { font-size: 12px; color: #666; }
.fs-size { font-size: 10px; color: #ccc; margin-top: 2px; }

/* ========== Edit Furniture Modal ========== */
.edit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.edit-label { font-size: 14px; color: #333; width: 50px; flex-shrink: 0; }
.edit-input { flex: 1; border: 1px solid #e8e8e8; border-radius: 8px; padding: 8px; font-size: 14px; }
.edit-size-control { display: flex; align-items: center; gap: 4px; flex: 1; }
.edit-size-btn { width: 32px; height: 32px; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
.edit-size-input { width: 50px; border: 1px solid #e8e8e8; border-radius: 6px; padding: 6px; font-size: 14px; text-align: center; }
.edit-unit { font-size: 12px; color: #999; }
.edit-picker { display: flex; align-items: center; gap: 6px; border: 1px solid #e8e8e8; border-radius: 8px; padding: 8px; flex: 1; }

// ========== Storage Layer ==========
const Storage = {
  getCurrentFamilyId() { return localStorage.getItem('currentFamilyId') || ''; },
  setCurrentFamilyId(id) { localStorage.setItem('currentFamilyId', id); },
  getSearchHistory() { try { return JSON.parse(localStorage.getItem('searchHistory')) || []; } catch(e) { return []; } },
  addSearchHistory(kw) { if(!kw||!kw.trim())return; let h=this.getSearchHistory().filter(i=>i!==kw.trim()); h.unshift(kw.trim()); if(h.length>10)h=h.slice(0,10); localStorage.setItem('searchHistory',JSON.stringify(h)); },
  clearSearchHistory() { localStorage.removeItem('searchHistory'); },
};

// ========== App State ==========
const App = {
  currentFamilyId: null,
  currentFamily: null,
  init() {
    let fid = Storage.getCurrentFamilyId();
    const existing = DB.readAll();
    if (!existing.family || existing.family.length === 0) {
      fid = DB.seedRichDemo();
      Storage.setCurrentFamilyId(fid);
    }
    if (fid) {
      this.currentFamilyId = fid;
      this.currentFamily = DB.getFamily(fid);
    }
  },
  setCurrentFamily(id) {
    this.currentFamilyId = id;
    this.currentFamily = DB.getFamily(id);
    Storage.setCurrentFamilyId(id);
  },
  resetAll() {
    DB.clearAll();
    const id = DB.seedRichDemo();
    this.setCurrentFamily(id);
  },
};

// ========== UI Helpers ==========
function showToast(msg, duration=1500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}
function showModal({title, content, showCancel=true, confirmText='确定', cancelText='取消', onConfirm, onCancel}) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal-content" style="max-width:280px">
    ${title?`<div class="modal-title">${title}</div>`:''}
    <div style="font-size:14px;color:#666;line-height:1.6;margin-bottom:12px;">${content||''}</div>
    <div class="modal-actions">
      ${showCancel?`<button class="btn-secondary" id="modalCancel">${cancelText}</button>`:''}
      <button class="btn-primary" id="modalConfirm">${confirmText}</button>
    </div></div>`;
  document.body.appendChild(mask);
  mask.querySelector('#modalConfirm').onclick = ()=>{ mask.remove(); if(onConfirm) onConfirm(); };
  if (showCancel) mask.querySelector('#modalCancel').onclick = ()=>{ mask.remove(); if(onCancel) onCancel(); };
  mask.onclick = (e)=>{ if(e.target===mask){mask.remove(); if(onCancel) onCancel();} };
}
function showActionSheet({title, items, onCancel}) {
  const mask = document.createElement('div');
  mask.className = 'action-sheet-mask';
  let itemsHtml = items.map((it,i)=>`<div class="action-sheet-item ${it.danger?'danger':''}" data-idx="${i}">${it.text}</div>`).join('');
  mask.innerHTML = `<div class="action-sheet">
    ${title?`<div class="action-sheet-title">${title}</div>`:''}
    ${itemsHtml}
    <div class="action-sheet-cancel">取消</div></div>`;
  document.body.appendChild(mask);
  mask.querySelectorAll('.action-sheet-item').forEach(el=>{
    el.onclick = ()=>{ const idx=parseInt(el.dataset.idx); mask.remove(); if(items[idx].onClick) items[idx].onClick(); };
  });
  mask.querySelector('.action-sheet-cancel').onclick = ()=>{ mask.remove(); if(onCancel) onCancel(); };
  mask.onclick = (e)=>{ if(e.target===mask){mask.remove(); if(onCancel) onCancel();} };
}
function getCategoryName(type) { const c = ITEM_CATEGORIES.find(c=>c.type===type); return c?c.name:'未分类'; }
function getCategoryColor(type) { return CATEGORY_COLORS[type] || '#AEB6BF'; }
function getFurnitureDef(type) { return FURNITURE_TYPES.find(f=>f.type===type) || FURNITURE_TYPES[9]; }
function formatDate(iso) { if(!iso)return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }

// ========== Router ==========
const Router = {
  current: null,
  params: {},
  navigate(route, params={}) {
    this.current = route;
    this.params = params;
    this.render();
  },
  switchTab(route) {
    this.current = route;
    this.params = {};
    this.render();
    document.querySelectorAll('.tab-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.route===route);
    });
  },
  render() {
    const route = this.current || 'index';
    const params = this.params;
    const navBar = document.getElementById('navBar');
    const contentArea = document.getElementById('contentArea');
    const tabBar = document.getElementById('tabBar');

    // TabBar visibility
    const tabRoutes = ['index','floorplanList','itemSearch','statistics'];
    tabBar.style.display = tabRoutes.includes(route) ? 'flex' : 'none';

    // Nav bar
    if (tabRoutes.includes(route)) {
      navBar.innerHTML = `<div class="nav-title">${this.getTabTitle(route)}</div>`;
    } else {
      let title = this.getPageTitle(route, params);
      navBar.innerHTML = `<div class="nav-back" onclick="Router.back()">‹</div><div class="nav-title">${title}</div>`;
      if (route === 'furnitureDetail') {
        navBar.innerHTML += `<div class="nav-right" onclick="Router.navigate('itemEdit',{furnitureId:Router.params.id})">+物品</div>`;
      }
    }

    // Render page
    contentArea.scrollTop = 0;
    switch(route) {
      case 'index': PageIndex.render(contentArea); break;
      case 'floorplanList': PageFloorplanList.render(contentArea); break;
      case 'floorplan': PageFloorplan.render(contentArea, params); break;
      case 'furnitureDetail': PageFurnitureDetail.render(contentArea, params); break;
      case 'itemEdit': PageItemEdit.render(contentArea, params); break;
      case 'itemSearch': PageItemSearch.render(contentArea); break;
      case 'statistics': PageStatistics.render(contentArea); break;
      case 'familyManage': PageFamilyManage.render(contentArea); break;
      case 'settings': PageSettings.render(contentArea); break;
    }
  },
  back() { this.switchTab('index'); },
  getTabTitle(route) {
    const titles = { index:'放哪了？家庭收纳', floorplanList:'平面图', itemSearch:'找物品', statistics:'统计' };
    return titles[route] || '放哪了？家庭收纳';
  },
  getPageTitle(route, params) {
    const titles = { floorplan:'平面图编辑', furnitureDetail:'家具详情', itemEdit:params.id?'编辑物品':'添加物品', familyManage:'家庭管理', settings:'设置' };
    return titles[route] || '';
  },
};

// ========== Page: Floorplan Editor ==========
const PageFloorplan = {
  state: { mode:'edit', scale:1, showGrid:true, selectedFurnitureId:null, isDrawing:false, drawingRect:null, rooms:[], furnitureList:[] },
  render(container, params) {
    const fp = DB.getFloorplan(params.id);
    if (!fp) { container.innerHTML = '<div class="container">平面图不存在</div>'; return; }
    this.state.floorplanId = params.id;
    this.state.familyId = App.currentFamilyId;
    this.state.rooms = DB.getRooms(params.id);
    this.state.furnitureList = DB.getFurniture(params.id).map(f=>({...f, typeIcon:TYPE_ICONS[f.type]||'📦', rotation:f.rotation||0}));
    this.state.mode = 'edit';
    this.state.scale = 1;
    this.state.selectedFurnitureId = null;
    this.state.isDrawing = false;
    this.state.drawingRect = null;

    container.innerHTML = `<div class="editor-container" style="height:100%">
      <div class="editor-toolbar">
        <div class="tool-btn ${this.state.mode==='draw'?'active':''}" onclick="PageFloorplan.toggleDrawMode()"><span class="tool-btn-icon">✏️</span><span>画房间</span></div>
        <div class="tool-btn" onclick="PageFloorplan.addFurniture()"><span class="tool-btn-icon">🪑</span><span>加家具</span></div>
        <div class="tool-btn ${this.state.showGrid?'active':''}" onclick="PageFloorplan.toggleGrid()"><span class="tool-btn-icon">📏</span><span>网格</span></div>
        <div class="tool-btn" onclick="PageFloorplan.zoomOut()"><span class="tool-btn-icon">－</span><span>缩小</span></div>
        <div class="tool-btn" onclick="PageFloorplan.zoomIn()"><span class="tool-btn-icon">＋</span><span>放大</span></div>
        <div class="tool-btn" onclick="PageFloorplan.resetView()"><span class="tool-btn-icon">⌂</span><span>复位</span></div>
      </div>
      <div class="mode-bar" id="modeBar" style="display:none">
        <span>✏️</span><span>在画布上按住拖拽，绘制矩形房间</span><span class="mode-bar-close" onclick="PageFloorplan.toggleDrawMode()">退出</span>
      </div>
      <div class="canvas-area" id="canvasArea">
        <div class="canvas-stage" id="canvasStage" style="width:${CANVAS_WIDTH}px;height:${CANVAS_HEIGHT}px;">
          ${this.state.showGrid?'<div class="grid-bg" id="gridBg"></div>':''}
        </div>
      </div>
      <div class="status-bar" id="statusBar">
        <span id="statusText">${this.state.rooms.length} 个房间 · ${this.state.furnitureList.length} 个家具</span>
        <span id="statusZoom"></span>
      </div>
      <div id="floatingToolbar"></div>
    </div>`;
    this.renderCanvas();
    this.bindCanvasEvents();
  },
  renderCanvas() {
    const stage = document.getElementById('canvasStage');
    const scale = this.state.scale;
    stage.style.transform = `scale(${scale})`;
    let html = this.state.showGrid ? '<div class="grid-bg"></div>' : '';
    // Rooms
    this.state.rooms.forEach(r=>{
      html += `<div class="room-shape" style="left:${r.x}px;top:${r.y}px;width:${r.width}px;height:${r.height}px;background-color:${r.color};">
        <span class="room-name">${r.name}</span></div>`;
    });
    // Drawing preview
    if (this.state.isDrawing && this.state.drawingRect) {
      const r = this.state.drawingRect;
      html += `<div class="drawing-preview" style="left:${r.x}px;top:${r.y}px;width:${r.width}px;height:${r.height}px;">
        <div class="drawing-size-badge">${r.width} × ${r.height}</div></div>`;
    }
    // Furniture
    this.state.furnitureList.forEach(f=>{
      const selected = this.state.selectedFurnitureId === f._id ? 'selected' : '';
      html += `<div class="furniture-view ${selected}" data-id="${f._id}" style="left:${f.x}px;top:${f.y}px;width:${f.width}px;height:${f.height}px;">
        <div class="furniture-inner" style="background-color:${f.color};transform:rotate(${f.rotation||0}deg);">
          <span class="furniture-type-icon">${f.typeIcon}</span>
          <span class="furniture-label">${f.name}</span>
          ${f.itemCount>0?`<span class="furniture-count">${f.itemCount}件</span>`:''}
        </div></div>`;
    });
    stage.innerHTML = html;
    this.bindFurnitureEvents();
    this.updateStatusBar();
    this.updateFloatingToolbar();
  },
  bindCanvasEvents() {
    const stage = document.getElementById('canvasStage');
    let drawing = false;
    let startX = 0, startY = 0;
    stage.onmousedown = (e)=>{
      if (this.state.mode !== 'draw') return;
      if (e.target !== stage && e.target.className !== 'grid-bg') return;
      const rect = stage.getBoundingClientRect();
      const x = (e.clientX - rect.left) / this.state.scale;
      const y = (e.clientY - rect.top) / this.state.scale;
      drawing = true;
      startX = x; startY = y;
      this.state.isDrawing = true;
      this.state.drawingRect = { x, y, width:0, height:0 };
      this.renderCanvas();
      e.preventDefault();
    };
    stage.onmousemove = (e)=>{
      if (!drawing) return;
      const rect = stage.getBoundingClientRect();
      const x = Math.max(0, Math.min(CANVAS_WIDTH, (e.clientX - rect.left) / this.state.scale));
      const y = Math.max(0, Math.min(CANVAS_HEIGHT, (e.clientY - rect.top) / this.state.scale));
      const gs = GRID_SIZE;
      this.state.drawingRect = {
        x: Math.round(Math.min(startX, x) / gs) * gs,
        y: Math.round(Math.min(startY, y) / gs) * gs,
        width: Math.max(Math.round(Math.abs(x - startX) / gs) * gs, gs),
        height: Math.max(Math.round(Math.abs(y - startY) / gs) * gs, gs),
      };
      this.renderCanvas();
    };
    stage.onmouseup = ()=>{
      if (!drawing) return;
      drawing = false;
      this.state.isDrawing = false;
      const r = this.state.drawingRect;
      if (!r || r.width < 40 || r.height < 40) {
        showToast('请画大一些');
        this.state.drawingRect = null;
        this.renderCanvas();
        return;
      }
      this.showRoomNameModal();
    };
    stage.onmouseleave = ()=>{ if(drawing){drawing=false; this.state.isDrawing=false; this.state.drawingRect=null; this.renderCanvas();} };
  },
  bindFurnitureEvents() {
    const stage = document.getElementById('canvasStage');
    document.querySelectorAll('.furniture-view').forEach(el=>{
      let dragging = false;
      let offsetX = 0, offsetY = 0;
      let moved = false;
      let startMouseX = 0, startMouseY = 0;
      el.onmousedown = (e)=>{
        e.stopPropagation();
        const id = el.dataset.id;
        const f = this.state.furnitureList.find(fu=>fu._id===id);
        if (!f) return;
        const rect = stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / this.state.scale;
        const y = (e.clientY - rect.top) / this.state.scale;
        offsetX = x - f.x;
        offsetY = y - f.y;
        startMouseX = x; startMouseY = y;
        moved = false;
        dragging = true;
        this.state.selectedFurnitureId = id;
        // 只更新选中样式，不重建DOM，否则会销毁当前元素的拖拽事件
        document.querySelectorAll('.furniture-view.selected').forEach(s=>s.classList.remove('selected'));
        el.classList.add('selected');
        this.updateStatusBar();
        this.updateFloatingToolbar();
        e.preventDefault();
      };
      el.onmousemove = (e)=>{
        if (!dragging) return;
        e.stopPropagation();
        const id = el.dataset.id;
        const rect = stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / this.state.scale;
        const y = (e.clientY - rect.top) / this.state.scale;
        if (!moved) {
          if (Math.abs(x-startMouseX)>5 || Math.abs(y-startMouseY)>5) moved = true;
          else return;
        }
        const newX = Math.max(0, Math.min(CANVAS_WIDTH-20, x - offsetX));
        const newY = Math.max(0, Math.min(CANVAS_HEIGHT-20, y - offsetY));
        const f = this.state.furnitureList.find(fu=>fu._id===id);
        if (f) { f.x = newX; f.y = newY; }
        // Update position directly without full re-render for smoothness
        el.style.left = newX + 'px';
        el.style.top = newY + 'px';
      };
      el.onmouseup = (e)=>{
        if (!dragging) return;
        e.stopPropagation();
        dragging = false;
        const id = el.dataset.id;
        if (moved) {
          const f = this.state.furnitureList.find(fu=>fu._id===id);
          if (f) DB.updateFurniture(id, {x:f.x, y:f.y, updatedAt:DB.now()});
        } else {
          // Click - go to furniture detail
          Router.navigate('furnitureDetail', {id});
        }
      };
      el.oncontextmenu = (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const id = el.dataset.id;
        this.showFurnitureActions(id);
      };
    });
  },
  updateStatusBar() {
    const el = document.getElementById('statusText');
    if (!el) return;
    if (this.state.mode === 'draw') el.textContent = '画房间模式';
    else if (this.state.selectedFurnitureId) {
      const f = this.state.furnitureList.find(fu=>fu._id===this.state.selectedFurnitureId);
      el.textContent = f ? `已选中：${f.name}` : '';
    } else {
      el.textContent = `${this.state.rooms.length} 个房间 · ${this.state.furnitureList.length} 个家具`;
    }
    const zoom = document.getElementById('statusZoom');
    if (zoom) zoom.textContent = this.state.scale !== 1 ? this.state.scale.toFixed(1)+'x' : '';
  },
  updateFloatingToolbar() {
    const container = document.getElementById('floatingToolbar');
    if (!container) return;
    if (!this.state.selectedFurnitureId) { container.innerHTML = ''; return; }
    const f = this.state.furnitureList.find(fu=>fu._id===this.state.selectedFurnitureId);
    if (!f) { container.innerHTML = ''; return; }
    container.innerHTML = `<div class="floating-toolbar">
      <div class="float-info"><span class="float-name">${f.name}</span><span class="float-close" onclick="PageFloorplan.clearSelection()">✕</span></div>
      <div class="float-actions">
        <div class="float-btn" onclick="Router.navigate('furnitureDetail',{id:'${f._id}'})"><span class="float-icon">📦</span><span>添加物品</span></div>
        <div class="float-btn" onclick="PageFloorplan.openEditFurnitureModal('${f._id}')"><span class="float-icon">📐</span><span>调整</span></div>
        <div class="float-btn" onclick="PageFloorplan.rotateFurniture('${f._id}',-90)"><span class="float-icon">↺</span><span>左转</span></div>
        <div class="float-btn" onclick="PageFloorplan.rotateFurniture('${f._id}',90)"><span class="float-icon">↻</span><span>右转</span></div>
        <div class="float-btn danger" onclick="PageFloorplan.deleteFurniture('${f._id}')"><span class="float-icon">🗑</span><span>删除</span></div>
      </div></div>`;
  },
  toggleDrawMode() {
    this.state.mode = this.state.mode === 'draw' ? 'edit' : 'draw';
    this.state.isDrawing = false;
    this.state.drawingRect = null;
    document.querySelector('.tool-btn').classList.toggle('active', this.state.mode==='draw');
    document.getElementById('modeBar').style.display = this.state.mode==='draw' ? 'flex' : 'none';
    this.renderCanvas();
  },
  toggleGrid() { this.state.showGrid = !this.state.showGrid; this.renderCanvas(); },
  zoomIn() { this.state.scale = Math.min(this.state.scale*1.2, 3); this.renderCanvas(); },
  zoomOut() { this.state.scale = Math.max(this.state.scale/1.2, 0.3); this.renderCanvas(); },
  resetView() { this.state.scale = 1; this.renderCanvas(); },
  clearSelection() { this.state.selectedFurnitureId = null; this.renderCanvas(); },
  addFurniture() {
    const html = `<div class="furniture-selector-grid">${FURNITURE_TYPES.map(f=>`
      <div class="furniture-selector-item" onclick="PageFloorplan.onFurnitureSelected('${f.type}')">
        <span class="fs-icon">${f.icon}</span><span class="fs-name">${f.name}</span><span class="fs-size">${f.defaultWidth}×${f.defaultHeight}</span>
      </div>`).join('')}</div>`;
    showModal({ title:'选择家具类型', content:html, showCancel:true, confirmText:'关闭', cancelText:'取消',
      onConfirm:()=>{}, onCancel:()=>{}
    });
  },
  onFurnitureSelected(type) {
    const def = FURNITURE_TYPES.find(f=>f.type===type);
    if (!def) return;
    const centerX = (CANVAS_WIDTH - def.defaultWidth) / 2;
    const centerY = (CANVAS_HEIGHT - def.defaultHeight) / 2;
    DB.addFurniture({ familyId:this.state.familyId, floorplanId:this.state.floorplanId, roomId:'', name:def.name, type:def.type,
      x:Math.max(0,centerX), y:Math.max(0,centerY), width:def.defaultWidth, height:def.defaultHeight, rotation:0,
      color:def.color, iconIndex:FURNITURE_TYPES.indexOf(def), itemCount:0 });
    showToast('家具已添加');
    document.querySelector('.modal-mask')?.remove();
    this.state.furnitureList = DB.getFurniture(this.state.floorplanId).map(f=>({...f, typeIcon:TYPE_ICONS[f.type]||'📦', rotation:f.rotation||0}));
    this.renderCanvas();
  },
  showRoomNameModal() {
    const roomTypes = [{type:'custom',name:'自定义',icon:'✏️',color:'#fff3e0'}, ...ROOM_TYPES.map(r=>({...r,icon:'🏠'}))];
    const html = `<div class="room-type-grid">${roomTypes.map(r=>`
      <div class="room-type-item" onclick="PageFloorplan.confirmRoom('${r.name}','${r.type}','${r.color}')">
        <span class="room-type-icon">${r.icon}</span><span class="room-type-name">${r.name}</span>
      </div>`).join('')}</div>
      <div class="custom-name-section"><input class="form-input" id="customRoomName" placeholder="或输入自定义名称" maxlength="10">
      <button class="btn-primary" onclick="PageFloorplan.confirmCustomRoomName()" style="width:auto;padding:10px 16px;">确定</button></div>`;
    showModal({ title:'房间类型', content:html, showCancel:true, confirmText:'关闭', cancelText:'取消',
      onConfirm:()=>{ this.state.drawingRect = null; this.renderCanvas(); },
      onCancel:()=>{ this.state.drawingRect = null; this.renderCanvas(); }
    });
  },
  confirmRoom(name, type, color) {
    const r = this.state.drawingRect;
    if (!r) return;
    DB.addRoom({ floorplanId:this.state.floorplanId, familyId:this.state.familyId, name, type, shape:'rectangle',
      x:r.x, y:r.y, width:r.width, height:r.height, color, sortOrder:this.state.rooms.length });
    showToast('房间已添加');
    document.querySelector('.modal-mask')?.remove();
    this.state.rooms = DB.getRooms(this.state.floorplanId);
    this.state.drawingRect = null;
    this.state.mode = 'edit';
    document.getElementById('modeBar').style.display = 'none';
    this.renderCanvas();
  },
  confirmCustomRoomName() {
    const name = (document.getElementById('customRoomName').value || '').trim();
    if (!name) { showToast('请输入房间名'); return; }
    this.confirmRoom(name, 'custom', '#fff3e0');
  },
  rotateFurniture(id, delta) {
    const f = this.state.furnitureList.find(fu=>fu._id===id);
    if (!f) return;
    const newRotation = (((f.rotation||0) + delta) % 360 + 360) % 360;
    let newWidth = f.width, newHeight = f.height;
    if (newRotation===90 || newRotation===270) { newWidth = f.height; newHeight = f.width; }
    f.rotation = newRotation; f.width = newWidth; f.height = newHeight;
    DB.updateFurniture(id, {rotation:newRotation, width:newWidth, height:newHeight});
    this.renderCanvas();
  },
  deleteFurniture(id) {
    const f = this.state.furnitureList.find(fu=>fu._id===id);
    if (!f) return;
    showModal({ title:'确认删除', content:`删除"${f.name}"？家具内的物品记录也会被删除。`, confirmText:'删除',
      onConfirm:()=>{
        DB.deleteFurniture(id);
        this.state.selectedFurnitureId = null;
        this.state.furnitureList = DB.getFurniture(this.state.floorplanId).map(fu=>({...fu, typeIcon:TYPE_ICONS[fu.type]||'📦', rotation:fu.rotation||0}));
        showToast('已删除');
        this.renderCanvas();
      }
    });
  },
  showFurnitureActions(id) {
    const f = this.state.furnitureList.find(fu=>fu._id===id);
    if (!f) return;
    showActionSheet({ title:f.name, items:[
      { text:'查看详情', onClick:()=>Router.navigate('furnitureDetail',{id}) },
      { text:'顺时针旋转 90°', onClick:()=>this.rotateFurniture(id,90) },
      { text:'逆时针旋转 90°', onClick:()=>this.rotateFurniture(id,-90) },
      { text:'调整尺寸', onClick:()=>this.openEditFurnitureModal(id) },
      { text:'删除家具', danger:true, onClick:()=>this.deleteFurniture(id) },
    ]});
  },
  openEditFurnitureModal(id) {
    const f = this.state.furnitureList.find(fu=>fu._id===id);
    if (!f) return;
    const typeIndex = FURNITURE_TYPES.findIndex(t=>t.type===f.type);
    const draft = { id:f._id, name:f.name, type:f.type, typeIndex: typeIndex>=0?typeIndex:0, width:f.width, height:f.height };
    const html = `<div class="edit-row"><span class="edit-label">名称</span><input class="edit-input" id="editFurnName" value="${draft.name}" maxlength="20"></div>
      <div class="edit-row"><span class="edit-label">类型</span>
        <select class="edit-input" id="editFurnType" onchange="PageFloorplan.onEditTypeChange()">
          ${FURNITURE_TYPES.map((t,i)=>`<option value="${i}" ${i===draft.typeIndex?'selected':''}>${t.icon} ${t.name}</option>`).join('')}
        </select></div>
      <div class="edit-row"><span class="edit-label">宽度</span>
        <div class="edit-size-control">
          <div class="edit-size-btn" onclick="PageFloorplan.editWidthDelta(-20)">−</div>
          <input class="edit-size-input" id="editFurnWidth" type="number" value="${draft.width}">
          <div class="edit-size-btn" onclick="PageFloorplan.editWidthDelta(20)">＋</div><span class="edit-unit">px</span>
        </div></div>
      <div class="edit-row"><span class="edit-label">高度</span>
        <div class="edit-size-control">
          <div class="edit-size-btn" onclick="PageFloorplan.editHeightDelta(-20)">−</div>
          <input class="edit-size-input" id="editFurnHeight" type="number" value="${draft.height}">
          <div class="edit-size-btn" onclick="PageFloorplan.editHeightDelta(20)">＋</div><span class="edit-unit">px</span>
        </div></div>
      <div class="edit-presets"><span class="edit-presets-label">按类型默认尺寸：</span>
        <span class="edit-preset-btn" onclick="PageFloorplan.applyDefaultSize('width')">宽度</span>
        <span class="edit-preset-btn" onclick="PageFloorplan.applyDefaultSize('height')">高度</span>
        <span class="edit-preset-btn" onclick="PageFloorplan.applyDefaultSize('all')">全部</span></div>`;
    this._editDraft = draft;
    showModal({ title:'调整家具', content:html, confirmText:'保存', cancelText:'取消',
      onConfirm:()=>this.saveEditFurniture(),
      onCancel:()=>{ this._editDraft = null; }
    });
  },
  onEditTypeChange() {
    const sel = document.getElementById('editFurnType');
    this._editDraft.typeIndex = parseInt(sel.value);
    this._editDraft.type = FURNITURE_TYPES[this._editDraft.typeIndex].type;
  },
  editWidthDelta(delta) {
    const input = document.getElementById('editFurnWidth');
    const v = Math.max(20, Math.min(1000, (parseInt(input.value)||0) + delta));
    input.value = v; this._editDraft.width = v;
  },
  editHeightDelta(delta) {
    const input = document.getElementById('editFurnHeight');
    const v = Math.max(20, Math.min(1000, (parseInt(input.value)||0) + delta));
    input.value = v; this._editDraft.height = v;
  },
  applyDefaultSize(axis) {
    const def = FURNITURE_TYPES[this._editDraft.typeIndex];
    if (!def) return;
    if (axis==='width' || axis==='all') { document.getElementById('editFurnWidth').value = def.defaultWidth; this._editDraft.width = def.defaultWidth; }
    if (axis==='height' || axis==='all') { document.getElementById('editFurnHeight').value = def.defaultHeight; this._editDraft.height = def.defaultHeight; }
  },
  saveEditFurniture() {
    const d = this._editDraft;
    if (!d) return;
    d.name = (document.getElementById('editFurnName').value || '').trim() || FURNITURE_TYPES[d.typeIndex].name;
    d.width = Math.max(20, Math.min(1000, parseInt(document.getElementById('editFurnWidth').value)||80));
    d.height = Math.max(20, Math.min(1000, parseInt(document.getElementById('editFurnHeight').value)||80));
    const def = FURNITURE_TYPES[d.typeIndex];
    const patch = { name:d.name, type:def.type, width:d.width, height:d.height, color:def.color };
    DB.updateFurniture(d.id, patch);
    this.state.furnitureList = DB.getFurniture(this.state.floorplanId).map(f=>({...f, typeIcon:TYPE_ICONS[f.type]||'📦', rotation:f.rotation||0}));
    showToast('已保存');
    this._editDraft = null;
    this.renderCanvas();
  },
};

// ========== Page: Furniture Detail ==========
const PageFurnitureDetail = {
  render(container, params) {
    const f = DB.getFurnitureById(params.id);
    if (!f) { container.innerHTML = '<div class="container">家具不存在</div>'; return; }
    const items = DB.getItems(params.id);
    DB.updateFurniture(params.id, {itemCount: items.length});
    const def = getFurnitureDef(f.type);
    let html = `<div class="container">
      <div class="card furniture-info">
        <div class="furniture-icon" style="background-color:${f.color}">${TYPE_ICONS[f.type]||'📦'}</div>
        <div class="furniture-meta"><div class="furniture-name">${f.name}</div><div class="furniture-type">${def.name}</div></div>
      </div>
      <div class="card"><div class="furniture-stats">收纳物品：${items.length} 件</div></div>
      <div class="section-header"><span class="section-title">收纳物品</span><span class="add-btn" onclick="Router.navigate('itemEdit',{furnitureId:'${params.id}'})">+ 添加物品</span></div>`;
    if (items.length > 0) {
      items.forEach(item=>{
        const catColor = getCategoryColor(item.category);
        html += `<div class="item-card" onclick="Router.navigate('itemEdit',{id:'${item._id}',furnitureId:'${params.id}'})" oncontextmenu="PageFurnitureDetail.itemActions('${item._id}','${item.name}');return false;">
          <div class="item-card-icon" style="background-color:${catColor}20;color:${catColor}">${this.categoryIcon(item.category)}</div>
          <div class="item-card-info">
            <div class="item-card-name">${item.isImportant?'<span class="item-important">★</span> ':''}${item.name}</div>
            <div class="item-card-meta">${getCategoryName(item.category)}${item.location?' · '+item.location:''}</div>
            ${item.tags && item.tags.length>0 ? `<div class="item-card-tags">${item.tags.map(t=>`<span class="item-tag">${t}</span>`).join('')}</div>`:''}
          </div>
          <div class="item-qty">×${item.quantity||1}</div>
        </div>`;
      });
    } else {
      html += `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">还没有收纳物品</div></div>`;
    }
    html += '</div>';
    container.innerHTML = html;
  },
  categoryIcon(cat) {
    const icons = { clothing:'👕', electronics:'📱', books:'📚', kitchenware:'🍳', toys:'🧸', tools:'🔧', documents:'📄', medicine:'💊', cosmetics:'💄', sports:'⚽', other:'📦' };
    return icons[cat] || '📦';
  },
  itemActions(id, name) {
    showActionSheet({ title:name, items:[
      { text:'编辑', onClick:()=>Router.navigate('itemEdit',{id, furnitureId:Router.params.id}) },
      { text:'删除', danger:true, onClick:()=>{
        showModal({ title:'确认删除', content:`删除"${name}"？`, confirmText:'删除',
          onConfirm:()=>{ DB.deleteItem(id); showToast('已删除'); Router.navigate('furnitureDetail',{id:Router.params.id}); }
        });
      }}
    ]});
  },
};

// ========== Page: Item Edit ==========
const PageItemEdit = {
  form: {},
  render(container, params) {
    const isEdit = !!params.id;
    this.form = { name:'', category:'', quantity:1, location:'', description:'', tags:[], photos:[], isImportant:false };
    if (isEdit) {
      const item = DB.getItem(params.id);
      if (item) {
        this.form = { name:item.name||'', category:item.category||'', quantity:item.quantity||1, location:item.location||'',
          description:item.description||'', tags:item.tags||[], photos:item.photos||[], isImportant:item.isImportant||false };
      }
    }
    this.furnitureId = params.furnitureId || '';
    this.itemId = params.id || '';
    this.newTag = '';

    const catIdx = ITEM_CATEGORIES.findIndex(c=>c.type===this.form.category);
    let html = `<div class="container">
      <div class="form-group"><label class="form-label">物品名称 *</label><input class="form-input" id="itemName" value="${this.form.name}" placeholder="请输入物品名称"></div>
      <div class="form-group"><label class="form-label">分类</label>
        <div class="category-grid" id="categoryGrid">${ITEM_CATEGORIES.map((c,i)=>`
          <div class="category-item ${i===catIdx?'selected':''}" onclick="PageItemEdit.selectCategory(${i})" data-idx="${i}">${c.name}</div>`).join('')}</div></div>
      <div class="form-group"><label class="form-label">数量</label>
        <div class="quantity-control"><div class="qty-btn" onclick="PageItemEdit.changeQty(-1)">−</div>
        <div class="qty-value" id="qtyValue">${this.form.quantity}</div>
        <div class="qty-btn" onclick="PageItemEdit.changeQty(1)">＋</div></div></div>
      <div class="form-group"><label class="form-label">位置描述</label><input class="form-input" id="itemLocation" value="${this.form.location}" placeholder="如：第二层左侧"></div>
      <div class="form-group"><label class="form-label">标签（最多5个）</label>
        <div class="tag-input-row"><input class="form-input" id="newTagInput" placeholder="输入标签后回车" onkeydown="if(event.key==='Enter'){event.preventDefault();PageItemEdit.addTag();}">
        <button class="btn-primary" style="width:auto;padding:10px 16px" onclick="PageItemEdit.addTag()">添加</button></div>
        <div class="tag-list" id="tagList">${this.form.tags.map((t,i)=>`<span class="tag-item">${t}<span class="tag-remove" onclick="PageItemEdit.removeTag(${i})">×</span></span>`).join('')}</div></div>
      <div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="itemDesc" placeholder="补充说明">${this.form.description}</textarea></div>
      <div class="form-group"><div class="important-toggle"><span class="form-label" style="margin:0">重要物品</span>
        <div class="switch ${this.form.isImportant?'on':''}" id="importantSwitch" onclick="PageItemEdit.toggleImportant()"></div></div></div>
      <button class="btn-primary" onclick="PageItemEdit.save()" style="margin-top:12px">${isEdit?'保存修改':'添加物品'}</button>
    </div>`;
    container.innerHTML = html;
  },
  selectCategory(idx) {
    this.form.category = ITEM_CATEGORIES[idx].type;
    document.querySelectorAll('#categoryGrid .category-item').forEach((el,i)=>el.classList.toggle('selected', i===idx));
  },
  changeQty(delta) {
    this.form.quantity = Math.max(1, this.form.quantity + delta);
    document.getElementById('qtyValue').textContent = this.form.quantity;
  },
  addTag() {
    const input = document.getElementById('newTagInput');
    const tag = (input.value || '').trim();
    if (!tag) return;
    if (this.form.tags.length >= 5) { showToast('最多5个标签'); return; }
    if (this.form.tags.includes(tag)) { showToast('标签已存在'); return; }
    this.form.tags.push(tag);
    input.value = '';
    this.renderTags();
  },
  removeTag(idx) { this.form.tags.splice(idx, 1); this.renderTags(); },
  renderTags() {
    document.getElementById('tagList').innerHTML = this.form.tags.map((t,i)=>`<span class="tag-item">${t}<span class="tag-remove" onclick="PageItemEdit.removeTag(${i})">×</span></span>`).join('');
  },
  toggleImportant() {
    this.form.isImportant = !this.form.isImportant;
    document.getElementById('importantSwitch').classList.toggle('on', this.form.isImportant);
  },
  save() {
    this.form.name = (document.getElementById('itemName').value || '').trim();
    this.form.location = (document.getElementById('itemLocation').value || '').trim();
    this.form.description = (document.getElementById('itemDesc').value || '').trim();
    if (!this.form.name) { showToast('请输入物品名称'); return; }
    if (!this.form.category) { showToast('请选择分类'); return; }
    const data = { name:this.form.name, category:this.form.category, quantity:this.form.quantity,
      location:this.form.location, description:this.form.description, tags:this.form.tags,
      photos:this.form.photos, isImportant:this.form.isImportant };
    if (this.itemId) {
      DB.updateItem(this.itemId, data);
    } else {
      const furniture = DB.getFurnitureById(this.furnitureId);
      DB.addItem({ ...data, familyId:App.currentFamilyId, furnitureId:this.furnitureId,
        roomId:furniture?furniture.roomId:'', floorplanId:furniture?furniture.floorplanId:'' });
    }
    showToast('保存成功');
    setTimeout(()=>Router.back(), 800);
  },
};

// ========== Page: Item Search ==========
const PageItemSearch = {
  keyword: '', selectedCategory: '',
  render(container) {
    const history = Storage.getSearchHistory();
    let html = `<div class="search-box">
      <input class="search-input" id="searchInput" value="${this.keyword}" placeholder="搜索物品名称..." onkeydown="if(event.key==='Enter'){PageItemSearch.doSearch();}">
      <button class="search-btn" onclick="PageItemSearch.doSearch()">搜索</button></div>
      <div class="category-filter" id="categoryFilter">
        ${ITEM_CATEGORIES.map(c=>`<div class="cat-filter-item ${this.selectedCategory===c.type?'selected':''}" onclick="PageItemSearch.selectCategory('${c.type}')">${c.name}</div>`).join('')}
      </div>`;
    if (!this.keyword && !this.selectedCategory) {
      if (history.length > 0) {
        html += `<div class="search-history">
          <div class="history-header"><span class="history-title">搜索历史</span><span class="history-clear" onclick="PageItemSearch.clearHistory()">清空</span></div>
          <div class="history-tags">${history.map(h=>`<span class="history-tag" onclick="PageItemSearch.tapHistory('${h}')">${h}</span>`).join('')}</div></div>`;
      }
      html += `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">输入关键词搜索物品</div></div>`;
    } else {
      const results = DB.searchItems({familyId:App.currentFamilyId, keyword:this.keyword, category:this.selectedCategory});
      html += `<div class="search-result"><div style="padding:8px 0;font-size:13px;color:#999">找到 ${results.length} 个结果</div>`;
      if (results.length > 0) {
        results.forEach(item=>{
          const catColor = getCategoryColor(item.category);
          html += `<div class="result-item" onclick="Router.navigate('itemEdit',{id:'${item._id}',furnitureId:'${item.furnitureId}'})">
            <div class="result-name">${item.isImportant?'<span style="color:#ff4d4f">★</span> ':''}${item.name} <span style="font-size:12px;color:#999">×${item.quantity||1}</span></div>
            <div class="result-location">📍 ${item.furnitureName||'未知家具'}${item.location?' · '+item.location:''}</div>
            <span class="result-category" style="background-color:${catColor}20;color:${catColor}">${getCategoryName(item.category)}</span>
          </div>`;
        });
      } else {
        html += `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">没有找到相关物品</div></div>`;
      }
      html += '</div>';
    }
    container.innerHTML = html;
  },
  doSearch() {
    this.keyword = (document.getElementById('searchInput').value || '').trim();
    if (this.keyword) Storage.addSearchHistory(this.keyword);
    this.render(document.getElementById('contentArea'));
  },
  selectCategory(cat) {
    this.selectedCategory = this.selectedCategory === cat ? '' : cat;
    this.render(document.getElementById('contentArea'));
  },
  tapHistory(kw) { this.keyword = kw; this.render(document.getElementById('contentArea')); this.doSearch(); },
  clearHistory() { Storage.clearSearchHistory(); this.render(document.getElementById('contentArea')); },
};

// ========== Page: Statistics ==========
const PageStatistics = {
  render(container) {
    const stats = DB.getStatistics({familyId:App.currentFamilyId});
    const palette = ['#1890ff','#52c41a','#fa8c16','#f5222d','#722ed1','#13c2c2','#eb2f96','#a0d911','#faad14','#2f54eb','#bfbfbf'];
    const categoryList = Object.keys(stats.categoryStats).map((type,i)=>{
      const cat = ITEM_CATEGORIES.find(c=>c.type===type);
      return { type, name:cat?cat.name:type, count:stats.categoryStats[type],
        percent: stats.total>0 ? Math.round(stats.categoryStats[type]/stats.total*100) : 0,
        color: palette[i%palette.length] };
    }).sort((a,b)=>b.count-a.count);
    const topFurniture = (stats.topFurniture||[]).map(f=>({...f, percent:stats.total>0?Math.round(f.itemCount/stats.total*100):0}));

    let html = `<div class="stats-overview">
      <div class="overview-card"><div class="overview-number">${stats.total}</div><div class="overview-label">物品总数</div></div>
      <div class="overview-card"><div class="overview-number">${stats.furnitureTotal}</div><div class="overview-label">家具</div></div>
      <div class="overview-card"><div class="overview-number">${stats.roomTotal}</div><div class="overview-label">房间</div></div>
      <div class="overview-card"><div class="overview-number">${stats.floorplanTotal}</div><div class="overview-label">平面图</div></div>
    </div>`;

    if (stats.total === 0) {
      html += `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">暂无统计数据</div></div>`;
      container.innerHTML = html; return;
    }

    // Pie chart
    html += `<div class="chart-container"><div class="chart-title">物品分类</div><div class="pie-chart-wrap">`;
    if (categoryList.length > 0) {
      let gradient = 'conic-gradient(';
      let acc = 0;
      categoryList.forEach(c=>{
        const start = acc;
        acc += c.percent;
        gradient += `${c.color} ${start}% ${acc}%, `;
      });
      gradient = gradient.slice(0,-2) + ')';
      html += `<div class="pie-chart" style="background:${gradient}"></div>`;
    } else {
      html += `<div class="pie-chart" style="background:#f0f0f0"></div>`;
    }
    html += `<div class="pie-legend">${categoryList.map(c=>`
      <div class="legend-item"><span class="legend-color" style="background:${c.color}"></span>
      <span class="legend-name">${c.name}</span><span class="legend-value">${c.count} (${c.percent}%)</span></div>`).join('')}</div></div></div>`;

    // Bar chart
    html += `<div class="chart-container"><div class="chart-title">家具物品数 Top 5</div>`;
    if (topFurniture.length > 0) {
      const maxCount = Math.max(...topFurniture.map(f=>f.itemCount), 1);
      topFurniture.forEach((f,i)=>{
        const width = Math.round(f.itemCount / maxCount * 100);
        html += `<div class="bar-chart-item">
          <div class="bar-label"><span>${f.name}</span><span>${f.itemCount} 件 (${f.percent}%)</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${palette[i%palette.length]}">${f.itemCount}</div></div>
        </div>`;
      });
    } else {
      html += '<div style="text-align:center;color:#999;padding:20px">暂无数据</div>';
    }
    html += '</div>';

    // Recent items
    if (stats.recentItems && stats.recentItems.length > 0) {
      html += `<div class="chart-container"><div class="chart-title">最近添加</div>`;
      stats.recentItems.forEach(item=>{
        const catColor = getCategoryColor(item.category);
        html += `<div class="recent-item">
          <span class="recent-cat" style="background:${catColor}20;color:${catColor}">${getCategoryName(item.category)}</span>
          <span class="recent-name">${item.name}</span><span class="recent-qty">×${item.quantity||1}</span></div>`;
      });
      html += '</div>';
    }
    container.innerHTML = html;
  },
};

// ========== Page: Family Manage ==========
const PageFamilyManage = {
  render(container) {
    const family = App.currentFamily;
    if (!family) { container.innerHTML = '<div class="container">请先创建家庭</div>'; return; }
    const isOwner = family.owner === 'local-user';
    let html = `<div class="container">
      <div class="invite-card">
        <div class="invite-title">邀请码</div>
        <div class="invite-code">${family.inviteCode}</div>
        <div class="invite-actions">
          <div class="invite-btn" onclick="PageFamilyManage.copyCode()">📋 复制邀请码</div>
          <div class="invite-btn" onclick="PageFamilyManage.showJoin()">🔗 加入其他家庭</div>
        </div>
      </div>
      <div class="section-title">家庭成员 (${family.members.length})</div>
      <div class="member-list">`;
    family.members.forEach(m=>{
      html += `<div class="member-item">
        <div class="member-avatar">${m.nickname.charAt(0)}</div>
        <div class="member-info"><div class="member-name">${m.nickname}</div>
        <div class="member-role"><span class="role-badge ${m.role==='owner'?'role-owner':'role-member'}">${m.role==='owner'?'创建者':'成员'}</span></div></div>
        ${isOwner && m.openid!=='local-user' ? `<span class="member-remove" onclick="PageFamilyManage.removeMember('${m.openid}','${m.nickname}')">移除</span>`:''}
      </div>`;
    });
    html += `</div>
      <div class="section-title">家庭操作</div>
      <div class="settings-group">
        ${isOwner ? `<div class="settings-item" onclick="PageFamilyManage.transferOwnership()"><span class="settings-label">转让所有权</span><span class="settings-arrow">›</span></div>`:''}
        <div class="settings-item" onclick="PageFamilyManage.leaveFamily()"><span class="settings-label" style="color:${isOwner?'#ff4d4f':'#ff4d4f'}">${isOwner?'解散家庭':'退出家庭'}</span><span class="settings-arrow">›</span></div>
      </div>
    </div>`;
    container.innerHTML = html;
  },
  copyCode() {
    const code = App.currentFamily.inviteCode;
    if (navigator.clipboard) navigator.clipboard.writeText(code);
    showToast('邀请码已复制: ' + code);
  },
  showJoin() {
    showModal({ title:'加入家庭', content:`<input class="input-field" id="joinCodeInput" placeholder="请输入邀请码" maxlength="10" style="text-transform:uppercase">`, confirmText:'加入',
      onConfirm:()=>{
        const code = (document.getElementById('joinCodeInput').value || '').trim().toUpperCase();
        if (!code || code.length < 4) { showToast('请输入邀请码'); return; }
        const result = DB.joinFamily({inviteCode:code, openid:'local-user', nickname:'新成员'});
        if (result.success) {
          App.setCurrentFamily(result.familyId);
          showToast('加入成功');
          Router.navigate('familyManage');
        } else {
          showToast(result.error || '加入失败');
        }
      }
    });
  },
  removeMember(openid, nickname) {
    showModal({ title:'移除成员', content:`确定移除"${nickname}"？`, confirmText:'移除',
      onConfirm:()=>{
        const family = App.currentFamily;
        const newMembers = family.members.filter(m=>m.openid!==openid);
        DB.updateFamily(family._id, {members:newMembers});
        App.currentFamily = DB.getFamily(family._id);
        showToast('已移除');
        Router.navigate('familyManage');
      }
    });
  },
  transferOwnership() {
    const others = App.currentFamily.members.filter(m=>m.openid!=='local-user');
    if (others.length === 0) { showToast('没有其他成员可转让'); return; }
    showActionSheet({ title:'转让给', items: others.map(m=>({ text:`转让给 ${m.nickname}`, onClick:()=>{
      const family = App.currentFamily;
      const newMembers = family.members.map(m=>{
        if (m.openid==='local-user') return {...m, role:'member'};
        if (m.openid===others[0].openid) return {...m, role:'owner'};
        return m;
      });
      // Actually use the selected member
      const target = others.find(o=>o.nickname===m.nickname);
      DB.updateFamily(family._id, {owner:others[0].openid, members:family.members.map(m=>{
        if (m.openid==='local-user') return {...m, role:'member'};
        if (m.openid===others[0].openid) return {...m, role:'owner'};
        return m;
      })});
      App.currentFamily = DB.getFamily(family._id);
      showToast('已转让');
      Router.navigate('familyManage');
    }}))});
  },
  leaveFamily() {
    const family = App.currentFamily;
    const isOwner = family.owner === 'local-user';
    const title = isOwner ? '解散家庭' : '退出家庭';
    const content = isOwner ? '解散后所有数据将被删除，不可恢复。确定解散？' : '退出后需要邀请码才能重新加入。确定退出？';
    showModal({ title, content, confirmText:isOwner?'解散':'退出',
      onConfirm:()=>{
        if (isOwner) {
          const d = DB.readAll();
          d.item = d.item.filter(i=>i.familyId!==family._id);
          d.furniture = d.furniture.filter(f=>f.familyId!==family._id);
          d.room = d.room.filter(r=>r.familyId!==family._id);
          d.floorplan = d.floorplan.filter(f=>f.familyId!==family._id);
          d.family = d.family.filter(f=>f._id!==family._id);
          DB.writeAll(d);
        } else {
          const newMembers = family.members.filter(m=>m.openid!=='local-user');
          DB.updateFamily(family._id, {members:newMembers});
        }
        Storage.setCurrentFamilyId('');
        App.currentFamilyId = null;
        App.currentFamily = null;
        showToast(isOwner?'已解散':'已退出');
        App.init();
        Router.switchTab('index');
      }
    });
  },
};

// ========== Page: Settings ==========
const PageSettings = {
  render(container) {
    const families = DB.getFamilies();
    const current = App.currentFamily;
    let html = `<div class="container">
      <div class="section-title">当前家庭</div>
      <div class="settings-group">
        <div class="settings-item"><span class="settings-label">${current?current.name:'未选择'}</span><span class="settings-value">${current?current.inviteCode:''}</span></div>
      </div>`;
    if (families.length > 1) {
      html += `<div class="section-title">切换家庭</div><div class="settings-group">`;
      families.forEach(f=>{
        html += `<div class="settings-item" onclick="PageSettings.switchFamily('${f._id}')">
          <span class="settings-label">${f.name} ${f._id===App.currentFamilyId?'✓':''}</span>
          <span class="settings-value">${f.members.length}人</span></div>`;
      });
      html += '</div>';
    }
    html += `<div class="section-title">数据管理</div>
      <div class="settings-group">
        <div class="settings-item" onclick="PageSettings.createFamily()"><span class="settings-label">创建新家庭</span><span class="settings-arrow">›</span></div>
        <div class="settings-item" onclick="PageSettings.resetData()"><span class="settings-label" style="color:#ff4d4f">重置全部数据</span><span class="settings-arrow">›</span></div>
      </div>
      <div class="section-title">关于</div>
      <div class="settings-group">
        <div class="settings-item"><span class="settings-label">版本</span><span class="settings-value">1.0.0</span></div>
        <div class="settings-item"><span class="settings-label">存储模式</span><span class="settings-value">本地存储</span></div>
      </div>
    </div>`;
    container.innerHTML = html;
  },
  switchFamily(id) { App.setCurrentFamily(id); showToast('已切换'); Router.switchTab('index'); },
  createFamily() {
    showModal({ title:'创建家庭', content:`<input class="input-field" id="newFamilyName" placeholder="请输入家庭名称" maxlength="20">`, confirmText:'创建',
      onConfirm:()=>{
        const name = (document.getElementById('newFamilyName').value || '').trim() || '我的家';
        const result = DB.createFamily({name});
        if (result.success) { App.setCurrentFamily(result.familyId); showToast('创建成功'); Router.switchTab('index'); }
      }
    });
  },
  resetData() {
    showModal({ title:'重置数据', content:'将清空所有数据并创建演示家庭。继续？', confirmText:'重置',
      onConfirm:()=>{ App.resetAll(); showToast('已重置'); Router.switchTab('index'); }
    });
  },
};

// ========== Init ==========
App.init();

// Tab bar events
document.querySelectorAll('.tab-item').forEach(el=>{
  el.onclick = ()=>Router.switchTab(el.dataset.route);
});

// Start at index
Router.switchTab('index');
</script>
</body>
</html>
