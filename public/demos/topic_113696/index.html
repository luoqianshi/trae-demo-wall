<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人生刻度 LifeScale - 你的人生仪表盘</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <!-- Framer Motion -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.3.19/dist/framer-motion.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #141419;
      --bg-tertiary: #1a1a22;
      --text-primary: #e8e6e3;
      --text-secondary: #9a9a9a;
      --text-muted: #6a6a6a;
      --accent: #d4a053;
      --accent-dim: rgba(212, 160, 83, 0.15);
      --border: rgba(255, 255, 255, 0.08);
      --success: #7c9885;
      --warning: #d4a053;
      --info: #6b8cae;
      --purple: #b07ea3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 100;
    }

    .sidebar-brand {
      padding: 32px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #b8863f);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--bg-primary);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      font-size: 14px;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .nav-indicator {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .sidebar-footer {
      padding: 20px 16px;
      border-top: 1px solid var(--border);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--info), var(--purple));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      color: white;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
    }

    .user-role {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 240px;
      padding: 48px;
      max-width: 1400px;
    }

    .page-header {
      margin-bottom: 48px;
    }

    .page-header h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 16px;
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 8px;
    }

    .kpi-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s;
    }

    .kpi-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .kpi-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .kpi-sub.positive {
      color: var(--success);
    }

    .kpi-sub.negative {
      color: var(--warning);
    }

    /* Panels */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }

    .panel h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* Time Allocation */
    .time-allocation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .time-allocation h2 {
      grid-column: 1 / -1;
    }

    .chart-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-label {
      flex: 1;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .legend-value {
      font-size: 14px;
      font-weight: 600;
    }

    /* Weekly Trend */
    .weekly-trend {
      min-height: 320px;
    }

    /* Goals Progress */
    .goals-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .goal-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .goal-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-category {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .goal-info h3 {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
    }

    .goal-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .goal-progress {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .goal-deadline {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 6px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #e8b86a);
      border-radius: 3px;
      transition: width 1s ease-out;
    }

    /* Timeline */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .timeline-item {
      display: flex;
      gap: 20px;
      padding-bottom: 28px;
    }

    .timeline-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 20px;
      flex-shrink: 0;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-secondary);
      box-shadow: 0 0 0 2px var(--accent);
      flex-shrink: 0;
    }

    .timeline-line {
      width: 2px;
      flex: 1;
      background: var(--border);
      margin-top: 8px;
    }

    .timeline-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-date {
      font-size: 13px;
      color: var(--text-muted);
    }

    .timeline-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .tag-学习 {
      background: rgba(124, 152, 133, 0.2);
      color: var(--success);
    }

    .tag-社交 {
      background: rgba(176, 126, 163, 0.2);
      color: var(--purple);
    }

    .tag-健康 {
      background: rgba(107, 140, 174, 0.2);
      color: var(--info);
    }

    .tag-工作 {
      background: rgba(212, 160, 83, 0.2);
      color: var(--accent);
    }

    .tag-生活 {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
    }

    .tag-里程碑 {
      background: linear-gradient(135deg, rgba(212, 160, 83, 0.3), rgba(176, 126, 163, 0.3));
      color: var(--accent);
    }

    .timeline-content h3 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .timeline-content p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        width: 200px;
      }

      .main-content {
        margin-left: 200px;
        padding: 32px;
      }

      .time-allocation {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 24px 16px;
      }

      .page-header h1 {
        font-size: 28px;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .kpi-value {
        font-size: 28px;
      }
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 18px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">加载中...</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion } = window.Motion || {};
    const { 
      PieChart, Pie, Cell, ResponsiveContainer, Tooltip,
      AreaChart, Area, XAxis, YAxis, CartesianGrid 
    } = Recharts;

    // Mock Data
    const kpiData = [
      { label: '今日专注', value: '4.5h', sub: '较昨日 +18%', positive: true },
      { label: '本周目标达成', value: '72%', sub: '5 / 7 项已完成', positive: true },
      { label: '人生平衡指数', value: '78', sub: '工作偏重，建议增加健康投入', positive: false },
      { label: '连续记录', value: '23天', sub: '最长 41 天', positive: true },
    ];

    const timeAllocationData = [
      { name: '深度工作', value: 6.2, color: '#d4a053' },
      { name: '学习成长', value: 2.0, color: '#7c9885' },
      { name: '运动健康', value: 1.0, color: '#6b8cae' },
      { name: '社交关系', value: 1.5, color: '#b07ea3' },
      { name: '休息恢复', value: 3.3, color: '#8a7e6b' },
    ];

    const weeklyTrendData = [
      { day: '周一', 工作: 8, 学习: 2, 健康: 1, 社交: 1 },
      { day: '周二', 工作: 7, 学习: 3, 健康: 1.5, 社交: 0.5 },
      { day: '周三', 工作: 9, 学习: 1, 健康: 0.5, 社交: 2 },
      { day: '周四', 工作: 6, 学习: 3, 健康: 2, 社交: 1 },
      { day: '周五', 工作: 7, 学习: 2, 健康: 1, 社交: 2.5 },
      { day: '周六', 工作: 3, 学习: 4, 健康: 2, 社交: 3 },
      { day: '周日', 工作: 2, 学习: 3, 健康: 2.5, 社交: 2 },
    ];

    const goalsData = [
      { title: '掌握 TypeScript 高级类型', progress: 82, category: '学习', deadline: '2026-Q3' },
      { title: '完成 50 次力量训练', progress: 56, category: '健康', deadline: '2026-Q4' },
      { title: '读完 24 本书', progress: 38, category: '学习', deadline: '2026-Q4' },
      { title: '建立行业人脉网络', progress: 45, category: '社交', deadline: '2026-Q3' },
      { title: '副业月收入达 5000', progress: 28, category: '工作', deadline: '2026-Q4' },
    ];

    const timelineData = [
      { date: '2026-07-10', title: '完成 TypeScript 类型体操第三章', tag: '学习', note: '泛型约束终于搞懂了' },
      { date: '2026-07-08', title: '与大学室友聚餐', tag: '社交', note: '聊了很多近况，感觉大家都还在摸索' },
      { date: '2026-07-05', title: '第 28 次力量训练', tag: '健康', note: '深蹲 PR 80kg' },
      { date: '2026-06-28', title: '提交了晋升申请', tag: '工作', note: '入职满两年，准备充分' },
      { date: '2026-06-15', title: '读完《纳瓦尔宝典》', tag: '学习', note: '关于杠杆和特定知识的思考很有启发' },
      { date: '2026-05-20', title: '第一次独自旅行', tag: '生活', note: '大理三天，洱海骑行，重新找回了自己' },
      { date: '2026-04-01', title: '开始使用人生刻度', tag: '里程碑', note: '决定认真记录每一天' },
    ];

    const navItems = [
      { id: 'overview', label: '总览', icon: 'LayoutDashboard' },
      { id: 'time', label: '时间', icon: 'Clock' },
      { id: 'goals', label: '目标', icon: 'Target' },
      { id: 'timeline', label: '时间轴', icon: 'GitBranch' },
      { id: 'insights', label: '洞察', icon: 'Lightbulb' },
    ];

    // Icon component
    function Icon({ name, size = 18 }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);
      
      const icons = {
        LayoutDashboard: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
        Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        Target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
        GitBranch: '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        Lightbulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',
        TrendingUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
        TrendingDown: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
      };
      
      return (
        <svg 
          width={size} 
          height={size} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round"
          dangerouslySetInnerHTML={{ __html: icons[name] || '' }}
        />
      );
    }

    // Sidebar Component
    function Sidebar({ active, onSelect }) {
      return (
        <aside className="sidebar">
          <div className="sidebar-brand">
            <div className="brand-mark">LS</div>
            <span className="brand-name">LifeScale</span>
          </div>

          <nav className="sidebar-nav">
            {navItems.map((item) => {
              const isActive = active === item.id;
              return (
                <button
                  key={item.id}
                  className={`nav-item ${isActive ? 'active' : ''}`}
                  onClick={() => onSelect(item.id)}
                >
                  {isActive && <div className="nav-indicator" />}
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>

          <div className="sidebar-footer">
            <div className="user-badge">
              <div className="user-avatar">ZL</div>
              <div className="user-info">
                <span className="user-name">张磊</span>
                <span className="user-role">入职第 847 天</span>
              </div>
            </div>
          </div>
        </aside>
      );
    }

    // KPI Cards Component
    function KPICards() {
      return (
        <div className="kpi-grid">
          {kpiData.map((item, index) => (
            <div key={item.label} className="kpi-card">
              <div className="kpi-label">{item.label}</div>
              <div className="kpi-value">{item.value}</div>
              <div className={`kpi-sub ${item.positive ? 'positive' : 'negative'}`}>
                <Icon name={item.positive ? 'TrendingUp' : 'TrendingDown'} size={14} />
                <span>{item.sub}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // Time Allocation Component
    function TimeAllocation() {
      return (
        <div className="panel time-allocation">
          <h2>今日时间分配</h2>
          <div className="chart-container">
            <ResponsiveContainer width="100%" height={240}>
              <PieChart>
                <Pie
                  data={timeAllocationData}
                  cx="50%"
                  cy="50%"
                  innerRadius={60}
                  outerRadius={90}
                  paddingAngle={2}
                  dataKey="value"
                >
                  {timeAllocationData.map((entry, index) => (
                    <Cell key={`cell-${index}`} fill={entry.color} />
                  ))}
                </Pie>
                <Tooltip
                  contentStyle={{
                    background: 'rgba(20, 20, 25, 0.95)',
                    border: '1px solid rgba(212, 160, 83, 0.3)',
                    borderRadius: '8px',
                  }}
                />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div className="legend">
            {timeAllocationData.map((item) => (
              <div key={item.name} className="legend-item">
                <div className="legend-dot" style={{ background: item.color }} />
                <span className="legend-label">{item.name}</span>
                <span className="legend-value">{item.value}h</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Weekly Trend Component
    function WeeklyTrend() {
      return (
        <div className="panel weekly-trend">
          <h2>本周时间趋势</h2>
          <ResponsiveContainer width="100%" height={240}>
            <AreaChart data={weeklyTrendData}>
              <defs>
                <linearGradient id="gradWork" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#d4a053" stopOpacity={0.6} />
                  <stop offset="100%" stopColor="#d4a053" stopOpacity={0} />
                </linearGradient>
                <linearGradient id="gradLearn" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#7c9885" stopOpacity={0.6} />
                  <stop offset="100%" stopColor="#7c9885" stopOpacity={0} />
                </linearGradient>
                <linearGradient id="gradHealth" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#6b8cae" stopOpacity={0.6} />
                  <stop offset="100%" stopColor="#6b8cae" stopOpacity={0} />
                </linearGradient>
                <linearGradient id="gradSocial" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#b07ea3" stopOpacity={0.6} />
                  <stop offset="100%" stopColor="#b07ea3" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke="rgba(255,255,255,0.06)" vertical={false} />
              <XAxis
                dataKey="day"
                stroke="rgba(255,255,255,0.4)"
                fontSize={12}
                tickLine={false}
                axisLine={false}
              />
              <YAxis
                stroke="rgba(255,255,255,0.4)"
                fontSize={12}
                tickLine={false}
                axisLine={false}
                unit="h"
              />
              <Tooltip
                contentStyle={{
                  background: 'rgba(20, 20, 25, 0.95)',
                  border: '1px solid rgba(212, 160, 83, 0.3)',
                  borderRadius: '8px',
                }}
              />
              <Area
                type="monotone"
                dataKey="工作"
                stroke="#d4a053"
                fill="url(#gradWork)"
                strokeWidth={2}
              />
              <Area
                type="monotone"
                dataKey="学习"
                stroke="#7c9885"
                fill="url(#gradLearn)"
                strokeWidth={2}
              />
              <Area
                type="monotone"
                dataKey="健康"
                stroke="#6b8cae"
                fill="url(#gradHealth)"
                strokeWidth={2}
              />
              <Area
                type="monotone"
                dataKey="社交"
                stroke="#b07ea3"
                fill="url(#gradSocial)"
                strokeWidth={2}
              />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      );
    }

    // Goals Progress Component
    function GoalsProgress() {
      const [animated, setAnimated] = useState(false);
      
      useEffect(() => {
        setTimeout(() => setAnimated(true), 100);
      }, []);

      return (
        <div className="panel goals-progress">
          <h2>年度目标进度</h2>
          <div className="goals-list">
            {goalsData.map((goal) => (
              <div key={goal.title} className="goal-item">
                <div className="goal-header">
                  <div className="goal-info">
                    <span className="goal-category">{goal.category}</span>
                    <h3>{goal.title}</h3>
                  </div>
                  <div className="goal-meta">
                    <span className="goal-progress">{goal.progress}%</span>
                    <span className="goal-deadline">{goal.deadline}</span>
                  </div>
                </div>
                <div className="progress-bar">
                  <div 
                    className="progress-fill"
                    style={{ width: animated ? `${goal.progress}%` : '0%' }}
                  />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Timeline Component
    function Timeline() {
      return (
        <div className="panel timeline">
          <h2>人生时间轴</h2>
          <div className="timeline-list">
            {timelineData.map((item, index) => (
              <div key={item.date + item.title} className="timeline-item">
                <div className="timeline-marker">
                  <div className="timeline-dot" />
                  {index < timelineData.length - 1 && <div className="timeline-line" />}
                </div>
                <div className="timeline-content">
                  <div className="timeline-header">
                    <span className="timeline-date">{item.date}</span>
                    <span className={`timeline-tag tag-${item.tag}`}>{item.tag}</span>
                  </div>
                  <h3>{item.title}</h3>
                  <p>{item.note}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [activeSection, setActiveSection] = useState('overview');

      return (
        <div className="app">
          <Sidebar active={activeSection} onSelect={setActiveSection} />
          <main className="main-content">
            <header className="page-header">
              <h1>人生刻度</h1>
              <p className="subtitle">你的人生仪表盘</p>
            </header>

            <section className="dashboard-grid">
              <KPICards />
              <TimeAllocation />
              <WeeklyTrend />
              <GoalsProgress />
              <Timeline />
            </section>
          </main>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
