﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>小安陪聊 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.chat-page { background: linear-gradient(180deg, #FFF8E1 0%, #F8FFF9 100%); display: flex; flex-direction: column; height: 100vh; }

.chat-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(135deg, #FFB74D, #FF9800); color: #fff; box-shadow: 0 2px 12px rgba(255,152,0,0.2); }
.chat-header .xiaoan-avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #fff; border: 2px solid rgba(255,255,255,0.6); }
.chat-header .xiaoan-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-header .info { flex: 1; }
.chat-header .name { font-size: 16px; font-weight: 700; }
.chat-header .status { font-size: 11px; opacity: 0.9; margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.chat-header .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #B2DFDB; }
.chat-header .top-actions { display: flex; gap: 6px; }
.chat-header .top-action-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border: none; color: #fff; transition: all 0.2s; }
.chat-header .top-action-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.4); }

.chat-body { flex: 1; overflow-y: auto; padding: 16px 12px 230px; -webkit-overflow-scrolling: touch; }

.msg-row { display: flex; gap: 8px; margin-bottom: 14px; animation: msgIn 0.3s ease-out; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg-row.left { flex-direction: row; }
.msg-row.right { flex-direction: row-reverse; }
.msg-row .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: #fff; }
.msg-row .avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-row .avatar.child { background: linear-gradient(135deg, #FFB74D, #FF9800); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; }
.msg-row .bubble { max-width: 72%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.msg-row.left .bubble { background: #fff; color: #5D4037; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.msg-row.right .bubble { background: linear-gradient(135deg, #FFB74D, #FF9800); color: #fff; border-bottom-right-radius: 4px; }

.book-card-msg { background: #fff; border-radius: 14px; overflow: hidden; margin-top: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
.book-card-msg:active { transform: scale(0.97); }
.book-card-msg .cover { width: 100%; aspect-ratio: 4/3; background: linear-gradient(135deg, #FFF8E1, #FFECB3); overflow: hidden; }
.book-card-msg .cover img { width: 100%; height: 100%; object-fit: cover; }
.book-card-msg .info { padding: 8px 12px; }
.book-card-msg .title { font-size: 13px; font-weight: 700; color: #5D4037; }
.book-card-msg .meta { font-size: 10px; color: #8D6E63; margin-top: 2px; }

.quick-reply-row { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; background: rgba(255,255,255,0.7); position: fixed; bottom: 146px; left: 0; right: 0; z-index: 49; }
.quick-reply-row::-webkit-scrollbar { display: none; }
.quick-reply { flex-shrink: 0; padding: 6px 12px; background: #fff; border: 1px solid #FFCC80; border-radius: 16px; font-size: 12px; color: #E65100; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.quick-reply:active { transform: scale(0.95); background: #FFF3E0; }

.input-bar { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #FFE0B2; align-items: center; position: fixed; bottom: 73px; left: 0; right: 0; z-index: 50; }
.input-bar input { flex: 1; padding: 10px 16px; border: 1.5px solid #FFE0B2; border-radius: 22px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.input-bar input:focus { border-color: #FF9800; }
.input-bar .send-btn { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #FFB74D, #FF9800); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-bar .send-btn:active { transform: scale(0.9); }

.typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #8D6E63; margin: 0 1px; animation: typingBounce 1.4s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* 设备标识 */
.device-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: rgba(255,255,255,0.25); border-radius: 10px; font-size: 10px; font-weight: 600; margin-left: 6px; }

/* 横屏 Pad 优化 */
@media (min-width: 768px) and (orientation: landscape) {
  .chat-page { max-width: 1024px; margin: 0 auto; border-left: 1px solid #FFE0B2; border-right: 1px solid #FFE0B2; }
  .chat-header { padding: 14px 32px; }
  .chat-body { padding: 20px 32px 230px; }
  .msg-row .bubble { max-width: 55%; font-size: 15px; padding: 12px 18px; }
  .msg-row .avatar { width: 42px; height: 42px; }
  .book-card-msg { max-width: 280px !important; }
  .quick-reply-row { padding: 10px 32px; bottom: 146px; }
  .quick-reply { padding: 8px 16px; font-size: 14px; }
  .input-bar { padding: 12px 32px; bottom: 73px; }
  .input-bar input { padding: 12px 20px; font-size: 16px; }
  .input-bar .send-btn { width: 48px; height: 48px; font-size: 20px; }
}
</style>
</head>
<body>

<div class="page chat-page">
  <div class="chat-header">
    <div class="xiaoan-avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#FF9800;background:linear-gradient(135deg,#FFB74D,#FF9800);color:#fff;">安</div>
    <div class="info">
      <div class="name">小安</div>
      <div class="status"><span class="dot"></span>在线 · 随时陪你</div>
    </div>
    <div class="top-actions">
      <button class="top-action-btn" title="首页" onclick="XiaoanChat.openHome()">🏠</button>
      <button class="top-action-btn" title="书柜" onclick="XiaoanChat.openLibrary()">📚</button>
    </div>
  </div>

  <div class="demo-banner" style="margin: 0 12px 8px;">🔬 DEMO 演示 · 小安对话为模拟交互，非真实AI对话</div>

  <div class="chat-body" id="chatBody"></div>

  <div class="quick-reply-row" id="quickBar"></div>

  <div class="input-bar">
    <input type="text" id="chatInput" placeholder="和小安说说话..." onkeydown="if(event.key==='Enter')XiaoanChat.send()">
    <button class="send-btn" onclick="XiaoanChat.send()">➤</button>
  </div>

  <div style="height:73px;"></div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/child_nav.js"></script>
<script>
var XiaoanChat = {
  messagesEl: null,
  inputEl: null,
  quickBarEl: null,

  init: function() {
    this.messagesEl = document.getElementById('chatBody');
    this.inputEl = document.getElementById('chatInput');
    this.quickBarEl = document.getElementById('quickBar');

    var childName = UserState.getChildAddress();
    console.log('[小安陪聊] 初始化 | 孩子:', childName);

    this.showGreeting();
    this.renderQuickReplies();
  },

  showGreeting: function() {
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    var self = this;

    this.addMsg('left', '嗨，<b>' + childName + '</b>！我是小安，你的读书小伙伴～ 今天我们一起读绘本，或者聊聊天！');
    setTimeout(function() {
      self.addMsg('left', '我知道你喜欢' + interest + '，给你推荐一本关于' + interest + '的绘本吧！');
    }, 800);
    setTimeout(function() {
      self.showBookRecommend();
    }, 1800);
  },

  showBookRecommend: function() {
    var self = this;
    var row = document.createElement('div');
    row.className = 'msg-row left';
    row.innerHTML = '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB74D,#FF9800);">安</div>' +
      '<div><div class="bubble" style="padding:6px;max-width:200px;background:transparent;box-shadow:none;">' +
      '<div style="font-size:13px;color:#5D4037;margin-bottom:6px;padding:0 6px;">孔先生为你精选 ↓</div>' +
      '</div></div>';
    this.messagesEl.appendChild(row);

    var book = MockData.books[0];
    var bookCard = document.createElement('div');
    bookCard.className = 'msg-row left';
    bookCard.innerHTML = '<div style="width:36px;flex-shrink:0;"></div>' +
      '<div class="book-card-msg" style="max-width:200px;" onclick="XiaoanChat.openBook(\'' + book.id + '\')">' +
      '<div class="cover"><img src="' + (book.coverImage || book.pages[0].imageUrl) + '" alt="' + book.title + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (book.pages[0].illustration || '📖') + '\';this.parentElement.style.fontSize=\'48px\';this.parentElement.style.display=\'flex\';this.parentElement.style.alignItems=\'center\';this.parentElement.style.justifyContent=\'center\';">' + '</div>' +
      '<div class="info"><div class="title">' + book.title + '</div>' +
      '<div class="meta">' + book.age + ' · ' + book.safetyLabel + '</div></div>' +
      '</div>';
    this.messagesEl.appendChild(bookCard);
	    this.scrollToBottom();
	  },

	  showBookList: function() {
	    var self = this;
	    var books = MockData.books.slice(0, 3);
	    books.forEach(function(book) {
	      var card = document.createElement('div');
	      card.className = 'msg-row left';
	      card.innerHTML = '<div style="width:36px;flex-shrink:0;"></div>' +
	        '<div class="book-card-msg" style="max-width:200px;" onclick="XiaoanChat.openBook(\'' + book.id + '\')">' +
	        '<div class="cover"><img src="' + (book.pages[0] && (book.coverImage || book.pages[0].imageUrl) || '') + '" alt="' + book.title + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (book.pages[0] && book.pages[0].illustration || '📖') + '\';this.parentElement.style.fontSize=\'48px\';this.parentElement.style.display=\'flex\';this.parentElement.style.alignItems=\'center\';this.parentElement.style.justifyContent=\'center\';">' + '</div>' +
	        '<div class="info"><div class="title">' + book.title + '</div>' +
	        '<div class="meta">' + (book.valuesTags ? book.valuesTags[0] + ' · ' : '') + book.age + ' · ' + book.safetyLabel + '</div></div>' +
	        '</div>';
	      self.messagesEl.appendChild(card);
	    });
	    this.scrollToBottom();
	  },

	  renderQuickReplies: function() {
    var self = this;
    var quickReplies = MockData.xiaoanQuickReplies;
    this.quickBarEl.innerHTML = '';
    quickReplies.forEach(function(q) {
      var btn = document.createElement('button');
      btn.className = 'quick-reply';
      btn.innerHTML = q.icon + ' ' + q.text;
      btn.onclick = function() { self.handleQuickAction(q.action, q.text); };
      self.quickBarEl.appendChild(btn);
    });
  },

  handleQuickAction: function(action, text) {
    this.addMsg('right', text);
    console.log('[小安陪聊] 快捷操作 | action:', action);
    var self = this;

    if (action === 'read') {
      this.showTyping(function() {
        self.addMsg('left', '好呀！孔先生为你准备了三本精选绘本，来看看选哪一本吧～');
        setTimeout(function() {
          self.showBookList();
        }, 700);
      });
    } else if (action === 'dinosaur') {
      this.showTyping(function() {
        self.addMsg('left', '我最喜欢恐龙了！🦕 孔先生给你准备了《诚实的小恐龙》，里面的小恐龙豆豆可勇敢了！');
        setTimeout(function() { self.showBookRecommend(); }, 500);
      });
    } else if (action === 'recommend') {
      this.showTyping(function() {
        var book = MockData.books[Math.floor(Math.random() * MockData.books.length)];
        self.addMsg('left', '今天为你推荐《' + book.title + '》，' + book.valuesTags[0] + '主题，特别适合你！');
        setTimeout(function() {
          var card = document.createElement('div');
          card.className = 'msg-row left';
          card.innerHTML = '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB74D,#FF9800);">安</div>' +
            '<div class="book-card-msg" style="max-width:200px;" onclick="XiaoanChat.openBook(\'' + book.id + '\')">' +
            '<div class="cover"><img src="' + (book.coverImage || book.pages[0].imageUrl) + '" alt="' + book.title + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (book.pages[0].illustration || '📖') + '\';this.parentElement.style.fontSize=\'48px\';this.parentElement.style.display=\'flex\';this.parentElement.style.alignItems=\'center\';this.parentElement.style.justifyContent=\'center\';">' + '</div>' +
            '<div class="info"><div class="title">' + book.title + '</div>' +
            '<div class="meta">' + book.age + ' · ' + book.safetyLabel + '</div></div>' +
            '</div>';
          self.messagesEl.appendChild(card);
          self.scrollToBottom();
        }, 500);
      });
    } else if (action === 'chat') {
      this.showTyping(function() {
        var childName = UserState.getChildAddress();
        self.addMsg('left', childName + '你好呀！小安最喜欢和你聊天了。今天想听故事，还是想看看新绘本？');
      });
    }
  },

  send: function() {
    var text = this.inputEl.value.trim();
    if (!text) return;
    this.addMsg('right', text);
    this.inputEl.value = '';
    console.log('[小安陪聊] 孩子发送 | text:', text);
    var self = this;
    this.showTyping(function() {
      self.reply(text);
    });
  },

  reply: function(text) {
    var reply = this.findReply(text);
    this.addMsg('left', reply);

    var self = this;
    var matchedBook = this.findBookMatch(text);
    if (matchedBook) {
      setTimeout(function() {
        var card = document.createElement('div');
        card.className = 'msg-row left';
        card.innerHTML = '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB74D,#FF9800);">安</div>' +
          '<div class="book-card-msg" style="max-width:200px;" onclick="XiaoanChat.openBook(\'' + matchedBook.id + '\')">' +
          '<div class="cover"><img src="' + (matchedBook.coverImage || matchedBook.pages[0].imageUrl) + '" alt="' + matchedBook.title + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (matchedBook.pages[0].illustration || '📖') + '\';this.parentElement.style.fontSize=\'48px\';this.parentElement.style.display=\'flex\';this.parentElement.style.alignItems=\'center\';this.parentElement.style.justifyContent=\'center\';">' + '</div>' +
          '<div class="info"><div class="title">' + matchedBook.title + '</div>' +
          '<div class="meta">' + matchedBook.age + ' · ' + matchedBook.safetyLabel + '</div></div>' +
          '</div>';
        self.messagesEl.appendChild(card);
        self.scrollToBottom();
      }, 600);
    }
  },

  findReply: function(text) {
	    var lower = text.toLowerCase();
	    var rules = MockData.xiaoanReplyRules;
	    var childName = UserState.getChildAddress();
	    for (var i = 0; i < rules.length; i++) {
	      for (var j = 0; j < rules[i].keywords.length; j++) {
	        if (lower.indexOf(rules[i].keywords[j]) !== -1) {
	          return rules[i].reply.replace(/小明/g, childName);
	        }
	      }
	    }
	    var defaults = [
	      '嗯嗯，' + childName + '说的我都记住了～',
	      childName + '真棒！我们一起读本书吧！',
	      '哈哈，' + childName + '真有趣！我可以给你讲个故事哦～',
	      '我懂你的意思啦！来看看今天的推荐绘本吧！',
	      childName + '真是个好孩子！小安最喜欢和你聊天了～'
	    ];
    return defaults[Math.floor(Math.random() * defaults.length)];
  },

  findBookMatch: function(text) {
    var lower = text.toLowerCase();
    var books = MockData.books;
    if (lower.indexOf('恐龙') !== -1) return books[0];
    if (lower.indexOf('勇敢') !== -1 || lower.indexOf('害怕') !== -1) return books[1];
    if (lower.indexOf('感恩') !== -1 || lower.indexOf('谢谢') !== -1) return books[2];
    if (lower.indexOf('情绪') !== -1 || lower.indexOf('难过') !== -1) return books[3];
    if (lower.indexOf('分享') !== -1 || lower.indexOf('朋友') !== -1) return books[4];
    return null;
  },

  addMsg: function(side, html) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + side;
    if (side === 'left') {
      row.innerHTML = '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB74D,#FF9800);">安</div>' +
        '<div class="bubble">' + html + '</div>';
    } else {
      var childName = UserState.getChildAddress();
      var initial = childName ? childName.charAt(0) : '孩';
      row.innerHTML = '<div class="avatar child">' + initial + '</div>' +
        '<div class="bubble">' + html + '</div>';
    }
    this.messagesEl.appendChild(row);
    this.scrollToBottom();
  },

  showTyping: function(callback) {
    var row = document.createElement('div');
    row.className = 'msg-row left';
    row.id = 'typingRow';
    row.innerHTML = '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB74D,#FF9800);">安</div>' +
      '<div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
    this.messagesEl.appendChild(row);
    this.scrollToBottom();

    var self = this;
    setTimeout(function() {
      var typing = document.getElementById('typingRow');
      if (typing) typing.remove();
      callback();
    }, 800 + Math.random() * 500);
  },

  openBook: function(id) {
    console.log('[小安陪聊] 打开绘本 | bookId:', id);
    ChildNav.openReader(id);
  },

  openLibrary: function() {
    console.log('[小安陪聊] 打开书柜');
    localStorage.setItem('sishu_library_from', 'child');
    navigateTo('library.html', 'child');
  },

  openHome: function() {
    console.log('[小安陪聊] 打开首页');
    navigateTo('child_home.html', 'child');
  },

  scrollToBottom: function() {
    this.messagesEl.scrollTop = this.messagesEl.scrollHeight;
  }
};

XiaoanChat.init();
</script>

</body>
</html>
