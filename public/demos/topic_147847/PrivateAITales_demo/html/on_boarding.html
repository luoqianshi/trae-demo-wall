<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>锁定教育导向 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.onboarding-page { background: linear-gradient(180deg, #FFFDF7 0%, #FDF8F3 100%); padding-bottom: 70px; }
.chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.chat-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-row.right { justify-content: flex-end; }
.chat-row.left { justify-content: flex-start; }
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-muted); animation: typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

.select-group { display: flex; flex-wrap: wrap; gap: 8px; }
.select-chip { padding: 8px 16px; border: 1.5px solid var(--color-border); border-radius: 20px; font-size: 13px; background: var(--color-surface); cursor: pointer; transition: all 0.2s; user-select: none; }
.select-chip.selected { background: linear-gradient(135deg, #8B5E3C, #6B3F1F); color: #fff; border-color: #8B5E3C; }

.form-group { margin-bottom: 10px; }
.form-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; display: block; font-weight: 600; }
.form-input { width: 100%; padding: 10px 12px; background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; color: var(--color-text); box-sizing: border-box; }
.form-input:focus { outline: none; border-color: var(--color-primary); }

.shoutu-card { padding: 20px; background: linear-gradient(135deg, #FFFDF7, #F5EDE3); border-radius: 14px; border: 1px solid #E8DED0; text-align: center; }
.shoutu-card h3 { font-size: 15px; color: var(--color-primary); margin: 0 0 8px; }
.shoutu-card p { font-size: 13px; color: var(--color-text); line-height: 1.8; margin: 0; }

.value-star { display: inline-block; padding: 4px 10px; background: linear-gradient(135deg, #FFF8E1, #FFECB3); border-radius: 12px; font-size: 12px; font-weight: 600; color: #E65100; margin: 2px; }

/* 双入口 */
.dual-entry { display: flex; gap: 12px; margin-top: 12px; }
.entry-card { flex: 1; padding: 18px 14px; border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
.entry-card:active { transform: scale(0.96); }
.entry-card.parent { background: linear-gradient(135deg, #FFF5EB, #FFE8D6); border-color: #E8C9A8; }
.entry-card.child { background: linear-gradient(135deg, #E8F5E8, #C8E6C9); border-color: #A5D6A7; }
.entry-card .e-icon { font-size: 36px; margin-bottom: 8px; }
.entry-card .e-title { font-size: 15px; font-weight: 700; color: #3D2E1F; margin-bottom: 4px; }
.entry-card .e-sub { font-size: 11px; color: #8B7355; line-height: 1.4; }

.kong-preside { padding: 16px; background: linear-gradient(135deg, #FDF8F3, #FFF5EB); border-radius: 14px; border: 1px solid #E8DED0; text-align: center; margin-bottom: 4px; }
.kong-preside .kp-icon { font-size: 36px; margin-bottom: 8px; }
.kong-preside .kp-title { font-size: 15px; font-weight: 700; color: #3D2E1F; margin-bottom: 4px; }
.kong-preside .kp-desc { font-size: 12px; color: #8B7355; line-height: 1.6; }
</style>
</head>
<body>

<div class="page onboarding-page" id="onboardingApp">
  <div class="page-header">
    <span class="page-title">私塾绘本</span>
  </div>

  <div class="demo-banner" style="margin: 0 16px 8px;">🔬 DEMO 演示 · 仅展示功能流程，不提供真实服务</div>

  <div class="chat-area" id="chatArea"></div>

  <div class="page-footer">
    <div class="steps-indicator" id="stepsIndicator">
      <div class="step-dot active" data-step="1"></div>
      <div class="step-dot" data-step="2"></div>
      <div class="step-dot" data-step="3"></div>
      <div class="step-dot" data-step="4"></div>
      <div class="step-dot" data-step="5"></div>
    </div>
    <div id="footerContent" style="text-align:center;">
      <button class="btn-primary" onclick="Onboarding.next()" style="width:100%;">开始</button>
    </div>
  </div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/parent_nav.js"></script>
<script>
var Onboarding = {
  step: 0,
  totalSteps: 5,
  chatEl: document.getElementById('chatArea'),
  footerEl: document.getElementById('footerContent'),
  stepsEl: document.getElementById('stepsIndicator'),

  anxieties: [],
  childData: {},
  values: [],
  focusAreas: [],

  init: function() {
    console.log('[教育导向] 初始化');
    this.chatEl.innerHTML = '';
    this.step = 0;
    this.showStep(1);
  },

  setStep: function(s) {
    this.step = s;
    var dots = this.stepsEl.querySelectorAll('.step-dot');
    dots.forEach(function(d, i) {
      d.classList.remove('active', 'done');
      if (i + 1 < s) d.classList.add('done');
      if (i + 1 === s) d.classList.add('active');
    });
  },

  addBubble: function(text, side, avatar) {
    var row = document.createElement('div');
    row.className = 'chat-row ' + side;
    if (side === 'left') {
      var av = document.createElement('div');
      av.className = 'avatar avatar-kong';
      av.textContent = avatar || '孔';
      row.appendChild(av);
    }
    var b = document.createElement('div');
    b.className = 'bubble bubble-' + (side === 'left' ? 'left' : 'right');
    b.innerHTML = text;
    row.appendChild(b);
    this.chatEl.appendChild(row);
    this.chatEl.scrollTop = this.chatEl.scrollHeight;
  },

  addTyping: function(callback, delay) {
    var self = this;
    var row = document.createElement('div');
    row.className = 'chat-row left';
    var av = document.createElement('div');
    av.className = 'avatar avatar-kong';
    av.textContent = '孔';
    row.appendChild(av);
    var typing = document.createElement('div');
    typing.className = 'bubble bubble-left';
    typing.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(typing);
    this.chatEl.appendChild(row);
    this.chatEl.scrollTop = this.chatEl.scrollHeight;
    setTimeout(function() {
      row.remove();
      if (callback) callback();
    }, delay || 1200);
  },

  /* ===== 步骤1：定价值观 ===== */
  showStep1: function() {
    this.setStep(1);
    this.footerEl.innerHTML = '<button class="btn-primary" onclick="Onboarding.next()" style="width:100%;">开始</button>';
    var self = this;

    this.addBubble('您好，我是<b>孔先生</b>，您的AI私塾先生。', 'left', '孔');
    this.addBubble('我的工作很简单：<b>家长定价值观，AI创造最适合孩子的绘本，始终守护你的孩子。</b>', 'left', '孔');
    this.addBubble('在开始之前，我想先了解：作为家长，您最担心孩子阅读方面的哪些问题？', 'left', '孔');

    this.footerEl.innerHTML = '<div class="select-group" id="anxietySelect">' +
      '<div class="select-chip" data-val="毒教材" onclick="Onboarding.toggleChip(this)">毒教材防不胜防</div>' +
      '<div class="select-chip" data-val="选错书" onclick="Onboarding.toggleChip(this)">绘本太多，不知怎么选</div>' +
      '<div class="select-chip" data-val="说教不管用" onclick="Onboarding.toggleChip(this)">说教不管用，孩子听不进去</div>' +
      '<div class="select-chip" data-val="内容不安全" onclick="Onboarding.toggleChip(this)">担心AI生成内容不安全</div>' +
      '</div>' +
      '<button class="btn-primary" onclick="Onboarding.step1Confirm()" style="width:100%;margin-top:12px;">确认</button>';
  },

  toggleChip: function(el) {
    el.classList.toggle('selected');
  },

  step1Confirm: function() {
    var chips = document.querySelectorAll('#anxietySelect .select-chip.selected');
    this.anxieties = Array.from(chips).map(function(c) { return c.getAttribute('data-val'); });
    if (this.anxieties.length === 0) {
      this.anxieties = ['毒教材', '选错书'];
    }
    console.log('[教育导向] 家长担忧:', this.anxieties);
    this.addBubble('我担心：' + this.anxieties.join('、') + '。', 'right');
    var self = this;
    this.footerEl.innerHTML = '';
    this.addTyping(function() {
      self.addBubble('我完全理解。这些担忧，正是我在这里的原因。<br><br>我的核心机制是：<b>家长设定价值观，AI自动审核每一本绘本</b>——不合适的直接拦下，通过审核的才能到孩子手中。<br><br>接下来，请告诉我孩子的情况，我们一起<b>锁定教育导向</b>。', 'left', '孔');
      self.showStep2();
    }, 1800);
  },

  /* ===== 步骤2：锁定教育导向 ===== */
  showStep2: function() {
    this.setStep(2);
    this.footerEl.innerHTML = 
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      '<div class="form-group"><span class="form-label">孩子昵称</span><input class="form-input" id="childName" placeholder="如：小明" value="小明"></div>' +
      '<div class="form-group"><span class="form-label">年龄</span><input class="form-input" id="childAge" type="number" placeholder="如：5" value="5" min="2" max="12"></div>' +
      '<div class="form-group"><span class="form-label">性格特点</span>' +
      '<div class="select-group" id="charSelect">' +
      '<div class="select-chip" data-val="活泼" onclick="Onboarding.toggleChip(this)">活泼好动</div>' +
      '<div class="select-chip" data-val="安静" onclick="Onboarding.toggleChip(this)">安静内向</div>' +
      '<div class="select-chip" data-val="好奇" onclick="Onboarding.toggleChip(this)">喜欢探索</div>' +
      '<div class="select-chip" data-val="敏感" onclick="Onboarding.toggleChip(this)">心思细腻</div>' +
      '</div></div>' +
      '<div class="form-group"><span class="form-label">兴趣偏好</span>' +
      '<div class="select-group" id="interestSelect">' +
      '<div class="select-chip" data-val="恐龙" onclick="Onboarding.toggleChip(this)">恐龙</div>' +
      '<div class="select-chip" data-val="公主" onclick="Onboarding.toggleChip(this)">公主</div>' +
      '<div class="select-chip" data-val="太空" onclick="Onboarding.toggleChip(this)">太空</div>' +
      '<div class="select-chip" data-val="动物" onclick="Onboarding.toggleChip(this)">动物</div>' +
      '</div></div>' +
      '<div class="form-group"><span class="form-label">阅读基础</span>' +
      '<div class="select-group" id="readingSelect">' +
      '<div class="select-chip" data-val="初学" onclick="Onboarding.toggleChip(this)">识字量少，需伴读</div>' +
      '<div class="select-chip" data-val="进阶" onclick="Onboarding.toggleChip(this)">有一定基础，能独立阅读</div>' +
      '</div></div>' +
      '<button class="btn-primary" onclick="Onboarding.step2Confirm()" style="width:100%;">锁定教育导向</button>' +
      '</div>';
  },

  step2Confirm: function() {
    var name = document.getElementById('childName').value || '小明';
    var age = document.getElementById('childAge').value || '5';
    var chars = Array.from(document.querySelectorAll('#charSelect .select-chip.selected')).map(function(c) { return c.getAttribute('data-val'); }).join('、') || '活泼好奇';
    var interests = Array.from(document.querySelectorAll('#interestSelect .select-chip.selected')).map(function(c) { return c.getAttribute('data-val'); }).join('、') || '恐龙';
    var reading = Array.from(document.querySelectorAll('#readingSelect .select-chip.selected')).map(function(c) { return c.getAttribute('data-val'); })[0] || '初学';

    this.childData = { name: name, age: age, character: chars, interest: interests, reading: reading };
    console.log('[教育导向] 孩子信息:', JSON.stringify(this.childData));
    this.addBubble('孩子叫' + name + '，' + age + '岁，性格' + chars + '，喜欢' + interests + '。', 'right');

    var self = this;
    this.footerEl.innerHTML = '';
    this.addTyping(function() {
      self.addBubble('<div class="shoutu-card"><h3>📜 教育导向已锁定</h3><p><b>' + name + '</b>，' + age + '岁，喜欢' + interests + '。<br>从今天起，我将为你量身定制绘本，<br>用你喜欢的故事陪伴你成长。<br><br>你的家长设定了价值观，<br>我会确保每一本绘本都安全、纯正。</p></div>', 'left', '孔');
      self.showStep3();
    }, 2000);
  },

  /* ===== 步骤3：确认家庭价值观 ===== */
  showStep3: function() {
    this.setStep(3);
    this.footerEl.innerHTML = 
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      '<div style="font-size:12px;color:var(--color-text-secondary);">请勾选您最看重的 3-5 项价值观（AI将以此审核每一本绘本）：</div>' +
      '<div class="select-group" id="valueSelect">' +
      '<div class="select-chip" data-val="诚实" onclick="Onboarding.toggleChip(this)">诚实</div>' +
      '<div class="select-chip" data-val="勇敢" onclick="Onboarding.toggleChip(this)">勇敢</div>' +
      '<div class="select-chip" data-val="善良" onclick="Onboarding.toggleChip(this)">善良</div>' +
      '<div class="select-chip" data-val="责任" onclick="Onboarding.toggleChip(this)">责任</div>' +
      '<div class="select-chip" data-val="感恩" onclick="Onboarding.toggleChip(this)">感恩</div>' +
      '<div class="select-chip" data-val="尊重" onclick="Onboarding.toggleChip(this)">尊重</div>' +
      '<div class="select-chip" data-val="自信" onclick="Onboarding.toggleChip(this)">自信</div>' +
      '<div class="select-chip" data-val="坚持" onclick="Onboarding.toggleChip(this)">坚持</div>' +
      '</div>' +
      '<button class="btn-primary" onclick="Onboarding.step3Confirm()" style="width:100%;">确认价值观</button>' +
      '</div>';
  },

  step3Confirm: function() {
    var vals = Array.from(document.querySelectorAll('#valueSelect .select-chip.selected')).map(function(c) { return c.getAttribute('data-val'); });
    this.values = vals.length >= 3 ? vals : ['诚实', '勇敢', '善良'];
    console.log('[教育导向] 家庭价值观:', this.values);
    this.addBubble('我最看重：' + this.values.join('、') + '。', 'right');
    var self = this;
    this.footerEl.innerHTML = '';
    this.addTyping(function() {
      var tagsHtml = '';
      self.values.forEach(function(v) {
        tagsHtml += '<span class="value-star">⭐ ' + v + '</span> ';
      });
      self.addBubble('您的<b>家庭价值观图谱</b>已生成：<br><br>' + tagsHtml + '<br><br>从今天起，AI将按这些价值观审核每一本绘本——<b>不通过的，到不了孩子手中。</b>', 'left', '孔');
      self.showStep4();
    }, 1200);
  },

  /* ===== 步骤4：培养方向 ===== */
  showStep4: function() {
    this.setStep(4);
    this.footerEl.innerHTML = 
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      '<div style="font-size:12px;color:var(--color-text-secondary);">近期重点培养的方向（1-2个）：</div>' +
      '<div class="select-group" id="focusSelect" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="select-chip" data-val="品德" onclick="Onboarding.toggleFocusChip(this)" style="text-align:center;padding:12px;border-radius:14px;">🎓 品德修养</div>' +
      '<div class="select-chip" data-val="社会性" onclick="Onboarding.toggleFocusChip(this)" style="text-align:center;padding:12px;border-radius:14px;">🤝 社会交往</div>' +
      '<div class="select-chip" data-val="情绪" onclick="Onboarding.toggleFocusChip(this)" style="text-align:center;padding:12px;border-radius:14px;">💭 情绪管理</div>' +
      '<div class="select-chip" data-val="认知" onclick="Onboarding.toggleFocusChip(this)" style="text-align:center;padding:12px;border-radius:14px;">🧠 认知发展</div>' +
      '</div>' +
      '<button class="btn-primary" onclick="Onboarding.step4Confirm()" style="width:100%;">确认培养方向</button>' +
      '</div>';
  },

  toggleFocusChip: function(el) {
    el.classList.toggle('selected');
  },

  step4Confirm: function() {
    var sels = Array.from(document.querySelectorAll('#focusSelect .select-chip.selected')).map(function(c) { return c.getAttribute('data-val'); });
    this.focusAreas = sels.length > 0 ? sels : ['品德'];
    console.log('[教育导向] 培养方向:', this.focusAreas);
    this.addBubble('近期重点关注：' + this.focusAreas.join('、') + '。', 'right');
    var self = this;
    this.footerEl.innerHTML = '';
    this.addTyping(function() {
      self.addBubble('明白了。我会围绕<b>' + self.focusAreas.join('、') + '</b>来规划阅读内容。<br><br>每周我会推送阅读报告，汇报孩子的阅读情况和成长建议。<br><br>现在，教育导向已经锁定。我将<b>坐镇私塾</b>，监督指导孩子的教育。', 'left', '孔');
      self.showStep5();
    }, 1500);
  },

  /* ===== 步骤5：完成 · 双入口 ===== */
  showStep5: function() {
    this.setStep(5);
    console.log('[教育导向] 完成 | 完整数据:', {
      焦虑: this.anxieties,
      孩子: this.childData,
      家庭价值观: this.values,
      培养方向: this.focusAreas
    });

    this.addBubble(
      '<div class="kong-preside">' +
      '<div class="kp-icon">🏛️</div>' +
      '<div class="kp-title">孔先生已坐镇私塾</div>' +
      '<div class="kp-desc">家长定价值观 → AI审核每一本绘本 → 小安陪孩子安全阅读<br>每周阅读报告，随时调整教育方向</div>' +
      '</div>', 'left', '孔');

    this.addBubble('现在，请选择以谁的身份进入：', 'left', '孔');

    this.footerEl.innerHTML = 
      '<div class="dual-entry">' +
      '<div class="entry-card parent" onclick="Onboarding.enterParent()">' +
      '<div class="e-icon">👨‍🏫</div>' +
      '<div class="e-title">家长端</div>' +
      '<div class="e-sub">孔先生对话<br>管理绘本 · 查看报告</div>' +
      '</div>' +
      '<div class="entry-card child" onclick="Onboarding.enterChild()">' +
      '<div class="e-icon">📖</div>' +
      '<div class="e-title">孩子端</div>' +
      '<div class="e-sub">小安陪读<br>安全绘本 · 启发思考</div>' +
      '</div>' +
      '</div>';
  },

  enterParent: function() {
    this.saveAndGo('parent_chat.html');
  },

  enterChild: function() {
    this.saveAndGo('child_chat.html');
  },

  saveAndGo: function(url) {
    UserState.updateOnboarding({
      anxieties: this.anxieties,
      child: this.childData,
      values: this.values,
      focusAreas: this.focusAreas
    });
    console.log('[教育导向] 完成 → 跳转到', url);
    navigateTo(url);
  },

  /* ===== 流程控制 ===== */
  next: function() {
    if (this.step === 0) { this.showStep1(); }
  },

  showStep: function(n) {
    var methods = [null, 'showStep1', 'showStep2', 'showStep3', 'showStep4', 'showStep5'];
    if (this[methods[n]]) this[methods[n]]();
  }
};

Onboarding.init();
</script>

</body>
</html>
