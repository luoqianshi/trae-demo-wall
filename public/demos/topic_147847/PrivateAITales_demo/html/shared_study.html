<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>共享书房 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
  .study-page { background: linear-gradient(180deg, #FFFDF7 0%, #FDF8F3 100%); }
  .study-header {
    padding: 12px 16px; background: var(--color-surface);
    border-bottom: 1px solid var(--color-border-light); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .study-header .back-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--color-bg-alt); font-size: 16px; color: var(--color-text-secondary);
    cursor: pointer; border: none;
  }
  .study-header .title { font-size: 15px; font-weight: 700; color: var(--color-text); }
  .study-header .subtitle { font-size: 11px; color: var(--color-text-muted); margin-left: auto; }

  .study-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }

  /* 价值观筛选区 */
  .filter-section { margin-bottom: 14px; }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px; }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 600;
    background: var(--color-surface); border: 1px solid var(--color-border);
    color: var(--color-text-secondary); cursor: pointer; transition: all 0.2s;
  }
  .filter-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  .filter-chip.safety-green { color: var(--color-safe-green); border-color: var(--color-safe-green); }
  .filter-chip.safety-green.active { background: var(--color-safe-green); color: #fff; }
  .filter-chip.safety-yellow { color: var(--color-warn-yellow); border-color: var(--color-warn-yellow); }
  .filter-chip.safety-yellow.active { background: var(--color-warn-yellow); color: #fff; }

  /* 孔先生推荐横幅 */
  .kong-reco-banner {
    padding: 14px; border-radius: 14px; margin-bottom: 14px;
    background: linear-gradient(135deg, #FFF5EB, #FFE8D6); border: 1px solid #E8C9A8;
    display: flex; align-items: center; gap: 10px;
  }
  .kong-reco-banner .avatar {
    width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #8B5E3C, #6B3F1F);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .kong-reco-banner .reco-text { flex: 1; }
  .kong-reco-banner .reco-text .name { font-size: 13px; font-weight: 700; color: #5D4037; }
  .kong-reco-banner .reco-text .msg { font-size: 11px; color: #8B7355; line-height: 1.5; margin-top: 2px; }

  /* 绘本卡片列表 */
  .book-list { display: flex; flex-direction: column; gap: 10px; }
  .book-item {
    padding: 12px; border-radius: 14px; background: var(--color-surface);
    border: 1px solid var(--color-border-light); display: flex; gap: 10px;
    transition: all 0.2s; cursor: pointer;
  }
  .book-item:active { transform: scale(0.98); border-color: var(--color-primary); }
  .book-item .cover {
    width: 56px; height: 72px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .book-item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .book-item .info .title { font-size: 14px; font-weight: 700; color: var(--color-text); }
  .book-item .info .meta { font-size: 11px; color: var(--color-text-muted); }
  .book-item .info .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .book-item .info .action-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .book-item .price { font-size: 13px; font-weight: 700; color: var(--color-primary); }
  .book-item .price .member { font-size: 11px; color: #C8960C; margin-left: 4px; }

  .favorite-btn {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    background: var(--color-danger-red-bg); color: var(--color-danger-red); cursor: pointer; border: none;
    transition: all 0.2s;
  }
  .favorite-btn.favorited { background: var(--color-safe-green-bg); color: var(--color-safe-green); }

  .share-btn {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    background: var(--color-bg-alt); color: var(--color-text-secondary); cursor: pointer; border: 1px solid var(--color-border);
    transition: all 0.2s;
  }
  .share-btn:active { background: var(--color-primary-light); color: var(--color-primary); }

  /* 分享弹窗 */
  .share-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    padding: 20px 28px; background: rgba(0,0,0,0.85); color: #fff; border-radius: 16px;
    font-size: 14px; text-align: center; z-index: 100; pointer-events: none;
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state .text { font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

<div class="page study-page">
  <div class="study-header">
    <button class="back-btn" onclick="navigateTo('start.html')">←</button>
    <span class="title">🏛️ 共享书房</span>
    <span class="subtitle">孔先生精选</span>
  </div>

  <div class="study-scroll">
	    <!-- 孔先生推荐 -->
	    <div class="kong-reco-banner">
	      <div class="avatar">孔</div>
	      <div class="reco-text">
	        <div class="name">孔先生为您推荐</div>
	        <div class="msg">基于您家庭的价值观（诚实、勇敢、善良），以下绘本完全匹配，安全等级均为绿级，放心给孩子阅读。</div>
	      </div>
	    </div>

	    <div class="demo-banner" style="margin-bottom: 12px;">🔬 DEMO 演示 · 绘本内容为示例占位，非真实绘本</div>

    <!-- 价值观筛选 -->
    <div class="filter-section">
      <div class="filter-label">价值观标签</div>
      <div class="filter-chips" id="valueFilterChips">
        <span class="filter-chip active" data-value="all">全部</span>
        <span class="filter-chip" data-value="诚实">诚实</span>
        <span class="filter-chip" data-value="勇敢">勇敢</span>
        <span class="filter-chip" data-value="善良">善良</span>
        <span class="filter-chip" data-value="感恩">感恩</span>
        <span class="filter-chip" data-value="友爱">友爱</span>
        <span class="filter-chip" data-value="坚持">坚持</span>
        <span class="filter-chip" data-value="自信">自信</span>
      </div>
    </div>

    <!-- 安全等级筛选 -->
    <div class="filter-section">
      <div class="filter-label">安全等级</div>
      <div class="filter-chips" id="safetyFilterChips">
        <span class="filter-chip active" data-safety="all">全部</span>
        <span class="filter-chip safety-green active" data-safety="green">🟢 绿级安全</span>
        <span class="filter-chip safety-yellow" data-safety="yellow">🟡 亲子共读</span>
      </div>
    </div>

    <!-- 绘本列表 -->
    <div class="book-list" id="bookList"></div>
  </div>
</div>

<!-- 底部导航 -->
<div id="tabBarContainer"></div>

<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/state.js"></script>
<script>
  // 共享书房绘本数据
  var sharedBooks = [
    {
      id: 'shared_001',
      title: '诚实的小恐龙',
      cover: '🦕',
      author: '小明妈妈',
      values: ['诚实', '勇敢'],
      safety: 'green',
      age: '3-6',
      desc: '小恐龙不说谎，勇敢承认错误的故事',
      price: '9.9',
      memberPrice: '1.9',
      sharedAt: '2026-07-02',
      sharedBy: '小明妈妈',
      favorited: false
    },
    {
      id: 'shared_002',
      title: '勇敢的小三角龙',
      cover: '🦖',
      author: '大明爸爸',
      values: ['勇敢', '自信'],
      safety: 'green',
      age: '4-7',
      desc: '小三角龙克服恐惧，独自面对霸王龙',
      price: '9.9',
      memberPrice: '2.9',
      sharedAt: '2026-07-01',
      sharedBy: '大明爸爸',
      favorited: false
    },
    {
      id: 'shared_003',
      title: '小熊的感恩日记',
      cover: '🐻',
      author: '文文老师',
      values: ['感恩', '善良'],
      safety: 'green',
      age: '3-6',
      desc: '小熊学会感恩身边每一个帮助它的人',
      price: '9.9',
      memberPrice: '1.9',
      sharedAt: '2026-06-30',
      sharedBy: '文文老师',
      favorited: false
    },
    {
      id: 'shared_004',
      title: '兔子好朋友',
      cover: '🐰',
      author: '乐乐妈妈',
      values: ['友爱', '分享'],
      safety: 'green',
      age: '2-5',
      desc: '小兔子学会和好朋友分享胡萝卜',
      price: '9.9',
      memberPrice: '2.9',
      sharedAt: '2026-06-29',
      sharedBy: '乐乐妈妈',
      favorited: false
    },
    {
      id: 'shared_005',
      title: '小蜗牛的坚持',
      cover: '🐌',
      author: '小明妈妈',
      values: ['坚持', '自信'],
      safety: 'green',
      age: '3-6',
      desc: '小蜗牛慢慢爬，凡事只要坚持就能做到',
      price: '9.9',
      memberPrice: '3.9',
      sharedAt: '2026-06-28',
      sharedBy: '小明妈妈',
      favorited: false
    },
    {
      id: 'shared_006',
      title: '星星的梦想',
      cover: '🌟',
      author: '星辰爸爸',
      values: ['自信', '勇敢'],
      safety: 'yellow',
      age: '5-8',
      desc: '一颗星星追逐梦想的故事，含轻微离别情节',
      price: '9.9',
      memberPrice: '1.9',
      sharedAt: '2026-06-27',
      sharedBy: '星辰爸爸',
      favorited: false
    }
  ];

  var currentValueFilter = 'all';
  var currentSafetyFilter = 'all';

  function renderBooks() {
    var filtered = sharedBooks.filter(function(b) {
      if (currentValueFilter !== 'all' && b.values.indexOf(currentValueFilter) === -1) return false;
      if (currentSafetyFilter !== 'all' && b.safety !== currentSafetyFilter) return false;
      return true;
    });

    var html = '';
    if (filtered.length === 0) {
      html = '<div class="empty-state"><div class="icon">📭</div><div class="text">没有找到匹配的绘本<br>试试调整筛选条件</div></div>';
    } else {
      filtered.forEach(function(book) {
        var safetyBadge = book.safety === 'green' ?
          '<span class="tag tag-green">🟢 绿级安全</span>' :
          '<span class="tag tag-yellow">🟡 亲子共读</span>';

        var valueTags = book.values.map(function(v) {
          return '<span class="tag" style="background:var(--color-primary-light);color:var(--color-primary);">#' + v + '</span>';
        }).join('');

        var favClass = book.favorited ? 'favorite-btn favorited' : 'favorite-btn';
        var favText = book.favorited ? '✓ 已收藏' : '♡ 收藏';

        html += '<div class="book-item" onclick="openBookReader(\'' + book.id + '\')" style="position:relative;">' +
	          '<div class="demo-book-overlay">DEMO</div>' +
	          '<div class="cover" style="background:' + getCoverColor(book) + '">' + book.cover + '</div>' +
          '<div class="info">' +
            '<div class="title">' + book.title + '</div>' +
            '<div class="meta">' + book.author + ' · ' + book.age + '岁 · ' + safetyBadge + '</div>' +
            '<div class="tags">' + valueTags + '</div>' +
            '<div class="action-row">' +
              '<span class="price">¥' + book.price + '<span class="member">会员 ¥' + book.memberPrice + '</span></span>' +
              '<button class="' + favClass + '" onclick="toggleFavorite(\'' + book.id + '\')">' + favText + '</button>' +
              '<button class="share-btn" onclick="shareBook(\'' + book.id + '\')">📤 分享</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    document.getElementById('bookList').innerHTML = html;
  }

  function getCoverColor(book) {
    var colors = {'green':'#E8F5E8','yellow':'#FFF8E1'};
    return colors[book.safety] || '#E8F5E8';
  }

  function toggleFavorite(bookId) {
    var book = sharedBooks.find(function(b) { return b.id === bookId; });
    if (book) {
      book.favorited = !book.favorited;
      showToast(book.favorited ? '已收藏到孩子书架 ✨' : '已取消收藏');
      renderBooks();
    }
  }

  function shareBook(bookId) {
    var book = sharedBooks.find(function(b) { return b.id === bookId; });
    if (book) {
      showToast('《' + book.title + '》已分享至共享书房\n孔先生已自动打标审核');
    }
  }

  function showToast(msg) {
    var existing = document.querySelector('.share-toast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'share-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2000);
  }

  // 价值观筛选
  document.getElementById('valueFilterChips').addEventListener('click', function(e) {
    if (e.target.classList.contains('filter-chip')) {
      document.querySelectorAll('#valueFilterChips .filter-chip').forEach(function(c) { c.classList.remove('active'); });
      e.target.classList.add('active');
      currentValueFilter = e.target.getAttribute('data-value');
      renderBooks();
    }
  });

  // 安全等级筛选
  document.getElementById('safetyFilterChips').addEventListener('click', function(e) {
    if (e.target.classList.contains('filter-chip')) {
      document.querySelectorAll('#safetyFilterChips .filter-chip').forEach(function(c) { c.classList.remove('active'); });
      e.target.classList.add('active');
      currentSafetyFilter = e.target.getAttribute('data-safety');
      renderBooks();
    }
  });

  // 初始化
  renderBooks();
  mountTabBar('parent', 'shared');
</script>
</body>
</html>
