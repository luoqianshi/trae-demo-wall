<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚛️ 物理 · 聊天式学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5ede0;--surface:#fdf8f0;--surface2:#f0e4d0;--brand:#c4916a;--brand2:#a0724e;
  --accent:#d4a853;--gold:#e8c547;--cyan:#8bb8c9;--green:#8cba8e;--red:#d4958a;
  --text:#4a3020;--text2:#7a5f4a;--text3:#b8a58e;--radius:20px;--radius2:14px;
  --font:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --chi-pink:#f5ead8;--chi-mint:#e8efd8;--chi-yellow:#fdf0d8;--chi-blue:#e8eef0;--chi-lavender:#f0e8e8;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.app{width:100%;height:100%;max-width:900px;position:relative;display:flex;flex-direction:column}

.top-bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;padding:0 16px;z-index:100;gap:12px}
.progress-wrap{flex:1;height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s ease;border-radius:2px}
.page-dots{display:flex;gap:5px}
.page-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:all .3s}
.page-dot.active{background:var(--brand);width:20px;border-radius:3px;box-shadow:0 0 8px rgba(196,145,106,.5)}
.demo-badge{font-size:10px;font-weight:800;color:var(--brand2);background:var(--chi-pink);padding:4px 10px;border-radius:20px;letter-spacing:1px;border:1px solid rgba(160,114,78,.2);flex-shrink:0}
.api-btn{padding:4px 8px;border-radius:20px;border:1px solid rgba(196,145,106,.3);background:var(--chi-pink);color:var(--brand2);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.5px;font-family:var(--font)}
.api-btn:hover{background:rgba(196,145,106,.2);border-color:var(--brand)}

.api-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.api-modal.show{opacity:1;pointer-events:auto}
.api-modal-content{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);padding:24px;width:100%;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.api-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.api-modal-header h3{font-size:18px;font-weight:700;color:var(--text)}
.api-modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.api-modal-close:hover{color:var(--text);background:var(--chi-pink)}
.api-modal-label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.api-modal-input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid rgba(0,0,0,.08);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.api-modal-input:focus{border-color:var(--brand)}
.api-modal-hint{font-size:12px;color:var(--text3);margin-top:12px;line-height:1.6}
.api-modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.api-modal-btn{padding:8px 20px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)}
.api-modal-cancel{background:transparent;border:1px solid var(--text3);color:var(--text2)}
.api-modal-cancel:hover{background:var(--surface2)}
.api-modal-confirm{background:var(--brand);border:1px solid var(--brand);color:#fff}
.api-modal-confirm:hover{background:var(--brand2)}

.welcome-overlay{position:fixed;inset:0;z-index:200;transition:opacity .5s,transform .5s;background:var(--bg) url('welcome-cover.png') center/contain no-repeat}
.welcome-overlay .welcome-hotspot{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:200px;height:56px;cursor:pointer;z-index:1}
.welcome-overlay.hide{opacity:0;transform:scale(1.05);pointer-events:none}

.main{flex:1;display:flex;position:relative;overflow:hidden;margin-top:48px}
.pages{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
.page.active{opacity:1;transform:translateY(0);pointer-events:auto}
.page-header{padding:16px 90px 0 20px;flex-shrink:0}
.page-number{font-size:11px;font-weight:700;color:var(--brand2);letter-spacing:1.5px}
.page-question{font-size:20px;font-weight:700;line-height:1.4;color:var(--text);margin-top:4px}
.chat-area{flex:1;overflow-y:auto;padding:12px 20px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:8px}
.chat-area::-webkit-scrollbar-thumb{background:var(--brand);border-radius:4px}
.chat-area::-webkit-scrollbar-track{background:transparent;margin:4px 0}
.chat-area::-webkit-scrollbar-thumb:hover{background:var(--brand2)}
.msg{display:flex;gap:8px;max-width:90%;animation:msgIn .3s ease}
.msg.ai{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg.ai .msg-avatar{background:var(--brand)}
.msg.user .msg-avatar{background:var(--accent)}
.msg-bubble{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;color:var(--text)}
.msg.ai .msg-bubble{border-top-left-radius:3px}
.msg.user .msg-bubble{background:var(--brand);border-top-right-radius:3px;color:#fff}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 16px 16px;background:var(--bg);border-top:1px solid rgba(0,0,0,.04);flex-shrink:0}
.input-text{flex:1;background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius2);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--font);line-height:1.5;resize:none;outline:none;max-height:100px;transition:border-color .3s}
.input-text:focus{border-color:var(--brand)}
.input-text::placeholder{color:var(--text3);font-size:13px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;background:var(--surface);color:var(--text2)}
.btn-icon:hover{background:var(--surface2);transform:scale(1.05)}
.btn-send{background:var(--brand);color:#fff}
.btn-send:hover{background:var(--brand2)}
.btn-send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-voice.recording{background:var(--red);color:#fff;animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(253,164,175,.4)}50%{box-shadow:0 0 0 10px rgba(253,164,175,0)}}
.skip-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:58px;height:56px;border-radius:10px;background:var(--surface);border:1px solid rgba(0,0,0,.06);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .3s;z-index:50;font-family:var(--font)}
.skip-btn:hover{background:var(--surface2);border-color:var(--brand);color:var(--brand2);transform:translateY(-50%) scale(1.05);box-shadow:0 0 14px rgba(196,145,106,.15)}
.skip-btn:disabled,.skip-btn.disabled{opacity:.35;cursor:not-allowed;transform:translateY(-50%);background:var(--surface);border-color:rgba(0,0,0,.04);color:var(--text3)}
.skip-btn:disabled:hover,.skip-btn.disabled:hover{background:var(--surface);border-color:rgba(0,0,0,.04);color:var(--text3);box-shadow:none}
.skip-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.skip-remaining{font-size:9px;color:var(--cyan);margin-top:1px;line-height:1}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:8px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 2.5s forwards;pointer-events:none}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.bottom-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);z-index:50;pointer-events:none;display:flex;align-items:center;gap:6px}
.bottom-hint kbd{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:4px;padding:1px 6px;font-size:10px;font-family:var(--font);color:var(--text2)}

/* 学习模式 */
.learn-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.learn-header::-webkit-scrollbar{display:none}
.learn-subject-tag{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.06);background:var(--surface);color:var(--text2);transition:all .2s;white-space:nowrap}
.learn-subject-tag:hover{background:var(--surface2);color:var(--text)}
.learn-subject-tag.active{background:var(--chi-pink);border-color:var(--brand);color:var(--brand2)}
.learn-subject-tag .score{font-size:10px;margin-left:4px;opacity:.7}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;font-weight:700;margin-right:3px;flex-shrink:0}
.learn-chat{flex:1;overflow-y:auto;padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.learn-chat::-webkit-scrollbar{width:8px}
.learn-chat::-webkit-scrollbar-thumb{background:var(--brand);border-radius:4px}
.learn-chat::-webkit-scrollbar-track{background:transparent;margin:4px 0}
.learn-chat::-webkit-scrollbar-thumb:hover{background:var(--brand2)}
.learn-input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 16px 16px;border-top:1px solid rgba(0,0,0,.04);flex-shrink:0}
.learn-msg-system{text-align:center;font-size:12px;color:var(--text3);padding:8px 0}
.learn-msg-system span{background:var(--surface);border-radius:12px;padding:4px 12px}
.learn-topic-hint{background:var(--surface);border:1px solid rgba(196,145,106,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:4px}
.learn-topic-hint strong{color:var(--brand2)}
.learn-back-btn{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:var(--surface);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:50;transition:all .2s}
.learn-back-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--brand)}

.finish-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:30px 40px;overflow-y:auto}
.finish-content::-webkit-scrollbar{width:8px}
.finish-content::-webkit-scrollbar-thumb{background:var(--brand);border-radius:4px}
.finish-content::-webkit-scrollbar-track{background:transparent;margin:4px 0}
.finish-icon{font-size:64px;animation:finishCelebrate 1s ease-out}
@keyframes finishCelebrate{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.finish-title{font-size:24px;font-weight:800}
.finish-sub{font-size:14px;color:var(--text2);line-height:1.7;max-width:380px}
.finish-btn{padding:12px 32px;border-radius:50px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .3s;font-family:var(--font);flex-shrink:0}
.finish-btn:hover{background:var(--brand2);transform:scale(1.05)}
.finish-btn.outline{background:transparent;border:1px solid var(--brand);color:var(--brand2)}
.finish-btn.outline:hover{background:var(--chi-pink)}
.finish-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

@media(max-width:768px){
  .page-header{padding:12px 70px 0 14px}.page-question{font-size:17px}
  .chat-area{padding:8px 10px 4px}.msg{max-width:94%}
  .input-bar{padding:6px 10px 12px;gap:6px}
  .skip-btn{right:4px;width:48px;height:48px;font-size:10px;border-radius:8px}
  .welcome-title{font-size:22px}.welcome-features{gap:16px}.top-bar{padding:0 10px}
  .finish-content{padding:20px 16px}
  .learn-header{padding:8px 10px;gap:6px}
  .learn-subject-tag{padding:5px 10px;font-size:11px}
  .learn-chat{padding:8px 10px 4px}
}

/* 吉伊卡哇风格装饰 */
.epilogue-page{background:linear-gradient(135deg,var(--chi-pink),var(--chi-lavender));border-radius:16px;padding:18px 20px;font-size:14px;line-height:1.8;color:var(--text);border:2px dashed rgba(196,145,106,.3);position:relative;overflow:hidden}
.epilogue-page::before{content:'🌸';position:absolute;top:-8px;right:12px;font-size:32px;opacity:.3;transform:rotate(15deg)}
.epilogue-page::after{content:'⭐';position:absolute;bottom:-6px;left:10px;font-size:24px;opacity:.25}
.chi-decor-float{position:absolute;pointer-events:none;z-index:0;opacity:.15;animation:chiFloat 8s ease-in-out infinite}
.chi-decor-float:nth-child(1){top:10%;left:5%;font-size:40px;animation-delay:0s}
.chi-decor-float:nth-child(2){top:30%;right:8%;font-size:28px;animation-delay:2s}
.chi-decor-float:nth-child(3){bottom:20%;left:10%;font-size:32px;animation-delay:4s}
.chi-decor-float:nth-child(4){bottom:15%;right:12%;font-size:36px;animation-delay:6s}
@keyframes chiFloat{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-15px) rotate(5deg)}50%{transform:translateY(-5px) rotate(-3deg)}75%{transform:translateY(-20px) rotate(3deg)}}
.learn-page-decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}

/* 最终页 */
.final-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;text-align:center;padding:30px 40px;position:relative;overflow:hidden}
.final-content::-webkit-scrollbar{width:8px}
.final-content::-webkit-scrollbar-thumb{background:var(--brand);border-radius:4px}
.final-content::-webkit-scrollbar-track{background:transparent;margin:4px 0}
.final-decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.chi-float-final{position:absolute;pointer-events:none;z-index:0;opacity:.12;animation:chiFloat 8s ease-in-out infinite;font-size:36px}
.chi-float-final:nth-child(1){top:8%;left:8%;font-size:44px;animation-delay:0s}
.chi-float-final:nth-child(2){top:20%;right:10%;font-size:32px;animation-delay:2s}
.chi-float-final:nth-child(3){bottom:25%;left:12%;font-size:38px;animation-delay:4s}
.chi-float-final:nth-child(4){bottom:12%;right:15%;font-size:40px;animation-delay:6s}
.final-icon{font-size:72px;animation:finishCelebrate 1s ease-out;position:relative;z-index:1}
.final-title{font-size:24px;font-weight:800;color:var(--text);position:relative;z-index:1;line-height:1.4}
.final-sub{font-size:14px;color:var(--text2);line-height:1.8;max-width:400px;position:relative;z-index:1}
.final-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:50px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .3s;position:relative;z-index:1;box-shadow:0 4px 20px rgba(196,145,106,.35);border:none;font-family:var(--font);letter-spacing:1px}
.final-btn:hover{transform:scale(1.06);box-shadow:0 8px 32px rgba(196,145,106,.5);background:linear-gradient(135deg,var(--brand2),var(--brand))}
.final-btn:active{transform:scale(.98)}
.final-btn-arrow{font-size:22px;transition:transform .3s}
.final-btn:hover .final-btn-arrow{transform:translateX(4px)}

@media(max-width:768px){
  .final-content{padding:20px 24px;gap:16px}
  .final-icon{font-size:56px}
  .final-title{font-size:20px}
  .final-sub{font-size:13px;max-width:320px}
  .final-btn{padding:14px 28px;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  

  <div class="top-bar">
    <div class="demo-badge" id="topBadge">DEMO</div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="page-dots" id="pageDots"></div>
    <button class="api-btn" onclick="openApiModal()">⚙️ API</button>
  </div>

  <div class="main">
    <div class="pages" id="pagesContainer"></div>
    <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>跳过
      <div class="skip-remaining" id="skipRemaining">剩余 7</div>
    </button>
    <div class="bottom-hint" id="bottomHint"><kbd>←→</kbd>切换 <kbd>Enter</kbd>发送 <kbd>🎤</kbd>语音</div>
  </div>
</div>

<div class="api-modal" id="apiModal">
  <div class="api-modal-content">
    <div class="api-modal-header"><h3>配置 DeepSeek API</h3><button class="api-modal-close" onclick="closeApiModal()">✕</button></div>
    <div>
      <label class="api-modal-label">API Key</label>
      <input type="password" class="api-modal-input" id="deepseekApiKeyInput" placeholder="sk-...">
      <div class="api-modal-hint">API Key 仅保存在浏览器本地。<br>去 <a href="https://platform.deepseek.com" target="_blank" style="color:var(--brand);text-decoration:none">platform.deepseek.com</a> 获取免费额度。</div>
      <div class="api-modal-buttons">
        <button class="api-modal-btn api-modal-cancel" onclick="closeApiModal()">取消</button>
        <button class="api-modal-btn api-modal-confirm" onclick="saveApiKey()">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
let DEEPSEEK_API_KEY = localStorage.getItem('deepseek_api_key') || '';

// ===== 各学科课内知识体系 =====
const subjectKnowledge = {
  "物理":{icon:"⚛️",name:"物理",desc:"苹果为什么要往下掉，而不是往上飘？"}
};

// ===== 聊天式教学会话（语文、数学、英语） =====
const chatSessions = {
  "物理":[
    {title:"苹果为什么要往下掉，而不是往上飘？",messages:[
      "哎，你有没有在某个发呆的瞬间，盯着窗外飘落的树叶，突然冒出一个念头——它为什么往下落，而不是往上飘？",
      "你把手掌贴在墙上，使劲推，你的手掌会感觉到压力——那就是墙在推你。",
      "你打篮球的时候，球砸到地上弹起来，那是球推了地面，地面推了球，球就弹起来了。",
      "你坐地铁的时候，列车突然启动，你整个身体往后仰，差点摔个跟头。",
      "这就是牛顿第一定律——物体在没有外力作用的时候，会保持静止或匀速直线运动状态。",
      "你有没有觉得，生活中很多事也是惯性在作怪？",
      "F=ma，这个公式你背过无数遍了，但你真的\"懂\"它吗？",
      "F=ma，它的意思是：力等于质量乘以加速度。",
      "你开车的时候，踩油门就是给车子施加力，车子加速；踩刹车就是给车子施加阻力，车子减速。"
    ]},
    {title:"月亮绕地球转，和你扔石头画出的弧线，背后是同一个道理？",messages:[
      "哎，你有没有扔过石头，看着它划出一道漂亮的弧线，然后扑通掉进水里？",
      "你打篮球的时候，投篮那一下，你的眼睛和手臂是不是在下意识地\"解一道抛物线方程\"？",
      "如果把抛物线再往外推——你扔的石头，初速度足够大，大到什么程度呢？",
      "圆周运动，你拿一根绳子系个小球甩起来，绳子拉得越紧，小球转得越快。",

// ===== DeepSeek 调用 =====
async function callDeepSeek(messages, maxTokens=600) {
  if (!DEEPSEEK_API_KEY) throw new Error('未配置 API Key');
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DEEPSEEK_API_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.7,max_tokens:maxTokens})
    });
    clearTimeout(tid);
    if (!res.ok) throw new Error('API '+res.status);
    const data = await res.json();
    return data.choices[0].message.content.trim();
  } catch(e){clearTimeout(tid);throw e}
}

async function extractKeyword(text) {
  if (!DEEPSEEK_API_KEY) return null;
  try {
    const r = await callDeepSeek([
      {role:'system',content:'从学生回答提取一个2-4字关键词。只回复JSON：{"keyword":"关键词"}'},
      {role:'user',content:'回答: '+text}
    ], 100);
    const m = r.match(/\{[\s\S]*\}/);
    return JSON.parse(m?m[0]:r);
  } catch(e){return null}
}

async function analyzeSubjects() {
  if (!DEEPSEEK_API_KEY) return null;
  const ans = collectedAnswers.filter(a=>a.answer&&a.answer.trim());
  if (!ans.length) return null;
  const qa = ans.map((a,i)=>(i+1)+'. 问：'+a.question+'\n   答：'+a.answer).join('\n\n');
  try {
    const r = await callDeepSeek([
      {role:'system',content:'你是教育评估专家。根据学生回答，分析对3门学科兴趣程度(0-100分)。只回复JSON：{"语文":分,"数学":分,"英语":分,"分析":"50字内分析"}'},
      {role:'user',content:'请分析：\n\n'+qa}
    ], 600);
    const m = r.match(/\{[\s\S]*\}/);
    return JSON.parse(m?m[0]:r);
  } catch(e){console.error('学科分析失败',e);return null}
}

function speakText(text){
  return new Promise(resolve=>{
    if(!synth||!demoStarted){resolve();return;}
    synth.cancel();
    const cleanText=stripEmoji(text);
    if(!cleanText){resolve();return;}
    const u=new SpeechSynthesisUtterance(cleanText);u.lang='zh-CN';u.rate=0.95;u.pitch=1.0;u.volume=1.0;
    if(!cachedVoices.length)loadVoices();
    // 优先使用微软自然语音（神经网络语音），音质远超普通语音
    const naturalVoice=cachedVoices.find(x=>/Xiaoxiao|Yunxi|Xiaoyi|Yunjian|Xiaobei|Xiaoni|Xiaoxuan/i.test(x.name));
    const zhFemale=cachedVoices.find(x=>x.lang.startsWith('zh-CN')&&x.name.includes('Natural'));
    const zhAny=cachedVoices.find(x=>x.lang.startsWith('zh-CN')||x.lang==='zh');
    if(naturalVoice)u.voice=naturalVoice;
    else if(zhFemale)u.voice=zhFemale;
    else if(zhAny)u.voice=zhAny;
    u.onstart=()=>{isSpeaking=true};
    u.onend=()=>{isSpeaking=false;resolve();};
    u.onerror=()=>{isSpeaking=false;resolve();};
    synth.speak(u);
  });
}
function stopSpeaking(){if(synth){synth.cancel();isSpeaking=false}}window.addEventListener('message',function(e){if(e.data&&e.data.action==='stopSpeech')stopSpeaking()});

function toggleVoice(){if(!recognition){showToast('当前浏览器不支持语音识别（请用 Chrome 打开）','error');return}if(isRecording){stopRecording()}else{startRecording()}}
let micPermission=false;
async function requestMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());micPermission=true;return true}catch(e){micPermission=false;return false}}
function startRecording(){
  if(isRecording)return;
  if(!micPermission){requestMic().then(ok=>{if(ok)doStartRecording();else showToast('请在浏览器弹窗中允许麦克风权限','error')});return}
  doStartRecording();
}
function doStartRecording(){
  if(isRecording)return;
  try{recognition.start();isRecording=true;const btn=getActiveVoiceBtn();if(btn){btn.classList.add('recording');btn.textContent='⏹'}showToast('正在聆听…','')}catch(e){isRecording=false;showToast('语音启动失败，请刷新后重试','error')}
}
function stopRecording(){isRecording=false;const btn=getActiveVoiceBtn();if(btn){btn.classList.remove('recording');btn.textContent='🎤'}try{recognition.stop()}catch(e){}}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}setTimeout(()=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'},0)}
function learnHandleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();learnSend()}setTimeout(()=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'},0)}

function updateSendBtn(){const i=getActiveInput(),b=getActiveSendBtn();if(i&&b)b.disabled=!i.value.trim()||isProcessing}
function learnUpdateSendBtn(){const i=getActiveInput(),b=getActiveSendBtn();if(i&&b)b.disabled=!i.value.trim()||learnIsProcessing}

function scrollToBottom(){
  setTimeout(()=>{
    const el=learnMode?document.getElementById('learnChat'):document.getElementById('chat'+currentPage);
    if(el)el.scrollTop=el.scrollHeight;
  },50);
}

function startDemo(){
  demoStarted=true;const w=document.getElementById('welcome');
  if(w){w.classList.add('hide');setTimeout(()=>w.remove(),500)}
  if(TEST_DIRECT_MODE){
    subjectAnalysis={...TEST_SCORES,分析:"测试模式：语文20%，数学90%，英语50%。"};
    startLearning();
    return;
  }
  if(recognition)requestMic();
  const fc=chatHistories[0];if(fc&&fc.length>0)speakText(fc[0].text);
}
function startAutoDemo(){startDemo();autoDemo=true;showToast('自动演示模式已开启 · 按 Esc 停止','success');autoPlayDemo()}

async function autoPlayDemo(){
  if(!autoDemo)return;
  const demoAnswers=[
    ["我想去公园散步，然后回家看一部电影，最后睡个午觉。"],
    ["我喜欢看科普类的视频，比如讲宇宙的、讲动物的。"],
    ["《三体》！看完之后我整个人都恍惚了。"],
    ["我觉得搜索引擎就是，打几个字就能搜到全世界的信息。"],
    ["为什么人会做梦？这个问题我一直很好奇。"],
    ["数学，教的方式太枯燥了，但数学本身真的很美。"],
    ["我想当宇航员！现在……还是想，但觉得不太现实了。"],
    ["我想解释一下「区块链」是什么。"],
    ["我家的台灯坏了，我想过自己修。"],
    ["我觉得冰岛最神奇，有极光有火山有冰川。"],
    ["最怕写到一半不知道写什么，灵感断了。"],
    ["有一次和同学争论一道数学题的解法，我赢了。"],
    ["最近刷到一句话：「故乡的那些人，其实一直在等你回去」，一下子就有点绷不住。"],
    ["如果人生是小说，标题就叫「楼下有棵梧桐树」，第一章写春天的时候我第一次爬上树看整个院子。"],
    ["我推荐「家」这个字。你看它上面是屋顶，下面是猪，就是说有房子住有东西吃就是家。"],
  ];
  for(let i=0;i<total&&autoDemo;i++){
    goToPage(i);await sleep(2000);
    const ans=demoAnswers[i][0];const inp=getActiveInput();
    if(inp){for(let k=0;k<=ans.length&&autoDemo;k++){if(!autoDemo)return;inp.value=ans.substring(0,k);inp.dispatchEvent(new Event('input'));await sleep(30+Math.random()*20)}await sleep(400);sendMessage();await sleep(1200)}
    if(!autoDemo)return;
  }
  if(autoDemo){goToPage(total);showToast('自动演示完成！点击「开始聊天学习」进入学习模式','success')}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function showToast(msg,type){
  const ex=document.querySelector('.toast');if(ex)ex.remove();
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){autoDemo=false;showToast('已停止自动演示','');return}
  if(autoDemo)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();nextPage()}
  if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&currentPage>0){e.preventDefault();goToPage(currentPage-1)}
});

let touchStartY=0;
document.addEventListener('touchstart',e=>{if(e.target.tagName!=='TEXTAREA')touchStartY=e.touches[0].clientY});
document.addEventListener('touchend',e=>{
  if(e.target.tagName==='TEXTAREA'||autoDemo)return;
  const diff=touchStartY-e.changedTouches[0].clientY;
  if(Math.abs(diff)>60){if(diff>0)nextPage();else if(currentPage>0)goToPage(currentPage-1)}
});

loadVoices();
updateSkipBtn();buildPages();goToPage(0);
</script>
<script>setTimeout(function(){startDemo()},300)</script>
