<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 语音对话 · 兴趣探测 + 聊天学习 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafaf9;--surface:#fff;--surface2:#f3f2ed;--brand:#c4916a;--brand2:#6b9b6e;
  --accent:#5a9ec8;--gold:#d4a853;--cyan:#7dd3fc;--green:#86efac;--red:#e57373;
  --text:#3a2a1a;--text2:#8b7355;--text3:#bcaaa4;--radius:20px;--radius2:14px;
  --font:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --rule:rgba(180,140,100,0.25);
  --chi-pink:#f5f0e8;--chi-mint:#e8f0e4;--chi-yellow:#faf5e4;--chi-blue:#e8f0f8;--chi-lavender:#f0eaf5;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.app{width:100%;height:100%;max-width:900px;position:relative;display:flex;flex-direction:column}

.top-bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;padding:0 16px;z-index:100;gap:12px}
.progress-wrap{flex:1;height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s ease;border-radius:2px}
.page-dots{display:flex;gap:5px}
.page-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:all .3s}
.page-dot.active{background:var(--brand);width:20px;border-radius:3px;box-shadow:0 0 8px rgba(196,145,106,.5)}
.demo-badge{font-size:10px;font-weight:800;color:var(--brand2);background:var(--chi-pink);padding:4px 10px;border-radius:20px;letter-spacing:1px;border:1px solid rgba(180,140,100,.2);flex-shrink:0}
.api-btn{display:none}

.api-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.api-modal.show{opacity:1;pointer-events:auto}
.api-modal-content{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);padding:24px;width:100%;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.api-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.api-modal-header h3{font-size:18px;font-weight:700;color:var(--text)}
.api-modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.api-modal-close:hover{color:var(--text);background:var(--chi-pink)}
.api-modal-label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.api-modal-input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid rgba(0,0,0,.08);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.api-modal-input:focus{border-color:var(--brand)}
.api-modal-hint{font-size:12px;color:var(--text3);margin-top:12px;line-height:1.6}
.api-modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.api-modal-btn{padding:8px 20px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)}
.api-modal-cancel{background:transparent;border:1px solid var(--text3);color:var(--text2)}
.api-modal-cancel:hover{background:var(--surface2)}
.api-modal-confirm{background:var(--brand);border:1px solid var(--brand);color:#fff}
.api-modal-confirm:hover{background:var(--brand2)}

.welcome-overlay{position:fixed;inset:0;z-index:200;transition:opacity .5s,transform .5s;background:linear-gradient(135deg,#f5f0e8 0%,#e8f0e4 50%,#e8f0f8 100%);display:flex;align-items:center;justify-content:center}
.welcome-overlay::before{content:'锦寰·树语';position:absolute;top:15%;font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei',serif;font-size:2.5rem;font-weight:700;color:rgba(180,140,100,0.6);letter-spacing:4px}
.welcome-overlay::after{content:'点击下方按钮，开始你的探索之旅';position:absolute;top:calc(15% + 3.5rem);font-size:0.95rem;color:var(--text2);letter-spacing:1px}
.welcome-overlay .welcome-hotspot{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:200px;height:56px;cursor:pointer;z-index:1}
.welcome-overlay.hide{opacity:0;transform:scale(1.05);pointer-events:none}

.main{flex:1;display:flex;position:relative;overflow:hidden;margin-top:48px}
.pages{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
.page.active{opacity:1;transform:translateY(0);pointer-events:auto}
.page-header{padding:16px 90px 0 20px;flex-shrink:0}
.page-number{font-size:11px;font-weight:700;color:var(--brand2);letter-spacing:1.5px}
.page-question{font-size:20px;font-weight:700;line-height:1.4;color:var(--text);margin-top:4px}
.chat-area{flex:1;overflow-y:auto;padding:12px 20px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-thumb{background:var(--surface);border-radius:2px}
.msg{display:flex;gap:8px;max-width:90%;animation:msgIn .3s ease}
.msg.ai{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg.ai .msg-avatar{background:var(--brand)}
.msg.user .msg-avatar{background:var(--accent)}
.msg-bubble{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;color:var(--text)}
.msg.ai .msg-bubble{border-top-left-radius:3px}
.msg.user .msg-bubble{background:var(--brand);border-top-right-radius:3px;color:#fff}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 16px 16px;background:var(--bg);border-top:1px solid rgba(0,0,0,.04);flex-shrink:0}
.input-text{flex:1;background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius2);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--font);line-height:1.5;resize:none;outline:none;max-height:100px;transition:border-color .3s}
.input-text:focus{border-color:var(--brand)}
.input-text::placeholder{color:var(--text3);font-size:13px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;background:var(--surface);color:var(--text2)}
.btn-icon:hover{background:var(--surface2);transform:scale(1.05)}
.btn-send{background:var(--brand);color:#fff}
.btn-send:hover{background:var(--brand2)}
.btn-send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-voice.recording{background:var(--red);color:#fff;animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(196,145,106,.4)}50%{box-shadow:0 0 0 10px rgba(196,145,106,0)}}
.skip-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:58px;height:56px;border-radius:10px;background:var(--surface);border:1px solid rgba(0,0,0,.06);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .3s;z-index:50;font-family:var(--font)}
.skip-btn:hover{background:var(--surface2);border-color:var(--brand);color:var(--brand2);transform:translateY(-50%) scale(1.05);box-shadow:0 0 14px rgba(196,145,106,.15)}
.skip-btn:disabled,.skip-btn.disabled{opacity:.35;cursor:not-allowed;transform:translateY(-50%);background:var(--surface);border-color:rgba(0,0,0,.04);color:var(--text3)}
.skip-btn:disabled:hover,.skip-btn.disabled:hover{background:var(--surface);border-color:rgba(0,0,0,.04);color:var(--text3);box-shadow:none}
.skip-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.skip-remaining{font-size:9px;color:var(--cyan);margin-top:1px;line-height:1}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:8px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 2.5s forwards;pointer-events:none}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.bottom-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);z-index:50;pointer-events:none;display:flex;align-items:center;gap:6px}
.bottom-hint kbd{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:4px;padding:1px 6px;font-size:10px;font-family:var(--font);color:var(--text2)}

/* 学习模式 */
.learn-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.learn-header::-webkit-scrollbar{display:none}
.learn-subject-tag{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.06);background:var(--surface);color:var(--text2);transition:all .2s;white-space:nowrap}
.learn-subject-tag:hover{background:var(--surface2);color:var(--text)}
.learn-subject-tag.active{background:var(--chi-pink);border-color:var(--brand);color:var(--brand2)}
.learn-subject-tag .score{font-size:10px;margin-left:4px;opacity:.7}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;font-weight:700;margin-right:3px;flex-shrink:0}
.learn-chat{flex:1;overflow-y:auto;padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.learn-chat::-webkit-scrollbar{width:3px}
.learn-chat::-webkit-scrollbar-thumb{background:var(--surface);border-radius:2px}
.learn-input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 16px 16px;border-top:1px solid rgba(0,0,0,.04);flex-shrink:0}
.learn-msg-system{text-align:center;font-size:12px;color:var(--text3);padding:8px 0}
.learn-msg-system span{background:var(--surface);border-radius:12px;padding:4px 12px}
.learn-topic-hint{background:var(--surface);border:1px solid rgba(248,164,192,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:4px}
.learn-topic-hint strong{color:var(--brand2)}
.learn-back-btn{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:var(--surface);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:50;transition:all .2s}
.learn-back-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--brand)}

.finish-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:30px 40px;overflow-y:auto}
.finish-content::-webkit-scrollbar{width:3px}
.finish-content::-webkit-scrollbar-thumb{background:var(--surface);border-radius:2px}
.finish-icon{font-size:64px;animation:finishCelebrate 1s ease-out}
@keyframes finishCelebrate{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.finish-title{font-size:24px;font-weight:800}
.finish-sub{font-size:14px;color:var(--text2);line-height:1.7;max-width:380px}
.finish-btn{padding:12px 32px;border-radius:50px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .3s;font-family:var(--font);flex-shrink:0}
.finish-btn:hover{background:var(--brand2);transform:scale(1.05)}
.finish-btn.outline{background:transparent;border:1px solid var(--brand);color:var(--brand2)}
.finish-btn.outline:hover{background:var(--chi-pink)}
.finish-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

@media(max-width:768px){
  .page-header{padding:12px 70px 0 14px}.page-question{font-size:17px}
  .chat-area{padding:8px 10px 4px}.msg{max-width:94%}
  .input-bar{padding:6px 10px 12px;gap:6px}
  .skip-btn{right:4px;width:48px;height:48px;font-size:10px;border-radius:8px}
  .welcome-title{font-size:22px}.welcome-features{gap:16px}.top-bar{padding:0 10px}
  .finish-content{padding:20px 16px}
  .learn-header{padding:8px 10px;gap:6px}
  .learn-subject-tag{padding:5px 10px;font-size:11px}
  .learn-chat{padding:8px 10px 4px}
}

/* 吉伊卡哇风格装饰 - 已移除 */
.epilogue-page{background:var(--surface2);border-radius:16px;padding:18px 20px;font-size:14px;line-height:1.8;color:var(--text);border:1px solid var(--rule);position:relative;overflow:hidden}
.learn-page-decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.final-decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.chi-float-final{display:none}

/* 最终页 */
.final-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;text-align:center;padding:30px 40px;position:relative;overflow:hidden}
.final-content::-webkit-scrollbar{width:3px}
.final-content::-webkit-scrollbar-thumb{background:var(--surface);border-radius:2px}
.final-icon{font-size:72px;animation:finishCelebrate 1s ease-out;position:relative;z-index:1}
.final-title{font-size:24px;font-weight:800;color:var(--text);position:relative;z-index:1;line-height:1.4}
.final-sub{font-size:14px;color:var(--text2);line-height:1.8;max-width:400px;position:relative;z-index:1}
.final-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:50px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .3s;position:relative;z-index:1;box-shadow:0 4px 20px rgba(248,164,192,.35);border:none;font-family:var(--font);letter-spacing:1px}
.final-btn:hover{transform:scale(1.06);box-shadow:0 8px 32px rgba(248,164,192,.5);background:linear-gradient(135deg,var(--brand2),var(--brand))}
.final-btn:active{transform:scale(.98)}
.final-btn-arrow{font-size:22px;transition:transform .3s}
.final-btn:hover .final-btn-arrow{transform:translateX(4px)}

@media(max-width:768px){
  .final-content{padding:20px 24px;gap:16px}
  .final-icon{font-size:56px}
  .final-title{font-size:20px}
  .final-sub{font-size:13px;max-width:320px}
  .final-btn{padding:14px 28px;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="welcome-overlay" id="welcome"><div class="welcome-hotspot" onclick="startDemo()"></div></div>

  <div class="top-bar">
    <div class="demo-badge" id="topBadge">DEMO</div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="page-dots" id="pageDots"></div>
    <button class="api-btn" onclick="openApiModal()">⚙️ API</button>
  </div>

  <div class="main">
    <div class="pages" id="pagesContainer"></div>
    <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>跳过
      <div class="skip-remaining" id="skipRemaining">剩余 7</div>
    </button>
    <div class="bottom-hint" id="bottomHint"><kbd>←→</kbd>切换 <kbd>Enter</kbd>发送 <kbd>🎤</kbd>语音</div>
  </div>
</div>

<div class="api-modal" id="apiModal">
  <div class="api-modal-content">
    <div class="api-modal-header"><h3>配置 DeepSeek API</h3><button class="api-modal-close" onclick="closeApiModal()">✕</button></div>
    <div>
      <label class="api-modal-label">API Key</label>
      <input type="password" class="api-modal-input" id="deepseekApiKeyInput" placeholder="sk-...">
      <div class="api-modal-hint">API Key 仅保存在浏览器本地。<br>去 <a href="https://platform.deepseek.com" target="_blank" style="color:var(--brand);text-decoration:none">platform.deepseek.com</a> 获取免费额度。</div>
      <div class="api-modal-buttons">
        <button class="api-modal-btn api-modal-cancel" onclick="closeApiModal()">取消</button>
        <button class="api-modal-btn api-modal-confirm" onclick="saveApiKey()">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
let DEEPSEEK_API_KEY = localStorage.getItem('deepseek_api_key') || '';

// ===== 各学科课内知识体系 =====
const subjectKnowledge = {
  "语文":{icon:"📖",color:"#f472b6",topics:["现代文阅读","文言文阅读","古诗词鉴赏","作文写作","基础知识","名著阅读","口语交际与综合性学习"],hasChats:true},
  "数学":{icon:"🔢",color:"#4ade80",topics:["数与代数","图形与几何","统计与概率","函数","数学思想方法"],hasChats:true},
  "英语":{icon:"🌐",color:"#22d3ee",topics:["词汇积累","语法体系","阅读理解","完形填空","书面表达","听力口语"],hasChats:true},
  "物理":{icon:"⚡",color:"#fbbf24",topics:["力学基础","电学","光学","热学","声现象","运动和力"],hasChats:true},
  "化学":{icon:"🧪",color:"#a78bfa",topics:["物质构成","化学变化","溶液","酸碱盐","金属","空气与水"],hasChats:true},
  "生物":{icon:"🧬",color:"#34d399",topics:["细胞与生命","遗传与变异","生态系统","人体健康","植物","微生物"],hasChats:true},
  "历史":{icon:"🏛️",color:"#f97316",topics:["中国古代史","中国近现代史","世界古代史","世界近现代史","文明交流","历史人物"],hasChats:true},
  "地理":{icon:"🌍",color:"#06b6d4",topics:["地球与地图","气候与天气","地形地貌","人口与城市","资源与环境","区域地理"],hasChats:true},
  "政治":{icon:"⚖️",color:"#ef4444",topics:["道德与法治","宪法与公民","经济常识","政治制度","国际关系","社会热点"],hasChats:true}
};

// ===== 聊天式教学会话（语文、数学、英语） =====
const chatSessions = {
  "语文":[
    {title:"第一聊：写事怎么才能不写成流水账？",messages:[
      "哎，你有没有觉得特别奇怪，咱们平时跟朋友唠嗑，讲一件好玩的事儿能讲得眉飞色舞，朋友听得哈哈笑。可为啥一坐到书桌前，要把它写成作文，脑子就瞬间死机了呢？是不是心里老有个声音在嘀咕「要正式、要有深度」给闹的？",
      "你写一件事，有没有刻意去憋一个「中心思想」或者「要升华一下」？是不是觉得不写点大道理，作文就不算好？其实真情实感比喊口号动人多了，你觉得呢？",
      "你有没有写过那种「流水账」？就是「早上我起床了，然后我刷牙了，然后我吃饭了」。你觉得这种文章，最缺的是什么呢？是细节？是感受？还是对事情轻重缓急的取舍？"
    ]},
    {title:"第二聊：读文章，到底在读什么？",messages:[
      "看一篇记叙文，你除了看它「讲了什么故事」，有没有想过问一句：作者为什么要给我讲这个故事？他到底想让我笑、让我哭、还是让我想点啥？这个「为什么」，是不是比故事本身更重要？",
      "看散文，就像看一个人在自己跟自己聊天。你读的时候，有没有觉得作者好像就坐在你对面，跟你讲他那些琐碎但真实的小心思？这种「偷听」的感觉，是不是比什么都新鲜？",
      "看议论文，你就把自己想象成一个辩论赛评委。台上那个辩手最想让你接受的一个观点是什么？为了让你服气，他是搬出了名人名言压你，还是甩出了一堆铁一般的事实？"

// ===== DeepSeek 调用 =====
async function callDeepSeek(messages, maxTokens=600) {
  if (!DEEPSEEK_API_KEY) throw new Error('未配置 API Key');
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DEEPSEEK_API_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.7,max_tokens:maxTokens})
    });
    clearTimeout(tid);
    if (!res.ok) throw new Error('API '+res.status);
    const data = await res.json();
    return data.choices[0].message.content.trim();
  } catch(e){clearTimeout(tid);throw e}
}

async function extractKeyword(text) {
  if (!DEEPSEEK_API_KEY) return null;
  try {
    const r = await callDeepSeek([
      {role:'system',content:'从学生回答提取一个2-4字关键词。只回复JSON：{"keyword":"关键词"}'},
      {role:'user',content:'回答: '+text}
    ], 100);
    const m = r.match(/\{[\s\S]*\}/);
    return JSON.parse(m?m[0]:r);
  } catch(e){return null}
}

async function analyzeSubjects() {
  if (!DEEPSEEK_API_KEY) return null;
  const ans = collectedAnswers.filter(a=>a.answer&&a.answer.trim());
  if (!ans.length) return null;
  const qa = ans.map((a,i)=>(i+1)+'. 问：'+a.question+'\n   答：'+a.answer).join('\n\n');
  try {
    const r = await callDeepSeek([
      {role:'system',content:'你是教育评估专家。根据学生回答，分析对9门学科兴趣程度(0-100分)。只回复JSON：{"语文":分,"数学":分,"英语":分,"物理":分,"化学":分,"生物":分,"历史":分,"地理":分,"政治":分,"分析":"50字内分析"}'},
      {role:'user',content:'请分析：\n\n'+qa}
    ], 600);
    const m = r.match(/\{[\s\S]*\}/);
    return JSON.parse(m?m[0]:r);
  } catch(e){console.error('学科分析失败',e);return null}
}

    化学: ['化学','元素','原子','分子','反应','物质','氧气','氢气','燃烧','酸','碱','盐','溶液','金属','气体','化合','分解'],
    生物: ['生物','细胞','基因','DNA','遗传','进化','生态','植物','动物','人体','器官','细菌','病毒','繁殖','光合','呼吸','生命'],
    历史: ['历史','古代','现代','朝代','战争','革命','皇帝','文明','帝国','改革','发明','传统','秦','汉','唐','宋','明清','文革'],
    地理: ['地理','地球','地图','气候','天气','地形','河流','海洋','沙漠','城市','人口','资源','环境','污染','火山','地震','经纬'],
    政治: ['法律','权利','义务','公平','正义','宪法','公民','国家','政府','制度','民主','自由','平等','规则','社会','道德','法治']
  };
  var answers = collectedAnswers || [];
  answers.forEach(function(a) {
    var text = (a.answer || '');
    var lower = text.toLowerCase();
    for (var subj in subjectWords) {
      subjectWords[subj].forEach(function(w) {
        if (lower.indexOf(w) !== -1) scores[subj] += 4;
      });
    }
  });

  // ── 乱码检测（必须在投入度分析之前，避免乱码获取得分）──
  function isNoise(text) {
    if (!text || text.length === 0) return true;
    var t = text.trim();
    if (t.length === 0) return true;
    if (/^(.)\1{3,}$/.test(t)) return true;
    if (/^\d+$/.test(t)) return true;
    if (/^[a-zA-Z]+$/.test(t) && t.length > 3 && !/[aeiouAEIOU]/.test(t)) return true;
    var keyboardRows = ['qwertyuiop','asdfghjkl','zxcvbnm','1234567890'];
    var lower = t.toLowerCase();
    for (var r = 0; r < keyboardRows.length; r++) {
      for (var i = 0; i <= keyboardRows[r].length - 3; i++) {
        var seq = keyboardRows[r].substring(i, i + 3);
        if (lower.indexOf(seq) !== -1) return true;
      }
    }
    if (/^[^\w\u4e00-\u9fff]+$/.test(t) && t.length > 2) return true;
    if (/[\u4e00-\u9fff]/.test(t)) return false;
    if (/^[a-zA-Z]{7,}$/.test(t)) return true;
    return false;
  }

  var noiseCount = 0;
  answers.forEach(function(a) {
    if (isNoise(a.answer || '')) noiseCount++;
  });
  if (noiseCount >= 3) {
    for (var s in scores) scores[s] = 38;
  } else if (noiseCount >= 1) {
    for (var s in scores) scores[s] -= noiseCount * 3;
  }

  // ── 回答投入度分析（仅对非乱码回答生效）──
  var qWeights = [
    {语文:4,数学:1,英语:2,物理:0,化学:0,生物:2,历史:1,地理:1,政治:0},
    {语文:1,数学:6,英语:0,物理:3,化学:1,生物:0,历史:0,地理:0,政治:0},
    {语文:3,数学:4,英语:3,物理:4,化学:4,生物:4,历史:3,地理:3,政治:2},
    {语文:4,数学:5,英语:2,物理:4,化学:3,生物:3,历史:2,地理:2,政治:1},
    {语文:6,数学:0,英语:4,物理:0,化学:0,生物:0,历史:2,地理:0,政治:2}
  ];
  answers.forEach(function(a, i) {
    if (isNoise(a.answer || '')) return;
    var len = (a.answer || '').length;
    if (len >= 5) {
      var w = qWeights[i] || {语文:2,数学:2,英语:2,物理:1,化学:1,生物:1,历史:1,地理:1,政治:1};
      var bonus = Math.min(len / 10, 5);
      for (var s in scores) { scores[s] += Math.round((w[s]||0) * bonus / 4); }
    }
  });

  // ── 回答多样性：如果5个回答各不相同，说明用户认真思考，加分 ──
  var uniqueAnswers = {};
  var totalAnswerLen = 0;
  answers.forEach(function(a) {
    uniqueAnswers[(a.answer||'').trim()] = true;
    totalAnswerLen += (a.answer||'').length;
  });
  var diversity = Object.keys(uniqueAnswers).length;
  if (diversity >= 4) { for (var s in scores) scores[s] += 3; }
  if (diversity === 1) { for (var s in scores) scores[s] = 38; }
  else if (diversity === 2) { for (var s in scores) scores[s] -= 4; }
  if (totalAnswerLen < 15) { for (var s in scores) scores[s] -= 5; }

  // ── 基于回答内容的哈希种子，确保相同输入得相同结果，不同输入结果不同 ──
  var hash = 0;
  answers.forEach(function(a) {
    var s = (a.answer || '');
    for (var j = 0; j < s.length; j++) { hash = ((hash << 5) - hash) + s.charCodeAt(j); hash |= 0; }
  });
  var seed1 = Math.abs(hash % 7);
  var seed2 = Math.abs((hash >> 3) % 7);
  var seed3 = Math.abs((hash >> 6) % 7);
  var seed4 = Math.abs((hash >> 9) % 7);
  var seed5 = Math.abs((hash >> 12) % 7);
  var seed6 = Math.abs((hash >> 15) % 7);
  var seed7 = Math.abs((hash >> 18) % 7);
  var seed8 = Math.abs((hash >> 21) % 7);
  var seed9 = Math.abs((hash >> 24) % 7);

  var seeds = [seed1,seed2,seed3,seed4,seed5,seed6,seed7,seed8,seed9];
  var idx = 0;
  for (var s in scores) {
    scores[s] = Math.max(25, Math.min(95, Math.round(scores[s] + seeds[idx] - 3)));
    idx++;
  }

  // 生成分析文字
  var sorted = Object.keys(scores).sort(function(a,b){return scores[b]-scores[a]});
  var analysis = '从你的回答来看，你对'+sorted[0]+'的兴趣最突出，'+sorted[1]+'次之，'+sorted[2]+'也可以多聊聊。';
  scores.分析 = analysis;
  return scores;
}

function goToPage(index){
  if(index<0||index>total+2||(isProcessing&&index!==currentPage)) return;
  if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null}
  stopSpeaking();
  const oldPage=document.getElementById(currentPage<total?'page'+currentPage:currentPage===total+1?'learnPage':'pageFinal');
  const oldDot=document.getElementById(currentPage<total?'dot'+currentPage:null);
  if(oldPage)oldPage.classList.remove('active');
  if(oldDot)oldDot.classList.remove('active');
  const skipBtn=document.getElementById('skipBtn'),hint=document.getElementById('bottomHint');
  if(index<total){
    document.getElementById('page'+index).classList.add('active');
    document.getElementById('dot'+index).classList.add('active');
    skipBtn.style.display='flex';hint.style.display='flex';
    learnMode=false;
    if(!chatHistories[index]){chatHistories[index]=[];setTimeout(()=>aiGreet(index),400)}
    const inp=getActiveInput();if(inp){inp.value='';inp.style.height='auto';inp.focus()}
    updateSendBtn();updateSkipBtn();
    document.getElementById('topBadge').textContent='探测';
  }else if(index===total){
    // 完成页已废除，直接跳到学习模式
    skipBtn.style.display='none';hint.style.display='none';
    document.getElementById('learnPage').classList.add('active');
    learnMode=true;
    document.getElementById('topBadge').textContent='学习';
    if(!learnSubject) initLearnMode();
    else renderLearnUI();
    window._saveProgress && window._saveProgress();
  }else if(index===total+1){
    // 学习模式
    document.getElementById('learnPage').classList.add('active');
    skipBtn.style.display='none';hint.style.display='none';
    learnMode=true;
    document.getElementById('topBadge').textContent='学习';
    if(!learnSubject) initLearnMode();
    else renderLearnUI();
    window._saveProgress && window._saveProgress();
  }else{
    // 最终页
    document.getElementById('pageFinal').classList.add('active');
    skipBtn.style.display='none';hint.style.display='none';
    learnMode=false;
    document.getElementById('topBadge').textContent='完成';
  }
  currentPage=index;updateProgress();scrollToBottom();
}

function skipQuestion(){
  if(isProcessing)return;
  if(skipCount>=maxSkips){showToast('跳过次数已用完（最多2次）','error');return}
  skipCount++;updateSkipBtn();showToast('已跳过 '+skipCount+'/'+maxSkips,'');
  collectedAnswers.push({question:questions[currentPage].text,answer:'',keyword:'已跳过'});
  var wasLast = (currentPage === total - 1);
  goToPage(currentPage+1);
  // Auto-transition to learning only if the LAST question was skipped
  if (wasLast) {
    setTimeout(async() => {
      if(DEEPSEEK_API_KEY){try{subjectAnalysis=await analyzeSubjects()}catch(e){}}
      if(!subjectAnalysis)subjectAnalysis=getFallbackSubjects();
      startLearning();
    }, 500);
  }
}
function updateSkipBtn(){
  const r=maxSkips-skipCount,el=document.getElementById('skipRemaining'),btn=document.getElementById('skipBtn');
  if(el)el.textContent='剩余 '+r;
  if(btn&&r<=0){btn.disabled=true;btn.classList.add('disabled')}
  else if(btn){btn.disabled=false;btn.classList.remove('disabled')}
}

  if(!kw){const fk=['休闲生活','思维洞察','好奇心','学科兴趣','表达能力'][currentPage]||'';kw=fk;if(fk)collectedKeywords.push(fk)}

  if (currentPage === total - 1) {

    autoAdvanceTimer=setTimeout(async()=>{autoAdvanceTimer=null;

  } else {

  }
}

async function sendNextChatMsg(){
  if(learnIsProcessing)return;
  const sessions=chatSessions[learnSubject];
  if(currentChatSession>=sessions.length){
    completedChatSubjects.add(learnSubject);
    window._saveProgress && window._saveProgress();
    if(completedChatSubjects.size>=chatSubjectOrder.length){
      addLearnMsg('ai','🎉 太棒了！所有学科都聊完了。');
      learnChatHistory.push({role:'ai',text:'epilogue-start'});
      await speakText('太棒了，所有学科都聊完了！');
      setTimeout(()=>showEpilogue(),2000);
      return;
    }
    addLearnMsg('ai','🎉 太棒了！'+learnSubject+'的这几个话题咱都聊完了。');
    learnChatHistory.push({role:'ai',text:'done'});
    await speakText('太棒了，聊完了！');
    setTimeout(()=>autoAdvanceChatSubject(),2000);
    return;
  }
  const session=sessions[currentChatSession];
  if(currentChatMsg>=session.messages.length){
    currentChatSession++;currentChatMsg=0;
    if(currentChatSession>=sessions.length){
      completedChatSubjects.add(learnSubject);
      window._saveProgress && window._saveProgress();
      if(completedChatSubjects.size>=chatSubjectOrder.length){
        addLearnMsg('ai','🎉 太棒了！所有学科都聊完了。');
        learnChatHistory.push({role:'ai',text:'epilogue-start'});
        await speakText('太棒了，所有学科都聊完了！');
        setTimeout(()=>showEpilogue(),2000);
        return;
      }
      addLearnMsg('ai','🎉 太棒了！'+learnSubject+'的这几个话题咱都聊完了。');
      learnChatHistory.push({role:'ai',text:'done'});
      await speakText('太棒了，聊完了！');
      setTimeout(()=>autoAdvanceChatSubject(),2000);
      return;
    }
    const nextSession=sessions[currentChatSession];
    const trans='好，我们换个话题聊聊。\n\n📌 '+nextSession.title+'\n\n——';
    addLearnMsg('ai',trans);
    learnChatHistory.push({role:'ai',text:trans});
    await speakText('换个话题，'+nextSession.title);
    setTimeout(()=>sendNextChatMsg(),1000);
    return;
  }
  const msg=session.messages[currentChatMsg];
  addLearnMsg('ai',msg);
  learnChatHistory.push({role:'ai',text:msg});
  await speakText(msg);
  currentChatMsg++;
}

function showEpilogue(){
  let i=0;
  async function next(){
    if(i>=epilogueMessages.length){
      setTimeout(()=>goToPage(total+2),2000);
      return;
    }
    const msg=epilogueMessages[i];
    const decorated='<div class="epilogue-page">'+msg+'</div>';
    addLearnMsg('ai',decorated,true);
    learnChatHistory.push({role:'ai',text:msg});
    await speakText(msg);
    i++;
    if(i<=epilogueMessages.length)setTimeout(next,800);
  }
  next();
}

function renderLearnUI(){
  const header=document.getElementById('learnHeader');
  // 3个学科按兴趣优先级排序
  const sorted=chatSubjectOrder.filter(s=>subjectKnowledge[s]);
  header.innerHTML=sorted.map(s=>{
    const info=subjectKnowledge[s];
    const score=subjectAnalysis[s]||0;
    const active=learnSubject===s?' active':'';
    const done=completedChatSubjects.has(s)?' ✓':'';
    const priority=chatSubjectOrder.indexOf(s)+1;
    const badge='<span class="pri-badge">'+priority+'</span>';
    return '<div class="learn-subject-tag'+active+'" onclick="switchSubject(\''+s+'\')" style="border-color:'+info.color+'44">'+badge+info.icon+' '+s+'<span class="score">'+score+done+'</span></div>';
  }).join('');
  document.getElementById('learnChat').innerHTML='';
}

function switchSubject(subj){
  if(learnIsProcessing)return;
  learnSubject=subj;
  learnChatHistory=[];
  learnTopicIndex={};
  currentChatSession=0;currentChatMsg=0;
  // 不重置 completedChatSubjects，让它累积
  renderLearnUI();
  const info=subjectKnowledge[subj];
  const sessions=chatSessions[subj];
  const pre='好，我们换到 '+info.icon+' '+subj+'！\n\n📌 '+sessions[0].title+'\n\n——';
  addLearnMsg('ai',pre);
  learnChatHistory.push({role:'ai',text:pre});
  speakText('我们换到'+subj);
  setTimeout(()=>sendNextChatMsg(),1500);
}

async function generateTeacherMsg(){
  if(learnIsProcessing)return;
  learnIsProcessing=true;
  const info=subjectKnowledge[learnSubject];
  const score=subjectAnalysis[learnSubject]||50;
  // 根据兴趣度调整内容深度：高分=更深入，低分=更基础
  const depth=score>=75?'可以讲得稍微深入一点，用有趣的例子':score>=50?'用通俗易懂的大白话，多举生活中的例子':'用最简单的话，从最基础的概念开始，多鼓励';
  const keywords=collectedKeywords.slice(-5).join('、');
  const answered=collectedAnswers.filter(a=>a.answer&&a.answer.trim()).slice(-5).map(a=>a.answer).join('；');
  const topicList=info.topics.join('\n');
  const history=learnChatHistory.slice(-6).map(m=>m.role+'：'+m.text).join('\n');
  if(DEEPSEEK_API_KEY){
    try{
      const teacherMsg=await callDeepSeek([
        {role:'system',content:'你是'+learnSubject+'老师，正在用聊天的方式教学生。'+
          '本学科课内知识体系：\n'+topicList+'\n\n'+
          '教学要求：\n1. 每次只讲一个知识点，用大白话，像聊天一样自然\n2. '+depth+'\n3. 学生兴趣关键词：'+keywords+'，学生之前的回答：'+answered+'\n4. 结合学生的兴趣点来切入知识，让学习变得有趣\n5. 讲完后问一个开放式问题，引导学生思考和回答\n6. 不要用"同学""我们接下来学"这种正式语气，用"你""我觉得""你知道吗"这种聊天语气\n7. 内容控制在100-200字，不要太长'},
        {role:'user',content:'最近聊了：\n'+history+'\n\n请继续教学，用大白话聊天方式讲一个知识点并提问。'}
      ], 500);
      addLearnMsg('ai',teacherMsg);
      learnChatHistory.push({role:'ai',text:teacherMsg});
      speakText(teacherMsg);
    }catch(e){
      console.error('教学生成失败',e);
      fallbackTeacherMsg();
    }
  }else{
    fallbackTeacherMsg();
  }
  learnIsProcessing=false;
  scrollToBottom();
}

function fallbackTeacherMsg(){
  const info=subjectKnowledge[learnSubject];
  if(!learnTopicIndex[learnSubject])learnTopicIndex[learnSubject]=0;
  const ti=learnTopicIndex[learnSubject];
  const topic=info.topics[ti%info.topics.length];
  const msg='你知道吗？'+topic+'。\n\n我觉得这个特别有意思，因为它跟日常生活联系很紧密。你平时有没有注意到过类似的现象？';
  addLearnMsg('ai',msg);
  learnChatHistory.push({role:'ai',text:msg});
  learnTopicIndex[learnSubject]=ti+1;
  speakText(msg);
  learnIsProcessing=false;
  scrollToBottom();
}

function getFallbackAck(userText, subject){
  const len=userText.length;
  const short=len<10;
  const long=len>40;
  const responses={
    "语文":short?['嗯，简短有力！','说得好，有感觉。','不错，就是这个意思！']:long?['说得挺详细，有自己的思考在里面。','嗯，你观察得很仔细，语文就是这样，越琢磨越有味道。','能说这么多，说明你真的在认真感受，很好！']:['嗯，这个角度挺有意思的。','说得不错，有画面感。','我get到你的意思了，挺有想法的。'],
    "数学":short?['对，简洁明了！','没错，数学就是要抓住关键。','一针见血！']:long?['分析得很细致，逻辑在脑子里转得很清楚。','嗯，你能把思路展开说，说明真的理解了。','说得很透彻，一步步推下来很清晰。']:['嗯，这个思路是对的。','你这样想很合理。','不错，数学就是要多想多试。'],
    "英语":short?['对，简单直接！','Good！就是这个意思。','嗯，说到点子上了。']:long?['说得很好，语言组织能力在进步。','嗯，能这样表达说明你的英语思维在形成。','很不错，敢于多说多练就是最好的学习方式。']:['嗯，表达得不错。','有进步，继续加油！','这个理解很到位。']
  };
  const pool=responses[subject]||responses['语文'];
  const idx=Math.floor(Math.random()*pool.length);
  return pool[idx];
}

// ── 探测阶段：AI个性化回复 ──
async function generateProbeReply(userText, questionText) {
  if (!DEEPSEEK_API_KEY) return '';
  const r = await callDeepSeek([
    {role:'system',content:'你是一个友好、鼓励型的AI助手，正在和中小学生聊天了解他们的兴趣。'+
      '回复要求：1. 1-2句话，不超过50字 2. 先肯定学生的回答，再简短追问或延伸 3. 语气自然亲切，像朋友聊天 4. 不要用"同学""你很棒"这种正式/评价语气，用"我懂""有意思""我也觉得"这种'},
    {role:'user',content:'我在问学生："'+questionText+'"，学生回答："'+userText+'"。请给学生一个简短、亲切的回应。'}
  ], 200);
  return r;
}

function getProbeAck(userText) {
  var len = userText.length;
  var short = len < 10, long = len > 50;
  var pool = short
    ? ['嗯，有意思！','我懂了，谢谢分享~','简短有力！','不错，继续~']
    : long
    ? ['说得挺详细的，我认真看完了。','哇，你思考了很多呢！','能说这么多，说明你真的在想这个问题。']
    : ['嗯，这个角度挺有意思的。','我get到你的意思了。','说得不错，有想法。'];
  return pool[Math.floor(Math.random() * pool.length)];
}

async function learnSend(){
  if(learnIsProcessing)return;
  const inp=getActiveInput();if(!inp)return;const text=inp.value.trim();if(!text)return;
  addLearnMsg('user',text);learnChatHistory.push({role:'user',text});
  inp.value='';inp.style.height='auto';learnUpdateSendBtn();
  learnIsProcessing=true;
  if(DEEPSEEK_API_KEY){
    let apiOk=false;
    try{
      const history=learnChatHistory.slice(-4).map(m=>m.role+'：'+m.text).join('\n');
      const reply=await callDeepSeek([
        {role:'system',content:'你是'+learnSubject+'老师，正在用大白话和学生聊天。你刚问了一个问题，学生回答了。请用1-2句简短回应（肯定/鼓励/共鸣），不要提问，不要长篇大论。语气像朋友聊天。'},
        {role:'user',content:'对话：\n'+history+'\n\n请简短回应学生（30字以内），不要提问。'}
      ], 150);
      if(reply&&reply.trim()){
        const short=reply.trim().substring(0,80);
        addLearnMsg('ai',short);
        learnChatHistory.push({role:'ai',text:short});
        await speakText(short);
        apiOk=true;
      }
    }catch(e){console.error('DeepSeek回应失败，使用本地回退',e)}
    if(!apiOk){
      const ack=getFallbackAck(text,learnSubject);
      addLearnMsg('ai',ack);
      learnChatHistory.push({role:'ai',text:ack});
      await speakText(ack);
    }
  }else{
    const ack=getFallbackAck(text,learnSubject);
    addLearnMsg('ai',ack);
    learnChatHistory.push({role:'ai',text:ack});
    await speakText(ack);
  }
  learnIsProcessing=false;
  setTimeout(()=>sendNextChatMsg(),600);
  scrollToBottom();
}

function getTopSubjects(n){
  if(!subjectAnalysis) subjectAnalysis = getFallbackSubjects();
  return Object.keys(subjectKnowledge).sort((a,b)=>(subjectAnalysis[b]||0)-(subjectAnalysis[a]||0)).slice(0,n);
}

function addMessage(pageIdx,role,text){

function stripEmoji(text){
  return text.replace(/[\u{1F600}-\u{1FAFF}\u{2600}-\u{27FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}\u{00A9}\u{00AE}\u{2122}\u{2139}\u{3030}\u{303D}\u{3297}\u{3299}]/gu,'').trim();
}
let cachedVoices=[];
function loadVoices(){
  if(!synth)return;
  cachedVoices=synth.getVoices();
  if(!cachedVoices.length){synth.onvoiceschanged=()=>{cachedVoices=synth.getVoices()};synth.getVoices()}
}
function speakText(text){
  return new Promise(resolve=>{
    if(!synth||!demoStarted){resolve();return;}
    synth.cancel();
    const cleanText=stripEmoji(text);
    if(!cleanText){resolve();return;}
    const u=new SpeechSynthesisUtterance(cleanText);u.lang='zh-CN';u.rate=1.0;u.pitch=1.0;u.volume=0.9;
    if(!cachedVoices.length)loadVoices();
    const cuteVoice=cachedVoices.find(x=>/Xiaoxiao|Yunxi|Xiaoyi|Tingting|Yaoyao|Hanhan|Kangkang/i.test(x.name));
    const zhFemale=cachedVoices.find(x=>x.lang.startsWith('zh')&&/female|女|girl/i.test(x.name));
    const zhAny=cachedVoices.find(x=>x.lang.startsWith('zh-CN')||x.lang==='zh');
    if(cuteVoice)u.voice=cuteVoice;
    else if(zhFemale)u.voice=zhFemale;
    else if(zhAny)u.voice=zhAny;
    u.onstart=()=>{isSpeaking=true};
    u.onend=()=>{isSpeaking=false;resolve();};
    u.onerror=()=>{isSpeaking=false;resolve();};
    synth.speak(u);
  });
}
function stopSpeaking(){if(synth){synth.cancel();isSpeaking=false}}

function toggleVoice(){if(!recognition){showToast('当前浏览器不支持语音识别（请用 Chrome 打开）','error');return}if(isRecording){stopRecording()}else{startRecording()}}
let micPermission=false;
async function requestMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());micPermission=true;return true}catch(e){micPermission=false;return false}}
function startRecording(){
  if(isRecording)return;
  if(!micPermission){requestMic().then(ok=>{if(ok)doStartRecording();else showToast('请在浏览器弹窗中允许麦克风权限','error')});return}
  doStartRecording();
}
function doStartRecording(){
  if(isRecording)return;
  try{recognition.start();isRecording=true;const btn=getActiveVoiceBtn();if(btn){btn.classList.add('recording');btn.textContent='⏹'}showToast('正在聆听…','')}catch(e){isRecording=false;showToast('语音启动失败，请刷新后重试','error')}
}
function stopRecording(){isRecording=false;const btn=getActiveVoiceBtn();if(btn){btn.classList.remove('recording');btn.textContent='🎤'}try{recognition.stop()}catch(e){}}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}setTimeout(()=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'},0)}
function learnHandleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();learnSend()}setTimeout(()=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'},0)}

function updateSendBtn(){const i=getActiveInput(),b=getActiveSendBtn();if(i&&b)b.disabled=!i.value.trim()||isProcessing}
function learnUpdateSendBtn(){const i=getActiveInput(),b=getActiveSendBtn();if(i&&b)b.disabled=!i.value.trim()||learnIsProcessing}

function scrollToBottom(){
  setTimeout(()=>{
    const el=learnMode?document.getElementById('learnChat'):document.getElementById('chat'+currentPage);
    if(el)el.scrollTop=el.scrollHeight;
  },50);
}

function startDemo(){
  demoStarted=true;const w=document.getElementById('welcome');
  if(w){w.classList.add('hide');setTimeout(()=>w.remove(),500)}

    subjectAnalysis={...TEST_SCORES,分析:"测试模式：9门学科兴趣分布。"};

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function showToast(msg,type){
  const ex=document.querySelector('.toast');if(ex)ex.remove();
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){autoDemo=false;showToast('已停止自动演示','');return}
  if(autoDemo)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();nextPage()}
  if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&currentPage>0){e.preventDefault();goToPage(currentPage-1)}
});

let touchStartY=0;
document.addEventListener('touchstart',e=>{if(e.target.tagName!=='TEXTAREA')touchStartY=e.touches[0].clientY});
document.addEventListener('touchend',e=>{
  if(e.target.tagName==='TEXTAREA'||autoDemo)return;
  const diff=touchStartY-e.changedTouches[0].clientY;
  if(Math.abs(diff)>60){if(diff>0)nextPage();else if(currentPage>0)goToPage(currentPage-1)}
});

loadVoices();
updateSkipBtn();buildPages();goToPage(0);

// ── localStorage 学习进度记忆 ──
(function(){
  var ACADEMY_KEY = 'treeacademy_aichat_progress';
  // Save progress when entering learning or final phase
  window._saveProgress = function() {
    var data = {
      chatHistories: chatHistories,
      completedChatSubjects: Array.from(completedChatSubjects),
      chatSubjectOrder: chatSubjectOrder,
      currentChatSession: currentChatSession,
      currentChatMsg: currentChatMsg,
      collectedAnswers: collectedAnswers,
      collectedKeywords: collectedKeywords,
      subjectAnalysis: subjectAnalysis,
      page: currentPage >= total ? currentPage : total, // only save if past probing
      learnSubject: learnSubject,
      learnChatHistory: learnChatHistory
    };
    try { localStorage.setItem(ACADEMY_KEY, JSON.stringify(data)); } catch(e) {}
  };
  // Restore on next visit
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(ACADEMY_KEY)); } catch(e) {}
  if (saved && saved.page >= total) {
    // Restore learning state
    chatHistories = saved.chatHistories || {};
    completedChatSubjects = new Set(saved.completedChatSubjects || []);
    chatSubjectOrder = saved.chatSubjectOrder || [];
    currentChatSession = saved.currentChatSession || 0;
    currentChatMsg = saved.currentChatMsg || 0;
    collectedAnswers = saved.collectedAnswers || [];
    collectedKeywords = saved.collectedKeywords || [];
    subjectAnalysis = saved.subjectAnalysis || null;
    learnSubject = saved.learnSubject || null;
    learnChatHistory = saved.learnChatHistory || [];
    // Jump directly to learning phase
    currentPage = total;
    learnMode = true;
    setTimeout(function() {
      document.getElementById('learnPage').classList.add('active');
      document.getElementById('topBadge').textContent = '学习';
      document.getElementById('skipBtn').style.display = 'none';
      document.getElementById('bottomHint').style.display = 'none';
      if (learnSubject) renderLearnUI();
      else initLearnMode();
      // Show toast
      showToast('已恢复上次学习进度', '');
    }, 300);
    // Keep saved progress for future restores — don't delete
    // try { localStorage.removeItem(ACADEMY_KEY); } catch(e) {}
  }
})();
