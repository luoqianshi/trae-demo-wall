<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锦寰·树语</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  }

  .bg {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0;
  }
  .bg img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    user-select: none; -webkit-user-drag: none;
  }

  /* ── Hit area: precisely overlaid on the image's built-in button ── */
  .enter-hit {
    position: fixed;
    z-index: 10;
    cursor: pointer;
  }

  /* ── Loading indicator ── */
  .loading {
    position: fixed; bottom: 28%; left: 50%; transform: translateX(-50%);
    z-index: 10;
    color: rgba(212, 175, 55, 0.8);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .loading.show { opacity: 1; }

  .loading-dot {
    display: inline-block; animation: dot-bounce 1.4s infinite ease-in-out;
  }
  .loading-dot:nth-child(1) { animation-delay: 0s; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Fade transition ── */
  .fade-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #f5f0e8; z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .fade-overlay.active { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<div class="bg">
  <img src="assets/cover.png" alt="锦寰·树语" id="coverImg" />
</div>

<div class="enter-hit" id="enterHit" onclick="enterAcademy()" title="进入学园"></div>

<div class="loading" id="loading">正在进入学园<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></div>

<div class="fade-overlay" id="fadeOverlay"></div>

<script>
// ── Precisely overlay the hit area on the image's built-in "进入学园" button ──
// Button position in the 1183x887 source image (measured in pixels):
//   left: 37.36%, top: 54.68%, width: 25.27%, height: 8.46%
var BTN = { left: 0.3736, top: 0.5468, w: 0.2527, h: 0.0846 };
var IMG = { w: 1183, h: 887 };

function alignHit() {
  var hit = document.getElementById('enterHit');
  var cW = window.innerWidth;
  var cH = window.innerHeight;
  var imgAR = IMG.w / IMG.h;   // 1.334
  var cAR = cW / cH;

  var dispW, dispH, offsetX, offsetY;

  if (cAR > imgAR) {
    // Viewport wider than image → image fills width, cropped vertically
    dispW = cW;
    dispH = cW / imgAR;
    offsetX = 0;
    offsetY = (cH - dispH) / 2;
  } else {
    // Viewport taller than image → image fills height, cropped horizontally
    dispH = cH;
    dispW = cH * imgAR;
    offsetX = (cW - dispW) / 2;
    offsetY = 0;
  }

  hit.style.left   = (offsetX + BTN.left * dispW) + 'px';
  hit.style.top    = (offsetY + BTN.top  * dispH) + 'px';
  hit.style.width  = (BTN.w * dispW) + 'px';
  hit.style.height = (BTN.h * dispH) + 'px';
}

alignHit();
window.addEventListener('resize', alignHit);
// Re-align when image actually loads
document.getElementById('coverImg').addEventListener('load', alignHit);

var _entering = false;
function enterAcademy() {
  if (_entering) return;
  _entering = true;
  var loading = document.getElementById('loading');
  var fade = document.getElementById('fadeOverlay');

  loading.classList.add('show');

  setTimeout(function() {
    fade.classList.add('active');
  }, 400);

  setTimeout(function() {
    window.location.href = 'index.html?t=' + Date.now();
  }, 1000);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    enterAcademy();
  }
});
</script>

</body>
</html>
