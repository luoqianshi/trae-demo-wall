<header class="page-header">
  <h1>锦寰·树语</h1>
  <div class="subtitle">JINHUAN TREE LANGUAGE</div>
</header>

<div class="motto-bar">
  <span>像树一样学习</span> —— 向上生长，向下扎根，向外探索，向内思考
</div>

  <div class="scene" id="scene">
    <div class="scene-transform" id="sceneTransform">
      <img src="assets/campus.png" alt="锦寰·树语全景图" draggable="false" id="campusImg" />

      <div class="hotspot" data-zone="01" style="left:22%;top:72%;--dot-color:var(--zone-01);animation-delay:0.8s" onclick="openPanel('01')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">01 言叶之庭</div>
      </div>
      <div class="hotspot" data-zone="02" style="left:18%;top:44%;--dot-color:var(--zone-02);animation-delay:0.95s" onclick="openPanel('02')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">02 数理之根</div>
      </div>
      <div class="hotspot" data-zone="04" style="left:62%;top:55%;--dot-color:var(--zone-04);animation-delay:1.1s" onclick="openPanel('04')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">04 万象枝桠</div>
      </div>
      <div class="hotspot" data-zone="03" style="left:68%;top:30%;--dot-color:var(--zone-03);animation-delay:1.25s" onclick="openPanel('03')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">03 时光年轮</div>
      </div>
      <div class="hotspot" data-zone="05" style="left:30%;top:28%;--dot-color:var(--zone-05);animation-delay:1.4s" onclick="openPanel('05')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">05 生命之叶</div>
      </div>
      <div class="hotspot" data-zone="06" style="left:46%;top:8%;--dot-color:var(--zone-06);animation-delay:1.55s" onclick="openPanel('06')">
        <div class="hotspot-dot"></div><div class="hotspot-ring"></div><div class="hotspot-ring r2"></div>
        <div class="hotspot-label">06 星河树冠</div>
      </div>
    </div>
    <!-- Zoom controls OUTSIDE scene-transform so they don't scale -->
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(1.2)">+</button>
      <button class="zoom-btn" onclick="zoom(1/1.2)">−</button>
      <button class="zoom-btn" onclick="zoom(0)">⟳</button>
    </div>
  </div>
</div>

<div class="legend-bar">
  <div class="legend-chip" style="--chip-color:var(--zone-01)" onclick="scrollToHotspot('01')"><span class="dot"></span>言叶之庭</div>
  <div class="legend-chip" style="--chip-color:var(--zone-02)" onclick="scrollToHotspot('02')"><span class="dot"></span>数理之根</div>
  <div class="legend-chip" style="--chip-color:var(--zone-03)" onclick="scrollToHotspot('03')"><span class="dot"></span>时光年轮</div>
  <div class="legend-chip" style="--chip-color:var(--zone-04)" onclick="scrollToHotspot('04')"><span class="dot"></span>万象枝桠</div>
  <div class="legend-chip" style="--chip-color:var(--zone-05)" onclick="scrollToHotspot('05')"><span class="dot"></span>生命之叶</div>
  <div class="legend-chip" style="--chip-color:var(--zone-06)" onclick="scrollToHotspot('06')"><span class="dot"></span>星河树冠</div>

<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<div class="detail-panel" id="detailPanel">

    <div class="panel-handle-strip"></div>

// ── Panel Logic ──
let currentZone = null;
var STORAGE_KEY = 'treeacademy_explored';

function getExplored() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
}

function markExplored(zoneId) {
  var explored = getExplored();
  if (explored.indexOf(zoneId) === -1) {
    explored.push(zoneId);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(explored));
  }
  updateExploredUI();
}

function updateExploredUI() {
  var explored = getExplored();
  // Update hotspots
  explored.forEach(function(id) {
    var hs = document.querySelector('.hotspot[data-zone="' + id + '"]');
    if (hs) hs.classList.add('explored');
  });
  // Update legend chips
  explored.forEach(function(id) {
    var chips = document.querySelectorAll('.legend-chip');
    var zoneIds = ['01','02','03','04','05','06'];
    var idx = zoneIds.indexOf(id);
    if (idx >= 0 && chips[idx]) chips[idx].classList.add('explored');
  });
}

// ── Legend → scroll to hotspot (not open panel) ──
function scrollToHotspot(zoneId) {
  var hs = document.querySelector('.hotspot[data-zone="' + zoneId + '"]');
  if (!hs) return;
  // Flash highlight
  hs.classList.add('highlight-flash');
  setTimeout(function() { hs.classList.remove('highlight-flash'); }, 2000);
  // Smooth scroll to hotspot
  hs.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // Brief label reveal
  var label = hs.querySelector('.hotspot-label');
  if (label) { label.style.opacity = '1'; setTimeout(function() { if (!hs.classList.contains('active')) label.style.opacity = ''; }, 2000); }
}

// ── Direct panel switch (no close-then-open race) ──
function switchPanel(zoneId) {
  // Directly repaint panel content without close animation
  openPanel(zoneId);
}

function openPanel(zoneId) {
  var zone = zones[zoneId];
  if (!zone) return;
  currentZone = zoneId;

  // Update panel content
  document.getElementById('panelNumber').textContent = zone.number;
  document.getElementById('panelTitle').textContent = zone.title;
  document.getElementById('panelTitleEn').textContent = zone.titleEn;
  document.getElementById('panelDesc').textContent = zone.desc;
  document.getElementById('panelBar').style.background = zone.color;
  document.getElementById('panelBar').style.boxShadow = '0 0 12px ' + zone.color;
  document.getElementById('panelNumber').style.color = zone.color;
  document.getElementById('detailPanel').style.setProperty('--panel-color', zone.color);

  document.getElementById('panelFeatures').innerHTML = zone.features.map(function(f) {
    return '<li><span class="feature-icon" style="background:' + zone.color + '">' + f.icon + '</span><span>' + f.text + '</span></li>';
  }).join('');

  document.getElementById('panelTags').innerHTML = zone.subjects.map(function(s) {
    return '<span class="subject-tag" style="border-color:' + zone.color + ';color:' + zone.color + '" onclick="openDemo(\'' + s.url + '\',\'' + s.title + '\',\'' + zoneId + '\')">' + s.name + '</span>';
  }).join('');

  // Render related links
  if (zone.related && zone.related.length > 0) {
    document.getElementById('panelRelated').style.display = 'block';
    document.getElementById('panelRelatedLinks').innerHTML = zone.related.map(function(r) {
      var rz = zones[r.id];
      if (!rz) return '';
      return '<span class="related-chip" onclick="switchPanel(\'' + r.id + '\')" style="border-color:' + rz.color + '"><span class="r-dot" style="background:' + rz.color + '"></span>' + rz.title + '<span class="related-reason">' + r.reason + '</span></span>';
    }).join('');
  } else {
    document.getElementById('panelRelated').style.display = 'none';
  }

  document.getElementById('panelOverlay').classList.add('show');
  document.getElementById('detailPanel').classList.add('show');

  document.querySelectorAll('.hotspot').forEach(function(h) { h.classList.remove('active'); });
  var activeHotspot = document.querySelector('.hotspot[data-zone="' + zoneId + '"]');
  if (activeHotspot) activeHotspot.classList.add('active');

  document.getElementById('detailPanel').scrollTop = 0;
}

function closePanel() {
  var panel = document.getElementById('detailPanel');
  var overlay = document.getElementById('panelOverlay');
  if (!panel.classList.contains('show')) return;
  // Clear any inline right from dragging so CSS class takes over
  panel.style.right = '';
  panel.classList.add('dismissing');
  overlay.style.opacity = '0';
  var handler = function() {
    panel.removeEventListener('transitionend', handler);
    panel.classList.remove('show', 'dismissing');
    panel.style.right = '';
    overlay.style.opacity = '';
    overlay.classList.remove('show');
  };
  panel.addEventListener('transitionend', handler);
  // Fallback: if transitionend doesn't fire (e.g. panel hidden), force cleanup after 500ms
  setTimeout(function() {
    if (panel.classList.contains('dismissing')) {
      panel.removeEventListener('transitionend', handler);
      handler();
    }
  }, 500);
  document.querySelectorAll('.hotspot').forEach(function(h) { h.classList.remove('active'); });
  currentZone = null;
}

// ── Panel Swipe-to-Dismiss (handle only) ──
(function() {
  var panel = document.getElementById('detailPanel');
  var overlay = document.getElementById('panelOverlay');
  var handle = document.getElementById('panelHandle');
  var dragging = false;
  var startX = 0;
  var startRight = 0;
  var panelWidth = 440;

  function onStart(e) {
    if (!panel.classList.contains('show')) return;
    // Only allow drag from the handle area
    if (!e.target.closest('#panelHandle')) return;
    dragging = true;
    panelWidth = panel.offsetWidth;
    panel.classList.remove('dismissing');
    panel.classList.add('dragging');
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    startX = clientX;
    startRight = panelWidth - panel.getBoundingClientRect().right;
  }

  function onMove(e) {
    if (!dragging) return;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var dx = clientX - startX;
    var newRight = Math.max(-panelWidth + 20, Math.min(0, startRight - dx));
    panel.style.right = newRight + 'px';
    // Fade overlay proportionally — newRight is negative (panel moves right away from screen)
    var progress = 1 - Math.abs(newRight) / panelWidth;
    overlay.style.opacity = Math.max(0, progress * 0.5);
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('dragging');
    var currentRight = parseFloat(panel.style.right) || 0;
    if (currentRight < -panelWidth * 0.25) {
      // Dismissed past threshold → close
      closePanel();
    } else {
      // Snap back
      panel.style.right = '0px';
      overlay.style.opacity = '';
    }
  }

  handle.addEventListener('touchstart', onStart, { passive: false });
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchend', onEnd);
  document.addEventListener('mouseup', onEnd);
})();

function openDemo(url, title, zoneId) {

  if (zoneId) markExplored(zoneId);

  setTimeout(function() {

      skeleton.classList.add('hidden');

// ── Zoom & Pan ──
var currentScale = 1;
var translate = { x: 0, y: 0 };
var lastTranslate = { x: 0, y: 0 };
var isPanning = false;
var panStart = { x: 0, y: 0 };
var container = document.getElementById('sceneTransform');
var sceneEl = document.getElementById('scene');
var img = document.getElementById('campusImg');

function applyTransform() {
  var sceneW = sceneEl.clientWidth;
  var sceneH = sceneEl.clientHeight;
  var overflowX = Math.max(0, sceneW * (currentScale - 1));
  var overflowY = Math.max(0, sceneH * (currentScale - 1));
  translate.x = Math.max(-overflowX, Math.min(overflowX, translate.x));
  translate.y = Math.max(-overflowY, Math.min(overflowY, translate.y));
  container.style.transform = 'scale(' + currentScale + ') translate(' + translate.x + 'px, ' + translate.y + 'px)';
}

function zoom(factor) {
  if (factor === 0) { currentScale = 1; translate = { x: 0, y: 0 }; lastTranslate = { x: 0, y: 0 }; }
  else { currentScale = Math.max(1, Math.min(2.5, currentScale * factor)); }
  applyTransform();
}

// Wheel zoom - only when cursor is inside the scene
sceneEl.addEventListener('wheel', function(e) {
  var rect = sceneEl.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
  if (currentScale <= 1.01 && e.deltaY > 0) return;
  e.preventDefault();
  currentScale = Math.max(1, Math.min(2.5, currentScale * (e.deltaY < 0 ? 1.08 : 0.92)));
  applyTransform();
}, { passive: false });

// Pan
sceneEl.addEventListener('mousedown', function(e) {
  if (currentScale <= 1) return;
  if (e.target.closest('.hotspot') || e.target.closest('.zoom-btn')) return;
  isPanning = true;
  panStart = { x: e.clientX - lastTranslate.x, y: e.clientY - lastTranslate.y };
  img.style.cursor = 'grabbing';
});

document.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  translate.x = e.clientX - panStart.x;
  translate.y = e.clientY - panStart.y;
  applyTransform();
});

document.addEventListener('mouseup', function() {
  if (isPanning) { isPanning = false; lastTranslate = { x: translate.x, y: translate.y }; img.style.cursor = 'grab'; }
});

// Touch support
var touchLastDist = 0;
sceneEl.addEventListener('touchstart', function(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    touchLastDist = Math.sqrt(dx * dx + dy * dy);
  } else if (e.touches.length === 1 && currentScale > 1) {
    if (e.target.closest('.hotspot') || e.target.closest('.zoom-btn')) return;
    panStart = { x: e.touches[0].clientX - lastTranslate.x, y: e.touches[0].clientY - lastTranslate.y };
  }
}, { passive: false });

sceneEl.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    currentScale = Math.max(1, Math.min(2.5, currentScale * (dist / touchLastDist)));
    touchLastDist = dist;
    applyTransform();
  } else if (e.touches.length === 1 && panStart) {
    translate.x = e.touches[0].clientX - panStart.x;
    translate.y = e.touches[0].clientY - panStart.y;
    applyTransform();
  }
}, { passive: false });

sceneEl.addEventListener('touchend', function() {
  lastTranslate = { x: translate.x, y: translate.y };
});

// ── Init: Toast + Guide Leaf + Restore explored state ──
window.addEventListener('load', function() {
  // Restore explored state from localStorage
  updateExploredUI();

  // Toast
  setTimeout(function() {
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 8000);
  }, 2000);

  // Guide leaf animation
  setTimeout(function() {
    var firstHotspot = document.querySelector('.hotspot[data-zone="01"]');
    if (!firstHotspot) return;
    var rect = firstHotspot.getBoundingClientRect();
    var leaf = document.createElement('div');
    leaf.className = 'guide-leaf';
    leaf.innerHTML = '<svg viewBox="0 0 32 32"><path d="M16 2C16 2 4 8 4 18c0 6.6 5.4 12 12 12s12-5.4 12-12C28 8 16 2 16 2z" fill="#6b9b6e" opacity="0.85"/><path d="M16 8v14M16 8l-4 4M16 8l4 4" stroke="#fff" stroke-width="1.2" fill="none" opacity="0.6"/></svg>';
    leaf.style.left = '50%';
    leaf.style.top = rect.top + 'px';
    document.body.appendChild(leaf);
    // Remove after animation
    setTimeout(function() { leaf.remove(); }, 3000);
  }, 3500);

  // First-visit spotlight hint
  var VISITED_KEY = 'treeacademy_visited';
  if (!localStorage.getItem(VISITED_KEY)) {
    var hint = document.getElementById('firstVisitHint');
    var dismissed = false;
    setTimeout(function() {
      hint.classList.add('show');
      // Dismiss on click or after 5s
      var dismiss = function() {
        if (dismissed) return;
        dismissed = true;
        hint.classList.remove('show');
        localStorage.setItem(VISITED_KEY, '1');
        document.removeEventListener('click', dismiss);
      };
      document.addEventListener('click', dismiss);
      setTimeout(dismiss, 5000);
    }, 500);
  }
});
</script>
