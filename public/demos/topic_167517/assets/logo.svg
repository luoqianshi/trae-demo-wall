<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gMain" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="55%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="gShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.25"/>
    </linearGradient>
    <radialGradient id="gHighlight" cx="28%" cy="28%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 主体：面状定位图钉外形（地点语义） -->
  <!-- 圆润头部 + 底部尖 = 地图定位点 -->
  <path d="M50 10 C71 10 88 27 88 48 C88 63 79 76 66 83 L50 96 L34 83 C21 76 12 63 12 48 C12 27 29 10 50 10 Z" 
        fill="url(#gMain)"/>
  
  <!-- 底部阴影渐变：增加体积感 -->
  <path d="M50 10 C71 10 88 27 88 48 C88 63 79 76 66 83 L50 96 L34 83 C21 76 12 63 12 48 C12 27 29 10 50 10 Z" 
        fill="url(#gShadow)" opacity="0.6"/>
  
  <!-- 左上高光：面状体积感 -->
  <path d="M50 10 C71 10 88 27 88 48 C88 63 79 76 66 83 L50 96 L34 83 C21 76 12 63 12 48 C12 27 29 10 50 10 Z" 
        fill="url(#gHighlight)"/>
  
  <!-- TRAE 四字母影子（极克制，用面的切割暗示，不画完整字母） -->
  <!-- T的暗示：顶部一条短横线 + 中心竖轴贯穿 -->
  <rect x="33" y="22" width="34" height="3" rx="1.5" fill="rgba(255,255,255,0.16)"/>
  
  <!-- R的暗示：右上的弧形切角（用半圆的负空间感） -->
  <path d="M62 28 Q72 32 72 44 Q72 52 66 56" 
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- A的暗示：两条向上汇聚的线 + 中间一横（在图钉下半部分） -->
  <path d="M30 72 L44 52 L58 72" 
        fill="none" stroke="rgba(255,255,255,0.11)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="36" y="62" width="16" height="2" rx="1" fill="rgba(255,255,255,0.07)"/>
  
  <!-- E的暗示：右侧三条短横线（最右边缘） -->
  <rect x="66" y="32" width="8" height="2.5" rx="1" fill="rgba(255,255,255,0.13)"/>
  <rect x="66" y="44" width="6" height="2" rx="1" fill="rgba(255,255,255,0.09)"/>
  <rect x="66" y="56" width="8" height="2.5" rx="1" fill="rgba(255,255,255,0.13)"/>
  
  <!-- 中心定位点：强化"地点/定位"语义，同时作为视觉焦点 -->
  <circle cx="50" cy="45" r="7" fill="rgba(255,255,255,0.2)"/>
  <circle cx="50" cy="45" r="3.5" fill="rgba(255,255,255,0.92)"/>
  <circle cx="49" cy="44" r="1.2" fill="rgba(255,255,255,1)"/>
  
  <!-- 针尖底部加深 -->
  <path d="M50 82 L50 96 L42 86 Z" fill="rgba(0,0,0,0.2)"/>
</svg>
