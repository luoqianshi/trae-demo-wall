<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 主渐变：非常克制的双色，左上亮右下暗 -->
    <linearGradient id="gMain" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    
    <!-- 顶部高光 -->
    <linearGradient id="gHi" x1="30%" y1="10%" x2="50%" y2="40%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- 底部暗部 -->
    <linearGradient id="gSh" x1="50%" y1="50%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.35"/>
    </linearGradient>
    
    <!-- 内圈渐变（用于中心留白的边缘） -->
    <radialGradient id="gInner" cx="50%" cy="45%" r="50%">
      <stop offset="60%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </radialGradient>
  </defs>

  <!-- 主体：一个独特的"水滴形"或"地点pin"基本形 -->
  <!-- 关键：比例非常精确，不是标准pin，而是更有设计感的形态 -->
  <!-- 上半部分圆润饱满，下半部分收尖但有微妙的曲线 -->
  <!-- 整体像一颗宝石的侧面，也像地图定位点 -->
  <path d="M50 10 
           C72 10 88 26 88 48 
           C88 66 76 80 64 86 
           L50 94 
           L36 86 
           C24 80 12 66 12 48 
           C12 26 28 10 50 10 Z" 
        fill="url(#gMain)"/>
  
  <!-- 底部暗部 -->
  <path d="M50 10 
           C72 10 88 26 88 48 
           C88 66 76 80 64 86 
           L50 94 
           L36 86 
           C24 80 12 66 12 48 
           C12 26 28 10 50 10 Z" 
        fill="url(#gSh)"/>
  
  <!-- 左上高光面 -->
  <path d="M50 10 
           C72 10 88 26 88 48 
           C84 42 70 32 50 32 
           C30 32 16 42 12 48 
           C12 26 28 10 50 10 Z" 
        fill="url(#gHi)"/>
  
  <!-- 核心记忆点：中心的"窗/门"形留白 -->
  <!-- 这个形状同时是：
       - 一扇门（进入工作空间）
       - 字母N的负形（New Worker）
       - 一个抽象的"人"站在门里
       - 位置在pin的正中间，像pin的中心点 -->
  <path d="M36 38 
           L36 64 
           C36 70 42 74 50 74 
           C58 74 64 70 64 64 
           L64 38 
           Z" 
        fill="url(#gInner)"/>
  
  <!-- 中心留白内的高光 -->
  <path d="M36 38 L64 38 L58 44 L42 44 Z" 
        fill="rgba(255,255,255,0.12)"/>
  
  <!-- 中心小点：节点语义 -->
  <circle cx="50" cy="38" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="50" cy="38" r="2" fill="rgba(255,255,255,0.95)"/>
  
  <!-- 极细外描边：精致感 -->
  <path d="M50 10 
           C72 10 88 26 88 48 
           C88 66 76 80 64 86 
           L50 94 
           L36 86 
           C24 80 12 66 12 48 
           C12 26 28 10 50 10 Z" 
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
</svg>
