<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 主渐变：更克制的双色，偏冷调但有层次 -->
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- 高光：不是纯白，而是极淡的冷白，更高级 -->
    <linearGradient id="highlight" x1="20%" y1="10%" x2="60%" y2="50%">
      <stop offset="0%" style="stop-color:#c7d2fe;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0"/>
    </linearGradient>
    
    <!-- 底部暗部：增加体积感 -->
    <linearGradient id="shadow" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- 内发光：中心偏亮，营造"能源节点"感 -->
    <radialGradient id="innerGlow" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 内部切割线的颜色 -->
    <linearGradient id="cut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- 主体：六边形形态（从上方俯视的工作节点/地点标识） -->
  <!-- 设计：不是标准六边形，而是上窄下宽的六边形，像一颗钻石，也像地图定位pin的俯视 -->
  <!-- 同时整体轮廓暗合字母A的形态 -->
  <path d="M50 8 
           L78 24 
           L78 68 
           L50 92 
           L22 68 
           L22 24 Z" 
        fill="url(#main)"/>
  
  <!-- 底部暗部 -->
  <path d="M50 8 
           L78 24 
           L78 68 
           L50 92 
           L22 68 
           L22 24 Z" 
        fill="url(#shadow)"/>
  
  <!-- 左上高光面（微妙的体积感，像宝石切割面） -->
  <path d="M50 8 L78 24 L50 50 L22 24 Z" 
        fill="url(#highlight)"/>
  
  <!-- 内发光 -->
  <path d="M50 8 
           L78 24 
           L78 68 
           L50 92 
           L22 68 
           L22 24 Z" 
        fill="url(#innerGlow)"/>
  
  <!-- TRAE字母影子：通过几何切割线暗示 -->
  <!-- T：顶部水平线 + 中心竖线向下延伸 -->
  <line x1="30" y1="20" x2="70" y2="20" stroke="url(#cut)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- R：右侧的圆弧（嵌入在六边形右上区域） -->
  <path d="M60 28 Q72 32 72 44 Q72 54 64 58 L60 58" 
        fill="none" stroke="url(#cut)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- A：六边形本身的轮廓就是A形，内部加一横 -->
  <line x1="34" y1="50" x2="66" y2="50" stroke="url(#cut)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- E：右侧三条横线（最右边缘） -->
  <line x1="78" y1="32" x2="68" y2="32" stroke="url(#cut)" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="70" y2="50" stroke="url(#cut)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="78" y1="68" x2="68" y2="68" stroke="url(#cut)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 中心点：强化"节点/定位"语义 -->
  <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.18)"/>
  <circle cx="50" cy="50" r="4" fill="rgba(255,255,255,0.9)"/>
  <circle cx="49" cy="49" r="1.5" fill="#fff"/>
  
  <!-- 外轮廓极细描边：增加精致感 -->
  <path d="M50 8 
           L78 24 
           L78 68 
           L50 92 
           L22 68 
           L22 24 Z" 
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
</svg>
