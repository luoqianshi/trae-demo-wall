<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 主渐变：非常克制的紫蓝渐变，左上亮右下暗 -->
    <linearGradient id="gMain" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    
    <!-- 顶部高光：柔和的冷白，不是纯白 -->
    <linearGradient id="gHi" x1="30%" y1="10%" x2="55%" y2="45%">
      <stop offset="0%" style="stop-color:#c7d2fe;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0"/>
    </linearGradient>
    
    <!-- 底部暗部：增加体积感和分量 -->
    <linearGradient id="gSh" x1="50%" y1="55%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.4"/>
    </linearGradient>
    
    <!-- 内部切口的渐变：比主色深两度，制造"凹进去"的感觉 -->
    <linearGradient id="gCut" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    
    <!-- 切口内的微小高光顶边 -->
    <linearGradient id="gCutHi" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- ================================================
       主体：一个经过比例推敲的"地点pin"基本形
       语义：地图定位点 = 工作节点 = 空间
       比例：上宽下窄，底部收尖，整体像一颗宝石
       ================================================ -->
  <path d="M50 8 
           C70 8 86 24 86 44 
           C86 62 76 76 64 82 
           L50 92 
           L36 82 
           C24 76 14 62 14 44 
           C14 24 30 8 50 8 Z" 
        fill="url(#gMain)"/>
  
  <!-- 底部暗部：右下偏暗，制造光照方向感 -->
  <path d="M50 8 
           C70 8 86 24 86 44 
           C86 62 76 76 64 82 
           L50 92 
           L36 82 
           C24 76 14 62 14 44 
           C14 24 30 8 50 8 Z" 
        fill="url(#gSh)"/>
  
  <!-- 左上高光面：像球体的受光面，柔和有体积感 -->
  <path d="M50 8 
           C70 8 86 24 86 44 
           C82 38 68 28 50 28 
           C32 28 18 38 14 44 
           C14 24 30 8 50 8 Z" 
        fill="url(#gHi)"/>
  
  <!-- ================================================
       核心记忆点：中心的"拱门"形切口
       三重语义：
       1. 一扇门/入口 = 进入新的工作方式
       2. 字母N的负形（New Worker首字母）
       3. 一个"人"的剪影站在门中
       
       同时，切口的上沿位置正好是pin的"中心点"位置，
       强化了"定位点"的语义。
       ================================================ -->
  <path d="M34 34 
           L34 66 
           C34 72 42 78 50 78 
           C58 78 66 72 66 66 
           L66 34 
           Z" 
        fill="url(#gCut)"/>
  
  <!-- 切口顶部的微高光：制造"内凹"的深度感 -->
  <path d="M34 34 Q50 28 66 34" 
        fill="url(#gCutHi)"/>
  
  <!-- 切口内底部的微妙阴影 -->
  <path d="M34 66 C34 72 42 78 50 78 C58 78 66 72 66 66" 
        fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
  
  <!-- ================================================
       中心点：pin的定位核心
       语义：节点 = 连接点 = 我在这里
       放在拱门的顶部中心，既是pin的中心点，
       也是"门"的入口点。
       ================================================ -->
  <circle cx="50" cy="34" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="50" cy="34" r="2.5" fill="rgba(255,255,255,0.95)"/>
  <circle cx="49.2" cy="33.2" r="1" fill="#fff"/>
  
  <!-- ================================================
       极细外描边：增加精致感和边缘清晰度
       只有0.6px，几乎看不见但能提升质感
       ================================================ -->
  <path d="M50 8 
           C70 8 86 24 86 44 
           C86 62 76 76 64 82 
           L50 92 
           L36 82 
           C24 76 14 62 14 44 
           C14 24 30 8 50 8 Z" 
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.6"/>
  
  <!-- 底部尖部的极细高光：增加切割面的感觉 -->
  <path d="M50 92 L42 82" 
        stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
