<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 主渐变：从左上冷蓝到右下暖紫，有温度变化 -->
    <linearGradient id="gMain" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    
    <!-- 内阴影：底部收暗 -->
    <linearGradient id="gShade" x1="0%" y1="50%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.25"/>
    </linearGradient>
    
    <!-- 高光面：左上 -->
    <linearGradient id="gHi" x1="15%" y1="10%" x2="45%" y2="45%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- 内部缺口的渐变（让缺口有深度感） -->
    <linearGradient id="gCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- 主体：一个独特的面状形态 -->
  <!-- 设计语义：
       - 上窄下宽的圆润形态 = 地图定位pin（地点语义）
       - 中间的拱形缺口 = 门/入口（进入工作空间的语义）
       - 整体侧影 = 字母N（New的首字母，也是TRAE的一部分）
       - 面的转折 = 体积感、质感
  -->
  <path d="M50 8 
           C68 8 82 22 82 40 
           L82 62 
           C82 76 74 88 62 92 
           L50 96 
           L38 92 
           C26 88 18 76 18 62 
           L18 40 
           C18 22 32 8 50 8 Z" 
        fill="url(#gMain)"/>
  
  <!-- 底部阴影 -->
  <path d="M50 8 
           C68 8 82 22 82 40 
           L82 62 
           C82 76 74 88 62 92 
           L50 96 
           L38 92 
           C26 88 18 76 18 62 
           L18 40 
           C18 22 32 8 50 8 Z" 
        fill="url(#gShade)"/>
  
  <!-- 左上高光 -->
  <path d="M50 8 
           C68 8 82 22 82 40 
           L82 50 
           C72 36 58 30 50 30 
           C42 30 28 36 18 50 
           L18 40 
           C18 22 32 8 50 8 Z" 
        fill="url(#gHi)"/>
  
  <!-- 中间拱形缺口：形成"门"的语义，同时缺口的形状暗示字母A -->
  <!-- 这是logo的记忆点：一个完整的pin上面有一个门形的缺口 -->
  <path d="M34 52 
           L34 68 
           C34 76 42 82 50 82 
           C58 82 66 76 66 68 
           L66 52 
           L58 52 
           L58 68 
           C58 72 54 76 50 76 
           C46 76 42 72 42 68 
           L42 52 Z" 
        fill="url(#gCut)"/>
  
  <!-- 拱形顶部的内高光（增加深度） -->
  <path d="M42 52 Q50 44 58 52" 
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- 中心点：节点语义 -->
  <circle cx="50" cy="30" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="50" cy="30" r="2.5" fill="rgba(255,255,255,0.95)"/>
  
  <!-- 极细外描边 -->
  <path d="M50 8 
           C68 8 82 22 82 40 
           L82 62 
           C82 76 74 88 62 92 
           L50 96 
           L38 92 
           C26 88 18 76 18 62 
           L18 40 
           C18 22 32 8 50 8 Z" 
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
</svg>
