<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来杯好茶摇一摇</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #D4A574;
  --dark: #8B5E3C;
  --light-bg: #FFF5E6;
  --accent: #E8913A;
  --card-bg: #FFFFFF;
  --text: #4A3728;
  --text-light: #8B7355;
  --border: #E8D5C0;
  --shadow: rgba(139, 94, 60, 0.15);
  --success: #4CAF50;
  --fail: #F44336;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--light-bg);
  color: var(--text);
}

/* ========== 顶部状态栏 ========== */
.top-bar {
  height: 60px;
  background: linear-gradient(135deg, var(--dark), var(--primary));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  box-shadow: 0 2px 12px var(--shadow);
  z-index: 100;
  position: relative;
}

.top-bar .stats {
  display: flex;
  gap: 24px;
  align-items: center;
}

.top-bar .stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  font-weight: 600;
}

.top-bar .stat-item .icon { font-size: 20px; }

.top-bar .actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.toggle-btn {
  padding: 8px 20px;
  border: none;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}

.toggle-btn.open {
  background: var(--success);
  color: #fff;
}

.toggle-btn.rest {
  background: rgba(255,255,255,0.2);
  color: #fff;
}

.toggle-btn:hover { transform: scale(1.05); }

.tech-btn {
  padding: 8px 20px;
  border: none;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: rgba(255, 215, 0, 0.9);
  color: #5D4E37;
  transition: all 0.25s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.tech-btn:hover {
  transform: scale(1.05);
  background: rgba(255, 215, 0, 1);
}

/* ========== 科技树面板 ========== */
.tech-tree-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}

.tech-tree-overlay.show {
  display: flex;
}

.tech-tree-panel {
  width: 90%;
  max-width: 1000px;
  max-height: 85vh;
  background: linear-gradient(135deg, #FFF8E7, #FFF5DC);
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  animation: pop-in 0.3s ease;
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.tech-tree-header {
  background: linear-gradient(135deg, var(--dark), var(--primary));
  color: #fff;
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tech-tree-header h2 {
  font-size: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.tech-tree-header .close-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.tech-tree-header .close-btn:hover {
  background: rgba(255,255,255,0.3);
  transform: rotate(90deg);
}

.tech-tree-content {
  padding: 24px;
  overflow-y: auto;
  max-height: calc(85vh - 80px);
}

.tech-tree-main {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.tech-tree-root {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.tech-tree-node {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tech-tree-category {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 4px solid var(--accent);
}

.tech-tree-category-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.tech-tree-category-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.tech-tree-category-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

.tech-tree-branch {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tech-tree-line {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.tech-tree-line::before {
  content: '';
  width: 2px;
  flex-shrink: 0;
  background: var(--border);
  margin-top: 24px;
  min-height: 8px;
}

.tech-tree-item {
  background: #fff;
  border-radius: 12px;
  padding: 14px 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border: 2px solid var(--border);
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.tech-tree-item:hover {
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}

.tech-tree-item.maxed {
  border-color: var(--success);
  background: linear-gradient(135deg, #fff, #f0fff0);
}

.tech-tree-item.locked {
  opacity: 0.5;
  cursor: not-allowed;
}

.tech-tree-item-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.tech-tree-item-icon {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #FFE4B5, #FFDAB9);
  border-radius: 10px;
}

.tech-tree-item-info {
  flex: 1;
}

.tech-tree-item-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.tech-tree-item-level {
  font-size: 12px;
  color: var(--text-light);
}

.tech-tree-item-desc {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 10px;
  line-height: 1.4;
}

.tech-tree-item-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tech-tree-item-cost {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}

.tech-tree-item-cost .coin-icon {
  font-size: 16px;
}

.tech-tree-upgrade-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: linear-gradient(135deg, var(--accent), #E67E22);
  color: #fff;
}

.tech-tree-upgrade-btn:hover:not(:disabled) {
  transform: scale(1.05);
  box-shadow: 0 3px 10px rgba(232, 145, 58, 0.4);
}

.tech-tree-upgrade-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.tech-tree-upgrade-btn.maxed {
  background: var(--success);
}

.tech-tree-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--success);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
}

.tech-tree-connector {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--border);
  margin-top: 20px;
  flex-shrink: 0;
}

.tech-tree-connector.active {
  background: var(--accent);
}

.tech-tree-connector.maxed {
  background: var(--success);
}

/* ========== 主内容区三栏布局 ========== */
.main-container {
  display: flex;
  height: calc(100vh - 60px);
  width: 100%;
}

/* 左栏 - 顾客队列 */
.left-panel {
  width: 280px;
  background: var(--card-bg);
  border-right: 2px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

.panel-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.customer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.customer-card {
  background: var(--light-bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  transition: all 0.3s;
  position: relative;
}

.customer-card.active {
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(232, 145, 58, 0.2);
}

.customer-card.waiting {
  cursor: pointer;
  animation: card-pulse 2s ease-in-out infinite;
}

.customer-card.waiting:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(232, 145, 58, 0.25);
  transform: translateY(-2px);
}

@keyframes card-pulse {
  0%, 100% { box-shadow: 0 2px 8px rgba(232, 145, 58, 0.1); }
  50% { box-shadow: 0 4px 16px rgba(232, 145, 58, 0.25); }
}

.customer-card.serving {
  border-color: var(--success);
  background: linear-gradient(135deg, #F0FFF0, #E8F5E8);
}

.customer-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.customer-avatar {
  font-size: 36px;
  line-height: 1;
}

.customer-info {
  flex: 1;
}

.customer-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}

.customer-prefs {
  font-size: 12px;
  color: var(--text-light);
}

.secret-hint {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 2px;
  animation: sparkle 1.5s ease-in-out infinite;
}

@keyframes sparkle {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

.patience-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.patience-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #8BC34A);
  transition: width 0.3s, background 0.3s;
  border-radius: 3px;
}

.patience-fill.warning {
  background: linear-gradient(90deg, #FF9800, #FFC107);
}

.patience-fill.danger {
  background: linear-gradient(90deg, var(--fail), #FF5722);
}

.empty-hint {
  text-align: center;
  color: var(--text-light);
  font-size: 14px;
  padding: 40px 0;
}

/* 中栏 - 制作台 */
.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 20px;
  overflow-y: auto;
  position: relative;
}

.cup-container {
  position: relative;
  width: 140px;
  height: 200px;
  margin: 2px 0 4px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  flex-shrink: 0;
}
.cup-container.dragging { cursor: grabbing; }
.cup-container.shake-mode {
  animation: glow-pulse 1.5s ease-in-out infinite;
}
.cup-container.serving { cursor: grab; }
@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(232,145,58,0)); }
  50% { filter: drop-shadow(0 0 12px rgba(232,145,58,0.6)); }
}

.cup-wrapper {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 115px;
  height: 155px;
  will-change: transform;
}

.cup {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
  border: 3px solid var(--border);
  border-radius: 0 0 36px 36px;
  overflow: hidden;
  box-shadow: 0 8px 24px var(--shadow);
}

.cup-liquid {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0%;
  background: #8B4513;
  transition: height 0.6s ease, background 0.8s ease;
  border-radius: 0 0 33px 33px;
  overflow: hidden;
}

/* 茶底层（底部） */
.cup-liquid-tea {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0%;
  transition: height 0.6s ease, background 0.8s ease;
  border-radius: 0 0 33px 33px;
}

/* 奶底层（茶底上方） */
.cup-liquid-milk {
  position: absolute;
  left: 0;
  right: 0;
  height: 0%;
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,250,240,0.6));
  transition: height 0.6s ease, bottom 0.8s ease, opacity 0.8s ease;
  border-radius: 0;
}

/* 液体倒入波纹 */
.cup-liquid.pouring::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: liquid-wave 0.6s ease-in-out infinite;
}
@keyframes liquid-wave {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.cup-toppings {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 70px;
  pointer-events: none;
}

.topping-particle {
  position: absolute;
  font-size: 16px;
  will-change: left, bottom;
  transition: none;
}

/* 小料飞入动画 */
.fly-topping {
  position: fixed;
  font-size: 24px;
  z-index: 999;
  pointer-events: none;
  transition: left 0.6s cubic-bezier(0.4, 0, 0.6, 1), top 0.6s cubic-bezier(0.4, 0, 0.6, 1), transform 0.6s ease, opacity 0.6s ease;
}

/* 倒入动画元素 */
.pour-stream {
  position: absolute;
  width: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
  border-radius: 4px;
  z-index: 10;
  pointer-events: none;
}

.steam {
  position: absolute;
  bottom: 228px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  opacity: 0;
  animation: steam-rise 2s ease-in-out infinite;
  z-index: 5;
}
.steam.visible { opacity: 1; }
@keyframes steam-rise {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
  50% { transform: translateX(-50%) translateY(-15px); opacity: 0.3; }
}

.ice-cubes {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.ice-cubes.visible { opacity: 1; }
.ice-cube {
  position: absolute;
  font-size: 18px;
  will-change: left, top;
}

.cup-lid {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 124px;
  height: 18px;
  background: var(--dark);
  border-radius: 8px 8px 3px 3px;
  z-index: 22;
}

.cup-straw {
  position: absolute;
  top: -24px;
  left: 56%;
  transform: translateX(-50%) rotate(8deg);
  width: 8px;
  height: 180px;
  background: linear-gradient(180deg, var(--accent) 0%, #FFB74D 30%, var(--accent) 100%);
  border-radius: 4px 4px 0 0;
  z-index: 21;
  transform-origin: top center;
}

/* 摇晃进度条 */
.shake-meter {
  width: 160px;
  margin: 6px 0 10px;
  display: none;
}
.shake-meter.active { display: block; }
.shake-meter-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  text-align: center;
  margin-bottom: 4px;
}
.shake-meter-bar {
  height: 14px;
  background: var(--border);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.shake-meter-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FFB74D, var(--accent), #FF5722);
  border-radius: 7px;
  transition: width 0.1s linear;
}
.shake-hint {
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
  margin-top: 4px;
}

/* 自动摇茶机按钮 */
.auto-shaker-btn {
  width: 100%;
  max-width: 300px;
  padding: 10px 20px;
  border: 2px dashed var(--accent);
  border-radius: 20px;
  background: transparent;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 8px;
}
.auto-shaker-btn:hover { background: rgba(232,145,58,0.1); }
.auto-shaker-btn.owned {
  border-style: solid;
  border-color: var(--success);
  color: var(--success);
  cursor: default;
}
.auto-shaker-btn.cannot { opacity: 0.5; cursor: not-allowed; }

.customer-prefs {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 2px;
}

/* 订单气泡 */
.order-bubble {
  background: linear-gradient(135deg, #FFECD2, #FCB69F);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 8px 12px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: pulse-bubble 1.5s ease-in-out infinite;
}

.order-bubble:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(232,145,58,0.4);
}

@keyframes pulse-bubble {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,145,58,0.3); }
  50% { box-shadow: 0 0 12px 4px rgba(232,145,58,0.2); }
}

.order-hint {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
}

.bubble-icon {
  font-size: 16px;
}

.bubble-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--dark);
}

/* 红色氛围光（顾客耐心见底时） */
.atmosphere-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 10000;
  background: radial-gradient(circle at center, transparent 40%, rgba(244, 67, 54, 0) 100%);
  transition: background 0.5s ease;
  box-shadow: inset 0 0 0 0 rgba(244, 67, 54, 0);
}
.atmosphere-overlay.active {
  background: radial-gradient(circle at center, transparent 30%, rgba(244, 67, 54, 0.15) 100%);
  box-shadow: inset 0 0 100px 40px rgba(244, 67, 54, 0.3);
  animation: pulse-red 1s ease-in-out infinite;
}
@keyframes pulse-red {
  0%, 100% { box-shadow: inset 0 0 100px 40px rgba(244, 67, 54, 0.3); }
  50% { box-shadow: inset 0 0 120px 50px rgba(244, 67, 54, 0.45); }
}

/* 顾客拖放高亮 */
.customer-card.drop-target {
  border-color: var(--success) !important;
  background: rgba(76, 175, 80, 0.15) !important;
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
  transition: all 0.15s ease;
}
.customer-card.drop-target .customer-avatar {
  animation: bounce 0.4s ease infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* 配料选择区 */
.ingredients-area {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.ingredient-group {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 2px 8px var(--shadow);
}

.group-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--dark);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.group-title .hint {
  font-size: 11px;
  color: var(--text-light);
  font-weight: 400;
}

.option-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.option-btn {
  padding: 8px 14px;
  border: 2px solid var(--border);
  border-radius: 20px;
  background: var(--light-bg);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.option-btn:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

.option-btn.selected {
  background: linear-gradient(135deg, var(--accent), var(--dark));
  color: #fff;
  border-color: var(--accent);
}

/* Toast */
.toast-container {

  top: 70px;
  left: 50%;

  to { opacity: 1; transform: translateY(0) scale(1); }

  pointer-events: none;
}

@keyframes splash-animation {
  0% {
    opacity: 1;
    transform: scale(0) translateY(0) rotate(0deg);
  }
  30% {
    opacity: 1;
    transform: scale(1.5) translateY(-50px) rotate(30deg);
  }
  100% {
    opacity: 0;
    transform: scale(0.5) translateY(200px) rotate(-30deg);
  }

.splash-drop.animate {

function showToast(msg) {

  container.appendChild(el);

// ==================== 科技树 ====================

function openTechTree() {
  renderTechTree();
  document.getElementById('techTreeOverlay').classList.add('show');
}

function closeTechTree(event) {
  if (event && event.target !== document.getElementById('techTreeOverlay')) return;
  document.getElementById('techTreeOverlay').classList.remove('show');
}

function getTechById(techId) {
  for (const [, category] of Object.entries(TECH_TREE)) {
    const found = findTechInCategory(category, techId);
    if (found) return found;
  }
  return null;
}

function findTechInCategory(category, techId) {
  if (category.children) {
    for (const [id, tech] of Object.entries(category.children)) {
      if (id === techId) return tech;
      const found = findTechInCategory(tech, techId);
      if (found) return found;
    }
  }
  return null;
}

function renderTechTree() {
  const content = document.getElementById('techTreeContent');
  let html = '<div class="tech-tree-main">';

  for (const [, category] of Object.entries(TECH_TREE)) {
    html += `<div class="tech-tree-category">
      <div class="tech-tree-category-header">
        <div class="tech-tree-category-icon" style="background: linear-gradient(135deg, ${category.color}, ${category.color}80)">
          ${category.icon}
        </div>
        <div class="tech-tree-category-name">${category.name}</div>
      </div>
      <div class="tech-tree-branch">`;

    html += renderTechBranch(category.children || {}, '');

    html += `</div></div>`;
  }

  html += '</div>';
  content.innerHTML = html;
}

function renderTechBranch(children, prefix) {
  let html = '';
  const childKeys = Object.keys(children);

  for (let i = 0; i < childKeys.length; i++) {
    const key = childKeys[i];
    const tech = children[key];
    const fullId = prefix ? `${prefix}_${key}` : key;
    const currentLevel = state.techLevels[fullId] || 0;
    const isMaxed = currentLevel >= tech.maxLevel;
    const levelInfo = tech.levels[currentLevel] || tech.levels[tech.maxLevel - 1];
    const canUpgrade = !isMaxed && state.coins >= levelInfo.cost;
    const hasChildren = tech.children && Object.keys(tech.children).length > 0;

    html += `<div class="tech-tree-line">
      <div class="tech-tree-connector ${currentLevel > 0 ? 'active' : ''} ${isMaxed ? 'maxed' : ''}"></div>
      <div class="tech-tree-item ${isMaxed ? 'maxed' : ''}">
        ${isMaxed ? '<div class="tech-tree-badge">已满级</div>' : ''}
        <div class="tech-tree-item-header">
          <div class="tech-tree-item-icon">${tech.icon}</div>
          <div class="tech-tree-item-info">
            <div class="tech-tree-item-name">${tech.name}</div>
            <div class="tech-tree-item-level">等级 ${currentLevel}/${tech.maxLevel}</div>
          </div>
        </div>
        <div class="tech-tree-item-desc">${levelInfo.desc}</div>
        <div class="tech-tree-item-footer">
          <div class="tech-tree-item-cost">
            <span class="coin-icon">🪙</span>
            <span>${levelInfo.cost}</span>
          </div>
          <button class="tech-tree-upgrade-btn ${isMaxed ? 'maxed' : ''}"
                  ${isMaxed || !canUpgrade ? 'disabled' : ''}
                  onclick="upgradeTech('${fullId}')">
            ${isMaxed ? '已满级' : canUpgrade ? '升级' : '金币不足'}
          </button>
        </div>
      </div>`;

    if (hasChildren) {
      html += `<div class="tech-tree-branch">${renderTechBranch(tech.children, fullId)}</div>`;
    }

    html += '</div>';
  }

  return html;
}

function upgradeTech(techId) {
  const tech = getTechById(techId);
  if (!tech) return;

  const currentLevel = state.techLevels[techId] || 0;

  if (currentLevel >= tech.maxLevel) return;

  const levelInfo = tech.levels[currentLevel];
  if (state.coins < levelInfo.cost) {
    showToast('🪙 金币不足！');
    return;
  }

  state.coins -= levelInfo.cost;
  state.techLevels[techId] = currentLevel + 1;

  applyTechEffect(techId, currentLevel + 1);

  showToast(`✅ ${tech.name} 升级成功！等级 ${currentLevel + 1}`);
  updateUI();
  renderTechTree();
  saveState();
}

function applyTechEffect(techId, level) {
  if (techId === 'equipment_iceMachine_cupCapacity_customerCapacity') {
    showToast(`📈 顾客上限提升至 ${getCustomerCapacity()} 人！`);
  } else if (techId === 'efficiency_autoAccept') {
    showToast(`⚡ 自动接单速度提升 ${level * 20}%！`);
  } else if (techId === 'efficiency_autoAccept_autoShake') {
    showToast(`🥤 摇晃速度提升 ${level * 15}%！`);
  } else if (techId === 'customerExp_patience') {
    showToast(`❤️ 顾客耐心提升 ${level * 10}%！`);
  } else if (techId === 'customerExp_patience_tipBonus') {
    showToast(`💰 小费概率提升 ${level * 10}%！`);
  } else if (techId === 'equipment_iceMachine') {
    showToast(`🧊 冰块容量提升 ${level * 20}%！`);
  } else if (techId === 'equipment_iceMachine_cupCapacity') {
    showToast(`🥤 杯子容量升级！售价提升 ${level * 15}%！`);
  } else if (techId === 'recipe_recipeUnlock') {
    showToast('🌟 解锁隐藏配方！');
  } else if (techId === 'expansion_vipCustomer') {
    showToast('👑 VIP顾客概率提升！');
  }
}

function getCustomerCapacity() {
  const level = state.techLevels['equipment_iceMachine_cupCapacity_customerCapacity'] || 0;
  return BASE_CUSTOMER_CAPACITY + level;
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = [...a].sort();
  const sortedB = [...b].sort();
  return sortedA.every((val, idx) => val === sortedB[idx]);
}

function loadState() {
  try {
    const saved = localStorage.getItem('milkTeaShop');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...DEFAULT_STATE, ...parsed };
      state.customers = [];
      state.isMaking = false;
      state.isShaking = false;
      state.shakeProgress = 0;
      state.isReadyToServe = false;
      state.lastFinishedRecipe = null;
      state.currentServingCustomer = null;
      state.isOpen = false;
      state.currentSelection = { teaBase: null, milkBase: null, toppings: [], sweetness: null, temperature: null };
      state.techLevels = state.techLevels || {}; // 确保techLevels存在
    } else {
      state = { ...DEFAULT_STATE };
    }
  } catch (e) {
    state = { ...DEFAULT_STATE };
  }
}

function saveState() {
  state.lastSaveTime = Date.now();
  try {
    const toSave = { ...state };
    delete toSave.customers;
    delete toSave.isMaking;
    delete toSave.isShaking;
    delete toSave.shakeProgress;
    delete toSave.isReadyToServe;
    delete toSave.lastFinishedRecipe;
    delete toSave.currentServingCustomer;
    delete toSave.isOpen;
    localStorage.setItem('milkTeaShop', JSON.stringify(toSave));
  } catch (e) {}
}

// 匹配已解锁配方（只匹配茶底、奶底、小料，不包含甜度温度）
function matchRecipe(selection) {
  const unlocked = state.unlockedRecipes.map(id => RECIPES[id]);
  for (const recipe of unlocked) {
    if (recipe.teaBase === selection.teaBase &&
        recipe.milkBase === selection.milkBase &&
        arraysEqual(recipe.toppings, selection.toppings)) {
      return recipe;
    }
  }
  return null;
}

// 匹配任意配方（包括未解锁的）
function matchAnyRecipe(selection) {
  for (const recipe of RECIPES) {
    if (recipe.teaBase === selection.teaBase &&
        recipe.milkBase === selection.milkBase &&
        arraysEqual(recipe.toppings, selection.toppings)) {
      return recipe;
    }
  }
  return null;
}

// 检查甜度温度是否匹配顾客要求
function matchPreferences(customer, selection) {
  return customer.requestedSweetness === selection.sweetness &&
         customer.requestedTemperature === selection.temperature;
}

function spawnCustomer() {
  if (state.customers.length >= getCustomerCapacity()) return;

  const availableRecipes = state.unlockedRecipes;
  if (availableRecipes.length === 0) return;

  // 5%概率顾客点未解锁的配方
  const allRecipeIds = RECIPES.map((_, idx) => idx);
  const lockedRecipeIds = allRecipeIds.filter(id => !state.unlockedRecipes.includes(id));
  
  let recipeId;
  let isSecretRecipe = false;
  
  if (lockedRecipeIds.length > 0 && Math.random() < 0.05) {
    recipeId = lockedRecipeIds[Math.floor(Math.random() * lockedRecipeIds.length)];
    isSecretRecipe = true;
  } else {
    recipeId = availableRecipes[Math.floor(Math.random() * availableRecipes.length)];
  }
  
  const recipe = RECIPES[recipeId];

  const patienceSeconds = MIN_PATIENCE + Math.random() * (MAX_PATIENCE - MIN_PATIENCE);

  const sweetnessOptions = ['none', 'light', 'half', 'less', 'full'];
  const temperatureOptions = ['hot', 'normal', 'ice'];
  const requestedSweetness = sweetnessOptions[Math.floor(Math.random() * sweetnessOptions.length)];
  const requestedTemperature = temperatureOptions[Math.floor(Math.random() * temperatureOptions.length)];

  const customer = {
    id: Date.now() + Math.random(),
    name: CUSTOMER_NAMES[Math.floor(Math.random() * CUSTOMER_NAMES.length)],
    avatar: CUSTOMER_AVATARS[Math.floor(Math.random() * CUSTOMER_AVATARS.length)],
    orderedRecipeId: recipeId,
    requestedSweetness: requestedSweetness,
    requestedTemperature: requestedTemperature,
    accepted: false,
    patience: 100,
    maxPatience: 100,
    patienceSeconds: patienceSeconds,
    served: false,
    startTime: Date.now(),
    isSecretRecipe: isSecretRecipe
  };

  state.customers.push(customer);
  renderCustomers();
}

let lastCustomerCount = 0;
let lastCustomerPatience = [];

function updateCustomers(dt) {
  const now = Date.now();
  let hasLowPatience = false;
  let needReRender = false;

  const patienceLevel = state.techLevels['customerExp_patience'] || 0;
  const patienceBonus = 1 + patienceLevel * 0.1;

  for (let i = state.customers.length - 1; i >= 0; i--) {
    const customer = state.customers[i];
    if (customer.served) continue;

    const elapsed = (now - customer.startTime) / 1000;
    const adjustedPatienceSeconds = customer.patienceSeconds * patienceBonus;
    const patienceDecrease = (elapsed / adjustedPatienceSeconds) * 100;
    customer.patience = Math.max(0, 100 - patienceDecrease);

    // 检测是否有顾客耐心低于 20%
    if (customer.patience <= 20) {
      hasLowPatience = true;
    }

    if (customer.patience <= 0) {
      customerLeaveAngry(customer);
      state.customers.splice(i, 1);
      needReRender = true;
    }
  }

  // 检查顾客数量或接单状态变化
  if (state.customers.length !== lastCustomerCount) {
    needReRender = true;
    lastCustomerCount = state.customers.length;
  }

  // 只更新耐心条，不重建整个DOM
  if (!needReRender) {
    const cards = document.querySelectorAll('.customer-card');
    state.customers.forEach((customer, idx) => {
      if (idx < cards.length) {
        const fill = cards[idx].querySelector('.patience-fill');
        if (fill) {
          fill.style.width = `${customer.patience}%`;
          fill.className = `patience-fill ${customer.patience < 30 ? 'danger' : customer.patience < 60 ? 'warning' : ''}`;
        }
      }
    });
  } else {
    renderCustomers();
  }

  // 更新红色氛围光
  const overlay = document.getElementById('atmosphereOverlay');
  if (hasLowPatience) {
    overlay.classList.add('active');
  } else {
    overlay.classList.remove('active');
  }
}

function customerLeaveAngry(customer) {
  state.reputation = Math.max(0, state.reputation - 5);
  showToast(`${customer.name} 生气离开了！声望 -5`);
  renderTopBar();
  saveState();
}

function serveCustomer(customer, result) {
  const recipe = RECIPES[customer.orderedRecipeId];
  customer.served = true;
  
  let coins = 0;
  let repChange = 0;
  let resultType = '';
  let emoji = '';
  let title = '';
  let desc = '';
  
  if (result === 'perfect') {
    coins = recipe.price;
    repChange = 1;
    resultType = 'success';
    emoji = '🎉';
    title = '完美匹配！';
    desc = `${customer.name} 非常满意`;
    
    if (customer.isSecretRecipe) {
      state.unlockedRecipes.push(customer.orderedRecipeId);
      desc += `\n✨ 解锁新配方：${recipe.emoji}${recipe.name}！`;
      showToast(`🌟 恭喜！通过猜测解锁了新配方：${recipe.name}`);
    }
  } else if (result === 'partial') {
    coins = Math.floor(recipe.price * 0.5);
    repChange = -1;
    resultType = 'partial';
    emoji = '😐';
    title = '还可以吧...';
    desc = `${customer.name} 勉强接受了`;
    
    if (Math.random() < 0.3) {
      triggerCustomerRage(customer);
      desc += '（顾客很生气！）';
    }
  } else {
    coins = -Math.floor(recipe.price * 0.3);
    repChange = -10;
    resultType = 'fail';
    emoji = '🤮';
    title = '黑暗料理！';
    desc = `${customer.name} 愤怒地离开了（赔偿损失 🪙${Math.abs(coins)}）`;
    
    if (Math.random() < 0.5) {
      triggerCustomerRage(customer);
    }
  }

  const cupCapacityLevel = state.techLevels['equipment_iceMachine_cupCapacity'] || 0;
  const cupCapacityBonus = 1 + cupCapacityLevel * 0.15;
  if (coins > 0) {
    coins = Math.floor(coins * cupCapacityBonus);
  }

  const tipBonusLevel = state.techLevels['customerExp_patience_tipBonus'] || 0;
  const tipChance = tipBonusLevel * 0.1;
  if (result === 'perfect' && Math.random() < tipChance) {
    const tip = Math.floor(coins * 0.3);
    coins += tip;
    desc += `（获得小费 🪙${tip}）`;
  }
  
  state.coins += coins;
  state.reputation = Math.max(0, state.reputation + repChange);
  state.todayServed++;
  state.todayIncome += coins;
  state.todayRepChange += repChange;
  if (result === 'perfect') {
    state.todayPerfect++;
  }
  
  showResultModal(resultType, emoji, title, desc, coins);
  
  const idx = state.customers.findIndex(c => c.id === customer.id);
  if (idx >= 0) {
    state.customers.splice(idx, 1);
  }
  
  state.currentServingCustomer = null;
  renderTopBar();
  renderCustomers();
  
  if (state.coins < 0) {
    state.gameOver = true;
    saveState();
    showBankruptcy();
  } else {
    saveState();
  }
}

// ==================== 制作系统 ====================

function canMake() {
  const s = state.currentSelection;
  return s.teaBase && s.milkBase && s.sweetness && s.temperature && !state.isMaking && !state.isShaking && !state.isReadyToServe;
}

function makeTea() {
  if (!canMake()) {
    showToast('请先选择完整配料！');
    return;
  }
  if (state.customers.length === 0) {
    showToast('没有顾客需要服务~');
    return;
  }

  state.isMaking = true;
  state.isShaking = true;
  state.shakeProgress = 0;

  document.getElementById('makeBtn').disabled = true;
  document.getElementById('shakeMeter').classList.add('active');
  document.getElementById('cupContainer').classList.add('shake-mode');

  if (state.autoShaker) {
    // 自动摇茶机：自动填充摇晃进度
    document.getElementById('shakeHint').textContent = '🤖 自动摇茶机工作中...';
  } else {
    document.getElementById('shakeHint').textContent = '左右拖动杯子来摇匀奶茶~';
  }
}

function finishMake() {
  state.isMaking = false;
  state.isShaking = false;
  state.isReadyToServe = true;

  // 确保最终混合状态
  state.shakeProgress = 100;
  updateCupVisual();

  document.getElementById('makeBtn').disabled = true;
  document.getElementById('shakeMeter').classList.remove('active');
  document.getElementById('cupContainer').classList.remove('shake-mode', 'dragging');
  document.getElementById('cupContainer').classList.add('serving');
  document.getElementById('shakeMeterFill').style.width = '0%';

  // 重置杯子位置
  const cup = document.getElementById('cupWrapper');
  cup.style.transform = 'translateX(-50%)';

  // 计算配方匹配结果（但不立即服务）
  const selection = state.currentSelection;
  const matchedRecipe = matchRecipe(selection);
  const anyRecipe = matchAnyRecipe(selection);
  state.lastFinishedRecipe = matchedRecipe || anyRecipe;

  showToast('🥤 奶茶制作完成！拖动杯子到顾客完成送达');
}

// ==================== 杯子拖拽/摇晃 ====================

function setupCupDrag() {
  const container = document.getElementById('cupContainer');
  const cup = document.getElementById('cupWrapper');

  // 记录最后指针位置（供 onEnd 使用）
  let lastPointerX = 0, lastPointerY = 0;
  document.addEventListener('mousemove', (e) => { lastPointerX = e.clientX; lastPointerY = e.clientY; });
  document.addEventListener('touchmove', (e) => { if (e.touches[0]) { lastPointerX = e.touches[0].clientX; lastPointerY = e.touches[0].clientY; } });

  function onStart(e) {
    // 送达模式：拖动杯子到顾客
    if (state.isReadyToServe) {
      cupDrag.isDragging = true;
      cupDrag.startX = e.clientX;
      cupDrag.lastX = e.clientX;
      cupDrag.lastTime = performance.now();
      cupDrag.velocity = 0;
      cupDrag.cupX = 0;
      cupDrag.cupY = 0;
      container.classList.add('dragging');
      e.preventDefault();
      return;
    }
    // 摇晃模式：拖动摇晃
    if (!state.isShaking || state.autoShaker) return;
    cupDrag.isDragging = true;
    cupDrag.startX = e.clientX;
    cupDrag.lastX = e.clientX;
    cupDrag.lastTime = performance.now();
    cupDrag.velocity = 0;
    cupDrag.lastDir = 0;
    container.classList.add('dragging');
    e.preventDefault();
  }

  function onMove(e) {
    if (!cupDrag.isDragging) return;
    const x = e.clientX;
    const y = e.clientY;
    const now = performance.now();
    const dt = Math.max(0.001, (now - cupDrag.lastTime) / 1000);

    if (state.isReadyToServe) {
      // 送达模式：自由拖动（跟随鼠标），设置最高图层
      container.style.zIndex = '9999';
      const containerRect = container.getBoundingClientRect();
      const dx = x - containerRect.left - containerRect.width / 2;
      const dy = y - containerRect.top - containerRect.height / 2;
      cupDrag.cupX = dx;
      cupDrag.cupY = dy;

      // 计算速度（用于粒子物理）
      cupDrag.velocity = (x - cupDrag.lastX) / dt;

      cup.style.transform = `translate(calc(-50% + ${dx}px), ${dy}px)`;

      // 检测是否悬停在顾客头像上
      highlightTargetCustomer(x, y);
      cupDrag.lastX = x;
      cupDrag.lastTime = now;
      return;
    }

    // 摇晃模式：左右拖动
    const dx = x - cupDrag.startX;
    cupDrag.cupX = Math.max(-60, Math.min(60, dx));
    cupDrag.velocity = (x - cupDrag.lastX) / dt;
    cupDrag.cupRotation = Math.max(-15, Math.min(15, cupDrag.velocity * 0.01));
    cup.style.transform = `translateX(calc(-50% + ${cupDrag.cupX}px)) rotate(${cupDrag.cupRotation}deg)`;

    const dir = Math.sign(x - cupDrag.lastX);
    if (dir !== 0 && dir !== cupDrag.lastDir && cupDrag.lastDir !== 0) {
      const speed = Math.abs(cupDrag.velocity);
      if (speed > 80) {
        registerShake(dir, speed);
      }
    }
    if (dir !== 0) cupDrag.lastDir = dir;

    cupDrag.lastX = x;
    cupDrag.lastTime = now;
  }

  function onEnd() {
    if (!cupDrag.isDragging) return;
    cupDrag.isDragging = false;
    container.classList.remove('dragging');

    if (state.isReadyToServe) {
      // 送达模式：检查是否在顾客头像上释放
      const targetCustomer = getTargetCustomer(lastPointerX, lastPointerY);
      if (targetCustomer) {
        deliverToCustomer(targetCustomer);
      } else {
        // 没有命中顾客，杯子回原位
        cup.style.transition = 'transform 0.3s ease';
        cup.style.transform = 'translateX(-50%)';
        setTimeout(() => { cup.style.transition = ''; }, 300);
      }
      clearCustomerHighlight();
      cupDrag.cupX = 0;
      cupDrag.cupY = 0;
      container.style.zIndex = '';
      return;
    }

    // 摇晃模式回正
    cup.style.transition = 'transform 0.3s ease';
    cup.style.transform = 'translateX(-50%)';
    setTimeout(() => { cup.style.transition = ''; }, 300);
    cupDrag.cupX = 0;
    cupDrag.cupRotation = 0;
  }

  // 记录最后指针位置
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', (e) => { if (cupDrag.isDragging) onMove(e.touches[0]); }, { passive: false });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);

  container.addEventListener('mousedown', onStart);
  container.addEventListener('touchstart', (e) => onStart(e.touches[0]), { passive: false });
}

// 检测拖动到哪个顾客
let highlightedCustomerId = null;

function highlightTargetCustomer(x, y) {
  const customerCards = document.querySelectorAll('.customer-card');
  let found = null;
  customerCards.forEach((card, idx) => {
    const rect = card.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      found = state.customers[idx];
      card.classList.add('drop-target');
    } else {
      card.classList.remove('drop-target');
    }
  });
  highlightedCustomerId = found ? found.id : null;
}

function getTargetCustomer(x, y) {
  const customerCards = document.querySelectorAll('.customer-card');
  for (let i = 0; i < customerCards.length; i++) {
    const rect = customerCards[i].getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return state.customers[i];
    }
  }
  return null;
}

function clearCustomerHighlight() {
  document.querySelectorAll('.customer-card.drop-target').forEach(c => c.classList.remove('drop-target'));
  highlightedCustomerId = null;
}

function deliverToCustomer(customer) {
  // 只能送达已接单的顾客
  if (!customer.accepted) {
    showToast('⚠️ 请先点击订单气泡接单');
    return;
  }

  const selection = state.currentSelection;
  const matchedRecipe = matchRecipe(selection);
  const anyRecipe = matchAnyRecipe(selection);
  const prefMatch = matchPreferences(customer, selection);

  state.currentServingCustomer = customer;

  if (matchedRecipe && matchedRecipe.id === customer.orderedRecipeId && prefMatch) {
    // 配方正确 + 甜度温度匹配 = 完美
    serveCustomer(customer, 'perfect');
  } else if (matchedRecipe && matchedRecipe.id === customer.orderedRecipeId && !prefMatch) {
    // 配方正确但甜度温度不符 = 勉强
    serveCustomer(customer, 'partial');
  } else if (anyRecipe) {
    // 其他有效配方 = 勉强
    serveCustomer(customer, 'partial');
  } else {
    // 黑暗料理
    serveCustomer(customer, 'dark');
  }

  // 重置送达状态
  state.isReadyToServe = false;
  document.getElementById('cupContainer').classList.remove('serving');
  document.getElementById('makeBtn').disabled = false;

  // 杯子回原位
  const cup = document.getElementById('cupWrapper');
  cup.style.transition = 'transform 0.3s ease';
  cup.style.transform = 'translateX(-50%)';
  setTimeout(() => { cup.style.transition = ''; }, 300);

  resetSelection();
}

function registerShake(dir, speed) {
  if (!state.isShaking) return;

  // 每次摇晃增加进度（与速度相关）
  const gain = Math.min(15, 5 + speed * 0.02);
  state.shakeProgress = Math.min(100, state.shakeProgress + gain);
  cupDrag.shakeCount++;

  // 给小料粒子施加冲击力
  for (const p of physics.particles) {
    p.vx += dir * (80 + Math.random() * 60);
    p.vy += 40 + Math.random() * 60;
  }

  // 更新进度条
  document.getElementById('shakeMeterFill').style.width = `${state.shakeProgress}%`;

  // 更新液体分层混合效果
  updateCupVisual();

  if (state.shakeProgress >= 100) {
    finishMake();
  }
}

// ==================== 小料物理系统 ====================

function updatePhysics(dt) {
  const cupVelX = cupDrag.isDragging ? cupDrag.velocity : 0;

  // ---- 小料粒子（沉在底部） ----
  const W = physics.containerW;
  const H = physics.containerH;
  for (const p of physics.particles) {
    // 重力
    p.vy -= physics.gravity * dt;
    // 惯性
    p.vx -= cupVelX * 1.2 * dt;
    // 更新位置
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // 边界碰撞
    if (p.x < p.radius) { p.x = p.radius; p.vx = Math.abs(p.vx) * physics.bounce; }
    if (p.x > W - p.radius) { p.x = W - p.radius; p.vx = -Math.abs(p.vx) * physics.bounce; }
    if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy) * 0.3; }
    if (p.y > H - p.radius) { p.y = H - p.radius; p.vy = -Math.abs(p.vy) * 0.3; }
    // 阻尼
    p.vx *= physics.damping;
    p.vy *= 0.99;
    // 更新DOM
    p.el.style.left = `${p.x - p.radius}px`;
    p.el.style.bottom = `${p.y}px`;
  }

  // 小料粒子间碰撞（简单圆形碰撞）
  for (let i = 0; i < physics.particles.length; i++) {
    for (let j = i + 1; j < physics.particles.length; j++) {
      const a = physics.particles[i];
      const b = physics.particles[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = a.radius + b.radius;
      if (dist < minDist && dist > 0) {
        // 推开
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist;
        const ny = dy / dist;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
        // 交换速度（简化弹性碰撞）
        const av = a.vx * nx + a.vy * ny;
        const bv = b.vx * nx + b.vy * ny;
        a.vx += (bv - av) * nx * 0.5;
        a.vy += (bv - av) * ny * 0.5;
        b.vx += (av - bv) * nx * 0.5;
        b.vy += (av - bv) * ny * 0.5;
      }
    }
  }

  // ---- 冰块粒子（浮在顶部） ----
  const IW = physics.iceContainerW;
  const IH = physics.iceContainerH;
  for (const p of physics.iceParticles) {
    // 浮力（向上）
    p.vy += 200 * dt;
    // 惯性
    p.vx -= cupVelX * 1.0 * dt;
    // 更新位置
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // 边界碰撞（冰块浮在顶部，限制在顶部区域）
    if (p.x < p.radius) { p.x = p.radius; p.vx = Math.abs(p.vx) * physics.bounce; }
    if (p.x > IW - p.radius) { p.x = IW - p.radius; p.vx = -Math.abs(p.vx) * physics.bounce; }
    // 冰块顶部限制（不让冰块飞出杯口）
    if (p.y > IH - p.radius - 30) { p.y = IH - p.radius - 30; p.vy = -Math.abs(p.vy) * 0.4; }
    // 冰块底部限制（沉到一定深度后浮起）
    if (p.y < IH * 0.4) { p.y = IH * 0.4; p.vy = Math.abs(p.vy) * 0.3; }
    // 阻尼
    p.vx *= physics.damping;
    p.vy *= 0.97;
    // 更新DOM（冰块用 top 定位）
    p.el.style.left = `${p.x - p.radius}px`;
    p.el.style.top = `${IH - p.y - p.radius * 2}px`;
  }

  // 冰块间碰撞
  for (let i = 0; i < physics.iceParticles.length; i++) {
    for (let j = i + 1; j < physics.iceParticles.length; j++) {
      const a = physics.iceParticles[i];
      const b = physics.iceParticles[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = a.radius + b.radius;
      if (dist < minDist && dist > 0) {
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist;
        const ny = dy / dist;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
        const av = a.vx * nx + a.vy * ny;
        const bv = b.vx * nx + b.vy * ny;
        a.vx += (bv - av) * nx * 0.5;
        a.vy += (bv - av) * ny * 0.5;
        b.vx += (av - bv) * nx * 0.5;
        b.vy += (av - bv) * ny * 0.5;
      }
    }
  }
}

function buyAutoShaker() {
  if (state.autoShaker) return;
  if (state.coins < AUTO_SHAKER_COST) {
    showToast(`需要 ${AUTO_SHAKER_COST} 金币解锁`);
    return;
  }
  state.coins -= AUTO_SHAKER_COST;
  state.autoShaker = true;
  showToast('🤖 自动摇茶机已解锁！以后制作奶茶自动摇匀~');
  renderTopBar();
  renderAutoShaker();
  saveState();
}

function renderAutoShaker() {
  const btn = document.getElementById('autoShakerBtn');
  if (state.autoShaker) {
    btn.textContent = '🤖 自动摇茶机 已拥有 ✓';
    btn.className = 'auto-shaker-btn owned';
  } else if (state.coins >= AUTO_SHAKER_COST) {
    btn.textContent = `🤖 解锁自动摇茶机 (${AUTO_SHAKER_COST} 🪙)`;
    btn.className = 'auto-shaker-btn';
  } else {
    btn.textContent = `🤖 解锁自动摇茶机 (${AUTO_SHAKER_COST} 🪙)`;
    btn.className = 'auto-shaker-btn cannot';
  }
}

// ==================== 杯子可视化 ====================

function updateCupVisual() {
  const s = state.currentSelection;
  const liquid = document.getElementById('cupLiquid');
  const teaLayer = document.getElementById('cupLiquidTea');
  const milkLayer = document.getElementById('cupLiquidMilk');
  const toppingsEl = document.getElementById('cupToppings');
  const steam = document.getElementById('steam');
  const iceCubes = document.getElementById('iceCubes');

  // 重置所有液体层
  liquid.style.height = '0%';
  teaLayer.style.height = '0%';
  milkLayer.style.height = '0%';
  milkLayer.style.opacity = '1';

  let teaColor = '#8B4513';
  let teaHeight = 0;
  let milkHeight = 0;
  let blendedColor = null;

  if (s.teaBase) {
    const tea = TEA_BASES.find(t => t.id === s.teaBase);
    teaColor = tea.color;
    teaHeight = 55;
  }

  if (s.milkBase && s.milkBase !== 'none') {
    const milk = MILK_BASES.find(m => m.id === s.milkBase);
    milkHeight = 25;
    blendedColor = lightenColor(teaColor, milk.lighten);
  }

  // 小料增加液体高度
  if (s.toppings && s.toppings.length > 0) {
    teaHeight = Math.min(70, teaHeight + 4 * s.toppings.length);
  }

  // 摇晃后颜色混合（使用主液体层），摇晃前分层显示
  if (state.shakeProgress > 0) {
    // 摇晃中：主液体层显示混合色，分层逐渐消失
    const blendRatio = Math.min(1, state.shakeProgress / 100);
    if (blendedColor) {
      liquid.style.background = blendedColor;
      liquid.style.height = `${teaHeight + milkHeight * blendRatio}%`;
      teaLayer.style.height = `${teaHeight * (1 - blendRatio)}%`;
      milkLayer.style.height = `${milkHeight * (1 - blendRatio)}%`;
      milkLayer.style.bottom = `${teaHeight * (1 - blendRatio)}%`;
      milkLayer.style.opacity = `${1 - blendRatio * 0.7}`;
    } else {
      liquid.style.background = teaColor;
      liquid.style.height = `${teaHeight}%`;
    }
  } else {
    // 未摇晃：分层显示
    if (s.teaBase) {
      teaLayer.style.background = teaColor;
      teaLayer.style.height = `${teaHeight}%`;
    }
    if (s.milkBase && s.milkBase !== 'none') {
      milkLayer.style.height = `${milkHeight}%`;
      milkLayer.style.bottom = `${teaHeight}%`;
    }
  }

  // 重建小料粒子（仅在配料变化时）
  toppingsEl.innerHTML = '';
  physics.particles = [];

  if (s.toppings && s.toppings.length > 0) {
    for (const tid of s.toppings) {
      const topping = TOPPINGS.find(t => t.id === tid);
      if (topping) {
        // 每种小料 12 个粒子（带碰撞半径）
        for (let i = 0; i < 12; i++) {
          const fontSize = 10 + Math.random() * 6;
          const radius = fontSize / 2 + 1;
          const el = document.createElement('div');
          el.className = 'topping-particle';
          el.textContent = topping.emoji;
          el.style.fontSize = `${fontSize}px`;
          // 初始位置：网格分布 + 随机抖动，避免初始重叠
          const cols = 6;
          const rows = 2;
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cellW = physics.containerW / cols;
          const cellH = 25 / rows;
          const px = col * cellW + cellW / 2 + (Math.random() - 0.5) * 6;
          const py = row * cellH + 2 + (Math.random() - 0.5) * 4;
          el.style.left = `${px - radius}px`;
          el.style.bottom = `${py}px`;
          toppingsEl.appendChild(el);

          physics.particles.push({
            el,
            x: px,
            y: py,
            vx: 0,
            vy: 0,
            radius: radius
          });
        }
      }
    }
  }

  // 重建冰块粒子（温度为冰时）
  iceCubes.innerHTML = '';
  physics.iceParticles = [];

  if (s.temperature === 'ice') {
    // 4 个冰块粒子
    for (let i = 0; i < 4; i++) {
      const el = document.createElement('div');
      el.className = 'ice-cube';
      el.textContent = '🧊';
      el.style.fontSize = `${16 + Math.random() * 6}px`;
      const radius = 10;
      const px = 20 + i * 30 + (Math.random() - 0.5) * 10;
      const py = physics.iceContainerH * 0.7 + (Math.random() - 0.5) * 20;
      iceCubes.appendChild(el);

      physics.iceParticles.push({
        el,
        x: px,
        y: py,
        vx: 0,
        vy: 0,
        radius: radius
      });
    }
  }

  if (s.temperature === 'hot') {
    steam.classList.add('visible');
    iceCubes.classList.remove('visible');
  } else if (s.temperature === 'ice') {
    steam.classList.remove('visible');
    iceCubes.classList.add('visible');
  } else {
    steam.classList.remove('visible');
    iceCubes.classList.remove('visible');
  }
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, (num >> 16) + Math.floor(255 * amount));
  const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.floor(255 * amount));
  const b = Math.min(255, (num & 0x0000FF) + Math.floor(255 * amount));
  return `rgb(${r}, ${g}, ${b})`;
}

// ==================== 配料选择 ====================

function selectTeaBase(id) {
  if (state.isMaking || state.isShaking || state.isReadyToServe) return;
  state.currentSelection.teaBase = id;
  renderIngredients();
  playPourAnimation('tea');
  updateCupVisual();
}

function selectMilkBase(id) {
  if (state.isMaking || state.isShaking || state.isReadyToServe) return;
  state.currentSelection.milkBase = id;
  renderIngredients();
  if (id !== 'none') playPourAnimation('milk');
  updateCupVisual();
}

function toggleTopping(id, btnEl) {
  if (state.isMaking || state.isShaking || state.isReadyToServe) return;
  const toppings = state.currentSelection.toppings;
  const idx = toppings.indexOf(id);

  if (idx >= 0) {
    toppings.splice(idx, 1);
  } else {
    if (toppings.length >= 2) {
      showToast('最多只能选2种小料哦~');
      return;
    }
    toppings.push(id);
    // 小料飞入动画
    if (btnEl) flyToppingToCup(btnEl, id);
  }

  renderIngredients();
  updateCupVisual();
}

// 小料飞入杯子动画 - 多个粒子同时飞入
function flyToppingToCup(btnEl, toppingId) {
  const topping = TOPPINGS.find(t => t.id === toppingId);
  if (!topping) return;

  const btnRect = btnEl.getBoundingClientRect();
  const cupEl = document.getElementById('cup');
  const cupRect = cupEl.getBoundingClientRect();

  // 创建 5 个粒子同时飞入
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const fly = document.createElement('div');
      fly.className = 'fly-topping';
      fly.textContent = topping.emoji;
      
      // 初始位置：按钮中心附近，带随机偏移
      const offsetX = (Math.random() - 0.5) * 30;
      const offsetY = (Math.random() - 0.5) * 10;
      fly.style.left = `${btnRect.left + btnRect.width / 2 - 12 + offsetX}px`;
      fly.style.top = `${btnRect.top + btnRect.height / 2 - 12 + offsetY}px`;
      fly.style.transform = 'scale(1.3)';
      fly.style.opacity = '1';
      fly.style.zIndex = '9999';
      document.body.appendChild(fly);

      // 目标位置：杯子内部，带随机偏移
      const targetOffsetX = (Math.random() - 0.5) * 40;
      const targetOffsetY = Math.random() * 20;

      // 确保初始位置已渲染后再触发过渡
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          fly.style.left = `${cupRect.left + cupRect.width / 2 - 12 + targetOffsetX}px`;
          fly.style.top = `${cupRect.top + cupRect.height * 0.6 + targetOffsetY}px`;
          fly.style.transform = 'scale(0.5) rotate(' + (Math.random() - 0.5) * 30 + 'deg)';
          fly.style.opacity = '0';
        });
      });

      setTimeout(() => fly.remove(), 600);
    }, i * 50);
  }
}

// 茶底/奶底倒入动画
function playPourAnimation(type) {
  const cupEl = document.getElementById('cup');
  const cupRect = cupEl.getBoundingClientRect();
  const liquid = document.getElementById('cupLiquid');

  // 创建倒入流元素
  const stream = document.createElement('div');
  stream.className = 'pour-stream';
  stream.style.position = 'fixed';
  stream.style.left = `${cupRect.left + cupRect.width / 2 - 4}px`;
  stream.style.top = `${cupRect.top - 60}px`;
  stream.style.height = '0px';
  stream.style.transition = 'height 0.3s ease, top 0.3s ease';

  if (type === 'tea') {
    stream.style.background = 'linear-gradient(180deg, rgba(139,69,19,0.8), rgba(139,69,19,0.3))';
  } else {
    stream.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,250,240,0.4))';
  }

  document.body.appendChild(stream);

  // 动画：流下来
  requestAnimationFrame(() => {
    stream.style.height = '60px';
    stream.style.top = `${cupRect.top}px`;
  });

  // 液体波纹效果
  liquid.classList.add('pouring');

  setTimeout(() => {
    stream.style.opacity = '0';
    setTimeout(() => stream.remove(), 200);
  }, 600);

  setTimeout(() => {
    liquid.classList.remove('pouring');
  }, 1500);
}

  if (state.isMaking || state.isShaking || state.isReadyToServe) return;
  state.currentSelection.sweetness = id;
  renderIngredients();
}

function selectTemperature(id) {
  if (state.isMaking || state.isShaking || state.isReadyToServe) return;
  state.currentSelection.temperature = id;
  renderIngredients();
  updateCupVisual();
}

// ==================== 配方图鉴 ====================

function toggleRecipeDetail(id) {
  const recipe = RECIPES.find(r => r.id === id);
  const isUnlocked = state.unlockedRecipes.includes(id);
  
  if (!isUnlocked) {
    if (state.coins >= recipe.unlockCost) {
      unlockRecipe(id);
      return;
    } else {
      showToast(`需要 ${recipe.unlockCost} 金币解锁`);
      return;
    }
  }
  
  if (state.selectedRecipeDetail === id) {
    state.selectedRecipeDetail = null;
  } else {
    state.selectedRecipeDetail = id;
  }
  
  renderRecipes();
}

function unlockRecipe(id) {
  const recipe = RECIPES[id];
  if (state.unlockedRecipes.includes(id)) return;
  if (state.coins < recipe.unlockCost) return;
  
  state.coins -= recipe.unlockCost;
  state.unlockedRecipes.push(id);
  
  showToast(`🎉 解锁了新配方：${recipe.emoji} ${recipe.name}！`);
  renderTopBar();
  renderRecipes();
  saveState();
}

function toggleShop() {
  state.isOpen = !state.isOpen;
  const btn = document.getElementById('toggleBtn');
  
  if (state.isOpen) {
    btn.textContent = '休息';
    btn.className = 'toggle-btn open';
    
    if (!state.isDayStarted) {
      state.isDayStarted = true;
      state.gameTime = GAME_START_TIME;
      showToast(`📅 第 ${state.day} 天开始营业！营业时间: 09:00 - 18:00`);
    } else {
      showToast('🏪 继续营业！欢迎光临~');
    }
    
    state.lastCustomerSpawn = Date.now();
    nextSpawnInterval = 8000 + Math.random() * 6000;
    spawnCustomer();
  } else {
    btn.textContent = '开始营业';
    btn.className = 'toggle-btn rest';
    showToast('今天营业结束，好好休息吧~');
  }
}

// ==================== UI 渲染 ====================

function renderTopBar() {
  document.getElementById('coinCount').textContent = formatNum(state.coins);
  document.getElementById('reputation').textContent = state.reputation;
  document.getElementById('dayCount').textContent = state.day;
  document.getElementById('todayServed').textContent = state.todayServed;
  renderAutoShaker();
}

function renderIngredients() {
  const s = state.currentSelection;
  
  const teaContainer = document.getElementById('teaBaseOptions');
  teaContainer.innerHTML = '';
  for (const tea of TEA_BASES) {
    const btn = document.createElement('button');
    btn.className = `option-btn ${s.teaBase === tea.id ? 'selected' : ''}`;
    btn.innerHTML = `${tea.emoji} ${tea.name}`;
    btn.onclick = () => selectTeaBase(tea.id);
    teaContainer.appendChild(btn);
  }
  
  const milkContainer = document.getElementById('milkBaseOptions');
  milkContainer.innerHTML = '';
  for (const milk of MILK_BASES) {
    const btn = document.createElement('button');
    btn.className = `option-btn ${s.milkBase === milk.id ? 'selected' : ''}`;
    btn.innerHTML = `${milk.emoji} ${milk.name}`;
    btn.onclick = () => selectMilkBase(milk.id);
    milkContainer.appendChild(btn);
  }
  
  const topContainer = document.getElementById('toppingOptions');
  topContainer.innerHTML = '';
  document.getElementById('toppingCount').textContent = s.toppings.length;
  
  for (const top of TOPPINGS) {
    const selected = s.toppings.includes(top.id);
    const disabled = !selected && s.toppings.length >= 2;
    const btn = document.createElement('button');
    btn.className = `option-btn ${selected ? 'selected' : ''} ${disabled ? 'disabled' : ''}`;
    btn.innerHTML = `${top.emoji} ${top.name}`;
    btn.onclick = () => toggleTopping(top.id, btn);
    topContainer.appendChild(btn);
  }
  
  const sweetContainer = document.getElementById('sweetnessOptions');
  sweetContainer.innerHTML = '';
  for (const sw of SWEETNESS) {
    const btn = document.createElement('button');
    btn.className = `option-btn ${s.sweetness === sw.id ? 'selected' : ''}`;
    btn.textContent = sw.name;
    btn.onclick = () => selectSweetness(sw.id);
    sweetContainer.appendChild(btn);
  }
  
  const tempContainer = document.getElementById('temperatureOptions');
  tempContainer.innerHTML = '';
  for (const temp of TEMPERATURE) {
    const btn = document.createElement('button');
    btn.className = `option-btn ${s.temperature === temp.id ? 'selected' : ''}`;
    btn.innerHTML = `${temp.emoji} ${temp.name}`;
    btn.onclick = () => selectTemperature(temp.id);
    tempContainer.appendChild(btn);
  }
  
  document.getElementById('makeBtn').disabled = !canMake() || state.customers.length === 0;
}

function renderCustomers() {
  const container = document.getElementById('customerList');

  if (state.customers.length === 0) {
    container.innerHTML = `<div class="empty-hint">${state.isOpen ? '暂无顾客...' : '点击"开始营业"吧~'}</div>`;
    return;
  }

  container.innerHTML = '';

  state.customers.forEach((customer, idx) => {
    const recipe = RECIPES[customer.orderedRecipeId];
    const patiencePercent = customer.patience;

    let patienceClass = '';
    if (patiencePercent < 30) patienceClass = 'danger';
    else if (patiencePercent < 60) patienceClass = 'warning';

    const card = document.createElement('div');
    card.className = `customer-card ${idx === 0 ? 'active' : ''} ${!customer.accepted ? 'waiting' : ''}`;

    // 未接单时显示订单气泡（点击接单），接单后显示完整订单
    if (!customer.accepted) {
      card.innerHTML = `
        <div class="customer-header">
          <div class="customer-avatar">${customer.avatar}</div>
          <div class="customer-info">
            <div class="customer-name">${customer.name}</div>
            <div class="order-hint">点击卡片接单</div>
          </div>
          <div class="order-bubble">
            <div class="bubble-icon">📋</div>
            <div class="bubble-text">接单</div>
          </div>
        </div>
        <div class="patience-bar">
          <div class="patience-fill ${patienceClass}" style="width: ${patiencePercent}%"></div>
        </div>
      `;
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => acceptOrder(idx));
    } else {
      const sweetness = SWEETNESS.find(s => s.id === customer.requestedSweetness);
      const temperature = TEMPERATURE.find(t => t.id === customer.requestedTemperature);
      
      const recipeName = customer.isSecretRecipe ? '❓ 神秘配方' : `${recipe.emoji} ${recipe.name}`;

      card.innerHTML = `
        <div class="customer-header">
          <div class="customer-avatar">${customer.avatar}</div>
          <div class="customer-info">
            <div class="customer-name">${customer.name}</div>
            <div class="customer-order">${recipeName}</div>
            ${customer.isSecretRecipe ? '<div class="secret-hint">✨ 猜对配方可免费解锁！</div>' : ''}
            <div class="customer-prefs">${sweetness.emoji}${sweetness.name} · ${temperature.emoji}${temperature.name}</div>
          </div>
        </div>
        <div class="patience-bar">
          <div class="patience-fill ${patienceClass}" style="width: ${patiencePercent}%"></div>
        </div>
      `;
    }
    
    container.appendChild(card);
  });

  document.getElementById('makeBtn').disabled = !canMake() || state.customers.length === 0 || !state.customers.some(c => c.accepted);
}

function acceptOrder(idx) {
  if (!state || !state.isOpen) {
    showToast('⚠️ 请先开始营业才能接单！');
    return;
  }
  const customer = state.customers[idx];
  if (!customer) {
    showToast('⚠️ 顾客不存在！');
    return;
  }
  if (customer.accepted) {
    showToast('⚠️ 已接单！');
    return;
  }
  customer.accepted = true;
  showToast(`✅ 接单成功！${customer.name}的订单`);
  lastCustomerCount = -1; // 强制重新渲染
  renderCustomers();
}

function renderRecipes() {
  const container = document.getElementById('recipeList');
  container.innerHTML = '';

  for (const recipe of RECIPES) {
    const unlocked = state.unlockedRecipes.includes(recipe.id);
    const selected = state.selectedRecipeDetail === recipe.id;
    const canUnlock = !unlocked && state.coins >= recipe.unlockCost;

    // 配方卡片容器（包含主卡片 + 展开详情）
    const wrapper = document.createElement('div');
    wrapper.className = `recipe-wrapper ${selected ? 'expanded' : ''}`;

    const item = document.createElement('div');
    item.className = `recipe-item ${selected ? 'selected' : ''} ${!unlocked ? 'locked' : ''} ${canUnlock ? 'can-unlock' : ''}`;

    if (unlocked) {
      item.innerHTML = `
        <div class="recipe-emoji">${recipe.emoji}</div>
        <div class="recipe-info">
          <div class="recipe-name">${recipe.name}</div>
          <div class="recipe-price">💰 ${recipe.price} 金币</div>
        </div>
        <div class="recipe-expand-icon">${selected ? '▾' : '▸'}</div>
      `;
    } else {
      item.innerHTML = `
        <div class="recipe-emoji">🔒</div>
        <div class="recipe-info">
          <div class="recipe-name">${recipe.name}</div>
          <div class="recipe-unlock">🔓 ${recipe.unlockCost} 金币解锁</div>
        </div>
        <div class="recipe-expand-icon">${selected ? '▾' : '▸'}</div>
      `;
    }

    item.onclick = () => toggleRecipeDetail(recipe.id);
    wrapper.appendChild(item);

    // 展开详情卡片
    if (selected) {
      const detail = document.createElement('div');
      detail.className = 'recipe-detail-card';
      const tea = TEA_BASES.find(t => t.id === recipe.teaBase);
      const milk = MILK_BASES.find(m => m.id === recipe.milkBase);

      let toppingsText = '无';
      if (recipe.toppings.length > 0) {
        toppingsText = recipe.toppings.map(tid => {
          const t = TOPPINGS.find(top => top.id === tid);
          return t ? `${t.emoji}${t.name}` : tid;
        }).join('、');
      }

      detail.innerHTML = `
        <div class="detail-section-title">📋 配方详情</div>
        <div class="detail-row">
          <span class="label">售价</span>
          <span class="value">💰 ${recipe.price} 金币</span>
        </div>
        <div class="detail-row">
          <span class="label">茶底</span>
          <span class="value">${tea.emoji} ${tea.name}</span>
        </div>
        <div class="detail-row">
          <span class="label">奶底</span>
          <span class="value">${milk.emoji} ${milk.name}</span>
        </div>
        <div class="detail-row">
          <span class="label">小料</span>
          <span class="value">${toppingsText}</span>
        </div>
        <div class="detail-tip">💡 甜度和温度由顾客随机指定</div>
      `;
      wrapper.appendChild(detail);
    }

    container.appendChild(wrapper);
  }
}

// ==================== 游戏主循环 ====================

function gameLoop(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;

  const isCleaning = document.getElementById('cleaningBlocker').classList.contains('active');
  
  if (state && state.isOpen && !isCleaning) {
    updateGameTime(dt);
    updateCustomers(dt);

    const now = Date.now();
    if (now - state.lastCustomerSpawn > nextSpawnInterval && state.customers.length < getCustomerCapacity()) {
      spawnCustomer();
      state.lastCustomerSpawn = now;
      nextSpawnInterval = 8000 + Math.random() * 6000;
    }

    // 自动接单（科技树效果）
    const autoAcceptLevel = state.techLevels['efficiency_autoAccept'] || 0;
    if (autoAcceptLevel > 0) {
      for (let i = 0; i < state.customers.length; i++) {
        const customer = state.customers[i];
        if (!customer.accepted && (now - customer.startTime) > 1000) {
          customer.accepted = true;
          showToast(`✅ 自动接单！${customer.name}的订单`);
          renderCustomers();
          break;
        }
      }
    }
  }

  // 小料物理更新
  updatePhysics(dt);

  // 摇晃阶段逻辑
  if (state.isShaking) {
    if (state.autoShaker) {
      // 自动摇茶机：自动填充进度（受科技树等级影响）
      const shakeLevel = state.techLevels['efficiency_autoAccept_autoShake'] || 0;
      const shakeSpeed = 35 * (1 + shakeLevel * 0.15);
      const oldProgress = state.shakeProgress;
      state.shakeProgress = Math.min(100, state.shakeProgress + shakeSpeed * dt);
      document.getElementById('shakeMeterFill').style.width = `${state.shakeProgress}%`;

      // 模拟摇晃给小料施力
      if (Math.random() < 0.3) {
        for (const p of physics.particles) {
          p.vx += (Math.random() - 0.5) * 120;
          p.vy += Math.random() * 80;
        }
      }

      // 每 10% 更新一次视觉
      if (Math.floor(state.shakeProgress / 10) > Math.floor(oldProgress / 10)) {
        updateCupVisual();
      }

      if (state.shakeProgress >= 100) {
        finishMake();
      }
    }
    // 手动模式：进度由 registerShake 驱动，但也缓慢衰减
    else if (!cupDrag.isDragging) {
      const oldProgress = state.shakeProgress;
      state.shakeProgress = Math.max(0, state.shakeProgress - 2 * dt);
      document.getElementById('shakeMeterFill').style.width = `${state.shakeProgress}%`;
      if (Math.floor(state.shakeProgress / 10) !== Math.floor(oldProgress / 10)) {
        updateCupVisual();
      }
    }
  }

  gameLoopId = requestAnimationFrame(gameLoop);
}

// ==================== 顾客怒火事件 ====================

function triggerCustomerRage(customer) {
  showToast('😡 顾客愤怒了！');
  playSplashAnimation();
  createStains();
}

function playSplashAnimation() {
  const overlay = document.getElementById('splashOverlay');
  overlay.innerHTML = '';
  
  const drops = ['🫧', '☕', '🧋', '💦', '🥤', '🫗'];
  const colors = ['#8B4513', '#D2691E', '#CD853F', '#A0522D'];
  
  for (let i = 0; i < 12; i++) {
    const drop = document.createElement('div');
    drop.className = 'splash-drop';
    drop.textContent = drops[Math.floor(Math.random() * drops.length)];
    
    const startX = Math.random() * window.innerWidth;
    const startY = -50;
    
    drop.style.left = `${startX}px`;
    drop.style.top = `${startY}px`;
    drop.style.fontSize = `${30 + Math.random() * 30}px`;
    drop.style.animationDelay = `${Math.random() * 0.3}s`;
    
    overlay.appendChild(drop);
    
    setTimeout(() => {
      drop.classList.add('animate');
    }, i * 50);
  }
  
  setTimeout(() => {
    overlay.innerHTML = '';
  }, 1500);
}

function createStains() {
  const layer = document.getElementById('stainLayer');
  const colors = ['#8B4513', '#D2691E', '#CD853F', '#A0522D'];
  
  const stainCount = 5 + Math.floor(Math.random() * 4);
  
  for (let i = 0; i < stainCount; i++) {
    const stain = document.createElement('div');
    stain.className = 'stain';
    
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    const size = 30 + Math.random() * 60;
    const color = colors[Math.floor(Math.random() * colors.length)];
    
    stain.style.left = `${x}px`;
    stain.style.top = `${y}px`;
    stain.style.width = `${size}px`;
    stain.style.height = `${size}px`;
    stain.style.background = color;
    stain.dataset.cleaned = 'false';
    
    layer.appendChild(stain);
  }
  
  startCleaningMode();
}

function startCleaningMode() {
  document.getElementById('cleaningBlocker').classList.add('active');
  document.getElementById('dishcloth').classList.add('active');
  document.getElementById('cleaningHint').classList.add('show');
  
  const dishcloth = document.getElementById('dishcloth');
  dishcloth.style.left = `${window.innerWidth / 2 - 40}px`;
  dishcloth.style.top = `${window.innerHeight / 2 - 40}px`;
  
  setupDishclothDrag();
}

function setupDishclothDrag() {
  const dishcloth = document.getElementById('dishcloth');
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;
  
  dishcloth.addEventListener('mousedown', (e) => {
    isDragging = true;
    dishcloth.classList.add('dragging');
    offsetX = e.clientX - dishcloth.getBoundingClientRect().left;
    offsetY = e.clientY - dishcloth.getBoundingClientRect().top;
    
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
  });
  
  function onDrag(e) {
    if (!isDragging) return;
    
    const x = e.clientX - offsetX;
    const y = e.clientY - offsetY;
    
    dishcloth.style.left = `${Math.max(0, Math.min(x, window.innerWidth - 80))}px`;
    dishcloth.style.top = `${Math.max(0, Math.min(y, window.innerHeight - 80))}px`;
    
    checkCleaning(e.clientX, e.clientY);
  }
  
  function stopDrag() {
    isDragging = false;
    dishcloth.classList.remove('dragging');
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
  }
}

function checkCleaning(x, y) {
  const stains = document.querySelectorAll('.stain');
  let allCleaned = true;
  
  stains.forEach(stain => {
    if (stain.dataset.cleaned === 'false') {
      const rect = stain.getBoundingClientRect();
      const stainCenterX = rect.left + rect.width / 2;
      const stainCenterY = rect.top + rect.height / 2;
      
      const distance = Math.sqrt(Math.pow(x - stainCenterX, 2) + Math.pow(y - stainCenterY, 2));
      
      if (distance < 60) {
        stain.classList.add('cleaning');
        stain.dataset.cleaned = 'true';
        
        setTimeout(() => {
          stain.remove();
        }, 300);
      } else {
        allCleaned = false;
      }
    }
  });
  
  if (allCleaned && document.querySelectorAll('.stain').length === 0) {
    endCleaningMode();
  }
}

function endCleaningMode() {
  document.getElementById('cleaningBlocker').classList.remove('active');
  document.getElementById('dishcloth').classList.remove('active');
  document.getElementById('cleaningHint').classList.remove('show');
  
  showToast('✨ 污渍清理干净了！继续营业吧~');
}

// ==================== 初始化 ====================

function init() {
  // 检查是否有存档
  const saved = localStorage.getItem('milkTeaShop');
  const hasSave = saved ? JSON.parse(saved) : null;
  
  // 更新继续按钮状态
  const continueBtn = document.getElementById('continueBtn');
  if (hasSave && !hasSave.gameOver && hasSave.coins >= 0) {
    continueBtn.disabled = false;
  } else {
    continueBtn.disabled = true;
  }

  window.addEventListener('beforeunload', () => {
    if (state) saveState();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state) saveState();
    }
  });
}

function startNewGame() {
  localStorage.removeItem('milkTeaShop');
  state = { ...DEFAULT_STATE };
  
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('settlementScreen').classList.remove('show');
  document.getElementById('bankruptcyScreen').classList.remove('show');
  
  renderTopBar();
  renderIngredients();
  renderCustomers();
  renderRecipes();
  renderAutoShaker();
  updateCupVisual();
  
  setupCupDrag();
  
  if (!gameLoopId) {
    gameLoopId = requestAnimationFrame(gameLoop);
  }
}

function continueGame() {
  loadState();
  
  if (state.gameOver || state.coins < 0) {
    showBankruptcy();
    return;
  }
  
  document.getElementById('startScreen').classList.add('hidden');
  
  renderTopBar();
  renderIngredients();
  renderCustomers();
  renderRecipes();
  renderAutoShaker();
  updateCupVisual();
  
  setupCupDrag();
  
  if (!gameLoopId) {
    gameLoopId = requestAnimationFrame(gameLoop);
  }
}

function showSettings() {
  showToast('⚙️ 设置功能开发中...');
}

function backToStart() {
  document.getElementById('settlementScreen').classList.remove('show');
  document.getElementById('startScreen').classList.remove('hidden');
  
  // 重新检查存档状态
  const saved = localStorage.getItem('milkTeaShop');
  const hasSave = saved ? JSON.parse(saved) : null;
  const continueBtn = document.getElementById('continueBtn');
  if (hasSave && !hasSave.gameOver && hasSave.coins >= 0) {
    continueBtn.disabled = false;
  } else {
    continueBtn.disabled = true;
  }
}

function showBankruptcy() {
  document.getElementById('bankruptcyScreen').classList.add('show');
}

function formatGameTime(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}

function updateGameTime(dt) {
  if (!state.isOpen || !state.isDayStarted) return;
  
  const timeDelta = dt * 1000 * TIME_SCALE / 60; // 现实秒 -> 游戏分钟
  state.gameTime += timeDelta;
  
  if (state.gameTime >= GAME_END_TIME) {
    endDay();
  }
  
  document.getElementById('gameTime').textContent = formatGameTime(Math.floor(state.gameTime));
}

function endDay() {
  state.isOpen = false;
  state.isDayStarted = false;
  
  const btn = document.getElementById('toggleBtn');
  btn.textContent = '开始营业';
  btn.className = 'toggle-btn rest';
  
  // 清空所有顾客
  state.customers.forEach(c => {
    if (!c.served) {
      customerLeaveAngry(c);
    }
  });
  state.customers = [];
  
  // 显示结算页面
  document.getElementById('settlementDay').textContent = state.day;
  document.getElementById('settlementServed').textContent = state.todayServed;
  document.getElementById('settlementPerfect').textContent = state.todayPerfect;
  document.getElementById('settlementIncome').textContent = `+${state.todayIncome}`;
  document.getElementById('settlementRep').textContent = state.todayRepChange > 0 ? `+${state.todayRepChange}` : state.todayRepChange;
  document.getElementById('settlementTotal').textContent = `🪙 ${state.coins}`;
  
  document.getElementById('settlementScreen').classList.add('show');
  
  // 保存存档
  saveState();
}

function startNextDay() {
  document.getElementById('settlementScreen').classList.remove('show');
  
  state.day++;
  state.todayServed = 0;
  state.todayPerfect = 0;
  state.todayIncome = 0;
  state.todayRepChange = 0;
  state.gameTime = GAME_START_TIME;
  state.isDayStarted = false;
  state.customers = [];
  
  renderTopBar();
  renderCustomers();
  updateCupVisual();
  
  showToast(`📅 第 ${state.day} 天开始！点击"开始营业"迎接顾客吧~`);
}

init();
</script>
