<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>番迹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            background-color: #FFF0E8;
            color: #3D3250;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #FFFAF5;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 24px rgba(61, 50, 80, 0.08);
            overflow: hidden;
        }

        /* 顶部区域 */
        .header {
            flex-shrink: 0;
            padding: 18px 20px 14px;
            background-color: #FFFAF5;
            border-bottom: 1px solid #EDE4DB;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #3D3250;
            letter-spacing: 2px;
            text-align: center;
        }

        /* 页面内容区 */
        .content {
            flex: 1;
            position: relative;
            padding: 20px;
            padding-bottom: 80px;
            overflow-y: auto;
        }

        .page {
            display: none;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page.hidden {
            display: none;
        }

        .page.active {
            display: flex;
        }

        .page-text {
            font-size: 18px;
            color: #8A7D96;
            text-align: center;
            padding: 24px 20px;
            background-color: #FFF;
            border: 1px solid #EDE4DB;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(244, 162, 97, 0.08);
        }

        /* 看番记录页激活时隐藏全局header */
        body.on-record-page .header {
            display: none;
        }

        body.on-record-page .content {
            padding: 0;
            overflow: hidden;
        }

        body.on-record-page .app {
            height: 100vh;
            min-height: 0;
        }

        /* ===== 看番记录页面 ===== */
        .page-record {
            flex-direction: column;
            padding: 0 !important;
            position: relative;
            height: 100%;
            min-height: 100%;
            align-items: stretch !important;
            justify-content: flex-start !important;
            width: 100%;
        }

        .page-record-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #EDE4DB transparent;
        }

        .page-record-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .page-record-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .page-record-scroll::-webkit-scrollbar-thumb {
            background-color: #EDE4DB;
            border-radius: 2px;
        }

        /* 大Header - 展开状态 */
        .hero-header {
            position: relative;
            height: 200px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #F4A261 0%, #E892B0 50%, #C8B6E2 100%);
            overflow: hidden;
            transition: height 0.3s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 收缩后的Header（固定在顶部） */
        .page-record.shrink .hero-header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 50px;
            justify-content: flex-start;
            padding-left: 20px;
            background: #FFFAF5;
            border-bottom: 1px solid #EDE4DB;
        }

        .page-record.shrink .hero-content {
            position: relative;
        }

        .page-record.shrink .hero-content::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 36px;
            background: linear-gradient(135deg, #F4A261 0%, #E892B0 50%, #C8B6E2 100%);
            border-radius: 18px;
            z-index: -1;
            transition: all 0.3s ease;
        }

        /* Header装饰图片 - 铺满整个Header作为背景 */
        .hero-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.28;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.3s ease;
            will-change: opacity;
        }

        .page-record.shrink .hero-bg-img {
            opacity: 0;
        }

        /* 飘落的樱花花瓣 */
        .hero-petals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            transition: opacity 0.3s ease;
            will-change: opacity;
        }

        .page-record.shrink .hero-petals {
            opacity: 0;
        }

        .petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #FFB7C5;
            border-radius: 50% 0 50% 50%;
            opacity: 0.85;
            will-change: transform, opacity;
            transform: rotate(45deg);
        }

        .petal.p1 {
            left: 10%;
            animation: petalFall 6s linear infinite;
        }

        .petal.p2 {
            left: 25%;
            width: 8px;
            height: 8px;
            background: #FFC0CB;
            animation: petalFall 7s linear infinite 1.2s;
        }

        .petal.p3 {
            left: 40%;
            width: 12px;
            height: 12px;
            animation: petalFall 5.5s linear infinite 0.5s;
        }

        .petal.p4 {
            left: 55%;
            width: 9px;
            height: 9px;
            background: #FFD1DC;
            animation: petalFall 6.5s linear infinite 2s;
        }

        .petal.p5 {
            left: 70%;
            width: 11px;
            height: 11px;
            animation: petalFall 7.5s linear infinite 0.8s;
        }

        .petal.p6 {
            left: 85%;
            width: 8px;
            height: 8px;
            background: #FFC0CB;
            animation: petalFall 6s linear infinite 1.8s;
        }

        .petal.p7 {
            left: 50%;
            width: 10px;
            height: 10px;
            background: #FFB7C5;
            animation: petalFall 6.8s linear infinite 2.5s;
        }

        @keyframes petalFall {
            0% {
                transform: translate(0, -20px) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            50% {
                transform: translate(20px, 100px) rotate(225deg);
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translate(-15px, 210px) rotate(405deg);
                opacity: 0;
            }
        }

        /* Header文字内容 */
        .hero-content {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 700;
            color: #FFF;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .hero-divider {
            width: 60px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.5);
            transition: opacity 0.3s ease, width 0.3s ease;
        }

        .hero-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            transition: opacity 0.3s ease, font-size 0.3s ease;
            white-space: nowrap;
        }

        .hero-total-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            transition: opacity 0.3s ease, font-size 0.3s ease;
            white-space: nowrap;
        }

        /* 收缩后的文字 */
        .page-record.shrink .hero-content {
            gap: 0;
            align-items: flex-start;
        }

        .page-record.shrink .hero-title {
            font-size: 16px;
        }

        .page-record.shrink .hero-divider {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .page-record.shrink .hero-subtitle {
            opacity: 0;
            font-size: 0;
            height: 0;
        }

        .page-record.shrink .hero-total-time {
            opacity: 0;
            font-size: 0;
            height: 0;
        }

        /* +按钮 */
        .hero-add-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #FFF;
            transition: transform 0.2s ease, top 0.3s ease, right 0.3s ease, color 0.3s ease;
            z-index: 3;
            padding: 0;
        }

        .hero-add-btn:active {
            transform: scale(0.85);
        }

        .hero-add-btn svg {
            width: 100%;
            height: 100%;
        }

        .page-record.shrink .hero-add-btn {
            top: 13px;
            right: 16px;
            color: #F4A261;
        }

        /* 收缩Header中的累计时长 */
        .hero-shrink-time {
            position: absolute;
            top: 17px;
            right: 48px;
            font-size: 12px;
            color: #FFF;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            pointer-events: none;
            z-index: 3;
        }

        .page-record.shrink .hero-shrink-time {
            opacity: 1;
            color: #8A7D96;
        }

        /* 列表区域 */
        .record-list-wrap {
            padding: 16px 20px 80px;
        }

        /* 番剧列表 */
        .anime-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .anime-card {
            position: relative;
            display: flex;
            gap: 14px;
            padding: 12px 16px;
            background-color: #FFF;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(61, 50, 80, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
        }

        .anime-card:active {
            transform: scale(0.98);
        }

        .anime-cover {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            user-select: none;
        }

        .cover-0 {
            background: linear-gradient(135deg, #F4A261 0%, #E76F51 100%);
        }

        .cover-1 {
            background: linear-gradient(135deg, #C8B6E2 0%, #7B68AE 100%);
        }

        .cover-2 {
            background: linear-gradient(135deg, #A8D8C8 0%, #4A9B8E 100%);
        }

        .cover-3 {
            background: linear-gradient(135deg, #FFD3B6 0%, #FF8C61 100%);
        }

        .cover-4 {
            background: linear-gradient(135deg, #B5EAD7 0%, #4CAF50 100%);
        }

        .cover-5 {
            background: linear-gradient(135deg, #C7CEEA 0%, #5C7AEA 100%);
        }

        .anime-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0;
        }

        .anime-name {
            font-size: 16px;
            font-weight: 700;
            color: #3D3250;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .anime-duration {
            font-size: 12px;
            color: #8A7D96;
            font-weight: 400;
        }

        .anime-status {
            font-size: 14px;
            color: #8A7D96;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-tag {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-watching {
            background-color: #FFEED8;
            color: #F4A261;
        }

        .status-finished {
            background-color: #E8F5E9;
            color: #66BB6A;
        }

        .status-planned {
            background-color: #E3F2FD;
            color: #42A5F5;
        }

        .anime-touchpoints {
            font-size: 14px;
            color: #F4A261;
            font-weight: 500;
        }

        .anime-menu {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #C5B8CC;
            font-size: 18px;
            line-height: 1;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .anime-menu:active {
            background-color: #F5EEE8;
        }

        .anime-menu-popup {
            position: absolute;
            top: 32px;
            right: 8px;
            background-color: #FFF;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(61, 50, 80, 0.15);
            padding: 4px;
            z-index: 10;
            display: none;
        }

        .anime-menu-popup.show {
            display: block;
        }

        .menu-delete {
            padding: 8px 16px;
            font-size: 14px;
            color: #E57373;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .menu-delete:active {
            background-color: #FFF0F0;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }

        .empty-state.hidden {
            display: none;
        }

        .empty-text {
            font-size: 14px;
            color: #8A7D96;
            text-align: center;
            line-height: 1.6;
        }

        /* 番剧详情页 */
        .detail-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFFAF5;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .detail-page.show {
            transform: translateX(0);
            pointer-events: auto;
        }

        .detail-header {
            flex-shrink: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: linear-gradient(135deg, #F4A261 0%, #E892B0 50%, #C8B6E2 100%);
            color: #FFF;
            position: relative;
            z-index: 10;
        }

        .detail-back-btn,
        .detail-more-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #FFF;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }

        .detail-back-btn svg {
            width: 22px;
            height: 22px;
        }

        .detail-back-btn:active,
        .detail-more-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 700;
            color: #FFF;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        .detail-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .detail-cover {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        .detail-info {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #FFF;
            border-bottom: 1px solid #EDE4DB;
        }

        .detail-status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #8A7D96;
        }

        .detail-status-tag {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background-color: #FFEED8;
            color: #F4A261;
        }

        .detail-status-tag.status-watching {
            background-color: #FFEED8;
            color: #F4A261;
        }

        .detail-status-tag.status-finished {
            background-color: #E8F5E9;
            color: #66BB6A;
        }

        .detail-status-tag.status-planned {
            background-color: #E3F2FD;
            color: #42A5F5;
        }

        .detail-duration {
            font-size: 14px;
            color: #F4A261;
            font-weight: 500;
        }

        .detail-touchpoints {
            padding: 16px 20px 80px;
        }

        .detail-touchpoints-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .detail-touchpoints-title {
            font-size: 14px;
            font-weight: 700;
            color: #3D3250;
        }

        .detail-add-tp-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background-color: #F4A261;
            color: #FFF;
            font-size: 18px;
            font-weight: 300;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .detail-add-tp-btn:active {
            transform: scale(0.85);
            opacity: 0.8;
        }

        .detail-tp-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-tp-empty {
            text-align: center;
            color: #8A7D96;
            font-size: 14px;
            padding: 30px 20px;
        }

        .detail-tp-empty.hidden {
            display: none;
        }

        /* 触动点卡片 */
        .tp-card {
            position: relative;
            background-color: #FFF;
            border-radius: 12px;
            padding: 12px 14px 12px 18px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(61, 50, 80, 0.04);
            border: 1px solid rgba(61, 50, 80, 0.04);
        }

        .tp-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #F4A261;
        }

        .tp-card-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .tp-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #3D3250;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tp-card-ep {
            font-size: 12px;
            color: #8A7D96;
            flex-shrink: 0;
        }

        .tp-card-note {
            font-size: 14px;
            color: #3D3250;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* 钉子图标 */
        .tp-pin {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #8A7D96;
            flex-shrink: 0;
            transition: transform 0.2s ease, color 0.2s ease;
            background: transparent;
            border: none;
            padding: 0;
            margin-left: 8px;
        }

        .tp-pin svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tp-card.pinned .tp-pin {
            color: #F4A261;
        }

        .tp-card.pinned .tp-pin svg {
            fill: #F4A261;
            stroke: #F4A261;
        }

        .tp-pin.bounce {
            animation: pinBounce 0.3s ease;
        }

        @keyframes pinBounce {
            0% { transform: scale(1) rotate(0deg); }
            40% { transform: scale(1.3) rotate(-20deg); }
            70% { transform: scale(0.9) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .tp-gear {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #8A7D96;
            flex-shrink: 0;
            transition: transform 0.2s ease, color 0.2s ease;
            background: transparent;
            border: none;
            padding: 0;
            margin-left: 4px;
        }

        .tp-gear:hover {
            color: #F4A261;
        }

        .tp-gear:active {
            transform: rotate(45deg);
            color: #F4A261;
        }

        .tp-gear svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 长按操作菜单 */
        .tp-context-menu {
            position: fixed;
            background: #FFF;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(61, 50, 80, 0.15);
            padding: 6px 0;
            z-index: 2000;
            min-width: 140px;
            opacity: 0;
            transform: scale(0.8);
            transform-origin: top left;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .tp-context-menu.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .tp-context-menu-item {
            padding: 12px 16px;
            font-size: 14px;
            color: #3D3250;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            touch-action: manipulation;
        }

        /* 底部导航栏 */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 60px;
            background-color: #FFFFFF;
            border-top: 1px solid #EDE4DB;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -2px 12px rgba(61, 50, 80, 0.06);
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(0, 0, 0, 0.75);
            color: #FFF;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 9999;
            max-width: 80%;
            text-align: center;
            word-break: break-all;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .tab {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            transition: transform 0.15s ease;
            color: #8A7D96;
            font-size: 11px;
            user-select: none;
        }

        .tab:active {
            transform: scale(0.92);
        }

        .tab .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tab .icon svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 手绘简笔画 - 未选中：细线条 */
        .tab .icon svg.icon-outline {
            opacity: 1;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 手绘简笔画 - 选中：粗线条 + 填充 */
        .tab .icon svg.icon-filled {
            opacity: 0;
            fill: currentColor;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: scale(0.85);
        }

        /* 小猫图标：选中时只用描边，只变颜色，保持原样 */
        .tab .icon.icon-cat svg.icon-filled {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            transform: scale(1);
        }

        .tab.active .icon.icon-cat svg.icon-outline {
            transform: scale(1);
        }

        .tab .label {
            font-size: 11px;
            font-weight: 400;
            transition: color 0.2s ease, font-weight 0.2s ease;
        }

        .tab.active {
            color: #F4A261;
            transition: color 0.2s ease;
        }

        .tab.active .label {
            font-weight: 700;
        }

        .tab.active .icon svg.icon-outline {
            opacity: 0;
            transform: scale(0.8);
        }

        .tab.active .icon svg.icon-filled {
            opacity: 1;
            transform: scale(1);
        }
    </style>

    <script>
        (function () {
            var tabs = document.querySelectorAll('.tab');
            var pages = document.querySelectorAll('.page');

            function switchPage(targetPageId) {
                pages.forEach(function (page) {
                    if (page.id === targetPageId) {
                        page.classList.remove('hidden');
                        page.classList.add('active');
                    } else {
                        page.classList.remove('active');
                        page.classList.add('hidden');
                    }
                });

                tabs.forEach(function (tab) {
                    if (tab.dataset.page === targetPageId) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });

                if (targetPageId === 'page-record') {
                    document.body.classList.add('on-record-page');
                } else {
                    document.body.classList.remove('on-record-page');
                }
            }

            document.body.classList.add('on-record-page');

            tabs.forEach(function (tab) {
                tab.addEventListener('click', function () {
                    switchPage(tab.dataset.page);
                });
            });
        })();

        // ===== 看番记录 =====
        (function () {
            var animeList = [
                {
                    id: 1,
                    name: '进击的巨人',
                    status: 'watching',
                    currentEp: 5,
                    totalEp: 25,
                    touchpoints: [
                        { id: 1, episode: 3, time: '12:30', title: '三笠的决心', note: '三笠说"因为这个世界很美好"的时候哭了', color: '#F4A261', pinned: false, pinnedOrder: null },
                        { id: 2, episode: 5, time: '08:15', title: '艾伦的呐喊', note: '变身巨人的那一刻太震撼了', color: '#E76F51', pinned: false, pinnedOrder: null }
                    ],
                    coverIdx: 0
                },
                {
                    id: 2,
                    name: '葬送的芙莉莲',
                    status: 'finished',
                    currentEp: 28,
                    totalEp: 28,
                    touchpoints: [
                        { id: 1, episode: 1, time: '20:00', title: '葬礼上的眼泪', note: '芙莉莲在辛美尔葬礼上终于哭了，等待了太久', color: '#C8B6E2', pinned: false, pinnedOrder: null },
                        { id: 2, episode: 4, time: '15:30', title: '杀戮魔族的过往', note: '芙莉莲回忆起过去的旅途中遇到的杀戮魔族', color: '#7B68AE', pinned: false, pinnedOrder: null },
                        { id: 3, episode: 15, time: '22:10', title: '花田的告白', note: '菲伦在花田里对芙莉莲说"我很喜欢你"', color: '#E892B0', pinned: false, pinnedOrder: null },
                        { id: 4, episode: 28, time: '18:45', title: '旅途的终点', note: '旅行的结束就是新的开始，芙莉莲终于理解了辛美尔', color: '#A8D8C8', pinned: false, pinnedOrder: null }
                    ],
                    coverIdx: 1
                },
                {
                    id: 3,
                    name: '药屋少女的呢喃',
                    status: 'watching',
                    currentEp: 12,
                    totalEp: 24,
                    touchpoints: [
                        { id: 1, episode: 8, time: '10:20', title: '猫猫的推理', note: '猫猫第一次独立推理出案件真相，太聪明了', color: '#A8CCE8', pinned: false, pinnedOrder: null }
                    ],
                    coverIdx: 2
                }
            ];

            var nextId = 4;
            var deletingId = null;
            var selectedStatus = 'watching';
            var COVER_COUNT = 6;

            var listEl = document.getElementById('animeList');
            var emptyEl = document.getElementById('emptyState');
            var addBtn = document.getElementById('addBtn');
            var addModal = document.getElementById('addModal');
            var confirmModal = document.getElementById('confirmModal');
            var cancelAddBtn = document.getElementById('cancelAddBtn');
            var saveAddBtn = document.getElementById('saveAddBtn');
            var cancelDelBtn = document.getElementById('cancelDelBtn');
            var confirmDelBtn = document.getElementById('confirmDelBtn');
            var inputName = document.getElementById('inputName');
            var inputEp = document.getElementById('inputEp');
            var inputTotalEp = document.getElementById('inputTotalEp');
            var inputCover = document.getElementById('inputCover');
            var statusTags = document.getElementById('statusTags');

            var heroTotalTimeEl = document.getElementById('heroTotalTime');
            var heroShrinkTimeEl = document.getElementById('heroShrinkTime');

            var statusMap = {
                watching: { label: '在看', cls: 'status-watching' },
                finished: { label: '看完', cls: 'status-finished' },
                planned: { label: '想看', cls: 'status-planned' }
            };

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function getWatchedEpisodes(anime) {
                if (anime.status === 'finished') return anime.totalEp;
                if (anime.status === 'watching') return anime.currentEp - 1;
                return 0;
            }

            function formatDuration(minutes) {
                var h = Math.floor(minutes / 60);
                var m = minutes % 60;
                return h + 'h ' + m + 'min';
            }

            function getAnimeDuration(anime) {
                return getWatchedEpisodes(anime) * 25;
            }

            function getTotalDuration() {
                var total = 0;
                animeList.forEach(function (anime) {
                    total += getAnimeDuration(anime);
                });
                return total;
            }

            function updateTotalTime() {
                var total = getTotalDuration();
                var text = '累计 ' + formatDuration(total);
                if (heroTotalTimeEl) heroTotalTimeEl.textContent = text;
                if (heroShrinkTimeEl) heroShrinkTimeEl.textContent = text;
            }

            function render() {
                listEl.innerHTML = '';

                if (animeList.length === 0) {
                    emptyEl.classList.remove('hidden');
                    return;
                }

                emptyEl.classList.add('hidden');

                animeList.forEach(function (anime) {
                    var s = statusMap[anime.status];
                    var card = document.createElement('div');
                    card.className = 'anime-card';
                    card.dataset.id = anime.id;

                    var epText = '';
                    if (anime.status === 'watching') {
                        epText = '第' + anime.currentEp + '集 / 共' + anime.totalEp + '集';
                    } else if (anime.status === 'finished') {
                        epText = '全' + anime.totalEp + '集';
                    } else {
                        epText = '共' + anime.totalEp + '集';
                    }

                    var firstChar = anime.name.charAt(0);
                    var coverIdx = anime.coverIdx % COVER_COUNT;

                    card.innerHTML =
                        '<div class="anime-cover cover-' + coverIdx + '">' + escapeHtml(firstChar) + '</div>' +
                        '<div class="anime-info">' +
                            '<div class="anime-name">' + escapeHtml(anime.name) + '</div>' +
                            '<div class="anime-status">' +
                                '<span class="status-tag ' + s.cls + '">' + s.label + '</span>' +
                                '<span>' + epText + '</span>' +
                            '</div>' +
                            '<div class="anime-duration">' + formatDuration(getAnimeDuration(anime)) + '</div>' +
                            '<div class="anime-touchpoints">✨ ' + (anime.touchpoints ? anime.touchpoints.length : 0) + '个触动点</div>' +
                        '</div>' +
                        '<div class="anime-menu" data-menu-id="' + anime.id + '">⋯</div>' +
                        '<div class="anime-menu-popup" data-popup-id="' + anime.id + '">' +
                            '<div class="menu-delete" data-del-id="' + anime.id + '">删除</div>' +
                        '</div>';

                    listEl.appendChild(card);
                });

                updateTotalTime();
            }

            function openAddModal() {
                inputName.value = '';
                inputEp.value = 1;
                inputTotalEp.value = 12;
                inputCover.value = '';
                selectedStatus = 'watching';
                updateStatusTags();
                addModal.classList.add('show');
                setTimeout(function () { inputName.focus(); }, 250);
            }

            function closeAddModal() {
                addModal.classList.remove('show');
            }

            function updateStatusTags() {
                var tags = statusTags.querySelectorAll('.tag-option');
                tags.forEach(function (tag) {
                    if (tag.dataset.status === selectedStatus) {
                        tag.classList.add('active');
                    } else {
                        tag.classList.remove('active');
                    }
                });
            }

            function saveAnime() {
                var name = inputName.value.trim();
                if (!name) {
                    alert('请输入番剧名称');
                    return;
                }

                var ep = parseInt(inputEp.value) || 0;
                var totalEp = parseInt(inputTotalEp.value) || 0;
                // 封面图URL字段保留兼容性，但未填写时使用随机渐变色块
                var coverIdx = Math.floor(Math.random() * COVER_COUNT);

                animeList.push({
                    id: nextId,
                    name: name,
                    status: selectedStatus,
                    currentEp: ep,
                    totalEp: totalEp,
                    touchpoints: [],
                    coverIdx: coverIdx
                });
                nextId++;

                render();
                closeAddModal();
            }

            function openConfirm(id) {
                deletingId = id;
                confirmModal.classList.add('show');
            }

            function closeConfirm() {
                deletingId = null;
                confirmModal.classList.remove('show');
            }

            function deleteAnime() {
                if (deletingId != null) {
                    animeList = animeList.filter(function (a) {
                        return a.id !== deletingId;
                    });
                    render();
                }
                closeConfirm();
            }

            function closeAllMenus() {
                var popups = document.querySelectorAll('.anime-menu-popup');
                popups.forEach(function (p) { p.classList.remove('show'); });
            }

            addBtn.addEventListener('click', openAddModal);
            cancelAddBtn.addEventListener('click', closeAddModal);
            saveAddBtn.addEventListener('click', saveAnime);
            cancelDelBtn.addEventListener('click', closeConfirm);
            confirmDelBtn.addEventListener('click', deleteAnime);

            addModal.addEventListener('click', function (e) {
                if (e.target === addModal) closeAddModal();
            });

            confirmModal.addEventListener('click', function (e) {
                if (e.target === confirmModal) closeConfirm();
            });

            statusTags.addEventListener('click', function (e) {
                var tag = e.target.closest('.tag-option');
                if (tag) {
                    selectedStatus = tag.dataset.status;
                    updateStatusTags();
                }
            });

            listEl.addEventListener('click', function (e) {
                var delBtn = e.target.closest('.menu-delete');
                var menuBtn = e.target.closest('.anime-menu');

                if (delBtn) {
                    var id = parseInt(delBtn.dataset.delId);
                    closeAllMenus();
                    openConfirm(id);
                    e.stopPropagation();
                    return;
                }

                if (menuBtn) {
                    var mid = menuBtn.dataset.menuId;
                    var popup = listEl.querySelector('[data-popup-id="' + mid + '"]');
                    var wasOpen = popup.classList.contains('show');
                    closeAllMenus();
                    if (!wasOpen) popup.classList.add('show');
                    e.stopPropagation();
                }
            });

            document.addEventListener('click', function () {
                closeAllMenus();
            });

            // 滚动收缩效果
            var scrollEl = document.getElementById('recordScroll');
            var pageEl = document.getElementById('page-record');
            var SHRINK_THRESHOLD = 100;
            var EXPAND_THRESHOLD = 60;
            var isShrunk = false;
            var isAnimating = false;
            var rafId = null;
            var pendingScrollTop = 0;

            function updateShrinkState(scrollTop) {
                var shouldShrink;
                if (isShrunk) {
                    shouldShrink = scrollTop >= EXPAND_THRESHOLD;
                } else {
                    shouldShrink = scrollTop > SHRINK_THRESHOLD;
                }

                if (shouldShrink === isShrunk || isAnimating) return;

                isShrunk = shouldShrink;
                isAnimating = true;

                if (isShrunk) {
                    pageEl.classList.add('shrink');
                } else {
                    pageEl.classList.remove('shrink');
                }

                setTimeout(function () {
                    isAnimating = false;
                }, 320);
            }

            function handleScroll() {
                pendingScrollTop = scrollEl.scrollTop;
                if (rafId) return;
                rafId = requestAnimationFrame(function () {
                    rafId = null;
                    updateShrinkState(pendingScrollTop);
                });
            }

            scrollEl.addEventListener('scroll', handleScroll, { passive: true });
            updateShrinkState(0);

            // ===== Toast提示 =====
            var toastEl = document.getElementById('toast');
            var toastTimer = null;

            function showToast(msg, duration) {
                if (!toastEl) return;
                duration = duration || 2000;
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, duration);
            }

            // ===== 详情页 =====
            var detailPage = document.getElementById('detailPage');
            var detailBackBtn = document.getElementById('detailBackBtn');
            var detailMoreBtn = document.getElementById('detailMoreBtn');
            var detailAddTpBtn = document.getElementById('detailAddTpBtn');
            var detailTitle = document.getElementById('detailTitle');
            var detailCover = document.getElementById('detailCover');
            var detailCoverChar = document.getElementById('detailCoverChar');
            var detailStatusTag = document.getElementById('detailStatusTag');
            var detailProgress = document.getElementById('detailProgress');
            var detailDuration = document.getElementById('detailDuration');
            var detailTpList = document.getElementById('detailTpList');
            var detailTpEmpty = document.getElementById('detailTpEmpty');
            var detailHeader = document.getElementById('detailHeader');
            var currentAnime = null;

            function openDetail(id) {
                var anime = null;
                for (var i = 0; i < animeList.length; i++) {
                    if (animeList[i].id === id) {
                        anime = animeList[i];
                        break;
                    }
                }
                if (!anime) return;
                currentAnime = anime;

                detailTitle.textContent = anime.name;
                detailCoverChar.textContent = anime.name.charAt(0);

                var coverIdx = anime.coverIdx % COVER_COUNT;
                detailCover.className = 'detail-cover cover-' + coverIdx;

                var s = statusMap[anime.status];
                detailStatusTag.textContent = s.label;
                detailStatusTag.className = 'detail-status-tag ' + s.cls;

                detailHeader.className = 'detail-header cover-' + coverIdx;

                var epText = '';
                if (anime.status === 'watching') {
                    epText = '第' + anime.currentEp + '集 / 共' + anime.totalEp + '集';
                } else if (anime.status === 'finished') {
                    epText = '全' + anime.totalEp + '集';
                } else {
                    epText = '共' + anime.totalEp + '集';
                }
                detailProgress.textContent = epText;
                detailDuration.textContent = '累计 ' + formatDuration(getAnimeDuration(anime));

                renderTouchpoints(anime);

                setTimeout(function () {
                    detailPage.classList.add('show');
                }, 10);
            }

            function closeDetail() {
                detailPage.classList.remove('show');
                currentAnime = null;
            }

            function renderTouchpoints(anime) {
                var tps = anime.touchpoints || [];
                detailTpList.innerHTML = '';

                if (tps.length === 0) {
                    detailTpEmpty.classList.remove('hidden');
                    return;
                }

                detailTpEmpty.classList.add('hidden');

                // 排序规则：固定项优先，然后未固定项按集数倒序
                var sorted = tps.slice().sort(function (a, b) {
                    var aPinned = a.pinned ? 1 : 0;
                    var bPinned = b.pinned ? 1 : 0;
                    if (aPinned !== bPinned) return bPinned - aPinned;
                    if (a.episode !== b.episode) return b.episode - a.episode;
                    return b.time.localeCompare(a.time);
                });

                sorted.forEach(function (tp, idx) {
                    var card = document.createElement('div');
                    card.className = 'tp-card';
                    if (tp.pinned) {
                        card.classList.add('pinned');
                    } else {
                        card.classList.add('adjustable');
                    }
                    card.setAttribute('data-tp-id', tp.id);
                    card.setAttribute('data-color', tp.color);
                    card.style.borderLeft = '4px solid ' + tp.color;
                    card.style.paddingLeft = '14px';

                    var pinSvg = '<svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L20 12 L14 15 L12 22 L10 15 L4 12 L10 9 Z"/></svg>';
                    var gearSvg = '<svg viewBox="0 0 24 24"><path d="M12 2 L13 6 L16 7 L15 11 L19 12 L15 13 L16 17 L13 18 L12 22 L11 18 L8 17 L9 13 L5 12 L9 11 L8 7 L11 6 Z"/><circle cx="12" cy="12" r="3"/></svg>';

                    card.innerHTML =
                        '<div class="tp-card-title-row">' +
                            '<div class="tp-card-title">' + escapeHtml(tp.title) + '</div>' +
                            '<div class="tp-card-ep">第' + tp.episode + '集 ' + escapeHtml(tp.time) + '</div>' +
                            '<button class="tp-pin" data-tp-id="' + tp.id + '" aria-label="切换固定状态">' + pinSvg + '</button>' +
                            '<button class="tp-gear" data-tp-id="' + tp.id + '" aria-label="更多操作">' + gearSvg + '</button>' +
                        '</div>' +
                        '<div class="tp-card-note">' + escapeHtml(tp.note) + '</div>';

                    detailTpList.appendChild(card);
                });

                attachTouchpointEvents(anime);
            }

            function attachTouchpointEvents(anime) {
                var cards = detailTpList.querySelectorAll('.tp-card');

                cards.forEach(function (card) {
                    var tpId = parseInt(card.getAttribute('data-tp-id'));
                    var tp = findTouchpointById(anime, tpId);
                    if (!tp) return;

                    // 钉子点击切换
                    var pinBtn = card.querySelector('.tp-pin');
                    if (pinBtn) {
                        pinBtn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            togglePin(anime, tp, pinBtn);
                        });
                    }

                    // 齿轮按钮点击显示菜单
                    var gearBtn = card.querySelector('.tp-gear');
                    if (gearBtn) {
                        gearBtn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            showContextMenu(e, anime, tp);
                        });
                    }

                    // 长按和右键菜单
                    var pressTimer = null;
                    var startX, startY;

                    function startPress(e) {
                        if (e.target.closest('.tp-pin') || e.target.closest('.tp-gear')) return;
                        startX = e.touches ? e.touches[0].clientX : e.clientX;
                        startY = e.touches ? e.touches[0].clientY : e.clientY;
                        pressTimer = setTimeout(function () {
                            showContextMenu(e, anime, tp);
                        }, 500);
                    }

                    function endPress(e) {
                        if (pressTimer) {
                            clearTimeout(pressTimer);
                            pressTimer = null;
                        }
                    }

                    function handleTouchMove(e) {
                        if (!pressTimer) return;
                        var x = e.touches[0].clientX;
                        var y = e.touches[0].clientY;
                        if (Math.abs(x - startX) > 10 || Math.abs(y - startY) > 10) {
                            endPress();
                        }
                    }

                    card.addEventListener('touchstart', startPress, { passive: true });
                    card.addEventListener('touchend', endPress);
                    card.addEventListener('touchmove', handleTouchMove, { passive: true });
                    card.addEventListener('mousedown', startPress);
                    card.addEventListener('mouseup', endPress);
                    card.addEventListener('mouseleave', endPress);

                    card.addEventListener('contextmenu', function (e) {
                        e.preventDefault();
                        showContextMenu(e, anime, tp);
                    });
                });
            }

            function findTouchpointById(anime, id) {
                if (!anime.touchpoints) return null;
                for (var i = 0; i < anime.touchpoints.length; i++) {
                    if (anime.touchpoints[i].id === id) return anime.touchpoints[i];
                }
                return null;
            }

            function togglePin(anime, tp, pinBtn) {
                if (tp.pinned) {
                    // 取消置顶：移到非置顶触动点的最前面
                    // 如果全部都是置顶则移到末尾
                    var idx = anime.touchpoints.indexOf(tp);
                    if (idx >= 0) {
                        anime.touchpoints.splice(idx, 1);
                    }
                    var hasUnpinned = anime.touchpoints.some(function (t) { return !t.pinned; });
                    if (hasUnpinned) {
                        var firstUnpinnedIdx = anime.touchpoints.findIndex(function (t) { return !t.pinned; });
                        anime.touchpoints.splice(firstUnpinnedIdx, 0, tp);
                    } else {
                        anime.touchpoints.push(tp);
                    }
                    tp.pinned = false;
                    tp.pinnedOrder = null;
                } else {
                    // 置顶：移到数组开头（index 0）
                    var idx = anime.touchpoints.indexOf(tp);
                    if (idx >= 0) {
                        anime.touchpoints.splice(idx, 1);
                    }
                    anime.touchpoints.unshift(tp);
                    tp.pinned = true;
                    tp.pinnedOrder = 1;
                }
                if (pinBtn) {
                    pinBtn.classList.remove('bounce');
                    void pinBtn.offsetWidth;
                    pinBtn.classList.add('bounce');
                }
                renderTouchpoints(anime);
            }

            // ===== 长按菜单 =====
            var tpContextMenu = document.getElementById('tpContextMenu');
            var tpMenuPin = document.getElementById('tpMenuPin');
            var tpMenuDelete = document.getElementById('tpMenuDelete');
            var contextMenuTarget = null;
            var contextMenuVisible = false;

            function showContextMenu(e, anime, tp) {
                e.preventDefault();
                e.stopPropagation();
                contextMenuTarget = { anime: anime, tp: tp };
                contextMenuVisible = true;

                var x, y;
                if (e.touches && e.touches[0]) {
                    x = e.touches[0].clientX;
                    y = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches[0]) {
                    x = e.changedTouches[0].clientX;
                    y = e.changedTouches[0].clientY;
                } else {
                    x = e.clientX;
                    y = e.clientY;
                }

                var menuWidth = 140;
                var menuHeight = 88;

                if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 8;

                // 根据空间自动判断显示在上方还是下方
                if (y + menuHeight > window.innerHeight) {
                    y = y - menuHeight - 8;
                }

                tpContextMenu.style.left = x + 'px';
                tpContextMenu.style.top = y + 'px';
                tpContextMenu.classList.add('show');

                if (tp.pinned) {
                    tpMenuPin.textContent = '取消置顶';
                } else {
                    tpMenuPin.textContent = '置顶';
                }
            }

            function hideContextMenu() {
                tpContextMenu.classList.remove('show');
                contextMenuVisible = false;
                contextMenuTarget = null;
            }

            tpMenuPin.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!contextMenuTarget) return;
                var anime = contextMenuTarget.anime;
                var tp = contextMenuTarget.tp;
                togglePin(anime, tp, null);
                hideContextMenu();
            });

            tpMenuDelete.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!contextMenuTarget) return;
                var anime = contextMenuTarget.anime;
                var tp = contextMenuTarget.tp;
                var idx = anime.touchpoints.indexOf(tp);
                if (idx >= 0) anime.touchpoints.splice(idx, 1);
                hideContextMenu();
                renderTouchpoints(anime);
                render();
                showToast('已删除触动点');
            });

            // 点击菜单项时不关闭菜单，只在点击外部或选择后关闭
            tpContextMenu.addEventListener('touchstart', function (e) {
                e.stopPropagation();
            }, { passive: true });

            // 点击外部关闭菜单
            document.addEventListener('click', function (e) {
                if (!contextMenuVisible) return;
                if (!e.target.closest('.tp-context-menu')) {
                    hideContextMenu();
                }
            });

            // 触摸事件阻止传播到菜单外
            document.addEventListener('touchstart', function (e) {
                if (!contextMenuVisible) return;
                if (!e.target.closest('.tp-context-menu')) {
                    hideContextMenu();
                }
            }, { passive: true });

            // ===== 添加触动点弹窗 =====
            var addTouchpointModal = document.getElementById('addTouchpointModal');
            var tpInputEpisode = document.getElementById('tpInputEpisode');
            var tpInputTitle = document.getElementById('tpInputTitle');
            var tpInputNote = document.getElementById('tpInputNote');
            var tpColorGroup = document.getElementById('tpColorGroup');
            var tpCancelBtn = document.getElementById('tpCancelBtn');
            var tpSaveBtn = document.getElementById('tpSaveBtn');
            var tpSelectedColor = '#F4A261';

            function openAddModal() {
                if (!currentAnime) return;
                tpInputEpisode.value = currentAnime.currentEp || 1;
                tpInputTitle.value = '';
                tpInputNote.value = '';
                tpSelectedColor = '#F4A261';
                tpColorGroup.querySelectorAll('.tp-color-dot').forEach(function (dot) {
                    dot.classList.toggle('active', dot.getAttribute('data-color') === tpSelectedColor);
                });
                addTouchpointModal.classList.add('show');
                setTimeout(function () { tpInputTitle.focus(); }, 300);
            }

            function closeAddModal() {
                tpInputTitle.value = '';
                tpInputNote.value = '';
                addTouchpointModal.classList.remove('show');
            }

            tpColorGroup.addEventListener('click', function (e) {
                var dot = e.target.closest('.tp-color-dot');
                if (!dot) return;
                tpSelectedColor = dot.getAttribute('data-color');
                tpColorGroup.querySelectorAll('.tp-color-dot').forEach(function (d) {
                    d.classList.remove('active');
                });
                dot.classList.add('active');
            });

            tpCancelBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeAddModal();
            });

            addTouchpointModal.addEventListener('click', function (e) {
                if (e.target === addTouchpointModal) {
                    closeAddModal();
                }
            });

            tpSaveBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentAnime) return;

                var episode = parseInt(tpInputEpisode.value) || 1;
                var title = tpInputTitle.value.trim();
                var note = tpInputNote.value.trim();

                if (!title) {
                    showToast('请输入触动点标题');
                    return;
                }

                var now = new Date();
                var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                var newTp = {
                    id: Date.now(),
                    episode: episode,
                    time: timeStr,
                    title: title,
                    note: note,
                    color: tpSelectedColor,
                    pinned: false,
                    pinnedOrder: null
                };

                currentAnime.touchpoints = currentAnime.touchpoints || [];
                currentAnime.touchpoints.unshift(newTp);

                closeAddModal();
                renderTouchpoints(currentAnime);
                render();
                showToast('已添加触动点');
            });

            detailBackBtn.addEventListener('click', closeDetail);

            detailMoreBtn.addEventListener('click', function () {
                showToast('动漫详情功能开发中');
            });

            detailAddTpBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                openAddModal();
            });

            listEl.addEventListener('click', function (e) {
                var card = e.target.closest('.anime-card');
                var menuBtn = e.target.closest('.anime-menu');
                var popup = e.target.closest('.anime-menu-popup');

                if (menuBtn || popup) return;

                if (card && card.dataset.id) {
                    var id = parseInt(card.dataset.id);
                    openDetail(id);
                }
            });

            render();
        })();
    </script>
</body>
