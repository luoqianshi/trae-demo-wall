<!DOCTYPE html>
<!--
    AI备忘录 · 操作台子页面 (ai-memo-operate.html)
    配套主宣传页 AI备忘录-功能版官网.html 使用，需同目录部署
    纯用户操作界面：第一区块备忘录+定时提醒 / 第二区块录音整理
    视觉与主站1:1对齐：深空蓝#4B3FE3 + 金属灰#6A6FFF，纵向滚动布局
    本次调整：双栏改纵向滚动，导航栏新增锚点标签，平滑滚动+滚动高亮
    所有原有功能逻辑（备忘录/提醒/录音/AI规整/.uploads/返回首页）完全保留
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI备忘录 · 操作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts：标题Noto Serif SC / 正文Noto Sans SC / 代码JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ========== 配色变量：与主站完全一致 ========== */
        :root {
            --deep-blue: #4B3FE3;          /* 主色：深空蓝 */
            --metal-gray: #6A6FFF;         /* 辅色：金属灰 */
            --metal-dark: #3F3AB8;         /* 深一档：用于渐变末端 */
            --bg-base: #F5F6FA;            /* 页面底色：更浅更通透 */
            --bg-white: #FFFFFF;           /* 卡片底色 */
            --bg-soft: #FAFBFD;            /* 次级分层底色 */
            --ice-soft: rgba(75, 63, 227, 0.06);   /* 主色6%透明：更柔和 */
            --ice-glow: rgba(106, 111, 255, 0.16); /* 辅色16%透明 */
            --ice-blue-grad: linear-gradient(135deg, rgba(75,63,227,0.04) 0%, rgba(106,111,255,0.08) 100%); /* 浅蓝渐变背景 */
            --text-main: #1E293B;          /* 主要文字：加深 */
            --text-sec: #475569;           /* 次要文字 */
            --text-muted: #94A3B8;         /* 弱化文字：提示语 */
            --border-l: rgba(148, 163, 184, 0.12); /* 浅边框：更柔和 */
            --border-m: rgba(148, 163, 184, 0.20); /* 中边框 */
            --shadow-sm: 0 1px 3px rgba(30, 41, 59, 0.04), 0 1px 2px rgba(30, 41, 59, 0.03); /* 轻微阴影 */
            --shadow-md: 0 4px 12px rgba(30, 41, 59, 0.05), 0 2px 4px rgba(30, 41, 59, 0.03); /* 柔和分层阴影 */
            --shadow-lg: 0 8px 24px rgba(30, 41, 59, 0.06), 0 4px 8px rgba(30, 41, 59, 0.04); /* 悬浮阴影 */
            --shadow-glow: 0 4px 16px rgba(75, 63, 227, 0.18); /* 主色光晕阴影 */
            --r-sm: 8px;   /* 小圆角：按钮、输入框（加大） */
            --r-md: 12px;  /* 中圆角：上传区、结果框 */
            --r-lg: 16px;  /* 大圆角：卡片（按要求16px） */
            --r-xl: 20px;  /* 超大圆角：弹窗 */
            --fs: 'Noto Serif SC', Georgia, serif;       /* 标题字体 */
            --fn: 'Noto Sans SC', -apple-system, sans-serif; /* 正文字体 */
            --fm: 'JetBrains Mono', monospace;            /* 代码字体 */
            --tr: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* 统一过渡曲线：更顺滑 */
            --grad-primary: linear-gradient(135deg, #4B3FE3 0%, #6A6FFF 100%);  /* 主按钮渐变 */
            --grad-soft: linear-gradient(135deg, rgba(75,63,227,0.08) 0%, rgba(106,111,255,0.12) 100%); /* 柔和渐变背景 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--fn); color: var(--text-main); background: var(--bg-base);
            line-height: 1.8; -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        /* 尊重用户减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ========== 顶部轻量化导航栏（缩减高度、简化设计） ========== */
        .navbar {
            background: linear-gradient(135deg, var(--deep-blue) 0%, var(--metal-gray) 100%);
            border-bottom: 1px solid rgba(106, 111, 255, 0.10);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 8px rgba(75, 63, 227, 0.06); /* 极轻阴影不厚重 */
        }
        .navbar-inner {
            max-width: 1080px; margin: 0 auto; padding: 0 32px;
            height: 48px; /* 缩减高度：更轻量 */
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px;
        }
        .nav-brand {
            font-family: var(--fs); font-size: 15px; font-weight: 600; color: #fff;
            text-decoration: none; display: flex; align-items: center; gap: 8px;
            letter-spacing: 0.02em; white-space: nowrap;
        }
        .nav-brand-mark {
            width: 24px; height: 24px; background: #fff; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--deep-blue); font-size: 10px; font-weight: 800;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        /* 锚点导航标签组：居中排布 */
        .nav-anchors {
            display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center;
        }
        .nav-anchor {
            padding: 6px 14px; color: rgba(255, 255, 255, 0.85);
            font-family: var(--fn); font-size: 12px; font-weight: 500;
            text-decoration: none; border-radius: 100px; transition: all var(--tr);
            white-space: nowrap; cursor: pointer;
        }
        .nav-anchor:hover {
            color: #fff; background: rgba(255, 255, 255, 0.16);
        }
        .nav-anchor.active {
            color: #fff; background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }
        /* 返回首页按钮：小巧圆角，不突兀 */
        .nav-back {
            padding: 6px 16px; background: rgba(255, 255, 255, 0.15);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 100px; /* 胶囊圆角更小巧 */
            font-family: var(--fn); font-size: 12px; font-weight: 500;
            cursor: pointer; transition: var(--tr);
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
            backdrop-filter: blur(8px);
        }
        .nav-back:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.40);
            transform: translateY(-1px);
        }

        /* ========== 纵向滚动主体（两大区块上下排布，充足留白） ========== */
        .main {
            flex: 1; max-width: 1080px; width: 100%; margin: 0 auto;
            padding: 40px 32px 56px; display: flex; flex-direction: column;
            gap: 36px; /* 区块间充足留白 */
        }
        /* 区块锚点偏移：避免导航栏遮挡 */
        .module { scroll-margin-top: 72px; }
        /* 分区分割线：备忘录区与定时提醒区之间浅灰分割 */
        .section-divider {
            height: 1px; background: var(--border-m); margin: 24px 0;
            position: relative;
        }
        .section-divider::after {
            content: attr(data-label); position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); background: var(--bg-white);
            padding: 0 12px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase;
        }
        .module {
            background: var(--bg-white);
            border: 1px solid var(--border-l); /* 极浅边框，不生硬 */
            border-radius: var(--r-lg); /* 16px大圆角 */
            box-shadow: var(--shadow-md); /* 柔和分层阴影，不厚重 */
            display: flex; flex-direction: column; overflow: hidden;
            transition: transform var(--tr), box-shadow var(--tr);
        }
        .module:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        /* 模块顶部彩条：保留但更精致 */
        .module-header {
            background: linear-gradient(135deg, var(--deep-blue) 0%, var(--metal-dark) 100%);
            padding: 12px 22px; display: flex; align-items: center; gap: 8px;
        }
        .module-header-icon { font-size: 15px; }
        .module-header-title {
            font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 0.03em;
        }
        .module-body { padding: 28px 24px; flex: 1; display: flex; flex-direction: column; } /* 加宽内边距 */

        /* ========== 表单元素（柔和边框、文字层级清晰） ========== */
        .input {
            width: 100%; padding: 12px 16px;
            border: 1px solid var(--border-l); /* 更浅边框 */
            border-radius: var(--r-sm);
            font-family: var(--fn); font-size: 14px;
            color: var(--text-main); background: var(--bg-soft);
            outline: none; transition: all var(--tr);
        }
        .input::placeholder { color: var(--text-muted); font-weight: 300; }
        .input:focus {
            border-color: var(--deep-blue);
            background: var(--bg-white);
            box-shadow: 0 0 0 3px var(--ice-soft); /* 聚焦光晕 */
        }
        .textarea {
            width: 100%; min-height: 96px; padding: 12px 16px;
            border: 1px solid var(--border-l); border-radius: var(--r-sm);
            font-family: var(--fn); font-size: 14px; color: var(--text-main);
            background: var(--bg-soft); resize: vertical; outline: none;
            line-height: 1.8; transition: all var(--tr);
        }
        .textarea::placeholder { color: var(--text-muted); font-weight: 300; }
        .textarea:focus {
            border-color: var(--deep-blue);
            background: var(--bg-white);
            box-shadow: 0 0 0 3px var(--ice-soft);
        }
        .form-label {
            font-size: 12px; font-weight: 600; color: var(--text-sec);
            margin-bottom: 8px; display: block; letter-spacing: 0.03em;
        }
        .form-group { margin-bottom: 16px; } /* 加宽组间距 */

        /* ========== 按钮：主次分明，渐变过渡动效 ========== */
        .btn {
            padding: 10px 22px;
            background: var(--grad-primary); /* 深空蓝渐变 */
            color: #fff; border: none; border-radius: var(--r-sm);
            font-family: var(--fn); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all var(--tr);
            display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(75, 63, 227, 0.20);
            letter-spacing: 0.02em;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(75, 63, 227, 0.32);
            filter: brightness(1.08);
        }
        .btn:active { transform: translateY(0); }
        /* 次按钮：浅金属灰 */
        .btn-secondary {
            background: linear-gradient(135deg, #6A6FFF 0%, #8B8FFF 100%);
            box-shadow: 0 2px 8px rgba(106, 111, 255, 0.18);
        }
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(106, 111, 255, 0.30);
            filter: brightness(1.08);
        }
        /* 录音中状态：红色脉动 */
        .btn-recording {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            animation: pulse-rec 1.5s infinite;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
        }
        @keyframes pulse-rec { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ========== 标签选择器（柔和胶囊） ========== */
        .tag-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .tag-chip {
            padding: 5px 14px; background: var(--bg-soft);
            border: 1px solid var(--border-l); color: var(--text-sec);
            font-size: 12px; font-weight: 500; border-radius: 100px;
            cursor: pointer; transition: all var(--tr); user-select: none;
        }
        .tag-chip:hover { border-color: var(--metal-gray); color: var(--metal-gray); }
        .tag-chip.selected {
            background: var(--ice-soft); border-color: var(--deep-blue); color: var(--deep-blue);
            font-weight: 600;
        }

        /* ========== 列表展示区（通透留白） ========== */
        .list-area {
            margin-top: 18px; flex: 1; overflow-y: auto; max-height: 280px;
            padding-right: 4px;
        }
        .list-area::-webkit-scrollbar { width: 5px; }
        .list-area::-webkit-scrollbar-track { background: transparent; }
        .list-area::-webkit-scrollbar-thumb { background: var(--border-m); border-radius: 3px; }
        .list-area::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        .list-item {
            background: var(--bg-soft); border: 1px solid var(--border-l);
            border-radius: var(--r-sm); padding: 14px 16px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
            transition: all var(--tr);
        }
        .list-item:hover {
            background: var(--bg-white);
            border-color: var(--border-m);
            box-shadow: var(--shadow-sm);
        }
        .list-item-content { flex: 1; min-width: 0; }
        .list-item-title {
            font-size: 14px; font-weight: 600; color: var(--text-main);
            margin-bottom: 4px; word-break: break-word;
        }
        .list-item-desc {
            font-size: 12px; color: var(--text-sec); line-height: 1.6; word-break: break-word;
        }
        .list-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 300; }
        .list-item-tag {
            font-size: 10px; padding: 2px 8px; background: var(--ice-soft);
            color: var(--deep-blue); border-radius: 100px; margin-right: 4px; font-weight: 500;
        }
        .list-item-status {
            display: inline-block; font-size: 11px; padding: 2px 10px;
            border-radius: 100px; font-weight: 600; margin-top: 6px;
        }
        .status-pending { background: var(--ice-soft); color: var(--deep-blue); }
        .status-urgent { background: rgba(245, 158, 11, 0.10); color: #d97706; }
        .status-past { background: rgba(239, 68, 68, 0.10); color: #dc2626; }
        .status-done { background: rgba(16, 185, 129, 0.10); color: #059669; }
        .list-item-del {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 18px; flex-shrink: 0;
            transition: all var(--tr); line-height: 1;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .list-item-del:hover {
            color: #ef4444; background: rgba(239, 68, 68, 0.08);
        }
        .empty-hint {
            text-align: center; padding: 36px 16px; color: var(--text-muted);
            font-size: 13px; font-weight: 300;
        }

        /* ========== 录音上传区（浅蓝渐变背景、氛围感） ========== */
        .upload-zone {
            border: 2px dashed var(--border-m);
            border-radius: var(--r-md);
            padding: 32px 20px; text-align: center;
            background: var(--ice-blue-grad); /* 浅蓝渐变背景 */
            cursor: pointer; transition: all var(--tr); margin-bottom: 16px;
            position: relative; overflow: hidden;
        }
        .upload-zone::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(106,111,255,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--deep-blue);
            background: linear-gradient(135deg, rgba(75,63,227,0.10) 0%, rgba(106,111,255,0.14) 100%);
            transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }
        .upload-icon {
            font-size: 36px; margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(75, 63, 227, 0.15));
        }
        .upload-text { font-size: 13px; color: var(--text-sec); margin-bottom: 6px; font-weight: 500; }
        .upload-hint { font-size: 11px; color: var(--text-muted); font-weight: 300; }

        /* ========== AI规整结果展示（柔和分层） ========== */
        .result-box {
            background: var(--bg-soft); border: 1px solid var(--border-l);
            border-radius: var(--r-md); padding: 18px; margin-top: 14px; display: none;
        }
        .result-box.show { display: block; animation: slideIn 0.4s var(--tr); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .result-label {
            font-size: 11px; font-weight: 600; color: var(--deep-blue);
            margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .result-text {
            font-size: 14px; color: var(--text-main); line-height: 1.9;
            white-space: pre-wrap; word-break: break-word;
        }
        .result-text .hl {
            background: var(--ice-soft); padding: 2px 6px;
            border-radius: 4px; color: var(--deep-blue); font-weight: 600;
        }

        /* ========== 极简浅色页脚 ========== */
        .footer {
            background: var(--bg-white); border-top: 1px solid var(--border-l);
            padding: 22px 32px; text-align: center;
        }
        .footer-text { font-size: 12px; color: var(--text-muted); font-weight: 300; letter-spacing: 0.02em; }

        /* ========== Toast 轻提示（柔和阴影） ========== */
        .toast {
            position: fixed; top: 64px; right: 24px; z-index: 2000;
            background: var(--bg-white); border: 1px solid var(--border-l);
            border-radius: var(--r-md); padding: 12px 20px;
            box-shadow: var(--shadow-lg);
            display: none; align-items: center; gap: 10px; max-width: 320px;
        }
        .toast.show { display: flex; animation: toastIn 0.35s var(--tr); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
        .toast-icon { font-size: 18px; }
        .toast-text { font-size: 13px; color: var(--text-main); font-weight: 500; }

        /* ========== 提醒弹窗（精致大圆角） ========== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(75, 63, 227, 0.25);
            backdrop-filter: blur(10px); z-index: 3000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; animation: fadeI 0.3s ease; }
        @keyframes fadeI { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--bg-white); border-radius: var(--r-xl);
            padding: 40px 36px; max-width: 400px; width: 100%; text-align: center;
            box-shadow: 0 24px 64px rgba(30, 41, 59, 0.18), 0 8px 16px rgba(30, 41, 59, 0.08);
            animation: modalIn 0.4s var(--tr);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-icon { font-size: 48px; margin-bottom: 16px; filter: drop-shadow(0 4px 8px rgba(75, 63, 227, 0.20)); }
        .modal-title {
            font-family: var(--fs); font-size: 20px; font-weight: 700;
            color: var(--text-main); margin-bottom: 10px;
        }
        .modal-desc { font-size: 14px; color: var(--text-sec); margin-bottom: 6px; line-height: 1.7; }
        .modal-time { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; font-weight: 300; }
        .modal-btn {
            padding: 11px 36px;
            background: var(--grad-primary); color: #fff;
            border: none; border-radius: var(--r-sm); font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all var(--tr);
            box-shadow: 0 2px 8px rgba(75, 63, 227, 0.20);
        }
        .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(75, 63, 227, 0.32); filter: brightness(1.08); }

        /* ========== 响应式断点（纵向布局适配） ========== */
        @media (max-width: 768px) {
            .main { padding: 24px 16px 40px; gap: 28px; }
            .navbar-inner { padding: 0 16px; gap: 8px; }
            .nav-anchors { gap: 2px; }
            .nav-anchor { padding: 5px 10px; font-size: 11px; }
            .list-area { max-height: 200px; }
            .module-body { padding: 22px 18px; }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部轻量化导航栏（含锚点导航） ===== -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="ai-memo-operate.html" class="nav-brand">
                <div class="nav-brand-mark">AI</div>
                AI备忘录 · 操作台
            </a>
            <!-- 锚点导航：点击平滑滚动至对应功能区块 -->
            <div class="nav-anchors">
                <a href="#section-memo" class="nav-anchor" onclick="scrollToSection('section-memo');return false">备忘录·定时提醒</a>
                <a href="#section-audio" class="nav-anchor" onclick="scrollToSection('section-audio');return false">录音整理</a>
            </div>
            <!-- 返回首页：点击跳回主宣传页，同目录相对路径 -->
            <a href="AI备忘录-功能版官网.html" class="nav-back">← 返回首页</a>
        </div>
    </nav>

    <!-- ===== 纵向滚动核心操作模块（两大区块上下排布） ===== -->
    <main class="main">

        <!-- 第一区块：日常备忘录 + 定时提醒（整合模块） -->
        <section class="module" id="section-memo">
            <div class="module-header">
                <span class="module-header-icon">📝</span>
                <span class="module-header-title">备忘录 · 定时提醒</span>
            </div>
            <div class="module-body">
                <!-- ===== 备忘录区 ===== -->
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="input" id="memo-title" placeholder="输入备忘录标题...">
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <textarea class="textarea" id="memo-content" placeholder="输入备忘录内容..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">标签</label>
                    <div class="tag-group" id="memo-tags">
                        <span class="tag-chip" data-tag="工作">工作</span>
                        <span class="tag-chip" data-tag="学习">学习</span>
                        <span class="tag-chip" data-tag="生活">生活</span>
                        <span class="tag-chip" data-tag="待办">待办</span>
                        <span class="tag-chip" data-tag="灵感">灵感</span>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="saveMemo()">💾 保存</button>
                    <button class="btn btn-secondary" onclick="clearMemoForm()">清空</button>
                </div>
                <div class="list-area" id="memo-list"></div>

                <!-- ===== 浅灰分割线：区分备忘录与定时提醒 ===== -->
                <div class="section-divider" data-label="定时提醒"></div>

                <!-- ===== 定时提醒区（功能完整保留） ===== -->
                <div class="form-group">
                    <label class="form-label">提醒事项</label>
                    <input type="text" class="input" id="reminder-title" placeholder="例如：取干洗的衣物">
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <div>
                        <label class="form-label">日期</label>
                        <input type="date" class="input" id="reminder-date">
                    </div>
                    <div>
                        <label class="form-label">时间</label>
                        <input type="time" class="input" id="reminder-time">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">提前提醒</label>
                    <select class="input" id="reminder-advance">
                        <option value="1">提前 1 分钟</option>
                        <option value="5" selected>提前 5 分钟</option>
                        <option value="10">提前 10 分钟</option>
                        <option value="15">提前 15 分钟</option>
                        <option value="30">提前 30 分钟</option>
                        <option value="60">提前 1 小时</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="createReminder()">🔔 创建提醒</button>
                    <button class="btn btn-secondary" onclick="enableNotification()">📱 开启通知</button>
                </div>
                <div class="list-area" id="reminder-list"></div>
            </div>
        </section>

        <!-- 第二区块：录音整理（独立模块，功能完整保留） -->
        <section class="module" id="section-audio">
            <div class="module-header">
                <span class="module-header-icon">🎙️</span>
                <span class="module-header-title">录音整理</span>
            </div>
            <div class="module-body">
                <!--
                    上传区域：设计意图为将音频存入同目录 .uploads 隐藏文件夹
                    浏览器沙箱无法直接写本地文件系统，故采用 File API 内存读取
                    服务器部署时取消下方注释即可写入 .uploads
                -->
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text" id="upload-text">点击上传音频文件，或拖拽至此</div>
                    <div class="upload-hint">支持 MP3 / WAV / M4A，或直接使用浏览器实时录音</div>
                </div>
                <input type="file" id="file-input" accept="audio/*" style="display:none">

                <div class="btn-row" style="margin-bottom: 12px;">
                    <button class="btn" id="record-btn" onclick="toggleRecording()">🎤 开始录音</button>
                    <button class="btn btn-secondary" onclick="normalizeText()">⚡ AI规整</button>
                </div>

                <!-- 原始转写文本 -->
                <div class="result-box" id="raw-box">
                    <div class="result-label">原始文本</div>
                    <div class="result-text" id="raw-text" style="color:var(--text-muted);font-size:13px"></div>
                </div>
                <!-- 规整后文稿 -->
                <div class="result-box" id="result-box">
                    <div class="result-label">规整后文稿</div>
                    <div class="result-text" id="result-text"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- ===== 极简浅色页脚 ===== -->
    <footer class="footer">
        <p class="footer-text">AI备忘录 · 智能梳理信息，让每一件要事都有条不紊</p>
    </footer>

    <!-- ===== Toast 轻提示 ===== -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✅</span>
        <span class="toast-text" id="toast-text"></span>
    </div>

    <!-- ===== 提醒弹窗 ===== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-icon" id="modal-icon">⏰</div>
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-desc" id="modal-desc"></div>
            <div class="modal-time" id="modal-time"></div>
            <button class="modal-btn" onclick="closeModal()">知道了</button>
        </div>
    </div>

    <script>
        /* ============================================================
           全局状态：localStorage 持久化（刷新不丢失）
           键名与主站一致，数据可跨页共享
           ============================================================ */
        let memos = JSON.parse(localStorage.getItem('ai_memos') || '[]');
        let reminders = JSON.parse(localStorage.getItem('ai_reminders') || '[]');
        let isRecording = false;       // 录音状态标志
        let recognition = null;        // SpeechRecognition 实例
        let rawTranscript = '';        // 累积的转写文本
        let uploadedFileName = '';     // 已上传文件名

        /* ===== Toast 通用轻提示 ===== */
        function showToast(text, icon = '✅') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-icon').textContent = icon;
            document.getElementById('toast-text').textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* ============================================================
           模块1：日常备忘录 —— 增删查
           ============================================================ */
        function initTagChips() {
            document.querySelectorAll('#memo-tags .tag-chip').forEach(chip => {
                chip.addEventListener('click', () => chip.classList.toggle('selected'));
            });
        }
        function getSelectedTags() {
            return Array.from(document.querySelectorAll('#memo-tags .tag-chip.selected')).map(c => c.dataset.tag);
        }
        function saveMemo() {
            const title = document.getElementById('memo-title').value.trim();
            const content = document.getElementById('memo-content').value.trim();
            if (!title || !content) { showToast('请填写标题和内容', '⚠️'); return; }
            memos.unshift({
                id: Date.now(), title, content, tags: getSelectedTags(),
                time: new Date().toLocaleString('zh-CN')
            });
            localStorage.setItem('ai_memos', JSON.stringify(memos));
            clearMemoForm();
            renderMemoList();
            showToast('备忘录保存成功！');
        }
        function clearMemoForm() {
            document.getElementById('memo-title').value = '';
            document.getElementById('memo-content').value = '';
            document.querySelectorAll('#memo-tags .tag-chip.selected').forEach(c => c.classList.remove('selected'));
        }
        function deleteMemo(id) {
            memos = memos.filter(m => m.id !== id);
            localStorage.setItem('ai_memos', JSON.stringify(memos));
            renderMemoList();
            showToast('已删除', '🗑️');
        }
        function renderMemoList() {
            const list = document.getElementById('memo-list');
            if (memos.length === 0) { list.innerHTML = '<div class="empty-hint">还没有备忘录</div>'; return; }
            list.innerHTML = memos.map(m => `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${escapeHtml(m.title)}</div>
                        <div class="list-item-desc">${escapeHtml(m.content)}</div>
                        ${m.tags && m.tags.length ? `<div style="margin-top:4px">${m.tags.map(t => `<span class="list-item-tag">${t}</span>`).join('')}</div>` : ''}
                        <div class="list-item-meta">${m.time}</div>
                    </div>
                    <button class="list-item-del" onclick="deleteMemo(${m.id})">×</button>
                </div>`).join('');
        }

        /* ============================================================
           模块2：录音上传 + AI文本规整
           - 浏览器实时录音：Web Speech API（仅Chrome/Edge支持）
           - 文件上传：File API 内存读取，服务器部署可改fetch写入.uploads
           - AI规整：规则化处理（过滤语气词/语义断句/提取待办），无需后端
           ============================================================ */
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                document.getElementById('record-btn').disabled = true;
                document.getElementById('record-btn').style.opacity = '0.5';
                return;
            }
            recognition = new SR();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.onresult = function(event) {
                let final = '', interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                if (final) rawTranscript += final;
                document.getElementById('upload-text').textContent = (rawTranscript + interim) || '正在聆听...请说话';
            };
            recognition.onerror = function(event) { showToast('语音识别出错：' + event.error, '⚠️'); stopRecording(); };
            recognition.onend = function() { if (isRecording) { try { recognition.start(); } catch(e) {} } };
        }
        function toggleRecording() {
            if (!recognition) { showToast('请使用 Chrome / Edge 浏览器', '⚠️'); return; }
            isRecording ? stopRecording() : startRecording();
        }
        function startRecording() {
            isRecording = true; rawTranscript = '';
            const btn = document.getElementById('record-btn');
            btn.classList.add('btn-recording'); btn.textContent = '⏹ 停止录音';
            document.getElementById('upload-text').textContent = '正在聆听...请说话';
            try { recognition.start(); } catch(e) { showToast('无法启动录音，请检查麦克风权限', '⚠️'); stopRecording(); }
        }
        function stopRecording() {
            isRecording = false;
            const btn = document.getElementById('record-btn');
            btn.classList.remove('btn-recording'); btn.textContent = '🎤 开始录音';
            if (recognition) recognition.stop();
            if (rawTranscript) { showRawText(rawTranscript); showToast('录音结束，可点击 AI规整', '🎙️'); }
        }

        /* 文件上传初始化：点击+拖拽双通道
           浏览器沙箱无法直接写本地 .uploads 隐藏文件夹，
           通过 File API 读取文件内容。服务器部署时改为 fetch 上传。 */
        function initFileUpload() {
            const zone = document.getElementById('upload-zone');
            const input = document.getElementById('file-input');
            zone.addEventListener('click', () => input.click());
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) handleAudioFile(file);
            });
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', e => {
                e.preventDefault(); zone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('audio/')) handleAudioFile(file);
                else if (file) showToast('请上传音频文件', '⚠️');
            });
        }
        function handleAudioFile(file) {
            uploadedFileName = file.name;
            document.getElementById('upload-text').textContent = '已上传：' + file.name + '（' + (file.size / 1024).toFixed(0) + 'KB）';
            /* ===== 服务器部署时取消注释，将音频写入 .uploads 隐藏文件夹 =====
               const formData = new FormData();
               formData.append('audio', file);
               fetch('./.uploads/upload.php', { method: 'POST', body: formData })
                   .then(r => r.json())
                   .then(d => console.log('已存入 .uploads:', d.path));
            ============================================================ */
            showToast('音频已加载，可使用录音功能或手动输入文本规整', '📁');
        }
        function showRawText(text) {
            document.getElementById('raw-box').classList.add('show');
            document.getElementById('raw-text').textContent = text;
        }

        /* AI文本规整算法：规则化处理，无需后端AI接口
           步骤：过滤语气词 → 去重复字符 → 语义断句 → 换行排版 → 提取待办 */
        function normalizeText() {
            let raw = rawTranscript;
            if (!raw) {
                const uploadText = document.getElementById('upload-text').textContent;
                if (uploadText && !uploadText.includes('点击上传') && !uploadText.includes('正在聆听') && !uploadText.includes('已上传')) {
                    raw = uploadText;
                }
            }
            if (!raw) {
                const input = prompt('请输入或粘贴需要规整的文本：', '');
                if (input && input.trim()) raw = input.trim();
                else { showToast('请先录音或输入文本', '⚠️'); return; }
            }
            let result = raw;
            result = result.replace(/[嗯啊呃哦唉呢吧呀嘛哈咯]+/g, '');       // 过滤语气词
            result = result.replace(/(.)\1{2,}/g, '$1');                     // 过滤重复字符
            result = result.replace(/\s+/g, '');                              // 去多余空白
            result = result.replace(/然后/g, '；然后');                        // 语义断句
            result = result.replace(/接下来/g, '。接下来');
            result = result.replace(/最后/g, '。最后');
            result = result.replace(/第一/g, '。第一');
            result = result.replace(/第二/g, '。第二');
            result = result.replace(/第三/g, '。第三');
            result = result.replace(/另外/g, '。另外');
            result = result.replace(/所以/g, '。所以');
            result = result.replace(/(。|；)/g, '$1\n');                      // 换行排版
            result = result.replace(/^[\n。；]+/, '');                        // 清理开头标点

            // 自动提取待办事项（时间词+动作词组合）
            const todoPattern = /(明天|今天|后天|下周|周一|周二|周三|周四|周五|周六|周日|上午|下午|早上|晚上|几点|\d+点|\d+号)[^。；]*?(取|买|做|去|见|叫|拿|送|交|开|打|发|回复|确认|完成|提交)/g;
            const todoMatch = raw.match(todoPattern);
            let output = '<span class="hl">【规整后文稿】</span>\n\n' + result;
            if (todoMatch && todoMatch.length > 0) {
                output += '\n\n<span class="hl">【自动提取待办】</span>\n';
                todoMatch.forEach((t, i) => { output += (i + 1) + '. ' + t + '\n'; });
            }
            document.getElementById('result-box').classList.add('show');
            document.getElementById('result-text').innerHTML = output;
            showToast('文稿规整完成！', '⚡');
        }

        /* ============================================================
           模块3：定时消息弹窗提醒
           - 创建提醒：自定义文案+日期时间+提前量
           - 到点触发：弹窗 + 浏览器系统通知
           - 轮询机制：每60秒检查一次
           ============================================================ */
        function createReminder() {
            const title = document.getElementById('reminder-title').value.trim();
            const date = document.getElementById('reminder-date').value;
            const time = document.getElementById('reminder-time').value;
            const advance = parseInt(document.getElementById('reminder-advance').value);
            if (!title || !date || !time) { showToast('请填写完整的提醒信息', '⚠️'); return; }
            const targetTime = new Date(date + 'T' + time);
            const notifyTime = new Date(targetTime.getTime() - advance * 60000);
            const now = new Date();
            if (targetTime <= now) { showToast('提醒时间必须在未来', '⚠️'); return; }
            reminders.push({
                id: Date.now(), title,
                targetTime: targetTime.toISOString(),
                notifyTime: notifyTime.toISOString(),
                advance, triggered: false, completed: false,
                created: now.toLocaleString('zh-CN')
            });
            localStorage.setItem('ai_reminders', JSON.stringify(reminders));
            renderReminderList();
            showToast('提醒创建成功！提前' + advance + '分钟通知', '🔔');
            document.getElementById('reminder-title').value = '';
        }
        function deleteReminder(id) {
            reminders = reminders.filter(r => r.id !== id);
            localStorage.setItem('ai_reminders', JSON.stringify(reminders));
            renderReminderList();
            showToast('提醒已删除', '🗑️');
        }
        function renderReminderList() {
            const list = document.getElementById('reminder-list');
            if (reminders.length === 0) { list.innerHTML = '<div class="empty-hint">还没有提醒</div>'; return; }
            const sorted = reminders.slice().sort((a, b) => new Date(a.targetTime) - new Date(b.targetTime));
            list.innerHTML = sorted.map(r => {
                const target = new Date(r.targetTime);
                const now = new Date();
                const isPast = target < now;
                const isUrgent = !isPast && !r.completed && (target - now < 3600000);
                let statusText = '待提醒', statusClass = 'status-pending';
                if (r.completed) { statusText = '已完成'; statusClass = 'status-done'; }
                else if (isPast) { statusText = '已过期'; statusClass = 'status-past'; }
                else if (isUrgent) { statusText = '即将到期'; statusClass = 'status-urgent'; }
                return `<div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${escapeHtml(r.title)}</div>
                        <div class="list-item-desc">${target.toLocaleString('zh-CN')} · 提前${r.advance}分钟</div>
                        <span class="list-item-status ${statusClass}">${statusText}</span>
                    </div>
                    <button class="list-item-del" onclick="deleteReminder(${r.id})">×</button>
                </div>`;
            }).join('');
        }
        /* 轮询检查提醒：每60秒触发一次 */
        function checkReminders() {
            const now = new Date();
            let changed = false;
            reminders.forEach(r => {
                if (r.triggered || r.completed) return;
                if (now >= new Date(r.notifyTime)) { r.triggered = true; changed = true; triggerReminder(r); }
            });
            if (changed) { localStorage.setItem('ai_reminders', JSON.stringify(reminders)); renderReminderList(); }
        }
        function triggerReminder(r) {
            const target = new Date(r.targetTime);
            document.getElementById('modal-title').textContent = r.title;
            document.getElementById('modal-desc').textContent = '预定时间：' + target.toLocaleString('zh-CN');
            document.getElementById('modal-time').textContent = '提前' + r.advance + '分钟提醒 · ' + new Date().toLocaleString('zh-CN');
            document.getElementById('modal-overlay').classList.add('show');
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('⏰ AI备忘录提醒', { body: r.title + '\n预定时间：' + target.toLocaleString('zh-CN') });
            }
        }
        function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
        function enableNotification() {
            if (!('Notification' in window)) { showToast('当前浏览器不支持通知', '⚠️'); return; }
            if (Notification.permission === 'granted') { showToast('通知已开启', '✅'); }
            else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(p => {
                    showToast(p === 'granted' ? '通知已开启！' : '已拒绝通知权限', p === 'granted' ? '✅' : '⚠️');
                });
            } else { showToast('通知权限已被拒绝，请在浏览器设置中开启', '⚠️'); }
        }

        /* ===== 工具函数：HTML转义防XSS ===== */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /* ============================================================
           锚点导航：平滑滚动 + 滚动高亮当前区块
           （仅新增交互，不改动任何现有功能代码）
           ============================================================ */
        // 平滑滚动至指定区块，过渡顺滑柔和
        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        // 滚动监听：高亮当前可视区块对应的导航标签
        function initScrollSpy() {
            const sections = [
                { id: 'section-memo', anchor: document.querySelector('.nav-anchor[href="#section-memo"]') },
                { id: 'section-audio', anchor: document.querySelector('.nav-anchor[href="#section-audio"]') }
            ];
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        sections.forEach(s => {
                            if (s.anchor) s.anchor.classList.toggle('active', s.id === entry.target.id);
                        });
                    }
                });
            }, { threshold: 0.35, rootMargin: '-60px 0px -40% 0px' });
            sections.forEach(s => {
                const el = document.getElementById(s.id);
                if (el) observer.observe(el);
            });
        }

        /* ===== 初始化入口 ===== */
        function init() {
            initTagChips();
            initSpeechRecognition();
            initFileUpload();
            renderMemoList();
            renderReminderList();
            document.getElementById('reminder-date').value = new Date().toISOString().split('T')[0];
            setInterval(checkReminders, 60000);  // 每60秒轮询提醒
            checkReminders();
            initScrollSpy();  // 初始化锚点滚动高亮
        }
        init();
    </script>
</body>
</html>
