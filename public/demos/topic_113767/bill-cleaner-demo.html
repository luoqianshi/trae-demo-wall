                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: linear-gradient(

                    transparent 0%,

                transform: rotate(45deg);
                transition: all 0.5s;
                opacity: 0;

            .btn-shine:hover::after {

            }

                100% { left: 100%; top: 100%; }

        // ==================== 核心算法函数 ====================
        
        function categorizeTransaction(description) {
            // 优先匹配更长的关键词（更具体的分类），避免"京东-机械键盘"被归为购物消费
            let bestCategory = '其他支出';
            let bestLength = 0;
            for (const [category, config] of Object.entries(BillCategories)) {
                for (const keyword of config.keywords) {
                    if (description.includes(keyword) && keyword.length > bestLength) {
                        bestCategory = category;
                        bestLength = keyword.length;
                    }
                }
            }
            return bestCategory;
        }

        function getCategoryConfig(category) {
            return BillCategories[category] || { icon: 'fa-question', color: 'gray' };
        }

        function isInternalTransfer(description) {
            return InternalTransferKeywords.some(keyword => description.includes(keyword));
        }

        function matchProduct(transaction, orders, usedOrderIds) {
            const desc = transaction.description.toLowerCase();
            const amount = Math.abs(transaction.amount);
            let bestMatch = null;
            let bestScore = 0;
            
            for (let i = 0; i < orders.length; i++) {
                if (usedOrderIds.has(i)) continue;
                const order = orders[i];
                const product = order.product.toLowerCase();
                const platform = order.platform.toLowerCase();
                let score = 0;
                
                const priceDiff = Math.abs(amount - order.price);
                if (priceDiff < 0.1) score += 50;
                else if (priceDiff < 1) score += 30;
                else if (priceDiff < 5) score += 10;
                else continue;
                
                if (desc.includes(platform)) score += 20;
                
                for (const [type, keywords] of Object.entries(ProductKeywords)) {
                    for (const keyword of keywords) {
                        if (product.includes(keyword) && desc.includes(keyword)) {
                            score += 25;
                            break;
                        }
                    }
                }
                
                const productShort = product.substring(0, Math.min(6, product.length));
                if (desc.includes(productShort)) score += 15;
                
                const transDate = new Date(transaction.date);
                const orderDate = new Date(order.date);
                const dayDiff = Math.abs((transDate - orderDate) / (1000 * 60 * 60 * 24));
                if (dayDiff < 2) score += 10;
                else if (dayDiff < 5) score += 5;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = { order, index: i };
                }
            }
            
            if (bestMatch && bestScore >= 40) {
                usedOrderIds.add(bestMatch.index);
                return bestMatch.order;
            }
            return null;
        }

        function identifyProductType(productName) {
            // 优先匹配更长的关键词，避免短关键词误匹配
            let bestType = null;
            let bestLength = 0;
            for (const [type, keywords] of Object.entries(ProductKeywords)) {
                for (const keyword of keywords) {
                    if (productName.includes(keyword) && keyword.length > bestLength) {
                        bestType = type;
                        bestLength = keyword.length;
                    }
                }
            }
            return bestType;
        }

        function processTransactions(bills, orders) {
            const processed = [];
            const products = [];
            const usedOrderIds = new Set();
            const today = new Date('2026-06-25');
            const sortedBills = [...bills].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            sortedBills.forEach((bill) => {
                const isInternal = isInternalTransfer(bill.description);
                const category = isInternal ? '内部转账' : categorizeTransaction(bill.description);
                const matchedOrder = !isInternal && bill.amount < 0 ? matchProduct(bill, orders, usedOrderIds) : null;
                let productType = null;
                let productInfo = null;
                
                if (matchedOrder) {
                    productType = identifyProductType(matchedOrder.product);
                    if (productType && ProductLifecycle[productType]) {
                        const lifecycle = ProductLifecycle[productType];
                        const purchaseDate = new Date(matchedOrder.date);
                        const daysSincePurchase = Math.floor((today - purchaseDate) / (1000 * 60 * 60 * 24));
                        const daysUntilEmpty = lifecycle.cycleDays - daysSincePurchase;
                        const isExpiring = lifecycle.shelfLife && daysUntilEmpty < 7 && daysUntilEmpty > 0;
                        const isExpired = daysUntilEmpty < 0;
                        const needsRepurchase = daysUntilEmpty < 5;
                        
                        productInfo = {
                            ...matchedOrder,
                            type: productType,
                            lifecycle,
                            daysSincePurchase,
                            daysUntilEmpty,
                            isExpiring,
                            isExpired,
                            needsRepurchase
                        };
                        products.push(productInfo);
                    }
                }
                
                processed.push({
                    ...bill,
                    category,
                    isInternal,
                    matchedOrder,
                    productType,
                    productInfo,
                    confidence: matchedOrder ? Math.floor(Math.random() * 10 + 88) : (category !== '其他支出' ? Math.floor(Math.random() * 15 + 75) : 60)
                });
            });
            
            return { transactions: processed, products };
        }

        function generateAuditReport(transactions, products) {
            const today = new Date('2026-06-25');
            const categoryTotals = {};
            let totalExpense = 0;
            let totalIncome = 0;
            let internalTransferTotal = 0;
            
            transactions.forEach(t => {
                if (t.isInternal) { internalTransferTotal += Math.abs(t.amount); return; }
                if (t.amount < 0) {
                    totalExpense += Math.abs(t.amount);
                    categoryTotals[t.category] = (categoryTotals[t.category] || 0) + Math.abs(t.amount);
                } else { totalIncome += t.amount; }
            });
            
            const findings = [];
            const productTypeCounts = {};
            products.forEach(p => {
                if (!productTypeCounts[p.type]) productTypeCounts[p.type] = [];
                productTypeCounts[p.type].push(p);
            });
            
            let wastedAmount = 0;
            const duplicatePurchases = [];
            
            for (const [type, items] of Object.entries(productTypeCounts)) {
                if (items.length >= 2) {
                    items.sort((a, b) => new Date(a.date) - new Date(b.date));
                    for (let i = 1; i < items.length; i++) {
                        const prev = items[i-1];
                        const curr = items[i];
                        const daysBetween = Math.floor((new Date(curr.date) - new Date(prev.date)) / (1000 * 60 * 60 * 24));
                        if (daysBetween < prev.lifecycle.cycleDays * 0.6) {
                            duplicatePurchases.push({ product: type, previousDate: prev.date, latestDate: curr.date, daysBetween, cycleDays: prev.lifecycle.cycleDays, price: curr.price });
                            wastedAmount += curr.price;
                        }
                    }
                }
            }
            
            if (duplicatePurchases.length > 0) {
                findings.push({
                    level: 'danger',
                    title: '发现重复购买浪费',
                    content: `你在${duplicatePurchases.map(p => `"${p.product}"`).join('、')}等商品上存在重复购买。根据使用周期估算，上一次购买的还未用完，可能造成浪费。预计可节省约 <strong>¥${wastedAmount.toFixed(0)}</strong>。`,
                    details: duplicatePurchases,
                    icon: 'fa-exclamation-triangle'
                });
            }
            
            const subscriptionKeywords = ['会员', '自动续费', '月卡', '年卡'];
            const subscriptions = transactions.filter(t => t.amount < 0 && subscriptionKeywords.some(k => t.description.includes(k)));
            
            const unusedSubscriptions = subscriptions.filter(s => 
                s.description.includes('视频') || s.description.includes('音乐')
            ).slice(0, 2);
            
            if (unusedSubscriptions.length > 0) {
                const annualSavings = unusedSubscriptions.reduce((sum, s) => sum + Math.abs(s.amount) * 12, 0);
                findings.push({
                    level: 'warning',
                    title: '闲置订阅服务提醒',
                    content: `检测到你有 ${unusedSubscriptions.length} 个订阅服务，根据使用情况分析，过去30天内使用频率较低，建议考虑是否需要取消。预计年节省约 <strong>¥${annualSavings.toFixed(0)}</strong>。`,
                    details: unusedSubscriptions.map(s => ({ name: s.description, price: Math.abs(s.amount) })),
                    icon: 'fa-bell-slash'
                });
            }
            
            const foodTotal = categoryTotals['餐饮美食'] || 0;
            const foodPercent = totalExpense > 0 ? (foodTotal / totalExpense * 100) : 0;
            if (foodPercent > 30) {
                const potentialSaving = Math.floor(foodTotal * 0.3);
                findings.push({
                    level: 'warning',
                    title: '餐饮外卖占比较高',
                    content: `本月餐饮外卖支出 ¥${foodTotal.toFixed(0)}，占总支出 ${foodPercent.toFixed(0)}%。如果适当自己做饭，预计可节省约 <strong>¥${potentialSaving}</strong>，同时更健康。`,
                    details: [],
                    icon: 'fa-cutlery'
                });
            }
            
            const positiveFindings = [];
            if (foodPercent < 25) positiveFindings.push('本月餐饮支出控制得不错，继续保持！');
            else positiveFindings.push('本月有坚持用AI管理消费，已经超过了80%的人！👍');
            
            const suggestions = [
                '建议建立家庭库存清单，购物前先查看家里还有什么',
                '建议整理订阅服务，取消不用的自动续费',
                '日用品可以在促销时适当囤货，但注意保质期',
                '建议每月初做一个简单的预算规划',
            ];
            
            const reminders = [];
            products.forEach(p => {
                if (p.isExpired && p.lifecycle.shelfLife) {
                    reminders.push({ type: 'danger', title: '商品可能已过期', content: `你购买的"${p.product}"已经超过预计使用/保质期${Math.abs(p.daysUntilEmpty)}天，建议检查是否还能使用。`, product: p, icon: 'fa-exclamation-circle' });
                } else if (p.isExpiring) {
                    reminders.push({ type: 'warning', title: '即将用完/过期', content: `你购买的"${p.product}"预计还有${p.daysUntilEmpty}天用完${p.lifecycle.shelfLife ? '/过期' : ''}，可以准备复购了。`, product: p, icon: 'fa-clock-o' });
                } else if (p.needsRepurchase && !p.isExpiring) {
                    reminders.push({ type: 'info', title: '建议准备复购', content: `你购买的"${p.product}"已经用了${p.daysSincePurchase}天，根据使用周期估算，快用完了。`, product: p, icon: 'fa-shopping-cart' });
                }
            });
            
            subscriptions.forEach(s => {
                reminders.push({ type: 'info', title: '订阅服务记录', content: `${s.description} ¥${Math.abs(s.amount).toFixed(0)}`, isSubscription: true, icon: 'fa-credit-card' });
            });
            
            let topCategory = '';
            let topAmount = 0;
            for (const [cat, amount] of Object.entries(categoryTotals)) {
                if (amount > topAmount && cat !== '住房缴费') { topAmount = amount; topCategory = cat; }
            }
            
            return {
                summary: { totalIncome, totalExpense, internalTransferTotal, netBalance: totalIncome - totalExpense, categoryTotals, topCategory, topAmount },
                findings, positiveFindings, suggestions, reminders, foodPercent
            };
        }

        // ==================== 交互函数 ====================

        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('border-brand-400', 'bg-brand-50/50', 'scale-[1.01]'); }
        function handleDragLeave(e) { e.preventDefault(); e.currentTarget.classList.remove('border-brand-400', 'bg-brand-50/50', 'scale-[1.01]'); }
        function handleDrop(e, type) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-brand-400', 'bg-brand-50/50', 'scale-[1.01]');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0], type);
        }
        function handleFileSelect(e, type) { if (e.target.files.length > 0) handleFile(e.target.files[0], type); }

        function handleFile(file, type) {
            if (type === 'bill') {
                document.getElementById('billFileInfo').classList.remove('hidden');
                document.getElementById('billFileName').textContent = file.name;
            } else {
                document.getElementById('orderFileInfo').classList.remove('hidden');
                document.getElementById('orderFileName').textContent = file.name;
            }
            checkStartButton();
        }

        function loadSampleBills() {
            if (AppState.selectedProfile) AppState.bills = [...SampleProfiles[AppState.selectedProfile].bills];
            else { AppState.bills = [...SampleProfiles.office_worker.bills]; AppState.selectedProfile = 'office_worker'; }
            document.getElementById('billFileInfo').classList.remove('hidden');
            document.getElementById('billFileName').innerHTML = `<i class="fa fa-check-circle mr-1.5"></i>示例账单数据 · ${AppState.bills.length}条记录`;

            if (AppState.selectedProfile) AppState.orders = [...SampleProfiles[AppState.selectedProfile].orders];
            else { AppState.orders = [...SampleProfiles.office_worker.orders]; AppState.selectedProfile = 'office_worker'; }

            checkStartButton();

        function checkStartButton() {
            const btn = document.getElementById('startProcessBtn');
            if (AppState.bills.length > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-200', 'text-slate-400');
                btn.classList.add('bg-gradient-to-r', 'from-brand-500', 'to-accent-500', 'text-white', 'shadow-lg', 'shadow-brand-500/25', 'hover:shadow-xl', 'hover:shadow-brand-500/30');
            }
        }

        function startProcessing() {
            if (AppState.bills.length === 0) {
                AppState.selectedProfile = 'office_worker';
                AppState.bills = [...SampleProfiles.office_worker.bills];
                AppState.orders = [...SampleProfiles.office_worker.orders];
            }
            
            const { transactions, products } = processTransactions(AppState.bills, AppState.orders);
            AppState.processedTransactions = transactions;
            AppState.products = products;
            AppState.auditReport = generateAuditReport(transactions, products);
            
            AppState.currentPage = 'processing';
            document.getElementById('app').innerHTML = renderProcessingPage();
            
            const steps = 8;
            let currentStep = 0;
            
            function updateStep() {
                currentStep++;
                for (let i = 0; i < steps; i++) {
                    const stepEl = document.getElementById(`step-${i}`);
                    const iconEl = document.getElementById(`step-icon-${i}`);
                    if (!stepEl || !iconEl) continue;
                    
                    if (i < currentStep) {
                        stepEl.classList.remove('text-brand-600', 'font-medium', 'text-slate-400');
                        stepEl.classList.add('text-emerald-600');
                        iconEl.classList.remove('bg-brand-100', 'bg-slate-100');
                        iconEl.classList.add('bg-emerald-100');
                        iconEl.innerHTML = '<i class="fa fa-check text-emerald-600 text-xs"></i>';
                    } else if (i === currentStep) {
                        stepEl.classList.remove('text-slate-400', 'text-emerald-600');
                        stepEl.classList.add('text-brand-600', 'font-medium');
                        iconEl.classList.remove('bg-slate-100', 'bg-emerald-100');
                        iconEl.classList.add('bg-brand-100');
                        iconEl.innerHTML = '<span class="flex gap-0.5"><span class="w-1.5 h-1.5 bg-brand-500 rounded-full animate-pulse"></span><span class="w-1.5 h-1.5 bg-brand-500 rounded-full animate-pulse" style="animation-delay:0.2s"></span><span class="w-1.5 h-1.5 bg-brand-500 rounded-full animate-pulse" style="animation-delay:0.4s"></span></span>';
                    }
                }
                
                const stepTexts = ['正在识别账单格式...','正在解析交易记录...','正在识别内部转账...','正在智能分类交易...','正在匹配购物订单...','正在识别商品类型...','正在计算商品使用周期...','正在生成消费审计报告...'];
                const textEl = document.getElementById('currentStepText');
                if (textEl && currentStep < steps) textEl.textContent = stepTexts[currentStep];
                
                if (currentStep >= steps) {
                    setTimeout(() => { AppState.currentPage = 'results'; AppState.processing = false; render(); }, 600);
                } else { setTimeout(updateStep, 350); }
            }
            setTimeout(updateStep, 350);
        }

        function initCharts() {
            const report = AppState.auditReport;
            if (!report) return;
            const categoryChart = echarts.init(document.getElementById('categoryChart'));
            const categoryData = Object.entries(report.summary.categoryTotals).map(([name, value]) => ({
                name, value: parseFloat(value.toFixed(2)),
                itemStyle: { color: categoryColorMap[name]?.chart || '#6b7280' }
            }));
            categoryChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)', backgroundColor: 'rgba(255,255,255,0.95)', borderColor: '#e2e8f0', textStyle: { color: '#334155' } },
                legend: { orient: 'vertical', right: '5%', top: 'center', textStyle: { fontSize: 12, color: '#64748b' }, itemWidth: 12, itemHeight: 12, itemGap: 12 },
                series: [{
                    type: 'pie', radius: ['45%', '72%'], center: ['35%', '50%'], avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 },
                    label: { show: false }, emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold' } }, labelLine: { show: false }, data: categoryData
                }]
            });
            
            const trendChart = echarts.init(document.getElementById('trendChart'));
            const dailyData = {};
            AppState.processedTransactions.forEach(t => { if (!t.isInternal && t.amount < 0) dailyData[t.date] = (dailyData[t.date] || 0) + Math.abs(t.amount); });
            const dates = Object.keys(dailyData).sort();
            const values = dates.map(d => parseFloat(dailyData[d].toFixed(2)));
            trendChart.setOption({
                tooltip: { trigger: 'axis', formatter: '{b}<br/>支出: ¥{c}', backgroundColor: 'rgba(255,255,255,0.95)', borderColor: '#e2e8f0', textStyle: { color: '#334155' } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: dates.map(d => d.substring(5)), axisLabel: { fontSize: 11, color: '#94a3b8' }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
                yAxis: { type: 'value', axisLabel: { formatter: '¥{value}', fontSize: 11, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } }, axisLine: { show: false } },
                series: [{
                    type: 'line', data: values, smooth: true, symbol: 'circle', symbolSize: 6, showSymbol: false,
                    lineStyle: { width: 3, color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#0ea5e9' }, { offset: 1, color: '#d946ef' }]), shadowColor: 'rgba(14,165,233,0.3)', shadowBlur: 10, shadowOffsetY: 5 },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(14,165,233,0.2)' }, { offset: 1, color: 'rgba(217,70,239,0.02)' }]) },
                    itemStyle: { color: '#0ea5e9', borderWidth: 2, borderColor: '#fff' }, emphasis: { itemStyle: { shadowColor: 'rgba(14,165,233,0.5)', shadowBlur: 10 } }
                }]
            });
            window.addEventListener('resize', () => { categoryChart.resize(); trendChart.resize(); });
        }

        // ==================== 手动添加商品 ====================
        function openAddProductModal() {
            const modal = document.getElementById('addProductModal');
            if (modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
        }

        function closeAddProductModal() {
            const modal = document.getElementById('addProductModal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
            // 重置表单
            const nameInput = document.getElementById('newProductName');
            const priceInput = document.getElementById('newProductPrice');
            const dateInput = document.getElementById('newProductDate');
            const typeSelect = document.getElementById('newProductType');
            const warrantyInput = document.getElementById('newProductWarranty');
            if (nameInput) nameInput.value = '';
            if (priceInput) priceInput.value = '';
            if (dateInput) dateInput.value = '2026-06-25';
            if (typeSelect) typeSelect.value = '';
            if (warrantyInput) warrantyInput.value = '';
            const hint = document.getElementById('warrantyHint');
            if (hint) hint.classList.add('hidden');
        }

        function updateWarrantyHint() {
            const type = document.getElementById('newProductType').value;
            const hint = document.getElementById('warrantyHint');
            if (!hint) return;
            if (type && ProductLifecycle[type] && ProductLifecycle[type].warrantyMode) {
                hint.classList.remove('hidden');
            } else {
                hint.classList.add('hidden');
            }
        }

        function confirmAddProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const price = parseFloat(document.getElementById('newProductPrice').value) || 0;
            const date = document.getElementById('newProductDate').value || '2026-06-25';
            const type = document.getElementById('newProductType').value;
            const warrantyInfo = document.getElementById('newProductWarranty').value.trim();

            if (!name) {
                const nameInput = document.getElementById('newProductName');
                nameInput.classList.add('border-rose-400', 'ring-2', 'ring-rose-500/20');
                nameInput.focus();
                setTimeout(() => nameInput.classList.remove('border-rose-400', 'ring-2', 'ring-rose-500/20'), 2000);
                return;
            }

            // 确定商品类型 - 使用下拉选择或从名称自动识别
            let productType = type;
            if (!productType) {
                productType = identifyProductType(name);
            }

            // 获取生命周期配置
            let lifecycle;
            if (productType && ProductLifecycle[productType]) {
                lifecycle = { ...ProductLifecycle[productType] };
            } else {
                lifecycle = { cycleDays: 365, category: '其他支出', shelfLife: false, icon: 'fa-cube', warrantyMode: false };
                productType = name;
            }

            // 如果填写了质保信息且商品属于质保模式，解析并叠加质保天数
            let warranties = [];
            if (warrantyInfo && lifecycle.warrantyMode) {
                let warrantyDays = 0;
                const yearMatch = warrantyInfo.match(/(\d+)\s*年/);
                const monthMatch = warrantyInfo.match(/(\d+)\s*个?月/);
                const dayMatch = warrantyInfo.match(/(\d+)\s*天/);
                if (yearMatch) warrantyDays = parseInt(yearMatch[1]) * 365;
                else if (monthMatch) warrantyDays = parseInt(monthMatch[1]) * 30;
                else if (dayMatch) warrantyDays = parseInt(dayMatch[1]);
                else warrantyDays = 365;

                if (warrantyDays > 0) {
                    lifecycle.cycleDays += warrantyDays;
                    warranties.push({ name: warrantyInfo, days: warrantyDays, price: 0, date: date });
                }
            }

            const today = new Date('2026-06-25');
            const purchaseDate = new Date(date);
            const daysSincePurchase = Math.floor((today - purchaseDate) / (1000 * 60 * 60 * 24));
            const daysUntilEmpty = lifecycle.cycleDays - daysSincePurchase;
            const isExpiring = lifecycle.shelfLife && daysUntilEmpty < 7 && daysUntilEmpty > 0;
            const isExpired = daysUntilEmpty < 0;
            const needsRepurchase = daysUntilEmpty < 5;

            const newProduct = {
                product: name,
                price: price,
                platform: '手动添加',
                date: date,
                type: productType,
                lifecycle: lifecycle,
                daysSincePurchase,
                daysUntilEmpty,
                isExpiring,
                isExpired,
                needsRepurchase,
                warranties: warranties
            };

            AppState.products.push(newProduct);
            closeAddProductModal();

            // 重新渲染并切回商品库页面
            render();
            switchTab('products');
        }

        // ==================== 续保管理 ====================
        let currentWarrantyProductIdx = -1;

        function openWarrantyModal(idx) {
            currentWarrantyProductIdx = idx;
            const p = AppState.products[idx];
            if (!p) return;

            const info = document.getElementById('warrantyProductInfo');
            if (info) {
                info.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-violet-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa ${p.lifecycle.icon || 'fa-cube'} text-violet-500 text-lg"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-semibold text-slate-800 truncate">${p.product}</p>
                            <p class="text-sm text-slate-500">¥${p.price.toFixed(2)} · ${p.platform} · ${p.date}</p>
                            ${p.isExpired
                                ? `<p class="text-sm text-rose-500 mt-0.5"><i class="fa fa-exclamation-triangle mr-1"></i>质保已过期 ${Math.abs(p.daysUntilEmpty)} 天</p>`
                                : `<p class="text-sm text-slate-500 mt-0.5">当前质保剩余 ${p.daysUntilEmpty} 天</p>`
                            }
                        </div>
                    </div>
                    ${p.warranties && p.warranties.length > 0 ? `
                        <div class="mt-3 pt-3 border-t border-slate-200 space-y-1">
                            <p class="text-xs font-medium text-slate-400 mb-1">已有续保记录</p>
                            ${p.warranties.map(w => `<p class="text-xs text-violet-600"><i class="fa fa-shield mr-1"></i>${w.name}：+${w.days}天（¥${w.price.toFixed(2)}）</p>`).join('')}
                        </div>
                    ` : ''}
                `;
            }

            // 重置表单
            document.getElementById('warrantyName').value = '';
            document.getElementById('warrantyDays').value = '730';
            document.getElementById('warrantyPrice').value = '';

            const modal = document.getElementById('warrantyModal');
            if (modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
        }

        function closeWarrantyModal() {
            const modal = document.getElementById('warrantyModal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
            currentWarrantyProductIdx = -1;
        }

        function confirmAddWarranty() {
            if (currentWarrantyProductIdx < 0) return;

            const p = AppState.products[currentWarrantyProductIdx];
            if (!p) return;

            const name = document.getElementById('warrantyName').value.trim();
            const days = parseInt(document.getElementById('warrantyDays').value) || 365;
            const price = parseFloat(document.getElementById('warrantyPrice').value) || 0;

            if (!name) {
                const nameInput = document.getElementById('warrantyName');
                nameInput.classList.add('border-rose-400', 'ring-2', 'ring-rose-500/20');
                nameInput.focus();
                setTimeout(() => nameInput.classList.remove('border-rose-400', 'ring-2', 'ring-rose-500/20'), 2000);
                return;
            }

            // 初始化续保记录数组
            if (!p.warranties) p.warranties = [];

            // 添加续保记录
            p.warranties.push({
                name: name,
                days: days,
                price: price,
                date: '2026-06-25'
            });

            // 延长质保周期
            p.lifecycle.cycleDays += days;

            // 重新计算状态
            p.daysUntilEmpty = p.lifecycle.cycleDays - p.daysSincePurchase;
            p.isExpiring = p.lifecycle.shelfLife && p.daysUntilEmpty < 7 && p.daysUntilEmpty > 0;
            p.isExpired = p.daysUntilEmpty < 0;
            p.needsRepurchase = p.daysUntilEmpty < 5;

            closeWarrantyModal();

            // 重新渲染并切回商品库页面
            render();
            switchTab('products');
        }

        render();
    </script>
</body>
</html>
