<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDrive - 安全驾驶监测系统演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #ff6b6b;
            --success-color: #2ed573;
            --warning-color: #ffa502;
            --dark-bg: #0a0e17;
            --card-bg: #131b2e;
            --text-primary: #ffffff;
            --text-secondary: #8892a8;
            --accent: #00d4ff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 420px;
            margin: 0 auto;
            background: var(--dark-bg);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(19, 27, 46, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .app-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
        }

        .lang-toggle {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .camera-preview {
            width: 100%;
            height: 280px;
            background: linear-gradient(180deg, #0d1424, #0a0e17);
            position: relative;
            overflow: hidden;
        }

        .camera-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .face-mesh {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
        }

        .face-outline {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 1.5;
            opacity: 0.8;
            animation: pulse 2s ease-in-out infinite;
        }

        .eye-point {
            fill: var(--success-color);
            animation: blink 4s ease-in-out infinite;
        }

        .eye-point.right {
            animation-delay: 1s;
        }

        .nose-point {
            fill: var(--primary-color);
        }

        .mouth-point {
            fill: var(--warning-color);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { r: 3; }
            50% { r: 0.5; }
        }

        .camera-controls {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 16px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--card-bg);
            margin: 0 12px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .status-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .status-card.active {
            background: rgba(46, 213, 115, 0.15);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-card.warning {
            background: rgba(255, 165, 2, 0.15);
            border: 1px solid rgba(255, 165, 2, 0.3);
        }

        .status-card.danger {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        .status-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .status-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: center;
        }

        .alert-section {
            padding: 16px;
            margin: 0 12px 12px;
            border-radius: 16px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-section.active {
            display: block;
        }

        .alert-warning {
            background: linear-gradient(135deg, rgba(255, 165, 2, 0.2), rgba(255, 140, 0, 0.1));
            border: 1px solid rgba(255, 165, 2, 0.4);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 80, 80, 0.1));
            border: 1px solid rgba(255, 107, 107, 0.4);
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(46, 213, 115, 0.2), rgba(30, 180, 80, 0.1));
            border: 1px solid rgba(46, 213, 115, 0.4);
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .alert-icon {
            font-size: 20px;
        }

        .alert-title {
            font-size: 14px;
            font-weight: 600;
        }

        .alert-message {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .control-section {
            padding: 0 12px;
            margin-bottom: 20px;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, var(--secondary-color), #cc5555);
            color: white;
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .demo-controls {
            padding: 16px;
            background: var(--card-bg);
            margin: 0 12px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .demo-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .demo-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .demo-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .demo-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--primary-color);
        }

        .demo-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .stats-section {
            padding: 16px;
            background: var(--card-bg);
            margin: 0 12px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .footer {
            padding: 20px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            border-top: 1px solid var(--border-color);
        }

        .feature-highlight {
            padding: 16px;
            margin: 0 12px 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 153, 204, 0.05));
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .feature-item {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-item::before {
            content: '✓';
            color: var(--success-color);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">🚗</div>
            <div class="app-title" data-i18n="app_title">SafeDrive 安全驾驶</div>
            <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
        </header>

        <div class="camera-preview">
            <div class="camera-placeholder">
                <div style="font-size: 48px; margin-bottom: 8px;">📷</div>
                <span data-i18n="camera_placeholder">实时摄像头预览</span>
            </div>
            <svg class="face-mesh" viewBox="0 0 200 200">
                <circle class="eye-point left" cx="70" cy="80" r="3"/>
                <circle class="eye-point right" cx="130" cy="80" r="3"/>
                <circle class="nose-point" cx="100" cy="110" r="2"/>
                <circle class="mouth-point" cx="100" cy="140" r="3"/>
                <path class="face-outline" d="M60 50 Q100 30 140 50 Q160 80 160 110 Q160 140 140 170 Q100 190 60 170 Q40 140 40 110 Q40 80 60 50"/>
            </svg>
            <div class="camera-controls">
                <button class="control-btn" title="切换摄像头">🔄</button>
                <button class="control-btn" title="隐藏摄像头">🙈</button>
            </div>
        </div>

        <div class="status-grid">
            <div class="status-card" id="statusEye">
                <div class="status-icon">👁️</div>
                <div class="status-value" id="eyeValue">--</div>
                <div class="status-label" data-i18n="eye_label">闭眼</div>
            </div>
            <div class="status-card" id="statusYawn">
                <div class="status-icon">😮</div>
                <div class="status-value" id="yawnValue">--</div>
                <div class="status-label" data-i18n="yawn_label">哈欠</div>
            </div>
            <div class="status-card" id="statusHead">
                <div class="status-icon">🙉</div>
                <div class="status-value" id="headValue">--</div>
                <div class="status-label" data-i18n="head_label">头部</div>
            </div>
            <div class="status-card" id="statusTime">
                <div class="status-icon">⏱️</div>
                <div class="status-value" id="timeValue">0 min</div>
                <div class="status-label" data-i18n="time_label">驾驶时长</div>
            </div>
            <div class="status-card" id="statusSpeed">
                <div class="status-icon">🚗</div>
                <div class="status-value" id="speedValue">0</div>
                <div class="status-label" data-i18n="speed_label">车速</div>
            </div>
        </div>

        <div class="alert-section" id="alertSection">
            <div class="alert-header">
                <div class="alert-icon" id="alertIcon">⚠️</div>
                <div class="alert-title" id="alertTitle">警告标题</div>
            </div>
            <div class="alert-message" id="alertMessage">警告内容</div>
        </div>

        <div class="feature-highlight">
            <div class="feature-title" data-i18n="features_title">🌟 核心功能</div>
            <div class="feature-list">
                <div class="feature-item" data-i18n="feature_eye">基于PERCLOS算法的疲劳检测，实时监测闭眼状态</div>
                <div class="feature-item" data-i18n="feature_yawn">MAR嘴巴纵横比检测，识别打哈欠行为</div>
                <div class="feature-item" data-i18n="feature_head">头部俯仰角计算，检测低头看手机等危险行为</div>
                <div class="feature-item" data-i18n="feature_time">自定义驾驶时长提醒，防止疲劳驾驶</div>
                <div class="feature-item" data-i18n="feature_multi">支持中英文双语切换，国际化设计</div>
            </div>
        </div>

        <div class="stats-section">
            <div class="demo-title" data-i18n="trip_stats">本次行程统计</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statBlinks">0</div>
                    <div class="stat-label" data-i18n="stat_blinks">眨眼次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statYawns">0</div>
                    <div class="stat-label" data-i18n="stat_yawns">哈欠次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statHeadDown">0</div>
                    <div class="stat-label" data-i18n="stat_head">低头次数</div>
                </div>
            </div>
        </div>

        <div class="demo-controls">
            <div class="demo-title" data-i18n="demo_controls">🎮 演示控制</div>
            <div class="demo-buttons">
                <button class="demo-btn" onclick="simulateNormal()" data-i18n="demo_normal">正常状态</button>
                <button class="demo-btn" onclick="simulateEyeClosed()" data-i18n="demo_eye">模拟闭眼</button>
                <button class="demo-btn" onclick="simulateYawn()" data-i18n="demo_yawn">模拟哈欠</button>
                <button class="demo-btn" onclick="simulateHeadDown()" data-i18n="demo_head">模拟低头</button>
                <button class="demo-btn" onclick="simulateDrivingTimeout()" data-i18n="demo_timeout">驾驶超时</button>
            </div>
        </div>

        <div class="control-section">
            <button class="action-btn btn-start" id="startBtn" onclick="startMonitoring()" data-i18n="btn_start">
                <span>▶</span> <span>开始监测</span>
            </button>
            <button class="action-btn btn-stop" id="stopBtn" onclick="stopMonitoring()" data-i18n="btn_stop" style="display: none;">
                <span>⏹</span> <span>停止监测</span>
            </button>
        </div>

        <footer class="footer">
            <div data-i18n="footer_text">SafeDrive v122 - 守护每一次出行</div>
        </footer>
    </div>

    <script>
        const I18N = {
            currentLang: 'zh',
            translations: {
                zh: {
                    app_title: 'SafeDrive 安全驾驶',
                    camera_placeholder: '实时摄像头预览',
                    eye_label: '闭眼',
                    yawn_label: '哈欠',
                    head_label: '头部',
                    time_label: '驾驶时长',
                    speed_label: '车速',
                    features_title: '🌟 核心功能',
                    feature_eye: '基于PERCLOS算法的疲劳检测，实时监测闭眼状态',
                    feature_yawn: 'MAR嘴巴纵横比检测，识别打哈欠行为',
                    feature_head: '头部俯仰角计算，检测低头看手机等危险行为',
                    feature_time: '自定义驾驶时长提醒，防止疲劳驾驶',
                    feature_multi: '支持中英文双语切换，国际化设计',
                    trip_stats: '本次行程统计',
                    stat_blinks: '眨眼次数',
                    stat_yawns: '哈欠次数',
                    stat_head: '低头次数',
                    demo_controls: '🎮 演示控制',
                    demo_normal: '正常状态',
                    demo_eye: '模拟闭眼',
                    demo_yawn: '模拟哈欠',
                    demo_head: '模拟低头',
                    demo_timeout: '驾驶超时',
                    btn_start: '开始监测',
                    btn_stop: '停止监测',
                    footer_text: 'SafeDrive v122 - 守护每一次出行',
                    alert_eye_warning: '轻度疲劳警告',
                    alert_eye_message: '检测到频繁眨眼，请注意休息',
                    alert_eye_danger: '重度疲劳警报',
                    alert_eye_danger_message: '检测到长时间闭眼，立即停车休息！',
                    alert_yawn: '打哈欠提醒',
                    alert_yawn_message: '检测到打哈欠，您可能需要休息',
                    alert_head: '低头警告',
                    alert_head_message: '请保持视线向前，注意行车安全',
                    alert_timeout: '驾驶超时提醒',
                    alert_timeout_message: '已连续驾驶超过4小时，请停车休息',
                    status_normal: '正常',
                    status_warning: '警告',
                    status_danger: '危险'
                },
                en: {
                    app_title: 'SafeDrive',
                    camera_placeholder: 'Camera Preview',
                    eye_label: 'Eye',
                    yawn_label: 'Yawn',
                    head_label: 'Head',
                    time_label: 'Driving Time',
                    speed_label: 'Speed',
                    features_title: '🌟 Core Features',
                    feature_eye: 'PERCLOS-based fatigue detection, real-time eye closure monitoring',
                    feature_yawn: 'MAR mouth aspect ratio detection, yawn recognition',
                    feature_head: 'Head pitch angle calculation, detects distracted driving',
                    feature_time: 'Custom driving duration reminder, prevents fatigue',
                    feature_multi: 'Supports Chinese/English bilingual switch',
                    trip_stats: 'Trip Statistics',
                    stat_blinks: 'Blinks',
                    stat_yawns: 'Yawns',
                    stat_head: 'Head Down',
                    demo_controls: '🎮 Demo Controls',
                    demo_normal: 'Normal',
                    demo_eye: 'Simulate Blink',
                    demo_yawn: 'Simulate Yawn',
                    demo_head: 'Simulate Head Down',
                    demo_timeout: 'Driving Timeout',
                    btn_start: 'Start Monitoring',
                    btn_stop: 'Stop Monitoring',
                    footer_text: 'SafeDrive v122 - Protecting Every Journey',
                    alert_eye_warning: 'Fatigue Warning',
                    alert_eye_message: 'Frequent blinking detected, please take a break',
                    alert_eye_danger: 'Severe Fatigue Alert',
                    alert_eye_danger_message: 'Prolonged eye closure detected, stop immediately!',
                    alert_yawn: 'Yawn Alert',
                    alert_yawn_message: 'Yawn detected, you may need rest',
                    alert_head: 'Head Down Warning',
                    alert_head_message: 'Keep eyes on the road, drive safely',
                    alert_timeout: 'Driving Timeout',
                    alert_timeout_message: 'Continuous driving over 4 hours, please rest',
                    status_normal: 'OK',
                    status_warning: 'WARN',
                    status_danger: 'DANGER'
                }
            },
            t: function(key) {
                return this.translations[this.currentLang][key] || key;
            },
            updateUI: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.translations[this.currentLang][key]) {
                        el.textContent = this.translations[this.currentLang][key];
                    }
                });
            }
        };

        let isMonitoring = false;
        let monitoringInterval = null;
        let drivingStartTime = null;
        let blinkCount = 0;
        let yawnCount = 0;
        let headDownCount = 0;

        function toggleLang() {
            I18N.currentLang = I18N.currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('langToggle').textContent = I18N.currentLang === 'zh' ? 'EN' : '中';
            I18N.updateUI();
        }

        function startMonitoring() {
            isMonitoring = true;
            drivingStartTime = Date.now();
            blinkCount = 0;
            yawnCount = 0;
            headDownCount = 0;

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            
            updateStats();
            simulateNormal();
            
            monitoringInterval = setInterval(() => {
                updateDrivingTime();
                updateSpeed();
            }, 1000);
        }

        function stopMonitoring() {
            isMonitoring = false;
            clearInterval(monitoringInterval);
            
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            
            hideAlert();
            resetStatus();
        }

        function updateDrivingTime() {
            if (!drivingStartTime) return;
            const elapsed = Date.now() - drivingStartTime;
            const minutes = Math.floor(elapsed / 60000);
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            
            let timeText;
            if (hours > 0) {
                timeText = hours + ' ' + (I18N.currentLang === 'zh' ? '小时' : 'h') + ' ' + mins + ' ' + (I18N.currentLang === 'zh' ? '分钟' : 'min');
            } else {
                timeText = mins + ' ' + (I18N.currentLang === 'zh' ? '分钟' : 'min');
            }
            document.getElementById('timeValue').textContent = timeText;
        }

        function updateSpeed() {
            const speed = Math.floor(Math.random() * 60) + 40;
            document.getElementById('speedValue').textContent = speed + ' km/h';
        }

        function updateStats() {
            document.getElementById('statBlinks').textContent = blinkCount;
            document.getElementById('statYawns').textContent = yawnCount;
            document.getElementById('statHeadDown').textContent = headDownCount;
        }

        function resetStatus() {
            ['statusEye', 'statusYawn', 'statusHead', 'statusTime', 'statusSpeed'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('active', 'warning', 'danger');
            });
            document.getElementById('eyeValue').textContent = '--';
            document.getElementById('yawnValue').textContent = '--';
            document.getElementById('headValue').textContent = '--';
            document.getElementById('timeValue').textContent = '0 min';
            document.getElementById('speedValue').textContent = '0';
        }

        function showAlert(type, level) {
            const alertSection = document.getElementById('alertSection');
            const alertIcon = document.getElementById('alertIcon');
            const alertTitle = document.getElementById('alertTitle');
            const alertMessage = document.getElementById('alertMessage');

            alertSection.classList.remove('alert-warning', 'alert-danger', 'alert-success');
            
            if (level === 'danger') {
                alertSection.classList.add('alert-danger');
                alertIcon.textContent = '🚨';
            } else if (level === 'warning') {
                alertSection.classList.add('alert-warning');
                alertIcon.textContent = '⚠️';
            } else {
                alertSection.classList.add('alert-success');
                alertIcon.textContent = '✅';
            }

            alertTitle.textContent = I18N.t(type + '_title') || type;
            alertMessage.textContent = I18N.t(type + '_message') || '';
            alertSection.classList.add('active');
        }

        function hideAlert() {
            document.getElementById('alertSection').classList.remove('active');
        }

        function simulateNormal() {
            hideAlert();
            
            document.getElementById('statusEye').className = 'status-card active';
            document.getElementById('eyeValue').textContent = I18N.t('status_normal');
            
            document.getElementById('statusYawn').className = 'status-card active';
            document.getElementById('yawnValue').textContent = '0';
            
            document.getElementById('statusHead').className = 'status-card active';
            document.getElementById('headValue').textContent = I18N.t('status_normal');
            
            document.getElementById('statusTime').className = 'status-card';
            document.getElementById('statusSpeed').className = 'status-card';
        }

        function simulateEyeClosed() {
            document.getElementById('statusEye').className = 'status-card danger';
            document.getElementById('eyeValue').textContent = I18N.t('status_danger');
            blinkCount++;
            updateStats();
            showAlert('alert_eye_danger', 'danger');
        }

        function simulateYawn() {
            document.getElementById('statusYawn').className = 'status-card warning';
            document.getElementById('yawnValue').textContent = ++yawnCount;
            updateStats();
            showAlert('alert_yawn', 'warning');
        }

        function simulateHeadDown() {
            document.getElementById('statusHead').className = 'status-card danger';
            document.getElementById('headValue').textContent = I18N.t('status_danger');
            headDownCount++;
            updateStats();
            showAlert('alert_head', 'danger');
        }

        function simulateDrivingTimeout() {
            document.getElementById('statusTime').className = 'status-card warning';
            document.getElementById('timeValue').textContent = '4小时';
            showAlert('alert_timeout', 'warning');
        }

        window.onload = function() {
            I18N.updateUI();
        };
    </script>
</body>
</html>
