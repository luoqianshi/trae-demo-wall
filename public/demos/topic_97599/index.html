<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫MBTI - 可交互 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cat-orange: #FF9E43;
            --cat-orange-deep: #E65100;
            --cat-brown: #8D6E63;
            --cat-cream: #FFF8E7;
            --cat-milk: #FFFDF8;
            --cat-paw: #FFB74D;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF8E7 0%, #FFE8CC 100%);
            min-height: 100vh;
            color: #5D4037;
            overflow-x: hidden;
        }

        /* 背景漂浮猫爪 */
        .paws {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .paw {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 24px 20px 40px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页 */
        .home-header {
            text-align: center;
            padding-top: 40px;
            margin-bottom: 40px;
        }

        .cat-logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #FFB74D 0%, #FF9800 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            box-shadow: 0 12px 40px rgba(255, 152, 0, 0.35);
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            color: var(--cat-orange-deep);
            margin-bottom: 8px;
            letter-spacing: 6px;
        }

        .tagline {
            font-size: 15px;
            color: var(--cat-brown);
            letter-spacing: 1px;
        }

        .home-card {
            background: var(--cat-milk);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(93, 64, 55, 0.1);
            text-align: center;
        }

        .input-group {
            margin-bottom: 28px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 15px;
            color: var(--cat-brown);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .cat-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #FFE0B2;
            border-radius: 16px;
            font-size: 17px;
            color: #5D4037;
            background: #FFF;
            outline: none;
            transition: all 0.3s ease;
        }

        .cat-input:focus {
            border-color: var(--cat-orange);
            box-shadow: 0 0 0 4px rgba(255, 158, 67, 0.15);
        }

        .cat-input::placeholder {
            color: #BCAAA4;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFB74D 0%, #FF9800 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #FFF;
            color: var(--cat-orange-deep);
            border: 2px solid #FFE0B2;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #FFF8E7;
            border-color: var(--cat-orange);
        }

        .feature-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 158, 67, 0.12);
            color: var(--cat-orange-deep);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 测试页 */
        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--cat-brown);
            padding: 8px;
        }

        .progress-text {
            font-size: 14px;
            color: var(--cat-brown);
            font-weight: 500;
        }

        .progress-bar {
            height: 8px;
            background: #FFE0B2;
            border-radius: 4px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFB74D, #FF9800);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .question-card {
            background: var(--cat-milk);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 8px 30px rgba(93, 64, 55, 0.1);
        }

        .question-number {
            font-size: 13px;
            color: var(--cat-orange);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .question-title {
            font-size: 20px;
            color: #5D4037;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #FFF;
            border: 2px solid #FFE0B2;
            border-radius: 16px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: var(--cat-orange);
            background: #FFF8E7;
            transform: translateX(4px);
        }

        .option-marker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FFE0B2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--cat-orange-deep);
            flex-shrink: 0;
        }

        .option-text {
            font-size: 15px;
            color: #5D4037;
            line-height: 1.5;
        }

        /* 结果页 */
        .result-header {
            text-align: center;
            padding-top: 8px;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 18px;
            color: var(--cat-brown);
            margin-bottom: 8px;
        }

        .result-cat-name {
            font-size: 24px;
            color: var(--cat-orange-deep);
            font-weight: 700;
        }

        .type-circle {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFB74D 0%, #FF9800 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 12px 40px rgba(255, 152, 0, 0.35);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .type-code {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
        }

        .type-name {
            font-size: 16px;
            font-weight: 600;
            margin-top: 6px;
        }

        .type-title {
            text-align: center;
            font-size: 22px;
            color: var(--cat-orange-deep);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .traits {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .trait {
            background: rgba(255, 158, 67, 0.15);
            color: var(--cat-orange-deep);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .result-card {
            background: var(--cat-milk);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 6px 25px rgba(93, 64, 55, 0.08);
        }

        .result-card-title {
            font-size: 16px;
            color: var(--cat-orange-deep);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-card-content {
            font-size: 15px;
            color: #5D4037;
            line-height: 1.8;
        }

        .quote-box {
            background: linear-gradient(135deg, #FFE8CC 0%, #FFF0D6 100%);
            border-left: 4px solid var(--cat-orange);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            font-style: italic;
            color: var(--cat-orange-deep);
            font-size: 16px;
            line-height: 1.7;
            text-align: center;
        }

        .type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .type-mini {
            background: #FFF;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 2px solid #FFE0B2;
        }

        .type-mini-code {
            font-size: 18px;
            font-weight: 700;
            color: var(--cat-orange-deep);
        }

        .type-mini-name {
            font-size: 12px;
            color: var(--cat-brown);
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .actions .btn {
            flex: 1;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding-top: 120px;
        }

        .loading.active {
            display: block;
        }

        .loading-cat {
            font-size: 80px;
            animation: bounce 1s infinite;
        }

        .loading-text {
            margin-top: 20px;
            color: var(--cat-brown);
            font-size: 16px;
        }

        @media (max-width: 380px) {
            h1 { font-size: 30px; }
            .question-title { font-size: 18px; }
            .type-code { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="paws" id="paws"></div>

    <div class="app">
        <!-- 首页 -->
        <div class="screen active" id="screen-home">
            <div class="home-header">
                <div class="cat-logo">🐱</div>
                <h1>猫MBTI</h1>
                <p class="tagline">探索猫咪内心世界的性格测试小程序</p>
            </div>

            <div class="home-card">
                <div class="input-group">
                    <label class="input-label">🐾 即将测试的猫猫叫什么名字？</label>
                    <input type="text" class="cat-input" id="catNameInput" placeholder="请输入猫咪名字" maxlength="8">
                </div>

                <button class="btn btn-primary" onclick="startTest()">
                    开始测试 <span>➜</span>
                </button>

                <div class="feature-badges">
                    <span class="badge">🧠 MBTI理论</span>
                    <span class="badge">🎨 16种猫格</span>
                    <span class="badge">📤 分享海报</span>
                </div>
            </div>
        </div>

        <!-- 测试页 -->
        <div class="screen" id="screen-test">
            <div class="test-header">
                <button class="back-btn" onclick="goHome()">←</button>
                <span class="progress-text">题目 <span id="currentQ">1</span> / <span id="totalQ">4</span></span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 25%"></div>
            </div>

            <div class="question-card">
                <div class="question-number" id="qNumber">QUESTION 01</div>
                <div class="question-title" id="qTitle">题目加载中...</div>
                <div class="options" id="options"></div>
            </div>
        </div>

        <!-- 加载页 -->
        <div class="loading" id="screen-loading">
            <div class="loading-cat">🐱</div>
            <div class="loading-text">正在分析猫咪性格...</div>
        </div>

        <!-- 结果页 -->
        <div class="screen" id="screen-result">
            <div class="result-header">
                <div class="result-title">✨ 测试完成</div>
                <div class="result-cat-name"><span id="resCatName">猫咪</span> 是</div>
            </div>

            <div class="type-circle" id="typeCircle">
                <div class="type-code" id="typeCode">ENFP</div>
                <div class="type-name" id="typeName">竞选者</div>
            </div>

            <div class="type-title" id="typeTitle">快乐使者猫咪</div>

            <div class="traits" id="traits"></div>

            <div class="result-card">
                <div class="result-card-title">🐾 性格解读</div>
                <div class="result-card-content" id="desc">描述加载中...</div>
            </div>

            <div class="result-card">
                <div class="result-card-title">📅 日常行为</div>
                <div class="result-card-content" id="daily">日常行为加载中...</div>
            </div>

            <div class="result-card">
                <div class="result-card-title">🎾 最爱的玩具</div>
                <div class="result-card-content" id="toy">玩具加载中...</div>
            </div>

            <div class="result-card">
                <div class="result-card-title">🤚 抚摸方式</div>
                <div class="result-card-content" id="petting">抚摸方式加载中...</div>
            </div>

            <div class="quote-box" id="quote">名言加载中...</div>

            <div class="result-card">
                <div class="result-card-title">🤝 最佳猫友</div>
                <div class="type-grid" id="friends"></div>
            </div>

            <div class="result-card">
                <div class="result-card-title">⚠️ 需要避开的类型</div>
                <div class="type-grid" id="avoids"></div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="goHome()">🏠 返回首页</button>
                <button class="btn btn-primary" onclick="restartTest()">🔄 重新测试</button>
            </div>
        </div>
    </div>

        function switchScreen(screenId) {
            document.querySelectorAll('.screen, .loading').forEach(el => el.classList.remove('active'));
            if (screenId === 'screen-loading') {

            renderQuestion();

            document.getElementById('catNameInput').value = '';

        }

            switchScreen('screen-home');

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('qNumber').textContent = `QUESTION 0${currentQuestion + 1}`;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';

                    <div class="option-marker">${String.fromCharCode(65 + index)}</div>
                    <div class="option-text">${opt.text}</div>
                </div>
            `).join('');
            document.getElementById('options').innerHTML = optionsHtml;
        }

        function selectOption(optionIndex) {
            const q = questions[currentQuestion];
            const opt = q.options[optionIndex];
            for (let key in opt.scores) {
                scores[key] += opt.scores[key];
            }

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showLoading();
            }
        }

        function showLoading() {
            switchScreen('screen-loading');
            setTimeout(() => {
                showResult();
            }, 1500);
        }

            const type = calculateMBTI();
            const data = mbtiData[type];

            document.getElementById('resCatName').textContent = catName;
            document.getElementById('typeCode').textContent = type;
            document.getElementById('typeName').textContent = data.name;
            document.getElementById('typeTitle').textContent = data.title;
            document.getElementById('desc').textContent = data.description;
            document.getElementById('daily').textContent = data.dailyBehavior;
            document.getElementById('toy').textContent = data.favoriteToy;
            document.getElementById('petting').textContent = data.pettingStyle;

            document.getElementById('typeCircle').style.background = `linear-gradient(135deg, ${data.color} 0%, ${adjustColor(data.color, -30)} 100%)`;

                <div class="type-mini">

                    <div class="type-mini-name">${mbtiData[t].title}</div>
                </div>
            `).join('');

            switchScreen('screen-result');
        }

        function calculateMBTI() {
            let type = '';
            type += scores.E >= scores.I ? 'E' : 'I';
            type += scores.S >= scores.N ? 'S' : 'N';
            type += scores.T >= scores.F ? 'T' : 'F';
            type += scores.J >= scores.P ? 'J' : 'P';
            return type;
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }
