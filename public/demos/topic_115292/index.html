<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fishbone-js@latest/dist/fishbone.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4031666_4f0a8t80t4n.css">
    <style>
        :root {
            --primary-color: #1677ff;
            --primary-light: #e6f0ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --info-color: #1890ff;
            --purple-color: #722ed1;
            --cyan-color: #13c2c2;
            --gray-color: #8c8c8c;
            --text-primary: #1f2329;
            --text-secondary: #646a73;
            --text-placeholder: #bbbfc4;
            --border-color: #e5e6eb;
            --bg-color: #f2f3f5;
            --card-bg: #ffffff;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --font-size-xs: 12px;
            --font-size-sm: 13px;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --transition-slow: 400ms;
            --sidebar-width: 208px;
            --topbar-height: 56px;
            --status-pending: #1890ff;
            --status-processing: #fa8c16;
            --status-wait-close: #faad14;
            --status-closed: #52c41a;
            --status-rejected: #ff4d4f;
            --status-cancelled: #8c8c8c;
            --status-transferred: #13c2c2;
            --severity-critical: #ff4d4f;
            --severity-medium: #fa8c16;
            --severity-general: #52c41a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: var(--font-size-base); color: var(--text-primary); background: var(--bg-color); }
        #app { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: var(--sidebar-width); background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 0; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; height: 60px; }
        .sidebar-logo-text { font-size: 18px; font-weight: 700; color: white; text-align: center; padding: 12px 8px; letter-spacing: 1px; }
        .sidebar-menu { flex: 1; overflow-y: auto; padding: var(--spacing-sm); }
        .menu-group { margin-bottom: var(--spacing-sm); }
        .menu-group-header { display: flex; align-items: center; gap: var(--spacing-sm); padding: var(--spacing-sm) var(--spacing-md); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-normal); color: #cbd5e1; }
        .menu-group-header:hover { background: #1e293b; color: white; }
        .menu-group-header.active { background: rgba(22,119,255,0.15); color: var(--primary-color); }
        .menu-group-header i, .menu-item i { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .menu-group-label { flex: 1; font-size: var(--font-size-sm); }
        .menu-group-toggle { font-size: 10px; color: #64748b; transition: transform var(--transition-normal); }
        .menu-group.expanded .menu-group-toggle { transform: rotate(0deg); }
        .menu-group-items { padding-left: var(--spacing-lg); overflow: hidden; max-height: 0; transition: max-height var(--transition-normal); }
        .menu-group-items.show { max-height: 500px; }
        .menu-item { display: flex; align-items: center; gap: var(--spacing-sm); padding: var(--spacing-sm) var(--spacing-md); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-normal); color: #cbd5e1; }
        .menu-item:hover { background: #1e293b; color: white; }
        .menu-item.active { background: var(--primary-color); color: white; }
        .menu-item-text { font-size: var(--font-size-sm); }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { height: var(--topbar-height); background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--spacing-lg); flex-shrink: 0; }
        .topbar-left { display: flex; align-items: center; gap: var(--spacing-md); }
        .topbar-title { font-size: var(--font-size-lg); font-weight: 600; }
        .topbar-right { display: flex; align-items: center; gap: var(--spacing-lg); }
        .topbar-btn { padding: var(--spacing-xs) var(--spacing-md); border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: var(--font-size-sm); transition: all var(--transition-fast); }
        .topbar-btn:hover { background: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }
        .topbar-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .topbar-icon { font-size: 20px; cursor: pointer; color: var(--text-secondary); position: relative; }
        .topbar-icon:hover { color: var(--primary-color); }
        .topbar-badge { position: absolute; top: -4px; right: -4px; background: var(--danger-color); color: white; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
        .topbar-user { display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; padding: var(--spacing-xs) var(--spacing-sm); border-radius: var(--radius-md); }
        .topbar-user:hover { background: var(--bg-color); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-weight: bold; }
        .page-container { flex: 1; overflow-y: auto; padding: var(--spacing-lg); }
        .page-title { font-size: var(--font-size-xl); font-weight: 600; margin-bottom: var(--spacing-lg); }
        .card { background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border-color); }
        .card-title { font-size: var(--font-size-lg); font-weight: 600; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-xs); padding: var(--spacing-sm) var(--spacing-lg); border-radius: var(--radius-sm); font-size: var(--font-size-sm); cursor: pointer; border: none; transition: all var(--transition-fast); }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #4096ff; }
        .btn-primary:active { background: #0958d9; }
        .btn-success { background: var(--success-color); color: white; }
        .btn-success:hover { background: #73d13d; }
        .btn-warning { background: var(--warning-color); color: white; }
        .btn-warning:hover { background: #ffc53d; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: #ff7875; }
        .btn-secondary { background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-text { background: none; color: var(--primary-color); padding: var(--spacing-xs) var(--spacing-sm); }
        .btn-text:hover { background: var(--primary-light); }
        .btn-sm { padding: var(--spacing-xs) var(--spacing-md); font-size: var(--font-size-xs); }
        .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 500; }
        .tag-pending { background: rgba(24,144,255,0.1); color: var(--status-pending); }
        .tag-processing { background: rgba(250,140,22,0.1); color: var(--status-processing); }
        .tag-wait-close { background: rgba(250,173,20,0.1); color: var(--status-wait-close); }
        .tag-closed { background: rgba(82,196,26,0.1); color: var(--status-closed); }
        .tag-rejected { background: rgba(255,77,79,0.1); color: var(--status-rejected); }
        .tag-cancelled { background: rgba(140,140,140,0.1); color: var(--status-cancelled); }
        .tag-transferred { background: rgba(19,194,194,0.1); color: var(--status-transferred); }
        .tag-critical { background: rgba(255,77,79,0.1); color: var(--severity-critical); }
        .tag-medium { background: rgba(250,140,22,0.1); color: var(--severity-medium); }
        .tag-general { background: rgba(82,196,26,0.1); color: var(--severity-general); }
        .tag-primary { background: var(--primary-light); color: var(--primary-color); }
        .tag-info { background: rgba(24,144,255,0.1); color: var(--info-color); }
        .tag-success { background: rgba(82,196,26,0.1); color: var(--success-color); }
        .tag-warning { background: rgba(250,173,20,0.1); color: var(--warning-color); }
        .tag-danger { background: rgba(255,77,79,0.1); color: var(--danger-color); }
        .form-item { margin-bottom: var(--spacing-lg); }
        .form-label { display: block; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-primary); margin-bottom: var(--spacing-xs); }
        .form-control { width: 100%; padding: var(--spacing-sm) var(--spacing-md); border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: var(--font-size-base); background: var(--card-bg); transition: all var(--transition-fast); }
        .form-control:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
        .form-control::placeholder { color: var(--text-placeholder); }
        .form-control.error { border-color: var(--danger-color); }
        .form-error { font-size: var(--font-size-xs); color: var(--danger-color); margin-top: var(--spacing-xs); }
        .form-row { display: flex; gap: var(--spacing-lg); }
        .form-row .form-item { flex: 1; }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '▼'; position: absolute; right: var(--spacing-md); top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--text-placeholder); pointer-events: none; }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--font-size-sm); border-radius: var(--radius-md); overflow: hidden; }
        .table-wrapper { border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow-sm); overflow-x: auto; }
        .table-wrapper::-webkit-scrollbar { height: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #f1f5f9; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .table-wrapper::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table thead { position: sticky; top: 0; z-index: 1; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); }
        .table th { font-weight: 600; color: #64748b; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border-color); white-space: nowrap; font-size: 12px; letter-spacing: 0.3px; }
        .table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f5f9; vertical-align: middle; font-size: 12px; }
        .table tbody tr { transition: all 0.15s ease; }
        .table tbody tr:hover { background: #f8fafc; }
        .table tbody tr:nth-child(even) { background: #fafbfc; }
        .table tbody tr:nth-child(even):hover { background: #f1f5f9; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table .col-id { width: 140px; min-width: 140px; }
        .table .col-type { width: 80px; min-width: 80px; }
        .table .col-severity { width: 70px; min-width: 70px; }
        .table .col-workshop { width: 75px; min-width: 75px; }
        .table .col-line { width: 85px; min-width: 85px; }
        .table .col-device { width: 90px; min-width: 90px; }
        .table .col-status { width: 75px; min-width: 75px; }
        .table .col-responder { width: 80px; min-width: 80px; }
        .table .col-response-time { width: 110px; min-width: 110px; }
        .table .col-response-duration { width: 75px; min-width: 75px; }
        .table .col-complete-time { width: 110px; min-width: 110px; }
        .table .col-handle-duration { width: 75px; min-width: 75px; }
        .table .col-reporter { width: 60px; min-width: 60px; }
        .table .col-create-time { width: 130px; min-width: 130px; }
        .table .col-action { width: 60px; min-width: 60px; position: sticky; right: 0; background: inherit; z-index: 2; }
        .table th.col-action { background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); }
        .table tbody tr:hover .col-action { background: #f8fafc; }
        .table tbody tr:nth-child(even) .col-action { background: #fafbfc; }
        .table tbody tr:nth-child(even):hover .col-action { background: #f1f5f9; }
        .pagination { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-sm); margin-top: var(--spacing-lg); }
        .pagination-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: var(--font-size-sm); transition: all var(--transition-fast); }
        .pagination-btn:hover { background: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }
        .pagination-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .pagination-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { font-size: var(--font-size-xs); color: var(--text-secondary); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all var(--transition-normal); }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal { background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; transform: scale(0.9); transition: all var(--transition-normal); }
        .modal-lg { max-width: 950px; max-height: 90vh; }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-lg); border-bottom: 1px solid var(--border-color); }
        .modal-title { font-size: var(--font-size-lg); font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--bg-color); border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast); }
        .modal-close:hover { background: var(--border-color); }
        .modal-body { padding: var(--spacing-lg); }
        .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-md); padding: var(--spacing-lg); border-top: 1px solid var(--border-color); }
        .toast-container { position: fixed; top: calc(var(--topbar-height) + var(--spacing-md)); right: var(--spacing-md); z-index: 2000; display: flex; flex-direction: column; gap: var(--spacing-sm); }
        .toast { padding: var(--spacing-md); border-radius: var(--radius-md); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: var(--spacing-sm); min-width: 280px; max-width: 400px; animation: slideInRight var(--transition-normal) ease-out; }
        .toast-success { background: rgba(82,196,26,0.95); color: white; }
        .toast-error { background: rgba(255,77,79,0.95); color: white; }
        .toast-warning { background: rgba(250,173,20,0.95); color: white; }
        .toast-info { background: rgba(24,144,255,0.95); color: white; }
        .toast-icon { font-size: 18px; }
        .toast-message { flex: 1; font-size: var(--font-size-sm); }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page-content { animation: fadeInUp var(--transition-normal) ease-out; }
        .empty-state { text-align: center; padding: var(--spacing-xl) * 2; color: var(--text-placeholder); }
        .empty-icon { font-size: 48px; margin-bottom: var(--spacing-md); opacity: 0.5; }
        .empty-title { font-size: var(--font-size-lg); font-weight: 500; margin-bottom: var(--spacing-sm); }
        .empty-desc { font-size: var(--font-size-sm); margin-bottom: var(--spacing-lg); }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: var(--radius-sm); }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .timeline { position: relative; padding-left: var(--spacing-xl); }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--border-color); }
        .timeline-item { position: relative; padding-bottom: var(--spacing-lg); }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-dot { position: absolute; left: calc(-1 * var(--spacing-xl) + 3px); top: 2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--card-bg); }
        .timeline-dot-pending { background: var(--status-pending); }
        .timeline-dot-processing { background: var(--status-processing); }
        .timeline-dot-closed { background: var(--status-closed); }
        .timeline-dot-rejected { background: var(--status-rejected); }
        .timeline-dot-cancelled { background: var(--status-cancelled); }
        .timeline-dot-transferred { background: var(--status-transferred); }
        .timeline-content { background: var(--bg-color); border-radius: var(--radius-md); padding: var(--spacing-md); }
        .timeline-time { font-size: var(--font-size-xs); color: var(--text-placeholder); margin-bottom: var(--spacing-xs); }
        .timeline-title { font-size: var(--font-size-sm); font-weight: 600; margin-bottom: var(--spacing-xs); }
        .timeline-desc { font-size: var(--font-size-sm); color: var(--text-secondary); }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-item { padding: var(--spacing-md) var(--spacing-lg); font-size: var(--font-size-sm); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all var(--transition-fast); color: var(--text-secondary); }
        .tab-item:hover { color: var(--primary-color); }
        .tab-item.active { color: var(--primary-color); border-bottom-color: var(--primary-color); font-weight: 500; }
        .tabs-with-actions { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: var(--spacing-lg); border-bottom: 1px solid var(--border-color); }
        .tabs-with-actions .tabs { flex: 1; }
        .tabs-actions { display: flex; gap: var(--spacing-sm); padding-bottom: var(--spacing-md); }
        .search-bar { display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-lg); flex-wrap: wrap; align-items: center; }
        .search-input { flex: 1; min-width: 200px; max-width: 300px; }
        .filter-item { display: flex; align-items: center; gap: var(--spacing-sm); }
        .filter-item label { font-size: var(--font-size-sm); color: var(--text-secondary); }
        .kpi-card { background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--spacing-lg); display: flex; align-items: center; gap: var(--spacing-lg); }
        .kpi-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .kpi-icon-blue { background: var(--primary-light); color: var(--primary-color); }
        .kpi-icon-green { background: rgba(82,196,26,0.1); color: var(--success-color); }
        .kpi-icon-orange { background: rgba(250,140,22,0.1); color: var(--warning-color); }
        .kpi-icon-red { background: rgba(255,77,79,0.1); color: var(--danger-color); }
        .kpi-content { flex: 1; }
        .kpi-value { font-size: 28px; font-weight: 700; margin-bottom: var(--spacing-xs); }
        .kpi-label { font-size: var(--font-size-sm); color: var(--text-secondary); }
        .kpi-trend { font-size: var(--font-size-xs); display: flex; align-items: center; gap: 2px; }
        .kpi-trend.up { color: var(--success-color); }
        .kpi-trend.down { color: var(--danger-color); }
        .tree-container { background: var(--card-bg); border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; }
        .tree-header { padding: var(--spacing-md); border-bottom: 1px solid var(--border-color); display: flex; gap: var(--spacing-sm); }
        .tree-search { flex: 1; }
        .tree-body { max-height: 400px; overflow-y: auto; padding: var(--spacing-sm); }
        .tree-node { display: flex; align-items: center; gap: var(--spacing-xs); padding: var(--spacing-xs) var(--spacing-sm); border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); }
        .tree-node:hover { background: var(--bg-color); }
        .tree-node.active { background: var(--primary-light); color: var(--primary-color); }
        .tree-node-indent { display: inline-block; width: 16px; }
        .tree-toggle { cursor: pointer; font-size: 10px; color: var(--text-placeholder); }
        .tree-icon { font-size: 12px; }
        .tree-text { font-size: var(--font-size-sm); }
        .tree-leaf-icon { font-size: 10px; color: var(--text-placeholder); }
        .badge { display: inline-flex; align-items: center; padding: 0 6px; height: 18px; border-radius: 9px; font-size: 10px; font-weight: 500; }
        .badge-primary { background: var(--primary-color); color: white; }

        function renderPagination(total, page, pageSize, callback) {
            const totalPages = Math.ceil(total / pageSize);
            let html = `<span class="pagination-info">共 ${total} 条记录
                <select class="page-size-select" onchange="${callback}(1, this.value)">
                    <option value="10" ${pageSize === 10 ? 'selected' : ''}>10条/页</option>

                    <option value="100" ${pageSize === 100 ? 'selected' : ''}>100条/页</option>
                </select>
            </span>`;
            
            html += `<div class="pagination-controls">`;
            html += `<button class="btn btn-sm btn-default" ${page === 1 ? 'disabled' : ''} onclick="${callback}(${page - 1}, ${pageSize})">←</button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="btn btn-sm ${page === i ? 'btn-primary' : 'btn-default'}" onclick="${callback}(${i}, ${pageSize})">${i}</button>`;
            }
            
            html += `<button class="btn btn-sm btn-default" ${page === totalPages ? 'disabled' : ''} onclick="${callback}(${page + 1}, ${pageSize})">→</button>`;
            html += `</div>`;

        function getSlaClass(event) {
            const deadline = new Date(event.slaDeadline).getTime();
            const now = Date.now();
            const diff = deadline - now;
            if (diff < 0) return 'sla-expired';
            if (diff < 30 * 60 * 1000) return 'sla-danger';
            if (diff < 60 * 60 * 1000) return 'sla-warning';
            return 'sla-normal';
        }

        function getSlaText(event) {
            const deadline = new Date(event.slaDeadline).getTime();
            const now = Date.now();
            const diff = deadline - now;
            if (diff < 0) return '已超时';
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatTime(time) {

        function getDuration(startTime, endTime) {
            const start = new Date(startTime).getTime();
            const end = new Date(endTime).getTime();
            const diff = end - start;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        function handleEventAction(eventId, action) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            const now = new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\//g, '-');
            switch(action) {
                case '签到':
                    event.status = '处理中';
                    event.logs.push({ time: now, operator: '王五', action: '接单签到', desc: '确认收到异常通知，开始处理', status: '处理中' });
                    showToast('签到成功，事件已转为处理中', 'success');
                    break;
                case '解决':
                    showModal('填写解决信息', `
                        <div class="form-item">
                            <label class="form-label">事件原因</label>
                            <textarea class="form-control" id="solve-reason" placeholder="请描述事件原因"></textarea>
                        </div>
                        <div class="form-item">
                            <label class="form-label">解决方案</label>
                            <textarea class="form-control" id="solve-plan" placeholder="请描述解决方案"></textarea>
                        </div>
                        <div class="form-item">
                            <label class="form-label">同步知识库</label>
                            <input type="checkbox" id="sync-knowledge"> 同步到知识库
                        </div>
                    `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="confirmSolve('${eventId}')">确认解决</button>`);
                    return;
                case '关闭':
                    event.status = '已关闭';
                    event.logs.push({ time: now, operator: '张三', action: '确认关闭', desc: '现场确认问题已解决，关闭事件', status: '已关闭' });
                    showToast('事件已关闭', 'success');
                    break;
                case '转移':
                    showModal('转移处理', `
                        <div class="form-item">
                            <label class="form-label">选择接收人</label>
                            <select class="form-control" id="transfer-user">${users.map(u => `<option value="${u.name}">${u.name} - ${u.role}</option>`).join('')}</select>
                        </div>
                        <div class="form-item">
                            <label class="form-label">转移说明</label>
                            <textarea class="form-control" id="transfer-desc" placeholder="请说明转移原因"></textarea>
                        </div>
                    `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-warning" onclick="confirmTransfer('${eventId}')">确认转移</button>`);
                    return;
                case '打回':
                    showModal('打回处理', `
                        <div class="form-item">
                            <label class="form-label">打回原因</label>
                            <textarea class="form-control" id="reject-desc" placeholder="请说明打回原因"></textarea>
                        </div>
                    `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmReject('${eventId}')">确认打回</button>`);
                    return;
                case '取消':
                    event.status = '已取消';
                    event.logs.push({ time: now, operator: '张三', action: '取消上报', desc: '取消事件上报', status: '已取消' });
                    showToast('事件已取消', 'warning');
                    break;
            }
            closeModal();
            renderPage();
        }

        function confirmSolve(eventId) {
            const event = events.find(e => e.id === eventId);
            event.status = '待关闭';
            event.solveReason = document.getElementById('solve-reason').value || '未填写';
            event.solvePlan = document.getElementById('solve-plan').value || '未填写';
            const now = new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\//g, '-');
            event.logs.push({ time: now, operator: '王五', action: '解决关闭', desc: event.solveReason, status: '待关闭' });
            showToast('解决信息已提交，等待确认关闭', 'success');
            closeModal();
            renderPage();
        }

        function confirmTransfer(eventId) {
            const event = events.find(e => e.id === eventId);
            const user = document.getElementById('transfer-user').value;
            const desc = document.getElementById('transfer-desc').value || '无说明';
            event.status = '已转移';
            event.responder = user;
            const now = new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\//g, '-');
            event.logs.push({ time: now, operator: '王五', action: '转移处理', desc: `转${user}处理：${desc}`, status: '已转移' });
            showToast('事件已转移给' + user, 'info');
            closeModal();
            renderPage();
        }

        function confirmReject(eventId) {
            const event = events.find(e => e.id === eventId);
            const desc = document.getElementById('reject-desc').value || '无说明';
            event.status = '已打回';
            const now = new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\//g, '-');
            event.logs.push({ time: now, operator: '王五', action: '打回处理', desc: `打回原因：${desc}`, status: '已打回' });
            showToast('事件已打回', 'warning');
            closeModal();
            renderPage();
        }

        function renderEventTypeOptions(types, level = 0) {
            return types.map(t => `
                <option value="${t.code}" ${level > 0 ? 'style="padding-left:' + (level * 20) + 'px"' : ''}>${'　'.repeat(level)}${t.name}</option>
                ${t.children ? renderEventTypeOptions(t.children, level + 1) : ''}
            `).join('');
        }

        function getEventTypeRootName(typeCode) {
            function findType(types) {
                for (const t of types) {
                    if (t.code === typeCode || typeCode.startsWith(t.code + '-')) {
                        return t.name;
                    }
                    if (t.children) {
                        const found = findType(t.children);
                        if (found) return found;
                    }
                }
                return null;
            }
            return findType(eventTypes);
        }

        function onTypeChange() {
            const typeCode = document.getElementById('report-type').value;
            const workshopCode = document.getElementById('report-workshop').value;
            const lineCode = document.getElementById('report-line').value;
            const shift = document.getElementById('report-shift').value;
            const severity = document.getElementById('report-severity').value;
            
            const workshop = workshops.find(w => w.code === workshopCode);
            const line = workshop?.children?.find(l => l.code === lineCode);
            const workshopName = workshop?.name || '';
            const lineName = line?.name || '';
            const typeName = getEventTypeRootName(typeCode);
            
            const matchedRules = eventRules.filter(r => {
                const typeMatch = !typeCode || !typeName || r.eventCategory === typeName;
                const workshopMatch = !workshopName || r.workshop === workshopName;
                const lineMatch = !lineName || r.line === lineName;
                const shiftMatch = !shift || r.shift === shift;
                const severityMatch = !severity || r.severity === severity;
                return typeMatch && workshopMatch && lineMatch && shiftMatch && severityMatch && r.status === 'active';
            });
            
            const notifyPersons = new Set();
            matchedRules.forEach(r => {
                r.actions.forEach(a => {
                    if (a.person) {
                        notifyPersons.add(a.person);
                    }
                });
            });
            
            const dropdown = document.getElementById('report-notify-dropdown');
            const tags = document.getElementById('report-notify-tags');
            tags.innerHTML = '';
            
            if (notifyPersons.size > 0) {
                dropdown.innerHTML = Array.from(notifyPersons).map(p => {
                    const user = users.find(u => u.name === p);
                    return `<div class="multi-select-option" onclick="toggleMultiSelectOption('report-notify', '${p}', '${user?.role || ''}')">${p} - ${user?.role || '未知'} - ${user?.workshop || ''}</div>`;
                }).join('');
                document.querySelector('#report-notify .multi-select-trigger span').style.display = 'none';
            } else {
                dropdown.innerHTML = '<div class="multi-select-option disabled">未找到匹配的通知对象</div>';
                document.querySelector('#report-notify .multi-select-trigger span').style.display = 'inline';
            }
        }

                type: typeName,
                typeCode: type,

        function renderTree(types, level = 0) {
            return types.map(t => {
                const hasChildren = t.children && t.children.length > 0;
                const iconColor = level === 0 ? '#4f46e5' : level === 1 ? '#3b82f6' : '#10b981';
                const iconClass = hasChildren ? 'fa-solid fa-folder' : 'fa-solid fa-file';
                return `
                    <div class="tree-node" id="node-${t.code}">
                        <div class="tree-node-row" onclick="selectType('${t.code}')">
                            <span class="tree-expand" onclick="event.stopPropagation();toggleTree('${t.code}')">${hasChildren ? '<i class="fa-solid fa-chevron-right"></i>' : '<span class="tree-placeholder">•</span>'}</span>
                            <i class="${iconClass} tree-icon" style="color: ${iconColor};"></i>
                            <span class="tree-label">${t.name}</span>
                        </div>
                        ${hasChildren ? `<div class="tree-children" id="children-${t.code}">${renderTree(t.children, level + 1)}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function flattenTypes(types, parentCode = '', level = 0) {
            let result = [];
            for (const t of types) {
                result.push({ ...t, parentCode, level });
                if (t.children) {
                    result = result.concat(flattenTypes(t.children, t.code, level + 1));
                }
            }
            return result;
        }

        function renderTypeTable() {
            const allTypes = flattenTypes(eventTypes);
            const total = allTypes.length;
            const totalPages = Math.ceil(total / typePage.size);
            const start = (typePage.current - 1) * typePage.size;
            const end = start + typePage.size;
            const pageTypes = allTypes.slice(start, end);
            
            const rows = pageTypes.map(t => `
                <tr onclick="selectType('${t.code}')">
                    <td>${t.code}</td>
                    <td style="padding-left: ${t.level * 16 + 8}px;">${t.name}</td>
                    <td>${t.level === 0 ? '一级' : t.level === 1 ? '二级' : '三级'}</td>
                    <td><span class="badge badge-success">启用</span></td>

                    <td>
                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();editType('${t.code}')">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteType('${t.code}')">删除</button>
                    </td>
                </tr>
            `).join('');

            let pageButtons = '';
            if (totalPages <= 7) {
                for (let i = 1; i <= totalPages; i++) {
                    pageButtons += `<button class="btn btn-sm ${i === typePage.current ? 'btn-primary' : 'btn-default'}" onclick="changeTypePage(${i})">${i}</button>`;
                }
            } else {
                if (typePage.current <= 4) {
                    for (let i = 1; i <= 5; i++) {
                        pageButtons += `<button class="btn btn-sm ${i === typePage.current ? 'btn-primary' : 'btn-default'}" onclick="changeTypePage(${i})">${i}</button>`;
                    }
                    pageButtons += `<span class="pagination-ellipsis">...</span>`;
                    pageButtons += `<button class="btn btn-sm btn-default" onclick="changeTypePage(${totalPages})">${totalPages}</button>`;
                } else if (typePage.current >= totalPages - 3) {
                    pageButtons += `<button class="btn btn-sm btn-default" onclick="changeTypePage(1)">1</button>`;
                    pageButtons += `<span class="pagination-ellipsis">...</span>`;
                    for (let i = totalPages - 4; i <= totalPages; i++) {
                        pageButtons += `<button class="btn btn-sm ${i === typePage.current ? 'btn-primary' : 'btn-default'}" onclick="changeTypePage(${i})">${i}</button>`;
                    }
                } else {
                    pageButtons += `<button class="btn btn-sm btn-default" onclick="changeTypePage(1)">1</button>`;
                    pageButtons += `<span class="pagination-ellipsis">...</span>`;
                    for (let i = typePage.current - 2; i <= typePage.current + 2; i++) {
                        pageButtons += `<button class="btn btn-sm ${i === typePage.current ? 'btn-primary' : 'btn-default'}" onclick="changeTypePage(${i})">${i}</button>`;
                    }
                    pageButtons += `<span class="pagination-ellipsis">...</span>`;
                    pageButtons += `<button class="btn btn-sm btn-default" onclick="changeTypePage(${totalPages})">${totalPages}</button>`;
                }
            }

            return `
                <div class="table-scroll-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>分类编码</th>
                                <th>分类名称</th>
                                <th>层级</th>
                                <th>状态</th>
                                <th>排序号</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
                <div class="pagination-bar">
                    <span class="pagination-info">共 ${total} 条记录
                        <select class="page-size-select" onchange="changeTypePageSize(this.value)">
                            <option value="10" ${typePage.size === 10 ? 'selected' : ''}>10条/页</option>
                            <option value="20" ${typePage.size === 20 ? 'selected' : ''}>20条/页</option>
                            <option value="50" ${typePage.size === 50 ? 'selected' : ''}>50条/页</option>
                            <option value="100" ${typePage.size === 100 ? 'selected' : ''}>100条/页</option>
                        </select>
                    </span>
                    <div class="pagination-controls">
                        <button class="btn btn-sm btn-default" ${typePage.current === 1 ? 'disabled' : ''} onclick="changeTypePage(${typePage.current - 1})">←</button>
                        ${pageButtons}
                        <button class="btn btn-sm btn-default" ${typePage.current === totalPages ? 'disabled' : ''} onclick="changeTypePage(${typePage.current + 1})">→</button>
                    </div>
                </div>
            `;
        }

        function changeTypePage(page) {
            typePage.current = page;
            renderPage();

        function selectType(code) {
            document.querySelectorAll('.tree-node').forEach(i => i.classList.remove('active'));
            const node = document.getElementById('node-' + code);
            if (node) node.classList.add('active');
        }

        function toggleTree(code) {
            const children = document.getElementById('children-' + code);
            const expandIcon = document.querySelector('#node-' + code + ' .tree-expand');
            if (children) {
                children.classList.toggle('show');
                if (expandIcon) {
                    const icon = expandIcon.querySelector('i');
                    if (icon) {
                        icon.style.transform = children.classList.contains('show') ? 'rotate(90deg)' : 'rotate(0deg)';
                    }
                }
            }
        }

        function findTypeByCode(types, code) {
            for (const t of types) {
                if (t.code === code) return t;
                if (t.children) {
                    const found = findTypeByCode(t.children, code);
                    if (found) return found;
                }
            }
            return null;
        }

        function filterTree(keyword) {
            const nodes = document.querySelectorAll('.tree-node');
            if (!keyword.trim()) {
                nodes.forEach(node => node.style.display = 'block');
                return;
            }
            keyword = keyword.toLowerCase();
            nodes.forEach(node => {
                const label = node.querySelector('.tree-label');
                if (label && label.textContent.toLowerCase().includes(keyword)) {
                    node.style.display = 'block';
                    let parent = node.parentElement;
                    while (parent) {
                        if (parent.classList.contains('tree-children')) {
                            parent.classList.add('show');
                            const parentNode = parent.parentElement;
                            if (parentNode) {
                                parentNode.style.display = 'block';
                                const expandIcon = parentNode.querySelector('.tree-expand');
                                if (expandIcon) expandIcon.textContent = '▼';
                            }
                        }
                        parent = parent.parentElement;
                    }
                } else {
                    node.style.display = 'none';
                }
            });
        }

        function addType() {
            const parentCode = document.getElementById('parent-code').value;

            if (parentCode) { const parent = findTypeByCode(eventTypes, parentCode); if (parent) parent.children.push(newType); }

            }
        }

                    <td>
                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();editRule('${r.id}')">编辑</button>
                        <button class="btn btn-sm btn-default" onclick="event.stopPropagation();cloneRule('${r.id}')">克隆</button>
                        <button class="btn btn-sm ${r.status === 'active' ? 'btn-warning' : 'btn-success'}" onclick="event.stopPropagation();toggleRuleStatus('${r.id}')">${r.status === 'active' ? '禁用' : '启用'}</button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('rule-table-body').innerHTML = rows;
        }

        function resetRuleSearch() {
            document.getElementById('rule-search-name').value = '';
            document.getElementById('rule-search-type').value = '';
            document.getElementById('rule-search-severity').value = '';
            document.getElementById('rule-search-status').value = '';
            searchRules();
        }

        function selectRule(id) {
            currentRule = eventRules.find(r => r.id === id);
            renderPage('basic-rule-edit');
        }

        function createRule() {
            currentRule = null;
            renderPage('basic-rule-edit');
        }

        function editRule(id) {
            currentRule = eventRules.find(r => r.id === id);
            renderPage('basic-rule-edit');
        }

        function cloneRule(id) {
            const rule = eventRules.find(r => r.id === id);
            const newRule = JSON.parse(JSON.stringify(rule));
            newRule.id = 'RULE' + String(eventRules.length + 1).padStart(3, '0');
            newRule.name = rule.name + ' (副本)';
            newRule.status = 'draft';
            newRule.createdAt = new Date().toISOString().split('T')[0];
            newRule.updatedAt = newRule.createdAt;
            eventRules.push(newRule);
            showToast('规则克隆成功', 'success');
            renderPage();
        }

        function toggleRuleStatus(id) {
            const rule = eventRules.find(r => r.id === id);
            rule.status = rule.status === 'active' ? 'draft' : 'active';
            rule.updatedAt = new Date().toISOString().split('T')[0];
            showToast(rule.status === 'active' ? '规则已启用' : '规则已禁用', 'success');
            renderPage();
        }

        function renderBasicRuleEdit() {
            if (!currentRule) {
                currentRule = {
                    id: '',
                    name: '',
                    workshop: '',
                    line: '',
                    eventCategory: '',
                    severity: '',
                    shift: '',
                    status: 'draft',
                    priority: 1,
                    createdAt: '',
                    updatedAt: '',
                    actions: [{
                        time: 0,
                        action: 'notify',
                        target: '第一责任人',

                        <div class="action-header">
                            <div class="action-header-left">

                                <label>通知方式</label>
                                <div class="action-channels">

            return `

                        <div class="card-actions">
                            <button class="btn btn-default" onclick="renderPage('basic-rule')">返回列表</button>
                            <button class="btn btn-primary" onclick="saveRule()">保存</button>

                                        <option value="1" ${rule.priority === 1 ? 'selected' : ''}>1 - 高</option>
                                        <option value="2" ${rule.priority === 2 ? 'selected' : ''}>2 - 中</option>
                                        <option value="3" ${rule.priority === 3 ? 'selected' : ''}>3 - 低</option>

                                </div>
                                <div class="form-field">
                                    <label>状态</label>

                        <div class="rule-edit-section">
                            <div class="section-title">规则匹配条件</div>

                                    <div class="form-field">

                                        <select class="form-select" id="edit-rule-workshop">
                                            <option value="">请选择车间</option>
                                            <option value="一车间" ${rule.workshop === '一车间' ? 'selected' : ''}>一车间</option>
                                            <option value="二车间" ${rule.workshop === '二车间' ? 'selected' : ''}>二车间</option>
                                            <option value="三车间" ${rule.workshop === '三车间' ? 'selected' : ''}>三车间</option>

                                    </div>
                                    <div class="form-field">
                                        <label>适用产线 *</label>
                                        <select class="form-select" id="edit-rule-line">
                                            <option value="">请选择产线</option>
                                            <option value="等静压1线" ${rule.line === '等静压1线' ? 'selected' : ''}>等静压1线</option>
                                            <option value="等静压2线" ${rule.line === '等静压2线' ? 'selected' : ''}>等静压2线</option>
                                            <option value="石墨化1线" ${rule.line === '石墨化1线' ? 'selected' : ''}>石墨化1线</option>
                                            <option value="石墨化2线" ${rule.line === '石墨化2线' ? 'selected' : ''}>石墨化2线</option>
                                            <option value="加工1线" ${rule.line === '加工1线' ? 'selected' : ''}>加工1线</option>
                                            <option value="加工2线" ${rule.line === '加工2线' ? 'selected' : ''}>加工2线</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>事件分类 *</label>
                                        <input type="text" class="form-input" value="${rule.eventCategory}" id="edit-rule-category" readonly onclick="showCategoryTree('edit-rule-category')">
                                    </div>
                                    <div class="form-field">
                                        <label>严重等级 *</label>
                                        <select class="form-select" id="edit-rule-severity">
                                            <option value="">请选择严重等级</option>
                                            <option value="严重" ${rule.severity === '严重' ? 'selected' : ''}>严重</option>
                                            <option value="中等" ${rule.severity === '中等' ? 'selected' : ''}>中等</option>
                                            <option value="一般" ${rule.severity === '一般' ? 'selected' : ''}>一般</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>班次</label>
                                        <select class="form-select" id="edit-rule-shift">
                                            <option value="">全部班次</option>
                                            <option value="早班" ${rule.shift === '早班' ? 'selected' : ''}>早班</option>
                                            <option value="中班" ${rule.shift === '中班' ? 'selected' : ''}>中班</option>
                                            <option value="晚班" ${rule.shift === '晚班' ? 'selected' : ''}>晚班</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="rule-edit-section">
                            <div class="section-title">执行动作（时间轴）</div>
                            <div class="rule-action-timeline">
                                ${actionItems}

                                <button class="btn btn-default" onclick="addRuleAction()">+ 添加动作节点</button>
                            </div>
                        </div>

                        <div class="rule-edit-section">
                            <div class="section-title">高级设置</div>
                            <div class="form-grid">
                                <div class="form-field">
                                    <label>
                                        <input type="checkbox" ${rule.advanced.repeatRemind ? 'checked' : ''} 
                                               onchange="updateRuleAdvanced('repeatRemind', this.checked)">

                                           onchange="updateRuleAdvanced('silentEnd', this.value)">

                                        <input type="checkbox" ${rule.advanced.holidayEnable ? 'checked' : ''} 
                                               onchange="updateRuleAdvanced('holidayEnable', this.checked)">

        function addRuleAction() {
            if (!currentRule) {
                currentRule = { actions: [], advanced: { repeatRemind: false, repeatInterval: 5, silentStart: '22:00', silentEnd: '08:00', holidayEnable: false } };
            }
            const lastAction = currentRule.actions[currentRule.actions.length - 1];
            const newTime = lastAction ? lastAction.time + 15 : 0;
            const actionType = currentRule.actions.length === 0 ? 'notify' : currentRule.actions.length === 1 ? 'upgrade' : 'escalate';
            const target = currentRule.actions.length === 0 ? '第一责任人' : currentRule.actions.length === 1 ? '第二责任人' : '部门负责人';
            
            currentRule.actions.push({
                time: newTime,
                action: actionType,
                target: target,
                person: '',
                dept: '',
                channels: ['system']
            });
            renderPage('basic-rule-edit');
        }

        function removeRuleAction(idx) {
            if (currentRule && currentRule.actions.length > 1) {
                currentRule.actions.splice(idx, 1);
                renderPage('basic-rule-edit');
            } else {
                showToast('至少保留一个动作节点', 'warning');
            }
        }

        function updateRuleAction(idx, field, value) {
            if (currentRule) {
                currentRule.actions[idx][field] = value;
            }
        }

        function toggleRuleChannel(idx, channel) {
            if (currentRule) {
                const channels = currentRule.actions[idx].channels;
                const idx2 = channels.indexOf(channel);
                if (idx2 > -1) {
                    channels.splice(idx2, 1);
                } else {
                    channels.push(channel);
                }
            }
        }

        function updateRuleAdvanced(field, value) {
            if (currentRule) {
                if (!currentRule.advanced) currentRule.advanced = {};
                currentRule.advanced[field] = value;
                if (field === 'repeatRemind') {
                    const el = document.getElementById('repeat-interval-field');
                    if (el) el.style.display = value ? '' : 'none';
                }
            }
        }

        function saveRule() {
            const id = document.getElementById('edit-rule-id').value || 'RULE' + String(eventRules.length + 1).padStart(3, '0');
            const name = document.getElementById('edit-rule-name').value;
            const workshop = document.getElementById('edit-rule-workshop').value;
            const line = document.getElementById('edit-rule-line').value;
            const eventCategory = document.getElementById('edit-rule-category').value;
            const severity = document.getElementById('edit-rule-severity').value;
            const shift = document.getElementById('edit-rule-shift').value;
            const priority = parseInt(document.getElementById('edit-rule-priority').value);

            if (!name || !workshop || !line || !eventCategory || !severity) {
                showToast('请填写必填字段', 'warning');
                return;
            }

            if (currentRule) {
                currentRule.name = name;
                currentRule.workshop = workshop;
                currentRule.line = line;
                currentRule.eventCategory = eventCategory;
                currentRule.severity = severity;
                currentRule.shift = shift;
                currentRule.priority = priority;
                currentRule.updatedAt = new Date().toISOString().split('T')[0];
            } else {
                eventRules.push({
                    id: id,
                    name: name,
                    workshop: workshop,
                    line: line,
                    eventCategory: eventCategory,
                    severity: severity,
                    shift: shift,
                    status: 'draft',
                    priority: priority,
                    createdAt: new Date().toISOString().split('T')[0],
                    updatedAt: new Date().toISOString().split('T')[0],
                    actions: [{
                        time: 0,
                        action: 'notify',
                        target: '第一责任人',
                        person: '',
                        dept: '',
                        channels: ['system']
                    }],
                    advanced: {
                        repeatRemind: false,
                        repeatInterval: 5,
                        silentStart: '22:00',
                        silentEnd: '08:00',
                        holidayEnable: false
                    }
                });
            }

            showToast('规则保存成功', 'success');
            currentRule = null;
            renderPage('basic-rule');
        }

        function previewRule() {
            if (!currentRule) return;
            
            const rule = currentRule;
            const shiftText = rule.shift || '全部班次';
            
            const actionsHtml = rule.actions.map((action, idx) => {
                const actionTypeLabel = action.action === 'notify' ? '通知' : action.action === 'upgrade' ? '升级' : '上报';
                const actionTypeClass = action.action === 'notify' ? 'badge-primary' : action.action === 'upgrade' ? 'badge-warning' : 'badge-danger';
                const channelLabels = action.channels.map(c => {
                    const channel = notifyChannels.find(ch => ch.value === c);
                    return channel ? channel.label : c;
                }).join('、');
                
                return `
                    <div style="display:flex;align-items:flex-start;margin-bottom:16px;position:relative;padding-left:40px;">
                        <div style="position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#1677ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;">
                            ${action.time}
                        </div>
                        <div style="flex:1;background:#f5f7fa;border-radius:8px;padding:12px;">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                <span class="badge ${actionTypeClass}" style="font-size:10px;">${actionTypeLabel}</span>
                                <span style="font-weight:600;font-size:14px;">${action.target}</span>
                                ${idx > 0 ? '<span style="color:#999;font-size:12px;">（未响应）</span>' : ''}
                            </div>
                            <div style="display:flex;gap:24px;font-size:13px;color:#666;">
                                <span><strong>责任部门：</strong>${action.dept || '未配置'}</span>
                                <span><strong>责任人：</strong>${action.person || '未配置'}</span>
                                <span><strong>通知方式：</strong>${channelLabels}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            const previewContent = `
                <div style="max-height:70vh;overflow-y:auto;">
                    <div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e8e8e8;">
                        <h4 style="margin:0 0 12px 0;font-size:16px;font-weight:600;">规则基本信息</h4>
                        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;font-size:13px;">
                            <div><strong>规则编号：</strong>${rule.id || '未设置'}</div>
                            <div><strong>规则名称：</strong>${rule.name || '未设置'}</div>
                            <div><strong>优先级：</strong>${rule.priority === 0 ? '0 - 最高' : rule.priority === 1 ? '1 - 高' : rule.priority === 2 ? '2 - 中' : '3 - 低'}</div>
                            <div><strong>状态：</strong><span class="badge ${rule.status === 'active' ? 'badge-success' : 'badge-default'}">${rule.status === 'active' ? '生效中' : '草稿'}</span></div>
                        </div>
                    </div>
                    
                    <div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e8e8e8;">
                        <h4 style="margin:0 0 12px 0;font-size:16px;font-weight:600;">匹配条件</h4>
                        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;font-size:13px;">
                            <div><strong>适用车间：</strong>${rule.workshop || '未设置'}</div>
                            <div><strong>适用产线：</strong>${rule.line || '未设置'}</div>
                            <div><strong>事件分类：</strong>${rule.eventCategory || '未设置'}</div>
                            <div><strong>严重等级：</strong>${rule.severity || '未设置'}</div>
                            <div><strong>班次：</strong>${shiftText}</div>
                        </div>
                    </div>
                    
                    <div>
                        <h4 style="margin:0 0 16px 0;font-size:16px;font-weight:600;">升级流程预览</h4>
                        <div style="position:relative;padding-left:2px;">
                            <div style="position:absolute;left:12px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#1677ff,#d9d9d9);border-radius:2px;"></div>
                            ${actionsHtml}
                        </div>
                    </div>
                </div>
            `;
            
            showModal('规则预览', previewContent);
        }

        function buildCategoryTree(types, prefix = '') {
            let html = '';
            types.forEach(t => {
                const fullPath = prefix ? prefix + '>' + t.name : t.name;
                html += `
                    <div class="tree-node">
                        <span class="tree-expand" onclick="toggleCategoryTree(this)">${t.children ? '▶' : '◉'}</span>
                        <span class="tree-name" onclick="selectCategory('${fullPath}', '${currentCategoryInput}')">${t.name}</span>
                        ${t.children ? `<div class="tree-children" style="display:none">${buildCategoryTree(t.children, fullPath)}</div>` : ''}
                    </div>
                `;
            });
            return html;
        }

        let currentCategoryInput = '';

        function showCategoryTree(inputId) {
            currentCategoryInput = inputId;
            const treeHtml = buildCategoryTree(eventTypes);
            showModal('选择事件分类', `
                <div class="category-tree-modal">
                    <div class="search-box">
                        <input type="text" placeholder="搜索分类..." onkeyup="filterCategoryTree(this.value)">
                    </div>
                    <div class="tree-content" id="category-tree-content">
                        ${treeHtml}
                    </div>
                </div>
            `, 400, 500);
        }

        function toggleCategoryTree(el) {
            const children = el.parentElement.querySelector('.tree-children');
            if (children) {
                children.style.display = children.style.display === 'none' ? 'block' : 'none';
                el.textContent = children.style.display === 'none' ? '▶' : '▼';
            }
        }

        function selectCategory(path, inputId) {
            document.getElementById(inputId).value = path;
            closeModal();
        }

        function filterCategoryTree(keyword) {
            const nodes = document.querySelectorAll('#category-tree-content .tree-node');
            nodes.forEach(node => {
                const name = node.querySelector('.tree-name').textContent;
                node.style.display = keyword === '' || name.includes(keyword) ? '' : 'none';
            });
        }

        function enableRule() {
            if (currentRule) {
                currentRule.status = 'active';
                currentRule.updatedAt = new Date().toISOString().split('T')[0];
                showToast('规则已启用', 'success');
                renderPage('basic-rule-edit');
            }
        }

        function disableRule() {
            if (currentRule) {
                currentRule.status = 'draft';
                currentRule.updatedAt = new Date().toISOString().split('T')[0];
                showToast('规则已禁用', 'success');
                renderPage('basic-rule-edit');
            }
        }

        function renderBasicUser() {
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">人员管理</div>
                    </div>
                    <div class="search-bar">
                        <div class="search-item">

                            <input class="form-control" style="width: 200px;" placeholder="搜索姓名、工号...">
                        </div>

                            <select class="form-control" style="width: 130px;">
                                <option value="">全部</option>
                                <option value="operator">操作工</option>
                                <option value="foreman">班组长</option>
                                <option value="engineer">工程师</option>

                    return `
                        <div class="factory-tree-node" style="padding-left: ${level * 16 + 8}px;">
                            <div class="factory-tree-item" onclick="toggleFactoryNode(this)">
                                ${hasChildren ? '<i class="fa-solid fa-chevron-right factory-tree-toggle"></i>' : '<span class="factory-tree-placeholder">•</span>'}

        function saveFactoryModel() {
            const parentId = document.getElementById('factory-parent-hidden')?.value || document.getElementById('factory-parent-id')?.value;

            const code = document.getElementById('factory-code')?.value;
            const name = document.getElementById('factory-name')?.value;
            const responsible = document.getElementById('factory-responsible')?.value;
            const sort = parseInt(document.getElementById('factory-sort')?.value) || 0;

            if (!type || !code || !name) {
                showToast('请填写必填字段', 'warning');

            const newId = parentId ? `${parentId}-${Date.now()}` : code;
            factoryModelData.list.push({
                id: newId,
                code: code,
                name: name,
                type: type,
                status: '开启',
                responsible: responsible || '-',
                sort: sort
            });

            showToast('节点创建成功', 'success');
            closeModal();
            renderPage('basic-model');

        function toggleMultiSelect(id) {
            const select = document.getElementById(id);

        function toggleMultiSelectOption(selectId, value, label) {
            const select = document.getElementById(selectId);
            const option = select.querySelector(`[data-value="${value}"]`);
            const checkIcon = option.querySelector('i');
            const tagsContainer = document.getElementById(selectId.replace('-select', '-tags'));
            
            if (option.classList.contains('selected')) {
                option.classList.remove('selected');
                checkIcon.style.display = 'none';
                const tag = tagsContainer.querySelector(`[data-value="${value}"]`);
                if (tag) tag.remove();
            } else {
                option.classList.add('selected');
                checkIcon.style.display = 'block';
                const tag = document.createElement('span');
                tag.className = 'multi-select-tag';
                tag.dataset.value = value;
                tag.innerHTML = `${label}<i class="multi-select-tag-close" onclick="removeMultiSelectTag('${selectId}', '${value}')">×</i>`;
                tagsContainer.appendChild(tag);
            }
            
            updateMultiSelectPlaceholder(selectId);
        }

        function removeMultiSelectTag(selectId, value) {

        function saveMeasure(id) {
            const content = document.getElementById('edit-measure-content').value;
            const responsible = document.getElementById('edit-measure-responsible').value;
            const deadline = document.getElementById('edit-measure-deadline').value;
            const status = document.getElementById('edit-measure-status').value;

            if (!content || !responsible || !deadline) {
                showToast('请填写完整信息', 'warning');
                return;
            }

            const idx = improvementMeasuresList.findIndex(m => m.id === id);
            if (idx !== -1) {
                improvementMeasuresList[idx] = {
                    ...improvementMeasuresList[idx],
                    content, responsible, deadline, status

                showToast('修改成功', 'success');

            closeModal();
            renderPage('root-cause-measure');

        let currentRca = null;

            const closedEvents = events.filter(e => e.status === '已关闭');
            if (closedEvents.length === 0) {
                showToast('暂无已关闭的异常事件可分析', 'warning');
                return;

            const eventOptions = closedEvents.map(e => `
                <option value="${e.id}">${e.id} - ${e.type} (${e.workshop} ${e.line})</option>

        function startRcaAnalysis() {
            const eventId = document.getElementById('rca-wizard-event').value;
            const theme = document.getElementById('rca-wizard-theme').value;
            const analyst = document.getElementById('rca-wizard-analyst').value;

            if (!eventId || !theme || !analyst) {
                showToast('请填写完整信息', 'warning');
                return;
            }

            const event = events.find(e => e.id === eventId);
            currentRca = {
                id: 'RCA' + Date.now(),
                eventId: eventId,
                eventType: event.type,
                workshop: event.workshop,
                line: event.line,
                device: event.device,
                theme: theme,
                analyst: analyst,
                status: '分析中',
                createTime: new Date().toISOString().split('T')[0] + ' ' + new Date().toTimeString().split(' ')[0],
                whyAnalysis: [],
                rootCauses: [],
                improvementMeasures: [],
                trackingStatus: '',
                verificationResult: '',
                isPassed: false
            };

            closeModal();
            renderPage('rca-analysis');
        }

        function renderRcaAnalysis() {
            if (!currentRca) {
                return '<div style="padding:40px;text-align:center;">请先选择异常事件开始分析</div>';
            }

            const whyItems = currentRca.whyAnalysis.map((w, idx) => `

                    <div class="why-number">${idx + 1}</div>
                    <div class="why-content">
                        <div class="why-question">
                            <label>为什么会发生${idx === 0 ? '这个问题' : '上一层问题'}？</label>
                            <input type="text" class="form-input" value="${w.answer}" 
                                   onchange="updateWhyAnswer(${idx}, this.value)" placeholder="请输入分析原因">

                        <div class="why-suggestion">

                                <span class="ai-icon">🤖</span>
                                <span>AI分析建议</span>

            const stepContent = {

                            <div class="info-item"><strong>车间：</strong>${currentRca.workshop}</div>
                            <div class="info-item"><strong>产线：</strong>${currentRca.line}</div>
                            <div class="info-item"><strong>设备：</strong>${currentRca.device || '无'}</div>
                            <div class="info-item"><strong>分析主题：</strong>${currentRca.theme}</div>
                            <div class="info-item"><strong>分析人：</strong>${currentRca.analyst}</div>
                            <div class="info-item"><strong>创建时间：</strong>${currentRca.createTime}</div>
                        </div>
                    </div>
                `,
                2: `
                    <div class="rca-section">
                        <div class="rca-section-title">5WHY跟进分析</div>
                        <div class="why-container">
                            ${whyItems || '<div style="text-align:center;padding:40px;color:#999;">点击下方按钮添加WHY分析</div>'}

                        <div style="text-align:center;margin-top:20px;">
                            <button class="btn btn-primary" onclick="addWhyAnalysis()">+ 添加WHY分析</button>
                        </div>

                3: `

            const progressHtml = steps.map((step, idx) => `

                                    onclick="currentRcaStep--;renderPage('rca-analysis')">上一步</button>

                                <button class="btn btn-primary" onclick="nextRcaStep()">下一步</button>
                            ` : `
                                <button class="btn btn-success" onclick="completeRca()">完成分析</button>
                            `}
                        </div>
                    </div>
                </div>
            `;

        function nextRcaStep() {
            if (currentRcaStep === 2 && currentRca.whyAnalysis.length === 0) {
                showToast('请至少添加一次WHY分析', 'warning');
                return;
            }
            if (currentRcaStep === 3 && (!currentRca.rootCauses || currentRca.rootCauses.length === 0 || currentRca.rootCauses.some(r => !r.description || !r.category))) {
                showToast('请至少添加一条根因，并填写描述和选择归属维度', 'warning');
                return;
            }
            if (currentRcaStep === 4 && currentRca.improvementMeasures.length === 0) {
                showToast('请至少添加一条改善措施', 'warning');
                return;
            }
            currentRcaStep++;
            renderPage('rca-analysis');
        }

            if (!currentRca) return;
            currentRca.whyAnalysis.push({ answer: '', suggestion: '' });
            renderPage('rca-analysis');

        function removeWhyAnalysis(idx) {
            if (!currentRca) return;
            if (currentRca.whyAnalysis.length <= 1) {

                return;
            }
            currentRca.whyAnalysis.splice(idx, 1);
