        function renderFishboneChart() {
            const chartDom = document.getElementById('fishboneChart');
            if (!chartDom) return;
            
            chartDom.innerHTML = '';
            
            const catColors = {
                '人': { bg: '#ff6b6b', light: '#ffeaea', text: '#c0392b' },
                '机': { bg: '#4ecdc4', light: '#e8faf8', text: '#26a69a' },
                '料': { bg: '#45b7d1', light: '#e8f4f8', text: '#2980b9' },
                '法': { bg: '#96ceb4', light: '#f0f7f4', text: '#27ae60' },
                '环': { bg: '#ffeaa7', light: '#fffef5', text: '#f39c12' }
            };
            
            const catNames = {
                '人': '人',
                '机': '机',
                '料': '料',
                '法': '法',
                '环': '环'
            };
            
            const categories = ['人', '机', '料', '法', '环'];
            const causesByCategory = {};
            categories.forEach(cat => {
                causesByCategory[cat] = currentRca.rootCauses ? currentRca.rootCauses.filter(r => r.category === cat) : [];
            });
            
            const nodeSpacing = 50;
            const branchLength = 60;
            const categoryNodeHeight = 40;
            
            const topCategories = ['人', '料', '环'];
            const bottomCategories = ['机', '法'];
            
            const topMaxCauses = Math.max(...topCategories.map(cat => causesByCategory[cat].length), 1);
            const bottomMaxCauses = Math.max(...bottomCategories.map(cat => causesByCategory[cat].length), 1);
            
            const topHeight = topMaxCauses * nodeSpacing + categoryNodeHeight + 80;
            const bottomHeight = bottomMaxCauses * nodeSpacing + categoryNodeHeight + 80;
            const totalHeight = topHeight + bottomHeight + 60;
            const spineY = topHeight + 30;
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', totalHeight);
            svg.setAttribute('viewBox', `0 0 800 ${totalHeight}`);
            svg.style.display = 'block';
            
            const spineLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            spineLine.setAttribute('x1', '50');
            spineLine.setAttribute('y1', spineY);
            spineLine.setAttribute('x2', '700');
            spineLine.setAttribute('y2', spineY);
            spineLine.setAttribute('stroke', '#1e293b');
            spineLine.setAttribute('stroke-width', '4');
            svg.appendChild(spineLine);
            
            const headCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            headCircle.setAttribute('cx', '750');
            headCircle.setAttribute('cy', spineY);
            headCircle.setAttribute('r', '28');
            headCircle.setAttribute('fill', '#1e293b');
            svg.appendChild(headCircle);
            
            const headText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            headText.setAttribute('x', '750');
            headText.setAttribute('y', spineY + 5);
            headText.setAttribute('text-anchor', 'middle');
            headText.setAttribute('fill', '#fff');
            headText.setAttribute('font-size', '12');
            headText.setAttribute('font-weight', 'bold');
            headText.textContent = (currentRca.eventType || '异常事件').substring(0, 8);
            svg.appendChild(headText);
            
            const spineArrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            spineArrow.setAttribute('points', `700,${spineY - 6} 715,${spineY} 700,${spineY + 6}`);
            spineArrow.setAttribute('fill', '#1e293b');
            svg.appendChild(spineArrow);
            
            const branchXPositions = {
                '人': 620,
                '机': 520,
                '料': 420,
                '法': 320,
                '环': 220
            };
            
            const renderBranch = (cat, isTop) => {
                const causes = causesByCategory[cat];
                const branchX = branchXPositions[cat];
                const causesLength = causes.length;
                
                let categoryY;
                if (causesLength > 0) {
                    categoryY = isTop 
                        ? (topHeight - 40) - ((causesLength - 1) * nodeSpacing) / 2
                        : spineY + 40 + ((causesLength - 1) * nodeSpacing) / 2;
                } else {
                    categoryY = isTop ? topHeight - 40 : spineY + 80;
                }
                
                const branchLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                branchLine.setAttribute('x1', branchX);
                branchLine.setAttribute('y1', spineY);
                branchLine.setAttribute('x2', branchX);
                branchLine.setAttribute('y2', categoryY);
                branchLine.setAttribute('stroke', catColors[cat].bg);
                branchLine.setAttribute('stroke-width', '3');
                svg.appendChild(branchLine);
                
                const nodeRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                nodeRect.setAttribute('x', branchX - 35);
                nodeRect.setAttribute('y', categoryY - 18);
                nodeRect.setAttribute('width', '70');
                nodeRect.setAttribute('height', '36');
                nodeRect.setAttribute('rx', '6');
                nodeRect.setAttribute('fill', catColors[cat].light);
                nodeRect.setAttribute('stroke', catColors[cat].bg);
                nodeRect.setAttribute('stroke-width', '2');
                svg.appendChild(nodeRect);
                
                const nodeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                nodeText.setAttribute('x', branchX);
                nodeText.setAttribute('y', categoryY + 5);
                nodeText.setAttribute('text-anchor', 'middle');
                nodeText.setAttribute('fill', catColors[cat].text);
                nodeText.setAttribute('font-size', '13');
                nodeText.setAttribute('font-weight', 'bold');
                nodeText.textContent = catNames[cat];
                svg.appendChild(nodeText);
                
                causes.forEach((cause, cIdx) => {
                    const causeY = isTop 
                        ? categoryY - (causesLength - 1 - cIdx) * nodeSpacing
                        : categoryY + cIdx * nodeSpacing;
                    const causeX = branchX - branchLength;
                    
                    const causeLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    causeLine.setAttribute('x1', branchX - 35);
                    causeLine.setAttribute('y1', categoryY);
                    causeLine.setAttribute('x2', causeX);
                    causeLine.setAttribute('y2', causeY);
                    causeLine.setAttribute('stroke', catColors[cat].bg);
                    causeLine.setAttribute('stroke-width', '2');
                    causeLine.setAttribute('opacity', '0.6');
                    svg.appendChild(causeLine);
                    
                    const causeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    causeGroup.style.cursor = 'pointer';
                    
                    const causeCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    causeCircle.setAttribute('cx', causeX);
                    causeCircle.setAttribute('cy', causeY);
                    causeCircle.setAttribute('r', '16');
                    causeCircle.setAttribute('fill', catColors[cat].bg);
                    causeCircle.setAttribute('opacity', '0.9');
                    causeCircle.setAttribute('stroke', '#fff');
                    causeCircle.setAttribute('stroke-width', '2');
                    causeGroup.appendChild(causeCircle);
                    
                    const causeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    causeText.setAttribute('x', causeX);
                    causeText.setAttribute('y', causeY + 5);
                    causeText.setAttribute('text-anchor', 'middle');
                    causeText.setAttribute('fill', '#fff');
                    causeText.setAttribute('font-size', '10');
                    causeText.textContent = cause.description.substring(0, 6);
                    causeGroup.appendChild(causeText);
                    
                    const idxInRoot = currentRca.rootCauses.findIndex(r => r === cause);
                    causeGroup.addEventListener('click', function() {
                        if (confirm('确定删除这条根因？')) {
                            removeRootCause(idxInRoot);
                        }
                    });
                    
                    svg.appendChild(causeGroup);
                });
            };
            
            topCategories.forEach(cat => renderBranch(cat, true));
            bottomCategories.forEach(cat => renderBranch(cat, false));
            
            chartDom.appendChild(svg);
        }

        function addCauseToFishbone() {
            const category = document.getElementById('addCauseCategory').value;
            const desc = document.getElementById('addCauseDesc').value;
            
            if (!desc.trim()) {
                showToast('请输入根因描述', 'warning');
                return;
            }
            
            if (!currentRca.rootCauses) {
                currentRca.rootCauses = [];
            }
            
            currentRca.rootCauses.push({ description: desc, category: category });
            document.getElementById('addCauseDesc').value = '';
            renderFishboneChart();
        }

            if (!currentRca) return;
            if (!currentRca.rootCauses) {
                currentRca.rootCauses = [];
            }
            currentRca.rootCauses.push({ description: '', category: category });
            renderPage('rca-analysis');
        }

        function removeRootCause(idx) {
            if (!currentRca) return;
            if (currentRca.rootCauses.length <= 1) {
                showToast('至少保留一条根因', 'warning');
                return;

            currentRca.rootCauses.splice(idx, 1);
            if (currentRcaStep === 3) {
                renderFishboneChart();

        function getAiSuggestion(idx) {
            const suggestions = [
                '根据设备异常经验，轴承异响通常与润滑不足、磨损严重或装配不当有关。建议检查润滑系统和轴承磨损情况。',

        function saveRca() {
            if (!currentRca) return;
            
            if (currentRca.whyAnalysis.length === 0) {
                showToast('请至少添加一次WHY分析', 'warning');
                return;
            }

            const existingIdx = rootCauseAnalysisList.findIndex(r => r.id === currentRca.id);
            if (existingIdx >= 0) {
                rootCauseAnalysisList[existingIdx] = currentRca;
            } else {
                rootCauseAnalysisList.push(currentRca);
            }

            if (currentRca.rootCause && currentRca.rootCauseCategory) {
                currentRca.status = '根因确认';
            } else if (currentRca.whyAnalysis.length > 0) {
                currentRca.status = '分析中';
            }

            showToast('分析已保存', 'success');
        }

        function completeRca() {
            if (!currentRca || !currentRca.isPassed) {
                showToast('请先完成效果验证并选择通过', 'warning');
                return;
            }

            currentRca.status = '已完成';
            saveRca();
            renderPage('root-cause-list');
            showToast('分析已完成', 'success');
        }

            const rca = rootCauseAnalysisList.find(r => r.id === id);
            if (rca) {

            const measureInput = document.getElementById('resolve-measure');

            if (measureInput) measureInput.value = measure;

            const event = events.find(e => e.id === eventId);

                closeModal();

        function parseNaturalLanguage(text) {
            const result = {};

                '设备': ['设备', '机器', '车床', '铣床', '炉', '泵', '压缩机'],
                '质量': ['质量', '尺寸', '精度', '表面', '缺陷', '不合格'],
                '工艺': ['工艺', '参数', '温度', '压力', '速度'],
                '安全': ['安全', '事故', '火灾', '泄漏'],
                '环境': ['环境', '污染', '噪音', '粉尘']
            };
            
            for (const [type, keywords] of Object.entries(typeKeywords)) {
                if (keywords.some(k => text.includes(k))) {
                    result.type = type + '异常';
                    break;
                }
            }
            
            const severityKeywords = {
                '严重': ['严重', '紧急', '无法', '停机', '停产'],
                '中等': ['中等', '影响', '下降'],
                '一般': ['一般', '轻微', '小']
            };
            
            for (const [severity, keywords] of Object.entries(severityKeywords)) {
                if (keywords.some(k => text.includes(k))) {
                    result.severity = severity;
                    break;
                }
            }
            
            const workshopKeywords = {
                '一车间': ['一车间', '1车间'],
                '三车间': ['三车间', '3车间'],
                '石墨化': ['石墨化', '石墨']
            };
            
            for (const [workshop, keywords] of Object.entries(workshopKeywords)) {
                if (keywords.some(k => text.includes(k))) {
                    result.workshop = workshop;
                    break;
                }
            }
            
            const lineKeywords = {
                '等静压1线': ['等静压1', '等静压一线'],
                '等静压2线': ['等静压2', '等静压二线'],
                '加工1线': ['加工1', '加工一线'],
                '加工2线': ['加工2', '加工二线'],
                '石墨化1线': ['石墨化1', '石墨化一线'],
                '石墨化2线': ['石墨化2', '石墨化二线']
            };
            
            for (const [line, keywords] of Object.entries(lineKeywords)) {
                if (keywords.some(k => text.includes(k))) {
                    result.line = line;
                    break;
                }
            }
            
            const deviceMatch = text.match(/([^\s]+[机|床|炉|泵|设备])/);
            if (deviceMatch) {
                result.device = deviceMatch[1];
            }
            
            result.desc = text;
            
            return result;
        }

        function confirmAiReport() {
            closeModal();
            currentRoute = 'event-report';
            renderSidebar();
            renderPage();
            
            setTimeout(() => {
                if (aiCurrentReport.type) {
                    document.getElementById('report-type').value = aiCurrentReport.type;
                }
                if (aiCurrentReport.severity) {
                    document.getElementById('report-severity').value = aiCurrentReport.severity;
                }
                if (aiCurrentReport.workshop) {
                    const workshopCode = workshops.find(w => w.name === aiCurrentReport.workshop)?.code;
                    if (workshopCode) {
                        document.getElementById('report-workshop').value = workshopCode;
                        onWorkshopChange();
                    }
                }
                if (aiCurrentReport.line && document.getElementById('report-line').options.length > 0) {
                    const lineOptions = Array.from(document.getElementById('report-line').options);
                    const lineOpt = lineOptions.find(o => o.text === aiCurrentReport.line);
                    if (lineOpt) {
                        document.getElementById('report-line').value = lineOpt.value;
                        onLineChange();
                    }
                }
                if (aiCurrentReport.device) {
                    const deviceOptions = Array.from(document.getElementById('report-device').options);
                    const deviceOpt = deviceOptions.find(o => o.text.includes(aiCurrentReport.device));
                    if (deviceOpt) {
                        document.getElementById('report-device').value = deviceOpt.value;
                    }
                }
                if (aiCurrentReport.desc) {
                    document.getElementById('report-desc').value = aiCurrentReport.desc;
                }
                
                showModal('AI解析结果', '事件信息已预填到上报表单中，请确认信息后点击"提交上报"按钮。', '<button class="btn btn-primary" onclick="closeModal()">知道了</button>');
            }, 300);
        }

        function editAiReport() {
            confirmAiReport();
        }
    </script>

                    </div>

        <div class="ai-chat-input-area">

        </div>
    </div>
