<head>

<title>童学日历 — 小朋友培训课程智能管理工具</title>
<style>
:root {
  --bg: #f5f7fa;
  --bg2: #ffffff;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --rule: #e5e7eb;
  --accent: #6366f1;
  --accent2: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}

*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}

/* 顶部导航 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 16px 20px 14px;
  box-shadow: 0 2px 12px rgba(102,126,234,0.3);
}

.topbar h1 {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}

.topbar h1 small {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  font-weight: 400;
  margin-left: 6px;
}

/* 小朋友切换 */
.kid-tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.kid-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.12);
  color: #fff;
  transition: all .2s;
  user-select: none;
}

.kid-tab:hover { background: rgba(255,255,255,0.25); }
.kid-tab.active { background: #fff; color: #555; border-color: #fff; }

.kid-tab .avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}

.kid-tab.active .avatar { background: var(--accent); color: #fff; }

/* 功能按钮行 */
.action-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.action-btn {
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: #fff;
  transition: all .2s;
  user-select: none;
}

.action-btn:hover { background: rgba(255,255,255,0.25); }

/* 主内容区 */
.wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* 统计卡片 */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-card .num {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}

.stat-card .label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* 课程录入面板 */
.input-panel {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: none;
}

.input-panel.active { display: block; }

.input-panel h3 {
  font-size: 16px;
  margin-bottom: 14px;
  color: var(--ink);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 500;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color .2s;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.form-group textarea { resize: vertical; min-height: 60px; }

.form-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .2s;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #5558e0; }

.btn-secondary { background: var(--rule); color: var(--ink); }
.btn-secondary:hover { background: #d1d5db; }

/* 月份筛选 */
.month-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-bottom: 20px;
}

.mbtn {
  padding: 7px 15px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--rule);
  background: var(--bg2);
  color: var(--muted);
  transition: all .2s;
  user-select: none;
}

.mbtn:hover { border-color: var(--accent); color: var(--accent); }
.mbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* 日历块 */
.mblock {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  overflow: hidden;
}

.mhead {
  padding: 14px 20px;
  border-bottom: 2px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mhead h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
}

.mhead .mcnt {
  font-size: 12px;
  color: var(--muted);
  margin-left: 10px;
}

/* 课程分类筛选 */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--rule);
}

.fbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--rule);
  background: var(--bg2);
  color: var(--muted);
  transition: all .2s;
  user-select: none;
}

.fbtn:hover { border-color: var(--accent); color: var(--accent); }
.fbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.fbtn .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

/* 日历表格 */
.cal-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.cal-table th, .cal-table td {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
  padding: 4px;
}

.cal-table th:nth-child(7), .cal-table td:nth-child(7) { border-right: none; }

.cal-table th {
  padding: 11px 4px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}

.th-blue { background: #5b7fc9; }
.th-orange { background: #f5a623; }

.cal-table td {
  background: var(--bg2);
  padding-top: 22px;
  padding-bottom: 8px;
  position: relative;
  min-height: 80px;
}

.cal-table td.om { background: #f9fafb; }
.cal-table td.we { background: #fffbf0; }
.cal-table td.today { background: #e8f0fe; }

.dn {
  font-size: 13px;
  font-weight: 700;
  color: #555;
  margin-bottom: 5px;
  display: block;
}

.om .dn { color: #ccc; }
.we .dn { color: #c88b30; }
.today .dn { color: #185fa5; }

/* 每天内部课程 */
.cinner {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* 课程块 */
.cb {
  font-size: 11px;
  line-height: 1.5;
  padding: 5px 7px 5px 9px;
  border-radius: 5px;
  cursor: pointer;
  border-left: 3px solid transparent;
  white-space: normal;
  word-break: break-all;
  overflow: hidden;
  flex-shrink: 0;
  transition: box-shadow .15s;
}

.cb:hover {
  z-index: 20;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  transform: scale(1.03);
  transform-origin: left top;
  position: relative;
}

.cb .ct { display: block; font-weight: 700; font-size: 11.5px; margin-bottom: 1px; }
.cb .cn { display: block; font-weight: 500; font-size: 10.5px; line-height: 1.45; }
.cb .cl { display: block; font-size: 9.5px; opacity: .72; font-weight: 400; margin-top: 2px; }

/* 冲突标记 */
.cb.conflict { border: 2px solid var(--danger); animation: pulse 1.5s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
  70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
}

.cb-gv { background: #dce8f9; color: #185fa5; border-left-color: #378add; }
.cb-jazz { background: #f9e3dc; color: #993c1d; border-left-color: #d85a30; }
.cb-sci { background: #e2f0d0; color: #27500a; border-left-color: #639922; }
.cb-hum { background: #f9dde6; color: #712b13; border-left-color: #993556; }
.cb-ol { background: #e4e5fc; color: #3c3489; border-left-color: #534ab7; }
.cb-xy { background: #d9f5ee; color: #0f6e56; border-left-color: #2ec4b6; }
.cb-py { background: #e0f0e8; color: #1a6b3a; border-left-color: #34a853; }
.cb-cal { background: #f5edd0; color: #6b4e0a; border-left-color: #b8860b; }
.cb-art { background: #fce4ec; color: #880e4f; border-left-color: #e91e63; }
.cb-music { background: #e8eaf6; color: #283593; border-left-color: #5c6bc0; }
.cb-sport { background: #e0f7fa; color: #006064; border-left-color: #00bcd4; }

.cc-empty {
  font-size: 11px;
  color: #ddd;
  text-align: center;
  padding: 8px 0;
}

/* AI 识图面板 */
.ai-panel {
  background: linear-gradient(135deg, #f0f4ff, #e8eeff);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: none;
  border: 1px dashed var(--accent);
}

.ai-panel.active { display: block; }

.ai-panel h3 {
  font-size: 16px;
  margin-bottom: 10px;
  color: var(--ink);
}

.ai-panel .desc {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 14px;
}

.ai-panel .upload-area {
  border: 2px dashed var(--accent);
  border-radius: 10px;
  padding: 30px;
  text-align: center;
  background: rgba(99,102,241,0.05);
  cursor: pointer;
  transition: all .2s;
}

.ai-panel .upload-area:hover {
  background: rgba(99,102,241,0.1);
}

.ai-panel .upload-area .icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.ai-panel .upload-area p {
  font-size: 13px;
  color: var(--muted);
}

/* 课程列表视图 */
.list-view {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  overflow: hidden;
  display: none;
}

.list-view.active { display: block; }

.list-view .list-head {
  padding: 14px 20px;
  border-bottom: 2px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.list-view .list-head h2 {
  font-size: 18px;
  font-weight: 700;
}

.course-list {
  padding: 10px 20px;
}

.course-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}

.course-item:last-child { border-bottom: none; }

.course-item .c-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}

.course-item .c-info { flex: 1; }

.course-item .c-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.course-item .c-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.course-item .c-actions {
  display: flex;
  gap: 6px;
}

.course-item .c-actions button {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  border: 1px solid var(--rule);
  background: var(--bg2);
  cursor: pointer;
  transition: all .2s;
}

.course-item .c-actions button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* 冲突提示条 */
.conflict-bar {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: none;
}
.conflict-bar.active { display: block; }
.conflict-bar h4 { color: var(--danger); font-size: 14px; margin-bottom: 6px; }
.conflict-bar ul { font-size: 12px; color: #991b1b; padding-left: 16px; }
.conflict-bar li { margin-bottom: 3px; }

/* 提醒弹窗 */
.reminder-toast {
  position: fixed;
  top: 80px;
  right: 20px;
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  padding: 16px;
  max-width: 320px;
  z-index: 200;
  display: none;
  border-left: 4px solid var(--warning);
}
.reminder-toast.active { display: block; animation: slideIn 0.3s ease; }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.reminder-toast h4 { font-size: 14px; margin-bottom: 6px; }
.reminder-toast p { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.reminder-toast .close-x {
  position: absolute; top: 8px; right: 12px;
  cursor: pointer; color: var(--muted); font-size: 16px;
}

/* 导出按钮 */
.export-bar {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-bottom: 16px;
}

/* 响应式 */
@media (max-width: 768px) {
  .cal-table th, .cal-table td {
    padding: 2px;
    font-size: 11px;
  }
  .cb { font-size: 10px; padding: 3px 5px; }
  .cb .ct { font-size: 10px; }
  .cb .cn { font-size: 9.5px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .reminder-toast { right: 10px; left: 10px; max-width: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>童学日历 <small>小朋友培训课程智能管理</small></h1>
  <div class="kid-tabs" id="kidTabs"></div>
  <div class="action-row">
    <button class="action-btn" onclick="toggleInputPanel()">+ 录入课程</button>
    <button class="action-btn" onclick="toggleAIPanel()">AI 识图录入</button>
    <button class="action-btn" onclick="toggleListView()">课程列表</button>
    <button class="action-btn" onclick="toggleManageKids()">管理孩子</button>
  </div>
</div>

<div class="wrap">
  <!-- 导出栏 -->
  <div class="export-bar">
    <button class="btn btn-secondary" onclick="exportICS()" style="font-size:12px;padding:6px 14px;">导出日历(ICS)</button>
    <button class="btn btn-secondary" onclick="exportJSON()" style="font-size:12px;padding:6px 14px;">备份数据(JSON)</button>
    <button class="btn btn-secondary" onclick="importJSON()" style="font-size:12px;padding:6px 14px;">恢复数据</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="handleImport(event)">
  </div>

  <!-- 统计卡片 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="label">本月课程</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statInst">0</div>
      <div class="label">培训机构</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTypes">0</div>
      <div class="label">课程种类</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statHours">0</div>
      <div class="label">本月课时</div>
    </div>
  </div>

  <!-- 冲突提示 -->
  <div class="conflict-bar" id="conflictBar">
    <h4>⚠️ 检测到课程冲突</h4>
    <ul id="conflictList"></ul>
  </div>

  <!-- 课程录入面板 -->
  <div class="input-panel" id="inputPanel">
    <h3>录入新课程</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>课程名称</label>
        <input type="text" id="inName" placeholder="如：创意美术A班">
      </div>
      <div class="form-group">
        <label>培训机构</label>
        <input type="text" id="inInst" placeholder="如：彩虹画室">
      </div>
      <div class="form-group">
        <label>上课时间</label>
        <input type="text" id="inTime" placeholder="如：周六 09:00-10:30">
      </div>
      <div class="form-group">
        <label>上课地点</label>
        <input type="text" id="inLoc" placeholder="如：艺术中心201">
      </div>
      <div class="form-group">
        <label>课程分类</label>
        <select id="inCat">
          <option value="gv">英语/语言</option>
          <option value="sci">科学/思维</option>
          <option value="hum">人文/表演</option>
          <option value="jazz">舞蹈</option>
          <option value="py">编程</option>
          <option value="cal">书法</option>
          <option value="art">美术</option>
          <option value="music">音乐</option>
          <option value="sport">体育</option>
          <option value="ol">在线课程</option>
        </select>
      </div>
      <div class="form-group">
        <label>上课日期（多选，逗号分隔）</label>
        <input type="text" id="inDates" placeholder="如：2026-07-05,2026-07-12,2026-07-19">
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>备注（可填写教师姓名，用于私教冲突检测）</label>
        <textarea id="inNote" placeholder="教师姓名、课程说明等。填写教师姓名后，系统会自动检测该教师的时间冲突"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="toggleInputPanel()">取消</button>
      <button class="btn btn-primary" onclick="addCourse()">保存课程</button>
    </div>
  </div>

  <!-- 管理孩子面板 -->
  <div class="input-panel" id="manageKidsPanel">
    <h3>管理孩子</h3>
    <div id="kidsList" style="margin-bottom:14px;"></div>
    <div class="form-grid" style="grid-template-columns: 1fr 1fr auto;">
      <div class="form-group">
        <label>孩子姓名</label>
        <input type="text" id="newKidName" placeholder="如：小明">
      </div>
      <div class="form-group">
        <label>头像字母</label>
        <input type="text" id="newKidAvatar" placeholder="如：M" maxlength="1">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;">
        <button class="btn btn-primary" onclick="addKid()">添加孩子</button>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="toggleManageKids()">关闭</button>
    </div>
  </div>

  <!-- AI 识图面板 -->
  <div class="ai-panel" id="aiPanel">
    <h3>AI 智能识图录入</h3>
    <p class="desc">上传课程表截图，AI 自动识别课程信息并录入。支持培训机构课程表、学校课表等多种格式。</p>
    <div class="upload-area" onclick="simulateAIUpload()">
      <div class="icon">📷</div>
      <p>点击上传课程表图片<br><small>支持 JPG、PNG 格式，最大 20MB</small></p>
    </div>
    <div id="aiResult" style="margin-top:14px;display:none;">
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;">

function saveData() {

// ================== 冲突检测 ==================

function parseTimeRange(timeStr) {
  var parts = timeStr.split(/[-~]/);
  if (parts.length !== 2) return null;
  return { start: parseMin(parts[0].trim()), end: parseMin(parts[1].trim()) };
}

function isTimeOverlap(t1, t2) {
  return t1.start < t2.end && t2.start < t1.end;
}

function extractTeacher(note) {
  if (!note) return null;
  var m = note.match(/教师[：:]\s*(.+)/);
  if (m) return m[1].trim();
  m = note.match(/(.+?)老师/);
  if (m) return m[1].trim() + '老师';
  return null;
}

function checkConflicts() {
  var conflicts = [];
  var allCourses = getCourses();

  for (var i = 0; i < allCourses.length; i++) {
    for (var j = i + 1; j < allCourses.length; j++) {
      var c1 = allCourses[i], c2 = allCourses[j];
      var commonDates = c1.dates.filter(function(d) { return c2.dates.indexOf(d) >= 0; });
      if (commonDates.length === 0) continue;

      var t1 = parseTimeRange(c1.time);
      var t2 = parseTimeRange(c2.time);
      if (!t1 || !t2) continue;

      if (isTimeOverlap(t1, t2)) {
        var teacher1 = extractTeacher(c1.note);
        var teacher2 = extractTeacher(c2.note);
        var isSameTeacher = teacher1 && teacher2 && teacher1 === teacher2;
        conflicts.push({
          c1: c1, c2: c2,
          dates: commonDates,
          type: isSameTeacher ? 'teacher' : 'time'
        });
      }
    }
  }
  return conflicts;
}

function renderConflicts() {
  var conflicts = checkConflicts();
  var bar = document.getElementById('conflictBar');
  var list = document.getElementById('conflictList');

  if (conflicts.length === 0) {
    bar.classList.remove('active');
    return;
  }

  var h = '';
  for (var i = 0; i < conflicts.length; i++) {
    var c = conflicts[i];
    var typeLabel = c.type === 'teacher' ? '【教师冲突】' : '【时间冲突】';
    h += '<li>' + typeLabel + '「' + c.c1.name + '」与「' + c.c2.name + '」'
       + '在 ' + c.dates.join('、') + ' 时间重叠</li>';
  }
  list.innerHTML = h;
  bar.classList.add('active');
}

// ================== 渲染层 ==================

function getCourses() {
  return kidCourses[activeKid] || [];
}

function buildMap() {
  var map = {};
  var courses = getCourses();
  for(var ci=0; ci<courses.length; ci++){
    var c = courses[ci];
    for(var di=0; di<c.dates.length; di++){
      var dd = c.dates[di];
      if(!map[dd]) map[dd] = [];
      map[dd].push(c);
    }
  }
  return map;
}

function renderKidTabs() {
  var h = "";
  for(var i=0; i<kids.length; i++){
    var k = kids[i];
    var act = (k.id === activeKid) ? " active" : "";
    h += "<button class=\"kid-tab"+act+"\" onclick=\"switchKid('"+k.id+"')\">"
       + "<span class=\"avatar\">"+k.avatar+"</span>"
       + k.name + "</button>";
  }
  document.getElementById("kidTabs").innerHTML = h;
}

function switchKid(id) {
  activeKid = id;
  renderKidTabs();
  renderFilters();
  renderStats();
  render();
  renderCourseList();
  renderConflicts();
}

function renderStats() {
  var courses = getCourses();
  var total = 0, insts = new Set(), types = new Set(), hours = 0;

  for(var ci=0; ci<courses.length; ci++){
    var c = courses[ci];
    types.add(c.cat);
    insts.add(c.inst);

    for(var di=0; di<c.dates.length; di++){
      var d = c.dates[di];
      var parts = d.split('-');
      var y = parseInt(parts[0]), m = parseInt(parts[1]);
      if(y === ay && m === am) {
        total++;
        var t = c.time.split('-');
        if(t.length === 2) {
          var s = parseMin(t[0]), e = parseMin(t[1]);
          hours += (e - s) / 60;
        }
      }
    }
  }

  document.getElementById("statTotal").innerText = total;
  document.getElementById("statInst").innerText = insts.size;
  document.getElementById("statTypes").innerText = types.size;
  document.getElementById("statHours").innerText = Math.round(hours);
}

function renderFilters(){
  var courses = getCourses();
  var cf = document.getElementById("catFilters");
  var h = "";
  for(var i=0;i<cats.length;i++){
    var cat=cats[i], cnt=0;
    if(cat.id==="all"){ for(var j=0;j<courses.length;j++) cnt+=courses[j].dates.length; }
    else { for(var j=0;j<courses.length;j++){ if(courses[j].cat===cat.id) cnt+=courses[j].dates.length; } }
    var act = (cat.id===activeCat) ? " active" : "";
    h += "<button class=\"fbtn"+act+"\" onclick=\"setCat('"+cat.id+"')\">"
       + "<span class=\"dot\" style=\"background:"+cat.dot+";\"></span>"
       + cat.label + "(" + cnt + ")</button>";
  }
  cf.innerHTML = h;

  var monthList = [];
  for(var mm=6; mm<=12; mm++) monthList.push([2026,mm]);
  monthList.push([2027,1]);

  var mf = document.getElementById("monthFilters");
  var mh = "";
  for(var i=0;i<monthList.length;i++){
    var y=monthList[i][0], m=monthList[i][1];
    var lbl = (m===1&&y===2027) ? "2027年1月" : m+"月";
    var act = (ay===y&&am===m) ? " active" : "";
    mh += "<button class=\"mbtn"+act+"\" onclick=\"setMonth("+y+","+m+")\">"+lbl+"</button>";
  }
  mf.innerHTML = mh;
}

function setCat(id){ activeCat=id; renderFilters(); render(); }
function setMonth(y,m){ ay=y; am=m; renderFilters(); renderStats(); render(); }

function render(){
  var h="";
  h += buildMonth(ay, am);
  document.getElementById("app").innerHTML = h;
}

function buildMonth(year, m){
  var fd=new Date(year,m-1,1);
  var sd=fd.getDay(); if(sd===0) sd=7;
  sd--;
  var nD=new Date(year,m,0).getDate();
  var pd=new Date(year,m-1,0).getDate();
  var map = buildMap();
  var conflicts = checkConflicts();
  var conflictPairs = new Set();
  for (var ci=0; ci<conflicts.length; ci++) {
    conflictPairs.add(conflicts[ci].c1.name + '|' + conflicts[ci].c2.name);
    conflictPairs.add(conflicts[ci].c2.name + '|' + conflicts[ci].c1.name);
  }

  var cnt=0;
  for(var d=1;d<=nD;d++){
    var k=kymd(year,m,d);
    if(map[k]) for(var j=0;j<map[k].length;j++){if(activeCat==="all"||map[k][j].cat===activeCat)cnt++;}
  }

  var s='<div class="mblock">';
  s+='<div class="mhead"><h2>'+year+'年'+MONTHS[m]+' <span class="mcnt">'+cnt+'节次</span></h2></div>';
  s+='<table class="cal-table">';
  s+='<thead><tr>';
  for(var w=0;w<7;w++) s+='<th class="'+(w<5?'th-blue':'th-orange')+'">周'+WDAYS[w]+'</th>';
  s+='</tr></thead>';
  s+='<tbody>';

  var totalCells = sd+nD;
  var rows=Math.ceil(totalCells/7);
  var cellIdx=0;

  for(var r=0;r<rows;r++){
    s+='<tr>';
    for(var c=0;c<7;c++){
      var extraCls="", dayNum="", innerHtml="";

      if(cellIdx<sd){
        extraCls=' class="om"'; dayNum=""+(pd-sd+cellIdx+1);
      } else if(cellIdx>=sd+nD){
        extraCls=' class="om"'; dayNum=""+(cellIdx-sd-nD+1);
      } else {
        var d=cellIdx-sd+1;
        dayNum=""+d;
        var k=kymd(year,m,d);
        var dow=new Date(year,m-1,d).getDay();

        var clsArr=[];
        if(dow===0||dow===6) clsArr.push("we");
        var today = new Date();
        if(year===today.getFullYear() && m-1===today.getMonth() && d===today.getDate()) clsArr.push("today");

        var list=[];
        if(map[k]){
          for(var j=0;j<map[k].length;j++){
            if(activeCat==="all"||map[k][j].cat===activeCat) list.push(map[k][j]);
          }
        }
        if(list.length>0){
          list.sort(function(a,b){return parseMin(a.time.split("-")[0])-parseMin(b.time.split("-")[0]);});
          for(var j=0;j<list.length;j++){
            var cs=list[j];
            var isConflict = false;
            for (var ci=0; ci<conflicts.length; ci++) {
              if ((conflicts[ci].c1.name === cs.name || conflicts[ci].c2.name === cs.name)
                  && conflicts[ci].dates.indexOf(k) >= 0) {
                isConflict = true; break;
              }
            }
            var conflictCls = isConflict ? ' conflict' : '';
            innerHtml+='<div class="cb '+cs.cls+conflictCls+'" title="'+cs.name+'\n'+cs.time+'\n'+cs.loc+'\n'+cs.note+'">'
                      +'<span class="ct">'+cs.time+'</span>'
                      +'<span class="cn">'+cs.name+'</span>'
                      +'<span class="cl">'+cs.inst+' · '+cs.loc+'</span></div>';
          }
        } else {
          innerHtml='<div class="cc-empty">—</div>';
        }
        extraCls = clsArr.length > 0 ? ' class="'+clsArr.join(' ')+'"' : '';
      }

      s+='<td'+extraCls+'>';
      if(dayNum!==""){
        var dnCls = (extraCls.indexOf("we")>=0?" we":"")+(extraCls.indexOf("today")>=0?" today":"");
        s+='<div class="dn'+dnCls+'">'+dayNum+'</div>';
      }
      s+='<div class="cinner">'+innerHtml+'</div></td>';
      cellIdx++;
    }
    s+='</tr>';
  }

  s+='</tbody></table></div>';
  return s;
}

function renderKidsList() {
  var h = '';
  for (var i=0; i<kids.length; i++) {
    var k = kids[i];
    h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);">'
       + '<span><strong>'+k.name+'</strong> ('+k.avatar+')</span>'
       + '<button onclick="removeKid(\''+k.id+'\')" style="font-size:11px;padding:3px 10px;border:1px solid var(--danger);color:var(--danger);background:#fff;border-radius:4px;cursor:pointer;">删除</button>'
       + '</div>';
  }
  document.getElementById('kidsList').innerHTML = h || '<p style="color:#999;font-size:12px;">暂无孩子</p>';
}

function addKid() {
  var name = document.getElementById('newKidName').value.trim();
  var avatar = document.getElementById('newKidAvatar').value.trim() || name.charAt(0);
  if (!name) { alert('请输入孩子姓名'); return; }
  if (kids.length >= 10) { alert('最多支持10个孩子'); return; }

  var colors = ['#667eea','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#6366f1'];
  var newKid = {
    id: 'kid' + Date.now(),
    name: name,
    avatar: avatar,
    color: colors[kids.length % colors.length]
  };
  kids.push(newKid);
  kidCourses[newKid.id] = [];
  saveData();

  document.getElementById('newKidName').value = '';
  document.getElementById('newKidAvatar').value = '';
  renderKidsList();
  renderKidTabs();
}

function removeKid(id) {
  if (!confirm('确定删除这个孩子及其所有课程吗？')) return;
  kids = kids.filter(function(k) { return k.id !== id; });
  delete kidCourses[id];
  if (activeKid === id && kids.length > 0) activeKid = kids[0].id;
  saveData();
  renderKidsList();
  renderKidTabs();
  switchKid(activeKid);
}

function renderCourseList() {
  var courses = getCourses();
  var h = "";
  for(var i=0; i<courses.length; i++) {
    var c = courses[i];
    var catInfo = cats.find(function(x){return x.id===c.cat;}) || cats[0];
    h += '<div class="course-item">'
       + '<span class="c-dot" style="background:'+catInfo.dot+'"></span>'
       + '<div class="c-info">'
       + '<div class="c-name">'+c.name+'</div>'
       + '<div class="c-meta">'+c.inst+' · '+c.time+' · '+c.loc+' · '+c.dates.length+'次课</div>'
       + '</div>'
       + '<div class="c-actions">'
       + '<button onclick="editCourse('+i+')">编辑</button>'
       + '<button onclick="deleteCourse('+i+')">删除</button>'
       + '</div>'
       + '</div>';
  }
  document.getElementById("courseList").innerHTML = h || '<p style="text-align:center;color:#999;padding:20px;">暂无课程</p>';
}

function addCourse() {
  var name = document.getElementById("inName").value;
  var inst = document.getElementById("inInst").value;
  var time = document.getElementById("inTime").value;
  var loc = document.getElementById("inLoc").value;
  var cat = document.getElementById("inCat").value;
  var datesStr = document.getElementById("inDates").value;
  var note = document.getElementById("inNote").value;

  if(!name || !datesStr) { alert("请填写课程名称和日期"); return; }

  var dates = datesStr.split(/[,，]/).map(function(s){return s.trim();}).filter(function(s){return s;});
  var cls = "cb-" + cat;

  var newCourse = {
    name: name, cls: cls, cat: cat, inst: inst || "未填写",
    dates: dates, time: time || "待定", loc: loc || "待定", note: note || ""
  };

  kidCourses[activeKid].push(newCourse);
  saveData();

  document.getElementById("inName").value = "";
  document.getElementById("inInst").value = "";
  document.getElementById("inTime").value = "";
  document.getElementById("inLoc").value = "";
  document.getElementById("inDates").value = "";
  document.getElementById("inNote").value = "";

  toggleInputPanel();
  renderFilters();
  renderStats();
  render();
  renderConflicts();
  alert("课程添加成功！");
}

function deleteCourse(idx) {
  if(!confirm("确定删除这门课程吗？")) return;
  kidCourses[activeKid].splice(idx, 1);
  saveData();
  renderFilters();
  renderStats();
  render();
  renderCourseList();
  renderConflicts();
}

function editCourse(idx) {
  var c = kidCourses[activeKid][idx];
  document.getElementById("inName").value = c.name;
  document.getElementById("inInst").value = c.inst;
  document.getElementById("inTime").value = c.time;
  document.getElementById("inLoc").value = c.loc;
  document.getElementById("inCat").value = c.cat;
  document.getElementById("inDates").value = c.dates.join(",");
  document.getElementById("inNote").value = c.note;

  kidCourses[activeKid].splice(idx, 1);
  saveData();
  toggleInputPanel();
}

// ================== 导出功能 ==================

function exportICS() {
  var courses = getCourses();
  var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//童学日历//CN'];

  for (var i=0; i<courses.length; i++) {
    var c = courses[i];
    for (var j=0; j<c.dates.length; j++) {
      var date = c.dates[j].replace(/-/g, '');
      var uid = date + '-' + i + '-' + j + '@kidscourse';
      ics.push('BEGIN:VEVENT');
      ics.push('UID:' + uid);
      ics.push('DTSTART;VALUE=DATE:' + date);
      ics.push('DTEND;VALUE=DATE:' + date);
      ics.push('SUMMARY:' + c.name);
      ics.push('DESCRIPTION:' + c.inst + ' | ' + c.time + ' | ' + c.note);
      ics.push('LOCATION:' + c.loc);
      ics.push('END:VEVENT');
    }
  }
  ics.push('END:VCALENDAR');

  var blob = new Blob([ics.join('\r\n')], {type: 'text/calendar'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '童学日历_' + kids.find(function(k){return k.id===activeKid}).name + '.ics';
  a.click();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  var data = { kids: kids, courses: kidCourses, exportTime: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '童学日历备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  document.getElementById('importFile').click();
}

function handleImport(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.kids && data.courses) {
        kids = data.kids;
        kidCourses = data.courses;
        saveData();
        activeKid = kids[0].id;
        switchKid(activeKid);
        alert('数据恢复成功！');
      } else {
        alert('文件格式不正确');
      }
    } catch(err) {
      alert('读取文件失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showReminder() {
  var today = new Date();
  var todayStr = kymd(today.getFullYear(), today.getMonth()+1, today.getDate());
  var courses = getCourses();
  var todayCourses = [];

  for (var i=0; i<courses.length; i++) {
    if (courses[i].dates.indexOf(todayStr) >= 0) {
      todayCourses.push(courses[i]);
    }
  }

  if (todayCourses.length === 0) return;

  todayCourses.sort(function(a,b){return parseMin(a.time.split("-")[0])-parseMin(b.time.split("-")[0]);});

  var h = '';
  for (var i=0; i<todayCourses.length; i++) {
    var c = todayCourses[i];
    h += '<p>⏰ ' + c.time + ' · ' + c.name + ' · ' + c.loc + '</p>';
  }
  document.getElementById('reminderContent').innerHTML = h;
  document.getElementById('reminderToast').classList.add('active');
}

function hideReminder() {
  document.getElementById('reminderToast').classList.remove('active');
}
