<style>

}

html, body {

/* status bar */

  padding: 0 20px;

  flex-shrink: 0;
}

/* nav bar */
.navbar {

}

/* content area */
.content { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }

/* tab bar */
.tabbar {
  height: 64px;
  display: flex;
  background: var(--white);
  border-top: 1px solid var(--rule);
  flex-shrink: 0;
}
.tabbar-item {

  align-items: center;

}

.tabbar-text { font-size: 11px; margin-top: 3px; font-weight: 600; color: var(--muted); }
.tabbar-item.active .tabbar-text { color: var(--accent); }

/* card */
.card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}
.card:active { opacity: 0.92; }

/* brand */
.brand {
  text-align: center;
  background: linear-gradient(135deg, #FFE9D6 0%, #FBE3D3 100%);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}
.brand-title { font-size: 32px; font-weight: 900; color: var(--accent); letter-spacing: 4px; }
.brand-desc { font-size: 13px; color: #8a6f5e; margin-top: 6px; font-weight: 600; }

/* greeting */
.greet { font-size: 18px; font-weight: 800; color: var(--ink); }
.greet-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* tag grid */
.pick-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.pick-title { font-size: 17px; font-weight: 800; }
.pick-count { font-size: 13px; color: var(--muted); font-weight: 700; }
.pick-count.has { color: var(--accent); }
.tag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tag-card {
  position: relative;
  background: var(--white);
  border: 2px solid #ECE3D8;
  border-radius: 16px;
  padding: 16px 0;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.tag-card.wide { grid-column: 1 / -1; }
.tag-card.on {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(212,101,58,0.32);
  transform: scale(1.03);
}
.tag-emoji { font-size: 28px; line-height: 1; }
.tag-name { margin-top: 6px; font-size: 15px; font-weight: 700; color: var(--ink); }
.tag-card.on .tag-name { color: #fff; }
.tag-check {
  position: absolute; top: -4px; right: -4px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; color: var(--accent); font-size: 14px;
  font-weight: 900; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}

/* buttons */
.btn-primary {
  background: var(--accent); color: #fff; text-align: center;
  padding: 15px; border-radius: 999px; font-size: 17px; font-weight: 800;
  margin-top: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(212,101,58,0.3);
  transition: opacity 0.15s;
}
.btn-primary:active { opacity: 0.85; }
.btn-ghost {
  background: var(--accent-light); color: var(--accent); text-align: center;
  padding: 12px; border-radius: 999px; font-weight: 700; font-size: 15px;
  margin-top: 10px; cursor: pointer;
}
.btn-ghost:active { opacity: 0.8; }
.link { text-align: center; margin-top: 12px; font-size: 14px; color: var(--muted); font-weight: 600; cursor: pointer; }

/* section title */
.section-title { font-size: 19px; font-weight: 800; margin: 8px 0 12px; color: var(--ink); }
.sub-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }

/* neighbor card */
.neighbor { display: flex; align-items: center; cursor: pointer; }
.n-left { margin-right: 14px; }
.avatar {

}
.n-main { flex: 1; min-width: 0; }
.n-top { display: flex; align-items: baseline; }
.n-name { font-size: 16px; font-weight: 700; }

.n-dist { font-size: 12px; color: var(--accent2); margin-left: 4px; }

.n-tags .tag { background: var(--accent2-light); color: var(--accent2); font-size: 11px; }
.n-score { text-align: center; margin-left: 10px; }

.score-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* tag pill */
.tag {

}

/* profile */

.big-avatar { font-size: 56px; margin-bottom: 8px; }
.p-name { font-size: 20px; font-weight: 800; }
.p-meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
.p-active { font-size: 13px; color: var(--accent2); margin-top: 4px; }

/* chat */
.chat-head { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
.status-bar-box {
  background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px;

}
.status-text { font-size: 14px; color: var(--ink); font-weight: 600; }
.status-actions { display: flex; gap: 10px; margin-top: 10px; }
.s-btn {

  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
}
.s-btn:active { opacity: 0.85; }
.s-btn.done { background: var(--accent); color: #fff; }
.s-btn.cancel { background: var(--white); color: var(--accent); border: 2px solid var(--accent); }
.s-btn.confirm { background: var(--accent2); color: #fff; margin-top: 10px; }
.stars { display: flex; gap: 8px; margin-top: 10px; }
.star { font-size: 28px; line-height: 1; color: #D8CDBF; cursor: pointer; transition: all 0.1s; }
.star:active { transform: scale(1.2); }
.star.lit { color: var(--accent); }
.rate-preview { margin-top: 8px; font-size: 14px; color: var(--accent); font-weight: 700; }

/* messages */
.msg-list { display: flex; flex-direction: column; }
.msg-row { display: flex; margin-bottom: 14px; }
.msg-row.me { justify-content: flex-end; }
.msg-row.peer { justify-content: flex-start; }
.msg-row.system { justify-content: center; }
.msg-system {

}
.bubble {

.msg-row.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.peer .bubble { background: var(--white); border: 1px solid var(--rule); border-bottom-left-radius: 4px; }

/* input bar */
.input-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; padding: 10px 16px 10px;
  background: var(--white); border-top: 1px solid var(--rule);
}
.input {
  flex: 1; background: var(--bg2); border: none; border-radius: 999px;
  padding: 10px 16px; font-size: 16px; outline: none;
}
.send-btn {
  margin-left: 10px; background: var(--accent); color: #fff;
  padding: 10px 18px; border-radius: 999px; font-weight: 700;
  font-size: 15px; cursor: pointer;
}

/* square post */
.post-head { display: flex; align-items: center; }
.post-avatar {
  width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light);

}
.post-author { font-size: 16px; font-weight: 800; }
.post-meta { font-size: 13px; color: var(--muted); }

.post-content { margin: 12px 0; font-size: 16px; line-height: 1.7; }
.post-actions { display: flex; gap: 24px; }
.act { font-size: 14px; color: var(--accent); font-weight: 600; cursor: pointer; }

/* fab */
.fab {
  position: absolute; right: 20px; bottom: 80px;
  background: var(--accent); color: #fff; padding: 14px 20px;
  border-radius: 999px; font-weight: 700; font-size: 16px;

}

/* mine */
.me-card { text-align: center; }
.me-avatar { font-size: 48px; margin-bottom: 6px; }
.me-name { font-size: 18px; font-weight: 800; }
.me-community { font-size: 14px; color: var(--muted); margin-top: 4px; }
.me-tags { margin-top: 10px; }
.rec-top { display: flex; align-items: baseline; gap: 8px; }
.rec-type { font-size: 12px; }
.rec-status { font-size: 13px; font-weight: 700; }
.rec-status.doing { color: var(--accent); }
.rec-status.done { color: var(--accent2); }
.rec-status.cancelled { color: var(--muted); }
.rec-time { font-size: 12px; margin-top: 4px; }
.rec-actions { margin-top: 10px; }
.rec-btn {

  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
}
.rec-btn.ghost { background: var(--accent-light); color: var(--accent); }
.rec-hint { font-size: 13px; color: var(--accent2); margin-top: 8px; }

/* empty */
.empty { text-align: center; margin-top: 80px; color: var(--muted); }
.empty-emoji { font-size: 60px; }
.empty-text { font-size: 17px; margin-top: 12px; color: var(--ink); font-weight: 700; }
.empty-sub { font-size: 13px; margin-top: 4px; }

/* toast */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(42,29,20,0.88); color: #fff; padding: 10px 24px;
  border-radius: 999px; font-size: 14px; z-index: 9999;
  transition: opacity 0.3s; opacity: 0; pointer-events: none;
}
.toast.show { opacity: 1; }

/* modal */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  z-index: 9998; display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal-box {
  background: var(--white); border-radius: 20px; width: 300px;
  padding: 24px; text-align: center;
}
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
.modal-content { font-size: 15px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
.modal-btns { display: flex; gap: 12px; }
.modal-btn {
  flex: 1; padding: 12px 0; border-radius: 999px; font-size: 16px; font-weight: 700; cursor: pointer;
}
.modal-btn.cancel { background: var(--bg2); color: var(--muted); }
.modal-btn.confirm { background: var(--accent); color: #fff; }

/* publish form */
.field-label { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.type-row { display: flex; flex-wrap: wrap; gap: 8px; }
.type-chip {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  border-radius: 999px; border: 2px solid #ECE3D8; cursor: pointer; font-size: 14px; font-weight: 600;
}
.type-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.ta {
  width: 100%; border: 1px solid var(--rule); border-radius: 12px;
  padding: 12px; font-size: 16px; min-height: 80px; outline: none; resize: none;
  font-family: inherit; background: var(--bg2);
}
.picker-row { display: flex; gap: 10px; }
.picker-box {
  flex: 1; background: var(--bg2); border-radius: 12px; padding: 12px;
  text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;
}
.time-preview { margin-top: 8px; font-size: 13px; color: var(--muted); }

/* TRAE badge */
.trae-badge {
  position: absolute; top: 8px; right: 12px;
  background: rgba(212,101,58,0.12); color: var(--accent);
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
}

/* hint banner */
.hint-banner {
  background: linear-gradient(135deg, var(--accent2-light), #e0f0e6);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
  font-size: 13px; color: var(--accent2); font-weight: 600;
}

/* typing indicator */
.bubble.typing { display: flex; gap: 4px; align-items: center; padding: 14px 18px; }
.bubble.typing .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
  animation: typingBounce 1.2s infinite ease-in-out;
}
.bubble.typing .dot:nth-child(2) { animation-delay: 0.15s; }
.bubble.typing .dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* AI badge on peer messages */
.msg-row.peer .bubble.ai-reply {
  border: 1px solid var(--accent2);
  background: linear-gradient(135deg, #fff 0%, #f0f7f2 100%);
}
.ai-tag {
  display: inline-block; font-size: 9px; font-weight: 700; color: var(--accent2);
  background: var(--accent2-light); padding: 1px 5px; border-radius: 4px;
  margin-left: 6px; vertical-align: top; line-height: 1.4;
}

.schedule-preview {

.sched-day-group { margin-bottom: 16px; }

.sched-day-header {
  display: flex; align-items: baseline; gap: 8px; padding: 8px 14px; margin-bottom: 8px;
}
.sched-day-label { font-size: 17px; font-weight: 800; color: var(--ink); }
.sched-day-group.today .sched-day-label { color: var(--accent); }

.sched-card {
  display: flex; align-items: center; background: var(--white); border: 1px solid var(--rule);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: opacity 0.15s;
}
.sched-card:active { opacity: 0.9; }

.sched-picker-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 0; }

  position: relative; z-index: 1;

<div class="phone" id="app">
  <!-- content rendered by JS -->
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<!-- modal -->

// 根据人格 + 消息历史生成上下文感知回复
function generateLocalReply(userText, peer, history) {
  var personality = PERSONALITIES[peer.id] || { style: '', samples: [] };
  var msgs = history || [];
  var reply = '';

  // 1. 关键词匹配
  for (var i = 0; i < KEYWORD_REPLIES.length; i++) {
    var kr = KEYWORD_REPLIES[i];
    if (kr.keys.some(function(k) { return userText.indexOf(k) > -1; })) {
      reply = kr.replies[Math.floor(Math.random() * kr.replies.length)];
      break;
    }
  }

  // 2. 上下文感知：如果上一轮已经约定过时间，这轮更偏向确认
  if (!reply && msgs.length >= 2) {
    var lastPeer = msgs[msgs.length - 1];
    var lastMe = msgs[msgs.length - 2];
    if (lastPeer && lastPeer.role === 'peer' && lastMe && lastMe.role === 'me') {
      reply = ['好的，就这么说定了！','行，我记着呢，到时候见。','嗯嗯，没问题！','妥了，放心吧。'][Math.floor(Math.random() * 4)];
    }
  }

  // 3. 兜底随机
  if (!reply) reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];

  // 4. 注入人格特征词
  if (personality.samples && personality.samples.length > 0 && Math.random() > 0.5) {
    var prefix = personality.samples[Math.floor(Math.random() * personality.samples.length)];
    if (reply.indexOf(prefix) === -1) {
      reply = prefix + reply;
    }
  }

  return reply;
}

function fetchWithTimeout(url, options, timeoutMs) {
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('timeout')); }, timeoutMs);
    })
  ]);
}

// 尝试调用 LLM，失败返回 null
function chatWithAI(userText, peer, history) {
  if (!AI_CONFIG.enabled || !AI_CONFIG.apiUrl || !AI_CONFIG.apiKey) {
    return Promise.resolve(null);
  }

  var messages = [{ role: 'system', content: AI_CONFIG.systemPrompt(peer) }];
  // 加入最近4条历史
  var recent = (history || []).slice(-4);
  recent.forEach(function(m) {
    if (m.role === 'me') messages.push({ role: 'user', content: m.content });
    else if (m.role === 'peer') messages.push({ role: 'assistant', content: m.content });
  });
  messages.push({ role: 'user', content: userText });

  return fetchWithTimeout(AI_CONFIG.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + AI_CONFIG.apiKey
    },
    body: JSON.stringify({
      model: AI_CONFIG.model,
      messages: messages,
      max_tokens: 60,
      temperature: 0.8
    })
  }, 4000).then(function(res) {
    if (!res.ok) return null;
    return res.json();
  }).then(function(data) {
    if (data && data.choices && data.choices[0]) {
      return data.choices[0].message.content.trim();
    }
    return null;
  }).catch(function() {
    return null;
  });
}

function nowStr() {
  var d = new Date();
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}

function getGreeting() {
  var h = new Date().getHours();
  if (h<6) return '凌晨好';
  if (h<11) return '早上好';
  if (h<13) return '中午好';
  if (h<18) return '下午好';
  return '晚上好';
}

function computeMatch(tags, neighbors) {
  neighbors = neighbors || NEIGHBORS;
  var MAX_DIST = 500;
  return neighbors.map(function(n) {
    var common = n.tags.filter(function(t){ return tags.indexOf(t) > -1; });
    var tagScore = common.length;
    var distScore = Math.max(0, 1 - n.distance / MAX_DIST);
    var score = Math.round((tagScore * 0.7 + distScore * 0.3) * 100);
    return Object.assign({}, n, { commonTags: common, score: score });
  }).sort(function(a,b) {
    if (b.score !== a.score) return b.score - a.score;
    return a.distance - b.distance;
  });
}

function findNeighbor(id) {
  return NEIGHBORS.find(function(n){ return n.id === id; });
}

function findPost(id) {
  return state.posts.find(function(p){ return p.id === id; });
}

function findRecord(peerId) {

// ====== 日程辅助函数 ======
function todayStr() {
  var d = new Date();
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function tomorrowStr() {
  var d = new Date(Date.now() + 86400000);
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  var today = todayStr();
  var tomorrow = tomorrowStr();
  if (dateStr === today) return '今天';
  if (dateStr === tomorrow) return '明天';
  return parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
}

function formatDateFull(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  return parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
}

// 获取某天的日程
function getSchedulesByDate(dateStr) {
  return state.records.filter(function(r) {
    return r.scheduleDate === dateStr && r.status !== 'cancelled';
  });
}

// 获取未来7天日程（含今天）
function getUpcomingSchedules() {
  var result = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(Date.now() + i * 86400000);
    function p(n){ return n<10 ? '0'+n : ''+n; }
    var dateStr = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var schedules = getSchedulesByDate(dateStr);
    if (schedules.length > 0) {
      result.push({ date: dateStr, label: formatDateShort(dateStr), schedules: schedules, weekday: '周'+['日','一','二','三','四','五','六'][d.getDay()] });
    }
  }
  return result;
}

// 今天的日程数
function todayScheduleCount() {
  return getSchedulesByDate(todayStr()).length;
}

function upsertRecord(peer, status, time, scheduleDate, scheduleTime) {
  var r = findRecord(peer.id);
  if (!r) {
    r = { id:'r'+Date.now(), peerId:peer.id, peerName:peer.name, type:(peer.tags&&peer.tags[0])||'互助', status:status, rating:0, time:time };
    state.records.push(r);
  } else { r.status = status; r.time = time; }
  // 日程信息
  if (scheduleDate) r.scheduleDate = scheduleDate;
  if (scheduleTime) r.scheduleTime = scheduleTime;
  return r;
}

function enroll(postId) {
  var p = findPost(postId);
  if (!p) return null;
  p.applicants += 1;
  if (state.myEnrolls.indexOf(postId) === -1) state.myEnrolls.push(postId);
  var rid = 'enroll_' + postId;
  var r = state.records.find(function(x){ return x.id === rid; });
  if (!r) {
    r = { id:rid, peerId:rid, peerName:p.author, type:p.type, status:'enrolled', rating:0, time:nowStr() };
    state.records.push(r);
  }
  if (!state.chats[rid]) {
    state.chats[rid] = [{ role:'system', type:'text', content:'你应征了「'+p.author+'」的互助：'+p.content, time:nowStr() }];
  }
  return r;
}

  // 今日日程模块
  var todaySchedules = getSchedulesByDate(todayStr());
  html += '<div class="schedule-preview" onclick="navigate(\'schedule\')">';
  html += '<div class="sched-head"><span class="sched-title">📅 今日日程</span><span class="sched-count">'+todaySchedules.length+' 项</span></div>';
  if (todaySchedules.length > 0) {
    todaySchedules.forEach(function(s) {
      var peer = findNeighbor(s.peerId);
      var avatar = peer ? peer.avatar : '🧓';
      html += '<div class="sched-item">';
      html += '<span class="sched-time">'+(s.scheduleTime||'待定')+'</span>';
      html += '<span class="sched-avatar">'+avatar+'</span>';
      html += '<span class="sched-info"><span class="sched-name">'+s.peerName+'</span><span class="sched-type">'+s.type+'</span></span>';
      var statusBadge = s.status==='doing'?'<span class="sched-badge doing">进行中</span>':s.status==='done'?'<span class="sched-badge done">已完成</span>':'';
      html += statusBadge;
      html += '</div>';
    });
    html += '<div class="sched-more">查看全部日程 →</div>';
  } else {
    html += '<div class="sched-empty">今天还没有日程约定，去找个搭子约一下吧~</div>';
  }
  html += '</div>';
  
  html += '<div class="pick-head"><span class="pick-title">你想找哪种搭子？</span><span class="pick-count'+(selectedTags.length?' has':'')+'">已选 '+selectedTags.length+'/5</span></div>';
  html += '<div class="tag-grid">';
  tags.forEach(function(t, i) {
    html += '<div class="tag-card'+(t.selected?' on':'')+(i===tags.length-1?' wide':'')+'" onclick="toggleTag(\''+t.name+'\')">';
    html += '<div class="tag-emoji">'+t.icon+'</div>';
    html += '<div class="tag-name">'+t.name+'</div>';
    if (t.selected) html += '<div class="tag-check">✓</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="btn-primary" onclick="goMatch()">帮我找搭子</div>';
  html += '<div class="link" onclick="switchTab(\'square\')">先去互助广场看看 →</div>';
  return html;
}

function toggleTag(name) {
  var i = selectedTags.indexOf(name);
  if (i > -1) selectedTags.splice(i, 1);
  else selectedTags.push(name);
  // persist
  state.user.tags = selectedTags.slice();
  saveState(state);
  render();
}

function goMatch() {
  if (selectedTags.length === 0) { showToast('请先选一个搭子'); return; }
  navigate('match', { tags: selectedTags.slice() });
}

function renderMatch() {

function renderProfile() {

function startChat(peerId) {
  chatPeer = findNeighbor(peerId);
  pendingRating = 0;
  navigate('chat', { peerId: peerId });
}

function quickDate(peerId) {
  chatPeer = findNeighbor(peerId);
  pendingRating = 0;
  navigate('chat', { peerId: peerId, autoDate: true });
  // auto confirm date after render
  setTimeout(function() {
    var rec = findRecord(chatPeer.id);
    if (!rec || rec.status === 'cancelled') {
      confirmDate();
    }
  }, 600);
}

function renderChat() {
  var peer = chatPeer;
  if (!peer) {
    return '<div class="empty"><div class="empty-emoji">💬</div><div class="empty-text">还没有正在聊的搭子</div><div class="empty-sub">去首页选个搭子，发起聊天吧~</div></div>';
  }
  var msgs = state.chats[peer.id] || [];
  var rec = findRecord(peer.id);
  var html = '<div class="chat-head">'+peer.name+' · '+peer.distance+'米 · '+peer.community+'</div>';

  // status bar
  if (rec) {
    if (rec.status === 'doing') {
      var schedText = '🤝 互助进行中';
      if (rec.scheduleDate) schedText += '：'+formatDateShort(rec.scheduleDate)+(rec.scheduleTime?' '+rec.scheduleTime:'');
      else schedText += '：已约定楼下见';
      html += '<div class="status-bar-box"><div class="status-text">'+schedText+'</div>';
      html += '<div class="status-actions"><div class="s-btn done" onclick="completeHelp()">标记完成</div><div class="s-btn cancel" onclick="cancelDate()">取消约定</div></div></div>';
    } else if (rec.status === 'done' && rec.rating === 0) {
      html += '<div class="status-bar-box"><div class="status-text">✅ 互助已完成，来给 '+peer.name+' 评价吧</div>';
      html += '<div class="rate-box"><div class="rate-tip">给 ta 打个分：</div><div class="stars">';
      [1,2,3,4,5].forEach(function(s){
        html += '<div class="star'+(s<=pendingRating?' lit':'')+'" onclick="pickStar('+s+')">'+(s<=pendingRating?'★':'☆')+'</div>';
      });
      html += '</div>';
      if (pendingRating > 0) html += '<div class="rate-preview">已选 '+pendingRating+' 星 · '+['','很不满意','不太满意','一般般','比较满意','非常满意'][pendingRating]+'</div>';
      if (pendingRating > 0) html += '<div class="s-btn confirm" onclick="confirmRate()">确认提交评价</div>';
      html += '</div></div>';
    } else if (rec.status === 'done' && rec.rating > 0) {
      html += '<div class="status-bar-box"><div class="status-text">✅ 互助已完成，我的评价：</div><div class="stars">';
      [1,2,3,4,5].forEach(function(s){
        html += '<div class="star'+(s<=rec.rating?' lit':'')+'">'+(s<=rec.rating?'★':'☆')+'</div>';
      });
      html += '</div></div>';
    } else if (rec.status === 'cancelled') {
      html += '<div class="status-bar-box"><div class="status-text">约定已取消</div><div class="status-actions"><div class="s-btn done" onclick="reDate()">再约一次</div></div></div>';
    } else if (rec.status === 'enrolled') {
      html += '<div class="status-bar-box"><div class="status-text" style="color:var(--muted)">你已应征，聊好后约定这次互助吧</div><div class="status-actions"><div class="s-btn done" onclick="confirmDate()">🤝 约定这次互助</div></div></div>';
    }
  } else {
    html += '<div class="status-bar-box"><div class="status-text" style="color:var(--muted)">聊得投机？约定这次互助吧</div><div class="status-actions"><div class="s-btn done" onclick="confirmDate()">🤝 约定这次互助</div></div></div>';
  }

  // messages
  html += '<div class="msg-list">';
  msgs.forEach(function(m) {
    html += '<div class="msg-row '+m.role+'">';
    if (m.role === 'system') {
      html += '<div class="msg-system">'+m.content+'</div>';
    } else if (m.role === 'peer') {
      var aiClass = m.ai ? ' ai-reply' : '';
      var aiTag = m.ai ? '<span class="ai-tag">AI</span>' : '';
      html += '<div class="bubble'+aiClass+'">'+m.content+aiTag+'</div>';
    } else {
      html += '<div class="bubble">'+m.content+'</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function pushMsg(msg) {
  if (!chatPeer) return;
  if (!state.chats[chatPeer.id]) state.chats[chatPeer.id] = [];
  state.chats[chatPeer.id].push(msg);
  saveState(state);
  render();
}

// 打字指示器
var isTyping = false;

function sendText() {
  var text = chatInput.trim();
  if (!text || isTyping) return;
  pushMsg({ role:'me', type:'text', content:text, time:nowStr() });
  chatInput = '';
  
  // 显示"正在输入..."
  isTyping = true;
  showTypingIndicator();

  // 先尝试 AI，失败降级到本地引擎
  var history = (state.chats[chatPeer.id] || []).slice();
  
  chatWithAI(text, chatPeer, history).then(function(aiReply) {
    // 模拟打字延迟
    var delay = aiReply ? 1200 + Math.random() * 800 : 700 + Math.random() * 500;
    setTimeout(function() {
      hideTypingIndicator();
      isTyping = false;
      var reply = aiReply || generateLocalReply(text, chatPeer, history);
      pushMsg({ role:'peer', type:'text', content:reply, time:nowStr(), ai: !!aiReply });
    }, delay);
  });
}

function showTypingIndicator() {
  var msgList = document.querySelector('.msg-list');
  if (!msgList) return;
  var div = document.createElement('div');
  div.className = 'msg-row peer';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  msgList.appendChild(div);
  var content = document.querySelector('.content');
  if (content) content.scrollTop = content.scrollHeight;
}

function hideTypingIndicator() {
  var el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function confirmDate() {
  if (!chatPeer) return;
  // 弹出日期时间选择
  schedulePickerVisible = true;
  datePickDate = todayStr();
  datePickTime = '08:00';
  renderSchedulePicker();
}

function renderSchedulePicker() {
  var peer = chatPeer;
  // 时间段快捷选项
  var slots = ['06:00','08:00','09:30','14:00','16:00','18:00'];
  var html = '<div class="sched-picker-overlay" onclick="cancelSchedulePicker(event)"></div>';
  html += '<div class="sched-picker-box" onclick="event.stopPropagation()">';
  html += '<div class="sched-picker-title">📅 约定时间和搭子</div>';
  html += '<div class="sched-picker-peer">'+peer.avatar+' '+peer.name+' · '+peer.tags[0]+'</div>';
  
  // 日期选择
  html += '<div class="sched-picker-label">选择日期</div>';
  html += '<div class="date-chips">';
  var dates = [
    { val: todayStr(), label: '今天' },
    { val: tomorrowStr(), label: '明天' }
  ];
  // 后天到第5天
  for (var i = 2; i <= 5; i++) {
    var d = new Date(Date.now() + i * 86400000);
    function p(n){ return n<10 ? '0'+n : ''+n; }
    var ds = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    dates.push({ val: ds, label: p(d.getMonth()+1)+'/'+p(d.getDate()) });
  }
  dates.forEach(function(dt) {
    html += '<div class="date-chip'+(datePickDate===dt.val?' on':'')+'" onclick="pickSchedDate(\''+dt.val+'\')">'+dt.label+'</div>';
  });
  html += '</div>';
  
  // 时间选择
  html += '<div class="sched-picker-label">选择时间</div>';
  html += '<div class="time-chips">';
  slots.forEach(function(t) {
    html += '<div class="time-chip'+(datePickTime===t?' on':'')+'" onclick="pickSchedTime(\''+t+'\')">'+t+'</div>';
  });
  html += '</div>';
  
  // 自定义时间
  html += '<input type="time" class="custom-time" id="customTimeInput" value="'+datePickTime+'" onchange="pickCustomTime(this.value)">';
  
  // 确认按钮
  html += '<div class="sched-picker-preview">约定：'+formatDateShort(datePickDate)+' '+datePickTime+'</div>';
  html += '<div class="sched-picker-actions">';
  html += '<div class="s-btn cancel" onclick="closeSchedulePicker()">取消</div>';
  html += '<div class="s-btn done" onclick="confirmSchedule()">确认约定</div>';
  html += '</div>';
  html += '</div>';
  
  // 创建浮层
  var existing = document.getElementById('schedulePicker');
  if (existing) existing.remove();
  var div = document.createElement('div');
  div.id = 'schedulePicker';
  div.style.cssText = 'position:fixed;inset:0;z-index:9997;display:flex;align-items:flex-end;justify-content:center;';
  div.innerHTML = html;
  document.body.appendChild(div);
}

function pickSchedDate(d) { datePickDate = d; updateSchedulePickerSelection(); }
function pickSchedTime(t) { datePickTime = t; updateSchedulePickerSelection(); }
function pickCustomTime(t) { if (t) { datePickTime = t; updateSchedulePickerSelection(); } }

// 只更新选中态和预览文字，不重建DOM，避免动画重复播放
function updateSchedulePickerSelection() {
  var picker = document.getElementById('schedulePicker');
  if (!picker) return;

  // 更新日期芯片选中态
  var dateChips = picker.querySelectorAll('.date-chip');
  var dates = [
    { val: todayStr() },
    { val: tomorrowStr() }
  ];
  for (var i = 2; i <= 5; i++) {
    var d = new Date(Date.now() + i * 86400000);
    function p(n){ return n<10 ? '0'+n : ''+n; }
    dates.push({ val: d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()) });
  }
  dateChips.forEach(function(chip, i) {
    if (dates[i] && dates[i].val === datePickDate) chip.classList.add('on');
    else chip.classList.remove('on');
  });

  // 更新时间芯片选中态
  var timeChips = picker.querySelectorAll('.time-chip');
  timeChips.forEach(function(chip) {
    if (chip.textContent === datePickTime) chip.classList.add('on');
    else chip.classList.remove('on');
  });

  // 更新自定义时间输入框
  var customInput = document.getElementById('customTimeInput');
  if (customInput) customInput.value = datePickTime;

  // 更新预览文字
  var preview = picker.querySelector('.sched-picker-preview');
  if (preview) preview.textContent = '约定：' + formatDateShort(datePickDate) + ' ' + datePickTime;
}
function cancelSchedulePicker(e) { if (e.target.classList.contains('sched-picker-overlay')) closeSchedulePicker(); }
function closeSchedulePicker() {
  var el = document.getElementById('schedulePicker');
  if (el) el.remove();
  schedulePickerVisible = false;
}

function confirmSchedule() {
  if (!chatPeer) return;
  var dateLabel = formatDateShort(datePickDate);
  upsertRecord(chatPeer, 'doing', nowStr(), datePickDate, datePickTime);
  saveState(state);
  pushMsg({ role:'system', type:'text', content: '🤝 已约定：'+dateLabel+' '+datePickTime+'，楼下见，互相照应~', time: nowStr() });
  closeSchedulePicker();
  showToast('已约定 '+dateLabel+' '+datePickTime);
}

function completeHelp() {
  if (!chatPeer) return;
  var r = findRecord(chatPeer.id);
  if (r) { r.status = 'done'; saveState(state); }
  pushMsg({ role:'system', type:'text', content:'✅ 互助已完成，在下面给 ta 评价吧~', time:nowStr() });
  showToast('已完成，记得去互评');
}

function cancelDate() {
  showModal('取消约定', '确定取消这次约定吗？取消后本次互助视为未达成，可以随时再约。', function() {
    if (!chatPeer) return;
    var r = findRecord(chatPeer.id);
    if (r) { r.status = 'cancelled'; saveState(state); }
    pushMsg({ role:'system', type:'text', content:'约定已取消', time:nowStr() });
    showToast('已取消约定');
  });
}

function reDate() { confirmDate(); }

function pickStar(rating) { pendingRating = rating; render(); }

function confirmRate() {
  if (!chatPeer || pendingRating <= 0) return;
  var labels = ['','很不满意','不太满意','一般般','比较满意','非常满意'];
  showModal('确认评价', '您给「'+chatPeer.name+'」评 '+pendingRating+' 星（'+labels[pendingRating]+'），确认提交吗？提交后不可修改。', function() {
    var r = findRecord(chatPeer.id);
    if (r) { r.rating = pendingRating; r.status = 'done'; saveState(state); }
    pushMsg({ role:'system', type:'text', content:'⭐ 已评价 '+pendingRating+' 星，谢谢！', time:nowStr() });
    pendingRating = 0;
    showToast('已互评，谢谢！');
  });
}

var publishType = '买菜';
var publishContent = '';
var publishDate = new Date(Date.now()+86400000).toISOString().slice(0,10);
var publishTime = '08:00';

function pickPubType(t) { publishType = t; render(); }

function doPublish() {
  var content = document.getElementById('pubContent').value.trim();
  var date = document.getElementById('pubDate').value;
  var time = document.getElementById('pubTime').value;
  if (!content) { showToast('说点需求吧'); return; }
  var post = {
    id:'p'+Date.now(), author:state.user.name, avatar:'🧓',
    type:publishType, content:content, time:date+' '+time,
    location:state.user.community, tag:publishType, applicants:0, likes:0
  };
  state.posts.push(post);
  saveState(state);
  publishContent = '';
  showToast('已发布');
  setTimeout(function(){ switchTab('square'); }, 600);
}

function renderPost() {
  var post = findPost(viewParams.id);

  var isOwn = post.author === state.user.name;
  var html = '<div class="section-title">互助详情</div>';
  html += '<div class="card"><div class="post-head"><div class="post-avatar">'+post.avatar+'</div>';
  html += '<div><div class="post-author">'+post.author+'</div><div class="post-meta">'+post.time+' · '+post.location+'</div></div>';
  html += '<span class="tag post-tag">'+post.type+'</span></div>';
  html += '<div class="post-content">'+post.content+'</div>';
  html += '<div style="display:flex;gap:20px;font-size:14px;color:var(--muted)"><span>🙋 已应征 '+post.applicants+' 人</span><span>❤️ '+post.likes+' 赞</span></div></div>';

    html += '<div class="btn-primary'+(enrolled?'':'')+'" onclick="applyEnroll()">'+(enrolled?'✅ 已应征':'🙋 我要应征')+'</div>';

function applyEnroll() {
  var post = findPost(viewParams.id);
  if (!post) return;
  enroll(post.id);
  saveState(state);
  render();
  showToast('已应征，可联系发帖人');
}

function contactPoster() {
  var post = findPost(viewParams.id);
  if (!post) return;
  enroll(post.id);
  saveState(state);
  var rid = 'enroll_' + post.id;
  chatPeer = { id:rid, name:post.author, avatar:post.avatar, distance:'—', community:'阳光小区', tags:[post.type] };
  pendingRating = 0;
  navigate('chat', { peerId: rid });
}

function renderMessages() {
  var records = state.records;
  if (records.length === 0) {
    return '<div class="empty"><div class="empty-emoji">💬</div><div class="empty-text">还没有聊天</div><div class="empty-sub">去首页找个搭子，发起聊天吧~</div></div>';
  }
  var html = '<div class="section-title">消息</div><div class="sub-title">和邻里搭子的聊天与约定都在这里</div>';
  records.forEach(function(r) {
    var peer = findNeighbor(r.peerId);
    var msgs = state.chats[r.peerId] || [];
    var last = msgs[msgs.length-1];
    var preview = '暂无消息';
    if (last) preview = (last.role==='me'?'我：':'')+last.content;
    var statusText = r.status==='doing'?'进行中':r.status==='enrolled'?'已应征':r.status==='done'?(r.rating>0?'已评价':'待评价'):'已取消';
    html += '<div class="card" onclick="openChatFromMsg(\''+r.peerId+'\')">';
    html += '<div class="rec-top"><span style="font-size:16px;font-weight:700">'+r.peerName+'</span><span class="tag rec-type">'+r.type+'</span><span class="rec-status '+r.status+'">'+statusText+'</span></div>';
    html += '<div style="font-size:13px;color:var(--muted);margin-top:4px">'+preview+'</div></div>';
  });
  return html;
}

function openChatFromMsg(peerId) {
  var peer = findNeighbor(peerId);
  if (peer) {
    chatPeer = peer;
  } else {
    // enroll post
    var pid = peerId.replace('enroll_','');
    var p = findPost(pid);
    if (p) chatPeer = { id:peerId, name:p.author, avatar:p.avatar, distance:'—', community:'阳光小区', tags:[p.type] };
  }
  pendingRating = 0;
  navigate('chat', { peerId: peerId });
}

function renderMine() {
  var records = state.records.filter(function(r){ return r.status !== 'enrolled'; }).slice().reverse();
  var enrolls = state.myEnrolls.slice().reverse().map(function(id){ return findPost(id); }).filter(function(p){ return !!p; });
  var html = '<div class="card me-card"><div class="me-avatar">🧓</div>';
  html += '<div class="me-name">'+state.user.name+'</div>';
  html += '<div class="me-community">'+state.user.community+'</div>';
  html += '<div class="me-tags">';
  state.user.tags.forEach(function(t){ html += '<span class="tag">'+t+'</span>'; });
  html += '</div></div>';
  
  // 日程入口
  var upcoming = getUpcomingSchedules();
  var totalCount = upcoming.reduce(function(sum, day){ return sum + day.schedules.length; }, 0);
  html += '<div class="card" style="display:flex;align-items:center;cursor:pointer" onclick="navigate(\'schedule\')">';
  html += '<div style="font-size:28px;margin-right:14px">📅</div>';
  html += '<div style="flex:1"><div style="font-size:16px;font-weight:700">我的日程</div>';
  html += '<div style="font-size:13px;color:var(--muted)">未来7天 '+totalCount+' 项约定</div></div>';
  html += '<div style="font-size:20px;color:var(--accent)">›</div></div>';
  
  html += '<div class="section-title">我的互助记录</div>';
  if (records.length === 0) html += '<div class="sub-title">还没有互助记录，去首页找个搭子吧~</div>';
  records.forEach(function(item) {
    var statusText = item.status==='doing'?'进行中':item.status==='done'?(item.rating>0?'已评价':'待评价'):'已取消';
    html += '<div class="card" onclick="openChatFromMsg(\''+item.peerId+'\')">';
    html += '<div class="rec-top"><span style="font-size:16px;font-weight:700">与 '+item.peerName+'</span><span class="tag rec-type">'+item.type+'</span><span class="rec-status '+item.status+'">'+statusText+'</span></div>';
    html += '<div class="rec-time">'+item.time+'</div>';
    if (item.status === 'doing') {
      html += '<div class="rec-actions"><div class="rec-btn" onclick="event.stopPropagation();completeFromMine(\''+item.id+'\')">标记完成</div></div>';
    } else if (item.status === 'done' && item.rating === 0) {
      html += '<div class="rec-hint">点击进入对话，给 '+item.peerName+' 评价</div>';
    } else if (item.rating > 0) {
      html += '<div style="margin-top:8px"><span style="font-size:13px;color:var(--muted)">我的评价：</span>';
      [1,2,3,4,5].forEach(function(s){ html += '<span style="font-size:16px;color:'+(s<=item.rating?'var(--accent)':'#D8CDBF')+'">'+(s<=item.rating?'★':'☆')+'</span>'; });
      html += '</div>';
    } else if (item.status === 'cancelled') {
      html += '<div class="rec-actions"><div class="rec-btn ghost" onclick="event.stopPropagation();reDateFromMine(\''+item.peerId+'\')">再约一次</div></div>';
    }
    html += '</div>';
  });
  html += '<div class="section-title" style="margin-top:16px">我应征的互助</div>';
  if (enrolls.length === 0) html += '<div class="sub-title">还没有应征，去广场看看谁需要搭把手~</div>';
  enrolls.forEach(function(item) {
    html += '<div class="card" onclick="navigate(\'post\',{id:\''+item.id+'\'})">';
    html += '<div class="rec-top"><span style="font-size:16px;font-weight:700">'+item.author+'</span><span class="tag rec-type">'+item.type+'</span></div>';
    html += '<div style="font-size:14px;margin-top:6px">'+item.content+'</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-top:6px">🙋 '+item.applicants+' 人已应征 · 点击查看详情</div></div>';
  });
  return html;
}

function completeFromMine(id) {
  var r = state.records.find(function(x){ return x.id === id; });
  if (r) { r.status = 'done'; saveState(state); }
  render();
  showToast('已标记完成，去对话里互评吧');
}

function reDateFromMine(peerId) {
  var peer = findNeighbor(peerId);
  if (peer) {
    chatPeer = peer;
    pendingRating = 0;
    navigate('chat', { peerId: peerId });
    setTimeout(function(){ confirmDate(); }, 600);
  }
}

// ====== 日程页面 ======
function renderSchedule() {
  var upcoming = getUpcomingSchedules();
  var allRecords = state.records.filter(function(r){ return r.scheduleDate && r.status !== 'cancelled'; }).slice().reverse();
  
  var html = '';
  
  if (upcoming.length === 0) {
    html += '<div class="empty"><div class="empty-emoji">📅</div><div class="empty-text">还没有日程约定</div>';
    html += '<div class="empty-sub">去首页找个搭子，约个时间吧~</div></div>';
    return html;
  }
  
  html += '<div class="section-title">未来7天日程</div>';
  html += '<div class="sub-title">点击日程可直接进入聊天</div>';
  
  upcoming.forEach(function(day) {
    var isToday = day.date === todayStr();
    html += '<div class="sched-day-group'+(isToday?' today':'')+'">';
    html += '<div class="sched-day-header">';
    html += '<span class="sched-day-label">'+day.label+'</span>';
    html += '<span class="sched-day-weekday">'+day.weekday+'</span>';
    html += '<span class="sched-day-count">'+day.schedules.length+'项</span>';
    html += '</div>';
    
    day.schedules.forEach(function(s) {
      var peer = findNeighbor(s.peerId);
      var avatar = peer ? peer.avatar : '🧓';
      var statusBadge = '';
      if (s.status === 'doing') statusBadge = '<span class="sched-badge doing">进行中</span>';
      else if (s.status === 'done') statusBadge = s.rating > 0 ? '<span class="sched-badge done">已评价</span>' : '<span class="sched-badge rated">待评价</span>';
      
      html += '<div class="sched-card" onclick="openChatFromSched(\''+s.peerId+'\')">';
      html += '<div class="sched-time-col">'+(s.scheduleTime||'待定')+'</div>';
      html += '<div class="sched-avatar-col">'+avatar+'</div>';
      html += '<div class="sched-info-col">';
      html += '<div class="sched-name-row">'+s.peerName+statusBadge+'</div>';
      html += '<div class="sched-type-row">'+s.type+' · '+(peer?peer.community:'阳光小区')+'</div>';
      html += '</div>';
      html += '<div class="sched-arrow">›</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  
  // 已取消/历史日程
  var cancelled = state.records.filter(function(r){ return r.status === 'cancelled'; });
  if (cancelled.length > 0) {
    html += '<div class="section-title" style="margin-top:16px">已取消的约定</div>';
    cancelled.slice().reverse().forEach(function(s) {
      html += '<div class="sched-card cancelled">';
      html += '<div class="sched-time-col">'+(s.scheduleTime||'—')+'</div>';
      html += '<div class="sched-avatar-col">⊘</div>';
      html += '<div class="sched-info-col">';
      html += '<div class="sched-name-row">'+s.peerName+' <span class="sched-badge cancelled-badge">已取消</span></div>';
      html += '<div class="sched-type-row">'+s.type+(s.scheduleDate?' · '+formatDateShort(s.scheduleDate):'')+'</div>';
      html += '</div></div>';
    });
  }
  
  return html;
}

function openChatFromSched(peerId) {
  var peer = findNeighbor(peerId);
  if (peer) {
    chatPeer = peer;
    pendingRating = 0;
    navigate('chat', { peerId: peerId });
  } else {
    showToast('该搭子信息不存在');
  }
}

// ====== Init ======
render();
</script>
</body>
</html>
