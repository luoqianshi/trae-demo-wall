<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>回声日记 - Echo Journal</title>

  <!-- PWA：可安装到手机/桌面 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7c4dff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="回声日记">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="fairy-bg">
    <!-- 漂浮装饰元素 -->
    <div class="floating-decorations">
      <div class="floating-star" style="top: 10%; left: 5%; animation-delay: 0s;"><i class="fas fa-star"></i></div>
      <div class="floating-star" style="top: 20%; right: 8%; animation-delay: 0.5s;"><i class="fas fa-star"></i></div>
      <div class="floating-star" style="top: 40%; left: 3%; animation-delay: 1s;"><i class="fas fa-sparkles"></i></div>
      <div class="floating-star" style="top: 60%; right: 5%; animation-delay: 1.5s;"><i class="fas fa-star"></i></div>
      <div class="floating-star" style="top: 75%; left: 8%; animation-delay: 2s;"><i class="fas fa-moon"></i></div>
      <div class="floating-star" style="top: 85%; right: 10%; animation-delay: 2.5s;"><i class="fas fa-sparkles"></i></div>
      <div class="cloud-decor" style="top: 15%; left: 20%;"><div class="cloud"></div></div>
      <div class="cloud-decor" style="top: 35%; right: 15%;"><div class="cloud"></div></div>
      <div class="floating-heart" style="top: 50%; left: 6%; animation-delay: 0.3s;"><i class="fas fa-heart"></i></div>
      <div class="floating-heart" style="top: 70%; right: 8%; animation-delay: 1.3s;"><i class="fas fa-heart"></i></div>
      <div class="floating-feather" style="top: 25%; right: 12%;"><i class="fas fa-feather-alt"></i></div>
      <div class="floating-feather" style="top: 80%; left: 15%;"><i class="fas fa-feather-alt"></i></div>
    </div>

    <!-- 主容器 -->
    <div id="app" class="max-w-md mx-auto px-4 pt-20 pb-24 relative z-10">
      
      <!-- 标题区域 -->
      <header class="text-center mb-6 relative">
        <div class="header-decoration">
          <div class="deco-branch-left"><i class="fas fa-leaf"></i><i class="fas fa-leaf"></i><i class="fas fa-spa"></i></div>
          <div class="deco-branch-right"><i class="fas fa-spa"></i><i class="fas fa-leaf"></i><i class="fas fa-leaf"></i></div>
        </div>
        <div class="title-wrapper">
          <div class="title-flowers">
            <span class="flower-icon">🌸</span>
            <span class="flower-icon">✨</span>
            <span class="flower-icon">🌸</span>
          </div>
          <h1 class="title-main">回声日记</h1>
          <p class="title-sub">记录你的童话生活</p>
          <div class="title-underline"></div>
        </div>
      </header>

      <!-- 写日记页面 -->
      <div id="view-write" class="view-section">
        <div class="date-card">
          <div class="date-moon"><i class="fas fa-moon"></i></div>
          <div class="date-content">
            <div id="current-date" class="date-main"></div>
            <div id="current-weekday" class="date-sub"></div>
          </div>
          <div class="date-stars">
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
          </div>
        </div>

        <div class="fairy-card write-card">
          <div class="card-ribbon"></div>
          <div class="card-corner card-corner-tl"></div>
          <div class="card-corner card-corner-tr"></div>
          <div class="card-corner card-corner-bl"></div>
          <div class="card-corner card-corner-br"></div>
          
          <!-- 录音按钮区域 -->
          <div class="record-area">
            <div class="record-glow"></div>
            <div class="record-buttons">
              <!-- 停止按钮 -->
              <button id="stop-btn" class="record-action-btn stop-btn hidden">
                <div class="btn-inner">
                  <i class="fas fa-stop"></i>
                </div>
                <span class="btn-label">停止</span>
              </button>
              
              <!-- 录音/暂停按钮 -->
              <button id="record-btn" class="record-main-btn">
                <div class="record-btn-glow"></div>
                <div class="record-btn-inner">
                  <i class="fas fa-microphone"></i>
                </div>
                <div class="record-btn-ring"></div>
                <div class="record-btn-ring ring-2"></div>
              </button>
              
              <!-- 暂停/继续按钮 -->
              <button id="pause-btn" class="record-action-btn pause-btn hidden">
                <div class="btn-inner">
                  <i class="fas fa-pause"></i>
                </div>
                <span class="btn-label">暂停</span>
              </button>
            </div>
            
            <div class="record-status-wrapper">
              <div id="status-indicator" class="status-dot"></div>
              <span id="status-text" class="tooltip-text">点击麦克风开始录音</span>
            </div>
            
            <div id="live-transcript" class="live-transcript hidden">
              <i class="fas fa-comment-dots"></i>
              <span id="transcript-text"></span>
            </div>
          </div>

          <!-- 文本输入 -->
          <div class="input-wrapper">
            <div class="input-decorations">
              <i class="fas fa-quote-left"></i>
              <i class="fas fa-pen-fancy"></i>
              <i class="fas fa-quote-right"></i>
            </div>
            <textarea id="diary-input" class="diary-input" placeholder="✨ 今天发生了什么美好的事情呢？写下你的故事..."></textarea>
          </div>

          <!-- 图片附件 -->
          <div class="image-upload-row">
            <button id="add-image-btn" class="add-image-btn" type="button">
              <i class="fas fa-camera"></i> 添加图片
            </button>
            <input type="file" id="image-input" accept="image/*" multiple class="hidden">
            <span id="image-count" class="image-count"></span>
          </div>
          <div id="image-preview" class="image-preview"></div>

          <!-- 操作按钮 -->
          <div class="action-buttons">
            <button id="save-btn" class="action-btn save-btn">
              <div class="btn-icon"><i class="fas fa-bookmark"></i></div>
              <span>保存日记</span>
              <div class="btn-shine"></div>
            </button>
            <button id="analyze-btn" class="action-btn analyze-btn">
              <div class="btn-icon"><i class="fas fa-magic"></i></div>
              <span>AI 魔法分析</span>
              <div class="btn-sparkles"><i class="fas fa-sparkles"></i></div>
              <div class="btn-shine"></div>
            </button>
          </div>
        </div>

        <!-- AI 分析结果 -->
        <div id="analysis-result" class="analysis-card hidden">
          <div class="analysis-glow"></div>
          <div class="analysis-header">
            <div class="analysis-icon"><i class="fas fa-crown"></i></div>
            <h3>✨ 精灵的祝福 ✨</h3>
            <div class="analysis-stars">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
            </div>
          </div>
          <div class="analysis-content">
            <div class="analysis-item">
              <div class="item-icon"><i class="fas fa-heart"></i></div>
              <div class="item-label">情绪魔法</div>
              <div id="result-emotion" class="item-value"></div>
            </div>
            <div class="analysis-divider"><i class="fas fa-flower-daffodil"></i></div>
            <div class="analysis-item">
              <div class="item-icon"><i class="fas fa-gem"></i></div>
              <div class="item-label">故事主题</div>
              <div id="result-themes" class="item-tags"></div>
            </div>
            <div class="analysis-divider"><i class="fas fa-flower-daffodil"></i></div>
            <div class="analysis-item advice-item">
              <div class="item-icon"><i class="fas fa-comments"></i></div>
              <div class="item-label">小精灵的建议</div>
              <div id="result-summary" class="item-advice"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 日记本页面 -->
      <div id="view-list" class="view-section hidden">
        <div class="section-header">
          <div class="section-deco">
            <i class="fas fa-book-spells"></i>
          </div>
          <h2>📖 我的故事书</h2>
          <button id="refresh-btn" class="refresh-btn">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>

        <div id="diary-list" class="diary-list">
          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-book-open"></i>
              <div class="empty-sparkles">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
              </div>
            </div>
            <p>还没有故事哦~</p>
            <p class="empty-hint">去写一篇属于你的童话吧 ✨</p>
          </div>
        </div>
      </div>

      <!-- 详情页面 -->
      <div id="view-detail" class="view-section hidden">
        <button id="back-btn" class="back-btn">
          <i class="fas fa-arrow-left"></i>
          <span>返回故事书</span>
          <div class="back-trail"></div>
        </button>

        <div id="detail-content" class="fairy-card detail-card">
          <div class="card-ribbon ribbon-gold"></div>
          <div class="card-corner card-corner-tl"></div>
          <div class="card-corner card-corner-tr"></div>
          <div class="card-corner card-corner-bl"></div>
          <div class="card-corner card-corner-br"></div>
          
          <div id="detail-date" class="detail-date"></div>
          <div id="detail-text" class="detail-text"></div>

          <div id="detail-analysis" class="detail-analysis">
            <div class="analysis-divider-full"><i class="fas fa-star"></i><i class="fas fa-moon"></i><i class="fas fa-star"></i></div>
            <h3 class="detail-analysis-title">📜 精灵的分析</h3>
            <div id="detail-analysis-content" class="detail-analysis-content"></div>
          </div>

          <button id="delete-btn" class="delete-btn">
            <i class="fas fa-trash-alt"></i>
            <span>让故事消失</span>
          </button>
        </div>
      </div>

      <!-- 我的页面 -->
      <div id="view-profile" class="view-section hidden">
        <div class="profile-header">
          <div class="profile-avatar">
            <div class="avatar-ring"></div>
            <div class="avatar-inner">
              <i class="fas fa-crown"></i>
            </div>
            <div class="avatar-sparkles">
              <i class="fas fa-sparkles"></i>
              <i class="fas fa-sparkles"></i>
              <i class="fas fa-sparkles"></i>
            </div>
          </div>
          <h2>小魔法师</h2>
          <p>在童话世界里遨游 ✨</p>
        </div>

        <div class="fairy-card settings-card">
          <div class="card-ribbon ribbon-pink"></div>
          
          <div class="setting-item">
            <div class="setting-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
            <div class="setting-info">
              <span class="setting-title">AI 魔法分析</span>
              <span class="setting-desc">开启后可以使用精灵的祝福</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="ai-toggle" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-stars"><i class="fas fa-star"></i></span>
            </label>
          </div>

          <div class="setting-divider"><i class="fas fa-flower-daffodil"></i></div>

          <div class="ai-settings">
            <div class="ai-settings-header">
              <i class="fas fa-robot"></i>
              <h3>AI 魔法设置</h3>
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-cloud"></i>
                <span>API 提供商</span>
              </label>
              <select id="ai-provider" class="ai-select">
                <option value="mock">内置精灵（测试用）</option>
                <option value="openai">OpenAI / 兼容接口</option>
                <option value="claude">Claude / 兼容接口</option>
                <option value="custom">自定义接口</option>
              </select>
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-key"></i>
                <span>API Key</span>
              </label>
              <div class="input-with-toggle">
                <input type="password" id="ai-api-key" class="ai-input" placeholder="请输入你的API密钥">
                <button id="toggle-api-key" class="toggle-btn" type="button">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-link"></i>
                <span>Base URL</span>
              </label>
              <input type="text" id="ai-base-url" class="ai-input" placeholder="https://api.example.com/v1">
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-cube"></i>
                <span>模型名称</span>
              </label>
              <input type="text" id="ai-model" class="ai-input" placeholder="gpt-4o-mini">
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-sliders-h"></i>
                <span>温度 (Temperature)</span>
              </label>
              <div class="slider-container">
                <input type="range" id="ai-temperature" min="0" max="2" step="0.1" value="0.7">
                <span class="slider-value">0.7</span>
              </div>
            </div>
            
            <div class="ai-setting-item">
              <label class="ai-setting-label">
                <i class="fas fa-file-alt"></i>
                <span>最大 Token</span>
              </label>
              <input type="number" id="ai-max-tokens" class="ai-input" placeholder="2000" value="2000">
            </div>
            
            <button id="save-ai-settings" class="save-ai-btn">
              <i class="fas fa-save"></i>
              <span>保存魔法设置</span>
            </button>
            
            <button id="test-ai-connection" class="test-ai-btn">
              <i class="fas fa-wifi"></i>
              <span>测试魔法连接</span>
            </button>
          </div>

          <div class="setting-divider"><i class="fas fa-flower-daffodil"></i></div>

          <div class="trend-analysis-card">
            <div class="trend-header">
              <i class="fas fa-chart-line"></i>
              <h3>时光之镜</h3>
            </div>
            
            <div class="trend-tabs">
              <button id="trend-week" class="trend-tab active">本周</button>
              <button id="trend-month" class="trend-tab">本月</button>
            </div>
            
            <div id="trend-content" class="trend-content">
              <div class="trend-empty">
                <i class="fas fa-sparkles"></i>
                <p>点击下方按钮查看趋势分析</p>
              </div>
            </div>
            
            <button id="analyze-trend-btn" class="trend-analyze-btn">
              <i class="fas fa-magic"></i>
              <span>查看趋势</span>
            </button>
          </div>

          <button id="clear-all-btn" class="danger-btn">
            <i class="fas fa-broom"></i>
            <span>清空所有故事</span>
            <div class="danger-glow"></div>
          </button>
        </div>

        <div class="about-card">
          <div class="about-header">
            <i class="fas fa-scroll"></i>
            <h3>关于回声日记</h3>
          </div>
          <p>这是一本魔法日记本，记录你生活中的每一个美好瞬间。精灵会帮你分析心情，发现生活的美好。</p>
          <div class="about-footer">
            <span class="version">v1.0.0</span>
            <span class="made-with">Made with <i class="fas fa-heart"></i></span>
          </div>
        </div>
      </div>
    </nav>

    <!-- 底部导航 -->
    <nav class="fairy-nav">
      <div class="nav-bg"></div>
      <div class="nav-items">
        <button class="nav-btn active" data-view="view-write">
          <div class="nav-icon"><i class="fas fa-quill"></i></div>
          <div class="nav-glow"></div>
          <span>写日记</span>
          <div class="nav-sparkle"><i class="fas fa-sparkles"></i></div>
        </button>
        <button class="nav-btn" data-view="view-list">
          <div class="nav-icon"><i class="fas fa-book"></i></div>
          <div class="nav-glow"></div>
          <span>故事书</span>
          <div class="nav-sparkle"><i class="fas fa-sparkles"></i></div>
        </button>
        <button class="nav-btn" data-view="view-profile">
          <div class="nav-icon"><i class="fas fa-crown"></i></div>
          <div class="nav-glow"></div>
          <span>我的</span>
          <div class="nav-sparkle"><i class="fas fa-sparkles"></i></div>
        </button>
      </div>
    </nav>
  </div>

  <!-- 录音状态提示 -->
  <div id="record-status" class="record-status hidden">
    <div class="record-status-inner">
      <div class="record-dot"></div>
      <span id="record-text">录音中...</span>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fairy-toast hidden">
    <i class="fas fa-sparkles"></i>
    <span></span>
  </div>

  <!-- PWA 安装按钮（仅在可安装时显示） -->
  <button id="install-btn" class="install-btn hidden">
    <i class="fas fa-download"></i>
    <span>安装到手机/桌面</span>
  </button>

  <script src="js/app.js"></script>
</body>
</html>
