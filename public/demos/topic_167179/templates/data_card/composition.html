<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --theme: #f59e0b;
    --theme-glow: rgba(245,158,11,0.15);
    --text: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1700px; overflow: hidden;
    background: transparent; font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }
  .scene {
    width: 1080px; height: 1700px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; position: relative;
  }
  .bg-ring {
    position: absolute; border-radius: 50%;
    border: 2px solid var(--theme); opacity: 0.15;
  }
  .ring-1 { width: 600px; height: 600px; }
  .ring-2 { width: 500px; height: 500px; opacity: 0.1; }
  .ring-3 { width: 400px; height: 400px; opacity: 0.08; }
  .particle {
    position: absolute; width: 6px; height: 6px;
    background: var(--theme); border-radius: 50%;
    box-shadow: 0 0 10px var(--theme-glow);
  }

  /* === 默认/大气数字 classic === */
  .card-classic {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    background: transparent;
  }
  .number-group { display: flex; align-items: baseline; gap: 8px; position: relative; }
  .big-number {
    font-size: 180px; font-weight: 900; color: var(--text);
    line-height: 1; letter-spacing: -4px;
    text-shadow: 0 0 60px var(--theme-glow);
  }
  .unit { font-size: 48px; font-weight: 500; color: var(--theme); letter-spacing: 2px; }
  .accent-bar {
    width: 80px; height: 4px; background: var(--theme);
    border-radius: 2px; box-shadow: 0 0 20px var(--theme-glow);
  }
  .desc-text {
    font-size: 36px; font-weight: 400; color: #9ca3af;
    letter-spacing: 6px; margin-top: 8px;
  }
  .sub-desc {
    font-size: 24px; font-weight: 300; color: #6b7280;
    letter-spacing: 4px;
  }

  /* === 对比卡片 compare === */
  .card-compare {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 60px;
  }
  .compare-col {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-width: 300px;
  }
  .compare-label { font-size: 28px; color: #9ca3af; letter-spacing: 4px; }
  .compare-number { font-size: 120px; font-weight: 900; color: var(--text); line-height: 1; }
  .compare-unit { font-size: 40px; color: var(--theme); }
  .compare-vs {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid var(--theme); color: var(--theme);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700;
  }

  /* === 趋势卡片 trend === */
  .card-trend {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .trend-arrow { font-size: 80px; color: var(--theme); line-height: 1; }
  .trend-number { font-size: 160px; font-weight: 900; color: var(--text); line-height: 1; }
  .trend-unit { font-size: 48px; color: var(--theme); margin-left: 8px; }
  .trend-label { font-size: 32px; color: #9ca3af; letter-spacing: 6px; }

  /* === 环形进度 ring === */
  .card-ring {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .ring-svg { width: 420px; height: 420px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 24; }
  .ring-progress { fill: none; stroke: var(--theme); stroke-width: 24; stroke-linecap: round; }
  .ring-inner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; margin-top: -8px;
  }
  .ring-number { font-size: 100px; font-weight: 900; color: var(--text); line-height: 1; }
  .ring-unit { font-size: 36px; color: var(--theme); }
  .ring-label { font-size: 30px; color: #9ca3af; letter-spacing: 4px; }

  /* === 迷你标签 tag === */
  .card-tag {
    position: relative; z-index: 1;
    display: inline-flex; align-items: baseline; gap: 10px;
    border: 2px solid var(--theme); border-radius: 999px;
    padding: 24px 56px;
    background: rgba(245,158,11,0.08);
    box-shadow: 0 0 30px var(--theme-glow);
  }
  .tag-number { font-size: 80px; font-weight: 900; color: var(--theme); line-height: 1; }
  .tag-unit { font-size: 36px; color: var(--text); }
  .tag-label { font-size: 26px; color: #9ca3af; margin-left: 16px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="scene">
    <div class="bg-ring ring-1" data-classic></div>
    <div class="bg-ring ring-2" data-classic></div>
    <div class="bg-ring ring-3" data-classic></div>
    <div class="particle" id="particle1" style="top: 20%; left: 15%;"></div>
    <div class="particle" id="particle2" style="top: 75%; right: 20%;"></div>
    <div class="particle" id="particle3" style="bottom: 25%; left: 25%;"></div>

    <!-- classic -->
    <div class="card-classic" id="cardClassic">
      <div class="number-group">
        <div class="big-number" id="classicNumber">30</div>
        <div class="unit" id="classicUnit">%</div>
      </div>
      <div class="accent-bar" id="classicBar"></div>
      <div class="desc-text" id="classicDesc">同比增长</div>
      <div class="sub-desc" id="classicSub"></div>
    </div>

    <!-- compare -->
    <div class="card-compare hidden" id="cardCompare">
      <div class="compare-col">
        <div class="compare-label">本期</div>
        <div class="compare-number"><span id="compareNumber1">30</span><span class="compare-unit" id="compareUnit1">%</span></div>
      </div>
      <div class="compare-vs">VS</div>
      <div class="compare-col">
        <div class="compare-label">对比</div>
        <div class="compare-number"><span id="compareNumber2">--</span><span class="compare-unit" id="compareUnit2"></span></div>
      </div>
    </div>

    <!-- trend -->
    <div class="card-trend hidden" id="cardTrend">
      <div class="trend-arrow" id="trendArrow">▲</div>
      <div class="trend-number"><span id="trendNumber">30</span><span class="trend-unit" id="trendUnit">%</span></div>
      <div class="trend-label" id="trendLabel">同比增长</div>
    </div>

    <!-- ring -->
    <div class="card-ring hidden" id="cardRing">
      <div style="position:relative;">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
          <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88" stroke-dasharray="0 553"></circle>
        </svg>
        <div class="ring-inner">
          <div class="ring-number"><span id="ringNumber">30</span><span class="ring-unit" id="ringUnit">%</span></div>
        </div>
      </div>
      <div class="ring-label" id="ringLabel">完成率</div>
    </div>

    <!-- tag -->
    <div class="card-tag hidden" id="cardTag">
      <span class="tag-number" id="tagNumber">30</span>
      <span class="tag-unit" id="tagUnit">%</span>
      <span class="tag-label" id="tagLabel">增长</span>
    </div>
  </div>

  <script>
    function updateAnimation(progress) {
      const P = window.__TEMPLATE_PARAMS || {};
      const T = window.__THEME || {};
      const preset = P.preset || 'classic';

      document.documentElement.style.setProperty('--theme', T.primary);
      document.documentElement.style.setProperty('--theme-glow', T.primaryGlow);

      // displayText 优先作为包装显示文案；否则回退到 number+unit
      const number = P.number || P.displayText || P.mainText || '30';
      const unit = P.unit || '';
      const label = P.subText || '';
      const source = P.source || '';

      // 解析数字（用于 ring/trend）
      const numericMatch = String(number).match(/[\d,.]+/);
      const numericValue = numericMatch ? parseFloat(numericMatch[0].replace(/,/g, '')) : 0;
      const percentage = Math.min(100, Math.max(0, numericValue > 1 && numericValue <= 100 ? numericValue : numericValue * 100));

      // 切换预设
      document.getElementById('cardClassic').classList.toggle('hidden', preset !== 'classic');
      document.getElementById('cardCompare').classList.toggle('hidden', preset !== 'compare');
      document.getElementById('cardTrend').classList.toggle('hidden', preset !== 'trend');
      document.getElementById('cardRing').classList.toggle('hidden', preset !== 'ring');
      document.getElementById('cardTag').classList.toggle('hidden', preset !== 'tag');
      document.querySelectorAll('[data-classic]').forEach(el => el.style.display = preset === 'classic' ? '' : 'none');
      document.querySelectorAll('.particle').forEach(el => el.style.display = preset === 'classic' ? '' : 'none');

      // classic
      document.getElementById('classicNumber').textContent = number;
      document.getElementById('classicUnit').textContent = unit;
      document.getElementById('classicDesc').textContent = label;
      document.getElementById('classicSub').textContent = source;

      // compare
      document.getElementById('compareNumber1').textContent = number;
      document.getElementById('compareUnit1').textContent = unit;
      document.getElementById('compareNumber2').textContent = P.compareNumber || '--';
      document.getElementById('compareUnit2').textContent = P.compareUnit || unit;

      // trend
      const isDown = /下降|下跌|减少|降低|负/.test(label + source);
      document.getElementById('trendArrow').textContent = isDown ? '▼' : '▲';
      document.getElementById('trendArrow').style.color = isDown ? '#ef4444' : T.primary;
      document.getElementById('trendNumber').textContent = number;
      document.getElementById('trendUnit').textContent = unit;
      document.getElementById('trendLabel').textContent = label;

      // ring
      document.getElementById('ringNumber').textContent = number;
      document.getElementById('ringUnit').textContent = unit;
      document.getElementById('ringLabel').textContent = label || '完成率';
      const circumference = 2 * Math.PI * 88;
      const ringCircle = document.getElementById('ringProgress');
      ringCircle.setAttribute('stroke-dasharray', `${(percentage / 100) * circumference} ${circumference}`);

      // tag
      document.getElementById('tagNumber').textContent = number;
      document.getElementById('tagUnit').textContent = unit;
      document.getElementById('tagLabel').textContent = label;

      // 动画
      animateElement('classicNumber', progress, 0, 0.25, 'scale');
      animateElement('classicUnit', progress, 0, 0.25, 'translateY');
      animateElement('classicBar', progress, 0.2, 0.4, 'scaleX');
      animateOpacity('classicDesc', progress, 0.35, 0.55);
      animateOpacity('classicSub', progress, 0.5, 0.7);

      animateOpacity('cardCompare', progress, 0, 0.3);
      animateOpacity('cardTrend', progress, 0, 0.3);
      animateOpacity('cardRing', progress, 0, 0.3);
      animateOpacity('cardTag', progress, 0, 0.3);

      // particles (classic only)
      if (preset === 'classic') {
        document.querySelectorAll('.particle').forEach((p, i) => {
          const delay = i * 0.1;
          const pStart = 0.15 + delay;
          p.style.opacity = progress >= pStart ? Math.min(1, (progress - pStart) * 5) : 0;
        });
      }
    }

    function animateElement(id, progress, start, end, type) {
      const el = document.getElementById(id);
      if (!el) return;
      if (progress <= start) {
        el.style.opacity = 0;
        if (type === 'scale') el.style.transform = 'scale(0.3)';
        if (type === 'translateY') el.style.transform = 'translateY(20px)';
        if (type === 'scaleX') { el.style.transform = 'scaleX(0)'; el.style.opacity = 0; }
      } else if (progress <= end) {
        const t = (progress - start) / (end - start);
        const eased = 1 - Math.pow(1 - t, 3);
        el.style.opacity = eased;
        if (type === 'scale') el.style.transform = `scale(${0.3 + 0.7 * eased})`;
        if (type === 'translateY') el.style.transform = `translateY(${(1 - eased) * 20}px)`;
        if (type === 'scaleX') { el.style.transform = `scaleX(${eased})`; el.style.opacity = eased; }
      } else {
        el.style.opacity = 1;
        el.style.transform = type === 'scaleX' ? 'scaleX(1)' : type === 'scale' ? 'scale(1)' : 'translateY(0)';
      }
    }

    function animateOpacity(id, progress, start, end) {
      const el = document.getElementById(id);
      if (!el) return;
      if (progress <= start) el.style.opacity = 0;
      else if (progress <= end) el.style.opacity = (progress - start) / (end - start);
      else el.style.opacity = 1;
    }

    updateAnimation(window.__currentProgress || 0);
  </script>
</body>
</html>
