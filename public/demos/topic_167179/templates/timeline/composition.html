<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --theme: #f59e0b;
    --theme-glow: rgba(245,158,11,0.15);
    --text: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1700px; overflow: hidden;
    background: transparent; font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }
  .scene {
    width: 1080px; height: 1700px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: transparent; position: relative;
  }
  .hidden { display: none !important; }

  /* === classic 单节点 === */
  .timeline-classic { text-align: center; z-index: 1; }
  .tc-dot {
    width: 24px; height: 24px; border-radius: 50%; background: var(--theme);
    box-shadow: 0 0 30px var(--theme-glow); margin: 0 auto 24px;
  }
  .tc-time { font-size: 64px; font-weight: 800; color: var(--theme); letter-spacing: 4px; }
  .tc-text { font-size: 40px; font-weight: 400; color: var(--text); margin-top: 16px; letter-spacing: 2px; }

  /* === dual 双节点对比 === */
  .timeline-dual {
    display: flex; align-items: center; gap: 48px; z-index: 1;
  }
  .dual-col { text-align: center; min-width: 300px; }
  .dual-label { font-size: 28px; color: #9ca3af; letter-spacing: 2px; margin-bottom: 12px; }
  .dual-time { font-size: 56px; font-weight: 800; color: var(--text); }
  .dual-time-active { color: var(--theme); }
  .dual-arrow { font-size: 48px; color: var(--theme); }

  /* === flow 流程轴 === */
  .timeline-flow { width: 80%; z-index: 1; }
  .flow-track {
    display: flex; align-items: center; justify-content: space-between; position: relative;
    margin-bottom: 40px;
  }
  .flow-track::before {
    content: ''; position: absolute; left: 10%; right: 10%; top: 14px; height: 4px; background: rgba(255,255,255,0.1);
  }
  .flow-step { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .flow-dot {
    width: 32px; height: 32px; border-radius: 50%; background: var(--theme);
    box-shadow: 0 0 20px var(--theme-glow); display: flex; align-items: center; justify-content: center;
    color: #000; font-size: 16px; font-weight: 800;
  }
  .flow-dot-inactive { background: rgba(255,255,255,0.15); color: transparent; }
  .flow-label { font-size: 24px; color: var(--text); }

  /* === date_card 日期卡片 === */
  .timeline-datecard {
    text-align: center; z-index: 1; border: 2px solid var(--theme); border-radius: 24px;
    padding: 60px 80px; background: var(--theme)08;
  }
  .tdc-date { font-size: 90px; font-weight: 900; color: var(--theme); line-height: 1; letter-spacing: 4px; }
  .tdc-text { font-size: 40px; color: var(--text); margin-top: 20px; letter-spacing: 2px; }

  /* === milestone 里程碑 === */
  .timeline-milestone { width: 80%; position: relative; z-index: 1; height: 400px; }
  .ms-line {
    position: absolute; left: 10%; right: 10%; top: 50%; height: 4px; background: rgba(255,255,255,0.12);
  }
  .ms-item { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ms-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--theme); box-shadow: 0 0 20px var(--theme-glow); }
  .ms-time { font-size: 28px; color: var(--theme); font-weight: 600; }
  .ms-text { font-size: 24px; color: var(--text); max-width: 220px; text-align: center; }
</style>
</head>
<body>
  <div class="scene">
    <div class="timeline-classic" id="timelineClassic">
      <div class="tc-dot"></div>
      <div class="tc-time" id="classicTime">2024年</div>
      <div class="tc-text" id="classicText">政策发布</div>
    </div>

    <div class="timeline-dual hidden" id="timelineDual">
      <div class="dual-col">
        <div class="dual-label">过去</div>
        <div class="dual-time" id="dualPast">--</div>
      </div>
      <div class="dual-arrow">→</div>
      <div class="dual-col">
        <div class="dual-label">现在</div>
        <div class="dual-time dual-time-active" id="dualNow">2024年</div>
      </div>
    </div>

    <div class="timeline-flow hidden" id="timelineFlow">
      <div class="flow-track" id="flowTrack">
        <div class="flow-step"><div class="flow-dot">1</div><div class="flow-label">启动</div></div>
        <div class="flow-step"><div class="flow-dot">2</div><div class="flow-label">推进</div></div>
        <div class="flow-step"><div class="flow-dot flow-dot-inactive">3</div><div class="flow-label">落地</div></div>
      </div>
      <div class="tc-text" style="text-align:center;" id="flowText">项目进入第二阶段</div>
    </div>

    <div class="timeline-datecard hidden" id="timelineDatecard">
      <div class="tdc-date" id="datecardDate">2024年7月</div>
      <div class="tdc-text" id="datecardText">新政正式实施</div>
    </div>

    <div class="timeline-milestone hidden" id="timelineMilestone">
      <div class="ms-line"></div>
      <div class="ms-item" style="left:15%;top:28%;">
        <div class="ms-dot"></div>
        <div class="ms-time" id="msTime1">2023年</div>
        <div class="ms-text" id="msText1">立项</div>
      </div>
      <div class="ms-item" style="left:55%;top:58%;">
        <div class="ms-dot"></div>
        <div class="ms-time" id="msTime2">2024年</div>
        <div class="ms-text" id="msText2">突破</div>
      </div>
    </div>
  </div>

  <script>
    function updateAnimation(progress) {
      const P = window.__TEMPLATE_PARAMS || {};
      const T = window.__THEME || {};
      const preset = P.preset || 'classic';

      document.documentElement.style.setProperty('--theme', T.primary);
      document.documentElement.style.setProperty('--theme-glow', T.primaryGlow);

      const items = P.items || [{ time: P.displayText || P.timeText || P.mainText || '时间', text: P.subText || '' }];
      const first = items[0] || { time: '', text: '' };
      const second = items[1] || { time: '', text: '' };

      document.getElementById('timelineClassic').classList.toggle('hidden', preset !== 'classic');
      document.getElementById('timelineDual').classList.toggle('hidden', preset !== 'dual');
      document.getElementById('timelineFlow').classList.toggle('hidden', preset !== 'flow');
      document.getElementById('timelineDatecard').classList.toggle('hidden', preset !== 'date_card');
      document.getElementById('timelineMilestone').classList.toggle('hidden', preset !== 'milestone');

      // classic
      document.getElementById('classicTime').textContent = first.time;
      document.getElementById('classicText').textContent = first.text;

      // dual
      document.getElementById('dualPast').textContent = second.time || '--';
      document.getElementById('dualNow').textContent = first.time;

      // flow
      document.getElementById('flowText').textContent = first.text || first.time;

      // datecard
      document.getElementById('datecardDate').textContent = first.time;
      document.getElementById('datecardText').textContent = first.text;

      // milestone
      document.getElementById('msTime1').textContent = second.time || '此前';
      document.getElementById('msText1').textContent = second.text || '前期';
      document.getElementById('msTime2').textContent = first.time;
      document.getElementById('msText2').textContent = first.text;

      animateOpacity('timelineClassic', progress, 0, 0.4);
      animateOpacity('timelineDual', progress, 0, 0.4);
      animateOpacity('timelineFlow', progress, 0, 0.4);
      animateOpacity('timelineDatecard', progress, 0, 0.4);
      animateOpacity('timelineMilestone', progress, 0, 0.4);
    }

    function animateOpacity(id, progress, start, end) {
      const el = document.getElementById(id);
      if (!el) return;
      if (progress <= start) el.style.opacity = 0;
      else if (progress <= end) el.style.opacity = (progress - start) / (end - start);
      else el.style.opacity = 1;
    }

    updateAnimation(window.__currentProgress || 0);
  </script>
</body>
</html>
