<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --theme: #f59e0b;
    --theme-glow: rgba(245,158,11,0.15);
    --text: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1700px; overflow: hidden;
    background: transparent; font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }
  .scene {
    width: 1080px; height: 1700px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; background: transparent; position: relative; overflow: hidden;
  }
  .hidden { display: none !important; }

  /* 扫描线背景 */
  .scanlines {
    position: absolute; inset: 0; z-index: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px
    );
  }
  /* 光效 */
  .light-sweep {
    position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at center, var(--theme-glow) 0%, transparent 70%);
    z-index: 0; opacity: 0;
  }

  /* === classic 大气标题 === */
  .title-classic { text-align: center; z-index: 1; }
  .title-classic .decor-line {
    display: flex; align-items: center; gap: 20px; justify-content: center; margin-bottom: 36px;
  }
  .title-classic .line {
    width: 120px; height: 2px; background: var(--theme);
    box-shadow: 0 0 10px var(--theme-glow);
  }
  .title-classic .diamond {
    width: 12px; height: 12px; background: var(--theme);
    transform: rotate(45deg); box-shadow: 0 0 16px var(--theme-glow);
  }
  .title-classic .main-title {
    font-size: 96px; font-weight: 900; color: var(--text);
    letter-spacing: 12px;
    text-shadow: 0 0 40px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
  }
  .title-classic .sub-title {
    font-size: 36px; font-weight: 300; color: var(--theme);
    letter-spacing: 16px; margin-top: 24px;
  }
  .title-classic .bottom-tag {
    font-size: 20px; font-weight: 400; color: #6b7280;
    letter-spacing: 8px; margin-top: 20px;
  }

  /* === subtitle 副标题卡片 === */
  .title-subtitle { text-align: center; z-index: 1; max-width: 900px; }
  .title-subtitle .main-title {
    font-size: 80px; font-weight: 900; color: var(--text);
    letter-spacing: 6px; line-height: 1.2;
    text-shadow: 0 0 40px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
  }
  .title-subtitle .sub-title {
    font-size: 38px; font-weight: 400; color: var(--theme);
    letter-spacing: 6px; margin-top: 28px;
  }
  .title-subtitle .divider {
    width: 80px; height: 4px; background: var(--theme); border-radius: 2px;
    margin: 28px auto 0; box-shadow: 0 0 16px var(--theme-glow);
  }

  /* === left_bar 左线标题 === */
  .title-leftbar {
    display: flex; align-items: center; gap: 36px; z-index: 1;
    max-width: 920px;
  }
  .title-leftbar .bar {
    width: 10px; height: 160px; background: var(--theme); border-radius: 5px;
    box-shadow: 0 0 30px var(--theme-glow); flex-shrink: 0;
  }
  .title-leftbar .body { flex: 1; }
  .title-leftbar .main-title {
    font-size: 72px; font-weight: 900; color: var(--text); line-height: 1.3;
    text-shadow: 0 0 40px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
  }
  .title-leftbar .sub-title {
    font-size: 32px; font-weight: 400; color: var(--theme); margin-top: 16px; letter-spacing: 4px;
  }

  /* === conclusion 结论卡片 === */
  .title-conclusion { text-align: center; z-index: 1; max-width: 900px; }
  .title-conclusion .label {
    display: inline-block; font-size: 24px; font-weight: 700; color: var(--theme);
    letter-spacing: 8px; border: 1px solid var(--theme); border-radius: 999px;
    padding: 8px 28px; margin-bottom: 28px; box-shadow: 0 0 16px var(--theme-glow);
  }
  .title-conclusion .main-title {
    font-size: 64px; font-weight: 900; color: var(--text); line-height: 1.4;
    text-shadow: 0 0 40px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
  }

  /* === chapter 章节标签 === */
  .title-chapter {
    display: flex; align-items: center; gap: 32px; z-index: 1;
    max-width: 920px;
  }
  .title-chapter .num {
    width: 100px; height: 100px; border-radius: 50%;
    border: 4px solid var(--theme); color: var(--theme);
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: 900; flex-shrink: 0;
    box-shadow: 0 0 30px var(--theme-glow);
  }
  .title-chapter .main-title {
    font-size: 64px; font-weight: 900; color: var(--text); line-height: 1.3;
    text-shadow: 0 0 40px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
  }
  .title-chapter .sub-title {
    font-size: 28px; font-weight: 400; color: #9ca3af; margin-top: 10px; letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="scanlines" id="scanlines"></div>
    <div class="light-sweep" id="lightSweep"></div>

    <!-- classic -->
    <div class="title-classic" id="titleClassic">
      <div class="decor-line" id="decorLine">
        <div class="line" id="lineLeft"></div>
        <div class="diamond" id="diamond"></div>
        <div class="line" id="lineRight"></div>
      </div>
      <div class="main-title" id="classicMainTitle">标题卡片</div>
      <div class="sub-title" id="classicSubTitle"></div>
      <div class="bottom-tag" id="classicBottomTag">快讯 · 特别报道</div>
    </div>

    <!-- subtitle -->
    <div class="title-subtitle hidden" id="titleSubtitle">
      <div class="main-title" id="subtitleMainTitle">标题卡片</div>
      <div class="sub-title" id="subtitleSubTitle">副标题</div>
      <div class="divider"></div>
    </div>

    <!-- left_bar -->
    <div class="title-leftbar hidden" id="titleLeftbar">
      <div class="bar"></div>
      <div class="body">
        <div class="main-title" id="leftbarMainTitle">标题卡片</div>
        <div class="sub-title" id="leftbarSubTitle"></div>
      </div>
    </div>

    <!-- conclusion -->
    <div class="title-conclusion hidden" id="titleConclusion">
      <div class="label">结论</div>
      <div class="main-title" id="conclusionMainTitle">核心结论</div>
    </div>

    <!-- chapter -->
    <div class="title-chapter hidden" id="titleChapter">
      <div class="num" id="chapterNum">1</div>
      <div class="body">
        <div class="main-title" id="chapterMainTitle">章节标题</div>
        <div class="sub-title" id="chapterSubTitle"></div>
      </div>
    </div>
  </div>

  <script>
    function updateAnimation(progress) {
      const P = window.__TEMPLATE_PARAMS || {};
      const T = window.__THEME || {};
      const preset = P.preset || 'classic';

      document.documentElement.style.setProperty('--theme', T.primary);
      document.documentElement.style.setProperty('--theme-glow', T.primaryGlow);

      const mainText = P.displayText || P.mainText || '标题卡片';
      const subText = P.subText || '';
      const source = P.source || '快讯 · 特别报道';
      const chapterNum = P.chapterNumber || '1';

      document.getElementById('titleClassic').classList.toggle('hidden', preset !== 'classic');
      document.getElementById('titleSubtitle').classList.toggle('hidden', preset !== 'subtitle');
      document.getElementById('titleLeftbar').classList.toggle('hidden', preset !== 'left_bar');
      document.getElementById('titleConclusion').classList.toggle('hidden', preset !== 'conclusion');
      document.getElementById('titleChapter').classList.toggle('hidden', preset !== 'chapter');

      // classic
      document.getElementById('classicMainTitle').textContent = mainText;
      document.getElementById('classicSubTitle').textContent = subText;
      document.getElementById('classicBottomTag').textContent = source;

      // subtitle
      document.getElementById('subtitleMainTitle').textContent = mainText;
      document.getElementById('subtitleSubTitle').textContent = subText || source;

      // left_bar
      document.getElementById('leftbarMainTitle').textContent = mainText;
      document.getElementById('leftbarSubTitle').textContent = subText;

      // conclusion
      document.getElementById('conclusionMainTitle').textContent = mainText;

      // chapter
      document.getElementById('chapterNum').textContent = chapterNum;
      document.getElementById('chapterMainTitle').textContent = mainText;
      document.getElementById('chapterSubTitle').textContent = subText;

      const scanlines = document.getElementById('scanlines');
      const lightSweep = document.getElementById('lightSweep');

      scanlines.style.backgroundPosition = `0 ${progress * 200}px`;

      if (progress >= 0.15 && progress <= 0.6) {
        const t = (progress - 0.15) / 0.45;
        lightSweep.style.opacity = t < 0.1 ? t * 10 : t > 0.9 ? (1 - t) * 10 : 0.6;
        lightSweep.style.transform = `translateX(${(t - 0.5) * 200}px)`;
      } else {
        lightSweep.style.opacity = 0;
      }

      animateOpacity('titleClassic', progress, 0, 0.35);
      animateOpacity('titleSubtitle', progress, 0, 0.35);
      animateOpacity('titleLeftbar', progress, 0, 0.35);
      animateOpacity('titleConclusion', progress, 0, 0.35);
      animateOpacity('titleChapter', progress, 0, 0.35);

      // classic-specific detailed animation
      if (preset === 'classic') {
        const decorLine = document.getElementById('decorLine');
        const diamond = document.getElementById('diamond');
        const lineLeft = document.getElementById('lineLeft');
        const lineRight = document.getElementById('lineRight');
        if (progress <= 0.2) {
          const t = progress / 0.2;
          const eased = 1 - Math.pow(1 - t, 3);
          decorLine.style.opacity = eased;
          decorLine.style.transform = `scaleX(${eased})`;
          lineLeft.style.width = `${120 * eased}px`;
          lineRight.style.width = `${120 * eased}px`;
          diamond.style.opacity = eased;
          diamond.style.transform = `rotate(${45 + eased * 360}deg)`;
        } else {
          decorLine.style.opacity = 1;
          decorLine.style.transform = 'scaleX(1)';
          lineLeft.style.width = '120px';
          lineRight.style.width = '120px';
          diamond.style.opacity = 1;
          diamond.style.transform = 'rotate(45deg)';
        }
      }
    }

    function animateOpacity(id, progress, start, end) {
      const el = document.getElementById(id);
      if (!el) return;
      if (progress <= start) el.style.opacity = 0;
      else if (progress <= end) el.style.opacity = (progress - start) / (end - start);
      else el.style.opacity = 1;
    }

    updateAnimation(window.__currentProgress || 0);
  </script>
</body>
</html>
