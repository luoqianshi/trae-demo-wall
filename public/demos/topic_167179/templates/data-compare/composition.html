<!DOCTYPE html>
<html lang='zh-CN'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1700">
    <style>
      @font-face {
        font-family: 'PingFang SC';
        src: local('PingFang SC'), local('PingFang SC Bold'), local('PingFang SC Heavy');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: local('Noto Sans SC Black'), local('Noto Sans SC Heavy');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Microsoft YaHei';
        src: local('Microsoft YaHei');
        font-weight: 900;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1700px; overflow: hidden; background: transparent; }
      body { font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-weight: 900; }

      .clip { visibility: hidden; }

      .scene {
        width: 1080px;
        height: 1700px;
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      /* 数据标签：单元素，描边+发光+投影合并到 text-shadow */
      .data-tag {
        position: absolute;
        font-size: 86px;
        letter-spacing: 2px;
        line-height: 1;
        white-space: nowrap;
        font-weight: 900;
        text-align: center;
        max-width: 480px;
        will-change: transform, opacity, font-size;
      }

      /* 左侧数据 · 琥珀金主题 */
      .tag-left {
        left: 280px;
        top: 1120px;
        transform: translate(-50%, -50%);
        color: #fef3c7;
        text-shadow:
          -2px  0    0 #78350f,
           2px  0    0 #78350f,
           0   -2px  0 #78350f,
           0    2px  0 #78350f,
           2px  2px  0 rgba(0, 0, 0, 0.45),
           0    0   20px rgba(251, 191, 36, 0.8),
           0    0   50px rgba(245, 158, 11, 0.5);
      }

      /* 右侧数据 · 科技蓝主题 */
      .tag-right {
        left: 800px;
        top: 1300px;
        transform: translate(-50%, -50%);
        color: #dbeafe;
        text-shadow:
          -2px  0    0 #1e3a8a,
           2px  0    0 #1e3a8a,
           0   -2px  0 #1e3a8a,
           0    2px  0 #1e3a8a,
           2px  2px  0 rgba(0, 0, 0, 0.45),
           0    0   20px rgba(96, 165, 250, 0.8),
           0    0   50px rgba(59, 130, 246, 0.5);
      }

      /* 星光 */
      .sparkle {
        position: absolute;
        font-size: 32px;
        opacity: 0;
        will-change: transform, opacity;
      }

      .sparkle-amber {
        color: #fef3c7;
        text-shadow:
          0 0 10px rgba(251, 191, 36, 0.9),
          0 0 20px rgba(251, 191, 36, 0.6);
      }

      .sparkle-blue {
        color: #dbeafe;
        text-shadow:
          0 0 10px rgba(96, 165, 250, 0.9),
          0 0 20px rgba(96, 165, 250, 0.6);
      }

      .sparkle-1 { top: 1050px; left: 120px; font-size: 38px; }
      .sparkle-2 { top: 1180px; left: 60px;  font-size: 24px; }
      .sparkle-3 { top: 1100px; left: 540px; font-size: 28px; }
      .sparkle-4 { top: 1230px; right: 100px; font-size: 36px; }
      .sparkle-5 { top: 1380px; right: 120px; font-size: 26px; }
      .sparkle-6 { top: 1290px; right: 550px; font-size: 30px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="data-compare" data-start="0" data-duration="3" data-width="1080" data-height="1700" data-layout-allow-overflow>
      <div class="scene">

        <div class="clip data-tag tag-left" id="tagLeft" data-start="0" data-duration="3" data-track-index="1" data-layout-allow-overlap>202家企业</div>

        <div class="clip data-tag tag-right" id="tagRight" data-start="0" data-duration="3" data-track-index="2" data-layout-allow-overlap>440个产品</div>

        <div class="clip sparkle sparkle-amber sparkle-1" id="sparkle1" data-start="0" data-duration="3" data-track-index="3">✦</div>
        <div class="clip sparkle sparkle-amber sparkle-2" id="sparkle2" data-start="0" data-duration="3" data-track-index="4">✧</div>
        <div class="clip sparkle sparkle-amber sparkle-3" id="sparkle3" data-start="0" data-duration="3" data-track-index="5">✦</div>
        <div class="clip sparkle sparkle-blue sparkle-4"  id="sparkle4" data-start="0" data-duration="3" data-track-index="6">✧</div>
        <div class="clip sparkle sparkle-blue sparkle-5"  id="sparkle5" data-start="0" data-duration="3" data-track-index="7">✦</div>
        <div class="clip sparkle sparkle-blue sparkle-6"  id="sparkle6" data-start="0" data-duration="3" data-track-index="8">✧</div>

      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // MVP 渲染兼容：GSAP 用 opacity 控制动画，不需要 visibility:hidden
      document.querySelectorAll('.clip').forEach(function(el) { el.style.visibility = 'visible'; });

      var vars = window.__TEMPLATE_PARAMS || {};
      var textLeft = vars.textLeft || '202家企业';
      var textRight = vars.textRight || '440个产品';
      var theme = vars.theme || 'amber';

      // 单元素赋值（无多层 span，避免重影）
      var tagLeftEl = document.getElementById('tagLeft');
      var tagRightEl = document.getElementById('tagRight');
      tagLeftEl.textContent = textLeft;
      tagRightEl.textContent = textRight;

      // 文字自适应缩放：长文字自动缩小字号，避免溢出
      function fitText(el, maxWidth) {
        // 临时清掉 transform 以测真实宽度
        var prevTransform = el.style.transform;
        el.style.transform = 'none';
        var naturalWidth = el.scrollWidth;
        el.style.transform = prevTransform;
        if (naturalWidth > maxWidth) {
          var currentSize = parseFloat(getComputedStyle(el).fontSize);
          var scale = maxWidth / naturalWidth;
          el.style.fontSize = Math.max(currentSize * scale, 32) + 'px';
        }
      }
      fitText(tagLeftEl, 480);
      fitText(tagRightEl, 480);

      var tl = gsap.timeline({ paused: true });

      // 第一段：左侧数据 · 0.05–0.6s 滑入 + 缩放 0.7→1
      tl.from('#tagLeft', {
        y: -120,
        scale: 0.7,
        opacity: 0,
        duration: 0.55,
        ease: 'back.out(2)'
      }, 0.05);

      // 第一段：右侧数据 · 0.45–1.0s 滑入 + 缩放 0.7→1
      tl.from('#tagRight', {
        y: -120,
        scale: 0.7,
        opacity: 0,
        duration: 0.55,
        ease: 'back.out(2)'
      }, 0.45);

      // 第二段：左侧脉冲 · 0.95–1.1s（scale:1→1.08→1）
      tl.to('#tagLeft', {
        scale: 1.08,
        duration: 0.075,
        ease: 'power2.out'
      }, 0.95);
      tl.to('#tagLeft', {
        scale: 1,
        duration: 0.075,
        ease: 'power2.in'
      }, 1.025);

      // 第二段：右侧脉冲 · 1.05–1.2s（scale:1→1.08→1）
      tl.to('#tagRight', {
        scale: 1.08,
        duration: 0.075,
        ease: 'power2.out'
      }, 1.05);
      tl.to('#tagRight', {
        scale: 1,
        duration: 0.075,
        ease: 'power2.in'
      }, 1.125);

      // 第三段：6 颗星光 · 1.3–1.8s 依次出现 + 呼吸
      var sparkleIds = ['#sparkle1', '#sparkle2', '#sparkle3', '#sparkle4', '#sparkle5', '#sparkle6'];
      var sparkleStartTimes = [1.30, 1.38, 1.46, 1.54, 1.62, 1.70];

      for (var i = 0; i < sparkleIds.length; i++) {
        tl.from(sparkleIds[i], {
          scale: 0,
          opacity: 0,
          rotation: -45,
          duration: 0.3,
          ease: 'back.out(2.5)'
        }, sparkleStartTimes[i]);

        // 呼吸：yoyo 不会在同一时刻对同一属性产生 tween 重叠
        tl.to(sparkleIds[i], {
          opacity: 0.6,
          scale: 1.1,
          duration: 0.4,
          yoyo: true,
          repeat: 1,
          ease: 'sine.inOut'
        }, sparkleStartTimes[i] + 0.35);
      }

      window.__timelines['data-compare'] = tl;
    </script>
<script>
// MVP 渲染桥接：用 progress 驱动 GSAP timeline
window.updateAnimation = function(progress) {
  var keys = Object.keys(window.__timelines || {});
  if (keys.length > 0) {
    window.__timelines[keys[0]].progress(Math.max(0, Math.min(1, progress)));
  }
};
// 初始化到第 0 帧
if (typeof window.updateAnimation === 'function') {
  window.updateAnimation(0);
}
</script>
  </body>
</html>
