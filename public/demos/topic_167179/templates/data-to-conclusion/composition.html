<!DOCTYPE html>
<html lang='zh-CN'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1700">
    <style>
      @font-face {
        font-family: 'PingFang SC';
        src: local('PingFang SC'), local('PingFang SC Bold'), local('PingFang SC Heavy');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: local('Noto Sans SC Black'), local('Noto Sans SC Heavy');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Microsoft YaHei';
        src: local('Microsoft YaHei');
        font-weight: 900;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1700px; overflow: hidden; background: transparent; }
      body { font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-weight: 900; }

      .clip { visibility: hidden; }

      .scene {
        width: 1080px;
        height: 1700px;
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      /* 左侧数据：80px 琥珀金（描边+发光+投影合并到 text-shadow） */
      .data-left {
        position: absolute;
        left: 280px;
        top: 1120px;
        transform: translate(-50%, -50%);
        font-size: 80px;
        letter-spacing: 2px;
        line-height: 1;
        white-space: nowrap;
        text-align: center;
        max-width: 480px;
        color: #fef3c7;
        will-change: transform, opacity, font-size;
        text-shadow:
          -2px  0    0 #78350f,
           2px  0    0 #78350f,
           0   -2px  0 #78350f,
           0    2px  0 #78350f,
           2px  2px  0 rgba(0, 0, 0, 0.4),
           0    0   18px rgba(251, 191, 36, 0.8),
           0    0   45px rgba(245, 158, 11, 0.4);
      }

      /* 右侧数据：80px 科技蓝（无论 theme 始终保持蓝色） */
      .data-right {
        position: absolute;
        left: 800px;
        top: 1300px;
        transform: translate(-50%, -50%);
        font-size: 80px;
        letter-spacing: 2px;
        line-height: 1;
        white-space: nowrap;
        text-align: center;
        max-width: 480px;
        color: #dbeafe;
        will-change: transform, opacity, font-size;
        text-shadow:
          -2px  0    0 #1e3a8a,
           2px  0    0 #1e3a8a,
           0   -2px  0 #1e3a8a,
           0    2px  0 #1e3a8a,
           2px  2px  0 rgba(0, 0, 0, 0.4),
           0    0   18px rgba(96, 165, 250, 0.8),
           0    0   45px rgba(59, 130, 246, 0.4);
      }

      /* 中央结论：140px 主题色（默认琥珀金） */
      .result-text {
        position: absolute;
        left: 50%;
        top: 720px;
        transform: translate(-50%, -50%);
        font-size: 140px;
        letter-spacing: 10px;
        line-height: 1;
        white-space: nowrap;
        text-align: center;
        max-width: 900px;
        will-change: transform, opacity, font-size;
        color: #fef3c7;
        text-shadow:
          -2px  0    0 #78350f,
           2px  0    0 #78350f,
           0   -2px  0 #78350f,
           0    2px  0 #78350f,
           3px  3px  0 rgba(0, 0, 0, 0.45),
           0    0   22px rgba(251, 191, 36, 0.8),
           0    0   55px rgba(245, 158, 11, 0.5);
      }

      body.theme-blue .result-text {
        color: #dbeafe;
        text-shadow:
          -2px  0    0 #1e3a8a,
           2px  0    0 #1e3a8a,
           0   -2px  0 #1e3a8a,
           0    2px  0 #1e3a8a,
           3px  3px  0 rgba(0, 0, 0, 0.45),
           0    0   22px rgba(96, 165, 250, 0.8),
           0    0   55px rgba(59, 130, 246, 0.5);
      }

      /* 三层光环：中心扩散 */
      .ring {
        position: absolute;
        left: 50%;
        top: 720px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        opacity: 0;
        will-change: transform, opacity;
        pointer-events: none;
      }

      .ring-1 { width: 200px; height: 200px; }
      .ring-2 { width: 400px; height: 400px; }
      .ring-3 { width: 600px; height: 600px; }

      body.theme-amber .ring {
        border: 3px solid #f59e0b;
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), inset 0 0 30px rgba(245, 158, 11, 0.2);
      }

      body.theme-blue .ring {
        border: 3px solid #3b82f6;
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.6), inset 0 0 30px rgba(59, 130, 246, 0.2);
      }

      /* 星光装饰 */
      .sparkle {
        position: absolute;
        font-size: 36px;
        opacity: 0;
        will-change: transform, opacity;
        pointer-events: none;
      }

      body.theme-amber .sparkle {
        color: #fef3c7;
        text-shadow:
          0 0 12px rgba(251, 191, 36, 0.9),
          0 0 24px rgba(251, 191, 36, 0.6);
      }

      body.theme-blue .sparkle {
        color: #dbeafe;
        text-shadow:
          0 0 12px rgba(96, 165, 250, 0.9),
          0 0 24px rgba(96, 165, 250, 0.6);
      }

      .sparkle-1 { top: 480px; left: 200px;  font-size: 42px; }
      .sparkle-2 { top: 500px; right: 200px; font-size: 32px; }
      .sparkle-3 { top: 620px; left: 150px;  font-size: 28px; }
      .sparkle-4 { top: 640px; right: 150px; font-size: 38px; }
      .sparkle-5 { top: 540px; left: 380px;  font-size: 24px; }
      .sparkle-6 { top: 560px; right: 380px; font-size: 30px; }
    </style>
  </head>
  <body class="theme-amber">
    <div id="root" data-composition-id="data-to-conclusion" data-start="0" data-duration="3" data-width="1080" data-height="1700" data-layout-allow-overflow>
      <div class="scene">

        <div class="clip ring ring-1" id="ring1" data-start="0" data-duration="3" data-track-index="1"></div>
        <div class="clip ring ring-2" id="ring2" data-start="0" data-duration="3" data-track-index="2"></div>
        <div class="clip ring ring-3" id="ring3" data-start="0" data-duration="3" data-track-index="3"></div>

        <div class="clip data-left" id="textLeft" data-start="0" data-duration="3" data-track-index="4" data-layout-allow-overlap>202家企业</div>

        <div class="clip data-right" id="textRight" data-start="0" data-duration="3" data-track-index="5" data-layout-allow-overlap>440个产品</div>

        <div class="clip result-text" id="textResult" data-start="0" data-duration="3" data-track-index="6" data-layout-allow-overlap>成功中选</div>

        <div class="clip sparkle sparkle-1" id="sparkle1" data-start="0" data-duration="3" data-track-index="7">✦</div>
        <div class="clip sparkle sparkle-2" id="sparkle2" data-start="0" data-duration="3" data-track-index="8">✧</div>
        <div class="clip sparkle sparkle-3" id="sparkle3" data-start="0" data-duration="3" data-track-index="9">✦</div>
        <div class="clip sparkle sparkle-4" id="sparkle4" data-start="0" data-duration="3" data-track-index="10">✧</div>
        <div class="clip sparkle sparkle-5" id="sparkle5" data-start="0" data-duration="3" data-track-index="11">✦</div>
        <div class="clip sparkle sparkle-6" id="sparkle6" data-start="0" data-duration="3" data-track-index="12">✧</div>

      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // MVP 渲染兼容：GSAP 用 opacity 控制动画，不需要 visibility:hidden
      document.querySelectorAll('.clip').forEach(function(el) { el.style.visibility = 'visible'; });

      var vars = window.__TEMPLATE_PARAMS || {};
      var textLeft = vars.textLeft || '202家企业';
      var textRight = vars.textRight || '440个产品';
      var textResult = vars.textResult || '成功中选';
      var theme = vars.theme || 'amber';

      document.body.className = 'theme-' + theme;

      document.getElementById('textLeft').textContent = textLeft;
      document.getElementById('textRight').textContent = textRight;
      document.getElementById('textResult').textContent = textResult;

      // 文字自适应缩放：长文字自动缩小字号
      function fitText(el, maxWidth) {
        var prevTransform = el.style.transform;
        el.style.transform = 'none';
        var naturalWidth = el.scrollWidth;
        el.style.transform = prevTransform;
        if (naturalWidth > maxWidth) {
          var currentSize = parseFloat(getComputedStyle(el).fontSize);
          var scale = maxWidth / naturalWidth;
          el.style.fontSize = Math.max(currentSize * scale, 32) + 'px';
        }
      }
      fitText(document.getElementById('textLeft'), 480);
      fitText(document.getElementById('textRight'), 480);
      fitText(document.getElementById('textResult'), 900);

      var tl = gsap.timeline({ paused: true });

      // 第一段 (0.05-0.7s): 左侧数据从上方弹入
      tl.from('#textLeft', {
        y: -100,
        scale: 0.6,
        opacity: 0,
        duration: 0.65,
        ease: 'back.out(2)'
      }, 0.05);

      // 第二段 (0.45-1.1s): 右侧数据从上方弹入
      tl.from('#textRight', {
        y: -100,
        scale: 0.6,
        opacity: 0,
        duration: 0.65,
        ease: 'back.out(2)'
      }, 0.45);

      // 第三段前半 (1.4-1.7s): 三层光环从中心扩散
      // fromTo 让光环从小变大并变可见
      tl.fromTo('#ring1',
        { scale: 0.1, opacity: 0 },
        { scale: 1, opacity: 0.7, duration: 0.25, ease: 'power3.out' },
        1.4
      );
      tl.fromTo('#ring2',
        { scale: 0.1, opacity: 0 },
        { scale: 1, opacity: 0.5, duration: 0.25, ease: 'power3.out' },
        1.45
      );
      tl.fromTo('#ring3',
        { scale: 0.1, opacity: 0 },
        { scale: 1, opacity: 0.4, duration: 0.25, ease: 'power3.out' },
        1.5
      );
      // 0.05s 间隔后, to 让光环继续扩散并淡出（与 fromTo 在 scale 上不重叠）
      tl.to('#ring1', {
        scale: 2.2,
        opacity: 0,
        duration: 0.4,
        ease: 'power2.out'
      }, 1.7);
      tl.to('#ring2', {
        scale: 1.6,
        opacity: 0,
        duration: 0.4,
        ease: 'power2.out'
      }, 1.75);
      tl.to('#ring3', {
        scale: 1.2,
        opacity: 0,
        duration: 0.4,
        ease: 'power2.out'
      }, 1.8);

      // 第三段后半 (1.55-2.4s): 中央结论从下方弹入
      tl.from('#textResult', {
        y: 100,
        scale: 0.3,
        opacity: 0,
        duration: 0.85,
        ease: 'back.out(2.5)'
      }, 1.55);

      // 装饰 (1.7-2.7s): 6 个星光依次闪烁
      var sparkleIds = ['#sparkle1', '#sparkle2', '#sparkle3', '#sparkle4', '#sparkle5', '#sparkle6'];
      var sparkleStartTimes = [1.7, 1.78, 1.86, 1.94, 2.02, 2.1];

      for (var i = 0; i < sparkleIds.length; i++) {
        tl.fromTo(sparkleIds[i],
          { scale: 0, opacity: 0, rotation: -45 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.2, ease: 'back.out(2.5)' },
          sparkleStartTimes[i]
        );

        tl.to(sparkleIds[i], {
          opacity: 0.4,
          duration: 0.2,
          yoyo: true,
          repeat: 1,
          ease: 'sine.inOut'
        }, sparkleStartTimes[i] + 0.3);
      }

      window.__timelines['data-to-conclusion'] = tl;
    </script>
<script>
// MVP 渲染桥接：用 progress 驱动 GSAP timeline
window.updateAnimation = function(progress) {
  var keys = Object.keys(window.__timelines || {});
  if (keys.length > 0) {
    window.__timelines[keys[0]].progress(Math.max(0, Math.min(1, progress)));
  }
};
// 初始化到第 0 帧
if (typeof window.updateAnimation === 'function') {
  window.updateAnimation(0);
}
</script>
  </body>
</html>
