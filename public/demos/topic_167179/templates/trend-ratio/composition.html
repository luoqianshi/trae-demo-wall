<!DOCTYPE html>
<html lang='zh-CN'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1700">
  <title>趋势/比例数据 · 金标准模板</title>
  <style>
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'), local('PingFang SC Heavy'), local('PingFang SC Bold'); font-weight: 900; }
    @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC Black'), local('Noto Sans SC Heavy'); font-weight: 900; }
    @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); font-weight: 900; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1700px; overflow: hidden; background: transparent; }
    body { font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-weight: 900; }
    .clip { visibility: hidden; }
    .scene { width: 1080px; height: 1700px; position: relative; overflow: hidden; }

    /* ==== SVG 圆环容器（y: 380px, 200x200，中心 480） ==== */
    .ring-wrapper {
      position: absolute;
      left: 50%;
      top: 380px;
      transform: translate(-50%, 0);
      width: 200px;
      height: 200px;
      will-change: transform, opacity;
    }
    .ring-wrapper svg { width: 100%; height: 100%; overflow: visible; }

    /* ==== 趋势箭头（y: 480px，圆环中心，80px 字符） ==== */
    .trend-arrow {
      position: absolute;
      left: 50%;
      top: 480px;
      transform: translate(-50%, -50%);
      font-size: 80px;
      line-height: 1;
      font-weight: 900;
      will-change: transform, opacity;
    }
    body.trend-up .trend-arrow {
      color: #22c55e;
      text-shadow:
        -2px  0    0 #14532d,
         2px  0    0 #14532d,
         0   -2px  0 #14532d,
         0    2px  0 #14532d,
         0    0   25px rgba(34, 197, 94, 0.7);
    }
    body.trend-down .trend-arrow {
      color: #ef4444;
      text-shadow:
        -2px  0    0 #7f1d1d,
         2px  0    0 #7f1d1d,
         0   -2px  0 #7f1d1d,
         0    2px  0 #7f1d1d,
         0    0   25px rgba(239, 68, 68, 0.7);
    }
    body.trend-flat .trend-arrow {
      color: #94a3b8;
      text-shadow:
        -2px  0    0 #334155,
         2px  0    0 #334155,
         0   -2px  0 #334155,
         0    2px  0 #334155,
         0    0   20px rgba(148, 163, 184, 0.6);
    }

    /* ==== 主数字（y: 750px, 130px, 单元素 + text-shadow 描边+发光+投影） ==== */
    .main-number {
      position: absolute;
      left: 50%;
      top: 750px;
      transform: translate(-50%, -50%);
      font-size: 130px;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
      font-weight: 900;
      color: #fef3c7;
      text-shadow:
        -2px  0    0 #78350f,
         2px  0    0 #78350f,
         0   -2px  0 #78350f,
         0    2px  0 #78350f,
         2px  2px  0 rgba(0, 0, 0, 0.45),
         0    0   20px rgba(251, 191, 36, 0.8),
         0    0   50px rgba(245, 158, 11, 0.5);
      will-change: transform, opacity;
    }
    body.theme-blue .main-number {
      color: #dbeafe;
      text-shadow:
        -2px  0    0 #1e3a8a,
         2px  0    0 #1e3a8a,
         0   -2px  0 #1e3a8a,
         0    2px  0 #1e3a8a,
         2px  2px  0 rgba(0, 0, 0, 0.45),
         0    0   16px rgba(96, 165, 250, 0.7),
         0    0   40px rgba(59, 130, 246, 0.5);
    }

    /* ==== 副文本（y: 920px, 44px, 简化描边） ==== */
    .sub-text {
      position: absolute;
      left: 50%;
      top: 920px;
      transform: translate(-50%, -50%);
      font-size: 44px;
      letter-spacing: 6px;
      line-height: 1;
      white-space: nowrap;
      font-weight: 900;
      color: #fef3c7;
      text-shadow:
        -1.5px 0   0 #78350f,
         1.5px 0   0 #78350f,
         0   -1.5px 0 #78350f,
         0    1.5px 0 #78350f,
         2px  2px  0 rgba(0, 0, 0, 0.4),
         0    0   12px rgba(251, 191, 36, 0.7),
         0    0   30px rgba(245, 158, 11, 0.4);
      will-change: transform, opacity;
    }
    body.theme-blue .sub-text {
      color: #dbeafe;
      text-shadow:
        -1.5px 0   0 #1e3a8a,
         1.5px 0   0 #1e3a8a,
         0   -1.5px 0 #1e3a8a,
         0    1.5px 0 #1e3a8a,
         2px  2px  0 rgba(0, 0, 0, 0.4),
         0    0   12px rgba(96, 165, 250, 0.7),
         0    0   30px rgba(59, 130, 246, 0.4);
    }

    /* ==== 星光装饰 ==== */
    .sparkle {
      position: absolute;
      font-size: 32px;
      opacity: 0;
      will-change: transform, opacity;
    }
    body.theme-amber .sparkle {
      color: #fef3c7;
      text-shadow:
        0 0 12px rgba(251, 191, 36, 0.9),
        0 0 24px rgba(251, 191, 36, 0.6);
    }
    body.theme-blue .sparkle {
      color: #dbeafe;
      text-shadow:
        0 0 12px rgba(96, 165, 250, 0.9),
        0 0 24px rgba(96, 165, 250, 0.6);
    }
    .sparkle-1 { top: 320px; left: 200px; font-size: 42px; }
    .sparkle-2 { top: 340px; right: 180px; font-size: 34px; }
    .sparkle-3 { top: 600px; left: 160px; font-size: 30px; }
    .sparkle-4 { top: 620px; right: 180px; font-size: 38px; }
    .sparkle-5 { top: 240px; left: 480px; font-size: 26px; }
    .sparkle-6 { top: 1040px; right: 280px; font-size: 30px; }
  </style>
</head>
<body class="theme-amber trend-up">
  <div id="root" data-composition-id="trend-ratio" data-start="0" data-duration="3" data-width="1080" data-height="1700" data-layout-allow-overflow>
    <div class="scene">

      <!-- 真实 SVG 圆环（半径 80px, stroke 8px, 主题色） -->
      <div class="clip ring-wrapper" id="ringWrapper" data-start="0" data-duration="3" data-track-index="1">
        <svg viewBox="0 0 200 200" width="200" height="200">
          <circle class="ring-bg" cx="100" cy="100" r="80" fill="none" stroke-width="8" stroke-linecap="round" />
          <circle class="ring-fg" id="progressCircle" cx="100" cy="100" r="80" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="502" stroke-dashoffset="502" transform="rotate(-90 100 100)" />
        </svg>
      </div>

      <!-- 趋势箭头（80px, 颜色由 trendDirection 决定） -->
      <div class="clip trend-arrow" id="trendArrow" data-start="0" data-duration="3" data-track-index="2">↑</div>

      <!-- 主数字（130px, 单元素 text-shadow 描边+发光+投影） -->
      <div class="clip main-number" id="mainNumber" data-start="0" data-duration="3" data-track-index="3">+15.8%</div>

      <!-- 副文本（44px, 单元素 text-shadow 描边+发光+投影） -->
      <div class="clip sub-text" id="subText" data-start="0" data-duration="3" data-track-index="4">较上季度</div>

      <!-- 6 个星光 -->
      <div class="clip sparkle sparkle-1" id="sparkle1" data-start="0" data-duration="3" data-track-index="5">✦</div>
      <div class="clip sparkle sparkle-2" id="sparkle2" data-start="0" data-duration="3" data-track-index="6">✧</div>
      <div class="clip sparkle sparkle-3" id="sparkle3" data-start="0" data-duration="3" data-track-index="7">✦</div>
      <div class="clip sparkle sparkle-4" id="sparkle4" data-start="0" data-duration="3" data-track-index="8">✧</div>
      <div class="clip sparkle sparkle-5" id="sparkle5" data-start="0" data-duration="3" data-track-index="9">✦</div>
      <div class="clip sparkle sparkle-6" id="sparkle6" data-start="0" data-duration="3" data-track-index="10">✧</div>

    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};

    // MVP 渲染兼容：GSAP 用 opacity 控制动画，不需要 visibility:hidden
    document.querySelectorAll('.clip').forEach(function(el) { el.style.visibility = 'visible'; });

    var vars = window.__TEMPLATE_PARAMS || {};
    var mainNumber = vars.mainNumber || '+15.8%';
    var subText = vars.subText || '较上季度';
    var trendDirection = vars.trendDirection || 'up';
    var theme = vars.theme || 'amber';

    document.body.className = 'theme-' + theme + ' trend-' + trendDirection;

    // 动态设置箭头字符
    var trendArrowEl = document.getElementById('trendArrow');
    if (trendDirection === 'up') {
      trendArrowEl.textContent = '↑';
    } else if (trendDirection === 'down') {
      trendArrowEl.textContent = '↓';
    } else {
      trendArrowEl.textContent = '→';
    }

    // 注入变量值到文字元素
    document.getElementById('mainNumber').textContent = mainNumber;
    document.getElementById('subText').textContent = subText;

    // 文字自适应缩放：避免溢出
    function fitText(el, maxWidth) {
      var prevTransform = el.style.transform;
      el.style.transform = 'none';
      var naturalWidth = el.scrollWidth;
      el.style.transform = prevTransform;
      if (naturalWidth > maxWidth) {
        var currentSize = parseFloat(getComputedStyle(el).fontSize);
        var scale = maxWidth / naturalWidth;
        el.style.fontSize = Math.max(currentSize * scale, 32) + 'px';
      }
    }
    fitText(document.getElementById('mainNumber'), 700);
    fitText(document.getElementById('subText'), 600);

    // 圆环颜色（由主题决定，背景圈半透明，前景圈实色发光）
    var ringFg = document.getElementById('progressCircle');
    var ringBg = document.querySelector('.ring-bg');
    if (theme === 'amber') {
      ringBg.setAttribute('stroke', 'rgba(245, 158, 11, 0.2)');
      ringFg.setAttribute('stroke', '#fbbf24');
      ringFg.style.filter = 'drop-shadow(0 0 12px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 28px rgba(245, 158, 11, 0.6))';
    } else {
      ringBg.setAttribute('stroke', 'rgba(59, 130, 246, 0.2)');
      ringFg.setAttribute('stroke', '#60a5fa');
      ringFg.style.filter = 'drop-shadow(0 0 12px rgba(96, 165, 250, 0.9)) drop-shadow(0 0 28px rgba(59, 130, 246, 0.6))';
    }

    // 圆环周长（r=80 → 2π·80 ≈ 502.65）
    var circumference = 2 * Math.PI * 80; // ≈ 502.65

    var tl = gsap.timeline({ paused: true });

    // ==== 第一段（0.1-0.5s）：SVG 圆环 stroke-dashoffset 绘制 ====
    tl.fromTo('#ringWrapper',
      { scale: 0.3, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' },
      0.1
    );
    tl.fromTo('#progressCircle',
      { strokeDashoffset: circumference },
      { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' },
      0.1
    );

    // ==== 第二段（0.3-0.7s）：趋势箭头弹入 ====
    tl.from('#trendArrow', {
      scale: 0.3,
      opacity: 0,
      duration: 0.4,
      ease: 'back.out(2.5)'
    }, 0.3);

    // ==== 第三段（0.5-1.0s）：主数字弹入 ====
    tl.from('#mainNumber', {
      scale: 0.3,
      opacity: 0,
      y: 60,
      duration: 0.5,
      ease: 'back.out(2.2)'
    }, 0.5);

    // ==== 第四段（0.9-1.3s）：副文本淡入 ====
    tl.from('#subText', {
      y: 30,
      opacity: 0,
      duration: 0.4,
      ease: 'power3.out'
    }, 0.9);

    // ==== 第五段（1.2-1.8s）：4-6 个星光依次出现 ====
    var sparkleIds = ['#sparkle1', '#sparkle2', '#sparkle3', '#sparkle4', '#sparkle5', '#sparkle6'];
    var sparkleStartTimes = [1.2, 1.32, 1.44, 1.56, 1.68, 1.8];
    for (var i = 0; i < sparkleIds.length; i++) {
      tl.from(sparkleIds[i], {
        scale: 0,
        opacity: 0,
        rotation: -45,
        duration: 0.3,
        ease: 'back.out(2.5)'
      }, sparkleStartTimes[i]);
    }

    window.__timelines['trend-ratio'] = tl;
  </script>
<script>
// MVP 渲染桥接：用 progress 驱动 GSAP timeline
window.updateAnimation = function(progress) {
  var keys = Object.keys(window.__timelines || {});
  if (keys.length > 0) {
    window.__timelines[keys[0]].progress(Math.max(0, Math.min(1, progress)));
  }
};
// 初始化到第 0 帧
if (typeof window.updateAnimation === 'function') {
  window.updateAnimation(0);
}
</script>
</body>
</html>
