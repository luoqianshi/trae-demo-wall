<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1700">
<title>单一核心数据 · 金标准模板</title>
<style>
  @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'), local('PingFang SC Heavy'); font-weight: 900; }
  @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC Black'), local('Noto Sans SC Heavy'); font-weight: 900; }
  @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); font-weight: 900; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1700px; overflow: hidden; background: transparent; }
  body { font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-weight: 900; }
  .clip { visibility: hidden; }
  .scene { width: 1080px; height: 1700px; position: relative; overflow: hidden; }

  /* 主数字（一个 element 自带描边+发光） */
  .main-number {
    position: absolute;
    left: 50%;
    top: 540px;
    transform: translate(-50%, -50%);
    font-size: 156px;
    letter-spacing: 4px;
    line-height: 1;
    white-space: nowrap;
    font-weight: 900;
    color: #fef3c7;
    text-shadow:
      /* 描边（8 方向） */
      -3px -3px 0 #78350f,
       3px -3px 0 #78350f,
      -3px  3px 0 #78350f,
       3px  3px 0 #78350f,
      -2px  0    0 #78350f,
       2px  0    0 #78350f,
       0   -2px  0 #78350f,
       0    2px  0 #78350f,
      /* 硬投影（立体感） */
       4px  4px  0 rgba(0, 0, 0, 0.4),
      /* 外发光 */
       0    0   16px rgba(251, 191, 36, 0.7),
       0    0   36px rgba(245, 158, 11, 0.5),
       0    0   70px rgba(217, 119, 6, 0.3);
    will-change: transform, opacity;
  }
  body.theme-blue .main-number {
    color: #dbeafe;
    text-shadow:
      -3px -3px 0 #1e3a8a,
       3px -3px 0 #1e3a8a,
      -3px  3px 0 #1e3a8a,
       3px  3px 0 #1e3a8a,
      -2px  0    0 #1e3a8a,
       2px  0    0 #1e3a8a,
       0   -2px  0 #1e3a8a,
       0    2px  0 #1e3a8a,
       4px  4px  0 rgba(0, 0, 0, 0.4),
       0    0   16px rgba(96, 165, 250, 0.7),
       0    0   36px rgba(59, 130, 246, 0.5),
       0    0   70px rgba(37, 99, 235, 0.3);
  }

  /* 副文本 */
  .sub-text {
    position: absolute;
    left: 50%;
    top: 720px;
    transform: translate(-50%, -50%);
    font-size: 48px;
    letter-spacing: 6px;
    line-height: 1;
    white-space: nowrap;
    font-weight: 900;
    color: #fef3c7;
    text-shadow:
      -2px -2px 0 #78350f,
       2px -2px 0 #78350f,
      -2px  2px 0 #78350f,
       2px  2px 0 #78350f,
      -1.5px 0   0 #78350f,
       1.5px 0   0 #78350f,
       0   -1.5px 0 #78350f,
       0    1.5px 0 #78350f,
       2px  2px  0 rgba(0, 0, 0, 0.35),
       0    0   10px rgba(251, 191, 36, 0.6),
       0    0   24px rgba(245, 158, 11, 0.3);
    will-change: transform, opacity;
  }
  body.theme-blue .sub-text {
    color: #dbeafe;
    text-shadow:
      -2px -2px 0 #1e3a8a,
       2px -2px 0 #1e3a8a,
      -2px  2px 0 #1e3a8a,
       2px  2px 0 #1e3a8a,
      -1.5px 0   0 #1e3a8a,
       1.5px 0   0 #1e3a8a,
       0   -1.5px 0 #1e3a8a,
       0    1.5px 0 #1e3a8a,
       2px  2px  0 rgba(0, 0, 0, 0.35),
       0    0   10px rgba(96, 165, 250, 0.6),
       0    0   24px rgba(59, 130, 246, 0.3);
  }

  /* 光环 */
  .ring {
    position: absolute;
    left: 50%;
    top: 540px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid #fbbf24;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
    opacity: 0;
    will-change: transform, opacity;
  }
  body.theme-blue .ring { border-color: #93c5fd; box-shadow: 0 0 20px rgba(147, 197, 253, 0.5); }
  .ring-1 { width: 380px; height: 380px; }
  .ring-2 { width: 560px; height: 560px; }
  .ring-3 { width: 760px; height: 760px; }

  /* 星光 */
  .sparkle {
    position: absolute;
    font-size: 32px;
    color: #fbbf24;
    text-shadow: 0 0 10px #fbbf24, 0 0 20px rgba(251, 191, 36, 0.5);
    opacity: 0;
    will-change: transform, opacity;
  }
  body.theme-blue .sparkle { color: #93c5fd; text-shadow: 0 0 10px #93c5fd, 0 0 20px rgba(147, 197, 253, 0.5); }
  .sparkle-1 { top: 380px; left: 240px; font-size: 38px; }
  .sparkle-2 { top: 400px; right: 220px; font-size: 32px; }
  .sparkle-3 { top: 700px; left: 180px; font-size: 28px; }
  .sparkle-4 { top: 720px; right: 200px; font-size: 34px; }
  .sparkle-5 { top: 280px; left: 480px; font-size: 24px; }
  .sparkle-6 { top: 300px; right: 460px; font-size: 30px; }
</style>
</head>
<body class="theme-amber">
  <div id="root" data-composition-id="single-stat" data-start="0" data-duration="3" data-width="1080" data-height="1700" data-layout-allow-overflow>
    <div class="scene">

      <div class="clip ring ring-1" id="ring1" data-start="0" data-duration="3" data-track-index="1"></div>
      <div class="clip ring ring-2" id="ring2" data-start="0" data-duration="3" data-track-index="2"></div>
      <div class="clip ring ring-3" id="ring3" data-start="0" data-duration="3" data-track-index="3"></div>

      <div class="clip main-number" id="mainNumber" data-start="0" data-duration="3" data-track-index="4">3.2%</div>

      <div class="clip sub-text" id="subText" data-start="0" data-duration="3" data-track-index="5">同比增长</div>

      <div class="clip sparkle sparkle-1" id="sparkle1" data-start="0" data-duration="3" data-track-index="6">✦</div>
      <div class="clip sparkle sparkle-2" id="sparkle2" data-start="0" data-duration="3" data-track-index="7">✧</div>
      <div class="clip sparkle sparkle-3" id="sparkle3" data-start="0" data-duration="3" data-track-index="8">✦</div>
      <div class="clip sparkle sparkle-4" id="sparkle4" data-start="0" data-duration="3" data-track-index="9">✧</div>
      <div class="clip sparkle sparkle-5" id="sparkle5" data-start="0" data-duration="3" data-track-index="10">✦</div>
      <div class="clip sparkle sparkle-6" id="sparkle6" data-start="0" data-duration="3" data-track-index="11">✧</div>

    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};

    // MVP 渲染兼容：GSAP 用 opacity 控制动画，不需要 visibility:hidden
    document.querySelectorAll('.clip').forEach(function(el) { el.style.visibility = 'visible'; });

    var vars = window.__TEMPLATE_PARAMS || {};
    var mainNumber = vars.mainNumber || '3.2%';
    var subText = vars.subText || '同比增长';
    var theme = vars.theme || 'amber';

    document.body.className = 'theme-' + theme;
    document.getElementById('mainNumber').textContent = mainNumber;
    document.getElementById('subText').textContent = subText;

    // 文字自适应缩放：避免溢出
    function fitText(el, maxWidth) {
      var prevTransform = el.style.transform;
      el.style.transform = 'none';
      var naturalWidth = el.scrollWidth;
      el.style.transform = prevTransform;
      if (naturalWidth > maxWidth) {
        var currentSize = parseFloat(getComputedStyle(el).fontSize);
        var scale = maxWidth / naturalWidth;
        el.style.fontSize = Math.max(currentSize * scale, 36) + 'px';
      }
    }
    fitText(document.getElementById('mainNumber'), 900);
    fitText(document.getElementById('subText'), 800);

    var tl = gsap.timeline({ paused: true });

    // 第一段：光环扩散
    tl.from('#ring1', { scale: 0.2, opacity: 0, duration: 0.4, ease: 'power3.out' }, 0.1);
    tl.from('#ring2', { scale: 0.2, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.15);
    tl.from('#ring3', { scale: 0.2, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
    tl.to('#ring1', { scale: 1.3, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.6);
    tl.to('#ring2', { scale: 1.25, opacity: 0, duration: 0.55, ease: 'power2.out' }, 0.7);
    tl.to('#ring3', { scale: 1.2, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.8);

    // 第二段：主数字弹入
    tl.from('#mainNumber', { scale: 0.3, opacity: 0, y: 60, duration: 0.7, ease: 'back.out(2)' }, 0.3);
    tl.to('#mainNumber', { scale: 1.08, duration: 0.15, ease: 'power2.out' }, 1.05);
    tl.to('#mainNumber', { scale: 1, duration: 0.25, ease: 'elastic.out(1, 0.4)' }, 1.2);

    // 第三段：副文本
    tl.from('#subText', { y: 30, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.9);

    // 装饰：星光闪烁
    var sparkleIds = ['#sparkle1', '#sparkle2', '#sparkle3', '#sparkle4', '#sparkle5', '#sparkle6'];
    var sparkleStartTimes = [1.3, 1.35, 1.4, 1.45, 1.5, 1.55];
    for (var i = 0; i < sparkleIds.length; i++) {
      tl.from(sparkleIds[i], {
        scale: 0, opacity: 0, rotation: -45, duration: 0.3, ease: 'back.out(2.5)'
      }, sparkleStartTimes[i]);
      tl.to(sparkleIds[i], {
        opacity: 0.7, scale: 1.1, duration: 0.4, yoyo: true, repeat: 2, ease: 'sine.inOut'
      }, sparkleStartTimes[i] + 0.3);
    }

    window.__timelines['single-stat'] = tl;
  </script>
<script>
// MVP 渲染桥接：用 progress 驱动 GSAP timeline
window.updateAnimation = function(progress) {
  var keys = Object.keys(window.__timelines || {});
  if (keys.length > 0) {
    window.__timelines[keys[0]].progress(Math.max(0, Math.min(1, progress)));
  }
};
// 初始化到第 0 帧
if (typeof window.updateAnimation === 'function') {
  window.updateAnimation(0);
}
</script>
</body>
</html>
