<!DOCTYPE html>
<html lang='zh-CN'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1700">
    <style>
      /* ===== 字体声明 ===== */
      @font-face {
        font-family: 'PingFang SC';
        src: local('PingFang SC'), local('PingFang SC Heavy'), local('PingFang SC Bold');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: local('Noto Sans SC Black'), local('Noto Sans SC Heavy');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Microsoft YaHei';
        src: local('Microsoft YaHei');
        font-weight: 900;
      }

      /* ===== 画布基础 ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1700px;
        overflow: hidden;
        background: transparent;
        font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        font-weight: 900;
      }

      .clip { visibility: hidden; }
      .scene { width: 1080px; height: 1700px; position: relative; overflow: hidden; background: transparent; }

      /* ============================================================
         左侧装饰竖线（主题色渐变 + 发光）
         ============================================================ */
      .vertical-line {
        position: absolute;
        left: 200px;
        top: 1020px;
        width: 6px;
        height: 260px;
        border-radius: 0;
        will-change: transform, opacity;
        transform-origin: top center;
      }

      body.theme-amber .vertical-line {
        background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 50%, #b45309 100%);
        box-shadow:
          0 0 6px rgba(251, 191, 36, 0.7),
          0 0 16px rgba(245, 158, 11, 0.4);
      }

      body.theme-blue .vertical-line {
        background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 50%, #1e40af 100%);
        box-shadow:
          0 0 6px rgba(96, 165, 250, 0.7),
          0 0 16px rgba(59, 130, 246, 0.4);
      }

      /* ============================================================
         装饰引号（衬线大字）
         ============================================================ */
      .quote-mark {
        position: absolute;
        left: 220px;
        top: 1000px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 80px;
        font-weight: 900;
        line-height: 1;
        will-change: transform, opacity;
      }

      body.theme-amber .quote-mark {
        color: rgba(251, 191, 36, 0.55);
        text-shadow:
          0 0 18px rgba(251, 191, 36, 0.55),
          0 0 40px rgba(245, 158, 11, 0.35);
      }

      body.theme-blue .quote-mark {
        color: rgba(96, 165, 250, 0.55);
        text-shadow:
          0 0 18px rgba(96, 165, 250, 0.55),
          0 0 40px rgba(59, 130, 246, 0.35);
      }

      /* ============================================================
         引语文字（单层，text-shadow 合并描边+发光+投影）
         ============================================================ */
      .quote-text {
        position: absolute;
        left: 280px;
        top: 1120px;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: 4px;
        line-height: 1.15;
        white-space: normal;
        max-width: 720px;
        word-break: break-word;
        will-change: transform, opacity, font-size;
      }

      body.theme-amber .quote-text {
        color: #fef3c7;
        text-shadow:
          -2px  0    0 #78350f,
           2px  0    0 #78350f,
           0   -2px  0 #78350f,
           0    2px  0 #78350f,
           2px  2px  0 rgba(0, 0, 0, 0.4),
           0    0   10px rgba(251, 191, 36, 0.7),
           0    0   24px rgba(245, 158, 11, 0.35);
      }

      body.theme-blue .quote-text {
        color: #dbeafe;
        text-shadow:
          -2px  0    0 #1e3a8a,
           2px  0    0 #1e3a8a,
           0   -2px  0 #1e3a8a,
           0    2px  0 #1e3a8a,
           2px  2px  0 rgba(0, 0, 0, 0.4),
           0    0   10px rgba(96, 165, 250, 0.7),
           0    0   24px rgba(59, 130, 246, 0.35);
      }

      /* ============================================================
         说话人（单层，6 方向小描边 + 投影 + 发光）
         ============================================================ */
      .speaker-text {
        position: absolute;
        left: 280px;
        top: 1230px;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1;
        white-space: nowrap;
        max-width: 720px;
        will-change: transform, opacity, font-size;
      }

      body.theme-amber .speaker-text {
        color: #fde68a;
        text-shadow:
          -1.5px  0    0 #78350f,
           1.5px  0    0 #78350f,
           0   -1.5px  0 #78350f,
           0    1.5px  0 #78350f,
           2px  2px  0 rgba(0, 0, 0, 0.35),
           0    0   12px rgba(251, 191, 36, 0.6);
      }

      body.theme-blue .speaker-text {
        color: #bfdbfe;
        text-shadow:
          -1.5px  0    0 #1e3a8a,
           1.5px  0    0 #1e3a8a,
           0   -1.5px  0 #1e3a8a,
           0    1.5px  0 #1e3a8a,
           2px  2px  0 rgba(0, 0, 0, 0.35),
           0    0   12px rgba(96, 165, 250, 0.6);
      }

      /* ============================================================
         星光装饰
         ============================================================ */
      .sparkle {
        position: absolute;
        opacity: 0;
        will-change: transform, opacity;
        pointer-events: none;
      }

      body.theme-amber .sparkle {
        color: #fef3c7;
        text-shadow:
          0 0 10px rgba(251, 191, 36, 0.95),
          0 0 22px rgba(251, 191, 36, 0.6),
          0 0 40px rgba(245, 158, 11, 0.3);
      }

      body.theme-blue .sparkle {
        color: #dbeafe;
        text-shadow:
          0 0 10px rgba(96, 165, 250, 0.95),
          0 0 22px rgba(96, 165, 250, 0.6),
          0 0 40px rgba(59, 130, 246, 0.3);
      }

      .sparkle-1 { top: 980px;  left: 180px;  font-size: 28px; }
      .sparkle-2 { top: 1010px; right: 240px; font-size: 36px; }
      .sparkle-3 { top: 1280px; left: 620px;  font-size: 24px; }
      .sparkle-4 { top: 1170px; right: 280px; font-size: 30px; }
    </style>
  </head>
  <body class="theme-amber">
    <div id="root" data-composition-id="quote-callout" data-start="0" data-duration="3" data-width="1080" data-height="1700" data-layout-allow-overflow>
      <div class="scene">

        <!-- 左侧装饰竖线 -->
        <div class="clip vertical-line" id="verticalLine" data-start="0" data-duration="3" data-track-index="1"></div>

        <!-- 装饰引号 -->
        <div class="clip quote-mark" id="quoteMark" data-start="0" data-duration="3" data-track-index="2" data-layout-allow-overlap>"</div>

        <!-- 引语文字（单层） -->
        <div class="clip quote-text" id="quoteTextEl" data-start="0" data-duration="3" data-track-index="3" data-layout-allow-overlap>科技创新是第一动力</div>

        <!-- 说话人（单层） -->
        <div class="clip speaker-text" id="speakerTextEl" data-start="0" data-duration="3" data-track-index="4" data-layout-allow-overlap>——专家表示</div>

        <!-- 4 个星光装饰 -->
        <div class="clip sparkle sparkle-1" id="sparkle1" data-start="0" data-duration="3" data-track-index="5">✦</div>
        <div class="clip sparkle sparkle-2" id="sparkle2" data-start="0" data-duration="3" data-track-index="6">✧</div>
        <div class="clip sparkle sparkle-3" id="sparkle3" data-start="0" data-duration="3" data-track-index="7">✦</div>
        <div class="clip sparkle sparkle-4" id="sparkle4" data-start="0" data-duration="3" data-track-index="8">✧</div>

      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // MVP 渲染兼容：GSAP 用 opacity 控制动画，不需要 visibility:hidden
      document.querySelectorAll('.clip').forEach(function(el) { el.style.visibility = 'visible'; });

      // 读取变量
      var vars = window.__TEMPLATE_PARAMS || {};
      var quoteText = vars.quoteText || '科技创新是第一动力';
      var speaker   = vars.speaker   || '专家表示';
      var theme     = vars.theme     || 'amber';

      // 应用主题
      document.body.className = 'theme-' + theme;

      // 注入文本（单层元素，直接 setTextContent）
      function setText(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }
      setText('quoteTextEl',   quoteText);
      setText('speakerTextEl', '——' + speaker);

      // 文字自适应缩放：超过 maxWidth 时自动缩小字号
      function fitText(el, maxWidth) {
        var prevTransform = el.style.transform;
        el.style.transform = 'none';
        var naturalWidth = el.scrollWidth;
        el.style.transform = prevTransform;
        if (naturalWidth > maxWidth) {
          var currentSize = parseFloat(getComputedStyle(el).fontSize);
          var scale = maxWidth / naturalWidth;
          el.style.fontSize = Math.max(currentSize * scale, 24) + 'px';
        }
      }
      fitText(document.getElementById('quoteTextEl'), 720);
      fitText(document.getElementById('speakerTextEl'), 720);

      // 动态调整说话人位置：如果引语换行成多行，说话人跟着下移避免重叠
      (function adjustSpeaker() {
        var quoteEl = document.getElementById('quoteTextEl');
        var speakerEl = document.getElementById('speakerTextEl');
        if (!quoteEl || !speakerEl) return;
        var quoteTop = 1120;
        var quoteH = quoteEl.offsetHeight;
        var baseGap = 30; // 引语底部到说话人顶部的间距
        var newTop = quoteTop + quoteH + baseGap;
        // 保证不小于原 1230px（一行情况下保持原位置感）
        speakerEl.style.top = Math.max(1230, newTop) + 'px';
      })();

      // 构建时间线
      var tl = gsap.timeline({ paused: true });

      // 0.05 - 0.30 左侧竖线从上方滑入（scaleY 0→1 + y 偏移 + 透明度）
      tl.from('#verticalLine', {
        y: -60,
        opacity: 0,
        scaleY: 0,
        duration: 0.25,
        ease: 'power3.out'
      }, 0.05);

      // 0.20 - 0.70 装饰引号从左上方弹入（缩放 + 旋转 + 透明度）
      tl.from('#quoteMark', {
        x: -30,
        y: -20,
        scale: 0.3,
        opacity: 0,
        rotation: -20,
        duration: 0.5,
        ease: 'back.out(2.5)'
      }, 0.2);

      // 0.30 - 1.00 引语文字整体弹入（缩放 + 透明度 + 轻微 back.out）
      tl.from('#quoteTextEl', {
        scale: 0.7,
        opacity: 0,
        y: 20,
        duration: 0.7,
        ease: 'back.out(1.8)'
      }, 0.3);

      // 0.90 - 1.30 说话人从下方淡入（y: 20→0 + 透明度 0→1）
      tl.from('#speakerTextEl', {
        y: 20,
        opacity: 0,
        duration: 0.4,
        ease: 'power3.out'
      }, 0.9);

      // 1.10 - 1.70 4 个星光依次出现 + 呼吸
      var sparkleIds = ['#sparkle1', '#sparkle2', '#sparkle3', '#sparkle4'];
      var sparkleStartTimes = [1.1, 1.2, 1.3, 1.4];

      for (var i = 0; i < sparkleIds.length; i++) {
        var sid = sparkleIds[i];
        var st = sparkleStartTimes[i];

        // 入场（scale/opacity/rotation）
        tl.from(sid, {
          scale: 0,
          opacity: 0,
          rotation: -45,
          duration: 0.3,
          ease: 'back.out(2.5)'
        }, st);

        // 呼吸（与入场不重叠：在入场结束之后 0.4s 处开始）
        // 入场结束时刻 = st + 0.3；呼吸起始 = st + 0.4；不冲突
        tl.to(sid, {
          opacity: 0.45,
          duration: 0.3,
          yoyo: true,
          repeat: 1,
          ease: 'sine.inOut'
        }, st + 0.4);
      }

      window.__timelines['quote-callout'] = tl;
    </script>
<script>
// MVP 渲染桥接：用 progress 驱动 GSAP timeline
window.updateAnimation = function(progress) {
  var keys = Object.keys(window.__timelines || {});
  if (keys.length > 0) {
    window.__timelines[keys[0]].progress(Math.max(0, Math.min(1, progress)));
  }
};
// 初始化到第 0 帧
if (typeof window.updateAnimation === 'function') {
  window.updateAnimation(0);
}
</script>
  </body>
</html>
