<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --theme: #f59e0b;
    --theme-glow: rgba(245,158,11,0.15);
    --text: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1700px; overflow: hidden;
    background: transparent; font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }
  .scene {
    width: 1080px; height: 1700px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 160px 80px;
    background: transparent; position: relative;
  }
  .hidden { display: none !important; }

  /* === classic 左线引用 === */
  .quote-classic {
    display: flex; gap: 32px; align-items: center; max-width: 860px;
  }
  .quote-line {
    width: 8px; height: 160px; background: var(--theme); border-radius: 4px;
    box-shadow: 0 0 30px var(--theme-glow); flex-shrink: 0;
  }
  .quote-classic-text {
    font-size: 56px; font-weight: 700; color: var(--text); line-height: 1.5; letter-spacing: 2px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .quote-classic-source {
    font-size: 26px; color: #9ca3af; margin-top: 20px; letter-spacing: 2px;
  }

  /* === center 居中引用 === */
  .quote-center { text-align: center; max-width: 860px; }
  .quote-center-mark { font-size: 120px; color: var(--theme); opacity: 0.35; line-height: 1; font-family: Georgia, serif; }
  .quote-center-text {
    font-size: 64px; font-weight: 800; color: var(--text); line-height: 1.5; letter-spacing: 2px;
    margin-top: -20px;
  }

  /* === speaker 说话人卡片 === */
  .quote-speaker {
    display: flex; align-items: center; gap: 36px; max-width: 900px;
  }
  .speaker-avatar {
    width: 120px; height: 120px; border-radius: 50%; background: var(--theme)20;
    border: 3px solid var(--theme); display: flex; align-items: center; justify-content: center;
    color: var(--theme); font-size: 48px; font-weight: 700; flex-shrink: 0;
  }
  .speaker-body { flex: 1; }
  .quote-speaker-text {
    font-size: 48px; font-weight: 700; color: var(--text); line-height: 1.5; letter-spacing: 1px;
  }
  .speaker-name {
    font-size: 28px; color: var(--theme); margin-top: 16px; letter-spacing: 2px;
  }

  /* === bubble 气泡引用 === */
  .quote-bubble-wrap { position: relative; max-width: 820px; }
  .quote-bubble {
    background: var(--theme)15; border-radius: 24px; padding: 40px 48px;
    border: 1px solid var(--theme)30;
  }
  .quote-bubble-text {
    font-size: 52px; font-weight: 700; color: var(--text); line-height: 1.5; letter-spacing: 1px;
  }
  .quote-bubble-tail {
    position: absolute; bottom: -22px; left: 60px;
    width: 0; height: 0;
    border-left: 24px solid transparent; border-right: 24px solid transparent;
    border-top: 24px solid var(--theme)15;
  }

  /* === underline 下划线强调 === */
  .quote-underline { text-align: center; max-width: 860px; }
  .quote-underline-mark { font-size: 80px; color: var(--theme); opacity: 0.5; line-height: 1; font-family: Georgia, serif; }
  .quote-underline-text {
    font-size: 58px; font-weight: 800; color: var(--text); line-height: 1.5; letter-spacing: 2px;
  }
  .quote-underline-bar {
    width: 120px; height: 8px; background: var(--theme); border-radius: 4px;
    margin: 24px auto 0; box-shadow: 0 0 20px var(--theme-glow);
  }

  .shimmer {
    position: absolute; top: -200px; left: 0;
    width: 1080px; height: 80px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewY(-15deg); opacity: 0;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="quote-classic" id="quoteClassic">
      <div class="quote-line"></div>
      <div>
        <div class="quote-classic-text" id="classicText">核心观点引用</div>
        <div class="quote-classic-source" id="classicSource"></div>
      </div>
    </div>

    <div class="quote-center hidden" id="quoteCenter">
      <div class="quote-center-mark">"</div>
      <div class="quote-center-text" id="centerText">短句金句</div>
    </div>

    <div class="quote-speaker hidden" id="quoteSpeaker">
      <div class="speaker-avatar">人</div>
      <div class="speaker-body">
        <div class="quote-speaker-text" id="speakerText">发言人观点</div>
        <div class="speaker-name" id="speakerName">发言人</div>
      </div>
    </div>

    <div class="quote-bubble-wrap hidden" id="quoteBubble">
      <div class="quote-bubble">
        <div class="quote-bubble-text" id="bubbleText">对话气泡引用</div>
      </div>
      <div class="quote-bubble-tail"></div>
    </div>

    <div class="quote-underline hidden" id="quoteUnderline">
      <div class="quote-underline-mark">"</div>
      <div class="quote-underline-text" id="underlineText">政策专家观点</div>
      <div class="quote-underline-bar"></div>
    </div>
  </div>
  <div class="shimmer" id="shimmer"></div>

  <script>
    function updateAnimation(progress) {
      const P = window.__TEMPLATE_PARAMS || {};
      const T = window.__THEME || {};
      const preset = P.preset || 'classic';

      document.documentElement.style.setProperty('--theme', T.primary);
      document.documentElement.style.setProperty('--theme-glow', T.primaryGlow);

      const text = P.displayText || P.quoteText || P.mainText || '';
      const source = P.source || P.subText || '';
      const speaker = P.speaker || source || '发言人';

      document.getElementById('quoteClassic').classList.toggle('hidden', preset !== 'classic');
      document.getElementById('quoteCenter').classList.toggle('hidden', preset !== 'center');
      document.getElementById('quoteSpeaker').classList.toggle('hidden', preset !== 'speaker');
      document.getElementById('quoteBubble').classList.toggle('hidden', preset !== 'bubble');
      document.getElementById('quoteUnderline').classList.toggle('hidden', preset !== 'underline');

      document.getElementById('classicText').textContent = text;
      document.getElementById('classicSource').textContent = source;
      document.getElementById('centerText').textContent = text;
      document.getElementById('speakerText').textContent = text;
      document.getElementById('speakerName').textContent = speaker;
      document.getElementById('bubbleText').textContent = text;
      document.getElementById('underlineText').textContent = text;

      const shimmer = document.getElementById('shimmer');
      if (progress >= 0.2 && progress <= 0.55) {
        const t = (progress - 0.2) / 0.35;
        shimmer.style.top = `${-200 + t * 1900}px`;
        shimmer.style.opacity = t < 0.1 ? t * 10 : t > 0.9 ? (1 - t) * 10 : 0.6;
      } else {
        shimmer.style.opacity = 0;
        shimmer.style.top = '-200px';
      }

      animateOpacity('quoteClassic', progress, 0, 0.3);
      animateOpacity('quoteCenter', progress, 0, 0.3);
      animateOpacity('quoteSpeaker', progress, 0, 0.3);
      animateOpacity('quoteBubble', progress, 0, 0.3);
      animateOpacity('quoteUnderline', progress, 0, 0.3);
    }

    function animateOpacity(id, progress, start, end) {
      const el = document.getElementById(id);
      if (!el) return;
      if (progress <= start) el.style.opacity = 0;
      else if (progress <= end) el.style.opacity = (progress - start) / (end - start);
      else el.style.opacity = 1;
    }

    updateAnimation(window.__currentProgress || 0);
  </script>
</body>
</html>
