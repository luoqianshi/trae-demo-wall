<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>完整包装轨导出 - 快讯包装生成器</title>
  <link rel="stylesheet" href="css/variables.css?v=mvp2">
  <link rel="stylesheet" href="css/base.css?v=mvp2">
  <link rel="stylesheet" href="css/track.css?v=mvp2">
</head>
<body class="track-page">

  <header class="toolbar">
    <div class="toolbar__brand">
      <span class="toolbar__brand-dot"></span>
      快讯包装生成器 · 完整包装轨
    </div>
    <div class="toolbar__actions">
      <a href="/" class="btn btn--sm">返回单条导出</a>
    </div>
  </header>

  <main class="track-page">

    <!-- 顶部提示 -->
    <div class="notice">
      <strong>产品逻辑：</strong>用户导入的正式口播稿是主文本，语音识别或字幕只用来找时间。包装文字一定来自正式稿。
    </div>

    <!-- 第一行：媒体 + 正式稿 -->
    <div class="grid grid--2">
      <section class="card">
        <h2 class="card__title">1. 导入媒体素材</h2>
        <div class="form-group">
          <label class="file-input">
            <input type="file" id="media-input" accept="video/*,audio/*">
            <span class="file-input__btn">选择视频/音频</span>
            <span class="file-input__name" id="media-name">未选择文件</span>
          </label>
          <div class="hint">支持 mp4、mov、mp3、wav 等常见格式</div>
        </div>
        <div id="media-info" class="media-info hidden"></div>
        <div class="form-group">
          <button id="btn-transcribe" class="btn btn--primary" disabled>用 Whisper 识别语音</button>
          <span class="hint">或：</span>
          <label class="file-input file-input--secondary">
            <input type="file" id="subtitle-input" accept=".srt,.json">
            <span class="file-input__btn">上传字幕文件</span>
            <span class="file-input__name" id="subtitle-name">未选择文件</span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">2. 导入正式口播稿</h2>
        <div class="form-group">
          <textarea id="track-script-text" class="textarea" rows="8" placeholder="在此粘贴正式口播稿，每一句话用标点分隔。&#10; packaging 文字将严格来自这段稿子。"></textarea>
        </div>
        <div class="form-group">
          <label class="file-input file-input--secondary">
            <input type="file" id="script-file-input" accept=".txt,.md">
            <span class="file-input__btn">上传文稿文件</span>
            <span class="file-input__name" id="script-file-name">未选择文件</span>
          </label>
        </div>
      </section>
    </div>

    <!-- 第二步：对齐 -->
    <section class="card">
      <div class="card__header">
        <h2 class="card__title">3. 对齐时间并识别包装点</h2>
        <button id="btn-align" class="btn btn--primary" disabled>开始对齐</button>
      </div>
      <div id="align-status" class="status hidden"></div>
    </section>

    <!-- 结果区 -->
    <section class="grid grid--2">
      <section class="card card--results">
        <h3 class="card__subtitle">语音识别 / 字幕结果</h3>
        <div id="transcript-list" class="result-list">
          <div class="empty">暂无识别或字幕结果</div>
        </div>
      </section>

      <section class="card card--results">
        <h3 class="card__subtitle">正式稿与时间段对齐</h3>
        <div id="aligned-list" class="result-list">
          <div class="empty">尚未对齐</div>
        </div>
      </section>
    </section>

    <section class="card">
      <h3 class="card__subtitle">完整时间线上的包装点</h3>
      <div id="timeline-visual" class="timeline-visual">
        <div class="empty">尚未生成时间线</div>
      </div>
      <div id="packaging-list" class="packaging-list"></div>
    </section>

    <section class="card card--warning" id="unaligned-card" style="display:none;">
      <h3 class="card__subtitle">未成功对齐的内容</h3>
      <div id="unaligned-list" class="result-list"></div>
    </section>

    <!-- 导出 -->
    <section class="card card--export">
      <div class="card__header">
        <h2 class="card__title">4. 导出完整透明包装轨</h2>
        <button id="btn-render-track" class="btn btn--primary" disabled>导出完整包装轨</button>
      </div>
      <div id="render-status" class="status hidden"></div>
      <div id="download-area" class="download-area hidden">
        <a id="download-link" class="btn btn--secondary" href="#" download>下载 MOV</a>
        <span id="download-path" class="hint"></span>
      </div>
    </section>

  </main>

  <script src="js/track-panel.js?v=mvp2"></script>
  <script>TrackPanel.init();</script>
</body>
</html>
