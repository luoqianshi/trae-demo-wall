/* ========================================
   Dark Idle RPG Game - Brand Design Tokens
   Based on PRD: 暗黑挂机传 H5版

:root {
  /* === Core Colors === */
  --color-bg-primary: #0d0d0d;
  --color-bg-secondary: #1a1a2e;
  --color-bg-tertiary: #16213e;
  --color-bg-surface: #0f0f1a;
  --color-bg-elevated: #1e1e3a;
  
  /* === Text Colors === */
  --color-text-primary: #e0e0e0;
  --color-text-secondary: #a0a0b0;
  --color-text-muted: #666680;
  --color-text-inverse: #0d0d0d;
  
  /* === Brand / Accent Colors === */
  --color-brand-primary: #c8a84e;
  --color-brand-primary-dim: rgba(200, 168, 78, 0.15);
  --color-brand-primary-hover: #d4b866;
  --color-brand-secondary: #a855f7;
  --color-brand-secondary-dim: rgba(168, 85, 247, 0.15);
  
  /* === Equipment Quality Colors === */
  --color-quality-white: #cccccc;
  --color-quality-blue: #4488ff;
  --color-quality-yellow: #c8a84e;
  --color-quality-green: #00cc88;
  --color-quality-orange: #ff8c00;
  --color-quality-red: #ef4444;
  --color-quality-epic: #cc44ff;
  
  /* === State / Semantic Colors === */
  --state-success: #00cc88;
  --state-warning: #ff8c00;
  --state-error: #ef4444;
  --state-info: #4488ff;
  
  /* === Border Colors === */
  --color-border-default: #2a2a4a;
  --color-border-subtle: #1f1f3a;
  --color-border-accent: #c8a84e;
  
  /* === Typography === */
  --font-family-base: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-family-mono: 'Consolas', 'Courier New', monospace;
  
  --font-size-xs: 0.7rem;
  --font-size-sm: 0.8rem;
  --font-size-base: 0.9rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.2rem;
  --font-size-xl: 1.6rem;
  --font-size-2xl: 2.2rem;
  
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;
  
  --line-height-tight: 1.3;
  --line-height-base: 1.6;
  --line-height-relaxed: 1.8;
  
  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  
  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  
  /* === Shadows === */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-glow-gold: 0 0 20px rgba(200, 168, 78, 0.3);
  --shadow-glow-purple: 0 0 20px rgba(168, 85, 247, 0.3);
  
  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 400ms ease;
}

/* === Dark mode body defaults === */
html.dark body,
body {
  background-color: var(--color-bg-primary);
  color: var(--color-text-primary);
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  -webkit-font-smoothing: antialiased;
}

  <!-- Bottom Nav Active State Script -->
  <script>
  (function() {
    var page = window.location.pathname.split('/').pop().replace('.html', '') || 'battle-home';
    var navMap = {
      'battle-home': 'battle',
      'character': 'character',
      'inventory': 'inventory',
      'forge': 'forge',
      'pets': 'pets',
      'combat-level': 'more',
      'dungeons': 'more'
    };
    var activeKey = navMap[page] || 'battle';
    var tabs = document.querySelectorAll('.nav-tab');
    tabs.forEach(function(tab) {
      if (tab.getAttribute('data-nav') === activeKey) {
        tab.style.color = 'var(--color-brand-primary)';
        tab.style.textShadow = '0 0 8px rgba(200,168,78,0.35)';
      } else {
        tab.style.color = 'var(--color-text-muted)';
        tab.style.textShadow = 'none';
      }
    });

    // Filter button interaction
    var filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });

    // Sub-tab interaction
    var subTabs = document.querySelectorAll('.sub-tab');
    subTabs.forEach(function(tab) {
      tab.addEventListener('click', function(e) {
        e.preventDefault();
        subTabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
      });
    });
  })();
  </script>


    <style>
    /* === Reset & Base === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }

    body {
      max-width: 375px;
      margin: 0 auto;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      line-height: var(--line-height-base);
      min-height: 100vh;
      padding-bottom: 70px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* === Game Header === */
    #game-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-default);
    }
    #game-header h1 {
      margin: 0; padding: 0;
      font-size: 1.1rem; font-weight: var(--font-weight-bold);
      color: var(--color-brand-primary);
      text-shadow: 0 0 12px rgba(200, 168, 78, 0.4);
      letter-spacing: 2px;
    }
    #btn-settings {
      background: none; border: none; outline: none; cursor: pointer;
      font-size: 1.2rem; line-height: 1;
      color: var(--color-text-muted);
      padding: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    /* === Resource Bar === */
    #resource-bar {
      position: fixed; top: 48px; left: 0; right: 0; z-index: 99;
      display: flex; align-items: center; gap: 16px;
      padding: 6px 12px;
      background: var(--color-bg-surface);
      border-bottom: 1px solid var(--color-border-subtle);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #resource-bar::-webkit-scrollbar { display: none; }
    .res-item {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .res-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      font-size: 0.65rem;
    }
    .res-label { font-size: 0.7rem; color: var(--color-text-muted); }
    .res-value {
      font-size: 0.7rem; font-weight: var(--font-weight-semibold);
    }

    /* === Page Content === */
    #page-content {
      position: relative;
      margin-top: 82px;
      margin-bottom: 56px;
      min-height: calc(100vh - 138px);
      padding: 10px 8px 8px 8px;
      background: var(--color-bg-primary);
    }

    /* === Sub-Tab Bar (背包 / 仓库) === */
    .sub-tab-bar {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--color-border-subtle);
      margin-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .sub-tab-bar::-webkit-scrollbar { display: none; }
    .sub-tab {
      flex-shrink: 0;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      text-decoration: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .sub-tab.active {
      color: var(--color-brand-primary);
      border-bottom-color: var(--color-brand-primary);
      text-shadow: 0 0 8px rgba(200, 168, 78, 0.3);
      font-weight: var(--font-weight-medium);
    }
    .sub-tab:hover:not(.active) {
      color: var(--color-text-secondary);
    }

    /* === Filter & Action Bar === */
    .filter-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: var(--font-weight-medium);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .filter-btn.active {
      background: rgba(200, 168, 78, 0.15);
      border-color: var(--color-brand-primary);
      color: var(--color-brand-primary);
    }
    .filter-btn[data-quality="blue"].active {
      background: rgba(68, 136, 255, 0.12);
      border-color: var(--color-quality-blue);
      color: var(--color-quality-blue);
    }
    .filter-btn[data-quality="yellow"].active {
      background: rgba(200, 168, 78, 0.12);
      border-color: var(--color-quality-yellow);
      color: var(--color-quality-yellow);
    }
    .filter-btn[data-quality="set"].active {
      background: rgba(0, 204, 136, 0.12);
      border-color: var(--color-quality-green);
      color: var(--color-quality-green);
    }
    .filter-btn[data-quality="legendary"].active {
      background: rgba(255, 140, 0, 0.12);
      border-color: var(--color-quality-orange);
      color: var(--color-quality-orange);
    }
    .filter-btn[data-quality="ancient"].active {
      background: rgba(239, 68, 68, 0.12);
      border-color: var(--color-quality-red);
      color: var(--color-quality-red);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .action-btn {
      padding: 4px 8px;
      font-size: 0.65rem;
      font-weight: var(--font-weight-medium);
      border-radius: var(--radius-sm);
      border: 1px solid;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .action-btn.sort {
      border-color: var(--state-success);
      color: var(--state-success);
      background: rgba(0, 204, 136, 0.1);
    }
    .action-btn.decompose {
      border-color: var(--state-error);
      color: var(--state-error);
      background: rgba(239, 68, 68, 0.1);
    }

    /* === Equipment Grid === */
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      margin-bottom: 10px;
    }
    .equip-cell {
      position: relative;
      aspect-ratio: 1;
      background: var(--color-bg-elevated);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .equip-cell:hover {
      transform: scale(1.08);
      z-index: 2;
    }
    /* Quality left border for filled cells */
    .equip-cell.filled {
      border: 1px solid var(--color-border-subtle);
    }
    .equip-cell.filled::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--cell-quality-color, var(--color-border-default));
    }
    .equip-cell .cell-name {
      position: absolute;
      bottom: 1px; left: 0; right: 0;
      text-align: center;
      font-size: 0.45rem;
      font-weight: var(--font-weight-medium);
      color: var(--cell-quality-color, var(--color-text-secondary));
      line-height: 1;
      padding: 0 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Empty cells */
    .equip-cell.empty {
      border: 1px dashed var(--color-border-default);
      background: var(--color-bg-surface);
      opacity: 0.5;
    }
    /* Quality glow effects */
    .equip-cell.quality-orange:hover {
      box-shadow: 0 0 8px rgba(255, 140, 0, 0.35);
    }
    .equip-cell.quality-red:hover {
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.35);
    }
    .equip-cell.quality-yellow:hover {
      box-shadow: 0 0 8px rgba(200, 168, 78, 0.35);
    }
    .equip-cell.quality-blue:hover {
      box-shadow: 0 0 8px rgba(68, 136, 255, 0.35);
    }

    /* === Storage Info Bar === */
    .storage-info {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      font-size: 0.7rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border-subtle);
    }
    .storage-info span {
      margin: 0 4px;
    }
    .storage-info .info-highlight {
      color: var(--color-text-secondary);
      font-weight: var(--font-weight-medium);
