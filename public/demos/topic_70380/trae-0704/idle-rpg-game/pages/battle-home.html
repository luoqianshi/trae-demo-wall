<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战斗 - 暗黑挂机传</title>
    <style id="theme-vars">
/* ========================================
   Dark Idle RPG Game - Brand Design Tokens
   Based on PRD: 暗黑挂机传 H5版
   ======================================== */

:root {
  /* === Core Colors === */
  --color-bg-primary: #0d0d0d;
  --color-bg-secondary: #1a1a2e;
  --color-bg-tertiary: #16213e;
  --color-bg-surface: #0f0f1a;
  --color-bg-elevated: #1e1e3a;
  
  /* === Text Colors === */
  --color-text-primary: #e0e0e0;
  --color-text-secondary: #a0a0b0;
  --color-text-muted: #666680;
  --color-text-inverse: #0d0d0d;
  
  /* === Brand / Accent Colors === */
  --color-brand-primary: #c8a84e;
  --color-brand-primary-dim: rgba(200, 168, 78, 0.15);
  --color-brand-primary-hover: #d4b866;
  --color-brand-secondary: #a855f7;
  --color-brand-secondary-dim: rgba(168, 85, 247, 0.15);
  
  /* === Equipment Quality Colors === */
  --color-quality-white: #cccccc;
  --color-quality-blue: #4488ff;
  --color-quality-yellow: #c8a84e;
  --color-quality-green: #00cc88;
  --color-quality-orange: #ff8c00;
  --color-quality-red: #ef4444;
  --color-quality-epic: #cc44ff;
  
  /* === State / Semantic Colors === */
  --state-success: #00cc88;
  --state-warning: #ff8c00;
  --state-error: #ef4444;
  --state-info: #4488ff;
  
  /* === Border Colors === */
  --color-border-default: #2a2a4a;
  --color-border-subtle: #1f1f3a;
  --color-border-accent: #c8a84e;
  
  /* === Typography === */
  --font-family-base: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-family-mono: 'Consolas', 'Courier New', monospace;
  
  --font-size-xs: 0.7rem;
  --font-size-sm: 0.8rem;
  --font-size-base: 0.9rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.2rem;
  --font-size-xl: 1.6rem;
  --font-size-2xl: 2.2rem;
  
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;
  
  --line-height-tight: 1.3;
  --line-height-base: 1.6;
  --line-height-relaxed: 1.8;
  
  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  
  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  
  /* === Shadows === */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-glow-gold: 0 0 20px rgba(200, 168, 78, 0.3);
  --shadow-glow-purple: 0 0 20px rgba(168, 85, 247, 0.3);
  
  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 400ms ease;
}

/* === Dark mode body defaults === */
html.dark body,
body {
  background-color: var(--color-bg-primary);
  color: var(--color-text-primary);
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  -webkit-font-smoothing: antialiased;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
@theme inline {
  --color-primary: var(--color-bg-primary);
  --color-secondary: var(--color-bg-secondary);
  --color-foreground: var(--color-text-primary);
}

@layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .no-scrollbar::-webkit-scrollbar { display: none; }

<body>

    style="

  <!-- Resource Bar -->

    <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
      <span style="

        background: rgba(68,136,255,0.2);
        font-size:0.65rem;
      ">💎</span>
      <span style="font-size:0.7rem; color:var(--color-text-muted);">钻石</span>

    </div>
    <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
      <span style="
        display:inline-flex; align-items:center; justify-content:center;
        width:20px; height:20px; border-radius:50%;
        background: rgba(168,85,247,0.2);
        font-size:0.65rem;
      ">⏳</span>
      <span style="font-size:0.7rem; color:var(--color-text-muted);">时光币</span>

    <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">

      <span style="font-size:0.7rem; color:var(--color-text-muted);">遗忘之魂</span>

    </div>
  </div>

  <style>
    #resource-bar::-webkit-scrollbar { display: none; }
  </style>

  <!-- Page Content Wrapper -->
  <div id="page-content"
    style="
      position: relative;
      margin-top: 82px;
      margin-bottom: 56px;
      min-height: calc(100vh - 138px);
      padding: 0 12px 12px 12px;
      background: var(--color-bg-primary);
    ">

    <!-- ========== 1. Hero Banner Section ========== -->
    <div class="hero-banner">
      <div class="hero-banner-content">
        <span class="hero-map-name">庇护之地</span>
        <span class="hero-layer">第 285 层</span>

      </div>
    </div>

    <!-- ========== 2. Combat Stats Panel ========== -->
    <div class="combat-stats-panel">
      <div class="combat-stats-grid">

        <!-- Left: Monster Info -->
        <div class="combat-stats-col">
          <span class="combat-stats-label">当前怪物</span>
          <span class="combat-stats-value" style="color: var(--state-error);">暗影领主</span>
          <div class="progress-bar-track">
            <div class="progress-bar-fill hp"></div>
          </div>
          <span class="progress-text">HP 35%</span>
        </div>

        <!-- Right: Clear Progress -->
        <div class="combat-stats-col">
          <span class="combat-stats-label">通关进度</span>
          <span class="combat-stats-value" style="color: var(--color-brand-primary);">72%</span>
          <div class="progress-bar-track">
            <div class="progress-bar-fill gold"></div>
          </div>
          <span class="timer-text">剩余时间 28:15</span>
        </div>

      </div>
    </div>

    <!-- ========== 3. Quick Action Buttons ========== -->
    <div class="quick-actions">
      <button class="action-btn danger">停止战斗</button>
      <button class="action-btn secondary">☑ 自动换图</button>
      <button class="action-btn primary">切换地图</button>
    </div>

    <!-- ========== 4. Stamina Bar ========== -->
    <div class="stamina-section">
      <div class="stamina-header">
        <span class="stamina-label">体力</span>
        <span class="stamina-value">5,499 / 9,999</span>
      </div>
      <div class="stamina-bar-track">
        <div class="progress-bar-fill stamina"></div>
      </div>
    </div>

    <!-- ========== 5. Character Mini Card ========== -->
    <div class="char-mini-card">
      <div class="char-avatar">⚔️</div>
      <div class="char-info">
        <span class="char-name">暗影猎手</span>
        <span class="char-class">猎魔人 | Lv.100</span>
        <span class="char-peak">巅峰等级: 2580</span>
        <span class="char-combat-lv">战斗等级: 5,890</span>
      </div>
    </div>

    <!-- ========== 6. Daily Reward Banner ========== -->
    <div class="daily-reward">
      <span class="daily-reward-text">今日签到: 未领取</span>
      <button class="daily-reward-btn">领取</button>
    </div>

    <div class="bottom-spacer"></div>

  </div>
  <!-- End Page Content -->

  <!-- Bottom Navigation (Fixed Tab Bar) -->
  <nav id="bottom-nav"
    style="
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: flex-start; justify-content: space-around;
      height: 56px; padding: 6px 0 0 0;
      background: var(--color-bg-primary);
      border-top: 1px solid var(--color-border-default);
      -webkit-tap-highlight-color: transparent;
    ">
    <a href="battle-home.html" class="nav-tab active" data-nav="battle" data-dom-id="nav-battle"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-brand-primary);
        text-shadow: 0 0 8px rgba(200,168,78,0.35);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">⚔️</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">战斗</span>
    </a>
    <a href="character.html" class="nav-tab" data-nav="character" data-dom-id="nav-character"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">👤</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">角色</span>
    </a>
    <a href="inventory.html" class="nav-tab" data-nav="inventory" data-dom-id="nav-inventory"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">📦</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">背包</span>
    </a>
    <a href="forge.html" class="nav-tab" data-nav="forge" data-dom-id="nav-forge"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">🔨</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">锻造</span>
    </a>
    <a href="pets.html" class="nav-tab" data-nav="pets" data-dom-id="nav-pets"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">🐾</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">宠物</span>
    </a>
    <a href="dungeons.html" class="nav-tab" data-nav="more" data-dom-id="nav-dungeons"
      style="
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1; text-decoration: none;
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      ">
      <span style="font-size:20px; line-height:1;">⚙️</span>
      <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">更多</span>
    </a>
  </nav>

  <!-- Bottom Nav Active State Script -->
  <script>
  (function() {
    var page = window.location.pathname.split('/').pop().replace('.html', '') || 'battle-home';
    var navMap = {
      'battle-home': 'battle',
      'character': 'character',
      'inventory': 'inventory',
      'forge': 'forge',
      'pets': 'pets',
      'combat-level': 'more',
      'dungeons': 'more'
    };
    var activeKey = navMap[page] || 'battle';
    var tabs = document.querySelectorAll('.nav-tab');
    tabs.forEach(function(tab) {
      if (tab.getAttribute('data-nav') === activeKey) {
        tab.style.color = 'var(--color-brand-primary)';
        tab.style.textShadow = '0 0 8px rgba(200,168,78,0.35)';
      } else {
        tab.style.color = 'var(--color-text-muted)';
        tab.style.textShadow = 'none';
      }
    });
  })();
  </script>


    <style>
    /* ===== Page-specific styles ===== */

    /* -- Hero Banner -- */
    .hero-banner {
      position: relative;
      width: calc(100% + 24px);
      margin-left: -12px;
      margin-right: -12px;
      height: 180px;
      background: url('../assets/hero-banner.jpg') center/cover no-repeat;
      border-radius: 0;
      overflow: hidden;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(13, 13, 13, 0.4) 0%,
        rgba(13, 13, 13, 0.6) 50%,
        rgba(13, 13, 13, 0.85) 100%
      );
    }
    .hero-banner-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
      text-align: center;
    }
    .hero-map-name {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    .hero-layer {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-brand-primary);
      text-shadow: 0 0 16px rgba(200, 168, 78, 0.5);
      margin-bottom: 10px;
    }
    .hero-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-sm);
      color: var(--state-success);
      animation: pulse-status 2s ease-in-out infinite;
    }
    .hero-status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--state-success);
      box-shadow: 0 0 8px rgba(0, 204, 136, 0.6);
    }

    @keyframes pulse-status {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* -- Combat Stats Panel -- */
    .combat-stats-panel {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: -20px;
      position: relative;
      z-index: 2;
    }
    .combat-stats-grid {
      display: flex;
      gap: 12px;
    }
    .combat-stats-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .combat-stats-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: 2px;
    }
    .combat-stats-value {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .progress-bar-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width var(--transition-base);
    }
    .progress-bar-fill.hp {
      background: linear-gradient(90deg, #ef4444, #ff6b6b);
      width: 35%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 6px rgba(239, 68, 68, 0.3);
    }
    .progress-bar-fill.gold {
      background: linear-gradient(90deg, #c8a84e, #d4b866);
      width: 72%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 6px rgba(200, 168, 78, 0.3);
    }
    .progress-bar-fill.stamina {
      background: linear-gradient(90deg, #00cc88, #33ddaa);
      width: 55%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 6px rgba(0, 204, 136, 0.3);
    }
    .progress-text {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-top: 2px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .progress-row .label {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    .progress-row .value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-brand-primary);
    }
    .timer-text {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    /* -- Quick Action Buttons -- */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 6px;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      font-family: var(--font-family-base);
      cursor: pointer;
      transition: all var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active {
      transform: scale(0.97);
    }
    .action-btn.danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--state-error);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .action-btn.danger:active {
      background: rgba(239, 68, 68, 0.25);
    }
    .action-btn.secondary {
      background: rgba(160, 160, 176, 0.1);
      color: var(--color-text-secondary);
      border-color: var(--color-border-subtle);
    }
    .action-btn.secondary:active {
      background: rgba(160, 160, 176, 0.2);
    }
    .action-btn.primary {
      background: var(--color-brand-primary-dim);
      color: var(--color-brand-primary);
      border-color: rgba(200, 168, 78, 0.3);
    }
    .action-btn.primary:active {
      background: rgba(200, 168, 78, 0.25);
    }

    /* -- Stamina Bar -- */
    .stamina-section {
      margin-top: 12px;
    }
    .stamina-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
