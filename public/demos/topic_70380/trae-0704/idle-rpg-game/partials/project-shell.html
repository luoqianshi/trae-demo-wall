<!-- ========== Game Shell Partial - 暗黑挂机传 ========== -->
<!-- Include this fragment in every game page inside the main content area -->

<!-- Game Header (Fixed Top Bar) -->
<header id="game-header"
  style="
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    background: var(--color-bg-secondary);
    border-bottom: 1px solid var(--color-border-default);
  ">
  <h1 style="
    margin: 0; padding: 0;
    font-size: 1.1rem; font-weight: var(--font-weight-bold);
    color: var(--color-brand-primary);
    text-shadow: 0 0 12px rgba(200, 168, 78, 0.4);
    letter-spacing: 2px;
  ">暗黑挂机传</h1>
  <button id="btn-settings"
    style="
      background: none; border: none; outline: none; cursor: pointer;
      font-size: 1.2rem; line-height: 1;
      color: var(--color-text-muted);
      padding: 6px;
      -webkit-tap-highlight-color: transparent;
    "
    aria-label="设置"
  >⚙️</button>
</header>

<!-- Resource Bar (Horizontal Scrollable) -->
<div id="resource-bar"
  style="
    position: fixed; top: 48px; left: 0; right: 0; z-index: 99;
    display: flex; align-items: center; gap: 16px;
    padding: 6px 12px;
    background: var(--color-bg-surface);
    border-bottom: 1px solid var(--color-border-subtle);
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  ">
  <!-- Resource: 金币 -->
  <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
    <span style="
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:50%;
      background: rgba(200,168,78,0.2);
      font-size:0.65rem;
    ">🪙</span>
    <span style="font-size:0.7rem; color:var(--color-text-muted);">金币</span>
    <span style="font-size:0.7rem; color:#c8a84e; font-weight:var(--font-weight-semibold);">12,580</span>
  </div>
  <!-- Resource: 钻石 -->
  <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
    <span style="
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:50%;
      background: rgba(68,136,255,0.2);
      font-size:0.65rem;
    ">💎</span>
    <span style="font-size:0.7rem; color:var(--color-text-muted);">钻石</span>
    <span style="font-size:0.7rem; color:#4488ff; font-weight:var(--font-weight-semibold);">360</span>
  </div>
  <!-- Resource: 时光币 -->
  <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
    <span style="
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:50%;
      background: rgba(168,85,247,0.2);
      font-size:0.65rem;
    ">⏳</span>
    <span style="font-size:0.7rem; color:var(--color-text-muted);">时光币</span>
    <span style="font-size:0.7rem; color:#a855f7; font-weight:var(--font-weight-semibold);">1,200</span>
  </div>
  <!-- Resource: 遗忘之魂 -->
  <div class="res-item" style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
    <span style="
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:50%;
      background: rgba(255,140,0,0.2);
      font-size:0.65rem;
    ">👻</span>
    <span style="font-size:0.7rem; color:var(--color-text-muted);">遗忘之魂</span>
    <span style="font-size:0.7rem; color:#ff8c00; font-weight:var(--font-weight-semibold);">85</span>
  </div>
</div>

<!-- Hide scrollbar on resource bar -->
<style>
  #resource-bar::-webkit-scrollbar { display: none; }
</style>

<!-- Page Content Wrapper -->
<!-- Pages insert their unique content inside this div -->
<div id="page-content"
  style="
    position: relative;
    margin-top: 82px; /* 48px header + 34px resource bar */
    margin-bottom: 56px; /* bottom nav height */
    min-height: calc(100vh - 138px);
    padding: 12px;
    background: var(--color-bg-primary);
  ">
  <!-- SLOT: page-content -->
</div>

<!-- Bottom Navigation (Fixed Tab Bar) -->
<nav id="bottom-nav"
  style="
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: space-around;
    height: 56px; padding: 6px 0 0 0;
    background: var(--color-bg-primary);
    border-top: 1px solid var(--color-border-default);
    -webkit-tap-highlight-color: transparent;
  ">
  <!-- Tab: 战斗 -->
  <a href="battle-home.html" class="nav-tab active" data-nav="battle"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-brand-primary);
      text-shadow: 0 0 8px rgba(200,168,78,0.35);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">⚔️</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">战斗</span>
  </a>
  <!-- Tab: 角色 -->
  <a href="character.html" class="nav-tab" data-nav="character"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-text-muted);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">👤</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">角色</span>
  </a>
  <!-- Tab: 背包 -->
  <a href="inventory.html" class="nav-tab" data-nav="inventory"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-text-muted);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">📦</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">背包</span>
  </a>
  <!-- Tab: 锻造 -->
  <a href="forge.html" class="nav-tab" data-nav="forge"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-text-muted);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">🔨</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">锻造</span>
  </a>
  <!-- Tab: 宠物 -->
  <a href="pets.html" class="nav-tab" data-nav="pets"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-text-muted);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">🐾</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">宠物</span>
  </a>
  <!-- Tab: 更多 -->
  <a href="combat-level.html" class="nav-tab" data-nav="more"
    style="
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex: 1; text-decoration: none;
      color: var(--color-text-muted);
      transition: color var(--transition-fast);
    ">
    <span style="font-size:20px; line-height:1;">☰</span>
    <span style="font-size:0.6rem; font-weight:var(--font-weight-medium);">更多</span>
  </a>
</nav>

<!-- Bottom Nav Active State Script -->
<script>
(function() {
  /* Highlight the active tab based on current page filename */
  var page = window.location.pathname.split('/').pop().replace('.html', '') || 'battle-home';
  var navMap = {
    'battle-home': 'battle',
    'character': 'character',
    'inventory': 'inventory',
    'forge': 'forge',
    'pets': 'pets',
    'combat-level': 'more',
    'dungeons': 'more'
  };
  var activeKey = navMap[page] || 'battle';
  var tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach(function(tab) {
    if (tab.getAttribute('data-nav') === activeKey) {
      tab.style.color = 'var(--color-brand-primary)';
      tab.style.textShadow = '0 0 8px rgba(200,168,78,0.35)';
    } else {
      tab.style.color = 'var(--color-text-muted)';
      tab.style.textShadow = 'none';
    }
  });
})();
</script>
<!-- ========== End Game Shell Partial ========== -->
