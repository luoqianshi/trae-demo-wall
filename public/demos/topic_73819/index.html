<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAE Work  凡人修仙版 Demo</title>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252542;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-error: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #3f3f5a;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-secondary: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links button:hover,
        .nav-links button.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-primary);
        }

        .hero-section {
            padding: 60px 32px;
            text-align: center;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 32px;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .section {
            padding: 40px 32px;
            border-top: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .tool-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .tool-icon.module { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .tool-icon.composite { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
        .tool-icon.standalone { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .tool-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .tool-info .type-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        .type-badge.MODULE { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .type-badge.COMPOSITE { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .type-badge.STANDALONE { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .tool-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tool-tag {
            font-size: 11px;
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .network-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            overflow: hidden;
        }

        .network-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .network-tab {
            padding: 10px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .network-tab:hover {
            border-color: var(--accent-primary);
        }

        .network-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .network-canvas {
            position: relative;
            height: 400px;
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
        }

        .network-node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .network-node:hover {
            transform: scale(1.15);
            z-index: 20;
        }

        .network-node.module { background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%); }
        .network-node.composite { background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%); }
        .network-node.standalone { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
        .network-node.asset { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); }

        .node-icon { font-size: 24px; }
        .node-label { font-size: 10px; margin-top: 2px; text-align: center; color: white; }

        .network-link {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .network-link::before,
        .network-link::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-primary);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .network-link::before { left: -5px; }
        .network-link::after { right: -5px; }

        .chat-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px 24px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #353552;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--accent-secondary);
        }

        .message.bot .message-avatar {
            background: var(--accent-primary);
        }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 16px 24px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent-primary);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .assets-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .asset-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .asset-card:hover {
            border-color: var(--accent-warning);
            transform: translateY(-2px);
        }

        .asset-card.selected {
            border-color: var(--accent-success);
            background: rgba(16, 185, 129, 0.08);
        }

        .asset-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .asset-icon.MODULE { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .asset-icon.OPTIMIZATION { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .asset-icon.TOOL { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .asset-icon.TECH_STACK { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }

        .asset-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .asset-type {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .asset-metrics {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .asset-checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .asset-card.selected .asset-checkbox {
            background: var(--accent-success);
            border-color: var(--accent-success);
        }

        .asset-checkbox::after {
            content: '✓';
            color: white;
            font-size: 12px;
            opacity: 0;
        }

        .asset-card.selected .asset-checkbox::after {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-tertiary);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            background: var(--accent-success);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .footer {
            padding: 32px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🧝</div>
            <div class="logo-text">
                <h1>TRAE Work  凡人修仙版</h1>
                <p>Demo</p>
            </div>
        </div>
        <div class="nav-links">
            <button class="active" onclick="showSection('home')">🏠 首页</button>
            <button onclick="showSection('tools')">🔧 工具</button>
            <button onclick="showSection('network')">🕸️ 网络</button>
            <button onclick="showSection('chat')">💬 对话</button>
            <button onclick="showSection('assets')">📦 资产</button>
        </div>
    </div>

    <div id="section-home" class="hero-section">
        <h2 class="hero-title">凡人修仙 · 工具成神</h2>
        <p class="hero-subtitle">基于双层分层存储架构(DLSA)的智能工具池，支持模块化交付物、对话式生成、网络可视化等核心能力</p>
        <div class="hero-stats">
            <div class="stat-item">
                <div class="stat-value">14</div>
                <div class="stat-label">核心工具</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">4</div>
                <div class="stat-label">交付物类型</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">∞</div>
                <div class="stat-label">复用能力</div>
            </div>
        </div>
    </div>

    <div id="section-tools" class="section" style="display: none;">
        <h2 class="section-title">🔧 工具模块</h2>
        <div class="tool-grid" id="tool-grid"></div>
    </div>

    <div id="section-network" class="section" style="display: none;">
        <h2 class="section-title">🕸️ 网络可视化</h2>
        <div class="network-container">
            <div class="network-tabs">
                <button class="network-tab active" onclick="switchNetworkTab('linkage')">🔗 链路网络</button>
                <button class="network-tab" onclick="switchNetworkTab('asset')">📦 资产网络</button>
            </div>
            <div class="network-canvas" id="network-canvas"></div>
        </div>
    </div>

    <div id="section-chat" class="section" style="display: none;">
        <h2 class="section-title">💬 对话式生成</h2>
        <div class="chat-container">
            <div class="chat-header">
                <span class="chat-title">智能开发助手</span>
                <div class="chat-actions">
                    <button class="btn btn-secondary" onclick="openAssetPicker()">📦 选择资产</button>
                    <button class="btn btn-secondary" onclick="newChat()">+ 新建对话</button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message bot">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">你好！我是你的智能开发助手。请选择资产交付物或直接输入你的需求，我来帮你完成开发工作。</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chat-input" placeholder="输入你的需求..." onkeypress="handleChatKey(event)">
                <button class="btn btn-primary" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <div id="section-assets" class="section" style="display: none;">
        <h2 class="section-title">📦 资产交付物</h2>
        <div class="assets-section" id="assets-grid"></div>
    </div>

    <div id="asset-picker-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📦 选择资产交付物参与对话</h3>
                <button class="modal-close" onclick="closeAssetPicker()">×</button>
            </div>
            <div class="modal-body">
                <div class="tool-grid" id="picker-grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAssetPicker()">取消</button>
                <button class="btn btn-primary" onclick="confirmAssetSelection()">确认选择</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div class="footer">
        <p>🧝 TRAE Work 凡人修仙版 · 双层分层存储架构</p>
    </div>

    <script>
        const tools = [
            { id: 'ai-dispatcher', name: 'AI 调度器', type: 'MODULE', desc: '统一调度本地Ollama与云端AI API，实现负载均衡和故障切换', icon: '🤖', tags: ['调度', 'AI', '路由'] },
            { id: 'config-resolver', name: '配置解析器', type: 'MODULE', desc: '实现配置优先级规则，为所有工具提供统一的配置合并能力', icon: '⚙️', tags: ['配置', '解析', '优先级'] },
            { id: 'file-manager', name: '文件管理器', type: 'MODULE', desc: '提供文件读写、目录列表、路径管理能力', icon: '📁', tags: ['文件', '管理', 'IO'] },
            { id: 'logger', name: '日志模块', type: 'MODULE', desc: '统一日志记录模块，支持多级别日志、日志查询和导出', icon: '📝', tags: ['日志', '记录', '导出'] },
            { id: 'network-config', name: '网络配置', type: 'MODULE', desc: '链路配置的导入导出，支持配置持久化与复用', icon: '🔗', tags: ['配置', '网络', '导入导出'] },
            { id: 'ollama-config', name: 'Ollama配置', type: 'MODULE', desc: '全局Ollama服务配置与连接测试', icon: '🐑', tags: ['Ollama', '配置', '测试'] },
            { id: 'ollama-runner', name: 'Ollama执行器', type: 'MODULE', desc: '封装Ollama的chat/generate/embedding能力', icon: '🚀', tags: ['Ollama', '推理', '执行'] },
            { id: 'prompt-templates', name: '提示词模板', type: 'MODULE', desc: '支持模板CRUD、变量替换、分类管理', icon: '📋', tags: ['提示词', '模板', '管理'] },
            { id: 'tool-composer', name: '工具组装器', type: 'COMPOSITE', desc: '将多个模块和工具组装成可复用的链路模板', icon: '🧩', tags: ['组装', '链路', '模板'] },
            { id: 'code-generator', name: '代码生成器', type: 'STANDALONE', desc: 'AI驱动的多语言代码生成，支持多场景代码输出', icon: '💻', tags: ['代码', '生成', 'AI'] },
            { id: 'code-reviewer', name: '代码审查器', type: 'STANDALONE', desc: '多维度AI代码审查，输出审查报告', icon: '🔍', tags: ['审查', '代码', 'AI'] },
            { id: 'api-doc-generator', name: 'API文档生成', type: 'STANDALONE', desc: '从代码自动提取API信息，生成Markdown/OpenAPI文档', icon: '📖', tags: ['文档', 'API', '生成'] },
            { id: 'project-scaffolder', name: '项目脚手架', type: 'STANDALONE', desc: '支持多框架项目结构生成，基于预设模板和AI生成', icon: '🏗️', tags: ['项目', '脚手架', '模板'] },
            { id: 'ollama-chat', name: 'Ollama聊天', type: 'STANDALONE', desc: '支持与本地Ollama服务交互的聊天工具', icon: '💬', tags: ['聊天', 'Ollama', 'AI'] },
        ];

        const assets = [
            { id: 'asset-1', name: '用户认证模块', type: 'MODULE', version: '1.0.2', quality: 95, reuse: 12 },
            { id: 'asset-2', name: '数据加密组件', type: 'MODULE', version: '2.1.0', quality: 98, reuse: 8 },
            { id: 'asset-3', name: '性能优化方案', type: 'OPTIMIZATION', version: '1.0.0', quality: 90, reuse: 5 },
            { id: 'asset-4', name: '缓存策略优化', type: 'OPTIMIZATION', version: '1.2.0', quality: 88, reuse: 3 },
            { id: 'asset-5', name: '日志分析工具', type: 'TOOL', version: '1.0.0', quality: 85, reuse: 6 },
            { id: 'asset-6', name: '代码格式化工具', type: 'TOOL', version: '1.1.0', quality: 92, reuse: 15 },
            { id: 'asset-7', name: 'React技术栈', type: 'TECH_STACK', version: '18.0.0', quality: 96, reuse: 20 },
            { id: 'asset-8', name: 'Node.js服务框架', type: 'TECH_STACK', version: '1.0.0', quality: 93, reuse: 18 },
        ];

        const selectedAssets = [];

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.nav-links button').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${sectionId}`).style.display = 'block';
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                document.querySelector(`.nav-links button[onclick="showSection('${sectionId}')"]`).classList.add('active');
            }
            
            if (sectionId === 'tools') renderTools();
            if (sectionId === 'network') renderNetwork('linkage');
            if (sectionId === 'assets') renderAssets();
        }

        function renderTools() {
            const grid = document.getElementById('tool-grid');
            grid.innerHTML = tools.map(tool => `
                <div class="tool-card" onclick="showToast('已选择工具: ${tool.name}')">
                    <div class="tool-header">
                        <div class="tool-icon ${tool.type.toLowerCase()}">${tool.icon}</div>
                        <div class="tool-info">
                            <h3>${tool.name}</h3>
                            <span class="type-badge ${tool.type}">${tool.type === 'MODULE' ? '原子模块' : tool.type === 'COMPOSITE' ? '组合工具' : '独立工具'}</span>
                        </div>
                    </div>
                    <p class="tool-desc">${tool.desc}</p>
                    <div class="tool-tags">
                        ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function switchNetworkTab(tab) {
            document.querySelectorAll('.network-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderNetwork(tab);
        }

        function renderNetwork(type) {
            const canvas = document.getElementById('network-canvas');
            canvas.innerHTML = '';

            if (type === 'linkage') {
                const nodes = [
                    { id: '1', name: 'AI调度', type: 'module', x: 100, y: 200 },
                    { id: '2', name: '配置解析', type: 'module', x: 250, y: 100 },
                    { id: '3', name: '文件管理', type: 'module', x: 250, y: 300 },
                    { id: '4', name: 'Ollama', type: 'module', x: 400, y: 200 },
                    { id: '5', name: '代码生成', type: 'standalone', x: 550, y: 150 },
                    { id: '6', name: '代码审查', type: 'standalone', x: 550, y: 250 },
                    { id: '7', name: '工具组装', type: 'composite', x: 700, y: 200 },
                ];

                const links = [
                    { from: '1', to: '2' }, { from: '1', to: '3' }, { from: '1', to: '4' },
                    { from: '2', to: '4' }, { from: '3', to: '4' },
                    { from: '4', to: '5' }, { from: '4', to: '6' },
                    { from: '5', to: '7' }, { from: '6', to: '7' },
                ];

                links.forEach(link => {
                    const from = nodes.find(n => n.id === link.from);
                    const to = nodes.find(n => n.id === link.to);
                    const left = from.x + 40;
                    const width = to.x - from.x - 80;
                    const top = from.y;
                    canvas.innerHTML += `<div class="network-link" style="left: ${left}px; width: ${width}px; top: ${top}px;"></div>`;
                });

                nodes.forEach(node => {
                    canvas.innerHTML += `
                        <div class="network-node ${node.type}" style="left: ${node.x - 40}px; top: ${node.y - 40}px;" onclick="showToast('节点: ${node.name}')">
                            <div class="node-icon">${node.type === 'module' ? '🔧' : node.type === 'composite' ? '🧩' : '⚡'}</div>
                            <div class="node-label">${node.name}</div>
                        </div>
                    `;
                });
            } else {
                const nodes = [
                    { id: '1', name: '认证模块', type: 'asset', x: 150, y: 150 },
                    { id: '2', name: '加密组件', type: 'asset', x: 350, y: 100 },
                    { id: '3', name: '性能优化', type: 'asset', x: 550, y: 150 },
                    { id: '4', name: '缓存策略', type: 'asset', x: 250, y: 300 },
                    { id: '5', name: '日志工具', type: 'asset', x: 450, y: 300 },
                    { id: '6', name: '技术栈', type: 'asset', x: 350, y: 200 },
                ];

                const links = [
                    { from: '1', to: '6' }, { from: '2', to: '6' },
                    { from: '3', to: '4' }, { from: '4', to: '6' },
                    { from: '5', to: '6' }, { from: '3', to: '5' },
                ];

                links.forEach(link => {
                    const from = nodes.find(n => n.id === link.from);
                    const to = nodes.find(n => n.id === link.to);
                    const left = from.x + 40;
                    const width = to.x - from.x - 80;
                    const top = from.y;
                    canvas.innerHTML += `<div class="network-link" style="left: ${left}px; width: ${width}px; top: ${top}px; background: linear-gradient(90deg, #f59e0b, #8b5cf6);"></div>`;
                });

                nodes.forEach(node => {
                    canvas.innerHTML += `
                        <div class="network-node ${node.type}" style="left: ${node.x - 40}px; top: ${node.y - 40}px;" onclick="showToast('资产: ${node.name}')">
                            <div class="node-icon">📦</div>
                            <div class="node-label">${node.name}</div>
                        </div>
                    `;
                });
            }
        }

        function renderAssets() {
            const grid = document.getElementById('assets-grid');
            grid.innerHTML = assets.map(asset => `
                <div class="asset-card ${selectedAssets.includes(asset.id) ? 'selected' : ''}" onclick="toggleAsset('${asset.id}')">
                    <div class="asset-icon ${asset.type}">${asset.type === 'MODULE' ? '🧩' : asset.type === 'OPTIMIZATION' ? '⚡' : asset.type === 'TOOL' ? '🔧' : '🏗️'}</div>
                    <div class="asset-name">${asset.name}</div>
                    <div class="asset-type">${getTypeName(asset.type)} · v${asset.version}</div>
                    <div class="asset-metrics">
                        <span>质量: ${asset.quality}</span>
                        <span>复用: ${asset.reuse}</span>
                    </div>
                    <div class="asset-checkbox"></div>
                </div>
            `).join('');
        }

        function getTypeName(type) {
            const map = { MODULE: '模块化', OPTIMIZATION: '优化', TOOL: '工具', TECH_STACK: '技术栈' };
            return map[type] || type;
        }

        function toggleAsset(id) {
            const index = selectedAssets.indexOf(id);
            if (index >= 0) {
                selectedAssets.splice(index, 1);
            } else {
                selectedAssets.push(id);
            }
            renderAssets();
        }

        function openAssetPicker() {
            const grid = document.getElementById('picker-grid');
            grid.innerHTML = assets.map(asset => `
                <div class="tool-card ${selectedAssets.includes(asset.id) ? 'selected' : ''}" onclick="toggleAsset('${asset.id}')">
                    <div class="tool-header">
                        <div class="tool-icon ${asset.type.toLowerCase()}">${asset.type === 'MODULE' ? '🧩' : asset.type === 'OPTIMIZATION' ? '⚡' : asset.type === 'TOOL' ? '🔧' : '🏗️'}</div>
                        <div class="tool-info">
                            <h3>${asset.name}</h3>
                            <span class="type-badge ${asset.type}">${getTypeName(asset.type)}</span>
                        </div>
                    </div>
                    <p class="tool-desc">版本: ${asset.version} · 质量: ${asset.quality} · 复用: ${asset.reuse}</p>
                </div>
            `).join('');
            document.getElementById('asset-picker-modal').classList.add('active');
        }

        function closeAssetPicker() {
            document.getElementById('asset-picker-modal').classList.remove('active');
        }

        function confirmAssetSelection() {
            closeAssetPicker();
            if (selectedAssets.length > 0) {
                const names = selectedAssets.map(id => assets.find(a => a.id === id)?.name).join(', ');
                showToast(`已选择 ${selectedAssets.length} 个资产: ${names}`);
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';
            addMessage('bot', '正在思考...', true);

            setTimeout(() => {
                const responses = [
                    `我已理解你的需求！${selectedAssets.length > 0 ? '结合选中的资产，' : ''}我来帮你生成相关代码和方案。`,
                    `好的，这个需求很清晰。${selectedAssets.length > 0 ? '利用已选的资产交付物，' : ''}我将为你创建完整的实现方案。`,
                    `收到！${selectedAssets.length > 0 ? '基于你选择的资产，' : ''}我会生成最优的解决方案。`,
                ];
                const response = responses[Math.floor(Math.random() * responses.length)];
                updateLastMessage(response);
            }, 1500);
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function addMessage(sender, text, isLoading = false) {
            const container = document.getElementById('chat-messages');
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            message.innerHTML = `
                <div class="message-avatar">${sender === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">${isLoading ? '<span class="loading-dots"><span></span><span></span><span></span></span>' : text}</div>
            `;
            container.appendChild(message);
            container.scrollTop = container.scrollHeight;
            return message;
        }

        function updateLastMessage(text) {
            const container = document.getElementById('chat-messages');
            const lastMessage = container.lastElementChild;
            if (lastMessage) {
                lastMessage.querySelector('.message-content').innerHTML = text;
            }
        }

        function newChat() {
            document.getElementById('chat-messages').innerHTML = `
                <div class="message bot">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">你好！我是你的智能开发助手。请选择资产交付物或直接输入你的需求。</div>
                </div>
            `;
            showToast('已创建新对话');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        showSection('home');
    </script>
</body>
</html>
