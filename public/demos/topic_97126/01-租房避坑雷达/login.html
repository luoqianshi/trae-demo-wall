<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>租房避坑雷达 - 登录</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="app-frame">
  <div class="login-header">
    <div class="login-icon">🏠</div>
    <div class="login-title">租房避坑雷达</div>
    <div class="login-sub">AI 智能验房，让中介不敢再坑你</div>
  </div>

  <div class="login-form">
    <div class="form-group">
      <label class="form-label">账号</label>
      <input type="text" class="form-input" id="username" placeholder="请输入手机号或邮箱">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" id="password" placeholder="请输入密码">
    </div>
    <div class="form-group" style="text-align:right">
      <button class="btn-secondary" style="padding:0;width:auto;color:var(--accent)">忘记密码？</button>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="loginBtn" onclick="handleLogin(event)">登录</button>
    </div>
    <div class="divider">
      <span class="divider-text">其他登录方式</span>
    </div>
    <div class="social-login">
      <button class="social-btn" onclick="handleSocialLogin(event, 'wechat')">💬</button>
      <button class="social-btn" onclick="handleSocialLogin(event, 'alipay')">💳</button>
      <button class="social-btn" onclick="handleSocialLogin(event, 'qq')">🐧</button>
    </div>
    <div style="text-align:center;margin-top:2rem">
      <span class="btn-secondary" style="padding:0;width:auto">
        还没有账号？<span style="color:var(--accent)">立即注册</span>
      </span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
