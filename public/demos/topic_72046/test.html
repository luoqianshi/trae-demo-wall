<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>呼吸岛</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-top:#fce8df;--bg-mid:#f5e8dc;--bg-bot:#faf6f0;
  --fg:#2e2a26;--fg2:#5a5550;--muted:#8a8580;--subtle:#b5aea6;
  --accent:#e07a3a;--accent-dark:#c4602a;--accent-light:#f5c9a8;
  --accent-glow:rgba(224,122,58,.14);
  --card:rgba(255,250,244,.68);--border:rgba(200,188,172,.35);
  --radius:16px;--radius-lg:22px;
  --shadow-sm:0 2px 8px rgba(46,42,38,.04);
  --shadow-md:0 4px 20px rgba(46,42,38,.07);
  --shadow-lg:0 12px 40px rgba(46,42,38,.1);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--fg);line-height:1.65;min-height:100vh;overflow-x:hidden;
  background:var(--bg-bot);
  opacity:0;animation:bodyIn .9s var(--ease) forwards;
}
@keyframes bodyIn{to{opacity:1}}

/* ═══ ISLAND AREA ═══ */
.island-area{
  position:relative;width:100%;height:min(480px,65vh);overflow:hidden;
  background:linear-gradient(180deg,#fce4d4 0%,#f5e0cc 20%,#e8d8c4 45%,#d4cfc4 70%,#c8d8e0 100%);
}
.island-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#fce4d4 0%,#f2dac4 25%,#e8d4c0 50%,#c8d8e0 100%);
}
.island-sun{
  position:absolute;top:12%;right:20%;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#f8d8a0,#f0b060 60%,#e89a40);
  box-shadow:0 0 60px rgba(240,176,96,.35),0 0 120px rgba(240,176,96,.12);
  animation:sunPulse 6s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{box-shadow:0 0 60px rgba(240,176,96,.35),0 0 120px rgba(240,176,96,.12)}50%{box-shadow:0 0 80px rgba(240,176,96,.45),0 0 150px rgba(240,176,96,.18)}}

.island-water{
  position:absolute;bottom:0;left:0;right:0;height:22%;
  background:linear-gradient(180deg,rgba(180,200,210,.3),rgba(160,190,210,.5),rgba(140,180,200,.6));
}
.island-water::after{
  content:'';position:absolute;inset:0;opacity:.3;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.2) 3px,rgba(255,255,255,.2) 4px);
  animation:waterShimmer 8s linear infinite;
}
@keyframes waterShimmer{0%{background-position:0 0}100%{background-position:0 16px}}

.island-ground{
  position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
  width:min(340px,70vw);height:100px;
  background:linear-gradient(180deg,#c8b898 0%,#b8a880 50%,#a89870 100%);
  border-radius:180px 180px 0 0 / 50px 50px 0 0;
  box-shadow:0 4px 20px rgba(100,80,50,.15);
}
.island-ground::before{
  content:'';position:absolute;top:-12px;left:10%;right:10%;height:16px;
  background:linear-gradient(180deg,#7ab868,#6aa858);border-radius:50%;
}

/* plants */
.island-plants{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);width:min(340px,70vw);height:120px;pointer-events:none}
.plant{position:absolute;bottom:0;transform-origin:bottom center;animation:growUp .8s var(--ease) forwards}
@keyframes growUp{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

.plant-grass{
  width:6px;border-radius:3px 3px 0 0;
  background:linear-gradient(180deg,#8cc878,#5a9848);
}
.plant-grass.g1{left:28%;height:22px;animation-delay:.1s}
.plant-grass.g2{left:34%;height:16px;animation-delay:.15s}
.plant-grass.g3{left:62%;height:20px;animation-delay:.12s}
.plant-grass.g4{left:68%;height:14px;animation-delay:.18s}

.plant-flower{position:absolute;bottom:20px;animation:growUp .8s var(--ease) .2s forwards}
.plant-flower .stem{width:2px;height:28px;background:#6aa858;margin:0 auto}
.plant-flower .petal{width:14px;height:14px;border-radius:50%;margin:-4px auto 0}
.plant-flower.f1{left:26%}.plant-flower.f1 .petal{background:#f0a0b0;box-shadow:0 0 8px rgba(240,160,176,.4)}
.plant-flower.f2{left:58%}.plant-flower.f2 .petal{background:#f8d080;box-shadow:0 0 8px rgba(248,208,128,.4)}
.plant-flower.f3{left:70%}.plant-flower.f3 .petal{background:#e8a0d0;box-shadow:0 0 8px rgba(232,160,208,.4)}

.plant-tree{position:absolute;bottom:0;left:42%;animation:growUp .9s var(--ease) .15s forwards}
.plant-tree .trunk{width:5px;height:40px;background:#8b6f4e;margin:0 auto;border-radius:2px 2px 0 0}
.plant-tree .crown{
  width:50px;height:44px;background:radial-gradient(ellipse at 50% 60%,#6db858,#4a9038);
  border-radius:50%;margin:-8px auto 0;
  box-shadow:0 0 16px rgba(74,144,56,.2);
}

.plant-bird{
  position:absolute;font-size:14px;
  animation:birdFloat 3s ease-in-out infinite;
}
.plant-bird.b1{bottom:60px;left:46%;animation-delay:0s}
.plant-bird.b2{bottom:52px;left:52%;animation-delay:1.5s}
@keyframes birdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* greeting */
.island-greeting{
  position:absolute;top:8%;left:50%;transform:translateX(-50%);
  font-size:clamp(.9rem,2vw,1.1rem);color:var(--fg);font-weight:600;
  text-align:center;white-space:nowrap;
  text-shadow:0 1px 4px rgba(255,255,255,.5);
  animation:greetIn 1s var(--ease) .3s both;
}
@keyframes greetIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ═══ MAIN CONTENT ═══ */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 20px 80px}

/* ═══ THREE CORNERS ═══ */
.corners{margin-top:-30px;position:relative;z-index:2}
.corner-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  cursor:pointer;transition:all .25s var(--ease);
  display:flex;align-items:center;gap:14px;
}
.corner-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:rgba(224,122,58,.2)}
.corner-card:active{transform:scale(.98)}
.corner-icon{font-size:2rem;flex-shrink:0;width:48px;text-align:center}
.corner-info{flex:1}
.corner-title{font-size:1.05rem;font-weight:700;color:var(--fg);margin-bottom:2px}
.corner-desc{font-size:.82rem;color:var(--muted);line-height:1.4}
.corner-arrow{font-size:1.2rem;color:var(--subtle);flex-shrink:0}

/* ═══ PAGE TRANSITIONS ═══ */
.page{display:none;padding:24px 0}
.page.active{display:block;animation:pageIn .5s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

/* ═══ SUB-PAGE COMMON ═══ */
.back-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;cursor:pointer;color:var(--muted);font-size:.88rem;font-weight:500}
.back-bar:hover{color:var(--accent)}
.sub-page-title{font-size:1.3rem;font-weight:700;color:var(--fg);text-align:center;margin-bottom:20px}

/* ═══ MOVE MODE ═══ */
.task-card{
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow-md);
  text-align:center;
}
.task-text{font-size:1.1rem;font-weight:700;line-height:1.85;color:var(--fg)}

.timer-wrap{position:relative;width:200px;height:200px;margin:0 auto 16px}
.timer-wrap svg{width:200px;height:200px;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.timer-ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(224,122,58,.25))}
.timer-glow{fill:none;stroke:var(--accent);stroke-width:16;stroke-linecap:round;opacity:.08;filter:blur(6px)}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-digits{font-size:2.6rem;font-weight:800;color:var(--fg);letter-spacing:.02em;line-height:1}
.timer-sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.timer-label{font-size:.88rem;color:var(--muted);margin-bottom:8px;text-align:center;min-height:1.4em}
.timer-ticks{fill:none;stroke:var(--border);stroke-width:1.2;stroke-linecap:round}

.btn-skip{
  display:block;margin:8px auto 0;padding:6px 18px;border-radius:40px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s;
}
.btn-skip:hover{border-color:var(--accent);color:var(--accent)}

/* done */
.done-text{font-size:1.1rem;font-weight:700;text-align:center;line-height:1.85;color:var(--fg);margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}
.feeling-input{
  width:100%;max-width:380px;padding:14px 16px;margin:0 auto 18px;display:block;
  border:1.5px solid var(--border);border-radius:14px;background:var(--card);
  backdrop-filter:blur(8px);font-size:.95rem;color:var(--fg);resize:none;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.feeling-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}

.btn-primary{
  display:inline-flex;align-items:center;gap:8px;margin:0 auto;
  padding:14px 40px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;border-radius:40px;font-size:1.05rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 24px rgba(224,122,58,.3);transition:transform .2s var(--ease),box-shadow .2s;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(224,122,58,.4)}
.btn-primary:active{transform:scale(.96)}

/* AI response */
.ai-response{
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:22px 24px;margin:20px auto 0;max-width:440px;
  text-align:left;position:relative;overflow:hidden;
}
.ai-response::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-light),var(--accent),var(--accent-light))}
.ai-label{font-size:.68rem;color:var(--accent);font-weight:700;margin-bottom:6px;letter-spacing:.1em}
.ai-text{font-size:1rem;line-height:1.85;color:var(--fg)}

.btn-outline{
  display:inline-flex;align-items:center;gap:6px;margin:20px auto 0;
  padding:10px 28px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);
  border-radius:40px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .25s;
}
.btn-outline:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}

/* ═══ BREATHE MODE ═══ */
.breathe-circle{
  width:180px;height:180px;margin:0 auto 24px;border-radius:50%;
  background:radial-gradient(circle at 45% 45%,rgba(245,201,168,.5),rgba(224,122,58,.3) 60%,transparent 70%);
  box-shadow:0 0 60px rgba(224,122,58,.15),0 0 120px rgba(224,122,58,.06);
  transition:transform 4s ease-in-out,opacity 4s ease-in-out,box-shadow 4s ease-in-out;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.breathe-circle::after{
  content:'';position:absolute;inset:-16px;border-radius:50%;
  border:2px solid rgba(224,122,58,.08);transition:all 4s ease-in-out;
}
.breathe-circle.inhale{transform:scale(1.3);box-shadow:0 0 80px rgba(224,122,58,.25),0 0 160px rgba(224,122,58,.1)}
.breathe-circle.inhale::after{inset:-24px;border-color:rgba(224,122,58,.15)}
.breathe-circle.hold{transform:scale(1.3);opacity:.9}
.breathe-circle.exhale{transform:scale(.65);box-shadow:0 0 30px rgba(224,122,58,.08)}
.breathe-circle.exhale::after{inset:-8px;border-color:rgba(224,122,58,.04)}
.breathe-label{font-size:1.3rem;font-weight:700;color:var(--fg);text-align:center;margin-bottom:20px;min-height:2em}

.ambient-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.amb-btn{
  padding:8px 14px;border-radius:40px;border:1.5px solid var(--border);background:transparent;
  font-size:.84rem;color:var(--fg2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;
}
.amb-btn:hover{border-color:var(--accent-light);background:var(--accent-glow)}
.amb-btn.active{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}

/* ═══ TALK MODE ═══ */
.talk-input{
  width:100%;max-width:440px;padding:16px;margin:0 auto 16px;display:block;
  border:1.5px solid var(--border);border-radius:14px;background:var(--card);
  backdrop-filter:blur(8px);font-size:.95rem;color:var(--fg);resize:none;outline:none;
  transition:border-color .2s,box-shadow .2s;line-height:1.7;min-height:100px;
}
.talk-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.talk-prompt{font-size:.88rem;color:var(--muted);text-align:center;margin-bottom:12px;font-weight:500}
.talk-responses{margin-top:20px;max-width:460px;margin-left:auto;margin-right:auto}
.talk-msg{text-align:right;margin-bottom:8px}
.talk-msg .bubble{display:inline-block;background:var(--accent-glow);color:var(--fg);padding:10px 16px;border-radius:16px 16px 4px 16px;font-size:.9rem;max-width:80%}
.talk-reply{text-align:left;margin-bottom:14px;animation:msgIn .4s var(--ease)}
.talk-reply .bubble{display:inline-block;background:var(--card);border:1px solid var(--border);padding:12px 16px;border-radius:4px 16px 16px 16px;font-size:.9rem;max-width:85%;line-height:1.7;color:var(--fg)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══ LOG ═══ */
.log-section{margin-top:40px;padding-top:28px;border-top:1px solid var(--border)}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.log-title{font-size:1.1rem;font-weight:700;color:var(--fg)}
.btn-clear{
  padding:4px 12px;border-radius:40px;border:1px solid var(--border);background:transparent;
  font-size:.76rem;color:var(--muted);cursor:pointer;transition:all .2s;
}
.btn-clear:hover{border-color:var(--accent);color:var(--accent)}
.log-empty{font-size:.88rem;color:var(--subtle);padding:16px 0;text-align:center}
.log-card{
  background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:16px 20px;margin-bottom:12px;text-align:left;
  animation:msgIn .4s var(--ease);
}
.log-card .log-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.log-card .log-content{font-size:.9rem;font-weight:600;color:var(--fg);flex:1;line-height:1.5}
.log-card .log-meta{display:flex;gap:8px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
.log-card .log-time{font-size:.7rem;color:var(--subtle)}
.log-card .log-type{font-size:.7rem;padding:2px 8px;border-radius:20px;background:var(--accent-glow);color:var(--accent-dark);font-weight:600}
.log-card .log-ai{font-size:.85rem;color:var(--fg2);line-height:1.7;border-left:2px solid var(--accent-light);padding-left:10px}
.log-card .log-feeling{font-size:.8rem;color:var(--muted);margin-top:6px;font-style:italic}

.whisper{
  margin-top:20px;padding-top:16px;border-top:1px dashed rgba(200,188,172,.3);
  font-size:.76rem;color:var(--subtle);line-height:2;text-align:center;letter-spacing:.02em;
}
.whisper strong{color:var(--accent-dark);font-weight:600}

.burst-ring{
  position:fixed;top:50%;left:50%;z-index:100;pointer-events:none;
  width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);
  animation:burstRing .9s var(--ease) forwards;
}
@keyframes burstRing{0%{transform:translate(-50%,-50%) scale(1);opacity:1;border-width:3px}100%{transform:translate(-50%,-50%) scale(50);opacity:0;border-width:1px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:480px){
  .island-area{height:min(380px,55vh)}
  .timer-wrap{width:170px;height:170px}.timer-wrap svg{width:170px;height:170px}
  .timer-digits{font-size:2.2rem}
  .breathe-circle{width:150px;height:150px}
}
@media(min-width:768px){.app{max-width:600px;padding:0 24px 100px}}
</style>
</head>
<body>

<!-- ═══ ISLAND ═══ -->
<div class="island-area" id="islandArea">
  <div class="island-sky"></div>
  <div class="island-sun"></div>
  <div class="island-water"></div>
  <div class="island-ground"></div>
  <div class="island-plants" id="islandPlants"></div>
  <div class="island-greeting" id="islandGreeting"></div>
</div>

<div class="app">

  <!-- ═══ THREE CORNERS (HOME) ═══ -->
  <div class="page active" id="homePage">
    <div class="corners">
      <div class="corner-card" onclick="openMode('move')">
        <div class="corner-icon">🏃</div>
        <div class="corner-info">
          <div class="corner-title">动一动</div>
          <div class="corner-desc">身体先下班</div>
        </div>
        <div class="corner-arrow">→</div>
      </div>
      <div class="corner-card" onclick="openMode('breathe')">
        <div class="corner-icon">🧘</div>
        <div class="corner-info">
          <div class="corner-title">静一静</div>
          <div class="corner-desc">只听呼吸</div>
        </div>
        <div class="corner-arrow">→</div>
      </div>
      <div class="corner-card" onclick="openMode('talk')">
        <div class="corner-icon">💬</div>
        <div class="corner-info">
          <div class="corner-title">说一说</div>
          <div class="corner-desc">碎碎念树洞</div>
        </div>
        <div class="corner-arrow">→</div>
      </div>
    </div>
  </div>

  <!-- ═══ MODE: MOVE ═══ -->
  <div class="page" id="movePage">
    <div class="page" id="moveStart">
      <div class="back-bar" onclick="goHome()">← 回到岛上</div>
      <div class="sub-page-title">🏃 动一动 · 身体先下班</div>
      <div class="task-card">
        <div class="task-text" id="moveTaskText"></div>
      </div>
      <div class="timer-wrap">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5c9a8"/><stop offset="50%" stop-color="#e07a3a"/><stop offset="100%" stop-color="#c4602a"/>
            </linearGradient>
          </defs>
          <circle class="timer-ring-bg" cx="100" cy="100" r="88"/>
          <g id="moveTickMarks" class="timer-ticks"></g>
          <circle class="timer-glow" id="moveGlow" cx="100" cy="100" r="88"/>
          <circle class="timer-ring-fg" id="moveRing" cx="100" cy="100" r="88"/>
        </svg>
        <div class="timer-center">
          <div class="timer-digits" id="moveDigits">3:00</div>
          <div class="timer-sub" id="moveSub"></div>
        </div>
      </div>
      <div class="timer-label" id="moveLabel">慢慢来，不着急</div>
      <button class="btn-skip" onclick="skipMoveTimer()">跳过倒计时</button>
    </div>
    <div class="page" id="moveDone">
      <div class="done-text" id="moveDoneText"></div>
      <p style="text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:4px">写下你现在的感受（可选）</p>
      <textarea class="feeling-input" id="moveFeeling" rows="3" placeholder="比如：窗外的风好舒服…"></textarea>
      <div style="text-align:center"><button class="btn-primary" onclick="completeMove()">我做到了</button></div>
    </div>
    <div class="page" id="moveResponse">
      <div class="ai-response">
        <div class="ai-label">呼吸岛回信</div>
        <div class="ai-text" id="moveAiText"></div>
      </div>
      <div style="text-align:center"><button class="btn-outline" onclick="goHome()">回到岛上</button></div>
    </div>
  </div>

  <!-- ═══ MODE: BREATHE ═══ -->
  <div class="page" id="breathePage">
    <div class="back-bar" onclick="stopBreatheAmbient();goHome()">← 回到岛上</div>
    <div class="sub-page-title">🧘 静一静 · 只听呼吸</div>
    <div class="breathe-circle" id="breatheCircle"></div>
    <div class="breathe-label" id="breatheLabel">吸气…</div>
    <div class="ambient-row" id="breatheAmbRow"></div>
    <div style="text-align:center;margin-top:20px">
      <button class="btn-primary" onclick="completeBreathe()">我放松好了</button>
    </div>
  </div>

  <!-- ═══ MODE: TALK ═══ -->
  <div class="page" id="talkPage">
    <div class="back-bar" onclick="goHome()">← 回到岛上</div>
    <div class="sub-page-title">💬 说一说 · 碎碎念树洞</div>
    <p class="talk-prompt">今天想说什么都可以，开心的、烦的、无聊的，我都在听</p>
    <textarea class="talk-input" id="talkInput" rows="3" placeholder="说点什么吧…"></textarea>
    <div style="text-align:center"><button class="btn-primary" onclick="talkSubmit()">扔进树洞</button></div>
    <div class="talk-responses" id="talkResponses"></div>
  </div>

  <!-- ═══ LOG ═══ -->
  <div class="log-section" id="logSection">
    <div class="log-header">
      <div class="log-title">放松日志</div>
      <button class="btn-clear" onclick="clearLog()">清空</button>
    </div>
    <div id="logList"></div>
    <div class="whisper" id="whisper"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const MOVE_TASKS=[
  '站起来，走到最近的窗户，数一数窗外有几棵树，回来告诉我',
  '把桌上的东西按颜色从浅到深重新排列，拍张照片',
  '闭上眼睛，听你周围最远的一个声音，猜猜它是什么',
  '去接一杯水，慢慢喝完，感受水流过喉咙的温度',
  '在纸上随便画一个图案，不用好看，画完就行',
  '站起来伸三个懒腰，一次比一次慢',
  '看看窗外，找到一朵云，给它起个名字',
  '对你旁边的同事/同学说一句真诚的夸奖',
  '整理你手机里最近拍的3张照片，删掉不想留的',
  '在手心写一个字，握紧拳头，感受它',
  '离开座位，走最远的路去上个厕所',
  '把手机屏幕朝下放3分钟，看看周围',
  '找到你周围的一个直角（桌子角、窗户角），用眼睛描一遍它的轮廓',
  '回想今天发生的让你嘴角动了一下的一件事',
  '把椅子调低，让脚完全踩在地上，感受脚底',
  '站起来，双手抱住自己，给自己一个拥抱，保持五秒',
  '找一张纸，写下一个你最想见的人的名字',
  '轻轻握拳再慢慢张开，感受手指一根一根松开的感觉',
  '走到窗边，用手指在玻璃上画一个小太阳',
  '对身边一件物品说一声谢谢，它一直在为你服务',
];

const AMBIENTS=[
  {id:'none',label:'关闭',emoji:'🔇'},
  {id:'rain',label:'雨声',emoji:'🌧️'},
  {id:'wave',label:'海浪',emoji:'🌊'},
  {id:'fire',label:'篝火',emoji:'🔥'},
];

const R=88;const CIRC=2*Math.PI*R;

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let usageCount=0, logs=[], lastTasks=[], lastVisitDate=null;
let currentTask='', moveTimer=null, moveRemaining=0;
let breathePhase='inhale', breatheTimer=null, breatheInterval=null;
let ambCtx=null, ambSource=null, ambGain=null, selectedAmb='none';
let talkMessages=[];
let currentMode='';

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init(){
  usageCount=parseInt(localStorage.getItem('island_usage_count')||'0');
  const ls=localStorage.getItem('island_logs');if(ls)logs=JSON.parse(ls);
  const lt=localStorage.getItem('island_last_tasks');if(lt)lastTasks=JSON.parse(lt);
  const lv=localStorage.getItem('island_last_visit');if(lv)lastVisitDate=lv;

  updateIsland();
  renderAmbients();
  renderTickMarks();
  renderLog();

  // 更新今日访问
  const today=new Date().toLocaleDateString('zh-CN');
  localStorage.setItem('island_last_visit',today);
}

function saveData(){
  localStorage.setItem('island_usage_count',usageCount);
  localStorage.setItem('island_logs',JSON.stringify(logs));
  localStorage.setItem('island_last_tasks',JSON.stringify(lastTasks));
}

// ═══════════════════════════════════════════
// ISLAND
// ═══════════════════════════════════════════
function updateIsland(){
  // greeting
  const today=new Date().toLocaleDateString('zh-CN');
  const greet=document.getElementById('islandGreeting');
  if(!lastVisitDate||lastVisitDate!==today){
    greet.textContent='累了就停下来，这座岛一直在';
  }else{
    const todayLogs=logs.filter(l=>new Date(l.time).toLocaleDateString('zh-CN')===today);
    if(todayLogs.length>=2)greet.textContent='又来了呀，今天一定很辛苦吧';
    else greet.textContent='今天已经来过一次了，欢迎回来';
  }
  // check days since last visit
  if(lastVisitDate&&lastVisitDate!==today){
    const last=new Date(lastVisitDate);const now=new Date();
    const diffDays=Math.floor((now-last)/86400000);
    if(diffDays>=5)greet.textContent=`${diffDays}天没见了，岛上的花想你了`;
  }

  // plants
  const plants=document.getElementById('islandPlants');
  let html='';
  if(usageCount>=1){
    html+='<div class="plant plant-grass g1"></div><div class="plant plant-grass g2"></div><div class="plant plant-grass g3"></div><div class="plant plant-grass g4"></div>';
  }
  if(usageCount>=3){
    html+='<div class="plant plant-flower f1"><div class="stem"></div><div class="petal"></div></div><div class="plant plant-flower f2"><div class="stem"></div><div class="petal"></div></div>';
  }
  if(usageCount>=7){
    html+='<div class="plant plant-flower f3"><div class="stem"></div><div class="petal"></div></div>';
    html+='<div class="plant plant-tree"><div class="trunk"></div><div class="crown"></div></div>';
  }
  if(usageCount>=15){
    html+='<div class="plant plant-bird b1">🐦</div>';
  }
  if(usageCount>=30){
    html+='<div class="plant plant-bird b2">🐦</div>';
  }
  plants.innerHTML=html;
}

function growIsland(){
  usageCount++;
  saveData();
  updateIsland();
  // 动画：植物重新长一遍
  const plants=document.getElementById('islandPlants');
  plants.querySelectorAll('.plant').forEach(p=>{p.style.animation='none';p.offsetHeight;p.style.animation=''});
}

// ── 调试：在浏览器控制台调用 debugSetCount(n) 直接跳转到对应阶段 ──
// 例如：debugSetCount(7)  → 长出小树
//       debugSetCount(30) → 两只小鸟
//       debugSetCount(0)  → 重置为空地
window.debugSetCount=function(n){
  usageCount=n;
  saveData();
  updateIsland();
  console.log(`🌿 岛屿使用次数已设为 ${n}，刷新页面查看植物生长动画`);
  // 重新触发植物生长动画
  const plants=document.getElementById('islandPlants');
  plants.querySelectorAll('.plant').forEach(p=>{p.style.animation='none';p.offsetHeight;p.style.animation=''});
};
window.debugReset=function(){
  usageCount=0;logs=[];lastTasks=[];
  saveData();updateIsland();renderLog();
  console.log('🔄 已重置所有数据');
};
// 快速点击岛屿问候语 5 次打开简易调试面板
let greetClicks=0,greetClickTimer=null;
document.getElementById('islandGreeting').addEventListener('click',()=>{
  greetClicks++;
  clearTimeout(greetClickTimer);
  greetClickTimer=setTimeout(()=>{greetClicks=0},800);
  if(greetClicks>=5){
    greetClicks=0;
    const n=prompt('🌿 调试：设置岛屿使用次数\n\n0=空地 | 1=小草 | 3=小花 | 7=小树 | 15=小鸟 | 30=两只鸟\n\n当前次数：'+usageCount,usageCount);
    if(n!==null&&!isNaN(parseInt(n))){
      debugSetCount(parseInt(n));
      location.reload();
    }
  }
});

// ═══════════════════════════════════════════
// TICK MARKS
// ═══════════════════════════════════════════
function renderTickMarks(){
  const g=document.getElementById('moveTickMarks');
  let html='';
  for(let i=0;i<60;i++){
    const a=(i/60)*360-90;const rad=a*Math.PI/180;
    const isMajor=i%5===0;
    const inner=isMajor?80:84;const outer=88;
    const x1=100+inner*Math.cos(rad),y1=100+inner*Math.sin(rad);
    const x2=100+outer*Math.cos(rad),y2=100+outer*Math.sin(rad);
    html+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="opacity:${isMajor?.35:.12}"/>`;
  }
  g.innerHTML=html;
}

// ═══════════════════════════════════════════
// PAGE NAV
// ═══════════════════════════════════════════
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById(id);
  if(el)el.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function showSubPage(parentId,subId){
  const parent=document.getElementById(parentId);
  if(!parent)return;
  parent.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById(subId);
  if(el)el.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){
  stopAmbient();
  clearInterval(breatheInterval);
  clearInterval(moveTimer);
  showPage('homePage');
  renderLog();
}

// ═══════════════════════════════════════════
// OPEN MODE
// ═══════════════════════════════════════════
function openMode(mode){
  currentMode=mode;
  if(mode==='move'){
    showPage('movePage');
    showSubPage('movePage','moveStart');
    startMove();
  }else if(mode==='breathe'){
    showPage('breathePage');
    startBreathe();
  }else if(mode==='talk'){
    showPage('talkPage');
    talkMessages=[];
    document.getElementById('talkInput').value='';
    document.getElementById('talkResponses').innerHTML='';
  }
}

// ═══════════════════════════════════════════
// AMBIENT SOUND
// ═══════════════════════════════════════════
function renderAmbients(){
  document.getElementById('breatheAmbRow').innerHTML=AMBIENTS.map(a=>
    `<button class="amb-btn" data-amb="${a.id}" onclick="selectAmbient('${a.id}')"><span>${a.emoji}</span>${a.label}</button>`
  ).join('');
  selectAmbient('none');
}
function selectAmbient(id){
  selectedAmb=id;
  document.querySelectorAll('[data-amb]').forEach(b=>b.classList.toggle('active',b.dataset.amb===id));
  if(id==='none'){stopAmbient();return}
  startAmbient(id);
}
function startAmbient(id){
  try{
    if(!ambCtx)ambCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(ambSource){ambSource.stop();ambSource=null}
    const sr=ambCtx.sampleRate,len=sr*4;
    const buf=ambCtx.createBuffer(1,len,sr),data=buf.getChannelData(0);
    if(id==='rain'){for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*.15+(Math.random()*2-1)*.05*Math.sin(i/sr*2*Math.PI*800)}
    else if(id==='wave'){for(let i=0;i<len;i++){const t=i/sr;data[i]=Math.sin(t*2*Math.PI*.3)*Math.sin(t*2*Math.PI*120)*.2+(Math.random()*2-1)*.03}}
    else if(id==='fire'){for(let i=0;i<len;i++){data[i]=(Math.random()*2-1)*.1*(1+Math.sin(i/sr*2*Math.PI*2))+(Math.random()*2-1)*.03}}
    ambSource=ambCtx.createBufferSource();ambSource.buffer=buf;ambSource.loop=true;
    ambGain=ambCtx.createGain();ambGain.gain.value=.5;
    ambSource.connect(ambGain).connect(ambCtx.destination);ambSource.start();
  }catch(e){}
}
function stopAmbient(){try{if(ambSource){ambSource.stop();ambSource=null}}catch(e){}}
function stopBreatheAmbient(){stopAmbient();selectedAmb='none';renderAmbients()}

// ═══════════════════════════════════════════
// MODE: MOVE
// ═══════════════════════════════════════════
function startMove(){
  let pool=MOVE_TASKS.filter(t=>!lastTasks.includes(t));
  if(!pool.length)pool=MOVE_TASKS;
  currentTask=pool[Math.floor(Math.random()*pool.length)];
  lastTasks.push(currentTask);if(lastTasks.length>3)lastTasks.shift();
  localStorage.setItem('island_last_tasks',JSON.stringify(lastTasks));

  document.getElementById('moveTaskText').textContent=currentTask;
  document.getElementById('moveDoneText').textContent=currentTask;
  document.getElementById('moveFeeling').value='';

  const ring=document.getElementById('moveRing'),glow=document.getElementById('moveGlow');
  ring.style.strokeDasharray=CIRC;ring.style.strokeDashoffset=CIRC;
  glow.style.strokeDasharray=CIRC;glow.style.strokeDashoffset=CIRC;
  moveRemaining=180;
  updateMoveDisplay();
  const labels=['慢慢来，不着急','享受这一刻','你做得很好','快到了哦','马上就好啦'];
  clearInterval(moveTimer);
  moveTimer=setInterval(()=>{
    moveRemaining--;if(moveRemaining<0)moveRemaining=0;
    updateMoveDisplay();
    const progress=1-moveRemaining/180,offset=CIRC*(1-progress);
    ring.style.strokeDashoffset=offset;glow.style.strokeDashoffset=offset;
    const li=Math.min(Math.floor(progress*labels.length),labels.length-1);
    document.getElementById('moveLabel').textContent=labels[li];
    if(moveRemaining<=0){clearInterval(moveTimer);showSubPage('movePage','moveDone')}
  },1000);
}
function updateMoveDisplay(){
  const m=Math.floor(moveRemaining/60),s=moveRemaining%60;
  document.getElementById('moveDigits').textContent=m+':'+String(s).padStart(2,'0');
  const pct=Math.round((1-moveRemaining/180)*100);
  document.getElementById('moveSub').textContent=pct>0?`已完成 ${pct}%`:'';
}
function skipMoveTimer(){clearInterval(moveTimer);showSubPage('movePage','moveDone')}
function completeMove(){
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const b=document.createElement('div');b.className='burst-ring';
      b.style.borderColor=i%2?'var(--accent-light)':'var(--accent)';
      document.body.appendChild(b);setTimeout(()=>b.remove(),1000);
    },i*150);
  }
  const feeling=document.getElementById('moveFeeling').value.trim();
  const ai=generateMoveResponse(currentTask,feeling);
  document.getElementById('moveAiText').textContent=ai;
  showSubPage('movePage','moveResponse');
  logs.unshift({type:'move',task:currentTask,feeling,ai,time:new Date().toLocaleString('zh-CN'),ts:Date.now()});
  saveData();growIsland();renderLog();
}

// ═══════════════════════════════════════════
// MODE: BREATHE
// ═══════════════════════════════════════════
function startBreathe(){
  const circle=document.getElementById('breatheCircle');
  const label=document.getElementById('breatheLabel');
  circle.className='breathe-circle';label.textContent='吸气…';
  clearInterval(breatheInterval);
  breathePhase='inhale';
  let phaseTime=0;
  breatheInterval=setInterval(()=>{
    phaseTime++;
    if(breathePhase==='inhale'&&phaseTime>=4){breathePhase='hold';circle.className='breathe-circle hold';label.textContent='屏住…'}
    else if(breathePhase==='hold'&&phaseTime>=8){breathePhase='exhale';circle.className='breathe-circle exhale';label.textContent='呼气…'}
    else if(breathePhase==='exhale'&&phaseTime>=12){breathePhase='inhale';circle.className='breathe-circle inhale';label.textContent='吸气…';phaseTime=0}
    else if(breathePhase==='inhale'&&phaseTime===1){circle.className='breathe-circle inhale';label.textContent='吸气…'}
  },1000);
  setTimeout(()=>{circle.className='breathe-circle inhale';label.textContent='吸气…'},100);
}
function completeBreathe(){
  stopAmbient();clearInterval(breatheInterval);
  const ai=generateBreatheResponse();
  const logEntry={type:'breathe',task:'呼吸练习',feeling:'',ai,time:new Date().toLocaleString('zh-CN'),ts:Date.now()};
  logs.unshift(logEntry);saveData();growIsland();renderLog();
  // 显示回应
  document.getElementById('breatheCircle').style.display='none';
  document.getElementById('breatheLabel').innerHTML=`<div class="ai-response" style="margin:0 auto"><div class="ai-label">呼吸岛回信</div><div class="ai-text">${ai}</div></div>`;
  document.querySelector('#breathePage .ambient-row').style.display='none';
  const btn=document.querySelector('#breathePage .btn-primary');
  btn.textContent='回到岛上';btn.onclick=goHome;
}

// ═══════════════════════════════════════════
// MODE: TALK
// ═══════════════════════════════════════════
function talkSubmit(){
  const input=document.getElementById('talkInput');
  const text=input.value.trim();if(!text)return;
  const resp=document.getElementById('talkResponses');
  resp.innerHTML+=`<div class="talk-msg"><div class="bubble">${esc(text)}</div></div>`;
  const ai=generateTalkResponse(text);
  setTimeout(()=>{
    resp.innerHTML+=`<div class="talk-reply"><div class="bubble">${ai}</div></div>`;
    resp.scrollIntoView({behavior:'smooth',block:'end'});
  },400);
  input.value='';
  logs.unshift({type:'talk',task:text,feeling:'',ai,time:new Date().toLocaleString('zh-CN'),ts:Date.now()});
  saveData();growIsland();renderLog();
}

// ═══════════════════════════════════════════
// AI RESPONSES
// ═══════════════════════════════════════════
function generateMoveResponse(task,feeling){
  const R={
    '树':['窗外那几棵树今天被你看了一眼。你给了自己一个看世界的间隙，也给了世界一个被看见的机会。','数树的时候，你的眼睛终于不在屏幕上了。那几棵树站在风里，你站在窗边，这画面本身就很好。'],

    '懒腰':['三个懒腰，一个比一个慢。到第三个的时候，你是不是觉得身体变轻了？那是你的脊柱在感谢你。','懒腰比咖啡诚实。咖啡让你觉得不困，懒腰让你真的不那么紧了。'],

    '直角':['用眼睛描直角，你给自己的眼睛安排了一个小任务。它平时只盯着屏幕，今天终于自由了半分钟。','那个直角一直在这里，你今天第一次用眼睛画了它一遍。它被看见了。'],
    '嘴角':['回想让你嘴角动了一下的事，你是不是又笑了一下？那个瞬间是你今天最真实的几秒。','有一件事让你今天嘴角动了一下，你再想一次，它又动了一次。这就是幸福的最小单位。'],
    '脚':['脚完全踩在地上，你是不是突然觉得自己稳了？脚底告诉你：你在这里，你在这一秒，你没问题。','脚底踩实的感觉，是身体在说"我还在地上"。这个感觉平时被忘掉了，你刚才找回来了。'],
    '抱':['你抱了自己五秒。你是你今天最容易忽略的人，但你刚才没有。','自己的手臂抱自己，是不是觉得力量不太对？没关系，你试了。试了就是在说"我在"。'],
    '名字':['你写了谁？写的时候心里是不是抖了一下？那个人不知道你在想ta，但你知道。这就够了。','纸上的那个名字，是你现在最想靠近的人。承认这件事不丢人，丢人的是一直忙到想不起来。'],
    '握拳':['松开的那一下，手掌是不是暖的？攥着的时候不觉得，松开才知道自己一直在用力。你刚才松了一次。','握拳再张开——你刚才做了一个很小的仪式：把紧的东西松掉。'],
    '小太阳':['玻璃上的小太阳，画完就没了。但你画的时候是真的在画，你笑的时候是真的在笑。','你在告诉窗外的世界：就算没有太阳，我自己也能画一个。'],
    '谢谢':['你对什么说的谢谢？它不会回你"不客气"，但你说出来的那一秒，你和它的关系变了。','你谢的那个东西，是今天最稳定陪你的伙伴。谢谢你有这个心。'],
  };
  let reply='';
  for(const[k,v]of Object.entries(R)){if(task.includes(k)){reply=pick(v);break}}
  if(!reply)reply=pick(['你刚才做了一件跟工作完全无关的事。这三分钟不是浪费，是你在跟自己说：我比我的工作大。','你给了自己三分钟，这比给任何人三分钟都难。但你给了。','你停下来做了点什么，又回来了。事情好像没变，但你变了一点点——松了一点点。']);
  if(feeling){
    const c=pick([`你说"${feeling}"——我能感觉到。`,`"${feeling}"，是吧。`,`你说"${feeling}"。嗯，`]);
    const ct=pick(['这三分钟没白过。','你把这种感觉留下来了，这比做完任务本身还重要。','这个感受是你自己挣来的。']);
    reply=pick([c+reply+ct, reply+c+ct]);
  }
  const sentences=reply.match(/[^。！？]+[。！？]/g)||[reply];
  return sentences.slice(0,pick([2,3])).join('');
}

    '生气':['生气是对的，有些事就是让人生气。你的愤怒值得被听见，不需要为它道歉。','生气的时候身体是紧的，说出来之后，你的肩膀松开了一点吗？'],
    '无聊':['无聊的时候，说明你在给自己留空间。什么都不想做，也是一种状态，不需要否定它。','无聊是大脑在说"我需要点新鲜的"。它不是在偷懒，它是在提醒你。'],
    '孤独':['孤独的时候，说出来这件事本身，就在说"我还想和世界连接"。你已经在连接了。','孤独不是你的错，也不是你不够好。它只是有时候会来，来了也会走。'],
    '老板':['被老板说的时候一定很难受吧。你不需要今天就消化它，也不需要马上变成"更好的人"。','老板说的话，你听到了，但不代表你就是那样。你比那句话大得多。'],
    '骂':['被骂的时候，身体先知道。你不需要马上原谅，也不需要马上想通。','挨骂之后还愿意把这件事说出来，说明你没被它压垮。'],
    '失败':['失败不会定义你，它只是你做过的一件事。你比这件事大。','失败的时候，给自己一点时间。不需要马上站起来，躺一会儿也行。'],
    '焦虑':['焦虑的时候，不需要想"怎么办"。有时候说出来，就是最好的"怎么办"。','焦虑是因为你在乎。在乎不是错，是你在认真活着。'],
    '想家':['想家的时候，说明你被好好爱过。这份想念是暖的，虽然带着点酸。','想家不是软弱，是你心里有一个地方永远亮着灯。'],
    '谢谢':['你心里有感谢，说明你看到了别人的好。能看到别人好的人，自己也不会太差。','谢谢你愿意把这些话说出来。'],
  };
  let reply='';
  for(const[k,v]of Object.entries(moodMap)){if(text.includes(k)){reply=pick(v);break}}
  if(!reply){
    reply=pick([
      '谢谢你愿意把这些说出来。不管是什么，你说了，我听到了，这就够了。',

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function renderLog(){
  const list=document.getElementById('logList');
  const ws=document.getElementById('whisper');
  if(!logs.length){list.innerHTML='<div class="log-empty">还没有记录，岛上的植物在等你</div>';ws.innerHTML='';return}
  const typeNames={move:'🏃 动一动',breathe:'🧘 静一静',talk:'💬 说一说'};
  list.innerHTML=logs.map(l=>`
    <div class="log-card">
      <div class="log-top">
        <div class="log-content">${esc(l.type==='talk'?l.task:l.task||'呼吸练习')}</div>
      </div>
      <div class="log-meta">
        <span class="log-time">${esc(l.time)}</span>
        <span class="log-type">${typeNames[l.type]||''}</span>
      </div>
      <div class="log-ai">${esc(l.ai)}</div>
      ${l.feeling?`<div class="log-feeling">「${esc(l.feeling)}」</div>`:''}
    </div>
  `).join('');
  renderWhisper();
}
function renderWhisper(){
  const ws=document.getElementById('whisper');
  if(!logs.length){ws.innerHTML='';return}
  const total=logs.length;
  const typeCount={move:0,breathe:0,talk:0};
  logs.forEach(l=>{if(l.type)typeCount[l.type]=(typeCount[l.type]||0)+1});
  let topType='',topN=0;
  for(const[k,v]of Object.entries(typeCount)){if(v>topN){topN=v;topType=k}}
  const typeNames={move:'动一动',breathe:'静一静',talk:'碎碎念'};
  const topName=typeNames[topType]||'';
  const parts=[
    pick([`你已经在这座岛上休息了 <strong>${total}</strong> 次`,`<strong>${total}</strong> 次，你都没有忘记照顾自己`,`不知不觉，你已经来了 <strong>${total}</strong> 次`]),
  ];
  if(topName){
    parts.push(pick([`你最喜欢去"${topName}"的角落`,`"${topName}"是你最常做的事，挺好的`,`你偏爱"${topName}"，看得出来`]));
  }
  ws.innerHTML=parts.join('，')+'。';
}
function clearLog(){if(!logs.length)return;logs=[];saveData();renderLog()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
