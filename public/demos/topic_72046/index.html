<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>3分钟呼吸岛</title>
<style>
/* ═══════════════════════════════════════════
   RESET & DESIGN TOKENS
   ═══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* color system */
  --bg:#faf6f0;--bg-deep:#f3ece2;
  --fg:#2e2a26;--fg-secondary:#5a5550;--muted:#8a8580;--subtle:#b5aea6;
  --accent:#e07a3a;--accent-dark:#c4602a;--accent-light:#f5c9a8;
  --accent-glow:rgba(224,122,58,.14);--accent-glow-strong:rgba(224,122,58,.28);
  --card:rgba(255,250,244,.68);--card-solid:#fffaf4;
  --border:rgba(200,188,172,.35);--border-strong:rgba(200,188,172,.55);
  /* type scale */
  --text-display:clamp(2rem,5vw,2.8rem);--text-h1:clamp(1.5rem,3.5vw,1.9rem);
  --text-h2:1.15rem;--text-body:1rem;--text-sm:.88rem;--text-xs:.76rem;--text-xxs:.66rem;
  /* spacing */
  --sp-xs:8px;--sp-sm:16px;--sp-md:24px;--sp-lg:36px;--sp-xl:52px;--sp-2xl:72px;
  /* radius */
  --radius-sm:10px;--radius-md:16px;--radius-lg:22px;--radius-full:999px;
  /* shadows */
  --shadow-sm:0 2px 8px rgba(46,42,38,.04);
  --shadow-md:0 4px 20px rgba(46,42,38,.07);
  --shadow-lg:0 12px 40px rgba(46,42,38,.1);
  --shadow-glow:0 0 40px rgba(224,122,58,.12);
  /* transitions */
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--fg);line-height:1.65;min-height:100vh;overflow-x:hidden;
  background:var(--bg);
  opacity:0;animation:bodyIn .9s var(--ease-out) forwards;
}
@keyframes bodyIn{to{opacity:1}}

/* ═══════════════════════════════════════════
   CANVAS & BACKGROUND LAYERS
   ═══════════════════════════════════════════ */
#particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-blob{
  position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;
  opacity:.35;will-change:transform;
}
.bg-blob-1{width:420px;height:420px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(224,122,58,.18),transparent 70%);animation:blobDrift1 20s ease-in-out infinite}
.bg-blob-2{width:350px;height:350px;bottom:-60px;left:-100px;background:radial-gradient(circle,rgba(245,201,168,.2),transparent 70%);animation:blobDrift2 25s ease-in-out infinite}
.bg-blob-3{width:280px;height:280px;top:40%;left:50%;background:radial-gradient(circle,rgba(224,122,58,.08),transparent 70%);animation:blobDrift3 18s ease-in-out infinite}
@keyframes blobDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.08)}}
@keyframes blobDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-15px) scale(1.05)}}
@keyframes blobDrift3{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,15px) scale(1.1)}}

/* ═══════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════ */
.app{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:var(--sp-sm) var(--sp-md) 100px}

/* ═══════════════════════════════════════════
   PAGE TRANSITIONS
   ═══════════════════════════════════════════ */
.page{display:none;padding:var(--sp-lg) 0 var(--sp-md)}
.page.active{display:block;animation:pageIn .6s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════
   HOME PAGE — LAYOUT RESTRUCTURE
   ═══════════════════════════════════════════ */
.home-hero{text-align:center;padding:var(--sp-xl) 0 var(--sp-lg)}
.home-hero h1{
  font-size:var(--text-display);font-weight:800;letter-spacing:.02em;
  color:var(--fg);line-height:1.2;margin-bottom:var(--sp-xs);
  background:linear-gradient(135deg,var(--fg) 40%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.home-hero .subtitle{
  font-size:var(--text-h2);color:var(--muted);font-weight:400;
  letter-spacing:.04em;margin-top:var(--sp-xs);
}

/* config toggle */
.config-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 0;cursor:pointer;color:var(--muted);font-size:var(--text-sm);
  user-select:none;transition:color .2s;
}
.config-toggle:hover{color:var(--accent)}
.config-toggle-arrow{transition:transform .3s var(--ease-out);font-size:.7rem}
.config-grid.collapsed{display:none}
.config-grid.expanded .config-toggle-arrow{transform:rotate(180deg)}

/* quick entries */
.quick-entries{display:flex;gap:12px;justify-content:center;margin-top:var(--sp-md)}
.quick-btn{
  padding:9px 20px;border-radius:var(--radius-full);border:1px solid var(--border);
  background:var(--card);font-size:var(--text-sm);color:var(--fg-secondary);cursor:pointer;
  transition:all .22s var(--ease-out);backdrop-filter:blur(8px);
}
.quick-btn:hover{border-color:var(--accent-light);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}

/* stats — compact inline */
.stats-bar{display:flex;gap:var(--sp-xs);justify-content:center;margin:var(--sp-md) 0 var(--sp-lg);flex-wrap:wrap}
.stat-chip{
  display:flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;color:var(--accent-dark);
  background:var(--accent-glow);border:1px solid rgba(224,122,58,.12);
}

/* ── config panels — card grid ── */
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-md);margin-bottom:var(--sp-lg)}
.config-card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--sp-md);box-shadow:var(--shadow-sm);
  transition:box-shadow .3s,border-color .3s;
}
.config-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.config-card.full-width{grid-column:1/-1}
.config-label{
  font-size:var(--text-xs);font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-sm);
}
.config-options{display:flex;gap:8px;flex-wrap:wrap}

/* ── pill buttons ── */
.pill{
  padding:7px 14px;border-radius:var(--radius-full);border:1.5px solid var(--border);
  background:transparent;font-size:var(--text-sm);color:var(--fg-secondary);
  cursor:pointer;transition:all .22s var(--ease-out);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.pill:hover{border-color:var(--accent-light);background:var(--accent-glow);color:var(--fg)}
.pill.selected{
  border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 2px 12px rgba(224,122,58,.25);transform:scale(1.02);
}
.pill .pill-emoji{font-size:.95rem}

/* duration — circular */
.dur-row{display:flex;gap:10px;align-items:center}
.dur-btn{
  width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:transparent;
  font-size:.95rem;font-weight:700;color:var(--fg-secondary);cursor:pointer;
  transition:all .22s var(--ease-out);display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;
}
.dur-btn:hover{border-color:var(--accent-light);background:var(--accent-glow)}
.dur-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(224,122,58,.25)}
.dur-btn .dur-unit{font-size:.55rem;font-weight:400;margin-top:1px;opacity:.7}

/* ── CTA ── */
.cta-wrap{text-align:center;margin:var(--sp-lg) 0 0}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 48px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;border-radius:var(--radius-full);
  font-size:1.1rem;font-weight:700;cursor:pointer;letter-spacing:.02em;
  box-shadow:0 8px 28px rgba(224,122,58,.32),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .22s var(--ease-spring),box-shadow .22s;
  position:relative;overflow:hidden;
}
.btn-primary::after{
  content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.15));
  border-radius:inherit;
}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 36px rgba(224,122,58,.38)}
.btn-primary:active{transform:scale(.97)}

/* ═══════════════════════════════════════════
   BREATH INTRO PAGE
   ═══════════════════════════════════════════ */
.breath-intro-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;text-align:center;
}
.breath-intro-circle{
  position:relative;width:160px;height:160px;margin-bottom:var(--sp-lg);
  display:flex;align-items:center;justify-content:center;
}
.breath-intro-ring{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 45% 45%,rgba(245,201,168,.4),rgba(224,122,58,.25) 60%,transparent 70%);
  box-shadow:0 0 60px rgba(224,122,58,.15),0 0 120px rgba(224,122,58,.06);
  transition:transform 5s ease-in-out,opacity 5s ease-in-out,box-shadow 5s ease-in-out;
  will-change:transform,opacity;
}
.breath-intro-ring::after{
  content:'';position:absolute;inset:-16px;border-radius:50%;
  border:2px solid rgba(224,122,58,.08);
  transition:all 5s ease-in-out;will-change:all;
}
.breath-intro-ring.inhale{
  transform:scale(1.45);opacity:1;
  box-shadow:0 0 80px rgba(224,122,58,.25),0 0 160px rgba(224,122,58,.1);
}
.breath-intro-ring.inhale::after{inset:-24px;border-color:rgba(224,122,58,.15)}
.breath-intro-ring.exhale{
  transform:scale(.55);opacity:.5;
  box-shadow:0 0 30px rgba(224,122,58,.08);
}
.breath-intro-ring.exhale::after{inset:-8px;border-color:rgba(224,122,58,.04)}
.breath-intro-text{
  font-size:1.6rem;font-weight:700;color:var(--fg);
  letter-spacing:.06em;margin-bottom:var(--sp-sm);
  transition:opacity .4s;min-height:2.2em;
}
.breath-intro-hint{
  font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--sp-xs);font-weight:500;
  letter-spacing:.03em;
}
.breath-intro-countdown{font-size:var(--text-xs);color:var(--subtle);margin-bottom:var(--sp-sm)}

/* ═══════════════════════════════════════════
   TIMER PAGE
   ═══════════════════════════════════════════ */
.timer-page-inner{display:flex;flex-direction:column;align-items:center}
.task-card{
  background:var(--card);backdrop-filter:blur(18px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--sp-md) var(--sp-lg);margin-bottom:var(--sp-lg);
  box-shadow:var(--shadow-md),var(--shadow-glow);max-width:460px;width:100%;text-align:center;
}
.task-text{font-size:var(--text-h2);font-weight:700;line-height:1.85;color:var(--fg)}
.task-cat-tag{
  display:inline-block;margin-top:var(--sp-xs);padding:3px 10px;border-radius:var(--radius-full);
  font-size:var(--text-xxs);font-weight:600;background:var(--accent-glow);color:var(--accent-dark);
}

/* countdown ring */
.timer-wrap{position:relative;width:240px;height:240px;margin-bottom:var(--sp-md)}
.timer-wrap svg{width:240px;height:240px;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.timer-ring-fg{
  fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 6px rgba(224,122,58,.25));
}
.timer-glow{
  fill:none;stroke:var(--accent);stroke-width:18;stroke-linecap:round;
  opacity:.08;filter:blur(8px);transition:stroke-dashoffset .25s linear;
}
.timer-tick{fill:none;stroke:var(--border-strong);stroke-width:1.5;stroke-linecap:round}
.timer-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.timer-digits{font-size:3.2rem;font-weight:800;color:var(--fg);letter-spacing:.02em;line-height:1}
.timer-sub{font-size:var(--text-xs);color:var(--muted);margin-top:4px;font-weight:500}
.timer-label{font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--sp-sm);min-height:1.5em;transition:opacity .3s;font-weight:500}

/* breathing guide — larger, more prominent */
.breath-guide{
  width:80px;height:80px;margin-bottom:var(--sp-md);border-radius:50%;
  background:radial-gradient(circle at 40% 40%,var(--accent-light),var(--accent) 70%);
  opacity:0;transition:all 1.8s ease-in-out;
  box-shadow:0 0 40px var(--accent-glow);position:relative;
}
.breath-guide::after{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  border:2px solid rgba(224,122,58,.1);transition:all 1.8s ease-in-out;
}
.breath-guide.inhale{opacity:.7;transform:scale(1.5);box-shadow:0 0 60px rgba(224,122,58,.25)}
.breath-guide.inhale::after{inset:-20px;border-color:rgba(224,122,58,.15)}
.breath-guide.exhale{opacity:.25;transform:scale(.6);box-shadow:0 0 20px rgba(224,122,58,.08)}
.breath-guide.exhale::after{inset:-6px;border-color:rgba(224,122,58,.05)}

.btn-skip{
  margin-top:var(--sp-xs);padding:7px 22px;border-radius:var(--radius-full);border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:var(--text-xs);cursor:pointer;
  transition:all .2s;font-weight:500;
}
.btn-skip:hover{border-color:var(--accent);color:var(--accent)}

.timer-actions{display:flex;gap:8px;justify-content:center;margin-top:var(--sp-xs);flex-wrap:wrap}

/* ═══════════════════════════════════════════
   DONE PAGE
   ═══════════════════════════════════════════ */
.done-page-inner{display:flex;flex-direction:column;align-items:center;text-align:center}
.done-task{font-size:var(--text-h2);font-weight:700;line-height:1.85;color:var(--fg);max-width:440px;margin-bottom:var(--sp-lg)}
.feeling-prompt{font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--sp-xs);font-weight:500}
.feeling-input{
  width:100%;max-width:400px;padding:14px 18px;margin-bottom:var(--sp-md);display:block;
  border:1.5px solid var(--border);border-radius:var(--radius-md);
  background:var(--card);backdrop-filter:blur(8px);
  font-size:var(--text-body);color:var(--fg);resize:none;outline:none;
  transition:border-color .2s,box-shadow .2s;line-height:1.6;
}
.feeling-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.btn-done{
  display:inline-flex;align-items:center;gap:8px;padding:14px 42px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
  border:none;border-radius:var(--radius-full);font-size:1.05rem;font-weight:700;cursor:pointer;
  box-shadow:0 8px 28px rgba(224,122,58,.3);transition:transform .22s var(--ease-spring),box-shadow .22s;
}
.btn-done:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(224,122,58,.38)}

/* ═══════════════════════════════════════════
   AI RESPONSE PAGE
   ═══════════════════════════════════════════ */
.ai-page-inner{display:flex;flex-direction:column;align-items:center}
.ai-response-card{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg),var(--shadow-glow);
  padding:var(--sp-lg) var(--sp-lg);max-width:460px;width:100%;
  text-align:left;animation:cardIn .6s var(--ease-out);
  position:relative;overflow:hidden;
}
.ai-response-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent-light),var(--accent),var(--accent-light));
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.ai-label{
  font-size:var(--text-xxs);color:var(--accent);font-weight:700;margin-bottom:var(--sp-xs);
  letter-spacing:.1em;text-transform:uppercase;
}
.ai-text{font-size:var(--text-body);line-height:1.85;color:var(--fg);font-weight:400}
.ai-card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:var(--sp-md);padding-top:var(--sp-sm);border-top:1px solid var(--border)}
.btn-share-inline{
  display:inline-flex;align-items:center;gap:4px;padding:6px 14px;
  border-radius:var(--radius-full);border:1px solid var(--accent-light);background:transparent;
  font-size:var(--text-xs);color:var(--accent-dark);cursor:pointer;transition:all .2s;font-weight:600;
}
.btn-share-inline:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.fav-star{
  display:inline-block;font-size:1.5rem;cursor:pointer;
  transition:transform .25s var(--ease-spring);user-select:none;color:var(--subtle);
}
.ai-card-actions .fav-star{margin-top:0}
.fav-star:hover{transform:scale(1.3)}
.fav-star.lit{color:var(--accent)}
.fav-star.pop{animation:starPop .45s var(--ease-spring)}
@keyframes starPop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}

.btn-again{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:var(--sp-md);padding:11px 30px;
  background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;cursor:pointer;transition:all .25s var(--ease-out);
}
.btn-again:hover{background:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(224,122,58,.2)}

/* ═══════════════════════════════════════════
   LOG SECTION
   ═══════════════════════════════════════════ */
.log-section{
  margin-top:var(--sp-2xl);padding-top:var(--sp-xl);
  border-top:1px solid var(--border);
}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-md)}
.log-title{font-size:var(--text-h2);font-weight:700;color:var(--fg)}
.btn-clear-log{
  padding:5px 13px;border-radius:var(--radius-full);border:1px solid var(--border);background:transparent;
  font-size:var(--text-xs);color:var(--muted);cursor:pointer;transition:all .2s;font-weight:500;
}
.btn-clear-log:hover{border-color:var(--accent);color:var(--accent)}
.log-empty{font-size:var(--text-sm);color:var(--subtle);padding:var(--sp-md) 0;text-align:center}
.log-card{
  background:var(--card);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
  padding:var(--sp-md);margin-bottom:var(--sp-md);text-align:left;
  transition:box-shadow .3s,border-color .3s;
  animation:cardIn .45s var(--ease-out);
}
.log-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.log-card .log-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-xs)}
.log-card .log-task{font-size:var(--text-sm);font-weight:700;color:var(--fg);flex:1;line-height:1.6}
.log-card .log-fav{font-size:1rem;cursor:pointer;user-select:none;flex-shrink:0;color:var(--subtle);transition:color .2s}
.log-card .log-fav.lit{color:var(--accent)}
.log-card .log-meta{display:flex;gap:8px;align-items:center;margin:var(--sp-xs) 0 var(--sp-sm);flex-wrap:wrap}
.log-card .log-time{font-size:var(--text-xxs);color:var(--subtle)}
.log-card .log-tag{font-size:var(--text-xxs);padding:2px 8px;border-radius:var(--radius-full);font-weight:600}
.log-card .log-mood-tag{background:var(--accent-glow);color:var(--accent-dark)}
.log-card .log-cat-tag{background:rgba(46,42,38,.05);color:var(--muted)}
.log-card .log-ai{font-size:var(--text-sm);color:var(--fg-secondary);line-height:1.7;border-left:3px solid var(--accent-light);padding-left:12px}
.log-card .log-feeling{font-size:var(--text-xs);color:var(--muted);margin-top:var(--sp-xs);font-style:italic;line-height:1.5}

/* ── whisper ── */
.whisper{
  margin-top:var(--sp-lg);padding-top:var(--sp-md);
  border-top:1px dashed rgba(200,188,172,.3);

/* ═══════════════════════════════════════════
   COMPLETION BURST
   ═══════════════════════════════════════════ */
.burst-ring{

  width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);
  animation:burstRing .9s var(--ease-out) forwards;
}
@keyframes burstRing{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1;border-width:3px}
  100%{transform:translate(-50%,-50%) scale(50);opacity:0;border-width:1px}
}

/* ═══════════════════════════════════════════
   SHARE CARD
   ═══════════════════════════════════════════ */
.share-overlay{
  display:none;position:fixed;inset:0;z-index:200;

}

.share-card{

  overflow:hidden;animation:cardIn .4s var(--ease-out);
}
.share-card-inner{

.share-brand{

}
.share-divider{

}
.share-task{

  text-align:center;padding:var(--sp-xs) 0;
}
.share-ai{

}
.share-bottom{

}
.share-qr{

}
.share-date{font-size:var(--text-xxs);color:var(--subtle)}
.share-actions{

/* ═══════════════════════════════════════════
   REDUCED MOTION
   ═══════════════════════════════════════════ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .bg-blob,.breath-guide::after{animation:none!important}
}

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════ */

<script>
// ═══════════════════════════════════════════

  {text:'深呼吸五次，每一次都比上一次更慢',cat:'breath',mood:['stressed','anxious','tired']},

  {text:'站起来，双手抱住自己，给自己一个拥抱，保持五秒',cat:'body',mood:['sad','anxious']},
  {text:'看看周围，找到三种不同绿色的东西',cat:'sensory',mood:['bored','tired']},
  {text:'给未来的自己写一句话，只写半句，留着下次补完',cat:'creative',mood:['sad','just']},
  {text:'轻轻握拳再慢慢张开，感受手指一根一根松开的感觉',cat:'breath',mood:['stressed','anxious']},
  {text:'走到窗边，用手指在玻璃上画一个小太阳',cat:'creative',mood:['sad','bored']},
  {text:'对身边一件物品说一声谢谢，它一直在为你服务',cat:'social',mood:['sad','just']},
];

const R=106;
const CIRC=2*Math.PI*R;
let timerInterval=null,breathInterval=null;
let currentTask=null,selectedMood=null,selectedCat='all',selectedDur=3,selectedAmb='none';
let recentTaskTexts=[],logs=[];
let ambientCtx=null,ambientSource=null,ambientGain=null;
let mouseX=-9999,mouseY=-9999;
const reducedMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init(){
  const s=localStorage.getItem('bi_logs');if(s)logs=JSON.parse(s);
  const r=localStorage.getItem('bi_recent');if(r)recentTaskTexts=JSON.parse(r);
  renderMoods();renderCats();renderDurs();renderAmbients();renderStats();renderLog();
  renderTickMarks();
  initParticles();
  document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
  document.addEventListener('mouseleave',()=>{mouseX=-9999;mouseY=-9999});
}

function renderTickMarks(){
  const g=document.getElementById('tickMarks');
  let html='';
  for(let i=0;i<60;i++){
    const a=(i/60)*360-90;
    const rad=a*Math.PI/180;
    const isMajor=i%5===0;
    const inner=isMajor?96:100;
    const outer=104;
    const x1=120+inner*Math.cos(rad),y1=120+inner*Math.sin(rad);
    const x2=120+outer*Math.cos(rad),y2=120+outer*Math.sin(rad);
    html+=`<line class="timer-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="opacity:${isMajor?.35:.15}"/>`;
  }
  g.innerHTML=html;
}

// ═══════════════════════════════════════════
// PARTICLE SYSTEM — UPGRADED
// ═══════════════════════════════════════════
function initParticles(){
  if(reducedMotion)return;
  const c=document.getElementById('particleCanvas');
  const ctx=c.getContext('2d');
  let w,h,particles=[];

  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();
  window.addEventListener('resize',resize);

  const N=window.innerWidth<520?28:48;
  const CONNECTION_DIST=140;
  const MOUSE_RADIUS=180;
  const MOUSE_FORCE=0.015;

  // multi-type particles
  for(let i=0;i<N;i++){
    const type=Math.random();
    particles.push({
      x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.3-.08,
      r:type>.7?Math.random()*4+2:Math.random()*2.5+1,
      opacity:Math.random()*.22+.04,
      // color variation
      hue:20+Math.random()*20, // warm range 20-40
      sat:60+Math.random()*25,
      light:55+Math.random()*20,
      // physics
      baseVx:0,baseVy:0,
      phase:Math.random()*Math.PI*2,
      phaseSpeed:.005+Math.random()*.01,
      // type: 0=dot, 1=glow
      isGlow:type>.75,
    });
    particles[i].baseVx=particles[i].vx;
    particles[i].baseVy=particles[i].vy;
  }

  let lastTime=0;
  let animId=null;
  function draw(time){
    animId=requestAnimationFrame(draw);
    if(window._particlePaused)return;
    const dt=Math.min((time-lastTime)/16,3);
    lastTime=time;

    ctx.clearRect(0,0,w,h);

    // connection lines
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x;
        const dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<CONNECTION_DIST){
          const alpha=(1-dist/CONNECTION_DIST)*.06;
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(224,122,58,${alpha})`;
          ctx.lineWidth=.6;
          ctx.stroke();
        }
      }
    }

    // update & draw particles
    for(const p of particles){
      // brownian motion / sinusoidal drift
      p.phase+=p.phaseSpeed*dt;
      const driftX=Math.sin(p.phase)*.15;
      const driftY=Math.cos(p.phase*.7)*.1;

      // mouse interaction — gentle attraction
      const mdx=mouseX-p.x,mdy=mouseY-p.y;
      const mDist=Math.sqrt(mdx*mdx+mdy*mdy);
      let mFx=0,mFy=0;
      if(mDist<MOUSE_RADIUS&&mDist>1){
        const force=(1-mDist/MOUSE_RADIUS)*MOUSE_FORCE;
        mFx=mdx/mDist*force;
        mFy=mdy/mDist*force;
      }

      p.vx+=(driftX+mFx)*.1;
      p.vy+=(driftY+mFy)*.1;
      // damping
      p.vx*=.98;p.vy*=.98;
      // drift back to base
      p.vx+=(p.baseVx-p.vx)*.005;
      p.vy+=(p.baseVy-p.vy)*.005;

      p.x+=p.vx*dt;p.y+=p.vy*dt;

      // wrap
      if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;
      if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20;

      // draw
      if(p.isGlow){
        // soft glow
        const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
        grad.addColorStop(0,`hsla(${p.hue},${p.sat}%,${p.light}%,${p.opacity*1.5})`);
        grad.addColorStop(.5,`hsla(${p.hue},${p.sat}%,${p.light}%,${p.opacity*.5})`);
        grad.addColorStop(1,`hsla(${p.hue},${p.sat}%,${p.light}%,0)`);
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
        ctx.fillStyle=grad;ctx.fill();
      }else{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`hsla(${p.hue},${p.sat}%,${p.light}%,${p.opacity})`;
        ctx.fill();
      }
    }
    // draw now calls requestAnimationFrame at its start
  }
  // kick off the loop
  requestAnimationFrame(draw);
}

function startAmbient(){
  if(selectedAmb==='none')return;
  try{
    if(!ambientCtx)ambientCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(ambientSource){ambientSource.stop();ambientSource=null}
    const sr=ambientCtx.sampleRate,len=sr*4;
    const buf=ambientCtx.createBuffer(1,len,sr),data=buf.getChannelData(0);
    if(selectedAmb==='rain'){for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*.15+(Math.random()*2-1)*.05*Math.sin(i/sr*2*Math.PI*800)}
    else if(selectedAmb==='wave'){for(let i=0;i<len;i++){const t=i/sr;data[i]=Math.sin(t*2*Math.PI*.3)*Math.sin(t*2*Math.PI*120)*.2+(Math.random()*2-1)*.03}}
    else if(selectedAmb==='bird'){for(let i=0;i<len;i++){const t=i/sr;data[i]=Math.sin(t*2*Math.PI*(2200+Math.sin(t*8)*600))*.08*(Math.sin(t*3)>.3?1:.1)+(Math.random()*2-1)*.02}}
    else if(selectedAmb==='fire'){for(let i=0;i<len;i++){data[i]=(Math.random()*2-1)*.1*(1+Math.sin(i/sr*2*Math.PI*2))+(Math.random()*2-1)*.03}}
    ambientSource=ambientCtx.createBufferSource();ambientSource.buffer=buf;ambientSource.loop=true;
    ambientGain=ambientCtx.createGain();ambientGain.gain.value=.5;
    ambientSource.connect(ambientGain).connect(ambientCtx.destination);ambientSource.start();
  }catch(e){}
}
function stopAmbient(){try{if(ambientSource){ambientSource.stop();ambientSource=null}}catch(e){}}

function pickTask(){
  let pool=TASKS;
  if(selectedCat!=='all')pool=pool.filter(t=>t.cat===selectedCat);
  if(selectedMood){const mm=pool.filter(t=>t.mood.includes(selectedMood));if(mm.length>0)pool=mm}
  let avail=pool.filter(t=>!recentTaskTexts.includes(t.text));
  if(!avail.length)avail=pool;
  const task=avail[Math.floor(Math.random()*avail.length)];
  recentTaskTexts.push(task.text);
  if(recentTaskTexts.length>3)recentTaskTexts.shift();
  localStorage.setItem('bi_recent',JSON.stringify(recentTaskTexts));
  return task;
}

  ring.style.strokeDasharray=CIRC;ring.style.strokeDashoffset=CIRC;
  glow.style.strokeDasharray=CIRC;glow.style.strokeDashoffset=CIRC;
  const total=selectedDur*60;let remaining=total;
  updateTimerDisplay(remaining,total);
  const labels=['慢慢来，不着急','享受这一刻','你做得很好','快到了哦','马上就好啦'];
  clearInterval(timerInterval);clearInterval(breathInterval);
  const bg=document.getElementById('breathGuide');bg.style.opacity='0';bg.className='breath-guide';
  let bp='inhale';
  breathInterval=setInterval(()=>{bp=bp==='inhale'?'exhale':'inhale';bg.className='breath-guide '+bp},4000);
  setTimeout(()=>bg.className='breath-guide inhale',200);
  timerInterval=setInterval(()=>{
    remaining--;if(remaining<0)remaining=0;
    updateTimerDisplay(remaining,total);
    const progress=1-remaining/total,offset=CIRC*(1-progress);
    ring.style.strokeDashoffset=offset;glow.style.strokeDashoffset=offset;
    const li=Math.min(Math.floor(progress*labels.length),labels.length-1);
    document.getElementById('timerLabel').textContent=labels[li];
    if(remaining<=0){clearInterval(timerInterval);clearInterval(breathInterval);bg.className='breath-guide';stopAmbient();showPage('donePage')}
  },1000);
}
function updateTimerDisplay(sec,total){
  const m=Math.floor(sec/60),s=sec%60;
  document.getElementById('timerDigits').textContent=m+':'+String(s).padStart(2,'0');
  const pct=Math.round((1-sec/total)*100);
  document.getElementById('timerSub').textContent=pct>0?`已完成 ${pct}%`:'';
}

// ── 用 Canvas 绘制卡片并保存为图片 ──
function saveShareImage(){
  if(!logs.length)return;
  const l=logs[0];
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=400,H=520;
  const cvs=document.createElement('canvas');
  cvs.width=W*dpr;cvs.height=H*dpr;
  const ctx=cvs.getContext('2d');
  ctx.scale(dpr,dpr);

  // 背景
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#fffaf4');bgGrad.addColorStop(1,'#f3ece2');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  // 圆角遮罩
  ctx.globalCompositeOperation='destination-in';
  roundRect(ctx,0,0,W,H,22);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // 品牌标题
  ctx.fillStyle='#2e2a26';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
  ctx.fillText('3分钟呼吸岛',W/2,44);

  // 分割线
  drawDivider(ctx,30,62,W-30);

  // 任务文字（自动换行）
  ctx.fillStyle='#2e2a26';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  const taskLines=wrapText(ctx,l.task,W-80,14);
  let y=90;
  taskLines.forEach(line=>{ctx.fillText(line,W/2,y);y+=22});

  // AI 回信（自动换行，左对齐）
  y+=12;
  ctx.fillStyle='#5a5550';ctx.font='13px sans-serif';ctx.textAlign='left';
  const aiLines=wrapText(ctx,l.ai,W-96,13);
  const aiStartX=56;
  // 左侧竖线
  ctx.fillStyle='#f5c9a8';ctx.fillRect(aiStartX-12,y-2,3,aiLines.length*20+4);
  ctx.fillStyle='#5a5550';
  aiLines.forEach(line=>{ctx.fillText(line,aiStartX,y+13);y+=20});

  // 分割线
  y+=12;drawDivider(ctx,30,y,W-30);y+=20;

  // 二维码占位
  ctx.fillStyle='#b5aea6';ctx.font='10px sans-serif';ctx.textAlign='left';
  drawQRPlaceholder(ctx,44,y-4,40);
  ctx.fillText('扫码开始你的 3 分钟',92,y+20);

  // 日期
  ctx.fillStyle='#b5aea6';ctx.font='10px sans-serif';ctx.textAlign='right';
  ctx.fillText(l.time,W-36,y+20);

  // 下载
  const link=document.createElement('a');
  link.download='呼吸岛-'+Date.now()+'.png';
  link.href=cvs.toDataURL('image/png');
  link.click();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawDivider(ctx,x1,y,x2){
  const grad=ctx.createLinearGradient(x1,y,x2,y);
  grad.addColorStop(0,'rgba(200,188,172,0)');grad.addColorStop(0.5,'rgba(200,188,172,0.55)');grad.addColorStop(1,'rgba(200,188,172,0)');
  ctx.fillStyle=grad;ctx.fillRect(x1,y,x2-x1,1);
}
function wrapText(ctx,text,maxW,lineH){
  const lines=[];let line='';
  for(const ch of text){
    const test=line+ch;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}
function drawQRPlaceholder(ctx,x,y,s){
  ctx.save();ctx.fillStyle='#b5aea6';
  // 三个定位角
  const r=3;
  ctx.fillRect(x,y,s*.3,s*.3);ctx.fillRect(x+s*.35,y,s*.3,s*.3);ctx.fillRect(x,y+s*.35,s*.3,s*.3);
  // 小方块
  ctx.fillRect(x+s*.35,y+s*.35,s*.12,s*.12);
  ctx.fillRect(x+s*.52,y+s*.35,s*.12,s*.12);
  ctx.fillRect(x+s*.35,y+s*.52,s*.12,s*.12);
  ctx.fillRect(x+s*.52,y+s*.52,s*.12,s*.12);
  ctx.fillRect(x+s*.7,y+s*.7,s*.12,s*.12);
  ctx.fillRect(x+s*.85,y+s*.7,s*.12,s*.12);
  ctx.fillRect(x+s*.7,y+s*.85,s*.12,s*.12);
  ctx.fillRect(x+s*.85,y+s*.85,s*.12,s*.12);
  ctx.restore();
}

// 随机选一个
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

      `你好像特别喜欢${catFriendly}`,
      `你最常做的事是${catFriendly}，挺好的`,
      `${catFriendly}是你的偏爱，看得出来`,
    ];
    parts.push(catPhrases[Math.floor(Math.random()*catPhrases.length)]);
  }

  ws.innerHTML=parts.join('，')+'。';
}
function toggleLogFav(i){logs[i].fav=!logs[i].fav;saveLogs();renderLog();renderStats()}
function clearLog(){if(!logs.length)return;logs=[];saveLogs();renderLog();renderStats()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

init();
</script>
</body>
