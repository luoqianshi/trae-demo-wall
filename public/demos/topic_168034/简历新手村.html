<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>简历新手村</title>
<style>
:root{
  --parchment:#FDF5E6; --parchment-dark:#F5E6C8; --wood-dark:#5D3A1A; --wood-light:#8B6914;
  --wood-medium:#7A5A1A; --gold:#FFB300; --gold-light:#FFD54F; --gold-dark:#E65100;
  --green:#4CAF50; --blue:#2196F3; --red:#E53935; --purple:#7E57C2; --orange:#FF8F00;
  --text-main:#3E2723; --text-sub:#795548;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","SimHei",system-ui,sans-serif;
  color:var(--text-main); background:#222; overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
#app{
  position:relative; width:100%; max-width:500px; height:100vh; margin:0 auto;
  background:var(--parchment); overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; outline:none;}

.wood-panel{
  background:var(--parchment);
  border:4px solid var(--wood-dark);
  border-radius:12px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.2), 0 4px 0 var(--wood-dark);
}
.btn-wood{
  background:linear-gradient(to bottom,var(--wood-light),var(--wood-dark));
  color:#fff; font-weight:bold; padding:10px 20px; border-radius:8px;
  border:3px solid var(--wood-dark);
  box-shadow:0 3px 0 #3a2410;
  transition:transform .08s, box-shadow .08s;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
}
.btn-wood:active{transform:translateY(3px); box-shadow:0 0 0 #3a2410;}
.btn-gold{
  background:linear-gradient(to bottom,var(--gold),var(--gold-dark));
  color:#fff; font-weight:bold; padding:10px 20px; border-radius:8px;
  border:3px solid var(--wood-dark);
  box-shadow:0 3px 0 #3a2410;
  transition:transform .08s, box-shadow .08s;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.btn-gold:active{transform:translateY(3px); box-shadow:0 0 0 #3a2410;}
.btn-round{
  background:var(--parchment-dark);
  border:3px solid var(--wood-dark);
  border-radius:20px;
  padding:8px 16px;
  font-weight:bold;
  color:var(--text-main);
  box-shadow:0 2px 0 rgba(93,58,26,.3);
}
.btn-round:active{transform:translateY(2px); box-shadow:none;}
.tag{
  display:inline-block; padding:3px 10px; border-radius:8px;
  font-size:12px; font-weight:bold; color:#fff;
}
.tag-green{background:var(--green);}
.tag-blue{background:var(--blue);}
.tag-gold{background:var(--gold);}
.tag-red{background:var(--red);}
.tag-purple{background:var(--purple);}
.skill-pill{
  display:inline-block; padding:4px 10px; border-radius:12px;
  font-size:11px; color:var(--text-main);
  background:rgba(255,179,0,.2);
  border:2px solid var(--gold);
}
.gold-glow{box-shadow:0 0 12px var(--gold);}

#welcome{
  position:absolute; inset:0; z-index:100;
  background:linear-gradient(to bottom,#87CEEB 0%,#87CEEB 55%,#5B8C3E 55%,#4a7a32 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .6s;
}
#welcome.hide{opacity:0; pointer-events:none;}
#sun{
  position:absolute; top:30px; right:30px; width:70px; height:70px; border-radius:50%;
  background:radial-gradient(circle,#FFEB3B 30%,#FFB300 70%);
  box-shadow:0 0 40px #FFEB3B,0 0 80px rgba(255,179,0,.5);
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse{50%{box-shadow:0 0 60px #FFEB3B,0 0 120px rgba(255,179,0,.6);}}
.cloud{position:absolute; color:#fff; font-size:34px; opacity:.95; filter:drop-shadow(0 2px 0 rgba(0,0,0,.1));}
@keyframes cloudMove{from{transform:translateX(-120px);}to{transform:translateX(560px);}}
.welcome-tree{position:absolute; bottom:38%; font-size:40px;}
.welcome-flower{position:absolute; bottom:38%; font-size:22px;}
#welcome h1{
  font-size:36px; color:var(--gold); margin-bottom:10px;
  text-shadow:2px 2px 0 #000, -1px -1px 0 #000, 0 3px 4px rgba(0,0,0,.5);
  animation:dropIn 1s ease-out;
}
#welcome p{
  color:#fff; font-size:17px; margin-bottom:34px; opacity:0;
  text-shadow:1px 1px 2px rgba(0,0,0,.5);
  animation:fadeIn .8s .6s forwards;
}
#welcome .start-btn{
  opacity:0; animation:fadeIn .8s 1.1s forwards;
}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{to{opacity:1;}}

#topbar{
  position:absolute; top:0; left:0; right:0; height:56px; z-index:50;
  background:linear-gradient(to bottom,#8B6914,#5D3A1A);
  border-bottom:4px solid #3a2410;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.top-left{display:flex; align-items:center; gap:8px;}
.top-left .icon-home{font-size:24px;}
.top-left .title{color:var(--gold); font-size:18px; font-weight:bold; text-shadow:1px 1px 2px rgba(0,0,0,.5);}
.task-dots{display:flex; gap:6px; align-items:center;}
.task-dots .dot{width:12px; height:12px; border-radius:50%; background:#665030; border:2px solid #3a2410;}
.task-dots .dot.done{background:var(--gold); box-shadow:0 0 6px var(--gold);}
.task-dots .dot.active{background:#fff; animation:blink 1s infinite; border-color:var(--gold);}
@keyframes blink{50%{opacity:.3;}}
.top-right{display:flex; align-items:center; gap:8px;}
.lv-badge{
  background:linear-gradient(to bottom,#FFB300,#E65100);
  color:#fff; padding:4px 10px; border-radius:10px;
  font-size:12px; font-weight:bold; border:2px solid #3a2410;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
}
.avatar-frame{
  width:36px; height:36px; border-radius:8px; border:3px solid var(--gold);
  background:#3a2410; display:flex; align-items:center; justify-content:center; font-size:22px;
}

#navbar{
  position:absolute; bottom:0; left:0; right:0; height:70px; z-index:50;
  background:linear-gradient(to bottom,#8B6914,#5D3A1A);
  border-top:4px solid #3a2410;
  display:flex;
  box-shadow:0 -2px 8px rgba(0,0,0,.3);
}
.nav-tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#C9B99A; font-size:13px; gap:4px; position:relative; transition:transform .15s;
}
.nav-tab .ico{font-size:26px;}
.nav-tab.active{color:var(--gold); transform:translateY(-3px);}
.nav-tab.active .ico{filter:drop-shadow(0 0 6px var(--gold));}
.nav-tab .badge{position:absolute; top:8px; right:calc(50% - 24px); width:10px; height:10px; background:var(--red); border-radius:50%; display:none; border:2px solid #fff;}
.nav-tab .badge.show{display:block; animation:blink 1s infinite;}

.page{
  position:absolute; top:56px; bottom:70px; left:0; right:0;
  display:none; animation:pageIn .3s;
}
.page.active{display:flex; flex-direction:column;}
@keyframes pageIn{from{opacity:0;}to{opacity:1;}}

#chatPage{background:var(--parchment);}
#npcList{
  display:flex; gap:8px; padding:12px; overflow-x:auto; background:var(--parchment-dark);
  border-bottom:4px solid var(--wood-dark); flex-shrink:0;
}
#npcList::-webkit-scrollbar{height:0;}
.npc-item{
  flex-shrink:0; width:70px; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px; border-radius:12px; border:3px solid transparent; position:relative;
  transition:all .15s;
}
.npc-item .face{
  width:52px; height:52px; border-radius:10px; background:var(--parchment);
  border:3px solid var(--wood-dark); display:flex; align-items:center; justify-content:center;
  font-size:32px; position:relative;
  box-shadow:0 3px 0 rgba(93,58,26,.3);
}
.npc-item .num{
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  background:var(--gold); color:#fff; font-size:11px; font-weight:bold;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--wood-dark);
}
.npc-item .name{font-size:12px; color:var(--text-main); white-space:nowrap; font-weight:bold;}
.npc-item.locked .face{filter:grayscale(1) brightness(.6);}
.npc-item.locked .name{color:#aaa;}
.npc-item.selected{background:rgba(255,179,0,.2); border-color:var(--gold); box-shadow:0 0 10px rgba(255,179,0,.3);}
.npc-item.has-task .face::after{
  content:'❗'; position:absolute; top:-8px; right:-8px; font-size:18px; animation:floatY 1.5s infinite;
}
@keyframes floatY{50%{transform:translateY(-4px);}}

#chatArea{
  flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px;
  background-image:linear-gradient(rgba(139,105,20,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(139,105,20,.08) 1px,transparent 1px);
  background-size:20px 20px;
}
.msg{display:flex; gap:10px; max-width:90%; animation:msgIn .25s;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.npc{align-self:flex-start;}
.msg.user{align-self:flex-end; flex-direction:row-reverse;}
.msg .av{
  width:38px; height:38px; border-radius:8px; background:var(--parchment);
  border:3px solid var(--wood-dark); display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0;
  box-shadow:0 2px 0 rgba(93,58,26,.3);
}
.bubble{
  padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.6; color:var(--text-main);
  border:3px solid var(--wood-dark);
}
.msg.npc .bubble{background:var(--parchment); border-top-left-radius:4px;}
.msg.user .bubble{background:var(--blue); color:#fff; border-top-right-radius:4px;}
.msg.system{align-self:center; max-width:none;}
.msg.system .bubble{background:rgba(93,58,26,.15); color:var(--text-sub); font-size:12px; border:none; text-align:center;}
.msg.announce{align-self:center; max-width:92%;}
.msg.announce .bubble{
  background:linear-gradient(to bottom,var(--gold),var(--gold-dark));
  color:#fff; border:3px solid var(--wood-dark); text-align:center;
  font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,.5);
  border-radius:10px; box-shadow:0 4px 0 #3a2410;
}

.xp-reward{
  background:linear-gradient(to bottom,var(--wood-light),var(--wood-dark));
  border:4px solid var(--wood-dark);
  border-radius:12px;
  padding:14px; text-align:center;
  margin:10px auto; width:fit-content;
  box-shadow:0 4px 0 #3a2410;
}
.xp-reward .xp-num{font-size:28px; color:var(--gold); font-weight:bold; text-shadow:0 2px 2px rgba(0,0,0,.5);}
.xp-reward .xp-star{font-size:20px; animation:starPulse 1s infinite;}
@keyframes starPulse{50%{transform:scale(1.2);}}

.card-msg{
  background:var(--parchment); border:4px solid var(--wood-dark);
  border-radius:12px; padding:12px; width:280px;
  box-shadow:0 4px 0 #3a2410;
}
.card-msg .ct{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.card-msg .ct .title{font-weight:bold; font-size:15px; color:var(--text-main);}
.card-msg .type-tag{font-size:11px; padding:3px 8px; border-radius:8px; color:#fff; font-weight:bold;}
.card-msg .star{font-size:12px; color:var(--text-sub); line-height:1.5; margin-bottom:6px;}
.card-msg .star b{color:var(--text-main);}
.card-msg .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
.card-msg .tags span{font-size:11px; padding:3px 8px; background:rgba(255,179,0,.2); color:var(--gold-dark); border-radius:12px; border:2px solid var(--gold);}
.card-msg .acts{display:flex; gap:8px; margin-top:10px;}
.card-msg .acts button{flex:1; font-size:12px; padding:6px; border-radius:8px;}

#quickReplies{display:flex; gap:8px; padding:10px 14px; overflow-x:auto; background:var(--parchment-dark); border-top:2px solid rgba(139,105,20,.2); flex-shrink:0;}
#quickReplies::-webkit-scrollbar{height:0;}
#quickReplies:empty{display:none;}
.quick-reply{
  background:var(--parchment);
  border:3px solid var(--wood-dark);
  border-radius:20px;
  padding:8px 16px; font-size:14px; color:var(--text-main);
  font-weight:bold; white-space:nowrap;
  box-shadow:0 3px 0 rgba(93,58,26,.3);
  transition:transform .08s;
}
.quick-reply:active{transform:translateY(3px); box-shadow:none;}

#inputBar{
  display:flex; gap:10px; padding:10px 14px;
  background:linear-gradient(to bottom,var(--parchment-dark),var(--parchment));
  border-top:4px solid var(--wood-dark); flex-shrink:0;
}
#msgInput{
  flex:1; background:var(--parchment); border:3px solid var(--wood-dark);
  border-radius:10px; padding:10px 14px; font-size:14px; color:var(--text-main);
}
#sendBtn{
  background:linear-gradient(to bottom,var(--gold),var(--gold-dark));
  color:#fff; border:3px solid var(--wood-dark); border-radius:10px;
  padding:0 18px; font-weight:bold;
  box-shadow:0 3px 0 #3a2410;
}
#sendBtn:active{transform:translateY(3px); box-shadow:none;}

#village{position:relative; flex:1; overflow:hidden; background:linear-gradient(to bottom,#87CEEB 0%,#87CEEB 40%,#5B8C3E 40%,#4a7a32 100%);}
#villageMap{position:absolute; inset:0;}
#villageSun{
  position:absolute; top:4%; right:6%; width:56px; height:56px; border-radius:50%;
  background:radial-gradient(circle,#FFEB3B 20%,#FFB300 60%,#FF8F00 100%);
  box-shadow:0 0 30px #FFEB3B, 0 0 60px rgba(255,179,0,.4);
}
#villageSun::after{
  content:''; position:absolute; inset:-8px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,235,59,.3),transparent 70%);
}
.v-cloud{position:absolute; color:#fff; font-size:28px; opacity:.9;}
@keyframes cloudMove{from{transform:translateX(-150px);}to{transform:translateX(600px);}}
.v-decor{position:absolute;}
#villageRiver{
  position:absolute; right:10%; top:45%; bottom:10%; width:8%;
  background:linear-gradient(to bottom,#64B5F6,#42A5F5,#64B5F6);
  border-radius:10px;
}
#villageRiver::before{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 10px,rgba(255,255,255,.3) 10px,rgba(255,255,255,.3) 14px);
  animation:riverFlow 1s linear infinite;
}
@keyframes riverFlow{to{transform:translateY(14px);}}
.v-path{position:absolute; background:var(--wood-light); border-radius:16px;}
.building{
  position:absolute; display:flex; flex-direction:column; align-items:center;
  cursor:pointer; transition:transform .15s; z-index:5;
}
.building:active{transform:scale(.95);}
.building .emoji{font-size:48px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4));}
.building .bname{
  font-size:12px; color:#fff; font-weight:bold; margin-top:4px;
  background:rgba(93,58,26,.85); padding:2px 8px; border-radius:8px;
  border:2px solid #3a2410;
}
.building .bstatus{position:absolute; top:-8px; right:4px; font-size:20px; z-index:6;}
.building.has-task .bstatus{animation:floatY 1.5s infinite;}
.building.locked .emoji{filter:grayscale(1) brightness(.5) drop-shadow(3px 3px 0 rgba(0,0,0,.4));}
.building.locked .bname{background:rgba(80,80,80,.8);}
.building .lock-icon{position:absolute; top:-10px; right:-6px; font-size:24px;}
.smoke{position:absolute; width:12px; height:12px; border-radius:50%; background:rgba(200,200,200,.7); opacity:0;}
@keyframes smokeUp{
  0%{opacity:0; transform:translate(0,0) scale(.5);}
  20%{opacity:.8;}
  100%{opacity:0; transform:translate(-10px,-60px) scale(2.5);}
}
.magic-particle{position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 8px var(--purple);}
@keyframes magicFloat{
  0%{opacity:0; transform:translateY(0) scale(0);}
  30%{opacity:1;}
  100%{opacity:0; transform:translateY(-80px) scale(2);}
}
.magic-glow{position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(126,87,194,.6),transparent 70%); animation:glowPulse 2s ease-in-out infinite;}
@keyframes glowPulse{50%{transform:scale(1.4); opacity:.5;}}
#player{
  position:absolute; font-size:28px; z-index:10;
  transition:left .8s ease, top .8s ease;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.5));
}
#taskTip{
  position:absolute; top:10px; left:10px; right:10px; z-index:20;
  background:rgba(93,58,26,.92); color:#fff; padding:8px 12px;
  border-radius:10px; font-size:13px; font-weight:bold;
  border:3px solid var(--gold); display:flex; align-items:center; gap:8px;
}
#taskTip .tt-icon{font-size:18px;}

#bagTabs{
  display:flex; background:linear-gradient(to bottom,#8B6914,#5D3A1A);
  border-bottom:4px solid #3a2410; flex-shrink:0;
}
#bagTabs .bt{
  flex:1; padding:12px 0; text-align:center; color:#C9B99A;
  font-size:14px; font-weight:bold; position:relative;
}
#bagTabs .bt.active{color:var(--gold);}
#bagTabs .bt.active::after{
  content:""; position:absolute; bottom:0; left:15%; right:15%;
  height:4px; background:var(--gold); border-radius:2px;
  box-shadow:0 0 8px var(--gold);
}
#bagContent{
  flex:1; overflow-y:auto; padding:16px;
  background:var(--parchment);
  background-image:linear-gradient(rgba(139,105,20,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,105,20,.06) 1px,transparent 1px);
  background-size:24px 24px;
}
#bagContent::-webkit-scrollbar{width:0;}

.role-card{
  background:linear-gradient(135deg,#FFE0B2,#FFCC80);
  border:5px solid var(--wood-dark);
  border-radius:16px; padding:18px; position:relative;
  box-shadow:0 5px 0 #3a2410, inset 0 2px 4px rgba(255,255,255,.5);
}
.role-card .lv-badge{
  position:absolute; top:-12px; right:16px;
  background:linear-gradient(to bottom,#FFB300,#E65100);
  color:#fff; padding:6px 12px; border-radius:14px;
  font-size:14px; font-weight:bold; border:3px solid #3a2410;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.role-card .avatar-big{
  width:72px; height:72px; margin:0 auto 10px;
  border-radius:12px; background:#fff; border:4px solid var(--wood-dark);
  display:flex; align-items:center; justify-content:center; font-size:44px;
  box-shadow:0 4px 0 rgba(93,58,26,.3);
}
.role-card .rname{
  text-align:center; font-size:20px; font-weight:bold;
  color:var(--text-main); margin-bottom:12px;
  text-shadow:1px 1px 0 rgba(255,255,255,.8);
}
.role-card .divider{
  height:2px; background:linear-gradient(to right,transparent,var(--wood-dark),transparent);
  margin-bottom:12px;
}
.role-card .info-list{font-size:14px; color:var(--text-main); line-height:2;}
.role-card .info-list .row{display:flex; justify-content:space-between;}
.role-card .info-list .label{color:var(--text-sub); font-weight:bold;}
.xp-bar{
  background:#3a2410; border-radius:10px; height:18px; margin-top:12px;
  overflow:hidden; border:2px solid var(--wood-dark); position:relative;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
}
.xp-bar .fill{
  height:100%; background:linear-gradient(to right,#FFB300,#FFD54F,#FFB300);
  transition:width .5s;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.6), 0 0 8px var(--gold);
}
.xp-bar .xp-text{
  position:absolute; inset:0; text-align:center; font-size:11px; color:#fff;
  line-height:18px; font-weight:bold; text-shadow:0 1px 2px #000;
}
.badge-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center;}
.badge-row .b{
  width:40px; height:40px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-size:24px;
  background:rgba(0,0,0,.1); border:2px solid var(--wood-dark);
}
.badge-row .b.got{
  background:linear-gradient(to bottom,#FFB300,#E65100);
  box-shadow:0 0 12px var(--gold); border:2px solid #3a2410;
}
.badge-row .b.not{filter:grayscale(1); opacity:.3;}

.section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.section-head h3{font-size:16px; color:var(--text-main); font-weight:bold;}
.card-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.mini-card{
  background:var(--parchment); border:3px solid var(--wood-dark);
  border-radius:12px; padding:12px;
  box-shadow:0 4px 0 #3a2410; cursor:pointer;
}
.mini-card .mc-title{font-size:13px; font-weight:bold; margin-bottom:6px; line-height:1.4;}
.mini-card .mc-type{font-size:11px; padding:3px 8px; border-radius:8px; color:#fff; font-weight:bold; display:inline-block; margin-bottom:8px;}
.mini-card .mc-tags{display:flex; flex-wrap:wrap; gap:4px;}
.mini-card .mc-tags span{font-size:10px; padding:3px 7px; background:rgba(255,179,0,.2); color:var(--gold-dark); border-radius:10px; border:1px solid var(--gold);}
.mini-card .mc-status{font-size:12px; margin-top:8px; font-weight:bold;}
.empty-state{display:flex; flex-direction:column; align-items:center; padding:40px 20px; text-align:center; color:var(--text-sub);}
.empty-state .emoji{font-size:60px; opacity:.4; margin-bottom:12px;}
.empty-state .txt{font-size:15px; margin-bottom:16px; line-height:1.6;}

.resume-item{
  background:#fff; border:3px solid var(--purple);
  border-radius:12px; padding:14px; margin-bottom:12px;
  box-shadow:0 0 10px rgba(126,87,194,.2); cursor:pointer;
}
.resume-item .ri-title{font-weight:bold; font-size:15px; color:var(--purple);}
.resume-item .ri-info{font-size:12px; color:var(--text-sub); margin-top:6px;}

.ach-nodes{display:flex; justify-content:space-between; margin-bottom:20px; padding:0 6px;}
.ach-nodes .node{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:var(--text-sub); text-align:center; width:11%;}
.ach-nodes .node .nd{width:20px; height:20px; border-radius:50%; background:#bbb; border:2px solid var(--wood-dark);}
.ach-nodes .node.done .nd{background:var(--gold); box-shadow:0 0 8px var(--gold);}
.ach-nodes .node.active .nd{background:#fff; border-color:var(--gold); animation:blink 1s infinite;}
.badge-wall{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
.badge-wall .bw{
  aspect-ratio:1; border-radius:12px; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:12px; font-weight:bold; padding:6px; text-align:center;
}
.badge-wall .bw .bi{font-size:28px;}
.badge-wall .bw.got{
  background:linear-gradient(to bottom,#FFB300,#E65100);
  color:#fff; border:3px solid #3a2410;
  box-shadow:0 0 12px var(--gold);
}
.badge-wall .bw.not{
  background:rgba(0,0,0,.08); color:#aaa;
  border:3px dashed var(--wood-dark);
}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{
  background:linear-gradient(135deg,#FFE0B2,#FFCC80);
  border:3px solid var(--wood-dark); border-radius:12px;
  padding:14px; text-align:center;
  box-shadow:0 3px 0 #3a2410;
}
.stat-card .num{font-size:28px; font-weight:bold; color:var(--text-main);}
.stat-card .lbl{font-size:13px; color:var(--text-sub); margin-top:4px;}

.setting-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px; background:#fff; border:3px solid var(--wood-light);
  border-radius:12px; margin-bottom:12px; cursor:pointer;
  box-shadow:0 2px 0 rgba(93,58,26,.2);
}
.setting-item:active{background:#f5f0e0; transform:translateY(2px); box-shadow:none;}
.setting-item .si-label{font-size:15px; color:var(--text-main); font-weight:bold;}
.setting-item .si-arrow{color:var(--text-sub); font-size:18px;}

#mask{position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:200; display:none; align-items:center; justify-content:center; padding:16px;}
#mask.show{display:flex;}
.modal{
  background:var(--parchment); border:5px solid var(--wood-dark);
  border-radius:16px; width:100%; max-width:440px; max-height:85vh;
  overflow:hidden; display:flex; flex-direction:column;
  animation:modalIn .25s; box-shadow:0 8px 20px rgba(0,0,0,.5);
}
@keyframes modalIn{from{opacity:0; transform:scale(.85);}to{opacity:1; transform:scale(1);}}
.modal-head{
  background:linear-gradient(to bottom,#8B6914,#5D3A1A);
  color:var(--gold); padding:14px 16px; display:flex;
  justify-content:space-between; align-items:center;
  font-weight:bold; font-size:16px; flex-shrink:0;
}
.modal-head .close{color:#fff; font-size:24px; line-height:1;}
.modal-body{padding:16px; overflow-y:auto; flex:1;}
.modal-body::-webkit-scrollbar{width:0;}
.form-group{margin-bottom:14px;}
.form-group label{display:block; font-size:13px; color:var(--text-sub); margin-bottom:6px; font-weight:bold;}
.form-group input,.form-group textarea,.form-group select{
  width:100%; background:#fff; border:3px solid var(--wood-light);
  border-radius:10px; padding:10px 12px; font-size:14px; color:var(--text-main);
}
.form-group textarea{resize:vertical; min-height:70px;}

.card-detail .cd-type{font-size:12px; padding:4px 10px; border-radius:10px; color:#fff; display:inline-block; margin-bottom:10px; font-weight:bold;}
.cd-block{margin-bottom:12px;}
.cd-block .cd-lbl{font-size:13px; color:var(--text-sub); font-weight:bold;}
.cd-block .cd-txt{
  font-size:14px; color:var(--text-main); line-height:1.6;
  background:#fff; padding:10px; border-radius:8px;
  border:2px solid var(--wood-light); margin-top:4px;
  min-height:24px;
}

.resume-preview{
  background:#fff; padding:20px; border:2px solid var(--wood-light);
  font-family:"Microsoft YaHei",sans-serif; color:#222;
  line-height:1.8; font-size:14px; border-radius:10px;
}
.resume-preview h2{text-align:center; font-size:22px; margin-bottom:6px; font-weight:bold;}
.resume-preview .rp-contact{text-align:center; font-size:13px; color:#666; margin-bottom:12px; border-bottom:2px solid #ddd; padding-bottom:8px;}
.resume-preview h4{font-size:15px; margin:10px 0 6px; border-left:4px solid var(--purple); padding-left:8px; font-weight:bold;}
.resume-preview .rp-exp{margin-bottom:10px;}
.resume-preview .rp-exp .rp-title{font-weight:bold; font-size:14px;}
.resume-preview .rp-li{font-size:13px; color:#444; margin-left:12px;}

#taskReward{position:absolute; inset:0; z-index:300; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7);}
#taskReward.show{display:flex;}
.reward-box{
  background:linear-gradient(to bottom,#FFD54F,#FFB300);
  border:5px solid var(--wood-dark); border-radius:20px;
  padding:28px; text-align:center; max-width:320px;
  animation:popIn .5s; box-shadow:0 0 40px var(--gold);
}
@keyframes popIn{0%{transform:scale(0);}60%{transform:scale(1.1);}100%{transform:scale(1);}}
.reward-box .star-anim{font-size:48px; animation:starSpin 1s ease-out;}
@keyframes starSpin{from{transform:rotate(0) scale(0);}to{transform:rotate(360deg) scale(1);}}
.reward-box .rt{font-size:22px; font-weight:bold; color:var(--wood-dark); margin:10px 0;}
.reward-box .rxp{font-size:32px; color:var(--red); font-weight:bold; margin:8px 0; animation:xpBounce .6s;}
@keyframes xpBounce{0%{transform:scale(0);}50%{transform:scale(1.4);}100%{transform:scale(1);}}
.reward-box .rbadge{font-size:36px; margin:8px 0;}
.reward-box .rbtn{
  margin-top:12px; background:var(--wood-dark); color:#fff;
  padding:10px 24px; border-radius:10px; font-weight:bold;
  font-size:15px; border:3px solid #3a2410;
}

.xp-float{
  position:absolute; color:var(--gold); font-weight:bold; font-size:20px;
  text-shadow:0 2px 3px rgba(0,0,0,.6); pointer-events:none; z-index:150;
  animation:xpFloat 1.2s ease-out forwards;
}
@keyframes xpFloat{0%{opacity:1; transform:translateY(0);}100%{opacity:0; transform:translateY(-60px);}}

#toast{
  position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:250;
  background:rgba(62,39,35,.95); color:var(--gold); padding:10px 20px;
  border-radius:10px; border:2px solid var(--gold);
  font-size:14px; font-weight:bold; opacity:0; transition:all .3s;
  white-space:nowrap; max-width:90%;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(8px);}

.red-dot{position:absolute; top:2px; right:2px; width:10px; height:10px; background:var(--red); border-radius:50%; display:none;}
.red-dot.show{display:block; animation:blink 1s infinite;}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
  <div id="welcome">
    <div id="sun"></div>
    <div class="cloud" style="top:12%; left:10%; animation:cloudMove 40s linear infinite;">☁️</div>
    <div class="cloud" style="top:20%; left:50%; animation:cloudMove 55s linear infinite;">☁️</div>
    <div class="welcome-tree" style="left:8%;">🌲</div>
    <div class="welcome-tree" style="right:10%;">🌳</div>
    <div class="welcome-flower" style="left:25%; bottom:34%;">🌼</div>
    <div class="welcome-flower" style="left:60%; bottom:33%;">🌷</div>
    <div class="welcome-flower" style="left:40%; bottom:35%;">🌻</div>
    <h1>简历新手村</h1>
    <p>你的求职冒险，从这里开始</p>
    <button class="btn-gold start-btn" onclick="startGame()">▶ 开始新游戏</button>
  </div>

  <div id="topbar">
    <div class="top-left">
      <span class="icon-home">🏠</span>
      <span class="title">简历新手村</span>
    </div>
    <div class="task-dots" id="taskDots"></div>
    <div class="top-right">
      <div class="lv-badge" id="lvText">Lv.1</div>
      <div class="avatar-frame">🧑‍🌾</div>
    </div>
  </div>

  <div class="page" id="page-chat">
    <div id="npcList"></div>
    <div id="chatArea"></div>
    <div id="quickReplies"></div>
    <div id="inputBar">
      <input id="msgInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <div class="page" id="page-village">
    <div id="village">
      <div id="villageMap"></div>
      <div id="taskTip"><span class="tt-icon">📋</span><span id="taskTipText">当前任务：初入新手村</span></div>
    </div>
  </div>

  <div class="page" id="page-bag">
    <div id="bagTabs">
      <div class="bt active" data-bag="role" onclick="switchBag('role')">角色</div>
      <div class="bt" data-bag="cards" onclick="switchBag('cards')">经历卡</div>
      <div class="bt" data-bag="resume" onclick="switchBag('resume')">简历</div>
      <div class="bt" data-bag="ach" onclick="switchBag('ach')">成就</div>
      <div class="bt" data-bag="setting" onclick="switchBag('setting')">设置</div>
    </div>
    <div id="bagContent"></div>
  </div>

  <div id="navbar">
    <div class="nav-tab active" data-tab="chat" onclick="switchTab('chat')">
      <span class="ico">💬</span><span>对话</span><span class="badge" id="dot-chat"></span>
    </div>
    <div class="nav-tab" data-tab="village" onclick="switchTab('village')">
      <span class="ico">🏘️</span><span>村子</span><span class="badge" id="dot-village"></span>
    </div>
    <div class="nav-tab" data-tab="bag" onclick="switchTab('bag')">
      <span class="ico">🎒</span><span>背包</span><span class="badge" id="dot-bag"></span>
    </div>
  </div>

  <div id="mask"><div class="modal" id="modal"><div class="modal-head"><span id="modalTitle">标题</span><span class="close" onclick="closeModal()">×</span></div><div class="modal-body" id="modalBody"></div></div></div>

  <div id="taskReward">
    <div class="reward-box">
      <div class="star-anim">🎉</div>
      <div class="rt" id="rewardTitle">任务完成！</div>
      <div class="rxp" id="rewardXp">+0 XP</div>
      <div class="rbadge" id="rewardBadge"></div>
      <button class="rbtn" onclick="closeReward()">太棒了！</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};

const LEVELS = [
  {lv:1, xp:0,    title:'新手冒险者'},
  {lv:2, xp:100,  title:'见习锻造师'},
  {lv:3, xp:300,  title:'任务收集者'},
  {lv:4, xp:600,  title:'简历学徒'},
  {lv:5, xp:1000, title:'求职勇士'},
  {lv:6, xp:1500, title:'简历大师'},
  {lv:7, xp:2200, title:'求职导师'}
];

const TASKS = [
  {id:1, name:'初入新手村', desc:'填写身份卡', xp:50,  badge:'🏅'},
  {id:2, name:'明确方向',   desc:'完成求职方向测试', xp:80,  badge:''},
  {id:3, name:'首次锻造',   desc:'生成第一张经历卡', xp:100, badge:'⚒️'},
  {id:4, name:'装备升级',   desc:'生成第二张经历卡', xp:80,  badge:''},
  {id:5, name:'接受挑战',   desc:'完成第一次 JD 拆解', xp:100, badge:'📋'},
  {id:6, name:'魔法组装',   desc:'生成第一份定制简历', xp:150, badge:'✨'},
  {id:7, name:'精准投递',   desc:'生成第二份不同岗位简历', xp:120, badge:''},
  {id:8, name:'冒险启程',   desc:'导出简历文件', xp:200, badge:'🎯'}
];

const PRESET_CARDS = [
  {
    id:'preset1', title:'校园公众号运营', type:'club',
    background:'社团公众号粉丝增长停滞，互动率下降，需要重新激活粉丝。',
    task:'负责内容策划和日常运营，提升账号活跃度。',
    action:'优化选题方向，每周产出3-5篇推文，设计排版风格，跟踪阅读数据并迭代。',
    result:'3个月粉丝增长30%，单篇最高阅读量提升50%，互动率显著回升。',
    tags:['内容运营','数据分析','文案写作','创意'],
    jobs:['内容运营','产品运营','市场营销'], confirmed:true, createdAt:Date.now()-86400000
  },
  {
    id:'preset2', title:'课程项目：用户调研', type:'course',
    background:'课程要求完成一个完整的用户研究项目，针对某产品的用户痛点。',
    task:'担任组长，负责调研方案设计与执行。',
    action:'设计200+份问卷，完成10次深度访谈，用Excel分析数据，撰写万字调研报告。',
    result:'获得A分，3个核心问题被产品方采纳，推动功能改进。',
    tags:['用户研究','数据分析','报告撰写','项目管理','沟通'],
    jobs:['产品运营','产品经理','数据分析'], confirmed:true, createdAt:Date.now()-43200000
  }
];

const PRESET_JOBS = [
  {
    id:'job1', title:'产品运营实习生',
    jd:'负责用户调研、协助内容运营、数据整理、用户反馈收集',
    requirements:['用户调研能力','内容运营','数据整理能力','沟通能力'],
    tasks:['用户访谈与问卷','内容选题与排版','数据日报周报','用户反馈跟进'],
    matchTags:['用户研究','数据分析','内容运营','沟通','文案写作']
  },
  {
    id:'job2', title:'内容运营实习生',
    jd:'负责文案撰写、账号运营、热点追踪、数据分析',
    requirements:['文案撰写能力','新媒体运营','热点敏感度','数据分析'],
    tasks:['日常文案产出','账号日常运营','热点选题策划','运营数据复盘'],
    matchTags:['文案写作','内容运营','数据分析','创意','新媒体']
  },
  {
    id:'job3', title:'市场营销实习生',
    jd:'负责活动策划、宣传推广、渠道拓展、效果复盘',
    requirements:['活动策划能力','宣传推广','渠道拓展','沟通表达'],
    tasks:['线上线下活动策划','宣传物料制作','渠道合作拓展','活动效果复盘'],
    matchTags:['活动策划','沟通','项目管理','创意','推广']
  }
];

const TYPE_MAP = {
  course:{label:'课程项目', color:'#4CAF50'},
  club:{label:'社团活动', color:'#2196F3'},
  intern:{label:'实习经历', color:'#FFB300'},
  competition:{label:'比赛经历', color:'#E53935'},
  volunteer:{label:'志愿兼职', color:'#7E57C2'},
  personal:{label:'个人项目', color:'#00897B'}
};

const NPCS = [
  {id:'chief', name:'刘村长',   emoji:'👨‍🌾', area:'village', unlock:'village', num:1},
  {id:'smith', name:'老陈铁匠', emoji:'🧔',   area:'smith',   unlock:'smith',   num:2},
  {id:'guild', name:'小林会长', emoji:'🧑',   area:'guild',   unlock:'guild',   num:3},
  {id:'mage',  name:'星月魔法', emoji:'🧙‍♂️', area:'mage',    unlock:'mage',    num:4}
];

let state = {
  profile:{}, cards:[], jobs:[], resumes:[],
  level:1, xp:0, completedTasks:[], currentTask:1, badges:[],
  unlocked:['village','smith'], firstVisit:true,
  currentNPC:'chief', currentBag:'role',
  npcStage:{chief:'init', smith:'init', guild:'init', mage:'init'},
  forging:{}, lastJobId:null
};

function init(){
  loadState();
  const wasFirstVisit = state.firstVisit;
  if(state.firstVisit){
    state.cards = PRESET_CARDS.map(c=>({...c}));
    state.firstVisit = false;
    saveState();
  } else {
    document.getElementById('welcome').classList.add('hide');
  }
  renderAll();
  if(!wasFirstVisit){
    selectNPC('chief');
    switchTab('chat');
  } else {
    switchTab('chat');
  }
}

function loadState(){
  state.profile = LS.get('rv_profile',{});
  state.cards = LS.get('rv_cards',[]);
  state.jobs = LS.get('rv_jobs',[]);
  state.resumes = LS.get('rv_resumes',[]);
  state.level = LS.get('rv_level',1);
  state.xp = LS.get('rv_xp',0);
  state.completedTasks = LS.get('rv_completedTasks',[]);
  state.currentTask = LS.get('rv_currentTask',1);
  state.badges = LS.get('rv_badges',[]);
  state.unlocked = LS.get('rv_unlocked',['village','smith']);
  state.firstVisit = LS.get('rv_firstVisit',true);
  state.npcStage = LS.get('rv_npcStage',{chief:'init',smith:'init',guild:'init',mage:'init'});
  state.forging = LS.get('rv_forging',{});
  state.lastJobId = LS.get('rv_lastJobId',null);
}
function saveState(){
  LS.set('rv_profile',state.profile);
  LS.set('rv_cards',state.cards);
  LS.set('rv_jobs',state.jobs);
  LS.set('rv_resumes',state.resumes);
  LS.set('rv_level',state.level);
  LS.set('rv_xp',state.xp);
  LS.set('rv_completedTasks',state.completedTasks);
  LS.set('rv_currentTask',state.currentTask);
  LS.set('rv_badges',state.badges);
  LS.set('rv_unlocked',state.unlocked);
  LS.set('rv_firstVisit',state.firstVisit);
  LS.set('rv_npcStage',state.npcStage);
  LS.set('rv_forging',state.forging);
  LS.set('rv_lastJobId',state.lastJobId);
}

function startGame(){
  document.getElementById('welcome').classList.add('hide');
  selectNPC('chief');
  switchTab('chat');
}

function renderAll(){
  renderTopbar();
  renderNpcList();
  renderVillage();
  renderBag();
  updateBadges();
}

function renderTopbar(){
  const cur = LEVELS.find(l=>l.lv===state.level);
  document.getElementById('lvText').textContent = `Lv.${state.level} ${cur.title}`;
  const dots = document.getElementById('taskDots');
  dots.innerHTML = '';
  for(let i=1;i<=8;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    if(state.completedTasks.includes(i)) d.classList.add('done');
    else if(i===state.currentTask) d.classList.add('active');
    dots.appendChild(d);
  }
}

function switchTab(tab){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='chat') renderNpcList();
  if(tab==='village') renderVillage();
  if(tab==='bag') renderBag();
  document.getElementById('dot-'+tab)?.classList.remove('show');
}

function renderNpcList(){
  const list = document.getElementById('npcList');
  list.innerHTML = '';
  NPCS.forEach(npc=>{
    const unlocked = isUnlocked(npc.unlock);
    const item = document.createElement('div');
    item.className = 'npc-item' + (state.currentNPC===npc.id?' selected':'') + (!unlocked?' locked':'') + (npcHasTask(npc.id)?' has-task':'');
    item.innerHTML = `
      <div class="face">${unlocked?npc.emoji:'🔒'}<span class="num">${npc.num}</span></div>
      <div class="name">${npc.name}</div>`;
    item.onclick = ()=>{
      if(!unlocked){ toast('该区域尚未解锁'); return; }
      selectNPC(npc.id);
    };
    list.appendChild(item);
  });
}

function isUnlocked(area){ return state.unlocked.includes(area); }

function npcHasTask(id){
  const cur = state.currentTask;
  if(id==='chief' && (cur===1||cur===2)) return true;
  if(id==='smith' && (cur===3||cur===4)) return true;
  if(id==='guild' && cur===5) return true;
  if(id==='mage' && (cur===6||cur===7||cur===8)) return true;
  return false;
}

let chatHistory = LS.get('rv_chatHistory',{chief:[],smith:[],guild:[],mage:[]});

function selectNPC(id){
  state.currentNPC = id;
  renderNpcList();
  renderChat();
  if(chatHistory[id].length===0){
    setTimeout(()=>npcSpeak(id),300);
  }
}

function renderChat(){
  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  (chatHistory[state.currentNPC]||[]).forEach(m=>appendMsg(m,false));
  area.scrollTop = area.scrollHeight;
  renderQuickReplies();
}

function appendMsg(m, animate=true){
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role||'npc');
  let inner = '';
  if(m.role==='system'){
    inner = `<div class="bubble">${m.text}</div>`;
  } else if(m.role==='announce'){
    inner = `<div class="bubble">${m.text}</div>`;
  } else if(m.type==='card'){
    inner = renderCardMsg(m.card);
    div.className = 'msg npc';
  } else if(m.type==='resume'){
    inner = renderResumeMsg(m.resume);
    div.className = 'msg npc';
  } else {
    const npc = NPCS.find(n=>n.id===m.npc);
    const av = m.role==='npc' ? (npc?npc.emoji:'🧙') : '🧑‍🌾';
    inner = `<div class="av">${av}</div><div class="bubble">${m.text}</div>`;
  }
  div.innerHTML = inner;
  if(m.type==='card'){
    div.querySelector('.card-msg')?.addEventListener('click', ()=>openCardDetail(m.card.id));
    div.querySelector('.confirm-card')?.addEventListener('click', e=>{e.stopPropagation(); confirmCard(m.card.id);});
    div.querySelector('.edit-card')?.addEventListener('click', e=>{e.stopPropagation(); openCardEditor(m.card.id);});
  }
  if(m.type==='resume'){
    div.querySelector('.rbtn')?.addEventListener('click', ()=>openResumeDetail(m.resume.id));
  }
  area.appendChild(div);
  if(animate) area.scrollTop = area.scrollHeight;
}

function renderCardMsg(card){
  const t = TYPE_MAP[card.type]||{label:'经历',color:'#888'};
  return `<div class="card-msg">
    <div class="ct"><span class="title">${card.title}</span><span class="type-tag" style="background:${t.color}">${t.label}</span></div>
    <div class="star"><b>S 背景：</b>${card.background||'-'}</div>
    <div class="star"><b>T 任务：</b>${card.task||'-'}</div>
    <div class="star"><b>A 行动：</b>${card.action||'-'}</div>
    <div class="star"><b>R 结果：</b>${card.result||'-'}</div>
    <div class="tags">${(card.tags||[]).map(tg=>`<span>${tg}</span>`).join('')}</div>
    <div class="acts">
      ${card.confirmed ? `<button class="btn-wood" style="flex:1">✅ 已确认</button>` :
        `<button class="btn-wood edit-card">✏️ 修改</button><button class="btn-gold confirm-card" style="padding:6px">确认保存</button>`}

function renderResumeMsg(r){

function npcSpeak(id, text){
  if(!text){
    if(id==='chief') chiefSpeak();
    else if(id==='smith') smithSpeak();
    else if(id==='guild') guildSpeak();
    else if(id==='mage') mageSpeak();
    return;
  }
  const msg = {npc:id, text, role:'npc', time:Date.now()};
  chatHistory[id].push(msg);
  appendMsg(msg);
  LS.set('rv_chatHistory',chatHistory);
}

function userSpeak(text){
  const msg = {npc:state.currentNPC, text, role:'user', time:Date.now()};
  chatHistory[state.currentNPC].push(msg);

  LS.set('rv_chatHistory',chatHistory);
}

function systemMsg(text){

}

function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();

  input.value = '';

}

function guildShowMatch(){
  const job = PRESET_JOBS.find(j=>j.id===state.lastJobId);
  if(!job) return;
  const confirmedCards = state.cards.filter(c=>c.confirmed);
  let matchHtml = '';
  confirmedCards.forEach(card=>{
    const matches = (card.tags||[]).filter(t=>job.matchTags.includes(t));
    const matchPercent = Math.round((matches.length / job.matchTags.length) * 100);
    const t = TYPE_MAP[card.type]||{label:'经历',color:'#888'};

/* ============ NPC 对话脚本 - 星月魔法师 ============ */
function mageSpeak(){

  if(stage==='init'){
    npcSpeak('mage','欢迎来到魔法塔！我是星月魔法师。在这里，我可以帮你将经历卡组装成精美的定制简历。');

  } else if(stage==='generating'){
    npcSpeak('mage','选择好经历卡，我来帮你生成定制简历！');
  } else {
    npcSpeak('mage','继续生成更多简历，每一份都是独一无二的魔法作品！');

function mageReply(text){

  }
}

function mageStartResume(){
  state.npcStage.mage = 'selecting';
  saveState();
  mageSelectJob();
}

function mageSelectJob(){
  const jobOptions = PRESET_JOBS.map(j=>`
    <button class="btn-round" onclick="mageChooseJob('${j.id}')" style="justify-content:flex-start;padding-left:20px;text-align:left;">
      <div style="font-weight:bold;">${j.title}</div>

function mageChooseJob(jobId){
  const job = PRESET_JOBS.find(j=>j.id===jobId);
  if(!job) return;
  state.lastJobId = jobId;
  state.npcStage.mage = 'generating';
  saveState();
  closeModal();
  npcSpeak('mage','好的，我们来为「' + job.title + '」生成定制简历。');
  setTimeout(()=>{
    mageGenerate();
  },800);
}

function mageGenerate(){
  const job = PRESET_JOBS.find(j=>j.id===state.lastJobId);
  const confirmedCards = state.cards.filter(c=>c.confirmed);
  if(confirmedCards.length===0){
    toast('请先确认至少一张经历卡！');
    return;
  }
  const resume = {
    id:'resume_'+Date.now(),
    jobTitle:job.title,
    jobId:state.lastJobId,
    cardIds:confirmedCards.map(c=>c.id),
    createdAt:Date.now()
  };
  state.resumes.push(resume);
  saveState();
  npcSpeak('mage','魔法组装完成！这是你的定制简历：');
  setTimeout(()=>{
    const msg = {npc:'mage', type:'resume', resume, role:'npc', time:Date.now()};
    chatHistory['mage'].push(msg);
    appendMsg(msg);
    LS.set('rv_chatHistory',chatHistory);
    const resumeCount = state.resumes.length;
    if(resumeCount===1) completeTask(6);
    if(resumeCount===2) completeTask(7);
    state.npcStage.mage = 'done';
    saveState();
  },800);
}

function openResumeDetail(id){
  const resume = state.resumes.find(r=>r.id===id);
  if(!resume) return;
  const cards = resume.cardIds.map(cid=>state.cards.find(c=>c.id===cid)).filter(Boolean);
  const profile = state.profile;
  let expHtml = '';

    expHtml += `
      <div class="rp-exp">
        <div class="rp-title">${card.title} <span style="font-weight:normal;font-size:12px;color:#666;">(${t.label})</span></div>
        <div class="rp-li">• ${card.action}</div>
        <div class="rp-li" style="color:#666;">→ ${card.result}</div>

  });

      <div class="rp-contact">${profile.school||''} | ${profile.major||''} | ${profile.contact||''}</div>
      <h4>求职意向</h4>

      <div style="margin-left:12px;">${[...new Set(cards.flatMap(c=>c.tags||[]))].map(t=>`<span class="skill-pill">${t}</span>`).join(' ')}</div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn-wood" onclick="exportResume('${id}')" style="flex:1;">📥 导出简历</button>
    </div>
  `);
}

function exportResume(id){
  const resume = state.resumes.find(r=>r.id===id);
  if(!resume) return;
  const cards = resume.cardIds.map(cid=>state.cards.find(c=>c.id===cid)).filter(Boolean);
  const profile = state.profile;
  let text = `=== ${profile.name||'求职者'} 的简历 ===\n\n`;
  text += `求职意向：${resume.jobTitle}\n`;
  text += `基本信息：${profile.school||''} | ${profile.major||''} | ${profile.grade||''}\n`;
  text += `联系方式：${profile.contact||''}\n\n`;
  text += `=== 项目经历 ===\n\n`;
  cards.forEach((card,i)=>{
    text += `${i+1}. ${card.title}\n`;
    text += `   类型：${TYPE_MAP[card.type]?.label||'经历'}\n`;
    text += `   背景：${card.background}\n`;
    text += `   任务：${card.task}\n`;
    text += `   行动：${card.action}\n`;
    text += `   结果：${card.result}\n`;
    text += `   标签：${(card.tags||[]).join(', ')}\n\n`;
  });
  text += `=== 技能标签 ===\n`;
  text += [...new Set(cards.flatMap(c=>c.tags||[]))].join(' | ');
  
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${profile.name||'简历'}_${resume.jobTitle}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  
  completeTask(8);
  toast('📥 简历已导出！');
}

/* ============ 任务系统 ============ */
function completeTask(taskId){
  if(state.completedTasks.includes(taskId)) return;
  state.completedTasks.push(taskId);
  state.completedTasks.sort((a,b)=>a-b);
  const task = TASKS.find(t=>t.id===taskId);
  if(task){
    addXP(task.xp);
    if(task.badge) addBadge(task.badge);
    showReward(task);
    // 推进当前任务
    const nextTask = TASKS.find(t=>t.id===taskId+1);
    if(nextTask && !state.completedTasks.includes(nextTask.id)){
      state.currentTask = nextTask.id;
    }
  }
  saveState();
  renderTopbar();
  updateBadges();
}

function addXP(xp){
  state.xp += xp;
  // 检查升级
  const nextLevel = LEVELS.find(l=>l.lv>state.level && state.xp>=l.xp);
  if(nextLevel){
    state.level = nextLevel.lv;
    announceMsg(`🎉 恭喜升级！你现在是 Lv.${state.level} ${nextLevel.title}！`);
  }
  saveState();
  renderTopbar();
}

function addBadge(badge){
  if(!state.badges.includes(badge)){
    state.badges.push(badge);
    saveState();
  }
}

function showReward(task){
  document.getElementById('rewardTitle').textContent = '任务完成：' + task.name;
  document.getElementById('rewardXp').textContent = '+' + task.xp + ' XP';
  document.getElementById('rewardBadge').textContent = task.badge || '';
  document.getElementById('taskReward').classList.add('show');
}

function closeReward(){
  document.getElementById('taskReward').classList.remove('show');
}

function unlockArea(area){
  if(!state.unlocked.includes(area)){
    state.unlocked.push(area);
    saveState();
    renderAll();
    toast('🔓 新区域已解锁！');
  }
}

  // 建筑

    {id:'village', emoji:'🏠', name:'村长办公室', left:'18%', top:'35%', npc:'chief', status:'❗'},
    {id:'smith', emoji:'⚒️', name:'铁匠铺', left:'60%', top:'55%', npc:'smith', status:'❗', smoke:true},
    {id:'guild', emoji:'🛡️', name:'冒险者公会', left:'35%', top:'65%', npc:'guild', status:'❗'},

  buildings.forEach(b=>{
    const unlocked = isUnlocked(b.id);

    el.style = `left:${b.left};top:${b.top};`;

      <div class="emoji">${unlocked?b.emoji:'🏚️'}</div>
      <div class="bname">${b.name}</div>
      ${hasTask ? `<div class="bstatus">${b.status}</div>` : ''}
      ${!unlocked ? '<div class="lock-icon">🔒</div>' : ''}
    `;
    el.onclick = ()=>{
      if(!unlocked){ toast('该区域尚未解锁'); return; }
      selectNPC(b.npc);
      switchTab('chat');
    };
    map.appendChild(el);

    if(b.smoke && unlocked){

/* ============ 弹窗系统 ============ */
function openModal(title, body, onOk){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('mask').classList.add('show');
  
  // 添加确认按钮
  if(onOk){
    const btn = document.createElement('button');
    btn.className = 'ok-btn btn-gold';
    btn.style = 'display:none;';
    btn.onclick = onOk;
    document.getElementById('modalBody').appendChild(btn);
  }
}

function closeModal(){
  document.getElementById('mask').classList.remove('show');
}

/* ============ Toast 提示 ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ============ 更新红点徽章 ============ */
function updateBadges(){
  const chatHasTask = npcHasTask(state.currentNPC);
  document.getElementById('dot-chat').classList.toggle('show', chatHasTask);
  document.getElementById('dot-village').classList.toggle('show', false);
  document.getElementById('dot-bag').classList.toggle('show', false);
}
