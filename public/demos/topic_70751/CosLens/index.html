<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosLens · 二次元角色美瞳还原推荐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="logo">◐</span>
      <span class="brand-name">CosLens</span>
    </div>
    <p class="tagline">上传二次元角色图 · AI 识别眼睛特征 · 推荐最接近的真实美瞳</p>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <section id="upload-area" class="card upload-card">
      <label id="drop-zone" class="drop-zone" for="file-input">
        <input type="file" id="file-input" accept="image/*" hidden />
        <div id="upload-placeholder" class="upload-placeholder">
          <span class="upload-icon">＋</span>
          <span class="upload-text">点击选择 / 拖入 一张二次元角色图</span>
          <span class="upload-hint">建议选眼睛清晰、正面的角色图，识别更稳</span>
        </div>
        <img id="preview-img" class="preview-img hidden" alt="预览" />
      </label>

      <div class="action-row">
        <button id="analyze-btn" class="btn btn-primary" disabled>开始分析</button>
        <button id="demo-btn" class="btn btn-ghost" title="无需 API Key，用示例特征验证推荐逻辑">示例特征测试</button>
      </div>
      <p id="status-line" class="status-line"></p>
    </section>

    <!-- 识别特征展示区 -->
    <section id="feature-area" class="card feature-card hidden">
      <h2 class="section-title">识别到的美瞳特征</h2>
      <div id="feature-grid" class="feature-grid"></div>
    </section>

    <!-- 推荐结果区 -->
    <section id="result-area" class="card result-card hidden">
      <h2 class="section-title">为你推荐的美瞳</h2>
      <div id="result-list" class="result-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>CosLens · TRAE AI 创造力大赛作品</span>
  </footer>

  <!-- 经典脚本，双击 index.html 即可离线运行（无需本地服务器 / 无需 API Key） -->
  <!-- 加载顺序不可乱：config → 商品库 → 匹配 → AI → 主流程 -->
  <script src="config.js"></script>
  <script src="data/products.js"></script>
  <script src="match.js"></script>
  <script src="ai.js"></script>
  <script src="main.js"></script>
</body>
</html>
