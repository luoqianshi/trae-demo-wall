<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MACHINE · Interactive Demo</title>
<style>
  :root {
    --bg: #1a1b26;
    --bg-terminal: #16161e;
    --fg: #a9b1d6;
    --green: #7ee2a0;
    --cyan: #5fd4f5;
    --purple: #bb9af7;
    --magenta: #f7768e;
    --yellow: #e0af68;
    --gray: #565f89;
    --border: #3b4261;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Cascadia Code", "Consolas", "Menlo", monospace;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    color: var(--green);
    font-size: 1.4em;
    margin-bottom: 5px;
  }
  .subtitle { color: var(--gray); font-size: 0.85em; margin-bottom: 20px; }

  /* 按钮区 */
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cyan);
    padding: 8px 16px;
    font-family: inherit;
    font-size: 0.85em;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: rgba(126, 226, 160, 0.08);
  }
  .btn:active { transform: translateY(1px); }
  .btn-warn { border-color: var(--yellow); color: var(--yellow); }

  /* 终端窗口 */
  .terminal {
    background: var(--bg-terminal);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    min-height: 500px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    position: relative;
  }
  .terminal::before {
    content: "● ● ●";
    color: var(--border);
    font-size: 10px;
    position: absolute;
    top: 8px;
    left: 15px;
    letter-spacing: 4px;
  }
  .terminal-body { margin-top: 15px; }

  /* 命令行提示符 */
  .prompt { color: var(--green); }
  .prompt .path { color: var(--cyan); }
  .cmd { color: var(--fg); }

  /* Rich Panel 模拟 */
  .panel-box {
    border: 1px solid var(--green);
    border-radius: 0;
    margin: 8px 0;
    padding: 0;
  }
  .panel-box .panel-header {
    color: var(--green);
    padding: 4px 12px;
    font-weight: bold;
    border-bottom: 1px solid var(--green);
    font-size: 0.95em;
  }
  .panel-box .panel-body { padding: 8px 12px; }
  .panel-box.cyan { border-color: var(--cyan); }
  .panel-box.cyan .panel-header { color: var(--cyan); border-bottom-color: var(--cyan); }
  .panel-box.yellow { border-color: var(--yellow); }
  .panel-box.yellow .panel-header { color: var(--yellow); border-bottom-color: var(--yellow); }

  /* 分隔线 */
  .sep { color: var(--border); }

  /* 表格 */
  .rich-table {
    border-collapse: collapse;
    width: 100%;
    margin: 4px 0;
  }
  .rich-table td, .rich-table th {
    padding: 3px 12px;
    text-align: left;
  }
  .rich-table .divider td {
    border-top: 1px solid var(--border);
  }

  /* 双栏 watch 布局 */
  .watch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 8px 0;
  }
  .watch-col {
    border: 1px solid var(--border);
    border-radius: 0;
  }
  .watch-col.intel { border-color: var(--cyan); }
  .watch-col.social { border-color: var(--magenta); }
  .watch-col .col-header {
    padding: 3px 8px;
    font-size: 0.9em;
    font-weight: bold;
    border-bottom: 1px solid var(--border);
  }
  .watch-col.intel .col-header { color: var(--cyan); }
  .watch-col.social .col-header { color: var(--magenta); }
  .watch-col .col-body { padding: 4px 8px; }
  .watch-item { margin-bottom: 6px; font-size: 0.88em; }
  .watch-item .ts { color: var(--gray); }
  .watch-item .src { color: var(--cyan); }
  .watch-item.social-item .src { color: var(--magenta); }
  .watch-item .content { color: var(--fg); }
  .watch-item .entities { font-size: 0.9em; }
  .entity-new { color: var(--yellow); }
  .entity-confirmed { color: var(--green); }

  /* 关联实体条形图 */
  .bar-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .bar-label { color: var(--purple); min-width: 80px; }
  .bar-track { background: rgba(187,154,247,0.15); border-radius: 2px; height: 14px; }
  .bar-fill { background: var(--purple); height: 100%; border-radius: 2px; }
  .bar-count { color: var(--gray); font-size: 0.85em; }

  /* 光标 */
  .cursor::after {
    content: "▋";
    color: var(--green);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 逐行显示动画 */
  .line { opacity: 0; animation: fadeIn 0.15s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Human Pass 弹窗 */
  .human-pass {
    border: 1px solid var(--yellow);
    margin: 8px 0;
    padding: 0;
  }
  .human-pass .hp-header {
    color: var(--yellow);
    padding: 4px 12px;
    font-weight: bold;
    border-bottom: 1px solid var(--yellow);
  }
  .human-pass .hp-body { padding: 6px 12px; }
  .human-pass .hp-input {
    color: var(--green);
    margin-top: 4px;
  }

  .footer { color: var(--gray); font-size: 0.8em; margin-top: 8px; }
  .hint { color: var(--gray); font-size: 0.8em; margin-top: 15px; }
</style>
</head>
<body>

<h1>THE MACHINE · Interactive Demo</h1>
<p class="subtitle">个人情报系统 CLI — 2 域采集 + 共享实体库 + 人机飞轮 | 点击下方按钮体验各命令</p>

<div class="toolbar">
  <button class="btn" onclick="runCommand('status')">machine status</button>
  <button class="btn" onclick="runCommand('watch')">machine watch</button>
  <button class="btn" onclick="runCommand('query_openai')">machine query OpenAI</button>
  <button class="btn" onclick="runCommand('query_open')">machine query open</button>
  <button class="btn btn-warn" onclick="clearTerminal()">清空</button>
</div>

<div class="terminal">
  <div class="terminal-body" id="terminalBody"></div>
</div>

<p class="hint">提示：点击按钮模拟命令执行。watch 命令含动画效果，请等待播放完成。</p>

<script>
const term = document.getElementById('terminalBody');

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function clearTerminal() { term.innerHTML = ''; }

async function printLine(html, delay = 30) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  await sleep(delay);
}

async function printPrompt(cmd) {
  await printLine(`<span class="prompt">➜  <span class="path">~/the-machine</span></span> <span class="cmd">${cmd}</span>`, 50);
  await sleep(200);
}

async function runCommand(name) {
  clearTerminal();
  if (name === 'status') return runStatus();
  if (name === 'watch') return runWatch();
  if (name === 'query_openai') return runQueryOpenAI();
  if (name === 'query_open') return runQueryOpen();
}

        <tr class="divider"></tr>
        <tr><td>情报域</td><td>D-01</td><td style="color:var(--green)">ONLINE 🟢</td><td style="color:var(--cyan)">15</td><td style="color:var(--cyan)">10</td></tr>
        <tr><td>交易域</td><td>D-02</td><td style="color:var(--gray)">PLAN ⚪</td><td style="color:var(--gray)">-</td><td style="color:var(--gray)">-</td></tr>
        <tr><td>暴露面域</td><td>D-03</td><td style="color:var(--gray)">PLAN ⚪</td><td style="color:var(--gray)">-</td><td style="color:var(--gray)">-</td></tr>
        <tr><td>社交域</td><td>D-04</td><td style="color:var(--green)">ONLINE 🟢</td><td style="color:var(--cyan)">17</td><td style="color:var(--cyan)">6</td></tr>
        <tr><td>安全域</td><td>D-05</td><td style="color:var(--gray)">PLAN ⚪</td><td style="color:var(--gray)">-</td><td style="color:var(--gray)">-</td></tr>
        <tr><td>知识域</td><td>D-06</td><td style="color:var(--gray)">PLAN ⚪</td><td style="color:var(--gray)">-</td><td style="color:var(--gray)">-</td></tr>
      </table>
    </div>
  </div>`;
  await printLine(html, 50);
}

// ========= machine watch =========
async function runWatch() {
  await printPrompt('machine watch');
  await sleep(400);

  // 帧1：空双栏
  await printFrame1();
  await sleep(800);

  // 帧2：情报域第一条 + 社交域第一条
  await printFrame2();
  await sleep(800);

  // Human Pass 弹窗
  await printHumanPass('情报域', 'Meta', 'topic', 'Meta is sued by 26 current and former employees...');
  await sleep(1000);

  // 帧3：更多数据 + 已确认
  await printFrame3();
  await sleep(600);

  // 结束面板
  await printLine(`
  <div class="panel-box" style="border-color:var(--green)">
    <div class="panel-header" style="color:var(--green)">THE MACHINE · watch 结束</div>
    <div class="panel-body">
      <div class="sep">───────────────────────────────────────────────────────────────</div>
      <div>本次采集 <span style="color:var(--cyan)">20</span> 条 · 新增实体 <span style="color:var(--cyan)">17</span> 个</div>
      <div>运行时长 <span style="color:var(--cyan)">15.2</span> 秒</div>
      <div style="margin-top:4px;color:var(--gray)">提示：运行 machine status 查看六域健康度汇总</div>
    </div>
  </div>`, 50);
}

// 页面加载后自动运行 status
window.onload = () => runStatus();
</script>
