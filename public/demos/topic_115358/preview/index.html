<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>饭合 · 预览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 手机壳框架 -->
  <div id="phone-frame" class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <span class="status-icons">
        <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><path d="M1 9V7M5 9V5M9 9V3M13 9V1" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0.5" y="0.5" width="14" height="9" rx="2" stroke="white" opacity="0.5"/><rect x="2" y="2" width="11" height="6" rx="1" fill="white"/><rect x="15" y="3.5" width="2" height="3" rx="0.5" fill="white" opacity="0.5"/></svg>
      </span>
    </div>

    <!-- 页面容器 -->
    <div id="page-container" class="page-container"></div>

    <!-- 底部 TabBar -->
    <div id="tab-bar" class="tab-bar"></div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>

  <!-- 页面切换动画覆盖层 -->
  <div id="transition-overlay" class="transition-overlay"></div>

  <script src="app.js"></script>
</body>
</html>
