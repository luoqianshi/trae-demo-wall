<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 冒险者工会</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #1a1510;
      color: #f0e6d2;
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========== FULL-PAGE BACKGROUND ========== */
    .login-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('../assets/login-bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* ========== DARK OVERLAY ========== */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 21, 16, 0.30);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      z-index: 2;
    }

    /* ========== CENTERING WRAPPER ========== */
    .login-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    /* ========== LOGIN CARD ========== */
    .login-card {
      position: relative;
      z-index: 10;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 40px;
      background: rgba(42, 35, 24, 0.55);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border: 1px solid rgba(200, 170, 120, 0.20);
      border-radius: 20px;
      animation: fadeInCard 0.7s ease both;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== BRAND AREA ========== */
    .brand-area {
      margin-bottom: 36px;
      text-align: center;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .brand-icon {
      font-size: 40px;
      line-height: 1;
    }
    .brand-name {
      font-family: Georgia, serif;
      font-size: 32px;
      color: #c8922a;
      letter-spacing: 0;
      font-weight: 700;
    }
    .brand-tagline {
      font-size: 15px;
      color: #b8a88e;
      margin-top: 8px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ========== FORM HEADING ========== */
    .form-heading {
      font-family: Georgia, serif;
      font-size: 22px;
      color: #f0e6d2;
      margin-bottom: 32px;
    }

    /* ========== PHONE INPUT ROW ========== */
    .phone-row {
      display: flex;
      align-items: stretch;
      margin-bottom: 16px;
    }
    .phone-row:focus-within {
      box-shadow: 0 0 0 3px rgba(200, 146, 42, 0.15);
      border-radius: 10px;
    }
    .country-code {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2318;
      color: #b8a88e;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 12px;
      border: 1px solid rgba(200, 170, 120, 0.25);
      border-right: none;
      border-radius: 10px 0 0 10px;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .phone-input {
      flex: 1;
      background: #1e1912;
      border: 1px solid rgba(200, 170, 120, 0.15);
      border-left: none;
      border-radius: 0 10px 10px 0;
      color: #f0e6d2;
      padding: 14px 16px;
      font-size: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-width: 0;
    }
    .phone-input::placeholder {
      color: #b8a88e;
    }
    .phone-row:focus-within .country-code {
      border-color: #c8922a;
    }
    .phone-row:focus-within .phone-input {
      border-color: #c8922a;
    }

    /* ========== VERIFICATION CODE ROW ========== */
    .code-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .code-input {
      flex: 1;
      background: #1e1912;
      border: 1px solid rgba(200, 170, 120, 0.15);
      border-radius: 10px;
      color: #f0e6d2;
      padding: 14px 16px;
      font-size: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-width: 0;
    }
    .code-input::placeholder {
      color: #b8a88e;
    }
    .code-input:focus {
      border-color: #c8922a;
      box-shadow: 0 0 0 3px rgba(200, 146, 42, 0.12);
    }
    .send-code-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2318;
      border: 1px solid #c8922a;
      border-radius: 10px;
      color: #f0e6d2;
      padding: 14px 20px;
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .send-code-btn:hover:not(:disabled) {
      background: rgba(200, 146, 42, 0.1);
      box-shadow: 0 0 0 3px rgba(200, 146, 42, 0.1);
    }
    .send-code-btn:disabled {
      border-color: rgba(200, 170, 120, 0.15);
      color: #b8a88e;
      cursor: not-allowed;
    }

    /* ========== LOGIN BUTTON ========== */
    .login-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #c8922a 0%, #e8b94a 100%);
      color: #1a1510;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(200, 146, 42, 0.4);
    }
    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(200, 146, 42, 0.3);
    }

    /* ========== DIVIDER ========== */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0 16px 0;
      color: #b8a88e;
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(200, 170, 120, 0.2);
    }

    /* ========== WECHAT LOGIN ========== */
    .wechat-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .wechat-login:hover {
      background: rgba(200, 146, 42, 0.08);
    }
    .wechat-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3a9e6e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wechat-icon-circle svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }
    .wechat-label {
      font-size: 14px;
      color: #b8a88e;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ========== SOCIAL LOGIN STACK ========== */
    .social-login-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ========== DOUYIN LOGIN ========== */
    .douyin-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .douyin-login:hover {
      background: rgba(200, 146, 42, 0.08);
    }
    .douyin-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .douyin-icon-note {
      font-size: 16px;
      color: #fff;
      line-height: 1;
    }
    .douyin-label {
      font-size: 14px;
      color: #b8a88e;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ========== TERMS ========== */
    .terms {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #b8a88e;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    .terms a {
      color: #c8922a;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .terms a:hover {
      color: #e8b94a;
      text-decoration: underline;
    }

    /* ========== EXISTING USER HINT ========== */
    .existing-hint {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #b8a88e;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      html, body { overflow-y: auto; }

      .login-wrapper {
        min-height: 100vh;
        height: auto;
        padding: 32px 16px;
      }

      .login-card {
        padding: 36px 24px;
        border-radius: 16px;
      }

      .brand-name {
        font-size: 26px;
      }
      .brand-icon {
        font-size: 32px;
      }
      .form-heading {
        font-size: 20px;
      }
      .phone-input,
      .code-input {
        font-size: 14px;
        padding: 12px 14px;
      }
      .country-code {
        padding: 12px 10px;
        font-size: 14px;
      }
      .send-code-btn {
        padding: 12px 16px;
        font-size: 13px;
      }
      .login-btn {
        padding: 14px;
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .login-card {
        padding: 28px 16px;
      }
      .brand-name {
        font-size: 24px;
      }
      .brand-tagline {
        font-size: 13px;
      }
      .form-heading {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Full-page background image -->
  <div class="login-bg" aria-hidden="true"></div>

  <!-- Dark semi-transparent overlay with blur -->
  <div class="login-overlay" aria-hidden="true"></div>

  <!-- Centering wrapper -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand-area">
        <div class="brand-mark">
          <span class="brand-icon" aria-hidden="true">&#x1F6E1;&#xFE0F;</span>
          <span class="brand-name">冒险者工会</span>
        </div>
        <div class="brand-tagline">每一次服务，都是一次冒险</div>
      </div>

      <!-- Form Heading -->
      <div class="form-heading">开始你的冒险</div>

      <!-- Phone Input Row -->
      <div class="phone-row">
        <div class="country-code" aria-label="Country code">+86</div>
        <input
          type="tel"
          class="phone-input"
          placeholder="请输入手机号"
          maxlength="11"
          autocomplete="tel"
        >
      </div>

      <!-- Verification Code Row -->
      <div class="code-row">
        <input
          type="text"
          class="code-input"
          placeholder="请输入验证码"
          maxlength="6"
          autocomplete="one-time-code"
        >
        <button class="send-code-btn" onclick="startCountdown(this)">获取验证码</button>
      </div>

      <!-- Login Button -->
      <button class="login-btn">开始冒险</button>

      <!-- Divider -->
      <div class="divider">或</div>

      <!-- WeChat Login -->
      <div class="social-login-stack">
        <div class="wechat-login" onclick="void(0)">
          <div class="wechat-icon-circle">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm3.828 4.407c-3.797 0-6.874 2.527-6.874 5.648 0 3.12 3.077 5.649 6.874 5.649a8.647 8.647 0 002.387-.335.727.727 0 01.601.082l1.584.926a.272.272 0 00.14.046c.134 0 .243-.111.243-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.497.497 0 01.178-.556C21.843 19.584 22.84 17.915 22.84 16.046c0-3.121-3.077-5.649-6.414-5.649zm-2.585 3.088c.536 0 .97.44.97.982a.976.976 0 01-.97.983.976.976 0 01-.97-.983c0-.542.434-.982.97-.982zm5.17 0c.536 0 .97.44.97.982a.976.976 0 01-.97.983.976.976 0 01-.97-.983c0-.542.434-.982.97-.982z"/>
            </svg>
          </div>
          <span class="wechat-label">微信一键登录</span>
        </div>

        <!-- Douyin Login -->
        <div class="douyin-login" onclick="void(0)">
          <div class="douyin-icon-circle">
            <span class="douyin-icon-note">&#9835;</span>
          </div>
          <span class="douyin-label">抖音一键登录</span>
        </div>
      </div>

      <!-- Terms -->
      <div class="terms">
        开始冒险即表示你同意<a href="javascript:void(0)">《用户协议》</a>和<a href="javascript:void(0)">《隐私政策》</a>
      </div>

      <!-- Existing User Hint -->
      <div class="existing-hint">已有账号？输入手机号即可登录</div>

    </div>
  </div>

  <script>
    function startCountdown(btn) {
      const seconds = 59;
      btn.disabled = true;
      let remaining = seconds;

      function tick() {
        if (remaining <= 0) {
          btn.disabled = false;
          btn.textContent = '获取验证码';
          return;
        }
        btn.textContent = '重新获取 (' + remaining + 's)';
        remaining--;
        setTimeout(tick, 1000);
      }
      tick();
    }
  </script>
</body>
</html>
