<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的委托 — 冒险者工会</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; overflow-y: auto; }
    body {
      background: #1a1510;
      color: #f0e6d2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1510; }
    ::-webkit-scrollbar-thumb { background: #4a3d2e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #5a4d3e; }

    /* ========== FIXED TOP NAV ========== */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(26, 21, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 0 40px;
      z-index: 100;
      border-bottom: 1px solid rgba(200, 170, 120, 0.08);
    }
    .nav-brand {
      font-family: Georgia, 'Times New Roman', serif;
      color: #c8922a;
      font-size: 18px;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-brand .brand-icon { margin-right: 6px; }

    /* Identity toggle */
    .identity-toggle {
      display: flex;
      gap: 0;
      margin-left: 20px;
      flex-shrink: 0;
    }
    .identity-toggle .pill {
      padding: 4px 14px;
      font-size: 12px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .identity-toggle .pill.active {
      background: rgba(200, 146, 42, 0.2);
      color: #c8922a;
    }
    .identity-toggle .pill.inactive {
      background: transparent;
      color: #b8a88e;
    }
    .identity-toggle .pill.inactive:hover {
      background: rgba(200, 146, 42, 0.08);
      color: #f0e6d2;
    }
    .identity-toggle .pill:last-child {
      border-left: 1px solid rgba(200, 170, 120, 0.15);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .nav-right .location {
      font-size: 13px;
      color: #b8a88e;
      margin-right: 16px;
      white-space: nowrap;
    }
    .nav-icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #b8a88e;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .nav-icon-btn:hover {
      background: rgba(200, 146, 42, 0.1);
      color: #c8922a;
    }
    .nav-user {
      font-size: 13px;
      color: #f0e6d2;
      white-space: nowrap;
    }

    /* ========== CONTENT WRAPPER ========== */
    .content-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 88px 40px 60px;
    }

    /* ========== PAGE HEADER ========== */
    .page-header {
      margin-bottom: 32px;
    }
    .page-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      color: #c8922a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* ========== TAB PILLS ========== */
    .tab-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .tab-pill {
      padding: 8px 20px;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(200, 170, 120, 0.15);
      background: transparent;
      color: #b8a88e;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .tab-pill:hover {
      border-color: rgba(200, 170, 120, 0.3);
      color: #f0e6d2;
    }
    .tab-pill.active {
      background: rgba(200, 146, 42, 0.2);
      border-color: #c8922a;
      color: #e8b94a;
      font-weight: 500;
    }
    .tab-pill .count-badge {
      display: inline-block;
      margin-left: 4px;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(200, 170, 120, 0.12);
      color: #b8a88e;
    }
    .tab-pill.active .count-badge {
      background: rgba(200, 146, 42, 0.3);
      color: #e8b94a;
    }

    /* ========== SECTION LABEL ========== */
    .commission-section-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      color: #f0e6d2;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .commission-section-label .label-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-ongoing { background: #d4a030; }
    .dot-done { background: #3a9e6e; }
    .dot-review { background: #c8922a; }
    .dot-dispute { background: #c45040; }

    /* ========== COMMISSION CARDS ========== */
    .commission-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }
    .commission-card {
      background: #2a2318;
      border: 1px solid rgba(200, 170, 120, 0.12);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
    }
    .commission-card:hover {
      border-color: rgba(200, 146, 42, 0.35);
      box-shadow: 0 4px 16px rgba(200, 146, 42, 0.08);
    }

    .comm-icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      background: rgba(200, 146, 42, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .comm-body {
      flex: 1;
      min-width: 0;
    }
    .comm-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      color: #f0e6d2;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .comm-meta {
      font-size: 13px;
      color: #b8a88e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .comm-meta span {
      white-space: nowrap;
    }
    .comm-meta-sep {
      color: rgba(200, 170, 120, 0.25);
    }

    .comm-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .comm-amount {
      font-size: 16px;
      font-weight: 600;
      color: #c8922a;
      white-space: nowrap;
    }
    .comm-status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      font-weight: 500;
    }
    .status-ongoing {
      background: rgba(212, 160, 48, 0.15);
      color: #d4a030;
    }
    .status-done {
      background: rgba(58, 158, 110, 0.15);
      color: #3a9e6e;
    }
    .status-review {
      background: rgba(200, 146, 42, 0.15);
      color: #e8b94a;
    }

    .btn-gold {
      padding: 7px 18px;
      background: linear-gradient(135deg, #c8922a, #a87820);
      color: #1a1510;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #d9a230, #b88828);
      box-shadow: 0 2px 8px rgba(200, 146, 42, 0.3);
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #8a7b65;
      font-size: 15px;
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .top-nav { padding: 0 16px; }
      .nav-brand .brand-text { display: none; }
      .content-wrapper { padding: 72px 16px 40px; }
      .nav-right .location { display: none; }
      .page-title { font-size: 24px; }

      .commission-card {
        flex-wrap: wrap;
      }
      .comm-right {
        width: 100%;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid rgba(200, 170, 120, 0.08);
      }
      .comm-meta {
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
      .comm-meta-sep { display: none; }
    }
    /* ========== BACK TO TOP ========== */
    .back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 90;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #2a2318;
      border: 1px solid rgba(200,146,42,0.5);
      color: #c8922a;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, box-shadow 0.2s ease;
    }
    .back-to-top span {
      font-size: 11px;
      color: #b8a88e;
    }
    .back-to-top:hover {
      border-color: #c8922a;
      box-shadow: 0 0 12px rgba(200,146,42,0.25);
    }
  </style>
</head>
<body>

  <!-- ===== TOP NAV ===== -->
  <nav class="top-nav">
    <a class="nav-brand" href="../index.html">
      <span class="brand-icon">&#x1F6E1;&#xFE0F;</span>
      <span class="brand-text">冒险者工会</span>
    </a>
    <div class="identity-toggle" data-dom-id="identity-toggle">
      <a href="quest-hall-v4.html" class="pill">冒险者</a>

      <span class="nav-user">&#x1F464;</span>
    </div>
  </nav>

  <!-- ===== CONTENT ===== -->
  <div class="content-wrapper">

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">我的委托</h1>
    </div>

    <!-- Tab Filter Pills -->
    <div class="tab-pills">

      <button class="tab-pill active" data-filter="ongoing">进行中 <span class="count-badge">1</span></button>
      <button class="tab-pill" data-filter="done">已完成 <span class="count-badge">5</span></button>
      <button class="tab-pill" data-filter="review">待评价 <span class="count-badge">1</span></button>

    <!-- Section: 进行中 -->
    <div class="commission-section" data-section="ongoing">
      <div class="commission-section-label">
        <span class="label-dot dot-ongoing"></span>进行中

          </div>
          <div class="comm-right">

            <span class="comm-status status-ongoing">&#x1F7E1; 进行中</span>

    </div>

    <!-- Section: 已完成 -->
    <div class="commission-section" data-section="done">
      <div class="commission-section-label">
        <span class="label-dot dot-done"></span>已完成
      </div>
      <div class="commission-list">
        <div class="commission-card">
          <div class="comm-icon">&#x1F373;</div>
          <div class="comm-body">
            <div class="comm-title">上门做饭</div>
            <div class="comm-meta">
              <span>阿芒</span>

          </div>

          <div class="comm-body">

          <div class="comm-right">
            <span class="comm-amount">&yen;299</span>
            <span class="comm-status status-done">&#x2705; 已完成</span>
          </div>
        </div>

        <div class="commission-card">
          <div class="comm-icon">&#x1F5C4;&#xFE0F;</div>
          <div class="comm-body">
            <div class="comm-title">衣柜收纳</div>
            <div class="comm-meta">
              <span>小鹿</span>
              <span class="comm-meta-sep">&middot;</span>
              <span>12月8日</span>
            </div>
          </div>
          <div class="comm-right">
            <span class="comm-amount">&yen;260</span>
            <span class="comm-status status-done">&#x2705; 已完成</span>
          </div>
        </div>

        <div class="commission-card">
          <div class="comm-icon">&#x1F3B8;</div>
          <div class="comm-body">
            <div class="comm-title">吉他教学</div>
            <div class="comm-meta">
              <span>音乐老师</span>
              <span class="comm-meta-sep">&middot;</span>
              <span>11月20日</span>
            </div>
          </div>
          <div class="comm-right">
            <span class="comm-amount">&yen;150</span>
            <span class="comm-status status-done">&#x2705; 已完成</span>
          </div>
        </div>

        <div class="commission-card">
          <div class="comm-icon">&#x1F3B5;</div>
          <div class="comm-body">
            <div class="comm-title">钢琴陪练</div>
            <div class="comm-meta">
              <span>周老师</span>
              <span class="comm-meta-sep">&middot;</span>
              <span>11月5日</span>
            </div>
          </div>
          <div class="comm-right">
            <span class="comm-amount">&yen;200</span>
            <span class="comm-status status-done">&#x2705; 已完成</span>

    <!-- Section: 待评价 -->
    <div class="commission-section" data-section="review">
      <div class="commission-section-label">
        <span class="label-dot dot-review"></span>待评价
      </div>
      <div class="commission-list">

    <!-- Section: 退款/纠纷 -->

      </div>

  </div><!-- /content-wrapper -->

  <!-- ===== SCRIPTS ===== -->
  <script>
    // Identity toggle
    document.querySelectorAll('.identity-toggle .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.identity-toggle .pill').forEach(p => {
          p.classList.remove('active');
          p.classList.add('inactive');
        });
        pill.classList.remove('inactive');
        pill.classList.add('active');
      });
    });

    // Tab pill filtering
    const tabPills = document.querySelectorAll('.tab-pill');
    const sections = document.querySelectorAll('.commission-section');

    tabPills.forEach(pill => {
      pill.addEventListener('click', () => {
        tabPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');

        const filter = pill.dataset.filter;
        if (filter === 'all') {
          sections.forEach(s => s.style.display = '');
        } else {
          sections.forEach(s => {
            s.style.display = s.dataset.section === filter ? '' : 'none';
          });
        }
      });
    });
  </script>

<button id="backToTop" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="返回顶部">↑<span>顶部</span></button>
<script>
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (btn) {
    btn.style.opacity = window.scrollY > 400 ? '1' : '0';
    btn.style.pointerEvents = window.scrollY > 400 ? 'auto' : 'none';
  }
});
</script>

</body>
