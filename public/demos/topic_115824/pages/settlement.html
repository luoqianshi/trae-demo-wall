<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结算 — 冒险者工会</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a1510;color:#f0e6d2;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:14px;line-height:1.5}

  /* ── Minimal nav behind overlay ── */
  .top-nav{position:fixed;top:0;left:0;right:0;height:48px;background:#2a2318;border-bottom:1px solid rgba(200,170,120,0.15);display:flex;align-items:center;padding:0 20px;z-index:50;filter:blur(1px)}
  .top-nav .nav-logo{font-family:Georgia,"Noto Serif SC",serif;font-size:16px;color:#c8922a;font-weight:700;letter-spacing:0.04em}
  .top-nav .nav-spacer{flex:1}
  .top-nav .nav-link{color:#b8a88e;font-size:13px;text-decoration:none;margin-left:20px}
  .top-nav .nav-identity{display:flex;align-items:center;gap:8px;color:#b8a88e;font-size:13px;cursor:pointer}
  .top-nav .nav-identity .avatar{width:28px;height:28px;border-radius:50%;background:#332b1f;border:1px solid rgba(200,170,120,0.2)}
  .top-nav .nav-identity .avatar::after{content:"A";display:flex;align-items:center;justify-content:center;font-size:12px;color:#8a7b65}

  /* ── Dark overlay ── */
  .overlay{position:fixed;inset:0;background:rgba(10,8,5,0.85);z-index:200;display:flex;align-items:center;justify-content:center;animation:overlayIn .3s ease}

  /* ── Settlement card ── */
  .settlement-card{
    width:100%;max-width:480px;
    background:#2a2318;
    border:1px solid #c8922a;
    border-radius:16px;
    padding:32px 28px 28px;
    position:relative;
    overflow:hidden;
    animation:cardIn .45s cubic-bezier(.22,.68,0,1.01);
    box-shadow:0 0 40px rgba(200,146,42,0.15),0 12px 48px rgba(0,0,0,0.6);
  }
  .settlement-card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#c8922a,#e8b94a,#c8922a,transparent);
  }

  /* ── Gold ornamental top ── */
  .ornament-top{text-align:center;margin-bottom:20px}
  .ornament-line{display:inline-block;width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,146,42,0.6),transparent);vertical-align:middle}
  .ornament-sparkle{font-size:16px;margin:0 10px;vertical-align:middle}

  /* ── Title ── */
  .settlement-title{
    font-family:Georgia,"Noto Serif SC",serif;
    font-size:28px;
    color:#c8922a;
    text-align:center;
    margin-bottom:4px;
    text-shadow:0 0 20px rgba(200,146,42,0.3);
  }
  .settlement-subtitle{
    font-size:14px;
    color:#8a7b65;
    text-align:center;
    margin-bottom:24px;
  }

  /* ── Reward breakdown ── */
  .reward-list{
    display:flex;flex-direction:column;gap:0;
    margin-bottom:20px;
  }
  .reward-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 0 8px 14px;
    border-left:2px solid rgba(200,146,42,0.15);
    font-size:14px;
    animation:rewardSlide .4s ease both;
  }
  .reward-item:nth-child(1){animation-delay:.1s}
  .reward-item:nth-child(2){animation-delay:.18s}
  .reward-item:nth-child(3){animation-delay:.26s}
  .reward-item:nth-child(4){animation-delay:.34s}
  .reward-label{color:#b8a88e;font-size:14px}
  .reward-label .emoji{margin-right:6px}
  .reward-amount{font-weight:600;font-variant-numeric:tabular-nums}
  .reward-amount.green{color:#3a9e6e}
  .reward-amount.gold{color:#c8922a}

  /* Divider */
  .reward-divider{
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(200,146,42,0.35),transparent);
    margin:10px 0;
  }

  /* Critical multiplier */
  .reward-crit{
    text-align:center;
    font-size:14px;
    color:#c8922a;
    font-weight:700;
    padding:6px 0;
    letter-spacing:0.04em;
  }

  /* Final total */
  .reward-total{
    text-align:center;
    font-size:24px;
    color:#c8922a;
    font-weight:700;
    font-family:Georgia,"Noto Serif SC",serif;
    padding:8px 0 4px;
    text-shadow:0 0 16px rgba(200,146,42,0.25);
  }
  .reward-coins{
    text-align:center;
    font-size:14px;
    color:#c8922a;
    margin-bottom:24px;
    opacity:0.85;
  }

  /* ── Loot section ── */
  .loot-section{margin-bottom:24px}
  .loot-title{
    font-family:Georgia,"Noto Serif SC",serif;
    font-size:14px;
    color:#b8a88e;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:12px;
    text-align:center;
  }
  .loot-row{display:flex;gap:10px;justify-content:center}
  .loot-item{
    flex:1;max-width:140px;
    background:#1a1510;
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .loot-item.rarity-gold{border:1px solid #c8922a}
  .loot-item.rarity-silver{border:1px solid #a0a0a0}
  .loot-item.rarity-bronze{border:1px solid #b07040}
  .loot-emoji{font-size:22px;display:block;margin-bottom:6px}
  .loot-name{font-size:12px;color:#f0e6d2;line-height:1.3;margin-bottom:2px}
  .loot-qty{font-size:11px;color:#b8a88e;font-weight:600}

  /* ── Level progress ── */
  .level-section{margin-bottom:20px}
  .level-label{
    font-size:14px;color:#f0e6d2;font-weight:600;
    margin-bottom:8px;
  }
  .level-label span{color:#c8922a}
  .progress-bar-track{
    width:100%;height:12px;
    background:#1a1510;
    border-radius:9999px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(200,146,42,0.12);
  }
  .progress-bar-fill{
    height:100%;border-radius:9999px;
    background:linear-gradient(90deg,#a07020,#c8922a,#e8b94a);
    width:0%;
    transition:width 1.2s cubic-bezier(.22,.68,0,1.01);
    position:relative;
  }
  .progress-bar-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 60%,rgba(255,255,255,0.15));
    border-radius:9999px;
  }
  .progress-labels{
    display:flex;justify-content:space-between;
    font-size:12px;color:#b8a88e;
    margin-top:6px;
  }
  .level-next{
    font-size:12px;color:#8a7b65;
    text-align:center;
    margin-top:4px;
  }

  /* ── Badge progress ── */
  .badge-section{margin-bottom:28px}
  .badge-item{
    display:flex;align-items:center;gap:10px;
    padding:6px 0;
  }
  .badge-item + .badge-item{margin-top:4px}
  .badge-icon{font-size:16px;flex-shrink:0}
  .badge-info{flex:1;min-width:0}
  .badge-name{font-size:13px;color:#f0e6d2;margin-bottom:3px}
  .badge-name .tier-gold{color:#c8922a;font-weight:600}
  .badge-name .tier-silver{color:#a0a0a0;font-weight:600}
  .badge-name .tier-bronze{color:#b07040;font-weight:600}
  .badge-bar-track{
    width:100%;height:6px;
    background:#1a1510;
    border-radius:9999px;
    overflow:hidden;
  }
  .badge-bar-fill{
    height:100%;border-radius:9999px;
    transition:width 1s ease;
  }
  .badge-bar-fill.gold{background:linear-gradient(90deg,#a07020,#c8922a)}
  .badge-bar-fill.bronze{background:linear-gradient(90deg,#8a5a30,#b07040)}
  .badge-count{font-size:11px;color:#8a7b65;flex-shrink:0;min-width:46px;text-align:right}

  /* ── Action buttons ── */
  .action-buttons{
    display:flex;flex-direction:column;gap:10px;
  }
  .btn{
    display:block;width:100%;
    padding:12px 20px;
    border-radius:10px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    transition:all .2s ease;
    font-family:inherit;
  }
  .btn-primary{
    background:linear-gradient(135deg,#a07020,#c8922a);
    color:#1a1510;
    border:1px solid #c8922a;
    box-shadow:0 2px 12px rgba(200,146,42,0.3);
  }
  .btn-primary:hover{
    background:linear-gradient(135deg,#c8922a,#e8b94a);
    box-shadow:0 4px 20px rgba(200,146,42,0.4);
  }
  .btn-ghost{
    background:transparent;
    color:#c8922a;
    border:1px solid rgba(200,146,42,0.4);
  }
  .btn-ghost:hover{
    background:rgba(200,146,42,0.08);
    border-color:#c8922a;
  }
  .btn-text{
    background:transparent;
    color:#8a7b65;
    border:1px solid transparent;
    padding:8px 20px;
  }
  .btn-text:hover{color:#b8a88e}

  /* ── Animations ── */
  @keyframes overlayIn{
    from{opacity:0}to{opacity:1}
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes rewardSlide{
    from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}
  }
  @keyframes shimmer{
    0%{background-position:-200% 0}
    100%{background-position:200% 0}
  }

  /* Responsive */
  @media(max-width:520px){
    .settlement-card{margin:16px;padding:24px 20px 20px}
    .settlement-title{font-size:24px}
    .reward-total{font-size:20px}
    .loot-row{flex-direction:column;align-items:center}
    .loot-item{max-width:100%}
  }
  /* ========== BACK TO TOP ========== */
  .back-to-top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 90;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #2a2318;
    border: 1px solid rgba(200,146,42,0.5);
    color: #c8922a;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, box-shadow 0.2s ease;
  }
  .back-to-top span {
    font-size: 11px;
    color: #b8a88e;
  }
  .back-to-top:hover {
    border-color: #c8922a;
    box-shadow: 0 0 12px rgba(200,146,42,0.25);
  }
</style>
</head>
<body>

  <!-- Minimal nav behind overlay -->
  <nav class="top-nav">
    <div class="nav-logo">冒险者工会</div>
    <div class="nav-spacer"></div>
    <a class="nav-link" href="smart-match-v4.html">任务大厅</a>
    <a class="nav-link" href="smart-match-v4.html">发现</a>
    <div class="nav-identity" data-dom-id="identity-toggle">
      <div class="avatar"></div>
      <span>冒险者</span>
    </div>
  </nav>

  <!-- Dark overlay -->
  <div class="overlay">

    <!-- Settlement card -->
    <div class="settlement-card">

      <!-- Ornamental top -->
      <div class="ornament-top">
        <span class="ornament-line"></span>
        <span class="ornament-sparkle">&#10024;</span>
        <span class="ornament-line"></span>
      </div>

      <!-- Title -->
      <div class="settlement-title">冒险完成！</div>
      <div class="settlement-subtitle">你的成长被看见了。</div>

      <!-- Reward breakdown -->
      <div class="reward-list">
        <div class="reward-item">
          <span class="reward-label">基础奖励</span>
          <span class="reward-amount green">+120 经验值</span>
        </div>
        <div class="reward-item">
          <span class="reward-label">五星好评</span>
          <span class="reward-amount green">+30 经验值</span>
        </div>
        <div class="reward-item">
          <span class="reward-label">首次服务该客户</span>
          <span class="reward-amount green">+50 经验值</span>
        </div>
        <div class="reward-item">
          <span class="reward-label"><span class="emoji">&#127982;</span>赛季加成</span>
          <span class="reward-amount gold">+40 经验值</span>
        </div>
        <div class="reward-divider"></div>
        <div class="reward-crit">暴击倍率 x1.2</div>
        <div class="reward-divider"></div>
      </div>

      <div class="reward-total">最终获得 +288 经验值</div>
      <div class="reward-coins">获得冒险币 +120 冒险币</div>

      <!-- Loot -->
      <div class="loot-section">
        <div class="loot-title">&#127942; 战利品</div>
        <div class="loot-row">
          <div class="loot-item rarity-gold">
            <span class="loot-emoji">&#128226;</span>
            <div class="loot-name">曝光喇叭</div>
            <div class="loot-qty">x1</div>
          </div>
          <div class="loot-item rarity-silver">
            <span class="loot-emoji">&#11088;</span>
            <div class="loot-name">好评符碎片</div>
            <div class="loot-qty">x2</div>
          </div>
          <div class="loot-item rarity-bronze">
            <span class="loot-emoji">&#128444;&#65039;</span>
            <div class="loot-name">光影头像框碎片</div>
            <div class="loot-qty">x1</div>
          </div>
        </div>
      </div>

      <!-- Level progress -->
      <div class="level-section">
        <div class="level-label"><span>Lv.4</span> 资深冒险者</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="xp-bar" style="width:72%"></div>
        </div>
        <div class="progress-labels">
          <span>72%</span>
          <span style="color:#c8922a">&#8594; 81%</span>
        </div>
        <div class="level-next">距离 Lv.5 精英冒险者还差 952 经验值</div>
      </div>

      <!-- Badge progress -->
      <div class="badge-section">
        <div class="badge-item">
          <span class="badge-icon">&#127917;</span>
          <div class="badge-info">
            <div class="badge-name">光影魔术师 <span class="tier-silver">银</span></div>
            <div class="badge-bar-track">
              <div class="badge-bar-fill gold" style="width:84%"></div>
            </div>
          </div>
          <span class="badge-count">42/50</span>
        </div>
        <div class="badge-item">
          <span class="badge-icon">&#127942;</span>
          <div class="badge-info">
            <div class="badge-name">零差评传说 <span class="tier-bronze">铜</span></div>
            <div class="badge-bar-track">
              <div class="badge-bar-fill bronze" style="width:56%"></div>
            </div>
          </div>
          <span class="badge-count">28/50</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <button class="btn btn-ghost">生成冒险分享卡</button>
        <button class="btn btn-primary">查看我的角色</button>
        <button class="btn btn-text">关闭</button>
      </div>

    </div>
  </div>

  <script>
    // Animate XP bar from 72% to 81% on load
    document.addEventListener('DOMContentLoaded', function() {
      var bar = document.getElementById('xp-bar');
      setTimeout(function() {
        bar.style.width = '81%';
      }, 600);
    });
  </script>

<button id="backToTop" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="返回顶部">↑<span>顶部</span></button>
<script>
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (btn) {
    btn.style.opacity = window.scrollY > 400 ? '1' : '0';
    btn.style.pointerEvents = window.scrollY > 400 ? 'auto' : 'none';
  }
});
</script>

</body>
</html>
