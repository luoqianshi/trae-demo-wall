<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认完成并评价 — 冒险者工会</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; overflow-y: auto; }
    body {
      background: #1a1510;
      color: #f0e6d2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== FIXED TOP NAV ========== */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(26, 21, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 0 40px;
      z-index: 100;
      border-bottom: 1px solid rgba(200, 170, 120, 0.08);
    }
    .nav-brand {
      font-family: Georgia, 'Times New Roman', serif;
      color: #c8922a;
      font-size: 18px;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-brand .brand-icon { margin-right: 6px; }
    .identity-toggle {
      display: flex;
      gap: 0;
      margin-left: 20px;
      flex-shrink: 0;
    }
    .identity-toggle .pill {
      padding: 4px 14px;
      font-size: 12px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .identity-toggle .pill.active {
      background: rgba(200, 146, 42, 0.2);
      color: #c8922a;
    }
    .identity-toggle .pill.inactive {
      background: transparent;
      color: #b8a88e;
    }
    .identity-toggle .pill.inactive:hover {
      background: rgba(200, 146, 42, 0.08);
      color: #f0e6d2;
    }
    .identity-toggle .pill:last-child {
      border-left: 1px solid rgba(200, 170, 120, 0.15);
    }
    .nav-center {
      flex: 1;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .nav-right .location {
      font-size: 13px;
      color: #b8a88e;
      margin-right: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-right .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; background: transparent;
      border-radius: 8px;
      transition: background 0.2s ease;
      font-size: 18px;
      position: relative;
      color: #f0e6d2;
    }
    .nav-right .icon-btn:hover { background: rgba(200, 146, 42, 0.1); }
    .nav-right .bell-badge {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px;
      background: #e74c3c;
      border-radius: 50%;
      border: 1.5px solid rgba(26, 21, 16, 0.9);
    }
    .nav-right .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid #c8922a;
      background: #2a2318;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .nav-user-name {
      font-size: 13px;
      color: #f0e6d2;
      white-space: nowrap;
    }

    /* ========== DIMMED PAGE CONTENT (simulated behind modal) ========== */
    .content-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 88px 0 60px;
      opacity: 0.4;
      pointer-events: none;
    }
    .content-inner {
      padding: 0 40px;
    }
    .dummy-hero {
      background: linear-gradient(135deg, #3d3425, #2a2318);
      border-radius: 12px;
      padding: 28px 32px;
      height: 120px;
    }

    /* ========== MODAL OVERLAY ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }

    /* ========== MODAL CARD ========== */
    .modal-card {
      background: #2a2318;
      border: 1px solid rgba(200, 146, 42, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      position: relative;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(200, 146, 42, 0.08);
    }
    .modal-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c8922a, transparent);
      border-radius: 16px 16px 0 0;
    }

    /* Close button */
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid rgba(200, 170, 120, 0.15);
      border-radius: 8px;
      color: #b8a88e;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-close:hover {
      background: rgba(200, 146, 42, 0.1);
      color: #f0e6d2;
      border-color: rgba(200, 170, 120, 0.3);
    }

    /* Title */
    .modal-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      color: #c8922a;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .modal-subtitle {
      font-size: 14px;
      color: #b8a88e;
      margin-bottom: 28px;
    }

    /* ========== STAR RATING ========== */
    .star-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .stars {
      display: flex;
      gap: 6px;
    }
    .star {
      font-size: 32px;
      cursor: pointer;
      color: #c8922a;
      transition: transform 0.15s ease;
      user-select: none;
    }
    .star:hover {
      transform: scale(1.15);
    }
    .star.empty {
      color: #4a3d2e;
    }
    .score-display {
      font-size: 22px;
      font-weight: 700;
      color: #c8922a;
      margin-left: 8px;
    }

    /* ========== REVIEW TAGS ========== */
    .review-tags {
      margin-bottom: 24px;
    }
    .tags-label {
      font-size: 13px;
      color: #b8a88e;
      margin-bottom: 10px;
    }
    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid rgba(200, 170, 120, 0.15);
      transition: all 0.2s ease;
      user-select: none;
    }
    .tag-pill.selected {
      background: rgba(200, 146, 42, 0.2);
      border-color: rgba(200, 146, 42, 0.5);
      color: #c8922a;
    }
    .tag-pill.unselected {
      background: #2a2318;
      color: #b8a88e;
    }
    .tag-pill.unselected:hover {
      background: rgba(200, 146, 42, 0.08);
      border-color: rgba(200, 170, 120, 0.3);
    }
    .tags-counter {
      font-size: 12px;
      color: #8a7b65;
      margin-top: 8px;
    }

    /* ========== TEXT REVIEW ========== */
    .review-textarea {
      margin-bottom: 24px;
    }
    .review-textarea textarea {
      width: 100%;
      min-height: 100px;
      background: rgba(26, 21, 16, 0.5);
      border: 1px solid rgba(200, 170, 120, 0.15);
      border-radius: 10px;
      padding: 14px 16px;
      color: #f0e6d2;
      font-size: 14px;
      line-height: 1.6;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s ease;
    }
    .review-textarea textarea::placeholder {
      color: #8a7b65;
    }
    .review-textarea textarea:focus {
      outline: none;
      border-color: rgba(200, 146, 42, 0.4);
    }

    /* ========== FAVORITE TOGGLE ========== */
    .favorite-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      margin-bottom: 24px;
      border-top: 1px solid rgba(200, 170, 120, 0.1);
      border-bottom: 1px solid rgba(200, 170, 120, 0.1);
    }
    .favorite-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #f0e6d2;
    }
    .favorite-label .heart-icon {
      font-size: 18px;
    }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #4a3d2e;
      border-radius: 13px;
      transition: background 0.2s ease;
    }
    .toggle-switch input:checked + .toggle-track {
      background: #c8922a;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #f0e6d2;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(22px);
    }
    .favorite-hint {
      font-size: 12px;
      color: #8a7b65;
      margin-top: 8px;
    }

    /* ========== SUBMIT BUTTON ========== */
    .btn-submit {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(135deg, #c8922a, #a87820);
      color: #1a1510;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #d9a230, #b88828);
      box-shadow: 0 4px 20px rgba(200, 146, 42, 0.35);
      transform: translateY(-1px);
    }
    .btn-submit:active { transform: translateY(0); }

    /* ========== SUCCESS STATE ========== */
    .success-message {
      margin-top: 16px;
      padding: 16px;
      background: rgba(58, 158, 110, 0.1);
      border: 1px solid rgba(58, 158, 110, 0.25);
      border-radius: 10px;
      text-align: center;
    }
    .success-message p {
      font-size: 14px;
      color: #3a9e6e;
      line-height: 1.6;
    }
    .success-message .success-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 6px;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .content-wrapper { padding-left: 20px; padding-right: 20px; }
      .content-inner { padding: 0; }
      .top-nav { padding: 0 20px; }
    }
    @media (max-width: 768px) {
      .nav-center { display: none; }
      .nav-right .location { margin-right: 8px; }
      .modal-card { padding: 24px; }
      .modal-title { font-size: 18px; }
      .star { font-size: 26px; }
      .modal-overlay { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- ========== FIXED TOP NAV ========== -->
  <nav class="top-nav">
    <a href="../index.html" class="nav-brand">
      <span class="brand-icon">&#x1F6E1;&#xFE0F;</span>冒险者工会
    </a>

    <div class="identity-toggle" data-dom-id="identity-toggle">
      <a href="quest-hall-v4.html" class="pill">冒险者</a>
      <a href="smart-match-v4.html" class="pill">委托人</a>
    </div>

    <div class="nav-center"></div>

    <div class="nav-right">
      <span class="location">&#x1F4CD;杭州</span>
      <button class="icon-btn" title="搜索">&#x1F50D;</button>
      <a href="notifications.html" class="icon-btn" title="通知">
        &#x1F514;
        <span class="bell-badge"></span>
      </a>
      <a href="my-character.html" class="user-avatar" title="我的">&#x1F9D1;</a>
      <span class="nav-user-name">陈女士</span>
    </div>
  </nav>

  <!-- ========== DIMMED BACKGROUND CONTENT ========== -->
  <div class="content-wrapper">
    <div class="content-inner">
      <div class="dummy-hero"></div>
    </div>
  </div>

  <!-- ========== REVIEW MODAL ========== -->
  <div class="modal-overlay">
    <div class="modal-card">

      <button class="modal-close" title="关闭">&#x2715;</button>

      <!-- Title -->
      <h2 class="modal-title">确认完成并评价</h2>
      <p class="modal-subtitle">春节宠物上门喂养 · 林小野</p>

      <!-- Star Rating -->
      <div class="star-rating">
        <div class="stars">
          <span class="star">&#x2B50;</span>
          <span class="star">&#x2B50;</span>
          <span class="star">&#x2B50;</span>
          <span class="star">&#x2B50;</span>
          <span class="star">&#x2B50;</span>
        </div>
        <span class="score-display">5.0</span>
      </div>

      <!-- Review Tags -->
      <div class="review-tags">
        <div class="tags-label">选择标签</div>
        <div class="tags-list">
          <span class="tag-pill selected">准时 &#x2705;</span>
          <span class="tag-pill selected">专业 &#x2705;</span>
          <span class="tag-pill selected">很安心 &#x2705;</span>
          <span class="tag-pill unselected">沟通顺畅</span>
          <span class="tag-pill unselected">值得复购</span>
        </div>
        <div class="tags-counter">已选 3 个</div>
      </div>

      <!-- Text Review -->
      <div class="review-textarea">
        <textarea placeholder="分享你的服务体验...">准时到达，视频回传很安心。小橘看起来状态很好，猫砂也清理得很干净。</textarea>
      </div>

      <!-- Favorite Toggle -->
      <div class="favorite-toggle">
        <div>
          <div class="favorite-label">
            <span class="heart-icon">&#x2764;&#xFE0F;</span> 收藏为「御用宠托师」
          </div>
          <div class="favorite-hint">下次可一键再次委托</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" checked>
          <span class="toggle-track"></span>
        </label>
      </div>

      <!-- Submit Button -->
      <button class="btn-submit">提交评价</button>

      <!-- Success Confirmation -->
      <div class="success-message">
        <span class="success-icon">&#x2705;</span>
        <p>评价已提交 · 已收藏为御用宠托师 · 下次可一键再次委托</p>
      </div>

    </div>
  </div>

</body>
</html>
