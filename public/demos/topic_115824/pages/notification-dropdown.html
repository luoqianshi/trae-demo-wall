<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知下拉面板 — 冒险者工会</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; overflow-y: auto; }
    body {
      background: #1a1510;
      color: #f0e6d2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== MOCK NAV (minimal, to show context) ========== */
    .mock-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(26, 21, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 40px;
      z-index: 100;
      border-bottom: 1px solid rgba(200, 170, 120, 0.08);
    }
    .mock-nav .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: rgba(200, 146, 42, 0.15);
      border-radius: 8px;
      font-size: 18px;
      position: relative;
      color: #f0e6d2;
    }
    .mock-nav .bell-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: #e74c3c;
      border-radius: 50%;
      border: 1.5px solid rgba(26, 21, 16, 0.9);
    }

    /* ========== BACKDROP OVERLAY ========== */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      animation: fadeIn 0.2s ease-out;
    }

    /* ========== DROPDOWN PANEL ========== */
    .dropdown-panel {
      position: fixed;
      top: 72px;
      right: 40px;
      width: 380px;
      max-height: 480px;
      background: #2a2318;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(200, 170, 120, 0.2);
      z-index: 201;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideDown 0.25s ease-out;
      border: 1px solid rgba(200, 170, 120, 0.12);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .dropdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(200, 170, 120, 0.1);
      flex-shrink: 0;
    }
    .dropdown-header h3 {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 16px;
      color: #f0e6d2;
      font-weight: 600;
    }
    .view-all-link {
      font-size: 12px;
      color: #8a7b65;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
      white-space: nowrap;
    }
    .view-all-link:hover {
      color: #c8922a;
    }

    /* Notification list (scrollable) */
    .dropdown-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .dropdown-list::-webkit-scrollbar { width: 4px; }
    .dropdown-list::-webkit-scrollbar-track { background: transparent; }
    .dropdown-list::-webkit-scrollbar-thumb { background: rgba(200, 170, 120, 0.15); border-radius: 2px; }

    /* Individual dropdown item */
    .dropdown-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }
    .dropdown-item:hover {
      background: rgba(200, 146, 42, 0.08);
    }

    /* Unread indicator dot */
    .dropdown-item .unread-dot {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      background: #c8922a;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dropdown-item .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: rgba(200, 146, 42, 0.1);
    }
    .dropdown-item .item-icon.system { background: rgba(74, 128, 184, 0.15); }
    .dropdown-item .item-icon.task { background: rgba(200, 146, 42, 0.12); }
    .dropdown-item .item-icon.achievement { background: rgba(58, 158, 110, 0.12); }
    .dropdown-item .item-icon.message { background: rgba(74, 90, 138, 0.15); }
    .dropdown-item .item-icon.season { background: rgba(196, 80, 64, 0.12); }

    .dropdown-item .item-content {
      flex: 1;
      min-width: 0;
    }
    .dropdown-item .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #f0e6d2;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-item .item-summary {
      font-size: 12px;
      color: #b8a88e;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-item .item-time {
      font-size: 11px;
      color: #8a7b65;
      margin-top: 2px;
    }

    /* Footer */
    .dropdown-footer {
      border-top: 1px solid rgba(200, 170, 120, 0.1);
      padding: 10px 16px;
      flex-shrink: 0;
      text-align: center;
    }
    .dropdown-footer a {
      font-size: 13px;
      color: #b8a88e;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .dropdown-footer a:hover {
      color: #c8922a;
    }

    /* ========== HINT TEXT ========== */
    .page-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #8a7b65;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Mock top nav with bell icon -->
  <nav class="mock-nav">
    <a href="notifications.html" class="icon-btn">&#128276;<span class="bell-badge"></span></a>
  </nav>

  <!-- Backdrop overlay -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Dropdown notification panel -->
  <div class="dropdown-panel" id="dropdownPanel">

    <!-- Header -->
    <div class="dropdown-header">
      <h3>&#128276; 通知</h3>
      <a href="notifications.html" class="view-all-link">查看全部</a>
    </div>

    <!-- Scrollable notification list -->
    <div class="dropdown-list">

      <!-- New task — unread -->
      <div class="dropdown-item">
        <span class="unread-dot"></span>
        <div class="item-icon task">&#128203;</div>
        <div class="item-content">
          <div class="item-title">新任务</div>
          <div class="item-summary">陈女士 发布了宠物喂养委托</div>
          <div class="item-time">10分钟前</div>
        </div>
      </div>

      <!-- Task completed — unread -->
      <div class="dropdown-item">
        <span class="unread-dot"></span>
        <div class="item-icon task">&#9989;</div>
        <div class="item-content">
          <div class="item-title">任务完成</div>
          <div class="item-summary">春节宠物上门喂养已完成</div>
          <div class="item-time">1小时前</div>
        </div>
      </div>

      <!-- Achievement unlocked — unread -->
      <div class="dropdown-item">
        <span class="unread-dot"></span>
        <div class="item-icon achievement">&#127941;</div>
        <div class="item-content">
          <div class="item-title">成就解锁</div>
          <div class="item-summary">获得「准时达人」徽章</div>
          <div class="item-time">昨天</div>
        </div>
      </div>

      <!-- New message — unread -->
      <div class="dropdown-item">
        <span class="unread-dot"></span>
        <div class="item-icon message">&#128172;</div>
        <div class="item-content">
          <div class="item-title">新消息</div>
          <div class="item-summary">林小野: 好的，我明天...</div>
          <div class="item-time">3小时前</div>
        </div>
      </div>

      <!-- Season — read (no dot) -->
      <div class="dropdown-item">
        <div class="item-icon season">&#127982;</div>
        <div class="item-content">
          <div class="item-title">赛季活动</div>
          <div class="item-summary">春节守护季已开始</div>
          <div class="item-time">5天前</div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="dropdown-footer">
      <a href="notifications.html">查看全部通知 &#8594;</a>
    </div>

  </div>

  <!-- Page hint -->
  <div class="page-hint">This simulates the notification dropdown overlay.</div>

  <script>
    // Click backdrop to close
    const backdrop = document.getElementById('backdrop');
    const panel = document.getElementById('dropdownPanel');

    backdrop.addEventListener('click', () => {
      backdrop.style.animation = 'fadeIn 0.2s ease-out reverse forwards';
      panel.style.animation = 'slideDown 0.2s ease-out reverse forwards';
      setTimeout(() => {
        backdrop.style.display = 'none';
        panel.style.display = 'none';
      }, 200);
    });
  </script>

</body>
</html>
