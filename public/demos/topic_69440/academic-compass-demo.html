<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学术罗盘 Academic Compass</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--primary-light:#3b82f6;--primary-dark:#1d4ed8;--primary-50:#eff6ff;--primary-100:#dbeafe;--bg:#f0f4f8;--surface:#fff;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--sidebar-bg:#0f172a;--sidebar-text:#94a3b8;--sidebar-active:#1e293b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 30px -10px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow:hidden;height:100vh}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s}
.sidebar.collapsed{width:64px}
.sidebar-header{padding:20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:900;font-size:18px}
.logo-text{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .2s;margin-bottom:4px;color:var(--sidebar-text);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav-item.active{background:var(--sidebar-active);color:#fff;border-left:3px solid var(--primary)}
.nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#475569}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:18px;font-weight:600}
.search-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;width:260px;color:var(--text-muted)}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-icon{width:36px;height:36px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all .2s}
.btn-icon:hover{background:var(--primary-50);color:var(--primary)}
.content{flex:1;overflow-y:auto;padding:24px}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:15px;font-weight:600}
.card-body{padding:20px}

/* Dashboard */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px}
.stat-value{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text-muted)}
.recent-papers{display:flex;flex-direction:column;gap:8px}
.paper-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.paper-item:hover{border-color:var(--primary);background:var(--primary-50)}
.paper-avatar{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--primary-100),var(--primary-50));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.paper-info{flex:1;min-width:0}
.paper-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.paper-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}

/* Analyze */
.analyze-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:calc(100vh - 140px)}
.input-panel{display:flex;flex-direction:column}
.input-tabs{display:flex;gap:4px;margin-bottom:12px}
.input-tab{padding:8px 16px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);background:var(--bg);transition:all .2s}
.input-tab.active{background:var(--surface);color:var(--primary);border-color:var(--border)}
.input-content{flex:1;border:1px solid var(--border);border-radius:0 var(--radius) var(--radius) var(--radius);padding:16px;display:flex;flex-direction:column;background:var(--surface)}
#tab-text{display:flex;flex-direction:column;flex:1;min-height:0}
.input-area{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;width:100%;min-height:120px}
.input-area:focus{border-color:var(--primary)}
.upload-zone{flex:1;border:2px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--text-muted)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.mode-selector{display:flex;gap:8px;margin:12px 0}
.mode-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .2s}
.mode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.analyze-btn{margin-top:12px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.analyze-btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.analyze-btn:disabled{background:var(--text-muted);cursor:not-allowed;transform:none}

/* Results */
.result-panel{overflow-y:auto}
.result-section{margin-bottom:20px}
.result-section-title{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.result-block{background:var(--bg);border-radius:8px;padding:14px;font-size:14px;line-height:1.7}
.result-block strong{color:var(--primary-dark)}
.resource-list{display:flex;flex-direction:column;gap:8px}
.resource-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:6px;font-size:13px}
.resource-badge{padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}

/* Mindmap */
.mindmap-container{position:relative;width:100%;height:calc(100vh - 160px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.mindmap-toolbar{position:absolute;top:12px;left:12px;z-index:10;display:flex;gap:8px}
.mindmap-svg{width:100%;height:100%;cursor:grab}
.mindmap-svg:active{cursor:grabbing}
.mm-node{cursor:pointer;transition:all .2s}
.mm-node:hover{filter:brightness(1.1)}
.mm-node-bg{transition:all .2s}
.mm-node-text{font-size:12px;font-weight:600;pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:#fff}
.mm-link{stroke:var(--border);stroke-width:1.5;fill:none;transition:all .2s}
.mm-link.highlight{stroke:var(--primary);stroke-width:2.5}

/* Compare */
.compare-layout{display:flex;flex-direction:column;gap:16px}
.compare-selector{display:flex;gap:12px;flex-wrap:wrap}
.compare-select-card{flex:1;min-width:200px;padding:16px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:var(--surface)}
.compare-select-card:hover{border-color:var(--primary-light)}
.compare-select-card.selected{border-color:var(--primary);background:var(--primary-50)}
.compare-select-card h4{font-size:14px;margin-bottom:4px}
.compare-select-card p{font-size:12px;color:var(--text-muted)}
.compare-table-wrapper{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.compare-table th{background:var(--bg);padding:12px 16px;text-align:left;font-weight:600;color:var(--text-muted);white-space:nowrap;border-bottom:2px solid var(--border)}
.compare-table td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top}
.compare-table tr:last-child td{border-bottom:none}

/* Writing */
.writing-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;height:calc(100vh - 140px)}
.template-list{display:flex;flex-direction:column;gap:8px}
.template-item{padding:14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;background:var(--surface)}
.template-item:hover{border-color:var(--primary-light)}
.template-item.active{border-color:var(--primary);background:var(--primary-50)}
.template-item h4{font-size:14px;margin-bottom:4px}
.template-item p{font-size:12px;color:var(--text-muted)}
.writing-editor{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.writing-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.writing-textarea{flex:1;padding:16px;border:none;outline:none;font-family:inherit;font-size:14px;line-height:1.8;resize:none}
.writing-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.loading-box{background:var(--surface);border-radius:16px;padding:40px;text-align:center;box-shadow:var(--shadow-lg)}
.spinner{width:48px;height:48px;border:4px solid var(--primary-100);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.loading-text{font-size:15px;font-weight:500;color:var(--text)}
.loading-subtext{font-size:13px;color:var(--text-muted);margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Responsive */
@media(max-width:768px){.analyze-layout{grid-template-columns:1fr;height:auto}.writing-layout{grid-template-columns:1fr;height:auto}.sidebar{position:fixed;z-index:100;transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}}
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">学</div>
      <div class="logo-text">学术罗盘</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
        <span class="nav-icon">📊</span><span>工作台</span>
      </div>
      <div class="nav-item" data-view="analyze" onclick="switchView('analyze')">
        <span class="nav-icon">📄</span><span>论文分析</span>
      </div>
      <div class="nav-item" data-view="mindmap" onclick="switchView('mindmap')">
        <span class="nav-icon">🧠</span><span>知识脑图</span>
      </div>
      <div class="nav-item" data-view="compare" onclick="switchView('compare')">
        <span class="nav-icon">🔍</span><span>文献对比</span>
      </div>
      <div class="nav-item" data-view="writing" onclick="switchView('writing')">
        <span class="nav-icon">✍️</span><span>AI 写作</span>
      </div>
      <div class="nav-item" data-view="history" onclick="switchView('history')">
        <span class="nav-icon">📚</span><span>历史记录</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      Academic Compass v1.0<br>TRAE AI 创造力大赛
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" onclick="toggleSidebar()">☰</button>
        <span class="topbar-title" id="pageTitle">工作台</span>
      </div>
      <div class="topbar-right">
        <input type="text" class="search-box" placeholder="搜索论文、笔记..." id="searchInput" oninput="handleSearch(event)">
        <button class="btn-icon" title="设置">⚙️</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">AI 正在分析论文...</div>
    <div class="loading-subtext" id="loadingSubtext">正在提取关键信息</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Mock Data =====
const mockPapers = [
  {
    id:1, title:"Attention Is All You Need", authors:"Ashish Vaswani et al.", year:2017,
    venue:"NeurIPS", type:"论文",
    abstract:"提出了 Transformer 架构，完全基于自注意力机制，摒弃循环与卷积。在 WMT 2014 翻译任务上取得 SOTA。",
    background:"传统序列模型依赖 RNN/CNN，难以并行化，长距离依赖建模效率低。Seq2Seq 模型在处理长序列时存在梯度消失和信息丢失问题。",
    method:"提出 Transformer 架构，核心是 Scaled Dot-Product Attention 和 Multi-Head Attention。完全摒弃循环结构，仅用注意力机制建立全局依赖关系。包含 6 层 Encoder 和 6 层 Decoder。",
    experiment:"在 WMT 2014 英德翻译任务上 BLEU 28.4（提升 2.0），英法翻译 BLEU 41.8（SOTA）。训练仅需 3.5 天（8 GPU），远快于此前方案。",
    conclusion:"Transformer 架构在翻译任务上取得突破，自注意力机制为后续 BERT、GPT 等大模型奠定基础。",
    innovations:["Self-Attention 机制","Multi-Head Attention","Positional Encoding","完全摒弃 RNN/CNN"],
    resources:[
      {type:"论文",name:"Attention Is All You Need",url:"https://arxiv.org/abs/1706.03762"},
      {type:"代码",name:"tensorflow/tensor2tensor",url:"https://github.com/tensorflow/tensor2tensor"},
      {type:"数据集",name:"WMT 2014",url:"http://statmt.org/wmt14/"}
    ],
    keywords:["Transformer","Self-Attention","Neural Machine Translation","Sequence Modeling"],
    mindmap:{center:"Transformer",nodes:["Self-Attention","Multi-Head","Positional Encoding","Encoder","Decoder","Feed-Forward","Layer Norm","Softmax"]},
    rating:5
  },
  {
    id:2, title:"BERT: Pre-training of Deep Bidirectional Transformers", authors:"Jacob Devlin et al.", year:2018,
    venue:"NAACL", type:"论文",
    abstract:"提出 BERT 预训练语言模型，通过 Masked Language Model 和 Next Sentence Prediction 实现双向理解。",
    background:"预训练语言模型（如 GPT、ELMo）大多采用单向或浅层拼接方式建模，无法充分捕捉上下文双向语义关系。",
    method:"BERT 基于 Transformer Encoder，提出 Masked Language Model（MLM）和 Next Sentence Prediction（NSP）两个预训练任务。支持 12 层 Base 和 24 层 Large 两个版本。",
    experiment:"在 GLUE 基准上 11 项任务刷新 SOTA，SQuAD 1.1 F1 93.2，SQuAD 2.0 F1 83.1。",
    conclusion:"BERT 证明了深度双向预训练的有效性，推动了预训练+微调范式成为 NLP 主流。",
    innovations:["Masked Language Model","双向 Transformer 预训练","Next Sentence Prediction","预训练-微调范式"],
    resources:[
      {type:"论文",name:"BERT Paper",url:"https://arxiv.org/abs/1810.04805"},
      {type:"代码",name:"google-research/bert",url:"https://github.com/google-research/bert"}
    ],
    keywords:["BERT","Pre-training","Language Model","Transfer Learning"],
    mindmap:{center:"BERT",nodes:["MLM","NSP","Transformer Encoder","Pre-training","Fine-tuning","WordPiece","GLUE","SQuAD"]},
    rating:5
  },
  {
    id:3, title:"Deep Residual Learning for Image Recognition", authors:"Kaiming He et al.", year:2016,
    venue:"CVPR", type:"论文",
    abstract:"提出残差学习框架（ResNet），通过 shortcut connection 解决深度网络退化问题，实现 152 层网络训练。",
    background:"网络深度增加时，出现退化问题：训练误差反而升高。这不是过拟合，而是优化困难。",
    method:"引入残差块 F(x)+x，让网络学习残差映射而非直接映射。使用 shortcut connection 实现恒等映射。构建了 34/50/101/152 层网络。",
    experiment:"ImageNet Top-5 错误率 3.57%（超越人类），COCO 检测 mAP 提升 28%。152 层网络训练速度优于 VGG-19。",
    conclusion:"残差学习使极深网络训练成为可能，深刻影响了后续深度学习架构设计。",
    innovations:["Residual Block","Shortcut Connection","Identity Mapping","极深网络训练"],
    resources:[
      {type:"论文",name:"ResNet Paper",url:"https://arxiv.org/abs/1512.03385"},
      {type:"代码",name:"KaimingHe/deep-residual-networks",url:"https://github.com/KaimingHe/deep-residual-networks"}
    ],
    keywords:["ResNet","Deep Learning","Image Recognition","Residual Learning"],
    mindmap:{center:"ResNet",nodes:["Residual Block","Shortcut","Identity","1x1 Conv","BN","ReLU","152 Layer","ImageNet"]},
    rating:5
  }
];

let state = {
  view:'dashboard',
  papers:JSON.parse(localStorage.getItem('ac_papers')||'[]'),
  analyzedPapers:mockPapers,
  selectedForCompare:new Set(),
  currentAnalysis:null,
  analysisMode:'standard',
  writingTemplate:null,
  searchQuery:''
};

// ===== Navigation =====
function switchView(view){
  state.view=view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
  const titles={dashboard:'工作台',analyze:'论文分析',mindmap:'知识脑图',compare:'文献对比',writing:'AI 写作',history:'历史记录'};
  document.getElementById('pageTitle').textContent=titles[view]||'';
  renderView();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}

// ===== Render =====
function renderView(){
  const c=document.getElementById('content');
  switch(state.view){
    case'dashboard':c.innerHTML=renderDashboard();break;
    case'analyze':c.innerHTML=renderAnalyze();break;
    case'mindmap':c.innerHTML=renderMindmap();initMindmap();break;
    case'compare':c.innerHTML=renderCompare();break;
    case'writing':c.innerHTML=renderWriting();break;
    case'history':c.innerHTML=renderHistory();break;
  }
}

// ===== Dashboard =====
function renderDashboard(){
  const total=state.analyzedPapers.length;
  const notes=JSON.parse(localStorage.getItem('ac_notes')||'[]').length;
  const tags=new Set(state.analyzedPapers.flatMap(p=>p.keywords)).size;
  return `
  <div class="fade-in">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#dbeafe;">📄</div>
        <div class="stat-value">${total}</div>
        <div class="stat-label">已分析论文</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7;">📝</div>
        <div class="stat-value">${notes}</div>
        <div class="stat-label">学习笔记</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fae8ff;">🏷️</div>
        <div class="stat-value">${tags}</div>
        <div class="stat-label">知识标签</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7;">⚡</div>
        <div class="stat-value">10min</div>
        <div class="stat-label">平均阅读时间</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="card">

function renderMindmap(){
  return `
  <div class="fade-in" style="height:100%">
    <div class="mindmap-container">
      <div class="mindmap-toolbar">
        <select id="mindmapPaperSelect" onchange="updateMindmap()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface)">
          ${state.analyzedPapers.map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}
        </select>
        <button class="btn-icon" onclick="zoomMindmap(1.2)" title="放大">+</button>
        <button class="btn-icon" onclick="zoomMindmap(0.8)" title="缩小">−</button>
        <button class="btn-icon" onclick="resetMindmap()" title="重置">↺</button>
      </div>
      <svg class="mindmap-svg" id="mindmapSvg" viewBox="0 0 800 500"></svg>
    </div>
  </div>`;
}
function initMindmap(){updateMindmap()}
function updateMindmap(){
  const sel=document.getElementById('mindmapPaperSelect');
  if(!sel)return;
  const paper=state.analyzedPapers.find(p=>p.id==sel.value);
  if(!paper)return;
  const svg=document.getElementById('mindmapSvg');
  const cx=400,cy=250,r=140;
  const nodes=paper.mindmap.nodes;
  const n=nodes.length;
  let html='';
  // Links
  nodes.forEach((label,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    const x=cx+r*Math.cos(angle),y=cy+r*Math.sin(angle);
    html+=`<line class="mm-link" data-idx="${i}" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
  });
  // Center node
  html+=`<g class="mm-node" onclick="highlightNode(-1)"><circle class="mm-node-bg" cx="${cx}" cy="${cy}" r="50" fill="#2563eb"/><text class="mm-node-text" x="${cx}" y="${cy}" style="font-size:14px">${paper.mindmap.center}</text></g>`;
  // Satellite nodes
  nodes.forEach((label,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    const x=cx+r*Math.cos(angle),y=cy+r*Math.sin(angle);
    const colors=['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#6366f1'];
    const color=colors[i%colors.length];
    const baseR=Math.max(26,Math.min(46,24+label.length*1.4));
    const nodeR=Math.round(baseR);
    const fontSize=Math.max(10,Math.min(13,12+label.length*0.05));
    const displayLabel=label.length>14?label.slice(0,12)+'..':label;
    html+=`<g class="mm-node" onclick="highlightNode(${i})"><circle class="mm-node-bg" cx="${x}" cy="${y}" r="${nodeR}" fill="${color}" opacity="0.9"/><text class="mm-node-text" x="${x}" y="${y}" style="font-size:${fontSize}px">${displayLabel}</text></g>`;
  });
  svg.innerHTML=html;
}
function highlightNode(idx){
  document.querySelectorAll('.mm-link').forEach((l,i)=>{l.classList.toggle('highlight',i===idx)});
}
function zoomMindmap(scale){
  const svg=document.getElementById('mindmapSvg');
  const vb=svg.getAttribute('viewBox').split(' ').map(Number);
  const cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2;
  const nw=vb[2]/scale,nh=vb[3]/scale;
  svg.setAttribute('viewBox',`${cx-nw/2} ${cy-nh/2} ${nw} ${nh}`);
}
function resetMindmap(){document.getElementById('mindmapSvg').setAttribute('viewBox','0 0 800 500')}

    switch(state.writingTemplate){
      case'review':
        result=`## 文献综述：${input.value.slice(0,30)}\n\n近年来，${input.value.slice(0,20)}领域取得了显著进展。Vaswani 等人 (2017) 提出的 Transformer 架构开创了基于自注意力机制的序列建模新范式，完全摒弃了传统的循环和卷积结构。随后，Devlin 等人 (2018) 在此基础上提出了 BERT 模型，通过 Masked Language Model 实现了深度双向预训练，在 GLUE 等 11 项 NLP 基准任务上刷新了 SOTA。\n\n在视觉领域，He 等人 (2016) 提出的 ResNet 通过残差连接解决了深层网络退化问题，使 152 层网络的训练成为可能，ImageNet Top-5 错误率降至 3.57%。这些工作共同推动了深度学习向更深、更宽的方向发展。\n\n综上所述，从 Transformer 到 BERT，从 ResNet 到后续的各种变体，研究者们在模型架构、预训练方法和优化策略上不断创新，为人工智能的广泛应用奠定了坚实基础。\n\n### 参考文献\n[1] Vaswani, A., et al. (2017). Attention Is All You Need. NeurIPS.\n[2] Devlin, J., et al. (2018). BERT: Pre-training of Deep Bidirectional Transformers. NAACL.\n[3] He, K., et al. (2016). Deep Residual Learning for Image Recognition. CVPR.`;
        break;
      case'question':
        result=`## 研究问题\n\n基于「${input.value.slice(0,30)}」的分析，以下研究问题值得关注：\n\n1. **核心问题**：如何进一步提升模型在长序列上的建模效率？\n2. **方法创新**：是否可以结合稀疏注意力机制降低计算复杂度？\n3. **跨领域迁移**：该方法在视觉、多模态等领域的迁移效果如何？\n4. **效率优化**：在保持性能的前提下，如何减少模型参数量和推理延迟？\n5. **理论分析**：自注意力机制的理论性质（如表达能力、泛化能力）如何？\n\n这些问题可以作为后续研究的切入方向。`;
        break;
      case'citation':
        const parts=input.value.split(',');
        result=`## 引用格式\n\n**APA 格式：**\n${parts[1]?.trim()||'Author'}, ${parts[2]?.trim()||'Year'}. ${parts[0]?.trim()||'Title'}. \n\n**IEEE 格式：**\n[1] ${parts[1]?.trim()||'Author'}, "${parts[0]?.trim()||'Title'}," ${parts[2]?.trim()||'Year'}.\n\n**GB/T 7714 格式：**\n${parts[1]?.trim()||'Author'}. ${parts[0]?.trim()||'Title'}[J]. ${parts[2]?.trim()||'Year'}.`;
        break;
      case'abstract':
        result=`## 润色后摘要\n\n${input.value.slice(0,50)}...本文在此基础上进行了系统性改进，提出了新的方法框架。通过在多个标准数据集上的实验验证，该方法在保持计算效率的同时显著提升了性能。实验结果表明，相较于基线方法，本方法在主要评价指标上提升了 3.5%-8.2%。此外，我们还进行了详细的消融实验，验证了各组件的有效性。\n\n### 润色要点\n- ✅ 优化了句子结构，提升可读性\n- ✅ 补充了量化结果，增强说服力\n- ✅ 增加了消融实验描述，提升严谨性`;
        break;
      default:result='请选择模板';
    }
    input.value=result;
    document.getElementById('charCount').textContent=result.length+' 字';
    showToast('生成完成！');
  },2000);
}

// ===== History =====
function renderHistory(){
  const saved=JSON.parse(localStorage.getItem('ac_saved_papers')||'[]');
  const all=[...saved.map((p,i)=>({...p,_id:'saved_'+i})),...state.analyzedPapers.map(p=>({...p,_id:'mock_'+p.id}))];
  const filtered=state.searchQuery?all.filter(p=>p.title.toLowerCase().includes(state.searchQuery)||p.keywords?.some(k=>k.toLowerCase().includes(state.searchQuery))):all;
  return `
  <div class="fade-in">
    <div class="card">
      <div class="card-header"><span class="card-title">历史记录 (${filtered.length})</span></div>
      <div class="card-body">
        ${filtered.length===0?`<div style="text-align:center;padding:40px;color:var(--text-muted)"><div style="font-size:40px;margin-bottom:12px">📭</div>暂无历史记录</div>`:
        `<div class="recent-papers">${filtered.map(p=>`
          <div class="paper-item" onclick="viewPaper(${p.id||0})">
            <div class="paper-avatar">${(p.venue||'P')[0]}</div>
            <div class="paper-info">
              <div class="paper-title">${p.title}</div>
              <div class="paper-meta">${p.authors} · ${p.year} · ${p.venue||''}</div>
            </div>
            <div style="display:flex;gap:4px;flex-wrap:wrap">${(p.keywords||[]).slice(0,2).map(k=>`<span class="paper-tag" style="background:var(--primary-50);color:var(--primary-dark)">${k}</span>`).join('')}</div>
          </div>`).join('')}</div>`}
      </div>
    </div>
  </div>`;
}
function viewPaper(id){
  switchView('analyze');
  setTimeout(()=>{
    const paper=state.analyzedPapers.find(p=>p.id===id);
    if(paper){state.currentAnalysis=paper;renderAnalysisResult(paper)}
  },100);
}
function savePaper(id){
  const paper=state.analyzedPapers.find(p=>p.id===id);
  if(!paper)return;
  const saved=JSON.parse(localStorage.getItem('ac_saved_papers')||'[]');
  if(saved.find(p=>p.title===paper.title)){showToast('已保存过该论文');return}
  saved.push(paper);
  localStorage.setItem('ac_saved_papers',JSON.stringify(saved));
  showToast('已保存到笔记');
}
function exportMarkdown(id){
  const paper=state.analyzedPapers.find(p=>p.id===id);
  if(!paper)return;
  const md=`# ${paper.title}\n\n**作者：** ${paper.authors}\n**年份：** ${paper.year}\n**会议：** ${paper.venue}\n\n## 摘要\n${paper.abstract}\n\n## 研究背景\n${paper.background}\n\n## 方法\n${paper.method}\n\n## 实验\n${paper.experiment}\n\n## 结论\n${paper.conclusion}\n\n## 创新点\n${paper.innovations.map(i=>'- '+i).join('\n')}\n\n## 关键词\n${paper.keywords.join(', ')}\n\n## 资源\n${paper.resources.map(r=>'- ['+r.type+'] '+r.name+'('+r.url+')').join('\n')}`;
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=paper.title.replace(/\s/g,'_')+'.md';
  a.click();
  showToast('已导出 Markdown');
}
function exportCompare(){
  showToast('对比表已复制到剪贴板');
}

// ===== Utilities =====
function showLoading(text,subtext){
  document.getElementById('loadingText').textContent=text;
  document.getElementById('loadingSubtext').textContent=subtext;
  document.getElementById('loadingOverlay').classList.remove('hidden');
}
function updateLoading(text,subtext){
  document.getElementById('loadingText').textContent=text;
  document.getElementById('loadingSubtext').textContent=subtext;
}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden')}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function handleSearch(e){state.searchQuery=e.target.value.toLowerCase();if(state.view==='history')renderView()}

// Writing char count
document.addEventListener('input',e=>{
  if(e.target.id==='writingInput'){document.getElementById('charCount').textContent=e.target.value.length+' 字'}
});

// Upload drag-drop
document.addEventListener('dragover',e=>{e.preventDefault();if(e.target.closest('#uploadZone'))e.target.closest('#uploadZone').classList.add('dragover')});
document.addEventListener('dragleave',e=>{if(e.target.closest('#uploadZone'))e.target.closest('#uploadZone').classList.remove('dragover')});
document.addEventListener('drop',e=>{
  e.preventDefault();
  const zone=e.target.closest('#uploadZone');
  if(zone){zone.classList.remove('dragover');if(e.dataTransfer.files[0])handleFileSelect({target:{files:e.dataTransfer.files}})}
});

// Init
renderView();
</script>
