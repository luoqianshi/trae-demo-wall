<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On My Own · 独自坚强</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'SimSun','STSong','Noto Serif SC',serif}
canvas{display:block;image-rendering:pixelated}
#hud{position:fixed;top:16px;left:16px;z-index:15;pointer-events:none}
#hud .chapter{color:#c8a84b;font-size:13px;letter-spacing:.15em;opacity:.85}
#hud .death-count{color:#804040;font-size:11px;margin-top:4px;letter-spacing:.1em;opacity:.6}
#hud .runes{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;max-width:320px}
#hud .rune{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(200,168,75,.3);border-radius:3px;font-size:14px;color:#c8a84b;
  background:rgba(200,168,75,.06);transition:all .3s}
#hud .rune.active{background:rgba(200,168,75,.2);border-color:#c8a84b;box-shadow:0 0 8px rgba(200,168,75,.25)}
#hud .word-target{color:#7a8ca0;font-size:11px;margin-top:6px;letter-spacing:.1em}
#hud .ability{color:#556;font-size:10px;margin-top:10px;line-height:1.8}
#dialog{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:650px;width:88%;
  background:rgba(8,10,18,.94);border:1px solid rgba(200,168,75,.3);border-radius:4px;
  padding:16px 22px;color:#d4cfc5;font-size:14px;line-height:1.85;display:none;z-index:20;
  pointer-events:auto;backdrop-filter:blur(4px)}
#dialog .speaker{color:#c8a84b;font-size:12px;margin-bottom:4px;letter-spacing:.12em}
#dialog .hint{color:#445;font-size:11px;margin-top:8px;text-align:right}
#title-screen{position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse at 25% 35%,#0e1a3a 0%,#07080f 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s}
#title-screen h1{font-size:clamp(36px,8vw,56px);color:transparent;
  background:linear-gradient(135deg,#fff 10%,#e8d08a 50%,#c8a84b 90%);
  -webkit-background-clip:text;background-clip:text;font-weight:700;letter-spacing:.08em}
#title-screen .en{color:#6a7a8a;font-size:clamp(14px,2.5vw,20px);letter-spacing:.4em;margin:6px 0 50px}
#title-screen .start{color:#c8a84b;font-size:13px;letter-spacing:.25em;animation:pulse 2.5s ease-in-out infinite}
#title-screen .controls{position:absolute;bottom:30px;color:#334;font-size:11px;line-height:2.2;text-align:center}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#death-screen{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#death-screen .msg{color:#803030;font-size:22px;letter-spacing:.2em;margin-bottom:16px}
#death-screen .sub{color:#556;font-size:12px;margin-bottom:20px}
#death-screen .retry{color:#c8a84b;font-size:13px;letter-spacing:.2em;animation:pulse 2s ease-in-out infinite}
#chapter-transition{position:fixed;inset:0;z-index:35;background:#000;display:none;
  flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.8s}
#chapter-transition .ch-num{color:#c8a84b;font-size:14px;letter-spacing:.4em;margin-bottom:8px}
#chapter-transition .ch-name{color:#fff;font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:.15em}
#chapter-transition .ch-sub{color:#6a7a8a;font-size:12px;margin-top:6px;letter-spacing:.2em}
#vine-hint{position:fixed;top:16px;right:16px;z-index:15;pointer-events:none;
  background:rgba(8,10,18,.85);border:1px solid rgba(100,160,60,.35);border-radius:4px;
  padding:10px 14px;color:#8a9a7a;font-size:11px;line-height:2;display:none;
  backdrop-filter:blur(3px)}
#vine-hint .title{color:#6a9a5a;font-size:12px;margin-bottom:4px;letter-spacing:.15em}
</style>
</head>
<body>

<div id="title-screen">
  <h1>独自坚强</h1>
  <div class="en">ON MY OWN</div>
  <div class="start">按 ENTER 开始旅程</div>
  <div class="controls">
    ← → / A D 移动 &nbsp;&nbsp; 空格 跳跃 &nbsp;&nbsp; ↑/W 抓取藤蔓（空中） &nbsp;&nbsp; J 下砸（第二章起）<br>
    摆动中：空格 跳离 &nbsp;&nbsp; ↓ 松手 &nbsp;&nbsp; E 对话继续 &nbsp;&nbsp; 拾取符文自动拼读
  </div>
</div>

<div id="death-screen">
  <div class="msg">光芒熄灭...</div>
  <div class="sub"></div>
  <div class="retry">按 ENTER 重试</div>
</div>

<div id="chapter-transition">
  <div class="ch-num"></div>
  <div class="ch-name"></div>
  <div class="ch-sub"></div>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div class="chapter"></div>
  <div class="death-count"></div>
  <div class="runes"></div>
  <div class="word-target"></div>
  <div class="ability"></div>
</div>

<div id="dialog">
  <div class="speaker"></div>
  <div class="text"></div>
  <div class="hint">按 E 继续</div>
</div>

<div id="vine-hint">
  <div class="title">🌿 藤蔓</div>
  ← → 微调摆动方向<br>
  空格 跳离（带惯性）<br>
  ↓ 松手
</div>

<script>
// ══════════════════════════════════════════════
//  On My Own · 独自坚强 — MVP Platformer
// ══════════════════════════════════════════════

const C = document.getElementById('game');
const ctx = C.getContext('2d');
let W, H;

// ─── Physics ───
const G = 0.52, FRIC = 0.84, MAX_VY = 13;
const COYOTE = 7, JUMP_BUF = 6; // frames

// ─── State ───
let state = 'title', chapter = 1, deaths = 0, gTime = 0;
let shakeT = 0, shakeI = 0;
let checkpoint = {x:0,y:0};
let windX = 0, windY = 0;
let inWater = false, echoT = 0, echoAng = 0;

// ─── Global primitives ───
function hash(n){
  n=((n>>16)^n)*0x45d9f3b; n=((n>>16)^n)*0x45d9f3b; n=(n>>16)^n;
  return(n&0xffff)/0xffff;
}
const PAL={
  1:{glow:'#c8a84b',warm:'#e8d08a',cool:'#2a3050',accent:'#556677',fog:'#0b0c14',starCol:'#b4b4d2',rimLight:'#4a5a7a'},
  2:{glow:'#c04040',warm:'#e06040',cool:'#1a0808',accent:'#a04080',fog:'#120808',starCol:'#d2a0a0',rimLight:'#6a3030'},
  3:{glow:'#4caf7d',warm:'#e8d08a',cool:'#081008',accent:'#2a5a2a',fog:'#06100a',starCol:'#a0d2b0',rimLight:'#3a6a3a'},
  4:{glow:'#6040c0',warm:'#a060ff',cool:'#0a082a',accent:'#4030a0',fog:'#080620',starCol:'#a080d0',rimLight:'#5040a0'},
  5:{glow:'#c8a84b',warm:'#ffe8a0',cool:'#1a1808',accent:'#8a7030',fog:'#0c0a04',starCol:'#ffe0a0',rimLight:'#a08030'},
};

// ─── Audio (Web Audio API) ───
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(freq, dur, type='sine', vol=0.08){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxJump(){ playTone(520, 0.12, 'sine', 0.06); }
function sfxLand(){ playTone(120, 0.08, 'triangle', 0.05); }
function sfxSlam(){ playTone(80, 0.25, 'sawtooth', 0.1); playTone(60, 0.3, 'square', 0.06); }
function sfxRune(){ playTone(660, 0.15, 'sine', 0.08); setTimeout(()=>playTone(880, 0.2, 'sine', 0.06), 100); }
function sfxRuneWord(){ playTone(440, 0.1, 'sine', 0.07); setTimeout(()=>playTone(660, 0.1, 'sine', 0.07), 80); setTimeout(()=>playTone(880, 0.2, 'sine', 0.08), 160); }
function sfxDeath(){ playTone(200, 0.3, 'sawtooth', 0.08); playTone(100, 0.5, 'square', 0.05); }
function sfxHurt(){ playTone(150, 0.15, 'square', 0.07); }
function sfxExit(){ playTone(523, 0.1, 'sine', 0.06); setTimeout(()=>playTone(659, 0.1, 'sine', 0.06), 100); setTimeout(()=>playTone(784, 0.15, 'sine', 0.07), 200); }

// ─── Input ───
const keys = {}, kp = {};
document.addEventListener('keydown', e => { if(!keys[e.code]) kp[e.code]=true; keys[e.code]=true; e.preventDefault(); });
document.addEventListener('keyup', e => keys[e.code]=false);
function jp(c){ return kp[c]===true; }
function kl(c){ return keys[c]===true; }

function resize(){ W=C.width=innerWidth; H=C.height=innerHeight; }
addEventListener('resize', resize); resize();

// ─── Particles (upgraded) ───
const parts = [];
function emit(x,y,o={}){
  parts.push({x,y,vx:o.vx||(Math.random()-.5)*2,vy:o.vy||-Math.random()*2-.5,
    life:o.life||50,ml:o.life||50,sz:o.sz||2+Math.random()*2,col:o.col||'#c8a84b',
    grav:o.grav||0,shrink:o.shrink!==false,
    shape:o.shape||'circle',rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.1,
    windAff:o.windAff||0,fg:o.fg||false});
}
function tickParts(){
  if(parts.length>300) parts.splice(0,parts.length-300);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vx+=windX*p.windAff*.02; p.vy+=windY*p.windAff*.01;
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.rot+=p.rotV;
    if(--p.life<=0) parts.splice(i,1);
  }
}
function drawParts(cx,cy){
  const bg=[],fg=[];
  parts.forEach(p=>(p.fg?fg:bg).push(p));
  ctx.save(); ctx.globalCompositeOperation='lighter';
  bg.forEach(p=>{
    const a=p.life/p.ml, s=p.shrink?p.sz*a:p.sz;
    ctx.globalAlpha=a*.7; ctx.fillStyle=p.col;
    if(p.shape==='line'){
      ctx.save(); ctx.translate(p.x-cx,p.y-cy); ctx.rotate(p.rot);
      ctx.fillRect(-s*2,-.5,s*4,1); ctx.restore();
    } else if(p.shape==='star'){
      ctx.save(); ctx.translate(p.x-cx,p.y-cy); ctx.rotate(p.rot);
      ctx.strokeStyle=p.col; ctx.lineWidth=.8; ctx.beginPath();
      for(let si=0;si<4;si++){const ang=si*Math.PI/2;ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*s,Math.sin(ang)*s);}
      ctx.stroke(); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x-cx,p.y-cy,s,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
  if(fg.length){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.shadowColor=PAL[chapter]?PAL[chapter].glow:'#c8a84b'; ctx.shadowBlur=8;
    fg.forEach(p=>{
      const a=p.life/p.ml, s=p.shrink?p.sz*a:p.sz;
      ctx.globalAlpha=a*.3; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x-cx,p.y-cy,s*2,0,Math.PI*2); ctx.fill();
    });
    ctx.shadowBlur=0; ctx.restore();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

// ─── Camera ───
const cam = {x:0,y:0};
function tickCam(){
  const tx=P.x-W/2+P.w/2, ty=P.y-H/2+P.h/2;
  cam.x+=(tx-cam.x)*.09; cam.y+=(ty-cam.y)*.09;
  const lv=lvl(); if(lv){ cam.x=Math.max(0,Math.min(lv.w-W,cam.x)); cam.y=Math.max(0,Math.min(lv.h-H,cam.y)); }
}

// ─── Moving Hazards ───
const movers = [];
function tickMovers(){
  for(let i=movers.length-1;i>=0;i--){
    const m=movers[i];
    m.x+=m.vx; m.y+=m.vy; m.vy+=(m.grav||0); m.life--;
    if(m.life<=0){ movers.splice(i,1); continue; }
    if(overlap(P,m) && P.inv<=0) kill();
  }
}
function drawMovers(cx,cy){
  movers.forEach(m=>{
    const sx=m.x-cx, sy=m.y-cy;
    ctx.globalAlpha = m.life < 20 ? m.life/20 : 1;
    ctx.fillStyle = m.col || '#5a4a30';
    ctx.fillRect(sx,sy,m.w,m.h);
    ctx.strokeStyle = m.border || '#8a7050';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx,sy,m.w,m.h);
    ctx.globalAlpha = 1;
  });
}

// ─── Player ───
const P = {
  x:0,y:0,w:28,h:40,vx:0,vy:0,ground:false,face:1,
  crawl:true, anim:0, animT:0, lightR:120, inv:0,
  slam:false, slamV:0,
  swing:false, sVine:null, sAng:0, sAngV:0, vineCool:0,
  coyoteT:0, jumpBuf:0,
  trail:[], wallSlide:false, canDJ:false, dblJump:false,
  squashX:1,squashY:1,squashT:0,
};

function resetP(x,y){
  Object.assign(P,{x,y,vx:0,vy:0,ground:false,slam:false,swing:false,vineCool:0,inv:30,trail:[],
    coyoteT:0,jumpBuf:0,wallSlide:false,canDJ:false,dblJump:false,squashX:1,squashY:1,squashT:0});
  P.crawl = chapter===1;
  P.dblJump = false;
}

function tickP(){
  const spd = P.crawl ? 2.2 : 3.8;
  const jf = chapter===1 ? -10.8 : chapter===2 ? -11.2 : -11.5;

  let mx=0;
  if(kl('ArrowLeft')||kl('KeyA')) mx=-1;
  if(kl('ArrowRight')||kl('KeyD')) mx=1;
  if(mx) P.face=mx>0?1:-1;

  // Invulnerability timer (must tick even during vine swing)
  if(P.inv>0) P.inv--;

  // ─── Vine swing ───
  if(P.swing && P.sVine){
    const v=P.sVine;
    const pendGrav = G / (v.len * 0.018);
    P.sAngV += -Math.sin(P.sAng) * pendGrav;
    P.sAngV += mx * 0.008;
    P.sAngV *= 0.992;
    P.sAng += P.sAngV;
    const maxAng = 1.3;
    if(P.sAng > maxAng){ P.sAng = maxAng; P.sAngV *= -0.2; }
    if(P.sAng < -maxAng){ P.sAng = -maxAng; P.sAngV *= -0.2; }
    P.x = v.x + Math.sin(P.sAng)*v.len - P.w/2;
    P.y = v.y + Math.cos(P.sAng)*v.len - P.h/2;
    P.vx = Math.cos(P.sAng)*v.len*P.sAngV;
    P.vy = -Math.sin(P.sAng)*v.len*P.sAngV;
    if(jp('Space')){
      P.swing=false; P.vineCool=25; P.vx*=2.5; P.vy=Math.min(P.vy,-9);
      sfxJump();
    }
    if(jp('ArrowDown')||jp('KeyS')){
      P.swing=false; P.vineCool=25; P.vy=3;
    }
    return;
  }

  const lv=lvl();

  // ─── Vine grab (must run BEFORE jump to consume ↑/W input) ───
  if(!P.ground && P.vineCool<=0 && (jp('ArrowUp')||jp('KeyW'))){
    if(lv && lv.vines){
      for(const v of lv.vines){
        if(!v.active) continue;
        const dx=(P.x+P.w/2)-v.x, dy=P.y-v.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<v.len*0.8 && d>v.len*0.25){
          P.swing=true; P.sVine=v; P.sAng=Math.atan2(dx,dy);
          P.sAngV=P.vx*0.006;
          P.jumpBuf=0; P.coyoteT=0; // cancel any pending jump
          sfxJump();
          return; // skip movement/gravity this frame
        }
      }
    }
  }

  // Horizontal
  P.vx += mx*(P.ground?0.9:0.55);
  P.vx *= FRIC;
  if(Math.abs(P.vx)<0.08) P.vx=0;

  // Coyote time
  if(P.ground) P.coyoteT=COYOTE; else if(P.coyoteT>0) P.coyoteT--;

  // Jump buffer
  if(jp('Space')||jp('KeyW')||jp('ArrowUp')) P.jumpBuf=JUMP_BUF;
  else if(P.jumpBuf>0) P.jumpBuf--;

  // Jump
  if(P.jumpBuf>0 && P.coyoteT>0){
    P.vy=jf; P.ground=false; P.coyoteT=0; P.jumpBuf=0;
    P.squashX=0.85; P.squashY=1.15; P.squashT=6;
    if(P.dblJump) P.canDJ=true;
    sfxJump();
    for(let i=0;i<6;i++) emit(P.x+P.w/2,P.y+P.h,{vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:18,sz:2,col:'#778899',windAff:.3});
  }

  // Double jump (ch3+)
  if(chapter>=3 && P.canDJ && !P.ground && (jp('Space')||jp('KeyW')||jp('ArrowUp')) && P.coyoteT<=0){
    P.vy = jf*0.8; P.canDJ=false; sfxJump();
    for(let i=0;i<8;i++) emit(P.x+P.w/2,P.y+P.h/2,{vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:20,sz:2.5,col:'#4caf7d',windAff:.2});
  }

  // Wall slide (ch2+)
  P.wallSlide=false;
  if(chapter>=2 && !P.ground && P.vy>0 && mx!==0){
    const lv=lvl(); if(lv){
      const testBox={x:P.x+mx*2,y:P.y,w:P.w,h:P.h};
      const plats=getPlats();
      for(const p of plats){
        if(overlap(testBox,p)){ P.wallSlide=true; P.vy=Math.min(P.vy,1.5); break; }
      }
    }
  }

  // Wall jump
  if(P.wallSlide && (jp('Space')||jp('KeyW')||jp('ArrowUp'))){
    P.vy=jf*0.85; P.vx=-P.face*6; P.face=-P.face; sfxJump();
    for(let i=0;i<5;i++) emit(P.x+(P.face>0?0:P.w),P.y+P.h/2,{vx:-P.face*2,vy:-Math.random()*2,life:15,sz:2,col:'#c04040',windAff:.2});
  }

  // Slam (ch2+)
  if(jp('KeyJ') && chapter>=2 && !P.ground && !P.slam){
    P.slam=true; P.slamV=16; P.vy=P.slamV; shakeT=8; shakeI=3; sfxSlam();
  }
  if(P.slam){ P.vy=P.slamV; P.vx*=0.2; }

  // ─── Water physics (ch4+) ───
  inWater = false;
  if(chapter>=4 && lv && lv.waters){
    for(const wz of lv.waters){
      if(P.x+P.w/2>wz.x && P.x+P.w/2<wz.x+wz.w && P.y+P.h/2>wz.y && P.y+P.h/2<wz.y+wz.h){
        inWater=true;
        P.vy *= 0.85; // water resistance
        P.vx *= 0.92;
        if(P.vy > 1.5) P.vy = 1.5; // slow fall in water
        if(jp('Space') && chapter>=4){
          P.vy = -6; // underwater jump (bubble burst)
          sfxJump();
          for(let i=0;i<8;i++) emit(P.x+P.w/2,P.y+P.h,{vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:20,sz:2,col:'#6040c0',windAff:.1});
        }
        if(gTime%5===0) emit(P.x+P.w/2+(Math.random()-.5)*8,P.y+P.h/2+(Math.random()-.5)*8,{vx:0,vy:-0.8,life:30,sz:1.5,col:'#6080c0',grav:-.01,windAff:0});
        break;
      }
    }
  }

  // ─── Echo pulse (ch4+) ───
  if(chapter>=4 && jp('KeyE') && echoT<=0 && !dlgA){
    echoT = 180; echoAng = 0;
    playTone(440,0.3,'sine',0.06);
    playTone(660,0.2,'sine',0.04);
  }
  if(echoT > 0){
    echoT--;
    echoAng = Math.min(1, echoAng + 0.04);
  }
  // ─── Seed placement (ch5) ───
  if(chapter>=5 && jp('KeyF')){
    const lv5=lvl();
    if(lv5 && lv5.starNodes){
      let placed=false;
      for(const node of lv5.starNodes){
        if(node.active) continue;
        const dx=(P.x+P.w/2)-node.x, dy=(P.y+P.h/2)-node.y;
        if(Math.sqrt(dx*dx+dy*dy)<50){
          node.active=true; lv5.seedCount++;
          updHUD();
          playTone(523,0.1,'sine',0.08);
          playTone(659,0.1,'sine',0.06);
          playTone(784,0.15,'sine',0.07);
          for(let i=0;i<12;i++) emit(node.x,node.y,{vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:40,sz:3,col:'#c8a84b',shape:'star'});
          placed=true; break;
        }
      }
    }
  }

  // Gravity
  if(!P.slam){
    if(inWater){
      P.vy += G * 0.3; // reduced gravity in water
    } else {
      P.vy += G;
    }
    if(P.vy > MAX_VY) P.vy = MAX_VY;
  }

  // Wind glide (ch3) - hold jump in air
  if(chapter>=3 && !P.ground && (kl('Space')||kl('KeyW')||kl('ArrowUp')) && P.vy>1){
    P.vy*=0.9; P.vx*=0.99;
    if(gTime%3===0) emit(P.x+P.w/2,P.y+P.h,{vx:(Math.random()-.5),vy:1,life:15,sz:1.5,col:'#4caf7d',windAff:.3});
  }

  // Move & Collide
  P.x+=P.vx; colX();
  P.y+=P.vy;
  const wasGround=P.ground;
  P.ground=false;
  colY();
  if(P.ground && !wasGround){
    sfxLand();
    P.squashX=1.15; P.squashY=0.85; P.squashT=8;
    for(let i=0;i<6;i++) emit(P.x+P.w/2,P.y+P.h,{vx:(Math.random()-.5)*2.5,vy:-Math.random()*1.5-.5,life:20,sz:2+Math.random(),col:'#778899',grav:.05});
  }

  // Squash/stretch decay
  if(P.squashT>0){ P.squashT--; P.squashX+=(1-P.squashX)*.25; P.squashY+=(1-P.squashY)*.25; }
  else { P.squashX=1; P.squashY=1; }

  // Footstep dust
  if(P.ground && Math.abs(P.vx)>1 && gTime%6===0){
    emit(P.x+(P.vx>0?2:P.w-2),P.y+P.h,{vx:-P.vx*.1+(Math.random()-.5)*.5,vy:-Math.random()*.5,life:12,sz:1.5,col:'#8899aa',grav:.03});
  }

  // Vine cooldown tick
  if(P.vineCool>0) P.vineCool--;

  // ─── Rune collect ───
  if(lv && lv.runes) lv.runes.forEach(r=>{
    if(r.got) return;
    if(Math.abs(P.x+P.w/2-r.x)<22 && Math.abs(P.y+P.h/2-r.y)<22){
      r.got=true; runes.push(r); sfxRune(); shakeT=4; shakeI=2;
      for(let i=0;i<10;i++) emit(r.x,r.y,{vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:35,sz:3,col:r.tp==='i'?'#c04040':'#a04080',shape:'star'});
      checkWords(); updHUD();
    }
  });

  // ─── Wind zones (ch3) ───
  if(lv && lv.winds) lv.winds.forEach(wz=>{
    if(P.x>wz.x&&P.x<wz.x+wz.w&&P.y>wz.y&&P.y<wz.y+wz.h){
      P.vy+=wz.force; P.vx+=wz.hforce||0;
      if(gTime%4===0) emit(P.x+P.w/2,P.y+P.h/2,{vx:(wz.hforce||0)*2,vy:wz.force*-2,life:12,sz:1.5,col:'#2a5a2a',windAff:.5});
    }
  });

  // ─── Hazards ───
  if(lv && lv.hazards) lv.hazards.forEach(h=>{ if(overlap(P,h)) kill(); });
  tickMovers();
  if(P.y>(lv?lv.h:2000)+100) kill();

  // ─── Exit ───
  if(lv && lv.exit && overlap(P,{x:lv.exit.x,y:lv.exit.y,w:36,h:56})){
    sfxExit(); nextChap();
  }

  // Anim
  P.animT++; if(P.animT>7){P.animT=0;P.anim=(P.anim+1)%4;}

  // Trail
  P.trail.push({x:P.x+P.w/2,y:P.y+P.h/2,l:12});
  if(P.trail.length>16) P.trail.shift();
  P.trail.forEach(t=>t.l--);
  P.trail=P.trail.filter(t=>t.l>0);

  // Ambient (enhanced)
  if(Math.random()<.2){
    const pal=PAL[chapter];
    emit(P.x+P.w/2+(Math.random()-.5)*80,P.y+P.h/2+(Math.random()-.5)*60,{
      vx:(Math.random()-.5)*.4+windX*.2,vy:-Math.random()*.6-.2,life:30+Math.random()*30,sz:.8+Math.random()*1.5,
      col:pal.glow,grav:-0.01,windAff:.5,shape:Math.random()<.3?'line':'circle'});
  }
  // Foreground bokeh particles
  if(Math.random()<.06){
    const pal=PAL[chapter];
    emit(P.x+P.w/2+(Math.random()-.5)*W*.8,P.y+P.h/2+(Math.random()-.5)*H*.6,{
      vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,life:60+Math.random()*40,sz:3+Math.random()*4,
      col:pal.warm,grav:0,windAff:1,fg:true,shrink:false});
  }
}

function kill(){
  if(P.inv>0) return;
  state='dead'; deaths++; sfxDeath(); shakeT=12; shakeI=5;
  for(let i=0;i<18;i++) emit(P.x+P.w/2,P.y+P.h/2,{vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:35,sz:2+Math.random()*3,col:'#c8a84b',shape:Math.random()<.3?'line':'circle'});
  const ds=document.getElementById('death-screen');
  ds.querySelector('.sub').textContent=`第 ${deaths} 次坠落`;
  ds.style.display='flex';
}

// ─── Collision ───
function getPlats(){
  const lv=lvl(); if(!lv) return [];
  let r=[...lv.platforms];
  if(lv.rp) lv.rp.forEach(rp=>{ if(rp.mat) r.push(rp); });
  if(lv.brk) lv.brk.forEach(b=>{ if(!b.broke) r.push(b); });
  if(lv.floaters) lv.floaters.forEach(f=>r.push(f));
  if(lv.seeds) lv.seeds.forEach(s=>{ if(s.placed) r.push({x:s.x-20,y:s.y-20,w:40,h:40}); });
  return r;
}
function colX(){
  for(const p of getPlats()){
    if(overlap(P,p)){
      if(P.vx>0) P.x=p.x-P.w; else if(P.vx<0) P.x=p.x+p.w;
      P.vx=0;
    }
  }
}
function colY(){
  for(const p of getPlats()){
    if(overlap(P,p)){
      if(P.vy>0){
        P.y=p.y-P.h; P.vy=0; P.ground=true;
        if(P.slam){
          P.slam=false; shakeT=10; shakeI=4; sfxSlam();
          const lv=lvl();
          if(lv&&lv.brk) lv.brk.forEach(b=>{
            if(!b.broke&&Math.abs((P.x+P.w/2)-(b.x+b.w/2))<55&&Math.abs(P.y+P.h-b.y)<8){
              b.broke=true;
              for(let i=0;i<8;i++) emit(b.x+b.w/2,b.y+b.h/2,{vx:(Math.random()-.5)*5,vy:-Math.random()*4,life:28,sz:3+Math.random()*3,col:'#6a5030'});
            }
          });
          for(let i=0;i<8;i++) emit(P.x+P.w/2,P.y+P.h,{vx:(Math.random()-.5)*5,vy:-Math.random()*3-1,life:22,sz:2+Math.random()*2,col:'#c04040'});
        }
      } else if(P.vy<0){ P.y=p.y+p.h; P.vy=0; }
    }
  }
}
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function lvl(){ return levels[chapter]; }

// ─── Rune System ───
let runes=[], actWord=null;
const WORDS={
  '生':{i:'sh',f:'eng',pid:'rp1'}, '存':{i:'c',f:'un',pid:'rp2'},
  '光':{i:'g',f:'uang',pid:'rp3'}, '路':{i:'l',f:'u',pid:'rp4'},
};
function checkWords(){
  const lv=lvl(); if(!lv||!lv.rp) return;
  for(const[w,d] of Object.entries(WORDS)){
    const hi=runes.some(r=>r.tp==='i'&&r.val===d.i);
    const hf=runes.some(r=>r.tp==='f'&&r.val===d.f);
    if(hi&&hf) lv.rp.forEach(rp=>{
      if(rp.pid===d.pid&&!rp.mat){
        rp.mat=true; actWord=w; sfxRuneWord(); shakeT=6; shakeI=2;
        for(let i=0;i<15;i++) emit(rp.x+rp.w/2,rp.y+rp.h/2,{vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:45,sz:3+Math.random()*3,col:'#e8d08a',shape:'star'});
        showDlg('远古之语',`「${w}」— 虚幻通路凝结为实体！`);
      }
    });
  }
}
function updHUD(){
  const rd=document.getElementById('hud').querySelector('.runes');
  const td=document.getElementById('hud').querySelector('.word-target');
  const ab=document.getElementById('hud').querySelector('.ability');
  rd.innerHTML='';
  runes.forEach(r=>{ const d=document.createElement('div'); d.className='rune active'; d.textContent=r.disp; rd.appendChild(d); });
  if(chapter===2) td.textContent='拼读：生(sh+eng) · 存(c+un) · 光(g+uang) · 路(l+u)';
  else td.textContent='';
  const abs=['跳跃'];
  if(chapter>=2) abs.push('下砸[J]','墙跳');
  if(chapter>=3) abs.push('滑翔','二段跳');
  if(chapter>=4) abs.push('回声定位[E]');
  if(chapter>=5) abs.push('秩序之种[F]','光径传送');
  ab.textContent='能力：'+abs.join(' / ');
}

// ─── Shadow ───
const SH={x:0,y:0,w:28,h:40,active:false,rec:[],hitT:0,op:0,wisps:[]};
function tickShadow(){
  if(chapter<3||!SH.active) return;
  // Ch4: if player is in water and stationary, shadow can't track
  if(chapter===4 && inWater && Math.abs(P.vx)<0.3 && Math.abs(P.vy)<0.3){
    SH.op=Math.max(0,SH.op-.02);
    return;
  }
  // Ch5: reconciliation mode - shadow doesn't damage
  if(chapter>=5){
    SH.op=Math.min(1,SH.op+.008);
    const dx=(P.x+P.w/2)-(SH.x+SH.w/2), dy=(P.y+P.h/2)-(SH.y+SH.h/2);
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<60 && SH.hitT<=0){
      SH.hitT=300;
      showDlg('阴影','……你……不害怕我吗？');
      setTimeout(()=>showDlg('内心','你不是我的敌人。你是我曾经最害怕的那部分自己。'),2000);
      setTimeout(()=>showDlg('阴影','……我好累……我想停下来……'),4000);
      setTimeout(()=>showDlg('星火','那就在光中休息吧。我们不需要消灭黑暗——只需要学会与它共处。'),6000);
      // Spawn warm memory particles
      for(let i=0;i<20;i++) emit(SH.x+SH.w/2,SH.y+SH.h/2,{vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:50,sz:3,col:'#e8d08a',shape:'star'});
    }
    if(gTime%2===0) SH.rec.push({x:P.x,y:P.y});
    if(SH.rec.length>150) SH.rec.shift();
    if(SH.rec.length>15){ const t=SH.rec.shift(); SH.x+=(t.x-SH.x)*.05; SH.y+=(t.y-SH.y)*.05; }
    return;
  }
  if(gTime%2===0) SH.rec.push({x:P.x,y:P.y});
  if(SH.rec.length>150) SH.rec.shift();
  if(SH.rec.length>15){ const t=SH.rec.shift(); SH.x+=(t.x-SH.x)*.05; SH.y+=(t.y-SH.y)*.05; }
  SH.op=Math.min(1,SH.op+.008);
  if(SH.hitT>0) SH.hitT--;
  if(SH.hitT<=0 && overlap(P,SH)){
    SH.hitT=80; P.vx+=(P.x<SH.x?-6:6); P.vy=-5; shakeT=8; shakeI=3; sfxHurt();
    for(let i=0;i<6;i++) emit(P.x+P.w/2,P.y+P.h/2,{vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:25,sz:3,col:'#4040a0'});
    showDlg('阴影','...你跑不掉的...');
  }
  // Emit shadow wisps
  if(gTime%3===0){
    SH.wisps.push({x:SH.x+SH.w/2+(Math.random()-.5)*10,y:SH.y+SH.h*.5+(Math.random()-.5)*8,
      vx:(Math.random()-.5)*.5,vy:-Math.random()*.3-.2,life:40,ml:40,sz:3+Math.random()*4});
  }
  for(let i=SH.wisps.length-1;i>=0;i--){
    const w=SH.wisps[i]; w.x+=w.vx; w.y+=w.vy; w.vy-=.01;
    if(--w.life<=0) SH.wisps.splice(i,1);
  }
  if(SH.wisps.length>50) SH.wisps.splice(0,SH.wisps.length-50);
}
function drawSH(cx,cy){
  if(!SH.active||SH.op<=0) return;
  const shcx=SH.x-cx+SH.w/2, shcy=SH.y-cy+SH.h/2;
  // Shadow wisps
  ctx.save(); ctx.globalCompositeOperation='lighter';
  SH.wisps.forEach(w=>{
    const a=w.life/w.ml;
    ctx.globalAlpha=a*SH.op*.2; ctx.fillStyle='#4040a0';
    ctx.beginPath(); ctx.arc(w.x-cx,w.y-cy,w.sz*a,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
  // Pulsing aura
  const pulse=Math.sin(gTime*.04)*.15+.85;
  ctx.save(); ctx.globalAlpha=SH.op*.08*pulse;
  const ag2=ctx.createRadialGradient(shcx,shcy,5,shcx,shcy,60);
  ag2.addColorStop(0,'#3030a0'); ag2.addColorStop(.5,'#202050'); ag2.addColorStop(1,'transparent');
  ctx.fillStyle=ag2; ctx.fillRect(shcx-60,shcy-60,120,120); ctx.restore();
  ctx.save(); ctx.globalAlpha=SH.op*.15*pulse;
  const ag1=ctx.createRadialGradient(shcx,shcy,3,shcx,shcy,30);
  ag1.addColorStop(0,'#5050b0'); ag1.addColorStop(1,'transparent');
  ctx.fillStyle=ag1; ctx.fillRect(shcx-30,shcy-30,60,60); ctx.restore();
  // Body
  ctx.globalAlpha=SH.op*.6;
  ctx.fillStyle='#12122a';
  ctx.beginPath(); ctx.ellipse(shcx,SH.y-cy+SH.h*.65,SH.w/2+Math.sin(gTime*.06)*1.5,SH.h*.35,0,0,Math.PI*2); ctx.fill();
  // Head
  ctx.fillStyle='#1a1a3a';
  ctx.beginPath(); ctx.ellipse(shcx,SH.y-cy+SH.h*.2,SH.w*.35+Math.sin(gTime*.08),8,0,0,Math.PI*2); ctx.fill();
  // Glowing eyes
  ctx.save(); ctx.globalAlpha=SH.op*.9;
  ctx.shadowColor='#8080ff'; ctx.shadowBlur=8; ctx.fillStyle='#8080ff';
  ctx.fillRect(SH.x-cx+4,SH.y-cy+6,2.5,2);
  ctx.fillRect(SH.x-cx+11,SH.y-cy+6,2.5,2);
  ctx.shadowBlur=0; ctx.restore();
  ctx.globalAlpha=1;
}

let dlgQ=[], dlgA=false;
function showDlg(s,t){ dlgQ.push({s,t}); if(!dlgA) advDlg(); }
function advDlg(){
  if(!dlgQ.length){ dlgA=false; document.getElementById('dialog').style.display='none'; return; }
  dlgA=true; const d=dlgQ.shift();
  const el=document.getElementById('dialog');
  el.querySelector('.speaker').textContent=d.s;
  el.querySelector('.text').textContent=d.t;
  el.style.display='block';
}

function startChap(ch){
  chapter=ch; const lv=levels[ch]; if(!lv) return;
  lv.init(); runes=[]; actWord=null;
  resetP(lv.sx,lv.sy); checkpoint={x:lv.sx,y:lv.sy};
  cam.x=P.x-W/2; cam.y=P.y-H/2;
  parts.length=0; movers.length=0;
  updHUD();
  document.getElementById('hud').querySelector('.chapter').textContent=`第${ch}章 · ${lv.name}`;
  document.getElementById('hud').querySelector('.death-count').textContent=deaths>0?`坠落 ${deaths} 次`:'';
  showChapTrans(ch,lv.name,lv.sub);
}

function showChapTrans(n,name,sub){
  const el=document.getElementById('chapter-transition');
  el.querySelector('.ch-num').textContent=`CHAPTER ${n}`;
  el.querySelector('.ch-name').textContent=name;
  el.querySelector('.ch-sub').textContent=sub;
  el.style.display='flex'; el.style.opacity='1'; state='transition';
  setTimeout(()=>{
    el.style.opacity='0';
    setTimeout(()=>{
      el.style.display='none'; state='playing';
      if(n===1) setTimeout(()=>showDlg('内心','好冷...好暗...我必须爬出去...'),500);
      else if(n===2) setTimeout(()=>showDlg('远古回声','那些符文...读懂它们，通路就会显现...'),500);
      else if(n===3) setTimeout(()=>showDlg('？','......你跑不掉的......'),800);
      else if(n===4) setTimeout(()=>showDlg('星火','这水下...太暗了。用回声定位[E]来探路吧。'),500);
      else if(n===5) setTimeout(()=>showDlg('星火','最后的旅途。在星力节点按[F]放置种子，光会指引你。'),500);
    },1000);
  },2200);
}

function nextChap(){
  const n=chapter+1;
  if(levels[n]) startChap(n);
  else {
    showDlg('星火','伤痕不会消失...但它们化为了照亮前路的光。');
    setTimeout(()=>showDlg('星火','你不需要成为光之王。你只需要学会与自己的黑暗共处。'),3000);
    setTimeout(()=>showDlg('星火','——独自坚强，不是独自承受。而是在废墟中，从未熄灭的那点生命尊严。'),6000);
    setTimeout(()=>{
      state='title';
      document.getElementById('title-screen').style.display='flex';
      document.getElementById('title-screen').style.opacity='1';
      deaths=0;
    },9000);
  }
}

function drawBG(){
  const lv=lvl(); if(!lv) return;
  // Sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lv.bg1); g.addColorStop(1,lv.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Stars with glow
  ctx.save();
  const pal=PAL[chapter];
  ctx.shadowColor=pal.starCol; ctx.shadowBlur=6;
  for(let i=0;i<60;i++){
    const sx=(i*151+40)%W, sy=(i*89+20)%(H*.45), ss=.8+(i%4)*.3;
    ctx.globalAlpha=(Math.sin(gTime*.025+i)*.25+.6)*.5;
    ctx.fillStyle=pal.starCol;
    ctx.beginPath(); ctx.arc(sx,sy,ss,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.restore();

  // Moon (ch1 only)
  if(chapter===1){
    const mx=W*.75-cam.x*.03, my=H*.15;
    ctx.save(); ctx.shadowColor='#aaccff'; ctx.shadowBlur=40; ctx.globalAlpha=.7;
    const mg=ctx.createRadialGradient(mx,my,0,mx,my,30);
    mg.addColorStop(0,'#ddeeff'); mg.addColorStop(.6,'#8899bb'); mg.addColorStop(1,'transparent');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,30,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=80; ctx.globalAlpha=.15;
    ctx.beginPath(); ctx.arc(mx,my,50,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Far parallax silhouettes (bezier curves)
  const farCol=chapter===1?'#0b0c12':chapter===2?'#120808':'#081008';
  ctx.fillStyle=farCol;
  for(let i=0;i<10;i++){
    const bx=i*400-((cam.x*.06)%400), bh=160+Math.sin(i*1.8)*70;
    ctx.beginPath(); ctx.moveTo(bx-20,H);
    const c1y=H-bh-20+hash(i*7)*40, c2y=H-bh+15+hash(i*7+1)*30, c3y=H-bh-10+hash(i*7+2)*50;
    ctx.bezierCurveTo(bx+60,c1y,bx+160,c2y,bx+200,H-bh+30);
    ctx.bezierCurveTo(bx+260,c3y,bx+340,H-bh+10,bx+420,H);
    ctx.fill();
  }

  // Mid parallax silhouettes (bezier curves)
  ctx.fillStyle=lv.pc;
  for(let i=0;i<14;i++){
    const bx=i*300-((cam.x*.15)%300), bh=100+Math.sin(i*2.5)*40;
    ctx.beginPath(); ctx.moveTo(bx-10,H);
    const w1=hash(i*13)*30-15, w2=hash(i*13+1)*25-12;
    ctx.bezierCurveTo(bx+40,H-bh-10+w1,bx+100,H-bh+20+w2,bx+150,H-bh+10);
    ctx.bezierCurveTo(bx+200,H-bh+25+w1*.5,bx+260,H-bh-5,bx+310,H);
    ctx.fill();
  }

  // Fog layers
  for(let fi=0;fi<2;fi++){
    const depth=fi===0?.10:.22;
    const fogA=.04+Math.sin(gTime*.008+fi*2)*.02;
    const drift=Math.sin(gTime*.005+fi*1.5)*60;
    ctx.globalAlpha=fogA; ctx.fillStyle=pal.fog;
    for(let i=0;i<3;i++){
      const fy=H*(.3+i*.2)+Math.sin(gTime*.006+i)*20;
      const fx=-100+drift+i*200-((cam.x*depth)%600);
      ctx.fillRect(fx,fy,W+300,80+i*30);
    }
  }
  ctx.globalAlpha=1;

  // Ambient floating spores (additive)
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<25;i++){
    const ax=(i*237+gTime*.3*(.5+hash(i)*.5))%(W+100)-50;
    const ay=(i*181+Math.sin(gTime*.01+i)*40)%H;
    const asz=1+hash(i*3)*1.5;
    ctx.globalAlpha=.15+Math.sin(gTime*.03+i*.7)*.1;
    ctx.fillStyle=pal.glow;
    ctx.beginPath(); ctx.arc(ax,ay,asz,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPlats(){
  const lv=lvl(); if(!lv) return;
  const cx=cam.x, cy=cam.y, pal=PAL[chapter];
  // Platforms with irregular edges + rim light + texture
  ctx.fillStyle=lv.pc; ctx.strokeStyle=lv.pb; ctx.lineWidth=1;
  lv.platforms.forEach((p,idx)=>{
    const sx=p.x-cx,sy=p.y-cy;
    if(sx+p.w<-50||sx>W+50||sy+p.h<-50||sy>H+50) return;
    // Irregular shape (visual only)
    const wb=(c,a)=>(hash(idx*100+c*10+a)-.5)*3;
    ctx.beginPath();
    ctx.moveTo(sx+wb(0,0),sy+wb(0,1));
    ctx.lineTo(sx+p.w+wb(1,0),sy+wb(1,1));
    ctx.lineTo(sx+p.w+wb(2,0),sy+p.h+wb(2,1));
    ctx.lineTo(sx+wb(3,0),sy+p.h+wb(3,1));
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Surface texture lines
    if(p.w>40){
      ctx.save(); ctx.globalAlpha=.08; ctx.strokeStyle=lv.pb; ctx.lineWidth=.5;
      const lc=Math.floor(p.w/25);
      for(let li=0;li<lc;li++){
        const lx=sx+8+hash(idx*100+li*7)*(p.w-16);
        const ly=sy+3+hash(idx*100+li*7+1)*(p.h-6);
        const lw=6+hash(idx*100+li*7+2)*12;
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+lw,ly+(hash(idx*100+li*7+3)-.5)*2); ctx.stroke();
      }
      ctx.restore();
    }
    // Rim light on top edge
    ctx.save(); ctx.globalAlpha=.25+Math.sin(gTime*.02)*.05;
    ctx.strokeStyle=pal.rimLight; ctx.lineWidth=1;
    ctx.shadowColor=pal.glow; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.moveTo(sx+1,sy+1); ctx.lineTo(sx+p.w-1,sy+1); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    // Grass tufts on wide thin platforms
    if(p.w>50 && p.h<30){
      ctx.save(); ctx.fillStyle=chapter===1?'#1a2a20':chapter===2?'#2a1a10':'#1a3a15'; ctx.globalAlpha=.5;
      const tufts=Math.floor(p.w/20);
      for(let ti=0;ti<tufts;ti++){
        const tx=sx+6+hash(idx*200+ti)*(p.w-12);
        const th=3+hash(idx*200+ti+50)*4;
        const sway=Math.sin(gTime*.03+tx*.1)*1.5;
        for(let bi=0;bi<3;bi++){
          ctx.beginPath(); ctx.moveTo(tx+bi*2,sy);
          ctx.quadraticCurveTo(tx+bi*2+sway,sy-th*.6,tx+bi*2+sway*1.5,sy-th);
          ctx.lineWidth=.8; ctx.strokeStyle=ctx.fillStyle; ctx.stroke();
        }
      }
      ctx.restore();
    }
  });
  // Breakables (enhanced)
  if(lv.brk) lv.brk.forEach((b,bi)=>{
    if(b.broke) return;
    const sx=b.x-cx,sy=b.y-cy;
    ctx.fillStyle='#2a1e10'; ctx.strokeStyle='#5a4020';
    ctx.fillRect(sx,sy,b.w,b.h); ctx.strokeRect(sx,sy,b.w,b.h);
    ctx.strokeStyle='#4a3018'; ctx.lineWidth=.8; ctx.beginPath();
    ctx.moveTo(sx+b.w*.3,sy); ctx.lineTo(sx+b.w*.45,sy+b.h*.4); ctx.lineTo(sx+b.w*.5,sy+b.h);
    ctx.moveTo(sx+b.w*.7,sy); ctx.lineTo(sx+b.w*.55,sy+b.h*.6); ctx.lineTo(sx+b.w*.6,sy+b.h);
    ctx.moveTo(sx+b.w*.2,sy+b.h*.5); ctx.lineTo(sx+b.w*.8,sy+b.h*.45);
    ctx.stroke();
    ctx.fillStyle='#3a2a10'; ctx.globalAlpha=.4;
    for(let ri=0;ri<3;ri++){const rx=sx+b.w*.3+hash(bi*100+ri)*b.w*.4;ctx.fillRect(rx,sy+b.h,3,2);}
    ctx.globalAlpha=1;
  });
  // Rune ghost platforms
  if(lv.rp) lv.rp.forEach(rp=>{
    const sx=rp.x-cx,sy=rp.y-cy;
    if(rp.mat){
      ctx.fillStyle='#302810'; ctx.strokeStyle='#c8a84b'; ctx.lineWidth=2;
      ctx.fillRect(sx,sy,rp.w,rp.h); ctx.strokeRect(sx,sy,rp.w,rp.h);
      ctx.globalAlpha=.12+Math.sin(gTime*.05)*.04; ctx.fillStyle='#c8a84b';
      ctx.fillRect(sx-2,sy-2,rp.w+4,rp.h+4); ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=.18+Math.sin(gTime*.03+rp.x*.01)*.08;
      ctx.fillStyle='#3a3050'; ctx.fillRect(sx,sy,rp.w,rp.h);
      ctx.setLineDash([4,4]); ctx.strokeStyle='#5a5080'; ctx.lineWidth=1;
      ctx.strokeRect(sx,sy,rp.w,rp.h); ctx.setLineDash([]);
      ctx.globalAlpha=.4; ctx.fillStyle='#8a80a0'; ctx.font='10px sans-serif'; ctx.textAlign='center';
      const wordForRp=Object.entries(WORDS).find(([k,v])=>v.pid===rp.pid);
      if(wordForRp) ctx.fillText(wordForRp[0],sx+rp.w/2,sy+rp.h/2+3);
      ctx.globalAlpha=1;
    }
  });
  // Spikes with glowing tips
  if(lv.hazards) lv.hazards.forEach(h=>{
    const sx=h.x-cx,sy=h.y-cy;
    ctx.fillStyle='#401010'; ctx.strokeStyle='#802020'; ctx.lineWidth=1;
    const sw=14, count=Math.floor(h.w/sw);
    for(let i=0;i<count;i++){
      ctx.beginPath(); ctx.moveTo(sx+i*sw,sy+h.h);
      ctx.lineTo(sx+i*sw+sw/2,sy); ctx.lineTo(sx+(i+1)*sw,sy+h.h); ctx.fill(); ctx.stroke();
    }
    ctx.save(); ctx.globalAlpha=.4+Math.sin(gTime*.06)*.15;
    ctx.shadowColor='#ff3030'; ctx.shadowBlur=5; ctx.fillStyle='#ff4040';
    for(let i=0;i<count;i++){ctx.beginPath();ctx.arc(sx+i*sw+sw/2,sy+2,1.5,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0; ctx.restore();
  });
}

function drawVines(){
  const lv=lvl(); if(!lv||!lv.vines) return;
  const cx=cam.x,cy=cam.y;
  lv.vines.forEach((v,vi)=>{
    const sx=v.x-cx,sy=v.y-cy;
    // When player is swinging on this vine, endpoint follows player
    const isGrabbed = P.swing && P.sVine === v;
    let endX, endY, cpX, cpY;
    const sway=Math.sin(gTime*.018+v.x)*.06;
    if(isGrabbed){
      endX = P.x+P.w/2-cx;
      endY = P.y+P.h/2-cy;
      cpX = sx+(endX-sx)*.5;
      cpY = sy+(endY-sy)*.5;
    } else {
      endX=sx+Math.sin(sway)*v.len*.2;
      endY=sy+v.len;
      cpX=sx+Math.sin(sway)*v.len*.5;
      cpY=sy+v.len*.5;
    }
    // Glow aura
    ctx.save(); ctx.globalAlpha=.06+Math.sin(gTime*.03+vi)*.02;
    ctx.shadowColor='#3a8a3a'; ctx.shadowBlur=12; ctx.strokeStyle='#2a6a20'; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(cpX,cpY,endX,endY); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    // Main strand
    ctx.strokeStyle='#2a4a20'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(cpX,cpY,endX,endY); ctx.stroke();
    // Secondary strand
    ctx.strokeStyle='#1a3a15'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+2,sy); ctx.quadraticCurveTo(cpX+3,cpY-2,endX+1,endY); ctx.stroke();
    // Third strand
    ctx.strokeStyle='#3a5a28'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx-1,sy+2); ctx.quadraticCurveTo(cpX-2,cpY+3,endX-1,endY); ctx.stroke();
    // Bioluminescent dots
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let di=0;di<5;di++){
      const t=.15+di*.17;
      const dx=(1-t)*(1-t)*sx+2*(1-t)*t*cpX+t*t*endX;
      const dy=(1-t)*(1-t)*sy+2*(1-t)*t*cpY+t*t*endY;
      const pulse=Math.sin(gTime*.05+di*1.3)*.3+.7;
      ctx.globalAlpha=.3*pulse; ctx.fillStyle='#6aff6a';
      ctx.shadowColor='#40ff40'; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(dx,dy,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0; ctx.restore();
    // Leaves with rotation
    ctx.fillStyle='#1a3a15';
    for(let i=0;i<3;i++){
      const t=.3+i*.22;
      const ly=(1-t)*(1-t)*sy+2*(1-t)*t*cpY+t*t*endY;
      const lx=(1-t)*(1-t)*sx+2*(1-t)*t*cpX+t*t*endX;
      const side=i%2===0?1:-1;
      const leafAng=sway+side*.4+Math.sin(gTime*.025+i)*.15;
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(leafAng);
      ctx.beginPath(); ctx.ellipse(5*side,0,6,2.5,side*.3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#2a5a20'; ctx.lineWidth=.5;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(8*side,0); ctx.stroke();
      ctx.restore();
    }
    // Anchor
    ctx.fillStyle='#3a2a15'; ctx.fillRect(sx-5,sy-4,10,7);
  });
}

function drawWinds(){
  const lv=lvl(); if(!lv||!lv.winds) return;
  const cx=cam.x,cy=cam.y;
  lv.winds.forEach(wz=>{
    const sx=wz.x-cx,sy=wz.y-cy;
    ctx.globalAlpha=.06+Math.sin(gTime*.04)*.02;
    ctx.fillStyle='#2a5a2a'; ctx.fillRect(sx,sy,wz.w,wz.h);
    ctx.globalAlpha=.15; ctx.strokeStyle='#3a7a3a'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const lx=sx+20+i*(wz.w-40)/4, ly=sy+wz.h-((gTime*2+i*40)%wz.h);
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly-20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx-4,ly-16); ctx.lineTo(lx,ly-22); ctx.lineTo(lx+4,ly-16); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
}
function drawWaters(){
  const lv=lvl(); if(!lv||!lv.waters) return;
  const cx=cam.x,cy=cam.y;
  lv.waters.forEach(wz=>{
    const sx=wz.x-cx,sy=wz.y-cy;
    // Water body
    const wg=ctx.createLinearGradient(sx,sy,sx,sy+wz.h);
    wg.addColorStop(0,'rgba(40,30,100,0.35)');
    wg.addColorStop(0.5,'rgba(30,20,80,0.5)');
    wg.addColorStop(1,'rgba(20,10,60,0.7)');
    ctx.fillStyle=wg; ctx.fillRect(sx,sy,wz.w,wz.h);
    // Surface wave
    ctx.save(); ctx.globalAlpha=.5; ctx.strokeStyle='#6060c0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,sy);
    for(let i=0;i<=wz.w;i+=8){
      ctx.lineTo(sx+i, sy+Math.sin(gTime*.04+i*.06)*4);
    }
    ctx.stroke(); ctx.restore();
    // Underwater particles
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const bx=sx+((gTime*.3+i*70)%wz.w);
      const by=sy+((gTime*.2+i*50)%wz.h);
      ctx.globalAlpha=.15+Math.sin(gTime*.03+i)*.08;
      ctx.fillStyle='#6060c0';
      ctx.beginPath(); ctx.arc(bx,by,1+Math.sin(gTime*.05+i)*0.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  });
}
function drawEcho(){
  if(echoT<=0||chapter<4) return;
  const cx=cam.x,cy=cam.y;
  const px=P.x+P.w/2-cx, py=P.y+P.h/2-cy;
  const maxR=200;
  const r=maxR*echoAng;
  const alpha=Math.max(0, (1-echoAng)*0.3);
  // Echo ring
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=alpha; ctx.strokeStyle='#6040c0'; ctx.lineWidth=2;
  ctx.shadowColor='#8060ff'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.stroke();
  // Inner glow
  ctx.globalAlpha=alpha*0.15;
  const eg=ctx.createRadialGradient(px,py,r*0.3,px,py,r);
  eg.addColorStop(0,'#8060ff'); eg.addColorStop(1,'transparent');
  ctx.fillStyle=eg; ctx.fillRect(px-r,py-r,r*2,r*2);
  ctx.restore();
  // Highlight nearby platforms within echo range
  const lv=lvl();
  if(lv){
    const allPlats=getPlats();
    allPlats.forEach(p=>{
      const dx=(p.x+p.w/2)-(P.x+P.w/2), dy=(p.y+p.h/2)-(P.y+P.h/2);
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<r){
        const pa=alpha*2*(1-d/r);
        const sx=p.x-cx,sy=p.y-cy;
        ctx.save(); ctx.globalAlpha=pa; ctx.strokeStyle='#8060ff'; ctx.lineWidth=1.5;
        ctx.shadowColor='#8060ff'; ctx.shadowBlur=6;
        ctx.strokeRect(sx,sy,p.w,p.h);
        ctx.restore();
      }
    });
  }
}

function drawRunes(){
  const lv=lvl(); if(!lv||!lv.runes) return;
  const cx=cam.x,cy=cam.y;
  // Connecting trails between rune pairs
  ctx.save(); ctx.globalCompositeOperation='lighter';
  lv.runes.forEach(r1=>{
    if(r1.got) return;
    lv.runes.forEach(r2=>{
      if(r2.got||r1===r2) return;
      const w1=Object.entries(WORDS).find(([k,v])=>(r1.tp==='i'&&v.i===r1.val)||(r1.tp==='f'&&v.f===r1.val));
      const w2=Object.entries(WORDS).find(([k,v])=>(r2.tp==='i'&&v.i===r2.val)||(r2.tp==='f'&&v.f===r2.val));
      if(w1&&w2&&w1[0]===w2[0]&&r1.tp!==r2.tp&&r1.val<r2.val){
        ctx.globalAlpha=Math.sin(gTime*.04)*.15+.2;
        ctx.strokeStyle=r1.tp==='i'?'#c04040':'#a04080'; ctx.lineWidth=1;
        ctx.setLineDash([3,6]); ctx.lineDashOffset=-gTime*.5;
        ctx.beginPath(); ctx.moveTo(r1.x-cx,r1.y-cy); ctx.lineTo(r2.x-cx,r2.y-cy); ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  });
  ctx.restore();
  // Runes
  lv.runes.forEach((r,ri)=>{
    if(r.got) return;
    const sx=r.x-cx,sy=r.y-cy;
    const bob=Math.sin(gTime*.04+r.x*.08)*5;
    const baseCol=r.tp==='i'?'#c04040':'#a04080';
    // Multi-layer glow
    for(let gi=0;gi<3;gi++){
      const gr=18+gi*12, ga=[.3,.15,.06][gi];
      ctx.globalAlpha=ga+Math.sin(gTime*.055+ri+gi)*.05;
      const gg=ctx.createRadialGradient(sx,sy+bob,2,sx,sy+bob,gr);
      gg.addColorStop(0,baseCol); gg.addColorStop(1,'transparent');
      ctx.fillStyle=gg; ctx.fillRect(sx-gr,sy+bob-gr,gr*2,gr*2);
    }
    ctx.globalAlpha=1;
    // Rotating magic rays
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.2+Math.sin(gTime*.06)*.1; ctx.strokeStyle=baseCol; ctx.lineWidth=1;
    for(let ri2=0;ri2<6;ri2++){
      const ang=(ri2/6)*Math.PI*2+gTime*.02;
      const rLen=14+Math.sin(gTime*.08+ri2*1.1)*4;
      ctx.beginPath();
      ctx.moveTo(sx+Math.cos(ang)*10,sy+bob+Math.sin(ang)*10);
      ctx.lineTo(sx+Math.cos(ang)*rLen,sy+bob+Math.sin(ang)*rLen);
      ctx.stroke();
    }
    ctx.restore();
    // Circle body with glow
    ctx.fillStyle=r.tp==='i'?'#351010':'#251025'; ctx.strokeStyle=baseCol; ctx.lineWidth=1.5;
    ctx.save(); ctx.shadowColor=baseCol; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(sx,sy+bob,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    // Text
    ctx.fillStyle=r.tp==='i'?'#e06060':'#c060a0';
    ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(r.disp,sx,sy+bob);
    // Enhanced sparkle particles
    if(Math.random()<.12){
      const ang=Math.random()*Math.PI*2;
      emit(r.x+Math.cos(ang)*14,r.y+bob+Math.sin(ang)*14,{
        vx:Math.cos(ang)*.3,vy:Math.sin(ang)*.3-.2,life:20,sz:1,col:baseCol,grav:-.015,
        shape:Math.random()<.3?'star':'circle',windAff:.2});
    }
  });
}

function drawExit(){
  const lv=lvl(); if(!lv||!lv.exit) return;
  const cx=cam.x,cy=cam.y;
  const sx=lv.exit.x-cx,sy=lv.exit.y-cy;
  const pcx=sx+18,pcy=sy+28;
  const pulse=Math.sin(gTime*.045)*.2+.8;
  const pal=PAL[chapter], ec=pal.glow, ecW=pal.warm;
  ctx.save(); ctx.globalAlpha=.15*pulse;
  const pg=ctx.createRadialGradient(pcx,pcy,4,pcx,pcy,70);
  pg.addColorStop(0,ecW); pg.addColorStop(.5,ec); pg.addColorStop(1,'transparent');
  ctx.fillStyle=pg; ctx.fillRect(pcx-70,pcy-70,140,140); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let ri=0;ri<3;ri++){
    const rSize=10+ri*6, rotSpd=.03+ri*.01;
    ctx.globalAlpha=(.15-ri*.03)*pulse; ctx.strokeStyle=ec; ctx.lineWidth=1; ctx.beginPath();
    for(let seg=0;seg<4;seg++){
      const startAng=gTime*rotSpd*(ri%2===0?1:-1)+seg*Math.PI/2;
      ctx.arc(pcx,pcy,rSize,startAng,startAng+Math.PI/3);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.08+Math.sin(gTime*.03)*.04;
  for(let ri=0;ri<8;ri++){
    const ang=(ri/8)*Math.PI*2+gTime*.008;
    const rLen=40+Math.sin(gTime*.05+ri*1.3)*15;
    const grad=ctx.createLinearGradient(pcx,pcy,pcx+Math.cos(ang)*rLen,pcy+Math.sin(ang)*rLen);
    grad.addColorStop(0,ec); grad.addColorStop(1,'transparent');
    ctx.strokeStyle=grad; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pcx,pcy); ctx.lineTo(pcx+Math.cos(ang)*rLen,pcy+Math.sin(ang)*rLen); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.shadowColor=ec; ctx.shadowBlur=10; ctx.strokeStyle=ec; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx,sy+56); ctx.lineTo(sx,sy+8);
  ctx.arc(pcx,sy+8,18,Math.PI,0); ctx.lineTo(sx+36,sy+56); ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.shadowColor=ecW; ctx.shadowBlur=6; ctx.fillStyle=ecW; ctx.globalAlpha=pulse;
  ctx.beginPath(); ctx.moveTo(sx+12,sy+22); ctx.lineTo(sx+24,sy+22); ctx.lineTo(sx+18,sy+15); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
  if(Math.random()<.15){
    const ang=Math.random()*Math.PI*2, dist=20+Math.random()*15;
    emit(lv.exit.x+18+Math.cos(ang)*dist,lv.exit.y+28+Math.sin(ang)*dist,{
      vx:Math.cos(ang+Math.PI/2)*.5,vy:Math.sin(ang+Math.PI/2)*.5-.3,life:30,sz:1.5,
      col:ecW,grav:-.02,windAff:.3,shape:Math.random()<.2?'star':'circle'});
  }
}
function drawStarNodes(){
  const lv=lvl(); if(!lv||!lv.starNodes) return;
  const cx=cam.x,cy=cam.y;
  // Draw light paths between active seeds
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const active=lv.starNodes.filter(n=>n.active);
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      const a=active[i],b=active[j];
      const dx=a.x-b.x,dy=a.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<600){
        const sa=.15+Math.sin(gTime*.05)*.08;
        ctx.globalAlpha=sa; ctx.strokeStyle='#c8a84b'; ctx.lineWidth=2;
        ctx.shadowColor='#c8a84b'; ctx.shadowBlur=6;
        ctx.setLineDash([6,8]); ctx.lineDashOffset=-gTime*.5;
        ctx.beginPath(); ctx.moveTo(a.x-cx,a.y-cy); ctx.lineTo(b.x-cx,b.y-cy); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  ctx.restore();
  // Draw star nodes
  lv.starNodes.forEach((n,ni)=>{
    const sx=n.x-cx,sy=n.y-cy;
    const pulse=Math.sin(gTime*.04+ni*.7)*.15+.85;
    if(n.active){
      // Active: golden glow
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=.3*pulse;
      const ag=ctx.createRadialGradient(sx,sy,3,sx,sy,35);
      ag.addColorStop(0,'#c8a84b'); ag.addColorStop(1,'transparent');
      ctx.fillStyle=ag; ctx.fillRect(sx-35,sy-35,70,70);
      ctx.globalAlpha=.8; ctx.fillStyle='#c8a84b';
      ctx.shadowColor='#c8a84b'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      // Inactive: dim star
      ctx.globalAlpha=.3+Math.sin(gTime*.03+ni)*.1;
      ctx.fillStyle='#4a4030';
      ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#6a6040'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(sx,sy,8,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
  // Seed count HUD for Ch5
  if(chapter===5){
    const lv5=lvl();
    if(lv5){
      ctx.save(); ctx.globalAlpha=.7;
      ctx.fillStyle='#c8a84b'; ctx.font='12px sans-serif'; ctx.textAlign='left';
      ctx.fillText(`种子：${lv5.seedCount}/${lv5.maxSeeds}`,16,H-30);
      ctx.restore();
    }
  }
}

function drawP(){
  const cx=cam.x,cy=cam.y;
  const px=P.x-cx,py=P.y-cy;
  const pcx=px+P.w/2, pcy=py+P.h/2;
  const pal=PAL[chapter];
  // Trail with additive glow
  ctx.save(); ctx.globalCompositeOperation='lighter';
  P.trail.forEach(t=>{
    const a=t.l/12;
    ctx.globalAlpha=a*.35;
    const trailCol=pal.glow;
    ctx.fillStyle=trailCol; ctx.shadowColor=trailCol; ctx.shadowBlur=8;
    const sz=2+a*2;
    ctx.beginPath(); ctx.arc(t.x-cx,t.y-cy,sz,0,Math.PI*2); ctx.fill();
  });
  ctx.shadowBlur=0; ctx.restore();
  // Light radius (multi-layer)
  const lp=Math.sin(gTime*.055)*.08+.92, lr=P.lightR*lp;
  // Outer soft halo
  ctx.save(); ctx.globalAlpha=.18;
  const lg2=ctx.createRadialGradient(pcx,pcy,lr*.2,pcx,pcy,lr*1.5);
  lg2.addColorStop(0,pal.glow); lg2.addColorStop(1,'transparent');
  ctx.fillStyle=lg2; ctx.fillRect(pcx-lr*1.5,pcy-lr*1.5,lr*3,lr*3);
  // Inner bright core
  ctx.globalAlpha=.35;
  const lg1=ctx.createRadialGradient(pcx,pcy,2,pcx,pcy,lr*.6);
  lg1.addColorStop(0,pal.warm); lg1.addColorStop(1,'transparent');
  ctx.fillStyle=lg1; ctx.fillRect(pcx-lr*.6,pcy-lr*.6,lr*1.2,lr*1.2);
  ctx.restore();
  // Inv flash
  if(P.inv>0&&Math.floor(P.inv/3)%2) return;
  // Water alpha (ch4: semi-transparent underwater)
  if(chapter>=4 && inWater) ctx.globalAlpha=0.55;
  const bc=chapter===1?'#7a8a9a':chapter===2?'#d04040':chapter===4?'#7050d0':'#d0b050';
  const bb=chapter===1?'#a0b0c0':chapter===2?'#f07050':chapter===4?'#9070ff':'#ffe0a0';
  const bH=P.crawl&&!P.slam?P.h*.55:P.h;
  const bY=P.crawl&&!P.slam?py+P.h*.45:py;
  // Squash/stretch transform
  ctx.save(); ctx.translate(pcx,bY+bH*.5); ctx.scale(P.squashX,P.squashY); ctx.translate(-pcx,-(bY+bH*.5));
  // Body with emissive glow
  ctx.save(); ctx.shadowColor=pal.glow; ctx.shadowBlur=20; ctx.fillStyle=bc;
  ctx.beginPath(); ctx.ellipse(pcx,bY+bH*.65,P.w/2,bH*.35,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
  // Head with glow
  const fH=P.crawl?8:14, hY=bY+bH*.18;
  ctx.save(); ctx.shadowColor=pal.warm; ctx.shadowBlur=15; ctx.fillStyle=bb;
  ctx.beginPath(); ctx.ellipse(pcx,hY,P.w*.32,fH,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
  // Flame tip (multi-particle)
  const fl=Math.sin(gTime*.14)*3;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let fi=0;fi<3;fi++){
    const fx=pcx+fl+Math.sin(gTime*.2+fi*2.1)*3;
    const fy=hY-fH*.5-fi*3-Math.abs(Math.sin(gTime*.18+fi))*3;
    const fsz=3.5-fi*.8;
    ctx.globalAlpha=.7-fi*.15;
    ctx.fillStyle=fi===0?'#fff':fi===1?pal.warm:pal.glow;
    ctx.shadowColor=pal.warm; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.ellipse(fx,fy,fsz,fsz*1.5,0,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.restore();
  // Eyes (always visible)
  ctx.fillStyle='#fff';
  const eyeOff=P.crawl?2:3;
  ctx.fillRect(pcx+P.face*eyeOff-1,hY,2.5,2.5);
  ctx.fillRect(pcx+P.face*(eyeOff+5)-1,hY,2.5,2.5);
  ctx.restore(); // squash/stretch
  ctx.globalAlpha = 1; // reset water alpha
  // Wall slide sparks
  if(P.wallSlide&&gTime%3===0) emit(P.x+(P.face>0?P.w:0),P.y+P.h*.5,{vx:-P.face*2,vy:-Math.random()*1.5,life:12,sz:2,col:'#e06040'});
  // Slam aura
  if(P.slam){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.35;
    ctx.shadowColor='#ff4040'; ctx.shadowBlur=15; ctx.fillStyle='#c04040';
    ctx.beginPath(); ctx.arc(pcx,py+P.h+6,14,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
}

// ════════════════════════════════════
//  Main Loop
// ════════════════════════════════════
let frameTimes=[];
function update(){
  gTime++;
  windX=Math.sin(gTime*.003)*.3; windY=Math.cos(gTime*.005)*.1;
  if(state==='playing'){
    tickP(); tickShadow(); tickCam(); tickParts(); tickMovers();
    document.getElementById('vine-hint').style.display=P.swing?'block':'none';
    const lv=lvl(); if(lv&&lv.tick) lv.tick();
  } else { tickParts(); }
  if(shakeT>0) shakeT--;
  Object.keys(kp).forEach(k=>delete kp[k]);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(shakeT>0){ sx=(Math.random()-.5)*shakeI*2; sy=(Math.random()-.5)*shakeI*2; }
  ctx.save(); ctx.translate(sx,sy);
  drawBG(); drawWinds(); drawWaters(); drawPlats(); drawVines(); drawRunes(); drawStarNodes(); drawExit();
  drawParts(cam.x,cam.y); drawMovers(cam.x,cam.y); drawEcho(); drawSH(cam.x,cam.y); drawP();
  ctx.restore();
  // Vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.82);
  vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function loop(){
  const t0=performance.now();
  update(); draw();
  const dt=performance.now()-t0;
  frameTimes.push(dt); if(frameTimes.length>60) frameTimes.shift();
  requestAnimationFrame(loop);
}

// ─── Input ───
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='Enter'){
    if(state==='title'){
      const el=document.getElementById('title-screen');
      el.style.opacity='0'; setTimeout(()=>{el.style.display='none';startChap(1);},1000);
    } else if(state==='dead'){
      document.getElementById('death-screen').style.display='none';
      resetP(checkpoint.x,checkpoint.y);
      cam.x=P.x-W/2; cam.y=P.y-H/2;
      state='playing';
    }
  }
  if(e.code==='KeyE'&&state==='playing'&&dlgA) advDlg();
});

// ─── Start ───
loop();
</script>
