<!-- Generated by Trae Work - Phone Preview -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哪里最划算 - 手机预览</title>
  <style>
    :root {
      --bg: #F0F2F5;
      --phone-bg: #1a1a1a;
      --phone-frame: #2a2a2a;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .page-title {
      text-align: center;
      margin-bottom: 2rem;
    }
    .page-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 0.3rem;
    }
    .page-title p {
      font-size: 0.85rem;
      color: #6B7280;
    }

    /* Phone Frame */
    .phone-container {
      perspective: 1200px;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: var(--phone-frame);
      border-radius: 50px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #444,
        0 20px 60px rgba(0,0,0,0.3),
        0 10px 30px rgba(0,0,0,0.2),
        inset 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    /* Notch */
    .phone::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: var(--phone-frame);
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }
    .phone::after {
      content: "";
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 6px;
      background: #444;
      border-radius: 3px;
      z-index: 11;
    }

    /* Screen */
    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 40px;
    }

    /* Status Bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, transparent 100%);
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 30px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #1F2937;
      pointer-events: none;
    }
    .status-bar .time { font-size: 15px; font-weight: 700; }
    .status-icons {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
      z-index: 5;
      pointer-events: none;
    }

    /* Side Buttons */
    .phone-btn-right {
      position: absolute;
      right: -3px;
      top: 180px;
      width: 3px;
      height: 40px;
      background: linear-gradient(180deg, #555, #444, #555);
      border-radius: 0 2px 2px 0;
    }
    .phone-btn-right2 {
      position: absolute;
      right: -3px;
      top: 240px;
      width: 3px;
      height: 65px;
      background: linear-gradient(180deg, #555, #444, #555);
      border-radius: 0 2px 2px 0;
    }
    .phone-btn-left {
      position: absolute;
      left: -3px;
      top: 200px;
      width: 3px;
      height: 30px;
      background: linear-gradient(180deg, #555, #444, #555);
      border-radius: 2px 0 0 2px;
    }
    .phone-btn-left2 {
      position: absolute;
      left: -3px;
      top: 250px;
      width: 3px;
      height: 55px;
      background: linear-gradient(180deg, #555, #444, #555);
      border-radius: 2px 0 0 2px;
    }
    .phone-btn-left3 {
      position: absolute;
      left: -3px;
      top: 320px;
      width: 3px;
      height: 55px;
      background: linear-gradient(180deg, #555, #444, #555);
      border-radius: 2px 0 0 2px;
    }

    /* Tips */
    .tips {
      margin-top: 2rem;
      text-align: center;
      color: #6B7280;
      font-size: 0.8rem;
    }
    .tips a {
      color: #0EA5E9;
      text-decoration: none;
    }
    .tips a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 420px) {
      .phone {
        width: 320px;
        height: 693px;
        border-radius: 44px;
        padding: 10px;
      }
      .phone-screen {
        border-radius: 36px;
      }
      .phone-screen iframe {
        border-radius: 36px;
      }
    }
    @media (max-width: 340px) {
      .phone {
        width: 280px;
        height: 607px;
        border-radius: 38px;
        padding: 8px;
      }
      .phone-screen {
        border-radius: 32px;
      }
      .phone-screen iframe {
        border-radius: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="page-title">
    <h1>哪里最划算</h1>
    <p>微信小程序 · 手机端预览</p>
  </div>

  <div class="phone-container">
    <div class="phone">
      <div class="phone-btn-right"></div>
      <div class="phone-btn-right2"></div>
      <div class="phone-btn-left"></div>
      <div class="phone-btn-left2"></div>
      <div class="phone-btn-left3"></div>
      <div class="phone-screen">
        <div class="status-bar">
          <span class="time" id="statusTime">9:41</span>
          <div class="status-icons">
            <span>●●●●○</span>
            <span>WiFi</span>
            <span>100%</span>
          </div>
        </div>
        <iframe src="demo.html" id="phoneFrame"></iframe>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <div class="tips">
    <p>在手机框架中预览 Demo 页面</p>
    <p style="margin-top: 0.3rem;">也可以直接访问 <a href="demo.html">完整页面</a></p>
  </div>

  <script>
    // Update status bar time
    function updateTime() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
