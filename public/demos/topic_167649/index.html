<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>诗趣童行 - 小学生AI诗词学习</title>
    <style>
        :root {
            --bg-primary: #F0F9F4;
            --bg-card: #FFFFFF;
            --text-primary: #2C5F4B;
            --text-secondary: #5D8B7B;
            --accent-green: #5BA895;
            --accent-teal: #4DB6AC;
            --accent-gold: #D4A853;
            --border-color: #D4E8E0;
            --shadow-light: 0 4px 12px rgba(77, 182, 172, 0.1);
            --shadow-hover: 0 8px 20px rgba(77, 182, 172, 0.15);
            --radius-large: 20px;
            --radius-medium: 16px;
            --font-size-xl: 28px;
            --font-size-lg: 22px;
            --font-size-md: 18px;
            --font-size-sm: 16px;
            --font-size-xs: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #E8F5F0 0%, #F0F9F4 100%);
            border-radius: var(--radius-large);
            margin-bottom: 30px;
            box-shadow: var(--shadow-light);
        }

        .competition-title {
            font-size: clamp(24px, 5vw, 40px);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(44, 95, 75, 0.1);
        }

        .track-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: var(--font-size-sm);
            font-weight: 500;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .nav-tab {
            padding: 12px 24px;
            background-color: var(--bg-card);
            border: none;
            border-radius: var(--radius-medium);
            color: var(--text-secondary);
            font-size: var(--font-size-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-light);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .nav-tab:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .module-container {
            display: none;
        }

        .module-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: var(--font-size-xl);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 5px solid var(--accent-teal);
        }

        .grade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .grade-card {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 25px;
            box-shadow: var(--shadow-light);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .grade-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-teal);
        }

        .grade-card.expanded {
            grid-column: 1 / -1;
            border-color: var(--accent-teal);
        }

        .grade-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .grade-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            border-radius: var(--radius-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }

        .grade-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--text-primary);
        }

        .grade-arrow {
            font-size: 20px;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .grade-card.expanded .grade-arrow {
            transform: rotate(180deg);
        }

        .poem-list {
            display: none;
        }

        .grade-card.expanded .poem-list {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .poem-item {
            background: #F7FFFC;
            border-radius: var(--radius-medium);
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-teal);
        }

        .poem-item:last-child {
            margin-bottom: 0;
        }

        .poem-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .poem-author {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .poem-content {
            font-size: var(--font-size-md);
            color: var(--text-primary);
            line-height: 2;
            white-space: pre-line;
        }

        .generate-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #C49A4A 100%);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 168, 83, 0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(44, 95, 75, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, #E8F5F0 0%, #F0F9F4 100%);
            border-radius: var(--radius-large) var(--radius-large) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .modal-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--text-primary);
        }

        .close-btn {
            width: 35px;
            height: 35px;
            background: rgba(77, 182, 172, 0.1);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(77, 182, 172, 0.2);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 25px;
        }

        .ai-image-container {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #F0F9F4 0%, #E8F5E9 50%, #F5F0E8 100%);
            border-radius: var(--radius-medium);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ink-wash {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }

        .ink-wash.large {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(77, 182, 172, 0.4) 0%, transparent 70%);
            top: 20px;
            left: 20px;
        }

        .ink-wash.medium {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(93, 139, 123, 0.3) 0%, transparent 70%);
            bottom: 30px;
            right: 20px;
        }

        .ink-wash.small {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(212, 168, 83, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cartoon-element {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .cartoon-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .cartoon-caption {
            font-size: var(--font-size-md);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .poem-explanation {
            background: #F7FFFC;
            border-radius: var(--radius-medium);
            padding: 20px;
            margin-top: 20px;
        }

        .explanation-title {
            font-size: var(--font-size-md);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-content {
            font-size: var(--font-size-md);
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .recite-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .recite-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(77, 182, 172, 0.3);
        }

        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-color);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: var(--accent-teal);
            transform: scale(1.2);
        }

        .progress-dot.completed {
            background: var(--accent-green);
        }

        .quiz-card {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 30px;
            box-shadow: var(--shadow-light);
            margin-bottom: 25px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-md);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: var(--font-size-lg);
            color: var(--text-primary);
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-item {
            padding: 18px 20px;
            background: #F7FFFC;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-medium);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: var(--font-size-md);
            color: var(--text-primary);
        }

        .option-item:hover {
            border-color: var(--accent-teal);
            background: #E8F5F0;
        }

        .option-item.selected {
            border-color: var(--accent-teal);
            background: #E8F5F0;
        }

        .option-item.correct {
            border-color: #66BB6A;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .option-item.incorrect {
            border-color: #EF5350;
            background: #FFEBEE;
            color: #C62828;
        }

        .answer-feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--radius-medium);
            display: none;
        }

        .answer-feedback.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .answer-feedback.correct {
            background: #E8F5E9;
            border-left: 4px solid #66BB6A;
        }

        .answer-feedback.incorrect {
            background: #FFEBEE;
            border-left: 4px solid #EF5350;
        }

        .feedback-title {
            font-size: var(--font-size-md);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feedback-content {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .quiz-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .quiz-btn {
            padding: 15px 40px;
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-btn.primary {
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
        }

        .quiz-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .quiz-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quiz-result {
            text-align: center;
            padding: 40px 20px;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: var(--font-size-xl);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .result-text {
            font-size: var(--font-size-md);
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .teacher-dashboard {
            max-width: 900px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 25px;
            box-shadow: var(--shadow-light);
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent-teal);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .student-list {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-light);
            overflow: hidden;
        }

        .student-list-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, #E8F5F0 0%, #F0F9F4 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-list-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--text-primary);
        }

        .assign-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #C49A4A 100%);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .assign-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 168, 83, 0.3);
        }

        .student-item {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s ease;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .student-item:hover {
            background: #F7FFFC;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .student-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: var(--font-size-md);
            font-weight: bold;
        }

        .student-name {
            font-size: var(--font-size-md);
            font-weight: 500;
            color: var(--text-primary);
        }

        .student-class {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }

        .student-stats {
            display: flex;
            gap: 25px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--accent-teal);
        }

        .stat-name {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }

        .task-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(44, 95, 75, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .task-modal.active {
            display: flex;
        }

        .task-form {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
        }

        .form-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: var(--font-size-md);
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .form-select {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-medium);
            font-size: var(--font-size-md);
            color: var(--text-primary);
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--accent-teal);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .form-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-btn.primary {
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-green) 100%);
            color: white;
        }

        .form-btn.secondary {
            background: #F0F9F4;
            color: var(--text-secondary);
        }

        .form-btn:hover {
            transform: translateY(-2px);
        }

        .success-message {
            padding: 20px;
            background: #E8F5E9;
            border-radius: var(--radius-medium);
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            background: linear-gradient(135deg, #E8F5F0 0%, #F0F9F4 100%);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-light);
        }

        .footer-text {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .footer-label {
            font-size: var(--font-size-xs);
            color: var(--accent-teal);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 15px;
            }

            header {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .competition-title {
                font-size: 24px;
            }

            .nav-tabs {
                gap: 10px;
                margin-bottom: 20px;
            }

            .nav-tab {
                padding: 10px 18px;
                font-size: var(--font-size-sm);
            }

            .section-title {
                font-size: var(--font-size-lg);
                margin-bottom: 20px;
            }

            .grade-card {
                padding: 20px;
            }

            .grade-icon {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .quiz-card {
                padding: 20px;
            }

            .question-text {
                font-size: var(--font-size-md);
            }

            .option-item {
                padding: 15px;
                font-size: var(--font-size-sm);
            }

            .student-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .student-stats {
                width: 100%;
                justify-content: space-around;

            grades.forEach(grade => {
                const card = document.createElement('div');
                card.className = 'grade-card';
                card.id = `grade-${grade}`;
                card.onclick = () => toggleGradeCard(grade);
                
                card.innerHTML = `
                    <div class="grade-header">
                        <div class="grade-icon">${grade}</div>
                        <span class="grade-title">${grade}年级</span>
                        <span class="grade-arrow">▼</span>
                    </div>
                    <div class="poem-list" id="poems-${grade}"></div>

                gradeGrid.appendChild(card);
            });

        function toggleGradeCard(grade) {
            const card = document.getElementById(`grade-${grade}`);
            const poemList = document.getElementById(`poems-${grade}`);
            
            if (card.classList.contains('expanded')) {
                card.classList.remove('expanded');
                poemList.innerHTML = '';
                currentGrade = null;
            } else {
                document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('expanded'));
                document.querySelectorAll('.poem-list').forEach(p => p.innerHTML = '');
                
                card.classList.add('expanded');
                currentGrade = grade;
                renderPoems(grade);
            }
        }

        function renderPoems(grade) {
            const poemList = document.getElementById(`poems-${grade}`);
            const poems = poemsData[grade];
            
            poems.forEach((poem, index) => {

                poemItem.className = 'poem-item';
                
                const btn = document.createElement('button');
                btn.className = 'generate-btn';
                btn.textContent = '✨ 生成意境插画';

                    const p = poemsData[this.dataset.grade][this.dataset.index];
                    openAIModal(p.title, p.content, p.author, p.explanation, p.image);
                });
                
                poemItem.innerHTML = `
                    <div class="poem-title">${poem.title}</div>
                    <div class="poem-author">${poem.author}</div>
                    <div class="poem-content">${poem.content}</div>

            const feedback = document.getElementById('feedback');
            
            if (selectedOption === question.correct) {
                document.getElementById(`option-${selectedOption}`).classList.add('correct');
                feedback.className = 'answer-feedback show correct';
                feedback.innerHTML = `
                    <div class="feedback-title">✅ 回答正确！</div>
                    <div class="feedback-content">${question.explanation}</div>
                `;
                score++;
            } else {
                document.getElementById(`option-${selectedOption}`).classList.add('incorrect');
                document.getElementById(`option-${question.correct}`).classList.add('correct');
                feedback.className = 'answer-feedback show incorrect';
                feedback.innerHTML = `
                    <div class="feedback-title">❌ 回答错误</div>
                    <div class="feedback-content">正确答案是 ${String.fromCharCode(65 + question.correct)}。${question.explanation}</div>
                `;
            }
            
            document.getElementById(`progress-${currentQuestion}`).classList.remove('active');
            document.getElementById(`progress-${currentQuestion}`).classList.add('completed');
            
            document.getElementById('submitBtn').style.display = 'none';
            
            if (currentQuestion < quizData.length - 1) {
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                showQuizResult();
            }
        }

        function nextQuestion() {
            currentQuestion++;
            document.getElementById(`progress-${currentQuestion}`).classList.add('active');
            renderQuizQuestion();
        }

        function showQuizResult() {
            const card = document.getElementById('quizCard');
            const percentage = Math.round((score / quizData.length) * 100);
            
            let resultIcon = '🎉';
            let resultText = '太棒了！你已经完成了所有题目！';
            
            if (percentage >= 90) {
                resultIcon = '🏆';
                resultText = '太厉害了！你是诗词小达人！';
            } else if (percentage >= 70) {
                resultIcon = '🌟';
                resultText = '表现不错！继续加油！';
            } else if (percentage >= 60) {
                resultIcon = '💪';
                resultText = '及格了！还要多多练习哦！';
            } else {
                resultIcon = '📚';
                resultText = '别灰心，多读多背，一定能进步！';
            }
            
            card.innerHTML = `
                <div class="quiz-result">
                    <div class="result-icon">${resultIcon}</div>
                    <div class="result-title">闯关完成</div>
                    <div class="result-score">${score}/${quizData.length}</div>
                    <div class="result-text">${resultText}</div>
                </div>
            `;
            
            document.getElementById('restartBtn').style.display = 'block';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            renderQuizProgress();
            renderQuizQuestion();
        }

        function renderStudentList() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            
            studentsData.forEach((student, index) => {
                const percentage = Math.round((student.correct / student.completed) * 100);
                const item = document.createElement('div');
                item.className = 'student-item';
                
                item.innerHTML = `
                    <div class="student-info">
                        <div class="student-avatar">${student.name.charAt(0)}</div>
                        <div>
                            <div class="student-name">${student.name}</div>
                            <div class="student-class">${student.class}</div>
                        </div>
                    </div>
                    <div class="student-stats">
                        <div class="stat-item">
                            <div class="stat-number">${student.completed}</div>
                            <div class="stat-name">闯关</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${percentage}%</div>
                            <div class="stat-name">正确率</div>
                        </div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }

        function openTaskModal() {
            document.getElementById('taskModal').classList.add('active');
            document.getElementById('taskSuccess').classList.remove('show');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        function assignTask() {
            const grade = document.getElementById('taskGrade').value;
            const poem = document.getElementById('taskPoem').value;
            
            document.getElementById('taskSuccess').classList.add('show');
            
            setTimeout(() => {
                closeTaskModal();
            }, 2000);
        }

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.module-container').forEach(m => m.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(this.dataset.module).classList.add('active');
            });
        });

        document.getElementById('aiModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) closeTaskModal();
        });

        init();
    </script>
</body>
</html>
