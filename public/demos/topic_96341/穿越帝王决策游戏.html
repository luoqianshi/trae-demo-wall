<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万朝天命 - 帝王决策</title>
  <style>
    :root {
      --bg: #140d08;
      --panel: rgba(35, 22, 13, 0.9);
      --panel-2: rgba(58, 36, 20, 0.9);
      --gold: #e8c56a;
      --gold-2: #fff0ad;
      --red: #9d2d22;
      --ink: #f7ead1;
      --muted: #cab894;
      --green: #79c779;
      --blue: #8cb9ff;
      --danger: #ff7777;
      --shadow: 0 22px 80px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
      background:
        radial-gradient(circle at top, rgba(232,197,106,0.22), transparent 34rem),
        linear-gradient(135deg, rgba(120,25,18,0.45), transparent 35%),
        linear-gradient(180deg, #201006 0%, var(--bg) 55%, #090604 100%);
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
    }
    .app {
      width: min(1220px, calc(100vw - 32px));
      margin: 0 auto; padding: 32px 0 48px;
    }
    header {
      display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 58px); letter-spacing: 0.08em; color: var(--gold-2); text-shadow: 0 0 20px rgba(232,197,106,0.35); }
    .subtitle { margin-top: 10px; color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 780px; }
    .seal { width: 110px; height: 110px; border: 4px double var(--gold); border-radius: 22px; display: grid; place-items: center; color: var(--gold-2); font-size: 22px; line-height: 1.25; text-align: center; transform: rotate(4deg); background: rgba(120,33,25,0.45); box-shadow: var(--shadow); }
    .screen { display: none; animation: fade 0.35s ease both; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: linear-gradient(145deg, rgba(58,36,20,0.94), rgba(22,14,9,0.94));
      border: 1px solid rgba(232,197,106,0.28); box-shadow: var(--shadow);
      border-radius: 24px; padding: 24px; position: relative; overflow: hidden;
    }
    .card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 35%); opacity: 0.35; }
    .era-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-top: 22px; }
    .era-card { min-height: 210px; background: rgba(255,255,255,0.045); border: 1px solid rgba(232,197,106,0.22); border-radius: 18px; padding: 18px; cursor: pointer; transition: 0.22s ease; position: relative; z-index: 1; }
    .era-card:hover { transform: translateY(-5px); border-color: rgba(232,197,106,0.75); background: rgba(232,197,106,0.09); }
    .era-card h3 { margin: 0 0 10px; color: var(--gold-2); font-size: 22px; }
    .era-card p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .tag { display: inline-block; margin-top: 14px; padding: 5px 10px; border-radius: 999px; color: var(--gold-2); border: 1px solid rgba(232,197,106,0.35); background: rgba(0,0,0,0.22); font-size: 12px; }
    .game-layout { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
    .stats { display: grid; gap: 12px; position: sticky; top: 16px; }
    .stat { background: rgba(0,0,0,0.2); border: 1px solid rgba(232,197,106,0.18); border-radius: 16px; padding: 14px; }
    .stat-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
    .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,0.11); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 50%; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--gold)); transition: width 0.35s ease; }
    .map-panel { background: rgba(0,0,0,0.18); border: 1px solid rgba(232,197,106,0.18); border-radius: 18px; padding: 14px; }
    .map-panel h3 { margin: 0 0 10px; color: var(--gold-2); font-size: 16px; }
    .map-grid { width: 100%; border-radius: 16px; background: rgba(0,0,0,0.22); border: 1px solid rgba(232,197,106,0.16); overflow: hidden; }
    .raster-map { display: block; width: 100%; max-height: 260px; object-fit: contain; background: rgba(255,240,173,0.08); }
    .map-source { padding: 8px 10px; color: var(--muted); font-size: 11px; line-height: 1.45; border-top: 1px solid rgba(232,197,106,0.16); }
    .map-placeholder { min-height: 180px; display: grid; place-items: center; padding: 18px; color: var(--muted); text-align: center; line-height: 1.7; }
    .map-status-list { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
    .map-status-list span { padding: 3px 8px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(232,197,106,0.22); background: rgba(255,255,255,0.05); }
    .map-status-list .secure { color: var(--green); }
    #mapCanvas { display: block; width: 100%; max-height: 260px; background: rgba(0,0,0,0.25); }
    .map-status-list .contested { color: var(--gold-2); }
    .map-status-list .lost { color: var(--danger); }
    .minister-list { background: rgba(0,0,0,0.18); border: 1px solid rgba(232,197,106,0.18); border-radius: 18px; padding: 14px; }
    .minister-list h3 { margin: 0 0 10px; color: var(--gold-2); font-size: 16px; }
    .minister-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .minister-row:first-of-type { border-top: 0; }
    .minister-row strong { display: block; color: var(--ink); font-size: 13px; }
    .minister-row span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .small-btn { padding: 7px 9px; border-radius: 10px; font-size: 12px; box-shadow: none; }
    .minister-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }
    .map-note { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .court-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .court-title h2 { margin: 0; color: var(--gold-2); font-size: clamp(25px, 3vw, 38px); }
    .year-pill { padding: 9px 13px; border: 1px solid rgba(232,197,106,0.32); border-radius: 999px; color: var(--gold-2); background: rgba(0,0,0,0.2); white-space: nowrap; }
    .court-actions { display: grid; gap: 8px; justify-items: end; position: relative; }
    .capital-panel { display: none; position: absolute; right: 0; top: 44px; z-index: 5; width: 230px; padding: 12px; border-radius: 16px; border: 1px solid rgba(232,197,106,0.32); background: rgba(22,14,9,0.98); box-shadow: var(--shadow); }
    .capital-panel.active { display: grid; gap: 8px; }
    .capital-panel-title { color: var(--gold-2); font-size: 13px; margin-bottom: 2px; }
    .capital-option { width: 100%; text-align: left; padding: 9px 11px; border-radius: 12px; font-size: 13px; }
    .capital-current { color: var(--muted); font-size: 11px; }
    .edict { background: linear-gradient(90deg, rgba(232,197,106,0.12), transparent), rgba(0,0,0,0.18); border-left: 5px solid var(--gold); border-radius: 16px; padding: 18px; line-height: 1.8; color: #fbeed8; margin-bottom: 18px; white-space: pre-line; }
    .daily-box { margin-bottom: 18px; background: rgba(0,0,0,0.18); border: 1px solid rgba(232,197,106,0.2); border-radius: 18px; padding: 16px; }
    .daily-box h3 { margin: 0 0 10px; color: var(--gold-2); font-size: 17px; }
    .daily-feed { display: grid; gap: 9px; max-height: 240px; overflow: auto; }
    .daily-item { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); line-height: 1.55; }
    .daily-day { color: var(--gold-2); font-weight: 800; font-size: 13px; }
    .daily-text { color: var(--muted); font-size: 13px; }
    .daily-war { border-color: rgba(255,119,119,0.26); background: rgba(157,45,34,0.13); }
    .daily-war .daily-day { color: #ffb1a8; }
    .daily-event { border-color: rgba(232,197,106,0.24); background: rgba(232,197,106,0.08); }
    .ministers { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
    .minister { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 15px; }
    .minister strong { display: block; color: var(--gold-2); margin-bottom: 8px; }
    .minister p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .minister.talkable { cursor: pointer; transition: 0.2s ease; }
    .minister.talkable:hover, .minister.talkable.active { border-color: rgba(232,197,106,0.68); background: rgba(232,197,106,0.09); transform: translateY(-2px); }
    .council-box { margin-bottom: 18px; background: rgba(0,0,0,0.18); border: 1px solid rgba(232,197,106,0.2); border-radius: 18px; padding: 16px; }
    .council-box h3 { margin: 0 0 10px; color: var(--gold-2); font-size: 17px; }
    .council-controls { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; align-items: center; }
    .council-controls select, .council-controls input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(232,197,106,0.28); background: rgba(0,0,0,0.25); color: var(--ink); font-family: inherit; }
    .dialogue-log { margin-top: 12px; max-height: 190px; overflow: auto; display: grid; gap: 9px; }
    .dialogue-line { padding: 10px 12px; border-radius: 14px; line-height: 1.6; font-size: 13px; }
    .dialogue-line.ask { background: rgba(140,185,255,0.10); color: #dce9ff; border: 1px solid rgba(140,185,255,0.18); }
    .dialogue-line.answer { background: rgba(232,197,106,0.10); color: var(--muted); border: 1px solid rgba(232,197,106,0.18); }
    .dialogue-line b { color: var(--gold-2); }
    .decision-box { margin-bottom: 18px; }
    .decision-box label { display: block; margin-bottom: 8px; color: var(--gold-2); font-size: 15px; }
    .decision-box textarea {
      width: 100%; min-height: 80px; padding: 14px; border-radius: 16px;
      border: 1px solid rgba(232,197,106,0.3); background: rgba(0,0,0,0.25);
      color: var(--ink); font-size: 15px; font-family: inherit; resize: vertical;
    }
    .decision-box textarea:focus { outline: none; border-color: var(--gold); }
    .decision-box .hint { margin-top: 8px; color: var(--muted); font-size: 13px; }
    button { appearance: none; border: 0; border-radius: 16px; color: #201006; background: linear-gradient(135deg, var(--gold-2), var(--gold)); padding: 14px 22px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s ease; box-shadow: 0 10px 22px rgba(0,0,0,0.25); }
    button:hover { transform: translateY(-2px); filter: brightness(1.06); }
    button.secondary { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid rgba(232,197,106,0.25); box-shadow: none; }
    .log { margin-top: 16px; max-height: 220px; overflow: auto; background: rgba(0,0,0,0.22); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.1); }
    .log h3 { margin: 0 0 8px; color: var(--gold-2); font-size: 16px; }
    .log p { margin: 8px 0; color: var(--muted); line-height: 1.55; font-size: 13px; }
    .result { text-align: center; padding: 22px; }
    .result h2 { margin: 0 0 12px; font-size: clamp(34px, 5vw, 58px); color: var(--gold-2); }
    .result p { max-width: 820px; margin: 0 auto 18px; color: var(--muted); line-height: 1.8; font-size: 17px; }
    .summary-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 24px 0; }
    .summary-item { padding: 16px; border-radius: 16px; border: 1px solid rgba(232,197,106,0.2); background: rgba(255,255,255,0.05); }
    .summary-item b { display: block; color: var(--gold-2); font-size: 24px; margin-bottom: 5px; }
    .summary-item span { color: var(--muted); font-size: 13px; }
    .footer-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .outcome-box { background: rgba(0,0,0,0.2); border: 1px solid rgba(232,197,106,0.2); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .outcome-box h4 { margin: 0 0 8px; color: var(--gold-2); font-size: 16px; }
    .outcome-box p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .changes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .change-tag { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .change-up { background: rgba(121,199,121,0.2); color: var(--green); border: 1px solid rgba(121,199,121,0.4); }
    .change-down { background: rgba(255,119,119,0.15); color: var(--danger); border: 1px solid rgba(255,119,119,0.35); }
    .change-neu { background: rgba(140,185,255,0.15); color: var(--blue); border: 1px solid rgba(140,185,255,0.35); }
    @media (max-width: 980px) {
      header, .game-layout { grid-template-columns: 1fr; }
      .seal { display: none; }
      .era-grid, .ministers, .summary-grid { grid-template-columns: 1fr 1fr; }
      .council-controls { grid-template-columns: 1fr; }
      .stats { position: static; }
    }
    .region-panel { margin-top: 14px; }
    .region-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .region-cell { background: rgba(255,255,255,0.06); border: 1px solid rgba(232,197,106,0.18); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; transition: 0.2s; font-size: 12px; position: relative; }
    .region-cell:hover { transform: translateY(-2px); border-color: var(--gold); background: rgba(232,197,106,0.1); }
    .region-cell.secure { border-color: rgba(121,199,121,0.5); background: rgba(121,199,121,0.1); }
    .region-cell.contested { border-color: rgba(232,197,106,0.5); background: rgba(232,197,106,0.1); }
    .region-cell.lost { border-color: rgba(157,45,34,0.5); background: rgba(157,45,34,0.15); opacity: 0.7; }
    .region-name { color: var(--gold-2); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .region-posts { color: var(--muted); font-size: 11px; }
    .region-legend { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .region-legend span { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .rl-green { background: rgba(121,199,121,0.2); color: var(--green); border: 1px solid rgba(121,199,121,0.4); }
    .rl-yellow { background: rgba(232,197,106,0.15); color: var(--gold); border: 1px solid rgba(232,197,106,0.4); }
    .rl-red { background: rgba(157,45,34,0.2); color: var(--danger); border: 1px solid rgba(157,45,34,0.4); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: linear-gradient(145deg, rgba(58,36,20,0.98), rgba(22,14,9,0.98)); border: 1px solid rgba(232,197,106,0.35); border-radius: 24px; padding: 24px; width: min(520px, 100%); max-height: 80vh; overflow: auto; box-shadow: var(--shadow); }
    .modal-card h3 { margin: 0 0 14px; color: var(--gold-2); }
    .modal-post { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .modal-post-info { flex: 1; }
    .modal-post-info strong { color: var(--gold-2); font-size: 14px; }
    .modal-post-info p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .modal-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .modal-close { margin-top: 14px; width: 100%; }
    .empty-post { color: var(--danger); font-size: 12px; }
    @media (max-width: 640px) {
      .era-grid, .ministers, .summary-grid { grid-template-columns: 1fr; }
      .court-title { display: block; }
      .year-pill { display: inline-block; margin-top: 12px; }
      .region-map { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>万朝天命</h1>
      <div class="subtitle">穿越到历史上的不同王朝，登基为帝，听取群臣谏言，以你的智慧与意志亲笔写下每一道圣旨。每一道决策都会改变天下走向。</div>
    </div>
    <div class="seal">受命<br/>于天</div>
  </header>

  <section id="startScreen" class="screen active">
    <div class="card">
      <h2>选择你要穿越的时代</h2>
      <p class="subtitle">每个时代都有独特的开局局势、群臣性格与危机。你的目标是在十年内稳住天下，并让史官写下属于你的帝王评价。</p>
      <div id="eraGrid" class="era-grid"></div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="game-layout">
      <aside class="card stats">
        <div>
          <h2 id="dynastyName" style="margin:0;color:var(--gold-2);"></h2>
          <p id="roleIntro" class="subtitle" style="margin-bottom:0;"></p>
        </div>
        <div id="statsBox"></div>
        <div class="map-panel">
          <h3>天下版图</h3>
          <div id="mapGrid" class="map-grid"></div>
          <div id="mapNote" class="map-note"></div>
        </div>
        <div class="region-panel">
          <h3>行政区任命</h3>
          <div id="regionMap" class="region-map"></div>
          <div class="region-legend">
            <span class="rl-green">已任命</span>
            <span class="rl-yellow">缺员</span>
            <span class="rl-red">失守</span>
          </div>
        </div>
        <div class="minister-list">
          <h3>朝臣名录</h3>
          <div id="ministerList"></div>
          <div class="minister-actions">
            <button class="small-btn" onclick="recruitMinister()">招募人才</button>
            <button class="small-btn secondary" onclick="dismissWeakMinister()">裁撤冗员</button>
          </div>
        </div>
        <button class="secondary" onclick="restart()">重新穿越</button>
      </aside>

      <section class="card">
        <div class="court-title">
          <div>
            <h2 id="eventTitle"></h2>
            <div id="eventType" class="tag"></div>
          </div>
          <div class="court-actions">
            <button class="small-btn" onclick="toggleCapitalPanel()">迁都</button>
            <div id="yearLabel" class="year-pill"></div>
            <div id="capitalPanel" class="capital-panel"></div>
          </div>
        </div>

        <div id="eventText" class="edict"></div>
        <div class="daily-box">
          <h3>今日上朝奏报</h3>
          <div id="dailyFeed" class="daily-feed"></div>
        </div>
        <div id="ministerBox" class="ministers"></div>

        <div class="council-box">
          <h3>御前问政</h3>
          <div class="council-controls">
            <select id="talkMinisterSelect"></select>
            <input id="talkInput" placeholder="向臣子询问政事，例如：若朕减税并练兵，风险在哪里？" />
            <button class="small-btn" onclick="talkToMinister()">询问</button>
          </div>
          <div id="dialogueLog" class="dialogue-log"></div>
        </div>

        <div class="decision-box">
          <label>你作为皇帝，如何决策？（自由输入你的圣旨）</label>
          <textarea id="playerInput" placeholder="例如：征召五万精兵北上抗击匈奴，同时开仓赈济灾民，减免灾区赋税三年..."></textarea>
          <div class="hint">可以写任何决策：调兵、征税、减税、赈灾、开科、削藩、通商、闭关、修史、焚书、立储、和亲等。</div>
        </div>

        <div id="outcomeBox" class="outcome-box" style="display:none;">
          <h4>决策结果</h4>
          <p id="outcomeText"></p>
          <div id="outcomeChanges" class="changes"></div>
        </div>

        <button id="submitBtn" onclick="submitDecision()">颁布圣旨</button>

        <div class="log">
          <h3>起居注</h3>
          <div id="historyLog"></div>
        </div>
      </section>
    </div>
  </section>

  <section id="endScreen" class="screen">
    <div class="card result">
      <h2 id="endingTitle"></h2>
      <p id="endingText"></p>
      <div id="summaryGrid" class="summary-grid"></div>
      <div class="footer-actions">
        <button onclick="restart()">再开一局</button>
        <button class="secondary" onclick="backToStart()">选择其他时代</button>
      </div>
    </div>
  </section>

  <div id="regionModal" class="modal-overlay" onclick="if(event.target===this)closeRegionModal()">
    <div class="modal-card">

  { name: "治粟能臣 沈度", role: "财政", skill: "理财", bonus: { 国库: 5, 朝堂: 1 }, advice: "臣可清丈田亩、整顿仓储，使钱粮出入皆有定数。" },
  { name: "边塞宿将 马援之", role: "军事", skill: "练兵", bonus: { 军力: 5, 疆域: 2 }, advice: "臣愿整军经武，先固边防，再言进取。" },
  { name: "清流谏臣 陆正", role: "民生", skill: "安民", bonus: { 民心: 5, 文治: 1 }, advice: "民心不可失。请陛下省刑薄赋，以养天下元气。" },
  { name: "法度名臣 韩纪", role: "吏治", skill: "整肃", bonus: { 朝堂: 5, 国库: 2 }, advice: "臣愿考课百官，去冗员、惩贪墨，使政令复归朝廷。" },
  { name: "鸿儒学士 顾修", role: "文教", skill: "兴学", bonus: { 文治: 6, 民心: 1 }, advice: "兴学校、开言路，方能使天下人才归心。" },
  { name: "水师都督 郑沧", role: "海防", skill: "通海", bonus: { 军力: 3, 国库: 3, 疆域: 2 }, advice: "沿海不可弃。建水师、通市舶，可富国亦可御敌。" }
];

function clamp(value) { return Math.max(0, Math.min(100, value)); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderEras() {
  const grid = document.getElementById("eraGrid");
  grid.innerHTML = eras.map(era => `
    <article class="era-card" onclick="startGame('${era.id}')">
      <h3>${era.name}</h3>
      <p>${era.intro}</p>
      <span class="tag">${era.tag}</span>
    </article>
  `).join("");
}

function startGame(id) {
  currentEra = eras.find(e => e.id === id);
  state = { ...currentEra.stats };
  state["疆域"] = state["疆域"] ?? estimateInitialTerritory();
  usedEvents = [];
  day = 1;
  currentCapital = inferInitialCapital();
  mapRegions = createInitialMap();
  courtMinisters = currentEra.ministers.map((m, index) => ({
    name: m[0],
    advice: m[1],
    role: ["军政", "财政", "文治"][index] || "政务",
    skill: ["军务", "理财", "兴学"][index] || "辅政",
    loyalty: 70 - index * 5,
    bonus: index === 0 ? { 军力: 2, 朝堂: 1 } : index === 1 ? { 国库: 2, 民心: 1 } : { 文治: 2, 朝堂: 1 }
  }));
  initRegions();
  decisionLocked = false;
  dialogueHistory = [];
  selectedMinisterIndex = 0;
  history = [`你穿越为${currentEra.emperor}，改元开局，召群臣入殿议政。`];
  document.getElementById("dynastyName").textContent = currentEra.name;
  document.getElementById("roleIntro").textContent = currentEra.intro;
  document.getElementById("playerInput").value = "";
  document.getElementById("outcomeBox").style.display = "none";
  showScreen("gameScreen");
  nextEvent();
}

function initRegions() {
  regions = regionNames.map((name, i) => ({
    name,
    index: i,
    stability: 55 + Math.floor(Math.random() * 20),
    posts: { county: null, prefect: null, governor: null }
  }));
  regionOfficers = {};
  selectedRegionIndex = -1;
}

function renderRegionMap() {
  const container = document.getElementById("regionMap");
  if (!container) return;
  container.innerHTML = regions.map((r, i) => {
    const status = regionStatus(r.stability);
    const filled = Object.values(r.posts).filter(p => p !== null).length;
    const total = postTypes.length;
    return `
      <div class="region-cell ${status}" onclick="openRegionModal(${i})">
        <div class="region-name">${r.name}</div>
        <div class="region-posts">任命 ${filled}/${total}</div>
      </div>
    `;
  }).join("");
}

function openRegionModal(index) {
  selectedRegionIndex = index;
  const region = regions[index];
  const modal = document.getElementById("regionModal");
  const title = document.getElementById("modalRegionTitle");
  const content = document.getElementById("modalRegionContent");
  title.textContent = `${region.name} — 官员任命`;

  const status = regionStatus(region.stability);
  const statusText = status === "secure" ? "局势稳固" : status === "contested" ? "局势动荡" : "已失守";

  content.innerHTML = `
    <p style="color:var(--muted);margin:0 0 14px;">当前状态：${statusText}（稳定度 ${region.stability}）<br/>点击空缺职位可从朝臣中任命官员，或撤换现有官员。</p>
    ${postTypes.map(post => {
      const officer = region.posts[post.key];
      if (officer) {
        return `
          <div class="modal-post">
            <div class="modal-post-info">
              <strong>${post.title}</strong>
              <p>现任：${officer.name} · ${officer.role} · ${officer.skill}</p>
            </div>
            <div class="modal-actions">
              <button class="small-btn secondary" onclick="removeOfficer(${index}, '${post.key}')">撤职</button>
            </div>
          </div>
        `;
      }
      const available = getAvailableMinisters();
      if (!available.length) {
        return `
          <div class="modal-post">
            <div class="modal-post-info">
              <strong>${post.title}</strong>
              <p class="empty-post">${post.desc}<br/>朝中暂无可用人才，请先招募。</p>
            </div>
          </div>
        `;
      }
      return `
        <div class="modal-post">
          <div class="modal-post-info">
            <strong>${post.title}</strong>
            <p>${post.desc}<br/>任命消耗国库 ${post.cost}</p>
          </div>
          <div class="modal-actions">
            <select id="select-${post.key}-${index}">
              ${available.map((m, mi) => `<option value="${mi}">${m.name} · ${m.role}</option>`).join("")}
            </select>
            <button class="small-btn" onclick="appointOfficer(${index}, '${post.key}')">任命</button>
          </div>
        </div>
      `;
    }).join("")}
  `;
  modal.classList.add("active");
}

function closeRegionModal() {
  document.getElementById("regionModal").classList.remove("active");
  selectedRegionIndex = -1;
}

function getAvailableMinisters() {
  const appointed = new Set();
  regions.forEach(r => {
    Object.values(r.posts).forEach(p => { if (p) appointed.add(p.name); });
  });
  return courtMinisters.filter(m => !appointed.has(m.name));
}

function appointOfficer(regionIndex, postKey) {
  const region = regions[regionIndex];
  if (region.posts[postKey]) return;
  const select = document.getElementById(`select-${postKey}-${regionIndex}`);
  if (!select) return;
  const available = getAvailableMinisters();
  const minister = available[select.value];
  if (!minister) return;
  const cost = postTypes.find(p => p.key === postKey)?.cost || 5;
  if ((state["国库"] || 0) < cost) {
    alert("国库不足，无法任命此职。");
    return;
  }
  state["国库"] = clamp((state["国库"] || 0) - cost);
  region.posts[postKey] = { name: minister.name, role: minister.role, skill: minister.skill, bonus: { ...minister.bonus } };
  applyRegionBonuses();
  history.unshift(`${shortDateLabel()}：陛下任命${minister.name}为${region.name}${postTypes.find(p => p.key === postKey).title}。`);
  renderStats();
  renderRegionMap();
  openRegionModal(regionIndex);
  renderLog();
}

function removeOfficer(regionIndex, postKey) {
  const region = regions[regionIndex];
  if (!region.posts[postKey]) return;
  const officer = region.posts[postKey];
  region.posts[postKey] = null;
  applyRegionBonuses();
  history.unshift(`${shortDateLabel()}：陛下撤去${officer.name}${region.name}${postTypes.find(p => p.key === postKey).title}之职。`);
  renderStats();
  renderRegionMap();
  openRegionModal(regionIndex);
  renderLog();
}

function applyRegionBonuses() {
  regions.forEach(r => {
    let stabilityChange = -1;
    Object.values(r.posts).forEach(p => {
      if (p) stabilityChange += 3;
    });
    r.stability = clamp(r.stability + stabilityChange);
  });
}

function renderStats() {
  const box = document.getElementById("statsBox");
  box.innerHTML = statNames.map(name => {
    const value = clamp(state[name]);
    return `
      <div class="stat">
        <div class="stat-top"><span>${name}</span><strong>${value}</strong></div>
        <div class="bar"><span style="width:${value}%"></span></div>
      </div>
    `;
  }).join("");
}

function inferInitialCapital() {
  const id = currentEra?.id || "";
  if (periodCapitalCases[id]) return periodCapitalCases[id].initial;
  if (id.includes("qing")) return "北京";
  if (id.includes("ming_yongle") || id.includes("ming_hongzhi") || id.includes("ming_wanli") || id.includes("ming_late")) return "北京";
  if (id.includes("ming")) return "南京";
  if (id.includes("song")) return id.includes("south") ? "南京" : "开封";
  if (id.includes("yuan")) return "北京";
  if (id.includes("tang")) return "洛阳";
  if (id.includes("han_east") || id.includes("zhou") || id.includes("jin") || id.includes("northern_wei")) return "洛阳";
  if (id.includes("five_dynasties")) return "开封";
  return "洛阳";
}

function getCapitalOptions() {
  const id = currentEra?.id || "";
  return periodCapitalCases[id]?.options || genericCapitalOptions;
}

function capitalCaseNote() {
  const id = currentEra?.id || "";
  return periodCapitalCases[id]?.note || "迁都会消耗国库，并影响民心、朝堂与疆域稳定。";
}

function renderCapitalPanel() {
  const panel = document.getElementById("capitalPanel");
  if (!panel) return;
  const options = getCapitalOptions();
  panel.innerHTML = `
    <div class="capital-panel-title">当前都城：${currentCapital}</div>
    ${options.map(capital => {
      const disabled = capital === currentCapital ? "disabled" : "";
      const label = capital === currentCapital ? `${capital}（当前）` : `迁都${capital}`;
      return `<button class="capital-option ${disabled ? "secondary" : ""}" ${disabled} onclick="moveCapital('${capital}')">${label}</button>`;
    }).join("")}
    <div class="capital-current">${capitalCaseNote()}</div>
  `;
}

function toggleCapitalPanel() {
  renderCapitalPanel();
  document.getElementById("capitalPanel").classList.toggle("active");
}

function moveCapital(newCapital) {
  if (!currentEra || newCapital === currentCapital) return;
  if (!getCapitalOptions().includes(newCapital)) return;
  const oldCapital = currentCapital;
  currentCapital = newCapital;
  document.getElementById("capitalPanel").classList.remove("active");

  const effect = { 国库: -12, 民心: -4, 朝堂: -6, 疆域: -3 };
  applyCapitalProfile(effect, newCapital);

  Object.entries(effect).forEach(([key, value]) => {
    state[key] = clamp((state[key] ?? 50) + value);
  });
  mapRegions.forEach(region => {
    const hit = capitalRegionMatch(newCapital, region.name);
    region.stability = clamp(region.stability + (hit ? 6 : -2));
  });
  const avg = Math.round(mapRegions.reduce((sum, region) => sum + region.stability, 0) / mapRegions.length);
  state["疆域"] = clamp(Math.round((state["疆域"] * 0.5) + (avg * 0.5)));
  history.unshift(`${shortDateLabel()}：陛下诏令迁都，由${oldCapital}迁往${newCapital}。百官震动，天下州郡重新调整贡赋与防务。`);
  renderStats();
  renderMap();
  renderCapitalPanel();
  document.getElementById("yearLabel").textContent = `${currentDateLabel()}｜都城：${currentCapital}`;
  renderLog();
}

function applyCapitalProfile(effect, capital) {
  if (["洛阳", "洛邑", "成周"].includes(capital)) { effect["文治"] = (effect["文治"] || 0) + 4; effect["朝堂"] += 2; }
  if (["北京", "平城", "邺城", "邺都", "太原", "汉中", "晋阳", "凤翔", "襄阳", "西安", "沈阳"].includes(capital)) { effect["军力"] = (effect["军力"] || 0) + 5; effect["疆域"] += 2; }
  if (["南京", "金陵", "成都", "江州", "岭南", "建康", "江都", "临安", "扬州", "福州", "广州", "杭州", "重庆"].includes(capital)) { effect["国库"] += 4; effect["民心"] += 2; }
  if (["开封", "咸阳", "亳", "临淄", "许昌", "大都", "天津"].includes(capital)) { effect["朝堂"] += 3; effect["国库"] += 1; }
  if (["殷", "朝歌", "商丘", "镐京", "丰京", "岐周", "栎阳", "雍城"].includes(capital)) { effect["民心"] += 3; effect["文治"] = (effect["文治"] || 0) + 1; }
  if (["长安"].includes(capital)) { effect["军力"] = (effect["军力"] || 0) + 3; effect["文治"] = (effect["文治"] || 0) + 3; }
  if (["建业", "永安", "郢都", "曲阜", "南阳", "崖山", "上都", "和林", "应昌"].includes(capital)) { effect["疆域"] += 1; effect["文治"] = (effect["文治"] || 0) + 2; }
  if (["上都", "和林", "应昌", "沈阳"].includes(capital)) { effect["民心"] -= 2; effect["军力"] = (effect["军力"] || 0) + 2; }
  if (["崖山"].includes(capital)) { effect["朝堂"] -= 4; effect["疆域"] -= 2; }
}

function capitalRegionMatch(capital, regionName) {
  const groups = {
    洛阳: /洛阳|中原|王畿|关中/, 洛邑: /洛阳|洛邑|中原|王畿/, 成周: /洛阳|成周|中原|王畿/,
    北京: /京畿|直隶|河北|辽东|宣大/, 平城: /边塞|河北|河东|晋阳/, 邺城: /河北|中原|河东/, 邺都: /河北|中原|河东/, 太原: /河东|边塞|河北/, 晋阳: /河东|边塞|河北/,
    南京: /南京|江南|两浙|江淮/, 金陵: /南京|江南|两浙|江淮/, 建康: /南京|江南|两浙|江淮/, 临安: /江南|两浙|江淮|东南/, 扬州: /江淮|江南|东南/, 杭州: /江南|两浙|东南/, 福州: /福建|东南|海疆/, 广州: /岭南|两广|东南|海疆/, 崖山: /岭南|两广|海疆/, 建业: /江南|东南|两浙/, 成都: /巴蜀|川蜀|西南|成都/, 重庆: /巴蜀|川蜀|西南|荆湖/, 江州: /江南|荆湖|川蜀/, 永安: /川蜀|荆湖|边塞/, 岭南: /岭南|两广|东南|海疆/,
    开封: /中原|京畿|河南/, 咸阳: /咸阳|关中|河套/, 亳: /中原|商丘|王畿/, 殷: /中原|河北|王畿/, 朝歌: /中原|河北/, 商丘: /中原|齐鲁/, 南阳: /中原|楚地|荆湖/,
    临淄: /齐鲁|中原|东南/, 曲阜: /齐鲁|中原/, 郢都: /楚地|江南|荆湖/, 栎阳: /关中|咸阳/, 雍城: /关中|咸阳/, 汉中: /汉中|巴蜀|关中|西南/, 长安: /长安|关中|河西/, 西安: /长安|关中|河西/, 凤翔: /关中|边塞|河西/, 襄阳: /荆湖|江淮|中原/,
    大都: /京畿|直隶|河北|辽阳/, 上都: /岭北|边塞|河北/, 和林: /岭北|边塞/, 应昌: /岭北|辽阳|边塞/, 沈阳: /东北|辽东|辽阳/, 天津: /京畿|直隶|海疆/, 江都: /江淮|江南|东南/
  };
  return (groups[capital] || /中原|王畿/).test(regionName);
}

function renderMinisterList() {
  const list = document.getElementById("ministerList");
  if (!courtMinisters.length) {
    list.innerHTML = `<p class="map-note">朝中暂无可用之臣，政令执行将大受影响。</p>`;
    renderDialoguePanel();
    return;
  }
  if (selectedMinisterIndex >= courtMinisters.length) selectedMinisterIndex = 0;
  list.innerHTML = courtMinisters.map((m, index) => `
    <div class="minister-row">
      <div>
        <strong>${m.name}</strong>
        <span>${m.role} · ${m.skill} · 忠诚 ${m.loyalty}</span>
      </div>
      <button class="small-btn secondary" onclick="dismissMinister(${index})">裁</button>
    </div>
  `).join("");
  renderDialoguePanel();
}

function renderDialoguePanel() {
  const select = document.getElementById("talkMinisterSelect");
  const log = document.getElementById("dialogueLog");
  if (!select || !log) return;
  if (!courtMinisters.length) {
    select.innerHTML = `<option>暂无臣子</option>`;
    log.innerHTML = `<div class="dialogue-line answer">朝中无人可问，请先招募人才。</div>`;

  }

    <option value="${index}" ${index === selectedMinisterIndex ? "selected" : ""}>${m.name} · ${m.role}</option>
  `).join("");

    <div class="dialogue-line ${item.type}">
      <b>${item.speaker}：</b>${item.text}
    </div>
  `).join("") || `<div class="dialogue-line answer">选择一名臣子，向他询问今日朝政。臣子的回答会根据当前局势和你的问题变化。</div>`;
}

function selectMinister(index) {
  selectedMinisterIndex = index;
  renderDialoguePanel();
}

function ministerStance(minister) {
  const lowest = statNames.slice().sort((a, b) => state[a] - state[b])[0];
  const highest = statNames.slice().sort((a, b) => state[b] - state[a])[0];
  const roleAdvice = {
    财政: `臣以为当先看钱粮。如今${lowest}最弱，若再无节制动用国库，政令虽美也难持久。`,
    军事: `臣所忧在兵势与疆域。若${state["军力"] < 45 ? "军力不足" : "军力尚可"}，用兵便须分清主次，不可多线并举。`,
    民生: `臣请陛下先问百姓能否承受。民心若散，纵有${highest}之长，也难免地方生变。`,
    吏治: `臣以为关键在执行。朝堂若不能约束州县，圣旨到地方便可能变成扰民之令。`,
    文教: `臣愿陛下兼顾名分与人心。文教虽不速成，却能让天下知道朝廷仍有制度。`,
    海防: `臣看重财源与海疆。若通商、造船、巡海并行，可富国；若只开不防，反生盗患。`
  };
  return roleAdvice[minister.role] || `臣以为此事要看轻重缓急。当前${lowest}偏弱，若不补短，其他强项也难支撑大局。`;
}

function generateMinisterReply(minister, question) {
  const themes = detectPolicyThemes(question);
  const risk = state["民心"] < 30 ? "民怨已深" : state["国库"] < 30 ? "国库吃紧" : state["朝堂"] < 30 ? "朝堂不稳" : state["疆域"] < 35 ? "疆域多有动荡" : "国势尚有回旋余地";
  const eventHint = currentEvent ? `今日朝会所议“${currentEvent.title}”，不可只看一端。` : "当前政务未定，宜先明辨缓急。";
  const themeReply = themes.map(theme => {
    if (theme === "军事") return minister.skill === "练兵" || minister.skill === "军务" ? "若要动兵，请先定粮道、主帅与退路。" : "臣非专掌军旅，但也知兵事最忌仓促。";
    if (theme === "财政") return minister.skill === "理财" ? "钱粮之策可行，但需防地方层层加派。" : "财政一紧，百官与百姓都会先感到压力。";
    if (theme === "民生") return minister.skill === "安民" ? "安民之令要快，稽核要严，否则赈济会被胥吏吞没。" : "民生不可只写在诏书上，州县执行才是关键。";
    if (theme === "吏治") return minister.skill === "整肃" ? "整肃可行，但宜先立证据，再动人事，免得人人自危。" : "动官场必生反弹，陛下需准备后续任人。";
    if (theme === "文教") return minister.skill === "兴学" ? "兴学纳谏能收士心，但不宜让清议压倒政务。" : "文教可缓和人心，却不能替代钱粮兵甲。";
    if (theme === "通商") return minister.skill === "通海" ? "开市舶须配水师与税则，否则财源会变成乱源。" : "通商能生财，也会触怒守旧官绅。";
    if (theme === "宗室") return "宗室之事牵动国本，宜明法度，不宜只凭喜怒。";
    return "此事牵涉甚广，宜先试行，再推广。";
  }).join(" ");
  const loyaltyTone = minister.loyalty >= 75 ? "臣愿直言：" : minister.loyalty >= 45 ? "臣谨慎以对：" : "臣不敢尽言，只能略陈一二：";
  minister.loyalty = clamp(minister.loyalty + (themes.includes(minister.role) ? 2 : 0));
  return `${loyaltyTone}${eventHint} 眼下${risk}。${ministerStance(minister)} ${themeReply}`;
}

function talkToMinister() {
  if (!courtMinisters.length) return;
  const select = document.getElementById("talkMinisterSelect");
  const input = document.getElementById("talkInput");
  selectedMinisterIndex = Number(select.value || 0);
  const question = input.value.trim();
  if (!question) {
    alert("请先写下你要和臣子讨论的政事。");
    return;
  }
  const minister = courtMinisters[selectedMinisterIndex];
  dialogueHistory.push({ type: "ask", speaker: "皇帝", text: question });
  dialogueHistory.push({ type: "answer", speaker: minister.name, text: generateMinisterReply(minister, question) });
  input.value = "";
  renderMinisterList();
}

function recruitMinister() {
  if (!currentEra || decisionLocked) return;
  const available = talentPool.filter(t => !courtMinisters.some(m => m.name === t.name));
  if (!available.length) {
    alert("天下可招募的人才暂时已经尽入朝廷。");
    return;
  }
  if (state["国库"] < 8) {
    alert("国库不足，无法礼聘贤才。");
    return;
  }
  const talent = available[Math.floor(Math.random() * available.length)];
  courtMinisters.push({ ...talent, loyalty: 65 + Math.floor(Math.random() * 20) });
  state["国库"] = clamp(state["国库"] - 8);
  state["朝堂"] = clamp(state["朝堂"] + 2);
  history.unshift(`${shortDateLabel()}：陛下下诏求贤，礼聘${talent.name}入朝，专掌${talent.role}。`);
  renderStats();
  renderMinisterList();
  renderLog();
}

function dismissMinister(index) {
  if (!currentEra || decisionLocked) return;
  if (courtMinisters.length <= 1) {
    alert("朝中至少需要保留一名臣子辅政。");
    return;
  }
  const removed = courtMinisters.splice(index, 1)[0];
  state["朝堂"] = clamp(state["朝堂"] - 5);
  state["国库"] = clamp(state["国库"] + 2);
  history.unshift(`${shortDateLabel()}：陛下裁撤${removed.name}，节省俸禄，却使朝中人心浮动。`);
  renderStats();
  renderMinisterList();
  renderLog();
}

function dismissWeakMinister() {
  if (!courtMinisters.length) return;
  let index = 0;
  courtMinisters.forEach((m, i) => {
    if (m.loyalty < courtMinisters[index].loyalty) index = i;
  });
  dismissMinister(index);
}

function applyMinisterSupport(effect, input) {
  const text = input.toLowerCase();
  const support = {};
  courtMinisters.forEach(m => {
    const matched =
      (m.skill === "理财" && /税|钱|粮|国库|盐铁|商|清查/.test(text)) ||
      (m.skill === "练兵" && /兵|军|征|战|边|守|水师|剿/.test(text)) ||
      (m.skill === "安民" && /民|赈|减税|免税|安抚|赦|灾/.test(text)) ||
      (m.skill === "整肃" && /吏|贪|裁|考课|权臣|朋党|严查/.test(text)) ||
      (m.skill === "兴学" && /学|科举|文|史|言路|纳谏/.test(text)) ||
      (m.skill === "通海" && /海|市舶|通商|开海|水师/.test(text)) ||
      ["军务", "辅政"].includes(m.skill);
    if (matched) {
      Object.entries(m.bonus || {}).forEach(([key, value]) => {
        support[key] = (support[key] || 0) + Math.max(1, Math.round(value * (m.loyalty / 100)));
      });
      m.loyalty = clamp(m.loyalty + 1);
    } else {
      m.loyalty = clamp(m.loyalty - 1);
    }
  });
  Object.entries(support).forEach(([key, value]) => {
    effect[key] = (effect[key] || 0) + Math.min(value, 6);
  });
  return support;
}

function estimateInitialTerritory() {
  const avg = Math.round((currentEra.stats["民心"] + currentEra.stats["军力"] + currentEra.stats["朝堂"]) / 3);
  return clamp(avg);
}

function createInitialMap() {
  const names = pickRegionNames();
  const base = state["疆域"];
  return names.map((name, index) => {
    const borderPenalty = index > 4 ? 12 : index > 2 ? 6 : 0;
    const stability = clamp(base + 10 - borderPenalty - Math.floor(Math.random() * 12));
    return { name, stability, status: regionStatus(stability) };
  });
}

function pickRegionNames() {
  if (currentEra.id.includes("qing")) return ["京畿", "直隶", "江南", "湖广", "西北", "东北", "西南", "东南海疆"];
  if (currentEra.id.includes("song")) return ["京畿", "两浙", "江淮", "荆湖", "川蜀", "福建", "两广", "北方失地"];
  if (currentEra.id.includes("yuan")) return ["大都", "中原", "江南", "岭北", "辽阳", "甘肃", "云南", "吐蕃"];
  if (currentEra.id.includes("ming")) return ["京畿", "南京", "山东", "湖广", "辽东", "宣大", "西南", "东南海疆"];
  if (currentEra.id.includes("tang")) return ["长安", "洛阳", "河北", "河东", "西域", "剑南", "江南", "岭南"];
  if (currentEra.id.includes("han")) return ["长安洛阳", "关中", "河北", "中原", "河西", "西域", "巴蜀", "江南"];
  if (currentEra.id.includes("qin")) return ["咸阳", "关中", "中原", "齐鲁", "楚地", "燕赵", "岭南", "河套"];
  return ["王畿", "关中", "中原", "河北", "江南", "边塞", "西南", "东南"];
}

function regionStatus(stability) {
  if (stability <= 25) return "lost";
  if (stability <= 55) return "contested";
  return "secure";
}

function renderMap() {
  const mapGrid = document.getElementById("mapGrid");
  mapRegions.forEach(region => region.status = regionStatus(region.stability));

  const raster = getRasterMapInfo();
  if (raster) {
    mapGrid.innerHTML = `<img src="${raster.src}" alt="${raster.title}" class="raster-map" /><div class="map-source">${raster.title} · ${raster.source}</div>`;
  } else {
    const W = 520, H = 430;
    mapGrid.innerHTML = `<canvas id="mapCanvas" width="${W}" height="${H}"></canvas>`;
    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.scale(dpr, dpr);
    ctx.fillStyle = "#1a1208";
    ctx.fillRect(0, 0, W, H);

    const era = eraTerritories[currentEra.id] || { enemy: [], frontier: [], extEnemy: [] };
    const enemySet = new Set(era.enemy || []);
    const frontierSet = new Set(era.frontier || []);
    const extEnemySet = new Set(era.extEnemy || []);
    const INTERNAL_COUNT = 16;

    regionPolygons.forEach((rp, i) => {
      const isInternal = i < INTERNAL_COUNT;
      const region = isInternal ? mapRegions[i] : null;
      const isEnemy = enemySet.has(rp.name);
      const isFrontier = frontierSet.has(rp.name);
      const isExtEnemy = extEnemySet.has(rp.name);

      let color, strokeColor, textColor, labelExtra;
      if (isInternal) {
        if (isEnemy) { color = "rgba(40,80,160,0.55)"; }
        else if (region.status === "lost") { color = "rgba(157,45,34,0.55)"; }
        else if (region.status === "contested") { color = "rgba(200,160,60,0.55)"; }
        else { color = "rgba(70,160,70,0.55)"; }
        strokeColor = isEnemy ? "rgba(80,130,200,0.5)" : "rgba(232,197,106,0.35)";
        textColor = isEnemy ? "rgba(160,190,240,0.9)" : "rgba(255,240,200,0.9)";
        labelExtra = isEnemy ? "敌方" : "";
      } else {
        if (isEnemy || isExtEnemy) {
          color = "rgba(40,80,160,0.45)"; strokeColor = "rgba(80,130,200,0.4)";
          textColor = "rgba(160,190,240,0.85)"; labelExtra = "敌方";
        } else if (isFrontier) {
          color = "rgba(60,130,60,0.35)"; strokeColor = "rgba(100,180,100,0.35)";
          textColor = "rgba(180,230,180,0.85)"; labelExtra = "藩属";
        } else {
          color = "rgba(80,70,60,0.25)"; strokeColor = "rgba(120,110,100,0.25)";
          textColor = "rgba(160,150,140,0.6)"; labelExtra = "";
        }
      }

      const pts = rp.pts;
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = isInternal ? 8 : 4;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = isInternal ? 1.2 : 1;
      if (!isInternal && !(isEnemy || isExtEnemy || isFrontier)) { ctx.setLineDash([3, 3]); }
      else { ctx.setLineDash([]); }
      ctx.stroke();
      ctx.setLineDash([]);

      if (isEnemy || isExtEnemy) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
        ctx.closePath();
        ctx.clip();
        ctx.strokeStyle = "rgba(100,150,220,0.2)";
        ctx.lineWidth = 1;
        for (let x = -20; x < W + 20; x += 14) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - 20, H); ctx.stroke();
        }
        ctx.restore();
      }

      const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
      const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
      ctx.fillStyle = textColor;
      ctx.font = isInternal ? "bold 10px system-ui, sans-serif" : "9px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(rp.name, cx, cy);

      if (labelExtra) {
        ctx.fillStyle = textColor;
        ctx.font = "8px system-ui, sans-serif";
        ctx.fillText(labelExtra, cx, cy + 14);
      }
    });

    ctx.shadowBlur = 0;
    const legend = [
      { color: "rgba(70,160,70,0.55)", label: "可控" },
      { color: "rgba(200,160,60,0.55)", label: "动荡" },
      { color: "rgba(157,45,34,0.55)", label: "失守" },
      { color: "rgba(40,80,160,0.55)", label: "敌方" },
      { color: "rgba(60,130,60,0.35)", label: "藩属" },
      { color: "rgba(80,70,60,0.25)", label: "独立" }
    ];
    let lx = 10, ly = 14;
    legend.forEach(l => {
      ctx.fillStyle = l.color;
      ctx.fillRect(lx, ly - 8, 12, 12);
      ctx.strokeStyle = "rgba(232,197,106,0.3)";
      ctx.lineWidth = 0.5;
      ctx.strokeRect(lx, ly - 8, 12, 12);
      ctx.fillStyle = "rgba(255,240,200,0.8)";
      ctx.font = "9px system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(l.label, lx + 16, ly - 2);
      lx += 52;
      if (lx > W - 60) { lx = 10; ly += 18; }
    });
  }

  const era = eraTerritories[currentEra.id] || { enemy: [], frontier: [], extEnemy: [] };
  const enemySet = new Set(era.enemy || []);
  const lost = mapRegions.filter(r => r.status === "lost").length;
  const contested = mapRegions.filter(r => r.status === "contested").length;
  const statusTags = mapRegions.map((region, i) => {
    const isE = enemySet.has(region.name);
    if (isE) return "";
    const label = region.status === "secure" ? "稳固" : region.status === "contested" ? "动荡" : "失守";
    const cls = region.status === "secure" ? "secure" : region.status === "contested" ? "contested" : "lost";
    return `<span class="${cls}">${region.name} ${label}</span>`;
  }).filter(Boolean).join("");
  document.getElementById("mapNote").textContent = lost
    ? `已有 ${lost} 处失守、${contested} 处动荡。若疆域跌破底线，王朝会提前崩溃。`
    : `当前 ${contested} 处动荡。军事、民心、朝堂与财政都会影响版图稳定。`;
  document.getElementById("mapNote").innerHTML += `<div class="map-status-list">${statusTags}</div>`;
}

function battleSituation() {
  const lost = mapRegions.filter(r => r.status === "lost");
  const contested = mapRegions.filter(r => r.status === "contested");
  const weakest = [...mapRegions].sort((a, b) => a.stability - b.stability)[0];
  if (lost.length) {
    return {
      level: "危急",
      text: `${lost.map(r => r.name).slice(0, 2).join("、")}已经失守，${contested.length ? contested[0].name + "仍在动荡" : "其余各地急修城防"}。军力${state["军力"]}，边军请求朝廷速定攻守之策。`
    };
  }
  if (contested.length >= 3 || state["军力"] < 35) {
    return {
      level: "吃紧",
      text: `${contested.map(r => r.name).slice(0, 3).join("、")}局势不稳，斥候回报敌骑与流寇活动频繁。军力${state["军力"]}，诸将主张先固守要地。`
    };
  }
  if (contested.length) {
    return {
      level: "边警",
      text: `${weakest.name}最为不稳，地方奏称粮道与军心仍需整顿。朝廷若能补足钱粮，战局尚可控制。`
    };
  }
  return {
    level: "平稳",
    text: `诸路边报暂未见大规模战事，军力${state["军力"]}，疆域${state["疆域"]}。兵部建议趁此整军、修械、储粮。`
  };
}

function dailyVariant(seed, list) {
  let hash = 0;
  for (let i = 0; i < seed.length; i++) hash = (hash + seed.charCodeAt(i) * (i + 5)) % 7919;
  return list[hash % list.length];
}

function pickEvent() {
  if (usedEvents.length >= eventTemplates.length) usedEvents = [];
  const available = eventTemplates.filter((_, i) => !usedEvents.includes(i));
  const evt = available[Math.floor(Math.random() * available.length)];
  usedEvents.push(eventTemplates.indexOf(evt));
  return JSON.parse(JSON.stringify(evt));
}

function pickCourtEvents() {
  const count = Math.floor(Math.random() * 4);
  const presenters = courtMinisters.length ? courtMinisters : [{ name: "值殿官", role: "政务", skill: "辅政" }];
  const events = [];
  for (let i = 0; i < count; i++) {
    const event = pickEvent();
    const presenter = presenters[(day + i) % presenters.length];
    events.push({ ...event, presenter: presenter.name, presenterRole: presenter.role });
  }
  return events;
}

function buildCourtEvent(events) {
  if (!events.length) {

      title: "今日无大事",

      keywords: {},
      outcomes: { default: "今日虽无急奏，陛下仍以圣旨调整国政，朝廷各部奉命办理。" }
    };
  }
  const merged = { title: `今日上朝：${events.length}件奏事`, type: "朝会奏事", text: "", keywords: {}, outcomes: { default: "陛下综合今日诸臣奏事，下旨处置，朝廷各部随即分头执行。" } };
  merged.text = events.map((event, index) => `${index + 1}. ${event.presenter}奏：${event.title}。${event.text}`).join("\n");
  events.forEach(event => {
    Object.assign(merged.keywords, event.keywords || {});
    Object.assign(merged.outcomes, event.outcomes || {});
  });
  return merged;
}

function deriveTerritoryDelta(effect, input) {
  const text = input.toLowerCase();
  let delta = Math.round(((effect["军力"] || 0) * 0.45 + (effect["民心"] || 0) * 0.3 + (effect["朝堂"] || 0) * 0.2 + (effect["国库"] || 0) * 0.12) / 2);
  if (/亲征|出征|出兵|勤王|坚守|筑城|水师|巡海|收复|平叛|剿灭|练兵/.test(text)) delta += 3;
  if (/迁都|南迁|议和|求和|纳贡|割地|放任|禁海|闭关/.test(text)) delta -= 4;
  if (/赈灾|减税|免税|安抚|招安|开仓|以工代赈/.test(text)) delta += 2;
  if (currentEvent.type.includes("存亡") || currentEvent.type.includes("军国") || currentEvent.type.includes("边")) {
    delta += Math.round((effect["军力"] || 0) / 4);
  }
  return Math.max(-12, Math.min(12, delta));
}

function updateMapAfterDecision(effect, territoryDelta, input) {
  const text = input.toLowerCase();
  const targetFrontier = /边|塞|辽|西域|海|北|南|江|河|关|京|中原/.test(text);
  const sorted = [...mapRegions].sort((a, b) => a.stability - b.stability);
  const targets = targetFrontier ? sorted.slice(0, 3) : sorted.slice(0, 2);
  const dailyPressure = Math.round(((state["民心"] - 50) + (state["军力"] - 50) + (state["朝堂"] - 50)) / 35);

  mapRegions.forEach((region, index) => {
    let change = Math.round(dailyPressure / 2);
    if (targets.includes(region)) change += territoryDelta;
    if (index > 4 && (currentEvent.type.includes("边") || currentEvent.type.includes("入侵") || currentEvent.type.includes("存亡"))) change -= 3;
    region.stability = clamp(region.stability + change);
    region.status = regionStatus(region.stability);
  });

  const avg = Math.round(mapRegions.reduce((sum, region) => sum + region.stability, 0) / mapRegions.length);
  state["疆域"] = clamp(Math.round((state["疆域"] * 0.45) + (avg * 0.55)));
}

function parseDecision(input) {
  const text = input.toLowerCase();
  let effect = {};
  let matchedKeywords = [];
  let outcomeKey = "default";

  for (const [keyword, eff] of Object.entries(currentEvent.keywords)) {
    if (text.includes(keyword)) {
      matchedKeywords.push(keyword);
      for (const [k, v] of Object.entries(eff)) {
        effect[k] = (effect[k] || 0) + v;
      }
      if (outcomeKey === "default" && currentEvent.outcomes[keyword]) {
        outcomeKey = keyword;
      }
    }
  }

  // 如果没有匹配到任何关键词，给默认效果
  if (matchedKeywords.length === 0) {
    effect = { 国库: -2, 民心: 2, 朝堂: 1, 文治: 1, 军力: 0 };
    outcomeKey = "default";
  }

  // 如果输入太短，效果打折
  if (text.length < 5) {
    for (const k of Object.keys(effect)) {
      effect[k] = Math.round(effect[k] * 0.5);
    }
  }

  return { effect, outcomeKey, matchedKeywords };
}

function detectPolicyThemes(input) {
  const text = input.toLowerCase();
  const themes = [];
  if (/兵|军|征|战|边|守|勤王|亲征|剿|水师|练兵/.test(text)) themes.push("军事");
  if (/税|钱|粮|国库|盐铁|商|清查|俸|财政|铸钱/.test(text)) themes.push("财政");
  if (/民|赈|灾|减税|免税|安抚|赦|流民|屯田|以工代赈/.test(text)) themes.push("民生");
  if (/吏|贪|裁|考课|权臣|朋党|削权|严查|钦差/.test(text)) themes.push("吏治");
  if (/学|科举|文|史|言路|纳谏|太学|修史/.test(text)) themes.push("文教");
  if (/海|市舶|通商|开海|禁海|闭关|互市/.test(text)) themes.push("通商");
  if (/立储|太子|宗室|削藩|分封|皇子/.test(text)) themes.push("宗室");
  if (!themes.length) themes.push("综合政务");
  return themes;
}

function topEffectNames(effect) {
  return Object.entries(effect)
    .filter(([, value]) => value !== 0)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
    .slice(0, 3)
    .map(([name, value]) => `${name}${value > 0 ? "上升" : "下降"}`);
}

function pickVariant(input, list) {
  let hash = 0;
  for (let i = 0; i < input.length; i++) hash = (hash + input.charCodeAt(i) * (i + 3)) % 9973;
  return list[hash % list.length];
}

function generateDynamicOutcome(input, effect, matchedKeywords, support) {
  const themes = detectPolicyThemes(input);
  const majorEffects = topEffectNames(effect);
  const decree = input.length > 46 ? `${input.slice(0, 46)}……` : input;
  const lead = pickVariant(input, [
    `圣旨下达后，中书省连夜拟诏，地方官依旨而行。`,
    `诏书传出宫门，朝野立即围绕此令展开执行与争论。`,
    `陛下此令没有沿用旧议，而是按自己的判断重新定策。`,
    `廷议既定，六部各领其事，边郡与州县陆续收到明诏。`
  ]);
  const themeText = {
    军事: pickVariant(input + "军", ["军中士气被重新鼓动，但粮饷与调度压力随之加重。", "边将认为此策可争主动，保守大臣则担心战线过长。", "禁军与地方兵马开始整编，边境局势出现新的变化。"]),
    财政: pickVariant(input + "财", ["户部很快见到成效，但民间与商贾对新令反应不一。", "钱粮出入被重新核算，短期可解燃眉之急，长期仍需制度配合。", "财政压力有所转移，朝中既得利益者开始暗中观望。"]),
    民生: pickVariant(input + "民", ["灾民和州县百姓最先感到变化，民怨稍缓，但国库承压。", "地方执行好坏差异明显，百姓是否真正受益还要看后续稽核。", "此令得民心，却也让部分官员担心开支难以为继。"]),
    吏治: pickVariant(input + "吏", ["官场风气为之一紧，能吏得以上前，庸吏开始自危。", "朝堂表面肃然，私下却有不少官员互相试探风向。", "整顿触及旧有关系网，政令威力增强，也带来新的阻力。"]),
    文教: pickVariant(input + "文", ["士林对此反应热烈，文教声望上升，但见效不会立竿见影。", "太学与地方学官开始行动，读书人对朝廷多了几分期待。", "言路与教化被重新纳入制度，朝廷名声有所改善。"]),
    通商: pickVariant(input + "商", ["沿海与边市开始活跃，商税有望增加，但守旧派颇有微词。", "商旅闻风而动，地方关卡也随之忙碌起来。", "通商带来财源，也带来治安、海防与风俗争论。"]),
    宗室: pickVariant(input + "宗", ["宗室与东宫势力被重新排列，宫廷表面平静，暗处波澜未止。", "储位与藩权牵动国本，朝臣不敢明言，却都在重新站队。", "此策暂时压住内廷纷争，但宗亲诸王未必心服。"]),
    综合政务: pickVariant(input + "政", ["此令涉及面广，各部执行轻重不一，效果需要数月才能显现。", "朝臣一时难判利弊，但都意识到陛下开始亲自重塑政局。", "地方官先行试探执行，天下观望朝廷后续态度。"])
  };
  const themeSentence = themes.map(theme => themeText[theme]).join(" ");
  const supportSentence = Object.keys(support).length
    ? ` ${Object.keys(support).join("、")}等方面得到朝臣辅佐，执行阻力有所降低。`
    : ` 由于缺少对口臣子支撑，此令执行更多依赖皇帝威望与地方官自觉。`;
  const effectSentence = majorEffects.length
    ? ` 史官记下，此策最直接的影响是：${majorEffects.join("、")}。`
    : ` 史官记下，此策影响温和，未立刻改变国势。`;
  const keywordSentence = matchedKeywords.length
    ? ` 朝廷将此令归入“${matchedKeywords.slice(0, 4).join("、")}”等政务办理。`
    : ` 因圣旨不属旧例，六部只能按综合政务临时会办。`;
  return `“${decree}” ${lead} ${themeSentence}${supportSentence}${effectSentence}${keywordSentence}`;
}

function submitDecision() {
  if (decisionLocked || !currentEvent) return;
  const input = document.getElementById("playerInput").value.trim();
  if (!input) {
    alert("请写下你的圣旨。");
    return;
  }
  decisionLocked = true;
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;

  const { effect, outcomeKey, matchedKeywords } = parseDecision(input);
  const support = applyMinisterSupport(effect, input);
  const territoryDelta = deriveTerritoryDelta(effect, input);
  effect["疆域"] = (effect["疆域"] || 0) + territoryDelta;

  for (const [key, value] of Object.entries(effect)) {
    state[key] = clamp((state[key] ?? 50) + value);
  }
  updateMapAfterDecision(effect, territoryDelta, input);

  const fallbackOutcome = currentEvent.outcomes[outcomeKey] || currentEvent.outcomes.default;
  const outcomeText = generateDynamicOutcome(input, effect, matchedKeywords, support) || fallbackOutcome;
  history.unshift(`${shortDateLabel()}：${outcomeText}`);

  // 显示结果
  document.getElementById("outcomeText").textContent = outcomeText;
  const changesBox = document.getElementById("outcomeChanges");
  const ministerNote = Object.keys(support).length
    ? `<span class="change-tag change-neu">臣子辅政：${Object.keys(support).join("、")}</span>`
    : `<span class="change-tag change-neu">臣子未形成明显助力</span>`;
  changesBox.innerHTML = Object.entries(effect).map(([k, v]) => {
    const cls = v > 0 ? "change-up" : v < 0 ? "change-down" : "change-neu";
    const sign = v > 0 ? "+" : "";
    return `<span class="change-tag ${cls}">${k} ${sign}${v}</span>`;
  }).join("") + ministerNote;
  document.getElementById("outcomeBox").style.display = "block";
  document.getElementById("submitBtn").style.display = "none";

  renderStats();
  renderMap();
  renderRegionMap();
  renderCourtReports();
  renderMinisterList();
  renderLog();

  day += 1;

  setTimeout(() => {
    document.getElementById("playerInput").value = "";
    if (hasCollapsed() || day > maxDays) {
      endGame();
    } else {
      nextEvent();
    }
  }, 2000);
}

function hasCollapsed() {
  return statNames.some(name => state[name] <= 5);
}

function score() {
  return Math.round(statNames.reduce((sum, name) => sum + state[name], 0) / statNames.length);
}

function endGame() {
  showScreen("endScreen");
  const finalScore = score();
  let title = "";
  let text = "";

  if (hasCollapsed()) {
    const weakest = statNames.slice().sort((a, b) => state[a] - state[b])[0];
    title = "社稷倾危";
    text = `由于"${weakest}"跌至崩溃边缘，朝野失序，天下动荡。史官记下：陛下有雄心，却未能平衡国本。`;
  } else if (finalScore >= 82) {
    title = "千古一帝";
    text = `十年之间，国库充盈、民心归附、武备强盛、朝堂有序、文教昌明。史官称你为能开万世太平的雄主。`;
  } else if (finalScore >= 68) {
    title = "中兴明君";
    text = `你在危机中多次做出稳健裁断，使王朝走向复兴。虽仍有隐忧，但天下愿意相信你的下一道圣旨。`;
  } else if (finalScore >= 52) {
    title = "守成之主";
    text = `你的统治没有倾覆社稷，也未能彻底革新天下。史书评价你谨慎有余，开创不足。`;
  } else {
    title = "多事之君";
    text = `十年政局起伏，百姓和群臣都承受了沉重代价。王朝尚未崩坏，但已埋下后世之患。`;
  }

  document.getElementById("endingTitle").textContent = title;
  document.getElementById("endingText").textContent = text;
  document.getElementById("summaryGrid").innerHTML = statNames.map(name => `
    <div class="summary-item">
      <b>${state[name]}</b>
      <span>${name}</span>
    </div>
  `).join("");
}

function renderLog() {
  const log = document.getElementById("historyLog");
  log.innerHTML = history.slice(0, 10).map(item => `<p>${item}</p>`).join("");
}

function restart() {
  if (currentEra) startGame(currentEra.id);
  else backToStart();
}

function backToStart() {
  currentEra = null;
  showScreen("startScreen");
}

// 回车提交
document.addEventListener("DOMContentLoaded", () => {
  renderEras();
  document.getElementById("playerInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitDecision();
    }
  });
  document.getElementById("talkInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      talkToMinister();
    }
  });
});
</script>
