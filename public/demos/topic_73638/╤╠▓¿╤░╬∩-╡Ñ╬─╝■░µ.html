阻塞不通技术林；杜门临宫物闭塞，堵塞隐蔽技术寻。",explanation:"杜门临宫，物品在堵塞、隐蔽、不通畅之处，如抽屉深处、被堵住的地方、技术设备或文件柜中。"},{key:"景门",book:"《烟波钓叟歌》",content:"景门南方火光明，文书信息电子情；景门临宫明亮处，文书电子窗旁寻。",explanation:"景门临宫，物品在明亮处、窗边、电子设备旁、文书文件堆中、有光亮或红色装饰处。"},{key:"死门",book:"《御定奇门宝鉴》",content:"死门坤土静不动，地皮坟土旧物踪；死门临宫物不动，地面角落旧物封。",explanation:"死门临宫，物品静止在地面、角落、旧物堆中，紧贴地皮或不动之处，需要翻找旧物、死角落。"},{key:"惊门",book:"《奇门遁甲统宗大全》",content:"惊门口舌声响间，金属开口西方边；惊门临宫声响处，门口金属开口间。",explanation:"惊门临宫，物品在有声音的地方、门口、开口容器中，金属硬物旁，或在能发出声响的物品附近。"},{key:"开门",book:"《烟波钓叟歌》",content:"开门金气通四方，公开开阔大门旁；开门临宫开阔处，门口开阔开放场。",explanation:"开门临宫，物品在开阔明亮处、门口、大门边、开放空间，或在公开显眼之处，易于被看见。"},{key:"天蓬",book:"《烟波钓叟歌》",content:"蓬星北水暗阴贼，大蓬水处暗昧黑；天蓬临宫近水处，阴暗遮挡大件堆。",explanation:"天蓬星临宫，物品在靠近水的地方、阴暗潮湿处，或被大件物品遮挡，位置偏低偏暗。"},{key:"天芮",book:"《奇门旨归》",content:"芮星坤土病符星，低矮污秽杂物停；天芮临宫低处是，地面杂物内室寻。",explanation:"天芮星临宫，物品在低处、接近地面，或在杂物堆积处、内室、有病气或药的地方。"},{key:"天冲",book:"《奇门遁甲统宗大全》",content:"冲星震动木东方，冲动门窗高处扬；天冲临宫高动处，门窗声响运动场。",explanation:"天冲星临宫，物品在较高处或正在移动的地方，靠近门窗、有震动声响之处，运动器材附近。"},{key:"天辅",book:"《御定奇门宝鉴》",content:"辅星木气文雅风，草木文书教育宫；天辅临宫文雅处，草木书架文书丛。",explanation:"天辅星临宫，物品在有植物草木处、书架文具旁、教育文化相关物品附近，文雅整洁之处。"},{key:"天禽",book:"《奇门旨归》",content:"禽星中宫居中央，土德包容包裹藏；天禽临宫中央位，地面包裹容器藏。",explanation:"天禽星临宫，物品在房间中央、地面上，或被其他物品包裹、装在容器中，被覆盖盖住。"},{key:"天心",book:"《烟波钓叟歌》",content:"心星金气医道高，高贵圆形金属交；天心临宫高重位，金属医药高处找。",explanation:"天心星临宫，物品在较高处或重要位置，靠近金属、医药、圆形物品旁，或贵重物品周围。"},{key:"天柱",book:"《奇门遁甲统宗大全》",content:"柱星金气破柱声，高柱金属破损惊；天柱临宫高柱旁，柱边金属破损停。",explanation:"天柱星临宫，物品在高处、靠近柱子、直立柱状物体旁，或金属硬物边，有破损残缺之处。"},{key:"天任",book:"《御定奇门宝鉴》",content:"任星艮土山岗稳，墙角土黄稳定存；天任临宫稳定处，墙角山丘土色分。",explanation:"天任星临宫，物品在稳定不动之处、墙角、靠近土黄色物品或山形物旁，位置静止未被移动。"},{key:"天英",book:"《烟波钓叟歌》",content:"英星南火明最灿，火明电子高处看；天英临宫光明处，电器火源高处安。",explanation:"天英星临宫，物品在明亮处、高处，靠近电器、火源、热闹光亮之处，红色物品旁。"},{key:"recover_high",book:"《奇门旨归》",content:"日干时干相比和，失物未远去无多；时来生干物自返，不劳费力笑呵呵。",explanation:"日干时干比和或时干生日干，失物未远去，找回概率高，可能自行出现，或在熟悉的近处。"},{key:"recover_medium",book:"《奇门遁甲统宗大全》",content:"日生时干费力寻，我去生它劳寸心；日克时干终可得，费尽周折物尚存。",explanation:"日干生时干或克时干，需要主动费力寻找，但物品尚在，经努力后可以找回，只是费些周折。"},{key:"recover_low",book
