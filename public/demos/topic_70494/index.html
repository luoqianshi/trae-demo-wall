<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Lab - 图纸处理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo 区域 */
        .logo-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px 30px;
            background-color: #0a0a0a;
        }

        .logo-section img {
            max-width: 300px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(192, 192, 192, 0.15));
        }

        /* 主内容区域 */
        .main-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 20px 30px 50px;
            justify-content: center;
        }

        /* 面板通用样式 */
        .panel {
            flex: 1;
            min-width: 340px;
            max-width: 560px;
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 30px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .panel:hover {
            border-color: #3a3a3a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            color: #f0f0f0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        /* 图标 */
        .icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #3a3a3a;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background-color: #0f0f0f;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #a0a0a0;
            background-color: #1a1a1a;
        }

        .upload-area.dragover {
            border-color: #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .upload-text {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: #666;
        }

        .upload-formats {
            display: inline-block;
            background-color: #222;
            color: #bbb;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 12px;
            font-weight: 500;
        }

        input[type="file"] {
            display: none;
        }

        /* 上传来源选项 */
        .source-options {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .source-btn {
            flex: 1;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #bbb;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .source-btn:hover {
            background-color: #222;
            border-color: #555;
            color: #fff;
        }

        .source-btn .source-icon {
            font-size: 24px;
        }

        /* 文件列表 */
        .file-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-name {
            font-size: 14px;
            color: #ddd;
        }

        .file-size {
            font-size: 12px;
            color: #666;
        }

        .file-remove {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }

        .file-remove:hover {
            color: #ff6b6b;
        }

        /* 图层表单区域 */
        .layer-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .layer-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .layer-label {
            font-size: 14px;
            color: #bbb;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .layer-label .label-icon {
            font-size: 16px;
        }

        .layer-field input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            transition: border-color 0.3s;
        }

        .layer-field input:focus {
            outline: none;
            border-color: #888;
        }

        .layer-field input::placeholder {
            color: #555;
        }

        /* 图层工具栏 */
        .layer-toolbar {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .layer-btn {
            padding: 8px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #bbb;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .layer-btn:hover {
            background-color: #252525;
            border-color: #555;
            color: #fff;
        }

        .layer-btn.primary {
            background-color: #2563eb;
            border-color: #2563eb;
            color: #fff;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
        }

        .layer-btn.primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                padding: 15px;
            }

            .panel {
                min-width: 100%;
                max-width: 100%;
            }

            .source-options {
                flex-direction: column;
            }

            .logo-section img {
                max-width: 200px;
            }
        }

        /* URL输入模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #f0f0f0;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #888;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn.cancel {
            background-color: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
        }

        .modal-btn.cancel:hover {
            border-color: #555;
            color: #ccc;
        }

        .modal-btn.confirm {
            background-color: #2a2a2a;
            border: 1px solid #555;
            color: #f0f0f0;
        }

        .modal-btn.confirm:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <!-- Logo 区域 -->
    <div class="logo-section">
        <img src="omega_lab_logo.png" alt="Omega Lab Logo">
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <!-- 左侧：上传图纸窗口 -->
        <div class="panel">
            <div class="panel-title">
                <span class="icon">📐</span>
                上传图纸
            </div>
            <div class="panel-subtitle">支持 DWG、DXF 格式图纸上传与解析</div>

            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📁</div>
                <div class="upload-text">拖放文件到此处，或点击选择文件</div>
                <div class="upload-hint">支持从本地文件系统拖入图纸</div>
                <div class="upload-formats">.DWG &nbsp; .DXF</div>
            </div>
            <input type="file" id="fileInput" accept=".dwg,.dxf,.DWG,.DXF">

            <div class="source-options">
                <button class="source-btn" onclick="document.getElementById('fileInput').click()">
                    <span class="source-icon">💻</span>
                    <span>本地上传</span>
                </button>
                <button class="source-btn" id="webUploadBtn">
                    <span class="source-icon">🌐</span>
                    <span>网页链接</span>
                </button>
            </div>

            <div class="file-list" id="fileList"></div>
        </div>

        <!-- 右侧：图纸图层输入窗口 -->
        <div class="panel">
            <div class="panel-title">
                <span class="icon">🗂️</span>
                图纸图层输入
            </div>
            <div class="panel-subtitle">按结构类型输入对应的图纸图层名称</div>

            <div class="layer-form">
                <div class="layer-field">
                    <label class="layer-label">
                        <span class="label-icon">🏗️</span>
                        梁图层
                    </label>
                    <input type="text" id="layerBeam" placeholder="例如：BEAM、梁、XSL">
                </div>
                <div class="layer-field">
                    <label class="layer-label">
                        <span class="label-icon">🧱</span>
                        墙柱图层
                    </label>
                    <input type="text" id="layerWallCol" placeholder="例如：WALL、COL、墙柱、QZ">
                </div>
                <div class="layer-field">
                    <label class="layer-label">
                        <span class="label-icon">⬜</span>
                        板图层
                    </label>
                    <input type="text" id="layerSlab" placeholder="例如：SLAB、板、FLOOR、LB">
                </div>
                <div class="layer-field">
                    <label class="layer-label">
                        <span class="label-icon">🔩</span>
                        基础图层
                    </label>
                    <input type="text" id="layerFoundation" placeholder="例如：FOUND、基础、JC、BASE">
                </div>
                <div class="layer-field">
                    <label class="layer-label">
                        <span class="label-icon">📏</span>
                        标注图层
                    </label>
                    <input type="text" id="layerDim" placeholder="例如：DIM、标注、BZ、DIMENSION">
                </div>
            </div>

            <div class="layer-toolbar">
                <button class="layer-btn" onclick="fillSampleLayers()">示例数据</button>
                <button class="layer-btn" onclick="clearLayerFields()">清空</button>
                <button class="layer-btn primary" onclick="processLayers()">提取工程量</button>
            </div>
        </div>
    </div>

    <!-- URL 输入模态框 -->
    <div class="modal-overlay" id="urlModal">
        <div class="modal">
            <div class="modal-title">从网页链接导入图纸</div>
            <input type="text" class="modal-input" id="urlInput" placeholder="请输入图纸文件的 URL 地址">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelBtn">取消</button>
                <button class="modal-btn confirm" id="confirmBtn">确认</button>
            </div>
        </div>
    </div>

    <script>
        // 文件上传相关
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const urlModal = document.getElementById('urlModal');
        const webUploadBtn = document.getElementById('webUploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const urlInput = document.getElementById('urlInput');

        let files = [];

        // 拖放事件
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const droppedFiles = Array.from(e.dataTransfer.files).filter(file => 
                file.name.endsWith('.dwg') || file.name.endsWith('.dxf') ||
                file.name.endsWith('.DWG') || file.name.endsWith('.DXF')
            );
            droppedFiles.forEach(file => addFile(file));
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => addFile(file));
            fileInput.value = '';
        });

        function addFile(file) {
            if (!files.find(f => f.name === file.name && f.size === file.size)) {
                files.push(file);
                renderFileList();
            }
        }

        function removeFile(index) {
            files.splice(index, 1);
            renderFileList();
        }

        function renderFileList() {
            fileList.innerHTML = files.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">📄</span>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <button class="file-remove" onclick="removeFile(${index})">✕</button>
                </div>
            `).join('');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // URL 模态框
        webUploadBtn.addEventListener('click', () => {
            urlModal.classList.add('active');
            urlInput.focus();
        });

        cancelBtn.addEventListener('click', () => {
            urlModal.classList.remove('active');
            urlInput.value = '';
        });

        confirmBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) {
                // 模拟从URL获取文件
                const fileName = url.split('/').pop() || 'downloaded.dwg';
                const mockFile = { name: fileName, size: 0, url: url };
                addFile(mockFile);
                urlModal.classList.remove('active');
                urlInput.value = '';
            }
        });

        urlModal.addEventListener('click', (e) => {
            if (e.target === urlModal) {
                urlModal.classList.remove('active');
            }
        });

        // 图层输入相关
        const layerBeam = document.getElementById('layerBeam');
        const layerWallCol = document.getElementById('layerWallCol');
        const layerSlab = document.getElementById('layerSlab');
        const layerFoundation = document.getElementById('layerFoundation');
        const layerDim = document.getElementById('layerDim');

        const layerFields = [
            { el: layerBeam, name: '梁图层', sample: 'BEAM' },
            { el: layerWallCol, name: '墙柱图层', sample: 'WALL_COL' },
            { el: layerSlab, name: '板图层', sample: 'SLAB' },
            { el: layerFoundation, name: '基础图层', sample: 'FOUND' },
            { el: layerDim, name: '标注图层', sample: 'DIM' }
        ];

        function fillSampleLayers() {
            layerBeam.value = 'BEAM';
            layerWallCol.value = 'WALL_COL';
            layerSlab.value = 'SLAB';
            layerFoundation.value = 'FOUND';
            layerDim.value = 'DIM';
        }

        function clearLayerFields() {
            const hasValue = layerFields.some(f => f.el.value.trim());
            if (hasValue && !confirm('确定要清空所有图层输入吗？')) {
                return;
            }
            layerFields.forEach(f => f.el.value = '');
        }

        function processLayers() {
            const results = [];
            layerFields.forEach(f => {
                const val = f.el.value.trim();
                if (val) {
                    results.push(`${f.name}：${val}`);
                }
            });
            if (results.length === 0) {
                alert('请至少填写一个图层名称');
                return;
            }
            alert(`已处理以下图层：\n\n${results.join('\n')}`);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                urlModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
