    function getLunarDate(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();
      
      let baseDate = new Date(1900, 0, 31);
      let offset = Math.floor((date - baseDate) / 86400000);
      
      let i, leap = 0, temp = 0;
      let yearCyl, monCyl, dayCyl;
      let yearLunar = 1900;
      
      for (i = 1900; i < 2101 && offset > 0; i++) {
        temp = lYearDays(i);
        offset -= temp;
        yearLunar = i;
      }
      if (offset < 0) {
        offset += temp;
        yearLunar--;
      }
      
      yearCyl = yearLunar - 1900 + 36;
      
      leap = leapMonth(yearLunar);
      let isLeap = false;
      let monthLunar = 1;
      for (i = 1; i < 13 && offset > 0; i++) {
        if (leap > 0 && i === (leap + 1) && isLeap === false) {
          --i;
          isLeap = true;
          temp = leapDays(yearLunar);
        } else {
          temp = monthDays(yearLunar, i);
        }
        
        if (isLeap === true && i === (leap + 1)) isLeap = false;
        offset -= temp;
        monthLunar = i;
      }
      
      if (offset === 0 && leap > 0 && i === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --monthLunar;
        }
      }
      
      if (offset < 0) {
        offset += temp;
        --monthLunar;
      }
      
      const dayLunar = offset + 1;
      
      return {
        year: yearLunar,
        month: monthLunar,
        day: dayLunar,
        isLeap: isLeap,
        yearGanZhi: cyclical(yearCyl),
        zodiac: chineseZodiac[(yearLunar - 1900) % 12],
        monthStr: (isLeap ? '闰' : '') + lunarMonths[monthLunar - 1] + '月',
        dayStr: lunarDays[dayLunar - 1]
      };
    }

    function lYearDays(y) {
      let i, sum = 348;
      for (i = 0x8000; i > 0x8; i >>= 1) {
        sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
      }
      return (sum + leapDays(y));
    }

    function leapMonth(y) {
      return (lunarInfo[y - 1900] & 0xf);
    }

    function leapDays(y) {
      if (leapMonth(y)) {
        return ((lunarInfo[y - 1900] & 0x10000) ? 30 : 29);
      } else {
        return (0);
      }
    }

    function monthDays(y, m) {
      return ((lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29);
    }

    function cyclical(num) {
      return (Gan[num % 10] + Zhi[num % 12]);
    }

    function getHealthSuggestions(records) {
      const suggestions = [];
      let dietSuggestions = [];
      let dietTitle = null;
      let dietIcon = null;
      
      if (records.length === 0) {
        return {

      const today = new Date();
      const last7Days = records.filter(r => {
        const recordDate = new Date(r.date);
        return getDaysDiff(recordDate, today) <= 7;
      });

      const shapeCounts = {};
      const hardnessCounts = {};

      if (dominantShape && DietPlans[dominantShape]) {

        dietIcon = plan.icon;
        dietSuggestions = [...plan.suggestions];

    const CalendarView = ({ currentDate, records, onDateSelect, viewMode }) => {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startDayOfWeek = firstDay.getDay();
      
      const calendarDays = [];
      
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const day = prevMonthLastDay - i;
        const date = new Date(year, month - 1, day);
        calendarDays.push({ date, isCurrentMonth: false });
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        calendarDays.push({ date, isCurrentMonth: true });
      }
      
      const remainingDays = 42 - calendarDays.length;
      for (let day = 1; day <= remainingDays; day++) {
        const date = new Date(year, month + 1, day);
        calendarDays.push({ date, isCurrentMonth: false });
      }

      return (
        <div className="apple-card rounded-3xl apple-shadow-md p-5">
          <div className="flex items-center justify-between mb-6">
            <h2 className="text-xl font-semibold text-gray-800">

                {d}

            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">

              const dateStr = formatDate(date);
              const dayRecords = records.filter(r => r.date === dateStr);
              const count = dayRecords.length;
              const isToday = formatDate(date) === formatDate(new Date());
              const isSelected = formatDate(date) === formatDate(currentDate);
              
              return (
                <button

                <div className="flex items-center">
                  <span className="text-2xl mr-4">{Icons.share}</span>
                  <span className="font-medium text-gray-700">分享本月</span>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
            </div>

            <div className="apple-card rounded-3xl apple-shadow-md overflow-hidden">
              <button
                onClick={() => setShowDietaryRestrictions(true)}
                className="w-full p-5 flex items-center justify-between hover:bg-gray-50/50 transition-all"
              >
                <div className="flex items-center">
                  <span className="text-2xl mr-4">🚫</span>
                  <div>
                    <p className="font-medium text-gray-700">忌口</p>
                    <p className="text-xs text-gray-400 mt-1">
                      {selectedRestrictions.length > 0 ? selectedRestrictions.join('、') : '暂无忌口'}
                    </p>
                  </div>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
              <div className="border-t border-gray-100"></div>
              <button
                onClick={() => setShowRecentDiet(true)}
                className="w-full p-5 flex items-center justify-between hover:bg-gray-50/50 transition-all"
              >
                <div className="flex items-center">
                  <span className="text-2xl mr-4">📝</span>
                  <div>
                    <p className="font-medium text-gray-700">近期饮食记录</p>
                    <p className="text-xs text-gray-400 mt-1">
                      最近一个月共记录 {recentDietRecords.length} 天
                    </p>
                  </div>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
              <div className="border-t border-gray-100"></div>
              <button
                onClick={() => setShowGiConditionPicker(true)}
                className="w-full p-5 flex items-center justify-between hover:bg-gray-50/50 transition-all"
              >
                <div className="flex items-center">
                  <span className="text-2xl mr-4">🩺</span>
                  <div>
                    <p className="font-medium text-gray-700">肠胃状况</p>
                    <p className="text-xs text-gray-400 mt-1">
                      {user?.giCondition === 'none' ? '无' : 
                       user?.giCondition === 'ibs' ? '肠易激综合征' : 
                       user?.giCondition === 'gastritis' ? '胃炎' : 
                       user?.giCondition === 'colitis' ? '肠炎' : 
                       user?.giCondition === 'hemorrhoids' ? '痔疮' : 
                       user?.giCondition?.startsWith('other:') ? user.giCondition.substring(6) : '未设置'}
                    </p>
                  </div>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
            </div>

            <div className="apple-card rounded-3xl apple-shadow-md overflow-hidden">
              <button
                onClick={onExport}
                className="w-full p-5 flex items-center justify-between hover:bg-gray-50/50 transition-all"
              >
                <div className="flex items-center">
                  <span className="text-2xl mr-4">{Icons.export}</span>
                  <span className="font-medium text-gray-700">导出数据</span>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
              <div className="border-t border-gray-100"></div>
              <button
                onClick={() => setShowSettings(true)}
                className="w-full p-5 flex items-center justify-between hover:bg-gray-50/50 transition-all"
              >
                <div className="flex items-center">
                  <span className="text-2xl mr-4">{Icons.settings}</span>
                  <span className="font-medium text-gray-700">设置</span>
                </div>
                <span className="text-gray-400">{Icons.arrow}</span>
              </button>
            </div>
          </div>

            {showGiConditionPicker && (
              <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-end justify-center">
                <div className="w-full max-w-md apple-card rounded-t-3xl apple-shadow-lg p-6 pb-8">
                  <div className="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">
                    选择肠胃状况
                  </h2>
                  <div className="space-y-3">
                    {[
                      { value: 'none', label: '无', desc: '暂无基础肠胃疾病' },
                      { value: 'ibs', label: '肠易激综合征', desc: '腹痛、腹胀、排便习惯改变' },
                      { value: 'gastritis', label: '胃炎', desc: '胃黏膜炎症，胃痛反酸' },
                      { value: 'colitis', label: '肠炎', desc: '肠道炎症，腹泻腹痛' },
                      { value: 'hemorrhoids', label: '痔疮', desc: '肛周静脉曲张' }
                    ].map((item, index) => (
                      <button
                        key={index}
                        onClick={() => {
                          if (setUser && user) {
                            setUser({ ...user, giCondition: item.value });
                          }
                          setShowGiConditionPicker(false);
                        }}
                        className={`w-full p-4 rounded-2xl text-left transition-all ${
                          user?.giCondition === item.value 
                            ? 'ring-4 ring-blue-300 bg-blue-50' 
                            : 'bg-gray-50 hover:bg-gray-100'
                        }`}
                      >
                        <p className="font-medium text-gray-800">{item.label}</p>
                        <p className="text-xs text-gray-400 mt-1">{item.desc}</p>
                      </button>
                    ))}
                    <button
                      onClick={() => setShowCustomGiInput(true)}
                      className={`w-full p-4 rounded-2xl text-left transition-all bg-gray-50 hover:bg-gray-100 ${
                        user?.giCondition?.startsWith('other:') ? 'ring-4 ring-blue-300 bg-blue-50' : ''
                      }`}
                    >
                      <p className="font-medium text-gray-800">其他</p>
                      <p className="text-xs text-gray-400 mt-1">自定义输入其他肠胃状况</p>
                    </button>
                    
                    {showCustomGiInput && (
                      <div className="bg-blue-50 rounded-2xl p-4 mt-3">
                        <input
                          type="text"
                          placeholder="请输入肠胃状况"
                          value={customGiValue}
                          onChange={(e) => setCustomGiValue(e.target.value)}
                          className="w-full py-3 px-4 rounded-xl border border-blue-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3"
                          autoFocus
                        />
                        <div className="flex gap-2">
                          <button
                            onClick={() => setShowCustomGiInput(false)}
                            className="flex-1 py-2 rounded-xl font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all"
                          >
                            取消
                          </button>
                          <button
                            onClick={() => {
                              if (customGiValue && customGiValue.trim()) {
                                if (setUser && user) {
                                  setUser({ ...user, giCondition: 'other:' + customGiValue.trim() });
                                }
                              }
                              setShowCustomGiInput(false);
                              setShowGiConditionPicker(false);
                            }}
                            className="flex-1 py-2 rounded-xl font-medium text-white apple-button-primary"
                          >
                            确认
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => setShowGiConditionPicker(false)}
                    className="w-full mt-6 py-3 rounded-2xl font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all"
                  >
                    关闭
                  </button>
                </div>
              </div>
            )}

            {showDietaryRestrictions && (
              <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-end justify-center">
                <div className="w-full max-w-md apple-card rounded-t-3xl apple-shadow-lg p-6 pb-8 max-h-[80vh] overflow-y-auto">
                  <div className="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">
                    🚫 忌口设置
                  </h2>
                  
                  <div className="mb-4">
                    <input
                      type="text"
                      placeholder="输入忌口食物（如：花生、芒果）"
                      className="w-full py-3 px-4 rounded-xl border border-gray-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3"
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          const value = e.target.value.trim();
                          if (value && !selectedRestrictions.includes(value)) {
                            setSelectedRestrictions([...selectedRestrictions, value]);
                          }
                          e.target.value = '';
                        }
                      }}
                    />
                    <button
                      onClick={() => {
                        const input = document.querySelector('input[placeholder="输入忌口食物（如：花生、芒果）"]');
                        if (input) {
                          const value = input.value.trim();
                          if (value && !selectedRestrictions.includes(value)) {
                            setSelectedRestrictions([...selectedRestrictions, value]);
                          }
                          input.value = '';
                        }
                      }}
                      className="w-full py-3 rounded-xl font-medium text-white apple-button-primary mb-4"
                    >
                      添加忌口
                    </button>
                  </div>
                  
                  {selectedRestrictions.length > 0 && (
                    <div className="mb-6">
                      <p className="text-sm text-gray-500 mb-2">已添加的忌口</p>
                      <div className="flex flex-wrap gap-2">
                        {selectedRestrictions.map((restriction, index) => (
                          <span
                            key={index}
                            className="inline-flex items-center gap-1 bg-red-500 text-white px-3 py-1.5 rounded-full text-sm"
                          >
                            {restriction}
                            <button
                              onClick={() => setSelectedRestrictions(selectedRestrictions.filter((_, i) => i !== index))}
                              className="hover:text-red-200 transition-colors"
                            >
                              ×
                            </button>
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                  
                  <div className="mb-6">
                    <p className="text-sm text-gray-500 mb-2">快速添加常见忌口</p>
                    <div className="grid grid-cols-4 gap-2">
                      {['辛辣', '生冷', '高油', '高糖', '酒精', '乳制品', '豆制品', '海鲜'].map((cat, index) => (
                        <button
                          key={index}
                          onClick={() => {
                            if (!selectedRestrictions.includes(cat)) {
                              setSelectedRestrictions([...selectedRestrictions, cat]);
                            }
                          }}
                          className="p-2 rounded-xl text-center text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all"
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <button
                    onClick={() => setShowDietaryRestrictions(false)}
                    className="w-full mt-6 py-3 rounded-2xl font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all"
                  >
                    关闭
                  </button>
                </div>
              </div>
            )}

            {showRecentDiet && (
              <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-end justify-center">
                <div className="w-full max-w-md apple-card rounded-t-3xl apple-shadow-lg p-6 pb-8 max-h-[80vh] overflow-y-auto">
                  <div className="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">
                    📝 近期饮食记录
                  </h2>
                  
                  <div className="mb-4">
                    <p className="text-sm text-gray-500 mb-2">选择日期</p>
                    <input
                      type="date"
                      value={newDietDate}
                      onChange={(e) => setNewDietDate(e.target.value)}
                      className="w-full py-3 rounded-xl border border-gray-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    />
                  </div>
                  
                  <div className="mb-4">
                    <p className="text-sm text-gray-500 mb-2">什么时候吃的</p>
                    <input
                      type="time"
                      value={newDietTime}
                      onChange={(e) => setNewDietTime(e.target.value)}
                      className="w-full py-3 px-4 rounded-xl border border-gray-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    />
                  </div>
                  
                  <div className="mb-4">
                    <p className="text-sm text-gray-500 mb-2">吃了什么类型的食物</p>
                    <div className="grid grid-cols-4 gap-2">
                      {['辛辣', '油炸', '冷饮', '高油', '生冷', '高糖', '酒精', '乳制品'].map((cat, index) => (
                        <button
                          key={index}
                          onClick={() => {
                            if (newDietCategories.includes(cat)) {
                              setNewDietCategories(newDietCategories.filter(c => c !== cat));
                            } else {
                              setNewDietCategories([...newDietCategories, cat]);
                            }
                          }}
                          className={`p-2 rounded-xl text-center text-xs font-medium transition-all ${
                            newDietCategories.includes(cat)
                              ? 'bg-orange-500 text-white shadow-lg'
                              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <button
                    onClick={() => {
                      if (newDietCategories.length > 0) {
                        const newEntry = { 
                          date: newDietDate, 
                          time: newDietTime,
                          categories: [...newDietCategories] 
                        };
                        
                        const updatedRecords = [...recentDietRecords, newEntry];
                        setRecentDietRecords(updatedRecords);
                        if (setUser && user) {
                          setUser({ ...user, recentDietRecords: updatedRecords });
                        }
                        setNewDietCategories([]);
                      }
                    }}
                    className="w-full py-3 rounded-xl font-medium text-white apple-button-primary mb-6"
                  >
                    添加记录
                  </button>
                  
                  <div className="space-y-3">
                    {recentDietRecords.length === 0 ? (
                      <p className="text-center text-gray-400 py-4">暂无饮食记录</p>
                    ) : (
                      recentDietRecords.sort((a, b) => new Date(b.date) - new Date(a.date)).map((record, index) => (
                        <div key={index} className="flex items-center justify-between bg-gray-50 rounded-xl p-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <p className="font-medium text-gray-700">{record.date}</p>
                              <span className="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">
                                {record.time || record.timeAgo}
                              </span>
                            </div>
                            <div className="flex flex-wrap gap-1 mt-1">
                              {record.categories.map((cat, i) => (
                                <span key={i} className="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">
                                  {cat}
                                </span>
                              ))}
                            </div>
                          </div>
                          <button
                            onClick={() => {
                              const updatedRecords = recentDietRecords.filter((_, i) => i !== index);
                              setRecentDietRecords(updatedRecords);
                              if (setUser && user) {
                                setUser({ ...user, recentDietRecords: updatedRecords });
                              }
                            }}
                            className="p-2 text-red-400 hover:text-red-600 transition-colors"
                          >
                            {Icons.delete}
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                  
                  <button
                    onClick={() => setShowRecentDiet(false)}
                    className="w-full mt-6 py-3 rounded-2xl font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all"
                  >
                    关闭
                  </button>
                </div>
              </div>
            )}
        </div>
      );
    };

    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('poopRecords');
        return saved ? JSON.parse(saved) : [];
      });
      const [alarms, setAlarms] = useState(() => {
        const saved = localStorage.getItem('poopAlarms');
        return saved ? JSON.parse(saved) : [];
      });
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('poopUser');
        return saved ? JSON.parse(saved) : null;
      });
      const [showRecordModal, setShowRecordModal] = useState(false);

      useEffect(() => {
        localStorage.setItem('poopRecords', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('poopAlarms', JSON.stringify(alarms));
      }, [alarms]);

      useEffect(() => {
        if (user) {
          localStorage.setItem('poopUser', JSON.stringify(user));
        } else {
          localStorage.removeItem('poopUser');
        }
      }, [user]);

      const handleAddRecord = (record) => {
        setRecords([...records, record]);
      };

      const handleDeleteRecord = (id) => {
        if (confirm('确定要删除这条记录吗？')) {
          setRecords(records.filter(r => r.id !== id));
        }
      };

      const handleAddAlarm = (time) => {
        if (!alarms.includes(time)) {
          setAlarms([...alarms, time].sort());
        }
      };

      const handleDeleteAlarm = (index) => {
        const newAlarms = [...alarms];
        newAlarms.splice(index, 1);
        setAlarms(newAlarms);
      };

      const handleLogin = (type) => {
        const names = {
          wechat: '微信用户',
          qq: 'QQ用户',
          guest: '游客'
        };
        setUser({ 
          type: names[type], 
          name: names[type],
          avatar: '😀',
          theme: ThemeColors[0],
          height: '',
          weight: '',
          bmi: '-'
        });
      };

      const handleShare = (period) => {
        alert(`分享${period === 'day' ? '今日' : '本月'}记录功能开发中...`);
      };

      const handleExport = () => {
        if (records.length === 0) {
          alert('暂无数据可导出');
          return;
        }
        
        const csvContent = [
          ['日期', '时间', '用时', '形状', '颜色', '软硬度', '菊花状态', '心情'].join(','),
          ...records.map(r => [
            r.date,
            r.time,
            r.duration || '',
            r.shape ? PoopShape[r.shape] : '',
            r.color ? PoopColor[r.color] : '',
            r.hardness ? PoopHardness[r.hardness] : '',
            r.anusStatus ? AnusStatus[r.anusStatus] : '',
            r.mood ? Mood[r.mood] : ''
          ].join(','))
        ].join('\n');
        
        const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `拉屎记录_${formatDate(new Date())}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const aiAnalysis = getBMIAnalysis(records, user);

      return (
        <div className="max-w-md mx-auto min-h-screen px-4 pt-6">
          {currentPage === 'home' && (
            <HomePage
              records={records}
              currentDate={currentDate}
              setCurrentDate={setCurrentDate}
              onAddRecord={() => setShowRecordModal(true)}
              aiAnalysis={aiAnalysis}
              onDeleteRecord={handleDeleteRecord}
            />
          )}
          {currentPage === 'analysis' && (
            <HealthAnalysisPage 
              records={records} 
              onDeleteRecord={handleDeleteRecord}
              user={user}
            />
          )}
          {currentPage === 'bmi' && (
            <BMIPage
              user={user}
              setUser={setUser}
              records={records}
            />
          )}
          {currentPage === 'profile' && (
            <ProfilePage
              user={user}
              setUser={setUser}
              onLogin={handleLogin}
              onShare={handleShare}
              onExport={handleExport}
              alarms={alarms}
              onAddAlarm={handleAddAlarm}
              onDeleteAlarm={handleDeleteAlarm}
            />
          )}
          
          <Navbar currentPage={currentPage} onChangePage={setCurrentPage} />
          
          <RecordModal
            isOpen={showRecordModal}
            onClose={() => setShowRecordModal(false)}
            onSave={handleAddRecord}
            date={currentDate}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
