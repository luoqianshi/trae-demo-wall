<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消消乐 - 微信小游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

.game-container {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 800px;
  position: relative;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
}

/* ===== 启动页 ===== */
.splash-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  z-index: 100;
  transition: opacity 0.5s;
}
.splash-screen.hide { opacity: 0; pointer-events: none; }
.splash-logo {
  font-size: 64px;
  margin-bottom: 20px;
  animation: bounce 2s infinite;
}
.splash-title {
  font-size: 36px;
  font-weight: 700;
  color: white;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  margin-bottom: 10px;
}
.splash-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 40px;
}
.splash-btn {
  padding: 16px 48px;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(240, 147, 251, 0.5);
  transition: transform 0.2s, box-shadow 0.2s;
}
.splash-btn:active {
  transform: scale(0.95);
  box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* ===== 主菜单 ===== */
.main-menu {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 60px;
  z-index: 50;
}
.main-menu.hide { display: none; }
.menu-header {
  text-align: center;
  margin-bottom: 30px;
}
.menu-title {
  font-size: 42px;
  font-weight: 700;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.menu-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}
.menu-stats {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}
.stat-item {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding: 12px 20px;
  border-radius: 12px;
  text-align: center;
}
.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: #f093fb;
}
.stat-label {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 2px;
}
.menu-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 80%;
}
.menu-btn {
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.primary {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
}
.menu-btn.secondary {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}
.menu-btn-icon { font-size: 20px; }

/* ===== 关卡选择 ===== */
.level-select {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  flex-direction: column;
  z-index: 60;
  padding: 20px;
  overflow-y: auto;
}
.level-select.show { display: flex; }
.level-header {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}
.back-btn {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.level-header h2 {
  flex: 1;
  text-align: center;
  color: white;
  font-size: 20px;
  margin-right: 40px;
}
.level-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.level-item {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.level-item:active { transform: scale(0.95); }
.level-item.unlocked {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
}
.level-item.locked {
  opacity: 0.5;
  cursor: not-allowed;
}
.level-num {
  font-size: 22px;
  font-weight: 700;
}
.level-stars {
  font-size: 10px;
  margin-top: 2px;
}

/* ===== 游戏界面 ===== */
.game-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  flex-direction: column;
  z-index: 40;
}
.game-screen.show { display: flex; }

/* 顶部信息栏 */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 16px;
  background: rgba(0,0,0,0.3);
}
.game-header-left, .game-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-btn {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header-btn:active { transform: scale(0.9); }
.level-info {
  text-align: center;
  color: white;
}
.level-info .level-num {
  font-size: 18px;
  font-weight: 700;
}
.level-info .level-goal {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
}

/* 进度条 */
.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.2);
  margin: 0 16px;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
  border-radius: 3px;
  transition: width 0.3s;
  width: 0%;
}

/* 分数和步数 */
.game-stats {
  display: flex;
  justify-content: space-around;
  padding: 12px 16px;
}
.game-stat {
  text-align: center;
  color: white;
}
.game-stat-value {
  font-size: 24px;
  font-weight: 700;
}
.game-stat-value.score {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.game-stat-label {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 2px;
}

/* 棋盘区域 */
.board-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.board {
  display: grid;
  gap: 4px;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  position: relative;
}
.cell {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  position: relative;
}
.cell:active { transform: scale(0.9); }
.cell.selected {
  transform: scale(1.1);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5);
  z-index: 10;
}
.cell.matching {
  animation: matchPulse 0.4s ease-out;
}
.cell.falling {
  animation: fallIn 0.3s ease-out;
}
.cell.hint {
  animation: hintPulse 0.8s infinite;
}
@keyframes matchPulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes fallIn {
  0% { transform: translateY(-60px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes hintPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.6); }
}

/* 方块颜色 */
.cell.type-0 { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
.cell.type-1 { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
.cell.type-2 { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
.cell.type-3 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
.cell.type-4 { background: linear-gradient(135deg, #fd79a8, #e84393); }
.cell.type-5 { background: linear-gradient(135deg, #74b9ff, #0984e3); }

/* 特殊方块 */
.cell.special-bomb::after {
  content: '💣';
  position: absolute;
  font-size: 18px;
}
.cell.special-rocket-h::after {
  content: '➡️';
  position: absolute;
  font-size: 18px;
}
.cell.special-rocket-v::after {
  content: '⬇️';
  position: absolute;
  font-size: 18px;
}
.cell.special-rainbow::after {
  content: '🌈';
  position: absolute;
  font-size: 20px;
}
.cell.special-bomb .cell-icon,
.cell.special-rocket-h .cell-icon,
.cell.special-rocket-v .cell-icon,
.cell.special-rainbow .cell-icon {
  opacity: 0.3;
}

.cell-icon { pointer-events: none; }

/* Combo 提示 */
.combo-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: 700;
  color: #f5576c;
  text-shadow: 0 2px 10px rgba(245, 87, 108, 0.5);
  pointer-events: none;
  opacity: 0;
  z-index: 100;
}
.combo-text.show {
  animation: comboPopup 1s ease-out forwards;
}
@keyframes comboPopup {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); }
}

/* 底部道具栏 */
.game-footer {
  padding: 12px 16px 20px;
  background: rgba(0,0,0,0.3);
}
.props-bar {
  display: flex;
  justify-content: space-around;
}
.prop-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 12px;
  transition: all 0.2s;
}
.prop-item:active { transform: scale(0.9); }
.prop-item.active {
  background: rgba(240, 147, 251, 0.3);
  box-shadow: 0 0 15px rgba(240, 147, 251, 0.4);
}
.prop-icon {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.prop-count {
  font-size: 11px;
  color: white;
  background: #f5576c;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.prop-name {
  font-size: 10px;
  color: rgba(255,255,255,0.7);
}

/* ===== 弹窗 ===== */
.modal {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal.show { display: flex; }
.modal-content {
  width: 85%;
  max-width: 320px;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  border: 2px solid rgba(255,255,255,0.1);
  animation: modalIn 0.3s ease-out;
}
@keyframes modalIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.modal-icon {
  font-size: 60px;
  margin-bottom: 15px;
}
.modal-title {
  font-size: 24px;
  font-weight: 700;
  color: white;
  margin-bottom: 10px;
}
.modal-title.win {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 20px;
}
.modal-stars {
  font-size: 32px;
  margin-bottom: 15px;
}
.modal-stars .star {
  display: inline-block;
  margin: 0 3px;
  opacity: 0.3;
}
.modal-stars .star.active {
  opacity: 1;
  animation: starPop 0.5s ease-out;
}
@keyframes starPop {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.modal-score {
  font-size: 32px;
  font-weight: 700;
  color: #f093fb;
  margin-bottom: 20px;
}
.modal-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
}
.modal-btn:active { transform: scale(0.95); }
.modal-btn.primary {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
}
.modal-btn.secondary {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}

/* ===== 暂停菜单 ===== */
.pause-menu .modal-content {
  padding: 30px 20px;
}
.pause-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* 响应式 */
@media (max-height: 700px) {
  .cell { width: 36px; height: 36px; font-size: 20px; }
  .menu-title { font-size: 36px; }
}
@media (max-height: 600px) {
  .cell { width: 32px; height: 32px; font-size: 18px; }
}
</style>
</head>
<body>

<div class="game-container">

  <!-- 启动页 -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo">🍬</div>
    <div class="splash-title">消消乐</div>
    <div class="splash-subtitle">经典三消 · 欢乐无限</div>
    <button class="splash-btn" onclick="startGame()">开始游戏</button>
  </div>

  <!-- 主菜单 -->
  <div class="main-menu hide" id="mainMenu">
    <div class="menu-header">
      <div class="menu-title">消消乐</div>
      <div class="menu-subtitle">经典三消小游戏</div>
    </div>
    <div class="menu-stats">
      <div class="stat-item">
        <div class="stat-value" id="menuLevel">1</div>
        <div class="stat-label">当前关卡</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="menuStars">0</div>
        <div class="stat-label">获得星星</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">5</div>
        <div class="stat-label">体力</div>
      </div>
    </div>
    <div class="menu-btns">
      <button class="menu-btn primary" onclick="showLevelSelect()">
        <span class="menu-btn-icon">🎮</span>
        <span>开始闯关</span>
      </button>
      <button class="menu-btn secondary" onclick="showToast('排行榜功能开发中...')">
        <span class="menu-btn-icon">🏆</span>
        <span>好友排行</span>
      </button>
      <button class="menu-btn secondary" onclick="showToast('每日签到功能开发中...')">
        <span class="menu-btn-icon">🎁</span>
        <span>每日签到</span>
      </button>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div class="level-select" id="levelSelect">
    <div class="level-header">
      <button class="back-btn" onclick="hideLevelSelect()">←</button>
      <h2>选择关卡</h2>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <!-- 游戏界面 -->
  <div class="game-screen" id="gameScreen">
    <div class="game-header">
      <div class="game-header-left">
        <button class="header-btn" onclick="pauseGame()">⏸</button>
      </div>
      <div class="level-info">
        <div class="level-num" id="gameLevel">第 1 关</div>
        <div class="level-goal" id="gameGoal">目标：达到 1000 分</div>
      </div>
      <div class="game-header-right">
        <button class="header-btn" onclick="showToast('提示功能开发中')">💡</button>
      </div>
    </div>
    
    <div class="game-stats">
      <div class="game-stat">
        <div class="game-stat-value score" id="gameScore">0</div>
        <div class="game-stat-label">分数</div>
      </div>
      <div class="game-stat">
        <div class="game-stat-value" id="gameMoves">20</div>
        <div class="game-stat-label">剩余步数</div>
      </div>
      <div class="game-stat">
        <div class="game-stat-value" id="gameCombo">0</div>
        <div class="game-stat-label">连击</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="combo-text" id="comboText"></div>
      </div>
    </div>

    <div class="game-footer">
      <div class="props-bar">
        <div class="prop-item" id="propHammer" onclick="useProp('hammer')">
          <div class="prop-icon">🔨</div>
          <div class="prop-count" id="hammerCount">3</div>
          <div class="prop-name">锤子</div>
        </div>
        <div class="prop-item" id="propShuffle" onclick="useProp('shuffle')">
          <div class="prop-icon">🔀</div>
          <div class="prop-count" id="shuffleCount">2</div>
          <div class="prop-name">洗牌</div>
        </div>
        <div class="prop-item" id="propAddStep" onclick="useProp('addstep')">
          <div class="prop-icon">➕</div>
          <div class="prop-count" id="addstepCount">1</div>
          <div class="prop-name">加步</div>
        </div>
        <div class="prop-item" onclick="showToast('彩虹球道具开发中')">
          <div class="prop-icon">🌈</div>
          <div class="prop-count">0</div>
          <div class="prop-name">彩虹球</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title win">恭喜过关！</div>
      <div class="modal-stars" id="winStars">
        <span class="star">⭐</span>
        <span class="star">⭐</span>
        <span class="star">⭐</span>
      </div>
      <div class="modal-score" id="winScore">0 分</div>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="backToLevels()">返回</button>
        <button class="modal-btn primary" onclick="nextLevel()">下一关</button>
      </div>
    </div>
  </div>

  <!-- 失败弹窗 -->
  <div class="modal" id="loseModal">
    <div class="modal-content">
      <div class="modal-icon">😢</div>
      <div class="modal-title">挑战失败</div>
      <div class="modal-desc">别灰心，再试一次吧！</div>
      <div class="modal-score" id="loseScore">0 分</div>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="backToLevels()">返回</button>
        <button class="modal-btn primary" onclick="retryLevel()">再玩一次</button>
      </div>
    </div>
  </div>

  <!-- 暂停弹窗 -->
  <div class="modal pause-menu" id="pauseModal">
    <div class="modal-content">
      <div class="modal-icon">⏸</div>
      <div class="modal-title">游戏暂停</div>
      <div class="pause-btns" style="margin-top: 20px;">
        <button class="modal-btn primary" onclick="resumeGame()">继续游戏</button>
        <button class="modal-btn secondary" onclick="retryLevel()">重新开始</button>
        <button class="modal-btn secondary" onclick="backToLevels()">退出关卡</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script>
// ==================== 游戏配置 ====================
const CONFIG = {
  ROWS: 8,
  COLS: 7,
  TYPES: 6,
  TYPE_ICONS: ['🍎', '🍀', '⭐', '🔮', '🌸', '💎'],
  BASE_SCORE: 10,
  COMBO_MULTIPLIER: [1, 1, 1.5, 2, 2.5, 3, 4, 5],
};

// 关卡配置
const LEVELS = [
  { id: 1, moves: 25, target: 500, star2: 800, star3: 1200, type: 'score', name: '初来乍到' },
  { id: 2, moves: 22, target: 800, star2: 1200, star3: 1800, type: 'score', name: '小试牛刀' },
  { id: 3, moves: 20, target: 1000, star2: 1500, star3: 2200, type: 'score', name: '渐入佳境' },
  { id: 4, moves: 22, target: 1200, star2: 1800, star3: 2600, type: 'score', name: '得心应手' },
  { id: 5, moves: 20, target: 1500, star2: 2200, star3: 3200, type: 'score', name: '挑战升级' },
  { id: 6, moves: 18, target: 1500, star2: 2300, star3: 3500, type: 'score', name: '步步为营' },
  { id: 7, moves: 20, target: 2000, star2: 3000, star3: 4500, type: 'score', name: '高手进阶' },
  { id: 8, moves: 18, target: 2200, star2: 3300, star3: 5000, type: 'score', name: '巅峰对决' },
  { id: 9, moves: 16, target: 2000, star2: 3200, star3: 5000, type: 'score', name: '极限挑战' },
  { id: 10, moves: 20, target: 3000, star2: 4500, star3: 6500, type: 'score', name: '最终关卡' },
];

// ==================== 游戏状态 ====================
let gameState = {
  currentLevel: 1,
  unlockedLevel: 1,
  totalStars: 0,
  board: [],
  score: 0,
  moves: 0,
  combo: 0,
  selectedCell: null,
  isAnimating: false,
  isPaused: false,
  activeProp: null,
  props: {
    hammer: 3,
    shuffle: 2,
    addstep: 1,
  }
};

// 加载存档
function loadSave() {
  try {
    const saved = localStorage.getItem('match3_save');
    if (saved) {
      const data = JSON.parse(saved);
      gameState.unlockedLevel = data.unlockedLevel || 1;
      gameState.totalStars = data.totalStars || 0;
      if (data.props) gameState.props = { ...gameState.props, ...data.props };
    }
  } catch(e) {}
}

function saveGame() {
  try {
    localStorage.setItem('match3_save', JSON.stringify({
      unlockedLevel: gameState.unlockedLevel,
      totalStars: gameState.totalStars,
      props: gameState.props,
    }));
  } catch(e) {}
}

// ==================== 启动 ====================
function startGame() {
  document.getElementById('splashScreen').classList.add('hide');
  document.getElementById('mainMenu').classList.remove('hide');
  loadSave();
  updateMenuStats();
}

function updateMenuStats() {
  document.getElementById('menuLevel').textContent = gameState.unlockedLevel;
  document.getElementById('menuStars').textContent = gameState.totalStars;
}

// ==================== 关卡选择 ====================
function showLevelSelect() {
  document.getElementById('mainMenu').classList.add('hide');
  document.getElementById('levelSelect').classList.add('show');
  renderLevelGrid();
}

function hideLevelSelect() {
  document.getElementById('levelSelect').classList.remove('show');
  document.getElementById('mainMenu').classList.remove('hide');
  updateMenuStats();
}

function renderLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  LEVELS.forEach((level, idx) => {
    const item = document.createElement('div');
    const isUnlocked = idx + 1 <= gameState.unlockedLevel;
    item.className = `level-item ${isUnlocked ? 'unlocked' : 'locked'}`;
    item.innerHTML = `
      <div class="level-num">${isUnlocked ? level.id : '🔒'}</div>
      <div class="level-stars">${idx < gameState.unlockedLevel - 1 ? getStarsDisplay(gameState.totalStars) : ''}</div>
    `;
    if (isUnlocked) {
      item.onclick = () => startLevel(level.id);
    }
    grid.appendChild(item);
  });
}

function getStarsDisplay(stars) {
  const s = stars % 3;
  return '⭐'.repeat(s || (stars > 0 ? 3 : 0));
}

// ==================== 游戏核心 ====================
function startLevel(levelId) {
  gameState.currentLevel = levelId;
  gameState.score = 0;
  gameState.moves = LEVELS[levelId - 1].moves;
  gameState.combo = 0;
  gameState.selectedCell = null;
  gameState.isAnimating = false;
  gameState.isPaused = false;
  gameState.activeProp = null;

  document.getElementById('levelSelect').classList.remove('show');
  document.getElementById('gameScreen').classList.add('show');
  
  updateGameUI();
  initBoard();
  renderBoard();
  
  // 确保初始没有可消除的
  setTimeout(() => {
    clearInitialMatches();
  }, 100);
}

function initBoard() {
  gameState.board = [];
  for (let r = 0; r < CONFIG.ROWS; r++) {
    const row = [];
    for (let c = 0; c < CONFIG.COLS; c++) {
      row.push(createCell(r, c));
    }
    gameState.board.push(row);
  }
}

function createCell(row, col, type = null) {
  if (type === null) {
    type = Math.floor(Math.random() * CONFIG.TYPES);
  }
  return {
    row,
    col,
    type,
    special: null, // 'bomb', 'rocket-h', 'rocket-v', 'rainbow'
    isNew: false,
  };
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  // 保留 combo text
  const comboText = document.getElementById('comboText');
  boardEl.innerHTML = '';
  boardEl.appendChild(comboText);
  
  boardEl.style.gridTemplateColumns = `repeat(${CONFIG.COLS}, 1fr)`;
  
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      const cell = gameState.board[r][c];
      if (!cell) continue;
      
      const cellEl = document.createElement('div');
      cellEl.className = `cell type-${cell.type}`;
      cellEl.dataset.row = r;
      cellEl.dataset.col = c;
      
      if (cell.special) {
        cellEl.classList.add(`special-${cell.special}`);
      }
      
      cellEl.innerHTML = `<span class="cell-icon">${CONFIG.TYPE_ICONS[cell.type]}</span>`;
      
      cellEl.onclick = () => onCellClick(r, c);
      boardEl.appendChild(cellEl);
    }
  }
}

function getCellEl(row, col) {
  return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
}

function updateGameUI() {
  const level = LEVELS[gameState.currentLevel - 1];
  document.getElementById('gameLevel').textContent = `第 ${gameState.currentLevel} 关`;
  document.getElementById('gameGoal').textContent = `目标：达到 ${level.target} 分`;
  document.getElementById('gameScore').textContent = gameState.score;
  document.getElementById('gameMoves').textContent = gameState.moves;
  document.getElementById('gameCombo').textContent = gameState.combo;
  
  const progress = Math.min(100, (gameState.score / level.star3) * 100);
  document.getElementById('progressFill').style.width = progress + '%';
  
  document.getElementById('hammerCount').textContent = gameState.props.hammer;
  document.getElementById('shuffleCount').textContent = gameState.props.shuffle;
  document.getElementById('addstepCount').textContent = gameState.props.addstep;
  
  // 更新道具选中状态
  document.querySelectorAll('.prop-item').forEach(el => el.classList.remove('active'));
  if (gameState.activeProp) {
    document.getElementById('prop' + gameState.activeProp.charAt(0).toUpperCase() + gameState.activeProp.slice(1))?.classList.add('active');
  }
}

// ==================== 交互逻辑 ====================
function onCellClick(row, col) {
  if (gameState.isAnimating || gameState.isPaused) return;
  
  // 道具模式
  if (gameState.activeProp === 'hammer') {
    useHammer(row, col);
    return;
  }
  
  const cell = gameState.board[row][col];
  if (!cell) return;
  
  if (!gameState.selectedCell) {
    // 选中第一个
    gameState.selectedCell = { row, col };
    getCellEl(row, col)?.classList.add('selected');
  } else {
    const prev = gameState.selectedCell;
    getCellEl(prev.row, prev.col)?.classList.remove('selected');
    
    // 检查是否相邻
    const isAdjacent = (Math.abs(prev.row - row) === 1 && prev.col === col) ||
                       (Math.abs(prev.col - col) === 1 && prev.row === row);
    
    if (isAdjacent) {
      // 尝试交换
      trySwap(prev.row, prev.col, row, col);
    } else if (row === prev.row && col === prev.col) {
      // 点击同一个，取消选中
      gameState.selectedCell = null;
      return;
    } else {
      // 选中新的
      gameState.selectedCell = { row, col };
      getCellEl(row, col)?.classList.add('selected');
      return;
    }
    gameState.selectedCell = null;
  }
}

async function trySwap(r1, c1, r2, c2) {
  gameState.isAnimating = true;
  
  // 交换
  swapCells(r1, c1, r2, c2);
  renderBoard();
  
  // 检测消除
  const matches = findAllMatches();
  
  if (matches.length > 0) {
    // 有效交换，消耗步数
    gameState.moves--;
    gameState.combo = 0;
    updateGameUI();
    
    // 处理消除链
    await processMatches();
    
    // 检查死局
    if (!hasPossibleMoves()) {
      showToast('没有可消除的了，自动重排');
      shuffleBoard();
      renderBoard();
    }
    
    // 检查胜负
    checkGameEnd();
  } else {
    // 无效交换，换回来
    await sleep(200);
    swapCells(r1, c1, r2, c2);
    renderBoard();
    showToast('无法消除');
  }
  
  gameState.isAnimating = false;
}

function swapCells(r1, c1, r2, c2) {
  const temp = gameState.board[r1][c1];
  gameState.board[r1][c1] = gameState.board[r2][c2];
  gameState.board[r2][c2] = temp;
  
  if (gameState.board[r1][c1]) {
    gameState.board[r1][c1].row = r1;
    gameState.board[r1][c1].col = c1;
  }
  if (gameState.board[r2][c2]) {
    gameState.board[r2][c2].row = r2;
    gameState.board[r2][c2].col = c2;
  }
}

// ==================== 消除检测 ====================
function findAllMatches() {
  const matches = [];
  const matched = new Set();
  
  // 横向检测
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS - 2; c++) {
      const cell = gameState.board[r][c];
      if (!cell) continue;
      
      let end = c + 1;
      while (end < CONFIG.COLS && gameState.board[r][end] && 
             gameState.board[r][end].type === cell.type) {
        end++;
      }
      
      if (end - c >= 3) {
        const match = { type: 'h', cells: [], row: r, startCol: c, endCol: end - 1 };
        for (let i = c; i < end; i++) {
          match.cells.push({ row: r, col: i });
          matched.add(`${r},${i}`);
        }
        matches.push(match);
        c = end - 1;
      }
    }
  }
  
  // 纵向检测
  for (let c = 0; c < CONFIG.COLS; c++) {
    for (let r = 0; r < CONFIG.ROWS - 2; r++) {
      const cell = gameState.board[r][c];
      if (!cell) continue;
      
      let end = r + 1;
      while (end < CONFIG.ROWS && gameState.board[end][c] && 
             gameState.board[end][c].type === cell.type) {
        end++;
      }
      
      if (end - r >= 3) {
        const match = { type: 'v', cells: [], col: c, startRow: r, endRow: end - 1 };
        for (let i = r; i < end; i++) {
          match.cells.push({ row: i, col: c });
          matched.add(`${i},${c}`);
        }
        matches.push(match);
        r = end - 1;
      }
    }
  }
  
  return matches;
}

// 检测特殊方块生成（四消、五消、T/L型）
function detectSpecialCreation(matches) {
  const specials = [];
  
  matches.forEach(match => {
    const length = match.cells.length;
    if (length >= 5) {
      // 五消：彩虹球
      const midIdx = Math.floor(length / 2);
      specials.push({
        row: match.cells[midIdx].row,
        col: match.cells[midIdx].col,
        type: 'rainbow'
      });
    } else if (length === 4) {
      // 四消：炸弹
      const midIdx = 1;
      specials.push({
        row: match.cells[midIdx].row,
        col: match.cells[midIdx].col,
        type: 'bomb'
      });
    }
  });
  
  return specials;
}

// ==================== 消除处理 ====================
async function processMatches() {
  let matches = findAllMatches();
  let comboCount = 0;
  
  while (matches.length > 0) {
    comboCount++;
    gameState.combo = comboCount;
    updateGameUI();
    
    // 显示 combo
    if (comboCount > 1) {
      showCombo(comboCount);
    }
    
    // 检测特殊方块生成
    const specials = detectSpecialCreation(matches);
    
    // 计算分数
    let matchScore = 0;
    matches.forEach(match => {
      const len = match.cells.length;
      const base = CONFIG.BASE_SCORE * len;
      const comboMult = CONFIG.COMBO_MULTIPLIER[Math.min(comboCount, CONFIG.COMBO_MULTIPLIER.length - 1)];
      matchScore += Math.floor(base * comboMult);
    });
    gameState.score += matchScore;
    
    // 播放消除动画
    const allCells = new Set();
    matches.forEach(m => m.cells.forEach(c => allCells.add(`${c.row},${c.col}`)));
    
    allCells.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      const el = getCellEl(r, c);
      if (el) el.classList.add('matching');
    });
    
    await sleep(350);
    
    // 清除匹配的方块
    allCells.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      gameState.board[r][c] = null;
    });
    
    // 处理特殊方块（生成的特殊方块在消除位置生成）
    specials.forEach(s => {
      if (!gameState.board[s.row][s.col]) {
        const cell = createCell(s.row, s.col, Math.floor(Math.random() * CONFIG.TYPES));
        cell.special = s.type;
        gameState.board[s.row][s.col] = cell;
      } else {
        gameState.board[s.row][s.col].special = s.type;
      }
    });
    
    // 下落 + 补充
    applyGravity();
    renderBoard();
    
    // 下落动画
    document.querySelectorAll('.cell').forEach(el => {
      if (el.dataset.row !== undefined) {
        el.classList.add('falling');
      }
    });
    
    await sleep(300);
    
    updateGameUI();
    
    // 继续检测
    matches = findAllMatches();
  }
  
  // combo 延迟重置（显示用）
  setTimeout(() => {
    gameState.combo = 0;
    updateGameUI();
  }, 500);
}

function applyGravity() {
  for (let c = 0; c < CONFIG.COLS; c++) {
    let writeRow = CONFIG.ROWS - 1;
    
    // 从下往上遍历，将非空方块下移
    for (let r = CONFIG.ROWS - 1; r >= 0; r--) {
      if (gameState.board[r][c]) {
        if (r !== writeRow) {
          gameState.board[writeRow][c] = gameState.board[r][c];
          gameState.board[writeRow][c].row = writeRow;
          gameState.board[writeRow][c].col = c;
          gameState.board[r][c] = null;
        }
        writeRow--;
      }
    }
    
    // 顶部补充新方块
    for (let r = writeRow; r >= 0; r--) {
      const cell = createCell(r, c);
      cell.isNew = true;
      gameState.board[r][c] = cell;
    }
  }
}

// ==================== 死局检测 & 重排 ====================
function hasPossibleMoves() {
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      // 检查右边交换
      if (c < CONFIG.COLS - 1) {
        swapCells(r, c, r, c + 1);
        const matches = findAllMatches();
        swapCells(r, c, r, c + 1);
        if (matches.length > 0) return true;
      }
      // 检查下边交换
      if (r < CONFIG.ROWS - 1) {
        swapCells(r, c, r + 1, c);
        const matches = findAllMatches();
        swapCells(r, c, r + 1, c);
        if (matches.length > 0) return true;
      }
    }
  }
  return false;
}

function shuffleBoard() {
  const allCells = [];
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      if (gameState.board[r][c]) {
        allCells.push(gameState.board[r][c].type);
      }
    }
  }
  
  // Fisher-Yates shuffle
  for (let i = allCells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allCells[i], allCells[j]] = [allCells[j], allCells[i]];
  }
  
  let idx = 0;
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      if (gameState.board[r][c]) {
        gameState.board[r][c].type = allCells[idx++];
        gameState.board[r][c].special = null;
      }
    }
  }
  
  // 确保洗牌后有解
  if (!hasPossibleMoves()) {
    shuffleBoard();
  }
}

// 确保初始状态没有可消除的
function clearInitialMatches() {
  let matches = findAllMatches();
  let iterations = 0;
  
  while (matches.length > 0 && iterations < 100) {
    matches.forEach(match => {
      match.cells.forEach(c => {
        if (gameState.board[c.row][c.col]) {
          gameState.board[c.row][c.col].type = Math.floor(Math.random() * CONFIG.TYPES);
        }
      });
    });
    matches = findAllMatches();
    iterations++;
  }
  
  // 确保有解
  if (!hasPossibleMoves()) {
    shuffleBoard();
  }
  
  renderBoard();
}

// ==================== Combo 效果 ====================
function showCombo(count) {
  const el = document.getElementById('comboText');
  const texts = ['', '', '连击！', '三连击！', '四连击！', '五连击！', '超级连击！', '无敌连击！'];
  el.textContent = texts[Math.min(count, texts.length - 1)] || `${count} 连击!`;
  el.classList.remove('show');
  void el.offsetWidth; // trigger reflow
  el.classList.add('show');
}

// ==================== 道具系统 ====================
function useProp(type) {
  if (gameState.isAnimating || gameState.isPaused) return;
  
  if (gameState.props[type] <= 0) {
    showToast('道具不足');
    return;
  }
  
  if (type === 'shuffle') {
    // 洗牌直接生效
    gameState.props.shuffle--;
    gameState.activeProp = null;
    shuffleBoard();
    renderBoard();
    updateGameUI();
    saveGame();
    showToast('洗牌完成');
    return;
  }
  
  if (type === 'addstep') {
    // 加步直接生效
    gameState.props.addstep--;
    gameState.moves += 5;
    gameState.activeProp = null;
    updateGameUI();
    saveGame();
    showToast('步数 +5');
    return;
  }
  
  if (type === 'hammer') {
    gameState.activeProp = gameState.activeProp === 'hammer' ? null : 'hammer';
    updateGameUI();
    if (gameState.activeProp) {
      showToast('点击要消除的方块');
    }
    return;
  }
}

async function useHammer(row, col) {
  if (!gameState.board[row][col]) return;
  
  gameState.isAnimating = true;
  gameState.props.hammer--;
  gameState.activeProp = null;
  
  const el = getCellEl(row, col);
  if (el) el.classList.add('matching');
  
  await sleep(300);
  
  gameState.board[row][col] = null;
  applyGravity();
  renderBoard();
  
  await sleep(300);
  
  // 检查是否触发连锁
  gameState.combo = 0;
  await processMatches();
  
  if (!hasPossibleMoves()) {
    shuffleBoard();
    renderBoard();
  }
  
  updateGameUI();
  saveGame();
  gameState.isAnimating = false;
  
  checkGameEnd();
}

// ==================== 游戏结束 ====================
function checkGameEnd() {
  const level = LEVELS[gameState.currentLevel - 1];
  
  if (gameState.moves <= 0) {
    if (gameState.score >= level.target) {
      // 胜利
      setTimeout(() => showWin(), 500);
    } else {
      // 失败
      setTimeout(() => showLose(), 500);
    }
  }
}

function showWin() {
  const level = LEVELS[gameState.currentLevel - 1];
  let stars = 1;
  if (gameState.score >= level.star2) stars = 2;
  if (gameState.score >= level.star3) stars = 3;
  
  // 更新进度
  if (gameState.currentLevel >= gameState.unlockedLevel) {
    gameState.unlockedLevel = Math.min(gameState.currentLevel + 1, LEVELS.length);
  }
  gameState.totalStars += stars;
  saveGame();
  
  document.getElementById('winScore').textContent = `${gameState.score} 分`;
  
  const starsEl = document.getElementById('winStars');
  starsEl.querySelectorAll('.star').forEach((s, i) => {
    s.classList.remove('active');
    if (i < stars) {
      setTimeout(() => s.classList.add('active'), 200 + i * 200);
    }
  });
  
  document.getElementById('winModal').classList.add('show');
}

function showLose() {
  document.getElementById('loseScore').textContent = `${gameState.score} 分`;
  document.getElementById('loseModal').classList.add('show');
}

function nextLevel() {
  document.getElementById('winModal').classList.remove('show');
  if (gameState.currentLevel < LEVELS.length) {
    startLevel(gameState.currentLevel + 1);
  } else {
    showToast('恭喜通关所有关卡！');
    backToLevels();
  }
}

function retryLevel() {
  document.getElementById('loseModal').classList.remove('show');
  document.getElementById('pauseModal').classList.remove('show');
  startLevel(gameState.currentLevel);
}

function backToLevels() {
  document.getElementById('winModal').classList.remove('show');
  document.getElementById('loseModal').classList.remove('show');
  document.getElementById('pauseModal').classList.remove('show');
  document.getElementById('gameScreen').classList.remove('show');
  document.getElementById('levelSelect').classList.add('show');
  renderLevelGrid();
}

// ==================== 暂停 ====================
function pauseGame() {
  gameState.isPaused = true;
  document.getElementById('pauseModal').classList.add('show');
}

function resumeGame() {
  gameState.isPaused = false;
  document.getElementById('pauseModal').classList.remove('show');
}

// ==================== 工具函数 ====================
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1500);
}

// 触摸滑动支持
let touchStart = null;
document.addEventListener('touchstart', (e) => {
  const cell = e.target.closest('.cell');
  if (cell && !gameState.isAnimating && !gameState.isPaused && !gameState.activeProp) {
    touchStart = {
      row: parseInt(cell.dataset.row),
      col: parseInt(cell.dataset.col),
      x: e.touches[0].clientX,
      y: e.touches[0].clientY,
    };
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStart.x;
  const dy = touch.clientY - touchStart.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  
  if (Math.max(absDx, absDy) > 30) {
    // 滑动
    let targetRow = touchStart.row;
    let targetCol = touchStart.col;
    
    if (absDx > absDy) {
      targetCol += dx > 0 ? 1 : -1;
    } else {
      targetRow += dy > 0 ? 1 : -1;
    }
    
    if (targetRow >= 0 && targetRow < CONFIG.ROWS && 
        targetCol >= 0 && targetCol < CONFIG.COLS) {
      trySwap(touchStart.row, touchStart.col, targetRow, targetCol);
    }
  }
  
  touchStart = null;
}, { passive: true });

</script>
