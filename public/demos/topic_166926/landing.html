<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智烹锅 — AI 家用智能烹饪终端</title>
<style>
  :root {
    --bg: #F7F3EC;
    --primary: #8BA888;
    --secondary: #B8956E;
    --text: #3D3A36;
    --card: #FFFFFF;
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .hero-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }

  .hero-image {
    width: 100%;
    max-width: 600px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(61,58,54,0.15);
    margin-bottom: 32px;
    animation: fadeInUp 1s ease-out;
  }

  .hero-title {
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    animation: fadeInUp 1s ease-out 0.2s both;
  }

  .hero-subtitle {
    font-size: 18px;
    color: #888;
    margin-bottom: 32px;
    max-width: 500px;
    line-height: 1.6;
    animation: fadeInUp 1s ease-out 0.4s both;
  }

  .hero-btn {
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, var(--primary), #A8C5A5);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(139,168,136,0.4);
    transition: all 0.3s ease;
    animation: fadeInUp 1s ease-out 0.6s both;
  }

  .hero-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(139,168,136,0.5);
  }

  .hero-btn:active {
    transform: translateY(0);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .footer-text {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #aaa;
    animation: fadeIn 1s ease-out 1s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .hero-title { font-size: 28px; }
    .hero-subtitle { font-size: 16px; }
    .hero-btn { padding: 12px 30px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="hero-section">
  <img src="d53fb984-256a-4a48-a55e-49283eed1acd.png" alt="智烹锅产品图" class="hero-image">
  <h1 class="hero-title">智烹锅</h1>
  <p class="hero-subtitle">AI 家用智能烹饪终端<br>让烹饪变得简单又美味</p>
  <button class="hero-btn" onclick="enterExperience()">🎬 开始体验</button>
</div>
<div class="footer-text">【硬件交互赛道】智烹锅 Demo</div>

<script>
function enterExperience() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
