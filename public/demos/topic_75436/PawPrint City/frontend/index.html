<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>爪印城市 - 宠物友好场所信息平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 应用容器 -->
  <div id="app" class="app-container">
    <!-- 页面内容区域 -->
    <main id="page-content" class="page-content"></main>
    <!-- 底部Tab导航 -->
    <nav id="tab-bar" class="tab-bar">
      <div class="tab-item active" data-route="home">
        <span class="tab-icon">📍</span>
        <span class="tab-label">首页</span>
      </div>
      <div class="tab-item" data-route="discover">
        <span class="tab-icon">🧭</span>
        <span class="tab-label">发现</span>
      </div>
      <div class="tab-item" data-route="publish">
        <span class="tab-icon">📝</span>
        <span class="tab-label">发布</span>
      </div>
      <div class="tab-item" data-route="profile">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </div>
    </nav>
  </div>

  <!-- 全局弹窗容器 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast" style="display:none;"></div>

  <!-- 加载中 -->
  <div id="loading" class="loading-overlay" style="display:none;">
    <div class="loading-spinner"></div>
  </div>

  <!-- 配置文件 -->
  <script src="js/config.js"></script>
  <!-- API请求层 -->
  <script src="js/api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components/amap.js"></script>
  <script src="js/components/map.js"></script>
  <script src="js/components/carousel.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/discover.js"></script>
  <script src="js/pages/publish.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/pet_profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
