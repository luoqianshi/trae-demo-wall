<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 睡前脑内小剧场</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <canvas id="particles"></canvas>
  <div id="cursor-glow"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon">🌙</div>
      <h1 class="login-title text-gradient">睡前脑内小剧场</h1>
      <p class="login-subtitle">把今天的小事，变成温柔入梦的剧场</p>

      <div class="login-tabs">
        <span class="login-tab active" data-tab="login">登录</span>
        <span class="login-tab" data-tab="register">注册</span>
      </div>

      <div class="login-subtabs" id="loginSubtabs">
        <span class="login-subtab active" data-mode="code">验证码登录</span>
        <span class="login-subtab" data-mode="password">密码登录</span>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
        </div>

        <div class="form-group" id="codeGroup">
          <label class="form-label">验证码</label>
          <div class="code-input-wrap">
            <input type="text" class="form-input code-input" id="code" placeholder="请输入验证码" maxlength="6" autocomplete="one-time-code">
            <button type="button" class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
          </div>
        </div>

        <div class="form-group" id="passwordGroup" style="display:none">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <div class="form-group" id="confirmGroup" style="display:none">
          <label class="form-label">确认密码</label>
          <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
        </div>

        <div class="code-tip" id="codeTip" style="display:none">
          💡 模拟验证码：<strong id="mockCode">888888</strong>
        </div>

        <div class="form-error" id="formError"></div>
        <button type="submit" class="btn-primary login-btn" id="submitBtn">登 录</button>
      </form>

      <div class="login-tip">
        <span>💡</span> 登录后即可生成属于你的睡前故事
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
