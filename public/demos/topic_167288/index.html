<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PawMap · 宠物救助地图</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/adoption.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/pet.css">
  <link rel="stylesheet" href="css/community.css">
  <!-- Leaflet CSS（本地） -->
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="time" id="statusTime">9:41</span>
    <span class="icons"><span>●●●</span> <span>📶</span> <span>🔋</span></span>
  </div>

  <!-- 页面容器 -->
  <div class="pages" id="pages">
    <!-- 地图页 -->
    <div class="page" id="page-map"></div>
    <!-- 领养页 -->
    <div class="page" id="page-adoption"></div>
    <!-- 社区页 -->
    <div class="page" id="page-community"></div>
    <!-- 个人中心页 -->
    <div class="page" id="page-profile"></div>
  </div>

  <!-- 子页面容器（覆盖在 tabbar 之上） -->
  <div class="sub-page" id="subPage"></div>

  <!-- TabBar -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" data-page="map">
      <span class="tab-icon">🗺️</span>
      <span class="tab-label">地图</span>
    </div>
    <div class="tab-item" data-page="adoption">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">领养</span>
    </div>
    <div class="tab-item" data-page="community">
      <span class="tab-icon">🐾</span>
      <span class="tab-label">社区</span>
    </div>
    <div class="tab-item" data-page="profile">
      <span class="tab-icon">👤</span>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>

<!-- ===== JS 模块 ===== -->
<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<!-- Leaflet JS（本地） -->
<script src="lib/leaflet/leaflet.js"></script>
<!-- 页面逻辑 -->
<script src="js/app.js"></script>
<script src="js/community.js"></script>
<script src="js/map.js"></script>
<script src="js/adoption.js"></script>
<script src="js/profile.js"></script>
<script src="js/chat.js"></script>
<script src="js/pet.js"></script>
<script src="js/verify.js"></script>
<script src="js/points.js"></script>
<script src="js/exchange.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/rescue.js"></script>
<script src="js/applications.js"></script>
<script src="js/rescue-records.js"></script>
<script src="js/tracks-favorites.js"></script>
</body>
</html>
