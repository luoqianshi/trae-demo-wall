<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>风停处</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;600&family=Long+Cang&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2D2A26;font-family:'Noto Serif SC',serif}
canvas#wind-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.4}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .6s ease}
.screen.active{display:flex;opacity:1}
.screen.fade-in{display:flex;opacity:1}
.screen.fade-out{display:flex;opacity:0}
/* Splash */
#splash{background:#2D2A26;position:relative;overflow:hidden}
#splash .splash-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:url(assets/bg-splash.jpg) no-repeat;background-size:100% 100%;pointer-events:none}
#splash .splash-layout{display:flex;align-items:center;justify-content:center;gap:48px;position:absolute;bottom:0;left:0;right:0;padding:32px 6%;z-index:2;width:100%}
#splash .main-title{font-size:64px;font-weight:400;letter-spacing:20px;color:#F7F3EE;font-family:'Long Cang','Ma Shan Zheng',cursive;line-height:1.4;text-shadow:0 2px 15px rgba(0,0,0,.6)}
#splash .enter-btn{border:none;background:transparent;color:#E8654A;font-size:22px;letter-spacing:8px;cursor:pointer;transition:all .3s;font-family:'ZCOOL QingKe HuangYou','STLiti','LiSu','FangSong',serif;padding:16px 8px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.3)}
#splash .enter-btn:hover,#splash .enter-btn:active{color:#D4956B;transform:scale(1.05)}
/* Prologue */
#prologue{background:#2D2A26;padding:0;position:relative}
.prologue-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:100% 100%;background-position:center;pointer-events:none}
.prologue-text-area{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 6%;z-index:2}
.prologue-text-area .scene-text-box{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:24px 28px;width:100%;box-shadow:0 -2px 20px rgba(0,0,0,.2)}
.prologue-text-area .scene-text{font-size:16px;line-height:2.2;color:#F7F3EE;font-family:'Noto Serif SC',serif}
.prologue-text-area .scene-author{font-size:12px;color:rgba(247,243,238,.5);margin-top:12px;letter-spacing:2px}
.continue-hint{font-size:12px;color:rgba(247,243,238,.4);letter-spacing:3px;margin-top:16px;cursor:pointer}
/* Chapter Intro */
#chapter-intro{background:#2D2A26;padding:0;text-align:left;overflow:hidden}
.chapter-intro-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:100% 100%;background-position:center;pointer-events:none}
.chapter-intro-wrap{display:none;flex-direction:column;position:absolute;bottom:0;left:0;right:0;z-index:2;padding:24px 6% 48px;width:100%}
.chapter-intro-wrap.active{display:flex}
.chapter-intro-wrap .dialogue-box{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:24px 28px;width:100%;box-shadow:0 -2px 20px rgba(0,0,0,.2)}
.chapter-intro-wrap .dialogue-box .db-text{font-size:16px;line-height:2.2;color:#F7F3EE;font-family:'Noto Serif SC',serif}
.chapter-intro-wrap .continue-btn{margin-top:16px;text-align:center;font-size:12px;color:rgba(247,243,238,.4);letter-spacing:3px;cursor:pointer;padding:8px 0}
/* Story */
#story{background:#2D2A26;padding:0;position:relative}
.story-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:100% 100%;background-position:center;pointer-events:none}
.story-wrap{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2;padding:0 6% 48px;width:100%}
.story-scene{display:none;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;animation:fadeIn .4s ease}
.story-scene.active{display:flex}
.story-scene .ss-speaker{font-size:12px;color:rgba(247,243,238,.6);letter-spacing:3px}
.story-scene .ss-text-box{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:20px 18px;width:100%;box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.story-scene .ss-text{font-size:16px;line-height:2.2;color:#F7F3EE;font-family:'Noto Serif SC',serif}
.story-scene .ss-narration{font-size:15px;line-height:2;color:rgba(247,243,238,.8);font-family:'Noto Serif SC',serif}
.story-continue{font-size:12px;color:rgba(247,243,238,.35);letter-spacing:3px;cursor:pointer;padding:8px 0}
/* Teach */
.teach-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.2;pointer-events:none}
#teach{background:#2D2A26;justify-content:center;padding:0;position:relative}
.teach-pager{width:100%;height:100%;display:flex;flex-direction:column;position:relative;z-index:2}
.teach-page{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;display:none;flex-direction:column;align-items:center;padding:48px 10%;animation:fadeIn .3s ease}
.teach-page.active{display:flex}
.teach-wrap{max-width:600px;width:100%;display:flex;flex-direction:column;gap:20px;align-self:center}
.tw-title{font-size:28px;font-weight:400;letter-spacing:6px;color:#F7F3EE;font-family:'Long Cang','Ma Shan Zheng',cursive;text-align:center}
.tw-subtitle{font-size:13px;letter-spacing:3px;color:rgba(247,243,238,.5);text-align:center}
.tw-master-dialogue{padding:20px 0}
.tw-master-dialogue .tw-md-speaker{font-size:12px;color:var(--ch-color);letter-spacing:3px;margin-bottom:10px}
.tw-master-dialogue .tw-md-title{font-size:20px;letter-spacing:4px;color:#F7F3EE;font-family:'Long Cang','Ma Shan Zheng',cursive;margin-bottom:12px;text-align:center}
.tw-master-dialogue .tw-md-text{font-size:15px;line-height:2.2;color:#F7F3EE;font-family:'Noto Serif SC',serif;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px}
.tw-section{padding:16px 0}
.tw-section-title{font-size:13px;color:var(--ch-color);letter-spacing:2px;margin-bottom:10px}
.tw-item{font-size:14px;line-height:2;color:rgba(247,243,238,.8);padding-left:16px;position:relative}
.tw-item::before{content:"";position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--ch-color)}
.tw-goal{font-size:14px;line-height:2;color:var(--ch-color);border:1px dashed rgba(247,243,238,.2);border-radius:8px;padding:16px}
.tw-warning{font-size:13px;line-height:2;color:rgba(247,243,238,.5);border:1px solid rgba(247,243,238,.1);border-radius:8px;padding:14px}
.tw-start-btn{align-self:center;padding:14px 56px;background:transparent;border:1px solid rgba(247,243,238,.3);color:#F7F3EE;font-size:15px;letter-spacing:4px;cursor:pointer;transition:all .3s;font-family:'Noto Serif SC',serif}
.tw-start-btn:hover{background:rgba(247,243,238,.1)}
.tw-start-btn:active{background:rgba(247,243,238,.15)}
.teach-source{text-align:center;font-size:11px;color:rgba(247,243,238,.3);letter-spacing:2px;padding-top:12px}
.teach-page-nav{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3}
.teach-page-dot{width:8px;height:8px;border-radius:50%;background:rgba(247,243,238,.2);cursor:pointer;transition:all .2s}
.teach-page-dot.active{background:#F7F3EE}
/* Timer */
#timer{background:#2D2A26;justify-content:center;padding:0;position:relative}
.timer-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.4;pointer-events:none}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;position:relative;z-index:2}
.timer-header{text-align:center}
.timer-header .th-method{font-size:24px;letter-spacing:6px;color:#F7F3EE;font-family:'Long Cang','Ma Shan Zheng',cursive}
.timer-header .th-master{font-size:13px;color:rgba(247,243,238,.5);letter-spacing:3px}
.timer-ring-wrap{position:relative;width:220px;height:220px}
.timer-ring-wrap svg{width:220px;height:220px;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:rgba(247,243,238,.1);stroke-width:4}
.timer-ring-fg{fill:none;stroke:var(--timer-color,#F7F3EE);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-breath-ring{fill:none;stroke:rgba(247,243,238,.15);stroke-width:2;animation:breatheRing 6s ease-in-out infinite;transform-origin:center}
.timer-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.timer-display .td-time{font-size:36px;color:#F7F3EE;font-family:'Noto Serif SC',serif;letter-spacing:4px;font-variant-numeric:tabular-nums}
.timer-display .td-label{font-size:13px;color:rgba(247,243,238,.4);letter-spacing:2px;margin-top:4px}
.timer-controls{display:flex;gap:20px}
.timer-btn{padding:10px 32px;border:1px solid rgba(247,243,238,.25);background:transparent;color:#F7F3EE;font-size:14px;letter-spacing:3px;cursor:pointer;transition:all .2s;font-family:'Noto Serif SC',serif}
.timer-btn:active{background:rgba(247,243,238,.1)}
.timer-btn.primary{background:rgba(247,243,238,.15);border-color:rgba(247,243,238,.4)}
.timer-btn.primary:active{background:rgba(247,243,238,.25)}
.timer-guide{font-size:13px;color:rgba(247,243,238,.4);text-align:center;line-height:1.8;max-width:400px;padding:0 24px;transition:opacity .4s ease}
.timer-finish-btn{padding:10px 32px;border:1px solid #C47A6A;color:#C47A6A;font-size:14px;letter-spacing:3px;cursor:pointer;transition:all .2s;background:transparent}
.timer-finish-btn:active{background:rgba(196,122,106,.15)}
/* Post Practice */
#post-practice{background:#2D2A26;padding:48px 10%;overflow-y:auto;position:relative}
.pp-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.25;pointer-events:none}
.pp-wrap{max-width:600px;width:100%;display:flex;flex-direction:column;gap:20px;align-self:center;position:relative;z-index:2}
.pp-title{font-size:22px;color:#F7F3EE;letter-spacing:4px;text-align:center}
.pp-duration{font-size:14px;color:rgba(247,243,238,.5);text-align:center;margin-top:8px}
.pp-feelings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pp-feel-btn{border:1px solid rgba(247,243,238,.2);background:rgba(247,243,238,.05);color:#F7F3EE;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.pp-feel-btn.selected{background:rgba(247,243,238,.2);border-color:rgba(247,243,238,.4)}
.pp-feel-btn:active{transform:scale(.95)}
.pp-note{border:1px solid rgba(247,243,238,.15);background:rgba(247,243,238,.05);color:#F7F3EE;padding:12px;border-radius:8px;font-size:14px;resize:none;width:100%;font-family:'Noto Serif SC',serif;outline:none;line-height:1.8;min-height:80px}
.pp-note:focus{border-color:rgba(247,243,238,.3)}
.pp-qigong{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:rgba(247,243,238,.5)}
.pp-qigong-toggle{width:20px;height:20px;border:1px solid rgba(247,243,238,.3);border-radius:4px;cursor:pointer;transition:all .2s}
.pp-qigong-toggle.checked{background:#F7F3EE;border-color:#F7F3EE}
.pp-qigong-toggle.checked::after{content:"+";color:#2D2A26;font-size:14px}
.pp-submit{padding:12px 48px;background:rgba(247,243,238,.15);border:1px solid rgba(247,243,238,.3);color:#F7F3EE;font-size:15px;letter-spacing:4px;cursor:pointer;transition:all .3s}
.pp-submit:active{background:rgba(247,243,238,.25)}
/* Master Feedback */
.mf-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.2;pointer-events:none}
#master-feedback{background:#2D2A26;padding:48px 10%;position:relative}
.mf-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;max-width:600px;animation:fadeUp .8s ease;position:relative;z-index:2}
.mf-speaker{font-size:12px;color:rgba(247,243,238,.5);letter-spacing:3px}
.mf-avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(247,243,238,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(247,243,238,.4);background:rgba(247,243,238,.05)}
.mf-text{font-size:16px;line-height:2.2;color:#F7F3EE;margin-top:16px;max-width:600px}
.mf-continue{padding:10px 32px;border:1px solid rgba(247,243,238,.2);color:#F7F3EE;font-size:14px;letter-spacing:3px;cursor:pointer;background:transparent;transition:all .2s}
.mf-continue:active{background:rgba(247,243,238,.1)}
/* Progress */
.progress-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.15;pointer-events:none}
#progress{background:#2D2A26;padding:56px 10%;overflow-y:auto;position:relative}
.progress-wrap{max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;margin:0 auto;position:relative;z-index:2}
.pw-title{font-size:22px;color:#F7F3EE;letter-spacing:4px;text-align:center}
.progress-path{position:relative;max-width:600px;width:100%;margin:40px auto}
.progress-path::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;background:rgba(247,243,238,.1)}
.progress-node{display:flex;align-items:center;gap:20px;padding:20px 0;position:relative;z-index:1}
.progress-dot{width:40px;height:40px;border-radius:50%;border:2px solid rgba(247,243,238,.2);background:#2D2A26;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(247,243,238,.4);flex-shrink:0}
.progress-node.done .progress-dot{background:#F7F3EE;border-color:#F7F3EE;color:#2D2A26}
.progress-node.current .progress-dot{border-color:var(--dot-color,#F7F3EE);box-shadow:0 0 12px var(--dot-color,#F7F3EE)}
.progress-node.locked .progress-dot{opacity:.3}
.progress-avatar{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center top;border:2px solid rgba(247,243,238,.3);flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.progress-node.locked .progress-avatar{display:none}
.progress-info{flex:1;padding-top:2px}
.pi-name{font-size:18px;color:#F7F3EE;letter-spacing:2px}
.pi-method{font-size:13px;color:rgba(247,243,238,.5)}
.pi-stage{font-size:11px;color:var(--ch-color,rgba(247,243,238,.4));margin-top:4px}
.pi-bar{height:4px;background:rgba(247,243,238,.1);border-radius:2px;margin-top:8px;overflow:hidden}
.pi-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.pi-days{font-size:12px;color:rgba(247,243,238,.4);margin-top:6px}
.pi-comment{font-size:12px;color:rgba(247,243,238,.4);margin-top:6px;font-style:italic}
.progress-actions{margin-top:16px;display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap}
.progress-btn{padding:10px 32px;border:1px solid rgba(247,243,238,.2);color:#F7F3EE;font-size:14px;letter-spacing:3px;cursor:pointer;background:transparent;transition:all .2s}
.progress-btn:active{background:rgba(247,243,238,.1)}
.progress-btn.reset-btn{color:rgba(247,243,238,.3);border-color:rgba(247,243,238,.1)}
.progress-btn.primary{background:rgba(247,243,238,.15);border-color:rgba(247,243,238,.3)}
/* Calendar */
.cal-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.15;pointer-events:none}
#calendar{background:#2D2A26;padding:48px 10%;overflow-y:auto;position:relative}
.cal-wrap{max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;margin:0 auto;position:relative;z-index:2}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;font-size:22px;color:#F7F3EE;letter-spacing:6px}
.cal-nav{display:flex;align-items:center;gap:16px;width:100%;justify-content:center}
.cal-nav-btn{padding:6px 16px;border:1px solid rgba(247,243,238,.2);background:transparent;color:rgba(247,243,238,.5);font-size:13px;cursor:pointer;transition:all .2s}
.cal-nav-btn:active{background:rgba(247,243,238,.1)}
.cal-month{font-size:18px;color:#F7F3EE;letter-spacing:3px;min-width:120px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.cal-weekday{font-size:12px;color:rgba(247,243,238,.3);text-align:center}
.cal-day{font-size:14px;color:rgba(247,243,238,.6);text-align:center;cursor:pointer;padding:8px 0;position:relative;transition:all .2s}
.cal-day.empty{cursor:default}
.cal-day.today{color:#F7F3EE;font-weight:bold}
.cal-day.has-practice::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--dot-color,rgba(247,243,238,.4))}
.cal-day:active{background:rgba(247,243,238,.1)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:12px;color:rgba(247,243,238,.4)}
.cal-legend-dot{width:8px;height:8px;border-radius:50%}
.cal-streak{text-align:center;font-size:13px;color:rgba(247,243,238,.4);margin-top:4px}
.cal-streak span{color:#F7F3EE;font-weight:bold}
.cal-back{margin-top:8px;padding:10px 32px;border:1px solid rgba(247,243,238,.2);color:#F7F3EE;font-size:14px;letter-spacing:3px;cursor:pointer;background:transparent;transition:all .2s}
.cal-back:active{background:rgba(247,243,238,.1)}
/* Modal */
.modal-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-card{background:#3a3735;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid rgba(247,243,238,.1)}
.mc-date{font-size:12px;color:rgba(247,243,238,.4)}
.mc-method{font-size:16px;color:#F7F3EE;letter-spacing:2px;display:flex;align-items:center;gap:8px;margin-top:8px}
.mc-method-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mc-duration{font-size:14px;color:rgba(247,243,238,.5);margin-top:8px}
.mc-feelings{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc-feel-tag{border:1px solid rgba(247,243,238,.15);color:#F7F3EE;padding:4px 12px;border-radius:12px;font-size:12px}
.mc-note{font-size:14px;color:rgba(247,243,238,.5);margin-top:8px;line-height:1.8}
.mc-feedback{font-size:14px;color:#F7F3EE;background:rgba(247,243,238,.05);padding:12px;border-radius:8px;margin-top:12px;border-left:3px solid var(--ch-color)}
.mc-close{margin-top:16px;padding:8px 24px;border:1px solid rgba(247,243,238,.2);color:rgba(247,243,238,.5);font-size:13px;cursor:pointer;background:transparent;width:100%;text-align:center;transition:all .2s}
.mc-close:active{background:rgba(247,243,238,.1)}
/* Nav */
.nav-bar{position:absolute;bottom:0;left:0;right:0;height:56px;background:rgba(45,42,38,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:space-around;z-index:50;border-top:1px solid rgba(247,243,238,.08)}
.nav-bar.active{display:flex}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:8px 16px;transition:all .2s}
.ni.active .ni-icon{color:#F7F3EE}
.ni.active .ni-label{color:#F7F3EE}
.ni-icon{font-size:20px;color:rgba(247,243,238,.35);transition:color .2s}
.ni-icon svg{width:20px;height:20px}
.ni-label{font-size:10px;color:rgba(247,243,238,.35);letter-spacing:1px;transition:color .2s}
/* Keyframes */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{box-shadow:0 0 8px var(--ch-color)}50%{box-shadow:0 0 20px var(--ch-color)}}
@keyframes breatheRing{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(1.06);opacity:.5}}
.blink{animation:blink 2s ease-in-out infinite}

// ==================== WIND CANVAS ====================
var canvas,ctx,particles=[],currentColor=COLORS.zhanzhuang,animId;

function initCanvas(){
  canvas=document.getElementById("wind-canvas");
  ctx=canvas.getContext("2d");
  resizeCanvas();
  window.addEventListener("resize",resizeCanvas);
  for(var i=0;i<40;i++) particles.push(makeParticle());
  animLoop();
}

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

function makeParticle(){
  var w=window.innerWidth;
  var h=window.innerHeight;
  return {x:Math.random()*w,y:Math.random()*h,
    vx:.2+Math.random()*.5,vy:-.1+Math.random()*.2,
    size:1+Math.random()*2,alpha:.1+Math.random()*.3,life:Math.random()*100};
}

function animLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life+=.5;
    if(p.x>canvas.width+10) p.x=-10;
    if(p.y<-10||p.y>canvas.height+10){p.y=Math.random()*canvas.height;p.x=-10;}
    var a=p.alpha*(.5+.5*Math.sin(p.life*.02));
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=currentColor;
    ctx.globalAlpha=a;
    ctx.fill();
  }
  ctx.globalAlpha=1;
  animId=requestAnimationFrame(animLoop);
}

function setParticleColor(c){currentColor=c;}

// ==================== SCREEN MANAGEMENT ====================
var currentScreen="splash";
var screenHistory=[];

function showScreen(id,skipNav){
  var prev=document.getElementById(currentScreen);
  if(prev){prev.classList.remove("active");prev.classList.add("fade-out");
    setTimeout(function(){prev.classList.remove("fade-out");},600);}
  var next=document.getElementById(id);
  if(next){next.classList.add("active");next.classList.add("fade-in");
    setTimeout(function(){next.classList.remove("fade-in");},600);}
  currentScreen=id;
  // Nav bar
  var nav=document.getElementById("nav-bar");
  var showNav=["progress","teach","calendar"].indexOf(id)>=0;
  if(state.started&&state.storySeen) showNav=true;
  nav.classList.toggle("active",showNav);
  // Update nav active states
  document.querySelectorAll(".ni").forEach(function(el){el.classList.remove("active");});
  if(id==="progress") document.getElementById("nav-progress").classList.add("active");
  if(id==="teach") document.getElementById("nav-teach").classList.add("active");
  if(id==="calendar") document.getElementById("nav-calendar").classList.add("active");
}

// ==================== TIMER ====================
var timerState={running:false,paused:false,seconds:0,total:0,interval:null};

function startTimer(){
  var ch=CHAPTERS[state.chapter-1];
  var stage=ch.stages[state.stage];
  timerState.total=0;
  timerState.seconds=0;
  timerState.running=false;
  timerState.paused=false;
  timerState.countUp=true;
  if(timerState.interval){clearInterval(timerState.interval);timerState.interval=null;}
  setParticleColor(ch.color);
  document.getElementById("timer-method").textContent=ch.method;
  document.getElementById("timer-master").textContent=ch.master;
  document.getElementById("timer-ring").style.stroke=ch.color;
  document.getElementById("timer-ring").style.strokeDasharray="628";
  document.getElementById("timer-ring").style.strokeDashoffset="0";
  document.getElementById("btn-play").innerHTML="&#9654;";
  document.getElementById("btn-play").className="timer-btn primary";
  document.getElementById("btn-finish").style.display="none";
  // Set timer background
  var timerBg=document.getElementById("timer-bg");
  if(timerBg){
    var bgUrl=IMAGES.meditation;
    if(state.chapter===2) bgUrl=IMAGES.story;
    timerBg.style.backgroundImage="url("+bgUrl+")";
  }
  updateTimerDisplay();
  var td=TEACH_DATA[state.chapter];
  var teach=td?td[state.stage]:null;
  var guide=teach?teach.guide:"什么都不不要想。只是坐着。";
  document.getElementById("timer-guide").textContent=guide;
  document.getElementById("timer-label").textContent="准备开始";
  // 动态陪伴文字
  var whispers=TIMER_WHISPERS[state.chapter]||TIMER_WHISPERS[1];
  var guideEl=document.getElementById("timer-guide");
  guideEl.textContent=whispers[0];
  var whisperIdx=0;
  if(window._whisperInterval){clearInterval(window._whisperInterval);}
  window._whisperInterval=setInterval(function(){
    whisperIdx=(whisperIdx+1)%whispers.length;
    guideEl.style.opacity="0";
    setTimeout(function(){
      guideEl.textContent=whispers[whisperIdx];
      guideEl.style.opacity="1";
    },400);
  },30000);
  showScreen("timer");
}

function updateTimerDisplay(){
  var m=Math.floor(timerState.seconds/60);
  var s=timerState.seconds%60;
  document.getElementById("timer-display").textContent=
    (m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
  // count-up: ring fills up to represent time
  var targetMins=240; // 4 hours reference
  var pct=Math.min(timerState.seconds/(targetMins*60),1);
  document.getElementById("timer-ring").style.strokeDashoffset=628*(1-pct);
}

function timerToggle(){
  if(!timerState.running){
    timerState.running=true;timerState.paused=false;
    document.getElementById("btn-play").innerHTML="&#9646;&#9646;";
    document.getElementById("btn-play").className="timer-btn";
    document.getElementById("timer-label").textContent="正在练功";
    document.getElementById("btn-finish").style.display="inline-block";
    timerState.interval=setInterval(function(){
      timerState.seconds++;updateTimerDisplay();
    },1000);
  } else if(!timerState.paused){
    clearInterval(timerState.interval);timerState.interval=null;
    timerState.paused=true;
    document.getElementById("btn-play").innerHTML="&#9654;";
    document.getElementById("btn-play").className="timer-btn primary";
    document.getElementById("timer-label").textContent="已暂停";
  } else {
    timerState.paused=false;
    document.getElementById("btn-play").innerHTML="&#9646;&#9646;";
    document.getElementById("btn-play").className="timer-btn";
    document.getElementById("timer-label").textContent="正在练功";
    timerState.interval=setInterval(function(){
      if(timerState.seconds>0){timerState.seconds--;updateTimerDisplay();}
      else{clearInterval(timerState.interval);timerState.interval=null;
        timerState.running=false;
        document.getElementById("timer-label").textContent="已完成";}
    },1000);
  }
}

function timerReset(){
  if(timerState.interval){clearInterval(timerState.interval);timerState.interval=null;}
  timerState.running=false;timerState.paused=false;
  timerState.seconds=timerState.total;
  document.getElementById("btn-play").innerHTML="&#9654;";
  document.getElementById("btn-play").className="timer-btn primary";
  document.getElementById("timer-label").textContent="准备开始";
  document.getElementById("btn-finish").style.display="none";
  updateTimerDisplay();
}

function finishPractice(){
  if(timerState.interval){clearInterval(timerState.interval);timerState.interval=null;}
  if(window._whisperInterval){clearInterval(window._whisperInterval);window._whisperInterval=null;}
  timerState.running=false;
  var elapsed=timerState.seconds;
  var ch=CHAPTERS[state.chapter-1];
  document.getElementById("pp-duration").textContent=formatTime(elapsed);
  renderFeelings();
  document.getElementById("pp-note").value="";
  document.getElementById("pp-qigong-toggle").classList.remove("checked");
  window._ppElapsed=elapsed;
  showScreen("post-practice");
}

function formatTime(s){
  var m=Math.floor(s/60);var sec=s%60;
  return (m<10?"0"+m:m)+"分"+(sec<10?"0"+sec:sec)+"秒";
}

function renderFeelings(){
  var c=document.getElementById("pp-feelings");
  var html="";
  for(var i=0;i<FEELINGS.length;i++){
    html+='<button class="pp-feel-btn" data-f="'+FEELINGS[i]+'" onclick="toggleFeeling(this)">'+FEELINGS[i]+'</button>';
  }
  c.innerHTML=html;
}

function toggleFeeling(btn){
  btn.classList.toggle("selected");
}

function toggleQigong(){
  document.getElementById("pp-qigong-toggle").classList.toggle("checked");
}

function submitPractice(){
  var ch=CHAPTERS[state.chapter-1];
  var feelings=[];
  document.querySelectorAll(".pp-feel-btn.selected").forEach(function(el){
    feelings.push(el.getAttribute("data-f"));
  });
  var note=document.getElementById("pp-note").value.trim();
  var hasQigong=document.getElementById("pp-qigong-toggle").classList.contains("checked");
  var record={
    date:new Date().toISOString().split("T")[0],
    chapter:state.chapter,
    stage:state.stage,
    method:ch.method,
    master:ch.master,
    duration:window._ppElapsed||0,
    feeling:feelings,
    note:note,
    qigongSense:hasQigong
  };
  state.records.push(record);
  saveState();
  showMasterFeedback();
}

// ==================== MASTER FEEDBACK ====================
function showMasterFeedback(){
  var ch=CHAPTERS[state.chapter-1];
  setParticleColor(ch.color);
  var c=document.getElementById("mf-content");
  var fb=MASTER_FEEDBACKS[state.chapter];
  if(!fb){
    c.innerHTML='<div class="mf-wrap">'+
      '<div class="mf-avatar" style="border-color:'+ch.color+'">'+ch.master[0]+'</div>'+
      '<div class="mf-speaker">'+ch.master+'</div>'+
      '<div class="mf-text">"不错。继续保持。"</div>'+
      '<div class="mf-continue" onclick="afterFeedback()">继续</div></div>';
    showScreen("master-feedback");return;
  }
  var stageFb=fb[state.stage]||fb[fb.length-1];
  // Pick based on practice count
  var chapterRecords=state.records.filter(function(r){return r.chapter===state.chapter;});
  var idx=chapterRecords.length-1;
  if(idx<0) idx=0;
  if(idx>=fb.length) idx=fb.length-1;
  stageFb=fb[idx];
  var html='<div class="mf-wrap">';
  html+='<div class="mf-avatar" style="border-color:'+ch.color+'">'+ch.master[0]+'</div>';
  html+='<div class="mf-speaker">'+ch.master+'</div>';
  html+='<div class="mf-text">'+stageFb.text.replace(/\n/g,"<br>").replace(/"/g,"<em>")+'</div>';
  html+='<div class="mf-continue" onclick="afterFeedback()">继续</div>';
  html+='</div>';
  c.innerHTML=html;
  showScreen("master-feedback");
}

function afterFeedback(){
  var ch=CHAPTERS[state.chapter-1];
  // Check chapter completion
  var chapterRecords=state.records.filter(function(r){return r.chapter===state.chapter;});
  var stage=ch.stages[state.stage];
  // Check if should advance stage
  if(stage && chapterRecords.length >= stage.days){
    if(state.stage < ch.stages.length-1){
      state.stage++;
      saveState();
    }
  }
  showScreen("progress");
  renderProgress();
}

// ==================== PROGRESS ====================
function renderProgress(){
  var c=document.getElementById("progress-path");
  var acts=document.getElementById("progress-actions");
  var ch=CHAPTERS[state.chapter-1];
  setParticleColor(ch.color);
  var chapterRecords=state.records.filter(function(r){return r.chapter===state.chapter;});
  var html="";
  for(var i=0;i<CHAPTERS.length;i++){
    var ch_=CHAPTERS[i];
    var isDone=state.chapter>i+1;
    var isCurrent=state.chapter===i+1;
    var isLocked=state.chapter<i+1;
    var cls=isDone?"done":isCurrent?"current":"locked";
    html+='<div class="progress-node '+cls+'" style="--ch-color:'+ch_.color+'">';
    var mImg=IMAGES.masters[i+1]||"";
    if(mImg&&!isLocked) html+='<div class="progress-avatar" style="background-image:url('+mImg+')"></div>';
    html+='<div class="progress-dot">';
    if(isDone) html+='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#F7F3EE" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>';
    else if(isLocked) html+='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(247,243,238,.3)" stroke-width="1.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    else html+=(i+1);
    html+='</div>';
    html+='<div class="progress-info" style="--ch-color:'+ch_.color+'">';
    html+='<div class="pi-name">'+ch_.name+'</div>';
    html+='<div class="pi-method">'+ch_.master+' · '+ch_.method+'</div>';
    if(isCurrent){
      var stg=ch_.stages[state.stage]||ch_.stages[0];
      html+='<div class="pi-stage">'+stg.name+'</div>';
      var daysTotal=stg.days;
      var daysDone=chapterRecords.length;
      var pct=Math.min(100,Math.round(daysDone/daysTotal*100));
      html+='<div class="pi-bar"><div class="pi-bar-fill" style="width:'+pct+'%;background:'+ch_.color+'"></div></div>';
      html+='<div class="pi-days">已修炼 '+daysDone+' 天 / '+daysTotal+' 天</div>';
      var comments=MASTER_COMMENTS[i+1];
      if(comments&&daysDone>0){
        var comment=comments[daysDone%comments.length];
        html+='<div class="pi-comment">'+comment+'</div>';
      }
    }
    if(isDone) html+='<div class="pi-stage" style="color:rgba(247,243,238,.5)">已完成</div>';
    if(isLocked) html+='<div class="pi-stage">未解锁</div>';
    html+='</div></div>';
  }
  c.innerHTML=html;
  // Actions
  var ahtml="";
  if(state.storySeen){
    ahtml+='<button class="progress-btn primary" onclick="startTimer()">开始练功</button>';
  } else {
    ahtml+='<button class="progress-btn primary" onclick="showScreen(\'story\');renderStory();">继续剧情</button>';
  }
  ahtml+='<button class="progress-btn" onclick="showScreen(\'teach\');renderTeach();">查看功法</button>';
  ahtml+='<button class="progress-btn" onclick="showScreen(\'calendar\');renderCalendar();">修炼日历</button>';
  ahtml+='<button class="progress-btn reset-btn" onclick="resetProgress()">旧梦重斟</button>';
  acts.innerHTML=ahtml;
}

function resetProgress(){
  if(!confirm('旧梦重斟？\n所有修炼记录将被清除，此程不可逆转。')) return;
  localStorage.clear();
  location.reload();
}

// ==================== CALENDAR ====================
var calYear, calMonth;

function renderCalendar(){
  var now=new Date();
  if(!calYear){calYear=now.getFullYear();calMonth=now.getMonth();}
  renderCalMonth();
}

function calPrev(){
  calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalMonth();
}
function calNext(){
  calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalMonth();
}

function renderCalMonth(){
  var monthNames=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  document.getElementById("cal-month").textContent=calYear+"年 "+monthNames[calMonth];
  var grid=document.getElementById("cal-grid");
  var weekdays=["日","一","二","三","四","五","六"];
  var html="";
  for(var w=0;w<7;w++) html+='<div class="cal-weekday">'+weekdays[w]+'</div>';
  var firstDay=new Date(calYear,calMonth,1).getDay();
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  var today=new Date();
  for(var e=0;e<firstDay;e++) html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var isToday=(today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d);
    var rec=getRecordByDate(dateStr);
    var cls="cal-day";
    if(isToday) cls+=" today";
    if(rec) cls+=" has-practice";
    var dotStyle=rec?'style="--dot-color:'+getChapterColor(rec.chapter)+'"':'';
    var onclick=rec?'onclick="showDayDetail(\''+dateStr+'\')"':'';
    html+='<div class="'+cls+'" '+dotStyle+' '+onclick+'>'+d+'</div>';
  }
  grid.innerHTML=html;
  // Legend
  var legend=document.getElementById("cal-legend");
  var lhtml="";
  var seen={};
  state.records.forEach(function(r){if(!seen[r.chapter]){seen[r.chapter]=true;
    var ch=CHAPTERS[r.chapter-1];
    lhtml+='<div class="cal-legend-item"><div class="cal-legend-dot" style="background:'+ch.color+'"></div>'+ch.method+'</div>';
  }});
  legend.innerHTML=lhtml;
  // Streak
  var streak=calcStreak();
  document.getElementById("cal-streak").innerHTML="连续打卡 <span>"+streak+"</span> 天";
}

function getRecordByDate(dateStr){
  for(var i=state.records.length-1;i>=0;i--){
    if(state.records[i].date===dateStr) return state.records[i];
  }
  return null;
}

function getChapterColor(chId){
  var ch=CHAPTERS[chId-1];return ch?ch.color:"rgba(247,243,238,.4)";
}

function calcStreak(){
  if(state.records.length===0) return 0;
  var dates={};
  state.records.forEach(function(r){dates[r.date]=true;});
  var streak=0;
  var d=new Date();
  while(true){
    var ds=d.toISOString().split("T")[0];
    if(dates[ds]){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

function showDayDetail(dateStr){
  var rec=getRecordByDate(dateStr);
  if(!rec) return;
  var ch=CHAPTERS[rec.chapter-1];
  var modal=document.getElementById("detail-modal");
  var card=document.getElementById("modal-card");
  card.style.setProperty("--ch-color",ch.color);
  var html='<div class="mc-date">'+dateStr+'</div>';
  html+='<div class="mc-method"><div class="mc-method-dot" style="background:'+ch.color+'"></div>'+rec.method+' · '+rec.master+'</div>';
  html+='<div class="mc-duration">'+formatTime(rec.duration)+'</div>';
  if(rec.feeling&&rec.feeling.length>0){
    html+='<div class="mc-feelings">';
    rec.feeling.forEach(function(f){html+='<div class="mc-feel-tag">'+f+'</div>';});
    html+='</div>';
  }
  if(rec.note) html+='<div class="mc-note">'+rec.note+'</div>';
  if(rec.qigongSense) html+='<div class="mc-note" style="color:'+ch.color+'">今日有气感</div>';
  var fb=MASTER_FEEDBACKS[rec.chapter];
  if(fb&&fb.length>0){
    var fbText=fb[0].text;
    html+='<div class="mc-feedback">'+fbText.replace(/\n/g,"<br>").replace(/"/g,"")+'</div>';
  }
  html+='<button class="mc-close" onclick="closeModal()">关闭</button>';
  card.innerHTML=html;
  modal.classList.add("active");
}

function closeModal(e){
  if(e&&e.target!==document.getElementById("detail-modal")) return;
  document.getElementById("detail-modal").classList.remove("active");
}

// ==================== INIT ====================
window.addEventListener("DOMContentLoaded",function(){
  initCanvas();
  var hasData=loadState();
  if(hasData&&state.started){
    // Show splash briefly then go to progress
    var ch=CHAPTERS[state.chapter-1];
    setParticleColor(ch.color);
  }
});
</script>
