<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人空间 · Drop Snacks</title>
<meta name="description" content="Drop Snacks 私人空间：查看你的余波、选择时间线和审核示例回声。数据仅保存在此浏览器，Guest Mode 本地只读视图。">
<meta name="theme-color" content="#faf7f0">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/css/private-space.css">
</head>
<body>
<a class="skip-link" href="#main">跳至正文</a>

<div class="private-shell">

  <!-- ============ Header ============ -->
  <header class="private-header" role="banner">
    <div class="private-header-inner">
      <span class="ps-brand">丢掉零食 · 私人空间 <small>Drop Snacks</small></span>
      <div class="ps-header-meta">
        <span class="ps-badge">Guest Mode</span>
        <span>数据仅保存在此浏览器</span>
      </div>
      <nav class="ps-header-links" aria-label="返回导航">
        <a href="../experience/index.html">← 返回当前体验</a>
        <a href="../index.html">返回公开首页</a>
      </nav>
    </div>
  </header>

  <main id="main" class="private-main">

    <!-- ============ Intro ============ -->
    <section class="private-intro">
      <h1>你的时间，在这里回顾。</h1>
      <p class="ps-lead">体验负责当下的选择；这里负责时间——查看待回应与已回答的余波、你的选择时间线，以及经过审核的同类回声。这是一个本地只读的 Guest Mode 视图，不涉及账号、云端或社区。</p>
      <noscript>
        <p class="ps-noscript">启用 JavaScript 后可读取此浏览器中的本地记录。</p>
      </noscript>
    </section>

    <!-- ============ 当前余波 ============ -->
    <section id="ps-current" class="private-section afterglow-focus" aria-live="polite"></section>

    <!-- ============ 已回答余波 ============ -->
    <section id="ps-answered" class="private-section afterglow-history"></section>

    <!-- ============ 选择时间线 ============ -->
    <section id="ps-timeline" class="private-section choice-timeline"></section>

    <!-- ============ 同类回声 ============ -->
    <section id="ps-echoes" class="private-section private-echoes"></section>

    <!-- ============ 数据与信任 ============ -->
    <section id="ps-data" class="private-section data-trust"></section>

  </main>
</div>

<!-- ============ 脚本（按依赖顺序，仅加载一次） ============ -->
<script defer src="../assets/data/copy-bank.js"></script>
<script defer src="../assets/data/echo-bank.js"></script>
<script defer src="../assets/js/store.js"></script>
<script defer src="../assets/js/competition-demo.js"></script>
<script defer src="../assets/js/afterglow-engine.js"></script>
<script defer src="../assets/js/echo-engine.js"></script>
<script defer src="../assets/js/private-space.js"></script>
</body>
</html>
