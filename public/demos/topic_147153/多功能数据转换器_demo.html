<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子转换</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-dark: #121212;
    --bg-nav: #0D0D0D;
    --bg-primary: #1E1E1E;
    --bg-secondary: #252525;
    --bg-tertiary: #333333;
    --bg-entry: #2D2D2D;
    --bg-card: #252525;
    --bg-button: #252525;
    --bg-button-active: #2A2A2A;
    --text-primary: #E0E0E0;
    --text-secondary: #888888;
    --text-dim: #666666;
    --accent-primary: #00BFFF;
    --accent-secondary: #00FFCC;
    --accent-error: #FF4444;
    --accent-warning: #FFA500;
    --accent-success: #00FF88;
    --border: #3A3A3A;
    --separator: #3A3A3A;
    --accent-blue: #00BFFF;
    --accent-cyan: #00FFCC;
    --nav-bg: #0D0D0D;
    --font-title: 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
    --font-body: 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Consolas', 'Courier New', monospace;
}

body {
    font-family: var(--font-body);
    font-size: 11px;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* 菜单栏 */
.menu-bar { background: var(--bg-dark); display: flex; padding: 0; flex-shrink: 0; }
.menu-btn { background: none; border: none; color: var(--text-primary); padding: 8px 16px; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
.menu-btn:hover { background: var(--bg-secondary); color: var(--accent-primary); }

/* 主容器 */
.main-container { display: flex; flex: 1; overflow: hidden; }

/* 导航栏 */
.nav-panel { width: 210px; background: var(--bg-nav); display: flex; flex-direction: column; flex-shrink: 0; }
.nav-title { font-size: 16px; font-weight: bold; color: var(--accent-cyan); padding: 20px 10px 5px 10px; text-align: center; }
.nav-separator { border: none; border-top: 1px solid var(--separator); margin: 0 10px; }
.nav-buttons { flex: 1; padding: 5px; }
.nav-btn-row { display: flex; align-items: center; padding: 5px 0; cursor: pointer; }
.nav-indicator { width: 3px; height: 28px; background: var(--nav-bg); margin-right: 5px; border-radius: 2px; transition: background 0.2s; }
.nav-indicator.active { background: var(--accent-blue); }
.nav-btn { flex: 1; background: none; border: none; color: var(--text-primary); padding: 6px 10px; text-align: left; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
.nav-btn:hover { background: var(--bg-secondary); }
.nav-version { font-size: 9px; color: var(--text-secondary); padding: 10px; text-align: center; }

/* 内容区 */
.content-panel { flex: 1; padding: 20px; overflow-y: auto; }

/* 历史记录面板 */
.history-panel { width: 260px; background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.history-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; }
.history-title { font-size: 13px; font-weight: bold; color: var(--accent-secondary); }
.history-clear-btn { background: var(--accent-primary); color: #000; border: none; padding: 4px 12px; cursor: pointer; font-size: 11px; font-family: var(--font-body); font-weight: bold; }
.history-clear-btn:hover { background: var(--accent-secondary); }
.history-sep { border: none; border-top: 1px solid var(--separator); }
.history-content { flex: 1; overflow-y: auto; padding: 10px; }
.history-empty { color: var(--text-dim); text-align: center; padding: 40px 10px; white-space: pre-line; }
.history-entry { background: var(--bg-tertiary); padding: 8px; margin-bottom: 5px; }
.history-entry-type { color: var(--accent-primary); font-size: 9px; }
.history-entry-input { color: var(--text-primary); }
.history-entry-result { color: var(--accent-secondary); font-family: var(--font-mono); font-weight: bold; font-size: 10px; }

/* 通用组件 */
.page-title { font-size: 16px; font-weight: bold; color: var(--text-primary); margin-bottom: 15px; }

.input-group { margin-bottom: 10px; }
.input-label { display: block; color: var(--text-primary); margin-bottom: 2px; font-size: 11px; }
.input-field { width: 100%; padding: 6px 10px; background: var(--bg-entry); border: 1px solid var(--border); color: var(--text-primary); font-size: 14px; font-family: var(--font-body); outline: none; }
.input-field:focus { border-color: var(--accent-primary); }
.input-field::placeholder { color: var(--text-dim); }

.select-field { width: 100%; padding: 6px 10px; background: var(--bg-entry); border: 1px solid var(--border); color: var(--text-primary); font-size: 11px; font-family: var(--font-body); outline: none; cursor: pointer; appearance: none; }
.select-field:focus { border-color: var(--accent-primary); }

.two-col { display: flex; gap: 10px; }
.two-col > * { flex: 1; }

.resistor-row { display: flex; align-items: center; margin-bottom: 5px; }

.btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
.btn-accent { background: var(--accent-primary); color: #000; border: none; padding: 8px 20px; cursor: pointer; font-size: 11px; font-family: var(--font-body); font-weight: bold; }
.btn-accent:hover { background: var(--accent-secondary); }
.btn-normal { background: var(--bg-button); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 20px; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
.btn-normal:hover { background: var(--bg-button-active); }
.btn-small { padding: 4px 10px; font-size: 10px; }

.result-card { background: var(--bg-card); border: 1px solid var(--border); margin-top: 10px; }
.result-card-title { font-size: 13px; font-weight: bold; color: var(--accent-secondary); padding: 10px; }
.result-card-sep { border: none; border-top: 1px solid var(--separator); margin: 0 10px; }
.result-card-body { padding: 10px; }
.result-row { display: flex; padding: 5px 0; }
.result-row + .result-row { border-top: 1px solid var(--separator); }
.result-label { width: 140px; text-align: center; color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }
.result-value { flex: 1; color: var(--accent-secondary); font-family: var(--font-mono); font-size: 14px; font-weight: bold; }

.msg-error { color: var(--accent-error); font-size: 11px; margin-top: 5px; }
.msg-warning { color: var(--accent-warning); font-size: 11px; margin-top: 5px; }

.dropdown { position: relative; display: inline-block; }
.dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: var(--bg-dark); border: 1px solid var(--border); min-width: 160px; z-index: 100; }
.dropdown-content.show { display: block; }
.dropdown-item { display: block; width: 100%; padding: 8px 16px; background: none; border: none; color: var(--text-primary); text-align: left; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
.dropdown-item:hover { background: var(--bg-secondary); color: var(--accent-primary); }
.dropdown-item:disabled { color: var(--text-dim); cursor: default; }
.dropdown-item:disabled:hover { background: none; color: var(--text-dim); }
</style>
</head>
<body>

<!-- 菜单栏 -->
<div class="menu-bar">
    <div class="dropdown">
        <button class="menu-btn" onclick="toggleDropdown('file-menu')">文件</button>
        <div class="dropdown-content" id="file-menu">
            <button class="dropdown-item" onclick="clearHistory();toggleDropdown('file-menu')">清空历史记录</button>
        </div>
    </div>
    <div class="dropdown">
        <button class="menu-btn" onclick="toggleDropdown('view-menu')">视图</button>
        <div class="dropdown-content" id="view-menu"></div>
    </div>
    <div class="dropdown">
        <button class="menu-btn" onclick="toggleDropdown('theme-menu')">主题</button>
        <div class="dropdown-content" id="theme-menu">
            <button class="dropdown-item" disabled>默认主题 &#10003;</button>
        </div>
    </div>
    <div class="dropdown">
        <button class="menu-btn" onclick="toggleDropdown('help-menu')">帮助</button>
        <div class="dropdown-content" id="help-menu">
            <button class="dropdown-item" onclick="showAbout();toggleDropdown('help-menu')">关于</button>
        </div>
    </div>
</div>

<!-- 主容器 -->
<div class="main-container">
    <!-- 导航栏 -->
    <div class="nav-panel">
        <div class="nav-title">量子转换</div>
        <hr class="nav-separator">
        <div class="nav-buttons" id="nav-buttons"></div>
        <div class="nav-version">v1.0.0</div>
    </div>

    <!-- 内容区 -->
    <div class="content-panel">
        <!-- 物理单位 -->
        <div class="view-page" id="page-unit">
            <div class="page-title">⚛ 物理单位转换</div>
            <div class="input-group">
                <label class="input-label">选择类别</label>
                <select class="select-field" id="unit-category" onchange="onUnitCategoryChange()"></select>
            </div>
            <div class="two-col">
                <div class="input-group">
                    <label class="input-label">源单位</label>
                    <select class="select-field" id="unit-from"></select>
                </div>
                <div class="input-group">
                    <label class="input-label">目标单位</label>
                    <select class="select-field" id="unit-to"></select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">输入数值</label>
                <input class="input-field" id="unit-input" placeholder="输入数值，如 100 或 3.14">
            </div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertUnit()">转 换</button>
                <button class="btn-accent" onclick="clearUnit()">清 空</button>
            </div>
            <div id="msg-unit"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-unit"></div>
            </div>
        </div>

        <!-- 进制转换 -->
        <div class="view-page" id="page-radix" style="display:none">
            <div class="page-title">⊞ 进制转换</div>
            <div class="two-col">
                <div class="input-group">
                    <label class="input-label">源进制</label>
                    <select class="select-field" id="radix-from">
                        <option value="DEC">十进制(DEC)</option>
                        <option value="BIN">二进制(BIN)</option>
                        <option value="OCT">八进制(OCT)</option>
                        <option value="HEX">十六进制(HEX)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">目标进制</label>
                    <select class="select-field" id="radix-to">
                        <option value="BIN">二进制(BIN)</option>
                        <option value="OCT">八进制(OCT)</option>
                        <option value="DEC">十进制(DEC)</option>
                        <option value="HEX" selected>十六进制(HEX)</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">输入数值</label>
                <input class="input-field" id="radix-input" placeholder="输入数值，如 255 或 FF">
            </div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertRadix()">转 换</button>
                <button class="btn-accent" onclick="clearRadix()">清 空</button>
            </div>
            <div id="msg-radix"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-radix"></div>
            </div>
        </div>

        <!-- IEEE 754 -->
        <div class="view-page" id="page-ieee754" style="display:none">
            <div class="page-title">◇ IEEE 754 浮点数转换</div>
            <div class="input-group">
                <label class="input-label">精度</label>
                <select class="select-field" id="ieee754-precision">
                    <option value="single">单精度(32-bit)</option>
                    <option value="double">双精度(64-bit)</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-label">方向</label>
                <select class="select-field" id="ieee754-direction" onchange="onIEEE754DirectionChange()">
                    <option value="to_ieee">十进制 → IEEE 754</option>
                    <option value="to_decimal">IEEE 754 → 十进制</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-label" id="ieee754-input-label">输入十进制数</label>
                <input class="input-field" id="ieee754-input" placeholder="输入十进制数，如 -12.375 或 3.14">
            </div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertIEEE754()">转 换</button>
                <button class="btn-accent" onclick="clearIEEE754()">清 空</button>
            </div>
            <div id="msg-ieee754"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-ieee754"></div>
            </div>
        </div>

        <!-- 硬件转换 -->
        <div class="view-page" id="page-hardware" style="display:none">
            <div class="page-title">₢ 硬件转换</div>
            <div class="input-group">
                <label class="input-label">功能类型</label>
                <select class="select-field" id="hw-function" onchange="onHWFunctionChange()">
                    <option value="mil_mm">mil 转 mm 换算</option>
                    <option value="series">串联电阻计算</option>
                    <option value="parallel">并联电阻计算</option>
                    <option value="wire_current">线宽 转 电流</option>
                </select>
            </div>
            <div id="hw-inputs"></div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertHW()">转 换</button>
                <button class="btn-accent" onclick="clearHW()">清 空</button>
            </div>
            <div id="msg-hardware"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-hardware"></div>
            </div>
        </div>

        <!-- 软件转换 -->
        <div class="view-page" id="page-software" style="display:none">
            <div class="page-title">₻ 软件转换</div>
            <div class="input-group">
                <label class="input-label">功能类型</label>
                <select class="select-field" id="sw-function" onchange="onSWFunctionChange()">
                    <option value="bit_byte">bit ↔ byte</option>
                    <option value="byte_kb">byte ↔ KB</option>
                    <option value="kb_mb">KB ↔ MB</option>
                </select>
            </div>
            <div id="sw-inputs"></div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertSW()">转 换</button>
                <button class="btn-accent" onclick="clearSW()">清 空</button>
            </div>
            <div id="msg-software"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-software"></div>
            </div>
        </div>

        <!-- 气体浓度 -->
        <div class="view-page" id="page-gas" style="display:none">
            <div class="page-title">☲ 气体浓度转换</div>
            <div class="input-group">
                <label class="input-label">选择气体</label>
                <select class="select-field" id="gas-type" onchange="onGasTypeChange()"></select>
            </div>
            <div class="input-group">
                <label class="input-label">选择国标</label>
                <select class="select-field" id="gas-standard"></select>
            </div>
            <div class="input-group">
                <label class="input-label">换算方向</label>
                <select class="select-field" id="gas-direction" onchange="onGasDirectionChange()"></select>
            </div>
            <div class="input-group">
                <label class="input-label">输入数值</label>
                <input class="input-field" id="gas-input" placeholder="输入浓度数值">
            </div>
            <div class="btn-row">
                <button class="btn-accent" onclick="convertGas()">转 换</button>
                <button class="btn-accent" onclick="clearGas()">清 空</button>
            </div>
            <div id="msg-gas"></div>
            <div class="result-card">
                <div class="result-card-title">结果</div>
                <hr class="result-card-sep">
                <div class="result-card-body" id="result-body-gas"></div>
            </div>
        </div>
    </div>

    <!-- 历史记录面板 -->
    <div class="history-panel">
        <div class="history-header">
            <span class="history-title">历史记录</span>
            <button class="history-clear-btn" onclick="clearHistory()">清 空</button>
        </div>
        <hr class="history-sep">
        <div class="history-content" id="history-content">
            <div class="history-empty">还没有计算结果\n开始转换吧</div>
        </div>
    </div>
</div>

<script>
// ====== 辅助函数 ======
function $(id) { return document.getElementById(id); }
function qs(sel, parent) { return (parent || document).querySelector(sel); }
function qsa(sel, parent) { return (parent || document).querySelectorAll(sel); }

function showMessage(viewId, text, type) {
    const el = document.getElementById('msg-' + viewId);
    if (!el) return;
    el.textContent = text;
    el.className = 'msg-' + type;
}

function clearMessage(viewId) {
    const el = document.getElementById('msg-' + viewId);
    if (el) { el.textContent = ''; el.className = ''; }
}

function clearResultCard(viewId) {
    const body = document.getElementById('result-body-' + viewId);
    if (body) body.innerHTML = '';
}

function addResultRow(viewId, label, value) {
    const body = document.getElementById('result-body-' + viewId);
    if (!body) return;
    var row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = '<span class="result-label">' + label + '</span><span class="result-value">' + value + '</span>';
    body.appendChild(row);
}

// ====== 高精度小数运算 ======
function decMul(a, b) {
    var aStr = String(a), bStr = String(b);
    var aParts = aStr.split('.'), bParts = bStr.split('.');
    var aDec = aParts[1] ? aParts[1].length : 0;
    var bDec = bParts[1] ? bParts[1].length : 0;
    var aInt = BigInt(aParts[0] + (aParts[1] || ''));
    var bInt = BigInt(bParts[0] + (bParts[1] || ''));
    var result = aInt * bInt;
    var resultStr = String(result);
    var totalDec = aDec + bDec;
    if (totalDec === 0) return resultStr;
    if (resultStr.length <= totalDec) {
        return '0.' + '0'.repeat(totalDec - resultStr.length) + resultStr;
    }
    var intPart = resultStr.slice(0, resultStr.length - totalDec);
    var decPart = resultStr.slice(resultStr.length - totalDec);
    return intPart + '.' + decPart;
}

function decDiv(a, b, maxDec) {
    maxDec = maxDec || 20;
    var bStr = String(b);
    var bParts = bStr.split('.');
    var bDec = bParts[1] ? bParts[1].length : 0;
    var scale = 10n ** BigInt(maxDec + bDec);
    var aScaled = decMul(a, String(scale));
    var aParts = aScaled.split('.');
    var aInt = BigInt(aParts[0]);
    var bInt = BigInt(bParts[0] + (bParts[1] || ''));
    var result = aInt / bInt;
    var resultStr = String(result);
    if (resultStr.length <= maxDec) {
        return '0.' + '0'.repeat(maxDec - resultStr.length) + resultStr;
    }
    var intPart = resultStr.slice(0, resultStr.length - maxDec) || '0';
    var decPart = resultStr.slice(resultStr.length - maxDec).replace(/0+$/, '');
    return decPart ? intPart + '.' + decPart : intPart;
}

// ====== 导航栏 ======
var NAV_ITEMS = [
    { text: '物理单位转换', icon: '⚛', id: 'unit' },
    { text: '进制转换', icon: '⊞', id: 'radix' },
    { text: 'IEEE 754 转换', icon: '◇', id: 'ieee754' },
    { text: '硬件 转换', icon: '₢', id: 'hardware' },
    { text: '软件 转换', icon: '₻', id: 'software' },
    { text: '气体浓度转换', icon: '☲', id: 'gas' }
];

var currentNavIndex = 0;

function showPage(index) {
    currentNavIndex = index;
    var indicators = document.querySelectorAll('.nav-indicator');
    for (var i = 0; i < indicators.length; i++) {
        indicators[i].classList.toggle('active', i === index);
    }
    var pages = document.querySelectorAll('.view-page');
    for (var i = 0; i < pages.length; i++) {
        pages[i].style.display = (i === index) ? 'block' : 'none';
    }
}

// ====== 历史记录 ======
var historyEntryCount = 0;
var isHistoryEmpty = true;

function addHistory(type, input, result) {
    var content = $('history-content');
    if (isHistoryEmpty) {
        content.innerHTML = '';
        isHistoryEmpty = false;
    }
    var now = new Date();
    var timestamp = now.toTimeString().slice(0, 8);
    var entry = document.createElement('div');
    entry.className = 'history-entry';
    entry.innerHTML = '<div class="history-entry-type">[' + type + '] ' + timestamp + '</div>' +
        '<div class="history-entry-input">输入: ' + input + '</div>' +
        '<div class="history-entry-result">结果: ' + result + '</div>';
    content.insertBefore(entry, content.firstChild);
    content.scrollTop = 0;
    historyEntryCount++;
}

function clearHistory() {
    var content = $('history-content');
    content.innerHTML = '<div class="history-empty">\n\n还没有计算结果\n开始转换吧</div>';
    historyEntryCount = 0;
    isHistoryEmpty = true;
}

// ====== 菜单栏 ======
function toggleDropdown(id) {
    var dd = document.getElementById(id);
    var isOpen = dd.classList.contains('show');
    var all = document.querySelectorAll('.dropdown-content');
    for (var i = 0; i < all.length; i++) { all[i].classList.remove('show'); }
    if (!isOpen) dd.classList.add('show');
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown')) {
        var all = document.querySelectorAll('.dropdown-content');
        for (var i = 0; i < all.length; i++) { all[i].classList.remove('show'); }
    }
});

function validateRadixInput(value, radix) {

        if (chars.indexOf(value[i]) === -1) {
            return '输入包含非法字符（' + radix + '进制不允许）: ' + value[i];

function onIEEE754DirectionChange() {

        input.placeholder = '输入十六进制，如 C1460000（单精度 8 位）';

}

function decimalToIEEE754(fval, precision) {
    var totalBits = precision === 'single' ? 32 : 64;
    var expBits = precision === 'single' ? 8 : 11;
    var mantBits = precision === 'single' ? 23 : 52;
    var buffer = new ArrayBuffer(precision === 'single' ? 4 : 8);
    var view = new DataView(buffer);
    if (precision === 'single') {
        view.setFloat32(0, fval, false);
    } else {
        view.setFloat64(0, fval, false);
    }
    var rawInt;
    if (precision === 'single') {
        rawInt = view.getUint32(0, false);
    } else {
        rawInt = view.getBigUint64(0, false);
    }
    var sign = Number((BigInt(rawInt) >> BigInt(totalBits - 1)) & 1n);
    var expRaw = Number((BigInt(rawInt) >> BigInt(mantBits)) & ((1n << BigInt(expBits)) - 1n));
    var mantissa = Number(BigInt(rawInt) & ((1n << BigInt(mantBits)) - 1n));
    var binary = rawInt.toString(2).padStart(totalBits, '0');
    var expBin = expRaw.toString(2).padStart(expBits, '0');
    var mantBin = mantissa.toString(2).padStart(mantBits, '0');
    var hexLen = totalBits / 4;
    var hex = rawInt.toString(16).toUpperCase().padStart(hexLen, '0');
    return { sign: String(sign), exponent: expBin, mantissa: mantBin, binary: binary, hex: hex };
}

function ieee754ToDecimal(hex, precision) {
    var totalBits = precision === 'single' ? 32 : 64;
    var expBits = precision === 'single' ? 8 : 11;
    var mantBits = precision === 'single' ? 23 : 52;
    var rawInt = BigInt('0x' + hex);
    var buffer = new ArrayBuffer(precision === 'single' ? 4 : 8);
    var view = new DataView(buffer);
    if (precision === 'single') {
        view.setUint32(0, Number(rawInt & 0xFFFFFFFFn), false);
    } else {
        view.setBigUint64(0, rawInt, false);
    }
    var fval;
    if (precision === 'single') {
        fval = view.getFloat32(0, false);
    } else {
        fval = view.getFloat64(0, false);
    }
    var sign = Number((rawInt >> BigInt(totalBits - 1)) & 1n);
    var expRaw = Number((rawInt >> BigInt(mantBits)) & ((1n << BigInt(expBits)) - 1n));
    var mantissa = Number(rawInt & ((1n << BigInt(mantBits)) - 1n));
    var binary = rawInt.toString(2).padStart(totalBits, '0');
    var expBin = expRaw.toString(2).padStart(expBits, '0');
    var mantBin = mantissa.toString(2).padStart(mantBits, '0');
    var decStr;
    if (isNaN(fval)) { decStr = 'NaN'; }
    else if (!isFinite(fval)) { decStr = fval > 0 ? 'Infinity' : '-Infinity'; }
    else if (fval === 0) { decStr = (1 / fval < 0) ? '-0.0' : '0.0'; }
    else { decStr = String(fval); }
    return { sign: String(sign), exponent: expBin, mantissa: mantBin, binary: binary, decimal: decStr };
}

function convertIEEE754() {
    clearMessage('ieee754');
    clearResultCard('ieee754');
    var precision = $('ieee754-precision').value;
    var direction = $('ieee754-direction').value;
    var value = $('ieee754-input').value.trim();

    if (!value) { showMessage('ieee754', '请输入数值', 'error'); return; }

    try {
        if (direction === 'to_ieee') {
            var fval = parseFloat(value);
            if (isNaN(fval)) { showMessage('ieee754', '无效的浮点数值', 'error'); return; }
            var result = decimalToIEEE754(fval, precision);
            addResultRow('ieee754', '符号位', result.sign);
            addResultRow('ieee754', '指数位 (二进制)', result.exponent);
            addResultRow('ieee754', '尾数位 (二进制)', result.mantissa);
            addResultRow('ieee754', '完整二进制', result.binary);
            addResultRow('ieee754', '十六进制', result.hex);
            addHistory('IEEE 754', '十进制: ' + value + ' (' + (precision === 'single' ? '单精度' : '双精度') + ')', '十六进制: ' + result.hex);
        } else {
            var hex = value.replace(/^0x/i, '');
            var result = ieee754ToDecimal(hex, precision);
            addResultRow('ieee754', '符号位', result.sign);
            addResultRow('ieee754', '指数位 (二进制)', result.exponent);
            addResultRow('ieee754', '尾数位 (二进制)', result.mantissa);
            addResultRow('ieee754', '完整二进制', result.binary);
            addResultRow('ieee754', '十进制', result.decimal);
            addHistory('IEEE 754', '十六进制: ' + hex + ' (' + (precision === 'single' ? '单精度' : '双精度') + ')', '十进制: ' + result.decimal);
        }
    } catch (e) {
        showMessage('ieee754', '转换失败: ' + e.message, 'error');
    }
}

function convertTemperature(value, from, to) {
    var v = parseFloat(value);
    var celsius;
    if (from.indexOf('°C') !== -1) celsius = v;
    else if (from.indexOf('°F') !== -1) celsius = (v - 32) * 5 / 9;
    else if (from.indexOf('K') !== -1) celsius = v - 273.15;
    if (to.indexOf('°C') !== -1) return String(celsius);
    if (to.indexOf('°F') !== -1) return String(celsius * 9 / 5 + 32);
    if (to.indexOf('K') !== -1) return String(celsius + 273.15);
    return String(celsius);
}

function convertHW() {
    clearMessage('hardware');
    clearResultCard('hardware');
    var func = $('hw-function').value;
    if (func === 'mil_mm') {
        var dir = $('hw-mil-mm-dir').value;
        var val = $('hw-mil-mm-input').value.trim();
        if (!val) { showMessage('hardware', '请输入数值', 'error'); return; }
        var num = parseFloat(val);
        if (isNaN(num)) { showMessage('hardware', '无效的数值', 'error'); return; }
        var result = dir === 'mil_to_mm' ? num * 0.0254 : num / 0.0254;
        var outUnit = dir === 'mil_to_mm' ? 'mm' : 'mil';
        var inUnit = dir === 'mil_to_mm' ? 'mil' : 'mm';
        addResultRow('hardware', '输出值', result + ' ' + outUnit);
        addResultRow('hardware', '换算关系', '1 mil = 0.0254 mm');
        addHistory('硬件转换', num + ' ' + inUnit, result + ' ' + outUnit);
    } else if (func === 'series' || func === 'parallel') {
        var inputs = qsa('.resistor-input');
        var values = [];
        for (var i = 0; i < inputs.length; i++) {
            var v = inputs[i].value.trim();
            if (!v) continue;
            var n = parseFloat(v);
            if (isNaN(n)) { showMessage('hardware', '无效的电阻值: ' + v, 'error'); return; }
            values.push(n);
        }
        if (values.length === 0) { showMessage('hardware', '请至少输入一个电阻值', 'error'); return; }
        var total;
        var formula;
        if (func === 'series') {
            total = values.reduce(function(a, b) { return a + b; }, 0);
            formula = values.join(' + ') + ' = ' + total + ' Ω';
        } else {
            var recSum = values.reduce(function(a, b) { return a + (b === 0 ? Infinity : 1 / b); }, 0);
            total = recSum === 0 ? 0 : 1 / recSum;
            formula = values.join(' ∥ ') + ' = ' + total + ' Ω';
        }
        addResultRow('hardware', '电阻数量', String(values.length));
        addResultRow('hardware', '总阻值', total + ' Ω');
        addResultRow('hardware', '计算公式', formula);
        addHistory(func === 'series' ? '串联电阻' : '并联电阻', values.length + ' 个电阻', total + ' Ω');
    } else if (func === 'wire_current') {
        var dir = $('hw-wire-dir').value;
        var unit = $('hw-wire-unit').value;
        var val = $('hw-wire-input').value.trim();
        if (!val) { showMessage('hardware', '请输入数值', 'error'); return; }
        var num = parseFloat(val);
        if (isNaN(num)) { showMessage('hardware', '无效的数值', 'error'); return; }
        var widthMm = num;
        if (unit === 'mil') widthMm = num * 0.0254;
        var result;
        var inUnit, outUnit;
        if (dir === 'width_to_current') {
            result = widthMm;
            inUnit = unit;
            outUnit = 'A';
        } else {
            result = unit === 'mil' ? num / 0.0254 : num;
            inUnit = 'A';
            outUnit = unit;
        }
        addResultRow('hardware', '输出值', result + ' ' + outUnit);
        addResultRow('hardware', '经验规则', '1mm 线宽通过 1A 电流（PCB 经验规则）');
        addHistory('线宽电流', num + ' ' + inUnit, result + ' ' + outUnit);
    }
}

        name: '氨气', formula: 'NH₃',
        directionLabels: ['%VOL → %LEL', '%LEL → %VOL'],
        standards: [
            { key: 'old', label: '旧国标 (15.0% VOL = 100% LEL)', refVol: '15.0' },
            { key: 'new', label: '新国标 (15.0% VOL = 100% LEL)', refVol: '15.0' }
        ]
    }
};

function initGasView() {
    var gasSelect = $('gas-type');
    var keys = Object.keys(GAS_REGISTRY);
    var html = '';
    for (var i = 0; i < keys.length; i++) {
        var gas = GAS_REGISTRY[keys[i]];
        html += '<option value="' + keys[i] + '">' + gas.name + ' (' + gas.formula + ')</option>';
    }
    gasSelect.innerHTML = html;
    onGasTypeChange();
}

function onGasTypeChange() {
    var gasKey = $('gas-type').value;
    var gas = GAS_REGISTRY[gasKey];
    if (!gas) return;
    var stdSelect = $('gas-standard');
    var html = '';
    for (var i = 0; i < gas.standards.length; i++) {
        html += '<option value="' + gas.standards[i].key + '">' + gas.standards[i].label + '</option>';
    }
    stdSelect.innerHTML = html;
    var dirSelect = $('gas-direction');
    html = '';
    for (var i = 0; i < gas.directionLabels.length; i++) {
        html += '<option value="' + i + '">' + gas.directionLabels[i] + '</option>';
    }
    dirSelect.innerHTML = html;
    updateGasPlaceholder();
    clearMessage('gas');
    clearResultCard('gas');
}

function onGasDirectionChange() {
    updateGasPlaceholder();
}

function updateGasPlaceholder() {
    var gasKey = $('gas-type').value;
    var gas = GAS_REGISTRY[gasKey];
    if (!gas) return;
    var dirIdx = parseInt($('gas-direction').value);
    var dirLabel = gas.directionLabels[dirIdx];
    var input = $('gas-input');
    if (dirLabel.indexOf('%VOL →') === 0) {
        input.placeholder = '输入 ' + gas.name + ' %VOL 值，如 2.5';
    } else {
        input.placeholder = '输入 ' + gas.name + ' %LEL 值，如 50';
    }
}

function convertGas() {
    clearMessage('gas');
    clearResultCard('gas');
    var gasKey = $('gas-type').value;
    var gas = GAS_REGISTRY[gasKey];
    var stdKey = $('gas-standard').value;
    var standard = null;
    for (var i = 0; i < gas.standards.length; i++) {
        if (gas.standards[i].key === stdKey) { standard = gas.standards[i]; break; }
    }
    var dirIdx = parseInt($('gas-direction').value);
    var val = $('gas-input').value.trim();

    if (!val) { showMessage('gas', '请输入浓度数值', 'error'); return; }
    var num = parseFloat(val);
    if (isNaN(num)) { showMessage('gas', '无效的数值', 'error'); return; }

    var refVol = parseFloat(standard.refVol);
    var result;
    var outUnit;
    if (dirIdx === 0) {
        result = (num / refVol) * 100;
        outUnit = '%LEL';
    } else {
        result = (num / 100) * refVol;
        outUnit = '%VOL';
    }
    addResultRow('gas', '气体', gas.name);
    addResultRow('gas', '输出值', result + ' ' + outUnit);
    addResultRow('gas', '国标基准', standard.label);
    addHistory('气体浓度', gas.name + ' ' + val + ' ' + (dirIdx === 0 ? '%VOL' : '%LEL'), result + ' ' + outUnit + ' (' + standard.label + ')');
}

function clearGas() {
    clearMessage('gas');
    clearResultCard('gas');
    $('gas-input').value = '';
    $('gas-type').selectedIndex = 0;
    onGasTypeChange();
}

// ====== 初始化 ======
function initApp() {
    // 构建导航栏
    var navContainer = $('nav-buttons');
    var navHtml = '';
    for (var i = 0; i < NAV_ITEMS.length; i++) {
        navHtml += '<div class="nav-btn-row" onclick="showPage(' + i + ')">' +
            '<div class="nav-indicator"></div>' +
            '<button class="nav-btn">' + NAV_ITEMS[i].icon + ' ' + NAV_ITEMS[i].text + '</button></div>';
    }
    navContainer.innerHTML = navHtml;

    // 构建视图菜单
    var viewMenu = $('view-menu');
    var vmHtml = '';
    for (var i = 0; i < NAV_ITEMS.length; i++) {
        vmHtml += '<button class="dropdown-item" onclick="showPage(' + i + ');toggleDropdown(\'view-menu\')">' +
            NAV_ITEMS[i].icon + ' ' + NAV_ITEMS[i].text + '</button>';
    }
    viewMenu.innerHTML = vmHtml;

    // 初始化各模块
    initUnitView();
    initGasView();
    buildHWInputs();
    buildSWInputs();

    // 默认显示第一个页面
    showPage(0);
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
