    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    #gameContainer {
      position: relative;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #2d4a3e;
    }
    #uiOverlay {
      position: absolute;
      top: 0;
      right: 0;
      padding: 10px 15px;
      color: #fff;
      font-size: 14px;
      line-height: 1.8;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
      z-index: 10;
      min-width: 140px;
    }
    .ui-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .bar-container {
      width: 100px;
      height: 12px;
      background: #333;
      border: 1px solid #666;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.3s;
      border-radius: 1px;
    }
    .bar-health { background: #e74c3c; }
    .bar-energy { background: #f39c12; }
    .bar-ability { background: #3498db; }
    #controlsHint {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 12px;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
      white-space: nowrap;
    }
    #messagePanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      border: 2px solid #ffd700;
      padding: 12px 24px;
      color: #fff;
      font-size: 14px;
      max-width: 400px;
      text-align: center;
      display: none;
      z-index: 20;
      border-radius: 4px;
      white-space: pre-line;
    }
  </style>
</head>

// ============================================================
// 键盘输入
// ============================================================
class InputHandler {
  constructor() {
    this.keys = {};
    this.keysPressed = {};
    this.keysReleased = {};
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (!this.keys[key]) this.keysPressed[key] = true;
      this.keys[key] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      this.keys[key] = false;
      this.keysReleased[key] = true;
    });
  }
  isDown(key) { return !!this.keys[key.toLowerCase()]; }
  isPressed(key) { return !!this.keysPressed[key.toLowerCase()]; }
  getMovementVector() {
    let dx = 0, dy = 0;
    if (this.isDown('w') || this.isDown('arrowup')) dy -= 1;
    if (this.isDown('s') || this.isDown('arrowdown')) dy += 1;
    if (this.isDown('a') || this.isDown('arrowleft')) dx -= 1;
    if (this.isDown('d') || this.isDown('arrowright')) dx += 1;
    if (dx !== 0 && dy !== 0) { const len = Math.sqrt(dx*dx+dy*dy); dx/=len; dy/=len; }
    return { dx, dy };
  }
  getFacingDirection() {
    if (this.isDown('w') || this.isDown('arrowup')) return 'up';
    if (this.isDown('s') || this.isDown('arrowdown')) return 'down';
    if (this.isDown('a') || this.isDown('arrowleft')) return 'left';
    if (this.isDown('d') || this.isDown('arrowright')) return 'right';
    return null;
  }
  update() { this.keysPressed = {}; this.keysReleased = {}; }
}

    this.x = x; this.y = y; this.width = 30; this.height = 50;

  }
  update(input, dt, bounds) {
    const move = input.getMovementVector();
    const facing = input.getFacingDirection();
    this.isMoving = move.dx !== 0 || move.dy !== 0;
    if (facing) this.facing = facing;
    if (this.isMoving) {
      this.x += move.dx * GAME_CONFIG.playerSpeed;
      this.y += move.dy * GAME_CONFIG.playerSpeed;
      this.animTimer += dt;
      if (this.animTimer >= GAME_CONFIG.animFrameDuration) { this.animTimer = 0; this.animFrame = (this.animFrame + 1) % 4; }

// ============================================================
// 渲染引擎
// ============================================================
class Renderer {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.vw = GAME_CONFIG.viewportWidth;
    this.vh = GAME_CONFIG.viewportHeight;
    this.mw = GAME_CONFIG.mapWidth;
    this.mh = GAME_CONFIG.mapHeight;
    this.cameraX = 0; this.cameraY = 0;
    this.setupCanvas();
    window.addEventListener('resize', () => this.setupCanvas());
  }
  setupCanvas() {
    this.canvas.width = this.vw; this.canvas.height = this.vh;
    const scale = Math.min(window.innerWidth / this.vw, window.innerHeight / this.vh) * 0.95;
    this.canvas.style.width = `${this.vw * scale}px`;
    this.canvas.style.height = `${this.vh * scale}px`;
    this.ctx.imageSmoothingEnabled = false;
  }
  updateCamera(targetX, targetY) {
    this.cameraX = targetX - this.vw / 2;
    this.cameraY = targetY - this.vh / 2;
    this.cameraX = Math.max(0, Math.min(this.mw - this.vw, this.cameraX));
    this.cameraY = Math.max(0, Math.min(this.mh - this.vh, this.cameraY));
  }
  clear() { this.ctx.clearRect(0, 0, this.vw, this.vh); }
  worldToScreen(wx, wy) { return { x: Math.round(wx - this.cameraX), y: Math.round(wy - this.cameraY) }; }
  isInViewport(wx, wy, w, h) { return wx+w>=this.cameraX && wx<=this.cameraX+this.vw && wy+h>=this.cameraY && wy<=this.cameraY+this.vh; }

  drawMap(gameState, currentLocationId) {
    const mc = GAME_CONFIG.mapColors;
    // 草地
    for (let y = 0; y < this.mh; y += 50) {
      for (let x = 0; x < this.mw; x += 50) {
        if (!this.isInViewport(x,y,50,50)) continue;
        const s = this.worldToScreen(x,y);
        this.ctx.fillStyle = ((x+y)%3===0)?mc.grassLight:((x+y)%5===0)?mc.grassDark:mc.grass;
        this.ctx.fillRect(s.x,s.y,50,50);
      }
    }
    // 水域
    for (const w of WATERS) {
      if (!this.isInViewport(w.x,w.y,w.w,w.h)) continue;
      const s = this.worldToScreen(w.x,w.y);
      this.ctx.fillStyle = mc.water; this.ctx.fillRect(s.x,s.y,w.w,w.h);
      const t = Date.now()/1000;
      this.ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let i=0;i<3;i++) { this.ctx.fillRect(s.x+12+i*45,s.y+12+Math.sin(t+i)*5,25,5); }
    }
    // 道路
    for (const r of ROADS) {
      if (!this.isInViewport(Math.min(r.x1,r.x2),Math.min(r.y1,r.y2),Math.abs(r.x2-r.x1)+r.w,Math.abs(r.y2-r.y1)+r.w)) continue;
      const s1=this.worldToScreen(r.x1,r.y1), s2=this.worldToScreen(r.x2,r.y2);
      this.ctx.strokeStyle=mc.road; this.ctx.lineWidth=r.w; this.ctx.lineCap='square';
      this.ctx.beginPath(); this.ctx.moveTo(s1.x,s1.y); this.ctx.lineTo(s2.x,s2.y); this.ctx.stroke();
      this.ctx.strokeStyle=mc.roadLight; this.ctx.lineWidth=5;
      this.ctx.beginPath(); this.ctx.moveTo(s1.x,s1.y); this.ctx.lineTo(s2.x,s2.y); this.ctx.stroke();
      if (r.w>=50) {
        this.ctx.strokeStyle=mc.roadMarking; this.ctx.lineWidth=3; this.ctx.setLineDash([10,10]);
        this.ctx.beginPath(); this.ctx.moveTo(s1.x,s1.y); this.ctx.lineTo(s2.x,s2.y); this.ctx.stroke();
        this.ctx.setLineDash([]);
      }
    }
    // 人行道
    for (const k in LOCATIONS) {
      const loc=LOCATIONS[k];
      if (!this.isInViewport(loc.x-10,loc.y-10,loc.w+20,loc.h+20)) continue;
      const s=this.worldToScreen(loc.x-10,loc.y-10);
      this.ctx.fillStyle=mc.sidewalk; this.ctx.fillRect(s.x,s.y,loc.w+20,loc.h+20);
    }
    // 装饰物
    for (const d of DECORATIONS) {
      if (!this.isInViewport(d.x-20,d.y-40,40,50)) continue;
      const s=this.worldToScreen(d.x,d.y); this.drawDecoration(d,s.x,s.y);
    }
    // 建筑
    for (const k in LOCATIONS) {
      const loc=LOCATIONS[k];
      if (!this.isInViewport(loc.x,loc.y,loc.w,loc.h)) continue;
      const s=this.worldToScreen(loc.x,loc.y);
      this.drawBuilding(loc,s.x,s.y,k===currentLocationId);
    }
    this.drawTimeEffect(gameState);
  }

  drawDecoration(dec,sx,sy) {
    const mc=GAME_CONFIG.mapColors;
    if (dec.type==='tree') {
      this.ctx.fillStyle=mc.treeTrunk; this.ctx.fillRect(sx,sy+15,10,20);
      this.ctx.fillStyle=mc.tree; this.ctx.fillRect(sx-10,sy-5,30,25);
      this.ctx.fillStyle='#3a8a3a'; this.ctx.fillRect(sx-5,sy-15,20,20);
    }
    if (dec.type==='bench') {
      this.ctx.fillStyle='#8a6a4a'; this.ctx.fillRect(sx,sy+5,40,10);
      this.ctx.fillStyle='#6a4a2a'; this.ctx.fillRect(sx+5,sy+15,5,10); this.ctx.fillRect(sx+30,sy+15,5,10);
    }
    if (dec.type==='fountain') {
      const t=Date.now()/500;
      this.ctx.fillStyle='#888'; this.ctx.fillRect(sx,sy+15,35,10);
      this.ctx.fillStyle=mc.water; this.ctx.fillRect(sx+5,sy+5,25,15);
      this.ctx.fillStyle='#add8e6'; this.ctx.fillRect(sx+13,sy-5+Math.sin(t)*5,10,10);
    }
  }

  drawBuilding(loc,sx,sy,isCurrent) {
    const colors=GAME_CONFIG.locationColors[loc.id]||GAME_CONFIG.locationColors.home;
    this.ctx.fillStyle=colors.primary; this.ctx.fillRect(sx,sy,loc.w,loc.h);
    this.ctx.fillStyle=colors.roof; this.ctx.fillRect(sx-8,sy-10,loc.w+15,15); this.ctx.fillRect(sx,sy-20,loc.w,10);
    this.ctx.strokeStyle='rgba(0,0,0,0.3)'; this.ctx.lineWidth=2; this.ctx.strokeRect(sx,sy,loc.w,loc.h);
    this.ctx.fillStyle=colors.door; this.ctx.fillRect(sx+loc.w/2-15,sy+loc.h-35,30,35);
    this.ctx.fillStyle='#ffd700'; this.ctx.fillRect(sx+loc.w/2+5,sy+loc.h-20,5,5);
    this.ctx.fillStyle='#add8e6';
    const winW=25,winH=20,winCols=Math.floor((loc.w-25)/45),winRows=Math.floor((loc.h-50)/35);
    for (let r=0;r<winRows;r++) for (let c=0;c<winCols;c++) {
      const wx=sx+15+c*45, wy=sy+15+r*35;
      if (wy+winH<loc.h-35) { this.ctx.fillRect(wx,wy,winW,winH); this.ctx.strokeStyle='rgba(255,255,255,0.3)'; this.ctx.strokeRect(wx,wy,winW,winH); }
    }
    this.ctx.fillStyle=isCurrent?'#ffd700':'rgba(255,255,255,0.9)';
    this.ctx.font='18px monospace'; this.ctx.textAlign='center';
    this.ctx.fillText(loc.name,sx+loc.w/2,sy-25);
    if (isCurrent) {
      const t=Date.now()/800, glow=Math.sin(t)*0.2+0.3;
      this.ctx.fillStyle=`rgba(255,215,0,${glow})`; this.ctx.fillRect(sx-5,sy-5,loc.w+10,loc.h+10);
    }
  }

  drawTimeEffect(gameState) {
    const slot=GAME_CONFIG.timeSlots.find(s=>gameState.hour>=s.startHour&&gameState.hour<s.endHour);
    if (slot&&slot.sky) {
      const r=parseInt(slot.sky.slice(1,3),16), g=parseInt(slot.sky.slice(3,5),16), b=parseInt(slot.sky.slice(5,7),16);
      let a=0;
      if(slot.id==='midnight')a=0.35; else if(slot.id==='night')a=0.25; else if(slot.id==='evening')a=0.12; else if(slot.id==='early_morning')a=0.08;
      if(a>0){this.ctx.fillStyle=`rgba(${r},${g},${b},${a})`;this.ctx.fillRect(0,0,this.vw,this.vh);}
    }
  }

  drawEventPanel(events, playerState, selectedIndex) {
    const panelY=this.vh-120;
    this.ctx.fillStyle='rgba(0,0,0,0.85)'; this.ctx.fillRect(0,panelY,this.vw,120);
    this.ctx.strokeStyle='#666'; this.ctx.lineWidth=1; this.ctx.strokeRect(0,panelY,this.vw,120);
    this.ctx.fillStyle='#fff'; this.ctx.font='20px monospace'; this.ctx.textAlign='left';
    this.ctx.fillText('可用事件（按数字键选择 / 空格执行）:', 13, panelY+25);
    let x=13;
    events.forEach((ev,i) => {
      if(x+190>this.vw)return;
      const sel=i===selectedIndex, avail=this.checkEventAvailable(ev,playerState);
      this.ctx.fillStyle=sel?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.1)';
      if(!avail)this.ctx.fillStyle='rgba(100,100,100,0.3)';
      this.ctx.fillRect(x,panelY+35,190,75);
      this.ctx.strokeStyle=sel?'#fff':'#666'; this.ctx.strokeRect(x,panelY+35,190,75);
      this.ctx.fillStyle=avail?'#fff':'#888'; this.ctx.font='18px monospace'; this.ctx.textAlign='center';
      this.ctx.fillText(`${i+1}.${ev.name}`,x+95,panelY+60);
      this.ctx.font='15px monospace';
      let pv='';
      if(ev.effects.goldDelta>0)pv+=`+${ev.effects.goldDelta}G `;
      if(ev.effects.goldDelta<0)pv+=`${ev.effects.goldDelta}G `;
      if(ev.effects.energyDelta<0)pv+=`${ev.effects.energyDelta}E`;
      this.ctx.fillText(pv,x+95,panelY+85);
      this.ctx.fillText(`${ev.durationMinutes}分钟`,x+95,panelY+100);
      x+=200;
    });
  }

  drawMinimap(player, currentLocationId) {
    const mmW=160, mmH=86, mmX=this.vw-mmW-10, mmY=10;
    const sx=mmW/this.mw, sy=mmH/this.mh;
    this.ctx.fillStyle='rgba(0,0,0,0.6)'; this.ctx.fillRect(mmX,mmY,mmW,mmH);
    this.ctx.strokeStyle='#666'; this.ctx.strokeRect(mmX,mmY,mmW,mmH);
    for (const k in LOCATIONS) {
      const loc=LOCATIONS[k];
      this.ctx.fillStyle=k===currentLocationId?'#ffd700':'#666';
      this.ctx.fillRect(mmX+loc.x*sx,mmY+loc.y*sy,Math.max(4,loc.w*sx),Math.max(3,loc.h*sy));
    }
    this.ctx.fillStyle='#e74c3c'; this.ctx.fillRect(mmX+player.x*sx-2,mmY+player.y*sy-2,6,6);
    this.ctx.strokeStyle='rgba(255,255,255,0.5)'; this.ctx.lineWidth=2;
    this.ctx.strokeRect(mmX+this.cameraX*sx,mmY+this.cameraY*sy,this.vw*sx,this.vh*sy);
  }

  checkEventAvailable(ev,ps) {
    if(!ev.prerequisites)return true;
    const p=ev.prerequisites;
    if(p.minHealth&&ps.health<p.minHealth)return false;
    if(p.minEnergy&&ps.energy<p.minEnergy)return false;
    if(p.minGold&&ps.gold<p.minGold)return false;
    return true;
  }
}

// ============================================================
// UI 管理器
// ============================================================
class UIManager {
  constructor() {
    this.uiOverlay = document.getElementById('uiOverlay');
    this.messagePanel = document.getElementById('messagePanel');
  }
  updateStatusPanel(gs) {
    const max=GAME_CONFIG.maxState;
    const ts=GAME_CONFIG.timeSlots.find(s=>gs.hour>=s.startHour&&gs.hour<s.endHour);
    const tn=ts?ts.name:'';
    const locName = gs.currentLocationName || LOCATIONS[gs.currentLocation]?.name || '未知';
    this.uiOverlay.innerHTML = `
      <div class="ui-row"><span>第${gs.day}天</span><span style="color:#aaa;font-size:12px;">${tn} ${String(gs.hour).padStart(2,'0')}:${String(gs.minute).padStart(2,'0')}</span></div>
      <div class="ui-row"><span style="color:#ffd700;font-size:14px;">${gs.gold} G</span></div>
      <div class="ui-row"><span style="color:#e74c3c;font-size:13px;">HP</span><div class="bar-container"><div class="bar-fill bar-health" style="width:${(gs.health/max.health*100)}%"></div></div><span style="font-size:12px;">${Math.floor(gs.health)}</span></div>
      <div class="ui-row"><span style="color:#f39c12;font-size:13px;">EP</span><div class="bar-container"><div class="bar-fill bar-energy" style="width:${(gs.energy/max.energy*100)}%"></div></div><span style="font-size:12px;">${Math.floor(gs.energy)}</span></div>
      <div class="ui-row"><span style="color:#3498db;font-size:13px;">AP</span><div class="bar-container"><div class="bar-fill bar-ability" style="width:${Math.min(gs.ability/100*100,100)}%"></div></div><span style="font-size:12px;">${Math.floor(gs.ability)}</span></div>
      <div class="ui-row" style="margin-top:5px;font-size:12px;color:#aaa;"><span>${locName}</span></div>
    `;
  }
  showMessage(text, duration=3000) {
    this.messagePanel.textContent = text;
    this.messagePanel.style.display = 'block';
    if(this.messageTimer)clearTimeout(this.messageTimer);
    this.messageTimer = setTimeout(()=>{this.messagePanel.style.display='none';},duration);
  }
  showEventResult(event, success, result) {
    let et='';
    if(result.goldDelta)et+=` 金币${result.goldDelta>0?'+':''}${result.goldDelta}`;
    if(result.healthDelta)et+=` 健康${result.healthDelta>0?'+':''}${result.healthDelta}`;
    if(result.energyDelta)et+=` 精力${result.energyDelta>0?'+':''}${result.energyDelta}`;
    if(result.abilityDelta)et+=` 能力${result.abilityDelta>0?'+':''}${result.abilityDelta}`;
    this.showMessage(`${event.name} ${success?'成功':'失败'}!${et}\n${event.message||''}`, 4000);
  }
  showSceneChange(name) { this.showMessage(`到达: ${name}`, 2000); }
  showDeathScreen(gs, stat) {
    this.uiOverlay.innerHTML = `
      <div style="text-align:center;padding:20px;">
        <div style="color:#e74c3c;font-size:20px;margin-bottom:10px;">游戏结束</div>
        <div style="color:#fff;font-size:14px;margin-bottom:8px;">${gs.name} 倒下了...</div>
        <div style="color:#aaa;font-size:13px;">存活了 ${gs.day} 天</div>
        <div style="color:#ffd700;font-size:13px;margin-top:5px;">累计获得金币: ${stat.totalGoldEarned}</div>
        <div style="color:#3498db;font-size:13px;">最高工作能力: ${stat.maxAbilityReached}</div>
        <div style="margin-top:15px;color:#aaa;font-size:12px;">按 R 重新开始</div>
      </div>
    `;
  }
}

// ============================================================
// 游戏主引擎
// ============================================================
class Game {
  constructor() {
    this.renderer = new Renderer('gameCanvas');
    this.input = new InputHandler();
    this.ui = new UIManager();
    this.player = new Player(250, 225);
    this.gameState=null; this.statistics=null; this.currentLocation=null;
    this.availableEvents=[]; this.selectedEventIndex=0;
    this.isPaused=false; this.isGameOver=false;
    this.eventHistory={}; this.consecutiveEvents={}; this.lastEventId=null;
    this.timeAccumulator=0; this.lastTime=0;
    this.init();
  }
  init() {
    const sd=this.loadSave();
    if(sd){this.gameState=sd.gameState;this.statistics=sd.statistics;this.eventHistory=sd.eventHistory||{};
      if(this.gameState.currentScene&&!this.gameState.currentLocation)this.gameState.currentLocation=this.gameState.currentScene;
    }else this.resetGame();
    if(!this.gameState.currentLocation||!LOCATIONS[this.gameState.currentLocation])this.gameState.currentLocation='home';
    this.currentLocation=LOCATIONS[this.gameState.currentLocation];
    this.player.x=this.currentLocation.x+this.currentLocation.w/2-this.player.width/2;
    this.player.y=this.currentLocation.y+this.currentLocation.h+12;
    this.updateAvailableEvents();
    requestAnimationFrame((t)=>this.loop(t));
  }
  resetGame() {
    const init=GAME_CONFIG.initialState;
    this.gameState={name:init.name,health:init.health,energy:init.energy,ability:init.ability,gold:init.gold,
      currentLocation:init.currentLocation,currentLocationName:LOCATIONS[init.currentLocation].name,
      day:init.day,hour:init.hour,minute:init.minute};
    this.statistics={totalGoldEarned:0,totalGoldSpent:0,maxAbilityReached:init.ability,hospitalVisits:0};
    this.eventHistory={};this.consecutiveEvents={};this.lastEventId=null;this.isGameOver=false;
  }
  loop(ts) {
    if(!this.lastTime)this.lastTime=ts;
    const dt=ts-this.lastTime;this.lastTime=ts;
    if(!this.isPaused&&!this.isGameOver)this.update(dt);
    this.render();this.input.update();
    requestAnimationFrame((t)=>this.loop(t));
  }
  update(dt) {
    this.timeAccumulator+=dt;
    if(this.timeAccumulator>=1000){this.timeAccumulator-=1000;this.advanceTime(GAME_CONFIG.minutesPerRealSecond);}
    this.player.update(this.input,1,{width:GAME_CONFIG.mapWidth,height:GAME_CONFIG.mapHeight});
    this.checkCurrentLocation();
    this.checkEventInput();
    if(this.input.isPressed('p')){this.isPaused=!this.isPaused;this.ui.showMessage(this.isPaused?'游戏暂停':'游戏继续',1500);}
    if(this.isGameOver&&this.input.isPressed('r')){
      this.resetGame();this.currentLocation=LOCATIONS[this.gameState.currentLocation];
      this.player.x=this.currentLocation.x+this.currentLocation.w/2-this.player.width/2;
      this.player.y=this.currentLocation.y+this.currentLocation.h+12;
      this.updateAvailableEvents();
    }
    this.autoSave();
  }
  checkCurrentLocation() {
    const px=this.player.x+this.player.width/2, py=this.player.y+this.player.height/2;
    let found=null;
    for(const k in LOCATIONS){const loc=LOCATIONS[k];
      if(px>=loc.x&&px<=loc.x+loc.w&&py>=loc.y&&py<=loc.y+loc.h){found=k;break;}}
    if(found&&found!==this.gameState.currentLocation){
      this.gameState.currentLocation=found;this.currentLocation=LOCATIONS[found];
      this.gameState.currentLocationName=this.currentLocation.name;
      this.updateAvailableEvents();this.ui.showSceneChange(this.currentLocation.name);
    }
  }
  advanceTime(min) {
    this.gameState.minute+=min;
    while(this.gameState.minute>=60){this.gameState.minute-=60;this.gameState.hour++;}
    while(this.gameState.hour>=24){this.gameState.hour-=24;this.gameState.day++;this.applyDailyDecay();}
  }
  applyDailyDecay() {
    this.gameState.health-=2;
    if(this.gameState.hour>=6&&this.gameState.hour<22)this.gameState.energy=Math.min(100,this.gameState.energy+5);
    this.checkDeath();
  }
  updateAvailableEvents() {
    if(!this.currentLocation){this.availableEvents=[];return;}
    this.availableEvents=(this.currentLocation.events||[]).map(id=>EVENTS[id]).filter(e=>e!==undefined);
    this.selectedEventIndex=0;
  }
  checkEventInput() {
    for(let i=1;i<=9;i++){if(this.input.isPressed(String(i))){const idx=i-1;
      if(idx<this.availableEvents.length){this.selectedEventIndex=idx;this.executeEvent(this.availableEvents[idx]);}}}
    if(this.input.isPressed(' ')){if(this.selectedEventIndex<this.availableEvents.length)this.executeEvent(this.availableEvents[this.selectedEventIndex]);}
  }
  executeEvent(ev) {
    if(!ev)return;
    if(ev.prerequisites){const p=ev.prerequisites;
      if(p.minHealth&&this.gameState.health<p.minHealth){this.ui.showMessage(`健康值不足! 需要${p.minHealth}点健康`);return;}
      if(p.minEnergy&&this.gameState.energy<p.minEnergy){this.ui.showMessage(`精力值不足! 需要${p.minEnergy}点精力`);return;}
      if(p.minGold&&this.gameState.gold<p.minGold){this.ui.showMessage(`金币不足! 需要${p.minGold}金币`);return;}
    }
    if(ev.repeatPenalty){const cnt=this.consecutiveEvents[ev.id]||0;
      if(cnt>=ev.repeatPenalty.consecutiveLimit){this.ui.showMessage(ev.repeatPenalty.penaltyMessage,4000);
        this.gameState.health-=10;this.gameState.energy-=10;this.checkDeath();return;}}
    const success=Math.random()<(ev.successRate||1), eff=ev.effects||{};
    let res={goldDelta:0,healthDelta:0,energyDelta:0,abilityDelta:0};
    if(success){res.goldDelta=eff.goldDelta||0;res.healthDelta=eff.healthDelta||0;res.energyDelta=eff.energyDelta||0;res.abilityDelta=eff.abilityDelta||0;}
    else{res.healthDelta=-(eff.healthDelta||0)*0.5||-5;res.energyDelta=-(eff.energyDelta||0)*0.3||-5;}
    this.gameState.gold=Math.max(0,this.gameState.gold+res.goldDelta);
    this.gameState.health=Math.min(100,Math.max(0,this.gameState.health+res.healthDelta));
    this.gameState.energy=Math.min(100,Math.max(0,this.gameState.energy+res.energyDelta));
    this.gameState.ability=Math.max(0,this.gameState.ability+(res.abilityDelta||0));
    if(ev.durationMinutes)this.advanceTime(ev.durationMinutes);
    if(res.goldDelta>0)this.statistics.totalGoldEarned+=res.goldDelta;
    if(res.goldDelta<0)this.statistics.totalGoldSpent+=Math.abs(res.goldDelta);
    if(this.gameState.ability>this.statistics.maxAbilityReached)this.statistics.maxAbilityReached=this.gameState.ability;
    this.eventHistory[ev.id]=(this.eventHistory[ev.id]||0)+1;
    if(this.lastEventId===ev.id){this.consecutiveEvents[ev.id]=(this.consecutiveEvents[ev.id]||0)+1;}
    else{this.consecutiveEvents={};this.consecutiveEvents[ev.id]=1;}
    this.lastEventId=ev.id;
    this.ui.showEventResult(ev,success,res);this.checkDeath();this.saveGame();
  }
  checkDeath(){if(this.gameState.health<=0){this.isGameOver=true;this.gameState.health=0;this.ui.showDeathScreen(this.gameState,this.statistics);}}
  saveGame(){localStorage.setItem('worker_life_save',JSON.stringify({gameState:this.gameState,statistics:this.statistics,eventHistory:this.eventHistory,version:'1.2'}));}
  loadSave(){try{const d=localStorage.getItem('worker_life_save');if(d)return JSON.parse(d);}catch(e){}return null;}
  autoSave(){const n=Date.now();if(!this.lastSaveTime||n-this.lastSaveTime>30000){this.saveGame();this.lastSaveTime=n;}}
  render() {
    this.renderer.clear();
    this.renderer.updateCamera(this.player.x+this.player.width/2,this.player.y+this.player.height/2);
    this.renderer.drawMap(this.gameState,this.gameState.currentLocation);
    this.renderer.drawMinimap(this.player,this.gameState.currentLocation);
    const sp=this.renderer.worldToScreen(this.player.x,this.player.y);
    const ox=this.player.x,oy=this.player.y;
    this.player.x=sp.x;this.player.y=sp.y;
    this.player.draw(this.renderer.ctx);
    this.player.x=ox;this.player.y=oy;
    this.renderer.drawEventPanel(this.availableEvents,this.gameState,this.selectedEventIndex);
    this.ui.updateStatusPanel(this.gameState);
  }
}

// ============================================================
// 启动游戏
// ============================================================
window.addEventListener('DOMContentLoaded', () => { window.game = new Game(); });
</script>
