<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="今天吃什么？帮你解决选择困难症，随机推荐美食">
  <title>今天吃什么</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🍽️</span>
        <span class="brand-name">今天吃什么</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索美食..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="app-main">
    <!-- 用餐时段分类图标 -->
    <section class="meal-categories">
      <div class="category-scroll" id="mealCategories">
        <button class="category-item" data-type="mealType" data-value="早餐">
          <div class="category-icon">🌅</div>
          <span class="category-label">早餐</span>
        </button>
        <button class="category-item" data-type="mealType" data-value="午餐">
          <div class="category-icon">☀️</div>
          <span class="category-label">午餐</span>
        </button>
        <button class="category-item" data-type="mealType" data-value="晚餐">
          <div class="category-icon">🌙</div>
          <span class="category-label">晚餐</span>
        </button>
        <button class="category-item" data-type="mealType" data-value="夜宵">
          <div class="category-icon">🌃</div>
          <span class="category-label">夜宵</span>
        </button>
      </div>
    </section>

    <!-- 菜系筛选标签 -->
    <section class="cuisine-filter">
      <div class="filter-scroll" id="cuisineTags">
        <!-- JS动态渲染 -->
      </div>
    </section>

    <!-- 食物卡片网格 -->
    <section class="food-grid-section">
      <div class="section-header">
        <h2 class="section-title">🍜 全部美食</h2>
        <span class="section-count" id="foodCount">135 道</span>
      </div>
      <div class="food-grid" id="foodGrid">
        <!-- JS动态渲染 -->
      </div>
    </section>
  </main>

  <!-- 底部浮动随机按钮 -->
  <div class="fab-wrapper">
    <button class="fab-btn" id="randomBtn">
      <span class="fab-icon">🎲</span>
      <span class="fab-text">随机推荐</span>
    </button>
  </div>

  <!-- 食物详情弹层 -->
  <div class="detail-modal" id="detailModal">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-image-area">
        <div class="modal-image-placeholder" id="modalPlaceholder"></div>
        <img class="modal-image" id="modalImage" src="" alt="">
        <button class="upload-btn" id="uploadBtn" title="上传图片">
          <span>📷</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-header-row">
          <h3 class="modal-name" id="modalName"></h3>
          <div class="modal-price" id="modalPrice"></div>
        </div>
        <div class="modal-rating">
          <span class="stars">⭐⭐⭐⭐⭐</span>
          <span class="rating-num">4.8</span>
        </div>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-actions">
          <button class="btn-reroll" id="rerollBtn">🔄 换一个</button>
          <button class="btn-upload-text" id="uploadTextBtn">📷 上传图片</button>
          <button class="btn-map" id="mapBtn">📍 附近商家</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 商家地图弹层 -->
  <div class="map-modal" id="mapModal">
    <div class="map-overlay" id="mapOverlay"></div>
    <div class="map-panel">
      <div class="map-panel-header">
        <h3 class="map-panel-title">📍 附近商家</h3>
        <button class="map-panel-close" id="mapClose">✕</button>
      </div>
      <div class="map-panel-body">
        <div class="map-container" id="mapContainer"></div>
        <div class="map-shop-list" id="mapShopList">
          <div class="map-shop-loading">正在搜索附近商家...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">

  <!-- 页脚 -->
  <footer class="app-footer">
    <p>今天吃什么 · 让每一餐都充满期待</p>
  </footer>

  <!-- 脚本 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/images.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
