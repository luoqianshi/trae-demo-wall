<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>长辈手机远程协助台 - 登录</title>
<link rel="stylesheet" href="app/css/common.css">
</head>
<body>

<div class="app-frame">
  <div class="status-bar"><span id="clock">16:00</span><span>5G 🔋 85%</span></div>

  <div class="login-page">
    <div class="login-logo">📱</div>
    <div class="login-title">长辈手机远程协助台</div>
    <div class="login-sub">教父母用手机，不再「鸡同鸭讲」</div>
    <div class="login-choose-label">请选择您的身份</div>
    <div class="role-cards">
      <div class="role-card" onclick="login('child')">
        <div class="rc-icon">👨‍👩‍👧</div>
        <div class="rc-info">
          <div class="rc-title">我是子女</div>
          <div class="rc-desc">远程帮父母标注操作步骤、录制语音指引</div>
        </div>
        <div class="rc-arrow">→</div>
      </div>
      <div class="role-card elder" onclick="login('elder')">
        <div class="rc-icon">👴</div>
        <div class="rc-info">
          <div class="rc-title">我是长辈</div>
          <div class="rc-desc">一键截图求助、大字教程自学</div>
        </div>
        <div class="rc-arrow">→</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app/js/common.js"></script>
<script>
  initClock();
</script>
</body>
</html>
