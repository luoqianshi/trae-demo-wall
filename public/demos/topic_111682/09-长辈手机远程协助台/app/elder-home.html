<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>长辈端 · 求助中心</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<div class="app-frame">
  <div class="status-bar"><span id="clock">16:00</span><span>5G 🔋 85%</span></div>

  <div class="page active">
    <div class="nav-bar">
      <span class="nav-title" id="navTitle">长辈端 · 求助中心</span>
      <div class="nav-role-badge" onclick="logout()">
        <span id="navRoleText">长辈</span>
        <span class="nrb-icon">⏻</span>
      </div>
    </div>

    <div class="screen-share-indicator" id="screenShareIndicator" onclick="toggleScreenShare()">
      <span class="ssi-dot">○</span>
      <span class="ssi-text">屏幕共享未开启</span>
      <span class="ssi-toggle">点击切换</span>
    </div>

    <div class="banner" id="banner"></div>

    <div class="elder-hero">
      <div class="elder-hero__icon">📞</div>
      <div class="elder-hero__title">遇到问题？一键求助</div>
      <div class="elder-hero__sub">孩子会在手机上看到并教你操作</div>
    </div>

    <div class="elder-btn primary" id="helpBtn" onclick="showHelpMenu()">
      <div class="eb-icon">📸</div>
      <div class="eb-title">选择求助方式</div>
      <div class="eb-sub">点击选择截图或共享屏幕</div>
    </div>

    <div class="elder-btn" onclick="startCall()">
      <div class="eb-icon">🎤</div>
      <div class="eb-text"><div class="eb-title">语音呼叫求助</div><div class="eb-sub">直接和孩子语音沟通</div></div>
      <div class="eb-arrow">→</div>
    </div>
    <div class="elder-btn" onclick="goTutorials()">
      <div class="eb-icon">📖</div>
      <div class="eb-text"><div class="eb-title">自学图文教程</div><div class="eb-sub">大字大图， step by step</div></div>
      <div class="eb-arrow">→</div>
    </div>

    <div class="reply-view" id="replyView">
      <div class="reply-view__title">✅ 女儿回复了你的求助</div>
      <img class="reply-screenshot" id="replyScreenshot" alt="标注截图">
      <div class="reply-voice" id="replyVoice"></div>
      <button class="btn-primary" style="margin:0.5rem 0 0" onclick="resolveHelp()">我已解决问题</button>
    </div>

    <div class="section-title">最近求助记录</div>
    <div class="learned-list" id="historyList">
      <div style="padding:0 1rem;color:var(--muted);font-size:0.82rem">暂无求助记录</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="location.reload()"><span class="tab-icon">🏠</span>求助<span class="tab-badge"></span></div>
    <div class="tab-item" onclick="goTutorials()"><span class="tab-icon">📚</span>教程</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="call-overlay" id="callOverlay">
  <div class="call-avatar">👩</div>
  <div class="call-name">女儿</div>
  <div class="call-status" id="callStatus">正在呼叫...</div>
  <button class="call-hangup" onclick="hangupCall()">📞</button>
</div>

<div class="modal-overlay" id="helpMenuModal">
  <div class="modal-content help-menu">
    <div class="modal-header">
      <span class="modal-title">选择求助方式</span>
      <button class="modal-close" onclick="hideHelpMenu()">✕</button>
    </div>
    <div class="modal-body" style="padding:1.5rem 1.2rem">
      <div class="help-option" onclick="hideHelpMenu();sendHelp('screenshot')">
        <div class="ho-icon">📸</div>
        <div class="ho-info">
          <div class="ho-title">一键截图求助</div>
          <div class="ho-desc">当前屏幕截图发送给子女，等待标注回复</div>
        </div>
        <div class="ho-arrow">→</div>
      </div>
      <div class="help-option" onclick="hideHelpMenu();sendHelp('share')">
        <div class="ho-icon">📺</div>
        <div class="ho-info">
          <div class="ho-title">共享屏幕求助</div>
          <div class="ho-desc">开启屏幕共享，子女实时看到并指导操作</div>
        </div>
        <div class="ho-arrow">→</div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/elder.js"></script>
<script>
  if (!getCurrentRole() || getCurrentRole() !== 'elder') {
    window.location.href = '../index.html';
  } else {
    initElderPage();
    initScreenShareIndicator();
  }
</script>
</body>
</html>
