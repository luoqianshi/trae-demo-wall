<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教程库</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<div class="app-frame">
  <div class="status-bar"><span id="clock">16:00</span><span>5G 🔋 85%</span></div>

  <div class="page active">
    <div class="nav-bar">
      <span class="nav-back" onclick="goHomeByRole()">←</span>
      <span class="nav-title">教程库</span>
    </div>
    <div class="screen-share-indicator" id="screenShareIndicator" onclick="toggleScreenShare()">
      <span class="ssi-dot">○</span>
      <span class="ssi-text">屏幕共享未开启</span>
      <span class="ssi-toggle">点击切换</span>
    </div>
    <div class="section-title">常用操作 <span class="count" id="learnedCount">已学 0/5</span><button class="add-tutorial-btn" id="addTutorialBtn" onclick="showAddTutorialModal()" style="display:none">+ 添加</button></div>
    <div id="tutorialList"></div>
    <div class="section-title">已学教程</div>
    <div class="learned-list" id="learnedList">
      <div style="padding:0 1rem;color:var(--muted);font-size:0.82rem">暂无已学教程，点击上方卡片开始学习</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="goHomeByRole()"><span class="tab-icon">🏠</span><span id="tabHomeLabel">协助</span><span class="tab-badge"></span></div>
    <div class="tab-item active" onclick="location.reload()"><span class="tab-icon">📚</span>教程</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="addTutorialModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">添加新教程</span>
      <button class="modal-close" onclick="hideAddTutorialModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>选择图标</label>
        <div class="icon-selector">
          <button class="icon-option" onclick="selectIcon(this, '📱')">📱</button>
          <button class="icon-option" onclick="selectIcon(this, '💊')">💊</button>
          <button class="icon-option" onclick="selectIcon(this, '📹')">📹</button>
          <button class="icon-option" onclick="selectIcon(this, '🚌')">🚌</button>
          <button class="icon-option" onclick="selectIcon(this, '🏥')">🏥</button>
          <button class="icon-option" onclick="selectIcon(this, '🧹')">🧹</button>
          <button class="icon-option" onclick="selectIcon(this, '💰')">💰</button>
          <button class="icon-option" onclick="selectIcon(this, '🛒')">🛒</button>
          <button class="icon-option" onclick="selectIcon(this, '📧')">📧</button>
          <button class="icon-option" onclick="selectIcon(this, '📷')">📷</button>
          <button class="icon-option" onclick="selectIcon(this, '🎵')">🎵</button>
          <button class="icon-option" onclick="selectIcon(this, '🎬')">🎬</button>
        </div>
      </div>
      <div class="form-group">
        <label>教程标题</label>
        <input type="text" id="newTutorialTitle" placeholder="例如：如何设置闹钟" maxlength="20">
      </div>
      <div class="form-group">
        <label>简短描述</label>
        <input type="text" id="newTutorialDesc" placeholder="简单说明这个教程的用途" maxlength="40">
      </div>
      <div class="form-group">
        <label>标签（用空格分隔）</label>
        <input type="text" id="newTutorialTags" placeholder="例如：设置 3步" maxlength="20">
      </div>
      <div class="form-group">
        <label>步骤说明（每行一步）</label>
        <textarea id="newTutorialSteps" rows="5" placeholder="第一步：...&#10;第二步：...&#10;第三步：..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="hideAddTutorialModal()">取消</button>
      <button class="btn-confirm" onclick="addNewTutorial()">确认添加</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  if (!getCurrentRole()) {
    window.location.href = '../index.html';
  } else {
    initClock();
    renderTutorials();
    initScreenShareIndicator();
    const role = getCurrentRole();
    const homeLabel = document.getElementById('tabHomeLabel');
    if (homeLabel) {
      homeLabel.textContent = role === 'child' ? '协助' : '求助';
    }
    if (role === 'child') {
      const addBtn = document.getElementById('addTutorialBtn');
      if (addBtn) addBtn.style.display = 'inline-block';
    }
  }
</script>
</body>
</html>
