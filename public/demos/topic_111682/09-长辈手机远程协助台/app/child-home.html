<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>子女端 · 协助台</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<div class="app-frame">
  <div class="status-bar"><span id="clock">16:00</span><span>5G 🔋 85%</span></div>

  <div class="page active">
    <div class="nav-bar">
      <span class="nav-title" id="navTitle">子女端 · 协助台</span>
      <div class="nav-role-badge" onclick="logout()">
        <span id="navRoleText">子女</span>
        <span class="nrb-icon">⏻</span>
      </div>
    </div>

    <div class="screen-share-indicator" id="screenShareIndicator" onclick="toggleScreenShare()">
      <span class="ssi-dot">○</span>
      <span class="ssi-text">屏幕共享未开启</span>
      <span class="ssi-toggle">点击切换</span>
    </div>

    <div class="banner" id="banner"></div>

    <div id="childEmpty" style="text-align:center;padding:1.5rem 1rem;color:var(--muted)">
      <div style="font-size:2.5rem;margin-bottom:0.5rem">💤</div>
      <div style="font-size:0.9rem">暂无求助请求</div>
      <div style="font-size:0.78rem;margin-top:0.3rem">妈妈遇到问题时会在这里截图求助</div>
    </div>

    <div id="sharePreviewWrap">
      <div class="section-title">📡 长辈实时屏幕</div>
      <div class="share-preview" id="sharePreview">
        <div class="share-preview__header">
          <div class="sph-status">
            <div class="sph-dot" id="sphDot"></div>
            <span id="sphStatus">等待屏幕共享...</span>
          </div>
          <span class="sph-time" id="sphTime">--:--</span>
        </div>
        <div class="share-preview__screen" id="sharePreviewScreen">
          <div class="sps-mock" id="spsMock">
            <div class="sps-icon">📱</div>
            <div class="sps-text">等待长辈开启屏幕共享</div>
            <div class="sps-hint">长辈打开App后会自动共享屏幕</div>
          </div>
          <div class="sps-recording" id="spsRecording" style="display:none">
            <div class="sps-rec-dot"></div>
            <span>LIVE</span>
          </div>
        </div>
      </div>
    </div>

    <div id="childAnnotate" style="display:none">
      <div class="ss-area">
        <div class="ss-title">
          <span>📱 妈妈的手机屏幕</span>
          <span style="font-size:0.72rem;color:var(--elder)" id="helpTime">刚刚</span>
        </div>
        <div class="ss-canvas-wrap" id="canvasWrap">
          <div class="ss-mock">
            <div class="ss-icon">💊</div>
            <div class="ss-text">医保电子凭证</div>
            <div class="ss-hint">点击这里打开</div>
            <div class="ss-btn">立即使用</div>
          </div>
          <canvas id="annoCanvas"></canvas>
          <div class="text-input-overlay" id="textOverlay">
            <div class="text-input-box">
              <input type="text" id="textInput" placeholder="输入标注文字" maxlength="20">
              <div class="ti-btns">
                <button class="ti-btn ti-cancel" onclick="cancelTextInput()">取消</button>
                <button class="ti-btn ti-ok" onclick="confirmTextInput()">确定</button>
              </div>
            </div>
          </div>
        </div>
        <div class="anno-tools">
          <div class="anno-tool active" data-tool="arrow" onclick="setTool(this,'arrow')">➡️</div>
          <div class="anno-tool" data-tool="circle" onclick="setTool(this,'circle')">⭕</div>
          <div class="anno-tool" data-tool="draw" onclick="setTool(this,'draw')">✏️</div>
          <div class="anno-tool" data-tool="text" onclick="setTool(this,'text')">💬</div>
          <div class="anno-tool danger" onclick="clearCanvas()">🗑️</div>
        </div>
        <div class="ss-status" id="ssStatus">在截图上拖动即可标注操作位置</div>
      </div>

      <div class="voice-card">
        <div class="v-header">
          <div class="v-avatar">👩</div>
          <div><div class="v-name">录制语音指引</div><div class="v-time">点击下方按钮录音</div></div>
        </div>
        <div id="voicePlayerWrap">
          <div class="voice-empty" id="voiceEmpty">还没有录制语音指引</div>
          <div class="voice-player" id="voicePlayer" style="display:none" onclick="toggleVoice()">
            <div class="voice-play-btn" id="voicePlayBtn">▶</div>
            <div class="voice-wave">
              <div class="wave-bar" style="height:40%"></div><div class="wave-bar" style="height:70%"></div><div class="wave-bar" style="height:50%"></div><div class="wave-bar" style="height:90%"></div><div class="wave-bar" style="height:35%"></div><div class="wave-bar" style="height:65%"></div><div class="wave-bar" style="height:80%"></div><div class="wave-bar" style="height:45%"></div><div class="wave-bar" style="height:95%"></div><div class="wave-bar" style="height:55%"></div><div class="wave-bar" style="height:75%"></div><div class="wave-bar" style="height:30%"></div>
            </div>
            <div class="voice-duration" id="voiceDuration">0:00</div>
          </div>
          <div class="voice-progress" id="voiceProgress"><div class="voice-progress__fill" id="voiceProgressFill"></div></div>
        </div>
        <div class="record-btn" id="recordBtn" onclick="toggleRecord()">
          <div class="record-dot"></div>
          <span id="recordText">点击录制语音指引</span>
          <span class="record-timer" id="recordTimer" style="display:none">0:00</span>
        </div>
      </div>

      <button class="send-btn" id="sendBtn" onclick="sendReply()">📤 发送指引给妈妈</button>
    </div>

    <div id="childSent" style="display:none;text-align:center;padding:2rem 1rem">
      <div style="font-size:2.5rem;margin-bottom:0.5rem">✅</div>
      <div style="font-size:1rem;font-weight:700;color:var(--green)">指引已发送给妈妈</div>
      <div style="font-size:0.82rem;color:var(--muted);margin-top:0.3rem">妈妈可以照着你的标注操作了</div>
      <button class="btn-primary" style="margin-top:1rem" onclick="goTutorials()">📚 浏览教程库</button>
    </div>

    <div class="section-title">最近求助记录</div>
    <div class="learned-list" id="historyList">
      <div style="padding:0 1rem;color:var(--muted);font-size:0.82rem">暂无求助记录</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="location.reload()"><span class="tab-icon">🏠</span>协助<span class="tab-badge"></span></div>
    <div class="tab-item" onclick="goTutorials()"><span class="tab-icon">📚</span>教程</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/child.js"></script>
<script>
  if (!getCurrentRole() || getCurrentRole() !== 'child') {
    window.location.href = '../index.html';
  } else {
    initChildPage();
    initScreenShareIndicator();
    renderSharePreview();
    setInterval(renderSharePreview, 2000);
  }
</script>
</body>
</html>
