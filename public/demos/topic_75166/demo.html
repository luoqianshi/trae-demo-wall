<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叫声大作战 - Pet Brawl Idle Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
}
canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}
/* 开始界面覆盖层 */
#startScreen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    color: white;
}
#startScreen h1 {
    font-size: 48px;
    text-shadow: 3px 3px 0 #333, 0 0 20px rgba(255,255,255,0.5);
    margin-bottom: 10px;
    letter-spacing: 4px;
}
#startScreen .subtitle {
    font-size: 18px;
    margin-bottom: 40px;
    opacity: 0.8;
}
#startScreen .controls-info {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 20px 30px;
    margin-bottom: 30px;
    font-size: 14px;
    line-height: 2;
    text-align: left;
}
#startScreen .controls-info span {
    color: #ffeb3b;
    font-weight: bold;
}
#startBtn {
    font-size: 24px;
    padding: 15px 60px;
    border: 3px solid white;
    background: rgba(255,255,255,0.2);
    color: white;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Courier New', monospace;
}
#startBtn:hover {
    background: rgba(255,255,255,0.4);
    transform: scale(1.05);
}
/* 录音对话框 */
#recordDialog {
    position: absolute;
    display: none;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(30, 30, 60, 0.95);
    border: 3px solid #ffeb3b;
    border-radius: 16px;
    padding: 30px;
    z-index: 50;
    color: white;
    text-align: center;
    min-width: 320px;
}
#recordDialog h3 {
    font-size: 20px;
    margin-bottom: 15px;
    color: #ffeb3b;
}
#recordDialog .record-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
}
#recordDialog button {
    padding: 10px 25px;
    border: 2px solid #ffeb3b;
    background: rgba(255,235,59,0.2);
    color: #ffeb3b;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    transition: background 0.2s;
}
#recordDialog button:hover {
    background: rgba(255,235,59,0.4);
}
#recordDialog .recording-indicator {
    display: none;
    color: #f44336;
    font-size: 16px;
    margin: 10px 0;
    animation: blink 0.5s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}
/* 对战界面 */
#battleOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: none;
    z-index: 60;
}
/* 提示框 */
#toast {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #ffeb3b;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 16px;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
}
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen">
    <h1>叫声大作战</h1>
    <div class="subtitle">Pet Brawl Idle Game</div>
    <div class="controls-info">
        <span>WASD / 方向键</span> - 移动角色<br>
        <span>E</span> - 靠近宠物后录制声音<br>
        <span>空格</span> - 靠近宠物后进入对战<br>
        <span>目标</span> - 靠声音打败所有宠物并收服它们！
    </div>
    <button id="startBtn" onclick="startGame()">开始冒险</button>
</div>

<!-- 主画布 -->
<canvas id="gameCanvas"></canvas>

<!-- 小地图画布 -->
<canvas id="minimapCanvas" style="position:absolute;top:10px;right:10px;border:2px solid rgba(255,255,255,0.5);border-radius:4px;z-index:10;"></canvas>

<!-- 录音对话框 -->
<div id="recordDialog">
    <h3 id="recordPetName">录制叫声</h3>
    <p id="recordHint">按"开始录音"录制你的声音，或选择"使用默认叫声"</p>
    <div class="recording-indicator" id="recordingIndicator">录音中...</div>
    <div class="record-btns">
        <button onclick="startRecording()">开始录音</button>
        <button onclick="stopRecording()">停止录音</button>
        <button onclick="closeRecordDialog()">使用默认叫声</button>
    </div>
</div>

<!-- 对战覆盖层 -->
<canvas id="battleOverlay"></canvas>

<!-- 提示框 -->
<div id="toast"></div>

<script>
// ============================================
// 全局常量与配置
// ============================================
const TILE_SIZE = 40;          // 瓦片大小
const MAP_WIDTH = 2000;        // 地图宽度（像素）
const MAP_HEIGHT = 2000;       // 地图高度（像素）
const MAP_COLS = MAP_WIDTH / TILE_SIZE;
const MAP_ROWS = MAP_HEIGHT / TILE_SIZE;
const PLAYER_SPEED = 3;        // 玩家移动速度
const PET_COUNT = 8;           // 宠物数量
const INTERACT_DIST = 300;     // 交互距离（调试用大范围）
const FOLLOW_DIST = 35;        // 跟随距离

// ============================================
// 画布初始化
// ============================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const battleCanvas = document.getElementById('battleOverlay');
const battleCtx = battleCanvas.getContext('2d');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    battleCanvas.width = window.innerWidth;
    battleCanvas.height = window.innerHeight;
    minimapCanvas.width = 150;
    minimapCanvas.height = 150;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================
// 游戏状态
// ============================================
let gameStarted = false;
let gameTime = 0;          // 游戏时间（秒）
let coins = 0;
let gameState = 'explore';  // explore, record, battle, victory
let cameraX = 0, cameraY = 0;

// 输入状态
const keys = {};

// ============================================
// 音频系统
// ============================================
let audioCtx = null;
let analyser = null;
let micStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let micAvailable = false;

// 初始化音频上下文
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

// 获取麦克风权限
async function requestMic() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micStream = stream;
        micAvailable = true;
        return true;
    } catch (e) {
        micAvailable = false;
        return false;
    }
}

// 用 Web Audio API 生成合成叫声（不同宠物不同音色）
function playSynthSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    switch (type) {
        case 'cat':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'dog':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 0.15);
            osc.frequency.linearRampToValueAtTime(350, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            break;
        case 'rabbit':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            break;
        case 'bird':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1500, audioCtx.currentTime + 0.1);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            osc.frequency.linearRampToValueAtTime(1800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'frog':
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            break;
        case 'chicken':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            osc.frequency.linearRampToValueAtTime(350, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
        case 'fish':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(250, audioCtx.currentTime + 0.15);
            osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            break;
        case 'turtle':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(160, audioCtx.currentTime + 0.2);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
    }
}

// 播放录制好的叫声
function playRecordedSound(audioBlob) {
    if (!audioBlob) return;
    initAudio();
    const reader = new FileReader();
    reader.onload = function(e) {
        audioCtx.decodeAudioData(e.target.result, function(buffer) {
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start();
        });
    };
    reader.readAsArrayBuffer(audioBlob);
}

// ============================================
// 地图系统
// ============================================
// 瓦片类型: 0=草地, 1=小路, 2=水域, 3=树, 4=房屋, 5=花丛
const mapData = [];

function generateMap() {
    for (let r = 0; r < MAP_ROWS; r++) {
        mapData[r] = [];
        for (let c = 0; c < MAP_COLS; c++) {
            mapData[r][c] = 0; // 默认草地
        }
    }
    // 随机生成小路（水平与垂直）
    for (let i = 0; i < 5; i++) {
        let row = Math.floor(Math.random() * MAP_ROWS);
        let col = Math.floor(Math.random() * MAP_COLS);
        let len = 8 + Math.floor(Math.random() * 15);
        if (Math.random() > 0.5) {
            for (let j = 0; j < len && col + j < MAP_COLS; j++) mapData[row][col + j] = 1;
        } else {
            for (let j = 0; j < len && row + j < MAP_ROWS; j++) mapData[row + j][col] = 1;
        }
    }
    // 随机生成水域（几片湖）
    for (let i = 0; i < 4; i++) {
        let cx = 5 + Math.floor(Math.random() * (MAP_COLS - 10));
        let cy = 5 + Math.floor(Math.random() * (MAP_ROWS - 10));
        let size = 2 + Math.floor(Math.random() * 3);
        for (let dr = -size; dr <= size; dr++) {
            for (let dc = -size; dc <= size; dc++) {
                if (dr*dr + dc*dc <= size*size) {
                    let rr = cy + dr, cc = cx + dc;
                    if (rr >= 0 && rr < MAP_ROWS && cc >= 0 && cc < MAP_COLS) mapData[rr][cc] = 2;
                }
            }
        }
    }
    // 随机生成树木
    for (let i = 0; i < 120; i++) {
        let r = Math.floor(Math.random() * MAP_ROWS);
        let c = Math.floor(Math.random() * MAP_COLS);
        if (mapData[r][c] === 0) mapData[r][c] = 3;
    }
    // 随机生成房屋
    for (let i = 0; i < 6; i++) {
        let r = Math.floor(Math.random() * MAP_ROWS);
        let c = Math.floor(Math.random() * MAP_COLS);
        if (mapData[r][c] === 0 && r + 1 < MAP_ROWS && c + 1 < MAP_COLS) {
            mapData[r][c] = 4;
            if (mapData[r][c+1] === 0) mapData[r][c+1] = 4;
        }
    }
    // 随机花丛
    for (let i = 0; i < 60; i++) {
        let r = Math.floor(Math.random() * MAP_ROWS);
        let c = Math.floor(Math.random() * MAP_COLS);
        if (mapData[r][c] === 0) mapData[r][c] = 5;
    }
}

// 颜色配置
const TILE_COLORS = {
    0: ['#4a8c3f', '#5a9c4f'],  // 草地（双色交替）
    1: ['#c4a66a', '#b8995a'],  // 小路
    2: ['#3a7bd5', '#4a8be5'],  // 水域
    5: ['#4a8c3f', '#5a9c4f'],  // 花丛底色同草地
};

// 检测是否可通行
function isWalkable(px, py) {
    let col = Math.floor(px / TILE_SIZE);
    let row = Math.floor(py / TILE_SIZE);
    if (row < 0 || row >= MAP_ROWS || col < 0 || col >= MAP_COLS) return false;
    let tile = mapData[row][col];
    return tile !== 2 && tile !== 3 && tile !== 4; // 水域、树、房屋不可通行
}

// 绘制地图
function drawMap() {
    let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
    let endCol = Math.min(MAP_COLS, Math.ceil((cameraX + canvas.width) / TILE_SIZE) + 1);
    let startRow = Math.max(0, Math.floor(cameraY / TILE_SIZE));
    let endRow = Math.min(MAP_ROWS, Math.ceil((cameraY + canvas.height) / TILE_SIZE) + 1);

    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            let tile = mapData[r][c];
            let x = c * TILE_SIZE - cameraX;
            let y = r * TILE_SIZE - cameraY;

            // 绘制基础瓦片
            if (tile === 0 || tile === 5) {
                ctx.fillStyle = TILE_COLORS[0][(r + c) % 2];
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // 草地细节
                ctx.fillStyle = '#6aac5f';
                ctx.fillRect(x + 5, y + 8, 2, 4);
                ctx.fillRect(x + 20, y + 25, 2, 4);
                ctx.fillRect(x + 30, y + 12, 2, 4);
                // 花丛额外绘制花朵
                if (tile === 5) {
                    ctx.fillStyle = '#ff6b9d';
                    ctx.fillRect(x + 10, y + 10, 4, 4);
                    ctx.fillStyle = '#ffeb3b';
                    ctx.fillRect(x + 25, y + 20, 4, 4);
                    ctx.fillStyle = '#ff6b9d';
                    ctx.fillRect(x + 15, y + 28, 4, 4);
                }
            } else if (tile === 1) {
                ctx.fillStyle = TILE_COLORS[1][(r + c) % 2];
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // 小路细节
                ctx.fillStyle = '#a88a4a';
                ctx.fillRect(x + 8, y + 15, 3, 3);
                ctx.fillRect(x + 22, y + 28, 3, 3);
            } else if (tile === 2) {
                // 水域动画
                let wave = Math.sin((Date.now() / 500) + r * 0.5 + c * 0.3) * 10;
                let b = Math.floor(200 + wave);
                ctx.fillStyle = `rgb(58, ${107 + Math.floor(wave)}, ${213 + Math.floor(wave * 0.5)})`;
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // 水波纹
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(x + 5 + wave * 0.3, y + 10, 8, 2);
                ctx.fillRect(x + 20 - wave * 0.2, y + 25, 6, 2);
            } else if (tile === 3) {
                // 先画草地底色
                ctx.fillStyle = TILE_COLORS[0][(r + c) % 2];
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // 画树
                drawTree(x, y);
            } else if (tile === 4) {
                // 先画草地底色
                ctx.fillStyle = TILE_COLORS[0][(r + c) % 2];
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // 画房屋
                drawHouse(x, y);
            }
        }
    }
}

// 绘制树木
function drawTree(x, y) {
    // 树干
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x + 16, y + 22, 8, 18);
    // 树冠（圆形）
    ctx.fillStyle = '#2d6b1e';
    ctx.beginPath();
    ctx.arc(x + 20, y + 16, 14, 0, Math.PI * 2);
    ctx.fill();
    // 树冠高光
    ctx.fillStyle = '#3a8c2a';
    ctx.beginPath();
    ctx.arc(x + 17, y + 12, 8, 0, Math.PI * 2);
    ctx.fill();
}

// 绘制房屋
function drawHouse(x, y) {
    // 墙壁
    ctx.fillStyle = '#d4a574';
    ctx.fillRect(x + 4, y + 14, 32, 22);
    // 屋顶
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 16);
    ctx.lineTo(x + 20, y + 2);
    ctx.lineTo(x + 38, y + 16);
    ctx.fill();
    // 门
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x + 15, y + 24, 10, 12);
    // 窗户
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(x + 8, y + 20, 5, 5);
    ctx.fillRect(x + 27, y + 20, 5, 5);
}

// ============================================
// 小地图
// ============================================
function drawMinimap() {
    let mw = minimapCanvas.width;
    let mh = minimapCanvas.height;
    let scaleX = mw / MAP_WIDTH;
    let scaleY = mh / MAP_HEIGHT;

    minimapCtx.fillStyle = '#2a2a2a';
    minimapCtx.fillRect(0, 0, mw, mh);

    // 简化绘制地图
    let step = 4; // 每4个瓦片画一个点
    for (let r = 0; r < MAP_ROWS; r += step) {
        for (let c = 0; c < MAP_COLS; c += step) {
            let tile = mapData[r][c];
            let mx = c * TILE_SIZE * scaleX;
            let my = r * TILE_SIZE * scaleY;
            let ms = TILE_SIZE * step * scaleX;
            switch (tile) {
                case 0: case 5: minimapCtx.fillStyle = '#4a8c3f'; break;
                case 1: minimapCtx.fillStyle = '#c4a66a'; break;
                case 2: minimapCtx.fillStyle = '#3a7bd5'; break;
                case 3: minimapCtx.fillStyle = '#1a5c0e'; break;
                case 4: minimapCtx.fillStyle = '#c0392b'; break;
                default: minimapCtx.fillStyle = '#4a8c3f';
            }
            minimapCtx.fillRect(mx, my, ms, ms);
        }
    }

    // 画宠物点
    pets.forEach(p => {
        if (!p.captured) {
            minimapCtx.fillStyle = '#ff6b9d';
            minimapCtx.fillRect(p.x * scaleX - 2, p.y * scaleY - 2, 4, 4);
        }
    });

    // 画玩家点
    minimapCtx.fillStyle = '#ffeb3b';
    minimapCtx.fillRect(player.x * scaleX - 3, player.y * scaleY - 3, 6, 6);

    // 画视野框
    minimapCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    minimapCtx.lineWidth = 1;
    minimapCtx.strokeRect(
        cameraX * scaleX, cameraY * scaleY,
        canvas.width * scaleX, canvas.height * scaleY
    );
}

// ============================================
// 玩家角色
// ============================================
const player = {
    x: MAP_WIDTH / 2,
    y: MAP_HEIGHT / 2,
    width: 32,
    height: 40,
    hp: 100,
    maxHp: 100,
    speed: PLAYER_SPEED,
    dir: 'down',      // 朝向: up, down, left, right
    frame: 0,          // 动画帧
    frameTimer: 0,
    capturedPets: [],  // 已收服宠物列表
    soundCooldown: 0,  // 叫声冷却
};

// 绘制玩家角色（像素风格小人）
function drawPlayer(sx, sy) {
    let f = player.frame;
    let dir = player.dir;
    let bobY = 0;
    if (player.isMoving) {
        bobY = Math.sin(f * Math.PI / 4) * 2;
    }

    // 身体
    ctx.fillStyle = '#3498db';
    ctx.fillRect(sx + 8, sy + 14 + bobY, 16, 16);

    // 头
    ctx.fillStyle = '#fad7a0';
    ctx.fillRect(sx + 10, sy + 2 + bobY, 12, 12);

    // 头发
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(sx + 9, sy + 0 + bobY, 14, 5);
    if (dir === 'left') {
        ctx.fillRect(sx + 9, sy + 2 + bobY, 3, 6);
    } else if (dir === 'right') {
        ctx.fillRect(sx + 20, sy + 2 + bobY, 3, 6);
    }

    // 眼睛
    ctx.fillStyle = '#2c3e50';
    if (dir === 'up') {
        // 背面不画眼睛
    } else if (dir === 'down' || dir === 'left' || dir === 'right') {
        ctx.fillRect(sx + 13, sy + 6 + bobY, 3, 3);
        ctx.fillRect(sx + 18, sy + 6 + bobY, 3, 3);
    }

    // 腿（行走动画）
    ctx.fillStyle = '#2c3e50';
    if (player.isMoving) {
        let legOffset = Math.sin(f * Math.PI / 3) * 4;
        ctx.fillRect(sx + 10, sy + 30 + bobY, 5, 8);
        ctx.fillRect(sx + 17, sy + 30 + bobY + legOffset, 5, 8);
    } else {
        ctx.fillRect(sx + 10, sy + 30 + bobY, 5, 8);
        ctx.fillRect(sx + 17, sy + 30 + bobY, 5, 8);
    }

    // 手臂
    ctx.fillStyle = '#fad7a0';
    ctx.fillRect(sx + 4, sy + 16 + bobY, 5, 10);
    ctx.fillRect(sx + 23, sy + 16 + bobY, 5, 10);

    // HP条
    drawHPBar(sx, sy - 10, player.hp, player.maxHp, '#2ecc71', '#e74c3c');
}

// 绘制HP条
function drawHPBar(x, y, hp, maxHp, fgColor, bgColor) {
    let w = 36;
    let h = 4;
    ctx.fillStyle = bgColor;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = fgColor;
    ctx.fillRect(x, y, w * (hp / maxHp), h);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
}

// 更新玩家位置
function updatePlayer() {
    player.isMoving = false;
    let dx = 0, dy = 0;

    if (keys['w'] || keys['arrowup']) { dy = -1; player.dir = 'up'; }
    if (keys['s'] || keys['arrowdown']) { dy = 1; player.dir = 'down'; }
    if (keys['a'] || keys['arrowleft']) { dx = -1; player.dir = 'left'; }
    if (keys['d'] || keys['arrowright']) { dx = 1; player.dir = 'right'; }

    if (dx !== 0 || dy !== 0) {
        player.isMoving = true;
        // 归一化对角移动
        if (dx !== 0 && dy !== 0) {
            dx *= 0.707;
            dy *= 0.707;
        }
        let newX = player.x + dx * player.speed;
        let newY = player.y + dy * player.speed;
        // 碰撞检测（检查角色四个角）
        if (isWalkable(newX - 12, newY - 12) && isWalkable(newX + 12, newY - 12) &&
            isWalkable(newX - 12, newY + 12) && isWalkable(newX + 12, newY + 12)) {
            player.x = Math.max(16, Math.min(MAP_WIDTH - 16, newX));
            player.y = Math.max(16, Math.min(MAP_HEIGHT - 16, newY));
        }
        player.frameTimer++;
        if (player.frameTimer >= 6) {
            player.frame = (player.frame + 1) % 8;
            player.frameTimer = 0;
        }
    }

    // 更新摄像机位置（平滑跟随）
    let targetCX = player.x - canvas.width / 2;
    let targetCY = player.y - canvas.height / 2;
    cameraX += (targetCX - cameraX) * 0.1;
    cameraY += (targetCY - cameraY) * 0.1;
    cameraX = Math.max(0, Math.min(MAP_WIDTH - canvas.width, cameraX));
    cameraY = Math.max(0, Math.min(MAP_HEIGHT - canvas.height, cameraY));
}

// 更新宠物AI
function updatePets() {
    pets.forEach(pet => {
        if (pet.captured) return;

        // 移动计时器
        pet.moveTimer--;
        if (pet.moveTimer <= 0) {
            // 选择新的目标位置（在初始位置附近随机游走）
            let range = 150;
            pet.targetX = pet.homeX + (Math.random() - 0.5) * range;
            pet.targetY = pet.homeY + (Math.random() - 0.5) * range;
            // 限制在地图范围内
            pet.targetX = Math.max(30, Math.min(MAP_WIDTH - 30, pet.targetX));
            pet.targetY = Math.max(30, Math.min(MAP_HEIGHT - 30, pet.targetY));
            pet.moveTimer = 60 + Math.random() * 180;
        }

        // 向目标移动
        let dx = pet.targetX - pet.x;
        let dy = pet.targetY - pet.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 3) {
            pet.isMoving = true;
            let speed = 1;
            let mx = (dx / dist) * speed;
            let my = (dy / dist) * speed;
            let newX = pet.x + mx;
            let newY = pet.y + my;
            if (isWalkable(newX, newY)) {
                pet.x = newX;
                pet.y = newY;
                if (Math.abs(mx) > Math.abs(my)) {
                    pet.dir = mx > 0 ? 'right' : 'left';
                } else {
                    pet.dir = my > 0 ? 'down' : 'up';
                }
            }
            pet.frameTimer++;
            if (pet.frameTimer >= 8) {
                pet.frame = (pet.frame + 1) % 8;
                pet.frameTimer = 0;
            }
        } else {
            pet.isMoving = false;
        }

        // 叫声冷却
        if (pet.soundCooldown > 0) pet.soundCooldown--;

        // 玩家靠近时发出叫声
        let distToPlayer = Math.hypot(player.x - pet.x, player.y - pet.y);
        if (distToPlayer < INTERACT_DIST + 30 && pet.soundCooldown <= 0) {
            if (pet.hasCustomSound && pet.recordedSound) {
                playRecordedSound(pet.recordedSound);
            } else {
                playSynthSound(pet.type);
            }
            pet.soundCooldown = 120; // 2秒冷却
        }
    });
}

let recordingPet = null;
let isRecording = false;

function openRecordDialog(pet) {
    recordingPet = pet;
    document.getElementById('recordPetName').textContent = '为 ' + pet.name + ' 录制叫声';
    document.getElementById('recordDialog').style.display = 'block';
    gameState = 'record';
}

function closeRecordDialog() {
    document.getElementById('recordDialog').style.display = 'none';
    if (recordingPet) {
        recordingPet.hasCustomSound = false;
        recordingPet.recordedSound = null;
    }
    recordingPet = null;
    isRecording = false;
    gameState = 'explore';
}

async function startRecording() {
    if (isRecording) return;

    // 尝试获取麦克风
    if (!micStream) {
        await requestMic();
    }

    if (!micAvailable) {
        showToast('无法获取麦克风权限，将使用默认叫声');
        closeRecordDialog();
        return;
    }

    isRecording = true;
    recordedChunks = [];
    document.getElementById('recordingIndicator').style.display = 'block';

    try {
        // 创建 MediaRecorder
        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
            if (recordedChunks.length > 0 && recordingPet) {
                recordingPet.recordedSound = new Blob(recordedChunks, { type: 'audio/webm' });
                recordingPet.hasCustomSound = true;
                showToast('录音成功！' + recordingPet.name + ' 的新叫声已保存');
            }
        };
        mediaRecorder.start();
    } catch (e) {
        showToast('录音失败，将使用默认叫声');
        isRecording = false;
        document.getElementById('recordingIndicator').style.display = 'none';
    }
}

function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    document.getElementById('recordingIndicator').style.display = 'none';
    setTimeout(() => {
        closeRecordDialog();
    }, 500);
}

// 声音格斗对战系统
// ============================================
let battleState = null;

function startBattle(pet) {
    gameState = 'battle';
    battleCanvas.style.display = 'block';

    battleState = {
        pet: pet,
        petHp: pet.hp,
        petMaxHp: pet.maxHp,
        playerHp: 100,
        playerMaxHp: 100,
        petAtkTimer: 0,
        petAtkInterval: 90,  // 宠物每1.5秒攻击一次
        volume: 0,
        playerAttackAnim: 0,
        petAttackAnim: 0,
        shakeTimer: 0,
        shakeDir: 0,
        result: null,  // null, 'win', 'lose'
        resultTimer: 0,
        time: 0,
    };

    // 尝试开启麦克风用于音量检测
    initBattleMic();
}

let battleAnalyser = null;
let battleMicSource = null;

async function initBattleMic() {
    initAudio();
    if (!micStream) {
        await requestMic();
    }
    if (micAvailable && micStream) {
        try {
            battleMicSource = audioCtx.createMediaStreamSource(micStream);
            battleAnalyser = audioCtx.createAnalyser();
            battleAnalyser.fftSize = 256;
            battleMicSource.connect(battleAnalyser);
        } catch (e) {
            battleAnalyser = null;
        }
    }
}

function getMicVolume() {
    if (!battleAnalyser) {
        // 没有麦克风时，用随机值模拟
        return Math.random() * 30;
    }
    let dataArray = new Uint8Array(battleAnalyser.frequencyBinCount);
    battleAnalyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length;
}

function updateBattle() {
    if (!battleState) return;

    let bs = battleState;
    if (bs.result) {
        bs.resultTimer++;
        if (bs.resultTimer > 120) {
            endBattle();
        }
        return;
    }

    bs.time++;

    // 获取音量
    bs.volume = getMicVolume();

    // 玩家音量越大，攻击频率越高，伤害越大
    if (bs.volume > 20) {
        bs.playerAttackAnim = 10;
        // 基于音量计算伤害
        let dmg = (bs.volume / 255) * 8;
        bs.petHp = Math.max(0, bs.petHp - dmg);
    }

    // 宠物AI反击
    bs.petAtkTimer++;
    if (bs.petAtkTimer >= bs.petAtkInterval) {
        bs.petAtkTimer = 0;
        bs.petAttackAnim = 15;
        let dmg = bs.pet.atk + Math.random() * 3;
        bs.playerHp = Math.max(0, bs.playerHp - dmg);
        bs.shakeTimer = 10;
        bs.shakeDir = -1;
    }

    // 动画衰减
    if (bs.playerAttackAnim > 0) bs.playerAttackAnim--;
    if (bs.petAttackAnim > 0) bs.petAttackAnim--;
    if (bs.shakeTimer > 0) bs.shakeTimer--;

    // 胜负判定
    if (bs.petHp <= 0) {
        bs.result = 'win';
        bs.resultTimer = 0;
        coins += 50;
    } else if (bs.playerHp <= 0) {
        bs.result = 'lose';
        bs.resultTimer = 0;
    }
}

function drawBattle() {
    if (!battleState || !battleCtx) return;
    let bw = battleCanvas.width;
    let bh = battleCanvas.height;
    battleCtx.clearRect(0, 0, bw, bh);

    // 背景
    let grad = battleCtx.createLinearGradient(0, 0, 0, bh);
    grad.addColorStop(0, '#1a1a3e');
    grad.addColorStop(1, '#2a1a3e');
    battleCtx.fillStyle = grad;
    battleCtx.fillRect(0, 0, bw, bh);

    // 地面
    battleCtx.fillStyle = '#4a8c3f';
    battleCtx.fillRect(0, bh * 0.65, bw, bh * 0.35);
    battleCtx.fillStyle = '#3a7c2f';
    battleCtx.fillRect(0, bh * 0.65, bw, 4);

    let bs = battleState;

    // VS 文字
    battleCtx.fillStyle = '#ffeb3b';
    battleCtx.font = 'bold 36px Courier New';
    battleCtx.textAlign = 'center';
    battleCtx.fillText('VS', bw / 2, 70);

    // 玩家角色（左边）
    let playerShake = bs.shakeTimer > 0 && bs.shakeDir < 0 ? (Math.sin(bs.shakeTimer) * 5) : 0;
    let pX = bw * 0.25 + playerShake;
    let pY = bh * 0.5;

    // 绘制放大版的玩家
    drawBattlePlayer(pX, pY, bs.playerAttackAnim > 0);

    // 宠物（右边）
    let petShake = bs.shakeTimer > 0 && bs.shakeDir > 0 ? (Math.sin(bs.shakeTimer) * 5) : 0;
    let eX = bw * 0.75 + petShake;
    let eY = bh * 0.5;

    // 绘制放大版的宠物
    drawBattlePet(eX, eY, bs.pet, bs.petAttackAnim > 0);

    // 攻击动画效果
    if (bs.playerAttackAnim > 5) {
        battleCtx.fillStyle = 'rgba(255, 255, 100, 0.3)';
        battleCtx.beginPath();
        battleCtx.arc(eX - 30, eY - 20, 30, 0, Math.PI * 2);
        battleCtx.fill();
        battleCtx.fillStyle = '#fff';
        battleCtx.font = 'bold 20px Courier New';
        battleCtx.fillText(Math.floor((bs.volume / 255) * 8) + '', eX - 50, eY - 50);
    }
    if (bs.petAttackAnim > 8) {
        battleCtx.fillStyle = 'rgba(255, 100, 100, 0.3)';
        battleCtx.beginPath();
        battleCtx.arc(pX + 30, pY - 20, 25, 0, Math.PI * 2);
        battleCtx.fill();
    }

    // HP条 - 玩家
    battleCtx.fillStyle = 'rgba(0,0,0,0.5)';
    battleCtx.fillRect(pX - 50, pY - 70, 100, 12);
    battleCtx.fillStyle = '#2ecc71';
    battleCtx.fillRect(pX - 49, pY - 69, 98 * (bs.playerHp / bs.playerMaxHp), 10);
    battleCtx.fillStyle = '#fff';
    battleCtx.font = '12px Courier New';
    battleCtx.fillText('你', pX, pY - 78);

    // HP条 - 宠物
    battleCtx.fillStyle = 'rgba(0,0,0,0.5)';
    battleCtx.fillRect(eX - 50, eY - 70, 100, 12);
    battleCtx.fillStyle = '#e74c3c';
    battleCtx.fillRect(eX - 49, eY - 69, 98 * (bs.petHp / bs.petMaxHp), 10);
    battleCtx.fillStyle = '#fff';
    battleCtx.font = '12px Courier New';
    battleCtx.fillText(bs.pet.name, eX, eY - 78);

    // 音量条
    let barX = bw * 0.1;
    let barY = bh * 0.85;
    let barW = bw * 0.8;
    let barH = 20;

    battleCtx.fillStyle = 'rgba(0,0,0,0.5)';
    battleCtx.fillRect(barX, barY, barW, barH);
    let volPct = bs.volume / 255;
    let barColor = volPct < 0.3 ? '#2ecc71' : volPct < 0.6 ? '#ffeb3b' : '#e74c3c';
    battleCtx.fillStyle = barColor;
    battleCtx.fillRect(barX + 2, barY + 2, (barW - 4) * volPct, barH - 4);
    battleCtx.strokeStyle = '#fff';
    battleCtx.lineWidth = 1;
    battleCtx.strokeRect(barX, barY, barW, barH);

    battleCtx.fillStyle = '#fff';
    battleCtx.font = '14px Courier New';
    battleCtx.textAlign = 'center';
    battleCtx.fillText('对着麦克风发出声音来攻击！音量越大伤害越高', bw / 2, barY - 10);

    // 分贝显示
    battleCtx.fillStyle = barColor;
    battleCtx.font = 'bold 18px Courier New';
    let db = Math.floor(bs.volume * 0.8);
    battleCtx.fillText(db + ' dB', bw / 2, barY + 16);

    // 结果显示
    if (bs.result === 'win') {
        battleCtx.fillStyle = 'rgba(0,0,0,0.6)';
        battleCtx.fillRect(0, bh * 0.3, bw, bh * 0.3);
        battleCtx.fillStyle = '#ffeb3b';
        battleCtx.font = 'bold 42px Courier New';
        battleCtx.fillText('胜利！收服了 ' + bs.pet.name + '！', bw / 2, bh * 0.45);
        battleCtx.fillStyle = '#2ecc71';
        battleCtx.font = '20px Courier New';
        battleCtx.fillText('+50 金币', bw / 2, bh * 0.52);
    } else if (bs.result === 'lose') {
        battleCtx.fillStyle = 'rgba(0,0,0,0.6)';
        battleCtx.fillRect(0, bh * 0.3, bw, bh * 0.3);
        battleCtx.fillStyle = '#e74c3c';
        battleCtx.font = 'bold 42px Courier New';
        battleCtx.fillText('战败！', bw / 2, bh * 0.45);
        battleCtx.fillStyle = '#aaa';
        battleCtx.font = '20px Courier New';
        battleCtx.fillText('休息一下再来挑战吧...', bw / 2, bh * 0.52);
    }

    // ESC提示
    if (!bs.result) {
        battleCtx.fillStyle = 'rgba(255,255,255,0.5)';
        battleCtx.font = '12px Courier New';
        battleCtx.textAlign = 'right';
        battleCtx.fillText('ESC 退出对战', bw - 20, 25);
    }
}

function endBattle() {
    if (battleState.result === 'win') {
        let pet = battleState.pet;
        pet.captured = true;
        player.capturedPets.push(pet);
        showToast('成功收服了 ' + pet.name + '！(' + player.capturedPets.length + '/' + PET_COUNT + ')');

        // 检查是否全部收服
        if (player.capturedPets.length >= PET_COUNT) {
            setTimeout(() => {
                showToast('恭喜！你已收服了所有宠物！游戏通关！');
            }, 2000);
        }
    } else {
        // 战败恢复玩家HP
        player.hp = player.maxHp;
        showToast('战败了... 体力已恢复，再来挑战吧');
    }

    battleCanvas.style.display = 'none';
    battleState = null;
    gameState = 'explore';
}

// ============================================
// 收服与跟随系统
// ============================================
function updateFollowers() {
    let prev = { x: player.x, y: player.y };
    player.capturedPets.forEach((pet, idx) => {
        let target = prev;
        let dx = target.x - pet.x;
        let dy = target.y - pet.y;
        let dist = Math.hypot(dx, dy);
        let desiredDist = FOLLOW_DIST;

        if (dist > desiredDist) {
            let speed = Math.min(PLAYER_SPEED * 0.8, dist * 0.05);
            let moveX = (dx / dist) * speed;
            let moveY = (dy / dist) * speed;
            let newX = pet.x + moveX;
            let newY = pet.y + moveY;
            if (isWalkable(newX, newY)) {
                pet.x = newX;
                pet.y = newY;
            }
            pet.isMoving = true;
            pet.frameTimer++;
            if (pet.frameTimer >= 8) {
                pet.frame = (pet.frame + 1) % 8;
                pet.frameTimer = 0;
            }
        } else {
            pet.isMoving = false;
        }

        // 跟随宠物发出叫声
        if (pet.soundCooldown > 0) pet.soundCooldown--;
        if (pet.soundCooldown <= 0 && Math.random() < 0.003) {
            if (pet.hasCustomSound && pet.recordedSound) {
                playRecordedSound(pet.recordedSound);
            } else {
                playSynthSound(pet.type);
            }
            pet.soundCooldown = 150;
        }

        prev = { x: pet.x, y: pet.y };
    });

    // 宠物之间相遇互相叫
    for (let i = 0; i < player.capturedPets.length; i++) {
        for (let j = i + 1; j < player.capturedPets.length; j++) {
            let a = player.capturedPets[i];
            let b = player.capturedPets[j];
            let dist = Math.hypot(a.x - b.x, a.y - b.y);
            if (dist < 30 && a.soundCooldown <= 0 && b.soundCooldown <= 0 && Math.random() < 0.02) {
                playSynthSound(a.type);
                setTimeout(() => playSynthSound(b.type), 200);
                a.soundCooldown = 120;
                b.soundCooldown = 120;
            }
        }
    }
}

let toastTimer = 0;

}

// ============================================
// 输入处理
// ============================================
document.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (!gameStarted) return;

    if (gameState === 'explore') {
        // E键 - 录音交互
        if (e.key.toLowerCase() === 'e') {
            let nearestPet = null;
            let nearestDist = Infinity;
            pets.forEach(p => {
                if (p.captured) return;
                let d = Math.hypot(player.x - p.x, player.y - p.y);
                if (d < INTERACT_DIST && d < nearestDist) {
                    nearestDist = d;
                    nearestPet = p;
                }
            });
            if (nearestPet) {
                openRecordDialog(nearestPet);
            }
        }
        // 空格 - 对战
        if (e.key === ' ') {
            e.preventDefault();
            let nearestPet = null;
            let nearestDist = Infinity;
            pets.forEach(p => {
                if (p.captured) return;
                let d = Math.hypot(player.x - p.x, player.y - p.y);
                if (d < INTERACT_DIST && d < nearestDist) {
                    nearestDist = d;
                    nearestPet = p;
                }
            });
            if (nearestPet) {
                startBattle(nearestPet);
            }
        }
    } else if (gameState === 'battle') {
        // ESC退出对战
        if (e.key === 'Escape') {
            if (battleState && !battleState.result) {
                battleCanvas.style.display = 'none';
                battleState = null;
                gameState = 'explore';
                showToast('已退出对战');
            }
        }
    } else if (gameState === 'record') {
        if (e.key === 'Escape') {
            closeRecordDialog();
        }
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

let lastTime = 0;

function gameLoop(timestamp) {
    if (!gameStarted) {
        requestAnimationFrame(gameLoop);
        return;
    }

    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // 防止大跳跃
    lastTime = timestamp;
    gameTime += dt;

    // 清屏
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'explore' || gameState === 'record') {
        // 更新
        updatePlayer();
        updatePets();
        updateFollowers();
        updateToast();

        // 绘制地图
        drawMap();

        // 收集所有需要绘制的实体，按Y坐标排序（简单排序实现深度）
        let entities = [];
        // 未被收服的宠物
        pets.forEach(p => {
            if (!p.captured) entities.push({ type: 'pet', data: p, y: p.y });
        });
        // 已收服的跟随宠物
        player.capturedPets.forEach(p => entities.push({ type: 'pet', data: p, y: p.y }));
        // 玩家
        entities.push({ type: 'player', data: player, y: player.y });

        // 按Y排序
        entities.sort((a, b) => a.y - b.y);

        // 绘制实体
        entities.forEach(e => {
            let sx, sy;
            if (e.type === 'player') {
                sx = e.data.x - cameraX - 16;
                sy = e.data.y - cameraY - 20;
                drawPlayer(sx, sy);
            } else {
                sx = e.data.x - cameraX - 16;
                sy = e.data.y - cameraY - 20;
                drawPet(e.data, sx, sy);
            }
        });

        // 绘制UI
        drawUI();
        drawMinimap();
    } else if (gameState === 'battle') {
        // 对战模式
        updateBattle();
        drawBattle();
    }

    requestAnimationFrame(gameLoop);
}

// ============================================
// 游戏初始化
// ============================================
function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    gameStarted = true;
    initAudio();
    generateMap();
    initPets();

    // 确保玩家出生点可行走
    let attempts = 0;
    while (!isWalkable(player.x, player.y) && attempts < 100) {
        player.x = 100 + Math.random() * (MAP_WIDTH - 200);
        player.y = 100 + Math.random() * (MAP_HEIGHT - 200);
        attempts++;
    }

    // 初始化摄像机
    cameraX = player.x - canvas.width / 2;
    cameraY = player.y - canvas.height / 2;

    // 尝试请求麦克风（可选）
    requestMic().then(() => {
        if (!micAvailable) {
            showToast('未获取麦克风权限，将使用预设叫声');
        }
    });

    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

// 预启动游戏循环
requestAnimationFrame(gameLoop);
</script>
