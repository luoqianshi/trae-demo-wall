// ===== PAPER & TYPING LOGIC =====
let shiftPressed = false;
let ribbonPosition = 0;
let isAnimating = false;
let currentCol = 0;

function resetPaper() {
  workLines = [{ type: 'title', text: '' }];
  currentLine = 0;
  currentCol = 0;
  currentPage = 1;
  const paperContainer = document.getElementById('paperSheetContainer');
  const linkageAssembly = document.querySelector('.linkage-assembly');
  if (paperContainer) {
    paperContainer._cumulativeOffset = 0;
    paperContainer.style.transition = 'none';
    paperContainer.style.transform = 'translateX(0)';
  }
  if (linkageAssembly) {
    linkageAssembly._cumulativeOffset = 0;
    linkageAssembly.style.transition = 'none';
    linkageAssembly.style.transform = 'translateX(-360px) translateY(-50%)';
  }
  renderPaper();
  updateStatusBar();
}

function renderPaper() {
  const paperText = document.getElementById('paperText');
  if (!paperText) return;
  
  const totalLines = workLines.length;
  const pageStart = (currentPage - 1) * linesPerPage;
  const pageEnd = Math.min(pageStart + linesPerPage, totalLines);
  const pageLines = workLines.slice(pageStart, pageEnd);
  
  let needsFullRender = false;
  const existingLines = paperText.querySelectorAll('.line');
  
  if (existingLines.length !== Math.max(visibleLines, pageLines.length)) {
    needsFullRender = true;
  }
  
  if (!needsFullRender) {
    let hasChanges = false;
    pageLines.forEach((line, idx) => {
      const globalIdx = pageStart + idx;
      const existingLine = existingLines[idx];
      if (!existingLine) {
        hasChanges = true;
        return;
      }
      
      const lineClass = getLineClass(line.type);
      let blurClass = '';
      if (totalLines > visibleLines) {
        const distFromBottom = (pageEnd - 1) - globalIdx;
        if (distFromBottom < 2) {
          blurClass = 'blur-zone';
        } else if (distFromBottom < 4) {
          blurClass = 'fading';
        }
      }
      
      let lineContent = line.text;
      if (line.type === 'tag' && line.text) {
          const tags = parseTags(line.text);
          lineContent = tags.map(t => `<span class="tag-capsule" contenteditable="false">#${t}</span>`).join('');
        }
      
      const expectedClass = `line ${lineClass} ${blurClass}`.trim();
      const expectedContent = lineContent || '&nbsp;';
      
      if (existingLine.className !== expectedClass || 
          existingLine.getAttribute('data-line') != globalIdx ||
          existingLine.innerHTML !== expectedContent) {
        hasChanges = true;
      }
    });
    
    if (!hasChanges) return;
  }
  
  let html = '';
  pageLines.forEach((line, idx) => {
    const globalIdx = pageStart + idx;
    const lineClass = getLineClass(line.type);
    
    let blurClass = '';
    if (totalLines > visibleLines) {
      const distFromBottom = (pageEnd - 1) - globalIdx;
      if (distFromBottom < 2) {
        blurClass = 'blur-zone';
      } else if (distFromBottom < 4) {
        blurClass = 'fading';
      }
    }
    
    let lineContent = line.text;
    
    if (line.type === 'tag' && line.text) {
      const tags = parseTags(line.text);
      lineContent = tags.map(t => `<span class="tag-capsule" contenteditable="false">#${t}</span>`).join('');
    }
    
    html += `<span class="line ${lineClass} ${blurClass}" data-line="${globalIdx}">${lineContent || '&nbsp;'}</span>`;
  });
  
  const remainingLines = visibleLines - pageLines.length;
  for (let i = 0; i < remainingLines; i++) {
    html += `<span class="line" style="opacity:0.3">&nbsp;</span>`;
  }
  
  paperText.innerHTML = html;
}

function getLineClass(type) {
  if (type === 'title') return 'title-line';
  if (type === 'tag') return 'tag-line';
  return '';
}

function parseTags(text) {
  if (!text) return [];
  const cleaned = text.replace(/#/g, '').replace(/，/g, ',');
  return cleaned.split(',').map(t => t.trim()).filter(t => t);
}

function simulateKeyPress(key) {
  if (key === 'Shift') {
    shiftPressed = !shiftPressed;
    return;
  }
  handleInput(key);
}

function handleInput(key) {
  if (key === 'Enter') {
    handleEnter();
    return;
  }
  
  if (key === 'Backspace') {
    handleBackspace();
    return;
  }
  
  if (key.length === 1) {
    addChar(shiftPressed ? key.toUpperCase() : key.toLowerCase());
    shiftPressed = false;
  } else if (key === ' ') {
    addChar(' ');
  }
}

function saveCursorPosition() {
  const selection = window.getSelection();
  if (selection.rangeCount === 0) return null;
  
  const range = selection.getRangeAt(0);
  const paperText = document.getElementById('paperText');
  
  if (!paperText.contains(range.commonAncestorContainer)) {
    return null;
  }
  
  return {
    startContainer: range.startContainer,
    startOffset: range.startOffset,
    endContainer: range.endContainer,
    endOffset: range.endOffset,
    collapsed: range.collapsed
  };
}

function restoreCursorPosition(savedPos) {
  const selection = window.getSelection();
  const paperText = document.getElementById('paperText');
  
  if (!paperText) return;
  
  if (savedPos) {
    try {
      const range = document.createRange();
      range.setStart(savedPos.startContainer, savedPos.startOffset);
      range.setEnd(savedPos.endContainer, savedPos.endOffset);
      selection.removeAllRanges();
      selection.addRange(range);
      return;
    } catch (e) {
    }
  }
  
  placeCursorAtEnd();
}

function placeCursorAt(lineIdx, colIdx) {
  const selection = window.getSelection();
  const paperText = document.getElementById('paperText');
  
  if (!paperText) return;
  
  const lineEl = document.querySelector(`.line[data-line="${lineIdx}"]`);
  if (!lineEl) {
    placeCursorAtEnd();
    return;
  }
  
  const range = document.createRange();
  const textNodes = [];
  const collectTextNodes = (node) => {
    if (node.nodeType === Node.TEXT_NODE) {
      textNodes.push(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.getAttribute('contenteditable') !== 'false') {
      node.childNodes.forEach(collectTextNodes);
    }
  };
  collectTextNodes(lineEl);
  
  let remaining = colIdx;
  for (let i = 0; i < textNodes.length; i++) {
    const node = textNodes[i];
    if (remaining <= node.length) {
      range.setStart(node, remaining);
      range.setEnd(node, remaining);
      break;
    }
    remaining -= node.length;
  }
  
  if (!range.startContainer) {
    if (textNodes.length > 0) {
      const lastNode = textNodes[textNodes.length - 1];
      range.setStart(lastNode, lastNode.length);
      range.setEnd(lastNode, lastNode.length);
    } else {
      range.selectNodeContents(lineEl);
      range.collapse(true);
    }
  }
  
  selection.removeAllRanges();
  selection.addRange(range);
  paperText.focus();
}

function placeCursorAtEnd() {
  const line = workLines[currentLine];
  const col = line ? line.text.length : 0;
  placeCursorAt(currentLine, col);
}

function addChar(char) {
  if (!workLines[currentLine]) {
    workLines[currentLine] = { type: getLineType(currentLine), text: '' };
  }
  
  const line = workLines[currentLine];
  const oldLength = line.text.length;
  
  const textBefore = line.text.slice(0, currentCol);
  const textAfter = line.text.slice(currentCol + 1);
  line.text = textBefore + char + textAfter;
  
  currentCol++;
  
  playKeySound(currentModel.id);
  triggerTypingAnimation(char);
  
  if (checkPageAdvance()) {
    renderPaper();
  } else {
    const lineEl = document.querySelector(`.line[data-line="${currentLine}"]`);
    if (lineEl) {
      let content = line.text || '&nbsp;';
      if (line.type === 'tag' && line.text) {
        const tags = parseTags(line.text);
        content = tags.map(t => `<span class="tag-capsule" contenteditable="false">#${t}</span>`).join('');
      }
      lineEl.innerHTML = content;
      
      if (line.type !== 'tag') {
        const textNodes = [];
        lineEl.childNodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) {
            textNodes.push(node);
          }
        });
        if (textNodes.length > 0) {
          const lastTextNode = textNodes[textNodes.length - 1];
          if (lastTextNode && lastTextNode.nodeValue && lastTextNode.nodeValue.length > 0) {
            const newChar = lastTextNode.nodeValue.slice(-1);
            if (newChar && newChar !== '\n') {
              const span = document.createElement('span');
              span.className = 'char-printing';
              span.textContent = newChar;
              lastTextNode.nodeValue = lastTextNode.nodeValue.slice(0, -1);
              lineEl.appendChild(span);
            }
          }
        }
      }
    }
  }
  
  placeCursorAt(currentLine, currentCol);
  updateStatusBar();
}

function triggerTypingAnimation(char) {
  const keyEl = highlightKey(char === ' ' ? ' ' : char);
  
  const linkageArmLeft = document.getElementById('linkageArmLeft');
  const linkageArmRight = document.getElementById('linkageArmRight');
  const linkageRod = document.getElementById('linkageRod');
  const carriageCable = document.getElementById('carriageCable');
  const linkageAssembly = document.querySelector('.linkage-assembly');
  const hammer = document.getElementById('hammer');
  const hammerShadow = document.querySelector('.hammer-shadow');
  const ribbonStrip = document.getElementById('ribbonStrip');
  
  requestAnimationFrame(() => {
    if (linkageArmLeft) linkageArmLeft.classList.add('pulling');
    if (linkageArmRight) linkageArmRight.classList.add('pulling');
    if (linkageRod) linkageRod.classList.add('pulling');
    if (carriageCable) carriageCable.classList.add('pulling');
    
    setTimeout(() => {
      if (linkageArmLeft) linkageArmLeft.classList.remove('pulling');
      if (linkageArmRight) linkageArmRight.classList.remove('pulling');
      if (linkageRod) linkageRod.classList.remove('pulling');
      if (carriageCable) carriageCable.classList.remove('pulling');
    }, 60);
  });
  
  setTimeout(() => {
    if (hammer) hammer.classList.add('hitting');
    if (hammerShadow) hammerShadow.classList.add('hitting');
    if (ribbonStrip) ribbonStrip.classList.add('inking');
    
    setTimeout(() => {
      if (hammer) hammer.classList.remove('hitting');
      if (hammerShadow) hammerShadow.classList.remove('hitting');
      if (ribbonStrip) ribbonStrip.classList.remove('inking');
    }, 50);
  }, 20);
  
  const indicator = document.querySelector('.typing-line-indicator');
  if (indicator) {
    indicator.classList.add('active');
    if (indicator._activeTimeout) clearTimeout(indicator._activeTimeout);
    indicator._activeTimeout = setTimeout(() => indicator.classList.remove('active'), 100);
  }
  
  rotateRoll(-0.5, 60);
  
  const paperContainer = document.getElementById('paperSheetContainer');
  const moveStep = 1.5 + Math.random() * 1;
  
  if (paperContainer) {
    if (!paperContainer._cumulativeOffset) paperContainer._cumulativeOffset = 0;
    paperContainer._cumulativeOffset += moveStep;
    
    paperContainer.style.transition = 'transform 0.08s cubic-bezier(0.4, 0, 0.2, 1)';
    paperContainer.style.transform = `translateX(-${paperContainer._cumulativeOffset}px)`;
  }
  
  if (linkageAssembly) {
    if (!linkageAssembly._cumulativeOffset) linkageAssembly._cumulativeOffset = 0;
    linkageAssembly._cumulativeOffset += moveStep;
    
    linkageAssembly.style.transition = 'transform 0.08s cubic-bezier(0.4, 0, 0.2, 1)';
    linkageAssembly.style.transform = `translateX(${-360 - linkageAssembly._cumulativeOffset}px) translateY(-50%)`;
  }
}

function handleEnter() {
  const currentType = workLines[currentLine]?.type || 'body';
  
  if (currentType === 'title') {
    workLines[currentLine].type = 'title';
    if (!workLines[currentLine + 1]) {
      workLines.splice(currentLine + 1, 0, { type: 'tag', text: '' });
    } else {
      workLines[currentLine + 1].type = 'tag';
    }
    currentLine++;
  } else if (currentType === 'tag') {
    registerTagsFromLine(workLines[currentLine].text);
    workLines[currentLine].type = 'tag';
    if (!workLines[currentLine + 1]) {
      workLines.splice(currentLine + 1, 0, { type: 'body', text: '' });
    } else {
      workLines[currentLine + 1].type = 'body';
    }
    currentLine++;
  } else {
    workLines.splice(currentLine + 1, 0, { type: 'body', text: '' });
    currentLine++;
  }
  
  currentCol = 0;
  
  playBellSound(currentModel.id);
  
  const linkageArmLeft = document.getElementById('linkageArmLeft');
  const linkageArmRight = document.getElementById('linkageArmRight');
  const linkageRod = document.getElementById('linkageRod');
  const carriageCable = document.getElementById('carriageCable');
  
  requestAnimationFrame(() => {
    if (linkageArmLeft) linkageArmLeft.classList.add('pulling');
    if (linkageArmRight) linkageArmRight.classList.add('pulling');
    if (linkageRod) linkageRod.classList.add('pulling');
    if (carriageCable) carriageCable.classList.add('pulling');
    
    setTimeout(() => {
      if (linkageArmLeft) linkageArmLeft.classList.remove('pulling');
      if (linkageArmRight) linkageArmRight.classList.remove('pulling');
      if (linkageRod) linkageRod.classList.remove('pulling');
      if (carriageCable) carriageCable.classList.remove('pulling');
    }, 120);
  });
  
  setTimeout(() => playCarriageReturnSound(currentModel.id), 80);
  setTimeout(() => playPaperFeedSound(currentModel.id), 150);
  animatePaperShift();
  checkPageAdvance();
  renderPaper();
  
  placeCursorAtEnd();
  updateStatusBar();
}

function handleBackspace() {
  if (!workLines[currentLine]) return;
  
  let needsFullRender = false;
  
  if (currentCol > 0) {
    const line = workLines[currentLine];
    line.text = line.text.slice(0, currentCol - 1) + line.text.slice(currentCol);
    currentCol--;
  } else if (currentLine > 0) {
    const currentText = workLines[currentLine].text;
    workLines.splice(currentLine, 1);
    currentLine--;
    const prevLine = workLines[currentLine];
    currentCol = prevLine.text.length;
    prevLine.text += currentText;
    needsFullRender = checkPageBack() || true;
  } else {
    return;
  }
  
  playBackspaceSound(currentModel.id);
  highlightKey('Backspace');
  
  const linkageArmLeft = document.getElementById('linkageArmLeft');
  const linkageArmRight = document.getElementById('linkageArmRight');
  const linkageRod = document.getElementById('linkageRod');
  const carriageCable = document.getElementById('carriageCable');
  
  requestAnimationFrame(() => {
    if (linkageArmLeft) linkageArmLeft.classList.add('pulling');
    if (linkageArmRight) linkageArmRight.classList.add('pulling');
    if (linkageRod) linkageRod.classList.add('pulling');
    if (carriageCable) carriageCable.classList.add('pulling');
    
    setTimeout(() => {
      if (linkageArmLeft) linkageArmLeft.classList.remove('pulling');
      if (linkageArmRight) linkageArmRight.classList.remove('pulling');
      if (linkageRod) linkageRod.classList.remove('pulling');
      if (carriageCable) carriageCable.classList.remove('pulling');
    }, 60);
  });
  
  rotateRoll(0.5, 60);
  
  const paperContainer = document.getElementById('paperSheetContainer');
  const linkageAssembly = document.querySelector('.linkage-assembly');
  
  const backStep = 3;
  
  if (paperContainer) {
    if (!paperContainer._cumulativeOffset) paperContainer._cumulativeOffset = 0;
    paperContainer._cumulativeOffset = Math.max(0, paperContainer._cumulativeOffset - backStep);
    
    paperContainer.style.transition = 'transform 0.08s cubic-bezier(0.4, 0, 0.2, 1)';
    paperContainer.style.transform = `translateX(-${paperContainer._cumulativeOffset}px)`;
  }
  
  if (linkageAssembly) {
    if (!linkageAssembly._cumulativeOffset) linkageAssembly._cumulativeOffset = 0;
    linkageAssembly._cumulativeOffset = Math.max(0, linkageAssembly._cumulativeOffset - backStep);
    
    linkageAssembly.style.transition = 'transform 0.08s cubic-bezier(0.4, 0, 0.2, 1)';
    linkageAssembly.style.transform = `translateX(${-360 - linkageAssembly._cumulativeOffset}px) translateY(-50%)`;
  }
  
  if (needsFullRender) {
    if (paperSheet) {
      rotateRoll(28, 120);
      paperSheet.style.transition = 'left 0.08s ease, transform 0.12s cubic-bezier(0.4, 0, 0.2, 1)';
      paperSheet.style.transform = 'rotateX(3deg) translateY(-28px)';
      setTimeout(() => {
        paperSheet.style.transition = 'transform 0.08s cubic-bezier(0.3, 0, 0.7, 1)';
        paperSheet.style.transform = 'rotateX(3deg) translateY(0)';
      }, 120);
    }
  }
  
  if (needsFullRender) {
    renderPaper();
  } else {
    const lineEl = document.querySelector(`.line[data-line="${currentLine}"]`);
    if (lineEl) {
      const line = workLines[currentLine];
      let content = line.text || '&nbsp;';
      if (line.type === 'tag' && line.text) {
        const tags = parseTags(line.text);
        content = tags.map(t => `<span class="tag-capsule" contenteditable="false">#${t}</span>`).join('');
      }
      lineEl.innerHTML = content;
    }
  }
  
  placeCursorAt(currentLine, currentCol);
  updateStatusBar();
}

function getLineType(idx) {
  if (idx === 0) return 'title';
  if (idx === 1) return 'tag';
  return 'body';
}

function registerTagsFromLine(tagText) {
  const tags = parseTags(tagText);
  tags.forEach(tag => {
    if (!folders.includes(tag)) {
      folders.push(tag);
      if (!tagTranslations[tag]) {
        tagTranslations[tag] = tag;
      }
      saveData();
    }
  });
}

function checkPageAdvance() {
  const pageMax = currentPage * linesPerPage;
  if (currentLine >= pageMax) {
    currentPage++;
    playDropPaperSound(currentModel.id);
    animatePageTurn();
    return true;
  }
  return false;
}

function checkPageBack() {
  const pageMin = (currentPage - 1) * linesPerPage;
  if (currentLine < pageMin && currentPage > 1) {
    currentPage--;
    playPaperFeedSound(currentModel.id);
  }
}

let rollOffset = 0;
let rollAnimationFrame = null;

function rotateRoll(amount, duration) {
  const rollTopSurface = document.getElementById('rollTopSurface');
  const rollBottomSurface = document.getElementById('rollBottomSurface');
  if (!rollTopSurface && !rollBottomSurface) return;

  const startOffset = rollOffset;
  const targetOffset = rollOffset + amount;
  const startTime = performance.now();

  if (rollAnimationFrame) {
    cancelAnimationFrame(rollAnimationFrame);
  }

  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeProgress = 1 - Math.pow(1 - progress, 3);
    
    const currentOffset = startOffset + (targetOffset - startOffset) * easeProgress;
    
    if (rollTopSurface) {
      rollTopSurface.style.backgroundPosition = `${currentOffset}px 0`;
    }
    if (rollBottomSurface) {
      rollBottomSurface.style.backgroundPosition = `${currentOffset}px 0`;
    }

    if (progress < 1) {
      rollAnimationFrame = requestAnimationFrame(animate);
    } else {
      rollOffset = targetOffset;
      rollAnimationFrame = null;
    }
  }

  rollAnimationFrame = requestAnimationFrame(animate);
}

function animatePaperShift() {

  if (paperContainer._cumulativeOffset) paperContainer._cumulativeOffset = 0;

function animatePageTurn() {

  if (!paperContainer || !paperSheet) return;

      if (linkageArmRight) linkageArmRight.classList.remove('pulling');

const lastKeyPressTime = new Map();
const KEY_REPEAT_THROTTLE = 30;

document.addEventListener('beforeinput', function(e) {
  const createSection = document.getElementById('section-create');
  if (!createSection || !createSection.classList.contains('active')) return;
  
  e.preventDefault();
});

document.addEventListener('keydown', function(e) {
  const createSection = document.getElementById('section-create');
  if (!createSection || !createSection.classList.contains('active')) return;
  
  if (e.key === 'Shift') {
    shiftPressed = true;
    highlightKey('Shift');
    return;
  }
  
  const now = Date.now();
  const lastPress = lastKeyPressTime.get(e.key) || 0;
  if (now - lastPress < KEY_REPEAT_THROTTLE) return;
  lastKeyPressTime.set(e.key, now);
  
  e.preventDefault();
  
  if (e.key === 'Enter') {
    handleEnter();
  } else if (e.key === 'Backspace') {
    handleBackspace();
  } else if (e.key === 'ArrowLeft') {
    moveCursorLeft();
  } else if (e.key === 'ArrowRight') {
    moveCursorRight();
  } else if (e.key === 'ArrowUp') {
    moveCursorUp();
  } else if (e.key === 'ArrowDown') {
    moveCursorDown();
  } else if (e.key === ' ') {
    addChar(' ');
  } else if (e.key.length === 1) {
    addChar(shiftPressed ? e.key.toUpperCase() : e.key);
  }
});

function moveCursorLeft() {
  const line = workLines[currentLine];
  if (!line) return;
  
  if (currentCol > 0) {
    currentCol--;
  } else if (currentLine > 0) {
    currentLine--;
    currentCol = workLines[currentLine]?.text.length || 0;
  }
  
  placeCursorAt(currentLine, currentCol);
}

function moveCursorRight() {
  const line = workLines[currentLine];
  if (!line) return;
  
  if (currentCol < line.text.length) {
    currentCol++;
  } else if (currentLine < workLines.length - 1) {
    currentLine++;
    currentCol = 0;
  }
  
  placeCursorAt(currentLine, currentCol);
}

function moveCursorUp() {
  if (currentLine > 0) {
    currentLine--;
    const line = workLines[currentLine];
    currentCol = Math.min(currentCol, line?.text.length || 0);
    placeCursorAt(currentLine, currentCol);
  }
}

function moveCursorDown() {
  if (currentLine < workLines.length - 1) {
    currentLine++;
    const line = workLines[currentLine];
    currentCol = Math.min(currentCol, line?.text.length || 0);
    placeCursorAt(currentLine, currentCol);
  }
}

document.addEventListener('keyup', function(e) {
  if (e.key === 'Shift') {
    shiftPressed = false;
  }
  lastKeyPressTime.delete(e.key);
});

document.addEventListener('selectionchange', function() {
  const createSection = document.getElementById('section-create');
  if (!createSection || !createSection.classList.contains('active')) return;
  
  const selection = window.getSelection();
  if (selection.rangeCount === 0) return;
  
  const range = selection.getRangeAt(0);
  const paperText = document.getElementById('paperText');
  
  if (!paperText) return;
  
  const container = range.commonAncestorContainer.nodeType === Node.ELEMENT_NODE 
    ? range.commonAncestorContainer 
    : range.commonAncestorContainer.parentNode;
  
  if (!paperText.contains(container)) {
    return;
  }
  
  const lineEl = container.closest('.line');
  if (lineEl) {
    const lineIndex = parseInt(lineEl.getAttribute('data-line'));
    if (!isNaN(lineIndex)) {
      currentLine = lineIndex;
    }
  }
  
  const tagCapsule = container.closest('.tag-capsule');
  if (tagCapsule) {
    const nextSibling = tagCapsule.nextSibling;
    if (nextSibling) {
      range.selectNodeContents(nextSibling);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }
  }
});

// Click on paper to focus
document.addEventListener('click', function(e) {
  const paperText = document.getElementById('paperText');
  const createSection = document.getElementById('section-create');
  if (createSection && createSection.classList.contains('active')) {
    if (paperText && paperText.contains(e.target)) {
      paperText.focus();
    }
  }
});

// ===== WORKS MANAGEMENT =====
const STORAGE_KEY = 'paper_echo_works';
const FOLDERS_KEY = 'paper_echo_folders';

function loadData() {
  try {
    const savedWorks = localStorage.getItem(STORAGE_KEY);
    const savedFolders = localStorage.getItem(FOLDERS_KEY);
    
    if (savedWorks) {
      works = JSON.parse(savedWorks);
    }
    
    const defaultTags = t('defaultTags');
    if (savedFolders) {
      folders = JSON.parse(savedFolders);
    } else {
      folders = [...defaultTags];
    }
    
    // Ensure default tags exist
    defaultTags.forEach(tag => {
      if (!folders.includes(tag)) {
        folders.push(tag);
      }
    });
  } catch (e) {
    console.error('Failed to load data:', e);
    folders = [...t('defaultTags')];
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
  } catch (e) {
    console.error('Failed to save data:', e);
  }
}

function saveWork() {
  const title = workLines[0]?.text || t('untitled');
  const tagText = workLines[1]?.type === 'tag' ? workLines[1].text : '';
  const tags = parseTags(tagText);
  
  const bodyLines = workLines.filter((l, i) => i > 1 || (i === 1 && l.type === 'body'));
  const content = bodyLines.map(l => l.text).join('\n');
  
  const allText = workLines.map(l => l.text).join(' ');
  const charCount = allText.replace(/\s/g, '').length;
  
  const now = new Date().toISOString();
  
  if (currentWorkId) {
    // Update existing
    const idx = works.findIndex(w => w.id === currentWorkId);
    if (idx >= 0) {
      works[idx].title = title;
      works[idx].tags = tags;
      works[idx].content = content;
      works[idx].updatedAt = now;
      works[idx].wordCount = charCount;
      works[idx].pageCount = currentPage;
      works[idx].typewriterModelId = currentModel.id;
    }
  } else {
    // Create new
    const newWork = {
      id: 'work_' + Date.now(),
      typewriterModelId: currentModel.id,
      title: title,
      tags: tags,
      content: content,
      createdAt: now,
      updatedAt: now,
      wordCount: charCount,
      pageCount: currentPage,
      folder: tags[0] || folders[0]
    };
    works.unshift(newWork);
    currentWorkId = newWork.id;
  }
  
  // Register tags as folders
  tags.forEach(tag => {
    if (!folders.includes(tag)) {
      folders.push(tag);
    }
  });
  
  saveData();
  showSaveStatus();
  showToast(t('saveSuccess'));
}

function showSaveStatus() {
  const status = document.getElementById('saveStatus');
  if (status) {
    status.style.display = 'flex';
    setTimeout(() => {
      status.style.display = 'none';
    }, 2000);
  }
}

function exportWork() {
  const title = workLines[0]?.text || t('untitled');
  const tagText = workLines[1]?.type === 'tag' ? workLines[1].text : '';
  const tags = parseTags(tagText);
  const bodyLines = workLines.filter((l, i) => i > 1 || (i === 1 && l.type === 'body'));
  const content = bodyLines.map(l => l.text).join('\n');
  
  // Export as TXT
  const txtContent = `${title}\n\n${tags.map(t => '#' + t).join(' ')}\n\n${content}`;
  const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${title || 'untitled'}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  
  showToast(currentLang === 'zh' ? '已导出 TXT 文件' : 'Exported TXT file');
}

function openWork(workId) {
  const work = works.find(w => w.id === workId);
  if (!work) return;
  
  // Set model
  const model = typewriters.find(tw => tw.id === work.typewriterModelId);
  if (model) {
    currentModel = model;
  }
  
  // Rebuild workLines
  workLines = [];
  workLines.push({ type: 'title', text: work.title });
  if (work.tags && work.tags.length > 0) {
    workLines.push({ type: 'tag', text: work.tags.map(t => '#' + t).join(' ') });
  } else {
    workLines.push({ type: 'tag', text: '' });
  }
  
  if (work.content) {
    const contentLines = work.content.split('\n');
    contentLines.forEach(line => {
      workLines.push({ type: 'body', text: line });
    });
  }
  
  if (workLines.length < 3) {
    workLines.push({ type: 'body', text: '' });
  }
  
  currentLine = workLines.length - 1;
  currentPage = Math.floor(currentLine / linesPerPage) + 1;
  currentWorkId = workId;
  
  switchSection('create');
  applyModelTheme();
  renderKeyboard();
  renderPaper();
  updateStatusBar();
}

    item.className = 'folder-item' + (currentFolder === folder ? ' active' : '');
    item.innerHTML = `
      <span class="folder-icon">📂</span>
      <span class="folder-name">${folder}</span>
      <span class="folder-count">${count}</span>
      <button class="folder-delete-btn" onclick="event.stopPropagation(); showDeleteFolder('${folder}')">×</button>
    `;
    item.addEventListener('click', () => { currentFolder = folder; renderFolders(); renderWorks(); });
    list.appendChild(item);
  });
}

function renderWorks() {
  const grid = document.getElementById('worksGrid');
  if (!grid) return;
  
  let filteredWorks = works;
  if (currentFolder !== 'all') {
    filteredWorks = works.filter(w => w.tags && w.tags.includes(currentFolder));
  }
  
  // Sort by updatedAt
  filteredWorks = [...filteredWorks].sort((a, b) => 
    new Date(b.updatedAt) - new Date(a.updatedAt)
  );
  
  // Update folder name
  const folderName = document.getElementById('currentFolderName');
  if (folderName) {
    folderName.textContent = currentFolder === 'all' ? t('allWorks') : currentFolder;
  }
  
  if (filteredWorks.length === 0) {
    grid.innerHTML = `
      <div class="empty-works" style="grid-column:1/-1">
        <div class="icon">📄</div>
        <p>${t('noWorks')}</p>
        <p style="margin-top:8px;font-size:12px;opacity:0.7">${t('noWorksDesc')}</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = '';
  filteredWorks.forEach(work => {
    const model = typewriters.find(tw => tw.id === work.typewriterModelId);
    const modelName = model ? (currentLang === 'zh' ? model.nameZh : model.nameEn) : '';
    
    const card = document.createElement('div');
    card.className = 'work-card';
    card.onclick = () => openWork(work.id);
    
    const preview = work.content?.substring(0, 80) || '';
    const createdDate = new Date(work.createdAt).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US');
    const updatedDate = new Date(work.updatedAt).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US');
    
    card.innerHTML = `
      <div class="work-card-title">${work.title || t('untitled')}</div>
      <div class="work-card-preview">${preview || '...'}</div>
      <div class="work-card-meta">
        ${(work.tags || []).slice(0, 3).map(t => `<span class="work-tag">#${t}</span>`).join('')}
      </div>
      <div class="work-card-footer">
        <span>${work.wordCount || 0} ${t('wordCount')}</span>
        <span>${modelName}</span>
        <div class="work-card-actions">
          <button class="work-icon-btn" onclick="event.stopPropagation();openWork('${work.id}')" title="Edit">✎</button>
          <button class="work-icon-btn delete" onclick="deleteWork('${work.id}', event)" title="Delete">🗑</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function showAddFolder() {
  document.getElementById('folderNameInput').value = '';
  document.getElementById('folderModal').classList.add('show');
  setTimeout(() => document.getElementById('folderNameInput').focus(), 100);
}

function hideFolderModal() {
  document.getElementById('folderModal').classList.remove('show');
}

function addFolder() {
  const name = document.getElementById('folderNameInput').value.trim();
  if (!name) return;
  
  if (!folders.includes(name)) {
    folders.push(name);
    if (!tagTranslations[name]) {
      tagTranslations[name] = name;
    }
    saveData();
    renderFolders();
    showToast(t('folderAdded').replace('{name}', name));
  }
  
  hideFolderModal();
}

// ===== TOAST =====
let toastTimeout = null;

function showToast(message) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  
  toast.textContent = message;
  toast.classList.add('show');
  
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

// ===== INIT =====
function init() {
  loadData();
  renderGallery('main-gallery');
  renderHistory();
  renderFolders();
  renderWorks();
}

// Close modals on overlay click
document.getElementById('folderModal').addEventListener('click', function(e) {
  if (e.target === this) hideFolderModal();
});

document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) hideDeleteModal();
});

document.getElementById('deleteFolderModal').addEventListener('click', function(e) {
  if (e.target === this) hideDeleteFolderModal();
});

document.getElementById('modelSelector').addEventListener('click', function(e) {
  if (e.target === this) hideModelSelector();
});

// Enter key in folder input
document.getElementById('folderNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addFolder();
});

// Initialize
init();
</script>
