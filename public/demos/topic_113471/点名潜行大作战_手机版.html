<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点名潜行大作战 手机版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", "SimSun", monospace;
      image-rendering: pixelated;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: #2b1a0b;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.08) 25%, transparent 25%) 0 0 / 18px 18px,
        linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.08) 75%) 0 0 / 18px 18px,
        #8f5526;
    }

    .game {
      width: min(1180px, 98vw);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
    }

    .classroom {
      position: relative;
      height: 680px;
      border: 8px solid #5a3217;
      border-radius: 0;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(90, 50, 23, 0.16) 0 4px, transparent 4px 72px),
        repeating-linear-gradient(90deg, rgba(90, 50, 23, 0.16) 0 4px, transparent 4px 72px),
        repeating-linear-gradient(0deg, #d8924f 0 18px, #c77b3c 18px 36px);
      box-shadow: 12px 12px 0 #3e210d;
    }

    .front-wall {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 150px;
      background: repeating-linear-gradient(90deg, #efc979 0 26px, #e1b363 26px 52px);
      border-bottom: 6px solid #7d471f;
    }

    .blackboard {
      position: absolute;
      left: 50%;
      top: 22px;
      width: 390px;
      height: 76px;
      transform: translateX(-50%);
      border: 7px solid #7c471f;
      border-radius: 0;
      background: #1f6b48;
      color: #edf6d7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.18), 6px 6px 0 #4b2b13;
    }

    .podium {
      position: absolute;
      left: 50%;
      top: 210px;
      width: 230px;
      height: 88px;
      transform: translateX(-50%);
      border: 6px solid #4e2812;
      border-radius: 0;
      background:
        linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,0.12) 18px 28px, transparent 28px 100%),
        #9b5728;
      color: #fff4cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      z-index: 4;
      box-shadow: 8px 8px 0 #4b260f;
    }

    .teacher {
      position: absolute;
      left: 50%;
      top: 112px;
      transform: translateX(-50%);
      width: 86px;
      height: 86px;
      border: 6px solid #4e2812;
      border-radius: 0;
      background: #8052d7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      z-index: 5;
      box-shadow: inset -10px -10px 0 rgba(0, 0, 0, 0.18), 7px 7px 0 #4b260f;
      transition: transform 0.2s ease;
    }

    .teacher.calling {
      transform: translateX(-50%) scale(1.12);
      animation: teacherShake 0.16s linear infinite;
    }

    .teacher::after {
      content: "老师";
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 9px;
      border: 3px solid #4e2812;
      border-radius: 0;
      background: #fff2c3;
      color: #4e2812;
      font-size: 13px;
      white-space: nowrap;
    }

    .window {
      position: absolute;
      width: 32px;
      height: 118px;
      border: 5px solid #6e3e1d;
      border-radius: 0;
      background: repeating-linear-gradient(0deg, #9de8ff 0 18px, #62b5e4 18px 36px);
      z-index: 6;
    }

    .window.left {
      left: -7px;
    }

    .window.right {
      right: -7px;
    }

    .window.top-one {
      top: 215px;
    }

    .window.top-two {
      top: 430px;
    }

    .window::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.55);
      transform: translateX(-50%);
    }

    .director-head {
      position: absolute;
      width: 62px;
      height: 62px;
      border: 5px solid #4e2812;
      border-radius: 0;
      background: #ffd0a1;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.2s ease;
      box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.14), 6px 6px 0 #4b260f;
    }

    .director-head::before,
    .director-head::after {
      content: "";
      position: absolute;
      top: 25px;
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: #241006;
    }

    .director-head::before {
      left: 17px;
    }

    .director-head::after {
      right: 17px;
    }

    .director-head.show {
      opacity: 1;
      animation: directorPeek 0.36s ease infinite alternate;
    }

    .director-shadow {
      position: absolute;
      width: 62px;
      height: 92px;
      border: 6px solid #ffdf3c;
      border-radius: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.2) 0 12px, transparent 12px 100%),
        repeating-linear-gradient(0deg, #16100d 0 14px, #3a2418 14px 28px);
      z-index: 11;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 0 5px #c62418, 8px 8px 0 rgba(0, 0, 0, 0.45);
    }

    .director-shadow.show {
      opacity: 0.96;
      animation: shadowWarn 0.18s steps(2, end) infinite alternate;
    }

    .seat-grid {
      position: absolute;
      left: 50%;
      top: 318px;
      width: 570px;
      height: 300px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 24px 40px;
      z-index: 4;
    }

    .desk {
      position: relative;
      border: 5px solid #4e2812;
      border-radius: 0;
      background:
        linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,0.12) 18px 26px, transparent 26px 100%),
        #9a592b;
      box-shadow: 6px 6px 0 #4b260f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student {
      width: 62px;
      height: 62px;
      border: 5px solid #4e2812;
      border-radius: 0;
      background: #3ba7ff;
      box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.14);
      position: relative;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .student::before,
    .student::after {
      content: "";
      position: absolute;
      top: 25px;
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: #241006;
    }

    .student::before {
      left: 15px;
    }

    .student::after {
      right: 15px;
    }

    .student.player {
      outline: 6px solid #ffe257;
      outline-offset: 4px;
    }

    .student.monitor {
      outline: 6px solid #ef3769;
      outline-offset: 4px;
    }

    .student.player.monitor {
      outline: 6px solid #fff;
    }

    .student.reading {
      transform: translateY(12px) scale(0.92);
      background: #3ba7ff;
    }

    .student.note {
      transform: rotate(12deg) scale(1.03);
      background: #3ba7ff;
    }

    .student.listen {
      transform: translateY(-8px) scale(1.08);
      background: #3ba7ff;
    }

    .student.called {
      outline: 6px solid #ffffff;
      outline-offset: 4px;
      background: #69c7ff;
    }

    .tag {
      position: absolute;
      left: 50%;
      bottom: -26px;
      transform: translateX(-50%);
      padding: 3px 9px;
      border: 3px solid #4e2812;
      border-radius: 0;
      background: #fff6d8;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tag.player-tag {
      background: #ffe257;
    }

    .tag.monitor-tag {
      background: #ff7aa1;
    }

    .monitor-reporting .student.monitor {
      animation: reportWave 0.28s ease infinite alternate;
    }

    .suspicion-mark {
      position: absolute;
      left: 50%;
      top: -58px;
      transform: translateX(-50%);
      min-width: 46px;
      height: 46px;
      border: 5px solid #4e2812;
      background: #fff2c3;
      color: #4e2812;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      z-index: 9;
      box-shadow: 6px 6px 0 #4b260f;
    }

    .suspicion-mark.question {
      display: flex;
      background: #fff06a;
      animation: questionBounce 0.34s steps(2, end) infinite alternate;
    }

    .suspicion-mark.exclaim {
      display: flex;
      background: #ff4d4d;
      color: #fff7de;
      animation: exclaimShake 0.16s steps(2, end) infinite alternate;
    }

    .call-mark {
      position: absolute;
      left: 50%;
      top: -46px;
      transform: translateX(-50%);
      min-width: 58px;
      height: 34px;
      border: 4px solid #4e2812;
      background: #ffffff;
      color: #b71919;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      z-index: 10;
      box-shadow: 5px 5px 0 #4b260f;
    }

    .call-mark.show {
      display: flex;
      animation: callPop 0.28s steps(2, end) infinite alternate;
    }

    .speech {
      position: absolute;
      left: 50%;
      top: 246px;
      transform: translateX(-50%);
      min-width: 370px;
      max-width: 560px;
      padding: 13px 18px;
      border: 5px solid #4e2812;
      border-radius: 0;
      background: rgba(255, 251, 232, 0.96);
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      z-index: 20;
      box-shadow: 7px 7px 0 #4b260f;
    }

    .speech.alert {
      color: #b71919;
    }

    .speech.safe {
      color: #197a3d;
    }

    .hud {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      border: 7px solid #5a3217;
      border-radius: 0;
      background: rgba(255, 248, 222, 0.96);
      box-shadow: 12px 12px 0 #3e210d;
    }

    .hud h2 {
      font-size: 27px;
      color: #5a3217;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      padding: 12px;
      border: 4px solid #7a471f;
      border-radius: 0;
      background: #fff0bd;
      text-align: center;
    }

    .stat span {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
      opacity: 0.72;
    }

    .stat strong {
      font-size: 30px;
      color: #a54419;
    }

    .danger {
      padding: 13px;
      border: 4px solid #7a471f;
      border-radius: 0;
      background: #fff0bd;
    }

    .danger-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 900;
    }

    .danger-bar {
      height: 24px;
      border: 4px solid #5a3217;
      border-radius: 0;
      background: #ead49d;
      overflow: hidden;
    }

    .danger-fill {
      width: 0;
      height: 100%;
      background: repeating-linear-gradient(90deg, #2dac58 0 18px, #ffd447 18px 36px, #d42828 36px 54px);
      transition: width 0.2s ease;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 0;
      padding: 13px 14px;
      background: #5a3217;
      color: #fff7de;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      box-shadow: 0 6px 0 #301708;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }

    button:hover {
      background: #7c451f;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #301708;
    }

    button.primary {
      background: #1e8a4a;
      box-shadow: 0 6px 0 #0d4d28;
    }

    .tip,
    .log {
      padding: 12px 13px;
      border-radius: 0;
      line-height: 1.65;
      font-size: 14px;
      background: #f6dfaa;
    }

    .tip {
      border-left: 6px solid #d17d1f;
      background: #fff7dc;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(45, 22, 8, 0.72);
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: min(590px, 94%);
      padding: 28px;
      border: 8px solid #4e2812;
      border-radius: 0;
      background: #fff5d6;
      text-align: center;
      box-shadow: 12px 12px 0 #3e210d;
    }

    .panel h1,
    .panel h2 {
      margin-bottom: 12px;
      color: #8d3d17;
      font-size: 34px;
    }

    .panel p {
      margin-bottom: 18px;
      line-height: 1.8;
      font-size: 16px;
    }

    @keyframes callPop {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-6px); }
    }

    @keyframes directorPeek {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(var(--peek-x), 0) scale(1.04); }
    }

    @keyframes shadowWarn {
      from { transform: translate(0, 0); }
      to { transform: translate(var(--peek-x), 0); }
    }

    @keyframes reportWave {
      from { transform: rotate(-8deg) scale(1.02); }
      to { transform: rotate(8deg) scale(1.1); }
    }

    @keyframes questionBounce {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-6px); }
    }

    @keyframes exclaimShake {
      from { transform: translateX(-50%) translateX(-5px); }
      to { transform: translateX(-50%) translateX(5px); }
    }

    @media (max-width: 940px) {
      .game {
        grid-template-columns: 1fr;
      }

      .classroom {
        height: 650px;
      }

      .seat-grid {
        width: 72%;
        gap: 22px;
      }
    }

    @media (max-width: 700px) {
      body {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 8px;
        overflow-x: hidden;
      }

      .game {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .classroom {
        height: 540px;
        border-width: 5px;
        box-shadow: 7px 7px 0 #3e210d;
      }

      .front-wall {
        height: 105px;
        border-bottom-width: 4px;
      }

      .blackboard {
        top: 12px;
        width: 220px;
        height: 48px;
        border-width: 4px;
        font-size: 20px;
        box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.18), 4px 4px 0 #4b2b13;
      }

      .teacher {
        top: 74px;
        width: 54px;
        height: 54px;
        border-width: 4px;
        font-size: 12px;
        box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.18), 4px 4px 0 #4b260f;
      }

      .teacher::after {
        bottom: -24px;
        font-size: 11px;
        border-width: 2px;
        padding: 2px 6px;
      }

      .podium {
        top: 145px;
        width: 150px;
        height: 56px;
        border-width: 4px;
        font-size: 15px;
        box-shadow: 5px 5px 0 #4b260f;
      }

      .window {
        width: 24px;
        height: 82px;
        border-width: 4px;
      }

      .window.left {
        left: -5px;
      }

      .window.right {
        right: -5px;
      }

      .window.top-one {
        top: 185px;
      }

      .window.top-two {
        top: 335px;
      }

      .director-head {
        width: 48px;
        height: 48px;
        border-width: 4px;
        box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.14), 4px 4px 0 #4b260f;
      }

      .director-head::before,
      .director-head::after {
        top: 19px;
        width: 6px;
        height: 6px;
      }

      .director-head::before {
        left: 13px;
      }

      .director-head::after {
        right: 13px;
      }

      .director-shadow {
        width: 48px;
        height: 70px;
        border-width: 4px;
        box-shadow: 0 0 0 4px #c62418, 5px 5px 0 rgba(0, 0, 0, 0.45);
      }

      .speech {
        top: 208px;
        left: 50%;
        min-width: 0;
        width: calc(100% - 62px);
        padding: 9px 10px;
        border-width: 4px;
        font-size: 14px;
        line-height: 1.35;
        box-shadow: 5px 5px 0 #4b260f;
      }

      .seat-grid {
        top: 285px;
        width: calc(100% - 74px);
        height: 210px;
        gap: 18px 16px;
      }

      .desk {
        border-width: 4px;
        box-shadow: 4px 4px 0 #4b260f;
      }

      .student {
        width: 42px;
        height: 42px;
        border-width: 4px;
        box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.14);
      }

      .student::before,
      .student::after {
        top: 16px;
        width: 6px;
        height: 6px;
      }

      .student::before {
        left: 9px;
      }

      .student::after {
        right: 9px;
      }

      .student.player,
      .student.monitor {
        outline-width: 4px;
        outline-offset: 3px;
      }

      .tag {
        bottom: -22px;
        padding: 2px 6px;
        border-width: 2px;
        font-size: 11px;
      }

      .suspicion-mark {
        top: -50px;
        min-width: 40px;
        height: 40px;
        border-width: 4px;
        font-size: 30px;
        box-shadow: 5px 5px 0 #4b260f;
      }

      .call-mark {
        top: -38px;
        min-width: 46px;
        height: 28px;
        border-width: 3px;
        font-size: 12px;
        box-shadow: 4px 4px 0 #4b260f;
      }

      .hud {
        gap: 10px;
        padding: 10px;
        border-width: 5px;
        box-shadow: 7px 7px 0 #3e210d;
      }

      .hud h2 {
        display: none;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .danger {
        padding: 9px;
        border-width: 3px;
      }

      .danger-bar {
        height: 20px;
        border-width: 3px;
      }

      .stat {
        padding: 8px;
        border-width: 3px;
      }

      .stat span {
        font-size: 11px;
      }

      .stat strong {
        font-size: 22px;
      }

      .controls {
        position: sticky;
        bottom: 8px;
        z-index: 80;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      button {
        min-height: 54px;
        padding: 12px 10px;
        font-size: 18px;
      }

      .tip,
      .log {
        padding: 9px;
        font-size: 12px;
        line-height: 1.5;
      }

      .overlay {
        padding: 14px;
      }

      .panel {
        width: 100%;
        padding: 18px;
        border-width: 6px;
        box-shadow: 8px 8px 0 #3e210d;
      }

      .panel h1,
      .panel h2 {
        font-size: 25px;
      }

      .panel p {
        font-size: 14px;
        line-height: 1.65;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="classroom" id="classroom" aria-label="俯视图教室">
      <div class="front-wall">
        <div class="blackboard">黑板</div>
      </div>
      <div class="podium">讲台</div>
      <div class="teacher" id="teacher">点名</div>

      <div class="window left top-one" data-window="leftTop"></div>
      <div class="window left top-two" data-window="leftBottom"></div>
      <div class="window right top-one" data-window="rightTop"></div>
      <div class="window right top-two" data-window="rightBottom"></div>
      <div class="director-shadow" id="directorShadow" aria-label="窗外人影"></div>
      <div class="director-head" id="directorHead" aria-label="教导主任"></div>

      <div class="speech" id="speech">先看教程，再点击“开始上课”。</div>
      <div class="seat-grid" id="seatGrid"></div>

      <div class="overlay" id="overlay">
        <div class="panel">
          <h1>玩法教程</h1>
          <p>
            老师说“这道题谁会?”时，按 A 来防止老师点到你。
            窗户会出现教导主任的人影，半秒后会探头，按 S 来防止被教导主任抓包。
            班长头上出现问号时，按 D 来防止被班长举报。
            手机版中，A 对应“认真听讲”，S 对应“低头看书”，D 对应“假装记笔记”。
          </p>
          <button class="primary" id="startBtn">开始上课</button>
        </div>
      </div>
    </section>

    <aside class="hud">
      <h2>课堂状态</h2>
      <div class="stats">
        <div class="stat">
          <span>分数</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>剩余时间</span>
          <strong id="time">60</strong>
        </div>
        <div class="stat">
          <span>操作</span>
          <strong>触屏</strong>
        </div>
      </div>

      <div class="danger">
        <div class="danger-label">
          <span>被发现值</span>
          <span id="dangerText">0%</span>
        </div>
        <div class="danger-bar">
          <div class="danger-fill" id="dangerFill"></div>
        </div>
      </div>

      <div class="controls">
        <button id="listenBtn">认真听讲</button>
        <button id="readBtn">低头看书</button>
        <button id="noteBtn">假装记笔记</button>
      </div>

      <div class="tip">
        手机操作提示：看见老师点名点“认真听讲”；窗外有人影或主任探头点“低头看书”；班长出现问号点“假装记笔记”。
      </div>
      <div class="log" id="log">课堂还没开始，先观察教室布局。</div>
    </aside>
  </main>

  <script>
    const seatGrid = document.getElementById("seatGrid");
    const teacher = document.getElementById("teacher");
    const directorHead = document.getElementById("directorHead");
    const directorShadow = document.getElementById("directorShadow");
    const classroom = document.getElementById("classroom");
    const speech = document.getElementById("speech");
    const overlay = document.getElementById("overlay");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const dangerText = document.getElementById("dangerText");
    const dangerFill = document.getElementById("dangerFill");
    const logEl = document.getElementById("log");

    const windows = ["leftTop", "leftBottom", "rightTop", "rightBottom"];
    const events = [
      {
        type: "call",
        correct: "listen",
        text: "老师：这道题谁会？",
        success: "你被点到后立刻认真听讲，老师暂时放过你。",
        fail: "你的反应不自然，老师盯住了你。"
      },
      {
        type: "director",
        correct: "read",
        text: "教导主任从窗户探头检查，快降低存在感！",
        success: "你低头看书，主任扫了一眼就离开了。",
        fail: "主任发现你状态不对，危险值上升。"
      },
      {
        type: "monitor",
        correct: "note",
        text: "班长准备打小报告：老师，他好像没听课。",
        success: "你马上假装记笔记，班长的小报告失效。",
        fail: "班长举报成功，老师开始怀疑你。"
      }
    ];

    let score = 0;
    let danger = 0;
    let time = 60;
    let playerIndex = 0;
    let monitorIndex = 1;
    let currentEvent = null;
    let eventTimer = null;
    let directorWarnTimer = null;
    let callQuestionTimer = null;
    let countdownTimer = null;
    let running = false;
    let locked = false;

    function shuffle(list) {
      return list
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(item => item.value);
    }

    function renderSeats() {
      seatGrid.innerHTML = "";
      for (let i = 0; i < 9; i += 1) {
        const desk = document.createElement("div");
        desk.className = "desk";

        const student = document.createElement("div");
        student.className = "student";
        student.dataset.index = i;

        if (i === playerIndex) {
          student.classList.add("player");
          const tag = document.createElement("div");
          tag.className = "tag player-tag";
          tag.textContent = "玩家";
          desk.appendChild(tag);
        } else if (i === monitorIndex) {
          student.classList.add("monitor");
          const mark = document.createElement("div");
          mark.className = "suspicion-mark";
          mark.textContent = "?";
          desk.appendChild(mark);
          const tag = document.createElement("div");
          tag.className = "tag monitor-tag";
          tag.textContent = "班长";
          desk.appendChild(tag);
        }

        const callMark = document.createElement("div");
        callMark.className = "call-mark";
        callMark.textContent = "被点到";
        desk.appendChild(callMark);

        desk.appendChild(student);
        seatGrid.appendChild(desk);
      }
    }

    function randomizeRoles() {
      const positions = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]);
      playerIndex = positions[0];
      monitorIndex = positions[1];
      renderSeats();
    }

    function playerEl() {
      return document.querySelector(".student.player");
    }

    function monitorMarkEl() {
      return document.querySelector(".suspicion-mark");
    }

    function studentElByIndex(index) {
      return document.querySelector(`.student[data-index="${index}"]`);
    }

    function clearCallTargets() {
      document.querySelectorAll(".call-mark").forEach(mark => mark.classList.remove("show"));
      document.querySelectorAll(".student").forEach(student => student.classList.remove("called"));
    }

    function showCallTarget(index) {
      clearCallTargets();
      const student = studentElByIndex(index);
      if (!student) return;
      student.classList.add("called");
      const mark = student.parentElement.querySelector(".call-mark");
      if (mark) mark.classList.add("show");
    }

    function setSpeech(text, mode = "") {
      speech.textContent = text;
      speech.className = "speech";
      if (mode) speech.classList.add(mode);
    }

    function setLog(text) {
      logEl.textContent = text;
    }

    function updateHud() {
      scoreEl.textContent = score;
      timeEl.textContent = time;
      dangerText.textContent = `${danger}%`;
      dangerFill.style.width = `${danger}%`;
    }

    function clearEffects() {
      clearTimeout(directorWarnTimer);
      clearTimeout(callQuestionTimer);
      teacher.classList.remove("calling");
      directorHead.classList.remove("show");
      directorShadow.classList.remove("show");
      classroom.classList.remove("monitor-reporting");
      clearCallTargets();
      const mark = monitorMarkEl();
      if (mark) {
        mark.classList.remove("question", "exclaim");
        mark.textContent = "?";
      }
      document.querySelectorAll(".student").forEach(student => {
        student.classList.remove("listen", "reading", "note");
      });
    }

    function showMonitorQuestion() {
      const mark = monitorMarkEl();
      if (!mark) return;
      mark.textContent = "?";
      mark.classList.remove("exclaim");
      mark.classList.add("question");
      classroom.classList.remove("monitor-reporting");
    }

    function showMonitorExclaim() {
      const mark = monitorMarkEl();
      if (!mark) return;
      mark.textContent = "!";
      mark.classList.remove("question");
      mark.classList.add("exclaim");
      classroom.classList.add("monitor-reporting");
    }

    function getWindowPosition(windowName, widthOffset) {
      const win = document.querySelector(`[data-window="${windowName}"]`);
      const roomBox = classroom.getBoundingClientRect();
      const winBox = win.getBoundingClientRect();
      const isLeft = windowName.startsWith("left");
      const x = isLeft ? winBox.right - roomBox.left - 12 : winBox.left - roomBox.left - widthOffset;
      const y = winBox.top - roomBox.top + 28;

      return { x, y, isLeft };
    }

    function showDirectorShadow(windowName) {
      const { x, y, isLeft } = getWindowPosition(windowName, 42);
      directorShadow.style.left = `${x}px`;
      directorShadow.style.top = `${y - 7}px`;
      directorShadow.style.setProperty("--peek-x", isLeft ? "8px" : "-8px");
      directorShadow.classList.add("show");
    }

    function showDirector(windowName) {
      const { x, y, isLeft } = getWindowPosition(windowName, 50);
      directorShadow.classList.remove("show");
      directorHead.style.left = `${x}px`;
      directorHead.style.top = `${y}px`;
      directorHead.style.setProperty("--peek-x", isLeft ? "13px" : "-13px");
      directorHead.classList.add("show");
    }

    function showEventVisual(eventItem) {
      clearEffects();
      if (eventItem.type === "director") {
        const windowName = windows[Math.floor(Math.random() * windows.length)];
        showDirectorShadow(windowName);
        const names = {
          leftTop: "左侧前窗",
          leftBottom: "左侧后窗",
          rightTop: "右侧前窗",
          rightBottom: "右侧后窗"
        };
        setLog(`${names[windowName]}外出现可疑人影，半秒后主任会探头。`);
        directorWarnTimer = setTimeout(() => {
          if (!running || locked || !currentEvent || currentEvent.type !== "director") return;
          showDirector(windowName);
          setLog(`教导主任从${names[windowName]}探头进来，赶紧低头看书。`);
        }, 500);
      }

      if (eventItem.type === "monitor") {
        showMonitorQuestion();
        setLog("班长发现有同学不对劲，头上出现了问号。快假装记笔记。");
      }
    }

    function handleTeacherCall(eventItem) {
      clearEffects();
      clearTimeout(eventTimer);
      currentEvent = null;
      locked = true;
      setSpeech("老师：这道题谁会？", "alert");
      setLog("老师正在扫视全班，半秒后一定会点一位同学。");

      callQuestionTimer = setTimeout(() => {
        if (!running) return;

        const npcSeats = [0, 1, 2, 3, 4, 5, 6, 7, 8].filter(index => index !== playerIndex && index !== monitorIndex);
        const playerIsTarget = Math.random() < 0.55;
        const targetIndex = playerIsTarget
          ? playerIndex
          : npcSeats[Math.floor(Math.random() * npcSeats.length)];

        showCallTarget(targetIndex);

        if (!playerIsTarget) {
          score += 3;
          updateHud();
          setSpeech(`老师点到了第 ${targetIndex + 1} 号同学。`, "safe");
          setLog("还好这次不是你，NPC 同学被点到了。");
          setTimeout(() => {
            clearEffects();
            if (running) scheduleNext();
          }, 1050);
          return;
        }

        locked = false;
        currentEvent = { ...eventItem };
        setSpeech("老师点到了你，请马上认真听讲！", "alert");
        setLog("你被点到了，快点选择“认真听讲”。");

        eventTimer = setTimeout(() => {
          if (!running || locked) return;
          danger = Math.min(100, danger + 18);
          currentEvent = null;
          setSpeech("你被点到后没有及时反应，课堂危险值上升。", "alert");
          setLog("点名超时，危险值增加。");
          updateHud();
          checkEnd();
          setTimeout(() => {
            clearEffects();
            if (running) scheduleNext();
          }, 700);
        }, 2300);
      }, 500);
    }

    function scheduleNext() {
      if (!running) return;
      const delay = Math.max(760, 1750 - Math.floor(score / 40) * 140);
      setTimeout(nextEvent, delay);
    }

    function nextEvent() {
      if (!running) return;
      locked = false;
      currentEvent = events[Math.floor(Math.random() * events.length)];
      if (currentEvent.type === "call") {
        handleTeacherCall(currentEvent);
        return;
      }
      showEventVisual(currentEvent);
      setSpeech(currentEvent.text, "alert");
      if (currentEvent.type !== "director" && currentEvent.type !== "monitor") {
        setLog("快选择正确动作，反应太慢也会被发现。");
      }

      clearTimeout(eventTimer);
      eventTimer = setTimeout(() => {
        if (!running || locked) return;
        const timedOutEvent = currentEvent;
        danger = Math.min(100, danger + 18);
        currentEvent = null;
        if (timedOutEvent && timedOutEvent.type === "monitor") {
          showMonitorExclaim();
          setSpeech("你犹豫太久，班长的问号变成感叹号，开始向老师报告。", "alert");
          setLog("超时未应对，班长向老师报告，危险值增加。");
        } else {
          setSpeech("你犹豫太久，课堂危险值上升。", "alert");
          setLog("没有及时操作，危险值增加。");
        }
        updateHud();
        checkEnd();
        setTimeout(() => {
          clearEffects();
          if (running) scheduleNext();
        }, timedOutEvent && timedOutEvent.type === "monitor" ? 950 : 0);
      }, 2300);
    }

    function doAction(action) {
      if (!running || !currentEvent || locked) return;
      locked = true;
      clearTimeout(eventTimer);

      const p = playerEl();
      p.classList.remove("listen", "reading", "note");
      if (action === "listen") p.classList.add("listen");
      if (action === "read") p.classList.add("reading");
      if (action === "note") p.classList.add("note");

      const eventType = currentEvent.type;
      const isCorrect = action === currentEvent.correct;
      if (isCorrect) {
        score += 10;
        danger = Math.max(0, danger - 5);
        setSpeech(currentEvent.success, "safe");
        if (eventType === "monitor") {
          setLog("你及时假装记笔记，班长头上的问号消失了。");
        } else {
          setLog("应对成功，分数增加。");
        }
      } else {
        danger = Math.min(100, danger + 22);
        if (eventType === "monitor") {
          showMonitorExclaim();
        }
        setSpeech(currentEvent.fail, "alert");
        if (eventType === "monitor") {
          setLog("动作不对，班长头上的问号变成感叹号，并向老师报告。");
        } else {
          setLog("动作不对，危险值大幅增加。");
        }
      }

      currentEvent = null;
      updateHud();
      checkEnd();
      setTimeout(() => {
        clearEffects();
        if (running) scheduleNext();
      }, eventType === "monitor" && !isCorrect ? 950 : 700);
    }

    function getRank() {
      if (score >= 260) return "传说级课堂隐身术";
      if (score >= 180) return "高级潜行课代表";
      if (score >= 100) return "普通安全座位玩家";
      return "下次坐远一点选手";
    }

    function endGame(win) {
      running = false;
      clearTimeout(eventTimer);
      clearInterval(countdownTimer);
      clearEffects();
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        <div class="panel">
          <h2>${win ? "成功熬到下课" : "你被发现了"}</h2>
          <p>
            最终分数：${score} 分<br>
            课堂潜行等级：${getRank()}<br>
            ${win ? "下课铃响起，你从九宫格座位中安全撤离。" : "老师、主任和班长完成了三方锁定。"}
          </p>
          <button class="primary" onclick="location.reload()">再来一局</button>
        </div>
      `;
    }

    function checkEnd() {
      if (danger >= 100) {
        endGame(false);
      }
    }

    function startGame() {
      score = 0;
      danger = 0;
      time = 60;
      currentEvent = null;
      running = true;
      locked = false;
      randomizeRoles();
      overlay.classList.add("hidden");
      updateHud();
      clearEffects();
      setSpeech("上课开始，玩家和班长的位置已经随机生成。", "safe");
      setLog(`玩家在第 ${playerIndex + 1} 号座位，班长在第 ${monitorIndex + 1} 号座位。`);

      countdownTimer = setInterval(() => {
        if (!running) return;
        time -= 1;
        updateHud();
        if (time <= 0) endGame(true);
      }, 1000);

      setTimeout(nextEvent, 1200);
    }

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("listenBtn").addEventListener("click", () => doAction("listen"));
    document.getElementById("readBtn").addEventListener("click", () => doAction("read"));
    document.getElementById("noteBtn").addEventListener("click", () => doAction("note"));

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (key === "a") doAction("listen");
      if (key === "s") doAction("read");
      if (key === "d") doAction("note");
    });

    renderSeats();
  </script>
</body>
</html>
