<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字化社区运营小程序 - Demo</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --bg2: #fffaf1;
      --ink: #17201a;
      --muted: #6c7169;
      --rule: #d8d0c2;
      --accent: #2f6f55;
      --accent2: #b46a37;
      --soft: #e7efe6;
      --warn: #fff0da;
      --danger: #d9534f;
      --shadow: rgba(23, 32, 26, 0.08);
      --shadow-lg: rgba(23, 32, 26, 0.15);
      --radius: 18px;
      --radius-sm: 14px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e7efe6 0%, #f6f1e8 50%, #fff0da 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ========== Demo Header ========== */
    .demo-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .demo-header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .demo-header p { font-size: 14px; color: var(--muted); }
    .demo-header .role-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .role-btn {
      padding: 8px 20px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--bg2);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .role-btn:hover { background: var(--soft); transform: translateY(-1px); }
    .role-btn.active {
      background: var(--accent);
      color: var(--bg2);
      border-color: var(--accent);
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(47, 111, 85, 0.3);
    }

    /* ========== Demo Main ========== */
    .demo-main {
      display: flex;
      gap: 48px;
      align-items: flex-start;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ========== Phone ========== */
    .phone-wrapper { flex-shrink: 0; }
    .phone {
      width: 375px;
      height: 750px;
      background: #1a1a1a;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 30px 80px rgba(23, 32, 26, 0.25), 0 10px 30px rgba(23, 32, 26, 0.15);
      position: relative;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 0 0 20px 20px;
      z-index: 100;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-status-bar {
      height: 44px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 0 32px;
      color: var(--bg2);
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .phone-nav-bar {
      height: 44px;
      background: var(--accent);
      color: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 600;
      position: relative;
      flex-shrink: 0;
    }
    .nav-back {
      position: absolute;
      left: 16px;
      font-size: 20px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }
    .nav-back.show { opacity: 1; pointer-events: auto; }
    .nav-back:active { transform: scale(0.9); }

    /* ========== Page Container ========== */
    .page-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .page-container::-webkit-scrollbar { display: none; }

    .page {
      padding: 16px;
      padding-bottom: 24px;
      min-height: 100%;
      box-sizing: border-box;
      background: var(--bg);
      animation: pageSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pageSlideIn {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ========== Tab Bar ========== */
    .tab-bar {
      height: 70px;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      display: flex;
      flex-shrink: 0;
      z-index: 50;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      font-size: 11px;
    }
    .tab-item:active { transform: scale(0.95); }
    .tab-item.active { color: var(--accent); }
    .tab-item .tab-icon { font-size: 22px; line-height: 1; transition: var(--transition); }
    .tab-item.active .tab-icon { transform: translateY(-2px); }
    .tab-item .tab-text { font-size: 11px; line-height: 1; }

    /* ========== Card ========== */
    .card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 6px 18px var(--shadow);
      margin-bottom: 16px;
      transition: var(--transition);
      position: relative;
    }
    .card-clickable { cursor: pointer; }
    .card-clickable:hover { box-shadow: 0 10px 28px var(--shadow-lg); border-color: var(--accent); }
    .card-clickable:active { transform: scale(0.98); }

    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }

    /* ========== Tag ========== */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--soft);
      color: var(--accent);
      margin-right: 8px;
    }
    .tag-warn { background: var(--warn); color: var(--accent2); }
    .tag-muted { background: #eee; color: var(--muted); }
    .tag-danger { background: #fde8e8; color: var(--danger); }
    .tag-success { background: #e8f5e9; color: #2e7d32; }

    /* ========== Mini Card ========== */
    .mini-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .mini-card:hover { box-shadow: 0 4px 14px var(--shadow); }
    .mini-card:active { transform: scale(0.98); }
    .mini-card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .mini-card-desc { font-size: 12px; color: var(--muted); }

    /* ========== Button ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 12px;
      border: 1px solid var(--rule);
      background: var(--bg2);
      color: var(--accent);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: var(--bg2); border-color: var(--accent); }
    .btn-block { width: 100%; display: flex; }

    .button-row { display: flex; gap: 10px; margin-top: 12px; }
    .button-row .btn { flex: 1; height: 32px; font-size: 12px; padding: 0; }

    /* ========== Typography ========== */
    .muted { color: var(--muted); font-size: 12px; }
    .text-accent { color: var(--accent); }
    .text-danger { color: var(--danger); }
    .text-warn { color: var(--accent2); }
    .row-between { display: flex; justify-content: space-between; align-items: center; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 14px;
    }
    .section-header span:first-child { font-size: 16px; font-weight: 700; }
    .section-header span:last-child { font-size: 12px; color: var(--accent); cursor: pointer; }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* ========== Hero ========== */
    .hero {
      background: linear-gradient(135deg, #fffaf1, #e7efe6);
      padding: 32px 24px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      margin: -16px -16px 20px;
    }
    .hero.dark { background: linear-gradient(135deg, #2f6f55, #3d8b6b); color: #fffaf1; }
    .hero.orange { background: linear-gradient(135deg, #b46a37, #cc8855); color: #fffaf1; }
    .hero-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .hero-subtitle { font-size: 13px; opacity: 0.8; margin-top: 6px; }

    .stats-row { display: flex; gap: 12px; margin-top: 20px; }
    .stat-item {
      flex: 1;
      background: rgba(255, 250, 241, 0.15);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      transition: var(--transition);
    }
    .stat-item:hover { background: rgba(255, 250, 241, 0.25); }
    .stat-num { font-size: 24px; font-weight: 700; line-height: 1; color: var(--bg2); }
    .stat-num.warn { color: #ffd700; }
    .stat-label { font-size: 11px; opacity: 0.85; margin-top: 6px; color: var(--bg2); }

    .hero .community-name { font-size: 24px; font-weight: 700; color: var(--ink); }
    .hero .building-info { font-size: 14px; color: var(--muted); margin-top: 6px; }

    /* ========== Entry Grid ========== */
    .entry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 20px 10px;
      box-shadow: 0 6px 18px var(--shadow);
      margin-bottom: 16px;
    }
    .entry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .entry-icon {
      width: 48px;
      height: 48px;
      background: var(--soft);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: var(--transition);
    }
    .entry-icon.warn { background: var(--warn); }
    .entry-item:hover .entry-icon { transform: translateY(-3px) scale(1.05); }
    .entry-item:active .entry-icon { transform: scale(0.92); }
    .entry-text { font-size: 12px; color: var(--ink); }

    /* ========== Page Tabs ========== */
    .page-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg2);
      padding: 10px 16px;
      border-bottom: 1px solid var(--rule);
      overflow-x: auto;
      margin: -16px -16px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      scrollbar-width: none;
    }
    .page-tabs::-webkit-scrollbar { display: none; }
    .page-tab {
      padding: 6px 16px;
      font-size: 13px;
      color: var(--muted);
      border-radius: 999px;
      background: var(--bg);
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .page-tab:hover { background: var(--soft); }
    .page-tab.active { background: var(--accent); color: var(--bg2); font-weight: 500; }

    /* ========== Timeline ========== */
    .timeline { position: relative; padding-left: 24px; }
    .timeline-item { position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -18px;
      top: 4px;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid var(--soft);
    }
    .timeline-time { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .timeline-text { font-size: 13px; line-height: 1.5; }
    .timeline-operator { font-size: 11px; color: var(--accent); margin-top: 4px; }

    /* ========== Vote ========== */
    .vote-progress-card {
      background: linear-gradient(135deg, #e7efe6, #fffaf1);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .vote-option {
      display: flex;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    .vote-option:hover { border-color: var(--accent); }
    .vote-option.selected { border-color: var(--accent); background: var(--soft); }
    .option-radio {
      width: 20px; height: 20px;
      border: 2px solid var(--rule);
      border-radius: 50%;
      margin-right: 14px;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .vote-option.selected .option-radio {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: inset 0 0 0 4px #fffaf1;
    }
    .option-content { flex: 1; }
    .option-label { font-size: 14px; font-weight: 500; }
    .option-result { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ========== Profile ========== */
    .profile-header {
      background: linear-gradient(135deg, #2f6f55, #3d8b6b);
      padding: 32px 24px 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: -16px -16px 24px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }
    .avatar {
      width: 64px; height: 64px;
      background: rgba(255, 250, 241, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .user-info { flex: 1; color: #fffaf1; }
    .user-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .role-tag {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 250, 241, 0.2);
      border-radius: 6px;
      font-size: 11px;
    }

    .menu-group { margin-top: 20px; }
    .menu-group-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; padding: 0 6px; }
    .menu-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg); }
    .menu-item:active { background: var(--soft); }
    .menu-left { display: flex; align-items: center; gap: 12px; }
    .menu-icon { font-size: 18px; }
    .menu-label { font-size: 14px; color: var(--ink); }
    .menu-arrow { font-size: 12px; color: var(--muted); }

    /* ========== Modal ========== */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(23, 32, 26, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal.show { opacity: 1; visibility: visible; }
    .modal-content {
      width: 80%;
      background: var(--bg2);
      border-radius: 20px;
      padding: 24px 20px;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal.show .modal-content { transform: scale(1); }
    .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; }

    /* ========== Progress Bar ========== */
    .progress-bar {
      height: 10px;
      background: var(--rule);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #3d8b6b);
      border-radius: 5px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

    /* ========== QR Code ========== */
    .qr-code-box {
      padding: 24px;
      background: var(--bg2);
      border: 2px solid var(--rule);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }
    .qr-code-placeholder {
      width: 180px;
      height: 180px;
      background:
        linear-gradient(45deg, var(--ink) 25%, transparent 25%),
        linear-gradient(-45deg, var(--ink) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--ink) 75%),
        linear-gradient(-45deg, transparent 75%, var(--ink) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: qrPulse 2s ease-in-out infinite;
    }
    @keyframes qrPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .qr-code-placeholder::after {
      content: '📱';
      font-size: 40px;
      background: var(--bg2);
      padding: 10px;
      border-radius: 8px;
    }
    .qr-countdown {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent2);
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
    }
    .qr-tip { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* ========== Amount ========== */
    .bill-amount { font-size: 24px; font-weight: 700; color: var(--accent2); }

    /* ========== Meeting ========== */
    .meeting-card { background: linear-gradient(135deg, #fffaf1, #e7efe6); }
    .meeting-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--warn);
      color: var(--accent2);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--accent2);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* ========== Sticky Bottom Bar ========== */
    .sticky-bottom {
      position: sticky;
      bottom: 0;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      padding: 12px 16px;
      margin: 0 -16px -24px;
      display: flex;
      gap: 12px;
      box-shadow: 0 -4px 20px var(--shadow);
      z-index: 10;
    }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(23, 32, 26, 0.85);
      color: var(--bg2);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ========== Side Panel ========== */
    .side-panel { flex: 1; min-width: 300px; max-width: 400px; }
    .panel-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px var(--shadow);
      margin-bottom: 20px;
    }
    .panel-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .panel-card p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
    .feature-list { list-style: none; padding: 0; }
    .feature-list li {
      padding: 8px 0;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-list li::before { content: '\2713'; color: var(--accent); font-weight: 700; }
    .version-info { text-align: center; font-size: 11px; color: var(--muted); margin-top: 28px; }

    /* ========== Card Fade In ========== */
    .fade-in { animation: fadeInUp 0.4s ease-out backwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>数字化社区运营小程序</h1>
    <p>业委会视角 · 业主 / 业委会 / 物业 三端协同</p>
    <div class="role-switcher">
      <button class="role-btn active" data-role="owner" onclick="switchRole('owner')">👤 业主</button>
      <button class="role-btn" data-role="committee" onclick="switchRole('committee')">🏛️ 业委会</button>

      toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);

    // ========== Navigation ==========
    function switchRole(role) {
      if (currentRole === role) return;
      currentRole = role;
      if (qrCountdownTimer) { clearInterval(qrCountdownTimer); qrCountdownTimer = null; }
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
      pageStack = [];
      const homePage = tabConfigs[role][0].page;
      navigateTo(homePage, true);
    }

    function navigateTo(pageName, replace = false) {
      if (isNavigating) return;
      isNavigating = true;
      setTimeout(() => { isNavigating = false; }, 200);

      const container = document.getElementById('page-container');

      if (replace) {
        container.innerHTML = '';
        pageStack = [];
      }

      const pageEl = document.createElement('div');
      pageEl.className = 'page';
      pageEl.dataset.page = pageName;
      pageEl.dataset.uid = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
      pageEl.innerHTML = renderPage(pageName);
      container.appendChild(pageEl);

      // 隐藏前一页
      if (pageStack.length > 0) {
        const prevUid = pageStack[pageStack.length - 1].uid;
        const prevPage = container.querySelector(`.page[data-uid="${prevUid}"]`);
        if (prevPage) {
          prevPage.style.display = 'none';
        }
      }

      pageStack.push({ page: pageName, uid: pageEl.dataset.uid });

      updateNavBar();
      container.scrollTop = 0;
    }

    function goBack() {
      if (pageStack.length <= 1) return;

      const current = pageStack.pop();
      const currentPage = document.querySelector(`.page[data-uid="${current.uid}"]`);

      if (currentPage) {
        currentPage.style.animation = 'pageSlideIn 0.2s reverse';
        setTimeout(() => currentPage.remove(), 200);
      }

      const prev = pageStack[pageStack.length - 1];
      const prevPage = document.querySelector(`.page[data-uid="${prev.uid}"]`);
      if (prevPage) {
        prevPage.style.display = '';
      }

      updateNavBar();
    }

    function updateNavBar() {
      const current = pageStack[pageStack.length - 1];
      if (!current) return;
      const pageName = current.page;
      document.getElementById('nav-title').textContent = pageTitles[pageName] || '';
      document.getElementById('nav-back').classList.toggle('show', pageStack.length > 1);

      const tabs = tabConfigs[currentRole];
      const isTabPage = tabs.some(t => t.page === pageName);
      document.getElementById('tab-bar').style.display = isTabPage ? 'flex' : 'none';

      renderTabBar();
    }

    function switchTab(pageName) {
      const tabs = tabConfigs[currentRole];
      if (!tabs.some(t => t.page === pageName)) return;
      navigateTo(pageName, true);
    }

    function renderTabBar() {
      const tabBar = document.getElementById('tab-bar');
      const tabs = tabConfigs[currentRole];
      const current = pageStack[pageStack.length - 1];
      const currentPage = current ? current.page : '';

      tabBar.innerHTML = tabs.map(tab => `
        <div class="tab-item ${currentPage === tab.page ? 'active' : ''}" onclick="switchTab('${tab.page}')">
          <div class="tab-icon">${tab.icon}</div>
          <div class="tab-text">${tab.text}</div>
        </div>
      `).join('');
    }

      el.textContent = count;
      el.style.color = 'var(--accent2)';
      showToast('二维码已生成');
      qrCountdownTimer = setInterval(() => {
        count--;
        if (el) el.textContent = count;

          if (el) { el.textContent = '已失效'; el.style.color = 'var(--muted)'; }

    // ========== Execute Tasks Tab Switch ==========
    function switchExecuteTab(el, tab) {
      el.parentElement.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.execute-task-card').forEach(card => {
        if (tab === 'all') {
          card.style.display = '';
        } else {
          card.style.display = card.dataset.status === tab ? '' : 'none';
        }
      });
      document.getElementById('page-container').scrollTop = 0;
    }

    // ========== Confirm Vote ==========
    function confirmVote(voteId, voteTitle) {
      const selected = document.querySelector(`input[name="vote-${voteId}"]:checked`);
      if (!selected) { showToast('请选择投票选项'); return; }
      const option = selected.value || selected.parentElement.querySelector('span').textContent;
      wx_showModal('投票确认', `确认对「${voteTitle}」投「${option}」吗？`, () => {
        showToast('投票成功！感谢您的参与');
        const panel = document.getElementById('meeting-step-4');
        if (panel) {
          setTimeout(() => {
            renderCurrentPage();
          }, 300);
        }
      });
    }

    // ========== Suggestion Oversight Tab Switch ==========
    function switchSuggestionTab(el, tab) {
      el.parentElement.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.suggestion-card').forEach(card => {
        if (tab === 'all') {
          card.style.display = '';
        } else {
          card.style.display = card.dataset.status === tab ? '' : 'none';
        }
      });
      document.getElementById('page-container').scrollTop = 0;
    }

    // ========== Repair Oversight Tab Switch ==========
    function switchRepairOversightTab(el, tab) {
      el.parentElement.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

    // ========== Visitor Mgmt Tab Switch ==========
    function switchVisitorMgmtTab(el, tab) {
      el.parentElement.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['register', 'active', 'block', 'history'].forEach(t => {
        const panel = document.getElementById('vmgmt-tab-' + t);
        if (panel) panel.style.display = t === tab ? '' : 'none';
      });
      document.getElementById('page-container').scrollTop = 0;
    }

    // ========== Visitor Registration Helpers ==========
    function selectVmPurpose(el) {
      el.parentElement.querySelectorAll('.vm-purpose').forEach(p => {
        p.style.background = 'var(--bg)';
        p.style.color = 'var(--ink)';
        p.style.borderColor = 'var(--rule)';
      });
      el.style.background = 'var(--accent)';
      el.style.color = 'var(--bg2)';
      el.style.borderColor = 'var(--accent)';
    }

    function selectVmGate(el) {
      el.parentElement.querySelectorAll('.vm-gate').forEach(g => {
        g.style.background = 'var(--bg)';
        g.style.color = 'var(--ink)';
        g.style.borderColor = 'var(--rule)';
      });
      el.style.background = 'var(--accent)';
      el.style.color = 'var(--bg2)';
      el.style.borderColor = 'var(--accent)';
    }

    function submitVmReg() {
      const plate = document.getElementById('vm-plate');
      const phone = document.getElementById('vm-phone');
      const unit = document.getElementById('vm-unit');
      if (!plate.value.trim()) { showToast('请输入车牌号'); plate.focus(); return; }
      if (!phone.value.trim()) { showToast('请输入联系电话'); phone.focus(); return; }
      if (!/^1\d{10}$/.test(phone.value.trim())) { showToast('请输入正确的手机号'); phone.focus(); return; }
      if (!unit.value.trim()) { showToast('请输入到访门牌号'); unit.focus(); return; }
      showToast('代为登记成功！车辆已加入道闸放行白名单');
      plate.value = '';
      phone.value = '';
      unit.value = '';
    }

    function switchVisitorTab(el, tab) {
      el.parentElement.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['register', 'active', 'block', 'history'].forEach(t => {
        const panel = document.getElementById('visitor-tab-' + t);
        if (panel) panel.style.display = t === tab ? '' : 'none';
      });
      document.getElementById('page-container').scrollTop = 0;
    }

    function selectPurpose(el) {
      el.parentElement.querySelectorAll('.visitor-purpose').forEach(p => {
        p.style.background = 'var(--bg)';
        p.style.color = 'var(--ink)';
        p.style.borderColor = 'var(--rule)';
      });
      el.style.background = 'var(--accent)';
      el.style.color = 'var(--bg2)';
      el.style.borderColor = 'var(--accent)';
    }

    function selectGate(el) {
      el.parentElement.querySelectorAll('.visitor-gate').forEach(g => {
        g.style.background = 'var(--bg)';
        g.style.color = 'var(--ink)';
        g.style.borderColor = 'var(--rule)';
      });
      el.style.background = 'var(--accent)';
      el.style.color = 'var(--bg2)';
      el.style.borderColor = 'var(--accent)';
    }

    function submitVisitorReg() {
      const plate = document.getElementById('v-plate');
      const phone = document.getElementById('v-phone');
      if (!plate.value.trim()) { showToast('请输入车牌号'); plate.focus(); return; }
      if (!phone.value.trim()) { showToast('请输入联系电话'); phone.focus(); return; }
      if (!/^1\d{10}$/.test(phone.value.trim())) { showToast('请输入正确的手机号'); phone.focus(); return; }
      showToast('登记成功！车辆已加入道闸放行白名单');
      plate.value = '';
      phone.value = '';
    }

    // ========== Init ==========
    function init() {
      navigateTo('owner-home', true);
      updateTime();
      timeUpdateTimer = setInterval(updateTime, 60000);
    }

    function updateTime() {
      const now = new Date();
      document.getElementById('status-time').textContent = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (qrCountdownTimer) clearInterval(qrCountdownTimer);
      if (timeUpdateTimer) clearInterval(timeUpdateTimer);
    });

    // Expose globally
    window.switchRole = switchRole;
    window.navigateTo = navigateTo;
    window.goBack = goBack;
    window.switchTab = switchTab;
    window.openVoteModal = openVoteModal;
    window.closeVoteModal = closeVoteModal;
    window.selectVoteOption = selectVoteOption;
    window.submitVote = submitVote;
    window.showToast = showToast;
    window.addUploadImage = addUploadImage;
    window.removeUploadImage = removeUploadImage;
    window.submitRepair = submitRepair;
    window.switchSubmitTab = switchSubmitTab;
    window.selectRepairType = selectRepairType;
    window.selectUrgency = selectUrgency;
    window.selectSugCategory = selectSugCategory;
    window.selectSugArea = selectSugArea;

    window.removeSugUploadImage = removeSugUploadImage;
    window.submitSuggestion = submitSuggestion;
    window.startQRCountdown = startQRCountdown;
    window.selectDoor = selectDoor;
    window.switchVisitorMgmtTab = switchVisitorMgmtTab;
    window.switchRepairOversightTab = switchRepairOversightTab;
    window.switchSuggestionTab = switchSuggestionTab;
    window.toggleMeetingStep = toggleMeetingStep;
    window.confirmVote = confirmVote;
    window.wx_showModal = wx_showModal;
    window.closeConfirmModal = closeConfirmModal;
    window.switchVisitorTab = switchVisitorTab;
    window.selectPurpose = selectPurpose;
    window.selectGate = selectGate;
    window.submitVisitorReg = submitVisitorReg;
    window.selectVmPurpose = selectVmPurpose;
    window.selectVmGate = selectVmGate;
    window.submitVmReg = submitVmReg;
    window.showRejectModal = showRejectModal;
    window.closeRejectModal = closeRejectModal;
    window.submitReject = submitReject;
    window.acceptSuggestion = acceptSuggestion;
    window.switchCollectTab = switchCollectTab;
    window.showCollectForm = showCollectForm;
    window.switchAnnFormTab = switchAnnFormTab;
    window.showPublishForm = showPublishForm;
    window.switchExecuteTab = switchExecuteTab;

    document.addEventListener('DOMContentLoaded', init);
  </script>
