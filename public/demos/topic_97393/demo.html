      .demo-label { display: none; }
      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
      .phone::before { display: none; }
      .status-bar { padding-top: 0.5rem; height: 40px; }
    }
  </style>
</head>
<body>

  <div class="phone">

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="clock">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="app-title">善意坐标</div>
      <div class="header-icon" id="reportBtn" title="本周温暖报告">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v6m0 0l3-3m-3 3L9 5"/>
          <path d="M3 12c0-1 .5-2 2-2h14c1.5 0 2 1 2 2v6c0 1-.5 2-2 2H5c-1.5 0-2-1-2-2v-6z"/>
          <path d="M8 16h.01M12 16h.01M16 16h.01"/>
        </svg>
      </div>
    </div>

    <!-- Views -->
    <div class="views">

      <!-- ===== TIMELINE VIEW ===== -->
      <div class="view active" id="view-timeline">
        <div class="timeline-header">
          <h2>温暖时间轴</h2>
          <span class="timeline-count" id="recordCount">0 条记录</span>
        </div>
        <div class="timeline-list" id="timelineList"></div>
      </div>

      <!-- ===== RECORD VIEW ===== -->
      <div class="view" id="view-record">
        <div class="record-prompt">
          <h2>今天遇到了什么温暖？</h2>
          <p>用一两句话记下来，让善意不再转瞬即逝</p>
        </div>

        <div class="mood-section">
          <div class="mood-label">选择心情</div>
          <div class="mood-tags" id="moodTags">
            <div class="mood-tag" data-mood="stranger" data-color="#E07A4B">
              <span class="dot" style="background:#E07A4B"></span>被陌生人帮助
            </div>
            <div class="mood-tag" data-mood="witness" data-color="#6B9E78">
              <span class="dot" style="background:#6B9E78"></span>看到暖心一幕
            </div>
            <div class="mood-tag" data-mood="self" data-color="#D4A574">
              <span class="dot" style="background:#D4A574"></span>自己做了件小事
            </div>
            <div class="mood-tag" data-mood="family" data-color="#C4756B">
              <span class="dot" style="background:#C4756B"></span>被家人朋友触动
            </div>
          </div>
        </div>

        <div class="text-input-wrap">
          <textarea class="text-input" id="recordText" maxlength="200" placeholder="地铁上有人默默帮邻座扶住了要倒的水杯…"></textarea>
          <div class="char-count"><span id="charCount">0</span> / 200</div>
        </div>

        <div class="location-section">
          <div class="location-toggle" id="locationToggle">
            <div class="toggle-switch" id="toggleSwitch"></div>
            <span>标记大致位置</span>
          </div>
          <input type="text" class="location-input" id="locationInput" placeholder="如：朝阳区 / 地铁口 / 社区花园" style="display:none">
        </div>

        <button class="submit-btn" id="submitBtn" disabled>记录这一刻</button>
      </div>

      <!-- ===== MAP VIEW ===== -->
      <div class="view" id="view-map">
        <div class="map-header">
          <h2>温暖地图</h2>
          <p>每一颗善意，都在这座城市留下坐标</p>
        </div>
        <div class="map-container" id="mapContainer">
          <svg class="map-svg" viewBox="0 0 340 380" id="mapSvg">
            <!-- River -->
            <path d="M0,180 Q80,160 140,190 T280,170 L340,180 L340,210 Q260,200 180,220 T0,210 Z" fill="#C8DDD5" opacity="0.5"/>
            <!-- Parks -->
            <ellipse cx="70" cy="80" rx="50" ry="35" fill="#C4DDB8" opacity="0.5"/>
            <ellipse cx="260" cy="100" rx="55" ry="40" fill="#C4DDB8" opacity="0.5"/>
            <ellipse cx="200" cy="300" rx="60" ry="40" fill="#C4DDB8" opacity="0.4"/>
            <!-- Roads -->
            <line x1="0" y1="120" x2="340" y2="120" stroke="#D8CDBF" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="250" x2="340" y2="250" stroke="#D8CDBF" stroke-width="6" stroke-linecap="round"/>
            <line x1="110" y1="0" x2="110" y2="380" stroke="#D8CDBF" stroke-width="5" stroke-linecap="round"/>
            <line x1="230" y1="0" x2="230" y2="380" stroke="#D8CDBF" stroke-width="5" stroke-linecap="round"/>
            <!-- Building blocks -->
            <rect x="20" y="20" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="60" y="30" width="25" height="20" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="140" y="20" width="35" height="30" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="260" y="30" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="300" y="25" width="28" height="28" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="20" y="140" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="140" y="140" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="250" y="135" width="35" height="30" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="300" y="140" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="20" y="270" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="60" y="275" width="25" height="22" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="250" y="270" width="30" height="25" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <rect x="295" y="270" width="35" height="28" rx="4" fill="#E0D5C8" opacity="0.6"/>
            <!-- Pins will be inserted here by JS -->
            <g id="mapPins"></g>
          </svg>
          <div class="map-tooltip" id="mapTooltip"></div>
        </div>
        <div class="map-legend">
          <div class="legend-item"><span class="legend-dot" style="background:#E07A4B"></span>陌生人</div>
          <div class="legend-item"><span class="legend-dot" style="background:#6B9E78"></span>暖心一幕</div>
          <div class="legend-item"><span class="legend-dot" style="background:#D4A574"></span>自己的</div>
          <div class="legend-item"><span class="legend-dot" style="background:#C4756B"></span>家人朋友</div>
        </div>
        <div class="map-stats">
          <div class="stat-card">
            <div class="stat-num" id="statTotal">0</div>
            <div class="stat-label">温暖瞬间</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="statDays">0</div>
            <div class="stat-label">记录天数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="statPlaces">0</div>
            <div class="stat-label">温暖地点</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-illust">
        <img id="successImg" src="" alt="">
      </div>
      <div class="success-text">已记录</div>
      <div class="success-sub" id="successSub">这个温暖的瞬间已存入你的时间轴</div>
      <button class="success-btn" id="successBtn">继续感受</button>
    </div>

    <!-- Weekly Report Modal -->
    <div class="modal-overlay" id="reportModal">
      <div class="modal-card">
        <img class="modal-illust" id="reportImg" src="assets/illust_witness.jpg" alt="">
        <div class="modal-body">
          <h3 id="reportTitle">本周温暖报告</h3>
          <p id="reportDesc">这周你记录了 3 个温暖瞬间，它们散落在这座城市的不同角落。每一个微小的善意，都在你的记忆里留下了坐标。</p>
          <div class="modal-stats">
            <div class="modal-stat">
              <div class="modal-stat-num" id="reportCount">3</div>
              <div class="modal-stat-label">温暖记录</div>
            </div>
            <div class="modal-stat">
              <div class="modal-stat-num" id="reportDays">3</div>
              <div class="modal-stat-label">记录天数</div>
            </div>
            <div class="modal-stat">
              <div class="modal-stat-num" id="reportPlaces">2</div>
              <div class="modal-stat-label">温暖地点</div>
            </div>
          </div>
          <button class="modal-close" id="reportCloseBtn">好的，继续加油</button>
        </div>
      </div>
    </div>

    <!-- Detail Sheet Modal -->
    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-sheet">
        <img class="detail-illust" id="detailIllust" src="" alt="">
        <div class="detail-body">
          <div class="detail-mood-row">
            <div class="detail-mood-badge" id="detailBadge"></div>
            <div class="detail-date" id="detailDate"></div>
          </div>
          <div class="detail-text" id="detailText"></div>
          <div class="detail-location" id="detailLocation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="detailLocationText"></span>
          </div>
          <button class="detail-close-btn" id="detailCloseBtn">关闭</button>
        </div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <div class="tab-item" data-view="timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <circle cx="3.5" cy="6" r="1.2" fill="currentColor"/>
          <circle cx="3.5" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="3.5" cy="18" r="1.2" fill="currentColor"/>
        </svg>
        <span>时间轴</span>
      </div>
      <div class="tab-item center" data-view="record">
        <div class="tab-fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>记录</span>
      </div>
      <div class="tab-item" data-view="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        <span>温暖地图</span>
      </div>
    </div>

  </div>

  <script>
    // ===== Data Model =====
    var STORAGE_KEY = 'kindness_coordinates_v1';

    var moodConfig = {
      stranger: { label: '被陌生人帮助', color: '#E07A4B', img: 'assets/illust_stranger.jpg' },
      witness:  { label: '看到暖心一幕', color: '#6B9E78', img: 'assets/illust_witness.jpg' },
      self:     { label: '自己做了件小事', color: '#D4A574', img: 'assets/illust_self.jpg' },
      family:   { label: '被家人朋友触动', color: '#C4756B', img: 'assets/illust_family.jpg' }
    };

    // Pre-seeded sample data
    var sampleData = [
      { id: 1, mood: 'stranger', text: '下雨天没带伞，便利店老板借了一把给我，说还不还都行。', location: '朝阳区', date: '2026-07-08T19:30:00', mapX: 150, mapY: 95 },
      { id: 2, mood: 'witness', text: '地铁上有人默默帮邻座扶住了要倒的水杯，对方都没发现。', location: '地铁口', date: '2026-07-07T08:15:00', mapX: 75, mapY: 155 },
      { id: 3, mood: 'self', text: '给楼下的流浪猫放了水和猫粮，它吃完后在脚边蹭了蹭。', location: '社区花园', date: '2026-07-06T20:45:00', mapX: 265, mapY: 145 },
      { id: 4, mood: 'family', text: '加班回来发现桌上有一杯热牛奶，旁边贴了张便签：早点睡。', location: '家中', date: '2026-07-05T22:10:00', mapX: 200, mapY: 290 },
      { id: 5, mood: 'stranger', text: '推婴儿车上天桥时，后面的男生默默在后面帮忙抬了一把。', location: '天桥', date: '2026-07-03T17:20:00', mapX: 110, mapY: 260 },
      { id: 6, mood: 'witness', text: '公园长椅上有人留了一束野花，旁边写着"送给今天路过的你"。', location: '公园', date: '2026-07-01T15:00:00', mapX: 260, mapY: 295 }
    ];

    function loadData() {
      try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return JSON.parse(stored);
      } catch(e) {}
      return sampleData.slice();
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    var records = loadData();
    var selectedMood = null;
    var locationEnabled = false;

    // ===== Tab Navigation =====
    var tabItems = document.querySelectorAll('.tab-item');
    var views = document.querySelectorAll('.view');

    tabItems.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var target = tab.dataset.view;
        switchView(target);
      });
    });

    function switchView(target) {
      views.forEach(function(v) { v.classList.remove('active'); });
      tabItems.forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('view-' + target).classList.add('active');
      document.querySelector('.tab-item[data-view="' + target + '"]').classList.add('active');

      if (target === 'timeline') renderTimeline();
      if (target === 'map') renderMap();
      if (target === 'record') resetRecordForm();
    }

    // ===== Record View =====
    var moodTags = document.querySelectorAll('.mood-tag');
    var recordText = document.getElementById('recordText');
    var charCount = document.getElementById('charCount');
    var submitBtn = document.getElementById('submitBtn');
    var locationToggle = document.getElementById('locationToggle');
    var toggleSwitch = document.getElementById('toggleSwitch');
    var locationInput = document.getElementById('locationInput');

    moodTags.forEach(function(tag) {
      tag.addEventListener('click', function() {
        moodTags.forEach(function(t) { t.classList.remove('selected'); });
        tag.classList.add('selected');
        selectedMood = tag.dataset.mood;
        updateSubmitBtn();
      });
    });

    recordText.addEventListener('input', function() {
      charCount.textContent = recordText.value.length;
      updateSubmitBtn();
    });

    function updateSubmitBtn() {
      submitBtn.disabled = !(selectedMood && recordText.value.trim().length > 0);
    }

    locationToggle.addEventListener('click', function() {
      locationEnabled = !locationEnabled;
      toggleSwitch.classList.toggle('on', locationEnabled);
      locationInput.style.display = locationEnabled ? 'block' : 'none';
    });

    submitBtn.addEventListener('click', function() {
      if (submitBtn.disabled) return;

      var newRecord = {
        id: Date.now(),
        mood: selectedMood,
        text: recordText.value.trim(),
        location: locationEnabled && locationInput.value.trim() ? locationInput.value.trim() : null,
        date: new Date().toISOString(),
        mapX: 30 + Math.random() * 280,
        mapY: 30 + Math.random() * 320
      };

      records.unshift(newRecord);
      saveData(records);

      // Show success overlay
      var config = moodConfig[selectedMood];
      document.getElementById('successImg').src = config.img;
      document.getElementById('successSub').textContent = '这个温暖的瞬间已存入你的时间轴';
      document.getElementById('successOverlay').classList.add('show');
    });

    document.getElementById('successBtn').addEventListener('click', function() {
      document.getElementById('successOverlay').classList.remove('show');
      resetRecordForm();
      switchView('timeline');
    });

    function resetRecordForm() {
      moodTags.forEach(function(t) { t.classList.remove('selected'); });
      selectedMood = null;
      recordText.value = '';
      charCount.textContent = '0';
      locationEnabled = false;
      toggleSwitch.classList.remove('on');
      locationInput.style.display = 'none';
      locationInput.value = '';
      updateSubmitBtn();
    }

    // ===== Timeline View =====
    function renderTimeline() {
      var list = document.getElementById('timelineList');
      document.getElementById('recordCount').textContent = records.length + ' 条记录';

      if (records.length === 0) {
        list.innerHTML = '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
          '<p>还没有记录哦<br>点击中间的「+」开始记录第一个温暖瞬间</p></div>';
        return;
      }

      list.innerHTML = records.map(function(r) {
        var config = moodConfig[r.mood];
        var d = new Date(r.date);
        var dateStr = formatDate(d);
        var locationHtml = r.location ?
          '<div class="card-location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' + escapeHtml(r.location) + '</div>' : '';

        return '<div class="timeline-card">' +
          '<div class="card-illust">' +
            '<img src="' + config.img + '" alt="">' +
            '<div class="card-mood-badge" style="background:' + config.color + 'CC">' + config.label + '</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-text">' + escapeHtml(r.text) + '</div>' +
            '<div class="card-footer">' +
              '<div class="card-date">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
                dateStr +
              '</div>' +
              locationHtml +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    var activeTooltipRecord = null;

    // ===== Map View =====
    function renderMap() {
      var pinsGroup = document.getElementById('mapPins');
      pinsGroup.innerHTML = '';
      activeTooltipRecord = null;
      hideTooltip();

      records.forEach(function(r) {
        var config = moodConfig[r.mood];
        var pin = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        pin.classList.add('map-pin');
        pin.setAttribute('transform', 'translate(' + r.mapX + ',' + r.mapY + ')');

        // Pulse circle
        var pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pulse.setAttribute('cx', '0');
        pulse.setAttribute('cy', '0');
        pulse.setAttribute('r', '12');
        pulse.setAttribute('fill', config.color);
        pulse.setAttribute('opacity', '0.2');
        pin.appendChild(pulse);

        // Main dot
        var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', '0');
        dot.setAttribute('cy', '0');
        dot.setAttribute('r', '6');
        dot.setAttribute('fill', config.color);
        dot.setAttribute('stroke', '#fff');
        dot.setAttribute('stroke-width', '2');
        pin.appendChild(dot);

        // Click to show bubble
        pin.addEventListener('click', function(e) {
          e.stopPropagation();
          showBubble(r);
        });

        pinsGroup.appendChild(pin);
      });

      // Update stats
      var locations = records.filter(function(r) { return r.location; });
      var uniqueLocations = new Set(locations.map(function(r) { return r.location; }));
      var uniqueDays = new Set(records.map(function(r) { return r.date.split('T')[0]; }));

      document.getElementById('statTotal').textContent = records.length;
      document.getElementById('statDays').textContent = uniqueDays.size;
      document.getElementById('statPlaces').textContent = uniqueLocations.size;
    }

    function showBubble(record) {
      var tooltip = document.getElementById('mapTooltip');
      var config = moodConfig[record.mood];
      var d = new Date(record.date);
      activeTooltipRecord = record;

      tooltip.innerHTML =
        '<div class="map-tooltip-header">' +
          '<div class="map-tooltip-icon"><img src="' + config.img + '" alt=""></div>' +
          '<div class="map-tooltip-label" style="color:' + config.color + '">' + config.label + '</div>' +
        '</div>' +
        '<div class="map-tooltip-text">' + escapeHtml(record.text.substring(0, 35)) + (record.text.length > 35 ? '…' : '') + '</div>' +
        '<div class="map-tooltip-footer">' + formatDate(d) + (record.location ? ' · ' + escapeHtml(record.location) : '') + '</div>' +
        '<div class="map-tooltip-cta">查看详情</div>';

      var container = document.getElementById('mapContainer');
      var rect = container.getBoundingClientRect();
      var svg = document.getElementById('mapSvg');
      var svgRect = svg.getBoundingClientRect();

      var scaleX = svgRect.width / 340;
      var scaleY = svgRect.height / 380;

      var x = record.mapX * scaleX + 15;
      var y = record.mapY * scaleY - 10;

      if (x + 200 > rect.width) x = record.mapX * scaleX - 215;
      if (y < 0) y = 10;
      if (y + 130 > rect.height) y = rect.height - 140;

      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.classList.add('show');
    }

    function hideTooltip() {
      document.getElementById('mapTooltip').classList.remove('show');
      activeTooltipRecord = null;
    }

    // Click on tooltip → open detail
    document.getElementById('mapTooltip').addEventListener('click', function(e) {
      e.stopPropagation();
      if (activeTooltipRecord) {
        openDetail(activeTooltipRecord);
        hideTooltip();
      }
    });

    // Click on map background → close bubble
    document.getElementById('mapContainer').addEventListener('click', function(e) {
      if (e.target.closest('.map-pin') || e.target.closest('.map-tooltip')) return;
      hideTooltip();
    });

    // ===== Detail Sheet =====
    function openDetail(record) {
      var config = moodConfig[record.mood];
      var d = new Date(record.date);

      document.getElementById('detailIllust').src = config.img;
      document.getElementById('detailBadge').textContent = config.label;
      document.getElementById('detailBadge').style.background = config.color;
      document.getElementById('detailDate').textContent = formatDateFull(d);
      document.getElementById('detailText').textContent = record.text;

      var locationEl = document.getElementById('detailLocation');
      if (record.location) {
        locationEl.style.display = 'inline-flex';
        document.getElementById('detailLocationText').textContent = record.location;
      } else {
        locationEl.style.display = 'none';
      }

      document.getElementById('detailOverlay').classList.add('show');
    }

    function closeDetail() {
      document.getElementById('detailOverlay').classList.remove('show');
    }

    document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    // ===== Weekly Report Modal =====
    document.getElementById('reportBtn').addEventListener('click', function() {
      var modal = document.getElementById('reportModal');
      var now = new Date();
      var weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

      var weekRecords = records.filter(function(r) { return new Date(r.date) >= weekAgo; });
      var uniqueDays = new Set(weekRecords.map(function(r) { return r.date.split('T')[0]; }));
      var locations = weekRecords.filter(function(r) { return r.location; });
      var uniqueLocations = new Set(locations.map(function(r) { return r.location; }));

      document.getElementById('reportCount').textContent = weekRecords.length;
      document.getElementById('reportDays').textContent = uniqueDays.size;
      document.getElementById('reportPlaces').textContent = uniqueLocations.size;

      var desc;
      if (weekRecords.length === 0) {
        desc = '这周还没有记录哦。别急，善意无处不在——也许就在下一个转角等你发现。';
      } else if (weekRecords.length <= 2) {
        desc = '这周你记录了 ' + weekRecords.length + ' 个温暖瞬间，它们散落在这座城市的不同角落。每一个微小的善意，都在你的记忆里留下了坐标。';
      } else {
        desc = '这周你记录了 ' + weekRecords.length + ' 个温暖瞬间！你有一双善于发现美好的眼睛。这些善意或许微小，但它们正在慢慢改变你看待世界的方式。';
      }
      document.getElementById('reportDesc').textContent = desc;

      modal.classList.add('show');
    });

    document.getElementById('reportCloseBtn').addEventListener('click', function() {
      document.getElementById('reportModal').classList.remove('show');
    });

    document.getElementById('reportModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    // ===== Helpers =====
    function formatDate(d) {
      var now = new Date();
      var diff = now - d;
      var day = 24 * 60 * 60 * 1000;

      if (diff < day && now.getDate() === d.getDate()) return '今天';
      var yesterday = new Date(now.getTime() - day);
      if (d.getDate() === yesterday.getDate() && d.getMonth() === yesterday.getMonth()) return '昨天';
      if (diff < 7 * day) {
        var days = Math.floor(diff / day);
        return days + ' 天前';
      }
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    function formatDateFull(d) {
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
        d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== Clock =====
    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      document.getElementById('clock').textContent = h + ':' + (m < 10 ? '0' + m : m);
    }
    updateClock();
    setInterval(updateClock, 30000);

    // ===== Initialize =====
    renderTimeline();
  </script>

</body>
</html>
