<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>趣味日记本</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #FF6B6B;
  --primary-light: #FF8E8E;
  --fortune: #C084FC;
  --fortune-light: #E0B3FF;
  --diary: #FF9F43;
  --diary-light: #FFD1A3;
  --praise: #00C9A7;
  --praise-light: #80E4D3;
  --roast: #845EC2;
  --roast-light: #B8A0D8;
  --mood: #FF6B9D;
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --text-primary: #2D2D2D;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --border: #FFE8D6;
  --shadow: 0 2rpx 12rpx rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-lg: 16px;
  --radius-btn: 22px;
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
  background: #f5f5f5;
  height: 100%;
  overflow: hidden;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  background: linear-gradient(180deg, #FFF8F0 0%, #FFECD2 100%);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 80px;
}
.tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  background: #fff;
  display: flex;
  border-top: 1px solid var(--border);
  z-index: 100;
}
.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: color 0.2s;
  user-select: none;
}
.tab.active { color: var(--primary); font-weight: 600; }

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* 通用样式 */
.header { text-align: center; padding: 24px 0 16px; }
.header-emoji { font-size: 40px; display: block; margin-bottom: 8px; }
.header-title { font-size: 24px; font-weight: bold; display: block; }
.header-desc { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; display: block; }

.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.btn {
  border: none;
  border-radius: var(--radius-btn);
  padding: 0 20px;
  height: 44px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:active { opacity: 0.9; transform: scale(0.98); }
.btn-block { width: 100%; height: 48px; font-size: 17px; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
.btn-fortune { background: linear-gradient(135deg, var(--fortune), var(--fortune-light)); }
.btn-diary { background: linear-gradient(135deg, var(--diary), var(--diary-light)); }
.btn-praise { background: linear-gradient(135deg, var(--praise), var(--praise-light)); }
.btn-roast { background: linear-gradient(135deg, var(--roast), var(--roast-light)); }

input, textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  font-size: 15px;
  background: #FFF8F0;
  outline: none;
  font-family: inherit;
}
input:focus, textarea:focus { border-color: var(--primary); }

/* 今日时光 */
.date-card {
  margin-top: 16px;
  padding: 24px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(255,107,107,0.3);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.date-card::after, .date-card::before {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
}
.date-card::after { top: -30px; right: -20px; width: 100px; height: 100px; }
.date-card::before { bottom: -20px; left: -10px; width: 60px; height: 60px; }
.date-month { font-size: 14px; opacity: 0.8; }
.date-day { font-size: 56px; font-weight: bold; line-height: 1.1; }
.date-weekday { font-size: 18px; opacity: 0.9; }
.date-full { font-size: 12px; opacity: 0.7; margin-top: 4px; }

.section-header { display: flex; align-items: center; margin: 24px 0 12px; }
.section-icon { font-size: 20px; margin-right: 8px; }
.section-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }

.event-card {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-left: 3px solid var(--primary);
}
.event-year {
  display: inline-block;
  padding: 2px 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  border-radius: 11px;
  margin-bottom: 8px;
}
.event-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.event-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* 创意运势 */
.input-row { display: flex; gap: 12px; align-items: center; }
.input-row input { flex: 1; }
.percent-bar { margin-bottom: 16px; }
.percent-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
.percent-label { color: var(--text-secondary); }
.percent-value { font-weight: 600; }
.percent-track { height: 8px; background: #FFF1E6; border-radius: 4px; overflow: hidden; }
.percent-fill { height: 100%; border-radius: 4px; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
.summary-card { padding: 14px; background: linear-gradient(135deg, rgba(192,132,252,0.08), rgba(224,179,255,0.05)); border-radius: var(--radius); margin-bottom: 12px; }
.summary-emoji { font-size: 24px; display: block; margin-bottom: 6px; }
.summary-text { font-size: 15px; line-height: 1.6; font-weight: 500; }
.suggestion-card { padding: 14px; background: linear-gradient(135deg, rgba(255,159,67,0.08), rgba(255,209,163,0.05)); border-radius: var(--radius); margin-bottom: 12px; }
.suggestion-label { font-size: 13px; color: var(--diary); font-weight: 600; display: block; margin-bottom: 4px; }
.lucky-card { display: flex; align-items: center; padding: 12px 16px; background: rgba(255,217,61,0.15); border-radius: var(--radius); }
.lucky-icon { font-size: 20px; margin-right: 8px; }

/* 今日心情 */
.mood-row { display: flex; justify-content: space-between; gap: 8px; }
.mood-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  border-radius: var(--radius);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.mood-item:active { transform: scale(0.95); }
.mood-item.selected { border-color: var(--mood); background: rgba(255,107,157,0.05); box-shadow: 0 4px 16px rgba(255,107,157,0.15); }
.mood-emoji { font-size: 36px; }
.mood-label { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
.mood-item.selected .mood-label { color: var(--mood); font-weight: 600; }
.saved-tip { text-align: center; margin-top: 12px; font-size: 12px; color: var(--praise); }

.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-arrow { padding: 4px 12px; background: rgba(255,107,157,0.08); border-radius: 11px; cursor: pointer; color: var(--mood); font-size: 14px; }
.cal-arrow:active { transform: scale(0.95); }
.cal-title { font-size: 16px; font-weight: 600; }
.cal-grid { display: flex; flex-wrap: wrap; }
.cal-week { display: flex; margin-bottom: 4px; }
.cal-week-cell { flex: 1; text-align: center; padding: 4px 0; font-size: 11px; color: var(--text-tertiary); }
.cal-cell { width: calc(100% / 7); display: flex; align-items: center; justify-content: center; padding: 2px; }
.cal-inner { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); font-size: 13px; color: var(--text-tertiary); }
.cal-inner.today { border: 2px solid var(--mood); color: var(--mood); font-weight: 600; }
.cal-emoji { font-size: 20px; }
.stats-row { display: flex; justify-content: space-around; }
.stat-item { display: flex; flex-direction: column; align-items: center; }
.stat-emoji { font-size: 24px; }
.stat-count { font-size: 16px; font-weight: bold; }
.stat-label { font-size: 10px; color: var(--text-tertiary); }

/* 趣味日记 */
.mode-row { display: flex; gap: 12px; margin-bottom: 16px; }
.mode-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all 0.2s;
  background: #fff;
}
.mode-card:active { transform: scale(0.98); }
.mode-card.praise-selected { border-color: var(--praise); background: rgba(0,201,167,0.05); box-shadow: 0 4px 20px rgba(0,201,167,0.15); }
.mode-card.roast-selected { border-color: var(--roast); background: rgba(132,94,194,0.05); box-shadow: 0 4px 20px rgba(132,94,194,0.15); }
.mode-emoji { font-size: 32px; margin-bottom: 8px; }
.mode-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.mode-desc { font-size: 11px; color: var(--text-tertiary); text-align: center; }
.char-count { font-size: 11px; color: var(--text-tertiary); text-align: right; margin: 4px 0 12px; }
.diary-item { border-left: 3px solid var(--diary); }
.diary-item.praise { border-left-color: var(--praise); }
.diary-item.roast { border-left-color: var(--roast); }
.diary-date { font-size: 11px; color: var(--text-tertiary); margin-bottom: 6px; }
.diary-content { font-size: 15px; margin-bottom: 8px; line-height: 1.5; }
.diary-tag { display: inline-block; padding: 2px 10px; border-radius: 11px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
.diary-tag.praise { background: rgba(0,201,167,0.1); color: var(--praise); }
.diary-tag.roast { background: rgba(132,94,194,0.1); color: var(--roast); }
.diary-comment { padding: 10px; border-radius: var(--radius); }
.diary-comment.praise { background: rgba(0,201,167,0.08); }
.diary-comment.roast { background: rgba(132,94,194,0.08); }
.comment-emoji { font-size: 20px; display: block; margin-bottom: 4px; }
.comment-text { font-size: 14px; line-height: 1.6; }
.diary-comment.praise .comment-text { color: var(--praise); }
.diary-comment.roast .comment-text { color: var(--roast); }
.empty { text-align: center; padding: 32px 0; }
.empty-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: var(--text-tertiary); }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.preset-btn { padding: 4px 12px; background: #FFF1E6; color: var(--diary); border-radius: 15px; font-size: 12px; cursor: pointer; border: none; }
.preset-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="app">
  <div class="content" id="content">

    <!-- 今日时光 -->
    <div class="page active" id="page-today">
      <div class="date-card">
        <div class="date-month" id="dateMonth"></div>
        <div class="date-day" id="dateDay"></div>
        <div class="date-weekday" id="dateWeekday"></div>
        <div class="date-full" id="dateFull"></div>
      </div>
      <div class="section-header">
        <span class="section-icon">📜</span>
        <span class="section-title">历史上的今天</span>
      </div>
      <div id="eventList"></div>
      <div style="text-align:center;margin:24px 0 16px;color:var(--text-tertiary);font-size:12px;">— 每一天都值得被记住 —</div>
    </div>

    <!-- 创意运势 -->
    <div class="page" id="page-fortune">
      <div class="header">
        <span class="header-emoji">🔮</span>
        <span class="header-title" style="color:var(--fortune)">创意运势</span>
        <span class="header-desc">输入心仪数字，看看今天的创意运势</span>
      </div>
      <div class="card">
        <div style="font-size:15px;font-weight:600;margin-bottom:12px;">你的心仪数字</div>
        <div class="input-row">
          <input type="number" id="luckyNumInput" placeholder="输入一个1~999的数字..." maxlength="3">
          <button class="btn btn-fortune" onclick="generateFortune()">测运势</button>
        </div>
      </div>
      <div id="fortuneResult">
        <div class="empty"><span class="empty-emoji">🌙</span><span class="empty-text">输入心仪数字，开启今日运势吧~</span></div>
      </div>
    </div>

    <!-- 今日心情 -->
    <div class="page" id="page-mood">
      <div class="header">
        <span class="header-emoji">💖</span>
        <span class="header-title" style="color:var(--mood)">今日心情</span>
        <span class="header-desc">记录心情，看见情绪的变化</span>
      </div>
      <div class="card">
        <div style="font-size:15px;font-weight:600;text-align:center;margin-bottom:12px;">今天的心情是？</div>
        <div class="mood-row" id="moodRow"></div>
        <div class="saved-tip" id="savedTip" style="display:none;">✓ 心情已记录</div>
      </div>
      <div class="card">
        <div class="cal-header">
          <div class="cal-arrow" onclick="changeMonth(-1)">◀</div>
          <div class="cal-title" id="calTitle"></div>
          <div class="cal-arrow" onclick="changeMonth(1)">▶</div>
        </div>
        <div class="cal-week" id="calWeek"></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:600;margin-bottom:12px;">本月心情统计</div>
        <div class="stats-row" id="statsRow"></div>
      </div>
    </div>

    <!-- 趣味日记 -->
    <div class="page" id="page-diary">
      <div class="header">
        <span class="header-emoji">📝</span>
        <span class="header-title" style="color:var(--diary)">趣味日记</span>
        <span class="header-desc">记录今天的事，选择模式获取趣味评语</span>
      </div>
      <div class="card">
        <div style="font-size:15px;font-weight:600;margin-bottom:12px;">今天发生了什么？</div>
        <textarea id="diaryInput" placeholder="写下今天的事情吧..." maxlength="200" rows="3" style="border-radius:12px;resize:none;"></textarea>
        <div class="char-count"><span id="charCount">0</span>/200</div>
        <div class="preset-row" id="presetRow"></div>
      </div>
      <div class="card">
        <div style="font-size:15px;font-weight:600;margin-bottom:12px;">选择评语模式</div>
        <div class="mode-row">
          <div class="mode-card praise-selected" id="modePraise" onclick="selectMode('praise')">
            <span class="mode-emoji">🥰</span>
            <span class="mode-title">夸夸模式</span>
            <span class="mode-desc">疯狂夸你，让你开心到飞起</span>
          </div>
          <div class="mode-card" id="modeRoast" onclick="selectMode('roast')">
            <span class="mode-emoji">😏</span>
            <span class="mode-title">吐槽模式</span>
            <span class="mode-desc">幽默吐槽，让你笑到停不下来</span>
          </div>
        </div>
        <button class="btn btn-praise btn-block" id="submitBtn" onclick="addDiary()">🥰 获取夸夸</button>
      </div>
      <div class="section-header"><span class="section-icon">📖</span><span class="section-title">我的日记</span></div>
      <div id="diaryList"></div>
    </div>

  </div>

  <div class="tabbar">
    <div class="tab active" onclick="switchTab(0)">今日时光</div>
    <div class="tab" onclick="switchTab(1)">创意运势</div>
    <div class="tab" onclick="switchTab(2)">今日心情</div>
    <div class="tab" onclick="switchTab(3)">趣味日记</div>
  </div>
</div>

<script>
// ========== 数据 ==========
var historyEventsMap = {
  '1-1': [{year:1912,title:'中华民国成立',desc:'孙中山就任临时大总统'},{year:1995,title:'世界贸易组织成立',desc:'WTO正式运作'},{year:2002,title:'欧元纸币流通',desc:'欧元区12国开始使用欧元现金'}],
  '7-1': [{year:1921,title:'中国共产党成立',desc:'中共一大在上海召开'},{year:1997,title:'香港回归祖国',desc:'一国两制变为现实'}],
  '10-1': [{year:1949,title:'中华人民共和国成立',desc:'开国大典在北京举行'}],
  '5-1': [{year:1886,title:'芝加哥工人大罢工',desc:'争取八小时工作制'},{year:2011,title:'本·拉登被击毙',desc:'美国宣布击毙基地组织领导人'}],
};
var defaultEvents = [
  {year:1969,title:'人类首次登月',desc:'阿姆斯特朗迈出人类在月球的第一步'},
  {year:1452,title:'达芬奇出生',desc:'文艺复兴全才，留下《蒙娜丽莎》等名作'},
  {year:1879,title:'爱迪生发明电灯',desc:'成功测试第一盏实用的白炽灯泡'},
  {year:1903,title:'莱特兄弟首次飞行',desc:'人类第一次有动力飞行'},
  {year:1989,title:'柏林墙倒塌',desc:'东西德人民自由通行，冷战走向终结'},
  {year:2008,title:'北京奥运会开幕',desc:'第29届夏季奥运会在北京隆重开幕'},
  {year:1998,title:'Google成立',desc:'佩奇和布林在车库中创办了Google'},
  {year:2007,title:'iPhone发布',desc:'苹果发布第一代iPhone，开启智能手机时代'},
];

var fortunes = ['今日灵感如泉涌，万物皆可入诗篇！','运气爆棚的一天，连路边的猫都会对你微笑','社交魅力全开，你的笑容就是最好的名片','今天适合大胆尝试，失败也是一种收获','宇宙正在为你排列组合，好运即将到来','今天的你像一颗小太阳，温暖又耀眼','灵感与运气双丰收，记得抓住每一个闪念','今天适合创作，你的想象力正在巅峰','平淡中藏着惊喜，留心身边的小确幸','今天是你发光的日子，自信地展现自己吧'];
var suggestions = ['试试用非惯用手画一幅画，激发右脑创意','去一个从没去过的地方散步，收集新鲜灵感','给一个老朋友发条消息，可能会收获意外惊喜','今天适合写点什么，哪怕是流水账','换一条路回家，说不定会发现隐藏的美食','尝试做一道新菜，厨房也是创作空间','关掉手机一小时，和自己的内心对话','读一首诗或者听一首新歌，给灵魂充电'];
var luckyElements = ['红色围巾','一杯热可可','一本旧书','猫咪的呼噜声','午后的阳光','一首老歌','手写信','一块巧克力','窗边的绿植','雨后的泥土香','一张明信片','温暖的拥抱'];

function generateFortuneData(num) {
  var today = new Date();
  var seed = Math.abs(num * 37 + today.getFullYear() * 365 + today.getMonth() * 31 + today.getDate());
  var rand = function(min, max, offset) {
    var val = ((seed * (offset + 1) * 7 + offset * 31) % (max - min + 1)) + min;
    return Math.min(max, Math.max(min, val));
  };
  return {
    overall: rand(60, 99, 1),
    creativity: rand(55, 99, 2),
    luck: rand(50, 99, 3),
    social: rand(45, 99, 4),
    energy: rand(55, 99, 5),
    summary: fortunes[seed % fortunes.length],
    suggestion: suggestions[(seed + 3) % suggestions.length],
    luckyElement: luckyElements[(seed + 7) % luckyElements.length],
  };
}

var praiseTemplates = [

  return { comment: t.replace('{thing}', thing), emoji: praiseEmojis[Math.floor(Math.random()*praiseEmojis.length)] };
}
function generateRoast(content) {
  var t = roastTemplates[Math.floor(Math.random()*roastTemplates.length)];
  var thing = content.length > 15 ? content.slice(0,15)+'...' : content;
  return { comment: t.replace('{thing}', thing), emoji: roastEmojis[Math.floor(Math.random()*roastEmojis.length)] };

var MOOD_LIST = [
  {level:1,emoji:'😭',label:'非常不开心',color:'#845EC2'},
  {level:2,emoji:'😞',label:'不开心',color:'#FF6B6B'},
  {level:3,emoji:'😐',label:'一般',color:'#FFD93D'},
  {level:4,emoji:'😊',label:'开心',color:'#00C9A7'},
  {level:5,emoji:'🥰',label:'特别开心',color:'#FF6B9D'},
];

var diaryPresets = ['今天吃了一顿好吃的','和朋友出去玩了一整天','学习了一个新技能','遇到了一件有趣的事','完成了一个小目标','看了一部好电影','今天宅在家','心情不太好','运动了一下','尝试了新事物'];

// ========== 状态 ==========
var diaryMode = 'praise';
var diaries = JSON.parse(localStorage.getItem('funny_diary_entries') || '[]');
var moodRecords = JSON.parse(localStorage.getItem('mood_records') || '{}');
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth() + 1;

// ========== Tab切换 ==========
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', i===idx); });
  document.querySelectorAll('.page').forEach(function(p,i){ p.classList.toggle('active', i===idx); });
  document.getElementById('content').scrollTop = 0;
}

// ========== 今日时光 ==========
function initToday() {
  var now = new Date();
  var weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('dateMonth').textContent = (now.getMonth()+1)+'月';
  document.getElementById('dateDay').textContent = now.getDate();
  document.getElementById('dateWeekday').textContent = '星期'+weekdays[now.getDay()];
  document.getElementById('dateFull').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';

  var key = (now.getMonth()+1)+'-'+now.getDate();
  var events = historyEventsMap[key] || defaultEvents;
  var html = '';
  events.forEach(function(ev) {
    html += '<div class="event-card"><span class="event-year">'+ev.year+'年</span><div class="event-title">'+ev.title+'</div><div class="event-desc">'+ev.desc+'</div></div>';
  });
  document.getElementById('eventList').innerHTML = html;
}

// ========== 创意运势 ==========
function generateFortune() {
  var num = document.getElementById('luckyNumInput').value;
  if (!num) { alert('请先输入数字~'); return; }
  var f = generateFortuneData(parseInt(num));
  var bars = [
    {label:'综合运势', value:f.overall, color:'#FF6B6B'},
    {label:'创意指数', value:f.creativity, color:'#C084FC'},
    {label:'幸运值', value:f.luck, color:'#FFD93D'},
    {label:'社交运', value:f.social, color:'#00C9A7'},
    {label:'能量值', value:f.energy, color:'#FF9F43'},
  ];
  var html = '<div class="card"><div style="text-align:center;margin-bottom:16px;"><div style="font-size:18px;font-weight:bold;color:var(--fortune)">数字 '+num+' 的今日运势</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">每天都是全新的开始</div></div>';
  bars.forEach(function(b) {
    html += '<div class="percent-bar"><div class="percent-header"><span class="percent-label">'+b.label+'</span><span class="percent-value" style="color:'+b.color+'">'+b.value+'%</span></div><div class="percent-track"><div class="percent-fill" style="background:'+b.color+';width:0%"></div></div></div>';
  });
  html += '<div class="summary-card"><span class="summary-emoji">✨</span><span class="summary-text">'+f.summary+'</span></div>';
  html += '<div class="suggestion-card"><span class="suggestion-label">💡 今日创作建议</span><span style="font-size:14px;line-height:1.6;display:block;">'+f.suggestion+'</span></div>';
  html += '<div class="lucky-card"><span class="lucky-icon">🍀</span><span style="font-size:13px;color:var(--text-secondary);margin-right:8px;">今日幸运物：</span><span style="font-size:15px;font-weight:600;color:var(--diary);">'+f.luckyElement+'</span></div></div>';
  html += '<button class="btn btn-fortune btn-block" onclick="resetFortune()" style="margin-top:12px;">🔮 重新测算</button>';
  document.getElementById('fortuneResult').innerHTML = html;
  // 动画
  setTimeout(function() {
    document.querySelectorAll('.percent-fill').forEach(function(el, i) {
      setTimeout(function() { el.style.width = bars[i].value + '%'; }, i * 100);
    });
  }, 50);
}
function resetFortune() {
  document.getElementById('luckyNumInput').value = '';
  document.getElementById('fortuneResult').innerHTML = '<div class="empty"><span class="empty-emoji">🌙</span><span class="empty-text">输入心仪数字，开启今日运势吧~</span></div>';
}

// ========== 今日心情 ==========
function initMood() {
  var html = '';
  var today = getTodayKey();
  var todayMood = moodRecords[today] || 0;
  MOOD_LIST.forEach(function(m) {
    html += '<div class="mood-item'+(todayMood===m.level?' selected':'')+'" onclick="selectMood('+m.level+')"><span class="mood-emoji">'+m.emoji+'</span><span class="mood-label">'+m.label+'</span></div>';
  });
  document.getElementById('moodRow').innerHTML = html;

  // 日历
  renderCalendar();
}

function selectMood(level) {
  var today = getTodayKey();
  moodRecords[today] = level;
  localStorage.setItem('mood_records', JSON.stringify(moodRecords));
  initMood();
  var tip = document.getElementById('savedTip');
  tip.style.display = 'block';
  setTimeout(function() { tip.style.display = 'none'; }, 2000);
}

function getTodayKey() {
  var now = new Date();
  return now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
}
function pad2(n) { return n<10?'0'+n:''+n; }

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 1) { calMonth = 12; calYear--; }
  if (calMonth > 12) { calMonth = 1; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = calYear+'年'+calMonth+'月';
  var weeks = ['日','一','二','三','四','五','六'];
  var whtml = '';
  weeks.forEach(function(w) { whtml += '<div class="cal-week-cell">'+w+'</div>'; });
  document.getElementById('calWeek').innerHTML = whtml;

  var days = new Date(calYear, calMonth, 0).getDate();
  var firstDayWeek = new Date(calYear, calMonth-1, 1).getDay();
  var now = new Date();
  var isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth()+1;

  var html = '';
  for (var i=0; i<firstDayWeek; i++) { html += '<div class="cal-cell"><div class="cal-inner"></div></div>'; }
  for (var d=1; d<=days; d++) {
    var dateKey = calYear+'-'+pad2(calMonth)+'-'+pad2(d);
    var moodLevel = moodRecords[dateKey];
    var isToday = isCurrentMonth && d === now.getDate();
    if (moodLevel) {
      var moodInfo = MOOD_LIST[moodLevel-1];
      html += '<div class="cal-cell"><div class="cal-inner'+(isToday?' today':'')+'"><span class="cal-emoji">'+moodInfo.emoji+'</span></div></div>';
    } else {
      html += '<div class="cal-cell"><div class="cal-inner'+(isToday?' today':'')+'">'+d+'</div></div>';
    }
  }
  document.getElementById('calGrid').innerHTML = html;

  // 统计
  var statsHtml = '';
  MOOD_LIST.forEach(function(m) {
    var count = 0;
    for (var d=1; d<=days; d++) {
      var key = calYear+'-'+pad2(calMonth)+'-'+pad2(d);
      if (moodRecords[key] === m.level) count++;
    }
    statsHtml += '<div class="stat-item"><span class="stat-emoji">'+m.emoji+'</span><span class="stat-count">'+count+'</span><span class="stat-label">'+m.label+'</span></div>';
  });
  document.getElementById('statsRow').innerHTML = statsHtml;
}

// ========== 趣味日记 ==========
function initDiary() {
  // 预设按钮
  var phtml = '';
  diaryPresets.forEach(function(p) {
    phtml += '<button class="preset-btn" onclick="usePreset(\''+p.replace(/'/g,"\\'")+'\')">'+p+'</button>';
  });
  document.getElementById('presetRow').innerHTML = phtml;

  document.getElementById('diaryInput').addEventListener('input', function(e) {
    document.getElementById('charCount').textContent = e.target.value.length;
  });

  renderDiaryList();
}

function usePreset(text) {
  document.getElementById('diaryInput').value = text;
  document.getElementById('charCount').textContent = text.length;
}

function selectMode(mode) {
  diaryMode = mode;
  var pEl = document.getElementById('modePraise');
  var rEl = document.getElementById('modeRoast');
  var btn = document.getElementById('submitBtn');
  pEl.classList.toggle('praise-selected', mode==='praise');
  rEl.classList.toggle('roast-selected', mode==='roast');
  if (mode === 'praise') {
    btn.className = 'btn btn-praise btn-block';
    btn.textContent = '🥰 获取夸夸';
  } else {
    btn.className = 'btn btn-roast btn-block';
    btn.textContent = '😏 获取吐槽';
  }
}

function addDiary() {
  var content = document.getElementById('diaryInput').value.trim();
  if (!content) { alert('请先写下今天的事~'); return; }
  var now = new Date();
  var dateStr = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
  var result = diaryMode === 'praise' ? generatePraise(content) : generateRoast(content);
  var entry = { content: content, date: dateStr, mode: diaryMode, comment: result.comment, emoji: result.emoji };
  diaries.unshift(entry);
  localStorage.setItem('funny_diary_entries', JSON.stringify(diaries));
  document.getElementById('diaryInput').value = '';
  document.getElementById('charCount').textContent = '0';
  renderDiaryList();
  alert(diaryMode === 'praise' ? '夸夸已送达~' : '吐槽已出击~');
}

function renderDiaryList() {
  if (diaries.length === 0) {
    document.getElementById('diaryList').innerHTML = '<div class="empty"><span class="empty-emoji">🌱</span><span class="empty-text">还没有日记，快记录今天的事吧~</span></div>';
    return;
  }
  var html = '';
  diaries.forEach(function(d) {
    var isPraise = d.mode === 'praise';
    html += '<div class="card diary-item '+d.mode+'">';
    html += '<div class="diary-date">'+d.date+'</div>';
    html += '<div class="diary-content">'+d.content+'</div>';
    html += '<span class="diary-tag '+d.mode+'">'+(isPraise?'🥰 夸夸模式':'😏 吐槽模式')+'</span>';
    html += '<div class="diary-comment '+d.mode+'"><span class="comment-emoji">'+d.emoji+'</span><span class="comment-text">'+d.comment+'</span></div>';
    html += '</div>';
  });
  document.getElementById('diaryList').innerHTML = html;
}

// ========== 初始化 ==========
initToday();
initMood();
initDiary();
</script>
