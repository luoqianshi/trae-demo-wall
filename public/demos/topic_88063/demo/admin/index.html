<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路见 - 管理后台 Demo</title>
    <link rel="stylesheet" href="../shared/styles/entry.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body>
    <!-- 跳过导航链接（键盘用户快速访问主内容） -->
    <a href="#adminContent" class="skip-link">跳到主内容</a>

    <!-- 后台主容器 -->
    <div class="admin-layout" id="adminLayout">
      <!-- 侧边栏 -->
      <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-logo">
          <span class="logo-icon" aria-hidden="true">路</span>
          <div class="logo-text">
            <h2>路见</h2>
            <p>管理后台</p>
          </div>
        </div>
        <nav class="sidebar-menu" id="sidebarMenu" aria-label="主导航"></nav>
        <div class="sidebar-footer">
          <a href="../index.html" class="back-entry">← 返回 Demo 入口</a>
        </div>
      </aside>

      <!-- 主内容区 -->
      <div class="admin-main">
        <!-- 顶部栏 -->
        <header class="admin-header">
          <div class="header-title" id="headerTitle">数据看板</div>
          <div class="header-actions">
            <div class="header-user" id="headerUser" aria-label="当前用户">
              <img
                class="user-avatar"
                id="userAvatar"
                src=""
                alt="头像"
                width="32"
                height="32"
              />
              <span class="user-name" id="userName">管理员</span>
              <span class="user-role" id="userRole"></span>
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">
              退出
            </button>
          </div>
        </header>

        <!-- 页面内容 -->
        <main class="admin-content" id="adminContent" tabindex="-1">
          <div class="page-loading" aria-live="polite">
            <div class="loading-spinner" role="img" aria-label="加载中"></div>
            <p>加载中…</p>
          </div>
        </main>
      </div>
    </div>

    <!-- 共享层脚本 -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/mock-data.js"></script>
    <script src="../shared/mock-api.js"></script>
    <script src="../shared/mock-admin-api.js"></script>

    <!-- 高德地图 JS API -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=a47b35619b3fd91ba3c61ee001ccf472&plugin=AMap.Geocoder"></script>

    <!-- ECharts 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- 页面脚本 -->
    <script src="./scripts/pages/login.js"></script>
    <script src="./scripts/pages/dashboard.js"></script>
    <script src="./scripts/pages/reports.js"></script>
    <script src="./scripts/pages/report-detail.js"></script>
    <script src="./scripts/pages/statistics.js"></script>
    <script src="./scripts/pages/users.js"></script>

    <!-- 应用入口 -->
    <script src="./scripts/app.js"></script>
  </body>
</html>
