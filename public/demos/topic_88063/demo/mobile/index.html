<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路见 - 小程序端 Demo</title>
    <link rel="stylesheet" href="../shared/styles/entry.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/pages.css" />
  </head>
  <body>
    <!-- 手机壳外框 -->
    <div class="phone-shell">
      <!-- 顶部状态栏 -->
      <div class="phone-statusbar" role="presentation">
        <span class="status-time" id="statusTime">09:41</span>
        <span class="status-notch" aria-hidden="true"></span>
        <span class="status-icons" aria-hidden="true">
          <span class="icon-signal">●●●●</span>
          <span class="icon-battery">▮</span>
        </span>
      </div>

      <!-- 导航栏 -->
      <div class="phone-navbar" id="navbar">
        <button type="button" class="navbar-back" id="navbarBack" style="display: none" aria-label="返回上一页">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M15.5 4l-8 8 8 8 1.5-1.5L10.5 12l6.5-6.5z" />
          </svg>
        </button>
        <div class="navbar-title" id="navbarTitle">路见</div>
        <div class="navbar-action" id="navbarAction"></div>
      </div>

      <!-- 页面内容区 -->
      <div class="phone-content" id="appContent">
        <div class="page-loading" aria-live="polite">
          <div class="loading-spinner" role="img" aria-label="加载中"></div>
          <p>加载中…</p>
        </div>
      </div>

      <!-- 底部 TabBar -->
      <nav class="phone-tabbar" id="tabbar" role="tablist">
        <button type="button" class="tabbar-item active" data-path="/" role="tab" aria-selected="true" aria-label="首页">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3z" />
          </svg>
          <span>首页</span>
        </button>
        <button type="button" class="tabbar-item" data-path="/my-reports" role="tab" aria-selected="false" aria-label="我的上报">
          <div class="tabbar-icon-wrap">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
              <path
                d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"
              />
            </svg>
            <span class="tabbar-badge" id="myReportsBadge" style="display:none;" aria-hidden="true">0</span>
          </div>
          <span>我的上报</span>
        </button>
        <button type="button" class="tabbar-item" data-path="/profile" role="tab" aria-selected="false" aria-label="我的">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 3-9 7v1h18v-1c0-4-4-7-9-7z"
            />
          </svg>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <!-- 返回入口 -->
    <a href="../index.html" class="back-to-entry">← 返回 Demo 入口</a>

    <!-- 共享层脚本 -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/mock-data.js"></script>
    <script src="../shared/mock-api.js"></script>
    <script src="../shared/mock-admin-api.js"></script>

    <!-- 高德地图 JS API，引入 Geolocation 和 Geocoder 插件 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=a47b35619b3fd91ba3c61ee001ccf472&plugin=AMap.Geolocation,AMap.Geocoder"></script>

    <!-- 页面脚本 -->
    <script src="./scripts/pages/index.js"></script>
    <script src="./scripts/pages/report.js"></script>
    <script src="./scripts/pages/my-reports.js"></script>
    <script src="./scripts/pages/report-detail.js"></script>
    <script src="./scripts/pages/verify.js"></script>
    <script src="./scripts/pages/profile.js"></script>

    <!-- 应用入口 -->
    <script src="./scripts/app.js"></script>
  </body>
</html>
