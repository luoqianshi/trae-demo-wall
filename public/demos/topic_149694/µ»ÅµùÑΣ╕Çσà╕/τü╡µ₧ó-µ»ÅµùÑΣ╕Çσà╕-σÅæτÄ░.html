<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>灵枢 · 每日一典 · 发现</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "STKaiti", "KaiTi", "Songti SC", serif; }
  body { background:#f7efd9; color:#2b1a10; }
  #app { max-width:420px; margin:0 auto; min-height:100vh; background:radial-gradient(ellipse at top, #f7efd9 0%, #ead7a9 100%); padding:20px 16px 80px; }

  /* 顶部统计 */
  .stats-card { background:linear-gradient(135deg, #8b2c2c 0%, #6b1f1f 100%); color:#fff8e1; padding:18px 12px; border-radius:8px; display:flex; align-items:center; justify-content:space-around; margin-bottom:14px; box-shadow:0 3px 10px rgba(139,44,44,0.25); }
  .stat { flex:1; display:flex; flex-direction:column; align-items:center; }
  .stat-num { font-size:22px; font-weight:800; color:#ffd700; font-family:'STKaiti','KaiTi',serif; }
  .stat-label { font-size:11px; margin-top:3px; opacity:0.85; letter-spacing:1px; }
  .stat-divider { width:1px; height:30px; background:rgba(255,248,225,0.3); }

  /* 简繁 + 健康 */
  .lang-row { display:flex; align-items:center; gap:10px; background:#fff8e1; border:1px solid #b88a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; }
  .lang-label { font-size:12px; color:#6b1f1f; font-weight:600; letter-spacing:1px; }
  .lang-toggle { display:flex; gap:5px; }
  .lang-pill { font-size:12px; padding:3px 10px; border-radius:15px; background:#f5e7c2; color:#8b2c2c; letter-spacing:1px; cursor:pointer; }
  .lang-pill.active { background:#8b2c2c; color:#fff8e1; }
  .health-dot { margin-left:auto; font-size:11px; letter-spacing:1px; }
  .health-dot.on { color:#4caf50; }
  .health-dot.off { color:#c8a060; }

  /* 搜索 */
  .search-block { background:#fff8e1; border:1px solid #b88a4a; border-radius:6px; padding:12px 14px; margin-bottom:14px; }
  .search-input-wrap { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid #b88a4a; border-radius:4px; padding:6px 10px; }
  .search-icon { font-size:14px; color:#8b2c2c; }
  .search-input { flex:1; font-size:13px; color:#2b1a10; border:none; outline:none; background:transparent; }
  .search-clear { font-size:18px; color:#b88a4a; padding:0 4px; cursor:pointer; }
  .scope-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .scope-pill { font-size:11px; padding:4px 10px; background:#f5e7c2; color:#8b2c2c; border-radius:14px; letter-spacing:1px; cursor:pointer; }
  .scope-pill.active { background:#8b2c2c; color:#fff8e1; }

  /* Section */
  .section { margin-bottom:14px; }
  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 2px; }
  .section-title { font-size:15px; font-weight:700; color:#6b1f1f; letter-spacing:2px; }
  .section-meta { font-size:11px; color:#8b6e4e; letter-spacing:1px; cursor:pointer; }

  /* Chip 网格 */
  .chip-grid { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { padding:7px 12px; background:#fff8e1; border:1px solid #b88a4a; border-radius:18px; font-size:12px; color:#2b1a10; letter-spacing:1px; cursor:pointer; }
  .chip.active { background:#8b2c2c; color:#fff8e1; border-color:#8b2c2c; }
  .chip-name { font-weight:600; }

  /* 当前过滤条件 */
  .active-filter { display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:#fff8e1; border:1px solid #b88a4a; border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .active-filter-label { font-size:11px; color:#6b1f1f; font-weight:600; }
  .active-chip { font-size:11px; padding:3px 8px; background:#8b2c2c; color:#fff8e1; border-radius:12px; }
  .active-clear { font-size:11px; color:#8b2c2c; text-decoration:underline; margin-left:auto; cursor:pointer; }

  /* 结果区 */
  .empty-hint { text-align:center; padding:24px 0; font-size:13px; color:#8b6e4e; background:#fff8e1; border:1px dashed #b88a4a; border-radius:6px; }
  .loading-hint { text-align:center; padding:24px 0; font-size:13px; color:#8b6e4e; background:#fff8e1; border-radius:6px; }

  .quote-row { background:linear-gradient(180deg, #fff8e1 0%, #f5e7c2 100%); border:1px solid #b88a4a; border-left:4px solid #8b2c2c; border-radius:4px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .quote-row:active { opacity:0.6; }
  .quote-row-content { display:block; font-size:14px; color:#2b1a10; font-weight:600; line-height:1.5; letter-spacing:1px; margin-bottom:5px; }
  .quote-row-source { font-size:11px; color:#8b6e4e; letter-spacing:1px; }

  .footer-hint { text-align:center; margin-top:24px; font-size:11px; color:#8b6e4e; letter-spacing:1px; opacity:0.7; }

  /* 弹窗 */
  .modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-content { background:#fff8e1; border:2px solid #b88a4a; border-radius:8px; padding:20px; max-width:340px; width:100%; }
  .modal-title { font-size:14px; font-weight:800; color:#6b1f1f; margin-bottom:10px; text-align:center; letter-spacing:2px; }
  .modal-body { font-size:13px; line-height:1.6; color:#2b1a10; }
  .modal-body .m-line { display:block; margin:3px 0; }
  .modal-body .m-source { display:block; margin-top:6px; color:#8b6e4e; font-size:11px; }
  .modal-body .m-translate { display:block; margin-top:8px; padding-top:8px; border-top:1px dashed #b88a4a; color:#4a2c20; font-size:12px; }
  .modal-close { display:block; width:100%; margin-top:14px; padding:8px; background:#8b2c2c; color:#fff8e1; border:none; border-radius:4px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <!-- 顶部统计 -->
  <div class="stats-card">
    <div class="stat"><span class="stat-num">371313</span><span class="stat-label">收录诗篇</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num">13577</span><span class="stat-label">作者</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num">11</span><span class="stat-label">朝代</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num">17</span><span class="stat-label">类型</span></div>
  </div>

  <!-- 简繁 + 健康 -->
  <div class="lang-row">
    <span class="lang-label">字体</span>
    <div class="lang-toggle">
      <span class="lang-pill active" id="lang-zhHans">简体</span>
      <span class="lang-pill" id="lang-zhHant">繁体</span>
    </div>
    <span class="health-dot on" id="health">● 诗泉连通</span>
  </div>

  <!-- 搜索框 -->
  <div class="search-block">
    <div class="search-input-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="keyword" type="text" placeholder="搜诗 · 标题 / 内容 / 作者" />
      <span class="search-clear" id="search-clear" style="display:none">×</span>
    </div>
    <div class="scope-row" id="scope-row">
      <span class="scope-pill active" data-scope="all">全文</span>
      <span class="scope-pill" data-scope="title">标题</span>
      <span class="scope-pill" data-scope="content">内容</span>
      <span class="scope-pill" data-scope="author">作者</span>
    </div>
  </div>

  <!-- 朝代 -->
  <div class="section" id="section-dynasty">
    <div class="section-header">
      <span class="section-title">⛩ 按朝代</span>
      <span class="section-meta">11 个</span>
    </div>
    <div class="chip-grid" id="dynasty-chips">
      <div class="chip" data-type="dynasty" data-value="先秦">先秦</div>
      <div class="chip" data-type="dynasty" data-value="两汉">两汉</div>
      <div class="chip" data-type="dynasty" data-value="魏晋">魏晋</div>
      <div class="chip" data-type="dynasty" data-value="南北朝">南北朝</div>
      <div class="chip" data-type="dynasty" data-value="隋">隋</div>
      <div class="chip" data-type="dynasty" data-value="唐">唐</div>
      <div class="chip" data-type="dynasty" data-value="五代">五代</div>
      <div class="chip" data-type="dynasty" data-value="宋">宋</div>
      <div class="chip" data-type="dynasty" data-value="元">元</div>
      <div class="chip" data-type="dynasty" data-value="清">清</div>
      <div class="chip" data-type="dynasty" data-value="其他">其他</div>
    </div>
  </div>

  <!-- 类型 -->
  <div class="section" id="section-type">
    <div class="section-header">
      <span class="section-title">⛁ 按类型</span>
      <span class="section-meta">17 种</span>
    </div>
    <div class="chip-grid" id="type-chips">
      <div class="chip" data-type="type" data-value="唐诗">唐诗</div>
      <div class="chip" data-type="type" data-value="五言绝句">五言绝句</div>
      <div class="chip" data-type="type" data-value="七言绝句">七言绝句</div>
      <div class="chip" data-type="type" data-value="五言律诗">五言律诗</div>
      <div class="chip" data-type="type" data-value="七言律诗">七言律诗</div>
      <div class="chip" data-type="type" data-value="五言古诗">五言古诗</div>
      <div class="chip" data-type="type" data-value="七言古诗">七言古诗</div>
      <div class="chip" data-type="type" data-value="乐府诗">乐府诗</div>
      <div class="chip" data-type="type" data-value="宋词">宋词</div>
      <div class="chip" data-type="type" data-value="五代词">五代词</div>
      <div class="chip" data-type="type" data-value="元曲">元曲</div>
      <div class="chip" data-type="type" data-value="蒙学">蒙学</div>
      <div class="chip" data-type="type" data-value="诗经">诗经</div>
      <div class="chip" data-type="type" data-value="论语">论语</div>
      <div class="chip" data-type="type" data-value="楚辞">楚辞</div>
      <div class="chip" data-type="type" data-value="四书五经">四书五经</div>
      <div class="chip" data-type="type" data-value="其他">其他</div>
    </div>
  </div>

  <!-- 当前过滤 -->
  <div class="active-filter" id="active-filter" style="display:none">
    <span class="active-filter-label">当前过滤：</span>
    <span class="active-chip" id="active-chip-dynasty" style="display:none">朝代 · -- ×</span>
    <span class="active-chip" id="active-chip-type" style="display:none">类型 · -- ×</span>
    <span class="active-clear" id="active-clear">清除全部</span>
  </div>

  <!-- 搜索结果 -->
  <div class="section" id="section-search" style="display:none">
    <div class="section-header">
      <span class="section-title" id="search-title">搜索结果 · 0 句</span>
      <span class="section-meta" id="search-back">‹ 返回筛选</span>
    </div>
    <div id="search-list"></div>
  </div>

  <div class="footer-hint">
    数据来源 · 诗泉 poetry.palemoky.com (公开 API · 无需 Key)
  </div>
</div>

<script>
// ========== 模拟数据 ==========
const POEM_POOL = [
  { id:'p1', content:'君问归期未有期，巴山夜雨涨秋池。', source:'李商隐《夜雨寄北》', author:'李商隐', dynasty:'唐' },
  { id:'p2', content:'行到水穷处，坐看云起时。', source:'王维《终南别业》', author:'王维', dynasty:'唐' },
  { id:'p3', content:'采菊东篱下，悠然见南山。', source:'陶渊明《饮酒·其五》', author:'陶渊明', dynasty:'东晋' },
  { id:'p4', content:'此情可待成追忆，只是当时已惘然。', source:'李商隐《锦瑟》', author:'李商隐', dynasty:'唐' },
  { id:'p5', content:'人生如逆旅，我亦是行人。', source:'苏轼《临江仙》', author:'苏轼', dynasty:'宋' },
  { id:'p6', content:'但愿人长久，千里共婵娟。', source:'苏轼《水调歌头》', author:'苏轼', dynasty:'宋' },
  { id:'p7', content:'山有木兮木有枝，心悦君兮君不知。', source:'佚名《越人歌》', author:'佚名', dynasty:'先秦' },
  { id:'p8', content:'众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。', source:'辛弃疾《青玉案》', author:'辛弃疾', dynasty:'宋' },
  { id:'p9', content:'春有百花秋有月，夏有凉风冬有雪。', source:'慧开禅师《无门关》', author:'慧开禅师', dynasty:'宋' },
  { id:'p10', content:'愿得一心人，白头不相离。', source:'卓文君《白头吟》', author:'卓文君', dynasty:'汉' },
  { id:'p11', content:'何当共剪西窗烛，却话巴山夜雨时。', source:'李商隐《夜雨寄北》', author:'李商隐', dynasty:'唐' },
  { id:'p12', content:'千淘万漉虽辛苦，吹尽狂沙始到金。', source:'刘禹锡《浪淘沙》', author:'刘禹锡', dynasty:'唐' },
  { id:'p13', content:'莫愁前路无知己，天下谁人不识君。', source:'高适《别董大》', author:'高适', dynasty:'唐' },
  { id:'p14', content:'沉舟侧畔千帆过，病树前头万木春。', source:'刘禹锡《酬乐天》', author:'刘禹锡', dynasty:'唐' },
  { id:'p15', content:'人生若只如初见，何事秋风悲画扇。', source:'纳兰性德《木兰花》', author:'纳兰性德', dynasty:'清' },
  { id:'p16', content:'我见青山多妩媚，料青山见我应如是。', source:'辛弃疾《贺新郎》', author:'辛弃疾', dynasty:'宋' },
  { id:'p17', content:'春风又绿江南岸，明月何时照我还。', source:'王安石《泊船瓜洲》', author:'王安石', dynasty:'宋' },
  { id:'p18', content:'海上生明月，天涯共此时。', source:'张九龄《望月怀远》', author:'张九龄', dynasty:'唐' },
  { id:'p19', content:'曾经沧海难为水，除却巫山不是云。', source:'元稹《离思》', author:'元稹', dynasty:'唐' },
  { id:'p20', content:'两情若是久长时，又岂在朝朝暮暮。', source:'秦观《鹊桥仙》', author:'秦观', dynasty:'宋' },
  { id:'p21', content:'去年今日此门中，人面桃花相映红。', source:'崔护《题都城南庄》', author:'崔护', dynasty:'唐' },
  { id:'p22', content:'沾衣欲湿杏花雨，吹面不寒杨柳风。', source:'志南《绝句》', author:'志南', dynasty:'宋' },
  { id:'p23', content:'枯藤老树昏鸦，小桥流水人家。', source:'马致远《天净沙》', author:'马致远', dynasty:'元' },
  { id:'p24', content:'问君能有几多愁，恰似一江春水向东流。', source:'李煜《虞美人》', author:'李煜', dynasty:'五代' },
  { id:'p25', content:'少年不识愁滋味，爱上层楼。', source:'辛弃疾《丑奴儿》', author:'辛弃疾', dynasty:'宋' },
];

const state = {
  keyword: '',
  scope: 'all',
  filter: { dynasty: '', type: '' },
  searchMode: false,
  results: [],
};

// ========== 过滤数据 ==========
function filterPoems() {
  let list = POEM_POOL.slice();
  if (state.filter.dynasty) list = list.filter(p => p.dynasty === state.filter.dynasty);
  if (state.filter.type) list = list.filter(p => p.source.indexOf(state.filter.type) >= 0 || p.content.indexOf(state.filter.type) >= 0);
  if (state.keyword) {
    const kw = state.keyword.toLowerCase();
    list = list.filter(p => {
      if (state.scope === 'all') return p.content.indexOf(kw) >= 0 || p.source.toLowerCase().indexOf(kw) >= 0 || p.author.toLowerCase().indexOf(kw) >= 0;
      if (state.scope === 'title') return p.source.toLowerCase().indexOf(kw) >= 0;
      if (state.scope === 'content') return p.content.indexOf(kw) >= 0;
      if (state.scope === 'author') return p.author.toLowerCase().indexOf(kw) >= 0;
      return true;
    });
  }
  return list;
}

// ========== 渲染 ==========
function renderResults(list) {
  const container = document.getElementById('search-list');
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-hint">没有匹配的诗，换个词试试</div>';
    return;
  }
  let html = '';
  for (const p of list) {
    html += `<div class="quote-row" data-id="${p.id}">
      <span class="quote-row-content">${p.content}</span>
      <span class="quote-row-source">— ${p.source}</span>
    </div>`;
  }
  container.innerHTML = html;

  // 绑定点击
  for (const el of container.querySelectorAll('.quote-row')) {
    el.onclick = () => {
      const p = POEM_POOL.find(x => x.id === el.dataset.id);
      if (!p) return;
      localStorage.setItem('current_card_quote', JSON.stringify(p));
      showModal({
        title: '已选好「' + (p.author || '佚名') + '」的诗',
        body: [
          { type:'line', text: p.content },
          { type:'source', text: '— ' + p.source },
          { type:'translate', text: '（演示版）请打开「生成卡片」页面查看效果。' },
        ]
      });
    };
  }
}

function updateUI() {
  // 顶部过滤条件显示
  const af = document.getElementById('active-filter');
  const acd = document.getElementById('active-chip-dynasty');
  const act = document.getElementById('active-chip-type');
  if (state.filter.dynasty) { acd.style.display = 'inline-block'; acd.textContent = '朝代 · ' + state.filter.dynasty + ' ×'; }
  else { acd.style.display = 'none'; }
  if (state.filter.type) { act.style.display = 'inline-block'; act.textContent = '类型 · ' + state.filter.type + ' ×'; }
  else { act.style.display = 'none'; }
  af.style.display = (state.filter.dynasty || state.filter.type) ? 'flex' : 'none';

  // 朝代/类型 chip active 状态
  for (const el of document.querySelectorAll('#dynasty-chips .chip')) {
    el.classList.toggle('active', el.dataset.value === state.filter.dynasty);
  }
  for (const el of document.querySelectorAll('#type-chips .chip')) {
    el.classList.toggle('active', el.dataset.value === state.filter.type);
  }
}

// ========== 事件 ==========

// 搜索
const keywordEl = document.getElementById('keyword');
const clearEl = document.getElementById('search-clear');
keywordEl.oninput = () => {
  state.keyword = keywordEl.value;
  clearEl.style.display = state.keyword ? 'inline' : 'none';
};
keywordEl.onkeydown = (e) => {
  if (e.key === 'Enter') doSearch();
};
clearEl.onclick = () => {
  keywordEl.value = '';
  state.keyword = '';
  clearEl.style.display = 'none';
  if (state.searchMode) doSearch();
};

function doSearch() {
  state.results = filterPoems();
  state.searchMode = true;
  document.getElementById('section-dynasty').style.display = 'none';
  document.getElementById('section-type').style.display = 'none';
  document.getElementById('active-filter').style.display = 'none';
  const sec = document.getElementById('section-search');
  sec.style.display = 'block';
  document.getElementById('search-title').textContent = (state.keyword ? ('搜索「' + state.keyword + '」') : '筛选结果') + ' · ' + state.results.length + ' 句';
  renderResults(state.results);
}

document.getElementById('search-back').onclick = () => {
  state.searchMode = false;
  document.getElementById('section-dynasty').style.display = 'block';
  document.getElementById('section-type').style.display = 'block';
  document.getElementById('section-search').style.display = 'none';
};

// 范围选择
for (const el of document.querySelectorAll('.scope-pill')) {
  el.onclick = () => {
    state.scope = el.dataset.scope;
    for (const x of document.querySelectorAll('.scope-pill')) x.classList.remove('active');
    el.classList.add('active');
    if (state.keyword) doSearch();
  };
}

// 朝代 / 类型 chip
for (const el of document.querySelectorAll('#dynasty-chips .chip, #type-chips .chip')) {
  el.onclick = () => {
    const type = el.dataset.type;
    const value = el.dataset.value;
    state.filter[type] = (state.filter[type] === value) ? '' : value;
    updateUI();
    if (state.filter.dynasty || state.filter.type) doSearch();
    else {
      // 没过滤条件了
      state.searchMode = false;
      document.getElementById('section-search').style.display = 'none';
      document.getElementById('section-dynasty').style.display = 'block';
      document.getElementById('section-type').style.display = 'block';
    }
  };
}

document.getElementById('active-clear').onclick = () => {
  state.filter = { dynasty: '', type: '' };
  state.searchMode = false;
  updateUI();
  document.getElementById('section-search').style.display = 'none';
  document.getElementById('section-dynasty').style.display = 'block';
  document.getElementById('section-type').style.display = 'block';
};

// 简繁
document.getElementById('lang-zhHans').onclick = () => {
  document.getElementById('lang-zhHans').classList.add('active');
  document.getElementById('lang-zhHant').classList.remove('active');
};
document.getElementById('lang-zhHant').onclick = () => {
  document.getElementById('lang-zhHant').classList.add('active');
  document.getElementById('lang-zhHans').classList.remove('active');
};

// ========== 弹窗 ==========
function showModal({ title, body }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-content">
    <div class="modal-title">${title}</div>
    <div class="modal-body">${body.map((b) => {
      if (b.type === 'line') return `<span class="m-line">${b.text}</span>`;
      if (b.type === 'source') return `<span class="m-source">${b.text}</span>`;
      if (b.type === 'translate') return `<span class="m-translate">${b.text}</span>`;
      return '';
    }).join('')}</div>
    <button class="modal-close">关闭</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.modal-close').onclick = () => document.body.removeChild(wrap);
  wrap.onclick = (e) => { if (e.target === wrap) document.body.removeChild(wrap); };
}
</script>
