<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>灵枢 · 每日一典 · 生成卡片</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "STKaiti", "KaiTi", "Songti SC", serif; }
  body { background:linear-gradient(180deg, #2a1a10 0%, #1a0f08 100%); color:#2b1a10; }
  #app { max-width:420px; margin:0 auto; min-height:100vh; padding:20px 16px 80px; color:#fff8e1; }

  /* 当前名句摘要 */
  .quote-info { background:rgba(255,248,225,0.1); border:1px solid rgba(255,248,225,0.2); border-radius:6px; padding:12px 14px; margin-bottom:14px; }
  .info-label { display:block; font-size:11px; color:#b88a4a; letter-spacing:2px; margin-bottom:5px; }
  .info-content { display:block; font-size:15px; color:#fff8e1; font-weight:600; letter-spacing:1px; line-height:1.4; }
  .info-source { display:block; font-size:11px; color:#b88a4a; margin-top:5px; letter-spacing:1px; }

  /* 卡片预览 */
  .card-wrap { display:flex; justify-content:center; margin:14px 0 24px; }
  canvas.card-canvas { border-radius:6px; box-shadow:0 6rpx 18px rgba(0,0,0,0.4); }

  /* 选项 */
  .option-block { margin-bottom:18px; }
  .option-title { display:block; font-size:12px; color:#b88a4a; letter-spacing:2px; margin-bottom:10px; font-weight:600; }
  .option-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .option-scroll::-webkit-scrollbar { display:none; }
  .option-chip { display:flex; align-items:center; justify-content:center; padding:9px 14px; border-radius:6px; border:1px solid rgba(255,248,225,0.2); min-width:80px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .option-chip.active { border-color:#8b2c2c; box-shadow:0 0 0 1px rgba(139,44,44,0.5); color:#fff8e1; font-weight:700; }
  .chip-name { color:#2b1a10; font-size:14px; font-weight:600; letter-spacing:2px; display:inline-block; min-width:1em; }
  .option-chip.active .chip-name { color:#fff8e1; }

  .opt-pill { font-family:"KaiTi","STKaiti","Songti SC",serif; transition:all 0.2s; }
  .opt-pill[data-font="kai"]  { font-family:"KaiTi","STKaiti","Songti SC",serif; }
  .opt-pill[data-font="xing"] { font-family:"STXingkai","Hannotate SC","KaiTi",cursive; }
  .opt-pill[data-font="li"]   { font-family:"STLiti","FangSong","KaiTi",serif; }

  .option-row { display:flex; gap:8px; }
  .opt-pill { flex:1; padding:9px 0; background:rgba(255,248,225,0.1); border:1px solid rgba(255,248,225,0.2); color:#f5e7c2; border-radius:5px; text-align:center; font-size:13px; letter-spacing:1px; cursor:pointer; }
  .opt-pill.active { background:#8b2c2c; color:#fff8e1; border-color:#8b2c2c; }

  /* 按钮 */
  .actions { display:flex; gap:8px; margin-top:24px; }
  .action-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:14px 0; border-radius:6px; font-size:14px; font-weight:600; letter-spacing:2px; cursor:pointer; }
  .btn-icon { font-size:18px; }
  .save-btn { background:linear-gradient(180deg, #a03535, #8b2c2c); color:#fff8e1; border:1px solid #6b1f1f; box-shadow:0 2px 6px rgba(139,44,44,0.4); }
  .share-btn { background:rgba(255,248,225,0.1); color:#f5e7c2; border:1px solid #b88a4a; }

  .footer-hint { text-align:center; margin-top:20px; font-size:11px; color:#b88a4a; letter-spacing:1px; opacity:0.6; }

  /* 弹窗 */
  .modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-content { background:#fff8e1; border:2px solid #b88a4a; border-radius:8px; padding:20px; max-width:340px; width:100%; }
  .modal-title { font-size:14px; font-weight:800; color:#6b1f1f; margin-bottom:10px; text-align:center; letter-spacing:2px; }
  .modal-body { font-size:13px; line-height:1.6; color:#2b1a10; }
  .modal-close { display:block; width:100%; margin-top:14px; padding:8px; background:#8b2c2c; color:#fff8e1; border:none; border-radius:4px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <!-- 当前名句 -->
  <div class="quote-info">
    <span class="info-label">正在制作</span>
    <span class="info-content" id="info-content">— 加载中 —</span>
    <span class="info-source" id="info-source"></span>
  </div>

  <!-- 卡片预览 -->
  <div class="card-wrap">
    <canvas id="card" class="card-canvas" width="300" height="400"></canvas>
  </div>

  <!-- 背景模板 -->
  <div class="option-block">
    <span class="option-title">① 背景模板</span>
    <div class="option-scroll" id="bg-list">
      <div class="option-chip active" data-bg="paper"><span class="chip-name">宣纸</span></div>
      <div class="option-chip" data-bg="ink"><span class="chip-name">水墨</span></div>
      <div class="option-chip" data-bg="bamboo"><span class="chip-name">竹简</span></div>
      <div class="option-chip" data-bg="moon"><span class="chip-name">月色</span></div>
      <div class="option-chip" data-bg="flower"><span class="chip-name">落花</span></div>
    </div>
  </div>

  <!-- 字体 -->
  <div class="option-block">
    <span class="option-title">② 书法字体</span>
    <div class="option-row" id="font-list">
      <div class="opt-pill active" data-font="kai">楷书</div>
      <div class="opt-pill" data-font="xing">行书</div>
      <div class="opt-pill" data-font="li">隶书</div>
    </div>
  </div>

  <!-- 印章 -->
  <div class="option-block">
    <span class="option-title">③ 印章文案</span>
    <div class="option-row" id="seal-list">
      <div class="opt-pill active" data-seal="灵枢">灵枢</div>
      <div class="opt-pill" data-seal="典">典</div>
      <div class="opt-pill" data-seal="日行">日行</div>
      <div class="opt-pill" data-seal="印">印</div>
    </div>
  </div>

  <!-- 操作 -->
  <div class="actions">
    <div class="action-btn save-btn" id="btn-save">
      <span class="btn-icon">⬇</span>
      <span>保存到相册</span>
    </div>
    <div class="action-btn share-btn" id="btn-share">
      <span class="btn-icon">⇗</span>
      <span>分享</span>
    </div>
  </div>

  <div class="footer-hint" id="footer-hint">卡片由 Canvas 实时生成 · 300×400</div>
</div>

<script>
// ========== 配置 ==========
const BGS = {
  paper:  { name:'宣纸', colors:['#fffaee','#f5e7c2','#ead7a9'], border:'#b88a4a', text:'#2b1a10' },
  ink:    { name:'水墨', colors:['#e8e8e8','#888','#2a2a2a'], border:'#444', text:'#1a1a1a' },
  bamboo: { name:'竹简', colors:['#d4c098','#a08055','#6b5535'], border:'#5a4525', text:'#3a2510' },
  moon:   { name:'月色', colors:['#2a2a3e','#1a1a2e','#0a0a1e'], border:'#ffd700', text:'#ffd700' },
  flower: { name:'落花', colors:['#f8d7da','#e8a5b0','#d4788a'], border:'#8b2c2c', text:'#6b1f1f' },
};
const FONTS = {
  kai: 'KaiTi,"STKaiti","Songti SC",serif',
  xing: 'STXingkai,"Hannotate SC","KaiTi",cursive',
  li:  '"STLiti","FangSong","KaiTi",serif',
};
const SEALS = {
  '灵枢':'灵枢', '典':'典', '日行':'日行', '印':'印',
};

// ========== 状态 ==========
const state = {
  bg: 'paper',
  font: 'kai',
  seal: '灵枢',
  quote: null,
};

// ========== 初始化 ==========
function init() {
  // 读取 URL 参数或 localStorage
  const params = new URLSearchParams(window.location.search);
  const qParam = params.get('q');
  if (qParam) {
    try { state.quote = JSON.parse(decodeURIComponent(qParam)); }
    catch (e) {}
  }
  if (!state.quote) {
    try {
      const stored = localStorage.getItem('current_card_quote');
      if (stored) state.quote = JSON.parse(stored);
    } catch (e) {}
  }
  if (!state.quote) {
    state.quote = {
      content: '采菊东篱下，悠然见南山。',
      source: '陶渊明《饮酒·其五》',
      author: '陶渊明',
      dynasty: '东晋',
    };
  }
  // 渲染摘要
  document.getElementById('info-content').textContent = state.quote.content;
  document.getElementById('info-source').textContent = state.quote.source ? '— ' + state.quote.source : '';
  // 渲染 canvas
  resizeCanvas();
  renderCard();
  // 同步背景模板字体预览
  updateBgFontPreview();
  // 绑定事件
  bindEvents();
}

// 背景模板文字跟随书法字体
function updateBgFontPreview() {
  const family = FONTS[state.font];
  for (const el of document.querySelectorAll('#bg-list .chip-name')) {
    el.style.fontFamily = family;
  }
}

function resizeCanvas() {
  const wrap = document.querySelector('.card-wrap');
  const w = Math.min((wrap.clientWidth || 320) - 8, 320);
  const h = w * 4 / 3;
  const canvas = document.getElementById('card');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  state.w = w; state.h = h;
  document.getElementById('footer-hint').textContent = '卡片由 Canvas 实时生成 · ' + Math.round(w) + '×' + Math.round(h);
}

// ========== 绘制卡片 ==========
function renderCard() {
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const w = state.w, h = state.h;
  const bg = BGS[state.bg];
  const fontFamily = FONTS[state.font];
  const sealText = state.quote && state.quote.author ? state.quote.author[0] : SEALS[state.seal];

  ctx.clearRect(0, 0, w, h);

  // 1) 背景渐变
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, bg.colors[0]);
  grad.addColorStop(0.5, bg.colors[1]);
  grad.addColorStop(1, bg.colors[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 2) 装饰圆点
  ctx.strokeStyle = bg.border;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(20, 20, 8, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(w-20, h-20, 8, 0, Math.PI*2); ctx.stroke();

  // 3) 内框
  ctx.strokeRect(10, 10, w-20, h-20);

  // 4) 顶部来源
  ctx.fillStyle = bg.text;
  ctx.font = '11px ' + fontFamily;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.globalAlpha = 0.6;
  ctx.fillText(state.quote.source || '', w/2, 24);
  ctx.globalAlpha = 1;

  // 5) 横线
  ctx.strokeStyle = bg.border;
  ctx.beginPath();
  ctx.moveTo(w*0.2, 44);
  ctx.lineTo(w*0.8, 44);
  ctx.stroke();

  // 6) 竖排主句（首句）
  const mainText = (state.quote.content || '花间一壶酒').split(/[，。；？！\n]/)[0] || state.quote.content;
  const chars = Array.from(mainText);
  // 自适应字号
  let fontSize = 24;
  const minFs = 14;
  while (fontSize > minFs) {
    ctx.font = 'bold ' + fontSize + 'px ' + fontFamily;
    if (ctx.measureText('中').width * chars.length < w * 0.8) break;
    fontSize -= 1;
  }
  ctx.fillStyle = bg.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lineH = fontSize * 1.6;
  const totalH = chars.length * lineH;
  const startY = (h - totalH) / 2 + lineH / 2 + 8;
  chars.forEach((ch, i) => {
    ctx.fillText(ch, w/2, startY + i * lineH);
  });

  // 7) 印章
  const sealX = w - 50;
  const sealY = h - 50;
  ctx.fillStyle = '#8b2c2c';
  ctx.fillRect(sealX - 16, sealY - 16, 32, 32);
  ctx.strokeStyle = '#fff8e1';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sealX - 14, sealY - 14, 28, 28);
  ctx.fillStyle = '#fff8e1';
  ctx.font = 'bold 14px KaiTi,"STKaiti",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(SEALS[state.seal] || '灵', sealX, sealY);

  // 8) 页脚
  ctx.fillStyle = bg.text;
  ctx.globalAlpha = 0.5;
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('灵枢 · 每日一典', 14, h - 12);
  ctx.textAlign = 'right';
  const d = new Date();
  const ds = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  ctx.fillText(ds, w - 14, h - 12);
  ctx.globalAlpha = 1;
}

// ========== 事件 ==========
function bindEvents() {
  for (const el of document.querySelectorAll('#bg-list .option-chip')) {
    el.onclick = () => {
      state.bg = el.dataset.bg;
      for (const x of document.querySelectorAll('#bg-list .option-chip')) x.classList.remove('active');
      el.classList.add('active');
      renderCard();
    };
  }
  for (const el of document.querySelectorAll('#font-list .opt-pill')) {
    el.onclick = () => {
      state.font = el.dataset.font;
      for (const x of document.querySelectorAll('#font-list .opt-pill')) x.classList.remove('active');
      el.classList.add('active');
      updateBgFontPreview();
      renderCard();
    };
  }
  for (const el of document.querySelectorAll('#seal-list .opt-pill')) {
    el.onclick = () => {
      state.seal = el.dataset.seal;
      for (const x of document.querySelectorAll('#seal-list .opt-pill')) x.classList.remove('active');
      el.classList.add('active');
      renderCard();
    };
  }

  document.getElementById('btn-save').onclick = () => {
    showModal({
      title: '已生成',
      body: '（演示版）实际保存到相册需要微信小程序环境调用 <code>wx.saveImageToPhotosAlbum</code>。\n\n你看到的卡片是 <b>HTML5 Canvas</b> 实时绘制的，与微信小程序渲染效果一致。'
    });
  };
  document.getElementById('btn-share').onclick = () => {
    showModal({
      title: '分享',
      body: '（演示版）实际分享需要调用微信 API。这里只展示卡片样式。'
    });
  };

  window.addEventListener('resize', () => { resizeCanvas(); renderCard(); });
}

// ========== 弹窗 ==========
function showModal({ title, body }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-content">
    <div class="modal-title">${title}</div>
    <div class="modal-body">${body}</div>
    <button class="modal-close">关闭</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.modal-close').onclick = () => document.body.removeChild(wrap);
  wrap.onclick = (e) => { if (e.target === wrap) document.body.removeChild(wrap); };
}

// ========== 启动 ==========
init();
</script>
</body>
</html>
