<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>灵枢 · 每日一典</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "STKaiti", "KaiTi", "Songti SC", serif; }
  body { background:#f7efd9; color:#2b1a10; }

  #app { max-width:420px; margin:0 auto; min-height:100vh; background:radial-gradient(ellipse at top, #f7efd9 0%, #ead7a9 100%); padding:20px 16px 80px; position:relative; }

  /* 日期 */
  .date-block { text-align:center; margin-bottom:18px; }
  .lunar { display:block; font-size:13px; color:#8b6e4e; letter-spacing:4px; }
  .day { display:block; font-size:40px; font-weight:800; color:#6b1f1f; letter-spacing:2px; line-height:1.2; text-shadow:1px 1px 0 rgba(184,138,74,0.2); }
  .solar { display:block; font-size:12px; color:#8b6e4e; letter-spacing:2px; }

  /* 主卡片 */
  .quote-card { background:linear-gradient(180deg, #fffaee 0%, #f5e7c2 100%); border:1px solid #b88a4a; border-radius:8px; padding:30px 20px 25px; margin:0 auto 20px; position:relative; box-shadow:0 3px 10px rgba(139,44,44,0.1); }
  .card-deco { position:absolute; width:14px; height:14px; border:1px solid #8b2c2c; border-radius:50%; }
  .card-deco.top-left { top:8px; left:8px; }
  .card-deco.bottom-right { bottom:8px; right:8px; }
  .quote-vertical { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:190px; padding:10px 0; }
  .char { display:block; font-size:28px; font-weight:700; color:#2b1a10; letter-spacing:4px; line-height:1.4; font-family:"KaiTi","STKaiti","Songti SC",serif; }
  .source-line { text-align:center; font-size:13px; color:#4a2c20; border-top:1px solid #b88a4a; border-bottom:1px solid #b88a4a; padding:8px 0; margin:15px 0 0; letter-spacing:2px; }

  .ai-block { background:rgba(255,250,230,0.7); border-left:3px solid #8b2c2c; padding:10px 12px; margin:15px 0 0; text-align:left; }
  .ai-tag { display:block; font-size:12px; color:#8b2c2c; font-weight:800; letter-spacing:2px; margin-bottom:4px; }
  .ai-text { font-size:14px; color:#2b1a10; line-height:1.7; }

  .full-poem { background:rgba(255,250,230,0.5); border:1px solid #b88a4a; border-radius:4px; padding:12px 14px; margin-top:14px; }
  .full-poem-label { display:block; font-size:11px; color:#8b2c2c; font-weight:800; letter-spacing:2px; margin-bottom:6px; }
  .full-poem-title { display:block; font-size:13px; color:#6b1f1f; font-weight:700; margin-bottom:6px; text-align:center; }
  .full-poem-line { display:block; font-size:14px; color:#2b1a10; line-height:1.7; letter-spacing:1px; text-align:center; }

  .translate { background:rgba(255,250,230,0.4); border:1px solid #b88a4a; border-radius:4px; padding:12px 14px; margin-top:10px; }
  .translate-label { display:block; font-size:11px; color:#8b2c2c; font-weight:800; letter-spacing:2px; margin-bottom:6px; }
  .translate-line { display:block; font-size:13px; color:#4a2c20; line-height:1.7; }

  .tags { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:15px; }
  .tag { display:inline-block; padding:3px 9px; background:rgba(139,44,44,0.08); color:#8b2c2c; font-size:11px; border-radius:50px; letter-spacing:1px; }

  /* 按钮 */
  .action-row { display:flex; gap:8px; margin-bottom:12px; }
  .action-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 0; border-radius:6px; font-size:13px; letter-spacing:1px; font-weight:600; cursor:pointer; user-select:none; }
  .action-btn .btn-icon { font-size:18px; margin-bottom:3px; }
  .btn-soft { background:#fff8e1; color:#8b2c2c; border:1px solid #b88a4a; }
  .btn-ghost { background:transparent; color:#8b2c2c; border:1px solid #8b2c2c; }
  .btn-primary { background:linear-gradient(180deg, #a03535, #8b2c2c); color:#fff8e1; border:1px solid #6b1f1f; box-shadow:0 2px 6px rgba(139,44,44,0.3); }

  .fav-bar { display:flex; justify-content:center; align-items:center; gap:4px; padding:8px 0; font-size:13px; color:#8b6e4e; letter-spacing:1px; cursor:pointer; }
  .fav-icon { font-size:16px; color:#b88a4a; }

  .footer-hint { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:25px; font-size:12px; color:#8b6e4e; letter-spacing:2px; }
  .dot { opacity:0.5; }

  .source-tag { position:fixed; bottom:60px; right:16px; background:rgba(155,50,50,0.85); color:#fff; font-size:10px; padding:4px 9px; border-radius:12px; letter-spacing:0.5px; z-index:999; box-shadow:0 2px 8px rgba(0,0,0,0.15); }

  /* 弹窗 */
  .modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-content { background:#fff8e1; border:2px solid #b88a4a; border-radius:8px; padding:24px; max-width:340px; width:100%; }
  .modal-title { font-size:16px; font-weight:800; color:#6b1f1f; margin-bottom:12px; text-align:center; letter-spacing:2px; }
  .modal-body { font-size:14px; line-height:1.7; color:#2b1a10; }
  .modal-body .m-line { display:block; margin:4px 0; }
  .modal-body .m-source { display:block; margin-top:8px; color:#8b6e4e; font-size:12px; }
  .modal-body .m-translate { display:block; margin-top:10px; padding-top:10px; border-top:1px dashed #b88a4a; color:#4a2c20; font-size:13px; }
  .modal-close { display:block; width:100%; margin-top:16px; padding:8px; background:#8b2c2c; color:#fff8e1; border:none; border-radius:4px; font-size:14px; cursor:pointer; }

  /* loading */
  .loading { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,248,225,0.3); border-top-color:#fff8e1; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="date-block">
    <span class="lunar" id="lunar">甲辰年</span>
    <span class="day" id="day">--</span>
    <span class="solar" id="solar">--</span>
  </div>

  <div class="quote-card">
    <div class="card-deco top-left"></div>
    <div class="card-deco bottom-right"></div>

    <div class="quote-vertical" id="quote-vertical">
      <span class="char">读</span>
    </div>

    <div class="source-line" id="source">— 《诗经·小雅》 —</div>

    <div class="ai-block">
      <span class="ai-tag">AI 解读</span>
      <span class="ai-text" id="ai-text">读一首诗，就是和一个不同时代的人对话。</span>
    </div>

    <div class="full-poem" id="full-poem" style="display:none">
      <span class="full-poem-label">全 诗</span>
      <span class="full-poem-title" id="poem-title">《诗经》</span>
      <span class="full-poem-line" id="poem-line-1">关关雎鸠</span>
    </div>

    <div class="translate" id="translate" style="display:none">
      <span class="translate-label">白 话 译 文</span>
      <span class="translate-line" id="translate-line-1">雎鸠鸟关关地叫着</span>
    </div>

    <div class="tags" id="tags"></div>
  </div>

  <div class="action-row">
    <div class="action-btn btn-soft" id="btn-change">
      <span class="btn-icon">⟳</span>
      <span>换一句</span>
    </div>
    <div class="action-btn btn-primary" id="btn-card">
      <span class="btn-icon">▣</span>
      <span>生成卡片</span>
    </div>
  </div>

  <div class="fav-bar" id="btn-fav">
    <span class="fav-icon" id="fav-icon">☆</span>
    <span id="fav-text">收藏此句</span>
  </div>

  <div class="footer-hint">
    <span>日拱一卒 · 功不唐捐</span>
    <span class="dot">·</span>
    <span>已连续打卡 <b id="streak">0</b> 天</span>
  </div>

  <div class="source-tag" id="source-tag">📜 加载中…</div>
</div>

<script>
// ========== 本地古诗库（15 首） ==========
const LOCAL_POEMS = [
  {
    id: 'l1',
    content: '采菊东篱下，悠然见南山。',
    source: '陶渊明《饮酒·其五》',
    author: '陶渊明',
    dynasty: '东晋',
    singleLine: '采菊东篱下，悠然见南山。',
    fullLines: ['结庐在人境，而无车马喧。','问君何能尔？心远地自偏。','采菊东篱下，悠然见南山。','山气日夕佳，飞鸟相与还。','此中有真意，欲辨已忘言。'],
    title: '饮酒·其五',
    translate: ['我家建在众人聚居的繁华道路，','然而没有烦神马车的喧闹。','请问你何能如此？心灵清远，地自静偏。','在东篱之下采摘菊花，悠然间，那远处的南山映入眼帘。','山中的气息与傍晚的景色十分好，','有飞鸟，结着伴儿归来。','这里面蕴含着人生的真谛，','想要辨识却不知怎样表达。'],
    tags: ['归隐', '田园', '淡泊']
  },
  {
    id: 'l2',
    content: '行到水穷处，坐看云起时。',
    source: '王维《终南别业》',
    author: '王维',
    dynasty: '唐',
    singleLine: '行到水穷处，坐看云起时。',
    fullLines: ['中岁颇好道，晚家南山陲。','兴来每独往，胜事空自知。','行到水穷处，坐看云起时。','偶然值林叟，谈笑无还期。'],
    title: '终南别业',
    translate: ['中年时我已颇信佛理，晚年时安家在南山边。','兴致来时常常独自漫游，遇到胜景只有我独赏。','走到流水的尽头，坐看行云变幻升腾。','偶然间遇到山林老人，与他谈笑竟忘了回家。'],
    tags: ['禅意', '山水', '豁达']
  },
  {
    id: 'l3',
    content: '此情可待成追忆，只是当时已惘然。',
    source: '李商隐《锦瑟》',
    author: '李商隐',
    dynasty: '唐',
    singleLine: '此情可待成追忆，只是当时已惘然。',
    fullLines: ['锦瑟无端五十弦，一弦一柱思华年。','庄生晓梦迷蝴蝶，望帝春心托杜鹃。','沧海月明珠有泪，蓝田日暖玉生烟。','此情可待成追忆，只是当时已惘然。'],
    title: '锦瑟',
    translate: ['锦瑟啊，你为什么要有五十根弦？','一弦一柱都让我思念逝去的青春年华。','庄周在清晨的梦中迷失了蝴蝶，望帝把春心都托付给了杜鹃。','明月映照着沧海，鲛人的眼泪成珠；','蓝田的日头晒暖了，美玉的烟气氤氲。','此情此景，等待将来也只会成为追忆，','而当时的我，已是茫然失意。'],
    tags: ['追忆', '怅惘', '深情']
  },
  {
    id: 'l4',
    content: '人生如逆旅，我亦是行人。',
    source: '苏轼《临江仙·送钱穆父》',
    author: '苏轼',
    dynasty: '宋',
    singleLine: '人生如逆旅，我亦是行人。',
    fullLines: ['一别都门三改火，天涯踏尽红尘。','依然一笑作春温。','无波真古井，有节是秋筠。','惆怅孤帆连夜发，送行淡月微云。','尊前不用翠眉颦。','人生如逆旅，我亦是行人。'],
    title: '临江仙·送钱穆父',
    translate: ['自从在京城分别以来，你我天各一方，已历三度寒食。','你走遍了天涯，饱经风霜，归来却仍是一张笑脸，气质如同春天般温暖。','你心如古井水，波澜不惊；气节像秋天的竹竿，清高有度。','今夜的送别，你将乘孤舟远去，连月色也显得淡薄，云也显得轻柔。','酒宴上不必让歌姬皱着眉头来助兴。','人生就像是一场逆行的旅程，我也不过是一个匆匆过客。'],
    tags: ['人生', '豁达', '送别']
  },
  {
    id: 'l5',
    content: '但愿人长久，千里共婵娟。',
    source: '苏轼《水调歌头》',
    author: '苏轼',
    dynasty: '宋',
    singleLine: '但愿人长久，千里共婵娟。',
    fullLines: ['明月几时有？把酒问青天。','不知天上宫阙，今夕是何年。','我欲乘风归去，又恐琼楼玉宇，高处不胜寒。','起舞弄清影，何似在人间。','转朱阁，低绮户，照无眠。','不应有恨，何事长向别时圆？','人有悲欢离合，月有阴晴圆缺，此事古难全。','但愿人长久，千里共婵娟。'],
    title: '水调歌头·明月几时有',
    translate: ['明月从什么时候才开始出现的？端起酒杯来向青天询问。','不知道在天上的宫殿，何年何月。','我想要乘御清风回到天上，又恐怕在美玉砌成的楼宇，受不住高耸九天的寒冷。','翩翩起舞玩赏着月下清影，哪里比得上人间。','月儿转过朱红色的楼阁，低低地挂在雕花的窗户上，照着没有睡意的自己。','明月不该对人们有什么怨恨吧，为什么偏在人们离别时才圆呢？','人有悲欢离合的变迁，月有阴晴圆缺的转换，这种事自古来难以周全。','只希望这世上所有人的亲人能平安健康，即便相隔千里，也能共享这美好的月光。'],
    tags: ['思念', '团圆', '祝福']
  },
  {
    id: 'l6',
    content: '山有木兮木有枝，心悦君兮君不知。',
    source: '佚名《越人歌》',
    author: '佚名',
    dynasty: '先秦',
    singleLine: '山有木兮木有枝，心悦君兮君不知。',
    fullLines: ['今夕何夕兮，搴舟中流。','今日何日兮，得与王子同舟。','蒙羞被好兮，不訾诟耻。','心几烦而不绝兮，得知王子。','山有木兮木有枝，心悦君兮君不知。'],
    title: '越人歌',
    translate: ['今晚是怎样的晚上啊，我驾着小舟在河中漫游。','今天是什么日子啊，我得以与王子同船。','承蒙王子看得起，不因为我出身低微而嫌弃。','我的心里激动不已，知道王子的尊贵。','山上有树啊树上有枝，','我心里喜欢您啊您却不知道。'],
    tags: ['暗恋', '古风', '深情']
  },
  {
    id: 'l7',
    content: '众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。',
    source: '辛弃疾《青玉案·元夕》',
    author: '辛弃疾',
    dynasty: '宋',
    singleLine: '蓦然回首，那人却在灯火阑珊处。',
    fullLines: ['东风夜放花千树，更吹落、星如雨。','宝马雕车香满路，凤箫声动，玉壶光转，一夜鱼龙舞。','蛾儿雪柳黄金缕，笑语盈盈暗香去。','众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。'],
    title: '青玉案·元夕',
    translate: ['东风吹开了元宵夜的火树银花，','花灯无数，像千树花开。','烟花如雨，飘落如星。','豪华的马车飘来阵阵香气，','凤箫声悠扬，玉壶般的月光流转，','鱼龙花灯整夜飞舞。','美人头戴蛾儿、雪柳、黄金缕，','笑语盈盈地走来，带着淡淡的香气。','我在人群中寻找她千百次，','蓦然回首，','那人却在，灯火稀疏的地方。'],
    tags: ['寻觅', '邂逅', '意境']
  },
  {
    id: 'l8',
    content: '春有百花秋有月，夏有凉风冬有雪。',
    source: '慧开禅师《无门关》',
    author: '慧开禅师',
    dynasty: '宋',
    singleLine: '若无闲事挂心头，便是人间好时节。',
    fullLines: ['春有百花秋有月，夏有凉风冬有雪。','若无闲事挂心头，便是人间好时节。'],
    title: '无门关·平常是道',
    translate: ['春天有百花盛开，秋天有明月高悬，','夏天有凉风徐徐，冬天有白雪皑皑。','如果没有烦恼忧愁挂在心头，','那么人间的每一天都是好时节。'],
    tags: ['禅意', '四季', '心境']
  },
  {
    id: 'l9',
    content: '愿得一心人，白头不相离。',
    source: '卓文君《白头吟》',
    author: '卓文君',
    dynasty: '汉',
    singleLine: '愿得一心人，白头不相离。',
    fullLines: ['皑如山上雪，皎若云间月。','闻君有两意，故来相决绝。','今日斗酒会，明旦沟水头。','躞蹀御沟上，沟水东西流。','凄凄复凄凄，嫁娶不须啼。','愿得一心人，白头不相离。','竹竿何袅袅，鱼尾何簁簁。','男儿重意气，何用钱刀为。'],
    title: '白头吟',
    translate: ['爱情应该像山上的雪一般纯洁，像云间的月亮一样光明。','听说你怀有二心，所以来与你决裂。','今天置酒作最后的聚会，明早就要在沟头分手。','我缓缓地走到御沟之上，沟水从东西两边流。','凄凉啊，凄凉啊，嫁娶不须啼哭。','但愿能遇到一个真心相爱之人，','白头到老，永不分离。','竹竿何其袅袅，鱼尾何其簁簁。','男儿应当重情义，何用金钱来衡量。'],
    tags: ['爱情', '决绝', '深情']
  },
  {
    id: 'l10',
    content: '何当共剪西窗烛，却话巴山夜雨时。',
    source: '李商隐《夜雨寄北》',
    author: '李商隐',
    dynasty: '唐',
    singleLine: '何当共剪西窗烛，却话巴山夜雨时。',
    fullLines: ['君问归期未有期，巴山夜雨涨秋池。','何当共剪西窗烛，却话巴山夜雨时。'],
    title: '夜雨寄北',
    translate: ['您问归期，归期实难说准，','巴山连夜暴雨，涨满秋池。','何时归去，共剪西窗烛花，','当面诉说，巴山夜雨况味。'],
    tags: ['思念', '爱情', '等待']
  },
  {
    id: 'l11',
    content: '千淘万漉虽辛苦，吹尽狂沙始到金。',
    source: '刘禹锡《浪淘沙》',
    author: '刘禹锡',

// ========== 状态 ==========
let state = {
  current: null,
  favorited: false,
  streak: 0,
  poemSource: '',
};

const FAV_KEY = 'lingshu_favs';
const STREAK_KEY = 'lingshu_streak';

// ========== 初始化 ==========
function init() {
  setDate();
  loadRandomPoem();
  state.streak = updateStreak();
  render();
}

// ========== 日期 ==========
function setDate() {
  const d = new Date();
  const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('solar').textContent = `${d.getFullYear()}年${months[d.getMonth()]}${d.getDate()}日`;
  document.getElementById('day').textContent = d.getDate() < 10 ? '0' + d.getDate() : '' + d.getDate();
  // 简化：直接用当前年份
  document.getElementById('lunar').textContent = '甲辰年';
}

// ========== 随机取诗 ==========
function loadRandomPoem() {
  // 模拟"诗泉 + 本地降级"
  // 真实环境会先调 https://poetry.palemoky.com/api/poems/random
  // 这里直接用本地，模拟"网络不可用"的情况
  const poem = LOCAL_POEMS[Math.floor(Math.random() * LOCAL_POEMS.length)];
  state.current = poem;
  state.favorited = isFav(poem.id);
  state.poemSource = '📜 本地诗库（HTML 演示版）';
}

// ========== 渲染 ==========
function render() {
  const q = state.current;
  if (!q) return;

  // 竖排名句
  const v = document.getElementById('quote-vertical');
  v.innerHTML = '';
  for (const ch of q.singleLine) {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = ch;
    v.appendChild(s);
  }

  document.getElementById('source').textContent = '— ' + q.source + ' —';
  document.getElementById('ai-text').textContent = aiText(q);

  // 全诗
  const fp = document.getElementById('full-poem');
  const fpl = fp.querySelectorAll('.full-poem-line');
  if (q.fullLines && q.fullLines.length > 0) {
    fp.style.display = 'block';
    document.getElementById('poem-title').textContent = '《' + q.title + '》';
    fpl.forEach((el) => el.remove());
    for (const line of q.fullLines) {
      const s = document.createElement('span');
      s.className = 'full-poem-line';
      s.textContent = line;
      fp.appendChild(s);
    }
  } else {
    fp.style.display = 'none';
  }

  // 译文
  const tr = document.getElementById('translate');
  const trl = tr.querySelectorAll('.translate-line');
  if (q.translate && q.translate.length > 0) {
    tr.style.display = 'block';
    trl.forEach((el) => el.remove());
    for (const line of q.translate) {
      const s = document.createElement('span');
      s.className = 'translate-line';
      s.textContent = line;
      tr.appendChild(s);
    }
  } else {
    tr.style.display = 'none';
  }

  // 标签
  const tags = document.getElementById('tags');
  tags.innerHTML = '';
  for (const t of q.tags || []) {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = '#' + t;
    tags.appendChild(s);
  }

  // 收藏
  document.getElementById('fav-icon').textContent = state.favorited ? '★' : '☆';
  document.getElementById('fav-text').textContent = state.favorited ? '已收藏' : '收藏此句';

  // 来源
  document.getElementById('source-tag').textContent = state.poemSource;

  // 打卡
  document.getElementById('streak').textContent = state.streak;
}

// ========== AI 解读（基于规则） ==========
function aiText(q) {
  const tags = q.tags || [];
  const tagText = tags.join('、');
  return `「${q.singleLine}」——${tagText || '千古名句'}。千年后读来，仍能直击人心。古人不见今时月，今月曾经照古人。`;
}

// ========== 收藏 ==========
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
  catch (e) { return []; }
}
function setFavs(arr) {
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
}
function isFav(id) { return getFavs().indexOf(id) >= 0; }
function toggleFav(id) {
  const favs = getFavs();
  const idx = favs.indexOf(id);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push(id);
  setFavs(favs);
  return idx < 0;
}

// ========== 打卡 ==========
function updateStreak() {
  let data;
  try { data = JSON.parse(localStorage.getItem(STREAK_KEY) || '{}'); }
  catch (e) { data = {}; }
  const today = new Date().toDateString();
  if (data.lastDate === today) return data.streak || 1;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.toDateString();
  const newStreak = (data.lastDate === yest) ? (data.streak || 0) + 1 : 1;
  localStorage.setItem(STREAK_KEY, JSON.stringify({ lastDate: today, streak: newStreak }));
  return newStreak;
}

// ========== 事件 ==========
document.getElementById('btn-change').onclick = () => {
  loadRandomPoem();
  render();
};

document.getElementById('btn-fav').onclick = () => {
  if (!state.current) return;
  state.favorited = toggleFav(state.current.id);
  render();
};

document.getElementById('btn-card').onclick = () => {
  if (!state.current) return;
  // 模拟生成卡片：弹窗显示
  const q = state.current;
  showModal({
    title: '古风卡片预览',
    body: [
      { type: 'line', text: q.singleLine },
      { type: 'source', text: '— ' + q.source },
      { type: 'translate', text: (q.translate || []).join(' ') },
      { type: 'source', text: '（演示版 · 实际保存到相册需微信环境）' },
    ]
  });
};

function showModal({ title, body }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-content">
    <div class="modal-title">${title}</div>
    <div class="modal-body">${body.map((b) => {
      if (b.type === 'line') return `<span class="m-line">${b.text}</span>`;
      if (b.type === 'source') return `<span class="m-source">${b.text}</span>`;
      if (b.type === 'translate') return `<span class="m-translate">${b.text}</span>`;
      return '';
    }).join('')}</div>
    <button class="modal-close">关闭</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.modal-close').onclick = () => document.body.removeChild(wrap);
  wrap.onclick = (e) => { if (e.target === wrap) document.body.removeChild(wrap); };
}

// ========== 启动 ==========
init();
</script>
