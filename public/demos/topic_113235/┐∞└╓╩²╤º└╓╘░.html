<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐数学乐园 - 幼儿园数学启蒙</title>
    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 页面背景 ===== */
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 头部标题区 ===== */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 0 0 40px 40px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255,255,255,0.95);
            font-size: 1.2em;
            font-weight: 500;
        }

        /* ===== 顶部奖励栏 ===== */
        .reward-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .reward-item {
            background: rgba(255,255,255,0.85);
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ff6b6b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s ease;
        }

        .reward-item.pop {
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* ===== 主内容区 ===== */
        .main-content {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ===== 游戏卡片 ===== */
        .game-section {
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.8em;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title span {
            font-size: 1.5em;
        }

        .section-subtitle {
            text-align: center;
            color: #888;
            font-size: 1em;
            margin-top: -18px;
            margin-bottom: 22px;
        }

        /* ===== 数字认知区 ===== */
        .number-showcase {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .number-card {
            background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .number-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #ff9a9e;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .number-card:active {
            transform: translateY(-2px) scale(1.02);
        }

        .number-card .num {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .number-card .items {
            font-size: 1.5em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .number-card .word {
            font-size: 1em;
            color: #666;
            margin-top: 5px;
        }

        /* ===== 计数游戏 ===== */
        .counting-game {
            text-align: center;
        }

        .counting-area {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 25px;
            padding: 30px;
            margin: 20px 0;
            min-height: 200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .counting-item {
            font-size: 3em;
            animation: bounce 1s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .counting-item:hover {
            transform: scale(1.2);
        }

        .counting-item.counted {
            animation: countedPop 0.3s ease;
        }

        @keyframes countedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .counting-question {
            font-size: 1.8em;
            color: #333;
            margin: 20px 0;
        }

        .counting-hint {
            font-size: 1em;
            color: #888;
            margin-bottom: 15px;
        }

        .answer-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .answer-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #ff9a9e, #ff6b6b);
            color: #fff;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
        }

        .answer-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .answer-btn.correct {
            background: linear-gradient(145deg, #7bed9f, #2ed573);
            animation: pulse 0.5s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            animation: shake 0.5s ease;
        }

        .answer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ===== 加减法游戏 ===== */
        .math-game {
            text-align: center;
        }

        .math-problem {
            font-size: 3em;
            color: #333;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .math-problem .symbol {
            color: #ff6b6b;
            margin: 0 10px;
        }

        .math-problem .equals {
            color: #666;
            margin: 0 10px;
        }

        .math-visual {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 15px 0;
            font-size: 2em;
            min-height: 50px;
            flex-wrap: wrap;
        }

        .math-visual-group {
            background: rgba(255,255,255,0.6);
            padding: 8px 15px;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            max-width: 200px;
            gap: 2px;
            justify-content: center;
        }

        .math-input {
            width: 120px;
            height: 60px;
            font-size: 2em;
            text-align: center;
            border: 3px solid #ff9a9e;
            border-radius: 15px;
            outline: none;
            margin: 0 10px;
        }

        .math-input:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }

        .check-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(145deg, #74b9ff, #0984e3);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(9, 132, 227, 0.4);
            margin: 10px 8px;
        }

        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(9, 132, 227, 0.5);
        }

        .check-btn.next-btn {
            background: linear-gradient(145deg, #7bed9f, #2ed573);
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.4);
        }

        .result-message {
            font-size: 1.8em;
            margin-top: 15px;
            min-height: 40px;
        }

        .result-message.success {
            color: #2ed573;
        }

        .result-message.error {
            color: #ff6b6b;
        }

        /* ===== 形状认知 ===== */
        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .shape-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .shape-card:hover {
            border-color: #74b9ff;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(116, 185, 255, 0.3);
        }

        .shape-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            transition: transform 0.3s ease;
        }

        .shape-card:hover .shape-icon {
            transform: rotate(10deg) scale(1.1);
        }

        .shape-name {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        .shape-tip {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }

        /* ===== 找形状小游戏 ===== */
        .find-game {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6f0 100%);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .find-question {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .find-target {
            display: inline-block;
            background: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            margin: 0 8px;
            vertical-align: middle;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .find-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .find-option {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .find-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .find-option.correct {
            border-color: #2ed573;
            background: #d4f5dd;
            animation: pulse 0.5s ease;
        }

        .find-option.wrong {
            border-color: #ff6b6b;
            animation: shake 0.5s ease;
        }

        .find-option svg {
            width: 60px;
            height: 60px;
        }

        /* ===== 反馈动画 ===== */
        .feedback-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
            max-width: 90vw;
        }

        .feedback-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-popup .emoji {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .feedback-popup .text {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
        }

        .feedback-popup .sub-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 18px;
        }

        .feedback-popup .big-number {
            font-size: 6em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }

        .feedback-popup .big-items {
            font-size: 2.5em;
            margin: 15px 0;
            letter-spacing: 5px;
            word-break: break-all;
            line-height: 1.6;
        }

        .feedback-popup .big-word {
            font-size: 2em;
            color: #0984e3;
            font-weight: bold;
        }

        .feedback-popup .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f1f1f1;
            color: #666;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .feedback-popup .close-btn:hover {
            background: #ff6b6b;
            color: #fff;
            transform: rotate(90deg);
        }

        .feedback-popup .speak-btn {
            padding: 10px 25px;
            font-size: 1.1em;
            background: linear-gradient(145deg, #a8edea, #74b9ff);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .feedback-popup .speak-btn:hover {
            transform: scale(1.05);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* ===== 飘落星星动画 ===== */
        .falling-star {
            position: fixed;
            font-size: 2em;
            pointer-events: none;
            z-index: 1001;
            animation: fallDown 1.5s ease-in forwards;
        }

        @keyframes fallDown {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(400px) rotate(360deg);
            }
        }

        /* ===== 底部装饰 ===== */
        .footer {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 0.9em;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .number-showcase {
                grid-template-columns: repeat(3, 1fr);
            }

            .shapes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .find-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .math-problem {
                font-size: 2em;
            }

            .reward-bar {
                gap: 15px;
            }

            .reward-item {
                font-size: 1em;
                padding: 6px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 头部标题 -->
    <header class="header">
        <h1>🎈 快乐数学乐园 🎈</h1>
        <p>和小动物们一起学数学吧！</p>
        <!-- 顶部奖励栏：实时显示孩子获得的星星、得分和连击 -->
        <div class="reward-bar">
            <div class="reward-item" id="starReward">⭐ 星星：<span id="starCount">0</span></div>
            <div class="reward-item" id="scoreReward">🏆 得分：<span id="scoreCount">0</span></div>
            <div class="reward-item" id="comboReward">🔥 连击：<span id="comboCount">0</span></div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main-content">

        <!-- 数字认知 -->
        <section class="game-section">
            <h2 class="section-title"><span>🔢</span> 认识数字</h2>
            <p class="section-subtitle">点击数字卡片，看看它像什么~</p>
            <div class="number-showcase" id="numberShowcase"></div>
        </section>

        <!-- 计数游戏 -->
        <section class="game-section">
            <h2 class="section-title"><span>🎯</span> 数数小游戏</h2>
            <p class="section-subtitle">数一数有几个小动物，点击正确答案~</p>
            <div class="counting-game">
                <p class="counting-question" id="countQuestion">数一数有多少个小动物？</p>
                <p class="counting-hint">小提示：可以点一指小动物帮忙数哦~</p>
                <div class="counting-area" id="countingArea"></div>
                <div class="answer-buttons" id="answerButtons"></div>
            </div>
        </section>

        <!-- 加减法 -->
        <section class="game-section">
            <h2 class="section-title"><span>🧮</span> 简单加减</h2>
            <p class="section-subtitle">算一算，把答案填进去，按"检查答案"或回车键~</p>
            <div class="math-game">
                <div class="math-problem" id="mathProblem">
                    <span id="num1">2</span>
                    <span class="symbol" id="operator">+</span>
                    <span id="num2">3</span>
                    <span class="equals">=</span>
                    <span class="symbol">?</span>
                </div>
                <!-- 可视化计数辅助：用emoji展示数量，帮助孩子理解 -->
                <div class="math-visual" id="mathVisual"></div>
                <input type="number" class="math-input" id="mathAnswer" min="0" max="20" placeholder="?">
                <br>
                <button class="check-btn" onclick="checkMathAnswer()">检查答案</button>
                <button class="check-btn next-btn" onclick="generateMathProblem()">换一题</button>
                <div class="result-message" id="mathResult"></div>
            </div>
        </section>

        <!-- 形状认知 -->
        <section class="game-section">
            <h2 class="section-title"><span>🔷</span> 认识形状</h2>
            <p class="section-subtitle">点击形状听介绍，再玩"找一找"游戏~</p>
            <div class="shapes-grid">
                <div class="shape-card" onclick="showShape('circle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="#ff6b6b"/>
                    </svg>
                    <div class="shape-name">圆形</div>
                    <div class="shape-tip">像太阳一样圆圆的</div>
                </div>
                <div class="shape-card" onclick="showShape('square')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <rect x="15" y="15" width="70" height="70" fill="#74b9ff"/>
                    </svg>
                    <div class="shape-name">正方形</div>
                    <div class="shape-tip">四条边一样长</div>
                </div>
                <div class="shape-card" onclick="showShape('triangle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <polygon points="50,10 90,90 10,90" fill="#ffe66d"/>
                    </svg>
                    <div class="shape-name">三角形</div>
                    <div class="shape-tip">有三个角</div>
                </div>
                <div class="shape-card" onclick="showShape('rectangle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <rect x="10" y="30" width="80" height="50" fill="#7bed9f"/>
                    </svg>
                    <div class="shape-name">长方形</div>
                    <div class="shape-tip">像门一样长长的</div>
                </div>
            </div>

            <!-- 找形状小游戏：随机给出形状，孩子从4个选项中找出对应 -->
            <div class="find-game">
                <p class="find-question">
                    找一找：哪个是 <span class="find-target" id="findTarget"></span> ？
                </p>
                <div class="find-options" id="findOptions"></div>
            </div>
        </section>

    </main>

    <!-- 反馈弹窗 -->
    <div class="overlay" id="overlay"></div>
    <div class="feedback-popup" id="feedbackPopup">
        <button class="close-btn" onclick="closeFeedback()" title="关闭">✕</button>
        <div class="emoji" id="feedbackEmoji">🎉</div>
        <div class="text" id="feedbackText">太棒了！</div>
        <div class="sub-text" id="feedbackSubText"></div>
        <div class="big-number" id="feedbackBigNum" style="display:none;"></div>
        <div class="big-items" id="feedbackBigItems" style="display:none;"></div>
        <div class="big-word" id="feedbackBigWord" style="display:none;"></div>
        <button class="speak-btn" id="speakBtn" style="display:none;" onclick="speakFeedback()">🔊 听一听</button>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        <p>🎈 快乐数学乐园 - 让每个孩子爱上数学 🎈</p>
    </footer>

    <script>
        /* =========================================================
         * 全局奖励系统
         * 用星星、得分、连击三个指标激励孩子持续学习
         * ========================================================= */
        let totalStars = 0;    // 累计星星
        let totalScore = 0;    // 累计得分
        let comboCount = 0;    // 当前连击数

        // 中文数字映射：用于朗读和数字认知展示
        const chineseNums = ['零','一','二','三','四','五','六','七','八','九','十'];
        // 每个数字对应的物品emoji及中文名称：用于数字认知展示和朗读
        const numberItems = [
            { emoji: '🍎', name: '苹果' },
            { emoji: '🍌', name: '香蕉' },
            { emoji: '🍊', name: '橘子' },
            { emoji: '🍇', name: '葡萄' },
            { emoji: '🍓', name: '草莓' },
            { emoji: '🐟', name: '小鱼' },
            { emoji: '🌟', name: '星星' },
            { emoji: '🦋', name: '蝴蝶' },
            { emoji: '🌸', name: '花朵' },
            { emoji: '⭐', name: '星星' }
        ];

        /**
         * 奖励增加：答对题目时调用
         * @param {number} stars - 获得的星星数
         * @param {number} score - 获得的分数
         */
        function addReward(stars = 1, score = 10) {
            totalStars += stars;
            totalScore += score;
            comboCount += 1;
            updateRewardDisplay();
            createFallingStars(stars);
        }

        /**
         * 连击中断：答错题目时调用
         */
        function breakCombo() {
            comboCount = 0;
            updateRewardDisplay();
        }

        /**
         * 更新奖励栏显示，并触发数字弹跳动画
         */
        function updateRewardDisplay() {
            document.getElementById('starCount').textContent = totalStars;
            document.getElementById('scoreCount').textContent = totalScore;
            document.getElementById('comboCount').textContent = comboCount;

            // 触发弹跳动画
            ['starReward', 'scoreReward', 'comboReward'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('pop');
                void el.offsetWidth; // 触发重绘
                el.classList.add('pop');
            });
        }

        /**
         * 创建飘落星星动画：增强视觉反馈
         * @param {number} count - 星星数量
         */
        function createFallingStars(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'falling-star';
                    star.textContent = '⭐';
                    star.style.left = (Math.random() * window.innerWidth) + 'px';
                    star.style.top = '50px';
                    document.body.appendChild(star);
                    setTimeout(() => star.remove(), 1500);
                }, i * 150);
            }
        }

        /* =========================================================
         * 语音朗读功能
         * 使用浏览器原生 Web Speech API，无需任何后端服务
         * ========================================================= */
        let speechSynthesisAvailable = 'speechSynthesis' in window;

        /**
         * 朗读中文文本
         * @param {string} text - 要朗读的文本
         */
        function speak(text) {
            if (!speechSynthesisAvailable) return;
            try {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-CN';
                utter.rate = 0.9; // 稍慢语速便于孩子听清
                window.speechSynthesis.speak(utter);
            } catch (e) {
                // 朗读失败静默处理，不影响主流程
            }
        }

        // 当前弹窗要朗读的内容
        let currentSpeakText = '';

        /**
         * 朗读弹窗内容
         */
        function speakFeedback() {
            if (currentSpeakText) speak(currentSpeakText);
        }

        /* =========================================================
         * 数字认知模块
         * ========================================================= */

        /**
         * 初始化数字卡片：动态生成1-10的数字卡片
         * 每个数字展示对应数量的重复物品，直观体现数量概念
         */
        function initNumberCards() {
            const showcase = document.getElementById('numberShowcase');
            let html = '';
            for (let i = 1; i <= 10; i++) {
                const item = numberItems[i - 1];
                const items = item.emoji.repeat(i);
                html += `
                    <div class="number-card" onclick="playNumber(${i})">
                        <div class="num">${i}</div>
                        <div class="items">${items}</div>
                        <div class="word">${chineseNums[i]}</div>
                    </div>
                `;
            }
            showcase.innerHTML = html;
        }

        /**
         * 点击数字卡片：弹窗展示数字、对应数量物品、中文大写，并朗读
         * 朗读内容为"数字X，中文，X个物品名"，避免重复读物品
         * @param {number} num - 数字
         */
        function playNumber(num) {
            const item = numberItems[num - 1];
            const items = item.emoji.repeat(num);
            const word = chineseNums[num];
            const speakText = `数字${num}，${word}，${num}个${item.name}`;

            showFeedback({
                emoji: item.emoji,
                text: `这是数字 ${num}`,
                subText: `${num}个${item.name}`,
                bigNumber: num,
                bigItems: items,
                bigWord: word,
                speakText: speakText,
                showSpeak: true
            });
            speak(speakText);
        }

        /* =========================================================
         * 计数游戏模块
         * ========================================================= */
        const countingAnimals = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐸', '🐷'];
        let currentCount = 0;        // 当前题目正确答案
        let countAnswered = false;   // 当前题是否已作答

        /**
         * 初始化计数游戏：随机生成小动物和4个选项
         */
        function initCountingGame() {
            countAnswered = false;
            currentCount = Math.floor(Math.random() * 6) + 2; // 2-7
            const animal = countingAnimals[Math.floor(Math.random() * countingAnimals.length)];

            // 生成小动物
            let animalsHTML = '';
            for (let i = 0; i < currentCount; i++) {
                animalsHTML += `<span class="counting-item" style="animation-delay: ${i * 0.1}s" onclick="markCounted(this)">${animal}</span>`;
            }
            document.getElementById('countingArea').innerHTML = animalsHTML;

            // 生成4个答案按钮，包含正确答案
            const correctIndex = Math.floor(Math.random() * 4);
            let answers = [];
            for (let i = 0; i < 4; i++) {
                if (i === correctIndex) {
                    answers.push(currentCount);
                } else {
                    let wrongAnswer;
                    do {
                        wrongAnswer = Math.floor(Math.random() * 8) + 1;
                    } while (wrongAnswer === currentCount || answers.includes(wrongAnswer));
                    answers.push(wrongAnswer);
                }
            }

            let buttonsHTML = '';
            answers.forEach((answer) => {
                buttonsHTML += `<button class="answer-btn" onclick="checkCountAnswer(${answer}, this)">${answer}</button>`;
            });
            document.getElementById('answerButtons').innerHTML = buttonsHTML;
        }

        /**
         * 标记已数过的小动物：辅助孩子点数
         */
        function markCounted(el) {
            el.classList.remove('counted');
            void el.offsetWidth;
            el.classList.add('counted');
        }

        /**
         * 检查计数答案：正确则奖励并自动出下一题，错误则中断连击
         */
        function checkCountAnswer(answer, btn) {
            if (countAnswered) return;
            countAnswered = true;

            if (answer === currentCount) {
                btn.classList.add('correct');
                addReward(1, 10);
                const praise = ['数对了！真聪明！', '太棒了！数得真准！', '完美！你是最棒的！', '答对啦！继续加油！'];
                const text = praise[Math.floor(Math.random() * praise.length)];
                showFeedback({
                    emoji: '🎉',
                    text: text,
                    subText: `一共有 ${currentCount} 个小动物`,
                    speakText: text
                });
                speak(text);
                // 禁用所有按钮，2秒后出下一题
                disableAnswerButtons();
                setTimeout(initCountingGame, 2000);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 500);
                countAnswered = false; // 答错允许继续尝试
                breakCombo();
                const encourage = ['再数数看！', '差一点点，再试试！', '别灰心，慢慢数~'];
                const text = encourage[Math.floor(Math.random() * encourage.length)];
                showFeedback({
                    emoji: '💪',
                    text: text,
                    subText: `再仔细数一遍吧`,
                    speakText: text
                });
                speak(text);
            }
        }

        /**
         * 禁用所有答案按钮
         */
        function disableAnswerButtons() {
            document.querySelectorAll('#answerButtons .answer-btn').forEach(btn => {
                btn.disabled = true;
            });
        }

        /* =========================================================
         * 加减法游戏模块
         * ========================================================= */
        let currentMathAnswer = 0;  // 当前题目正确答案
        let mathAnswered = false;   // 当前题是否已作答

        /**
         * 生成加减法题目：10以内加减法，并提供可视化emoji辅助
         */
        function generateMathProblem() {
            mathAnswered = false;
            const isAddition = Math.random() > 0.5;
            let num1, num2, result;
            let operatorSymbol;

            if (isAddition) {
                num1 = Math.floor(Math.random() * 6) + 1; // 1-6
                num2 = Math.floor(Math.random() * 6) + 1; // 1-6
                result = num1 + num2;
                operatorSymbol = '+';
            } else {
                num1 = Math.floor(Math.random() * 8) + 2; // 2-9
                num2 = Math.floor(Math.random() * num1) + 1; // 确保结果非负
                result = num1 - num2;
                operatorSymbol = '-';
            }

            currentMathAnswer = result;
            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;
            document.getElementById('operator').textContent = operatorSymbol;
            document.getElementById('mathAnswer').value = '';
            document.getElementById('mathResult').textContent = '';
            document.getElementById('mathResult').className = 'result-message';

            // 生成可视化emoji辅助：用苹果表示数量
            const emoji = '🍎';
            let visualHTML = '';
            if (operatorSymbol === '+') {
                visualHTML += `<div class="math-visual-group">${emoji.repeat(num1)}</div>`;
                visualHTML += `<div style="font-size:1.5em;color:#ff6b6b;align-self:center;">+</div>`;
                visualHTML += `<div class="math-visual-group">${emoji.repeat(num2)}</div>`;
            } else {
                visualHTML += `<div class="math-visual-group">${emoji.repeat(num1)}</div>`;
                visualHTML += `<div style="font-size:1.5em;color:#ff6b6b;align-self:center;">-</div>`;
                visualHTML += `<div class="math-visual-group">${emoji.repeat(num2)}</div>`;
            }
            document.getElementById('mathVisual').innerHTML = visualHTML;

            // 让输入框获取焦点
            document.getElementById('mathAnswer').focus();
        }

        /**
         * 检查加减法答案：支持回车提交
         */
        function checkMathAnswer() {
            if (mathAnswered) return;
            const inputVal = document.getElementById('mathAnswer').value;
            if (inputVal === '') {
                showFeedback({
                    emoji: '🤔',
                    text: '填一个数字吧~',
                    subText: '把你的答案填进去',
                    speakText: '填一个数字吧'
                });
                speak('填一个数字吧');
                return;
            }

            mathAnswered = true;
            const userAnswer = parseInt(inputVal);
            const resultDiv = document.getElementById('mathResult');

            if (userAnswer === currentMathAnswer) {
                resultDiv.textContent = '🎉 太棒了！完全正确！';
                resultDiv.className = 'result-message success';
                addReward(2, 15);
                const praise = `答对啦！${document.getElementById('num1').textContent} ${document.getElementById('operator').textContent} ${document.getElementById('num2').textContent} 等于 ${currentMathAnswer}`;
                showFeedback({
                    emoji: '🎉',
                    text: '太棒了！完全正确！',
                    subText: praise,
                    speakText: praise
                });
                speak(praise);
                // 2秒后自动出下一题
                setTimeout(generateMathProblem, 2000);
            } else {
                mathAnswered = false; // 答错允许继续尝试
                breakCombo();
                resultDiv.textContent = '💪 加油！再想想看~';
                resultDiv.className = 'result-message error';
                showFeedback({
                    emoji: '💪',
                    text: '加油！再想想看~',
                    subText: '可以数一数上面的苹果哦',
                    speakText: '加油，再想想看'
                });
                speak('加油，再想想看');
            }
        }

        /**
         * 输入框回车事件：按下回车直接检查答案
         */
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('mathAnswer').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    checkMathAnswer();
                }
            });
        });

        /* =========================================================
         * 形状认知模块
         * ========================================================= */
        const shapeInfo = {
            circle: {
                emoji: '⭕',
                name: '圆形',
                text: '这是圆形！像太阳和气球一样圆圆的~',
                color: '#ff6b6b',
                svg: '<circle cx="50" cy="50" r="40" fill="#ff6b6b"/>'
            },
            square: {
                emoji: '🔲',
                name: '正方形',
                text: '这是正方形！四条边一样长~',
                color: '#74b9ff',
                svg: '<rect x="15" y="15" width="70" height="70" fill="#74b9ff"/>'
            },
            triangle: {
                emoji: '🔺',
                name: '三角形',
                text: '这是三角形！有三个角~',
                color: '#ffe66d',
                svg: '<polygon points="50,10 90,90 10,90" fill="#ffe66d"/>'
            },
            rectangle: {
                emoji: '📱',
                name: '长方形',
                text: '这是长方形！像门和窗户~',
                color: '#7bed9f',
                svg: '<rect x="10" y="30" width="80" height="50" fill="#7bed9f"/>'
            }
        };

        /**
         * 展示形状信息：弹窗显示形状名和介绍，并朗读
         */
        function showShape(shape) {
            const info = shapeInfo[shape];
            showFeedback({
                emoji: info.emoji,
                text: info.name,
                subText: info.text,
                speakText: info.text,
                showSpeak: true
            });
            speak(info.text);
        }

        /* =========================================================
         * 找形状小游戏模块
         * ========================================================= */
        let currentFindTarget = '';  // 当前要找的形状
        let findAnswered = false;    // 当前题是否已作答

        /**
         * 初始化找形状游戏：随机选择目标形状，生成4个选项
         */
        function initFindGame() {
            findAnswered = false;
            const shapeKeys = Object.keys(shapeInfo);
            // 随机选择目标形状
            currentFindTarget = shapeKeys[Math.floor(Math.random() * shapeKeys.length)];
            const targetInfo = shapeInfo[currentFindTarget];

            // 顶部展示目标形状
            const targetEl = document.getElementById('findTarget');
            targetEl.innerHTML = `
                <svg style="width:30px;height:30px;vertical-align:middle;" viewBox="0 0 100 100">${targetInfo.svg}</svg>
                <span style="vertical-align:middle;margin-left:5px;">${targetInfo.name}</span>
            `;

            // 生成4个选项：包含正确答案
            const options = [currentFindTarget];
            while (options.length < 4) {
                const rand = shapeKeys[Math.floor(Math.random() * shapeKeys.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            // 打乱顺序
            options.sort(() => Math.random() - 0.5);

            let html = '';
            options.forEach(key => {
                const info = shapeInfo[key];
                html += `
                    <div class="find-option" onclick="checkFindAnswer('${key}', this)">
                        <svg viewBox="0 0 100 100">${info.svg}</svg>
                    </div>
                `;
            });
            document.getElementById('findOptions').innerHTML = html;
        }

        /**
         * 检查找形状答案
         */
        function checkFindAnswer(key, el) {
            if (findAnswered) return;
            findAnswered = true;

            if (key === currentFindTarget) {
                el.classList.add('correct');
                addReward(1, 10);
                const info = shapeInfo[key];
                const praise = `找对啦！这是${info.name}！`;
                showFeedback({
                    emoji: '🎉',
                    text: '找对啦！',
                    subText: praise,
                    speakText: praise,
                    showSpeak: true
                });
                speak(praise);
                setTimeout(initFindGame, 2000);
            } else {
                el.classList.add('wrong');
                setTimeout(() => el.classList.remove('wrong'), 500);
                findAnswered = false;
                breakCombo();
                const targetInfo = shapeInfo[currentFindTarget];
                const encourage = `再找找看，这是${targetInfo.name}哦~`;
                showFeedback({
                    emoji: '💪',
                    text: '再找找看！',
                    subText: encourage,
                    speakText: encourage,
                    showSpeak: true
                });
                speak(encourage);
            }
        }

        /* =========================================================
         * 通用反馈弹窗
         * ========================================================= */

        /**
         * 显示反馈弹窗
         * @param {Object} options - 配置项
         *   - emoji: 表情符号
         *   - text: 主标题
         *   - subText: 副标题
         *   - bigNumber: 大数字展示
         *   - bigItems: 大物品展示
         *   - bigWord: 大中文展示
         *   - speakText: 朗读文本
         *   - showSpeak: 是否显示朗读按钮
         */
        function showFeedback(options) {
            const popup = document.getElementById('feedbackPopup');
            document.getElementById('feedbackEmoji').textContent = options.emoji || '🎉';
            document.getElementById('feedbackText').textContent = options.text || '';
            document.getElementById('feedbackSubText').textContent = options.subText || '';

            // 大数字展示
            const bigNumEl = document.getElementById('feedbackBigNum');
            if (options.bigNumber !== undefined) {
                bigNumEl.textContent = options.bigNumber;
                bigNumEl.style.display = 'block';
            } else {
                bigNumEl.style.display = 'none';
            }

            // 大物品展示
            const bigItemsEl = document.getElementById('feedbackBigItems');
            if (options.bigItems !== undefined) {
                bigItemsEl.textContent = options.bigItems;
                bigItemsEl.style.display = 'block';
            } else {
                bigItemsEl.style.display = 'none';
            }

            // 大中文展示
            const bigWordEl = document.getElementById('feedbackBigWord');
            if (options.bigWord !== undefined) {
                bigWordEl.textContent = options.bigWord;
                bigWordEl.style.display = 'block';
            } else {
                bigWordEl.style.display = 'none';
            }

            // 朗读按钮
            const speakBtn = document.getElementById('speakBtn');
            if (options.showSpeak && speechSynthesisAvailable) {
                speakBtn.style.display = 'inline-block';
            } else {
                speakBtn.style.display = 'none';
            }

            // 保存当前朗读内容
            currentSpeakText = options.speakText || options.text || '';

            document.getElementById('overlay').classList.add('show');
            popup.classList.add('show');
        }

        /**
         * 关闭反馈弹窗
         */
        function closeFeedback() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('feedbackPopup').classList.remove('show');
        }

        // 点击遮罩关闭弹窗
        document.getElementById('overlay').addEventListener('click', closeFeedback);

        // 按ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeFeedback();
        });

        /* =========================================================
         * 页面初始化
         * ========================================================= */
        window.onload = function() {
            initNumberCards();
            initCountingGame();
            generateMathProblem();
            initFindGame();
        };
    </script>

</body>
</html>
