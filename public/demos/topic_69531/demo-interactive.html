      analysisHtml += '<div class="analysis-grid">';
      analysisHtml += '<div class="analysis-item"><div class="val">'+profile.items.length+'</div><div class="lab">识别单品</div></div>';
      analysisHtml += '<div class="analysis-item"><div class="val">'+profile.colors.join(' · ')+'</div><div class="lab">主色调</div></div>';
      analysisHtml += '<div class="analysis-item"><div class="val">'+profile.style+'</div><div class="lab">风格倾向</div></div>';
      analysisHtml += '</div>';
      analysisHtml += '<div class="analysis-note">'+profile.analysis+'</div>';
      analysisCard.innerHTML = analysisHtml;

      // ---- Header ----
      adviceHeader.innerHTML =
        '<div class="advice-avatar">'+d.avatar+'</div>'+
        '<div class="advice-meta"><div class="name">'+d.name+'</div><div class="tag">'+(scene ? scene.tag : '日常探索')+' · '+intMap[ik]+'</div></div>';

      var html = '';

      // ---- Score ----
      html += '<div class="advice-card"><h4>整体评价</h4><p>'+a.score+'</p></div>';

      // ---- Comment (with scene context + photo reference) ----
      var fullComment = a.comment;
      if(scene && sk !== 'daily') {
        fullComment = '<strong style="color:var(--accent);font-weight:500">' + scene.note + '</strong><br><br>' + a.comment;
      }
      html += '<div class="advice-card"><h4>详细分析</h4><p>'+fullComment+'</p></div>';

      // ---- Suggestions ----
      var sug = '';
      a.suggestions.forEach(function(s){ sug += '<p>· '+s+'</p>'; });
      html += '<div class="advice-card"><h4>基于您照片的改进建议</h4>'+sug+'</div>';

      // ---- Principles ----
      var phtml = '<div class="advice-card"><h4>设计理念</h4><p>';
      d.principles.forEach(function(p){ phtml += '<span class="principle-tag">'+p+'</span> '; });
      phtml += '</p></div>';
      html += phtml;

      adviceContent.innerHTML = html;

      window.scrollTo({ top: 0, behavior:'smooth' });
    }, 1200);
  });

  // ---- Back button ----
  btnBack.addEventListener('click', function(){
    pageResult.style.display = 'none';
    pageInput.style.display = 'block';
    // Reset advice section
    adviceSection.classList.remove('show');
    adviceContent.innerHTML = '';
    analysisCard.innerHTML = '';
    adviceHeader.innerHTML = '';
    resultHero.innerHTML = '';
    // Reset empty state display
    emptyState.style.display = '';
    window.scrollTo({ top: 0, behavior:'smooth' });
  });

  // ---- Feedback ----
  feedbackBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      feedbackBtns.forEach(function(b){ b.classList.remove('clicked'); });
      btn.classList.add('clicked');
    });
  });
})();
</script>
</body>
</html>
