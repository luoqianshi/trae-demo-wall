<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅途 Plan B - AI 行程应急重规划</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --warning: #d97706;
    --success: #059669;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    display: none;
    min-height: 100vh;
    padding: 24px 20px 32px;
    max-width: 480px;
    margin: 0 auto;
    animation: fadeIn 0.3s ease;
  }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Home */
  .home-header {
    text-align: center;
    padding-top: 40px;
    padding-bottom: 32px;
  }
  .home-header .icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    border-radius: 20px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: white;
    box-shadow: 0 8px 24px rgba(37,99,235,0.25);
  }
  .home-header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .home-header p {
    color: var(--text-secondary);
    font-size: 15px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
  .btn-secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
    margin-top: 12px;
  }
  .btn-secondary:active { background: var(--bg); }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
    justify-content: center;
  }
  .tag {
    background: white;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Form */
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--primary);
  }
  .form-textarea {
    min-height: 80px;
    resize: vertical;
  }

  .scenario-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .scenario-tag {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    background: white;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .scenario-tag.active {
    background: #eff6ff;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }

  /* Loading */
  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #dbeafe;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 16px; font-weight: 600; }
  .loading-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

  /* Results */
  .result-header {
    background: linear-gradient(135deg, var(--primary), #3b82f6);
    color: white;
    margin: -24px -20px 20px;
    padding: 24px 20px;
    border-radius: 0 0 20px 20px;
  }
  .result-header h2 { font-size: 20px; margin-bottom: 4px; }
  .result-header p { font-size: 13px; opacity: 0.9; }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 24px 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .plan-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    position: relative;
    overflow: hidden;
  }
  .plan-card.recommended { border-left-color: var(--success); }
  .plan-card.budget { border-left-color: #7c3aed; }
  .plan-card.safe { border-left-color: var(--warning); }

  .plan-badge {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
  }
  .badge-fast { background: #fee2e2; color: var(--danger); }
  .badge-safe { background: #fef3c7; color: var(--warning); }
  .badge-budget { background: #ede9fe; color: #7c3aed; }
  .badge-rec { background: #d1fae5; color: var(--success); }

  .plan-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    padding-right: 60px;
  }
  .plan-meta {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .meta-item {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .meta-item strong { color: var(--text); }

  .plan-steps {
    list-style: none;
    margin-top: 10px;
  }
  .plan-steps li {
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .plan-steps li:last-child { border-bottom: none; }
  .step-num {
    min-width: 20px; height: 20px;
    background: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .risk-box {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    padding: 14px;
    margin-top: 8px;
  }
  .risk-title { font-size: 14px; font-weight: 700; color: var(--warning); margin-bottom: 6px; }
  .risk-list { list-style: none; }
  .risk-list li { font-size: 13px; color: #92400e; padding: 3px 0; }

  .chat-box {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    padding: 14px;
    margin-top: 8px;
  }
  .chat-title { font-size: 14px; font-weight: 700; color: #0369a1; margin-bottom: 8px; }
  .chat-bubble {
    background: white;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 8px;
    position: relative;
  }
  .chat-bubble .label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 11px;
    color: var(--primary);
    background: none;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid var(--border);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }
  .bottom-bar .btn { margin: 0; }

  .back-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
  }
  .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.3; }

  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast">已复制</div>

<!-- PAGE 1: Home -->
<div id="page-home" class="page active">
  <div class="home-header">
    <div class="icon">🛡️</div>
    <h1>旅途 Plan B</h1>
    <p>AI 行程应急重规划助手</p>
  </div>

  <div style="background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow);">
    <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px;">
      高铁停运、航班延误、临时取消……当突发情况打乱你的行程时，我们帮你在几分钟内找到最优补救方案。
    </p>
    <div class="tag-list">
      <span class="tag">🚄 高铁晚点</span>
      <span class="tag">✈️ 航班取消</span>
      <span class="tag">🔄 转机延误</span>
      <span class="tag">🎯 赶面试/会议</span>
    </div>
  </div>

  <button class="btn btn-primary" onclick="goTo('page-form')">开始应急规划</button>
  <button class="btn btn-secondary" onclick="showDemo()">查看示例方案</button>
</div>

<!-- PAGE 2: Form -->
<div id="page-form" class="page">
  <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
  <h2 style="font-size: 20px; margin-bottom: 20px;">填写行程信息</h2>

  <div class="form-group">
    <label class="form-label">出发地</label>
    <input type="text" class="form-input" id="from" placeholder="例如：上海虹桥">
  </div>

  <div class="form-group">
    <label class="form-label">目的地</label>
    <input type="text" class="form-input" id="to" placeholder="例如：北京南站">
  </div>

  <div class="form-group">
    <label class="form-label">原定出发时间</label>
    <input type="datetime-local" class="form-input" id="departTime">
  </div>

  <div class="form-group">
    <label class="form-label">后续重要安排</label>
    <input type="text" class="form-input" id="event" placeholder="例如：14:00 面试 / 15:00 会议 / 酒店入住">
  </div>

  <div class="form-group">
    <label class="form-label">预算上限（元）</label>
    <input type="number" class="form-input" id="budget" placeholder="例如：2000">
  </div>

  <div class="form-group">
    <label class="form-label">突发情况</label>
    <div class="scenario-tags" id="scenarioTags">
      <span class="scenario-tag" data-val="高铁停运">🚄 高铁停运</span>
      <span class="scenario-tag" data-val="高铁晚点">高铁晚点</span>
      <span class="scenario-tag" data-val="航班取消">✈️ 航班取消</span>
      <span class="scenario-tag" data-val="航班延误">航班延误</span>
      <span class="scenario-tag" data-val="转机错过">转机错过</span>
      <span class="scenario-tag" data-val="其他">其他</span>
    </div>
    <textarea class="form-textarea" id="scenarioDetail" placeholder="请补充具体情况，例如：G1234次列车因暴雨停运，已购买车票无法改签" style="margin-top: 10px;"></textarea>
  </div>

  <div style="height: 80px;"></div>

  <div class="bottom-bar">
    <button class="btn btn-secondary" style="flex: 1;" onclick="goTo('page-home')">取消</button>
    <button class="btn btn-primary" style="flex: 2;" onclick="submitPlan()">生成方案</button>
  </div>
</div>

<!-- PAGE 3: Loading -->
<div id="page-loading" class="page">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-text">AI 正在分析应急方案</div>
    <div class="loading-sub" id="loadingSub">查询替代车次与航班…</div>
  </div>
</div>

<!-- PAGE 4: Results -->
<div id="page-result" class="page">
  <div class="result-header">
    <h2>🛡️ 应急方案已生成</h2>
    <p id="resultSummary">基于当前突发情况，为你匹配 4 套补救方案</p>
  </div>

  <div class="section-title">📋 补救方案</div>
  <div id="plansContainer"></div>

  <div class="section-title">⚠️ 风险提示</div>
  <div class="risk-box" id="riskBox"></div>

  <div class="section-title">💬 沟通话术</div>
  <div class="chat-box" id="chatBox"></div>

  <div style="height: 80px;"></div>

  <div class="bottom-bar">
    <button class="btn btn-secondary" style="flex: 1;" onclick="goTo('page-form')">修改信息</button>
    <button class="btn btn-primary" style="flex: 2;" onclick="goTo('page-home')">完成</button>
  </div>
</div>

<script>
// Navigation
function goTo(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// Scenario tag selection
document.querySelectorAll('.scenario-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    document.querySelectorAll('.scenario-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
  });
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function copyText(text) {
  navigator.clipboard?.writeText(text).then(() => showToast('已复制'));
}

function getScenario() {
  const active = document.querySelector('.scenario-tag.active');
  return active ? active.dataset.val : '突发情况';
}

// Demo data
function showDemo() {
  document.getElementById('from').value = '上海虹桥';
  document.getElementById('to').value = '北京南站';
  document.getElementById('event').value = '14:30 重要面试';
  document.getElementById('budget').value = '2000';
  document.querySelectorAll('.scenario-tag').forEach(t => {
    t.classList.toggle('active', t.dataset.val === '高铁停运');
  });
  document.getElementById('scenarioDetail').value = 'G6次列车因设备故障停运，原计划9:00出发，现需重新规划';
  submitPlan();
}

function submitPlan() {
  const from = document.getElementById('from').value || '出发地';
  const to = document.getElementById('to').value || '目的地';
  const scenario = getScenario();
  const detail = document.getElementById('scenarioDetail').value || scenario;

  goTo('page-loading');

  const subs = ['查询替代车次与航班…', '评估各方案时间与费用…', '分析后续安排衔接风险…', '生成沟通话术与建议…'];
  let i = 0;
  const interval = setInterval(() => {
    i = Math.min(i + 1, subs.length - 1);
    document.getElementById('loadingSub').textContent = subs[i];
  }, 600);

  setTimeout(() => {
    clearInterval(interval);
    renderResults(from, to, scenario, detail);
    goTo('page-result');
  }, 2800);
}

function renderResults(from, to, scenario, detail) {
  document.getElementById('resultSummary').textContent = `你遇到的是：${scenario}，从 ${from} 到 ${to}，已生成应急方案`;

  // Plans
  const plans = [
    {
      title: '最快到达方案',
      badge: '最快',
      badgeClass: 'badge-fast',
      cardClass: '',
      time: '约 4.5 小时',
      cost: '¥1,680',
      arrival: '13:20',
      risk: '中等',
      steps: [
        '立即打车前往上海浦东机场（约 60 分钟）',
        '乘坐 MU5103 航班 10:30 起飞，12:50 抵达北京首都机场',
        '机场快线 + 打车，预计 13:20 到达面试地点',
      ]
    },
    {
      title: '最稳保险方案',
      badge: '最稳',
      badgeClass: 'badge-safe',
      cardClass: 'safe',
      time: '约 5.5 小时',
      cost: '¥1,200',
      arrival: '14:00',
      risk: '低',
      steps: [
        '改订 G102 次高铁 10:00 从上海虹桥出发',
        '15:30 抵达北京南站',
        '提前联系面试官说明情况，申请推迟至 16:00',
      ]
    },
    {
      title: '最省预算方案',
      badge: '省钱',
      badgeClass: 'badge-budget',
      cardClass: 'budget',
      time: '约 6 小时',
      cost: '¥520',
      arrival: '15:00',
      risk: '中高',
      steps: [
        '乘坐长途大巴前往南京南站（约 2 小时）',
        '换乘 G104 次高铁 12:30 出发，15:00 抵达北京南站',
        '打车前往面试地点，预计 15:30 到达',
      ]
    },
    {
      title: '兜底联系方案',
      badge: '兜底',
      badgeClass: 'badge-rec',
      cardClass: 'recommended',
      time: '线上进行',
      cost: '¥0',
      arrival: '即时',
      risk: '无',
      steps: [
        '立即联系面试官/HR，诚恳说明高铁停运情况',
        '申请改为线上面试或改期至明日',
        '同步预订今日最晚一班高铁作为备选',
      ]
    }
  ];

  const container = document.getElementById('plansContainer');
  container.innerHTML = plans.map((p, idx) => `
    <div class="plan-card ${p.cardClass}">
      <span class="plan-badge ${p.badgeClass}">${p.badge}</span>
      <div class="plan-title">方案 ${idx + 1}：${p.title}</div>
      <div class="plan-meta">
        <span class="meta-item">⏱️ <strong>${p.time}</strong></span>
        <span class="meta-item">💰 <strong>${p.cost}</strong></span>
        <span class="meta-item">🎯 预计到达 <strong>${p.arrival}</strong></span>
        <span class="meta-item">⚠️ 风险 <strong>${p.risk}</strong></span>
      </div>
      <ul class="plan-steps">
        ${p.steps.map((s, i) => `<li><span class="step-num">${i + 1}</span><span>${s}</span></li>`).join('')}
      </ul>
    </div>
  `).join('');

  // Risks
  document.getElementById('riskBox').innerHTML = `
    <div class="risk-title">⚠️ 需要注意的风险</div>
    <ul class="risk-list">
      <li>• 浦东机场早高峰拥堵，打车时间可能延长 20-30 分钟</li>
      <li>• 航班受天气影响存在进一步延误可能，建议提前值机</li>
      <li>• 若选择高铁改期，G102 余票紧张，需尽快下单</li>
      <li>• 面试改期可能影响招聘流程，建议提供官方停运证明</li>
    </ul>
  `;

  // Chat templates
  document.getElementById('chatBox').innerHTML = `
    <div class="chat-bubble">
      <div class="label">给面试官/HR</div>
      <div>您好，非常抱歉！我原定乘坐的 G6 次高铁因设备故障临时停运，目前正在紧急协调替代方案。预计可能会晚点约 2 小时，能否申请将面试推迟至下午 16:00？或改为线上面试？给您带来不便非常抱歉！</div>
      <button class="copy-btn" onclick="copyText(this.parentElement.querySelector('div:last-child').innerText)">复制</button>
    </div>
    <div class="chat-bubble">
      <div class="label">给酒店/接机</div>
      <div>您好，我是今天预订房间的客人，因高铁停运导致行程延误，预计入住时间将从 18:00 推迟至 21:00 左右。如需保留房间，我可以先提供信用卡担保，谢谢理解！</div>
      <button class="copy-btn" onclick="copyText(this.parentElement.querySelector('div:last-child').innerText)">复制</button>
