<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图生成工具</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2/dist/echarts-gl.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            transition: background 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        body.light-theme {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: background 0.3s ease;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        body.light-theme .header {
            background: rgba(255, 255, 255, 0.8);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        body.light-theme .input-group label {
            color: #333;
        }

        .input-group input,
        .input-group select {
            padding: 10px 15px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        body.light-theme .input-group input,
        body.light-theme .input-group select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #64c8ff;
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }

        body.light-theme .input-group input:focus,
        body.light-theme .input-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        body.light-theme .input-group input::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #64c8ff 0%, #3b82f6 100%);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .map-container {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .tooltip-custom {
            background: rgba(0, 0, 0, 0.8) !important;
            border: 1px solid #64c8ff !important;
            border-radius: 8px !important;
            padding: 10px 15px !important;
            color: #fff !important;
            font-size: 14px !important;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3) !important;
        }

        body.light-theme .tooltip-custom {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 1px solid #3b82f6 !important;
            color: #333 !important;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #64c8ff;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
        }

        body.light-theme .search-dropdown {
            background: rgba(255, 255, 255, 0.95);
            border-color: #3b82f6;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s ease;
        }

        body.light-theme .search-item {
            color: #333;
        }

        .search-item:hover {
            background: rgba(100, 200, 255, 0.2);
        }

        body.light-theme .search-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .search-item .region-name {
            font-weight: 600;
        }

        .search-item .region-code {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 10px;
        }

        body.light-theme .search-item .region-code {
            color: rgba(0, 0, 0, 0.4);
        }

        .btn-back {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.4);
        }

        .breadcrumb {
            position: absolute;
            top: 10px;
            left: 20px;
            color: #64c8ff;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        body.light-theme .breadcrumb {
            color: #3b82f6;
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        body.light-theme .theme-toggle {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌓</button>
    
    <div class="header">
        <button class="btn btn-back" id="backBtn" style="display:none;">← 返回上级</button>
        <div class="input-group">
            <label>行政区：</label>
            <div style="position: relative;">
                <input type="text" id="regionInput" placeholder="输入省/市/区县名称搜索" autocomplete="off">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>
        
        <div class="input-group">
            <label>地图样式：</label>
            <select id="mapStyle">
                <option value="2d">2D平面地图</option>
                <option value="3d">3D浮雕立体地图</option>
            </select>
        </div>
        
        <button class="btn btn-primary" id="generateBtn">生成地图</button>
        <button class="btn btn-download" id="downloadPngBtn">下载PNG</button>
        <button class="btn btn-secondary" id="downloadHtmlBtn">下载HTML源码</button>
    </div>
    
    <div class="map-container">
        <div class="breadcrumb" id="breadcrumb">当前：中国</div>
        <div id="map"></div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const regionInput = document.getElementById('regionInput');
        const searchDropdown = document.getElementById('searchDropdown');
        const mapStyle = document.getElementById('mapStyle');
        const generateBtn = document.getElementById('generateBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');
        const backBtn = document.getElementById('backBtn');
        const breadcrumb = document.getElementById('breadcrumb');

        let chart = null;
        let currentGeoJson = null;      // 当前渲染的GeoJSON数据
        let isDarkTheme = true;

        // 层级栈：记录浏览路径，每项含 {name, adcode, geoJson, level}
        // level: 'country'=全国, 'province'=省级, 'city'=市级, 'district'=区县级
        let levelStack = [];

        // 阿里云DataV行政区划API基础地址（获取含下级的边界数据）
        const DATAV_API_BASE = 'https://geo.datav.aliyun.com/areas_v3/bound/';

        themeToggle.addEventListener('click', () => {
            isDarkTheme = !isDarkTheme;
            document.body.classList.toggle('light-theme');
            renderMap();
        });

        // 返回上级按钮
        backBtn.addEventListener('click', () => {
            if (levelStack.length > 1) {
                levelStack.pop(); // 弹出当前层级
                const parent = levelStack[levelStack.length - 1];
                currentGeoJson = parent.geoJson;
                renderMap();
            }
        });

        // 地图样式切换时重新渲染
        mapStyle.addEventListener('change', () => {
            renderMap();
        });

        // 搜索输入
        regionInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            if (keyword) {
                const results = searchRegions(keyword);
                showSearchResults(results);
            } else {
                hideSearchResults();
            }
        });

        regionInput.addEventListener('blur', () => {
            setTimeout(() => hideSearchResults(), 200);
        });

        // 搜索结果展示
        function showSearchResults(results) {
            searchDropdown.innerHTML = '';
            if (results.length === 0) {
                searchDropdown.innerHTML = '<div class="search-item">未找到匹配的行政区</div>';
            } else {
                results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<span class="region-name">${item.name}</span><span class="region-code">${item.code}</span>`;
                    div.addEventListener('click', () => {
                        regionInput.value = item.name;
                        hideSearchResults();
                        // 根据搜索结果加载对应区域
                        loadAndRender(item.adcode, item.name, item.level);
                    });
                    searchDropdown.appendChild(div);
                });
            }
            searchDropdown.classList.add('show');
        }

        function hideSearchResults() {
            searchDropdown.classList.remove('show');
        }

        // 生成地图按钮
        generateBtn.addEventListener('click', () => {
            const input = regionInput.value.trim();
            if (input) {
                // 尝试在当前数据中匹配
                const results = searchRegions(input);
                if (results.length > 0) {
                    const match = results[0];
                    loadAndRender(match.adcode, match.name, match.level);
                } else {
                    renderMap();
                }
            } else {
                renderMap();
            }
        });

        // 下载PNG
        downloadPngBtn.addEventListener('click', () => {
            if (chart) {
                const currentName = levelStack.length > 0 ? levelStack[levelStack.length - 1].name : '中国';
                const url = chart.getDataURL({
                    type: 'png',
                    pixelRatio: 2,
                    backgroundColor: isDarkTheme ? '#0a1628' : '#e3f2fd'
                });
                const link = document.createElement('a');
                link.download = `${currentName}_地图.png`;
                link.href = url;
                link.click();
            }
        });

        // 下载HTML源码
        downloadHtmlBtn.addEventListener('click', () => {
            const currentName = levelStack.length > 0 ? levelStack[levelStack.length - 1].name : '中国';
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `${currentName}_地图.html`;
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        });

        // 搜索行政区：从内置全国数据 + 当前已加载数据中搜索
        function searchRegions(keyword) {
            const results = [];
            keyword = keyword.toLowerCase();
            const seen = new Set(); // 去重

            // 1. 从内置全国省市数据中搜索
            if (chinaGeoJson.features) {
                chinaGeoJson.features.forEach(feature => {
                    const name = feature.properties.name;
                    if (name && name.toLowerCase().includes(keyword)) {
                        const adcode = feature.properties.adcode || '';
                        if (!seen.has(adcode)) {
                            seen.add(adcode);
                            // 根据adcode判断层级（省级6位结尾为0000）
                            const level = 'province';
                            results.push({ name, code: adcode, adcode, level });
                        }
                    }
                });
            }

            // 2. 从当前已加载的下级数据中搜索（市/区县）
            if (currentGeoJson && currentGeoJson.features) {
                currentGeoJson.features.forEach(feature => {
                    const name = feature.properties.name;
                    if (name && name.toLowerCase().includes(keyword)) {
                        const adcode = feature.properties.adcode || '';
                        if (!seen.has(adcode)) {
                            seen.add(adcode);
                            // 判断层级：adcode第3-4位为00的是市级，否则区县级
                            const level = (adcode.length === 6 && adcode.substring(4, 6) === '00') ? 'city' : 'district';
                            results.push({ name, code: adcode, adcode, level });
                        }
                    }
                });
            }

            return results.slice(0, 10);
        }

        // 初始化ECharts实例
        function initChart() {
            const mapDom = document.getElementById('map');
            chart = echarts.init(mapDom, null, { renderer: 'canvas' });
            window.addEventListener('resize', () => {
                chart.resize();
            });
        }

        // 从阿里云DataV API异步加载GeoJSON
        async function loadGeoJsonFromAPI(adcode) {
            const url = `${DATAV_API_BASE}${adcode}_full.json`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`加载失败: ${adcode}`);
            }
            return await response.json();
        }

        // 加载指定区域并渲染（支持下钻）
        // 根据目标层级自动构建完整的上级路径，确保返回上级功能正常
        async function loadAndRender(adcode, name, level) {
            if (!chart) {
                initChart();
            }

            // 全国级 - 使用内置数据
            if (adcode === '100000' || !adcode) {
                levelStack = [{ name: '中国', adcode: '100000', geoJson: chinaGeoJson, level: 'country' }];
                currentGeoJson = chinaGeoJson;
                renderMap();
                return;
            }

            try {
                chart.showLoading('default', {
                    text: '正在加载地图数据...',
                    color: '#64c8ff',
                    textColor: '#fff',
                    maskColor: isDarkTheme ? 'rgba(0, 0, 0, 0.6)' : 'rgba(255, 255, 255, 0.6)'
                });

                // 重置栈，从全国开始
                levelStack = [{ name: '中国', adcode: '100000', geoJson: chinaGeoJson, level: 'country' }];

                // 如果是市级，先加载省级数据
                if (level === 'city') {
                    const provinceAdcode = adcode.substring(0, 2) + '0000';
                    const provinceFeature = chinaGeoJson.features.find(f => f.properties.adcode === provinceAdcode);
                    if (provinceFeature) {
                        const provinceGeoJson = await loadGeoJsonFromAPI(provinceAdcode);
                        levelStack.push({
                            name: provinceFeature.properties.name,
                            adcode: provinceAdcode,
                            geoJson: provinceGeoJson,
                            level: 'province'
                        });
                    }
                }

                // 如果是区县级，先加载省级和市级数据
                if (level === 'district') {
                    const provinceAdcode = adcode.substring(0, 2) + '0000';
                    const cityAdcode = adcode.substring(0, 4) + '00';
                    const provinceFeature = chinaGeoJson.features.find(f => f.properties.adcode === provinceAdcode);
                    if (provinceFeature) {
                        const provinceGeoJson = await loadGeoJsonFromAPI(provinceAdcode);
                        levelStack.push({
                            name: provinceFeature.properties.name,
                            adcode: provinceAdcode,
                            geoJson: provinceGeoJson,
                            level: 'province'
                        });
                        // 从省级数据中找市级名称
                        const cityFeature = provinceGeoJson.features.find(f => f.properties.adcode === cityAdcode);
                        if (cityFeature) {
                            const cityGeoJson = await loadGeoJsonFromAPI(cityAdcode);
                            levelStack.push({
                                name: cityFeature.properties.name,
                                adcode: cityAdcode,
                                geoJson: cityGeoJson,
                                level: 'city'
                            });
                        }
                    }
                }

                // 加载目标级数据
                const geoJson = await loadGeoJsonFromAPI(adcode);
                chart.hideLoading();

                levelStack.push({ name, adcode, geoJson, level });
                currentGeoJson = geoJson;
                renderMap();
            } catch (error) {
                chart.hideLoading();
                console.error('加载地图数据失败:', error);
                alert('加载地图数据失败，请检查网络连接后重试。\n区县级数据需要联网获取。');
            }
        }

        // 渲染地图（使用currentGeoJson中的数据）
        function renderMap() {
            if (!chart) {
                initChart();
            }

            if (!currentGeoJson) {
                currentGeoJson = chinaGeoJson;
            }

            const currentLevel = levelStack.length > 0 ? levelStack[levelStack.length - 1] : null;
            const currentName = currentLevel ? currentLevel.name : '中国';
            const currentAdcode = currentLevel ? currentLevel.adcode : '100000';
            const mapName = `map_${currentAdcode}`;

            // 注册地图数据
            echarts.registerMap(mapName, currentGeoJson);

            // 更新面包屑
            updateBreadcrumb();
            // 更新返回按钮
            backBtn.style.display = levelStack.length > 1 ? 'block' : 'none';

            const styleType = mapStyle.value;

            const baseColor = isDarkTheme ? '#1e3a5f' : '#e3f2fd';
            const borderColor = isDarkTheme ? '#64c8ff' : '#3b82f6';
            const hoverColor = isDarkTheme ? '#3b82f6' : '#93c5fd';
            const textColor = isDarkTheme ? '#fff' : '#333';

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    className: 'tooltip-custom',
                    formatter: (params) => {
                        return `<div style="font-weight:600;">${params.name}</div>`;
                    }
                },
                series: []
            };

            if (styleType === '3d') {
                option.series.push({
                    name: currentName,
                    type: 'map3D',
                    map: mapName,
                    roam: true,
                    zoom: 1.2,
                    viewControl: {
                        autoRotate: false,
                        distance: 150
                    },
                    itemStyle: {
                        color: baseColor,
                        borderColor: borderColor,
                        borderWidth: 1.5,
                        shadowColor: borderColor,
                        shadowBlur: 10,
                        shadowOffsetY: 5
                    },
                    emphasis: {
                        itemStyle: {
                            color: hoverColor,
                            borderColor: '#fff',
                            borderWidth: 2,
                            shadowColor: '#fff',
                            shadowBlur: 20
                        },
                        label: {
                            show: true,
                            color: textColor,
                            fontSize: 12,
                            fontWeight: 'bold'
                        }
                    },
                    label: {
                        show: false,
                        color: textColor
                    },
                    shading: 'color',
                    environment: 'none'
                });
            } else {
                option.series.push({
                    name: currentName,
                    type: 'map',
                    map: mapName,
                    roam: true,
                    zoom: 1.2,
                    itemStyle: {
                        color: baseColor,
                        borderColor: borderColor,
                        borderWidth: 1.5,
                        shadowColor: borderColor,
                        shadowBlur: 8,
                        shadowOffsetX: 2,
                        shadowOffsetY: 2
                    },
                    emphasis: {
                        itemStyle: {
                            color: hoverColor,
                            borderColor: '#fff',
                            borderWidth: 2,
                            shadowColor: '#fff',
                            shadowBlur: 15
                        },
                        label: {
                            show: true,
                            color: textColor,
                            fontSize: 12,
                            fontWeight: 'bold'
                        }
                    },
                    label: {
                        show: false,
                        color: textColor
                    }
                });
            }

            chart.setOption(option, true);

            // 绑定点击下钻事件
            chart.off('click');
            chart.on('click', (params) => {
                handleMapClick(params);
            });
        }

        // 处理地图点击下钻
        async function handleMapClick(params) {
            const clickedName = params.name;
            // 在当前GeoJSON中找到点击的区域
            if (!currentGeoJson || !currentGeoJson.features) return;

            const feature = currentGeoJson.features.find(f => f.properties.name === clickedName);
            if (!feature) return;

            const adcode = feature.properties.adcode;
            if (!adcode) return;

            const currentLevel = levelStack.length > 0 ? levelStack[levelStack.length - 1].level : 'country';

            // 区县级不再下钻
            if (currentLevel === 'district') {
                return;
            }

            // 判断下钻后的层级
            let nextLevel;
            if (currentLevel === 'country') {
                nextLevel = 'province';
            } else if (currentLevel === 'province') {
                nextLevel = 'city';
            } else if (currentLevel === 'city') {
                nextLevel = 'district';
            } else {
                return;
            }

            // 加载下级数据
            await loadAndRender(adcode, clickedName, nextLevel);
        }

        // 更新面包屑导航
        function updateBreadcrumb() {
            if (levelStack.length === 0) {
                breadcrumb.textContent = '当前：中国';
                return;
            }
            const names = levelStack.map(item => item.name);
            breadcrumb.textContent = '当前：' + names.join(' > ');
        }

        const chinaGeoJson = {
