<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋爱回复助手 - AI创意初赛作品</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EC 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(255, 143, 177, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #FF8FB1 0%, #FFB6C1 100%);
      padding: 30px;
      text-align: center;
      color: #FFFFFF;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .mode-badge {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 8px;
    }

    .nav-tabs {
      display: flex;
      border-bottom: 1px solid #FFE4EC;
    }

    .nav-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: #999999;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
    }

    .nav-tab.active {
      color: #FF8FB1;
      border-bottom: 2px solid #FF8FB1;
      font-weight: 500;
    }

    .nav-tab:hover {
      color: #FF8FB1;
    }

    .tab-content {
      padding: 24px;
      min-height: 400px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 16px;
    }

    .textarea-field {
      width: 100%;
      height: 120px;
      border: 2px solid #FFE4EC;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      background: #FFF0F5;
      resize: none;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }

    .textarea-field:focus {
      border-color: #FF8FB1;
    }

    .mode-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-tag {
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 13px;
      background: #FFF0F5;
      color: #999999;
      border: 2px solid #FFE4EC;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
    }

    .mode-tag.active {
      background: #FF8FB1;
      color: #FFFFFF;
      border-color: #FF8FB1;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #FF8FB1 0%, #FFB6C1 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 25px;
      padding: 16px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 143, 177, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      width: 100%;
      background: #FFFFFF;
      color: #FF8FB1;
      border: 2px solid #FF8FB1;
      border-radius: 25px;
      padding: 16px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: #FFF0F5;
    }

    .loading-container {
      text-align: center;
      padding: 40px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #FFE4EC;
      border-top-color: #FF8FB1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #FF8FB1;
      font-size: 14px;
    }

    .reply-list {
      margin-top: 20px;
    }

    .reply-card {
      background: #FFF0F5;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 2px solid transparent;
      transition: all 0.3s;
      cursor: pointer;
    }

    .reply-card:hover {
      border-color: #FFB6C1;
    }

    .reply-card.selected {
      border-color: #FF8FB1;
      background: #FFE4EC;
    }

    .reply-type {
      font-size: 12px;
      color: #FF8FB1;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .reply-content {
      font-size: 15px;
      color: #333333;
      line-height: 1.6;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .action-buttons .btn-primary,
    .action-buttons .btn-secondary {
      flex: 1;
      margin-bottom: 0;
    }

    .emotion-result {
      background: #FFF0F5;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .emotion-tag {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 10px;
      margin-bottom: 12px;
    }

    .emotion-happy { background: #E8F5E9; color: #4CAF50; }
    .emotion-angry { background: #FFEBEE; color: #F44336; }
    .emotion-sad { background: #E3F2FD; color: #2196F3; }
    .emotion-normal { background: #FFF3E0; color: #FF9800; }

    .emotion-analysis {
      font-size: 14px;
      color: #333333;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .emotion-suggestions { margin-top: 16px; }

    .emotion-suggestions h4 {
      font-size: 14px;
      color: #FF8FB1;
      margin-bottom: 8px;
    }

    .emotion-suggestions ul {
      list-style: none;
      padding: 0;
    }

    .emotion-suggestions li {
      font-size: 13px;
      color: #666666;
      margin-bottom: 6px;
      padding-left: 16px;
      position: relative;
    }

    .emotion-suggestions li::before {
      content: '💡';
      position: absolute;
      left: 0;
    }

    .emotion-warning {
      background: #FFEBEE;
      color: #F44336;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
    }

    .form-item { margin-bottom: 16px; }

    .form-label {
      font-size: 14px;
      color: #333333;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }

    .input-field {
      width: 100%;
      height: 48px;
      border: 2px solid #FFE4EC;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 14px;
      background: #FFF0F5;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      border-color: #FF8FB1;
    }

    .history-list { max-height: 400px; overflow-y: auto; }

    .history-item {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(255, 143, 177, 0.05);
    }

    .history-message {
      font-size: 14px;
      color: #333333;
      margin-bottom: 8px;
    }

    .history-reply {
      font-size: 13px;
      color: #FF8FB1;
      margin-bottom: 6px;
    }

    .history-meta {
      font-size: 11px;
      color: #CCCCCC;
    }

    .feedback-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .feedback-content {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px;
      width: 80%;
      max-width: 400px;
      text-align: center;
    }

    .feedback-title {
      font-size: 20px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 30px;
    }

    .feedback-emojis {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .feedback-emoji {
      font-size: 48px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .feedback-emoji:hover {
      transform: scale(1.2);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999999;
    }

    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-text { font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }

    .api-settings {
      margin-top: 20px;
      padding: 20px;
      background: #FFF0F5;
      border-radius: 12px;
    }

    .api-url-input {
      width: 100%;
      height: 44px;
      border: 1px solid #FFE4EC;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #CCCCCC;
      font-size: 12px;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF0F5;
      color: #FF8FB1;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #F5F5F5;
      font-size: 12px;
      color: #999999;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      display: inline-block;
    }

    .status-dot.offline {
      background: #FF9800;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💘 恋爱回复助手</h1>
      <p>AI帮你搞定女朋友的每一条消息</p>
      <div class="mode-badge">✨ 内置智能回复 · 无需部署即可体验</div>
    </div>

    <div class="status-bar">
      <span class="status-dot offline" id="status-dot"></span>
      <span id="status-text">演示模式（无需后端）</span>
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchTab('home', this)">📝 生成回复</div>
      <div class="nav-tab" onclick="switchTab('emotion', this)">💭 情绪分析</div>
      <div class="nav-tab" onclick="switchTab('profile', this)">👧 女朋友人设</div>
      <div class="nav-tab" onclick="switchTab('history', this)">📜 历史记录</div>
    </div>

    <div class="tab-content">
      <!-- 首页：生成回复 -->
      <div id="tab-home" class="tab-panel">
        <div class="demo-badge">🎯 无需后端 · 直接体验AI回复效果</div>
        <div class="section-title">💬 输入女朋友的消息</div>
        <textarea id="message-input" class="textarea-field" placeholder="例如：今天好累啊..." oninput="autoResize(this)"></textarea>
        
        <div class="section-title">🎮 选择回复模式</div>
        <div class="mode-selector">
          <div class="mode-tag active" onclick="selectMode('normal', this)">💬 日常模式</div>
          <div class="mode-tag" onclick="selectMode('busy', this)">💼 忙碌模式</div>
          <div class="mode-tag" onclick="selectMode('video', this)">🎬 视频回复</div>
          <div class="mode-tag" onclick="selectMode('emotion', this)">💭 情绪探测</div>
        </div>

        <button class="btn-primary" onclick="generateReply()" id="generate-btn">
          🤖 生成回复
        </button>

        <div id="loading-container" class="loading-container" style="display: none;">
          <div class="loading-spinner"></div>
          <div class="loading-text">✨ AI正在为您智能生成回复...</div>
        </div>

        <div id="reply-list" class="reply-list" style="display: none;"></div>

        <div id="action-buttons" class="action-buttons" style="display: none;">
          <button class="btn-primary" onclick="copyReply()">📋 复制回复</button>
          <button class="btn-secondary" onclick="useReply()">✉️ 使用回复</button>
        </div>
      </div>

      <!-- 情绪分析 -->
      <div id="tab-emotion" class="tab-panel" style="display: none;">
        <div class="demo-badge">🔍 AI智能分析消息中的情绪</div>
        <div class="section-title">💬 输入女朋友的消息</div>
        <textarea id="emotion-message" class="textarea-field" placeholder="例如：你根本就不在乎我..." oninput="autoResize(this)"></textarea>
        
        <button class="btn-primary" onclick="analyzeEmotion()" id="analyze-btn">
          🔍 分析情绪
        </button>

        <div id="emotion-loading" class="loading-container" style="display: none;">
          <div class="loading-spinner"></div>
          <div class="loading-text">🔬 正在分析情绪...</div>
        </div>

        <div id="emotion-result" class="emotion-result" style="display: none;"></div>
      </div>

      <!-- 女朋友人设 -->
      <div id="tab-profile" class="tab-panel" style="display: none;">
        <div class="demo-badge">👧 设置人设让回复更个性化</div>
        
        <div class="form-item">
          <label class="form-label">昵称</label>
          <input type="text" class="input-field" id="profile-name" placeholder="例如：宝贝">
        </div>

        <div class="form-item">
          <label class="form-label">性格</label>
          <input type="text" class="input-field" id="profile-personality" placeholder="例如：温柔、可爱、活泼">
        </div>

        <div class="form-item">
          <label class="form-label">喜好</label>
          <textarea class="textarea-field" id="profile-likes" placeholder="例如：喜欢吃甜食、追剧、旅游"></textarea>
        </div>

        <div class="form-item">
          <label class="form-label">雷点</label>
          <textarea class="textarea-field" id="profile-dislikes" placeholder="例如：讨厌敷衍、迟到、不讲卫生"></textarea>
        </div>

        <div class="form-item">
          <label class="form-label">沟通风格</label>
          <input type="text" class="input-field" id="profile-communication" placeholder="例如：喜欢直接表达、需要哄">
        </div>

        <button class="btn-primary" onclick="saveProfile()">💾 保存人设</button>
        <button class="btn-secondary" onclick="clearProfile()">🗑️ 清除人设</button>
      </div>

      <!-- 历史记录 -->
      <div id="tab-history" class="tab-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div class="section-title">📜 历史记录</div>
          <button onclick="clearHistory()" style="background: none; border: none; color: #FF8FB1; font-size: 13px; cursor: pointer;">🗑️ 清除</button>
        </div>

        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <div class="footer">
      <p>💖 恋爱回复助手 · Trae AI创意初赛参赛作品 · 无需后端即可体验</p>
    </div>
  </div>

  <!-- 反馈弹窗 -->
  <div id="feedback-modal" class="feedback-modal" style="display: none;" onclick="closeFeedback()">
    <div class="feedback-content" onclick="event.stopPropagation()">
      <div class="feedback-title">😄 回复效果如何？</div>
      <div class="feedback-emojis">
        <div class="feedback-emoji" onclick="submitFeedback('great')">😍</div>
        <div class="feedback-emoji" onclick="submitFeedback('good')">🙂</div>
        <div class="feedback-emoji" onclick="submitFeedback('bad')">😕</div>
        <div class="feedback-emoji" onclick="submitFeedback('angry')">😠</div>
      </div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <script>

        intensity: 7,
        analysis: '消息中透露出低落和委屈的情绪，可能在期待你的关注和安慰。这时候需要先关注情绪，再解决问题。',
        suggestions: ['先表达关心和在意', '不要急着讲道理', '用温暖的语气回应', '可以配合表情包缓解气氛'],
        warning: '⚠️ 此时不宜讲大道理或争论对错，先安抚情绪最重要'
      },
      {
        emotion: '生气 😤',
        intensity: 8,
        analysis: '从语气中可以感受到明显的愤怒情绪。可能是某件事触碰到了她的底线，或者积压已久的不满爆发了。',
        suggestions: ['先诚恳道歉', '不要解释或找借口', '等她情绪平复再沟通', '可以实际行动弥补'],
        warning: '⚠️ 高能预警！此时不要讲道理、不要冷战、不要说"至于吗"'
      },
      {
        emotion: '开心 😊',
        intensity: 6,
        analysis: '心情不错！这是个拉近关系的好机会，可以顺势多聊几句增进感情。',
        suggestions: ['一起分享快乐', '适当夸奖她', '可以约个饭或活动', '记录她开心的样子'],
        warning: ''
      },
      {
        emotion: '撒娇 🥺',
        intensity: 5,
        analysis: '她在用撒娇的方式寻求你的关注和宠爱。这是恋爱中的甜蜜时刻，要积极回应哦！',
        suggestions: ['宠她！满足她的小要求', '用宠溺的语气回复', '可以反撩回去', '趁机约个会'],
        warning: ''
      },
      {
        emotion: '平淡 😐',
        intensity: 3,
        analysis: '情绪比较平淡，可能只是日常闲聊。可以主动制造一些话题或惊喜让聊天更有趣。',
        suggestions: ['找个有趣的话题', '分享今天的有趣事', '可以约周末活动', '发个可爱的表情包'],
        warning: ''
      },
      {
        emotion: '生气 😠',
        intensity: 9,
        analysis: '非常愤怒！这已经不是普通的生气了。消息中带着明显的不满和失望，需要认真对待。',
        suggestions: ['立即停止争论', '认真道歉并承认错误', '给她时间和空间', '用行动来弥补'],
        warning: '⚠️ 红色警报！先冷静下来，不要激化矛盾。建议等她情绪稳定后再深入沟通'
      }
    ];

    // ============ 核心逻辑 ============
    let currentMode = 'normal';
    let selectedReplyIndex = -1;
    let replies = [];

    const STORAGE_KEY_PROFILE = 'gf_profile';
    const STORAGE_KEY_HISTORY = 'gf_history';

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
    }

    function switchTab(tabName, el) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      el.classList.add('active');
      document.getElementById('tab-' + tabName).style.display = 'block';
      if (tabName === 'profile') loadProfile();
      if (tabName === 'history') loadHistory();
    }

    function selectMode(mode, el) {
      currentMode = mode;
      document.querySelectorAll('.mode-tag').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    // ============ 智能匹配回复 ============
    function matchIntent(message) {
      const msg = message.toLowerCase();
      if (/累|困|疲惫|乏|虚脱/.test(msg)) return 'tired';
      if (/饿|吃|饭|餐|美食|火锅|奶茶/.test(msg)) return 'hungry';
      if (/难过|伤心|哭|委屈|泪|呜呜/.test(msg)) return 'sad';
      if (/生气|气死|烦|讨厌|怒|滚|不理/.test(msg)) return 'angry';
      if (/开心|高兴|哈哈|笑死|太棒|快乐/.test(msg)) return 'happy';
      if (/想你|爱你|亲|抱|喜欢|宝贝|晚安/.test(msg)) return 'love';
      if (/忙|开会|工作|加班|有事/.test(msg)) return 'busy';
      return null;
    }

    function generateDemoReplies(message, mode) {
      const intent = matchIntent(message);
      
      // 如果用忙碌模式，返回忙碌模式的固定回复
      if (mode === 'busy') return DEMO_REPLIES.busy;
      if (mode === 'video') return DEMO_REPLIES.video;
      if (mode === 'emotion') return DEMO_REPLIES.emotion;

      // 日常模式 - 根据意图匹配
      if (intent && DEMO_REPLIES.normal[intent]) {
        return DEMO_REPLIES.normal[intent];
      }

      // 默认回复
      return [
        { type: '温柔型', content: '嗯嗯，我在听呢~你说什么都好，有我在呢💕' },
        { type: '幽默型', content: '收到收到！你的专属AI男友已上线！请下达指令~🫡' },
        { type: '直男型', content: '好的知道了。对了，今晚想吃什么？我请你。' }
      ];
    }

    // ============ 生成回复 ============
    async function generateReply() {
      const message = document.getElementById('message-input').value.trim();
      if (!message) { showToast('请输入消息内容'); return; }

      const btn = document.getElementById('generate-btn');
      const loading = document.getElementById('loading-container');
      const replyList = document.getElementById('reply-list');
      const actionButtons = document.getElementById('action-buttons');

      btn.disabled = true;
      loading.style.display = 'block';
      replyList.style.display = 'none';
      actionButtons.style.display = 'none';
      selectedReplyIndex = -1;

      // 模拟AI延迟
      await new Promise(resolve => setTimeout(resolve, 1200 + Math.random() * 800));

      replies = generateDemoReplies(message, currentMode);
      renderReplies(replies);
      replyList.style.display = 'block';
      actionButtons.style.display = 'flex';
      btn.disabled = false;
      loading.style.display = 'none';
    }

    function renderReplies(replies) {
      const container = document.getElementById('reply-list');
      container.innerHTML = replies.map((reply, index) => `
        <div class="reply-card" onclick="selectReply(${index})">
          <div class="reply-type">【${reply.type}】</div>
          <div class="reply-content">${reply.content}</div>
        </div>
      `).join('');
    }

    function selectReply(index) {
      selectedReplyIndex = index;
      document.querySelectorAll('.reply-card').forEach((card, i) => {
        card.classList.toggle('selected', i === index);
      });
    }

    function copyReply() {
      if (selectedReplyIndex === -1) { showToast('请先选择一个回复'); return; }
      navigator.clipboard.writeText(replies[selectedReplyIndex].content).then(() => {
        showToast('✅ 已复制到剪贴板');
      }).catch(() => {
        showToast('📋 ' + replies[selectedReplyIndex].content);
      });
    }

    function useReply() {
      if (selectedReplyIndex === -1) { showToast('请先选择一个回复'); return; }
      const reply = replies[selectedReplyIndex];
      const message = document.getElementById('message-input').value.trim();
      
      addHistory({
        message,
        reply: reply.content,
        mode: currentMode,
        type: reply.type,
        feedback: null
      });

      document.getElementById('feedback-modal').style.display = 'flex';
    }

    function closeFeedback() {
      document.getElementById('feedback-modal').style.display = 'none';
      document.getElementById('message-input').value = '';
      document.getElementById('reply-list').style.display = 'none';
      document.getElementById('action-buttons').style.display = 'none';
      replies = [];
    }

    function submitFeedback(rating) {
      const history = getHistory();
      if (history.length > 0) {
        history[0].feedback = rating;
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
      }
      closeFeedback();
      showToast('感谢您的反馈！❤️');
    }

    // ============ 情绪分析 ============
    async function analyzeEmotion() {
      const message = document.getElementById('emotion-message').value.trim();
      if (!message) { showToast('请输入消息内容'); return; }

      const btn = document.getElementById('analyze-btn');
      const loading = document.getElementById('emotion-loading');
      const result = document.getElementById('emotion-result');

      btn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 500));

      const emotionData = DEMO_EMOTIONS[Math.floor(Math.random() * DEMO_EMOTIONS.length)];
      renderEmotionResult(emotionData);
      result.style.display = 'block';
      btn.disabled = false;
      loading.style.display = 'none';
    }

    function renderEmotionResult(data) {
      const container = document.getElementById('emotion-result');
      const emotionClass = getEmotionClass(data.emotion);
      
      container.innerHTML = `
        <div class="emotion-tag ${emotionClass}">${data.emotion} (强度: ${data.intensity}/10)</div>
        <div class="emotion-analysis">${data.analysis}</div>
        ${data.suggestions.length ? `
          <div class="emotion-suggestions">
            <h4>💡 回复建议</h4>
            <ul>${data.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
          </div>
        ` : ''}
        ${data.warning ? `<div class="emotion-warning">${data.warning}</div>` : ''}
      `;
    }

    function getEmotionClass(emotion) {
      if (emotion.includes('开心') || emotion.includes('撒娇')) return 'emotion-happy';
      if (emotion.includes('生气')) return 'emotion-angry';
      if (emotion.includes('委屈')) return 'emotion-sad';
      return 'emotion-normal';
    }

    // ============ 人设管理 ============
    function getProfile() {
      const data = localStorage.getItem(STORAGE_KEY_PROFILE);
      return data ? JSON.parse(data) : { name: '', personality: '', likes: '', dislikes: '', communicationStyle: '' };
    }

    function setProfile(profile) {
      localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
    }

    function loadProfile() {
      const profile = getProfile();
      document.getElementById('profile-name').value = profile.name || '';
      document.getElementById('profile-personality').value = profile.personality || '';
      document.getElementById('profile-likes').value = profile.likes || '';
      document.getElementById('profile-dislikes').value = profile.dislikes || '';
      document.getElementById('profile-communication').value = profile.communicationStyle || '';
    }

    function saveProfile() {
      const profile = {
        name: document.getElementById('profile-name').value,
        personality: document.getElementById('profile-personality').value,
        likes: document.getElementById('profile-likes').value,
        dislikes: document.getElementById('profile-dislikes').value,
        communicationStyle: document.getElementById('profile-communication').value
      };
      setProfile(profile);
      showToast('💾 保存成功');
    }

    function clearProfile() {
      if (confirm('确定要清除所有人设信息吗？')) {
        setProfile({ name: '', personality: '', likes: '', dislikes: '', communicationStyle: '' });
        loadProfile();
        showToast('🗑️ 已清除');
      }
    }

    // ============ 历史记录 ============
    function getHistory() {
      const data = localStorage.getItem(STORAGE_KEY_HISTORY);
      return data ? JSON.parse(data) : [];
    }

    function addHistory(item) {
      const history = getHistory();
      history.unshift({ ...item, id: Date.now(), timestamp: new Date().toISOString() });
      if (history.length > 50) history.pop();
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
    }

    function loadHistory() {
      const history = getHistory();
      const container = document.getElementById('history-list');
      
      if (history.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">还没有历史记录，快去生成回复吧！</div>
          </div>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-message">💬 ${item.message}</div>
          <div class="history-reply">✉️ ${item.reply}</div>
          <div class="history-meta">${getModeText(item.mode)} · ${getFeedbackEmoji(item.feedback)} · ${formatTime(item.timestamp)}</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm('确定要清除所有历史记录吗？')) {
        localStorage.removeItem(STORAGE_KEY_HISTORY);
        loadHistory();
        showToast('🗑️ 已清除');
      }
    }

    function getModeText(mode) {
      return { 'normal': '日常', 'busy': '忙碌', 'video': '视频', 'emotion': '情绪' }[mode] || mode;
    }

    function getFeedbackEmoji(feedback) {
      return { 'great': '😍', 'good': '🙂', 'bad': '😕', 'angry': '😠' }[feedback] || '';
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    // ============ 初始化示例数据 ============
    (function initDemoData() {
      if (!localStorage.getItem(STORAGE_KEY_HISTORY)) {
        const sampleHistory = [
          {
            id: Date.now() - 86400000,
            message: '今天好累啊...',

            mode: 'normal',
            type: '温柔型',
            feedback: 'good',
            timestamp: new Date(Date.now() - 86400000).toISOString()
          },
          {
            id: Date.now() - 172800000,
            message: '你根本就不在乎我！',
            reply: '对不起宝贝，我错了😔 你别生气，气坏了身体我会心疼的',
            mode: 'normal',
            type: '温柔型',
            feedback: 'great',
            timestamp: new Date(Date.now() - 172800000).toISOString()
          },
          {
            id: Date.now() - 259200000,
            message: '想你啦~',
            reply: '我也想你呀宝贝❤️ 每次想到你心里都暖暖的，你是我最珍贵的宝贝',
            mode: 'normal',
            type: '温柔型',
            feedback: null,
            timestamp: new Date(Date.now() - 259200000).toISOString()
          }
        ];
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(sampleHistory));
      }
    })();

    // 初始化
    loadProfile();
  </script>
