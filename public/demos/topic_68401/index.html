<style>
  :root {
    --bg: #FAF8F5;
    --bg2: #FFFFFF;
    --ink: #2D2D2D;
    --muted: #8A8A8A;
    --rule: #E8E4DF;

    --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @font-face {
    font-family: 'AppFont';
    src: local('PingFang SC'), local('Microsoft YaHei'), local('Noto Sans CJK SC'), sans-serif;
  }

  body {
    font-family: 'AppFont', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #E5E1DC;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
  }

  .phone-frame {
    width: 100%;
    max-width: 420px;
    min-height: 800px;
    background: var(--bg);
    border-radius: 40px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--bg);
  }

  .page {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 100px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 登录页 ===== */
  .login-page {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    animation: fadeIn 0.4s ease;
  }

  .login-page.active { display: flex; }

  .login-logo {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 12px;
    padding: 20px 36px;
    border-radius: 16px;
    display: inline-block;
    text-shadow: none;
    box-shadow: none;
    border: none;
  }

  .login-logo .login-sign-char {
    background: linear-gradient(135deg, #FF6B9D, #C77DFF, #00BBF9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .login-tagline {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .login-form {
    width: 100%;
  }

  .login-form input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    font-size: 15px;
    color: var(--ink);
    outline: none;
    margin-bottom: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .login-form input:focus {
    border-color: var(--accent);
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(196,131,58,0.3);
    font-family: inherit;
  }

  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(196,131,58,0.4);
  }

  /* ===== 首页 ===== */
  .home-header {
    padding-top: 8px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .app-name {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .login-sign-char {
    display: inline-block;
    opacity: 0;
    animation: loginSignWrite 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  @keyframes loginSignWrite {
    0% {
      opacity: 0;
      transform: translateY(80px) scale(0.3) rotate(-20deg);
      filter: blur(15px);
    }
    15% {
      opacity: 1;
      transform: translateY(-15px) scale(1.3) rotate(8deg);
      filter: blur(2px);
    }
    30% {
      transform: translateY(5px) scale(0.95) rotate(-3deg);
      filter: blur(0);
    }
    45% {
      transform: translateY(0) scale(1) rotate(0deg);
    }
    80% {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0deg);
      filter: blur(0);
    }
    92% {
      opacity: 0.3;
      transform: translateY(-30px) scale(0.88) rotate(6deg);
      filter: blur(6px);
    }
    100% {
      opacity: 0;
      transform: translateY(-50px) scale(0.65) rotate(12deg);
      filter: blur(12px);
    }
  }

  .app-tagline {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg2);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--rule);
  }

  .quick-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .quick-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: var(--accent-light);
    color: var(--accent);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .quick-tag:hover {
    background: var(--accent);
    color: white;
  }

  .quick-tag.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(196,131,58,0.3);
  }

  .input-area {
    background: var(--bg2);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    position: relative;
  }

  .input-area textarea {
    width: 100%;
    min-height: 200px;
    border: none;
    outline: none;
    resize: none;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    background: transparent;
    font-family: inherit;
  }

  .input-area textarea::placeholder {
    color: #C0BCB7;
  }

  .note-link {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    font-family: inherit;
    margin-top: 8px;
    transition: border-color 0.2s;
  }

  .note-link:focus {
    border-color: var(--accent);
  }

  .toggle-link-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    z-index: 2;
  }

  .toggle-link-btn:hover {
    opacity: 1;
  }

  .input-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }

  .voice-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 24px;
    background: var(--accent2-light);
    color: var(--accent2);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .voice-btn:hover, .voice-btn:active {
    background: var(--accent2);
    color: white;
  }

  .voice-btn svg {
    width: 18px;
    height: 18px;
  }

  .record-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 24px;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(196,131,58,0.35);
    font-family: inherit;
  }

  .record-btn:hover, .record-btn:active {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(196,131,58,0.45);
  }

  .record-btn svg {
    width: 18px;
    height: 18px;
  }

  .today-preview {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .today-preview h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .preview-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .preview-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }

  .preview-item:last-child { border-bottom: none; }

  .preview-time {
    font-size: 12px;
    color: var(--muted);
    min-width: 40px;
    font-weight: 500;
  }

  .preview-text {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.5;
    flex: 1;
  }

  .preview-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
  }

  .preview-tag.idea {
    background: var(--accent2-light);
    color: var(--accent2);
  }

  /* ===== 宠物区域 ===== */
  .pet-area {
    background: var(--bg2);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
  }

  .pet-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
    background: var(--accent-light);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  .pet-avatar:hover {
    transform: scale(1.05);
  }

  .pet-name {
    font-size: 16px;
    font-weight: 700;
  }

  .pet-status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .pet-status.happy { color: var(--accent2); font-weight: 600; }
  .pet-status.tired { color: var(--danger); font-weight: 600; }

  .pet-energy-bar {
    width: 100%;
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
  }

  .pet-energy-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .pet-customize-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--bg);
    border: 1px solid var(--rule);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  /* ===== 3D 悬浮小猫 ===== */
  .cat-3d-wrap {
    perspective: 600px;
    display: inline-block;
    margin-bottom: 10px;
  }

  .cat-3d {
    width: 90px;
    height: 90px;
    position: relative;
    transform-style: preserve-3d;
    animation: catFloat 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .cat-3d:hover {
    animation-play-state: paused;
    transform: rotateY(15deg) rotateX(-5deg);
  }

  @keyframes catFloat {
    0%, 100% { transform: translateY(0) rotateY(0deg); }
    50% { transform: translateY(-10px) rotateY(5deg); }
  }

  .cat-face {
    width: 70px;
    height: 60px;
    background: linear-gradient(135deg, #C77DFF 0%, #9B5DE5 100%);
    border-radius: 50% 50% 45% 45%;
    position: absolute;
    top: 18px;
    left: 10px;
    box-shadow: 0 6px 16px rgba(155,93,229,0.3), inset 0 -3px 8px rgba(0,0,0,0.08);
    z-index: 2;
  }

  .cat-ear {
    width: 22px;
    height: 24px;
    background: linear-gradient(135deg, #FF6B9D 0%, #C77DFF 100%);
    border-radius: 50% 50% 0 0;
    position: absolute;
    top: 2px;
    z-index: 1;
  }

  .cat-ear.left {
    left: 10px;
    transform: rotate(-20deg);
  }

  .cat-ear.right {
    right: 10px;
    transform: rotate(20deg);
  }

  .cat-ear-inner {
    width: 12px;
    height: 14px;
    background: #F3E5F5;
    border-radius: 50% 50% 0 0;
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
  }

  .cat-eye {
    width: 10px;
    height: 10px;
    background: #2D2D2D;
    border-radius: 50%;
    position: absolute;
    top: 22px;
    animation: catBlink 4s infinite;
  }

  .cat-eye.left { left: 16px; }
  .cat-eye.right { right: 16px; }

  .cat-eye::after {
    content: '';
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    right: 2px;
  }

  @keyframes catBlink {
    0%, 96%, 100% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
  }

  .cat-eye.sleepy {
    background: transparent;
    border-bottom: 2px solid #2D2D2D;
    border-radius: 0;
    height: 4px;
    animation: none;
  }

  .cat-eye.sleepy::after { display: none; }

  .cat-eye.happy {
    background: transparent;
    width: 10px;
    height: 5px;
    border-bottom: 3px solid #2D2D2D;
    border-radius: 0 0 10px 10px;
    animation: none;
  }

  .cat-eye.happy::after { display: none; }

  .cat-nose {
    width: 8px;
    height: 6px;
    background: #FF6B9D;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
  }

  .cat-mouth {
    width: 16px;
    height: 8px;
    border-bottom: 2px solid #2D2D2D;
    border-radius: 0 0 16px 16px;
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
  }

  .cat-mouth.happy {
    width: 20px;
    height: 10px;
    border-bottom: 3px solid #2D2D2D;
    border-radius: 0 0 20px 20px;
  }

  .cat-mouth.sleepy {
    width: 6px;
    height: 6px;
    border: 2px solid #2D2D2D;
    border-radius: 50%;
    border-top-color: transparent;
    border-left-color: transparent;
    transform: translateX(-50%) rotate(45deg);
  }

  .cat-whisker {
    width: 18px;
    height: 1.5px;
    background: rgba(45,45,45,0.25);
    position: absolute;
    top: 34px;
    z-index: 3;
  }

  .cat-whisker.wl1 { left: -4px; transform: rotate(-5deg); }
  .cat-whisker.wl2 { left: -2px; top: 40px; transform: rotate(5deg); }
  .cat-whisker.wr1 { right: -4px; transform: rotate(5deg); }
  .cat-whisker.wr2 { right: -2px; top: 40px; transform: rotate(-5deg); }

  .cat-tail {
    width: 10px;
    height: 36px;
    background: linear-gradient(180deg, #00BBF9 0%, #C77DFF 100%);
    border-radius: 0 10px 10px 0;
    position: absolute;
    bottom: -2px;
    right: -2px;
    transform-origin: bottom left;
    animation: catTailWag 2s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes catTailWag {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(25deg); }
  }

  .cat-paw {
    width: 14px;
    height: 10px;
    background: #F3E5F5;
    border-radius: 50%;
    position: absolute;
    bottom: -2px;
    z-index: 3;
  }

  .cat-paw.left { left: 16px; }
  .cat-paw.right { right: 16px; }

  .cat-cheek {
    width: 10px;
    height: 6px;
    background: rgba(255,107,157,0.25);
    border-radius: 50%;
    position: absolute;
    top: 32px;
    z-index: 2;
  }

  .cat-cheek.left { left: 8px; }
  .cat-cheek.right { right: 8px; }

  /* ===== 伙伴预览 ===== */
  .partner-preview {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.2s;
  }

  .partner-preview:hover {
    box-shadow: var(--shadow-lg);
  }

  .partner-preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .partner-preview-header h4 {
    font-size: 14px;
    font-weight: 600;
  }

  .partner-preview-header .status {
    font-size: 12px;
    color: var(--muted);
  }

  .partner-preview-content {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .partner-record {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }

  .partner-record:last-child { border-bottom: none; }

  /* ===== 搜索框 ===== */
  .search-box {
    position: relative;
    margin-bottom: 16px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--muted);
  }

  .search-box .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--rule);
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .search-box .search-clear.visible {
    display: flex;
  }

  /* ===== 打卡标记 ===== */
  .calendar-day.checked-in {
    box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(199,125,255,0.3);
  }

  .calendar-day.checked-in::before {
    content: '\2713';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 9px;
    color: var(--accent);
    font-weight: 700;
  }

  .calendar-day.today.checked-in::before {
    color: white;
  }

  .calendar-day.missed {
    opacity: 0.5;
  }

  .checkin-btn {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    background: linear-gradient(135deg, #FF6B9D, #C77DFF, #00BBF9);
    color: white;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    font-family: inherit;
  }

  .checkin-btn:disabled {
    background: var(--rule);
    color: var(--muted);
    cursor: not-allowed;
  }

  /* ===== 广告弹窗 ===== */
  .ad-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }

  .ad-overlay.active {
    display: flex;
  }

  .ad-box {
    background: var(--bg2);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    animation: modalIn 0.3s ease;
  }

  .ad-box h4 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .ad-box p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .ad-timer {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin: 16px 0;
  }

  .ad-progress {
    width: 100%;
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .ad-progress-fill {
    height: 100%;

    font-size: 13px;

    margin-bottom: 8px;

  .time-filters {

  .time-filter {

    border: 1px solid var(--rule);

    color: var(--muted);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: all 0.2s;

  .type-filter.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);

  .week-heatmap {

  .heatmap-title {

  .week-compare {

  .week-compare h4 {

    font-weight: 600;

  .compare-day {

  .compare-day:last-child { border-bottom: none; }

  .compare-day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;

  .compare-day-name {
    font-size: 14px;
    font-weight: 600;
  }

  .compare-day-date {
    font-size: 12px;

  .compare-items {
    display: flex;
    flex-direction: column;
    gap: 6px;

  .compare-item {
    font-size: 13px;
    color: var(--ink);
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 8px;
    line-height: 1.5;
  }

  .compare-empty {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 6px 10px;
  }

  /* ===== 我的（日历） ===== */
  .calendar-card {
    background: var(--bg2);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .calendar-header h3 {
    font-size: 16px;
    font-weight: 700;
  }

  .calendar-nav {
    display: flex;
    gap: 8px;
  }

  .calendar-nav button {
    background: var(--bg);
    border: 1px solid var(--rule);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }

  .calendar-grid .weekday {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    padding: 6px 0;
  }

  .calendar-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .calendar-day:hover {
    background: var(--accent-light);
  }

  .calendar-day.other-month {
    color: #D0CCC7;
  }

  .calendar-day.today {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 10px rgba(196,131,58,0.35);
  }

  .calendar-day.selected {
    background: var(--accent2);
    color: white;
  }

  .calendar-day.has-data::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .calendar-day.today.has-data::after,
  .calendar-day.selected.has-data::after {
    background: white;
  }

  .day-detail {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .day-detail h4 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .day-detail-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }

  .day-detail-item:last-child { border-bottom: none; }

  .day-detail-time {
    font-size: 13px;
    color: var(--muted);
    min-width: 44px;
    font-weight: 500;
  }

  .day-detail-text {
    font-size: 14px;
    line-height: 1.6;
    flex: 1;
  }

  /* ===== 伙伴页面 ===== */
  .partner-page {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .partner-page.active { display: block; }

  .partner-card {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .partner-card h4 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .partner-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto 10px;
  }

  .partner-name {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }

  .partner-status {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .partner-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .partner-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .partner-btn.primary {
    background: var(--accent);
    color: white;
  }

  .partner-btn.secondary {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--rule);
  }

  .partner-btn.danger {
    background: #FDE8E8;
    color: var(--danger);
  }

  .partner-request {
    background: var(--bg2);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .request-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent2-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .request-info {
    flex: 1;
  }

  .request-name {
    font-size: 14px;
    font-weight: 600;
  }

  .request-msg {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;

  .request-actions {
    display: flex;
    gap: 6px;
  }

  .request-actions button {
    padding: 6px 12px;
    border-radius: 10px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-accept {
    background: var(--accent2);
    color: white;
  }

  .btn-decline {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--rule);
  }

  /* ===== 导出按钮 ===== */
  .export-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .export-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    background: var(--bg2);
    border: 1px solid var(--rule);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .export-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ===== 宠物弹窗 ===== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-content {
    background: var(--bg2);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-content h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }

  .modal-content input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--rule);
    font-size: 14px;
    margin-bottom: 12px;
    font-family: inherit;
  }

  .modal-content input[type="file"] {
    width: 100%;
    margin-bottom: 12px;
    font-size: 13px;
  }

  .pet-presets {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .pet-preset {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--rule);
    cursor: pointer;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .pet-preset:hover, .pet-preset.selected {
    border-color: var(--accent);
    transform: scale(1.1);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  /* ===== 底部导航 ===== */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: var(--bg2);
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 10px;
    z-index: 100;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 16px;
    border: none;
    background: none;
    color: var(--muted);
    transition: color 0.2s;
    font-family: inherit;
  }

  .tab-item.active {
    color: var(--accent);
  }

  .tab-item svg {
    width: 24px;
    height: 24px;
  }

  .tab-item span {
    font-size: 11px;
    font-weight: 500;
  }

  /* ===== 通用 ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-state p {
    font-size: 14px;
  }

  .highlight {
    background: #FFF3CD;
    padding: 0 2px;
    border-radius: 2px;
  }

  .floating-pet {
    transition: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .floating-pet.dragging {
    cursor: grabbing !important;
  }

  .floating-pet img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    pointer-events: none;
    display: block;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    font-family: inherit;
  }

  .search-results-header {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .search-result-item {
    background: var(--bg2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }

  .search-result-date {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .search-result-text {
    font-size: 14px;
    line-height: 1.5;
  }

  /* 滚动条美化 */
  .page::-webkit-scrollbar { width: 4px; }
  .page::-webkit-scrollbar-track { background: transparent; }
  .page::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
</style>
</head>

function initCheckIn() {
  // 从 demoData 同步已打卡日期
  Object.keys(demoData).forEach(date => {

  });

function getStreakDays() {
  let streak = 0;
  const [sy, sm, sd] = todayStr.split('-').map(Number);
  const d = new Date(sy, sm - 1, sd);
  d.setHours(0, 0, 0, 0);
  while (true) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dateStr = `${y}-${m}-${day}`;
    if (checkInData[dateStr]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ===== 宠物拖拽 =====
(function initPetDrag() {
  const pet = document.getElementById('floatingPet');
  if (!pet) return;

  let isDragging = false;
  let startX, startY, startLeft, startTop;

  const frame = document.querySelector('.phone-frame');

  // 把 right 定位转换成 left，方便后续统一计算
  function normalizePosition() {
    if (!frame) return;
    const frameRect = frame.getBoundingClientRect();
    const petRect = pet.getBoundingClientRect();
    const currentLeft = petRect.left - frameRect.left;
    const currentTop = petRect.top - frameRect.top;
    pet.style.right = 'auto';
    pet.style.left = currentLeft + 'px';
    pet.style.top = currentTop + 'px';
  }

  // 鼠标拖拽
  pet.addEventListener('mousedown', (e) => {
    isDragging = true;
    pet.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    const rect = pet.getBoundingClientRect();
    const frameRect = frame ? frame.getBoundingClientRect() : { left: 0, top: 0 };
    startLeft = rect.left - frameRect.left;
    startTop = rect.top - frameRect.top;
    pet.style.transition = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    pet.style.left = (startLeft + dx) + 'px';
    pet.style.top = (startTop + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    pet.classList.remove('dragging');
  });

  // 触摸拖拽
  pet.addEventListener('touchstart', (e) => {
    isDragging = true;
    pet.classList.add('dragging');
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    const rect = pet.getBoundingClientRect();
    const frameRect = frame ? frame.getBoundingClientRect() : { left: 0, top: 0 };
    startLeft = rect.left - frameRect.left;
    startTop = rect.top - frameRect.top;
    pet.style.transition = 'none';
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    pet.style.left = (startLeft + dx) + 'px';
    pet.style.top = (startTop + dy) + 'px';
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    pet.classList.remove('dragging');
  });

  // 延迟启动，等页面完全渲染
  setTimeout(() => {
    normalizePosition();
  }, 1000);
})();

function saveNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) {

  // 解析时间
  let timeStr = getCurrentTimeStr();
  let hasExplicitTime = false;
  const parsed = parseExplicitTime(text);
  if (parsed.found) {
    timeStr = parsed.time;
    hasExplicitTime = true;
  }

  // 确定类型
  let type, reminder = false;
  if (hasExplicitTime) {
    type = '待办';
    reminder = true;
  } else {
    const typeMap = { '待办': '待办', '想法': '想法', '梦境': '梦境', '提醒': '待办', '灵感': '灵感' };
    type = typeMap[selectedTag] || '想法';
    if (selectedTag === '提醒') reminder = true;
  }

  // 读取链接
  const linkInput = document.getElementById('noteLink');
  const link = linkInput && linkInput.style.display !== 'none' ? linkInput.value.trim() : '';

  // 保存
  if (!demoData[todayStr]) demoData[todayStr] = [];
  demoData[todayStr].push({ id: _nextId++, time: timeStr, text: text.replace(/^【.*?】/, '').replace(/^[^:]+：/, '').trim() || text, type: type, reminder: reminder, link: link || null });
  demoData[todayStr].sort((a, b) => a.time.localeCompare(b.time));

  const btn = document.querySelector('.record-btn');
  const original = btn.innerHTML;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已保存';

    if (linkInput) {

function getCurrentTimeStr() {
  const now = new Date();
  return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

function parseExplicitTime(str) {
  const numMatch = str.match(/(\d{1,2}):(\d{2})\s*(am|pm|AM|PM)?/);
  if (numMatch) {
    let h = parseInt(numMatch[1]);
    const m = numMatch[2];
    const ap = numMatch[3] ? numMatch[3].toLowerCase() : '';
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return { time: String(h).padStart(2, '0') + ':' + m, found: true };
  }
  const cnMatch = str.match(/(上午|下午|早上|晚上|凌晨)?\s*(\d{1,2})\s*点(?:\s*(半|(\d{1,2}))\s*分?)?/);
  if (cnMatch) {
    const period = cnMatch[1] || '';
    let h = parseInt(cnMatch[2]);
    let m = '00';
    if (cnMatch[3] === '半') {
      m = '30';
    } else if (cnMatch[4]) {
      m = String(parseInt(cnMatch[4])).padStart(2, '0');
    }
    if ((period === '下午' || period === '晚上') && h < 12) h += 12;
    if (period === '凌晨' && h === 12) h = 0;
    return { time: String(h).padStart(2, '0') + ':' + m, found: true };
  }
  return { time: null, found: false };
}

function renderDailyByCategory(items, keyword) {
  const todoItems = items.filter(i => i.type === '待办');
  const ideaItems = items.filter(i => ['想法','灵感','梦境','碎碎念'].includes(i.type));

  const todoEl = document.getElementById('todoList');
  const ideaEl = document.getElementById('ideaList');
  if (todoEl) todoEl.innerHTML = todoItems.length
    ? todoItems.map(item => createTimelineItem(item, keyword)).join('')
    : '<div class="empty-state"><p>暂无待办事项</p></div>';

  if (ideaEl) ideaEl.innerHTML = ideaItems.length
    ? ideaItems.map(item => createTimelineItem(item, keyword)).join('')
    : '<div class="empty-state"><p>暂无想法记录</p></div>';
}

function renderDailyByHour(items, keyword) {
  const hourListEl = document.getElementById('hourList');
  if (!hourListEl) return;
  if (items.length === 0) {
    hourListEl.innerHTML = '<div class="empty-state"><p>暂无记录</p></div>';
    return;
  }
  const hourGroups = {};
  items.forEach(item => {
    if (!item.time) return;
    const h = parseInt(item.time.split(':')[0]);
    if (isNaN(h)) return;
    if (!hourGroups[h]) hourGroups[h] = [];
    hourGroups[h].push(item);
  });

  const sortedHours = Object.keys(hourGroups).sort((a, b) => a - b);
  hourListEl.innerHTML = sortedHours.map(h => {
    const hourItems = hourGroups[h];
    return `<div class="hour-block">
      <div class="hour-label">${String(h).padStart(2, '0')}:00 - ${String(h).padStart(2, '0')}:59</div>
      <div class="hour-items">
        ${hourItems.map(item => createHourItem(item, keyword)).join('')}
      </div>
    </div>`;
  }).join('');
}

function createTimelineItem(item, keyword) {
  const highlighted = highlightText(item.text, keyword);
  const reminderTag = item.reminder ? '<span class="reminder">已设提醒</span>' : '';
  const linkTag = item.link ? `<a class="item-link" href="${item.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">&#128279; 链接</a>` : '';
  return `<div class="timeline-item">
    <div class="timeline-time">
      <div class="hour">${item.time.split(':')[0]}</div>
      <div class="min">:${item.time.split(':')[1]}</div>
    </div>
    <div class="timeline-content">
      <p>${highlighted}</p>
      ${linkTag}
      <div class="timeline-meta"><span>${item.type}</span>${reminderTag}<button class="delete-btn" data-id="${item.id}">删除</button></div>
    </div>
  </div>`;
}

function createHourItem(item, keyword) {
  const reminderTag = item.reminder ? '<span class="reminder">已设提醒</span>' : '';
  const linkTag = item.link ? `<a class="item-link" href="${item.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">&#128279; 链接</a>` : '';
  return `<div class="hour-item">
    <div class="hour-item-time">${item.time}</div>
    <div class="hour-item-text">${highlightText(item.text, keyword)}</div>
    ${linkTag}
    <div class="hour-item-tags"><span>${item.type}</span>${reminderTag}<button class="delete-btn" data-id="${item.id}">删除</button></div>
  </div>`;
}

function highlightText(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(regex, '<mark class="highlight">$1</mark>');
}

function deleteTodayItem(id) {
  if (!confirm('确定要删除这条记录吗？')) return;
  try {
    const items = demoData[todayStr] || [];
    const index = items.findIndex(i => i.id === id);
    if (index >= 0) {
      items.splice(index, 1);
      // 如果当天没有记录了，清除打卡状态
      if (items.length === 0) {
        delete checkInData[todayStr];
      }
      renderDaily();
      updateStats();
      renderTodayPreview();
      updatePetStatus();
      renderCalendar();
      updateStreakDisplay();
    } else {
      console.warn('删除失败：找不到 id 为', id, '的记录');
      alert('删除失败，请刷新页面后重试');
    }

// ===== 我的：搜索 =====
function searchMe() {
  const input = document.getElementById('meSearch');
  const clearBtn = document.getElementById('meSearchClear');
  const keyword = input.value.trim().toLowerCase();
  clearBtn.classList.toggle('visible', keyword.length > 0);

  const resultsDiv = document.getElementById('meSearchResults');
  const calendarCard = document.getElementById('meCalendarCard');
  const dayDetail = document.getElementById('dayDetail');

  if (!keyword) {
    resultsDiv.style.display = 'none';
    calendarCard.style.display = 'block';
    dayDetail.style.display = 'block';
    return;
  }

  const allResults = [];
  Object.keys(demoData).sort().forEach(date => {
    demoData[date].forEach(item => {
      if (item.text.toLowerCase().includes(keyword) || item.type.toLowerCase().includes(keyword)) {
        allResults.push({ date, ...item });
      }
    });
  });

  resultsDiv.style.display = 'block';
  calendarCard.style.display = 'none';
  dayDetail.style.display = 'none';

  document.getElementById('meSearchHeader').textContent = `找到 ${allResults.length} 条记录`;
  document.getElementById('meSearchContent').innerHTML = allResults.length
    ? allResults.map(r => {
        const [y, m, d] = r.date.split('-');
        return `<div class="search-result-item">
          <div class="search-result-date">${parseInt(m)}月${parseInt(d)}日 ${r.time} · ${r.type}</div>
          <div class="search-result-text">${highlightText(r.text, keyword)}</div>
        </div>`;
      }).join('')
    : '<div class="empty-state"><p>未找到匹配记录</p></div>';
}

// ===== 日历功能 =====
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPadding = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate();
  const grid = document.getElementById('calendarGrid');

  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  for (let i = startPadding - 1; i >= 0; i--) {
    const day = document.createElement('div');
    day.className = 'calendar-day other-month';
    day.textContent = prevLastDay - i;
    grid.appendChild(day);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const day = document.createElement('div');
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    let cls = 'calendar-day';
    if (dateStr === todayStr) cls += ' today';
    if (dateStr === selectedDate) cls += ' selected';
    if (demoData[dateStr]) cls += ' has-data';
    if (checkInData[dateStr]) cls += ' checked-in';
    day.className = cls;
    day.textContent = d;
    day.onclick = () => selectDate(dateStr);
    grid.appendChild(day);
  }

  const totalCells = startPadding + daysInMonth;
  const nextPadding = (7 - totalCells % 7) % 7;
  for (let d = 1; d <= nextPadding; d++) {
    const day = document.createElement('div');
    day.className = 'calendar-day other-month';
    day.textContent = d;
    grid.appendChild(day);
  }
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  renderCalendar();
  renderDayDetail(dateStr);
}

function renderDayDetail(dateStr) {
  const [y, m, d] = dateStr.split('-');
  document.getElementById('dayDetailTitle').textContent = `${parseInt(m)}月${parseInt(d)}日 的记录`;
  const content = document.getElementById('dayDetailContent');
  const items = demoData[dateStr];
  const checked = checkInData[dateStr];

  if (!items || items.length === 0) {
    if (checked) {
      content.innerHTML = '<div class="empty-state"><p>&#9989; 已打卡（补卡）</p></div>';
    } else {
      content.innerHTML = '<div class="empty-state"><p>&#128164; 这一天还没有记录，也未打卡</p><button class="checkin-btn" onclick="showAd(\'' + dateStr + '\')">观看广告补卡</button></div>';
    }
    return;
  }
  content.innerHTML = items.map(item => {
    const linkHtml = item.link ? `<a class="item-link" href="${item.link}" target="_blank" rel="noopener">&#128279; 链接</a>` : '';
    return `<div class="day-detail-item">
      <span class="day-detail-time">${item.time}</span>
      <span class="day-detail-text">${item.text}</span>
      ${linkHtml}
    </div>`;
  }).join('');
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderCalendar();
}

// ===== 周报功能 =====
function changeWeek(delta) {
  currentWeekOffset += delta;
  updateWeekLabel();
}

function updateWeekLabel() {
  const base = new Date(2026, 5, 23);
  const start = new Date(base);
  start.setDate(start.getDate() + currentWeekOffset * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = d => `${d.getMonth() + 1}月${d.getDate()}日`;
  document.getElementById('weekLabel').textContent = `${fmt(start)} - ${fmt(end)}`;
}

function selectTimeFilter(btn, filter) {
  currentTimeFilter = filter;
  document.querySelectorAll('.time-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWeekCompare();
  renderWeekHeatmap();
}

function selectTypeFilter(btn, filter) {
  currentTypeFilter = filter;
  document.querySelectorAll('.type-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWeekCompare();
  renderWeekHeatmap();
}

function applyWeekFilters(items) {
  let filtered = items;
  if (currentTimeFilter !== 'all') {
    const [startH] = currentTimeFilter.split('-').map(Number);
    filtered = filtered.filter(item => {
      if (!item.time) return false;
      const h = parseInt(item.time.split(':')[0]);
      return h >= startH && h < startH + 1;
    });
  }
  if (currentTypeFilter !== 'all') {
    filtered = filtered.filter(item => item.type === currentTypeFilter);
  }
  return filtered;
}

function renderWeekCompare() {
  const container = document.getElementById('weekCompare');
  const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const dates = ['2026-06-23', '2026-06-24', '2026-06-25', '2026-06-26', '2026-06-27', '2026-06-28', '2026-06-29'];
  const keyword = document.getElementById('weekSearch').value.trim().toLowerCase();

  let title = currentTimeFilter === 'all' ? '全部记录对比' : `${currentTimeFilter}点 的记录对比`;
  if (currentTypeFilter !== 'all') title += ` · ${currentTypeFilter}`;
  if (keyword) title += ` （搜索：${keyword}）`;
  let html = `<h4>${title}</h4>`;

  days.forEach((dayName, i) => {
    const dateStr = dates[i];
    const items = demoData[dateStr] || [];
    let filtered = applyWeekFilters(items);
    if (keyword) {
      filtered = filtered.filter(item => item.text && item.text.toLowerCase().includes(keyword));
    }

    const [y, m, d] = dateStr.split('-');
    html += `<div class="compare-day">
      <div class="compare-day-header">
        <span class="compare-day-name">${dayName}</span>
        <span class="compare-day-date">${parseInt(m)}月${parseInt(d)}日</span>
      </div>
      <div class="compare-items">`;

    if (filtered.length === 0) {
      html += `<div class="compare-empty">${keyword ? '未找到匹配记录' : '这个时间段没有记录'}</div>`;
    } else {
      filtered.forEach(item => {
        const text = keyword ? highlightText(item.text, keyword) : item.text;
        html += `<div class="compare-item">${item.time} ${text}</div>`;
      });
    }
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function renderWeekHeatmap() {
  const container = document.getElementById('weekHeatmap');
  if (!container) return;
  const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const dates = ['2026-06-23', '2026-06-24', '2026-06-25', '2026-06-26', '2026-06-27', '2026-06-28', '2026-06-29'];

  let maxCount = 0;
  const counts = dates.map(dateStr => {
    const items = demoData[dateStr] || [];
    const filtered = applyWeekFilters(items);
    maxCount = Math.max(maxCount, filtered.length);
    return filtered.length;
  });

  const heatColors = [
    '#e8e8e8',
    '#c4a8ff',
    '#a87aff',
    '#8c4cff',
    '#6b2cff',
    '#4a00e0'
  ];

  let html = '<div class="heatmap-title">本周活跃度</div>';
  html += '<div class="heatmap-grid">';
  days.forEach((day, i) => {
    const count = counts[i];
    const level = maxCount === 0 ? 0 : Math.min(5, Math.floor((count / maxCount) * 5));
    const bg = count === 0 ? heatColors[0] : heatColors[level];
    html += `<div class="heatmap-cell" style="background:${bg};">
      <span>${count}</span>
    </div>`;
  });
  html += '</div>';
  html += '<div class="heatmap-grid" style="margin-top:4px;">';
  days.forEach(day => {
    html += `<div class="heatmap-label">${day}</div>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

function cancelPartner() {
  partnerState.status = 'none';
  savePartnerState();
  updatePartnerPreview();
  renderPartnerPage();
}

function acceptPartner() {
  partnerState.status = 'bound';
  savePartnerState();
  updatePartnerPreview();
  renderPartnerPage();
}

function declinePartner() {
  partnerState.status = 'none';
  savePartnerState();

function unbindPartner() {
  if (confirm('确定要解除与 ' + partnerState.name + ' 的绑定吗？')) {

    updatePartnerPreview();
    backFromPartner();
