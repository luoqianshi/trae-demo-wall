<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心芽秘境——心灵宠物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5deb3 0%, #e8d5f2 100%);
            height: 100vh;
            padding: 20px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: linear-gradient(135deg, #dcb88a 0%, #d4a574 100%);
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(220, 184, 138, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 184, 138, 0.4);
        }

        .page-title {
            background: linear-gradient(135deg, #f5deb3 0%, #e8c992 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #8b7355;
            box-shadow: 0 4px 15px rgba(245, 222, 179, 0.4);
        }

        .pet-name-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #f5deb3 0%, #e8c992 100%);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(245, 222, 179, 0.4);
        }

        .pet-name-label {
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
        }

        .pet-name-input {
            background: transparent;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: #8b7355;
            outline: none;
            width: 120px;
            text-align: center;
        }

        .edit-name-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .edit-name-btn:hover {
            background: rgba(139, 115, 85, 0.1);
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .left-section {
            width: 250px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stats-card {
            background: linear-gradient(135deg, #f5deb3 0%, #e8c992 100%);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(245, 222, 179, 0.4);
        }

        .stats-title {
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(139, 115, 85, 0.2);
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-size: 15px;
            color: #8b7355;
            width: 70px;
            flex-shrink: 0;
        }

        .stat-bar-container {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .stat-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .stat-value {
            font-size: 15px;
            font-weight: bold;
            color: #8b7355;
            width: 40px;
            text-align: right;
        }

        .stat-bar.hunger {
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
        }

        .stat-bar.water {
            background: linear-gradient(90deg, #4ecdc4, #45b7aa);
        }

        .stat-bar.mood {
            background: linear-gradient(90deg, #ffe66d, #ffd93d);
        }

        .stat-bar.growth {
            background: linear-gradient(90deg, #95e1d3, #7dd3c5);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #fff8dc 0%, #f0e68c 100%);
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 18px;
            color: #8b7355;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(240, 230, 140, 0.3);
        }

        .action-btn:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 15px rgba(240, 230, 140, 0.4);
        }

        .center-section {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-area {
            flex: 1;
            background: linear-gradient(135deg, #e8d5b8 0%, #dcc9a0 100%);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(220, 201, 160, 0.4);
            display: flex;
            flex-direction: column;
        }

        .input-title {
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(139, 115, 85, 0.2);
        }

        .input-field {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            transition: border-color 0.3s ease;
            resize: none;
        }

        .input-field:focus {
            border-color: #dcb88a;
            background: #fff;
        }

        .submit-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #dcb88a 0%, #d4a574 100%);
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(220, 184, 138, 0.3);
            align-self: flex-end;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 184, 138, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .pet-image-area {
            flex: 3;
            min-height: 100px;
            background: linear-gradient(135deg, #f5deb3 0%, #e8c992 100%);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 6px 20px rgba(245, 222, 179, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .pet-image {
            width: 95%;
            max-width: 500px;
            height: auto;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
            user-select: none;
            image-rendering: auto;
            image-rendering: crisp-edges;
        }

        .pet-image.happy {
            transform: scale(1.1);
        }

        .pet-image.sad {
            transform: scale(0.9);
        }

        .pet-image.normal {
            transform: scale(1);
        }

        @keyframes eating {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            20% { transform: scale(1.05) translateY(-5px) rotate(-5deg); }
            40% { transform: scale(0.95) translateY(5px) rotate(5deg); }
            60% { transform: scale(1.05) translateY(-5px) rotate(-5deg); }
            80% { transform: scale(0.95) translateY(5px) rotate(5deg); }
        }

        @keyframes drinking {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-10deg); }
            50% { transform: scale(0.95) rotate(10deg); }
            75% { transform: scale(1.05) rotate(-10deg); }
        }

        @keyframes playing {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            25% { transform: scale(1.15) translateY(-30px) rotate(-15deg); }
            50% { transform: scale(1) translateY(-10px) rotate(15deg); }
            75% { transform: scale(1.15) translateY(-25px) rotate(-10deg); }
        }

        .pet-image.eating {
            animation: eating 0.5s ease-in-out 3;
        }

        .pet-image.drinking {
            animation: drinking 0.4s ease-in-out 4;
        }

        .pet-image.playing {
            animation: playing 0.6s ease-in-out 3;
        }

        .pet-message {
            margin-top: 20px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            font-size: 16px;
            color: #8b7355;
            text-align: center;
            max-width: 80%;
            line-height: 1.8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .ai-response-area {
            flex: 2;
            min-height: 150px;
            background: linear-gradient(135deg, #f0e68c 0%, #e6d97a 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(240, 230, 140, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .ai-title {
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(139, 115, 85, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-title-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .clear-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec7063 0%, #e74c3c 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(236, 112, 99, 0.4);
            flex-shrink: 0;
        }

        .clear-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(236, 112, 99, 0.5);
        }

        .speak-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dcb88a 0%, #d4a574 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(220, 184, 138, 0.3);
            flex-shrink: 0;
        }

        .speak-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(220, 184, 138, 0.4);
        }

        .speak-btn.playing {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
        }

        .speak-btn.loading {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
        }

        .loading-dots {
            display: flex;
            gap: 3px;
            align-items: center;
            justify-content: center;
        }

        .loading-dots span {
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            animation: dotBlink 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBlink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .pause-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 7px 0 7px 12px;
            border-color: transparent transparent transparent white;
            margin-left: 2px;
        }

        .ai-content {
            flex: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 2;
            color: #5c4a3a;
            padding-right: 10px;
        }

        .ai-content::-webkit-scrollbar {
            width: 6px;
        }

        .ai-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .ai-content::-webkit-scrollbar-thumb {
            background: rgba(139, 115, 85, 0.3);
            border-radius: 3px;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .chat-message.user {
            background: rgba(78, 205, 196, 0.3);
            align-self: flex-end;
        }

        .chat-message.ai {
            background: rgba(255, 107, 107, 0.2);
        }

        .message-label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .growth-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            animation: bloom 2s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes bloom {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 115, 85, 0.9);
            color: #fff;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            animation: fadeInOut 3s ease-out forwards;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        .action-feedback {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            color: #8b7355;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.5s ease-out;
            z-index: 5;
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .left-section, .center-section {
                width: 100%;
            }

            .action-buttons {
                flex-direction: row;
                justify-content: space-around;
            }

            .action-btn {
                flex: 1;
                margin: 0 5px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="page-title">心灵宠物</div>
        <div class="pet-name-container">
            <span class="pet-name-label">宠物名称：</span>
            <input type="text" class="pet-name-input" id="petNameInput" value="情绪精灵" onblur="savePetName()" onkeypress="handlePetNameKeyPress(event)">
            <button class="edit-name-btn" onclick="editPetName()">✏️</button>
        </div>
    </div>

    <div class="main-content">
        <div class="left-section">
            <div class="stats-card">
                <div class="stats-title">宠物数值</div>
                <div class="stats-list">
                    <div class="stat-item">
                        <span class="stat-label">饱食度</span>
                        <div class="stat-bar-container">
                            <div class="stat-bar hunger" id="hungerBar"></div>
                        </div>
                        <span class="stat-value" id="hungerValue">80</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">饮水度</span>
                        <div class="stat-bar-container">
                            <div class="stat-bar water" id="waterBar"></div>
                        </div>
                        <span class="stat-value" id="waterValue">80</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">心情值</span>
                        <div class="stat-bar-container">
                            <div class="stat-bar mood" id="moodBar"></div>
                        </div>
                        <span class="stat-value" id="moodValue">80</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">成长值</span>
                        <div class="stat-bar-container">
                            <div class="stat-bar growth" id="growthBar"></div>
                        </div>
                        <span class="stat-value" id="growthValue">0</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" onclick="feedPet()">🍖 喂食</button>
                <button class="action-btn" onclick="waterPet()">💧 喂水</button>
                <button class="action-btn" onclick="playPet()">🎮 玩耍</button>
            </div>
        </div>

        <div class="center-section">
            <div class="input-area">
                <div class="input-title">输入区</div>
                <textarea class="input-field" id="userInput" placeholder="和情绪精灵说说你的心情..." onkeypress="handleKeyPress(event)"></textarea>
                <button class="submit-btn" onclick="generateResponse()">发送</button>
            </div>
        </div>

        <div class="right-section">
            <div class="pet-image-area" id="petImageArea">
                <img src="f2e982cbc6aefc339276bc8c600bfdea9453cebbb123-UEnw3D_fw86.png" class="pet-image normal" id="petImage" alt="情绪精灵">
                <div class="pet-message" id="petMessage">我是你的心灵宠物，我可以陪你聊天。</div>
            </div>

            <div class="ai-response-area">
                <div class="ai-title">
                    AI回复区
                    <div class="ai-title-buttons">
                        <button class="speak-btn" id="speakBtn" onclick="playVoice()" title="播放语音">🔊</button>
                        <button class="clear-btn" id="clearBtn" onclick="clearChat()" title="清空聊天记录">🗑️</button>
                    </div>
                </div>
                <div class="ai-content" id="aiContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'sk-YOUR_API_KEY_HERE';
        const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
        const TTS_API_URL = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation';

        let stats = {
            hunger: 80,
            water: 80,
            mood: 80,
            growth: 0
        };

        let chatHistory = [];
        let decreaseInterval = null;
        let lastAIResponse = '';
        let audioPlayer = null;

        function goBack() {
            chatHistory = [];
            document.querySelectorAll('.chat-message').forEach(msg => {
                chatHistory.push({
                    role: msg.classList.contains('user') ? 'user' : 'ai',
                    content: msg.querySelector('.message-content').textContent
                });
            });
            localStorage.setItem('petChatHistory', JSON.stringify(chatHistory));
            localStorage.setItem('petStats', JSON.stringify(stats));
            window.location.href = 'index.html';
        }

        function savePetName() {
            const input = document.getElementById('petNameInput');
            const name = input.value.trim();
            if (name) {
                localStorage.setItem('petName', name);
            } else {
                input.value = '情绪精灵';
            }
        }

        function handlePetNameKeyPress(event) {
            if (event.key === 'Enter') {
                event.target.blur();
            }
        }

        function editPetName() {
            document.getElementById('petNameInput').focus();
            document.getElementById('petNameInput').select();
        }

        function updateStatsDisplay() {
            document.getElementById('hungerBar').style.width = `${stats.hunger}%`;
            document.getElementById('hungerValue').textContent = stats.hunger;
            
            document.getElementById('waterBar').style.width = `${stats.water}%`;
            document.getElementById('waterValue').textContent = stats.water;
            
            document.getElementById('moodBar').style.width = `${stats.mood}%`;
            document.getElementById('moodValue').textContent = stats.mood;
            
            document.getElementById('growthBar').style.width = `${stats.growth * 10}%`;
            document.getElementById('growthValue').textContent = stats.growth;

            updatePetState();
        }

        function updatePetState() {
            const petImage = document.getElementById('petImage');
            
            if (stats.mood >= 70) {
                petImage.className = 'pet-image happy';
            } else if (stats.mood <= 30) {
                petImage.className = 'pet-image sad';
            } else {
                petImage.className = 'pet-image normal';
            }
        }

        function decreaseStats() {
            stats.hunger = Math.max(0, stats.hunger - 2);
            stats.water = Math.max(0, stats.water - 2);
            stats.mood = Math.max(0, stats.mood - 2);
            updateStatsDisplay();
        }

        function feedPet() {
            stats.hunger = Math.min(100, stats.hunger + 10);
            stats.mood = Math.min(100, stats.mood + 2);
            updateStatsDisplay();
            applyAnimation('eating');
            showActionFeedback('🐦 精灵开心地吃了食物！');
        }

        function waterPet() {
            stats.water = Math.min(100, stats.water + 10);
            stats.mood = Math.min(100, stats.mood + 2);
            updateStatsDisplay();
            applyAnimation('drinking');
            showActionFeedback('🐦 精灵快乐地喝了水！');
        }

        function playPet() {
            stats.mood = Math.min(100, stats.mood + 10);
            stats.hunger = Math.max(0, stats.hunger - 3);
            stats.water = Math.max(0, stats.water - 3);
            updateStatsDisplay();
            applyAnimation('playing');
            showActionFeedback('🐦 精灵开心地玩耍！');
        }

        function applyAnimation(animationType) {
            const petImage = document.getElementById('petImage');
            petImage.classList.remove('eating', 'drinking', 'playing');
            
            setTimeout(() => {
                petImage.classList.add(animationType);
                
                setTimeout(() => {
                    petImage.classList.remove(animationType);
                    updatePetState();
                }, getAnimationDuration(animationType));
            }, 50);
        }

        function getAnimationDuration(animationType) {
            const durations = {
                eating: 1500,
                drinking: 1600,
                playing: 1800
            };
            return durations[animationType] || 1500;
        }

        function showActionFeedback(text) {
            const petArea = document.getElementById('petImageArea');
            const feedback = document.createElement('div');
            feedback.className = 'action-feedback';
            feedback.textContent = text;
            petArea.appendChild(feedback);
            
            setTimeout(() => {
                feedback.remove();
            }, 2000);
        }

        function updatePetMessage(text) {
            const message = document.getElementById('petMessage');
            message.textContent = text;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                generateResponse();
            }
        }

        function addChatMessage(role, content) {
            const aiContent = document.getElementById('aiContent');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role}`;
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? '你' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(contentDiv);
            aiContent.appendChild(messageDiv);
            
            aiContent.scrollTop = aiContent.scrollHeight;
        }

        function showGrowthEffect() {
            const petArea = document.getElementById('petImageArea');
            const effect = document.createElement('div');
            effect.className = 'growth-effect';
            effect.textContent = '🌸';
            petArea.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 2000);
            
            showToast('你的宠物又长大了一些！🌟');
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        async function generateResponse() {
            const input = document.getElementById('userInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('请先输入内容！');
                return;
            }

            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;

            addChatMessage('user', content);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'qwen3.6-plus',
                        messages: [
                            {
                                role: 'system',
                                content: '你是一个温暖、友善、充满同理心的青少年心理陪伴助手。你的名字叫心芽，专门帮助青少年疏导情绪、缓解压力。请用温柔、鼓励的语气回应，根据用户的内容生成对应的安慰文字或夸奖的文字。'
                            },
                            {
                                role: 'user',
                                content: content
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0 && data.choices[0].message && data.choices[0].message.content) {
                    const aiResponse = data.choices[0].message.content;
                    addChatMessage('ai', aiResponse);
                    updatePetMessage(aiResponse.length > 30 ? aiResponse.substring(0, 30) + '...' : aiResponse);
                    
                    stats.growth = Math.min(10, stats.growth + 1);
                    updateStatsDisplay();
                    
                    if (stats.growth === 10) {
                        showGrowthEffect();
                    }

                    lastAIResponse = aiResponse;
                    generateVoice(aiResponse);
                } else {
                    throw new Error(`API返回格式错误\n状态码: ${response.status}\n响应数据: ${JSON.stringify(data, null, 2)}`);
                }
            } catch (error) {
                let errorMessage = `AI回复错误:\n\n`;
                errorMessage += `错误类型: ${error.name}\n`;
                errorMessage += `错误信息: ${error.message}\n`;
                
                if (error.stack) {
                    errorMessage += `\n堆栈信息:\n${error.stack}\n`;
                }
                
                addChatMessage('ai', errorMessage);
                updatePetMessage('抱歉，我现在有点累了...💤');
                console.error('API调用失败:', error);
            } finally {
                submitBtn.disabled = false;
                input.value = '';
            }
        }

        function init() {
            const savedStats = localStorage.getItem('petStats');
            if (savedStats) {
                stats = JSON.parse(savedStats);
            }

            const savedName = localStorage.getItem('petName');
            if (savedName) {
                document.getElementById('petNameInput').value = savedName;
            }

            const savedHistory = localStorage.getItem('petChatHistory');
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
                chatHistory.forEach(msg => {
                    addChatMessage(msg.role, msg.content);
                });
            }

            updateStatsDisplay();

            decreaseInterval = setInterval(() => {
                decreaseStats();
                localStorage.setItem('petStats', JSON.stringify(stats));
            }, 3000);
        }

        window.onbeforeunload = function() {
            localStorage.setItem('petStats', JSON.stringify(stats));
            chatHistory = [];
            document.querySelectorAll('.chat-message').forEach(msg => {
                chatHistory.push({
                    role: msg.classList.contains('user') ? 'user' : 'ai',
                    content: msg.querySelector('.message-content').textContent
                });
            });
            localStorage.setItem('petChatHistory', JSON.stringify(chatHistory));
        };

        async function generateVoice(text) {
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.classList.add('loading');
            speakBtn.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
            
            try {
                const response = await fetch(TTS_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'qwen3-tts-flash',
                        input: {
                            text: text,
                            voice: 'Cherry',
                            language_type: 'Chinese'
                        }
                    })
                });

                const data = await response.json();
                
                if (data.output && data.output.audio) {
                    const audioObj = data.output.audio;
                    
                    if (audioObj.url) {
                        const audioUrl = audioObj.url.trim();
                        
                        if (audioPlayer) {
                            audioPlayer.pause();
                        }
                        
                        audioPlayer = new Audio(audioUrl);
                        audioPlayer.onended = function() {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                        };
                        audioPlayer.onerror = function(e) {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                            showVoiceError('音频播放错误', `错误类型: ${e.type}\n音频URL: ${audioUrl}`);
                        };
                        
                        speakBtn.classList.remove('loading');
                        speakBtn.innerHTML = '🔊';
                        audioPlayer.play().then(() => {
                            speakBtn.classList.add('playing');
                            speakBtn.innerHTML = '<div class="pause-icon"></div>';
                        }).catch(err => {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                            showVoiceError('音频播放失败', `错误信息: ${err.message}\n音频URL: ${audioUrl}`);
                        });
                    } else if (audioObj.data && typeof audioObj.data === 'string' && audioObj.data.length > 0) {
                        const audioBlob = base64ToBlob(audioObj.data, 'audio/mpeg');
                        const audioUrl = URL.createObjectURL(audioBlob);
                        
                        if (audioPlayer) {
                            audioPlayer.pause();
                            URL.revokeObjectURL(audioPlayer.src);
                        }
                        
                        audioPlayer = new Audio(audioUrl);
                        audioPlayer.onended = function() {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                        };
                        audioPlayer.onerror = function(e) {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                            showVoiceError('音频播放错误', `错误类型: ${e.type}`);
                        };
                        
                        speakBtn.classList.remove('loading');
                        speakBtn.innerHTML = '🔊';
                        audioPlayer.play().then(() => {
                            speakBtn.classList.add('playing');
                            speakBtn.innerHTML = '<div class="pause-icon"></div>';
                        }).catch(err => {
                            speakBtn.classList.remove('playing', 'loading');
                            speakBtn.innerHTML = '🔊';
                            showVoiceError('音频播放失败', `错误信息: ${err.message}`);
                        });
                    } else {
                        speakBtn.classList.remove('loading');
                        speakBtn.innerHTML = '🔊';
                        showVoiceError('TTS API音频数据格式错误', `响应数据: ${JSON.stringify(data, null, 2)}`);
                    }
                } else {
                    speakBtn.classList.remove('loading');
                    speakBtn.innerHTML = '🔊';
                    showVoiceError('TTS API返回格式错误', `响应数据: ${JSON.stringify(data, null, 2)}`);
                }
            } catch (error) {
                speakBtn.classList.remove('loading');
                speakBtn.innerHTML = '🔊';
                showVoiceError('语音生成失败', `错误类型: ${error.name}\n错误信息: ${error.message}\n\n堆栈信息:\n${error.stack || '无'}`);
            }
        }

        function playVoice() {
            const speakBtn = document.getElementById('speakBtn');
            
            if (!audioPlayer) {
                if (lastAIResponse) {
                    generateVoice(lastAIResponse);
                }
                return;
            }
            
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    speakBtn.classList.add('playing');
                    speakBtn.innerHTML = '<div class="pause-icon"></div>';
                }).catch(err => {
                    speakBtn.classList.remove('playing');
                    speakBtn.innerHTML = '🔊';
                    showVoiceError('音频播放失败', `错误信息: ${err.message}`);
                });
            } else {
                audioPlayer.pause();
                speakBtn.classList.remove('playing');
                speakBtn.innerHTML = '🔊';
            }
        }

        function clearChat() {
            const aiContent = document.getElementById('aiContent');
            aiContent.innerHTML = '';
            chatHistory = [];
            lastAIResponse = '';
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.classList.remove('playing', 'loading');
            speakBtn.innerHTML = '🔊';
        }

        function showVoiceError(title, detail) {
            const aiContent = document.getElementById('aiContent');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'chat-message ai';
            errorDiv.style.background = 'rgba(231, 76, 60, 0.2)';
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = '🔊 语音错误';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.style.whiteSpace = 'pre-wrap';
            contentDiv.style.fontSize = '12px';
            contentDiv.style.color = '#8b4545';
            contentDiv.textContent = `${title}\n\n${detail}`;
            
            errorDiv.appendChild(label);
            errorDiv.appendChild(contentDiv);
            aiContent.appendChild(errorDiv);
            aiContent.scrollTop = aiContent.scrollHeight;
        }

        function base64ToBlob(base64, mimeType) {
            try {
                let safeBase64 = base64
                    .replace(/-/g, '+')
                    .replace(/_/g, '/');
                
                const padding = (4 - (safeBase64.length % 4)) % 4;
                if (padding > 0) {
                    safeBase64 += '='.repeat(padding);
                }
                
                const byteCharacters = atob(safeBase64);
                const byteArrays = [];
                
                for (let offset = 0; offset < byteCharacters.length; offset += 512) {
                    const slice = byteCharacters.slice(offset, offset + 512);
                    const byteNumbers = new Array(slice.length);
                    
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }
                    
                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }
                
                return new Blob(byteArrays, { type: mimeType });
            } catch (e) {
                throw new Error(`Base64解码失败: ${e.message}\n原始数据长度: ${base64.length}\n前100字符: ${base64.substring(0, 100)}`);
            }
        }

        window.onload = init;
    </script>
</body>
