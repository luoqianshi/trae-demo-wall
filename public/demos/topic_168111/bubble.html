<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解压泡泡球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 50%, #ce93d8 100%);
            height: 100vh;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background: linear-gradient(135deg, #ba68c8 0%, #ab47bc 100%);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(171, 71, 188, 0.4);
            transition: all 0.3s ease;
            margin-right: 15px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(171, 71, 188, 0.5);
        }

        .page-title {
            background: linear-gradient(135deg, #ce93d8 0%, #ba68c8 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4a148c;
            box-shadow: 0 4px 15px rgba(206, 147, 216, 0.4);
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .left-section {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .sliders-area {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .slider-container {
            flex: 1;
            background: linear-gradient(135deg, #e1bee7 0%, #ce93d8 100%);
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(225, 190, 231, 0.4);
        }

        .slider-label {
            font-size: 16px;
            font-weight: bold;
            color: #4a148c;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 4px;
        }

        .slider-value {
            font-size: 18px;
            font-weight: bold;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 10px;
            border-radius: 10px;
            min-width: 30px;
            text-align: center;
        }

        .vertical-slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 40px;
        }

        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            outline: none;
            transform: rotate(-90deg);
            transform-origin: center;
            cursor: pointer;
        }

        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ba68c8 0%, #ab47bc 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(171, 71, 188, 0.5);
        }

        .vertical-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ba68c8 0%, #ab47bc 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(171, 71, 188, 0.5);
        }

        .slider-minmax {
            font-size: 12px;
            color: #7b1fa2;
        }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .bubble-area {
            flex: 1;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(206, 147, 216, 0.4);
        }

        #bubbleCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #bubbleCanvas:active {
            cursor: grabbing;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .left-section {
                width: 100%;
            }
            .sliders-area {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="page-title">解压泡泡球</div>
    </div>

    <div class="main-content">
        <div class="left-section">
            <div class="sliders-area">
                <div class="slider-container">
                    <div class="slider-label">球大小</div>
                    <div class="vertical-slider-wrapper">
                        <input type="range" class="vertical-slider" id="sizeSlider" min="1" max="10" value="3" oninput="updateBubbleSettings()">
                    </div>
                    <div class="slider-value" id="sizeValue">3</div>
                    <div class="slider-minmax">1-10</div>
                </div>
                <div class="slider-container">
                    <div class="slider-label">球数量</div>
                    <div class="vertical-slider-wrapper">
                        <input type="range" class="vertical-slider" id="countSlider" min="1" max="200" step="1" value="20" oninput="updateBubbleSettings()">
                    </div>
                    <div class="slider-value" id="countValue">20</div>
                    <div class="slider-minmax">1-200</div>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="bubble-area">
                <canvas id="bubbleCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 泡泡球系统
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');
        let bubbles = [];
        let draggedBubble = null;
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let dragVelocityX = 0;
        let dragVelocityY = 0;

        // 重力加速度
        const gravity = 0.15;

        // 泡泡球设置
        let bubbleSizeLevel = 3;
        let bubbleCount = 20;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bubble {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.color = this.generateColor();
                this.isDragging = false;
            }

            generateColor() {
                // 生成低饱和度的彩色
                const hue = Math.random() * 360;
                const saturation = 30 + Math.random() * 40; // 30-70%
                const lightness = 60 + Math.random() * 20; // 60-80%
                return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            }

            update() {
                if (this.isDragging) {
                    this.x = mouseX;
                    this.y = mouseY;
                    return;
                }

                // 应用重力
                this.vy += gravity;

                this.x += this.vx;
                this.y += this.vy;

                // 边界碰撞
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = Math.abs(this.vx) * 0.8;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx = -Math.abs(this.vx) * 0.8;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = Math.abs(this.vy) * 0.8;
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -Math.abs(this.vy) * 0.6;
                    // 地面摩擦力
                    this.vx *= 0.95;
                }

                // 空气阻力
                this.vx *= 0.995;
                this.vy *= 0.995;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 高光效果
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function createBubbles() {
            bubbles = [];
            const baseRadius = 10 + (bubbleSizeLevel - 1) * 4; // 基础半径10-46

            for (let i = 0; i < bubbleCount; i++) {
                const radius = baseRadius + Math.random() * 10;
                const x = radius + Math.random() * (canvas.width - radius * 2);
                const y = radius + Math.random() * (canvas.height - radius * 2);
                bubbles.push(new Bubble(x, y, radius));
            }
        }

        function checkCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < b1.radius + b2.radius;
        }

        function resolveCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance === 0) return;

            // 分离
            const overlap = b1.radius + b2.radius - distance;
            const nx = dx / distance;
            const ny = dy / distance;

            b1.x -= nx * overlap * 0.5;
            b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5;
            b2.y += ny * overlap * 0.5;

            // 弹性碰撞
            const dvx = b2.vx - b1.vx;
            const dvy = b2.vy - b1.vy;
            const dvDotN = dvx * nx + dvy * ny;

            if (dvDotN > 0) return;

            const impulse = 2 * dvDotN / (b1.radius + b2.radius);
            b1.vx += impulse * b2.radius * nx;
            b1.vy += impulse * b2.radius * ny;
            b2.vx -= impulse * b1.radius * nx;
            b2.vy -= impulse * b1.radius * ny;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 更新和绘制泡泡球
            bubbles.forEach(bubble => {
                bubble.update();
            });

            // 检测碰撞
            for (let i = 0; i < bubbles.length; i++) {
                for (let j = i + 1; j < bubbles.length; j++) {
                    if (checkCollision(bubbles[i], bubbles[j])) {
                        resolveCollision(bubbles[i], bubbles[j]);
                    }
                }
            }

            // 绘制泡泡球
            bubbles.forEach(bubble => {
                bubble.draw();
            });

            requestAnimationFrame(animate);
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            lastMouseX = mouseX;
            lastMouseY = mouseY;
            dragVelocityX = 0;
            dragVelocityY = 0;
            isMouseDown = true;

            // 查找点击的泡泡球
            for (let bubble of bubbles) {
                const dx = mouseX - bubble.x;
                const dy = mouseY - bubble.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < bubble.radius) {
                    draggedBubble = bubble;
                    bubble.isDragging = true;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            // 计算拖动速度
            if (draggedBubble) {
                dragVelocityX = (mouseX - lastMouseX) * 0.5;
                dragVelocityY = (mouseY - lastMouseY) * 0.5;
            }

            lastMouseX = mouseX;
            lastMouseY = mouseY;
        });

        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
            if (draggedBubble) {
                // 应用拖动速度
                draggedBubble.vx = dragVelocityX;
                draggedBubble.vy = dragVelocityY;
                draggedBubble.isDragging = false;
                draggedBubble = null;
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isMouseDown = false;
            if (draggedBubble) {
                // 应用拖动速度
                draggedBubble.vx = dragVelocityX;
                draggedBubble.vy = dragVelocityY;
                draggedBubble.isDragging = false;
                draggedBubble = null;
            }
        });

        function updateBubbleSettings() {
            bubbleSizeLevel = parseInt(document.getElementById('sizeSlider').value);
            bubbleCount = parseInt(document.getElementById('countSlider').value);
            document.getElementById('sizeValue').textContent = bubbleSizeLevel;
            document.getElementById('countValue').textContent = bubbleCount;
            createBubbles();
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // 初始化
        updateBubbleSettings();
        animate();
    </script>
</body>
</html>
