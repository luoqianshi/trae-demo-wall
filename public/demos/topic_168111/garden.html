<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴花园</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            height: 100vh;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 187, 106, 0.4);
            transition: all 0.3s ease;
            margin-right: 15px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.5);
        }

        .page-title {
            background: linear-gradient(135deg, #a5d6a7 0%, #81c784 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
            box-shadow: 0 4px 15px rgba(129, 199, 132, 0.4);
            flex: 1;
            text-align: center;
        }

        .reset-btn {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 83, 80, 0.4);
            transition: all 0.3s ease;
            margin-left: 15px;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 83, 80, 0.5);
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .left-section {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .plant-btn {
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 187, 106, 0.4);
            transition: all 0.3s ease;
        }

        .plant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.5);
        }

        .plant-btn.planting {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .text-area-container {
            flex: 1;
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(165, 214, 167, 0.4);
        }

        .text-area-label {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
        }

        .text-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.6);
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-size: 14px;
            color: #2e7d32;
            resize: none;
            outline: none;
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
        }

        .text-area::placeholder {
            color: #81c784;
        }

        .mood-bar-container {
            width: 80px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #8ec5fc 0%, #a6c0fe 100%);
            border-radius: 15px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 6px 20px rgba(142, 197, 252, 0.4);
        }

        .mood-bar-label {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .mood-slider-container {
            flex: 1;
            width: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
        }

        .mood-slider-track {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 3px;
            top: 10px;
            bottom: 10px;
        }

        .mood-slider-fill {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            background: #fff;
            border-radius: 3px;
            bottom: 10px;
            transition: height 0.3s ease;
        }

        .mood-slider-thumb {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: top 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-value-display {
            font-size: 12px;
            font-weight: bold;
            color: #6b4c8a;
            line-height: 1;
        }

        .mood-slider-thumb:active {
            cursor: grabbing;
            transform: translateX(-50%) scale(1.1);
        }

        .mood-values {
            position: absolute;
            right: -25px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 12px;
            color: #fff;
        }

        .garden-area {
            flex: 1;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 30%, #B0E0E6 60%, #87CEEB 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(135, 206, 235, 0.4);
            cursor: crosshair;
        }

        .garden-grass {
            position: absolute;
            top: 33.33%;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #90EE90 0%, #32CD32 30%, #228B22 70%, #006400 100%);
            border-radius: 0 0 20px 20px;
        }

        .garden-grass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(180deg, #98FB98 0%, #90EE90 100%);
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
        }

        .flower {
            position: absolute;
            font-size: 25px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }

        .flower:hover {
            transform: scale(1.3);
        }

        .flower.dragging {
            pointer-events: none;
            z-index: 1000;
            opacity: 1;
        }

        .flower-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            max-width: 250px;
            z-index: 1000;
            display: none;
            font-size: 14px;
            color: #2e7d32;
            line-height: 1.6;
        }

        .flower-tooltip.show {
            display: block;
        }

        .tooltip-time {
            font-size: 12px;
            color: #81c784;
            margin-bottom: 8px;
        }

        .tooltip-mood {
            font-size: 14px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 8px;
        }

        .tooltip-growth {
            font-size: 14px;
            font-weight: bold;
            color: #4caf50;
            margin-bottom: 8px;
        }

        .tooltip-text {
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .left-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="page-title">心晴花园</div>
        <button class="reset-btn" onclick="resetGarden()">重置花园</button>
    </div>

    <div class="main-content">
        <div class="left-section">
            <button class="plant-btn" id="plantBtn" onclick="togglePlanting()">种植</button>
            <div class="text-area-container">
                <div class="text-area-label">今天心情及发生的事情</div>
                <textarea class="text-area" id="moodText" placeholder="写下今天的心情..."></textarea>
            </div>
        </div>

        <div class="mood-bar-container">
            <div class="mood-bar-label">心情值</div>
            <div class="mood-slider-container" id="sliderContainer">
                <div class="mood-slider-track"></div>
                <div class="mood-slider-fill" id="sliderFill"></div>
                <div class="mood-slider-thumb" id="sliderThumb">
                    <span class="mood-value-display" id="sliderValue">5</span>
                </div>
                <div class="mood-values">
                    <span>10</span>
                    <span>9</span>
                    <span>8</span>
                    <span>7</span>
                    <span>6</span>
                    <span>5</span>
                    <span>4</span>
                    <span>3</span>
                    <span>2</span>
                    <span>1</span>
                </div>
            </div>
        </div>

        <div class="garden-area" id="gardenArea">
            <div class="garden-grass"></div>
        </div>
    </div>

    <div class="flower-tooltip" id="flowerTooltip">
        <div class="tooltip-time" id="tooltipTime"></div>
        <div class="tooltip-mood" id="tooltipMood"></div>
        <div class="tooltip-growth" id="tooltipGrowth"></div>
        <div class="tooltip-text" id="tooltipText"></div>
    </div>

    <script>
        const flowerEmojis = ['🌸', '🌼', '🌺', '🌷', '🌻', '🌞'];

        let isPlanting = false;
        let currentFlower = null;
        let moodValue = 5;
        let plantedFlowers = [];
        let gardenMoodValue = parseInt(localStorage.getItem('starValue')) || 0;
        let gardenCumulativeMood = parseInt(localStorage.getItem('cumulativeMood')) || 0;

        function goBack() {
            window.location.href = 'index.html';
        }

        // 心情条功能
        const sliderContainer = document.getElementById('sliderContainer');
        const sliderThumb = document.getElementById('sliderThumb');
        const sliderFill = document.getElementById('sliderFill');
        const sliderValue = document.getElementById('sliderValue');
        let isDraggingSlider = false;

        function updateSlider(value) {
            moodValue = Math.max(1, Math.min(10, value));
            const percentage = ((moodValue - 1) / 9) * 100;
            sliderThumb.style.top = (100 - percentage) + '%';
            sliderFill.style.height = percentage + '%';
            sliderValue.textContent = moodValue;
        }

        sliderThumb.addEventListener('mousedown', (e) => {
            isDraggingSlider = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingSlider) {
                const rect = sliderContainer.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const percentage = Math.max(0, Math.min(100, 100 - (y / rect.height) * 100));
                const value = Math.round(1 + (percentage / 100) * 9);
                updateSlider(value);
            }

            if (isPlanting && currentFlower) {
                currentFlower.style.left = (e.clientX - 15) + 'px';
                currentFlower.style.top = (e.clientY - 15) + 'px';

                // 检查是否在草地区域上方
                const gardenRect = gardenArea.getBoundingClientRect();
                const flowerTop = e.clientY - gardenRect.top;
                const grassTop = gardenRect.height * 0.3333;

                if (flowerTop < grassTop) {
                    currentFlower.style.opacity = '0.5';
                    currentFlower.style.transform = 'scale(0.8)';
                } else {
                    currentFlower.style.opacity = '0.8';
                    currentFlower.style.transform = 'scale(1)';
                }
            }
        });

        document.addEventListener('mouseup', () => {
            isDraggingSlider = false;
        });

        updateSlider(5);

        // 种植功能
        function togglePlanting() {
            const btn = document.getElementById('plantBtn');
            if (isPlanting) {
                isPlanting = false;
                btn.textContent = '种植';
                btn.classList.remove('planting');
                if (currentFlower) {
                    currentFlower.remove();
                    currentFlower = null;
                }
            } else {
                isPlanting = true;
                btn.textContent = '点击草地种下';
                btn.classList.add('planting');

                // 创建跟随鼠标的花朵
                currentFlower = document.createElement('span');
                currentFlower.className = 'flower dragging';
                const randomEmoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                currentFlower.textContent = randomEmoji;
                currentFlower.dataset.emoji = randomEmoji;
                currentFlower.style.left = '50%';
                currentFlower.style.top = '50%';
                currentFlower.style.fontSize = '25px';
                document.body.appendChild(currentFlower);
            }
        }

        // 花园区域点击种下花朵
        const gardenArea = document.getElementById('gardenArea');

        gardenArea.addEventListener('click', (e) => {
            if (isPlanting && currentFlower) {
                const rect = gardenArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // 只能在草地区域种花（草地从顶部33.33%开始）
                const grassTop = rect.height * 0.3333;
                if (y < grassTop) {
                    alert('请在草地上种花哦！');
                    return;
                }

                const text = document.getElementById('moodText').value.trim();
                const time = new Date().toLocaleString('zh-CN');

                // 计算花朵大小并限制位置在草地范围内
                const flowerSize = calculateFlowerSize(moodValue, gardenCumulativeMood);
                const grassBottom = rect.height - flowerSize;
                const grassRight = rect.width - flowerSize;

                // 限制花朵在草地范围内
                const clampedX = Math.max(0, Math.min(x, grassRight));
                const clampedY = Math.max(grassTop, Math.min(y, grassBottom));

                // 固定种下花朵
                currentFlower.classList.remove('dragging');
                currentFlower.style.left = clampedX + 'px';
                currentFlower.style.top = clampedY + 'px';
                currentFlower.style.position = 'absolute';
                currentFlower.style.fontSize = flowerSize + 'px';
                gardenArea.appendChild(currentFlower);

                // 保存花朵数据
                const flowerData = {
                    id: Date.now(),
                    emoji: currentFlower.dataset.emoji,
                    x: clampedX,
                    y: clampedY,
                    mood: moodValue,
                    text: text,
                    time: time,
                    baseSize: 30,
                    plantedAtCumulative: gardenCumulativeMood
                };
                plantedFlowers.push(flowerData);
                saveFlowers();

                // 添加点击事件
                currentFlower.addEventListener('click', (event) => {
                    event.stopPropagation();
                    showTooltip(flowerData, event);
                });

                // 重置
                currentFlower = null;
                isPlanting = false;
                const btn = document.getElementById('plantBtn');
                btn.textContent = '种植';
                btn.classList.remove('planting');
                document.getElementById('moodText').value = '';
            }
        });

        // 显示花朵详情
        const tooltip = document.getElementById('flowerTooltip');

        function showTooltip(flowerData, event) {
            document.getElementById('tooltipTime').textContent = '时间：' + flowerData.time;
            document.getElementById('tooltipMood').textContent = '心情值：' + flowerData.mood + '/10';
            const plantedAtCumulative = flowerData.plantedAtCumulative || 0;
            const moodDiff = Math.max(0, gardenCumulativeMood - plantedAtCumulative);
            const growthValue = Math.floor(moodDiff / 10);
            document.getElementById('tooltipGrowth').textContent = '成长值：' + growthValue;
            document.getElementById('tooltipText').textContent = flowerData.text || '没有留下文字说明';

            tooltip.style.left = (event.clientX + 20) + 'px';
            tooltip.style.top = (event.clientY - 20) + 'px';
            tooltip.classList.add('show');

            setTimeout(() => {
                tooltip.classList.remove('show');
            }, 5000);
        }

        // 点击其他地方隐藏tooltip
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('flower')) {
                tooltip.classList.remove('show');
            }
        });

        // 保存和加载花朵
        function saveFlowers() {
            localStorage.setItem('gardenFlowers', JSON.stringify(plantedFlowers));
        }

        function loadFlowers() {
            const saved = localStorage.getItem('gardenFlowers');
            if (saved) {
                plantedFlowers = JSON.parse(saved);
                plantedFlowers.forEach(flowerData => {
                    createFlowerElement(flowerData);
                });
            }
        }

        function createFlowerElement(flowerData) {
            // 使用emoji作为花朵
            const flower = document.createElement('span');
            flower.className = 'flower';
            flower.textContent = flowerData.emoji || '🌸';
            flower.style.position = 'absolute';

            // 根据心情值计算大小
            const plantedAtCumulative = flowerData.plantedAtCumulative || 0;
            const size = calculateFlowerSize(flowerData.mood, plantedAtCumulative);

            // 限制花朵在草地范围内
            const rect = gardenArea.getBoundingClientRect();
            const grassTop = rect.height * 0.3333;
            const grassBottom = rect.height - size;
            const grassRight = rect.width - size;

            const clampedX = Math.max(0, Math.min(flowerData.x, grassRight));
            const clampedY = Math.max(grassTop, Math.min(flowerData.y, grassBottom));

            flower.style.left = clampedX + 'px';
            flower.style.top = clampedY + 'px';
            flower.style.fontSize = size + 'px';

            gardenArea.appendChild(flower);

            flower.addEventListener('click', (event) => {
                event.stopPropagation();
                showTooltip(flowerData, event);
            });
        }

        function resetGarden() {
            if (confirm('确定要重置花园吗？所有花朵将被清除。')) {
                plantedFlowers = [];
                saveFlowers();
                
                const flowers = document.querySelectorAll('.flower');
                flowers.forEach(flower => flower.remove());
                
                alert('花园已重置！');
            }
        }

        function calculateFlowerSize(mood, plantedAtCumulative) {
            // 默认大小25
            const baseSize = 25;
            // 成长值 = (累计心情值 - 种花时的累计心情值) / 10，向下取整
            const moodDiff = Math.max(0, gardenCumulativeMood - plantedAtCumulative);
            const growthValue = Math.floor(moodDiff / 10);
            // 成长值每增加1，花朵大小增加2像素
            const growthBonus = growthValue * 2;
            return Math.min(150, baseSize + growthBonus);
        }

        // 更新所有花朵大小（根据主页面心情值）
        function updateFlowerSizes() {
            gardenMoodValue = parseInt(localStorage.getItem('starValue')) || 0;
            gardenCumulativeMood = parseInt(localStorage.getItem('cumulativeMood')) || 0;
            const flowers = gardenArea.querySelectorAll('.flower:not(.dragging)');
            const rect = gardenArea.getBoundingClientRect();
            const grassTop = rect.height * 0.3333;
            let needsSave = false;

            flowers.forEach((flower, index) => {
                if (plantedFlowers[index]) {
                    const plantedAtCumulative = plantedFlowers[index].plantedAtCumulative || 0;
                    const size = calculateFlowerSize(plantedFlowers[index].mood, plantedAtCumulative);

                    // 限制花朵在草地范围内
                    const grassBottom = rect.height - size;
                    const grassRight = rect.width - size;

                    const currentX = parseFloat(flower.style.left) || plantedFlowers[index].x;
                    const currentY = parseFloat(flower.style.top) || plantedFlowers[index].y;

                    const clampedX = Math.max(0, Math.min(currentX, grassRight));
                    const clampedY = Math.max(grassTop, Math.min(currentY, grassBottom));

                    // 如果位置发生变化，保存新位置
                    if (clampedX !== plantedFlowers[index].x || clampedY !== plantedFlowers[index].y) {
                        plantedFlowers[index].x = clampedX;
                        plantedFlowers[index].y = clampedY;
                        needsSave = true;
                    }

                    flower.style.left = clampedX + 'px';
                    flower.style.top = clampedY + 'px';
                    flower.style.width = size + 'px';
                    flower.style.height = size + 'px';
                }
            });

            if (needsSave) {
                saveFlowers();
            }
        }

        // 初始化
        window.onload = function() {
            loadFlowers();
            updateFlowerSizes();

            // 定期检查心情值变化，更新花朵大小
            setInterval(() => {
                const currentMood = parseInt(localStorage.getItem('starValue')) || 0;
                const currentCumulative = parseInt(localStorage.getItem('cumulativeMood')) || 0;
                if (currentMood !== gardenMoodValue || currentCumulative !== gardenCumulativeMood) {
                    gardenMoodValue = currentMood;
                    gardenCumulativeMood = currentCumulative;
                    updateFlowerSizes();
                }
            }, 3000);
        };
    </script>
</body>
</html>
