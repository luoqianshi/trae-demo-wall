<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正念呼吸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            height: 100vh;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 187, 106, 0.4);
            transition: all 0.3s ease;
            margin-right: 15px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.5);
        }

        .page-title {
            background: linear-gradient(135deg, #a5d6a7 0%, #81c784 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
            box-shadow: 0 4px 15px rgba(129, 199, 132, 0.4);
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .left-section {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-btn {
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 187, 106, 0.4);
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.5);
        }

        .sliders-area {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .slider-container {
            flex: 1;
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(165, 214, 167, 0.4);
        }

        .slider-label {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 4px;
        }

        .slider-value {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 10px;
            border-radius: 10px;
            min-width: 30px;
            text-align: center;
        }

        .vertical-slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 40px;
        }

        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            outline: none;
            transform: rotate(-90deg);
            transform-origin: center;
            cursor: pointer;
        }

        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 187, 106, 0.5);
        }

        .vertical-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 187, 106, 0.5);
        }

        .slider-minmax {
            font-size: 12px;
            color: #558b2f;
        }

        .right-section {
            flex: 1;
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 6px 20px rgba(165, 214, 167, 0.4);
            overflow: hidden;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.6);
            transition: width 0.1s linear, height 0.1s linear;
            position: relative;
        }

        .breath-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .left-section {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .sliders-area {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="page-title">正念呼吸</div>
    </div>

    <div class="main-content">
        <div class="left-section">
            <button class="control-btn" id="controlBtn" onclick="toggleBreathing()">开始</button>
            <div class="sliders-area">
                <div class="slider-container">
                    <div class="slider-label">呼吸间隔</div>
                    <div class="vertical-slider-wrapper">
                        <input type="range" class="vertical-slider" id="intervalSlider" min="1" max="8" value="4" oninput="updateIntervalDisplay()">
                    </div>
                    <div class="slider-value" id="intervalValue">4</div>
                    <div class="slider-minmax">1 - 8秒</div>
                </div>
                <div class="slider-container">
                    <div class="slider-label">圆圈大小</div>
                    <div class="vertical-slider-wrapper">
                        <input type="range" class="vertical-slider" id="sizeSlider" min="1" max="8" value="1" oninput="updateSizeDisplay()">
                    </div>
                    <div class="slider-value" id="sizeValue">1</div>
                    <div class="slider-minmax">1 - 8</div>
                </div>
            </div>
        </div>

        <div class="right-section" id="rightSection">
            <div class="breath-circle" id="breathCircle">
                <span class="breath-text" id="breathText">准备</span>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'sk-YOUR_API_KEY_HERE';

        let isBreathing = false;
        let breathingInterval = null;
        let currentPhase = 'inhale'; // inhale or exhale
        let baseMinSize = 200; // 基础最小直径（半径100）
        let baseMaxSize = 400; // 基础最大直径（半径200）

        function goBack() {
            window.location.href = 'index.html';
        }

        function updateIntervalDisplay() {
            const value = document.getElementById('intervalSlider').value;
            document.getElementById('intervalValue').textContent = value;
        }

        function updateSizeDisplay() {
            const value = document.getElementById('sizeSlider').value;
            document.getElementById('sizeValue').textContent = value;
            // 更新基础大小：最小半径100（直径200），最大半径200（直径400）
            // 每增加1级，最小和最大都增加10像素
            const increment = (parseInt(value) - 1) * 10;
            baseMinSize = 200 + increment;
            baseMaxSize = 400 + increment;
        }

        function toggleBreathing() {
            const btn = document.getElementById('controlBtn');
            if (isBreathing) {
                // 暂停
                isBreathing = false;
                btn.textContent = '开始';
                clearInterval(breathingInterval);
                document.getElementById('breathText').textContent = '暂停';
            } else {
                // 开始
                isBreathing = true;
                btn.textContent = '暂停';
                startBreathing();
            }
        }

        function startBreathing() {
            const interval = parseInt(document.getElementById('intervalSlider').value) * 1000;
            const circle = document.getElementById('breathCircle');
            const text = document.getElementById('breathText');
            
            let startTime = Date.now();
            let phase = 'inhale'; // inhale: 吸气(变小), exhale: 呼气(变大)
            
            // 初始状态：从最小开始，吸气（变小在这个语境中似乎不太对，让我重新理解）
            // 用户说：圆圈变大时显示呼气，变小时显示吸气
            // 所以吸气时圆圈应该变小，呼气时圆圈应该变大
            // 但通常呼吸练习是：吸气时扩张，呼气时收缩
            // 让我按照用户的明确要求：变大=呼气，变小=吸气
            
            phase = 'exhale'; // 先从呼气开始（变大）
            text.textContent = '呼气';
            
            function animate() {
                if (!isBreathing) return;
                
                const elapsed = Date.now() - startTime;
                const progress = elapsed / interval;
                
                if (progress >= 1) {
                    // 切换阶段
                    startTime = Date.now();
                    if (phase === 'exhale') {
                        phase = 'inhale';
                        text.textContent = '吸气';
                    } else {
                        phase = 'exhale';
                        text.textContent = '呼气';
                    }
                }
                
                // 计算当前大小
                let size;
                if (phase === 'exhale') {
                    // 呼气：变大（从最小到最大）
                    size = baseMinSize + (baseMaxSize - baseMinSize) * progress;
                } else {
                    // 吸气：变小（从最大到最小）
                    size = baseMaxSize - (baseMaxSize - baseMinSize) * progress;
                }
                
                circle.style.width = size + 'px';
                circle.style.height = size + 'px';
                
                requestAnimationFrame(animate);
            }
            
            requestAnimationFrame(animate);
        }

        // 初始化
        updateSizeDisplay();
    </script>
</body>
</html>
