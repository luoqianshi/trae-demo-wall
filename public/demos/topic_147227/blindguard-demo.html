<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlindGuard - 盲区哨兵 | TRAE AI 硬件交互赛道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #040810;
  --cyan: #00f0ff;
  --warn: #ff2d55;
  --green: #00ff88;
  --yellow: #ffcc00;
  --panel-bg: rgba(8, 16, 32, 0.85);
  --border: rgba(0, 240, 255, 0.15);
  --glow: 0 0 20px rgba(0, 240, 255, 0.3);
}
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: #c0d8e8;
  font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  overflow: hidden;
  font-size: 13px;
}
/* ===== 导航栏 ===== */
#navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 48px; z-index: 100;
  background: rgba(4, 8, 16, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 16px;
}
.nav-brand {
  font-family: 'Orbitron', monospace;
  font-weight: 900; font-size: 16px;
  color: var(--cyan);
  text-shadow: 0 0 12px rgba(0,240,255,0.5);
  letter-spacing: 2px;
  white-space: nowrap;
}
.nav-brand span { color: var(--warn); font-size: 11px; margin-left: 6px; }
.nav-status {
  display: flex; align-items: center; gap: 8px;
  margin-left: 20px;
  font-family: 'Orbitron', monospace;
  font-size: 11px; color: #607888;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(0,255,136,0.6);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.nav-clock {
  margin-left: auto;
  font-family: 'Orbitron', monospace;
  font-size: 12px; color: var(--cyan);
  letter-spacing: 1px;
}
/* ===== 主布局 ===== */
#main-container {
  position: fixed;
  top: 48px; left: 0; right: 0; bottom: 0;
  display: flex;
}
#canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#simCanvas {
  display: block;
  width: 100%; height: 100%;
  cursor: crosshair;
}
/* ===== 侧栏 ===== */
#sidebar {
  width: 320px;
  min-width: 320px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.2); border-radius: 2px; }
/* ===== 面板通用 ===== */
.panel {
  background: rgba(6, 12, 24, 0.9);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  position: relative;
}
.panel::before, .panel::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border-color: var(--cyan);
  border-style: solid;
  opacity: 0.4;
}
.panel::before {
  top: -1px; left: -1px;
  border-width: 2px 0 0 2px;
  border-radius: 4px 0 0 0;
}
.panel::after {
  bottom: -1px; right: -1px;
  border-width: 0 2px 2px 0;
  border-radius: 0 0 4px 0;
}
.panel-title {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: var(--cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.7;
}
/* ===== 仪表盘 ===== */
#gauge-container {
  display: flex;
  justify-content: center;
  padding: 4px 0;
}
#gaugeCanvas {
  width: 200px; height: 110px;
}
#gauge-label {
  text-align: center;
  font-family: 'Orbitron', monospace;
  font-size: 22px;
  font-weight: 900;
  margin-top: 2px;
  letter-spacing: 3px;
  text-shadow: 0 0 16px currentColor;
}
/* ===== 按钮 ===== */
.btn-row {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.btn {
  flex: 1; min-width: 60px;
  padding: 8px 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: rgba(0, 240, 255, 0.06);
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  text-transform: uppercase;
}
.btn:hover {
  background: rgba(0, 240, 255, 0.15);
  box-shadow: var(--glow);
  border-color: var(--cyan);
}
.btn:active { transform: scale(0.96); }
.btn.active {
  background: rgba(0, 240, 255, 0.2);
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,240,255,0.3);
}
.btn-warn {
  border-color: rgba(255,45,85,0.3);
  color: var(--warn);
  background: rgba(255,45,85,0.06);
}
.btn-warn:hover {
  background: rgba(255,45,85,0.15);
  box-shadow: 0 0 20px rgba(255,45,85,0.3);
}
.btn-warn.active {
  background: rgba(255,45,85,0.2);
  border-color: var(--warn);
}
.btn-scene {
  min-width: 100%;
  padding: 10px 8px;
  font-size: 9px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-scene .scene-num {
  font-size: 14px;
  font-weight: 900;
  opacity: 0.5;
  min-width: 18px;
}
.btn-scene .scene-desc {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  opacity: 0.8;
}
.scene-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
/* ===== 统计 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-item {
  text-align: center;
  padding: 8px 4px;
  background: rgba(0,240,255,0.03);
  border-radius: 4px;
  border: 1px solid rgba(0,240,255,0.06);
}
.stat-value {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(0,240,255,0.3);
}
.stat-label {
  font-size: 9px;
  color: #506878;
  letter-spacing: 1px;
  margin-top: 2px;
  text-transform: uppercase;
}
/* ===== 事件日志 ===== */
#event-log {
  max-height: 120px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11px;
}
#event-log::-webkit-scrollbar { width: 3px; }
#event-log::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.15); border-radius: 2px; }
.log-entry {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 3px;
  background: rgba(0,0,0,0.3);
  animation: log-in 0.3s ease-out;
}
@keyframes log-in {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.log-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}
.log-dot.safe { background: var(--green); box-shadow: 0 0 4px rgba(0,255,136,0.4); }
.log-dot.warning { background: var(--yellow); box-shadow: 0 0 4px rgba(255,204,0,0.4); }
.log-dot.danger { background: var(--warn); box-shadow: 0 0 4px rgba(255,45,85,0.4); }
.log-dot.info { background: var(--cyan); box-shadow: 0 0 4px rgba(0,240,255,0.4); }
.log-time {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  color: #405868;
  white-space: nowrap;
  flex-shrink: 0;
}
.log-text { color: #90a8b8; line-height: 1.3; }
/* ===== 硬件终端 ===== */
.hw-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}
.hw-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  border: 1px solid rgba(0,240,255,0.06);
}
.hw-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px rgba(0,255,136,0.5);
}
.hw-name {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  color: #607888;
  letter-spacing: 1px;
}
/* ===== HUD 叠加层样式 ===== */
.hud-overlay {
  position: absolute;
  pointer-events: none;
  font-family: 'Orbitron', monospace;
}
#hud-top-left {
  top: 10px; left: 10px;
  font-size: 14px; font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 0 16px currentColor;
}
#hud-top-right {
  top: 10px; right: 10px;
  text-align: right;
  font-size: 10px;
  color: var(--cyan);
  opacity: 0.7;
  letter-spacing: 1px;
  line-height: 1.8;
}
#hud-bottom-banner {
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: rgba(0,0,0,0.6);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: all 0.3s;
}
/* ===== 背景粒子 ===== */
#particle-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- 背景粒子 -->
<canvas id="particle-bg"></canvas>

<!-- 导航栏 -->
<div id="navbar">
  <div class="nav-brand">BLINDGUARD<span>v2.0 DEMO</span></div>
  <div class="nav-status">
    <div class="status-dot" id="nav-status-dot"></div>
    <span id="nav-status-text">SYSTEM ONLINE</span>
  </div>

</div>

<!-- 主容器 -->
<div id="main-container">
  <!-- Canvas 区域 -->
  <div id="canvas-area">
    <canvas id="simCanvas"></canvas>
    <!-- HUD 叠加 -->
    <div class="hud-overlay" id="hud-top-left">SAFE</div>
    <div class="hud-overlay" id="hud-top-right">
      <div id="hud-vehicles">VEHICLES: 0</div>

  <!-- 侧栏 -->
  <div id="sidebar">
    <!-- 仪表盘 -->
    <div class="panel">
      <div class="panel-title">RISK LEVEL</div>
      <div id="gauge-container">
        <canvas id="gaugeCanvas" width="400" height="220"></canvas>
      </div>
      <div id="gauge-label" style="color: #00ff88;">SAFE</div>
    </div>

    <!-- 控制按钮 -->
    <div class="panel">

    <!-- 预设场景 -->

          <span class="scene-num">01</span>

        </button>
        <button class="btn btn-scene" onclick="loadScene('pedestrian')">
          <span class="scene-num">02</span>
          <span class="scene-desc">PEDESTRIAN<br><small style="color:#607888">行人横穿盲区</small></span>
        </button>
        <button class="btn btn-scene" onclick="loadScene('overtake')">
          <span class="scene-num">03</span>
          <span class="scene-desc">OVERTAKE<br><small style="color:#607888">内轮差碾压</small></span>
        </button>
        <button class="btn btn-scene" onclick="loadScene('safepass')">
          <span class="scene-num">04</span>
          <span class="scene-desc">SAFE PASS<br><small style="color:#607888">安全通行</small></span>
        </button>
      </div>
    </div>

    <!-- 统计面板 -->
    <div class="panel">
      <div class="panel-title">STATISTICS</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="stat-alerts">0</div>
          <div class="stat-label">Alerts</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-conflicts">0</div>
          <div class="stat-label">Conflicts</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-monitored">0</div>
          <div class="stat-label">Monitored</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-accuracy">99.2</div>
          <div class="stat-label">Accuracy%</div>
        </div>
      </div>
    </div>

    <!-- 事件日志 -->
    <div class="panel">
      <div class="panel-title">EVENT LOG</div>
      <div id="event-log"></div>
    </div>

    <!-- 硬件终端 -->
    <div class="panel">
      <div class="panel-title">HARDWARE TERMINAL</div>
      <div class="hw-grid">
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">CAM</span></div>
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">EDGE</span></div>
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">SCREEN</span></div>
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">LED</span></div>
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">4G/5G</span></div>
        <div class="hw-item"><div class="hw-dot"></div><span class="hw-name">SOLAR</span></div>
      </div>
    </div>

</div>

<script>
/* ============================================================
   BlindGuard - 盲区哨兵 Demo
   TRAE AI 创造力大赛 硬件交互赛道
   ============================================================ */

/* ---------- 全局变量 ---------- */
var BG = {};  // 全局状态对象

/* ---------- 粒子背景 ---------- */
function initParticles() {
  var canvas = document.getElementById('particle-bg');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var maxP = 60;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < maxP; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.5
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
      ctx.fill();

      for (var j = i + 1; j < particles.length; j++) {
        var q = particles[j];
        var dx = p.x - q.x;
        var dy = p.y - q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(0, 240, 255, ' + (0.08 * (1 - dist / 150)) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
}

/* ---------- 实时时钟 ---------- */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  var s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('nav-clock').textContent = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

/* ---------- 工具函数 ---------- */
function lerpAngle(a, b, t) {
  var diff = b - a;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

function dist(x1, y1, x2, y2) {
  var dx = x1 - x2;
  var dy = y1 - y2;
  return Math.sqrt(dx * dx + dy * dy);
}

function clamp(v, min, max) {
  if (v < min) return min;
  if (v > max) return max;
  return v;
}

function getTimeStr() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  var s = String(now.getSeconds()).padStart(2, '0');
  return h + ':' + m + ':' + s;
}

/* ---------- 事件日志 ---------- */
function addLog(type, text) {
  var log = document.getElementById('event-log');
  var entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = '<div class="log-dot ' + type + '"></div>' +
    '<span class="log-time">' + getTimeStr() + '</span>' +
    '<span class="log-text">' + text + '</span>';
  log.insertBefore(entry, log.firstChild);
  if (log.children.length > 50) {
    log.removeChild(log.lastChild);
  }
}

/* ---------- 仪表盘绘制 ---------- */
function drawGauge(level) {
  var canvas = document.getElementById('gaugeCanvas');
  var ctx = canvas.getContext('2d');
  var w = canvas.width;
  var h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  var cx = w / 2;
  var cy = h - 20;
  var r = 80;

  // 底弧
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, 0, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineCap = 'round';
  ctx.stroke();

  // 绿段 (0~0.4)
  var greenEnd = Math.PI + (Math.PI * 0.4);
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, greenEnd, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
  ctx.lineCap = 'butt';
  ctx.stroke();

  // 黄段 (0.4~0.7)
  var yellowEnd = Math.PI + (Math.PI * 0.7);
  ctx.beginPath();
  ctx.arc(cx, cy, r, greenEnd, yellowEnd, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(255, 204, 0, 0.3)';
  ctx.stroke();

  // 红段 (0.7~1.0)
  ctx.beginPath();
  ctx.arc(cx, cy, r, yellowEnd, Math.PI * 2, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(255, 45, 85, 0.3)';
  ctx.stroke();

  // 当前值指针
  var angle = Math.PI + Math.PI * clamp(level, 0, 1);
  var color;
  if (level < 0.4) color = '#00ff88';
  else if (level < 0.7) color = '#ffcc00';
  else color = '#ff2d55';

  // 活跃弧
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, angle, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 指针点
  var px = cx + Math.cos(angle) * r;
  var py = cy + Math.sin(angle) * r;
  ctx.beginPath();
  ctx.arc(px, py, 6, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 刻度文字
  ctx.font = '10px Orbitron, monospace';
  ctx.fillStyle = '#405868';
  ctx.textAlign = 'center';
  ctx.fillText('SAFE', cx - r * 0.7, cy - 10);
  ctx.fillText('WARN', cx, cy - r - 10);
  ctx.fillText('DANGER', cx + r * 0.7, cy - 10);

  // 更新标签
  var label = document.getElementById('gauge-label');
  if (level < 0.4) {
    label.textContent = 'SAFE';
    label.style.color = '#00ff88';
  } else if (level < 0.7) {
    label.textContent = 'WARNING';
    label.style.color = '#ffcc00';
  } else {
    label.textContent = 'DANGER';
    label.style.color = '#ff2d55';
  }
}

/* ---------- Canvas 模拟器初始化 ---------- */
function initSimulator() {
  var canvas = document.getElementById('simCanvas');
  var ctx = canvas.getContext('2d');
  var container = document.getElementById('canvas-area');
  var dpr = window.devicePixelRatio || 1;

  // 状态
  BG = {
    canvas: canvas,
    ctx: ctx,
    container: container,
    dpr: dpr,
    running: false,
    entities: [],
    scanAngle: 0,
    scanLineY: 0,
    time: 0,
    lastTime: 0,
    riskLevel: 0,
    riskState: 'SAFE',
    alerts: 0,
    conflicts: 0,
    lastRiskState: 'SAFE',
    dragging: null,
    dragOffset: { x: 0, y: 0 },
    trailMap: {},
    sceneId: 0
  };

  function resizeCanvas() {
    var w = container.clientWidth;
    var h = container.clientHeight;
    if (w === 0 || h === 0) {
      setTimeout(resizeCanvas, 100);
      return;
    }
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    BG.simW = w;
    BG.simH = h;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // 鼠标 / 触摸拖拽
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    onPointerDown({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    onPointerMove({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    onPointerUp({});
  });

  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onPointerDown(e) {
    var pos = getCanvasPos(e);
    for (var i = BG.entities.length - 1; i >= 0; i--) {
      var ent = BG.entities[i];
      if (ent.type !== 'truck' && ent.active) {
        var d = dist(pos.x, pos.y, ent.x, ent.y);
        if (d < 20) {
          BG.dragging = ent;
          BG.dragOffset.x = ent.x - pos.x;
          BG.dragOffset.y = ent.y - pos.y;
          ent._userDragging = true;
          break;
        }
      }
    }
  }

  function onPointerMove(e) {
    if (BG.dragging) {
      var pos = getCanvasPos(e);
      BG.dragging.x = pos.x + BG.dragOffset.x;
      BG.dragging.y = pos.y + BG.dragOffset.y;
    }
  }

  function onPointerUp(e) {
    if (BG.dragging) {
      BG.dragging._userDragging = false;
      BG.dragging = null;
    }
  }

  addLog('info', 'BlindGuard 系统初始化完成');
  addLog('safe', '等待加载场景...');

  // 启动渲染
  BG.lastTime = performance.now();
  requestAnimationFrame(mainLoop);
}

/* ---------- 创建实体 ---------- */
function createEntity(type, x, y, angle) {
  return {
    type: type,
    x: x,
    y: y,
    angle: angle || 0,
    active: true,
    speed: 0,
    path: [],
    pathIndex: 0,
    pathProgress: 0,
    trail: [],
    _userDragging: false,
    locked: false,
    id: Math.random().toString(36).substr(2, 6)
  };
}

/* ---------- 生成实体 ---------- */
function spawnEntity(type) {
  var cx = BG.simW / 2;
  var cy = BG.simH / 2;

  if (type === 'truck') {
    ent = createEntity('truck', cx - 200, cy + 100, -Math.PI / 2);

    ent = createEntity('ebike', cx + 150, cy - 60, Math.PI / 2);

    ent = createEntity('ped', cx + 120, cy - 20, 0);

}

/* ---------- 路径跟随 ---------- */
function followPath(ent, dt) {
  if (!ent.path || ent.path.length < 2 || ent._userDragging) return;
  if (ent.pathIndex >= ent.path.length - 1) {
    ent.active = false;
    return;
  }

  var current = ent.path[ent.pathIndex];
  var next = ent.path[ent.pathIndex + 1];
  var segDist = dist(current.x, current.y, next.x, next.y);
  var step = ent.speed * 60 * dt;

  ent.pathProgress += step / Math.max(segDist, 0.01);

  if (ent.pathProgress >= 1) {
    ent.pathProgress = 0;
    ent.pathIndex++;
    if (ent.pathIndex >= ent.path.length - 1) {
      ent.x = ent.path[ent.path.length - 1].x;
      ent.y = ent.path[ent.path.length - 1].y;
      ent.angle = ent.path[ent.path.length - 1].a;
      ent.active = false;
      return;
    }
  }

  var curr = ent.path[ent.pathIndex];
  var nxt = ent.path[ent.pathIndex + 1];
  var t = clamp(ent.pathProgress, 0, 1);
  ent.x = curr.x + (nxt.x - curr.x) * t;
  ent.y = curr.y + (nxt.y - curr.y) * t;

  var targetAngle = nxt.a !== undefined ? nxt.a : Math.atan2(nxt.y - curr.y, nxt.x - curr.x);
  ent.angle = lerpAngle(ent.angle, targetAngle, 0.1);
}

/* ---------- 风险检测 ---------- */
function computeRisk() {
  var trucks = [];
  var others = [];
  for (var i = 0; i < BG.entities.length; i++) {
    var e = BG.entities[i];
    if (e.type === 'truck' && e.active) trucks.push(e);
    else if (e.active) others.push(e);
  }

  var maxRisk = 0;
  var detectedState = 'SAFE';

  for (var ti = 0; ti < trucks.length; ti++) {
    var tr = trucks[ti];
    // 盲区中心：货车右侧后方
    var bx = tr.x + Math.cos(tr.angle + Math.PI / 2) * 50 + Math.cos(tr.angle) * 20;
    var by = tr.y + Math.sin(tr.angle + Math.PI / 2) * 50 + Math.sin(tr.angle) * 20;
    var blindR = 70;

    for (var oi = 0; oi < others.length; oi++) {
      var o = others[oi];
      var d = dist(o.x, o.y, bx, by);
      var ratio = d / blindR;

      if (ratio < 0.5) {
        maxRisk = 1.0;
        o.locked = true;
        if (detectedState !== 'DANGER') {
          detectedState = 'DANGER';
        }
      } else if (ratio < 0.8) {
        if (maxRisk < 0.6) maxRisk = 0.6;
        o.locked = true;
        if (detectedState === 'SAFE') detectedState = 'WARNING';
      } else {
        o.locked = false;
      }
    }

    // 缓存盲区信息供渲染用
    tr._blindX = bx;
    tr._blindY = by;
    tr._blindR = blindR;
  }

  // 对于没有 _blindX 的非活跃货车
  for (var ti2 = 0; ti2 < trucks.length; ti2++) {
    if (trucks[ti2]._blindX === undefined) {
      trucks[ti2]._blindX = trucks[ti2].x;
      trucks[ti2]._blindY = trucks[ti2].y;
      trucks[ti2]._blindR = 70;
    }
  }

  return { level: maxRisk, state: detectedState, trucks: trucks };
}

/* ---------- 环境装饰函数 ---------- */
function drawEnvironment(ctx, w, h) {
  var cx = w / 2;
  var cy = h / 2;
  var roadW = 140;
  var sidewalkW = 22;
  var t = BG.time || 0;

  // ===== 远处城市天际线轮廓 =====
  ctx.fillStyle = 'rgba(6, 12, 24, 0.9)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  var skyPts = [0, 40, 60, 85, 110, 130, 160, 200, 240, 280, 320, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000, w];
  var skyHs = [0, 25, 15, 35, 20, 40, 30, 50, 35, 45, 25, 55, 40, 30, 50, 35, 45, 25, 40, 55, 30, 20, 35, 15, 25, 0];
  for (var ski = 0; ski < skyPts.length; ski++) {
    var sx = Math.min(skyPts[ski], w);
    var sh = skyHs[ski];
    ctx.lineTo(sx, sh);
  }
  ctx.lineTo(w, 0);
  ctx.closePath();
  ctx.fill();
  // 天际线发光边缘
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 天际线窗户点阵
  ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
  for (var swi = 30; swi < w; swi += 18) {
    for (var shj = 10; shj < 55; shj += 8) {
      if (Math.random() > 0.6) {
        var flicker = Math.sin(t * 0.5 + swi * 0.1 + shj * 0.2) > 0.3;
        if (flicker) {
          ctx.fillRect(swi, shj, 3, 3);
        }
      }
    }
  }

  // ===== 路口四角建筑物剪影 =====
  var buildings = [
    // 左上区域
    { x: 10, y: 10, bw: 80, bh: cy - roadW / 2 - sidewalkW - 20 },
    { x: 100, y: 15, bw: 60, bh: cy - roadW / 2 - sidewalkW - 25 },
    // 右上区域
    { x: cx + roadW / 2 + sidewalkW + 15, y: 10, bw: 70, bh: cy - roadW / 2 - sidewalkW - 20 },
    { x: cx + roadW / 2 + sidewalkW + 95, y: 15, bw: 55, bh: cy - roadW / 2 - sidewalkW - 25 },
    // 左下区域
    { x: 10, y: cy + roadW / 2 + sidewalkW + 15, bw: 85, bh: h - (cy + roadW / 2 + sidewalkW) - 25 },
    { x: 105, y: cy + roadW / 2 + sidewalkW + 20, bw: 55, bh: h - (cy + roadW / 2 + sidewalkW) - 30 },
    // 右下区域
    { x: cx + roadW / 2 + sidewalkW + 15, y: cy + roadW / 2 + sidewalkW + 15, bw: 75, bh: h - (cy + roadW / 2 + sidewalkW) - 25 },
    { x: cx + roadW / 2 + sidewalkW + 100, y: cy + roadW / 2 + sidewalkW + 20, bw: 50, bh: h - (cy + roadW / 2 + sidewalkW) - 30 }
  ];
  for (var bdi = 0; bdi < buildings.length; bdi++) {
    var bld = buildings[bdi];
    if (bld.bh < 10) continue;
    // 建筑主体
    ctx.fillStyle = 'rgba(8, 14, 28, 0.85)';
    roundRectPath(ctx, bld.x, bld.y, bld.bw, bld.bh, 2);
    ctx.fill();
    // 建筑边框
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
    ctx.lineWidth = 0.5;
    roundRectPath(ctx, bld.x, bld.y, bld.bw, bld.bh, 2);
    ctx.stroke();
    // 窗户点阵图案
    for (var wwi = bld.x + 6; wwi < bld.x + bld.bw - 6; wwi += 10) {
      for (var wwj = bld.y + 6; wwj < bld.y + bld.bh - 6; wwj += 10) {
        var wOn = Math.sin(t * 0.3 + wwi * 0.15 + wwj * 0.12) > -0.2;
        if (wOn) {
          var wAlpha = 0.06 + Math.random() * 0.06;
          ctx.fillStyle = 'rgba(0, 240, 255, ' + wAlpha + ')';
          ctx.fillRect(wwi, wwj, 5, 5);
        } else {
          ctx.fillStyle = 'rgba(0, 240, 255, 0.02)';
          ctx.fillRect(wwi, wwj, 5, 5);
        }
      }
    }
  }

  // ===== 绿化带（灌木丛和小树）=====
  var bushes = [
    { x: 20, y: cy - roadW / 2 - sidewalkW - 8 },
    { x: 45, y: cy - roadW / 2 - sidewalkW - 6 },
    { x: cx + roadW / 2 + sidewalkW + 10, y: cy + roadW / 2 + sidewalkW + 8 },
    { x: cx + roadW / 2 + sidewalkW + 35, y: cy + roadW / 2 + sidewalkW + 6 },
    { x: cx - roadW / 2 - sidewalkW - 10, y: cy + 30 },
    { x: cx - roadW / 2 - sidewalkW - 10, y: cy + 55 }
  ];
  for (var bshi = 0; bshi < bushes.length; bshi++) {
    var bush = bushes[bshi];
    // 灌木丛底色
    ctx.beginPath();
    ctx.arc(bush.x, bush.y, 7, 0, Math.PI * 2);
    var bushGrad = ctx.createRadialGradient(bush.x - 1, bush.y - 2, 0, bush.x, bush.y, 7);
    bushGrad.addColorStop(0, 'rgba(0, 80, 50, 0.5)');
    bushGrad.addColorStop(1, 'rgba(0, 40, 25, 0.3)');
    ctx.fillStyle = bushGrad;
    ctx.fill();
    // 灌木发光轮廓
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // 小树
  var smallTrees = [
    { x: cx + roadW / 2 + sidewalkW + 55, y: cy - roadW / 2 - sidewalkW - 20 },
    { x: 170, y: cy + roadW / 2 + sidewalkW + 18 },
    { x: cx - roadW / 2 - sidewalkW - 20, y: cy - 40 }
  ];
  for (var sti = 0; sti < smallTrees.length; sti++) {
    var st = smallTrees[sti];
    var stSway = Math.sin(t * 0.6 + sti * 2) * 1;
    // 树干
    ctx.fillStyle = '#081420';
    ctx.fillRect(st.x - 1.5, st.y, 3, 8);
    // 树冠
    ctx.beginPath();
    ctx.arc(st.x + stSway, st.y - 4, 7, 0, Math.PI * 2);
    var stGrad = ctx.createRadialGradient(st.x + stSway - 1, st.y - 5, 0, st.x + stSway, st.y - 4, 7);
    stGrad.addColorStop(0, 'rgba(0, 70, 45, 0.6)');
    stGrad.addColorStop(1, 'rgba(0, 35, 22, 0.3)');
    ctx.fillStyle = stGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

/* ---------- 绘制函数 ---------- */
function drawGrid(ctx, w, h) {
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
  ctx.lineWidth = 0.5;
  var gridSize = 30;
  for (var x = 0; x < w; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (var y = 0; y < h; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
}

function drawIntersection(ctx, w, h) {
  var cx = w / 2;
  var cy = h / 2;
  var roadW = 140;
  var sidewalkW = 22;
  var t = BG.time || 0;

  // 人行道（深灰色）
  ctx.fillStyle = '#0d1e38';
  ctx.fillRect(0, cy - roadW / 2 - sidewalkW, w, sidewalkW);
  ctx.fillRect(0, cy + roadW / 2, w, sidewalkW);
  ctx.fillRect(cx - roadW / 2 - sidewalkW, 0, sidewalkW, h);
  ctx.fillRect(cx + roadW / 2, 0, sidewalkW, h);

  // 人行道边缘（路缘石）
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
  ctx.lineWidth = 2;
  var hLines = [cy - roadW / 2 - sidewalkW, cy - roadW / 2, cy + roadW / 2, cy + roadW / 2 + sidewalkW];
  for (var hli = 0; hli < hLines.length; hli++) {
    var ly = hLines[hli];
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
  }
  var vLines = [cx - roadW / 2 - sidewalkW, cx - roadW / 2, cx + roadW / 2, cx + roadW / 2 + sidewalkW];
  for (var vli = 0; vli < vLines.length; vli++) {
    var lx = vLines[vli];
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, h); ctx.stroke();
  }

  // 人行道地砖纹理
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.lineWidth = 0.5;
  for (var bi = 0; bi < w; bi += 20) {
    ctx.beginPath(); ctx.moveTo(bi, cy - roadW / 2 - sidewalkW); ctx.lineTo(bi, cy - roadW / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bi, cy + roadW / 2); ctx.lineTo(bi, cy + roadW / 2 + sidewalkW); ctx.stroke();
  }
  for (var bj = 0; bj < h; bj += 20) {
    ctx.beginPath(); ctx.moveTo(cx - roadW / 2 - sidewalkW, bj); ctx.lineTo(cx - roadW / 2, bj); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + roadW / 2, bj); ctx.lineTo(cx + roadW / 2 + sidewalkW, bj); ctx.stroke();
  }

  // 道路主体（深蓝色沥青）
  ctx.fillStyle = '#0a1628';
  ctx.fillRect(0, cy - roadW / 2, w, roadW);
  ctx.fillRect(cx - roadW / 2, 0, roadW, h);

  // 路面纹理（细微噪点）
  ctx.fillStyle = 'rgba(255, 255, 255, 0.008)';
  for (var ni = 0; ni < 80; ni++) {
    var nx = ((ni * 137.5) % w);
    var ny = ((ni * 97.3) % h);
    ctx.fillRect(nx, ny, 2, 2);
  }

  // 路面湿润反光效果（微弱蓝色反光）
  var wetGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, roadW * 1.2);
  wetGrad.addColorStop(0, 'rgba(0, 100, 200, 0.06)');
  wetGrad.addColorStop(0.5, 'rgba(0, 60, 140, 0.03)');
  wetGrad.addColorStop(1, 'rgba(0, 30, 80, 0)');
  ctx.fillStyle = wetGrad;
  ctx.fillRect(cx - roadW, cy - roadW, roadW * 2, roadW * 2);

  // 车道分隔线（白色虚线）
  ctx.setLineDash([18, 12]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.lineWidth = 2;
  // 水平中线
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(cx - roadW / 2, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + roadW / 2, cy); ctx.lineTo(w, cy); ctx.stroke();
  // 垂直中线
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - roadW / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + roadW / 2); ctx.lineTo(cx, h); ctx.stroke();
  ctx.setLineDash([]);

  // 车道线反光标线效果（夜间反光模拟）
  ctx.setLineDash([18, 12]);
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.06)';
  ctx.lineWidth = 4;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.1)';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(cx - roadW / 2, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + roadW / 2, cy); ctx.lineTo(w, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - roadW / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + roadW / 2); ctx.lineTo(cx, h); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);

  // 车道边缘实线（白色）
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  var edgeHLines = [cy - roadW / 2, cy + roadW / 2];
  for (var ehi = 0; ehi < edgeHLines.length; ehi++) {
    var ely = edgeHLines[ehi];
    ctx.beginPath(); ctx.moveTo(0, ely); ctx.lineTo(cx - roadW / 2, ely); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + roadW / 2, ely); ctx.lineTo(w, ely); ctx.stroke();
  }
  var edgeVLines = [cx - roadW / 2, cx + roadW / 2];
  for (var evi = 0; evi < edgeVLines.length; evi++) {
    var elx = edgeVLines[evi];
    ctx.beginPath(); ctx.moveTo(elx, 0); ctx.lineTo(elx, cy - roadW / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(elx, cy + roadW / 2); ctx.lineTo(elx, h); ctx.stroke();
  }

  // 停车线（白色实线）
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - roadW / 2, cy - roadW / 2); ctx.lineTo(cx, cy - roadW / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + roadW / 2, cy + roadW / 2); ctx.lineTo(cx, cy + roadW / 2); ctx.stroke();
  ctx.lineWidth = 1;

  // 路口导流线（四角月牙形白色弧线）
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
  ctx.lineWidth = 2;
  // 左上角导流弧
  ctx.beginPath();
  ctx.arc(cx - roadW / 2, cy - roadW / 2, roadW * 0.35, 0, Math.PI / 2);
  ctx.stroke();
  // 右上角导流弧
  ctx.beginPath();
  ctx.arc(cx + roadW / 2, cy - roadW / 2, roadW * 0.35, Math.PI / 2, Math.PI);
  ctx.stroke();
  // 左下角导流弧
  ctx.beginPath();
  ctx.arc(cx - roadW / 2, cy + roadW / 2, roadW * 0.35, -Math.PI / 2, 0);
  ctx.stroke();
  // 右下角导流弧
  ctx.beginPath();
  ctx.arc(cx + roadW / 2, cy + roadW / 2, roadW * 0.35, Math.PI, Math.PI * 1.5);
  ctx.stroke();
  // 额外内层导流弧
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx - roadW / 2, cy - roadW / 2, roadW * 0.2, 0, Math.PI / 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + roadW / 2, cy - roadW / 2, roadW * 0.2, Math.PI / 2, Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - roadW / 2, cy + roadW / 2, roadW * 0.2, -Math.PI / 2, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + roadW / 2, cy + roadW / 2, roadW * 0.2, Math.PI, Math.PI * 1.5);
  ctx.stroke();

  // 路面排水井盖
  var manholePositions = [
    [cx - roadW / 4, cy + roadW / 4],
    [cx + roadW / 4, cy - roadW / 4]
  ];
  for (var mi = 0; mi < manholePositions.length; mi++) {
    var mx = manholePositions[mi][0];
    var my = manholePositions[mi][1];
    // 井盖底色
    ctx.beginPath();
    ctx.arc(mx, my, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10, 18, 30, 0.8)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(40, 60, 80, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 铁栅格纹理
    ctx.strokeStyle = 'rgba(50, 70, 90, 0.3)';
    ctx.lineWidth = 0.5;
    for (var mgi = -2; mgi <= 2; mgi++) {
      ctx.beginPath();
      ctx.moveTo(mx + mgi * 3, my - 7);
      ctx.lineTo(mx + mgi * 3, my + 7);
      ctx.stroke();
    }
    for (var mgj = -2; mgj <= 2; mgj++) {
      ctx.beginPath();
      ctx.moveTo(mx - 7, my + mgj * 3);
      ctx.lineTo(mx + 7, my + mgj * 3);
      ctx.stroke();
    }
  }

  // 路口中心导向箭头（直行+右转组合箭头）
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  // 上方车道直行箭头
  drawArrowMarker(ctx, cx - roadW / 4, cy - roadW / 4, 0);
  drawArrowMarker(ctx, cx + roadW / 4, cy + roadW / 4, Math.PI);
  // 右转+直行组合箭头
  ctx.save();
  ctx.translate(cx + roadW / 4, cy - roadW / 4);
  ctx.rotate(Math.PI / 2);
  drawArrowMarker(ctx, 0, 0, 0);
  ctx.restore();
  ctx.save();
  ctx.translate(cx - roadW / 4, cy + roadW / 4);
  ctx.rotate(-Math.PI / 2);
  drawArrowMarker(ctx, 0, 0, 0);
  ctx.restore();

  // 人行横道（斑马线）- 更真实的白底条纹
  var zebraW = 6;
  var zebraGap = 4;
  var zebraH = 18;
  // 上方
  for (var zx = cx - roadW / 2 + 6; zx < cx + roadW / 2 - 6; zx += zebraW + zebraGap) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(zx, cy - roadW / 2 - zebraH - 2, zebraW, zebraH);
    // 条纹边缘高光
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(zx, cy - roadW / 2 - zebraH - 2, zebraW, zebraH);
  }
  // 下方
  for (var zx2 = cx - roadW / 2 + 6; zx2 < cx + roadW / 2 - 6; zx2 += zebraW + zebraGap) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(zx2, cy + roadW / 2 + 2, zebraW, zebraH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(zx2, cy + roadW / 2 + 2, zebraW, zebraH);
  }
  // 左侧
  for (var zy = cy - roadW / 2 + 6; zy < cy + roadW / 2 - 6; zy += zebraW + zebraGap) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(cx - roadW / 2 - zebraH - 2, zy, zebraH, zebraW);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(cx - roadW / 2 - zebraH - 2, zy, zebraH, zebraW);
  }
  // 右侧
  for (var zy2 = cy - roadW / 2 + 6; zy2 < cy + roadW / 2 - 6; zy2 += zebraW + zebraGap) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(cx + roadW / 2 + 2, zy2, zebraH, zebraW);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(cx + roadW / 2 + 2, zy2, zebraH, zebraW);
  }

  // 人行道上的行道树
  var treePositions = [
    [cx - roadW / 2 - sidewalkW / 2, cy - roadW / 2 - sidewalkW - 18],
    [cx + roadW / 2 + sidewalkW / 2, cy - roadW / 2 - sidewalkW - 18],
    [cx - roadW / 2 - sidewalkW / 2, cy + roadW / 2 + sidewalkW + 18],
    [cx + roadW / 2 + sidewalkW / 2, cy + roadW / 2 + sidewalkW + 18],
    [cx - roadW / 2 - sidewalkW - 18, cy - roadW / 2 - sidewalkW / 2],
    [cx - roadW / 2 - sidewalkW - 18, cy + roadW / 2 + sidewalkW / 2],
    [cx + roadW / 2 + sidewalkW + 18, cy - roadW / 2 - sidewalkW / 2],
    [cx + roadW / 2 + sidewalkW + 18, cy + roadW / 2 + sidewalkW / 2]
  ];
  for (var tri = 0; tri < treePositions.length; tri++) {
    var tx = treePositions[tri][0];
    var ty = treePositions[tri][1];
    var treeSway = Math.sin(t * 0.8 + tri * 1.2) * 1.5;
    // 树干
    ctx.fillStyle = '#0a1a2a';
    ctx.fillRect(tx - 2, ty - 2, 4, 10);
    // 树冠（圆形）
    ctx.beginPath();
    ctx.arc(tx + treeSway, ty - 8, 10, 0, Math.PI * 2);
    var treeGrad = ctx.createRadialGradient(tx + treeSway - 2, ty - 10, 0, tx + treeSway, ty - 8, 10);
    treeGrad.addColorStop(0, 'rgba(0, 60, 40, 0.7)');
    treeGrad.addColorStop(1, 'rgba(0, 30, 20, 0.4)');
    ctx.fillStyle = treeGrad;
    ctx.fill();
    // 树冠发光轮廓
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.08)';
    ctx.lineWidth = 1;
    ctx.shadowColor = 'rgba(0, 255, 136, 0.1)';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 路灯（带发光光晕）
  var streetlightPositions = [
    [cx - roadW / 2 - sidewalkW - 8, cy - roadW / 2 - sidewalkW - 10],
    [cx + roadW / 2 + sidewalkW + 8, cy + roadW / 2 + sidewalkW + 10],
    [cx - roadW / 2 - sidewalkW - 10, cy + 10],
    [cx + roadW / 2 + sidewalkW + 10, cy - 10]
  ];
  for (var sli = 0; sli < streetlightPositions.length; sli++) {
    var slx = streetlightPositions[sli][0];
    var sly = streetlightPositions[sli][1];
    // 灯杆
    ctx.fillStyle = '#0c1824';
    ctx.fillRect(slx - 1.5, sly - 30, 3, 35);
    // 灯臂
    ctx.fillRect(slx - 1.5, sly - 30, 10, 2);
    // 灯头
    ctx.beginPath();
    ctx.arc(slx + 8, sly - 30, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 220, 140, 0.8)';
    ctx.shadowColor = 'rgba(255, 220, 140, 0.6)';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
    // 光晕
    var lightGlow = ctx.createRadialGradient(slx + 8, sly - 25, 0, slx + 8, sly - 20, 50);
    lightGlow.addColorStop(0, 'rgba(255, 220, 140, 0.08)');
    lightGlow.addColorStop(0.5, 'rgba(255, 200, 100, 0.03)');
    lightGlow.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = lightGlow;
    ctx.beginPath();
    ctx.arc(slx + 8, sly - 20, 50, 0, Math.PI * 2);
    ctx.fill();
    // 灯头闪烁微弱脉冲
    var flicker = 0.7 + 0.3 * Math.sin(t * 3 + sli * 2);
    ctx.beginPath();
    ctx.arc(slx + 8, sly - 30, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 220, 140, ' + (flicker * 0.4) + ')';
    ctx.shadowColor = 'rgba(255, 220, 140, 0.3)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 交通灯
  drawTrafficLight(ctx, cx - roadW / 2 - sidewalkW - 16, cy - roadW / 2 - 10, 6);
  drawTrafficLight(ctx, cx + roadW / 2 + sidewalkW + 4, cy + roadW / 2 - 32, 6);
}

function drawArrowMarker(ctx, x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(4, -6);
  ctx.lineTo(4, -2);
  ctx.lineTo(-10, -2);
  ctx.lineTo(-10, 2);
  ctx.lineTo(4, 2);
  ctx.lineTo(4, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTrafficLight(ctx, x, y, r) {
  // 灯杆
  ctx.fillStyle = '#1a2a3a';
  ctx.fillRect(x + r - 2, y + r * 3, 4, 20);

  // 灯箱
  ctx.fillStyle = '#0c1a2e';
  roundRectPath(ctx, x, y, r * 2, r * 3 + 4, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,240,255,0.25)';
  ctx.lineWidth = 1;
  roundRectPath(ctx, x, y, r * 2, r * 3 + 4, 3);
  ctx.stroke();

  // 红灯
  ctx.beginPath();
  ctx.arc(x + r, y + r + 1, r * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 45, 85, 0.9)';
  ctx.shadowColor = '#ff2d55';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 黄灯（暗）
  ctx.beginPath();
  ctx.arc(x + r, y + r * 2, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 204, 0, 0.15)';
  ctx.fill();

  // 绿灯（暗）
  ctx.beginPath();
  ctx.arc(x + r, y + r * 3, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
  ctx.fill();
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawTruck(ctx, ent) {
  ctx.save();
  ctx.translate(ent.x, ent.y);
  ctx.rotate(ent.angle);

  var bw = 130, bh = 54;
  var t = BG.time || 0;

  // ===== 车底阴影效果 =====
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 5, bw * 0.55, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // ===== 货箱（车厢）=====
  // 阴影
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  roundRectPath(ctx, -bw / 2 + 22, -bh / 2 + 3, bw - 22, bh, 2);
  ctx.fill();

  // 车厢主体
  var trailerGrad = ctx.createLinearGradient(-bw / 2 + 22, -bh / 2, -bw / 2 + 22, bh / 2);
  trailerGrad.addColorStop(0, '#2a4060');
  trailerGrad.addColorStop(0.5, '#1a3050');
  trailerGrad.addColorStop(1, '#152840');
  ctx.fillStyle = trailerGrad;
  roundRectPath(ctx, -bw / 2 + 22, -bh / 2, bw - 22, bh, 2);
  ctx.fill();

  // 车厢3D立体感（顶部高光渐变）
  var topHighlight = ctx.createLinearGradient(-bw / 2 + 22, -bh / 2, -bw / 2 + 22, -bh / 2 + 12);
  topHighlight.addColorStop(0, 'rgba(120, 180, 255, 0.15)');
  topHighlight.addColorStop(1, 'rgba(120, 180, 255, 0)');
  ctx.fillStyle = topHighlight;
  roundRectPath(ctx, -bw / 2 + 22, -bh / 2, bw - 22, 12, 2);
  ctx.fill();

  // 车厢底部暗影
  var botShadow = ctx.createLinearGradient(-bw / 2 + 22, bh / 2 - 10, -bw / 2 + 22, bh / 2);
  botShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
  botShadow.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
  ctx.fillStyle = botShadow;
  roundRectPath(ctx, -bw / 2 + 22, bh / 2 - 10, bw - 22, 10, 2);
  ctx.fill();

  // 车厢边框
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  roundRectPath(ctx, -bw / 2 + 22, -bh / 2, bw - 22, bh, 2);
  ctx.stroke();

  // 车厢横向加强筋
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
  ctx.lineWidth = 0.5;
  for (var ri = 0; ri < 5; ri++) {
    var rx = -bw / 2 + 38 + ri * 18;
    ctx.beginPath(); ctx.moveTo(rx, -bh / 2 + 2); ctx.lineTo(rx, bh / 2 - 2); ctx.stroke();
  }

  // 车厢侧面装饰条纹
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-bw / 2 + 24, -bh / 2 + 10);
  ctx.lineTo(bw / 2 - 35, -bh / 2 + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-bw / 2 + 24, bh / 2 - 10);

  ctx.strokeRect(cabX - 3, -cabH / 2 - 2, 4, 4);

  ctx.fillRect(cabX + cabW - 5, -cabH / 2 - 10, 3, 14);
  ctx.strokeStyle = 'rgba(80, 100, 120, 0.3)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(cabX + cabW - 5, -cabH / 2 - 10, 3, 14);
  // 排气管口

  ctx.arc(cabX + cabW - 3.5, -cabH / 2 - 10, 2, 0, Math.PI * 2);

  ctx.fillRect(cabX - 1, cabH / 2 + 2, 2, 3);

  // ===== 车轮（带5辐条轮毂设计）=====
  var wheelPositions = [
    [cabX + 10, -cabH / 2 - 3],
    [cabX + 10, cabH / 2 + 3],
    [-bw / 2 + 35, -cabH / 2 - 3],
    [-bw / 2 + 35, cabH / 2 + 3],
    [-bw / 2 + 65, -cabH / 2 - 3],
    [-bw / 2 + 65, cabH / 2 + 3]
  ];
  for (var wpi = 0; wpi < wheelPositions.length; wpi++) {
    var wp = wheelPositions[wpi];
    var wx = wp[0], wy = wp[1], wr = 8;
    // 轮胎外圈
    ctx.beginPath();
    ctx.arc(wx, wy, wr, 0, Math.PI * 2);
    ctx.fillStyle = '#0a1218';
    ctx.fill();
    ctx.strokeStyle = 'rgba(60, 80, 100, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 轮胎胎纹
    ctx.strokeStyle = 'rgba(40, 60, 80, 0.4)';
    ctx.lineWidth = 0.8;
    var wheelAngle = (t * 3) % (Math.PI * 2);
    for (var wti = 0; wti < 12; wti++) {
      var wta = wheelAngle + wti * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(wta) * (wr - 1.5), wy + Math.sin(wta) * (wr - 1.5));
      ctx.lineTo(wx + Math.cos(wta) * wr, wy + Math.sin(wta) * wr);
      ctx.stroke();
    }
    // 轮毂（深色）
    ctx.beginPath();
    ctx.arc(wx, wy, wr * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = '#1a2a3a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // 5辐条设计
    ctx.strokeStyle = 'rgba(80, 120, 160, 0.5)';
    ctx.lineWidth = 1.5;
    for (var spi = 0; spi < 5; spi++) {
      var spa = wheelAngle + spi * Math.PI * 2 / 5;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(spa) * 1.5, wy + Math.sin(spa) * 1.5);
      ctx.lineTo(wx + Math.cos(spa) * wr * 0.5, wy + Math.sin(spa) * wr * 0.5);
      ctx.stroke();
    }
    // 轮毂中心
    ctx.beginPath();
    ctx.arc(wx, wy, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.fill();
  }

  // ===== 车头LED大灯矩阵效果 =====
  ctx.shadowColor = 'rgba(255, 240, 200, 0.5)';
  ctx.shadowBlur = 8;
  // 上方灯组（3x2 LED矩阵）
  var ledY1 = -cabH / 2 + 5;
  var ledY2 = -cabH / 2 + 10;
  for (var ledRow = 0; ledRow < 2; ledRow++) {
    for (var ledCol = 0; ledCol < 3; ledCol++) {
      var ledX = bw / 2 + 1 + ledCol * 4;
      var ledY = (ledRow === 0) ? ledY1 : ledY2;

      ctx.fillRect(ledX, ledY, 3, 3);
    }

  // 下方灯组（3x2 LED矩阵）

  // 主灯发光区域

  ctx.beginPath(); ctx.arc(bw / 2 + 3, -cabH / 2 + 14, 12, 0, Math.PI * 2); ctx.fill();

  var headlightGrad2 = ctx.createRadialGradient(bw / 2 + 3, cabH / 2 - 14, 0, bw / 2 + 3, cabH / 2 - 14, 12);
  headlightGrad2.addColorStop(0, 'rgba(255, 240, 200, 0.6)');
  headlightGrad2.addColorStop(0.5, 'rgba(255, 220, 150, 0.2)');
  headlightGrad2.addColorStop(1, 'rgba(255, 200, 100, 0)');
  ctx.fillStyle = headlightGrad2;
  ctx.beginPath(); ctx.arc(bw / 2 + 3, cabH / 2 - 14, 12, 0, Math.PI * 2); ctx.fill();

  // 尾灯（红色）
  ctx.fillStyle = 'rgba(255, 30, 30, 0.7)';
  ctx.shadowColor = '#ff1e1e';
  ctx.shadowBlur = 8;
  ctx.fillRect(-bw / 2 + 22, -bh / 2 + 2, 3, 5);
  ctx.fillRect(-bw / 2 + 22, bh / 2 - 7, 3, 5);
  ctx.shadowBlur = 0;

  // 转向灯（橙色闪烁）
  var blinkAlpha = 0.3 + 0.3 * Math.sin(t * 6);
  ctx.fillStyle = 'rgba(255, 160, 0, ' + blinkAlpha + ')';
  ctx.fillRect(bw / 2 - 3, -cabH / 2, 3, 4);
  ctx.fillRect(bw / 2 - 3, cabH / 2 - 4, 3, 4);

  // ===== 排气烟雾粒子效果 =====
  var exX = cabX + cabW - 3.5;
  var exY = -cabH / 2 - 12;
  for (var smokeI = 0; smokeI < 4; smokeI++) {
    var smokeAge = (t * 0.6 + smokeI * 0.4) % 2;
    var smokeAlpha = Math.max(0, 0.15 - smokeAge * 0.08);
    var smokeSize = 2 + smokeAge * 3;
    var smokeOffX = -smokeAge * 8 + Math.sin(t * 2 + smokeI) * 2;
    var smokeOffY = -smokeAge * 12;
    ctx.beginPath();
    ctx.arc(exX + smokeOffX, exY + smokeOffY, smokeSize, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(80, 120, 160, ' + smokeAlpha + ')';
    ctx.fill();
  }

  // ===== A柱盲区辅助线（红色虚线+箭头）=====
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = 'rgba(255, 45, 85, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = 'rgba(255, 45, 85, 0.3)';
  ctx.shadowBlur = 4;
  // 右A柱盲区
  ctx.beginPath(); ctx.moveTo(bw / 2, bh / 2 + 3); ctx.lineTo(bw / 2 + 90, bh / 2 + 70); ctx.stroke();
  // 左A柱盲区
  ctx.beginPath(); ctx.moveTo(bw / 2, bh / 2 + 3); ctx.lineTo(-bw / 2 + 20, bh / 2 + 55); ctx.stroke();
  // 前方盲区

  ctx.beginPath(); ctx.moveTo(bw / 2 + 1, 0); ctx.lineTo(bw / 2 + 50, 40); ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  // 盲区线末端小箭头
  ctx.fillStyle = 'rgba(255, 45, 85, 0.5)';
  // 右A柱箭头
  ctx.beginPath();
  ctx.moveTo(bw / 2 + 90, bh / 2 + 70);
  ctx.lineTo(bw / 2 + 82, bh / 2 + 66);
  ctx.lineTo(bw / 2 + 84, bh / 2 + 74);
  ctx.closePath();
  ctx.fill();
  // 前方盲区箭头
  ctx.beginPath();
  ctx.moveTo(bw / 2 + 50, -40);
  ctx.lineTo(bw / 2 + 42, -36);
  ctx.lineTo(bw / 2 + 44, -44);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bw / 2 + 50, 40);
  ctx.lineTo(bw / 2 + 42, 36);
  ctx.lineTo(bw / 2 + 44, 44);
  ctx.closePath();
  ctx.fill();

  // 标签
  ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
  ctx.font = '9px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TRUCK', 0, -bh / 2 - 12);

  ctx.restore();
}

function drawEbike(ctx, ent) {
  ctx.save();
  ctx.translate(ent.x, ent.y);
  ctx.rotate(ent.angle);

  var t = BG.time || 0;
  var wheelAngle = (t * 8) % (Math.PI * 2);

  // 地面阴影
  ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
  ctx.beginPath();
  ctx.ellipse(0, 2, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // ===== 速度线效果（运动模糊线条）=====
  if (ent.speed > 0) {
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.lineWidth = 0.5;
    for (var sli = 0; sli < 5; sli++) {
      var slOff = -18 + sli * 4 + Math.sin(t * 10 + sli) * 2;
      var slLen = 12 + Math.random() * 8;

      ctx.moveTo(-20 - slLen, slOff);
      ctx.lineTo(-20, slOff);
      ctx.stroke();

  roundRectPath(ctx, -8, -4, 10, 5, 1.5);

  ctx.moveTo(-14, -10);

  ctx.shadowColor = '#fff0c8';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(14, -6, 2, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // 尾灯
  ctx.fillStyle = 'rgba(255, 30, 30, 0.6)';
  ctx.shadowColor = '#ff1e1e';
  ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.arc(-16, -6, 2, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawPedestrian(ctx, ent) {
  ctx.save();
  ctx.translate(ent.x, ent.y);

  var t = BG.time || 0;
  var walkPhase = Math.sin(t * 4 + (ent.id || '').charCodeAt(0)) * 0.3;

  // 行走上下弹跳效果
  var bounceY = Math.abs(Math.sin(t * 4 + (ent.id || '').charCodeAt(0))) * 2;

  // 整体发光轮廓效果（更强）
  ctx.beginPath();
  ctx.arc(0, 2 - bounceY, 20, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(180, 100, 255, 0.06)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(180, 100, 255, 0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 地面阴影
  ctx.fillStyle = 'rgba(180, 100, 255, 0.06)';
  ctx.beginPath();
  ctx.ellipse(0, 22, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // ===== 腿 =====
  ctx.strokeStyle = 'rgba(180, 120, 255, 0.5)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  // 左腿
  ctx.beginPath();
  ctx.moveTo(-3, 8 - bounceY);
  ctx.lineTo(-3 + Math.sin(walkPhase) * 5, 20 - bounceY * 0.3);
  ctx.stroke();
  // 右腿
  ctx.beginPath();
  ctx.moveTo(3, 8 - bounceY);
  ctx.lineTo(3 - Math.sin(walkPhase) * 5, 20 - bounceY * 0.3);
  ctx.stroke();

  // 鞋子（不同颜色）
  ctx.fillStyle = 'rgba(60, 40, 120, 0.7)';
  ctx.beginPath();
  ctx.arc(-3 + Math.sin(walkPhase) * 5, 20 - bounceY * 0.3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(100, 60, 160, 0.7)';
  ctx.beginPath();
  ctx.arc(3 - Math.sin(walkPhase) * 5, 20 - bounceY * 0.3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // ===== 身体（躯干）=====
  ctx.fillStyle = 'rgba(120, 80, 220, 0.6)';
  roundRectPath(ctx, -5, -6 - bounceY, 10, 16, 3);
  ctx.fill();

  // 衣服细节（横条纹）
  ctx.strokeStyle = 'rgba(200, 150, 255, 0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(-4, 2 - bounceY); ctx.lineTo(4, 2 - bounceY); ctx.stroke();

  // 背包/手提袋
  ctx.fillStyle = 'rgba(80, 50, 140, 0.5)';
  roundRectPath(ctx, 5, -4 - bounceY, 4, 8, 1.5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120, 80, 180, 0.3)';
  ctx.lineWidth = 0.5;
  roundRectPath(ctx, 5, -4 - bounceY, 4, 8, 1.5);
  ctx.stroke();
  // 背包带
  ctx.strokeStyle = 'rgba(100, 70, 160, 0.3)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(3, -4 - bounceY);
  ctx.lineTo(5, -4 - bounceY);
  ctx.stroke();

  // ===== 手臂 =====
  ctx.strokeStyle = 'rgba(180, 120, 255, 0.4)';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  // 左臂
  ctx.beginPath();
  ctx.moveTo(-5, -2 - bounceY);
  ctx.lineTo(-9 + Math.sin(walkPhase + 1) * 3, 8 - bounceY);
  ctx.stroke();
  // 右臂
  ctx.beginPath();
  ctx.moveTo(5, -2 - bounceY);
  ctx.lineTo(9 - Math.sin(walkPhase + 1) * 3, 8 - bounceY);
  ctx.stroke();

  // 手机使用姿态（右手发光小方块）
  var phoneX = 9 - Math.sin(walkPhase + 1) * 3;
  var phoneY = 8 - bounceY;
  ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
  ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
  ctx.shadowBlur = 6;
  ctx.fillRect(phoneX - 1.5, phoneY - 1.5, 3, 3);
  ctx.shadowBlur = 0;
  // 手机光线
  var phoneGlow = ctx.createRadialGradient(phoneX, phoneY, 0, phoneX, phoneY, 8);
  phoneGlow.addColorStop(0, 'rgba(0, 240, 255, 0.1)');
  phoneGlow.addColorStop(1, 'rgba(0, 240, 255, 0)');
  ctx.fillStyle = phoneGlow;
  ctx.beginPath();
  ctx.arc(phoneX, phoneY, 8, 0, Math.PI * 2);
  ctx.fill();

  // ===== 头部 =====
  ctx.beginPath();
  ctx.arc(0, -12 - bounceY, 7, 0, Math.PI * 2);
  var headGrad = ctx.createRadialGradient(-1, -13 - bounceY, 0, 0, -12 - bounceY, 7);
  headGrad.addColorStop(0, 'rgba(220, 180, 255, 0.9)');
  headGrad.addColorStop(1, 'rgba(180, 120, 240, 0.7)');
  ctx.fillStyle = headGrad;
  ctx.shadowColor = 'rgba(180, 100, 255, 0.6)';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 头发（简单弧线）
  ctx.strokeStyle = 'rgba(100, 60, 180, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -14 - bounceY, 7, Math.PI + 0.3, Math.PI * 2 - 0.3);
  ctx.stroke();

  ctx.restore();
}

function drawBlindZone(ctx, truck) {
  if (!truck._blindX) return;
  var bx = truck._blindX;
  var by = truck._blindY;
  var br = truck._blindR;

  // 脉冲动画
  var pulse = 1 + Math.sin(BG.time * 3) * 0.08;

  // 盲区圆
  ctx.beginPath();
  ctx.arc(bx, by, br * pulse, 0, Math.PI * 2);
  var grad = ctx.createRadialGradient(bx, by, 0, bx, by, br * pulse);
  grad.addColorStop(0, 'rgba(255, 45, 85, 0.15)');
  grad.addColorStop(0.6, 'rgba(255, 45, 85, 0.08)');
  grad.addColorStop(1, 'rgba(255, 45, 85, 0.01)');
  ctx.fillStyle = grad;
  ctx.fill();

  // 盲区边框
  ctx.strokeStyle = 'rgba(255, 45, 85, 0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 地埋灯带
  var ringR = br * pulse + 6;
  var ringColor;
  if (BG.riskState === 'DANGER') ringColor = 'rgba(255, 45, 85, 0.4)';
  else if (BG.riskState === 'WARNING') ringColor = 'rgba(255, 204, 0, 0.4)';
  else ringColor = 'rgba(0, 255, 136, 0.2)';

  ctx.beginPath();
  ctx.arc(bx, by, ringR, 0, Math.PI * 2);
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 3;
  ctx.shadowColor = ringColor;
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 雷达扫描
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(BG.scanAngle);
  var scanGrad = ctx.createConicalGradient ? null : null;
  // 用三角形模拟扫描光束
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, br * pulse * 0.8, -0.15, 0.15);
  ctx.closePath();
  var sg = ctx.createRadialGradient(0, 0, 0, 0, 0, br * pulse * 0.8);
  sg.addColorStop(0, 'rgba(0, 240, 255, 0.25)');
  sg.addColorStop(1, 'rgba(0, 240, 255, 0.02)');
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.restore();

  // "BLIND ZONE" 标签
  ctx.fillStyle = 'rgba(255, 45, 85, 0.4)';
  ctx.font = '8px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('BLIND ZONE', bx, by - br * pulse - 8);
}

function drawTrail(ctx, ent) {
  if (!BG.trailMap[ent.id]) BG.trailMap[ent.id] = [];

  // 添加当前位置
  BG.trailMap[ent.id].push({ x: ent.x, y: ent.y });
  if (BG.trailMap[ent.id].length > 30) BG.trailMap[ent.id].shift();

  var trail = BG.trailMap[ent.id];
  if (trail.length < 2) return;

  for (var i = 1; i < trail.length; i++) {
    var alpha = i / trail.length * 0.4;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    var tc;
    if (ent.type === 'ebike') tc = 'rgba(0, 240, 255, ' + alpha + ')';
    else if (ent.type === 'ped') tc = 'rgba(180, 100, 255, ' + alpha + ')';
    else tc = 'rgba(255, 160, 40, ' + alpha + ')';
    ctx.strokeStyle = tc;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawLockOn(ctx, ent) {
  if (!ent.locked) return;

  var sz = 20 + Math.sin(BG.time * 6) * 3;
  ctx.save();
  ctx.translate(ent.x, ent.y);
  ctx.rotate(BG.time * 2);

  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = BG.riskState === 'DANGER' ? 'rgba(255, 45, 85, 0.7)' : 'rgba(255, 204, 0, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
  ctx.setLineDash([]);

  // 角标
  var cn = 5;
  ctx.strokeStyle = BG.riskState === 'DANGER' ? '#ff2d55' : '#ffcc00';
  ctx.lineWidth = 2;
  // 左上
  ctx.beginPath();
  ctx.moveTo(-sz / 2, -sz / 2 + cn);
  ctx.lineTo(-sz / 2, -sz / 2);
  ctx.lineTo(-sz / 2 + cn, -sz / 2);
  ctx.stroke();
  // 右上
  ctx.beginPath();
  ctx.moveTo(sz / 2 - cn, -sz / 2);
  ctx.lineTo(sz / 2, -sz / 2);
  ctx.lineTo(sz / 2, -sz / 2 + cn);
  ctx.stroke();
  // 左下
  ctx.beginPath();
  ctx.moveTo(-sz / 2, sz / 2 - cn);
  ctx.lineTo(-sz / 2, sz / 2);
  ctx.lineTo(-sz / 2 + cn, sz / 2);
  ctx.stroke();
  // 右下
  ctx.beginPath();
  ctx.moveTo(sz / 2 - cn, sz / 2);
  ctx.lineTo(sz / 2, sz / 2);
  ctx.lineTo(sz / 2, sz / 2 - cn);
  ctx.stroke();

  ctx.restore();
}

function drawScanLine(ctx, w, h) {
  var y = BG.scanLineY;
  ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.fillRect(0, y - 1, w, 2);
  // 渐变
  var sg = ctx.createLinearGradient(0, y - 20, 0, y);
  sg.addColorStop(0, 'rgba(0, 240, 255, 0)');
  sg.addColorStop(1, 'rgba(0, 240, 255, 0.05)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, y - 20, w, 20);
}

function drawHUDCorners(ctx, w, h) {
  var cs = 30;
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 2;

  // 左上
  ctx.beginPath();
  ctx.moveTo(5, 5 + cs);
  ctx.lineTo(5, 5);
  ctx.lineTo(5 + cs, 5);
  ctx.stroke();
  // 右上
  ctx.beginPath();
  ctx.moveTo(w - 5 - cs, 5);
  ctx.lineTo(w - 5, 5);
  ctx.lineTo(w - 5, 5 + cs);
  ctx.stroke();
  // 左下
  ctx.beginPath();
  ctx.moveTo(5, h - 5 - cs);
  ctx.lineTo(5, h - 5);
  ctx.lineTo(5 + cs, h - 5);
  ctx.stroke();
  // 右下
  ctx.beginPath();
  ctx.moveTo(w - 5 - cs, h - 5);
  ctx.lineTo(w - 5, h - 5);
  ctx.lineTo(w - 5, h - 5 - cs);
  ctx.stroke();
}

/* ---------- 主循环 ---------- */
function mainLoop(timestamp) {
  var dt = (timestamp - BG.lastTime) / 1000;
  BG.lastTime = timestamp;

  // 帧时间限制
  if (dt > 0.1) dt = 0.016;
  if (dt <= 0) dt = 0.016;

  BG.time += dt;

  // 更新扫描线
  BG.scanLineY += 40 * dt;
  if (BG.scanLineY > BG.simH) BG.scanLineY = 0;

  // 更新雷达扫描角度
  BG.scanAngle += 1.5 * dt;

  // 更新实体
  if (BG.running) {
    for (var i = 0; i < BG.entities.length; i++) {
      var ent = BG.entities[i];
      if (ent.active) {
        followPath(ent, dt);
      }
    }
  }

  // 风险检测
  var risk = computeRisk();
  var prevRisk = BG.riskState;
  BG.riskLevel = risk.level;
  BG.riskState = risk.state;

  // 状态变化事件
  if (risk.state !== prevRisk && BG.running) {
    if (risk.state === 'DANGER') {
      BG.alerts++;
      BG.conflicts++;
      addLog('danger', 'DANGER - 检测到盲区碰撞风险！');
    } else if (risk.state === 'WARNING') {
      BG.alerts++;
      addLog('warning', 'WARNING - 目标接近盲区');
    } else if (prevRisk !== 'SAFE' && risk.state === 'SAFE') {
      addLog('safe', 'SAFE - 威胁解除');
    }
    updateStats();
  }

  // 更新 UI
  updateUI(BG.riskState, BG.riskLevel);

  // ---- 渲染 ----
  var ctx = BG.ctx;
  var w = BG.simW;
  var h = BG.simH;
  if (!w || !h) { requestAnimationFrame(mainLoop); return; }

  // 清除
  ctx.fillStyle = '#040810';
  ctx.fillRect(0, 0, w, h);

  // 背景网格
  drawGrid(ctx, w, h);

  // 十字路口
  drawIntersection(ctx, w, h);

  // 环境装饰
  drawEnvironment(ctx, w, h);

  // HUD 角落装饰
  drawHUDCorners(ctx, w, h);

  // 扫描线
  drawScanLine(ctx, w, h);

  // 绘制盲区
  for (var ti = 0; ti < risk.trucks.length; ti++) {
    drawBlindZone(ctx, risk.trucks[ti]);
  }

  // 绘制轨迹
  for (var ei = 0; ei < BG.entities.length; ei++) {
    if (BG.entities[ei].active) {
      drawTrail(ctx, BG.entities[ei]);
    }
  }

  // 绘制实体
  for (var di = 0; di < BG.entities.length; di++) {
    var dent = BG.entities[di];
    if (!dent.active) continue;
    if (dent.type === 'truck') drawTruck(ctx, dent);
    else if (dent.type === 'ebike') drawEbike(ctx, dent);
    else if (dent.type === 'ped') drawPedestrian(ctx, dent);
  }

  // 锁定框
  for (var li = 0; li < BG.entities.length; li++) {
    if (BG.entities[li].active && BG.entities[li].type !== 'truck') {
      drawLockOn(ctx, BG.entities[li]);
    }
  }

  requestAnimationFrame(mainLoop);
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function() {
  initParticles();
  initSimulator();
  drawGauge(0);
});
</script>
