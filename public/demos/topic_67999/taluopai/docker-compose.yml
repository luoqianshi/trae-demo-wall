version: '3.8'

services:
  tarot-app:
    build: .
    container_name: tarot-app
    ports:
      - "3000:3001"
    volumes:
      - tarot-data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=tarot-secret-key-change-me
      - DB_PATH=/app/data/tarot.db
    restart: unless-stopped

volumes:
  tarot-data:
    driver: local