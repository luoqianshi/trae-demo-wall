    function renderRadarChart(dimensions, size) {
      var count = dimensions.length;
      var center = size / 2;
      var radius = size * 0.34;
      var labelRadius = size * 0.42;
      var angleStep = (Math.PI * 2) / count;
      var startAngle = -Math.PI / 2;
      function point(r, i) {
        var angle = startAngle + i * angleStep;
        return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
      }
      var gridLevels = [0.33, 0.66, 1];
      var gridPaths = gridLevels.map(function(level) {
        var r = radius * level;
        var pts = [];
        for (var i = 0; i < count; i++) {
          var p = point(r, i);
          pts.push(p.x + ',' + p.y);
        }
        return '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#2a2a3e" stroke-width="1" />';
      }).join('');
      var axisLines = '';
      for (var i = 0; i < count; i++) {
        var p2 = point(radius, i);
        axisLines += '<line x1="' + center + '" y1="' + center + '" x2="' + p2.x + '" y2="' + p2.y + '" stroke="#2a2a3e" stroke-width="1" />';
      }
      var dataPoints = [];
      var dataDots = [];
      for (var i = 0; i < count; i++) {
        var score = dimensions[i].score;
        var r = radius * (score / 100);
        var p = point(r, i);
        dataPoints.push(p.x + ',' + p.y);
        dataDots.push('<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#4f46e5" />');
      }
      var labels = '';
      for (var i = 0; i < count; i++) {
        var p = point(labelRadius, i);
        var anchor = 'middle';
        if (p.x < center - 5) anchor = 'end';
        if (p.x > center + 5) anchor = 'start';
        var dy = p.y < center - 5 ? -4 : 4;
        labels += '<text x="' + p.x + '" y="' + p.y + '" dy="' + dy + '" text-anchor="' + anchor + '" fill="#a1a1aa" font-size="11" font-weight="500">' + dimensions[i].label + '</text>';
      }
      return '<div class="flex justify-center">' +
        '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg">' +
          '<defs>' +
            '<linearGradient id="radarGradientDashboard" x1="0%" y1="0%" x2="100%" y2="100%">' +
              '<stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.35" />' +
              '<stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.2" />' +
            '</linearGradient>' +
          '</defs>' +
          gridPaths +
          axisLines +
          '<polygon points="' + dataPoints.join(' ') + '" fill="url(#radarGradientDashboard)" stroke="#4f46e5" stroke-width="2" />' +
          dataDots.join('') +
          labels +
        '</svg>' +
      '</div>';
    }

                  '<span class="w-5 h-5 text-cloud">' + svgArrowLeft() + '</span>' +
                '</button>' +
                '<div class="flex items-center space-x-2">' + renderLogo(32) + '<span class="text-xl font-bold text-cloud-light">答云</span></div>' +
              '</div>' +
              '<div class="text-sm text-cloud-dark">重新检测</div>' +
            '</div>' +
          '</div>' +
        '</nav>' +
        '<main class="pt-24 pb-20 px-4 sm:px-6 lg:px-8 flex-1 flex items-center justify-center">' +
          '<div class="max-w-2xl mx-auto text-center">' +
            '<div class="w-24 h-24 rounded-full bg-gradient-to-br from-tech-blue to-tech-cyan flex items-center justify-center mx-auto mb-8 ' + (state.isRechecking ? 'animate-pulse' : '') + '">' +
              '<span class="w-12 h-12 text-white ' + (state.isRechecking ? 'animate-spin' : '') + '">' + svgRefreshCw() + '</span>' +
            '</div>' +
            '<h1 class="text-3xl font-bold text-cloud-light mb-4">重新检测品牌可见度</h1>' +
            '<p class="text-cloud mb-8">在完成部分优化任务后，重新检测品牌在AI平台中的表现，对比优化前后的变化</p>' +
            (!state.isRechecking ?
              '<div class="glass-card rounded-3xl p-6 mb-8 specular-highlight">' +
                '<h3 class="text-lg font-semibold text-cloud-light mb-4">当前任务完成情况</h3>' +
                '<div class="flex items-center justify-between mb-4">' +
                  '<span class="text-cloud-dark">已完成任务</span>' +
                  '<span class="text-cloud-light">' + completedTasks + ' / ' + totalTasks + '</span>' +
                '</div>' +
                '<div class="h-3 bg-dark-700 rounded-full overflow-hidden">' +
                  '<div class="h-full bg-gradient-to-r from-tech-blue to-tech-cyan rounded-full" style="width: ' + progress + '%"></div>' +
                '</div>' +
                '<p class="text-sm text-cloud-dark mt-4">建议至少完成3个高优先级任务后再进行重新检测，以获得更明显的优化效果</p>' +
              '</div>' : '') +
            (state.isRechecking ?
              '<div class="glass-card rounded-3xl p-8 mb-8 specular-highlight">' +
                '<div class="text-2xl text-tech-cyan mb-4">正在重新检测...</div>' +
                '<div class="flex justify-between text-sm text-cloud-dark mb-2"><span>进度</span><span>' + state.recheckProgress + '%</span></div>' +
                '<div class="h-3 bg-dark-700 rounded-full overflow-hidden">' +
                  '<div class="h-full bg-gradient-to-r from-tech-blue to-tech-cyan rounded-full transition-all duration-300" style="width: ' + state.recheckProgress + '%"></div>' +
                '</div>' +
                '<div class="mt-6 space-y-2 text-left">' +
                  (state.recheckProgress >= 25 ? '<div class="flex items-center space-x-2 text-sm text-tech-green"><span class="w-4 h-4">' + svgCheckCircle() + '</span><span>重新分析品牌资料</span></div>' : '') +
                  (state.recheckProgress >= 50 ? '<div class="flex items-center space-x-2 text-sm text-tech-green"><span class="w-4 h-4">' + svgCheckCircle() + '</span><span>重新检测AI平台表现</span></div>' : '') +
                  (state.recheckProgress >= 75 ? '<div class="flex items-center space-x-2 text-sm text-tech-green"><span class="w-4 h-4">' + svgCheckCircle() + '</span><span>分析竞争品牌对比</span></div>' : '') +
                  (state.recheckProgress >= 100 ? '<div class="flex items-center space-x-2 text-sm text-tech-green"><span class="w-4 h-4">' + svgCheckCircle() + '</span><span>生成对比报告</span></div>' : '') +
                '</div>' +
              '</div>' : '') +
            (!state.isRechecking ?
              '<button onclick="startRecheck()" class="w-full py-4 bg-gradient-to-r from-tech-blue to-tech-cyan text-white rounded-xl font-medium hover:opacity-90 transition-opacity flex items-center justify-center space-x-2">' +
                '<span class="w-5 h-5">' + svgRefreshCw() + '</span>' +
                '<span>开始重新检测</span>' +
              '</button>' : '') +
            '<p class="text-xs text-cloud-dark mt-8">当前Demo检测数据为模拟数据，仅用于展示产品工作流程。实际结果会受到AI平台版本、数据来源和提问方式影响。</p>' +
          '</div>' +
        '</main>' +
      '</div>';
    }

    function renderComparison() {
      var history = state.reportHistory;
      if (history.length < 2) {
        return '<div class="min-h-screen bg-dark-950 flex flex-col items-center justify-center">' +
          '<div class="text-center">' +
            '<span class="w-16 h-16 text-cloud-dark mx-auto mb-4">' + svgActivity() + '</span>' +
            '<h3 class="text-lg font-semibold text-cloud-light mb-2">暂无对比数据</h3>' +
            '<p class="text-cloud-dark">请先完成重新检测</p>' +
            '<button onclick="state.page=\'dashboard\'; render();" class="mt-6 px-6 py-3 bg-gradient-to-r from-tech-blue to-tech-cyan text-white rounded-xl font-medium hover:opacity-90 transition-opacity">返回报告</button>' +
          '</div>' +
        '</div>';
      }
      var before = history[history.length - 2];
      var after = history[history.length - 1];
      var comparisonData = [
        { metric: 'AI答案可见度', before: before.overallScore, after: after.overallScore, unit: '分' },
        { metric: '品牌提及率', before: before.brandMentionRate, after: after.brandMentionRate, unit: '%' },
        { metric: '高机会问题覆盖', before: 3, after: 7, unit: '个' },
        { metric: '知识缺口', before: 12, after: 6, unit: '项', isNegative: true },
        { metric: '推荐竞争力', before: before.dimensions.find(function(d) { return d.name === 'recommendCompetitiveness'; }).score, after: after.dimensions.find(function(d) { return d.name === 'recommendCompetitiveness'; }).score, unit: '分' },
        { metric: '内容可信度', before: before.dimensions.find(function(d) { return d.name === 'contentCredibility'; }).score, after: after.dimensions.find(function(d) { return d.name === 'contentCredibility'; }).score, unit: '分' }
      ];
      var timelineData = [
        { date: 'Day 1', event: '首次检测完成', score: before.overallScore },
        { date: 'Day 5', event: '完成品牌基础信息优化', score: 66 },
        { date: 'Day 10', event: '发布产品场景文章', score: 69 },
        { date: 'Day 15', event: '完成官网FAQ更新', score: 71 },
        { date: 'Day 20', event: '获得第三方媒体报道', score: 73 },
        { date: 'Day 30', event: '重新检测完成', score: after.overallScore }
      ];
      return '<div class="min-h-screen bg-dark-950">' +
        '<nav class="fixed top-0 left-0 right-0 z-50 glass-nav">' +
          '<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">' +
            '<div class="flex items-center justify-between h-16">' +
              '<div class="flex items-center space-x-4">' +
                '<button onclick="state.page=\'dashboard\'; render();" class="p-2.5 hover:bg-dark-700/40 rounded-xl transition-all">' +
                  '<span class="w-5 h-5 text-cloud">' + svgArrowLeft() + '</span>' +
                '</button>' +
                '<div class="flex items-center space-x-2">' + renderLogo(32) + '<span class="text-xl font-bold text-cloud-light">答云</span></div>' +
              '</div>' +
              '<div class="text-sm text-cloud-dark">优化前后对比</div>' +
            '</div>' +
          '</div>' +
        '</nav>' +
        '<main class="pt-24 pb-20 px-4 sm:px-6 lg:px-8">' +
          '<div class="max-w-7xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<div class="inline-flex items-center px-5 py-2.5 bg-dark-800/60 rounded-full border border-dark-600/30 backdrop-blur-md mb-4">' +
                '<span class="w-4 h-4 text-tech-green mr-2.5">' + svgTrendingUp() + '</span>' +
                '<span class="text-xs text-cloud-dark">展示品牌在30天优化计划后的可见度提升效果</span>' +
              '</div>' +
              '<h1 class="text-2xl sm:text-3xl font-bold text-cloud-light mb-3">优化前后对比</h1>' +
              '<p class="text-cloud">追踪品牌在执行优化计划后的各项指标变化</p>' +
            '</div>' +
            '<div class="glass-card rounded-3xl p-8 specular-highlight mb-8 animate-fade-in-up">' +
              '<div class="grid grid-cols-2 md:grid-cols-4 gap-6">' +
                comparisonData.slice(0, 4).map(function(item) {
                  var improvement = item.isNegative ? item.before - item.after : item.after - item.before;
                  var isPositive = item.isNegative ? improvement > 0 : improvement > 0;
                  return '<div class="text-center bg-dark-800/50 rounded-2xl p-5 border border-dark-600/20">' +
                    '<div class="text-xs text-cloud-dark mb-3 uppercase tracking-wider">' + item.metric + '</div>' +
                    '<div class="flex items-center justify-center space-x-2 mb-3">' +
                      '<span class="text-3xl font-bold text-cloud-dark">' + item.before + item.unit + '</span>' +
                      '<span class="text-2xl text-tech-cyan">→</span>' +
                      '<span class="text-3xl font-bold text-tech-green">' + item.after + item.unit + '</span>' +
                    '</div>' +
                    '<div class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-xl ' + (isPositive ? 'bg-tech-green/10' : 'bg-tech-red/10') + '">' +
                      '<span class="w-4 h-4 ' + (isPositive ? 'text-tech-green' : 'text-tech-red') + '">' + (isPositive ? svgTrendingUp() : svgTrendingDown()) + '</span>' +
                      '<span class="text-sm font-medium ' + (isPositive ? 'text-tech-green' : 'text-tech-red') + '">' + (item.isNegative ? '减少' : '提升') + ' ' + Math.abs(improvement) + item.unit + '</span>' +
                    '</div>' +
                  '</div>';
                }).join('') +
              '</div>' +
            '</div>' +
            '<div class="grid lg:grid-cols-2 gap-6 mb-8">' +
              '<div class="glass-card rounded-3xl p-7 specular-highlight hover-lift animate-slide-up-delayed">' +
                '<div class="flex items-center space-x-3 mb-6">' +
                  '<div class="w-10 h-10 rounded-xl bg-tech-blue/15 flex items-center justify-center">' +
                    '<span class="w-5 h-5 text-tech-blue">' + svgTrendingUp() + '</span>' +
                  '</div>' +
                  '<div><h3 class="text-lg font-semibold text-cloud-light">优化效果详情</h3><p class="text-xs text-cloud-dark">各项指标的具体变化</p></div>' +
                '</div>' +
                '<div class="space-y-4">' +
                  comparisonData.map(function(item) {
                    var improvement = item.isNegative ? item.before - item.after : item.after - item.before;
                    var isPositive = item.isNegative ? improvement > 0 : improvement > 0;
                    return '<div class="flex items-center justify-between bg-dark-800/50 rounded-xl p-4 border border-dark-600/20">' +
                      '<span class="text-sm text-cloud-light">' + item.metric + '</span>' +
                      '<div class="flex items-center space-x-3">' +
                        '<div class="w-28 h-2 bg-dark-700 rounded-full overflow-hidden">' +
                          '<div class="h-full bg-gradient-to-r from-cloud-dark to-tech-blue rounded-full" style="width: ' + Math.min(100, item.before) + '%"></div>' +
                        '</div>' +
                        '<span class="text-cloud-dark text-xs w-14 text-right">' + item.before + item.unit + '</span>' +
                        '<span class="text-tech-cyan">→</span>' +
                        '<span class="text-tech-green text-xs w-14">' + item.after + item.unit + '</span>' +
                        '<span class="text-xs font-semibold ' + (isPositive ? 'text-tech-green' : 'text-tech-red') + '">' + (item.isNegative ? '减少' : '提升') + ' ' + Math.abs(improvement) + '</span>' +
                      '</div>' +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</div>' +
              '<div class="glass-card rounded-3xl p-7 specular-highlight hover-lift animate-slide-up-delayed">' +
                '<div class="flex items-center space-x-3 mb-6">' +
                  '<div class="w-10 h-10 rounded-xl bg-tech-purple/15 flex items-center justify-center">' +
                    '<span class="w-5 h-5 text-tech-purple">' + svgActivity() + '</span>' +
                  '</div>' +
                  '<div><h3 class="text-lg font-semibold text-cloud-light">优化时间线</h3><p class="text-xs text-cloud-dark">追踪30天优化进度</p></div>' +
                '</div>' +
                '<div class="relative">' +
                  '<div class="absolute left-4 top-0 bottom-0 w-0.5 bg-gradient-to-b from-tech-blue/50 via-tech-cyan/30 to-tech-green/50"></div>' +
                  timelineData.map(function(item, index) {
                    var isLast = index === timelineData.length - 1;
                    return '<div class="relative pl-12 pb-6 last:pb-0">' +
                      '<div class="absolute left-2 w-5 h-5 rounded-full border-2 flex items-center justify-center ' + (isLast ? 'bg-tech-green border-tech-green shadow-lg shadow-tech-green/30' : 'bg-dark-800 border-tech-blue') + '">' +
                        '<span class="w-3 h-3 text-white">' + (isLast ? svgCheckCircle() : svgActivity()) + '</span>' +
                      '</div>' +
                      '<div class="flex items-center justify-between">' +
                        '<div>' +
                          '<div class="text-sm font-medium text-cloud-light">' + item.event + '</div>' +
                          '<div class="text-xs text-cloud-dark mt-1 flex items-center"><span class="w-3 h-3 mr-1">' + svgClock() + '</span>' + item.date + '</div>' +
                        '</div>' +
                        '<div class="text-lg font-bold text-gradient">' + item.score + '分</div>' +
                      '</div>' +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="glass-card rounded-3xl p-7 specular-highlight hover-lift animate-slide-up-more-delayed">' +
              '<div class="flex items-center space-x-3 mb-6">' +
                '<div class="w-10 h-10 rounded-xl bg-tech-cyan/15 flex items-center justify-center">' +
                  '<span class="w-5 h-5 text-tech-cyan">' + svgTrendingUp() + '</span>' +
                '</div>' +
                '<div><h3 class="text-lg font-semibold text-cloud-light">平台检测变化</h3><p class="text-xs text-cloud-dark">各AI平台的表现对比</p></div>' +
              '</div>' +
              '<div class="bg-dark-800/50 rounded-2xl p-5 border border-dark-600/20">' +
                '<table class="w-full text-sm">' +
                  '<thead>' +
                    '<tr class="border-b border-dark-600/40">' +
                      '<th class="text-left py-3 px-4 text-xs font-semibold text-cloud-dark uppercase">平台</th>' +
                      '<th class="text-center py-3 px-4 text-xs font-semibold text-cloud-dark uppercase">优化前</th>' +
                      '<th class="text-center py-3 px-4 text-xs font-semibold text-cloud-dark uppercase">优化后</th>' +
                      '<th class="text-center py-3 px-4 text-xs font-semibold text-cloud-dark uppercase">变化</th>' +
                    '</tr>' +
                  '</thead>' +
                  '<tbody class="divide-y divide-dark-700/40">' +
                    after.platformResults.map(function(p, i) {
                      var beforeP = before.platformResults[i];
                      var change = p.mentionRate - beforeP.mentionRate;
                      return '<tr class="hover:bg-dark-700/30 transition-colors">' +
                        '<td class="py-3 px-4 font-medium text-cloud-light">' + p.platformLabel + '</td>' +
                        '<td class="py-3 px-4 text-center text-cloud-dark">' + beforeP.mentionRate + '%</td>' +
                        '<td class="py-3 px-4 text-center text-cloud-light">' + p.mentionRate + '%</td>' +
                        '<td class="py-3 px-4 text-center"><span class="text-tech-green">+' + change + '%</span></td>' +
                      '</tr>';
                    }).join('') +
                  '</tbody>' +
                '</table>' +
              '</div>' +
            '</div>' +
            '<div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">' +
              '<button onclick="state.page=\'dashboard\'; render();" class="px-8 py-4 bg-dark-700/50 border border-dark-600/40 text-cloud-light rounded-2xl font-semibold hover:bg-dark-600/50 hover:border-tech-blue/25 transition-all flex items-center justify-center space-x-2">' +
                '<span class="w-5 h-5">' + svgArrowLeft() + '</span>' +
                '<span>返回总览</span>' +
              '</button>' +
              '<button onclick="state.page=\'report\'; render();" class="px-8 py-4 bg-gradient-to-r from-tech-blue to-tech-cyan text-white rounded-2xl font-semibold hover:opacity-90 transition-all shadow-xl shadow-tech-blue/25 flex items-center justify-center space-x-2">' +
                '<span class="w-5 h-5">' + svgDownload() + '</span>' +
                '<span>导出报告</span>' +
              '</button>' +
            '</div>' +
            '<div class="mt-8 bg-dark-800/30 rounded-xl p-4 border border-dark-700/50">' +
              '<p class="text-xs text-cloud-dark text-center">当前Demo检测数据为模拟数据，仅用于展示产品工作流程。实际结果会受到AI平台版本、数据来源和提问方式影响。</p>' +
            '</div>' +
          '</div>' +
        '</main>' +
      '</div>';
    }

    function renderHistory() {
      var history = state.reportHistory || [];
      var empty = history.length === 0;
      var listHtml = '';
      if (empty) {
        listHtml = '<div class="text-center bg-dark-800/50 rounded-2xl border border-dark-600/30 p-12">' +
          '<span class="w-16 h-16 text-cloud-dark mx-auto mb-4 block">' + svgFileText() + '</span>' +
          '<h3 class="text-lg font-semibold text-cloud-light mb-2">暂无历史记录</h3>' +
          '<p class="text-cloud-dark">完成首次检测后，记录将显示在这里</p>' +
          '<button onclick="state.page=\'onboarding\'; render();" class="mt-6 px-6 py-3 bg-gradient-to-r from-tech-blue to-tech-cyan text-white rounded-xl font-medium hover:opacity-90 transition-opacity">开始首次检测</button>' +
        '</div>';
      } else {
        listHtml = '<div class="space-y-4">' +
          history.map(function(report, index) {
            var prev = history[index + 1];
            var change = prev ? report.overallScore - prev.overallScore : 0;
            var isUp = change > 0;
            var isDown = change < 0;
            return '<div onclick="state.page=\'dashboard\'; render();" class="bg-dark-800/50 rounded-2xl border border-dark-600/30 p-6 cursor-pointer hover:border-dark-500/30 transition-all">' +
              '<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">' +
                '<div class="flex items-center space-x-4">' +
                  '<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-tech-blue/20 to-tech-cyan/20 flex items-center justify-center">' +
                    '<span class="w-6 h-6 text-tech-cyan">' + svgFileText() + '</span>' +
                  '</div>' +
                  '<div>' +
                    '<h3 class="text-lg font-semibold text-cloud-light">' + report.brandName + '</h3>' +
                    '<p class="text-sm text-cloud-dark flex items-center"><span class="w-4 h-4 mr-2">' + svgClock() + '</span>' + new Date(report.detectedAt).toLocaleDateString() + '</p>' +
                  '</div>' +
                '</div>' +
                '<div class="flex items-center space-x-8">' +
                  '<div class="text-center"><div class="text-2xl font-bold text-cloud-light">' + report.overallScore + '</div><div class="text-xs text-cloud-dark">可见度得分</div></div>' +
                  '<div class="text-center"><div class="text-2xl font-bold text-cloud-light">' + report.platformCount + '</div><div class="text-xs text-cloud-dark">检测平台</div></div>' +
                  '<div class="text-center"><div class="text-2xl font-bold text-cloud-light">' + report.questionCount + '</div><div class="text-xs text-cloud-dark">检测问题</div></div>' +
                  (prev ? '<div class="flex items-center space-x-1 ' + (isUp ? 'text-tech-green' : isDown ? 'text-tech-red' : 'text-cloud-dark') + '">' +
                    '<span class="w-5 h-5">' + (isUp ? svgTrendingUp() : isDown ? svgTrendingDown() : svgActivity()) + '</span>' +
                    '<span class="text-lg font-medium">' + (isUp ? '+' : '') + change + '分</span>' +
                  '</div>' : '') +
                '</div>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }
      return '<div class="min-h-screen bg-dark-950">' +
        '<nav class="fixed top-0 left-0 right-0 z-50 glass-nav">' +
          '<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">' +
            '<div class="flex items-center justify-between h-16">' +
              '<div class="flex items-center space-x-4">' +
                '<button onclick="state.page=\'dashboard\'; render();" class="p-2.5 hover:bg-dark-700/40 rounded-xl transition-all">' +
                  '<span class="w-5 h-5 text-cloud">' + svgArrowLeft() + '</span>' +
                '</button>' +
                '<div class="flex items-center space-x-2">' + renderLogo(32) + '<span class="text-xl font-bold text-cloud-light">答云</span></div>' +
              '</div>' +
              '<div class="text-sm text-cloud-dark">历史记录</div>' +
            '</div>' +
          '</div>' +
        '</nav>' +
        '<main class="pt-24 pb-20 px-4 sm:px-6 lg:px-8">' +
          '<div class="max-w-7xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<h1 class="text-2xl sm:text-3xl font-bold text-cloud-light mb-3">历史检测记录</h1>' +
              '<p class="text-cloud">查看品牌在不同时间点的检测结果和优化历程</p>' +
            '</div>' +
            listHtml +
            '<div class="mt-8 bg-dark-800/30 rounded-xl p-4 border border-dark-700/50">' +
              '<p class="text-xs text-cloud-dark text-center">当前Demo检测数据为模拟数据，仅用于展示产品工作流程。实际结果会受到AI平台版本、数据来源和提问方式影响。</p>' +
            '</div>' +
          '</div>' +
        '</main>' +
      '</div>';
    }

    document.addEventListener('DOMContentLoaded', function() {
      render();
    });
  </script>
</body>
</html>
