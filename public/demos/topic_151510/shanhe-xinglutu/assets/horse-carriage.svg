<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 车身 / 马车厢 -->
    <ellipse cx="68" cy="50" rx="28" ry="14" fill="#8b5a2b" stroke="#3e2410" stroke-width="1.5"/>
    <rect x="46" y="32" width="42" height="20" rx="4" fill="#a86a3a" stroke="#3e2410" stroke-width="1.5"/>
    <rect x="50" y="36" width="34" height="12" rx="2" fill="#d4a574" opacity="0.6"/>
    <!-- 车棚顶 -->
    <path d="M 42 32 Q 67 14 92 32 Z" fill="#6b3a1a" stroke="#3e2410" stroke-width="1.5"/>
    <path d="M 50 30 Q 67 18 84 30" fill="none" stroke="#4a2a10" stroke-width="1" opacity="0.6"/>
    <!-- 帷幔 -->
    <path d="M 50 36 L 50 48 L 84 48 L 84 36" fill="none" stroke="#5a2a10" stroke-width="0.5" opacity="0.5"/>
    <line x1="58" y1="36" x2="58" y2="48" stroke="#5a2a10" stroke-width="0.4" opacity="0.4"/>
    <line x1="67" y1="36" x2="67" y2="48" stroke="#5a2a10" stroke-width="0.4" opacity="0.4"/>
    <line x1="76" y1="36" x2="76" y2="48" stroke="#5a2a10" stroke-width="0.4" opacity="0.4"/>
    <!-- 缰绳到马 -->
    <path d="M 42 48 Q 32 50 22 52" fill="none" stroke="#3e2410" stroke-width="1.2"/>
    <!-- 马 -->
    <ellipse cx="22" cy="50" rx="16" ry="9" fill="#5a3a1a" stroke="#2a1810" stroke-width="1.5"/>
    <!-- 马头 -->
    <path d="M 8 48 Q 4 44 6 40 L 14 38 Q 16 42 14 48 Z" fill="#6b4a2a" stroke="#2a1810" stroke-width="1.2"/>
    <!-- 马耳 -->
    <path d="M 8 38 L 7 33 L 11 36 Z" fill="#5a3a1a" stroke="#2a1810" stroke-width="0.8"/>
    <path d="M 11 36 L 11 32 L 14 35 Z" fill="#5a3a1a" stroke="#2a1810" stroke-width="0.8"/>
    <!-- 马眼 -->
    <circle cx="9" cy="43" r="0.8" fill="#000"/>
    <!-- 马鬃 -->
    <path d="M 14 42 L 18 36 L 22 40 L 26 36 L 30 42" fill="none" stroke="#2a1810" stroke-width="1"/>
    <!-- 马尾 -->
    <path d="M 36 50 Q 44 52 42 58 Q 38 56 36 52" fill="#3a2210" stroke="#2a1810" stroke-width="0.8"/>
    <!-- 马腿 -->
    <line x1="14" y1="58" x2="12" y2="68" stroke="#3a2210" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="20" y2="70" stroke="#3a2210" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="60" x2="30" y2="70" stroke="#3a2210" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="58" x2="36" y2="68" stroke="#3a2210" stroke-width="2" stroke-linecap="round"/>
    <!-- 车轮 -->
    <circle cx="50" cy="62" r="6" fill="#3a2210" stroke="#1a0a05" stroke-width="1.2"/>
    <circle cx="50" cy="62" r="2" fill="#5a3a1a"/>
    <line x1="44" y1="62" x2="56" y2="62" stroke="#5a3a1a" stroke-width="0.6"/>
    <line x1="50" y1="56" x2="50" y2="68" stroke="#5a3a1a" stroke-width="0.6"/>
    <circle cx="84" cy="62" r="6" fill="#3a2210" stroke="#1a0a05" stroke-width="1.2"/>
    <circle cx="84" cy="62" r="2" fill="#5a3a1a"/>
    <line x1="78" y1="62" x2="90" y2="62" stroke="#5a3a1a" stroke-width="0.6"/>
    <line x1="84" y1="56" x2="84" y2="68" stroke="#5a3a1a" stroke-width="0.6"/>
  </g>
</svg>
