<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山河行旅图 | 文学叙事地图</title>
  <meta name="description" content="用真实中国山河地图讲述诗人的行旅、作品与心境。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main id="app">
    <div id="map" aria-label="诗人生平山河地图"></div>
    <div class="paper"></div>
    <div class="vignette"></div>
    <canvas id="mist"></canvas>

    <header class="titlebar">
      <p id="titleKicker">真实山河 · 文学行旅 · 可漫游叙事地图</p>
      <h1 id="titleHeading">诗词地图</h1>
      <p id="titleSubtitle">从城市到山川，把诗人的足迹落回大地</p>
    </header>

    <nav class="mode-nav" aria-label="模式切换">
      <button class="mode-btn active" data-mode="map" type="button">诗词地图</button>
      <button class="mode-btn" data-mode="study" type="button">诗词学习</button>
      <button class="mode-btn" data-mode="travel" type="button">诗词旅行</button>
    </nav>

    <section class="search" aria-label="选择人物并搜索地点或作品">
      <div class="person-field">
        <label for="personSelect">人物</label>
        <select id="personSelect" aria-label="选择人物"></select>
      </div>
      <label for="searchInput">搜地点 / 诗文</label>
      <div class="search-box">
        <input id="searchInput" type="search" autocomplete="off" placeholder="黄州、赤壁赋、荔枝">
        <button id="searchClear" type="button" aria-label="清空搜索">清</button>
      </div>
      <div id="searchResults" class="search-results" hidden></div>
    </section>

    <section id="studyPanel" class="study-panel" aria-label="诗词搜索">
      <div class="study-head">
        <strong>诗词搜索</strong>
        <span class="study-hint">输入关键字搜索诗词，关联地图位置</span>
      </div>
      <div class="study-search-box">
        <input id="poemSearchInput" type="search" autocomplete="off" placeholder="输入关键字，如：明月、赤壁、江南">
      </div>
      <div id="poemSearchResults" class="poem-search-results"></div>
    </section>

    <section id="routePanel" class="route-panel" aria-label="旅行路线">
      <div class="route-tabs">
        <button class="route-tab active" data-tab="popular" type="button">热门路线</button>
        <button class="route-tab" data-tab="grade" type="button">课本路线</button>
        <button class="route-tab" data-tab="poet" type="button">诗人路线</button>
      </div>
      <div id="routePopular" class="route-tab-content active">
        <div id="routeList" class="route-list"></div>
      </div>
      <div id="routeGrade" class="route-tab-content" hidden>
        <div id="gradeList" class="grade-list"></div>
      </div>
      <div id="routePoet" class="route-tab-content" hidden>
        <div id="poetRouteList" class="poet-route-list"></div>
      </div>
      <div id="routeDetail" class="route-detail" hidden></div>
    </section>

    <aside class="story" aria-live="polite">
      <div class="story-head">
        <span id="storyYears">1037-1101</span>
        <strong id="storyTitle">苏轼生平节点</strong>
        <button id="chronicleOpen" class="chronicle-btn" type="button" aria-label="诗人年表">年表</button>
      </div>
      <div class="story-tabs">
        <button class="story-tab active" data-tab="node" type="button">节点故事</button>
        <button class="story-tab" data-tab="life" type="button">人生轨迹</button>
        <button class="story-tab" data-tab="culture" type="button">城市文化</button>
      </div>
      <div id="storyTabNode" class="story-tab-content active">
        <p id="storyText">点击地图上的竖牌，查看地点、诗句与生平事件；也可以用下方按钮切换前后节点。</p>
        <div id="storyWorks" class="works"></div>
        <blockquote id="storyQuote">竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。</blockquote>
        <button id="poemOpen" class="poem-open" type="button">阅读全文</button>
        <button id="travelOpen" class="poem-open travel-open" type="button" hidden>景点讲解</button>
        <div class="progress">
          <span id="progressText">第 1 / 11 站</span>
          <i><b id="progressBar"></b></i>
        </div>
        <div class="story-actions">
          <button id="prevBtn" type="button">上一站</button>
          <button id="nextBtn" type="button">下一站</button>
        </div>
        <button id="autoTourBtn" class="auto-tour-btn" type="button">重走人生轨迹</button>
      </div>
      <div id="storyTabLife" class="story-tab-content"></div>
      <div id="storyTabCulture" class="story-tab-content"></div>
    </aside>

    <ol id="timeline" class="timeline" aria-label="诗人生平时间线"></ol>

    <section id="poemModal" class="poem-modal" aria-labelledby="poemTitle" aria-modal="true" role="dialog" hidden>
      <button id="poemBackdrop" class="poem-backdrop" type="button" aria-label="关闭诗词全文"></button>
      <article class="poem-sheet">
        <button id="poemClose" class="poem-close" type="button" aria-label="关闭">×</button>
        <p id="poemAuthor" class="poem-author"></p>
        <h2 id="poemTitle"></h2>
        <div class="poem-tabs">
          <button class="poem-tab active" data-tab="original" type="button">原文</button>
          <button class="poem-tab" data-tab="annotate" type="button">注解</button>
          <button class="poem-tab" data-tab="recite" type="button">背诵</button>
        </div>
        <div id="poemBodyOriginal" class="poem-tab-content active"></div>
        <div id="poemBodyAnnotated" class="poem-tab-content"></div>
        <div id="poemBodyRecite" class="poem-tab-content"></div>
      </article>
    </section>

    <button id="glossaryToggle" class="glossary-book-btn" type="button">生字本<span id="glossaryCount" class="glossary-count">0</span></button>

    <div id="musicBar" class="music-bar" role="toolbar" aria-label="古风背景音乐控制">
      <button id="musicToggle" class="music-btn music-toggle" type="button" aria-label="播放背景音乐" title="点击播放">♪</button>
      <span id="musicName" class="music-name">未播放</span>
      <button id="musicPrev" class="music-btn music-prev" type="button" aria-label="上一首" title="上一首">⏮</button>
      <button id="musicNext" class="music-btn music-next" type="button" aria-label="下一首" title="下一首">⏭</button>
      <select id="musicSelect" class="music-select" aria-label="选择音乐风格" title="选择音乐风格">
        <option value="jiangnan">江南水乡</option>
        <option value="bashu">巴蜀山歌</option>
        <option value="saibei">塞北长调</option>
        <option value="zhongyuan">中原古韵</option>
        <option value="lingnan">岭南风情</option>
        <option value="tianyuan">田园归隐</option>
      </select>
      <input id="musicVolume" class="music-volume" type="range" min="0" max="100" value="30" aria-label="音量" title="音量">
    </div>
    <section id="glossaryPanel" class="glossary-book-panel" hidden>
      <div class="glossary-head">
        <strong>生字本</strong>
        <button id="glossaryClose" type="button">×</button>
      </div>
      <div id="glossaryFilter" class="glossary-filter">
        <select id="glossarySource"><option value="">全部</option></select>
      </div>
      <div id="glossaryList" class="glossary-list"></div>
    </section>

    <section id="chronicleModal" class="chronicle-modal" aria-modal="true" role="dialog" hidden>
      <button id="chronicleBackdrop" class="poem-backdrop" type="button" aria-label="关闭年表"></button>
      <article class="chronicle-sheet">
        <button id="chronicleClose" class="poem-close" type="button" aria-label="关闭">×</button>
        <h2 id="chronicleTitle">诗人年表</h2>
        <ol id="chronicleList" class="chronicle-list"></ol>
      </article>
    </section>

    <section id="travelModal" class="poem-modal travel-modal" aria-modal="true" role="dialog" hidden>
      <button id="travelBackdrop" class="poem-backdrop" type="button" aria-label="关闭讲解"></button>
      <article class="poem-sheet travel-sheet">
        <button id="travelClose" class="poem-close" type="button" aria-label="关闭">×</button>
        <p id="travelPoet" class="poem-author"></p>
        <h2 id="travelTitle"></h2>
        <div class="travel-controls">
          <button id="travelReadBtn" class="recite-read-btn" type="button">朗读</button>
          <button id="travelStopBtn" class="recite-stop-btn" type="button" hidden>停止</button>
        </div>
        <div id="travelSegments" class="travel-segments"></div>
        <div id="travelLandmarks" class="travel-landmarks"></div>
        <div id="travelInfo" class="travel-info"></div>
        <div class="travel-route-section">
          <h3 class="travel-route-heading">旅行路线推荐</h3>
          <div id="travelRouteList" class="travel-route-list"></div>
        </div>
      </article>
    </section>

    <div id="loader" class="loader">
      <div>
        <strong>铺开山河画卷</strong>
        <span>正在载入中国边界、水系与东坡行旅节点</span>
      </div>
    </div>
  </main>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
