<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孤岛生存挑战 - 100小时像素孤岛求生</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- PixiJS Canvas 会插入到这里 -->
    </div>

    <!-- 开始界面 DOM 层 -->
    <div id="start-screen" class="screen-overlay">
        <div class="start-content">
            <h1 class="game-title">🏝️ 孤岛生存挑战</h1>
            <p class="game-subtitle">100小时像素孤岛求生</p>

            <div class="difficulty-section">
                <p class="difficulty-label">选择难度：</p>
                <div class="difficulty-buttons">
                    <button class="diff-btn" data-difficulty="easy">
                        <span class="diff-icon">🌿</span>
                        <span class="diff-name">简单</span>
                        <span class="diff-desc">2小时</span>
                    </button>
                    <button class="diff-btn active" data-difficulty="normal">
                        <span class="diff-icon">⚔️</span>
                        <span class="diff-name">普通</span>
                        <span class="diff-desc">1.5小时</span>
                    </button>
                    <button class="diff-btn" data-difficulty="hard">
                        <span class="diff-icon">💀</span>
                        <span class="diff-name">困难</span>
                        <span class="diff-desc">1小时</span>
                    </button>
                </div>
                <p id="diff-hint" class="diff-hint">普通难度：在1.5小时内撑过100小时游戏时间</p>
            </div>

            <button id="start-btn" class="start-btn">▶ 开始游戏</button>

            <div class="controls-hint">
                <p>🎮 操作说明</p>
                <p>鼠标点击 — 移动到目标位置</p>
                <p>靠近资源 — 自动采集</p>
            </div>
        </div>
    </div>

    <!-- 游戏 HUD DOM 层 -->
    <div id="hud" class="hud hidden">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="time-info">
                <span id="day-text" class="day-text">第 1 天</span>
                <span id="time-text" class="time-text">06:00</span>
                <span id="diff-text" class="diff-text">普通</span>
            </div>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-icon">🍖</span>
                    <div class="stat-bar">
                        <div class="stat-fill hunger-fill" id="hunger-fill" style="width: 100%"></div>
                    </div>
                    <span class="stat-label">饥饿</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">💧</span>
                    <div class="stat-bar">
                        <div class="stat-fill thirst-fill" id="thirst-fill" style="width: 100%"></div>
                    </div>
                    <span class="stat-label">口渴</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-bar">
                        <div class="stat-fill energy-fill" id="energy-fill" style="width: 100%"></div>
                    </div>
                    <span class="stat-label">体力</span>
                </div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <div class="panel-section">
                <h3 class="panel-title">🎒 背包</h3>
                <ul id="inventory-list" class="inventory-list">
                    <li class="empty-hint">暂无物品</li>
                </ul>
            </div>
            <div class="panel-section">
                <h3 class="panel-title">🔨 合成</h3>
                <div id="crafting-list" class="crafting-list">
                </div>
            </div>
        </div>

        <!-- 底部提示 -->
        <div id="bottom-hint" class="bottom-hint">
            探索岛屿，收集资源，合成工具，撑过100小时等待救援！
        </div>
    </div>

    <!-- 结算界面 DOM 层 -->
    <div id="end-screen" class="screen-overlay hidden">
        <div class="end-content">
            <h1 id="end-title" class="end-title">挑战成功！</h1>
            <p id="end-subtitle" class="end-subtitle">你成功撑过了100小时，救援已到达！</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-card-icon">⏱️</span>
                    <span class="stat-card-value" id="stat-time">0</span>
                    <span class="stat-card-label">生存时间(小时)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-card-icon">📅</span>
                    <span class="stat-card-value" id="stat-days">0</span>
                    <span class="stat-card-label">存活天数</span>
                </div>
                <div class="stat-card">
                    <span class="stat-card-icon">🌿</span>
                    <span class="stat-card-value" id="stat-resources">0</span>
                    <span class="stat-card-label">采集资源</span>
                </div>
                <div class="stat-card">
                    <span class="stat-card-icon">🔨</span>
                    <span class="stat-card-value" id="stat-crafted">0</span>
                    <span class="stat-card-label">合成物品</span>
                </div>
            </div>

            <div class="end-buttons">
                <button id="restart-btn" class="end-btn primary">🔄 再来一次</button>
                <button id="menu-btn" class="end-btn">🏠 返回主菜单</button>
            </div>
        </div>
    </div>

    <!-- PixiJS 引擎 (v7 稳定版) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

    <!-- 工具和常量（最先加载） -->
    <script src="js/utils/Constants.js"></script>

    <!-- 核心系统 -->
    <script src="js/core/GameManager.js"></script>
    <script src="js/core/InputManager.js"></script>
    <script src="js/core/Scene.js"></script>

    <!-- 子系统 -->
    <script src="js/systems/TimeSystem.js"></script>
    <script src="js/systems/SurvivalSystem.js"></script>
    <script src="js/systems/CraftingSystem.js"></script>
    <script src="js/systems/EventSystem.js"></script>

    <!-- 世界实体 -->
    <script src="js/world/Resource.js"></script>
    <script src="js/world/GameMap.js"></script>
    <script src="js/world/Player.js"></script>
    <script src="js/world/Camera.js"></script>

    <!-- UI -->
    <script src="js/ui/HUD.js"></script>

    <!-- 场景 -->
    <script src="js/scenes/StartScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/EndScene.js"></script>

    <!-- 游戏入口 -->
    <script src="js/main.js"></script>
</body>
</html>
