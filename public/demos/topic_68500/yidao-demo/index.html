<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="易道 - 易经·八卦·龟卜文化学习App，千年智慧，掌中传承">
  <meta name="keywords" content="易经,八卦,龟卜,六十四卦,传统文化,国学">
  <title>易道 — 易经·八卦·龟卜文化学习App</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar" id="navbar">
  <div class="navbar-brand">
    <div class="navbar-logo">易</div>
    <span class="navbar-title">易道</span>
  </div>
  
  <div class="navbar-links" id="navbarLinks">
    <a class="navbar-link active" data-page="home">首页</a>
    <a class="navbar-link" data-page="divination">龟卜体验</a>
    <a class="navbar-link" data-page="bagua">八卦研习</a>
    <a class="navbar-link" data-page="study">易经书院</a>
    <a class="navbar-link" data-page="tools">起卦工具</a>
    <a class="navbar-link" data-page="database">卦象数据库</a>
  </div>
  
  <button class="navbar-menu-btn" id="menuBtn" aria-label="菜单">
    <i class="fas fa-bars"></i>
  </button>
</nav>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
  
  <!-- 首页 (默认显示) -->
  <div class="page page-hero active" id="page-home">
    <div class="hero-bg">
      <img src="assets/images/hero-bg.jpg" alt="" class="hero-bg-img">
      <div class="hero-bg-overlay"></div>
    </div>
    <div class="hero-content">
      <div class="hero-badge">千年智慧 · 掌中传承</div>
      <h1 class="hero-title">易 道</h1>
      <p class="hero-subtitle">探索易经、八卦、龟卜的深邃世界<br>在指尖触摸中华五千年文明智慧</p>
      <div class="hero-actions">
        <button class="btn btn-primary btn-lg" data-page="divination">
          <i class="fas fa-fire"></i> 开始龟卜体验
        </button>
        <button class="btn btn-secondary btn-lg" data-page="bagua">
          <i class="fas fa-circle-notch"></i> 探索八卦奥秘
        </button>
      </div>
      
      <!-- 特色图片展示 -->
      <div class="hero-visual-strip">
        <div class="visual-card" data-page="divination" onclick="gotoPage('divination')">
          <img src="assets/images/turtle-shell-base.jpg" alt="龟卜" class="visual-img">
          <div class="visual-overlay">
            <i class="fas fa-fire"></i>
            <span>龟卜模拟</span>
          </div>
        </div>
        <div class="visual-card" data-page="bagua" onclick="gotoPage('bagua')">
          <img src="assets/images/features-bg.jpg" alt="八卦" class="visual-img">
          <div class="visual-overlay">
            <i class="fas fa-circle-notch"></i>
            <span>八卦研习</span>
          </div>
        </div>
        <div class="visual-card" data-page="study" onclick="gotoPage('study')">
          <img src="assets/images/copper-coins.jpg" alt="书院" class="visual-img">
          <div class="visual-overlay">
            <i class="fas fa-graduation-cap"></i>
            <span>易经书院</span>
          </div>
        </div>
      </div>
      
      <!-- 底部功能卡片 -->
      <div class="hero-bottom-features">
        <div class="mini-feature" data-page="tools" onclick="gotoPage('tools')">
          <i class="fas fa-coins"></i>
          <span>起卦工具</span>
        </div>
        <div class="mini-feature" data-page="database" onclick="gotoPage('database')">
          <i class="fas fa-database"></i>
          <span>卦象数据库</span>
        </div>
        <div class="mini-feature" data-page="study" onclick="gotoPage('study')">
          <i class="fas fa-book-open"></i>
          <span>系统课程</span>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 龟卜体验页 -->
  <div class="page" id="page-divination">
    <!-- 由模块动态渲染 -->
  </div>
  
  <!-- 八卦研习页 -->
  <div class="page" id="page-bagua">
    <!-- 由模块动态渲染 -->
  </div>
  
  <!-- 易经书院页 -->
  <div class="page" id="page-study">
    <!-- 由模块动态渲染 -->
  </div>
  
  <!-- 起卦工具页 -->
  <div class="page" id="page-tools">
    <!-- 由模块动态渲染 -->
  </div>
  
  <!-- 卦象数据库页 -->
  <div class="page" id="page-database">
    <!-- 由模块动态渲染 -->
  </div>
  
</main>

<!-- 页脚 -->
<footer id="footer" style="background: var(--color-bg-dark); padding: 24px; text-align: center; color: var(--color-text-muted);">
  <p style="margin-bottom: 8px;">易道 — 易经·八卦·龟卜文化学习App Demo</p>
  <p style="opacity: 0.7; font-size: 0.85rem;">本Demo由 TRAE Work 辅助开发 | 仅供展示与学习使用</p>
  <p style="margin-top: 12px; font-size: 0.75rem; opacity: 0.5;">
    Session IDs: S-20240115-001 | S-20240115-002 | S-20240115-003
  </p>
</footer>

<!-- JavaScript 模块 -->
<script src="assets/js/data/hexagrams.js"></script>
<script src="assets/js/data/trigrams.js"></script>
<script src="assets/js/data/courses.js"></script>
<script src="assets/js/modules/divination.js"></script>
<script src="assets/js/modules/bagua.js"></script>
<script src="assets/js/modules/study.js"></script>
<script src="assets/js/modules/tools.js"></script>
<script src="assets/js/modules/database.js"></script>
<script src="assets/js/utils/storage.js"></script>
<script src="assets/js/utils/animation.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
