<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF8F0">
    <title>寻味地图 - 探索中华美食</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
/* ==================== 橙色暖黄白主题变量 ==================== */
:root {
    --bg-primary: #FFF8F0;
    --bg-secondary: #FFF0E0;
    --bg-card: #FFFFFF;
    --bg-panel: rgba(255, 255, 255, 0.98);
    --bg-overlay: rgba(255, 248, 240, 0.95);
    --orange-primary: #FF7A00;
    --orange-light: #FF9A3D;
    --orange-soft: #FFB366;
    --orange-pale: #FFD9B3;
    --yellow-warm: #FFC857;
    --yellow-light: #FFE4A1;
    --brown-warm: #8B5A2B;
    --brown-light: #A67B5B;
    --text-primary: #3D2914;
    --text-secondary: #6B4E3D;
    --text-muted: #9C8573;
    --border-light: rgba(255, 122, 0, 0.12);
    --border-medium: rgba(255, 122, 0, 0.2);
    --shadow: rgba(139, 90, 43, 0.12);
    --shadow-orange: rgba(255, 122, 0, 0.15);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
}

/* 暖色纹理背景 */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
        radial-gradient(circle at 15% 25%, rgba(255, 200, 87, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(255, 154, 61, 0.06) 0%, transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255, 122, 0, 0.015) 40px, rgba(255, 122, 0, 0.015) 41px);
    pointer-events: none;
    z-index: 1;
}

.app-container {
    position: relative;
    width: 100%;
    height: 100%;
}

/* ==================== 全屏地图 ==================== */
#mapContainer {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(180deg, #FFF8F0 0%, #FFEFD6 100%);
}

/* ==================== 顶部导航栏 ==================== */
.navbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 900px;
    height: 60px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border-medium);
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    box-shadow: 0 6px 30px var(--shadow), 0 0 20px var(--shadow-orange);
}

.logo {
    font-size: 24px;
    font-weight: 700;
    color: var(--orange-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 1px;
    flex-shrink: 0;
}

.logo::before {
    content: '◈';
    color: var(--yellow-warm);
    font-size: 26px;
}

.search-box {
    flex: 1;
    max-width: 360px;
    margin: 0 20px;
    position: relative;
}

.search-input {
    width: 100%;
    padding: 11px 16px 11px 42px;
    background: rgba(255, 248, 240, 0.8);
    border: 1px solid var(--border-medium);
    border-radius: 26px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
}

.search-input:focus {
    background: #FFFFFF;
    border-color: var(--orange-light);
    box-shadow: 0 0 18px var(--shadow-orange);
}

.search-input::placeholder {
    color: var(--text-muted);
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--orange-light);
    font-size: 15px;
}

.nav-btns {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.nav-btn {
    padding: 10px 18px;
    background: linear-gradient(135deg, rgba(255, 122, 0, 0.1), rgba(255, 200, 87, 0.1));
    border: 1px solid var(--border-medium);
    border-radius: 22px;
    color: var(--orange-primary);
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
}

.nav-btn:hover {
    background: linear-gradient(135deg, rgba(255, 122, 0, 0.2), rgba(255, 200, 87, 0.15));
    border-color: var(--orange-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--shadow-orange);
}

/* ==================== 悬浮信息面板 ==================== */
.info-panel {
    position: fixed;
    right: -520px;
    top: 92px;
    bottom: 32px;
    width: 460px;
    max-width: calc(100% - 32px);
    background: var(--bg-panel);
    backdrop-filter: blur(32px);
    border: 1px solid var(--border-medium);
    border-radius: 24px;
    transition: right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 90;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 40px var(--shadow);
}

.info-panel.open {
    right: 16px;
}

.panel-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

.panel-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--orange-primary);
    letter-spacing: 1px;
}

.panel-close {
    width: 34px;
    height: 34px;
    background: rgba(255, 122, 0, 0.08);
    border: 1px solid var(--border-medium);
    border-radius: 50%;
    color: var(--orange-light);
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.panel-close:hover {
    background: rgba(255, 122, 0, 0.15);
    transform: rotate(90deg);
    color: var(--orange-primary);
}

.panel-content {
    padding: 24px;
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--orange-light) transparent;
}

.panel-content::-webkit-scrollbar {
    width: 4px;
}

.panel-content::-webkit-scrollbar-thumb {
    background: var(--orange-light);
    border-radius: 2px;
}

/* ==================== 美食卡片 ==================== */
.meal-card {
    background: var(--bg-card);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid var(--border-light);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    box-shadow: 0 4px 16px var(--shadow);
}

.meal-card:hover {
    transform: translateY(-5px) scale(1.01);
    border-color: var(--border-medium);
    box-shadow: 0 16px 40px var(--shadow), 0 0 24px var(--shadow-orange);
}

.meal-card-img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    background: linear-gradient(135deg, #FFF0E0, #FFE4CC);
    transition: transform 0.5s ease;
}

.meal-card:hover .meal-card-img {
    transform: scale(1.08);
}

.meal-card-body {
    padding: 16px;
}

.meal-card-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
}

.meal-card-category {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.meal-card-category span {
    padding: 4px 10px;
    background: rgba(255, 122, 0, 0.08);
    border-radius: 10px;
    color: var(--orange-primary);
}

/* ==================== 美食详情 ==================== */
.meal-detail-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 18px;
    border: 1px solid var(--border-light);
}

.meal-detail-name {
    font-size: 24px;
    font-weight: 700;
    color: var(--orange-primary);
    margin-bottom: 12px;
    letter-spacing: 1px;
}

.meal-detail-info {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.meal-detail-tag {
    padding: 6px 14px;
    background: rgba(255, 200, 87, 0.15);
    border: 1px solid rgba(255, 200, 87, 0.3);
    border-radius: 14px;
    color: var(--brown-warm);
    font-size: 12px;
    font-weight: 500;
}

.meal-section {
    margin-bottom: 24px;
}

.meal-section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--brown-warm);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
}

.ingredients-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.ingredient-item {
    padding: 10px 12px;
    background: rgba(255, 248, 240, 0.6);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    transition: all 0.3s ease;
}

.ingredient-item:hover {
    background: rgba(255, 200, 87, 0.12);
    border-color: var(--border-medium);
}

.ingredient-name {
    color: var(--text-secondary);
}

.ingredient-measure {
    color: var(--orange-primary);
    flex-shrink: 0;
    font-weight: 500;
}

.instructions {
    font-size: 14px;
    line-height: 1.9;
    color: var(--text-secondary);
    white-space: pre-line;
    padding: 16px;
    background: rgba(255, 248, 240, 0.5);
    border-radius: 12px;
    border: 1px solid var(--border-light);
}

.youtube-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: linear-gradient(135deg, var(--orange-primary), var(--orange-light));
    color: #FFFFFF;
    border-radius: 22px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(255, 122, 0, 0.3);
}

.youtube-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 122, 0, 0.4);
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: rgba(255, 248, 240, 0.8);
    border: 1px solid var(--border-medium);
    border-radius: 18px;
    color: var(--orange-primary);
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 18px;
    transition: all 0.3s ease;
    font-family: inherit;
    font-weight: 500;
}

.back-btn:hover {
    background: rgba(255, 200, 87, 0.15);
    transform: translateX(-3px);
}

/* ==================== 底部状态栏 ==================== */
.status-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: auto;
    min-width: 280px;
    height: 46px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border-medium);
    border-radius: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 0 24px;
    z-index: 100;
    font-size: 13px;
    box-shadow: 0 6px 24px var(--shadow);
}

.status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
}

.status-value {
    color: var(--orange-primary);
    font-weight: 600;
}

/* ==================== 加载动画 ==================== */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease;
}

.loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-content {
    text-align: center;
}

.loading-title {
    font-size: 40px;
    font-weight: 700;
    color: var(--orange-primary);
    margin-bottom: 32px;
    letter-spacing: 6px;
}

.loading-spinner {
    width: 56px;
    height: 56px;
    border: 3px solid var(--orange-pale);
    border-top-color: var(--orange-primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    color: var(--text-muted);
    font-size: 15px;
    letter-spacing: 2px;
}

/* ==================== 空状态和错误状态 ==================== */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

.empty-icon {
    font-size: 60px;
    margin-bottom: 16px;
}

.error-state {
    text-align: center;
    padding: 40px 20px;
}

.error-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.error-text {
    color: #E74C3C;
    margin-bottom: 20px;
    line-height: 1.6;
}

.retry-btn {
    padding: 12px 26px;
    background: linear-gradient(135deg, var(--orange-primary), var(--orange-light));
    border: none;
    border-radius: 22px;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s ease;
    font-family: inherit;
    font-weight: 500;
}

.retry-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 122, 0, 0.35);
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--orange-pale);
    border-top-color: var(--orange-primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 40px auto;
}

/* ==================== 随机推荐卡片 ==================== */
.random-card {
    background: linear-gradient(135deg, rgba(255, 248, 240, 0.8), rgba(255, 200, 87, 0.08));
    border: 1px solid var(--border-medium);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
}

.random-card-img {
    width: 100%;
    max-width: 280px;
    height: 180px;
    object-fit: cover;
    border-radius: 16px;
    margin: 0 auto 18px;
    display: block;
    border: 1px solid var(--border-light);
}

.random-card-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--orange-primary);
    margin-bottom: 12px;
}

.random-card-desc {
    color: var(--text-secondary);
    margin-bottom: 18px;
    line-height: 1.6;
}

/* ==================== 提示文字 ==================== */
.hint-text {
    position: fixed;
    top: 88px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--orange-primary);
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: all 0.4s ease;
    border: 1px solid var(--border-medium);
    box-shadow: 0 4px 16px var(--shadow);
    font-weight: 500;
}

.hint-text.show {
    opacity: 1;
}

/* ==================== 分类标签 ==================== */
.category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
}

.category-tab {
    padding: 8px 14px;
    background: rgba(255, 248, 240, 0.8);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.3s ease;
    font-family: inherit;
}

.category-tab:hover {
    background: rgba(255, 122, 0, 0.08);
    border-color: var(--border-medium);
    color: var(--orange-primary);
    transform: translateY(-2px);
}

/* ==================== 中文美食介绍卡片 ==================== */
.chinese-intro {
    background: linear-gradient(135deg, rgba(255, 248, 240, 0.9), rgba(255, 200, 87, 0.08));
    border: 1px solid var(--border-medium);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
}

.chinese-intro-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--orange-primary);
    margin-bottom: 10px;
}

.chinese-intro-text {
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-secondary);
}

/* ==================== 美食小贴士 ==================== */
.tip-card {
    background: rgba(255, 248, 240, 0.6);
    border-left: 3px solid var(--orange-light);
    border-radius: 0 12px 12px 0;
    padding: 14px 16px;
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
}

/* ==================== 移动端适配 ==================== */
@media (max-width: 768px) {
    .navbar {
        top: 8px;
        width: calc(100% - 16px);
        height: 54px;
        padding: 0 16px;
        border-radius: 16px;
    }
    
    .logo {
        font-size: 20px;
    }
    
    .search-box {
        max-width: 140px;
        margin: 0 10px;
    }
    
    .search-input {
        padding: 9px 12px 9px 34px;
        font-size: 12px;
    }
    
    .nav-btns {
        gap: 6px;
    }
    
    .nav-btn {
        padding: 8px 12px;
        font-size: 12px;
    }
    
    .info-panel {
        width: 100%;
        right: -100%;
        top: 70px;
        bottom: 70px;
        border-radius: 20px 20px 0 0;
        border: none;
        border-top: 2px solid var(--orange-primary);
    }
    
    .info-panel.open {
        right: 0;
    }
    
    .panel-header {
        padding: 16px;
    }
    
    .panel-title {
        font-size: 17px;
    }
    
    .panel-content {
        padding: 16px;
    }
    
    .meal-detail-name {
        font-size: 20px;
    }
    
    .meal-detail-img {
        height: 170px;
    }
    
    .ingredients-grid {
        grid-template-columns: 1fr;
    }
    
    .status-bar {
        bottom: 10px;
        height: 42px;
        padding: 0 18px;
        font-size: 12px;
        gap: 16px;
        min-width: auto;
    }
    
    .loading-title {
        font-size: 30px;
    }
    
    .hint-text {
        top: 68px;
        font-size: 12px;
        padding: 8px 14px;
    }
}

@media (max-width: 480px) {
    .logo {
        font-size: 18px;
    }
    
    .search-box {
        max-width: 110px;
    }
    
    .nav-btn {
        padding: 6px 10px;
        font-size: 11px;
    }
    
    .meal-card-img {
        height: 150px;
    }
}
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-title">寻味地图</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">正在探索中华美食...</div>
        </div>
    </div>

    <div class="app-container">
        <div id="mapContainer"></div>
        
        <div class="hint-text" id="hintText">点击地图上的省份，开启美食之旅</div>

        <nav class="navbar">
            <div class="logo">寻味地图</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索美食名称...">
            </div>
            <div class="nav-btns">
                <button class="nav-btn" onclick="getRandomMeal()">🎲 随机</button>
                <button class="nav-btn" onclick="showCategories()">📋 分类</button>
            </div>
        </nav>

        <aside class="info-panel" id="infoPanel">
            <div class="panel-header">
                <h3 class="panel-title" id="panelTitle">美食探索</h3>
                <button class="panel-close" onclick="closePanel()">×</button>
            </div>
            <div class="panel-content" id="panelContent">
                <div class="empty-state">
                    <div class="empty-icon">🥢</div>
                    <p>点击地图上的省份<br>探索中华各地美食</p>
                </div>
            </div>
        </aside>

        <footer class="status-bar">
            <div class="status-item">
                <span>🥢 探索中华美食</span>
            </div>
            <div class="status-item">
                <span>数据来源: <span class="status-value">TheMealDB</span></span>
            </div>
        </footer>
    </div>

    <script>
// ==================== 中国省份数据（含中文美食介绍）====================
var PROVINCE_DATA = [
    { code: 'Beijing', name: '北京', enName: 'Beijing', coords: [116.4, 39.9], food: '北京烤鸭', enFood: 'Peking Duck', desc: '皮脆肉嫩，配薄饼、甜面酱和葱丝，是享誉世界的北京名菜。' },

var CATEGORY_MAP = {
    'Beef': '牛肉料理', 'Chicken': '鸡肉料理', 'Dessert': '甜品', 'Lamb': '羊肉料理',
    'Miscellaneous': '其他美食', 'Pasta': '意面', 'Pork': '猪肉料理', 'Seafood': '海鲜料理',
    'Side': '配菜', 'Starter': '开胃菜', 'Vegan': '纯素食', 'Vegetarian': '素食',
    'Breakfast': '早餐', 'Goat': '山羊肉'
};

function translateCategory(cat) {
    return CATEGORY_MAP[cat] || (cat ? String(cat) : '其他美食');
}

function safeString(value) {
    return value !== undefined && value !== null ? String(value) : '';
}

// ==================== API配置 ====================
var API = {
    BASE_URL: 'https://www.themealdb.com/api/json/v1/1/',
    
    search: function(query) {
        return fetch(this.BASE_URL + 'search.php?s=' + encodeURIComponent(query))
            .then(function(res) { return res.json(); });
    },
    
    getByCategory: function(category) {
        return fetch(this.BASE_URL + 'filter.php?c=' + encodeURIComponent(category))
            .then(function(res) { return res.json(); });
    },
    
    getByArea: function(area) {
        return fetch(this.BASE_URL + 'filter.php?a=' + encodeURIComponent(area))
            .then(function(res) { return res.json(); });
    },
    
    getDetail: function(id) {
        return fetch(this.BASE_URL + 'lookup.php?i=' + id)
            .then(function(res) { return res.json(); });
    },
    
    getRandom: function() {
        return fetch(this.BASE_URL + 'random.php')
            .then(function(res) { return res.json(); });
    },
    
    getCategories: function() {
        return fetch(this.BASE_URL + 'list.php?c=list')
            .then(function(res) { return res.json(); });
    }
};

// ==================== 地图模块 ====================
var MapModule = {
    chart: null,
    
    init: function() {
        var chartDom = document.getElementById('mapContainer');
        if (!chartDom) return;
        this.chart = echarts.init(chartDom);
        this.loadDatavMap();
        
        window.addEventListener('resize', function() {
            if (MapModule.chart) MapModule.chart.resize();
        });
    },
    
    loadDatavMap: function() {
        var url = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';
        
        fetch(url)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                echarts.registerMap('china', data);
                MapModule.renderMap();
            })
            .catch(function(err) {
                console.error('加载地图失败:', err);
                MapModule.renderFallbackMap();
            });
    },
    
    renderMap: function() {
        var scatterData = PROVINCE_DATA.map(function(item) {
            return {
                name: item.name,
                code: item.code,
                food: item.food,
                desc: item.desc,
                value: item.coords.concat([50]),
                itemStyle: {
                    color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [
                        { offset: 0, color: 'rgba(255, 122, 0, 1)' },
                        { offset: 1, color: 'rgba(255, 200, 87, 0.8)' }
                    ])
                }
            };
        });
        
        var option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(255, 255, 255, 0.98)',
                borderColor: 'rgba(255, 122, 0, 0.3)',
                borderWidth: 1,
                padding: [12, 16],
                textStyle: { color: '#3D2914', fontSize: 13 },
                formatter: function(params) {
                    if (params.seriesType === 'effectScatter') {
                        return '<div style="font-weight:700;font-size:16px;color:#FF7A00;margin-bottom:4px;">' + safeString(params.data.name) + ' · ' + safeString(params.data.enName) + '</div>' +
                               '<div style="color:#6B4E3D;font-size:13px;">' + safeString(params.data.food) + ' · ' + safeString(params.data.enFood) + '</div>' +
                               '<div style="color:#FF9A3D;font-size:12px;margin-top:4px;">点击探索更多 →</div>';
                    }
                    return safeString(params.name);
                }
            },
            geo: {
                map: 'china',
                roam: true,
                zoom: 1.2,
                center: [105, 36],
                silent: false,
                label: {
                    show: true,
                    color: 'rgba(61, 41, 20, 0.55)',
                    fontSize: 10
                },
                itemStyle: {
                    areaColor: 'rgba(255, 248, 240, 0.7)',
                    borderColor: 'rgba(255, 122, 0, 0.25)',
                    borderWidth: 1
                },
                emphasis: {
                    label: { color: '#3D2914' },
                    itemStyle: {
                        areaColor: 'rgba(255, 200, 87, 0.25)'
                    }
                },
                regions: []
            },
            series: [{
                type: 'effectScatter',
                coordinateSystem: 'geo',
                data: scatterData,
                symbolSize: 12,
                showEffectOn: 'render',
                rippleEffect: {
                    brushType: 'stroke',
                    scale: 3,
                    period: 4
                },
                label: {
                    show: true,
                    formatter: '{b}',
                    position: 'right',
                    color: '#3D2914',
                    fontSize: 11,
                    fontWeight: 'bold'
                },
                emphasis: {
                    scale: 1.5
                }
            }]
        };
        
        this.chart.setOption(option);
        
        this.chart.on('click', function(params) {
            if (params.componentType === 'series' && params.data && params.data.code) {
                showProvinceMeals(params.data.code, params.data.name);
            } else if (params.componentType === 'geo') {
                var province = PROVINCE_DATA.find(function(p) { return p.name === params.name; });
                if (province) {
                    showProvinceMeals(province.code, province.name);
                }
            }
        });
    },
    
    renderFallbackMap: function() {
        var scatterData = PROVINCE_DATA.map(function(item) {
            return [item.coords[0], item.coords[1], item.name, item.code, item.food];
        });
        
        var option = {
            backgroundColor: 'transparent',
            grid: { left: 0, right: 0, top: 0, bottom: 0 },
            xAxis: { type: 'value', min: 80, max: 130, show: false },
            yAxis: { type: 'value', min: 18, max: 50, show: false },
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(255, 255, 255, 0.98)',
                borderColor: 'rgba(255, 122, 0, 0.3)',
                borderWidth: 1,
                textStyle: { color: '#3D2914' },
                formatter: function(params) {
                    var p = PROVINCE_DATA.find(function(item) { return item.name === params.value[2]; });
                    var enName = p ? p.enName : '';
                    var enFood = p ? p.enFood : '';
                    return '<div style="font-weight:700;color:#FF7A00;">' + safeString(params.value[2]) + ' · ' + safeString(enName) + '</div>' +
                           '<div style="color:#6B4E3D;font-size:12px;">' + safeString(params.value[4]) + ' · ' + safeString(enFood) + '</div>';
                }
            },
            series: [{
                type: 'scatter',
                data: scatterData,
                symbolSize: 16,
                itemStyle: {
                    color: 'rgba(255, 122, 0, 0.85)',
                    borderColor: '#FFC857',
                    borderWidth: 2
                },
                label: {
                    show: true,
                    formatter: function(params) { return safeString(params.value[2]); },
                    color: '#3D2914',
                    fontSize: 11
                },
                emphasis: {
                    scale: 1.5,
                    itemStyle: { color: '#FF7A00' }
                }
            }]
        };
        
        this.chart.setOption(option);
        
        this.chart.on('click', function(params) {
            if (params.value && params.value[3]) {
                showProvinceMeals(params.value[3], params.value[2]);
            }
        });
    }
};

// ==================== UI功能 ====================
function hideLoading() {
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.add('hidden');
    setTimeout(function() {
        var hint = document.getElementById('hintText');
        if (hint) hint.classList.add('show');
        setTimeout(function() {
            var hint2 = document.getElementById('hintText');
            if (hint2) hint2.classList.remove('show');
        }, 5000);
    }, 1000);
}

function openPanel() {
    var panel = document.getElementById('infoPanel');
    if (panel) panel.classList.add('open');
}

function closePanel() {
    var panel = document.getElementById('infoPanel');
    if (panel) panel.classList.remove('open');
}

function showLoadingInPanel() {
    var content = document.getElementById('panelContent');
    if (content) content.innerHTML = '<div class="spinner"></div>';
}

function showErrorInPanel(message) {
    var content = document.getElementById('panelContent');
    if (content) {
        content.innerHTML = 
            '<div class="error-state">' +
            '<div class="error-icon">⚠️</div>' +
            '<div class="error-text">' + safeString(message) + '</div>' +
            '<button class="retry-btn" onclick="showCategories()">重试</button>' +
            '</div>';
    }
}

// ==================== 显示省份美食 ====================
function showProvinceMeals(code, name) {
    openPanel();
    showLoadingInPanel();
    var title = document.getElementById('panelTitle');
    if (title) title.textContent = safeString(name) + '美食';
    
    var province = PROVINCE_DATA.find(function(p) { return p.name === name; });
    
    API.getByArea('Chinese').then(function(data) {
        if (data && data.meals && data.meals.length > 0) {
            // 优先展示与省份相关的美食
            var nameLower = safeString(name).toLowerCase();
            var filtered = data.meals.filter(function(m) {
                if (!m || !m.strMeal) return false;
                return safeString(m.strMeal).toLowerCase().indexOf(nameLower) !== -1 ||
                       m.strCategory === 'Chinese';
            });
            renderMealsList(filtered.length > 0 ? filtered : data.meals);
            
            // 添加省份美食介绍
            if (province) {
                addProvinceIntro(province);
            }
        } else {
            // API没有数据时，展示省份介绍
            if (province) {
                renderProvinceIntro(province);
            } else {
                showErrorInPanel('暂无 ' + safeString(name) + ' 美食数据');
            }
        }
    }).catch(function(err) {
        if (province) {
            renderProvinceIntro(province);
        } else {
            showErrorInPanel('加载失败：' + (safeString(err && err.message) || '网络错误'));
        }
    });
}

function addProvinceIntro(province) {
    var content = document.getElementById('panelContent');
    if (!content || !province) return;
    
    var existingList = content.querySelector('.meals-list');
    if (!existingList) return;
    
    var introHtml = 
        '<div class="chinese-intro">' +
        '<div class="chinese-intro-title">🍜 ' + safeString(province.name) + ' · ' + safeString(province.enName) + ' 代表美食</div>' +
        '<div class="chinese-intro-text" style="font-size:15px;color:#FF7A00;font-weight:600;margin-bottom:8px;">' + safeString(province.food) + ' · ' + safeString(province.enFood) + '</div>' +
        '<div class="chinese-intro-text">' + safeString(province.desc) + '</div>' +
        '</div>';
    
    content.insertAdjacentHTML('afterbegin', introHtml);
}

function renderProvinceIntro(province) {
    var content = document.getElementById('panelContent');
    if (!content || !province) return;
    
    var html = 
        '<div class="chinese-intro">' +
        '<div class="chinese-intro-title">🍜 ' + safeString(province.name) + ' · ' + safeString(province.enName) + ' 代表美食</div>' +
        '<div class="chinese-intro-text" style="font-size:15px;color:#FF7A00;font-weight:600;margin-bottom:8px;">' + safeString(province.food) + ' · ' + safeString(province.enFood) + '</div>' +
        '<div class="chinese-intro-text">' + safeString(province.desc) + '</div>' +
        '</div>' +
        '<div class="tip-card">' +
        '💡 当前网络较慢或该地区暂无更多在线菜谱数据。你可以尝试点击"分类"或"随机"按钮探索更多中华美食。' +
        '</div>';
    
    content.innerHTML = html;
}

// ==================== 美食列表 ====================
function renderMealsList(meals) {
    var content = document.getElementById('panelContent');
    if (!content) return;
    
    if (!meals || meals.length === 0) {
        content.innerHTML = 
            '<div class="empty-state"><div class="empty-icon">🍽️</div>' +
            '<p>暂无美食数据</p></div>';
        return;
    }
    
    var html = '<div class="meals-list">';
    meals.forEach(function(meal) {
        if (!meal) return;
        var thumb = safeString(meal.strMealThumb);
        var mealName = safeString(meal.strMeal);
        var id = safeString(meal.idMeal);
        var category = translateCategory(meal.strCategory);
        
        var imgHtml = thumb 
            ? '<img class="meal-card-img" src="' + thumb + '" alt="' + mealName + '" loading="lazy" onerror="this.style.display=\'none\'">' 
            : '';
        html += '<div class="meal-card" onclick="showMealDetail(\'' + id + '\')">' +
            imgHtml +
            '<div class="meal-card-body">' +
            '<div class="meal-card-name">' + mealName + '</div>' +
            '<div class="meal-card-category">' +
            '<span>' + category + '</span>' +
            '</div>' +
            '</div>' +
            '</div>';
    });
    html += '</div>';
    content.innerHTML = html;
}

// ==================== 美食详情 ====================
function showMealDetail(id) {
    if (!id) {
        showErrorInPanel('无效的美食ID');
        return;
    }
    showLoadingInPanel();
    
    API.getDetail(id).then(function(data) {
        if (data && data.meals && data.meals.length > 0) {
            renderMealDetail(data.meals[0]);
        } else {
            showErrorInPanel('获取详情失败');
        }
    }).catch(function(err) {
        showErrorInPanel('加载失败，请重试：' + safeString(err && err.message));
    });
}

function renderMealDetail(meal) {
    var content = document.getElementById('panelContent');
    if (!content || !meal) return;
    
    var html = '<div class="meal-detail">';
    html += '<button class="back-btn" onclick="goBack()">← 返回列表</button>';
    
    if (meal.strMealThumb) {
        html += '<img class="meal-detail-img" src="' + safeString(meal.strMealThumb) + '" alt="' + safeString(meal.strMeal) + '" onerror="this.style.display=\'none\'">';
    }
    
    html += '<div class="meal-detail-name">' + safeString(meal.strMeal) + '</div>';
    html += '<div class="meal-detail-info">';
    if (meal.strCategory) html += '<span class="meal-detail-tag">' + translateCategory(meal.strCategory) + '</span>';
    if (meal.strArea) html += '<span class="meal-detail-tag">' + safeString(meal.strArea) + '</span>';
    html += '</div>';
    
    // 食材
    var hasIngredients = false;
    var ingredientsHtml = '<div class="ingredients-grid">';
    for (var i = 1; i <= 20; i++) {
        var ingredient = meal['strIngredient' + i];
        var measure = meal['strMeasure' + i];
        if (ingredient && String(ingredient).trim()) {
            hasIngredients = true;
            ingredientsHtml += '<div class="ingredient-item">' +
                '<span class="ingredient-name">' + safeString(ingredient) + '</span>' +
                '<span class="ingredient-measure">' + (measure ? safeString(measure) : '-') + '</span>' +
                '</div>';
        }
    }
    ingredientsHtml += '</div>';
    
    if (hasIngredients) {
        html += '<div class="meal-section">';
        html += '<div class="meal-section-title">🥘 食材配料</div>';
        html += ingredientsHtml;
        html += '</div>';
    }
    
    if (meal.strInstructions) {
        html += '<div class="meal-section">';
        html += '<div class="meal-section-title">📝 制作步骤</div>';
        html += '<div class="instructions">' + safeString(meal.strInstructions) + '</div>';
        html += '</div>';
    }
    
    if (meal.strYoutube) {
        html += '<div class="meal-section">';
        html += '<a class="youtube-link" href="' + safeString(meal.strYoutube) + '" target="_blank" rel="noopener">▶ 观看制作视频</a>';
        html += '</div>';
    }
    
    html += '</div>';
    content.innerHTML = html;
}

var lastView = null;
function goBack() {
    if (typeof lastView === 'function') {
        lastView();
    } else {
        showCategories();
    }
}

// ==================== 分类 ====================
function showCategories() {
    openPanel();
    var title = document.getElementById('panelTitle');
    if (title) title.textContent = '📋 美食分类';
    showLoadingInPanel();
    
    API.getCategories().then(function(data) {
        if (data && data.meals) {
            renderCategories(data.meals.map(function(m) { return m.strCategory; }));
        } else {
            showErrorInPanel('获取分类失败');
        }
    }).catch(function(err) {
        showErrorInPanel('加载失败：' + safeString(err && err.message));
    });
}

function renderCategories(categories) {
    var content = document.getElementById('panelContent');
    if (!content) return;
    
    var html = '<div class="category-tabs">';
    categories.forEach(function(cat) {
        var catName = safeString(cat);
        if (!catName) return;
        html += '<button class="category-tab" onclick="showCategoryMeals(\'' + catName + '\')">' + 
            translateCategory(catName) + '</button>';
    });
    html += '</div>';
    html += '<div class="chinese-intro"><div class="chinese-intro-title">🥢 中华美食</div><div class="chinese-intro-text">中国饮食文化博大精深，八大菜系各具特色。点击上方分类，探索不同风味的美食世界。</div></div>';
    content.innerHTML = html;
}

function showCategoryMeals(category) {
    if (!category) return;
    showLoadingInPanel();
    var title = document.getElementById('panelTitle');
    if (title) title.textContent = '🍽️ ' + translateCategory(category);
    lastView = function() { showCategoryMeals(category); };
    
    API.getByCategory(category).then(function(data) {
        if (data && data.meals && data.meals.length > 0) {
            renderMealsList(data.meals);
        } else {
            showErrorInPanel('暂无该分类数据');
        }
    }).catch(function(err) {
        showErrorInPanel('加载失败，请重试：' + safeString(err && err.message));
    });
}

// ==================== 随机推荐 ====================
function getRandomMeal() {
    openPanel();
    var title = document.getElementById('panelTitle');
    if (title) title.textContent = '🎲 随机推荐';
    showLoadingInPanel();
    
    API.getRandom().then(function(data) {
        if (data && data.meals && data.meals.length > 0) {
            renderRandomMeal(data.meals[0]);
        } else {
            showErrorInPanel('获取失败，请重试');
        }
    }).catch(function(err) {
        showErrorInPanel('加载失败：' + safeString(err && err.message));
    });
}

function renderRandomMeal(meal) {
    var content = document.getElementById('panelContent');
    if (!content || !meal) return;
    
    var html = '<div class="random-card">';
    if (meal.strMealThumb) {
        html += '<img class="random-card-img" src="' + safeString(meal.strMealThumb) + '" alt="' + safeString(meal.strMeal) + '" onerror="this.style.display=\'none\'">';
    }
    html += '<div class="random-card-title">' + safeString(meal.strMeal) + '</div>';
    html += '<div class="random-card-desc">';
    if (meal.strCategory) html += '分类: ' + translateCategory(meal.strCategory) + '<br>';
    if (meal.strArea) html += '地区: ' + safeString(meal.strArea);
    html += '</div>';
    html += '<button class="retry-btn" onclick="showMealDetail(\'' + safeString(meal.idMeal) + '\')">查看详情</button>';
    html += '</div>';
    html += '<div style="text-align:center;margin-top:16px;">';
    html += '<button class="nav-btn" onclick="getRandomMeal()">🎲 再来一个</button>';
    html += '</div>';
    content.innerHTML = html;
}

// ==================== 搜索 ====================
var searchInput = document.getElementById('searchInput');
if (searchInput) {
    var searchTimeout = null;
    searchInput.addEventListener('input', function(e) {
        var query = safeString(e.target.value).trim();
        clearTimeout(searchTimeout);
        if (query.length >= 2) {
            searchTimeout = setTimeout(function() { searchMeals(query); }, 500);
        }
    });
    
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            var query = safeString(e.target.value).trim();
            if (query) searchMeals(query);
        }
    });
}

function searchMeals(query) {
    openPanel();
    var title = document.getElementById('panelTitle');
    if (title) title.textContent = '🔍 搜索: ' + query;
    showLoadingInPanel();
    
    API.search(query).then(function(data) {
        if (data && data.meals && data.meals.length > 0) {
            renderMealsList(data.meals);
        } else {
            var content = document.getElementById('panelContent');
            if (content) {
                content.innerHTML = 
                    '<div class="empty-state"><div class="empty-icon">🔍</div>' +
                    '<p>未找到 "' + safeString(query) + '" 相关美食</p></div>';
            }
        }
    }).catch(function(err) {
        showErrorInPanel('搜索失败：' + safeString(err && err.message));
    });
}

// ==================== 初始化 ====================
function init() {
    if (typeof echarts === 'undefined') {
        var overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.innerHTML = 
                '<div class="error-state"><div class="error-icon">⚠️</div>' +
                '<div class="error-text">资源加载失败</div>' +
                '<button class="retry-btn" onclick="location.reload()">刷新页面</button></div>';
        }
        return;
    }
    
    hideLoading();
    MapModule.init();
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
} else {
    document.addEventListener('DOMContentLoaded', init);
}
    </script>
