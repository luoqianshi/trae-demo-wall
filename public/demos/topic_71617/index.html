<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BOXER ARENA - 写真拳击训练</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #e8e8e8;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .game-wrap {
    max-width: 520px;
    width: 100%;
    background: linear-gradient(145deg, #1a1a1a 0%, #111 100%);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ff6b35 0%, #ff3e00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2px;
  }
  header p {
    font-size: 11px;
    color: #666;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.03);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
    gap: 6px;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat-label {
    font-size: 9px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }
  .stat-value {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #e0e0e0;
  }
  .stat-value.timer { color: #ff6b35; }
  .stat-value.timer.urgent { color: #ff2222; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.5;} }

  .canvas-wrap {
    position: relative;
    margin: 0 auto 16px;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 80px rgba(255,100,50,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  .damage-popup {
    position: absolute;
    top: 40px;
    right: 20px;
    color: #ff4444;
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(255,50,50,0.4);
  }

  .input-area { margin-bottom: 16px; }
  .input-area textarea {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #e0e0e0;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    min-height: 80px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .input-area textarea:focus {
    border-color: rgba(255,107,53,0.5);
    box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
  }
  .input-area textarea::placeholder { color: #444; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b35, #ff3e00);
    color: #fff;
    box-shadow: 0 4px 15px rgba(255,62,0,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255,62,0,0.4);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost {
    background: rgba(255,255,255,0.05);
    color: #888;
    border: 1px solid rgba(255,255,255,0.1);
    flex: 0.5;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #aaa; }

  .feedback {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 56px;
    font-size: 12px;
    line-height: 1.8;
    margin-bottom: 12px;
    color: #999;
  }
  .feedback .dmg { color: #ff6b35; font-weight: 700; font-family: 'Oswald', sans-serif; font-size: 14px; }
  .feedback .good { color: #4ecca3; font-weight: 500; }
  .feedback .info { color: #666; }

  .leaderboard {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px;
    font-size: 11px;
    max-height: 130px;
    overflow-y: auto;
  }
  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-track { background: transparent; }
  .leaderboard::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .leaderboard h3 {
    font-family: 'Oswald', sans-serif;
    color: #ff6b35;
    font-size: 13px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .leaderboard .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .leaderboard .rank { color: #ff6b35; font-weight: 600; width: 30px; }
  .leaderboard .score { color: #4ecca3; font-weight: 600; min-width: 40px; text-align: right; }
  .leaderboard .damage { color: #ffaa44; min-width: 60px; }
  .leaderboard .date { color: #444; font-size: 9px; }

  .overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    font-family: 'Oswald', sans-serif;
    color: #ff6b35;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .overlay .big-score {
    font-family: 'Oswald', sans-serif;
    color: #fff;
    font-size: 56px;
    font-weight: 700;
    margin: 8px 0;
    text-shadow: 0 4px 20px rgba(255,107,53,0.3);
  }
  .overlay .sub { color: #666; font-size: 12px; margin: 4px 0; letter-spacing: 1px; }
  .overlay .btn { margin-top: 20px; max-width: 220px; width: 100%; }

  @media (max-width: 500px) {
    .game-wrap { padding: 16px; }
    header h1 { font-size: 26px; }
    .stats-bar { padding: 8px 12px; }
    .stat-value { font-size: 18px; }
    .btn { font-size: 12px; padding: 10px 16px; }
  }
</style>
</head>
<body>
<div class="game-wrap" style="position:relative;">
  <header>
    <h1>BOXER ARENA</h1>
    <p>English Writing · Real Boxing Power</p>
  </header>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Time</span>
      <span class="stat-value timer" id="timerDisplay">5:00</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Rounds</span>
      <span class="stat-value" id="roundCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Damage</span>
      <span class="stat-value" id="totalDamage">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Rank</span>
      <span class="stat-value" id="liveRank">--</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="pixelCanvas" width="480" height="380"></canvas>
    <div class="damage-popup" id="damagePopup">+0</div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">TIME UP</h2>
      <div class="big-score" id="overlayScore">0</div>
      <div class="sub" id="overlaySub">/ 100 FINAL SCORE</div>
      <div class="sub" id="overlayTotalDam" style="color:#ffaa44;">TOTAL DAMAGE: 0</div>
      <div class="sub" id="overlayRank" style="color:#4ecca3;">RANK: --</div>
      <button class="btn btn-primary" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="input-area">
    <textarea id="commandInput" placeholder="Command your boxer in English... (e.g. He throws a devastating right hook with explosive power, rotating his entire body into the blow.)" spellcheck="false"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitCommand()">Submit Command</button>
      <button class="btn btn-ghost" onclick="skipRound()">Skip</button>
    </div>
  </div>

  <div class="feedback" id="feedback">
    <span style="color:#555;">Write a command in English to train your boxer. The better your writing, the harder he hits.</span>
  </div>

  <div class="leaderboard" id="leaderboard">
    <h3>All-Time Rankings</h3>
    <div id="lbEntries"><span style="color:#444;">No records yet. Be the first!</span></div>
  </div>
</div>

<script>
// ============================================================
// BOXER ARENA - REALISTIC STYLE
// ============================================================

const canvas = document.getElementById('pixelCanvas');
const ctx = canvas.getContext('2d');
// Realistic = enable smoothing
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

// ---- DOM ----
const elTimer = document.getElementById('timerDisplay');
const elRounds = document.getElementById('roundCount');
const elDamage = document.getElementById('totalDamage');
const elRank = document.getElementById('liveRank');
const elInput = document.getElementById('commandInput');
const elFeedback = document.getElementById('feedback');
const elPopup = document.getElementById('damagePopup');
const elOverlay = document.getElementById('overlay');
const elOverlayTitle = document.getElementById('overlayTitle');
const elOverlayScore = document.getElementById('overlayScore');
const elOverlaySub = document.getElementById('overlaySub');
const elOverlayTotalDam = document.getElementById('overlayTotalDam');
const elOverlayRank = document.getElementById('overlayRank');
const elLB = document.getElementById('lbEntries');

// ---- Game State ----
let gameState = 'idle';
let gameTimer = 5 * 60;
let totalDamage = 0;
let roundCount = 0;
let timerInterval = null;
let animFrame = null;
let animTime = 0;
let currentAnim = 'idle';
let animDuration = 900;
let animStartTime = 0;

// ---- Sweat Particles ----
let sweatDrops = [];
function spawnSweat(cx, cy) {
  for (var i = 0; i < 6; i++) {
    sweatDrops.push({
      x: cx + (Math.random()-0.5)*20,
      y: cy + (Math.random()-0.5)*10,
      vx: (Math.random()-0.5)*3,
      vy: -2 - Math.random()*4,
      life: 1,
      size: 1 + Math.random()*2
    });
  }
}
function updateSweat() {
  sweatDrops.forEach(function(d){
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.15;
    d.life -= 0.02;
  });
  sweatDrops = sweatDrops.filter(function(d){return d.life > 0;});
}

// ---- LEADERBOARD ----
function getLeaderboard() {
  try { return JSON.parse(localStorage.getItem('pixelBoxerLb')) || []; }
  catch(e) { return []; }
}
function saveLeaderboard(entry) {
  var lb = getLeaderboard();
  lb.push(entry);
  lb.sort(function(a,b){return b.damage - a.damage;});
  if (lb.length > 20) lb.length = 20;
  localStorage.setItem('pixelBoxerLb', JSON.stringify(lb));
}
function getHighestDamage() {
  var lb = getLeaderboard();
  return lb.length > 0 ? lb[0].damage : 0;
}
function renderLeaderboard() {
  var lb = getLeaderboard();
  if (!lb.length) {
    elLB.innerHTML = '<span style="color:#444;">No records yet. Be the first!</span>';
    return;
  }
  elLB.innerHTML = lb.map(function(e,i){
    var rankStr = i === 0 ? '#1' : i === 1 ? '#2' : i === 2 ? '#3' : '#'+(i+1);
    var d = new Date(e.date);
    var dateStr = (d.getMonth()+1)+'/'+d.getDate();
    return '<div class="entry"><span class="rank">'+rankStr+'</span><span class="damage">'+e.damage+' dmg</span><span class="score">'+e.score.toFixed(1)+'</span><span class="date">'+dateStr+'</span></div>';
  }).join('');
}

// ============================================================
// REALISTIC BOXER DRAWING
// ============================================================

function drawBoxer(state, progress) {
  var W = 480, H = 380;
  var p = Math.min(1, Math.max(0, progress));
  var ep = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;

  // ---- Animation Params ----
  var bodySway = 0, bodyDuck = 0, bodyLean = 0, headBob = 0;
  var leftArmAngle = 0, rightArmAngle = 0;
  var leftArmExtend = 0, rightArmExtend = 0;
  var isPunching = false;

  var idleBob = Math.sin(animTime * 3) * 2;

  switch (state) {
    case 'idle':
      headBob = idleBob;
      leftArmAngle = -5 + Math.sin(animTime * 2 + 1) * 2;
      rightArmAngle = 5 + Math.sin(animTime * 2 + 2) * 2;
      break;
    case 'jab':
      isPunching = true;
      if (p < 0.2) leftArmExtend = ep/0.2 * 55;
      else if (p < 0.5) leftArmExtend = 55 - (ep-0.2)/0.3 * 55;
      else leftArmExtend = 0;
      leftArmAngle = -10 - leftArmExtend * 0.5;
      bodySway = p < 0.5 ? -5 : 0;
      headBob = p < 0.3 ? -1 : 1;
      break;
    case 'cross':
      isPunching = true;
      if (p < 0.25) rightArmExtend = ep/0.25 * 65;
      else if (p < 0.6) rightArmExtend = 65 - (ep-0.25)/0.35 * 65;
      else rightArmExtend = 0;
      rightArmAngle = 15 - rightArmExtend * 0.7;
      bodySway = p < 0.4 ? 6 : 0;
      headBob = p < 0.35 ? -1 : 1;
      break;
    case 'hook':
      isPunching = true;
      var hookPhase = p < 0.3 ? ep/0.3 : p < 0.7 ? 1 : 1 - (ep-0.7)/0.3;
      leftArmAngle = -30 + hookPhase * 70;
      leftArmExtend = hookPhase * 40;
      bodySway = p < 0.4 ? -8 : (p < 0.7 ? -3 : 0);
      headBob = p < 0.5 ? -2 : 1;
      break;
    case 'uppercut':
      isPunching = true;
      var ucP = p < 0.3 ? ep/0.3 : p < 0.6 ? 1 : 1 - (ep-0.6)/0.4;
      rightArmAngle = -20 - ucP * 60;
      rightArmExtend = ucP * 30;
      bodyDuck = ucP * (-15);
      bodySway = p < 0.5 ? 4 : 0;
      headBob = -2;
      break;
    case 'body':
      isPunching = true;
      if (p < 0.3) leftArmExtend = ep/0.3 * 45;
      else if (p < 0.6) leftArmExtend = 45 - (ep-0.3)/0.3 * 45;
      else leftArmExtend = 0;
      leftArmAngle = 20 - leftArmExtend * 0.3;
      bodyDuck = -5;
      headBob = -1;
      break;
    case 'dodge':
      bodyLean = -18 + (p < 0.5 ? ep * 10 : (1-ep) * 10);
      headBob = -1 + Math.sin(p * 10) * 1;
      break;
    case 'weave':
      bodyDuck = -12 - Math.sin(p * 8) * 6;
      bodySway = Math.sin(p * 6) * 8;
      headBob = -4;
      break;
  }

  // ---- CLEAR ----
  ctx.clearRect(0, 0, W, H);

  // ---- ARENA BACKGROUND ----
  // Dark arena with spotlight
  var bgGrad = ctx.createRadialGradient(240, 60, 20, 240, 200, 350);
  bgGrad.addColorStop(0, '#2a1f1a');
  bgGrad.addColorStop(0.4, '#1a1210');
  bgGrad.addColorStop(1, '#0a0808');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Spotlight cone from above
  var spotGrad = ctx.createRadialGradient(240, -20, 10, 240, 180, 280);
  spotGrad.addColorStop(0, 'rgba(255,230,180,0.15)');
  spotGrad.addColorStop(0.5, 'rgba(255,200,150,0.05)');
  spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = spotGrad;
  ctx.fillRect(0, 0, W, H);

  // Second spotlight
  var spot2 = ctx.createRadialGradient(360, -10, 5, 350, 200, 200);
  spot2.addColorStop(0, 'rgba(255,180,120,0.08)');
  spot2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = spot2;
  ctx.fillRect(0, 0, W, H);

  // Audience silhouettes at the top
  ctx.fillStyle = '#0e0a08';
  for (var ax = 0; ax < W; ax += 14) {
    var ah = 15 + Math.sin(ax * 0.3 + 5) * 8 + Math.cos(ax * 0.7) * 4;
    ctx.beginPath();
    ctx.arc(ax, 20 - ah * 0.3, 7, Math.PI, 0);
    ctx.rect(ax - 7, 20 - ah * 0.3, 14, ah);
    ctx.fill();
  }

  // ---- RING ----
  // Ring floor (perspective)
  var floorY = 290;
  ctx.save();
  var floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
  floorGrad.addColorStop(0, '#4a3728');
  floorGrad.addColorStop(0.3, '#3d2e22');
  floorGrad.addColorStop(1, '#2a1f18');
  ctx.fillStyle = floorGrad;
  ctx.beginPath();
  ctx.moveTo(40, floorY);
  ctx.lineTo(W - 40, floorY);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Floor planks
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  for (var fy = floorY + 10; fy < H; fy += 12) {
    ctx.beginPath();
    ctx.moveTo(40 - (fy - floorY) * 0.3, fy);
    ctx.lineTo(W - 40 + (fy - floorY) * 0.3, fy);
    ctx.stroke();
  }

  // Ring edge highlight
  var edgeGrad = ctx.createLinearGradient(0, floorY - 2, 0, floorY + 4);
  edgeGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
  edgeGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = edgeGrad;
  ctx.fillRect(40, floorY - 1, W - 80, 4);
  ctx.restore();

  // Ropes (with slight curve)
  function drawRope(y, slack) {
    ctx.strokeStyle = '#cc3333';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(35, y);
    ctx.quadraticCurveTo(240, y + slack, W - 35, y);
    ctx.stroke();
    // Rope highlight
    ctx.strokeStyle = 'rgba(255,150,150,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(35, y - 1);
    ctx.quadraticCurveTo(240, y + slack - 1, W - 35, y - 1);
    ctx.stroke();
  }
  drawRope(75, 3);
  drawRope(140, 4);
  drawRope(210, 3);

  // Corner posts
  function drawPost(x) {
    var postGrad = ctx.createLinearGradient(x - 4, 50, x + 4, 50);
    postGrad.addColorStop(0, '#555');
    postGrad.addColorStop(0.5, '#888');
    postGrad.addColorStop(1, '#444');
    ctx.fillStyle = postGrad;
    ctx.fillRect(x - 3, 50, 6, floorY - 50);
    // Post cap
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.arc(x, 50, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  drawPost(35);
  drawPost(W - 35);

  // ---- BOXER BODY ----
  var cx = 240 + bodySway;
  var cy = 220 + bodyDuck;

  // Shadow on floor
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, floorY - 2, 35, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw order: back arm, legs, torso, front arm, head
  // ---- LEGS ----
  var legTop = cy + 50;
  var lFootX = cx - 18;
  var rFootX = cx + 18;

  function drawLeg(footX, lt) {
    // Thigh
    var thighGrad = ctx.createLinearGradient(footX - 8, lt, footX + 8, lt);
    thighGrad.addColorStop(0, '#1a237e');
    thighGrad.addColorStop(0.5, '#283593');
    thighGrad.addColorStop(1, '#1a237e');
    ctx.fillStyle = thighGrad;
    ctx.beginPath();
    ctx.moveTo(footX - 9, lt);
    ctx.quadraticCurveTo(footX - 10, lt + 25, footX - 6, lt + 45);
    ctx.lineTo(footX + 6, lt + 45);
    ctx.quadraticCurveTo(footX + 10, lt + 25, footX + 9, lt);
    ctx.closePath();
    ctx.fill();
    // Shin
    ctx.fillStyle = '#C49A6C';
    ctx.beginPath();
    ctx.moveTo(footX - 5, lt + 43);
    ctx.lineTo(footX - 4, lt + 68);
    ctx.lineTo(footX + 4, lt + 68);
    ctx.lineTo(footX + 5, lt + 43);
    ctx.closePath();
    ctx.fill();
    // Shoe
    var shoeGrad = ctx.createLinearGradient(footX - 8, lt + 65, footX + 8, lt + 65);
    shoeGrad.addColorStop(0, '#222');
    shoeGrad.addColorStop(0.6, '#444');
    shoeGrad.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = shoeGrad;
    ctx.beginPath();
    ctx.moveTo(footX - 7, lt + 66);
    ctx.quadraticCurveTo(footX - 10, lt + 72, footX - 12, lt + 75);
    ctx.lineTo(footX + 10, lt + 75);

  // ---- IMPACT EFFECTS ----
  if (isPunching && ep > 0.25 && ep < 0.55) {

    ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * flashIntensity) + ')';
    ctx.beginPath();
    ctx.arc(impactX, impactY, 5 * flashIntensity, 0, Math.PI * 2);

    if (Math.random() < 0.4) spawnSweat(cx, cy - 50);

  // ---- MOTION BLUR (during fast punches) ----
  if (isPunching && (p < 0.3 || (p > 0.4 && p < 0.6))) {

  // ---- FILM GRAIN (subtle) ----
  ctx.fillStyle = 'rgba(255,255,255,0.012)';
  for (var gi = 0; gi < 60; gi++) {
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);

}

// ---- ANIMATION LOOP ----
function animLoop(time) {
  if (!animStartTime) animStartTime = time;
  animTime = (time - animStartTime) / 1000;
  var progress = 0;
  if (currentAnim !== 'idle') {
    var elapsed = time - animStartTime;
    progress = Math.min(1, elapsed / animDuration);
    if (progress >= 1) {
      currentAnim = 'idle';
      animStartTime = time;
    }
  }
  drawBoxer(currentAnim, progress);
  animFrame = requestAnimationFrame(animLoop);
}

const BOXING_TERMS = [
  'jab','cross','hook','uppercut','straight','punch','strike','hit','blow','swing','throw',
  'dodge','duck','weave','slip','roll','block','parry','guard','cover','shield',
  'footwork','stance','position','angle','range','distance','reach',

  'power','speed','strength','force','mass','weight','leverage',
  'pivot','circle','lateral','advance','retreat',
  'heavyweight','bantamweight','featherweight','welterweight','boxer','fighter'
];

function analyzeText(text) {
  var trimmed = text.trim();
  if (!trimmed) return null;
  var words = trimmed.match(/[a-zA-Z']+/g) || [];
  if (words.length === 0) return null;
  var wordCount = words.length;
  var totalChars = words.reduce(function(s,w){return s + w.length;}, 0);
  var avgWordLen = totalChars / wordCount;
  var complexCount = 0, veryComplexCount = 0;
  words.forEach(function(w){
    var lw = w.toLowerCase().replace(/['']/g,'');
    if (lw.length >= 7) complexCount++;
    if (lw.length >= 10) veryComplexCount++;
    if (COMPLEX_WORDS.indexOf(lw) !== -1) { complexCount += 2; veryComplexCount++; }
  });
  var sentences = trimmed.split(/[.!?]+/).filter(function(s){return s.trim().length > 0;});
  var sentenceCount = sentences.length;
  var hasCapital = /^[A-Z]/.test(trimmed);
  var allSentencesCapital = sentences.every(function(s){ return /^[A-Z]/.test(s.trim()); });
  var hasEndPunct = /[.!?]$/.test(trimmed);
  var boxingCount = 0, uniqueBoxing = 0, boxingSeen = {};
  words.forEach(function(w){
    var lw = w.toLowerCase();
    if (BOXING_TERMS.indexOf(lw) !== -1) {
      boxingCount++;
      if (!boxingSeen[lw]) { boxingSeen[lw] = true; uniqueBoxing++; }
    }
  });
  var uniqueWords = {};
  words.forEach(function(w){ uniqueWords[w.toLowerCase()] = true; });
  var diversity = wordCount > 0 ? Object.keys(uniqueWords).length / wordCount : 0;
  var descriptiveCount = 0;
  words.forEach(function(w){
    var lw = w.toLowerCase();
    if (lw.length > 4 && (
      lw.endsWith('ly') || lw.endsWith('ing') || lw.endsWith('ive') ||
      lw.endsWith('ful') || lw.endsWith('ous') || lw.endsWith('less') ||
      lw.endsWith('able') || lw.endsWith('ible') || lw.endsWith('ent') ||
      lw.endsWith('ant') || lw.endsWith('tic')
    )) descriptiveCount++;
  });
  var psychWords = ['feel','felt','thinking','thought','mind','focus','concentrate',
    'determined','confident','fearless','calm','angry','focused','serious','relaxed',
    'ready','prepared','eager','motivated','driven','passion','will','desire',
    'breath','breathe','rhythm','flow','zone','control','discipline','willpower',
    'remember','imagine','visualize','believe','trust','doubt','hope','dream'];
  var psychCount = 0;
  words.forEach(function(w){ if (psychWords.indexOf(w.toLowerCase()) !== -1) psychCount++; });
  var commonErrors = 0;
  for (var i = 0; i < words.length - 1; i++) {
    if (words[i].toLowerCase() === words[i+1].toLowerCase()) commonErrors++;
  }
  for (var k = 0; k < words.length; k++) {
    if (words[k] === 'i' && k > 0) commonErrors++;
  }
  var grammarScore = Math.max(0, 10 - commonErrors * 2);
  if (hasCapital) grammarScore += 3;
  if (hasEndPunct) grammarScore += 2;
  if (allSentencesCapital) grammarScore += 3;
  if (sentenceCount > 1) grammarScore += 2;
  return {
    wordCount: wordCount, avgWordLen: avgWordLen, complexCount: complexCount,
    veryComplexCount: veryComplexCount, sentenceCount: sentenceCount,
    hasCapital: hasCapital, hasEndPunct: hasEndPunct,
    boxingCount: boxingCount, uniqueBoxing: uniqueBoxing, diversity: diversity,
    descriptiveCount: descriptiveCount, psychCount: psychCount, grammarScore: grammarScore,
    uniqueCount: Object.keys(uniqueWords).length, words: words
  };
}

function calculateDamage(analysis) {
  if (!analysis || analysis.wordCount < 2) return 0;
  var wordScore = Math.min(analysis.wordCount / 18, 1) * 20;
  var avgLenScore = Math.min(analysis.avgWordLen / 6.5, 1) * 10;
  var complexScore = Math.min(analysis.complexCount / 4, 1) * 10;
  var veryComplexScore = Math.min(analysis.veryComplexCount / 2, 1) * 5;
  var diversityScore = Math.min(analysis.diversity / 0.85, 1) * 5;
  var complexityScore = avgLenScore + complexScore + veryComplexScore + diversityScore;
  var descScore = Math.min(analysis.descriptiveCount / 3, 1) * 10;
  var psychScore = Math.min(analysis.psychCount / 2, 1) * 7;
  var sentenceScore = Math.min(analysis.sentenceCount * 2, 3);
  var descriptionScore = descScore + psychScore + sentenceScore;
  var boxingScore = Math.min(analysis.boxingCount / 3, 1) * 8;
  var uniqueBoxScore = Math.min(analysis.uniqueBoxing / 2, 1) * 7;
  var specificityScore = boxingScore + uniqueBoxScore;
  var grammarFinal = Math.min(analysis.grammarScore, 15);
  var bonus = 0;
  if (analysis.wordCount >= 20 && analysis.complexCount >= 3 && analysis.descriptiveCount >= 2) bonus += 5;
  if (analysis.psychCount >= 2 && analysis.boxingCount >= 2) bonus += 5;
  return Math.round(Math.min(wordScore + complexityScore + descriptionScore + specificityScore + grammarFinal + bonus, 100));
}

function getAnimationForText(text) {
  var lower = text.toLowerCase();
  var score = {};
  ['jab','cross','hook','uppercut','body','dodge','weave'].forEach(function(a){ score[a] = 0; });
  if (/jab|sharp\s*(quick|fast|rapid|snap)|snap|flick/.test(lower)) score.jab += 3;
  if (/cross|straight\s*(right|left|punch)|rear|back\s*hand/.test(lower)) score.cross += 3;
  if (/hook|swing|round|curve|arc|side\s*punch/.test(lower)) score.hook += 3;
  if (/uppercut|upper|upward|from\s*below|rising/.test(lower)) score.uppercut += 3;
  if (/body|stomach|rib|belly|midsection|liver|abdomen|chest|gut/.test(lower)) score.body += 3;
  if (/dodge|duck|weave|slip|avoid|evade|lean|back|bend|sway/.test(lower)) score.dodge += 3;
  if (/weave|duck|under|low|bob|dip|drop|knees|crouch/.test(lower)) score.weave += 3;
  var best = 'jab', bestScore = 0;
  Object.keys(score).forEach(function(k){ if (score[k] > bestScore) { bestScore = score[k]; best = k; } });
  return best;
}

// ============================================================
// GAME FUNCTIONS
// ============================================================
function submitCommand() {
  if (gameState === 'finished') return;
  var text = elInput.value.trim();
  if (!text) { elFeedback.innerHTML = '<span class="info">Please write a command first!</span>'; elInput.focus(); return; }
  var analysis = analyzeText(text);
  if (!analysis) { elFeedback.innerHTML = '<span class="info">Write at least 2 English words!</span>'; return; }
  var damage = calculateDamage(analysis);
  totalDamage += damage;
  roundCount++;
  var animType = getAnimationForText(text);
  playAnim(animType);
  var animEmoji = {jab:'👊',cross:'✊',hook:'🌀',uppercut:'⬆',body:'🎯',dodge:'💨',weave:'⬇'}[animType] || '👊';
  elFeedback.innerHTML =
    '<div><span class="good">Round ' + roundCount + '</span> &mdash; <span class="dmg">+' + damage + ' DMG</span> <span style="color:#ffaa44;">' + animEmoji + ' ' + animType.toUpperCase() + '</span></div>' +
    '<div style="font-size:10px;color:#555;margin-top:3px;">Words: ' + analysis.wordCount + ' &middot; Complexity: ' + analysis.complexCount + ' &middot; Boxing: ' + analysis.boxingCount + ' &middot; Diversity: ' + (analysis.diversity*100).toFixed(0) + '%' + (analysis.psychCount > 0 ? ' &middot; Mind: ' + analysis.psychCount : '') + '</div>' +
    '<div style="color:#444;font-size:10px;margin-top:2px;font-style:italic;">"' + text.substring(0,70) + (text.length>70?'...':'') + '"</div>';
  showDamagePopup(damage);
  updateStats();
  elInput.value = '';
  elInput.focus();
}

function skipRound() {
  if (gameState === 'finished') return;
  elFeedback.innerHTML = '<span class="info">Skipped. Write something powerful!</span>';
  elInput.value = '';
  elInput.focus();
}

function playAnim(type) {
  currentAnim = type;
  animStartTime = performance.now();
  animDuration = type === 'idle' ? 1000 : 900;
}

function showDamagePopup(dmg) {
  elPopup.textContent = '+' + dmg + ' DMG';
  elPopup.style.opacity = 1;
  elPopup.style.fontSize = (20 + Math.min(dmg, 60) * 0.4) + 'px';
  var st = performance.now();
  function fadeOut(t) {
    var elapsed = t - st;
    if (elapsed < 1200) {
      var pp = elapsed / 1200;
      elPopup.style.opacity = 1 - pp;
      elPopup.style.top = (40 - pp * 40) + 'px';
      requestAnimationFrame(fadeOut);
    } else { elPopup.style.opacity = 0; elPopup.style.top = '40px'; }
  }
  requestAnimationFrame(fadeOut);
}

function updateStats() {
  elRounds.textContent = roundCount;
  elDamage.textContent = totalDamage;
  updateLiveRank();
}

function updateLiveRank() {
  var highest = getHighestDamage();
  if (highest <= 0) { elRank.textContent = '--'; return; }
  elRank.textContent = Math.min(100, (totalDamage / highest) * 100).toFixed(1) + '%';
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function(){
    gameTimer--;
    var m = Math.floor(gameTimer / 60);
    var s = gameTimer % 60;
    elTimer.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    elTimer.classList.toggle('urgent', gameTimer <= 30);
    if (gameTimer <= 0) { clearInterval(timerInterval); timerInterval = null; endGame(); }
  }, 1000);
}

function endGame() {
  gameState = 'finished';
  currentAnim = 'idle';
  elInput.disabled = true;
  var highest = getHighestDamage();
  var finalScore;
  if (highest > 0) {
    finalScore = (totalDamage / highest) * 100;
  } else {
    finalScore = totalDamage > 0 ? 100 : 0;
  }
  saveLeaderboard({ damage: totalDamage, score: finalScore, date: Date.now(), rounds: roundCount });
  renderLeaderboard();
  elOverlayTitle.textContent = 'TIME UP';
  elOverlayScore.textContent = finalScore.toFixed(1);
  elOverlaySub.textContent = '/ 100 FINAL SCORE';
  elOverlayTotalDam.textContent = 'TOTAL DAMAGE: ' + totalDamage + '  |  ROUNDS: ' + roundCount;
  var newHigh = totalDamage > highest && totalDamage > 0;
  elOverlayRank.textContent = newHigh ? 'NEW CHAMPION!' : 'HIGHEST ALL-TIME: ' + highest + ' DMG';
  elOverlayRank.style.color = newHigh ? '#ff6b35' : '#4ecca3';
  elOverlay.classList.add('show');
}

function restartGame() {
  gameState = 'idle';
  gameTimer = 5 * 60;
  totalDamage = 0;
  roundCount = 0;
  sweatDrops = [];
  elInput.disabled = false;
  elInput.value = '';
  elTimer.textContent = '5:00';
  elTimer.classList.remove('urgent');
  elFeedback.innerHTML = '<span style="color:#555;">New session! Write your commands in English.</span>';
  elOverlay.classList.remove('show');
  currentAnim = 'idle';
  animStartTime = performance.now();
  updateStats();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  startTimer();
  elInput.focus();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); submitCommand(); }
});

// ---- INIT ----
renderLeaderboard();
startTimer();
animFrame = requestAnimationFrame(animLoop);
elInput.focus();
</script>
