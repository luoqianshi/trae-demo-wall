:"老子西出函谷关，关令尹喜请求老子留下著作",location:"函谷关",time:"春秋",characters:["laozi"],image_prompt:"ancient chinese mountain pass, old sage writing scroll, misty atmosphere"},{id:"sushi_river",name:"赤壁怀古",description:"苏轼泛舟赤壁，写下千古名篇",background:"苏轼被贬黄州，夜游赤壁，感慨人生",location:"黄州·赤壁",time:"北宋",characters:["sushi"],image_prompt:"ancient chinese river scene, poet in boat at night, moonlit river"},{id:"libai_wine",name:"月下独酌",description:"李白在月下独自饮酒作诗",background:"李白花间独酌，举杯邀明月",location:"长安",time:"唐代",characters:["libai"],image_prompt:"ancient chinese garden at night, poet drinking wine under moon"},{id:"mengzi_king",name:"孟子见梁惠王",description:"孟子向梁惠王阐述仁政之道",background:"孟子游说诸侯，向梁惠王宣扬仁政思想",location:"魏国·大梁",time:"战国",characters:["mengzi"],image_prompt:"ancient chinese palace hall, scholar debating with king"},{id:"zhuangzi_dream",name:"庄周梦蝶",description:"庄子梦中化为蝴蝶，醒来不知是蝶是己",background:"庄子思考人生与梦境的关系",location:"宋国",time:"战国",characters:["zhuangzi"],image_prompt:"dreamlike scene, man sleeping with butterfly flying, abstract philosophical"}],S0=[{id:"confucius_book",name:"论语竹简",icon:"📜",description:"记录孔子言行的珍贵竹简",story:"孔子周游列国时，弟子们记录下他的言行，编成《论语》。这些竹简历经千年，承载着儒家思想的精髓。",character_id:"confucius",scene_id:"confucius_school",rarity:"legendary"},{id:"laozi_ink",name:"道德经墨宝",icon:"✒️",description:"老子亲笔书写的道德经手稿",story:"老子西出函谷关，应关令尹喜之请，写下五千言《道德经》。此墨宝蕴含着道家思想的真谛，字字珠玑。",character_id:"laozi",scene_id:"laozi_tao",rarity:"legendary"},{id:"sushi_wine",name:"东坡酒壶",icon:"🍶",description:"苏轼最爱的酒壶",story:"苏轼被贬黄州期间，常与友人泛舟赤壁，饮酒作诗。此酒壶陪伴他度过许多难忘的夜晚，见证了千古名篇的诞生。",character_id:"sushi",scene_id:"sushi_river",rarity:"rare"},{id:"libai_quill",name:"青莲毛笔",icon:"🖋️",description:"李白写诗用的毛笔",story:"李白一生以诗酒为伴，这支毛笔陪伴他写下无数千古名句。笔锋飘逸，如同他的诗风一般豪放洒脱。",character_id:"libai",scene_id:"libai_wine",rarity:"rare"},{id:"mengzi_tablet",name:"仁政玉圭",icon:"🔮",description:"孟子阐述仁政思想时手持的玉圭",story:"孟子游说诸侯时，常手持此玉圭，向君王阐述仁政之道。玉圭象征着君子的品德和治国的理念。",character_id:"mengzi",scene_id:"mengzi_king",rarity:"epic"},{id:"zhuangzi_dream",name:"蝴蝶玉佩",icon:"🦋",description:"庄子梦中所见蝴蝶的玉佩",story:"庄子梦见自己化为蝴蝶，醒来不知是蝶是己。此玉佩以蝴蝶为形，象征着庄周梦蝶的哲学境界。",character_id:"zhuangzi",scene_id:"zhuangzi_dream",rarity:"epic"},{id:"confucius_chime",name:"编钟",icon:"🔔",description:"孔子教学时使用的编钟",story:"孔子重视礼乐教育，常以编钟演奏古乐，教导弟子们修身养性。钟声悠扬，穿越千年时空。",character_id:"confucius",scene_id:"confucius_school",rarity:"rare"},{id:"laozi_stone",name:"悟道石",icon:"🪨",description:"老子悟道时坐过的石头",story:"老子在山中静坐悟道，这块石头见证了他领悟大道的瞬间。石上仿佛还留有他的体温和智慧。",character_id:"laozi",scene_id:"laozi_tao",rarity:"legendary"}],hv={confucius:[{keywords:["学","习","读书","知识","学问"],response:"学而时习之，不亦说乎？学习之道，贵在持之以恒。吾尝终日不食，终夜不寝，以思，无益，不如学也。你若能日日精进，必有所成。",sources:[{quote_id:"q_lunyu_1",content:"学而时习之，不亦说乎",source:"孔子·论语·学而",credibility:"VERIFIED"},{quote_id:"q_lunyu_2",content:"学而不思则罔，思而不学则殆",source:"孔子·论语·为政",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"朝闻道，夕死可矣。人生之意义，在于追求真理与仁德。吾十五志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩。人生每个阶段皆有修行之要。",sources:[{quote_id:"q_lunyu_3",content:"朝闻道，夕死可矣",source:"孔子·论语·里仁",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友","社交"],response:"有益者三友，损者三友。友直，友谅，友多闻，益矣。友便辟，友善柔，友便佞，损矣。交友当择善而从，近朱者赤，近墨者黑。",sources:[{quote_id:"q_lunyu_4",content:"益者三友，损者三友。友直，友谅，友多闻，益矣",source:"孔子·论语·季氏",credibility:"VERIFIED"}]},{keywords:["治国","政治","管理","领导"],response:"为政以德，譬如北辰，居其所而众星共之。治国者当以德服人，非以力服人。道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。",sources:[{quote_id:"q_lunyu_5",content:"为政以德，譬如北辰，居其所而众星共之",source:"孔子·论语·为政",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤","哭"],response:"君子坦荡荡，小人长戚戚。人生在世，不如意事十之八九。然君子处之泰然，不以物喜，不以己悲。汝当修身养性，以仁德为本，自然心境平和。己所不欲，勿施于人，亦当如是待己。",sources:[{quote_id:"q_lunyu_6",content:"君子坦荡荡，小人长戚戚",source:"孔子·论语·述而",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？快乐源于修身与学问，非外物所能给予。知者乐水，仁者乐山，知者动，仁者静，知者乐，仁者寿。",sources:[{quote_id:"q_lunyu_7",content:"知者乐水，仁者乐山",source:"孔子·论语·雍也",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"吾十有五而志于学，三十而立。人生迷茫时，当立志向学。温故而知新，可以为师矣。多闻阙疑，慎言其余，则寡尤；多见阙殆，慎行其余，则寡悔。",sources:[{quote_id:"q_lunyu_8",content:"温故而知新，可以为师矣",source:"孔子·论语·为政",credibility:"VERIFIED"}]},{keywords:["修身","品德","道德","修养"],response:"吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？修身在于自省，见贤思齐焉，见不贤而内自省也。德之不修，学之不讲，闻义不能徙，不善不能改，是吾忧也。",sources:[{quote_id:"q_lunyu_9",content:"吾日三省吾身",source:"孔子·论语·学而",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"知者不惑，仁者不忧，勇者不惧。压力之来，源于心有所求。若能以仁德为本，以学问为基，自然心定神宁。饭疏食饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。",sources:[{quote_id:"q_lunyu_10",content:"知者不惑，仁者不忧，勇者不惧",source:"孔子·论语·子罕",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃孔丘，字仲尼，春秋鲁国人也。吾一生致力于教育与学问，弟子三千，贤者七十二。吾之学问，以仁为本，以礼为用。学而时习之，不亦说乎？有朋自远方来，不亦乐乎？",sources:[{quote_id:"q_lunyu_11",content:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？",source:"孔子·论语·学而",credibility:"VERIFIED"}]},{keywords:["时间","岁月","光阴","流逝"],response:"逝者如斯夫，不舍昼夜！时间如流水，一去不返。当惜时如金，朝闻道，夕死可矣。岁寒，然后知松柏之后凋也。困难时刻方显品格之坚。",sources:[{quote_id:"q_lunyu_12",content:"逝者如斯夫，不舍昼夜",source:"孔子·论语·子罕",credibility:"VERIFIED"}]}],laozi:[{keywords:["道","道理","真理","规律"],response:"道可道，非常道；名可名，非常名。道者，万物之奥，善人之宝，不善人之所保。道之为物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。",sources:[{quote_id:"q_ddj_1",content:"道可道，非常道；名可名，非常名",source:"老子·道德经·第一章",credibility:"VERIFIED"}]},{keywords:["学","习","知识","读书"],response:"少则得，多则惑。为学日益，为道日损。损之又损，以至于无为。无为而无不为。学问之道，在于返璞归真，不在博闻强识。",sources:[{quote_id:"q_ddj_2",content:"为学日益，为道日损",source:"老子·道德经·第四十八章",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"人法地，地法天，天法道，道法自然。人生之道，在于顺应自然，不妄为，不强求。生之畜之，生而不有，为而不恃，长而不宰，是谓玄德。",sources:[{quote_id:"q_ddj_3",content:"人法地，地法天，天法道，道法自然",source:"老子·道德经·第二十五章",credibility:"VERIFIED"}]},{keywords:["治国","政治","管理","领导"],response:"治大国，若烹小鲜。无为而治，顺其自然。太上，不知有之；其次，亲而誉之；其次，畏之；其次，侮之。最好的治理，是人民感觉不到治理的存在。",sources:[{quote_id:"q_ddj_4",content:"治大国，若烹小鲜",source:"老子·道德经·第六十章",credibility:"VERIFIED"},{quote_id:"q_ddj_5",content:"太上，不知有之",source:"老子·道德经·第十七章",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤"],response:"祸兮福之所倚，福兮祸之所伏。世事无常，悲欢交替。当知无常乃常，不必执着。致虚极，守静笃，万物并作，吾以观复。心静则万事自明。",sources:[{quote_id:"q_ddj_6",content:"祸兮福之所倚，福兮祸之所伏",source:"老子·道德经·第五十八章",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"知足者富。快乐不在于外物多寡，而在于内心知足。祸莫大于不知足，咎莫大于欲得。故知足之足，常足矣。顺其自然，则常乐。",sources:[{quote_id:"q_ddj_7",content:"知足者富",source:"老子·道德经·第三十三章",credibility:"VERIFIED"},{quote_id:"q_ddj_8",content:"祸莫大于不知足",source:"老子·道德经·第四十六章",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"大道泛兮，其可左右。道常无为而无不为。迷茫之时，当静心守拙。不尚贤，使民不争；不贵难得之货，使民不为盗。归于朴素，道自显现。",sources:[{quote_id:"q_ddj_9",content:"道常无为而无不为",source:"老子·道德经·第三十七章",credibility:"VERIFIED"}]},{keywords:["修身","品德","道德","修养"],response:"上德不德，是以有德；下德不失德，是以无德。修身上德，在于自然无为，不刻意求德。含德之厚，比于赤子。归于婴儿之纯真，方为至德。",sources:[{quote_id:"q_ddj_10",content:"上德不德，是以有德",source:"老子·道德经·第三十八章",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"轻则失本，躁则失君。重为轻根，静为躁君。压力源于躁动不安。当守静笃，致虚极，回归本心。水善利万物而不争，处众人之所恶，故几于道。",sources:[{quote_id:"q_ddj_11",content:"重为轻根，静为躁君",source:"老子·道德经·第二十六章",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃李耳，世人称老子。吾悟天地之道，著《道德经》五千言。道可道，非常道。吾之学，在于无为而治，顺其自然。上善若水，水善利万物而不争。",sources:[{quote_id:"q_ddj_12",content:"上善若水，水善利万物而不争",source:"老子·道德经·第八章",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友"],response:"天道无亲，常与善人。交友之道，在于自然相合，不以利合。信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。真友贵在真诚。",sources:[{quote_id:"q_ddj_13",content:"天道无亲，常与善人",source:"老子·道德经·第七十九章",credibility:"VERIFIED"}]},{keywords:["时间","岁月","光阴"],response:"天地所以能长且久者，以其不自生，故能长生。时间之道，在于不争。天长地久，天地所以能长且久者，以其不自生，故能长生。顺道而行，自得长久。",sources:[{quote_id:"q_ddj_14",content:"天长地久",source:"老子·道德经·第七章",credibility:"VERIFIED"}]}],mengzi:[{keywords:["学","习","读书","知识"],response:"学问之道无他，求其放心而已矣。学不厌，教不倦。君子之所以教者五：有如时雨化之者，有成德者，有达财者，有答问者，有私淑艾者。学贵自得，非外铄我也。",sources:[{quote_id:"q_mengzi_1",content:"学问之道无他，求其放心而已矣",source:"孟子·孟子·告子上",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"穷则独善其身，达则兼善天下。人生之意义，在于修身以待时。生于忧患，死于安乐。天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身。",sources:[{quote_id:"q_mengzi_2",content:"穷则独善其身，达则兼善天下",source:"孟子·孟子·尽心上",credibility:"VERIFIED"},{quote_id:"q_mengzi_3",content:"生于忧患，死于安乐",source:"孟子·孟子·告子下",credibility:"VERIFIED"}]},{keywords:["治国","政治","管理","领导"],response:"天时不如地利，地利不如人和。治道以仁政为本。民为贵，社稷次之，君为轻。得道者多助，失道者寡助。以力服人者，非心服也；以德服人者，中心悦而诚服也。",sources:[{quote_id:"q_mengzi_4",content:"天时不如地利，地利不如人和",source:"孟子·孟子·公孙丑下",credibility:"VERIFIED"},{quote_id:"q_mengzi_5",content:"民为贵，社稷次之，君为轻",source:"孟子·孟子·尽心下",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤"],response:"天将降大任于斯人也，必先苦其心志，劳其筋骨。困境乃磨炼品格之石。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。",sources:[{quote_id:"q_mengzi_6",content:"天将降大任于斯人也，必先苦其心志",source:"孟子·孟子·告子下",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"君子有三乐，而王天下不与存焉。父母俱存，兄弟无故，一乐也；仰不愧于天，俯不怍于人，二乐也；得天下英才而教育之，三乐也。君子有三乐，而王天下不与存焉。",sources:[{quote_id:"q_mengzi_7",content:"君子有三乐",source:"孟子·孟子·尽心上",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"虽有智慧，不如乘势；虽有镃基，不如待时。迷茫之时，当养浩然之气。吾善养吾浩然之气。其为气也，至大至刚，以直养而无害，则塞于天地之间。",sources:[{quote_id:"q_mengzi_8",content:"吾善养吾浩然之气",source:"孟子·孟子·公孙丑上",credibility:"VERIFIED"}]},{keywords:["修身","品德","道德","修养"],response:"吾善养吾浩然之气。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。修身在于养气，养气在于集义。",sources:[{quote_id:"q_mengzi_9",content:"吾善养吾浩然之气",source:"孟子·孟子·公孙丑上",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"天将降大任于斯人也，必先苦其心志，劳其筋骨。压力乃天意考验，当以义处之。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。心中有义，则无畏于压力。",sources:[{quote_id:"q_mengzi_10",content:"舍生取义",source:"孟子·孟子·告子上",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃孟轲，邹国人也。吾受业于子思之门人，继承孔子之道。吾主张性善论，倡仁政义战。天时不如地利，地利不如人和。民为贵，社稷次之，君为轻。",sources:[{quote_id:"q_mengzi_11",content:"民为贵，社稷次之，君为轻",source:"孟子·孟子·尽心下",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友"],response:"一乡之善士斯友一乡之善士，天下之善士斯友天下之善士。交友当以德为先，以义为合。友也者，友其德也，不可以有挟也。",sources:[{quote_id:"q_mengzi_12",content:"友也者，友其德也",source:"孟子·孟子·万章下",credibility:"VERIFIED"}]},{keywords:["人性","善","恶","本性"],response:"人性之善也，犹水之就下也。人无有不善，水无有不下。恻隐之心，人皆有之；羞恶之心，人皆有之；恭敬之心，人皆有之；是非之心，人皆有之。",sources:[{quote_id:"q_mengzi_13",content:"人性之善也，犹水之就下也",source:"孟子·孟子·告子上",credibility:"VERIFIED"}]}],zhuangzi:[{keywords:["学","习","读书","知识"],response:"吾生也有涯，而知也无涯。以有涯随无涯，殆已！已而为知者，殆而已矣！学习之道，不在博闻强识，而在领悟大道。为学日益，为道日损。",sources:[{quote_id:"q_zhuangzi_1",content:"吾生也有涯，而知也无涯",source:"庄子·庄子·养生主",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"天地与我并生，而万物与我为一。人生之意义，在于与天地合一，不执着于形骸。方生方死，方死方生；方可方不可，方不可方可。",sources:[{quote_id:"q_zhuangzi_2",content:"天地与我并生，而万物与我为一",source:"庄子·庄子·齐物论",credibility:"VERIFIED"}]},{keywords:["自由","束缚","约束","逍遥"],response:"逍遥游者，无所待而游于无穷也。鲲化为鹏，扶摇直上九万里。至人无己，神人无功，圣人无名。真正的自由，是不依赖外物，与天地精神相往来。",sources:[{quote_id:"q_zhuangzi_3",content:"至人无己，神人无功，圣人无名",source:"庄子·庄子·逍遥游",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤"],response:"死生，命也，其有夜旦之常，天也。人之有所不得与，皆物之情也。彼且奚不及也？至人神矣！大泽焚而不能热，河汉冱而不能寒，疾雷破山、风振海而不能惊。",sources:[{quote_id:"q_zhuangzi_4",content:"死生，命也",source:"庄子·庄子·大宗师",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"至乐无乐，至誉无誉。世俗之乐，非真乐也。天无为以之清，地无为以之宁，故两无为相合，万物皆化。真正快乐在于无为，与自然合一。",sources:[{quote_id:"q_zhuangzi_5",content:"至乐无乐，至誉无誉",source:"庄子·庄子·至乐",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"庄周梦为胡蝶，栩栩然胡蝶也。自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？迷茫源于执着此彼之分，当齐物我，一是非。",sources:[{quote_id:"q_zhuangzi_6",content:"庄周梦蝶",source:"庄子·庄子·齐物论",credibility:"VERIFIED"}]},{keywords:["梦","梦境","现实"],response:"昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？此之谓物化。梦与现实，孰真孰幻？",sources:[{quote_id:"q_zhuangzi_7",content:"不知周之梦为胡蝶与，胡蝶之梦为周与",source:"庄子·庄子·齐物论",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"形固可使如槁木，而心固可使如死灰乎？人之所以受压，在于心有所系。若能心如止水，万物毕照，则无忧无虑。虚室生白，吉祥止止。心虚空则光明自生。",sources:[{quote_id:"q_zhuangzi_8",content:"虚室生白，吉祥止止",source:"庄子·庄子·人间世",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃庄周，宋国蒙人也，尝为漆园吏。吾著书十余万言，以寓言说理。天地与我并生，而万物与我为一。吾之学，在于逍遥无为，齐物我，一是非。",sources:[{quote_id:"q_zhuangzi_9",content:"天地与我并生，而万物与我为一",source:"庄子·庄子·齐物论",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友"],response:"君子之交淡若水，小人之交甘若醴。君子淡以亲，小人甘以绝。真友不拘形迹，相视而笑，莫逆于心。以利合者，利尽则散；以天合者，天长地久。",sources:[{quote_id:"q_zhuangzi_10",content:"君子之交淡若水，小人之交甘若醴",source:"庄子·庄子·山木",credibility:"VERIFIED"}]},{keywords:["死","死亡","生","生命"],response:"庄子妻死，惠子吊之，庄子则方箕踞鼓盆而歌。察其始而本无生，非徒无生也而本无形，非徒无形也而本无气。死生如昼夜之交替，何足悲哉？",sources:[{quote_id:"q_zhuangzi_11",content:"鼓盆而歌",source:"庄子·庄子·至乐",credibility:"VERIFIED"}]},{keywords:["治国","政治","管理"],response:"闻在宥天下，不闻治天下也。治天下者，过为则乱。无为之治，顺物自然，则天下安。汝徒处无为，而物自化。",sources:[{quote_id:"q_zhuangzi_12",content:"闻在宥天下，不闻治天下也",source:"庄子·庄子·在宥",credibility:"VERIFIED"}]}],sushi:[{keywords:["学","习","读书","知识"],response:"粗缯大布裹生涯，腹有诗书气自华。读书破万卷，下笔如有神。博观而约取，厚积而薄发。学习之道，贵在博览群书，融会贯通。",sources:[{quote_id:"q_sushi_1",content:"腹有诗书气自华",source:"苏轼·和董传留别",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"人生如梦，一尊还酹江月。人生之意义，在于豁达处之。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。然知不可乎骤得，托遗响于悲风。",sources:[{quote_id:"q_sushi_2",content:"人生如梦，一尊还酹江月",source:"苏轼·念奴娇·赤壁怀古",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤"],response:"人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。人生在世，不如意事常八九。然豁达者以诗酒自适，不沉溺于悲伤。一蓑烟雨任平生，也无风雨也无晴。",sources:[{quote_id:"q_sushi_3",content:"人有悲欢离合，月有阴晴圆缺",source:"苏轼·水调歌头·明月几时有",credibility:"VERIFIED"},{quote_id:"q_sushi_4",content:"一蓑烟雨任平生",source:"苏轼·定风波",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。快乐不在于外物，而在于心境。回首向来萧瑟处，归去，也无风雨也无晴。心中有定，则万物皆乐。",sources:[{quote_id:"q_sushi_5",content:"一蓑烟雨任平生",source:"苏轼·定风波",credibility:"VERIFIED"},{quote_id:"q_sushi_6",content:"也无风雨也无晴",source:"苏轼·定风波",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"不识庐山真面目，只缘身在此山中。迷茫之时，当跳出局限，以更广阔的视角看待问题。横看成岭侧成峰，远近高低各不同。多角度思考，自能拨云见日。",sources:[{quote_id:"q_sushi_7",content:"不识庐山真面目，只缘身在此山中",source:"苏轼·题西林壁",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。压力之来，当以豁达处之。人生到处知何似，应似飞鸿踏雪泥。顺其自然，不必焦虑。",sources:[{quote_id:"q_sushi_8",content:"莫听穿林打叶声，何妨吟啸且徐行",source:"苏轼·定风波",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃苏轼，字子瞻，号东坡居士。眉山人氏，与父弟并称三苏。吾一生仕途坎坷，屡遭贬谪，然豁达处之。诗酒自适，随遇而安。人生如梦，一尊还酹江月。",sources:[{quote_id:"q_sushi_9",content:"人生如梦",source:"苏轼·念奴娇·赤壁怀古",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友"],response:"但愿人长久，千里共婵娟。虽天各一方，真挚友情不因距离而减。吾与张怀民夜游承天寺，何夜无月？何处无竹柏？但少闲人如吾两人者耳。知己贵在闲适相赏。",sources:[{quote_id:"q_sushi_10",content:"但愿人长久，千里共婵娟",source:"苏轼·水调歌头",credibility:"VERIFIED"}]},{keywords:["诗","词","文学","写作"],response:"文章本天成，妙手偶得之。吾以为，辞达而已矣。写诗作文，当抒真性情，不拘格套。如行云流水，初无定质，但常行于所当行，常止于不可不止。",sources:[{quote_id:"q_sushi_11",content:"如行云流水",source:"苏轼·答谢民师书",credibility:"VERIFIED"}]},{keywords:["吃","美食","食物"],response:"慢著火，少著水，火候足时他自美。吾贬黄州时，创东坡肉以自适。人间有味是清欢。美食之道，在于用心品味，不在于山珍海味。",sources:[{quote_id:"q_sushi_12",content:"人间有味是清欢",source:"苏轼·浣溪沙",credibility:"VERIFIED"}]},{keywords:["时间","岁月","光阴"],response:"大江东去，浪淘尽，千古风流人物。时间如江水东流，一去不返。然千古文章，可流传后世。人生短暂，当惜时作有意义之事，不负韶华。",sources:[{quote_id:"q_sushi_13",content:"大江东去，浪淘尽",source:"苏轼·念奴娇·赤壁怀古",credibility:"VERIFIED"}]}],libai:[{keywords:["学","习","读书","知识"],response:"长风破浪会有时，直挂云帆济沧海！学习当有大志，不可碌碌无为。吾虽爱饮酒，亦知读书之要。只要功夫深，铁杵磨成针。读书破万卷，方可下笔如有神。",sources:[{quote_id:"q_libai_1",content:"长风破浪会有时，直挂云帆济沧海",source:"李白·行路难",credibility:"VERIFIED"}]},{keywords:["人生","意义","活着","生命"],response:"天生我材必有用！千金散尽还复来。人生在世，当尽情尽性。人生得意须尽欢，莫使金樽空对月。然亦不可虚度，当有所作为，方不负此生。",sources:[{quote_id:"q_libai_2",content:"天生我材必有用",source:"李白·将进酒",credibility:"VERIFIED"},{quote_id:"q_libai_3",content:"人生得意须尽欢",source:"李白·将进酒",credibility:"VERIFIED"}]},{keywords:["难过","伤心","失望","沮丧","痛苦","悲伤"],response:"抽刀断水水更流，举杯消愁愁更愁。人生在世不称意，明朝散发弄扁舟。愁绪如流水，不可断绝。当以豪放处之，饮酒赋诗，不沉溺于悲。长风破浪会有时，终有出路。",sources:[{quote_id:"q_libai_4",content:"抽刀断水水更流，举杯消愁愁更愁",source:"李白·宣州谢朓楼饯别校书叔云",credibility:"VERIFIED"}]},{keywords:["开心","快乐","高兴","幸福"],response:"人生得意须尽欢，莫使金樽空对月！天生我材必有用，千金散尽还复来。快乐当尽情享受，与友共饮美酒，吟诗作赋。五花马，千金裘，呼儿将出换美酒，与尔同销万古愁！",sources:[{quote_id:"q_libai_5",content:"人生得意须尽欢",source:"李白·将进酒",credibility:"VERIFIED"}]},{keywords:["迷茫","困惑","不知道","方向"],response:"行路难！行路难！多歧路，今安在？长风破浪会有时，直挂云帆济沧海。迷茫乃人生必经，然当坚信前路。大鹏一日同风起，扶摇直上九万里。志存高远，终能破雾前行。",sources:[{quote_id:"q_libai_6",content:"长风破浪会有时，直挂云帆济沧海",source:"李白·行路难",credibility:"VERIFIED"}]},{keywords:["压力","累","疲惫","焦虑"],response:"安能摧眉折腰事权贵，使我不得开心颜！压力多来自委曲求全。当学吾之豪放，饮酒赋诗，不拘小节。钟鼓馔玉不足贵，但愿长醉不复醒。放下执念，则一身轻松。",sources:[{quote_id:"q_libai_7",content:"安能摧眉折腰事权贵",source:"李白·梦游天姥吟留别",credibility:"VERIFIED"}]},{keywords:["你好","您好","是谁","介绍"],response:"吾乃李白，字太白，号青莲居士。世人称吾诗仙。吾爱饮酒赋诗，游历名山大川。吾诗风豪放飘逸，想象丰富。天生我材必有用！举杯邀明月，对影成三人。",sources:[{quote_id:"q_libai_8",content:"天生我材必有用",source:"李白·将进酒",credibility:"VERIFIED"}]},{keywords:["友","朋友","交友"],response:"桃花潭水深千尺，不及汪伦送我情。真挚友情，深似潭水。吾与杜甫、孟浩然皆为挚友。人生得一知己，足矣。当与友共饮美酒，同赏明月，不亦乐乎？",sources:[{quote_id:"q_libai_9",content:"桃花潭水深千尺，不及汪伦送我情",source:"李白·赠汪伦",credibility:"VERIFIED"}]},{keywords:["酒","饮","醉"],response:"花间一壶酒，独酌无相亲。举杯邀明月，对影成三人。饮酒之乐，在于超脱尘俗，与天地精神往来。但愿长醉不复醒，与尔同销万古愁！美酒配好诗，人生之至乐也。",sources:[{quote_id:"q_libai_10",content:"举杯邀明月，对影成三人",source:"李白·月下独酌",credibility:"VERIFIED"}]},{keywords:["月","明月","月亮"],response:"举头望明月，低头思故乡。明月寄相思，亦寄情怀。举杯邀明月，对影成三人。月者，高洁之物，可望而不可即，如人生之理想。今人不见古时月，今月曾经照古人。",sources:[{quote_id:"q_libai_11",content:"举头望明月，低头思故乡",source:"李白·静夜思",credibility:"VERIFIED"},{quote_id:"q_libai_12",content:"举杯邀明月",source:"李白·月下独酌",credibility:"VERIFIED"}]},{keywords:["诗","写诗","创作"],response:"吾诗风豪放飘逸，想象丰富，不拘格律。清水出芙蓉，天然去雕饰。好诗当发自真情，不刻意雕琢。飞流直下三千尺，疑是银河落九天。想象力乃诗人之翼。",sources:[{quote_id:"q_libai_13",content:"清水出芙蓉，天然去雕饰",source:"李白·经乱离后天恩流夜郎忆旧游书怀",credibility:"VERIFIED"}]},{keywords:["自由","逍遥","束缚"],response:"大鹏一日同风起，扶摇直上九万里！吾追求自由，不拘世俗。安能摧眉折腰事权贵，使我不得开心颜！人生当如大鹏展翅，翱翔九天，不受樊笼之困。",sources:[{quote_id:"q_libai_14",content:"大鹏一日同风起",source:"李白·上李邕",credibility:"VERIFIED"}]}]},ah={confucius:{response:"三人行，必有我师焉。择其善者而从之，其不善者而改之。汝之所问，吾当思之。学而不思则罔，思而不学则殆。当勤学深思，方能有所得。",sources:[{quote_id:"q_lunyu_default",content:"三人行，必有我师焉",source:"孔子·论语·述而",credibility:"VERIFIED"}]},laozi:{response:"道可道，非常道。万物归焉而不知主。汝之所问，道在其中。上善若水，水善利万物而不争。处众人之所恶，故几于道矣。",sources:[{quote_id:"q_ddj_default",content:"上善若水",source:"老子·道德经·第八章",credibility:"VERIFIED"}]},mengzi:{response:"穷则独善其身，达则兼善天下。汝之所问，当以义处之。吾善养吾浩然之气，其为气也，至大至刚。心中有义，则万事可解。",sources:[{quote_id:"q_mengzi_default",content:"穷则独善其身，达则兼善天下",source:"孟子·孟子·尽心上",credibility:"VERIFIED"}]},zhuangzi:{response:"天地与我并生，而万物与我为一。汝之所问，不必执着。至人无己，神人无功，圣人无名。虚室生白，吉祥止止。心虚空则道自至。",sources:[{quote_id:"q_zhuangzi_default",content:"天地与我并生",source:"庄子·庄子·齐物论",credibility:"VERIFIED"}]},sushi:{response:"人生如梦，一尊还酹江月。汝之所问，当豁达处之。一蓑烟雨任平生，也无风雨也无晴。随遇而安，不必过于执着。",sources:[{quote_id:"q_sushi_default",content:"一蓑烟雨任平生",source:"苏轼·定风波",credibility:"VERIFIED"}]},libai:{response:"天生我材必有用！汝之所问，当以豪放处之。长风破浪会有时，直挂云帆济沧海。人生在世，当尽情尽性，不负此生！",sources:[{quote_id:"q_libai_default",content:"天生我材必有用",source:"李白·将进酒",credibility:"VERIFIED"}]}};function b0(n){return new Promise(r=>setTimeout(r,n))}async function mv(n){await b0(600+Math.random()*400);const r=n.character_id,s=n.message.toLowerCase(),a=hv[r]||[];for(const u of a)for(const p of u.keywords)if(s.includes(p.toLowerCase()))return{response:u.response,character_id:r,sources:u.sources};const l=ah[r]||ah.confucius;return{response:l.response,character_id:r,sources:l.sources}}const oh={"AI 人工智能":{analysis:"观今日AI之发展，令人叹为观止。然技术之进，亦当辅以德行之修。工具之利，在乎用之者之心。若以仁心用之，则造福万民；若以私欲用之，则遗患无穷。当以古人之智慧，导今日之技术，使科技与人文并进，方为正道。",references:[{event:"墨子造木鸢",time:"春秋战国",lesson:"墨子能造飞鸢三日不落，然以为无用之事。技术当以实用利民为本。"},{event:"诸葛亮木牛流马",time:"三国",lesson:"巧思妙术当用于正途，造福百姓。"}],quotes:[{quote_id:"q_tech_1",content:"工欲善其事，必先利其器",source:"孔子·论语·卫灵公",credibility:"VERIFIED"},{quote_id:"q_tech_2",content:"形而上者谓之道，形而下者谓之器",source:"周易·系辞上",credibility:"VERIFIED"}]},教育:{analysis:"教育乃立国之本，培养人才之道。古人云：因材施教，有教无类。今之教育，虽普及广泛，然亦当注重品德修养，不可仅重分数。学而不思则罔，思而不学则殆。教育之要，在于启迪智慧，涵养品格，非填鸭灌输可比。",references:[{event:"孔子杏坛讲学",time:"春秋",lesson:"有教无类，因材施教，开创私学先河。"},{event:"孟子母子三迁",time:"战国",lesson:"环境影响教育，当择善而处。"}],quotes:[{quote_id:"q_edu_1",content:"学而时习之，不亦说乎",source:"孔子·论语·学而",credibility:"VERIFIED"},{quote_id:"q_edu_2",content:"教学相长",source:"礼记·学记",credibility:"VERIFIED"}]},环保:{analysis:"天地万物，本为一体。古人云：斧斤以时入山林，材木不可胜用也。今之环境问题，多因人欲过度，不顾自然之理。当回归天人合一之道，尊重自然规律，方能长久发展。万物并育而不相害，道并行而不相悖。",references:[{event:"孟子论可持续",time:"战国",lesson:"数罟不入洿池，鱼鳖不可胜食也；斧斤以时入山林，材木不可胜用也。"},{event:"老子道法自然",time:"春秋",lesson:"人法地，地法天，天法道，道法自然。"}],quotes:[{quote_id:"q_env_1",content:"斧斤以时入山林",source:"孟子·孟子·梁惠王上",credibility:"VERIFIED"},{quote_id:"q_env_2",content:"人法地，地法天，天法道，道法自然",source:"老子·道德经·第二十五章",credibility:"VERIFIED"}]},内卷:{analysis:"今之所谓内卷，古人亦有相似之叹。然人生之价值，不在于与他人相较，而在于修身养性。穷则独善其身，达则兼善天下。当知足者富，不与人争。各因其性，各遂其才，不必强同一律。逍遥游者，自适其适而已。",references:[{event:"庄子齐物论",time:"战国",lesson:"物无非彼，物无非是。不必以己度人，强同一律。"},{event:"老子知足",time:"春秋",lesson:"知足者富，强行者有志。"}],quotes:[{quote_id:"q_inv_1",content:"知足者富",source:"老子·道德经·第三十三章",credibility:"VERIFIED"},{quote_id:"q_inv_2",content:"穷则独善其身，达则兼善天下",source:"孟子·孟子·尽心上",credibility:"VERIFIED"}]}},gv={analysis:"观今日之事，当以史为鉴。古人云：以铜为镜，可以正衣冠；以史为镜，可以知兴替。今日之热点，多可在历史中找到相似之影。当以古人之智慧，参悟今日之现象，方能洞察本质，不惑于表象。",references:[{event:"唐太宗以史为鉴",time:"唐代",lesson:"以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。"}],quotes:[{quote_id:"q_hist_1",content:"以史为镜，可以知兴替",source:"唐太宗·贞观政要",credibility:"VERIFIED"},{quote_id:"q_hist_2",content:"前事不忘，后事之师",source:"战国策·赵策一",credibility:"VERIFIED"}]};async function Cv(n){await b0(800+Math.random()*500);const r=n.topic,s=n.character_id||"confucius",a={confucius:"孔子",laozi:"老子",mengzi:"孟子",zhuangzi:"庄子",sushi:"苏轼",libai:"李白"};let l=gv;for(const p of Object.keys(oh))if(r.includes(p)||p.includes(r)){l=oh[p];break}const u=a[s]||"古人";return{analysis:`【${u}之视角】

.trae-badge {
  display: inline-flex;
  align-items: center;

  cursor: pointer;
  box-sizing: border-box;
  border-radius: 6px;
  position: fixed;
  padding: 8px 8px 8px 10px;
  height: 28px;
  width: 130px;
  z-index: 9999;
}

.trae-badge:hover.trae-badge--light {
  background-color: #EDEFF2;
}

.trae-badge:hover.trae-badge--dark {
  background-color: #2A2D31;
}

.trae-badge-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.trae-badge-logo {
  flex-shrink: 0;
}

.trae-badge-share {
  flex-shrink: 0;
  color: rgba(78, 82, 87, 1);
}

.trae-badge:hover.trae-badge--light .trae-badge-share {
  color: rgba(38, 41, 44, 1);
}

.trae-badge:hover.trae-badge--dark .trae-badge-share {
  color: #D1D3DB;
}

.trae-badge-cancel {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 16px;
  height: 16px;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000000;
}

.trae-badge:hover .trae-badge-cancel {
  opacity: 1 !important;
  visibility: visible !important;
}

@media (hover: none) and (pointer: coarse) {
  .trae-badge-cancel {

}

}

.trae-badge--top-right { top: 20px; right: 20px; }

          // 主题选择函数 (复用自 theme.ts)
          function getLuminance(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          function parseColor(color) {
            const rgbaMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
            if (rgbaMatch) {
              return [parseInt(rgbaMatch[1]), parseInt(rgbaMatch[2]), parseInt(rgbaMatch[3])];
            }
            
            const hexMatch = color.match(/^#([0-9a-f]{6})$/i);
            if (hexMatch) {
              const hex = hexMatch[1];
              return [
                parseInt(hex.substr(0, 2), 16),
                parseInt(hex.substr(2, 2), 16),
                parseInt(hex.substr(4, 2), 16)
              ];
            }
            
            const hexShortMatch = color.match(/^#([0-9a-f]{3})$/i);
            if (hexShortMatch) {
              const hex = hexShortMatch[1];
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16)
              ];
            }
            
            return null;
          }
          
          function detectBackgroundColor(element) {
            let targetElement;
            
            if (typeof element === 'string') {
              const found = document.querySelector(element);
              console.debug('Target element found:', found);
              if (!found) return 'rgb(255, 255, 255)';
              targetElement = found;
            } else if (element) {
              targetElement = element;
            } else {
              targetElement = document.body;
            }
            
            let currentElement = targetElement;
            
            while (currentElement && currentElement !== document.documentElement) {
              const computedStyle = window.getComputedStyle(currentElement);
              const backgroundColor = computedStyle.backgroundColor;
              
              console.debug('Checking element:', currentElement.tagName, currentElement.id, currentElement.className);
              console.debug('Background color:', backgroundColor);
              
              if (backgroundColor && backgroundColor !== 'rgba(0, 0, 0, 0)' && backgroundColor !== 'transparent') {
                console.debug('Found background color:', backgroundColor, 'on element:', currentElement);
                return backgroundColor;
              }
              
              currentElement = currentElement.parentElement;
            }
            
            const bodyStyle = window.getComputedStyle(document.body);
            const bodyBackground = bodyStyle.backgroundColor;
            console.debug('Body background:', bodyBackground);
            if (bodyBackground && bodyBackground !== 'rgba(0, 0, 0, 0)' && bodyBackground !== 'transparent') {
              return bodyBackground;
            }
            
            const htmlStyle = window.getComputedStyle(document.documentElement);
            const htmlBackground = htmlStyle.backgroundColor;
            console.debug('HTML background:', htmlBackground);
            if (htmlBackground && htmlBackground !== 'rgba(0, 0, 0, 0)' && htmlBackground !== 'transparent') {
              return htmlBackground;
            }
            
            console.debug('No background found, returning default white');
            return 'rgb(255, 255, 255)';
          }
          
          function autoSelectTheme(container) {
            const backgroundColor = detectBackgroundColor(container);
            const rgb = parseColor(backgroundColor);
            
            console.debug('TRAE Badge Plugin - Background detection:', {
              container,
              backgroundColor,
              rgb
            });
            
            if (!rgb) {
              console.debug('TRAE Badge Plugin - No RGB found, using dark theme');
              return 'dark';
            }
            
            const [r, g, b] = rgb;
            const luminance = getLuminance(r, g, b);
            const selectedTheme = luminance > 128 ? 'dark' : 'light';
            
            console.debug('TRAE Badge Plugin - Theme selection:', {
              luminance,
              selectedTheme,
              reason: luminance > 128 ? 'Light background -> Dark badge' : 'Dark background -> Light badge'
            });
            
            return selectedTheme;
          }

              // 创建 Badge 函数
              function createBadge() {
                // 移除已存在的 badge
                const existingBadge = document.getElementById('trae-badge-plugin');
                if (existingBadge) {
                  existingBadge.remove();
                }
                
                // 确定主题
                let variant = 'dark';
                if (true) {
                  variant = autoSelectTheme('#root');
                }
                
                const isDarkBackground = variant === 'dark';
                const logoType = isDarkBackground ? 'light' : 'dark';
                const cancelIcon = isDarkBackground ? cancelLight : cancelDark;
                
                const badge = document.createElement('div');
                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#root');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();
