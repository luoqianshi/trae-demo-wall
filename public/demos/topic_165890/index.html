<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>深度规划人生</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafafa;
      --bg-elevated: #ffffff;
      --bg-hover: #f5f5f5;
      --bg-active: #ebebeb;
      --border: #e5e5e5;
      --border-strong: #d4d4d4;
      --text: #171717;
      --text-secondary: #525252;
      --text-muted: #a3a3a3;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --warning: #ea580c;
      --warning-soft: #fff7ed;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --purple: #9333ea;
      --purple-soft: #faf5ff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
      --radius: 6px;
      --radius-lg: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      overflow: hidden;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    ul, ol { list-style: none; }
    [x-cloak] { display: none !important; }
    ::selection { background: var(--accent-soft); }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Top Bar */
    .topbar {
      height: 44px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 11px;
    }
    .app-name { font-weight: 600; font-size: 13px; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 10px;
      width: 240px;
      transition: all .15s;
    }
    .search-box:focus-within { border-color: var(--accent); background: white; box-shadow: 0 0 0 2px var(--accent-soft); }
    .search-box svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .search-box input { border: none; background: none; outline: none; width: 100%; font-size: 12px; }
    .search-box input::placeholder { color: var(--text-muted); }
    .topbar-right { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: var(--text-secondary);
      transition: all .1s;
      position: relative;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-badge {
      position: absolute;
      top: 4px; right: 4px;
      min-width: 14px; height: 14px;
      background: var(--danger);
      color: white;
      font-size: 9px;
      font-weight: 700;
      border-radius: 7px;
      display: grid;
      place-items: center;
      padding: 0 3px;
    }
    .avatar-sm {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .avatar-sm:hover { box-shadow: 0 0 0 2px var(--accent-soft); }

    /* Main Layout */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .side-section { padding: 8px; }
    .side-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      padding: 6px 8px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .side-label .add-link {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
    }
    .side-label .add-link:hover { background: var(--bg-hover); color: var(--text); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 8px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all .08s;
      text-align: left;
      margin-bottom: 1px;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text); }
    .nav-item.active { background: var(--bg-active); color: var(--text); font-weight: 600; }
    .nav-item .nav-icon { width: 16px; display: flex; justify-content: center; font-size: 14px; line-height: 1; }
    .nav-item .nav-text { flex: 1; }
    .nav-count {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      min-width: 18px;
      text-align: center;
    }
    .nav-item.active .nav-count { color: var(--text-secondary); }

    .sidebar-divider { height: 1px; background: var(--border); margin: 4px 8px; }

    .goal-mini {
      margin: 8px;
      padding: 10px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }
    .goal-mini-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .goal-mini-title { font-size: 11px; font-weight: 600; margin: 3px 0 6px; line-height: 1.3; }
    .goal-mini-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .goal-mini-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .goal-mini-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .content-header {
      padding: 20px 24px 0;
      flex-shrink: 0;
    }
    .content-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .content-title { font-size: 18px; font-weight: 700; }
    .content-actions { display: flex; gap: 6px; align-items: center; }
    .btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      transition: all .1s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-default {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-default:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .btn-icon {
      width: 28px; height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .btn-icon svg { width: 14px; height: 14px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 0;
      margin-right: 24px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all .1s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

    /* Content Body */
    .content-body {
      padding: 0 24px 24px;
      flex: 1;
    }

    /* Focus Task */
    .focus-banner {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .focus-check {
      width: 20px; height: 20px;
      border: 2px solid var(--border-strong);
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .15s;
    }
    .focus-check:hover { border-color: var(--accent); }
    .focus-check.done { background: var(--success); border-color: var(--success); }
    .focus-check.done::after { content: "✓"; color: white; font-size: 11px; font-weight: 700; }
    .focus-info { flex: 1; }
    .focus-label { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
    .focus-text { font-size: 14px; font-weight: 600; margin: 2px 0; }
    .focus-banner.done .focus-text { text-decoration: line-through; color: var(--text-muted); }
    .focus-banner.done .focus-label { color: var(--success); }
    .focus-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text-muted); }
    .focus-meta-tag {
      padding: 1px 6px;
      background: var(--bg);
      border-radius: 3px;
    }
    .focus-timer {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .focus-start-btn {
      padding: 6px 14px;
      background: var(--accent);
      color: white;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      transition: all .1s;
    }
    .focus-start-btn:hover { background: var(--accent-hover); }

    /* Two Column Layout */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
    }
    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    /* Panel */
    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title { font-size: 12px; font-weight: 600; }
    .panel-actions { display: flex; gap: 4px; }
    .panel-body { padding: 8px 14px 12px; }

    /* Quick Add */
    .quick-add {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .quick-add-form {
      display: flex;
      gap: 6px;
    }
    .quick-add input {
      flex: 1;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      outline: none;
      font-size: 12px;
      transition: all .15s;
    }
    .quick-add input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 2px var(--accent-soft); }
    .quick-add select {
      height: 30px;
      padding: 0 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elevated);
      font-size: 11px;
      outline: none;
      color: var(--text-secondary);
    }
    .quick-add button {
      height: 30px;
      padding: 0 12px;
      background: var(--accent);
      color: white;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      transition: all .1s;
    }
    .quick-add button:hover { background: var(--accent-hover); }

    /* Task List */
    .task-list { padding: 4px 6px; }
    .task {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius);
      transition: all .08s;
      group: true;
    }
    .task:hover { background: var(--bg-hover); }
    .task.done { opacity: .5; }
    .task.done .task-title { text-decoration: line-through; }
    .task-check {
      width: 16px; height: 16px;
      border: 1.5px solid var(--border-strong);
      border-radius: 3px;
      flex-shrink: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .1s;
    }
    .task-check:hover { border-color: var(--accent); }
    .task-check.checked { background: var(--success); border-color: var(--success); }
    .task-check.checked::after { content: "✓"; color: white; font-size: 10px; font-weight: 700; }
    .task-title { flex: 1; font-size: 12px; }
    .task-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
    }
    .tag-work { background: #dbeafe; color: #1d4ed8; }
    .tag-comm { background: #fef3c7; color: #b45309; }
    .tag-daily { background: #dcfce7; color: #15803d; }
    .tag-learn { background: #f3e8ff; color: #7e22ce; }
    .tag-idea { background: #fce7f3; color: #be185d; }
    .task-time { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .task-del {
      width: 20px; height: 20px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      opacity: 0;
      transition: all .08s;
      font-size: 14px;
    }
    .task:hover .task-del { opacity: 1; }
    .task-del:hover { background: var(--danger-soft); color: var(--danger); }

    /* Schedule */
    .schedule { padding: 4px 0; }
    .sched-item {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      padding: 6px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .08s;
    }
    .sched-item:hover { background: var(--bg-hover); }
    .sched-time { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
    .sched-dot-line { position: relative; }
    .sched-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 5px;
    }
    .sched-item.deep .sched-dot { background: var(--accent); }
    .sched-item.comm .sched-dot { background: var(--warning); }
    .sched-item.flex .sched-dot { background: var(--purple); }
    .sched-item.rest .sched-dot { background: var(--success); }
    .sched-title { font-size: 12px; font-weight: 500; }
    .sched-sub { font-size: 11px; color: var(--text-muted); }

    /* Idea Capture */
    .idea-capture { padding: 12px 14px; }
    .idea-input-row { display: flex; gap: 6px; }
    .idea-input {
      flex: 1;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      outline: none;
      font-size: 12px;
      transition: all .15s;
    }
    .idea-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 2px var(--accent-soft); }
    .idea-add-btn {
      width: 34px; height: 34px;
      background: var(--accent);
      color: white;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: 300;
      transition: all .1s;
      display: grid;
      place-items: center;
    }
    .idea-add-btn:hover { background: var(--accent-hover); }
    .idea-saved {
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--success-soft);
      border-radius: var(--radius);
      font-size: 11px;
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .idea-saved a { color: var(--accent); cursor: pointer; font-weight: 500; }
    .idea-hint { font-size: 10px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }

    /* Decisions */
    .decisions { padding: 4px 0; }
    .decision {
      display: grid;
      grid-template-columns: 6px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: background .08s;
    }
    .decision:hover { background: var(--bg-hover); }
    .decision-ind { width: 6px; height: 6px; border-radius: 50%; }
    .decision-ind.do { background: var(--success); }
    .decision-ind.later { background: var(--warning); }
    .decision-ind.hold { background: var(--text-muted); }
    .decision-title { font-weight: 500; }
    .decision-sub { font-size: 10px; color: var(--text-muted); }
    .decision-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .decision-status.do { background: var(--success-soft); color: var(--success); }
    .decision-status.later { background: var(--warning-soft); color: var(--warning); }
    .decision-status.hold { background: var(--bg); color: var(--text-muted); }

    /* Stats Cards */
    .stat-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
    }
    .stat-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat-value.good { color: var(--success); }
    .stat-value.warn { color: var(--warning); }
    .stat-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* Ideas Table */
    .ideas-wrap { overflow-x: auto; }
    .ideas-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ideas-tbl th {
      text-align: left;
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
    }
    .ideas-tbl td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .ideas-tbl tr { transition: background .08s; }
    .ideas-tbl tr:hover td { background: var(--bg-hover); }
    .ideas-tbl tr.archived { opacity: .45; }
    .idea-name-cell { font-weight: 500; }
    .idea-date-cell { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .score-bar { display: inline-flex; gap: 2px; }
    .score-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .score-pip.on { background: var(--accent); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-now { background: #dcfce7; color: #15803d; }
    .badge-sched { background: #dbeafe; color: #1d4ed8; }
    .badge-merge { background: #f3e8ff; color: #7e22ce; }
    .badge-hold { background: #fef3c7; color: #b45309; }
    .badge-wait { background: var(--bg); color: var(--text-muted); }
    .badge-done { background: var(--success-soft); color: var(--success); }
    .idea-actions { display: flex; gap: 3px; }
    .idea-act-btn {
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      transition: all .08s;
      white-space: nowrap;
    }
    .idea-act-btn:hover { border-color: var(--border-strong); background: var(--bg-hover); }
    .idea-act-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .idea-act-btn.primary:hover { background: var(--accent-hover); }
    .idea-act-btn.danger { color: var(--text-muted); padding: 3px 6px; }
    .idea-act-btn.danger:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      transition: all .08s;
    }
    .filter-chip:hover { border-color: var(--border-strong); }
    .filter-chip.active { background: var(--text); color: white; border-color: var(--text); }
    .filter-spacer { flex: 1; }

    /* Roadmap */
    .roadmap-wrap { position: relative; padding: 4px 0; }
    .roadmap-track {
      position: absolute;
      left: 11px;
      top: 16px;
      bottom: 16px;
      width: 2px;
      background: var(--border);
    }
    .milestone {
      position: relative;
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 12px;
      padding: 10px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .08s;
    }
    .milestone:hover { background: var(--bg-hover); }
    .milestone.open { background: var(--accent-soft); }
    .ms-node {
      position: relative;
      z-index: 2;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-top: 3px;
      margin-left: 6px;
      border: 3px solid var(--bg-elevated);
      background: var(--border-strong);
      box-shadow: 0 0 0 1px var(--border-strong);
    }
    .milestone.done .ms-node { background: var(--success); box-shadow: 0 0 0 1px var(--success); }
    .milestone.current .ms-node { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .milestone.current .ms-node::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: .4;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: .4; } 100% { transform: scale(1.6); opacity: 0; } }
    .ms-title { font-size: 13px; font-weight: 600; }
    .ms-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .ms-detail {
      grid-column: 2;
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .ms-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .ms-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--bg);
      color: var(--text-secondary);
      font-weight: 500;
    }
    .ms-date { font-size: 11px; color: var(--text-muted); font-weight: 500; white-space: nowrap; padding-top: 2px; }

    /* Health */
    .health-list { padding: 4px 0; }
    .health-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .health-item:last-child { border-bottom: none; }
    .h-dot { width: 8px; height: 8px; border-radius: 50%; }
    .h-dot.good { background: var(--success); }
    .h-dot.ok { background: var(--accent); }
    .h-dot.warn { background: var(--warning); }
    .h-name { font-weight: 500; }
    .h-sub { font-size: 10px; color: var(--text-muted); }
    .h-val { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px; }
    .h-val.good { background: var(--success-soft); color: var(--success); }
    .h-val.ok { background: var(--accent-soft); color: var(--accent); }
    .h-val.warn { background: var(--warning-soft); color: var(--warning); }

    /* Progress Circle */
    .progress-display { text-align: center; padding: 10px 0; }
    .progress-num { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
    .progress-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Chart */
    .chart-container { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 8px 4px 0; border-bottom: 1px solid var(--border); }
    .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; cursor: pointer; }
    .bar {
      width: 100%;
      max-width: 28px;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
      transition: all .15s;
      min-height: 2px;
      margin-top: auto;
    }
    .bar-group:hover .bar { filter: brightness(1.1); }
    .bar-group.today .bar { background: var(--purple); }
    .bar-label { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
    .bar-group:hover .bar-label { color: var(--text); font-weight: 600; }
    .bar-tip {
      display: none;
      position: absolute;
      background: var(--text);
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      transform: translateY(-28px);
      pointer-events: none;
    }
    .bar-group:hover .bar-tip { display: block; }
    .insight {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--accent-soft);
      border-radius: var(--radius);
      font-size: 11px;
      line-height: 1.6;
      color: var(--accent);
    }

    /* Reasons */
    .reason-list { padding: 4px 0; }
    .reason-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 6px;
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: all .08s;
    }
    .reason-item:hover { background: var(--bg-hover); padding-left: 10px; }
    .reason-dot { width: 8px; height: 8px; border-radius: 50%; }
    .reason-name { font-weight: 500; }
    .reason-count { font-size: 10px; color: var(--text-muted); }
    .reason-pct { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      width: min(440px, 100%);
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: mIn .15s ease;
    }
    @keyframes mIn { from { opacity:0; transform: translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 14px; font-weight: 600; }
    .modal-x { width: 26px; height: 26px; border-radius: var(--radius); display: grid; place-items: center; color: var(--text-muted); font-size: 16px; }
    .modal-x:hover { background: var(--bg-hover); color: var(--text); }
    .modal-body { padding: 16px; }
    .modal-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
    .rate-row { margin-bottom: 12px; }
    .rate-label { font-size: 12px; font-weight: 500; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .rate-label span { color: var(--text-muted); font-weight: 400; font-size: 10px; }
    .rate-stars { display: flex; gap: 4px; }
    .rate-btn {
      width: 34px; height: 34px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: 12px;
      font-weight: 600;
      transition: all .08s;
      display: grid;
      place-items: center;
    }
    .rate-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .rate-btn.sel { background: var(--accent); color: white; border-color: var(--accent); }
    .modal-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 6px; background: var(--bg); }

    /* Toast */
    .toast {
      position: fixed;
      z-index: 200;
      right: 16px;
      bottom: 16px;
      max-width: 300px;
      padding: 10px 14px;
      background: var(--text);
      color: white;
      border-radius: var(--radius);
      font-size: 12px;
      box-shadow: var(--shadow-lg);
      animation: tIn .2s ease;
    }
    @keyframes tIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
    .toast.ok { background: var(--success); }
    .toast.warn { background: var(--warning); }
    .toast.info { background: var(--accent); }

    /* Empty */
    .empty {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Responsive */
    @media (max-width: 960px) {
      .two-col { grid-template-columns: 1fr; }
      .three-col { grid-template-columns: 1fr 1fr; }
      .search-box { width: 160px; }
    }
    @media (max-width: 720px) {
      .sidebar { display: none; }
      .search-box { display: none; }
      .three-col { grid-template-columns: 1fr; }
      .content-body, .content-header { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <div class="app" x-data="app()" x-init="init()">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">深</div>
        <span class="app-name">深度规划人生</span>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="搜索任务、想法..." x-model="search">
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" @click="showQuickAdd = true" title="快速记录 (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" title="通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="icon-badge">3</span>
        </button>
        <button class="icon-btn" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="avatar-sm">我</div>
      </div>
    </header>

    <div class="main">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="side-section">
          <button class="nav-item" :class="{active: view === 'today'}" @click="view = 'today'">
            <span class="nav-icon">◎</span>
            <span class="nav-text">今日</span>
            <span class="nav-count" x-text="pendingTasks" x-show="pendingTasks > 0"></span>
          </button>
          <button class="nav-item" :class="{active: view === 'ideas'}" @click="view = 'ideas'">
            <span class="nav-icon">✦</span>
            <span class="nav-text">想法池</span>
            <span class="nav-count" x-text="ideas.length" x-show="ideas.length > 0"></span>
          </button>
          <button class="nav-item" :class="{active: view === 'roadmap'}" @click="view = 'roadmap'">
            <span class="nav-icon">◈</span>
            <span class="nav-text">路线图</span>
          </button>
          <button class="nav-item" :class="{active: view === 'review'}" @click="view = 'review'">
            <span class="nav-icon">▤</span>
            <span class="nav-text">复盘</span>
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="side-section">
          <div class="side-label">
            标签
            <span class="add-link" title="新建标签">+</span>
          </div>
          <button class="nav-item" @click="filterTag(''); view='today'">
            <span class="nav-icon" style="color:var(--text-muted)">•</span>
            <span class="nav-text">全部任务</span>
            <span class="nav-count" x-text="tasks.length"></span>
          </button>
          <button class="nav-item" @click="filterTag('深度工作'); view='today'">
            <span class="nav-icon" style="color:#1d4ed8">■</span>
            <span class="nav-text">深度工作</span>
          </button>
          <button class="nav-item" @click="filterTag('沟通'); view='today'">
            <span class="nav-icon" style="color:#b45309">■</span>
            <span class="nav-text">沟通</span>
          </button>
          <button class="nav-item" @click="filterTag('日常'); view='today'">
            <span class="nav-icon" style="color:#15803d">■</span>
            <span class="nav-text">日常</span>
          </button>
          <button class="nav-item" @click="filterTag('学习'); view='today'">
            <span class="nav-icon" style="color:#7e22ce">■</span>
            <span class="nav-text">学习</span>
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="side-section">
          <div class="side-label">已归档</div>
          <button class="nav-item">
            <span class="nav-icon">◻</span>
            <span class="nav-text">上周完成</span>
            <span class="nav-count">12</span>
          </button>
          <button class="nav-item">
            <span class="nav-icon">◻</span>
            <span class="nav-text">搁置想法</span>
            <span class="nav-count" x-text="ideas.filter(i=>i.archived).length"></span>
          </button>
        </div>

        <div style="margin-top: auto; padding: 8px;">
          <div class="goal-mini">
            <div class="goal-mini-label">2026 年度目标</div>
            <div class="goal-mini-title" x-text="goal.title"></div>
            <div class="goal-mini-bar"><div class="goal-mini-fill" :style="{width: goal.progress+'%'}"></div></div>
            <div class="goal-mini-meta">
              <span x-text="goal.progress+'%'"></span>
              <span>Q3</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Content -->
      <main class="content">
        <!-- Today View -->
        <template x-if="view === 'today'">
          <div>
            <div class="content-header">
              <div class="content-title-row">
                <h1 class="content-title" x-text="dateStr"></h1>
                <div class="content-actions">
                  <button class="btn btn-default btn-sm" @click="toast('已导出今日数据', 'ok')">导出</button>
                  <button class="btn btn-primary btn-sm" @click="showQuickAdd = true">+ 新建</button>
                </div>
              </div>
              <div class="tabs">
                <button class="tab" :class="{active: todayTab==='tasks'}" @click="todayTab='tasks'">任务</button>
                <button class="tab" :class="{active: todayTab==='schedule'}" @click="todayTab='schedule'">日程</button>
              </div>
            </div>

            <div class="content-body">
              <div class="three-col">
                <div class="stat-card">
                  <div class="stat-label">待办</div>
                  <div class="stat-value" x-text="pendingTasks"></div>
                  <div class="stat-sub" x-text="'已完成 ' + doneTasks + ' 项'"></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">今日专注</div>
                  <div class="stat-value" :class="focusDone ? 'good' : ''" x-text="focusDone ? '已完成' : '进行中'"></div>
                  <div class="stat-sub" x-text="focusTask.time + ' 分钟'"></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">连续天数</div>
                  <div class="stat-value" x-text="streak"></div>
                  <div class="stat-sub">连续打卡</div>
                </div>
              </div>

              <div class="focus-banner" :class="{done: focusDone}">
                <div class="focus-check" :class="{done: focusDone}" @click="toggleFocus"></div>
                <div class="focus-info">
                  <div class="focus-label" x-text="focusDone ? '今日焦点 · 已完成' : '今日焦点'"></div>
                  <div class="focus-text" x-text="focusTask.title"></div>
                  <div class="focus-meta">
                    <span class="focus-meta-tag" x-text="focusTask.goal"></span>
                    <span class="focus-meta-tag" x-text="focusTask.pomodoros + ' 个番茄'"></span>
                  </div>
                </div>
                <div class="focus-timer" x-show="!focusDone">
                  <button class="focus-start-btn" @click="toast('开始专注计时', 'info')">开始专注</button>
                </div>
              </div>

              <div class="two-col">
                <div>
                  <template x-if="todayTab === 'tasks'">
                    <div class="panel">
                      <div class="panel-header">
                        <span class="panel-title">任务列表</span>
                        <div class="panel-actions">
                          <button class="btn btn-sm btn-default" @click="view='ideas'">查看想法</button>
                        </div>
                      </div>
                      <div class="quick-add">
                        <form class="quick-add-form" @submit.prevent="addTask">
                          <input type="text" x-model="newTaskTitle" placeholder="添加新任务..." autocomplete="off">
                          <select x-model="newTaskTag">
                            <option value="">标签</option>
                            <option value="深度工作">深度工作</option>
                            <option value="沟通">沟通</option>
                            <option value="日常">日常</option>
                            <option value="学习">学习</option>
                          </select>
                          <button type="submit">添加</button>
                        </form>
                      </div>
                      <div class="task-list">
                        <template x-for="(t, i) in filteredTasks" :key="t.id">
                          <div class="task" :class="{done: t.done}">
                            <div class="task-check" :class="{checked: t.done}" @click="t.done = !t.done; save()"></div>
                            <span class="task-title" x-text="t.title"></span>
                            <span class="task-tag" x-show="t.tag" :class="'tag-'+tagClass(t.tag)" x-text="t.tag"></span>
                            <button class="task-del" @click="delTask(i)">×</button>
                          </div>
                        </template>
                        <div class="empty" x-show="filteredTasks.length === 0">暂无任务</div>
                      </div>
                    </div>
                  </template>

                  <template x-if="todayTab === 'schedule'">
                    <div class="panel">
                      <div class="panel-header">
                        <span class="panel-title">时间块</span>
                      </div>
                      <div class="panel-body">
                        <div class="schedule">
                          <div class="sched-item deep" @click="toast('深度工作时段：关闭通知，专注于今日焦点', 'info')">
                            <span class="sched-time">09:00</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot"></div>
                              <div class="sched-title">深度工作</div>
                              <div class="sched-sub">今日焦点任务</div>
                            </div>
                          </div>
                          <div class="sched-item comm" @click="toast('集中处理沟通类事务，减少上下文切换', 'info')">
                            <span class="sched-time">11:00</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot"></div>
                              <div class="sched-title">沟通时段</div>
                              <div class="sched-sub">消息、邮件、会议</div>
                            </div>
                          </div>
                          <div class="sched-item" style="opacity:.5">
                            <span class="sched-time">12:00</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot" style="background:var(--text-muted)"></div>
                              <div class="sched-title">午休</div>
                              <div class="sched-sub"></div>
                            </div>
                          </div>
                          <div class="sched-item flex" @click="toast('机动时间留给突发事项，不要排满！', 'info')">
                            <span class="sched-time">14:00</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot"></div>
                              <div class="sched-title">机动时间</div>
                              <div class="sched-sub">处理临时任务</div>
                            </div>
                          </div>
                          <div class="sched-item deep">
                            <span class="sched-time">15:30</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot"></div>
                              <div class="sched-title">第二次深度工作</div>
                              <div class="sched-sub">次重要任务</div>
                            </div>
                          </div>
                          <div class="sched-item rest" @click="toast('每日复盘：整理想法、规划明天', 'info')">
                            <span class="sched-time">20:00</span>
                            <div class="sched-dot-line">
                              <div class="sched-dot"></div>
                              <div class="sched-title">每日复盘</div>
                              <div class="sched-sub">处理想法池</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>

                <div>
                  <div class="panel">
                    <div class="panel-header">
                      <span class="panel-title">快速记录</span>
                    </div>
                    <div class="idea-capture">
                      <form class="idea-input-row" @submit.prevent="quickIdea">
                        <input class="idea-input" type="text" x-model="quickIdeaText" placeholder="有想法？先记下来..." autocomplete="off">
                        <button class="idea-add-btn" type="submit">+</button>
                      </form>
                      <div class="idea-saved" x-show="ideaSaved" x-cloak>
                        <span>已存入想法池</span>
                        <a @click="view='ideas'">查看</a>
                      </div>
                      <p class="idea-hint">想法不立即处理，晚上复盘时统一评估。按 N 快速唤起。</p>
                    </div>

  <script>
    function app() {
      return {
        view: 'today',
        todayTab: 'tasks',
        ideaFilter: 'all',
        tagFilter: '',
        search: '',
        dateStr: '',
        streak: 12,
        focusDone: false,
        newTaskTitle: '',
        newTaskTag: '',
        newIdeaTitle: '',
        quickIdeaText: '',
        ideaSaved: false,
        rateModal: false,
        showQuickAdd: false,
        showAddIdea: false,
        rateTarget: null,
        openMs: -1,
        toastOn: false,
        toastMsg: '',
        toastKind: 'info',
        toastT: null,
        scores: { g:3, i:3, u:3, c:3 },
        insight: '上午9点前启动的任务完成率比下午高42%，建议把关键行动安排在上午。',
        weekHours: 9.5,

        goal: { title: '建立有影响力的个人产品', progress: 68 },
        focusTask: { title: '完成产品原型的交互打磨', goal: '个人产品', time: 90, pomodoros: 3 },

        tasks: [],
        ideas: [],

        milestones: [
          { id:1, s:'done', title:'问题定义与用户验证', sub:'10位目标用户访谈完成', date:'Q2 · 6月', tags:['用户调研','痛点验证'], detail:'完成10位目标用户深度访谈，确认三大核心痛点：1) 想法过载导致失焦；2) 优先级判断情绪化；3) 缺乏延期根因分析。价值假设得到初步验证。' },
          { id:2, s:'current', title:'可交互产品原型', sub:'核心功能模块开发中', date:'Q3 · 7月', tags:['产品设计','原型开发'], detail:'完成四大核心模块：今日聚焦（单焦点+时间块）、想法池（五维评估）、人生路线图（里程碑追踪）、周期复盘（数据洞察）。即将进入用户测试阶段。' },
          { id:3, s:'future', title:'首轮用户测试', sub:'20位用户两周试用', date:'Q3 · 8月', tags:['用户测试','反馈迭代'], detail:'邀请20位目标用户进行两周试用，验证核心假设：想法收集便捷性、五维评估合理性、单焦点是否真正提升执行率。' },
          { id:4, s:'future', title:'MVP 发布', sub:'本地存储+基础统计', date:'Q4 · 10月', tags:['MVP','正式发布'], detail:'发布最小可行版本，支持本地数据存储、基础数据统计和导出功能。核心验证：产品是否帮助用户持续推进重要目标，而不是记录更多任务。' }
        ],

        weekChart: [
          { day:'一', val:85 },
          { day:'二', val:55 },
          { day:'三', val:105 },
          { day:'四', val:115 },
          { day:'五', val:68 },
          { day:'六', val:45 },
          { day:'日', val:72 }
        ],

        delayReasons: [
          { name:'估时过于乐观', cnt:3, pct:45, color:'#2563eb' },
          { name:'临时想法打断', cnt:2, pct:30, color:'#ea580c' },
          { name:'任务定义模糊', cnt:1, pct:25, color:'#9333ea' }
        ],

        init() {
          this.setDate();
          this.load();
          this.$watch('tasks', () => this.save(), { deep:true });
          this.$watch('ideas', () => this.save(), { deep:true });
          this.$watch('focusDone', () => { this.save(); this.calcProgress(); });

          document.addEventListener('keydown', (e) => {
            if (e.key === 'n' && !e.target.matches('input,textarea,select')) {
              e.preventDefault();
              this.showQuickAdd = true;
              this.$nextTick(() => { if (this.$refs.qaInput) this.$refs.qaInput.focus(); });
            }
            if (e.key === 'Escape') { this.rateModal = false; this.showQuickAdd = false; this.showAddIdea = false; }
          });
        },

        setDate() {
          const d = new Date();
          const days = ['周日','周一','周二','周三','周四','周五','周六'];
          this.dateStr = `${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
        },

        get pendingTasks() { return this.tasks.filter(t => !t.done && (!this.tagFilter || t.tag === this.tagFilter)).length; },
        get doneTasks() { return this.tasks.filter(t => t.done).length; },

        get filteredTasks() {
          let list = this.tasks;
          if (this.tagFilter) list = list.filter(t => t.tag === this.tagFilter);
          if (this.search) {
            const q = this.search.toLowerCase();
            list = list.filter(t => t.title.toLowerCase().includes(q));
          }
          return list;
        },

        get filteredIdeas() {
          let list = this.ideas;
          if (this.ideaFilter === 'pending') list = list.filter(i => !i.rated);
          else if (this.ideaFilter === 'now') list = list.filter(i => i.badge === 'now');
          else if (this.ideaFilter === 'sched') list = list.filter(i => i.badge === 'sched');
          else if (this.ideaFilter === 'hold') list = list.filter(i => i.badge === 'hold');
          if (this.search) {
            const q = this.search.toLowerCase();
            list = list.filter(i => i.title.toLowerCase().includes(q));
          }
          return list;
        },

        tagClass(tag) {
          const map = { '深度工作':'work', '沟通':'comm', '日常':'daily', '学习':'learn', '想法转化':'idea' };
          return map[tag] || 'work';
        },

        filterTag(tag) { this.tagFilter = tag; },

        defaultTasks() {
          return [
            { id: Date.now()+1, title:'查看并回复重要消息', tag:'沟通', done:false },
            { id: Date.now()+2, title:'整理昨天的工作笔记', tag:'日常', done:true },
            { id: Date.now()+3, title:'阅读《深度工作》第4章', tag:'学习', done:false }
          ];
        },

        defaultIdeas() {
          const d = new Date();
          const ds = `${d.getMonth()+1}月${d.getDate()}日`;
          return [
            { id:Date.now()+10, title:'邀请5位用户测试原型', date:ds, rated:true, g:5, i:5, u:4, c:2, suggestion:'优先做', badge:'now', reason:'直接验证当前阶段，低成本高价值', status:'pending', archived:false },
            { id:Date.now()+11, title:'做一个个人成长播客', date:ds, rated:true, g:2, i:4, u:1, c:5, suggestion:'搁置', badge:'hold', reason:'价值高但会稀释本季度重点', status:'pending', archived:false },
            { id:Date.now()+12, title:'建立每周阅读分享机制', date:ds, rated:true, g:3, i:3, u:2, c:2, suggestion:'安排', badge:'sched', reason:'可融入现有内容输出', status:'pending', archived:false }
          ];
        },

        load() {
          try {
            const raw = localStorage.getItem('deep_planner_v3');
            if (raw) {
              const data = JSON.parse(raw);
              this.tasks = data.tasks || this.defaultTasks();
              this.ideas = data.ideas || this.defaultIdeas();
              this.focusDone = data.focusDone || false;
              this.streak = data.streak || 12;
            } else {
              this.tasks = this.defaultTasks();
              this.ideas = this.defaultIdeas();
            }
          } catch(e) {
            this.tasks = this.defaultTasks();
            this.ideas = this.defaultIdeas();
          }
          this.calcProgress();
        },

        save() {
          try {
            localStorage.setItem('deep_planner_v3', JSON.stringify({
              tasks: this.tasks, ideas: this.ideas, focusDone: this.focusDone, streak: this.streak
            }));
          } catch(e) {}
        },

        resetData() {
          localStorage.removeItem('deep_planner_v3');
          this.tasks = this.defaultTasks();
          this.ideas = this.defaultIdeas();
          this.focusDone = false;
          this.calcProgress();
          this.toast('数据已重置', 'ok');
        },

        calcProgress() {
          const done = this.milestones.filter(m=>m.s==='done').length;
          this.goal.progress = Math.min(92, Math.round(done/this.milestones.length*100) + 20 + (this.focusDone?10:0));
          this.weekHours = +(this.weekChart.reduce((s,d)=>s+d.val,0)/60).toFixed(1);
        },

        toggleFocus() {
          this.focusDone = !this.focusDone;
          if (this.focusDone) {
            this.streak++;
            this.toast('今日焦点已完成，连续' + this.streak + '天', 'ok');
          }
          this.save();
        },

        addTask() {
          const title = this.newTaskTitle.trim();
          if (!title) { this.toast('请输入任务内容', 'warn'); return; }
          this.tasks.push({ id:Date.now(), title, tag:this.newTaskTag, done:false });
          this.newTaskTitle = '';
          this.newTaskTag = '';
          this.toast('已添加任务', 'ok');
          this.save();
        },

        delTask(i) {
          this.tasks.splice(i, 1);
          this.save();
        },

        quickIdea() {
          this._addIdea(this.quickIdeaText);
          this.ideaSaved = true;
          setTimeout(() => this.ideaSaved = false, 3000);
        },

        quickIdeaFromModal() {
          this._addIdea(this.quickIdeaText);
          this.showQuickAdd = false;
          this.view = 'ideas';
        },

        _addIdea(text) {
          const title = (text || '').trim();
          if (!title) return;
          const d = new Date();
          const ds = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          this.ideas.unshift({
            id:Date.now(), title, date:ds,
            rated:false, g:0, i:0, u:0, c:0,
            suggestion:'待评估', badge:'wait', reason:'尚未评估', status:'pending', archived:false
          });
          this.quickIdeaText = '';
          this.toast('已存入想法池', 'ok');
          this.save();
        },

        openRate(idea) {
          this.rateTarget = idea;
          this.scores = { g:3, i:3, u:3, c:3 };
          this.rateModal = true;
        },

        submitRate() {
          if (!this.rateTarget) return;
          const idea = this.rateTarget;
          idea.rated = true;
          idea.g = this.scores.g;
          idea.i = this.scores.i;
          idea.u = this.scores.u;
          idea.c = this.scores.c;
          const s = idea.g*2 + idea.i*1.5 + idea.u - idea.c*0.5;
          if (s >= 13) { idea.suggestion='优先做'; idea.badge='now'; idea.reason=`综合${Math.round(s)}分，目标相关度高，建议立即安排`; }
          else if (s >= 9) { idea.suggestion='安排'; idea.badge='sched'; idea.reason=`综合${Math.round(s)}分，有价值，可排入计划`; }
          else if (s >= 6) { idea.suggestion='合并'; idea.badge='sched'; idea.reason=`综合${Math.round(s)}分，可融入现有任务`; }
          else { idea.suggestion='搁置'; idea.badge='hold'; idea.reason=`综合${Math.round(s)}分，当前阶段投入产出比偏低`; }
          this.rateModal = false;
          this.toast('评估完成：' + idea.suggestion, 'ok');
          this.save();
        },

        ideaAction(idea, act) {
          const map = {
            now: { msg:'已转为今日任务', tab:'today' },
            sched: { msg:'已加入计划', tab:null },
            hold: { msg:'已搁置', tab:null }
          };
          idea.status = act + '_' + Date.now();
          if (act === 'now') {
            this.tasks.push({ id:Date.now(), title:idea.title, tag:'想法转化', done:false });
            idea.suggestion = '已转任务';
            idea.badge = 'now';
            this.view = 'today';
          } else if (act === 'sched') {
            idea.suggestion = '已安排';
            idea.badge = 'sched';
          } else {
            idea.suggestion = '已搁置';
            idea.badge = 'hold';
            idea.archived = true;
          }
          this.toast(map[act].msg, 'ok');
          this.save();
        },

        delIdea(idea) {
          const idx = this.ideas.indexOf(idea);
          if (idx > -1) this.ideas.splice(idx, 1);
          this.save();
        },

        processAll() {
          const pending = this.ideas.filter(i => !i.rated);
          if (pending.length === 0) { this.toast('没有待评估的想法', 'info'); return; }
          this.toast(`还有 ${pending.length} 个想法待评估`, 'info');
        },

        addReason(i) {
          this.delayReasons[i].cnt++;
          const total = this.delayReasons.reduce((s,r)=>s+r.cnt, 0);
          this.delayReasons.forEach(r => r.pct = Math.round(r.cnt/total*100));
          this.toast('已记录', 'info');
        },

        genInsight() {
          const pool = [
            '上午9点前启动的任务完成率比下午高42%，建议把关键行动安排在上午。',
            '本周深度工作时长比上周增加1.5h，保持节奏。番茄工作法效果显著。',
            '周三、周四是你的高效时段，把最重要的任务安排在这两天。',
            '估时偏乐观是最大延期原因，建议给任务预留150%的缓冲。',
            '想法池新增的想法中大部分被合理搁置，你在克制方面做得不错。'
          ];
          this.insight = pool[Math.floor(Math.random()*pool.length)];
          this.toast('洞察已更新', 'ok');
        },

        toast(msg, kind='info') {
          this.toastMsg = msg;
          this.toastKind = kind;
          this.toastOn = true;
          if (this.toastT) clearTimeout(this.toastT);
          this.toastT = setTimeout(() => this.toastOn = false, 2500);
        }
      }
    }
  </script>
</body>
</html>
