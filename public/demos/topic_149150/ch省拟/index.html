<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山河同人馆 - ch省拟</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ==================== 全局顶部栏 ==================== -->
  <header class="global-header">
    <div class="logo">
      <div class="logo-icon">山</div>
      <span>山河同人馆</span>
    </div>
    
    <!-- 跨圈搜索框 -->
    <div class="search-box">
      <input type="text" id="globalSearch" placeholder="搜索国拟 / CH / Country Humans、省拟、CP、历史、周边..." />
      <button class="search-btn" id="globalSearchBtn">🔍</button>
      <div class="search-hints" id="searchHints"></div>
    </div>
    
    <!-- 专区切换 -->
    <div class="zone-switch">
      <button class="zone-btn ch" id="zoneCh">国拟专区</button>
      <button class="zone-btn prov" id="zoneProv">省拟专区</button>
    </div>
    
    <!-- 用户入口 -->
    <div class="user-actions">
      <button class="action-btn" onclick="openLoginModal()">
        <span>登录</span>
      </button>
      <button class="action-btn">
        <span>注册</span>
      </button>
      <div class="user-avatar" onclick="openLoginModal()">?</div>
    </div>
  </header>

  <!-- ==================== 页面容器 ==================== -->
  <div class="page-container">
    
    <!-- ========== 首页 ========== -->
    <div id="homePage">
      <div class="home-hero">
        <div class="hero-logo">山</div>
        <h1>山河同人馆</h1>
        <p class="subtitle">国家拟人化 CH 圈 & 省拟原创同人创作平台</p>
        
        <div class="hero-search">
          <input type="text" id="heroSearch" placeholder="输入国拟 / CH / Country Humans、省拟等关键词，自动跳转..." />
          <button class="search-btn" id="heroSearchBtn">🔍</button>
        </div>
        
        <div class="hero-zones">
          <div class="hero-zone-card ch-card" id="chCard">
            <div class="zone-icon">🏛️</div>
            <h3>国拟专区（CH / Country Humans）</h3>
            <p>国家拟人化 CH 圈创作社区。人物如中国称「瓷」、法国称「法兰西」，历史向以真实历史文化图文呈现。</p>
          </div>
          <div class="hero-zone-card prov-card" id="provCard">
            <div class="zone-icon">🗺️</div>
            <h3>省拟专区</h3>
            <p>纯原创省份人设，不照搬外网设定，展示中国各省独特的人文风情与拟人魅力。</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- ========== 国拟专区 ========== -->
    <div class="zone-page ch-zone" id="chPage">
      <!-- 横向导航 -->
      <nav class="top-nav" id="chTopNav"></nav>
      
      <!-- 主内容 -->
      <div class="zone-main">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="chSidebar"></aside>
        
        <!-- 内容区域 -->
        <main class="content-area" id="chContent"></main>
      </div>
    </div>
    
    <!-- ========== 省拟专区 ========== -->
    <div class="zone-page prov-zone" id="provPage">
      <!-- 横向导航 -->
      <nav class="top-nav" id="provTopNav"></nav>
      
      <!-- 主内容 -->
      <div class="zone-main">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="provSidebar"></aside>
        
        <!-- 内容区域 -->
        <main class="content-area" id="provContent"></main>
      </div>
    </div>
    
  </div>

  <!-- ==================== 登录/注册弹窗 ==================== -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h2 id="authTitle">登录</h2>
      <form>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="authPhone" placeholder="请输入手机号" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="authPassword" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary form-submit" id="authSubmit">登录</button>
      </form>
      <div class="modal-footer" id="authFooter">
        还没有账号？<a href="#" id="switchAuth">去注册</a>
      </div>
      <button style="position: absolute; top: 16px; right: 16px; font-size: 20px; color: var(--text-muted);" id="closeModal">✕</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
