<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☁️ 云朵手账 · 治愈系心情日记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 设计变量 ===== */
    :root {
      --bg: #F5E6D3;
      --card: #FFF8F0;
      --accent: #D4A574;
      --accent-dark: #B8895A;
      --text: #8B6F47;
      --text-light: #A89070;
      --pink: #E89B9B;
      --mood-happy: #F4C95D;
      --mood-calm: #A8C9A0;
      --mood-sad: #8FB8D8;
      --mood-angry: #E88B8B;
      --mood-tired: #B8A8D8;
      --shadow: 0 4px 12px rgba(139, 111, 71, 0.12);
      --shadow-hover: 0 6px 20px rgba(139, 111, 71, 0.18);
      --radius: 12px;
    }

    /* ===== Reset ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ===== 全局 ===== */
    body {
      font-family: 'Noto Serif SC', 'STKaiti', '楷体', serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(212, 165, 116, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(232, 155, 155, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 248, 240, 0.4) 0%, transparent 70%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

    /* ===== Header ===== */
    header {
      position: relative;
      text-align: center;
      padding: 28px 16px 20px;
      margin-bottom: 20px;
    }
    /* 和纸胶带装饰 */
    header::before {
      content: '';
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 110px; height: 22px;
      background: linear-gradient(90deg, rgba(232,155,155,0.55), rgba(232,155,155,0.4));
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border-radius: 2px;
    }
    header::after {
      content: '';
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 110px; height: 22px;
      background-image: linear-gradient(90deg, transparent 0%, transparent 8%, rgba(255,255,255,0.3) 8%, rgba(255,255,255,0.3) 10%, transparent 10%, transparent 90%, rgba(255,255,255,0.3) 90%, rgba(255,255,255,0.3) 92%, transparent 92%);
    }
    h1 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 38px;
      color: var(--text);
      font-weight: normal;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }
    .today-date {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-light);
      position: relative;
      z-index: 1;
    }

    /* ===== Tab 导航 ===== */
    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255, 248, 240, 0.6);
      padding: 6px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 15px;
      color: var(--text-light);
      transition: all 0.25s;
      font-weight: 600;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--accent);
      color: #FFF8F0;
      box-shadow: 0 2px 8px rgba(212, 165, 116, 0.4);
    }

    /* ===== Tab Panel ===== */
    .tab-panel { display: none; animation: fadeIn 0.3s ease; }
    .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== 今日记录 ===== */
    .selector-group { margin-bottom: 22px; }
    .selector-label {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .mood-btn, .weather-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      font-size: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid transparent;
    }
    .mood-btn:hover, .weather-btn:hover { transform: translateY(-2px); }
    .mood-btn.selected, .weather-btn.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.25), var(--shadow-hover);
      transform: translateY(-2px);
    }
    textarea {
      width: 100%;
      padding: 16px;
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      background: var(--card);
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      resize: vertical;
      min-height: 120px;
      line-height: 1.8;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent-dark);
      border-style: solid;
    }
    textarea::placeholder { color: var(--text-light); opacity: 0.7; }
    .save-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #FFF8F0;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
      transition: all 0.2s;
    }
    .save-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 165, 116, 0.5);
    }
    .save-btn:active { transform: translateY(0); }

    /* ===== 统计卡片 ===== */
    .stats-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .stats-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 20px;
      margin-bottom: 14px;
      color: var(--text);
      letter-spacing: 1px;
    }
    .stats-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .stats-row:last-child { margin-bottom: 0; }
    .stats-emoji { font-size: 20px; width: 28px; text-align: center; }
    .stats-label { width: 36px; font-size: 13px; color: var(--text-light); }
    .stats-bar-bg {
      flex: 1;
      height: 12px;
      background: rgba(139, 111, 71, 0.10);
      border-radius: 6px;
      overflow: hidden;
    }
    .stats-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }
    .stats-count {
      width: 24px;
      text-align: right;
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }

    /* ===== 日记卡片 ===== */
    .diary-card {
      background: var(--card);
      border-radius: var(--radius);
      border-left: 4px solid var(--mood-calm);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s;
    }
    .diary-card:hover { box-shadow: var(--shadow-hover); }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .card-date { font-weight: 600; color: var(--text); }
    .card-mood { color: var(--text-light); }
    .card-weather { font-size: 16px; }
    .del-btn {
      margin-left: auto;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--mood-angry);
      border-radius: 12px;
      transition: background 0.2s;
    }
    .del-btn:hover { background: rgba(232, 139, 139, 0.15); }
    .card-content {
      font-size: 15px;
      color: var(--text);
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ===== 日历 ===== */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 16px;
    }
    .cal-nav button {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 14px;
      color: var(--accent-dark);
      transition: all 0.2s;
    }
    .cal-nav button:hover { background: var(--accent); color: #FFF8F0; }
    #calTitle {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 22px;
      color: var(--text);
      letter-spacing: 1px;
      min-width: 140px;
      text-align: center;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--card);
      padding: 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 12px;
      padding: 4px;
    }
    .cal-head {
      font-weight: 600;
      color: var(--text-light);
      aspect-ratio: auto;
      padding: 8px 4px;
    }
    .cal-day { color: var(--text-light); }
    .cal-day.has-diary {
      background: rgba(212, 165, 116, 0.12);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
    }
    .cal-day.has-diary:hover { background: rgba(212, 165, 116, 0.25); }
    .cal-day.is-today {
      box-shadow: inset 0 0 0 2px var(--pink);
      font-weight: 600;
    }
    .cal-num { font-size: 11px; }
    .cal-emoji { font-size: 20px; line-height: 1; margin-top: 2px; }
    .cal-detail { margin-top: 20px; }
    .cal-detail-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px;
      margin-bottom: 12px;
      color: var(--text);
      letter-spacing: 1px;
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-light);
      font-size: 15px;
      line-height: 2.4;
    }
    .empty-state .emoji { font-size: 40px; display: block; margin-bottom: 8px; }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--card);
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .mood-btn, .weather-btn { width: 48px; height: 48px; font-size: 22px; }
      .tab-btn { font-size: 13px; padding: 10px 4px; }
      .cal-emoji { font-size: 16px; }
      .cal-num { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>☁️ 云朵手账</h1>
      <div class="today-date" id="todayDate"></div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="today">✍️ 今日记录</button>
      <button class="tab-btn" data-tab="list">📖 日记列表</button>
      <button class="tab-btn" data-tab="calendar">📅 日历回顾</button>
    </nav>

    <!-- 今日记录 -->
    <section class="tab-panel active" id="panel-today">
      <div class="selector-group">
        <div class="selector-label">今天的心情</div>
        <div class="btn-row">
          <button class="mood-btn" data-mood="happy" title="开心">😊</button>
          <button class="mood-btn" data-mood="calm" title="平静">😌</button>
          <button class="mood-btn" data-mood="sad" title="难过">😢</button>
          <button class="mood-btn" data-mood="angry" title="生气">😡</button>
          <button class="mood-btn" data-mood="tired" title="疲惫">😴</button>
        </div>
      </div>
      <div class="selector-group">
        <div class="selector-label">今天的天气</div>
        <div class="btn-row">
          <button class="weather-btn" data-weather="sunny" title="晴">☀️</button>
          <button class="weather-btn" data-weather="cloudy" title="阴">☁️</button>
          <button class="weather-btn" data-weather="rainy" title="雨">🌧️</button>
          <button class="weather-btn" data-weather="snowy" title="雪">❄️</button>
          <button class="weather-btn" data-weather="windy" title="风">🌬️</button>
        </div>
      </div>
      <div class="selector-group">
        <div class="selector-label">想说什么</div>
        <textarea id="diaryContent" placeholder="今天发生了什么，写下此刻的心情吧..." rows="6"></textarea>
      </div>
      <button class="save-btn" id="saveBtn">记下来 ✨</button>
    </section>

    <!-- 日记列表 -->
    <section class="tab-panel" id="panel-list">
      <div id="statsCard" class="stats-card"></div>
      <div id="diaryList" class="diary-list"></div>
    </section>

    <!-- 日历回顾 -->
    <section class="tab-panel" id="panel-calendar">
      <div class="cal-nav">
        <button id="calPrev" title="上个月">◀</button>
        <span id="calTitle"></span>
        <button id="calNext" title="下个月">▶</button>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calDetail" class="cal-detail"></div>
    </section>
  </div>

  <div id="toast"></div>

  <script>
    /* ===== Task 2: 数据层 ===== */
    const STORAGE_KEY = 'mood_diary_entries';

    function loadEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveEntries(entries) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        return true;
      } catch (e) {
        return false; // 容量满或隐私模式
      }
    }

    function addEntry(entry) {
      const entries = loadEntries();
      entries.push(entry);
      return saveEntries(entries);
    }

    function deleteEntry(id) {
      let entries = loadEntries();
      entries = entries.filter(e => e.id !== id);
      return saveEntries(entries);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    /* ===== Task 2: 元数据映射 ===== */
    const MOOD_META = {
      happy: { emoji: '😊', label: '开心', color: '#F4C95D' },
      calm:  { emoji: '😌', label: '平静', color: '#A8C9A0' },
      sad:   { emoji: '😢', label: '难过', color: '#8FB8D8' },
      angry: { emoji: '😡', label: '生气', color: '#E88B8B' },
      tired: { emoji: '😴', label: '疲惫', color: '#B8A8D8' }
    };
    const WEATHER_META = {
      sunny: '☀️', cloudy: '☁️', rainy: '🌧️', snowy: '❄️', windy: '🌬️'
    };

    /* ===== Task 2: 今日记录 Tab 交互 ===== */
    let selectedMood = null;
    let selectedWeather = null;

    function initTodayTab() {
      document.getElementById('todayDate').textContent = todayStr() + ' · ' + getWeekday();

      document.querySelectorAll('.mood-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedMood = btn.dataset.mood;
        });
      });

      document.querySelectorAll('.weather-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedWeather = btn.dataset.weather;
        });
      });

      document.getElementById('saveBtn').addEventListener('click', () => {
        const content = document.getElementById('diaryContent').value.trim();
        if (!selectedMood) { showToast('选一个今天的心情吧 🌿'); return; }
        if (!content) { showToast('写点什么吧 ✍️'); return; }
        const entry = {
          id: Date.now(),
          date: todayStr(),
          mood: selectedMood,
          weather: selectedWeather || 'sunny',
          content: content,
          createdAt: Date.now()
        };
        if (addEntry(entry)) {
          showToast('记下来啦 ✨');
          document.getElementById('diaryContent').value = '';
          document.querySelectorAll('.mood-btn, .weather-btn').forEach(b => b.classList.remove('selected'));
          selectedMood = null;
          selectedWeather = null;
        } else {
          showToast('存储已满，请清理旧日记');
        }
      });
    }

    function getWeekday() {
      const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      return weeks[new Date().getDay()];
    }

    /* ===== Task 3: Tab 切换 ===== */
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
      if (name === 'list') renderListTab();
      if (name === 'calendar') renderCalendarTab();
    }

    function initTabSwitch() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    /* ===== Task 3: 日记列表渲染 ===== */
    function renderListTab() {
      renderStatsCard();
      const listEl = document.getElementById('diaryList');
      const entries = loadEntries().sort((a, b) => b.createdAt - a.createdAt);
      if (entries.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><span class="emoji">🌙</span>还没有故事<br>去「今日记录」写下今天吧</div>';
        return;
      }
      listEl.innerHTML = entries.map(e => {
        const m = MOOD_META[e.mood] || MOOD_META.calm;
        const w = WEATHER_META[e.weather] || '☁️';
        return `
          <div class="diary-card" style="border-left-color:${m.color}">
            <div class="card-header">
              <span class="card-date">${e.date}</span>
              <span class="card-mood">${m.emoji} ${m.label}</span>
              <span class="card-weather">${w}</span>
              <button class="del-btn" data-id="${e.id}">删除</button>
            </div>
            <div class="card-content">${escapeHtml(e.content)}</div>
          </div>
        `;
      }).join('');
      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.id);
          deleteEntry(id);
          showToast('已删除 🍂');
          renderListTab();
        });
      });
    }

    /* ===== Task 4: 日历回顾 ===== */
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    function renderCalendarTab() {
      const titleEl = document.getElementById('calTitle');
      const gridEl = document.getElementById('calGrid');
      const entries = loadEntries();
      const entryMap = {};
      entries.forEach(e => {
        if (!entryMap[e.date]) entryMap[e.date] = [];
        entryMap[e.date].push(e);
      });

      titleEl.textContent = `${calYear} 年 ${calMonth + 1} 月`;

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      let html = '';
      ['日','一','二','三','四','五','六'].forEach(d => {
        html += `<div class="cal-cell cal-head">${d}</div>`;
      });
      for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayEntries = (entryMap[dateStr] || []).sort((a,b) => b.createdAt - a.createdAt);
        const emoji = dayEntries[0] ? (MOOD_META[dayEntries[0].mood] || {}).emoji || '' : '';
        const isToday = dateStr === todayStr();
        html += `
          <div class="cal-cell cal-day ${dayEntries.length ? 'has-diary' : ''} ${isToday ? 'is-today' : ''}" data-date="${dateStr}">
            <span class="cal-num">${d}</span>
            ${emoji ? `<span class="cal-emoji">${emoji}</span>` : ''}
          </div>
        `;
      }
      gridEl.innerHTML = html;

      gridEl.querySelectorAll('.cal-day.has-diary').forEach(cell => {
        cell.addEventListener('click', () => showDayEntries(cell.dataset.date));
      });
    }

    function showDayEntries(date) {
      const entries = loadEntries().filter(e => e.date === date).sort((a,b) => b.createdAt - a.createdAt);
      const detailEl = document.getElementById('calDetail');
      if (entries.length === 0) { detailEl.innerHTML = ''; return; }
      detailEl.innerHTML = `
        <div class="cal-detail-title">📖 ${date} 的日记</div>
        ${entries.map(e => {
          const m = MOOD_META[e.mood] || MOOD_META.calm;
          const w = WEATHER_META[e.weather] || '☁️';
          return `
            <div class="diary-card" style="border-left-color:${m.color}">
              <div class="card-header">
                <span class="card-mood">${m.emoji} ${m.label}</span>
                <span class="card-weather">${w}</span>
              </div>
              <div class="card-content">${escapeHtml(e.content)}</div>
            </div>
          `;
        }).join('')}
      `;
    }

    function initCalendarNav() {
      document.getElementById('calPrev').addEventListener('click', () => {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendarTab();
        document.getElementById('calDetail').innerHTML = '';
      });
      document.getElementById('calNext').addEventListener('click', () => {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendarTab();
        document.getElementById('calDetail').innerHTML = '';
      });
    }

    /* ===== Task 5: 本月心情统计 ===== */
    function renderStatsCard() {
      const statsEl = document.getElementById('statsCard');
      const entries = loadEntries();
      const now = new Date();
      const prefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      const monthEntries = entries.filter(e => e.date.startsWith(prefix));
      const counts = { happy:0, calm:0, sad:0, angry:0, tired:0 };
      monthEntries.forEach(e => { if (counts[e.mood] !== undefined) counts[e.mood]++; });
      const max = Math.max(1, ...Object.values(counts));
      const total = monthEntries.length;
      statsEl.innerHTML = `
        <div class="stats-title">📊 本月心情 · 共 ${total} 篇</div>
        ${Object.entries(counts).map(([mood, n]) => {
          const m = MOOD_META[mood];
          const w = (n / max) * 100;
          return `
            <div class="stats-row">
              <span class="stats-emoji">${m.emoji}</span>
              <span class="stats-label">${m.label}</span>
              <div class="stats-bar-bg"><div class="stats-bar" style="width:${w}%;background:${m.color}"></div></div>
              <span class="stats-count">${n}</span>
            </div>
          `;
        }).join('')}
      `;
    }

    /* ===== Task 5: 初始化 ===== */
    function init() {
      initTabSwitch();
      initTodayTab();
      initCalendarNav();
      renderListTab();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
