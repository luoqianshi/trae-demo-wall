<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭CEO决策助手 — 用管理学框架解决家庭困境</title>
    <style>
        :root {
            --cream: #FFF8F0;
            --warm-bg: #FFF1E6;
            --sage: #8BC48A;
            --sage-light: #E8F5E8;
            --sage-dark: #5A9E5A;
            --lavender: #A88BC2;
            --lavender-light: #F0E8F5;
            --lavender-dark: #7E6A9A;
            --sky: #7EB8D8;
            --sky-light: #E0F0FA;
            --sky-dark: #5A98B8;
            --gold: #D4A853;
            --gold-light: #FFF8E0;
            --gold-dark: #B8903A;
            --terra: #C97B5A;
            --terra-light: #FFF0E0;
            --terra-dark: #A86040;
            --text: #3D3228;
            --text-light: #6B5E52;
            --text-lighter: #9A8E82;
            --border: #E8DDD0;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 16px rgba(61, 50, 40, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: white;
            border-bottom: 1.5px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--terra), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 800;
        }
        .logo-text {
            font-size: 18px;
            font-weight: 700;
        }
        .logo-text span {
            color: var(--terra);
        }
        .header-badge {
            padding: 5px 14px;
            border-radius: 16px;
            background: var(--sage-light);
            color: var(--sage-dark);
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== MAIN LAYOUT ===== */
        .app-main {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ===== STEP INDICATOR ===== */
        .step-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 36px;
        }
        .step-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            border: 2px solid var(--border);
            background: white;
            color: var(--text-lighter);
        }
        .step-dot.active {
            border-color: var(--terra);
            background: var(--terra);
            color: white;
        }
        .step-dot.done {
            border-color: var(--sage);
            background: var(--sage);
            color: white;
        }
        .step-line {
            width: 60px;
            height: 2px;
            background: var(--border);
            transition: background 0.3s;
        }
        .step-line.active {
            background: var(--terra);
        }
        .step-line.done {
            background: var(--sage);
        }
        .step-labels {
            display: flex;
            justify-content: space-between;
            max-width: 360px;
            margin: 8px auto 0;
        }
        .step-label {
            font-size: 12px;
            color: var(--text-lighter);
            text-align: center;
            width: 80px;
        }
        .step-label.active {
            color: var(--terra);
            font-weight: 600;
        }
        .step-label.done {
            color: var(--sage-dark);
        }

        /* ===== SCENE CARDS ===== */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .section-desc {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }
        .scene-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .scene-card:hover {
            border-color: var(--terra);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .scene-card.selected {
            border-color: var(--terra);
            background: var(--terra-light);
        }
        .scene-card .scene-emoji {
            font-size: 28px;
            margin-bottom: 10px;
            display: block;
        }
        .scene-card .scene-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .scene-card .scene-hint {
            font-size: 12px;
            color: var(--text-lighter);
        }
        .scene-card .scene-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===== CUSTOM INPUT ===== */
        .custom-input-area {
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            border: 2px solid var(--border);
        }
        .custom-input-area label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        .custom-input-area textarea {
            width: 100%;
            min-height: 80px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        .custom-input-area textarea:focus {
            border-color: var(--terra);
        }
        .custom-input-area textarea::placeholder {
            color: var(--text-lighter);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--terra);
            color: white;
        }
        .btn-primary:hover {
            background: var(--terra-dark);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: var(--border);
            color: var(--text-lighter);
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: white;
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--terra);
            color: var(--terra);
        }
        .btn-sage {
            background: var(--sage);
            color: white;
        }
        .btn-sage:hover {
            background: var(--sage-dark);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        /* ===== LOADING ===== */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--terra);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 500;
        }
        .loading-sub {
            font-size: 13px;
            color: var(--text-lighter);
            margin-top: 8px;
        }
        .loading-steps {
            margin-top: 24px;
            text-align: left;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }
        .loading-step {
            padding: 8px 0;
            font-size: 13px;
            color: var(--text-lighter);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .loading-step.done { color: var(--sage-dark); }
        .loading-step.active { color: var(--terra); font-weight: 600; }

        /* ===== REPORT ===== */
        .report {
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-header {
            background: linear-gradient(135deg, var(--terra-light), var(--gold-light));
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .report-header .report-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            background: var(--terra);
            color: white;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .report-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .report-header .report-summary {
            font-size: 14px;
            color: var(--text-light);
        }

        .report-section {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
        }
        .report-section h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .report-section p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
            line-height: 1.8;
        }

        /* Framework card inside report */
        .framework-card {
            background: var(--cream);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border-left: 4px solid var(--terra);
        }
        .framework-card .fw-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--terra-dark);
        }
        .framework-card .fw-origin {
            font-size: 12px;
            color: var(--text-lighter);
            margin-bottom: 8px;
        }
        .framework-card .fw-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.7;
        }

        /* Action items */
        .action-list {
            list-style: none;
        }
        .action-list li {
            padding: 14px 16px;
            background: var(--sage-light);
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .action-list li .action-num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--sage);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .action-list li .action-text {
            flex: 1;
        }
        .action-list li .action-text strong {
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .action-list li .action-text span {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Talk template */
        .talk-template {
            background: var(--lavender-light);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 12px 0;
            border-left: 4px solid var(--lavender);
            font-size: 14px;
            line-height: 1.8;
            color: var(--text);
        }
        .talk-template .talk-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--lavender-dark);
            margin-bottom: 6px;
        }

        /* Risk warning */
        .risk-box {
            background: #FFF5F5;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 12px 0;
            border-left: 4px solid #E57373;
        }
        .risk-box .risk-label {
            font-size: 12px;
            font-weight: 600;
            color: #C62828;
            margin-bottom: 6px;
        }
        .risk-box p {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Insight box */
        .insight-box {
            background: var(--gold-light);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 12px 0;
            border-left: 4px solid var(--gold);
        }
        .insight-box .insight-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-dark);
            margin-bottom: 6px;
        }

        /* ===== FRAMEWORK LIBRARY ===== */
        .lib-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .lib-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            border: 1.5px solid var(--border);
        }
        .lib-card .lib-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 12px;
        }
        .lib-card h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .lib-card .lib-author {
            font-size: 12px;
            color: var(--text-lighter);
            margin-bottom: 8px;
        }
        .lib-card p {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.6;
        }

        /* ===== PAGE VIEWS ===== */
        .page-view { display: none; }
        .page-view.active { display: block; }

        /* ===== NAV TABS ===== */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1.5px solid var(--border);
        }
        .nav-tab {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s;
            font-family: inherit;
        }
        .nav-tab.active {
            background: var(--terra);
            color: white;
        }
        .nav-tab:hover:not(.active) {
            background: var(--terra-light);
            color: var(--terra);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            transition: transform 0.3s;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .app-main { padding: 20px 16px; }
            .scene-grid { grid-template-columns: 1fr 1fr; }
            .lib-grid { grid-template-columns: 1fr; }
            .step-line { width: 36px; }
            .report-header { padding: 20px; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="app-header">
    <div class="app-logo">
        <div class="logo-icon">CEO</div>
        <div class="logo-text">家庭<span>CEO</span>决策助手</div>
    </div>
    <div class="header-badge">Beta</div>
</header>

<!-- Main -->
<main class="app-main">

    <!-- Nav Tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('diagnose')">困境诊断</button>
        <button class="nav-tab" onclick="switchTab('library')">框架库</button>
    </div>

    <!-- ===== DIAGNOSE VIEW ===== -->
    <div id="view-diagnose" class="page-view active">

        <!-- Step Bar -->
        <div class="step-bar">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-line" id="line1"></div>
            <div class="step-dot" id="dot2">2</div>
            <div class="step-line" id="line2"></div>
            <div class="step-dot" id="dot3">3</div>
        </div>
        <div class="step-labels">
            <div class="step-label active" id="label1">选择困境</div>
            <div class="step-label" id="label2">框架诊断</div>
            <div class="step-label" id="label3">行动方案</div>
        </div>

        <!-- Step 1: Select Scene -->
        <div id="step1" class="page-view active" style="margin-top: 24px;">
            <div class="section-title">你正在经历哪个家庭困境？</div>
            <div class="section-desc">选择一个最让你头疼的场景，或者自己描述</div>

            <div class="scene-grid" id="sceneGrid"></div>

            <div class="custom-input-area">
                <label>或者，用你自己的话描述困境：</label>
                <textarea id="customInput" placeholder="比如：老公下班就知道打游戏，家务都是我做，说了也不听……"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnDiagnose" disabled onclick="startDiagnosis()">开始诊断 →</button>
            </div>
        </div>

        <!-- Step 2: Loading / Analyzing -->
        <div id="step2" class="page-view" style="margin-top: 24px;">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在用管理学框架分析你的困境……</div>
                <div class="loading-sub">这可能需要几秒钟</div>
                <div class="loading-steps" id="loadingSteps">
                    <div class="loading-step active" id="ls1">🔍 识别问题本质……</div>
                    <div class="loading-step" id="ls2">📐 匹配管理学框架……</div>
                    <div class="loading-step" id="ls3">📋 生成行动方案……</div>
                </div>
            </div>
        </div>

        <!-- Step 3: Report -->
        <div id="step3" class="page-view" style="margin-top: 24px;"></div>
    </div>

    <!-- ===== LIBRARY VIEW ===== -->
    <div id="view-library" class="page-view">
        <div class="section-title">管理学框架库</div>
        <div class="section-desc">每个框架都是一位大师的智慧结晶，我们把它翻译成了家庭语言</div>
        <div class="lib-grid" id="libGrid"></div>
    </div>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const SCENES = [
    {
        id: 'homework',
        emoji: '📚',
        name: '辅导作业崩溃',
        hint: '吼完后悔，不吼焦虑',
        tag: '高频',
        tagColor: '#FFF0E0',
        tagText: '#C97B5A',
        description: '孩子磨蹭2小时写不完作业，我忍不住吼了，吼完又后悔，但不吼又焦虑他越来越差。',
        frameworks: ['separation', 'parkinsons', 'choice_architecture'],
        diagnosis: {
            essence: '你把孩子的课题变成了你的课题。辅导作业的核心矛盾不是「孩子不自觉」，而是「边界模糊」——该孩子承担的后果，被你提前扛走了。',
            frameworks: [
                {
                    name: '课题分离',
                    origin: '阿德勒心理学',
                    desc: '分清「这是谁的课题」。作业是孩子的课题，你过度介入，孩子就失去了自主性和内驱力。你的课题是提供环境和支持，而不是替他完成任务。'
                },
                {
                    name: '帕金森定律',
                    origin: 'C. Northcote Parkinson',
                    desc: '工作会自动膨胀，占满所有可用时间。给孩子2小时，他就会写2小时；给40分钟，他也能写完。时间边界决定了效率边界。'
                },
                {
                    name: '选择架构',
                    origin: 'Richard Thaler（诺贝尔经济学奖）',
                    desc: '通过改变默认选项和环境设计来引导行为，而非强制命令。把「去写作业」变成「先写语文还是先写数学」，给孩子选择权而不是命令。'
                }
            ],
            actions: [
                { title: '划定时间边界', desc: '和孩子约定：每天作业时间固定40-60分钟，时间到就收，写不完由他承担后果（老师批评比你说一万遍有用）' },
                { title: '用选择架构替代命令', desc: '不说「快去写作业」，改说「你想先写语文还是数学？」——给选择权，减少对抗' },
                { title: '退出「监工」角色', desc: '从「坐在旁边盯着」改为「写完叫我检查」——空间距离=心理距离，让他为自己负责' }
            ],
            talkTemplate: '「宝贝，妈妈相信你能自己安排好作业。从今天开始，你决定先写哪一科、什么时候写，写完了叫我。如果在X点前没写完，那就明天自己去跟老师解释，好吗？」',
            risk: '刚开始孩子可能真的不写，这时候要忍住不插手——让他体验自然后果，比你催一百遍更有效。短期成绩可能波动，但长期能培养自主性。',
            insight: '你不是在「管作业」，你是在培养一个能自我管理的人。短期的「不管」换来的是长期的「不用管」。'
        }
    },
    {
        id: 'partner',

// ===== STATE =====
let selectedScene = null;
let currentStep = 1;

// ===== RENDER =====
function renderScenes() {
    const grid = document.getElementById('sceneGrid');
    grid.innerHTML = SCENES.map(s => `
        <div class="scene-card" data-id="${s.id}" onclick="selectScene('${s.id}')">
            <span class="scene-tag" style="background:${s.tagColor};color:${s.tagText}">${s.tag}</span>
            <span class="scene-emoji">${s.emoji}</span>
            <div class="scene-name">${s.name}</div>
            <div class="scene-hint">${s.hint}</div>
        </div>
    `).join('');
}

function renderLibrary() {
    const grid = document.getElementById('libGrid');
    grid.innerHTML = FRAMEWORKS.map(f => `
        <div class="lib-card">
            <div class="lib-icon" style="background:${f.color}20;color:${f.color}">${f.emoji}</div>
            <h4>${f.name}</h4>
            <div class="lib-author">${f.author}</div>
            <p>${f.desc}</p>
        </div>
    `).join('');
}

// ===== INTERACTIONS =====
function selectScene(id) {
    selectedScene = id;
    document.querySelectorAll('.scene-card').forEach(c => {
        c.classList.toggle('selected', c.dataset.id === id);
    });
    document.getElementById('customInput').value = '';
    document.getElementById('btnDiagnose').disabled = false;
}

function switchTab(tab) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('view-diagnose').classList.toggle('active', tab === 'diagnose');
    document.getElementById('view-library').classList.toggle('active', tab === 'library');
}

function goToStep(step) {
    currentStep = step;
    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('dot' + i);
        const label = document.getElementById('label' + i);
        dot.className = 'step-dot' + (i < step ? ' done' : i === step ? ' active' : '');
        label.className = 'step-label' + (i < step ? ' done' : i === step ? ' active' : '');
        if (i < 3) {
            const line = document.getElementById('line' + i);
            line.className = 'step-line' + (i < step ? ' done' : i === step ? ' active' : '');
        }
    }
    document.getElementById('step1').classList.toggle('active', step === 1);
    document.getElementById('step2').classList.toggle('active', step === 2);
    document.getElementById('step3').classList.toggle('active', step === 3);
}

async function startDiagnosis() {
    const customText = document.getElementById('customInput').value.trim();

    if (!selectedScene && !customText) {
        showToast('请选择一个困境场景，或自己描述');
        return;
    }

    goToStep(2);

    // Simulate loading
    const steps = ['ls1', 'ls2', 'ls3'];
    for (let i = 0; i < steps.length; i++) {
        document.getElementById(steps[i]).className = 'loading-step active';
        await sleep(800);
        document.getElementById(steps[i]).className = 'loading-step done';
    }
    await sleep(400);

    // Generate report
    let report;
    if (selectedScene) {
        report = SCENES.find(s => s.id === selectedScene).diagnosis;
    } else {
        // Match custom input to best scene
        report = matchCustomInput(customText);
    }

    renderReport(report);
    goToStep(3);
}

function matchCustomInput(text) {
    // Simple keyword matching
    const keywords = {
        homework: ['作业', '辅导', '磨蹭', '写作业', '学习', '成绩'],
        partner: ['老公', '丈夫', '队友', '家务', '不做', '摆烂', '打游戏', '都行'],
        elder: ['公公', '婆婆', '长辈', '老人', '越界', '育儿观念', '午睡'],
        time: ['时间', '精力', '忙', '碎片', '不够用', '做不完'],
        finance: ['钱', '财务', '花钱', '炒股', '存款', '工资', '账'],
        perfect: ['完美', '不够好', '自责', '内疚', '什么都想', '做不到'],
        worklife: ['职场', '工作', '加班', '平衡', '两头', '顾不过来'],
        emotion: ['情绪', '后悔', '崩溃', '焦虑', '内耗', '吼', '吵架']
    };

    let bestMatch = 'homework';
    let bestScore = 0;
    for (const [id, words] of Object.entries(keywords)) {
        const score = words.filter(w => text.includes(w)).length;
        if (score > bestScore) {
            bestScore = score;
            bestMatch = id;
        }
    }

    return SCENES.find(s => s.id === bestMatch).diagnosis;
}

                <button class="btn btn-secondary" onclick="goToStep(1); selectedScene=null; document.querySelectorAll('.scene-card').forEach(c=>c.classList.remove('selected')); document.getElementById('customInput').value=''; document.getElementById('btnDiagnose').disabled=true;">← 重新诊断</button>
                <button class="btn btn-sage" onclick="showToast('报告已保存（演示功能）')">保存报告 📋</button>
            </div>

}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// ===== INIT =====
renderScenes();
renderLibrary();

// Enable diagnose button when custom input has content
document.getElementById('customInput').addEventListener('input', function() {
    if (this.value.trim()) {
        document.getElementById('btnDiagnose').disabled = false;
        selectedScene = null;
        document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('selected'));
    } else if (!selectedScene) {
        document.getElementById('btnDiagnose').disabled = true;
    }
});
</script>
