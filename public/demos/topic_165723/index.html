const RecruitPage = () => {
  const [activeTab, setActiveTab] = useState('hunt');
  const [expandedProfile, setExpandedProfile] = useState(null);
  const [selectedOfferId, setSelectedOfferId] = useState(1);

    offerLetter: {
      title: '录用通知书',
      content: `致 ${candidate.candidateName}：

经我司面试考核及综合评估，现正式录用您担任 ${candidate.position} 一职。具体条款如下：

一、薪资待遇
   · 税前月薪：按Offer模板对应级别执行
   · 绩效奖金：按公司绩效考核制度执行
   · 年终奖金：根据公司经营状况及个人绩效评定

二、福利待遇
   · 五险一金：按国家及地方规定足额缴纳
   · 带薪年假：按国家规定执行
   · 其他福利：节日福利、年度体检、员工活动等
