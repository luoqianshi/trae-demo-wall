<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拾光集 ShineBox - 手机版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Bricolage Grotesque', 'Noto Sans SC', 'sans-serif'],
            body: ['Noto Sans SC', 'sans-serif'],
          },
          colors: {
            space: '#0B0C15',
            spaceLight: '#141622',
            neon: '#06B6D4',
            violet: '#7C3AED',
            azure: '#2563EB',
          },
          animation: {
            'slide-up': 'slideUp 0.3s ease-out',
            'fade-in': 'fadeIn 0.2s ease-out',
            'pulse-slow': 'pulse 5s cubic-bezier(0.4,0,0.6,1) infinite',
          },
          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0B0C15; color: #E2E8F0; overflow: hidden; }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glass-strong {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .text-gradient {
      background: linear-gradient(135deg, #A78BFA 0%, #60A5FA 50%, #22D3EE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="font-body antialiased flex items-center justify-center min-h-screen p-4">

  <!-- 手机外壳 -->

                </div>
                <div>

                </div>

        <!-- 时间轴页 -->

          <div class="px-4 py-4">
            <h1 class="font-display font-bold text-xl text-white mb-4">收藏时间轴</h1>
            <div id="timelineList" class="relative pl-6 space-y-6">

        <!-- 我的页 -->

          <div class="px-4 py-4">
            <!-- 用户信息 -->

              <div class="w-14 h-14 rounded-full bg-gradient-to-br from-violet to-azure flex items-center justify-center text-white font-display font-bold text-xl">
                S
              </div>

                <h2 class="font-display font-bold text-white">拾光集用户</h2>
                <p class="text-xs text-white/50">shinebox@example.com</p>

              <div class="glass rounded-xl p-3 text-center">
                <p class="font-display font-bold text-xl text-white" id="statDays">0</p>

              </div>
              <div class="glass rounded-xl p-3 text-center">
                <p class="font-display font-bold text-xl text-white" id="statTypes">0</p>

            <!-- 菜单 -->

      </div>

      <!-- 底部导航栏 -->

            <i data-lucide="home" class="w-6 h-6"></i>
            <span>首页</span>
          </button>
          <button onclick="switchTab('collection')" class="tab-btn flex flex-col items-center gap-1 text-xs text-white/40 hover:text-neon transition" data-tab="collection">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>

          </button>

            </div>
          </button>
          <button onclick="switchTab('timeline')" class="tab-btn flex flex-col items-center gap-1 text-xs text-white/40 hover:text-neon transition" data-tab="timeline">
            <i data-lucide="clock" class="w-6 h-6"></i>
            <span>时间轴</span>
          </button>
          <button onclick="switchTab('profile')" class="tab-btn flex flex-col items-center gap-1 text-xs text-white/40 hover:text-neon transition" data-tab="profile">

            <span>我的</span>

      <!-- Toast -->
      <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 px-5 py-2 rounded-full glass-strong border-neon/30 text-xs text-white opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i data-lucide="check" class="w-3 h-3 text-neon"></i>
        <span id="toastMsg">已收藏</span>

  <script>
    const TYPE_CONFIG = {
      news: { label: '新闻', icon: 'newspaper', color: 'text-cyan-400', bg: 'bg-cyan-500/20', border: 'border-cyan-500/20' },
      video: { label: '视频', icon: 'play-circle', color: 'text-fuchsia-400', bg: 'bg-fuchsia-500/20', border: 'border-fuchsia-500/20' },
      music: { label: '音乐', icon: 'music', color: 'text-rose-400', bg: 'bg-rose-500/20', border: 'border-rose-500/20' },
      blog: { label: '博客', icon: 'file-text', color: 'text-emerald-400', bg: 'bg-emerald-500/20', border: 'border-emerald-500/20' },
      image: { label: '图片', icon: 'image', color: 'text-amber-400', bg: 'bg-amber-500/20', border: 'border-amber-500/20' },
      podcast: { label: '播客', icon: 'mic', color: 'text-indigo-400', bg: 'bg-indigo-500/20', border: 'border-indigo-500/20' }
    };

    const DOMAIN_RULES = [
      { hosts: ['bilibili.com','b23.tv','youtube.com','youtu.be','douyin.com','kuaishou.com'], type: 'video', platform: '视频平台' },
      { hosts: ['music.163.com','y.qq.com','spotify.com','music.apple.com'], type: 'music', platform: '音乐平台' },
      { hosts: ['zhihu.com','weibo.com','twitter.com','x.com'], type: 'news', platform: '资讯社区' },
      { hosts: ['mp.weixin.qq.com','juejin.cn','csdn.net','medium.com','substack.com'], type: 'blog', platform: '内容平台' },
      { hosts: ['xiaohongshu.com','instagram.com','pinterest.com','unsplash.com'], type: 'image', platform: '图片社区' },
      { hosts: ['xiaoyuzhoufm.com','anchor.fm','podcasts.apple.com'], type: 'podcast', platform: '播客平台' }
    ];

    const TITLES = {
      news: ['2026 年 AI 产业十大趋势', '深夜必读：产品经理的思考框架', '全球科技周报'],
      video: ['令人心动的城市旅拍', '10 分钟看懂量子计算', '这支 MV 也太治愈了'],
      music: ['夏日 playlist：傍晚散步专用', 'loops 采样背后的秘密', '本周新歌推荐'],
      blog: ['如何建立个人知识管理系统', '独立开发者的 100 天', '设计系统的最佳实践'],
      image: ['极简桌面布置灵感', '街头摄影精选', 'UI 配色方案参考'],
      podcast: ['一场关于专注力的对话', '创业早期最常见的 5 个错误', '文化类播客推荐']
    };

    let items = JSON.parse(localStorage.getItem('shinebox_items') || 'null') || [
      { id: '1', title: '2026 年 AI 产业十大趋势', url: 'https://zhihu.com/question/ai-trends', platform: '知乎', type: 'news', createdAt: Date.now() - 86400000 * 2 },
      { id: '2', title: '令人心动的城市旅拍', url: 'https://bilibili.com/video/city-walk', platform: 'Bilibili', type: 'video', createdAt: Date.now() - 86400000 * 1.5 },
      { id: '3', title: '夏日 playlist：傍晚散步专用', url: 'https://music.163.com/playlist/summer', platform: '网易云音乐', type: 'music', createdAt: Date.now() - 86400000 * 1 },
      { id: '4', title: '如何建立个人知识管理系统', url: 'https://mp.weixin.qq.com/knowledge-system', platform: '微信公众号', type: 'blog', createdAt: Date.now() - 43200000 },
      { id: '5', title: '极简桌面布置灵感', url: 'https://xiaohongshu.com/desk-setup', platform: '小红书', type: 'image', createdAt: Date.now() - 18000000 },
      { id: '6', title: '一场关于专注力的对话', url: 'https://xiaoyuzhoufm.com/focus-talk', platform: '小宇宙', type: 'podcast', createdAt: Date.now() - 7200000 }
    ];

    function save() { localStorage.setItem('shinebox_items', JSON.stringify(items)); }

    function classify(url) {
      try {
        const host = new URL(url).hostname.replace(/^www\./, '');
        for (const rule of DOMAIN_RULES) {
          if (rule.hosts.some(h => host.includes(h))) return rule;
        }
      } catch {}
      const fallbackTypes = ['news','video','music','blog','image','podcast'];
      return { type: fallbackTypes[Math.floor(Math.random() * fallbackTypes.length)], platform: '网页链接' };
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diff = now.getTime() - ts;
      if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
      return `${d.getMonth()+1}月${d.getDate()}日`;
    }

    function switchTab(tab) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${tab}`).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('text-neon'));
      const btn = document.querySelector(`[data-tab="${tab}"]`);
      if (btn) btn.classList.add('text-neon');
      renderAll();
    }

    function renderRecentList() {
      const list = document.getElementById('recentList');
      const sorted = [...items].sort((a,b) => b.createdAt - a.createdAt).slice(0,5);
      list.innerHTML = sorted.map(item => {
        const cfg = TYPE_CONFIG[item.type];
        return `
          <div class="glass rounded-xl p-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg ${cfg.bg} flex items-center justify-center ${cfg.color}">
              <i data-lucide="${cfg.icon}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm text-white truncate">${item.title}</h4>
              <p class="text-xs text-white/40">${item.platform} · ${formatTime(item.createdAt)}</p>
            </div>
            <button onclick="openItem('${item.url}')" class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center">
              <i data-lucide="external-link" class="w-4 h-4 text-white/50"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderCategoryStats() {
      const container = document.getElementById('categoryStats');
      container.innerHTML = Object.entries(TYPE_CONFIG).map(([key, cfg]) => {
        const count = items.filter(i => i.type === key).length;
        return `
          <div class="glass rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg ${cfg.bg} flex items-center justify-center ${cfg.color}">
                <i data-lucide="${cfg.icon}" class="w-4 h-4"></i>
              </div>
              <span class="text-sm text-white">${cfg.label}</span>
            </div>
            <span class="text-sm font-display font-bold text-white/80">${count}</span>
          </div>
        `;
      }).join('');
    }

    function renderCollectionList() {
      const list = document.getElementById('collectionList');
      const sorted = [...items].sort((a,b) => b.createdAt - a.createdAt);
      list.innerHTML = sorted.map(item => {
        const cfg = TYPE_CONFIG[item.type];
        return `
          <div class="glass rounded-xl p-4 flex items-start gap-3">
            <div class="w-9 h-9 rounded-lg ${cfg.bg} flex items-center justify-center ${cfg.color} flex-shrink-0">
              <i data-lucide="${cfg.icon}" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm text-white font-medium mb-1">${item.title}</h4>
              <div class="flex items-center gap-2 text-xs text-white/40">
                <span>${item.platform}</span>
                <span>·</span>
                <span>${formatTime(item.createdAt)}</span>
              </div>
            </div>
            <button onclick="openItem('${item.url}')" class="w-8 h-8 rounded-lg bg-gradient-to-r from-violet/20 to-azure/20 flex items-center justify-center">
              <i data-lucide="chevron-right" class="w-4 h-4 text-white/70"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderTimeline() {
      const list = document.getElementById('timelineList');
      const sorted = [...items].sort((a,b) => b.createdAt - a.createdAt);
      list.innerHTML = '<div class="absolute left-2 top-0 bottom-0 w-px bg-gradient-to-b from-violet via-azure to-transparent"></div>' + sorted.map(item => {
        const cfg = TYPE_CONFIG[item.type];
        return `
          <div class="relative pl-4">
            <div class="absolute left-0 top-1 w-4 h-4 rounded-full ${cfg.bg} ${cfg.border} border flex items-center justify-center">
              <i data-lucide="${cfg.icon}" class="w-2.5 h-2.5 ${cfg.color}"></i>
            </div>
            <div class="glass rounded-xl p-3">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs text-white/50">${item.platform}</span>
                <span class="text-xs text-white/30">·</span>
                <span class="text-xs text-white/50">${formatTime(item.createdAt)}</span>
              </div>
              <h4 class="text-sm text-white">${item.title}</h4>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = items.length;
      document.getElementById('statTotal').textContent = items.length;
      const types = new Set(items.map(i => i.type)).size;
      document.getElementById('statTypes').textContent = types;
      document.getElementById('statDays').textContent = 15;
    }

    function openItem(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2200);
    }

    function addItem(url) {
      if (!url.trim()) return showToast('请输入链接');
      let valid = false;
      try { new URL(url.trim()); valid = true; } catch {}
      if (!valid) return showToast('链接格式不正确');
      const rule = classify(url.trim());
      const titles = TITLES[rule.type];
      items.unshift({
        id: Date.now().toString() + Math.random().toString(36).slice(2,6),
        title: titles[Math.floor(Math.random() * titles.length)],
        url: url.trim(),
        platform: rule.platform,
        type: rule.type,
        createdAt: Date.now()
      });
      save();
      renderAll();
      showToast('已添加到收藏');
    }

    function showCategory(type) {
      switchTab('collection');
    }

    function renderAll() {
      renderRecentList();
      renderCategoryStats();
      renderCollectionList();
      renderTimeline();
      updateStats();
      lucide.createIcons();
    }

    document.getElementById('homeAddBtn').addEventListener('click', () => {
      addItem(document.getElementById('homeInput').value);
      document.getElementById('homeInput').value = '';
    });
    document.getElementById('homeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addItem(e.target.value);
        e.target.value = '';
      }
    });
    document.getElementById('addSubmitBtn').addEventListener('click', () => {
      addItem(document.getElementById('addInput').value);
      document.getElementById('addInput').value = '';
      switchTab('home');
    });

    switchTab('home');
  </script>
</body>
</html>
