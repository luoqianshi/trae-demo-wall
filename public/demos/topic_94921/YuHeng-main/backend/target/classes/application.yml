server:
  port: 8080

spring:
  application:
    name: mind-asset-hedging-engine

  datasource:
    url: jdbc:h2:file:./data/hedgingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 1000ms

hedging:
  ai:
    # OpenAI 兼容接口配置；默认使用 OpenAI，可替换为国内大模型兼容地址
    api-key: ${OPENAI_API_KEY:sk-YOUR_API_KEY_HERE}
    base-url: ${OPENAI_BASE_URL:https://api.siliconflow.cn/v1}
    model-name: ${OPENAI_MODEL_NAME:deepseek-ai/DeepSeek-V3}
    temperature: 0.2
    timeout-seconds: 60

  strategy:
    # 同一 IP 对方案投票/使用的去重 TTL（小时），防止刷票
    vote-ip-ttl-hours: 24

logging:
  level:
    com.hedging.engine: DEBUG
    dev.langchain4j: DEBUG
