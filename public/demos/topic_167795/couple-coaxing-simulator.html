<!-- ========== Animated Background ========== -->
<div class="bg-layer" id="bgLayer"></div>

<!-- ========== Screen 1: Start ========== -->
<div class="screen active" id="startScreen">
  <div class="card fade-in">
    <div style="text-align:center;">
      <div class="game-title">哄哄模拟器</div>
      <div class="start-subtitle">AI 情侣互动小游戏 - 你能哄好你的另一半吗？</div>
    </div>

    <h3>选择伴侣性别</h3>
    <div class="selection-grid">
      <div class="selection-card" data-gender="female" onclick="selectGender('female')">
        <span class="icon">👩</span>
        <span class="label">女朋友</span>
      </div>
      <div class="selection-card" data-gender="male" onclick="selectGender('male')">
        <span class="icon">👨</span>
        <span class="label">男朋友</span>
      </div>
    </div>

    <h3>选择吵架场景</h3>

// ========== Game State ==========
const gameState = {
  gender: null,
  scenario: null,
  currentRound: 0,
  totalRounds: 10,
  affection: 30,
  maxAffection: 100,
  history: [],
  gameOver: false,
  voiceEnabled: true,
  partnerName: '',
  partnerAvatar: '',
  playerAvatar: '😎'
};

// ========== Initialization ==========
function init() {
  createBackgroundHearts();
  renderScenarios();
}

function createBackgroundHearts() {
  const layer = document.getElementById('bgLayer');
  const hearts = ['❤', '💕', '💗', '💖', '💘'];
  for (let i = 0; i < 20; i++) {
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (16 + Math.random() * 20) + 'px';
    heart.style.animationDuration = (8 + Math.random() * 12) + 's';
    heart.style.animationDelay = Math.random() * 10 + 's';
    layer.appendChild(heart);
  }
}

function renderScenarios() {
  const list = document.getElementById('scenarioList');
  list.innerHTML = SCENARIOS.map(s => `
    <div class="scenario-item" data-scenario="${s.id}" data-difficulty="${s.difficulty}" onclick="selectScenario('${s.id}')">
      <span class="s-icon">${s.icon}</span>
      <div class="s-info">
        <div class="s-name">${s.name}</div>
        <div class="s-desc">${s.desc}</div>
      </div>
      <span class="s-diff ${s.difficulty}">${s.diffLabel}</span>
    </div>
  `).join('');
}

// ========== Difficulty Filter ==========
function filterDifficulty(diff) {
  // Update tag states
  document.querySelectorAll('.diff-tag').forEach(t => t.classList.remove('active'));
  document.querySelector(`.diff-tag[data-diff="${diff}"]`).classList.add('active');

  // Filter scenario items
  document.querySelectorAll('.scenario-item').forEach(item => {
    const itemDiff = item.dataset.difficulty;
    if (diff === 'all' || itemDiff === diff) {
      item.classList.remove('scenario-item-hidden');
    } else {
      item.classList.add('scenario-item-hidden');
    }
  });

  // If the currently selected scenario is hidden, deselect it
  if (gameState.scenario) {
    const selectedItem = document.querySelector(`.scenario-item[data-scenario="${gameState.scenario.id}"]`);
    if (selectedItem && selectedItem.classList.contains('scenario-item-hidden')) {
      selectedItem.classList.remove('selected');
      gameState.scenario = null;
      checkStartReady();
    }
  }
}

// ========== Selection Functions ==========
function selectGender(gender) {
  gameState.gender = gender;
  gameState.partnerName = gender === 'female' ? '她' : '他';
  gameState.partnerAvatar = gender === 'female' ? '👩' : '👨';
  
  document.querySelectorAll('.selection-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.selection-card[data-gender="${gender}"]`).classList.add('selected');
  checkStartReady();
}

function selectScenario(id) {
  gameState.scenario = SCENARIOS.find(s => s.id === id);
  
  document.querySelectorAll('.scenario-item').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.scenario-item[data-scenario="${id}"]`).classList.add('selected');
  checkStartReady();
}

function checkStartReady() {
  document.getElementById('startBtn').disabled = !(gameState.gender && gameState.scenario);
}

// ========== Game Flow ==========
function startGame() {
  if (!gameState.gender || !gameState.scenario) return;
  
  // Reset state
  gameState.currentRound = 0;
  gameState.affection = 30;
  gameState.history = [];
  gameState.gameOver = false;
  
  // Switch screens
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('endingOverlay').classList.remove('active');
  document.getElementById('historyToggle').classList.add('show');
  document.getElementById('voiceToggle').classList.add('show');
  
  // Set scenario name
  document.getElementById('scenarioName').textContent = gameState.scenario.icon + ' ' + gameState.scenario.name;
  
  // Clear dialogue
  document.getElementById('dialogueArea').innerHTML = '';
  
  // Show intro
  addDialogue('action', gameState.scenario.intro);
  
  // Start first round after a delay
  setTimeout(() => {
    showRound();
  }, 1500);
}

function showRound() {
  if (gameState.currentRound >= gameState.totalRounds || gameState.gameOver) {
    endGame();
    return;
  }
  
  const round = gameState.scenario.rounds[gameState.currentRound];
  
  // Update round info
  document.getElementById('roundInfo').textContent = `第 ${gameState.currentRound + 1} / ${gameState.totalRounds} 轮`;
  
  // Add partner dialogue
  addDialogue('partner', round.dialogue);
  
  // TTS
  if (gameState.voiceEnabled) {
    setTimeout(() => speakDialogue(round.dialogue), 500);
  }
  
  // Show choices after a delay
  setTimeout(() => {
    showChoices(round.choices);
  }, gameState.voiceEnabled ? 1500 : 800);
}

function showChoices(choices) {
  const area = document.getElementById('choicesArea');
  const letters = ['A', 'B', 'C', 'D'];
  
  // Shuffle choices but keep score data
  const shuffled = [...choices].sort(() => Math.random() - 0.5);
  
  area.innerHTML = shuffled.map((c, i) => `
    <button class="choice-btn" onclick="makeChoice(this, ${c.score})" data-score="${c.score}">
      <span class="choice-letter">${letters[i]}</span>
      <span>${c.text}</span>
    </button>
  `).join('');
}

function makeChoice(btn, score) {
  if (gameState.gameOver) return;
  
  // Disable all buttons
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('disabled');
    const s = parseInt(b.dataset.score);
    if (s > 0) b.classList.add('correct');
    else if (s < 0) b.classList.add('wrong');
  });
  
  // Highlight selected
  if (score > 0) btn.classList.add('correct');
  else if (score < 0) btn.classList.add('wrong');
  
  // Update affection
  const oldAffection = gameState.affection;
  gameState.affection = Math.max(0, Math.min(100, gameState.affection + score));
  
  // Show score popup
  showScorePopup(score);
  
  // Update UI
  updateAffectionBar();
  
  // Add player dialogue
  const selectedText = btn.querySelector('span:last-child').textContent;
  addDialogue('player', selectedText);
  
  // Add to history
  gameState.history.push({
    round: gameState.currentRound + 1,
    choice: selectedText,
    score: score,
    affection: gameState.affection
  });
  
  // Show partner response
  const round = gameState.scenario.rounds[gameState.currentRound];
  if (round.response) {
    setTimeout(() => {
      addDialogue('partner', round.response);
      if (gameState.voiceEnabled) {
        speakDialogue(round.response);
      }
    }, 800);
  }
  
  // Check win/lose conditions
  if (gameState.affection >= 100) {
    setTimeout(() => {
      gameState.gameOver = true;
      endGame();
    }, 1500);
    return;
  }
  
  if (gameState.affection <= 0) {
    setTimeout(() => {
      gameState.gameOver = true;
      endGame();
    }, 1500);
    return;
  }
  
  // Next round
  gameState.currentRound++;
  setTimeout(() => {
    document.getElementById('choicesArea').innerHTML = '';
    if (!gameState.gameOver) {
      showRound();
    }
  }, 2500);
}

function showScorePopup(score) {
  const popup = document.createElement('div');
  popup.className = 'score-popup ' + (score > 0 ? 'positive' : 'negative');
  popup.textContent = score > 0 ? `+${score}` : `${score}`;
  popup.style.left = '50%';
  popup.style.top = '40%';
  popup.style.transform = 'translateX(-50%)';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1200);
}

function updateAffectionBar() {
  const pct = gameState.affection;
  const bar = document.getElementById('affectionBar');
  const value = document.getElementById('affectionValue');
  const emotion = document.getElementById('emotionText');
  
  bar.style.width = pct + '%';
  value.textContent = pct + ' / 100';
  
  if (pct < 20) {
    bar.style.background = 'linear-gradient(90deg, #ff4d6a, #ff9a56)';
  } else if (pct < 40) {
    bar.style.background = 'linear-gradient(90deg, var(--danger), var(--accent3))';
  } else if (pct < 60) {
    bar.style.background = 'linear-gradient(90deg, var(--accent3), var(--accent))';
  } else if (pct < 80) {
    bar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';
  } else {
    bar.style.background = 'linear-gradient(90deg, var(--accent2), var(--success))';
  }
  
  // Get emotion stage
  const stageIndex = Math.min(Math.floor(pct / 10), gameState.scenario.emotionStages.length - 1);
  emotion.textContent = gameState.scenario.emotionStages[stageIndex];
  
  // Update history panel
  updateHistoryPanel();
}

function addDialogue(type, text) {
  const area = document.getElementById('dialogueArea');
  const bubble = document.createElement('div');
  
  if (type === 'action') {
    bubble.className = 'dialogue-action';
    bubble.textContent = text;
  } else if (type === 'partner') {
    bubble.className = 'dialogue-bubble partner';
    bubble.innerHTML = `
      <div class="dialogue-avatar">${gameState.partnerAvatar}</div>
      <div class="dialogue-content">${text}</div>
    `;
  } else {
    bubble.className = 'dialogue-bubble player';
    bubble.innerHTML = `
      <div class="dialogue-avatar">${gameState.playerAvatar}</div>
      <div class="dialogue-content">${text}</div>
    `;
  }
  
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
}

// ========== TTS ==========
function speakDialogue(text) {
  if (!('speechSynthesis' in window)) return;
  
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  
  // Filter out action descriptions (text in parentheses)
  const cleanText = text.replace(/[（(][^）)]*[）)]/g, '').trim();
  if (!cleanText) return;
  
  const utterance = new SpeechSynthesisUtterance(cleanText);
  
  // Set language based on content (Chinese)
  utterance.lang = 'zh-CN';
  utterance.rate = 0.95;
  utterance.pitch = gameState.gender === 'female' ? 1.3 : 0.85;
  
  // Try to find a suitable voice
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.startsWith('zh'));
  if (zhVoice) utterance.voice = zhVoice;
  
  window.speechSynthesis.speak(utterance);
}

function toggleVoice() {
  gameState.voiceEnabled = !gameState.voiceEnabled;
  const btn = document.getElementById('voiceBtn');
  btn.textContent = gameState.voiceEnabled ? '🔊 语音开启' : '🔇 语音关闭';
  
  if (!gameState.voiceEnabled) {
    window.speechSynthesis.cancel();
  }
}

// ========== End Game ==========
function endGame() {
  gameState.gameOver = true;
  window.speechSynthesis.cancel();
  
  const overlay = document.getElementById('endingOverlay');
  overlay.classList.add('active');
  
  const success = gameState.affection >= 70;
  const perfect = gameState.affection >= 90;
  
  // Set ending content
  document.getElementById('endingIcon').textContent = perfect ? '👑' : success ? '💕' : '💔';
  
  const titleEl = document.getElementById('endingTitle');
  titleEl.className = 'ending-title ' + (success ? 'success' : 'fail');
  
  if (perfect) {
    titleEl.textContent = '完美通关！哄人大师！';
  } else if (success) {
    titleEl.textContent = '哄好了！危机解除！';
  } else if (gameState.affection >= 40) {
    titleEl.textContent = '勉强及格...还需努力';
  } else {
    titleEl.textContent = '哄失败了...冷战开始';
  }
  
  const descEl = document.getElementById('endingDesc');
  if (success) {
    descEl.textContent = gameState.gender === 'female' 
      ? '你的温柔和真诚终于打动了她，她决定再给你一次机会。好好珍惜这份感情吧！'
      : '你的体贴和耐心终于融化了他，他决定不再计较。好好维护这段关系吧！';
  } else {
    descEl.textContent = gameState.gender === 'female'
      ? '她转身离去，留下你一个人在原地...也许下次该多花些心思？'
      : '他沉默地走开了，背影写满了失望...也许下次该更用心一些？';
  }
  
  document.getElementById('endingScore').textContent = `最终好感度：${gameState.affection}`;
  
  // Effects
  const effectsEl = document.getElementById('endingEffects');
  effectsEl.innerHTML = '';
  
  if (success) {
    createConfetti(effectsEl);
  } else {
    createRain(effectsEl);
  }
  
  // TTS for ending
  if (gameState.voiceEnabled) {
    setTimeout(() => {
      speakDialogue(success 
        ? `恭喜你成功哄好了你的${gameState.gender === 'female' ? '女朋友' : '男朋友'}！好感度达到${gameState.affection}！`
        : `很遗憾，你没能哄好你的${gameState.gender === 'female' ? '女朋友' : '男朋友'}，好感度只有${gameState.affection}。`
      );
    }, 1000);
  }
  
  // Hide share card initially
  document.getElementById('shareCard').style.display = 'none';
}

function createConfetti(container) {
  container.innerHTML = '<div class="confetti-container"></div>';
  const confettiBox = container.querySelector('.confetti-container');
  const colors = ['#ff6b9d', '#c44dff', '#ff9a56', '#4dff91', '#ffeb3b', '#00e5ff'];
  
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.style.animationDelay = Math.random() * 2 + 's';
    confettiBox.appendChild(c);
  }
}

function createRain(container) {
  container.innerHTML = '<div class="rain-container"></div>';
  const rainBox = container.querySelector('.rain-container');
  
  for (let i = 0; i < 40; i++) {
    const r = document.createElement('div');
    r.className = 'raindrop';
    r.style.left = Math.random() * 100 + '%';
    r.style.height = (20 + Math.random() * 30) + 'px';
    r.style.animationDuration = (0.8 + Math.random() * 1.2) + 's';
    r.style.animationDelay = Math.random() * 2 + 's';
    rainBox.appendChild(r);
  }
}

function replayGame() {
  window.speechSynthesis.cancel();
  document.getElementById('endingOverlay').classList.remove('active');
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('historyToggle').classList.remove('show');
  document.getElementById('voiceToggle').classList.remove('show');
  document.getElementById('historyPanel').classList.remove('open');
  
  // Reset selections
  gameState.gender = null;
  gameState.scenario = null;
  document.querySelectorAll('.selection-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.scenario-item').forEach(c => c.classList.remove('selected'));
  document.getElementById('startBtn').disabled = true;
  
  document.getElementById('startScreen').classList.add('active');
}

function shareResult() {
  const shareCard = document.getElementById('shareCard');
  const shareText = document.getElementById('shareText');
  
  const success = gameState.affection >= 70;
  const scenarioName = gameState.scenario.name;
  const genderText = gameState.gender === 'female' ? '女朋友' : '男朋友';
  
  shareText.textContent = `我在「哄哄模拟器」中挑战了「${scenarioName}」场景，${success ? '成功哄好了' : '没能哄好'}我的${genderText}！最终好感度：${gameState.affection}/100 💕 敢来试试你的哄人功力吗？`;
  
  shareCard.style.display = 'block';
}

function copyShareText() {
  const text = document.getElementById('shareText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '✅ 已复制！';
    setTimeout(() => btn.textContent = originalText, 2000);
  }).catch(() => {
    // Fallback
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    textarea.remove();
  });
}

// ========== History Panel ==========
function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('open');
}

function updateHistoryPanel() {
  const content = document.getElementById('historyContent');
  content.innerHTML = gameState.history.map(h => `
    <div class="history-item">
      <span class="round-tag">第${h.round}轮</span>
      <div style="margin-top:4px;">${h.choice}</div>
      <span class="score-tag ${h.score > 0 ? 'positive' : 'negative'}">${h.score > 0 ? '+' : ''}${h.score}</span>
    </div>
  `).reverse().join('');
}

// ========== Voices Loading ==========
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function() {
    window.speechSynthesis.getVoices();
  };
}

// ========== Start ==========
window.addEventListener('DOMContentLoaded', init);
</script>
