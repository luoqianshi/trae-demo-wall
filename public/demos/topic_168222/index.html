<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>农民工讨薪起诉状生成工具</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #6d28d9;
      --primary-soft: #f4edff;
      --primary-strong: #5b21b6;
      --warning: #d97706;
      --warning-bg: #fff7ed;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --info-bg: #f3f4f6;
      --shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, #f8f8fc 0%, var(--bg) 100%);
      color: var(--text);
    }

    .shell {
      padding: 40px 20px 56px;
    }

    .card {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 28px 24px;
    }

    .app-heading {
      max-width: 800px;
      margin: 0 auto 18px;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: #111827;
    }

    /* 封面页 */
    .cover-card {
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 40px;
    }

    .cover-name {
      margin: 0 0 22px;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 700;
      color: #111827;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(109, 40, 217, 0.45);
      background: rgba(109, 40, 217, 0.06);
    }

    .cover-title {
      margin: 0;
      font-size: 48px;
      line-height: 1.35;
      font-weight: 800;
      color: #111827;
      letter-spacing: 0.01em;
      max-width: 580px;
    }

    .cover-actions {
      margin-top: 42px;
      display: flex;
      justify-content: center;
    }

    .cover-start-btn {
      min-width: 220px;
      min-height: 64px;
      padding: 16px 28px;
      border: none;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 16px 30px rgba(109, 40, 217, 0.22);
    }

    .cover-start-btn:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(109, 40, 217, 0.26);
    }

    /* 顶栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .page-indicator {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    .progress {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #ede9fe;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #7c3aed 0%, var(--primary) 100%);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    /* 通用按钮基础 */
    .ghost-btn,
    .nav-btn,
    .primary-btn,
    .option-btn,
    .skip-btn,
    .idk-btn {
      font: inherit;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .ghost-btn {
      border: 1px solid var(--line);
      background: #fafafa;
      color: var(--muted);
      padding: 10px 14px;
    }

    .ghost-btn:hover {
      border-color: #d1d5db;
      color: #374151;
      background: #f4f4f5;
    }

    /* 模块标签 & 标题 */
    .module-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .title {
      margin: 0;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 700;
    }

    .description {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    /* 输入组件 */
    .input-wrap {
      margin-bottom: 18px;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .date-hint {
      margin-top: -6px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .other-inline {
      margin-top: 10px;
    }

    .text-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .text-input:focus {
      border-color: rgba(109, 40, 217, 0.8);
      box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.12);
    }

    .text-input::placeholder {
      color: #9ca3af;
    }

    .select-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      appearance: none;
    }

    .select-input:focus {
      border-color: rgba(109, 40, 217, 0.8);
      box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.12);
    }

    /* 选项按钮 */
    .options {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      border: 1.5px solid #d1d5db;
      background: #fff;
      color: var(--text);
      padding: 15px 16px;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
    }

    .option-btn:hover {
      border-color: rgba(109, 40, 217, 0.55);
      background: #faf7ff;
      transform: translateY(-1px);
    }

    .option-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
      box-shadow: inset 0 0 0 1px rgba(109, 40, 217, 0.18);
    }

    .option-title {
      display: block;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .option-desc {
      display: block;
      font-size: 13px;
      color: #6b7280;
    }

    /* "我不知道"按钮样式 */
    .idk-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    .idk-btn:hover {
      border-color: #cbd5e1;
      color: #374151;
      background: #f8fafc;
    }

    .idk-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    /* 消息提示 */
    .message {
      margin: 14px 0 0;
      padding: 12px 14px;
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      background: var(--info-bg);
      color: #4b5563;
    }

    .message.warning {
      border-left-color: var(--warning);
      background: var(--warning-bg);
      color: #9a5b05;
    }

    .message.error {
      border-left-color: var(--danger);
      background: var(--danger-bg);
      color: #b91c1c;
    }

    /* 操作按钮区 */
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .actions-left,
    .actions-right,
    .inline-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-btn,
    .primary-btn,
    .skip-btn {
      padding: 12px 18px;
      border: 1px solid transparent;
      font-size: 15px;
      min-width: 116px;
      justify-content: center;
      display: inline-flex;
      align-items: center;
    }

    .nav-btn {
      background: #f8fafc;
      border-color: #d1d5db;
      color: #374151;
    }

    .nav-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .primary-btn {
      background: var(--primary);
      color: #fff;
    }

    .primary-btn:hover {
      background: var(--primary-strong);
    }

    .primary-btn:disabled,
    .nav-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .skip-btn {
      background: #fff;
      border-color: #e5e7eb;
      color: var(--muted);
      min-width: auto;
    }

    .skip-btn:hover {
      border-color: #cbd5e1;
      color: #374151;
      background: #f8fafc;
    }

    .skip-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    /* 预览卡片 */
    .preview-card {
      background: #fcfcff;
      border: 1px solid #ece8ff;
      border-radius: 16px;
      padding: 22px;
      margin-top: 18px;
    }

    .preview-title {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
    }

    .petition {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.95;
      font-size: 16px;
      color: #111827;
      font-family: "Songti SC", "STSong", "SimSun", serif;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .muted-line {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Toast 提示（日期校验警告用） */
    .toast-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .toast-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px 22px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .toast-box .toast-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #111827;
    }

    .toast-box .toast-msg {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 22px;
    }

    .toast-box .toast-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .toast-box .toast-btn {
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .toast-box .toast-btn-cancel {
      background: #f1f5f9;
      border-color: #d1d5db;
      color: #374151;
    }

    .toast-box .toast-btn-cancel:hover {
      background: #e2e8f0;
    }

    .toast-box .toast-btn-confirm {
      background: var(--primary);
      color: #fff;
    }

    .toast-box .toast-btn-confirm:hover {
      background: var(--primary-strong);
    }

    /* 隐藏身份证号输入框后的提示 */
    .id-unknown-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--primary-soft);
      border: 1px solid rgba(109, 40, 217, 0.25);
      border-radius: 12px;
      color: var(--primary-strong);
      font-size: 14px;
      font-weight: 600;
    }

    /* 响应式 */
    @media (max-width: 820px) {
      .shell {
        padding: 24px 14px 32px;
      }

      .card {
        padding: 20px 18px;
      }

      .app-heading {
        font-size: 20px;
        margin-bottom: 14px;
      }

      .title {
        font-size: 22px;
      }

      .cover-card {
        min-height: 480px;
        padding: 32px 18px;
      }

      .cover-name {
        font-size: 22px;
        margin-bottom: 18px;
      }

      .cover-title {
        font-size: 34px;
      }

      .cover-start-btn {
        width: 100%;
        min-width: 0;
        font-size: 22px;
      }

      .select-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        align-items: stretch;
      }

      .actions-left,
      .actions-right {
        width: 100%;
      }

      .actions-right .nav-btn,
      .actions-right .primary-btn,
      .actions-left .nav-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app-heading">农民工讨薪起诉状生成工具</div>
    <main class="card" id="app" aria-live="polite"></main>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer"></div>

  <script>
    /* ============================
       表单初始数据
    ============================ */
    const initialForm = {
      work_type: "",
      work_location: "",
      project_name: "",
      job_type: [],
      job_type_other: "",
      start_time: "",
      // 结算流程 - 分支
      has_iou: "",              // "有" / "没有"
      other_evidence: "",        // "有，微信聊天记录" / "有，其他（下方填空）" / "没有"
      other_evidence_text: "",   // 用户自定义证据内容
      // 结算流程 - 共用步骤（分支A / 分支B-1）
      settlement_time: "",
      settlement_amount: "",
      paid_amount: "",
      payment_time: "",
      unpaid_amount: "",
      // 结算流程 - 分支B-2 专用
      estimated_amount: "",
      unpaid_amount_b2: "",
      // 原告信息
      plaintiff_name: "",
      plaintiff_id_number: "",
      plaintiff_address: "",
      plaintiff_phone: "",
      // 被告信息
      defendant_name: "",
      defendant_phone: "",
      defendant_id_number: "",
      defendant_id_unknown: false,
      defendant_gender: "",
      defendant_birth_date: "",
      defendant_birth_unknown: false,
      defendant_address: "",
      // 法院信息
      court_name: ""
    };

    /* ============================
       工种选项列表
    ============================ */
    const jobOptions = [
      "木工", "模板工", "钢筋工", "混凝土工", "电工", "水电工", "焊工", "砌筑工/瓦工",
      "抹灰工", "架子工", "防水工", "管道工", "油漆工", "玻璃工", "起重工", "塔吊指挥/信号工",
      "机械司机", "安装工", "装饰装修工", "门窗工", "幕墙工", "石材工", "杂工/小工", "其他"
    ];

    /* ============================
       日期选择器：年份和月份选项
    ============================ */
    const todayStr = new Date().toISOString().split("T")[0]; // 当天日期，用于 max 属性

    const yearOptions = Array.from({ length: 31 }, function (_, index) {
      return String(2000 + index);
    }).reverse();

    const monthOptions = Array.from({ length: 12 }, function (_, index) {
      return String(index + 1);
    });

    /* ============================
       所有步骤定义
       showWhen: 函数(form) => boolean，决定该步骤是否可见
    ============================ */
    const allSteps = [
      // ==================== 适用范围 ====================
      {
        key: "work_type",
        module: "适用范围",
        title: "先看看你的情况能不能用",
        description: "这版只支持纯劳务。要是你既出力又出材料，这版先处理不了。",
        type: "radio",
        required: true,
        options: [
          { value: "我只出力干活", title: "我只出力干活", desc: "这种情况可以继续往下填。" },
          { value: "我既出力也出材料", title: "我既出力也出材料", desc: "这版暂时帮不上，你可以先重新选择。" }
        ],
        showWhen: function () { return true; }
      },

      // ==================== 干活情况 ====================
      {
        key: "work_location",
        module: "干活情况",
        title: "你是在哪里干活的？",
        description: "就写工地、项目地点，尽量写具体一点，后面更好用。",
        type: "text",
        required: true,
        placeholder: "比如：北京市朝阳区某小区工地",
        showWhen: function () { return true; }
      },
      {
        key: "project_name",
        module: "干活情况",
        title: "这个工程或项目叫什么？",
        description: "知道就填，不清楚可以先留空。",
        type: "text",
        required: false,
        placeholder: "比如：XX花园二期项目",
        showWhen: function () { return true; }
      },
      {
        key: "job_type",
        module: "干活情况",
        title: "你干的是什么活？",
        description: "能选几个就选几个。要是没有合适的，就在「其他」里填写。",
        type: "multi_select",
        required: true,
        options: jobOptions.map(function (item) { return { value: item, title: item }; }),
        showWhen: function () { return true; }
      },
      {
        key: "start_time",
        module: "干活情况",
        title: "你大概是从什么时候开始干活的？",
        description: "直接选年份、月份、日期就行。",
        type: "date_select",
        required: true,
        dateRequiredLevel: "month",
        showWhen: function () { return true; }
      },

      // ==================== 结算情况 - 分支入口 ====================
      {
        key: "has_iou",
        module: "结算情况",
        title: "有没有欠条/结算单？",
        description: "如果双方结算后写了欠条或者签了结算单，就选「有」。",
        type: "radio",
        required: true,
        options: [
          { value: "有", title: "有", desc: "有欠条或者结算单。" },
          { value: "没有", title: "没有", desc: "没有写欠条，也没有结算单。" }
        ],
        showWhen: function () { return true; }
      },
      // 分支B - 当"没有欠条"时，询问有没有其他证据
      {
        key: "other_evidence",
        module: "结算情况",
        title: "有没有其他证据证明欠款？",
        description: "比如微信聊天记录里对方承认了欠你钱，或者其他能证明的材料。",
        type: "radio",
        required: true,
        options: [
          { value: "有，微信聊天记录", title: "有，微信聊天记录", desc: "微信里对方承认了欠款。" },
          { value: "有，其他（下方填空）", title: "有，其他（下方填空）", desc: "有别的证据，选择后请填写具体内容。" },
          { value: "没有", title: "没有", desc: "没有任何能证明欠款的材料。" }
        ],
        showWhen: function (form) { return form.has_iou === "没有"; }
      },
      // 当选"有，其他"时，需要填写具体证据内容
      {
        key: "other_evidence_text",
        module: "结算情况",
        title: "请说明你有什么证据",
        description: "简单写一下是什么证据，比如「有录音」或者「有工友证明」等。",
        type: "text",
        required: true,
        placeholder: "比如：有当时结算的录音",
        showWhen: function (form) { return form.has_iou === "没有" && form.other_evidence === "有，其他（下方填空）"; }
      },

      // ==================== 结算流程 - 共用步骤（分支A / 分支B-1 共用） ====================
      {
        key: "settlement_time",
        module: "结算情况",
        title: "你们是什么时候结算的？",
        description: "直接选年份、月份、日期。想不起来可以先跳过。",
        type: "date_select",
        required: false,
        dateRequiredLevel: "month",
        canSkip: true,
        skipLabel: "我不知道，先跳过",
        showWhen: function (form) {
          return form.has_iou === "有" || (form.has_iou === "没有" && form.other_evidence !== "没有" && form.other_evidence !== "");
        }
      },
      {
        key: "settlement_amount",
        module: "结算情况",
        title: "你们最后结算的总金额是多少？",
        description: "只填数字，不要写单位。",
        type: "number",
        required: true,
        placeholder: "比如：18000",
        showWhen: function (form) {
          return form.has_iou === "有" || (form.has_iou === "没有" && form.other_evidence !== "没有" && form.other_evidence !== "");
        }
      },

      // ==================== 分支B-2 专用步骤：应付款项（放在 paid_amount 之前） ====================
      {
        key: "estimated_amount",

    /* ============================
       应用状态
    ============================ */
    const state = {
      form: deepClone(initialForm),
      dateDrafts: {},     // 日期选择器的草稿值 { key: { year, month, day } }
      visitedSteps: new Set(),  // 记录已访问的步骤key，支持返回
      currentIndex: 0,
      view: "cover",      // "cover" | "form" | "unsupported" | "preview"
      error: ""
    };

    const app = document.getElementById("app");

    /* ============================
       工具函数
    ============================ */

    /** 深拷贝对象 */
    function deepClone(obj) {
      var result = {};
      for (var k in obj) {
        if (obj.hasOwnProperty(k)) {
          if (Array.isArray(obj[k])) {
            result[k] = obj[k].slice();
          } else {
            result[k] = obj[k];
          }
        }
      }
      return result;
    }

    /** HTML 转义 */
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /** 判断是否为空 */
    function isBlank(value) {
      return String(value || "").trim() === "";
    }

    /** 判断是否为有效数字 */
    function isValidNumber(value) {
      return /^\d+(\.\d+)?$/.test(String(value).trim());
    }

    /** 判断是否为有效手机号 */
    function isValidPhone(value) {
      return /^1\d{10}$/.test(String(value).trim());
    }

    /** 判断是否为有效18位身份证号 */
    function isValidId(value) {
      return /^\d{17}[\dXx]$/.test(String(value || "").trim());
    }

    /** 从身份证号提取性别 */
    function extractGenderFromId(idNumber) {
      var id = String(idNumber || "").trim();
      if (!isValidId(id)) return "";
      var char17 = id.charAt(16);
      var num = parseInt(char17, 10);
      if (isNaN(num)) return "";
      return num % 2 === 1 ? "男" : "女";
    }

    /** 从身份证号提取出生年月日（中文格式） */
    function extractBirthFromId(idNumber) {
      var id = String(idNumber || "").trim();
      if (!isValidId(id)) return "";
      var year = id.substring(6, 10);
      var month = id.substring(10, 12);
      var day = id.substring(12, 14);
      return year + "年" + parseInt(month, 10) + "月" + parseInt(day, 10) + "日";
    }

    /** 从身份证号提取出生年月日（组件格式） */
    function extractBirthPartsFromId(idNumber) {
      var id = String(idNumber || "").trim();
      if (!isValidId(id)) return null;
      return {
        year: id.substring(6, 10),
        month: String(parseInt(id.substring(10, 12), 10)),
        day: String(parseInt(id.substring(12, 14), 10))
      };
    }

    /** 解析中文日期字符串 "2024年3月15日" → { year, month, day } */
    function parseDateParts(value) {
      var match = String(value || "").match(/^(\d{4})年(\d{1,2})月(?:(\d{1,2})日)?$/);
      if (!match) {
        return { year: "", month: "", day: "" };
      }
      return {
        year: match[1],
        month: String(Number(match[2])),
        day: match[3] ? String(Number(match[3])) : ""
      };
    }

    /** 构建中文日期字符串 */
    function buildDateValue(parts) {
      if (!parts.year || !parts.month) return "";
      return parts.year + "年" + parts.month + "月" + (parts.day ? parts.day + "日" : "");
    }

    /** 获取某年某月的天数 */
    function getDaysInMonth(year, month) {
      if (!year || !month) return 31;
      return new Date(Number(year), Number(month), 0).getDate();
    }

    /** 获取日期选择器的草稿值 */
    function getDateDraft(step) {
      if (state.form[step.key] === "未付款") {
        return { year: "", month: "", day: "" };
      }
      ensureDateDraft(step.key);
      return state.dateDrafts[step.key];
    }

    /** 确保日期草稿已初始化 */
    function ensureDateDraft(key) {
      if (state.dateDrafts[key]) return;
      var parsed = parseDateParts(state.form[key]);
      state.dateDrafts[key] = { year: parsed.year, month: parsed.month, day: parsed.day };
    }

    /** 判断特殊动作是否被选中 */
    function isSpecialActionSelected(step, actionValue) {
      return state.form[step.key] === actionValue;
    }

    /** 格式化金额 */
    function formatMoney(value) {
      var num = Number(value || 0);
      if (Number.isInteger(num)) return String(num);
      return num.toFixed(2).replace(/\.?0+$/, "");
    }

    /** 获取工种文本 */
    function getJobTypeText() {
      var selected = Array.isArray(state.form.job_type) ? state.form.job_type.slice() : [];
      var namedJobs = selected.filter(function (item) { return item !== "其他"; });
      if (selected.indexOf("其他") !== -1 && !isBlank(state.form.job_type_other)) {
        namedJobs.push(state.form.job_type_other.trim());
      }
      return namedJobs.join("、");
    }

    /** 格式化项目地点描述 */
    function formatProjectPart(projectName, workLocation) {
      var trimmedName = String(projectName || "").trim();
      var trimmedLocation = String(workLocation || "").trim();
      if (!trimmedName) return "在" + trimmedLocation;
      if (/[项目工程]$/.test(trimmedName)) {
        return "在" + trimmedName + "（位于" + trimmedLocation + "）";
      }
      return "在" + trimmedName + "项目（位于" + trimmedLocation + "）";
    }

    /** 获取当前日期文本 */
    function getCurrentDateText() {
      var now = new Date();
      return now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
    }

    /* ============================
       步骤可见性逻辑
    ============================ */

    /** 获取当前可见的步骤列表 */
    function getVisibleSteps() {
      return allSteps.filter(function (step) {
        return step.showWhen(state.form);
      });
    }

    /** 获取当前步骤 */
    function getCurrentStep() {
      var visible = getVisibleSteps();
      return visible[state.currentIndex];
    }

    /** 获取总页数（可见步骤数 + 1 个预览页） */
    function getTotalPages() {
      return getVisibleSteps().length + 1;
    }

    /* ============================
       当前分支判断
    ============================ */
    function getBranch() {
      var f = state.form;
      if (f.has_iou === "有") return "A";       // 有欠条
      if (f.other_evidence === "没有") return "B2"; // 没有任何证据
      if (f.other_evidence === "" || f.other_evidence === undefined) return "unknown";
      return "B1"; // 有其他证据
    }

    /* ============================
       日期校验：付款时间 vs 结算时间
    ============================ */
    function checkPaymentTimeWarning(step, callback) {
      // 只在"最后一次付款时间"步骤且两个日期都有效时校验
      if (step.key !== "payment_time") {
        callback();
        return;
      }

      var settlementTime = state.form.settlement_time;
      var paymentTime = state.form.payment_time;

      // 如果结算时间为空或付款时间为空或"未付款"，不校验
      if (isBlank(settlementTime) || isBlank(paymentTime) || paymentTime === "未付款") {
        callback();
        return;
      }

      // 比较日期先后
      var sParts = parseDateParts(settlementTime);
      var pParts = parseDateParts(paymentTime);
      var sDate = new Date(Number(sParts.year), Number(sParts.month) - 1, Number(sParts.day || 1));
      var pDate = new Date(Number(pParts.year), Number(pParts.month) - 1, Number(pParts.day || 1));

      if (pDate < sDate) {
        // 付款时间早于结算时间，弹出警告
        showToast(
          "提醒：付款时间早于结算时间，请确认是否正确。",
          "继续",
          "返回修改",
          function () {
            // 用户选择继续
            callback();
          },
          function () {
            // 用户选择返回修改，不做任何操作
          }
        );
      } else {
        callback();
      }
    }

    /* ============================
       Toast 弹窗
    ============================ */
    function showToast(msg, confirmText, cancelText, onConfirm, onCancel) {
      var container = document.getElementById("toastContainer");
      var overlay = document.createElement("div");
      overlay.className = "toast-overlay";
      overlay.innerHTML =
        '<div class="toast-box">' +
          '<div class="toast-title">时间确认</div>' +
          '<p class="toast-msg">' + escapeHtml(msg) + '</p>' +
          '<div class="toast-actions">' +
            '<button class="toast-btn toast-btn-cancel" id="toastCancel">' + escapeHtml(cancelText) + '</button>' +
            '<button class="toast-btn toast-btn-confirm" id="toastConfirm">' + escapeHtml(confirmText) + '</button>' +
          '</div>' +
        '</div>';

      container.appendChild(overlay);

      document.getElementById("toastCancel").addEventListener("click", function () {
        container.removeChild(overlay);
        if (onCancel) onCancel();
      });

      document.getElementById("toastConfirm").addEventListener("click", function () {
        container.removeChild(overlay);
        if (onConfirm) onConfirm();
      });
    }

    /* ============================
       起诉状文书生成
    ============================ */
    function buildPetitionText() {
      var form = state.form;
      var branch = getBranch();

      // --- 法院名称 ---
      var courtName = form.court_name.trim() || "______人民法院";

      // --- 原告信息（含性别和出生日期） ---
      var plaintiffParts = ["原告：" + form.plaintiff_name.trim()];

      // 从原告身份证号提取性别和出生日期
      var plaintiffGender = extractGenderFromId(form.plaintiff_id_number);
      var plaintiffBirth = extractBirthFromId(form.plaintiff_id_number);

      if (plaintiffGender) plaintiffParts.push(plaintiffGender);
      if (plaintiffBirth) plaintiffParts.push(plaintiffBirth + "出生");

      plaintiffParts.push("身份证号：" + form.plaintiff_id_number.trim());
      plaintiffParts.push("住址：" + form.plaintiff_address.trim());
      plaintiffParts.push("电话：" + form.plaintiff_phone.trim() + "。");

      // --- 被告信息 ---
      var defendantParts = ["被告：" + form.defendant_name.trim()];

      // 被告性别
      var defendantGender = "";
      if (isValidId(form.defendant_id_number)) {
        defendantGender = extractGenderFromId(form.defendant_id_number);
      } else {
        defendantGender = form.defendant_gender || "";
      }
      if (defendantGender) defendantParts.push(defendantGender);

      // 被告出生年月日（仅身份证号未知时需要手动填写）
      var defendantBirth = "";
      var defendantBirthUnknown = false;
      if (isValidId(form.defendant_id_number)) {
        defendantBirth = extractBirthFromId(form.defendant_id_number);
      } else if (form.defendant_birth_unknown || isBlank(form.defendant_birth_date)) {
        defendantBirthUnknown = true;
      } else {
        defendantBirth = form.defendant_birth_date;
      }

      if (defendantBirth) {
        defendantParts.push(defendantBirth + "出生");
      } else if (defendantBirthUnknown) {
        defendantParts.push("出生年月不详");
      }

      // 被告身份证号
      if (!isBlank(form.defendant_id_number)) {
        defendantParts.push("身份证号：" + form.defendant_id_number.trim());
      } else {
        defendantParts.push("身份证号不详");
      }

      // 被告住址
      if (!isBlank(form.defendant_address)) {
        defendantParts.push("住址：" + form.defendant_address.trim());
      } else {
        defendantParts.push("住址不详");
      }

      defendantParts.push("电话：" + form.defendant_phone.trim() + "。");

      // --- 项目信息 ---
      var projectPart = formatProjectPart(form.project_name, form.work_location);

      // --- 诉讼请求中的未付款金额（分支B-2用unpaid_amount_b2） ---
      var unpaidAmount = (branch === "B2") ? form.unpaid_amount_b2 : form.unpaid_amount;

      // --- 事实与理由 ---
      var factLines = [];

      // 开头：干活情况
      factLines.push(
        form.start_time.trim() + "起，被告雇佣原告" + projectPart + "提供" + getJobTypeText() + "劳务（包工不包料）。"
      );

      if (branch === "A") {
        // 分支A：有欠条
        var settlementSentenceA = "";
        if (!isBlank(form.settlement_time)) {
          settlementSentenceA = "于" + form.settlement_time.trim() + "，双方进行了结算，确认劳务费总计" + formatMoney(form.settlement_amount) + "元。双方结算后形成了结算单（欠条）。";
        } else {
          settlementSentenceA = "双方进行了结算，确认劳务费总计" + formatMoney(form.settlement_amount) + "元。双方结算后形成了结算单（欠条）。";
        }
        factLines.push(settlementSentenceA);

      } else if (branch === "B1") {
        // 分支B-1：有微信/其他证据
        var evidenceDesc = "";
        if (form.other_evidence === "有，微信聊天记录") {
          evidenceDesc = "微信聊天记录";
        } else {
          evidenceDesc = form.other_evidence_text.trim();
        }

        var settlementSentenceB1 = "";
        if (!isBlank(form.settlement_time)) {
          settlementSentenceB1 = "于" + form.settlement_time.trim() + "，双方进行了结算。";
        }
        factLines.push("双方通过" + evidenceDesc + "确认劳务款为" + formatMoney(form.settlement_amount) + "元。" + settlementSentenceB1);

      } else if (branch === "B2") {
        // 分支B-2：没有任何证据
        factLines.push("双方未做结算，原告认为被告应付" + formatMoney(form.estimated_amount) + "元。");
      }

      // 付款情况
      var hasNoPaymentMarker = form.payment_time === "未付款";
      var paymentSentence = "";

      if (branch === "B2") {
        // 分支B-2 的付款表述（使用 unpaid_amount_b2）
        if (Number(form.paid_amount) === 0) {
          paymentSentence = "被告未向原告支付任何款项，尚欠" + formatMoney(form.unpaid_amount_b2) + "元未付。";
        } else if (isBlank(form.payment_time) || hasNoPaymentMarker) {
          paymentSentence = "被告向原告支付" + formatMoney(form.paid_amount) + "元，尚欠" + formatMoney(form.unpaid_amount_b2) + "元未付。";
        } else {
          paymentSentence = "被告于" + form.payment_time.trim() + "向原告支付" + formatMoney(form.paid_amount) + "元，尚欠" + formatMoney(form.unpaid_amount_b2) + "元未付。";
        }
      } else {
        // 分支A 和 B-1 的付款表述
        if (Number(form.paid_amount) === 0) {
          paymentSentence = "结算后，被告未向原告支付任何款项，尚欠" + formatMoney(form.unpaid_amount) + "元未付。";
        } else if (isBlank(form.payment_time) || hasNoPaymentMarker) {
          paymentSentence = "结算后，被告向原告支付" + formatMoney(form.paid_amount) + "元，尚欠" + formatMoney(form.unpaid_amount) + "元未付。";
        } else {
          paymentSentence = "结算后，被告于" + form.payment_time.trim() + "向原告支付" + formatMoney(form.paid_amount) + "元，尚欠" + formatMoney(form.unpaid_amount) + "元未付。";
        }
      }

      factLines.push(paymentSentence);

      // 结尾法律依据
      factLines.push("原告多次向被告催讨未果。被告拖欠劳务款的行为已侵害原告合法权益。为维护原告合法权益，根据《中华人民共和国民法典》《中华人民共和国民事诉讼法》相关规定，特向贵院提起诉讼，请依法判如所请。");

      // --- 拼接完整文书 ---
      return [
        "民事起诉状",
        "",
        plaintiffParts.join("，"),
        "",
        defendantParts.join("，"),
        "",
        "诉讼请求：",
        "1. 判令被告向原告支付劳务款" + formatMoney(unpaidAmount) + "元；",
        "2. 判令本案诉讼费用由被告承担。",
        "",
        "事实与理由：",
        factLines.join("\n\n"),
        "",
        "此致",
        courtName,
        "",
        "起诉人：" + form.plaintiff_name.trim(),
        getCurrentDateText()
      ].join("\n");
    }

    /** 获取风险提示列表 */
    function getRisks() {
      var items = [];
      if (isBlank(state.form.defendant_id_number) && !state.form.defendant_id_unknown) {
        items.push("被告身份证号没有填写，法院后续可能难以核实对方身份。");
      } else if (state.form.defendant_id_unknown) {
        items.push("被告身份证号未填写（已标记为未知），法院后续可能难以核实对方身份。");
      }
      if (isBlank(state.form.defendant_address)) {
        items.push("被告住址没有填写，法院可能联系不上对方或送达困难。");
      }
      if (isBlank(state.form.court_name)) {
        items.push("法院名称没有填写，文书里会先显示「______人民法院」。");
      }
      return items;
    }

    /* ============================
       表单字段操作
    ============================ */
    function setField(key, value, options) {
      var settings = Object.assign({ rerender: true, refocus: false }, options || {});
      state.form[key] = value;
      state.error = "";

      // 如果工种中取消了"其他"，清空自定义内容
      if (key === "job_type" && Array.isArray(value) && value.indexOf("其他") === -1) {
        state.form.job_type_other = "";
      }

      // 如果 payment_time 设为"未付款"，清空日期草稿
      if (key === "payment_time" && value === "未付款") {
        state.dateDrafts.payment_time = { year: "", month: "", day: "" };
      }

      // 如果已付款金额改为大于0，自动清除"未付款"状态
      if (key === "paid_amount" && isValidNumber(value) && Number(value) > 0 && state.form.payment_time === "未付款") {
        state.form.payment_time = "";
      }

      // 如果被告身份证号被填写了有效18位，清除"我不知道"标记
      if (key === "defendant_id_number" && isValidId(value)) {
        state.form.defendant_id_unknown = false;
      }

      // 如果被告身份证号从"我不知道"变回可编辑，自动从身份证号提取信息
      if (key === "defendant_id_number" && isValidId(value)) {
        var idParts = extractBirthPartsFromId(value);
        if (idParts) {
          state.dateDrafts["defendant_birth_date"] = { year: idParts.year, month: idParts.month, day: idParts.day };
          state.form.defendant_birth_date = buildDateValue(idParts);
        }
      }

      if (settings.rerender) {
        render();
      }

      if (settings.refocus) {
        focusPrimaryInput();
      }
    }

    /** 聚焦到当前步骤的主要输入 */
    function focusPrimaryInput() {
      var target = app.querySelector("[data-autofocus='true']");
      if (target) {
        target.focus();
        if (target.select && target.tagName === "INPUT") {
          target.select();
        }
      }
    }

    /* ============================
       步骤校验
    ============================ */
    function validateStep(step) {
      var rawValue = state.form[step.key];
      var value = Array.isArray(rawValue) ? rawValue : String(rawValue || "").trim();

      // 必填校验
      if (step.required && ((!Array.isArray(value) && !value) || (Array.isArray(value) && value.length === 0))) {
        return "这是必填项";
      }

      // 非必填且为空，通过
      if (!Array.isArray(value) && !value) {
        return "";
      }

      // 工种校验：选了"其他"需要填写
      if (step.key === "job_type") {
        var selectedList = Array.isArray(rawValue) ? rawValue : [];
        if (selectedList.indexOf("其他") !== -1 && isBlank(state.form.job_type_other)) {
          return "请在「其他」里写一下你具体干的活。";
        }
      }

      // 日期选择器校验
      if (step.type === "date_select" || step.type === "date_select_with_idk") {
        var parts = getDateDraft(step);
        var hasAny = Boolean(parts.year || parts.month || parts.day);
        if (step.required && (!parts.year || !parts.month)) {
          return "请把年份和月份选上。";
        }
        if (!step.required && !hasAny && !rawValue) {
          return "";
        }
        if (hasAny && (!parts.year || !parts.month)) {
          return "年份和月份是必选项。";
        }
      }

      // 数字输入校验
      var numberKeys = ["settlement_amount", "paid_amount", "unpaid_amount", "unpaid_amount_b2", "estimated_amount"];
      if (numberKeys.indexOf(step.key) !== -1 && !isValidNumber(value)) {
        return "这里要只填数字。";
      }

      // 手机号校验
      if ((step.key === "plaintiff_phone" || step.key === "defendant_phone") && !isValidPhone(value)) {
        return "手机号格式不太对，要填 11 位手机号。";
      }

      // 身份证号校验（仅在填写了内容时校验）
      if ((step.key === "plaintiff_id_number") && !isValidId(value)) {
        return "身份证号格式不太对，要填 18 位。";
      }

      if ((step.key === "defendant_id_number") && !isBlank(value) && !isValidId(value)) {
        return "身份证号格式不太对，要填 18 位。";
      }

      // 金额校验：结算总金额 = 已付款 + 欠款（分支A / B-1）
      if (step.key === "unpaid_amount") {
        var branch = getBranch();
        var settlement = Number(state.form.settlement_amount);
        var paid = Number(state.form.paid_amount);
        var unpaid = Number(state.form.unpaid_amount);

        if (Math.abs((paid + unpaid) - settlement) > 0.00001) {
          var shouldBe = settlement - paid;
          return "金额对不上，按你填的已付款算，欠款应该是 " + formatMoney(settlement - paid) + " 元。";
        }
      }

      // 金额校验：应付款项 = 已付款 + 欠款（分支B-2）
      if (step.key === "unpaid_amount_b2") {
        var estimated = Number(state.form.estimated_amount);
        var paidB2 = Number(state.form.paid_amount);
        var unpaidB2 = Number(state.form.unpaid_amount_b2);

        if (Math.abs((paidB2 + unpaidB2) - estimated) > 0.00001) {
          return "金额对不上，按你填的已付款算，欠款应该是 " + formatMoney(estimated - paidB2) + " 元。";
        }
      }

      return "";
    }

    /* ============================
       导航逻辑
    ============================ */
    function goNext() {
      if (state.view === "unsupported") return;

      var visibleSteps = getVisibleSteps();
      var step = visibleSteps[state.currentIndex];
      var error = validateStep(step);

      if (error) {
        state.error = error;
        render();
        focusPrimaryInput();
        return;
      }

      state.error = "";

      // 适用范围检查
      if (step.key === "work_type" && state.form.work_type === "我既出力也出材料") {
        state.view = "unsupported";
        render();
        return;
      }

      // 日期校验（付款时间 vs 结算时间）
      checkPaymentTimeWarning(step, function () {
        if (state.currentIndex >= visibleSteps.length - 1) {
          state.view = "preview";
          render();
          return;
        }

        state.currentIndex += 1;
        // 确保不超过可见步骤范围
        if (state.currentIndex >= visibleSteps.length) {
          state.currentIndex = visibleSteps.length - 1;
        }
        render();
        focusPrimaryInput();
      });
    }

    function goPrev() {
      if (state.view === "preview") {
        state.view = "form";
        state.currentIndex = getVisibleSteps().length - 1;
        render();
        focusPrimaryInput();
        return;
      }

      if (state.view === "unsupported") {
        state.view = "form";
        state.form.work_type = "";
        state.currentIndex = 0;
        state.error = "";
        render();
        focusPrimaryInput();
        return;
      }

      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        state.error = "";
        render();
        focusPrimaryInput();
      }
    }

    function skipCurrent() {
      var step = getCurrentStep();
      if (!step || !step.canSkip) return;

      state.form[step.key] = "";

      if (step.type === "date_select" || step.type === "date_select_with_idk") {
        state.dateDrafts[step.key] = { year: "", month: "", day: "" };
      }

      // 如果跳过的是被告出生日期，标记为未知
      if (step.key === "defendant_birth_date") {
        state.form.defendant_birth_unknown = true;
      }

      state.error = "";
      goNext();
    }

    function toggleMultiSelectValue(key, optionValue) {
      var currentList = Array.isArray(state.form[key]) ? state.form[key].slice() : [];
      var index = currentList.indexOf(optionValue);

      if (index === -1) {
        currentList.push(optionValue);
      } else {
        currentList.splice(index, 1);
      }

      setField(key, currentList);
    }

    function setDatePart(key, partKey, partValue) {
      ensureDateDraft(key);
      var currentParts = Object.assign({}, state.dateDrafts[key]);
      currentParts[partKey] = partValue;

      // 年份或月份变化时，检查日期是否超出范围
      if (partKey === "year" || partKey === "month") {
        var maxDay = getDaysInMonth(currentParts.year, currentParts.month);
        if (currentParts.day && Number(currentParts.day) > maxDay) {
          currentParts.day = "";
        }
      }

      state.dateDrafts[key] = currentParts;
      if (currentParts.year && currentParts.month) {
        setField(key, buildDateValue(currentParts));
      } else {
        setField(key, "", { rerender: true, refocus: false });
      }
    }

    function resetAll() {
      state.form = deepClone(initialForm);
      state.dateDrafts = {};
      state.visitedSteps = new Set();
      state.currentIndex = 0;
      state.view = "cover";
      state.error = "";
      render();
    }

    function startFlow() {
      state.view = "form";
      state.currentIndex = 0;
      state.error = "";
      render();
      focusPrimaryInput();
    }

    /* ============================
       渲染函数
    ============================ */

    /** 渲染顶栏（页码 + 进度条） */
    function renderTop(pageText, progressPercent) {
      return (
        '<div class="topbar">' +
          '<div class="page-indicator">' + pageText + '</div>' +
          '<button class="ghost-btn" id="resetBtn" type="button">重来</button>' +
        '</div>' +
        '<div class="progress" aria-hidden="true">' +
          '<div class="progress-bar" style="width: ' + progressPercent + '%"></div>' +
        '</div>'
      );
    }

    /** 渲染消息提示（描述、警告、错误） */
    function renderMessages(step) {
      var blocks = [];

      if (step.description) {
        blocks.push('<div class="message">' + escapeHtml(step.description) + '</div>');
      }

      if (step.warning) {
        blocks.push('<div class="message warning">' + escapeHtml(step.warning) + '</div>');
      }

      if (state.error) {
        blocks.push('<div class="message error">' + escapeHtml(state.error) + '</div>');
      }

      return blocks.join("");
    }

    /** 渲染步骤输入区域 */
    function renderInput(step) {
      var value = state.form[step.key] || "";

      // 单选按钮
      if (step.type === "radio") {
        return (
          '<div class="options">' +
            step.options.map(function (option) {
              var isActive = value === option.value ? "active" : "";
              return (
                '<button class="option-btn ' + isActive + '" type="button" data-option="' + escapeHtml(option.value) + '">' +
                  '<span class="option-title">' + escapeHtml(option.title) + '</span>' +
                  (option.desc ? '<span class="option-desc">' + escapeHtml(option.desc) + '</span>' : '') +
                '</button>'
              );
            }).join("") +
          '</div>'
        );
      }

      // 多选按钮
      if (step.type === "multi_select") {
        var selectedList = Array.isArray(value) ? value : [];
        return (
          '<div class="options">' +
            step.options.map(function (option) {
              var isActive = selectedList.indexOf(option.value) !== -1 ? "active" : "";
              return (
                '<button class="option-btn ' + isActive + '" type="button" data-option="' + escapeHtml(option.value) + '">' +
                  '<span class="option-title">' + escapeHtml(option.title) + '</span>' +
                '</button>'
              );
            }).join("") +
          '</div>' +
          (selectedList.indexOf("其他") !== -1 ?
            '<div class="other-inline">' +
              '<input class="text-input" type="text" data-other-input="job_type_other" data-autofocus="true" value="' + escapeHtml(state.form.job_type_other || "") + '" placeholder="请在这里写：你具体干的是什么活" />' +
            '</div>' : "")
        );
      }

      // 日期选择器（普通）
      if (step.type === "date_select") {
        return renderDateSelect(step);
      }

      // 日期选择器（带"我不知道"按钮）
      if (step.type === "date_select_with_idk") {
        var dateHtml = renderDateSelect(step);
        var idkActive = step.key === "defendant_birth_date" && state.form.defendant_birth_unknown ? "active" : "";
        return dateHtml +
          '<button class="idk-btn ' + idkActive + '" type="button" id="idkBtn">' + escapeHtml(step.skipLabel || "我不知道") + '</button>';
      }

      // 被告身份证号（特殊输入：带"我不知道"按钮）
      if (step.type === "defendant_id") {
        if (state.form.defendant_id_unknown) {
          // 身份证号标记为"未知"，显示提示和"重新填写"按钮
          return (
            '<div class="id-unknown-hint">身份证号：未知</div>' +
            '<button class="idk-btn" type="button" id="undoIdkBtn" style="margin-top: 10px;">我要填写身份证号</button>'
          );
        }
        return (
          '<div class="input-wrap">' +
            '<input class="text-input" type="text" data-input-key="defendant_id_number" data-autofocus="true" value="' + escapeHtml(value) + '" placeholder="' + escapeHtml(step.placeholder || "") + '" />' +
          '</div>' +
          '<button class="idk-btn" type="button" id="idkBtn">我不知道</button>'
        );
      }

      // 普通文本/数字输入
      var inputType = "text";
      var inputMode = step.type === "number" ? 'inputmode="decimal"' : "";

      return (
        '<div class="input-wrap">' +
          '<input class="text-input" type="' + inputType + '" ' + inputMode + ' data-input-key="' + step.key + '" data-autofocus="true" value="' + escapeHtml(value) + '" placeholder="' + escapeHtml(step.placeholder || "") + '" />' +
        '</div>'
      );
    }

    /** 渲染日期选择器组件 */
    function renderDateSelect(step) {
      var parts = getDateDraft(step);
      var dayCount = getDaysInMonth(parts.year, parts.month);
      var dayOptions = Array.from({ length: dayCount }, function (_, index) {
        return String(index + 1);
      });

      return (
        '<div class="input-wrap">' +
          '<div class="select-grid">' +
            '<select class="select-input" data-date-key="' + step.key + '" data-date-part="year" data-autofocus="true">' +
              '<option value="">请选择年份</option>' +
              yearOptions.map(function (item) {
                return '<option value="' + item + '"' + (parts.year === item ? " selected" : "") + '>' + item + '年</option>';
              }).join("") +
            '</select>' +
            '<select class="select-input" data-date-key="' + step.key + '" data-date-part="month">' +
              '<option value="">请选择月份</option>' +
              monthOptions.map(function (item) {
                return '<option value="' + item + '"' + (parts.month === item ? " selected" : "") + '>' + item + '月</option>';
              }).join("") +
            '</select>' +
            '<select class="select-input" data-date-key="' + step.key + '" data-date-part="day">' +
              '<option value="">请选择日期</option>' +
              dayOptions.map(function (item) {
                return '<option value="' + item + '"' + (parts.day === item ? " selected" : "") + '>' + item + '日</option>';
              }).join("") +
            '</select>' +
          '</div>' +
          '<div class="date-hint">提示：年份、月份必选；日期可不选。</div>' +
        '</div>'
      );
    }

    /** 渲染表单步骤 */
    function renderForm() {
      var visibleSteps = getVisibleSteps();
      var step = visibleSteps[state.currentIndex];
      var page = state.currentIndex + 1;
      var total = getTotalPages();
      var progressPercent = (page / total) * 100;

      // 标记当前步骤为已访问
      state.visitedSteps.add(step.key);

      app.innerHTML =
        renderTop("第 " + page + " / " + total + " 页", progressPercent) +
        '<div class="module-label">' + escapeHtml(step.module) + '</div>' +
        '<h2 class="title">' + escapeHtml(step.title) + '</h2>' +
        '<p class="description">' + escapeHtml(step.description) + '</p>' +
        renderInput(step) +
        (step.specialActions ?
          '<div class="inline-actions">' +
            step.specialActions.map(function (action) {
              var isActive = isSpecialActionSelected(step, action.value) ? "active" : "";
              return '<button class="skip-btn ' + isActive + '" type="button" data-special-value="' + escapeHtml(action.value) + '">' + escapeHtml(action.label) + '</button>';
            }).join("") +
          '</div>' : "") +
        (step.canSkip && step.type !== "date_select_with_idk" && step.type !== "defendant_id" ?
          '<div class="inline-actions">' +
            '<button class="skip-btn" type="button" id="skipBtn">' + escapeHtml(step.skipLabel || "我不知道，先跳过") + '</button>' +
          '</div>' : "") +
        (step.warning || state.error ? renderMessages({ description: "", warning: step.warning || "" }) : "") +
        '<div class="actions">' +
          '<div class="actions-left">' +
            '<button class="nav-btn" type="button" id="prevBtn"' + (state.currentIndex === 0 ? " disabled" : "") + '>上一步</button>' +
          '</div>' +
          '<div class="actions-right">' +
            '<button class="primary-btn" type="button" id="nextBtn">下一步</button>' +
          '</div>' +
        '</div>';

      bindCommonEvents();
      bindStepEvents(step);
    }

    /** 渲染封面页 */
    function renderCover() {
      app.classList.add("cover-card");
      app.innerHTML =
        '<h1 class="cover-name">农民工讨薪起诉状生成工具</h1>' +
        '<h2 class="cover-title">回答问题，<br>一步一步生成起诉状</h2>' +
        '<div class="cover-actions">' +
          '<button class="cover-start-btn" type="button" id="startBtn">开始</button>' +
        '</div>';

      document.getElementById("startBtn").addEventListener("click", startFlow);
      document.getElementById("startBtn").focus();
    }

    /** 渲染不支持页 */
    function renderUnsupported() {
      app.classList.remove("cover-card");
      app.innerHTML =
        renderTop("暂不支持", 0) +
        '<div class="module-label">适用范围</div>' +
        '<h2 class="title">这版暂时帮不了这种情况</h2>' +
        '<p class="description">你这个情况属于既出力又出材料，目前这个 Demo 先只处理纯劳务。你可以重新选，或者先结束，回到第一页。</p>' +
        '<div class="message warning">这不是你不能维权，而是这版工具范围先收得比较窄，避免把文书写偏了。</div>' +
        '<div class="actions">' +
          '<div class="actions-left">' +
            '<button class="nav-btn" type="button" id="reselectBtn">重新选择</button>' +
          '</div>' +
          '<div class="actions-right">' +
            '<button class="primary-btn" type="button" id="endBtn">结束</button>' +
          '</div>' +
        '</div>';

      document.getElementById("resetBtn").addEventListener("click", resetAll);
      document.getElementById("reselectBtn").addEventListener("click", goPrev);
      document.getElementById("endBtn").addEventListener("click", resetAll);
    }

    /** 渲染预览结果页 */
    function renderPreview() {
      var total = getTotalPages();
      var petitionText = buildPetitionText();
      var risks = getRisks();

      app.classList.remove("cover-card");
      app.innerHTML =
        renderTop("第 " + total + " / " + total + " 页", 100) +
        '<div class="module-label">预览结果</div>' +
        '<h2 class="title">起诉状已经生成，可直接下载</h2>' +
        '<p class="description">先看一遍内容，确认没问题后就可以下载。</p>' +
        '<div class="preview-card">' +
          '<div class="preview-title">起诉状全文</div>' +
          '<pre class="petition">' + escapeHtml(petitionText) + '</pre>' +
        '</div>' +
        (risks.length > 0 ?
          '<div class="risk-list">' +
            risks.map(function (r) { return '<div class="message warning">' + escapeHtml(r) + '</div>'; }).join("") +
          '</div>' : "") +
        '<div class="actions">' +
          '<div class="actions-left">' +
            '<button class="nav-btn" type="button" id="previewBackBtn">返回修改</button>' +
          '</div>' +
          '<div class="actions-right">' +
            '<button class="primary-btn" type="button" id="downloadBtn">下载 Word</button>' +
          '</div>' +
        '</div>' +
        '<div class="footer-note">下载的是前端生成的 .doc 演示文件，适合比赛展示和浏览器现场演示。</div>';

      document.getElementById("resetBtn").addEventListener("click", resetAll);
      document.getElementById("previewBackBtn").addEventListener("click", goPrev);
      document.getElementById("downloadBtn").addEventListener("click", downloadDoc);
    }

    /* ============================
       事件绑定
    ============================ */
    function bindCommonEvents() {
      var resetBtn = document.getElementById("resetBtn");
      if (resetBtn) resetBtn.addEventListener("click", resetAll);

      var prevBtn = document.getElementById("prevBtn");
      if (prevBtn) prevBtn.addEventListener("click", goPrev);

      var nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", goNext);

      var skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", skipCurrent);
    }

    function bindStepEvents(step) {
      // 单选按钮
      if (step.type === "radio") {
        app.querySelectorAll("[data-option]").forEach(function (button) {
          button.addEventListener("click", function () {
            setField(step.key, button.getAttribute("data-option"));
          });
        });
        return;
      }

      // 多选按钮
      if (step.type === "multi_select") {
        app.querySelectorAll("[data-option]").forEach(function (button) {
          button.addEventListener("click", function () {
            toggleMultiSelectValue(step.key, button.getAttribute("data-option"));
          });
        });

        // "其他"文本框
        var otherInput = app.querySelector("[data-other-input='job_type_other']");
        if (otherInput) {
          otherInput.addEventListener("input", function (event) {
            setField("job_type_other", event.target.value, { rerender: false, refocus: false });
            var errorBox = app.querySelector(".message.error");
            if (errorBox) errorBox.remove();
          });
          otherInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") { event.preventDefault(); goNext(); }
          });
        }
        return;
      }

      // 日期选择器（普通 或 带"我不知道"）
      if (step.type === "date_select" || step.type === "date_select_with_idk") {
        app.querySelectorAll("[data-date-key]").forEach(function (select) {
          select.addEventListener("change", function (event) {
            setDatePart(step.key, event.target.getAttribute("data-date-part"), event.target.value);
          });
        });

        app.querySelectorAll("[data-special-value]").forEach(function (button) {
          button.addEventListener("click", function () {
            setField(step.key, button.getAttribute("data-special-value"));
          });
        });

        // "我不知道"按钮（date_select_with_idk 类型）
        var idkBtn = document.getElementById("idkBtn");
        if (idkBtn && step.type === "date_select_with_idk") {
          idkBtn.addEventListener("click", function () {
            if (step.key === "defendant_birth_date") {
              state.form.defendant_birth_unknown = true;
              state.form.defendant_birth_date = "";
              state.dateDrafts["defendant_birth_date"] = { year: "", month: "", day: "" };
              state.error = "";
              goNext();
            }
          });
        }
        return;
      }

      // 被告身份证号（特殊类型）
      if (step.type === "defendant_id") {
        var idInput = app.querySelector("[data-input-key='defendant_id_number']");
        if (idInput) {
          idInput.addEventListener("input", function (event) {
            setField("defendant_id_number", event.target.value, { rerender: false, refocus: false });
            var errorBox = app.querySelector(".message.error");
            if (errorBox) errorBox.remove();
          });
          idInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") { event.preventDefault(); goNext(); }
          });
        }

        // "我不知道"按钮
        var idkBtnId = document.getElementById("idkBtn");
        if (idkBtnId) {
          idkBtnId.addEventListener("click", function () {
            state.form.defendant_id_unknown = true;
            state.form.defendant_id_number = "";
            state.error = "";
            goNext();
          });
        }

        // "我要填写身份证号"按钮（撤销"我不知道"）
        var undoIdkBtn = document.getElementById("undoIdkBtn");
        if (undoIdkBtn) {
          undoIdkBtn.addEventListener("click", function () {
            state.form.defendant_id_unknown = false;
            render();
            focusPrimaryInput();
          });
        }
        return;
      }

      // 普通文本/数字输入
      var input = app.querySelector("[data-input-key]");
      if (!input) return;

      input.addEventListener("input", function (event) {
        // 对于分支B-2的欠款金额步骤，实际存入 unpaid_amount
        var fieldKey = step.key;
        setField(fieldKey, event.target.value, { rerender: false, refocus: false });
        var errorBox = app.querySelector(".message.error");
        if (errorBox) errorBox.remove();
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") { event.preventDefault(); goNext(); }
      });
    }

    /* ============================
       下载 Word 文件
    ============================ */
    function downloadDoc() {
      var text = buildPetitionText();
      var html =
        '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
          '<head>' +
            '<meta charset="utf-8">' +
            '<title>民事起诉状</title>' +
            '<style>' +
              '@page { size: A4; margin: 2.54cm 3.18cm 2.54cm 3.18cm; }' +
              'body { font-family: SimSun, "Times New Roman", serif; margin: 0; padding: 0; color: #111; }' +
              'pre { white-space: pre-wrap; font-family: SimSun, "Times New Roman", serif; font-size: 12pt; line-height: 1.5; margin: 0; }' +
            '</style>' +
          '</head>' +
          '<body>' +
            '<pre>' + escapeHtml(text) + '</pre>' +
          '</body>' +
        '</html>';

      var blob = new Blob(["\ufeff", html], { type: "application/msword;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      var safeName = (state.form.plaintiff_name.trim() || "未署名").replace(/[\\/:*?"<>|]/g, "_");
      link.href = url;
      link.download = "民事起诉状_" + safeName + ".doc";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 500);
    }

    /* ============================
       主渲染入口
    ============================ */
    function render() {
      // 确保 currentIndex 不超出可见步骤范围
      var visibleSteps = getVisibleSteps();
      if (state.currentIndex >= visibleSteps.length) {
        state.currentIndex = Math.max(0, visibleSteps.length - 1);
      }

      if (state.view === "cover") {
        renderCover();
        return;
      }

      app.classList.remove("cover-card");

      if (state.view === "unsupported") {
        renderUnsupported();
        return;
      }

      if (state.view === "preview") {
        renderPreview();
        return;
      }

      renderForm();
    }

    // 启动渲染
    render();
  </script>
</body>
