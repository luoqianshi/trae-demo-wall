version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster-warning-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./disaster_warning.db
      - DEBUG=false
    volumes:
      - ./backend:/app
      - db-data:/app/data
    networks:
      - disaster-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster-warning-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - disaster-network
    restart: unless-stopped

networks:
  disaster-network:
    driver: bridge

volumes:
  db-data:
