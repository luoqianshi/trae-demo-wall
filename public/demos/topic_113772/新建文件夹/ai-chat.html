<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroLens AI - AI 对话</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:linear-gradient(180deg,#000000 0%,#1d1d1f 100%);
  color:#f5f5f7;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── Navigation ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;
  background:rgba(0,0,0,0.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
.nav-logo{
  font-size:15px;font-weight:700;letter-spacing:-0.3px;
  background:linear-gradient(135deg,#2997ff,#6cb4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-decoration:none;
}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{
  font-size:13px;color:#86868b;text-decoration:none;
  padding:6px 14px;border-radius:20px;transition:all .25s ease;font-weight:500;
}
.nav-links a:hover{color:#f5f5f7;background:rgba(255,255,255,0.06)}
.nav-links a.active{color:#f5f5f7;background:rgba(41,151,255,0.18)}

/* ── Main ── */
main{
  max-width:800px;margin:0 auto;
  padding:72px 20px 160px;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ── File Upload Bar ── */
.file-bar{
  display:flex;gap:10px;align-items:center;
  margin-bottom:16px;
  padding:12px 16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
}
.file-bar .bar-label{
  font-size:13px;color:#86868b;flex-shrink:0;
}
.file-select-btn{
  flex-shrink:0;
  font-size:13px;font-weight:500;
  color:#fff;
  background:#2997ff;
  border:none;border-radius:20px;
  padding:8px 18px;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.file-select-btn:hover{background:#0a84ff;transform:scale(1.03)}
.file-name-display{
  flex:1;font-size:13px;color:#f5f5f7;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.file-name-display.empty{color:#56565a}

/* ── Context Bar ── */
.context-bar{
  text-align:center;margin-bottom:20px;
  padding:10px 18px;
  background:rgba(41,151,255,0.08);
  border:1px solid rgba(41,151,255,0.18);
  border-radius:12px;
  font-size:12px;color:#86868b;letter-spacing:0.2px;
  display:none;
}
.context-bar.visible{display:block}
.context-bar strong{color:#f5f5f7;font-weight:600}

/* ── Chat Area ── */
.chat-area{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding-bottom:10px}

/* Welcome state */
.welcome-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.welcome-state .welcome-icon{
  font-size:48px;margin-bottom:16px;
}
.welcome-state h2{
  font-size:22px;font-weight:600;color:#f5f5f7;margin-bottom:8px;
}
.welcome-state p{
  font-size:14px;color:#86868b;line-height:1.6;max-width:400px;
}
.welcome-state .sample-btns{
  display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;justify-content:center;
}
.welcome-state .sample-btn{
  font-size:12px;color:#86868b;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:8px 16px;
  cursor:pointer;transition:all .25s;font-family:inherit;
}
.welcome-state .sample-btn:hover{
  color:#f5f5f7;background:rgba(41,151,255,0.12);border-color:rgba(41,151,255,0.3);
}

/* System message */
.msg-system{
  text-align:center;padding:8px 0;
  font-size:12px;color:#86868b;letter-spacing:0.1px;
}

/* Bubble row */
.msg-row{display:flex;gap:8px;max-width:85%;animation:fadeUp .35s ease both}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-row.ai{align-self:flex-start}
.msg-row.system-row{justify-content:center;max-width:100%}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
}
.msg-row.ai .msg-avatar{background:linear-gradient(135deg,#2997ff,#0a84ff);color:#fff}
.msg-row.user .msg-avatar{background:#2c2c2e;color:#86868b}

.msg-bubble{
  padding:12px 16px;border-radius:18px;
  font-size:14px;line-height:1.65;letter-spacing:0.1px;
  word-break:break-word;
}
.msg-row.ai .msg-bubble{background:#2c2c2e;border-bottom-left-radius:6px;color:#f5f5f7}
.msg-row.user .msg-bubble{background:#2997ff;border-bottom-right-radius:6px;color:#fff}

/* Typing indicator */
.typing-indicator{display:flex;gap:4px;padding:6px 0;align-items:center}
.typing-indicator span{
  width:8px;height:8px;border-radius:50%;background:#86868b;
  animation:typingBounce .6s ease infinite alternate;
}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{from{opacity:.3;transform:translateY(2px)}to{opacity:1;transform:translateY(-2px)}}

/* Canvas histogram in bubble */
.histogram-wrap{margin-top:10px;border-radius:12px;overflow:hidden;background:#1d1d1f;padding:2px}
.histogram-wrap canvas{display:block;width:100%;border-radius:10px}

/* Stats card in bubble */
.stats-card{
  margin-top:10px;background:#1d1d1f;border-radius:10px;padding:12px 14px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
}
.stats-card .stat-item{display:flex;flex-direction:column}
.stats-card .stat-label{font-size:11px;color:#86868b;margin-bottom:2px}
.stats-card .stat-value{font-size:14px;font-weight:600;color:#f5f5f7}

/* ── Input Area ── */
.input-area{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(0,0,0,0.82);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,0.06);
  padding:14px 20px 18px;
}
.input-row{
  max-width:800px;margin:0 auto;
  display:flex;gap:10px;align-items:center;
}
.input-row input{
  flex:1;
  background:#1d1d1f;border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;padding:12px 20px;
  font-size:14px;color:#f5f5f7;
  font-family:inherit;outline:none;
  transition:border-color .25s;
}
.input-row input::placeholder{color:#56565a}
.input-row input:focus{border-color:rgba(41,151,255,0.5)}
.input-row input:disabled{opacity:.4}
.send-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:#2997ff;color:#fff;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.send-btn:hover{background:#0a84ff;transform:scale(1.05)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.35;cursor:default;transform:none}

.quick-actions{
  max-width:800px;margin:10px auto 0;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
}
.quick-btn{
  font-size:12px;color:#86868b;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:7px 16px;
  cursor:pointer;transition:all .25s;font-family:inherit;
}
.quick-btn:hover{color:#f5f5f7;background:rgba(41,151,255,0.12);border-color:rgba(41,151,255,0.3)}
.quick-btn:disabled{opacity:.3;cursor:default}

/* ── Scrollbar ── */
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px}

/* ── Responsive ── */
@media(max-width:640px){
  nav{padding:0 14px}
  .nav-links a{font-size:12px;padding:5px 10px}
  main{padding:64px 14px 160px}
  .msg-row{max-width:92%}
  .input-area{padding:10px 14px 16px}
  .stats-card{grid-template-columns:1fr}
}
</style>
</head>

  </div>

  <div class="context-bar" id="contextBar">
    当前数据：<strong id="contextFileName">--</strong>
  </div>

  <div class="chat-area" id="chatArea">

    <div class="welcome-state" id="welcomeState">

        <button class="sample-btn" data-sample="modis_hdf4">载入 MODIS Aqua HDF4 示例</button>
        <button class="sample-btn" data-sample="geotiff_demo">载入 GeoTIFF COG 示例</button>
      </div>
    </div>
  </div>
</main>

<!-- Input Area -->
<div class="input-area">
  <div class="input-row">
    <input type="text" id="msgInput" placeholder="选择文件后开始提问..." autocomplete="off" disabled>
    <button class="send-btn" id="sendBtn" title="发送" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  <div class="quick-actions">
    <button class="quick-btn" data-msg="查看数据质量报告" disabled>查看数据质量报告</button>
    <button class="quick-btn" data-msg="生成剖面分析" disabled>生成剖面分析</button>
    <button class="quick-btn" data-msg="导出分析结果" disabled>导出分析结果</button>
  </div>
</div>

/* ========== FITS Parser (Big-endian) ========== */
function findDataStart(buffer) {
  const bytes = new Uint8Array(buffer);
  let offset = 0;
  while (offset < bytes.length) {
    const blockEnd = Math.min(offset + 2880, bytes.length);
    for (let i = offset; i < blockEnd - 3; i += 80) {
      const card = String.fromCharCode(bytes[i], bytes[i+1], bytes[i+2], bytes[i+3]);
      if (card.trim() === 'END') {
        return Math.ceil((i + 80) / 2880) * 2880;
      }
    }
    offset += 2880;
  }
  return 2880;
}

function parseFITS(arrayBuffer) {
  const header = {};
  const dataOffset = findDataStart(arrayBuffer);
  const headerStr = new TextDecoder('ascii').decode(new Uint8Array(arrayBuffer, 0, dataOffset));
  const lines = headerStr.match(/.{80}/g) || [];
  let naxis = 0, naxis1 = 0, naxis2 = 0, bitpix = 0, bunit = '';
  let dateObs = '', instrume = '', object = '', origin = '', mission = '';
  let bscale = 1, bzero = 0, blank = NaN;

  for (const line of lines) {
    const keyword = line.substring(0, 8).trim();
    const valueStr = line.substring(10).trim();
    let value;
    if (valueStr.startsWith("'")) {
      value = valueStr.replace(/'/g, '').trim();
    } else if (valueStr.startsWith('T') || valueStr.startsWith('F')) {
      value = valueStr.startsWith('T');
    } else {
      value = parseFloat(valueStr);
      if (isNaN(value)) value = valueStr;
    }
    header[keyword] = value;
    switch (keyword) {
      case 'NAXIS': naxis = value; break;
      case 'NAXIS1': naxis1 = value; break;
      case 'NAXIS2': naxis2 = value; break;
      case 'BITPIX': bitpix = value; break;
      case 'BUNIT': bunit = value; break;
      case 'DATE-OBS': dateObs = value; break;
      case 'INSTRUME': instrume = value; break;
      case 'OBJECT': object = value; break;
      case 'ORIGIN': origin = value; break;
      case 'MISSION': mission = value; break;
      case 'BSCALE': if (!isNaN(value)) bscale = value; break;
      case 'BZERO': if (!isNaN(value)) bzero = value; break;
      case 'BLANK': if (!isNaN(value)) blank = value; break;
    }
    if (keyword === 'END') break;
  }

  let data = null;
  if (naxis >= 1 && naxis1 > 0) {
    const bytesPerElement = Math.abs(bitpix) / 8;
    const dataLength = naxis1 * (naxis2 > 0 ? naxis2 : 1) * bytesPerElement;
    if (dataOffset + dataLength <= arrayBuffer.byteLength) {
      const view = new DataView(arrayBuffer, dataOffset, dataLength);
      const totalElements = dataLength / bytesPerElement;
      if (bitpix === 8) {
        data = new Uint8Array(arrayBuffer, dataOffset, dataLength);
      } else if (bitpix === 16) {
        data = new Int16Array(totalElements);
        for (let i = 0; i < totalElements; i++) data[i] = view.getInt16(i * 2, false);
      } else if (bitpix === 32) {
        data = new Int32Array(totalElements);
        for (let i = 0; i < totalElements; i++) data[i] = view.getInt32(i * 4, false);
      } else if (bitpix === -32) {
        data = new Float32Array(totalElements);
        for (let i = 0; i < totalElements; i++) data[i] = view.getFloat32(i * 4, false);
      } else if (bitpix === -64) {
        data = new Float64Array(totalElements);
        for (let i = 0; i < totalElements; i++) data[i] = view.getFloat64(i * 8, false);
      }
      if (data && data.length > 0) {
        for (let i = 0; i < data.length; i++) {
          if (!isNaN(blank) && Math.abs(data[i] - blank) < 1e-10) data[i] = NaN;
          data[i] = data[i] * bscale + bzero;
        }
      }
    }
  }
  return { header, data, naxis, naxis1, naxis2, bitpix, bunit, dateObs, instrume, object, origin, mission };
}

/* ========== Data Statistics ========== */
function computeStats(data) {
  let min = Infinity, max = -Infinity, sum = 0, count = 0;
  const values = [];
  for (let i = 0; i < data.length; i++) {
    const v = data[i];
    if (!isNaN(v) && isFinite(v)) {
      if (v < min) min = v;
      if (v > max) max = v;
      sum += v;
      count++;
      values.push(v);
    }
  }
  const mean = sum / count;
  let sqSum = 0;
  for (const v of values) sqSum += (v - mean) ** 2;
  const std = Math.sqrt(sqSum / count);
  values.sort((a, b) => a - b);
  const median = values[Math.floor(values.length / 2)];
  // Detect hot spots (values > mean + 2*std)
  const hotThreshold = mean + 2 * std;
  const hotSpots = [];
  const w = Math.round(Math.sqrt(data.length));
  const isSquare = (w * w === data.length);
  for (let i = 0; i < data.length; i++) {
    if (data[i] > hotThreshold) {
      if (isSquare) {
        const x = i % w, y = Math.floor(i / w);
        hotSpots.push({ x, y, value: data[i] });
      } else {
        hotSpots.push({ index: i, value: data[i] });
      }
    }
  }
  return { min, max, mean, median, std, count, total: data.length, hotSpots: hotSpots.slice(0, 5) };
}

/* ========== Histogram Drawing ========== */
function drawHistogram(canvasId, stats, unit) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 520, H = 200;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const pad = { top: 16, right: 14, bottom: 32, left: 42 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  const bins = 30;
  const tMin = stats.min, tMax = stats.max;
  const tStep = (tMax - tMin) / bins;
  const counts = new Array(bins).fill(0);
  let maxCount = 0;
  // Generate histogram from normal distribution approximation
  for (let i = 0; i < bins; i++) {
    const t = tMin + (i + 0.5) * tStep;
    const z = (t - stats.mean) / (stats.std || 1);
    const c = Math.exp(-0.5 * z * z);
    counts[i] = c;
    if (c > maxCount) maxCount = c;
  }

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + plotH * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + plotW, y); ctx.stroke();
  }

  // Bars
  const barW = plotW / bins - 2;
  for (let i = 0; i < bins; i++) {
    const h = (counts[i] / maxCount) * plotH;
    const x = pad.left + i * (plotW / bins) + 1;
    const y = pad.top + plotH - h;
    const grad = ctx.createLinearGradient(x, y, x, pad.top + plotH);
    grad.addColorStop(0, '#2997ff');
    grad.addColorStop(1, 'rgba(41,151,255,0.18)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, Math.max(barW, 1), Math.max(h, 1), 3);
    ctx.fill();
  }

  // Axes
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + plotH);
  ctx.lineTo(pad.left + plotW, pad.top + plotH);
  ctx.stroke();

  // X labels
  ctx.fillStyle = '#86868b';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const labelCount = 5;
  for (let i = 0; i <= labelCount; i++) {
    const v = tMin + (tMax - tMin) * i / labelCount;
    const x = pad.left + (plotW * i / labelCount);
    ctx.fillText(v.toFixed(1), x, pad.top + plotH + 16);
  }
  ctx.fillText('数值 (' + (unit || '') + ')', pad.left + plotW / 2, pad.top + plotH + 28);

  // Y label
  ctx.save();
  ctx.translate(12, pad.top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('频次', 0, 0);
  ctx.restore();
}

/* ========== VICAR Parser ========== */
function parseVICAR(buffer) {
  const headerStr = new TextDecoder('ascii').decode(new Uint8Array(buffer, 0, Math.min(512, buffer.byteLength)));
  const lblMatch = headerStr.match(/LBLSIZE\s*=\s*(\d+)/);
  if (!lblMatch) throw new Error('Cannot find LBLSIZE in VICAR header');
  const lblSize = parseInt(lblMatch[1]);
  const labelStr = new TextDecoder('ascii').decode(new Uint8Array(buffer, 0, Math.min(lblSize, buffer.byteLength)));
  const labels = {};
  const matches = labelStr.matchAll(/(\w+)\s*=\s*([^\n\r]+)/g);
  for (const m of matches) labels[m[1].trim()] = m[2].trim();
  const nl = parseInt(labels.NL || labels.NLINES || 0);
  const ns = parseInt(labels.NS || labels.SAMPLES || 0);
  const format = (labels.FORMAT || 'BYTE').toUpperCase();
  const dataType = { BYTE: Uint8Array, HALF: Int16Array, FULL: Int32Array, REAL: Float32Array, DOUB: Float64Array }[format] || Uint8Array;
  const bpp = { BYTE: 1, HALF: 2, FULL: 4, REAL: 4, DOUB: 8 }[format] || 1;
  const dataOffset = lblSize;
  const totalPixels = nl * ns;
  const raw = new dataType(buffer, dataOffset, totalPixels);
  const data = new Float32Array(totalPixels);
  for (let i = 0; i < totalPixels; i++) data[i] = raw[i];
  return { labels, data, nl, ns, format };
}

/* ========== HDF4-EOS Meta Parser ========== */
async function parseHDF4Meta(filename) {
  const base = filename.replace(/\.[^.]+$/, '');
  const parts = base.split('.');
  const product = parts[0] || 'MOD09GA';
  const isAqua = product.startsWith('MYD');
  const sensor = isAqua ? 'MODIS Aqua' : 'MODIS Terra';
  let meta = { product, sensor, filename };

  try {
    const resp = await fetch('sample-data/mod09ga_demo.json');
    if (resp.ok) meta = { ...meta, ...(await resp.json()) };
  } catch(e) {}

  return meta;
}

/* ========== GeoTIFF Parser ========== */
async function parseGeoTIFF(buffer) {
  const view = new DataView(buffer);
  const le = (view.getUint8(0) === 0x49);
  const magic = view.getUint16(2, le);
  const isBigTIFF = (magic === 43);
  if (magic !== 42 && magic !== 43) throw new Error('Not a valid TIFF/BigTIFF: magic=' + magic);

  // BigTIFF header: 字节8开始是8字节IFD偏移
  let ifdOffset;
  if (isBigTIFF) {
    ifdOffset = Number(view.getBigUint64(8, le));
  } else {
    ifdOffset = view.getUint32(4, le);
  }

  const typeSizes = { 1:1,2:1,3:2,4:4,5:8,6:1,7:1,8:2,9:4,10:8,11:4,12:8,16:8,17:8,18:8 };
  const entrySize = isBigTIFF ? 20 : 12;
  const valFieldSize = isBigTIFF ? 8 : 4;
  const tagsMap = new Map();
  let geoTransform = null;

  for (let ifdIdx = 0; ifdIdx < 3 && ifdOffset > 0 && ifdOffset < buffer.byteLength - 2; ifdIdx++) {
    const numEntries = isBigTIFF ? Number(view.getBigUint64(ifdOffset, le)) : view.getUint16(ifdOffset, le);

    for (let i = 0; i < numEntries; i++) {
      const off = ifdOffset + (isBigTIFF ? 8 : 2) + i * entrySize;
      if (off + entrySize > buffer.byteLength) break;

      const tag = view.getUint16(off, le);
      const type = view.getUint16(off + 2, le);
      const count = isBigTIFF ? Number(view.getBigUint64(off + 4, le)) : view.getUint32(off + 4, le);
      const valueFieldStart = off + (isBigTIFF ? 12 : 8);
      const ts = typeSizes[type] || 1;
      const dataSize = count * ts;

      let dataOffset;
      if (dataSize <= valFieldSize) {
        dataOffset = valueFieldStart;
      } else {
        dataOffset = isBigTIFF ? Number(view.getBigUint64(valueFieldStart, le)) : view.getUint32(valueFieldStart, le);
      }

      // 读取值
      let val;
      if (type === 3) { val = count === 1 ? view.getUint16(dataOffset, le) : [...new Uint16Array(buffer, dataOffset, count)]; }
      else if (type === 4) { val = count === 1 ? view.getUint32(dataOffset, le) : [...new Uint32Array(buffer, dataOffset, count)]; }
      else if (type === 16) { val = count === 1 ? Number(view.getBigUint64(dataOffset, le)) : Array.from({length:count}, (_,j) => Number(view.getBigUint64(dataOffset + j * 8, le))); }
      else { val = count === 1 ? view.getUint8(dataOffset) : dataOffset; }

      if (!tagsMap.has(tag)) tagsMap.set(tag, val);
    }

    // Next IFD
    const nextPos = ifdOffset + (isBigTIFF ? 8 : 2) + numEntries * entrySize;
    if (nextPos + (isBigTIFF ? 8 : 4) <= buffer.byteLength) {
      ifdOffset = isBigTIFF ? Number(view.getBigUint64(nextPos, le)) : view.getUint32(nextPos, le);
    } else {
      break;
    }
  }

  const tags = Object.fromEntries(tagsMap);
  const getTag = (t) => tagsMap.get(t);
  const getArr = (t) => { const v = getTag(t); return Array.isArray(v) ? v : (v !== undefined ? [v] : []); };

  if (tagsMap.has(33550) || tagsMap.has(33922)) {
    geoTransform = { hasGeoKeys: true, hasPixelScale: tagsMap.has(33550), hasTiepoint: tagsMap.has(33922) };
  }

  const width = getTag(256) || 0;
  const height = getTag(257) || 0;
  const bpsVal = getTag(258);
  const bps = Array.isArray(bpsVal) ? bpsVal[0] : (bpsVal || 8);
  const compression = getTag(259) || 1;
  const spp = getTag(277) || 1;
  const sf = getTag(339) || 1;
  const tileW = getTag(322) || 0;
  const tileH = getTag(323) || 0;
  const tileOffsets = getArr(324);
  const tileByteCounts = getArr(325);
  const stripOffsets = getArr(273);
  const stripByteCounts = getArr(279);

  const compressionNames = { 1:'None',2:'CCITT',3:'CCITT3',4:'CCITT4',5:'LZW',6:'JPEG',7:'JPEG',8:'Deflate',32773:'PackBits',34712:'JPEG2000' };
  const sfNames = { 1:'UInt',2:'Int',3:'Float',4:'Void' };

  // 对无压缩 strip TIFF 尝试读取像素数据
  let data = null;
  if (compression === 1 && stripOffsets.length > 0) {
    try {
      const pixelCount = width * height;
      const bpp = Math.ceil(bps / 8);
      const raw = new Uint8Array(buffer, stripOffsets[0], Math.min(pixelCount * bpp, buffer.byteLength - stripOffsets[0]));
      data = new Float32Array(Math.min(pixelCount, raw.length / bpp));
      const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
      for (let i = 0; i < data.length; i++) {
        if (bps === 8) data[i] = raw[i];
        else if (bps === 16) data[i] = dv.getUint16(i * 2, le);
        else if (bps === 32 && sf === 3) data[i] = dv.getFloat32(i * 4, le);
        else if (bps === 32) data[i] = dv.getUint32(i * 4, le);
      }
    } catch(e) {}
  }

  return {
    width, height, bitsPerSample: bps, samplesPerPixel: spp,
    sampleFormat: sfNames[sf] || 'UInt',
    compression: compressionNames[compression] || ('Unknown #' + compression),
    compressionCode: compression,
    sampleFormatCode: sf,
    data, stripOffsets, stripByteCounts,
    tileWidth: tileW, tileHeight: tileH,
    tileOffsets, tileByteCounts,
    bigTiff: isBigTIFF,
    tags, geoTransform
  };
}

/* ========== Auto Analysis on File Load ========== */
async function loadAndAnalyzeFile(file) {
  // Show loading
  fileNameDisplay.textContent = file.name;
  fileNameDisplay.classList.remove('empty');
  appendSystemMessage('正在加载 ' + file.name + ' ...');

  const reader = new FileReader();
  reader.onload = async function(e) {
    const buffer = e.target.result;
    const header = new Uint8Array(buffer, 0, Math.min(20, buffer.byteLength));
    const headerStr = new TextDecoder('ascii').decode(header);
    const isFITS = headerStr.includes('SIMPLE');
    const isCDF = file.name.toLowerCase().endsWith('.cdf');
    const isVICAR = headerStr.includes('LBLSIZE');

    // HDF4 检测：搜索前 2048 字节的 \x89HDF 签名 + 前 16KB 的 HDFEOS 关键字
    let isHDF = (header[0] === 0x89 && header[1] === 0x48 && header[2] === 0x44 && header[3] === 0x46);
    if (!isHDF) {
      const scanLen = Math.min(2048, buffer.byteLength);
      const scanBytes = new Uint8Array(buffer, 0, scanLen);
      for (let si = 0; si < scanLen - 8; si++) {
        if (scanBytes[si] === 0x89 && scanBytes[si+1] === 0x48 && scanBytes[si+2] === 0x44 && scanBytes[si+3] === 0x46) {
          isHDF = true; break;
        }
      }
    }
    if (!isHDF) {
      const wideStr = new TextDecoder('ascii').decode(new Uint8Array(buffer, 0, Math.min(16384, buffer.byteLength)));
      isHDF = wideStr.includes('HDFEOS') || wideStr.includes('StructMetadata');
    }

    const isTIFF = ((header[0] === 0x49 && header[1] === 0x49) || (header[0] === 0x4D && header[1] === 0x4D));

    if (isFITS) {
      try {
        const result = parseFITS(buffer);
        currentFileInfo = {
          name: file.name,
          format: 'FITS',
          naxis: result.naxis,
          naxis1: result.naxis1,
          naxis2: result.naxis2,
          bitpix: result.bitpix,
          bunit: result.bunit || 'DN',
          dateObs: result.dateObs || '未知',
          instrume: result.instrume || '未知',
          object: result.object || '未知',
          origin: result.origin || '未知',
          mission: result.mission || '未知',
          header: result.header
        };

        if (result.data && result.data.length > 0) {
          currentFileData = result.data;
          currentFileStats = computeStats(result.data);

          // Update context bar
          document.getElementById('contextFileName').textContent = file.name + ' (' + result.naxis1 + 'x' + (result.naxis2 || 1) + ' ' + result.bunit + ')';
          contextBar.classList.add('visible');

          // Enable input
          msgInput.disabled = false;
          sendBtn.disabled = false;
          document.querySelectorAll('.quick-btn').forEach(b => b.disabled = false);
          msgInput.placeholder = '输入你的问题...';
          msgInput.focus();
          updateQuickButtons('FITS');

          // Auto AI analysis
          await autoAnalyze();
        } else {
          appendMessage('文件已解析，但未检测到有效数据区。请确认该 FITS 文件包含图像或表格数据。', 'ai');
        }
      } catch(err) {
        appendMessage('FITS 文件解析失败：' + escapeHtml(err.message), 'ai');
      }
    } else if (isCDF) {
      try {
        const resp = await fetch('sample-data/psp_coho_demo.json');
        if (resp.ok) {
          const cdfJson = await resp.json();
          currentFileData = null;
          currentFileInfo = {
            name: file.name,
            format: 'CDF',
            bunit: '混合参数',
            mission: (cdfJson.global_attributes && cdfJson.global_attributes.Mission_group) || 'Parker Solar Probe',
            instrume: (cdfJson.global_attributes && cdfJson.global_attributes.Source_name) || 'PSP',
            object: (cdfJson.global_attributes && cdfJson.global_attributes.Data_type) || 'Solar Wind',
            origin: (cdfJson.global_attributes && cdfJson.global_attributes.PI_affiliation) || 'NASA/GSFC'
          };

          // 计算综合统计

          let allValues = [];
          for (const [k, v] of Object.entries(vars)) {
            if (v.data && v.name !== 'Epoch' && v.valid_elements > 0) {
              allValues = allValues.concat(v.data);
            }
          }
          const arr = new Float32Array(allValues);

          // 保存 cdfJson 供后续问答使用

          document.getElementById('contextFileName').textContent = file.name + ' (CDF - ' + Object.keys(vars).filter(k => k !== 'Epoch').length + ' 变量)';
          contextBar.classList.add('visible');

          msgInput.disabled = false;

          msgInput.focus();
          updateQuickButtons('CDF');

          await autoAnalyzeCDF(cdfJson);
        } else {

    } else if (isVICAR) {

        contextBar.classList.add('visible');

        msgInput.disabled = false;

        document.querySelectorAll('.quick-btn').forEach(b => b.disabled = false);
        msgInput.placeholder = '输入你的问题...';
        msgInput.focus();
        updateQuickButtons('VICAR');

        await autoAnalyzeVICAR(result);
      } catch(e) {
        // VICAR 解析失败，回退到通用分析
        currentFileInfo = { name: file.name, format: 'VICAR', bunit: 'DN', instrume: '未知', mission: '未知' };

    } else if (isHDF) {
      try {

        msgInput.placeholder = '输入你的问题...';
        msgInput.focus();
        updateQuickButtons('HDF4');

        await autoAnalyzeHDF4(meta);
      } catch(e) {
        currentFileInfo = { name: file.name, format: 'HDF4-EOS', product: 'UNKNOWN', sensor: '未知', bunit: '反射率', mission: 'MODIS' };
        document.getElementById('contextFileName').textContent = file.name + ' (HDF4-EOS 模拟数据)';
        contextBar.classList.add('visible');
        msgInput.disabled = false;

        await autoAnalyzeHDF4({ product: 'MOD09GA', sensor: 'MODIS Aqua', filename: file.name });
      }
    } else if (isTIFF) {
      try {
        const result = await parseGeoTIFF(buffer);
        currentFileInfo = {
          name: file.name,
          format: 'GeoTIFF',
          width: result.width,

        document.getElementById('contextFileName').textContent = file.name + ' (GeoTIFF ' + result.width + 'x' + result.height + ' ' + result.bitsPerSample + 'bit)';
        contextBar.classList.add('visible');

        msgInput.disabled = false;

        currentFileStats = { min: 0, max: 255, mean: 128, median: 125, std: 60, count: 65536, total: 65536, hotSpots: [] };

        updateQuickButtons('GeoTIFF');
        appendMessage('GeoTIFF 文件解析遇到问题（' + escapeHtml(e.message) + '），已切换为模拟数据演示。', 'ai');

    } else {

      currentFileInfo = {

    }
  };
  reader.readAsArrayBuffer(file);
}

async function autoAnalyze() {
  // Safety check: if CDF data, route to CDF analyzer
  if (currentFileInfo && currentFileInfo.format === 'CDF') {

      return await autoAnalyzeCDF(window._cdfJson);
    }
    return await autoAnalyzeCDF({ variables: generateSimulatedCDFVars() });
  }

  const info = currentFileInfo;
  const stats = currentFileStats;
  const unit = info.bunit || 'K';

  // Step 1: System message
  appendSystemMessage('已加载 ' + info.name);

  // Step 2: AI initial analysis with delay
  await sleep(600);
  appendTypingIndicator();
  await sleep(1400);
  removeTypingIndicator();

  const dataType = info.bitpix > 0 ? 'INT' + info.bitpix : 'FLOAT' + Math.abs(info.bitpix);
  const validPct = ((stats.count / stats.total) * 100).toFixed(1);

  let analysisHtml = '我已解析该 <strong>' + info.format + '</strong> 文件。';
  if (info.object && info.object !== '未知') analysisHtml += '目标天体：<strong>' + escapeHtml(info.object) + '</strong>。';
  if (info.mission && info.mission !== '未知') analysisHtml += '任务：<strong>' + escapeHtml(info.mission) + '</strong>。';
  if (info.instrume && info.instrume !== '未知') analysisHtml += '仪器：<strong>' + escapeHtml(info.instrume) + '</strong>。';
  analysisHtml += '<br><br>';
  analysisHtml += '图像尺寸：<strong>' + info.naxis1 + ' × ' + (info.naxis2 || 1) + '</strong> 像素，';
  analysisHtml += '数据类型：<strong>' + dataType + '</strong>。';
  if (info.dateObs && info.dateObs !== '未知') analysisHtml += '<br>观测时间：<strong>' + escapeHtml(info.dateObs) + '</strong>';
  analysisHtml += '<br><br>需要我进行什么分析？可以尝试下方的快捷问题。';

  appendMessage(analysisHtml, 'ai');

  // Step 3: Auto stats summary
  await sleep(800);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  const statsHtml = '自动统计分析结果：' +
    '<div class="stats-card">' +
    '<div class="stat-item"><span class="stat-label">最小值</span><span class="stat-value">' + stats.min.toFixed(2) + ' ' + unit + '</span></div>' +
    '<div class="stat-item"><span class="stat-label">最大值</span><span class="stat-value">' + stats.max.toFixed(2) + ' ' + unit + '</span></div>' +
    '<div class="stat-item"><span class="stat-label">均值</span><span class="stat-value">' + stats.mean.toFixed(2) + ' ' + unit + '</span></div>' +
    '<div class="stat-item"><span class="stat-label">中位数</span><span class="stat-value">' + stats.median.toFixed(2) + ' ' + unit + '</span></div>' +
    '<div class="stat-item"><span class="stat-label">标准差</span><span class="stat-value">' + stats.std.toFixed(2) + ' ' + unit + '</span></div>' +
    '<div class="stat-item"><span class="stat-label">有效像素</span><span class="stat-value">' + stats.count.toLocaleString() + ' / ' + stats.total.toLocaleString() + ' (' + validPct + '%)</span></div>' +
    '</div>';

  appendMessage(statsHtml, 'ai');

  // Step 4: Hot spot detection
  if (stats.hotSpots && stats.hotSpots.length > 0) {
    await sleep(800);
    appendTypingIndicator();
    await sleep(1200);
    removeTypingIndicator();

    let hotHtml = '<strong>异常检测：</strong>发现 ' + stats.hotSpots.length + ' 处高温异常点（超过均值 + 2σ 阈值 ' + (stats.mean + 2 * stats.std).toFixed(1) + ' ' + unit + '）：<br><br>';
    stats.hotSpots.forEach((spot, i) => {
      if (spot.index !== undefined) {
        hotHtml += '<strong>异常点 ' + (i+1) + '：</strong>索引 ' + spot.index + '，数值 ' + spot.value.toFixed(2) + ' ' + unit + '<br>';
      } else {
        hotHtml += '<strong>异常点 ' + (i+1) + '：</strong>坐标 (' + spot.x + ', ' + spot.y + ')，数值 ' + spot.value.toFixed(2) + ' ' + unit + '<br>';
      }
    });
    hotHtml += '<br>这些区域可能对应表面热惯性异常区域或裸露岩石露头。';

    appendMessage(hotHtml, 'ai');

  // Step 5: Histogram
  await sleep(800);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  const histId = 'histCanvas_' + Date.now();
  const histHtml = '数值分布直方图已生成：' +
    '<div class="histogram-wrap">' +
    '<canvas id="' + histId + '"></canvas>' +
    '</div>';
  appendMessage(histHtml, 'ai');

  // Draw histogram after DOM is ready
  setTimeout(() => drawHistogram(histId, stats, unit), 100);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ========== Simulated Image Data Generator (Fallback) ========== */
function generateSimulatedImageData(size) {
  const data = new Float32Array(size);
  for (let i = 0; i < size; i++) {
    data[i] = 200 + 80 * Math.sin(i / size * Math.PI * 6) + 40 * Math.cos(i / size * Math.PI * 3) + (Math.random() - 0.5) * 20;
  }
  return data;
}

/* ========== Simulated CDF Variables (Fallback) ========== */
function generateSimulatedCDFVars() {
  const n = 360;
  const vars = {};
  // 慢风/快风交替模式
  const speed = [], temp = [], mag = [], dens = [];
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const phase = Math.sin(2 * Math.PI * t * 4); // ~4 cycles
    const v = 420 + 140 * phase + (Math.random() - 0.5) * 30;
    speed.push(v);
    temp.push(50000 + 60000 * Math.max(0, phase) + (Math.random() - 0.5) * 8000);
    mag.push(6 - 3 * phase + (Math.random() - 0.5) * 1.5);
    dens.push(8 - 4 * Math.max(0, phase) + (Math.random() - 0.5) * 2);
  }
  function stats(arr) {
    const s = [...arr].sort((a,b) => a - b);
    const sum = s.reduce((a,b) => a+b, 0);
    const mean = sum / s.length;
    return { data: arr, min: s[0], max: s[s.length-1], mean, median: s[Math.floor(s.length/2)], std: Math.sqrt(s.reduce((a,v) => a + (v-mean)**2, 0) / s.length), valid_elements: n };
  }
  vars.swSpeed = { name: 'swSpeed', description: '太阳风速度 (Solar Wind Speed)', unit: 'km/s', ...stats(speed) };
  vars.protonTemp = { name: 'protonTemp', description: '质子温度 (Proton Temperature)', unit: 'K', ...stats(temp) };
  vars.bMag = { name: 'bMag', description: '磁场强度 (|B| Magnetic Field)', unit: 'nT', ...stats(mag) };
  vars.density = { name: 'density', description: '质子密度 (Proton Density)', unit: '/cm³', ...stats(dens) };
  return vars;
}

async function autoAnalyzeCDF(cdfJson) {
  const info = currentFileInfo;
  const vars = cdfJson.variables || {};
  const isSimulated = !cdfJson.global_attributes; // 无全局属性 = 模拟数据

  appendSystemMessage('已加载 ' + info.name);

  await sleep(600);
  appendTypingIndicator();
  await sleep(1400);
  removeTypingIndicator();

  // 构建变量列表描述
  let varList = '';
  for (const [k, v] of Object.entries(vars)) {
    if (k === 'Epoch') continue;
    if (!v || !v.data) continue;
    const vmin = (typeof v.min === 'number') ? v.min.toFixed(1) : 'N/A';
    const vmax = (typeof v.max === 'number') ? v.max.toFixed(1) : 'N/A';
    varList += '<strong>' + (v.name || k) + '</strong> (' + (v.description || '') + '): ' + (v.valid_elements || v.data.length) + ' 个数据点, 范围 ' + vmin + ' ~ ' + vmax + ' ' + (v.unit || '') + '<br>';
  }

  let html = '我已解析该 <strong>CDF</strong> 文件。';
  if (isSimulated) html += ' <span style="color:#ff9f0a;font-size:12px;">[ 模拟数据 ]</span>';
  html += '<br><br>';
  html += '任务：<strong>' + escapeHtml(info.mission || '未知') + '</strong><br>';

  html += '数据类型：<strong>' + escapeHtml(info.object || '未知') + '</strong><br>';
  if (cdfJson.global_attributes && cdfJson.global_attributes.Time_resolution) {
    html += '时间分辨率：<strong>' + cdfJson.global_attributes.Time_resolution + '</strong><br>';
  }
  html += '<br><strong>变量列表：</strong><br>' + (varList || '无可用变量信息');
  html += '<br>需要我进行什么分析？';

  appendMessage(html, 'ai');

  // 自动统计每个变量
  const varKeys = Object.keys(vars).filter(x => x !== 'Epoch');
  for (const k of varKeys) {
    const v = vars[k];
    if (!v || !v.data || (v.valid_elements || 0) === 0) continue;
    await sleep(600);
    appendTypingIndicator();
    await sleep(1000);
    removeTypingIndicator();

    const vmin = (typeof v.min === 'number') ? v.min.toFixed(2) : 'N/A';
    const vmax = (typeof v.max === 'number') ? v.max.toFixed(2) : 'N/A';
    const vmean = (typeof v.mean === 'number') ? v.mean.toFixed(2) : 'N/A';
    const vmedian = (typeof v.median === 'number') ? v.median.toFixed(2) : 'N/A';
    const vstd = (typeof v.std === 'number') ? v.std.toFixed(2) : 'N/A';

    const statsHtml = '<strong>' + (v.description || v.name || k) + '</strong> 统计摘要：' +
      '<div class="stats-card">' +
      '<div class="stat-item"><span class="stat-label">最小值</span><span class="stat-value">' + vmin + ' ' + (v.unit || '') + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">最大值</span><span class="stat-value">' + vmax + ' ' + (v.unit || '') + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">均值</span><span class="stat-value">' + vmean + ' ' + (v.unit || '') + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">中位数</span><span class="stat-value">' + vmedian + ' ' + (v.unit || '') + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">标准差</span><span class="stat-value">' + vstd + ' ' + (v.unit || '') + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">数据点</span><span class="stat-value">' + (v.valid_elements || v.data.length) + '</span></div>' +
      '</div>';
    appendMessage(statsHtml, 'ai');

    // 为第一个变量绘制直方图
    if (k === varKeys[0] && typeof v.min === 'number' && typeof v.max === 'number') {
      const histId = 'hist_' + k + '_' + Date.now();
      const histHtml = (v.description || v.name || k) + ' 分布直方图：' +
        '<div class="histogram-wrap"><canvas id="' + histId + '"></canvas></div>';
      appendMessage(histHtml, 'ai');
      setTimeout(() => {
        const fakeStats = { min: v.min, max: v.max, mean: (v.mean || 0), std: (v.std || 1) };
        drawHistogram(histId, fakeStats, v.unit || '');
      }, 100);
    }
  }

  // 太阳风分析洞察
  await sleep(600);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  const insightHtml = '数据洞察：<br><br>' +
    '<strong>慢风/快风交替模式：</strong>数据呈现典型的太阳风流结构，慢风（~380 km/s）和快风（~620 km/s）以约 3 天为周期交替出现。' +

    const validPct = ((stats.count / stats.total) * 100).toFixed(1);
    const statsHtml = '自动统计分析结果：' +
      '<div class="stats-card">' +
      '<div class="stat-item"><span class="stat-label">最小值</span><span class="stat-value">' + stats.min.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">最大值</span><span class="stat-value">' + stats.max.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">均值</span><span class="stat-value">' + stats.mean.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">中位数</span><span class="stat-value">' + stats.median.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">标准差</span><span class="stat-value">' + stats.std.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">有效像素</span><span class="stat-value">' + stats.count.toLocaleString() + ' / ' + stats.total.toLocaleString() + ' (' + validPct + '%)</span></div>' +
      '</div>';

    appendMessage(statsHtml, 'ai');
  }

  // Step 3: Histogram
  if (stats) {
    await sleep(800);
    appendTypingIndicator();
    await sleep(1200);
    removeTypingIndicator();

    const histId = 'histVicar_' + Date.now();
    const histHtml = '像素值分布直方图已生成：' +
      '<div class="histogram-wrap"><canvas id="' + histId + '"></canvas></div>';
    appendMessage(histHtml, 'ai');
    setTimeout(() => drawHistogram(histId, stats, unit), 100);
  }

  // Step 4: Insights
  await sleep(600);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  let insight = '数据洞察：<br><br>';
  if (instr.toUpperCase().includes('ISS') && task.toUpperCase().includes('CASSINI')) {
    insight += '<strong>Cassini ISS 热红外图像分析：</strong><br>';
    insight += '该图像来自卡西尼号探测器成像科学子系统（ISS），数据采用 VICAR 格式存储。VICAR 是 NASA/JPL 开发的图像处理格式，广泛用于行星探测任务。<br><br>';
    insight += '图像动态范围为 <strong>' + stats.min.toFixed(1) + ' ~ ' + stats.max.toFixed(1) + ' DN</strong>，';
    insight += '标准差 <strong>' + stats.std.toFixed(1) + ' DN</strong>，表明图像对比度' + (stats.std / stats.mean > 0.2 ? '较高' : '适中') + '。<br><br>';
  } else {
    insight += '<strong>VICAR 图像特征分析：</strong><br>';
    insight += '该 VICAR 图像包含 <strong>' + vicarData.nl + ' x ' + vicarData.ns + '</strong> 像素，';
    insight += '数据格式为 <strong>' + vicarData.format + '</strong>。<br><br>';
    insight += '数值范围 ' + stats.min.toFixed(1) + ' ~ ' + stats.max.toFixed(1) + ' DN，';
    insight += '均值 ' + stats.mean.toFixed(1) + ' DN，标准差 ' + stats.std.toFixed(1) + ' DN。<br><br>';
  }
  insight += '选择上方快捷问题以获取更详细的专业分析。';
  appendMessage(insight, 'ai');
}

/* ========== GeoTIFF AI Analysis ========== */
async function autoAnalyzeGeoTIFF(tiffData) {
  const info = currentFileInfo;

  appendSystemMessage('已加载 ' + info.name);

  await sleep(600);
  appendTypingIndicator();
  await sleep(1400);
  removeTypingIndicator();

  const sampleFormatNames = { 1: '无符号整数', 2: '有符号整数', 3: 'IEEE 浮点', 4: '无定义' };
  const sfName = sampleFormatNames[tiffData.sampleFormat] || ('类型 #' + tiffData.sampleFormat);
  const hasGeo = !!tiffData.geoTransform;
  const hasData = !!tiffData.data;

  let html = '我已解析该 <strong>GeoTIFF</strong> 文件。';
  html += '<br><br>';
  html += '图像尺寸：<strong>' + tiffData.width + ' x ' + tiffData.height + '</strong> 像素<br>';
  html += '位深度：<strong>' + tiffData.bitsPerSample + ' bit (' + sfName + ')</strong><br>';
  html += '压缩：<strong>' + escapeHtml(tiffData.compression) + '</strong><br>';
  if (hasGeo) {
    html += '地理参考：<strong style="color:#30d158;">已嵌入坐标信息</strong><br>';
  } else {
    html += '地理参考：<strong style="color:#ff453a;">未检测到坐标信息</strong><br>';
  }
  html += '像素数据：<strong>' + (hasData ? '已解码 (' + tiffData.data.length.toLocaleString() + ' 像素)' : '压缩/外部读取（仅可访问元数据）') + '</strong>';
  html += '<br><br>需要我进行什么分析？可以尝试下方的快捷问题。';

  appendMessage(html, 'ai');

  // Step 2: Stats or metadata summary
  await sleep(800);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  if (hasData && stats) {
    const validPct = ((stats.count / stats.total) * 100).toFixed(1);
    const statsHtml = '像素值统计分析：' +

      '<div class="stat-item"><span class="stat-label">最小值</span><span class="stat-value">' + stats.min.toFixed(2) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">最大值</span><span class="stat-value">' + stats.max.toFixed(2) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">均值</span><span class="stat-value">' + stats.mean.toFixed(2) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">中位数</span><span class="stat-value">' + stats.median.toFixed(2) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">标准差</span><span class="stat-value">' + stats.std.toFixed(2) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">有效像素</span><span class="stat-value">' + stats.count.toLocaleString() + ' / ' + stats.total.toLocaleString() + ' (' + validPct + '%)</span></div>' +
      '</div>';
    appendMessage(statsHtml, 'ai');
  } else {
    let metaHtml = '元数据摘要：' +
      '<div class="stats-card">' +
      '<div class="stat-item"><span class="stat-label">宽度</span><span class="stat-value">' + tiffData.width + ' px</span></div>' +
      '<div class="stat-item"><span class="stat-label">高度</span><span class="stat-value">' + tiffData.height + ' px</span></div>' +
      '<div class="stat-item"><span class="stat-label">位深</span><span class="stat-value">' + tiffData.bitsPerSample + ' bit</span></div>' +
      '<div class="stat-item"><span class="stat-label">压缩</span><span class="stat-value">' + escapeHtml(tiffData.compression) + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">TIFF Tags</span><span class="stat-value">' + Object.keys(tiffData.tags).length + ' 个</span></div>' +
      '<div class="stat-item"><span class="stat-label">地理参考</span><span class="stat-value">' + (hasGeo ? 'Yes' : 'No') + '</span></div>' +
      '</div>';
    appendMessage(metaHtml, 'ai');
  }

  // Step 3: Geospatial insight
  await sleep(600);
  appendTypingIndicator();
  await sleep(1200);
  removeTypingIndicator();

  let insight = '地理空间洞察：<br><br>';
  if (hasGeo) {
    insight += '该 GeoTIFF 文件包含完整的地理参考信息，支持直接在 GIS 软件（QGIS、ArcGIS）中进行空间分析。<br><br>';
  }
  insight += '<strong>数据分辨率：</strong>像素尺寸与空间分辨率的对应关系取决于地图投影参数。对于未压缩 GeoTIFF(COG)，支持 HTTP Range 请求按需获取指定区域数据，适合 Web 端可视化。<br><br>';
  insight += '<strong>数据类型解读：</strong>';
  if (tiffData.bitsPerSample === 16 && tiffData.sampleFormat === 1) {
    insight += '16 位无符号整数常用于 DEM 高程数据或遥感辐射值。';
  } else if (tiffData.bitsPerSample === 32 && tiffData.sampleFormat === 3) {
    insight += '32 位浮点数据常见于科学计算结果（温度、降水等连续量）。';
  } else if (tiffData.bitsPerSample === 8) {
    insight += '8 位数据常见于分类结果（土地利用/土地覆盖）或索引图像（NDVI 等）。';
  } else {
    insight += tiffData.bitsPerSample + ' 位 ' + sfName + ' 数据。';
  }
  insight += '<br><br>选择上方快捷问题以获取更详细的专业分析。';
  appendMessage(insight, 'ai');
}

/* ========== Q&A Responses ========== */
function getAIResponse(userMsg) {
  const stats = currentFileStats;
  const info = currentFileInfo;
  const unit = (info && info.bunit) || 'K';
  const isCDF = info && info.format === 'CDF';
  const cdf = window._cdfJson;

  // ========== CDF Specific Queries ==========
  if (isCDF && (userMsg.includes('太阳风速度') || userMsg.includes('速度变化'))) {
    if (cdf && cdf.variables && cdf.variables.swSpeed) {
      const sw = cdf.variables.swSpeed;
      return '太阳风速度变化分析：<br><br>' +
        '<strong>整体统计：</strong>均值 ' + sw.mean.toFixed(0) + ' km/s，范围 ' + sw.min.toFixed(0) + ' ~ ' + sw.max.toFixed(0) + ' km/s<br>' +
        '<strong>慢风区间：</strong>300 ~ 450 km/s，对应宁静太阳风区域<br>' +
        '<strong>快风区间：</strong>550 ~ 700 km/s，对应冕洞高速流<br>' +
        '<br>速度变化趋势呈现典型的约 3 天周期性结构，与太阳自转导致的冕洞扫过相关。';
    }
    return '太阳风速度变化分析：<br><br>当前数据包含典型的慢风（~380 km/s）和快风（~620 km/s）交替结构。速度峰值通常与行星际磁场极性反转相关。';
  }

  if (isCDF && (userMsg.includes('磁场') || userMsg.includes('温度') || userMsg.includes('相关性'))) {
    if (cdf && cdf.variables) {
      const pt = cdf.variables.protonTemp;
      const bm = cdf.variables.bMag;
      let html = '磁场与温度相关性分析：<br><br>';
      if (bm) html += '<strong>磁场强度 |B|：</strong>均值 ' + bm.mean.toFixed(2) + ' nT，范围 ' + bm.min.toFixed(2) + ' ~ ' + bm.max.toFixed(2) + ' nT<br>';
      if (pt) html += '<strong>质子温度：</strong>均值 ' + pt.mean.toFixed(0) + ' K，范围 ' + pt.min.toFixed(0) + ' ~ ' + pt.max.toFixed(0) + ' K<br>';
      html += '<br><strong>物理关联：</strong><br>' +
        '1. 快风流中磁场强度通常较低（~3 nT），但质子温度较高（~150,000 K）<br>' +
        '2. 慢风流中磁场强度较高（~8 nT），温度较低（~30,000 K）<br>' +
        '3. 温度-速度关系符合 T ∝ v^2 经验规律，反映绝热膨胀历史差异。';
      return html;
    }
    return '磁场与温度相关性分析：<br><br>在太阳风中，快风流温度高但磁场弱，慢风流反之。这种反相关源于不同源区（冕洞 vs 宁静区）的膨胀历史和加热机制差异。';
  }

  if (isCDF && (userMsg.includes('快风') || userMsg.includes('慢风') || userMsg.includes('流结构'))) {
    return '快风/慢风流结构识别：<br><br>' +
      '<strong>慢风特征（Stream Interaction Region 前）：</strong><br>' +
      '• 速度：300 ~ 450 km/s<br>• 温度：20,000 ~ 50,000 K<br>• 密度：8 ~ 15 /cm³<br><br>' +
      '<strong>快风特征（Coronal Hole 高速流）：</strong><br>' +
      '• 速度：550 ~ 750 km/s<br>• 温度：100,000 ~ 200,000 K<br>• 密度：2 ~ 5 /cm³<br><br>' +
      '<strong>相互作用区（SIR/CIR）：</strong><br>' +
      '快风追赶慢风形成压缩区，密度和磁场增强，是宇宙线调制的重要区域。';
  }

  if (userMsg.includes('太阳风') || userMsg.includes('solar wind') || userMsg.includes('等离子体') || userMsg.includes('plasma')) {
    if (cdf) {
      const pt = cdf.variables.protonTemp;
      const sw = cdf.variables.swSpeed;
      let html = '太阳风分析报告：<br><br>';
      if (pt) html += '<strong>质子温度：</strong>均值 ' + pt.mean.toFixed(0) + ' K，范围 ' + pt.min.toFixed(0) + ' ~ ' + pt.max.toFixed(0) + ' K<br>';
      if (sw) html += '<strong>太阳风速度：</strong>均值 ' + sw.mean.toFixed(0) + ' km/s，范围 ' + sw.min.toFixed(0) + ' ~ ' + sw.max.toFixed(0) + ' km/s<br>';
      if (cdf.variables.bMag) html += '<strong>磁场强度：</strong>均值 ' + cdf.variables.bMag.mean.toFixed(1) + ' nT<br>';
      if (cdf.variables.density) html += '<strong>质子密度：</strong>均值 ' + cdf.variables.density.mean.toFixed(0) + ' /cm³<br>';
      html += '<br>数据呈现典型的慢风-快风交替结构，时间分辨率 ' + (cdf.global_attributes && cdf.global_attributes.Time_resolution || '1 hour') + '。';
      return html;
    }
  }

  // ========== Generic Quality Report ==========
  if (userMsg.includes('数据质量') || userMsg.includes('质量报告')) {
    const validPct = ((stats.count / stats.total) * 100).toFixed(1);
    if (isCDF) {
      return '数据质量报告：<br><br>' +
        '• 有效数据点：' + stats.count.toLocaleString() + ' / ' + stats.total.toLocaleString() + ' (' + validPct + '%)<br>' +
        '• 数据完整度：' + validPct + '%，质量等级：' + (parseFloat(validPct) > 90 ? '优秀' : '良好') + '<br>' +
        '• 数值范围：' + stats.min.toFixed(2) + ' ~ ' + stats.max.toFixed(2) + ' ' + unit + '<br>' +
        '• 均值：' + stats.mean.toFixed(2) + ' ' + unit + ' | 标准差：' + stats.std.toFixed(2) + '<br>' +
        '• 异常峰值：' + (stats.hotSpots ? stats.hotSpots.length : 0) + ' 处（超过 μ+2σ）<br><br>' +
        '该时间序列数据集' + (parseFloat(validPct) > 90 ? '适合进行趋势分析和相关性研究' : '建议在缺失时间点使用插值填充') + '。';
    }
    return '数据质量报告：<br><br>' +
      '• 缺失像素：' + (stats.total - stats.count).toLocaleString() + ' / ' + stats.total.toLocaleString() + ' (' + (100 - parseFloat(validPct)).toFixed(1) + '%)<br>' +
      '• 数据完整度：' + validPct + '%，质量等级：' + (parseFloat(validPct) > 90 ? '优秀' : '良好') + '<br>' +
      '• 数值范围：' + stats.min.toFixed(2) + ' ~ ' + stats.max.toFixed(2) + ' ' + unit + '<br>' +
      '• 均值：' + stats.mean.toFixed(2) + ' ' + unit + ' | 标准差：' + stats.std.toFixed(2) + '<br>' +
      '• 异常点：' + (stats.hotSpots ? stats.hotSpots.length : 0) + ' 处（超过 μ+2σ）<br>' +
      '• 数据类型：' + (info.bitpix > 0 ? 'INT' + info.bitpix : 'FLOAT' + Math.abs(info.bitpix)) + '<br><br>' +
      '该数据集' + (parseFloat(validPct) > 90 ? '适合进行定量分析' : '建议在缺失区域使用插值填充') + '。';
  }

  // ========== Profile / Time Series ==========
  if (userMsg.includes('剖面') || userMsg.includes('profile') || userMsg.includes('时间序列')) {
    if (isCDF) {
      return '时间序列分析结果：<br><br>' +
        '• 时间跨度：' + stats.total + ' 个时间点<br>' +
        '• 数值范围：' + stats.min.toFixed(2) + ' ~ ' + stats.max.toFixed(2) + ' ' + unit + '<br>' +
        '• 均值：' + stats.mean.toFixed(2) + ' ' + unit + '<br>' +
        '• 标准差：' + stats.std.toFixed(2) + ' ' + unit + '<br>' +
        '• 检测到 ' + (stats.hotSpots ? stats.hotSpots.length : 0) + ' 处显著峰值/谷值<br><br>' +
        '该序列显示典型的太阳风参数演化特征，快慢风交替导致周期性波动。';
    }
    return '剖面分析结果（沿中心水平线 Y=' + Math.floor((info.naxis2 || 256) / 2) + '）：<br><br>' +
      '• 剖面总长度：' + info.naxis1 + ' 像素<br>' +
      '• 数值范围：' + stats.min.toFixed(2) + ' ~ ' + stats.max.toFixed(2) + ' ' + unit + '<br>' +
      '• 均值：' + stats.mean.toFixed(2) + ' ' + unit + '<br>' +
      '• 标准差：' + stats.std.toFixed(2) + ' ' + unit + '<br>' +
      '• 检测到 ' + (stats.hotSpots ? stats.hotSpots.length : 0) + ' 处局部尖峰<br><br>' +
      '该剖面显示典型的表面特征分布，数值梯度变化反映了表面物质属性的差异。';
  }

  if (userMsg.includes('导出') || userMsg.includes('export')) {
    if (isCDF) {
      return '分析结果已准备就绪，可导出以下格式：<br><br>' +
        '<strong>1. PDF 报告</strong> — 包含完整的统计、变量分析和趋势图<br>' +
        '<strong>2. CSV 数据</strong> — 导出时间序列（' + stats.count.toLocaleString() + ' 行）<br>' +
        '<strong>3. CDF 副本</strong> — 保留原始元数据的标准格式<br>' +
        '<strong>4. JSON 摘要</strong> — 机器可读的分析元数据<br><br>' +
        '请选择需要的格式，我可以直接为你生成对应文件。';
    }
    return '分析结果已准备就绪，可导出以下格式：<br><br>' +
      '<strong>1. PDF 报告</strong> — 包含完整的统计、异常检测和直方图<br>' +
      '<strong>2. CSV 数据</strong> — 导出有效像素值（' + stats.count.toLocaleString() + ' 行）<br>' +
      '<strong>3. GeoTIFF</strong> — 校准后的图像，附带坐标参考<br>' +
      '<strong>4. JSON 摘要</strong> — 机器可读的分析元数据<br><br>' +
      '请选择需要的格式，我可以直接为你生成对应文件。';
  }

  if (userMsg.includes('异常') || userMsg.includes('anomaly')) {
    let html = '异常检测结果：<br><br>';
    if (stats.hotSpots && stats.hotSpots.length > 0) {
      html += '发现 ' + stats.hotSpots.length + ' 处异常区域（超过 μ+2σ = ' + (stats.mean + 2 * stats.std).toFixed(1) + ' ' + unit + '）：<br><br>';
      stats.hotSpots.forEach((s, i) => {
        if (s.index !== undefined) {
          html += '<strong>异常点 ' + (i+1) + '：</strong>时间索引 ' + s.index + '，数值 ' + s.value.toFixed(2) + ' ' + unit + '（' + (s.label || '') + '）<br>';
        } else {
          html += '<strong>异常点 ' + (i+1) + '：</strong>坐标 (' + s.x + ', ' + s.y + ')，数值 ' + s.value.toFixed(2) + ' ' + unit + '<br>';
        }
      });
      if (isCDF) {
        html += '<br>可能的科学解释：<br>' +
          '1. 快风增强事件 — 冕洞高速流到达<br>' +
          '2. 激波穿越 — 行星际激波导致参数突变<br>' +
          '3. 仪器模式切换 — 探测器状态转换导致的数据跳变';
      } else {
        html += '<br>可能的科学解释：<br>' +
          '1. 热惯性异常 — 岩石密度更高，蓄热更多<br>' +
          '2. 坡度效应 — 面朝太阳的斜坡接收更多辐射<br>' +
          '3. 仪器伪影 — 探测器饱和或读出噪声';
      }
    } else {
      html += '未检测到明显异常。数据分布均匀，所有值均在正常范围内。';
    }
    return html;
  }

  if (userMsg.includes('统计') || userMsg.includes('stats')) {
    return '统计摘要：<br><br>' +
      '• 最小值：' + stats.min.toFixed(2) + ' ' + unit + '<br>' +
      '• 最大值：' + stats.max.toFixed(2) + ' ' + unit + '<br>' +
      '• 均值：' + stats.mean.toFixed(2) + ' ' + unit + '<br>' +
      '• 中位数：' + stats.median.toFixed(2) + ' ' + unit + '<br>' +
      '• 标准差：' + stats.std.toFixed(2) + ' ' + unit + '<br>' +
      '• 有效数据：' + stats.count.toLocaleString() + ' / ' + stats.total.toLocaleString();
  }

  // ========== VICAR Specific Queries ==========
  const isVICAR = info && info.format === 'VICAR';
  if (isVICAR && (userMsg.includes('信噪比') || userMsg.includes('SNR'))) {
    const snr = stats ? (stats.mean / stats.std).toFixed(1) : 'N/A';
    return '图像信噪比分析：<br><br>' +
      '<strong>估算方法：</strong>SNR ≈ μ / σ（均值/标准差）<br>' +
      '<strong>估算结果：</strong>SNR ≈ <strong>' + snr + '</strong><br><br>' +
      '该信噪比表明图像质量' + (stats && stats.mean / stats.std > 20 ? '优秀' : stats && stats.mean / stats.std > 10 ? '良好' : '一般') + '。<br><br>' +
      '<strong>补充说明：</strong><br>' +
      '1. VICAR 格式图像的 DN 值通常包含暗电流偏置，实际 SNR 可能需要减去偏置后重新计算<br>' +
      '2. 对于热红外波段，SNR 与等效噪声温差 (NETD) 直接相关<br>' +
      '3. 建议结合标定系数将 DN 转换为物理量后进行定量分析';
  }

  if (isVICAR && (userMsg.includes('异常区域') || userMsg.includes('异常'))) {
    let html = '异常区域检测结果：<br><br>';
    if (stats && stats.hotSpots && stats.hotSpots.length > 0) {
      html += '通过统计阈值法（μ + 2σ = ' + (stats.mean + 2 * stats.std).toFixed(1) + ' DN）检测到 <strong>' + stats.hotSpots.length + '</strong> 处异常区域：<br><br>';
      stats.hotSpots.forEach((s, i) => {
        if (s.x !== undefined) {
          html += '<strong>区域 ' + (i+1) + '：</strong>坐标 (' + s.x + ', ' + s.y + ')，数值 ' + s.value.toFixed(2) + ' DN<br>';
        } else {
          html += '<strong>区域 ' + (i+1) + '：</strong>索引 ' + s.index + '，数值 ' + s.value.toFixed(2) + ' DN<br>';
        }
      });
      html += '<br><strong>可能的成因：</strong><br>';
      html += '1. 表面热惯性异常（岩石露头 vs 粉尘覆盖区）<br>';
      html += '2. 局部地形效应（坡向导致照明差异）<br>';
      html += '3. 传感器伪影（读出噪声或坏像素）';
    } else {
      html += '未检测到明显的异常区域。所有像素值均在正常范围内（μ ± 2σ）。<br><br>';
      html += '可尝试调整阈值（如 μ + 1.5σ）以检测更细微的区域差异。';
    }
    return html;
  }

  if (isVICAR && (userMsg.includes('光谱') || userMsg.includes('spectral'))) {
    return '光谱特征提取分析：<br><br>' +
      '<strong>当前图像为单波段数据</strong>，无法直接提取光谱特征。<br><br>' +
      '如需进行光谱分析，建议：<br>' +
      '1. <strong>多波段 VICAR 数据：</strong>如果原始任务采集了多波段图像（如 Cassini VIMS），加载对应波段文件后可计算波段比、光谱角等特征<br>' +
      '2. <strong>波段比值法：</strong>选择两个不同波长的 VICAR 图像，计算比值可增强成分对比度<br>' +
      '3. <strong>主成分分析 (PCA)：</strong>对多波段数据集进行降维，提取主要成分作为光谱特征<br><br>' +
      '<strong>热红外光谱：</strong>对于热红外波段，峰值波长位置可反演表面温度分布（Wien 位移定律）';
  }

  // ========== HDF4 Specific Queries ==========
  const isHDF4 = info && (info.format === 'HDF4' || info.format === 'HDF4-EOS');
  if (isHDF4 && (userMsg.includes('云覆盖') || userMsg.includes('云检测') || userMsg.includes('cloud'))) {
    return '云覆盖分析：<br><br>' +
      '<strong>MODIS 云检测方法：</strong><br><br>' +
      '1. <strong>内部云掩膜：</strong>MOD09GA 产品附带 QA 波段 (QA_SD, QA_Land)，包含每个像素的云标记<br>' +
      '   - Bit 0: 云阴影<br>' +
      '   - Bit 1: 云掩膜结果<br>' +
      '   - Bit 2-3: 云置信度（0=无云, 1=可能, 2=可能, 3=高置信）<br><br>' +
      '2. <strong>反射率阈值法：</strong>可见光波段（Band 1: 620-670nm）反射率 > 0.3 通常指示云像素<br>' +
      '3. <strong>亮温阈值法：</strong>热红外波段 (Band 7) 亮温低于阈值时标记为云<br><br>' +
      '建议提取 QA 波段进行像素级云掩膜，以获得准确的云覆盖比例。';
  }

  if (isHDF4 && (userMsg.includes('NDVI') || userMsg.includes('植被指数') || userMsg.includes('植被'))) {
    return 'NDVI 植被指数计算：<br><br>' +
      '<strong>NDVI 公式：</strong>NDVI = (NIR - Red) / (NIR + Red)<br><br>' +
      '<strong>MODIS 波段对应：</strong><br>' +
      '• Band 1 (Red): 620-670 nm — 叶绿素吸收波段<br>' +
      '• Band 2 (NIR): 841-876 nm — 植被高反射波段<br><br>' +
      '<strong>NDVI 取值范围：</strong> -1 ~ +1<br>' +
      '• < 0.1: 无植被（裸地、水体、云）<br>' +
      '• 0.1 ~ 0.3: 稀疏植被<br>' +
      '• 0.3 ~ 0.6: 中等植被覆盖<br>' +
      '&gt; 0.6: 密集植被<br><br>' +
      '对于 MOD09GA 产品，可直接使用 Band 2 (sur_refl_02) 和 Band 1 (sur_refl_01) 计算 NDVI。注意先用 QA 波段掩膜云像素。';
  }

  if (isHDF4 && (userMsg.includes('波段') || userMsg.includes('相关性') || userMsg.includes('band'))) {
    return '波段间相关性分析：<br><br>' +
      '<strong>MODIS 7 个反射波段物理意义：</strong><br><br>' +
      '<table style="width:100%;font-size:12px;border-collapse:collapse;">' +
      '<tr style="border-bottom:1px solid rgba(255,255,255,0.1);"><th style="text-align:left;padding:4px;">波段</th><th style="text-align:left;padding:4px;">波长范围</th><th style="text-align:left;padding:4px;">主要用途</th></tr>' +
      '<tr><td style="padding:4px;">Band 1</td><td>620-670 nm</td><td>叶绿素吸收/土壤</td></tr>' +
      '<tr><td style="padding:4px;">Band 2</td><td>841-876 nm</td><td>植被/云边界</td></tr>' +
      '<tr><td style="padding:4px;">Band 3</td><td>459-479 nm</td><td>土壤/植被差异</td></tr>' +
      '<tr><td style="padding:4px;">Band 4</td><td>545-565 nm</td><td>绿色植被</td></tr>' +
      '<tr><td style="padding:4px;">Band 5</td><td>1230-1250 nm</td><td>叶片含水量</td></tr>' +
      '<tr><td style="padding:4px;">Band 6</td><td>1628-1652 nm</td><td>雪/云区分</td></tr>' +
      '<tr><td style="padding:4px;">Band 7</td><td>2105-2155 nm</td><td>大气/云校正</td></tr>' +
      '</table><br>' +
      '高相关波段组合：<br>' +
      '• Band 1-Band 2: NDVI 核心波段，负相关（植被区）<br>' +
      '• Band 5-Band 6: 水分吸收带，正相关<br>' +
      '• Band 3-Band 4: 可见光内部，强正相关';
  }

  // ========== GeoTIFF Specific Queries ==========
  const isGeoTIFF = info && info.format === 'GeoTIFF';
  if (isGeoTIFF && (userMsg.includes('高程') || userMsg.includes('elevation') || userMsg.includes('DEM'))) {
    let html = '高程分布分析：<br><br>';
    if (stats && stats.count > 0) {
      html += '<div class="stats-card">' +
        '<div class="stat-item"><span class="stat-label">最低高程</span><span class="stat-value">' + stats.min.toFixed(1) + ' m</span></div>' +
        '<div class="stat-item"><span class="stat-label">最高高程</span><span class="stat-value">' + stats.max.toFixed(1) + ' m</span></div>' +
        '<div class="stat-item"><span class="stat-label">平均高程</span><span class="stat-value">' + stats.mean.toFixed(1) + ' m</span></div>' +
        '<div class="stat-item"><span class="stat-label">高程中位数</span><span class="stat-value">' + stats.median.toFixed(1) + ' m</span></div>' +
        '<div class="stat-item"><span class="stat-label">高程标准差</span><span class="stat-value">' + stats.std.toFixed(1) + ' m</span></div>' +
        '<div class="stat-item"><span class="stat-label">地形起伏度</span><span class="stat-value">' + (stats.max - stats.min).toFixed(1) + ' m</span></div>' +
        '</div>';
      html += '<br><strong>地形特征分析：</strong><br>';
      if (stats.std / stats.mean < 0.05) {
        html += '地形起伏度很小，地貌以平原或台地为主。';
      } else if (stats.std / stats.mean < 0.2) {
        html += '地形起伏度中等，包含丘陵和低山地形。';
      } else {
        html += '地形起伏度大，地貌以山地或峡谷为主。';
      }
    } else {
      html += '当前 GeoTIFF 为压缩格式，像素数据无法直接读取。请使用 GDAL 或 rasterio 等工具进行高程分析。';
    }
    return html;
  }

  if (isGeoTIFF && (userMsg.includes('冰川') || userMsg.includes('glacier') || userMsg.includes('冰'))) {
    return '冰川变化检测方法：<br><br>' +
      '<strong>常用方法：</strong><br><br>' +
      '1. <strong>多时相差分法：</strong>选择两个时期的高程数据计算差值<br>' +
      '   - 厚度变化 = h(t2) - h(t1)<br>' +
      '   - 正值 = 积累，负值 = 消融<br><br>' +
      '2. <strong>冰面速度追踪：</strong>利用特征匹配或 InSAR 测量冰流速<br><br>' +
      '3. <strong>冰川边界提取：</strong><br>' +
      '   - 阈值法：高程 + 梯度 + 反照率<br>' +
      '   - NDSI（归一化雪指数）: (Green - SWIR) / (Green + SWIR)<br><br>' +
      '4. <strong>质量平衡估算：</strong><br>' +
      '   - 积累区: 表面高程增加<br>' +
      '   - 平衡线: 高程变化 ≈ 0<br>' +
      '   - 消融区: 表面高程降低<br><br>' +
      '当前 DEM 分辨率为 ' + (info.width || '?') + ' x ' + (info.height || '?') + ' 像素，适合进行流域尺度的冰川变化分析。';
  }

  if (isGeoTIFF && (userMsg.includes('GeoJSON') || userMsg.includes('导出') || userMsg.includes('export') || userMsg.includes('json'))) {
    return 'GeoJSON 导出选项：<br><br>' +
      '<strong>可导出的数据类型：</strong><br><br>' +
      '1. <strong>等高线 GeoJSON</strong> — 从 DEM 提取指定间隔的等高线矢量数据<br>' +
      '2. <strong>分类区域 GeoJSON</strong> — 按高程区间或坡度分类生成多边形<br>' +
      '3. <strong>采样点 GeoJSON</strong> — 规则网格采样点，携带高程属性 (Point)<br>' +
      '4. <strong>统计区域 GeoJSON</strong> — 按行政区划或自定义区域汇总统计<br><br>' +
      '<strong>实现方式：</strong><br>' +
      '• 在线工具：Mapshaper、GDAL/OGR<br>' +
      '• Python: rasterio + geojson-pydantic<br>' +
      '• JavaScript: turf.js + geotiff.js<br><br>' +
      '请告诉我你需要哪种导出格式和空间范围，我可以提供具体的操作步骤。';
  }

  // Default responses
  const defaults = [
    '根据当前数据分析，数值分布呈近似正态分布，峰值位于均值附近。如果你想深入分析特定区域或时间段，可以指定范围。',
    '这是一个很好的问题。基于当前数据（均值 ' + stats.mean.toFixed(1) + ' ' + unit + '，标准差 ' + stats.std.toFixed(1) + '），该数据集的变异性处于' + (stats.std / stats.mean > 0.3 ? '较高' : '中等') + '水平。你希望我做更详细的分区/分段统计吗？',
    '收到，我来分析一下。当前数据包含 ' + stats.total.toLocaleString() + ' 个有效数据点。如果你想比较不同时间段或不同观测的数据，我可以加载其他文件进行对比。',
    '好的，让我来处理。基于当前数据集的统计特征，数据质量为' + ((stats.count / stats.total * 100) > 90 ? '优秀' : '良好') + '，适合进行定量分析。'
  ];
  return defaults[Math.floor(Math.random() * defaults.length)];
}

function sendMessage(text) {
  const msg = (text || '').trim();
  if (!msg) return;
  msgInput.value = '';
  msgInput.disabled = true;
  sendBtn.disabled = true;
  appendMessage(escapeHtml(msg), 'user');

  setTimeout(() => {
    appendTypingIndicator();
    setTimeout(() => {
      removeTypingIndicator();
      const reply = getAIResponse(msg);
      appendMessage(reply, 'ai');
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
    }, 1200);
  }, 200);
}

/* ========== Event Listeners ========== */
fileSelectBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) loadAndAnalyzeFile(file);
});

document.querySelectorAll('.sample-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const sample = btn.getAttribute('data-sample');
    if (sample === 'psp_cdf') {
      await loadCDFData();
      return;
    }
    if (sample === 'vicar_demo') {
      await loadVICARDemo();
      return;
    }
    if (sample === 'modis_hdf4') {
      await loadHDF4Demo();
      return;
    }
    if (sample === 'geotiff_demo') {
      await loadGeoTIFFDemo();
      return;
    }
    loadSampleData(sample);
  });
});

sendBtn.addEventListener('click', () => sendMessage(msgInput.value));

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(msgInput.value);
  }
});

document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const msg = btn.getAttribute('data-msg');
    sendMessage(msg);
  });
});

/* ========== URL Parameter Auto-Load ========== */
(function() {
  const params = new URLSearchParams(window.location.search);
  const sample = params.get('sample');
  if (sample) {
    setTimeout(() => {
      if (sample === 'psp_cdf') {
        loadCDFData();
      } else if (sample === 'vicar_demo') {
        loadVICARDemo();
      } else if (sample === 'modis_hdf4') {
        loadHDF4Demo();
      } else if (sample === 'geotiff_demo') {
        loadGeoTIFFDemo();
      } else {
        loadSampleData(sample);
      }
    }, 300);
  }
})();
</script>
</body>
</html>
