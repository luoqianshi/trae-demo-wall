<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Switcher 工作区释放演示</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 安全声明条（始终可见）-->
  <div class="safety-banner" id="safety-statement">
    本页面是安全的前端模拟，不会操作真实窗口、虚拟桌面、PowerToys 或 PowerShell。
  </div>

  <!-- 顶部品牌 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">WS</span>
      <span class="brand-text">
        Workspace Switcher
        <span class="sub">工作区释放演示 · Resource Release Demo</span>
      </span>
    </div>
  </header>

  <!-- 模拟对象声明（始终可见）-->
  <p class="sim-note" id="sim-note">下列显示器、桌面、窗口、URL 均为模拟对象，仅用于演示工作区释放与恢复流程，不读取真实系统状态。</p>

  <main class="stage">
    <!-- 大显示器（核心视觉 + 全部交互融合在内）-->
    <section class="monitor-wrap" aria-label="模拟显示器">
      <div class="monitor">
        <div class="monitor-bezel">
          <div class="monitor-screen" id="monitor-screen">
            <!-- 视觉层 -->
            <div class="desktop-label" id="desktop-label"></div>
            <div class="desktop-icons" id="desktop-icons"></div>
            <div class="window-layer" id="window-layer"></div>

            <!-- 阶段状态 toast（显示器顶部）-->
            <div class="phase-toast" id="phase-toast"></div>

            <!-- URL 恢复徽标（显示器右上角）-->
            <div class="url-badge" id="url-restore-badge" style="display:none;">0/8</div>

            <!-- 工作区管理 flyout（从任务栏托盘弹出）-->
            <div class="mgmt-flyout" id="mgmt-flyout" style="display:none;"></div>

            <!-- 干净桌面覆盖层 + 恢复按钮 -->
            <div class="monitor-overlay" id="monitor-overlay" style="display:none;"></div>

            <!-- 证据覆盖层（完成阶段，显示器内）-->
            <div class="evidence-overlay" id="evidence-overlay" style="display:none;"></div>

            <!-- 任务栏（含 Workspace Switcher 托盘图标）-->
            <div class="taskbar" id="taskbar"></div>

            <!-- 箭头提示（指向可点击元素）-->
            <div class="arrow-hint" id="arrow-hint" style="display:none;"></div>
          </div>
        </div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
      </div>

      <!-- 桌面指示点（显示器下方）-->
      <div class="desktop-indicator" id="desktop-indicator" aria-label="当前桌面"></div>
    </section>

    <!-- 事件日志（次要区域，可折叠）-->
    <section class="log-panel" aria-label="事件日志">
      <details>
        <summary>事件日志 <span class="tag-sim">[SIMULATED]</span></summary>
        <ul class="log-list" id="log-list"></ul>
      </details>
    </section>
  </main>

  <!-- JS 失败兜底说明 -->
  <noscript>
    <div class="noscript-fallback">
      <h1>Workspace Switcher 工作区释放演示</h1>
      <p>本页面是安全的前端模拟，不会操作真实窗口、虚拟桌面、PowerToys 或 PowerShell。</p>
      <p>当前浏览器禁用了 JavaScript，无法体验交互演示。请启用 JavaScript 后重新打开本页面。</p>
      <p>本 Demo 模拟完整流程：4 个工作区自动轮播 -&gt; 点击托盘图标打开工作区管理 -&gt; 进入重任务/游戏模式（自动记录并收起）-&gt; 干净桌面 -&gt; 恢复工作区（自动恢复，浏览器 URL 8/8）-&gt; 证据条。</p>
      <p>关键指标（来自真实实验报告）：Desktops before 4 · Baseline visible windows 28 · Restore exit code 0 · Desktops after restore 4 · Browser args --new-window 8/8 · Hard Failures None。</p>
    </div>
  </noscript>

  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/scenes.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
