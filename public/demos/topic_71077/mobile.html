    {id:4,name:'王木匠',sub:'木作匠人 · 传统榫卯',cat:'wood',label:'木作',tags:['榫卯','原木'],img:'assets/wood_400x400.jpg',priceMin:450,priceMax:3500,rate:4.7,rev:93,dur:'7-14天',desc:'坚持使用传统榫卯结构，拒绝铁钉胶水。主要选用黑胡桃、樱桃木等优质硬木。'},
    {id:5,name:'赵设计师',sub:'独立首饰设计师',cat:'jewelry',label:'首饰',tags:['手工金工','原创'],img:'assets/jewelry_400x400.jpg',priceMin:580,priceMax:5000,rate:4.9,rev:211,dur:'5-12天',desc:'擅长将自然元素融入金工作品。可定制对戒、项链、耳环等，支持刻字、镶嵌宝石。'},
    {id:6,name:'周师傅',sub:'手工皮具 · 极简主义',cat:'leather',label:'皮具',tags:['极简','公文包'],img:'assets/briefcase_400x400.jpg',priceMin:900,priceMax:4200,rate:4.8,rev:158,dur:'10-15天',desc:'追求极简美学，选用意大利进口植鞣革。擅长公文包、笔记本电脑包等商务皮具。'}
  ];

  var pages=['page-home','page-craftsmen','page-order','page-more'];
  var cur=0;

  function renderList(list, elId){
    var el=document.getElementById(elId);
    el.innerHTML=list.map(function(c){
      return '<div class="m-card" onclick="openM('+c.id+')">'+
        '<img src="'+c.img+'" alt="">'+
        '<div class="m-card-body">'+
          '<div>'+
            '<div class="tags">'+c.tags.map(function(t){return '<span class="tag-sm">'+t+'</span>';}).join('')+'</div>'+
            '<h4>'+c.name+'</h4>'+
            '<div class="sub">'+c.sub+'</div>'+
          '</div>'+
          '<div class="bottom">'+
            '<span class="price">\u00A5'+c.priceMin+'-'+c.priceMax+'</span>'+
            '<span class="rating">'+c.rate+'\u2605</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  function init(){
    renderList(data.slice(0,3),'homeList');
    renderList(data,'craftsmanList');
  }

  window.goTab=function(i){
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
    document.getElementById(pages[i]).classList.add('active');
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.toggle('active',+t.getAttribute('data-i')===i);});
    document.getElementById('screen').scrollTop=0;
    cur=i;
  };

  window.filterC=function(cat){
    document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.toggle('active',c.getAttribute('data-c')===cat);});
    var filtered=cat==='all'?data:data.filter(function(c){return c.cat===cat;});
    renderList(filtered,'craftsmanList');
  };

  window.openM=function(id){
    var c=data.find(function(x){return x.id===id;});
    if(!c)return;
    document.getElementById('mmImg').src=c.img;
    document.getElementById('mmName').textContent=c.name;
    document.getElementById('mmSub').textContent=c.sub;
    document.getElementById('mmCat').textContent=c.label;
    document.getElementById('mmDur').textContent=c.dur;
    document.getElementById('mmRate').textContent=c.rate+' ('+c.rev+'条)';
    document.getElementById('mmDesc').textContent=c.desc;
    document.getElementById('mModal').classList.add('open');
  };

  window.closeModal=function(e){
    if(e&&e.target!==e.currentTarget)return;
    document.getElementById('mModal').classList.remove('open');
  };

  window.showToast=function(msg){
    var w=document.getElementById('toastWrap');
    var t=document.createElement('div');
    t.className='toast-msg'; t.textContent=msg;
    w.appendChild(t);
    setTimeout(function(){t.style.transition='opacity 0.3s';t.style.opacity='0';setTimeout(function(){t.remove();},300);},2500);
  };

  window.submitForm=function(){
    var r1=document.getElementById('r1').value, r2=document.getElementById('r2').value, r3=document.getElementById('r3').value;
    if(r1==='请选择'||r2==='请选择'||r3==='请选择'){showToast('请至少填写送礼对象、场合和预算');return;}
    showToast('需求提交成功！24小时内匹配匠人');
    resetForm();
  };

  window.resetForm=function(){
    document.querySelectorAll('select').forEach(function(s){s.selectedIndex=0;});
    document.querySelectorAll('textarea, input[type=date]').forEach(function(el){el.value='';});
  };

  init();
})();
</script>
</body>
</html>
