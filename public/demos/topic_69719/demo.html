<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #3b82f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* ===== PANEL ===== */
    .panel {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      z-index: 100;
      transition: gap 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      cursor: grab;
    }

    .panel:active { cursor: grabbing; }

    .panel.animating-back {
      transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .panel.multi-shift { gap: 6px; }

    /* ===== LEFT PANEL ===== */
    .left-panel {
      height: 50px;
      background: #1a1a1a;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-radius 0.4s ease;
    }

    .left-panel.time-mode { width: 130px; }
    .left-panel.time-mode.expanded { width: 300px; height: 74px; border-radius: 35px; }

    .left-panel.shortcuts-mode { width: 148px; }
    .left-panel.shortcuts-mode.expanded { width: 256px; height: 74px; border-radius: 35px; }

    .left-panel.time-mode.multi-open { width: 130px; }
    .left-panel.time-mode.multi-open.expanded { width: 180px; height: 74px; border-radius: 35px; }
    .left-panel.time-mode.multi-open.expanded .mem-label { opacity: 0; max-width: 0; }
    .left-panel.shortcuts-mode .time-wrap { display: none; }
    .left-panel.time-mode .shortcuts-group { display: none; }
    .left-panel.time-mode.multi-open.expanded .time-extra { opacity: 0; max-width: 0; }
    .left-panel.shortcuts-mode.multi-open { width: 148px; }
    .shortcuts-mode.multi-open .shortcuts-group { gap: 4px; }
    .shortcuts-mode.multi-open.expanded { width: 180px; height: 74px; border-radius: 35px; }
    .shortcuts-mode.multi-open.expanded .shortcuts-group { gap: 6px; }

    /* ===== RIGHT PANEL ===== */
    .right-panel {
      height: 50px;
      background: #1a1a1a;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  gap 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-radius 0.4s ease;
      gap: 0;
    }

    .right-panel.single-mode { width: 50px; padding: 0; }
    .right-panel.single-mode.expanded { width: 110px; height: 74px; border-radius: 35px; gap: 0; padding: 0 6px; }

    .right-panel.multi-mode { width: 104px; gap: 4px; }
    .right-panel.multi-mode.expanded { width: 300px; height: 74px; border-radius: 35px; gap: 12px; }

    /* ===== TIME CONTENT ===== */
    .time-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    .time-text {
      color: white;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .mem-label {
      color: #aaa;
      font-size: 11px;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transition: opacity 0.3s ease, max-width 0.4s ease;
    }

    .expanded .mem-label { opacity: 1; max-width: 60px; }

    .time-extra {
      display: flex;
      flex-direction: column;
      gap: 1px;
      font-size: 10px;
      color: #777;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transition: opacity 0.3s ease 0.05s, max-width 0.4s ease;
    }

    .expanded .time-extra { opacity: 1; max-width: 60px; }

    /* ===== SHORTCUTS GROUP ===== */
    .shortcuts-group {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: gap 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .shortcuts-mode .shortcuts-group { opacity: 1; }
    .shortcuts-mode.expanded .shortcuts-group { gap: 12px; }

    .sc-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      padding-bottom: 14px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: grab;
    }

    .sc-item.dragging { opacity: 0.3; transform: scale(0.9); }

    .shortcuts-mode .sc-item { width: 36px; }
    .shortcuts-mode.multi-open .sc-item { width: 32px; }
    .shortcuts-mode.expanded .sc-item { width: 68px; }
    .shortcuts-mode.multi-open.expanded .sc-item { width: 44px; }

    .sc-icon { font-size: 18px; line-height: 1; }

    .sc-label {
      font-size: 8px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sc-label-short { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sc-label-full { font-size: 10px; max-width: 68px; opacity: 0; }
    .shortcuts-mode.expanded .sc-label-short { opacity: 0; }
    .shortcuts-mode.expanded .sc-label-full { opacity: 1; }

    /* 拖拽悬停区域 */
    .shortcuts-group.drag-over {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
    }

    /* ===== PRINTER CIRCLE ===== */
    .printer-item {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .printer-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .printer-ring {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 3px solid #22c55e;
    }

    .printer-percent {
      color: white;
      font-size: 11px;
      font-weight: 600;
    }

    /* ===== PRINTER DETAIL ===== */
    .printer-detail {
      display: flex;
      flex-direction: column;
      margin-left: 0;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 0.3s ease, max-width 0.4s ease, margin-left 0.4s ease;
    }

    .expanded .printer-detail { opacity: 1; max-width: 80px; margin-left: 6px; }

    .printer-detail .name { color: white; font-size: 12px; font-weight: 500; }
    .printer-detail .info { color: #888; font-size: 10px; }

    /* ===== SECOND PRINTER ===== */
    .printer-item-2 {
      display: flex;
      align-items: center;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transform: scale(0.5);
      transition: opacity 0.35s ease, max-width 0.4s ease,
                  transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .multi-mode .printer-item-2 { opacity: 1; max-width: 120px; transform: scale(1); }

    .printer-detail-2 { opacity: 0 !important; max-width: 0 !important; }
    .multi-mode.expanded .printer-detail-2 { opacity: 1 !important; max-width: 80px !important; transition-delay: 0.08s; }

    /* ===== MINIMIZED INDICATOR ===== */
    .collapsed-indicator {
      display: none;
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #22c55edd, #22c55e, #22c55edd);
      box-shadow: 0 0 8px #22c55e80;
      cursor: pointer;
      pointer-events: auto;
      z-index: 200;
      transition: transform 0.2s ease, box-shadow 0.2s ease, width 0.2s ease;
    }

    .collapsed-indicator:hover {
      transform: translateX(-50%) scaleX(1.15);
      width: 70px;
      box-shadow: 0 0 12px #22c55eaa;
    }

    .collapsed-indicator:active {
      transform: translateX(-50%) scaleX(1.05);
    }

    /* ===== HINT ===== */
    .hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      line-height: 1.8;
    }

    /* ===== TOGGLE BUTTON ===== */
    .toggle-btn {
      position: fixed;
      top: 166px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 6px 20px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease;
      z-index: 50;
    }

    .toggle-btn:hover { background: rgba(255,255,255,0.25); }

    @media (prefers-reduced-motion: reduce) {
      .panel, .left-panel, .right-panel, .time-wrap, .mem-label,
      .time-extra, .printer-item, .printer-circle, .printer-item-2, .printer-detail {
        transition-duration: 0.01s !important;
      }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <!-- LEFT PANEL -->
    <div class="left-panel time-mode" id="leftPanel">
      <div class="time-wrap" id="timeWrap">
        <span class="mem-label" id="memLabel">内存 --</span>
        <span class="time-text" id="timeText">--:--:--</span>
        <div class="time-extra">
          <span id="netUp">--</span>
          <span id="netDown">--</span>
        </div>
      </div>
      <div class="shortcuts-group" id="shortcutsGroup">
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel single-mode" id="rightPanel">
      <div class="printer-item">
        <div class="printer-circle">
          <div class="printer-ring"></div>
          <span class="printer-percent">100%</span>
        </div>
        <div class="printer-detail">
          <span class="name">2号</span>
          <span class="info">已完成</span>
        </div>
      </div>
      <div class="printer-item printer-item-2">
        <div class="printer-circle">
          <div class="printer-ring"></div>
          <span class="printer-percent">100%</span>
        </div>
        <div class="printer-detail printer-detail-2">
          <span class="name">2号</span>
          <span class="info">已完成</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 收起状态小绿条 -->
  <div class="collapsed-indicator" id="collapsedIndicator" title="点击展开"></div>

  <div class="hint">
    鼠标移到顶部展开 · 双击左侧切换时间/快捷方式 · 双击右侧切换单个/多个打印机<br>
    拖拽面板移动 · 拖出快捷方式删除 · 从文件管理器拖入添加
  </div>

  <div style="position:fixed;top:166px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:50;">
    <button id="toggleBtn" class="toggle-btn">展开</button>
    <button id="minimizeBtn" class="toggle-btn">最小化</button>
  </div>

  <script>
    // ============================================================
    // DOM References
    // ============================================================
    const panel = document.getElementById('panel');
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');
    const timeText = document.getElementById('timeText');
    const memLabel = document.getElementById('memLabel');
    const netUpEl = document.getElementById('netUp');
    const netDownEl = document.getElementById('netDown');
    const collapsedIndicator = document.getElementById('collapsedIndicator');
    const shortcutsGroup = document.getElementById('shortcutsGroup');

    let leftMode = 'time';
    let rightMode = 'single';
    let isMinimized = false;

    // ============================================================
    // 1. 实时系统监控数据（内存/网速）模拟
    // ============================================================
    // 浏览器环境无法直接获取真实系统数据，使用模拟数据
    // 如果在 Tauri 环境中，可通过 invoke 获取真实数据
    let prevNetUp = 0;
    let prevNetDown = 0;

    function formatSpeed(bytesPerSec) {
      if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B';
      if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' K';
      return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' M';
    }

    function updateSysInfo() {
      // 内存：优先用 performance.memory（Chrome），否则模拟
      let memPct;
      if (performance.memory) {
        memPct = Math.round(performance.memory.usedJSHeapSize / performance.memory.jsHeapSize * 100);
      } else {
        // 模拟：缓慢波动在 30-60% 之间
        const base = 42;
        memPct = base + Math.sin(Date.now() / 30000) * 8 + Math.random() * 3;
        memPct = Math.round(memPct);
      }
      memLabel.textContent = '内存 ' + memPct + '%';

      // 网速：模拟波动的网络流量
      const baseUp = 1200 + Math.sin(Date.now() / 8000) * 800;
      const baseDown = 8500 + Math.sin(Date.now() / 6000) * 5000;
      const up = Math.max(0, baseUp + (Math.random() - 0.5) * 600);
      const down = Math.max(0, baseDown + (Math.random() - 0.5) * 3000);
      netUpEl.textContent = formatSpeed(up);
      netDownEl.textContent = formatSpeed(down);
    }

    setInterval(updateSysInfo, 1500);
    updateSysInfo();

    // ============================================================
    // 2. 拖拽移动胶囊 + 弹性回弹
    // ============================================================
    let isDragging = false;
    let dragStarted = false;
    let dragStartX = 0, dragStartY = 0;
    let panelStartLeft = 0, panelStartTop = 0;
    const DRAG_THRESHOLD = 4;

    function getPanelCenter() {
      const r = panel.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function getRestTop() { return 16; }
    function getRestLeft() { return window.innerWidth / 2; }

    function snapToTop() {
      const restLeft = getRestLeft();
      const restTop = getRestTop();
      panel.classList.add('animating-back');
      panel.style.top = restTop + 'px';
      panel.style.left = restLeft + 'px';
      setTimeout(() => {
        panel.classList.remove('animating-back');
        panel.style.position = 'fixed';
      }, 360);
    }

    panel.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.left-panel') || e.target.closest('.right-panel')) {
        // 允许在面板上触发拖拽，但不阻止点击
      }
      isDragging = true;
      dragStarted = false;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
      const r = panel.getBoundingClientRect();
      panelStartLeft = r.left + r.width / 2;
      panelStartTop = r.top;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - dragStartX;
      const dy = e.screenY - dragStartY;

      if (!dragStarted) {
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        dragStarted = true;
        // 脱离 fixed 布局，改用绝对偏移
        panel.style.position = 'fixed';
        panel.style.left = panelStartLeft + 'px';
        panel.style.top = panelStartTop + 'px';
        panel.style.transform = 'none';
      }

      panel.style.left = (panelStartLeft + dx) + 'px';
      panel.style.top = (panelStartTop + dy) + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      if (dragStarted) {
        // 弹性回弹到顶部居中
        snapToTop();
        setTimeout(() => { dragStarted = false; }, 100);
      }
    });

    // ============================================================
    // 3. 最小化指示条（小绿条）
    // ============================================================
    function minimizePanel() {
      if (isMinimized) return;
      isMinimized = true;
      panel.classList.add('animating-back');
      panel.style.transition = 'transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.25s cubic-bezier(0.4,0,0.2,1)';
      panel.style.transform = 'translateX(-50%) scale(0)';
      panel.style.opacity = '0';
      panel.style.pointerEvents = 'none';
      setTimeout(() => {
        panel.style.display = 'none';
        panel.style.transform = '';
        panel.style.opacity = '';
        panel.style.transition = '';
        panel.classList.remove('animating-back');
        collapsedIndicator.style.display = 'block';
      }, 300);
    }

    function expandFromMinimized() {
      if (!isMinimized) return;
      isMinimized = false;
      collapsedIndicator.style.display = 'none';
      // 重置到顶部居中
      panel.style.position = 'fixed';
      panel.style.left = '50%';
      panel.style.top = '16px';
      panel.style.transform = 'translateX(-50%)';
      panel.style.display = '';
      panel.style.pointerEvents = '';
      panel.style.opacity = '0';
      panel.style.transition = 'transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.25s cubic-bezier(0.4,0,0.2,1)';
      requestAnimationFrame(() => {
        panel.style.opacity = '1';
        panel.style.transform = 'translateX(-50%) scale(1)';
      });
      setTimeout(() => {
        panel.style.transition = '';
      }, 320);
    }

    collapsedIndicator.addEventListener('click', (e) => {
      e.stopPropagation();
      expandFromMinimized();
    });

    // ============================================================
    // 4. 快捷方式拖拽添加/删除 + 本地存储
    // ============================================================
    const SHORTCUTS_KEY = 'floating_panel_shortcuts';
    const DEFAULT_SHORTCUTS = [
      { id: 's1', name: 'Ad...', nameFull: 'Administrator', type: 'folder', icon: '📁' },
      { id: 's2', name: '菲比', nameFull: '菲比', type: 'folder', icon: '📁' },
      { id: 's3', name: '基...', nameFull: '基洛拉', type: 'folder', icon: '📁' },
    ];

    function loadShortcuts() {
      try {
        const saved = localStorage.getItem(SHORTCUTS_KEY);
        return saved ? JSON.parse(saved) : [...DEFAULT_SHORTCUTS];
      } catch { return [...DEFAULT_SHORTCUTS]; }
    }

    function saveShortcuts(list) {
      localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(list));
    }

    function getShortcutIcon(type, name) {
      if (type === 'folder') return '📁';
      if (type === 'app') return '📱';
      if (type === 'file') {
        const ext = name.split('.').pop().toLowerCase();
        if (['png','jpg','jpeg','gif','bmp','webp','svg'].includes(ext)) return '🖼️';
        if (['stl','obj','3mf'].includes(ext)) return '🧊';
        if (['pdf'].includes(ext)) return '📕';
        if (['txt','md','log'].includes(ext)) return '📝';
        if (['zip','rar','7z'].includes(ext)) return '📦';
        if (['mp3','wav','flac'].includes(ext)) return '🎵';
        if (['mp4','avi','mkv'].includes(ext)) return '🎬';
        return '📄';
      }
      return '📄';
    }

    let shortcuts = loadShortcuts();

    function renderShortcuts() {
      shortcutsGroup.innerHTML = '';
      if (shortcuts.length === 0) {
        shortcutsGroup.innerHTML = '<div style="font-size:10px;color:#666;padding:4px;">拖入文件添加</div>';
        return;
      }
      shortcuts.forEach((item) => {
        const el = document.createElement('div');
        el.className = 'sc-item';
        el.dataset.id = item.id;

        const iconSpan = document.createElement('span');
        iconSpan.className = 'sc-icon';
        iconSpan.textContent = item.icon || getShortcutIcon(item.type, item.nameFull);

        const labelShort = document.createElement('span');
        labelShort.className = 'sc-label sc-label-short';
        labelShort.textContent = item.name;

        const labelFull = document.createElement('span');
        labelFull.className = 'sc-label sc-label-full';
        labelFull.textContent = item.nameFull;

        el.appendChild(iconSpan);
        el.appendChild(labelShort);
        el.appendChild(labelFull);

        // 拖出删除
        let scDragOut = null;
        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          scDragOut = { startX: e.clientX, startY: e.clientY, isDragging: false };
        });

        const onMove = (e) => {
          if (!scDragOut) return;
          if (!scDragOut.isDragging) {
            const dx = e.clientX - scDragOut.startX;
            const dy = e.clientY - scDragOut.startY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
              scDragOut.isDragging = true;
              el.classList.add('dragging');
            }
          }
        };

        const onUp = (e) => {
          if (!scDragOut) return;
          el.classList.remove('dragging');
          if (scDragOut.isDragging) {
            const r = panel.getBoundingClientRect();
            if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
              shortcuts = shortcuts.filter(s => s.id !== item.id);
              saveShortcuts(shortcuts);
              renderShortcuts();
            }
          }
          scDragOut = null;
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);

        shortcutsGroup.appendChild(el);
      });
    }

    renderShortcuts();

    // 从文件管理器拖入添加快捷方式
    panel.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      shortcutsGroup.classList.add('drag-over');
    });

    panel.addEventListener('dragleave', () => {
      shortcutsGroup.classList.remove('drag-over');
    });

    panel.addEventListener('drop', (e) => {
      e.preventDefault();
      shortcutsGroup.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (!files || files.length === 0) return;
      for (const file of files) {
        const newId = 'sc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const isDir = !file.type;
        const type = isDir ? 'folder' : 'file';
        const icon = getShortcutIcon(type, file.name);
        const nameShort = file.name.length > 4 ? file.name.substring(0, 4) + '..' : file.name;
        shortcuts.push({ id: newId, name: nameShort, nameFull: file.name, type, icon });
      }
      saveShortcuts(shortcuts);
      renderShortcuts();
    });

    // ============================================================
    // 面板悬停展开/收起
    // ============================================================
    panel.addEventListener('mouseenter', () => {
      if (dragStarted) return;
      leftPanel.classList.add('expanded');
      rightPanel.classList.add('expanded');
    });

    panel.addEventListener('mouseleave', () => {
      leftPanel.classList.remove('expanded');
      rightPanel.classList.remove('expanded');
    });

    // ============================================================
    // 双击左侧切换时间/快捷方式
    // ============================================================
    leftPanel.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      leftMode = leftMode === 'time' ? 'shortcuts' : 'time';
      leftPanel.classList.toggle('time-mode');
      leftPanel.classList.toggle('shortcuts-mode');
    });

    // ============================================================
    // 双击右侧切换单个/多个打印机
    // ============================================================
    rightPanel.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      rightMode = rightMode === 'single' ? 'multi' : 'single';
      rightPanel.classList.toggle('single-mode');
      rightPanel.classList.toggle('multi-mode');
      leftPanel.classList.toggle('multi-open');
    });

    // ============================================================
    // 时钟更新
    // ============================================================
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      timeText.textContent = `${h}:${m}:${s}`;
    }

    setInterval(updateTime, 1000);
    updateTime();

    // ============================================================
    // 展开/收起切换按钮
    // ============================================================
    const toggleBtn = document.getElementById('toggleBtn');
    let isExpanded = false;

    // 最小化按钮
    document.getElementById('minimizeBtn').addEventListener('click', () => {
      minimizePanel();
    });

    toggleBtn.addEventListener('click', () => {
      isExpanded = !isExpanded;
      if (isExpanded) {
        leftPanel.classList.add('expanded');
        rightPanel.classList.add('expanded');
        toggleBtn.textContent = '收起';
      } else {
        leftPanel.classList.remove('expanded');
        rightPanel.classList.remove('expanded');
        toggleBtn.textContent = '展开';
      }
    });
  </script>
