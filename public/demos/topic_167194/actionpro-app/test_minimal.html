<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Test</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .page-section { display: none; }
    .navbar { background: #1e293b; padding: 16px; }
  </style>
</head>
<body>
  <nav class="navbar"></nav>
  <main class="main-content">
    <section id="page-index" class="page-section"></section>
    <section id="page-library" class="page-section"></section>
  </main>
  <script>
const DATA = {
  tags: {
    primary: [{id: 'legs', name: '腿部', count: 12}],
    secondary: [{id: 'strength', name: '力量'}]
  }
};

const App = {
  data: null,
  _mainEl: null,

  init() {
    this.data = DATA;
    this.renderNavbar();
    this.initPage();
  },

  renderNavbar() {
    document.querySelector('.navbar').innerHTML = '<a href="#index">首页</a> <a href="#library">动作库</a>';
  },

  initPage() {
    const page = window.location.hash.slice(1) || 'index';
    document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');
    const section = document.getElementById('page-' + page);
    if (section) {
      section.style.display = 'block';
      this._mainEl = section;
    } else {
      this._mainEl = document.getElementById('page-index');
      if (this._mainEl) this._mainEl.style.display = 'block';
    }
    if (page === 'index') this.initIndex();
    if (page === 'library') this.initLibrary();
  },

  initIndex() {
    const main = this._mainEl;
    if (!main || !this.data) {
      main.innerHTML = '<p style="color:red;">ERROR: main=' + main + ' data=' + this.data + '</p>';
      return;
    }
    main.innerHTML = '<h1>Hello Index</h1><p>Tags: ' + this.data.tags.primary[0].name + '</p>';
  },

  initLibrary() {
    const main = this._mainEl;
    if (!main || !this.data) return;
    main.innerHTML = '<h1>Hello Library</h1>';
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}
  </script>
</body>
</html>
