  trips: [],
  orders: [],
  messages: []
};

const demoTrips = [
  { id: 't1', driverId: 'd1', driverName: '王师傅', driverPhone: '139****1234', from: '杭州东站', to: '义乌', date: '2026-07-03', time: '18:30', totalSeats: 4, reservedSeats: 0, confirmedSeats: 2, price: 60, note: '可带1件行李，不接送到门口', status: 'open' },

  { id: 't3', driverId: 'd3', driverName: '张师傅', driverPhone: '136****9012', from: '义乌', to: '杭州东站', date: '2026-07-03', time: '20:00', totalSeats: 4, reservedSeats: 0, confirmedSeats: 3, price: 55, note: '', status: 'open' },
];

const demoOrders = [
  { id: 'o1', tripId: 't1', passengerId: 'u1', passengerName: '我', count: 2, from: '杭州东站', to: '义乌', pickup: '东站P1停车场', dropoff: '义乌商贸城', status: 'confirmed', createdAt: '2026-07-02T10:00:00' },
];

const demoMessages = [
  { id: 'm1', orderId: 'o1', senderId: 'd1', senderName: '王师傅', content: '你好，明天18:30准时出发，请提前10分钟到上车点。', type: 'text', time: '2026-07-02T10:05:00' },
  { id: 'm2', orderId: 'o1', senderId: 'u1', senderName: '我', content: '好的，我们一共2个人，会提前到的。', type: 'text', time: '2026-07-02T10:06:00' },
];

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    data = JSON.parse(saved);
  } else {
    data.trips = JSON.parse(JSON.stringify(demoTrips));
    data.orders = JSON.parse(JSON.stringify(demoOrders));
    data.messages = JSON.parse(JSON.stringify(demoMessages));
    saveData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetData() {
  localStorage.removeItem(STORAGE_KEY);
  data.trips = JSON.parse(JSON.stringify(demoTrips));
  data.orders = JSON.parse(JSON.stringify(demoOrders));
  data.messages = JSON.parse(JSON.stringify(demoMessages));
  saveData();
  showToast('数据已重置');
  renderHome();
  renderOrders();
}

function getAvailableSeats(trip) {
  return trip.totalSeats - trip.reservedSeats - trip.confirmedSeats;
}

// ================== 页面导航 ==================
let pageStack = [];
let currentTab = 'home';
let currentRole = 'passenger';
let currentTripId = null;
let currentOrderId = null;

function showPage(pageId, pushStack = true) {
  if (pushStack && document.querySelector('.page.active')) {
    pageStack.push(document.querySelector('.page.active').id);
  }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function goBack() {
  const prev = pageStack.pop();
  if (prev) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(prev).classList.add('active');
  } else {
    showPage('page-home', false);
  }
}

function goHome() {
  pageStack = [];
  showPage('page-home', false);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  const tabs = ['home','orders','profile'];
  document.querySelectorAll('.tab-bar .tab')[tabs.indexOf(tab)].classList.add('active');
  pageStack = [];
  if (tab === 'home') { showPage('page-home', false); renderHome(); }
  else if (tab === 'orders') { showPage('page-orders', false); renderOrders(); }
  else if (tab === 'profile') { showPage('page-profile', false); }
}

function setRole(role) {
  currentRole = role;
  document.getElementById('role-passenger').classList.toggle('active', role === 'passenger');
  document.getElementById('role-driver').classList.toggle('active', role === 'driver');
  document.getElementById('publish-btn-row').style.display = role === 'driver' ? 'flex' : 'none';
  document.getElementById('search-bar').style.display = role === 'passenger' ? 'flex' : 'none';
  renderHome();
}

// ================== 首页渲染 ==================
function renderHome() {
  const list = document.getElementById('trip-list');
  const empty = document.getElementById('empty-trips');
  const fromFilter = document.getElementById('search-from').value.trim();
  const toFilter = document.getElementById('search-to').value.trim();

  let trips = data.trips.filter(t => t.status === 'open');
  if (currentRole === 'driver') {
    trips = trips.filter(t => t.driverId === data.currentUser.id);
  }
  if (fromFilter) trips = trips.filter(t => t.from.includes(fromFilter));
  if (toFilter) trips = trips.filter(t => t.to.includes(toFilter));

  if (trips.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = trips.map(t => {
    const avail = getAvailableSeats(t);
    const seatClass = avail <= 0 ? 'full' : '';
    const seatText = avail <= 0 ? '已满座' : `剩余 ${avail} 座`;
    return `
      <div class="trip-card" onclick="openTrip('${t.id}')">
        <div class="route">
          <span>${t.from}</span>
          <span class="arrow">&#10132;</span>
          <span>${t.to}</span>
        </div>
        <div class="meta">
          <span>${t.date} ${t.time}</span>
          <span class="seats ${seatClass}">${seatText}</span>
        </div>
        <div class="meta" style="margin-top:8px;">
          <span>司机：${t.driverName}</span>
          <span class="price">${t.price > 0 ? '¥'+t.price+'/人' : '面议'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function filterTrips() { renderHome(); }

// ================== 行程详情 ==================
function openTrip(tripId) {
  currentTripId = tripId;
  const t = data.trips.find(x => x.id === tripId);
  if (!t) return;
  const avail = getAvailableSeats(t);
  const el = document.getElementById('detail-content');

  let actions = '';
  if (currentRole === 'passenger') {
    if (avail > 0) {
      actions = `<div class="btn-row"><button class="btn btn-primary" onclick="openBook('${t.id}')">立即预约</button></div>`;
    } else {
      actions = `<div class="btn-row"><button class="btn btn-primary" disabled>已满座</button></div>`;
    }
  } else {
    actions = `<div class="btn-row"><button class="btn btn-danger" onclick="cancelTrip('${t.id}')">取消行程</button></div>`;
  }

  el.innerHTML = `
    <div class="form-group">
      <div class="info-row"><span class="label">路线</span><span class="value">${t.from} &#10132; ${t.to}</span></div>
      <div class="info-row"><span class="label">出发时间</span><span class="value">${t.date} ${t.time}</span></div>
      <div class="info-row"><span class="label">总座位</span><span class="value">${t.totalSeats} 座</span></div>
      <div class="info-row"><span class="label">已占座位</span><span class="value">${t.confirmedSeats} 座</span></div>
      <div class="info-row"><span class="label">剩余座位</span><span class="value highlight">${avail} 座</span></div>
      <div class="info-row"><span class="label">价格</span><span class="value">${t.price > 0 ? '¥'+t.price+'/人' : '面议'}</span></div>
      <div class="info-row"><span class="label">备注</span><span class="value">${t.note || '无'}</span></div>
    </div>
    <div class="form-group">
      <div class="list-item" style="padding-left:0;">
        <div class="avatar">${t.driverName[0]}</div>
        <div class="content">
          <div class="title">${t.driverName}</div>
          <div class="sub">${t.driverPhone}</div>
        </div>
      </div>
    </div>
    ${actions}
  `;
  showPage('page-detail');
}

function cancelTrip(tripId) {
  if (!confirm('确定取消该行程？所有关联订单将被取消。')) return;
  const t = data.trips.find(x => x.id === tripId);
  if (t) t.status = 'cancelled';
  data.orders.filter(o => o.tripId === tripId).forEach(o => o.status = 'cancelled');
  saveData();
  showToast('行程已取消');
  goBack();
  renderHome();
  renderOrders();
}

// ================== 下单页 ==================
function openBook(tripId) {
  currentTripId = tripId;
  const t = data.trips.find(x => x.id === tripId);
  if (!t) return;
  const avail = getAvailableSeats(t);
  const el = document.getElementById('book-content');
  el.innerHTML = `
    <div class="form-group" style="text-align:center;">
      <div style="font-size:15px; color:var(--muted); margin-bottom:8px;">本次乘车人数</div>
      <div class="counter">
        <button onclick="changeCount(-1)" id="btn-minus">&#8722;</button>
        <span class="num" id="book-count">1</span>
        <button onclick="changeCount(1)" id="btn-plus">+</button>
      </div>
      <div style="font-size:13px; color:var(--muted);">
        当前车辆剩余 <strong style="color:var(--accent);" id="book-avail">${avail}</strong> 座
      </div>
      <div style="font-size:13px; color:var(--accent2); margin-top:8px; display:none;" id="book-warn">人数超过剩余座位</div>
    </div>
    <div class="form-group">
      <label>上车点</label>
      <input type="text" id="book-pickup" placeholder="例如：${t.from}南广场">
    </div>
    <div class="form-group">
      <label>下车点</label>
      <input type="text" id="book-dropoff" placeholder="例如：${t.to}市中心">
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="book-note" placeholder="例如：有行李箱"></textarea>
    </div>
    <div class="form-group">
      <div class="info-row"><span class="label">占用座位</span><span class="value" id="book-seats">1 座</span></div>
      <div class="info-row"><span class="label">预计费用</span><span class="value" id="book-price">${t.price > 0 ? '¥'+t.price : '面议'}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitBook()" id="btn-submit">确认预约</button>
    </div>
  `;
  showPage('page-book');
}

let bookCount = 1;
function changeCount(delta) {
  const t = data.trips.find(x => x.id === currentTripId);
  const avail = getAvailableSeats(t);
  bookCount = Math.max(1, Math.min(avail, bookCount + delta));
  document.getElementById('book-count').textContent = bookCount;
  document.getElementById('book-seats').textContent = bookCount + ' 座';
  if (t.price > 0) {
    document.getElementById('book-price').textContent = '¥' + (t.price * bookCount);
  }
  document.getElementById('btn-minus').disabled = bookCount <= 1;
  document.getElementById('btn-plus').disabled = bookCount >= avail;
  const warn = document.getElementById('book-warn');
  if (bookCount > avail) {
    warn.style.display = 'block';
    document.getElementById('btn-submit').disabled = true;
  } else {
    warn.style.display = 'none';
    document.getElementById('btn-submit').disabled = false;
  }
}

function submitBook() {
  const t = data.trips.find(x => x.id === currentTripId);
  const avail = getAvailableSeats(t);
  if (bookCount > avail) { showToast('剩余座位不足'); return; }

  const order = {
    id: 'o' + Date.now(),
    tripId: t.id,
    passengerId: data.currentUser.id,
    passengerName: data.currentUser.name,
    count: bookCount,
    from: t.from,
    to: t.to,
    pickup: document.getElementById('book-pickup').value || t.from,
    dropoff: document.getElementById('book-dropoff').value || t.to,
    status: 'confirmed',
    createdAt: new Date().toISOString()
  };
  data.orders.push(order);
  t.confirmedSeats += bookCount;

  // 系统消息
  data.messages.push({
    id: 'm' + Date.now(),
    orderId: order.id,
    senderId: 'system',
    senderName: '系统',
    content: `订单已确认，已为您预留 ${bookCount} 个座位。`,
    type: 'system',
    time: new Date().toISOString()
  });

  saveData();
  showToast('预约成功');
  goHome();
  renderHome();
  renderOrders();
}

// ================== 发布行程 ==================
function publishTrip() {
  const from = document.getElementById('pub-from').value.trim();
  const to = document.getElementById('pub-to').value.trim();
  const date = document.getElementById('pub-date').value;
  const time = document.getElementById('pub-time').value;
  const seats = parseInt(document.getElementById('pub-seats').value) || 4;
  const price = parseInt(document.getElementById('pub-price').value) || 0;
  const note = document.getElementById('pub-note').value.trim();

  if (!from || !to || !date || !time) { showToast('请填写完整信息'); return; }

  const trip = {
    id: 't' + Date.now(),
    driverId: data.currentUser.id,
    driverName: data.currentUser.name,
    driverPhone: data.currentUser.phone,
    from, to, date, time,
    totalSeats: seats,
    reservedSeats: 0,
    confirmedSeats: 0,
    price, note,
    status: 'open'
  };
  data.trips.push(trip);
  saveData();
  showToast('行程发布成功');
  goBack();
  renderHome();
}

// ================== 订单页 ==================
function renderOrders() {
  const el = document.getElementById('orders-content');
  let orders = data.orders;
  if (currentRole === 'passenger') {
    orders = orders.filter(o => o.passengerId === data.currentUser.id);
  } else {
    const myTripIds = data.trips.filter(t => t.driverId === data.currentUser.id).map(t => t.id);
    orders = orders.filter(o => myTripIds.includes(o.tripId));
  }

  if (orders.length === 0) {
    el.innerHTML = '<div class="empty"><div class="icon">&#128220;</div><div>暂无订单</div></div>';
    return;
  }

  el.innerHTML = orders.map(o => {
    const t = data.trips.find(x => x.id === o.tripId);
    const statusMap = {
      pending: '<span class="status-pending">待确认</span>',
      confirmed: '<span class="status-confirmed">已确认</span>',
      cancelled: '<span class="status-cancelled">已取消</span>',
      completed: '<span class="status-completed">已完成</span>'
    };
    return `
      <div class="order-card" onclick="openOrder('${o.id}')">
        <div class="head">
          <div>${o.from} &#10132; ${o.to}</div>
          <div>${statusMap[o.status] || o.status}</div>
        </div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">
          ${t ? t.date + ' ' + t.time : ''} · ${o.count}人同行
        </div>
        <div style="font-size:13px; color:var(--muted);">
          ${currentRole === 'passenger' ? '司机：' + (t ? t.driverName : '') : '乘客：' + o.passengerName}
        </div>
      </div>
    `;
  }).join('');
}

function openOrder(orderId) {
  currentOrderId = orderId;
  const o = data.orders.find(x => x.id === orderId);
  const t = data.trips.find(x => x.id === o.tripId);
  const el = document.getElementById('order-detail-content');

  const statusMap = { pending: '待确认', confirmed: '已确认', cancelled: '已取消', completed: '已完成' };
  const canChat = o.status === 'confirmed';
  const canCancel = o.status === 'confirmed' || o.status === 'pending';

  let actions = '';
  if (canChat) {
    actions += `<button class="btn btn-secondary" onclick="openChat('${o.id}')">&#128172; 聊天</button>`;
    actions += `<button class="btn btn-secondary" onclick="openMap('${o.id}')">&#128205; 位置</button>`;
  }
  if (canCancel) {
    actions += `<button class="btn btn-danger" onclick="cancelOrder('${o.id}')">取消订单</button>`;
  }
  if (currentRole === 'driver' && o.status === 'confirmed') {
    actions += `<button class="btn btn-primary" onclick="completeOrder('${o.id}')">完成行程</button>`;
  }

  el.innerHTML = `
    <div class="form-group">
      <div class="info-row"><span class="label">订单状态</span><span class="value highlight">${statusMap[o.status]}</span></div>
      <div class="info-row"><span class="label">路线</span><span class="value">${o.from} &#10132; ${o.to}</span></div>
      <div class="info-row"><span class="label">出发时间</span><span class="value">${t ? t.date + ' ' + t.time : ''}</span></div>
      <div class="info-row"><span class="label">乘车人数</span><span class="value">${o.count} 人</span></div>
      <div class="info-row"><span class="label">上车点</span><span class="value">${o.pickup}</span></div>
      <div class="info-row"><span class="label">下车点</span><span class="value">${o.dropoff}</span></div>
      <div class="info-row"><span class="label">备注</span><span class="value">${o.note || '无'}</span></div>
    </div>
    <div class="form-group">
      <div class="list-item" style="padding-left:0;">
        <div class="avatar">${currentRole === 'passenger' ? (t ? t.driverName[0] : '司') : o.passengerName[0]}</div>
        <div class="content">
          <div class="title">${currentRole === 'passenger' ? (t ? t.driverName : '司机') : o.passengerName}</div>
          <div class="sub">${currentRole === 'passenger' ? (t ? t.driverPhone : '') : data.currentUser.phone}</div>
        </div>
      </div>
    </div>
    <div class="btn-row" style="flex-wrap:wrap;">${actions}</div>
  `;
  showPage('page-order-detail');
}

function cancelOrder(orderId) {
  if (!confirm('确定取消该订单？')) return;
  const o = data.orders.find(x => x.id === orderId);
  const t = data.trips.find(x => x.id === o.tripId);
  if (o) o.status = 'cancelled';
  if (t) t.confirmedSeats = Math.max(0, t.confirmedSeats - o.count);
  saveData();
  showToast('订单已取消');
  goBack();
  renderHome();
  renderOrders();
}

function completeOrder(orderId) {
  const o = data.orders.find(x => x.id === orderId);
  if (o) o.status = 'completed';
  saveData();
  showToast('行程已完成');
  goBack();
  renderOrders();
}

// ================== 聊天 ==================
function openChat(orderId) {
  currentOrderId = orderId;
  const o = data.orders.find(x => x.id === orderId);
  const partner = currentRole === 'passenger'
    ? (data.trips.find(x => x.id === o.tripId)?.driverName || '司机')
    : o.passengerName;
  document.getElementById('chat-title').textContent = partner;
  renderChat();
  showPage('page-chat');
}

function renderChat() {
  const list = document.getElementById('chat-list');
  const msgs = data.messages.filter(m => m.orderId === currentOrderId).sort((a,b) => new Date(a.time) - new Date(b.time));
  list.innerHTML = msgs.map(m => {
    if (m.type === 'system') {
      return `<div class="system-msg">${m.content}</div>`;
    }
    const isMe = m.senderId === data.currentUser.id;
    const timeStr = new Date(m.time).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    return `<div class="chat-bubble ${isMe ? 'me' : 'them'}">
      <div>${m.content}</div>
      <div class="time">${timeStr}</div>
    </div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chat-msg');
  const text = input.value.trim();
  if (!text) return;
  data.messages.push({
    id: 'm' + Date.now(),
    orderId: currentOrderId,
    senderId: data.currentUser.id,
    senderName: data.currentUser.name,
    content: text,
    type: 'text',
    time: new Date().toISOString()
  });
  saveData();
  input.value = '';
  renderChat();
}

// ================== 位置共享 ==================
function openMap(orderId) {
  currentOrderId = orderId;
  const el = document.getElementById('map-content');
  el.innerHTML = `
    <div class="map-area">
      <div class="map-road" style="top:40%;left:10%;width:80%;height:6px;"></div>
      <div class="map-road" style="top:20%;left:30%;width:6px;height:60%;"></div>
      <div class="map-pin start" style="top:36%;left:28%;">&#9679;</div>
      <div class="map-pin driver" style="top:38%;left:55%;">&#128663;</div>
      <div class="map-pin passenger" style="top:18%;left:32%;">&#128100;</div>
    </div>
    <div class="form-group" style="margin-top:12px;">
      <div class="info-row"><span class="label">司机位置</span><span class="value">距离上车点约 1.8 公里</span></div>
      <div class="info-row"><span class="label">预计到达</span><span class="value">约 6 分钟</span></div>
      <div class="info-row"><span class="label">乘客位置</span><span class="value">距离上车点约 300 米</span></div>
    </div>
    <div class="section-desc" style="text-align:center; padding:20px; color:var(--muted);">
      位置共享仅在订单确认后可用<br>行程完成后自动关闭
    </div>
  `;
  showPage('page-map');
}

// ================== 工具函数 ==================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// ================== 初始化 ==================
loadData();
renderHome();

// 设置默认日期为今天
const today = new Date().toISOString().split('T')[0];
const timeNow = new Date().toTimeString().slice(0,5);
document.getElementById('pub-date').value = today;
document.getElementById('pub-time').value = timeNow;
</script>
