<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛马决策器</title>
<style>
:root { --purple:#501E78; --yellow:#FFDC1E; }

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:linear-gradient(to bottom, var(--purple) 50%, var(--yellow) 50%); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
  overflow:hidden; color:#fff; height:100vh; width:100vw;
}

/* ====== 主容器 ====== */
.app { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; }

/* ====== 页面 ====== */
.page-wrap { position:relative; width:100%; max-width:720px; height:100%; }
.page { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:transform 0.4s ease, opacity 0.35s ease; }
.page.prev { transform:translateX(-40px); opacity:0; pointer-events:none; }
.page.next { transform:translateX(40px); opacity:0; pointer-events:none; }

/* ====== 标题 ====== */
.top-title { font-size:48px; font-weight:800; color:var(--yellow); letter-spacing:2px; text-align:center; }
.top-sub { font-size:14px; font-weight:400; color:var(--yellow); letter-spacing:4px; text-align:center; }

/* ====== 卡片 ====== */
.card { width:100%; display:flex; border-radius:28px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,0.04), 0 24px 80px rgba(0,0,0,0.6); }
.card-h { aspect-ratio:2/1; }
.card-v { flex-direction:column; aspect-ratio:1/1.5; position:relative; }

.card-half { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; cursor:pointer; transition:transform 0.2s, opacity 0.2s; }
.card-half:active { transform:scale(0.95); opacity:0.85; }
.card-half.noclick { cursor:default; pointer-events:none; }

.card-A { background:var(--purple); color:var(--yellow); }
.card-B { background:var(--yellow); color:var(--purple); }

/* 大字 */
.big-letter { font-size:110px; font-weight:800; line-height:0.9; user-select:none; }
.opt-label { font-size:84px; font-weight:700; line-height:0.9; margin-bottom:8px; }
.opt-value { font-size:22px; font-weight:600; max-width:80%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 选中脉冲 */
.card-half.pulse { animation:pulsePick 0.4s ease; }
@keyframes pulsePick { 0%{transform:scale(1)} 35%{transform:scale(0.9)} 65%{transform:scale(1.03)} 100%{transform:scale(1)} }

/* ====== 输入框 ====== */
.input-wrap { width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:16px; }
.input-opt { width:75%; border:none; border-bottom:2px solid; padding:10px 4px; font-size:19px; font-weight:600; text-align:center; background:transparent; outline:none; font-family:inherit; }
.input-A { color:var(--yellow); border-color:rgba(255,220,30,0.3); }
.input-A:focus { border-color:var(--yellow); }
.input-A::placeholder { color:rgba(255,220,30,0.25); }
.input-B { color:var(--purple); border-color:rgba(80,30,120,0.3); }
.input-B:focus { border-color:var(--purple); }
.input-B::placeholder { color:rgba(80,30,120,0.25); }

/* ====== 问题区 ====== */
.q-header { text-align:center; width:100%; }
.q-tag { font-size:12px; font-weight:600; color:var(--yellow); letter-spacing:4px; margin-bottom:10px; }
.q-text { font-size:20px; font-weight:500; color:var(--yellow); line-height:1.5; opacity:0.85; }
.q-hint { font-size:15px; color:var(--purple); text-align:center; opacity:0.7; font-style:italic; }

/* ====== 滑动区 ====== */
.slide-zone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.3s; }
.slide-zone-top { background:var(--yellow); color:var(--purple); }
.slide-zone-bottom { background:var(--purple); color:var(--yellow); }
.slide-zone.dim { opacity:0.25; }
.slide-zone.hi { opacity:1; }
.slide-zone.hi .slide-zone-label { transform:scale(1.08); }
.slide-zone-label { font-size:28px; font-weight:700; transition:transform 0.3s; }

.slide-area { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.slide-track { position:absolute; left:50%; top:12%; bottom:12%; width:2px; background:rgba(255,255,255,0.15); transform:translateX(-50%); border-radius:1px; }
.slide-fill { position:absolute; left:50%; width:2px; background:var(--purple); transform:translateX(-50%); transition:height 0.04s linear,top 0.04s linear; }

.slide-handle { width:56px; height:56px; background:var(--yellow); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:grab; box-shadow:0 0 30px rgba(255,220,30,0.4), 0 6px 20px rgba(0,0,0,0.5); z-index:10; position:relative; transition:box-shadow 0.3s; pointer-events:auto; }
.slide-handle:active { cursor:grabbing; box-shadow:0 0 50px rgba(255,220,30,0.6), 0 6px 20px rgba(0,0,0,0.5); }
.slide-arrow { width:24px; height:3px; background:var(--purple); border-radius:2px; position:relative; }
.slide-arrow::before,.slide-arrow::after { content:''; position:absolute; width:24px; height:3px; background:var(--purple); border-radius:2px; left:0; }
.slide-arrow::before { top:-8px; }
.slide-arrow::after { top:8px; }

/* 反悔 */
.regret-bar { position:absolute; bottom:16px; left:24px; right:24px; height:2px; background:rgba(255,255,255,0.1); border-radius:1px; z-index:20; display:none; overflow:hidden; }
.regret-bar.on { display:block; }
.regret-bar-inner { height:100%; width:100%; background:var(--yellow); }
.regret-bar-inner.regret-drain { animation:regretDrain 0.8s linear forwards; }
@keyframes regretDrain { from{width:100%} to{width:0%} }
.regret-hint { text-align:center; font-size:12px; color:var(--purple); display:none; opacity:0.7; }
.regret-hint.on { display:block; }

/* ====== 报告 ====== */
.report-card { width:100%; background:var(--yellow); border-radius:28px; padding:36px 40px; display:flex; flex-direction:column; align-items:center; box-shadow:0 24px 80px rgba(0,0,0,0.6); }
.report-badge { font-size:12px; font-weight:700; color:var(--purple); letter-spacing:5px; margin-bottom:14px; opacity:0.5; }
.report-pick { font-size:56px; font-weight:800; color:var(--purple); letter-spacing:1px; text-align:center; word-break:break-word; line-height:1.1; margin-bottom:4px; }
.report-vs { font-size:16px; color:var(--purple); margin-bottom:24px; opacity:0.5; }
.report-sep { width:50px; height:2px; background:var(--purple); opacity:0.2; border-radius:1px; margin-bottom:24px; }

.report-rows { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:0; }
.report-row { display:flex; flex-direction:column; align-items:center; padding:14px 12px; text-align:center; }
.report-row-label { font-size:13px; color:var(--purple); opacity:0.5; margin-bottom:4px; }
.report-row-val { font-size:15px; font-weight:600; color:var(--purple); }
.report-conf-text { font-size:18px; color:var(--purple); line-height:1.6; font-weight:600; text-align:center; margin-top:24px; }

/* 报告逐行动画 */
.report-stagger { opacity:0; transform:translateY(12px); }
.report-stagger.in { animation:staggerIn 0.5s ease forwards; }
.report-stagger:nth-child(1).in { animation-delay:0.06s; }
.report-stagger:nth-child(2).in { animation-delay:0.12s; }
.report-stagger:nth-child(3).in { animation-delay:0.18s; }
.report-stagger:nth-child(4).in { animation-delay:0.24s; }
.report-stagger:nth-child(5).in { animation-delay:0.30s; }
.report-stagger:nth-child(6).in { animation-delay:0.36s; }
.report-stagger:nth-child(7).in { animation-delay:0.42s; }
@keyframes staggerIn { to { opacity:1; transform:translateY(0); } }

/* ====== 按钮 ====== */
.btn-main { padding:16px 56px; border:none; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; transition:transform 0.15s, opacity 0.2s; font-family:inherit; }
.btn-purple { background:var(--purple); color:var(--yellow); box-shadow:0 8px 30px rgba(0,0,0,0.5); }
.btn-purple:active { transform:scale(0.95); }
.btn-main:disabled { opacity:0.15; pointer-events:none; }

/* ====== 进度 ====== */
.progress { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; gap:10px; }
.progress-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.08); transition:all 0.4s; }
.progress-dot.done { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
.progress-dot.cur { background:var(--purple); box-shadow:0 0 8px var(--purple); }
</style>
</head>
<body>

<div class="progress" id="progress">
  <div class="progress-dot" id="prog-dot-0"></div>
  <div class="progress-dot" id="prog-dot-1"></div>
  <div class="progress-dot" id="prog-dot-2"></div>
</div>

<div class="app">
<div class="page-wrap">

  <!-- ====== 输入 ====== -->
  <div class="page" id="p-input">
    <div class="top-title">牛马决策器</div>
    <div class="top-sub">思维对撞，直觉破局</div>

    <div class="card card-h">
      <div class="card-half card-A">
        <div class="input-wrap">
          <span class="big-letter">A</span>
          <input type="text" class="input-opt input-A" id="in-a" placeholder="输入选项 A" autocomplete="off" maxlength="16">
        </div>
      </div>
      <div class="card-half card-B">
        <div class="input-wrap">
          <span class="big-letter">B</span>
          <input type="text" class="input-opt input-B" id="in-b" placeholder="输入选项 B" autocomplete="off" maxlength="16">
        </div>
      </div>
    </div>

    <button class="btn-main btn-purple" id="btn-go" disabled>开始拷问潜意识</button>
  </div>

  <!-- ====== 两问 ====== -->
  <div class="page" id="p-q" style="transform:translateX(40px); opacity:0; pointer-events:none;">
    <div class="q-header">
      <div class="q-tag" id="q-tag"></div>
      <div class="q-text" id="q-text"></div>
    </div>

    <div class="card card-h" id="q-card">
      <div class="card-half card-A" id="q-left">
        <div class="opt-label" id="q-left-label">A</div>
        <div class="opt-value" id="q-left-val"></div>
      </div>
      <div class="card-half card-B" id="q-right">
        <div class="opt-label" id="q-right-label">B</div>
        <div class="opt-value" id="q-right-val"></div>
      </div>
    </div>

    <div class="q-hint" id="q-hint"></div>
  </div>

  <!-- ====== 滑动 ====== -->
  <div class="page" id="p-slide" style="transform:translateX(40px); opacity:0; pointer-events:none;">
    <div class="q-header">
      <div class="q-tag" id="slide-tag"></div>
      <div class="q-text" id="slide-text"></div>
      <div class="q-hint" id="slide-hint"></div>
    </div>

    <div class="card card-v">
      <div class="slide-zone slide-zone-top" id="slide-top">
        <div class="slide-zone-label" id="slide-top-label"></div>
      </div>
      <div class="slide-area">
        <div class="slide-track"><div class="slide-fill" id="slide-fill"></div></div>
        <div class="slide-handle" id="slide-handle"><div class="slide-arrow"></div></div>
      </div>
      <div class="slide-zone slide-zone-bottom" id="slide-bot">
        <div class="slide-zone-label" id="slide-bot-label"></div>
      </div>
    </div>

    <div class="regret-bar" id="regret-bar"><div class="regret-bar-inner" id="regret-inner"></div></div>
    <div class="regret-hint" id="regret-hint">继续滑动可反悔</div>
  </div>

  <!-- ====== 报告 ====== -->
  <div class="page" id="p-report" style="transform:translateX(40px); opacity:0; pointer-events:none;">
    <div class="top-title" style="font-size:42px;">直觉已破局</div>

    <div class="report-card" id="report-card">
      <div class="report-badge report-stagger">分 析 报 告</div>
      <div class="report-pick report-stagger" id="rp-pick"></div>
      <div class="report-vs report-stagger" id="rp-vs"></div>
      <div class="report-sep report-stagger"></div>

      <div class="report-rows report-stagger">
        <div class="report-row">
          <span class="report-row-label">轨迹首方向</span>
          <span class="report-row-val" id="rp-dir"></span>
        </div>
        <div class="report-row">
          <span class="report-row-label">折返犹豫</span>
          <span class="report-row-val" id="rp-rev"></span>
        </div>
        <div class="report-row">
          <span class="report-row-label">滑动用时</span>
          <span class="report-row-val" id="rp-time"></span>
        </div>
        <div class="report-row">
          <span class="report-row-label">投票分布</span>
          <span class="report-row-val" id="rp-cons"></span>
        </div>
      </div>

      <div class="report-conf-text report-stagger" id="rp-conf"></div>
    </div>

    <button class="btn-main btn-purple" id="btn-home">重新测试</button>
  </div>

</div>
</div>

<script>
(function(){
  let optA='', optB='';
  let qAnswers=[null,null,null];
  let qIdx=0;
  let slideTraj=[], slideSide=null, slideDecided=false, slideStart=0;
  let regretTimer=null, regretOn=false;
  let positionSwap=false;

  const QS = [
    { tag:'直觉触发 1/3', text:'视线扫过，你的目光最先被哪个选项吸引？', hint:'不是思考，是瞬间的视觉落点' },
    { tag:'直觉触发 2/3', text:'如果必须永远放弃其中一个，放弃哪个会让你更遗憾？', hint:'人在乎失去远大于获得——损失厌恶' }
  ];

  let curPage='p-input';
  const dots = [document.getElementById('prog-dot-0'),document.getElementById('prog-dot-1'),document.getElementById('prog-dot-2')];

  function show(id, dir) {
    const oldEl=document.getElementById(curPage);
    const newEl=document.getElementById(id);
    if(oldEl===newEl) return;
    oldEl.classList.remove('prev','next');
    if(dir==='fwd') oldEl.classList.add('prev');
    else if(dir==='back') oldEl.classList.add('next');
    else { oldEl.style.transform=''; oldEl.style.opacity=''; oldEl.style.pointerEvents=''; }
    newEl.classList.remove('prev','next');
    newEl.style.transform=''; newEl.style.opacity=''; newEl.style.pointerEvents='';
    curPage=id;
  }

  function updateProgress(step) {
    dots.forEach((d,i)=>{
      d.classList.remove('done','cur');
      if(i<step) d.classList.add('done');
      else if(i===step) d.classList.add('cur');
    });
  }

  const inA=document.getElementById('in-a'), inB=document.getElementById('in-b');
  const btnGo=document.getElementById('btn-go');

  function chkReady() {
    btnGo.disabled = !(inA.value.trim().length>0 && inB.value.trim().length>0);
  }
  ['input','change','blur','keyup'].forEach(e=>{
    inA.addEventListener(e,chkReady); inB.addEventListener(e,chkReady);
  });

  try {
    const d=JSON.parse(localStorage.getItem('nd_draft'));
    if(d) { inA.value=d.a||''; inB.value=d.b||''; chkReady(); }
  } catch(e){}

  btnGo.addEventListener('click',()=>{
    optA=inA.value.trim(); optB=inB.value.trim();
    if(!optA||!optB) return;
    localStorage.setItem('nd_draft',JSON.stringify({a:optA,b:optB}));
    qAnswers=[null,null,null]; qIdx=0;
    updateProgress(0);
    startQuiz();
  });

  function startQuiz() {
    positionSwap = qIdx % 2 === 1;
    showQ();
    show('p-q','fwd');
  }

  function showQ() {
    if(qIdx>=2) { startSlide(); return; }
    const q=QS[qIdx];
    document.getElementById('q-tag').textContent=q.tag;
    document.getElementById('q-text').textContent=q.text;
    document.getElementById('q-hint').textContent=q.hint;
    updateProgress(qIdx);

    // AB 标签始终固定，只交换答案文字位置
    document.getElementById('q-left-label').textContent='A';
    document.getElementById('q-right-label').textContent='B';
    if(positionSwap) {
      document.getElementById('q-left-val').textContent=optB;
      document.getElementById('q-right-val').textContent=optA;
    } else {
      document.getElementById('q-left-val').textContent=optA;
      document.getElementById('q-right-val').textContent=optB;
    }
  }

  function pickAnswer(choice) {
    qAnswers[qIdx] = choice;
    const el = choice==='A' ? document.getElementById('q-left') : document.getElementById('q-right');
    el.classList.add('pulse');
    setTimeout(()=>el.classList.remove('pulse'),400);
    qIdx++; positionSwap = !positionSwap;
    setTimeout(()=>showQ(),220);
  }

  document.getElementById('q-left').addEventListener('click',()=>{
    if(positionSwap) pickAnswer('B'); else pickAnswer('A');
  });
  document.getElementById('q-right').addEventListener('click',()=>{
    if(positionSwap) pickAnswer('A'); else pickAnswer('B');
  });

  // ====== 滑动 ======
  function startSlide() {
    slideTraj=[]; slideSide=null; slideDecided=false; regretOn=false;
    updateProgress(2);
    document.getElementById('slide-tag').textContent = '直觉触发 3/3';
    document.getElementById('slide-text').textContent = '脑中抛一枚硬币，半空翻转时，你内心最期盼哪一面落地？';
    document.getElementById('slide-hint').textContent = '点击上半区选 A，点击下半区选 B，或拖拽滑块';
    document.getElementById('slide-top-label').textContent = 'A: ' + optA;
    document.getElementById('slide-bot-label').textContent = 'B: ' + optB;
    document.getElementById('slide-handle').style.transform='translateY(0)';
    document.getElementById('slide-fill').style.cssText='';
    ['slide-top','slide-bot'].forEach(id=>document.getElementById(id).classList.remove('dim','hi'));
    document.getElementById('regret-bar').classList.remove('on');
    document.getElementById('regret-inner').classList.remove('regret-drain');
    document.getElementById('regret-hint').classList.remove('on');
    show('p-slide','fwd');
  }

  const sh=document.getElementById('slide-handle');
  const sf=document.getElementById('slide-fill');
  const st=document.getElementById('slide-top');
  const sb=document.getElementById('slide-bot');
  const rb=document.getElementById('regret-bar');
  const ri=document.getElementById('regret-inner');
  const rh=document.getElementById('regret-hint');

  let dragY=0, dragOn=false, dragStart=0, dragStartY=0;

  function maxDrag() { return window.innerHeight*0.18; }

  function updateSlide(dy) {
    const m=maxDrag();
    dy=Math.max(-m,Math.min(m,dy));
    dragY=dy;
    sh.style.transform=`translateY(${dy}px)`;
    const p=dy/m;
    if(p<0) { sf.style.top='50%'; sf.style.height=Math.abs(p)*50+'%'; }
    else { sf.style.top='50%'; sf.style.height=Math.abs(p)*50+'%'; }
    if(p<-0.15) { st.classList.add('hi');st.classList.remove('dim');sb.classList.add('dim');sb.classList.remove('hi'); }
    else if(p>0.15) { sb.classList.add('hi');sb.classList.remove('dim');st.classList.add('dim');st.classList.remove('hi'); }
    else { st.classList.remove('dim','hi');sb.classList.remove('dim','hi'); }
    if(!slideDecided) { slideTraj.push({t:performance.now()-slideStart,progress:p}); }
  }

  function getY(e) {
    if(e.touches&&e.touches.length) return e.touches[0].clientY;
    if(e.changedTouches&&e.changedTouches.length) return e.changedTouches[0].clientY;
    return e.clientY;
  }

  st.addEventListener('click',()=>{ if(!slideDecided&&!dragOn){ if(regretOn) cancelRegret(); slideStart=performance.now(); commitSlide('top'); } });
  sb.addEventListener('click',()=>{ if(!slideDecided&&!dragOn){ if(regretOn) cancelRegret(); slideStart=performance.now(); commitSlide('bottom'); } });

  sh.addEventListener('touchstart',e=>{ if(slideDecided) return; dragOn=true; dragStart=getY(e); dragStartY=dragY; slideStart=performance.now(); if(regretOn) cancelRegret(); e.preventDefault(); },{passive:false});
  sh.addEventListener('touchmove',e=>{ if(!dragOn||slideDecided) return; updateSlide(dragStartY+(getY(e)-dragStart)); e.preventDefault(); },{passive:false});
  sh.addEventListener('touchend',()=>{ if(!dragOn||slideDecided) return; dragOn=false; const p=dragY/maxDrag(); if(p<=-0.7) commitSlide('top'); else if(p>=0.7) commitSlide('bottom'); else springBack(); });
  sh.addEventListener('mousedown',e=>{ if(slideDecided) return; dragOn=true; dragStart=e.clientY; dragStartY=dragY; slideStart=performance.now(); if(regretOn) cancelRegret(); });
  window.addEventListener('mousemove',e=>{ if(!dragOn||slideDecided) return; updateSlide(dragStartY+(e.clientY-dragStart)); });
  window.addEventListener('mouseup',()=>{ if(!dragOn||slideDecided) return; dragOn=false; const p=dragY/maxDrag(); if(p<=-0.7) commitSlide('top'); else if(p>=0.7) commitSlide('bottom'); else springBack(); });

  function springBack() {
    const s=dragY, d=300, t0=performance.now();
    function anim(now) { const t=Math.min((now-t0)/d,1); const y=s*(1-Math.pow(1-t,3)); sh.style.transform=`translateY(${y}px)`; if(t<1) requestAnimationFrame(anim); else { dragY=0; updateSlide(0); } }
    requestAnimationFrame(anim);
  }

  function commitSlide(side) {
    if(slideSide) return; slideSide=side;
    const m=maxDrag(), ty=side==='top'?-m*1.2:m*1.2, s=dragY, d=200, t0=performance.now();
    function anim(now) { const t=Math.min((now-t0)/d,1); sh.style.transform=`translateY(${s+(ty-s)*t*t}px)`; if(t<1) requestAnimationFrame(anim); else showRegret(); }
    requestAnimationFrame(anim);
  }

  function showRegret() {
    regretOn=true; rb.classList.add('on'); rh.classList.add('on');
    ri.classList.remove('regret-drain'); void ri.offsetWidth; ri.classList.add('regret-drain');
    regretTimer=setTimeout(()=>{ if(regretOn) finalize(); },800);
  }

  function cancelRegret() {
    if(regretTimer) clearTimeout(regretTimer);
    regretTimer=null; regretOn=false;
    rb.classList.remove('on'); rh.classList.remove('on');
    ri.classList.remove('regret-drain'); slideSide=null;
  }

  function finalize() { if(!slideDecided) { slideDecided=true; showReport(); } }

  // ====== 报告 ======
  function showReport() {
    const topIsA = true;
    const lastP = slideTraj.length?slideTraj[slideTraj.length-1].progress:0;
    const slideTowardA = (lastP<0) ? topIsA : !topIsA;

    let votesA = 0, votesB = 0;
    qAnswers.forEach(a=>{ if(a==='A') votesA++; else if(a==='B') votesB++; });
    if(slideTowardA) votesA++; else votesB++;
    const finalTowardA = votesA >= votesB;
    const pick = finalTowardA ? optA : optB;
    const other = finalTowardA ? optB : optA;

    const totalTime = slideTraj.length ? slideTraj[slideTraj.length-1].t : 0;
    const reversals = countReversals(slideTraj);
    const firstDir = slideTraj.length>2 ? (slideTraj[2].progress<0?'top':'bottom') : null;
    const firstTowardA = firstDir ? (firstDir==='top'?topIsA:!topIsA) : null;

    document.getElementById('rp-pick').textContent=pick;
    document.getElementById('rp-vs').textContent='vs ' + other;
    document.getElementById('rp-dir').textContent = firstTowardA===finalTowardA ? '与最终选择一致 ✓' : (firstTowardA===null?'未检测到':'与最终选择冲突 ✗');
    document.getElementById('rp-rev').textContent = reversals+' 次'+(reversals===0?' (零犹豫)':reversals<=2?' (轻微)':' (高冲突)');
    document.getElementById('rp-time').textContent = (totalTime/1000).toFixed(2)+' 秒';
    document.getElementById('rp-cons').textContent = qAnswers.filter(a=>a==='A').length+':'+qAnswers.filter(a=>a==='B').length+' + '+(slideTowardA?'A':'B');

    let confText;
    if(votesA===3||votesB===3) confText='三票全投「'+pick+'」。你的潜意识很明确，别怀疑了。';
    else if(votesA===2||votesB===2) confText='2:1 票选「'+pick+'」。多数倾向很明显，跟着直觉走。';
    else confText='票数接近。但整体倾向「'+pick+'」，选它吧。';
    document.getElementById('rp-conf').textContent=confText;

    const staggers = document.querySelectorAll('.report-stagger');
    staggers.forEach(el=>{ el.classList.remove('in'); void el.offsetWidth; });
    requestAnimationFrame(()=>{ staggers.forEach(el=>el.classList.add('in')); });

    updateProgress(3);
    dots.forEach(d=>{ d.classList.remove('cur'); d.classList.add('done'); });

    try {
      const h=JSON.parse(localStorage.getItem('nd_history')||'[]');
      h.unshift({ts:Date.now(),pick,other,reversals,totalTime});
      localStorage.setItem('nd_history',JSON.stringify(h.slice(0,20)));
      localStorage.removeItem('nd_draft');
    } catch(e){}
    show('p-report','fwd');
  }

  function countReversals(traj) {
    let c=0,ld=0;
    for(let i=1;i<traj.length;i++) {
      const d=Math.sign(traj[i].progress-traj[i-1].progress);
      if(d!==0&&ld!==0&&d!==ld) c++;
      if(d!==0) ld=d;
    }
    return c;
  }

  document.getElementById('btn-home').addEventListener('click',()=>{
    updateProgress(-1);
    dots.forEach(d=>{ d.classList.remove('done','cur'); });
    show('p-input','back');
  });
})();
</script>
