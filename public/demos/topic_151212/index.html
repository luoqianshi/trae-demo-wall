<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日餐桌 - AI智能饮食管家</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --secondary: #764ba2;
            --success: #52c41a;
            --warning: #fa8c16;
            --danger: #ff4d4f;
            --text: #333;
            --text-secondary: #666;
            --text-light: #888;
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #fff;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 16px;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 32px 16px;
            color: white;
        }

        .header h1 {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: clamp(14px, 3vw, 16px);
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
        }

        /* 卡片 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 步骤 */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .step {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e8e8e8;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step.active {
            background: var(--primary);
            color: white;
        }

        .step.done {
            background: var(--success);
            color: white;
        }

        .step-line {
            width: 32px;
            height: 2px;
            background: #e8e8e8;
        }

        .step-line.done {
            background: var(--success);
        }

        .step-text {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            margin-top: 4px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 表单 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-item {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-light);
            font-weight: normal;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        .budget-value {
            text-align: center;
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        /* 心情 */
        .moods {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mood {
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            background: white;
            transition: all 0.2s;
            user-select: none;
        }

        .mood:hover {
            border-color: var(--primary);
        }

        .mood.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .mood-custom {
            margin-top: 10px;
        }

        .mood-custom input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .mood-custom input:focus {
            border-color: var(--primary);
        }

        /* 食材 */
        .ingredient-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .ingredient-row input {
            flex: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tag-item {
            background: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag-item .close {
            cursor: pointer;
            opacity: 0.8;
        }

        .quick-add {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
        }

        .quick-add span {
            color: var(--primary);
            cursor: pointer;
            margin: 0 3px;
        }

        /* 加载 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #f0f0f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .loading-sub {
            color: var(--text-light);
            font-size: 12px;
            margin-top: 6px;
        }

        /* 结果 */
        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .profile-box {
            background: var(--bg);
            color: white;
            border-radius: 12px;
            padding: 16px;
        }

        .profile-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .profile-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .profile-tag {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* AI 回复 */
        .ai-box {
            background: #f8f9ff;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 16px;
        }

        .ai-label {
            font-size: 12px;
            color: var(--success);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .ai-label.error {
            color: var(--danger);
        }

        .ai-label.warn {
            color: var(--warning);
        }

        .ai-content {
            font-size: 14px;
            color: var(--text);
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .ai-thinking {
            color: var(--text-light);
            font-size: 13px;
        }

        .ai-thinking::after {
            content: '...';
            animation: dots 1.2s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
        }

        /* 菜谱 */
        .recipe-list {
            display: grid;
            gap: 10px;
        }

        .recipe-item {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recipe-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(102,126,234,0.12);
        }

        .recipe-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .recipe-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-light);
        }

        .recipe-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .recipe-score {
            display: inline-block;
            background: #fff7e6;
            color: var(--warning);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            margin-top: 8px;
        }

        /* 详情 */
        .detail {
            display: none;
            background: #f8f9ff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .detail.show {
            display: block;
        }

        .detail h4 {
            font-size: 14px;
            color: var(--primary);
            margin: 14px 0 8px;
        }

        .detail h4:first-child {
            margin-top: 0;
        }

        .detail ul {
            padding-left: 18px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .detail li {
            margin-bottom: 6px;
        }

        .detail-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .detail-meta span {
            background: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 学习记录 */
        .learning-box {
            background: #f0f9ff;
            border-left: 4px solid #1890ff;
            border-radius: 12px;
            padding: 14px;
        }

        .learning-title {
            font-size: 13px;
            color: #1890ff;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .learning-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 底部 */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            padding: 24px 16px;
            font-size: 12px;
        }

        /* 隐藏 */
        .hidden {
            display: none !important;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 16px;
                border-radius: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .ingredient-row {
                flex-direction: column;
            }

            .ingredient-row button {
                width: 100%;
            }

            .recipe-meta {
                gap: 8px;
            }

            .mood {
                padding: 7px 12px;
                font-size: 12px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 680px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>每日餐桌</h1>
            <p>AI 智能饮食管家 · 告诉你今天应该怎么吃</p>
            <span class="tag">生活娱乐赛道 · Demo</span>
        </div>

        <!-- 步骤 -->
        <div class="card">
            <div class="steps">
                <div class="step active" id="stepDot1">1</div>
                <div class="step-line" id="stepLine1"></div>
                <div class="step" id="stepDot2">2</div>
                <div class="step-line" id="stepLine2"></div>
                <div class="step" id="stepDot3">3</div>
            </div>
            <div class="step-text" id="stepText">填写你的情况</div>
        </div>

        <!-- 第1步 -->
        <div class="card" id="step1Panel">
            <div class="card-title">你的基本情况</div>
            
            <div class="form-grid">
                <div class="form-item">
                    <label class="form-label">年龄 <span class="form-hint">岁</span></label>
                    <input type="number" id="age" placeholder="25" min="1" max="120">
                </div>
                <div class="form-item">
                    <label class="form-label">性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label class="form-label">身高 <span class="form-hint">cm</span></label>
                    <input type="number" id="height" placeholder="170" min="50" max="250">
                </div>
                <div class="form-item">
                    <label class="form-label">体重 <span class="form-hint">kg</span></label>
                    <input type="number" id="weight" placeholder="65" min="20" max="300">
                </div>
            </div>

            <div class="form-item">
                <label class="form-label">今天心情 <span class="form-hint">可多选</span></label>
                <div class="moods" id="moodBox">
                    <div class="mood" data-mood="开心">开心</div>
                    <div class="mood" data-mood="疲惫">疲惫</div>
                    <div class="mood" data-mood="压力大">压力大</div>
                    <div class="mood" data-mood="平静">平静</div>
                    <div class="mood" data-mood="想吃辣">想吃辣</div>
                    <div class="mood" data-mood="想吃甜">想吃甜</div>
                </div>
                <div class="mood-custom">
                    <input type="text" id="moodInput" placeholder="输入自定义心情，回车添加" onkeypress="handleMoodKey(event)">
                    <div class="tags" id="moodTags" style="margin-top: 8px;"></div>
                </div>
            </div>

            <div class="form-item">
                <label class="form-label">今日预算 <span class="form-hint">元</span></label>
                <input type="range" id="budget" min="5" max="200" value="30" step="5" oninput="updateBudget()">
                <div class="budget-value">¥<span id="budgetValue">30</span></div>
            </div>

            <button class="btn btn-primary" onclick="goStep2()">下一步：添加食材</button>
            <button class="btn btn-secondary" style="margin-top: 10px; width: 100%;" onclick="generatePlan(true)">跳过，直接推荐</button>
        </div>

        <!-- 第2步 -->
        <div class="card hidden" id="step2Panel">
            <div class="card-title">冰箱里的食材</div>
            
            <div class="ingredient-row">
                <input type="text" id="ingredientInput" placeholder="例如：鸡蛋、西红柿、豆腐" onkeypress="handleIngredientKey(event)">
                <button class="btn btn-secondary" onclick="addIngredient()">添加</button>
            </div>
            
            <div class="tags" id="ingredientTags"></div>
            
            <div class="quick-add">
                快捷：
                <span onclick="quickAdd('鸡蛋')">鸡蛋</span>
                <span onclick="quickAdd('西红柿')">西红柿</span>
                <span onclick="quickAdd('豆腐')">豆腐</span>
                <span onclick="quickAdd('土豆')">土豆</span>
                <span onclick="quickAdd('猪肉')">猪肉</span>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="backStep1()">返回</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="generatePlan()">AI 生成方案</button>
            </div>
        </div>

        <!-- 加载 -->
        <div class="card loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">AI 正在分析你的情况</div>
            <div class="loading-sub">结合年龄、体重、心情、预算生成专属建议</div>
        </div>

        <!-- 第3步：结果 -->
        <div class="result" id="resultPanel">
            <div class="card">
                <div class="card-title">你的专属饮食方案</div>
                <div class="profile-box" id="profileBox"></div>
            </div>

            <div class="card">
                <div class="card-title">AI 营养师建议</div>
                <div class="ai-box">
                    <div class="ai-label" id="aiLabel">AI 正在思考</div>
                    <div class="ai-content" id="aiContent">
                        <span class="ai-thinking">请稍候</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title" style="justify-content: space-between;">
                    <span>推荐菜谱</span>
                    <button class="btn btn-secondary" id="refreshBtn" onclick="refreshRecipes()" style="padding: 6px 14px; font-size: 12px;">🔄 刷新</button>
                </div>
                <div class="recipe-list" id="recipeList"></div>
                <div class="recipe-loading" id="recipeLoading" style="display:none; text-align:center; padding: 30px;">
                    <div class="spinner" style="width:36px;height:36px;"></div>
                    <div style="color:#888;font-size:13px;margin-top:10px;">AI 正在生成新菜谱...</div>
                </div>
                <div class="detail" id="recipeDetail">
                    <button class="btn btn-secondary" onclick="backToList()" style="margin-bottom: 12px;">返回列表</button>
                    <div id="detailContent"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">AI 学习记录</div>
                <div class="learning-box">
                    <div class="learning-title">系统已记录你的偏好</div>
                    <div class="learning-text" id="learningText">每次选择都会让 AI 更懂你。</div>
                </div>
                <button class="btn btn-primary" style="margin-top: 14px;" onclick="resetDemo()">重新生成</button>
            </div>
        </div>

        <div class="footer">
            由 TRAE AI 生成 · TRAE AI 创造力大赛初赛 Demo<br>
            * 本 Demo 为体验版本
        </div>
    </div>

    <script>
        // AI 配置（内置，不在界面显示）
        const AI_CONFIG = {
            apiKey: 'ark-74949851-0adc-4cc1-acba-a0ed94064982-05cb7',
            model: 'deepseek-v4-flash-260425',
            apiUrl: 'http://localhost:3000/api/v3/chat/completions'
        };

        // 状态
        let userData = { age: '', gender: '', height: '', weight: '', moods: [], budget: 30 };
        let ingredients = [];
        let customMoods = [];
        let currentRecipes = [];
        let userHistory = [];
        let recipeSeed = 0; // 用于刷新时获取不同菜谱

        // 获取当前季节
        function getSeason() {
            const month = new Date().getMonth() + 1;
            if (month >= 3 && month <= 5) return '春季';
            if (month >= 6 && month <= 8) return '夏季';
            if (month >= 9 && month <= 11) return '秋季';
            return '冬季';
        }

        // 获取模拟天气（基于季节的合理推测）
        function getWeather() {
            const season = getSeason();
            const weathers = {
                '春季': ['温暖', '微雨', '多云'],
                '夏季': ['炎热', '雷阵雨', '闷热'],
                '秋季': ['凉爽', '晴朗', '干燥'],
                '冬季': ['寒冷', '下雪', '大风']
            };
            const opts = weathers[season];
            return opts[Math.floor(Math.random() * opts.length)];
        }

        // 预算显示
        function updateBudget() {
            document.getElementById('budgetValue').textContent = document.getElementById('budget').value;
        }

        // 心情选择（多选）
        document.querySelectorAll('.mood').forEach(m => {
            m.addEventListener('click', function() {
                this.classList.toggle('selected');
                updateMoods();
            });
        });

        function updateMoods() {
            const selected = [];
            document.querySelectorAll('.mood.selected').forEach(el => {
                selected.push(el.dataset.mood);
            });
            userData.moods = selected.concat(customMoods);
        }

        // 自定义心情
        function handleMoodKey(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('moodInput');
                const val = input.value.trim();
                if (val && !customMoods.includes(val) && !document.querySelector(`.mood[data-mood="${val}"]`)) {
                    customMoods.push(val);
                    input.value = '';
                    renderCustomMoods();
                    updateMoods();
                }
            }
        }

        function removeCustomMood(i) {
            customMoods.splice(i, 1);
            renderCustomMoods();
            updateMoods();
        }

        function renderCustomMoods() {
            document.getElementById('moodTags').innerHTML = customMoods.map((m, i) =>
                `<span class="tag-item">${m}<span class="close" onclick="removeCustomMood(${i})">×</span></span>`
            ).join('');
        }

        // 食材
        function quickAdd(item) { addItem(item); }
        function addIngredient() { addItem(document.getElementById('ingredientInput').value.trim()); }
        function handleIngredientKey(e) { if (e.key === 'Enter') addIngredient(); }

        function addItem(value) {
            if (value && !ingredients.includes(value)) {
                ingredients.push(value);
                document.getElementById('ingredientInput').value = '';
                renderIngredients();
            }
        }

        function removeIngredient(i) {
            ingredients.splice(i, 1);
            renderIngredients();
        }

        function renderIngredients() {
            document.getElementById('ingredientTags').innerHTML = ingredients.map((item, i) =>
                `<span class="tag-item">${item}<span class="close" onclick="removeIngredient(${i})">×</span></span>`
            ).join('');
        }

        // 步骤切换
        function goStep2() {
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;

            userData.age = age;
            userData.gender = document.getElementById('gender').value;
            userData.height = document.getElementById('height').value;
            userData.weight = weight;
            userData.budget = parseInt(document.getElementById('budget').value);

            document.getElementById('step1Panel').classList.add('hidden');
            document.getElementById('step2Panel').classList.remove('hidden');
            setStep(2);
        }

        function backStep1() {
            document.getElementById('step2Panel').classList.add('hidden');
            document.getElementById('step1Panel').classList.remove('hidden');
            setStep(1);
        }

        function setStep(n) {
            document.getElementById('stepDot1').className = 'step' + (n >= 1 ? (n > 1 ? ' done' : ' active') : '');
            document.getElementById('stepLine1').className = 'step-line' + (n > 1 ? ' done' : '');
            document.getElementById('stepDot2').className = 'step' + (n >= 2 ? (n > 2 ? ' done' : ' active') : '');
            document.getElementById('stepLine2').className = 'step-line' + (n > 2 ? ' done' : '');
            document.getElementById('stepDot3').className = 'step' + (n >= 3 ? ' active' : '');
            document.getElementById('stepText').textContent = ['填写你的情况','添加食材','查看专属方案'][n-1];
        }

        // 生成方案
        function generatePlan(skipStep2) {
            if (!skipStep2) {
                document.getElementById('step2Panel').classList.add('hidden');
            }
            document.getElementById('step1Panel').classList.add('hidden');
            document.getElementById('loading').classList.add('show');
            setStep(3);

            // 收集用户数据（食材和心情已在全局变量中，无需重新读取）
            userData.age = document.getElementById('age').value || '';
            userData.gender = document.getElementById('gender').value || '';
            userData.height = document.getElementById('height').value || '';
            userData.weight = document.getElementById('weight').value || '';
            userData.budget = parseInt(document.getElementById('budget').value) || 30;
            // 确保心情数据最新
            updateMoods();

            console.log('食材数组:', ingredients, '长度:', ingredients.length);
            console.log('心情数组:', userData.moods);

            renderProfile();
            callAI();
            fetchRecipes();
        }

        // 用户画像
        function renderProfile() {
            const isRandom = !userData.age && !userData.weight;
            const season = getSeason();
            const weather = getWeather();

            let bmi = '';
            if (userData.height && userData.weight) {
                const v = (userData.weight / Math.pow(userData.height/100, 2)).toFixed(1);
                const s = v < 18.5 ? '偏瘦' : v < 24 ? '正常' : v < 28 ? '偏胖' : '肥胖';
                bmi = `<span class="profile-tag">BMI ${v} ${s}</span>`;
            }

            document.getElementById('profileBox').innerHTML = `
                <div class="profile-title">${isRandom ? '今日智能推荐' : '你的画像'}</div>
                <div class="profile-tags">
                    ${isRandom ? `
                        <span class="profile-tag">🌤 ${weather}</span>
                        <span class="profile-tag">🍂 ${season}</span>
                        <span class="profile-tag">通用饮食偏好</span>
                    ` : `
                        <span class="profile-tag">${userData.age}岁</span>
                        ${userData.gender ? `<span class="profile-tag">${userData.gender}</span>` : ''}
                        ${userData.height ? `<span class="profile-tag">${userData.height}cm</span>` : ''}
                        <span class="profile-tag">${userData.weight}kg</span>
                        ${bmi}
                    `}
                    ${userData.moods.length ? `<span class="profile-tag">心情：${userData.moods.join('、')}</span>` : ''}
                    <span class="profile-tag">预算 ¥${userData.budget}</span>
                    <span class="profile-tag">食材：${ingredients.length ? ingredients.join('、') : '无'}</span>
                </div>
                ${isRandom ? `<div style="margin-top:10px;font-size:12px;opacity:0.85;">基于当前${weather}天气、${season}季节特征和通用饮食偏好生成推荐</div>` : ''}
            `;
        }

        // AI 调用通用方法
        async function callAIAPI(messages, timeout = 30000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            const res = await fetch(AI_CONFIG.apiUrl, {
                method: 'POST',
                signal: controller.signal,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + AI_CONFIG.apiKey
                },
                body: JSON.stringify({
                    model: AI_CONFIG.model,
                    stream: false,
                    messages: messages
                })
            });
            clearTimeout(timeoutId);

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errText.slice(0, 200)}`);
            }
            const data = await res.json();

            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content || '';
            }
            return '';
        }

        // 调用 AI 获取营养师建议
        async function callAI() {
            const label = document.getElementById('aiLabel');
            const content = document.getElementById('aiContent');

            label.textContent = 'AI 正在思考';
            label.className = 'ai-label';
            content.innerHTML = '<span class="ai-thinking">请稍候</span>';

            try {
                const reply = await callAIAPI([
                    { role: "system", content: "你是一位专业的 AI 营养师。请根据用户的个人信息、心情、预算和现有食材，给出个性化饮食建议。回复具体、实用、有温度，像朋友聊天。控制在300字以内。" },
                    { role: "user", content: buildAdvicePrompt() }
                ]);

                label.textContent = '✅ AI 营养师建议';
                label.className = 'ai-label';
                content.textContent = reply;
            } catch (err) {
                label.textContent = 'AI 调用失败';
                label.className = 'ai-label error';
                content.innerHTML = `<div style="margin-bottom:8px;color:#666;">错误：${err.name === 'AbortError' ? '请求超时' : err.message}</div><div>请确保代理服务器已启动（node proxy-server.js）</div>`;
            }

            document.getElementById('loading').classList.remove('show');
            document.getElementById('resultPanel').classList.add('show');
        }

        // 构建营养建议 prompt
        function buildAdvicePrompt() {
            const isRandom = !userData.age && !userData.weight;
            const season = getSeason();
            const weather = getWeather();

            let p = `请作为我的私人营养师，给我今天的饮食建议。\n\n`;
            if (isRandom) {
                p += `我的情况：未提供个人信息，请根据以下环境因素推荐：\n`;
                p += `- 当前天气：${weather}\n`;
                p += `- 当前季节：${season}\n`;
                p += `- 通用饮食偏好：营养均衡、简单易做\n`;
            } else {
                p += `我的情况：\n`;
                p += `- 年龄：${userData.age}岁\n`;
                if (userData.gender) p += `- 性别：${userData.gender}\n`;
                if (userData.height) {
                    const bmi = (userData.weight / Math.pow(userData.height/100, 2)).toFixed(1);
                    p += `- 身高：${userData.height}cm，体重：${userData.weight}kg，BMI：${bmi}\n`;
                } else {
                    p += `- 体重：${userData.weight}kg\n`;
                }
            }
            if (userData.moods.length) p += `- 心情：${userData.moods.join('、')}\n`;
            p += `- 预算：${userData.budget}元\n`;
            p += `- 当前季节：${season}，天气：${weather}\n`;
            p += `\n食材：${ingredients.length ? ingredients.join('、') : '暂无，可建议购买'}\n`;
            p += `\n请给出：1.今天适合吃什么；2.推荐1-2道菜及理由；3.营养建议。语气轻松友好。`;
            return p;
        }

        // 构建菜谱生成 prompt
        function buildRecipePrompt() {
            const isRandom = !userData.age && !userData.weight;
            const season = getSeason();
            const weather = getWeather();
            recipeSeed++;

            let p = `请生成3道推荐菜谱，必须以 JSON 数组格式返回，不要包含任何其他文字。\n\n`;
            p += `背景信息：\n`;
            if (isRandom) {
                p += `- 未提供个人信息\n`;
                p += `- 天气：${weather}\n`;
                p += `- 季节：${season}\n`;
            } else {
                p += `- 年龄：${userData.age}岁\n`;
                if (userData.gender) p += `- 性别：${userData.gender}\n`;
                if (userData.weight) p += `- 体重：${userData.weight}kg\n`;
            }
            if (userData.moods.length) p += `- 心情：${userData.moods.join('、')}\n`;
            p += `- 预算：${userData.budget}元\n`;
            p += `- 食材：${ingredients.length ? ingredients.join('、') : '无限制'}\n`;
            p += `- 随机种子：${recipeSeed}（确保每次推荐不同）\n\n`;
            p += `返回格式（严格 JSON 数组）：\n`;
            p += `[{"name":"菜名","time":" cooking时间","difficulty":"难度","cost":预估成本数字,"desc":"简短描述","ingredients":["食材1","食材2"],"steps":["步骤1","步骤2"],"nutrition":"营养信息"}]`;
            return p;
        }

        // 获取 AI 生成的菜谱
        async function fetchRecipes() {
            const list = document.getElementById('recipeList');
            const loading = document.getElementById('recipeLoading');
            const refreshBtn = document.getElementById('refreshBtn');

            list.innerHTML = '';
            loading.style.display = 'block';
            refreshBtn.disabled = true;
            refreshBtn.textContent = '生成中...';

            try {
                const reply = await callAIAPI([
                    { role: "system", content: "你是一位专业厨师和营养师。请根据用户需求生成菜谱，必须只返回JSON数组，不要包含markdown代码块标记或其他文字。" },
                    { role: "user", content: buildRecipePrompt() }
                ], 30000);

                // 清理可能的 markdown 标记
                let cleanReply = reply.trim();
                if (cleanReply.startsWith('```')) {
                    cleanReply = cleanReply.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
                }

                const recipes = JSON.parse(cleanReply);
                currentRecipes = recipes;
                renderRecipes(recipes);
            } catch (err) {
                list.innerHTML = `<div style="text-align:center;padding:20px;color:#999;font-size:13px;">菜谱生成失败：${err.name === 'AbortError' ? '请求超时' : err.message}<br>请点击刷新重试</div>`;
            } finally {
                loading.style.display = 'none';
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 刷新';
            }
        }

        // 渲染菜谱列表
        function renderRecipes(recipes) {
            const list = document.getElementById('recipeList');
            if (!recipes || !recipes.length) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">暂无菜谱，请点击刷新</div>';
                return;
            }

            list.innerHTML = recipes.map((r, i) => `
                <div class="recipe-item" onclick="showDetail(${i})">
                    <div class="recipe-name">${r.name}</div>
                    <div class="recipe-meta">
                        <span>⏱ ${r.time || '未知'}</span>
                        <span>📊 ${r.difficulty || '未知'}</span>
                        <span>💰 ¥${r.cost || '?'}</span>
                    </div>
                    <div class="recipe-desc">${r.desc || ''}</div>
                    <span class="recipe-score">AI 推荐</span>
                </div>
            `).join('');
        }

        // 刷新菜谱
        function refreshRecipes() {
            document.getElementById('recipeDetail').classList.remove('show');
            document.getElementById('recipeList').style.display = 'block';
            fetchRecipes();
        }

        // 详情
        function showDetail(i) {
            const r = currentRecipes[i];
            if (!r) return;
            userHistory.push({ recipe: r.name, time: new Date().toLocaleTimeString(), moods: userData.moods.join('、') });
            updateLearning();

            document.getElementById('recipeList').style.display = 'none';
            document.getElementById('recipeDetail').classList.add('show');
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-meta">
                    <span>⏱ ${r.time || '未知'}</span>
                    <span>📊 ${r.difficulty || '未知'}</span>
                    <span>💰 ¥${r.cost || '?'}</span>
                    <span>${r.nutrition || ''}</span>
                </div>
                <h4>食材清单</h4>
                <ul>${(r.ingredients || []).map(x => `<li>${x}</li>`).join('')}</ul>
                <h4>烹饪步骤</h4>
                <ul>${(r.steps || []).map((s, i) => `<li><strong>步骤${i+1}：</strong>${s}</li>`).join('')}</ul>
            `;
        }

        function backToList() {
            document.getElementById('recipeDetail').classList.remove('show');
            document.getElementById('recipeList').style.display = 'block';
        }

        // 学习记录
        function updateLearning() {
            const el = document.getElementById('learningText');
            if (!userHistory.length) {
                el.innerHTML = '每次选择都会让 AI 更懂你。点击菜谱查看详情即可记录偏好。';
            } else {
                el.innerHTML = userHistory.map(h => `• ${h.time} 查看了「${h.recipe}」${h.moods ? '（心情：' + h.moods + '）' : ''}`).join('<br>');
            }
        }

        // 重置
        function resetDemo() {
            document.getElementById('resultPanel').classList.remove('show');
            document.getElementById('step1Panel').classList.remove('hidden');
            setStep(1);
        }

        // 初始化
        updateBudget();
        updateLearning();
    </script>
</body>
</html>
