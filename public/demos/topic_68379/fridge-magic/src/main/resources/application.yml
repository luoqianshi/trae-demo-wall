server:
  port: 3001

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fridge_magic?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fridgemagic.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  params: count=countSql

zhipu:
  api-key-encrypted: VmgtUUHcPYot0wZGPhhpBgcejLJ83gvkYYZl0evbFWZMNkE+Hnd2supobk4PJTap0lvhmZTc14IjYYJSNpaWVg==
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4-flash
  timeout: 120000