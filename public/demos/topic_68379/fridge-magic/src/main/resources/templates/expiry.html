<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食材临期管理 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .nav-link { color: #666; }
  .nav-link.active { color: var(--orange) !important; font-weight: 600; }
  .container { max-width: 800px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
  .expiring { border-left: 4px solid #e53935; }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/history">历史</a><a class="nav-link" href="/favorites">收藏</a><a class="nav-link active" href="/expiry">临期</a><a class="nav-link" href="/weekly-plan">周计划</a><a class="nav-link" href="/profile">个人中心</a><span class="nav-link" th:text="${username}"></span><a class="nav-link text-danger" href="/logout">退出</a></div></div></nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">⏰ 食材临期管理</h4><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ 添加食材</button></div>
  <div th:if="${expiring != null && !expiring.isEmpty()}" class="alert alert-danger">
    <strong>⚠️ 即将过期（3天内）：</strong>
    <span th:each="e,iter : ${expiring}" th:text="${e.name} + '（' + #temporals.format(e.expiryDate, 'MM-dd') + '）' + (iter.last ? '' : '、')"></span>
  </div>
  <div th:if="${items != null && !items.isEmpty()}">
    <div class="card p-3 mb-3" th:each="item : ${items}" th:classappend="${#temporals.format(item.expiryDate, 'yyyy-MM-dd') <= #temporals.createNow().plusDays(3).toLocalDate().toString()} ? 'expiring'">
      <div class="d-flex justify-content-between align-items-center">
        <div><strong th:text="${item.name}">食材</strong><br><small class="text-muted" th:text="'购买：'+ #temporals.format(item.purchaseDate, 'yyyy-MM-dd') + ' / 过期：' + #temporals.format(item.expiryDate, 'yyyy-MM-dd')">日期</small></div>
        <button class="btn btn-sm btn-outline-danger delete-expiry" th:data-id="${item.id}">删除</button>
      </div>
    </div>
  </div>
  <div th:unless="${items != null && !items.isEmpty()}" class="text-center text-muted py-5"><div style="font-size:56px">⏰</div><p>还没有添加食材临期记录</p></div>
</div>
<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">添加食材临期记录</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
  <div class="mb-3"><label class="form-label">食材名称</label><input type="text" class="form-control" id="expiryName"></div>
  <div class="mb-3"><label class="form-label">购买日期</label><input type="date" class="form-control" id="purchaseDate"></div>
  <div class="mb-3"><label class="form-label">过期日期</label><input type="date" class="form-control" id="expiryDate"></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" onclick="addExpiry()">添加</button></div></div></div></div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
function addExpiry() {
  $.ajax({ url: '/api/expiry/add', method: 'POST', contentType: 'application/json', data: JSON.stringify({name: $('#expiryName').val(), purchaseDate: $('#purchaseDate').val(), expiryDate: $('#expiryDate').val()}), success: function() { location.reload(); } });
}
$('.delete-expiry').on('click', function() { var id = $(this).data('id'); var btn = $(this); $.ajax({ url: '/api/expiry/'+id, method: 'DELETE', success: function() { btn.closest('.card').fadeOut(); } }); });
</script>
</body>
</html>
