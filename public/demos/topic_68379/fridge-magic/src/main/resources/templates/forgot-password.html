<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; }
  .card { max-width: 420px; margin: 80px auto; border: none; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
  .card-header { background: linear-gradient(135deg, #ff6b35, #e55a2b); color: #fff; border-radius: 16px 16px 0 0 !important; text-align: center; padding: 24px; }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header"><h3 class="mb-0">冰箱魔法</h3><small>找回密码</small></div>
    <div class="card-body p-4">
      <div id="alertBox" style="display:none"></div>
      <form id="forgotForm">
        <div class="mb-3"><label class="form-label">注册邮箱</label><input type="email" name="email" id="email" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100 py-2">重置密码</button>
      </form>
      <div class="text-center mt-3"><a th:href="@{/login}">返回登录</a></div>
    </div>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
$('#forgotForm').on('submit', function(e) { e.preventDefault();
  $.ajax({ url: '/api/forgot-password', method: 'POST', contentType: 'application/json', data: JSON.stringify({email: $('#email').val()}), success: function(r) { var type = r.success ? 'success' : 'danger'; $('#alertBox').removeClass().addClass('alert alert-'+type).text(r.message).show(); } }); });
</script>
</body>
</html>
