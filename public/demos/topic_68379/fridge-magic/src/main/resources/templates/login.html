<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; }
  .login-card { max-width: 420px; margin: 80px auto; }
  .card { border: none; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
  .card-header { background: linear-gradient(135deg, #ff6b35, #e55a2b); color: #fff; border-radius: 16px 16px 0 0 !important; text-align: center; padding: 24px; }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
  .btn-primary:hover { background: linear-gradient(135deg, #e55a2b, #cc4a1a); }
  a { color: #ff6b35; }
</style>
</head>
<body>
<div class="container">
  <div class="login-card">
    <div class="card">
      <div class="card-header">
        <h3 class="mb-0">冰箱魔法</h3>
        <small>登录您的账号</small>
      </div>
      <div class="card-body p-4">
        <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误</div>
        <div th:if="${param.logout}" class="alert alert-info">您已退出登录</div>
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">登 录</button>
        </form>
        <div class="text-center mt-3">
          <span class="text-muted">还没有账号？</span>
          <a th:href="@{/register}">立即注册</a>
          <span class="text-muted mx-2">|</span>
          <a th:href="@{/forgot-password}">忘记密码</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
