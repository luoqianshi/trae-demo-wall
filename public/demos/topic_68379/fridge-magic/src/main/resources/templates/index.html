<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冰箱魔法 - FridgeMagic</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  [data-bs-theme="dark"] { --bs-body-bg: #1a1a2e; --bs-body-color: #e0e0e0; }
  [data-bs-theme="dark"] .card { background: #16213e; border-color: #0f3460; }
  [data-bs-theme="dark"] .navbar { background: #0f3460 !important; }
  [data-bs-theme="dark"] .bg-light { background: #16213e !important; }
  [data-bs-theme="dark"] .text-dark { color: #e0e0e0 !important; }
  [data-bs-theme="dark"] .text-muted { color: #aaa !important; }
  [data-bs-theme="dark"] .form-control { background: #1a1a2e; color: #e0e0e0; border-color: #0f3460; }
  [data-bs-theme="dark"] .badge.bg-light { background: #0f3460 !important; color: #e0e0e0 !important; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  [data-bs-theme="dark"] body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .nav-link { color: #666; }
  .nav-link.active { color: var(--orange) !important; font-weight: 600; }
  .container { max-width: 800px; }
  .header { text-align: center; padding: 32px 0 20px; }
  .header h1 { font-size: 28px; font-weight: 700; color: var(--orange); }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .tag { cursor: pointer; transition: all 0.2s; }
  .tag.active { background: var(--orange) !important; color: #fff !important; border-color: var(--orange) !important; }
  .pref-btn { cursor: pointer; transition: all 0.2s; }
  .pref-btn.active { background: #8d6e63 !important; color: #fff !important; }
  .btn-generate { background: linear-gradient(135deg, var(--orange), #e55a2b); border: none; color: #fff; font-weight: 700; box-shadow: 0 4px 16px rgba(255,107,53,0.3); }
  .btn-generate:hover { background: linear-gradient(135deg, #e55a2b, #cc4a1a); color: #fff; }
  .btn-generate:disabled { background: #ccc; box-shadow: none; }
  .recipe-card { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .difficulty-simple { background: #e8f5e9; color: #2e7d32; }
  .difficulty-medium { background: #fff3e0; color: #e65100; }
  .difficulty-hard { background: #fce4ec; color: #c62828; }
  .nutrition-item { background: #f5f5f5; border-radius: 10px; padding: 10px 6px; text-align: center; }
  .nutrition-val { font-size: 18px; font-weight: 700; color: var(--orange); }
  .nutrition-label { font-size: 11px; color: #999; }
  .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
  .star-rating { font-size: 20px; cursor: pointer; }
  .star-rating span { color: #ddd; transition: color 0.2s; }
  .star-rating span.active { color: #ffc107; }
  #videoPreview { width: 100%; max-width: 400px; border-radius: 10px; display: none; }
  .dark-mode-btn { cursor: pointer; }
</style>
</head>
<body>
<nav class="navbar navbar-expand">
  <div class="container">
    <a class="navbar-brand" href="/">冰箱魔法</a>
    <div class="navbar-nav ms-auto flex-row align-items-center gap-1">
      <span class="nav-link dark-mode-btn" id="darkModeBtn" onclick="toggleDarkMode()" title="切换暗色模式">暗色模式</span>
      <a class="nav-link active" href="/">首页</a>
      <a class="nav-link" href="/history">历史</a>
      <a class="nav-link" href="/favorites">收藏</a>
      <a class="nav-link" href="/expiry">临期</a>
      <a class="nav-link" href="/weekly-plan">周计划</a>
      <a class="nav-link" href="/profile">个人中心</a>
      <span class="nav-link" th:text="${username}"></span>
      <a class="nav-link text-danger" href="/logout">退出</a>
    </div>
  </div>
</nav>

<div class="container mt-3">
  <div class="header"><span style="font-size:48px">🪄</span><h1>冰箱魔法</h1><p class="text-muted">有什么 → 做什么，AI 帮你搞定晚餐</p></div>

  <!-- 临期提醒 -->
  <div th:if="${expiring != null && !expiring.isEmpty()}" class="alert alert-warning alert-dismissible fade show">
    ⚠️ 以下食材即将过期：
    <span th:each="e,iter : ${expiring}" th:text="${e.name} + (iter.last ? '' : '、')"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 食材输入 -->
  <div class="card p-4 mb-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <label class="form-label fw-bold mb-0">🧺 冰箱里有什么食材？</label>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="startCamera()">拍照识别</button>
        <label class="btn btn-outline-secondary btn-sm mb-0">
          导入图片
          <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="recognizeFile(this)">
        </label>
        <button class="btn btn-outline-secondary btn-sm" id="voiceBtn" onclick="startVoice()">语音输入</button>
      </div>
    </div>
    <div id="cameraSection" class="mb-3" style="display:none">
      <video id="videoPreview" autoplay playsinline></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-sm btn-primary" onclick="capturePhoto()">拍照识别</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="stopCamera()">关闭</button>
      </div>
      <div id="recognizeStatus" class="text-muted small mt-1" style="display:none"></div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3" id="tagList">
      <th:block th:each="ing : ${ingredients}">
        <span class="badge tag bg-light text-dark border p-2" th:data-ingredient="${ing.name}" th:text="${ing.emoji + ' ' + ing.name}"></span>
      </th:block>
    </div>

    <div class="d-flex gap-2 mb-3">
      <input type="text" class="form-control" id="ingredientInput" placeholder="或手动输入食材，用逗号分隔…">
      <input type="text" class="form-control" id="newIngredientName" placeholder="新食材名" style="width:120px">
      <input type="text" class="form-control" id="newIngredientEmoji" placeholder="emoji" style="width:70px" maxlength="2">
      <button class="btn btn-outline-success btn-sm" onclick="addIngredient()">+</button>
    </div>

    <div class="d-flex gap-2 mb-3 flex-wrap" id="prefList">
      <span class="badge pref-btn active bg-light text-dark border p-2" data-pref="">🍽️ 不限</span>
      <span class="badge pref-btn bg-light text-dark border p-2" data-pref="素食">🥬 素食</span>
      <span class="badge pref-btn bg-light text-dark border p-2" data-pref="低碳水">💪 低碳水</span>
      <span class="badge pref-btn bg-light text-dark border p-2" data-pref="快手菜">⚡ 快手菜</span>
      <span class="badge pref-btn bg-light text-dark border p-2" data-pref="家常菜">🏠 家常菜</span>
    </div>

    <div class="d-flex gap-2 align-items-center mb-3">
      <label class="form-label mb-0">生成数量：</label>
      <select class="form-select w-auto" id="recipeCount">
        <option value="1">1道</option>
        <option value="3" selected>3道</option>
        <option value="5">5道</option>
      </select>
    </div>

    <button class="btn btn-generate w-100 py-2" id="btnGenerate" disabled>✨ 看看能做什么菜</button>
  </div>

  <div id="resultsSection" style="display:none">
    <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
      <button class="btn btn-outline-secondary btn-sm" id="btnPrev" disabled>◀</button>
      <span class="fw-bold" id="cardIndicator">1/3</span>
      <button class="btn btn-outline-secondary btn-sm" id="btnNext">▶</button>
    </div>
    <div id="cardContainer"></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
var state = { selectedTags: new Set(), preference: '', recipes: [], currentIndex: 0, isLoading: false, timerInterval: null };

// Dark mode
if (localStorage.getItem('darkMode') === 'true') { document.documentElement.setAttribute('data-bs-theme', 'dark'); $('#darkModeBtn').text('亮色模式'); }
function toggleDarkMode() {
  var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
  document.documentElement.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
  $('#darkModeBtn').text(isDark ? '暗色模式' : '亮色模式');
  localStorage.setItem('darkMode', isDark ? 'false' : 'true');
}

$('#tagList').on('click', '.tag', function() {
  var ing = $(this).data('ingredient');
  if (state.selectedTags.has(ing)) { state.selectedTags.delete(ing); $(this).removeClass('active'); }
  else { state.selectedTags.add(ing); $(this).addClass('active'); }
  updateBtn();
});
$('#ingredientInput').on('input', updateBtn);
function getAllIngredients() {
  var manual = $('#ingredientInput').val().split(/[,，、\s]+/).filter(function(s) { return s.trim(); });
  var all = [...state.selectedTags, ...manual.map(function(s){ return s.trim(); })];
  // 去重
  return [...new Set(all)];
}
function updateBtn() { $('#btnGenerate').prop('disabled', getAllIngredients().length === 0 || state.isLoading); }
$('#prefList').on('click', '.pref-btn', function() {
  $('#prefList .pref-btn').removeClass('active'); $(this).addClass('active');
  state.preference = $(this).data('pref') || '';
});

function addIngredient() {
  var name = $('#newIngredientName').val().trim();
  var emoji = $('#newIngredientEmoji').val().trim() || '🥬';
  if (!name) return;
  // 前端先检查标签列表是否已存在
  var exists = false;
  $('#tagList .tag').each(function() { if ($(this).data('ingredient') === name) exists = true; });
  if (exists) { showToast('食材「' + name + '」已存在', 'error'); return; }
  $.ajax({ url: '/api/ingredient/add', method: 'POST', contentType: 'application/json',
    data: JSON.stringify({name: name, emoji: emoji}),
    success: function(res) {
      if (res.success) { location.reload(); }
      else { showToast(res.message || '添加失败', 'error'); }
    },
    error: function() { showToast('添加失败', 'error'); }
  });
}

$('#btnGenerate').on('click', generate);
function generate() {
  var ingredients = getAllIngredients();
  if (ingredients.length === 0) return;
  state.isLoading = true;
  $('#btnGenerate').prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>AI 大厨正在思考…');
  $('#resultsSection').show();
  showSkeleton();

  $.ajax({
    url: '/api/generate', method: 'POST', contentType: 'application/json',
    timeout: 120000,
    data: JSON.stringify({ ingredients: ingredients.join('、'), preference: state.preference, count: parseInt($('#recipeCount').val()) }),
    success: function(res) {
      if (res.success) { state.recipes = res.recipes; state.currentIndex = 0; renderCard(); }
      else { showToast(res.message || 'AI 暂不可用', 'warning'); }
    },
    error: function(xhr) {
      if (xhr.statusText === 'timeout') {
        showToast('AI 响应超时，请稍后重试', 'error');
      } else {
        showToast('网络异常，请稍后重试', 'error');
      }
    },
    complete: function() { state.isLoading = false; $('#btnGenerate').prop('disabled', false).html('看看能做什么菜'); }
  });
}

var FALLBACK = [
  { name:'番茄炒蛋', difficulty:'简单', time:'10分钟', steps:['鸡蛋打散加盐搅匀','热锅凉油炒蛋盛出','炒番茄出汁倒回鸡蛋','加盐调味出锅'], nutrition:{calories:180,protein:10,carbs:12,fat:10}, extraIngredients:[] },
  { name:'蒜蓉西兰花', difficulty:'简单', time:'12分钟', steps:['西兰花掰小朵洗净','焯水1分钟','蒜末炒香','放入西兰花大火翻炒加盐蚝油'], nutrition:{calories:85,protein:5,carbs:9,fat:3}, extraIngredients:[] },
  { name:'红烧豆腐', difficulty:'中等', time:'15分钟', steps:['豆腐切厚片吸干水分','煎至两面金黄','爆香葱姜蒜加生抽老抽糖和水','放入豆腐中火收汁'], nutrition:{calories:220,protein:15,carbs:18,fat:11}, extraIngredients:['生抽','老抽','糖'] }
];

function showSkeleton() {
  $('#cardContainer').html('<div class="card p-4"><div class="skeleton mb-3" style="height:28px;width:60%"></div><div class="skeleton mb-3" style="height:16px;width:40%"></div>'+[1,2,3,4].map(function(){return '<div class="skeleton mb-2" style="height:14px"></div>';}).join('')+'<div class="row mt-3">'+[1,2,3,4].map(function(){return '<div class="col-3"><div class="skeleton" style="height:50px"></div></div>';}).join('')+'</div></div>');
  updateNav();
}

function renderCard() {
  var r = state.recipes[state.currentIndex]; if (!r) return;
  var diffClass = r.difficulty === '简单' ? 'difficulty-simple' : r.difficulty === '中等' ? 'difficulty-medium' : 'difficulty-hard';
  var stepsHtml = (r.steps||[]).map(function(s,i) { return '<li class="mb-2">'+esc(s)+'</li>'; }).join('');
  var nut = r.nutrition||{};
  var nutHtml = '<div class="row g-2 mb-3">'+
    '<div class="col-3"><div class="nutrition-item"><div class="nutrition-val">'+(nut.calories||'-')+'</div><div class="nutrition-label">热量(kcal)</div></div></div>'+
    '<div class="col-3"><div class="nutrition-item"><div class="nutrition-val">'+(nut.protein||'-')+'</div><div class="nutrition-label">蛋白质(g)</div></div></div>'+
    '<div class="col-3"><div class="nutrition-item"><div class="nutrition-val">'+(nut.carbs||'-')+'</div><div class="nutrition-label">碳水(g)</div></div></div>'+
    '<div class="col-3"><div class="nutrition-item"><div class="nutrition-val">'+(nut.fat||'-')+'</div><div class="nutrition-label">脂肪(g)</div></div></div></div>'+
    '<small class="text-muted">*营养数据为 AI 估算，仅供参考</small>';
  var extra = (r.extraIngredients||[]).length > 0 ?
    '<div class="mb-3"><strong>🛒 需要额外购买：</strong>'+r.extraIngredients.map(function(i){return '<span class="badge bg-warning text-dark me-1">'+esc(i)+'</span>';}).join('')+'</div>' :
    '<div class="mb-3"><strong>🛒 需要额外购买：</strong><span class="text-success">现有食材就够了！</span></div>';
  var favBtn = r.id ? '<button class="btn btn-sm btn-outline-danger fav-btn '+(r.isFavorite?'active':'')+'" data-id="'+r.id+'">'+(r.isFavorite?'❤️':'🤍')+'</button>' : '';
  var timerBtn = r.time ? '<button class="btn btn-sm btn-outline-info ms-1" onclick="startTimer(\''+esc(r.time)+'\')">⏱️ 计时</button>' : '';

  $('#cardContainer').html('<div class="card p-4 recipe-card">'+
    '<div class="d-flex justify-content-between align-items-start mb-3">'+
    '<h4 class="mb-0">'+esc(r.name)+'</h4><span class="badge '+diffClass+'">'+esc(r.difficulty)+'</span></div>'+
    '<p class="text-muted mb-3">⏱️ '+esc(r.time)+'</p>'+
    '<h6>📝 烹饪步骤</h6><ol class="mb-3">'+stepsHtml+'</ol>'+
    '<h6>📊 营养信息</h6>'+nutHtml+extra+
    '<div class="d-flex gap-2 align-items-center mt-2">'+favBtn+timerBtn+
    '<button class="btn btn-sm btn-outline-success ms-1" onclick="shareRecipe('+state.currentIndex+')">📤 分享</button></div>'+
    (r.id ? '<div class="star-rating mt-2" data-id="'+r.id+'">'+[1,2,3,4,5].map(function(i){return '<span data-star="'+i+'">★</span>';}).join('')+'</div>' : '')+'</div>');

  $('.fav-btn').on('click', function() {
    var id = $(this).data('id'); var btn = $(this);
    $.post('/api/recipe/'+id+'/favorite', function(res) {
      if (res.success) { var isFav = btn.text() === '🤍'; btn.text(isFav?'❤️':'🤍'); btn.toggleClass('active',isFav); state.recipes[state.currentIndex].isFavorite = isFav ? 1 : 0; }
    });
  });
  $('.star-rating span').on('click', function() { var star = parseInt($(this).data('star')); var id = $(this).parent().data('id');
    $.ajax({ url: '/api/recipe/'+id+'/rate', method: 'POST', contentType: 'application/json', data: JSON.stringify({rating:star}),
      success: function() { $('.star-rating span').each(function(i) { $(this).toggleClass('active', i < star); }); } }); });
  updateNav();
}

function shareRecipe(idx) {
  var r = state.recipes[idx];
  var text = '🍳 冰箱魔法推荐：' + r.name + '（' + r.difficulty + ' / ' + r.time + '）\n' + (r.steps||[]).map(function(s,i){return (i+1)+'. '+s;}).join('\n');
  if (navigator.share) { navigator.share({title: r.name, text: text}); } else { navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板','info');}); }
}

function startTimer(timeStr) {
  var mins = parseInt(timeStr) || 15;
  state.timerInterval = setInterval(function() {
    if (mins <= 0) { clearInterval(state.timerInterval); showToast('⏰ 时间到！','info'); return; }
    mins--; showToast('⏱️ 剩余 ' + mins + ' 分钟','info');
  }, 60000);
  showToast('⏱️ 计时器已启动：' + mins + ' 分钟','info');
}

function updateNav() {
  var total = state.recipes.length;
  $('#cardIndicator').text(total > 0 ? (state.currentIndex+1)+'/'+total : '0/0');
  $('#btnPrev').prop('disabled', state.currentIndex <= 0);
  $('#btnNext').prop('disabled', state.currentIndex >= total-1);
}
$('#btnPrev').on('click', function() { if (state.currentIndex > 0) { state.currentIndex--; renderCard(); } });
$('#btnNext').on('click', function() { if (state.currentIndex < state.recipes.length-1) { state.currentIndex++; renderCard(); } });
$(document).on('keydown', function(e) { if (e.key === 'ArrowLeft') $('#btnPrev').click(); if (e.key === 'ArrowRight') $('#btnNext').click(); });

// Camera
var stream = null;
async function startCamera() {
  $('#cameraSection').show();
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); $('#videoPreview').show()[0].srcObject = stream; }
  catch(e) { showToast('无法访问摄像头', 'error'); }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t=>t.stop()); } $('#cameraSection').hide(); }

function capturePhoto() {
  var video = $('#videoPreview')[0]; var canvas = $('#canvas')[0];
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  var base64 = canvas.toDataURL('image/jpeg', 0.8);
  stopCamera();
  recognizeImage(base64);
}

function recognizeFile(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e) { recognizeImage(e.target.result); };
  reader.readAsDataURL(file);
  input.value = '';
}

function recognizeImage(base64) {
  $('#recognizeStatus').text('正在识别食材...').show();
  showToast('正在识别图片中的食材...', 'info');
  $.ajax({
    url: '/api/recognize', method: 'POST', contentType: 'application/json',
    data: JSON.stringify({image: base64}),
    success: function(res) {
      if (res.success && res.ingredients) {
        var recognized = res.ingredients.split(/[,，、]/).map(function(s){ return s.trim(); }).filter(Boolean);
        var current = getAllIngredients();
        var newOnes = recognized.filter(function(r) { return current.indexOf(r) === -1; });
        var duplicates = recognized.filter(function(r) { return current.indexOf(r) !== -1; });
        if (duplicates.length > 0) {
          showToast('已自动忽略重复食材：' + duplicates.join('、'), 'info');
        }
        if (newOnes.length > 0) {
          var newVal = current.concat(newOnes).join(',');
          $('#ingredientInput').val(newVal);
          updateBtn();
          showToast('识别到新食材：' + newOnes.join('、'), 'info');
        } else if (duplicates.length > 0) {
          showToast('识别的食材都已存在', 'info');
        }
      } else {
        showToast('识别失败：' + (res.message || '未识别到食材'), 'error');
      }
      $('#recognizeStatus').hide();
    },
    error: function() {
      showToast('识别请求失败，请检查服务', 'error');
      $('#recognizeStatus').hide();
    }
  });
}

// Voice
var recognition = null;
function startVoice() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showToast('浏览器不支持语音识别','error'); return; }
  recognition = new SpeechRecognition(); recognition.lang = 'zh-CN';
  recognition.onresult = function(e) { var text = e.results[0][0].transcript; $('#ingredientInput').val(text); updateBtn(); };
  recognition.onerror = function() { showToast('语音识别失败','error'); };
  recognition.start(); showToast('🎤 正在聆听…','info');
}

function showToast(msg, type) {
  var t = $('<div class="alert alert-'+(type==='warning'?'warning':type==='error'?'danger':'info')+' py-2 px-3 small" style="pointer-events:auto">'+msg+'</div>');
  $('#toastContainer').append(t); setTimeout(function(){t.fadeOut(function(){t.remove()});},3000);
}
function esc(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
updateBtn();
</script>
</body>
</html>
