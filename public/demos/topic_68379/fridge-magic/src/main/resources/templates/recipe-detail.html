<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${recipe.name} + ' - 冰箱魔法'">菜谱详情</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .container { max-width: 800px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .difficulty-simple { background: #e8f5e9; color: #2e7d32; }
  .difficulty-medium { background: #fff3e0; color: #e65100; }
  .difficulty-hard { background: #fce4ec; color: #c62828; }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/history">返回</a><span class="nav-link" th:text="${username}"></span></div></div></nav>
<div class="container mt-4">
  <div class="card p-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h3 th:text="${recipe.name}">菜名</h3>
      <span class="badge" th:classappend="${recipe.difficulty == '简单' ? 'difficulty-simple' : recipe.difficulty == '中等' ? 'difficulty-medium' : 'difficulty-hard'}" th:text="${recipe.difficulty}">难度</span>
    </div>
    <div class="d-flex gap-3 mb-4 text-muted">
      <span th:text="'⏱️ ' + ${recipe.cookTime}">时间</span>
      <span th:text="'🧺 ' + ${recipe.ingredientsInput}">食材</span>
      <span th:if="${recipe.preference != null && !recipe.preference.isEmpty()}" th:text="'🏷️ ' + ${recipe.preference}">偏好</span>
    </div>
    <h5>📝 烹饪步骤</h5>
    <ol class="mb-4" id="stepsList"></ol>
    <h5>📊 营养信息</h5>
    <div class="row g-2 mb-3" id="nutritionRow"></div>
    <small class="text-muted">*营养数据为 AI 估算，仅供参考</small>
    <h5 class="mt-3">🛒 需要额外购买</h5>
    <div id="extraRow"></div>
    <small class="text-muted mt-3" th:text="'生成时间：' + ${#temporals.format(recipe.createdAt, 'yyyy-MM-dd HH:mm')}">时间</small>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script>
try {
  var steps = JSON.parse(/*[[${recipe.steps}]]*/ '[]');
  var nut = JSON.parse(/*[[${recipe.nutrition}]]*/ '{}');
  var extra = JSON.parse(/*[[${recipe.extraIngredients}]]*/ '[]');
  $('#stepsList').html(steps.map(function(s,i){return '<li class="mb-2">'+s+'</li>';}).join(''));
  $('#nutritionRow').html(
    '<div class="col-3"><div class="text-center bg-light rounded p-2"><strong style="color:#ff6b35;font-size:18px">'+(nut.calories||'-')+'</strong><br><small class="text-muted">热量(kcal)</small></div></div>'+
    '<div class="col-3"><div class="text-center bg-light rounded p-2"><strong style="color:#ff6b35;font-size:18px">'+(nut.protein||'-')+'</strong><br><small class="text-muted">蛋白质(g)</small></div></div>'+
    '<div class="col-3"><div class="text-center bg-light rounded p-2"><strong style="color:#ff6b35;font-size:18px">'+(nut.carbs||'-')+'</strong><br><small class="text-muted">碳水(g)</small></div></div>'+
    '<div class="col-3"><div class="text-center bg-light rounded p-2"><strong style="color:#ff6b35;font-size:18px">'+(nut.fat||'-')+'</strong><br><small class="text-muted">脂肪(g)</small></div></div>'
  );
  $('#extraRow').html(extra.length > 0 ? extra.map(function(i){return '<span class="badge bg-warning text-dark me-1">'+i+'</span>';}).join('') : '<span class="text-success">现有食材就够了！</span>');
} catch(e) { console.log(e); }
</script>
</body>
</html>
