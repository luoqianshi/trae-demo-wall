<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: #f5f5f5; min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .container { max-width: 900px; }
  .stat-card { background: #fff; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .stat-card .stat-val { font-size: 36px; font-weight: 700; color: var(--orange); }
  .stat-card .stat-label { color: #999; font-size: 14px; }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">首页</a><a class="nav-link active" href="/admin">管理</a><span class="nav-link" th:text="${username}"></span><a class="nav-link text-danger" href="/logout">退出</a></div></div></nav>
<div class="container mt-4">
  <h4 class="mb-4">⚙️ 管理后台</h4>
  <div class="row g-3 mb-4">
    <div class="col-4"><div class="stat-card"><div class="stat-val" th:text="${userCount}">0</div><div class="stat-label">注册用户</div></div></div>
    <div class="col-4"><div class="stat-card"><div class="stat-val" th:text="${recipeCount}">0</div><div class="stat-label">生成菜谱</div></div></div>
    <div class="col-4"><div class="stat-card"><div class="stat-val" th:text="${auditCount}">0</div><div class="stat-label">操作日志</div></div></div>
  </div>
  <div class="d-flex gap-2">
    <a href="/admin/users" class="btn btn-outline-warning">👥 用户管理</a>
    <a href="/admin/logs" class="btn btn-outline-warning">📋 操作日志</a>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
