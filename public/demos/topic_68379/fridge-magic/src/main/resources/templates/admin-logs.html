<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作日志 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: #f5f5f5; min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .container { max-width: 900px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/admin">管理</a><a class="nav-link active" href="/admin/logs">日志</a><span class="nav-link" th:text="${username}"></span><a class="nav-link text-danger" href="/logout">退出</a></div></div></nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">📋 操作日志</h4><a href="/admin" class="btn btn-sm btn-outline-secondary">← 返回</a></div>
  <div class="card p-3">
    <table class="table mb-0">
      <thead><tr><th>时间</th><th>用户</th><th>操作</th><th>详情</th></tr></thead>
      <tbody>
        <tr th:each="log : ${logs}">
          <td th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}">-</td>
          <td th:text="${log.username}">-</td>
          <td><span class="badge bg-info" th:text="${log.action}">-</span></td>
          <td th:text="${log.detail}">-</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
