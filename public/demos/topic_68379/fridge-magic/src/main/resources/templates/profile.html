<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .nav-link { color: #666; }
  .nav-link.active { color: var(--orange) !important; font-weight: 600; }
  .container { max-width: 800px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/history">历史</a><a class="nav-link" href="/favorites">收藏</a><a class="nav-link" href="/expiry">临期</a><a class="nav-link" href="/weekly-plan">周计划</a><a class="nav-link active" href="/profile">个人中心</a><span class="nav-link" th:text="${username}"></span><a class="nav-link text-danger" href="/logout">退出</a></div></div></nav>
<div class="container mt-4">
  <h4 class="mb-4">👤 个人中心</h4>
  <div class="row">
    <div class="col-md-6">
      <div class="card p-4 mb-3">
        <h5>基本资料</h5>
        <div id="profileAlert" style="display:none"></div>
        <form id="profileForm">
          <div class="mb-3"><label class="form-label">用户名</label><input type="text" class="form-control" th:value="${user.username}" disabled></div>
          <div class="mb-3"><label class="form-label">邮箱</label><input type="email" class="form-control" id="email" th:value="${user.email}"></div>
          <button type="submit" class="btn btn-primary">保存</button>
        </form>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card p-4 mb-3">
        <h5>修改密码</h5>
        <div id="pwdAlert" style="display:none"></div>
        <form id="pwdForm">
          <div class="mb-3"><label class="form-label">原密码</label><input type="password" class="form-control" id="oldPwd" required></div>
          <div class="mb-3"><label class="form-label">新密码</label><input type="password" class="form-control" id="newPwd" required minlength="6"></div>
          <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
      </div>
      <div class="card p-4">
        <h5>营养目标</h5>
        <div id="goalAlert" style="display:none"></div>
        <form id="goalForm">
          <div class="mb-3"><label class="form-label">每日热量目标 (kcal)</label><input type="number" class="form-control" id="calorieGoal" th:value="${user.dailyCalorieGoal}"></div>
          <div class="mb-3"><label class="form-label">每日蛋白质目标 (g)</label><input type="number" class="form-control" id="proteinGoal" th:value="${user.dailyProteinGoal}"></div>
          <button type="submit" class="btn btn-primary">保存</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
$('#profileForm').on('submit', function(e) { e.preventDefault();
  $.ajax({ url: '/api/profile/update', method: 'POST', contentType: 'application/json', data: JSON.stringify({email: $('#email').val()}), success: function(r) { showAlert('profileAlert', r.success ? '保存成功' : r.message, r.success); } }); });
$('#pwdForm').on('submit', function(e) { e.preventDefault();
  $.ajax({ url: '/api/profile/password', method: 'POST', contentType: 'application/json', data: JSON.stringify({oldPassword: $('#oldPwd').val(), newPassword: $('#newPwd').val()}), success: function(r) { showAlert('pwdAlert', r.success ? '密码修改成功' : r.message, r.success); if(r.success) $('#pwdForm')[0].reset(); } }); });
$('#goalForm').on('submit', function(e) { e.preventDefault();
  $.ajax({ url: '/api/profile/nutrition-goal', method: 'POST', contentType: 'application/json', data: JSON.stringify({calorieGoal: parseInt($('#calorieGoal').val()), proteinGoal: parseInt($('#proteinGoal').val())}), success: function(r) { showAlert('goalAlert', r.success ? '目标已保存' : r.message, r.success); } }); });
function showAlert(id, msg, ok) { $('#'+id).removeClass().addClass('alert alert-'+(ok?'success':'danger')).text(msg).show(); }
</script>
</body>
</html>
