<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史记录 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  [data-bs-theme="dark"] { --bs-body-bg: #1a1a2e; --bs-body-color: #e0e0e0; }
  [data-bs-theme="dark"] .card { background: #16213e; border-color: #0f3460; }
  [data-bs-theme="dark"] .navbar { background: #0f3460 !important; }
  [data-bs-theme="dark"] .text-muted { color: #aaa !important; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  [data-bs-theme="dark"] body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .nav-link { color: #666; }
  .nav-link.active { color: var(--orange) !important; font-weight: 600; }
  .container { max-width: 800px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .difficulty-simple { background: #e8f5e9; color: #2e7d32; }
  .difficulty-medium { background: #fff3e0; color: #e65100; }
  .difficulty-hard { background: #fce4ec; color: #c62828; }
  .page-link { color: var(--orange); }
  .active>.page-link { background: var(--orange); border-color: var(--orange); }
</style>
</head>
<body>
<nav class="navbar navbar-expand">
  <div class="container">
    <a class="navbar-brand" href="/">冰箱魔法</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/">首页</a>
      <a class="nav-link active" href="/history">历史</a>
      <a class="nav-link" href="/favorites">收藏</a>
      <a class="nav-link" href="/expiry">临期</a>
      <a class="nav-link" href="/weekly-plan">周计划</a>
      <a class="nav-link" href="/profile">个人中心</a>
      <span class="nav-link" th:text="${username}"></span>
      <a class="nav-link text-danger" href="/logout">退出</a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">历史记录</h4>
    <form class="d-flex gap-2" th:action="@{/history}" method="get">
      <input type="text" name="keyword" class="form-control form-control-sm" placeholder="搜索菜名或食材…" th:value="${keyword}">
      <button type="submit" class="btn btn-sm btn-outline-warning">搜索</button>
    </form>
  </div>
  <div th:if="${pageInfo != null and pageInfo.list != null and !pageInfo.list.isEmpty()}">
    <div class="card p-3 mb-3" th:each="recipe : ${pageInfo.list}">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <a th:href="@{/recipe/{id}(id=${recipe.id})}" class="text-decoration-none"><h5 class="mb-1" th:text="${recipe.name}">菜名</h5></a>
          <div class="d-flex gap-2 align-items-center">
            <span class="badge" th:classappend="${recipe.difficulty == '简单' ? 'difficulty-simple' : recipe.difficulty == '中等' ? 'difficulty-medium' : 'difficulty-hard'}" th:text="${recipe.difficulty}">难度</span>
            <small class="text-muted" th:text="'⏱️ ' + ${recipe.cookTime}">时间</small>
            <small class="text-muted" th:text="'食材: ' + ${recipe.ingredientsInput}">食材</small>
          </div>
        </div>
        <div class="text-end">
          <small class="text-muted d-block" th:if="${recipe.createdAt != null}" th:text="${#temporals.format(recipe.createdAt, 'yyyy-MM-dd HH:mm')}">时间</small>
          <span th:if="${recipe.rating != null and recipe.rating > 0}" class="text-warning rating-stars" th:attr="data-rating=${recipe.rating}"></span>
          <button class="btn btn-sm btn-outline-danger mt-1 delete-btn" th:data-id="${recipe.id}">删除</button>
        </div>
      </div>
    </div>
    <nav th:if="${pageInfo.pages > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${pageInfo.pageNum == 1} ? 'disabled'"><a class="page-link" th:href="@{/history(page=${pageInfo.pageNum - 1}, keyword=${keyword})}">上一页</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(1, pageInfo.pages)}" th:classappend="${i == pageInfo.pageNum} ? 'active'"><a class="page-link" th:href="@{/history(page=${i}, keyword=${keyword})}" th:text="${i}">1</a></li>
        <li class="page-item" th:classappend="${pageInfo.pageNum == pageInfo.pages} ? 'disabled'"><a class="page-link" th:href="@{/history(page=${pageInfo.pageNum + 1}, keyword=${keyword})}">下一页</a></li>
      </ul>
    </nav>
  </div>
  <div th:unless="${pageInfo != null and pageInfo.list != null and !pageInfo.list.isEmpty()}" class="text-center text-muted py-5">
    <div style="font-size:56px">📋</div><p>还没有生成过菜谱，去首页试试吧！</p><a href="/" class="btn btn-outline-warning">去首页</a>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
if (localStorage.getItem('darkMode') === 'true') document.documentElement.setAttribute('data-bs-theme', 'dark');
$('.rating-stars').each(function() { var r = parseInt($(this).data('rating')); $(this).text('★'.repeat(r)); });
$('.delete-btn').on('click', function() { var id = $(this).data('id'); if (!confirm('确定删除？')) return; var btn = $(this); $.ajax({ url: '/api/recipe/'+id, method: 'DELETE', success: function() { btn.closest('.card').fadeOut(); } }); });
</script>
</body>
</html>
