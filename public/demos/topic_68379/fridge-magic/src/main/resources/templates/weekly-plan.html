<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一周食谱计划 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  :root { --orange: #ff6b35; }
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .navbar { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .navbar-brand { font-weight: 700; color: var(--orange) !important; }
  .nav-link { color: #666; }
  .nav-link.active { color: var(--orange) !important; font-weight: 600; }
  .container { max-width: 900px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
  .plan-table td { vertical-align: middle; }
  .plan-table input { border: 1px solid #eee; border-radius: 8px; padding: 4px 8px; width: 100%; }
</style>
</head>
<body>
<nav class="navbar navbar-expand"><div class="container"><a class="navbar-brand" href="/">冰箱魔法</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/history">历史</a><a class="nav-link" href="/favorites">收藏</a><a class="nav-link" href="/expiry">临期</a><a class="nav-link active" href="/weekly-plan">周计划</a><a class="nav-link" href="/profile">个人中心</a><span class="nav-link" th:text="${username}"></span><a class="nav-link text-danger" href="/logout">退出</a></div></div></nav>
<div class="container mt-4">
  <h4 class="mb-4">一周食谱计划</h4>
  <div class="card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 th:text="'本周（' + ${weekStart} + ' 起）'">周</h5>
      <button class="btn btn-primary btn-sm" onclick="savePlan()">保存计划</button>
    </div>
    <div class="table-responsive">
      <table class="table plan-table">
        <thead><tr><th>星期</th><th>早餐</th><th>午餐</th><th>晚餐</th></tr></thead>
        <tbody id="planBody">
        </tbody>
      </table>
    </div>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:inline="javascript">
var weekStart = /*[[${weekStart}]]*/ '2026-01-01';
var planMap = /*[[${planMap}]]*/ {};
var days = ['周一','周二','周三','周四','周五','周六','周日'];
var meals = ['早餐','午餐','晚餐'];

var html = '';
for (var d = 0; d < 7; d++) {
  html += '<tr><th>' + days[d] + '</th>';
  for (var m = 0; m < 3; m++) {
    var key = d + '-' + meals[m];
    var val = planMap[key] || '';
    html += '<td><input type="text" class="form-control form-control-sm" data-day="' + d + '" data-meal="' + meals[m] + '" placeholder="输入菜名" value="' + val + '"></td>';
  }
  html += '</tr>';
}
$('#planBody').html(html);

function savePlan() {
  var plans = [];
  $('table input').each(function() {
    var val = $(this).val().trim();
    if (val) plans.push({ dayOfWeek: parseInt($(this).data('day')), mealType: $(this).data('meal'), recipeName: val });
  });
  $.ajax({ url: '/api/weekly-plan/save', method: 'POST', contentType: 'application/json',
    data: JSON.stringify({ weekStart: weekStart, plans: plans }),
    success: function() { alert('保存成功！'); }
  });
}
</script>
</body>
</html>
