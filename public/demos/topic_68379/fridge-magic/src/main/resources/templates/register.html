<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 冰箱魔法</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<style>
  body { background: linear-gradient(135deg, #fff5ec 0%, #fef9ef 50%, #fff8f0 100%); min-height: 100vh; }
  .register-card { max-width: 420px; margin: 60px auto; }
  .card { border: none; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
  .card-header { background: linear-gradient(135deg, #ff6b35, #e55a2b); color: #fff; border-radius: 16px 16px 0 0 !important; text-align: center; padding: 24px; }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #e55a2b); border: none; }
  .btn-primary:hover { background: linear-gradient(135deg, #e55a2b, #cc4a1a); }
  a { color: #ff6b35; }
</style>
</head>
<body>
<div class="container">
  <div class="register-card">
    <div class="card">
      <div class="card-header">
        <h3 class="mb-0">冰箱魔法</h3>
        <small>创建新账号</small>
      </div>
      <div class="card-body p-4">
        <div id="alertBox" style="display:none"></div>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱（选填）</label>
            <input type="email" name="email" id="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" id="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">注 册</button>
        </form>
        <div class="text-center mt-3">
          <span class="text-muted">已有账号？</span>
          <a th:href="@{/login}">立即登录</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
$('#registerForm').on('submit', function(e) {
  e.preventDefault();
  var pwd = $('#password').val();
  var cpwd = $('#confirmPassword').val();
  if (pwd !== cpwd) {
    showAlert('两次密码输入不一致', 'danger');
    return;
  }
  $.ajax({
    url: '/api/register',
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({
      username: $('#username').val(),
      password: pwd,
      email: $('#email').val()
    }),
    success: function(res) {
      if (res.success) {
        showAlert('注册成功！即将跳转到登录页...', 'success');
        setTimeout(function() { window.location.href = '/login'; }, 1500);
      } else {
        showAlert(res.message, 'danger');
      }
    },
    error: function() { showAlert('注册失败，请稍后重试', 'danger'); }
  });
});
function showAlert(msg, type) {
  $('#alertBox').removeClass().addClass('alert alert-' + type).text(msg).show();
}
</script>
</body>
</html>
