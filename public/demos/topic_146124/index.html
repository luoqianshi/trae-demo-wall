umb's special joint lets it rotate and move across the palm, where it can touch the other fingers."},{"id":"q-001-3","articleId":"art-001","type":"reading","stem":"The word \\"versatile\\" in the paragraph about the thumb is closest in meaning to ______.","options":["rigid","adaptable","fragile","uniform"],"answer":"B","summary":"词义题。结合语境，versatile 意为\\"多功能的、用途广泛的\\"，与 adaptable 同义。","analysis":"原文称拇指为 \\"one of the most versatile parts of the hand, enabling you to pinch and pick up small objects\\"，即拇指功能多样。versatile 与 adaptable（适应性强的、多用途的）同义，选 B。A rigid（僵硬的）、C fragile（易碎的）、D uniform（单一的）均不符。","locationSentence":"This makes the thumb one of the most versatile parts of the hand, enabling you to pinch and pick up small objects."},{"id":"q-001-4","articleId":"art-001","type":"reading","stem":"What can be inferred about the relationship between evolution and finger length?","options":["Evolution had no effect on finger proportions.","Finger length is determined solely by hormones.","Hands better suited for gripping and precision were naturally selected over time.","Modern humans have longer fingers than early humans because of genes alone."],"answer":"C","summary":"推断题。第五部分说明更适合抓握和精准操作的手更易存活，逐渐塑造了现代人的手。","analysis":"原文 \\"Those with hands better suited for gripping and precision were more likely to thrive, gradually shaping the modern human hand\\" 表明自然选择偏好利于抓握与精准的手，选 C。A 与整段相悖；B 忽略了基因和进化；D 过于绝对，原文未比较古今手指长度。","locationSentence":"Those with hands better suited for gripping and precision were more likely to thrive, gradually shaping the modern human hand."},{"id":"q-001-5","articleId":"art-001","type":"reading","stem":"Which of the following is NOT mentioned as a factor influencing finger length?","options":["Genes","Hormones","Evolution","Diet"],"answer":"D","summary":"是非题。文章提到基因、激素和进化，未提及饮食影响手指长度。","analysis":"文章分别讨论了 evolution（第五部分）、genes 和 hormones（第六部分）对手指发育的影响，但全文未提及 diet（饮食）作为决定手指长度的因素，故选 D。题干问 NOT mentioned。","locationSentence":"These genes influence how quickly bones lengthen, how long each finger becomes, and how the joints and tendons are shaped."},{"id":"q-001-6","articleId":"art-001","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage explains that human fingers differ in length because each finger specialises in a distinct task — from the middle finger's central axis role to the thumb's opposable versatility. The author argues that evolution favoured hands suited for both gripping and precision, while genes and hormones guide how each finger develops before birth. Together these forces produced a hand whose varied finger sizes and roles let us perform both powerful and delicate movements.","summary":"主旨概括题。文章核心是手指长度差异的功能、进化与发育成因。","analysis":"参考范文覆盖三层：① 各指分工不同；② 进化偏好利于抓握与精准的手；③ 基因与激素共同决定发育。概括时应体现\\"功能—进化—发育\\"的逻辑链，而非罗列细节。","locationSentence":"Together, these forces produced a hand in which each finger has a different size, shape and role, helping us perform everything from powerful grips to delicate movements."},{"id":"q-002-1","articleId":"art-002","type":"reading","stem":"According to the passage, how many species did the 2023 study find that free-ranging cats eat?","options":["About 533 species.","Nearly 2,100 species.","Exactly 347 species.","About 148 species."],"answer":"B","summary":"细节题。第三段指出 2023 年的研究发现猫吃掉近 2100 种动物。","analysis":"原文写道 \\"this paper analyzed the 533 studies on cat diet or predation events published over more than a century and found that cats ate nearly 2,100 different species of animals\\"。533 是研究的文献数，2100 是物种数，347 是受威胁物种数，148 是可识别的无脊椎物种数。选 B。","locationSentence":"Published in 2023, this paper analyzed the 533 studies on cat diet or predation events published over more than a century and found that cats ate nearly 2,100 different species of animals, including invertebrates."},{"id":"q-002-2","articleId":"art-002","type":"reading","stem":"What can be inferred about invertebrates from the passage?","options":["They make up less than 10% of all terrestrial animal species.","They are unimportant in most ecosystems.","They are in decline globally due to several human-caused factors.","They are the main food source for all free-ranging cats."],"answer":"C","summary":"推断题。第五段指出无脊椎动物因城市化、栖息地破坏等全球性下降。","analysis":"原文 \\"Many invertebrates are in decline globally due to urbanization, habitat destruction, increases in both light and pesticide pollution, and climate change\\"，可见人为因素导致其全球性下降，选 C。A 与 \\"more than 70%\\" 相反；B 与 \\"important pollinators, predators and herbivores\\" 相反；D 过于绝对，原文只说 7% 的物种是无脊椎。","locationSentence":"Many invertebrates are in decline globally due to urbanization, habitat destruction, increases in both light and pesticide pollution, and climate change."},{"id":"q-002-3","articleId":"art-002","type":"reading","stem":"The word \\"invasive\\" in Paragraph 3 is closest in meaning to ______.","options":["native","harmless","spreading aggressively into new areas","endangered"],"answer":"C","summary":"词义题。invasive 意为\\"入侵的\\"，指扩散到新环境并造成影响的物种。","analysis":"原文称家猫 \\"are an invasive species, which live in every ecosystem of the world except the continent of Antarctica\\"，即扩散到几乎所有生态系统。invasive 与 \\"spreading aggressively into new areas\\" 同义，选 C。A native（本土的）相反；B harmless（无害的）与入侵性矛盾；D endangered（濒危的）无关。","locationSentence":"When domesticated cats – Felis catus – live freely in the wild or are allowed to hunt outside the homes where their owners live, they are an invasive species, which live in every ecosystem of the world except the continent of Antarctica."},{"id":"q-002-4","articleId":"art-002","type":"reading","stem":"What is the authors' attitude towards the effect of cats on invertebrate populations?","options":["Certain that cats are the main cause of decline.","Cautious, noting the evidence is still limited.","Indifferent, as the topic is unimportant.","Confident that cats have no effect at all."],"answer":"B","summary":"态度题。作者明确表示尚未找到正式研究评估猫对无脊椎种群的影响，态度谨慎。","analysis":"原文 \\"We have not found formal research evaluating how cats' eating habits affect invertebrate populations\\"，并补充 \\"it's possible that cats could be significant contributors\\"，可见作者持谨慎、保留的态度，选 B。A 过于肯定；C 与作者多年研究矛盾；D 与原文 \\"possible\\" 相悖。","locationSentence":"We have not found formal research evaluating how cats' eating habits affect invertebrate populations."},{"id":"q-002-5","articleId":"art-002","type":"reading","stem":"Which of the following is NOT mentioned as a tool or method the authors used in their research?","options":["Google Scholar","Web of Science","Molecular DNA analysis of cat stomachs","Field observation of live cats hunting"],"answer":"D","summary":"是非题。文章提到 Google Scholar、Web of Science 和 DNA 分析，未提及对活体猫捕食的野外观察。","analysis":"原文第二段提到搜索 Google Scholar 和 Web of Science；末段提到 molecular technologies 分析猫胃和粪便中的 DNA。但全文未提及作者直接在野外观察活猫捕食，故选 D。题干问 NOT mentioned。","locationSentence":"However, molecular technologies can identify species using trace amounts of DNA left in the environment by animals."},{"id":"q-002-6","articleId":"art-002","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage reports on a large-scale review of what free-ranging cats eat, revealing that besides birds and mammals, cats also consume a surprising variety of insects and other invertebrates, including some endangered species. The authors note that while the full impact of cats on invertebrate populations remains uncertain, emerging DNA-based methods may help clarify the ecological consequences. The findings suggest cats are an even greater threat to biodiversity than previously assumed.","summary":"主旨概括题。文章核心是流浪猫食性研究的发现、影响与未来方法。","analysis":"参考范文涵盖：① 研究发现（猫吃大量无脊椎动物，含濒危种）；② 影响的不确定性及 DNA 新方法；③ 结论性判断（对生物多样性的威胁超出预期）。概括时应平衡呈现发现与方法展望。","locationSentence":"Overall, we identified 533 unique publications – books, journal articles, theses and agency reports – that reported specific animal species consumed by cats."},{"id":"q-003-1","articleId":"art-003","type":"reading","stem":"According to the passage, what was a primary reason for the US$23 billion in customer price increases in the PJM market?","options":["Rising fuel costs for power plants.","Expected power demand from data centers.","Upgrades to residential power lines.","A shortage of utility company staff."],"answer":"B","summary":"细节题。第二段指出数据中心预期用电需求是 230 亿美元涨价的主因。","analysis":"原文 \\"expected power demand from data centers was a primary reason for US$23 billion in customer price increases\\"，选 B。A、C、D 原文均未作为主因提及。","locationSentence":"a recent report by the organization that monitors the PJM market... concluded that expected power demand from data centers was a primary reason for US$23 billion in customer price increases that will last until at least the end of 2028."},{"id":"q-003-2","articleId":"art-003","type":"reading","stem":"What is the \\"loophole\\" that data centers may exploit in the pricing system?","options":["They can avoid paying any electricity bills.","They can reduce usage during peak periods to avoid coincident peak demand charges.","They can build their own substations for free.","They can negotiate lower rates directly with homeowners."],"answer":"B","summary":"推断题。数据中心可在系统负荷峰值时段降低用电，从而规避同期峰值需求分摊的成本。","analysis":"原文 \\"data centers may be able to learn to predict when system loads will peak and consume little to no power in just the right period to avoid contributing to peak loads\\"，选 B。A、C、D 均无原文依据。","locationSentence":"Their flexibility means data centers may be able to learn to predict when system loads will peak and consume little to no power in just the right period to avoid contributing to peak loads, as has happened with cryptocurrency-mining operations in Texas."},{"id":"q-003-3","articleId":"art-003","type":"reading","stem":"The word \\"obsolete\\" in the last section is closest in meaning to ______.","options":["modern","profitable","outdated","expensive"],"answer":"C","summary":"词义题。obsolete 意为\\"淘汰的、过时的\\"，与 outdated 同义。","analysis":"原文 \\"Technology may even change, making some data centers obsolete after a year or two of operations\\"，即技术变化使数据中心很快过时淘汰。obsolete 与 outdated 同义，选 C。A modern（现代的）相反；B profitable（盈利的）、D expensive（昂贵的）无关。","locationSentence":"Technology may even change, making some data centers obsolete after a year or two of operations."},{"id":"q-003-4","articleId":"art-003","type":"reading","stem":"What is the author's main concern about residential customers in rate-setting proceedings?","options":["They pay too little compared to data centers.","They may lack effective representation when costs are allocated.","They refuse to participate in public hearings.","They prefer to let data centers pay all costs."],"answer":"B","summary":"主旨题。作者担忧普通住户在成本分摊环节缺乏有效代言。","analysis":"原文 \\"This lack of representation in this aspect of rate-setting for average households may lead to situations where the data centers' advocates argue for minimal costs to be allocated to them – but nobody advocates on behalf of residents\\"，选 B。A、C、D 原文均未提及。","locationSentence":"This lack of representation in this aspect of rate-setting for average households may lead to situations where the data centers' advocates argue for minimal costs to be allocated to them – but nobody advocates on behalf of residents to examine or refute that argument."},{"id":"q-003-5","articleId":"art-003","type":"reading","stem":"Which of the following is NOT mentioned as a risk for residential customers?","options":["Some proposed data centers may never be built.","Data centers may use less energy than projected.","Technology may make data centers obsolete quickly.","Residential customers will stop paying electricity bills."],"answer":"D","summary":"是非题。文章提到数据中心可能不建、用能低于预期、被技术淘汰，未提及居民停止缴费。","analysis":"末段列出三种风险：① not every proposed data center will get built；② some may use less energy than originally projected；③ technology may make some data centers obsolete。D \\"居民停止缴费\\"原文未提及，故选 D。题干问 NOT mentioned。","locationSentence":"But not every proposed data center will get built, and some may use less energy than originally projected. Technology may even change, making some data centers obsolete after a year or two of operations."},{"id":"q-003-6","articleId":"art-003","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage explains how the soaring electricity demand of data centers is pushing up costs for ordinary ratepayers, and why allocating those costs fairly is far from straightforward. The author highlights a structural loophole — data centers can fine-tune usage to dodge coincident peak demand charges — and warns that residential customers often lack effective representation in utility rate-setting proceedings. The article closes by urging consumers to take part in public hearings to protect their own interests.","summary":"主旨概括题。文章核心是数据中心用电成本分摊的复杂性、漏洞与居民代言缺失。","analysis":"参考范文涵盖三层：① 数据中心推高电费、成本分摊复杂；② 同期峰值需求漏洞；③ 居民缺乏代言，呼吁参与听证。概括时应点出\\"问题—机制—呼吁\\"的逻辑线。","locationSentence":"Consumers need to be aware of the importance of cost allocation and how it affects their electricity rates."},{"id":"q-004-1","articleId":"art-004","type":"reading","stem":"According to the passage, what defined everyday life for American colonists in 1776?","options":["Access to modern medicine and clean water.","The everyday diminishment of vitality, mobility and equanimity.","A complete absence of any illness.","A diet rich in fresh fruits and vegetables."],"answer":"B","summary":"细节题。第二段指出活力、行动力和心境的日常性衰减定义了 1776 年的生活。","analysis":"原文 \\"But the everyday diminishment of vitality, mobility and equanimity defined life in 1776\\"，选 B。A 与原文相反（当时无现代医学）；C 与 \\"Illness was pervasive\\" 矛盾；D 与后文 \\"diets containing few vegetables and fruits\\" 相反。","locationSentence":"But the everyday diminishment of vitality, mobility and equanimity defined life in 1776. Illness was pervasive."},{"id":"q-004-2","articleId":"art-004","type":"reading","stem":"What does the author suggest about the relationship between humans and animals in 1776?","options":["Humans and animals lived entirely separate lives.","The same medical instruments were used on both humans and animals.","Animals were never treated by medical practitioners.","Humans considered animals completely unrelated to themselves."],"answer":"B","summary":"推断题。第三部分指出同一把手术刀或骨锯既用于人也用于牲畜。","analysis":"原文 \\"The same scalpel or bone saw that cut a human also cleft sheep, horses, pigs and other animals in distress\\"，可见人与动物共用医疗器械，选 B。A 与 \\"people lived closely with their animals\\" 相反；C 与原文矛盾；D 与 \\"close affinity of humans with other animals\\" 相反。","locationSentence":"The same scalpel or bone saw that cut a human also cleft sheep, horses, pigs and other animals in distress."},{"id":"q-004-3","articleId":"art-004","type":"reading","stem":"The word \\"inscrutable\\" in the last section is closest in meaning to ______.","options":["easy to understand","impossible to comprehend","widely accepted","carefully recorded"],"answer":"B","summary":"词义题。inscrutable 意为\\"难以理解的、不可捉摸的\\"，与 impossible to comprehend 同义。","analysis":"原文 \\"Bodily experiences that made sense in 1776 are often inscrutable to people today\\"，即当年合理的身体体验对今人而言难以理解。inscrutable 与 impossible to comprehend 同义，选 B。A easy to understand 相反；C、D 无关。","locationSentence":"Bodily experiences that made sense in 1776 are often inscrutable to people today."},{"id":"q-004-4","articleId":"art-004","type":"reading","stem":"What is the author's attitude towards retrospective diagnosis of historical ailments?","options":["Fully confident in its accuracy.","Skeptical, calling it \\"always flawed.\\"","Unaware of the concept.","Certain that modern labels perfectly match past conditions."],"answer":"B","summary":"态度题。作者明确表示回顾性诊断\\"总是存在缺陷\\"。","analysis":"原文 \\"Retrospective diagnosis is always flawed but the Revolutionary generation experienced ailments that sound similar to...\\"，作者先承认其局限再继续讨论，可见持审慎怀疑态度，选 B。A、D 与 \\"always flawed\\" 矛盾；C 与作者整段讨论矛盾。","locationSentence":"Retrospective diagnosis is always flawed but the Revolutionary generation experienced ailments that sound similar to diabetes, arthritis, cancer, anemia, rabies, the common cold and tuberculosis."},{"id":"q-004-5","articleId":"art-004","type":"reading","stem":"Which of the following is NOT mentioned as a common health problem among colonists?","options":["Scurvy","Lice and bed bugs","Vitamin C overdose","Dyspepsia and indigestion"],"answer":"C","summary":"是非题。文章提到坏血病、虱子臭虫、消化不良，未提及维生素 C 过量。","analysis":"原文提到 scurvy（由缺乏维生素 C 引起）、\\"Lice abounded. Bed bugs interrupted sleep\\"、\\"Spoiled food meant dyspepsia\\"。C \\"维生素 C 过量\\"与原文相反（当时是缺乏），且未提及，故选 C。题干问 NOT mentioned。","locationSentence":"Low-level scurvy, caused by lack of vitamin C, was common, thanks to diets containing few vegetables and fruits."},{"id":"q-004-6","articleId":"art-004","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage reconstructs the bodily experience of American colonists in 1776 through the medical instruments they left behind, arguing that chronic discomfort, illness and a thin boundary between humans and animals defined everyday life. Drawing on artifacts such as fleams, tooth keys and trocars, the author shows how colonists endured afflictions — from scurvy to infected wounds — with limited medical knowledge. The article concludes that understanding these material objects is essential to grasping how earlier generations pushed through bodily distraction to produce enduring political ideals.","summary":"主旨概括题。文章核心是通过医疗器械重构 1776 年殖民者的身体体验与日常生活苦难。","analysis":"参考范文覆盖三层：① 主题（用器械重构身体体验）；② 具体例证（放血器、拔牙钥、套管针及对应病痛）；③ 结论（器物理解是理解历史的关键）。概括应体现\\"器物—体验—意义\\"的逻辑链。","locationSentence":"But knowing their material world through medical objects of their time allows us to visit and appreciate how they managed to cut through distractions of the body and bequeath to us those groundbreaking, enduring self-evident truths."},{"id":"q-005-1","articleId":"art-005","type":"reading","stem":"According to the passage, what does the new federal rule change announced July 10, 2026 remove from the Endangered Species Act’s interpretation?","options":["Protection against the direct killing of species.","Protection against habitat destruction.","The official list of endangered species.","Funding for national wildlife refuges."],"answer":"B","summary":"细节题。第三段指出新规保留了禁止直接猎杀的部分，但取消了栖息地破坏的保护。","analysis":"原文写道 “A new federal rule change, announced July 10, 2026, keeps the first part – protecting against the direct killing of the species – but removes habitat destruction”，即新规取消了栖息地破坏方面的保护，选 B。A 与 “keeps the first part” 相反；C、D 原文均未提及。","locationSentence":"A new federal rule change, announced July 10, 2026, keeps the first part – protecting against the direct killing of the species – but removes habitat destruction."},{"id":"q-005-2","articleId":"art-005","type":"reading","stem":"According to the 2019 study cited in the passage, what percentage of species were listed as endangered primarily because of habitat loss and degradation?","options":["17%","50%","81%","99%"],"answer":"C","summary":"细节题。文章明确指出有高达 81% 的物种因栖息地丧失和退化而被列入濒危名单。","analysis":"原文 “In contrast, a staggering 81% were listed because of habitat loss and degradation”，选 C。17% 是主要因直接猎杀而被列入的比例；99% 是濒危物种法拯救物种免于灭绝的比例；50% 原文未提及。","locationSentence":"In contrast, a staggering 81% were listed because of habitat loss and degradation."},{"id":"q-005-3","articleId":"art-005","type":"reading","stem":"The word “unravels” in “This narrowed definition unravels the most significant protections” is closest in meaning to ______.","options":["strengthens","dismantles","clarifies","preserves"],"answer":"B","summary":"词义题。结合语境，unravels 意为“瓦解、拆解”，与 dismantles 同义。","analysis":"原文称缩小定义后 “unravels the most significant protections granted by the Endangered Species Act”，即瓦解了该法赋予的最重要保护。unravel 与 dismantle（拆除、瓦解）同义，选 B。A strengthens（加强）、C clarifies（澄清）、D preserves（保留）均与上下文相悖。","locationSentence":"This narrowed definition unravels the most significant protections granted by the Endangered Species Act."},{"id":"q-005-4","articleId":"art-005","type":"reading","stem":"What can be inferred about the 1995 Supreme Court case Babbitt v. Sweet Home Chapter of Communities for a Great Oregon?","options":["It overturned the Endangered Species Act entirely.","It upheld the regulatory definition of “harm” that included habitat destruction.","It was decided after the 2026 rule change.","It banned all logging operations in the United States."],"answer":"B","summary":"推断题。文章指出最高法院裁定该定义合理，允许联邦机构继续使用，即维持了包含栖息地破坏的“harm”定义。","analysis":"原文 “However, the court ruled that the definition was reasonable and allowed federal agencies to continue using it”，可见最高法院支持了将栖息地破坏纳入 “harm” 的监管定义，选 B。A 与该法存续至今相悖；C 与 1995 这一时间相悖；D 原文未提及。","locationSentence":"However, the court ruled that the definition was reasonable and allowed federal agencies to continue using it."},{"id":"q-005-5","articleId":"art-005","type":"reading","stem":"Which of the following species is NOT mentioned as one primarily threatened by direct killing?","options":["Red wolf","American crocodile","Chinook salmon","Grizzly bear"],"answer":"C","summary":"是非题。红狼、美洲鳄、灰熊都被列为因直接猎杀而受威胁的物种，而奇努克鲑鱼是因栖息地丧失而受威胁的例子。","analysis":"原文 “That 17% includes iconic species such as the red wolf, American crocodile, Florida panther and grizzly bear” 列出因直接猎杀受威胁的物种；随后 “The Chinook salmon, island fox, southwestern willow flycatcher, desert tortoise and likely extinct ivory-billed woodpecker are just a few examples” 列出因栖息地丧失受威胁的物种。Chinook salmon 属于后者，不在直接猎杀名单中，故选 C。题干问 NOT mentioned。","locationSentence":"That 17% includes iconic species such as the red wolf, American crocodile, Florida panther and grizzly bear."},{"id":"q-005-6","articleId":"art-005","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage argues that the Trump administration’s redefinition of the word “harm” in the Endangered Species Act strips the law of its most vital protection — habitat preservation — even though habitat loss drives the vast majority of species endangerment. The authors warn that this quiet regulatory change contradicts both congressional intent and Supreme Court precedent, weakening the Act’s ability to save species from extinction. They conclude that protecting habitat remains the single most important factor in recovering endangered species.","summary":"主旨概括题。文章核心是重新定义“harm”一词如何削弱《濒危物种法》对栖息地的保护及其严重后果。","analysis":"参考范文覆盖三层：① 新规取消了栖息地破坏保护；② 该变化违背国会立法意图与最高法院先例；③ 栖息地保护是物种恢复的最关键因素。概括时应体现“政策变化—法律冲突—生态意义”的逻辑链，而非罗列细节。","locationSentence":"This regulatory rollback seeks to undermine the law’s greatest strength: protecting the habitats species need to survive."},{"id":"q-006-1","articleId":"art-006","type":"reading","stem":"According to the passage, when did the two federal judges issue their judgments blocking the Trump administration’s attempt?","options":["March 7, 2025","Oct. 31, 2025","Nov. 3, 2025","June 30, 2026"],"answer":"D","summary":"细节题。第一段明确指出两位联邦法官于 2026 年 6 月 30 日作出裁决。","analysis":"原文 “Both issued their judgments on June 30, 2026”，选 D。A 是特朗普签署行政命令的日期；B 是教育部发布新规的日期；C 是各州总检察长提起诉讼的日期，均与裁决日期不符。","locationSentence":"Both issued their judgments on June 30, 2026."},{"id":"q-006-2","articleId":"art-006","type":"reading","stem":"What did both judges find about the statute Congress passed regarding the Public Service Loan Forgiveness program?","options":["It was ambiguous about which employers qualified.","It was unambiguous, covering all nonprofits with 501(c)(3) tax-exempt status.","It explicitly excluded all charitable nonprofits.","It granted the Education Department unlimited authority to change eligibility."],"answer":"B","summary":"细节题。两位法官都认为国会通过的成文法明确规定所有具有 501(c)(3) 免税资格的非营利组织都符合条件。","analysis":"原文 “both judges found that the statute that Congress passed was unambiguous about which employers qualified for the program: all nonprofits with 501(c)(3) tax-exempt status”，选 B。A 与 “unambiguous” 相反；C 与 “all nonprofits” 相悖；D 与 “the Education Department has no authority to change the eligibility criteria” 矛盾。","locationSentence":"More than a year after Trump’s executive order, both judges found that the statute that Congress passed was unambiguous about which employers qualified for the program: all nonprofits with 501(c)(3) tax-exempt status."},{"id":"q-006-3","articleId":"art-006","type":"reading","stem":"The word “unambiguous” in the passage is closest in meaning to ______.","options":["vague","clear","contradictory","optional"],"answer":"B","summary":"词义题。结合语境，unambiguous 意为“明确的、清楚的”，与 clear 同义。","analysis":"原文称成文法 “was unambiguous about which employers qualified”，即对哪些雇主符合资格规定得很清楚。unambiguous 与 clear 同义，选 B。A vague（模糊的）相反；C contradictory（矛盾的）相反；D optional（可选择的）无关。","locationSentence":"More than a year after Trump’s executive order, both judges found that the statute that Congress passed was unambiguous about which employers qualified for the program: all nonprofits with 501(c)(3) tax-exempt status."},{"id":"q-006-4","articleId":"art-006","type":"reading","stem":"What can be inferred about Judge Joun’s ruling compared with Judge Ali’s?","options":["Joun’s ruling was narrower in scope.","Joun went further by holding the regulation facially unconstitutional.","Ali’s ruling sided with the Trump administration.","The two judges disagreed on the basic outcome of the case."],"answer":"B","summary":"推断题。文章指出 Joun 法官比 Ali 法官走得更远，认定该规例表面上违宪。","analysis":"原文 “Joun in Massachusetts went further than Ali in Washington” 且 “Joun held that the new regulation ‘is facially unconstitutional because it discriminates on the basis of viewpoint’”，可见 Joun 进一步裁定该规例违宪，选 B。A 与 “went further” 相反；C 与两位法官都否决新规相悖；D 与两位法官一致推翻新规的事实矛盾。","locationSentence":"Joun held that the new regulation “is facially unconstitutional because it discriminates on the basis of viewpoint.”"},{"id":"q-006-5","articleId":"art-006","type":"reading","stem":"Which of the following is NOT mentioned as an example Trump’s order gave of organizations that “harm society”?","options":["Aiding immigrants","Treating minors’ gender dysphoria","Advancing diversity, equity and inclusion goals","Operating for-profit banks"],"answer":"D","summary":"是非题。行政命令列举的例子包括援助移民、治疗未成年人性别焦虑、推进多元平等包容目标，未提及经营营利性银行。","analysis":"原文 “it named some examples: aiding immigrants, treating minors’ gender dysphoria, advancing diversity, equity and inclusion goals, and helping to organize left-wing protests”，A、B、C 均在列举之中；D “经营营利性银行”原文未提及，故选 D。题干问 NOT mentioned。","locationSentence":"The order does not name any of those nonprofits, but it named some examples: aiding immigrants, treating minors’ gender dysphoria, advancing diversity, equity and inclusion goals, and helping to organize left-wing protests."},{"id":"q-006-6","articleId":"art-006","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The passage explains that two federal judges blocked the Trump administration’s attempt to deny Public Service Loan Forgiveness to employees of nonprofits whose views opposed the administration’s agenda, ruling that the statute unambiguously covers all 501(c)(3) charities and that the Education Department exceeded its authority. The author argues the revised rule unconstitutionally discriminated based on viewpoint by blurring the line between illegal activity and protected political expression. The rulings reaffirm that the government cannot use the loan program to punish organisations for their political views, regardless of who holds office.","summary":"主旨概括题。文章核心是两位联邦法官否决特朗普政府试图基于政治立场剥夺特定非营利组织员工贷款减免资格的规例。","analysis":"参考范文覆盖三层：① 两名法官裁定成文法明确，教育部越权；② 该规例基于观点歧视，混淆了非法活动与受保护的政治表达；③ 裁决重申政府不得利用该程序惩罚异见组织。概括时应体现“裁决—理由—意义”的逻辑链。","locationSentence":"These rulings should give Americans of all political stripes more confidence that their rights will be respected, no matter who is in office."},{"id":"q-007-1","articleId":"art-007","type":"reading","stem":"Why were thousands of New England fishermen suddenly out of work in 1775?","options":["Their fishing ships had been captured by the British navy.","Parliament passed the Restraining Act of 1775, banning New Englanders from fishing on the Atlantic Ocean.","They voluntarily quit their jobs to join the French navy.","Overfishing had depleted the cod stocks in the North Atlantic."],"answer":"B","summary":"细节题。考查新英格兰渔民失业的原因。","analysis":"文章明确指出：“To punish rebels for their treason, Parliament passed the Restraining Act of 1775, banning New Englanders from fishing on the Atlantic Ocean.”（为了惩罚叛军的叛国行为，议会通过了1775年限制法案，禁止新英格兰人在大西洋捕鱼。）因此B选项正确。A选项错误，渔民并非因船只被英国海军俘获而失业；C选项错误，文章未提及法国海军；D选项错误，文章未提及过度捕捞，失业原因是英国的政治惩罚。","locationSentence":"To punish rebels for their treason, Parliament passed the Restraining Act of 1775, banning New Englanders from fishing on the Atlantic Ocean."},{"id":"q-007-2","articleId":"art-007","type":"reading","stem":"What was the name of the first fishing vessel that Washington converted into an armed ship?","options":["Unity","Nancy","Hannah","Broughton"],"answer":"C","summary":"细节题。考查华盛顿舰队中第一艘武装船只的名字。","analysis":"文章提到：“The first of these was Glover’s own fishing vessel and trade ship, Hannah.”（第一艘是Glover自己的渔船兼商船Hannah号。）因此C选项正确。A选项Unity是Hannah号启航两天后被俘获的英国船只；B选项Nancy是后来战争中被俘获的运输船，载有火枪和弹药；D选项Broughton在文中未作为船名出现。","locationSentence":"The first of these was Glover’s own fishing vessel and trade ship, Hannah."},{"id":"q-007-3","articleId":"art-007","type":"reading","stem":"What can be inferred about Washington’s attitude toward the fishermen in his forces from his 1776 response to the governor of Connecticut?","options":["He considered them untrained and unreliable in battle.","He believed they were essential to successfully opposing the enemy.","He was willing to transfer them to other naval expeditions.","He preferred to replace them with French sailors."],"answer":"B","summary":"推理题。考查华盛顿对渔民兵员的态度。","analysis":"文章引用华盛顿1776年拒绝康涅狄格州州长征调水兵的请求时说：“I must depend chiefly upon them for a successful opposition to the Enemy,” Washington explained.（华盛顿解释说：“我必须主要依靠他们来成功对抗敌人。”）这表明华盛顿认为渔民对作战至关重要，因此B选项正确。A选项与原文相反，文中称他们为“seasoned seafarers”（经验丰富的水手）；C选项错误，华盛顿明确表示不能将他们调走；D选项错误，文章明确说解决方案不来自法国船厂。","locationSentence":"“I must depend chiefly upon them for a successful opposition to the Enemy,” Washington explained."},{"id":"q-007-4","articleId":"art-007","type":"reading","stem":"According to the article, all of the following were captured by or associated with Washington’s fleet EXCEPT:","options":["The Unity, a sloop loaded with naval stores and lumber","The Nancy, transporting muskets and musket balls","A French warship built in a French shipyard","British supply ships arriving unescorted from Great Britain"],"answer":"C","summary":"排除题。考查华盛顿舰队的来源和俘获目标。","analysis":"文章明确指出华盛顿的解决方案不会来自法国船厂：“Washington’s solution wouldn’t come from a French shipyard or a congressional committee.” 因此C选项（一艘来自法国船厂的战舰）是文中未提及的，为本题答案。A选项Unity被Hannah号船员俘获；B选项Nancy是被俘获的英国运输船；D选项英国补给船是华盛顿注意到并拦截的目标——“he noticed supply ships arriving in droves from Great Britain – unescorted”。","locationSentence":"Washington’s solution wouldn’t come from a French shipyard or a congressional committee."},{"id":"q-007-5","articleId":"art-007","type":"reading","stem":"The phrase “punched above its weight” in the context of the article most nearly means:","options":["Physically attacked opponents who were larger in size","Achieved more success than would be expected given its size or strength","Lost battles despite having superior force","Relied on physical force rather than strategy"],"answer":"B","summary":"词汇语境题。考查习语“punched above its weight”的含义。","analysis":"文章上下文为：“This fleet of converted fishing boats punched above its weight: In the early years of the war they captured 55 British vessels.”（这支由渔船改装的舰队表现出超出其实力的成就：在战争初期他们俘获了55艘英国船只。）此处“punched above its weight”意为以小搏大、取得超出预期规模的成就，因此B选项正确。A选项误读为字面意义的“物理攻击”；C选项与原文意思相反，舰队是成功俘获而非失败；D选项偏离了语境，文章强调的是战绩而非手段。","locationSentence":"This fleet of converted fishing boats punched above its weight: In the early years of the war they captured 55 British vessels."},{"id":"q-007-6","articleId":"art-007","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"When the British Parliament banned New Englanders from fishing on the Atlantic in 1775, thousands of skilled and furious mariners lost their livelihoods and joined the American cause. George Washington converted their sturdy fishing schooners into armed vessels, creating what many historians consider America’s first navy, which intercepted British supply ships and captured vital war materials. These fishermen-turned-sailors disrupted British supply lines and helped keep the Revolution alive through its early years.","summary":"主旨题。要求用2-3句英文概括文章主旨。","analysis":"优秀的概括应涵盖以下要点：1）1775年英国《限制法案》导致新英格兰渔民失业并投身革命；2）华盛顿将渔船改装为武装船只，组建了美国第一支海军；3）这支渔民舰队俘获大量英国船只和物资，在革命初期维持了战局。文章的核心论点是“失业渔民拯救了美国革命”，概括应体现这一因果关系。","locationSentence":"Between August and October 1775, Washington outfitted a fleet of schooners at Congress’ expense to intercept British supply ships off the coast of New England."},{"id":"q-008-1","articleId":"art-008","type":"reading","stem":"When and where did the first formally recognized renaissance fair take place?","options":["In 1960 in Southern California","In May 1963 in Irwindale, California","In 1985 in Los Angeles, California","In spring 2026 in Chattanooga, Tennessee"],"answer":"B","summary":"细节题。考查首个正式文艺复兴集市的时间和地点。","analysis":"文章明确指出：“the first formally recognized fair took place in May 1963 in Irwindale, California.”（第一个被正式认可的集市于1963年5月在加州Irwindale举行。）因此B选项正确。A选项1960年代是文艺复兴集市作为反文化实验开始的时期，但首个正式集市在1963年；C选项1985年是文中图片说明提到的年份，不是首届集市时间；D选项2026年是Chattanooga Renaissance Faire的首季，不是首届文艺复兴集市。","locationSentence":"Although renaissance fairs and festivals recreate the atmosphere of centuries past, the first formally recognized fair took place in May 1963 in Irwindale, California."},{"id":"q-008-2","articleId":"art-008","type":"reading","stem":"According to the article, what was one of the original purposes of the Renaissance Pleasure Faire created by Phyllis Patterson?","options":["To generate profit through ticket sales and merchandise","To provide employment for artists blacklisted during the Red Scare","To recreate historically accurate medieval battles","To compete with European Renaissance festivals"],"answer":"B","summary":"细节题。考查Patterson创办文艺复兴集市的初衷。","analysis":"文章指出：“It also served as a source of employment for those who had been pushed out of their careers in the film and entertainment industries after being blacklisted or graylisted as suspected communists.”（它还为那些因被怀疑为共产主义者而被列入黑名单或灰名单、从而被挤出影视娱乐行业的人提供了就业机会。）因此B选项正确。A选项错误，Patterson的初衷是反文化表达而非盈利；C选项错误，文章强调集市不追求历史准确性——“fidelity to the facts is an afterthought”；D选项错误，文章未提及与欧洲集市竞争。","locationSentence":"It also served as a source of employment for those who had been pushed out of their careers in the film and entertainment industries after being blacklisted or graylisted as suspected communists."},{"id":"q-008-3","articleId":"art-008","type":"reading","stem":"What can be inferred about the difference between renaissance fairs and Civil War reenactments?","options":["Renaissance fairs require more historically accurate costumes than reenactments.","Renaissance fairs prioritize historical accuracy above all else.","Renaissance fairs allow more creative freedom and blend multiple historical periods.","Renaissance fairs are more strictly regulated than reenactments."],"answer":"C","summary":"推理题。考查文艺复兴集市与历史重演活动的区别。","analysis":"文章指出：“Unlike popular Civil War or World War II reenactments where historical accuracy is paramount, renaissance fairs instead invite people to take part in shared, often mythologized ideas about history through performance, costume and play.”（与重视历史准确性的内战或二战重演不同，文艺复兴集市邀请人们通过表演、服装和游戏参与共享的、往往神话化的历史观念。）后文还提到骑士代表不同时代的混合——“they represent a jumble of eras and place”。因此C选项正确。A、B选项与原文相反，文章明确说历史准确性在集市中是次要的；D选项错误，文章说“strict rules about adhering to a specific time period or setting rarely apply”，即集市规则宽松。","locationSentence":"Unlike popular Civil War or World War II reenactments where historical accuracy is paramount, renaissance fairs instead invite people to take part in shared, often mythologized ideas about history through performance, costume and play."},{"id":"q-008-4","articleId":"art-008","type":"reading","stem":"According to the article, all of the following indicate the commercialization of renaissance fairs EXCEPT:","options":["Tiered tickets, branded merchandise and multimillion dollar valuations","The court-ordered $60 million sale of the Texas Renaissance Festival","Volunteer “villagers” working only for free admission","Entry fees of US$38 at the Tennessee Renaissance Festival"],"answer":"C","summary":"排除题。考查文艺复兴集市商业化的表现。","analysis":"A选项（分级门票、品牌商品和数百万美元估值）、B选项（法庭命令的6000万美元出售）和D选项（38美元入场费）都是文章明确提及的商业化或大规模盈利表现。C选项“志愿者村民仅获得免费入场”反映的是工人剥削问题——工人不仅没有报酬，雨天关闭时也没有补偿——这是劳动权益问题，而非商业化本身的标志。原文：“Even volunteer ‘villagers’ work only for free admission, and both workers and attendees receive no compensation or refunds when the fair closes due to rain.”","locationSentence":"Even volunteer “villagers” work only for free admission, and both workers and attendees receive no compensation or refunds when the fair closes due to rain."},{"id":"q-008-5","articleId":"art-008","type":"reading","stem":"The word “fidelity” in “Here, fidelity to the facts is an afterthought” most nearly means:","options":["Romantic loyalty to a partner","Accuracy and faithfulness to original details","Commitment to profit margins","Devotion to community values"],"answer":"B","summary":"词汇语境题。考查“fidelity”在文中的含义。","analysis":"文章上下文为：“Here, fidelity to the facts is an afterthought; it actually might ruin the fun.”（在这里，对事实的忠实是次要考虑，实际上可能会破坏乐趣。）结合前文讨论集市不追求历史准确性——“historical accuracy is paramount”只适用于内战重演而非集市——此处“fidelity”意为对事实的准确和忠实，因此B选项正确。A选项误读为情感上的忠诚；C选项偏离语境，文章此处讨论的是历史准确性而非利润；D选项也不符合上下文，此处讨论的是事实而非社区价值。","locationSentence":"Here, fidelity to the facts is an afterthought; it actually might ruin the fun."},{"id":"q-008-6","articleId":"art-008","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"Renaissance fairs originated in 1960s California as a countercultural refuge for artists affected by Red Scare political repression, but have since grown into a thriving commercial industry with multimillion-dollar valuations and concerns about worker exploitation. Despite this commercialization, the authors conclude that the fairs remain fundamentally about community, offering visitors an immersive space of whimsy and shared creative play that deliberately blends fantasy, history and everyday life. The enduring appeal of renaissance fairs lies in their ability to provide comfort through simple narratives of good and evil in a complex modern world.","summary":"主旨题。要求用2-3句英文概括文章主旨。","analysis":"优秀的概括应涵盖以下要点：1）文艺复兴集市起源于1960年代加州反文化运动，最初为受政治迫害的艺术家提供创作庇护；2）如今已发展为价值数百万美元的商业产业，引发对商业化和工人剥削的担忧；3）作者认为集市本质上仍关乎社区归属和创造性游戏，为现代人提供简单善恶叙事的心理慰藉。文章的核心张力在于“反文化根基”与“商业化发展”之间的矛盾，以及作者最终认为社区精神仍然存续的结论。","locationSentence":"Despite the creeping influence of profit motives, we concluded that renaissance fairs have always been – and continue to be – mostly about community."},{"id":"q-009-1","articleId":"art-009","type":"reading","stem":"According to the passage, how did researchers at the University of Tsukuba obtain aerodynamic data on the World Cup ball?","options":["They watched game footage and tracked the ball's flight on the pitch.","They put a hole in the ball, mounted it on a rod with force sensors, and tested it in a wind tunnel.","They compared it directly with the Jabulani ball during real matches.","They asked goalkeepers to kick the ball and measured its speed."],"answer":"B","summary":"细节题。第三段说明筑波大学的同事在球上打孔、装在杆上、连接力传感器，然后放入风洞获取空气动力学数据。","analysis":"原文写道 \\"Colleagues of mine at the University of Tsukuba in Japan took the World Cup ball, put a little hole in it, stuck it on a rod, attached force sensors and then set it up in a wind tunnel to obtain all kinds of aerodynamic data\\"，选 B。A、C、D 均非原文所述方法。","locationSentence":"Colleagues of mine at the University of Tsukuba in Japan took the World Cup ball, put a little hole in it, stuck it on a rod, attached force sensors and then set it up in a wind tunnel to obtain all kinds of aerodynamic data."},{"id":"q-009-2","articleId":"art-009","type":"reading","stem":"What was the problem with the Jabulani ball used in the 2010 World Cup?","options":["Its drag coefficient was too low.","Its colors confused the goalkeepers.","Its airflow change occurred at a speed typical of free kicks and corner kicks, causing unpredictable movement.","It was too smooth and traveled too far."],"answer":"C","summary":"细节题。第四段指出 Jabulani 球的气流变化发生在任意球和角球的典型速度区间，导致飞行不可预测。","analysis":"原文写道 \\"this airflow change happened at a speed that was right in the middle of typical free kicks and corner kicks. That caused problems for goalkeepers, as it moved in the air unpredictably as a result\\"，选 C。A、B、D 原文均未作为 Jabulani 的问题提及。","locationSentence":"For the Jabulani ball used in the 2010 World Cup, for example, this airflow change happened at a speed that was right in the middle of typical free kicks and corner kicks. That caused problems for goalkeepers, as it moved in the air unpredictably as a result."},{"id":"q-009-3","articleId":"art-009","type":"reading","stem":"Why did many of England's kicks tend to go a little long during the England vs. Mexico game in Mexico City?","options":["The ball was defective and flew too fast.","The goalkeepers were confused by the ball's colors.","The players had not fully adjusted to the high elevation and lower air density.","The ball had a much smaller drag coefficient than usual."],"answer":"C","summary":"推断题。作者观察到英格兰队员未完全适应高海拔和低空气密度，导致传球偏长。","analysis":"原文写道 \\"The sense I got was they weren't quite adjusting for the higher elevation and lower air density\\"，可见传球偏长源于未适应高海拔与低空气密度，选 C。A、B、D 原文均未提及。","locationSentence":"The sense I got was they weren't quite adjusting for the higher elevation and lower air density."},{"id":"q-009-4","articleId":"art-009","type":"reading","stem":"What did the larger drag coefficient of Trionda imply, according to the lab tests?","options":["A smoother surface and longer flight distance.","A slightly rougher surface and a possible trade-off where the ball might fall short.","Better visibility for goalkeepers.","A lower critical speed for the airflow change."],"answer":"B","summary":"细节题。实验发现 Trionda 阻力系数略大，意味着表面略粗糙，可能存在球飞行距离偏短的权衡。","analysis":"原文写道 \\"Trionda's drag coefficient was slightly larger than that of its predecessors, which implied a slightly rougher surface. So there was a possible trade-off; it might fall a couple of meters short\\"，选 B。A 与 \\"rougher surface\\" 相反；C 未提及；D 是另一项发现（临界速度最低），与阻力系数无直接因果。","locationSentence":"But we also found that Trionda's drag coefficient was slightly larger than that of its predecessors, which implied a slightly rougher surface. So there was a possible trade-off; it might fall a couple of meters short."},{"id":"q-009-5","articleId":"art-009","type":"reading","stem":"The author suggests several possible reasons why goalkeepers might be struggling with the ball. Which of the following is NOT one of the reasons he offers?","options":["The ball may be moving in erratic ways.","The color scheme may be flummoxing them on the pitch.","The reds, blues and greens twirling before their eyes may be confusing them.","The ball's drag coefficient being dramatically smaller than in previous balls."],"answer":"D","summary":"是非题。作者提到球可能飘忽不定、配色令人困惑、旋转色块使人迷惑，但从未将阻力系数大幅变小列为守门员困扰的原因。","analysis":"原文中作者想问守门员 \\"Do you think it's moving in erratic ways? Or is it something to do with the color scheme that's flummoxing you on the pitch?\\"（对应 A、B），又提出 \\"the reds, blues and greens twirling in front of the goalkeepers' eyes are confusing them\\"（对应 C）。而关于阻力系数，作者实际说的是 \\"slightly larger\\"（略大），并非 \\"dramatically smaller\\"，更未将其列为抱怨缘由，故选 D。题干问 NOT。","locationSentence":"As the World Cup has progressed, I've been watching the ball come in toward the goalkeepers, and it could be that the reds, blues and greens twirling in front of the goalkeepers' eyes are confusing them."},{"id":"q-009-6","articleId":"art-009","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"The article examines whether goalkeepers' complaints about the 2026 World Cup ball, Trionda, are justified. Drawing on wind tunnel tests and trajectory modeling, physicist John Eric Goff explains that the ball behaves largely as predicted, with stable flight at most game speeds and only minor effects from elevation and surface roughness. He concludes that the ball has performed fine and that goalkeepers' difficulties may stem more from unfamiliarity or visual distraction than from genuine flaws in the ball.","summary":"主旨概括题。文章通过物理学家的解读，分析世界杯用球 Trionda 的空气动力学表现，认为其飞行稳定、基本符合预测。","analysis":"好的摘要应涵盖三点：① 核心议题——回应守门员对世界杯用球的抱怨；② 研究方法与发现——风洞实验与轨迹建模表明 Trionda 临界速度低、飞行稳定，海拔与表面粗糙度仅带来轻微影响；③ 总体结论——球表现良好，抱怨未必有充分依据。","locationSentence":"As far as I can tell, the ball appears to be flying in ways that not only we predicted but that don't look completely out of touch with what players would have seen with other balls."},{"id":"q-010-1","articleId":"art-010","type":"reading","stem":"According to the College Board, approximately what percentage of high school students surveyed said they had used generative AI for schoolwork in 2025?","options":["47%","65%","74%","84%"],"answer":"D","summary":"细节题。第三段指出约 84% 的受访高中生在 2025 年使用过生成式 AI 完成学业。","analysis":"原文写道 \\"An estimated 84% of high school students surveyed said they had used generative artificial intelligence for schoolwork in 2025\\"，选 D。47% 是威斯康星样本中认为评估困难的比例；65% 是威斯康星担忧学术不端的比例；74% 是全国层面担忧学术不端的比例，均非高中生使用率。","locationSentence":"An estimated 84% of high school students surveyed said they had used generative artificial intelligence for schoolwork in 2025, according to College Board, a nonprofit that administers the SAT and AP exams."},{"id":"q-010-2","articleId":"art-010","type":"reading","stem":"In the Wisconsin sample, what percentage of respondents who answered the relevant question said that \\"difficulty in assessing student learning when AI is used\\" is a concern?","options":["29%","47%","53%","65%"],"answer":"B","summary":"细节题。威斯康星样本中 47% 的受访者认为\\"使用 AI 时难以评估学生学习\\"是一个隐忧。","analysis":"原文明确指出威斯康星样本中 47% 的受访者认为\\"难以在使用 AI 时评估学生学习\\"是一个隐忧，选 B。29% 是认为学生 AI 依赖增加的威斯康星受访者比例；53% 是全国样本中认为评估困难的比例；65% 是威斯康星担忧学术不端的比例。","locationSentence":"In the Wisconsin sample, 47% of respondents who answered this question said that \\"difficulty in assessing student learning when AI is used\\" is a concern."},{"id":"q-010-3","articleId":"art-010","type":"reading","stem":"Why does the author argue that finished assignments are becoming harder to interpret?","options":["Because students no longer complete their homework.","Because AI can produce organized, polished work, making it hard to tell whether students actually understood the material.","Because teachers have stopped assigning writing tasks.","Because parents are helping students more than before."],"answer":"B","summary":"推断题。作者指出 AI 能生成条理清晰、精加工的作业，使教师难以判断学生是否真正理解。","analysis":"原文写道 \\"this kind of homework prompt may produce a result that appears organized, accurate and polished. But it is becoming harder for teachers to understand whether students actually understood the story, identified the theme and articulated it independently, or whether students simply entered a prompt into an AI tool\\"，选 B。A、C 与原文相悖；D 是作者列举的传统问题之一，并非 AI 带来的新困难。","locationSentence":"Now, this kind of homework prompt may produce a result that appears organized, accurate and polished. But it is becoming harder for teachers to understand whether students actually understood the story, identified the theme and articulated it independently, or whether students simply entered a prompt into an AI tool."},{"id":"q-010-4","articleId":"art-010","type":"reading","stem":"What did one study of 14 AI-detection tools find about their accuracy?","options":["They were highly accurate, with less than 5% error rates.","They had false-positive rates as high as 50% and false-negative rates as high as 100%.","They correctly identified all AI-generated text.","They worked perfectly on nonnative English writing."],"answer":"B","summary":"细节题。一项针对 14 种 AI 检测工具的研究发现，误报率高达 50%，漏报率高达 100%。","analysis":"原文写道 \\"One study of 14 AI-detection tools found false-positive rates as high as 50% and false-negative rates as high as 100%, depending on the tool\\"，选 B。A、C 与高错误率相悖；D 与原文相反——检测器反而把非母语英语写作误判为 AI 生成的平均率高达 61.3%。","locationSentence":"One study of 14 AI-detection tools found false-positive rates as high as 50% and false-negative rates as high as 100%, depending on the tool."},{"id":"q-010-5","articleId":"art-010","type":"reading","stem":"What is the author's main argument about AI in education?","options":["Schools should completely ban AI use in all assignments.","The deeper issue is not just cheating, but how to preserve meaningful evidence of student learning.","AI-detection tools are the best solution to academic dishonesty.","Students who use AI should be expelled."],"answer":"B","summary":"主旨题。作者认为 AI 作弊固然值得关注，但更深层的问题是如何保留学生学习的意义性证据。","analysis":"原文写道 \\"Those concerns point to a practical challenge schools now face: how to preserve meaningful evidence of learning when AI can produce polished academic work\\"，可见作者主张核心在于保留学习证据，选 B。A 与作者\\"不应放弃写作作业\\"的观点相悖；C 与作者指出检测工具不可靠相悖；D 原文未提及。","locationSentence":"Those concerns point to a practical challenge schools now face: how to preserve meaningful evidence of learning when AI can produce polished academic work."},{"id":"q-010-6","articleId":"art-010","type":"summary","stem":"In 2-3 English sentences, summarise the main idea of the passage.","answer":"Based on a survey of K–12 educators, the author argues that while cheating with AI is a real concern, the deeper issue is the difficulty of assessing what students actually understand when AI can generate polished academic work instantly. Because AI-detection tools are unreliable, educators should redesign assignments to produce meaningful evidence of learning rather than simply trying to catch every misuse.","summary":"主旨概括题。作者基于调查指出，AI 作弊之外更深层的问题是难以评估学生真实理解，建议通过作业设计保留学习证据。","analysis":"好的摘要应涵盖：① 研究背景与方法——作者调查了威斯康星州及全国共 400 余名 K–12 教育工作者；② 核心发现——除作弊外，教师更担心无法评估学生真实理解；③ 作者主张——检测工具不可靠，应通过作业设计（如口述、当堂写作、过程展示）保留学习证据。","locationSentence":"The goal is to design learning tasks where teachers can still answer the question that matters most: What does this student actually understand?"}]`),iS=sS;function oS(t){return iS.filter(r=>r.articleId===t)}const N2="neccs-progress";function Su(){try{const t=localStorage.getItem(N2);return t?JSON.parse(t):[]}catch{return[]}}function aS(t){localStorage.setItem(N2,JSON.stringify(t))}function lS(t){const r=Su(),s={...t,id:`p_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`,completedAt:new Date().toISOString()};return r.push(s),aS(r),s}function B2(t){return Su().filter(r=>r.userId===t).sort((r,s)=>s.completedAt.localeCompare(r.completedAt))}function cS(t){const r=B2(t);if(r.length===0)return{totalPractice:0,avgAccuracy:0,completedArticles:0};const s=r.reduce((l,u)=>l+u.accuracy,0)/r.length,o=new Set(r.map(l=>l.articleId)).size;return{totalPractice:r.length,avgAccuracy:Math.round(s),completedArticles:o}}function uS(t){const r=new Set(Su().filter(s=>s.userId===t).map(s=>s.articleId));return Array.from(r)}const I2=Fc((t,r)=>({mode:"study",currentArticle:null,questions:[],answers:{},submitted:!1,vocabHighlightOn:!0,startTime:0,lastProgress:null,setMode:s=>t({mode:s}),startPractice:s=>{const o=oS(s.id);t({currentArticle:s,questions:o,answers:{},submitted:!1,vocabHighlightOn:!0,startTime:Date.now(),lastProgress:null})},setAnswer:(s,o)=>t(l=>({answers:{...l.answers,[s]:o}})),submit:()=>{const s=r();if(!s.currentArticle)return;const o=$r.getState().user;if(!o)return;const l=s.questions.filter(g=>g.type==="reading");let u=0;for(const g of l)s.answers[g.id]===g.answer&&u++;const d=l.length,p=d>0?Math.round(u/d*100):0,f=Math.round((Date.now()-s.startTime)/1e3),m=lS({userId:o.id,articleId:s.currentArticle.id,mode:s.mode,answers:s.answers,correctCount:u,totalCount:d,accuracy:p,totalTime:f});t({submitted:!0,lastProgress:m})},toggleVocabHighlight:()=>t(s=>({vocabHighlightOn:!s.vocabHighlightOn})),reset:()=>t({currentArticle:null,questions:[],answers:{},submitted:!1,startTime:0,lastProgress:null})})),dS=JSON.parse(`[{"id":"art-001","source":"The Conversation","title":"Why are our fingers different lengths?","author":"Steven Lautzenheiser, University of Tennessee","sourceUrl":"https://theconversation.com/why-are-our-fingers-different-lengths-282709","license":"CC BY-ND","content":"Why are our fingers different lengths? – Betty, age 8, California\\n\\nIt was one of those rushed mornings when I was already running late for work. In my hurry to grab my keys and head out the door, I knocked a few things off the counter, scattering loose coins onto the floor.\\n\\nAs I picked up the coins, I noticed I was using different movements to gather everything, and those movements seemed to depend on the different lengths of my fingers. My thumb and index finger pinched together to grab a dime, while my middle finger reached farther to pick up coins that had rolled under the edge of a cabinet. My ring finger and pinky curled inward to hold the coins I had already collected while I reached for more.\\n\\nThese motions really brought home how different fingers have their own job – and how each finger's varying length plays a big part in what it can do.\\n\\nPondering such things is part of my job description: As a biological anthropologist who studies the biomechanics of how people move, I often think about how movement, forces and structure work together to shape the human body.\\n\\nTeam of 5\\n\\nMy morning mishap showed that each of my five fingers seemed to have its own role, and the differences in finger length helped them do different jobs.\\n\\nThe middle finger is usually the longest. It acts as the hand's central axis, helping to balance and guide movements. Its length also allows it to work with the other fingers to grip objects securely.\\n\\nThe ring finger is typically slightly shorter than the middle finger, but the two work closely together, generating grip strength and stabilizing the hand. Whether lifting a heavy backpack, carrying grocery bags or holding a baseball bat, the middle and ring fingers help keep your grip steady and balanced.\\n\\nThe index finger is shorter, more flexible and can move on its own more easily than the two main gripping fingers – which makes it great for careful, controlled movements. It is the finger you use for tasks that require precision and accuracy, such as pointing, typing, pressing small buttons or writing with a pencil.\\n\\nThe pinky finger is usually the smallest of the five, but it doesn't need length to do its job of steadying the outer edge of the hand. It helps keep your hand stable when you hold things – especially objects that are bigger than your hand, such as a large water bottle, basketball or a heavy bag of groceries.\\n\\nThe thumb is unique. It's generally about three-quarters the length of the index finger. Rather than relying on length, the thumb's special joint lets it rotate and move across the palm, where it can touch the other fingers. Because it can move this way, it is called an opposable thumb. This makes the thumb one of the most versatile parts of the hand, enabling you to pinch and pick up small objects.\\n\\nWithout the thumb, many everyday tasks, such as holding utensils, opening containers and, yes, picking up coins, would be much harder.\\n\\nAn evolving tool\\n\\nEvolution shaped the human hand into a highly capable tool. Early humans relied on their hands for survival tasks, such as climbing, building, and making and using tools.\\n\\nThose with hands better suited for gripping and precision were more likely to thrive, gradually shaping the modern human hand.\\n\\nFor example, humans share our long middle finger with other apes, including chimpanzees and gorillas, suggesting that it has been important throughout our evolutionary history. This long history of adaptation explains why our hands are both strong and highly precise, capable of handling everything from heavy lifting to delicate tasks.\\n\\nA biological blueprint\\n\\nEvolution is only part of the story. Before birth, genes guide how the hands grow, acting like a biological blueprint during development.\\n\\nThese genes influence how quickly bones lengthen, how long each finger becomes, and how the joints and tendons are shaped. Small differences in how these genes work before birth can change how long each finger grows compared with the others.\\n\\nHormones also play an important role. Sex hormones, such as testosterone and estrogen, and other signals can influence how the bones of the fingers grow, shaping subtle differences in proportions before birth and into childhood and adolescence.\\n\\nHand development is shaped by both biology and environment. This is why families often share similar hand features, even though each person's hands and fingers are slightly different.\\n\\nAs we use our hands every day, we become better at tasks such as writing, throwing or playing an instrument. Over time, our hands grow stronger and more coordinated through practice.\\n\\nSo why are our fingers different lengths? There is no single answer. Evolution shaped the hand, with fingers that specialize in different tasks, while genes and hormones guide how those fingers develop.\\n\\nTogether, these forces produced a hand in which each finger has a different size, shape and role, helping us perform everything from powerful grips to delicate movements.","vocabulary":[{"id":"v01","word":"biomechanics","phonetic":"/ˌbaɪəʊməˈkænɪks/","level":"key","meanings":["n. 生物力学；生物力学（研究生物体运动的学科）"],"examples":[{"en":"She studies the biomechanics of human movement.","zh":"她研究人体运动的生物力学。"}]},{"id":"v02","word":"anthropologist","phonetic":"/ˌænθrəˈpɒlədʒɪst/","level":"key","meanings":["n. 人类学家"],"examples":[{"en":"The anthropologist spent years living with the tribe.","zh":"这位人类学家与该部落共同生活了多年。"}]},{"id":"v03","word":"precision","phonetic":"/prɪˈsɪʒn/","level":"key","meanings":["n. 精确；精准；严密"],"examples":[{"en":"The surgeon worked with great precision.","zh":"外科医生以极高的精确度进行手术。"}]},{"id":"v04","word":"versatile","phonetic":"/ˈvɜːsətaɪl/","level":"key","meanings":["adj. 多功能的；多才多艺的；用途广泛的"],"examples":[{"en":"A pocket knife is a versatile tool.","zh":"折叠刀是一种多功能的工具。"}]},{"id":"a01","word":"opposable","phonetic":"/əˈpəʊzəbl/","level":"advanced","meanings":["adj. 可相对的；可对握的（指拇指）"],"examples":[]},{"id":"a02","word":"axis","phonetic":"/ˈæksɪs/","level":"advanced","meanings":["n. 轴；轴线；中心线"],"examples":[]},{"id":"a03","word":"blueprint","phonetic":"/ˈbluːprɪnt/","level":"advanced","meanings":["n. 蓝图；模式；设计方案"],"examples":[]},{"id":"a04","word":"tendons","phonetic":"/ˈtendənz/","level":"advanced","meanings":["n. 肌腱（tendon 的复数）"],"examples":[]}],"highlights":[{"vocabId":"v01","level":"key","charStart":962,"charEnd":974},{"vocabId":"v02","level":"key","charStart":931,"charEnd":945},{"vocabId":"v03","level":"key","charStart":1984,"charEnd":1993},{"vocabId":"v04","level":"key","charStart":2721,"charEnd":2730},{"vocabId":"a01","level":"advanced","charStart":2667,"charEnd":2676},{"vocabId":"a02","level":"advanced","charStart":1325,"charEnd":1329},{"vocabId":"a03","level":"advanced","charStart":3605,"charEnd":3614},{"vocabId":"a04","level":"advanced","charStart":3858,"charEnd":3865}],"locationSentences":["It acts as the hand's central axis, helping to balance and guide movements.","Together, these forces produced a hand in which each finger has a different size, shape and role, helping us perform everything from powerful grips to delicate movements."],"publishedAt":"2026-07-01"},{"id":"art-002","source":"The Conversation","title":"Beyond birds and mice, free-ranging cats eat a surprising number of insects","author":"Christopher A. Lepczyk, Daniel Rubinoff and Jean E. Fantle-Lepczyk","sourceUrl":"https://theconversation.com/beyond-birds-and-mice-free-ranging-cats-eat-a-surprising-number-of-insects-285094","license":"CC BY-ND","content":"It's pretty commonly known, and not very startling, that free-ranging cats eat birds and small rodents. But the degree to which they eat insects might surprise you.\\n\\nWe are biologists who for many years have been trying to figure out what feral or outdoor-roaming pet cats eat outside.\\n\\nWhen domesticated cats – Felis catus – live freely in the wild or are allowed to hunt outside the homes where their owners live, they are an invasive species, which live in every ecosystem of the world except the continent of Antarctica. We wanted to know all of the species they eat – and to what degree free-ranging cats are eating endangered or threatened species.\\n\\nExamining reams of research\\n\\nOver the past two decades, we have evaluated hundreds of scientific findings, including searching through Google Scholar and Web of Science using the keywords \\"cat predation,\\" \\"feral cat,\\" \\"cat diet\\" and \\"Felis catus.\\" For each item we found, whether peer-reviewed or not, we evaluated whether it contained conclusive evidence of cat diet or predation. We also reviewed each one's reference section for additional unique articles or databases pertaining to cat diet and predation, and included those in our search.\\n\\nOverall, we identified 533 unique publications – books, journal articles, theses and agency reports – that reported specific animal species consumed by cats. Cats' plant-eating habits are occasionally, but haphazardly, noted in studies, so we did not include them in our analysis.\\n\\nOur initial work focused on an overall assessment of what free-ranging cats eat around the world. Published in 2023, this paper analyzed the 533 studies on cat diet or predation events published over more than a century and found that cats ate nearly 2,100 different species of animals, including invertebrates.\\n\\nOf those 2,100, the International Union for Conservation of Nature's Red List of Threatened Species listed 347 as \\"near threatened,\\" \\"vulnerable,\\" \\"endangered,\\" \\"critically endangered\\" or \\"extinct\\" in 2023. Some of the species went extinct during the many decades covered by the data.\\n\\nInsects and the like\\n\\nMost of the species cats ate were vertebrates – mostly birds, followed by mammals and reptiles. But the data also indicated that at least 7% of the species cats eat are insects and other invertebrates, particularly beetles, and less frequently crustaceans, arachnids, centipedes, snails and slugs, and millipedes.\\n\\nMany of the cat studies we reviewed did not report on how many individuals of a given species cats ate, so it was unclear what the total amount of insects was or how many calories cats are deriving from insects.\\n\\nInvertebrates make up more than 70% of all terrestrial animal species and are important pollinators, predators and herbivores in virtually every nonmarine ecosystem. Many invertebrates are in decline globally due to urbanization, habitat destruction, increases in both light and pesticide pollution, and climate change. So we dug deeper into the data to understand what invertebrates cats are eating.\\n\\nWhile a little more than one-third of all the studies we analyzed included invertebrates as part of cats' diet, most of those failed to identify specific species of invertebrates. But we were able to find identifications of 148 invertebrate species.\\n\\nOf those, two are considered endangered by the International Union for Conservation of Nature: the Aldabran grasshopper in Seychelles and the Tasmanian giant freshwater crayfish, which can grow up to 13 pounds (6 kilograms). Two others are considered vulnerable: an insect native to New Zealand that can be about the size of a mouse, and the common yabby, a freshwater crayfish native to southeastern Australia. One other, the Canary Islands horned beetle, is listed as \\"near threatened.\\"\\n\\nEffects on populations\\n\\nWe have not found formal research evaluating how cats' eating habits affect invertebrate populations. And for many species, they are likely not as significant a factor as wide-scale pesticide use.\\n\\nBut it's possible that cats could be significant contributors to the deaths of rare species or in specific locations.\\n\\nCats require a large amount of protein, as much as one-third of their daily diet, and invertebrates are good sources of protein.\\n\\nIn many places, invertebrates provide an easy source of food. Whether in an urban backyard or on a remote island, cats are unlikely to turn a blind eye to available prey. And some cats may find it entertaining to chase, catch and eat insects even if they don't need their nutrition.\\n\\nA challenge of researching this question is that many invertebrates are relatively small, which makes direct observation in the field harder and can require more analytical approaches in the lab. And they have soft bodies, without distinguishing characteristics that could be easily recognized in scat or stomach contents.\\n\\nHowever, molecular technologies can identify species using trace amounts of DNA left in the environment by animals. Promising new studies are beginning to identify what cats eat by analyzing the DNA found in their stomachs and scat. That research may help explore in even more detail what cats are eating in the outdoors, and how it's affecting various species and the environment as a whole.","vocabulary":[{"id":"v05","word":"invasive","phonetic":"/ɪnˈveɪsɪv/","level":"key","meanings":["adj. 入侵的；侵入的；扩散性的"],"examples":[{"en":"Invasive species can damage native ecosystems.","zh":"入侵物种会破坏本土生态系统。"}]},{"id":"v06","word":"invertebrates","phonetic":"/ɪnˈvɜːtɪbrəts/","level":"key","meanings":["n. 无脊椎动物（invertebrate 的复数）"],"examples":[{"en":"Insects, spiders and snails are all invertebrates.","zh":"昆虫、蜘蛛和蜗牛都是无脊椎动物。"}]},{"id":"v07","word":"terrestrial","phonetic":"/təˈrestriəl/","level":"key","meanings":["adj. 陆地的；陆生的；地球的"],"examples":[{"en":"Frogs return to water to breed but are otherwise terrestrial.","zh":"青蛙回到水中繁殖，但在其他时候是陆生的。"}]},{"id":"v08","word":"pollinators","phonetic":"/ˈpɒlɪneɪtəz/","level":"key","meanings":["n. 传粉者；授粉昆虫（pollinator 的复数）"],"examples":[{"en":"Bees are among the most important pollinators.","zh":"蜜蜂是最重要的传粉者之一。"}]},{"id":"a05","word":"feral","phonetic":"/ˈferəl/","level":"advanced","meanings":["adj. 野生的；逃逸野化的（指家畜）"],"examples":[]},{"id":"a06","word":"predation","phonetic":"/prɪˈdeɪʃn/","level":"advanced","meanings":["n. 捕食；掠夺"],"examples":[]},{"id":"a07","word":"crustaceans","phonetic":"/krʌˈsteɪʃnz/","level":"advanced","meanings":["n. 甲壳类动物（crustacean 的复数）"],"examples":[]},{"id":"a08","word":"molecular","phonetic":"/məˈlekjələ(r)/","level":"advanced","meanings":["adj. 分子的"],"examples":[]}],"highlights":[{"vocabId":"v05","level":"key","charStart":428,"charEnd":436},{"vocabId":"v06","level":"key","charStart":1780,"charEnd":1793},{"vocabId":"v07","level":"key","charStart":2675,"charEnd":2686},{"vocabId":"v08","level":"key","charStart":2720,"charEnd":2731},{"vocabId":"a05","level":"advanced","charStart":239,"charEnd":244},{"vocabId":"a06","level":"advanced","charStart":849,"charEnd":858},{"vocabId":"a07","level":"advanced","charStart":2348,"charEnd":2359},{"vocabId":"a08","level":"advanced","charStart":4863,"charEnd":4872}],"locationSentences":["Overall, we identified 533 unique publications – books, journal articles, theses and agency reports – that reported specific animal species consumed by cats.","However, molecular technologies can identify species using trace amounts of DNA left in the environment by animals."],"publishedAt":"2026-07-01"},{"id":"art-003","source":"The Conversation","title":"It may be almost impossible to make data centers pay their 'fair share' of electricity costs","author":"Theodore J. Kury, University of Florida","sourceUrl":"https://theconversation.com/it-may-be-almost-impossible-to-make-data-centers-pay-their-fair-share-of-electricity-costs-283946","license":"CC BY-ND","content":"Many major tech companies have pledged to pay their fair share of the costs associated with generating and transmitting more electricity to serve large data centers. But ratepayers across the United States are worried about the potential costs they might have to bear. That's because it's not immediately clear how the cost of data centers' energy will be calculated. The effects of price increases are likely just beginning, and their full effects may not be felt for years.\\n\\nFor example, a recent report by the organization that monitors the PJM market, an area that encompasses all or part of 14 mid-Atlantic and Midwest states, concluded that expected power demand from data centers was a primary reason for US$23 billion in customer price increases that will last until at least the end of 2028.\\n\\nI have studied the programs states have launched to address the needs of these large electricity customers. Prices are set by state utility commissions, who determine which customers' rates will increase by how much to pay for new investments in electricity infrastructure. It's not simple.\\n\\nThe complexity of setting prices\\n\\nSetting a price for electricity is straightforward in principle but complicated in execution. Regulators identify the costs to provide service, allocate the costs to customers and design prices to recover those costs.\\n\\nFirst, regulators identify the costs that a utility company incurs to provide service. Regulators look at the value of the assets the utility company invests in, such as power plants, transmission lines and substations, as well as its day-to-day operating expenses, such as salaries, fuel, replacement parts and electricity it purchases from other sources. Then these costs are allocated to categories of customers, such as residential, commercial and industrial.\\n\\nIdeally, costs are allocated to the customers who cause them, but that can be complicated to determine. For example, imagine a data center is built in an area that lacks existing power lines and is located 50 yards from a nearby electric substation. It's clear that the data center should pay to run a 50-yard power line from the substation to the data center.\\n\\nBut what if the power company needs to upgrade the substation to handle the increased needs of the data center? Or secure additional sources of electricity? In these cases, the investments are part of the electricity grid that everyone uses. These costs will likely be shared among all customers.\\n\\nCost analysts review each line of a utility company's costs, often thousands of items, and determine how each cost will be allocated. Each decision incorporates one basic idea: What's your share?\\n\\nFor instance, if a group of customers uses 20% of the electricity delivered by the utility, they would be allocated 20% of the costs associated with energy delivery. Other cost items may be allocated based on the number of customers or how much electricity customers use at particular points in time, but the idea is the same.\\n\\nFinally, the analysts set prices that are designed to recover the costs allocated to each customer group. So, the costs that are allocated to you are directly reflected in the electricity prices that you pay.\\n\\nFlexibility and a potential loophole\\n\\nOne common criterion for figuring out how much a customer should pay is based on what is called \\"coincident peak demand\\" – the amount a customer group uses at the moment when all customers are collectively using the largest amount of electricity. Costs associated with overall peak usage are typically split proportionally – but this opens an opportunity for data centers to exploit the system.\\n\\nData centers often are able to fine-tune their electricity consumption, using more one minute and less another, in ways that residential users can't easily replicate. Computerized systems can automatically adjust the amount of work a data center is doing, while a homeowner would either have to race around shutting off appliances to meaningfully reduce the amount of power their home was using or invest in a device that does.\\n\\nTheir flexibility means data centers may be able to learn to predict when system loads will peak and consume little to no power in just the right period to avoid contributing to peak loads, as has happened with cryptocurrency-mining operations in Texas. So when regulators look at their usage to determine prices, data centers may be able to avoid paying any costs allocated through coincident peak demand, even if they use large amounts of electricity at other times.\\n\\nWho speaks for you?\\n\\nWhen utility regulators decide how costs should be allocated to each customer group, they solicit input from different groups. The utility company initially submits its own proposal for how it thinks costs should be allocated across its system.\\n\\nLarge industrial customer groups representing customers such as factories will also submit their own proposals for how to allocate costs and set rates. Retail customer groups representing large and small stores will submit theirs. And large data centers, with the resources to hire experts in cost allocation, will submit theirs as well. Some states have specific state-government agencies to do some of this work on behalf of particular commercial groups.\\n\\nRegulators don't always get a good sense of residential customers' voices, though. Every state except Georgia, Idaho and Louisiana has an office of the consumer advocate that represents customer interests in proceedings before the state utility regulator. But they are often charged with representing all customers in the state without bias, meaning they cannot advocate for outcomes that would impose costs on one group of customers in favor of another.\\n\\nSo while every state's consumer advocate is concerned with keeping the utility's costs as low as possible, they may be barred by law from adopting a position on how those costs should be allocated. This lack of representation in this aspect of rate-setting for average households may lead to situations where the data centers' advocates argue for minimal costs to be allocated to them – but nobody advocates on behalf of residents to examine or refute that argument.\\n\\nCitizens left holding the bag\\n\\nThere are other risks for residential customers, too. Utilities' investments in electricity infrastructure last for many years. But not every proposed data center will get built, and some may use less energy than originally projected. Technology may even change, making some data centers obsolete after a year or two of operations.\\n\\nIf those events happen, then any costs the utility company incurred to provide enough electricity will be spread among all the other customers.\\n\\nConsumers need to be aware of the importance of cost allocation and how it affects their electricity rates. I believe they should provide public comments to the regulators and speak during open hearings, as there may not be anyone else effectively advocating for their interests.","vocabulary":[{"id":"v09","word":"allocate","phonetic":"/ˈæləkeɪt/","level":"key","meanings":["v. 分配；分派；配置"],"examples":[{"en":"The committee allocated funds to each department.","zh":"委员会把资金分配给了各个部门。"}]},{"id":"v10","word":"infrastructure","phonetic":"/ˈɪnfrəstrʌktʃə(r)/","level":"key","meanings":["n. 基础设施；基础建设"],"examples":[{"en":"The country is investing heavily in infrastructure.","zh":"该国正在基础设施上投入巨资。"}]},{"id":"v11","word":"exploit","phonetic":"/ɪkˈsplɔɪt/","level":"key","meanings":["v. 利用（…为自己牟利）；利用；剥削"],"examples":[{"en":"Hackers exploit weaknesses in software.","zh":"黑客利用软件中的漏洞。"}]},{"id":"v12","word":"obsolete","phonetic":"/ˈɒbsəliːt/","level":"key","meanings":["adj. 废弃的；淘汰的；过时的"],"examples":[{"en":"New technology made the old machines obsolete.","zh":"新技术使旧机器遭到淘汰。"}]},{"id":"a09","word":"ratepayers","phonetic":"/ˈreɪtpeɪəz/","level":"advanced","meanings":["n. 纳费人；公用事业用户（ratepayer 的复数）"],"examples":[]},{"id":"a10","word":"substation","phonetic":"/ˈsʌbsteɪʃn/","level":"advanced","meanings":["n. 变电所；变电站"],"examples":[]},{"id":"a11","word":"loophole","phonetic":"/ˈluːphəʊl/","level":"advanced","meanings":["n. 漏洞；空子"],"examples":[]},{"id":"a12","word":"advocate","phonetic":"/ˈædvəkət/","level":"advanced","meanings":["n. 提倡者；辩护者 / v. 提倡；主张"],"examples":[]}],"highlights":[{"vocabId":"v09","level":"key","charStart":1272,"charEnd":1280},{"vocabId":"v10","level":"key","charStart":1060,"charEnd":1074},{"vocabId":"v11","level":"key","charStart":3620,"charEnd":3627},{"vocabId":"v12","level":"key","charStart":6508,"charEnd":6516},{"vocabId":"a09","level":"advanced","charStart":170,"charEnd":180},{"vocabId":"a10","level":"advanced","charStart":2050,"charEnd":2060},{"vocabId":"a11","level":"advanced","charStart":3235,"charEnd":3243},{"vocabId":"a12","level":"advanced","charStart":5426,"charEnd":5434}],"locationSentences":["Prices are set by state utility commissions, who determine which customers' rates will increase by how much to pay for new investments in electricity infrastructure.","This lack of representation in this aspect of rate-setting for average households may lead to situations where the data centers' advocates argue for minimal costs to be allocated to them – but nobody advocates on behalf of residents to examine or refute that argument."],"publishedAt":"2026-06-29"},{"id":"art-004","source":"The Conversation","title":"How did it feel to be an American colonist in 1776? Probably itchy, achy and slightly nauseated","author":"Katherine Ott, Smithsonian Institution","sourceUrl":"https://theconversation.com/how-did-it-feel-to-be-an-american-colonist-in-1776-probably-itchy-achy-and-slightly-nauseated-277153","license":"CC BY-ND","content":"Trade the tricorn hats, bonnets and homespun shirts for flip flops, sneakers and soccer jerseys, and the intrepid revolutionaries of 1776 would have looked a lot like the people of 2026. But their sense of embodiment and experience of health was markedly different from Americans today.\\n\\nIt goes deeper than not having aspirin, toothpaste or air conditioning, or not knowing about germs and penicillin. What was happening in their gut and mouth and on their skin was a world away from today. Chronic bodily states of indigestion, itchy skin, flatulence and slow-healing wounds were common and accommodated.\\n\\nThe American colonists were friends with affliction and shared their suffering socially, in writing and conversation. Ben Franklin, no stranger to suffering, wrote that \\"We are first mov'd by Pain, and the whole succeeding Course of our Lives is but one continu'd Series of Action with a view to be freed from it.\\"\\n\\nAcute illnesses like smallpox, typhoid, dysentery, yellow fever and diphtheria shadowed every ache and cough. But the everyday diminishment of vitality, mobility and equanimity defined life in 1776. Illness was pervasive. Rich or poor, free or enslaved, everyone was at risk.\\n\\nSince I was a child, I've been fascinated with bodies and what it felt like to be in someone else's skin. Now that I am a medical historian, I am lucky to be a Smithsonian curator with access to a large collection of medical instruments that figuratively put some flesh on the descriptions in old letters and medical journals about rheum, dyspepsia and other then-common conditions.\\n\\nAlthough embodied experience varied in different localities around the Atlantic Basin by climate, legal status, race and other vulnerabilities, the instruments used on tho
