se bodies capture general notions of physical well-being. A lot is missing from our connection to people in the past when all we use are words.\\n\\nHuman bodies were like animals'\\n\\nThe few medical instruments of the revolutionary era were heavy in the hand, awkward in use and imprecise to maneuver. They also tell a story of tolerance for pain and discomfort that is both disquieting and fascinating.\\n\\nThe design and materials of devices such as bone saws, fleams and scarificators – used to bleed veins and skin surfaces – illustrate the close affinity of humans with other animals. The same scalpel or bone saw that cut a human also cleft sheep, horses, pigs and other animals in distress.\\n\\nThe veil between species was thin. In 1776, people lived closely with their animals. They brought them into the house in bad weather or spent nights on straw in the shed with them – exclusive of genteel families, that is.\\n\\nCleanliness often took the form of river bathing, intended to invigorate rather than for sanitary purposes. In place of bathing, people changed clothes. The result was a menu of skin complaints – fungal, bacterial and otherwise.\\n\\nLice abounded. Bed bugs interrupted sleep. Scabies, ringworm, rashes from numerous unknown sources and unwashed skin was wrapped in clothing of stiff linen, smelly woolens or coarse calico. The byproduct was irritated, itchy skin with the discomfort of scratches, scabs and the stink that accompanied it.\\n\\nBecause infancy was risky, some colonial families and midwives followed tough love and tried to \\"harden\\" the child with cold water immersion and weaning. Many Indigenous women, on the other hand, nursed their infants until they were three or four years old. One in three colonist babies did not live to their second birthday.\\n\\nTools to purge ill humors\\n\\nIf a person did survive to adulthood, there was a good chance they would live to 55 or 60, barring accidents or childbirth complications.\\n\\nThere were few professional doctors, so healthcare came from midwives, bonesetters who also cut hair and removed cataracts, ministers, and community members, including apothecaries and plantation root doctors who were knowledgeable about plants. Although Pennsylvania Hospital in Philadelphia had been established as the first American hospital 25 years earlier, institutions for care were few at the time of the revolution.\\n\\nEuropean colonists commonly believed that the balance of humors – yellow and black biles, blood and phlegm – circulating through one's body was important for health. Belief in the efficacy of bloodletting was well-established and undisputed until well into the 1800s.\\n\\nDoctors, following accepted practice, would likely have bled or purged an ill person for humoral balance. Surgeons washed their bloody hands in contaminated water and dried them on their equally bloody apron or clothes, unaware of germs.\\n\\nWhen fluid accumulated from infection, a practitioner might use a small sharp spear nested in a metal tube, called a trocar and cannula. The pair were pushed into the body wherever swelling threatened a patient's health, or exploration of an inner cavity was warranted. Then the doctor removed the perforating trocar, with its triangular shaped head, and left the cannula in place, as a conduit for fluids going in or coming out.\\n\\nDesperate patients drank liquor to escape the procedure in this pre-anaesthesia era. Community care by family, friends and experienced elders was often more effective and safer than a trained physician.\\n\\nA mouthful of troubles\\n\\nLow-level scurvy, caused by lack of vitamin C, was common, thanks to diets containing few vegetables and fruits. Mild scurvy caused bleeding gums, tooth loss and foul-smelling breath.\\n\\nHome manuals offering advice for health, domestic activities and marriage included many recipes for mouth wash. Ingredients often included tobacco ash, alum, sage, clove and sometimes charcoal. Charcoal also doubled for polishing teeth.\\n\\nTo pull a cracked or decayed tooth, a practitioner might yank it with the claw of a tooth key, painful but quicker than slippery fingers or forceps.\\n\\nWithout a reliable way to keep food fresh, many meals included sour milk and meat that was beginning to rot – what colonists called \\"high.\\" Spoiled food meant dyspepsia – otherwise known as indigestion – and loose bowels.\\n\\nPeople commonly used tobacco to treat many ailments, including indigestion, respiratory problems, pain and loathsome mouth afflictions. They also turned to laudanum, from opium, as well as the poisons mercury and antimony.\\n\\nA life of daily discomfort\\n\\nRetrospective diagnosis is always flawed but the Revolutionary generation experienced ailments that sound similar to diabetes, arthritis, cancer, anemia, rabies, the common cold and tuberculosis. There were no effective treatments or consistent diagnosis for any of these.\\n\\nSome explanations of bodily difference were obviously wrong, such as physician and signer of the Declaration of Independence Benjamin Rush's conviction that the dark skin of African Americans was a disease, derived from leprosy. Common wisdom also held that birthmarks were caused by the mother's experience during pregnancy.\\n\\nBodily experiences that made sense in 1776 are often inscrutable to people today. Feelings are fleeting and words inadequate. Without considering objects, understanding history is incomplete, leaving people today disconnected from those who lived it.\\n\\nWe can't directly know each colonist's individual self. But knowing their material world through medical objects of their time allows us to visit and appreciate how they managed to cut through distractions of the body and bequeath to us those groundbreaking, enduring self-evident truths.","vocabulary":[{"id":"v13","word":"embodiment","phonetic":"/ɪmˈbɒdimənt/","level":"key","meanings":["n. 体现；化身；肉身化（的身体体验）"],"examples":[{"en":"She is the embodiment of patience.","zh":"她是耐心的化身。"}]},{"id":"v14","word":"pervasive","phonetic":"/pəˈveɪsɪv/","level":"key","meanings":["adj. 普遍的；弥漫的；无处不在的"],"examples":[{"en":"A pervasive sense of fear gripped the city.","zh":"一种普遍的恐惧感笼罩着这座城市。"}]},{"id":"v15","word":"affliction","phonetic":"/əˈflɪkʃn/","level":"key","meanings":["n. 痛苦；折磨；苦难"],"examples":[{"en":"He bore his affliction with great courage.","zh":"他以极大的勇气承受着病痛的折磨。"}]},{"id":"v16","word":"inscrutable","phonetic":"/ɪnˈskruːtəbl/","level":"key","meanings":["adj. 难以理解的；不可捉摸的"],"examples":[{"en":"Her expression was inscrutable.","zh":"她的表情令人捉摸不透。"}]},{"id":"a13","word":"dyspepsia","phonetic":"/dɪsˈpepsiə/","level":"advanced","meanings":["n. 消化不良"],"examples":[]},{"id":"a14","word":"scarificators","phonetic":"/ˈskeərɪfɪkeɪtəz/","level":"advanced","meanings":["n. 划痕器；放血器（scarificator 的复数）"],"examples":[]},{"id":"a15","word":"humors","phonetic":"/ˈhjuːməz/","level":"advanced","meanings":["n. 体液（古希腊医学认为决定健康与性格的四种体液）"],"examples":[]},{"id":"a16","word":"scurvy","phonetic":"/ˈskɜːvi/","level":"advanced","meanings":["n. 坏血病（因缺乏维生素 C 引起）"],"examples":[]}],"highlights":[{"vocabId":"v13","level":"key","charStart":206,"charEnd":216},{"vocabId":"v14","level":"key","charStart":1135,"charEnd":1144},{"vocabId":"v15","level":"key","charStart":649,"charEnd":659},{"vocabId":"v16","level":"key","charStart":6994,"charEnd":7005},{"vocabId":"a13","level":"advanced","charStart":1540,"charEnd":1549},{"vocabId":"a14","level":"advanced","charStart":2222,"charEnd":2235},{"vocabId":"a15","level":"advanced","charStart":3552,"charEnd":3558},{"vocabId":"a16","level":"advanced","charStart":5302,"charEnd":5308}],"locationSentences":["Acute illnesses like smallpox, typhoid, dysentery, yellow fever and diphtheria shadowed every ache and cough.","Bodily experiences that made sense in 1776 are often inscrutable to people today."],"publishedAt":"2026-07-01"},{"id":"art-005","source":"The Conversation","title":"How redefining one word strips the Endangered Species Act's ability to protect vital habitat","author":"Mariah Meek, Michigan State University and Karrigan Börk, University of California, Davis","sourceUrl":"https://theconversation.com/how-redefining-one-word-strips-the-endangered-species-acts-ability-to-protect-vital-habitat-287348","license":"CC BY-ND","content":"It wouldn’t make much sense to prohibit people from shooting a threatened woodpecker while allowing its forest to be cut down, or to bar killing endangered salmon while allowing a dam to dry out their habitat.\\n\\nBut that’s what the Trump administration is doing by changing how one word in the Endangered Species Act is interpreted: harm.\\n\\nFor 50 years, the U.S. government has interpreted the Endangered Species Act as protecting threatened and endangered species from actions that either directly kill them or eliminate their habitat. A new federal rule change, announced July 10, 2026, keeps the first part – protecting against the direct killing of the species – but removes habitat destruction.\\n\\nThat matters, because most species on the brink of extinction are on the Endangered Species list because there is almost no place left for them to live. Their habitats have been paved over, burned or transformed. Habitat protection is essential for their survival.\\n\\nAs an ecologist and a law professor, we have spent our entire careers working to understand the law and science of helping imperiled species thrive. We recognize that the rule change could green-light the destruction of protected species’ habitats, making it nearly impossible to protect those endangered species.\\n\\nThe legal gambit\\n\\nThe Endangered Species Act, passed in 1973, bans the “take” of “any endangered species of fish or wildlife,” which includes harming protected species.\\n\\nSince 1975, regulations have defined “harm” to include habitat destruction that kills or injures wildlife. Developers and logging interests challenged that definition in 1995 in a Supreme Court case, Babbitt v. Sweet Home Chapter of Communities for a Great Oregon. However, the court ruled that the definition was reasonable and allowed federal agencies to continue using it.\\n\\nIn short, the law says “take” includes harm, and under the regulatory definition at the time, harm included indirect harm through habitat destruction.\\n\\nThe Trump administration has now changed the definition of “harm” in a way that leaves out habitat modification.\\n\\nThis narrowed definition unravels the most significant protections granted by the Endangered Species Act.\\n\\nWhy habitat protection matters\\n\\nHabitat protection is the single most important factor in the recovery of endangered species in the United States – far more consequential than curbing direct killing alone.\\n\\nA 2019 study examining the reasons species were listed as endangered between 1975 and 2017 found that only 17% were primarily threatened by direct killing, such as hunting or poaching. That 17% includes iconic species such as the red wolf, American crocodile, Florida panther and grizzly bear.\\n\\nIn contrast, a staggering 81% were listed because of habitat loss and degradation. The Chinook salmon, island fox, southwestern willow flycatcher, desert tortoise and likely extinct ivory-billed woodpecker are just a few examples. Globally, a 2022 study found that habitat loss threatened more species than all other causes combined.\\n\\nAs natural landscapes are converted to agriculture or taken over by urban sprawl, logging operations and oil and gas exploration, ecosystems become fragmented and the space that species need to survive and reproduce disappears.\\n\\nCurrently, more than 107 million acres of land in the U.S. are designated as critical habitat for Endangered Species Act-listed species. Industries and developers have called for changes to the rules for years, arguing it has been weaponized to stop development. However, research shows species worldwide are facing an unprecedented threat from human activities that destroy natural habitat.\\n\\nUnder the new change, development could be accelerated in endangered species’ habitats.\\n\\nGutting the Endangered Species Act\\n\\nThe definition change is a quiet way to gut the Endangered Species Act.\\n\\nIt is also fundamentally incompatible with the purpose Congress wrote into the act: “to provide a means whereby the ecosystems upon which endangered species and threatened species depend may be conserved [and] to provide a program for the conservation of such endangered species and threatened species.” It contradicts the Supreme Court precedent, and it would destroy the act’s habitat protections.\\n\\nSecretary of the Interior Doug Burgum has argued that the recent “de-extinction” of dire wolves by changing 14 genes in the gray wolf genome means that America need not worry about species protection because technology “can help forge a future where populations are never at risk.”\\n\\nBut altering an existing species to look like an extinct one is both wildly expensive and a paltry substitute for protecting existing species.\\n\\nThe administration has also didn’t conduct the usual analysis of the environmental impact that changing the definition could have. That means the American people won’t even know the significance of this change to threatened and endangered species until it’s too late, though wildlife groups are already planning to sue over the change.\\n\\nThe ESA is saving species\\n\\nSurveys have found the Endangered Species Act is popular with the public, including Republicans. The Center for Biological Diversity estimates that the Endangered Species Act has saved 99% of protected species from extinction since it was created, not just from bullets but also from bulldozers. This regulatory rollback seeks to undermine the law’s greatest strength: protecting the habitats species need to survive.\\n\\nCongress knew the importance of habitat when it passed the law, and it wrote a definition of “take” that allows the agencies to protect it.","vocabulary":[{"id":"v17","word":"extinction","phonetic":"/ɪkˈstɪŋkʃn/","level":"key","meanings":["n. 灭绝；绝种；（火等的）熄灭"],"examples":[{"en":"Many species are on the brink of extinction due to habitat loss.","zh":"由于栖息地丧失，许多物种正处于灭绝的边缘。"}]},{"id":"v18","word":"unprecedented","phonetic":"/ʌnˈpresɪdentɪd/","level":"key","meanings":["adj. 史无前例的；空前的；前所未有的"],"examples":[{"en":"The region faced an unprecedented drought last summer.","zh":"去年夏天该地区遭遇了史无前例的旱灾。"}]},{"id":"v19","word":"degradation","phonetic":"/ˌdeɡrəˈdeɪʃn/","level":"key","meanings":["n. 退化；恶化；降级；堕落"],"examples":[{"en":"Soil degradation threatens agricultural productivity.","zh":"土壤退化威胁着农业生产力。"}]},{"id":"v20","word":"consequential","phonetic":"/ˌkɒnsɪˈkwenʃl/","level":"key","meanings":["adj. 产生重大后果的；重要的；随之而来的"],"examples":[{"en":"The court's ruling had consequential effects on the industry.","zh":"法院的裁决对该行业产生了重大的后果。"}]},{"id":"a17","word":"gambit","phonetic":"/ˈɡæmbɪt/","level":"advanced","meanings":["n. 精心策划的一招；策略；（为取得优势而作出的）举动"],"examples":[]},{"id":"a18","word":"unravels","phonetic":"/ʌnˈrævlz/","level":"advanced","meanings":["v. 拆解；瓦解；使破坏（unravel 的第三人称单数）"],"examples":[]},{"id":"a19","word":"paltry","phonetic":"/ˈpɔːltri/","level":"advanced","meanings":["adj. 微不足道的；少得可怜的；可鄙的"],"examples":[]},{"id":"a20","word":"weaponized","phonetic":"/ˈwepənaɪzd/","level":"advanced","meanings":["adj. 被武器化的；被滥用（以打击对手）的"],"examples":[]}],"locationSentences":["For 50 years, the U.S. government has interpreted the Endangered Species Act as protecting threatened and endangered species from actions that either directly kill them or eliminate their habitat.","This regulatory rollback seeks to undermine the law’s greatest strength: protecting the habitats species need to survive."],"publishedAt":"2026-07-11","highlights":[{"vocabId":"v17","level":"key","charStart":751,"charEnd":761},{"vocabId":"v18","level":"key","charStart":3586,"charEnd":3599},{"vocabId":"v19","level":"key","charStart":2773,"charEnd":2784},{"vocabId":"v20","level":"key","charStart":2358,"charEnd":2371},{"vocabId":"a17","level":"advanced","charStart":1291,"charEnd":1297},{"vocabId":"a18","level":"advanced","charStart":2119,"charEnd":2127},{"vocabId":"a19","level":"advanced","charStart":4634,"charEnd":4640},{"vocabId":"a20","level":"advanced","charStart":3498,"charEnd":3508}]},{"id":"art-006","source":"The Conversation","title":"Judges block Trump administration’s attempts to deny access to Public Service Loan Forgiveness to its perceived foes","author":"Benjamin Leff, American University","sourceUrl":"https://theconversation.com/judges-block-trump-administrations-attempts-to-deny-access-to-public-service-loan-forgiveness-to-its-perceived-foes-286741","license":"CC BY-ND","content":"Two federal judges in different courts have blocked the Trump administration’s attempt to deny employees of nonprofits that oppose the Trump administration’s political agenda access to a program through which they could avoid having to pay off all of their student loans. Both issued their judgments on June 30, 2026.\\n\\nAs a law professor who studies the nonprofit sector, I believe that both judges made the right decision because the historical strength of the nonprofit sector in the U.S. is its independence from government control. The First Amendment requires that laws governing nonprofits be neutral, and that no administration can punish an organization merely because its actions or views are at odds with the White House.\\n\\nForgiving student debt owed by public service workers\\n\\nCongress approved the legislation that created the Public Service Loan Forgiveness program in 2007. This program cancels the remaining balance on federal student loans after eligible borrowers consistently make payments on their student debt for 10 years.\\n\\nOnly borrowers with public service jobs may participate and be eligible to have some of their student loan balance canceled. That is, they need to work for the government at any level, including public schools, or at any charitable nonprofit.\\n\\nOne of the program’s goals was to encourage young Americans, especially those with significant student debt, to do jobs that serve the public good but pay less than what they might earn in the private sector.\\n\\nThe government does not cancel any student loan debt until the Education Department verifies that eligible borrowers have met all requirements, including a decade of steady payments from public school teachers, government officials and employees of nonprofits of all kinds – such as food banks and museums.\\n\\nBut that promise of debt relief for borrowers at some nonprofits was jeopardized prior to these two rulings.\\n\\nTo date, the program has canceled more than US$87 billion in student loans for nearly 1.2 million Americans. On average, borrowers have seen about $74,000 in debt erased.\\n\\nTrump administration’s attempt to revise the program\\n\\nPresident Donald Trump issued an executive order on March 7, 2025, directing the Department of Education to change who can be eligible for public service loan forgiveness.\\n\\nIn the order, he complained that some of the program’s participants may have worked for organizations that “actually harm our society and American values, sometimes through criminal means.” The order does not name any of those nonprofits, but it named some examples: aiding immigrants, treating minors’ gender dysphoria, advancing diversity, equity and inclusion goals, and helping to organize left-wing protests.\\n\\nTrump said he wanted the government to refuse to forgive loan balances of borrowers who work for those employers. The order itself was not legally binding, but it guided the drafting of a new regulation the Education Department issued on Oct. 31, 2025. The regulation ordered the exclusion from the debt forgiveness program of employers that “engage in specific enumerated illegal activities such that they have a substantial illegal purpose.”\\n\\nThe phrase “substantial illegal purpose” comes out of nonprofit law; organizations with an illegal purpose can’t be tax-exempt charities. But the doctrine has been employed in very limited circumstances in the past, and the government has never developed rules to ensure that it is not abused.\\n\\nInstead of developing those rules, the regulation identifies specific issues that the Trump administration objects to and has treated as high priorities.\\n\\nDoing those activities would disqualify an employer from participation in the program under that regulation, if the Education Department determined that those organizations employed illegal means to advance their goals.\\n\\nA group of 22 state attorneys general and a coalition of nonprofits, municipal governments and labor unions filed separate lawsuits on Nov. 3, 2025, to block the regulation. Those lawsuits were later combined. Another group of nonprofits filed a similar lawsuit the next day.\\n\\nWhy the judges struck Trump’s revised rules\\n\\nOn the day before the new rule was set to go into effect, U.S. District Court Judge Myong Joun, in Massachusetts, and U.S. District Court Judge Amir Ali, in Washington, D.C., struck it down – preventing the Department of Education from implementing it.\\n\\nMore than a year after Trump’s executive order, both judges found that the statute that Congress passed was unambiguous about which employers qualified for the program: all nonprofits with 501(c)(3) tax-exempt status. And because the statute was so clearly written, the Education Department has no authority to change the eligibility criteria to exclude particular organizations, the judges found.\\n\\nBecause organizations that serve an illegal purpose already can’t have tax-exempt status, no such organization may participate in this loan forgiveness program. Both judges held that the Education Department exceeded its authority by granting itself the power to determine which nonprofits’ employees can’t be eligible.\\n\\nIn short, judges Joun and Ali said the Trump administration can’t change federal Public Service Loan Forgiveness program rules to punish people who work for certain kinds of nonprofits that the administration doesn’t like – or to use the program to advance its agenda.\\n\\nWhat this means for borrowers and nonprofits\\n\\nThese rulings are good news for borrowers who work for nonprofits whose missions are at odds with the Trump administration’s agenda.\\n\\nBoth rulings vacated the new regulation, which means the federal government cannot implement its revised rule anywhere in the country.\\n\\nThe U.S. Supreme Court held in 2025 that district court judges couldn’t impose nationwide injunctions. But that ruling does not affect court rulings that strike down agency regulations.\\n\\nIf the administration appeals, an appellate court could restore the new regulation.\\n\\nThe Supreme Court could even get involved at some point. But although the court has been expanding executive power in some situations, the justices have reduced the leeway administrative agencies have to issue regulations that add additional requirements to clear statutes.\\n\\nIn my view, the Supreme Court would therefore be unlikely to side with the administration if it were to hear this case.\\n\\nImplications for everyone else\\n\\nBoth judges held that the revised rule exceeded the Education Department’s authority. Joun in Massachusetts went further than Ali in Washington.\\n\\nJoun held that the new regulation “is facially unconstitutional because it discriminates on the basis of viewpoint.”\\n\\nThat’s important because he recognized that “selectively targeting” organizations because their goals are contrary to those of the administration is very different from trying to prevent the employees of criminal organizations from having their student loans forgiven.\\n\\nThe Trump administration has been aggressively jumbling these two things together. Because organizations’ viewpoints are protected by the U.S. Constitution, the government can’t discriminate in the Public Service Loan Forgiveness program against an organization that advocates for undocumented immigrants to stay in the country, for example – or one that seeks to have them removed.\\n\\nOn the other hand, violent or illegal tactics are not protected by the Constitution or eligible for tax-exempt status. That means an organization that employs them can be denied benefits.\\n\\nThe Public Service Loan Forgiveness program regulation that the Trump administration has sought to implement expressly blurs these lines. I think it’s reasonable to interpret this jumbling as a tactic intended to chill protected activity by instilling fear in those who disagree with the Trump administration’s policies. And I see Joun’s opinion as a bulwark against that type of intimidation.\\n\\nThese rulings should give Americans of all political stripes more confidence that their rights will be respected, no matter who is in office.","vocabulary":[{"id":"v21","word":"unambiguous","phonetic":"/ˌʌnæmˈbɪɡjuəs/","level":"key","meanings":["adj. 明确的；不含糊的；清楚的"],"examples":[{"en":"The contract contains an unambiguous clause about late payment.","zh":"合同中有一条关于逾期付款的明确条款。"}]},{"id":"v22","word":"jeopardized","phonetic":"/ˈdʒepədaɪzd/","level":"key","meanings":["v. 危及；损害；使处于危险境地（jeopardize 的过去分词）"],"examples":[{"en":"His careless remarks jeopardized the negotiation.","zh":"他草率的言辞危及了谈判。"}]},{"id":"v23","word":"disqualify","phonetic":"/dɪsˈkwɒlɪfaɪ/","level":"key","meanings":["v. 取消…的资格；使丧失资格；使不合格"],"examples":[{"en":"A previous conviction may disqualify you from serving on a jury.","zh":"有前科可能会使你失去担任陪审员的资格。"}]},{"id":"v24","word":"intimidation","phonetic":"/ɪnˌtɪmɪˈdeɪʃn/","level":"key","meanings":["n. 恐吓；威胁；威吓"],"examples":[{"en":"The workers complained of intimidation by their employer.","zh":"工人们抱怨遭到雇主的恐吓。"}]},{"id":"a21","word":"bulwark","phonetic":"/ˈbʊlwək/","level":"advanced","meanings":["n. 堡垒；防御屏障；捍卫者（against）"],"examples":[]},{"id":"a22","word":"appellate","phonetic":"/əˈpelət/","level":"advanced","meanings":["adj. 上诉的；受理上诉的"],"examples":[]},{"id":"a23","word":"enumerated","phonetic":"/ɪˈnjuːməreɪtɪd/","level":"advanced","meanings":["adj. 列举的；逐一列出的（enumerate 的过去分词）"],"examples":[]},{"id":"a24","word":"jumbling","phonetic":"/ˈdʒʌmblɪŋ/","level":"advanced","meanings":["v. 混杂；使混乱（jumble 的现在分词）"],"examples":[]}],"locationSentences":["Both judges held that the Education Department exceeded its authority by granting itself the power to determine which nonprofits’ employees can’t be eligible.","These rulings should give Americans of all political stripes more confidence that their rights will be respected, no matter who is in office."],"publishedAt":"2026-07-06","highlights":[{"vocabId":"v21","level":"key","charStart":4531,"charEnd":4542},{"vocabId":"v22","level":"key","charStart":1876,"charEnd":1887},{"vocabId":"v23","level":"key","charStart":3655,"charEnd":3665},{"vocabId":"v24","level":"key","charStart":7916,"charEnd":7928},{"vocabId":"a21","level":"advanced","charStart":7887,"charEnd":7894},{"vocabId":"a22","level":"advanced","charStart":5950,"charEnd":5959},{"vocabId":"a23","level":"advanced","charStart":3093,"charEnd":3103},{"vocabId":"a24","level":"advanced","charStart":7010,"charEnd":7018}]},{"id":"art-007","source":"The Conversation","title":"How out-of-work fishermen saved the American Revolution","author":"Christopher P. Magra, University of Tennessee","sourceUrl":"https://theconversation.com/how-out-of-work-fishermen-saved-the-american-revolution-282034","license":"CC BY-ND","content":"George Washington knew his forces could not win the American Revolutionary War without some measure of sea power. “It follows then as certain as that night succeeds the day,” he later wrote in a letter, “that without a decisive naval force we can do nothing definitive, and with it everything honorable and glorious.”\\n\\nThe problem was that the American commander did not have a navy.\\n\\nAs a professor of early American history, I have taught courses on the American Revolution for more than 20 years and have written two books on its maritime dimensions. Washington’s solution wouldn’t come from a French shipyard or a congressional committee. It would come from a group of angry, out-of-work New England fishermen.\\n\\n## Supplying the army from the sea\\n\\nIn 1775, American ground forces managed to lay siege to the British army in Boston, but Washington needed provisions and military stores to sustain pressure on this key commercial hub. Looking out across the Atlantic Ocean, he noticed supply ships arriving in droves from Great Britain – unescorted – to supply the British army in Boston with guns and ammunition.\\n\\nUnbeknownst to them, the British had already handed the American commander the ships and mariners he needed to capture those resources.\\n\\nThe Sons of Liberty, a network of political activists, had angered the British government by resisting taxes and commercial regulations – from the 1765 Stamp Act, which taxed printed documents, to the 1773 Tea Act, which controlled what tea leaves made their way into North American cupboards.\\n\\nTo punish rebels for their treason, Parliament passed the Restraining Act of 1775, banning New Englanders from fishing on the Atlantic Ocean. Overnight, thousands of skilled mariners – men who spent their lives wrestling 100-pound cod out of the freezing, storm-tossed North Atlantic – were out of a job. They weren’t just unemployed; they were furious. These fishermen left their work tools and ships behind, picked up weapons and joined the siege of Boston alongside American farmers.\\n\\nAshley Bowen, who lived and worked in Marblehead, Massachusetts, the principal fishing port in America at the time, recorded in his journal on May 22, 1775, “the fishermen are enlisting quite quick.”\\n\\nA letter from a French diplomat to the foreign minister in Paris confirmed the news a couple of weeks later: “4,800 sailors seeing they were going to be deprived of their fishing rights, deserted their ships and joined their compatriots under arms.”\\n\\n## Creating the first navy\\n\\nWashington, commissioned by Congress as commander in chief of all American armed forces in June 1775, saw an opportunity. He didn’t wait for Congress to build new frigates. Instead, he reached out to John Glover, a fish merchant from Marblehead and a commissioned officer under his command.\\n\\nWashington’s plan was simple: Take the sturdy, salt-stained schooners used for fishing and turn them into armed, seagoing predators.\\n\\nThe first of these was Glover’s own fishing vessel and trade ship, Hannah. She wasn’t a formidable man-of-war but a 78-ton workhorse that spent summers at the Grand Banks and winters hauling rum and sugar from the Caribbean. Washington armed the trade ship with a few cannons, manned her with fishermen and sent her out to hijack British supply ships to help his army win the siege of Boston.\\n\\nJust two days after the Hannah was underway, her crew captured the Unity, a sloop loaded with naval stores and lumber, supplies sorely needed by British forces in Boston.\\n\\nBetween August and October 1775, Washington outfitted a fleet of schooners at Congress’ expense to intercept British supply ships off the coast of New England. These vessels and crews, whose wages were paid by the American government, constituted what many historians consider America’s first navy. Washington reminded each captain that they sailed “at the Continental Expense.” These orders from Washington and the payments made by Congress made these ships official American warships, operating under the authority of what would become the federal government.\\n\\nThese recruits didn’t need nautical training; they were seasoned seafarers who had battled rough waters and gale force winds. On Oct. 13, 1775, George Washington wrote to his brother, John Augustine Washington that the fishermen were “soldiers … who have been bred to the sea.”\\n\\nIn 1776, Washington informed the governor of Connecticut, who had asked to draft seamen from Washington’s regiments for his own naval expedition, that he could not spare any. “I must depend chiefly upon them for a successful opposition to the Enemy,” Washington explained.\\n\\n## Keeping the Revolution alive\\n\\nThis fleet of converted fishing boats punched above its weight: In the early years of the war they captured 55 British vessels. One such prize, the Nancy, was transporting 2,000 muskets, 30 tons of musket balls and a massive 15-inch brass mortar – supplies the American army desperately needed for the war effort.\\n\\nBecause the British navy was spread too thin, with too few warships available to police the Atlantic coastline, the armed fishing vessels were able to disrupt supply lines and keep the Revolution alive through its infancy. By the time the British realized the threat, the damage was done.\\n\\nOn Feb. 26, 1776, just a few months after Washington launched his fleet, British Admiral Molyneux Shuldham wrote in a report to his superiors that his forces in Boston were low on everything from naval supplies to weapons. What little they could find had to be purchased “at the most extravagant prices.”\\n\\nThe British government had not assigned military convoys to trans-Atlantic shipments at the start of the conflict in 1775. Now, Shuldham recommended arming the supply ships themselves, since valuable stores were being intercepted by rebels in small vessels, “however attentive our Officers to their Duty.”\\n\\nHe concluded the report with an ominous note, explaining that he simply did not have the resources to do everything that was being asked of him – support the army, blockade rebel ports and protect British ships bound for Boston: “I must beg leave to observe to you the very few Ships I am provided with to enable Me to Co-operate with the Army, Cruize off the Ports of the Rebels to prevent their receiving Supplies, or protect those destined to this place from falling into their hands.”","vocabulary":[{"id":"v25","word":"decisive","phonetic":"/dɪˈsaɪsɪv/","level":"key","meanings":["adj. 决定性的；果断的"],"examples":[{"en":"The general made a decisive move that turned the tide of the battle.","zh":"将军采取了决定性的一步，扭转了战局。"}]},{"id":"v26","word":"siege","phonetic":"/siːdʒ/","level":"key","meanings":["n. 围攻；包围"],"examples":[{"en":"The army laid siege to the city for three months before it surrendered.","zh":"军队围攻了这座城市三个月，它才投降。"}]},{"id":"v27","word":"intercept","phonetic":"/ˌɪntərˈsept/","level":"key","meanings":["v. 拦截；截住"],"examples":[{"en":"The police intercepted the drug shipment before it reached the city.","zh":"警方在毒品运抵城市之前将其拦截。"}]},{"id":"v28","word":"extravagant","phonetic":"/ɪkˈstrævəɡənt/","level":"key","meanings":["adj. 奢侈的；过度的"],"examples":[{"en":"She was criticized for her extravagant lifestyle during the economic crisis.","zh":"她在经济危机期间因奢侈的生活方式而受到批评。"}]},{"id":"a25","word":"mariners","phonetic":"/ˈmærɪnərz/","level":"advanced","meanings":["n. 水手；海员（mariner的复数）"],"examples":[]},{"id":"a26","word":"treason","phonetic":"/ˈtriːzən/","level":"advanced","meanings":["n. 叛国罪；背叛"],"examples":[]},{"id":"a27","word":"schooners","phonetic":"/ˈskuːnərz/","level":"advanced","meanings":["n. 纵帆船"],"examples":[]},{"id":"a28","word":"unbeknownst","phonetic":"/ˌʌnbɪˈnoʊnst/","level":"advanced","meanings":["adv. 不为人知地；不知情地"],"examples":[]}],"locationSentences":["To punish rebels for their treason, Parliament passed the Restraining Act of 1775, banning New Englanders from fishing on the Atlantic Ocean.","Between August and October 1775, Washington outfitted a fleet of schooners at Congress’ expense to intercept British supply ships off the coast of New England."],"publishedAt":"2026-06-02","highlights":[{"vocabId":"v25","level":"key","charStart":219,"charEnd":227},{"vocabId":"v26","level":"key","charStart":799,"charEnd":804},{"vocabId":"v27","level":"key","charStart":3608,"charEnd":3617},{"vocabId":"v28","level":"key","charStart":5547,"charEnd":5558},{"vocabId":"a25","level":"advanced","charStart":1206,"charEnd":1214},{"vocabId":"a26","level":"advanced","charStart":1576,"charEnd":1583},{"vocabId":"a27","level":"advanced","charStart":2869,"charEnd":2878},{"vocabId":"a28","level":"advanced","charStart":1117,"charEnd":1128}]},{"id":"art-008","source":"The Conversation","title":"As Renaissance fairs become big business, can they retain their counterculture roots?","author":"Katrina Stack and Reagan Yessler","sourceUrl":"https://theconversation.com/as-renaissance-fairs-become-big-business-can-they-retain-their-counterculture-roots-273757","license":"CC BY-ND","content":"Within moments of entering the Newport Renaissance Faire, you are ushered to a group of fairies. They pass you a scroll and say, “You must seek out the Bone Man for the first hurdle in your quest.” As you navigate the fair, you find many men dressed in bones, both vendors and fellow attendees. When you find the correct Bone Man – an actor wearing what appears to be a mask made of human skull along with a crown constructed from deer antlers – he stamps your scroll. He then sends you to your next target: the Drunk Viking.\\n\\nFollowing the directions of actors in the fair, you meet a variety of performers from many historical eras and fantastic realms, and stumble upon both merchants and merrymakers in your journey. It’s all part of the immersive experience that connects you with the other guests and staff, though many of the costumed staff members, speaking in faux Middle English, are also trying to sell you something.\\n\\nRenaissance fairs began as a countercultural experiment in 1960s California. Today, you might see Vikings strolling alongside mermaids, elves and pirates — with tickets costing more than $50.\\n\\nRenaissance fairs were originally conceived as a creative refuge for artists sidelined by political repression during the Red Scare. Now, they sit at an uneasy crossroads between countercultural expression and commercial spectacle. Having grown into a nationwide industry with tiered tickets, branded merchandise and multimillion dollar valuations, the fairs can easily be seen as an offshoot of a corporate theme park.\\n\\nAs cultural geographers, we wanted to learn more about whether the spirit of the fairs has been changing. So for our recent study, we visited the Tennessee Renaissance Festival, Newport Renaissance Faire, Tennessee Medieval Faire and Tennessee Pirate Fest.\\n\\n## Once upon a time … not so long ago\\n\\nAlthough renaissance fairs and festivals recreate the atmosphere of centuries past, the first formally recognized fair took place in May 1963 in Irwindale, California. A public school English and history teacher named Phyllis Patterson was the brains behind the event, which she dubbed the Renaissance Pleasure Faire.\\n\\nFor Patterson, the fair was a chance to celebrate the era’s countercultural values like free expression, experimentation with identity and creative play. It also served as a source of employment for those who had been pushed out of their careers in the film and entertainment industries after being blacklisted or graylisted as suspected communists.\\n\\nPatterson herself had refused to sign a Cold War–era loyalty oath required to work in California public schools. At the Renaissance Pleasure Faire, actors, educators and set designers could continue their craft, whether that meant designing costumes, creating characters, performing or writing.\\n\\n## From creative refuge to thriving business\\n\\nSince those first events in Southern California, renaissance fairs have spread across the U.S., with some constructing permanent structures even though they’re only open seasonally, in the spring or fall. Built to resemble small villages, fair operators create towns-within-towns, fantasy lands where visitors can briefly step away from their routines and obligations.\\n\\nTheir popularity continues to grow, and what began partly as a creative refuge has grown into a thriving entertainment business.\\n\\nThe East Tennessee Renaissance Faire recently announced that it would be relocating after deciding that its original venue in Newport could no longer accommodate the swelling crowds: Within three years, the fair had grown from 600 to 6,000 attendees, spurring a move to a larger site in neighboring Sevierville. New fairs are sprouting up as well: The Chattanooga Renaissance Faire will host its inaugural season in spring 2026.\\n\\nThere are almost always entry fees – US$38 at the Tennessee Renaissance Festival and $53 at the Renaissance Pleasure Faire, for example – and many offer season passes.\\n\\nAttendees often arrive in costume, but strict rules about adhering to a specific time period or setting rarely apply.\\n\\nSome visitors dress as Tolkien-style elves, while others show up as Tudor nobles. Viking-clad participants walk alongside fairies and swashbuckling pirates. Some fairs have also developed their own themed weekends – with names like “Viking Victory,” “Fantasy and Folklore,” “Pirate Plunder” and “Celtic Celebration” – that weave history and fiction with few constraints. And those committed to their role will often address each other in playful faux-medieval speech, with greetings like “my lady” or “my lord.”\\n\\nVendors, often dressed in costume themselves, sell everything from cloaks, swords and crowns to contemporary jewelry and shampoos. Booths sell era-adjacent fare like Scotch eggs, ciders, mead and turkey legs, while modern cocktails like “The Shipwreck” and “The Blueberry Faerie” can also be had, with visitors paying the equivalent of stadium and arena concession prices.\\n\\nRenaissance fairs have even spread to countries like Germany and France, reconnecting with their roots. The expansion into new venues – along with the development of offshoots such as pirate- and steampunk-themed festivals – point to profit margins that would have been unthinkable in the early days of the Renaissance Pleasure Faire.\\n\\nBut as with many ventures, the prospect of cashing in comes with complications.\\n\\nThe 2024 HBO Max series “Ren Faire” introduced viewers to the eccentrics and costume-clad vendors involved in the nation’s largest fair, the Texas Renaissance Festival in Todd Mission. The fight over its future involved lawsuits and, eventually, the court-ordered $60 million sale of the event’s property and assets.\\n\\nKing Richard’s Faire, which takes place in Carver, Massachusetts, and is the largest fair in New England, reportedly generates massive daily revenue while allegedly relying on widespread worker misclassification, leaving many performers earning below minimum wage without benefits. Even volunteer “villagers” work only for free admission, and both workers and attendees receive no compensation or refunds when the fair closes due to rain.\\n\\n## Seeking out a space of whimsy\\n\\nDespite the creeping influence of profit motives, we concluded that renaissance fairs have always been – and continue to be – mostly about community.\\n\\nDressing as a fantastical version of yourself or your favorite character bonds you to others dressed up at the festival. Unlike popular Civil War or World War II reenactments where historical accuracy is paramount, renaissance fairs instead invite people to take part in shared, often mythologized ideas about history through performance, costume and play.\\n\\nFor example, each weekend, the Tennessee Renaissance Festival organizes jousts. Competitors and their horses meet at a permanent jousting pitch located at the back of the property. Each knight represents a noble house, and each section of the bleachers is assigned a knight to root for. Announcers explain the rules of each event, while also leading the crowds in chants and cheers. While the knights might fight under titles tied to historical lineages, they represent a jumble of eras and place. They also reject antiquated social norms by including women and ethnic groups who never would have been seen together on a jousting pitch.\\n\\nHere, fidelity to the facts is an afterthought; it actually might ruin the fun.\\n\\nBeyond the jousting pitch, you can find the queen dictating a game of human chess. A rotating cast of performers play music, tell jokes, juggle and blow fire. Elsewhere, you might stumble across pixies teaching children how to make fairy homes or relax in a mermaid’s magical grotto.\\n\\nThere’s also a comforting simplicity in the narratives of this make-believe world. Ladies are almost always gentle and beautiful, while the men are brave and noble. All the villains are easy to spot – they’re always defeated.\\n\\nIn a real world characterized by political upheaval, information overload, invisible surveillance and shadowy villains, perhaps the fair, with its simple prism of good and evil, becomes a space of comfort – a curated cultural experiment that’s also an improvised escape.\\n\\nIn other words, renaissance fairs wield a quiet power: They forge communities that deliberately blur fantasy, history and everyday life with a wink. Vendors, performers and attendees alike can be Tudors, Vikings, hobbits, elves or mermaids for a day. Few actually believe in elves, or imagine their mock-Elizabethan speech is anything more than cheerful, mangled guesswork.\\n\\nAnd that’s the point. There’s joy in pretending – just as there’s a universal pleasure in the weird, the whimsical and the absurd.","vocabulary":[{"id":"v29","word":"refuge","phonetic":"/ˈrefjuːdʒ/","level":"key","meanings":["n. 避难所；庇护"],"examples":[{"en":"The mountain cave served as a refuge from the storm.","zh":"山洞成了躲避风暴的避难所。"}]},{"id":"v30","word":"conceived","phonetic":"/kənˈsiːvd/","level":"key","meanings":["v. 构思；设想"],"examples":[{"en":"The novel was conceived during a long train journey.","zh":"这部小说是在一次漫长的火车旅行中构思出来的。"}]},{"id":"v31","word":"fidelity","phonetic":"/fɪˈdeləti/","level":"key","meanings":["n. 忠实；保真度；准确性"],"examples":[{"en":"The translator strove for fidelity to the original text.","zh":"译者力求忠实于原文。"}]},{"id":"v32","word":"upheaval","phonetic":"/ʌpˈhiːvl/","level":"key","meanings":["n. 动乱；剧变"],"examples":[{"en":"The political upheaval forced many families to leave their homes.","zh":"政治动乱迫使许多家庭离开家园。"}]},{"id":"a29","word":"paramount","phonetic":"/ˈpærəmaʊnt/","level":"advanced","meanings":["adj. 至高无上的；最重要的"],"examples":[]},{"id":"a30","word":"wield","phonetic":"/wiːld/","level":"advanced","meanings":["v. 行使；挥舞；掌握"],"examples":[]},{"id":"a31","word":"whimsical","phonetic":"/ˈwɪmzɪkl/","level":"advanced","meanings":["adj. 异想天开的；古怪的"],"examples":[]},{"id":"a32","word":"inaugural","phonetic":"/ɪˈnɔːɡjərəl/","level":"advanced","meanings":["adj. 就职的；创始的；开幕的"],"examples":[]}],"locationSentences":["Renaissance fairs were originally conceived as a creative refuge for artists sidelined by political repression during the Red Scare.","Despite the creeping influence of profit motives, we concluded that renaissance fairs have always been – and continue to be – mostly about community."],"publishedAt":"2026-06-14","highlights":[{"vocabId":"v29","level":"key","charStart":1181,"charEnd":1187},{"vocabId":"v30","level":"key","charStart":1157,"charEnd":1166},{"vocabId":"v31","level":"key","charStart":7320,"charEnd":7328},{"vocabId":"v32","level":"key","charStart":7950,"charEnd":7958},{"vocabId":"a29","level":"advanced","charStart":6522,"charEnd":6531},{"vocabId":"a30","level":"advanced","charStart":8213,"charEnd":8218},{"vocabId":"a31","level":"advanced","charStart":8659,"charEnd":8668},{"vocabId":"a32","level":"advanced","charStart":3749,"charEnd":3758}]},{"id":"art-009","source":"The Conversation","title":"The ball is round, and contrary to some keepers' views in this World Cup, it has performed just fine","author":"John Eric Goff, University of Lynchburg","sourceUrl":"https://theconversation.com/the-ball-is-round-and-contrary-to-some-keepers-views-in-this-world-cup-it-has-performed-just-fine-287044","license":"CC BY-ND","content":"Not every World Cup goal is a classic. Sometimes a half-hearted shot goes in as a result of little more than goalkeeper error. And on those occasions, goalies may be inclined to find an excuse.\\n\\nDuring the 2026 tournament, some members of what is jokingly referred to as the \\"goalkeepers' union\\" have pointed toward the performance of the ball. Joe Hart, a former England goalkeeper and serving BBC pundit, noted after one blunder: \\"The ball is coming into the keepers a lot faster than it feels when it comes off the foot.\\"\\n\\nBut are his concerns justified? The Conversation turned to John Eric Goff, who has been studying the physics of World Cup balls for two decades and previously wrote about what to expect from the Trionda ball being used at the 2026 FIFA World Cup.\\n\\nWhat did your lab tests predict?\\n\\nColleagues of mine at the University of Tsukuba in Japan took the World Cup ball, put a little hole in it, stuck it on a rod, attached force sensors and then set it up in a wind tunnel to obtain all kinds of aerodynamic data. They sent that data to me to look at what the trajectory modeling for the ball suggested about how it would perform in comparison to its predecessors.\\n\\nCentral to the performance is the airflow around the ball and how it changes as the speed of the ball increases. For the Jabulani ball used in the 2010 World Cup, for example, this airflow change happened at a speed that was right in the middle of typical free kicks and corner kicks. That caused problems for goalkeepers, as it moved in the air unpredictably as a result.\\n\\nAmong the recent World Cup balls we tested, Trionda has the lowest critical speed at which that airflow change takes place. That led us to predict free kicks and corner kicks with fairly consistent, stable flight.\\n\\nBut we also found that Trionda's drag coefficient was slightly larger than that of its predecessors, which implied a slightly rougher surface. So there was a possible trade-off; it might fall a couple of meters short.\\n\\nHas the real pitch experience followed those predictions?\\n\\nIt has depended a little on conditions. Take the Mexico vs. England game at Estadio Azteca in Mexico City, which took place at high elevation.\\n\\nThat meant the ball had less air drag on it, so it could actually go farther than it would when kicked with the same launch speed in lower-altitude conditions. It also meant that because the sideways, or Magnus forces, are proportional to air density, it would curve less.\\n\\nDuring the England vs. Mexico game, what I noticed, especially early on, was many of England's kicks tended to go a little long. They would kick the ball down the pitch in those first 20 minutes and it would be just out of reach of teammates.\\n\\nThe sense I got was they weren't quite adjusting for the higher elevation and lower air density.\\n\\nSome have questioned the flight. Do they have a point?\\n\\nI have heard the complaints by former England goalkeeper Joe Hart about the ball. But I haven't heard a whole lot of detail about the substance of those complaints.\\n\\nIn other words, I've heard about the ball not being their favorite, but not why. The scientist in me really wants to interview a goalkeeper and find out: \\"Do you think it's moving in erratic ways? Or is it something to do with the color scheme that's flummoxing you on the pitch?\\"\\n\\nI think goalkeepers are always going to complain about a new ball. But the Nike Flight, which was used in the 2024-25 English Premier League season, has an aerodynamic profile most similar to that of the current World Cup ball. So players who used that ball might already be somewhat familiar with the motion of Trionda.\\n\\nAs far as I can tell, the ball appears to be flying in ways that not only we predicted but that don't look completely out of touch with what players would have seen with other balls.\\n\\nAs the World Cup has progressed, I've been watching the ball come in toward the goalkeepers, and it could be that the reds, blues and greens twirling in front of the goalkeepers' eyes are confusing them.\\n\\nThere's been talk of more long-range goals. Is the ball playing a role?\\n\\nI have read there are more goals coming from farther out than in previous World Cups. But I don't know if I could attribute it specifically to the ball.\\n\\nIt's possible, of course. But I would really have to see what the actual number is and see what the percentage increase has been, because, for a sport like soccer where you only get two or three goals in a match, the sample size is so small.\\n\\nIt would certainly be a very interesting research question to pursue. But I don't think the ball alone can be credited for these longer-range goals.\\n\\nOverall, how has this ball performed?\\n\\nI think the ball has been fine. It is an attractive ball, with the colors of the original version representing the three host countries – all of whom are now out of the tournament, so it didn't bring them much luck, unfortunately.","vocabulary":[{"id":"v33","word":"aerodynamic","phonetic":"/ˌeərəʊdaɪˈnætɪk/","level":"key","meanings":["adj. 空气动力学的（研究物体与空气相对运动的）"],"examples":[{"en":"The researchers obtained all kinds of aerodynamic data from the wind tunnel tests.","zh":"研究人员从风洞试验中获得了各种空气动力学数据。"}]},{"id":"v34","word":"trajectory","phonetic":"/trəˈdʒektəri/","level":"key","meanings":["n. 轨迹；弹道；抛物轨迹"],"examples":[{"en":"The trajectory modeling suggested how the ball would perform in comparison to its predecessors.","zh":"弹道建模显示了该球与其前身相比的表现。"}]},{"id":"v35","word":"coefficient","phonetic":"/ˌkəʊɪˈfɪʃnt/","level":"key","meanings":["n. 系数（如阻力系数 drag coefficient）"],"examples":[{"en":"Trionda's drag coefficient was slightly larger than that of its predecessors.","zh":"Trionda 的阻力系数比其前身的略大。"}]},{"id":"v36","word":"elevation","phonetic":"/ˌelɪˈveɪʃn/","level":"key","meanings":["n. 海拔；高度；高处"],"examples":[{"en":"The game at Estadio Azteca took place at high elevation.","zh":"在阿兹特克体育场举行的比赛是在高海拔条件下进行的。"}]},{"id":"a33","word":"erratic","phonetic":"/ɪˈrætɪk/","level":"advanced","meanings":["adj. 飘忽不定的；不规则的；不可预测的"],"examples":[]},{"id":"a34","word":"flummoxing","phonetic":"/ˈflʌməksɪŋ/","level":"advanced","meanings":["adj. 令人困惑的；使人不知所措的（动词 flummox 的现在分词）"],"examples":[]},{"id":"a35","word":"blunder","phonetic":"/ˈblʌndə(r)/","level":"advanced","meanings":["n. 愚蠢的错误；失误 / v. 犯愚蠢的错误"],"examples":[]},{"id":"a36","word":"pundit","phonetic":"/ˈpʌndɪt/","level":"advanced","meanings":["n. 评论员；专家；（媒体）评论人士"],"examples":[]}],"locationSentences":["Among the recent World Cup balls we tested, Trionda has the lowest critical speed at which that airflow change takes place.","As far as I can tell, the ball appears to be flying in ways that not only we predicted but that don't look completely out of touch with what players would have seen with other balls."],"publishedAt":"2026-07-10","highlights":[{"vocabId":"v33","level":"key","charStart":1016,"charEnd":1027},{"vocabId":"v34","level":"key","charStart":1080,"charEnd":1090},{"vocabId":"v35","level":"key","charStart":1813,"charEnd":1824},{"vocabId":"v36","level":"key","charStart":2185,"charEnd":2194},{"vocabId":"a33","level":"advanced","charStart":3218,"charEnd":3225},{"vocabId":"a34","level":"advanced","charStart":3286,"charEnd":3296},{"vocabId":"a35","level":"advanced","charStart":423,"charEnd":430},{"vocabId":"a36","level":"advanced","charStart":399,"charEnd":405}]},{"id":"art-010","source":"The Conversation","title":"Teachers are worried about students cheating with AI, but my survey suggests the deeper issue is learning","author":"Brian DeJager, University of Wisconsin-Stout","sourceUrl":"https://theconversation.com/teachers-are-worried-about-students-cheating-with-ai-but-my-survey-suggests-the-deeper-issue-is-learning-286425","license":"CC BY-ND","content":"The risk of students using AI to cheat tends to get a lot of attention – with good reason.\\n\\nA student can simply copy and paste a prompt into a chatbot and receive a polished paragraph, a five-paragraph essay, a lab summary or a reading response almost instantly. Teachers may then be left wondering whether the work reflects the student's thinking and actual work or what the chatbot generated.\\n\\nAn estimated 84% of high school students surveyed said they had used generative artificial intelligence for schoolwork in 2025, according to College Board, a nonprofit that administers the SAT and AP exams.\\n\\nAs an assistant professor of school psychology studying artificial intelligence in K–12 education, I think the question is not only whether students are using AI to cheat, but whether there is evidence that learning actually happened.\\n\\nCheating and plagiarism are common worries\\n\\nI recently surveyed public school educators and administrators about how generative AI is affecting schools to better understand the answer to this question.\\n\\nMy study, conducted from spring 2025 to spring 2026, included 303 educators and other school professionals in Wisconsin – teachers, administrators, IT staff and technology directors, as well as school psychologists and counselors. I also surveyed another 132 professionals at schools across the country.\\n\\nThe results are not nationally representative, but they offer a snapshot of how some K–12 professionals are thinking about AI and student learning.\\n\\nWhile a large number of respondents were concerned about AI bias, misinformation and data privacy, the most common worries were about academic dishonesty and plagiarism.\\n\\nIn Wisconsin, approximately 65% of respondents identified these issues as a concern, compared with 74% who did so on a broader, national level.\\n\\nBut respondents also pointed to a deeper issue: How do teachers know what students actually understand when AI can generate essays, summaries or math steps in seconds?\\n\\nIn the Wisconsin sample, 47% of respondents who answered this question said that \\"difficulty in assessing student learning when AI is used\\" is a concern.\\n\\nThat figure increased to 53% in the national sample.\\n\\nWhen asked \\"What impact, if any, have you noticed AI has had on student behavior, mental health, or engagement?\\" respondents selected from a provided list of options. Among those options, 29% of Wisconsin respondents and 40% of respondents in the national sample selected \\"increased student reliance on AI,\\" while 19% and 33%, respectively, selected \\"reduced critical thinking or problem-solving.\\"\\n\\nFinished work is becoming harder to interpret\\n\\nTeachers have long known that a student's finished assignment is not perfect evidence of learning. A parent might help too much. A student might copy from a friend. A student might complete the work but not understand it well enough to explain it later.\\n\\nGenerative AI makes that problem more visible and more complicated.\\n\\nTake a common homework task, such as writing a paragraph explaining the theme of a short story. In the past, teachers looked at students' writing to understand whether they read the story, thought about the theme and could explain it in writing.\\n\\nNow, this kind of homework prompt may produce a result that appears organized, accurate and polished. But it is becoming harder for teachers to understand whether students actually understood the story, identified the theme and articulated it independently, or whether students simply entered a prompt into an AI tool.\\n\\nSome teachers do use AI-detection tools to determine whether students' work is original.\\n\\nIn a 2025 national survey of sixth- through 12th-grade public school teachers, 43% reported used these kinds of apps regularly, while another 27% had tested or experimented with them.\\n\\nBut these tools can make mistakes in both directions. One study of 14 AI-detection tools found false-positive rates as high as 50% and false-negative rates as high as 100%, depending on the tool. The same study found that about 20% of AI-generated texts were misclassified as human-written; that rose to about 52% when AI-written text was manually edited and 71% when it was machine-paraphrased. Other researchers found that detectors falsely flagged nonnative English writing as AI-generated at an average rate of 61.3%.\\n\\nI don't think that means schools should abandon writing assignments or homework altogether. But educators may need to be more intentional about what each assignment is supposed to measure.\\n\\nSome teachers are already making those kinds of changes, including asking students to show or explain their process, or asking them to include oral components to their written work or write more in class.\\n\\nSome teachers are also giving students paper-and-pencil tasks when they need to see students' independent thinking.\\n\\nIf the goal is writing fluency, teachers may need to see students write. If the goal is reading comprehension, they may need students to explain, apply or defend their thinking.\\n\\nClearer assignment rules may help\\n\\nMany schools are still deciding how to approach AI. In my survey, only 33% of Wisconsin respondents and 29% of national respondents said their district had a formal AI policy.\\n\\nTeachers and students alike could benefit from clarity on how and when they can use AI.\\n\\nResearchers who developed the Artificial Intelligence Assessment Scale, a tool that helps educators spell out when and how students can use AI on an assignment, have argued that educators should identify what level of AI use makes sense based on the learning outcomes being measured.\\n\\nThis mindset is useful because not all assignments are the same. One assignment might require no AI use because the teacher needs to see independent writing.\\n\\nAnother might allow AI for brainstorming but require students to submit original notes and a final reflection. Another might ask students to critique an AI-generated answer and explain what is accurate, incomplete or misleading.\\n\\nThe better question\\n\\nThe educators in my survey were not simply rejecting AI. Many reported using AI themselves for planning, communication, documentation, differentiation, administrative tasks and student-support activities.\\n\\nTheir concerns were more specific.\\n\\nThey were worried about academic dishonesty but also about assessment, student reliance, critical thinking, misinformation and privacy. Those concerns point to a practical challenge schools now face: how to preserve meaningful evidence of learning when AI can produce polished academic work.\\n\\nThe goal is not to catch every possible misuse of AI. That is likely impossible. The goal is to design learning tasks where teachers can still answer the question that matters most: What does this student actually understand?","vocabulary":[{"id":"v37","word":"plagiarism","phonetic":"/ˈpleɪdʒərɪzəm/","level":"key","meanings":["n. 剽窃；抄袭；剽窃行为"],"examples":[{"en":"The most common worries were about academic dishonesty and plagiarism.","zh":"最普遍的担忧是学术不诚实和剽窃。"}]},{"id":"v38","word":"assessment","phonetic":"/əˈsesmənt/","level":"key","meanings":["n. 评估；评价；评定"],"examples":[{"en":"Researchers developed the Artificial Intelligence Assessment Scale to help educators spell out when students can use AI.","zh":"研究人员开发了人工智能评估量表，帮助教育者明确学生何时可以使用 AI。"}]},{"id":"v39","word":"misinformation","phonetic":"/ˌmɪsˌfɔːmˈeɪʃn/","level":"key","meanings":["n. 错误信息；虚假信息；误传"],"examples":[{"en":"A large number of respondents were concerned about AI bias, misinformation and data privacy.","zh":"大量受访者担心 AI 偏见、虚假信息和数据隐私。"}]},{"id":"v40","word":"reliance","phonetic":"/rɪˈlaɪəns/","level":"key","meanings":["n. 依赖；依靠；信任"],"examples":[{"en":"Many educators reported increased student reliance on AI as a concern.","zh":"许多教育者将学生对 AI 依赖性的增加视为一项隐忧。"}]},{"id":"a37","word":"articulated","phonetic":"/ɑːˈtɪkjuleɪtɪd/","level":"advanced","meanings":["v. 清楚地表达；明确表述（articulate 的过去式/过去分词）"],"examples":[]},{"id":"a38","word":"differentiation","phonetic":"/ˌdɪfərenʃiˈeɪʃn/","level":"advanced","
