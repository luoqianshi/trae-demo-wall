<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnNote - 散落笔记汇聚助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #ecfdf5 100%);
            min-height: 100vh;
            color: #1f2937;
            padding: 20px;
        }
        .app { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(34,197,94,0.2);
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(120deg, #16a34a 0%, #22c55e 50%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .logo-icon { font-size: 56px; }
        .subtitle { color: #6b7280; font-size: 16px; }

        .upload-area {
            background: rgba(255,255,255,0.8);
            border: 2px dashed rgba(34,197,94,0.5);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-bottom: 30px;
            position: relative;
        }
        .upload-area:hover, .upload-area.dragover {
            background: rgba(34,197,94,0.05);
            border-color: rgba(34,197,94,0.8);
            transform: scale(1.02);
        }
        .upload-icon { font-size: 72px; margin-bottom: 20px; }
        .upload-title { font-size: 24px; font-weight: 600; color: #16a34a; margin-bottom: 10px; }
        .upload-desc { color: #6b7280; font-size: 16px; }
        .upload-desc span { color: #16a34a; text-decoration: underline; }
        .upload-btn {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border: none;
            color: #fff;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(34,197,94,0.4); }
        #fileInput { display: none; }

        .upload-preview {
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .upload-preview.show { display: block; }
        .preview-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #1f2937; }
        .preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .preview-item {
            background: rgba(34,197,94,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .preview-item.folder { color: #16a34a; }
        .preview-item.file { color: #374151; }
        .preview-item .icon { font-size: 14px; }
        .preview-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .preview-btn {
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }
        .preview-btn.primary {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
        }
        .preview-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(34,197,94,0.4); }
        .preview-btn.secondary {
            background: rgba(107,114,128,0.1);
            color: #6b7280;
        }
        .preview-btn.secondary:hover { background: rgba(107,114,128,0.2); }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(34,197,94,0.2);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(120deg, #16a34a, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 14px; color: #6b7280; margin-top: 8px; }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-btn {
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(34,197,94,0.2);
            color: #374151;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn:hover { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.4); }
        .filter-btn.active {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            padding: 10px 20px;
            color: #1f2937;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus { border-color: #16a34a; }
        .search-box::placeholder { color: #9ca3af; }
        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn.danger {
            background: rgba(239,68,68,0.1);
            color: #dc2626;
        }
        .action-btn.danger:hover { background: rgba(239,68,68,0.2); }
        .action-btn.primary {
            background: rgba(34,197,94,0.1);
            color: #16a34a;
        }
        .action-btn.primary:hover { background: rgba(34,197,94,0.2); }
        .action-btn.info {
            background: rgba(59,130,246,0.1);
            color: #3b82f6;
        }
        .action-btn.info:hover { background: rgba(59,130,246,0.2); }

        .batch-bar {
            display: none;
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            align-items: center;
            gap: 15px;
        }
        .batch-bar.show { display: flex; }
        .batch-count { font-weight: 600; color: #16a34a; }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .note-card {
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(34,197,94,0.2);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .note-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(34,197,94,0.15);
            border-color: rgba(34,197,94,0.4);
        }
        .note-card.selected {
            border-color: #16a34a;
            background: rgba(34,197,94,0.05);
        }
        .note-checkbox {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .note-card:hover .note-checkbox, .batch-bar.show ~ .notes-grid .note-card .note-checkbox { opacity: 1; }
        .note-card.selected .note-checkbox { opacity: 1; }
        .note-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .note-card:hover .note-actions { opacity: 1; }
        .note-action-btn {
            width: 28px;
            height: 28px;
            background: rgba(239,68,68,0.1);
            border: none;
            border-radius: 8px;
            color: #dc2626;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .note-action-btn.favorite {
            background: rgba(251,191,36,0.1);
            color: #f59e0b;
        }
        .note-action-btn.favorite.active {
            background: rgba(251,191,36,0.3);
            color: #d97706;
        }
        .note-action-btn.edit {
            background: rgba(59,130,246,0.1);
            color: #3b82f6;
        }
        .note-action-btn:hover { transform: scale(1.1); }
        .note-title { font-size: 18px; font-weight: 600; color: #1f2937; margin-bottom: 12px; line-height: 1.4; padding-left: 28px; }
        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-left: 28px;
        }
        .note-tag {
            background: rgba(34,197,94,0.15);
            color: #16a34a;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .note-tag:hover { background: rgba(34,197,94,0.25); }
        .note-date { font-size: 12px; color: #9ca3af; }
        .note-preview { font-size: 14px; color: #6b7280; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-left: 28px; }

        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.3; }
        .empty-title { font-size: 24px; color: #6b7280; margin-bottom: 10px; }
        .empty-desc { font-size: 16px; color: #9ca3af; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid rgba(34,197,94,0.2);
        }
        .modal-title { font-size: 20px; font-weight: 600; color: #1f2937; }
        .modal-close { background: none; border: none; color: #9ca3af; font-size: 24px; cursor: pointer; }
        .modal-body { padding: 24px; overflow-y: auto; max-height: calc(90vh - 100px); }
        .modal-content { color: #1f2937; line-height: 1.8; }
        .modal-content h1 { color: #16a34a; margin-bottom: 20px; }
        .modal-content h2 { color: #16a34a; margin-top: 24px; margin-bottom: 12px; }
        .modal-content h3 { color: #22c55e; margin-top: 20px; margin-bottom: 10px; }
        .modal-content p { margin-bottom: 12px; }
        .modal-content code {
            background: rgba(34,197,94,0.1);
            padding: 2px 8px;
            border-radius: 4px;
            color: #16a34a;
            font-family: 'Fira Code', monospace;
        }
        .modal-content pre {
            background: rgba(34,197,94,0.05);
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .modal-content ul, .modal-content ol { padding-left: 24px; margin-bottom: 12px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-input:focus { border-color: #16a34a; }
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.3s ease;
            min-height: 300px;
            font-family: inherit;
            resize: vertical;
        }
        .form-textarea:focus { border-color: #16a34a; }
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-select:focus { border-color: #16a34a; }
        .form-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 24px; }

        .tag-management { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(34,197,94,0.2); }
        .tag-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .tag-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34,197,94,0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .tag-item span { font-size: 14px; color: #16a34a; }
        .tag-item button {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(34,197,94,0.9);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .toast.error { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #60a5fa); }

        .tag-filter-group { display: flex; gap: 8px; flex-wrap: wrap; }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .upload-area { padding: 40px 20px; }
            .filters { flex-direction: column; align-items: stretch; }
            .search-box { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span>LearnNote</span>
            </div>
            <div class="subtitle">散落笔记汇聚助手 - 上传文件，自动整理分类</div>
        </div>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📂</div>
            <div class="upload-title">上传笔记文件或文件夹</div>
            <div class="upload-desc">点击或拖拽 <span>README.md</span> 文件或包含笔记的文件夹到此处</div>
            <button class="upload-btn">选择文件/文件夹</button>
            <input type="file" id="fileInput" webkitdirectory directory multiple onchange="handleFiles(this)">
        </div>

        <div class="upload-preview" id="uploadPreview">
            <div class="preview-title">📋 待处理文件列表</div>
            <div class="preview-list" id="previewList"></div>
            <div class="preview-actions">
                <button class="preview-btn secondary" onclick="clearPreview()">取消上传</button>
                <button class="preview-btn primary" onclick="processFiles()">✅ 整理分类并保存到本地</button>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">总笔记数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statToday">0</div>
                <div class="stat-label">今日笔记</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statWeek">0</div>
                <div class="stat-label">本周笔记</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statFavorites">0</div>
                <div class="stat-label">收藏笔记</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statTags">0</div>
                <div class="stat-label">标签类别</div>
            </div>
        </div>

        <div class="batch-bar" id="batchBar">
            <span class="batch-count">已选择 <span id="batchCount">0</span> 条笔记</span>
            <button class="action-btn info" onclick="batchChangeTag()">🏷️ 批量修改标签</button>
            <button class="action-btn danger" onclick="batchDelete()">🗑️ 批量删除</button>
            <button class="action-btn secondary" onclick="clearSelection()">✕ 取消选择</button>
        </div>

        <div class="filters" id="filters" style="display: none;">
            <div class="tag-filter-group" id="tagFilters"></div>
            <div class="tag-filter-group" id="timeFilters"></div>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索笔记...">
            <button class="action-btn info" onclick="toggleSelectMode()">☑️ 选择模式</button>
            <button class="action-btn primary" onclick="exportNotes()">📥 导出笔记</button>
            <button class="action-btn danger" onclick="clearAllNotes()">🗑️ 清空所有</button>
        </div>

        <div class="notes-grid" id="notesGrid">
            <div class="empty-state">
                <div class="empty-icon">📝</div>
                <div class="empty-title">暂无笔记</div>
                <div class="empty-desc">点击上方区域上传笔记文件或文件夹</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">笔记详情</div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="editModalTitle">编辑笔记</div>
                <button class="modal-close" id="editModalClose">✕</button>
            </div>
            <div class="modal-body" id="editModalBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="tagModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="tagModalTitle">标签管理</div>
                <button class="modal-close" id="tagModalClose">✕</button>
            </div>
            <div class="modal-body" id="tagModalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewList = document.getElementById('previewList');
        const notesGrid = document.getElementById('notesGrid');
        const searchBox = document.getElementById('searchBox');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');
        const editModalOverlay = document.getElementById('editModalOverlay');
        const editModalTitle = document.getElementById('editModalTitle');
        const editModalBody = document.getElementById('editModalBody');
        const editModalClose = document.getElementById('editModalClose');
        const tagModalOverlay = document.getElementById('tagModalOverlay');
        const tagModalTitle = document.getElementById('tagModalTitle');
        const tagModalBody = document.getElementById('tagModalBody');
        const tagModalClose = document.getElementById('tagModalClose');
        const toast = document.getElementById('toast');
        const stats = document.getElementById('stats');
        const filters = document.getElementById('filters');
        const tagFilters = document.getElementById('tagFilters');
        const timeFilters = document.getElementById('timeFilters');
        const batchBar = document.getElementById('batchBar');
        const batchCount = document.getElementById('batchCount');

        let selectedFiles = [];
        let currentFilter = { tag: 'all', time: 'all', search: '' };
        let selectedNotes = new Set();
        let allNotes = [];
        let tagList = [];

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFilesFromDrop(e.dataTransfer.files);
        });

        function handleFiles(input) {
            handleFilesFromDrop(input.files);
        }

        function handleFilesFromDrop(files) {
            selectedFiles = Array.from(files)
                .filter(file => file.name.toLowerCase().endsWith('.md') || file.name.toLowerCase().endsWith('.markdown'));

            if (selectedFiles.length === 0) {
                showToast('未找到有效的 Markdown 文件', 'error');
                return;
            }

            renderPreview();
            uploadPreview.classList.add('show');
            showToast(`已选择 ${selectedFiles.length} 个文件`, 'info');
        }

        function renderPreview() {
            previewList.innerHTML = selectedFiles.map((file, index) => `
                <div class="preview-item file">
                    <span class="icon">📄</span>
                    <span>${file.name}</span>
                </div>
            `).join('');
        }

        function clearPreview() {
            selectedFiles = [];
            uploadPreview.classList.remove('show');
            previewList.innerHTML = '';
        }

        async function processFiles() {
            if (selectedFiles.length === 0) return;

            showToast('正在处理文件...', 'info');

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('notes', file);
            });

            try {
                const response = await fetch('/api/notes/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    let message = `处理完成！成功整理 ${result.count} 条笔记`;
                    if (result.skipped > 0) {
                        message += `，跳过 ${result.skipped} 个非 .md 文件`;
                    }
                    showToast(message, 'success');
                    clearPreview();
                    await loadNotes();
                    await loadStats();
                    await loadTags();
                    stats.style.display = 'grid';
                    filters.style.display = 'flex';
                } else {
                    showToast(result.error || '处理失败', 'error');
                }
            } catch (err) {
                showToast('网络错误，请检查服务是否启动', 'error');
            }
        }

        async function loadNotes() {
            let url = '/api/notes';
            const params = [];

            if (currentFilter.tag !== 'all') params.push(`tag=${encodeURIComponent(currentFilter.tag)}`);
            if (currentFilter.time !== 'all') params.push(`time=${currentFilter.time}`);
            if (currentFilter.search) params.push(`search=${encodeURIComponent(currentFilter.search)}`);

            if (params.length > 0) url += '?' + params.join('&');

            try {
                const response = await fetch(url);
                allNotes = await response.json();
                renderNotes(allNotes);
            } catch (err) {
                showToast('加载笔记失败', 'error');
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('statTotal').textContent = data.total;
                document.getElementById('statToday').textContent = data.today;
                document.getElementById('statWeek').textContent = data.week;
                document.getElementById('statFavorites').textContent = data.favorites || 0;
                document.getElementById('statTags').textContent = (data.tags || []).length;
            } catch (err) {
                console.error('加载统计失败', err);
            }
        }

        async function loadTags() {
            try {
                const response = await fetch('/api/tags');
                tagList = await response.json();

                tagFilters.innerHTML = ['全部', '收藏', ...tagList].map(tag =>
                    `<button class="filter-btn ${tag === '全部' ? 'active' : ''}" data-tag="${tag === '全部' ? 'all' : tag === '收藏' ? 'favorites' : tag}" onclick="setFilter('tag', '${tag === '全部' ? 'all' : tag === '收藏' ? 'favorites' : tag}')">${tag}</button>`
                ).join('');
            } catch (err) {
                console.error('加载标签失败', err);
            }
        }

        window.setFilter = function(type, value) {
            currentFilter[type] = value;
            document.querySelectorAll(`.filter-btn[data-${type}]`).forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-${type}="${value}"]`)?.classList.add('active');
            loadNotes();
        };

        searchBox.addEventListener('input', (e) => {
            currentFilter.search = e.target.value;
            loadNotes();
        });

        window.clearAllNotes = async function() {
            if (!confirm('确定要清空所有笔记吗？此操作不可恢复。')) return;

            try {
                const response = await fetch('/api/notes', { method: 'DELETE' });
                const result = await response.json();

                if (result.success) {
                    showToast('已清空所有笔记', 'success');
                    stats.style.display = 'none';
                    filters.style.display = 'none';
                    batchBar.classList.remove('show');
                    selectedNotes.clear();
                    notesGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <div class="empty-title">暂无笔记</div>
                            <div class="empty-desc">点击上方区域上传笔记文件或文件夹</div>
                        </div>
                    `;
                } else {
                    showToast('清空失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        function renderNotes(notes) {
            if (!notes || notes.length === 0) {
                notesGrid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">没有找到笔记</div><div class="empty-desc">尝试调整筛选条件</div></div>`;
                return;
            }

            notesGrid.innerHTML = notes.map(note => `
                <div class="note-card ${selectedNotes.has(note.id) ? 'selected' : ''}" onclick="openNote(${note.id})">
                    <input type="checkbox" class="note-checkbox" ${selectedNotes.has(note.id) ? 'checked' : ''} onchange="toggleNoteSelection(${note.id}, this.checked)">
                    <div class="note-actions">
                        <button class="note-action-btn favorite ${note.is_favorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${note.id}, this)">❤️</button>
                        <button class="note-action-btn edit" onclick="event.stopPropagation(); openEditNote(${note.id})">✏️</button>
                        <button class="note-action-btn" onclick="event.stopPropagation(); deleteNote(${note.id})">🗑️</button>
                    </div>
                    <div class="note-title">${escapeHtml(note.title)}</div>
                    <div class="note-meta">
                        <span class="note-tag" onclick="event.stopPropagation(); openTagModal(${note.id})">${note.tag}</span>
                        <span class="note-date">${formatDate(note.created_at)}</span>
                    </div>
                    <div class="note-preview">${escapeHtml(note.content.substring(0, 100))}${note.content.length > 100 ? '...' : ''}</div>
                </div>
            `).join('');
        }

        window.toggleNoteSelection = function(id, checked) {
            if (checked) {
                selectedNotes.add(id);
            } else {
                selectedNotes.delete(id);
            }
            updateBatchBar();
        };

        window.toggleSelectMode = function() {
            if (selectedNotes.size > 0) {
                selectedNotes.clear();
                batchBar.classList.remove('show');
            } else {
                batchBar.classList.add('show');
            }
            loadNotes();
        };

        function updateBatchBar() {
            batchCount.textContent = selectedNotes.size;
            if (selectedNotes.size > 0) {
                batchBar.classList.add('show');
            } else {
                batchBar.classList.remove('show');
            }
        }

        window.clearSelection = function() {
            selectedNotes.clear();
            updateBatchBar();
            loadNotes();
        };

        window.openNote = async function(id) {
            try {
                const response = await fetch(`/api/notes/${id}`);
                const note = await response.json();

                if (note.error) {
                    showToast(note.error, 'error');
                    return;
                }

                modalTitle.textContent = note.title;
                modalContent.innerHTML = markdownToHtml(note.content);
                modalOverlay.classList.add('active');
            } catch (err) {
                showToast('加载笔记详情失败', 'error');
            }
        };

        window.openEditNote = async function(id) {
            try {
                const response = await fetch(`/api/notes/${id}`);
                const note = await response.json();

                if (note.error) {
                    showToast(note.error, 'error');
                    return;
                }

                editModalTitle.textContent = '编辑笔记';
                editModalBody.innerHTML = `
                    <input type="hidden" id="editNoteId" value="${note.id}">
                    <div class="form-group">
                        <label class="form-label">标题</label>
                        <input type="text" class="form-input" id="editTitle" value="${escapeHtml(note.title)}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">标签</label>
                        <select class="form-select" id="editTag">
                            ${tagList.map(t => `<option value="${t}" ${t === note.tag ? 'selected' : ''}>${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">内容</label>
                        <textarea class="form-textarea" id="editContent">${escapeHtml(note.content)}</textarea>
                    </div>
                    <div class="form-actions">
                        <button class="preview-btn secondary" onclick="editModalOverlay.classList.remove('active')">取消</button>
                        <button class="preview-btn primary" onclick="saveNote()">保存修改</button>
                    </div>
                `;
                editModalOverlay.classList.add('active');
            } catch (err) {
                showToast('加载笔记失败', 'error');
            }
        };

        window.saveNote = async function() {
            const id = parseInt(document.getElementById('editNoteId').value);
            const title = document.getElementById('editTitle').value.trim();
            const tag = document.getElementById('editTag').value;
            const content = document.getElementById('editContent').value;

            if (!title) {
                showToast('请输入标题', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/notes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, tag, content })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('保存成功', 'success');
                    editModalOverlay.classList.remove('active');
                    await loadNotes();
                    await loadStats();
                } else {
                    showToast(result.error || '保存失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        window.toggleFavorite = async function(id, btn) {
            try {
                const response = await fetch(`/api/notes/${id}/favorite`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    btn.classList.toggle('active');
                    showToast('收藏状态已更新', 'success');
                    await loadStats();
                } else {
                    showToast('操作失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        window.openTagModal = async function(noteId) {
            try {
                const response = await fetch(`/api/notes/${noteId}`);
                const note = await response.json();

                tagModalTitle.textContent = '修改标签';
                tagModalBody.innerHTML = `
                    <input type="hidden" id="tagNoteId" value="${noteId}">
                    <div class="form-group">
                        <label class="form-label">当前标签</label>
                        <div class="note-tag">${note.tag}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">选择新标签</label>
                        <select class="form-select" id="newTag">
                            ${tagList.map(t => `<option value="${t}" ${t === note.tag ? 'selected' : ''}>${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="preview-btn secondary" onclick="tagModalOverlay.classList.remove('active')">取消</button>
                        <button class="preview-btn primary" onclick="changeNoteTag()">保存修改</button>
                    </div>
                    <div class="tag-management">
                        <div class="form-group">
                            <label class="form-label">添加新标签</label>
                            <input type="text" class="form-input" id="newTagName" placeholder="输入新标签名称">
                        </div>
                        <button class="preview-btn primary" onclick="addNewTag()">添加标签</button>
                    </div>
                `;
                tagModalOverlay.classList.add('active');
            } catch (err) {
                showToast('加载失败', 'error');
            }
        };

        window.changeNoteTag = async function() {
            const id = parseInt(document.getElementById('tagNoteId').value);
            const tag = document.getElementById('newTag').value;

            try {
                const response = await fetch(`/api/notes/${id}/tag`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('标签已更新', 'success');
                    tagModalOverlay.classList.remove('active');
                    await loadNotes();
                    await loadTags();
                } else {
                    showToast(result.error || '更新失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        window.addNewTag = async function() {
            const name = document.getElementById('newTagName').value.trim();
            if (!name) {
                showToast('请输入标签名称', 'error');
                return;
            }

            try {
                const response = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('标签已添加', 'success');
                    document.getElementById('newTagName').value = '';
                    await loadTags();
                    const tagSelect = document.getElementById('newTag');
                    if (tagSelect) {
                        tagSelect.innerHTML = tagList.map(t => `<option value="${t}">${t}</option>`).join('');
                    }
                } else {
                    showToast(result.error || '添加失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        window.batchChangeTag = function() {
            const ids = Array.from(selectedNotes);
            if (ids.length === 0) return;

            const tag = prompt('请输入要设置的标签:', '');
            if (!tag) return;

            ids.forEach(async id => {
                try {
                    await fetch(`/api/notes/${id}/tag`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tag })
                    });
                } catch (err) {
                    console.error('批量修改标签失败', err);
                }
            });

            showToast(`已批量修改 ${ids.length} 条笔记的标签`, 'success');
            clearSelection();
            setTimeout(() => loadNotes(), 500);
            setTimeout(() => loadTags(), 500);
        };

        window.batchDelete = async function() {
            const ids = Array.from(selectedNotes);
            if (ids.length === 0) return;

            if (!confirm(`确定要删除选中的 ${ids.length} 条笔记吗？`)) return;

            try {
                const response = await fetch('/api/notes/batch', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids })
                });

                const result = await response.json();

                if (result.success) {
                    showToast(`已删除 ${result.count} 条笔记`, 'success');
                    clearSelection();
                    await loadNotes();
                    await loadStats();
                } else {
                    showToast(result.error || '删除失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        window.exportNotes = function() {
            const format = prompt('请选择导出格式:', 'md');
            if (!format) return;

            const url = `/api/notes/export?format=${format}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = `learnnote-export.${format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('导出成功', 'success');
        };

        window.deleteNote = async function(id) {
            if (!confirm('确定要删除这条笔记吗？')) return;

            try {
                const response = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
                const result = await response.json();

                if (result.success) {
                    showToast('已删除', 'success');
                    selectedNotes.delete(id);
                    updateBatchBar();
                    await loadNotes();
                    await loadStats();
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        };

        function markdownToHtml(markdown) {
            return markdown
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/```(\w*)\n([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/\n/gim, '<br>');
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const diff = Date.now() - date.getTime();
            const days = Math.floor(diff / (24 * 60 * 60 * 1000));
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        timeFilters.innerHTML = [
            { label: '全部', value: 'all' },
            { label: '今日', value: 'today' },
            { label: '本周', value: 'week' }
        ].map(t =>
            `<button class="filter-btn ${t.value === 'all' ? 'active' : ''}" data-time="${t.value}" onclick="setFilter('time', '${t.value}')">${t.label}</button>`
        ).join('');

        modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        editModalClose.addEventListener('click', () => editModalOverlay.classList.remove('active'));
        editModalOverlay.addEventListener('click', (e) => {
            if (e.target === editModalOverlay) editModalOverlay.classList.remove('active');
        });

        tagModalClose.addEventListener('click', () => tagModalOverlay.classList.remove('active'));
        tagModalOverlay.addEventListener('click', (e) => {
            if (e.target === tagModalOverlay) tagModalOverlay.classList.remove('active');
        });

        loadNotes();
        loadStats();
        loadTags();
    </script>
</body>
</html>
