<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人间还行｜美好收集器</title>
  <style>
    :root {
      --cream: #faf6ef;
      --cream-deep: #f5efe3;
      --paper: #fffdf8;
      --ink: #2c2416;
      --ink-soft: #5c4f3d;
      --muted: #8a7d6b;
      --green: #2d6a4f;
      --green-soft: #e8f5e9;
      --green-hover: #1b4332;
      --brown: #bc6c25;
      --brown-soft: #faecd8;
      --coral: #e07a5f;
      --coral-soft: #fde2d4;
      --rose: #d4a5a5;
      --rose-soft: #f8e8e8;
      --mint: #81b29a;
      --mint-soft: #e0f0e6;
      --gold: #d4a574;
      --gold-soft: #faf0e0;
      --sky: #7eb5d6;
      --sky-soft: #e0f0fa;
      --hairline: #e8e0d0;
      --shadow-sm: 0 2px 8px rgba(44,36,22,.06);
      --shadow-md: 0 8px 30px rgba(44,36,22,.1);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 导航 ===== */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      max-width: 960px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.2px;
    }
    .brand-dot {
      width: 34px; height: 34px;
      border-radius: var(--radius-pill);
      background: var(--gold);
      display: grid; place-items: center;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(188,108,37,.2);
    }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      transition: all .2s;
    }
    .nav-links a:hover { background: var(--cream-deep); color: var(--ink); }

    /* ===== Hero ===== */
    .hero {
      text-align: center;
      padding: 56px 24px 44px;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: -60px;
      background:
        radial-gradient(ellipse 600px 400px at 30% 40%, rgba(224,122,95,.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 70% 50%, rgba(129,178,154,.14) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 50% 20%, rgba(212,165,116,.10) 0%, transparent 70%);
      pointer-events: none;
      animation: heroFloat 12s ease-in-out infinite alternate;
    }
    @keyframes heroFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-20px, 10px) scale(1.04); }
    }

    /* ===== 报纸飘入动画 ===== */
    .newspaper-fly {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 10;
      pointer-events: none;
      transform-origin: center center;
      animation: paperFlyIn 2.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    @keyframes paperFlyIn {
      0% {
        transform: translate(-280%, -48%) rotate(-18deg) scale(0.55);
        opacity: 1;
      }
      55% {
        transform: translate(6%, -46%) rotate(2deg) scale(0.82);
        opacity: 1;
      }
      75% {
        transform: translate(-3%, -47%) rotate(-1deg) scale(0.78);
        opacity: 1;
      }
      90% {
        transform: translate(1%, -48%) rotate(0.3deg) scale(0.76);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -48%) rotate(0deg) scale(0.72);
        opacity: 0;
      }
    }
    .np-page {
      width: 320px;
      background: #f5f0e3;
      border-radius: 4px;
      padding: 22px 20px;
      box-shadow: 6px 8px 30px rgba(44,36,22,.18), 2px 3px 10px rgba(44,36,22,.1);
      position: relative;
      transform-origin: left center;
    }
    .np-page::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      box-shadow: inset 0 0 40px rgba(44,36,22,.06);
      pointer-events: none;
    }
    .np-header {
      text-align: center;
      border-bottom: 2.5px solid #3d2b1f;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .np-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #2c2416;
    }
    .np-subtitle {
      font-size: 9px;
      color: #8a7d6b;
      margin-top: 3px;
      letter-spacing: 1px;
    }
    .np-cols {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .np-col-line {
      height: 3px;
      background: #c4b49a;
      border-radius: 2px;
      margin-bottom: 6px;
    }
    .np-col-line:nth-child(2) { width: 85%; }
    .np-col-line:nth-child(3) { width: 92%; }
    .np-col-line:nth-child(4) { width: 60%; opacity: .5; }
    .np-col-title {
      font-size: 8px;
      font-weight: 700;
      color: #5c4f3d;
      margin-bottom: 5px;
      padding-bottom: 3px;
      border-bottom: 1px solid #c4b49a88;
    }
    .np-col-block {
      background: #e8e0d0;
      border-radius: 3px;
      height: 32px;
      margin-top: 8px;
      opacity: .4;
    }

    /* Hero 内容入场（报纸消失后） */
    .hero-content {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: heroContentIn 0.8s ease 2.2s forwards;
    }
    @keyframes heroContentIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--brown-soft);
      color: var(--brown);
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .hero h1 {
      font-size: clamp(34px, 5.5vw, 52px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, var(--ink) 0%, var(--brown) 50%, var(--coral) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShimmer 6s ease-in-out infinite alternate;
    }
    @keyframes titleShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .hero-sub {
      font-size: 17px;
      color: var(--muted);
      max-width: 500px;
      margin: 0 auto 28px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      position: relative;
      z-index: 1;
    }
    .hero-stat {
      text-align: center;
    }
    .hero-stat-num {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -1px;
      color: var(--ink);
    }
    .hero-stat-num.coral { color: var(--coral); }
    .hero-stat-num.green { color: var(--green); }
    .hero-stat-num.gold { color: var(--brown); }
    .hero-stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ===== 老虎机 ===== */
    .slot-machine {
      max-width: 480px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }
    .slot-body {
      background: linear-gradient(160deg, #5c3a1e 0%, #3d2410 50%, #2a1808 100%);
      border-radius: 32px;
      padding: 28px 24px 24px;
      position: relative;
      box-shadow: 0 12px 40px rgba(44,36,22,.3), inset 0 2px 4px rgba(255,255,255,.08);
      border: 3px solid #7a5230;
    }
    .slot-top-bar {
      text-align: center;
      margin-bottom: 16px;
    }
    .slot-marquee {
      display: inline-block;
      padding: 4px 16px;
      background: linear-gradient(90deg, #d4a574, #e8c89a, #d4a574);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #3d2410;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(212,165,116,.3);
    }
    .slot-coin-slot {
      width: 60px;
      height: 8px;
      background: #1a0e04;
      border-radius: 4px;
      margin: 0 auto 12px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
      position: relative;
    }
    .slot-coin-slot::after {
      content: '';
      position: absolute;
      top: -3px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 3px;
      background: #5a3a1a;
      border-radius: 2px;
    }
    .slot-reels {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
      padding: 16px;
      background: #1a0e04;
      border-radius: 16px;
      box-shadow: inset 0 4px 12px rgba(0,0,0,.6);
      position: relative;
    }
    .slot-reel {
      width: 80px;
      height: 110px;
      overflow: hidden;
      background: #faf6ef;
      border-radius: 10px;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.2);
      border: 2px solid #8a6a3a;
    }
    .slot-reel-strip {
      position: absolute;
      width: 100%;
      top: 0;
      transition: none;
    }
    .slot-symbol {
      width: 80px;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .slot-symbol .sym-emoji {
      font-size: 36px;
      line-height: 1;
    }
    .slot-symbol .sym-label {
      font-size: 9px;
      font-weight: 700;
      color: #5c4f3d;
      letter-spacing: 0.5px;
    }
    .slot-reel.spinning .slot-reel-strip {
      animation: reelSpin 0.12s linear infinite;
    }
    @keyframes reelSpin {
      0% { transform: translateY(0); }
      100% { transform: translateY(-110px); }
    }
    .slot-reel-glow {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(255,215,0,.3);
      opacity: 0;
      transition: opacity .3s;
    }
    .slot-reel.winner .slot-reel-glow {
      opacity: 1;
      animation: winGlow 0.5s ease infinite alternate;
    }
    @keyframes winGlow {
      0% { box-shadow: inset 0 0 10px rgba(255,215,0,.3); }
      100% { box-shadow: inset 0 0 30px rgba(255,215,0,.6); }
    }

    /* 扳手 */
    .slot-lever {
      position: absolute;
      right: -36px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .slot-lever:active, .slot-lever.pulled {
      transform: translateY(-50%) translateY(30px) rotate(10deg);
    }
    .slot-lever-base {
      width: 14px;
      height: 40px;
      background: linear-gradient(90deg, #666, #888, #666);
      border-radius: 7px 7px 0 0;
    }
    .slot-lever-arm {
      width: 14px;
      height: 50px;
      background: linear-gradient(90deg, #c41e3a, #e04050, #c41e3a);
      border-radius: 7px;
      margin-top: -2px;
    }
    .slot-lever-knob {
      width: 28px;
      height: 28px;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c41e3a);
      border-radius: 50%;
      margin: -4px auto 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.4), inset -2px -2px 4px rgba(0,0,0,.2);
    }
    @media (max-width: 540px) {
      .slot-lever { right: -24px; }
      .slot-lever-base, .slot-lever-arm { width: 10px; }
      .slot-lever-knob { width: 22px; height: 22px; }
    }

    /* 控制按钮 */
    .slot-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    .slot-btn-coin {
      padding: 12px 24px;
      background: linear-gradient(135deg, #d4a574, #bc6c25);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(188,108,37,.3);
      transition: all .2s;
      font-family: inherit;
    }
    .slot-btn-coin:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(188,108,37,.4); }
    .slot-btn-coin:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .slot-btn-pull {
      padding: 12px 24px;
      background: linear-gradient(135deg, #2d6a4f, #1b4332);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(45,106,79,.3);
      transition: all .2s;
      font-family: inherit;
      opacity: .4;
      pointer-events: none;
    }
    .slot-btn-pull.ready {
      opacity: 1;
      pointer-events: auto;
      animation: pulseGreen 1.5s ease infinite;
    }
    .slot-btn-pull.ready:hover { transform: translateY(-2px); }
    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 4px 12px rgba(45,106,79,.3); }
      50% { box-shadow: 0 4px 20px rgba(45,106,79,.6); }
    }
    .slot-status {
      text-align: center;
      color: #d4a574;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 18px;
      letter-spacing: 0.5px;
    }

    /* 投币动画 */
    .coin-fly {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f4d35e, #d4a574);
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
    }
    .coin-fly.flying {
      animation: coinFly 0.6s ease-in forwards;
    }
    @keyframes coinFly {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      60% { opacity: 1; }
      100% { opacity: 0; transform: scale(0.4) rotate(360deg) translateY(-40px); }
    }

    /* 隐藏的原输入元素（保留供JS引用） */
    .hidden-inputs { display: none; }
    .input-panel {
      max-width: 580px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }
    .input-card {
      background: var(--paper);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--hairline);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }
    .field select, .field textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--hairline);
      border-radius: var(--radius-sm);
      background: var(--cream);
      font-size: 15px;
      color: var(--ink);
      font-family: inherit;
      outline: none;
      transition: all .2s;
    }
    .field select:focus, .field textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px var(--green-soft);
    }
    .field textarea { resize: vertical; min-height: 90px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--hairline);
      background: var(--paper);
      color: var(--ink-soft);
      transition: all .2s;
      user-select: none;
    }
    .chip:hover { border-color: var(--gold); color: var(--brown); }
    .chip.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* ===== 按钮 ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-primary {
      background: var(--green);
      color: #fff;
      box-shadow: 0 4px 14px rgba(45,106,79,.25);
    }
    .btn-primary:hover { background: var(--green-hover); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--paper);
      color: var(--ink);
      border: 1.5px solid var(--hairline);
    }
    .btn-secondary:hover { background: var(--cream-deep); }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }

    /* ===== 吐卡口 + 吐出的卡片 ===== */
    .slot-dispenser {
      width: 100%;
      height: 12px;
      background: #1a0e04;
      border-radius: 6px;
      margin: 0 auto 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
      position: relative;
      overflow: hidden;
    }
    .slot-dispenser::after {
      content: '';
      position: absolute;
      top: -2px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 6px;
      background: #0a0602;
      border-radius: 3px;
    }

    .card-dispense-area {
      perspective: 800px;
      max-height: 0;
      overflow: hidden;
      transition: max-height .6s ease;
    }
    .card-dispense-area.active {
      max-height: 1000px;
    }

    .dispensed-card {
      max-width: 420px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(-40px) rotateX(60deg) scale(0.8);
      transition: none;
    }
    .dispensed-card.emerging {
      animation: cardEmerge 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    @keyframes cardEmerge {
      0% {
        opacity: 0;
        transform: translateY(-60px) rotateX(75deg) scale(0.7);
      }
      40% {
        opacity: 0.6;
        transform: translateY(-30px) rotateX(30deg) scale(0.9);
      }
      70% {
        opacity: 1;
        transform: translateY(8px) rotateX(-5deg) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    /* 吐出的卡片内容 */
    .emerge-card {
      background: var(--paper);
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 12px 40px rgba(44,36,22,.15), 0 4px 12px rgba(44,36,22,.08);
      border: none;
      overflow: hidden;
      line-height: 0;
    }
    .emerge-card #shareCanvas {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
      border-radius: 20px;
    }
    .emerge-card-head {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--hairline);
    }
    .emerge-card-date {
      display: inline-block;
      padding: 4px 14px;
      background: var(--gold-soft);
      color: var(--brown);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .emerge-card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.5px;
    }
    .emerge-card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .emerge-story {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .emerge-story:last-of-type { border-bottom: none; }
    .emerge-story-emoji {
      font-size: 24px;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: var(--surface);
      border-radius: 12px;
    }
    .emerge-story-body { flex: 1; }
    .emerge-story-type {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .emerge-story-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
    }
    .emerge-story-summary {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.5;
    }
    .emerge-card-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 2px dashed var(--hairline);
    }
    .emerge-quote {
      font-size: 13px;
      font-style: italic;
      color: var(--coral);
      margin-bottom: 12px;
    }

// ===================== 美好指数 =====================
function calcGoodness(stories) {
  var score = 0;
  stories.forEach(function(s) {
    if (s.credibility.indexOf('高') === 0) score += 35;
    else if (s.credibility.indexOf('中') === 0) score += 25;
    else score += 15;
  });
  score = Math.min(98, Math.max(60, score + Math.floor(Math.random() * 10)));
  return score;
}

function renderGoodness(stories) {
  var score = calcGoodness(stories);
  var el = document.getElementById('goodnessIndex');
  var level, desc, color, bg;
  if (score >= 88) { level = '非常美好'; desc = '人间值得，美好证据充足'; color = '#2d6a4f'; bg = '#e8f5e9'; }
  else if (score >= 75) { level = '挺不错的'; desc = '世界正在悄悄变好'; color = '#bc6c25'; bg = '#faecd8'; }
  else { level = '小确幸'; desc = '美好藏在细节里，仔细看'; color = '#e07a5f'; bg = '#fde2d4'; }
  el.innerHTML =
    '<div class="goodness-index">' +
      '<div class="gi-circle" style="color:' + color + ';background:' + bg + ';border-color:' + color + '">' + score + '</div>' +
      '<div class="gi-info">' +
        '<div class="gi-label">今日美好指数 · ' + level + '</div>' +
        '<div class="gi-desc">' + desc + '</div>' +
      '</div>' +
    '</div>';
}

// ===================== 匹配逻辑 =====================
function matchStories(theme, keywords) {
  const kwArr = keywords.toLowerCase().split(/[\s,，、]+/).filter(Boolean);
  let pool = storyDB;

  if (theme !== 'all') {
    pool = pool.filter(s => s.type === theme);
  }

  if (kwArr.length === 0) {
    return shuffle([...pool]).slice(0, 3);
  }

  const scored = pool.map(s => {
    let score = 0;
    const text = (s.title + s.summary + s.tags.join(' ') + s.reason).toLowerCase();
    kwArr.forEach(kw => {
      if (text.includes(kw)) score += 2;
      if (s.tags.some(t => t.includes(kw))) score += 3;
    });
    return { story: s, score };
  });

  scored.sort((a, b) => b.score - a.score);

  const matched = scored.filter(s => s.score > 0).map(s => s.story);
  const remaining = scored.filter(s => s.score === 0).map(s => s.story);
  const result = matched.slice(0, 3);
  if (result.length < 3) {
    result.push(...shuffle(remaining).slice(0, 3 - result.length));
  }
  return result;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===================== Canvas 竖版报纸风格 =====================
const paperStyles = [
  { bg: '#f5f0e3', ink: '#2c2416', accent: '#8b4513', line: '#c4b49a' },
  { bg: '#ede8d8', ink: '#1a1a2e', accent: '#16213e', line: '#a8a39a' },
  { bg: '#f0ebe0', ink: '#3d2b1f', accent: '#6b4423', line: '#c4b49a' },
  { bg: '#e8e0d0', ink: '#2c3e50', accent: '#34495e', line: '#b0a898' },
];

function drawCanvas() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const style = paperStyles[canvasStyleIndex % paperStyles.length];
  const stories = currentStories.slice(0, 3);
  const date = new Date();
  const dateStr = date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  const weekday = date.toLocaleDateString('zh-CN', { weekday: 'long' });

  const W = 420, H = 680;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // 新闻纸背景
  ctx.fillStyle = style.bg;
  ctx.fillRect(0, 0, W, H);

  // 微纹理（细点）
  ctx.fillStyle = style.line + '20';
  for (let i = 0; i < W; i += 4) {
    for (let j = 0; j < H; j += 4) {
      if (Math.random() > 0.85) ctx.fillRect(i, j, 1, 1);
    }
  }

  // 边距
  const M = 32;

  // === 报头 ===
  ctx.fillStyle = style.ink;
  ctx.font = 'bold 36px "Songti SC", "STSong", Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('美好日报', W / 2, M + 40);

  // 报头装饰线
  ctx.beginPath();
  ctx.moveTo(M, M + 52);
  ctx.lineTo(W - M, M + 52);
  ctx.strokeStyle = style.accent;
  ctx.lineWidth = 2;
  ctx.stroke();

  // 副标题
  ctx.font = '13px -apple-system, sans-serif';
  ctx.fillStyle = style.accent;
  ctx.fillText('PROOF OF GOOD · 不是鸡汤，是真实证据', W / 2, M + 72);

  // 日期栏
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = style.ink + 'aa';
  ctx.fillText(`${dateStr}  ${weekday}  第 001 期`, W / 2, M + 92);

  // 分隔线
  ctx.beginPath();
  ctx.moveTo(M, M + 104);
  ctx.lineTo(W - M, M + 104);
  ctx.strokeStyle = style.line;
  ctx.lineWidth = 1;
  ctx.stroke();

  // === 辅助：Canvas 自动换行 ===
  const textW = W - M * 2; // 文字可用宽度
  function wrapText(text, font, maxLines) {
    ctx.font = font;
    var lines = [];
    var line = '';
    for (var ci = 0; ci < text.length; ci++) {
      var testLine = line + text[ci];
      if (ctx.measureText(testLine).width > textW && line.length > 0) {
        lines.push(line);
        line = text[ci];
        if (lines.length >= maxLines) { lines[maxLines - 1] += '…'; return lines; }
      } else {
        line = testLine;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // === 文章列表 ===
  let y = M + 136;
  var storyH = Math.floor((H - M - 80 - y) / stories.length); // 每篇可用高度
  stories.forEach(function(s, i) {
    var blockEnd = i < stories.length - 1 ? y + storyH : H - M - 56;

    // 编号框
    ctx.fillStyle = style.accent;
    ctx.fillRect(M, y - 12, 22, 18);
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), M + 11, y + 1);
    ctx.textAlign = 'left';

    // 类型标签
    ctx.font = '600 10px sans-serif';
    ctx.fillStyle = style.accent;
    ctx.fillText('[' + s.typeLabel + ']', M + 30, y + 1);

    // 标题（自动换行，最多2行）
    y += 20;
    ctx.font = '600 15px -apple-system, sans-serif';
    ctx.fillStyle = style.ink;
    var titleLines = wrapText(s.title, ctx.font, 2);
    titleLines.forEach(function(ln) { ctx.fillText(ln, M, y); y += 19; });

    // 摘要（自动换行，最多3行）
    y += 4;
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillStyle = style.ink + 'cc';
    var summaryLines = wrapText(s.summary, ctx.font, 3);
    summaryLines.forEach(function(ln) { ctx.fillText(ln, M, y); y += 17; });

    // 分隔线
    y += 8;
    if (y < blockEnd) {
      ctx.beginPath();
      ctx.moveTo(M, y);
      ctx.lineTo(W - M, y);
      ctx.strokeStyle = style.line;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    y = blockEnd + 6;
  });

  // === 底部栏 ===
  ctx.beginPath();
  ctx.moveTo(M, H - M - 40);
  ctx.lineTo(W - M, H - M - 40);
  ctx.strokeStyle = style.accent;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillStyle = style.accent;
  ctx.textAlign = 'center';
  ctx.fillText('人间还行 · 美好收集器', W / 2, H - M - 16);

  ctx.font = '11px sans-serif';
  ctx.fillStyle = style.ink + '77';
  ctx.fillText('Made with TRAE', W / 2, H - M);
  ctx.textAlign = 'left';
}

function spinReels() {
  var reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
  var results = [];

  // 随机选择 3 个不同的类型
  var shuffled = shuffle([...slotSymbols]);
  results = shuffled.slice(0, 3);

  // 启动旋转
  reels.forEach(function(reel) {
    reel.classList.add('spinning');
    reel.classList.remove('winner');
  });

  // 逐个停住
  var stopTimes = [1200, 2000, 2800];
  reels.forEach(function(reel, i) {
    setTimeout(function() {
      reel.classList.remove('spinning');
      // 设置最终显示的符号
      var strip = document.getElementById('strip' + i);
      var sym = results[i];
      strip.innerHTML = '<div class="slot-symbol"><span class="sym-emoji">' + sym.emoji + '</span><span class="sym-label">' + sym.label + '</span></div>';
      reel.classList.add('winner');

      // 最后一个轮停住后生成日报
      if (i === 2) {
        setTimeout(function() {
          finishSpin(results);
        }, 400);
      }
    }, stopTimes[i]);
  });
}

function finishSpin(results) {
  isSpinning = false;
  document.getElementById('btnCoin').disabled = false;
  document.getElementById('slotStatus').textContent = '美好已收集 · 卡片正在吐出…';

  // 用转轮结果生成故事
  var types = results.map(function(r) { return r.type; });
  currentStories = [];

  });

  spawnParticles();

  dispensedCard.classList.add('emerging');

  showToast('美好卡片已吐出');

  // 清除转轮发光
  setTimeout(function() {
    document.querySelectorAll('.slot-reel').forEach(function(r) { r.classList.remove('winner'); });

  // 滚动到卡片位置
  setTimeout(function() {
    dispenseArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 500);
}

  cy += 8;

  ctx.fillStyle = '#444';
  var storyLines = wrapCanvasText(ctx, story, W - M * 2, 4);
  storyLines.forEach(function(l) { ctx.fillText(l, M, cy); cy += 19; });

  cy += 12;

  // 分隔线
  drawReceiptLine(ctx, M, cy, W - M, cy, 'dashed');

  // === 总计行（模拟小票格式） ===

  ctx.textAlign = 'left';
  cy += 16;

  drawReceiptLine(ctx, M, cy, W - M, cy, 'solid');
  cy += 16;

  // 确认行
  ctx.font = '700 11px "Courier New", monospace';
  ctx.fillStyle = accent;
  ctx.textAlign = 'left';
  ctx.fillText('已收入人间还行档案', M, cy);
  ctx.textAlign = 'right';
  ctx.fillText('CONFIRMED', W - M, cy);
  ctx.textAlign = 'left';
  cy += 24;

  // === 条码（定位到底部 20% 区域） ===

  // === 底部感谢语（贴底） ===
  drawReceiptLine(ctx, M, H - 80, W - M, H - 80, 'dashed');

  ctx.font = '500 11px "Courier New", monospace';
  ctx.fillStyle = '#1a1a1a';
  ctx.textAlign = 'center';
  ctx.fillText('THANK YOU FOR SEEING GOOD', W / 2, H - 56);

  ctx.font = 'italic 400 11px -apple-system, sans-serif';
  ctx.fillStyle = accent;
  ctx.fillText('谢谢你看见了这件事', W / 2, H - 38);

  ctx.font = '400 8px "Courier New", monospace';

// === 小票辅助函数 ===
function drawReceiptLine(ctx, x1, y1, x2, y2, style) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  if (style === 'dashed') {
    ctx.setLineDash([3, 3]);
  } else {
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#00000033';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawReceiptRow(ctx, label, value, x, y, rightX) {
  ctx.font = '400 10px "Courier New", monospace';
  ctx.fillStyle = '#666';
  ctx.textAlign = 'left';
  ctx.fillText(label, x, y);
  ctx.font = '600 10px "Courier New", monospace';
  ctx.fillStyle = '#1a1a1a';
  ctx.textAlign = 'right';
  ctx.fillText(value, rightX, y);
  ctx.textAlign = 'left';
}

function drawBarcode(ctx, x, y, w, h, seed) {
  var barW = 1;
  var cx = x;
  var seedNum = parseInt(seed);
  var bars = [];
  for (var i = 0; i < 40; i++) {
    seedNum = (seedNum * 9301 + 49297) % 233280;
    bars.push(2 + Math.floor(seedNum / 23328) * 2);
  }
  bars.forEach(function(bw, i) {
    if (i % 2 === 0) {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(cx, y, bw * 0.6, h);
    }
    cx += bw * 0.8;
    if (cx > x + w) return;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Canvas 字距模拟
function drawSpacedText(ctx, text, x, y, spacing) {
  spacing = spacing || 1;
  for (var i = 0; i < text.length; i++) {
    ctx.fillText(text[i], x, y);
    x += ctx.measureText(text[i]).width + spacing;
  }
}
function drawSpacedTextCenter(ctx, text, cx, y, spacing) {
  spacing = spacing || 1;
  var totalW = 0;
  for (var i = 0; i < text.length; i++) totalW += ctx.measureText(text[i]).width + spacing;
  var x = cx - totalW / 2;
  for (var j = 0; j < text.length; j++) {
    ctx.fillText(text[j], x, y);
    x += ctx.measureText(text[j]).width + spacing;
  }
}

// 通用 Canvas 文字换行（接受任意宽度）
function wrapCanvasText(ctx, text, maxW, maxLines) {
  var lines = [], line = '';
  for (var i = 0; i < text.length; i++) {
    var test = line + text[i];
    if (ctx.measureText(test).width > maxW && line.length > 0) {
      lines.push(line);
      line = text[i];
      if (lines.length >= maxLines) { lines[maxLines - 1] += '…'; return lines; }
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapTextSimple(ctx, text, maxW, maxLines) {
  var lines = [];
  var line = '';
  for (var i = 0; i < text.length; i++) {
    var test = line + text[i];
    if (ctx.measureText(test).width > maxW && line.length > 0) {
      lines.push(line);
      line = text[i];
      if (lines.length >= maxLines) { lines[maxLines - 1] += '…'; return lines; }
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

      ctx.textAlign = 'right';
      ctx.fillText('0' + (i + 1), W - M, my + 2);
      ctx.textAlign = 'left';

      my += 22;

      // 标题（衬线 500 字重）
      ctx.font = '500 17px Georgia, "Songti SC", serif';
      ctx.fillStyle = s.ink;
      var titleLines = wt(st.title, ctx.font, 2);
      titleLines.forEach(function(l) { ctx.fillText(l, M, my); my += 22; });

      // 摘要（衬线 body 400）
      my += 4;
      ctx.font = '400 13px Georgia, serif';
      ctx.fillStyle = s.muted;
      var sumLines = wt(st.summary, ctx.font, 3);
      sumLines.forEach(function(l) { ctx.fillText(l, M, my); my += 18; });

      // 细分隔线
      my += 10;
      if (i < stories.length - 1) {
        ctx.beginPath(); ctx.moveTo(M, my); ctx.lineTo(W - M, my);
        ctx.strokeStyle = s.accent + '15'; ctx.lineWidth = 0.5; ctx.stroke();
      }
      my += 18;
    });

    // === 底部 pull quote ===
    ctx.font = 'italic 500 15px Georgia, serif';
    ctx.fillStyle = s.accent;
    ctx.textAlign = 'center';
    ctx.fillText('「人间还行，美好值得被收集。」', W / 2, H - 56);

    // 底部细线
    ctx.beginPath(); ctx.moveTo(M, H - 40); ctx.lineTo(W - M, H - 40);
    ctx.strokeStyle = s.accent + '33'; ctx.lineWidth = 0.5; ctx.stroke();

    // 底部品牌（mono）
    ctx.font = '500 10px "IBM Plex Mono", monospace';
    ctx.fillStyle = s.muted;
    drawSpacedTextCenter(ctx, '人间还行 · 美好收集器 · MADE WITH TRAE', W / 2, H - 22, 1);
    ctx.textAlign = 'left';

  } else if (currentTemplate === 'journal') {
    // 手账风：暖黄格线底、手写斜体字、胶带、贴纸
    ctx.fillStyle = '#fdf8e8'; ctx.fillRect(0, 0, W, H);

    // 格线
    ctx.strokeStyle = 'rgba(200,180,140,0.2)';
    ctx.lineWidth = 0.5;
    for (var gy = 0; gy < H; gy += 28) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    // 胶带装饰
    ctx.fillStyle = 'rgba(224,122,95,0.3)';
    ctx.save(); ctx.translate(W / 2, 0); ctx.rotate(-0.03);
    ctx.fillRect(-100, -6, 200, 28); ctx.restore();

    // 日期标签
    ctx.fillStyle = '#faecd8';
    roundRect(ctx, M, 42, 130, 32, 8); ctx.fill();
    ctx.strokeStyle = '#d4a574'; ctx.lineWidth = 1;
    roundRect(ctx, M, 42, 130, 32, 8); ctx.stroke();
    ctx.font = 'italic 600 12px Georgia, serif';
    ctx.fillStyle = '#bc6c25'; ctx.textAlign = 'center';
    ctx.fillText(dateStr, M + 65, 63);
    ctx.textAlign = 'left';

    // 标题
    ctx.font = 'italic 700 28px Georgia, serif';
    ctx.fillStyle = '#2c2416';
    ctx.fillText('美好日报', M + 145, 63);

    // 分隔线
    ctx.beginPath(); ctx.moveTo(M, 92); ctx.lineTo(W - M, 92);
    ctx.strokeStyle = '#d4a574'; ctx.lineWidth = 1.5; ctx.stroke();

    // 故事
    var jy = 115;
    var typeColors = {kindness:'#e07a5f', solution:'#81b29a', trend:'#d4a574', warmth:'#d4a5a5'};
    var contentW = W - M * 2;

    stories.forEach(function(st, i) {
      var tc = typeColors[st.type] || '#d4a574';

      // 贴纸标签
      ctx.save();
      ctx.translate(M, jy);
      ctx.rotate(i % 2 === 0 ? 0.03 : -0.03);
      ctx.fillStyle = tc + '30';
      roundRect(ctx, 0, 0, 70, 22, 5); ctx.fill();
      ctx.font = 'italic 600 10px Georgia, serif';
      ctx.fillStyle = tc;
      ctx.fillText(st.typeLabel, 8, 15);
      ctx.restore();

      // 编号
      ctx.font = 'italic 700 20px Georgia, serif';
      ctx.fillStyle = tc + '80';
      ctx.fillText(String(i + 1), W - M - 20, jy + 16);

      // 标题
      jy += 36;
      ctx.font = 'italic 600 16px Georgia, serif';
      ctx.fillStyle = '#2c2416';
      var tl = wrapCanvasText(ctx, st.title, contentW, 2);
      tl.forEach(function(l) { ctx.fillText(l, M, jy); jy += 21; });

      // 摘要
      jy += 4;
      ctx.font = 'italic 13px Georgia, serif';
      ctx.fillStyle = '#5c4f3d';
      var sl = wrapCanvasText(ctx, st.summary, contentW, 3);
      sl.forEach(function(l) { ctx.fillText(l, M, jy); jy += 19; });

      // 波浪线
      jy += 6;
      ctx.beginPath();
      var wx = M;
      ctx.moveTo(wx, jy);
      while (wx < W - M) {
        ctx.lineTo(wx + 6, jy + (Math.floor(wx / 12) % 2 === 0 ? -2 : 2));
        wx += 6;
      }
      ctx.strokeStyle = tc + '40'; ctx.lineWidth = 1.5;
      ctx.stroke();

      jy += 16;
    });

    // 底部
    ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = '#8a7d6b'; ctx.textAlign = 'center';
    ctx.fillText('人间还行 · 美好收集器 · Made with TRAE', W / 2, H - 22); ctx.textAlign = 'left';
  }
};
</script>
