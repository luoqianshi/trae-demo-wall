// ==================== 登录/登出 ====================
function login(role) {
  state.role = role;
  initData();
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userName').textContent = roleConfig[role].name;
  document.getElementById('userRole').textContent = roleConfig[role].roleName;
  renderSidebar();
  navigate('dashboard');
  updateTime();
  setInterval(updateTime, 60000);
}

function logout() {
  state.role = null;
  state.currentPage = 'dashboard';
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

function updateTime() {
  const now = new Date();
  document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderSidebar() {
  const nav = roleConfig[state.role].nav;
  document.getElementById('sidebarNav').innerHTML = nav.map(item => `
    <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${state.currentPage === item.id ? 'bg-sky-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
      <i class="fas ${item.icon} w-5 text-center"></i>
      <span class="font-medium">${item.label}</span>
    </button>
  `).join('');
}

function navigate(page) {
  state.currentPage = page;
  renderSidebar();
  const navItem = roleConfig[state.role].nav.find(n => n.id === page);
  document.getElementById('pageTitle').textContent = navItem ? navItem.label : '页面';
  const renderFn = pages[page];
  if (renderFn) {
    document.getElementById('pageContent').innerHTML = `<div class="fade-in">${renderFn()}</div>`;
    if (page === 'dashboard') initDashboardCharts();
  }
}

let paymentType = '';
function setPayment(type) {
  paymentType = type;
  ['chain','biz','cash'].forEach(t => {
    const el = document.getElementById(`pay-${t}`);
    if (t === type) { el.classList.add('border-sky-500', 'text-sky-600', 'bg-sky-50'); }
    else { el.classList.remove('border-sky-500', 'text-sky-600', 'bg-sky-50'); }
  });
}

function updateCart(productId, delta) {
  const qtyEl = document.getElementById(`qty-${productId}`);
  let qty = parseInt(qtyEl.textContent) + delta;
  if (qty < 0) qty = 0;
  qtyEl.textContent = qty;
}

function addToCart(productId) {
  const product = state.products.find(p => p.id === productId);
  const qty = parseInt(document.getElementById(`qty-${productId}`).textContent);
  if (qty <= 0) { showToast('请先选择数量', 'warning'); return; }
  const existing = state.cart.find(c => c.id === productId);
  if (existing) existing.qty += qty;
  else state.cart.push({ ...product, qty });
  document.getElementById(`qty-${productId}`).textContent = '0';
  renderCart();
  showToast(`${product.name} 已加入订单`, 'success');
}

function renderCart() {
  const container = document.getElementById('cartItems');
  if (state.cart.length === 0) {
    container.innerHTML = '<div class="text-center text-sm text-slate-400 py-8">购物车为空，请选择商品</div>';
    document.getElementById('cartTotal').textContent = '¥0.00';
    return;
  }
  let total = 0;
  container.innerHTML = state.cart.map(item => {
    total += item.price * item.qty;
    return `
      <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
        <div>
          <div class="text-sm font-medium">${item.name}</div>
          <div class="text-xs text-slate-500">${item.spec} · ¥${item.price} × ${item.qty}</div>
        </div>
        <div class="text-sm font-bold">¥${(item.price * item.qty).toFixed(2)}</div>
      </div>
    `;
  }).join('');
  document.getElementById('cartTotal').textContent = `¥${total.toFixed(2)}`;
}

function submitOrder() {
  if (state.cart.length === 0) { showToast('请先添加商品到订单', 'warning'); return; }
  if (!paymentType) { showToast('请选择结算方式', 'warning'); return; }
  const typeMap = { chain: '连锁账期', biz: '商业账期', cash: '现款现货' };
  const total = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
  const orderId = 'DD' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random()*900)+100).padStart(3,'0');
  state.orders.unshift({
    id: orderId,
    customer: document.getElementById('orderCustomer').value,
    amount: Math.round(total),
    status: paymentType === 'cash' ? '待付款' : '待开票',
    time: new Date().toLocaleString('zh-CN'),
    type: typeMap[paymentType],
    flow: ['下单']
  });
  state.cart = [];
  showToast(`订单 ${orderId} 提交成功！`, 'success');
  navigate('orders');
}

function showOrderFlow(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  const flowNodes = [
    { name: '下单', icon: 'fa-file-alt' },
    { name: '开票确认', icon: 'fa-file-invoice-dollar' },
    { name: '发货', icon: 'fa-box' },
    { name: '配送中', icon: 'fa-truck' },
    { name: '已签收', icon: 'fa-check' },
  ];
  const currentIdx = order.flow.length - 1;
  document.getElementById('pageContent').insertAdjacentHTML('beforeend', `
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center" onclick="closeModal()">
      <div class="bg-white rounded-xl p-6 w-full max-w-2xl shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-6">
          <div><h3 class="font-bold text-lg">订单流程跟踪</h3><p class="text-xs text-slate-500">${orderId}</p></div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex items-center justify-between relative">
          <div class="absolute top-5 left-0 right-0 h-1 bg-slate-100 -z-10"></div>
          <div class="absolute top-5 left-0 h-1 bg-sky-500 -z-10 transition-all" style="width: ${(currentIdx / (flowNodes.length-1)) * 100}%"></div>
          ${flowNodes.map((node, i) => `
            <div class="flex flex-col items-center gap-2">
              <div class="w-10 h-10 rounded-full flex items-center justify-center ${i <= currentIdx ? (i === currentIdx && order.status !== '已完成' ? 'node-active' : 'node-done') : 'node-pending'}">
                <i class="fas ${node.icon} text-sm"></i>
              </div>
              <div class="text-xs font-medium ${i <= currentIdx ? 'text-slate-700' : 'text-slate-400'}">${node.name}</div>
            </div>
          `).join('')}
        </div>
        <div class="mt-6 p-4 bg-slate-50 rounded-lg">
          <div class="text-sm font-medium mb-2">最新动态</div>
          <div class="space-y-2 text-sm text-slate-600">
            ${order.flow.map((f, i) => `
              <div class="flex items-center gap-2"><div class="w-2 h-2 ${i === order.flow.length-1 ? 'bg-sky-500' : 'bg-emerald-500'} rounded-full"></div><span>${f} - ${i === order.flow.length-1 ? '刚刚' : '已完成'}</span></div>
            `).join('')}
          </div>
        </div>
        ${order.status === '待付款' ? `
          <div class="mt-4 p-4 bg-amber-50 rounded-lg border border-amber-100">
            <div class="text-sm font-medium text-amber-800 mb-2">现款订单 - 请上传付款凭证</div>
            <button class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm hover:bg-amber-600"><i class="fas fa-upload mr-1"></i>上传付款截图</button>
          </div>
        ` : ''}
      </div>
    </div>
  `);
}

function auditReceipt(id, action) {
  const receipt = state.receipts.find(r => r.id === id);

    showToast(`晒单已通过，店员获得 ${receipt.points} 积分`, 'success');
  } else {
    receipt.status = '已驳回';
    showToast('晒单已驳回', 'warning');
  }
  navigate('receipts');
}

// ==================== 通用组件 ====================
function showToast(message, type = 'success') {
  const colors = { success: 'bg-emerald-500', warning: 'bg-amber-500', error: 'bg-rose-500' };
  const icons = { success: 'fa-check-circle', warning: 'fa-exclamation-circle', error: 'fa-times-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 min-w-[200px]`;
  toast.innerHTML = `<i class="fas ${icons[type]}"></i><span class="text-sm">${message}</span>`;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
