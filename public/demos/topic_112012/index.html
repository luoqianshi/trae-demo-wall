<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卷迹 · 长篇小说创作工作流工具</title>
<style>
  :root {
    --ink-black: #1a1614;
    --ink-deep: #2c2622;
    --ink-soft: #4a3f38;
    --paper: #f5efe1;
    --paper-light: #faf6ec;
    --paper-dark: #ebe2cf;
    --cinnabar: #c0392b;
    --cinnabar-light: #e74c3c;
    --cinnabar-deep: #922b21;
    --jade: #5d8a6b;
    --gold: #b8860b;
    --gold-light: #d4a429;
    --indigo: #2c4a5e;
    --shadow: rgba(26, 22, 20, 0.15);
    --shadow-deep: rgba(26, 22, 20, 0.35);
    --border: #c9bfa8;
    --border-light: #e0d6bf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    background: var(--paper);
    color: var(--ink-black);
    line-height: 1.6;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }

  /* ============ 顶部栏 ============ */
  .topbar {
    height: 56px;
    background: var(--ink-black);
    color: var(--paper);
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 2px solid var(--cinnabar);
    gap: 16px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .brand-logo {
    width: 32px; height: 32px;
    background: var(--cinnabar);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .project-selector {
    background: rgba(245, 239, 225, 0.1);
    border: 1px solid rgba(245, 239, 225, 0.2);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 180px;
  }
  .project-selector option { background: var(--ink-deep); }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--cinnabar); color: var(--paper); }
  .btn-primary:hover { background: var(--cinnabar-deep); }
  .btn-ghost {
    background: rgba(245, 239, 225, 0.1);
    color: var(--paper);
    border: 1px solid rgba(245, 239, 225, 0.2);
  }
  .btn-ghost:hover { background: rgba(245, 239, 225, 0.2); }
  .btn-light {
    background: var(--paper);
    color: var(--ink-black);
    border: 1px solid var(--border);
  }
  .btn-light:hover { background: var(--paper-dark); }
  .btn-danger { background: transparent; color: var(--cinnabar); border: 1px solid var(--cinnabar); }
  .btn-danger:hover { background: var(--cinnabar); color: var(--paper); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* ============ 主布局 ============ */
  .layout {
    display: flex;
    height: calc(100vh - 56px);
  }
  .sidebar {
    width: 200px;
    background: var(--paper-light);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }
  .nav-item:hover { background: var(--paper-dark); color: var(--ink-black); }
  .nav-item.active {
    background: var(--paper-dark);
    color: var(--cinnabar);
    border-left-color: var(--cinnabar);
    font-weight: 600;
  }
  .nav-icon { font-size: 18px; width: 24px; text-align: center; }
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .page-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--ink-black);
  }
  .page-title .sub {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 8px;
  }

  /* ============ 通用组件 ============ */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--paper-light);
  }
  .search-input:focus { outline: none; border-color: var(--cinnabar); }
  .tag-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-chip {
    padding: 6px 14px;
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .tag-chip:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  .tag-chip.active { background: var(--cinnabar); color: var(--paper); border-color: var(--cinnabar); }

  /* ============ 卡片网格 ============ */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .data-card {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: all 0.2s;
    position: relative;
  }
  .data-card:hover {
    border-color: var(--cinnabar-light);
    box-shadow: 0 4px 16px var(--shadow);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    gap: 8px;
  }
  .card-title { font-size: 15px; font-weight: 600; color: var(--ink-black); }
  .card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
  .data-card:hover .card-actions { opacity: 1; }
  .icon-btn {
    width: 26px; height: 26px;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: var(--ink-soft);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--paper-dark); color: var(--cinnabar); }
  .card-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .card-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .mini-tag {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--paper-dark);
    color: var(--ink-soft);
    border-radius: 10px;
  }

  /* ============ 模态框 ============ */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(26, 22, 20, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px var(--shadow-deep);
    border: 1px solid var(--border);
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--paper-light);
    color: var(--ink-black);
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: var(--cinnabar);
  }
  .form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  /* ============ 角色详情 ============ */
  .char-detail {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .char-detail-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .char-avatar-lg {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cinnabar), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--paper);
    font-size: 24px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .char-detail-info { flex: 1; }
  .char-detail-name { font-size: 20px; font-weight: 600; }
  .char-detail-title { font-size: 13px; color: var(--ink-soft); }
  .attr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .attr-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--paper);
    border-radius: 6px;
    font-size: 13px;
    border: 1px solid var(--border-light);
  }
  .attr-key { color: var(--ink-soft); }
  .attr-val { color: var(--ink-black); font-weight: 500; }

  /* ============ 关系图 ============ */
  .relation-section {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .relation-section h4 {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .relation-svg { width: 100%; height: 280px; display: block; }
  .relation-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .relation-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .relation-pill button {
    background: none;
    border: none;
    color: var(--cinnabar);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }

  /* ============ 时间线 ============ */
  .timeline-wrap {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    overflow-x: auto;
  }
  .timeline-inner { min-width: 800px; }
  .tl-axis {
    display: grid;
    grid-template-columns: 120px repeat(10, 1fr);
    border-bottom: 2px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .tl-axis-label {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .tl-axis-label:first-child { text-align: left; font-weight: 600; color: var(--ink-black); }
  .tl-row {
    display: grid;
    grid-template-columns: 120px repeat(10, 1fr);
    align-items: center;
    height: 60px;
    border-bottom: 1px dashed var(--border-light);
    position: relative;
  }
  .tl-name { font-size: 12px; font-weight: 600; padding-right: 8px; text-align: right; }
  .tl-name .sub { font-size: 10px; color: var(--ink-soft); font-weight: 400; display: block; }
  .tl-event {
    position: absolute;
    transform: translateX(-50%);
    cursor: pointer;
  }
  .tl-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 3px solid var(--paper-light);
    box-shadow: 0 1px 4px var(--shadow);
  }
  .tl-event:hover .tl-dot { transform: scale(1.3); }
  .tl-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-black);
    color: var(--paper);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    white-space: normal;
    width: max-content;
    max-width: 240px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
    z-index: 10;
  }
  .tl-event:hover .tl-tooltip { opacity: 1; visibility: visible; }
  .tl-tooltip strong { color: var(--gold-light); display: block; margin-bottom: 2px; }
  .tl-line-main .tl-dot { background: var(--cinnabar); }
  .tl-line-sub .tl-dot { background: var(--jade); }
  .tl-line-dark .tl-dot { background: var(--indigo); }

  /* ============ 伏笔看板 ============ */
  .fs-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .fs-col {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    min-height: 200px;
  }
  .fs-col-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }
  .fs-col-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .fs-dot { width: 10px; height: 10px; border-radius: 50%; }
  .fs-count {
    font-size: 11px;
    background: var(--paper-dark);
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--ink-soft);
  }
  .fs-card {
    background: var(--paper);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .fs-card:hover { border-color: var(--cinnabar-light); }
  .fs-card .card-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    opacity: 0;
  }
  .fs-card:hover .card-actions { opacity: 1; }
  .fs-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; padding-right: 50px; }
  .fs-card-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; }
  .fs-card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .fs-chip {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--paper);
  }
  .fs-chip.plant { background: var(--cinnabar); }
  .fs-chip.recycle { background: var(--jade); }
  .fs-chip.pending { background: var(--gold); }

  /* ============ 项目管理 ============ */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .project-card {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .project-card:hover { border-color: var(--cinnabar); transform: translateY(-2px); }
  .project-card.active { border-color: var(--cinnabar); background: var(--paper); }
  .project-card.active::before {
    content: '当前';
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--cinnabar);
    color: var(--paper);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .project-icon { font-size: 32px; margin-bottom: 8px; }
  .project-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .project-genre { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .project-stats { font-size: 11px; color: var(--ink-soft); display: flex; gap: 12px; }
  .project-card .card-actions { position: absolute; bottom: 8px; right: 8px; opacity: 0; }
  .project-card:hover .card-actions { opacity: 1; }

  /* ============ 统计 ============ */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: var(--paper-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--cinnabar); }
  .stat-label { font-size: 12px; color: var(--ink-soft); }

  /* ============ Toast ============ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink-black);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transition: all 0.3s;
    box-shadow: 0 4px 16px var(--shadow-deep);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 响应式 ============ */
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; gap: 8px; }
    .brand { font-size: 16px; }
    .brand-logo { width: 28px; height: 28px; font-size: 16px; }
    .project-selector { min-width: 120px; }
    .sidebar { width: 60px; }
    .nav-item { padding: 12px 18px; justify-content: center; }
    .nav-item span:not(.nav-icon) { display: none; }
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .fs-board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">卷</div>
    <span>卷迹</span>
  </div>
  <select class="project-selector" id="projectSelector"></select>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" onclick="exportData()">导出</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
  </div>
</div>

<!-- 主布局 -->
<div class="layout">
  <div class="sidebar">
    <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
      <span class="nav-icon">📊</span><span>概览</span>
    </div>
    <div class="nav-item" data-page="projects" onclick="switchPage('projects')">
      <span class="nav-icon">📚</span><span>作品管理</span>
    </div>
    <div class="nav-item" data-page="characters" onclick="switchPage('characters')">
      <span class="nav-icon">🧑</span><span>角色管理</span>
    </div>
    <div class="nav-item" data-page="worldview" onclick="switchPage('worldview')">
      <span class="nav-icon">🌏</span><span>世界观</span>
    </div>
    <div class="nav-item" data-page="timeline" onclick="switchPage('timeline')">
      <span class="nav-icon">⏳</span><span>时间线</span>
    </div>
    <div class="nav-item" data-page="foreshadow" onclick="switchPage('foreshadow')">
      <span class="nav-icon">🎯</span><span>伏笔追踪</span>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- 模态框 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ============ 数据层 ============
  const STORAGE_KEY = 'juanji_data_v1';

  let state = {
    projects: [],
    currentProjectId: null,
    currentPage: 'dashboard'
  };

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        state = JSON.parse(saved);
        if (!state.projects || state.projects.length === 0) {
          initSampleData();
        }
      } catch (e) {
        initSampleData();
      }
    } else {
      initSampleData();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getCurrentProject() {
    return state.projects.find(p => p.id === state.currentProjectId) || state.projects[0];
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ============ 示例数据 ============
  function initSampleData() {
    const pid = uid();
    state.projects = [{
      id: pid,
      name: '蛊道长歌',
      genre: '仙侠·蛊修',

  // ============ Toast ============
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  // ============ 模态框 ============
  function openModal(title, bodyHtml, footerHtml) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml;
    document.getElementById('modalMask').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modalMask').classList.remove('show');
  }
  document.getElementById('modalMask').addEventListener('click', e => {
    if (e.target.id === 'modalMask') closeModal();
  });

  // ============ 页面切换 ============
  function switchPage(page) {
    state.currentPage = page;
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.page === page);
    });
    renderPage();
  }

  function renderPage() {
    const main = document.getElementById('mainContent');
    const p = getCurrentProject();
    if (!p) {
      main.innerHTML = '<div class="empty-state"><div class="icon">📚</div>暂无作品，请先创建一部作品</div>';
      return;
    }
    switch (state.currentPage) {
      case 'dashboard': renderDashboard(p); break;
      case 'projects': renderProjects(); break;
      case 'characters': renderCharacters(p); break;
      case 'worldview': renderWorldview(p); break;
      case 'timeline': renderTimeline(p); break;
      case 'foreshadow': renderForeshadow(p); break;
    }
  }

  // ============ 概览 ============
  function renderDashboard(p) {
    const main = document.getElementById('mainContent');
    const recycledCount = p.foreshadow.filter(f => f.status === 'recycled').length;
    const plantedCount = p.foreshadow.filter(f => f.status === 'planted').length;
    const pendingCount = p.foreshadow.filter(f => f.status === 'pending').length;
    const maxChapter = p.timeline.length ? Math.max(...p.timeline.map(t => t.chapter)) : 0;
    main.innerHTML = `
      <div class="page-header">
        <div class="page-title">${p.name}<span class="sub">${p.genre}</span></div>
      </div>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">${p.desc}</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${p.characters.length}</div><div class="stat-label">角色</div></div>
        <div class="stat-box"><div class="stat-num">${p.settings.length}</div><div class="stat-label">设定条目</div></div>
        <div class="stat-box"><div class="stat-num">${p.timeline.length}</div><div class="stat-label">时间线事件</div></div>
        <div class="stat-box"><div class="stat-num">${p.foreshadow.length}</div><div class="stat-label">伏笔总数</div></div>
        <div class="stat-box"><div class="stat-num">${recycledCount}</div><div class="stat-label">已回收</div></div>
        <div class="stat-box"><div class="stat-num">${plantedCount}</div><div class="stat-label">待回收</div></div>
        <div class="stat-box"><div class="stat-num">${pendingCount}</div><div class="stat-label">未埋</div></div>
        <div class="stat-box"><div class="stat-num">${maxChapter}</div><div class="stat-label">最新章节</div></div>
      </div>
      <div class="page-header"><div class="page-title">伏笔回收提醒</div></div>
      ${renderFpRemind(p)}
    `;
  }

  function renderFpRemind(p) {
    const remind = p.foreshadow.filter(f => f.status === 'planted');
    if (remind.length === 0) {
      return '<div class="empty-state"><div class="icon">🎉</div>暂无待回收伏笔，继续保持！</div>';
    }
    return `
      <div class="card-grid">
        ${remind.map(f => `
          <div class="data-card">
            <div class="card-header">
              <div class="card-title">${f.title}</div>
              <span class="fs-chip plant">待回收</span>
            </div>
            <div class="card-desc">${f.desc}</div>
            <div class="card-tags">
              <span class="mini-tag">埋设：第${f.plantChapter || '?'}章</span>
              <span class="mini-tag">最新章节：${Math.max(0, ...p.timeline.map(t => t.chapter))}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

    const main = document.getElementById('mainContent');
    main.innerHTML = `

        <div class="page-title">作品管理</div>
        <button class="btn btn-primary btn-sm" onclick="editProject()">+ 新建作品</button>

  function switchProject(id) {
    state.currentProjectId = id;
    saveState();
    renderProjectSelector();
    switchPage('dashboard');
    toast('已切换作品');
  }

  function editProject(id) {
    const p = id ? state.projects.find(x => x.id === id) : null;
    openModal(
      p ? '编辑作品' : '新建作品',
      `
        <div class="form-group">
          <label class="form-label">作品名称 *</label>
          <input type="text" class="form-input" id="pName" value="${p ? p.name : ''}" placeholder="如：蛊道长歌" />
        </div>
        <div class="form-group">
          <label class="form-label">类型</label>
          <input type="text" class="form-input" id="pGenre" value="${p ? (p.genre || '') : ''}" placeholder="如：仙侠·蛊修" />
        </div>
        <div class="form-group">
          <label class="form-label">简介</label>
          <textarea class="form-textarea" id="pDesc" placeholder="一句话描述作品">${p ? (p.desc || '') : ''}</textarea>
        </div>
      `,
      `
        <button class="btn btn-light" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveProject('${id || ''}')">保存</button>
      `
    );
  }

  function saveProject(id) {
    const name = document.getElementById('pName').value.trim();
    if (!name) { toast('请输入作品名称'); return; }
    const genre = document.getElementById('pGenre').value.trim();
    const desc = document.getElementById('pDesc').value.trim();
    if (id) {
      const p = state.projects.find(x => x.id === id);
      p.name = name; p.genre = genre; p.desc = desc;
    } else {
      const newP = {
        id: uid(), name, genre, desc,
        characters: [], settings: [], timeline: [], foreshadow: []
      };
      state.projects.push(newP);
      state.currentProjectId = newP.id;
    }
    saveState();
    closeModal();
    renderProjectSelector();
    renderProjects();
    toast('保存成功');
  }

  function deleteProject(id) {
    if (state.projects.length <= 1) { toast('至少保留一部作品'); return; }
    if (!confirm('确认删除该作品？所有角色、设定、伏笔数据将一并删除。')) return;
    state.projects = state.projects.filter(p => p.id !== id);
    if (state.currentProjectId === id) state.currentProjectId = state.projects[0].id;
    saveState();
    renderProjectSelector();
    renderProjects();
    toast('已删除');
  }

  // ============ 角色管理 ============
  let charSearchKw = '';

  function renderCharacters(p) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="page-header">
        <div class="page-title">角色管理<span class="sub">共 ${p.characters.length} 位</span></div>

    const filtered = p.characters.filter(c => {

        (c.faction || '').toLowerCase().includes(kw) ||
        (c.title || '').toLowerCase().includes(kw);
    });
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div>未找到匹配角色</div>';
      return;
    }
    grid.innerHTML = filtered.map(c => `
      <div class="data-card" onclick="showCharDetail('${c.id}')">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;">

            <div>
              <div class="card-title">${c.name}</div>
              <div class="card-meta">${c.faction || ''} · ${c.title || ''}</div>

  function showCharDetail(id) {
    const p = getCurrentProject();
    const c = p.characters.find(x => x.id === id);
    if (!c) return;
    const panel = document.getElementById('charDetailPanel');
    panel.innerHTML = `
      <div class="char-detail">
        <div class="char-detail-head">
          <div class="char-avatar-lg">${c.avatar || c.name[0]}</div>
          <div class="char-detail-info">
            <div class="char-detail-name">${c.name}</div>
            <div class="char-detail-title">${c.faction || ''} ${c.title ? '· ' + c.title : ''}</div>
          </div>
          <button class="btn btn-light btn-sm" onclick="editChar('${c.id}')">编辑</button>
        </div>
        <div class="attr-grid">
          ${Object.entries(c.attrs || {}).map(([k, v]) => `
            <div class="attr-item"><span class="attr-key">${k}</span><span class="attr-val">${v}</span></div>
          `).join('')}
        </div>
      </div>
      <div class="relation-section">
        <h4>人物关系网络</h4>
        <svg class="relation-svg" viewBox="0 0 400 280" id="relSvg"></svg>
        <div class="relation-list">
          ${(c.relations || []).map(r => {
            const t = p.characters.find(x => x.id === r.targetId);
            return t ? `<span class="relation-pill">${r.label} → ${t.name} <button onclick="removeRelation('${c.id}','${r.targetId}')">✕</button></span>` : '';
          }).join('') || '<span style="color:var(--ink-soft);font-size:12px;">暂无关系，点击下方按钮添加</span>'}
        </div>
        <div style="margin-top:12px;">
          <button class="btn btn-light btn-sm" onclick="addRelation('${c.id}')">+ 添加关系</button>
        </div>
      </div>
    `;
    drawRelationSvg(c);
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function drawRelationSvg(c) {
    const svg = document.getElementById('relSvg');
    if (!svg) return;
    const p = getCurrentProject();
    const cx = 200, cy = 140;
    const rels = c.relations || [];
    if (rels.length === 0) {
      svg.innerHTML = `<text x="200" y="140" text-anchor="middle" fill="#999" font-size="12">暂无关系数据</text>`;
      return;
    }
    const positions = {};
    positions[c.id] = { x: cx, y: cy };
    const radius = 100;
    rels.forEach((r, i) => {
      const angle = (i / rels.length) * Math.PI * 2 - Math.PI / 2;
      positions[r.targetId] = {
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius
      };
    });
    let html = '';
    rels.forEach(r => {
      const from = positions[c.id];
      const to = positions[r.targetId];
      const mx = (from.x + to.x) / 2;
      const my = (from.y + to.y) / 2;
      html += `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>`;
      html += `<text x="${mx}" y="${my}" font-size="10" fill="#c0392b" text-anchor="middle" style="paint-order:stroke;stroke:#faf6ec;stroke-width:3px;">${r.label}</text>`;
    });
    rels.forEach(r => {
      const pos = positions[r.targetId];
      const t = p.characters.find(x => x.id === r.targetId);
      if (!t) return;
      html += `<g style="cursor:pointer;" onclick="showCharDetail('${t.id}')">
        <circle cx="${pos.x}" cy="${pos.y}" r="18" fill="#2c4a5e" stroke="#faf6ec" stroke-width="2"/>

  function saveChar(id) {
    const p = getCurrentProject();
    const name = document.getElementById('cName').value.trim();

    const avatar = document.getElementById('cAvatar').value.trim() || name[0];

    if (id) {

  // ============ 时间线 ============
  function renderTimeline(p) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="page-header">
        <div class="page-title">多线时间线<span class="sub">共 ${p.timeline.length} 个事件</span></div>
        <button class="btn btn-primary btn-sm" onclick="editTLEvent()">+ 新建事件</button>

      </div>

        <span>🔴 主线</span><span>🟢 支线</span><span>🔵 暗线</span>
        <span style="margin-left:auto;">鼠标悬停查看详情，点击编辑/删除</span>
      </div>
    `;
    drawTimeline(p);
  }

  function drawTimeline(p) {
    const inner = document.getElementById('tlInner');
    if (!inner) return;
    const events = p.timeline.slice().sort((a, b) => a.chapter - b.chapter);
    if (events.length === 0) {
      inner.innerHTML = '<div class="empty-state"><div class="icon">⏳</div>暂无时间线事件</div>';
      return;
    }
    const maxCh = Math.max(...events.map(e => e.chapter), 10);
    const scale = Math.ceil(maxCh / 10) * 10;
    const axisSteps = [];
    for (let i = 0; i <= 10; i++) axisSteps.push(Math.round(scale * i / 10));
    const lines = [
      { key: 'main', name: '主线', sub: '主线剧情' },
      { key: 'sub', name: '支线', sub: '支线剧情' },
      { key: 'dark', name: '暗线', sub: '暗线伏笔' }
    ];
    let html = `
      <div class="tl-axis">
        <div class="tl-axis-label">章节 / 线</div>
        ${axisSteps.map(s => `<div class="tl-axis-label">第${s}章</div>`).join('')}
      </div>
    `;
    lines.forEach(line => {
      const lineEvents = events.filter(e => e.line === line.key);
      html += `<div class="tl-row tl-line-${line.key}">
        <div class="tl-name">${line.name}<span class="sub">${line.sub}</span></div>
        ${lineEvents.map(e => {
          const pct = (e.chapter / scale) * 100;
          return `
            <div class="tl-event" style="left:calc(120px + ${pct}% - ${pct * 1.2}px);">
              <div class="tl-dot" onclick="editTLEvent('${e.id}')"></div>
              <div class="tl-tooltip"><strong>第${e.chapter}章 · ${e.title}</strong>${e.desc}</div>
            </div>
          `;
        }).join('')}
      </div>`;
    });
    inner.innerHTML = html;
  }

    openModal(

    toast('已删除');
  }

  // ============ 项目选择器 ============
  function renderProjectSelector() {
    const sel = document.getElementById('projectSelector');
    sel.innerHTML = state.projects.map(p =>
      `<option value="${p.id}" ${p.id === state.currentProjectId ? 'selected' : ''}>${p.name}</option>`
    ).join('');
  }

  // ============ 导入导出 ============
  function exportData() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `卷迹备份_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('已导出');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.projects || !Array.isArray(data.projects)) throw new Error('格式错误');
        state = data;
        if (!state.currentProjectId && state.projects.length > 0) {
          state.currentProjectId = state.projects[0].id;
        }
        saveState();
        renderProjectSelector();
        switchPage('dashboard');
        toast('导入成功');
      } catch (err) {
        toast('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  document.getElementById('projectSelector').addEventListener('change', e => {
    state.currentProjectId = e.target.value;
    saveState();
    switchPage('dashboard');
  });

  // ============ 初始化 ============
  loadState();
  renderProjectSelector();
  renderPage();
</script>

</body>
</html>
