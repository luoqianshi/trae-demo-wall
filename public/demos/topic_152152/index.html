<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FF6B35;
      --primary-dark: #E85A2B;
      --secondary: #FFB347;
      --bg: #FFF5F0;
      --white: #FFFFFF;
      --text-dark: #2D2D2D;
      --text-light: #666666;
      --shadow: rgba(255, 107, 53, 0.15);
      --shadow-hover: rgba(255, 107, 53, 0.25);
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .header {
      margin-bottom: 30px;
      animation: fadeInDown 0.6s ease-out;
    }

    .title {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 800;
      color: var(--primary);
      text-shadow: 3px 3px 0 var(--white), 5px 5px 10px var(--shadow);
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-light);
      margin-top: 8px;
      font-weight: 600;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--text-light);
      transition: all 0.3s ease;
    }

    .step.active {
      color: var(--primary);
    }

    .step-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #E8E8E8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .step.active .step-number {
      background: var(--primary);
      color: var(--white);
    }

    .decision-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      border: none;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0;
      box-shadow: 0 8px 25px var(--shadow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .decision-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .decision-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 35px var(--shadow-hover);
    }

    .decision-btn:hover::before {
      left: 100%;
    }

    .decision-btn:active,
    .decision-btn.bouncing {
      animation: bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .back-btn {
      background: var(--white);
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      display: none;
    }

    .back-btn:hover {
      background: var(--primary);
      color: var(--white);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
      transition: all 0.5s ease;
    }

    .cards-container.second-level {
      grid-template-columns: repeat(3, 1fr);
    }

    @media (max-width: 1023px) {
      .cards-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .cards-container.second-level {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 767px) {
      .cards-container,
      .cards-container.second-level {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 25px 15px;
      box-shadow: 0 5px 20px var(--shadow);
      transition: all 0.3s ease-out;
      cursor: pointer;
      border: 3px solid transparent;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.2s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(6) { animation-delay: 0.3s; }
    .card:nth-child(7) { animation-delay: 0.35s; }
    .card:nth-child(8) { animation-delay: 0.4s; }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px var(--shadow-hover);
    }

    .card.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--white) 0%, #FFF0E8 100%);
      transform: scale(1.05);
      box-shadow: 0 15px 40px var(--shadow-hover);
      animation: pulse 0.5s ease-in-out;
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 5px;
      font-weight: 500;
    }

    .result-message {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      min-height: 50px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .result-message.show {
      opacity: 1;
      animation: fadeIn 0.4s ease-out;
    }

    .final-result {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 15px 40px var(--shadow-hover);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .final-result-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .final-result-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .final-result-desc {
      font-size: 1.1rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .stats {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 600;
      padding: 18px;
      background: var(--white);
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 3px 15px var(--shadow);
    }

    .stats-number {
      color: var(--primary);
      font-weight: 800;
      font-size: 1.3rem;
    }

    .recommend-btn {
      background: var(--secondary);
      color: var(--text-dark);
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
    }

    .recommend-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 179, 71, 0.4);
    }

    .final-btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
      border: 2px solid var(--white);
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background: var(--white);
      color: var(--primary);
      transform: scale(1.05);
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.9); }
      50% { transform: scale(1.15); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1.05); box-shadow: 0 15px 40px var(--shadow-hover); }
      50% { transform: scale(1.1); box-shadow: 0 20px 50px var(--shadow-hover), 0 0 30px var(--primary); }
      100% { transform: scale(1.05); box-shadow: 0 15px 40px var(--shadow-hover); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">今天吃什么？</h1>
      <p class="subtitle">让选择困难症不再困扰你</p>
    </header>

    <div class="step-indicator">
      <div class="step active" id="step1">
        <span class="step-number">1</span>
        <span>选择用餐方式</span>
      </div>
      <div class="step" id="step2">
        <span class="step-number">2</span>
        <span>选择具体美食</span>
      </div>
    </div>

    <button class="back-btn" id="backBtn">← 返回上一步</button>

    <p class="result-message" id="resultMsg"></p>

    <div class="cards-container" id="cardsContainer">
      <div class="card" data-option="takeout">
        <span class="card-icon">🛵</span>
        <h3 class="card-title">外卖点餐</h3>
        <p class="card-desc">足不出户，美食到家</p>
      </div>
      <div class="card" data-option="canteen">
        <span class="card-icon">🍽️</span>
        <h3 class="card-title">食堂就餐</h3>
        <p class="card-desc">经济实惠，种类丰富</p>
      </div>
      <div class="card" data-option="bento">
        <span class="card-icon">🍱</span>
        <h3 class="card-title">自带便当</h3>
        <p class="card-desc">健康营养，妈妈的味道</p>
      </div>
      <div class="card" data-option="outside">
        <span class="card-icon">🚶</span>
        <h3 class="card-title">外出觅食</h3>
        <p class="card-desc">探索美味，放松心情</p>
      </div>
    </div>

    <div class="final-result" id="finalResult" style="display: none;">
      <div class="final-result-icon" id="finalIcon">🍔</div>
      <div class="final-result-title" id="finalTitle">今日午餐</div>
      <div class="final-result-desc" id="finalDesc">祝你用餐愉快！</div>
      <div class="final-btn-group">
        <button class="recommend-btn" id="recommendBtn">换一个推荐</button>
        <button class="home-btn" id="homeBtn">返回首页</button>
      </div>
    </div>

    <div class="stats">
      已帮 <span class="stats-number" id="statsNumber">0</span> 位打工人做出选择
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lunch_decider_count';

    const options = {
      takeout: {
        name: '外卖点餐',
        icon: '🛵',
        subOptions: [
          { id: 'chinese', name: '中式快餐', icon: '🍛', desc: '米饭套餐，经典口味' },
          { id: 'noodle', name: '面条米线', icon: '🍜', desc: '汤面拌面，暖胃暖心' },
          { id: 'burger', name: '西式汉堡', icon: '🍔', desc: '炸鸡薯条，快乐加倍' },
          { id: 'pizza', name: '披萨意面', icon: '🍕', desc: '芝士拉丝，美味无比' },
          { id: 'sushi', name: '日料寿司', icon: '🍣', desc: '新鲜美味，清爽可口' },
          { id: 'thai', name: '东南亚菜', icon: '🍤', desc: '酸辣开胃，异域风情' }
        ]
      },
      canteen: {
        name: '食堂就餐',
        icon: '🍽️',
        subOptions: [
          { id: 'rice', name: '米饭套餐', icon: '🍱', desc: '两荤一素，营养均衡' },
          { id: 'noodle_c', name: '食堂面条', icon: '🍜', desc: '清汤面，实惠大碗' },
          { id: 'dumpling', name: '饺子馄饨', icon: '🥟', desc: '现包现煮，热气腾腾' },
          { id: 'snack', name: '风味小吃', icon: '🍢', desc: '卤味凉菜，解馋必备' }
        ]
      },
      bento: {
        name: '自带便当',
        icon: '🍱',
        subOptions: [
          { id: 'home_cook', name: '家常小炒', icon: '🥘', desc: '妈妈做的菜，温暖人心' },
          { id: 'salad', name: '轻食沙拉', icon: '🥗', desc: '低脂健康，减脂首选' },
          { id: 'rice_ball', name: '饭团寿司', icon: '🍙', desc: '方便快捷，颜值担当' },
          { id: 'sandwich', name: '三明治', icon: '🥪', desc: '简单营养，快手早餐' }
        ]
      },
      outside: {
        name: '外出觅食',
        icon: '🚶',
        subOptions: [
          { id: 'hotpot', name: '火锅', icon: '🍲', desc: '热辣鲜香，聚会首选' },
          { id: 'bbq', name: '烧烤', icon: '🍢', desc: '炭火香气，夏日必备' },
          { id: 'coffee', name: '咖啡简餐', icon: '☕', desc: '优雅环境，放松心情' },
          { id: 'street', name: '街边小吃', icon: '🍜', desc: '地道风味，烟火气息' },
          { id: 'buffet', name: '自助餐', icon: '🥘', desc: '无限畅吃，选择多样' },
          { id: 'steak', name: '牛排西餐', icon: '🥩', desc: '仪式感满满，犒劳自己' }
        ]
      }
    };

    const messages = [
      '就这个了，开吃！',
      '完美选择，期待美味！',
      '决定就是它，别犹豫了！',
      '这顿稳了，口福不错哦！',
      '太棒了，准备享受美食吧！',
      '选得好，今天的午餐有着落了！'
    ];

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const backBtn = document.getElementById('backBtn');
    const resultMsg = document.getElementById('resultMsg');
    const cardsContainer = document.getElementById('cardsContainer');
    const finalResult = document.getElementById('finalResult');
    const finalIcon = document.getElementById('finalIcon');
    const finalTitle = document.getElementById('finalTitle');
    const finalDesc = document.getElementById('finalDesc');
    const recommendBtn = document.getElementById('recommendBtn');
    const statsNumber = document.getElementById('statsNumber');
    const homeBtn = document.getElementById('homeBtn');

    let currentLevel = 1;
    let selectedOption = null;
    let selectedSubOption = null;

    function getCount() {
      return parseInt(localStorage.getItem(STORAGE_KEY) || '0');
    }

    function setCount(count) {
      localStorage.setItem(STORAGE_KEY, count.toString());
    }

    function updateStats() {
      const count = getCount();
      statsNumber.textContent = count.toLocaleString();
    }

    function clearCards() {
      cardsContainer.innerHTML = '';
    }

    function renderCards(items) {
      clearCards();
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.option = item.id;
        card.style.animationDelay = `${index * 0.05}s`;
        card.innerHTML = `
          <span class="card-icon">${item.icon}</span>
          <h3 class="card-title">${item.name}</h3>
          <p class="card-desc">${item.desc || ''}</p>
        `;
        cardsContainer.appendChild(card);
      });

      cardsContainer.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => handleCardClick(card.dataset.option));
      });
    }

    function handleCardClick(optionId) {
      if (currentLevel === 1) {
        selectedOption = options[optionId];
        resultMsg.textContent = `选择了 ${selectedOption.icon} ${selectedOption.name}`;
        resultMsg.classList.add('show');

        cardsContainer.classList.add('second-level');
        renderCards(selectedOption.subOptions);

        step1.classList.remove('active');
        step2.classList.add('active');
        backBtn.style.display = 'inline-block';
        finalResult.style.display = 'none';

        currentLevel = 2;
      } else {
        selectedSubOption = selectedOption.subOptions.find(o => o.id === optionId);
        showFinalResult();
      }
    }

    function showFinalResult() {
      const count = getCount() + 1;
      setCount(count);
      updateStats();

      finalIcon.textContent = selectedSubOption.icon;
      finalTitle.textContent = `${selectedOption.name} - ${selectedSubOption.name}`;
      finalDesc.textContent = selectedSubOption.desc;

      cardsContainer.style.display = 'none';
      backBtn.style.display = 'none';
      resultMsg.classList.remove('show');
      finalResult.style.display = 'block';
    }

    function goBack() {
      currentLevel = 1;
      selectedOption = null;
      selectedSubOption = null;

      cardsContainer.classList.remove('second-level');
      cardsContainer.style.display = 'grid';
      backBtn.style.display = 'none';
      finalResult.style.display = 'none';
      resultMsg.classList.remove('show');

      step2.classList.remove('active');
      step1.classList.add('active');

      renderCards(Object.values(options).map(o => ({
        id: Object.keys(options).find(k => options[k] === o),
        name: o.name,
        icon: o.icon,
        desc: ''
      })));
    }

    function goHome() {
      currentLevel = 1;
      selectedOption = null;
      selectedSubOption = null;

      cardsContainer.classList.remove('second-level');
      cardsContainer.style.display = 'grid';
      backBtn.style.display = 'none';
      finalResult.style.display = 'none';
      resultMsg.classList.remove('show');

      step2.classList.remove('active');
      step1.classList.add('active');

      renderCards(Object.values(options).map(o => ({
        id: Object.keys(options).find(k => options[k] === o),
        name: o.name,
        icon: o.icon,
        desc: ''
      })));
    }

    function recommendAgain() {
      if (selectedOption && selectedOption.subOptions.length > 1) {
        const otherOptions = selectedOption.subOptions.filter(o => o.id !== selectedSubOption.id);
        const randomIndex = Math.floor(Math.random() * otherOptions.length);
        selectedSubOption = otherOptions[randomIndex];
        showFinalResult();
      }
    }

    backBtn.addEventListener('click', goBack);
    recommendBtn.addEventListener('click', recommendAgain);
    homeBtn.addEventListener('click', goHome);

    renderCards(Object.values(options).map((o, i) => ({
      id: Object.keys(options)[i],
      name: o.name,
      icon: o.icon,
      desc: ''
    })));

    updateStats();
  </script>
</body>
</html>
