<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="师生直连平台 - AI智能匹配优秀教师，让教学回归本质">
    <title>师生直连平台 - AI智能匹配好老师</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --primary-lighter: #dbeafe;
            --accent-color: #8b5cf6;
            --accent-light: #c4b5fd;
            --success-color: #10b981;
            --success-light: #d1fae5;
            --warning-color: #f59e0b;
            --warning-light: #fef3c7;
            --danger-color: #ef4444;
            --danger-light: #fee2e2;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #faf5ff 50%, #ffffff 100%);
            --bg-hero: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #8b5cf6 100%);
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1);
            --transition-normal: 0.3s cubic-bezier(0.4,0,0.2,1);
            --transition-slow: 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { display:flex; flex-direction:column; min-height:100vh; }
        .main-content { flex:1; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

        .header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky; top:0; z-index:100;
            transition: all var(--transition-normal);
        }
        .header-scrolled { box-shadow: var(--shadow-md); background: rgba(255,255,255,0.95); }
        .header-inner {
            max-width: 1280px; margin:0 auto; padding:0 24px; height:70px;
            display:flex; align-items:center; justify-content:space-between;
        }
        .logo { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:700; cursor:pointer; user-select:none; }
        .logo-icon {
            width:44px; height:44px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: var(--radius-md);
            display:flex; align-items:center; justify-content:center; color:white; font-size:22px;
            transition: all var(--transition-normal);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .logo:hover .logo-icon { transform: rotate(-8deg) scale(1.08); }
        .logo-text { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav { display:flex; gap:36px; }
        .nav a {
            color: var(--text-secondary); text-decoration:none; font-weight:500;
            position:relative; transition: color var(--transition-fast); padding:8px 0;
        }
        .nav a:hover { color: var(--primary-color); }
        .nav a.active { color: var(--primary-color); font-weight:600; }
        .nav a.active::after {
            content:''; position:absolute; bottom:0; left:0; width:100%; height:3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from{transform:scaleX(0);} to{transform:scaleX(1);} }

        .btn {
            padding:10px 22px; border-radius: var(--radius-md); font-weight:600; cursor:pointer;
            border:none; font-size:14px; transition: all var(--transition-fast);
            display:inline-flex; align-items:center; justify-content:center; gap:6px;
            white-space:nowrap; background:transparent; color:var(--text-secondary);
            font-family:inherit; text-decoration:none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color:white; box-shadow: 0 4px 14px rgba(59,130,246,0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-accent {
            background: linear-gradient(135deg, var(--accent-color), #7c3aed);
            color:white; box-shadow: 0 4px 14px rgba(139,92,246,0.4);
        }
        .btn-accent:hover { transform: translateY(-2px); }
        .btn-outline { border:1.5px solid var(--border-color); color:var(--text-secondary); background:var(--bg-primary); }
        .btn-outline:hover { border-color:var(--primary-color); color:var(--primary-color); background:var(--primary-lighter); }
        .btn-success { background: var(--success-color); color:white; box-shadow: 0 4px 14px rgba(16,185,129,0.3); }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: var(--danger-color); color:white; box-shadow: 0 4px 14px rgba(239,68,68,0.3); }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-sm { padding:8px 16px; font-size:13px; }
        .btn-lg { padding:14px 32px; font-size:16px; }
        .btn-block { width:100%; }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }
        .btn-ghost { background:transparent; }
        .btn-ghost:hover { background:var(--bg-secondary); }

        .header-actions { display:flex; gap:12px; align-items:center; }
        .icon-btn {
            width:40px; height:40px; border-radius:50%; background:var(--bg-secondary);
            border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:18px; transition: all var(--transition-fast); position:relative;
        }
        .icon-btn:hover { background:var(--primary-lighter); transform: scale(1.05); }
        .icon-btn .badge {
            position:absolute; top:-2px; right:-2px; width:18px; height:18px;
            background:var(--danger-color); color:white; border-radius:50%;
            font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100%{transform:scale(1);}
            50%{transform:scale(1.15);}
        }

        .user-menu {
            display:flex; align-items:center; gap:10px; cursor:pointer;
            padding:6px 14px 6px 6px; border-radius:30px; transition: all var(--transition-fast);
            background: var(--bg-secondary);
        }
        .user-menu:hover { background: var(--primary-lighter); }
        .user-avatar-sm {
            width:34px; height:34px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            color:white; font-weight:600; font-size:13px;
        }

        .mobile-menu-btn { display:none; background:none; border:none; font-size:24px; cursor:pointer; padding:8px; }
        .mobile-nav { display:none; background:var(--bg-primary); border-bottom:1px solid var(--border-light); padding:12px 20px; max-height:0; overflow:hidden; transition: max-height 0.3s ease; }
        .mobile-nav.active { display:block; max-height:500px; }
        .mobile-nav a { display:block; padding:14px 0; color:var(--text-secondary); text-decoration:none; font-weight:500; border-bottom:1px solid var(--border-light); transition: all 0.2s ease; }
        .mobile-nav a:last-child { border-bottom:none; }
        .mobile-nav a.active { color: var(--primary-color); }
        .mobile-nav a:hover { padding-left:8px; color:var(--primary-color); }

        .hero {
            background: var(--bg-hero); color:white; padding:100px 24px 120px; text-align:center;
            position:relative; overflow:hidden;
        }
        .hero::before, .hero::after {
            content:''; position:absolute; border-radius:50%; filter:blur(80px); opacity:0.4;
        }
        .hero::before { width:400px; height:400px; background:#8b5cf6; top:-100px; left:-100px; animation: float 6s ease-in-out infinite; }
        .hero::after { width:300px; height:300px; background:#06b6d4; bottom:-80px; right:-50px; animation: float 6s ease-in-out infinite reverse; }
        @keyframes float { 0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-20px) translateX(10px);} }
        .hero-content { position:relative; z-index:1; max-width:800px; margin:0 auto; }
        .hero-badge {
            display:inline-flex; align-items:center; gap:8px; padding:8px 20px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius:30px; font-size:13px; margin-bottom:24px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInDown 0.6s ease;
        }
        .hero h1 {
            font-size: clamp(36px, 5vw, 56px); font-weight:800; margin-bottom:20px; line-height:1.2;
            animation: fadeInUp 0.6s ease;
        }
        .hero p {
            font-size: clamp(16px, 2.5vw, 20px); opacity:0.9; max-width:600px;
            margin: 0 auto 36px; line-height:1.7;
            animation: fadeInUp 0.6s ease 0.1s both;
        }
        .hero-btns {
            display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
            animation: fadeInUp 0.6s ease 0.2s both;
        }
        .hero .btn-outline { border-color:rgba(255,255,255,0.3); color:white; background:rgba(255,255,255,0.1); }
        .hero .btn-outline:hover { background:white; color:var(--primary-color); border-color:white; }
        @keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
        @keyframes fadeInDown { from{opacity:0; transform:translateY(-20px);} to{opacity:1; transform:translateY(0);} }

        .smart-match { max-width:1000px; margin:-60px auto 0; padding:0 24px; position:relative; z-index:10; }
        .smart-match-card {
            background: var(--bg-primary); border-radius: var(--radius-xl); padding:36px;
            box-shadow: var(--shadow-xl); animation: fadeInUp 0.8s ease 0.3s both;
        }
        .smart-match-title { font-size:20px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .smart-match-title span { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .match-fields { display:grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap:16px; margin-bottom:20px; }
        .match-field { display:flex; flex-direction:column; gap:8px; }
        .match-field label { font-size:13px; font-weight:500; color:var(--text-secondary); }
        .match-field select {
            padding:12px 16px; border:1.5px solid var(--border-color); border-radius:var(--radius-md);
            font-size:14px; background:var(--bg-secondary); transition: all var(--transition-fast); font-family:inherit; cursor:pointer;
        }
        .match-field select:focus { outline:none; border-color:var(--primary-color); background:var(--bg-primary); box-shadow:0 0 0 4px rgba(59,130,246,0.1); }
        .match-btn {
            height:100%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color:white; border:none; border-radius:var(--radius-md); font-weight:600;
            cursor:pointer; font-size:16px; transition: all var(--transition-fast); align-self:flex-end; padding:12px 24px;
        }
        .match-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
        .match-features { display:flex; gap:24px; flex-wrap:wrap; padding-top:20px; border-top:1px solid var(--border-light); }
        .match-feature { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary); transition: all 0.2s ease; }
        .match-feature:hover { color:var(--primary-color); }
        .match-feature .check { color:var(--success-color); font-weight:bold; }

        .stats-section { max-width:1280px; margin:60px auto; padding:0 24px; }
        .stats-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:24px; }
        .stat-card {
            background: var(--bg-primary); border-radius: var(--radius-lg); padding:32px 28px;
            text-align:center; box-shadow: var(--shadow-md); transition: all var(--transition-normal);
            position:relative; overflow:hidden; border:1px solid var(--border-light);
        }
        .stat-card::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transform: scaleX(0); transform-origin:left; transition: transform var(--transition-normal);
        }
        .stat-card:hover::before { transform: scaleX(1); }
        .stat-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
        .stat-icon {
            width:64px; height:64px; border-radius:18px; display:flex; align-items:center;
            justify-content:center; margin:0 auto 16px; font-size:30px; transition: all var(--transition-normal);
        }
        .stat-card:nth-child(1) .stat-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color:#2563eb; }
        .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); color:#7c3aed; }
        .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color:#16a34a; }
        .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, #fef3c7, #fde68a); color:#d97706; }
        .stat-card:hover .stat-icon { transform: scale(1.1) rotate(5deg); }
        .stat-value {
            font-size:36px; font-weight:800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .stat-label { color:var(--text-secondary); font-size:14px; margin-top:8px; font-weight:500; }

        .section { max-width:1280px; margin:0 auto; padding:80px 24px; }
        .section-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:48px; flex-wrap:wrap; gap:16px; }
        .section-title-wrap h2 { font-size: clamp(28px, 4vw, 40px); font-weight:800; line-height:1.3; }
        .section-title-wrap h2 span { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .section-desc { color:var(--text-secondary); margin-top:10px; font-size:16px; max-width:500px; }
        .section-more { color:var(--primary-color); font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition: gap var(--transition-fast); }
        .section-more:hover { gap:10px; }

        .features-section { background: var(--bg-secondary); }
        .features-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; }
        .feature-card {
            background: var(--bg-primary); border-radius: var(--radius-lg); padding:36px 28px;
            transition: all var(--transition-normal); border:1px solid var(--border-light);
            position:relative; overflow:hidden;
        }
        .feature-card::after {
            content:''; position:absolute; top:0; right:0; width:100px; height:100px;
            background: linear-gradient(135deg, rgba(59,130,246,0.05), rgba(139,92,246,0.05));
            border-radius: 0 0 0 100%; transition: all var(--transition-normal);
        }
        .feature-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color:transparent; }
        .feature-card:hover::after { width:150px; height:150px; }
        .feature-icon { width:64px; height:64px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:20px; transition: all var(--transition-normal); }
        .feature-card:nth-child(1) .feature-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
        .feature-card:nth-child(2) .feature-icon { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }
        .feature-card:nth-child(3) .feature-icon { background: linear-gradient(135deg, #dcfce7, #bbf7d0); }
        .feature-card:hover .feature-icon { transform: scale(1.1) rotate(-5deg); }
        .feature-card h3 { font-size:20px; font-weight:700; margin-bottom:12px; }
        .feature-card p { color:var(--text-secondary); line-height:1.7; }

        .teachers-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; }
        .teacher-card {
            background: var(--bg-primary); border-radius: var(--radius-lg); padding:28px;
            box-shadow: var(--shadow-sm); transition: all var(--transition-normal); cursor:pointer;
            position:relative; border:1px solid var(--border-light); overflow:hidden;
        }
        .teacher-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:0;
            background: linear-gradient(135deg, rgba(59,130,246,0.03), rgba(139,92,246,0.03));
            transition: height var(--transition-normal);
        }
        .teacher-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color:transparent; }
        .teacher-card:hover::before { height:100%; }
        .teacher-badge { position:absolute; top:20px; right:20px; display:flex; gap:8px; }
        .badge-icon {
            width:30px; height:30px; border-radius:50%; display:flex; align-items:center;
            justify-content:center; font-size:13px; color:white; box-shadow:0 2px 8px rgba(0,0,0,0.15);
            transition: transform var(--transition-fast);
        }
        .badge-icon:hover { transform: scale(1.15); }
        .badge-icon.certified { background: linear-gradient(135deg, var(--success-color), #059669); }
        .badge-icon.trial { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .teacher-header { display:flex; gap:16px; margin-bottom:20px; align-items:flex-start; }
        .teacher-avatar {
            width:68px; height:68px;
            background: linear-gradient(135deg, var(--primary-light), var(--accent-color));
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            color:white; font-size:26px; font-weight:700; flex-shrink:0;
            transition: all var(--transition-normal); box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .teacher-card:hover .teacher-avatar { transform: scale(1.08); }
        .teacher-info { flex:1; min-width:0; }
        .teacher-info h3 { font-size:20px; font-weight:700; display:flex; align-items:center; gap:8px; }
        .teacher-rating { display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--warning-color); font-size:13px; }
        .teacher-rating .num { color:var(--text-primary); font-weight:600; font-size:14px; }
        .teacher-rating .count { color:var(--text-muted); }
        .trial-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; background:var(--success-light); color:var(--success-color); border-radius:12px; font-size:11px; font-weight:600; margin-top:8px; animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.3);} 50%{box-shadow:0 0 0 6px rgba(16,185,129,0);} }
        .teacher-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .tag { padding:5px 12px; background:var(--primary-lighter); color:var(--primary-dark); border-radius:20px; font-size:12px; font-weight:500; transition: all var(--transition-fast); cursor:pointer; }
        .tag:hover { background:var(--primary-color); color:white; transform:scale(1.05); }
        .tag.purple { background:#f3e8ff; color:#7c3aed; }
        .tag.purple:hover { background:#7c3aed; color:white; }
        .tag.green { background:#dcfce7; color:#16a34a; }
        .tag.green:hover { background:#16a34a; color:white; }
        .tag.orange { background:#ffedd5; color:#ea580c; }
        .tag.orange:hover { background:#ea580c; color:white; }
        .teacher-meta { display:flex; gap:20px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border-light); font-size:13px; color:var(--text-secondary); }
        .teacher-meta span { display:flex; align-items:center; gap:4px; }
        .teacher-footer { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
        .teacher-price { display:flex; flex-direction:column; }
        .teacher-price .amount { font-size:26px; font-weight:800; color:var(--danger-color); }
        .teacher-price .unit { font-size:12px; color:var(--text-muted); }
        .teacher-action { opacity:0; transform: translateY(10px); transition: all var(--transition-normal); }
        .teacher-card:hover .teacher-action { opacity:1; transform:translateY(0); }
        .fav-btn {
            position:absolute; bottom:20px; left:20px; width:36px; height:36px;
            border-radius:50%; border:none; cursor:pointer; font-size:16px;
            transition: all var(--transition-fast); display:flex; align-items:center; justify-content:center;
        }
        .fav-btn:hover { transform: scale(1.15); }

        .page-header { background: var(--bg-hero); color:white; padding:60px 24px 100px; position:relative; overflow:hidden; }
        .page-header::before { content:''; position:absolute; width:500px; height:500px; background:rgba(139,92,246,0.3); border-radius:50%; filter:blur(100px); top:-200px; right:-100px; }
        .page-header-content { max-width:1280px; margin:0 auto; position:relative; z-index:1; }
        .page-header h1 { font-size: clamp(28px, 4vw, 40px); font-weight:800; margin-bottom:12px; }
        .page-header p { opacity:0.9; font-size:16px; }
        .breadcrumb { display:flex; gap:8px; margin-bottom:16px; font-size:13px; opacity:0.8; }
        .breadcrumb a { color:white; text-decoration:none; }
        .breadcrumb a:hover { text-decoration:underline; }

        .search-section { max-width:1280px; margin:-50px auto 32px; padding:0 24px; position:relative; z-index:10; }

        function getFilteredTeachers() {
            let result = [...Data.teachers];
            const { keyword, category, sortBy, priceRange, experience } = AppState.search;
            if (keyword) {
                const lower = keyword.toLowerCase();
                result = result.filter(t => t.name.toLowerCase().includes(lower) || t.specialties.some(s => s.toLowerCase().includes(lower)) || t.course.toLowerCase().includes(lower));
            }
            if (category !== '全部') {
                result = result.filter(t => t.specialties.includes(category));
            }
            if (priceRange && priceRange !== 'all') {
                if (priceRange === '500+') {
                    result = result.filter(t => t.price >= 500);
                } else {
                    const [min, max] = priceRange.split('-').map(Number);
                    result = result.filter(t => t.price >= min && t.price <= max);
                }
            }
            if (experience && experience !== '全部') {
                if (experience === '10年以上') {
                    result = result.filter(t => t.experience >= 10);
                } else {
                    const match = experience.match(/(\d+)-(\d+)年/);
                    if (match) {
                        result = result.filter(t => t.experience >= Number(match[1]) && t.experience <= Number(match[2]));
                    }
                }
            }
            switch(sortBy) {
                case 'rating': result.sort((a,b) => b.rating - a.rating); break;
                case 'price_asc': result.sort((a,b) => a.price - b.price); break;
                case 'price_desc': result.sort((a,b) => b.price - a.price); break;
                case 'reviews': result.sort((a,b) => b.reviews - a.reviews); break;
                case 'experience': result.sort((a,b) => b.experience - a.experience); break;
            }
            return result;
        }

        function initReveal() {
            try {
                const reveals = document.querySelectorAll('.reveal');
                if (!reveals || reveals.length === 0) return;
                if (!('IntersectionObserver' in window)) {
                    reveals.forEach(function(el) { el.classList.add('visible'); });
                    return;
                }
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry, index) {
                        if (entry.isIntersecting) {
                            setTimeout(function() { entry.target.classList.add('visible'); }, index * 80);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
                reveals.forEach(function(el) { observer.observe(el); });
            } catch(e) {}
        }

        function animateNumbers() {
            try {
                const nums = document.querySelectorAll('[data-count]');
                if (!nums || nums.length === 0) return;
                nums.forEach(function(el) {
                    const target = Number(el.getAttribute('data-count'));
                    const suffix = el.getAttribute('data-suffix') || '';
                    const duration = 1500;
                    const start = performance.now();
                    function update(now) {
                        const progress = Math.min((now - start) / duration, 1);
                        const eased = 1 - Math.pow(1 - progress, 3);
                        el.textContent = Math.floor(target * eased) + suffix;
                        if (progress < 1) requestAnimationFrame(update);
                    }
                    requestAnimationFrame(update);
                });
            } catch(e) {}
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if (!validateForm('login-username-group', username, {required:true, minLength:2})) return;
            if (!validateForm('login-password-group', password, {required:true, minLength:6})) return;
            const user = { id: Utils.generateId('user'), username, role: AppState.role || 'student', createdAt: Utils.formatDateInput(new Date()) };
            AppState.currentUser = user;
            Store.set(CONFIG.STORAGE_KEYS.USER, user);
            AppState.showModal = null;
            Toast.show('登录成功，欢迎回来！', 'success');
            render();
        }

        function handleRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            if (!validateForm('reg-username-group', username, {required:true, minLength:2})) return;
            if (!validateForm('reg-password-group', password, {required:true, minLength:6})) return;
            if (password !== confirm) {
                const group = document.getElementById('reg-confirm-group');
                group.classList.add('error');
                group.querySelector('.error-msg').textContent = '两次密码不一致';
                return;
            }
            const user = { id: Utils.generateId('user'), username, role: AppState.role, createdAt: Utils.formatDateInput(new Date()) };
            AppState.currentUser = user;
            Store.set(CONFIG.STORAGE_KEYS.USER, user);
            AppState.showModal = null;
            Data.addNotification(`欢迎加入师生直连平台！`);
            Toast.show('注册成功，欢迎加入！', 'success');
            render();
        }

        function handleBook() {
            if (!AppState.currentUser) { AppState.showModal='login'; render(); return; }
            const date = document.getElementById('book-date').value;
            const time = document.getElementById('book-time').value;
            const duration = document.getElementById('book-duration').value;
            if (!validateForm('book-date-group', date, {required:true})) return;
            if (!validateForm('book-time-group', time, {required:true})) return;
            const t = AppState.selectedTeacher;
            const fullTime = `${date} ${time}`;
            if (Data.isTimeSlotOccupied(t.id, fullTime)) {
                Toast.show('该时间段已被预约，请选择其他时间', 'error');
                return;
            }
            const now = new Date();
            const bookTime = new Date(fullTime);
            if (bookTime - now < 30*60*1000) {
                Toast.show('请至少提前30分钟预约', 'error');
                return;
            }
            const price = t.price * (duration/60);
            const orders = Data.getOrders();
            orders.unshift({
                id: Utils.generateId('order'),
                teacherId: t.id,
                teacher: t.name,
                course: t.subject,
                time: fullTime,
                duration: Number(duration),
                price: price,
                status: 'pending',
                userId: AppState.currentUser.id,
                createdAt: new Date().toISOString()
            });
            Data.saveOrders(orders);
            Data.addNotification(`您已成功预约 ${t.name} 老师的课程`);
            AppState.showModal = null;
            AppState.selectedTeacher = null;
            Toast.show('预约成功！请尽快完成支付', 'success');
            AppState.currentPage = 'orders';
            render();
        }

        function handleTrial() {
            if (!AppState.currentUser) { AppState.showModal='login'; render(); return; }
            const date = document.getElementById('trial-date').value;
            const time = document.getElementById('trial-time').value;
            if (!validateForm('trial-date-group', date, {required:true})) return;
            if (!validateForm('trial-time-group', time, {required:true})) return;
            const t = AppState.selectedTeacher;
            const fullTime = `${date} ${time}`;
            const orders = Data.getOrders();
            orders.unshift({
                id: Utils.generateId('order'),
                teacherId: t.id,
                teacher: t.name,
                course: t.subject + '（试听）',
                time: fullTime,
                duration: 15,
                price: 0,
                status: 'paid',
                userId: AppState.currentUser.id,
                isTrial: true,
                createdAt: new Date().toISOString()
            });
            Data.saveOrders(orders);
            Data.addNotification(`试听预约成功！${t.name}老师的免费试听课`);
            AppState.showModal = null;
            AppState.selectedTeacher = null;
            Toast.show('试听预约成功！', 'success');
            AppState.currentPage = 'orders';
            render();
        }

        function handleReview() {
            const comment = document.getElementById('review-comment').value.trim();
            if (!validateForm('review-comment-group', comment, {required:true, minLength:5})) return;
            const orders = Data.getOrders();
            const order = orders.find(o => o.id === AppState.currentOrderId);
            if (!order) return;
            order.status = 'reviewed';
            Data.saveOrders(orders);
            const reviews = Data.getReviews();
            reviews.unshift({
                id: Utils.generateId('review'),
                teacherId: order.teacherId,
                orderId: order.id,
                user: AppState.currentUser.username,
                rating: AppState.reviewRating,
                comment,
                createdAt: new Date().toISOString()
            });
            Data.saveReviews(reviews);
            Data.addNotification(`评价提交成功，感谢您的反馈！`);
            AppState.showModal = null;
            AppState.currentOrderId = null;
            AppState.reviewRating = 5;
            Toast.show('评价提交成功！', 'success');
            render();
        }

        function handleOrderAction(el) {
            const id = el.dataset.id;
            const next = el.dataset.next;
            const orders = Data.getOrders();
            const order = orders.find(o => o.id === id);
            if (!order) return;
            if (next === 'paid') {
                order.status = 'paid';
                Data.saveOrders(orders);
                Data.addNotification(`订单 ${order.id} 支付成功`);
                Toast.show('支付成功！老师会尽快联系您', 'success');
            } else if (next === 'reviewed') {
                AppState.currentOrderId = id;
                AppState.showModal = 'review';
                render();
                return;
            }
            render();
        }

        function cancelOrder(id) {
            const orders = Data.getOrders();
            const order = orders.find(o => o.id === id);
            if (!order || order.status !== 'pending') return;
            order.status = 'cancelled';
            Data.saveOrders(orders);
            Data.addNotification(`订单 ${id} 已取消`);
            Toast.show('订单已取消', 'warning');
            render();
        }

        function teacherConfirmOrder(id) {
            const orders = Data.getOrders();
            const order = orders.find(o => o.id === id);
            if (!order || order.status !== 'pending') return;
            order.status = 'paid';
            Data.saveOrders(orders);
            Data.addNotification(`您已确认接单 ${id}`);
            Toast.show('接单成功！', 'success');
            render();
        }

        function completeOrder(id) {
            const orders = Data.getOrders();
            const order = orders.find(o => o.id === id);
            if (!order || order.status !== 'paid') return;
            order.status = 'completed';
            Data.saveOrders(orders);
            Data.addNotification(`课程 ${order.course} 已完成`);
            Toast.show('课程已标记为完成', 'success');
            render();
        }

        function enterClassroom(id) {
            AppState.currentOrderId = id;
            AppState.showModal = 'classroom';
            render();
        }

        function contactTeacher(name, id) {
            AppState.currentTeacherName = name;
            AppState.currentTeacherId = id;
            AppState.showModal = 'message';
            render();
        }

        function sendAIMessage() {
            const input = document.getElementById('ai-input');
            const text = input.value.trim();
            if (!text) return;
            AppState.aiMessages.push({role:'user', text});
            input.value = '';
            AppState.aiTyping = true;
            render();
            setTimeout(() => {
                const responses = CONFIG.AI_RESPONSES;
                let response = responses[Math.floor(Math.random() * responses.length)];
                if (text.includes('老师') || text.includes('推荐')) response = responses[1];
                else if (text.includes('计划')) response = responses[2];
                else if (text.includes('效率')) response = responses[3];
                else if (text.includes('选') || text.includes('选择')) response = responses[4];
                AppState.aiMessages.push({role:'bot', text:response});
                AppState.aiTyping = false;
                render();
            }, 1200);
        }

        function sendMessage(teacherId, teacherName) {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            const messages = Data.getMessages(teacherId);
            messages.push({id:Utils.generateId('msg'), sender:'user', text, time:new Date().toTimeString().slice(0,5)});
            Data.saveMessages(teacherId, messages);
            input.value = '';
            render();
            setTimeout(() => {
                const msgs = Data.getMessages(teacherId);
                msgs.push({id:Utils.generateId('msg'), sender:'teacher', text:'好的，收到你的消息！有什么学习问题都可以问我。', time:new Date().toTimeString().slice(0,5)});
                Data.saveMessages(teacherId, msgs);
                render();
            }, 1000);
        }

        function handleAction(action, el, e) {
            switch(action) {
                case 'navigate': AppState.currentPage = el.dataset.page; AppState.mobileMenuOpen=false; AppState.notificationsOpen=false; window.scrollTo({top:0,behavior:'smooth'}); break;
                case 'openModal': AppState.showModal = el.dataset.modal; AppState.notificationsOpen=false; break;
                case 'closeModal': AppState.showModal = null; AppState.selectedTeacher=null; AppState.currentOrderId=null; break;
                case 'switchModal': AppState.showModal = el.dataset.modal; break;
                case 'viewTeacher': AppState.selectedTeacher = Data.getTeacherById(el.dataset.id); AppState.showModal = 'teacher'; break;
                case 'bookTeacher':
                    if (!AppState.currentUser) { AppState.showModal = 'login'; break; }
                    AppState.selectedTeacher = Data.getTeacherById(el.dataset.id);
                    AppState.showModal = 'book';
                    break;
                case 'bookTrial':
                    if (!AppState.currentUser) { AppState.showModal = 'login'; break; }
                    AppState.selectedTeacher = Data.getTeacherById(el.dataset.id);
                    AppState.showModal = 'trial';
                    break;
                case 'toggleFavorite': {
                    const id = Number(el.dataset.id);
                    const idx = AppState.favorites.indexOf(id);
                    if (idx===-1) { AppState.favorites.push(id); Toast.show('已添加到收藏','success'); }
                    else { AppState.favorites.splice(idx,1); Toast.show('已取消收藏','warning'); }
                    Data.saveFavorites(AppState.favorites);
                    break;
                }
                case 'searchInput': AppState.search.keyword = el.value; Data.saveSearchState(AppState.search); break;
                case 'searchTeachers': break;
                case 'resetSearch': AppState.search = {keyword:'', category:'全部', sortBy:'default', priceRange:'all', experience:'全部'}; Data.saveSearchState(AppState.search); break;
                case 'setCategory': AppState.search.category = el.dataset.category; Data.saveSearchState(AppState.search); break;
                case 'setSort': AppState.search.sortBy = el.dataset.sort; Data.saveSearchState(AppState.search); break;
                case 'setPriceRange': AppState.search.priceRange = el.dataset.price; Data.saveSearchState(AppState.search); break;
                case 'setExperience': AppState.search.experience = el.dataset.exp; Data.saveSearchState(AppState.search); break;
                case 'toggleAdvancedFilter': AppState.showAdvancedFilter = !AppState.showAdvancedFilter; break;
                case 'selectRole': AppState.role = el.dataset.role; break;
                case 'matchSubject': AppState.matchSubject = el.value; break;
                case 'matchBudget': AppState.matchBudget = el.value; break;
                case 'smartMatch':
                    AppState.search.category = CONFIG.CATEGORIES.includes(AppState.matchSubject) ? AppState.matchSubject : '全部';
                    Data.saveSearchState(AppState.search);
                    AppState.currentPage = 'teachers';
                    AppState.loading = true;
                    Toast.show('AI正在为你智能匹配老师...', 'info');
                    setTimeout(() => { AppState.loading = false; render(); }, 1500);
                    break;
                case 'handleLogin': handleLogin(); return;
                case 'handleRegister': handleRegister(); return;
                case 'handleBook': handleBook(); return;
                case 'handleTrial': handleTrial(); return;
                case 'handleReview': handleReview(); return;
                case 'orderAction': handleOrderAction(el); return;
                case 'cancelOrder': cancelOrder(el.dataset.id); return;
                case 'teacherConfirmOrder': teacherConfirmOrder(el.dataset.id); return;
                case 'completeOrder': completeOrder(el.dataset.id); return;
                case 'enterClassroom': enterClassroom(el.dataset.id); return;
                case 'contactTeacher': contactTeacher(el.dataset.teacher, el.dataset.teacherId); return;
                case 'toggleAIChat':
                    AppState.aiChatOpen = !AppState.aiChatOpen;
                    if (AppState.aiChatOpen && AppState.aiMessages.length === 0) {
                        AppState.aiMessages.push({role:'bot', text: CONFIG.AI_RESPONSES[0]});
                    }
                    break;
                case 'sendAIMessage': sendAIMessage(); return;
                case 'aiQuick': {
                    const q = el.dataset.q;
                    AppState.aiMessages.push({role:'user', text:q});
                    AppState.aiTyping = true;
                    render();
                    setTimeout(() => {
                        let response = CONFIG.AI_RESPONSES[0];
                        if (q.includes('老师')) response = CONFIG.AI_RESPONSES[1];
                        else if (q.includes('效率')) response = CONFIG.AI_RESPONSES[3];
                        else if (q.includes('计划')) response = CONFIG.AI_RESPONSES[2];
                        else if (q.includes('选')) response = CONFIG.AI_RESPONSES[4];
                        AppState.aiMessages.push({role:'bot', text:response});
                        AppState.aiTyping = false;
                        render();
                    }, 1000);
                    return;
                }
                case 'sendMessage': sendMessage(el.dataset.teacherId, el.dataset.teacherName); return;
                case 'setClassroomTab': AppState.classroomTab = el.dataset.tab; break;
                case 'classroomControl': Toast.show('功能演示中', 'info'); break;
                case 'guideNext': AppState.guideStep++; break;
                case 'guidePrev': AppState.guideStep--; break;
                case 'guideDone':
                    AppState.showGuide = false;
                    Store.set(CONFIG.STORAGE_KEYS.GUIDE_SHOWN, true);
                    break;
                case 'logout': AppState.currentUser=null; Store.remove(CONFIG.STORAGE_KEYS.USER); Toast.show('已退出登录','success'); AppState.currentPage='home'; AppState.mobileMenuOpen=false; break;
                case 'toggleMobileMenu': AppState.mobileMenuOpen = !AppState.mobileMenuOpen; AppState.notificationsOpen=false; break;
                case 'toggleNotifications': AppState.notificationsOpen = !AppState.notificationsOpen; AppState.mobileMenuOpen=false; break;
                case 'readNotification': {
                    const list = Data.getNotifications();
                    const n = list.find(x => String(x.id) === String(el.dataset.id));
                    if (n) { n.read = true; Data.saveNotifications(list); }
                    break;
                }
                case 'markAllRead': {
                    const list = Data.getNotifications();
                    list.forEach(n => n.read = true);
                    Data.saveNotifications(list);
                    Toast.show('已全部标记为已读','success');
                    break;
                }
                case 'setRating': {
                    const val = Number(el.dataset.value);
                    AppState.reviewRating = val;
                    const ratingEl = el.closest('.star-rating');
                    if (ratingEl) {
                        ratingEl.querySelectorAll('.star').forEach(s => {
                            s.classList.toggle('active', Number(s.dataset.value) <= val);
                        });
                    }
                    return;
                }
                case 'showToast': Toast.show(el.dataset.message, el.dataset.type || 'info'); break;
                case 'stopPropagation': if (e) e.stopPropagation(); return;
            }
            render();
        }

        function setupEvents() {
            const app = document.getElementById('app');
            if (!app) return;
            app.addEventListener('click', (e) => {
                const target = e.target.closest('[data-action]');
                if (!target) return;
                const action = target.dataset.action;
                if (action === 'stopPropagation') { e.stopPropagation(); return; }
                if (target.dataset.stop === 'true') e.stopPropagation();
                e.preventDefault();
                handleAction(action, target, e);
            });
            app.addEventListener('input', (e) => {
                if (e.target.dataset.action === 'searchInput') {
                    AppState.search.keyword = e.target.value;
                    Data.saveSearchState(AppState.search);
                }
            });
            app.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (e.target.id === 'ai-input') { sendAIMessage(); e.preventDefault(); }
                    if (e.target.id === 'msg-input') {
                        const btn = document.querySelector('[data-action="sendMessage"]');
                        if (btn) { sendMessage(btn.dataset.teacherId, btn.dataset.teacherName); e.preventDefault(); }
                    }
                }
            });
            document.addEventListener('click', (e) => {
                if (AppState.notificationsOpen && !e.target.closest('.notifications-panel') && !e.target.closest('[data-action="toggleNotifications"]')) {
                    AppState.notificationsOpen = false;
                    render();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && AppState.showModal) {
                    AppState.showModal = null;
                    AppState.selectedTeacher = null;
                    AppState.currentOrderId = null;
                    render();
                }
            });
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    requestAnimationFrame(() => {
                        const header = document.querySelector('.header');
                        if (header) {
                            if (window.scrollY > 20) header.classList.add('header-scrolled');
                            else header.classList.remove('header-scrolled');
                        }
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        }

        function init() {
            const savedUser = Store.get(CONFIG.STORAGE_KEYS.USER, null);
            if (savedUser) AppState.currentUser = savedUser;
            setupEvents();
            render();
            setTimeout(() => {
                initReveal();
                animateNumbers();
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
