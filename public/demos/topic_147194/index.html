<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 测脑龄 - 你的大脑几岁了？</title>
<style>
  :root {
    --bg: #0a0a2e;
    --card: rgba(255,255,255,0.08);
    --text: #e0e0ff;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --success: #00cec9;
    --danger: #ff6b6b;
    --gold: #fdcb6e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    overflow: hidden;
    height: 100vh; width: 100vw;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 0; }
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ====== START SCREEN ====== */
  #start-screen { text-align: center; animation: fadeInUp 0.8s ease; }
  #start-screen .logo { font-size: 80px; margin-bottom: 10px; animation: pulse 2s ease-in-out infinite; }
  #start-screen h1 {
    font-size: 52px; font-weight: 900;
    background: linear-gradient(135deg, var(--accent2), var(--success), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  #start-screen .subtitle { color: #8888cc; font-size: 18px; margin-bottom: 40px; letter-spacing: 4px; }
  .difficulty-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .btn-diff {
    padding: 16px 36px; border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    background: var(--card); color: var(--text);
    font-size: 18px; font-weight: 700; cursor: pointer;
    transition: all 0.3s ease; backdrop-filter: blur(10px);
    position: relative; overflow: hidden;
  }
  .btn-diff:hover { transform: translateY(-4px); border-color: var(--accent2); box-shadow: 0 8px 32px rgba(108,92,231,0.4); }
  .btn-diff:active { transform: scale(0.95); }
  .btn-diff .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
  .btn-diff .label { font-size: 13px; opacity: 0.7; margin-top: 4px; }

  /* ====== GAME SCREEN ====== */
  #game-screen { display: none; width: 100%; height: 100%; position: relative; }
  #top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 30px; z-index: 10; gap: 12px; flex-wrap: wrap;
  }
  #top-bar .info {
    background: var(--card); backdrop-filter: blur(10px);
    border-radius: 12px; padding: 10px 20px;
    color: var(--text); font-size: 15px; font-weight: 600;
  }
  #top-bar .info span { color: var(--accent2); font-size: 20px; }
  #trap-hint {
    position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
    background: rgba(255,107,107,0.2); border: 1px solid #ff6b6b;
    border-radius: 10px; padding: 6px 16px; z-index: 10;
    color: #ff6b6b; font-size: 14px; font-weight: 700;
    display: none; pointer-events: none;
  }
  #timer-row {
    position: absolute; top: 80px; left: 30px; right: 30px;
    display: flex; align-items: center; gap: 12px; z-index: 10;
  }
  #countdown-bar-wrap {
    flex: 1; height: 8px; background: rgba(255,255,255,0.1);
    border-radius: 4px; overflow: hidden;
  }
  #countdown-bar {
    height: 100%; border-radius: 3px; width: 100%;
    background: linear-gradient(90deg, var(--danger), var(--gold), var(--success));
    transition: width 0.1s linear;
  }
  #prompt-text {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; color: var(--text);
    text-align: center; pointer-events: none; z-index: 5;
    text-shadow: 0 0 30px rgba(162,155,254,0.5);
    transition: opacity 0.3s;
    white-space: nowrap; max-width: 95vw; overflow: hidden; text-overflow: ellipsis;
  }
  #game-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 2;
    cursor: pointer; pointer-events: auto;
  }
  /* 暂停按钮 - 放在倒计时条旁边，圆圈 */
  .pause-btn {
    position: relative; flex-shrink: 0;
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(0,122,255,0.6);
    background: rgba(0,122,255,0.2); color: #fff;
    font-size: 20px; font-weight: 700; cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s; display: none;
    box-shadow: 0 0 12px rgba(0,122,255,0.3);
    line-height: 1; text-align: center;
  }
  .pause-btn:hover { background: rgba(0,122,255,0.4); transform: scale(1.1); box-shadow: 0 0 20px rgba(0,122,255,0.5); }
  .pause-btn:active { transform: scale(0.9); }
  .pause-btn.used { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .pause-btn.frozen { animation: freezePulse 0.5s ease-in-out infinite; }
  .pause-btn .pause-label {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: rgba(0,122,255,0.8); white-space: nowrap;
    font-weight: 600;
  }
  @keyframes freezePulse { 0%,100%{box-shadow:0 0 12px rgba(0,122,255,0.5)} 50%{box-shadow:0 0 28px rgba(0,122,255,0.9)} }
  @media (max-width:600px) {
    .pause-btn { width: 38px; height: 38px; font-size: 18px; }
  }
  @media (max-width:380px) {
    .pause-btn { width: 32px; height: 32px; font-size: 16px; }
  }
  #fx-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 3;
    pointer-events: none;
  }

  /* ====== OVERLAY & RESULT ====== */
  #overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    justify-content: center; align-items: center;
    backdrop-filter: blur(8px); overflow-y: auto;
  }
  #result-card {
    background: linear-gradient(145deg, #1a1a4e, #0d0d35);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 30px 36px;
    text-align: center; max-width: 460px; width: 92%;
    animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
    max-height: 90vh; overflow-y: auto;
  }
  #result-card .age-display {
    font-size: 80px; font-weight: 900;
    background: linear-gradient(135deg, #fdcb6e, #e17055, #6c5ce7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1;
  }
  #result-card .age-label { color: #999; font-size: 18px; margin: 6px 0 2px; }
  #result-card .age-comment { color: var(--gold); font-size: 18px; font-weight: 700; margin: 6px 0 16px; }
  #result-card .stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
  #result-card .stat { text-align: center; }
  #result-card .stat-val { font-size: 26px; font-weight: 800; color: var(--accent2); }
  #result-card .stat-lbl { font-size: 11px; color: #888; }

  /* ====== ACHIEVEMENT BADGES ====== */
  #new-achievements { margin: 16px 0; }
  #new-achievements .ach-title { color: var(--gold); font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .ach-badge-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .ach-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(253,203,110,0.15); border: 1px solid rgba(253,203,110,0.4);
    border-radius: 20px; padding: 6px 14px;
    font-size: 13px; font-weight: 700; color: var(--gold);
    animation: popIn 0.5s ease;
  }
  .ach-badge.locked { opacity: 0.35; border-color: rgba(255,255,255,0.15); color: #666; background: rgba(255,255,255,0.05); }

  .btn {
    display: inline-block; padding: 12px 28px; border-radius: 12px;
    border: none; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.3s; margin: 5px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #7d6ff0; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,0.5); }
  .btn-outline { background: transparent; color: var(--accent2); border: 2px solid var(--accent2); }
  .btn-outline:hover { background: rgba(108,92,231,0.15); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #ff5252; }
  .btn-sm { padding: 8px 18px; font-size: 13px; }

  /* ====== TOAST ====== */
  #toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--success); color: #000;
    padding: 12px 28px; border-radius: 12px;
    font-weight: 700; font-size: 15px; z-index: 200;
    transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ====== ACHIEVEMENT PANEL ====== */
  #ach-panel {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); z-index: 150;
    justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
  }
  #ach-panel .panel {
    background: linear-gradient(145deg, #1a1a4e, #0d0d35);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 24px;
    width: 92%; max-width: 420px; max-height: 85vh; overflow-y: auto;
    animation: popIn 0.4s ease;
  }
  #ach-panel h3 { font-size: 22px; color: var(--gold); text-align: center; margin-bottom: 16px; }
  #ach-panel .ach-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #ach-panel .ach-badge { cursor: default; }

  /* ====== RANKING ====== */
  #ranking-panel {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); z-index: 150;
    justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
  }
  #ranking-panel .panel {
    background: linear-gradient(145deg, #1a1a4e, #0d0d35);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 30px;
    width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto;
    animation: popIn 0.4s ease;
  }
  #ranking-panel h3 { font-size: 24px; color: var(--gold); text-align: center; margin-bottom: 20px; }
  #ranking-list { list-style: none; }
  #ranking-list li {
    display: flex; justify-content: space-between;
    padding: 12px 16px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05); color: var(--text);
    font-size: 15px; font-weight: 600;
  }
  #ranking-list li:nth-child(1) { background: rgba(253,203,110,0.2); color: var(--gold); }
  #ranking-list li:nth-child(2) { background: rgba(192,192,192,0.2); color: #c0c0c0; }
  #ranking-list li:nth-child(3) { background: rgba(205,127,50,0.2); color: #cd7f32; }

  /* ====== ANIMATIONS ====== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes popIn { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  @keyframes trapPulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  /* Responsive */
  @media (max-width: 600px) {
    #start-screen h1 { font-size: 28px; }
    #start-screen .logo { font-size: 44px; }
    #start-screen .subtitle { font-size: 13px; margin-bottom: 24px; letter-spacing: 2px; }
    .btn-diff { padding: 10px 16px; font-size: 13px; border-radius: 12px; }
    .btn-diff .emoji { font-size: 22px; }
    .btn-diff .label { font-size: 10px; }
    .difficulty-group { gap: 8px; }
    #result-card { padding: 20px 22px; }
    #result-card .age-display { font-size: 52px; }
    #top-bar { padding: 10px 12px; }
    #top-bar .info { padding: 6px 10px; font-size: 12px; }
    #top-bar .info span { font-size: 16px; }
    #timer-row { top: 60px; left: 12px; right: 12px; gap: 8px; }
    #countdown-bar-wrap { height: 5px; }
    #trap-hint { top: 70px; font-size: 12px; padding: 4px 10px; }
    #prompt-text { bottom: 30px; font-size: 18px; }
    .btn { padding: 10px 20px; font-size: 13px; }
    #ranking-panel .panel { padding: 20px; }
    #ach-panel .panel { padding: 16px; }
  }
  @media (max-width: 380px) {
    #start-screen h1 { font-size: 24px; }
    #start-screen .logo { font-size: 36px; }
    .btn-diff { padding: 8px 12px; font-size: 12px; }
    .btn-diff .emoji { font-size: 18px; }
    #result-card .age-display { font-size: 42px; }
    #top-bar .info { padding: 5px 8px; font-size: 11px; }
    #top-bar .info span { font-size: 14px; }
    #prompt-text { bottom: 20px; font-size: 15px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="toast"></div>

<div id="app">
  <div id="start-screen">
    <div class="logo">🧠</div>
    <h1>测 脑 龄</h1>
    <p class="subtitle">YOUR BRAIN AGE TEST</p>
    <div class="difficulty-group">
      <button class="btn-diff" onclick="startGame('child')"><span class="emoji">🧒</span>儿童模式<span class="label">3个圆 · 无时间限制</span></button>
      <button class="btn-diff" onclick="startGame('easy')"><span class="emoji">🌱</span>简单模式<span class="label">3个圆 · 时间充裕</span></button>
      <button class="btn-diff" onclick="startGame('normal')"><span class="emoji">⚡</span>普通模式<span class="label">3个圆 · 标准计时</span></button>
      <button class="btn-diff" onclick="startGame('hard')"><span class="emoji">🔥</span>困难模式<span class="label">4个圆 · 极速挑战</span></button>
    </div>
    <div style="margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="showRanking()">🏆 排行榜</button>
      <button class="btn btn-outline" onclick="showAchievements()">🎖 成就</button>
    </div>
  </div>

  <div id="game-screen">
    <div id="top-bar">
      <div class="info">🎯 关卡 <span id="level-num">1</span></div>
      <div class="info">⭐ 得分 <span id="score-num">0</span></div>
      <div class="info">🔥 连击 <span id="combo-num">0</span></div>
    </div>
    <div id="trap-hint"></div>
    <div id="timer-row">
      <div id="countdown-bar-wrap"><div id="countdown-bar"></div></div>
      <button class="pause-btn" id="item-pause" onclick="usePauseItem()" title="冻结3秒(每局1次)">⏸<span class="pause-label">暂停</span></button>
    </div>
    <div id="prompt-text">准备开始...</div>
    <canvas id="game-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
  </div>
</div>

<!-- 结果弹窗 -->
<div id="overlay">
  <div id="result-card">
    <div class="age-label">你的脑龄</div>
    <div class="age-display" id="age-display">25</div>
    <div class="age-label">岁</div>
    <div class="age-comment" id="age-comment"></div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="stat-score">0</div><div class="stat-lbl">总得分</div></div>
      <div class="stat"><div class="stat-val" id="stat-level">0</div><div class="stat-lbl">通过关卡</div></div>
      <div class="stat"><div class="stat-val" id="stat-maxcombo">0</div><div class="stat-lbl">最大连击</div></div>
    </div>
    <div id="new-achievements"></div>
    <button class="btn btn-primary" onclick="shareResult()">📤 分享成绩</button>
    <button class="btn btn-outline" onclick="restartGame()">🔄 再来一次</button>
    <button class="btn btn-outline" onclick="closeOverlay()">🏠 返回首页</button>
  </div>
</div>

<!-- 排行榜弹窗 -->
<div id="ranking-panel">
  <div class="panel">
    <h3>🏆 排行榜 TOP 10</h3>
    <ul id="ranking-list"></ul>
    <div style="text-align:center;margin-top:20px;">
      <button class="btn btn-outline" onclick="hideRanking()">关闭</button>
      <button class="btn btn-danger btn-sm" onclick="clearRanking()">🗑 清空</button>
    </div>
  </div>
</div>

<!-- 成就弹窗 -->
<div id="ach-panel">
  <div class="panel">
    <h3>🎖 成就徽章</h3>
    <div class="ach-grid" id="ach-grid"></div>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-outline" onclick="hideAchievements()">关闭</button>
    </div>
  </div>
</div>

<script>
// ==================== 音频引擎 ====================
class SoundEngine {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(freq, type, duration, vol=0.15, rampDown=true) {
    if (!this.enabled || !this.ctx) return;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    if (rampDown) gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + duration);
  }
  click() { this.play(800, 'sine', 0.08, 0.1); }
  correct() { this.play(523,'sine',0.1,0.12); setTimeout(()=>this.play(659,'sine',0.1,0.12),80); setTimeout(()=>this.play(784,'sine',0.15,0.2),160); }
  wrong() { this.play(150, 'sawtooth', 0.3, 0.2); }
  tick() { this.play(1000, 'sine', 0.03, 0.04); }
  levelUp() { for(let i=0;i<5;i++) setTimeout(()=>this.play(400+i*100,'sine',0.08,0.08),i*100); }
  gameOver() { this.play(200,'sawtooth',0.4,0.2); setTimeout(()=>this.play(150,'sawtooth',0.5,0.3),200); }
  achieve() { for(let i=0;i<3;i++) setTimeout(()=>this.play(600+i*200,'sine',0.12,0.12),i*120); }
  trapSkip() { this.play(300,'triangle',0.15,0.15); setTimeout(()=>this.play(400,'triangle',0.15,0.15),100); }
  ding() { this.play(880,'sine',0.25,0.18); }
  countdownBeep() { this.play(660,'sine',0.15,0.12); }
}
const sound = new SoundEngine();

// ==================== 背景粒子 ====================
class BgParticles {
  constructor(canvas) {
    this.cv=canvas; this.ctx=canvas.getContext('2d'); this.particles=[];
    this.resize(); window.addEventListener('resize',()=>this.resize()); this.animate();
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.cv.width = window.innerWidth * dpr;
    this.cv.height = window.innerHeight * dpr;
    this.cv.style.width = window.innerWidth + 'px';
    this.cv.style.height = window.innerHeight + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  create() { return { x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*2+0.5, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, alpha:Math.random()*0.5+0.1, hue:Math.random()*60+240 }; }
  animate() {
    const w = window.innerWidth, h = window.innerHeight;
    this.ctx.clearRect(0, 0, w, h);
    if (this.particles.length<80) this.particles.push(this.create());
    for (let p of this.particles) {
      p.x+=p.vx; p.y+=p.vy;
      if (p.x<0)p.x=w; if (p.x>w)p.x=0;
      if (p.y<0)p.y=h; if (p.y>h)p.y=0;
      this.ctx.beginPath(); this.ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      this.ctx.fillStyle=`hsla(${p.hue},80%,70%,${p.alpha})`; this.ctx.fill();
    }
    for (let i=0;i<this.particles.length;i+=4)
      for (let j=i+1;j<this.particles.length;j+=4) {
        const dx=this.particles[i].x-this.particles[j].x, dy=this.particles[i].y-this.particles[j].y, dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<120) { this.ctx.beginPath(); this.ctx.moveTo(this.particles[i].x,this.particles[i].y); this.ctx.lineTo(this.particles[j].x,this.particles[j].y); this.ctx.strokeStyle=`rgba(162,155,254,${0.06*(1-dist/120)})`; this.ctx.lineWidth=0.5; this.ctx.stroke(); }
      }
    requestAnimationFrame(()=>this.animate());
  }
}

// ==================== 特效粒子 ====================
class EffectParticles {
  constructor(canvas) { this.cv=canvas; this.ctx=canvas.getContext('2d'); this.particles=[]; this.animate(); }
  emit(x,y,count,color,speed=3) {
    for (let i=0;i<count;i++) {
      const angle=(Math.PI*2/count)*i+Math.random()*0.3, spd=Math.random()*speed+1;
      this.particles.push({ x,y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd, life:1, decay:Math.random()*0.03+0.02, color, r:Math.random()*4+2 });
    }
  }
  animate() {
    this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (let p of this.particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=p.decay; p.r*=0.98; }
    this.particles=this.particles.filter(p=>p.life>0);
    for (let p of this.particles) { this.ctx.beginPath(); this.ctx.arc(p.x,p.y,p.r,0,Math.PI*2); this.ctx.fillStyle=p.color.replace('1)',`${p.life})`).replace('rgb','rgba'); this.ctx.fill(); }
    requestAnimationFrame(()=>this.animate());
  }
}

function getStats() {
  try { return JSON.parse(localStorage.getItem('brain_age_stats')||'{}'); } catch { return {}; }
}
function saveStats(s) { localStorage.setItem('brain_age_stats', JSON.stringify(s)); }

function initStats() {
  return {
    gamesPlayed: 0, bestLevel: 0, bestCombo: 0, bestBrainAge: 999,
    bestScore: 0, hellCompleted: false, speedDemon: false,
    lastPlayDate: '', streak: 0, maxStreak: 0,
    trapLevelsCleared: 0, unlocked: [],
  };
}

function checkAchievements() {
  const s = getStats();
  if (!s.unlocked) s.unlocked = [];
  const newly = [];

  // Update streak
  const today = new Date().toLocaleDateString('zh-CN');
  const yesterday = new Date(Date.now()-86400000).toLocaleDateString('zh-CN');
  if (s.lastPlayDate === yesterday) { s.streak++; }
  else if (s.lastPlayDate !== today) { s.streak = 1; }
  s.lastPlayDate = today;
  if (s.streak > (s.maxStreak||0)) s.maxStreak = s.streak;

  const checks = [
    ['first_game', s.gamesPlayed >= 1],
    ['reach_lv5', s.bestLevel >= 5],
    ['reach_lv10', s.bestLevel >= 10],
    ['reach_lv15', s.bestLevel >= 15],
    ['combo_10', s.bestCombo >= 10],
    ['combo_20', s.bestCombo >= 20],
    ['brain_20', s.bestBrainAge <= 20],
    ['brain_18', s.bestBrainAge <= 18],
    ['games_10', s.gamesPlayed >= 10],
    ['games_30', s.gamesPlayed >= 30],
    ['score_2000', s.bestScore >= 2000],
    ['score_5000', s.bestScore >= 5000],
    ['hell_mode', s.hellCompleted],
    ['speed_demon', s.speedDemon],
    ['week_streak', s.streak >= 7],
    ['color_master', (s.trapLevelsCleared||0) >= 5],
  ];

  for (let [key, cond] of checks) {
    if (cond && !s.unlocked.includes(key)) {
      s.unlocked.push(key);
      newly.push(key);
    }
  }

  saveStats(s);
  return newly;
}

function updateGameStats() {
  const s = getStats();
  if (!s.gamesPlayed) Object.assign(s, initStats());
  s.gamesPlayed++;
  if (state.level-1 > s.bestLevel) s.bestLevel = state.level-1;
  if (state.maxCombo > s.bestCombo) s.bestCombo = state.maxCombo;
  if (state.score > s.bestScore) s.bestScore = state.score;
  if (state.difficulty === 'hell' && state.level > 1) s.hellCompleted = true;
  if (state.trapCleared) s.trapLevelsCleared = (s.trapLevelsCleared||0) + 1;

  const brainAge = calculateBrainAge();
  if (typeof brainAge === 'number' && brainAge < s.bestBrainAge) s.bestBrainAge = brainAge;

  saveStats(s);
}

// ==================== 主游戏状态 ====================
const state = {
  difficulty: 'normal', level: 1, score: 0, combo: 0, maxCombo: 0,
  totalTime: 0, gameOver: false, phase: 'idle',
  circles: [], correctSeq: [], userSeq: [], clickedSet: new Set(),
  countdownRemain: 0, countdownTotal: 0,
  countdownTimer: null, memorizeTimer: null, startTime: null,
  canvasW: 0, canvasH: 0,
  trapColorIndices: [], // 陷阱色在调色板中的索引
  levelStartTime: null, // 本关开始时间(用于闪电反应判定)
  trapCleared: false, // 本局是否在陷阱模式下通关过
  timeBank: 0,        // 上关剩余时间滚入本关的奖励(ms)
  baseTimeLimit: 0,   // 本关基础时间限制(ms)
  pauseAvailable: false, // 暂停道具是否可用
  freezeActive: false,   // 是否正在冻结
  freezeTimer: null,     // 冻结计时器
  cdInterval: null,      // 倒计时interval引用
  revealAnswer: false,  // 答错后显示正确答案
  hintTimer: null,       // 儿童模式闪烁提示计时器
  hintFlash: false,      // 儿童模式闪烁状态
};

function getTimeLimit() { return { child:0, easy:12, normal:8, hard:6 }[state.difficulty]||8; }
function getStartCount() { return { child:3, easy:3, normal:3, hard:4 }[state.difficulty]||3; }
function getMemorizeTime() { return { child:5, easy:5, normal:4, hard:3 }[state.difficulty]||4; }

function getTrapCount() {
  if (state.level < 6) return 0;
  if (state.level < 10) return 1;
  return 2;
}

// ==================== Canvas ====================
const gameCanvas = document.getElementById('game-canvas');
const gameCtx = gameCanvas.getContext('2d');
const fxCanvas = document.getElementById('fx-canvas');

function resizeGameCanvas() {
  const dpr = window.devicePixelRatio || 1;
  gameCanvas.width = fxCanvas.width = window.innerWidth * dpr;
  gameCanvas.height = fxCanvas.height = window.innerHeight * dpr;
  gameCanvas.style.width = fxCanvas.style.width = window.innerWidth + 'px';
  gameCanvas.style.height = fxCanvas.style.height = window.innerHeight + 'px';
  gameCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fxCtx = fxCanvas.getContext('2d');
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  state.canvasW = window.innerWidth; state.canvasH = window.innerHeight;
}
window.addEventListener('resize', resizeGameCanvas);
resizeGameCanvas();

gameCanvas.addEventListener('click', (e) => {
  if (state.gameOver || state.phase !== 'playing') return;
  const rect = gameCanvas.getBoundingClientRect();
  handleCircleClick(e.clientX - rect.left, e.clientY - rect.top);
});
gameCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (state.gameOver || state.phase !== 'playing') return;
  const rect = gameCanvas.getBoundingClientRect(), t = e.touches[0];
  handleCircleClick(t.clientX - rect.left, t.clientY - rect.top);
}, { passive: false });

// ==================== 点击处理 ====================
function handleCircleClick(cx, cy) {
  const closest = findClosestCircle(cx, cy);
  if (!closest) return;
  if (state.clickedSet.has(closest.id)) return;

  // 陷阱球：点了就错
  if (closest.isTrap) {
    sound.init(); sound.wrong();
    state.gameOver = true; state.combo = 0;
    document.getElementById('item-pause').classList.add('used');
    effectParticles.emit(cx, cy, 30, 'rgb(255,107,107)', 6);
    document.getElementById('game-screen').style.animation = 'shake 0.5s ease';
    setTimeout(() => document.getElementById('game-screen').style.animation = '', 500);
    highlightWrongCircle(closest.id);
    clearCountdown();
    state.revealAnswer = true; drawGame();
    setTimeout(() => { state.revealAnswer = false; showResult(); }, 2000);
    return;
  }

  const expectedNum = state.correctSeq[state.userSeq.length];
  if (closest.number === expectedNum) {
    sound.init(); sound.click();
    state.clickedSet.add(closest.id);
    state.userSeq.push(closest.number);
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;

    const timeBonus = (state.countdownRemain < Infinity) ? Math.floor(state.countdownRemain / state.countdownTotal * 30) : 0;
    const comboBonus = Math.min(state.combo * 5, 50);
    state.score += 100 + timeBonus + comboBonus;

    effectParticles.emit(cx, cy, 20, 'rgb(0,206,201)', 4);
    updateUI();

    // 点击后重置闪烁计时
    startHintTimer();

    if (state.userSeq.length === state.correctSeq.length) {
      handleLevelComplete();
    }
  } else {
    sound.init(); sound.wrong();
    state.gameOver = true; state.combo = 0;
    document.getElementById('item-pause').classList.add('used');
    effectParticles.emit(cx, cy, 30, 'rgb(255,107,107)', 6);
    document.getElementById('game-screen').style.animation = 'shake 0.5s ease';
    setTimeout(() => document.getElementById('game-screen').style.animation = '', 500);
    highlightWrongCircle(closest.id);
    clearCountdown();
    state.revealAnswer = true; drawGame();
    setTimeout(() => { state.revealAnswer = false; showResult(); }, 2000);
  }
  drawGame();
}

function findClosestCircle(cx, cy) {
  let best = null, bestDist = Infinity;
  for (let c of state.circles) {
    const dist = Math.hypot(cx - c.x, cy - c.y);
    if (dist < c.r + 10 && dist < bestDist) { bestDist = dist; best = c; }
  }
  return best;
}

function highlightWrongCircle(id) {
  const c = state.circles.find(c => c.id === id);
  if (c) { c.wrong = true; drawGame(); }
  setTimeout(() => { if (c) { c.wrong = false; drawGame(); } }, 1200);
}

// ==================== 关卡完成 ====================
function handleLevelComplete() {
  sound.init(); sound.levelUp();
  clearCountdown();
  stopHintTimer();
  state.phase = 'levelup';
  state.totalTime += (Date.now() - state.startTime) / 1000;
  state.startTime = null;
  // 隐藏道具按钮
  document.getElementById('item-pause').style.display = 'none';

  // 时间银行: 剩余时间30%滚入下一关 (无时间限制模式跳过)
  const remaining = state.countdownRemain;
  if (remaining > 0 && remaining < Infinity) {
    state.timeBank = Math.floor(remaining * 0.3);
  }

  // 闪电反应判定
  const levelElapsed = (Date.now() - state.levelStartTime) / 1000;
  if (levelElapsed < 3) {
    const s = getStats(); s.speedDemon = true; saveStats(s);
  }

  // 陷阱模式通关标记
  if (getTrapCount() > 0) state.trapCleared = true;

  // 显示陷阱球的数字
  const trapBalls = state.circles.filter(c => c.isTrap);
  let msg = '';
  if (trapBalls.length > 0) {
    sound.trapSkip();
    msg = `✅ 正确！跳过的陷阱数字: ${trapBalls.map(c=>c.number).join('、')}`;
  } else {
    msg = '✅ 太棒了！准备下一关...';
  }
  if (state.timeBank > 0) {
    msg += ` ⏱+${(state.timeBank/1000).toFixed(1)}s 时间加成!`;
  }
  document.getElementById('prompt-text').textContent = msg;
  document.getElementById('prompt-text').style.display = 'block';

  drawGame(true);
  state.level++; state.combo = 0;
  updateUI();

  setTimeout(() => {
    document.getElementById('prompt-text').style.display = 'none';
    startLevel();
  }, 2200);
}

function clearCountdown() {
  if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
}

// ==================== 闪烁提示 ====================
function startHintTimer() {
  stopHintTimer();
  state.hintTimer = setTimeout(() => {
    flashHint();
  }, 3000);
}

function stopHintTimer() {
  if (state.hintTimer) { clearInterval(state.hintTimer); state.hintTimer = null; }
  state.hintFlash = false;
}

function flashHint() {
  const nextNum = state.correctSeq[state.userSeq.length];
  const nextCircle = state.circles.find(c => c.number === nextNum && !c.isTrap);
  if (!nextCircle || state.gameOver || state.phase !== 'playing') return;

  // 不停闪烁，直到用户点击
  const flashInterval = setInterval(() => {
    if (state.gameOver || state.phase !== 'playing' || state.userSeq.length >= state.correctSeq.length) {
      clearInterval(flashInterval);
      state.hintFlash = false;
      drawGame(false);
      return;
    }
    state.hintFlash = !state.hintFlash;
    drawGame(false);
  }, 400);
  state.hintTimer = flashInterval; // 保存引用以便stopHintTimer清理
}

// ==================== 绘制 ====================
function drawGame(revealAll=false) {
  gameCtx.clearRect(0, 0, state.canvasW, state.canvasH);

  for (let c of state.circles) {
    const { x, y, r, number, id, isTrap, color } = c;
    const isClicked = state.clickedSet.has(id);
    const isWrong = c.wrong;

    gameCtx.shadowColor = 'rgba(0,0,0,0.4)';
    gameCtx.shadowBlur = 15;

    // 圆圈填充
    let fillColor;
    if (isWrong) fillColor = '#ff6b6b';
    else if (isClicked) fillColor = '#00cec9';
    else if (isTrap && revealAll) fillColor = color;
    else if (isTrap) fillColor = '#444';
    else fillColor = color;

    gameCtx.beginPath();
    gameCtx.arc(x, y, r, 0, Math.PI*2);
    gameCtx.fillStyle = fillColor;
    gameCtx.fill();

    // 边框
    gameCtx.shadowBlur = 0;
    if (isTrap) {
      // 陷阱球：虚线红色边框
      gameCtx.setLineDash([6, 4]);
      gameCtx.strokeStyle = '#ff6b6b';
      gameCtx.lineWidth = 3;
    } else if (state.hintFlash && !isClicked && number === state.correctSeq[state.userSeq.length]) {
      // 闪烁提示：外发光环
      gameCtx.setLineDash([]);
      // 外层大光晕
      gameCtx.beginPath();
      gameCtx.arc(x, y, r + 12, 0, Math.PI * 2);
      gameCtx.strokeStyle = 'rgba(253,203,110,0.35)';
      gameCtx.lineWidth = 8;
      gameCtx.shadowColor = 'rgba(253,203,110,0.9)';
      gameCtx.shadowBlur = 30;
      gameCtx.stroke();
      // 内层边框
      gameCtx.beginPath();
      gameCtx.arc(x, y, r, 0, Math.PI * 2);
      gameCtx.strokeStyle = '#fdcb6e';
      gameCtx.lineWidth = 5;
      gameCtx.stroke();
    } else {
      gameCtx.setLineDash([]);
      gameCtx.strokeStyle = 'rgba(255,255,255,0.35)';
      gameCtx.lineWidth = 2.5;
    }
    gameCtx.stroke();
    gameCtx.setLineDash([]);

    // 内发光
    const grad = gameCtx.createRadialGradient(x-r*0.4, y-r*0.4, 0, x, y, r);
    grad.addColorStop(0, 'rgba(255,255,255,0.22)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    gameCtx.beginPath(); gameCtx.arc(x, y, r, 0, Math.PI*2);
    gameCtx.fillStyle = grad; gameCtx.fill();

    // 陷阱标记: X
    if (isTrap && !revealAll && !isClicked) {
      gameCtx.strokeStyle = '#ff6b6b';
      gameCtx.lineWidth = 2.5;
      const s = r * 0.35;
      gameCtx.beginPath();
      gameCtx.moveTo(x-s, y-s); gameCtx.lineTo(x+s, y+s);
      gameCtx.moveTo(x+s, y-s); gameCtx.lineTo(x-s, y+s);
      gameCtx.stroke();
    }

    // 数字
    if (revealAll || isClicked || state.revealAnswer) {
      gameCtx.fillStyle = '#fff';
      gameCtx.font = `bold ${Math.floor(r*0.85)}px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
      gameCtx.textAlign = 'center'; gameCtx.textBaseline = 'middle';
      gameCtx.shadowColor = 'rgba(0,0,0,0.5)'; gameCtx.shadowBlur = 4;
      gameCtx.fillText(number, x, y);
      gameCtx.shadowBlur = 0;
    }
  }
}

function updateUI() {
  document.getElementById('level-num').textContent = state.level;
  document.getElementById('score-num').textContent = state.score;
  document.getElementById('combo-num').textContent = state.combo;
}

// ==================== 关卡生成 ====================
function startLevel() {
  state.circles = []; state.correctSeq = []; state.userSeq = [];
  state.clickedSet = new Set(); state.gameOver = false;
  state.phase = 'memorize'; state.levelStartTime = Date.now();

  const count = getStartCount() + state.level - 1;
  const isMobile = state.canvasW < 600;
  const r = isMobile
    ? Math.min(42, Math.max(28, 52 - (count-3)*3))
    : Math.min(55, Math.max(35, 65 - (count-3)*3));
  const trapCount = getTrapCount();

  // 分配颜色（每个球一个不同颜色，从调色板随机取）
  const shuffledColors = [...COLOR_PALETTE].sort(() => Math.random() - 0.5);
  const colors = [];
  for (let i = 0; i < count; i++) {
    colors.push(shuffledColors[i % shuffledColors.length]);
  }

  // 选择陷阱球（随机选 trapCount 个）
  const trapIndices = new Set();
  while (trapIndices.size < trapCount) {
    trapIndices.add(Math.floor(Math.random() * count));
  }

  // 生成位置
  const margin = r + 20;
  const topOffset = isMobile ? 85 : 130;
  const bottomOffset = isMobile ? 60 : 50;
  const availW = state.canvasW - margin*2;
  const availH = state.canvasH - topOffset - bottomOffset - margin*2;
  const positions = [];
  const minDist = r * 2.6;

  for (let i = 0; i < count; i++) {
    let x, y, attempts = 0;
    do {
      x = margin + Math.random() * availW;
      y = topOffset + margin + Math.random() * availH;
      attempts++;
    } while (attempts < 200 && positions.some(p => Math.hypot(p.x-x, p.y-y) < minDist));
    positions.push({x, y});

    const isTrap = trapIndices.has(i);
    state.circles.push({
      id: i, x, y, r, number: i+1, wrong: false,
      color: colors[i], isTrap,
    });
    if (!isTrap) state.correctSeq.push(i+1);
  }

  updateUI();
  drawGame(true);

  // 提示文字 - 陷阱提示
  const trapHint = document.getElementById('trap-hint');
  if (trapCount > 0) {
    const trapColors = [...trapIndices].map(i => colors[i]);
    const colorNames = trapColors.map(c => {
      const map = { '#FF3B30':'红色','#FF9500':'橙色','#FFD60A':'黄色','#34C759':'绿色','#00C7BE':'青色','#007AFF':'蓝色','#AF52DE':'紫色','#FF2D55':'粉色','#CD853F':'棕色' };
      return map[c] || '彩色';
    });
    const trapNums = [...trapIndices].map(i => i+1);
    trapHint.textContent = `⚠️ 跳过 ${colorNames.join('、')} 球 (虚线X标记) —— 数字: ${trapNums.join('、')}`;
    trapHint.style.display = 'block';
  } else {
    trapHint.style.display = 'none';
  }

  const prompt = document.getElementById('prompt-text');
  prompt.style.display = 'block';
  const trapNote = trapCount > 0 ? ` (有${trapCount}个陷阱球不能点!)` : '';

  // ====== 倒计时 = 记忆时间，叮后直接开始 ======
  const isChild = state.difficulty === 'child';
  state.phase = 'countdown';
  let cd = 3;
  sound.init(); sound.countdownBeep();
  prompt.textContent = cd;
  prompt.style.fontSize = '60px';

  // 时间银行提示
  if (state.timeBank > 0) {
    document.getElementById('countdown-bar').style.width = '100%';
    document.getElementById('countdown-bar').style.background = 'linear-gradient(90deg, #fdcb6e, #00cec9)';
  }

  // 启用冻结道具(倒计时阶段可用，儿童模式不可用)
  state.pauseAvailable = !isChild;
  if (!isChild) {
    document.getElementById('item-pause').style.display = 'block';
    document.getElementById('item-pause').classList.remove('used','frozen');
  } else {
    document.getElementById('item-pause').style.display = 'none';
  }

  state.cdInterval = setInterval(() => {
    cd--;
    if (cd > 0) {
      prompt.textContent = cd;
      sound.countdownBeep();
    } else {
      clearInterval(state.cdInterval);
      state.cdInterval = null;
      prompt.textContent = '🔔';
      prompt.style.fontSize = '60px';
      sound.ding();

      // 隐藏冻结按钮
      document.getElementById('item-pause').style.display = 'none';
      document.getElementById('item-pause').classList.remove('frozen');

      setTimeout(() => {
        prompt.style.fontSize = '';

        if (isChild) {
          prompt.textContent = '👆 按顺序点击!';
        } else {
          const clickMsg = trapCount > 0 ? '👆 按顺序点击(跳过X标记的陷阱球)!' : '👆 请按顺序点击！';
          prompt.textContent = clickMsg;
        }

        state.phase = 'playing';
        state.levelStartTime = Date.now();
        state.startTime = Date.now();

        if (isChild) {
          document.getElementById('countdown-bar-wrap').style.display = 'none';
          state.countdownTotal = Infinity;
          state.countdownRemain = Infinity;
          drawGame(false);
        } else {
          state.baseTimeLimit = getTimeLimit() * 1000;
          state.countdownTotal = state.baseTimeLimit + state.timeBank;
          state.countdownRemain = state.countdownTotal;
          state.timeBank = 0;
          drawGame(false);
          startCountdown();
        }
        startHintTimer();
      }, 400);
    }
  }, 1000);
}

function startCountdown() {
  clearCountdown();
  state.countdownTimer = setInterval(() => {
    state.countdownRemain -= 50;
    if (state.countdownRemain <= 0) {
      state.countdownRemain = 0;
      clearCountdown();
      if (!state.gameOver) {
        state.gameOver = true;
        document.getElementById('item-pause').classList.add('used');
        sound.init(); sound.gameOver();
        document.getElementById('prompt-text').textContent = '⏰ 时间到！';
        document.getElementById('prompt-text').style.display = 'block';
        drawGame(true);
        setTimeout(() => showResult(), 1500);
      }
    }
    const total = state.countdownTotal;
    const base = state.baseTimeLimit;
    const pct = (state.countdownRemain / total) * 100;
    const bar = document.getElementById('countdown-bar');
    bar.style.width = pct + '%';
    // 橙色加成段: 剩余时间在加成范围内时，右侧显示橙色
    if (state.countdownRemain > base) {
      const bonusRemain = state.countdownRemain - base;
      const orangePct = (bonusRemain / state.countdownRemain) * 100;
      const split = 100 - orangePct;
      bar.style.background = `linear-gradient(90deg, #fdcb6e 0%, #00cec9 ${split}%, #ff9500 ${split}%, #ff5e00 100%)`;
    } else {
      const basePct = (state.countdownRemain / base) * 100;
      if (basePct < 25) bar.style.background = '#ff6b6b';
      else if (basePct < 50) bar.style.background = 'linear-gradient(90deg, #ff6b6b, #fdcb6e)';
      else bar.style.background = 'linear-gradient(90deg, #fdcb6e, #00cec9)';
    }
    if (state.countdownRemain < 3000 && state.countdownRemain % 500 < 50) sound.tick();
    if (state.countdownRemain < 1000 && state.countdownRemain % 200 < 50) sound.tick();
  }, 50);
}

// ==================== 结果显示 ====================
function showResult() {
  clearCountdown();
  if (state.memorizeTimer) clearTimeout(state.memorizeTimer);
  if (state.startTime) state.totalTime += (Date.now() - state.startTime) / 1000;

  updateGameStats();
  const newly = checkAchievements();

  const brainAge = calculateBrainAge();
  const comment = getBrainComment(brainAge);

  document.getElementById('age-display').textContent = brainAge;
  document.getElementById('age-comment').textContent = comment;
  document.getElementById('stat-score').textContent = state.score;
  document.getElementById('stat-level').textContent = Math.max(0, state.level - 1);
  document.getElementById('stat-maxcombo').textContent = state.maxCombo;

  // 新成就展示
  const achDiv = document.getElementById('new-achievements');
  if (newly.length > 0) {
    sound.init(); sound.achieve();
    achDiv.innerHTML = `
      <div class="ach-title">🎉 解锁新成就!</div>
      <div class="ach-badge-row">
        ${newly.map(k => {
          const a = ACHIEVEMENTS[k];
          return `<span class="ach-badge">${a.icon} ${a.name}</span>`;
        }).join('')}
      </div>`;
  } else {
    achDiv.innerHTML = '';
  }

  document.getElementById('overlay').style.display = 'flex';
  saveScore(state.score, brainAge, state.level - 1);
}

function calculateBrainAge() {
  if (state.score >= 5000) return '🧠超脑';
  const minAge=18, maxAge=80, maxScore=5000;
  const norm = Math.min(state.score/maxScore, 0.99);
  return Math.round(maxAge - (maxAge-minAge)*Math.log1p(norm*9)/Math.log1p(9));
}

function getBrainComment(age) {
  if (age === '🧠超脑') return '🏆 你的大脑超越了凡人！传说中的超脑拥有者！';
  if (age <= 20) return '🌟 天才大脑！你的反应速度堪比职业电竞选手！';
  if (age <= 30) return '🧠 大脑正值巅峰！记忆力非常出色！';
  if (age <= 40) return '💪 状态不错！大脑保持良好运转！';
  if (age <= 55) return '😊 正常水平！多玩玩还能更年轻！';
  if (age <= 70) return '🤔 需要锻炼了！建议每天玩玩脑力游戏！';
  return '😴 大脑该醒醒了！赶紧多做脑力训练吧！';
}

// ==================== 成就面板 ====================
function showAchievements() {
  const s = getStats();
  if (!s.unlocked) s.unlocked = [];
  const grid = document.getElementById('ach-grid');
  grid.innerHTML = Object.entries(ACHIEVEMENTS).map(([key, a]) => {
    const unlocked = s.unlocked.includes(key);
    return `<span class="ach-badge${unlocked ? '' : ' locked'}">${a.icon} ${a.name}<br><small style="font-weight:400;opacity:0.7">${a.desc}</small></span>`;
  }).join('');
  document.getElementById('ach-panel').style.display = 'flex';
}
function hideAchievements() { document.getElementById('ach-panel').style.display = 'none'; }

// ==================== 排行榜 ====================
function getRanking() { try { return JSON.parse(localStorage.getItem('brain_age_ranking')||'[]'); } catch { return []; } }
function saveScore(score, brainAge, level) {
  const ranking = getRanking();
  ranking.push({ score, brainAge: String(brainAge), level, date: new Date().toLocaleDateString('zh-CN'), time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) });
  ranking.sort((a,b) => b.score - a.score);
  localStorage.setItem('brain_age_ranking', JSON.stringify(ranking.slice(0, 10)));
}
function showRanking() {
  const ranking = getRanking(), list = document.getElementById('ranking-list');
  const icons = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
  if (ranking.length===0) { list.innerHTML = '<li style="text-align:center;color:#888;">暂无记录，快来挑战吧！</li>'; }
  else { list.innerHTML = ranking.map((r,i) => `<li><span>${icons[i]||''} 脑龄${r.brainAge} · 关卡${r.level}</span><span style="color:var(--accent2)">${r.score}分 <small style="opacity:0.5">${r.date}</small></span></li>`).join(''); }
  document.getElementById('ranking-panel').style.display = 'flex';
}
function hideRanking() { document.getElementById('ranking-panel').style.display = 'none'; }
function clearRanking() {
  if (confirm('确定要清空所有排行榜记录吗？')) { localStorage.removeItem('brain_age_ranking'); hideRanking(); showToast('排行榜已清空'); }
}

// ==================== 分享 ====================
function shareResult() {
  const age = document.getElementById('age-display').textContent;
  const score = document.getElementById('stat-score').textContent;
  const level = document.getElementById('stat-level').textContent;
  const comment = document.getElementById('age-comment').textContent.replace(/[^\u4e00-\u9fa5]/g,'');
  const text = `🧠 测脑龄挑战！\n我的脑龄：${age}岁\n得分：${score}分 | 通过${level}关\n${comment}\n来挑战我吧！`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>showToast('📋 已复制到剪贴板！去朋友圈炫耀吧~')).catch(()=>fallbackShare(text));
  } else { fallbackShare(text); }
}
function fallbackShare(text) {
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  showToast('📋 已复制到剪贴板！去朋友圈炫耀吧~');
}
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== 道具 ====================
function usePauseItem() {
  if (!state.pauseAvailable || state.freezeActive || state.phase !== 'countdown') return;
  state.pauseAvailable = false;
  state.freezeActive = true;
  const btn = document.getElementById('item-pause');
  btn.classList.add('used', 'frozen');

  // 暂停倒计时 interval
  if (state.cdInterval) {
    clearInterval(state.cdInterval);
    state.cdInterval = null;
  }

  const prompt = document.getElementById('prompt-text');
  const origText = prompt.textContent;
  prompt.textContent = '❄️ 冻结中...';
  sound.init(); sound.ding();

  // 3秒后恢复倒计时
  let freezeCount = 3;
  const freezeCountdown = setInterval(() => {
    freezeCount--;
    if (freezeCount > 0) {
      prompt.textContent = '❄️ ' + freezeCount;
    } else {
      clearInterval(freezeCountdown);
      state.freezeActive = false;
      btn.classList.remove('frozen');
      prompt.textContent = origText;
      // 恢复倒计时
      let cd = parseInt(origText) || 1;
      state.cdInterval = setInterval(() => {
        cd--;
        if (cd > 0) {
          prompt.textContent = cd;
          sound.countdownBeep();
        } else {
          clearInterval(state.cdInterval);
          state.cdInterval = null;
          document.getElementById('item-pause').style.display = 'none';
          // 触发叮...
          if (state.freezeTimer) { clearTimeout(state.freezeTimer); }
          prompt.textContent = '🔔';
          prompt.style.fontSize = '60px';
          sound.ding();
          document.getElementById('item-pause').classList.remove('frozen');
          setTimeout(() => {
            prompt.style.fontSize = '';
            const trapCount = getTrapCount();
            const clickMsg = trapCount > 0 ? '👆 按顺序点击(跳过X标记的陷阱球)!' : '👆 请按顺序点击！';
            prompt.textContent = clickMsg;
            state.phase = 'playing';
            state.levelStartTime = Date.now();
            state.startTime = Date.now();
            state.baseTimeLimit = getTimeLimit() * 1000;
            state.countdownTotal = state.baseTimeLimit + state.timeBank;
            state.countdownRemain = state.countdownTotal;
            state.timeBank = 0;
            drawGame(false);
            startCountdown();
          }, 400);
        }
      }, 1000);
    }
  }, 1000);
}

// ==================== 游戏控制 ====================
function startGame(diff) {
  sound.init();
  state.difficulty = diff; state.level = 1; state.score = 0;
  state.combo = 0; state.maxCombo = 0; state.totalTime = 0;
  state.gameOver = false; state.phase = 'idle'; state.trapCleared = false;
  state.timeBank = 0; state.pauseAvailable = false; state.freezeActive = false; state.revealAnswer = false;
  stopHintTimer();
  if (state.cdInterval) { clearInterval(state.cdInterval); state.cdInterval = null; }
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('prompt-text').style.display = 'none';
  document.getElementById('trap-hint').style.display = 'none';
  document.getElementById('countdown-bar-wrap').style.display = '';
  document.getElementById('countdown-bar').style.width = '100%';
  document.getElementById('countdown-bar').style.background = 'linear-gradient(90deg, #fdcb6e, #00cec9)';
  document.getElementById('item-pause').classList.remove('used','frozen');
  resizeGameCanvas(); updateUI(); startLevel();
}
function restartGame() { document.getElementById('overlay').style.display = 'none'; startGame(state.difficulty); }
function closeOverlay() {
  clearCountdown();
  stopHintTimer();
  if (state.memorizeTimer) clearTimeout(state.memorizeTimer);
  state.gameOver = true;
  if (state.cdInterval) { clearInterval(state.cdInterval); state.cdInterval = null; }
  document.getElementById('item-pause').style.display = 'none';
  document.getElementById('item-pause').classList.remove('used','frozen');
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = '';
  document.getElementById('trap-hint').style.display = 'none';
  document.getElementById('prompt-text').style.display = 'none';
}
