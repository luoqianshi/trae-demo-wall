    <script>
    (function() {
        function detectLowEndDevice() {
            var isLowEnd = false;
            var memory = navigator.deviceMemory || 0;
            var cores = navigator.hardwareConcurrency || 0;
            var ua = navigator.userAgent;
            
            if (memory > 0 && memory <= 2) {
                isLowEnd = true;
            }
            if (cores > 0 && cores <= 2) {
                isLowEnd = true;
            }
            
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            var screenWidth = window.screen.width;
            if (isMobile && screenWidth <= 768) {
                var isOldAndroid = /Android [0-6]\./i.test(ua);
                var isOldIOS = /OS [0-12]_/i.test(ua);
                if (isOldAndroid || isOldIOS) {
                    isLowEnd = true;
                }
            }
            
            if (isLowEnd) {
                document.documentElement.classList.add('low-end-device');
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', detectLowEndDevice);
        } else {
            detectLowEndDevice();
        }
    })();
    </script>
