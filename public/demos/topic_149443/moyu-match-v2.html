      <div class="start-tip">点击上方物品放入垃圾桶，3个相同物品消除</div>
      <div class="start-features">
        <span class="feature-tag">🎯 三消玩法</span>
        <span class="feature-tag">💬 语录收集</span>
        <span class="feature-tag">📱 单手操作</span>
      </div>
    </div>
  </div>

    <div class="game-header">
      <div class="game-title">摸鱼大作战</div>
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">分数</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">关卡</span>
          <span class="stat-value" id="level">1</span>
        </div>
      </div>
    </div>

    </div>

    <div class="progress-bar">

    </div>

      <div class="game-board" id="gameBoard"></div>

      <div class="quote-author" id="quoteAuthor">—— 当代打工人</div>
      <div class="quote-rarity rarity-common" id="quoteRarity">普通语录</div>

    ];

    let items = [];
    let trash = [];
    let score = 0;
    let level = 1;
    let totalScore = 0;
    let isProcessing = false;
    let currentQuote = null;

    const TRASH_CAPACITY = 7;
    const BOARD_WIDTH = 340;
    const BOARD_HEIGHT = 340;
    const ITEM_SIZE = 50;

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'flex';
      initGame();
    }

    function initGame() {
      const scene = SCENES[(level - 1) % SCENES.length];
      score = 0;
      items = [];
      trash = [];
      
      document.getElementById('sceneName').textContent = scene.emoji + ' ' + scene.name;
      showSceneIndicator(scene.emoji + ' 进入场景：' + scene.name);
      
      updateUI();
      createItems();
      renderItems();
      renderTrash();
      updateProgress();
    }

    function createItems() {
      items = [];
      const layout = generateLevelLayout(level);
      let itemId = 0;
      
      layout.layers.forEach((layer, layerIndex) => {
        layer.positions.forEach((pos, posIndex) => {
          items.push({
            id: itemId++,
            type: layer.types[posIndex],
            x: pos.x,
            y: pos.y,
            layer: layerIndex,
            removed: false,
            zIndex: layerIndex * 1000 + posIndex
          });
        });
      });
      
      console.log(`[DEBUG] createItems: ${items.length} items created`);
      items.forEach(item => {
        console.log(`[DEBUG] Item ${item.id}: layer=${item.layer}, x=${item.x.toFixed(1)}, y=${item.y.toFixed(1)}, type=${item.type}`);
      });
    }

    function generateLevelLayout(lvl) {
      const difficulty = getDifficulty(lvl);
      
      const typeCount = difficulty.typeCount;
      const triplesPerType = difficulty.triplesPerType;
      const layerCount = difficulty.layerCount;
      
      let attempts = 0;
      while (attempts < 10) {
        let typePool = [];
        for (let i = 0; i < typeCount; i++) {
          const count = triplesPerType * 3;
          for (let j = 0; j < count; j++) {
            typePool.push(i);
          }
        }
        
        for (let i = typePool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [typePool[i], typePool[j]] = [typePool[j], typePool[i]];
        }
        
        const layers = [];
        let poolIndex = 0;
        
        for (let layerIdx = 0; layerIdx < layerCount; layerIdx++) {
          let positions;
          if (layerIdx === 0) {
            positions = generateBottomLayerPositions();
          } else {
            positions = generateCoverLayerPositions(layers, layerIdx, layerCount);
          }
          
          const layerTypes = [];
          for (let i = 0; i < positions.length && poolIndex < typePool.length; i++) {
            layerTypes.push(typePool[poolIndex++]);
          }
          
          if (layerTypes.length > 0) {
            layers.push({
              positions: positions.slice(0, layerTypes.length),
              types: layerTypes
            });
          }
        }
        
        if (poolIndex < typePool.length) {
          const extraTypes = typePool.slice(poolIndex);
          const lastLayer = layers[layers.length - 1];
          if (lastLayer) {
            const extraPositions = generateExtraPositions(lastLayer.positions);
            for (let i = 0; i < extraTypes.length && i < extraPositions.length; i++) {
              lastLayer.positions.push(extraPositions[i]);
              lastLayer.types.push(extraTypes[i]);
            }
          }
        }
        
        if (verifyLevelCompletable(layers, typeCount)) {
          return { layers };
        }
        
        attempts++;
      }
      
      return generateLevelLayout(lvl);
    }

    function verifyLevelCompletable(layers, typeCount) {
      const tempItems = [];
      let id = 0;
      
      layers.forEach((layer, layerIndex) => {
        layer.positions.forEach((pos, posIndex) => {
          tempItems.push({
            id: id++,
            type: layer.types[posIndex],
            x: pos.x,
            y: pos.y,
            layer: layerIndex,
            removed: false
          });
        });
      });
      
      const clickableTypes = new Set();
      
      tempItems.forEach(item => {
        let isClickable = true;
        
        for (const other of tempItems) {
          if (other.id !== item.id && other.layer > item.layer) {
            const overlap = checkOverlap(
              item.x, item.y, ITEM_SIZE, ITEM_SIZE,
              other.x, other.y, ITEM_SIZE, ITEM_SIZE
            );
            if (overlap > 0) {
              isClickable = false;
              break;
            }
          }
        }
        
        if (isClickable) {
          clickableTypes.add(item.type);
        }
      });
      
      return clickableTypes.size >= typeCount;
    }

    function generateBottomLayerPositions() {
      const positions = [];
      const spacing = ITEM_SIZE + 8;
      const patterns = [
        'diamond', 'hexagon', 'spiral', 'cross_grid', 'random_scattered'
      ];
      const pattern = patterns[Math.floor(Math.random() * patterns.length)];
      
      const centerX = BOARD_WIDTH / 2 - ITEM_SIZE / 2;
      const centerY = BOARD_HEIGHT / 2 - ITEM_SIZE / 2;
      
      switch (pattern) {
        case 'diamond':
          for (let row = -2; row <= 2; row++) {
            const cols = 5 - Math.abs(row);
            for (let col = -Math.floor(cols / 2); col < Math.ceil(cols / 2); col++) {
              positions.push({ x: centerX + col * spacing, y: centerY + row * spacing });
            }
          }
          break;
        case 'hexagon':
          for (let q = -2; q <= 2; q++) {
            const r1 = Math.max(-2, -q - 2);
            const r2 = Math.min(2, -q + 2);
            for (let r = r1; r <= r2; r++) {
              positions.push({
                x: centerX + (q * 0.75) * spacing,
                y: centerY + (r + q * 0.5) * spacing * 0.866
              });
            }
          }
          break;
        case 'spiral':
          for (let i = 0; i < 16; i++) {
            const angle = (i / 16) * Math.PI * 4;
            const radius = 15 + (i / 16) * 90;
            positions.push({
              x: centerX + Math.cos(angle) * radius,
              y: centerY + Math.sin(angle) * radius
            });
          }
          break;
        case 'cross_grid':
          for (let dx = -2; dx <= 2; dx++) {
            for (let dy = -2; dy <= 2; dy++) {
              if (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy)) {
                positions.push({ x: centerX + dx * spacing, y: centerY + dy * spacing });
              }
            }
          }
          break;
        case 'random_scattered':
          for (let i = 0; i < 18; i++) {
            let attempts = 0;
            let pos;
            do {
              pos = {
                x: centerX + (Math.random() - 0.5) * 220,
                y: centerY + (Math.random() - 0.5) * 220
              };
              attempts++;
            } while (attempts < 30 && hasNearbyPosition(positions, pos, spacing * 0.7));
            positions.push(pos);
          }
          break;
      }
      
      const padding = 10;
      return positions.filter(pos => 
        pos.x >= padding && pos.x <= BOARD_WIDTH - ITEM_SIZE - padding &&
        pos.y >= padding && pos.y <= BOARD_HEIGHT - ITEM_SIZE - padding
      );
    }

    function generateCoverLayerPositions(layers, layerIdx, totalLayers) {
      const positions = [];
      const spacing = ITEM_SIZE + 6;
      
      const bottomPositions = layers[0].positions;
      const coverRatio = 0.5 + (layerIdx / totalLayers) * 0.1;
      const coverCount = Math.floor(bottomPositions.length * coverRatio);
      
      const shuffledBottom = [...bottomPositions].sort(() => Math.random() - 0.5);
      
      for (let i = 0; i < coverCount; i++) {
        const basePos = shuffledBottom[i % shuffledBottom.length];
        const offsetX = (Math.random() - 0.5) * ITEM_SIZE * 0.8;
        const offsetY = (Math.random() - 0.5) * ITEM_SIZE * 0.8;
        
        let attempts = 0;
        let pos;
        do {
          pos = {
            x: basePos.x + offsetX + (Math.random() - 0.5) * 15,
            y: basePos.y + offsetY + (Math.random() - 0.5) * 15
          };
          attempts++;
        } while (attempts < 20 && hasNearbyPosition(positions, pos, spacing * 0.6));
        
        positions.push(pos);
      }
      
      console.log(`[DEBUG] generateCoverLayerPositions: ${positions.length} positions, coverRatio: ${coverRatio}, bottomCount: ${bottomPositions.length}`);
      
      const padding = 10;
      return positions.filter(pos => 
        pos.x >= padding && pos.x <= BOARD_WIDTH - ITEM_SIZE - padding &&
        pos.y >= padding && pos.y <= BOARD_HEIGHT - ITEM_SIZE - padding
      );
    }

    function generateExtraPositions(existingPositions) {
      const positions = [];
      const spacing = ITEM_SIZE + 6;
      const centerX = BOARD_WIDTH / 2 - ITEM_SIZE / 2;
      const centerY = BOARD_HEIGHT / 2 - ITEM_SIZE / 2;
      
      for (let i = 0; i < 10; i++) {
        let attempts = 0;
        let pos;
        do {
          pos = {
            x: centerX + (Math.random() - 0.5) * 200,
            y: centerY + (Math.random() - 0.5) * 200
          };
          attempts++;
        } while (attempts < 30 && hasNearbyPosition([...existingPositions, ...positions], pos, spacing * 0.7));
        positions.push(pos);
      }
      
      return positions;
    }

    function getDifficulty(lvl) {
      let typeCount, triplesPerType, layerCount;
      
      if (lvl <= 2) {
        typeCount = 4;
        triplesPerType = 2;
        layerCount = 2;
      } else if (lvl <= 5) {
        typeCount = 5;
        triplesPerType = 2;
        layerCount = 2;
      } else if (lvl <= 9) {
        typeCount = 6;
        triplesPerType = 3;
        layerCount = 3;
      } else if (lvl <= 14) {
        typeCount = 8;
        triplesPerType = 3;
        layerCount = 4;
      } else {
        typeCount = ITEMS.length;
        triplesPerType = Math.min(4 + Math.floor((lvl - 15) / 3), 6);
        layerCount = Math.min(5, 4 + Math.floor((lvl - 15) / 4));
      }
      
      return {
        typeCount: Math.min(typeCount, ITEMS.length),
        triplesPerType: Math.min(triplesPerType, 8),
        layerCount: Math.max(2, Math.min(layerCount, 5))
      };
    }

    function generateIrregularPositions(config) {
      const positions = [];
      const spacing = ITEM_SIZE + 6;
      const centerX = BOARD_WIDTH / 2 - ITEM_SIZE / 2;
      const centerY = BOARD_HEIGHT / 2 - ITEM_SIZE / 2;
      
      switch (config.type) {
        case 'diamond':
          for (let row = -3; row <= 3; row++) {
            const cols = 7 - Math.abs(row);
            for (let col = -Math.floor(cols / 2); col < Math.ceil(cols / 2); col++) {
              positions.push({
                x: centerX + col * spacing,
                y: centerY + row * spacing
              });
            }
          }
          break;
          
        case 'hexagon':
          for (let q = -2; q <= 2; q++) {
            const r1 = Math.max(-2, -q - 2);
            const r2 = Math.min(2, -q + 2);
            for (let r = r1; r <= r2; r++) {
              positions.push({
                x: centerX + (q * 0.75) * spacing,
                y: centerY + (r + q * 0.5) * spacing * 0.866
              });
            }
          }
          break;
          
        case 'triangle':
          for (let row = 0; row < 4; row++) {
            for (let col = 0; col < 4 - row; col++) {
              positions.push({
                x: centerX + (col - (3 - row) / 2) * spacing,
                y: centerY + (row - 1.5) * spacing
              });
            }
          }
          break;
          
        case 'scattered':
        case 'random_scattered':
          const scatterCount = config.type === 'random_scattered' ? 12 + Math.floor(Math.random() * 8) : 6 + Math.floor(Math.random() * 4);
          const usedPositions = new Set();
          for (let i = 0; i < scatterCount; i++) {
            let attempts = 0;
            let pos;
            do {
              pos = {
                x: centerX + (Math.random() - 0.5) * 240,
                y: centerY + (Math.random() - 0.5) * 240
              };
              attempts++;
            } while (attempts < 20 && hasNearbyPosition(positions, pos, spacing * 0.8));
            positions.push(pos);
          }
          break;
          
        case 'cross_grid':
          for (let dx = -2; dx <= 2; dx++) {
            positions.push({ x: centerX + dx * spacing, y: centerY });
          }
          for (let dy = -2; dy <= 2; dy++) {
            if (dy !== 0) {
              positions.push({ x: centerX, y: centerY + dy * spacing });
            }
          }
          break;
          
        case 'spiral':
          const spiralPoints = 18;
          for (let i = 0; i < spiralPoints; i++) {
            const angle = (i / spiralPoints) * Math.PI * 4;
            const radius = 20 + (i / spiralPoints) * 100;
            positions.push({
              x: centerX + Math.cos(angle) * radius,
              y: centerY + Math.sin(angle) * radius
            });
          }
          break;
          
        case 'star':
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const innerRadius = 20;
            const outerRadius = 80;
            positions.push({
              x: centerX + Math.cos(angle) * outerRadius,
              y: centerY + Math.sin(angle) * outerRadius
            });
            positions.push({
              x: centerX + Math.cos(angle + Math.PI / 5) * innerRadius,
              y: centerY + Math.sin(angle + Math.PI / 5) * innerRadius
            });
          }
          positions.push({ x: centerX, y: centerY });
          break;
          
        case 'cluster':
          const clusterCount = 4;
          const clusterRadius = 40;
          for (let c = 0; c < clusterCount; c++) {
            const clusterAngle = (c / clusterCount) * Math.PI * 2;
            const clusterX = centerX + Math.cos(clusterAngle) * 60;
            const clusterY = centerY + Math.sin(clusterAngle) * 60;
            for (let i = 0; i < 3; i++) {
              const angle = (i / 3) * Math.PI * 2;
              const radius = Math.random() * clusterRadius * 0.5;
              positions.push({
                x: clusterX + Math.cos(angle) * radius,
                y: clusterY + Math.sin(angle) * radius
              });
            }
          }
          positions.push({ x: centerX, y: centerY });
          break;
          
        case 'cross':
          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 || dy === 0) {
                positions.push({
                  x: centerX + dx * spacing,
                  y: centerY + dy * spacing
                });
              }
            }
          }
          break;
          
        case 'center':
          positions.push({ x: centerX, y: centerY });
          break;
      }
      
      const padding = 10;
      return positions.filter(pos => 
        pos.x >= padding && pos.x <= BOARD_WIDTH - ITEM_SIZE - padding &&
        pos.y >= padding && pos.y <= BOARD_HEIGHT - ITEM_SIZE - padding
      );
    }

    function hasNearbyPosition(positions, pos, minDist) {
      for (const existing of positions) {
        const dx = existing.x - pos.x;
        const dy = existing.y - pos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minDist) {
          return true;
        }
      }
      return false;
    }

    function renderItems() {
      const boardEl = document.getElementById('gameBoard');
      boardEl.innerHTML = '';
      
      const sortedItems = [...items].filter(i => !i.removed).sort((a, b) => a.zIndex - b.zIndex);
      
      let clickableCount = 0;
      let blockedCount = 0;
      
      sortedItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'game-item';
        el.dataset.id = item.id;
        el.textContent = ITEMS[item.type].emoji;
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
        el.style.zIndex = item.zIndex;
        el.style.background = ITEMS[item.type].color;
        el.style.borderColor = ITEMS[item.type].color;
        el.style.opacity = '1';
        el.style.position = 'absolute';
        
        const clickable = isItemClickable(item);
        if (!clickable) {
          el.classList.add('blocked');
          blockedCount++;
        } else {
          clickableCount++;
          el.addEventListener('click', () => onItemClick(item));
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onItemClick(item);
          });
        }
        
        boardEl.appendChild(el);
      });
      
      console.log(`[DEBUG] renderItems: ${clickableCount} clickable, ${blockedCount} blocked, total: ${sortedItems.length}`);
    }

    function isItemClickable(item) {
      if (item.removed) return false;
      
      const activeItems = items.filter(i => !i.removed && i.id !== item.id);
      
      for (const other of activeItems) {
        if (other.zIndex > item.zIndex) {
          const overlap = checkOverlap(
            item.x, item.y, ITEM_SIZE, ITEM_SIZE,
            other.x, other.y, ITEM_SIZE, ITEM_SIZE
          );
          if (overlap > 0) {
            console.log(`[DEBUG] Item ${item.id} (zIndex ${item.zIndex}) blocked by item ${other.id} (zIndex ${other.zIndex}), overlap: ${overlap.toFixed(3)}`);
            return false;
          }
        }
      }
      
      return true;
    }

    function checkOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
      const overlapX = Math.max(0, Math.min(x1 + w1, x2 + w2) - Math.max(x1, x2));
      const overlapY = Math.max(0, Math.min(y1 + h1, y2 + h2) - Math.max(y1, y2));
      const overlapArea = overlapX * overlapY;
      const minArea = Math.min(w1 * h1, w2 * h2);
      return overlapArea / minArea;
    }

    function onItemClick(item) {
      console.log(`[DEBUG] onItemClick called for item ${item.id} (layer ${item.layer}), isClickable: ${isItemClickable(item)}, removed: ${item.removed}, isProcessing: ${isProcessing}`);
      if (isProcessing || item.removed || !isItemClickable(item)) {
        console.log(`[DEBUG] Item ${item.id} click blocked: isProcessing=${isProcessing}, removed=${item.removed}, isClickable=${isItemClickable(item)}`);
        return;
      }
      if (trash.length >= TRASH_CAPACITY) {
        showToast('垃圾桶已满！');
        return;
      }
      
      isProcessing = true;
      
      item.removed = true;
      trash.push({ type: item.type, id: item.id });
      
      const wasFullAfterPush = trash.length >= TRASH_CAPACITY;
      
      const el = document.querySelector(`[data-id="${item.id}"]`);
      if (el) {
        el.style.transform = 'scale(0)';
        setTimeout(() => el.remove(), 200);
      }
      
      renderTrash();
      
      setTimeout(() => {
        const hasMatch = checkMatches();
        renderItems();
        
        if (wasFullAfterPush && !hasMatch) {
          setTimeout(() => {
            showGameOver();
          }, 500);
        } else {
          checkGameEnd();
        }
        
        isProcessing = false;
      }, 250);
    }

    function checkMatches() {
      const typeCounts = {};
      trash.forEach(item => {
        typeCounts[item.type] = (typeCounts[item.type] || 0) + 1;
      });
      
      const matchedTypes = Object.keys(typeCounts).filter(type => typeCounts[type] >= 3);
      
      matchedTypes.forEach(type => {
        const matchedItems = trash.filter(item => item.type == type).slice(0, 3);
        trash = trash.filter(item => !matchedItems.includes(item));
        
        const points = 100;
        score += points;
        totalScore += points;
        updateUI();
        updateProgress();
        
        showScorePopup(BOARD_WIDTH / 2, BOARD_HEIGHT / 2, '+' + points);
        createParticlesAt(BOARD_WIDTH / 2, BOARD_HEIGHT / 2, ITEMS[type].color);
      });
      
      if (matchedTypes.length > 0) {
        renderTrash();
      }
      
      return matchedTypes.length > 0;
    }

    function checkGameEnd() {
      const remainingItems = items.filter(i => !i.removed);
      
      if (remainingItems.length === 0) {
        setTimeout(() => {
          showQuote();
        }, 500);
        return;
      }
      
      if (trash.length >= TRASH_CAPACITY) {
        const canMatch = hasPossibleMoves();
        if (!canMatch) {
          setTimeout(() => {
            showGameOver();
          }, 500);
        }
      }
    }

    function hasPossibleMoves() {
      const clickableItems = items.filter(i => !i.removed && isItemClickable(i));
      
      const trashTypeCounts = {};
      trash.forEach(item => {
        trashTypeCounts[item.type] = (trashTypeCounts[item.type] || 0) + 1;
      });
      
      const clickableTypeCounts = {};
      clickableItems.forEach(item => {
        clickableTypeCounts[item.type] = (clickableTypeCounts[item.type] || 0) + 1;
      });
      
      for (const type in clickableTypeCounts) {
        const trashCount = trashTypeCounts[type] || 0;
        const clickableCount = clickableTypeCounts[type] || 0;
        if (trashCount + clickableCount >= 3) {
          return true;
        }
      }
      
      return false;
    }

    function renderTrash() {
      const trashBar = document.getElementById('trashBar');
      trashBar.innerHTML = '';
      
      for (let i = 0; i < TRASH_CAPACITY; i++) {
        const slot = document.createElement('div');
        slot.className = 'trash-slot';
        
        if (i < trash.length) {
          slot.classList.add('filled');
          slot.textContent = ITEMS[trash[i].type].emoji;
        }
        
        if (trash.length >= TRASH_CAPACITY) {
          slot.classList.add('full');
        }
        
        trashBar.appendChild(slot);
      }
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
    }

    function updateProgress() {
      const totalItems = items.length;
      const removedItems = items.filter(i => i.removed).length;
      const percent = totalItems > 0 ? (removedItems / totalItems) * 100 : 0;
      document.getElementById('progressFill').style.width = Math.min(percent, 100) + '%';
    }

    function showSceneIndicator(text) {
      const indicator = document.getElementById('sceneIndicator');
      indicator.textContent = text;
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 2500);
    }

    function showQuote() {
      const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      currentQuote = quote;
      
      document.getElementById('quoteText').textContent = '"' + quote.text + '"';
      document.getElementById('quoteAuthor').textContent = '—— ' + quote.author;
      
      const rarityEl = document.getElementById('quoteRarity');
      rarityEl.className = 'quote-rarity rarity-' + quote.rarity;
      rarityEl.textContent = quote.rarity === 'legendary' ? '🔥 传说语录' : 
                             quote.rarity === 'rare' ? '✨ 稀有语录' : '📝 普通语录';
      
      document.getElementById('quoteOverlay').classList.add('active');
    }

    function showGameOver() {
      document.getElementById('finalScore').textContent = totalScore;
      document.getElementById('finalLevel').textContent = level;
      document.getElementById('gameOverOverlay').classList.add('active');
    }

    function nextLevel() {
      level++;
      document.getElementById('quoteOverlay').classList.remove('active');
      initGame();
    }

    function restartGame() {
      level = 1;
      totalScore = 0;
      document.getElementById('gameOverOverlay').classList.remove('active');
      document.getElementById('quoteOverlay').classList.remove('active');
      initGame();
    }

    function showShareModal() {
      document.getElementById('quoteOverlay').classList.remove('active');
      document.getElementById('gameOverOverlay').classList.remove('active');
      
      document.getElementById('posterQuote').textContent = '"' + currentQuote.text + '"';
      document.getElementById('posterScore').textContent = totalScore;
      document.getElementById('posterLevel').textContent = level;
      document.getElementById('posterLevelText').textContent = '第 ' + level + ' 关 · ' + SCENES[(level - 1) % SCENES.length].name;
      
      document.getElementById('shareModal').classList.add('active');
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.remove('active');
    }

    function shareToWechat() {
      showToast('请截图分享到朋友圈！');
    }

    function copyQuote() {
      const text = currentQuote.text + ' —— ' + currentQuote.author + ' 【摸鱼大作战】';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('语录已复制！');
        }).catch(() => {
          showToast('请手动复制语录');
        });
      } else {
        showToast('请手动复制语录');
      }
    }

    function createParticlesAt(x, y, color) {
      const boardEl = document.getElementById('gameBoard');
      
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.background = color;
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.setProperty('--tx', (Math.random() - 0.5) * 80 + 'px');
        particle.style.setProperty('--ty', (Math.random() - 0.5) * 80 + 'px');
        boardEl.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    function showScorePopup(x, y, text) {
      const boardEl = document.getElementById('gameBoard');
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = text;
      popup.style.left = x + 'px';
      popup.style.top = y + 'px';
      popup.style.transform = 'translate(-50%, -50%)';
      boardEl.appendChild(popup);
      setTimeout(() => popup.remove(), 1000);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeShareModal();
      }
    });
  </script>
</body>
</html>
