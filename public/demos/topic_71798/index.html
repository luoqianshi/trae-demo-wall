<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品管家 - 交互式 Demo</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f7;--ink:#1d1d1f;--muted:#86868b;--rule:#e5e5ea;--accent:#007aff;--accent2:#ff3b30;--green:#34c759;--orange:#ff9500;--radius:12px}
body{font-family:-apple-system,'SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8ed;color:var(--ink);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
#app{width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.08)}
.phone{display:flex;flex-direction:column;height:100%}
.sb{height:54px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;flex-shrink:0}
.nb{height:44px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:.5px solid var(--rule)}
.nb button{background:none;border:none;font-family:inherit;font-size:17px;cursor:pointer}
.nb .back{color:var(--accent)}.nb .title{font-weight:600;font-size:17px}.nb .act{color:var(--accent);font-weight:500}.nb .act.red{color:var(--accent2)}
.pc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.pc::-webkit-scrollbar{display:none}
.tb{height:83px;padding-bottom:34px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--rule);display:flex;flex-shrink:0}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:none;border:none;font-family:inherit}
.ti .ic{font-size:24px;color:var(--muted)}.ti .lb{font-size:10px;color:var(--muted)}.ti.on .ic,.ti.on .lb{color:var(--accent)}
.pe{animation:pi .25s ease}@keyframes pi{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Home */
.hh{padding:0 20px 16px}.hh h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.search{margin:0 20px 16px;background:var(--bg2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.search input{border:none;background:none;font-size:17px;width:100%;color:var(--ink);outline:none;font-family:inherit}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer;border:none;font-family:inherit;background:var(--bg2);color:var(--ink);transition:all .2s}
.tab.on{background:var(--accent);color:#fff}.tab.mgr{background:none;color:var(--muted);font-size:18px;padding:6px 8px}
.sh{padding:8px 20px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ic{display:flex;align-items:center;padding:12px 20px;gap:12px;cursor:pointer;transition:background .15s}
.ic:active{background:var(--bg2)}
.ic .th{width:50px;height:50px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ic .inf{flex:1;min-width:0}.ic .nm{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px}.ic .lc{font-size:14px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;flex-shrink:0}
.b-r{background:#ffe5e5;color:#d70015}.b-y{background:#fff3cd;color:#996600}.b-g{background:#e3f9e5;color:#1a7d2e}.b-m{background:var(--bg2);color:var(--muted)}
.fab{position:absolute;bottom:100px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,122,255,.3);transition:transform .2s;z-index:10}
.fab:active{transform:scale(.92)}
.empty{text-align:center;padding:80px 40px;color:var(--muted)}.empty .ei{font-size:64px;margin-bottom:16px;opacity:.4}.empty p{font-size:15px;line-height:1.5}

/* Form */
.fs{padding:0 20px}
.pa{margin:16px 20px;border-radius:var(--radius);border:1.5px dashed var(--rule);height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--bg2)}
.pa .pi{font-size:28px;color:var(--muted)}.pa span{font-size:13px;color:var(--muted)}
.fl{font-size:13px;color:var(--muted);font-weight:600;padding:12px 0 6px;text-transform:uppercase;letter-spacing:.3px}
.fiw{position:relative}
.fi{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;font-size:17px;color:var(--ink);background:var(--bg);outline:none;font-family:inherit;transition:border-color .2s}
.fi:focus{border-color:var(--accent)}.fi::placeholder{color:#c7c7cc}
.ia{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.ib-c{background:var(--bg2);color:var(--accent)}.ib-m{background:var(--accent);color:#fff}.ib-m.rec{background:var(--accent2);animation:pr 1.2s infinite}
@keyframes pr{0%,100%{opacity:1}50%{opacity:.5}}
.fsel{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;font-size:17px;color:var(--muted);background:var(--bg);appearance:none;cursor:pointer;font-family:inherit}
.fsel.ok{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:20px;font-size:14px;cursor:pointer;border:none;font-family:inherit;transition:all .2s;background:var(--bg2);color:var(--ink)}
.chip.on{background:var(--accent);color:#fff}
.tr{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:.5px solid var(--rule);margin-top:8px}
.tr span{font-size:17px}
.tg{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background .3s;border:none;flex-shrink:0}
.tg.on{background:var(--green)}.tg.off{background:#c7c7cc}
.tg::after{content:'';position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tg.on::after{left:22px}.tg.off::after{left:2px}
.es{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-top:12px}
.rc{background:var(--accent);border-radius:10px;padding:14px;margin-top:12px;color:#fff}
.rc .rt{font-size:13px;font-weight:600;opacity:.8}.rc .rv{font-size:20px;font-weight:700;margin-top:4px}
.vh{text-align:center;padding:20px;background:var(--bg2);border-radius:var(--radius);margin-top:12px}
.vh .vi{font-size:36px;margin-bottom:8px}.vh .vt{font-size:15px;font-weight:600;color:var(--accent)}.vh .vs{font-size:13px;color:var(--muted);margin-top:4px}.vh .ve{font-size:12px;color:#aeaeb2;margin-top:8px;font-style:italic}
.sb2{display:block;width:calc(100% - 40px);margin:20px auto;padding:16px;border-radius:var(--radius);background:var(--accent);color:#fff;border:none;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}
.sb2:active{opacity:.7}

/* Detail */
.dp{width:100%;height:200px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:48px}
.dn{font-size:28px;font-weight:700;padding:16px 20px 4px}
.dm{padding:0 20px 16px;display:flex;align-items:center;gap:8px}
.sr{display:flex;gap:10px;padding:0 20px 16px}
.sc{flex:1;background:var(--bg2);border-radius:var(--radius);padding:14px 10px;text-align:center}
.sc .sn{font-size:28px;font-weight:700}.sc .sn.g{color:var(--green)}.sc .sl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.ig{margin:0 20px;background:var(--bg2);border-radius:var(--radius);overflow:hidden}
.ir{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--rule)}
.ir:last-child{border-bottom:none}
.ir .k{font-size:15px;color:var(--muted)}.ir .v{font-size:15px;color:var(--ink)}
.df{text-align:center;padding:20px;font-size:13px;color:#aeaeb2}

/* Location */
.lh{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;align-items:center;padding:12px 20px;gap:12px;border-bottom:.5px solid var(--rule);cursor:pointer}
.li:active{background:var(--bg2)}
.li .lic{font-size:22px;width:32px;text-align:center}
.li .linf{flex:1}.li .ln{font-size:17px;font-weight:500}.li .lct{font-size:13px;color:var(--muted)}
.lch{padding-left:28px}
.la{color:#c7c7cc;font-size:14px}

/* Category */
.cl{padding:0 20px}
.ci{display:flex;align-items:center;padding:14px 0;gap:12px;border-bottom:.5px solid var(--rule)}
.ci .ch{color:var(--muted);font-size:18px;cursor:grab;padding:4px}
.ci .cn{flex:1;font-size:17px}.ci .ct{font-size:12px;color:var(--muted)}
.ca{display:flex;align-items:center;padding:14px 0;gap:12px;cursor:pointer}
.ca .cn{color:var(--accent);font-weight:500}
.cxp{padding:16px 20px}.cxp p{font-size:13px;color:var(--muted);line-height:1.8}

/* Settings */
.sgt{padding:8px 20px 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sg{margin:0 20px 0;background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin-bottom:0}
.sgr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--rule)}
.sgr:last-child{border-bottom:none}
.sgr .sl{font-size:17px}.sgr .sv{font-size:15px;color:var(--muted)}.sgr .sv.bl{color:var(--accent)}.sgr .sv.rd{color:var(--accent2)}

/* Toast */
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.85);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:100;backdrop-filter:blur(10px);animation:ti .3s ease;white-space:nowrap}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="app">
<div class="phone">
<div class="sb"><span>9:41</span><span style="font-size:12px">●●● ▶ 🔋</span></div>

<!-- HOME -->
<template v-if="pg==='home'">
<div class="pc pe">
  <div class="hh"><h1>物品管家</h1></div>
  <div class="search"><span style="color:var(--muted)">🔍</span><input v-model="sq" placeholder="搜索物品..."></div>
  <div class="tabs">
    <button class="tab" :class="{on:ac===c.id}" v-for="c in cats" :key="c.id" @click="ac=c.id">{{c.name}}</button>
    <button class="tab mgr" @click="pg='cat-mgr'">⋯</button>
  </div>
  <template v-if="expItems.length">
    <div class="sh">即将到期 ({{expItems.length}})</div>
    <div class="ic" v-for="i in expItems" :key="i.id" @click="goDetail(i)">
      <div class="th">{{i.emoji}}</div>
      <div class="inf"><div class="nm">{{i.name}} <span class="b" :class="i.bc">{{i.bt}}</span></div><div class="lc">{{i.location}}</div></div>
    </div>
  </template>
  <div class="sh">全部物品 ({{fItems.length}})</div>
  <template v-if="fItems.length">
    <div class="ic" v-for="i in fItems" :key="i.id" @click="goDetail(i)">
      <div class="th">{{i.emoji}}</div>
      <div class="inf"><div class="nm">{{i.name}} <span class="b" :class="i.bc" v-if="i.bt">{{i.bt}}</span></div><div class="lc">{{i.location}}</div></div>
    </div>
  </template>
  <div class="empty" v-else><div class="ei">📦</div><p>还没有物品<br>点击右下角 + 添加第一个物品</p></div>
  <div style="height:100px"></div>
</div>
<button class="fab" @click="goAdd">+</button>
</template>

<!-- ADD ITEM -->
<template v-if="pg==='add'">
<div class="nb"><button class="back" @click="pg='home'">← 返回</button><span class="title">添加物品</span><button class="act" @click="save">保存</button></div>
<div class="pc pe">
  <div class="pa" @click="fm.photo=true;tip('已添加照片')"><span class="pi">📷</span><span>{{fm.photo?'已添加照片':'添加照片（选填）'}}</span></div>
  <div class="fs">
    <div class="fl">物品名称 *</div>
    <div class="fiw">
      <input class="fi" v-model="fm.name" placeholder="输入物品名称">
      <div class="ia">
        <button class="ib ib-c" @click="doOCR" title="拍照识别">📷</button>
        <button class="ib ib-m" :class="{rec:recording}" @click="doVoice" title="语音输入">🎙</button>
      </div>
    </div>
    <div class="vh" v-if="recording"><div class="vi">🎙</div><div class="vt">正在录音中...</div><div class="vs">请说出物品名称和存放位置</div><div class="ve">例如："牛奶放在冰箱冷藏层"</div></div>
    <div class="fl">存放位置 *</div>
    <select class="fsel" :class="{ok:fm.location}" v-model="fm.location"><option value="" disabled>选择位置</option><option v-for="l in locOpts" :key="l" :value="l">{{l}}</option></select>
    <div class="fl">分类</div>
    <div class="chips"><button class="chip" :class="{on:fm.cat===c.id}" v-for="c in cats.filter(c=>c.id!=='all')" :key="c.id" @click="fm.cat=c.id">{{c.name}}</button></div>
    <div class="fl">备注</div>
    <input class="fi" v-model="fm.note" placeholder="添加备注（选填）">
    <div class="tr"><span>保质期追踪</span><button class="tg" :class="fm.exp?'on':'off'" @click="fm.exp=!fm.exp"></button></div>
    <div class="es" v-if="fm.exp">
      <div class="fl" style="padding-top:0">生产日期</div>
      <input class="fi" type="date" v-model="fm.prod">
      <div class="fl">保质期</div>
      <div style="display:flex;gap:8px;align-items:center"><input class="fi" type="number" v-model.number="fm.days" placeholder="天数" style="flex:1"><span style="color:var(--muted);font-size:15px">天</span></div>
      <div class="rc" v-if="expRes"><div class="rt">自动计算结果</div><div class="rv">{{expRes}}</div></div>
      <div class="fl">提前提醒天数</div>
      <input class="fi" type="number" v-model.number="fm.remind" min="1" max="30">
    </div>
    <button class="sb2" @click="save">保存物品</button>
  </div>
</div>
</template>

<!-- DETAIL -->
<template v-if="pg==='detail'&&dt">
<div class="nb"><button class="back" @click="pg='home'">← 返回</button><span class="title">物品详情</span><div style="display:flex;gap:16px"><button class="act" @click="editItem">编辑</button><button class="act red" @click="delItem">删除</button></div></div>
<div class="pc pe">
  <div class="dp">{{dt.emoji}}</div>
  <div class="dn">{{dt.name}}</div>
  <div class="dm"><span class="b" :class="dt.bc" v-if="dt.bt">{{dt.bt}}</span><span style="font-size:14px;color:var(--muted)">{{catName(dt.cat)}}</span></div>
  <div class="sr" v-if="dt.exp">
    <div class="sc"><div class="sn" :class="dt.rem>3?'g':''">{{dt.rem}}天</div><div class="sl">保质期剩余</div></div>
    <div class="sc"><div class="sn">{{fmtD(dt.prod)}}</div><div class="sl">生产日期</div></div>
    <div class="sc"><div class="sn">{{fmtD(dt.expD)}}</div><div class="sl">到期日期</div></div>
  </div>
  <div class="ig">
    <div class="ir"><span class="k">存放位置</span><span class="v">{{dt.location}}</span></div>
    <div class="ir" v-if="dt.note"><span class="k">备注</span><span class="v">{{dt.note}}</span></div>
    <div class="ir" v-if="dt.exp"><span class="k">提醒设置</span><span class="v">提前 {{dt.remind}} 天</span></div>
  </div>
  <div class="df">创建于 {{dt.created}}</div>
</div>
</template>

<!-- LOCATION -->
<template v-if="pg==='loc'">
<div class="nb"><button class="back" @click="pg='home'">← 返回</button><span class="title">位置管理</span><button class="act" @click="tip('添加位置（Demo）')">+ 添加</button></div>
<div class="pc pe">
  <div v-for="loc in locs" :key="loc.name">
    <div class="li" @click="loc.exp=!loc.exp">
      <div class="lic">{{loc.emoji}}</div>
      <div class="linf"><div class="ln">{{loc.name}} <span class="lct">{{loc.count}}件</span></div><div class="lch" v-if="loc.ch.length" style="font-size:13px;color:var(--muted);margin-top:2px">{{loc.ch.map(c=>c.name).join(' / ')}}</div></div>
      <span class="la">{{loc.exp?'▼':'▶'}}</span>
    </div>
    <template v-if="loc.exp&&loc.ch.length">
      <div class="li lch" v-for="c in loc.ch" :key="c.name" @click.stop="goLocItems(loc.name,c.name,c.emoji)">
        <div class="lic">{{c.emoji}}</div>
        <div class="linf"><div class="ln">{{c.name}} <span class="lct">{{c.count}}件</span></div></div>
        <span class="la">›</span>
      </div>
    </template>
  </div>
</div>
</template>

<!-- LOCATION ITEMS -->
<template v-if="pg==='loc-items'">
<div class="nb"><button class="back" @click="pg='loc'">← 返回</button><span class="title">{{curLoc.emoji}} {{curLoc.name}}</span></div>
<div class="pc pe">
  <div class="sh" style="padding-top:16px">{{locItems.length}} 件物品</div>
  <template v-if="locItems.length">
    <div class="ic" v-for="i in locItems" :key="i.id" @click="goDetail(i)">
      <div class="th">{{i.emoji}}</div>
      <div class="inf"><div class="nm">{{i.name}} <span class="b" :class="i.bc" v-if="i.bt">{{i.bt}}</span></div><div class="lc">{{i.location}}</div></div>
    </div>
  </template>
  <div class="empty" v-else><div class="ei">📭</div><p>这个位置还没有物品</p></div>
</div>
</template>

<!-- CATEGORY MANAGE -->
<template v-if="pg==='cat-mgr'">
<div class="nb"><button class="back" @click="pg='home'">← 返回</button><span class="title">分类管理</span></div>
<div class="pc pe">
  <div class="cl">
    <div class="ci" v-for="c in cats" :key="c.id"><span class="ch">≡</span><span class="cn">{{c.name}}</span><span class="ct">{{c.id==='all'?'默认':c.preset?'预设':''}}</span></div>
    <div class="ca" @click="addCat"><span class="ch" style="visibility:hidden">≡</span><span class="cn">+ 添加新分类</span></div>
  </div>
  <div class="cxp"><p>• 拖拽左侧手柄调整分类顺序</p><p>• 长按分类名称可重命名</p><p>• 左滑自定义分类可删除</p><p>• 预设分类不可删除，但可在首页隐藏</p></div>
</div>
</template>

<!-- SETTINGS -->
<template v-if="pg==='set'">
<div class="nb"><button class="back" @click="pg='home'">← 返回</button><span class="title">设置</span></div>
<div class="pc pe">
  <div class="sgt" style="padding:16px 20px 4px">保质期提醒</div>
  <div class="sg">
    <div class="sgr"><span class="sl">到期提醒通知</span><button class="tg on" @click="cfg.notif=!cfg.notif" :class="cfg.notif?'on':'off'"></button></div>
    <div class="sgr"><span class="sl">默认提前提醒天数</span><span class="sv bl">{{cfg.remind}} 天 ›</span></div>
  </div>
  <div class="sgt">数据管理</div>
  <div class="sg">
    <div class="sgr"><span class="sl">账号与同步</span><span class="sv">未登录 ›</span></div>
    <div class="sgr"><span class="sl">导出数据</span><span class="sv">CSV ›</span></div>
    <div class="sgr"><span class="sl">清除所有数据</span><span class="sv rd">›</span></div>
  </div>
  <div class="sgt">关于</div>
  <div class="sg"><div class="sgr"><span class="sl">版本</span><span class="sv">v1.0.0 Demo</span></div></div>
</div>
</template>

<!-- Tab Bar -->
<div class="tb" v-if="['home','loc','set'].includes(pg)">
  <button class="ti" :class="{on:pg==='home'}" @click="pg='home'"><span class="ic">📦</span><span class="lb">物品</span></button>
  <button class="ti" :class="{on:pg==='loc'}" @click="pg='loc'"><span class="ic">📍</span><span class="lb">位置</span></button>
  <button class="ti" :class="{on:pg==='set'}" @click="pg='set'"><span class="ic">⚙️</span><span class="lb">设置</span></button>
</div>

<div class="toast" v-if="toastMsg">{{toastMsg}}</div>
</div>
</div>

<script>
const{createApp,ref,computed,reactive}=Vue
createApp({setup(){
const pg=ref('home'),sq=ref(''),ac=ref('all'),recording=ref(false),toastMsg=ref('')
const cfg=reactive({notif:true,remind:3})
const cats=ref([
  {id:'all',name:'全部',preset:true},{id:'food',name:'食品',preset:true},
  {id:'drink',name:'饮料',preset:true},{id:'daily',name:'日用品',preset:true},
  {id:'cosmetic',name:'化妆品',preset:true},{id:'medicine',name:'药品',preset:true},
  {id:'other',name:'其他',preset:true}
])
const locs=ref([
  {name:'家',emoji:'🏠',count:12,exp:true,ch:[
    {name:'厨房',emoji:'🍳',count:5,ch:[{name:'冰箱冷藏层',emoji:'🧊',count:2},{name:'调料柜',emoji:'🧂',count:3}]},
    {name:'卫生间',emoji:'🚿',count:3,ch:[{name:'洗漱台',emoji:'🪥',count:2},{name:'储物柜',emoji:'🗄',count:1}]},
    {name:'卧室',emoji:'🛏',count:2,ch:[{name:'床头柜',emoji:'🗃',count:2}]},
    {name:'阳台',emoji:'🌿',count:2,ch:[]}
  ]}
])
const locOpts=computed(()=>{const o=[];function w(ls,p){ls.forEach(l=>{const path=p?p+' > '+l.name:l.name;o.push(path);if(l.ch)w(l.ch,path)})}w(locs.value,'');return o})
const items=ref([
  {id:1,name:'蒙牛纯牛奶',emoji:'🥛',location:'家 > 厨房 > 冰箱冷藏层',cat:'food',note:'大润发买的，买两送一',exp:true,prod:'2026-06-15',days:45,remind:3,created:'2026-06-15 14:30'},
  {id:2,name:'味极鲜酱油',emoji:'🫗',location:'家 > 厨房 > 调料柜',cat:'food',note:'',exp:true,prod:'2026-03-01',days:365,remind:3,created:'2026-03-05 10:00'},
  {id:3,name:'海飞丝洗发水',emoji:'🧴',location:'家 > 卫生间 > 洗漱台',cat:'daily',note:'',exp:true,prod:'2026-01-10',days:730,remind:3,created:'2026-01-15 09:00'},
  {id:4,name:'创可贴',emoji:'🩹',location:'家 > 卧室 > 床头柜',cat:'other',note:'',exp:false,prod:'',days:0,remind:3,created:'2026-05-20 16:00'},
  {id:5,name:'农夫山泉矿泉水',emoji:'💧',location:'家 > 厨房 > 冰箱冷藏层',cat:'drink',note:'整箱24瓶',exp:true,prod:'2026-06-20',days:365,remind:3,created:'2026-06-22 11:00'},
  {id:6,name:'兰蔻小黑瓶精华',emoji:'✨',location:'家 > 卫生间 > 储物柜',cat:'cosmetic',note:'',exp:true,prod:'2025-12-01',days:1095,remind:7,created:'2025-12-10 14:00'}
])
const fm=reactive({name:'',photo:false,location:'',cat:'food',note:'',exp:false,prod:'',days:null,remind:3})
const dt=ref(null)
const curLoc=reactive({name:'',emoji:''})

function calcExp(i){if(!i.exp||!i.prod||!i.days)return null;const p=new Date(i.prod),e=new Date(p.getTime()+i.days*864e5),n=new Date(),r=Math.ceil((e-n)/864e5);return{expD:e,rem:r}}
function expInfo(i){const e=calcExp(i);if(!e)return{bt:'',bc:'b-m',rem:0,expD:null};if(e.rem<=0)return{bt:'已过期',bc:'b-r',rem:e.rem,expD:e.expD};if(e.rem<=i.remind)return{bt:'剩'+e.rem+'天',bc:'b-y',rem:e.rem,expD:e.expD};return{bt:'正常',bc:'b-g',rem:e.rem,expD:e.expD}}
function fmtD(d){if(!d)return'';const x=new Date(d);return(x.getMonth()+1).toString().padStart(2,'0')+'-'+x.getDate().toString().padStart(2,'0')}
function fmtISO(d){const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1).toString().padStart(2,'0')+'-'+x.getDate().toString().padStart(2,'0')}
function catName(id){const c=cats.value.find(c=>c.id===id);return c?c.name:''}

const fItems=computed(()=>{let l=items.value;if(ac.value!=='all')l=l.filter(i=>i.cat===ac.value);if(sq.value.trim()){const q=sq.value.trim().toLowerCase();l=l.filter(i=>i.name.toLowerCase().includes(q)||i.location.toLowerCase().includes(q))}return l.map(i=>({...i,...expInfo(i)}))})
const expItems=computed(()=>fItems.value.filter(i=>i.bc==='b-r'||i.bc==='b-y'))
const expRes=computed(()=>{if(!fm.prod||!fm.days)return null;const p=new Date(fm.prod),e=new Date(p.getTime()+fm.days*864e5),n=new Date(),r=Math.ceil((e-n)/864e5);return'到期日：'+fmtISO(e)+'  |  剩余：'+r+'天'})
const locItems=computed(()=>{if(!curLoc.name)return[];const p='家 > '+curLoc.name;return items.value.filter(i=>i.location.startsWith(p)).map(i=>({...i,...expInfo(i)}))})

function goDetail(i){const e=calcExp(i);dt.value={...i,...expInfo(i),rem:e?e.rem:0,expD:e?e.expD:null};pg.value='detail'}
function goAdd(){Object.assign(fm,{name:'',photo:false,location:'',cat:'food',note:'',exp:false,prod:'',days:null,remind:3});pg.value='add'}
function editItem(){const d=dt.value;Object.assign(fm,{name:d.name,photo:true,location:d.location,cat:d.cat,note:d.note||'',exp:d.exp,prod:d.prod||'',days:d.days,remind:d.remind});pg.value='add'}
function save(){if(!fm.name.trim()){tip('请输入物品名称');return}if(!fm.location){tip('请选择存放位置');return}items.value.unshift({id:Date.now(),name:fm.name,emoji:'📦',location:fm.location,cat:fm.cat,note:fm.note,exp:fm.exp,prod:fm.prod,days:fm.days||0,remind:fm.remind||3,created:fmtISO(new Date())+' '+new Date().toTimeString().slice(0,5)});tip('保存成功');pg.value='home'}
function delItem(){items.value=items.value.filter(i=>i.id!==dt.value.id);tip('已删除');pg.value='home'}
function doOCR(){fm.name='蒙牛纯牛奶';fm.cat='food';fm.exp=true;fm.prod='2026-06-20';fm.days=45;tip('识别完成，已自动填充')}
function doVoice(){if(recording.value){recording.value=false;fm.name='农夫山泉矿泉水';fm.location='家 > 厨房 > 冰箱冷藏层';fm.cat='drink';tip('语音识别完成')}else{recording.value=true;setTimeout(()=>{if(recording.value){recording.value=false;fm.name='农夫山泉矿泉水';fm.location='家 > 厨房 > 冰箱冷藏层';fm.cat='drink';tip('语音识别完成')}},3000)}}
function goLocItems(parent,child,emoji){curLoc.name=parent+' > '+child;curLoc.emoji=emoji;pg.value='loc-items'}
function addCat(){cats.value.push({id:'c_'+Date.now(),name:'新分类',preset:false});tip('已添加分类')}
function tip(m){toastMsg.value=m;setTimeout(()=>{toastMsg.value=''},2000)}

return{pg,sq,ac,recording,toastMsg,cfg,cats,locs,locOpts,items,fm,dt,curLoc,fItems,expItems,expRes,locItems,catName,fmtD,goDetail,goAdd,editItem,save,delItem,doOCR,doVoice,goLocItems,addCat,tip}
}}).mount('#app')
</script>
</body>
</html>
