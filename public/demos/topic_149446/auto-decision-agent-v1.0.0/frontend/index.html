<body>
  <header class="header">
    <div class="header-title">基于 LLM 的 Auto-Desicion 系统</div>
    <div class="header-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Agent 就绪</span>
    </div>
  </header>

  <div class="app-container">
    <!-- Left Panel: Input -->
    <div class="left-panel">
      <div class="panel-header">业务输入</div>

      <!-- File Upload -->
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">&#11014;</div>
        <div class="upload-text">拖拽文件到此处，或 <strong>点击上传</strong></div>
        <div class="upload-hint">支持 CSV, Excel, JSON, TXT 等格式</div>
      </div>
      <div class="file-list" id="fileList"></div>

      <!-- Chat -->
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
          <div class="message message-system">
            <div class="message-label">System</div>
            <div class="message-bubble">
              欢迎使用 Auto-Desicion 智能决策系统。请描述您的业务问题，或上传相关数据文件，我将自动进行意图识别、模型建立与算法求解。
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-wrapper">
            <textarea
              class="input-textarea"
              id="userInput"
              placeholder="请描述您的决策问题...（例如：我需要优化物流路径，有10个配送点和3辆货车）"
              rows="2"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel: Results -->
    <div class="right-panel">
      <div class="panel-header">运行结果</div>

      <!-- Workflow Steps -->
      <div class="workflow-section">
        <div class="workflow-title">决策流程</div>
        <div class="workflow-steps" id="workflowSteps">
          <div class="step" data-step="1">1. 意图识别</div>
          <div class="step" data-step="2">2. 模型描述</div>
          <div class="step" data-step="3">3. 合理性判断</div>
          <div class="step" data-step="4">4. 算法选择</div>
          <div class="step" data-step="5">5. 求解执行</div>
          <div class="step" data-step="6">6. 结果验证</div>
          <div class="step" data-step="7">7. 输出</div>
        </div>
      </div>

      <!-- Results -->
      <div class="results-area" id="resultsArea">
        <div class="empty-state">
          <div class="empty-state-icon">&#9881;</div>
          <div class="empty-state-title">等待输入</div>
          <div class="empty-state-desc">
            在左侧输入业务问题描述或上传数据文件后，Agent 将自动执行决策流程，结果将在此展示。
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== File Upload =====
    const uploadArea = document.getElementById('uploadArea');
    const fileList = document.getElementById('fileList');
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.multiple = true;
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    let uploadedFiles = [];
    let uploadedFileInfo = "";

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    async function handleFiles(files) {
      for (let file of files) {
        uploadedFiles.push(file);
        // 上传到服务器
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: formData });
          const data = await res.json();
          uploadedFileInfo = data.info;
        } catch (e) {
          console.error('上传失败:', e);
        }
      }
      renderFileList();
    }

    function renderFileList() {
      fileList.innerHTML = uploadedFiles.map((file, i) => `
        <div class="file-item">
          <span class="file-item-name">&#128196; ${file.name}</span>
          <span class="file-item-remove" onclick="removeFile(${i})">&times;</span>
        </div>
      `).join('');
    }

    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      if (uploadedFiles.length === 0) uploadedFileInfo = "";
      renderFileList();
    }

    // ===== Chat =====
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `message message-${sender}`;
      div.innerHTML = `
        <div class="message-label">${sender === 'user' ? 'User' : 'Agent'}</div>
        <div class="message-bubble">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setStatus(status, text) {
      statusDot.className = 'status-dot ' + status;
      statusText.textContent = text;
    }

    // ===== Workflow Steps =====
    const steps = document.querySelectorAll('.step');
    const resultsArea = document.getElementById('resultsArea');

    function resetSteps() {
      steps.forEach(s => s.classList.remove('active', 'done', 'error'));
    }

    function setStepStatus(stepNum, status) {
      steps.forEach(s => {
        const num = parseInt(s.dataset.step);
        if (num < stepNum) s.classList.add('done');
        else if (num === stepNum) {
          s.classList.remove('active', 'done', 'error');
          s.classList.add(status);
        }
      });
    }

    // ===== Results Rendering =====
    let logConsole = null;

    function initResults() {
      resultsArea.innerHTML = '';
      const logs = document.createElement('div');
      logs.className = 'result-block';
      logs.innerHTML = `
        <div class="result-header">
          <span class="result-header-left">
            <span class="result-badge">LOG</span>
            运行日志
          </span>
        </div>
        <div class="result-body">
          <div class="log-console" id="logConsole"></div>
        </div>
      `;
      resultsArea.appendChild(logs);
      logConsole = document.getElementById('logConsole');
    }

    function log(level, msg) {
      if (!logConsole) return;
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${level}">${msg}</span>`;
      logConsole.appendChild(entry);
      logConsole.scrollTop = logConsole.scrollHeight;
    }

    function addResultBlock(title, badge, bodyHtml) {
      const block = document.createElement('div');
      block.className = 'result-block';
      block.innerHTML = `
        <div class="result-header">
          <span class="result-header-left">
            <span class="result-badge">${badge}</span>
            ${title}
          </span>
        </div>
        <div class="result-body">${bodyHtml}</div>
      `;
      resultsArea.insertBefore(block, resultsArea.firstChild);
    }

    function formatJson(data) {
      return `<div class="json-view">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;
    }

    // ===== Main Handler =====
    let currentEventSource = null;

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text && uploadedFiles.length === 0) return;

      if (text) {
        addMessage('user', text);
        userInput.value = '';
      }

      sendBtn.disabled = true;
      setStatus('busy', 'Agent 运行中...');
      resetSteps();
      initResults();

      // Close previous connection if any
      if (currentEventSource) {
        currentEventSource.close();
      }

      const payload = {
        query: text,
        file_info: uploadedFileInfo,
      };

      // Use SSE for streaming
      currentEventSource = new EventSource('/api/solve/stream?' + new URLSearchParams({
        _data: JSON.stringify(payload)
      }));

      // Actually POST with SSE is tricky, let's use fetch + ReadableStream
      await streamSolve(payload);
    }

    async function streamSolve(payload) {
      try {
        const response = await fetch('/api/solve/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop() || '';

          for (const chunk of lines) {
            processEvent(chunk);
          }
        }

        // Process remaining buffer
        if (buffer.trim()) {
          processEvent(buffer);
        }

      } catch (e) {
        log('err', `请求失败: ${e.message}`);
        setStatus('error', '连接错误');
      } finally {
        sendBtn.disabled = false;
        if (statusText.textContent === 'Agent 运行中...') {
          setStatus('', 'Agent 就绪');
        }
      }
    }

    function processEvent(chunk) {
      const lines = chunk.split('\n');
      let eventType = '';
      let dataStr = '';

      for (const line of lines) {
        if (line.startsWith('event:')) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          dataStr += line.slice(5).trim();
        }
      }

      if (!eventType || !dataStr) return;

      try {
        const data = JSON.parse(dataStr);
        handleEvent(eventType, data);
      } catch (e) {
        console.error('Parse event error:', e, dataStr);
      }
    }

    function handleEvent(eventType, data) {
      switch (eventType) {
        case 'step':
          setStepStatus(data.step, data.status);
          log(data.status === 'error' ? 'err' : 'info', data.message);
          break;

        case 'intent':
          addResultBlock('意图识别', 'INTENT', `
            <p><strong>问题类型:</strong> ${data.problem_type || '未知'}</p>
            <p><strong>问题名称:</strong> ${data.problem_name || '未命名'}</p>
            <p><strong>目标:</strong> ${data.objective || ''}</p>
            <p><strong>关键约束:</strong> ${(data.key_constraints || []).join(', ')}</p>
            <p><strong>预估规模:</strong> ${data.estimated_scale || 'medium'}</p>
            <p><strong>置信度:</strong> ${data.confidence || 'low'}</p>
          `);
          break;

        case 'model':
          const varsHtml = (data.variables || []).map(v =>
            `<code>${v.name}</code> (${v.type}) - ${v.description}`
          ).join('<br>');
          const consHtml = (data.constraints || []).map(c =>
            `<strong>${c.name}:</strong> ${c.expression || c.description}`
          ).join('<br>');
          addResultBlock('模型描述', 'MODEL', `
            <p><strong>${data.model_name}</strong> (${data.model_type})</p>
            <p>${data.description || ''}</p>
            <p><strong>决策变量:</strong></p>
            <div style="margin-left:12px">${varsHtml || '无'}</div>
            <p><strong>目标函数:</strong> ${data.objective?.description || ''}</p>
            <p><strong>约束条件:</strong></p>
            <div style="margin-left:12px">${consHtml || '无'}</div>
          `);
          break;

        case 'validation':
          const status = data.valid ? '通过' : '不通过';
          const statusColor = data.valid ? 'var(--success)' : 'var(--warning)';
          addResultBlock('模型验证', 'VALID', `
            <p style="color:${statusColor}"><strong>验证结果:</strong> ${status}</p>
            <p><strong>变量数:</strong> ${data.scale?.variable_count || 0}</p>
            <p><strong>约束数:</strong> ${data.scale?.constraint_count || 0}</p>
            <p><strong>预估规模:</strong> ${data.scale?.scale || 'unknown'}</p>
            ${data.errors?.length ? `<p style="color:var(--warning)"><strong>警告:</strong> ${data.errors.join('; ')}</p>` : ''}
          `);
          break;

        case 'algorithm':
          const altHtml = (data.alternatives || []).map(a =>
            `<span class="algo-chip">${a}</span>`
          ).join('');
          addResultBlock('算法选择', 'ALGO', `
            <p><strong>选定算法:</strong> <span class="algo-chip selected">${data.algorithm_name}</span></p>
            <p><strong>选择理由:</strong> ${data.reason}</p>
            <p><strong>备选算法:</strong></p>
            <div class="algo-choice">${altHtml || '<span class="algo-chip">无</span>'}</div>
          `);
          break;

        case 'solution':
          const routesHtml = (data.routes || []).map(r =>
            `Route ${r.route_id}: ${r.nodes?.join(' -> ') || ''}  [距离: ${r.distance} km]`
          ).join('\n');
          addResultBlock('求解结果', 'SOL', `
            <p><strong>状态:</strong> <span style="color:var(--${data.status === 'optimal' ? 'success' : 'accent'})">${data.status === 'optimal' ? '最优解' : '可行解'}</span></p>
            <p><strong>目标函数值:</strong> ${data.objective_value}</p>
            <p><strong>求解时间:</strong> ${data.solve_time}s</p>
            ${data.gap > 0 ? `<p><strong>Gap:</strong> ${data.gap}%</p>` : ''}
            <p><strong>算法:</strong> ${data.algorithm}</p>
            ${routesHtml ? `<pre>${routesHtml}</pre>` : ''}
          `);
          break;

        case 'log':
          log(data.level, data.message);
          break;

        case 'final':
          if (data.success) {
            setStatus('', 'Agent 就绪');
            const attachHtml = (data.attachments || []).map(a => `
              <div class="attachment-item">
                <span class="attachment-icon">${a.type === 'json' ? '&#128196;' : '&#128200;'}</span>
                <span class="attachment-name">${a.name}</span>
                <span class="attachment-size">${a.size}</span>
                <span class="attachment-download" onclick="downloadJson('${a.name}', ${JSON.stringify(a.name === 'solution_result.json' ? data.solution : data.model).replace(/"/g, '&quot;')})">下载</span>
              </div>
            `).join('');
            addResultBlock('附件输出', 'OUT', `
              <div class="attachment-list">${attachHtml}</div>
            `);
            addMessage('system', data.message);
          } else {
            setStatus('error', '需要用户介入');
            addResultBlock('求解失败', 'ERROR', `
              <p style="color:var(--danger)">${data.message}</p>
              ${data.need_user_input ? `
                <div class="user-input-prompt">
                  <div class="user-input-prompt-title">&#9888; 需要您的输入</div>
                  <p>系统经过多次尝试仍未获得有效解。请修改问题描述后重新发送，或检查上传的数据文件。</p>
                </div>
              ` : ''}
            `);
            addMessage('system', data.message + ' 请修改问题描述后重试。');
          }
          sendBtn.disabled = false;
          break;

        case 'error':
          log('err', data.message);
          setStatus('error', '运行出错');
          sendBtn.disabled = false;
          break;
      }
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
