# Auto-Decision Agent 配置文件
# 不配置 API Key 时，系统将自动使用 Mock 演示模式
# 所有功能均可正常展示，无需真实 LLM 调用

llm:
  # 支持 provider: openai_compatible / qwen / wenxin / zhipu / moonshot
  provider: openai_compatible

  # API 基础地址
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  # 留空则使用 Mock 演示模式（无需填写真实 Key）
  api_key: ''

  # 模型名称
  model: "qwen-max"

  # 温度参数
  temperature: 0.3

  # 最大 token 数
  max_tokens: 4096

# 系统行为配置
system:
  # 解验证失败后的最大自动重试次数
  max_validation_retries: 2

  # 模拟求解时的延迟范围（秒）
  simulate_delay_min: 0.5
  simulate_delay_max: 3.0