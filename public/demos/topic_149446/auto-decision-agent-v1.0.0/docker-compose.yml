version: "3.8"

services:
  auto-decision-agent:
    build: .
    container_name: auto-decision-agent
    ports:
      - "8000:8000"
    environment:
      # 可通过环境变量覆盖 LLM 配置
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      # 挂载配置，方便修改
      - ./config:/app/config
    restart: unless-stopped