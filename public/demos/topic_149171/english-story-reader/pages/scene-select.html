    <style id="theme-vars">
:root {
  /* ── Brand Color System ── */
  --color-primary: #2D8C6F;
  --color-primary-light: #3BA882;
  --color-primary-lighter: #E8F5F0;
  --color-primary-dark: #1F6B54;

  /* ── Semantic State Colors ── */
  --state-success: #2D8C6F;
  --state-success-bg: #E8F5F0;
  --state-warning: #E5A220;
  --state-warning-bg: #FFF8E6;
  --state-error: #DC4D3F;
  --state-error-bg: #FDECEB;
  --state-info: #3A7BD5;
  --state-info-bg: #EBF2FD;

  /* ── Vocabulary Highlight Colors ── */
  --vocab-topic: #3A7BD5;
  --vocab-topic-bg: #EBF2FD;
  --vocab-notebook: #2D8C6F;
  --vocab-notebook-bg: #E8F5F0;
  --vocab-phrase: #C463A8;
  --vocab-phrase-bg: #FDF0F8;

  /* ── Neutral Palette ── */
  --color-bg: #F6F7FA;
  --color-bg-warm: #FAFAF7;
  --color-surface: #FFFFFF;
  --color-surface-secondary: #F0F1F5;
  --color-border: #E4E6EC;
  --color-border-light: #EDEEF3;
  --color-text-primary: #1A1D26;
  --color-text-secondary: #5F6478;
  --color-text-tertiary: #9398AD;
  --color-text-inverse: #FFFFFF;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* ── Shadow Model ── */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* ── Typography System ── */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-en: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;

  /* Type Scale */
  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 18px;
  --text-xl-lh: 26px;
  --text-2xl: 22px;
  --text-2xl-lh: 30px;
  --text-3xl: 28px;
  --text-3xl-lh: 36px;

  /* Font Weights */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 48px;

  /* ── Mini Program Safe Area ── */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-bar-height: 56px;
}

/* ── Global Reset ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--text-base-lh);
  color: var(--color-text-primary);
  background-color: var(--color-bg);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Utility Typography Classes ── */
.font-display {
  font-family: var(--font-display);
  font-weight: var(--font-bold);
}

.font-en {
  font-family: var(--font-en);
}

.font-mono {
  font-family: var(--font-mono);
}

/* ── Mini Program Frame Simulation ── */
.mini-program-frame {
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: var(--color-bg);
  position: relative;
  overflow-x: hidden;
}

/* ── Status Bar (WeChat mini program) ── */
.status-bar {
  height: 44px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-lg);
  position: sticky;
  top: 0;
  z-index: 100;
}

/* ── Navigation Bar ── */
.nav-bar {
  height: 44px;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-lg);
  position: sticky;
  top: 44px;
  z-index: 99;
  border-bottom: 1px solid var(--color-border-light);
}

.nav-bar__title {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
}

.nav-bar__back {
  position: absolute;
  left: var(--space-lg);
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  color: var(--color-text-primary);
  text-decoration: none;
  font-size: var(--text-base);
  cursor: pointer;
}

/* ── Tab Bar (Bottom) ── */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 375px;
  height: calc(var(--tab-bar-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--color-surface);
  border-top: 1px solid var(--color-border-light);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 200;
}

.tab-bar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-decoration: none;
  color: var(--color-text-tertiary);
  font-size: var(--text-xs);
  cursor: pointer;
  transition: color 0.15s ease;
}

.tab-bar__item--active {
  color: var(--color-primary);
}

.tab-bar__icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Card Component ── */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border-light);
  padding: var(--space-lg);
}

/* ── Progress Bar ── */
.progress-bar {
  height: 6px;
  background: var(--color-surface-secondary);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-bar__fill {
  height: 100%;
  background: var(--color-primary);
  border-radius: var(--radius-full);
  transition: width 0.3s ease;
}

/* ── Tag / Chip ── */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  white-space: nowrap;
}

.tag--primary {
  background: var(--color-primary-lighter);
  color: var(--color-primary-dark);
}

.tag--info {
  background: var(--state-info-bg);
  color: var(--state-info);
}

.tag--warning {
  background: var(--state-warning-bg);
  color: #B07A10;
}

/* ── Button ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: var(--text-base);
  font-weight: var(--font-medium);
  border: none;
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
}

.btn--primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.btn--primary:hover {
  background: var(--color-primary-dark);
}

.btn--secondary {
  background: var(--color-primary-lighter);
  color: var(--color-primary-dark);
}

.btn--outline {
  background: transparent;
  color: var(--color-primary);
  border: 1px solid var(--color-primary);
}

.btn--block {
  width: 100%;
}

.btn--lg {
  padding: 14px 24px;
  font-size: var(--text-lg);
  border-radius: var(--radius-lg);
}

/* ── Page Content Padding ── */
.page-content {
  padding: var(--space-lg);
  padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + var(--space-xl));
}

/* ── Vocabulary Highlight Styles ── */
.vocab-highlight--topic {
  color: var(--vocab-topic);
  border-bottom: 2px solid var(--vocab-topic);
  cursor: pointer;
  transition: background 0.15s;
}

.vocab-highlight--topic:hover {
  background: var(--vocab-topic-bg);
}

.vocab-highlight--notebook {
  color: var(--vocab-notebook);
  border-bottom: 2px solid var(--vocab-notebook);
  cursor: pointer;
  transition: background 0.15s;
}

.vocab-highlight--notebook:hover {
  background: var(--vocab-notebook-bg);
}

.vocab-highlight--phrase {
  color: var(--vocab-phrase);
  border-bottom: 2px dashed var(--vocab-phrase);
  cursor: pointer;
  transition: background 0.15s;
}

.vocab-highlight--phrase:hover {
  background: var(--vocab-phrase-bg);
}

/* ── Tooltip / Popup Card ── */
.tooltip-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float);
  padding: var(--space-md);
  max-width: 300px;
  z-index: 300;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

  <div class="mini-program-frame">

    <!-- Status Bar -->
    <div class="status-bar">

          <button type="button" class="btn btn--primary btn--lg btn--block" data-dom-id="cta-start-reading" style="display:flex;align-items:center;justify-content:center;gap:var(--space-sm);">

            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 4.5L12 9L7 13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </section>

      </div>

    </main>

    <!-- Tab Bar (hidden — this is a pushed page) -->
    <nav class="tab-bar" id="shell-tab-bar" style="display:none;">
      <a class="tab-bar__item" data-tab-key="home" data-dom-id="tab-home" href="#">
        <span class="tab-bar__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3L21 10.5V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V10.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </span>
        <span>首页</span>
      </a>
      <a class="tab-bar__item" data-tab-key="vocab" data-dom-id="tab-vocab" href="#">
        <span class="tab-bar__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H14M4 18H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <span>词汇</span>
      </a>
      <a class="tab-bar__item" data-tab-key="profile" data-dom-id="tab-profile" href="#">

          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20C4 16.69 7.58 14 12 14C16.42 14 20 16.69 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <span>我的</span>

    </nav>

  </div>

  <!-- Inline style for scene card interaction states -->
  <style>
    /* Scene card unselected state hover */
    .scene-card:not(.scene-card--selected):hover {
      border-color: var(--color-border);
    }
    .scene-card:not(.scene-card--selected):active {
      background: var(--color-surface-secondary);
    }
    /* Scene card selected state active feedback */
    .scene-card--selected:active {
      background: var(--color-primary-lighter);
    }
    /* CTA hover micro-interaction: arrow slides 2px right */
    .btn--primary[data-dom-id="cta-start-reading"]:hover svg {
      transform: translateX(2px);
    }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .scene-card,
      .btn--primary[data-dom-id="cta-start-reading"],
      .btn--primary[data-dom-id="cta-start-reading"] svg {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
