<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soloist - 随身声乐指导</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="icons">📶 🔋</span>
    </div>

    <!-- 内容区 -->
    <div class="content-area">
      <!-- 5个Tab页（每个内含content容器） -->
      <div class="page active" id="page-home">
        <div id="home-content"></div>
      </div>
      <div class="page" id="page-detection">
        <div id="detection-content"></div>
      </div>
      <div class="page" id="page-course">
        <div id="course-content"></div>
      </div>
      <div class="page" id="page-score">
        <div id="score-content"></div>
      </div>
      <div class="page" id="page-profile">
        <div id="profile-content"></div>
      </div>

      <!-- 10个子页面（内容由JS直接innerHTML渲染） -->
      <div class="page" id="page-detection-running"></div>
      <div class="page" id="page-detection-result"></div>
      <div class="page" id="page-course-detail"></div>
      <div class="page" id="page-score-player"></div>
      <div class="page" id="page-vocal-dna"></div>
      <div class="page" id="page-growth"></div>
      <div class="page" id="page-achievements"></div>
      <div class="page" id="page-ai-coach"></div>
      <div class="page" id="page-community"></div>
      <div class="page" id="page-leaderboard"></div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar">
      <div class="tab-item active" data-tab="home">
        <div class="icon">🏠</div>
        <div class="label">首页</div>
      </div>
      <div class="tab-item" data-tab="detection">
        <div class="icon">🎤</div>
        <div class="label">检测</div>
      </div>
      <div class="tab-item" data-tab="course">
        <div class="icon">📚</div>
        <div class="label">课程</div>
      </div>
      <div class="tab-item" data-tab="score">
        <div class="icon">🎼</div>
        <div class="label">曲谱</div>
      </div>
      <div class="tab-item" data-tab="profile">
        <div class="icon">👤</div>
        <div class="label">我的</div>
      </div>
    </div>
  </div>

  <!-- 引用4个JS文件（按依赖顺序） -->
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactions.js"></script>
</body>
</html>
