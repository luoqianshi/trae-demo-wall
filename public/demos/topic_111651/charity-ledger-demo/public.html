  <title>公益记账本 · 公开查账</title>
  <style>

    :root {

    .chip:hover { transform: translateY(-1px); }
    .chip.active { background: var(--accent); color: var(--bg2); border-color: var(--accent); }
    .chart-box { width: 100%; min-height: 360px; }
    footer { text-align: center; color: var(--muted); padding: 22px 0 4px; font-size: .88rem; }
    .modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.45); backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--bg2); border-radius: 28px; padding: 28px;
      max-width: 480px; width: 92%; box-shadow: 0 26px 80px rgba(0,0,0,.18);
      border: 1px solid var(--rule); max-height: 90vh; overflow-y: auto;
    }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--muted); font-size: .88rem; }
    .detail-value { font-weight: 700; text-align: right; }
    .detail-value.income { color: var(--accent); }
    .detail-value.expense { color: var(--accent2); }
    .detail-img { max-width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid var(--rule); }
    @media (max-width: 980px) {
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .list-header { display: block; }
    }
    @media (max-width: 520px) {
      .summary-strip { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .page { padding: 14px; }
      .top { align-items: flex-start; }
      .main-card { padding: 18px; }
    }
  </style>

<body>
  <div class="page">
    <!-- 顶部品牌栏 -->
    <div class="top">
      <div class="brand">
        <div class="mark">善</div>
        <span>公益记账本</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="visibilityLabel">公开查账</span>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-card">
      <!-- 账本标题 -->
      <div class="list-header">
        <div class="list-title">
          <div class="eyebrow" id="eyebrowText">公益账本</div>
          <h1 id="bookName">加载中...</h1>
          <p id="bookDesc"></p>
        </div>
      </div>

      <!-- 收支统计卡片 -->
      <div class="summary-strip">
        <div class="summary-card count-card">
          <div class="stat-icon">📋</div>
          <b id="totalCount">-</b>
          <span>账目笔数</span>
        </div>
        <div class="summary-card income-card">
          <div class="stat-icon">📥</div>
          <b id="totalIncome">-</b>
          <span>总收入</span>
        </div>
        <div class="summary-card expense-card">
          <div class="stat-icon">📤</div>
          <b id="totalExpense">-</b>
          <span>总支出</span>
        </div>
        <div class="summary-card balance-card-custom">
          <div class="stat-icon">💰</div>
          <b id="totalBalance">-</b>
          <span>当前余额</span>
        </div>
      </div>

      <!-- 收支明细 -->
      <div class="section-label">收支明细</div>
      <div class="ledger" id="ledgerList">
        <!-- 由 JS 动态渲染 -->
      </div>

      <!-- 收支趋势图表 -->
      <div class="section-label" style="margin-top:22px">收支趋势</div>
      <div class="filter-row">
        <button class="chip active" data-chart-type="bar">柱状图</button>
        <button class="chip" data-chart-type="line">折线图</button>
        <button class="chip" data-chart-type="pie">饼图</button>
      </div>
      <div id="trendChart" class="chart-box"></div>

      <!-- 按类型统计图表 -->
      <div class="section-label" style="margin-top:22px">按类型统计</div>
      <div class="filter-row">
        <button class="chip active" data-type-chart-type="bar">柱状图</button>
        <button class="chip" data-type-chart-type="line">折线图</button>
        <button class="chip" data-type-chart-type="pie">饼图</button>
      </div>
      <div id="typeChart" class="chart-box" style="min-height:320px"></div>
    </div>

    <!-- 底部版权 -->
    <footer>公益记账本 · 公开查账页面 · 数据仅供演示</footer>
  </div>

  <!-- 账目详情弹窗 -->
  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="modal-content">
      <h3 id="detailTitle" style="margin:0 0 16px;font-size:1.2rem"></h3>
      <div id="detailBody"></div>
      <button id="closeDetail" style="margin-top:18px;width:100%;padding:10px;border-radius:16px;border:1px solid var(--rule);background:var(--bg2);color:var(--accent);font-weight:800;cursor:pointer">关闭</button>
    </div>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="modal" id="imagePreviewModal" aria-hidden="true" style="z-index:2000">
    <div class="modal-content" style="max-width:90vw;max-height:90vh;padding:12px;text-align:center;background:transparent;border:none;backdrop-filter:none;box-shadow:none">
      <button id="closePreview" style="position:fixed;top:16px;right:16px;z-index:2001;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;line-height:1;padding:0;cursor:pointer">✕</button>
      <img id="previewImage" style="max-width:100%;max-height:85vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)">
    </div>
  </div>

  <script src="./_shared/js/echarts.min.js"></script>
  <script>
    // ============================
    // 公开查账页面数据入口
    // 通过 URL hash #book=0 指定账本索引
    // 从 localStorage 读取对应账本数据
    // 无参数时使用默认示例数据
    // ============================
    var DEFAULT_DATA = {
      "name": "暖冬衣物募集账本",
      "desc": "为社区困难家庭募集冬衣和保暖物资",
      "income": 12860,
      "expense": 7420,
      "count": 18,
      "created": "2026-06-20T09:00",
      "rows": [
        { "type": "income",  "title": "企业公益配捐",       "amount": 5000, "category": "捐赠", "date": "2026-07-01T10:00" },
        { "type": "expense", "title": "采购保暖手套 120 双", "amount": 2460, "category": "采购", "date": "2026-07-02T15:30" },
        { "type": "income",  "title": "爱心人士定向捐赠",   "amount": 1200, "category": "捐赠", "date": "2026-07-03T09:20" },
        { "type": "expense", "title": "仓储与打包材料",     "amount": 680,  "category": "物流", "date": "2026-07-04T16:00" }
      ]
    };

    var PUBLIC_DATA = (function() {
      var hash = window.location.hash;
      var match = hash.match(/book=(\d+)/);
      if (match) {
        try {
          var books = JSON.parse(localStorage.getItem('charity_books') || '[]');
          var index = Number(match[1]);
          if (books[index]) return books[index];
        } catch(e) {}
      }
      return DEFAULT_DATA;
    })();

    (function () {
      var style = getComputedStyle(document.documentElement);
      var accent = style.getPropertyValue('--accent').trim();
      var accent2 = style.getPropertyValue('--accent2').trim();
      var muted = style.getPropertyValue('--muted').trim();
      var rule = style.getPropertyValue('--rule').trim();
      var bg2 = style.getPropertyValue('--bg2').trim();

      var data = PUBLIC_DATA;
      var chartType = 'bar';
      var typeChartType = 'bar';

      var trendChart = echarts.init(document.getElementById('trendChart'), null, { renderer: 'svg' });
      var typeChart = echarts.init(document.getElementById('typeChart'), null, { renderer: 'svg' });

      // 填充账本基本信息
      document.getElementById('bookName').textContent = data.name || '公益账本';
      document.getElementById('bookDesc').textContent = data.desc || '';

      // 填充统计卡片
      document.getElementById('totalCount').textContent = data.count || 0;
      document.getElementById('totalIncome').textContent = '¥' + formatNum(data.income || 0);
      document.getElementById('totalExpense').textContent = '¥' + formatNum(data.expense || 0);
      document.getElementById('totalBalance').textContent = '¥' + formatNum((data.income || 0) - (data.expense || 0));

      // 渲染收支明细
      renderLedger();
      // 渲染图表
      renderTrendChart();
      renderTypeChart();

      function renderLedger() {
        var container = document.getElementById('ledgerList');
        var rows = data.rows || [];
        if (!rows.length) {
          container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:32px 0;">暂无收支记录</p>';
          return;
        }
        var html = '';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var isIncome = r.type === 'income';
          var isImg = r.receipt && (r.receipt.indexOf('data:') === 0 || /\.(jpg|jpeg|png|gif|webp)$/i.test(r.receipt));
          var receiptDisplay = isImg
            ? '<img data-receipt-img src="' + r.receipt + '" style="max-width:80px;max-height:60px;border-radius:6px;border:1px solid var(--rule);margin-top:4px;cursor:zoom-in">'
            : (r.receipt ? '<span style="color:var(--muted);font-size:.78rem">凭证：' + escapeHtml(r.receipt) + '</span>' : '');
          html += ''
            + '<div class="row" data-detail-index="' + i + '">'
            + '  <div>'
            + '    <strong>' + escapeHtml(r.title) + '</strong>'
            + '    <div class="row-meta">'
            + '      <span class="tag ' + r.type + '">' + (isIncome ? '收入' : '支出') + '</span>'
            + '      <span class="category-tag">' + escapeHtml(r.category || '其他') + '</span>'
            + '    </div>'
            + (receiptDisplay ? '<div>' + receiptDisplay + '</div>' : '')
            + '  </div>'
            + '  <div class="row-right">'
            + '    <span class="amount ' + (isIncome ? 'income' : 'expense') + '">' + (isIncome ? '+' : '-') + '¥' + formatNum(r.amount) + '</span>'
            + '    <span class="date-text">' + formatDate(r.date) + '</span>'
            + '  </div>'
            + '</div>';
        }
        container.innerHTML = html;
      }

      function renderTrendChart() {
        var rows = data.rows || [];
        var buckets = {};
        rows.forEach(function(row) {
          var key = row.date ? String(row.date).slice(0, 10) : '未记录';
          if (!buckets[key]) buckets[key] = { income: 0, expense: 0 };
          buckets[key][row.type] += Number(row.amount || 0);
        });
        var dates = Object.keys(buckets).sort();
        if (!dates.length) { dates = ['暂无数据']; buckets['暂无数据'] = { income: 0, expense: 0 }; }
        var income = dates.map(function(d) { return buckets[d].income; });
        var expense = dates.map(function(d) { return buckets[d].expense; });
        var labels = dates.map(function(d) { return d === '暂无数据' || d === '未记录' ? d : d.slice(5); });
        var balance = [], running = 0;
        dates.forEach(function(d) { running += buckets[d].income - buckets[d].expense; balance.push(running); });

        trendChart.clear();
        if (chartType === 'pie') {
          var ti = income.reduce(function(s, n) { return s + n; }, 0);
          var te = expense.reduce(function(s, n) { return s + n; }, 0);
          trendChart.setOption({
            animation: false, color: [accent, accent2],
            tooltip: { trigger: 'item', appendToBody: true, valueFormatter: function(v) { return '¥' + formatNum(v); } },
            legend: { bottom: 0, textStyle: { color: muted }, itemWidth: 10, itemHeight: 10 },
            series: [{ name: '收支占比', type: 'pie', radius: ['46%','70%'], center: ['50%','46%'],
              label: { color: muted, formatter: '{b}: {d}%' },
              data: [{ name: '收入', value: ti }, { name: '支出', value: te }] }]
          });
          return;
        }
        var lineMode = chartType === 'line';
        var legendSelected = lineMode ? { '收入': true, '支出': false, '累计余额': false } : { '收入': true, '支出': true, '累计余额': true };
        trendChart.setOption({
          animation: false, color: [accent, accent2, muted],
          tooltip: { trigger: 'axis', appendToBody: true, valueFormatter: function(v) { return '¥' + formatNum(v); } },
          legend: { top: 0, selected: legendSelected, textStyle: { color: muted }, itemWidth: 10, itemHeight: 10 },
          grid: { left: 10, right: 12, bottom: 20, top: 44, containLabel: true },
          xAxis: { type: 'category', data: labels, axisTick: { show: false }, axisLine: { lineStyle: { color: rule } }, axisLabel: { color: muted } },
          yAxis: { type: 'value', axisLabel: { color: muted, formatter: function(v) { return v >= 1000 ? v / 1000 + 'k' : v; } }, splitLine: { lineStyle: { color: rule } } },
          series: [
            { name: '收入', type: lineMode ? 'line' : 'bar', smooth: lineMode, barWidth: 18, symbolSize: 8, data: income, itemStyle: { borderRadius: [8,8,0,0] } },
            { name: '支出', type: lineMode ? 'line' : 'bar', smooth: lineMode, barWidth: 18, symbolSize: 8, data: expense, itemStyle: { borderRadius: [8,8,0,0] } },
            { name: '累计余额', type: 'line', smooth: true, symbolSize: 8, data: balance, lineStyle: { width: 3 }, areaStyle: lineMode ? null : { color: bg2, opacity: .5 } }
          ]
        });
      }

      function renderTypeChart() {
        var rows = data.rows || [];
        var buckets = {};
        rows.forEach(function(row) {
          var key = row.category || '其他';
          if (!buckets[key]) buckets[key] = { income: 0, expense: 0 };
          buckets[key][row.type] += Number(row.amount || 0);
        });
        var categories = Object.keys(buckets).sort(function(a, b) {
          return (buckets[b].income + buckets[b].expense) - (buckets[a].income + buckets[a].expense);
        });
        if (!categories.length) { categories = ['暂无数据']; buckets['暂无数据'] = { income: 0, expense: 0 }; }
        var income = categories.map(function(c) { return buckets[c].income; });
        var expense = categories.map(function(c) { return buckets[c].expense; });
        var legendSelected = (typeChartType === 'bar' || typeChartType === 'line') ? { '收入': true, '支出': false } : null;

        typeChart.clear();
        if (typeChartType === 'pie') {
          typeChart.setOption({
            animation: false, color: [accent, accent2, muted, '#8bbf9f', '#f3b47f'],
            tooltip: { trigger: 'item', appendToBody: true, valueFormatter: function(v) { return '¥' + formatNum(v); } },
            legend: { bottom: 0, textStyle: { color: muted }, itemWidth: 10, itemHeight: 10 },
            series: [{ name: '类型金额', type: 'pie', radius: ['42%','68%'], center: ['50%','46%'],
              label: { color: muted, formatter: '{b}: {d}%' },
              data: categories.map(function(c) { return { name: c, value: buckets[c].income + buckets[c].expense }; }) }]
          });
          return;
        }
        var lineMode = typeChartType === 'line';
        typeChart.setOption({
          animation: false, color: [accent, accent2],
          tooltip: { trigger: 'axis', appendToBody: true, valueFormatter: function(v) { return '¥' + formatNum(v); } },
          legend: { top: 0, selected: legendSelected, textStyle: { color: muted }, itemWidth: 10, itemHeight: 10 },
          grid: { left: 10, right: 12, bottom: 20, top: 44, containLabel: true },
          xAxis: { type: 'category', data: categories, axisTick: { show: false }, axisLine: { lineStyle: { color: rule } }, axisLabel: { color: muted } },
          yAxis: { type: 'value', axisLabel: { color: muted, formatter: function(v) { return v >= 1000 ? v / 1000 + 'k' : v; } }, splitLine: { lineStyle: { color: rule } } },
          series: [
            { name: '收入', type: lineMode ? 'line' : 'bar', smooth: lineMode, symbolSize: 8, data: income, itemStyle: { borderRadius: lineMode ? null : [8,8,0,0] } },
            { name: '支出', type: lineMode ? 'line' : 'bar', smooth: lineMode, symbolSize: 8, data: expense, itemStyle: { borderRadius: lineMode ? null : [8,8,0,0] } }
          ]
        });
      }

      // 图表类型切换
      document.querySelectorAll('[data-chart-type]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('[data-chart-type]').forEach(function(i) { i.classList.remove('active'); });
          this.classList.add('active');
          chartType = this.getAttribute('data-chart-type');
          renderTrendChart();
          trendChart.resize();
        });
      });
      document.querySelectorAll('[data-type-chart-type]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('[data-type-chart-type]').forEach(function(i) { i.classList.remove('active'); });
          this.classList.add('active');
          typeChartType = this.getAttribute('data-type-chart-type');
          renderTypeChart();
          typeChart.resize();
        });
      });

      window.addEventListener('resize', function() { trendChart.resize(); typeChart.resize(); });

      // 图片预览 + 账目详情点击
      document.addEventListener('click', function(e) {
        var receiptImg = e.target.closest('[data-receipt-img]');
        if (receiptImg) {
          e.stopPropagation();
          document.getElementById('previewImage').src = receiptImg.getAttribute('src');
          var modal = document.getElementById('imagePreviewModal');
          modal.classList.add('active');
          modal.setAttribute('aria-hidden', 'false');
          return;
        }
        var detailRow = e.target.closest('[data-detail-index]');
        if (detailRow) {
          var idx = Number(detailRow.getAttribute('data-detail-index'));
          var r = data.rows[idx];
          if (!r) return;
          var isIncome = r.type === 'income';
          document.getElementById('detailTitle').textContent = r.title;
          var bodyHtml = ''
            + '<div class="detail-row"><span class="detail-label">类型</span><span class="detail-value ' + r.type + '">' + (isIncome ? '收入' : '支出') + '</span></div>'
            + '<div class="detail-row"><span class="detail-label">金额</span><span class="detail-value ' + r.type + '">' + (isIncome ? '+' : '-') + '¥' + formatNum(r.amount) + '</span></div>'
            + '<div class="detail-row"><span class="detail-label">分类</span><span class="detail-value">' + escapeHtml(r.category || '其他') + '</span></div>'
            + '<div class="detail-row"><span class="detail-label">记录人</span><span class="detail-value">' + escapeHtml(r.user || '-') + '</span></div>'
            + '<div class="detail-row"><span class="detail-label">创建人</span><span class="detail-value">' + escapeHtml(r.creator || r.user || '-') + '</span></div>'
            + '<div class="detail-row"><span class="detail-label">时间</span><span class="detail-value">' + formatDate(r.date) + '</span></div>';
          if (r.receipt && (r.receipt.indexOf('data:') === 0 || /\.(jpg|jpeg|png|gif|webp)$/i.test(r.receipt))) {
            bodyHtml += '<img data-receipt-img src="' + r.receipt + '" class="detail-img" style="cursor:zoom-in">';
          } else if (r.receipt) {
            bodyHtml += '<div class="detail-row"><span class="detail-label">凭证</span><span class="detail-value" style="font-size:.82rem">' + escapeHtml(r.receipt) + '</span></div>';
          }
          document.getElementById('detailBody').innerHTML = bodyHtml;
          var detailModal = document.getElementById('detailModal');
          detailModal.classList.add('active');
          detailModal.setAttribute('aria-hidden', 'false');
        }
      });
      document.getElementById('closePreview').addEventListener('click', function() {
        var modal = document.getElementById('imagePreviewModal');
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
      });
      document.getElementById('imagePreviewModal').addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
          this.setAttribute('aria-hidden', 'true');
        }
      });
      document.getElementById('closeDetail').addEventListener('click', function() {
        var modal = document.getElementById('detailModal');
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
      });
      document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
          this.setAttribute('aria-hidden', 'true');
        }
      });

      // 工具函数
      function formatNum(n) {
        return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      function formatDate(d) {
        if (!d) return '';
        var dt = new Date(d);
        if (isNaN(dt.getTime())) return d;
        var pad = function(n) { return n < 10 ? '0' + n : n; };
        return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
      }
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(s));
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
