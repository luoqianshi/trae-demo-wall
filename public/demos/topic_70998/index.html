<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>办得成 —— AI 政务服务"疑难杂症"智能兜底系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: #f0f5ff;
    }
    
    .chat-container {
      height: calc(100vh - 180px);
      overflow-y: auto;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .typing-indicator span {
      animation: typing 1.4s infinite ease-in-out both;
    }
    
    .typing-indicator span:nth-child(1) {
      animation-delay: -0.32s;
    }
    
    .typing-indicator span:nth-child(2) {
      animation-delay: -0.16s;
    }
    
    @keyframes typing {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .slide-up {
      animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .step-line {
      position: absolute;
      left: 19px;
      top: 40px;
      bottom: -20px;
      width: 2px;
      background-color: #e5e7eb;
    }
    
    .step-line.active {
      background-color: #1677ff;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">
  <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-bold">办得成</h1>
      </div>
      <nav class="flex items-center gap-4">
        <button onclick="showPage('home')" class="nav-btn text-sm font-medium hover:bg-white/10 px-3 py-1.5 rounded-lg transition-colors active">
          <span class="flex items-center gap-1">
            <i data-lucide="message-circle" class="w-4 h-4"></i>
            智能咨询
          </span>
        </button>
        <button onclick="showPage('tickets')" class="nav-btn text-sm font-medium hover:bg-white/10 px-3 py-1.5 rounded-lg transition-colors">
          <span class="flex items-center gap-1">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            工单中心
          </span>
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1 overflow-hidden bg-gray-50">
    <div id="home-page" class="max-w-4xl mx-auto h-full flex flex-col">
      <div class="chat-container scrollbar-hide p-4 space-y-4" id="chat-container">
        <div class="flex justify-center py-4">
          <div class="bg-gray-200 text-gray-500 text-xs px-3 py-1 rounded-full">
            2026年7月4日
          </div>
        </div>
        
        <div class="flex items-start gap-3 fade-in">
          <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
            <i data-lucide="bot" class="w-5 h-5 text-blue-600"></i>
          </div>
          <div class="bg-white rounded-2xl rounded-tl-none px-4 py-3 shadow-sm max-w-[85%]">
            <p class="text-sm leading-relaxed">
              您好！我是"办得成"智能助手，专门帮您解决政务服务中的"疑难杂症"。
            </p>
            <p class="text-sm leading-relaxed mt-2">
              请用自然语言描述您的问题，比如：
              <br>"我想办房产过户，但涉及离婚协议和继承公证"
              <br>"注册公司被要求提供奇怪的证明"
              <br>"在不同部门之间被踢皮球"
            </p>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 px-2">
          <button onclick="quickAsk('房产过户涉及离婚和继承')" class="bg-white border border-gray-200 rounded-xl p-3 text-left hover:border-blue-300 hover:shadow-sm transition-all">
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="home" class="w-4 h-4 text-orange-500"></i>
              <span class="text-sm font-medium text-gray-800">房产过户难题</span>
            </div>
            <p class="text-xs text-gray-500">涉及离婚协议、继承公证等</p>
          </button>
          <button onclick="quickAsk('注册公司被要求提供奇葩证明')" class="bg-white border border-gray-200 rounded-xl p-3 text-left hover:border-blue-300 hover:shadow-sm transition-all">
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="building" class="w-4 h-4 text-blue-500"></i>
              <span class="text-sm font-medium text-gray-800">企业注册问题</span>
            </div>
            <p class="text-xs text-gray-500">被要求提供不合理证明</p>
          </button>
          <button onclick="quickAsk('办营业执照被工商和税务踢皮球')" class="bg-white border border-gray-200 rounded-xl p-3 text-left hover:border-blue-300 hover:shadow-sm transition-all">
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="users" class="w-4 h-4 text-green-500"></i>
              <span class="text-sm font-medium text-gray-800">跨部门协调</span>
            </div>
            <p class="text-xs text-gray-500">多部门之间推诿扯皮</p>
          </button>
          <button onclick="quickAsk('社保转移遇到困难')" class="bg-white border border-gray-200 rounded-xl p-3 text-left hover:border-blue-300 hover:shadow-sm transition-all">
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="heart-pulse" class="w-4 h-4 text-red-500"></i>
              <span class="text-sm font-medium text-gray-800">社保医保问题</span>
            </div>
            <p class="text-xs text-gray-500">转移、补缴等复杂情况</p>
          </button>
        </div>
      </div>
      
      <div class="p-4 bg-white border-t border-gray-100">
        <div class="flex items-end gap-2">
          <div class="flex-1 bg-gray-100 rounded-2xl px-4 py-2.5 flex items-center">
            <textarea id="user-input" rows="1" placeholder="请描述您遇到的政务办理难题..." 
              class="flex-1 bg-transparent border-none outline-none resize-none text-sm max-h-24 py-1"
              oninput="autoResize(this)"
              onkeydown="handleKeydown(event)"></textarea>
          </div>
          <button onclick="sendMessage()" class="w-10 h-10 bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white shadow-md hover:shadow-lg transition-all active:scale-95">
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </div>
        <p class="text-xs text-gray-400 text-center mt-2">
          您的描述越详细，我越能精准帮您找到解决方案
        </p>
      </div>
    </div>

    <div id="tickets-page" class="max-w-4xl mx-auto h-full flex flex-col hidden">
      <div class="p-4">
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-4 mb-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
              <i data-lucide="clipboard-list" class="w-6 h-6 text-blue-600"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold text-gray-800">我的工单</h2>
              <p class="text-sm text-gray-500">查看提交的预审工单处理进度</p>
            </div>
          </div>
        </div>
        
        <div class="flex gap-2 mb-4">
          <button onclick="filterTickets('all')" class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">全部</button>
          <button onclick="filterTickets('pending')" class="filter-btn px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium">待处理</button>
          <button onclick="filterTickets('processing')" class="filter-btn px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium">处理中</button>
          <button onclick="filterTickets('resolved')" class="filter-btn px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium">已解决</button>
        </div>
        
        <div id="ticket-list" class="space-y-3">
        </div>
        
        <div id="empty-tickets" class="text-center py-12 hidden">
          <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="inbox" class="w-8 h-8 text-gray-400"></i>
          </div>
          <p class="text-gray-500">暂无工单记录</p>
          <p class="text-sm text-gray-400 mt-1">在智能咨询中遇到无法解决的问题时，可提交工单</p>
          <button onclick="showPage('home')" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
            去咨询
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in">
    </div>
  </div>

  <script>
    let messages = [];
    let tickets = [];
    let currentFilter = 'all';

    const mockPolicies = [
      {
        title: '不动产登记暂行条例实施细则',
        article: '第十四条 因继承、受遗赠取得不动产，当事人申请登记的，应当提交死亡证明材料、遗嘱或者全部法定继承人关于不动产分配的协议以及与被继承人的亲属关系材料等，也可以提交经公证的材料或者生效的法律文书。',
        source: '自然资源部'
      },
      {
        title: '关于简化企业开办环节的意见',
        article: '取消企业开办过程中要求提供的各类"奇葩证明"，推行告知承诺制，申请人承诺符合相关条件并提交有关材料的，市场监管部门应当予以办理。',
        source: '国务院办公厅'
      },
      {
        title: '国务院关于取消一批行政许可等事项的决定',
        article: '取消"无违法记录证明"等11项证明事项，改为申请人书面承诺，相关部门通过数据共享等方式进行核验。',
        source: '国务院'
      }
    ];

    const mockResponses = {
      '房产': {
        cardPoint: '您的情况涉及多重法律关系叠加，主要卡点在于：离婚财产分割协议的效力认定、继承公证的法定顺序、拆迁安置协议与房产过户的衔接。这些环节需要依次处理，不可同时进行。',
        policies: [mockPolicies[0]],
        roadmap: [
          { title: '继承公证办理', description: '先到公证处办理继承公证，确定房产继承人', location: '市公证处', time: '3-5个工作日', materials: ['死亡证明', '亲属关系证明', '房产证'] },
          { title: '离婚财产分割', description: '凭继承公证书和离婚协议到法院确认分割方案', location: '区人民法院', time: '15-30个工作日', materials: ['离婚协议书', '法院判决书'] },
          { title: '不动产过户', description: '携带所有材料到不动产登记中心办理过户', location: '市不动产登记中心', time: '5个工作日', materials: ['继承公证书', '法院判决书', '身份证'] }
        ],
        materials: [
          { name: '死亡证明', required: true, tips: '医院出具或派出所注销证明' },
          { name: '亲属关系证明', required: true, tips: '居委会或单位出具' },
          { name: '房产证', required: true, tips: '原件' },
          { name: '离婚协议书', required: true, tips: '民政局备案版本' },
          { name: '身份证', required: true, tips: '所有继承人身份证' }
        ],
        needHuman: false
      },
      '公司': {
        cardPoint: '您遇到的"奇葩证明"问题，实际上该证明已被国务院明确取消。窗口工作人员可能不了解最新政策，导致要求您提供已取消的证明材料。',
        policies: [mockPolicies[1], mockPolicies[2]],
        roadmap: [
          { title: '政策告知', description: '向窗口出示国务院取消该证明的文件', location: '市市场监管局', time: '1个工作日', materials: ['政策文件截图'] },
          { title: '书面承诺', description: '签署告知承诺书，承诺无违法记录', location: '市市场监管局', time: '当场', materials: ['告知承诺书'] },
          { title: '领取执照', description: '完成其他材料审核后领取营业执照', location: '市市场监管局', time: '3个工作日', materials: ['申请表', '身份证'] }
        ],
        materials: [
          { name: '政策文件截图', required: false, tips: '可在国务院官网下载' },
          { name: '告知承诺书', required: true, tips: '窗口提供' },
          { name: '身份证', required: true, tips: '法人身份证原件' },
          { name: '公司章程', required: true, tips: '全体股东签字' }
        ],
        needHuman: false
      },
      '踢皮球': {
        cardPoint: '工商部门负责营业执照登记，税务部门负责税务登记和纳税申报。两个部门职责清晰，但在"三证合一"后，信息应自动共享。您的问题可能是信息共享不及时或窗口人员不熟悉流程。',
        policies: [mockPolicies[1]],
        roadmap: [
          { title: '确认营业执照状态', description: '先到工商部门确认营业执照是否已颁发', location: '市市场监管局', time: '1个工作日', materials: ['身份证'] },
          { title: '查询税务登记', description: '到税务部门查询是否已自动完成税务登记', location: '市税务局', time: '1个工作日', materials: ['营业执照'] },
          { title: '补录信息', description: '如未自动登记，现场补录税务信息', location: '市税务局', time: '当场', materials: ['营业执照', '法人身份证'] }
        ],
        materials: [
          { name: '身份证', required: true, tips: '法人身份证原件' },
          { name: '营业执照', required: true, tips: '原件或电子营业执照' }
        ],
        needHuman: true
      },
      '社保': {
        cardPoint: '社保转移涉及原参保地和现参保地两个社保经办机构，主要卡点在于：缴费记录是否完整、转移接续手续是否齐全、两地政策差异的协调。',
        policies: [],
        roadmap: [
          { title: '开具参保缴费凭证', description: '到原参保地社保中心开具缴费凭证', location: '原参保地社保局', time: '1个工作日', materials: ['身份证', '社保卡'] },
          { title: '提交转移申请', description: '向现参保地社保中心提交转移申请', location: '现参保地社保局', time: '1个工作日', materials: ['缴费凭证', '身份证'] },
          { title: '等待审核', description: '社保中心进行审核和转移', location: '社保局', time: '15-45个工作日', materials: [] }
        ],
        materials: [
          { name: '身份证', required: true, tips: '原件' },
          { name: '社保卡', required: true, tips: '原参保地社保卡' },
          { name: '缴费凭证', required: true, tips: '原参保地开具' }
        ],
        needHuman: false
      },
      'default': {
        cardPoint: '根据您的描述，我们初步分析您的问题可能涉及以下方面：材料准备不齐全、流程不熟悉、跨部门协调困难。请您提供更多细节，以便我们给出更精准的解决方案。',
        policies: [],
        roadmap: [
          { title: '详细描述问题', description: '请您提供更详细的办理情况', location: '在线咨询', time: '即时', materials: [] },
          { title: '材料梳理', description: '根据您的情况梳理所需材料', location: '在线咨询', time: '即时', materials: [] },
          { title: '办理指导', description: '提供详细的办理步骤和地点', location: '在线咨询', time: '即时', materials: [] }
        ],
        materials: [],
        needHuman: true
      }
    };

    function getResponse(userInput) {
      if (userInput.includes('房产') || userInput.includes('过户') || userInput.includes('继承') || userInput.includes('离婚')) {
        return mockResponses['房产'];
      }
      if (userInput.includes('公司') || userInput.includes('注册') || userInput.includes('证明')) {
        return mockResponses['公司'];
      }
      if (userInput.includes('工商') || userInput.includes('税务') || userInput.includes('踢皮球')) {
        return mockResponses['踢皮球'];
      }
      if (userInput.includes('社保') || userInput.includes('医保') || userInput.includes('转移')) {
        return mockResponses['社保'];
      }
      return mockResponses['default'];
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 96) + 'px';
    }

    function handleKeydown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function quickAsk(text) {
      document.getElementById('user-input').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      
      if (!text) return;
      
      input.value = '';
      input.style.height = 'auto';
      
      addMessage('user', text);
      
      const chatContainer = document.getElementById('chat-container');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'flex items-start gap-3 fade-in';
      typingDiv.innerHTML = `
        <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
          <i data-lucide="bot" class="w-5 h-5 text-blue-600"></i>
        </div>
        <div class="bg-white rounded-2xl rounded-tl-none px-4 py-3 shadow-sm">
          <div class="typing-indicator flex gap-1">
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
          </div>
        </div>
      `;
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      lucide.createIcons();
      
      await new Promise(resolve => setTimeout(resolve, 1500));
      
      chatContainer.removeChild(typingDiv);
      
      const response = getResponse(text);
      addMessage('bot', response);
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addMessage(type, content) {
      const chatContainer = document.getElementById('chat-container');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'flex items-start gap-3 fade-in';
      
      if (type === 'user') {
        messageDiv.className += ' flex-row-reverse';
        messageDiv.innerHTML = `
          <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
            <i data-lucide="user" class="w-5 h-5 text-white"></i>
          </div>
          <div class="bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-3 shadow-sm max-w-[85%]">
            <p class="text-sm leading-relaxed">${escapeHtml(content)}</p>
          </div>
        `;
      } else {
        messageDiv.innerHTML = generateBotResponse(content);
      }
      
      chatContainer.appendChild(messageDiv);
      lucide.createIcons();
    }

    function generateBotResponse(data) {
      let html = `
        <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
          <i data-lucide="bot" class="w-5 h-5 text-blue-600"></i>
        </div>
        <div class="bg-white rounded-2xl rounded-tl-none px-4 py-3 shadow-sm max-w-[90%]">
          <div class="space-y-4">
            <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded-r-lg">
              <div class="flex items-center gap-2 mb-1">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-red-500"></i>
                <span class="text-sm font-semibold text-red-700">卡点分析</span>
              </div>
              <p class="text-sm text-gray-700">${escapeHtml(data.cardPoint)}</p>
            </div>
      `;
      
      if (data.policies && data.policies.length > 0) {
        html += `
          <div>
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="file-search" class="w-4 h-4 text-blue-600"></i>
              <span class="text-sm font-semibold text-gray-800">政策匹配</span>
            </div>
            <div class="space-y-2">
        `;
        data.policies.forEach(policy => {
          html += `
            <div class="bg-blue-50 rounded-lg p-3">
              <p class="text-xs font-medium text-blue-800 mb-1">${escapeHtml(policy.title)}</p>
              <p class="text-sm text-blue-900">${escapeHtml(policy.article)}</p>
              <p class="text-xs text-blue-600 mt-1">来源：${escapeHtml(policy.source)}</p>
            </div>
          `;
        });
        html += `</div></div>`;
      }
      
      html += `
        <div>
          <div class="flex items-center gap-2 mb-2">
            <i data-lucide="map" class="w-4 h-4 text-green-600"></i>
            <span class="text-sm font-semibold text-gray-800">办成路线图</span>
          </div>
          <div class="relative pl-2">
      `;
      
      data.roadmap.forEach((step, index) => {
        const isLast = index === data.roadmap.length - 1;
        html += `
          <div class="relative flex gap-3 mb-4 ${isLast ? 'mb-0' : ''}">
            <div class="${!isLast ? 'step-line' : ''}"></div>
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0 text-white font-bold text-sm z-10">
              ${index + 1}
            </div>
            <div class="flex-1 pb-2">
              <h4 class="text-sm font-semibold text-gray-800">${escapeHtml(step.title)}</h4>
              <p class="text-sm text-gray-600 mt-0.5">${escapeHtml(step.description)}</p>
              <div class="flex items-center gap-3 mt-2 text-xs text-gray-500">
                <span class="flex items-center gap-1">
                  <i data-lucide="map-pin" class="w-3 h-3"></i>
                  ${escapeHtml(step.location)}
                </span>
                <span class="flex items-center gap-1">
                  <i data-lucide="clock" class="w-3 h-3"></i>
                  ${escapeHtml(step.time)}
                </span>
              </div>
              ${step.materials.length > 0 ? `
                <div class="mt-2 flex flex-wrap gap-1">
                  ${step.materials.map(m => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded">${escapeHtml(m)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });
      
      html += `</div></div>`;
      
      if (data.materials && data.materials.length > 0) {
        html += `
          <div>
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="clipboard-check" class="w-4 h-4 text-purple-600"></i>
              <span class="text-sm font-semibold text-gray-800">材料清单</span>
            </div>
            <div class="space-y-2">
              ${data.materials.map(m => `
                <div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg">
                  <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  <div class="flex-1">
                    <p class="text-sm text-gray-800">${escapeHtml(m.name)} ${m.required ? '<span class="text-red-500 text-xs">(必选)</span>' : ''}</p>
                    ${m.tips ? `<p class="text-xs text-gray-500">${escapeHtml(m.tips)}</p>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      
      if (data.needHuman) {
        html += `
          <div class="bg-orange-50 border border-orange-200 rounded-lg p-3">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="handshake" class="w-4 h-4 text-orange-600"></i>
              <span class="text-sm font-semibold text-orange-800">需要人工协调</span>
            </div>
            <p class="text-sm text-orange-700 mb-3">您的情况较为复杂，需要跨部门协调处理。</p>
            <button onclick="createTicket()" class="w-full py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-lg text-sm font-medium transition-colors">
              提交预审工单
            </button>
          </div>
        `;
      } else {
        html += `
          <div class="bg-green-50 border border-green-200 rounded-lg p-3">
            <div class="flex items-center gap-2">
              <i data-lucide="check-circle" class="w-4 h-4 text-green-600"></i>
              <span class="text-sm font-semibold text-green-800">问题已解决</span>
              <p class="text-sm text-green-700 ml-2">按照路线图操作即可完成办理</p>
            </div>
          </div>
        `;
      }
      
      html += `</div></div>`;
      
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showPage(page) {
      document.getElementById('home-page').classList.add('hidden');
      document.getElementById('tickets-page').classList.add('hidden');
      document.getElementById(page + '-page').classList.remove('hidden');
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active', 'bg-white/10'));
      event.target.classList.add('active', 'bg-white/10');
      
      if (page === 'tickets') {
        renderTickets();
      }
    }

    function createTicket() {
      const ticket = {
        id: 'T' + Date.now(),
        description: messages[messages.length - 1]?.content || '用户咨询政务办理问题',
        cardPoint: messages[messages.length - 1]?.content?.cardPoint || '需要跨部门协调',
        priority: 'medium',
        status: 'pending',
        createdAt: new Date().toLocaleString('zh-CN'),
        updatedAt: new Date().toLocaleString('zh-CN')
      };
      
      tickets.unshift(ticket);
      
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      
      content.innerHTML = `
        <div class="p-6">
          <div class="text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="check-circle" class="w-8 h-8 text-green-600"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">工单提交成功</h3>
            <p class="text-sm text-gray-600 mb-4">您的预审工单已提交，工作人员将在1个工作日内联系您。</p>
            <div class="bg-gray-50 rounded-lg p-4 text-left mb-4">
              <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-500">工单编号</span>
                <span class="font-mono font-medium text-blue-600">${ticket.id}</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">提交时间</span>
                <span class="text-gray-800">${ticket.createdAt}</span>
              </div>
            </div>
            <button onclick="closeModal(); showPage('tickets')" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
              查看工单
            </button>
          </div>
        </div>
      `;
      
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function renderTickets() {
      const container = document.getElementById('ticket-list');
      const empty = document.getElementById('empty-tickets');
      
      const filtered = tickets.filter(t => currentFilter === 'all' || t.status === currentFilter);
      
      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      
      empty.classList.add('hidden');
      
      container.innerHTML = filtered.map(ticket => `
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="font-mono text-sm font-medium text-blue-600">${ticket.id}</span>
              <span class="px-2 py-0.5 text-xs rounded-full ${getStatusStyle(ticket.status)}">${getStatusText(ticket.status)}</span>
              <span class="px-2 py-0.5 text-xs rounded-full ${getPriorityStyle(ticket.priority)}">${getPriorityText(ticket.priority)}</span>
            </div>
            <span class="text-xs text-gray-400">${ticket.createdAt}</span>
          </div>
          <p class="text-sm text-gray-800 mb-2 line-clamp-2">${escapeHtml(ticket.description)}</p>
          <div class="flex items-center gap-2 text-xs text-gray-500">
            <i data-lucide="alert-circle" class="w-3 h-3"></i>
            <span class="truncate max-w-[200px]">${escapeHtml(ticket.cardPoint)}</span>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function filterTickets(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-gray-100', 'text-gray-600');
      });
      event.target.classList.remove('bg-gray-100', 'text-gray-600');
      event.target.classList.add('bg-blue-600', 'text-white');
      renderTickets();
    }

    function getStatusStyle(status) {
      switch(status) {
        case 'pending': return 'bg-yellow-100 text-yellow-700';
        case 'processing': return 'bg-blue-100 text-blue-700';
        case 'resolved': return 'bg-green-100 text-green-700';
        default: return 'bg-gray-100 text-gray-700';
      }
    }

    function getStatusText(status) {
      switch(status) {
        case 'pending': return '待处理';
        case 'processing': return '处理中';
        case 'resolved': return '已解决';
        default: return status;
      }
    }

    function getPriorityStyle(priority) {
      switch(priority) {
        case 'high': return 'bg-red-100 text-red-700';
        case 'medium': return 'bg-orange-100 text-orange-700';
        case 'low': return 'bg-gray-100 text-gray-700';
        default: return 'bg-gray-100 text-gray-700';
      }
    }

    function getPriorityText(priority) {
      switch(priority) {
        case 'high': return '紧急';
        case 'medium': return '中等';
        case 'low': return '一般';
        default: return priority;
      }
    }

    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) {
        closeModal();
      }
    });

    tickets = [
      {
        id: 'T1719200000000',
        description: '办营业执照被工商和税务踢皮球',
        cardPoint: '工商部门和税务部门职责边界不清，信息共享不及时',
        priority: 'high',
        status: 'processing',
        createdAt: '2026/7/3 14:30:00',
        updatedAt: '2026/7/3 16:00:00'
      },
      {
        id: 'T1719100000000',
        description: '社保转移遇到困难，原单位不配合',
        cardPoint: '原单位拒绝提供离职证明，导致社保转移手续无法办理',
        priority: 'medium',
        status: 'resolved',
        createdAt: '2026/7/2 10:15:00',
        updatedAt: '2026/7/2 15:30:00'
      }
    ];

    lucide.createIcons();
  </script>
</body>
</html>
