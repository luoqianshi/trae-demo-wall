<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小满的夜灯 · 初赛 Demo</title>
<style>
:root {
  --ink:         #0e1626;
  --ink-2:       #13203a;
  --bubble-in:   #1b2742;
  --bubble-me:   #3a2e1a;
  --card:        #1b2742;
  --glow:        #ffd592;
  --glow-strong: #ffb65c;
  --milk:        #fff6e6;
  --milkgreen:   #bfe3c8;
  --rose:        #f6b9c6;
  --rose-deep:   #e88aa0;
  --text:        #f3ede0;
  --text-dim:    #b9c2d6;
  --r:           22px;
  --r-sm:        14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
body { background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a0f1a 50%, #050810 100%); display: flex; justify-content: center; align-items: center; overflow: hidden; }

.phone-frame {
  width: 390px;
  height: 844px;
  background: #0a0a0a;
  border-radius: 44px;
  padding: 12px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  position: relative;
}

.phone-inner {
  width: 100%;
  height: 100%;
  background: var(--ink);
  border-radius: 34px;
  overflow: hidden;
  position: relative;
}

.status-bar {
  height: 54px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.demo-badge {
  position: absolute;
  top: 56px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,213,146,.15);
  border: 1px solid rgba(255,213,146,.3);
  color: var(--glow);
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 100px;
  z-index: 100;
  pointer-events: none;
}

.main-screen {
  height: calc(100% - 54px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.group-header {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.group-info { display: flex; align-items: center; gap: 12px; }
.group-name { font-size: 16px; font-weight: 600; color: var(--text); }
.group-avatars { display: flex; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  position: relative;
  cursor: pointer;
  transition: transform .2s;
}
.avatar:hover { transform: scale(1.1); }
.avatar + .avatar { margin-left: -8px; }

.member-tooltip {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink-2);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--r-sm);
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  margin-top: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 100;
}
.member-tooltip::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 6px solid var(--ink-2);
}
.avatar:hover .member-tooltip,
.avatar-lamp:hover .member-tooltip {
  opacity: 1;
}

.avatar-mom { background: linear-gradient(135deg, #ffc0cb 0%, #ff69b4 100%); }
.avatar-dad { background: linear-gradient(135deg, #87ceeb 0%, #4169e1 100%); }
.avatar-grandma { background: linear-gradient(135deg, #dda0dd 0%, #9932cc 100%); }
.avatar-nanny { background: linear-gradient(135deg, #98fb98 0%, #32cd32 100%); }

.avatar-lamp {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  position: relative;
  cursor: pointer;
  transition: transform .2s;
}
.avatar-lamp:hover { transform: scale(1.1); }
.avatar-lamp::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 20px;
  height: 20px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--glow) 0%, rgba(255,213,146,.6) 40%, rgba(255,213,146,.2) 70%, transparent 100%);
  border-radius: 50%;
  animation: breathe 3s ease-in-out infinite;
}
.avatar-lamp::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 4px;
  background: rgba(255,255,255,.2);
  border-radius: 2px;
}

@keyframes breathe {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .8; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
}

.header-more {
  width: 32px;
  height: 32px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text-dim);
  font-size: 18px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 160px;
}

.chat-area::-webkit-scrollbar { display: none; }

.message-time {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  margin: 16px 0;
}

.message {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  opacity: 0;
  transform: translateY(8px);
  animation: msgFadeIn 200ms ease forwards;
}

@keyframes msgFadeIn {
  to { opacity: 1; transform: translateY(0); }
}

.message.me { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
}

.msg-content { max-width: 78%; }

.msg-name {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
  padding-left: 4px;
}
.message.me .msg-name { text-align: right; padding-right: 4px; }

.msg-time {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
  padding-left: 4px;
}
.message.me .msg-time { text-align: right; padding-right: 4px; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.5;
  position: relative;
}

.message:not(.me) .msg-bubble {
  background: var(--bubble-in);
  color: var(--text);
  border-bottom-left-radius: 6px;
}

.message.me .msg-bubble {
  background: var(--bubble-me);
  color: var(--glow);
  border-bottom-right-radius: 6px;
}

.msg-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 16px;
  color: var(--text);
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
  margin-bottom: 4px;
}

.msg-typing {
  background: var(--bubble-in);
  border-radius: 18px;
  padding: 10px 14px;
  border-bottom-left-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.typing-dot {
  width: 6px;
  height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: typing 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }

@keyframes typing {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

.chat-input-area {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(14,22,38,.98);
  backdrop-filter: blur(20px);
  padding: 8px 16px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(255,255,255,.05);
}

.quick-commands {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.quick-commands::-webkit-scrollbar { display: none; }

.quick-command {
  flex-shrink: 0;
  padding: 6px 12px;
  background: rgba(255,213,146,.1);
  border: 1px solid rgba(255,213,146,.2);
  border-radius: 100px;
  color: var(--glow);
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
.quick-command:active { transform: scale(.96); background: rgba(255,213,146,.2); }

.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-box {
  flex: 1;
  background: var(--ink-2);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text);
  border: none;
  outline: none;
}
.input-box::placeholder { color: var(--text-dim); }

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--glow) 0%, var(--glow-strong) 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  transition: transform .2s;
}
.send-btn:active { transform: scale(.9); }



.photo-message {
  background: #fff;
  border-radius: var(--r-sm);
  padding: 16px;
  transform: rotate(-1.5deg);
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}

.photo-table { width: 100%; }
.photo-table tr { border-bottom: 1px dashed #ddd; }
.photo-table tr:last-child { border-bottom: none; }
.photo-table td {
  padding: 8px 4px;
  font-size: 13px;
  color: #333;
  font-family: 'Courier New', monospace;
}

.scan-overlay {
  position: relative;
  overflow: hidden;
}

.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  box-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow);
  animation: scanDown 1.2s ease-in-out forwards;
}

@keyframes scanDown {
  from { top: 0; opacity: 1; }
  to { top: 100%; opacity: 0; }
}

.receipt-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
}

.receipt-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--glow);
  margin-bottom: 12px;
}

.receipt-items { display: flex; flex-direction: column; gap: 8px; }

.receipt-item {
  padding: 8px 12px;
  background: rgba(255,255,255,.05);
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--text);
  opacity: 0;
  transform: translateY(8px);
}

.receipt-item.dup-highlight {
  background: rgba(255,182,92,.2);
  border: 1px solid rgba(255,182,92,.4);
}

.receipt-item.show {
  animation: itemStagger 300ms ease forwards;
}

@keyframes itemStagger {
  to { opacity: 1; transform: translateY(0); }
}

.dup-label {
  font-size: 11px;
  color: var(--glow-strong);
  margin-top: 4px;
  padding-left: 4px;
}

.merge-container {
  position: relative;
  height: 44px;
  display: flex;
  gap: 4px;
}

.merge-item {
  flex: 1;
  padding: 8px 10px;
  background: rgba(255,182,92,.2);
  border: 1px solid rgba(255,182,92,.4);
  border-radius: var(--r-sm);
  font-size: 12px;
  color: var(--text);
  transform: scale(1);
}

.merge-item.a { transform: translateX(-10px); opacity: .8; }
.merge-item.b { transform: translateX(10px); opacity: .8; }

.merge-container.merging .merge-item.a {
  animation: mergeLeftToCenter 600ms ease forwards;
}

.merge-container.merging .merge-item.b {
  animation: mergeRightToCenter 600ms ease forwards;
}

@keyframes mergeLeftToCenter {
  0% { transform: translateX(-10px); opacity: .8; }
  50% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(0) scale(1); opacity: 0; }
}

@keyframes mergeRightToCenter {
  0% { transform: translateX(10px); opacity: .8; }
  50% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(0) scale(1); opacity: 0; }
}

.badge-6tables {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(255,213,146,.15);
  border: 1px solid rgba(255,213,146,.3);
  border-radius: 100px;
  color: var(--glow);
  font-size: 12px;
  margin-top: 12px;
  opacity: 0;
}

.badge-6tables.pulse {
  animation: badgePulse 600ms ease forwards;
}

@keyframes badgePulse {
  0% { opacity: 0; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 20px var(--glow); }
  100% { opacity: 1; transform: scale(1); }
}

.daily-report-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
}

.report-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.report-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--glow);
}

.day-display {
  font-size: 13px;
  color: var(--text-dim);
}

.day-slider-container { margin-bottom: 16px; }

.day-slider {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--ink-2);
  border-radius: 3px;
  outline: none;
}

.day-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, rgba(255,213,146,.6) 60%, transparent 100%);
  cursor: pointer;
  box-shadow: 0 0 12px var(--glow);
}

.day-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, rgba(255,213,146,.6) 60%, transparent 100%);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 12px var(--glow);
}

.knowledge-card {
  background: rgba(255,255,255,.05);
  border-radius: var(--r-sm);
  padding: 12px;
  margin-bottom: 12px;
}

.knowledge-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.knowledge-dim {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border: 1px solid rgba(255,213,146,.3);
  border-radius: 100px;
  font-size: 11px;
  color: var(--glow);
}

.knowledge-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 100px;
}

.knowledge-tag.evidence {
  background: rgba(191,227,200,.2);
  color: #6a9a7a;
}

.knowledge-tag.rumor {
  background: rgba(255,213,146,.2);
  color: #8a6a3a;
}

.knowledge-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.knowledge-text {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}

.summary-row {
  font-size: 13px;
  color: var(--text-dim);
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.05);
  border-bottom: 1px solid rgba(255,255,255,.05);
  margin-bottom: 12px;
}

.echo-bar {
  background: rgba(246,185,198,.15);
  border: 1px solid rgba(246,185,198,.3);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 300ms ease;
  overflow: hidden;
  max-height: 60px;
}

.echo-bar.hidden {
  opacity: 0;
  max-height: 0;
  padding: 0;
}

.echo-photo {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}

.echo-text {
  font-size: 12px;
  color: var(--rose);
  flex: 1;
}

.emergency-card {
  background: rgba(255,182,92,.1);
  border: 2px solid var(--glow-strong);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
}

.emergency-card.pulsing {
  animation: emergencyPulse 2s ease-in-out infinite;
}

@keyframes emergencyPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255,182,92,.3); }
  50% { box-shadow: 0 0 40px rgba(255,182,92,.6); }
}

.emergency-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--glow-strong);
  margin-bottom: 12px;
}

.countdown {
  font-size: 36px;
  font-weight: 700;
  color: var(--glow-strong);
  font-variant-numeric: tabular-nums;
  text-align: center;
  margin-bottom: 8px;
}

.countdown-label {
  font-size: 13px;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 12px;
}

.emergency-note {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 16px;
  padding: 8px;
  background: rgba(0,0,0,.2);
  border-radius: var(--r-sm);
}

.emergency-buttons {
  display: flex;
  gap: 10px;
}

.emergency-btn {
  flex: 1;
  padding: 10px;
  border-radius: var(--r-sm);
  border: none;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}

.emergency-btn.reset {
  background: var(--ink-2);
  color: var(--text);
}

.emergency-btn.forward {
  background: rgba(255,182,92,.2);
  color: var(--glow-strong);
  border: 1px solid rgba(255,182,92,.4);
}

.emergency-btn:active { transform: scale(.96); }

.safety-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
}

.safety-title {
  font-size: 14px;
  font-weight: 600;
  color: #ff6b6b;
  margin-bottom: 12px;
}

.safety-item {
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 10px;
}

.safety-item strong { color: #ff6b6b; }

.safety-footer {
  font-size: 11px;
  color: var(--text-dim);
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,.05);
}

.searching-bar {
  background: var(--bubble-in);
  border-radius: 18px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-dim);
  border-bottom-left-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.album-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 16px;
  color: var(--text);
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
}

.album-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--rose);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.album-timeline-scroll {
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 16px;
}
.album-timeline-scroll::-webkit-scrollbar { display: none; }

.album-timeline-track {
  display: flex;
  gap: 12px;
  padding: 4px;
}

.album-timeline-item {
  flex-shrink: 0;
  width: 80px;
  background: var(--ink-2);
  border-radius: var(--r-sm);
  padding: 10px 6px;
  text-align: center;
  border: 1px solid rgba(246,185,198,.2);
}

.album-timeline-photo {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  margin: 0 auto 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

.album-timeline-day {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 3px;
}

.album-timeline-note {
  font-size: 10px;
  color: var(--rose);
  line-height: 1.4;
}

.album-narrative-card {
  background: linear-gradient(180deg, #fffbf0 0%, #fdf8e8 100%);
  border-radius: var(--r-sm);
  padding: 16px;
  position: relative;
}

.album-narrative-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--rose), transparent);
}

.album-narrative-header {
  font-size: 14px;
  font-weight: 600;
  color: #5c4a3a;
  margin-bottom: 8px;
}

.album-narrative-text {
  font-size: 13px;
  color: #4a3a2a;
  line-height: 1.6;
  margin-bottom: 8px;
}

.album-narrative-footer {
  font-size: 11px;
  color: #8a7a6a;
  font-style: italic;
}

@media (max-width: 430px) {
  .phone-frame {
    width: 100%;
    height: 100%;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }

function scrollToBottom() {

function appendTime(time) {
  if (time && time !== lastTime) {

    chatArea.appendChild(timeEl);
    lastTime = time;

  let itemsHtml = '';

    if (item.dup) {
      itemsHtml += `
        <div class="merge-container" id="mergeContainer">
          <div class="merge-item a">${item.text}</div>
          <div class="merge-item b">${item.text}</div>
        </div>
        <div class="dup-label" id="dupLabel">${item.dupLabel}</div>
      `;
    } else {
      itemsHtml += `<div class="receipt-item" data-index="${index}">${item.text}</div>`;
    }
  });
  
  const html = `
    <div class="receipt-card">
      <div class="receipt-title">📋 识别结果已整理</div>

  appendMessage('夜灯', html, 'card');
  
  setTimeout(() => {
    const items = document.querySelectorAll('.receipt-item');
    items.forEach((item, i) => {
      setTimeout(() => item.classList.add('show'), i * 150);
    });
    
    setTimeout(() => {
      const mergeContainer = document.getElementById('mergeContainer');
      const dupLabel = document.getElementById('dupLabel');
      if (mergeContainer) {
        mergeContainer.classList.add('merging');
        setTimeout(() => {
          mergeContainer.style.height = '44px';
          mergeContainer.innerHTML = `<div class="receipt-item show dup-highlight">${receiptData[1].text}</div>`;
          if (dupLabel) dupLabel.style.display = 'block';
        }, 600);
      }
    }, 450);
    
    setTimeout(() => {
      const badge = document.getElementById('badge6Tables');
      if (badge) badge.classList.add('pulse');
    }, 1500);
  }, 50);
}

function getSegment(day) {
  if (day <= 90) return 'seg_1_90';
  if (day <= 180) return 'seg_91_180';
  return 'seg_181_365';
}

function getAgeText(day) {
  if (day < 30) return `${day}天（新生儿期）`;
  const months = Math.floor(day / 30);
  return `${day}天（约${months}月龄）`;
}

function renderDailyReport(day = 60) {
  currentDay = day;
  const segment = getSegment(day);
  if (!knowledgeCardIndex[segment]) knowledgeCardIndex[segment] = 0;
  
  const cards = knowledgeCards[segment];
  const currentCard = cards[knowledgeCardIndex[segment]];
  knowledgeCardIndex[segment] = (knowledgeCardIndex[segment] + 1) % cards.length;
  
  const isWholeMonth = day % 30 === 0;
  const monthsAgo = day / 30;
  
  let tagClass = '';
  if (currentCard.tag.includes('循证')) tagClass = 'evidence';
  else if (currentCard.tag.includes('辟谣')) tagClass = 'rumor';
  
  const html = `

  appendMessage('夜灯', html, 'card');
}

function updateDailyReport(day) {
  currentDay = parseInt(day);

  const segment = getSegment(day);
  const cards = knowledgeCards[segment];

  const currentCard = cards[cardIndex];
  
  const isWholeMonth = day % 30 === 0;

  let tagClass = '';

  reportCard.innerHTML = `

        <span class="knowledge-dim">${currentCard.dim}</span>
        ${currentCard.tag ? `<span class="knowledge-tag ${tagClass}">${currentCard.tag}</span>` : ''}

      <div class="knowledge-title">${currentCard.title}</div>

    </div>
    <div class="summary-row">${summaryRows[segment]}</div>
    <div class="echo-bar ${isWholeMonth ? '' : 'hidden'}">
      <div class="echo-photo">👶</div>
      <div class="echo-text">📸 ${monthsAgo} 个月前的今天 · 那时的小满还只会攥着小拳头睡觉</div>

  `;
}

      <div class="countdown" id="countdown">${formatTime(emergencySeconds)}</div>
      <div class="countdown-label" id="countdownLabel">距离下次喂奶窗口还有</div>
      <div class="emergency-note">月嫂下班、老人轮班时开启，按上次喂奶时间 +3 小时提醒，防交接断档。</div>
      <div class="emergency-buttons">
        <button class="emergency-btn reset" onclick="resetEmergency()">模拟：刚喂完，重置</button>
        <button class="emergency-btn forward" onclick="forwardEmergency()">模拟快进到 30 分钟内</button>
      </div>
    </div>
  `;
  
  appendMessage('夜灯', html, 'card');
  
  emergencyInterval = setInterval(() => {
    emergencySeconds--;
    if (emergencySeconds <= 0) {
      clearInterval(emergencyInterval);
      return;
    }
    
    const countdownEl = document.getElementById('countdown');
    const labelEl = document.getElementById('countdownLabel');
    const cardEl = document.getElementById('emergencyCard');
    
    if (countdownEl) countdownEl.textContent = formatTime(emergencySeconds);
    
    if (emergencySeconds <= 30 * 60) {
      if (labelEl) labelEl.textContent = '⏰ 快到喂奶时间啦，提前备好温奶';
      if (cardEl) cardEl.classList.add('pulsing');
    } else {
      if (labelEl) labelEl.textContent = '距离下次喂奶窗口还有';
      if (cardEl) cardEl.classList.remove('pulsing');
    }
  }, 1000);
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function resetEmergency() {
  emergencySeconds = 3 * 3600;
  const countdownEl = document.getElementById('countdown');
  const labelEl = document.getElementById('countdownLabel');
  const cardEl = document.getElementById('emergencyCard');
  
  if (countdownEl) countdownEl.textContent = formatTime(emergencySeconds);
  if (labelEl) labelEl.textContent = '距离下次喂奶窗口还有';
  if (cardEl) cardEl.classList.remove('pulsing');
}

function forwardEmergency() {
  emergencySeconds = 29 * 60 + 59;
  const countdownEl = document.getElementById('countdown');
  const labelEl = document.getElementById('countdownLabel');
  const cardEl = document.getElementById('emergencyCard');
  
  if (countdownEl) countdownEl.textContent = formatTime(emergencySeconds);
  if (labelEl) labelEl.textContent = '⏰ 快到喂奶时间啦，提前备好温奶';
  if (cardEl) cardEl.classList.add('pulsing');
}

  timelineData.forEach((item, index) => {

}

function triggerFamilyReply(keyword) {
  const replies = familyReplies[keyword];
  if (replies && replies.length > 0) {
    const randomReply = replies[Math.floor(Math.random() * replies.length)];
    setTimeout(() => {
      appendMessage(randomReply.from, randomReply.text);
    }, 1500 + Math.random() * 1000);
  }
}

function handleChatInput(text) {
  text = text.trim();
  console.log('handleChatInput called with:', text);
  
  if (text.includes('拍照') || text.includes('拍张') || text.includes('月子记录')) {
    handlePhotoInteraction();
    triggerFamilyReply('拍照');
  } else if (text.includes('早报') || text.includes('育儿早报') || text.includes('今天的')) {
    handleReportInteraction();
    triggerFamilyReply('早报');
  } else if (text.includes('紧急') || text.includes('喂奶') || text.includes('倒计时')) {
    handleEmergencyInteraction();
    triggerFamilyReply('紧急');
  } else if (text.includes('噎到') || text.includes('怎么办') || text.includes('安全')) {
    renderSafety();
    triggerFamilyReply('噎到');
  } else if (text.includes('相册') || text.includes('成长') || text.includes('时间轴')) {
    renderAlbum();
    triggerFamilyReply('相册');
  } else if (text.includes('你好') || text.includes('嗨') || text.includes('哈喽')) {
    appendMessage('夜灯', '你好呀～我是小满的夜灯，有什么可以帮你的吗？');
    triggerFamilyReply('你好');
  } else if (text.includes('谢谢') || text.includes('感谢')) {
    appendMessage('夜灯', '不客气～随时可以找我哦 ✨');
  } else if (text.length > 0) {
    appendMessage('夜灯', '我不太明白你说的是什么呢，试试点击下方快捷指令吧～');
  }
}

}

    renderDailyReport();

function handleEmergencyInteraction() {
  appendMessage('夜灯', '好的，已为你开启紧急模式～');

    renderEmergency();

}

function sendMessage() {
  console.log('sendMessage called');
  console.log('chatInput:', chatInput);
  if (!chatInput) {
    chatInput = document.getElementById('chatInput');
    console.log('chatInput after re-get:', chatInput);
  }
  const text = chatInput.value.trim();
  console.log('text:', text);
  if (text) {
    appendMessage('我', text);
    chatInput.value = '';
    handleChatInput(text);
  }
}

function sendQuickCommand(text) {
  appendMessage('我', text);
  handleChatInput(text);
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    sendMessage();
  }
}

function init() {
  chatArea = document.getElementById('chatArea');
  chatInput = document.getElementById('chatInput');
  
  messagesData.forEach(msg => {
    appendMessage(msg.from, msg.text, msg.type, msg.time);
  });
  
  document.getElementById('lampAvatar').addEventListener('click', () => {
    appendMessage('我', '打开成长相册');
    renderAlbum();
    triggerFamilyReply('相册');
  });
  
  window.updateDailyReport = updateDailyReport;
  window.resetEmergency = resetEmergency;
  window.forwardEmergency = forwardEmergency;
  window.sendMessage = sendMessage;
  window.sendQuickCommand = sendQuickCommand;
  window.handleKeyPress = handleKeyPress;
}

document.addEventListener('DOMContentLoaded', init);
</script>
