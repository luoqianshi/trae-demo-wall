<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自学教练 · 刷题应用 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf8f5;
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #1e40af 100%);
            color: white;
            padding: 20px 20px 16px;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
            flex-shrink: 0;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            opacity: 0.95;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-correct {
            color: #86efac;
        }

        .stat-wrong {
            color: #fca5a5;
        }

        /* 模式切换栏 */
        .mode-tabs {
            background: white;
            padding: 12px 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .mode-tab {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            background: #f3f4f6;
            color: #6b7280;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .mode-tab::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .mode-tab:active::after {
            width: 200px;
            height: 200px;
        }

        .mode-tab:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        .mode-tab:active {
            transform: translateY(0);
        }

        .mode-tab.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .mode-tab.active::after {
            background: rgba(255,255,255,0.2);
        }

        /* 主内容区 */
        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 24px 20px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.8;
            flex-shrink: 0;
        }

        /* 题目卡片 */
        .question-card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @keyframes buttonPop {
            0% { transform: scale(1); }
            50% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        .btn-pop {
            animation: buttonPop 0.15s ease;
        }

        /* 进度条 */
        .progress-bar-container {
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* 题目头部 */
        .question-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .question-number {
            background: #2563eb;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .difficulty-basic {
            background: #dcfce7;
            color: #166534;
        }

        .difficulty-intermediate {
            background: #fef3c7;
            color: #92400e;
        }

        .difficulty-advanced {
            background: #fee2e2;
            color: #991b1b;
        }

        /* 题目文字 */
        .question-text {
            font-size: 17px;
            line-height: 1.7;
            color: #1f2937;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* 选项 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            color: #374151;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.5;
            width: 100%;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .option-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .option-btn:active::after {
            width: 500px;
            height: 500px;
        }

        .option-btn:hover:not(.disabled) {
            border-color: #93c5fd;
            background: #eff6ff;
            transform: translateX(4px);
        }

        .option-btn:active:not(.disabled) {
            transform: translateX(2px) scale(0.99);
        }

        .option-btn .option-label {
            font-weight: 700;
            color: #2563eb;
            flex-shrink: 0;
            width: 24px;
        }

        .option-btn.correct {
            border-color: #22c55e;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: #166534;
            animation: buttonPop 0.3s ease;
        }

        .option-btn.correct .option-label {
            color: #22c55e;
        }

        .option-btn.wrong {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            color: #991b1b;
        }

        .option-btn.wrong .option-label {
            color: #ef4444;
        }

        .option-btn.disabled {
            cursor: not-allowed;
        }

        .option-btn.selected {
            border-color: #93c5fd;
            background: #eff6ff;
        }

        /* 反馈区 */
        .feedback {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-left: 4px solid #22c55e;
        }

        .feedback.wrong {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border-left: 4px solid #ef4444;
        }

        .feedback-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback.correct .feedback-title {
            color: #166534;
        }

        .feedback.wrong .feedback-title {
            color: #991b1b;
        }

        .feedback-content {
            font-size: 14px;
            line-height: 1.6;
            color: #4b5563;
        }

        .correct-answer-text {
            font-weight: 600;
            color: #166534;
            margin-bottom: 6px;
        }

        /* 底部导航 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid #f3f4f6;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .nav-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .nav-btn:active::after {
            width: 200px;
            height: 200px;
        }

        .nav-btn.prev {
            background: #f3f4f6;
            color: #4b5563;
        }

        .nav-btn.prev:hover:not(:disabled) {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        .nav-btn.prev:active:not(:disabled) {
            transform: translateY(0);
        }

        .nav-btn.next {
            background: #2563eb;
            color: white;
        }

        .nav-btn.next:hover:not(:disabled) {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .nav-btn.next:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .progress-text {
            font-size: 14px;
            color: #6b7280;
        }

        /* 背题模式 */
        .memorize-card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .memorize-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .memorize-card:active {
            transform: translateY(-1px);
        }

        .memorize-card .question-text {
            margin-bottom: 16px;
        }

        .memorize-hint {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 12px;
        }

        .memorize-answer {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #22c55e;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .memorize-answer.show {
            display: block;
        }

        .memorize-answer-label {
            font-weight: 700;
            color: #166534;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .memorize-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .memorize-option {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fafb;
            color: #6b7280;
            transition: all 0.2s ease;
        }

        .memorize-option.correct {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: #166534;
            font-weight: 600;
        }

        .memorize-explanation {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.7;
            color: #4b5563;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .memorize-explanation.show {
            display: block;
        }

        /* 考试模式 */
        .exam-info {
            background: white;
            border-radius: 14px;
            padding: 20px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .exam-timer {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
            font-variant-numeric: tabular-nums;
        }

        .exam-timer.warning {
            color: #f59e0b;
            animation: pulse 1s infinite;
        }

        .exam-timer.danger {
            color: #ef4444;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .submit-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .submit-btn:active::after {
            width: 300px;
            height: 300px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.secondary {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            margin-left: 10px;
        }

        .submit-btn.secondary:hover {
            box-shadow: 0 6px 16px rgba(107, 114, 128, 0.35);
        }

        .submit-btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            margin-left: 10px;
        }

        .submit-btn.danger:hover {
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .exam-result {
            background: white;
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            text-align: center;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.3);
        }

        .score-circle.excellent {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
        }

        .score-circle.good {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }

        .score-circle.pass {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.3);
        }

        .score-circle.fail {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
        }

        .score-number {
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
        }

        .score-label {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .grade-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .grade-badge.excellent {
            background: #dcfce7;
            color: #166534;
        }

        .grade-badge.good {
            background: #dbeafe;
            color: #1e40af;
        }

        .grade-badge.pass {
            background: #fef3c7;
            color: #92400e;
        }

        .grade-badge.fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .result-stat-value.correct {
            color: #22c55e;
        }

        .result-stat-value.wrong {
            color: #ef4444;
        }

        .result-stat-value.unanswered {
            color: #6b7280;
        }

        .result-stat-value.time {
            color: #2563eb;
        }

        .result-stat-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* 错题本 */
        .error-book-header {
            background: white;
            border-radius: 14px;
            padding: 20px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .error-count {
            font-size: 15px;
            color: #4b5563;
        }

        .error-count span {
            font-weight: 700;
            color: #ef4444;
        }

        .clear-errors-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: #dc2626;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            user-select: none;
        }

        .clear-errors-btn:hover {
            background: #fee2e2;
            transform: translateY(-1px);
        }

        .clear-errors-btn:active {
            transform: translateY(0);
        }

        .error-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .error-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .error-card:active {
            transform: translateY(-1px);
        }

        .error-card.expanded {
            cursor: default;
        }

        .error-answer-compare {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .error-your-answer {
            padding: 10px 16px;
            background: #fef2f2;
            border-radius: 8px;
            color: #991b1b;
            font-size: 14px;
        }

        .error-your-answer span {
            text-decoration: line-through;
            font-weight: 500;
        }

        .error-correct-answer {
            padding: 10px 16px;
            background: #f0fdf4;
            border-radius: 8px;
            color: #166534;
            font-size: 14px;
            font-weight: 500;
        }

        .error-explanation {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.7;
            color: #4b5563;
            display: none;
            margin-top: 12px;
        }

        .error-explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .expand-hint {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 12px;
        }

        .empty-state {
            background: white;
            border-radius: 14px;
            padding: 60px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            text-align: center;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 16px;
            color: #6b7280;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 20px;
            }

            .header .subtitle {
                font-size: 13px;
            }

            .stats {
                gap: 12px;
                font-size: 12px;
            }

            .mode-tabs {
                padding: 10px 12px;
                gap: 6px;
            }

            .mode-tab {
                padding: 8px 10px;
                font-size: 12px;
                flex: 1;
                min-width: 0;
                text-align: center;
            }

            .main-container {
                padding: 12px;
            }

            .question-card,
            .memorize-card,
            .error-card {
                padding: 20px;
                border-radius: 12px;

                ],
                answer: 'C',
                explanation: '辩证否定实质是"扬弃"——既克服又保留。'
            },
            {
                id: 15,
                difficulty: 'intermediate',
                difficultyText: '★★进阶',
                question: '社会形态的更替归根到底是由：',
                options: [
                    'A. 社会意识变化决定',
                    'B. 生产力和生产关系矛盾运动决定',
                    'C. 阶级斗争决定',
                    'D. 地理环境变化决定'
                ],
                answer: 'B',
                explanation: '生产力是社会发展的最终决定力量。'
            }
        ];

        // ==================== 状态管理 ====================
        let currentMode = 'practice';
        let practiceIndex = 0; // 刷题模式记住的位置
        let currentQuestionIndex = 0;
        let userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '{}');
        let wrongQuestions = JSON.parse(localStorage.getItem('wrongQuestions') || '[]');
        let wrongQuestionAnswers = JSON.parse(localStorage.getItem('wrongQuestionAnswers') || '{}');
        let correctCount = parseInt(localStorage.getItem('correctCount') || '0');
        let wrongCount = parseInt(localStorage.getItem('wrongCount') || '0');
        let examSubmitted = false;
        let examAnswers = {};
        let examTimer = null;
        let examTimeLeft = 20 * 60; // 20分钟
        let examStartTime = null;
        let memorizeRevealed = {}; // 背题模式已揭示的题目
        let errorExpanded = {}; // 错题本已展开的题目
        let autoJumpTimeout = null; // 自动跳转定时器

        // ==================== DOM 元素 ====================
        const mainContainer = document.getElementById('mainContainer');
        const correctCountEl = document.getElementById('correctCount');
        const wrongCountEl = document.getElementById('wrongCount');
        const totalCountEl = document.getElementById('totalCount');

        // 初始化统计
        totalCountEl.textContent = QUESTION_BANK.length;
        updateStats();

        // ==================== 持久化函数 ====================
        function saveToLocalStorage() {
            localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
            localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
            localStorage.setItem('wrongQuestionAnswers', JSON.stringify(wrongQuestionAnswers));
            localStorage.setItem('correctCount', correctCount.toString());
            localStorage.setItem('wrongCount', wrongCount.toString());
        }

        // ==================== 模式切换 ====================
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 清除之前的自动跳转定时器
                if (autoJumpTimeout) {
                    clearTimeout(autoJumpTimeout);
                    autoJumpTimeout = null;
                }

                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const newMode = tab.dataset.mode;
                
                // 如果离开刷题模式，保存当前位置
                if (currentMode === 'practice') {
                    practiceIndex = currentQuestionIndex;
                }
                
                currentMode = newMode;
                memorizeRevealed = {};
                errorExpanded = {};
                
                // 清除考试定时器
                if (examTimer) {
                    clearInterval(examTimer);
                    examTimer = null;
                }
                
                // 根据模式设置初始状态
                if (currentMode === 'practice') {
                    // 刷题模式：回到之前的位置
                    currentQuestionIndex = practiceIndex;
                    examSubmitted = false;
                } else if (currentMode === 'exam') {
                    // 考试模式：从头开始，重置状态
                    currentQuestionIndex = 0;
                    examSubmitted = false;
                    examAnswers = {};
                    examTimeLeft = 20 * 60;
                    examStartTime = Date.now();
                } else {
                    currentQuestionIndex = 0;
                    examSubmitted = false;
                }
                
                updateStats();
                render();
            });
        });

        // ==================== 渲染主函数 ====================
        function render() {
            switch (currentMode) {
                case 'practice':
                    renderPracticeMode();
                    break;
                case 'exam':
                    renderExamMode();
                    break;
                case 'memorize':
                    renderMemorizeMode();
                    break;
                case 'errors':
                    renderErrorBookMode();
                    break;
            }
        }

        // ==================== 刷题模式 ====================
        function renderPracticeMode() {
            const q = QUESTION_BANK[currentQuestionIndex];
            const userAnswer = userAnswers[q.id];
            const isAnswered = userAnswer !== undefined;

            const progress = ((currentQuestionIndex + 1) / QUESTION_BANK.length) * 100;

            let optionsHtml = q.options.map((opt, idx) => {
                const optLabel = String.fromCharCode(65 + idx);
                let className = 'option-btn';
                if (isAnswered) {
                    className += ' disabled';
                    if (optLabel === q.answer) {
                        className += ' correct';
                    } else if (optLabel === userAnswer && userAnswer !== q.answer) {
                        className += ' wrong';
                    }
                }
                return `<button class="${className}" data-option="${optLabel}" onclick="selectOption('${optLabel}')">
                    <span class="option-label">${optLabel}</span>
                    <span>${opt.substring(3)}</span>
                </button>`;
            }).join('');

            let feedbackHtml = '';
            if (isAnswered) {
                const isCorrect = userAnswer === q.answer;
                feedbackHtml = `<div class="feedback show ${isCorrect ? 'correct' : 'wrong'}">
                    <div class="feedback-title">
                        ${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}
                    </div>
                    <div class="feedback-content">
                        ${!isCorrect ? `<div class="correct-answer-text">正确答案：${q.answer}</div>` : ''}
                        <div>💡 ${q.explanation}</div>
                    </div>
                </div>`;
            }

            const isLastQuestion = currentQuestionIndex === QUESTION_BANK.length - 1;
            const canGoNext = !isLastQuestion || (isLastQuestion && isAnswered);

            mainContainer.innerHTML = `
                <div class="question-card" id="questionCard">
                    <div class="progress-bar-container">
                        <div class="progress-info">
                            <span>答题进度</span>
                            <span>${currentQuestionIndex + 1} / ${QUESTION_BANK.length}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    
                    <div class="question-header">
                        <div class="question-number">${q.id}</div>
                        <span class="difficulty difficulty-${q.difficulty}">${q.difficultyText}</span>
                    </div>
                    
                    <div class="question-text">${q.question}</div>
                    
                    <div class="options-list">
                        ${optionsHtml}
                    </div>
                    
                    ${feedbackHtml}
                    
                    <div class="nav-buttons">
                        <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                            ← 上一题
                        </button>
                        <span class="progress-text">${currentQuestionIndex + 1} / ${QUESTION_BANK.length}</span>
                        <button class="nav-btn next" onclick="nextQuestion()" ${!canGoNext ? 'disabled' : ''}>
                            ${isLastQuestion ? '完成 ✓' : '下一题 →'}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(option) {
            const q = QUESTION_BANK[currentQuestionIndex];
            if (userAnswers[q.id] !== undefined) return;

            // 清除之前的自动跳转定时器
            if (autoJumpTimeout) {
                clearTimeout(autoJumpTimeout);
                autoJumpTimeout = null;
            }

            userAnswers[q.id] = option;
            const isCorrect = option === q.answer;

            if (isCorrect) {
                correctCount++;
            } else {
                wrongCount++;
                // 添加到错题本
                if (!wrongQuestions.includes(q.id)) {
                    wrongQuestions.push(q.id);
                }
                wrongQuestionAnswers[q.id] = option;
            }

            saveToLocalStorage();
            updateStats();

            const card = document.getElementById('questionCard');
            if (!isCorrect) {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }

            renderPracticeMode();

            // 刷题模式：1.5秒后自动跳下一题（让用户看清解析）
            if (currentQuestionIndex < QUESTION_BANK.length - 1) {
                autoJumpTimeout = setTimeout(() => {
                    currentQuestionIndex++;
                    practiceIndex = currentQuestionIndex; // 记住位置
                    renderPracticeMode();
                }, 1500);
            }
        }

        function prevQuestion() {
            if (autoJumpTimeout) {
                clearTimeout(autoJumpTimeout);
                autoJumpTimeout = null;
            }
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                practiceIndex = currentQuestionIndex;
                render();
            }
        }

        function nextQuestion() {
            if (autoJumpTimeout) {
                clearTimeout(autoJumpTimeout);
                autoJumpTimeout = null;
            }
            if (currentQuestionIndex < QUESTION_BANK.length - 1) {
                currentQuestionIndex++;
                practiceIndex = currentQuestionIndex;
                render();
            }
        }

        // ==================== 考试模式 ====================
        function renderExamMode() {
            if (examSubmitted) {
                renderExamResult();
                return;
            }

            if (!examTimer) {
                startExamTimer();
            }

            const q = QUESTION_BANK[currentQuestionIndex];
            const userAnswer = examAnswers[q.id];

            const progress = ((currentQuestionIndex + 1) / QUESTION_BANK.length) * 100;

            let optionsHtml = q.options.map((opt, idx) => {
                const optLabel = String.fromCharCode(65 + idx);
                let className = 'option-btn';
                if (userAnswer === optLabel) {
                    className += ' selected';
                }
                return `<button class="${className}" data-option="${optLabel}" onclick="selectExamOption('${optLabel}')">
                    <span class="option-label">${optLabel}</span>
                    <span>${opt.substring(3)}</span>
                </button>`;
            }).join('');

            const minutes = Math.floor(examTimeLeft / 60);
            const seconds = examTimeLeft % 60;
            let timerClass = 'exam-timer';
            if (examTimeLeft <= 60) timerClass += ' danger';
            else if (examTimeLeft <= 300) timerClass += ' warning';

            mainContainer.innerHTML = `
                <div class="exam-info">
                    <div class="${timerClass}">⏱️ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}</div>
                    <button class="submit-btn" onclick="submitExam()">交卷</button>
                </div>
                
                <div class="question-card">
                    <div class="progress-bar-container">
                        <div class="progress-info">
                            <span>答题进度</span>
                            <span>${currentQuestionIndex + 1} / ${QUESTION_BANK.length}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    
                    <div class="question-header">
                        <div class="question-number">${q.id}</div>
                        <span class="difficulty difficulty-${q.difficulty}">${q.difficultyText}</span>
                    </div>
                    
                    <div class="question-text">${q.question}</div>
                    
                    <div class="options-list">
                        ${optionsHtml}
                    </div>
                    
                    <div class="nav-buttons">
                        <button class="nav-btn prev" onclick="prevExamQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                            ← 上一题
                        </button>
                        <span class="progress-text">${currentQuestionIndex + 1} / ${QUESTION_BANK.length}</span>
                        <button class="nav-btn next" onclick="nextExamQuestion()">
                            ${currentQuestionIndex === QUESTION_BANK.length - 1 ? '检查交卷' : '下一题 →'}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectExamOption(option) {
            const q = QUESTION_BANK[currentQuestionIndex];
            examAnswers[q.id] = option;
            // 考试模式不自动跳转
            renderExamMode();
        }

        function prevExamQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderExamMode();
            }
        }

        function nextExamQuestion() {
            if (currentQuestionIndex < QUESTION_BANK.length - 1) {
                currentQuestionIndex++;
                renderExamMode();
            } else {
                submitExam();
            }
        }

        function startExamTimer() {
            examTimer = setInterval(() => {
                examTimeLeft--;
                if (examTimeLeft <= 0) {
                    clearInterval(examTimer);
                    examTimer = null;
                    submitExam();
                } else {
                    const timerEl = document.querySelector('.exam-timer');
                    if (timerEl) {
                        const minutes = Math.floor(examTimeLeft / 60);
                        const seconds = examTimeLeft % 60;
                        timerEl.textContent = `⏱️ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        timerEl.className = 'exam-timer';
                        if (examTimeLeft <= 60) timerEl.classList.add('danger');
                        else if (examTimeLeft <= 300) timerEl.classList.add('warning');
                    }
                }
            }, 1000);
        }

        function submitExam() {
            if (examTimer) {
                clearInterval(examTimer);
                examTimer = null;
            }
            examSubmitted = true;

            // 计算成绩
            let examCorrect = 0;
            let examWrong = 0;
            let examUnanswered = 0;
            const examUsedTime = Math.floor((Date.now() - examStartTime) / 1000);

            QUESTION_BANK.forEach(q => {
                const answer = examAnswers[q.id];
                if (!answer) {
                    examUnanswered++;
                } else if (answer === q.answer) {
                    examCorrect++;
                } else {
                    examWrong++;
                    if (!wrongQuestions.includes(q.id)) {
                        wrongQuestions.push(q.id);
                    }
                    wrongQuestionAnswers[q.id] = answer;
                }
            });

            // 更新全局统计
            correctCount += examCorrect;
            wrongCount += examWrong + examUnanswered;
            saveToLocalStorage();
            updateStats();

            renderExamResult(examCorrect, examWrong, examUnanswered, examUsedTime);
        }

        function renderExamResult(correct, wrong, unanswered, usedTime) {
            const total = QUESTION_BANK.length;
            const score = Math.round((correct / total) * 100);
            
            let gradeClass, gradeText;
            if (score >= 90) {
                gradeClass = 'excellent';
                gradeText = '🌟 优秀';
            } else if (score >= 70) {
                gradeClass = 'good';
                gradeText = '👍 良好';
            } else if (score >= 60) {
                gradeClass = 'pass';
                gradeText = '✓ 及格';
            } else {
                gradeClass = 'fail';
                gradeText = '💪 需努力';
            }

            const usedMinutes = Math.floor(usedTime / 60);
            const usedSeconds = usedTime % 60;

            mainContainer.innerHTML = `
                <div class="exam-result">
                    <div class="score-circle ${gradeClass}">
                        <div class="score-number">${score}</div>
                        <div class="score-label">分</div>
                    </div>
                    <div class="grade-badge ${gradeClass}">${gradeText}</div>
                    <h2 style="margin-bottom: 20px; color: #1f2937;">考试完成！</h2>
                    <div class="result-stats">
                        <div class="result-stat">
                            <div class="result-stat-value correct">${correct}</div>
                            <div class="result-stat-label">答对</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value wrong">${wrong}</div>
                            <div class="result-stat-label">答错</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value unanswered">${unanswered}</div>
                            <div class="result-stat-label">未答</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value time">${usedMinutes}'${String(usedSeconds).padStart(2, '0')}"</div>
                            <div class="result-stat-label">用时</div>
                        </div>
                    </div>
                    <div class="result-buttons">
                        <button class="submit-btn" onclick="resetExam()">🔄 重新考试</button>
                        <button class="submit-btn danger" onclick="goToErrorBook()">📋 查看错题</button>
                        <button class="submit-btn secondary" onclick="goToPractice()">📝 逐题练习</button>
                    </div>
                </div>
            `;
        }

        function resetExam() {
            examSubmitted = false;
            examAnswers = {};
            currentQuestionIndex = 0;
            examTimeLeft = 20 * 60;
            examStartTime = Date.now();
            renderExamMode();
        }

        function goToErrorBook() {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-mode="errors"]').classList.add('active');
            currentMode = 'errors';
            errorExpanded = {};
            updateStats();
            render();
        }

        function goToPractice() {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-mode="practice"]').classList.add('active');
            currentMode = 'practice';
            currentQuestionIndex = practiceIndex;
            updateStats();
            render();
        }

        // ==================== 背题模式 ====================
        function renderMemorizeMode() {
            const cardsHtml = QUESTION_BANK.map(q => {
                const isRevealed = memorizeRevealed[q.id];
                const optionsHtml = q.options.map((opt, idx) => {
                    const optLabel = String.fromCharCode(65 + idx);
                    const isCorrect = optLabel === q.answer;
                    return `<div class="memorize-option ${isCorrect && isRevealed ? 'correct' : ''}">
                        ${isCorrect && isRevealed ? '✓ ' : ''}${opt}
                    </div>`;
                }).join('');

                return `<div class="memorize-card" onclick="toggleMemorizeReveal(${q.id})">
                    <div class="question-header">
                        <div class="question-number">${q.id}</div>
                        <span class="difficulty difficulty-${q.difficulty}">${q.difficultyText}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="memorize-answer ${isRevealed ? 'show' : ''}">
                        <div class="memorize-answer-label">✅ 正确答案：${q.answer}</div>
                        <div class="memorize-options">
                            ${optionsHtml}
                        </div>
                    </div>
                    <div class="memorize-explanation ${isRevealed ? 'show' : ''}">
                        <strong>💡 解析：</strong>${q.explanation}
                    </div>
                    ${!isRevealed ? '<div class="memorize-hint">👆 点击卡片查看答案和解析</div>' : ''}
                </div>`;
            }).join('');

            mainContainer.innerHTML = cardsHtml;
        }

        function toggleMemorizeReveal(questionId) {
            memorizeRevealed[questionId] = !memorizeRevealed[questionId];
            // 背题模式不自动跳转
            renderMemorizeMode();
        }

        // ==================== 错题本模式 ====================
        function renderErrorBookMode() {
            const errorQuestions = QUESTION_BANK.filter(q => wrongQuestions.includes(q.id));

            if (errorQuestions.length === 0) {
                mainContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎉</div>
                        <div class="empty-text">错题本为空</div>
                        <div style="margin-top: 12px; font-size: 14px; color: #9ca3af;">继续刷题，错题会自动收集到这里</div>
                    </div>
                `;
                return;
            }

            const cardsHtml = errorQuestions.map(q => {
                const yourAnswer = wrongQuestionAnswers[q.id] || '未作答';
                const isExpanded = errorExpanded[q.id];
                const yourOptionText = yourAnswer !== '未作答' ? 
                    q.options.find(opt => opt.startsWith(yourAnswer + '.')) || yourAnswer : 
                    '未作答';

                return `<div class="error-card ${isExpanded ? 'expanded' : ''}" onclick="toggleErrorExpand(${q.id})">
                    <div class="question-header">
                        <div class="question-number" style="background: #ef4444;">${q.id}</div>
                        <span class="difficulty difficulty-${q.difficulty}">${q.difficultyText}</span>
                    </div>
                    <div class="question-text" style="margin-bottom: 16px;">${q.question}</div>
                    <div class="error-answer-compare">
                        <div class="error-your-answer">
                            ❌ 你的答案：<span>${yourOptionText}</span>
                        </div>
                        <div class="error-correct-answer">
                            ✅ 正确答案：${q.options.find(opt => opt.startsWith(q.answer + '.'))}
                        </div>
                    </div>
                    <div class="error-explanation ${isExpanded ? 'show' : ''}">
                        <strong>💡 解析：</strong>${q.explanation}
                    </div>
                    ${!isExpanded ? '<div class="expand-hint">👆 点击展开完整解析</div>' : ''}
                </div>`;
            }).join('');

            mainContainer.innerHTML = `
                <div class="error-book-header">
                    <div class="error-count">错题本共有 <span>${errorQuestions.length}</span> 道错题</div>
                    <button class="clear-errors-btn" onclick="event.stopPropagation(); clearErrors()">清空错题本</button>
                </div>
                ${cardsHtml}
            `;
        }

        function toggleErrorExpand(questionId) {
            errorExpanded[questionId] = !errorExpanded[questionId];
            renderErrorBookMode();
        }

        function clearErrors() {
            if (confirm('确定要清空错题本吗？此操作不可恢复。')) {
                wrongQuestions = [];
                wrongQuestionAnswers = {};
                errorExpanded = {};
                saveToLocalStorage();
                updateStats();
                renderErrorBookMode();
            }
        }

        // ==================== 工具函数 ====================
        function updateStats() {
            correctCountEl.textContent = correctCount;
            wrongCountEl.textContent = wrongCount;
        }

        // ==================== 初始化 ====================
        render();
    </script>
</body>
</html>
