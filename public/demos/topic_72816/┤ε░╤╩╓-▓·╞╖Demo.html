<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搭把手 · 产品Demo - 打工人互助接送孩子平台</title>
<style>
  :root{
    --primary:#FF6B35;--primary-dark:#E55A2B;--primary-light:#FFF0E8;
    --secondary:#FFB627;--accent:#2EC4B6;--accent-light:#E8FAF8;
    --danger:#EF4444;--warning:#F59E0B;--success:#10B981;--info:#3B82F6;
    --dark:#1A1A2E;--dark-2:#16213E;--gray-50:#F8FAFC;--gray-100:#F1F5F9;
    --gray-200:#E2E8F0;--gray-300:#CBD5E1;--gray-400:#94A3B8;
    --gray-500:#64748B;--gray-600:#475569;--gray-700:#334155;--white:#FFF;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06);--shadow:0 4px 16px rgba(0,0,0,.08);
    --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--gray-100);color:var(--dark);font-size:14px;line-height:1.5;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px;outline:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* 顶部切换栏 */
  .topbar{
    height:56px;background:var(--dark);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;z-index:10;
  }
  .topbar-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
  .topbar-brand .ic{
    width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .topbar-tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:10px}
  .topbar-tab{
    padding:6px 18px;border-radius:7px;font-size:13px;font-weight:600;
    color:rgba(255,255,255,.7);transition:all .2s;
  }
  .topbar-tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(255,107,53,.4)}
  .topbar-info{display:flex;align-items:center;gap:16px;font-size:13px;color:rgba(255,255,255,.8)}
  .topbar-info .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* 主容器 */
  .main{display:flex;height:calc(100vh - 56px)}
  .sidebar{
    width:200px;background:var(--white);border-right:1px solid var(--gray-200);
    padding:16px 12px;overflow-y:auto;flex-shrink:0;
  }
  .menu-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;
    color:var(--gray-700);font-size:14px;font-weight:500;cursor:pointer;
    transition:all .15s;margin-bottom:2px;width:100%;text-align:left;
  }
  .menu-item:hover{background:var(--gray-100)}
  .menu-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
  .menu-item .ic{font-size:16px;width:20px;text-align:center}
  .menu-group-title{font-size:11px;color:var(--gray-400);padding:12px 14px 6px;font-weight:600;letter-spacing:1px}

  .content{flex:1;overflow-y:auto;padding:24px}
  .page-title{font-size:22px;font-weight:800;margin-bottom:4px}
  .page-desc{color:var(--gray-500);font-size:13px;margin-bottom:20px}

  /* 手机壳 */
  .phone-wrap{
    display:flex;justify-content:center;align-items:flex-start;padding:20px 0;
    height:100%;overflow-y:auto;
  }
  .phone{
    width:390px;height:780px;background:var(--gray-100);border-radius:36px;
    box-shadow:0 24px 60px rgba(0,0,0,.18),0 0 0 10px var(--dark-2),0 0 0 11px var(--gray-300);
    overflow:hidden;position:relative;display:flex;flex-direction:column;
  }
  .phone-statusbar{
    height:36px;background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;font-size:12px;font-weight:600;color:var(--dark);flex-shrink:0;
  }
  .phone-statusbar .icons{display:flex;gap:4px}
  .phone-content{flex:1;overflow-y:auto;background:var(--gray-50)}
  .phone-tabbar{
    height:62px;background:#fff;border-top:1px solid var(--gray-200);
    display:flex;flex-shrink:0;
  }
  .phone-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:11px;color:var(--gray-400);cursor:pointer;
  }
  .phone-tab.active{color:var(--primary)}
  .phone-tab .ic{font-size:20px}

  /* 通用组件 */
  .card{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
  .btn{
    padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;
    transition:all .15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:var(--gray-100);color:var(--gray-700)}
  .btn-ghost:hover{background:var(--gray-200)}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warning{background:var(--warning);color:#fff}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .tag{
    display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;
    font-size:11px;font-weight:600;
  }
  .tag-orange{background:var(--primary-light);color:var(--primary)}
  .tag-green{background:#E8FAF8;color:var(--accent)}
  .tag-blue{background:#EFF6FF;color:var(--info)}
  .tag-gray{background:var(--gray-100);color:var(--gray-600)}
  .tag-red{background:#FEE2E2;color:var(--danger)}
  .tag-yellow{background:#FEF3C7;color:var(--warning)}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow-sm);border-left:4px solid var(--primary)}
  .stat-card.green{border-left-color:var(--accent)}
  .stat-card.blue{border-left-color:var(--info)}
  .stat-card.yellow{border-left-color:var(--warning)}
  .stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px}
  .stat-value{font-size:28px;font-weight:800;color:var(--dark)}
  .stat-sub{font-size:11px;color:var(--gray-400);margin-top:4px}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
  th{background:var(--gray-50);padding:12px;text-align:left;font-size:12px;color:var(--gray-600);font-weight:600;border-bottom:1px solid var(--gray-200)}
  td{padding:12px;border-bottom:1px solid var(--gray-100);font-size:13px}
  tr:hover td{background:var(--gray-50)}
  .table-wrap{background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}

  .toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .input,.select{
    padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;
    font-size:13px;background:#fff;min-width:160px;
  }
  .input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

  /* 模态框 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-mask.show{display:flex}
  .modal{
    background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
    animation:modalIn .25s;
  }
  @keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:18px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
  .modal-title{font-size:17px;font-weight:700}
  .modal-close{font-size:22px;color:var(--gray-400);cursor:pointer;line-height:1}
  .modal-body{padding:24px;overflow-y:auto;flex:1}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}

  .form-row{margin-bottom:16px}
  .form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
  .form-label .req{color:var(--danger)}
  .form-input,.form-select,.form-textarea{
    width:100%;padding:9px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:14px;
  }
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .form-textarea{resize:vertical;min-height:80px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* C端样式 */
  .c-header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;padding:20px 16px 16px;
  }
  .c-header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .c-loc{display:flex;align-items:center;gap:4px;font-size:13px}
  .c-loc b{font-weight:600}
  .c-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
  .c-search{
    background:rgba(255,255,255,.95);border-radius:20px;padding:8px 14px;
    display:flex;align-items:center;gap:8px;color:var(--gray-400);font-size:13px;
  }
  .c-banner{
    margin:12px 16px;background:linear-gradient(135deg,var(--secondary),#FF9500);
    border-radius:12px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;
  }
  .c-banner h4{font-size:15px;margin-bottom:2px}
  .c-banner p{font-size:11px;opacity:.9}
  .c-banner .ic{font-size:32px}

  .c-section{padding:0 16px;margin-bottom:12px}
  .c-section-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
  .c-section-title h3{font-size:15px;font-weight:700}
  .c-section-title a{font-size:12px;color:var(--gray-400);text-decoration:none}

  .c-task-card{
    background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  }
  .c-task-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .c-task-user{display:flex;align-items:center;gap:8px}
  .c-task-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--primary);font-weight:600}
  .c-task-name{font-size:13px;font-weight:600}
  .c-task-meta{font-size:11px;color:var(--gray-400)}
  .c-task-body{font-size:13px;color:var(--gray-700);margin-bottom:10px;line-height:1.5}
  .c-task-body b{color:var(--dark)}
  .c-task-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--gray-100)}
  .c-task-reward{color:var(--primary);font-weight:700;font-size:15px}
  .c-task-reward span{font-size:11px;color:var(--gray-400);font-weight:400;margin-left:2px}

  .c-fab{
    position:absolute;right:16px;bottom:78px;width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(255,107,53,.4);z-index:5;
  }

  .c-order-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .c-order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--gray-100)}
  .c-order-no{font-size:12px;color:var(--gray-500)}
  .c-order-body{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .c-order-line{flex:1}
  .c-order-line .row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
  .c-order-line .dot{width:8px;height:8px;border-radius:50%}
  .c-order-line .dot.start{background:var(--accent)}
  .c-order-line .dot.end{background:var(--primary)}
  .c-order-line .line{width:2px;height:14px;background:var(--gray-200);margin-left:3px}
  .c-order-foot{display:flex;gap:8px;justify-content:flex-end}

  .c-empty{text-align:center;padding:60px 20px;color:var(--gray-400)}
  .c-empty .ic{font-size:48px;margin-bottom:12px}

  .c-profile-head{background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:24px 16px;color:#fff;text-align:center}
  .c-profile-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .c-profile-name{font-size:17px;font-weight:700;margin-bottom:4px}
  .c-profile-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:11px}
  .c-profile-stats{display:flex;background:#fff;margin:12px 16px;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
  .c-profile-stat{flex:1;padding:14px;text-align:center;border-right:1px solid var(--gray-100)}
  .c-profile-stat:last-child{border-right:none}
  .c-profile-stat .num{font-size:18px;font-weight:800;color:var(--primary)}
  .c-profile-stat .lbl{font-size:11px;color:var(--gray-500);margin-top:2px}

  .c-menu-list{background:#fff;margin:0 16px;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
  .c-menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--gray-100);cursor:pointer}
  .c-menu-item:last-child{border-bottom:none}
  .c-menu-item .ic{width:32px;height:32px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
  .c-menu-item .name{flex:1;font-size:14px}
  .c-menu-item .arrow{color:var(--gray-300)}

  /* 状态机图 */
  .flow-chart{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:20px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .flow-node{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;border:2px solid}
  .flow-arrow{color:var(--gray-400);font-size:14px}

  /* Toast */
  .toast{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}

  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700}

  .empty-row{text-align:center;padding:40px;color:var(--gray-400)}
  .pagination{display:flex;gap:4px;justify-content:center;padding:16px}
  .pagination button{padding:6px 12px;border:1px solid var(--gray-200);border-radius:6px;background:#fff;font-size:13px}
  .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .pagination button:disabled{opacity:.5}

  .desc-list{display:grid;grid-template-columns:100px 1fr;gap:8px 16px;font-size:13px}
  .desc-list dt{color:var(--gray-500)}
  .desc-list dd{color:var(--dark);font-weight:500}

  .track-timeline{padding:12px 0}
  .track-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
  .track-item:last-child{padding-bottom:0}
  .track-item::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--gray-200)}
  .track-item:last-child::before{display:none}
  .track-dot{width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary);flex-shrink:0;margin-top:2px;z-index:1}
  .track-dot.done{background:var(--success);box-shadow:0 0 0 2px var(--success)}
  .track-content{flex:1}
  .track-title{font-size:13px;font-weight:600;margin-bottom:2px}
  .track-time{font-size:11px;color:var(--gray-400)}
  .track-desc{font-size:12px;color:var(--gray-600);margin-top:4px}
</style>
</head>

  sb.innerHTML='';
  MENUS[currentMode].forEach(g=>{
    const title=el('div','menu-group-title',g.group);

    g.items.forEach(it=>{

function acceptTask(taskId){
  const t=getTask(taskId);
  if(getParent(1).point<t.rewardPoint){toast('积分余额不足');return}
  // 创建订单
  const newOrder={
    id:DB.orders.length+1,
    orderNo:`${t.taskNo}-1`,
    taskId:t.id,parentId:t.parentId,helperId:1,
    status:0,acceptTime:fmtDateNow(),finishTime:null,rewardPoint:t.rewardPoint
  };
  DB.orders.push(newOrder);
  t.status=1;
  toast('接单成功！请按时到达学校');
  setTimeout(()=>{currentPage='orders';renderSidebar();renderPhoneTabbar();renderPhoneContent()},800);
}

function submitTask(){
  const me=getParent(1);
  const reward=parseInt($('#f-reward').value);
  if(!reward||reward<1){toast('请填写正确的悬赏积分');return}
  if(reward>me.point){toast('积分余额不足');return}
  const childId=parseInt($('#f-child').value);
  const c=getChild(childId);
  const newTask={
    id:DB.tasks.length+1,
    taskNo:'CP'+new Date().toISOString().slice(0,10).replace(/-/g,'')+String(DB.tasks.length+1).padStart(3,'0'),
    parentId:1,childId,schoolId:parseInt($('#f-school').value),
    communityId:parseInt($('#f-community').value),
    pickupTime:$('#f-time').value.replace('T',' '),
    rewardPoint:reward,status:0,remark:$('#f-remark').value,
    createTime:fmtDateNow()
  };
  DB.tasks.push(newTask);
  // 冻结积分
  DB.pointRecords.push({
    id:DB.pointRecords.length+1,parentId:1,bizType:0,bizTypeName:'发起任务',
    changePoint:-reward,beforePoint:me.point,afterPoint:me.point-reward,
    bizId:newTask.id,createTime:fmtDateNow()
  });
  me.point-=reward;
  toast('任务发布成功！等待附近家长接单');
  setTimeout(()=>{currentPage='orders';renderSidebar();renderPhoneTabbar();renderPhoneContent()},800);
}

    list.appendChild(card);

function orderNext(orderId,toStatus){
  const o=getOrder(orderId);
  const t=getTask(o.taskId);
  const oldStatus=o.status;
  o.status=toStatus;
  // 添加轨迹
  if([1,2,3,4].includes(toStatus)){
    const trackMap={1:'已到达学校',2:'已接到孩子',3:'开始送达',4:'已送达指定地点'};
    const locMap={1:getSchool(t.schoolId).name,2:getSchool(t.schoolId).name,3:'送达途中',4:getCommunity(t.communityId).name};
    DB.tracks.push({
      id:DB.tracks.length+1,orderId,longitude:120.1,latitude:30.28,
      location:locMap[toStatus],locationTime:fmtDateNow(),desc:trackMap[toStatus]
    });
  }
  // 确认完成：结算积分
  if(toStatus===5){
    o.finishTime=fmtDateNow();
    t.status=2;
    const helper=getParent(o.helperId);
    const parent=getParent(o.parentId);
    DB.pointRecords.push({
      id:DB.pointRecords.length+1,parentId:helper.id,bizType:1,bizTypeName:'接单奖励',
      changePoint:+o.rewardPoint,beforePoint:helper.point,afterPoint:helper.point+o.rewardPoint,
      bizId:o.id,createTime:fmtDateNow()
    });
    helper.point+=o.rewardPoint;
    helper.totalHelpCount+=1;
    parent.totalHelpedCount+=1;
    toast('订单已完成！积分已结算');
  }
  // 取消
  if(toStatus===6){
    t.status=0;
    const parent=getParent(o.parentId);
    DB.pointRecords.push({
      id:DB.pointRecords.length+1,parentId:parent.id,bizType:2,bizTypeName:'取消退回',
      changePoint:+o.rewardPoint,beforePoint:parent.point,afterPoint:parent.point+o.rewardPoint,
      bizId:o.id,createTime:fmtDateNow()
    });
    parent.point+=o.rewardPoint;
    toast('订单已取消，积分已退回');
  }
  if(toStatus!==5&&toStatus!==6){
    toast(`状态更新：${ORDER_STATUS[toStatus].text}`);
  }
  renderPhoneContent();
}

    <thead><tr><th>订单号</th><th>发起者</th><th>帮助者</th><th>悬赏</th><th>状态</th><th>接单时间</th><th>完成时间</th><th>操作</th></tr></thead>
    <tbody>${list.map(o=>{
      const p=getParent(o.parentId);const h=getParent(o.helperId);
      return `<tr>
        <td>${o.orderNo}</td><td>${p.realName}</td><td>${h.realName}</td>
        <td style="color:var(--primary);font-weight:600">+${o.rewardPoint}</td>
        <td><span class="tag ${ORDER_STATUS[o.status].cls}">${ORDER_STATUS[o.status].text}</span></td>
        <td>${fmtDate(o.acceptTime)}</td><td>${fmtDate(o.finishTime)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="viewOrderDetail(${o.id})">详情</button></td>
      </tr>`;
    }).join('')}</tbody>
  `;
}

/* B端-实名认证 */
function aVerification(c){
  c.innerHTML=`
    <div class="page-title">实名认证</div>
    <div class="page-desc">审核家长提交的实名认证申请</div>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>申请人</th><th>身份证号</th><th>提交时间</th><th>状态</th><th>审核人</th><th>操作</th></tr></thead>
      <tbody>${DB.verifications.map(v=>{
        const p=getParent(v.parentId);
        return `<tr>
          <td>${v.id}</td><td>${p.realName}</td><td>${v.idCardNo}</td>
          <td>${fmtDate(v.submitTime)}</td>
          <td><span class="tag ${VERI_STATUS[v.status].cls}">${VERI_STATUS[v.status].text}</span></td>
          <td>${v.auditUser||'-'}</td>
          <td>
            ${v.status===0?`
              <button class="btn btn-success btn-sm" onclick="auditVeri(${v.id},1)">通过</button>
              <button class="btn btn-danger btn-sm" onclick="auditVeri(${v.id},2)">驳回</button>
            `:`<button class="btn btn-ghost btn-sm" onclick="viewVeri(${v.id})">详情</button>`}
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  `;
}
function auditVeri(id,result){
  if(result===2){
    openModal('驳回原因',`
      <div class="form-row"><label class="form-label">驳回原因 <span class="req">*</span></label><textarea class="form-textarea" id="reject-reason" placeholder="请输入驳回原因"></textarea></div>
    `,`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="doAudit(${id},2)">确认驳回</button>`);
  }else{
    doAudit(id,1);
  }
}
function doAudit(id,result){
  const v=DB.verifications.find(x=>x.id===id);
  v.status=result;
  v.auditUser='admin';
  v.auditTime=fmtDateNow();
  if(result===2)v.rejectReason=$('#reject-reason')?.value||'';
  // 联动家长状态
  const p=getParent(v.parentId);
  p.status=result===1?1:0;
  if(result===1)p.realName=v.realName;
  closeModal();toast(result===1?'审核通过':'已驳回');renderPage();
}
function viewVeri(id){
  const v=DB.verifications.find(x=>x.id===id);
  const p=getParent(v.parentId);
  openModal('认证详情',`
    <dl class="desc-list">
      <dt>申请人</dt><dd>${p.realName}</dd>
      <dt>身份证号</dt><dd>${v.idCardNo}</dd>
      <dt>提交时间</dt><dd>${fmtDate(v.submitTime)}</dd>
      <dt>状态</dt><dd><span class="tag ${VERI_STATUS[v.status].cls}">${VERI_STATUS[v.status].text}</span></dd>
      <dt>审核人</dt><dd>${v.auditUser||'-'}</dd>
      <dt>审核时间</dt><dd>${fmtDate(v.auditTime)}</dd>
      ${v.rejectReason?`<dt>驳回原因</dt><dd style="color:var(--danger)">${v.rejectReason}</dd>`:''}
    </dl>
  `,'');
}

/* B端-投诉处理 */
function aComplaints(c){
  c.innerHTML=`
    <div class="page-title">投诉处理</div>
    <div class="page-desc">处理用户投诉，保障双方权益</div>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>订单号</th><th>投诉人</th><th>被投诉人</th><th>类型</th><th>内容</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>${DB.complaints.map(cp=>{
        const o=getOrder(cp.orderId);
        return `<tr>
          <td>${cp.id}</td><td>${o.orderNo}</td>
          <td>${getParent(cp.complainantId).realName}</td>
          <td>${getParent(cp.respondentId).realName}</td>
          <td><span class="tag tag-orange">${cp.typeName}</span></td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${cp.content}">${cp.content}</td>
          <td><span class="tag ${COMPLAINT_STATUS[cp.status].cls}">${COMPLAINT_STATUS[cp.status].text}</span></td>
          <td>
            ${cp.status===0?`<button class="btn btn-warning btn-sm" onclick="handleComplaint(${cp.id})">开始处理</button>`:''}
            ${cp.status===1?`<button class="btn btn-success btn-sm" onclick="finishComplaint(${cp.id})">完成处理</button>`:''}
            <button class="btn btn-ghost btn-sm" onclick="viewComplaint(${cp.id})">详情</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  `;
}
function handleComplaint(id){
  const cp=DB.complaints.find(x=>x.id===id);
  cp.status=1;cp.handleUser='admin';cp.handleTime=fmtDateNow();
  toast('已开始处理');renderPage();
}
function finishComplaint(id){
  openModal('填写处理结果',`
    <div class="form-row"><label class="form-label">处理结果 <span class="req">*</span></label><textarea class="form-textarea" id="cp-result" placeholder="请输入处理结果"></textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="doFinishComplaint(${id})">提交</button>`);
}
function doFinishComplaint(id){
  const result=$('#cp-result').value.trim();
  if(!result){toast('请填写处理结果');return}
  const cp=DB.complaints.find(x=>x.id===id);
  cp.status=2;cp.handleResult=result;
  closeModal();toast('处理完成');renderPage();
}
function viewComplaint(id){
  const cp=DB.complaints.find(x=>x.id===id);
  const o=getOrder(cp.orderId);
  openModal('投诉详情',`
    <dl class="desc-list">
      <dt>投诉编号</dt><dd>${cp.id}</dd>
      <dt>关联订单</dt><dd>${o.orderNo}</dd>
      <dt>投诉人</dt><dd>${getParent(cp.complainantId).realName}</dd>
      <dt>被投诉人</dt><dd>${getParent(cp.respondentId).realName}</dd>
      <dt>投诉类型</dt><dd>${cp.typeName}</dd>
      <dt>投诉内容</dt><dd>${cp.content}</dd>
      <dt>投诉时间</dt><dd>${fmtDate(cp.createTime)}</dd>
      <dt>状态</dt><dd><span class="tag ${COMPLAINT_STATUS[cp.status].cls}">${COMPLAINT_STATUS[cp.status].text}</span></dd>
      <dt>处理人</dt><dd>${cp.handleUser||'-'}</dd>
      <dt>处理时间</dt><dd>${fmtDate(cp.handleTime)}</dd>
      <dt>处理结果</dt><dd>${cp.handleResult||'-'}</dd>
    </dl>
  `,'');
}

/* B端-轨迹追踪 */
function aTracks(c){
  c.innerHTML=`
    <div class="page-title">轨迹追踪</div>
    <div class="page-desc">查看所有订单的接送轨迹记录</div>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>订单号</th><th>位置</th><th>经纬度</th><th>描述</th><th>时间</th></tr></thead>
      <tbody>${DB.tracks.map(t=>{
        const o=getOrder(t.orderId);
        return `<tr>
          <td>${t.id}</td><td>${o.orderNo}</td>
          <td>${t.location}</td>
          <td>${t.longitude.toFixed(4)}, ${t.latitude.toFixed(4)}</td>
          <td>${t.desc}</td>
          <td>${fmtDate(t.locationTime)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  `;
}

/* ==================== 工具 ==================== */
function fmtDateNow(){
  const d=new Date();
  const p=(n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ==================== 初始化 ==================== */
switchMode('customer');
</script>
