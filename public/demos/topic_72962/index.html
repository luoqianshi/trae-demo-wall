<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一念成云</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            /* 背景已切换为真实图片 */
            background-image: url('pexels-oandremoura-34303631.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .onboarding-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }

        .onboarding-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .onboarding-content {
            text-align: center;
            padding: 50px 70px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 36px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.3);
            animation: onboardingFadeIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .onboarding-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(200, 230, 255, 0.3) 0%, transparent 50%);
            animation: cloudFloat 15s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes cloudFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(3%, 2%) rotate(1deg);
            }
            50% {
                transform: translate(-2%, 3%) rotate(-0.5deg);
            }
            75% {
                transform: translate(2%, -2%) rotate(0.5deg);
            }
        }

        @keyframes onboardingFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .onboarding-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 56px;
            font-weight: 400;
            letter-spacing: 12px;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #4A6FA5 0%, #5B7CB8 30%, #7BA3D9 50%, #9FC5E8 70%, #B4D7EF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(100, 181, 246, 0.4));
            animation: titleGlow 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes titleGlow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(100, 181, 246, 0.3)) drop-shadow(0 0 30px rgba(100, 181, 246, 0.1));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(100, 181, 246, 0.5)) drop-shadow(0 0 50px rgba(100, 181, 246, 0.2));
                transform: scale(1.02);
            }
        }

        .onboarding-desc {
            font-family: 'ZCOOL XiaoWei', serif;
            color: #546E7A;
            font-size: 16px;
            line-height: 2;
            margin-bottom: 35px;
            max-width: 340px;
            text-align: center;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .onboarding-btn {
            font-family: 'ZCOOL XiaoWei', serif;
            padding: 14px 45px;
            font-size: 18px;
            color: white;
            background: linear-gradient(135deg, rgba(100, 181, 246, 0.9) 0%, rgba(66, 165, 245, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 
                0 4px 20px rgba(66, 165, 245, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            letter-spacing: 4px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .onboarding-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, rgba(66, 165, 245, 0.95) 0%, rgba(30, 136, 229, 1) 100%);
            box-shadow: 
                0 8px 30px rgba(66, 165, 245, 0.4),
                0 0 20px rgba(100, 181, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .onboarding-btn:active {
            transform: scale(0.98);
        }

        .sky-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .cloud-wrapper {
            position: absolute;
            z-index: 10;
            transition: opacity 3s ease-out;
        }

        .cloud {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cloud:hover {
            transform: scale(1.08);
        }

        .cloud-body {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.9) 100%);
            border-radius: 100px;
            box-shadow: 
                0 10px 40px rgba(255, 255, 255, 0.6),
                0 5px 20px rgba(255, 255, 255, 0.4),
                inset 0 -5px 15px rgba(200, 220, 240, 0.3),
                inset 0 5px 15px rgba(255, 255, 255, 0.9);
            padding: 20px 35px;
            min-width: 140px;
            max-width: 300px;
            transition: all 0.5s ease;
            display: inline-block;
            filter: blur(1px);
        }

        .cloud-body::before,
        .cloud-body::after,
        .cloud-body .cloud-puff-1,
        .cloud-body .cloud-puff-2 {
            content: '';
            position: absolute;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.85) 100%);
            border-radius: 50%;
            transition: all 0.5s ease;
            filter: blur(1px);
        }

        .cloud-body::before {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 25px;
            box-shadow: 0 -5px 15px rgba(255, 255, 255, 0.8);
        }

        .cloud-body::after {
            width: 65px;
            height: 65px;
            top: -33px;
            right: 30px;
            box-shadow: 0 -5px 15px rgba(255, 255, 255, 0.8);
        }

        .cloud-body .cloud-puff-1 {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 55px;
        }

        .cloud-body .cloud-puff-2 {
            width: 45px;
            height: 45px;
            top: -22px;
            right: 55px;
        }

        .cloud-text {
            position: relative;
            z-index: 2;
            color: #546E7A;
            font-size: 17px;
            line-height: 1.5;
            text-align: center;
            word-break: break-word;
            font-weight: 500;
        }

        @keyframes floatCloud {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-12px); }
            50% { transform: translateY(-6px); }
            75% { transform: translateY(-16px); }
        }

        .cloud.capturing {
            animation: none !important;
        }

        .cloud.capturing .cloud-body {
            background: #FFEB3B;
            box-shadow: 0 0 15px rgba(255, 235, 59, 1), 0 0 30px rgba(255, 193, 7, 0.6), 0 0 45px rgba(255, 152, 0, 0.4);
            border-radius: 50%;
            padding: 0;
            margin: 0;
            min-width: 15px;
            max-width: 15px;
            height: 15px;
            animation: starFlicker 0.2s ease-in-out infinite;
        }

        .cloud.ai-inspiration .cloud-body {
            background: linear-gradient(180deg, rgba(230, 245, 255, 0.95) 0%, rgba(200, 230, 255, 0.9) 100%);
            box-shadow: 
                0 10px 40px rgba(100, 181, 246, 0.5),
                0 5px 20px rgba(144, 202, 249, 0.4),
                inset 0 -5px 15px rgba(180, 220, 255, 0.4),
                inset 0 5px 15px rgba(255, 255, 255, 0.95);
            animation: aiGlow 3s ease-in-out infinite;
        }

        .cloud.ai-inspiration .cloud-body::before,
        .cloud.ai-inspiration .cloud-body::after,
        .cloud.ai-inspiration .cloud-body .cloud-puff-1,
        .cloud.ai-inspiration .cloud-body .cloud-puff-2 {
            background: linear-gradient(180deg, rgba(230, 245, 255, 0.98) 0%, rgba(200, 230, 255, 0.9) 100%);
            box-shadow: 0 -5px 15px rgba(144, 202, 249, 0.6);
        }

        .cloud.ai-inspiration .cloud-text {
            color: #1565C0;
            font-weight: 600;
        }

        @keyframes aiGlow {
            0%, 100% {
                box-shadow: 
                    0 10px 40px rgba(100, 181, 246, 0.5),
                    0 5px 20px rgba(144, 202, 249, 0.4),
                    inset 0 -5px 15px rgba(180, 220, 255, 0.4),
                    inset 0 5px 15px rgba(255, 255, 255, 0.95);
            }
            50% {
                box-shadow: 
                    0 10px 50px rgba(100, 181, 246, 0.7),
                    0 5px 25px rgba(144, 202, 249, 0.6),
                    0 0 30px rgba(186, 230, 253, 0.3),
                    inset 0 -5px 15px rgba(180, 220, 255, 0.5),
                    inset 0 5px 15px rgba(255, 255, 255, 0.98);
            }
        }

        @keyframes starFlicker {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 15px rgba(255, 235, 59, 1), 0 0 30px rgba(255, 193, 7, 0.6), 0 0 45px rgba(255, 152, 0, 0.4);
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 10px rgba(255, 235, 59, 0.8), 0 0 20px rgba(255, 193, 7, 0.4), 0 0 30px rgba(255, 152, 0, 0.2);
            }
        }

        .cloud.capturing .cloud-body::before,
        .cloud.capturing .cloud-body::after,
        .cloud.capturing .cloud-puff-1,
        .cloud.capturing .cloud-puff-2 {
            opacity: 0;
            transform: scale(0);
        }

        .cloud.capturing .cloud-text {
            opacity: 0;
        }

        @keyframes flyToCollection {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            25% {
                transform: translateY(60px);
                opacity: 1;
            }
            50% {
                transform: translateY(120px);
                opacity: 0.9;
            }
            75% {
                transform: translateY(180px);
                opacity: 0.7;
            }
            100% {
                transform: translateY(240px);
                opacity: 0;
            }
        }

        .cloud-wrapper.flying {
            animation: flyToCollection 0.8s ease-in forwards;
        }

        .cloud-wrapper.flying .cloud-body {
            animation: starFlicker 0.15s ease-in-out infinite;
        }

        .cloud-wrapper.fading {
            opacity: 0;
        }

        .mic-container {
            position: fixed;
            top: 62%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .mic-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .text-input {
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            color: #546E7A;
            outline: none;
            transition: all 0.35s ease;
            width: 190px;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 2px 10px rgba(255, 255, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .text-input:focus {
            border-color: rgba(100, 181, 246, 0.6);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 4px 15px rgba(100, 181, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64B5F6 0%, #42A5F5 100%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 2px 10px rgba(66, 165, 245, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.35s ease;
        }

        .send-btn:hover {
            transform: scale(1.12);
            background: linear-gradient(135deg, #42A5F5 0%, #1E88E5 100%);
            box-shadow: 
                0 4px 15px rgba(66, 165, 245, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .send-icon {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #81D4FA 0%, #4FC3F7 100%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 4px 20px rgba(79, 195, 247, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.35s ease;
            position: relative;
        }

        .mic-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #64B5F6 0%, #42A5F5 100%);
            box-shadow: 
                0 6px 30px rgba(66, 165, 245, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .mic-btn.recording {
            animation: micPulse 1s ease-in-out infinite;
            background: linear-gradient(135deg, #64B5F6 0%, #2196F3 100%);
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.6);
        }

        .mic-btn.recording::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 3px solid rgba(33, 150, 243, 0.5);
            animation: micRing 1.5s ease-out infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                transform: scale(1.15);
                box-shadow: 0 0 30px rgba(33, 150, 247, 0.6);
            }
            50% {
                transform: scale(1.2);
                box-shadow: 0 0 50px rgba(33, 150, 247, 0.9);
            }
        }

        @keyframes micRing {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .mic-icon {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .mic-status {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #546E7A;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 5px;
            white-space: nowrap;
        }

        .mic-status.visible {
            opacity: 1;
        }

        .collection-area {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 15px 25px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.35s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .collection-area:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .collection-area .star-list {
            opacity: 0.35;
            transition: opacity 0.35s ease;
        }

        .collection-area:hover .star-list {
            opacity: 1;
        }

        .collection-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .star-icon {
            width: 22px;
            height: 22px;
            fill: url(#starGradient);
            filter: drop-shadow(0 2px 4px rgba(255, 215, 0, 0.4));
            margin-right: 10px;
            transform: translateY(-1px);
        }

        .collection-title {
            color: linear-gradient(135deg, #455A64 0%, #607D8B 50%, #455A64 100%);
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #37474F 0%, #546E7A 50%, #455A64 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .collection-count {
            margin-left: auto;
            color: #90A4AE;
            font-size: 14px;
            margin-right: 15px;
        }

        .expand-btn {
            padding: 6px 14px;
            background: rgba(100, 181, 246, 0.15);
            border: 1px solid rgba(100, 181, 246, 0.4);
            border-radius: 16px;
            color: #42A5F5;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expand-btn:hover {
            background: rgba(100, 181, 246, 0.3);
            border-color: rgba(100, 181, 246, 0.6);
        }

        .expand-icon {
            width: 14px;
            height: 14px;
            fill: #42A5F5;
            transition: transform 0.3s ease;
        }

        .expand-btn:hover .expand-icon {
            transform: rotate(180deg);
        }

        .star-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .star-item {
            display: flex;
            align-items: flex-start;
            background: linear-gradient(135deg, #FFF9C4 0%, #FFF59D 100%);
            border-radius: 20px;
            padding: 10px 15px;
            gap: 8px;
            animation: starPop 0.3s ease;
        }

        .star-item-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        @keyframes starPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .star-item-icon {
            width: 16px;
            height: 16px;
            fill: #FFC107;
        }

        .star-item-text {
            color: #795548;
            font-size: 13px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .star-item-time {
            color: #B0BEC5;
            font-size: 11px;
        }

        .star-item-summary {
            color: #90A4AE;
            font-size: 11px;
            margin-top: 4px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-badge {
            font-size: 10px;
            margin-left: 6px;
            opacity: 0.6;
        }

        .source-star {
            color: #FFD700;
        }

        .source-cloud {
            color: #90A4AE;
        }

        .modal-star-item-summary {
            color: #90A4AE;
            font-size: 12px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(144, 164, 174, 0.3);
            font-style: italic;
        }

        .hint-text {
            position: fixed;
            top: 32%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(84, 110, 122, 0.85);
            font-size: 13px;
            z-index: 100;
            animation: hintFade 3s ease-in-out infinite;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            transition: all 0.35s ease;
            backdrop-filter: blur(8px);
            opacity: 0.4;
        }

        .fullscreen-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .fullscreen-icon {
            width: 18px;
            height: 18px;
            fill: rgba(84, 110, 122, 0.8);
            transition: all 0.35s ease;
        }

        .fullscreen-btn:hover .fullscreen-icon {
            fill: #546E7A;
        }

        .collection-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
        }

        .collection-modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .collection-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 520px;
            max-height: 65vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            overflow-y: auto;
            z-index: 201;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .collection-modal-overlay.visible .collection-modal {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #37474F 0%, #546E7A 50%, #455A64 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title .star-icon {
            width: 22px;
            height: 22px;
            fill: url(#starGradient);
            filter: drop-shadow(0 2px 4px rgba(255, 215, 0, 0.4));
            transform: translateY(-1px);
        }

        .modal-close {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: rotate(90deg);
        }

        .modal-close-icon {
            width: 18px;
            height: 18px;
            fill: #90A4AE;
        }

        .modal-star-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-star-item {
            display: flex;
            align-items: flex-start;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(250, 252, 255, 0.85) 100%);
            border-radius: 16px;
            padding: 20px;
            gap: 14px;
            transition: all 0.35s ease;
            box-shadow: 
                0 2px 12px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .modal-star-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(250, 252, 255, 0.95) 100%);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .modal-star-item-icon {
            width: 20px;
            height: 20px;
            fill: #FFC107;
            flex-shrink: 0;
            margin-top: 2px;
            filter: drop-shadow(0 1px 2px rgba(255, 193, 7, 0.3));
        }

        .modal-star-item-content {
            flex: 1;
        }

        .modal-star-item-text {
            color: #546E7A;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .modal-star-item-time {
            color: #B0BEC5;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .modal-empty {
            text-align: center;
            color: #B0BEC5;
            font-size: 14px;
            padding: 40px 20px;
        }

        @keyframes hintFade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .deep-ring-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            display: none;
            pointer-events: none;
        }

        .deep-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: relative;
        }

        .deep-ring-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(129,212,250,0.95) 0%, rgba(79,195,247,0.7) 50%, rgba(33,150,243,0.4) 100%);
            animation: deepRingPulse 1s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(79,195,247,0.8), 0 0 60px rgba(33,150,243,0.5);
        }

        .deep-ring-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 3px solid rgba(79,195,247,0.6);
            animation: deepRingWave 1.5s ease-out infinite;
        }

        .deep-ring-wave:nth-child(2) {
            animation-delay: 0.5s;
        }

        .deep-ring-wave:nth-child(3) {
            animation-delay: 1s;
        }

        .deep-ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.95);
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
            z-index: 10;
            margin-top: 80px;
            letter-spacing: 1px;
        }

        @keyframes deepRingPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 30px rgba(79,195,247,0.8), 0 0 60px rgba(33,150,243,0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                box-shadow: 0 0 45px rgba(79,195,247,1), 0 0 90px rgba(33,150,243,0.7);
            }
        }

        @keyframes deepRingWave {
            0% {
                width: 80px;
                height: 80px;
                opacity: 0.8;
                border-width: 3px;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
                border-width: 1px;
            }
        }

        @media (max-width: 768px) {
            .cloud-body {
                padding: 12px 20px;
                min-width: 100px;
                max-width: 180px;
            }

            .cloud-text {
                font-size: 12px;
            }

            .mic-btn {
                width: 60px;
                height: 60px;
            }

            .mic-icon {
                width: 28px;
                height: 28px;
            }

            .text-input {
                width: 140px;
            }

            .star-item-text {
                max-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="onboarding-overlay" id="onboardingOverlay">
        <div class="onboarding-content">
            <div class="onboarding-title">一念成云</div>
            <div class="onboarding-desc">
                说出此刻的念头，看它化作云朵<br>
                飘走的就随它去，想留住的点一下捕捉<br>
                长按空格，落星入海
            </div>
            <button class="onboarding-btn" id="onboardingBtn">开始</button>
        </div>
    </div>
    
    <div class="sky-container" id="skyContainer">
        <svg style="display: none;">
            <defs>
                <radialGradient id="starGradient" cx="35%" cy="35%" r="60%">
                    <stop offset="0%" stop-color="#FFF9C4"/>
                    <stop offset="40%" stop-color="#FFD700"/>
                    <stop offset="70%" stop-color="#FFA000"/>
                    <stop offset="100%" stop-color="#FF8F00"/>
                </radialGradient>
            </defs>
        </svg>
        
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏">
            <svg class="fullscreen-icon" viewBox="0 0 24 24" id="fullscreenIcon">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
        
        <div class="hint-text">说出此刻的念头，看它化作云朵</div>
        
        <div class="mic-container">
            <div class="mic-wrapper">
                <button class="mic-btn" id="micBtn" aria-label="语音输入">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div class="mic-status" id="micStatus">正在聆听...</div>
            </div>
            
            <input type="text" class="text-input" id="textInput" placeholder="输入念头..." maxlength="50">
            
            <button class="send-btn" id="sendBtn" aria-label="发送">
                <svg class="send-icon" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
        
        <div class="collection-area" id="collectionArea">
            <div class="collection-header">
                <svg class="star-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <span class="collection-title">星海</span>
                <span class="collection-count" id="collectionCount">0</span>
                <button class="expand-btn" id="expandBtn">
                    <span>展开全部</span>
                    <svg class="expand-icon" viewBox="0 0 24 24">
                        <path d="M12 5l-7 7 7 7M19 12H5"/>
                    </svg>
                </button>
            </div>
            <div class="star-list" id="starList">
                <div style="color: #B0BEC5; font-size: 13px; padding: 10px;">点击云朵可以捕捉你的念头</div>
            </div>
        </div>
        
        <div class="deep-ring-container" id="deepRingContainer">
            <div class="deep-ring">
                <div class="deep-ring-core"></div>
                <div class="deep-ring-wave"></div>
                <div class="deep-ring-wave"></div>
                <div class="deep-ring-wave"></div>
                <div class="deep-ring-text">按住说出，落星入海</div>
            </div>
        </div>
        
        <div class="collection-modal-overlay" id="collectionModalOverlay">
            <div class="collection-modal" id="collectionModal">
                <div class="modal-header">
                    <div class="modal-title">
                        <svg class="star-icon" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <span>星海全貌</span>
                    </div>
                    <button class="modal-close" id="modalClose">
                        <svg class="modal-close-icon" viewBox="0 0 24 24">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-star-list" id="modalStarList">
                    <div class="modal-empty">还没有捕捉任何念头</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const skyContainer = document.getElementById('skyContainer');
        const starList = document.getElementById('starList');
        const collectionCount = document.getElementById('collectionCount');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const expandBtn = document.getElementById('expandBtn');
        const collectionModalOverlay = document.getElementById('collectionModalOverlay');
        const collectionModal = document.getElementById('collectionModal');
        const modalClose = document.getElementById('modalClose');
        const modalStarList = document.getElementById('modalStarList');
        const deepRingContainer = document.getElementById('deepRingContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        
        let collectionItems = [];
        
        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function updateFullscreenIcon() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            if (isFullscreen) {
                fullscreenIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm5-8H5v2h5V5h2v3zm7 8h-3v3h2v-5h-3v2zm-3-8h3v3h2V5h-5v3z"/>';
                fullscreenBtn.setAttribute('aria-label', '退出全屏');
            } else {
                fullscreenIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
                fullscreenBtn.setAttribute('aria-label', '全屏');
            }
        }
        
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcon);

        function saveCollection() {
            localStorage.setItem('thoughtCollection', JSON.stringify(collectionItems));
        }

        function loadCollection() {
            const saved = localStorage.getItem('thoughtCollection');
            if (saved) {
                try {
                    collectionItems = JSON.parse(saved);
                    updateCollectionUI();
                } catch (e) {
                    console.error('[持久化] 读取失败:', e);
                    collectionItems = [];
                }
            }
        }

        function updateCollectionUI() {
            starList.innerHTML = '';
            
            if (collectionItems.length === 0) {
                const emptyItem = document.createElement('div');
                emptyItem.className = 'star-item empty';
                emptyItem.textContent = '还没有捕捉任何念头';
                starList.appendChild(emptyItem);
                collectionCount.textContent = '0';
                return;
            }
            
            collectionItems.forEach((item, index) => {
                const starItem = document.createElement('div');
                starItem.className = 'star-item';
                starItem.dataset.index = index;
                
                const icon = document.createElement('svg');
                icon.className = 'star-item-icon';
                icon.setAttribute('viewBox', '0 0 24 24');
                icon.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'star-item-text';
                textSpan.textContent = item.text;
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'star-item-time';
                timeSpan.textContent = item.time;
                
                const sourceBadge = document.createElement('span');
                sourceBadge.className = `source-badge source-${item.source || 'cloud'}`;
                sourceBadge.innerHTML = (item.source || 'cloud') === 'star' ? '★' : '☁';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'star-item-content';
                contentDiv.appendChild(textSpan);
                contentDiv.appendChild(sourceBadge);
                contentDiv.appendChild(timeSpan);
                
                if (item.summary) {
                    const summarySpan = document.createElement('div');
                    summarySpan.className = 'star-item-summary';
                    summarySpan.textContent = `拾遗：${item.summary}`;
                    contentDiv.appendChild(summarySpan);
                }
                
                starItem.appendChild(icon);
                starItem.appendChild(contentDiv);
                
                starList.insertBefore(starItem, starList.firstChild);
            });
            
            collectionCount.textContent = collectionItems.length;
            updateModalList();
        }
        
        let isRecording = false;
        let isDeepRecording = false;
        let deepRecordingStartTime = 0;
        const DEEP_RECORDING_MIN_DURATION = 500;
        let recognition = null;
        let clouds = [];
        let finalTranscript = '';
        let silenceTimer = null;
        let isStopping = false;
        
        const SILENCE_TIMEOUT = 2000;
        const CLOUD_LIFETIME = 20000;
        const TEXT_LENGTH_THRESHOLD = 10;
        
        const AI_API_URL = '/api/analyze-thoughts';
        
        let thoughtHistory = [];
        const MAX_HISTORY_SIZE = 10;
        const AI_TRIGGER_COUNT = 3;
        
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;
                recognition.continuous = true;
                
                console.log('语音识别初始化完成，continuous:', recognition.continuous);
                
                recognition.onstart = () => {
                    console.log('[语音识别] 开始录音, isDeepRecording:', isDeepRecording);
                    isRecording = true;
                    isStopping = false;
                    finalTranscript = '';
                    
                    if (!isDeepRecording) {
                        micBtn.classList.add('recording');
                        micStatus.classList.add('visible');
                        micStatus.textContent = '正在聆听...';
                    }
                };
                
                recognition.onend = () => {
                    console.log('[语音识别] 识别结束, isStopping:', isStopping, ', isRecording:', isRecording, ', isDeepRecording:', isDeepRecording);
                    
                    if (!isStopping && isRecording && !isDeepRecording) {
                        console.log('[语音识别] 自动重启识别...');
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.error('[语音识别] 重启失败:', e);
                            }
                        }, 100);
                        return;
                    }
                    
                    isRecording = false;
                    
                    if (isDeepRecording) {
                        const recordingDuration = Date.now() - deepRecordingStartTime;
                        isDeepRecording = false;
                        deepRingContainer.style.display = 'none';
                        
                        console.log('[Deep Ring] 识别结束，处理内容:', finalTranscript.trim());
                        
                        if (recordingDuration >= DEEP_RECORDING_MIN_DURATION && finalTranscript.trim()) {
                            const text = finalTranscript.trim();
                            console.log('[Deep Ring] 有效内容，执行深度捕捉:', text);
                            
                            thoughtHistory.unshift({
                                text: text,
                                timestamp: Date.now()
                            });
                            
                            if (thoughtHistory.length > MAX_HISTORY_SIZE) {
                                thoughtHistory.pop();
                            }
                            
                            createDeepCaptureAnimation(text);
                        } else {
                            if (recordingDuration < DEEP_RECORDING_MIN_DURATION) {
                                console.log('[Deep Ring] 按住时间太短，忽略');
                            } else {
                                console.log('[Deep Ring] 无有效内容，忽略');
                            }
                        }
                        finalTranscript = '';
                    } else {
                        micBtn.classList.remove('recording');
                        micStatus.classList.remove('visible');
                        
                        if (finalTranscript.trim()) {
                            console.log('[语音识别] 生成云朵，内容:', finalTranscript.trim());
                            
                            thoughtHistory.unshift({
                                text: finalTranscript.trim(),
                                timestamp: Date.now()
                            });
                            
                            if (thoughtHistory.length > MAX_HISTORY_SIZE) {
                                thoughtHistory.pop();
                            }
                            
                            createCloud(finalTranscript.trim());
                            
                            if (thoughtHistory.length >= AI_TRIGGER_COUNT) {
                                callAIApi();
                            }
                        }
                        finalTranscript = '';
                    }
                };
                
                recognition.onresult = (event) => {
                    console.log('[语音识别] 检测到语音，resultIndex:', event.resultIndex, ', results.length:', event.results.length);
                    
                    let interimTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            console.log('[语音识别] 最终结果:', event.results[i][0].transcript);
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            console.log('[语音识别] 临时结果:', event.results[i][0].transcript);
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    if (interimTranscript) {
                        micStatus.textContent = `正在聆听: ${interimTranscript}`;
                        clearTimeout(silenceTimer);
                    } else if (finalTranscript) {
                        micStatus.textContent = `已听到: ${finalTranscript}`;
                    }
                    
                    if (isRecording && (finalTranscript || interimTranscript)) {
                        clearTimeout(silenceTimer);
                        console.log('[语音识别] 设置静音超时计时器:', SILENCE_TIMEOUT, 'ms');
                        silenceTimer = setTimeout(() => {
                            if (isRecording) {
                                console.log('[语音识别] 静音超时，自动停止录音');
                                stopRecording();
                            }
                        }, SILENCE_TIMEOUT);
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error('[语音识别] 错误:', event.error);
                    if (event.error === 'not-allowed') {
                        micStatus.textContent = '请允许麦克风权限';
                    } else if (event.error === 'no-speech') {
                        console.log('[语音识别] 未检测到语音，继续监听...');
                        return;
                    } else {
                        micStatus.textContent = '识别失败，请重试';
                    }
                    setTimeout(() => {
                        micStatus.classList.remove('visible');
                    }, 2000);
                    isRecording = false;
                    micBtn.classList.remove('recording');
                };
            } else {
                micStatus.classList.add('visible');
                micStatus.textContent = '浏览器不支持语音，使用文字输入';
            }
        }
        
        function startRecording() {
            console.log('[语音识别] startRecording 被调用, isRecording:', isRecording);
            if (!recognition) {
                initSpeechRecognition();
            }
            if (!isRecording) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error('[语音识别] startRecording 启动失败:', e);
                }
            }
        }
        
        function stopRecording() {
            console.log('[语音识别] stopRecording 被调用, isRecording:', isRecording);
            if (isRecording) {
                isStopping = true;
                clearTimeout(silenceTimer);
                try {
                    recognition.stop();
                } catch (e) {
                    console.error('[语音识别] stopRecording 停止失败:', e);
                }
            }
        }
        
        function createCloud(text, isSlow = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cloud-wrapper';
            
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            
            const cloudBody = document.createElement('div');
            cloudBody.className = 'cloud-body';
            
            const puff1 = document.createElement('div');
            puff1.className = 'cloud-puff-1';
            
            const puff2 = document.createElement('div');
            puff2.className = 'cloud-puff-2';
            
            const cloudText = document.createElement('div');
            cloudText.className = 'cloud-text';
            cloudText.textContent = text;
            
            cloudBody.appendChild(puff1);
            cloudBody.appendChild(puff2);
            cloudBody.appendChild(cloudText);
            cloud.appendChild(cloudBody);
            wrapper.appendChild(cloud);
            
            skyContainer.appendChild(wrapper);
            
            const sizes = ['small', 'medium', 'large'];
            const size = sizes[Math.floor(Math.random() * sizes.length)];
            
            let scale = 1;
            let speedFactor = 1;
            
            switch (size) {
                case 'small':
                    scale = 0.7;
                    speedFactor = 0.8;
                    break;
                case 'large':
                    scale = 1.3;
                    speedFactor = 1.2;
                    break;
            }
            
            const cloudWidth = 250;
            const totalDistance = window.innerWidth + cloudWidth * 2;
            
            let lifetime = CLOUD_LIFETIME;
            if (isSlow) {
                lifetime = CLOUD_LIFETIME * 2;
            }
            
            const topPosition = 10 + Math.random() * 45;
            const floatAmplitude = 10 + Math.random() * 15;
            const floatFrequency = 0.002 + Math.random() * 0.001;
            
            const startX = window.innerWidth + cloudWidth;
            
            wrapper.style.top = `${topPosition}%`;
            wrapper.style.left = `${startX}px`;
            
            const cloudData = {
                wrapper: wrapper,
                cloud: cloud,
                text: text,
                createdAt: Date.now(),
                x: startX,
                y: 0,
                floatAmplitude: floatAmplitude,
                floatFrequency: floatFrequency,
                floatPhase: Math.random() * Math.PI * 2,
                scale: scale,
                timeoutId: null,
                animationId: null,
                lifetime: lifetime,
                totalDistance: totalDistance,
                startX: startX
            };
            clouds.push(cloudData);
            
            animateCloud(cloudData);
            
            cloud.addEventListener('click', () => {
                captureCloud(cloudData);
            });
        }
        
        function animateCloud(cloudData) {
            const startTime = Date.now();
            const FADE_START_PROGRESS = 0.75;
            
            const moveCloud = () => {
                if (!cloudData.wrapper.parentNode) return;
                
                const elapsed = Date.now() - startTime;
                
                const progress = elapsed / cloudData.lifetime;
                const currentX = cloudData.startX - (cloudData.totalDistance * progress);
                
                cloudData.x = currentX;
                cloudData.wrapper.style.left = `${currentX}px`;
                
                const floatY = Math.sin(elapsed * cloudData.floatFrequency + cloudData.floatPhase) * cloudData.floatAmplitude;
                cloudData.cloud.style.transform = `translateY(${floatY}px) scale(${cloudData.scale})`;
                
                if (progress >= FADE_START_PROGRESS) {
                    const fadeProgress = (progress - FADE_START_PROGRESS) / (1 - FADE_START_PROGRESS);
                    const opacity = Math.max(0, 1 - fadeProgress);
                    cloudData.wrapper.style.opacity = opacity;
                    
                    if (opacity <= 0) {
                        removeCloud(cloudData);
                        return;
                    }
                }
                
                if (elapsed >= cloudData.lifetime) {
                    removeCloud(cloudData);
                    return;
                }
                
                cloudData.animationId = requestAnimationFrame(moveCloud);
            };
            
            cloudData.animationId = requestAnimationFrame(moveCloud);
        }
        
        function captureCloud(cloudData) {
            clearTimeout(cloudData.timeoutId);
            cancelAnimationFrame(cloudData.animationId);
            
            cloudData.cloud.classList.add('capturing');
            
            setTimeout(() => {
                cloudData.wrapper.classList.add('flying');
                
                setTimeout(() => {
                    removeCloud(cloudData);
                    addToCollection(cloudData.text, 'cloud');
                }, 1000);
            }, 500);
        }
        
        function removeCloud(cloudData) {
            const index = clouds.indexOf(cloudData);
            if (index !== -1) {
                clouds.splice(index, 1);
            }
            cancelAnimationFrame(cloudData.animationId);
            if (cloudData.wrapper.parentNode) {
                cloudData.wrapper.parentNode.removeChild(cloudData.wrapper);
            }
        }
        
        function addToCollection(text, source = 'cloud') {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            const item = {
                text: text,
                time: timeStr,
                date: now.toLocaleDateString(),
                summary: '',
                source: source
            };
            collectionItems.unshift(item);
            
            saveCollection();
            
            const starItem = document.createElement('div');
            starItem.className = 'star-item';
            starItem.dataset.index = '0';
            
            const icon = document.createElement('svg');
            icon.className = 'star-item-icon';
            icon.setAttribute('viewBox', '0 0 24 24');
            icon.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'star-item-text';
            textSpan.textContent = text;
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'star-item-time';
            timeSpan.textContent = timeStr;
            
            const sourceBadge = document.createElement('span');
            sourceBadge.className = `source-badge source-${source}`;
            sourceBadge.innerHTML = source === 'star' ? '★' : '☁';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'star-item-content';
            contentDiv.appendChild(textSpan);
            contentDiv.appendChild(sourceBadge);
            contentDiv.appendChild(timeSpan);
            
            starItem.appendChild(icon);
            starItem.appendChild(contentDiv);
            
            if (starList.children.length === 1 && starList.children[0].style.color === 'rgb(176, 190, 204)') {
                starList.innerHTML = '';
            }
            
            starList.insertBefore(starItem, starList.firstChild);
            
            collectionCount.textContent = collectionItems.length;
            
            updateModalList();
            
            if (text.length > 25) {
                fetchSummary(text, item, starItem);
            }
            
            if (thoughtHistory.length >= AI_TRIGGER_COUNT) {
                callAIApi();
            }
        }
        
        async function fetchSummary(text, item, starItem) {
            try {
                const response = await fetch('/api/summarize-thought', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text }),
                    timeout: 8000
                });
                
                if (!response.ok) {
                    console.error('[AI总结] 请求失败:', response.status);
                    return;
                }
                
                const data = await response.json();
                
                if (data.summary && data.summary.trim()) {
                    let summary = data.summary.trim();
                    if (summary.length > 20) {
                        summary = summary.substring(0, 20) + '...';
                    }
                    
                    item.summary = summary;
                    
                    const contentDiv = starItem.querySelector('.star-item-content');
                    if (contentDiv) {
                        const summarySpan = document.createElement('div');
                        summarySpan.className = 'star-item-summary';
                        summarySpan.textContent = `拾遗：${summary}`;
                        contentDiv.appendChild(summarySpan);
                    }
                    
                    updateModalList();
                }
            } catch (error) {
                console.error('[拾遗] 调用失败:', error);
            }
        }
        
        function updateModalList() {
            if (collectionItems.length === 0) {
                modalStarList.innerHTML = '<div class="modal-empty">还没有捕捉任何念头</div>';
                return;
            }
            
            modalStarList.innerHTML = '';
            
            collectionItems.forEach(item => {
                const modalItem = document.createElement('div');
                modalItem.className = 'modal-star-item';
                
                const icon = document.createElement('svg');
                icon.className = 'modal-star-item-icon';
                icon.setAttribute('viewBox', '0 0 24 24');
                icon.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                
                const content = document.createElement('div');
                content.className = 'modal-star-item-content';
                
                const textSpan = document.createElement('div');
                textSpan.className = 'modal-star-item-text';
                textSpan.textContent = item.text;
                
                const timeSpan = document.createElement('div');
                timeSpan.className = 'modal-star-item-time';
                timeSpan.textContent = `${item.date} ${item.time}`;
                
                content.appendChild(textSpan);
                
                if (item.summary) {
                    const summarySpan = document.createElement('div');
                    summarySpan.className = 'modal-star-item-summary';
                    summarySpan.textContent = `拾遗：${item.summary}`;
                    content.appendChild(summarySpan);
                }
                
                const sourceBadge = document.createElement('span');
                sourceBadge.className = `source-badge source-${item.source || 'cloud'}`;
                sourceBadge.innerHTML = (item.source || 'cloud') === 'star' ? '★' : '☁';
                timeSpan.appendChild(sourceBadge);
                
                content.appendChild(timeSpan);
                
                modalItem.appendChild(icon);
                modalItem.appendChild(content);
                
                modalStarList.appendChild(modalItem);
            });
        }
        
        async function callAIApi() {
            if (thoughtHistory.length < AI_TRIGGER_COUNT) return;
            
            const thoughtsToAnalyze = thoughtHistory.slice(0, AI_TRIGGER_COUNT).map(t => t.text);
            thoughtHistory = thoughtHistory.slice(AI_TRIGGER_COUNT);
            
            try {
                const response = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        thoughts: thoughtsToAnalyze
                    }),
                    timeout: 10000
                });
                
                if (!response.ok) {
                    console.error('[AI API] 请求失败:', response.status);
                    return;
                }
                
                const data = await response.json();
                
                let resultText = '';
                if (data && data.output && data.output.length > 1 && data.output[1].content && data.output[1].content[0]) {
                    resultText = data.output[1].content[0].text;
                } else if (data && data.output && data.output[0] && data.output[0].choices && data.output[0].choices[0]) {
                    resultText = data.output[0].choices[0].content;
                }
                
                if (resultText) {
                    try {
                        let jsonStr = resultText.trim();
                        const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            jsonStr = jsonMatch[0];
                        }
                        
                        const result = JSON.parse(jsonStr);
                        
                        if (result.related && result.suggestion && result.suggestion.trim()) {
                            createInspirationCloud(result.suggestion.trim());
                        }
                    } catch (parseError) {
                        console.error('[AI API] JSON解析失败:', parseError, ', 原始响应:', resultText);
                    }
                }
            } catch (error) {
                console.error('[AI API] 调用失败:', error);
            }
        }
        
        function createInspirationCloud(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cloud-wrapper';
            
            const cloud = document.createElement('div');
            cloud.className = 'cloud ai-inspiration';
            
            const cloudBody = document.createElement('div');
            cloudBody.className = 'cloud-body';
            
            const puff1 = document.createElement('div');
            puff1.className = 'cloud-puff-1';
            
            const puff2 = document.createElement('div');
            puff2.className = 'cloud-puff-2';
            
            const cloudText = document.createElement('div');
            cloudText.className = 'cloud-text';
            cloudText.textContent = text;
            
            cloudBody.appendChild(puff1);
            cloudBody.appendChild(puff2);
            cloudBody.appendChild(cloudText);
            cloud.appendChild(cloudBody);
            wrapper.appendChild(cloud);
            
            skyContainer.appendChild(wrapper);
            
            const scale = 1.1;
            
            const cloudWidth = 250;
            const totalDistance = window.innerWidth + cloudWidth * 2;
            
            const topPosition = 10 + Math.random() * 45;
            const floatAmplitude = 10 + Math.random() * 15;
            const floatFrequency = 0.002 + Math.random() * 0.001;
            
            const startX = window.innerWidth + cloudWidth;
            
            wrapper.style.top = `${topPosition}%`;
            wrapper.style.left = `${startX}px`;
            
            const cloudData = {
                wrapper: wrapper,
                cloud: cloud,
                text: text,
                createdAt: Date.now(),
                x: startX,
                y: 0,
                floatAmplitude: floatAmplitude,
                floatFrequency: floatFrequency,
                floatPhase: Math.random() * Math.PI * 2,
                scale: scale,
                timeoutId: null,
                animationId: null,
                lifetime: CLOUD_LIFETIME,
                totalDistance: totalDistance,
                startX: startX
            };
            clouds.push(cloudData);
            
            animateCloud(cloudData);
            
            cloud.addEventListener('click', () => {
                captureCloud(cloudData);
            });
        }
        
        micBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
        
        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) {
                handleTextInput(text);
                textInput.value = '';
            }
        });
        
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = textInput.value.trim();
                if (text) {
                    handleTextInput(text);
                    textInput.value = '';
                }
            }
        });
        
        function handleTextInput(text) {
            thoughtHistory.unshift({
                text: text,
                timestamp: Date.now()
            });
            
            if (thoughtHistory.length > MAX_HISTORY_SIZE) {
                thoughtHistory.pop();
            }
            
            if (text.length > TEXT_LENGTH_THRESHOLD) {
                console.log('[文字输入] 内容超过', TEXT_LENGTH_THRESHOLD, '字，直接落星入海');
                createDeepCaptureAnimation(text);
            } else {
                console.log('[文字输入] 内容在', TEXT_LENGTH_THRESHOLD, '字以内，生成慢云朵');
                createCloud(text, true);
            }
            
            if (thoughtHistory.length >= AI_TRIGGER_COUNT) {
                callAIApi();
            }
        }
        
        expandBtn.addEventListener('click', () => {
            collectionModalOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        });
        
        modalClose.addEventListener('click', () => {
            collectionModalOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !textInput.matches(':focus') && !isRecording && !isDeepRecording) {
                e.preventDefault();
                
                isDeepRecording = true;
                deepRecordingStartTime = Date.now();
                
                deepRingContainer.style.display = 'block';
                
                console.log('[Deep Ring] 开始深度捕捉');
                
                if (!recognition) {
                    initSpeechRecognition();
                }
                
                try {
                    recognition.start();
                } catch (error) {
                    console.error('[Deep Ring] 启动录音失败:', error);
                    isDeepRecording = false;
                    deepRingContainer.style.display = 'none';
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && isDeepRecording) {
                console.log('[Deep Ring] 松开空格键，停止录音');
                
                if (isRecording) {
                    isStopping = true;
                    clearTimeout(silenceTimer);
                    try {
                        recognition.stop();
                    } catch (error) {
                        console.error('[Deep Ring] 停止录音失败:', error);
                    }
                }
            }
        });
        
        function createDeepCaptureAnimation(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cloud-wrapper';
            
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            
            const cloudBody = document.createElement('div');
            cloudBody.className = 'cloud-body';
            
            const puff1 = document.createElement('div');
            puff1.className = 'cloud-puff-1';
            
            const puff2 = document.createElement('div');
            puff2.className = 'cloud-puff-2';
            
            const cloudText = document.createElement('div');
            cloudText.className = 'cloud-text';
            cloudText.textContent = text;
            
            cloudBody.appendChild(puff1);
            cloudBody.appendChild(puff2);
            cloudBody.appendChild(cloudText);
            cloud.appendChild(cloudBody);
            wrapper.appendChild(cloud);
            
            skyContainer.appendChild(wrapper);
            
            const startX = window.innerWidth / 2 - 100;
            const topPosition = 30;
            
            wrapper.style.top = `${topPosition}%`;
            wrapper.style.left = `${startX}px`;
            
            const cloudData = {
                wrapper: wrapper,
                cloud: cloud,
                text: text,
                createdAt: Date.now(),
                x: startX,
                y: 0,
                floatAmplitude: 0,
                floatFrequency: 0,
                floatPhase: 0,
                scale: 1,
                timeoutId: null,
                animationId: null,
                lifetime: CLOUD_LIFETIME,
                totalDistance: 0,
                startX: startX
            };
            clouds.push(cloudData);
            
            setTimeout(() => {
                cloud.classList.add('capturing');
                
                setTimeout(() => {
                    wrapper.classList.add('flying');
                    
                    setTimeout(() => {
                        const index = clouds.indexOf(cloudData);
                        if (index !== -1) {
                            clouds.splice(index, 1);
                        }
                        cancelAnimationFrame(cloudData.animationId);
                        if (cloudData.wrapper.parentNode) {
                            cloudData.wrapper.parentNode.removeChild(cloudData.wrapper);
                        }
                        addToCollection(text, 'star');
                    }, 1000);
                }, 500);
            }, 200);
        }
        
        loadCollection();
        initSpeechRecognition();
        
        const onboardingOverlay = document.getElementById('onboardingOverlay');
        const onboardingBtn = document.getElementById('onboardingBtn');
        
        function startApp() {
            onboardingOverlay.classList.add('hidden');
        }
        
        onboardingBtn.addEventListener('click', startApp);
    </script>
