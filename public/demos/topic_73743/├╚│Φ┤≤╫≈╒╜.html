<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>萌宠大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100vh;overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;touch-action:manipulation;}
button{border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.page{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;}
.page.active{display:flex;}
/* ===== PAGE TITLE ===== */
#page-title{background:linear-gradient(135deg,#FFE8E8,#FFDAB9,#FFF8DC);overflow:hidden;}
.title-cat{width:28vh;height:28vh;position:relative;animation:floatCat 3s ease-in-out infinite;flex-shrink:0;}
@keyframes floatCat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.cat-wrap{position:relative;width:100%;height:100%;}
.cat-head{width:55%;height:50%;background:var(--cat-color,#FFD700);border-radius:50% 50% 48% 48%;position:absolute;top:10%;left:50%;transform:translateX(-50%);z-index:2;box-shadow:inset -4px -4px 12px rgba(0,0,0,0.08);}
.cat-ear-l,.cat-ear-r{width:20px;height:28px;background:var(--cat-color,#FFD700);border-radius:50% 50% 0 0;position:absolute;top:0%;z-index:1;}
.cat-ear-l{left:calc(50% - 26px);transform:rotate(-15deg);}
.cat-ear-r{left:calc(50% + 6px);transform:rotate(15deg);}
.cat-ear-il,.cat-ear-ir{width:12px;height:18px;background:#FFB6C1;border-radius:50% 50% 0 0;position:absolute;top:3%;}
.cat-ear-il{left:calc(50% - 23px);transform:rotate(-15deg);}
.cat-ear-ir{left:calc(50% + 10px);transform:rotate(15deg);}
.cat-eye-l,.cat-eye-r{width:18%;height:22%;background:#333;border-radius:50%;position:absolute;top:22%;z-index:3;animation:blink 4s infinite;}
.cat-eye-l{left:35%;}.cat-eye-r{left:55%;}
.cat-shine{width:40%;height:40%;background:#fff;border-radius:50%;position:absolute;top:10%;left:15%;}
.cat-shine2{width:18%;height:18%;background:#fff;border-radius:50%;position:absolute;bottom:18%;right:15%;z-index:3;}
@keyframes kbounce{0%{transform:scale(0) translateY(10px);opacity:0}50%{transform:scale(1.15) translateY(-5px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(0.08)}}
.cat-nose{width:6%;height:5%;background:#FF8FAB;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;position:absolute;top:38%;left:47%;z-index:3;}
.cat-mouth{position:absolute;top:43%;left:50%;transform:translateX(-50%);z-index:3;width:12px;height:8px;border-bottom:2px solid #555;border-radius:0 0 50% 50%;}
.cat-wh{position:absolute;top:36%;z-index:3;height:1.5px;background:#999;border-radius:1px;}
.cat-wh.a{left:18%;width:20px;transform:rotate(-8deg);}
.cat-wh.b{left:16%;top:41%;width:18px;transform:rotate(5deg);}
.cat-wh.c{right:18%;width:20px;transform:rotate(8deg);}
.cat-wh.d{right:16%;top:41%;width:18px;transform:rotate(-5deg);}
.cat-body{width:38%;height:32%;background:var(--cat-color,#FFD700);border-radius:50% 50% 44% 44%;position:absolute;bottom:16%;left:50%;transform:translateX(-50%);z-index:1;}
.cat-tail{width:12px;height:35%;background:var(--cat-color,#FFD700);border-radius:12px 12px 0 12px;position:absolute;bottom:24%;right:16%;transform-origin:bottom center;animation:tailWag 2s ease-in-out infinite;z-index:0;}
@keyframes tailWag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.cat-paw-l,.cat-paw-r{width:12%;height:10%;background:var(--cat-color,#FFD700);border-radius:50%;position:absolute;bottom:12%;z-index:2;}
.cat-paw-l{left:32%;}.cat-paw-r{left:52%;}
.cat-blush{width:10%;height:6%;background:rgba(255,150,150,0.5);border-radius:50%;position:absolute;top:36%;z-index:3;}
.cat-blush-l{left:22%}.cat-blush-r{right:22%}
.cat-bow{position:absolute;top:9%;right:23%;z-index:4;}
.cat-bow::before,.cat-bow::after{content:'';display:block;width:14px;height:10px;background:#FF4444;border-radius:50%;position:absolute;}
.cat-bow::before{transform:rotate(-20deg);}
.cat-bow::after{left:9px;transform:rotate(20deg);}
.cat-glasses{position:absolute;top:28%;left:50%;transform:translateX(-50%);z-index:4;display:none;}
.cat-glasses::before{content:'';display:block;width:16px;height:10px;border:2px solid #333;border-radius:50%;position:absolute;left:-20px;top:0;}
.cat-glasses::after{content:'';display:block;width:16px;height:10px;border:2px solid #333;border-radius:50%;position:absolute;right:-20px;top:0;}
.cat-glasses-bridge{position:absolute;top:28%;left:50%;transform:translateX(-50%);width:8px;height:2px;background:#333;z-index:4;display:none;}
.game-title{font-size:clamp(2rem,7vw,3.5rem);font-weight:900;background:linear-gradient(45deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:breathe 3s ease-in-out infinite;margin:1.5vh 0;filter:drop-shadow(0 0 15px rgba(255,107,107,0.3));}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 15px rgba(255,107,107,0.3))}50%{filter:drop-shadow(0 0 35px rgba(255,107,107,0.6))}}
.grade-cards{display:flex;gap:12px;margin:1.5vh 0;}
.grade-card{padding:10px 20px;border-radius:14px;font-size:clamp(0.85rem,2.8vw,1.1rem);font-weight:700;background:#fff;color:#FF6B6B;box-shadow:0 3px 12px rgba(0,0,0,0.08);transition:all 0.3s;}
.grade-card.selected{background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#fff;transform:scale(1.05);}
.btn-start{padding:12px 44px;border-radius:50px;font-size:clamp(1rem,3.5vw,1.3rem);font-weight:800;background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#fff;box-shadow:0 5px 18px rgba(255,107,107,0.35);transition:all 0.3s;}
.btn-start:active{transform:scale(0.95);}
.btn-continue{padding:9px 28px;border-radius:50px;font-size:0.95rem;font-weight:700;background:#fff;color:#6BCB77;border:2px solid #6BCB77;margin-top:8px;}
/* ===== PAGE HOME ===== */
#page-home{background:linear-gradient(180deg,#FFF8DC 0%,#FFE4B5 100%);flex-direction:column;justify-content:flex-start;}
.room{width:100%;height:60vh;position:relative;overflow:hidden;border-bottom:3px solid #8B4513;}
.room-wall{position:absolute;inset:0;background:linear-gradient(180deg,#FFF3CD,#FFE8A8);background-image:repeating-linear-gradient(45deg,transparent,transparent 28px,rgba(255,200,100,0.08) 28px,rgba(255,200,100,0.08) 56px);}
.room-floor{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(90deg,#DEB887,#D2A679,#C4956A);border-top:3px solid #A0522D;}
.room-floor::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 55px,rgba(139,69,19,0.12) 55px,rgba(139,69,19,0.12) 57px);}
.r-win{position:absolute;top:8%;left:8%;width:16%;height:26%;background:linear-gradient(180deg,#87CEEB 40%,#B0E0E6);border:5px solid #8B4513;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 15px rgba(255,255,255,0.4);}
.r-win::before{content:'';position:absolute;top:30%;left:12%;width:28%;height:18%;background:rgba(255,255,255,0.8);border-radius:50%;animation:cloudM 10s linear infinite;}
.r-win::after{content:'';position:absolute;top:22%;right:18%;width:22%;height:14%;background:rgba(255,255,255,0.6);border-radius:50%;animation:cloudM 14s linear infinite 4s;}
@keyframes cloudM{0%{transform:translateX(-15px)}100%{transform:translateX(25px)}}
.r-win-v{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:100%;background:#8B4513;}
.r-win-h{position:absolute;top:50%;left:0;width:100%;height:4px;background:#8B4513;}
.ri{position:absolute;cursor:pointer;transition:transform 0.2s;z-index:10;font-size:clamp(1.8rem,4.5vw,2.8rem);display:flex;flex-direction:column;align-items:center;user-select:none;}
.ri:active{transform:scale(0.92)!important;}
.ri span{font-size:clamp(0.55rem,1.5vw,0.7rem);color:#8B4513;font-weight:600;margin-top:1px;}
.ri-board{top:3%;right:4%;}.ri-door{bottom:22%;right:4%;}.ri-bag{bottom:22%;left:4%;}.ri-tree{top:3%;left:30%;}
.r-curtain{position:absolute;top:6%;left:6%;width:4%;height:28%;background:rgba(255,182,193,0.6);border-radius:0 0 4px 4px;z-index:1;}
.r-curtain-r{left:auto;right:24%;}
.r-rug{position:absolute;bottom:0;left:30%;width:35%;height:10%;background:rgba(255,182,193,0.25);border-radius:50% 50% 0 0;z-index:1;}
.r-photo{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:8%;height:10%;background:#fff;border:3px solid #8B4513;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;z-index:1;}
.home-pet{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);width:18vh;height:18vh;cursor:pointer;z-index:5;animation:petIdle 3s ease-in-out infinite;}
@keyframes petIdle{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg)}}
.heart-f{position:absolute;pointer-events:none;font-size:1.3rem;animation:heartUp 1.2s ease-out forwards;z-index:20;}
@keyframes heartUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(0.4)}}
.sp-bubble{position:absolute;background:#fff;padding:6px 14px;border-radius:14px;font-size:clamp(0.75rem,2vw,0.85rem);color:#333;box-shadow:0 3px 12px rgba(0,0,0,0.12);z-index:20;white-space:nowrap;animation:bPop 0.3s ease-out;pointer-events:none;}
.sp-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff;}
@keyframes bPop{from{transform:scale(0)}to{transform:scale(1)}}
.deco{position:absolute;z-index:4;pointer-events:none;}
.bbar{width:100%;height:40vh;display:flex;align-items:center;justify-content:space-around;padding:0 4%;background:rgba(255,255,255,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.bs{display:flex;align-items:center;gap:6px;font-size:clamp(0.9rem,2.8vw,1.2rem);font-weight:700;}
.sc{color:#FFD700;font-size:clamp(1.1rem,3.5vw,1.6rem);}
.mf{font-size:clamp(1.3rem,4vw,2rem);}
.bb{width:clamp(38px,9vw,50px);height:clamp(38px,9vw,50px);border-radius:50%;background:linear-gradient(135deg,#FF8E53,#FF6B6B);color:#fff;font-size:clamp(1.1rem,2.8vw,1.5rem);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.12);transition:transform 0.15s;}
.bb:active{transform:scale(0.9);}
/* ===== MODALS ===== */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:none;align-items:center;justify-content:center;padding:10px;}
.mo.act{display:flex;animation:fadeIn 0.25s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mc{background:#fff;border-radius:18px;width:100%;max-width:420px;max-height:72vh;overflow-y:auto;position:relative;animation:slideUp 0.3s ease-out;padding:18px;-webkit-overflow-scrolling:touch;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.mx{position:sticky;top:0;float:right;font-size:1.4rem;background:none;color:#999;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5;transition:background 0.2s;margin:-4px -4px 0 0;}
.mx:hover{background:#f0f0f0;}
.mt{font-size:clamp(1.1rem,3.5vw,1.4rem);font-weight:800;text-align:center;margin-bottom:12px;color:#333;clear:both;}
/* WEEKPLAN */
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;}
.wd{background:#FFF8DC;border-radius:10px;padding:6px 2px;text-align:center;font-size:clamp(0.6rem,1.5vw,0.72rem);cursor:pointer;transition:all 0.2s;min-height:clamp(65px,12vh,85px);}
.wd:active{transform:scale(0.96);}
.wd.td{border:2px solid #FF6B6B;}
.wn{font-weight:700;color:#8B4513;margin-bottom:3px;}
.wi{font-size:clamp(1rem,2.5vw,1.2rem);}
.wl{color:#888;margin-top:2px;}
.wd.done{background:#E8F5E9;}
/* MAP / SUBJECT */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sc2{background:linear-gradient(135deg,#FFF8DC,#FFE8A8);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all 0.3s;border:2px solid transparent;}
.sc2:active{transform:scale(0.97);}
.sc2.sel{border-color:#FF6B6B;box-shadow:0 3px 12px rgba(255,107,107,0.2);}
.si2{font-size:1.8rem;}.sn{font-weight:700;margin:5px 0;font-size:0.85rem;}
.ss{color:#FFD700;font-size:0.78rem;}
.sp{display:flex;gap:4px;justify-content:center;margin-top:5px;}
.pd{width:9px;height:9px;border-radius:50%;background:#ddd;}
.pd.dn{background:#6BCB77;}.pd.cur{background:#FFD93D;animation:pls 1s infinite;}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.gobtn{display:block;margin:10px auto;padding:11px 28px;border-radius:50px;font-size:0.9rem;font-weight:700;background:linear-gradient(135deg,#FF8E53,#FF6B6B);color:#fff;transition:all 0.2s;}
.gobtn:active{transform:scale(0.96);}
/* LEVEL SELECT */
.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.lb{padding:14px 8px;border-radius:12px;font-size:clamp(0.8rem,2.5vw,1rem);font-weight:700;cursor:pointer;transition:all 0.2s;background:#FFF8DC;border:2px solid transparent;}
.lb:active{transform:scale(0.95);}
.lb.dn{background:#E8F5E9;}.lb.lk{background:#EEE;color:#bbb;cursor:default;}
/* QUIZ */
#modal-quiz .mc{max-height:78vh;}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.qi{font-size:0.8rem;color:#666;font-weight:600;}
.qps{width:50px;height:50px;margin:0 auto 10px;position:relative;animation:pStudy 1.5s ease-in-out infinite;}
@keyframes pStudy{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.qq{font-size:clamp(0.88rem,3.2vw,1.05rem);font-weight:700;text-align:center;margin-bottom:12px;padding:0 8px;line-height:1.5;color:#333;}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qob{padding:12px 8px;border-radius:12px;font-size:clamp(0.8rem,2.8vw,0.95rem);font-weight:600;text-align:center;transition:all 0.3s;cursor:pointer;border:2px solid #E8E8E8;background:#FAFAFA;line-height:1.4;}
.qob:active{transform:scale(0.96);}
.qob.ok{background:#E8F5E9!important;border-color:#6BCB77!important;animation:cPop 0.5s;}
.qob.no{background:#FFEBEE!important;border-color:#FF5252!important;animation:shk 0.5s;}
.qob.hint{background:#E8F5E9!important;border-color:#6BCB77!important;}
.qob.dis{pointer-events:none;opacity:0.6;}
@keyframes cPop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes starFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(0.3)}}
/* RESULT */
#modal-result .mc{max-width:300px;text-align:center;}
.rp{width:70px;height:70px;margin:0 auto 8px;}
.rtx{font-size:1rem;font-weight:700;margin-bottom:10px;}
.rst{font-size:2.5rem;margin:10px 0;animation:stB 0.5s ease-out;}
@keyframes stB{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.rbs{display:flex;gap:8px;justify-content:center;}
.rb{padding:9px 22px;border-radius:50px;font-weight:700;font-size:0.9rem;transition:all 0.2s;}
.rb-nxt{background:linear-gradient(135deg,#6BCB77,#4CAF50);color:#fff;}
.rb-bk{background:#F5F5F5;color:#666;}
/* SHOP */
.sb{text-align:center;font-size:1rem;margin-bottom:10px;color:#FFD700;font-weight:700;}
.stabs{display:flex;gap:5px;margin-bottom:10px;justify-content:center;flex-wrap:wrap;}
.stab{padding:5px 12px;border-radius:18px;font-size:0.75rem;font-weight:600;background:#F5F5F5;color:#666;transition:all 0.2s;}
.stab.act{background:#FF6B6B;color:#fff;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.sit{background:#FAFAFA;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:all 0.2s;border:2px solid transparent;}
.sit:active{transform:scale(0.95);}
.sit.own{border-color:#6BCB77;background:#E8F5E9;}
.sit.lk{opacity:0.45;cursor:default;}
.sit-i{font-size:1.3rem;}.sit-n{font-size:0.65rem;font-weight:600;margin:3px 0;}.sit-p{font-size:0.7rem;color:#FFD700;font-weight:700;}
/* GROWTH */
.gp{width:60px;height:60px;margin:0 auto 8px;}
.grows{margin-top:12px;}
.gr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.gl{width:42px;font-size:0.8rem;font-weight:600;color:#666;}
.gbb{flex:1;height:12px;background:#EEE;border-radius:6px;overflow:hidden;}
.gbar{height:100%;border-radius:6px;transition:width 0.5s;}
.gbar.c{background:linear-gradient(90deg,#FF6B6B,#FF8E53);}
.gbar.m{background:linear-gradient(90deg,#4D96FF,#6BCB77);}
.gbar.e{background:linear-gradient(90deg,#FFD93D,#FF8E53);}
.gbar.s{background:linear-gradient(90deg,#9B59B6,#4D96FF);}
.gtot{text-align:center;margin-top:12px;font-size:0.9rem;font-weight:700;}
/* LABOR */
#modal-labor .mc{padding:0;overflow:hidden;max-height:78vh;}
.lsc{width:100%;height:55vh;background:linear-gradient(180deg,#87CEEB 0%,#98FB98 50%,#8FBC8F 100%);position:relative;overflow:hidden;}
.ltm{text-align:center;padding:8px;font-size:1.1rem;font-weight:800;color:#FF6B6B;}
/* 小车 */
.l-cart{position:absolute;bottom:8%;width:50px;height:30px;z-index:10;transition:left 0.08s linear;}
.l-cart-body{width:100%;height:60%;background:linear-gradient(135deg,#FF6B6B,#FF8E53);border-radius:6px 6px 2px 2px;position:absolute;bottom:40%;}
.l-cart-roof{width:60%;height:35%;background:linear-gradient(135deg,#4ECDC4,#44B09E);border-radius:8px 8px 0 0;position:absolute;bottom:100%;left:20%;}
.l-cart-wheel{width:14px;height:14px;background:#333;border-radius:50%;position:absolute;bottom:0;border:2px solid #555;}
.l-cart-wheel.lw-l{left:6px;}.l-cart-wheel.lw-r{right:6px;}
.l-cart-face{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:40%;height:40%;background:rgba(255,255,255,0.3);border-radius:3px;}
/* 掉落的星星 */
.l-star{position:absolute;font-size:1.5rem;z-index:5;pointer-events:none;transition:none;}
/* 左右控制按钮 */
.l-ctrl{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 8%;z-index:15;}
.l-ctrl button{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.5);font-size:1.5rem;border:2px solid rgba(255,255,255,0.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
/* EXPLORE */
#modal-explore .mc{max-height:78vh;}
.ebg{width:100%;height:160px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ebg.oc{background:linear-gradient(180deg,#1E90FF,#00CED1,#20B2AA);}
.ebg.fr{background:linear-gradient(180deg,#228B22,#32CD32,#90EE90);}
.ebg.sp{background:linear-gradient(180deg,#191970,#4B0082,#191970);}
.ecard{background:#fff;border-radius:14px;padding:16px;text-align:center;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.eci{font-size:2.5rem;margin-bottom:8px;}.ect{font-size:1rem;font-weight:700;margin-bottom:6px;}.ecx{font-size:0.85rem;color:#666;line-height:1.5;}
.enav{display:flex;justify-content:space-between;margin-top:12px;gap:6px;}
.enb{padding:7px 16px;border-radius:50px;background:#F5F5F5;font-weight:600;font-size:0.85rem;flex:1;text-align:center;}
.enb.pr{background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#fff;}
.etops{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
.etop{padding:6px 12px;border-radius:10px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.etop.oc{background:#E3F2FD;color:#1565C0;}.etop.fr{background:#E8F5E9;color:#2E7D32;}.etop.sp{background:#EDE7F6;color:#6A1B9A;}
.etop.sel{transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,0.15);}

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();}
function playTone(freq,dur,type,vol){
 try{ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
 g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}
}

/* ========== SAVE / LOAD ========== */
function save(){localStorage.setItem('mc_save',JSON.stringify(G))}
function load(){const s=localStorage.getItem('mc_save');if(s){try{G=JSON.parse(s)}catch(e){}return true}return false}

/* ========== PAGES ========== */
function showPg(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}

function selGrade(g){
 document.querySelectorAll('.grade-card').forEach(c=>c.classList.remove('selected'));
 document.querySelector(`.grade-card[data-grade="${g}"]`).classList.add('selected');
 G.grade=g;
 applyCatColor();
}

function applyCatColor(){
 const col=G.grade===3?'#FFD700':'#DAA520';
 document.documentElement.style.setProperty('--cat-color',col);
 // bow: only grade 3
 const bws=['title-bow','home-bow'];
 bws.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=G.grade===3?'block':'none';});
 // glasses: only grade 7
 const gls=['title-glasses','home-glasses','title-glasses-bridge','home-glasses-bridge'];
 gls.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=G.grade===7?'block':'none';});
}

function startNew(){
 if(!document.querySelector('.grade-card.selected')){toast('请先选择年级');return}
 save();enterHome();
}

function continueGame(){
 if(load()){
  document.querySelector(`.grade-card[data-grade="${G.grade}"]`)?.classList.add('selected');
  applyCatColor();
  enterHome();
 }
}

function enterHome(){
 showPg('page-home');
 applyCatColor();
 updStars();updMood();renderDeco();

}

function feedPet(){
 if(G.stars<1){toast('没有足够的星星了~');return}
 G.stars--;G.mood=Math.min(100,G.mood+10);updStars();updMood();

}

/* ========== PET INTERACTION ========== */
function petTap(){sfxClick();hearts();speech();G.mood=Math.min(100,G.mood+2);updMood();save()}

function hearts(){
 const pet=document.getElementById('hpet');
 const syms=['❤️','💕','💗','💖','🧡'];
 for(let i=0;i<5;i++){
  setTimeout(()=>{
   const h=document.createElement('div');h.className='heart-f';
   h.textContent=syms[i];h.style.left=(pet.offsetLeft+Math.random()*50+10)+'px';
   h.style.top=(pet.offsetTop+10)+'px';h.style.fontSize=(1+Math.random()*0.5)+'rem';
   document.getElementById('room').appendChild(h);setTimeout(()=>h.remove(),1200);
  },i*120);
 }
}

function speech(){
 const rm=document.getElementById('room');
 rm.querySelectorAll('.sp-bubble').forEach(b=>b.remove());
 const p=PHRASES[Math.floor(Math.random()*PHRASES.length)];
 const b=document.createElement('div');b.className='sp-bubble';b.textContent=p;
 const pet=document.getElementById('hpet');
 b.style.bottom=(rm.offsetHeight-pet.offsetTop+10)+'px';
 b.style.left='50%';b.style.transform='translateX(-50%)';
 rm.appendChild(b);clearTimeout(spTimer);spTimer=setTimeout(()=>b.remove(),2200);
}

/* ========== WEEK PLAN ========== */
function renderWP(){
 const grid=document.getElementById('week-grid');grid.innerHTML='';
 const today=new Date().getDay();const ti=today===0?6:today-1;
 for(let i=0;i<7;i++){
  const d=document.createElement('div');d.className='wd';
  if(i===ti)d.classList.add('td');
  const st=G.wp?.[i];if(st==='done')d.classList.add('done');
  const act=WSCHED[i];
  d.innerHTML=`<div class="wn">${WNAMES[i]}</div><div class="wi">${WICONS[act]||'📌'}</div><div class="wl">${act}${st==='done'?' ✅':''}</div>`;
  if(st!=='done'){d.onclick=()=>wpAct(i,act)}else{d.style.cursor='default';d.style.opacity='0.6'}
  grid.appendChild(d);
 }
}

 },250);
}

function startLabor(){
 openM('m-lab');sfxClick();labLeft=30;labPts=0;cartX=0;cartDir=0;labElapsed=0;labBaseSpeed=1.2;
 document.getElementById('lab-score').textContent='0';
 document.getElementById('lab-timer').textContent='⏱ 30秒';
 const sc=document.getElementById('lab-scene');
 sc.innerHTML=`
  <div style="position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(180deg,#90EE90,#228B22);border-radius:12px 12px 0 0;"></div>
  <div style="position:absolute;top:5%;left:10%;font-size:1.2rem;">🌻</div>
  <div style="position:absolute;top:8%;right:15%;font-size:1rem;">🦋</div>
  <div style="position:absolute;top:3%;left:45%;font-size:1.4rem;">☁️</div>
  <div class="l-cart" id="lab-cart" style="left:calc(50% - 25px);">
    <div class="l-cart-roof"></div>
    <div class="l-cart-body"></div>
    <div class="l-cart-face"></div>
    <div class="l-cart-wheel lw-l"></div>
    <div class="l-cart-wheel lw-r"></div>
  </div>
  <div class="l-ctrl">
    <button id="lab-left">◀</button>
    <button id="lab-right">▶</button>
  </div>
 `;
 // 按钮事件：支持鼠标按住和触屏按住
 const lb=document.getElementById('lab-left'),rb=document.getElementById('lab-right');
 const setDir=(d)=>{cartDir=d};
 const clrDir=()=>{if(cartDir===1||cartDir===-1)cartDir=0};
 lb.addEventListener('mousedown',e=>{e.preventDefault();setDir(-1)});
 lb.addEventListener('mouseup',clrDir);
 lb.addEventListener('mouseleave',clrDir);
 lb.addEventListener('touchstart',e=>{e.preventDefault();setDir(-1)});
 lb.addEventListener('touchend',clrDir);
 rb.addEventListener('mousedown',e=>{e.preventDefault();setDir(1)});
 rb.addEventListener('mouseup',clrDir);
 rb.addEventListener('mouseleave',clrDir);
 rb.addEventListener('touchstart',e=>{e.preventDefault();setDir(1)});
 rb.addEventListener('touchend',clrDir);
 // 键盘支持
 labKeyHandler=function(e){
  if(!document.getElementById('lab-cart'))return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){cartDir=-1;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){cartDir=1;e.preventDefault();}
 };
 labKeyUpHandler=function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='ArrowRight'||e.key==='d'||e.key==='D'){
   if(cartDir===-1||cartDir===1)cartDir=0;
  }
 };
 document.addEventListener('keydown',labKeyHandler);
 document.addEventListener('keyup',labKeyUpHandler);
 // 星星生成（随时间加速）
 labInt=setInterval(()=>spawnFallStar(),700);
 labTmr=setInterval(()=>{
  labLeft--;labElapsed++;
  // 每5秒加速一次
  labBaseSpeed=1.2+labElapsed*0.08;
  document.getElementById('lab-timer').textContent=`⏱ ${labLeft}秒`;
  if(labLeft<=0)endLabor();
 },1000);
 labSceneW=sc.offsetWidth;
 requestAnimationFrame(moveCartLoop);
}

function moveCartLoop(){
 if(!document.getElementById('lab-cart'))return;
 const cart=document.getElementById('lab-cart');
 const cw=cart.offsetWidth;
 cartX+=cartDir*4;
 if(cartX<0)cartX=0;
 if(cartX>labSceneW-cw)cartX=labSceneW-cw;
 cart.style.left=cartX+'px';
 checkStarCatch(cartX,cw);
 requestAnimationFrame(moveCartLoop);
}

function spawnFallStar(){
 const sc=document.getElementById('lab-scene');if(!sc)return;
 const s=document.createElement('div');s.className='l-star';s.textContent='⭐';
 const startX=5+Math.random()*85;
 s.style.left=startX+'%';
 s.style.top='-5%';
 const speed=labBaseSpeed*(0.8+Math.random()*0.4); // 当前基准速度±20%随机
 sc.appendChild(s);
 let y=-5;
 const fallId=setInterval(()=>{
  y+=speed*0.15;
  s.style.top=y+'%';
  if(y>85){clearInterval(fallId);if(s.parentElement)s.remove();}
 },50);
 setTimeout(()=>{clearInterval(fallId);if(s.parentElement)s.remove()},12000);
}

function checkStarCatch(cx,cw){
 const stars=document.querySelectorAll('.l-star');
 stars.forEach(s=>{
  const sx=s.getBoundingClientRect().left;
  const scRect=document.getElementById('lab-scene').getBoundingClientRect();
  const sLeft=sx-scRect.left;
  const sBot=parseFloat(s.style.top)||0;
  if(sBot>85 && sBot<95 && sLeft>cx-10 && sLeft<cx+cw+10){
   s.remove();labPts++;sfxCatch();document.getElementById('lab-score').textContent=labPts;
  }
 });
}

function endLabor(){
 clearInterval(labInt);clearInterval(labTmr);cartDir=0;
 document.removeEventListener('keydown',labKeyHandler);
 document.removeEventListener('keyup',labKeyUpHandler);
 if(labPts>0){
  G.stars+=labPts;G.totalStars+=labPts;save();updStars();markToday();
 }
 const sc=document.getElementById('lab-scene');
 sc.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.92)"><div style="font-size:2.5rem">🎉</div><div style="font-size:1.1rem;font-weight:800;margin:8px 0">劳动结束！</div><div style="font-size:1.8rem;color:#FFD700">⭐×${labPts}</div><button onclick="closeM('m-lab')" style="margin-top:16px;padding:10px 28px;border-radius:50px;background:linear-gradient(135deg,#6BCB77,#4CAF50);color:#fff;font-weight:700;font-size:0.95rem">收下奖励</button></div>`;
}

  ],

function checkExpAnswer(selected,correct){
 const opts=document.querySelectorAll('#exp-q-opts .qob');
 opts.forEach(o=>o.classList.add('dis'));
 if(selected===correct){

  document.getElementById('exp-res-text').style.color='#4CAF50';
  if(!G.expD)G.expD=[];
  if(!G.expD.includes(curExpTopic)){
   G.expD.push(curExpTopic);G.stars+=5;G.totalStars+=5;save();updStars();markToday();
  }
 }else{
  opts[selected].classList.add('exp-quiz-wrong');
  opts[correct].classList.add('exp-quiz-correct');
  document.getElementById('exp-result').style.display='block';
  document.getElementById('exp-res-icon').textContent='💪';
  document.getElementById('exp-res-text').textContent='答错了，正确答案已标出。再接再厉！';

 }
 document.getElementById('exp-next-btn').style.display='inline-block';

  html+='<div style="flex:1;height:10px;background:#EEE;border-radius:5px;overflow:hidden;"><div style="height:100%;width:'+r+'%;background:linear-gradient(90deg,'+(s.k==='chinese'?'#FF6B6B,#FF8E53':s.k==='math'?'#4D96FF,#6BCB77':s.k==='english'?'#FFD93D,#FF8E53':'#9B59B6,#4D96FF')+');border-radius:5px;transition:width 0.5s;"></div></div>';
  html+='<span style="width:32px;font-size:0.7rem;color:#999;text-align:right;">'+r+'%</span>';

 });
 html+='</div>';

 html+='<div style="text-align:center;margin-bottom:12px;">';
 html+='<div style="font-size:0.8rem;font-weight:700;color:#333;margin-bottom:8px;">知识掌握度</div>';
 html+='<div style="display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center;">';
 subjs.forEach(s=>{

 });
 html+='</div></div>';
 ctn.innerHTML=html;
 }

/* ========== GUIDE SYSTEM ========== */
function showGuide(){
 const rm=document.getElementById('room');
 const steps=[
  {target:'.ri-board',text:'📋 点击公告板查看本周计划',pos:'right'},
  {target:'.ri-door',text:'🚪 点击大门外出冒险',pos:'left'},
  {target:'.ri-bag',text:'🛒 用星星购买装饰装扮小家',pos:'right'},
  {target:'.ri-tree',text:'📊 查看你的学习成长进度',pos:'bottom'},
 ];
 let idx=0;
 function showStep(){
  rm.querySelectorAll('.guide-tip,.guide-arrow').forEach(e=>e.remove());
  if(idx>=steps.length){
   toast('准备好开始学习之旅了吗？🎉');
   return;
  }
  const step=steps[idx];
  const el=rm.querySelector(step.target);
  if(!el){idx++;showStep();return;}
  const rect=el.getBoundingClientRect();
  const rmRect=rm.getBoundingClientRect();
  const tip=document.createElement('div');
  tip.className='guide-tip';
  tip.textContent=step.text;
  const arrow=document.createElement('div');
  arrow.className='guide-arrow';
  arrow.textContent='👆';
  if(step.pos==='right'){tip.style.left=(rect.left-rmRect.left+rect.width+8)+'px';tip.style.top=(rect.top-rmRect.top+rect.height/2-20)+'px';arrow.style.left=(rect.left-rmRect.left+rect.width+4)+'px';arrow.style.top=(rect.top-rmRect.top+rect.height/2-30)+'px';}
  else if(step.pos==='left'){tip.style.right=(rmRect.right-rect.left+8)+'px';tip.style.top=(rect.top-rmRect.top+rect.height/2-20)+'px';tip.style.left='auto';arrow.style.right=(rmRect.right-rect.left+4)+'px';arrow.style.top=(rect.top-rmRect.top+rect.height/2-30)+'px';arrow.style.left='auto';}
  else{tip.style.top=(rect.top-rmRect.top-50)+'px';tip.style.left=(rect.left-rmRect.left+rect.width/2-70)+'px';arrow.style.top=(rect.top-rmRect.top-35)+'px';arrow.style.left=(rect.left-rmRect.left+rect.width/2-8)+'px';}
  rm.appendChild(tip);rm.appendChild(arrow);
  sfxClick();
  setTimeout(()=>{tip.remove();arrow.remove();idx++;showStep()},2200);
 }
 showStep();
}

/* ========== TOAST ========== */
function toast(msg){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;
 document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}
