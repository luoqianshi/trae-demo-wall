<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>
  <h1>API Test</h1>
  <pre id="output">Testing...</pre>
  <script>
    async function testApi() {
      const output = document.getElementById('output');
      let results = '';
      
      try {
        // Test 1: Get project
        results += 'Test 1: Get project\n';
        const projectResponse = await fetch('http://localhost:8111/api/flowProject/get?id=project-default-001');
        const projectData = await projectResponse.json();
        results += JSON.stringify(projectData, null, 2) + '\n\n';
        
        // Test 2: List workflows
        results += 'Test 2: List workflows\n';
        const workflowResponse = await fetch('http://localhost:8111/api/workflow/list/page', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current: 1, pageSize: 200, projectId: 'project-default-001' })
        });
        const workflowData = await workflowResponse.json();
        results += JSON.stringify(workflowData, null, 2) + '\n\n';
        
        // Test 3: List templates
        results += 'Test 3: List templates\n';
        const templateResponse = await fetch('http://localhost:8111/api/workflowTemplate/list/page', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current: 1, pageSize: 100, systemTemplate: true })
        });
        const templateData = await templateResponse.json();
        results += JSON.stringify(templateData, null, 2) + '\n\n';
        
        // Test 4: Simulate Promise.all
        results += 'Test 4: Promise.all simulation\n';
        const [p1, p2, p3] = await Promise.all([
          fetch('http://localhost:8111/api/flowProject/get?id=project-default-001').then(r => r.json()),
          fetch('http://localhost:8111/api/workflow/list/page', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ current: 1, pageSize: 200, projectId: 'project-default-001' })
          }).then(r => r.json()),
          fetch('http://localhost:8111/api/workflowTemplate/list/page', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ current: 1, pageSize: 100, systemTemplate: true })
          }).then(r => r.json())
        ]);
        results += 'All promises resolved successfully\n';
        results += 'Project: ' + p1.code + ', Workflow: ' + p2.code + ', Template: ' + p3.code + '\n';
        
      } catch (error) {
        results += 'ERROR: ' + error.message + '\n' + error.stack;
      }
      
      output.textContent = results;
    }
    
    testApi();
  </script>
</body>
</html>
