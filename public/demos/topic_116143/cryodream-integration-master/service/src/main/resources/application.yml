  cookie: ${DOUYIN_COOKIE:}
  user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
# 网页正文提取：多方案责任链（jsoup -> Jina -> Scrapling）
knowledge:
  media-storage:
    root-path: ./data/knowledge-media
  web-extract:
    # 合格正文最小字符数，低于此值降级到下一级
    min-content-length: 200
    # L1：本地 jsoup + readability4j（免费、最快，适合静态页）
    jsoup:
      enabled: true
      timeout-ms: 15000
    # L2：Jina Reader（免费、支持 JS 动态页，如公众号/知乎）
    jina:
      enabled: true
      endpoint: https://r.jina.ai/
      timeout-ms: 30000
      api-key: ""
    # L3：Scrapling 爬虫微服务（强反爬，默认关闭，部署微服务后置 true）
    scrapling:
      enabled: true
      endpoint: http://localhost:8200/extract
      timeout-ms: 60000
# Neo4j 图数据库配置
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: neo4j_password
  max-connection-pool-size: 50
  connection-timeout-ms: 30000

