name: jade_lens
description: AI 玉石鉴别 APP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  
  # 相机
  camera: ^0.10.5+5
  camera_platform_interface: ^2.7.0
  
  # 网络请求
  dio: ^5.4.0
  
  # 状态管理
  provider: ^6.1.1
  
  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # 图片处理
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  
  # 权限
  permission_handler: ^11.1.0
  
  # 工具
  path: ^1.8.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
