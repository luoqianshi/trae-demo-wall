<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-body); color:var(--color-on-surface); }
.row { display:flex; gap:var(--space-2); align-items:center; margin-bottom:var(--space-2); flex-wrap:wrap; }
.label { font-size:var(--font-size-eyebrow); font-weight:var(--font-weight-eyebrow); color:var(--color-on-surface-variant); min-width:92px; white-space:nowrap; letter-spacing:.08em; text-transform:uppercase; }
.divider { border:none; border-top:1px solid var(--color-outline-variant); margin:var(--space-2) 0; }
.input-group { display:flex; flex-direction:column; gap:var(--space-1); flex-shrink:0; min-width:120px; width:280px; }
.input-group--wide { width:100%; }
.input-label { font-size:var(--font-size-caption); color:var(--color-on-surface-variant); white-space:nowrap; }
/* @component-css-start */
.input-field { width:100%; height:40px; padding:var(--space-3) var(--space-4); background:var(--color-surface-container-low); border:1.5px solid var(--color-outline-variant); border-radius:var(--radius-lg); font-family:var(--font-body); font-size:var(--font-size-body); color:var(--color-on-surface); outline:none; transition:border-color .15s,box-shadow .15s; }
.input-field::placeholder { color:var(--color-muted-foreground); }
.input-field:hover { filter:brightness(1.08); }
.input-field:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px var(--color-primary-container); }
.input-field:disabled { opacity:.5; cursor:not-allowed; filter:none; }
.textarea-field { width:100%; min-height:80px; padding:var(--space-3) var(--space-4); background:var(--color-surface-container-low); border:1.5px solid var(--color-outline-variant); border-radius:var(--radius-lg); font-family:var(--font-body); font-size:var(--font-size-body); color:var(--color-on-surface); outline:none; resize:vertical; transition:border-color .15s,box-shadow .15s; }
.textarea-field::placeholder { color:var(--color-muted-foreground); }
.textarea-field:hover { filter:brightness(1.08); }
.textarea-field:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px var(--color-primary-container); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">文本输入</span></div>
<div class="row">
  <div class="input-group" data-evidence-sample="Default Input">
    <span class="input-label">搜索</span>
    <input class="input-field" placeholder="搜索你的衣橱...">
  </div>
  <div class="input-group" data-evidence-sample="Default Input">
    <span class="input-label">场合</span>
    <input class="input-field" placeholder="描述今天的场合...">
  </div>
  <div class="input-group">
    <span class="input-label">禁用</span>
    <input class="input-field" placeholder="不可编辑" disabled>
  </div>
</div>
<hr class="divider">
<div class="row"><span class="label">多行输入</span></div>
<div class="row">
  <div class="input-group input-group--wide" data-evidence-sample="Textarea">
    <span class="input-label">风格备注</span>
    <textarea class="textarea-field" placeholder="描述今天的风格偏好、天气、心情..."></textarea>
  </div>
</div>
</body>
</html>
