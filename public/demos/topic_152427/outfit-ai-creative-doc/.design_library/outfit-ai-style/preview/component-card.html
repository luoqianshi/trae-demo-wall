<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card — AI穿搭助手</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
  .specimen { max-width: 680px; margin: 0 auto; }
  .row { display: flex; gap: var(--space-5); align-items: flex-start; margin-bottom: var(--space-3); flex-wrap: wrap; }
  .label { font-family: var(--font-body); font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-muted-foreground); letter-spacing: 0.08em; text-transform: uppercase; min-width: 92px; flex-shrink: 0; padding-top: 2px; }
  .divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-4) 0; }
  .rail { display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: flex-start; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .card { width: 260px; flex-shrink: 0; background: var(--color-card); border-radius: var(--radius-xl); padding: var(--space-5); box-shadow: var(--shadow-2); overflow: hidden; transition: box-shadow .15s, background .15s; }
  .card:hover { box-shadow: var(--shadow-3); }
  .card-img { width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: var(--space-3); display: block; }
  .card-title { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--color-on-surface); line-height: var(--line-height-h4); margin: 0 0 var(--space-2) 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-desc { font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--color-on-surface-variant); line-height: var(--line-height-body); margin: 0 0 var(--space-3) 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-tags { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: 0; }
  .card-tag { display: inline-flex; align-items: center; padding: 4px var(--space-2); background: var(--color-primary-container); color: var(--color-on-primary-container); font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); border-radius: var(--radius-full); white-space: nowrap; }
  .card-cta { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-4); background: var(--color-primary); color: var(--color-on-primary); font-size: var(--font-size-body); font-weight: var(--font-weight-body); border: none; border-radius: var(--radius-full); cursor: pointer; white-space: nowrap; transition: background .15s; min-height: var(--size-button-sm); min-width: var(--size-button-sm); }
  .card-cta:hover { background: var(--color-primary-hover); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3); }
  .card-meta { font-size: var(--font-size-caption); color: var(--color-muted-foreground); margin: 0; }
  .card--outlined { background: var(--color-surface); box-shadow: none; border: 1.5px solid var(--color-outline-variant); }
  .card--outlined:hover { background: var(--color-surface-container-low); }
  .card--elevated { background: var(--color-surface-container-high); box-shadow: var(--shadow-3); }
  .card--elevated:hover { box-shadow: var(--shadow-4); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <!-- Scene 1: Default + Outlined -->
  <div class="row">
    <span class="label">Default</span>
    <div class="rail">
      <div class="card" data-evidence-sample="Default Card">
        <img class="card-img" src="https://images.unsplash.com/photo-1591369822096-ffd140ec948f?w=400&h=300&fit=crop" alt="今日推荐穿搭">
        <div class="card-title">米色风衣+白衬衫</div>
        <div class="card-desc">适合今天天气的职场通勤搭配，简约大方又不失温度。</div>
        <div class="card-footer">
          <span class="card-meta">职场通勤</span>
          <span class="card-tag">适合今天天气</span>
        </div>
      </div>
      <div class="card card--outlined" data-evidence-sample="Outlined Card">
        <img class="card-img" src="https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=400&h=300&fit=crop" alt="单品推荐">
        <div class="card-title">衣橱单品</div>
        <div class="card-tags">
          <span class="card-tag">春季</span>
          <span class="card-tag">休闲</span>
          <span class="card-tag">基础款</span>
        </div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- Scene 2: Elevated -->
  <div class="row">
    <span class="label">Elevated</span>
    <div class="rail">
      <div class="card card--elevated" data-evidence-sample="Elevated Card">
        <img class="card-img" src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?w=400&h=300&fit=crop" alt="精选推荐">
        <div class="card-title">今日推荐</div>
        <div class="card-desc">根据你的风格偏好与今日天气，为你精选的穿搭方案，点击查看完整搭配。</div>
        <div class="card-footer">
          <span class="card-meta">每日更新</span>
          <button class="card-cta">查看搭配</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
