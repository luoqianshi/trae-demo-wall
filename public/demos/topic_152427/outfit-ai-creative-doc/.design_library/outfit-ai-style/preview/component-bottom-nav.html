<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BottomNav - AI穿搭助手</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); min-width: 92px; flex-shrink: 0; }

/* @component-css-start */
.bottom-nav { display: flex; align-items: center; justify-content: space-around; flex: 1; height: 56px; background: var(--color-surface-container); border-top: 1px solid var(--color-outline-variant); padding: var(--space-1) 0; border-radius: var(--radius-lg); }
.bottom-nav .tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); transition: background .15s; min-width: 48px; }
.bottom-nav .tab-item:hover { background: var(--color-surface-container-high); }
.bottom-nav .tab-item .tab-icon { width: var(--size-icon-lg); height: var(--size-icon-lg); color: var(--color-muted-foreground); display: flex; align-items: center; justify-content: center; transition: color .15s; }
.bottom-nav .tab-item .tab-label { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-muted-foreground); white-space: nowrap; transition: color .15s; }
.bottom-nav .tab-item.active .tab-icon { color: var(--color-primary); }
.bottom-nav .tab-item.active .tab-label { color: var(--color-primary); font-weight: var(--font-weight-h4); }
/* @component-css-end */
</style>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="row">
<span class="label">Default</span>
<nav class="bottom-nav" data-evidence-sample="Default Navigation">
  <div class="tab-item active">
    <span class="tab-icon"><i data-lucide="home" style="width:24px;height:24px;display:inline-block"></i></span>
    <span class="tab-label">首页</span>
  </div>
  <div class="tab-item">
    <span class="tab-icon"><i data-lucide="shirt" style="width:24px;height:24px;display:inline-block"></i></span>
    <span class="tab-label">衣橱</span>
  </div>
  <div class="tab-item">
    <span class="tab-icon"><i data-lucide="calendar" style="width:24px;height:24px;display:inline-block"></i></span>
    <span class="tab-label">计划</span>
  </div>
  <div class="tab-item">
    <span class="tab-icon"><i data-lucide="user" style="width:24px;height:24px;display:inline-block"></i></span>
    <span class="tab-label">我的</span>
  </div>
</nav>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
