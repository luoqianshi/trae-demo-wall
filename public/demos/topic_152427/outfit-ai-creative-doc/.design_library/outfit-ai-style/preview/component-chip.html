<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Chip</title>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); font-weight: var(--font-weight-eyebrow); text-transform: uppercase; letter-spacing: 0.08em; }
.divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-3) 0; }

/* @component-css-start */
.chip { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-caption); line-height: 1.2; white-space: nowrap; cursor: pointer; transition: background .15s; min-width: 28px; flex-shrink: 0; user-select: none; }
.chip-default { background: var(--color-surface-variant); color: var(--color-on-surface-variant); }
.chip-default:hover { filter: brightness(.92); }
.chip-active { background: var(--color-primary); color: var(--color-on-primary); }
.chip-active:hover { background: var(--color-primary-hover); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
<span class="label">默认</span>
<span class="chip chip-default" data-evidence-sample="Default Chip">职场</span>
<span class="chip chip-default" data-evidence-sample="Default Chip">休闲</span>
<span class="chip chip-default" data-evidence-sample="Default Chip">约会</span>
<span class="chip chip-default" data-evidence-sample="Default Chip">运动</span>
<span class="chip chip-default" data-evidence-sample="Default Chip">通勤</span>
</div>
<div class="row">
<span class="label">选中</span>
<span class="chip chip-active" data-evidence-sample="Active Chip">职场</span>
<span class="chip chip-active" data-evidence-sample="Active Chip">正式</span>
<span class="chip chip-active" data-evidence-sample="Active Chip">日常</span>
</div>
<hr class="divider">
<div class="row">
<span class="label">场景筛选</span>
<span class="chip chip-default">休闲</span>
<span class="chip chip-default">运动</span>
<span class="chip chip-active">职场</span>
<span class="chip chip-default">约会</span>
<span class="chip chip-default">通勤</span>
<span class="chip chip-active">正式</span>
<span class="chip chip-default">日常</span>
</div>
</body>
</html>
