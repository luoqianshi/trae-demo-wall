<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar - AI穿搭助手</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); color: var(--color-muted-foreground); letter-spacing: 0.08em; text-transform: uppercase; min-width: 92px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: 8px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--color-surface-container-low); color: var(--color-on-surface); font-family: var(--font-body); font-weight: 500; white-space: nowrap; }
.avatar-sm { width: 32px; height: 32px; min-width: 32px; font-size: var(--font-size-caption); border: 2px solid var(--color-outline-variant); }
.avatar-md { width: 40px; height: 40px; min-width: 40px; font-size: var(--font-size-body); border: 2px solid var(--color-outline-variant); }
.avatar-lg { width: var(--size-avatar-lg); height: var(--size-avatar-lg); min-width: var(--size-avatar-lg); font-size: var(--font-size-h4); border: 2px solid var(--color-outline-variant); }
.avatar-accent { border: 3px solid var(--color-primary); box-shadow: var(--shadow-2); }
.avatar-warm { background: var(--color-primary-container); color: var(--color-on-primary-container); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">默认</span>
  <div class="avatar avatar-sm">林</div>
  <div class="avatar avatar-md">小</div>
  <div class="avatar avatar-lg">林</div>
</div>
<div class="row">
  <span class="label">高亮</span>
  <div class="avatar avatar-lg avatar-accent">林</div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">暖色背景</span>
  <div class="avatar avatar-sm avatar-warm">林</div>
  <div class="avatar avatar-md avatar-warm">小</div>
  <div class="avatar avatar-lg avatar-warm">林</div>
</div>
</body>
</html>
