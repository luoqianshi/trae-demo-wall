<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { min-width: 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-3) 0; }

/* @component-css-start */
.btn { display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-family: var(--font-body); font-size: var(--font-size-body); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; transition: background .15s, border-color .15s, filter .15s; flex-shrink: 0; }
.btn.primary { background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-lg); font-weight: 600; }
.btn.primary:hover { background: var(--color-primary-hover); }
.btn.secondary { background: var(--color-surface-variant); color: var(--color-on-surface); border-radius: var(--radius-lg); }
.btn.secondary:hover { filter: brightness(1.08); }
.btn.outline { background: transparent; color: var(--color-on-surface); border-radius: var(--radius-lg); border: 1.5px solid var(--color-outline); }
.btn.outline:hover { background: var(--color-surface-container-low); }
.btn.ghost { background: transparent; color: var(--color-primary); border-radius: var(--radius-full); }
.btn.ghost:hover { background: var(--color-primary-container); }
.btn.sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 6px 14px; font-size: var(--font-size-caption); }
.btn.md { height: var(--size-button-md); min-width: var(--size-button-md); padding: var(--space-3) var(--space-5); }
.btn.lg { height: var(--size-button-lg); min-width: var(--size-button-lg); padding: var(--space-4) 32px; font-size: var(--font-size-lead); font-weight: 600; }
.btn.outline.md { padding: 11px 23px; }
.btn.ghost.md { padding: var(--space-2) var(--space-4); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Primary</span><button class="btn primary md">确认穿搭</button></div>
<div class="row"><span class="label">Secondary</span><button class="btn secondary md">换一套</button></div>
<div class="row"><span class="label">Outline</span><button class="btn outline md">跳过</button></div>
<div class="row"><span class="label">Ghost</span><button class="btn ghost md">收藏</button></div>
<hr class="divider">
<div class="row"><span class="label">SM / MD / LG</span><button class="btn primary sm">确认穿搭</button><button class="btn primary md">确认穿搭</button><button class="btn primary lg">确认穿搭</button></div>
</body>
</html>
