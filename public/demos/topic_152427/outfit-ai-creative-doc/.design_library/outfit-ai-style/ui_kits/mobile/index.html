<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI穿搭助手 UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* ── Page Layer ── */
.uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;padding:var(--space-7) var(--space-5)}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}

/* ── Phone Stage ── */
.phone-stage{display:flex;justify-content:center;align-items:flex-start;gap:var(--space-7);padding:var(--space-6) 0}
.phone-frame{width:390px;min-width:390px;height:780px;border-radius:44px;border:6px solid var(--outfit-neutral-800);overflow:hidden;position:relative;box-shadow:var(--shadow-5);flex-shrink:0;background:var(--color-background)}
.phone-frame-inner{border-radius:inherit;overflow:hidden;height:100%;display:flex;flex-direction:column;background:var(--color-background)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:var(--outfit-neutral-800);border-radius:0 0 18px 18px;z-index:10}
.phone-status-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0;height:48px;font-size:var(--font-size-caption);font-weight:600;color:var(--color-on-surface);flex-shrink:0;position:relative;z-index:5}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:var(--color-on-surface);opacity:.25;border-radius:var(--radius-full)}

/* ── Screen Content ── */
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--space-4) var(--space-5);-webkit-overflow-scrolling:touch}
.screen-header{padding:var(--space-3) var(--space-4) var(--space-4);flex-shrink:0}

/* ── App Internal Layout ── */
.app-greeting{margin-bottom:var(--space-3)}
.app-chip-row{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-4)}
.app-search{margin-bottom:var(--space-4)}
.app-card-stack{display:flex;flex-direction:column;gap:var(--space-4)}
.app-profile-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5)}
.app-profile-info{flex:1;min-width:0}
.app-section{margin-bottom:var(--space-5)}
.app-outfit-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.app-mini-card{background:var(--color-card);border-radius:var(--radius-lg);padding:var(--space-3);box-shadow:var(--shadow-1);overflow:hidden}
.app-mini-card img{width:100%;height:80px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:var(--space-2);display:block}

/* ── Side Info Panel ── */
.info-panel{max-width:320px;flex-shrink:0}
.info-title{margin-bottom:var(--space-3)}
.info-desc{margin-bottom:var(--space-5)}
.info-tag-list{display:flex;flex-direction:column;gap:var(--space-2)}
.info-tag-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-body);color:var(--color-on-surface-variant)}
.info-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Responsive ── */
@media(max-width:900px){.phone-stage{flex-direction:column;align-items:center}.info-panel{max-width:390px}}
@media(max-width:640px){.phone-frame{width:100%;min-width:0;max-width:390px;height:auto;min-height:680px}.uikit-shell{padding:var(--space-4)}}
@media(prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important;animation-duration:0.01ms!important}}
</style>
</head>
<body>
<div class="uikit-shell" data-layout-guard="uikit-v1" id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ── Icon helper ── */
function Icon({ name, size = 24 }) {
  return React.createElement('i', {
    'data-lucide': name,
    style: { width: size + 'px', height: size + 'px', display: 'inline-block' }
  });
}

/* ── Status Bar ── */
function StatusBar() {
  return (
    <div className="phone-status-bar">
      <span>9:41</span>
      <span className="uikit-nowrap" style={{ display:'flex', gap:'4px', alignItems:'center' }}>
        <Icon name="signal" size={14} />
        <Icon name="wifi" size={14} />
        <Icon name="battery-full" size={14} />
      </span>
    </div>
  );
}

/* ── Screen 1: Home Feed ── */
function HomeScreen() {
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <StatusBar />
      <div className="screen-header">
        <div className="app-greeting">
          <p className="outfit-eyebrow" style={{ color:'var(--color-muted-foreground)', marginBottom:'var(--space-1)' }}>周三, 6月30日</p>
          <h1 className="outfit-h3" style={{ color:'var(--color-on-surface)', margin:0, wordBreak:'keep-all', textWrap:'balance' }}>今天穿什么？</h1>
        </div>
        <div className="app-search" data-component="input">
          <input className="input-field" type="text" placeholder="搜索衣橱或场合..." disabled />
        </div>
        <div className="app-chip-row" data-component="chip">
          <span className="chip chip-active">职场</span>
          <span className="chip chip-default">休闲</span>
          <span className="chip chip-default">约会</span>
          <span className="chip chip-default">运动</span>
        </div>
      </div>
      <div className="screen-body">
        <div className="app-card-stack">
          <div data-component="card" className="card" style={{ width:'100%' }}>
            <img className="card-img" src="https://images.unsplash.com/photo-1591369822096-ffd140ec948f?w=400&h=300&fit=crop" alt="米色风衣搭配" />
            <h3 className="card-title">米色风衣+白衬衫</h3>
            <p className="card-desc">经典职场搭配，温柔又有气场。适合今天的外部会议场合。</p>
            <div className="card-tags">
              <span className="card-tag">职场</span>
              <span className="card-tag">温柔</span>
            </div>
            <div className="card-footer">
              <p className="card-meta">3件单品</p>
              <button className="card-cta" data-component="button">确认穿搭</button>
            </div>
          </div>
          <div data-component="card" className="card card--elevated" style={{ width:'100%' }}>
            <h3 className="card-title">碎花连衣裙+针织开衫</h3>
            <p className="card-desc">周末下午茶的完美选择，浪漫又不失休闲感。</p>
            <div className="card-tags">
              <span className="card-tag">休闲</span>
              <span className="card-tag">约会</span>
            </div>
            <div className="card-footer">
              <p className="card-meta">2件单品</p>
              <button className="btn ghost sm" data-component="button">换一套</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Screen 2: Outfit Plans ── */
function PlansScreen() {
  const outfits = [
    { title: '职场通勤', desc: '西装外套+高腰阔腿裤', tag: '职场', items: 4 },
    { title: '周末闲逛', desc: '条纹T恤+牛仔半裙', tag: '休闲', items: 3 },
    { title: '浪漫晚餐', desc: '丝绒吊带裙+高跟鞋', tag: '约会', items: 3 },
    { title: '运动晨跑', desc: '速干套装+运动鞋', tag: '运动', items: 2 },
  ];
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <StatusBar />
      <div className="screen-header">
        <h1 className="outfit-h3" style={{ color:'var(--color-on-surface)', margin:0, wordBreak:'keep-all' }}>搭配方案</h1>
        <div className="app-search" data-component="input">
          <input className="input-field" type="text" placeholder="输入场合或心情..." />
        </div>
      </div>
      <div className="screen-body">
        <div className="app-outfit-grid">
          {outfits.map((o, i) => (
            <div key={i} className="app-mini-card" data-component="card">
              <img src={`https://images.unsplash.com/photo-1558171813-4c088753af8f?w=300&h=200&fit=crop&crop=top`} alt={o.title} />
              <h4 className="outfit-h4" style={{ margin:'0 0 4px 0', fontSize:'var(--font-size-body)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{o.title}</h4>
              <p className="outfit-caption" style={{ margin:'0 0 8px 0', color:'var(--color-on-surface-variant)', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>{o.desc}</p>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span className="chip chip-default" style={{ fontSize:'10px', padding:'3px 10px' }} data-component="chip">{o.tag}</span>
                <span className="outfit-caption" style={{ color:'var(--color-muted-foreground)' }}>{o.items}件</span>
              </div>
            </div>
          ))}
        </div>
        <div style={{ marginTop:'var(--space-4)', display:'flex', gap:'var(--space-3)', justifyContent:'center' }}>
          <button className="btn outline sm" data-component="button">查看更多</button>
          <button className="btn primary sm" data-component="button">生成方案</button>
        </div>
      </div>
    </div>
  );
}

/* ── Screen 3: My Profile ── */
function ProfileScreen() {
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <StatusBar />
      <div className="screen-header">
        <h1 className="outfit-h3" style={{ color:'var(--color-on-surface)', margin:0, wordBreak:'keep-all' }}>我的</h1>
      </div>
      <div className="screen-body">
        <div className="app-profile-header" data-component="avatar">
          <div className="avatar avatar-lg avatar-accent">林</div>
          <div className="app-profile-info">
            <h2 className="outfit-h4" style={{ margin:'0 0 2px 0', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>小林</h2>
            <p className="outfit-caption" style={{ margin:0, color:'var(--color-muted-foreground)' }}>已搭配 128 套穿搭</p>
          </div>
          <button className="btn ghost sm" data-component="button" style={{ flexShrink:0 }}>编辑</button>
        </div>

        <div className="app-section" data-component="input">
          <label className="outfit-caption" style={{ display:'block', marginBottom:'var(--space-2)', color:'var(--color-on-surface-variant)' }}>风格备注</label>
          <textarea className="textarea-field" placeholder="记录你的风格偏好，比如喜欢温暖色系..." rows={3}></textarea>
        </div>

        <div className="app-section">
          <h4 className="outfit-eyebrow" style={{ marginBottom:'var(--space-3)', color:'var(--color-muted-foreground)' }}>常用标签</h4>
          <div className="app-chip-row" data-component="chip">
            <span className="chip chip-active">职场</span>
            <span className="chip chip-default">温柔</span>
            <span className="chip chip-default">极简</span>
            <span className="chip chip-default">通勤</span>
            <span className="chip chip-default">约会</span>
          </div>
        </div>

        <div className="app-section">
          <div data-component="card" className="card card--outlined" style={{ width:'100%' }}>
            <div style={{ display:'flex', alignItems:'center', gap:'var(--space-3)' }}>
              <div className="avatar avatar-sm" data-component="avatar" style={{ flexShrink:0 }}>AI</div>
              <div style={{ flex:1, minWidth:0 }}>
                <h4 className="outfit-h4" style={{ margin:'0 0 2px 0', fontSize:'var(--font-size-body)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>AI穿搭助手</h4>
                <p className="outfit-caption" style={{ margin:0, color:'var(--color-muted-foreground)' }}>每天为你推荐合适的穿搭方案</p>
              </div>
            </div>
          </div>
        </div>

        <div style={{ display:'flex', gap:'var(--space-3)' }}>
          <button className="btn secondary md" data-component="button" style={{ flex:1 }}>换一套</button>
          <button className="btn primary md" data-component="button" style={{ flex:1 }}>确认穿搭</button>
        </div>
      </div>
    </div>
  );
}

/* ── App Shell ── */
function AppShell() {
  const [screen, setScreen] = useState(0);
  const screens = [
    { label: '首页', icon: 'home', component: HomeScreen },
    { label: '今日穿搭', icon: 'shirt', component: PlansScreen },
    { label: '搭配方案', icon: 'palette', component: PlansScreen },
    { label: '我的', icon: 'user', component: ProfileScreen },
  ];
  const ActiveComponent = screens[screen].component;
  return (
    <div className="phone-frame">
      <div className="phone-notch"></div>
      <div className="phone-frame-inner">
        <ActiveComponent />
        <nav className="bottom-nav" data-component="bottom-nav">
          {screens.map((s, i) => (
            <div key={i} className={`tab-item ${i === screen ? 'active' : ''}`} onClick={() => setScreen(i)}>
              <span className="tab-icon"><Icon name={s.icon} /></span>
              <span className="tab-label">{s.label}</span>
            </div>
          ))}
        </nav>
        <div className="phone-home-indicator"></div>
      </div>
    </div>
  );
}

/* ── Info Panel (side context for desktop) ── */
function InfoPanel() {
  return (
    <div className="info-panel">
      <h2 className="outfit-display" style={{ color:'var(--color-primary)', margin:0, fontSize:'36px', lineHeight:1.2 }}>
        AI穿搭助手
      </h2>
      <p className="outfit-h4" style={{ color:'var(--color-on-surface)', margin:'var(--space-2) 0 0 0' }}>
        每日穿搭推荐 · 设计系统展示
      </p>
      <p className="outfit-body" style={{ color:'var(--color-on-surface-variant)', margin:'var(--space-4) 0 var(--space-5) 0', lineHeight:'var(--line-height-lead)' }}>
        温暖、亲切、手绘风线条的微信小程序，像闺蜜一样帮你每天挑选合适的穿搭。赤陶色与玫瑰金的暖色调贯穿整个设计系统。
      </p>
      <h4 className="outfit-eyebrow" style={{ color:'var(--color-muted-foreground)', marginBottom:'var(--space-3)' }}>组件一览</h4>
      <div className="info-tag-list">
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--color-primary)' }}></span> Button — 4 种风格变体</div>
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--color-secondary)' }}></span> Card — 3 种表面变体</div>
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--color-primary)' }}></span> BottomNav — 4 标签导航</div>
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--outfit-brown-400)' }}></span> Input — 文本输入与文本域</div>
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--color-secondary)' }}></span> Avatar — 3 种尺寸</div>
        <div className="info-tag-item"><span className="info-dot" style={{ background:'var(--color-primary)' }}></span> Chip — 场合筛选标签</div>
      </div>
    </div>
  );
}

/* ── Root ── */
function Root() {
  return (
    <div>
      <div className="phone-stage">
        <AppShell />
        <InfoPanel />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
lucide.createIcons();
</script>
</body>
</html>
