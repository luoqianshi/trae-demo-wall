<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCP/UDP 测试</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

:root {
  /* === Primary Palette — Dark Sci-Fi with Purple === */
  --color-bg-primary: #0d0f1a;
  --color-bg-secondary: #131525;
  --color-bg-surface: #1a1d32;
  --color-bg-elevated: #222640;
  --color-bg-hover: #2a2f4a;

  /* === Purple Accent System === */
  --color-accent-primary: #8b5cf6;
  --color-accent-light: #a78bfa;
  --color-accent-lighter: #c4b5fd;
  --color-accent-dark: #7c3aed;
  --color-accent-darker: #6d28d9;
  --color-accent-glow: rgba(139, 92, 246, 0.25);

  /* === Cyan/Tech Secondary === */
  --color-tech-cyan: #22d3ee;
  --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
  --color-tech-green: #34d399;
  --color-tech-green-dim: rgba(52, 211, 153, 0.15);

  /* === Semantic Status Colors === */
  --state-success: #34d399;
  --state-warning: #fbbf24;
  --state-error: #f87171;
  --state-info: #60a5fa;

  /* === Text System === */
  --color-text-primary: #f1f5f9;
  --color-text-secondary: #94a3b8;
  --color-text-muted: #64748b;
  --color-text-inverse: #0f172a;

  /* === Border System === */
  --color-border: #2d3148;
  --color-border-active: #8b5cf6;
  --color-border-subtle: #1e2236;

  /* === Typography === */
  --font-family-display: 'Inter', system-ui, -apple-system, sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --font-family-body: 'Inter', system-ui, -apple-system, sans-serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.875rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;

  /* === Spacing Scale === */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;

  /* === Radius === */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
  --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
}

html.dark { --color-bg-primary:#0d0f1a; --color-bg-secondary:#131525; --color-bg-surface:#1a1d32; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family-body); background: var(--color-bg-primary); color: var(--color-text-primary); }

/* === Utility Classes === */
.etp-font-display { font-family: var(--font-family-display); }
.etp-font-mono { font-family: var(--font-family-mono); }
.etp-font-body { font-family: var(--font-family-body); }
.etp-text-accent { color: var(--color-accent-primary); }
.etp-text-cyan { color: var(--color-tech-cyan); }
.etp-text-green { color: var(--color-tech-green); }
.etp-text-muted { color: var(--color-text-secondary); }
.etp-bg-surface { background-color: var(--color-bg-surface); }
.etp-bg-elevated { background-color: var(--color-bg-elevated); }
.etp-border-glow { border: 1px solid var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-card-hover { transition: all 0.2s ease; }
.etp-card-hover:hover { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
.etp-grid-bg {
  background-image:
    linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
.etp-scanline::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 92, 246, 0.015) 2px, rgba(139, 92, 246, 0.015) 4px);
  pointer-events: none;
}

/* LED indicator */
.etp-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.etp-led-green { background: var(--state-success); box-shadow: 0 0 6px var(--state-success); }
.etp-led-red { background: var(--state-error); box-shadow: 0 0 6px var(--state-error); }
.etp-led-yellow { background: var(--state-warning); box-shadow: 0 0 6px var(--state-warning); }
@keyframes etp-led-breathe { 0%,100%{opacity:1} 50%{opacity:.5} }

.etp-btn-tool {
  background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); cursor: pointer; transition: all 0.15s ease;
}
.etp-btn-tool:hover { background: var(--color-bg-hover); border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }

.etp-statusbar { background: var(--color-bg-secondary); border-top: 1px solid var(--color-border); padding: var(--space-1) var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* shared form controls */
.etp-input, .etp-select {
  width: 100%; background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-family: var(--font-family-mono); outline: none; transition: border-color .15s;
}
.etp-input:focus, .etp-select:focus { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-label { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* toggle switch */
.etp-toggle { position: relative; display: inline-block; width: 34px; height: 18px; }
.etp-toggle input { opacity: 0; width: 0; height: 0; }
.etp-toggle-track { position: absolute; cursor: pointer; inset: 0; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-full); transition: .2s; }
.etp-toggle-track::before { content: ''; position: absolute; height: 12px; width: 12px; left: 2px; top: 2px; background: var(--color-text-muted); border-radius: 50%; transition: .2s; }
.etp-toggle input:checked + .etp-toggle-track { background: rgba(139,92,246,.25); border-color: var(--color-accent-primary); }
.etp-toggle input:checked + .etp-toggle-track::before { transform: translateX(16px); background: var(--color-accent-primary); box-shadow: 0 0 6px var(--color-accent-primary); }

/* scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--color-bg-primary); }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-accent-primary); }

    html,body{height:100%} body{display:flex;flex-direction:column;overflow:hidden}
    [data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}

    .topbar{background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);height:44px;display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-4);flex-shrink:0;font-family:var(--font-family-mono)}
    .topbar .title{font-weight:700;color:var(--color-accent-light);letter-spacing:.04em;display:flex;align-items:center;gap:var(--space-2)}
    .sep{width:1px;height:24px;background:var(--color-border)}
    .seg{display:flex;background:var(--color-bg-primary);border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden}
    .seg button{background:transparent;border:none;color:var(--color-text-muted);padding:var(--space-1) var(--space-3);font-size:var(--font-size-xs);cursor:pointer;font-family:var(--font-family-mono);font-weight:600;transition:all .15s}
    .seg button.active{background:rgba(139,92,246,.2);color:var(--color-accent-light)}
    .metric{display:flex;align-items:center;gap:var(--space-2)}
    .metric .l{font-size:var(--font-size-xs);color:var(--color-text-muted);text-transform:uppercase}
    .metric .v{font-size:var(--font-size-sm);color:var(--color-text-primary)}
    .btn-toggle{display:flex;align-items:center;gap:var(--space-2);background:var(--color-bg-elevated);border:1px solid var(--color-border);color:var(--color-text-primary);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:600;cursor:pointer;transition:all .2s}
    .btn-toggle:hover{border-color:var(--color-accent-primary);box-shadow:var(--shadow-glow)}
    .btn-toggle.running{background:rgba(248,113,113,.15);border-color:var(--state-error);color:var(--state-error)}

    .layout{display:flex;flex:1;overflow:hidden}
    .panel{background:var(--color-bg-secondary);overflow-y:auto}
    .panel-left{width:260px;flex-shrink:0;border-right:1px solid var(--color-border)}
    .panel-right{width:260px;flex-shrink:0;border-left:1px solid var(--color-border)}
    .panel-mid{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--color-bg-primary)}

    .section-h{font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);margin:0 0 var(--space-2);font-family:var(--font-family-mono);display:flex;align-items:center;gap:6px}
    .section-h::before{content:'';width:3px;height:12px;background:var(--color-accent-primary);border-radius:2px}
    .panel-block{padding:var(--space-3);border-bottom:1px solid var(--color-border-subtle)}
    .field{margin-bottom:var(--space-2)}
    .field label{display:block;font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
    .row{display:flex;gap:var(--space-2)} .row>*{flex:1}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:var(--space-2)}

    .conn-tabs{display:flex;gap:0;border-bottom:1px solid var(--color-border-subtle);background:var(--color-bg-secondary);flex-shrink:0;overflow-x:auto}
    .conn-tab{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);font-size:var(--font-size-xs);color:var(--color-text-muted);cursor:pointer;border-bottom:2px solid transparent;border-right:1px solid var(--color-border-subtle);white-space:nowrap;font-family:var(--font-family-mono)}
    .conn-tab:hover{color:var(--color-text-secondary);background:var(--color-bg-hover)}
    .conn-tab.active{color:var(--color-accent-light);border-bottom-color:var(--color-accent-primary);background:var(--color-bg-primary)}
    .conn-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--state-success);box-shadow:0 0 5px var(--state-success)}
    .conn-tab .dot.off{background:var(--color-text-muted);box-shadow:none}
    .conn-tab .x{color:var(--color-text-muted);font-size:14px;padding:0 2px}
    .conn-tab .x:hover{color:var(--state-error)}
    .conn-add{padding:var(--space-2) var(--space-3);color:var(--color-text-muted);cursor:pointer;font-size:var(--font-size-xs)}
    .conn-add:hover{color:var(--color-accent-light)}

    .term-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border-subtle);font-size:var(--font-size-xs);color:var(--color-text-muted);flex-shrink:0;flex-wrap:wrap}
    .term-head label{display:flex;align-items:center;gap:4px;cursor:pointer}
    .term-head .endpoint{font-family:var(--font-family-mono);color:var(--color-accent-light)}
    .terminal{flex:1;background:#0a0c14;border:1px solid var(--color-border);border-radius:var(--radius-md);margin:var(--space-3);overflow-y:auto;padding:var(--space-3);font-family:var(--font-family-mono);font-size:12px;line-height:1.55;position:relative}
    .terminal .rx{color:var(--color-tech-green)} .terminal .tx{color:var(--color-tech-cyan)} .terminal .err{color:var(--state-error)} .terminal .sys{color:var(--color-text-muted)} .terminal .info{color:var(--color-accent-light)}
    .terminal .ts{color:var(--color-text-muted);margin-right:6px}
    .send-bar{display:flex;gap:var(--space-2);padding:0 var(--space-3) var(--space-3);flex-shrink:0}
    .send-bar input{flex:1}
    .btn-primary{background:linear-gradient(135deg,var(--color-accent-primary),var(--color-accent-dark));border:none;color:#fff;padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-family:var(--font-family-display);font-size:var(--font-size-sm);transition:all .15s;white-space:nowrap}
    .btn-primary:hover{box-shadow:var(--shadow-glow)}
    .btn-sm{background:var(--color-bg-elevated);border:1px solid var(--color-border);color:var(--color-text-primary);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--font-size-xs);cursor:pointer;transition:all .15s;font-family:var(--font-family-body)}
    .btn-sm:hover{background:var(--color-bg-hover);border-color:var(--color-accent-primary)}

    .log{font-family:var(--font-family-mono);font-size:11px;line-height:1.5;padding:var(--space-2)}
    .log .row-l{display:flex;gap:var(--space-2);padding:1px 0}
    .log .ts{color:var(--color-text-muted);flex-shrink:0}
    .log .ev{flex-shrink:0;font-weight:600;width:44px}
    .log .ev.con{color:var(--state-success)} .log .ev.dis{color:var(--state-error)} .log .ev.tx{color:var(--color-tech-cyan)} .log .ev.rx{color:var(--color-tech-green)} .log .ev.err{color:var(--state-warning)}
    .log .info{color:var(--color-text-secondary)}

    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
    .stat-cell{background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:var(--space-2)}
    .stat-cell .l{font-size:10px;color:var(--color-text-muted);text-transform:uppercase}
    .stat-cell .v{font-family:var(--font-family-mono);font-size:var(--font-size-md);font-weight:600}

    .hex-view{background:var(--color-bg-primary);border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:var(--space-2);font-family:var(--font-family-mono);font-size:10px;line-height:1.6;max-height:160px;overflow-y:auto}
    .hex-row{display:flex;gap:var(--space-2)}
    .hex-offset{color:var(--color-accent-light);min-width:3.5em}
    .hex-bytes{color:var(--color-text-primary);letter-spacing:.05em}
    .hex-ascii{color:var(--color-tech-cyan)}

    .preset{display:flex;gap:var(--space-1);flex-wrap:wrap}
    .preset button{background:var(--color-bg-elevated);border:1px solid var(--color-border);color:var(--color-text-secondary);padding:3px 8px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;font-family:var(--font-family-mono)}
    .preset button:hover{border-color:var(--color-accent-primary);color:var(--color-accent-light)}

    @media(max-width:900px){
      body{overflow:auto}
      .layout{flex-direction:column;overflow:visible}
      .panel-left,.panel-right{width:100%;border-right:none;border-left:none;border-bottom:1px solid var(--color-border)}
      .panel-mid{min-height:420px}
      .topbar{flex-wrap:wrap;height:auto;padding:var(--space-2) var(--space-4)}
    }
  </style>
</head>
<body class="etp-grid-bg">
  <header class="topbar">
    <span class="title"><i data-lucide="network" style="width:16px;height:16px"></i> TCP/UDP 测试</span>
    <div class="sep"></div>
    <div class="seg" id="protoSeg">
      <button class="active" data-proto="tcp" onclick="setProto('tcp')">TCP</button>
      <button data-proto="udp" onclick="setProto('udp')">UDP</button>
    </div>
    <div class="seg" id="roleSeg">
      <button class="active" data-role="client" onclick="setRole('client')">Client</button>
      <button data-role="server" onclick="setRole('server')">Server</button>
    </div>
    <div class="sep"></div>
    <button class="btn-toggle" id="startBtn" onclick="toggleConn()"><span class="etp-led" id="connLed" style="background:var(--color-text-muted);box-shadow:none"></span><span id="startLabel">连接</span></button>
    <div class="sep"></div>
    <div class="metric"><span class="l">端点</span><span class="v" id="endpointDisp" style="color:var(--color-tech-cyan)">—</span></div>
    <div class="sep"></div>
    <div class="metric"><span class="l">连接数</span><span class="v" id="connCount" style="color:var(--color-accent-light)">0</span></div>
    <div style="flex:1"></div>
    <div class="metric"><span class="l">UPTIME</span><span class="v" id="uptime" style="color:var(--color-tech-green)">00:00:00</span></div>
  </header>

  <div class="layout">
    <!-- LEFT: config + log -->
    <aside class="panel panel-left">
      <div class="panel-block">
        <div class="section-h">连接配置</div>
        <div class="field">
          <label id="hostLabel">远程主机 Host</label>
          <input class="etp-input" id="host" value="192.168.1.100">
        </div>
        <div class="row">
          <div class="field" style="flex:1">
            <label>端口 Port</label>
            <input class="etp-input" id="port" value="8080">
          </div>
          <div class="field" style="flex:1">
            <label>本地端口</label>
            <input class="etp-input" id="localPort" value="0" placeholder="auto">
          </div>
        </div>
        <div class="field">
          <label>超时 (s)</label>
          <input class="etp-input" value="30">
        </div>
        <div class="toggle-row"><span>TCP Keep-Alive</span><label class="etp-toggle"><input type="checkbox" checked id="keepAlive"><span class="etp-toggle-track"></span></label></div>
        <div class="toggle-row"><span>Nagle 算法</span><label class="etp-toggle"><input type="checkbox"><span class="etp-toggle-track"></span></label></div>
        <div class="toggle-row"><span>广播 (UDP)</span><label class="etp-toggle"><input type="checkbox"><span class="etp-toggle-track"></span></label></div>
      </div>

      <div class="panel-block">
        <div class="section-h">连接日志</div>
        <div class="log" id="connLog"></div>
      </div>
    </aside>

    <!-- CENTER: connection tabs + terminal -->
    <section class="panel-mid">
      <div class="conn-tabs" id="connTabs">
        <div class="conn-tab active" data-id="0" onclick="selectConn(0)"><span class="dot off" id="dot0"></span><span>conn-1</span><span style="color:var(--color-text-muted)">192.168.1.100:8080</span></div>
        <div class="conn-add" onclick="addConn()">+ 新建</div>
      </div>

      <div class="term-head">
        <span>当前: <span class="endpoint" id="curEp">192.168.1.100:8080</span></span>
        <label><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
        <label><input type="checkbox" id="showTs"> 时间戳</label>
        <label><input type="checkbox" id="showHex"> Hex视图</label>
        <label><input type="checkbox" id="addNl"> 发送加换行</label>
        <div style="flex:1"></div>
        <button class="btn-sm" onclick="clearTerm()">清空</button>
      </div>

      <div class="terminal" id="term"></div>

      <div class="send-bar">
        <select class="etp-select" style="width:90px" id="sendMode"><option value="text">ASCII</option><option value="hex">HEX</option></select>
        <input class="etp-input" id="sendInput" placeholder="输入要发送的数据 (Hex 用空格分隔)" onkeydown="if(event.key==='Enter')sendData()">
        <button class="btn-primary" onclick="sendData()">发送</button>
      </div>
    </section>

    <!-- RIGHT: stats + hex + presets -->
    <aside class="panel panel-right">
      <div class="panel-block">
        <div class="section-h">统计</div>
        <div class="stat-grid">
          <div class="stat-cell"><div class="l">RX bytes</div><div class="v" id="rxB" style="color:var(--color-tech-green)">0</div></div>
          <div class="stat-cell"><div class="l">TX bytes</div><div class="v" id="txB" style="color:var(--color-tech-cyan)">0</div></div>
          <div class="stat-cell"><div class="l">RX frames</div><div class="v" id="rxF">0</div></div>
          <div class="stat-cell"><div class="l">TX frames</div><div class="v" id="txF">0</div></div>
        </div>
      </div>
      <div class="panel-block">
        <div class="section-h">最近接收 (Hex)</div>
        <div class="hex-view" id="hexView"><div class="hex-row" style="color:var(--color-text-muted)">尚无数据</div></div>
      </div>
      <div class="panel-block">
        <div class="section-h">快速发送</div>
        <div class="preset">
          <button onclick="quickSend('HELLO\\r\\n')">HELLO</button>
          <button onclick="quickSend('PING')">PING</button>
          <button onclick="quickSend('GET / HTTP/1.0\\r\\n\\r\\n')">HTTP GET</button>
          <button onclick="quickSend('AA BB CC DD')">AABBCCDD</button>
          <button onclick="quickSend('{\\\"cmd\\\":\\\"status\\\"}')">status</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    ETP.initWindow();
    let proto='tcp', role='client', running=false, startedAt=null, uptimeSec=0;
    let activeConn=0;
    let stats={rxB:0,txB:0,rxF:0,txF:0};
    let conns=[{id:0,name:'conn-1',host:'192.168.1.100',port:'8080',on:false,rx:0,tx:0}];
    const termBuf={0:[]};

    function setProto(p){proto=p;document.querySelectorAll('#protoSeg button').forEach(b=>b.classList.toggle('active',b.dataset.proto===p));updateEndpoint();addLog('info','协议切换为 '+p.toUpperCase());}
    function setRole(r){role=r;document.querySelectorAll('#roleSeg button').forEach(b=>b.classList.toggle('active',b.dataset.role===r));document.getElementById('hostLabel').textContent = r==='client'?'远程主机 Host':'监听地址 Bind';updateEndpoint();addLog('info','角色切换为 '+r);}
    function updateEndpoint(){
      const c=conns[activeConn]||conns[0];
      const ep = role==='client' ? `${c.host}:${c.port}` : `0.0.0.0:${c.port}`;
      document.getElementById('endpointDisp').textContent = ep;
      document.getElementById('curEp').textContent = ep;
    }
    function toggleConn(){
      running=!running;
      const btn=document.getElementById('startBtn'),led=document.getElementById('connLed'),label=document.getElementById('startLabel');
      if(running){
        btn.classList.add('running');label.textContent = role==='client'?'断开':'停止';led.style.background='var(--state-success)';led.style.boxShadow='0 0 6px var(--state-success)';
        startedAt=Date.now();
        conns[activeConn].on=true;
        document.getElementById('dot'+activeConn)?.classList.remove('off');
        addLog('con',`${proto.toUpperCase()} ${role} 已${role==='client'?'连接':'监听'} ${document.getElementById('endpointDisp').textContent}`);
        termLine('sys',`[${proto.toUpperCase()}] ${role==='client'?'已连接到':'开始监听'} ${document.getElementById('endpointDisp').textContent}`);
      }else{
        btn.classList.remove('running');label.textContent='连接';led.style.background='var(--color-text-muted)';led.style.boxShadow='none';
        startedAt=null;
        conns.forEach(c=>c.on=false);
        document.querySelectorAll('.conn-tab .dot').forEach(d=>d.classList.add('off'));
        addLog('dis','连接已断开');
        termLine('sys',`[${proto.toUpperCase()}] 连接已断开`);
      }
      updateConnCount();
    }
    function updateConnCount(){document.getElementById('connCount').textContent=conns.filter(c=>c.on).length;}

    function selectConn(id){
      activeConn=id;
      document.querySelectorAll('.conn-tab').forEach(t=>t.classList.toggle('active',t.dataset.id==id));
      updateEndpoint();
    }
    function addConn(){
      const id=conns.length;
      const n=prompt('新建连接 - 远程地址 (host:port)', '192.168.1.100:8080');
      if(!n)return;
      const [host,port]=n.split(':');
      conns.push({id,name:'conn-'+(id+1),host:host||'192.168.1.100',port:port||'8080',on:false,rx:0,tx:0});
      termBuf[id]=[];
      const bar=document.getElementById('connTabs');
      const addEl=bar.querySelector('.conn-add');
      const tab=document.createElement('div');tab.className='conn-tab';tab.dataset.id=id;tab.onclick=()=>selectConn(id);
      tab.innerHTML=`<span class="dot off" id="dot${id}"></span><span>conn-${id+1}</span><span style="color:var(--color-text-muted)">${host}:${port}</span><span class="x" onclick="event.stopPropagation();closeConn(${id})">×</span>`;
      bar.insertBefore(tab,addEl);
      addLog('info','新建连接 '+n);
    }
    function closeConn(id){
      if(conns.length<=1)return;
      conns=conns.filter(c=>c.id!==id);
      const tab=document.querySelector(`.conn-tab[data-id="${id}"]`);if(tab)tab.remove();
      if(activeConn===id)selectConn(conns[0].id);
      addLog('dis','已关闭连接 #'+(id+1));
      updateConnCount();
    }

    function fmtUp(s){return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
    function termLine(cls,text){
      const t=document.getElementById('term');
      const div=document.createElement('div');
      if(cls==='sys'||document.getElementById('showTs')?.checked){const s=document.createElement('span');s.className='ts';s.textContent=ETP.util.ts()+' ';div.appendChild(s);}
      const sp=document.createElement('span');sp.className=cls;sp.textContent=text;div.appendChild(sp);
      t.appendChild(div);
      if(document.getElementById('autoScroll').checked) t.scrollTop=t.scrollHeight;
      while(t.childNodes.length>2000) t.removeChild(t.firstChild);
    }
    function addLog(ev,info){
      const log=document.getElementById('connLog');
      const row=document.createElement('div');row.className='row-l';
      row.innerHTML=`<span class="ts">${ETP.util.ts()}</span><span class="ev ${ev}">${ev.toUpperCase()}</span><span class="info">${info}</span>`;
      log.insertBefore(row,log.firstChild);
      while(log.childNodes.length>200) log.removeChild(log.lastChild);
    }
    function clearTerm(){document.getElementById('term').innerHTML='';}
    async function sendData(){
      if(!running){termLine('err','[未连接] 请先建立连接');return;}
      const inp=document.getElementById('sendInput');const mode=document.getElementById('sendMode').value;let v=inp.value;
      if(!v)return;
      const addNl=document.getElementById('addNl').checked;
      const showHex=document.getElementById('showHex').checked;
      let bytes;
      if(mode==='hex'){bytes=ETP.util.fromHex(v+(addNl?' 0A':''));}
      else{bytes=new TextEncoder().encode(v+(addNl?'\n':''));}
      const disp=showHex?ETP.util.hex(bytes):new TextDecoder().decode(bytes);
      termLine('tx',disp);
      addLog('tx',`conn-${activeConn+1} → ${disp.length>24?disp.slice(0,24)+'…':disp}`);
      stats.txB+=bytes.length;stats.txF++;conns[activeConn].tx+=bytes.length;
      updateStats();
      try{ETP.windows.publish('tcpudp.tx',{conn:activeConn,hex:ETP.util.hex(bytes)});}catch(e){}
      inp.value='';
    }
    function quickSend(s){document.getElementById('sendInput').value=s.replace(/\\r\\n/g,'\r\n').replace(/\\n/g,'\n');sendData();}
    function updateStats(){
      document.getElementById('rxB').textContent=stats.rxB;
      document.getElementById('txB').textContent=stats.txB;
      document.getElementById('rxF').textContent=stats.rxF;
      document.getElementById('txF').textContent=stats.txF;
    }
    function updateHex(bytes){
      const view=document.getElementById('hexView');view.innerHTML='';
      for(let off=0;off<bytes.length;off+=16){
        const slice=Array.from(bytes.slice(off,off+16));
        const hexStr=slice.map(b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(47,' ');
        const asc=slice.map(b=>b>=32&&b<127?String.fromCharCode(b):'.').join('');
        const row=document.createElement('div');row.className='hex-row';
        row.innerHTML=`<span class="hex-offset">${off.toString(16).padStart(4,'0')}</span><span class="hex-bytes">${hexStr}</span><span class="hex-ascii">${asc}</span>`;
        view.appendChild(row);
      }
    }
    // Simulated inbound data
    const rxSamples=['OK\n','PONG\n','{"status":"running","temp":42.5}\n','\x55\xaa\x01\x02\x03','ACK\n','device-01 heartbeat\n'];
    function rxTick(){
      if(!running)return;
      if(Math.random()<0.7){
        const txt=rxSamples[Math.floor(Math.random()*rxSamples.length)];
        const bytes=new TextEncoder().encode(txt);
        const showHex=document.getElementById('showHex').checked;
        const disp=showHex?ETP.util.hex(bytes):txt.replace(/\n/g,'\\n');
        termLine('rx',disp);
        stats.rxB+=bytes.length;stats.rxF++;conns[activeConn].rx+=bytes.length;
        updateStats();updateHex(bytes.slice(0,48));
        addLog('rx',`conn-${activeConn+1} ← ${disp.length>24?disp.slice(0,24)+'…':disp}`);
      }
    }
    function tick(){
      if(!running){return;}
      uptimeSec++;document.getElementById('uptime').textContent=fmtUp(uptimeSec);
    }
    setInterval(rxTick,2200);
    setInterval(tick,1000);
    updateEndpoint();
    lucide.createIcons();
  </script>
</body>
</html>
