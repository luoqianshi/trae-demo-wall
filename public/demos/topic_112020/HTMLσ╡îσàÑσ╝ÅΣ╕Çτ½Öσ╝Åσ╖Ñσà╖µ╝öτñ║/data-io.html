<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据导入导出 — EmbeddedTool Pro</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/theme.css" />
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

      :root {
        /* === Primary Palette — Dark Sci-Fi with Purple === */
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
        --color-bg-elevated: #222640;
        --color-bg-hover: #2a2f4a;

        /* === Purple Accent System === */
        --color-accent-primary: #8b5cf6;
        --color-accent-light: #a78bfa;
        --color-accent-lighter: #c4b5fd;
        --color-accent-dark: #7c3aed;
        --color-accent-darker: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.25);

        /* === Cyan/Tech Secondary === */
        --color-tech-cyan: #22d3ee;
        --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
        --color-tech-green: #34d399;
        --color-tech-green-dim: rgba(52, 211, 153, 0.15);

        /* === Semantic Status Colors === */
        --state-success: #34d399;
        --state-warning: #fbbf24;
        --state-error: #f87171;
        --state-info: #60a5fa;

        /* === Text System === */
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #94a3b8;
        --color-text-muted: #64748b;
        --color-text-inverse: #0f172a;

        /* === Border System === */
        --color-border: #2d3148;
        --color-border-active: #8b5cf6;
        --color-border-subtle: #1e2236;

        /* === Typography === */
        --font-family-display: "Inter", system-ui, -apple-system, sans-serif;
        --font-family-mono:
          "JetBrains Mono", "Fira Code", "Consolas", monospace;
        --font-family-body: "Inter", system-ui, -apple-system, sans-serif;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.8125rem;
        --font-size-base: 0.875rem;
        --font-size-md: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.5rem;
        --font-size-2xl: 2rem;

        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        /* === Spacing Scale === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

        /* === Radius === */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* === Shadows === */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
        --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
      }

      html.dark {
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-family-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }

      /* === Utility Classes === */
      .etp-font-display {
        font-family: var(--font-family-display);
      }
      .etp-font-mono {
        font-family: var(--font-family-mono);
      }
      .etp-font-body {
        font-family: var(--font-family-body);
      }
      .etp-text-accent {
        color: var(--color-accent-primary);
      }
      .etp-text-cyan {
        color: var(--color-tech-cyan);
      }
      .etp-text-green {
        color: var(--color-tech-green);
      }
      .etp-text-muted {
        color: var(--color-text-secondary);
      }
      .etp-bg-surface {
        background-color: var(--color-bg-surface);
      }
      .etp-bg-elevated {
        background-color: var(--color-bg-elevated);
      }
      .etp-border-glow {
        border: 1px solid var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-card-hover {
        transition: all 0.2s ease;
      }
      .etp-card-hover:hover {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }
      .etp-grid-bg {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .etp-scanline::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139, 92, 246, 0.015) 2px,
          rgba(139, 92, 246, 0.015) 4px
        );
        pointer-events: none;
      }

      /* LED indicator */
      .etp-led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .etp-led-green {
        background: var(--state-success);
        box-shadow: 0 0 6px var(--state-success);
      }
      .etp-led-red {
        background: var(--state-error);
        box-shadow: 0 0 6px var(--state-error);
      }
      .etp-led-yellow {
        background: var(--state-warning);
        box-shadow: 0 0 6px var(--state-warning);
      }
      @keyframes etp-led-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .etp-btn-tool {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .etp-btn-tool:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }

      .etp-statusbar {
        background: var(--color-bg-secondary);
        border-top: 1px solid var(--color-border);
        padding: var(--space-1) var(--space-4);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* shared form controls */
      .etp-input,
      .etp-select {
        width: 100%;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        font-family: var(--font-family-mono);
        outline: none;
        transition: border-color 0.15s;
      }
      .etp-input:focus,
      .etp-select:focus {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-label {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* toggle switch */
      .etp-toggle {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }
      .etp-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .etp-toggle-track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        transition: 0.2s;
      }
      .etp-toggle-track::before {
        content: "";
        position: absolute;
        height: 12px;
        width: 12px;
        left: 2px;
        top: 2px;
        background: var(--color-text-muted);
        border-radius: 50%;
        transition: 0.2s;
      }
      .etp-toggle input:checked + .etp-toggle-track {
        background: rgba(139, 92, 246, 0.25);
        border-color: var(--color-accent-primary);
      }
      .etp-toggle input:checked + .etp-toggle-track::before {
        transform: translateX(16px);
        background: var(--color-accent-primary);
        box-shadow: 0 0 6px var(--color-accent-primary);
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-primary);
      }

      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: var(--color-bg-secondary);
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 var(--space-4);
        gap: var(--space-3);
        flex-shrink: 0;
        font-family: var(--font-family-mono);
        position: relative;
        border-bottom: 1px solid var(--color-border);
        flex-wrap: wrap;
      }
      .topbar::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-accent-primary),
          var(--color-tech-cyan),
          transparent
        );
        opacity: 0.3;
      }
      .topbar .title {
        font-weight: 700;
        color: var(--color-accent-light);
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .sep {
        width: 1px;
        height: 28px;
        background: var(--color-border);
      }
      .topbar .field {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .topbar .field label {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .topbar .field select {
        min-width: 150px;
      }
      .topbar .field input {
        min-width: 140px;
      }
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .panel {
        background: var(--color-bg-secondary);
        overflow-y: auto;
        padding: var(--space-4);
      }
      .panel-left {
        width: 260px;
        flex-shrink: 0;
        border-right: 1px solid var(--color-border);
      }
      .panel-right {
        width: 280px;
        flex-shrink: 0;
        border-left: 1px solid var(--color-border);
      }
      .panel-mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .section-h {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        margin: var(--space-2) 0 var(--space-2);
        font-family: var(--font-family-mono);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-h::before {
        content: "";
        width: 3px;
        height: 12px;
        background: var(--color-accent-primary);
        border-radius: 2px;
      }
      .section-h:not(:first-child) {
        margin-top: var(--space-5);
      }
      .field {
        margin-bottom: var(--space-3);
      }
      .field label {
        display: block;
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        gap: var(--space-2);
      }
      .row > * {
        flex: 1;
      }
      .drop-zone {
        border: 2px dashed var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-4) var(--space-3);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--color-bg-elevated);
        margin-bottom: var(--space-3);
      }
      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--color-accent-primary);
        background: rgba(139, 92, 246, 0.08);
        box-shadow: var(--shadow-glow);
      }
      .drop-zone .ico {
        color: var(--color-accent-light);
        margin-bottom: var(--space-1);
      }
      .drop-zone .t {
        font-size: var(--font-size-sm);
        color: var(--color-text-primary);
      }
      .drop-zone .s {
        font-size: 10px;
        color: var(--color-text-muted);
        margin-top: 3px;
      }
      .fmt-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: var(--space-2);
      }
      .fmt-chip {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
        cursor: pointer;
        font-family: var(--font-family-mono);
        transition: all 0.15s;
      }
      .fmt-chip:hover {
        border-color: var(--color-accent-primary);
        color: var(--color-accent-light);
      }
      .fmt-chip.active {
        background: rgba(139, 92, 246, 0.15);
        border-color: var(--color-accent-primary);
        color: var(--color-accent-lighter);
        box-shadow: var(--shadow-glow);
      }
      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--color-accent-primary),
          var(--color-accent-dark)
        );
        border: none;
        color: #fff;
        padding: var(--space-3);
        border-radius: var(--radius-sm);
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font-family-display);
        font-size: var(--font-size-sm);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s;
      }
      .btn-primary:hover {
        box-shadow: var(--shadow-glow);
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }
      .btn-secondary {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        cursor: pointer;
        font-family: var(--font-family-display);
        transition: all 0.15s;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-secondary:hover {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .preview-head {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--color-border-subtle);
        background: var(--color-bg-secondary);
        flex-shrink: 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
      }
      .preview-head .cnt {
        color: var(--color-tech-cyan);
      }
      .preview-head .spacer {
        flex: 1;
      }
      .view-tabs {
        display: flex;
        gap: 2px;
      }
      .view-tab {
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        color: var(--color-text-muted);
        font-size: var(--font-size-xs);
        border: 1px solid transparent;
      }
      .view-tab.active {
        background: rgba(139, 92, 246, 0.12);
        color: var(--color-accent-light);
        border-color: rgba(139, 92, 246, 0.3);
      }
      .view-tab:hover {
        color: var(--color-text-primary);
      }
      .table-wrap {
        flex: 1;
        overflow: auto;
        background: var(--color-bg-primary);
        min-height: 0;
      }
      table.data {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      table.data th {
        position: sticky;
        top: 0;
        background: var(--color-bg-elevated);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 500;
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--color-border);
        z-index: 2;
        white-space: nowrap;
      }
      table.data td {
        padding: 5px 10px;
        border-bottom: 1px solid var(--color-border-subtle);
        color: var(--color-text-secondary);
      }
      table.data tr:hover td {
        background: rgba(139, 92, 246, 0.05);
        color: var(--color-text-primary);
      }
      table.data td.hex {
        color: var(--color-tech-green);
      }
      table.data td.dir-rx {
        color: var(--color-tech-cyan);
      }
      table.data td.dir-tx {
        color: var(--color-accent-light);
      }
      table.data td.ts {
        color: var(--color-text-muted);
        white-space: nowrap;
      }
      .hex-view {
        flex: 1;
        overflow: auto;
        background: #0a0c14;
        font-family: var(--font-family-mono);
        font-size: 11px;
        line-height: 1.6;
        color: var(--color-tech-green);
        padding: var(--space-3);
        white-space: pre;
        min-height: 0;
      }
      .hex-view .off {
        color: var(--color-text-muted);
      }
      .hex-view .asc {
        color: var(--color-accent-light);
        margin-left: 8px;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
        border-top: 1px solid var(--color-border-subtle);
        background: var(--color-bg-secondary);
        flex-shrink: 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
      }
      .pager button {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        padding: 3px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .pager button:hover:not(:disabled) {
        border-color: var(--color-accent-primary);
        color: var(--color-accent-light);
      }
      .pager button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .stat-card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        margin-bottom: var(--space-2);
      }
      .stat-card .big {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xl);
        font-weight: 700;
        color: var(--color-accent-light);
      }
      .stat-card .lab {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 2px;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
        margin-bottom: var(--space-2);
      }
      .stat-mini {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-2);
      }
      .stat-mini .l {
        font-size: 10px;
        color: var(--color-text-muted);
        text-transform: uppercase;
      }
      .stat-mini .v {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-md);
        font-weight: 600;
        color: var(--color-tech-cyan);
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        padding: 3px 8px;
        border-radius: var(--radius-full);
        font-size: 10px;
        cursor: pointer;
        font-family: var(--font-family-mono);
        margin: 2px;
      }
      .filter-chip.active {
        background: rgba(34, 211, 238, 0.12);
        border-color: var(--color-tech-cyan);
        color: var(--color-tech-cyan);
      }
      .rule-card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: var(--space-2) var(--space-3);
        margin-bottom: var(--space-2);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .rule-card .rn {
        color: var(--color-accent-light);
        font-weight: 600;
      }
      .rule-card .rd {
        color: var(--color-text-muted);
        font-size: 10px;
        margin-top: 2px;
      }
      .rule-card.selected {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
        background: rgba(139, 92, 246, 0.08);
      }
      .empty {
        text-align: center;
        padding: var(--space-6);
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-sm);
      }
      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
          overflow-y: auto;
        }
        .panel-left,
        .panel-right {
          width: 100%;
          border-right: none;
          border-left: none;
          border-bottom: 1px solid var(--color-border);
        }
        .panel-mid {
          min-height: 420px;
        }
        .topbar {
          height: auto;
          padding: var(--space-2) var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="title"
        ><i data-lucide="database" style="width: 18px; height: 18px"></i
        >数据导入导出</span
      >
      <div class="sep"></div>
      <div class="field">
        <label>数据源</label
        ><select class="etp-select" id="src" onchange="onSrcChange()">
          <option value="serial">串口采集</option>
          <option value="network">网络抓包</option>
          <option value="logic">逻辑分析仪</option>
          <option value="scope">示波器</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="field">
        <label>时间范围</label>
        <div style="display: flex; align-items: center; gap: 4px">
          <input
            class="etp-input"
            id="tFrom"
            type="datetime-local"
            style="min-width: 0"
          />
          <span style="color: var(--color-text-muted)">~</span>
          <input
            class="etp-input"
            id="tTo"
            type="datetime-local"
            style="min-width: 0"
          />
        </div>
      </div>
      <div style="flex: 1"></div>
      <button class="etp-btn-tool" onclick="loadSource()">
        <i data-lucide="refresh-cw" style="width: 13px; height: 13px"></i
        >载入数据
      </button>
      <span class="etp-led etp-led-green"></span
      ><span
        style="
          font-size: var(--font-size-xs);
          color: var(--color-text-secondary);
        "
        id="srcState"
        >就绪</span
      >
    </header>

    <div class="layout">
      <!-- LEFT: import + export -->
      <aside class="panel panel-left">
        <div class="section-h">导入文件</div>
        <div class="drop-zone" id="dropZone" onclick="browseFile()">
          <div class="ico">
            <i data-lucide="upload-cloud" style="width: 26px; height: 26px"></i>
          </div>
          <div class="t">拖拽文件到此</div>
          <div class="s">CSV / JSON / Bin / Hex</div>
        </div>
        <input
          type="file"
          id="fileInput"
          accept=".csv,.json,.bin,.hex,.txt"
          style="display: none"
          onchange="onFilePick(event)"
        />
        <div class="field">
          <label>导入格式</label>
          <div class="fmt-row" id="impFmt">
            <span class="fmt-chip active" data-fmt="csv">CSV</span>
            <span class="fmt-chip" data-fmt="json">JSON</span>
            <span class="fmt-chip" data-fmt="bin">Bin</span>
            <span class="fmt-chip" data-fmt="hex">Hex</span>
          </div>
        </div>
        <button class="btn-secondary" onclick="genSample()">
          <i data-lucide="flask-conical" style="width: 13px; height: 13px"></i
          >生成示例数据
        </button>

        <div class="section-h">导出</div>
        <div class="field">
          <label>导出格式</label>
          <div class="fmt-row" id="expFmt">
            <span class="fmt-chip active" data-fmt="csv">CSV</span>
            <span class="fmt-chip" data-fmt="json">JSON</span>
            <span class="fmt-chip" data-fmt="bin">Bin</span>
            <span class="fmt-chip" data-fmt="txt">TXT</span>
          </div>
        </div>
        <div class="field">
          <label>导出范围</label>
          <select class="etp-select" id="expRange">
            <option value="all">全部记录</option>
            <option value="filtered">当前过滤结果</option>
            <option value="page">当前页</option>
          </select>
        </div>
        <button class="btn-primary" onclick="exportData()" id="expBtn">
          <i data-lucide="download" style="width: 14px; height: 14px"></i
          >导出数据
        </button>
      </aside>

      <!-- MIDDLE: preview table / hex view -->
      <section class="panel-mid">
        <div class="preview-head">
          <span>预览</span>
          <span>·</span>
          <span class="cnt" id="prevCount">0 条</span>
          <span class="spacer"></span>
          <div class="view-tabs">
            <span
              class="view-tab active"
              data-view="table"
              onclick="switchView('table')"
              >表格</span
            >
            <span class="view-tab" data-view="hex" onclick="switchView('hex')"
              >Hex 视图</span
            >
          </div>
          <span style="color: var(--color-text-muted)">|</span>
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="autoPage" checked /> 自动分页</label
          >
        </div>

        <div class="table-wrap" id="tableView">
          <table class="data" id="dataTable">
            <thead>
              <tr>
                <th>#</th>
                <th>时间</th>
                <th>方向</th>
                <th>数据 (Hex)</th>
                <th>ASCII</th>
                <th>长度</th>
              </tr>
            </thead>
            <tbody id="dataBody">
              <tr>
                <td colspan="6" class="empty">
                  点击「载入数据」或「生成示例数据」开始
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="hex-view" id="hexView" style="display: none"></div>

        <div class="pager">
          <span
            >第 <span id="pgNum">0</span> / <span id="pgTotal">0</span> 页 ·
            每页
            <select
              id="pageSize"
              onchange="renderPage()"
              style="
                background: var(--color-bg-elevated);
                border: 1px solid var(--color-border);
                color: var(--color-text-primary);
                border-radius: 4px;
                padding: 1px 4px;
              "
            >
              <option>25</option>
              <option selected>50</option>
              <option>100</option>
              <option>200</option>
            </select>
            条
          </span>
          <div style="display: flex; gap: 4px">
            <button onclick="goPage(-2)" id="pgFirst">«</button>
            <button onclick="goPage(-1)" id="pgPrev">‹</button>
            <button onclick="goPage(1)" id="pgNext">›</button>
            <button onclick="goPage(2)" id="pgLast">»</button>
          </div>
        </div>
      </section>

      <!-- RIGHT: stats + filter + rules -->
      <aside class="panel panel-right">
        <div class="section-h">数据统计</div>
        <div class="stat-card">
          <div class="lab">总记录数</div>
          <div class="big" id="statRecords">0</div>
        </div>
        <div class="stat-row">
          <div class="stat-mini">
            <div class="l">字节数</div>
            <div class="v" id="statBytes">0</div>
          </div>
          <div class="stat-mini">
            <div class="l">时间跨度</div>
            <div class="v" id="statSpan" style="font-size: var(--font-size-sm)">
              —
            </div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-mini">
            <div class="l">RX 帧</div>
            <div class="v" id="statRx" style="color: var(--color-tech-cyan)">
              0
            </div>
          </div>
          <div class="stat-mini">
            <div class="l">TX 帧</div>
            <div class="v" id="statTx" style="color: var(--color-accent-light)">
              0
            </div>
          </div>
        </div>

        <div class="section-h">过滤器</div>
        <div class="field">
          <label>按方向</label>
          <div>
            <span
              class="filter-chip active"
              data-dir="all"
              onclick="setDir(this)"
              >全部</span
            >
            <span class="filter-chip" data-dir="rx" onclick="setDir(this)"
              >RX</span
            >
            <span class="filter-chip" data-dir="tx" onclick="setDir(this)"
              >TX</span
            >
          </div>
        </div>
        <div class="field">
          <label>按时间</label>
          <div class="row">
            <input
              class="etp-input"
              id="fTimeFrom"
              placeholder="HH:MM:SS"
              style="font-size: 10px"
            />
            <input
              class="etp-input"
              id="fTimeTo"
              placeholder="HH:MM:SS"
              style="font-size: 10px"
            />
          </div>
        </div>
        <div class="field">
          <label>正则匹配 (Hex/ASCII)</label>
          <input
            class="etp-input"
            id="fRegex"
            placeholder="例: ^01 03 或 ACK"
            oninput="applyFilter()"
          />
        </div>
        <button class="btn-secondary" onclick="applyFilter()">
          <i data-lucide="filter" style="width: 13px; height: 13px"></i>应用过滤
        </button>
        <button
          class="btn-secondary"
          style="margin-top: var(--space-2)"
          onclick="resetFilter()"
        >
          <i data-lucide="x" style="width: 13px; height: 13px"></i>清除过滤
        </button>

        <div class="section-h">转换规则 (RuleGo)</div>
        <div class="field">
          <label>规则链</label>
          <select class="etp-select" id="ruleSelect" onchange="onRuleChange()">
            <option value="">— 不应用规则 —</option>
          </select>
        </div>
        <div id="ruleList">
          <div class="empty" style="padding: var(--space-3)">载入规则中...</div>
        </div>
        <button
          class="btn-secondary"
          style="margin-top: var(--space-2)"
          onclick="applyRule()"
        >
          <i data-lucide="git-branch" style="width: 13px; height: 13px"></i
          >应用转换
        </button>
      </aside>
    </div>

    <script src="/assets/app.js"></script>
    <script>
      // ===== 状态 =====
      let allRecords = []; // {idx, ts, dir, hex, ascii, len}
      let filtered = [];
      let curPage = 1,
        curView = "table",
        impFmt = "csv",
        expFmt = "csv",
        curDir = "all",
        curRule = "";

      // ===== 格式 chip 切换 =====
      document.querySelectorAll("#impFmt .fmt-chip").forEach(
        (c) =>
          (c.onclick = () => {
            document
              .querySelectorAll("#impFmt .fmt-chip")
              .forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
            impFmt = c.dataset.fmt;
          }),
      );
      document.querySelectorAll("#expFmt .fmt-chip").forEach(
        (c) =>
          (c.onclick = () => {
            document
              .querySelectorAll("#expFmt .fmt-chip")
              .forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
            expFmt = c.dataset.fmt;
          }),
      );

      // ===== 数据源 =====
      function onSrcChange() {
        const s = document.getElementById("src").value;
        const labels = {
          serial: "串口采集",
          network: "网络抓包",
          logic: "逻辑分析仪",
          scope: "示波器",
          custom: "自定义",
        };
        document.getElementById("srcState").textContent = labels[s] || "就绪";
      }

      async function loadSource() {
        document.getElementById("srcState").textContent = "载入中...";
        // 生成模拟数据(对应数据源)
        const src = document.getElementById("src").value;
        allRecords = genRecords(src, 320);
        applyFilter();
        document.getElementById("srcState").textContent = "已载入";
      }
      function genRecords(src, n) {
        const now = Date.now();
        const recs = [];
        const protos = {
          serial: () => randHex(4 + Math.floor(Math.random() * 16)),
          network: () => {
            const h = ["45 00", "00 28", "00 01", "40 06"];
            return h.join(" ") + " " + randHex(8);
          },
          logic: () => {
            const ch = Math.floor(Math.random() * 8);
            return "CH" + ch + " " + randHex(2);
          },
          scope: () => randHex(4),
          custom: () => randHex(8),
        };
        const gen = protos[src] || protos.custom;
        for (let i = 0; i < n; i++) {
          const hex = gen();
          const bytes = hex.split(/\s+/);
          const ascii = bytes
            .map((b) => {
              const v = parseInt(b, 16);
              return v >= 32 && v < 127 ? String.fromCharCode(v) : ".";
            })
            .join("");
          recs.push({
            idx: i + 1,
            ts: new Date(now - (n - i) * 234).toISOString().substr(11, 12),
            dir: Math.random() < 0.6 ? "rx" : "tx",
            hex,
            ascii,
            len: bytes.length,
          });
        }
        return recs;
      }
      function randHex(n) {
        let s = [];
        for (let i = 0; i < n; i++)
          s.push(
            Math.floor(Math.random() * 256)
              .toString(16)
              .padStart(2, "0")
              .toUpperCase(),
          );
        return s.join(" ");
      }

      function genSample() {
        allRecords = genRecords(document.getElementById("src").value, 200);
        applyFilter();
      }

      // ===== 文件导入 =====
      function browseFile() {
        document.getElementById("fileInput").click();
      }
      function onFilePick(e) {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            parseImport(reader.result, f.name);
          } catch (err) {
            alert("解析失败: " + err.message);
          }
        };
        if (impFmt === "bin") reader.readAsArrayBuffer(f);
        else reader.readAsText(f);
      }
      function parseImport(content, name) {
        allRecords = [];
        if (impFmt === "csv") {
          const lines = content.split(/\r?\n/).filter((l) => l.trim());
          const delim = lines[0].includes(",")
            ? ","
            : lines[0].includes("\t")
              ? "\t"
              : ",";
          lines.forEach((line, i) => {
            const cols = line.split(delim);
            if (i === 0 && /[a-z]/i.test(cols[0]) && cols.length <= 8) return; // 跳过表头
            allRecords.push({
              idx: i,
              ts: cols[0] || ETP.util.ts(),
              dir: (cols[1] || "rx").toLowerCase(),
              hex: (cols[2] || "").trim(),
              ascii: cols[3] || "",
              len:
                parseInt(cols[4]) ||
                (cols[2] ? cols[2].split(/\s+/).length : 0),
            });
          });
        } else if (impFmt === "json") {
          const arr = JSON.parse(content);
          arr.forEach((r, i) =>
            allRecords.push({
              idx: i + 1,
              ts: r.ts || r.time || ETP.util.ts(),
              dir: (r.dir || "rx").toLowerCase(),
              hex: r.hex || r.data || "",
              ascii: r.ascii || "",
              len: r.len || (r.hex ? r.hex.split(/\s+/).length : 0),
            }),
          );
        } else if (impFmt === "hex" || impFmt === "bin") {
          let hexStr;
          if (impFmt === "bin") {
            const u8 = new Uint8Array(content);
            hexStr = Array.from(u8)
              .map((b) => b.toString(16).padStart(2, "0").toUpperCase())
              .join(" ");
          } else
            hexStr = content
              .replace(/0x/gi, "")
              .replace(/\s+/g, " ")
              .replace(/(.{2})/g, "$1 ")
              .trim()
              .toUpperCase();
          const bytes = hexStr.split(/\s+/);
          for (let i = 0; i < bytes.length; i += 16) {
            const chunk = bytes.slice(i, i + 16);
            allRecords.push({
              idx: allRecords.length + 1,
              ts: ETP.util.ts(),
              dir: "rx",
              hex: chunk.join(" "),
              ascii: chunk
                .map((b) => {
                  const v = parseInt(b, 16);
                  return v >= 32 && v < 127 ? String.fromCharCode(v) : ".";
                })
                .join(""),
              len: chunk.length,
            });
          }
        }
        applyFilter();
      }
      // 拖拽
      const dz = document.getElementById("dropZone");
      ["dragenter", "dragover"].forEach((ev) =>
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          dz.classList.add("dragover");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          dz.classList.remove("dragover");
        }),
      );
      dz.addEventListener("drop", (e) => {
        const f = e.dataTransfer.files[0];
        if (f) {
          document.getElementById("fileInput").files = e.dataTransfer.files;
          onFilePick({ target: { files: [f] } });
        }
      });

      // ===== 过滤 =====
      function setDir(el) {
        document
          .querySelectorAll(".filter-chip[data-dir]")
          .forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
        curDir = el.dataset.dir;
        applyFilter();
      }
      function applyFilter() {
        const from = document.getElementById("fTimeFrom").value;
        const to = document.getElementById("fTimeTo").value;
        const re = document.getElementById("fRegex").value;
        let regex = null;
        try {
          if (re) regex = new RegExp(re, "i");
        } catch (e) {}
        filtered = allRecords.filter((r) => {
          if (curDir !== "all" && r.dir !== curDir) return false;
          if (from && r.ts < from) return false;
          if (to && r.ts > to) return false;
          if (regex && !regex.test(r.hex) && !regex.test(r.ascii)) return false;
          return true;
        });
        curPage = 1;
        renderPage();
        renderStats();
      }
      function resetFilter() {
        curDir = "all";
        document
          .querySelectorAll(".filter-chip[data-dir]")
          .forEach((c) =>
            c.classList.toggle("active", c.dataset.dir === "all"),
          );
        document.getElementById("fTimeFrom").value = "";
        document.getElementById("fTimeTo").value = "";
        document.getElementById("fRegex").value = "";
        applyFilter();
      }

      // ===== 渲染 =====
      function renderPage() {
        const ps = parseInt(document.getElementById("pageSize").value);
        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / ps));
        if (curPage > totalPages) curPage = totalPages;
        if (curPage < 1) curPage = 1;
        const start = (curPage - 1) * ps,
          pageData = filtered.slice(start, start + ps);
        const body = document.getElementById("dataBody");
        if (!pageData.length) {
          body.innerHTML = '<tr><td colspan="6" class="empty">无数据</td></tr>';
        } else {
          body.innerHTML = pageData
            .map(
              (r) => `<tr>
          <td>${r.idx}</td><td class="ts">${esc(r.ts)}</td>
          <td class="dir-${r.dir}">${r.dir.toUpperCase()}</td>
          <td class="hex">${esc(r.hex)}</td><td>${esc(r.ascii)}</td><td>${r.len}</td>
        </tr>`,
            )
            .join("");
        }
        document.getElementById("pgNum").textContent = curPage;
        document.getElementById("pgTotal").textContent = totalPages;
        document.getElementById("prevCount").textContent = total + " 条";
        ["pgFirst", "pgPrev"].forEach(
          (id) => (document.getElementById(id).disabled = curPage <= 1),
        );
        ["pgNext", "pgLast"].forEach(
          (id) =>
            (document.getElementById(id).disabled = curPage >= totalPages),
        );
        renderHex(pageData);
      }
      function goPage(d) {
        if (d === -2) curPage = 1;
        else if (d === 2) curPage = 9999;
        else curPage += d;
        renderPage();
      }

      function renderHex(pageData) {
        const v = document.getElementById("hexView");
        if (curView !== "hex") {
          return;
        }
        let out = "";
        let offset = 0;
        pageData.forEach((r) => {
          const bytes = r.hex.split(/\s+/);
          out += `<span class="off">── #${r.idx} ${r.dir.toUpperCase()} ${r.ts} ──</span>\n`;
          for (let i = 0; i < bytes.length; i += 16) {
            const chunk = bytes.slice(i, i + 16);
            const off = (offset + i)
              .toString(16)
              .padStart(8, "0")
              .toUpperCase();
            const hexP = chunk.join(" ").padEnd(47, " ");
            const asc = chunk
              .map((b) => {
                const v = parseInt(b, 16);
                return v >= 32 && v < 127 ? String.fromCharCode(v) : ".";
              })
              .join("");
            out += `<span class="off">${off}</span>  ${hexP}  <span class="asc">${esc(asc)}</span>\n`;
          }
          offset += bytes.length;
        });
        v.innerHTML =
          out || '<span style="color:var(--color-text-muted)">无数据</span>';
      }

      function switchView(v) {
        curView = v;
        document
          .querySelectorAll(".view-tab")
          .forEach((t) => t.classList.toggle("active", t.dataset.view === v));
        document.getElementById("tableView").style.display =
          v === "table" ? "block" : "none";
        document.getElementById("hexView").style.display =
          v === "hex" ? "block" : "none";
        renderPage();
      }

      function renderStats() {
        document.getElementById("statRecords").textContent = allRecords.length;
        const bytes = allRecords.reduce((a, r) => a + r.len, 0);
        document.getElementById("statBytes").textContent = fmtBytes(bytes);
        document.getElementById("statRx").textContent = allRecords.filter(
          (r) => r.dir === "rx",
        ).length;
        document.getElementById("statTx").textContent = allRecords.filter(
          (r) => r.dir === "tx",
        ).length;
        if (allRecords.length) {
          const t1 = allRecords[0].ts,
            t2 = allRecords[allRecords.length - 1].ts;
          document.getElementById("statSpan").textContent = t1 + " ~ " + t2;
        } else document.getElementById("statSpan").textContent = "—";
      }
      function fmtBytes(b) {
        if (b < 1024) return b + " B";
        if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
        return (b / 1048576).toFixed(2) + " MB";
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ===== 导出 =====
      function exportData() {
        const range = document.getElementById("expRange").value;
        let data;
        if (range === "all") data = allRecords;
        else if (range === "filtered") data = filtered;
        else {
          const ps = parseInt(document.getElementById("pageSize").value);
          data = filtered.slice((curPage - 1) * ps, curPage * ps);
        }
        if (!data.length) {
          alert("无数据可导出");
          return;
        }
        let content = "",
          mime = "text/plain",
          ext = expFmt;
        if (expFmt === "csv") {
          content =
            "time,dir,hex,ascii,length\n" +
            data
              .map(
                (r) =>
                  `${r.ts},${r.dir},${r.hex.replace(/\s/g, "")},${r.ascii},${r.len}`,
              )
              .join("\n");
          mime = "text/csv";
        } else if (expFmt === "json") {
          content = JSON.stringify(
            data.map((r) => ({
              time: r.ts,
              dir: r.dir,
              hex: r.hex.replace(/\s/g, ""),
              ascii: r.ascii,
              length: r.len,
            })),
            null,
            2,
          );
          mime = "application/json";
        } else if (expFmt === "bin") {
          const bytes = [];
          data.forEach((r) =>
            r.hex.split(/\s+/).forEach((b) => bytes.push(parseInt(b, 16))),
          );
          const blob = new Blob([new Uint8Array(bytes)], {
            type: "application/octet-stream",
          });
          downloadBlob(blob, "export.bin");
          return;
        } else {
          // txt
          content = data
            .map(
              (r) => `[${r.ts}] ${r.dir.toUpperCase()} ${r.hex}  | ${r.ascii}`,
            )
            .join("\n");
        }
        downloadBlob(new Blob([content], { type: mime }), "export." + ext);
      }
      function downloadBlob(blob, name) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      // ===== RuleGo 规则链 =====
      async function loadRules() {
        const sel = document.getElementById("ruleSelect");
        const list = document.getElementById("ruleList");
        try {
          const r = await ETP.rules.list();
          const rules = Array.isArray(r) ? r : r.rules || r.data || [];
          if (!rules.length) {
            list.innerHTML =
              '<div class="empty" style="padding:var(--space-3)">暂无可用规则链</div>';
            return;
          }
          sel.innerHTML =
            '<option value="">— 不应用规则 —</option>' +
            rules
              .map(
                (x) =>
                  `<option value="${x.id || x.Id || x.name}">${x.name || x.Name || x.id}</option>`,
              )
              .join("");
          list.innerHTML = rules
            .map(
              (
                x,
              ) => `<div class="rule-card" data-rid="${x.id || x.Id || x.name}" onclick="selectRuleCard(this)">
          <div class="rn">${esc(x.name || x.Name || x.id)}</div>
          <div class="rd">${esc(x.description || x.desc || x.type || "规则链")} · ${x.id || x.Id || ""}</div>
        </div>`,
            )
            .join("");
        } catch (e) {
          // 后端不可用, 展示示例规则链
          const demo = [
            {
              id: "r1",
              name: "Hex → JSON 解码",
              desc: "将 Hex 数据解码为结构化 JSON",
            },
            {
              id: "r2",
              name: "Modbus 帧校验",
              desc: "过滤无效 CRC 的 Modbus 帧",
            },
            { id: "r3", name: "时间戳标准化", desc: "统一时间格式为 ISO 8601" },
            { id: "r4", name: "协议分类", desc: "按协议类型自动打标签" },
          ];
          sel.innerHTML =
            '<option value="">— 不应用规则 —</option>' +
            demo
              .map((x) => `<option value="${x.id}">${x.name}</option>`)
              .join("");
          list.innerHTML =
            '<div style="font-size:10px;color:var(--state-warning);margin-bottom:var(--space-2)">⚠ 后端未连接, 显示示例规则链</div>' +
            demo
              .map(
                (x) =>
                  `<div class="rule-card" data-rid="${x.id}" onclick="selectRuleCard(this)"><div class="rn">${x.name}</div><div class="rd">${x.desc} · ${x.id}</div></div>`,
              )
              .join("");
        }
      }
      function onRuleChange() {
        curRule = document.getElementById("ruleSelect").value;
        document
          .querySelectorAll(".rule-card")
          .forEach((c) =>
            c.classList.toggle("selected", c.dataset.rid === curRule),
          );
      }
      function selectRuleCard(el) {
        document
          .querySelectorAll(".rule-card")
          .forEach((c) => c.classList.remove("selected"));
        el.classList.add("selected");
        curRule = el.dataset.rid;
        document.getElementById("ruleSelect").value = curRule;
      }
      function applyRule() {
        if (!curRule) {
          alert("请先选择规则链");
          return;
        }
        if (!allRecords.length) {
          alert("请先载入数据");
          return;
        }
        // 模拟: 应用规则后给数据加标记
        allRecords = allRecords.map((r) => ({
          ...r,
          ascii: r.ascii + " [✓" + curRule + "]",
        }));
        applyFilter();
        alert(
          "已应用规则链 " + curRule + " 到 " + allRecords.length + " 条记录",
        );
      }

      // ===== 初始化 =====
      onSrcChange();
      loadRules();
      lucide.createIcons();
    </script>
    <script>
      ETP.initWindow();
      lucide.createIcons();
    </script>
  </body>
