<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任意波形发生器</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/theme.css" />
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

      :root {
        /* === Primary Palette — Dark Sci-Fi with Purple === */
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
        --color-bg-elevated: #222640;
        --color-bg-hover: #2a2f4a;

        /* === Purple Accent System === */
        --color-accent-primary: #8b5cf6;
        --color-accent-light: #a78bfa;
        --color-accent-lighter: #c4b5fd;
        --color-accent-dark: #7c3aed;
        --color-accent-darker: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.25);

        /* === Cyan/Tech Secondary === */
        --color-tech-cyan: #22d3ee;
        --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
        --color-tech-green: #34d399;
        --color-tech-green-dim: rgba(52, 211, 153, 0.15);

        /* === Semantic Status Colors === */
        --state-success: #34d399;
        --state-warning: #fbbf24;
        --state-error: #f87171;
        --state-info: #60a5fa;

        /* === Text System === */
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #94a3b8;
        --color-text-muted: #64748b;
        --color-text-inverse: #0f172a;

        /* === Border System === */
        --color-border: #2d3148;
        --color-border-active: #8b5cf6;
        --color-border-subtle: #1e2236;

        /* === Typography === */
        --font-family-display: "Inter", system-ui, -apple-system, sans-serif;
        --font-family-mono:
          "JetBrains Mono", "Fira Code", "Consolas", monospace;
        --font-family-body: "Inter", system-ui, -apple-system, sans-serif;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.8125rem;
        --font-size-base: 0.875rem;
        --font-size-md: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.5rem;
        --font-size-2xl: 2rem;

        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        /* === Spacing Scale === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

        /* === Radius === */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* === Shadows === */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
        --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
      }

      html.dark {
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-family-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }

      /* === Utility Classes === */
      .etp-font-display {
        font-family: var(--font-family-display);
      }
      .etp-font-mono {
        font-family: var(--font-family-mono);
      }
      .etp-font-body {
        font-family: var(--font-family-body);
      }
      .etp-text-accent {
        color: var(--color-accent-primary);
      }
      .etp-text-cyan {
        color: var(--color-tech-cyan);
      }
      .etp-text-green {
        color: var(--color-tech-green);
      }
      .etp-text-muted {
        color: var(--color-text-secondary);
      }
      .etp-bg-surface {
        background-color: var(--color-bg-surface);
      }
      .etp-bg-elevated {
        background-color: var(--color-bg-elevated);
      }
      .etp-border-glow {
        border: 1px solid var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-card-hover {
        transition: all 0.2s ease;
      }
      .etp-card-hover:hover {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }
      .etp-grid-bg {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .etp-scanline::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139, 92, 246, 0.015) 2px,
          rgba(139, 92, 246, 0.015) 4px
        );
        pointer-events: none;
      }

      /* LED indicator */
      .etp-led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .etp-led-green {
        background: var(--state-success);
        box-shadow: 0 0 6px var(--state-success);
      }
      .etp-led-red {
        background: var(--state-error);
        box-shadow: 0 0 6px var(--state-error);
      }
      .etp-led-yellow {
        background: var(--state-warning);
        box-shadow: 0 0 6px var(--state-warning);
      }
      @keyframes etp-led-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .etp-btn-tool {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .etp-btn-tool:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }

      .etp-statusbar {
        background: var(--color-bg-secondary);
        border-top: 1px solid var(--color-border);
        padding: var(--space-1) var(--space-4);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* shared form controls */
      .etp-input,
      .etp-select {
        width: 100%;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        font-family: var(--font-family-mono);
        outline: none;
        transition: border-color 0.15s;
      }
      .etp-input:focus,
      .etp-select:focus {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-label {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* toggle switch */
      .etp-toggle {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }
      .etp-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .etp-toggle-track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        transition: 0.2s;
      }
      .etp-toggle-track::before {
        content: "";
        position: absolute;
        height: 12px;
        width: 12px;
        left: 2px;
        top: 2px;
        background: var(--color-text-muted);
        border-radius: 50%;
        transition: 0.2s;
      }
      .etp-toggle input:checked + .etp-toggle-track {
        background: rgba(139, 92, 246, 0.25);
        border-color: var(--color-accent-primary);
      }
      .etp-toggle input:checked + .etp-toggle-track::before {
        transform: translateX(16px);
        background: var(--color-accent-primary);
        box-shadow: 0 0 6px var(--color-accent-primary);
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-primary);
      }

      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        height: 100vh;
        margin: 0;
        font-family: var(--font-family-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }
      .awg-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--color-bg-primary);
      }
      .font-mono {
        font-family: var(--font-family-mono);
      }

      /* === Top Toolbar === */
      .awg-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: var(--color-bg-secondary);
        border-bottom: 1px solid var(--color-border);
        flex-wrap: nowrap;
        overflow-x: auto;
        min-height: 44px;
      }
      .awg-toolbar .divider {
        width: 1px;
        height: 28px;
        background: var(--color-border);
        margin: 0 4px;
        flex-shrink: 0;
      }
      .toolbar-label {
        font-size: 10px;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }

      /* Output on/off */
      .btn-output {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .btn-output.on {
        background: rgba(52, 211, 153, 0.15);
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.3);
      }
      .btn-output.on:hover {
        background: rgba(52, 211, 153, 0.25);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
      }
      .btn-output.off {
        background: rgba(100, 116, 139, 0.15);
        color: var(--color-text-secondary);
        border-color: var(--color-border);
      }
      .btn-output .led-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .btn-output.on .led-dot {
        background: #34d399;
        box-shadow: 0 0 6px #34d399;
      }
      .btn-output.off .led-dot {
        background: var(--color-text-muted);
      }

      /* Channel toggle */
      .ch-toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 12px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--color-border);
        background: var(--color-bg-elevated);
        color: var(--color-text-muted);
        transition: all 0.15s ease;
        white-space: nowrap;
        font-family: var(--font-family-mono);
      }
      .ch-toggle .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4a5568;
      }
      .ch-toggle.ch1.on {
        background: rgba(34, 211, 238, 0.12);
        color: #22d3ee;
        border-color: rgba(34, 211, 238, 0.4);
      }
      .ch-toggle.ch1.on .led {
        background: #22d3ee;
        box-shadow: 0 0 6px #22d3ee;
      }
      .ch-toggle.ch2.on {
        background: rgba(52, 211, 153, 0.12);
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.4);
      }
      .ch-toggle.ch2.on .led {
        background: #34d399;
        box-shadow: 0 0 6px #34d399;
      }

      /* Waveform type buttons */
      .wave-type-grid {
        display: flex;
        gap: 3px;
      }
      .wave-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-bg-elevated);
        color: var(--color-text-secondary);
        font-size: var(--font-size-xs);
        font-family: var(--font-family-mono);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .wave-btn:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        color: var(--color-text-primary);
      }
      .wave-btn.active {
        background: rgba(139, 92, 246, 0.15);
        border-color: rgba(139, 92, 246, 0.5);
        color: #a78bfa;
        box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
      }

      /* Parameter inputs */
      .param-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .param-input {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: 4px 6px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
        font-family: var(--font-family-mono);
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        width: 64px;
      }
      .param-input:focus {
        border-color: var(--color-accent-primary);
        box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
      }
      .param-unit {
        font-size: 10px;
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* Modulation toggle pills */
      .mod-pill {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-bg-elevated);
        color: var(--color-text-secondary);
        font-size: var(--font-size-xs);
        font-weight: 600;
        font-family: var(--font-family-mono);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .mod-pill:hover {
        border-color: var(--color-accent-primary);
        color: var(--color-text-primary);
      }
      .mod-pill.active.sweep {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        border-color: rgba(251, 191, 36, 0.45);
      }
      .mod-pill.active.am {
        background: rgba(34, 211, 238, 0.15);
        color: #22d3ee;
        border-color: rgba(34, 211, 238, 0.45);
      }
      .mod-pill.active.fm {
        background: rgba(52, 211, 153, 0.15);
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.45);
      }

      .awg-select {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
        font-family: var(--font-family-mono);
        cursor: pointer;
        outline: none;
        appearance: auto;
      }
      .awg-select:focus {
        border-color: var(--color-accent-primary);
      }

      /* === Main area === */
      .awg-main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .awg-display-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .waveform-display {
        flex: 1;
        position: relative;
        background: #060810;
        border: 1px solid var(--color-border-subtle);
        overflow: hidden;
        min-height: 300px;
      }
      .waveform-display svg {
        width: 100%;
        height: 100%;
      }
      .grid-line-major {
        stroke: rgba(139, 92, 246, 0.12);
        stroke-width: 1;
      }
      .grid-line-minor {
        stroke: rgba(139, 92, 246, 0.05);
        stroke-width: 0.5;
      }
      .grid-border {
        stroke: rgba(139, 92, 246, 0.25);
        stroke-width: 1.5;
        fill: none;
      }
      .axis-label-voltage {
        font-family: var(--font-family-mono);
        font-size: 9px;
        fill: rgba(148, 163, 184, 0.6);
      }
      .time-label {
        font-family: var(--font-family-mono);
        font-size: 9px;
        fill: rgba(148, 163, 184, 0.5);
      }
      .trace-ch1 {
        fill: none;
        stroke: #22d3ee;
        stroke-width: 1.8;
        filter: url(#glow-cyan);
      }
      .trace-ch2 {
        fill: none;
        stroke: #34d399;
        stroke-width: 1.8;
        filter: url(#glow-green);
      }
      .ch-badge {
        font-family: var(--font-family-mono);
        font-size: 11px;
        font-weight: 600;
      }
      .center-line {
        stroke: rgba(139, 92, 246, 0.18);
        stroke-width: 1;
        stroke-dasharray: 6 4;
      }

      .preview-overlay {
        position: absolute;
        top: 8px;
        left: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: var(--font-family-mono);
        font-size: 10px;
      }
      .preview-overlay .badge {
        background: rgba(34, 211, 238, 0.15);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #67e8f9;
        padding: 2px 8px;
        border-radius: 3px;
        width: max-content;
      }
      .preview-overlay .badge.ch2 {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.3);
        color: #6ee7b7;
      }

      /* === Right Panel === */
      .awg-right {
        width: 280px;
        background: var(--color-bg-secondary);
        border-left: 1px solid var(--color-border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .rp-section {
        padding: 10px;
        border-bottom: 1px solid var(--color-border-subtle);
      }
      .rp-section-title {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-accent-light);
        margin-bottom: 8px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .rp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-family: var(--font-family-mono);
        font-size: 11px;
      }
      .rp-row label {
        color: var(--color-text-muted);
      }
      .rp-row input {
        width: 90px;
      }
      .rp-row input.param-input {
        width: 96px;
      }

      /* Waveform editor */
      .arb-editor {
        background: #060810;
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
      }
      .arb-editor svg {
        width: 100%;
        height: 130px;
        display: block;
      }
      .arb-pt {
        fill: #8b5cf6;
        stroke: #0d0f1a;
        stroke-width: 1.5;
        cursor: ns-resize;
      }
      .arb-pt:hover {
        fill: #c4b5fd;
      }
      .arb-line {
        fill: none;
        stroke: rgba(139, 92, 246, 0.4);
        stroke-width: 1.4;
      }
      .arb-center {
        stroke: rgba(139, 92, 246, 0.18);
        stroke-width: 1;
        stroke-dasharray: 4 3;
      }
      .formula-input {
        width: 100%;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        font-size: 11px;
        font-family: var(--font-family-mono);
        outline: none;
        margin-top: 6px;
      }
      .formula-input:focus {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .rp-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        background: var(--color-bg-elevated);
        color: var(--color-text-secondary);
        font-size: 11px;
        font-family: var(--font-family-mono);
        cursor: pointer;
        transition: all 0.15s ease;
        margin-top: 6px;
      }
      .rp-btn:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        color: var(--color-text-primary);
      }
      .rp-btn.primary {
        background: linear-gradient(
          135deg,
          var(--color-accent-primary),
          var(--color-accent-dark)
        );
        color: #fff;
        border: none;
      }
      .rp-btn.primary:hover {

      }

        flex-wrap: wrap;
        gap: 4px;

        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);

        padding: 3px 8px;
        border-radius: var(--radius-sm);

      .mod-disabled {

      /* === Status Bar === */
      .awg-statusbar {

        align-items: center;
        justify-content: space-between;
        padding: 3px 12px;
        background: var(--color-bg-secondary);

      /* === Responsive === */

      @media (max-width: 900px) {

          gap: 2px;
        }
        .wave-type-grid {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>

        </div>

    <script src="/assets/app.js"></script>
    <script>
      // === State ===
      const state = {
        output: false,
        activeCh: 1,
        ch: {
          1: { type: "sine", freq: 1000, amp: 2.0, offset: 0, phase: 0 },
          2: { type: "sine", freq: 2000, amp: 1.0, offset: 0, phase: 0 },
        },
        mods: { sweep: false, am: false, fm: false },
        sweepStart: 500,
        sweepStop: 5000,
        sweepTime: 2,
        sweepMode: "linear",
        amDepth: 80,
        amFreq: 100,
        fmDev: 1000,
        fmFreq: 200,
        // arbitrary waveform: 16 control points in range [-1, 1]
        arb: [],
      };

      // initialize arb points to a sine
      function initArb() {
        state.arb = [];
        const N = 16;
        for (let i = 0; i < N; i++)
          state.arb.push(Math.sin((i / (N - 1)) * Math.PI * 2));
      }
      initArb();

      // === DOM ===
      const svg = document.getElementById("awgSvg");
      const gridGroup = document.getElementById("gridGroup");
      const voltageAxisLabels = document.getElementById("voltageAxisLabels");
      const timeAxisLabels = document.getElementById("timeAxisLabels");
      const traceCh1 = document.getElementById("traceCh1");
      const traceCh2 = document.getElementById("traceCh2");
      const waveformDisplay = document.getElementById("waveformDisplay");
      const arbEditor = document.getElementById("arbEditor");

      // === Read params from toolbar ===
      function readParams() {
        const fu = parseFloat(document.getElementById("freqUnit").value);
        const ch = state.activeCh;
        state.ch[ch].freq = Math.max(
          0.001,
          parseFloat(document.getElementById("freq").value) * fu,
        );
        state.ch[ch].amp = Math.max(
          0,
          parseFloat(document.getElementById("amp").value) || 0,
        );
        state.ch[ch].offset =
          parseFloat(document.getElementById("offset").value) || 0;
        state.ch[ch].phase =
          ((parseFloat(document.getElementById("phase").value) || 0) *
            Math.PI) /
          180;
      }
      ["freq", "amp", "offset", "phase", "freqUnit"].forEach((id) => {
        document.getElementById(id).addEventListener("input", () => {
          readParams();
          updateBadge();
        });
      });

      // === Grid Drawing ===
      function drawGrid() {
        const w = waveformDisplay.clientWidth || 800;
        const h = waveformDisplay.clientHeight || 400;
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        gridGroup.innerHTML = "";
        const divX = 10,
          divY = 8;
        const stepX = w / divX,
          stepY = h / divY;

        const border = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect",
        );
        border.setAttribute("x", "0");
        border.setAttribute("y", "0");
        border.setAttribute("width", w);
        border.setAttribute("height", h);
        border.setAttribute("class", "grid-border");
        gridGroup.appendChild(border);

        for (let i = 1; i < divX; i++) {
          const l = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line",
          );
          l.setAttribute("x1", i * stepX);
          l.setAttribute("y1", "0");
          l.setAttribute("x2", i * stepX);
          l.setAttribute("y2", h);
          l.setAttribute("class", "grid-line-major");
          gridGroup.appendChild(l);
        }
        for (let i = 1; i < divY; i++) {
          const l = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line",
          );
          l.setAttribute("x1", "0");
          l.setAttribute("y1", i * stepY);
          l.setAttribute("x2", w);
          l.setAttribute("y2", i * stepY);
          l.setAttribute("class", "grid-line-major");
          gridGroup.appendChild(l);
        }
        // center cross minor ticks
        const cx = w / 2,
          cy = h / 2;
        for (let i = 0; i < divX; i++)
          for (let j = 1; j < 5; j++) {
            const x = i * stepX + (j * stepX) / 5;
            const t = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line",
            );
            t.setAttribute("x1", x);
            t.setAttribute("y1", cy - 3);
            t.setAttribute("x2", x);
            t.setAttribute("y2", cy + 3);
            t.setAttribute("class", "grid-line-minor");
            gridGroup.appendChild(t);
          }

        // axis labels
        voltageAxisLabels.innerHTML = "";
        const vTexts = [
          "+2",
          "+1.5",
          "+1",
          "+0.5",
          "0",
          "-0.5",
          "-1",
          "-1.5",
          "-2",
        ];
        for (let i = 0; i <= divY; i++) {
          const t = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          t.setAttribute("class", "axis-label-voltage");
          t.setAttribute("x", 4);
          t.setAttribute("y", i * stepY + (i === 0 ? 10 : i === divY ? -3 : 3));
          t.textContent = vTexts[i] || "";
          voltageAxisLabels.appendChild(t);
        }
        timeAxisLabels.innerHTML = "";
        const tTexts = [
          "0",
          "T",
          "2T",
          "3T",
          "4T",
          "5T",
          "6T",
          "7T",
          "8T",
          "9T",
          "10T",
        ];
        for (let i = 0; i <= divX; i++) {
          const t = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          t.setAttribute("class", "time-label");
          t.setAttribute("x", i * stepX);
          t.setAttribute("y", h - 4);
          t.setAttribute(
            "text-anchor",
            i === 0 ? "start" : i === divX ? "end" : "middle",
          );
          t.textContent = tTexts[i] || "";
          timeAxisLabels.appendChild(t);
        }
      }

      // === Waveform value generators (normalized -1..1, one period via phase) ===
      function waveValue(type, angle) {
        switch (type) {
          case "sine":
            return Math.sin(angle);
          case "square":
            return Math.sign(Math.sin(angle));
          case "triangle":
            return (2 / Math.PI) * Math.asin(Math.sin(angle));
          case "sawtooth": {
            const p = (angle / (2 * Math.PI)) % 1; // 0..1
            const q = p < 0 ? p + 1 : p;
            return 2 * q - 1;
          }
          case "noise":
            return (Math.random() * 2 - 1) * 0.85;
          case "arb":
            return arbValue(angle);
          default:
            return 0;
        }
      }

      function arbValue(angle) {
        const N = state.arb.length;
        let p = (angle / (2 * Math.PI)) % 1;
        if (p < 0) p += 1;
        const pos = p * N;
        const i0 = Math.floor(pos) % N;
        const i1 = (i0 + 1) % N;
        const frac = pos - Math.floor(pos);
        return state.arb[i0] * (1 - frac) + state.arb[i1] * frac;
      }

      // === Build path for a channel ===
      function buildPath(chNum, scrollPhase) {
        const w = waveformDisplay.clientWidth || 800;
        const h = waveformDisplay.clientHeight || 400;
        const p = state.ch[chNum];
        if (!p) return "";
        const centerY = h / 2;
        // amplitude in volts mapped to half-height (4 div of 8)
        const ampPx = (p.amp / 4) * (h / 2); // 4Vpp full scale -> full height
        const offsetPx = (p.offset / 4) * (h / 2);
        const cyclesShown = 3;
        const steps = 480;
        let d = "";
        for (let i = 0; i <= steps; i++) {
          const x = (i / steps) * w;
          const angle =
            (i / steps) * cyclesShown * 2 * Math.PI + p.phase + scrollPhase;
          let v = waveValue(p.type, angle);
          // AM modulation
          if (state.mods.am && chNum === state.activeCh) {
            const depth = state.amDepth / 100;
            v *=
              1 + depth * Math.sin(2 * Math.PI * state.amFreq * state.runTime);
          }
          const y = centerY - ampPx * v - offsetPx;
          d += `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)} `;
        }
        return d;
      }

      // === Animation ===
      let lastTs = 0;
      state.runTime = 0;
      state.scrollPhase = { 1: 0, 2: 0 };

      function animate(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        state.runTime += dt;

        // effective frequency for active channel (with sweep/fm)
        const computeEffFreq = (chNum) => {
          let f = state.ch[chNum].freq;
          if (chNum === state.activeCh) {
            if (state.mods.sweep) {
              const prog = (state.runTime % state.sweepTime) / state.sweepTime;
              if (state.sweepMode === "log") {
                f =
                  state.sweepStart *
                  Math.pow(state.sweepStop / state.sweepStart, prog);
              } else {
                f =
                  state.sweepStart +
                  (state.sweepStop - state.sweepStart) * prog;
              }
            }
            if (state.mods.fm) {
              f +=
                state.fmDev *
                Math.sin(2 * Math.PI * state.fmFreq * state.runTime);
            }
          }
          return Math.max(0.001, f);
        };

        [1, 2].forEach((chNum) => {
          const f = computeEffFreq(chNum);
          // advance scroll phase proportional to freq so higher freq scrolls faster
          state.scrollPhase[chNum] += 2 * Math.PI * f * dt * 0.02;
        });

        readParams();
        // read sweep/am/fm inputs
        state.sweepStart =
          parseFloat(document.getElementById("sweepStart").value) * 1000 || 500;
        state.sweepStop =
          parseFloat(document.getElementById("sweepStop").value) * 1000 || 5000;
        state.sweepTime = Math.max(
          0.1,
          parseFloat(document.getElementById("sweepTime").value) || 2,
        );
        state.sweepMode = document.getElementById("sweepMode").value;
        state.amDepth =
          parseFloat(document.getElementById("amDepth").value) || 0;
        state.amFreq =
          parseFloat(document.getElementById("amFreq").value) || 100;
        state.fmDev =
          parseFloat(document.getElementById("fmDev").value) * 1000 || 1000;
        state.fmFreq =
          parseFloat(document.getElementById("fmFreq").value) || 200;

        // CH1 always visible if output on; CH2 only if it was selected at least once -> show both traces for preview
        traceCh1.setAttribute("d", buildPath(1, state.scrollPhase[1]));
        traceCh1.style.display = state.output ? "" : "none";
        // CH2 shown dimmer only when active channel is 2
        if (state.activeCh === 2) {
          traceCh2.setAttribute("d", buildPath(2, state.scrollPhase[2]));
          traceCh2.style.display = state.output ? "" : "none";
        } else {
          traceCh2.style.display = "none";
        }

        requestAnimationFrame(animate);
      }

      // === Controls ===
      function toggleOutput() {
        state.output = !state.output;
        const btn = document.getElementById("btnOutput");
        const label = document.getElementById("outputLabel");
        const dot = document.getElementById("outStatusDot");
        const txt = document.getElementById("outStatusText");
        if (state.output) {
          btn.className = "btn-output on";
          label.textContent = "OUTPUT ON";
          dot.className = "status-dot";
          txt.textContent = "Output: ON";
        } else {
          btn.className = "btn-output off";
          label.textContent = "OUTPUT OFF";
          dot.className = "status-dot off";
          txt.textContent = "Output: OFF";
        }
        updateBadge();
      }

      function selectChannel(ch) {
        state.activeCh = ch;
        document.getElementById("ch1Toggle").classList.toggle("on", ch === 1);
        document.getElementById("ch2Toggle").classList.toggle("on", ch === 2);
        // load channel params into toolbar
        const p = state.ch[ch];
        document.getElementById("freq").value =
          p.freq >= 1000 ? p.freq / 1000 : p.freq;
        document.getElementById("freqUnit").value =
          p.freq >= 1000 ? "1000" : "1";
        document.getElementById("amp").value = p.amp;
        document.getElementById("offset").value = p.offset;
        document.getElementById("phase").value = Math.round(
          (p.phase * 180) / Math.PI,
        );
        // reflect wave type button
        document
          .querySelectorAll(".wave-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.type === p.type),
          );
        updateBadge();
      }

      function setWaveType(type) {
        state.ch[state.activeCh].type = type;
        document
          .querySelectorAll(".wave-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.type === type),
          );
        updateBadge();
      }

      function toggleMod(kind) {
        state.mods[kind] = !state.mods[kind];
        document
          .getElementById(
            "mod" + (kind === "sweep" ? "Sweep" : kind.toUpperCase()),
          )
          .classList.toggle("active", state.mods[kind]);
        updateBadge();
      }

      function updateBadge() {
        const p = state.ch[state.activeCh];
        const freqHz = p.freq;
        const freqTxt =
          freqHz >= 1000
            ? (freqHz / 1000).toFixed(3) + " kHz"
            : freqHz.toFixed(3) + " Hz";
        const mods = [];
        if (state.mods.sweep) mods.push("SWEEP");
        if (state.mods.am) mods.push("AM");
        if (state.mods.fm) mods.push("FM");
        const modTxt = mods.length ? " · " + mods.join("+") : "";
        const out = state.output ? "" : " · MUTED";
        document.getElementById("ch1Badge").textContent =
          (state.activeCh === 1 ? "CH1" : "CH2") +
          " · " +
          p.type.toUpperCase() +
          " · " +
          freqTxt +
          " · " +
          p.amp.toFixed(2) +
          " Vpp" +
          modTxt +
          out;
        document.getElementById("ch2Badge").style.display =
          state.activeCh === 2 ? "" : "none";
      }

      // === Arbitrary editor ===
      function drawArbEditor() {
        const w = arbEditor.clientWidth || 260;
        const h = 130;
        arbEditor.setAttribute("viewBox", `0 0 ${w} ${h}`);
        arbEditor.innerHTML = "";

        // grid lines
        const cy = h / 2;
        const cline = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line",
        );
        cline.setAttribute("x1", "0");
        cline.setAttribute("y1", cy);
        cline.setAttribute("x2", w);
        cline.setAttribute("y2", cy);
        cline.setAttribute("class", "arb-center");
        arbEditor.appendChild(cline);
        for (let i = 1; i < 4; i++) {
          const lx = (w / 4) * i;
          const l = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line",
          );
          l.setAttribute("x1", lx);
          l.setAttribute("y1", 0);
          l.setAttribute("x2", lx);
          l.setAttribute("y2", h);
          l.setAttribute("class", "arb-center");
          arbEditor.appendChild(l);
        }

        // path through points
        const N = state.arb.length;
        let d = "";
        for (let i = 0; i < N; i++) {
          const x = (i / (N - 1)) * w;
          const y = cy - state.arb[i] * (h / 2 - 8);
          d += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
        }
        // close the period visually by connecting last to first across
        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        path.setAttribute("d", d);
        path.setAttribute("class", "arb-line");
        arbEditor.appendChild(path);

        // draggable points
        for (let i = 0; i < N; i++) {
          const x = (i / (N - 1)) * w;
          const y = cy - state.arb[i] * (h / 2 - 8);
          const c = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle",
          );
          c.setAttribute("cx", x);
          c.setAttribute("cy", y);
          c.setAttribute("r", 4);
          c.setAttribute("class", "arb-pt");
          c.setAttribute("data-idx", i);
          arbEditor.appendChild(c);
        }
      }

      // point dragging
      (function initArbDrag() {
        let dragging = -1;
        const start = (e) => {
          const tgt = e.target;
          if (tgt.classList && tgt.classList.contains("arb-pt")) {
            dragging = parseInt(tgt.getAttribute("data-idx"));
            e.preventDefault();
          }
        };
        const move = (e) => {
          if (dragging < 0) return;
          const rect = arbEditor.getBoundingClientRect();
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const h = rect.height;
          let y = clientY - rect.top;
          y = Math.max(6, Math.min(h - 6, y));
          const cy = h / 2;
          const val = (cy - y) / (h / 2 - 8);
          state.arb[dragging] = Math.max(-1, Math.min(1, val));
          drawArbEditor();
        };
        const end = () => {
          dragging = -1;
        };
        arbEditor.addEventListener("mousedown", start);
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", end);
        arbEditor.addEventListener("touchstart", start, { passive: false });
        document.addEventListener("touchmove", move, { passive: false });
        document.addEventListener("touchend", end);
      })();

      function arbPreset(name) {
        const N = state.arb.length;
        for (let i = 0; i < N; i++) {
          const x = (i / (N - 1)) * Math.PI * 2;
          if (name === "sine") state.arb[i] = Math.sin(x);
          else if (name === "pulse") state.arb[i] = i / N < 0.3 ? 1 : -0.2;
          else if (name === "ramp") state.arb[i] = (i / (N - 1)) * 2 - 1;
          else if (name === "heartbeat") {
            const t = i / N;
            state.arb[i] =
              t < 0.1
                ? Math.sin(t * 10 * Math.PI) * 0.9
                : t < 0.18
                  ? -0.4
                  : t < 0.25
                    ? Math.sin((t - 0.18) * 14 * Math.PI) * 0.5
                    : 0;
          } else if (name === "decay")
            state.arb[i] = Math.sin(x) * Math.exp(-(i / N) * 2);
        }
        drawArbEditor();
      }

      function applyFormula() {
        const expr = document.getElementById("formula").value.trim();
        if (!expr) return;
        try {
          const fn = new Function("x", "with(Math){return " + expr + "}");
          const N = state.arb.length;
          for (let i = 0; i < N; i++) {
            const x = (i / (N - 1)) * Math.PI * 2;
            let v = fn(x);
            if (!isFinite(v)) v = 0;
            state.arb[i] = Math.max(-1, Math.min(1, v));
          }
          drawArbEditor();
        } catch (e) {
          alert("公式错误: " + e.message);
        }
      }

      function syncToHardware() {
        // Visual feedback only (no backend in this demo)
        const btn = event.currentTarget;
        const orig = btn.innerHTML;
        btn.innerHTML =
          '<i data-lucide="check" style="width:12px;height:12px;"></i> 已同步';
        lucide.createIcons();
        setTimeout(() => {
          btn.innerHTML = orig;
          lucide.createIcons();
        }, 1500);
      }

      // === Status timer ===
      let elapsed = 0;
      setInterval(() => {
        elapsed++;
        const h = String(Math.floor(elapsed / 3600)).padStart(2, "0");
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
        const s = String(elapsed % 60).padStart(2, "0");
        document.getElementById("statusTime").textContent = `${h}:${m}:${s}`;
      }, 1000);

      // === Init ===
      function init() {
        drawGrid();
        drawArbEditor();
        readParams();
        updateBadge();
        requestAnimationFrame(animate);
        if (window.lucide) lucide.createIcons();
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          drawGrid();
          drawArbEditor();
        }, 100);
      });

      window.addEventListener("DOMContentLoaded", init);
      if (document.readyState !== "loading") init();

      ETP.initWindow();
      lucide.createIcons();
    </script>
  </body>
</html>
