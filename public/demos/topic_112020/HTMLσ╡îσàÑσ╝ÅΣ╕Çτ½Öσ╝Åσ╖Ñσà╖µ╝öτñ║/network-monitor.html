<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络抓包</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

:root {
  /* === Primary Palette — Dark Sci-Fi with Purple === */
  --color-bg-primary: #0d0f1a;
  --color-bg-secondary: #131525;
  --color-bg-surface: #1a1d32;
  --color-bg-elevated: #222640;
  --color-bg-hover: #2a2f4a;

  /* === Purple Accent System === */
  --color-accent-primary: #8b5cf6;
  --color-accent-light: #a78bfa;
  --color-accent-lighter: #c4b5fd;
  --color-accent-dark: #7c3aed;
  --color-accent-darker: #6d28d9;
  --color-accent-glow: rgba(139, 92, 246, 0.25);

  /* === Cyan/Tech Secondary === */
  --color-tech-cyan: #22d3ee;
  --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
  --color-tech-green: #34d399;
  --color-tech-green-dim: rgba(52, 211, 153, 0.15);

  /* === Semantic Status Colors === */
  --state-success: #34d399;
  --state-warning: #fbbf24;
  --state-error: #f87171;
  --state-info: #60a5fa;

  /* === Text System === */
  --color-text-primary: #f1f5f9;
  --color-text-secondary: #94a3b8;
  --color-text-muted: #64748b;
  --color-text-inverse: #0f172a;

  /* === Border System === */
  --color-border: #2d3148;
  --color-border-active: #8b5cf6;
  --color-border-subtle: #1e2236;

  /* === Typography === */
  --font-family-display: 'Inter', system-ui, -apple-system, sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --font-family-body: 'Inter', system-ui, -apple-system, sans-serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.875rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;

  /* === Spacing Scale === */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;

  /* === Radius === */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
  --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
}

html.dark { --color-bg-primary:#0d0f1a; --color-bg-secondary:#131525; --color-bg-surface:#1a1d32; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family-body); background: var(--color-bg-primary); color: var(--color-text-primary); }

/* === Utility Classes === */
.etp-font-display { font-family: var(--font-family-display); }
.etp-font-mono { font-family: var(--font-family-mono); }
.etp-font-body { font-family: var(--font-family-body); }
.etp-text-accent { color: var(--color-accent-primary); }
.etp-text-cyan { color: var(--color-tech-cyan); }
.etp-text-green { color: var(--color-tech-green); }
.etp-text-muted { color: var(--color-text-secondary); }
.etp-bg-surface { background-color: var(--color-bg-surface); }
.etp-bg-elevated { background-color: var(--color-bg-elevated); }
.etp-border-glow { border: 1px solid var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-card-hover { transition: all 0.2s ease; }
.etp-card-hover:hover { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
.etp-grid-bg {
  background-image:
    linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
.etp-scanline::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 92, 246, 0.015) 2px, rgba(139, 92, 246, 0.015) 4px);
  pointer-events: none;
}

/* LED indicator */
.etp-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.etp-led-green { background: var(--state-success); box-shadow: 0 0 6px var(--state-success); }
.etp-led-red { background: var(--state-error); box-shadow: 0 0 6px var(--state-error); }
.etp-led-yellow { background: var(--state-warning); box-shadow: 0 0 6px var(--state-warning); }
@keyframes etp-led-breathe { 0%,100%{opacity:1} 50%{opacity:.5} }

.etp-btn-tool {
  background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); cursor: pointer; transition: all 0.15s ease;
}
.etp-btn-tool:hover { background: var(--color-bg-hover); border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }

.etp-statusbar { background: var(--color-bg-secondary); border-top: 1px solid var(--color-border); padding: var(--space-1) var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* shared form controls */
.etp-input, .etp-select {
  width: 100%; background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-family: var(--font-family-mono); outline: none; transition: border-color .15s;
}
.etp-input:focus, .etp-select:focus { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-label { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* toggle switch */
.etp-toggle { position: relative; display: inline-block; width: 34px; height: 18px; }
.etp-toggle input { opacity: 0; width: 0; height: 0; }
.etp-toggle-track { position: absolute; cursor: pointer; inset: 0; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-full); transition: .2s; }
.etp-toggle-track::before { content: ''; position: absolute; height: 12px; width: 12px; left: 2px; top: 2px; background: var(--color-text-muted); border-radius: 50%; transition: .2s; }
.etp-toggle input:checked + .etp-toggle-track { background: rgba(139,92,246,.25); border-color: var(--color-accent-primary); }
.etp-toggle input:checked + .etp-toggle-track::before { transform: translateX(16px); background: var(--color-accent-primary); box-shadow: 0 0 6px var(--color-accent-primary); }

/* scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--color-bg-primary); }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-accent-primary); }

    html,body{height:100%} body{display:flex;flex-direction:column;overflow:hidden}
    [data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}

    .topbar{background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);padding:var(--space-2) var(--space-4);flex-shrink:0;display:flex;flex-direction:column;gap:var(--space-2)}
    .row1{display:flex;gap:var(--space-2);align-items:center}
    .title{font-weight:700;color:var(--color-accent-light);letter-spacing:.04em;display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-family-mono)}
    .sep{width:1px;height:24px;background:var(--color-border)}
    .nic-sel{width:200px;font-family:var(--font-family-mono)}
    .bpf-input{flex:1;font-family:var(--font-family-mono)}
    .btn-cap{display:flex;align-items:center;gap:var(--space-2);background:linear-gradient(135deg,var(--color-accent-primary),var(--color-accent-dark));border:none;color:#fff;padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:var(--font-size-sm);font-family:var(--font-family-display);transition:all .15s;white-space:nowrap}
    .btn-cap:hover{box-shadow:var(--shadow-glow)}
    .btn-cap.capturing{background:linear-gradient(135deg,var(--state-error),#b91c1c)}
    .btn-tool{background:var(--color-bg-elevated);border:1px solid var(--color-border);color:var(--color-text-primary);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);font-size:var(--font-size-sm);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
    .btn-tool:hover{background:var(--color-bg-hover);border-color:var(--color-accent-primary)}
    .row2{display:flex;gap:var(--space-4);align-items:center;font-size:var(--font-size-xs);color:var(--color-text-muted);font-family:var(--font-family-mono)}
    .metric{display:flex;align-items:center;gap:var(--space-2)}
    .metric .l{text-transform:uppercase}
    .led-cap{width:8px;height:8px;border-radius:50%;background:var(--color-text-muted)}
    .led-cap.on{background:var(--state-error);box-shadow:0 0 6px var(--state-error);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .layout{display:flex;flex:1;overflow:hidden}
    .panel{background:var(--color-bg-secondary);overflow-y:auto}
    .panel-left{width:240px;flex-shrink:0;border-right:1px solid var(--color-border)}
    .panel-mid{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--color-bg-primary)}

    .section-h{font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);margin:0 0 var(--space-2);font-family:var(--font-family-mono);display:flex;align-items:center;gap:6px}
    .section-h::before{content:'';width:3px;height:12px;background:var(--color-accent-primary);border-radius:2px}
    .panel-block{padding:var(--space-3);border-bottom:1px solid var(--color-border-subtle)}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:var(--space-2)}
    .field{margin-bottom:var(--space-2)}
    .field label{display:block;font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}

    .nic-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-2);font-size:var(--font-size-xs);font-family:var(--font-family-mono);color:var(--color-text-secondary);cursor:pointer;border-radius:var(--radius-sm);margin-bottom:2px}
    .nic-item:hover{background:var(--color-bg-hover)}
    .nic-item.active{background:rgba(139,92,246,.15);color:var(--color-accent-light);border:1px solid rgba(139,92,246,.3)}
    .nic-item .dot{width:6px;height:6px;border-radius:50%;background:var(--state-success);box-shadow:0 0 4px var(--state-success);flex-shrink:0}
    .nic-item .dot.down{background:var(--color-text-muted);box-shadow:none}
    .nic-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nic-item .ip{color:var(--color-text-muted);font-size:10px}

    .proto-bar{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1);font-size:var(--font-size-xs)}
    .proto-bar .n{width:50px;color:var(--color-text-secondary);font-family:var(--font-family-mono)}
    .proto-bar .track{flex:1;height:6px;background:var(--color-bg-primary);border-radius:3px;overflow:hidden}
    .proto-bar .fill{height:100%;border-radius:3px;transition:width .4s ease}
    .proto-bar .p{width:34px;text-align:right;color:var(--color-text-muted);font-family:var(--font-family-mono)}

    .pkt-table{width:100%;border-collapse:collapse;font-size:var(--font-size-xs)}
    .pkt-table th{text-align:left;padding:var(--space-1) var(--space-2);color:var(--color-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:10px;position:sticky;top:0;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);white-space:nowrap;z-index:1}
    .pkt-table td{padding:2px var(--space-2);font-family:var(--font-family-mono);color:var(--color-text-secondary);border-bottom:1px solid var(--color-border-subtle);white-space:nowrap;cursor:pointer}
    .pkt-table tr:hover td{background:var(--color-bg-hover);color:var(--color-text-primary)}
    .pkt-table tr.active td{background:rgba(139,92,246,.12);color:var(--color-text-primary)}
    .proto-tag{font-weight:600;padding:1px 6px;border-radius:var(--radius-full);font-size:10px}
    .pt-TCP{background:rgba(96,165,250,.15);color:var(--state-info)}
    .pt-UDP{background:rgba(52,211,153,.15);color:var(--state-success)}
    .pt-HTTP{background:rgba(139,92,246,.15);color:var(--color-accent-light)}
    .pt-DNS{background:rgba(251,191,36,.15);color:var(--state-warning)}
    .pt-ARP{background:rgba(167,139,250,.15);color:var(--color-accent-lighter)}
    .pt-TLS{background:rgba(248,113,113,.15);color:var(--state-error)}
    .pt-ICMP{background:rgba(34,211,238,.15);color:var(--color-tech-cyan)}
    .pt-MQTT{background:rgba(139,92,246,.15);color:var(--color-accent-light)}

    .pkt-list{flex:1;overflow:auto;border-bottom:1px solid var(--color-border);min-height:0}
    .pkt-bottom{display:flex;flex:1;min-height:0}
    .detail-pane{flex:1;overflow:auto;padding:var(--space-3);border-right:1px solid var(--color-border-subtle);min-width:0;font-family:var(--font-family-mono);font-size:var(--font-size-xs);line-height:1.6}
    .hex-pane{width:46%;flex-shrink:0;overflow:auto;padding:var(--space-3);background:var(--color-bg-primary);min-width:0}
    .tree-node{padding:1px 0}
    .tree-node .row-n{display:flex;align-items:center;gap:4px;padding:1px 2px;border-radius:var(--radius-sm)}
    .tree-node .row-n:hover{background:var(--color-bg-hover)}
    .tree-node .caret{color:var(--color-text-muted);width:12px;display:inline-block;cursor:pointer}
    .tree-node .label{color:var(--color-accent-light)}
    .tree-node .val{color:var(--color-text-secondary)}
    .tree-node .sub{padding-left:18px}
    .tree-node.leaf .caret{color:var(--color-text-muted)}
    .empty-hint{color:var(--color-text-muted);font-style:italic;padding:var(--space-4);text-align:center}

    .hex-view{font-family:var(--font-family-mono);font-size:10px;line-height:1.7}
    .hex-row{display:flex;gap:var(--space-2)}
    .hex-offset{color:var(--color-accent-light);min-width:3.5em}
    .hex-bytes{color:var(--color-text-primary);letter-spacing:.05em}
    .hex-ascii{color:var(--color-tech-cyan)}

    .filter-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:var(--space-2)}
    .chip{background:var(--color-bg-elevated);border:1px solid var(--color-border);color:var(--color-text-muted);padding:2px 8px;border-radius:var(--radius-full);font-size:10px;cursor:pointer;font-family:var(--font-family-mono)}
    .chip.active{background:rgba(139,92,246,.15);border-color:var(--color-accent-primary);color:var(--color-accent-light)}

    @media(max-width:900px){
      body{overflow:auto}
      .layout{flex-direction:column;overflow:visible}
      .panel-left{width:100%;border-right:none;border-bottom:1px solid var(--color-border)}
      .panel-mid{min-height:560px}
      .pkt-bottom{flex-direction:column}
      .hex-pane{width:100%;border-top:1px solid var(--color-border-subtle)}
      .topbar{padding:var(--space-2)}
      .row1{flex-wrap:wrap}
      .nic-sel{width:140px}
    }
  </style>
</head>
<body class="etp-grid-bg">
  <header class="topbar">
    <div class="row1">
      <span class="title"><i data-lucide="radar" style="width:16px;height:16px"></i> 网络抓包</span>
      <div class="sep"></div>
      <select class="etp-select nic-sel" id="nicSel" onchange="selectNic(this.value)"></select>
      <input class="etp-input bpf-input" id="bpf" value="tcp port 80 or tcp port 1883" placeholder="BPF 过滤表达式 (e.g. tcp port 80)">
      <button class="btn-cap" id="capBtn" onclick="toggleCapture()"><span class="led-cap" id="capLed"></span><span id="capLabel">开始捕获</span></button>
      <button class="btn-tool" onclick="clearPackets()" title="清空"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
      <button class="btn-tool" onclick="exportPcap()" title="导出 pcap"><i data-lucide="download" style="width:14px;height:14px"></i></button>
    </div>
    <div class="row2">
      <span class="metric"><span class="led-cap" id="liveLed"></span><span class="l">状态</span><span id="capState" style="color:var(--color-text-secondary)">就绪</span></span>
      <span class="sep"></span>
      <span class="metric"><span class="l">捕获</span><span id="capDur" style="color:var(--color-tech-green)">00:00:00</span></span>
      <span class="sep"></span>
      <span class="metric"><span class="l">包数</span><span id="pktCount" style="color:var(--color-accent-light)">0</span></span>
      <span class="sep"></span>
      <span class="metric"><span class="l">速率</span><span id="pktRate" style="color:var(--color-tech-cyan)">0 p/s</span></span>
      <span class="sep"></span>
      <span class="metric"><span class="l">已显示</span><span id="shownCount" style="color:var(--color-text-secondary)">0</span></span>
      <div style="flex:1"></div>
      <span style="color:var(--color-text-muted)">网卡: <span id="curNic" style="color:var(--color-accent-light)">—</span></span>
    </div>
  </header>

  <div class="layout">
    <!-- LEFT: NIC list + options + protocol filter + stats -->
    <aside class="panel panel-left">
      <div class="panel-block">
        <div class="section-h">网络接口</div>
        <div id="nicList"></div>
      </div>
      <div class="panel-block">
        <div class="section-h">捕获选项</div>
        <div class="toggle-row"><span>混杂模式</span><label class="etp-toggle"><input type="checkbox" checked><span class="etp-toggle-track"></span></label></div>
        <div class="toggle-row"><span>解析应用层</span><label class="etp-toggle"><input type="checkbox" checked><span class="etp-toggle-track"></span></label></div>
        <div class="toggle-row"><span>反向 DNS</span><label class="etp-toggle"><input type="checkbox"><span class="etp-toggle-track"></span></label></div>
        <div class="field">
          <label>捕获长度 (snaplen)</label>
          <input class="etp-input" value="65535">
        </div>
        <div class="field">
          <label>缓冲 (packets)</label>
          <input class="etp-input" value="1000">
        </div>
      </div>
      <div class="panel-block">
        <div class="section-h">协议过滤</div>
        <div class="filter-chips" id="filterChips">
          <span class="chip active" data-proto="ALL" onclick="setProtoFilter(this)">全部</span>
          <span class="chip" data-proto="TCP" onclick="setProtoFilter(this)">TCP</span>
          <span class="chip" data-proto="UDP" onclick="setProtoFilter(this)">UDP</span>
          <span class="chip" data-proto="HTTP" onclick="setProtoFilter(this)">HTTP</span>
          <span class="chip" data-proto="DNS" onclick="setProtoFilter(this)">DNS</span>
          <span class="chip" data-proto="TLS" onclick="setProtoFilter(this)">TLS</span>
          <span class="chip" data-proto="MQTT" onclick="setProtoFilter(this)">MQTT</span>
          <span class="chip" data-proto="ARP" onclick="setProtoFilter(this)">ARP</span>
          <span class="chip" data-proto="ICMP" onclick="setProtoFilter(this)">ICMP</span>
        </div>
      </div>
      <div class="panel-block">
        <div class="section-h">协议分布</div>
        <div id="protoDist"></div>
      </div>
    </aside>

    <!-- CENTER: packet list + detail tree + hex -->
    <section class="panel-mid">
      <!-- Packet list -->
      <div class="pkt-list">
        <table class="pkt-table">
          <thead><tr><th>No.</th><th>时间</th><th>源地址</th><th>目的地址</th><th>协议</th><th>长度</th><th>信息</th></tr></thead>
          <tbody id="pktBody">
            <tr><td colspan="7" class="empty-hint">点击"开始捕获"采集数据包</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pkt-bottom">
        <!-- Detail tree -->
        <div class="detail-pane" id="detailPane">
          <div class="empty-hint">选择一个数据包查看协议分层详情</div>
        </div>
        <!-- Hex dump -->
        <div class="hex-pane" id="hexPane">
          <div class="empty-hint">选择一个数据包查看 Hex dump</div>
        </div>
      </div>
    </section>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    ETP.initWindow();
    let capturing=false, capStart=0, capSec=0, pktSeq=0, rateWin=[];
    let protoFilter='ALL';
    const packets=[]; // {no,ts,src,dst,proto,len,info,raw,tree}
    const nics=[
      {name:'eth0',ip:'192.168.1.20',up:true,desc:'千兆以太网'},
      {name:'wlan0',ip:'192.168.1.42',up:true,desc:'无线网卡'},
      {name:'enxUSB',ip:'10.0.0.1',up:false,desc:'USB 网卡'},
      {name:'lo',ip:'127.0.0.1',up:true,desc:'回环'},
      {name:'docker0',ip:'172.17.0.1',up:true,desc:'Docker 网桥'},
    ];
    let curNic='eth0';

    function renderNics(){
      const sel=document.getElementById('nicSel');sel.innerHTML='';
      const list=document.getElementById('nicList');list.innerHTML='';
      nics.forEach(n=>{
        const o=document.createElement('option');o.value=n.name;o.textContent=`${n.name} (${n.ip})`;sel.appendChild(o);
        const div=document.createElement('div');div.className='nic-item'+(n.name===curNic?' active':'');
        div.dataset.name=n.name;div.onclick=()=>selectNic(n.name);
        div.innerHTML=`<span class="dot ${n.up?'':'down'}"></span><span class="nm">${n.name}</span><span class="ip">${n.ip}</span>`;
        list.appendChild(div);
      });
      sel.value=curNic;
      document.getElementById('curNic').textContent=curNic;
    }
    function selectNic(name){
      curNic=name;
      document.getElementById('nicSel').value=name;
      document.getElementById('curNic').textContent=name;
      document.querySelectorAll('.nic-item').forEach(d=>d.classList.toggle('active',d.dataset.name===name));
      addCapLog('切换网卡 → '+name);
    }

    function toggleCapture(){
      capturing=!capturing;
      const btn=document.getElementById('capBtn'),led=document.getElementById('capLed'),live=document.getElementById('liveLed'),label=document.getElementById('capLabel'),state=document.getElementById('capState');
      if(capturing){
        btn.classList.add('capturing');label.textContent='停止捕获';led.classList.add('on');live.classList.add('on');
        state.textContent='捕获中';state.style.color='var(--state-error)';
        capStart=Date.now();capSec=0;rateWin=[];
        addCapLog('开始捕获 on '+curNic+' (bpf: '+(document.getElementById('bpf').value||'none')+')');
        // clear table placeholder
        const tb=document.getElementById('pktBody');if(tb.querySelector('.empty-hint'))tb.innerHTML='';
      }else{
        btn.classList.remove('capturing');label.textContent='开始捕获';led.classList.remove('on');live.classList.remove('on');
        state.textContent='就绪';state.style.color='var(--color-text-secondary)';
        addCapLog('停止捕获, 共 '+packets.length+' 包');
      }
    }

    // Packet generator (simulated)
    const srcs=['192.168.1.20','192.168.1.31','192.168.1.42','10.0.0.5','192.168.1.100'];
    const dsts=['192.168.1.1','8.8.8.8','192.168.1.100','142.250.80.46','192.168.1.31'];
    const macs=['a4:bb:6d:11:22:33','b8:27:eb:99:88:77','00:1a:2b:3c:4d:5e','ff:ff:ff:ff:ff:ff'];
    function genPacket(){
      const protos=['TCP','UDP','HTTP','DNS','TLS','MQTT','ARP','ICMP'];
      const proto=protos[Math.floor(Math.random()*protos.length)];
      const src=srcs[Math.floor(Math.random()*srcs.length)];
      const dst=dsts[Math.floor(Math.random()*dsts.length)];
      const len=54+Math.floor(Math.random()*800);
      const info=protoInfo(proto,src,dst);
      const raw=genRaw(len);
      const tree=buildTree(proto,src,dst,len,raw);
      return {proto,src,dst,len,info,raw,tree};
    }
    function protoInfo(proto,src,dst){
      switch(proto){
        case 'TCP':return `${src.split('.').slice(-1)[0]} → ${dst.split('.').slice(-1)[0]} [ACK, PSH] Seq=1 Ack=1 Win=64240 Len=1448`;
        case 'UDP':return `${src.split('.').slice(-1)[0]} → ${dst.split('.').slice(-1)[0]} Len=${20+Math.floor(Math.random()*200)}`;
        case 'HTTP':return `GET /api/devices HTTP/1.1, Host: ${dst}`;
        case 'DNS':return `Standard query 0x${rndHex(4)} A api.example.com`;
        case 'TLS':return `TLSv1.3 Application Data, ${src} → ${dst}`;
        case 'MQTT':return `PUBLISH, QoS0, topic: sensor/temperature`;
        case 'ARP':return `Who has ${dst}? Tell ${src}`;
        case 'ICMP':return `Echo (ping) request, id=${Math.floor(Math.random()*65535)}, seq=1`;
        default:return '';
      }
    }
    function rndHex(n){let s='';for(let i=0;i<n;i++)s+=Math.floor(Math.random()*16).toString(16);return s;}
    function genRaw(len){
      const arr=[];for(let i=0;i<len;i++)arr.push(Math.floor(Math.random()*256));return arr;
    }
    function buildTree(proto,src,dst,len,raw){
      const smac=macs[Math.floor(Math.random()*macs.length)],dmac=macs[Math.floor(Math.random()*macs.length)];
      const sport=40000+Math.floor(Math.random()*20000),dport=pickPort(proto);
      return [
        {label:'Ethernet II',val:`${smac} → ${dmac}`,children:[
          {label:'Destination',val:dmac},{label:'Source',val:smac},{label:'Type',val:proto==='ARP'?'ARP (0x0806)':'IPv4 (0x0800)'}
        ]},
        proto==='ARP'?{label:'Address Resolution Protocol',val:`${src} → ${dst}`,children:[
          {label:'Opcode',val:'request (1)'},{label:'Sender MAC',val:smac},{label:'Sender IP',val:src},{label:'Target IP',val:dst}
        ]}:proto==='ICMP'?{label:'Internet Control Message Protocol',val:'Echo request',children:[
          {label:'Type',val:'8 (Echo request)'},{label:'Code',val:'0'},{label:'Checksum',val:'0x'+rndHex(4)},{label:'Identifier',val:String(Math.floor(Math.random()*65535))},{label:'Sequence',val:'1'}
        ]}:{label:'Internet Protocol Version 4',val:`${src} → ${dst}`,children:[
          {label:'Version',val:'4'},{label:'Header Length',val:'20 bytes'},{label:'TTL',val:String(48+Math.floor(Math.random()*16))},{label:'Protocol',val:proto==='UDP'||proto==='DNS'?'UDP (17)':'TCP (6)'},{label:'Source',val:src},{label:'Destination',val:dst}
        ]},
        (proto==='UDP'||proto==='DNS')?{label:'User Datagram Protocol',val:`Src Port: ${proto==='DNS'?Math.floor(Math.random()*65535):sport}, Dst Port: ${dport}`,children:[
          {label:'Source Port',val:String(sport)},{label:'Destination Port',val:String(dport)},{label:'Length',val:String(len-28)},{label:'Checksum',val:'0x'+rndHex(4)}
        ]}:(proto!=='ARP'&&proto!=='ICMP')?{label:'Transmission Control Protocol',val:`${sport} → ${dport} [ACK,PSH]`,children:[
          {label:'Source Port',val:String(sport)},{label:'Destination Port',val:String(dport)},{label:'Sequence Number',val:'1'},{label:'Acknowledgment',val:'1'},{label:'Flags',val:'0x018 (ACK, PSH)'},{label:'Window',val:'64240'}
        ]}:null,
        appLayer(proto,src,dst)
      ].filter(Boolean);
    }
    function pickPort(proto){
      if(proto==='HTTP')return 80;if(proto==='DNS')return 53;if(proto==='TLS')return 443;if(proto==='MQTT')return 1883;return 8080;
    }
    function appLayer(proto,src,dst){
      switch(proto){
        case 'HTTP':return {label:'Hypertext Transfer Protocol',val:'GET /api/devices HTTP/1.1',children:[{label:'Method',val:'GET'},{label:'Request URI',val:'/api/devices'},{label:'Version',val:'HTTP/1.1'},{label:'Host',val:dst}]};
        case 'DNS':return {label:'Domain Name System',val:'query A api.example.com',children:[{label:'Transaction ID',val:'0x'+rndHex(4)},{label:'Questions',val:'1'},{label:'Query Name',val:'api.example.com'},{label:'Query Type',val:'A (1)'}]};
        case 'TLS':return {label:'Transport Layer Security',val:'TLSv1.3 Application Data',children:[{label:'Content Type',val:'Application Data (23)'},{label:'Version',val:'TLS 1.3'},{label:'Length',val:String(40+Math.floor(Math.random()*200))}]};
        case 'MQTT':return {label:'MQTT',val:'PUBLISH, QoS 0',children:[{label:'Message Type',val:'PUBLISH (3)'},{label:'Topic',val:'sensor/temperature'},{label:'QoS',val:'0'},{label:'Payload',val:'23.5°C'}]};
        default:return null;
      }
    }

    function addPacket(){
      if(!capturing)return;
      pktSeq++;
      const p=genPacket();p.no=pktSeq;
      const d=new Date();
      p.ts=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
      packets.push(p);
      if(packets.length>500) packets.shift();
      rateWindow();
      if(protoFilter==='ALL'||p.proto===protoFilter) renderPacketRow(p);
      document.getElementById('pktCount').textContent=packets.length;
      document.getElementById('shownCount').textContent=document.querySelectorAll('#pktBody tr:not(.empty-hint)').length;
      updateProtoDist();
    }
    function rateWindow(){rateWin.push(Date.now());rateWin=rateWin.filter(t=>Date.now()-t<1000);document.getElementById('pktRate').textContent=rateWin.length+' p/s';}
    function renderPacketRow(p){
      const tb=document.getElementById('pktBody');
      if(tb.querySelector('.empty-hint')) tb.innerHTML='';
      const tr=document.createElement('tr');tr.dataset.no=p.no;tr.onclick=()=>selectPacket(p.no);
      tr.innerHTML=`<td style="color:var(--color-text-muted)">${p.no}</td><td style="color:var(--color-text-muted)">${p.ts}</td><td>${p.src}</td><td>${p.dst}</td><td><span class="proto-tag pt-${p.proto}">${p.proto}</span></td><td>${p.len}</td><td style="color:var(--color-text-secondary)">${escapeHtml(p.info)}</td>`;
      tb.appendChild(tr);
      while(tb.childNodes.length>500) tb.removeChild(tb.firstChild);
      // auto-scroll to bottom
      tb.parentElement.scrollTop=tb.parentElement.scrollHeight;
    }
    function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

    function selectPacket(no){
      const p=packets.find(x=>x.no===no);if(!p)return;
      document.querySelectorAll('.pkt-table tr').forEach(t=>t.classList.remove('active'));
      const row=document.querySelector(`.pkt-table tr[data-no="${no}"]`);if(row)row.classList.add('active');
      renderDetail(p);renderHex(p.raw);
      try{ETP.windows.publish('netmon.select',{no});}catch(e){}
    }
    function renderDetail(p){
      const pane=document.getElementById('detailPane');pane.innerHTML='';
      p.tree.forEach(node=>pane.appendChild(treeNode(node)));
    }
    function treeNode(node){
      const wrap=document.createElement('div');wrap.className='tree-node';
      const row=document.createElement('div');row.className='row-n';
      const hasKids=node.children&&node.children.length;
      row.innerHTML=`<span class="caret">${hasKids?'▾':'•'}</span><span class="label">${escapeHtml(node.label)}</span>${node.val?`<span class="val">= ${escapeHtml(node.val)}</span>`:''}`;
      wrap.appendChild(row);
      if(hasKids){
        const sub=document.createElement('div');sub.className='sub';
        node.children.forEach(ch=>sub.appendChild(treeNode(ch)));
        wrap.appendChild(sub);
        row.style.cursor='pointer';
        row.onclick=()=>{sub.style.display=sub.style.display==='none'?'block':'none';row.querySelector('.caret').textContent=sub.style.display==='none'?'▸':'▾';};
      }
      return wrap;
    }
    function renderHex(raw){
      const pane=document.getElementById('hexPane');pane.innerHTML='';
      const view=document.createElement('div');view.className='hex-view';
      const max=Math.min(raw.length,256);
      for(let off=0;off<max;off+=16){
        const slice=raw.slice(off,Math.min(off+16,max));
        const hexStr=slice.map(b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(47,' ');
        const asc=slice.map(b=>b>=32&&b<127?String.fromCharCode(b):'.').join('');
        const r=document.createElement('div');r.className='hex-row';
        r.innerHTML=`<span class="hex-offset">${off.toString(16).padStart(4,'0')}</span><span class="hex-bytes">${hexStr}</span><span class="hex-ascii">${asc}</span>`;
        view.appendChild(r);
      }
      pane.appendChild(view);
    }

    function setProtoFilter(el){
      protoFilter=el.dataset.proto;
      document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
      el.classList.add('active');
      // re-render list
      const tb=document.getElementById('pktBody');tb.innerHTML='';
      packets.forEach(p=>{if(protoFilter==='ALL'||p.proto===protoFilter) renderPacketRow(p);});
      document.getElementById('shownCount').textContent=document.querySelectorAll('#pktBody tr:not(.empty-hint)').length;
    }

    function updateProtoDist(){
      const counts={};
      packets.forEach(p=>counts[p.proto]=(counts[p.proto]||0)+1);
      const total=packets.length||1;
      const colors={TCP:'var(--state-info)',UDP:'var(--state-success)',HTTP:'var(--color-accent-primary)',DNS:'var(--state-warning)',TLS:'var(--state-error)',MQTT:'var(--color-accent-light)',ARP:'var(--color-accent-lighter)',ICMP:'var(--color-tech-cyan)'};
      const el=document.getElementById('protoDist');el.innerHTML='';
      const order=['TCP','UDP','HTTP','DNS','TLS','MQTT','ARP','ICMP'];
      order.forEach(k=>{
        if(!counts[k])return;
        const div=document.createElement('div');div.className='proto-bar';
        div.innerHTML=`<span class="n">${k}</span><span class="track"><span class="fill" style="width:${counts[k]/total*100}%;background:${colors[k]}"></span></span><span class="p">${counts[k]}</span>`;
        el.appendChild(div);
      });
      if(!el.children.length)el.innerHTML='<div style="color:var(--color-text-muted);font-size:var(--font-size-xs)">暂无数据</div>';
    }

    function clearPackets(){
      packets.length=0;pktSeq=0;rateWin=[];
      document.getElementById('pktBody').innerHTML='<tr><td colspan="7" class="empty-hint">点击"开始捕获"采集数据包</td></tr>';
      document.getElementById('detailPane').innerHTML='<div class="empty-hint">选择一个数据包查看协议分层详情</div>';
      document.getElementById('hexPane').innerHTML='<div class="empty-hint">选择一个数据包查看 Hex dump</div>';
      document.getElementById('pktCount').textContent='0';
      document.getElementById('shownCount').textContent='0';
      document.getElementById('pktRate').textContent='0 p/s';
      updateProtoDist();
      addCapLog('已清空数据包列表');
    }
    function exportPcap(){alert('已导出 capture.pcap（模拟, '+packets.length+' 包）');}
    function addCapLog(msg){try{ETP.windows.publish('netmon.log',{msg});}catch(e){}}

    function tick(){
      if(capturing){
        capSec++;
        document.getElementById('capDur').textContent=`${String(Math.floor(capSec/3600)).padStart(2,'0')}:${String(Math.floor(capSec%3600/60)).padStart(2,'0')}:${String(capSec%60).padStart(2,'0')}`;
      }
    }
    // burst capture: generate a few packets per tick
    function capTick(){
      if(!capturing)return;
      const n=1+Math.floor(Math.random()*4);
      for(let i=0;i<n;i++) setTimeout(addPacket,i*60);
    }
    setInterval(tick,1000);
    setInterval(capTick,800);

    renderNics();
    updateProtoDist();
    lucide.createIcons();
  </script>
</body>
</html>
