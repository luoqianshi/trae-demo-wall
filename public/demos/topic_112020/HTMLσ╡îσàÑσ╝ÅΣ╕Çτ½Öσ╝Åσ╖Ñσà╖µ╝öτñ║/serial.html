<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>串口 (UART)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/theme.css" />
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

      :root {
        /* === Primary Palette — Dark Sci-Fi with Purple === */
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
        --color-bg-elevated: #222640;
        --color-bg-hover: #2a2f4a;

        /* === Purple Accent System === */
        --color-accent-primary: #8b5cf6;
        --color-accent-light: #a78bfa;
        --color-accent-lighter: #c4b5fd;
        --color-accent-dark: #7c3aed;
        --color-accent-darker: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.25);

        /* === Cyan/Tech Secondary === */
        --color-tech-cyan: #22d3ee;
        --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
        --color-tech-green: #34d399;
        --color-tech-green-dim: rgba(52, 211, 153, 0.15);

        /* === Semantic Status Colors === */
        --state-success: #34d399;
        --state-warning: #fbbf24;
        --state-error: #f87171;
        --state-info: #60a5fa;

        /* === Text System === */
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #94a3b8;
        --color-text-muted: #64748b;
        --color-text-inverse: #0f172a;

        /* === Border System === */
        --color-border: #2d3148;
        --color-border-active: #8b5cf6;
        --color-border-subtle: #1e2236;

        /* === Typography === */
        --font-family-display: "Inter", system-ui, -apple-system, sans-serif;
        --font-family-mono:
          "JetBrains Mono", "Fira Code", "Consolas", monospace;
        --font-family-body: "Inter", system-ui, -apple-system, sans-serif;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.8125rem;
        --font-size-base: 0.875rem;
        --font-size-md: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.5rem;
        --font-size-2xl: 2rem;

        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        /* === Spacing Scale === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

        /* === Radius === */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* === Shadows === */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
        --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
      }

      html.dark {
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-family-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }

      /* === Utility Classes === */
      .etp-font-display {
        font-family: var(--font-family-display);
      }
      .etp-font-mono {
        font-family: var(--font-family-mono);
      }
      .etp-font-body {
        font-family: var(--font-family-body);
      }
      .etp-text-accent {
        color: var(--color-accent-primary);
      }
      .etp-text-cyan {
        color: var(--color-tech-cyan);
      }
      .etp-text-green {
        color: var(--color-tech-green);
      }
      .etp-text-muted {
        color: var(--color-text-secondary);
      }
      .etp-bg-surface {
        background-color: var(--color-bg-surface);
      }
      .etp-bg-elevated {
        background-color: var(--color-bg-elevated);
      }
      .etp-border-glow {
        border: 1px solid var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-card-hover {
        transition: all 0.2s ease;
      }
      .etp-card-hover:hover {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }
      .etp-grid-bg {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .etp-scanline::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139, 92, 246, 0.015) 2px,
          rgba(139, 92, 246, 0.015) 4px
        );
        pointer-events: none;
      }

      /* LED indicator */
      .etp-led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .etp-led-green {
        background: var(--state-success);
        box-shadow: 0 0 6px var(--state-success);
      }
      .etp-led-red {
        background: var(--state-error);
        box-shadow: 0 0 6px var(--state-error);
      }
      .etp-led-yellow {
        background: var(--state-warning);
        box-shadow: 0 0 6px var(--state-warning);
      }
      @keyframes etp-led-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .etp-btn-tool {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .etp-btn-tool:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }

      .etp-statusbar {
        background: var(--color-bg-secondary);
        border-top: 1px solid var(--color-border);
        padding: var(--space-1) var(--space-4);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* shared form controls */
      .etp-input,
      .etp-select {
        width: 100%;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        font-family: var(--font-family-mono);
        outline: none;
        transition: border-color 0.15s;
      }
      .etp-input:focus,
      .etp-select:focus {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-label {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* toggle switch */
      .etp-toggle {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }
      .etp-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .etp-toggle-track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        transition: 0.2s;
      }
      .etp-toggle-track::before {
        content: "";
        position: absolute;
        height: 12px;
        width: 12px;
        left: 2px;
        top: 2px;
        background: var(--color-text-muted);
        border-radius: 50%;
        transition: 0.2s;
      }
      .etp-toggle input:checked + .etp-toggle-track {
        background: rgba(139, 92, 246, 0.25);
        border-color: var(--color-accent-primary);
      }
      .etp-toggle input:checked + .etp-toggle-track::before {
        transform: translateX(16px);
        background: var(--color-accent-primary);
        box-shadow: 0 0 6px var(--color-accent-primary);
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-primary);
      }

      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: var(--color-bg-secondary);
        border-bottom: 1px solid var(--color-border);
        height: 44px;
        display: flex;
        align-items: center;
        padding: 0 var(--space-4);
        gap: var(--space-3);
        flex-shrink: 0;
        font-family: var(--font-family-mono);
      }
      .topbar .title {
        font-weight: 700;
        color: var(--color-accent-light);
        letter-spacing: 0.04em;
      }
      .sep {
        width: 1px;
        height: 24px;
        background: var(--color-border);
      }
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .panel {
        background: var(--color-bg-secondary);
        overflow-y: auto;
        padding: var(--space-4);
      }
      .panel-left {
        width: 260px;
        flex-shrink: 0;
        border-right: 1px solid var(--color-border);
      }
      .panel-right {
        width: 260px;
        flex-shrink: 0;
        border-left: 1px solid var(--color-border);
      }
      .panel-mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .field {
        margin-bottom: var(--space-3);
      }
      .field label {
        display: block;
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        gap: var(--space-2);
      }
      .row > * {
        flex: 1;
      }
      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--color-accent-primary),
          var(--color-accent-dark)
        );
        border: none;
        color: #fff;
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-sm);
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font-family-display);
        font-size: var(--font-size-sm);
        width: 100%;
        transition: all 0.15s;
      }
      .btn-primary:hover {
        box-shadow: var(--shadow-glow);
      }
      .btn-primary.stop {
        background: linear-gradient(135deg, var(--state-error), #b91c1c);
      }
      .terminal {
        flex: 1;
        background: #0a0c14;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        margin: var(--space-3);
        overflow-y: auto;
        padding: var(--space-3);
        font-family: var(--font-family-mono);
        font-size: 12px;
        line-height: 1.5;
        position: relative;
        color: var(--color-tech-green);
      }
      .terminal .rx {
        color: var(--color-tech-green);
      }
      .terminal .tx {
        color: var(--color-tech-cyan);
      }
      .terminal .err {
        color: var(--state-error);
      }
      .terminal .ts {
        color: var(--color-text-muted);
        margin-right: 6px;
      }
      .send-bar {
        display: flex;
        gap: var(--space-2);
        padding: 0 var(--space-3) var(--space-3);
      }
      .send-bar input {
        flex: 1;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .stat-cell {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-2);
      }
      .stat-cell .l {
        font-size: 10px;
        color: var(--color-text-muted);
        text-transform: uppercase;
      }
      .stat-cell .v {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-md);
        font-weight: 600;
      }
      .preset {
        display: flex;
        gap: var(--space-1);
        flex-wrap: wrap;
        margin-bottom: var(--space-2);
      }
      .preset button {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font-family-mono);
      }
      .preset button:hover {
        border-color: var(--color-accent-primary);
        color: var(--color-accent-light);
      }
      .section-h {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        margin: var(--space-4) 0 var(--space-2);
        font-family: var(--font-family-mono);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-h::before {
        content: "";
        width: 3px;
        height: 12px;
        background: var(--color-accent-primary);
        border-radius: 2px;
      }
      .ascii-tbl {
        font-family: var(--font-family-mono);
        font-size: 10px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 1px;
      }
      .ascii-tbl span {
        background: var(--color-bg-elevated);
        padding: 2px;
        text-align: center;
        color: var(--color-text-secondary);
      }
      .pin-row {
        display: flex;
        justify-content: space-between;
        font-size: var(--font-size-xs);
        padding: 2px 0;
        font-family: var(--font-family-mono);
      }
      .pin-row .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-text-muted);
      }
      .pin-row.on .led {
        background: var(--state-success);
        box-shadow: 0 0 5px var(--state-success);
      }
      @media (max-width: 900px) {
        .panel-left,
        .panel-right {
          width: 200px;
        }
      }
      @media (max-width: 720px) {
        .layout {
          flex-direction: column;
          overflow-y: auto;
        }
        .panel-left,
        .panel-right {
          width: 100%;
          border-right: none;
          border-left: none;
          border-bottom: 1px solid var(--color-border);
        }
        .panel-mid {
          min-height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <i data-lucide="terminal" style="color: var(--color-accent-light)"></i>
      <span class="title">串口 (UART)</span>
      <div class="sep"></div>
      <span
        style="font-size: var(--font-size-xs); color: var(--color-text-muted)"
        >PORT</span
      >
      <span id="curPort" style="color: var(--color-tech-cyan)">—</span>
      <div class="sep"></div>
      <span
        id="connState"
        style="color: var(--color-text-muted); font-size: var(--font-size-xs)"
        ><span
          class="etp-led"
          style="background: var(--color-text-muted)"
        ></span>
        Disconnected</span
      >
      <div style="flex: 1"></div>
      <span
        style="font-size: var(--font-size-xs); color: var(--color-text-muted)"
        >UPTIME
        <span id="uptime" style="color: var(--color-tech-green)"
          >00:00:00</span
        ></span
      >
    </header>

    <div class="layout">
      <!-- LEFT: connection settings -->
      <aside class="panel panel-left">
        <div class="section-h">连接设置</div>
        <div class="field">
          <label>端口 Port</label
          ><select class="etp-select" id="port"></select>
        </div>
        <div class="field">
          <label>波特率 Baud</label>
          <div class="row">
            <input class="etp-input" id="baud" value="115200" list="baudList" />
            <datalist id="baudList">
              <option>9600</option>
              <option>19200</option>
              <option>38400</option>
              <option>57600</option>
              <option>115200</option>
              <option>230400</option>
              <option>460800</option>
              <option>921600</option>
              <option>74880</option>
            </datalist>
          </div>
        </div>
        <div class="field">
          <label>数据位 Data Bits</label
          ><select class="etp-select" id="dataBits">
            <option>8</option>
            <option>7</option>
            <option>6</option>
            <option>5</option>
          </select>
        </div>
        <div class="field">
          <label>停止位 Stop Bits</label
          ><select class="etp-select" id="stopBits">
            <option>1</option>
            <option>2</option>
          </select>
        </div>
        <div class="field">
          <label>校验位 Parity</label
          ><select class="etp-select" id="parity">
            <option value="none">None</option>
            <option value="even">Even</option>
            <option value="odd">Odd</option>
            <option value="mark">Mark</option>
            <option value="space">Space</option>
          </select>
        </div>
        <div class="field">
          <label>流控 Flow Ctrl</label
          ><select class="etp-select" id="flowCtrl">
            <option value="none">None</option>
            <option value="hardware">Hardware</option>
            <option value="xonxoff">XON/XOFF</option>
          </select>
        </div>
        <div class="field" style="display: flex; gap: var(--space-3)">
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="dtr" /> DTR</label
          >
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="rts" /> RTS</label
          >
        </div>
        <button class="btn-primary" id="btnConn" onclick="togglePort()">
          打开串口
        </button>

        <div class="section-h">Pin 状态</div>
        <div class="pin-row" id="pinTXD">
          <span>TXD</span><span class="led"></span>
        </div>
        <div class="pin-row" id="pinRXD">
          <span>RXD</span><span class="led"></span>
        </div>
        <div class="pin-row on"><span>DTR</span><span class="led"></span></div>
        <div class="pin-row on"><span>RTS</span><span class="led"></span></div>
      </aside>

      <!-- MIDDLE: terminal -->
      <section class="panel-mid">
        <div
          style="
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            border-bottom: 1px solid var(--color-border-subtle);
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
          "
        >
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="autoScroll" checked /> 自动滚动</label
          >
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="showTs" /> 时间戳</label
          >
          <label style="display: flex; align-items: center; gap: 4px"
            ><input type="checkbox" id="showHex" /> Hex视图</label
          >
          <div style="flex: 1"></div>
          <button class="etp-btn-tool" onclick="clearTerm()">清空</button>
          <button class="etp-btn-tool" onclick="exportTerm()">导出</button>
        </div>
        <div class="terminal" id="term"></div>
        <div class="send-bar">
          <input
            class="etp-input"
            id="sendInput"
            placeholder="输入要发送的数据 (Hex 用空格分隔, 切换 Hex 模式发送)"
            onkeydown="if (event.key === 'Enter') sendData();"
          />
          <select class="etp-select" style="width: 90px" id="sendMode">
            <option value="text">ASCII</option>
            <option value="hex">HEX</option>
            <option value="hex+nl">HEX+NL</option>
          </select>
          <button class="btn-primary" style="width: auto" onclick="sendData()">
            发送
          </button>
        </div>
      </section>

      <!-- RIGHT: quick send / stats / ascii -->
      <aside class="panel panel-right">
        <div class="section-h">快速发送</div>
        <div class="preset">
          <button onclick="quickSend('AT\\r\\n')">AT</button>
          <button onclick="quickSend('AT+VERSION\\r\\n')">VERSION</button>
          <button onclick="quickSend('AT+RESET\\r\\n')">RESET</button>
          <button onclick="quickSend('hello')">hello</button>
          <button onclick="quickSend('FF 00 AA 55')">FF00AA55</button>
        </div>
        <div class="row" style="margin-bottom: var(--space-3)">
          <input class="etp-input" id="presetInput" placeholder="自定义预设" />
          <button
            class="etp-btn-tool"
            style="width: auto"
            onclick="addPreset()"
          >
            +
          </button>
        </div>

        <div class="section-h">统计</div>
        <div class="stat-grid">
          <div class="stat-cell">
            <div class="l">RX bytes</div>
            <div class="v" id="rxB" style="color: var(--color-tech-green)">
              0
            </div>
          </div>
          <div class="stat-cell">
            <div class="l">TX bytes</div>
            <div class="v" id="txB" style="color: var(--color-tech-cyan)">
              0
            </div>
          </div>
          <div class="stat-cell">
            <div class="l">RX frames</div>
            <div class="v" id="rxF">0</div>
          </div>
          <div class="stat-cell">
            <div class="l">TX frames</div>
            <div class="v" id="txF">0</div>
          </div>
        </div>

        <div class="section-h">数据日志</div>
        <div class="row" style="margin-bottom: var(--space-2)">
          <button class="etp-btn-tool" id="logBtn" onclick="toggleLog()">
            开始记录
          </button>
          <button class="etp-btn-tool" onclick="exportLog()">导出</button>
        </div>

        <div class="section-h">ASCII 参考</div>
        <div class="ascii-tbl" id="asciiTbl"></div>
      </aside>
    </div>

    <script src="/assets/app.js"></script>
    <script>
      ETP.initWindow();
      let es = null,
        logBuf = [],
        logging = false,
        connectedAt = null;

      async function loadPorts() {
        try {
          const r = await ETP.serial.ports();
          const sel = document.getElementById("port");
          (r.ports || []).forEach((p) => {
            const o = document.createElement("option");
            o.value = p;
            o.textContent = p;
            sel.appendChild(o);
          });
          if (!sel.options.length) {
            const o = document.createElement("option");
            o.value = "";
            o.textContent = "(无可用端口)";
            sel.appendChild(o);
          }
        } catch (e) {
          const o = document.createElement("option");
          o.value = "";
          o.textContent = "(枚举失败)";
          document.getElementById("port").appendChild(o);
        }
      }

      async function togglePort() {
        const btn = document.getElementById("btnConn");
        if (btn.textContent.startsWith("打开")) {
          const cfg = {
            port: document.getElementById("port").value,
            baudRate: parseInt(document.getElementById("baud").value) || 115200,
            dataBits: parseInt(document.getElementById("dataBits").value),
            stopBits: parseInt(document.getElementById("stopBits").value),
            parity: document.getElementById("parity").value,
            flowCtrl: document.getElementById("flowCtrl").value,
          };
          try {
            await ETP.serial.open(cfg);
            connectedAt = Date.now();
            onConnected(cfg.port);
          } catch (e) {
            termLine("err", "[ERR] " + e.message);
          }
        } else {
          await ETP.serial.close();
          onDisconnected();
        }
      }
      function onConnected(port) {
        const btn = document.getElementById("btnConn");
        btn.textContent = "关闭串口";
        btn.classList.add("stop");
        document.getElementById("curPort").textContent = port || "COMx";
        document.getElementById("connState").innerHTML =
          '<span class="etp-led etp-led-green"></span> Connected';
        es = ETP.windows.stream(["serial.rx", "serial.tx"], onBus);
        termLine("ts", "[串口已打开]");
      }
      function onDisconnected() {
        const btn = document.getElementById("btnConn");
        btn.textContent = "打开串口";
        btn.classList.remove("stop");
        document.getElementById("connState").innerHTML =
          '<span class="etp-led" style="background:var(--color-text-muted)"></span> Disconnected';
        if (es) {
          es.close();
          es = null;
        }
        termLine("err", "[串口已关闭]");
      }
      function onBus(msg) {
        const p = msg.payload || {};
        const dir = msg.topic === "serial.tx" ? "tx" : "rx";
        const bytes = p.data
          ? Uint8Array.from(p.data)
          : ETP.util.fromHex(p.hex || "");
        const showHex = document.getElementById("showHex").checked;
        const txt = showHex
          ? ETP.util.hex(bytes)
          : new TextDecoder().decode(bytes);
        termLine(dir, txt);
        if (logging) {
          logBuf.push({ t: ETP.util.ts(), dir, hex: ETP.util.hex(bytes) });
        }
        document.getElementById("pinTXD")?.classList.toggle("on", dir === "tx");
        document.getElementById("pinRXD")?.classList.toggle("on", dir === "rx");
        setTimeout(() => {
          document.getElementById("pinTXD")?.classList.remove("on");
          document.getElementById("pinRXD")?.classList.remove("on");
        }, 120);
      }
      function termLine(cls, text) {
        const t = document.getElementById("term");
        const div = document.createElement("div");
        if (cls === "ts" || document.getElementById("showTs")?.checked) {
          const s = document.createElement("span");
          s.className = "ts";
          s.textContent = ETP.util.ts() + " ";
          div.appendChild(s);
        }
        const sp = document.createElement("span");
        sp.className = cls;
        sp.textContent = text;
        div.appendChild(sp);
        t.appendChild(div);
        if (document.getElementById("autoScroll").checked)
          t.scrollTop = t.scrollHeight;
        while (t.childNodes.length > 2000) t.removeChild(t.firstChild);
      }
      async function sendData() {
        const inp = document.getElementById("sendInput");
        const mode = document.getElementById("sendMode").value;
        let v = inp.value;
        try {
          if (mode === "hex" || mode === "hex+nl") {
            await ETP.serial.write({
              hex: v + (mode === "hex+nl" ? " 0A" : ""),
            });
          } else {
            await ETP.serial.write({ text: v });
          }
          inp.value = "";
        } catch (e) {
          termLine("err", "[TX ERR] " + e.message);
        }
      }
      function quickSend(s) {
        document.getElementById("sendInput").value = s;
        sendData();
      }
      function addPreset() {
        const v = document.getElementById("presetInput").value;
        if (!v) return;
        const b = document.createElement("button");
        b.textContent = v;
        b.onclick = () => quickSend(v);
        document.querySelector(".preset").appendChild(b);
        document.getElementById("presetInput").value = "";
      }
      function clearTerm() {
        document.getElementById("term").innerHTML = "";
      }
      function exportTerm() {
        const t = document.getElementById("term").innerText;
        download("serial-log.txt", t);
      }
      function toggleLog() {
        logging = !logging;
        document.getElementById("logBtn").textContent = logging
          ? "停止记录"
          : "开始记录";
        if (!logging) exportLog();
      }
      function exportLog() {
        if (!logBuf.length) return;
        const csv =
          "time,dir,hex\n" +
          logBuf
            .map((r) => `${r.t},${r.dir},${r.hex.replace(/ /g, "")}`)
            .join("\n");
        download("serial-capture.csv", csv);
        logBuf = [];
      }
      function download(name, content) {
        const b = new Blob([content]);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = name;
        a.click();
      }
      function buildAscii() {
        const t = document.getElementById("asciiTbl");
        for (let i = 32; i < 128; i++) {
          const s = document.createElement("span");
          s.textContent = i < 127 ? String.fromCharCode(i) : "DEL";
          s.title = i;
          t.appendChild(s);
        }
      }
      async function pollStats() {
        try {
          const s = await ETP.serial.stats();
          document.getElementById("rxB").textContent = s.rxBytes;
          document.getElementById("txB").textContent = s.txBytes;
          document.getElementById("rxF").textContent = s.rxFrames;
          document.getElementById("txF").textContent = s.txFrames;
        } catch {}
      }
      setInterval(pollStats, 500);
      setInterval(() => {
        if (connectedAt) {
          const s = Math.floor((Date.now() - connectedAt) / 1000);
          document.getElementById("uptime").textContent =
            `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        }
      }, 1000);
      loadPorts();
      buildAscii();
      lucide.createIcons();
    </script>
  </body>
</html>
