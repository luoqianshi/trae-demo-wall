<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>低功耗分析仪</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

:root {
  /* === Primary Palette — Dark Sci-Fi with Purple === */
  --color-bg-primary: #0d0f1a;
  --color-bg-secondary: #131525;
  --color-bg-surface: #1a1d32;
  --color-bg-elevated: #222640;
  --color-bg-hover: #2a2f4a;

  /* === Purple Accent System === */
  --color-accent-primary: #8b5cf6;
  --color-accent-light: #a78bfa;
  --color-accent-lighter: #c4b5fd;
  --color-accent-dark: #7c3aed;
  --color-accent-darker: #6d28d9;
  --color-accent-glow: rgba(139, 92, 246, 0.25);

  /* === Cyan/Tech Secondary === */
  --color-tech-cyan: #22d3ee;
  --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
  --color-tech-green: #34d399;
  --color-tech-green-dim: rgba(52, 211, 153, 0.15);

  /* === Semantic Status Colors === */
  --state-success: #34d399;
  --state-warning: #fbbf24;
  --state-error: #f87171;
  --state-info: #60a5fa;

  /* === Text System === */
  --color-text-primary: #f1f5f9;
  --color-text-secondary: #94a3b8;
  --color-text-muted: #64748b;
  --color-text-inverse: #0f172a;

  /* === Border System === */
  --color-border: #2d3148;
  --color-border-active: #8b5cf6;
  --color-border-subtle: #1e2236;

  /* === Typography === */
  --font-family-display: 'Inter', system-ui, -apple-system, sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --font-family-body: 'Inter', system-ui, -apple-system, sans-serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.8125rem;
  --font-size-base: 0.875rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;

  /* === Spacing Scale === */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;

  /* === Radius === */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
  --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
}

html.dark { --color-bg-primary:#0d0f1a; --color-bg-secondary:#131525; --color-bg-surface:#1a1d32; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family-body); background: var(--color-bg-primary); color: var(--color-text-primary); }

/* === Utility Classes === */
.etp-font-display { font-family: var(--font-family-display); }
.etp-font-mono { font-family: var(--font-family-mono); }
.etp-font-body { font-family: var(--font-family-body); }
.etp-text-accent { color: var(--color-accent-primary); }
.etp-text-cyan { color: var(--color-tech-cyan); }
.etp-text-green { color: var(--color-tech-green); }
.etp-text-muted { color: var(--color-text-secondary); }
.etp-bg-surface { background-color: var(--color-bg-surface); }
.etp-bg-elevated { background-color: var(--color-bg-elevated); }
.etp-border-glow { border: 1px solid var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-card-hover { transition: all 0.2s ease; }
.etp-card-hover:hover { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
.etp-grid-bg {
  background-image:
    linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
.etp-scanline::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 92, 246, 0.015) 2px, rgba(139, 92, 246, 0.015) 4px);
  pointer-events: none;
}

/* LED indicator */
.etp-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.etp-led-green { background: var(--state-success); box-shadow: 0 0 6px var(--state-success); }
.etp-led-red { background: var(--state-error); box-shadow: 0 0 6px var(--state-error); }
.etp-led-yellow { background: var(--state-warning); box-shadow: 0 0 6px var(--state-warning); }
@keyframes etp-led-breathe { 0%,100%{opacity:1} 50%{opacity:.5} }

.etp-btn-tool {
  background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); cursor: pointer; transition: all 0.15s ease;
}
.etp-btn-tool:hover { background: var(--color-bg-hover); border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }

.etp-statusbar { background: var(--color-bg-secondary); border-top: 1px solid var(--color-border); padding: var(--space-1) var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* shared form controls */
.etp-input, .etp-select {
  width: 100%; background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-family: var(--font-family-mono); outline: none; transition: border-color .15s;
}
.etp-input:focus, .etp-select:focus { border-color: var(--color-accent-primary); box-shadow: var(--shadow-glow); }
.etp-label { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); font-family: var(--font-family-mono); }

/* toggle switch */
.etp-toggle { position: relative; display: inline-block; width: 34px; height: 18px; }
.etp-toggle input { opacity: 0; width: 0; height: 0; }
.etp-toggle-track { position: absolute; cursor: pointer; inset: 0; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-full); transition: .2s; }
.etp-toggle-track::before { content: ''; position: absolute; height: 12px; width: 12px; left: 2px; top: 2px; background: var(--color-text-muted); border-radius: 50%; transition: .2s; }
.etp-toggle input:checked + .etp-toggle-track { background: rgba(139,92,246,.25); border-color: var(--color-accent-primary); }
.etp-toggle input:checked + .etp-toggle-track::before { transform: translateX(16px); background: var(--color-accent-primary); box-shadow: 0 0 6px var(--color-accent-primary); }

/* scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--color-bg-primary); }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-accent-primary); }

    html, body { height: 100%; }
    body {
      overflow: hidden; height: 100vh; margin: 0;
      font-family: var(--font-family-body);
      background: var(--color-bg-primary); color: var(--color-text-primary);
    }
    .pa-app { display: flex; flex-direction: column; height: 100vh; background: var(--color-bg-primary); }
    .font-mono { font-family: var(--font-family-mono); }

    /* === Top Toolbar === */
    .pa-toolbar {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      background: var(--color-bg-secondary); border-bottom: 1px solid var(--color-border);
      flex-wrap: nowrap; overflow-x: auto; min-height: 44px;
    }
    .pa-toolbar .divider { width: 1px; height: 28px; background: var(--color-border); margin: 0 4px; flex-shrink: 0; }
    .toolbar-label { font-size: 10px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }

    .btn-run-stop {
      display: flex; align-items: center; gap: 6px; padding: 5px 14px;
      border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-weight: 600;
      cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; white-space: nowrap;
    }
    .btn-run-stop.running { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }
    .btn-run-stop.running:hover { background: rgba(52,211,153,0.25); box-shadow: 0 0 12px rgba(52,211,153,0.3); }
    .btn-run-stop.stopped { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); }
    .btn-run-stop .led-dot { width: 8px; height: 8px; border-radius: 50%; }
    .btn-run-stop.running .led-dot { background: #34d399; box-shadow: 0 0 6px #34d399; }
    .btn-run-stop.stopped .led-dot { background: #f87171; box-shadow: 0 0 6px #f87171; }

    .pa-select {
      background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
      padding: 4px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs);
      font-family: var(--font-family-mono); cursor: pointer; outline: none; appearance: auto;
    }
    .pa-select:focus { border-color: var(--color-accent-primary); box-shadow: 0 0 8px rgba(139,92,246,0.2); }
    .pa-select option { background: var(--color-bg-surface); }

    .param-input {
      background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);
      padding: 4px 6px; border-radius: var(--radius-sm); font-size: var(--font-size-xs);
      font-family: var(--font-family-mono); cursor: pointer; outline: none; transition: all 0.15s ease; width: 70px;
    }
    .param-input:focus { border-color: var(--color-accent-primary); box-shadow: 0 0 8px rgba(139,92,246,0.2); }
    .param-unit { font-size: 10px; color: var(--color-text-muted); font-family: var(--font-family-mono); }

    .pa-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px;
      border-radius: var(--radius-sm); border: 1px solid var(--color-border);
      background: var(--color-bg-elevated); color: var(--color-text-secondary);
      font-size: var(--font-size-xs); font-family: var(--font-family-mono); cursor: pointer;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .pa-btn:hover { background: var(--color-bg-hover); border-color: var(--color-accent-primary); color: var(--color-text-primary); }
    .pa-btn.alarm-on { border-color: rgba(248,113,113,0.5); color: #f87171; background: rgba(248,113,113,0.1); }

    /* === Main area === */
    .pa-main { display: flex; flex: 1; overflow: hidden; }
    .pa-display-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .waveform-display {
      flex: 1; position: relative; background: #060810;
      border: 1px solid var(--color-border-subtle); overflow: hidden; min-height: 300px;
    }
    .waveform-display svg { width: 100%; height: 100%; }
    .grid-line-major { stroke: rgba(139,92,246,0.12); stroke-width: 1; }
    .grid-line-minor { stroke: rgba(139,92,246,0.05); stroke-width: 0.5; }
    .grid-border { stroke: rgba(139,92,246,0.25); stroke-width: 1.5; fill: none; }
    .axis-label { font-family: var(--font-family-mono); font-size: 9px; fill: rgba(148,163,184,0.6); }
    .time-label { font-family: var(--font-family-mono); font-size: 9px; fill: rgba(148,163,184,0.5); }
    .current-trace { fill: none; stroke: #22d3ee; stroke-width: 1.6; filter: url(#glow-cyan); stroke-linejoin: round; }
    .threshold-line { stroke: rgba(248,113,113,0.8); stroke-width: 1; stroke-dasharray: 5 3; }
    .threshold-label { font-family: var(--font-family-mono); font-size: 9px; fill: #f87171; }
    .mode-label { font-family: var(--font-family-mono); font-size: 9px; font-weight: 600; }

    .legend {
      position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap;
      font-family: var(--font-family-mono); font-size: 10px;
    }
    .legend .item { display: flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 3px; background: rgba(13,15,26,0.7); border: 1px solid var(--color-border-subtle); }
    .legend .sw { width: 9px; height: 9px; border-radius: 2px; }
    .legend .sleep { background: rgba(96,165,250,0.5); }
    .legend .standby { background: rgba(251,191,36,0.6); }
    .legend .run { background: rgba(52,211,153,0.6); }
    .range-badge {
      position: absolute; top: 8px; right: 8px; padding: 3px 10px; border-radius: 3px;
      background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.3);
      color: #67e8f9; font-family: var(--font-family-mono); font-size: 10px;
    }
    .alarm-flash {
      position: absolute; inset: 0; pointer-events: none; background: rgba(248,113,113,0.07);
      opacity: 0; transition: opacity 0.2s;
    }
    .alarm-flash.on { opacity: 1; }

    /* === Right Panel === */
    .pa-right {
      width: 290px; background: var(--color-bg-secondary); border-left: 1px solid var(--color-border);
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    }
    .rp-section { padding: 10px; border-bottom: 1px solid var(--color-border-subtle); }
    .rp-section-title {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--color-accent-light); margin-bottom: 8px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-cell {
      background: var(--color-bg-elevated); border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm); padding: 6px 8px;
    }
    .stat-cell .l { font-size: 9px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-family: var(--font-family-mono); }
    .stat-cell .v { font-family: var(--font-family-mono); font-size: 13px; font-weight: 600; margin-top: 2px; }
    .stat-cell .vu { font-size: 9px; color: var(--color-text-muted); margin-left: 2px; }
    .v-cyan { color: #22d3ee; } .v-green { color: #34d399; } .v-amber { color: #fbbf24; } .v-red { color: #f87171; } .v-purple { color: #a78bfa; }

    .mode-bar-row { margin-bottom: 7px; }
    .mode-bar-row .hdr { display: flex; justify-content: space-between; font-family: var(--font-family-mono); font-size: 10px; margin-bottom: 3px; }
    .mode-bar-track { height: 7px; background: var(--color-bg-elevated); border-radius: 4px; overflow: hidden; }
    .mode-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

    .alarm-log {
      max-height: 120px; overflow-y: auto; background: #060810; border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm); padding: 4px 6px; font-family: var(--font-family-mono); font-size: 10px;
    }
    .alarm-log .row { color: var(--state-error); padding: 2px 0; border-bottom: 1px solid var(--color-border-subtle); }
    .alarm-log .row:last-child { border-bottom: none; }
    .alarm-log .empty { color: var(--color-text-muted); text-align: center; padding: 8px 0; }

    /* === Status Bar === */
    .pa-statusbar {
      display: flex; align-items: center; justify-content: space-between; padding: 3px 12px;
      background: var(--color-bg-secondary); border-top: 1px solid var(--color-border);
      font-family: var(--font-family-mono); font-size: 10px; color: var(--color-text-muted); flex-shrink: 0;
    }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--state-success); box-shadow: 0 0 4px var(--state-success); }
    .status-dot.alarm { background: var(--state-error); box-shadow: 0 0 4px var(--state-error); }
    .status-dot.stopped { background: var(--color-text-muted); box-shadow: none; }

    /* === Responsive === */
    @media (max-width: 1100px) { .pa-right { width: 250px; } }
    @media (max-width: 900px) {
      body { overflow: auto; height: auto; }
      .pa-app { height: auto; min-height: 100vh; }
      .pa-main { flex-direction: column; }
      .pa-right { width: 100%; border-left: none; border-top: 1px solid var(--color-border); }
      .waveform-display { min-height: 280px; }
      .pa-toolbar { flex-wrap: wrap; }
    }
    @media (max-width: 560px) {
      .pa-statusbar { flex-direction: column; align-items: flex-start; gap: 2px; }
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="pa-app">

  <!-- ======== TOP TOOLBAR ======== -->
  <div class="pa-toolbar">
    <button class="btn-run-stop running" id="btnRunStop" onclick="toggleRunStop()">
      <span class="led-dot"></span>
      <span id="runStopLabel">RUN</span>
    </button>

    <div class="divider"></div>

    <span class="toolbar-label">采样率</span>
    <select class="pa-select" id="sampleRate">
      <option value="1000">1 kSPS</option>
      <option value="10000">10 kSPS</option>
      <option value="100000" selected>100 kSPS</option>
      <option value="1000000">1 MSPS</option>
    </select>

    <span class="toolbar-label">窗口</span>
    <select class="pa-select" id="windowTime">
      <option value="2">2 s</option>
      <option value="5" selected>5 s</option>
      <option value="10">10 s</option>
      <option value="30">30 s</option>
    </select>

    <div class="divider"></div>

    <span class="toolbar-label">量程</span>
    <select class="pa-select" id="rangeMode">
      <option value="auto" selected>Auto</option>
      <option value="ua">μA</option>
      <option value="ma">mA</option>
      <option value="a">A</option>
    </select>

    <span class="toolbar-label">电压</span>
    <input class="param-input" id="voltage" type="number" value="3.3" step="0.1" style="width:56px">
    <span class="param-unit">V</span>

    <div class="divider"></div>

    <span class="toolbar-label">阈值告警</span>
    <input class="param-input" id="threshold" type="number" value="500" min="0" step="10" style="width:72px">
    <span class="param-unit">μA</span>
    <button class="pa-btn alarm-on" id="alarmBtn" onclick="toggleAlarm()">告警: ON</button>

    <div class="divider"></div>

    <button class="pa-btn" onclick="exportCsv()"><i data-lucide="download" style="width:13px;height:13px;"></i> 导出CSV</button>
    <button class="pa-btn" onclick="clearData()"><i data-lucide="trash-2" style="width:13px;height:13px;"></i> 清空</button>
  </div>

  <!-- ======== MAIN AREA ======== -->
  <div class="pa-main">
    <div class="pa-display-wrap">
      <div class="waveform-display" id="waveformDisplay">
        <div class="alarm-flash" id="alarmFlash"></div>
        <svg id="paSvg" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
              <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="gridGroup"></g>
          <g id="modeGroup"></g>
          <g id="axisGroup"></g>
          <line class="threshold-line" id="thresholdLine" x1="0" y1="0" x2="100%" y2="0"/>
          <text class="threshold-label" id="thresholdLabel" x="6" y="0">阈值</text>
          <path id="currentTrace" class="current-trace" d=""/>
        </svg>
        <div class="legend">
          <span class="item"><span class="sw sleep"></span> Sleep</span>
          <span class="item"><span class="sw standby"></span> Standby</span>
          <span class="item"><span class="sw run"></span> Run</span>
        </div>
        <div class="range-badge" id="rangeBadge">量程: Auto · μA</div>
      </div>
    </div>

    <!-- ======== RIGHT PANEL ======== -->
    <div class="pa-right">

      <!-- Power statistics -->
      <div class="rp-section">
        <div class="rp-section-title"><i data-lucide="zap" style="width:12px;height:12px;"></i> 功耗统计 (当前窗口)</div>
        <div class="stat-grid">
          <div class="stat-cell"><div class="l">平均电流</div><div class="v v-cyan" id="avgI">0.00<span class="vu">μA</span></div></div>
          <div class="stat-cell"><div class="l">峰值电流</div><div class="v v-cyan" id="peakI">0.00<span class="vu">μA</span></div></div>
          <div class="stat-cell"><div class="l">平均功耗</div><div class="v v-green" id="avgP">0.00<span class="vu">μW</span></div></div>
          <div class="stat-cell"><div class="l">峰值功耗</div><div class="v v-green" id="peakP">0.00<span class="vu">μW</span></div></div>
          <div class="stat-cell"><div class="l">积分功耗</div><div class="v v-amber" id="energy">0.00<span class="vu">μW·s</span></div></div>
          <div class="stat-cell"><div class="l">电荷量</div><div class="v v-amber" id="charge">0.00<span class="vu">μA·s</span></div></div>
        </div>
        <div style="margin-top:8px; font-size:10px; color:var(--color-text-muted); font-family:var(--font-family-mono);">
          累计: <span id="totalEnergy" style="color:#fbbf24">0.00 μW·s</span> · <span id="totalCharge" style="color:#fbbf24">0.00 μA·s</span>
        </div>
      </div>

      <!-- Mode distribution -->
      <div class="rp-section">
        <div class="rp-section-title"><i data-lucide="layers" style="width:12px;height:12px;"></i> 工作模式分布</div>
        <div class="mode-bar-row">
          <div class="hdr"><span style="color:#60a5fa">Sleep</span><span id="sleepPct" class="font-mono" style="color:var(--color-text-secondary)">0.0%</span></div>
          <div class="mode-bar-track"><div class="mode-bar-fill" id="sleepBar" style="width:0%; background:#60a5fa;"></div></div>
        </div>
        <div class="mode-bar-row">
          <div class="hdr"><span style="color:#fbbf24">Standby</span><span id="standbyPct" class="font-mono" style="color:var(--color-text-secondary)">0.0%</span></div>
          <div class="mode-bar-track"><div class="mode-bar-fill" id="standbyBar" style="width:0%; background:#fbbf24;"></div></div>
        </div>
        <div class="mode-bar-row">
          <div class="hdr"><span style="color:#34d399">Run</span><span id="runPct" class="font-mono" style="color:var(--color-text-secondary)">0.0%</span></div>
          <div class="mode-bar-track"><div class="mode-bar-fill" id="runBar" style="width:0%; background:#34d399;"></div></div>
        </div>
      </div>

      <!-- Threshold alarm -->
      <div class="rp-section">
        <div class="rp-section-title"><i data-lucide="bell" style="width:12px;height:12px;"></i> 告警日志</div>
        <div class="alarm-log" id="alarmLog"><div class="empty">暂无告警</div></div>
      </div>

    </div>
  </div>

  <!-- ======== STATUS BAR ======== -->
  <div class="pa-statusbar">
    <div class="status-item">
      <span class="status-dot" id="runDot"></span>
      <span id="runStatus">采集中</span>
      <span style="margin-left:8px">采样率: <span id="srStatus" style="color:var(--color-tech-cyan)">100 kSPS</span></span>
      <span style="margin-left:8px">V: <span id="vStatus" style="color:var(--color-tech-cyan)">3.3 V</span></span>
    </div>
    <div class="status-item">
      <span class="status-dot alarm" id="alarmDot" style="display:none"></span>
      <span id="alarmStatus" style="display:none;color:var(--state-error)">告警触发</span>
      <span style="margin-left:8px" id="statusTime">00:00:00</span>
      <span style="margin-left:8px">Power Analyzer v1.0.0</span>
    </div>
  </div>

</div>

<script src="/assets/app.js"></script>
<script>
// === State ===
const N = 600; // display points
const state = {
  running: true,
  alarmEnabled: true,
  voltage: 3.3,
  threshold: 500, // μA
  windowTime: 5,  // seconds
  sampleRate: 100000,
  rangeMode: 'auto',
  buffer: [],     // {t, i}  i in μA
  simTime: 0,
  totalEnergy: 0, // μW·s
  totalCharge: 0, // μA·s
  alarmActive: false,
  alarmLog: [],
  // stats for current window
  winAvgI: 0, winPeakI: 0, winAvgP: 0, winPeakP: 0, winEnergy: 0, winCharge: 0,
  modeCounts: { sleep: 0, standby: 0, run: 0 }
};

// Mode thresholds (μA)
const MODE_TH = { sleep: 50, standby: 2000 }; // <50 sleep, 50..2000 standby, >=2000 run
function classifyMode(i) {
  if (i < MODE_TH.sleep) return 'sleep';
  if (i < MODE_TH.standby) return 'standby';
  return 'run';
}

// === DOM ===
const svg = document.getElementById('paSvg');
const gridGroup = document.getElementById('gridGroup');
const modeGroup = document.getElementById('modeGroup');
const axisGroup = document.getElementById('axisGroup');
const currentTrace = document.getElementById('currentTrace');
const thresholdLine = document.getElementById('thresholdLine');
const thresholdLabel = document.getElementById('thresholdLabel');
const waveformDisplay = document.getElementById('waveformDisplay');

// === Current model (μA) ===
function simulateCurrent(t) {
  // base sleep
  let i = 5 + (Math.random() - 0.5) * 3;
  // periodic Run burst every 2s, 120ms, ~12mA with ramp
  const cycle = t % 2.0;
  if (cycle < 0.12) {
    const ramp = cycle < 0.02 ? cycle / 0.02 : (cycle > 0.10 ? (0.12 - cycle) / 0.02 : 1);
    i += 12000 * Math.max(0, ramp) + (Math.random() - 0.5) * 800;
  }
  // occasional Standby burst every ~7s, 300ms, ~220 μA
  const sCycle = t % 7.0;
  if (sCycle < 0.30) {
    const ramp = sCycle < 0.03 ? sCycle / 0.03 : (sCycle > 0.27 ? (0.30 - sCycle) / 0.03 : 1);
    i += 220 * Math.max(0, ramp) + (Math.random() - 0.5) * 20;
  }
  // tiny sensor activity noise
  i += Math.sin(t * 13) * 2;
  return Math.max(0, i);
}

// === Grid ===
function drawGrid() {
  const w = waveformDisplay.clientWidth || 800;
  const h = waveformDisplay.clientHeight || 400;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  gridGroup.innerHTML = '';
  const divX = 10, divY = 8;
  const stepX = w / divX, stepY = h / divY;
  const border = document.createElementNS('http://www.w3.org/2000/svg','rect');
  border.setAttribute('x','0'); border.setAttribute('y','0'); border.setAttribute('width',w); border.setAttribute('height',h);
  border.setAttribute('class','grid-border'); gridGroup.appendChild(border);
  for (let i = 1; i < divX; i++) {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', i*stepX); l.setAttribute('y1','0'); l.setAttribute('x2', i*stepX); l.setAttribute('y2', h);
    l.setAttribute('class','grid-line-major'); gridGroup.appendChild(l);
  }
  for (let i = 1; i < divY; i++) {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1','0'); l.setAttribute('y1', i*stepY); l.setAttribute('x2', w); l.setAttribute('y2', i*stepY);
    l.setAttribute('class','grid-line-major'); gridGroup.appendChild(l);
  }
}

// === Auto range ===
function computeRange(maxI) {
  if (state.rangeMode !== 'auto') {
    if (state.rangeMode === 'ua') return { unit: 'μA', scale: 1, max: Math.max(100, maxI * 1.15) };
    if (state.rangeMode === 'ma') return { unit: 'mA', scale: 0.001, max: Math.max(0.1, maxI * 0.001 * 1.15) };
    return { unit: 'A', scale: 0.000001, max: Math.max(0.001, maxI * 0.000001 * 1.15) };
  }
  if (maxI < 1000) return { unit: 'μA', scale: 1, max: Math.max(100, maxI * 1.15) };
  if (maxI < 1e6) return { unit: 'mA', scale: 0.001, max: Math.max(0.1, maxI * 0.001 * 1.15) };
  return { unit: 'A', scale: 0.000001, max: Math.max(0.001, maxI * 0.000001 * 1.15) };
}

// === Render ===
function render() {
  const w = waveformDisplay.clientWidth || 800;
  const h = waveformDisplay.clientHeight || 400;
  const buf = state.buffer;
  if (!buf.length) return;

  // stats over window
  let sumI = 0, peakI = 0;
  state.modeCounts = { sleep: 0, standby: 0, run: 0 };
  for (const s of buf) {
    sumI += s.i;
    if (s.i > peakI) peakI = s.i;
    state.modeCounts[classifyMode(s.i)]++;
  }
  const avgI = sumI / buf.length;
  const dt = state.windowTime / N; // seconds per sample
  state.winAvgI = avgI;
  state.winPeakI = peakI;
  state.winAvgP = state.voltage * avgI;          // μW
  state.winPeakP = state.voltage * peakI;        // μW
  state.winEnergy = state.voltage * sumI * dt;   // μW·s
  state.winCharge = sumI * dt;                   // μA·s

  // range
  const rng = computeRange(peakI);
  const yMax = rng.max;
  const yScale = (h - 8) / yMax; // px per unit (in chosen unit)
  const toY = (i_uA) => h - 4 - (i_uA * rng.scale) * yScale;

  // === mode region bands ===
  modeGroup.innerHTML = '';
  const xFor = (idx) => (idx / (N - 1)) * w;
  let runStart = -1, runMode = null;
  const modeColor = { sleep: 'rgba(96,165,250,0.07)', standby: 'rgba(251,191,36,0.10)', run: 'rgba(52,211,153,0.12)' };
  for (let i = 0; i <= buf.length; i++) {
    const m = i < buf.length ? classifyMode(buf[i].i) : null;
    if (m !== runMode) {
      if (runMode && runStart >= 0 && i - runStart > 1) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        rect.setAttribute('x', xFor(runStart));
        rect.setAttribute('y', 0);
        rect.setAttribute('width', Math.max(1, xFor(i) - xFor(runStart)));
        rect.setAttribute('height', h);
        rect.setAttribute('fill', modeColor[runMode]);
        modeGroup.appendChild(rect);
        // label for run/standby segments
        if ((runMode === 'run' || runMode === 'standby') && (xFor(i) - xFor(runStart)) > 28) {
          const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
          lbl.setAttribute('class','mode-label');
          lbl.setAttribute('x', xFor(runStart) + 3);
          lbl.setAttribute('y', 14);
          lbl.setAttribute('fill', runMode === 'run' ? '#6ee7b7' : '#fde047');
          lbl.textContent = runMode === 'run' ? 'RUN' : 'STDBY';
          modeGroup.appendChild(lbl);
        }
      }
      runMode = m; runStart = i;
    }
  }

  // === axis labels (current on left) ===
  axisGroup.innerHTML = '';
  const divY = 8;
  for (let i = 0; i <= divY; i++) {
    const val = yMax * (1 - i / divY);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','axis-label'); t.setAttribute('x', 4);
    t.setAttribute('y', (h / divY) * i + (i===0?10:i===divY?-3:3));
    t.textContent = (val < 1 ? val.toFixed(2) : val < 10 ? val.toFixed(1) : Math.round(val)) + ' ' + rng.unit;
    axisGroup.appendChild(t);
  }
  // time axis labels (bottom)
  for (let i = 0; i <= 10; i++) {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','time-label'); t.setAttribute('x', (w/10)*i);
    t.setAttribute('y', h - 4);
    t.setAttribute('text-anchor', i===0?'start':i===10?'end':'middle');
    const secs = -state.windowTime + (state.windowTime * i / 10);
    t.textContent = (secs === 0 ? 'now' : secs.toFixed(1) + 's');
    axisGroup.appendChild(t);
  }

  // === threshold line ===
  const thrY = toY(state.threshold);
  const thrClampedY = Math.max(2, Math.min(h - 2, thrY));
  thresholdLine.setAttribute('y1', thrClampedY);
  thresholdLine.setAttribute('y2', thrClampedY);
  thresholdLabel.setAttribute('y', Math.max(11, thrClampedY - 3));
  thresholdLabel.textContent = `阈值 ${state.threshold} μA`;

  // === current trace ===
  let d = '';
  for (let i = 0; i < buf.length; i++) {
    const x = xFor(i);
    const y = toY(buf[i].i);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }
  currentTrace.setAttribute('d', d);

  // === range badge ===
  document.getElementById('rangeBadge').textContent = `量程: ${state.rangeMode === 'auto' ? 'Auto' : rng.unit} · ${rng.unit} (满量程 ${(yMax * rng.scale).toFixed(yMax*rng.scale < 10 ? 2 : 1)} ${rng.unit})`;

  // === update stat cells ===
  const fmtUnit = (i_uA) => {
    if (i_uA < 1000) return i_uA.toFixed(2) + ' μA';
    if (i_uA < 1e6) return (i_uA / 1000).toFixed(3) + ' mA';
    return (i_uA / 1e6).toFixed(3) + ' A';
  };
  const fmtPower = (p_uW) => {
    if (p_uW < 1000) return p_uW.toFixed(2) + ' μW';
    return (p_uW / 1000).toFixed(3) + ' mW';
  };
  setStat('avgI', fmtUnit(avgI), 'v-cyan');
  setStat('peakI', fmtUnit(peakI), 'v-cyan');
  setStat('avgP', fmtPower(state.winAvgP), 'v-green');
  setStat('peakP', fmtPower(state.winPeakP), 'v-green');
  setStat('energy', state.winEnergy < 1000 ? state.winEnergy.toFixed(2) + ' μW·s' : (state.winEnergy/1000).toFixed(3) + ' mW·s', 'v-amber');
  setStat('charge', state.winCharge < 1000 ? state.winCharge.toFixed(2) + ' μA·s' : (state.winCharge/1000).toFixed(3) + ' mA·s', 'v-amber');

  document.getElementById('totalEnergy').textContent = (state.totalEnergy < 1000 ? state.totalEnergy.toFixed(2) + ' μW·s' : (state.totalEnergy/1000).toFixed(3) + ' mW·s');
  document.getElementById('totalCharge').textContent = (state.totalCharge < 1000 ? state.totalCharge.toFixed(2) + ' μA·s' : (state.totalCharge/1000).toFixed(3) + ' mA·s');

  // mode distribution
  const total = buf.length;
  const sPct = total ? (state.modeCounts.sleep / total * 100) : 0;
  const stPct = total ? (state.modeCounts.standby / total * 100) : 0;
  const rPct = total ? (state.modeCounts.run / total * 100) : 0;
  document.getElementById('sleepPct').textContent = sPct.toFixed(1) + '%';
  document.getElementById('standbyPct').textContent = stPct.toFixed(1) + '%';
  document.getElementById('runPct').textContent = rPct.toFixed(1) + '%';
  document.getElementById('sleepBar').style.width = sPct + '%';
  document.getElementById('standbyBar').style.width = stPct + '%';
  document.getElementById('runBar').style.width = rPct + '%';

  // threshold alarm
  const overTh = peakI > state.threshold;
  if (state.alarmEnabled && overTh && !state.alarmActive) {
    state.alarmActive = true;
    document.getElementById('alarmFlash').classList.add('on');
    document.getElementById('alarmDot').style.display = '';
    document.getElementById('alarmStatus').style.display = '';
    addAlarmLog(state.simTime, peakI);
  } else if (!overTh && state.alarmActive) {
    state.alarmActive = false;
    document.getElementById('alarmFlash').classList.remove('on');
    document.getElementById('alarmDot').style.display = 'none';
    document.getElementById('alarmStatus').style.display = 'none';
  }
}

function setStat(id, text) {
  const el = document.getElementById(id);
  // split into numeric head and unit tail (separated by first space)
  const parts = text.split(' ');
  const unit = parts.length > 1 ? parts.slice(1).join(' ') : '';
  const num = parts[0];
  el.innerHTML = num + '<span class="vu"> ' + unit + '</span>';
}

// === Alarm log ===
function addAlarmLog(t, i) {
  const ts = new Date().toLocaleTimeString('en-GB');
  state.alarmLog.unshift({ t, ts, i });
  if (state.alarmLog.length > 50) state.alarmLog.pop();
  const log = document.getElementById('alarmLog');
  if (!state.alarmLog.length) { log.innerHTML = '<div class="empty">暂无告警</div>'; return; }
  log.innerHTML = state.alarmLog.map(r =>
    `<div class="row">[${r.ts}] 超阈值 · ${r.i < 1000 ? r.i.toFixed(0)+' μA' : (r.i/1000).toFixed(2)+' mA'} @ ${r.t.toFixed(2)}s</div>`
  ).join('');
}

// === Animation loop ===
let lastTs = 0;
function animate(ts) {
  if (!lastTs) lastTs = ts;
  const realDt = Math.min(0.1, (ts - lastTs) / 1000);
  lastTs = ts;

  if (state.running) {
    // advance sim time; produce samples to fill the window at the displayed resolution
    // We advance simTime by realDt (real-time streaming), generating one sample per frame
    // plus interpolation so the buffer of N points spans windowTime seconds.
    const dtPerSample = state.windowTime / N;
    state.simTime += realDt;
    // push current sample(s): generate enough samples to keep up with real time vs display resolution
    const need = Math.max(1, Math.round(realDt / dtPerSample));
    for (let k = 0; k < Math.min(need, 8); k++) {
      const t = state.simTime - (need - 1 - k) * dtPerSample;
      const i = simulateCurrent(t);
      state.buffer.push({ t, i });
      while (state.buffer.length > N) state.buffer.shift();
      // accumulate totals
      state.totalCharge += i * dtPerSample;        // μA·s
      state.totalEnergy += state.voltage * i * dtPerSample; // μW·s
    }
    render();
  }
  requestAnimationFrame(animate);
}

// === Controls ===
function toggleRunStop() {
  state.running = !state.running;
  const btn = document.getElementById('btnRunStop');
  const label = document.getElementById('runStopLabel');
  const dot = document.getElementById('runDot');
  const st = document.getElementById('runStatus');
  if (state.running) {
    btn.className = 'btn-run-stop running'; label.textContent = 'RUN';
    dot.className = 'status-dot'; st.textContent = '采集中';
  } else {
    btn.className = 'btn-run-stop stopped'; label.textContent = 'STOP';
    dot.className = 'status-dot stopped'; st.textContent = '已停止';
  }
}

function toggleAlarm() {
  state.alarmEnabled = !state.alarmEnabled;
  const btn = document.getElementById('alarmBtn');
  btn.textContent = '告警: ' + (state.alarmEnabled ? 'ON' : 'OFF');
  btn.classList.toggle('alarm-on', state.alarmEnabled);
  if (!state.alarmEnabled) {
    state.alarmActive = false;
    document.getElementById('alarmFlash').classList.remove('on');
    document.getElementById('alarmDot').style.display = 'none';
    document.getElementById('alarmStatus').style.display = 'none';
  }
}

function clearData() {
  state.buffer = [];
  state.totalEnergy = 0;
  state.totalCharge = 0;
  state.alarmLog = [];
  state.simTime = 0;
  document.getElementById('alarmLog').innerHTML = '<div class="empty">暂无告警</div>';
  render();
}

function exportCsv() {
  if (!state.buffer.length) { alert('暂无数据可导出'); return; }
  const rows = [['time_s', 'current_uA', 'current_display', 'power_uW', 'mode']];
  for (const s of state.buffer) {
    const m = classifyMode(s.i);
    const disp = s.i < 1000 ? s.i.toFixed(3) + ' uA' : (s.i < 1e6 ? (s.i/1000).toFixed(6) + ' mA' : (s.i/1e6).toFixed(9) + ' A');
    rows.push([s.t.toFixed(6), s.i.toFixed(3), disp, (state.voltage * s.i).toFixed(3), m]);
  }
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'power-capture.csv';
  a.click();
}

// === Wire inputs ===
document.getElementById('sampleRate').addEventListener('change', e => {
  state.sampleRate = parseInt(e.target.value);
  document.getElementById('srStatus').textContent = state.sampleRate >= 1000000 ? (state.sampleRate/1000000) + ' MSPS' : (state.sampleRate/1000) + ' kSPS';
});
document.getElementById('windowTime').addEventListener('change', e => { state.windowTime = parseFloat(e.target.value); });
document.getElementById('rangeMode').addEventListener('change', e => { state.rangeMode = e.target.value; });
document.getElementById('voltage').addEventListener('input', e => {
  state.voltage = parseFloat(e.target.value) || 3.3;
  document.getElementById('vStatus').textContent = state.voltage.toFixed(1) + ' V';
});
document.getElementById('threshold').addEventListener('input', e => { state.threshold = parseFloat(e.target.value) || 0; });

// === Status timer ===
let elapsed = 0;
setInterval(() => {
  elapsed++;
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('statusTime').textContent = `${h}:${m}:${s}`;
}, 1000);

// === Init ===
function init() {
  drawGrid();
  // pre-fill buffer so display isn't empty
  const dt = state.windowTime / N;
  for (let i = 0; i < N; i++) {
    const t = -state.windowTime + i * dt;
    const cur = simulateCurrent(t < 0 ? t + state.windowTime : t);
    state.buffer.push({ t, i: cur });
  }
  state.simTime = 0;
  render();
  requestAnimationFrame(animate);
  if (window.lucide) lucide.createIcons();
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawGrid, 100);
});

window.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();

ETP.initWindow();
lucide.createIcons();
</script>
</body>
</html>
