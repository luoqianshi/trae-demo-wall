<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芯片程序下载 — EmbeddedTool Pro</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/theme.css" />
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      /* EmbeddedTool Pro — shared brand theme.
   Extracted verbatim from the design system (colors_and_type.css) so every
   page renders with identical dark sci-fi purple visuals. Brand prefix: etp. */

      :root {
        /* === Primary Palette — Dark Sci-Fi with Purple === */
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
        --color-bg-elevated: #222640;
        --color-bg-hover: #2a2f4a;

        /* === Purple Accent System === */
        --color-accent-primary: #8b5cf6;
        --color-accent-light: #a78bfa;
        --color-accent-lighter: #c4b5fd;
        --color-accent-dark: #7c3aed;
        --color-accent-darker: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.25);

        /* === Cyan/Tech Secondary === */
        --color-tech-cyan: #22d3ee;
        --color-tech-cyan-dim: rgba(34, 211, 238, 0.15);
        --color-tech-green: #34d399;
        --color-tech-green-dim: rgba(52, 211, 153, 0.15);

        /* === Semantic Status Colors === */
        --state-success: #34d399;
        --state-warning: #fbbf24;
        --state-error: #f87171;
        --state-info: #60a5fa;

        /* === Text System === */
        --color-text-primary: #f1f5f9;
        --color-text-secondary: #94a3b8;
        --color-text-muted: #64748b;
        --color-text-inverse: #0f172a;

        /* === Border System === */
        --color-border: #2d3148;
        --color-border-active: #8b5cf6;
        --color-border-subtle: #1e2236;

        /* === Typography === */
        --font-family-display: "Inter", system-ui, -apple-system, sans-serif;
        --font-family-mono:
          "JetBrains Mono", "Fira Code", "Consolas", monospace;
        --font-family-body: "Inter", system-ui, -apple-system, sans-serif;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.8125rem;
        --font-size-base: 0.875rem;
        --font-size-md: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.5rem;
        --font-size-2xl: 2rem;

        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        /* === Spacing Scale === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

        /* === Radius === */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* === Shadows === */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);
        --shadow-glow-strong: 0 0 30px rgba(139, 92, 246, 0.35);
      }

      html.dark {
        --color-bg-primary: #0d0f1a;
        --color-bg-secondary: #131525;
        --color-bg-surface: #1a1d32;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-family-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }

      /* === Utility Classes === */
      .etp-font-display {
        font-family: var(--font-family-display);
      }
      .etp-font-mono {
        font-family: var(--font-family-mono);
      }
      .etp-font-body {
        font-family: var(--font-family-body);
      }
      .etp-text-accent {
        color: var(--color-accent-primary);
      }
      .etp-text-cyan {
        color: var(--color-tech-cyan);
      }
      .etp-text-green {
        color: var(--color-tech-green);
      }
      .etp-text-muted {
        color: var(--color-text-secondary);
      }
      .etp-bg-surface {
        background-color: var(--color-bg-surface);
      }
      .etp-bg-elevated {
        background-color: var(--color-bg-elevated);
      }
      .etp-border-glow {
        border: 1px solid var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-card-hover {
        transition: all 0.2s ease;
      }
      .etp-card-hover:hover {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }
      .etp-grid-bg {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .etp-scanline::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139, 92, 246, 0.015) 2px,
          rgba(139, 92, 246, 0.015) 4px
        );
        pointer-events: none;
      }

      /* LED indicator */
      .etp-led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .etp-led-green {
        background: var(--state-success);
        box-shadow: 0 0 6px var(--state-success);
      }
      .etp-led-red {
        background: var(--state-error);
        box-shadow: 0 0 6px var(--state-error);
      }
      .etp-led-yellow {
        background: var(--state-warning);
        box-shadow: 0 0 6px var(--state-warning);
      }
      @keyframes etp-led-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .etp-btn-tool {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .etp-btn-tool:hover {
        background: var(--color-bg-hover);
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }

      .etp-statusbar {
        background: var(--color-bg-secondary);
        border-top: 1px solid var(--color-border);
        padding: var(--space-1) var(--space-4);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* shared form controls */
      .etp-input,
      .etp-select {
        width: 100%;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        font-family: var(--font-family-mono);
        outline: none;
        transition: border-color 0.15s;
      }
      .etp-input:focus,
      .etp-select:focus {
        border-color: var(--color-accent-primary);
        box-shadow: var(--shadow-glow);
      }
      .etp-label {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        font-family: var(--font-family-mono);
      }

      /* toggle switch */
      .etp-toggle {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }
      .etp-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .etp-toggle-track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        transition: 0.2s;
      }
      .etp-toggle-track::before {
        content: "";
        position: absolute;
        height: 12px;
        width: 12px;
        left: 2px;
        top: 2px;
        background: var(--color-text-muted);
        border-radius: 50%;
        transition: 0.2s;
      }
      .etp-toggle input:checked + .etp-toggle-track {
        background: rgba(139, 92, 246, 0.25);
        border-color: var(--color-accent-primary);
      }
      .etp-toggle input:checked + .etp-toggle-track::before {
        transform: translateX(16px);
        background: var(--color-accent-primary);
        box-shadow: 0 0 6px var(--color-accent-primary);
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-primary);
      }

      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: var(--color-bg-secondary);
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 var(--space-4);
        gap: var(--space-3);
        flex-shrink: 0;
        font-family: var(--font-family-mono);
        position: relative;
        border-bottom: 1px solid var(--color-border);
        flex-wrap: wrap;
      }
      .topbar::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-accent-primary),
          var(--color-tech-cyan),
          transparent
        );
        opacity: 0.3;
      }
      .topbar .title {
        font-weight: 700;
        color: var(--color-accent-light);
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .sep {
        width: 1px;
        height: 28px;
        background: var(--color-border);
      }
      .topbar .field {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .topbar .field label {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .topbar .field select {
        min-width: 130px;
      }
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .panel {
        background: var(--color-bg-secondary);
        overflow-y: auto;
        padding: var(--space-4);
      }
      .panel-left {
        width: 280px;
        flex-shrink: 0;
        border-right: 1px solid var(--color-border);
      }
      .panel-right {
        width: 280px;
        flex-shrink: 0;
        border-left: 1px solid var(--color-border);
      }
      .panel-mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: var(--space-4);
      }
      .section-h {
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-muted);
        margin: var(--space-2) 0 var(--space-2);
        font-family: var(--font-family-mono);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-h::before {
        content: "";
        width: 3px;
        height: 12px;
        background: var(--color-accent-primary);
        border-radius: 2px;
      }
      .section-h:not(:first-child) {
        margin-top: var(--space-5);
      }
      .field {
        margin-bottom: var(--space-3);
      }
      .field label {
        display: block;
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        gap: var(--space-2);
      }
      .row > * {
        flex: 1;
      }
      .drop-zone {
        border: 2px dashed var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-5) var(--space-3);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--color-bg-elevated);
      }
      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--color-accent-primary);
        background: rgba(139, 92, 246, 0.08);
        box-shadow: var(--shadow-glow);
      }
      .drop-zone .ico {
        color: var(--color-accent-light);
        margin-bottom: var(--space-2);
      }
      .drop-zone .t {
        font-size: var(--font-size-sm);
        color: var(--color-text-primary);
      }
      .drop-zone .s {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-top: 4px;
      }
      .fw-info {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-3);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .fw-info .r {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }
      .fw-info .r .l {
        color: var(--color-text-muted);
      }
      .fw-info .r .v {
        color: var(--color-tech-cyan);
      }
      .op-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }
      .op-btn {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        color: var(--color-text-primary);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: var(--font-size-sm);
        font-family: var(--font-family-display);
        transition: all 0.15s;
      }
      .op-btn:hover:not(:disabled) {
        border-color: var(--color-accent-primary);
        background: var(--color-bg-hover);
        box-shadow: var(--shadow-glow);
        transform: translateY(-1px);
      }
      .op-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .op-btn i {
        color: var(--color-accent-light);
      }
      .op-btn.primary {
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.18),
          rgba(124, 58, 237, 0.08)
        );
        border-color: var(--color-accent-dark);
      }
      .op-btn.danger:hover:not(:disabled) {
        border-color: var(--state-error);
        box-shadow: 0 0 20px rgba(248, 113, 113, 0.15);
      }
      .op-btn.danger:hover:not(:disabled) i {
        color: var(--state-error);
      }
      .op-btn.run {
        background: linear-gradient(
          135deg,
          rgba(52, 211, 153, 0.15),
          rgba(5, 150, 105, 0.05)
        );
        border-color: rgba(52, 211, 153, 0.4);
      }
      .op-btn.run i {
        color: var(--state-success);
      }
      .progress-wrap {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        margin-bottom: var(--space-3);
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-2);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .progress-head .stage {
        color: var(--color-accent-light);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .progress-head .pct {
        color: var(--color-tech-cyan);
        font-weight: 600;
        font-size: var(--font-size-md);
      }
      .progress-bar {
        height: 10px;
        background: var(--color-bg-primary);
        border-radius: var(--radius-full);
        overflow: hidden;
        position: relative;
        border: 1px solid var(--color-border-subtle);
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          var(--color-accent-primary),
          var(--color-tech-cyan)
        );
        border-radius: var(--radius-full);
        transition: width 0.25s ease;
        position: relative;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .progress-stats {
        display: flex;
        gap: var(--space-4);
        margin-top: var(--space-2);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
      }
      .progress-stats span b {
        color: var(--color-tech-green);
        font-weight: 500;
      }
      .console {
        flex: 1;
        background: #0a0c14;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        font-family: var(--font-family-mono);
        font-size: 11px;
        line-height: 1.55;
        overflow-y: auto;
        min-height: 160px;
      }
      .console .ln {
        display: flex;
        gap: 6px;
      }
      .console .ts {
        color: var(--color-text-muted);
        flex-shrink: 0;
      }
      .console .tag {
        flex-shrink: 0;
        font-weight: 600;
      }
      .console .info {
        color: var(--state-info);
      }
      .console .ok {
        color: var(--state-success);
      }
      .console .warn {
        color: var(--state-warning);
      }
      .console .err {
        color: var(--state-error);
      }
      .console .dim {
        color: var(--color-text-muted);
      }
      .info-card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        margin-bottom: var(--space-3);
      }
      .info-card .h {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: var(--space-2);
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-family-mono);
      }
      .kv {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .kv .l {
        color: var(--color-text-muted);
      }
      .kv .v {
        color: var(--color-tech-cyan);
      }
      .chip-id {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-lg);
        color: var(--color-accent-light);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .ob-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
      }
      .ob-row .nm {
        color: var(--color-text-secondary);
      }
      .ob-row .vl {
        color: var(--color-tech-green);
      }
      .toggle-mini {
        position: relative;
        width: 30px;
        height: 16px;
      }
      .toggle-mini input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-mini .tk {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        transition: 0.2s;
      }
      .toggle-mini .tk::before {
        content: "";
        position: absolute;
        height: 10px;
        width: 10px;
        left: 2px;
        top: 2px;
        background: var(--color-text-muted);
        border-radius: 50%;
        transition: 0.2s;
      }
      .toggle-mini input:checked + .tk {
        background: rgba(139, 92, 246, 0.25);
        border-color: var(--color-accent-primary);
      }
      .toggle-mini input:checked + .tk::before {
        transform: translateX(14px);
        background: var(--color-accent-primary);
        box-shadow: 0 0 6px var(--color-accent-primary);
      }
      .counter {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.1),
          rgba(34, 211, 238, 0.05)
        );
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
      }
      .counter .num {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-accent-light);
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }
      .counter .lab {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .conn-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: var(--radius-full);
        font-size: var(--font-size-xs);
        font-family: var(--font-family-mono);
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
      }
      .conn-pill.on {
        border-color: var(--state-success);
        color: var(--state-success);
      }
      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
          overflow-y: auto;
        }
        .panel-left,
        .panel-right {
          width: 100%;
          border-right: none;
          border-left: none;
          border-bottom: 1px solid var(--color-border);
        }
        .panel-mid {
          min-height: 420px;
        }
        .topbar {
          height: auto;
          padding: var(--space-2) var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="title"
        ><i data-lucide="cpu" style="width: 18px; height: 18px"></i
        >芯片程序下载</span
      >
      <div class="sep"></div>
      <div class="field">
        <label>架构</label
        ><select class="etp-select" id="arch" onchange="onArchChange()">
          <option>STM32</option>
          <option>ESP32</option>
          <option>GD32</option>
          <option>NXP</option>
          <option>Microchip</option>
          <option>Renesas</option>
          <option>Allwinner</option>
        </select>
      </div>
      <div class="field">
        <label>编程器</label
        ><select class="etp-select" id="prog" onchange="onProgChange()">
          <option>ST-Link</option>
          <option>J-Link</option>
          <option>CMSIS-DAP</option>
          <option>串口 (UART)</option>
          <option>DAPLink</option>
        </select>
      </div>
      <div class="field">
        <label>接口</label
        ><select class="etp-select" id="iface">
          <option>SWD</option>
          <option>JTAG</option>
          <option>UART</option>
          <option>SWIM</option>
          <option>SPD</option>
        </select>
      </div>
      <div style="flex: 1"></div>
      <span class="conn-pill" id="connPill"
        ><span
          class="etp-led"
          style="background: var(--color-text-muted)"
        ></span
        >未连接</span
      >
    </header>

    <div class="layout">
      <!-- LEFT: firmware + flash config -->
      <aside class="panel panel-left">
        <div class="section-h">固件文件</div>
        <div class="drop-zone" id="dropZone" onclick="browseFw()">
          <div class="ico">
            <i data-lucide="file-up" style="width: 28px; height: 28px"></i>
          </div>
          <div class="t">拖拽固件到此处</div>
          <div class="s">或点击浏览 · 支持 .bin/.hex/.elf</div>
        </div>
        <input
          type="file"
          id="fwFile"
          accept=".bin,.hex,.elf"
          style="display: none"
          onchange="onFwPick(event)"
        />

        <div class="section-h">固件信息</div>
        <div class="fw-info" id="fwInfo">
          <div class="r">
            <span class="l">文件名</span><span class="v" id="fwName">—</span>
          </div>
          <div class="r">
            <span class="l">大小</span><span class="v" id="fwSize">—</span>
          </div>
          <div class="r">
            <span class="l">校验和 (CRC32)</span
            ><span class="v" id="fwCrc">—</span>
          </div>
          <div class="r">
            <span class="l">入口地址</span><span class="v" id="fwEntry">—</span>
          </div>
          <div class="r">
            <span class="l">格式</span><span class="v" id="fwFmt">—</span>
          </div>
        </div>

        <div class="section-h">Flash 配置</div>
        <div class="field">
          <label>起始地址</label
          ><input class="etp-input" id="flashStart" value="0x08000000" />
        </div>
        <div class="row">
          <div class="field">
            <label>Flash 大小</label
            ><input class="etp-input" id="flashSize" value="512K" />
          </div>
          <div class="field">
            <label>扇区大小</label
            ><input class="etp-input" id="sectorSize" value="2K" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>时钟 (MHz)</label
            ><input class="etp-input" id="clk" value="48" />
          </div>
          <div class="field">
            <label>电压 (V)</label
            ><input class="etp-input" id="volt" value="3.30" />
          </div>
        </div>
      </aside>

      <!-- MIDDLE: ops + progress + log -->
      <section class="panel-mid">
        <div class="op-grid">
          <button class="op-btn primary" id="opConn" onclick="opConnect()">
            <i data-lucide="plug-zap" style="width: 20px; height: 20px"></i>连接
          </button>
          <button
            class="op-btn danger"
            id="opErase"
            onclick="opErase()"
            disabled
          >
            <i data-lucide="eraser" style="width: 20px; height: 20px"></i>擦除
          </button>
          <button
            class="op-btn primary"
            id="opProg"
            onclick="opProgram()"
            disabled
          >
            <i
              data-lucide="download-cloud"
              style="width: 20px; height: 20px"
            ></i
            >编程
          </button>
          <button class="op-btn" id="opVerify" onclick="opVerify()" disabled>
            <i data-lucide="badge-check" style="width: 20px; height: 20px"></i
            >校验
          </button>
          <button class="op-btn" id="opRead" onclick="opReadback()" disabled>
            <i data-lucide="upload-cloud" style="width: 20px; height: 20px"></i
            >读回
          </button>
          <button class="op-btn run" id="opRun" onclick="opResetRun()" disabled>
            <i data-lucide="play-circle" style="width: 20px; height: 20px"></i
            >复位运行
          </button>
        </div>

        <div class="progress-wrap">
          <div class="progress-head">
            <span class="stage" id="stageLabel">待机</span>
            <span class="pct" id="stagePct">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progFill"></div>
          </div>
          <div class="progress-stats">
            <span>速率 <b id="progRate">— KB/s</b></span>
            <span
              >已写入 <b id="progDone">0 KB</b> /
              <span id="progTotal">— KB</span></span
            >
            <span>预计剩余 <b id="progEta">—</b></span>
          </div>
        </div>

        <div class="section-h" style="margin-top: 0">日志控制台</div>
        <div class="console" id="console"></div>
      </section>

      <!-- RIGHT: chip info + option bytes + counter -->
      <aside class="panel panel-right">
        <div class="section-h">芯片信息</div>
        <div class="info-card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: var(--space-2);
            "
          >
            <span
              style="
                font-size: var(--font-size-xs);
                color: var(--color-text-muted);
              "
              >CHIP ID</span
            >
            <span class="etp-led etp-led-green" id="chipLed"></span>
          </div>
          <div class="chip-id" id="chipId">—</div>
          <div style="margin-top: var(--space-2)">
            <div class="kv">
              <span class="l">型号</span><span class="v" id="chipModel">—</span>
            </div>
            <div class="kv">
              <span class="l">Flash</span
              ><span class="v" id="chipFlash">—</span>
            </div>
            <div class="kv">
              <span class="l">RAM</span><span class="v" id="chipRam">—</span>
            </div>
            <div class="kv">
              <span class="l">UID</span
              ><span class="v" id="chipUid" style="font-size: 10px">—</span>
            </div>
            <div class="kv">
              <span class="l">封装</span><span class="v" id="chipPkg">—</span>
            </div>
          </div>
        </div>

        <div class="section-h">选项字节 / 配置位</div>
        <div class="info-card" id="optBytes"></div>

        <div class="section-h">烧录计数器</div>
        <div class="counter">
          <div>
            <div class="lab">总烧录次数</div>
            <div class="num" id="burnCount">0</div>
          </div>
          <div style="text-align: right">
            <div class="lab">本次会话</div>
            <div
              style="
                font-family: var(--font-family-mono);
                font-size: var(--font-size-lg);
                color: var(--color-tech-cyan);
                font-weight: 600;
              "
              id="sessionCount"
            >
              0
            </div>
          </div>
        </div>
        <button
          class="etp-btn-tool"
          style="width: 100%; margin-top: var(--space-2)"
          onclick="resetCounter()"
        >
          <i data-lucide="rotate-ccw" style="width: 13px; height: 13px"></i>
          重置计数
        </button>
      </aside>
    </div>

    <script src="/assets/app.js"></script>
    <script>
      // ===== 芯片数据库 (模拟) =====
      const CHIPS = {
        STM32: {
          id: "0x10016405",
          model: "STM32F407VGT6",
          flash: "1024 KB",
          ram: "192 KB",
          uid: "32:0024:0034:3850:4150:6067",
          pkg: "LQFP100",
          entry: "0x08000000",
          opts: [
            ["READ PROTECT", "OFF"],
            ["WDG_HW", "OFF"],
            ["BOR_LEV", "LEVEL3"],
            ["VDDA_IO", "ON"],
          ],
        },
        ESP32: {
          id: "0x00082360",
          model: "ESP32-WROOM-32",
          flash: "4 MB",
          ram: "520 KB",
          uid: "24:0A:C4:11:22:33:44:55",
          pkg: "QFN-48",
          entry: "0x1000",
          opts: [
            ["FLASH MODE", "QIO"],
            ["FLASH SIZE", "4MB"],
            ["CRYSTAL", "40MHz"],
            ["VDD_SDIO", "3.3V"],
          ],
        },
        GD32: {
          id: "0x07003060",
          model: "GD32F303VCT6",
          flash: "256 KB",
          ram: "48 KB",
          uid: "29:41:50:88:33:22:11",
          pkg: "LQFP100",
          entry: "0x08000000",
          opts: [
            [
              ["SPM", "OFF"],
              ["FMC_LV", "ENABLED"],
            ],
          ][0],
        },
        NXP: {
          id: "0x4C413030",
          model: "LPC1768FBD100",
          flash: "512 KB",
          ram: "64 KB",
          uid: "50:0F:11:55:22:33:44",
          pkg: "LQFP100",
          entry: "0x00000000",
          opts: [
            ["CRP", "NO_ISP"],
            ["BOD", "ENABLED"],
            ["WDT", "DISABLED"],
          ],
        },
        Microchip: {
          id: "0x00304053",
          model: "PIC32MX795F512L",
          flash: "512 KB",
          ram: "128 KB",
          uid: "54:33:22:11:00:66",
          pkg: "TQFP100",
          entry: "0x9D000000",
          opts: [
            ["JTAG", "ENABLED"],
            ["PMD", "OFF"],
            ["WDT", "ON"],
          ],
        },
        Renesas: {
          id: "0x0F012345",
          model: "RA6M3",
          flash: "2 MB",
          ram: "640 KB",
          uid: "00:11:22:33:44:55:66",
          pkg: "LQFP144",
          entry: "0x00000000",
          opts: [
            ["SECURITY", "OFF"],
            ["DUAL BANK", "ON"],
            ["SWD", "ENABLED"],
          ],
        },
        Allwinner: {
          id: "0x00167890",
          model: "F1C100s",
          flash: "32 MB SPI",
          ram: "32 MB DDR",
          uid: "11:22:33:44:55:66",
          pkg: "QFN-88",
          entry: "0x00000000",
          opts: [
            ["BOOT", "SD0"],
            ["SPI SPEED", "50MHz"],
            ["JTAG", "ENABLED"],
          ],
        },
      };
      let burnTotal = 0,
        sessionBurn = 0,
        connected = false,
        busy = false;

      function onArchChange() {
        const c = CHIPS[document.getElementById("arch").value] || CHIPS.STM32;
        document.getElementById("chipId").textContent = c.id;
        document.getElementById("chipModel").textContent = c.model;
        document.getElementById("chipFlash").textContent = c.flash;
        document.getElementById("chipRam").textContent = c.ram;
        document.getElementById("chipUid").textContent = c.uid;
        document.getElementById("chipPkg").textContent = c.pkg;
        document.getElementById("fwEntry").textContent = c.entry;
        document.getElementById("flashStart").value = c.entry;
        // option bytes
        const ob = document.getElementById("optBytes");
        ob.innerHTML = "";
        (c.opts || []).forEach(([k, v]) => {
          const r = document.createElement("div");
          r.className = "ob-row";
          r.innerHTML = `<span class="nm">${k}</span><label class="toggle-mini"><input type="checkbox" ${/ON|ENABLED|QIO|LEVEL3/.test(v) ? "checked" : ""}><span class="tk"></span></label><span class="vl">${v}</span>`;
          ob.appendChild(r);
        });
        log("info", `架构切换: ${c.model}`);
      }
      function onProgChange() {
        const p = document.getElementById("prog").value;
        const iface = document.getElementById("iface");
        // 根据编程器调整可用接口
        if (p.startsWith("串口")) iface.value = "UART";
        else if (p === "ST-Link" || p === "CMSIS-DAP" || p === "DAPLink") {
          if (iface.value === "UART") iface.value = "SWD";
        }
      }

      // ===== 固件选择 =====
      function browseFw() {
        document.getElementById("fwFile").click();
      }
      function onFwPick(e) {
        const f = e.target.files[0];
        if (!f) return;
        loadFirmware(f.name, f.size);
        // 读取文件计算 CRC (模拟)
        const reader = new FileReader();
        reader.onload = () => {
          const crc = crc32Mock(new Uint8Array(reader.result));
          document.getElementById("fwCrc").textContent =
            "0x" + crc.toString(16).toUpperCase().padStart(8, "0");
        };
        reader.readAsArrayBuffer(f);
      }
      function loadFirmware(name, size) {
        document.getElementById("fwName").textContent = name;
        document.getElementById("fwSize").textContent = fmtSize(size);
        document.getElementById("fwFmt").textContent = (
          name.split(".").pop() || "bin"
        ).toUpperCase();
        document.getElementById("progTotal").textContent =
          (size / 1024).toFixed(1) + " KB";
        log("ok", `固件已加载: ${name} (${fmtSize(size)})`);
      }
      function fmtSize(b) {
        if (b < 1024) return b + " B";
        if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
        return (b / 1048576).toFixed(2) + " MB";
      }
      function crc32Mock(b) {
        let c = 0xffffffff;
        for (let i = 0; i < b.length; i++) {
          c ^= b[i];
          for (let j = 0; j < 8; j++)
            c = c & 1 ? (c >>> 1) ^ 0xedb88320 : c >>> 1;
        }
        return (c ^ 0xffffffff) >>> 0;
      }

      // 拖拽
      const dz = document.getElementById("dropZone");
      ["dragenter", "dragover"].forEach((ev) =>
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          dz.classList.add("dragover");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        dz.addEventListener(ev, (e) => {
          e.preventDefault();
          dz.classList.remove("dragover");
        }),
      );
      dz.addEventListener("drop", (e) => {
        const f = e.dataTransfer.files[0];
        if (f) {
          loadFirmware(f.name, f.size);
        }
      });

      // ===== 操作 =====
      async function opConnect() {
        if (busy) return;
        if (!connected) {
          setStage("连接编程器...", 5);
          log(
            "info",
            `尝试连接 ${document.getElementById("prog").value} @ ${document.getElementById("iface").value}`,
          );
          await animProgress(5, 30, 400);
          setStage("读取芯片ID...", 45);
          await sleep(300);
          await animProgress(45, 100, 500);
          connected = true;
          document.getElementById("chipLed").className =
            "etp-led etp-led-green";
          const pill = document.getElementById("connPill");
          pill.className = "conn-pill on";
          pill.innerHTML = '<span class="etp-led etp-led-green"></span>已连接';
          document.getElementById("opConn").innerHTML =
            '<i data-lucide="power" style="width:20px;height:20px"></i>断开';
          document.getElementById("opConn").classList.remove("primary");
          document.getElementById("opConn").classList.add("danger");
          ["opErase", "opProg", "opVerify", "opRead", "opRun"].forEach(
            (id) => (document.getElementById(id).disabled = false),
          );
          const c = CHIPS[document.getElementById("arch").value];
          log("ok", `连接成功 · ${c.model} · ID=${c.id}`);
          log("dim", `Flash=${c.flash} RAM=${c.ram} UID=${c.uid}`);
          lucide.createIcons();
          setStage("就绪", 0);
          resetBar();
        } else {
          connected = false;
          document.getElementById("chipLed").className = "etp-led";
          document.getElementById("chipLed").style.background =
            "var(--color-text-muted)";
          const pill = document.getElementById("connPill");
          pill.className = "conn-pill";
          pill.innerHTML =
            '<span class="etp-led" style="background:var(--color-text-muted)"></span>未连接';
          document.getElementById("opConn").innerHTML =
            '<i data-lucide="plug-zap" style="width:20px;height:20px"></i>连接';
          document.getElementById("opConn").classList.add("primary");
          document.getElementById("opConn").classList.remove("danger");
          ["opErase", "opProg", "opVerify", "opRead", "opRun"].forEach(
            (id) => (document.getElementById(id).disabled = true),
          );
          log("warn", "已断开连接");
          lucide.createIcons();
          setStage("待机", 0);
          resetBar();
        }
      }
      async function opErase() {
        if (!ensureConn()) return;
        setStage("擦除 Flash", 0);
        log("warn", "开始擦除...");
        await animStage("擦除 Flash", 0, 100, 1800, (kb) =>
          log(
            "dim",
            "  扇区 @0x" + (0x08000000 + kb * 1024).toString(16) + " 已擦除",
          ),
        );
        log("ok", "擦除完成");
        setStage("就绪", 0);
        resetBar();
      }
      async function opProgram() {
        if (!ensureConn()) return;
        const total =
          parseInt(document.getElementById("fwSize").textContent) || 256 * 1024;
        const totalKb = total / 1024;
        setStage("编程 Flash", 0);
        log("info", "开始编程 " + fmtSize(total));
        burnTotal++;
        sessionBurn++;
        document.getElementById("burnCount").textContent = burnTotal;
        document.getElementById("sessionCount").textContent = sessionBurn;
        await animStage("编程 Flash", 0, 100, 2600, (kb, pct) => {
          if (Math.random() < 0.08)
            log(
              "dim",
              "  写入 0x" +
                (0x08000000 + kb * 1024).toString(16).toUpperCase() +
                ".." +
                fmtSize(2048) +
                " OK",
            );
        });
        log("ok", `编程完成 · 烧录次数 +1 (总计 ${burnTotal})`);
        if (Math.random() < 0.15) log("warn", "校验警告: 1 个空页跳过");
        setStage("就绪", 0);
        resetBar();
      }
      async function opVerify() {
        if (!ensureConn()) return;
        setStage("校验固件", 0);
        log("info", "开始校验...");
        await animStage("校验固件", 0, 100, 1400);
        if (Math.random() < 0.9) log("ok", "校验通过 · 数据完全匹配");
        else {
          log("err", "校验失败 @0x08001234");
        }
        setStage("就绪", 0);
        resetBar();
      }
      async function opReadback() {
        if (!ensureConn()) return;
        setStage("读回 Flash", 0);
        log("info", "读取 Flash 内容...");
        await animStage("读回 Flash", 0, 100, 1600);
        log("ok", "读回完成 · 已保存到 readback.bin");
        setStage("就绪", 0);
        resetBar();
      }
      async function opResetRun() {
        if (!ensureConn()) return;
        setStage("复位并运行", 30);
        log("info", "复位芯片...");
        await sleep(400);
        setStage("复位并运行", 70);
        await sleep(300);
        setStage("复位并运行", 100);
        log(
          "ok",
          "芯片已启动 · 入口 " + document.getElementById("fwEntry").textContent,
        );
        await sleep(500);
        setStage("就绪", 0);
        resetBar();
      }
      function ensureConn() {
        if (!connected) {
          log("err", "请先连接编程器");
          return false;
        }
        if (busy) {
          log("warn", "操作进行中,请等待");
          return false;
        }
        return true;
      }

      function resetCounter() {
        burnTotal = 0;
        sessionBurn = 0;
        document.getElementById("burnCount").textContent = 0;
        document.getElementById("sessionCount").textContent = 0;
        log("warn", "计数器已重置");
      }
      function setStage(label, pct) {
        document.getElementById("stageLabel").textContent = label;
        document.getElementById("stagePct").textContent = pct + "%";
        document.getElementById("progFill").style.width = pct + "%";
      }
      function resetBar() {
        document.getElementById("progFill").style.width = "0%";
        document.getElementById("progRate").textContent = "— KB/s";
        document.getElementById("progDone").textContent = "0 KB";
        document.getElementById("progEta").textContent = "—";
      }
      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }
      async function animProgress(from, to, dur) {
        const t0 = Date.now();
        return new Promise((r) => {
          const tick = () => {
            const p = Math.min(1, (Date.now() - t0) / dur);
            const v = Math.round(from + (to - from) * p);
            document.getElementById("progFill").style.width = v + "%";
            document.getElementById("stagePct").textContent = v + "%";
            if (p < 1) requestAnimationFrame(tick);
            else r();
          };
          tick();
        });
      }
      async function animStage(label, from, to, dur, onTick) {
        busy = true;
        const t0 = Date.now();
        const totalKb =
          parseFloat(document.getElementById("progTotal").textContent) || 256;
        return new Promise((r) => {
          const tick = () => {
            const p = Math.min(1, (Date.now() - t0) / dur);
            const v = from + (to - from) * p;
            const pct = Math.round(v);
            document.getElementById("progFill").style.width = pct + "%";
            document.getElementById("stagePct").textContent = pct + "%";
            document.getElementById("stageLabel").textContent = label;
            const doneKb = totalKb * p;
            document.getElementById("progDone").textContent =
              doneKb.toFixed(1) + " KB";
            document.getElementById("progRate").textContent =
              (dur / 1000 > 0
                ? ((totalKb * p) / (dur / 1000)).toFixed(1)
                : "0") + " KB/s";
            const remain = (dur / 1000) * (1 - p);
            document.getElementById("progEta").textContent =
              remain > 0.1 ? remain.toFixed(1) + "s" : "<0.1s";
            if (onTick && Math.random() < 0.3) onTick(doneKb, pct);
            if (p < 1) requestAnimationFrame(tick);
            else {
              busy = false;
              r();
            }
          };
          tick();
        });
      }

      // ===== 日志 =====
      function log(lvl, msg) {
        const c = document.getElementById("console");
        const ln = document.createElement("div");
        ln.className = "ln";
        const tag =
          { info: "INFO", ok: " OK", warn: "WARN", err: "ERR", dim: "···" }[
            lvl
          ] || "LOG";
        ln.innerHTML =
          '<span class="ts">' +
          ETP.util.ts() +
          '</span><span class="tag ' +
          lvl +
          '">[' +
          tag +
          ']</span><span class="' +
          lvl +
          '">' +
          esc(msg) +
          "</span>";
        c.appendChild(ln);
        c.scrollTop = c.scrollHeight;
        while (c.childNodes.length > 800) c.removeChild(c.firstChild);
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ===== 初始化 =====
      onArchChange();
      // 预填一个模拟固件
      loadFirmware("firmware.bin", 256 * 1024);
      document.getElementById("fwCrc").textContent = "0x9A7B3F21";
      log("dim", "芯片程序下载工具已就绪");
      log("dim", "选择架构/编程器/接口后点击「连接」");
      lucide.createIcons();
    </script>
    <script>
      ETP.initWindow();
      lucide.createIcons();
    </script>
  </body>
</html>
