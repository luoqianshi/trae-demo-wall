<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾音电台 - 慢下来，听故事</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 第一层：初始界面 -->
    <div class="home-screen">
        <!-- 顶部：电台名称 + ON AIR -->
        <header class="station-header">
            <h1 class="station-name">拾音电台</h1>
            <div class="on-air-badge">
                <span class="on-air-dot"></span>
                <span class="on-air-text">ON AIR</span>
            </div>
        </header>

        <!-- 实时时间 -->
        <div class="time-display">
            <div class="current-time">--:--</div>
            <div class="date-info">----年--月--日 星期-</div>
        </div>

        <!-- 中间信息框（初始隐藏内容） -->
        <div class="track-card" id="trackCard">
            <div class="vinyl-small">
                <div class="vinyl-grooves-small"></div>
                <div class="vinyl-center-small"></div>
            </div>
            <div class="track-info-small">
                <div class="track-main-line">
                    <span class="waiting-text">等待点播...</span>
                </div>
                <p class="track-hint track-hint-hidden"></p>
            </div>
            <div class="audio-visualizer visualizer-idle">
                <div class="bar" style="animation-delay: 0ms"></div>
                <div class="bar" style="animation-delay: 100ms"></div>
                <div class="bar" style="animation-delay: 200ms"></div>
                <div class="bar" style="animation-delay: 300ms"></div>
                <div class="bar" style="animation-delay: 400ms"></div>
                <div class="bar" style="animation-delay: 250ms"></div>
                <div class="bar" style="animation-delay: 150ms"></div>
            </div>
        </div>

        <!-- DJ独白框（初始隐藏内容） -->
        <div class="narration-card" id="narrationCard">
            <div class="narration-list" id="narrationList">
                <div class="narration-placeholder">点击下方按钮开启旅程...</div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <button class="random-btn" id="randomBtn">
            <svg class="random-icon" viewBox="0 0 24 24">
                <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
            随机选取一首歌
        </button>
    </div>

    <!-- 第二层：详情弹窗 -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-overlay"></div>
        <div class="detail-content">
            <!-- 固定区域 -->
            <div class="detail-fixed">
                <!-- 关闭按钮 -->
                <button class="close-btn" id="closeBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>

                <!-- 歌曲信息头部 -->
                <div class="detail-header">
                    <div class="detail-left">
                        <h2 class="detail-title">歌名</h2>
                        <p class="detail-artist">歌手</p>
                        <p class="detail-album">专辑</p>
                    </div>
                    <div class="detail-right">
                        <p class="detail-credit"><span>作词</span>词人</p>
                        <p class="detail-credit"><span>作曲</span>曲作者</p>
                        <p class="detail-credit"><span>编曲</span>编曲人</p>
                        <p class="detail-credit"><span>年份</span>2026</p>
                    </div>
                </div>

                <!-- 外部链接按钮 -->
                <div class="detail-links">
                    <button class="link-btn netease-link">
                        <svg viewBox="0 0 24 24"><path d="M12 2L8 6v6l4 3v5l8-4V6l-8-4zM8 18l4 2v-3l-4-2v3z"/></svg>
                        网易云音乐
                    </button>
                    <button class="link-btn qq-link">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        QQ音乐
                    </button>
                </div>
            </div>

            <!-- 滚动区域 -->
            <div class="detail-scroll">
                <!-- 文章标题 -->
                <h3 class="article-title">文章标题</h3>
                <div class="article-body">
                    <p>文章内容...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="data/database.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
