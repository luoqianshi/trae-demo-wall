<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐忆MemoryFun - 记忆力训练游戏合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6C5CE7;--primary-light:#E8F1FA;--primary-end:#a29bfe;--success:#52C41A;--warning:#FAAD14;--danger:#F5222D;--text:#333;--text2:#666;--border:#D9D9D9;--bg:#F5F7FA;--card:#fff;--shadow:0 2px 12px rgba(0,0,0,.1);--radius:16px;--font:18px;--font-lg:22px;--font-xl:28px;--glow:rgba(108,92,231,.45);--glass:rgba(255,255,255,.55);--glass-border:rgba(255,255,255,.3)}
.eye-care{--bg:#F5F0E1;--card:#FAF6E9;--primary:#8B7355;--primary-light:#F0E6D3;--primary-end:#A89070;--text:#4A4035;--text2:#6B5D4D;--border:#D4C9B8;--glow:rgba(139,115,85,.4);--glass:rgba(250,246,233,.6);--glass-border:rgba(212,201,184,.4)}
.child-mode{--primary:#FF6348;--primary-light:#FFE4ED;--primary-end:#FF9FF3;--success:#67C23A;--warning:#F4A460;--bg:#FFF5F8;--text:#5D4E6D;--border:#FFD1DC;--radius:24px;--glow:rgba(255,99,72,.45);--glass:rgba(255,255,255,.6);--glass-border:rgba(255,209,220,.4)}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:var(--font);color:var(--text);background:var(--bg);min-height:100vh;line-height:1.6;overflow-x:hidden;position:relative;
background-image:radial-gradient(circle at 20% 80%,rgba(108,92,231,.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(162,155,254,.08) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(108,92,231,.04) 0%,transparent 70%)}
.child-mode body,body.child-mode{background-image:radial-gradient(circle at 20% 80%,rgba(255,99,72,.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,159,243,.08) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(255,99,72,.04) 0%,transparent 70%)}
/* Background floating orbs */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:orbFloat 20s ease-in-out infinite}
.orb1{width:300px;height:300px;background:var(--primary);top:-80px;left:-60px;animation-duration:22s}
.orb2{width:250px;height:250px;background:var(--primary-end);bottom:-60px;right:-40px;animation-duration:18s;animation-delay:-6s}
.orb3{width:200px;height:200px;background:linear-gradient(135deg,var(--primary),var(--primary-end));top:40%;left:60%;animation-duration:25s;animation-delay:-12s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-40px) scale(1.05)}50%{transform:translate(-20px,30px) scale(.95)}75%{transform:translate(40px,20px) scale(1.08)}}
/* Ensure content above orbs */
.particles,.combo-bar,.header,.bar,.sp,.area,.overlay,.pet-buddy,.vb{position:relative;z-index:1}
/* Particle container */
.particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;pointer-events:none;font-size:24px;animation:particleFly 1.2s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}100%{opacity:0;transform:translateY(-200px) scale(0) rotate(360deg)}}
/* Floating score */
.float-score{position:fixed;pointer-events:none;font-size:var(--font-xl);font-weight:900;color:var(--success);z-index:150;animation:floatUp 1s ease-out forwards;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}
/* Screen effects */
.screen-shake{animation:screenShake .3s ease}
@keyframes screenShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* Combo fire */
.combo-bar{position:fixed;top:0;left:0;right:0;height:4px;z-index:90;transition:all .3s}
.combo-bar.active{height:6px;background:linear-gradient(90deg,#FF6B6B,#FFD700,#52C41A);box-shadow:0 0 30px rgba(255,107,107,.8),0 0 60px rgba(255,215,0,.4)}
/* Header */
.header{background:linear-gradient(135deg,var(--primary),var(--primary-end),var(--primary-light));padding:18px;text-align:center;overflow:hidden;position:relative;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border)}
.header h1{font-size:var(--font-xl);color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.2);background:linear-gradient(90deg,#fff 0%,#ffe0b2 30%,#fff 60%,#ffe0b2 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerText 4s ease-in-out infinite}
@keyframes shimmerText{0%,100%{background-position:200% 0}50%{background-position:0% 0}}
.header p{font-size:var(--font-lg);color:rgba(255,255,255,.9);margin-top:6px}
.combo-display{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:var(--font-xl);font-weight:900;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,.5);opacity:0;transition:all .3s}
.combo-display.show{opacity:1;animation:comboPulse .5s ease,colorCycle 2s linear infinite}
@keyframes comboPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.3)}}
@keyframes colorCycle{0%{color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,.6)}25%{color:#FF6B6B;text-shadow:0 0 10px rgba(255,107,107,.6)}50%{color:#6C5CE7;text-shadow:0 0 10px rgba(108,92,231,.6)}75%{color:#52C41A;text-shadow:0 0 10px rgba(82,196,26,.6)}100%{color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,.6)}}
.child-mode .header{background:linear-gradient(135deg,#FF6348,#FF9FF3,#FFC2D1,#87CEEB);background-size:400% 400%;animation:gs 8s ease infinite}
@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* Difficulty buttons */
.diff-btn{padding:8px 18px;font-size:var(--font);font-weight:700;border:2px solid var(--border);border-radius:50px;background:var(--card);cursor:pointer;transition:all .3s;font-family:inherit;color:var(--text2)}
.diff-btn:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 0 8px var(--glow)}
.diff-btn.active{border-color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-end));color:#fff;box-shadow:0 0 12px var(--glow)}
/* Controls */
.bar{max-width:800px;margin:14px auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:12px 22px;font-size:var(--font);font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;transition:all .3s;font-family:inherit;position:relative;overflow:hidden}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary-end));color:#fff}.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--glow)}
.btn-p::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 45%,rgba(255,255,255,.25) 50%,transparent 55%);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.btn-s{background:var(--border);color:var(--text)}
.child-mode .btn-p{background:linear-gradient(135deg,#FF6348,#FF9FF3);border-radius:50px}
.mode-btn,.game-tab{padding:10px 16px;border:3px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:var(--font);font-weight:700;transition:all .3s;display:flex;align-items:center;gap:6px}
.mode-btn.active,.game-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.mode-btn.active{box-shadow:inset 0 0 12px var(--glow),0 0 8px var(--glow)}
.game-tab{font-size:15px;padding:8px 12px;border-radius:20px;border-width:2px;position:relative}
.game-tab::before{content:'';position:absolute;bottom:-2px;left:20%;right:20%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-end));opacity:0;transition:opacity .3s,box-shadow .3s}
.game-tab.active::before{opacity:1;box-shadow:0 0 10px var(--glow),0 0 20px var(--glow)}
.game-tab:hover{transform:translateY(-1px);box-shadow:0 0 12px var(--glow),0 0 24px var(--glow);border-color:var(--primary)}
/* Area & Stats */
.area{max-width:800px;margin:0 auto;padding:0 16px 40px}
.stats{display:flex;justify-content:space-around;background:var(--glass);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap;gap:8px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border)}
.stat{text-align:center;transition:transform .2s}.stat-label{font-size:13px;color:var(--text2)}.stat-value{font-size:var(--font-xl);font-weight:700;color:var(--primary)}
.stat.bump{animation:statBump .3s ease}
@keyframes statBump{50%{transform:scale(1.15)}}
/* Board */
.board{display:grid;gap:10px;justify-content:center;margin:14px 0}
.b3{grid-template-columns:repeat(3,96px)}.b4{grid-template-columns:repeat(4,84px)}.b5{grid-template-columns:repeat(5,74px)}
.card{width:100%;aspect-ratio:1;border-radius:var(--radius);cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s;animation:cardEnter .4s ease backwards}
.card:hover{transform:scale(1.05)}
.card:active{transform:scale(.95)}
.cb{position:absolute;inset:0;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;font-weight:700;transition:opacity .25s,transform .25s;z-index:2;background:conic-gradient(from 0deg,var(--primary),var(--primary-end),var(--primary),var(--primary-end),var(--primary));animation:cardSpin 8s linear infinite}
.cb::after{content:'';position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.3)}
@keyframes cardSpin{to{background:conic-gradient(from 360deg,var(--primary),var(--primary-end),var(--primary),var(--primary-end),var(--primary))}}
@keyframes cardEnter{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
.child-mode .cb{background:conic-gradient(from 0deg,#FF6348,#FF9FF3,#FF6348,#FF9FF3,#FF6348);animation:cardSpin 6s linear infinite;border-radius:20px}
.ca{position:absolute;inset:0;border-radius:var(--radius);background:linear-gradient(145deg,#fff 0%,#f8f9ff 100%);border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s;z-index:1;box-shadow:inset 0 2px 8px rgba(108,92,231,.06),0 4px 16px rgba(0,0,0,.08)}
.child-mode .ca{border:3px solid #FFD1DC;border-radius:20px;background:linear-gradient(145deg,#fff 0%,#fff5f8 100%)}
.card.flipped .cb,.card.matched .cb{opacity:0;transform:scale(.8)}
.card.flipped .ca,.card.matched .ca{opacity:1;transform:scale(1);z-index:3}
.card.flipped .ca{border-color:var(--primary);box-shadow:inset 0 0 20px rgba(108,92,231,.05),0 0 20px var(--glow),0 4px 16px rgba(0,0,0,.1)}
.child-mode .card.flipped .ca{border-color:#FF6348;box-shadow:inset 0 0 20px rgba(255,99,72,.05),0 0 20px rgba(255,99,72,.3),0 4px 16px rgba(0,0,0,.1)}
.card.matched .ca{background:linear-gradient(145deg,#E8FFE8 0%,#d4f7d4 100%);border-color:#52C41A;box-shadow:inset 0 0 24px rgba(82,196,26,.1),0 0 24px rgba(82,196,26,.2)}
.card.matched{animation:mp .5s ease;pointer-events:none}
.card.matched .ca::after{content:'';position:absolute;inset:-2px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(82,196,26,.15),transparent 60%);pointer-events:none;animation:matchShine 1.5s ease forwards}
@keyframes matchShine{0%{opacity:1}100%{opacity:0}}
@keyframes mp{50%{transform:scale(1.08)}}
/* Sequence */
.seq-display{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:70px}
.seq-item{width:68px;height:68px;border-radius:var(--radius);background:linear-gradient(145deg,var(--primary-light),#fff);border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:34px;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.seq-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-end));transform:scale(1.15);box-shadow:0 4px 24px var(--glow);color:#fff;border-color:transparent}
.child-mode .seq-item{border-color:#FF6B9D;background:#FFE4ED;border-radius:20px}
.child-mode .seq-item.active{background:#FF6B9D;color:#fff}
.seq-input{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.seq-btn{width:68px;height:68px;border-radius:var(--radius);background:linear-gradient(145deg,#fff,#f8f9ff);border:3px solid var(--border);font-size:34px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.child-mode .seq-btn{border-radius:20px;border-color:#FFD1DC;background:linear-gradient(145deg,#fff,#fff5f8)}
.seq-btn:hover{border-color:var(--primary);transform:scale(1.08);box-shadow:0 4px 16px var(--glow)}
.seq-btn.correct{border-color:var(--success);background:linear-gradient(135deg,#E8FFE8,#d4f7d4);animation:mp .4s ease;box-shadow:0 4px 16px rgba(82,196,26,.3)}
.seq-btn.wrong{border-color:var(--danger);animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lives{display:flex;gap:6px;justify-content:center;font-size:28px}
/* Number flash */
.num-grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center;margin:14px 0}
.num-cell{width:80px;height:80px;border-radius:var(--radius);background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;cursor:pointer;transition:all .2s;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.child-mode .num-cell{border-radius:16px}
.num-cell.visible{background:linear-gradient(135deg,var(--primary),var(--primary-end));color:#fff;border-color:transparent;box-shadow:0 4px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.2);transform:scale(1.05)}
.num-cell.active{background:linear-gradient(135deg,var(--success),#2ecc71);color:#fff;border-color:transparent;box-shadow:0 4px 20px rgba(82,196,26,.4);animation:mp .3s ease}
.num-cell.wrong{animation:shake .4s ease;border-color:var(--danger)}
.num-cell.matched{background:#E8FFE8;border-color:var(--success);opacity:.6;pointer-events:none}
.flash-hint{text-align:center;padding:16px;background:linear-gradient(135deg,var(--warning),#FFE58F);color:#333;border-radius:var(--radius);font-size:var(--font-lg);font-weight:700;margin-bottom:12px;animation:pulse 1s ease infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
/* Color */
.color-row{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.color-btn{width:72px;height:72px;border-radius:50%;cursor:pointer;border:4px solid transparent;transition:all .2s;font-size:28px}
.color-btn:hover{transform:scale(1.12)}
.color-btn.glow{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.6);transform:scale(1.1)}
.color-btn.matched{opacity:.3;pointer-events:none}
.color-btn.wrong{animation:shake .4s ease}
/* Word */
.word-section{text-align:center;margin:10px 0}
.word-label{font-size:var(--font);font-weight:700;color:var(--text2);margin-bottom:8px}
.word-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word-card{width:78px;height:68px;border-radius:var(--radius);background:linear-gradient(145deg,#fff,#f8f9ff);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;font-size:var(--font);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.child-mode .word-card{border-radius:16px;background:linear-gradient(145deg,#fff,#fff5f8)}
.word-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 16px var(--glow)}
.word-card.selected{background:linear-gradient(135deg,var(--primary),var(--primary-end));color:#fff;border-color:transparent;transform:scale(1.05);box-shadow:0 4px 20px var(--glow)}
.child-mode .word-card.selected{background:linear-gradient(135deg,#FF6348,#FF9FF3);border-color:transparent}
.word-card.matched{background:linear-gradient(145deg,#E8FFE8,#d4f7d4);border-color:var(--success);opacity:.5;pointer-events:none;box-shadow:0 2px 12px rgba(82,196,26,.2)}
.word-card.wrong{animation:shake .4s ease;border-color:var(--danger)}
.word-card.hint-glow{border-color:var(--warning);box-shadow:0 0 12px rgba(250,173,20,.5)}
.word-divider{text-align:center;font-size:22px;color:var(--text2);margin:6px 0}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.overlay.show{display:flex}
.r-card{background:var(--glass);border-radius:var(--radius);padding:36px;text-align:center;max-width:380px;width:90%;animation:fi .4s ease;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);position:relative;overflow:hidden}
@keyframes fi{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.r-icon{font-size:72px;margin-bottom:12px;animation:iconEnter .6s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes iconEnter{0%{opacity:0;transform:scale(0) rotate(-180deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
.r-card::before,.r-card::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;animation:confettiFall 2s linear infinite;pointer-events:none}
.r-card::before{left:20%;top:-8px;background:var(--primary);animation-duration:1.8s;animation-delay:0s}
.r-card::after{right:25%;top:-8px;background:var(--primary-end);animation-duration:2.2s;animation-delay:.6s}
@keyframes confettiFall{0%{top:-8px;opacity:1;transform:translateX(0) rotate(0deg)}100%{top:110%;opacity:0;transform:translateX(30px) rotate(720deg)}}
.r-title{font-size:var(--font-xl);font-weight:700;margin-bottom:10px;color:var(--success)}
.r-detail{font-size:var(--font-lg);font-weight:700;color:var(--primary);margin-bottom:20px}
.r-stars{font-size:32px;margin-bottom:16px}
/* Settings */
.sp{max-width:800px;margin:0 auto 14px;padding:0 16px}
.st{background:var(--glass);padding:12px 16px;border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border)}
.sc{background:var(--glass);padding:16px;border-radius:0 0 var(--radius) var(--radius);display:none;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-top:none}.sc.show{display:block}
.sr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.sr:last-child{border-bottom:none}
.tog{position:relative;width:50px;height:28px;cursor:pointer}.tog input{opacity:0;width:0;height:0}
.tog-s{position:absolute;inset:0;background:#ccc;border-radius:28px;transition:.3s}
.tog-s:before{content:'';position:absolute;width:20px;height:20px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.3s}
.tog input:checked+.tog-s{background:var(--primary)}.tog input:checked+.tog-s:before{transform:translateX(22px)}
.vb{position:fixed;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:50}
.vb.spk{animation:pu 1s ease infinite}@keyframes pu{50%{transform:scale(1.06)}}
.hint-text{text-align:center;color:var(--text2);font-size:var(--font);margin:10px 0;padding:10px;background:var(--primary-light);border-radius:var(--radius)}
.child-mode .hint-text{background:#FFE4ED}
.cheer{text-align:center;color:var(--primary);font-size:var(--font-lg);font-weight:700;min-height:32px;margin:6px 0;transition:opacity .3s}
/* Dual PK */
.pk-scores{display:flex;justify-content:center;gap:40px;margin:10px 0}
.pk-score{text-align:center;padding:12px 24px;border-radius:var(--radius);background:var(--card);border:3px solid var(--border);transition:all .3s}
.pk-score.active{border-color:var(--primary);background:var(--primary-light);box-shadow:0 4px 16px rgba(74,144,217,.3)}
.pk-score .pk-label{font-size:14px;color:var(--text2);font-weight:700}
.pk-score .pk-value{font-size:var(--font-xl);font-weight:900;color:var(--primary)}
.child-mode .pk-score.active{border-color:#FF6B9D;background:#FFE4ED}
.pk-turn{text-align:center;font-size:var(--font-lg);font-weight:700;color:var(--primary);margin:8px 0;min-height:36px}
/* Pet buddy */
.pet-buddy{position:fixed;bottom:80px;left:20px;width:80px;height:80px;z-index:50;cursor:pointer;transition:all .3s;display:none}
.pet-buddy.show{display:block;animation:petEnter .6s ease forwards}
@keyframes petEnter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.pet-emoji{font-size:56px;text-align:center;animation:petBounce 2s ease infinite;display:block}
@keyframes petBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pet-bubble{position:absolute;bottom:70px;left:0;background:#fff;border-radius:16px;padding:8px 12px;font-size:14px;white-space:nowrap;opacity:0;transform:scale(.8);transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
.pet-bubble.show{opacity:1;transform:scale(1)}
.pet-bubble::before{content:'';position:absolute;inset:-3px;border-radius:18px;background:linear-gradient(135deg,#FF6B6B,#FFD700,#52C41A,#6C5CE7,#FF9FF3);z-index:-1}
.pet-bubble::after{content:'';position:absolute;bottom:-10px;left:20px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #FFD700}
.pet-level{position:absolute;top:-4px;right:-4px;background:var(--warning);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pet-crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:20px;opacity:0;transition:opacity .3s}
.pet-crown.show{opacity:1}
/* Theme selector */
.theme-row{display:flex;gap:10px;flex-wrap:wrap}
.theme-btn{width:48px;height:48px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.theme-btn:hover{transform:scale(1.1)}
.theme-btn.active{border-color:var(--text);box-shadow:0 0 0 3px var(--primary)}
.theme-btn::after{content:'';position:absolute;inset:4px;border-radius:50%}
.theme-default::after{background:linear-gradient(135deg,#6C5CE7,#a29bfe)}
.theme-spring::after{background:linear-gradient(135deg,#D42424,#FFD700)}
.theme-midautumn::after{background:linear-gradient(135deg,#1E3A5F,#D4AF37)}
/* Theme overrides */
body.theme-spring{--primary:#D42424;--primary-light:#FFE4E4;--primary-end:#FFD700;--success:#228B22;--warning:#FF8C00;--bg:#FFF8F0;--glow:rgba(212,36,36,.4);--glass:rgba(255,255,255,.6);--glass-border:rgba(255,215,0,.3)}
body.theme-midautumn{--primary:#1E3A5F;--primary-light:#E8E4D9;--primary-end:#D4AF37;--success:#D4AF37;--warning:#CD853F;--bg:#F5F0E8;--glow:rgba(30,58,95,.4);--glass:rgba(255,255,255,.55);--glass-border:rgba(212,175,55,.3)}
@media(max-width:640px){:root{--font:16px;--font-lg:20px;--font-xl:24px}.b4{grid-template-columns:repeat(4,66px)}.b5{grid-template-columns:repeat(5,58px)}.seq-item,.seq-btn{width:56px;height:56px;font-size:26px}.num-grid{grid-template-columns:repeat(4,66px)}.num-cell{width:66px;height:66px}.color-btn{width:60px;height:60px}.word-card{width:66px;height:58px;font-size:16px}.combo-display{font-size:20px;right:10px}.pet-buddy{width:60px;height:60px;bottom:70px;left:10px}.pet-emoji{font-size:40px}}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="particles" id="particles"></div>
<div class="combo-bar" id="comboBar"></div>

<header class="header">
  <h1>乐忆 MemoryFun</h1>
  <p>记忆力训练游戏合集</p>
  <div class="combo-display" id="comboDisplay"></div>
</header>

<div class="bar">
  <button class="mode-btn active" data-mode="elderly" onclick="switchMode('elderly')">👴 老人模式</button>
  <button class="mode-btn" data-mode="child" onclick="switchMode('child')">👶 儿童模式</button>
</div>

<div class="sp">
  <div class="st" onclick="toggleS()">⚙️ 设置 <span id="arrow">▼</span></div>
  <div class="sc" id="sContent">
    <div class="sr"><span>👁️ 护眼模式</span><label class="tog"><input type="checkbox" id="eyeCare" onchange="toggleEC()"><span class="tog-s"></span></label></div>
    <div class="sr"><span>🔊 语音提示</span><label class="tog"><input type="checkbox" id="voiceOn" checked><span class="tog-s"></span></label></div>
    <div class="sr"><span>🔤 字体</span><div style="display:flex;gap:6px;align-items:center"><button class="btn btn-s" style="padding:4px 12px" onclick="chFont(-1)">−</button><span id="fv" style="min-width:36px;text-align:center;font-weight:700">标准</span><button class="btn btn-s" style="padding:4px 12px" onclick="chFont(1)">+</button></div></div>
    <div class="sr"><span>🎨 节日主题</span><div class="theme-row"><button class="theme-btn theme-default active" onclick="setTheme('default')" title="默认"></button><button class="theme-btn theme-spring" onclick="setTheme('spring')" title="春节"></button><button class="theme-btn theme-midautumn" onclick="setTheme('midautumn')" title="中秋"></button></div></div>
  </div>
</div>

<!-- Pet Buddy -->
<div class="pet-buddy" id="petBuddy" onclick="petInteract()">
  <div class="pet-crown" id="petCrown">👑</div>
  <div class="pet-level" id="petLevel">1</div>
  <span class="pet-emoji" id="petEmoji">🐱</span>
  <div class="pet-bubble" id="petBubble">加油哦！</div>
</div>

<div class="bar" id="gameTabs">
  <button class="game-tab active" data-game="match" onclick="switchGame('match')">🃏 配对翻牌</button>
  <button class="game-tab" data-game="sequence" onclick="switchGame('sequence')">🔢 顺序记忆</button>
  <button class="game-tab" data-game="flash" onclick="switchGame('flash')">⚡ 闪现记忆</button>
  <button class="game-tab" data-game="color" onclick="switchGame('color')">🎨 色彩记忆</button>
  <button class="game-tab" data-game="word" onclick="switchGame('word')">📖 文字配对</button>
  <button class="game-tab" data-game="dual" onclick="switchGame('dual')">🆚 双人PK</button>
</div>

<div class="area" id="gc"></div>

<div class="overlay" id="overlay">
  <div class="r-card">
    <div class="r-icon" id="rIcon">🎉</div>
    <div class="r-title" id="rTitle">太棒了！</div>
    <div class="r-stars" id="rStars"></div>
    <div class="r-detail" id="rDetail"></div>
    <button class="btn btn-p" onclick="closeR();curGame.start()">🔄 再来一局</button>
  </div>
</div>

<button class="vb" id="vBtn" onclick="speakNow()">🔊</button>

<script>
let mode='elderly',curGameName='match',curGame=null,fontLv=1,combo=0;
const fL=['小','标准','大','特大'],fS=[{b:'15px',l:'17px',x:'22px'},{b:'18px',l:'22px',x:'28px'},{b:'20px',l:'24px',x:'32px'},{b:'22px',l:'26px',x:'38px'}];
const emojis={elderly:['🌸','🍁','🌴','🌻','🌹','🌺','🍎','🍊','🍋','🍇','🍓','🍑','🐱','🐶','🐰','🐻','🐼','🐨'],child:['🦄','🐱','🐶','🐰','🦊','🐸','🐼','🐨','🌟','🌈','🎈','🎁','🍕','🍰','🚗','🎪']};
const cheerElderly=['好眼力！','记性真好！','继续加油！','厉害！','漂亮！','真棒！','不错不错！','好样的！'];
const cheerChild=['太厉害啦！','你超棒！','继续冲！','好耶！','无敌了！','天才！','满分！','牛牛牛！'];
const wordSets={elderly:[['苹果','🍎'],['香蕉','🍌'],['葡萄','🍇'],['西瓜','🍉'],['桃子','🍑'],['橘子','🍊'],['草莓','🍓'],['樱桃','🍒'],['芒果','🥭'],['梨','🍐']],child:[['猫咪','🐱'],['小狗','🐶'],['兔子','🐰'],['青蛙','🐸'],['熊猫','🐼'],['狐狸','🦊'],['小马','🐴'],['小鸟','🐦'],['小鱼','🐟'],['蝴蝶','🦋']]};

function switchMode(m){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.body.classList.toggle('child-mode',m==='child');updatePet();speak(m==='elderly'?'已切换到老人模式':'已切换到儿童模式！');if(curGame)curGame.start()}
function toggleS(){document.getElementById('sContent').classList.toggle('show');document.getElementById('arrow').textContent=document.getElementById('sContent').classList.contains('show')?'▲':'▼'}
function toggleEC(){document.body.classList.toggle('eye-care')}
function chFont(d){fontLv=Math.max(0,Math.min(3,fontLv+d));const s=fS[fontLv];document.documentElement.style.setProperty('--font',s.b);document.documentElement.style.setProperty('--font-lg',s.l);document.documentElement.style.setProperty('--font-xl',s.x);document.getElementById('fv').textContent=fL[fontLv]}

function switchGame(name){curGameName=name;document.querySelectorAll('.game-tab').forEach(t=>t.classList.toggle('active',t.dataset.game===name));clearInterval(window._timer);combo=0;updateCombo();
if(name==='match')curGame=new MatchGame();else if(name==='sequence')curGame=new SequenceGame();else if(name==='flash')curGame=new FlashGame();else if(name==='color')curGame=new ColorGame();else if(name==='word')curGame=new WordGame();else if(name==='dual')curGame=new DualGame();curGame.start()}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== Effects =====
function spawnParticles(x,y,emojis,count){const p=document.getElementById('particles');for(let i=0;i<count;i++){const el=document.createElement('div');el.className='particle';el.textContent=emojis[Math.floor(Math.random()*emojis.length)];el.style.left=(x+Math.random()*60-30)+'px';el.style.top=(y+Math.random()*20-10)+'px';el.style.animationDuration=(0.8+Math.random()*0.6)+'s';p.appendChild(el);setTimeout(()=>el.remove(),1200)}}
function floatScore(text,x,y){const el=document.createElement('div');el.className='float-score';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}
function shakeScreen(){document.body.classList.add('screen-shake');setTimeout(()=>document.body.classList.remove('screen-shake'),300)}
function showCheer(el,text){el.textContent=text;el.style.opacity='1';setTimeout(()=>{el.style.opacity='0'},1500)}
function addCombo(){combo++;updateCombo()}
function resetCombo(){combo=0;updateCombo()}
function updateCombo(){const d=document.getElementById('comboDisplay'),b=document.getElementById('comboBar');if(combo>=3){d.textContent=combo+'x 连击！';d.classList.add('show');b.classList.add('active')}else{d.classList.remove('show');b.classList.remove('active')}}
function getCheer(){return mode==='elderly'?cheerElderly[Math.floor(Math.random()*cheerElderly.length)]:cheerChild[Math.floor(Math.random()*cheerChild.length)]}
function bumpStat(id){const el=document.getElementById(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

function speak(t){if(!document.getElementById('voiceOn').checked)return;if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=mode==='elderly'?0.8:1;u.pitch=mode==='child'?1.3:1;u.onstart=()=>document.getElementById('vBtn').classList.add('spk');u.onend=()=>document.getElementById('vBtn').classList.remove('spk');speechSynthesis.speak(u)}
function speakNow(){speak('乐忆MemoryFun记忆力训练游戏，选择不同的游戏来锻炼大脑！')}

// ===== Theme =====
function setTheme(t){
  document.body.classList.remove('theme-spring','theme-midautumn');
  if(t!=='default')document.body.classList.add('theme-'+t);
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.theme-btn.theme-'+t).classList.add('active');
  localStorage.setItem('mf_theme',t);
  const names={default:'默认主题',spring:'春节主题',midautumn:'中秋主题'};
  speak('已切换到'+names[t]);
}

// ===== Pet Buddy =====
const petEmojis=['🐱','🐶','🐰','🦊','🐼'];
const petNames=['小咪','旺财','兔宝','阿狸','胖达'];
const petTalks={
  child:['加油哦！','你超棒！','继续冲！','好耶！','满分！','天才！','牛牛牛！','无敌了！'],
  win:['通关啦！','太厉害了！','给你点赞！','棒棒哒！','好厉害呀！'],
  levelup:['升级啦！','我变大啦！','新帽子！','更厉害了！']
};
function loadPet(){
  const saved=localStorage.getItem('mf_pet');
  return saved?JSON.parse(saved):{level:1,wins:0,emojiIdx:0};
}
function savePet(p){localStorage.setItem('mf_pet',JSON.stringify(p))}
function updatePet(){
  const p=loadPet();
  const pet=document.getElementById('petBuddy');
  const crown=document.getElementById('petCrown');
  const levelEl=document.getElementById('petLevel');
  const emojiEl=document.getElementById('petEmoji');
  if(mode==='child'){pet.classList.add('show')}else{pet.classList.remove('show');return}
  emojiEl.textContent=petEmojis[p.emojiIdx];
  levelEl.textContent=p.level;
  crown.classList.toggle('show',p.level>=3);
  if(p.level>=5){emojiEl.style.fontSize='64px';crown.textContent='👑'}
  else if(p.level>=3){emojiEl.style.fontSize='56px';crown.textContent='⭐'}
}
function petWin(){
  const p=loadPet();p.wins++;
  if(p.wins>=3&&p.level<5){p.wins=0;p.level++;p.emojiIdx=Math.min(p.emojiIdx+1,petEmojis.length-1);petSpeak(petTalks.levelup[Math.floor(Math.random()*petTalks.levelup.length)],true)}
  else{petSpeak(petTalks.win[Math.floor(Math.random()*petTalks.win.length)])}
  savePet(p);updatePet();
}
function petSpeak(text,isLevelUp){
  const bubble=document.getElementById('petBubble');
  bubble.textContent=text;bubble.classList.add('show');
  if(isLevelUp){document.getElementById('petEmoji').style.animation='none';setTimeout(()=>document.getElementById('petEmoji').style.animation='',100)}
  setTimeout(()=>bubble.classList.remove('show'),2500);
}
function petInteract(){
  const text=mode==='child'?petTalks.child[Math.floor(Math.random()*petTalks.child.length)]:'加油！';
  petSpeak(text);const p=loadPet();document.getElementById('petEmoji').style.transform='scale(1.2)';setTimeout(()=>document.getElementById('petEmoji').style.transform='',200);
}

function showResult(icon,title,stars,detail){document.getElementById('rIcon').textContent=icon;document.getElementById('rTitle').textContent=title;document.getElementById('rStars').textContent=stars;document.getElementById('rDetail').textContent=detail;setTimeout(()=>{document.getElementById('overlay').classList.add('show');petWin()},300)}
function closeR(){document.getElementById('overlay').classList.remove('show')}
function saveBest(k,v){const p=localStorage.getItem('mf_'+k);if(!p||v>parseInt(p)){localStorage.setItem('mf_'+k,v);return true}return false}
function getBest(k){return localStorage.getItem('mf_'+k)||0}

/* ===== GAME 1: Match (with combo) ===== */
class MatchGame{
  constructor(){this.name='match'}
  start(){
    clearInterval(window._timer);this.moves=0;this.matched=0;this.pairs=6;this.flipped=[];this.locked=false;this.secs=0;combo=0;updateCombo();
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">步数</div><div class="stat-value" id="g1-moves">0</div></div><div class="stat"><div class="stat-label">配对</div><div class="stat-value" id="g1-pairs">0/${this.pairs}</div></div><div class="stat"><div class="stat-label">用时</div><div class="stat-value" id="g1-time">0:00</div></div><div class="stat"><div class="stat-label">最高分</div><div class="stat-value" id="g1-best">${getBest('match_'+mode)||'--'}</div></div></div>
    <div class="cheer" id="g1-cheer"></div><div class="board b3" id="g1-board"></div>
    <div class="bar"><button class="diff-btn active" data-d="easy" onclick="curGame.setDiff('easy')">简单(3x4)</button><button class="diff-btn" data-d="medium" onclick="curGame.setDiff('medium')">中等(4x4)</button><button class="diff-btn" data-d="hard" onclick="curGame.setDiff('hard')">困难(4x5)</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-p" onclick="curGame.start()">🔄 重新开始</button></div>`;
    this.build();speak(mode==='elderly'?'配对翻牌：找出所有相同的卡片':'配对翻牌：找出所有一样的卡片！');
  }
  setDiff(d){const map={easy:{p:6,c:'b3'},medium:{p:8,c:'b4'},hard:{p:10,c:'b5'}};this.pairs=map[d].p;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.toggle('active',b.dataset.d===d));document.getElementById('g1-board').className='board '+map[d].c;document.getElementById('g1-pairs').textContent='0/'+this.pairs;this.build()}
  build(){
    this.moves=0;this.matched=0;this.flipped=[];this.locked=false;this.secs=0;combo=0;updateCombo();clearInterval(window._timer);
    document.getElementById('g1-moves').textContent='0';document.getElementById('g1-time').textContent='0:00';
    const es=shuffle([...(mode==='elderly'?emojis.elderly:emojis.child)]).slice(0,this.pairs);
    const items=[];es.forEach((e,i)=>{items.push({id:i,emoji:e});items.push({id:i,emoji:e})});
    const shuffled=shuffle(items);const board=document.getElementById('g1-board');board.innerHTML='';
    shuffled.forEach(item=>{const card=document.createElement('div');card.className='card';card.dataset.id=item.id;card.innerHTML=`<div class="cb"></div><div class="ca">${item.emoji}</div>`;card.onclick=(e)=>this.flip(card,e);board.appendChild(card)});
  }
  flip(card,e){
    if(this.locked||card.classList.contains('flipped')||card.classList.contains('matched')||this.flipped.length>=2)return;
    card.classList.add('flipped');this.flipped.push(card);
    if(this.flipped.length===2){
      this.moves++;document.getElementById('g1-moves').textContent=this.moves;bumpStat('g1-moves');
      if(!window._timer){window._timer=setInterval(()=>{this.secs++;const m=Math.floor(this.secs/60),s=this.secs%60;document.getElementById('g1-time').textContent=m+':'+(s<10?'0':'')+s},1000)}
      const[a,b]=this.flipped;
      if(a.dataset.id===b.dataset.id){
        this.locked=true;addCombo();
        setTimeout(()=>{
          a.classList.add('matched');b.classList.add('matched');
          this.matched++;document.getElementById('g1-pairs').textContent=this.matched+'/'+this.pairs;bumpStat('g1-pairs');
          const rect=a.getBoundingClientRect();const pts=combo>=3?combo*15:10;
          spawnParticles(rect.left+rect.width/2,rect.top,mode==='elderly'?emojis.elderly:emojis.child,combo>=3?8:4);
          floatScore('+'+pts,rect.left+rect.width/2,rect.top);
          showCheer(document.getElementById('g1-cheer'),combo>=3?getCheer()+' (x'+combo+')':getCheer());
          this.flipped=[];this.locked=false;if(this.matched===this.pairs)this.win()
        },350);
      }else{
        this.locked=true;resetCombo();
        setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');this.flipped=[];this.locked=false;shakeScreen()},600);
      }
    }
  }
  win(){
    clearInterval(window._timer);const t=document.getElementById('g1-time').textContent;
    const score=Math.max(100,Math.round(1000*(this.pairs/this.moves)*(30/Math.max(this.secs,1))));
    const stars=this.moves<=this.pairs*2?3:this.moves<=this.pairs*3?2:1;
    const titles=mode==='elderly'?['继续努力！','很不错！','太棒了！']:['加油哦！','真厉害！','超级棒！'];
    showResult('🎉',titles[stars-1],'⭐'.repeat(stars),'步数：'+this.moves+'  用时：'+t+'  得分：'+score);
    if(saveBest('match_'+mode,score))document.getElementById('g1-best').textContent=score;
    speak(titles[stars-1]+'！得分'+score);
  }
}

/* ===== GAME 2: Sequence (Simon Says style) ===== */
class SequenceGame{
  constructor(){this.name='sequence'}
  start(){
    clearInterval(window._timer);this.len=3;this.round=1;this.score=0;this.lives=3;this.seq=[];this.input=[];this.phase='ready';combo=0;updateCombo();
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">轮次</div><div class="stat-value" id="g2-round">1</div></div><div class="stat"><div class="stat-label">长度</div><div class="stat-value" id="g2-len">3</div></div><div class="stat"><div class="stat-label">得分</div><div class="stat-value" id="g2-score">0</div></div><div class="stat"><div class="stat-label">生命</div><div class="stat-value"><div class="lives" id="g2-lives">❤️❤️❤️</div></div></div></div>
    <div class="cheer" id="g2-cheer"></div><div class="hint-text" id="g2-hint">👆 点击「开始」记住亮起的顺序</div>
    <div class="seq-display" id="g2-display"></div><div class="seq-input" id="g2-input"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-p" onclick="curGame.play()">▶️ 开始挑战</button></div>`;
    this.buildInput();speak(mode==='elderly'?'顺序记忆：记住亮起的顺序':'顺序记忆：记住亮起的顺序！');
  }
  buildInput(){
    const pool=mode==='elderly'?emojis.elderly:emojis.child;
    const extra=shuffle([...pool].filter(e=>!this.seq.includes(e))).slice(0,Math.max(0,8-this.seq.length));
    const btns=shuffle([...this.seq,...extra]);
    const inp=document.getElementById('g2-input');inp.innerHTML='';
    btns.forEach(e=>{const b=document.createElement('button');b.className='seq-btn';b.textContent=e;b.dataset.emoji=e;b.onclick=()=>this.pick(b);inp.appendChild(b)});
  }
  play(){
    this.phase='showing';document.querySelectorAll('.seq-btn').forEach(b=>{b.classList.remove('correct','wrong')});
    this.input=[];this.seq=shuffle([...(mode==='elderly'?emojis.elderly:emojis.child)]).slice(0,this.len);
    this.buildInput();
    const disp=document.getElementById('g2-display');disp.innerHTML='';
    document.getElementById('g2-hint').textContent='👀 认真看...';
    this.seq.forEach((e,i)=>{
      const d=document.createElement('div');d.className='seq-item';d.textContent=e;disp.appendChild(d);
      setTimeout(()=>{d.classList.add('active')},i*700+300);
      setTimeout(()=>{d.classList.remove('active')},i*700+700);
    });
    setTimeout(()=>{disp.innerHTML='';this.phase='input';document.getElementById('g2-hint').textContent='👆 按刚才的顺序点击';speak('请按顺序点击')},this.seq.length*700+1200);
  }
  pick(btn){
    if(this.phase!=='input')return;btn.classList.add('correct');this.input.push(btn.dataset.emoji);
    const disp=document.getElementById('g2-display');
    const d=document.createElement('div');d.className='seq-item active';d.textContent=btn.dataset.emoji;disp.appendChild(d);
    if(this.input.length<this.seq.length)return;
    this.phase='check';
    const correct=this.input.every((e,i)=>e===this.seq[i]);
    if(correct){
      addCombo();const pts=this.len*(combo>=3?2:1)*10;this.score+=pts;
      document.getElementById('g2-score').textContent=this.score;bumpStat('g2-score');
      this.round++;this.len=Math.min(10,this.len+1);
      document.getElementById('g2-round').textContent=this.round;document.getElementById('g2-len').textContent=this.len;
      document.getElementById('g2-hint').textContent='✅ 正确！ +'+pts+'分';
      showCheer(document.getElementById('g2-cheer'),getCheer()+(combo>=3?' x'+combo:''));
      setTimeout(()=>{this.buildInput();speak('第'+this.round+'轮')},1200);
    }else{
      resetCombo();this.lives--;
      document.getElementById('g2-lives').textContent='❤️'.repeat(this.lives)+'🖤'.repeat(3-this.lives);
      shakeScreen();
      if(this.lives<=0){
        document.getElementById('g2-hint').textContent='💔 游戏结束！最终得分：'+this.score;
        showResult('💪','游戏结束','⭐'.repeat(this.score>200?3:this.score>100?2:1),'轮次：'+this.round+'  得分：'+this.score);
        speak('游戏结束，得分'+this.score);this.phase='done';return;
      }
      document.getElementById('g2-hint').textContent='❌ 顺序不对！剩余❤️x'+this.lives;shakeScreen();
      setTimeout(()=>{document.querySelectorAll('.seq-btn').forEach(b=>b.classList.remove('correct','wrong'));disp.innerHTML='';this.input=[];this.phase='input'},800);
      speak('不对，再试一次');
    }
  }
}

/* ===== GAME 3: Flash Memory (new!) ===== */
class FlashGame{
  constructor(){this.name='flash'}
  start(){
    clearInterval(window._timer);this.score=0;this.found=0;this.pairs=6;this.first=null;this.locked=false;this.level=1;this.flashTime=2000;combo=0;updateCombo();
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">找到</div><div class="stat-value" id="g3-found">0/${this.pairs}</div></div><div class="stat"><div class="stat-label">关卡</div><div class="stat-value" id="g3-level">1</div></div><div class="stat"><div class="stat-label">得分</div><div class="stat-value" id="g3-score">0</div></div><div class="stat"><div class="stat-label">闪现时间</div><div class="stat-value" id="g3-flash">${(this.flashTime/1000).toFixed(1)}s</div></div></div>
    <div class="cheer" id="g3-cheer"></div><div class="flash-hint" id="g3-hint">⚡ 数字即将闪现，做好准备！</div>
    <div class="num-grid" id="g3-grid"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-p" onclick="curGame.start()">🔄 重新开始</button></div>`;
    this.build();speak(mode==='elderly'?'闪现记忆：记住闪现的数字位置':'闪现记忆：记住数字位置！');
  }
  build(){
    this.found=0;this.first=null;this.locked=false;clearInterval(window._timer);
    document.getElementById('g3-found').textContent='0/'+this.pairs;document.getElementById('g3-score').textContent=this.score;
    document.getElementById('g3-flash').textContent=(this.flashTime/1000).toFixed(1)+'s';
    document.getElementById('g3-hint').textContent='⚡ 数字即将闪现，做好准备！';
    document.querySelectorAll('.num-cell').forEach(c=>c.style.pointerEvents='none');
    const nums=[];for(let i=1;i<=this.pairs;i++){nums.push(i);nums.push(i)}
    const shuffled=shuffle(nums);const grid=document.getElementById('g3-grid');grid.innerHTML='';
    shuffled.forEach(n=>{const cell=document.createElement('div');cell.className='num-cell visible';cell.textContent=n;cell.dataset.num=n;cell.onclick=()=>this.flip(cell);grid.appendChild(cell)});
    setTimeout(()=>{grid.querySelectorAll('.num-cell').forEach(c=>c.classList.remove('visible'));
      document.getElementById('g3-hint').textContent='👆 数字消失了！找出相同的数字配对';
      document.querySelectorAll('.num-cell').forEach(c=>c.style.pointerEvents='auto');
      speak('开始找配对！');
    },this.flashTime);
  }
  flip(cell){
    if(this.locked||cell.classList.contains('matched')||cell.classList.contains('active'))return;
    cell.classList.add('active');
    if(!this.first){this.first=cell;return}
    const a=this.first,b=cell;
    if(a.dataset.num===b.dataset.num){
      a.classList.add('matched');b.classList.add('matched');a.classList.remove('active');b.classList.remove('active');
      this.found++;addCombo();const pts=10+(combo>=3?combo*5:0);this.score+=pts;
      document.getElementById('g3-found').textContent=this.found+'/'+this.pairs;
      document.getElementById('g3-score').textContent=this.score;bumpStat('g3-score');
      const rect=b.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top,['✨','⭐','💫'],combo>=3?8:4);
      floatScore('+'+pts,rect.left+rect.width/2,rect.top);
      showCheer(document.getElementById('g3-cheer'),getCheer());this.first=null;
      if(this.found===this.pairs)this.win();
    }else{
      this.locked=true;resetCombo();shakeScreen();
      setTimeout(()=>{a.classList.remove('active');b.classList.remove('active');this.first=null;this.locked=false},500);
    }
  }
  win(){
    this.level++;this.flashTime=Math.max(800,this.flashTime-200);
    document.getElementById('g3-level').textContent=this.level;
    if(this.level%3===0&&this.pairs<10)this.pairs+=2;
    if(this.score>0){speak('进入第'+this.level+'关，闪现时间缩短！');setTimeout(()=>this.build(),800)}
    else{showResult('🎉',mode==='elderly'?'太棒了！':'真厉害！','⭐⭐⭐','得分：'+this.score);speak('得分'+this.score)}
  }
}

/* ===== GAME 4: Color Memory (Simon Says) ===== */
class ColorGame{
  constructor(){this.name='color'}
  start(){
    clearInterval(window._timer);this.score=0;this.round=0;this.seq=[];this.input=[];this.phase='ready';this.totalRounds=8;combo=0;updateCombo();
    const allColors=['#FF6B6B','#4ECDC4','#45B7D1','#FFEAA7','#DDA0DD','#FF8C42'];
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">轮次</div><div class="stat-value" id="g4-round">0/${this.totalRounds}</div></div><div class="stat"><div class="stat-label">得分</div><div class="stat-value" id="g4-score">0</div></div><div class="stat"><div class="stat-label">连击</div><div class="stat-value" id="g4-combo">0</div></div></div>
    <div class="cheer" id="g4-cheer"></div><div class="hint-text" id="g4-hint">👆 记住颜色闪亮的顺序，然后重复</div>
    <div class="color-row" id="g4-colors"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-p" id="g4-start" onclick="curGame.nextRound()">▶️ 开始</button></div>`;
    this.initColors(allColors);speak(mode==='elderly'?'色彩记忆：记住颜色闪亮的顺序':'色彩记忆：记住颜色顺序！');
  }
  initColors(colors){
    const row=document.getElementById('g4-colors');row.innerHTML='';this.colors=colors;
    colors.forEach((c,i)=>{const b=document.createElement('div');b.className='color-btn';b.style.background=c;b.dataset.idx=i;b.onclick=()=>this.pickColor(i);row.appendChild(b)});
  }
  nextRound(){
    if(this.round>=this.totalRounds){this.showFinal();return}
    this.round++;document.getElementById('g4-round').textContent=this.round+'/'+this.totalRounds;
    document.getElementById('g4-start').style.display='none';this.input=[];this.phase='showing';
    const nextColor=this.colors[Math.floor(Math.random()*this.colors.length)];this.seq.push(nextColor);
    document.getElementById('g4-hint').textContent='👀 看好了... (长度: '+this.seq.length+')';
    this.seq.forEach((c,i)=>{setTimeout(()=>{const btn=document.querySelectorAll('.color-btn')[this.colors.indexOf(c)];btn.classList.add('glow');setTimeout(()=>btn.classList.remove('glow'),400)},i*600+200)});
    setTimeout(()=>{this.phase='input';document.getElementById('g4-hint').textContent='👆 按顺序点击颜色';speak('按顺序点击')},this.seq.length*600+600);
  }
  pickColor(idx){
    if(this.phase!=='input')return;
    const btn=document.querySelectorAll('.color-btn')[idx];const color=this.colors[idx];const expected=this.seq[this.input.length];
    const correct=expected===color;
    if(correct){btn.classList.add('glow');setTimeout(()=>btn.classList.remove('glow'),300);this.input.push(color)}
    else{btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),400);shakeScreen()}
    if(this.input.length===this.seq.length){
      this.phase='check';const allCorrect=this.input.every((c,i)=>c===this.seq[i]);
      if(allCorrect){addCombo();const pts=this.seq.length*10*(combo>=3?2:1);this.score+=pts;document.getElementById('g4-score').textContent=this.score;bumpStat('g4-score');document.getElementById('g4-combo').textContent=combo;bumpStat('g4-combo');showCheer(document.getElementById('g4-cheer'),getCheer()+(combo>=3?' x'+combo:''));document.getElementById('g4-hint').textContent='✅ 正确！ +'+pts;setTimeout(()=>document.getElementById('g4-start').style.display='',600)}
      else{resetCombo();document.getElementById('g4-combo').textContent=0;document.getElementById('g4-hint').textContent='❌ 顺序错了，再来！';shakeScreen();setTimeout(()=>{this.input=[];this.phase='input'},800)}
    }
  }
  showFinal(){showResult('🎉','全部完成！','⭐'.repeat(this.score>300?3:this.score>200?2:1),'最终得分：'+this.score);speak('全部完成！得分'+this.score)}
}

/* ===== GAME 5: Word Match ===== */
class WordGame{
  constructor(){this.name='word'}
  start(){
    clearInterval(window._timer);this.moves=0;this.matched=0;this.pairs=8;this.first=null;this.locked=false;this.secs=0;combo=0;updateCombo();
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">配对</div><div class="stat-value" id="g5-pairs">0/${this.pairs}</div></div><div class="stat"><div class="stat-label">用时</div><div class="stat-value" id="g5-time">0:00</div></div><div class="stat"><div class="stat-label">提示</div><div class="stat-value" id="g5-hints">3</div></div></div>
    <div class="cheer" id="g5-cheer"></div>
    <div class="word-section"><div class="word-label">📖 文字</div><div class="word-row" id="g5-text-row"></div></div>
    <div class="word-divider">⬇️ ⬇️ ⬇️ ⬇️ ⬇️ ⬇️ ⬇️ ⬇️</div>
    <div class="word-section"><div class="word-label">🖼️ 表情</div><div class="word-row" id="g5-emoji-row"></div></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-s" onclick="curGame.useHint()">💡 提示</button> <button class="btn btn-p" onclick="curGame.start()">🔄 重新开始</button></div>`;
    this.hints=3;this.build();speak(mode==='elderly'?'文字配对：点击上面的文字，再找到下面配对的表情':'文字配对：点击文字找到配对的表情！');
  }
  build(){
    this.moves=0;this.matched=0;this.first=null;this.locked=false;this.secs=0;combo=0;updateCombo();clearInterval(window._timer);
    document.getElementById('g5-pairs').textContent='0/'+this.pairs;document.getElementById('g5-time').textContent='0:00';document.getElementById('g5-hints').textContent=this.hints;
    const ws=mode==='elderly'?wordSets.elderly:wordSets.child;
    const selected=shuffle([...ws]).slice(0,this.pairs);
    this.textCards=[];this.emojiCards=[];
    const textRow=document.getElementById('g5-text-row');textRow.innerHTML='';
    const emojiRow=document.getElementById('g5-emoji-row');emojiRow.innerHTML='';
    selected.forEach((w,i)=>{const tc=document.createElement('div');tc.className='word-card';tc.textContent=w[0];tc.dataset.pairId=String(i);tc.dataset.side='text';tc.onclick=()=>this.flip(tc);textRow.appendChild(tc);this.textCards.push(tc)});
    var indices=[];for(var k=0;k<selected.length;k++)indices.push(k);
    var si=shuffle(indices);
    si.forEach(function(idx){var w=selected[idx];var ec=document.createElement('div');ec.className='word-card';ec.textContent=w[1];ec.dataset.pairId=String(idx);ec.dataset.side='emoji';ec.onclick=()=>this.flip(ec);emojiRow.appendChild(ec);this.emojiCards.push(ec)}.bind(this));
  }
  flip(card){
    if(this.locked||card.classList.contains('matched'))return;
    if(!this.first){card.classList.add('selected');this.first=card;speak(card.textContent);return}
    if(card.dataset.side===this.first.dataset.side){this.first.classList.remove('selected');this.first=card;card.classList.add('selected');speak(card.textContent);return}
    card.classList.add('selected');
    if(!window._timer){window._timer=setInterval(()=>{this.secs++;const m=Math.floor(this.secs/60),s=this.secs%60;document.getElementById('g5-time').textContent=m+':'+(s<10?'0':'')+s},1000)}
    this.moves++;const a=this.first,b=card;
    if(a.dataset.pairId===b.dataset.pairId){
      a.classList.add('matched');b.classList.add('matched');this.matched++;addCombo();bumpStat('g5-pairs');
      document.getElementById('g5-pairs').textContent=this.matched+'/'+this.pairs;
      const rect=b.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top,['✨','🎉','⭐'],4);
      showCheer(document.getElementById('g5-cheer'),getCheer());this.first=null;
      if(this.matched===this.pairs)this.win();
    }else{
      this.locked=true;resetCombo();shakeScreen();
      a.classList.add('wrong');b.classList.add('wrong');
      setTimeout(()=>{a.classList.remove('selected','wrong');b.classList.remove('selected','wrong');this.first=null;this.locked=false},600);
    }
  }
  useHint(){
    if(this.hints<=0){speak('没有提示了');return}
    this.hints--;document.getElementById('g5-hints').textContent=this.hints;
    const unmatched=this.emojiCards.filter(c=>!c.classList.contains('matched'));
    if(unmatched.length===0)return;
    const target=unmatched[Math.floor(Math.random()*unmatched.length)];
    target.classList.add('hint-glow');setTimeout(()=>target.classList.remove('hint-glow'),1500);
    speak('这个是提示');
  }
  win(){
    clearInterval(window._timer);const t=document.getElementById('g5-time').textContent;
    showResult('🎉',mode==='elderly'?'太棒了！':'真厉害！','⭐'.repeat(this.moves<=this.pairs*2?3:this.moves<=this.pairs*3?2:1),'步数：'+this.moves+'  用时：'+t);
    speak('全部配对成功！');
  }
}

/* ===== GAME 6: Dual PK ===== */
class DualGame{
  constructor(){this.name='dual'}
  start(){
    clearInterval(window._timer);this.p1Score=0;this.p2Score=0;this.pairs=8;this.turn=1;this.flipped=[];this.locked=false;this.moves=0;this.matched=0;
    const c=document.getElementById('gc');
    c.innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">总步数</div><div class="stat-value" id="gd-moves">0</div></div><div class="stat"><div class="stat-label">剩余</div><div class="stat-value" id="gd-left">8</div></div></div>
    <div class="pk-scores"><div class="pk-score active" id="gd-p1"><div class="pk-label">玩家1</div><div class="pk-value" id="gd-p1s">0</div></div><div class="pk-score" id="gd-p2"><div class="pk-label">玩家2</div><div class="pk-value" id="gd-p2s">0</div></div></div>
    <div class="pk-turn" id="gd-turn">玩家1 的回合</div>
    <div class="board b4" id="gd-board"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-p" onclick="curGame.start()">🔄 重新开始</button></div>`;
    this.build();speak('双人PK：玩家1先开始，翻到相同的可以继续');
  }
  build(){
    this.p1Score=0;this.p2Score=0;this.turn=1;this.flipped=[];this.locked=false;this.moves=0;this.matched=0;
    document.getElementById('gd-moves').textContent='0';document.getElementById('gd-left').textContent=this.pairs;
    document.getElementById('gd-p1s').textContent='0';document.getElementById('gd-p2s').textContent='0';
    document.getElementById('gd-p1').classList.add('active');document.getElementById('gd-p2').classList.remove('active');
    document.getElementById('gd-turn').textContent='玩家1 的回合';
    const es=shuffle([...(mode==='elderly'?emojis.elderly:emojis.child)]).slice(0,this.pairs);
    const items=[];es.forEach((e,i)=>{items.push({id:i,emoji:e});items.push({id:i,emoji:e})});
    const shuffled=shuffle(items);const board=document.getElementById('gd-board');board.innerHTML='';
    shuffled.forEach(item=>{const card=document.createElement('div');card.className='card';card.dataset.id=item.id;card.innerHTML=`<div class="cb"></div><div class="ca">${item.emoji}</div>`;card.onclick=(e)=>this.flip(card,e);board.appendChild(card)});
  }
  flip(card,e){
    if(this.locked||card.classList.contains('flipped')||card.classList.contains('matched')||this.flipped.length>=2)return;
    card.classList.add('flipped');this.flipped.push(card);
    if(this.flipped.length===2){
      this.moves++;document.getElementById('gd-moves').textContent=this.moves;
      const[a,b]=this.flipped;
      if(a.dataset.id===b.dataset.id){
        this.locked=true;
        setTimeout(()=>{
          a.classList.add('matched');b.classList.add('matched');
          this.matched++;document.getElementById('gd-left').textContent=this.pairs-this.matched;
          if(this.turn===1){this.p1Score++;document.getElementById('gd-p1s').textContent=this.p1Score;}
          else{this.p2Score++;document.getElementById('gd-p2s').textContent=this.p2Score;}
          const rect=a.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top,['✨','⭐'],4);
          this.flipped=[];this.locked=false;
          if(this.matched===this.pairs){this.endGame();return}
        },350);
      }else{
        this.locked=true;
        setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');this.flipped=[];this.locked=false;this.switchTurn()},600);
      }
    }
  }
  switchTurn(){
    this.turn=this.turn===1?2:1;
    document.getElementById('gd-p1').classList.toggle('active',this.turn===1);
    document.getElementById('gd-p2').classList.toggle('active',this.turn===2);
    document.getElementById('gd-turn').textContent='玩家'+this.turn+' 的回合';
    speak('轮到玩家'+this.turn);
  }
  endGame(){
    let title,detail;
    if(this.p1Score>this.p2Score){title='玩家1 获胜！';detail='玩家1：'+this.p1Score+'  玩家2：'+this.p2Score;}
    else if(this.p2Score>this.p1Score){title='玩家2 获胜！';detail='玩家2：'+this.p2Score+'  玩家1：'+this.p1Score;}
    else{title='平局！';detail='玩家1：'+this.p1Score+'  玩家2：'+this.p2Score;}
    showResult('🏆',title,'⭐⭐⭐',detail);
    speak(title);
  }
}
