，也第一次尝到'做出别人没做过的东西'的兴奋。"}},{year:"第5年",title:"被引用的名字",position:{x:285,y:293},snapshot:{income:62,growth:88,satisfaction:68,impact:65,stress:60,title:"被引用的名字",description:"硕士毕业，手握几篇论文和一段扎实的科研经历。无论是去读博、进大厂研发还是考公，你都比本科时多了底气。你开始理解：深度，是一种很难被替代的护城河。"}},{year:"第10年",title:"领域的注脚",position:{x:150,y:120},snapshot:{income:80,growth:90,satisfaction:75,impact:85,stress:58,title:"领域的注脚",description:"你成了某个细分领域里绕不开的名字之一，带学生、写综述、参与行业标准。收入稳定且体面，生活节奏可控。回头看，那几年书没白读——你拥有了选择权，而不是被选择。"},video:{id:"",platform:"bilibili",title:"访谈视频录制中",speaker:"敬请期待真实访谈",duration:"--:--"}}]},{id:"work",name:"就业",tagline:"先上场，再找到自己的位置",description:"不再等待，直接走进真实的世界。在工位、会议室和地铁通勤之间，你用一份份工作拼出属于自己的能力地图，从'被教'的人，变成'能扛事'的人。",icon:"Briefcase",color:"#5eead4",colorRgb:"94,234,212",typicalDay:"早高峰挤进地铁，上午开会对齐进度，下午写方案/敲代码/跑客户，晚上复盘加偶尔加班。周末补觉、社交、学点新东西，节奏被DDL推着走。",coreSkills:["执行落地","沟通协作","时间管理","向上汇报","复盘迭代"],dilemma:"前两年容易觉得自己是螺丝钉，看不到全局；换工作时纠结是追薪资还是追成长。",leadsTo:"资深专家、团队管理、跳槽涨薪、转行创业、自由职业",milestones:[{year:"第1年",title:"工位上的新人",position:{x:533,y:536},snapshot:{income:50,growth:65,satisfaction:50,impact:30,stress:72,title:"工位上的新人",description:"从校园到职场，第一次拿工资也第一次被甲方/老板改方案改到崩溃。你学会用邮件、用周报、用'我同步一下'。笨拙，但每天都在变强一点。"}},{year:"第3年",title:"能扛事的人",position:{x:471,y:406},snapshot:{income:68,growth:78,satisfaction:58,impact:50,stress:70,title:"能扛事的人",description:"你不再是那个问'这个怎么做'的人，而是被问的人。能独立 owner 一个项目，也开始带新人。涨了一次薪，搬了一次家，开始理解'职业'两个字比'工作'更重。"}},{year:"第5年",title:"选择岔路口",position:{x:412,y:276},snapshot:{income:78,growth:80,satisfaction:62,impact:60,stress:65,title:"选择岔路口",description:"猎头开始找你，offer 摆在桌上。是走管理线带团队，还是走专家线钻技术？是留在大厂卷，还是去创业公司博一把？你第一次意识到：往后每个选择，代价都更大。"}},{year:"第10年",title:"自己的护城河",position:{x:330,y:95},snapshot:{income:88,growth:82,satisfaction:68,impact:75,stress:60,title:"自己的护城河",description:"十年沉淀，你有了行业人脉、口碑和一段拿得出手的战绩。无论是继续往上爬还是出来单干，都有底气。回头看，那些加班的夜晚，铸成了别人抢不走的'你自己'。"},video:{id:"",platform:"bilibili",title:"访谈视频录制中",speaker:"敬请期待真实访谈",duration:"--:--"}}]},{id:"startup",name:"创业",tagline:"把空白填上你的名字",description:"不再执行别人的蓝图，而是画一张自己的。从0到1，你会经历极致的自由，也会经历极致的孤独——但每一寸进展，都写着'这是我的'。",icon:"Rocket",color:"#fb923c",colorRgb:"251,146,60",typicalDay:"没有固定上下班，因为从不'下班'。见投资人、改产品、招人、救火、复盘数据，一个人活成一支队伍。兴奋和焦虑常常在同一天出现。",coreSkills:["从0到1","资源整合","扛压决策","讲故事","快速学习"],dilemma:"现金流随时可能断；合伙人会散；市场不认你做的东西；孤独无人诉说。",leadsTo:"融资上市、被收购、转型再战、回归大厂、连续创业",milestones:[{year:"第1年",title:"车库里的火苗",position:{x:580,y:532},snapshot:{income:20,growth:85,satisfaction:65,impact:35,stress:92,title:"车库里的火苗",description:"没工资、没周末，每天像在刀尖上跳舞。产品改了八版，用户还在个位数。但你第一次为'自己的想法'熬夜，那种滚烫的兴奋，是打工给不了的。"}},{year:"第3年",title:"悬崖边的狂奔",position:{x:560,y:399},snapshot:{income:45,growth:90,satisfaction:58,impact:55,stress:88,title:"悬崖边的狂奔",description:"拿到第一笔融资，团队从3人变成20人，也第一次经历核心成员离开。每个月都在算账还能活多久，但你学会了在最不确定里做最关键的决策——这是商学院教不会的。"}},{year:"第5年",title:"活下来的少数",position:{x:539,y:265},snapshot:{income:70,growth:92,satisfaction:65,impact:80,stress:80,title:"活下来的少数",description:"80%的同行已经倒下，你还站着。产品跑通了模型，有了稳定客户。你开始明白创业不是赌一把，而是连续一千次小决策的总和。你的名字，开始被人记住。"}},{year:"第10年",title:"你画的蓝图",position:{x:510,y:80},snapshot:{income:95,growth:95,satisfaction:75,impact:92,stress:70,title:"你画的蓝图",description:"公司成了行业里有名字的存在。无论是上市、被收购还是稳健经营，你都实现了最初那句'做点不一样的事'。财富自由只是副产品，真正的奖赏是：你亲手创造了一个世界。"},video:{id:"",platform:"bilibili",title:"访谈视频录制中",speaker:"敬请期待真实访谈",duration:"--:--"}}]},{id:"abroad",name:"留学",tagline:"把世界当作你的课堂",description:"离开熟悉的一切，去另一个国家、另一种文化里重新认识自己。你会在语言、孤独和差异中成长，也会带回一个更宽广的世界观，和一颗更韧的心。",icon:"Plane",color:"#60a5fa",colorRgb:"96,165,250",typicalDay:"白天上课或泡实验室赶 due，下午和各国同学组会讨论，晚上自己做饭、和室友聊到深夜。周末逛博物馆、短途旅行，假期背包走更远的城市。日子在时差里慢慢长大。",coreSkills:["跨文化适应","外语沟通","独立生活","学术写作","视角转换"],dilemma:"脱离国内人脉和节奏，回国可能'水土不服'；家里经济压力不小；孤独和文化冲击是常态。",leadsTo:"海外就业、移民、回国进外企/高校、继续深造、跨国创业",milestones:[{year:"第1年",title:"异国的第一场雪",position:{x:620,y:533},snapshot:{income:22,growth:75,satisfaction:60,impact:30,stress:80,title:"异国的第一场雪",description:"刚落地，语言磕磕绊绊，上课只能听懂六成。想家、想外卖、想国内的便利。但也新鲜：第一次看见真正的雪、第一次和五个国家的室友做饭。你在孤独里学会了自己撑住自己。"}},{year:"第3年",title:"跨文化的桥梁",position:{x:641,y:401},snapshot:{income:45,growth:85,satisfaction:66,impact:48,stress:68,title:"跨文化的桥梁",description:"你已经能流利地在 seminar 里辩论，成了小组里那个'能连接不同文化'的人。做 TA、拿奖学金，第一次在异国过生日有了一桌朋友。你发现：差异不再是障碍，而是你的优势。"}},{year:"第5年",title:"两个世界的人",position:{x:661,y:268},snapshot:{income:72,growth:88,satisfaction:72,impact:62,stress:60,title:"两个世界的人",description:"拿到学位，或在海外开始第一份正式工作。你能在两种语言、两种文化间自如切换，有了'全球视角'。回国时既亲切又陌生——你已经是'两个世界的人'，哪里都是家，哪里都不完全是家。"}},{year:"第10年",title:"没有边界的家",position:{x:690,y:85},snapshot:{income:85,growth:90,satisfaction:80,impact:80,stress:55,title:"没有边界的家",description:"十年过去，你也许在异国扎根，也许带着一身阅历回到故土。你拥有跨国人脉、双语能力和一颗被世界撑大过的心。家不再是一个固定的地方，而是一种'哪里都能重新开始'的底气。你看过的世界，成了别人抢不走的格局。"},video:{id:"",platform:"bilibili",title:"访谈视频录制中",speaker:"敬请期待真实访谈",duration:"--:--"}}]},{id:"civil",name:"公务员",tagline:"在稳定里守护一方烟火",description:"通过一场公平的考试，换一份相对确定的人生。在体制的齿轮里，你或许改变不了世界，却能稳稳接住一个小家，并把一件事做得长久而扎实。",icon:"Landmark",color:"#a78bfa",colorRgb:"167,139,250",typicalDay:"朝九晚五是常态，上午处理文件/窗口业务，下午开会下基层，晚上能回家吃饭。周末双休，节奏可控，偶尔项目期加班。生活与工作的边界比较清晰。",coreSkills:["公文写作","政策理解","协调沟通","耐心细致","体制适应"],dilemma:"晋升节奏慢、论资排辈；想做事时受流程掣肘；稳定背后是天花板可见的失落感。",leadsTo:"科级/处级晋升、遴选上挂、转任国企、下海经商、安稳退休",milestones:[{year:"第1年",title:"新人进体制",position:{x:667,y:537},snapshot:{income:48,growth:55,satisfaction:62,impact:35,stress:60,title:"新人进体制",description:"考上那一刻全家欢呼。入职后学公文、学流程、学'按规矩办事'。工资不高但有保障，下班能看夕阳。你开始适应：这里慢，但稳。"}},{year:"第3年",title:"业务熟手",position:{x:729,y:408},snapshot:{income:58,growth:62,satisfaction:66,impact:52,stress:55,title:"业务熟手",description:"你成了科室里能扛活的人，领导愿意把事交给你。开始参与更核心的业务，也看清了晋升的节奏。下班后的生活丰富起来——这是体制给普通人的礼物：有余力过生活。"}},{year:"第5年",title:"小家的屋顶",position:{x:788,y:279},snapshot:{income:66,growth:65,satisfaction:72,impact:58,stress:52,title:"小家的屋顶",description:"成家、买房、有了孩子。双职工+稳定公积金，日子过得不慌。偶尔刷到同龄人创业暴富会有一丝涟漪，但看着熟睡的孩子，你清楚自己选的是另一种圆满。"}},{year:"第10年",title:"稳稳的远方",position:{x:870,y:100},snapshot:{income:75,growth:68,satisfaction:78,impact:70,stress:50,title:"稳稳的远方",description:"科长或副处，管着一摊事，也带几个新人。你影响着一方政策的一小角，被需要、被尊重。没有大起大落，但回头看十年，你守护住了很多人没能守住的东西——一个完整的家，和一份不焦虑的人生。"},video:
