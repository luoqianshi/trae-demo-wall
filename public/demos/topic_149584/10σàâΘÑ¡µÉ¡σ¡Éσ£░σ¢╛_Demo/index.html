<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10元饭搭子地图</title>
<style>
  :root {
    --primary: #FF6B35;
    --primary-light: #FF8C5A;
    --primary-bg: #FFF3ED;
    --secondary: #4ECDC4;
    --dark: #2D3436;
    --gray: #636E72;
    --light-gray: #F5F6FA;
    --border: #E8E8E8;
    --white: #FFFFFF;
    --danger: #E74C3C;
    --success: #27AE60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--light-gray);
    color: var(--dark);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* App Container */
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--light-gray);
    position: relative;
    padding-bottom: 70px;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
    color: var(--white);
    padding: 16px 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .header-title {
    font-size: 20px;
    font-weight: 700;
  }

  .header-location {
    font-size: 13px;
    opacity: 0.9;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .header-location::before {
    content: "📍";
  }

  .search-bar {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: rgba(255,255,255,0.9);
  }

  .search-bar::before {
    content: "🔍";
    font-size: 16px;
  }

  /* Filter Tags */
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }

  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--light-gray);
    color: var(--gray);
    border: none;
  }

  .filter-tag.active {
    background: var(--primary);
    color: var(--white);
  }

  /* Section Title */
  .section-title {
    padding: 16px 16px 8px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-title .more {
    font-size: 13px;
    color: var(--primary);
    font-weight: 500;
  }

  /* Restaurant Card */
  .restaurant-card {
    background: var(--white);
    margin: 0 16px 12px;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
  }

  .card-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--gray);
  }

  .stars { color: #FFB800; }

  .card-info {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 12px;
  }

  .card-info span { margin-right: 12px; }

  .price-tag {
    display: inline-block;
    background: var(--primary-bg);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .team-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  .team-status {
    font-size: 13px;
    color: var(--gray);
  }

  .team-status .highlight {
    color: var(--primary);
    font-weight: 700;
  }

  .btn-join {
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-join:hover { transform: scale(1.05); }
  .btn-join:disabled {
    background: var(--border);
    color: var(--gray);
    cursor: not-allowed;
    transform: none;
  }

  .btn-join.full {
    background: var(--success);
  }

  /* Map View */
  .map-container {
    position: relative;
    height: 400px;
    background: linear-gradient(180deg, #E8F4F8 0%, #D4E9F0 50%, #C5DFE8 100%);
    margin: 0 16px 12px;
    border-radius: 16px;
    overflow: hidden;
  }

  .map-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .map-marker {
    position: absolute;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .map-marker:hover { transform: scale(1.1); }

  .marker-pin {
    width: 40px;
    height: 48px;
    position: relative;
  }

  .marker-pin::before {
    content: attr(data-price);
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary);
    color: white;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(255,107,53,0.4);
  }

  .marker-pin::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid var(--primary);
  }

  .marker-dot {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 4px;
    background: rgba(0,0,0,0.2);
    border-radius: 50%;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-content {
    background: var(--white);
    width: 100%;
    max-width: 430px;
    border-radius: 24px 24px 0 0;
    padding: 24px;
    animation: slideUp 0.3s ease;
    max-height: 80vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--light-gray);
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-body { margin-bottom: 20px; }

  .modal-body p {
    font-size: 15px;
    color: var(--gray);
    line-height: 1.6;
  }

  .calc-box {
    background: var(--primary-bg);
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
  }

  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 15px;
  }

  .calc-row.total {
    border-top: 2px solid var(--primary);
    margin-top: 8px;
    padding-top: 12px;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 14px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover { transform: scale(1.02); }

  .btn-secondary {
    width: 100%;
    background: var(--white);
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 14px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Team Members */
  .member-list {
    display: flex;
    gap: 8px;
    margin: 12px 0;
  }

  .member-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
  }

  .member-avatar.empty {
    background: var(--border);
    color: var(--gray);
    border: 2px dashed var(--gray);
  }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--white);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    border-top: 1px solid var(--border);
    z-index: 50;
  }

  .nav-item {
    text-align: center;
    padding: 4px 16px;
    cursor: pointer;
    color: var(--gray);
    font-size: 11px;
    transition: color 0.2s;
    border: none;
    background: none;
  }

  .nav-item.active {
    color: var(--primary);
  }

  .nav-icon {
    font-size: 22px;
    margin-bottom: 2px;
  }

  /* Page sections */
  .page { display: none; }
  .page.active { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--dark);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray);
  }

  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* My Page */
  .profile-header {
    background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
    color: white;
    padding: 30px 16px;
    text-align: center;
  }

  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: white;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  .profile-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .profile-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 16px;
  }

  .profile-stat {
    text-align: center;
  }

  .profile-stat .num {
    font-size: 24px;
    font-weight: 700;
  }

  .profile-stat .label {
    font-size: 13px;
    opacity: 0.9;
  }

  .menu-list {
    background: white;
    margin: 12px 16px;
    border-radius: 16px;
    overflow: hidden;
  }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }

  .menu-item:last-child { border-bottom: none; }

  .badge {
    background: var(--danger);
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* Animations */
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .marker-pulse {
    animation: pulse 2s infinite;
  }
</style>
</head>
<body>

<div class="app">

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ===== HOME PAGE ===== -->
  <div class="page active" id="page-home">
    <div class="header">
      <div class="header-top">
        <div class="header-title">10元饭搭子地图</div>
        <div class="header-location">北京大学 · 1km内</div>
      </div>
      <div class="search-bar">搜索低价美食、拼饭队伍...</div>
    </div>

    <div class="filter-bar">
      <button class="filter-tag active" onclick="filterRestaurants('all')">全部</button>
      <button class="filter-tag" onclick="filterRestaurants('川菜')">川菜</button>
      <button class="filter-tag" onclick="filterRestaurants('面食')">面食</button>
      <button class="filter-tag" onclick="filterRestaurants('快餐')">快餐</button>
      <button class="filter-tag" onclick="filterRestaurants('小吃')">小吃</button>
    </div>

    <div class="section-title">
      附近低价餐厅
      <span class="more" onclick="showToast('已按距离排序')">按距离 ↓</span>
    </div>

    <div id="restaurant-list"></div>
  </div>

  <!-- ===== MAP PAGE ===== -->
  <div class="page" id="page-map">
    <div class="header">
      <div class="header-top">
        <div class="header-title">地图找店</div>
        <div class="header-location">北京大学 · 1km内</div>
      </div>
    </div>

    <div class="map-container">
      <div class="map-bg"></div>
      <div id="map-markers"></div>
    </div>

    <div class="section-title">地图上的低价餐馆</div>
    <div id="map-restaurant-list"></div>
  </div>

  <!-- ===== TEAM PAGE ===== -->
  <div class="page" id="page-team">
    <div class="header">
      <div class="header-top">
        <div class="header-title">拼饭广场</div>
        <div class="header-location">正在进行中的拼单</div>
      </div>
    </div>

    <div class="section-title">
      附近可加入的拼单
      <span class="more" onclick="showToast('已刷新')">刷新 ↻</span>
    </div>

    <div id="team-list"></div>
  </div>

  <!-- ===== PROFILE PAGE ===== -->
  <div class="page" id="page-profile">
    <div class="profile-header">
      <div class="profile-avatar">👤</div>
      <div class="profile-name">饭友_小明</div>
      <div style="font-size:14px;opacity:0.9"> joined 3 days ago</div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="num">12</div>
          <div class="label">拼过</div>
        </div>
        <div class="profile-stat">
          <div class="num">¥156</div>
          <div class="label">省下的</div>
        </div>
        <div class="profile-stat">
          <div class="num">8</div>
          <div class="label">饭友</div>
        </div>
      </div>
    </div>

    <div class="menu-list">
      <div class="menu-item">
        <span>我的拼单记录</span>
        <span>›</span>
      </div>
      <div class="menu-item">
        <span>收藏的餐馆</span>
        <span>›</span>
      </div>
      <div class="menu-item">
        <span>消息通知</span>
        <span class="badge">2</span>
      </div>
      <div class="menu-item">
        <span>设置</span>
        <span>›</span>
      </div>
    </div>

    <div style="padding: 20px; text-align: center; color: var(--gray); font-size: 13px;">
      这是 Demo 版本，仅供展示体验
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('home')">
      <div class="nav-icon">🏠</div>
      <div>首页</div>
    </button>
    <button class="nav-item" onclick="switchPage('map')">
      <div class="nav-icon">🗺️</div>
      <div>地图</div>
    </button>
    <button class="nav-item" onclick="switchPage('team')">
      <div class="nav-icon">👥</div>
      <div>拼饭</div>
    </button>
    <button class="nav-item" onclick="switchPage('profile')">
      <div class="nav-icon">👤</div>
      <div>我的</div>
    </button>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">拼单详情</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<script>
// ===== Data =====
const restaurants = [
  {
    id: 1,
    name: "张姐家常菜",
    type: "川菜",
    rating: 4.5,
    distance: "120m",
    walk: "2分钟",
    price: 8,
    tags: ["辣", "下饭"],
    team: { name: "2人套餐", total: 18, current: 1, need: 2, members: ["小A"] },
    mapPos: { left: 25, top: 30 }
  },
  {
    id: 2,
    name: "老王水饺",
    type: "面食",
    rating: 4.7,
    distance: "280m",
    walk: "5分钟",
    price: 10,
    tags: ["手工", "量大"],
    team: { name: "3人套餐", total: 28, current: 2, need: 3, members: ["饭友_1", "小林"] },
    mapPos: { left: 60, top: 20 }
  },
  {
    id: 3,
    name: "辣炒年糕专门店",
    type: "小吃",
    rating: 4.3,
    distance: "350m",
    walk: "6分钟",
    price: 10,
    tags: ["网红", "适合 sharing"],
    team: { name: "辣炒年糕三人餐", total: 30, current: 2, need: 3, members: ["阿杰", "小雨"] },
    mapPos: { left: 45, top: 55 }
  },
  {
    id: 4,
    name: "重庆小面",
    type: "面食",
    rating: 4.2,
    distance: "80m",
    walk: "1分钟",
    price: 9,
    tags: ["麻辣", "快"],
    team: null,
    mapPos: { left: 15, top: 70 }
  },
  {
    id: 5,
    name: "东北快餐",
    type: "快餐",
    rating: 4.0,
    distance: "500m",
    walk: "8分钟",
    price: 10,
    tags: ["自助", "管饱"],
    team: { name: "4人自助", total: 36, current: 3, need: 4, members: ["大壮", "阿华", "Lisa"] },
    mapPos: { left: 75, top: 65 }
  },
  {
    id: 6,
    name: "兰州拉面",
    type: "面食",
    rating: 4.4,
    distance: "200m",
    walk: "3分钟",
    price: 10,
    tags: ["清汤", "正宗"],
    team: { name: "双人套餐", total: 16, current: 1, need: 2, members: ["老陈"] },
    mapPos: { left: 35, top: 40 }
  }
];

let joinedTeams = [];

// ===== Render Functions =====
function renderRestaurants(filter = 'all') {
  const list = document.getElementById('restaurant-list');
  const filtered = filter === 'all' ? restaurants : restaurants.filter(r => r.type === filter);

  list.innerHTML = filtered.map(r => `
    <div class="restaurant-card">
      <div class="card-header">
        <div>
          <div class="card-title">${r.name}</div>
          <div class="card-info">
            <span>${r.type}</span>
            <span>${r.distance}</span>
            <span>步行${r.walk}</span>
          </div>
        </div>
        <div class="card-rating">
          <span class="stars">★</span> ${r.rating}
        </div>
      </div>
      <div>
        <span class="price-tag">人均 ¥${r.price}</span>
        ${r.tags.map(t => `<span style="margin-left:6px;font-size:12px;color:var(--gray)">#${t}</span>`).join('')}
      </div>
      ${r.team ? `
      <div class="team-info">
        <div class="team-status">
          <span class="highlight">${r.team.name}</span> · 
          已有 <span class="highlight">${r.team.current}</span>/${r.team.need}人 · 
          人均 <span class="highlight">¥${Math.round(r.team.total / r.team.need)}</span>
        </div>
        <button class="btn-join ${r.team.current >= r.team.need ? 'full' : ''}" 
          ${r.team.current >= r.team.need || joinedTeams.includes(r.id) ? 'disabled' : ''}
          onclick="openTeamModal(${r.id})">
          ${joinedTeams.includes(r.id) ? '已加入' : (r.team.current >= r.team.need ? '已满' : '加入')}
        </button>
      </div>
      ` : `
      <div class="team-info">
        <div class="team-status" style="color: var(--gray)">暂无拼单，你可以发起一个 👇</div>
        <button class="btn-join" onclick="openCreateModal(${r.id})">发起</button>
      </div>
      `}
    </div>
  `).join('');
}

function renderMapMarkers() {
  const container = document.getElementById('map-markers');
  container.innerHTML = restaurants.map(r => `
    <div class="map-marker ${r.team && r.team.current < r.team.need ? 'marker-pulse' : ''}" 
      style="left:${r.mapPos.left}%;top:${r.mapPos.top}%"
      onclick="openTeamModal(${r.id})">
      <div class="marker-pin" data-price="¥${r.price}"></div>
      <div class="marker-dot"></div>
    </div>
  `).join('');

  document.getElementById('map-restaurant-list').innerHTML = restaurants.slice(0, 3).map(r => `
    <div class="restaurant-card" style="margin-top:12px" onclick="openTeamModal(${r.id})">
      <div class="card-header">
        <div class="card-title">${r.name}</div>
        <div class="card-rating"><span class="stars">★</span> ${r.rating}</div>
      </div>
      <div class="card-info">
        <span>${r.type}</span>
        <span>${r.distance}</span>
        <span class="price-tag">人均 ¥${r.price}</span>
      </div>
    </div>
  `).join('');
}

function renderTeamPage() {
  const list = document.getElementById('team-list');
  const teams = restaurants.filter(r => r.team && r.team.current < r.team.need);

  if (teams.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🍽️</div>
        <p>暂时没有可加入的拼单<br>快去发起一个吧！</p>
      </div>
    `;
    return;
  }

  list.innerHTML = teams.map(r => `
    <div class="restaurant-card">
      <div class="card-header">
        <div>
          <div class="card-title">${r.name}</div>
          <div class="card-info">${r.type} · ${r.distance} · ${r.walk}</div>
        </div>
        <span class="price-tag">人均 ¥${Math.round(r.team.total / r.team.need)}</span>
      </div>
      <div style="margin: 12px 0">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">${r.team.name} · ${r.team.total}元</div>
        <div class="member-list">
          ${r.team.members.map(m => `<div class="member-avatar">${m[0]}</div>`).join('')}
          ${Array(r.team.need - r.team.current).fill(0).map(() => `<div class="member-avatar empty">?</div>`).join('')}
        </div>
        <div class="team-status" style="margin-top:8px">
          还差 <span class="highlight">${r.team.need - r.team.current}</span> 人即可发车
        </div>
      </div>
      <button class="btn-join" style="width:100%;padding:12px" 
        ${joinedTeams.includes(r.id) ? 'disabled' : ''}
        onclick="openTeamModal(${r.id})">
        ${joinedTeams.includes(r.id) ? '已加入' : '加入拼单'}
      </button>
    </div>
  `).join('');
}

// ===== Modal Functions =====
function openTeamModal(id) {
  const r = restaurants.find(x => x.id === id);
  if (!r || !r.team) return;

  const perPerson = Math.round(r.team.total / r.team.need);
  const isJoined = joinedTeams.includes(id);
  const isFull = r.team.current >= r.team.need;

  document.getElementById('modal-title').textContent = r.name;
  document.getElementById('modal-body').innerHTML = `
    <p>${r.type} · ${r.distance} · 步行${r.walk}</p>
    <div style="margin: 12px 0">
      <span class="price-tag">人均 ¥${r.price}（单点）</span>
    </div>
    <div class="calc-box">
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">${r.team.name}</div>
      <div class="member-list">
        ${r.team.members.map(m => `<div class="member-avatar">${m[0]}</div>`).join('')}
        ${Array(r.team.need - r.team.current).fill(0).map(() => `<div class="member-avatar empty">?</div>`).join('')}
      </div>
      <div class="calc-row">
        <span>套餐总价</span>
        <span>¥${r.team.total}</span>
      </div>
      <div class="calc-row">
        <span>人数</span>
        <span>${r.team.need} 人</span>
      </div>
      <div class="calc-row">
        <span>当前</span>
        <span>${r.team.current}/${r.team.need} 人</span>
      </div>
      <div class="calc-row total">
        <span>拼单后人均</span>
        <span>¥${perPerson}</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--gray)">
      💡 单点人均约¥${r.price}，拼单后人均¥${perPerson}，
      ${perPerson < r.price ? `立省 ¥${r.price - perPerson}` : '一样划算但吃得更丰富！'}
    </p>
  `;

  const actions = document.getElementById('modal-actions');
  if (isJoined) {
    actions.innerHTML = `<button class="btn-primary" disabled>✓ 已加入拼单</button>`;
  } else if (isFull) {
    actions.innerHTML = `<button class="btn-primary" disabled>已满员</button>`;
  } else {
    actions.innerHTML = `<button class="btn-primary" onclick="joinTeam(${id})">加入拼单（人均¥${perPerson}）</button>`;
  }

  document.getElementById('modal').classList.add('active');
}

function openCreateModal(id) {
  const r = restaurants.find(x => x.id === id);
  if (!r) return;

  document.getElementById('modal-title').textContent = '发起拼单';
  document.getElementById('modal-body').innerHTML = `
    <p>在「${r.name}」发起一个新拼单</p>
    <div class="calc-box" style="margin-top:16px">
      <div class="calc-row">
        <span>选择套餐</span>
        <span style="font-weight:600">2人套餐 ¥18</span>
      </div>
      <div class="calc-row">
        <span>需要人数</span>
        <span style="font-weight:600">2 人</span>
      </div>
      <div class="calc-row total">
        <span>人均费用</span>
        <span>¥9</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--gray);margin-top:12px">
      发起后其他人可以在拼饭广场看到你发起的拼单
    </p>
  `;
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-primary" onclick="createTeam(${id})">确认发起拼单</button>
    <button class="btn-secondary" onclick="closeModal()">取消</button>
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal').classList.remove('active');
}

function joinTeam(id) {
  joinedTeams.push(id);
  closeModal();
  showToast('加入成功！去餐厅集合吧 🎉');
  renderRestaurants();
  renderTeamPage();
}

function createTeam(id) {
  const r = restaurants.find(x => x.id === id);
  if (r) {
    r.team = { name: "2人套餐", total: 18, current: 1, need: 2, members: ["我"] };
  }
  closeModal();
  showToast('拼单发起成功！等待饭友加入 👥');
  renderRestaurants();
  renderTeamPage();
}

// ===== Navigation =====
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById('page-' + page).classList.add('active');
  event.currentTarget.classList.add('active');

  if (page === 'team') renderTeamPage();
}

// ===== Filter =====
function filterRestaurants(type) {
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderRestaurants(type);
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== Init =====
renderRestaurants();
renderMapMarkers();
renderTeamPage();
</script>

</body>
</html>
