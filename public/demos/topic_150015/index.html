<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境感知交互 — 交互式演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 28px; background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 6px;
  }
  header p { color: #94a3b8; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 320px 1fr 340px; gap: 16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px; padding: 16px; backdrop-filter: blur(10px);
  }
  .panel h2 {
    font-size: 14px; color: #60a5fa; margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    font-size: 12px; color: #94a3b8; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  /* 产品选择 */
  .product-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .product-btn {
    padding: 10px 4px; background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px; color: #cbd5e1; font-size: 11px; cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .product-btn:hover { background: rgba(71, 85, 105, 0.7); border-color: #60a5fa; }
  .product-btn.active {
    background: linear-gradient(135deg, #3b82f6, #6366f1); border-color: #60a5fa;
    color: white; box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
  }
  .product-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  /* 场景选择 */
  .scene-list { display: flex; flex-direction: column; gap: 6px; }
  .scene-btn {
    padding: 10px 12px; background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px; color: #cbd5e1; cursor: pointer; transition: all 0.2s;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .scene-btn:hover { background: rgba(71, 85, 105, 0.7); border-color: #a78bfa; }
  .scene-btn.active {
    background: linear-gradient(135deg, #7c3aed, #a78bfa); border-color: #a78bfa;
    color: white; box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
  }
  .scene-btn .scene-icon { font-size: 18px; margin-right: 8px; }
  .scene-btn .scene-name { flex: 1; }
  .scene-btn .scene-check { color: #4ade80; font-weight: bold; }
  /* 硬件状态 */
  .hw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hw-toggle {
    padding: 8px 10px; background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 12px;
    display: flex; align-items: center; gap: 6px; color: #94a3b8;
  }
  .hw-toggle:hover { background: rgba(71, 85, 105, 0.7); }
  .hw-toggle.on {
    background: rgba(34, 197, 94, 0.15); border-color: #4ade80; color: #4ade80;
  }
  .hw-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex-shrink: 0;
  }
  .hw-toggle.on .hw-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  /* 中央显示区 */
  .display-area { display: flex; flex-direction: column; gap: 16px; }
  .scene-display {
    background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px; padding: 24px; text-align: center; position: relative; overflow: hidden;
  }
  .scene-display::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
  }
  .scene-emoji { font-size: 64px; margin-bottom: 8px; }
  .scene-name-big { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .scene-desc { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  .recognition-result {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
    border-radius: 20px; font-size: 14px; font-weight: 500;
  }
  .recognition-result.ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
  .recognition-result.fail { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  .confidence-bar {
    margin-top: 16px; height: 8px; background: rgba(51, 65, 85, 0.5); border-radius: 4px;
    overflow: hidden;
  }
  .confidence-fill {
    height: 100%; background: linear-gradient(90deg, #3b82f6, #a78bfa);
    transition: width 0.5s ease; border-radius: 4px;
  }
  .mode-card {
    background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px; padding: 16px;
  }
  .mode-card h3 { font-size: 14px; color: #a78bfa; margin-bottom: 12px; }
  .mode-features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mode-feature {
    text-align: center; padding: 10px 4px; background: rgba(15, 23, 42, 0.5);
    border-radius: 8px; font-size: 11px;
  }
  .mode-feature .feat-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .mode-feature .feat-label { color: #94a3b8; }
  .mode-feature.on { background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.3); }
  .mode-feature.on .feat-label { color: #60a5fa; }
  /* 识别详情 */
  .score-list { display: flex; flex-direction: column; gap: 6px; }
  .score-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  .score-name { width: 80px; color: #cbd5e1; }
  .score-bar { flex: 1; height: 16px; background: rgba(51, 65, 85, 0.5); border-radius: 3px; overflow: hidden; }
  .score-fill { height: 100%; transition: width 0.4s ease; border-radius: 3px; }
  .score-value { width: 50px; text-align: right; color: #94a3b8; font-family: monospace; }
  .score-row.active .score-name { color: #4ade80; font-weight: 600; }
  .score-row.active .score-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
  .score-row .score-fill { background: linear-gradient(90deg, #6366f1, #818cf8); }
  /* 通知区 */
  .notify-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .notify-btn {
    padding: 6px 12px; background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 6px; color: #cbd5e1; cursor: pointer; font-size: 12px; transition: all 0.2s;
  }
  .notify-btn:hover { background: rgba(71, 85, 105, 0.7); }
  .notify-btn.p-low { border-color: rgba(148, 163, 184, 0.4); }
  .notify-btn.p-normal { border-color: rgba(96, 165, 250, 0.4); }
  .notify-btn.p-high { border-color: rgba(251, 191, 36, 0.4); }
  .notify-btn.p-critical { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }
  .notify-log {
    max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .notify-item {
    padding: 8px 12px; border-radius: 6px; font-size: 12px; border-left: 3px solid;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .notify-item.delivered { background: rgba(34, 197, 94, 0.1); border-color: #4ade80; }
  .notify-item.delayed { background: rgba(148, 163, 184, 0.1); border-color: #94a3b8; }
  .notify-item.batched { background: rgba(167, 139, 250, 0.1); border-color: #a78bfa; }
  .notify-item .notify-head { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .notify-item .notify-prio { font-size: 10px; padding: 1px 6px; border-radius: 3px; }
  .notify-prio.p1 { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
  .notify-prio.p2 { background: rgba(96, 165, 250, 0.2); color: #60a5fa; }
  .notify-prio.p3 { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
  .notify-prio.p4 { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  .notify-item .notify-outcome { font-size: 11px; color: #94a3b8; }
  .notify-item .notify-text { color: #cbd5e1; margin-top: 2px; }
  /* 指标 */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .metric-card {
    padding: 10px; background: rgba(15, 23, 42, 0.5); border-radius: 8px; text-align: center;
  }
  .metric-value { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .metric-value.ok { color: #4ade80; }
  .metric-value.fail { color: #f87171; }
  .metric-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
  /* 特征向量 */
  .feature-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .feature-name { width: 70px; color: #94a3b8; }
  .feature-bar { flex: 1; height: 6px; background: rgba(51, 65, 85, 0.5); border-radius: 3px; overflow: hidden; }
  .feature-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .feature-value { width: 36px; text-align: right; color: #cbd5e1; font-family: monospace; }
  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .action-btn {
    flex: 1; padding: 10px; background: linear-gradient(135deg, #3b82f6, #6366f1);
    border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 13px;
    transition: all 0.2s;
  }
  .action-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
  .action-btn.secondary { background: rgba(51, 65, 85, 0.7); }
  .action-btn.secondary:hover { background: rgba(71, 85, 105, 0.9); box-shadow: none; }
  .hint { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>环境感知交互</h1>
    <p>通过非摄像头环境感知自动判断用户状态并智能调整交互方式</p>
  </header>

  <div class="grid">
    <!-- 左侧：控制面板 -->
    <div class="panel">
      <h2>控制面板</h2>

      <div class="section">
        <div class="section-title">产品形态</div>
        <div class="product-grid" id="productGrid"></div>
      </div>

      <div class="section">
        <div class="section-title">场景选择</div>
        <div class="scene-list" id="sceneList"></div>
      </div>

      <div class="section">
        <div class="section-title">硬件状态（手动覆盖）</div>
        <div class="hw-grid" id="hwGrid"></div>
      </div>

      <div class="btn-row">
        <button class="action-btn secondary" onclick="autoDemo()">自动演示</button>
        <button class="action-btn secondary" onclick="resetSystem()">重置</button>
      </div>
    </div>

    <!-- 中央：显示区 -->
    <div class="display-area">
      <div class="scene-display">
        <div class="scene-emoji" id="sceneEmoji">💺</div>
        <div class="scene-name-big" id="sceneNameBig">静坐状态</div>
        <div class="scene-desc" id="sceneDesc">办公桌前静坐</div>
        <div id="recognitionResult" class="recognition-result ok">✓ 识别正确</div>
        <div style="margin-top:12px;font-size:13px;color:#94a3b8;">
          置信度: <span id="confidenceText">0.000</span>
        </div>
        <div class="confidence-bar">
          <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
        </div>
      </div>

      <div class="mode-card">
        <h3>当前交互模式</h3>
        <div style="font-size:18px;font-weight:600;margin-bottom:12px;color:#a78bfa;" id="modeName">完整内容展开</div>
        <div class="mode-features" id="modeFeatures"></div>
      </div>

      <div class="panel">
        <h2>识别详情 — 各场景得分</h2>
        <div class="score-list" id="scoreList"></div>
      </div>

      <div class="panel">
        <h2>传感器特征向量</h2>
        <div id="featureList"></div>
      </div>
    </div>

    <!-- 右侧：通知与指标 -->
    <div class="panel">
      <h2>通知勿扰决策</h2>
      <div class="notify-controls">
        <button class="notify-btn p-low" onclick="submitNotify('low')">低·营销</button>
        <button class="notify-btn p-normal" onclick="submitNotify('normal')">普通·消息</button>
        <button class="notify-btn p-high" onclick="submitNotify('high')">高·日程</button>
        <button class="notify-btn p-critical" onclick="submitNotify('critical')">紧急·告警</button>
      </div>
      <div class="notify-controls">
        <button class="notify-btn" onclick="submitBatch()">提交一批(8条)</button>
        <button class="notify-btn" onclick="clearLog()">清空日志</button>
      </div>
      <div class="notify-log" id="notifyLog"></div>
      <p class="hint">会议/夜间场景下普通通知延迟，紧急通知穿透</p>

      <h2 style="margin-top:20px;">性能指标</h2>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-value ok" id="metricAccuracy">100%</div>
          <div class="metric-label">识别准确率</div>
        </div>
        <div class="metric-card">
          <div class="metric-value ok" id="metricLatency">0.1ms</div>
          <div class="metric-label">切换延迟</div>
        </div>
        <div class="metric-card">
          <div class="metric-value ok" id="metricReduction">0%</div>
          <div class="metric-label">打断削减</div>
        </div>
        <div class="metric-card">
          <div class="metric-value ok" id="metricBattery">21天</div>
          <div class="metric-label">预估续航</div>
        </div>
      </div>
      <div style="margin-top:12px;font-size:11px;color:#94a3b8;line-height:1.6;">
        <div>通知统计: <span id="statTotal">0</span> 总计 / <span id="statDelivered">0</span> 送达 / <span id="statDelayed">0</span> 延迟 / <span id="statBatched">0</span> 批量</div>
        <div>隐私: 本地处理 <span id="statLocal">0</span> 事件, 网络外发 0</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================================
// 数据定义（与 Python 后端一致）
// ============================================================================

const PRODUCTS = [
  { id: 'phone', name: '手机', icon: '📱' },
  { id: 'bluetooth_earphones', name: '蓝牙耳机', icon: '🎧' },
  { id: 'wearable_glasses', name: '可穿戴眼镜', icon: '👓' },
  { id: 'smart_speaker', name: '智能音箱', icon: '🔊' },
  { id: 'other', name: '其他', icon: '⚙️' },
];

// 场景定义：特征中心值 + 硬件模板
const SCENES = [
  { id: 'noisy_subway', name: '嘈杂地铁', icon: '🚇', desc: '早高峰地铁通勤，环境嘈杂',
    center: { audio_rms:0.72, audio_voice_prob:0.18, audio_spectral_centroid:0.30, motion_activity:0.28, motion_periodicity:0.18, motion_stability:0.50, hour:8, is_weekday:true },
    hw: { in_pocket:true, in_motion:true, calendar_synced:true, has_meeting_now:false } },
  { id: 'quiet_bedroom', name: '安静卧室', icon: '🛏️', desc: '晚间卧室，安静休息',
    center: { audio_rms:0.10, audio_voice_prob:0.10, audio_spectral_centroid:0.25, motion_activity:0.06, motion_periodicity:0.10, motion_stability:0.94, hour:22, is_weekday:true },
    hw: { on_table:true, silent_mode:true, non_work_hours:true, calendar_synced:true, has_meeting_now:false, charging:true } },
  { id: 'walking', name: '行走状态', icon: '🚶', desc: '户外步行，规律运动',
    center: { audio_rms:0.35, audio_voice_prob:0.30, audio_spectral_centroid:0.45, motion_activity:0.66, motion_periodicity:0.82, motion_stability:0.20, hour:9, is_weekday:true },
    hw: { in_pocket:true, in_motion:true, calendar_synced:true, has_meeting_now:false } },
  { id: 'sitting_still', name: '静坐状态', icon: '💺', desc: '办公桌前静坐',
    center: { audio_rms:0.25, audio_voice_prob:0.30, audio_spectral_centroid:0.45, motion_activity:0.08, motion_periodicity:0.15, motion_stability:0.90, hour:14, is_weekday:true },
    hw: { on_table:true, calendar_synced:true, has_meeting_now:false } },
  { id: 'office_meeting', name: '办公室会议', icon: '👥', desc: '会议室中多人交谈',
    center: { audio_rms:0.42, audio_voice_prob:0.78, audio_spectral_centroid:0.72, motion_activity:0.10, motion_periodicity:0.18, motion_stability:0.86, hour:10, is_weekday:true },
    hw: { on_table:true, calendar_synced:true, has_meeting_now:true, silent_mode:true } },
  { id: 'meeting_scheduled', name: '日程会议', icon: '📅', desc: '日历显示当前有会议（会议室聆听中，较安静）',
    center: { audio_rms:0.30, audio_voice_prob:0.28, audio_spectral_centroid:0.50, motion_activity:0.10, motion_periodicity:0.18, motion_stability:0.86, hour:11, is_weekday:true },
    hw: { on_table:true, calendar_synced:true, has_meeting_now:true, silent_mode:true } },
  { id: 'gym', name: '健身房', icon: '🏃', desc: '健身房运动，背景音乐',
    center: { audio_rms:0.76, audio_voice_prob:0.20, audio_spectral_centroid:0.62, motion_activity:0.80, motion_periodicity:0.70, motion_stability:0.16, hour:18, is_weekday:true },
    hw: { in_motion:true, calendar_synced:true, has_meeting_now:false } },
  { id: 'night_rest', name: '夜间休息', icon: '🌙', desc: '深夜睡眠',
    center: { audio_rms:0.05, audio_voice_prob:0.05, audio_spectral_centroid:0.20, motion_activity:0.02, motion_periodicity:0.05, motion_stability:0.98, hour:2, is_weekday:true },
    hw: { on_table:true, silent_mode:true, non_work_hours:true, calendar_synced:true, has_meeting_now:false, charging:true } },
];

// 场景识别档案（高斯隶属函数 center, width）
const PROFILES = {
  noisy_subway: { audio_rms:[0.72,0.16], audio_voice_prob:[0.18,0.16], audio_spectral_centroid:[0.30,0.22], motion_activity:[0.28,0.22], motion_periodicity:[0.18,0.16], motion_stability:[0.50,0.28], hour_window:[7,9], weekday_only:true, time_floor:0.4 },
  quiet_bedroom: { audio_rms:[0.10,0.08], audio_voice_prob:[0.10,0.10], motion_activity:[0.06,0.06], motion_periodicity:[0.10,0.10], motion_stability:[0.94,0.06], hour_window:[20,23], time_floor:0.35 },
  walking: { audio_rms:[0.35,0.18], audio_voice_prob:[0.30,0.22], audio_spectral_centroid:[0.45,0.25], motion_activity:[0.66,0.16], motion_periodicity:[0.82,0.12], motion_stability:[0.20,0.16], hour_window:[6,23], time_floor:0.5 },
  sitting_still: { audio_rms:[0.25,0.16], audio_voice_prob:[0.30,0.22], audio_spectral_centroid:[0.45,0.25], motion_activity:[0.08,0.07], motion_periodicity:[0.15,0.12], motion_stability:[0.90,0.08], hour_window:[6,23], time_floor:0.5 },
  office_meeting: { audio_rms:[0.42,0.14], audio_voice_prob:[0.78,0.12], audio_spectral_centroid:[0.72,0.15], motion_activity:[0.10,0.08], motion_periodicity:[0.18,0.14], motion_stability:[0.86,0.10], hour_window:[9,18], weekday_only:true, time_floor:0.45 },

// ============================================================================
// 核心算法（与 Python 后端一致）
// ============================================================================

function clamp(x, lo=0, hi=1) { return Math.max(lo, Math.min(hi, x)); }

function gauss(x, center, width) {
  if (width <= 1e-6) return Math.abs(x - center) < 1e-6 ? 1.0 : 0.0;
  const z = (x - center) / width;
  return Math.exp(-0.5 * z * z);
}

function inWindow(hour, lo, hi) {
  if (lo <= hi) return lo <= hour && hour <= hi;
  return hour >= lo || hour <= hi;
}

function hourMembership(hour, window) {
  if (!window) return 1.0;
  const [lo, hi] = window;
  if (inWindow(hour, lo, hi)) return 1.0;
  let dist;
  if (lo <= hi) dist = Math.min(Math.abs(hour - lo), Math.abs(hour - hi));
  else if (hour > hi && hour < lo) dist = Math.min(Math.abs(hour - lo), Math.abs(hour - hi));
  else dist = 6;
  return Math.max(0, 1 - dist / 6);
}

// 生成带噪声的特征向量
function generateFeature(scene) {
  const c = scene.center;
  const noise = 0.05;
  const noisy = (v) => clamp(v + (Math.random() - 0.5) * 2 * noise + (Math.random() < 0.05 ? (Math.random()-0.5)*2*noise*2 : 0));
  return {
    audio_rms: noisy(c.audio_rms),
    audio_voice_prob: noisy(c.audio_voice_prob),
    audio_spectral_centroid: noisy(c.audio_spectral_centroid),
    motion_activity: noisy(c.motion_activity),
    motion_periodicity: noisy(c.motion_periodicity),
    motion_stability: noisy(c.motion_stability),
    hour: c.hour,
    is_weekday: c.is_weekday,
  };
}

// 硬件状态先验加分
function hardwareBonus(sceneId, hw) {
  if (!hw) return 0;
  let bonus = 0;
  // 会议环境
  if (sceneId === 'meeting_scheduled') {
    if (hw.has_meeting_now === true) bonus += 0.5;
    if (hw.calendar_synced === true && hw.has_meeting_now === true) bonus += 0.1;
    if (hw.non_work_hours === true) bonus -= 0.4;
    if (hw.has_meeting_now !== true) bonus -= 0.3;
  }
  if (sceneId === 'office_meeting') {
    if (hw.has_meeting_now === true) bonus += 0.3;
    if (hw.on_stand === true) bonus += 0.1;
    if (hw.non_work_hours === true) bonus -= 0.3;
  }
  // 静坐
  if (sceneId === 'sitting_still') {
    if (hw.on_table === true) bonus += 0.25;
    if (hw.on_stand === true) bonus += 0.2;
    if (hw.in_pocket === true) bonus -= 0.2;
    if (hw.in_hand === true) bonus += 0.05;
    if (hw.plugged_in === true) bonus += 0.15;
  }
  // 行走
  if (sceneId === 'walking') {
    if (hw.in_pocket === true && hw.in_motion === true) bonus += 0.3;
    if (hw.in_hand === true && hw.in_motion === true) bonus += 0.2;
    if (hw.on_table === true) bonus -= 0.3;
  }
  // 通勤
  if (sceneId === 'noisy_subway') {
    if (hw.in_pocket === true) bonus += 0.15;
    if (hw.in_motion === true && hw.on_table !== true) bonus += 0.1;
  }
  // 安静/夜间
  if (sceneId === 'quiet_bedroom' && hw.silent_mode === true) bonus += 0.15;
  if (sceneId === 'night_rest') {
    if (hw.silent_mode === true) bonus += 0.1;
    if (hw.non_work_hours === true) bonus += 0.05;
  }
  // 耳机 ANC/通透
  if ((sceneId === 'quiet_bedroom' || sceneId === 'night_rest') && hw.anc_on === true) bonus += 0.15;
  if ((sceneId === 'walking' || sceneId === 'noisy_subway') && hw.transparency_mode === true) bonus += 0.15;
  return bonus;
}

// 计算场景得分
function scoreScene(profile, fv, hw) {
  const ms = [];
  if (profile.audio_rms) ms.push(gauss(fv.audio_rms, ...profile.audio_rms));
  if (profile.audio_voice_prob) ms.push(gauss(fv.audio_voice_prob, ...profile.audio_voice_prob));
  if (profile.audio_spectral_centroid) ms.push(gauss(fv.audio_spectral_centroid, ...profile.audio_spectral_centroid));
  if (profile.motion_activity) ms.push(gauss(fv.motion_activity, ...profile.motion_activity));
  if (profile.motion_periodicity) ms.push(gauss(fv.motion_periodicity, ...profile.motion_periodicity));
  if (profile.motion_stability) ms.push(gauss(fv.motion_stability, ...profile.motion_stability));
  if (ms.length === 0) return 0;
  let score = 1.0;
  for (const m of ms) score *= m;
  if (profile.hour_window) {
    let hm = hourMembership(fv.hour, profile.hour_window);
    hm = profile.time_floor + (1 - profile.time_floor) * hm;
    score *= hm;
  }
  if (profile.weekday_only && !fv.is_weekday) score *= 0.5;
  score += hardwareBonus(state.activeScene, hw); // bonus 用 sceneId
  return score;
}

// 识别全部场景
function recognizeAll(fv, hw) {
  const scores = {};
  for (const scene of SCENES) {
    const profile = PROFILES[scene.id];
    // 重新计算：hardwareBonus 需要传入当前评分的 sceneId
    const ms = [];
    if (profile.audio_rms) ms.push(gauss(fv.audio_rms, ...profile.audio_rms));
    if (profile.audio_voice_prob) ms.push(gauss(fv.audio_voice_prob, ...profile.audio_voice_prob));
    if (profile.audio_spectral_centroid) ms.push(gauss(fv.audio_spectral_centroid, ...profile.audio_spectral_centroid));
    if (profile.motion_activity) ms.push(gauss(fv.motion_activity, ...profile.motion_activity));
    if (profile.motion_periodicity) ms.push(gauss(fv.motion_periodicity, ...profile.motion_periodicity));
    if (profile.motion_stability) ms.push(gauss(fv.motion_stability, ...profile.motion_stability));
    let score = ms.length ? ms.reduce((a,b)=>a*b, 1) : 0;
    if (profile.hour_window) {
      let hm = hourMembership(fv.hour, profile.hour_window);
      hm = profile.time_floor + (1 - profile.time_floor) * hm;
      score *= hm;
    }
    if (profile.weekday_only && !fv.is_weekday) score *= 0.5;
    score += hardwareBonus(scene.id, hw);
    scores[scene.id] = score;
  }
  return scores;
}

// 获取当前硬件状态（场景模板 + 手动覆盖）
function getCurrentHardware() {
  const scene = SCENES.find(s => s.id === state.currentScene);
  const hw = { product: state.product };
  // 先填场景模板
  Object.assign(hw, scene.hw);
  // 再应用手动覆盖
  Object.assign(hw, state.hwOverrides);
  return hw;
}

// 送达能力判断
function canDeliverVoice(hw) {
  if (hw.product === 'bluetooth_earphones') return hw.in_ear === true;
  if (hw.product === 'wearable_glasses') return hw.worn === true;
  return true;
}
function canDeliverVisual(hw) {
  if (hw.product === 'wearable_glasses') return hw.worn === true;
  if (hw.product === 'smart_speaker') return false;
  return true;
}
function notificationsBlocked(hw) { return hw.flight_mode === true; }

// 场景→模式映射（产品感知）
function mapMode(sceneId, product) {
  let mapping = { ...DEFAULT_MAPPING };
  Object.assign(mapping, PRODUCT_DEFAULTS[product] || {});
  return mapping[sceneId] || 'full_expand';
}

// 通知决策
function decideNotify(notif, sceneId, hw) {
  const mode = mapMode(sceneId, state.product);
  const config = MODE_CONFIGS[mode];
  const floor = config.disturbance_floor;
  state.stats.total++;

  // CRITICAL 永远送达
  if (notif.prio === 4) return deliver(notif, config, hw, 'critical_passthrough');
  // 飞行模式阻断
  if (notificationsBlocked(hw)) return delay(notif, 'flight_mode_blocked');
  // 优先级 >= floor
  if (notif.prio >= floor) return deliver(notif, config, hw, 'priority_above_floor');
  // 延迟
  return delay(notif, 'below_floor_delayed');
}

function deliver(notif, config, hw, reason) {
  state.stats.delivered++;
  let useVoice = config.use_voice;
  let usePopup = config.use_popup;
  if (useVoice && !canDeliverVoice(hw)) useVoice = false;
  if (usePopup && !canDeliverVisual(hw)) usePopup = false;
  if (usePopup || useVoice) state.stats.interruptions++;
  let text = notif.summary;
  if (config.content_level === 'summary') text = notif.summary + (notif.detail ? `（${notif.detail}）` : '');
  if (config.content_level === 'full') text = notif.summary + (notif.detail ? `\n${notif.detail}` : '');
  return { outcome:'delivered', notif, text, usedVoice:useVoice, reason };
}

function delay(notif, reason) {
  state.stats.delayed++;
  state.notifyQueue.push(notif);
  return { outcome:'delayed', notif, text:'', usedVoice:false, reason };
}

    </div>`).join('') + `

      <span style="color:#cbd5e1;font-size:12px;">${String(fv.hour).padStart(2,'0')}:00 ${fv.is_weekday ? '工作日' : '周末'}</span>
    </div>`;
}

function renderMetrics() {
  const accuracy = state.recognitionCount > 0 ? state.correctCount / state.recognitionCount : 0;
  const avgLat = state.latencies.length ? state.latencies.reduce((a,b)=>a+b,0) / state.latencies.length : 0;
  const reduction = state.stats.total > 0 ? 1 - state.stats.interruptions / state.stats.total : 0;
  // 功耗：根据场景占空比估算
  const dutyMap = { night_rest:0.05, office_meeting:0.10, quiet_bedroom:0.30 };
  const duty = dutyMap[state.activeScene] || 1.0;
  const battery = (duty > 0 ? 1.0 / duty : 10).toFixed(1);

  const setMetric = (id, val, ok) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'metric-value ' + (ok ? 'ok' : 'fail');
  };
  setMetric('metricAccuracy', (accuracy*100).toFixed(0) + '%', accuracy >= 0.9);
  setMetric('metricLatency', avgLat.toFixed(2) + 'ms', avgLat < 1000);
  setMetric('metricReduction', (reduction*100).toFixed(0) + '%', reduction >= 0.4);
  setMetric('metricBattery', battery + '天', battery >= 7);

  document.getElementById('statTotal').textContent = state.stats.total;
  document.getElementById('statDelivered').textContent = state.stats.delivered;
  document.getElementById('statDelayed').textContent = state.stats.delayed;
  document.getElementById('statBatched').textContent = state.stats.batched;
  document.getElementById('statLocal').textContent = state.localEvents;
}

function addNotifyLog(decision) {
  const log = document.getElementById('notifyLog');
  const outcomeMap = { delivered:'立即送达', delayed:'延迟入队', batched:'批量摘要' };
  const outcomeClass = { delivered:'delivered', delayed:'delayed', batched:'batched' };
  const item = document.createElement('div');
  item.className = 'notify-item ' + outcomeClass[decision.outcome];
  item.innerHTML = `
    <div class="notify-head">
      <span><strong>${decision.notif.summary}</strong></span>
      <span class="notify-prio p${decision.notif.prio}">${PRIO_LABELS[decision.notif.prio]}</span>
    </div>
    <div class="notify-outcome">${outcomeMap[decision.outcome]} ${decision.usedVoice ? '🔊语音' : ''} (${decision.reason})</div>
    ${decision.text ? `<div class="notify-text">${decision.text.replace(/\n/g, '<br>')}</div>` : ''}`;
  log.insertBefore(item, log.firstChild);
  // 限制日志条数
  while (log.children.length > 30) log.removeChild(log.lastChild);
}

  state.currentScene = id;
  state.hwOverrides = {};  // 切换场景时清空手动覆盖
  runRecognition();
  renderAll();
}

function toggleHw(field) {
  const hw = state.hardware || {};
  const current = hw[field] === true;
  state.hwOverrides[field] = !current;
  runRecognition();
  renderAll();
}

function runRecognition() {
  const scene = SCENES.find(s => s.id === state.currentScene);
  // 生成多帧特征并取平均（模拟迟滞）
  const t0 = performance.now();
  let bestScores = null;
  let bestFv = null;
  // 运行 4 帧，取最后一帧的识别结果（模拟稳定性窗口）
  for (let i = 0; i < 4; i++) {
    bestFv = generateFeature(scene);
    state.hardware = getCurrentHardware();
    bestScores = recognizeAll(bestFv, state.hardware);
  }
  // 找最高分场景
  let bestScene = 'unknown';
  let bestScore = -Infinity;
  for (const [id, score] of Object.entries(bestScores)) {
    if (score > bestScore) { bestScore = score; bestScene = id; }
  }
  state.activeScene = bestScene;
  state.confidence = bestScore;
  state.scores = bestScores;
  state.featureVector = bestFv;
  state.localEvents += 4;
  state.recognitionCount++;
  if (bestScene === state.currentScene) state.correctCount++;
  state.latencies.push(performance.now() - t0);
  if (state.latencies.length > 50) state.latencies.shift();
}

function submitNotify(prioKey) {
  const prioMap = { low:1, normal:2, high:3, critical:4 };
  const prio = prioMap[prioKey];
  // 随机选一个对应优先级的样本
  const candidates = SAMPLE_NOTIFS.filter(n => n.prio === prio);
  const notif = candidates[Math.floor(Math.random() * candidates.length)];
  const hw = state.hardware || {};
  const decision = decideNotify(notif, state.activeScene, hw);
  addNotifyLog(decision);
  renderMetrics();
}

function submitBatch() {
  const hw = state.hardware || {};
  for (const n of SAMPLE_NOTIFS) {
    const decision = decideNotify(n, state.activeScene, hw);
    addNotifyLog(decision);
  }
  renderMetrics();
}

function clearLog() {
  document.getElementById('notifyLog').innerHTML = '';
}

function autoDemo() {
  // 依次遍历所有场景
  let idx = 0;
  const runNext = () => {
    if (idx >= SCENES.length) {
      renderAll();
      return;
    }
    state.currentScene = SCENES[idx].id;
    state.hwOverrides = {};
    runRecognition();
    renderAll();
    idx++;
    setTimeout(runNext, 800);
  };
  runNext();
}

function resetSystem() {
  state.hwOverrides = {};
  state.notifyQueue = [];
  state.stats = { total:0, delivered:0, delayed:0, batched:0, interruptions:0 };
  state.localEvents = 0;
  state.recognitionCount = 0;
  state.correctCount = 0;
  state.latencies = [];
  clearLog();
  runRecognition();
  renderAll();
}

function renderAll() {
  renderProducts();
  renderScenes();
  renderHardware();
  renderSceneDisplay();
  renderMode();
  renderScores();
  renderFeatures();
  renderMetrics();
}

// ============================================================================
// 启动
// ============================================================================

runRecognition();
renderAll();
</script>
</body>
</html>
