<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇士大战恶龙 · 多职业对战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="bottom-panel">
        <div class="class-select">
            <button class="class-btn class-btn-active" id="classBtn0">⚔️ 战士</button>
            <button class="class-btn" id="classBtn1">🧙 法师</button>
            <button class="class-btn" id="classBtn2">✝️ 牧师</button>
            <button class="class-btn" id="classBtn3">🗡️ 盗贼</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-skill0" id="skillBtn0">⚔️ 猛击<br><small>MP 0</small></button>
            <button class="btn btn-skill1" id="skillBtn1">🌀 旋风斩<br><small>MP 15</small></button>
            <button class="btn btn-skill2" id="skillBtn2">📯 战吼<br><small>MP 10</small></button>
            <button class="btn btn-skill3" id="skillBtn3">💀 致命一击<br><small>MP 25</small></button>
            <button class="btn btn-reset" id="resetBtn">🔄 重置</button>
        </div>

        <div class="battle-log" id="logContent"></div>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
