<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 手势画笔 - 挥手之间，画你所想</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0a1a;
    --bg-secondary: #12122a;
    --bg-panel: rgba(18, 18, 42, 0.85);
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2d95;
    --neon-purple: #b44aff;
    --neon-green: #39ff14;
    --neon-yellow: #fff01f;
    --neon-orange: #ff6a00;
    --text-primary: #e8e8ff;
    --text-secondary: #8888aa;
    --border-glow: rgba(0, 240, 255, 0.3);
    --shadow-neon: 0 0 10px rgba(0, 240, 255, 0.3), 0 0 20px rgba(0, 240, 255, 0.1);
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  /* === 背景粒子效果 === */
  .bg-particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float-particle linear infinite;
    opacity: 0.3;
  }

  @keyframes float-particle {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* === 顶部 Hero === */
  .hero-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: linear-gradient(180deg, rgba(10,10,26,0.98) 0%, rgba(10,10,26,0.85) 100%);
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    border-bottom: 1px solid var(--border-glow);
  }

  .hero-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    animation: logo-pulse 3s ease-in-out infinite;
  }

  @keyframes logo-pulse {
    0%, 100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.7), 0 0 40px rgba(180, 74, 255, 0.3); }
  }

  .hero-title {
    font-size: 20px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  .hero-tagline {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 4px;
    margin-left: 8px;
  }

  .hero-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* === 模式指示器 === */
  .mode-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    font-size: 12px;
    color: var(--neon-cyan);
    cursor: pointer;
    transition: all 0.3s;
    user-select: none;
  }

  .mode-indicator:hover {
    background: rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  .mode-indicator.gesture-active {
    background: rgba(255, 45, 149, 0.15);
    border-color: rgba(255, 45, 149, 0.4);
    color: var(--neon-pink);
  }

  .mode-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--neon-cyan);
    animation: dot-blink 1.5s ease-in-out infinite;
  }

  .gesture-active .mode-dot {
    background: var(--neon-pink);
  }

  @keyframes dot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* === 主区域 === */
  .main-area {
    position: fixed;
    top: 56px; left: 0; right: 0; bottom: 0;
    display: flex;
    z-index: 1;
  }

  /* === 左侧工具栏 === */
  .toolbar {
    width: 72px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--border-glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 6px;
    overflow-y: auto;
  }

  .tool-btn {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    position: relative;
  }

  .tool-btn:hover {
    background: rgba(0, 240, 255, 0.08);
    color: var(--text-primary);
    border-color: rgba(0, 240, 255, 0.2);
  }

  .tool-btn.active {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
  }

  .tool-btn .tool-label {
    position: absolute;
    left: 58px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-5px);
    transition: all 0.2s;
    border: 1px solid var(--border-glow);
    z-index: 200;
  }

  .tool-btn:hover .tool-label {
    opacity: 1;
    transform: translateX(0);
  }

  .tool-divider {
    width: 36px;
    height: 1px;
    background: var(--border-glow);
    margin: 6px 0;
  }

  /* === 画布区域 === */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #drawCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  /* 画布网格背景 */
  .canvas-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
  }

  .canvas-grid::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(10,10,26,0.6) 100%);
  }

  /* === 右侧面板 === */
  .right-panel {
    width: 240px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border-left: 1px solid var(--border-glow);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    overflow-y: auto;
  }

  .panel-section {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .panel-title::before {
    content: '';
    width: 3px;
    height: 12px;
    background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
    border-radius: 2px;
  }

  /* === 颜色选择器 === */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s;
    position: relative;
  }

  .color-swatch:hover {
    transform: scale(1.15);
    z-index: 2;
  }

  .color-swatch.active {
    border-color: white;
    box-shadow: 0 0 12px var(--current-glow, rgba(0,240,255,0.5));
    transform: scale(1.1);
  }

  /* === 画笔大小 === */
  .brush-size-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .size-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
  }

  .size-dot {
    border-radius: 50%;
    background: var(--neon-cyan);
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  .size-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(0,240,255,0.2), rgba(0,240,255,0.5));
    outline: none;
  }

  .size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--neon-cyan);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,240,255,0.6);
    transition: box-shadow 0.2s;
  }

  .size-slider::-webkit-slider-thumb:hover {
    box-shadow: 0 0 20px rgba(0,240,255,0.8);
  }

  .size-value {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* === 绘制模式 === */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .mode-btn {
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    font-family: inherit;
  }

  .mode-btn:hover {
    background: rgba(0, 240, 255, 0.08);
    border-color: rgba(0, 240, 255, 0.2);
    color: var(--text-primary);
  }

  .mode-btn.active {
    background: rgba(0, 240, 255, 0.12);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
  }

  .mode-btn .mode-icon {
    font-size: 18px;
    display: block;
    margin-bottom: 3px;
  }

  /* === 操作按钮 === */
  .action-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }

  .btn-clear {
    background: rgba(255, 45, 149, 0.1);
    color: var(--neon-pink);
    border-color: rgba(255, 45, 149, 0.3);
  }

  .btn-clear:hover {
    background: rgba(255, 45, 149, 0.2);
    box-shadow: 0 0 15px rgba(255, 45, 149, 0.3);
  }

  .btn-save {
    background: rgba(57, 255, 20, 0.1);
    color: var(--neon-green);
    border-color: rgba(57, 255, 20, 0.3);
  }

  .btn-save:hover {
    background: rgba(57, 255, 20, 0.2);
    box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
  }

  /* === 摄像头画中画 === */
  .pip-container {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 220px;
    height: 165px;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid var(--border-glow);
    z-index: 50;
    background: var(--bg-secondary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    transition: all 0.4s;
  }

  .pip-container:hover {
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    border-color: rgba(0, 240, 255, 0.5);
  }

  .pip-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(10,10,26,0.8);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    z-index: 3;
    font-size: 10px;
    color: var(--text-secondary);
  }

  .pip-status {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .pip-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--neon-green);
    animation: dot-blink 1.2s ease-in-out infinite;
  }

  .pip-label {
    color: var(--neon-cyan);
    font-weight: 700;
    letter-spacing: 1px;
  }

  #pipCanvas {
    width: 100%;
    height: 100%;
  }

  /* === 手势追踪模拟 === */
  .hand-tracking-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* === Toast 通知 === */
  .toast {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 13px;
    color: var(--text-primary);
    z-index: 1000;
    opacity: 0;
    transition: all 0.35s;
    backdrop-filter: blur(12px);
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* === 光标跟随效果 === */
  .cursor-glow {
    position: fixed;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.15s;
    mix-blend-mode: screen;
  }

  /* === 坐标显示 === */
  .coord-display {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-secondary);
    z-index: 50;
    font-family: monospace;
    backdrop-filter: blur(8px);
  }

  /* === 笔触计数 === */
  .stroke-count {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-secondary);
    z-index: 50;
    backdrop-filter: blur(8px);
  }

  /* === 欢迎叠加层 === */
  .welcome-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10,10,26,0.95);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    transition: all 0.6s;
  }

  .welcome-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .welcome-icon {
    font-size: 64px;
    animation: welcome-float 2s ease-in-out infinite;
  }

  @keyframes welcome-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .welcome-title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
  }

  .welcome-sub {
    font-size: 16px;
    color: var(--text-secondary);
    letter-spacing: 8px;
  }

  .welcome-btn {
    margin-top: 16px;
    padding: 14px 48px;
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(180,74,255,0.2));
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 3px;
    font-family: inherit;
  }

  .welcome-btn:hover {
    background: linear-gradient(135deg, rgba(0,240,255,0.3), rgba(180,74,255,0.3));
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(180, 74, 255, 0.2);
    transform: scale(1.05);
  }

  /* === 撤销提示线 === */
  .line-preview {
    position: absolute;
    pointer-events: none;
    z-index: 10;
  }

  /* === 响应式 === */
  @media (max-width: 768px) {
    .toolbar { width: 56px; }
    .right-panel { width: 180px; padding: 10px; }
    .pip-container { width: 160px; height: 120px; }
    .hero-tagline { display: none; }
  }

  @media (max-width: 600px) {
    .right-panel { display: none; }
    .toolbar { width: 48px; }
    .tool-btn { width: 36px; height: 36px; font-size: 16px; }
  }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div class="bg-particles" id="bgParticles"></div>

<!-- 光标光晕 -->
<div class="cursor-glow" id="cursorGlow"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 欢迎层 -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-icon">✋</div>
  <div class="welcome-title">AI 手势画笔</div>
  <div class="welcome-sub">挥手之间 · 画你所想</div>
  <button class="welcome-btn" onclick="dismissWelcome()">开始创作</button>
</div>

<!-- 顶部栏 -->
<header class="hero-bar">
  <div class="hero-left">
    <div class="logo-icon">✦</div>
    <span class="hero-title">AI 手势画笔</span>
    <span class="hero-tagline">挥手之间，画你所想</span>
  </div>
  <div class="hero-right">
    <div class="mode-indicator" id="modeIndicator" onclick="toggleGestureMode()">
      <span class="mode-dot" id="modeDot"></span>
      <span id="modeText">鼠标绘画</span>
    </div>
  </div>
</header>

<!-- 主区域 -->
<div class="main-area">
  <!-- 左侧工具栏 -->
  <nav class="toolbar">
    <button class="tool-btn active" data-tool="brush" onclick="selectTool('brush')">
      ✏️<span class="tool-label">画笔</span>
    </button>
    <button class="tool-btn" data-tool="eraser" onclick="selectTool('eraser')">
      🧹<span class="tool-label">橡皮擦</span>
    </button>
    <div class="tool-divider"></div>
    <button class="tool-btn" data-tool="free" onclick="selectDrawMode('free')">
      〰️<span class="tool-label">自由绘制</span>
    </button>
    <button class="tool-btn" data-tool="line" onclick="selectDrawMode('line')">
      📏<span class="tool-label">直线</span>
    </button>
    <button class="tool-btn" data-tool="circle" onclick="selectDrawMode('circle')">
      ⭕<span class="tool-label">圆形</span>
    </button>
    <button class="tool-btn" data-tool="spray" onclick="selectDrawMode('spray')">
      💨<span class="tool-label">喷枪</span>
    </button>
    <div class="tool-divider"></div>
    <button class="tool-btn" onclick="undoLast()">
      ↩️<span class="tool-label">撤销</span>
    </button>
    <button class="tool-btn" onclick="clearCanvas()">
      🗑️<span class="tool-label">清空画布</span>
    </button>
    <button class="tool-btn" onclick="saveArtwork()">
      💾<span class="tool-label">保存作品</span>
    </button>
  </nav>

  <!-- 画布区域 -->
  <main class="canvas-area" id="canvasArea">
    <canvas id="drawCanvas"></canvas>
    <div class="canvas-grid"></div>

    <!-- 笔触计数 -->
    <div class="stroke-count" id="strokeCount">笔触: 0</div>

    <!-- 坐标显示 -->
    <div class="coord-display" id="coordDisplay">X: 0 · Y: 0</div>

    <!-- 摄像头画中画 -->
    <div class="pip-container" id="pipContainer">
      <div class="pip-header">
        <span class="pip-status">
          <span class="pip-status-dot"></span>
          <span id="pipStatusText">追踪中</span>
        </span>
        <span class="pip-label">手势追踪</span>
      </div>
      <canvas id="pipCanvas"></canvas>
    </div>
  </main>

  <!-- 右侧面板 -->
  <aside class="right-panel">
    <!-- 颜色选择 -->
    <section class="panel-section">
      <div class="panel-title">调色板</div>
      <div class="color-grid" id="colorGrid"></div>
    </section>

    <!-- 画笔大小 -->
    <section class="panel-section">
      <div class="panel-title">画笔大小</div>
      <div class="brush-size-section">
        <div class="size-preview">
          <div class="size-dot" id="sizeDot"></div>
        </div>
        <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="4">
        <div class="size-value" id="sizeValue">4px</div>
      </div>
    </section>

    <!-- 绘制模式 -->
    <section class="panel-section">
      <div class="panel-title">绘制模式</div>
      <div class="mode-grid">
        <button class="mode-btn active" data-mode="free" onclick="selectDrawMode('free')">
          <span class="mode-icon">〰️</span>自由绘制
        </button>
        <button class="mode-btn" data-mode="line" onclick="selectDrawMode('line')">
          <span class="mode-icon">📏</span>直线
        </button>
        <button class="mode-btn" data-mode="circle" onclick="selectDrawMode('circle')">
          <span class="mode-icon">⭕</span>圆形
        </button>
        <button class="mode-btn" data-mode="spray" onclick="selectDrawMode('spray')">
          <span class="mode-icon">💨</span>喷枪
        </button>
      </div>
    </section>

    <!-- 操作 -->
    <section class="panel-section">
      <div class="panel-title">操作</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="action-btn btn-clear" onclick="clearCanvas()">🗑️ 清空画布</button>
        <button class="action-btn btn-save" onclick="saveArtwork()">💾 保存作品</button>
      </div>
    </section>

    <!-- 手势说明 -->
    <section class="panel-section">
      <div class="panel-title">手势说明</div>
      <div style="font-size:11px;color:var(--text-secondary);line-height:1.8;">
        ✌️ 食指伸出 → 绘画<br>
        ✋ 五指张开 → 暂停<br>
        👊 握拳 → 橡皮擦<br>
        👌 拇指食指捏合 → 选色
      </div>
    </section>
  </aside>
</div>

<script>
// ==================== 状态管理 ====================
const state = {
  isDrawing: false,
  currentColor: '#00f0ff',
  brushSize: 4,
  drawMode: 'free', // free, line, circle, spray
  currentTool: 'brush', // brush, eraser
  gestureMode: false,
  strokeCount: 0,
  history: [],
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
};

// ==================== 颜色面板 ====================
const colors = [
  { color: '#00f0ff', name: '霓虹青', glow: 'rgba(0,240,255,0.6)' },
  { color: '#ff2d95', name: '霓虹粉', glow: 'rgba(255,45,149,0.6)' },
  { color: '#b44aff', name: '霓虹紫', glow: 'rgba(180,74,255,0.6)' },
  { color: '#39ff14', name: '霓虹绿', glow: 'rgba(57,255,20,0.6)' },
  { color: '#fff01f', name: '霓虹黄', glow: 'rgba(255,240,31,0.6)' },
  { color: '#ff6a00', name: '霓虹橙', glow: 'rgba(255,106,0,0.6)' },
  { color: '#ff3366', name: '珊瑚红', glow: 'rgba(255,51,102,0.6)' },
  { color: '#00ff88', name: '翡翠绿', glow: 'rgba(0,255,136,0.6)' },
  { color: '#6699ff', name: '天空蓝', glow: 'rgba(102,153,255,0.6)' },
  { color: '#ffffff', name: '纯白', glow: 'rgba(255,255,255,0.4)' },
];

function initColorGrid() {
  const grid = document.getElementById('colorGrid');
  colors.forEach((c, i) => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (i === 0 ? ' active' : '');
    swatch.style.background = c.color;
    swatch.style.boxShadow = `0 0 8px ${c.glow}`;
    swatch.style.setProperty('--current-glow', c.glow);
    swatch.title = c.name;
    swatch.onclick = () => selectColor(i);
    grid.appendChild(swatch);
  });
}

function selectColor(index) {
  const c = colors[index];
  state.currentColor = c.color;
  document.querySelectorAll('.color-swatch').forEach((s, i) => {
    s.classList.toggle('active', i === index);
  });
  updateSizeDot();
  updateCursorGlow();
}

// ==================== 画布初始化 ====================
let canvas, ctx, pipCanvas, pipCtx;
let tempCanvas, tempCtx; // 用于形状预览

function initCanvas() {
  canvas = document.getElementById('drawCanvas');
  ctx = canvas.getContext('2d');

  pipCanvas = document.getElementById('pipCanvas');
  pipCtx = pipCanvas.getContext('2d');

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // 临时画布（形状预览用）
  tempCanvas = document.createElement('canvas');
  tempCtx = tempCanvas.getContext('2d');
}

function resizeCanvas() {
  const area = document.getElementById('canvasArea');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = area.clientWidth * dpr;
  canvas.height = area.clientHeight * dpr;
  canvas.style.width = area.clientWidth + 'px';
  canvas.style.height = area.clientHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  tempCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 重绘历史
  redrawHistory();

  // PIP画布
  pipCanvas.width = 220;
  pipCanvas.height = 165;
}

function redrawHistory() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state.history.length > 0) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
    };
    img.src = state.history[state.history.length - 1];
  }
}

// ==================== 绘画逻辑 ====================
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  return { x, y };
}

function startDraw(e) {
  e.preventDefault();
  state.isDrawing = true;
  const pos = getPos(e);
  state.startX = pos.x;
  state.startY = pos.y;
  state.lastX = pos.x;
  state.lastY = pos.y;

  if (state.drawMode === 'free' || state.currentTool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  // 保存当前画布状态用于形状模式
  if (state.drawMode === 'line' || state.drawMode === 'circle') {
    tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
    tempCtx.drawImage(canvas, 0, 0);
  }
}

function draw(e) {
  e.preventDefault();
  const pos = getPos(e);

  // 更新坐标
  document.getElementById('coordDisplay').textContent = `X: ${Math.round(pos.x)} · Y: ${Math.round(pos.y)}`;

  // 更新光标光晕
  const glow = document.getElementById('cursorGlow');
  glow.style.left = (e.clientX - 15) + 'px';
  glow.style.top = (e.clientY - 15) + 'px';

  if (!state.isDrawing) return;

  if (state.currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = state.brushSize * 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    state.lastX = pos.x;
    state.lastY = pos.y;
    return;
  }

  const isNeon = state.currentColor !== '#ffffff';
  const glowColor = colors.find(c => c.color === state.currentColor)?.glow || 'rgba(0,240,255,0.4)';

  switch (state.drawMode) {
    case 'free':
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = state.brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = state.currentColor;

      if (isNeon) {
        ctx.shadowColor = state.currentColor;
        ctx.shadowBlur = state.brushSize * 2;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      break;

    case 'spray':
      ctx.globalCompositeOperation = 'source-over';
      if (isNeon) {
        ctx.shadowColor = state.currentColor;
        ctx.shadowBlur = 2;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = state.currentColor;
      const density = state.brushSize * 3;
      for (let i = 0; i < density; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * state.brushSize * 2;
        const sx = pos.x + Math.cos(angle) * radius;
        const sy = pos.y + Math.sin(angle) * radius;
        ctx.fillRect(sx, sy, 1, 1);
      }
      ctx.shadowBlur = 0;
      break;

    case 'line': {
      // 恢复底图然后画预览线
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
      ctx.drawImage(tempCanvas, 0, 0, canvas.width / dpr, canvas.height / dpr);
      ctx.beginPath();
      ctx.moveTo(state.startX, state.startY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = state.currentColor;
      ctx.lineWidth = state.brushSize;
      ctx.lineCap = 'round';
      if (isNeon) {
        ctx.shadowColor = state.currentColor;
        ctx.shadowBlur = state.brushSize * 2;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      break;
    }

    case 'circle': {
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
      ctx.drawImage(tempCanvas, 0, 0, canvas.width / dpr, canvas.height / dpr);
      const dx = pos.x - state.startX;
      const dy = pos.y - state.startY;
      const r = Math.sqrt(dx * dx + dy * dy);
      ctx.beginPath();
      ctx.arc(state.startX, state.startY, Math.max(1, r), 0, Math.PI * 2);
      ctx.strokeStyle = state.currentColor;
      ctx.lineWidth = state.brushSize;
      if (isNeon) {
        ctx.shadowColor = state.currentColor;
        ctx.shadowBlur = state.brushSize * 2;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      break;
    }
  }

  state.lastX = pos.x;
  state.lastY = pos.y;
}

function endDraw(e) {
  if (!state.isDrawing) return;
  state.isDrawing = false;
  ctx.shadowBlur = 0;
  ctx.beginPath();

  state.strokeCount++;
  document.getElementById('strokeCount').textContent = `笔触: ${state.strokeCount}`;

  // 保存历史
  saveToHistory();
}

function saveToHistory() {
  state.history.push(canvas.toDataURL());
  // 最多保留20步
  if (state.history.length > 20) {
    state.history.shift();
  }
}

// ==================== 工具选择 ====================
function selectTool(tool) {
  state.currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool="brush"], .tool-btn[data-tool="eraser"]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });
  canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
}

function selectDrawMode(mode) {
  state.drawMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.querySelectorAll('.tool-btn[data-tool="free"], .tool-btn[data-tool="line"], .tool-btn[data-tool="circle"], .tool-btn[data-tool="spray"]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === mode);
  });
}

// ==================== 画笔大小 ====================
function initSizeSlider() {
  const slider = document.getElementById('sizeSlider');
  slider.addEventListener('input', () => {
    state.brushSize = parseInt(slider.value);
    document.getElementById('sizeValue').textContent = state.brushSize + 'px';
    updateSizeDot();
  });
  updateSizeDot();
}

function updateSizeDot() {
  const dot = document.getElementById('sizeDot');
  const size = Math.max(4, state.brushSize);
  dot.style.width = size + 'px';
  dot.style.height = size + 'px';
  dot.style.background = state.currentColor;
  dot.style.boxShadow = `0 0 ${size}px ${state.currentColor}`;
}

function updateCursorGlow() {
  const glow = document.getElementById('cursorGlow');
  glow.style.background = `radial-gradient(circle, ${state.currentColor}44 0%, transparent 70%)`;
}

// ==================== 操作功能 ====================
function clearCanvas() {
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  state.strokeCount = 0;
  state.history = [];
  document.getElementById('strokeCount').textContent = '笔触: 0';
  showToast('画布已清空 ✨');
}

function undoLast() {
  if (state.history.length <= 1) {
    clearCanvas();
    return;
  }
  state.history.pop();
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  if (state.history.length > 0) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
    };
    img.src = state.history[state.history.length - 1];
  }
  state.strokeCount = Math.max(0, state.strokeCount - 1);
  document.getElementById('strokeCount').textContent = `笔触: ${state.strokeCount}`;
  showToast('已撤销 ↩️');
}

function saveArtwork() {
  // 创建带背景的导出画布
  const exportCanvas = document.createElement('canvas');
  const exportCtx = exportCanvas.getContext('2d');
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;

  // 绘制深色背景
  exportCtx.fillStyle = '#0a0a1a';
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  // 绘制网格
  const dpr = window.devicePixelRatio || 1;
  exportCtx.strokeStyle = 'rgba(0,240,255,0.05)';
  exportCtx.lineWidth = 1;
  for (let x = 0; x < exportCanvas.width; x += 40 * dpr) {
    exportCtx.beginPath();
    exportCtx.moveTo(x, 0);
    exportCtx.lineTo(x, exportCanvas.height);
    exportCtx.stroke();
  }
  for (let y = 0; y < exportCanvas.height; y += 40 * dpr) {
    exportCtx.beginPath();
    exportCtx.moveTo(0, y);
    exportCtx.lineTo(exportCanvas.width, y);
    exportCtx.stroke();
  }

  // 绘制画布内容
  exportCtx.drawImage(canvas, 0, 0);

  // 添加水印
  exportCtx.fillStyle = 'rgba(0,240,255,0.3)';
  exportCtx.font = `${14 * dpr}px "Noto Sans SC", sans-serif`;
  exportCtx.fillText('AI 手势画笔 ✦', 20 * dpr, exportCanvas.height - 20 * dpr);

  const link = document.createElement('a');
  link.download = `AI手势画笔_${Date.now()}.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
  showToast('作品已保存 💾');
}

// ==================== 手势模式切换 ====================
function toggleGestureMode() {
  state.gestureMode = !state.gestureMode;
  const indicator = document.getElementById('modeIndicator');
  const modeText = document.getElementById('modeText');

  if (state.gestureMode) {
    indicator.classList.add('gesture-active');
    modeText.textContent = '手势模式';
    showToast('手势模式已开启 ✋（模拟演示）');
    startHandSimulation();
  } else {
    indicator.classList.remove('gesture-active');
    modeText.textContent = '鼠标绘画';
    showToast('已切换回鼠标绘画 🖱️');
    stopHandSimulation();
  }
}

// ==================== 手势追踪模拟 ====================
let handSimInterval = null;
let handSimTime = 0;

function startHandSimulation() {
  if (handSimInterval) return;
  handSimInterval = setInterval(drawHandSimulation, 33);
}

function stopHandSimulation() {
  if (handSimInterval) {
    clearInterval(handSimInterval);
    handSimInterval = null;
  }
  // 清空PIP
  pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
  drawPipIdle();
}

function drawPipIdle() {
  pipCtx.fillStyle = '#0d0d22';
  pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);

  // 绘制摄像头噪点效果
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * pipCanvas.width;
    const y = Math.random() * pipCanvas.height;
    const brightness = Math.random() * 30 + 10;
    pipCtx.fillStyle = `rgb(${brightness},${brightness},${brightness + 10})`;
    pipCtx.fillRect(x, y, 2, 2);
  }

  // 中心文字
  pipCtx.fillStyle = 'rgba(0,240,255,0.5)';
  pipCtx.font = '11px "Noto Sans SC"';
  pipCtx.textAlign = 'center';
  pipCtx.fillText('等待手势输入...', pipCanvas.width / 2, pipCanvas.height / 2);
  pipCtx.textAlign = 'left';
}

function drawHandSimulation() {
  handSimTime += 0.033;
  const w = pipCanvas.width;
  const h = pipCanvas.height;

  // 深色背景
  pipCtx.fillStyle = '#0d0d22';
  pipCtx.fillRect(0, 0, w, h);

  // 模拟摄像头画面 - 深色+微光
  const gradient = pipCtx.createRadialGradient(w/2, h/2, 20, w/2, h/2, w/2);
  gradient.addColorStop(0, 'rgba(20,20,50,1)');
  gradient.addColorStop(1, 'rgba(10,10,26,1)');
  pipCtx.fillStyle = gradient;
  pipCtx.fillRect(0, 0, w, h);

  // 模拟手部骨架
  const handCenterX = w / 2 + Math.sin(handSimTime * 0.8) * 20;
  const handCenterY = h / 2 + Math.cos(handSimTime * 0.6) * 10 + 10;

  // 手掌中心
  const palmPoints = [
    { x: handCenterX - 15, y: handCenterY + 10 },
    { x: handCenterX + 15, y: handCenterY + 10 },
    { x: handCenterX + 18, y: handCenterY - 10 },
    { x: handCenterX - 18, y: handCenterY - 10 },
  ];

  // 绘制手掌
  pipCtx.beginPath();
  pipCtx.moveTo(palmPoints[0].x, palmPoints[0].y);
  palmPoints.forEach(p => pipCtx.lineTo(p.x, p.y));
  pipCtx.closePath();
  pipCtx.fillStyle = 'rgba(0,240,255,0.1)';
  pipCtx.fill();

  // 手指关键点
  const fingers = [
    // 拇指
    [
      { x: handCenterX - 18, y: handCenterY - 5 },
      { x: handCenterX - 28, y: handCenterY - 15 },
      { x: handCenterX - 32, y: handCenterY - 28 },
    ],
    // 食指（伸出状态 - 指向绘画）
    [
      { x: handCenterX - 10, y: handCenterY - 15 },
      { x: handCenterX - 8 + Math.sin(handSimTime * 2) * 5, y: handCenterY - 30 },
      { x: handCenterX - 6 + Math.sin(handSimTime * 2.5) * 8, y: handCenterY - 48 },
    ],
    // 中指
    [
      { x: handCenterX + 2, y: handCenterY - 15 },
      { x: handCenterX + 3, y: handCenterY - 30 },
      { x: handCenterX + 4, y: handCenterY - 45 },
    ],
    // 无名指
    [
      { x: handCenterX + 12, y: handCenterY - 13 },
      { x: handCenterX + 12, y: handCenterY - 26 },
      { x: handCenterX + 12, y: handCenterY - 38 },
    ],
    // 小指
    [
      { x: handCenterX + 18, y: handCenterY - 8 },
      { x: handCenterX + 20, y: handCenterY - 20 },
      { x: handCenterX + 21, y: handCenterY - 30 },
    ],
  ];

  // 绘制骨架线
  pipCtx.strokeStyle = 'rgba(0,240,255,0.6)';
  pipCtx.lineWidth = 1.5;

  fingers.forEach(finger => {
    pipCtx.beginPath();
    pipCtx.moveTo(handCenterX, handCenterY);
    finger.forEach(point => {
      pipCtx.lineTo(point.x, point.y);
    });
    pipCtx.stroke();
  });

  // 绘制关键点
  pipCtx.fillStyle = '#00f0ff';
  // 手腕
  drawKeypoint(handCenterX, handCenterY + 20, 3);
  // 手掌中心
  drawKeypoint(handCenterX, handCenterY, 4);
  // 手指关节
  fingers.forEach(finger => {
    finger.forEach((point, i) => {
      drawKeypoint(point.x, point.y, i === finger.length - 1 ? 3 : 2.5);
    });
  });

  // 食指尖端追踪指示
  const tipX = fingers[1][2].x;
  const tipY = fingers[1][2].y;
  pipCtx.beginPath();
  pipCtx.arc(tipX, tipY, 8, 0, Math.PI * 2);
  pipCtx.strokeStyle = 'rgba(255,45,149,0.6)';
  pipCtx.lineWidth = 1.5;
  pipCtx.stroke();

  // 手势标签
  pipCtx.fillStyle = 'rgba(255,45,149,0.8)';
  pipCtx.font = '9px "Noto Sans SC"';
  pipCtx.fillText('✌️ 绘画手势', 8, h - 8);

  // 置信度
  pipCtx.fillStyle = 'rgba(0,240,255,0.6)';
  pipCtx.font = '9px monospace';
  const conf = (0.92 + Math.sin(handSimTime) * 0.05).toFixed(2);
  pipCtx.fillText(`置信度: ${conf}`, w - 70, h - 8);

  // 在主画布上同步手势绘制（模拟）
  if (state.gestureMode && Math.random() < 0.03) {
    const canvasRect = canvas.getBoundingClientRect();
    const simX = canvasRect.width / 2 + Math.sin(handSimTime * 0.8) * canvasRect.width * 0.3;
    const simY = canvasRect.height / 2 + Math.cos(handSimTime * 0.6) * canvasRect.height * 0.2;

    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.arc(simX, simY, state.brushSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = state.currentColor;
    ctx.shadowColor = state.currentColor;
    ctx.shadowBlur = state.brushSize * 2;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawKeypoint(x, y, r) {
  pipCtx.beginPath();
  pipCtx.arc(x, y, r, 0, Math.PI * 2);
  pipCtx.fill();
  // 外环
  pipCtx.beginPath();
  pipCtx.arc(x, y, r + 2, 0, Math.PI * 2);
  pipCtx.strokeStyle = 'rgba(0,240,255,0.3)';
  pipCtx.lineWidth = 0.5;
  pipCtx.stroke();
}

// ==================== 背景粒子 ====================
function initParticles() {
  const container = document.getElementById('bgParticles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    const color = colors[Math.floor(Math.random() * colors.length)].color;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = color;
    p.style.boxShadow = `0 0 ${size * 2}px ${color}`;
    p.style.animationDuration = (Math.random() * 10 + 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== 欢迎 ====================
function dismissWelcome() {
  document.getElementById('welcomeOverlay').classList.add('hidden');
}

// ==================== 事件绑定 ====================
function bindEvents() {
  // 鼠标
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  // 触摸
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'z') {
      e.preventDefault();
      undoLast();
    }
    if (e.ctrlKey && e.key === 's') {
      e.preventDefault();
      saveArtwork();
    }
    if (e.key === 'b') selectTool('brush');
    if (e.key === 'e') selectTool('eraser');
  });

  // 光标移入画布区域
  const canvasArea = document.getElementById('canvasArea');
  canvasArea.addEventListener('mouseenter', () => {
    document.getElementById('cursorGlow').style.opacity = '1';
  });
  canvasArea.addEventListener('mouseleave', () => {
    document.getElementById('cursorGlow').style.opacity = '0';
  });
}

// ==================== 初始化 ====================
function init() {
  initCanvas();
  initColorGrid();
  initSizeSlider();
  initParticles();
  bindEvents();
  updateCursorGlow();
  drawPipIdle();

  // 初始保存空白状态
  setTimeout(() => saveToHistory(), 100);
}

window.addEventListener('load', init);
</script>
