    <style>
        /* ==================== 新中式轻国风 - CSS变量体系 ==================== */
        :root {
            --ink-deep: #1a1a2e;
            --ink-dark: #16213e;
            --dai-blue: #2c4a6e;
            --dai-blue-light: #3d5f8a;

            --rice-paper: #f5f0e8;

            --ink-gray: #4a4a4a;
            --ink-line: #8b8b7a;
            --text-dark: #2d2d2d;
            --text-body: #3d3d3d;
            --text-light: #6b6b5e;
            --shadow-soft: rgba(0, 0, 0, 0.15);
            --shadow-deep: rgba(0, 0, 0, 0.25);
        }

        /* ==================== 全局重置与基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'KaiTi';
            src: local('KaiTi'), local('STKaiti'), local('楷体');
        }

        @font-face {
            font-family: 'SimSun';
            src: local('SimSun'), local('STSong'), local('宋体');
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: var(--ink-deep);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==================== 水墨山水背景层 ==================== */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(44, 74, 110, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(22, 33, 62, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #151528 0%, #1a1a2e 30%, #16213e 100%);
        }

        /* 远山层叠 */
        .bg-mountain {
            position: absolute;
            bottom: 0;
            left: -5%;
            width: 110%;
            height: 70%;
            opacity: 0.4;
        }
        .bg-mountain svg {
            width: 100%;
            height: 100%;
        }

        /* 近山 */
        .bg-mountain-near {
            position: absolute;
            bottom: 0;
            left: -5%;
            width: 110%;
            height: 45%;
            opacity: 0.25;
        }
        .bg-mountain-near svg {
            width: 100%;
            height: 100%;
        }

        /* 浮动云纹 - 柔和弥散 */
        .cloud-pattern {
            position: absolute;
            width: 200%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse 200px 60px at 10% 20%, rgba(255,255,255,0.012) 0%, transparent 70%),
                radial-gradient(ellipse 250px 80px at 35% 50%, rgba(212,175,55,0.015) 0%, transparent 70%),
                radial-gradient(ellipse 180px 50px at 60% 30%, rgba(255,255,255,0.01) 0%, transparent 70%),
                radial-gradient(ellipse 300px 90px at 85% 60%, rgba(212,175,55,0.01) 0%, transparent 70%);
            animation: cloudDrift 180s linear infinite;
        }
        .cloud-pattern-2 {
            position: absolute;
            width: 200%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse 150px 45px at 20% 70%, rgba(255,255,255,0.008) 0%, transparent 70%),
                radial-gradient(ellipse 220px 70px at 55% 80%, rgba(44,74,110,0.03) 0%, transparent 70%),
                radial-gradient(ellipse 180px 55px at 80% 35%, rgba(255,255,255,0.008) 0%, transparent 70%);
            animation: cloudDrift 240s linear infinite reverse;
        }

        @keyframes cloudDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 古典中式角框装饰（纯CSS双线角花）- 极淡 */
        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            opacity: 0.12;
        }
        .corner-decoration.top-left { top: 15px; left: 15px; }
        .corner-decoration.top-right { top: 15px; right: 15px; }
        .corner-decoration.bottom-left { bottom: 15px; left: 15px; }
        .corner-decoration.bottom-right { bottom: 15px; right: 15px; }
        .corner-decoration::before,
        .corner-decoration::after {
            content: '';
            position: absolute;
            background: var(--gold-light);
        }
        /* 左上角 */
        .corner-decoration.top-left::before {
            top: 0; left: 0; width: 40px; height: 1.5px;
        }
        .corner-decoration.top-left::after {
            top: 0; left: 0; width: 1.5px; height: 40px;
        }
        /* 右上角 */
        .corner-decoration.top-right::before {
            top: 0; right: 0; width: 40px; height: 1.5px;
        }
        .corner-decoration.top-right::after {
            top: 0; right: 0; width: 1.5px; height: 40px;
        }
        /* 左下角 */
        .corner-decoration.bottom-left::before {
            bottom: 0; left: 0; width: 40px; height: 1.5px;
        }
        .corner-decoration.bottom-left::after {
            bottom: 0; left: 0; width: 1.5px; height: 40px;
        }
        /* 右下角 */
        .corner-decoration.bottom-right::before {
            bottom: 0; right: 0; width: 40px; height: 1.5px;
        }
        .corner-decoration.bottom-right::after {
            bottom: 0; right: 0; width: 1.5px; height: 40px;
        }

        /* 暗纹卦象背景 - 使用八卦符号（极淡） */
        .gua-watermark {
            position: absolute;
            font-size: 120px;
            color: rgba(212, 175, 55, 0.02);
            font-family: serif;
            font-weight: normal;
            user-select: none;
            line-height: 1;
        }
        .gua-watermark:nth-child(9) { top: 5%; left: 2%; animation: floatSlow 25s ease-in-out infinite; }
        .gua-watermark:nth-child(10) { top: 10%; right: 3%; animation: floatSlow 30s ease-in-out infinite reverse; font-size: 100px; }
        .gua-watermark:nth-child(11) { bottom: 20%; left: 5%; animation: floatSlow 28s ease-in-out infinite 3s; font-size: 90px; }
        .gua-watermark:nth-child(12) { bottom: 8%; right: 2%; animation: floatSlow 35s ease-in-out infinite reverse 2s; font-size: 130px; }
        .gua-watermark:nth-child(13) { top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 200px; opacity: 0.01; animation: floatSlowCenter 40s ease-in-out infinite; }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .gua-watermark:nth-child(13) {
            animation: floatSlowCenter 40s ease-in-out infinite;
        }
        @keyframes floatSlowCenter {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -51%) scale(1.01); }
        }

        /* 水墨晕染点缀 - 移除过强效果，保留极淡色晕 */

        /* 粒子效果 - 金色星尘 */
        .ink-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            animation: particleFloat 20s ease-in-out infinite;
            box-shadow: 0 0 4px rgba(212, 175, 55, 0.3);
        }

        @keyframes particleFloat {
            0%, 100% { opacity: 0; transform: translateY(0) translateX(0); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100vh) translateX(30px); }
        }

        /* ==================== 主容器 ==================== */
        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ==================== 顶部标题区 - 牌匾风格 ==================== */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            position: relative;
        }

        .plaque-frame {
            display: inline-block;
            position: relative;
            padding: 15px 50px;
            background: linear-gradient(180deg, var(--rice-paper) 0%, var(--rice-paper-dark) 100%);
            border: 3px solid var(--ink-dark);
            box-shadow: 
                0 4px 15px var(--shadow-deep),
                inset 0 0 30px rgba(139, 139, 122, 0.1);
        }

        .plaque-frame::before,
        .plaque-frame::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid var(--ink-dark);
        }
        .plaque-frame::before {
            top: -6px;
            left: -6px;
            border-right: none;
            border-bottom: none;
        }
        .plaque-frame::after {
            bottom: -6px;
            right: -6px;
            border-left: none;
            border-top: none;
        }

        .main-title {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 48px;
            font-weight: bold;
            color: var(--ink-deep);
            letter-spacing: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'SimSun', 'STSong', '宋体', serif;
            font-size: 14px;
            color: var(--ink-gray);
            letter-spacing: 4px;
        }

        /* 音乐开关按钮 - 古琴造型 */
        .music-toggle {
            position: absolute;
            top: 25px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5f0e8 0%, #ebe4d6 100%);
            border: 2px solid #2c2219;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.3);
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        .music-toggle:hover {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 1px 2px rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .music-toggle:active {
            transform: scale(0.95);
        }
        /* 古琴主体 */
        .guqin-body {
            position: relative;
            width: 42px;
            height: 12px;
            background: linear-gradient(180deg, #3d2f21 0%, #2c2219 50%, #1f1812 100%);
            border-radius: 6px;
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.15),
                0 2px 6px rgba(0,0,0,0.3);
        }
        /* 琴头（岳山） */
        .guqin-body::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 2px;
            width: 8px;
            height: 8px;
            background: linear-gradient(90deg, #4a3a2a, #3d2f21);
            border-radius: 50%;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }
        /* 琴尾 */
        .guqin-body::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 3px;
            width: 6px;
            height: 6px;
            background: linear-gradient(90deg, #3d2f21, #2c2219);
            border-radius: 2px;
        }
        /* 琴弦（5根） */
        .guqin-string {
            position: absolute;
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, #b8a898, #d4c8b8, #b8a898);
            left: 3px;
            box-shadow: 0 0 1px rgba(255,255,255,0.4);
        }
        .guqin-string:nth-child(1) { top: 2px; }
        .guqin-string:nth-child(2) { top: 4px; }
        .guqin-string:nth-child(3) { top: 6px; }
        .guqin-string:nth-child(4) { top: 8px; }
        .guqin-string:nth-child(5) { top: 10px; }
        /* 播放/暂停状态小标识 */
        .music-status {
            position: absolute;
            right: -4px;
            bottom: -4px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #d4af37;
            font-family: serif;
            z-index: 5;
            text-shadow: 0 0 4px rgba(212,175,55,0.5);
        }
        .music-toggle.playing .music-status::before {
            content: '‖';
            font-size: 12px;
            line-height: 1;
        }
        .music-toggle:not(.playing) .music-status::before {
            content: '♪';
            font-size: 12px;
            line-height: 1;
        }
        /* 播放中状态 - 琴弦振动动画 */
        .music-toggle.playing .guqin-string {
            animation: stringVibrate 0.12s ease-in-out infinite alternate;
        }
        .music-toggle.playing .guqin-string:nth-child(1) { animation-delay: 0s; }
        .music-toggle.playing .guqin-string:nth-child(2) { animation-delay: 0.04s; }
        .music-toggle.playing .guqin-string:nth-child(3) { animation-delay: 0.08s; }
        .music-toggle.playing .guqin-string:nth-child(4) { animation-delay: 0.02s; }
        @keyframes stringVibrate {
            0% { opacity: 0.8; transform: translateY(0); box-shadow: 0 0 1px rgba(255,255,255,0.3); }
            100% { opacity: 1; transform: translateY(0.5px); box-shadow: 0 0 3px rgba(255,240,200,0.6); background: linear-gradient(90deg, #d4c8b8, #f5ead8, #d4c8b8); }
        }
        .music-toggle.playing {
            border-color: var(--gold-light);
        }
        .music-toggle.playing::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid var(--gold-light);
            border-radius: 50%;
            animation: musicPulse 2s ease-in-out infinite;
            opacity: 0;
        }
        @keyframes musicPulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        /* 音量控制面板 */
        .volume-panel {
            position: absolute;
            top: 65px;
            right: 0;
            background: var(--rice-paper);
            border: 1px solid var(--ink-line);
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            white-space: nowrap;
        }
        .volume-panel.show {
            display: flex;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .volume-label {
            font-size: 12px;
            color: var(--ink-dark);
            font-family: 'KaiTi', serif;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--ink-line) 0%, var(--gold-light) 100%);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            direction: rtl;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--dai-blue);
            border: 2px solid var(--gold-light);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--dai-blue);
            border: 2px solid var(--gold-light);
            border-radius: 50%;
            cursor: pointer;
        }
        .volume-value {
            font-size: 11px;
            color: var(--dai-blue);
            min-width: 28px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .music-toggle {
                width: 48px;
                height: 48px;

            }
            .guqin-body {
                width: 32px;

            }
            .guqin-string {
                width: 27px;

            }
            .guqin-string:nth-child(1) { top: 1.5px; }
            .guqin-string:nth-child(2) { top: 3.2px; }
            .guqin-string:nth-child(3) { top: 5px; }
            .guqin-string:nth-child(4) { top: 6.7px; }
            .guqin-string:nth-child(5) { top: 8.4px; }
            .volume-panel {
                top: 55px;
                right: -5px;
            }
        }

        /* ==================== 页面切换容器 ==================== */
        .page {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ==================== 模式选择Tab - 中式书签 ==================== */
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0 25px;
        }

        .tab-btn {
            position: relative;
            padding: 12px 35px;
            background: var(--rice-paper);
            border: 2px solid var(--ink-dark);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            font-family: 'SimSun', '宋体', serif;

        .tab-btn::before {

        .tab-btn.active {
            background: var(--dai-blue);

        }
        .tab-btn.active::before {
            background: var(--dai-blue);
        }
        .tab-btn:hover:not(.active) {
            background: var(--rice-paper-dark);
            color: var(--text-dark);
        }

        /* ==================== 宣纸卡片基础样式 ==================== */
        .xuan-card {
            background: linear-gradient(135deg, var(--rice-paper) 0%, var(--rice-paper-dark) 100%);
            border: 1px solid var(--ink-line);
            border-radius: 4px;

            position: relative;

        }

        /* 卷边装饰 */
        .xuan-card::after {
            content: '';
            position: absolute;
            bottom: 0;

            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.05) 50%);

        /* ==================== 游戏品类选择网格 ==================== */
        .section-title {
            font-family: 'SimSun', '宋体', serif;
            font-size: 18px;
            color: var(--ink-deep);
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            padding: 0 20px;
        }
        .section-title::before,
        .section-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: var(--ink-line);
        }
        .section-title::before { left: calc(50% - 120px); }
        .section-title::after { right: calc(50% - 120px); }

            border: 2px solid var(--ink-line);
            border-radius: 6px;

            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--dai-blue);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px var(--shadow-soft);
            border-color: var(--dai-blue);
        }
        .category-card:hover::before {
            transform: scaleX(1);
        }
        .category-card.selected {
            border-color: var(--vermilion);
            background: linear-gradient(135deg, var(--rice-paper) 0%, rgba(194, 58, 58, 0.05) 100%);
            box-shadow: 0 0 0 2px rgba(194, 58, 58, 0.2), 0 5px 15px var(--shadow-soft);

        .category-card.selected::before {
            background: var(--vermilion);

        }

            margin-bottom: 8px;
        }
        .category-name {

            font-size: 13px;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* ==================== 参数设置区 ==================== */
        .params-section {

            margin: 0 auto 25px;
        }

        .param-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;

        }

        .param-label {
            font-family: 'SimSun', '宋体', serif;
            font-size: 14px;
            color: var(--text-dark);
            min-width: 90px;

            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s ease;

            border-color: var(--dai-blue);
            color: var(--dai-blue);

            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

            max-height: 500px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .btn-primary {
            position: relative;
            padding: 14px 45px;
            background: var(--dai-blue);
            color: var(--rice-paper);
            border: 2px solid var(--ink-deep);
            border-radius: 4px;
            font-family: 'SimSun', '宋体', serif;
            font-size: 18px;
            letter-spacing: 4px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(44, 74, 110, 0.3);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }
        .btn-primary:hover {
            background: var(--vermilion);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(194, 58, 58, 0.35);
        }

            left: 100%;
        }
        .btn-primary:active {
            transform: translateY(0);
        }

            position: absolute;

            pointer-events: none;

            padding: 14px 30px;

            border-radius: 4px;
            font-family: 'SimSun', '宋体', serif;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;

        }
        .btn-secondary:hover {
            background: rgba(44, 74, 110, 0.1);
            color: var(--dai-blue);
            border-color: var(--dai-blue);
        }

            font-size: 14px;
            font-family: inherit;

    <script>
    // ================================================================
    // ==================== 【古琴+箫 合奏合成器 - Web Audio API】 ====================
    // ================================================================
    let audioCtx = null;
    let masterGain = null;
    let isMusicPlaying = false;
    let melodyTimeout = null;

    function initAudioContext() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0;
            masterGain.connect(audioCtx.destination);
        } catch(e) {
            console.log('Web Audio API not supported');
        }
    }

    // 创建古琴风格的音符（三角波+低通滤波，带泛音）
    function createGuqinNote(freq, startTime, duration, volume) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = freq * 4;
        filter.Q.value = 2;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration);
        // 泛音
        const harmonic = audioCtx.createOscillator();
        const harmonicGain = audioCtx.createGain();
        harmonic.type = 'sine';
        harmonic.frequency.value = freq * 2;
        harmonicGain.gain.setValueAtTime(0, startTime);
        harmonicGain.gain.linearRampToValueAtTime(volume * 0.2, startTime + 0.03);
        harmonicGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.5);
        harmonic.connect(harmonicGain);
        harmonicGain.connect(masterGain);
        harmonic.start(startTime);
        harmonic.stop(startTime + duration);
    }

    // 创建箫风格音符（正弦波，高频飘逸，延音悠长）
    function createXiaoNote(freq, startTime, duration, volume) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.value = freq;
        // 箫音色：带通滤波，强调中高频
        filter.type = 'bandpass';
        filter.frequency.value = freq * 1.5;
        filter.Q.value = 0.8;
        // 箫包络：渐变起音，自然衰减
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.15);
        gain.gain.setValueAtTime(volume, startTime + duration * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    // 五声音阶频率
    const PENTA = {
        C3: 130.81, D3: 146.83, E3: 164.81, G3: 196.00, A3: 220.00,
        C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.00,
        C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00
    };

    // 古琴旋律（主旋律）
    const GUQIN_MELODY = [
        [{ note: PENTA.C4, dur: 1.5, vol: 0.35 }, { note: PENTA.D4, dur: 0.8, vol: 0.32 }, { note: PENTA.E4, dur: 1.8, vol: 0.38 }, { note: PENTA.G4, dur: 1.2, vol: 0.35 }, { note: PENTA.A4, dur: 2.2, vol: 0.36 }, { note: PENTA.G4, dur: 1.0, vol: 0.30 }, { note: PENTA.E4, dur: 1.5, vol: 0.32 }, { note: PENTA.C4, dur: 2.8, vol: 0.34 }],
        [{ note: PENTA.E4, dur: 1.2, vol: 0.34 }, { note: PENTA.G4, dur: 0.8, vol: 0.36 }, { note: PENTA.A4, dur: 1.5, vol: 0.38 }, { note: PENTA.C5, dur: 1.8, vol: 0.40 }, { note: PENTA.A4, dur: 1.0, vol: 0.32 }, { note: PENTA.G4, dur: 1.2, vol: 0.34 }, { note: PENTA.E4, dur: 1.0, vol: 0.32 }, { note: PENTA.D4, dur: 2.5, vol: 0.30 }],
        [{ note: PENTA.A3, dur: 1.8, vol: 0.32 }, { note: PENTA.C4, dur: 1.0, vol: 0.34 }, { note: PENTA.D4, dur: 1.2, vol: 0.32 }, { note: PENTA.E4, dur: 1.8, vol: 0.36 }, { note: PENTA.D4, dur: 1.0, vol: 0.32 }, { note: PENTA.C4, dur: 1.5, vol: 0.34 }, { note: PENTA.A3, dur: 2.8, vol: 0.30 }],
        [{ note: PENTA.G4, dur: 1.2, vol: 0.36 }, { note: PENTA.A4, dur: 0.8, vol: 0.38 }, { note: PENTA.C5, dur: 1.5, vol: 0.40 }, { note: PENTA.D5, dur: 1.2, vol: 0.38 }, { note: PENTA.C5, dur: 1.8, vol: 0.36 }, { note: PENTA.A4, dur: 1.2, vol: 0.32 }, { note: PENTA.G4, dur: 2.5, vol: 0.34 }],
    ];

    let currentPhraseIndex = 0;
    let currentNoteIndex = 0;
    let currentVolume = 0.7; // 默认音量70%

    function setVolume(val) {
        currentVolume = val / 100;
        const volDisplay = document.getElementById('volumeValue');
        if (volDisplay) volDisplay.textContent = val;
        const slider = document.getElementById('volumeSlider');
        if (slider) {
            // 更新滑条背景
            const pct = val;
            slider.style.background = `linear-gradient(90deg, var(--gold-light) 0%, var(--gold-light) ${pct}%, var(--ink-line) ${pct}%, var(--ink-line) 100%)`;
        }
        // 实时调整masterGain（如果正在播放）
        if (audioCtx && masterGain && isMusicPlaying) {
            const now = audioCtx.currentTime;
            masterGain.gain.cancelScheduledValues(now);
            masterGain.gain.setValueAtTime(masterGain.gain.value, now);
            masterGain.gain.linearRampToValueAtTime(currentVolume, now + 0.1);
        }
    }

    function toggleVolumePanel() {
        const panel = document.getElementById('volumePanel');
        if (isMusicPlaying) {
            panel.classList.toggle('show');
        }
    }

    function playNextNote() {
        if (!isMusicPlaying || !audioCtx) return;
        
        const qinPhrase = GUQIN_MELODY[currentPhraseIndex];
        const xiaoPhrase = XIAO_MELODY[currentPhraseIndex];
        const qinNote = qinPhrase[currentNoteIndex];
        const xiaoNote = xiaoPhrase[currentNoteIndex];
        
        // 古琴主音（note.vol已经是合理的绝对音量，masterGain控制总音量）
        createGuqinNote(qinNote.note, audioCtx.currentTime, qinNote.dur, qinNote.vol);
        // 箫和声
        createXiaoNote(xiaoNote.note, audioCtx.currentTime, xiaoNote.dur, xiaoNote.vol);
        
        currentNoteIndex++;
        
        if (currentNoteIndex >= qinPhrase.length) {
            currentNoteIndex = 0;
            currentPhraseIndex = (currentPhraseIndex + 1) % GUQIN_MELODY.length;
            melodyTimeout = setTimeout(playNextNote, 1800 + Math.random() * 800);
        } else {
            const gap = qinNote.dur * 0.25 + Math.random() * 0.15;
            melodyTimeout = setTimeout(playNextNote, gap * 1000);
        }
    }

    async function startGuqinMusic() {
        initAudioContext();
        if (!audioCtx) return;
        
        // 确保AudioContext处于运行状态
        if (audioCtx.state === 'suspended') {
            try {
                await audioCtx.resume();
            } catch(e) {
                console.log('AudioContext resume failed:', e);
            }
        }
        
        // 等待一小段时间确保context完全运行
        await new Promise(resolve => setTimeout(resolve, 50));
        
        // 淡入 - masterGain从0渐变到currentVolume
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        const now = audioCtx.currentTime;
        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(currentVolume, now + 1.2);
        
        currentPhraseIndex = 0;
        currentNoteIndex = 0;
        
        // 清除已有定时器
        if (melodyTimeout) {
            clearTimeout(melodyTimeout);
            melodyTimeout = null;
        }
        
        // 首音符延迟一点点开始，让淡入生效
        setTimeout(() => {
            if (isMusicPlaying) playNextNote();
        }, 100);
        
        isMusicPlaying = true;
    }

    function stopGuqinMusic() {
        if (!audioCtx || !masterGain) return;
        
        const now = audioCtx.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0, now + 0.8);
        
        if (melodyTimeout) {
            clearTimeout(melodyTimeout);
            melodyTimeout = null;
        }
        
        // 延迟设置isMusicPlaying，让淡出完成
        setTimeout(() => {
            isMusicPlaying = false;
        }, 900);
    }

    function toggleMusic() {
        const btn = document.getElementById('musicToggle');
        
        if (isMusicPlaying) {
            stopGuqinMusic();
            btn.classList.remove('playing');
            btn.title = '古琴箫音（点击开启）';
            // 隐藏音量面板
            document.getElementById('volumePanel').classList.remove('show');
        } else {
            startGuqinMusic();
            btn.classList.add('playing');
            btn.title = '古琴箫音（点击关闭）';
            // 播放后显示音量面板一小会儿提示用户
            setTimeout(() => {
                const panel = document.getElementById('volumePanel');
                if (panel && isMusicPlaying) {
                    panel.classList.add('show');
                    setTimeout(() => panel.classList.remove('show'), 3000);
                }
            }, 300);
        }
    }

    // 首次交互尝试播放
    let firstInteractBound = false;
    function tryAutoPlayMusic() {
        if (firstInteractBound || isMusicPlaying) return;
        firstInteractBound = true;
        const handler = () => {
            if (!isMusicPlaying) {
                startGuqinMusic();
                if (isMusicPlaying) {
                    document.getElementById('musicToggle').classList.add('playing');
                    document.getElementById('musicToggle').title = '古琴箫音（点击关闭）';
                }
            }
            document.removeEventListener('click', handler);
            document.removeEventListener('touchstart', handler);
        };
        document.addEventListener('click', handler, { once: true });
        document.addEventListener('touchstart', handler, { once: true, passive: true });
    }

    const TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    // 地支（前面已定义DIZHI）
    // 生肖
    const SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

    function solarToLunar(year, month, day) {
        let i, leap = 0, temp = 0;
        const baseDate = new Date(1900, 0, 31);
        const objDate = new Date(year, month - 1, day);
        let offset = Math.floor((objDate - baseDate) / 86400000);
        
        let lunarYear = 1900;
        for (i = 1900; i < 2101 && offset > 0; i++) {
            temp = lYearDays(i);
            offset -= temp;
            lunarYear++;
        }
        if (offset < 0) { offset += temp; lunarYear--; }

        let leapM = getLeapMonth(lunarYear);
        let isLeap = false;
        let lunarMonth = 1;
        for (i = 1; i < 13 && offset > 0; i++) {
            if (leapM > 0 && i === (leapM + 1) && !isLeap) {
                --i; isLeap = true; temp = getLeapDays(lunarYear);
            } else {
                temp = getMonthDays(lunarYear, i);
            }
            if (isLeap && i === (leapM + 1)) isLeap = false;
            offset -= temp;
            if (!isLeap) lunarMonth++;
        }
        if (offset === 0 && leapM > 0 && i === leapM + 1) {
            if (isLeap) { isLeap = false; } else { isLeap = true; --lunarMonth; }
        }
        if (offset < 0) { offset += temp; --lunarMonth; }

        let lunarDay = offset + 1;

        // 计算天干地支年
        const ganIndex = (lunarYear - 4) % 10;
        const zhiIndex = (lunarYear - 4) % 12;
        const yearGanZhi = TIANGAN[ganIndex] + DIZHI[zhiIndex];
        const yearZhi = DIZHI[zhiIndex];

        return {
            year: lunarYear,
            month: lunarMonth,
            day: lunarDay,
            yearGanZhi: yearGanZhi,
            yearZhi: yearZhi,
            shengxiao: SHENGXIAO[zhiIndex]
        };
    }

    function lYearDays(y) {
        let sum = 348;
        for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        return sum + getLeapDays(y);
    }
    function getLeapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
    function getLeapDays(y) {
        if (getLeapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        return 0;
    }
    function getMonthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

    // 获取时辰地支
    function getShichen(hour) {
        if (hour === 23 || hour === 0) return '子';
        for (let s of SHICHEN) {
            if (hour >= s.start && hour < s.end) return s.name;
        }
        return '子';
    }

    // 获取当前干支时间信息
    function getCurrentGanZhi(date) {
        date = date || new Date();
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hour = date.getHours();

        const lunar = solarToLunar(year, month, day);
        const shichen = getShichen(hour);

        return {
            year: year,
            month: month,
            day: day,
            hour: hour,
            lunarYear: lunar.year,
            lunarMonth: lunar.month,
            lunarDay: lunar.day,
            yearGanZhi: lunar.yearGanZhi,
            yearZhi: lunar.yearZhi,
            shichen: shichen,
            shichenNum: DIZHI_NUM[shichen],
            yearZhiNum: DIZHI_NUM[lunar.yearZhi],
            shengxiao: lunar.shengxiao
        };
    }

    // ---------- 梅花易数时间起卦核心算法 ----------
    function meihuaDivine(ganzhiInfo) {
        const { yearZhiNum, lunarMonth, lunarDay, shichenNum } = ganzhiInfo;

        // 上卦：(年+月+日) mod 8，余0为8（坤）
        let shangguaNum = (yearZhiNum + lunarMonth + lunarDay) % 8;
        if (shangguaNum === 0) shangguaNum = 8;

        // 下卦：(年+月+日+时) mod 8
        let xiaguaNum = (yearZhiNum + lunarMonth + lunarDay + shichenNum) % 8;
        if (xiaguaNum === 0) xiaguaNum = 8;

        // 动爻：(年+月+日+时) mod 6，余0为6
        let dongyao = (yearZhiNum + lunarMonth + lunarDay + shichenNum) % 6;
        if (dongyao === 0) dongyao = 6;

        const guaKey = shangguaNum + '-' + xiaguaNum;
        const guaInfo = LIUSHSIGUA[guaKey] || LIUSHSIGUA['1-1'];

        // 构建六爻（从下到上：初爻到上爻）
        const shangYao = BAGUA_TRIGRAMS[shangguaNum].yao; // 上卦三爻
        const xiaYao = BAGUA_TRIGRAMS[xiaguaNum].yao;    // 下卦三爻
        // 六爻数组顺序[初爻,二爻,三爻,四爻,五爻,上爻]
        const liuyao = [...xiaYao, ...shangYao];

        return {
            shanggua: shangguaNum,
            xiagua: xiaguaNum,
            dongyao: dongyao,
            guaKey: guaKey,
            guaInfo: guaInfo,
            liuyao: liuyao,
            calc: {
                yearZhiNum, lunarMonth, lunarDay, shichenNum,
                shangguaSum: yearZhiNum + lunarMonth + lunarDay,
                xiaguaSum: yearZhiNum + lunarMonth + lunarDay + shichenNum,
                dongyaoSum: yearZhiNum + lunarMonth + lunarDay + shichenNum
            }
        };
    }

    // 绑定事件
    function bindEvents() {
        // 模式切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });

        // 起卦按钮
        document.getElementById('divineBtn').addEventListener('click', () => doDivine(false));
        document.getElementById('randomBtn').addEventListener('click', () => doDivine(true));

        // 按钮墨晕效果
        document.querySelectorAll('.btn-primary').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ink-ripple';
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // 音乐开关
        document.getElementById('musicToggle').addEventListener('click', function(e) {
            // 点击音量面板或滑块时不触发toggle
            if (e.target.closest('#volumePanel')) return;
            toggleMusic();

        document.getElementById('musicToggle').addEventListener('contextmenu', function(e) {

        volSlider.addEventListener('input', function() {

    // 执行起卦
    function doDivine(isRandom) {
        if (!selectedCategory && !isRandom) {
            alert('请先选择一个游戏品类');
            return;
        }

        // 获取房间号和队友名字
        const roomNumber = document.getElementById('roomNumber').value.trim();
        const teammateName = document.getElementById('teammateName').value.trim();

        // 显示起卦动画
        const overlay = document.getElementById('diviningOverlay');
        overlay.classList.add('show');

        // 模拟起卦过程
        setTimeout(() => {
            const teamSize = parseInt(document.getElementById('teamSize').value);
            let ganzhiInfo = getCurrentGanZhi(new Date());
            let divineResult;
            
            if (isRandom) {
                // 随机起卦：随机一个时间
                const randomDate = new Date();
                randomDate.setHours(Math.floor(Math.random() * 24));
                randomDate.setDate(randomDate.getDate() - Math.floor(Math.random() * 30));
                ganzhiInfo = getCurrentGanZhi(randomDate);
                if (!selectedCategory) {
                    selectedCategory = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)].id;
                }
                divineResult = meihuaDivine(ganzhiInfo);
                divineResult.divineMethod = 'random';
            } else {
                // 时间起卦（梅花易数）
                divineResult = meihuaDivine(ganzhiInfo);
                divineResult.divineMethod = 'time';
            }

            // ---- 房间号 + 队友名字 融入卦象参数 ----
            const nameParam = computeNameParam(teammateName);
            const roomParam = computeRoomParam(roomNumber);
            divineResult.nameParam = nameParam;
            divineResult.roomParam = roomParam;

            const extraParams = currentMode === 'detail' ? {
                birthData: document.getElementById('birthData').value,
                teamStatus: document.getElementById('teamStatus').value,
                matchGoal: document.getElementById('matchGoal').value,
                divineMethod: divineResult.divineMethod,
                roomNumber: roomNumber,
                teammateName: teammateName,
                nameParam: nameParam,
                roomParam: roomParam
            } : { divineMethod: divineResult.divineMethod };
            const tactics = analyzeGuaAndTactics(divineResult, selectedCategory, teamSize, extraParams);

            lastResult = {
                mode: currentMode,
                category: selectedCategory,
                categoryName: TACTICS_DB[selectedCategory].name,
                teamSize: teamSize,
                ganzhi: ganzhiInfo,
                divine: divineResult,
                tactics: tactics,
                isRandom: isRandom,
                divineMethod: divineResult.divineMethod,
                roomNumber: roomNumber,
                teammateName: teammateName,
                nameParam: nameParam,
                roomParam: roomParam
            };

            overlay.classList.remove('show');

            // 渲染结果
            if (currentMode === 'quick') {
                renderQuickResult();
            } else {
                renderDetailResult();
            }
        }, 1500);
    }

    // 计算队友名字的参数（按汉字笔画/Unicode编码取数）
    function computeNameParam(name) {
        if (!name) return null;
        let total = 0;
        for (let i = 0; i < name.length; i++) {
            total += name.charCodeAt(i);
        }
        const nameNum = total % 8;
        const nameWuXing = ['土','金','金','火','木','木','水','土'][nameNum];
        const nameGua = ['坤','乾','兑','离','震','巽','坎','艮'][nameNum];
        const nameNature = ['柔顺承载','刚健进取','悦和交际','光明热烈','动奋有力','入顺灵活','险陷深沉','止静稳重'][nameNum];
        return { raw: total, mod: nameNum, wuxing: nameWuXing, gua: nameGua, nature: nameNature, text: name };
    }

    // 计算房间号的参数
    function computeRoomParam(room) {
        if (!room) return null;
        const digits = room.replace(/[^0-9]/g, '');
        if (!digits || digits.length < 1) return null;
        let sum = 0;
        for (let c of digits) sum += parseInt(c);
        const roomMod = sum % 8;
        const roomJiXiong = roomMod <= 2 ? '吉' : (roomMod <= 5 ? '中平' : '需谨慎');
        return { raw: room, sum: sum, mod: roomMod, jixiong: roomJiXiong };
    }

            <div class="share-section" style="animation: fadeInUp 0.5s ease 0.9s both;">
                <button class="btn-share" onclick="generateShareText()">生成分享文案</button>
            </div>
        `;

        showPage('detailResultPage');
    }

    // 切换页面
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 返回首页
    function goHome() {
        showPage('homePage');
    }

    // 生成分享文案
    function generateShareText() {
        if (!lastResult) return;
        const { tactics, categoryName, teamSize, isRandom } = lastResult;
        const teamText = ['单排','双排','三排','四排','五排'][teamSize-1];
        
        const text = `【电竞卦师】${categoryName}${teamText}占得「${tactics.guaName}」\n\n` +
            `核心战术：${tactics.coreTactic}\n\n` +
            `✅宜：${tactics.doList.join('、')}\n` +
            `❌忌：${tactics.dontList.join('、')}\n\n` +
            `⚠️${tactics.keyWarning}\n\n` +
            `运势：${tactics.fortune}分 | 方位：${tactics.direction}\n` +
            `签文：${tactics.qianwen}\n\n` +
            `——${isRandom ? '随机起卦' : '诚心起卦'}，仅供娱乐`;

        document.getElementById('shareText').value = text;
        document.getElementById('shareModal').classList.add('show');
    }

    // 关闭分享弹窗
    function closeShareModal() {
        document.getElementById('shareModal').classList.remove('show');
    }

    // 复制文案
    function copyShareText() {
        const textarea = document.getElementById('shareText');
        textarea.select();
        try {
            document.execCommand('copy');
            alert('文案已复制到剪贴板！');
        } catch(e) {
            alert('复制失败，请手动复制');
        }
    }

    // 点击弹窗外部关闭
    document.getElementById('shareModal').addEventListener('click', function(e) {
        if (e.target === this) closeShareModal();
    });

    // 初始化应用
    init();
    // 绑定首次交互自动尝试播放音乐
    tryAutoPlayMusic();

    // ================================================================
    // ==================== 【页面渲染与交互区 - 结束】 ====================
    // ================================================================
    </script>
</body>
</html>
