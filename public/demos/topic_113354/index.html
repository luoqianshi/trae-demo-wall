    <div class="form-group">
      <label for="keyPoints">课程重点</label>
      <textarea id="keyPoints" rows="5" placeholder="请输入课程重点">1.Modbus协议的主从通信流程；2.Modbus报文格式的解析与构造。

3.Modbus协议在不同物理介质上的实现差异；4.通信错误的诊断与解决。</textarea>

    <div class="form-group">
      <label for="reference">参考文件内容</label>
      <textarea id="reference" rows="8" placeholder="请输入参考文件内容">同学们，今天咱们来好好讲讲 Modbus 协议的工作过程。Modbus 协议就好像是工业设备之间沟通的 "桥梁"，它有着自己独特的工作方式，让主设备和从设备能够有条不紊地交流信息。那它是怎么工作的呢？别急，咱们一步一步来。

一、Modbus 协议的通信模式

Modbus 协议采用的是主从通信模式，这就像是课堂上老师和同学们的互动。主站就像是老师，它发起 "话题"，也就是启动数据传输，这个过程被称为查询。而其他设备呢，就是从站，扮演着学生的角色，得等着老师提问，然后对老师的问题做出回应，或者按照老师的要求去完成相应的动作。

典型的主站设备通常包括主处理器和编程器，而从站则种类繁多，像是各种各样的传感器、变频器、智能仪表等。主站可以对各个从站进行寻址，就像是老师点名一样，叫到哪个从站，哪个从站就回应。当然了，主站也可以发出广播信息，这就像是老师对全班同学说话，但和点名不同的是，从站对于这种广播查询一般是不会返回响应的。

二、主站查询格式

这个主站查询格式就像是老师提问时遵循的规范，它是根据设备地址、请求功能代码、发送数据、错误校验码这些要素来建立的。设备地址就相当于学生的学号，主站要明确它的问题是给哪个从站的；请求功能代码呢，就像是问题的类型，告诉从站需要它做什么动作；发送数据呢，就是问题的具体内容，可能会包含一些详细的要求；错误校验码呢，则是为了保证信息的完整性，就像是给问题加上了一个校验的 "标签"。

比如说，功能代码 03 就像是老师让学生去查询自己的成绩记录。从站接到这个指令后，就得按照要求去读取保持寄存器的内容，并用寄存器的内容来作为响应。这里的数据区就包含了读取寄存器的起始地址以及数量这些关键信息，就像是老师告诉学生从哪一页开始查，查几页成绩记录一样。而错误校验区的信息呢，就像是给学生提供了一种检查作业是否完整的办法，以确保信息内容的完整性。

三、从站响应格式

从站的响应信息也是按照 Modbus 协议来组织的，就像是学生的回答一样。正常情况下，响应功能码就是对查询功能码的应答，这就像是学生在回答问题时，先表明自己知道老师问的是什么类型的问题。数据字节呢，就包含了从站采集到的数据，比如说寄存器值或者状态这些具体的信息，就像是学生把自己的成绩或者学习情况告诉老师。不过，如果在接收信息的时候出现错误，或者从站不能执行主站要求的动作，那从站就会组织一个错误信息，并向主站发送作为响应。这种时候，功能码就会被修改，来指明这是一个错误响应，而且在数据字节中会含有一个代码，来说明具体的错误原因，这就像是学生在回答问题时，先说自己没听懂问题或者遇到了什么困难，然后解释一下原因。错误检查区呢，允许主站确认收到的是有效的信息内容，就像是老师通过学生的回答来判断这个学生是不是真的理解了问题并做出了合理的回答。

四、Modbus 协议的传输方式

Modbus 协议呢，它比较灵活，包括 ASCII、RTU（Remote Terminal Unit）、TCP 等传送方式，而且它并没有规定物理层，这就像是不同场景下老师可以选择不同的方式和同学们交流，比如当面讲、写在黑板上或者通过校园广播等等。这个协议主要定义了控制器能够认识和使用的消息结构，不管这些消息是通过哪种网络进行通信的。

不过，为了确保信息传输的可靠性，Modbus 协议需要对数据进行校验。在串行协议中，除了奇偶校验外，ASCII 模式采用 LRC 校验，RTU 模式采用 16 位 CRC 校验，而 TCP 模式没有额外规定校验，因为 TCP 本身就有一定的校验机制了。RTU 和 ASCII 这两种方式一般基于 RS-485，选择哪种方式呢，这得看对通信速度的要求，速度快的就用 RTU 方式，对通信速度要求不高的就可以用 ASCII 方式。

比如说，RTU 方式就像是快速传递信息的特快专递，速度快，效率高；而 ASCII 方式呢，更像是普通的平信，虽然速度慢一些，但也有自己的优势，比如在一些对数据可读性要求较高的场景下比较有用。在通信过程中，每组通信字符串要有开始的标记和结束的标记，这就像是写信的时候开头的称呼和结尾的署名一样，让接收方能够明确地识别出信息的开始和结束。

五、实际例子分析

举个例子来说吧，要是要求 6 号从站向主站传送其从保持型模拟量存储器地址 &h006B 后的 3 个数据，在 RTU 方式下，该指令字符串的字节如下：十六进制 06 03 00 6B 00 03 75 (CRC) A0 (CRC)。而在 ASCII 方式下，按照 ASCII 字码表，ASCII 方式的格式如表 4-3 所示，具体字节会更多一些。双向数据总是以从站地址编号开头的，这就像是每个学生的回答都要先表明自己的身份一样。在同一网络中，每个从站只对发给自己，也就是以自己的编号为开头的指令做出反应，而对发给其他从站的指令呢，就像是听到别人名字的时候一样，视而不见。当主站发的通信请求指令字符串以 00 为开头时，这就不是通信请求指令，而是一个通知型指令，这个通知指令将会被所有的从站接收，这就像是老师对全班同学说的一条重要通知一样。

同学们，今天我们一起深入学习了 Modbus 协议的工作过程，从它的通信模式、主站查询格式、从站响应格式、传输方式到实际例子分析。

Modbus 协议有着严格的主从通信规则和信息格式，这就像是我们生活中各种规则一样。在社会中，我们也要遵守各种规则，比如交通规则、法律法规等，只有大家都遵守规则，社会才能有序地运转。我们每个人都应该树立规则意识，自觉遵守规则，维护社会的秩序。

这节课就到这里啦，谢谢大家！</textarea>

rong>教学内容</strong></p></td><td><p><strong>教师活动</strong></p></td><td colspan="2"><p><strong>学生活动</strong></p></td><td><p><strong>设计意图</strong></p></td></tr><tr><td colspan="5"><ol><li><strong>课前准备：</strong></li></ol><p>教师教学准备，学生分组。</p></td><td><p>课前发布任务。</p></td><td colspan="2"><p>学生通过网络教学平台熟悉课程内容。</p></td><td><p>1. 提高学生学习兴趣及安全意识；</p><p>2. 合理分组，通过成绩好同学带动小组学习。</p></td></tr><tr><td colspan="5"><ol><li><strong>组织教学</strong>（3′）</li></ol></td><td><p>1.考勤；</p><p>2.强调有关纪律要求。</p></td><td colspan="2"><p>认真听老师强调相关要求。</p></td><td><p>思政点：</p><p>规范学生行为，加强自我认知教育。</p></td></tr><tr><td colspan="5"><p><strong>三、创设情境，导入新课</strong>（18′）</p><p><strong>播放视频：</strong>PLC的在生活生产中的实际应用。</p><p></p></td><td><p>1.播放视频；2.教师引入学习内容，明确学习目标。</p></td><td colspan="2"><p>1.观看视频；</p><p>2.观看教师实际演练。</p></td><td><p>激发学生的学习兴趣。</p></td></tr><tr><td rowspan="4"><p><strong>教</strong></p><p><strong>学</strong></p><p><strong>过</strong></p><p><strong>程</strong></p></td><td colspan="5"><p><strong>四、任务分析讲解</strong>（90′）</p><p></p><p>任务内容:</p><p>1.函数及函数快的定义；</p><p>2.函数及函数快的调用；</p><p>3.函数及函数快在实际中的应用。</p></td><td><p>结合教师在博图软件上的演示，帮助学生分析理解任务，提出重点与难点。</p></td><td colspan="2"><p>理解任务内容与要求。</p></td><td><p>引导学生进行思考，培养学生的分析能力，明确本节课的学习任务。</p></td></tr><tr><td colspan="5"><p><strong>五、项目实施</strong></p><p><strong>实操：</strong>（135′）</p><p>1.使用函数FC完成两种电动机连续运行控制的程序编写及仿真调试；</p><p>2.使用函数块FB完成电动机及抱闸控制系统的程序编写及仿真调试。</p></td><td><p>组织和辅导各小组完成制作任务。</p></td><td colspan="2"><p>1. 各小组组长带领组员进行分工协作，完成任务分析及任务制作；</p><p>2.小组组长自评、互评。</p></td><td><p>突破难点，培养学生运用所学知识解决实际问题的职业技能。</p></td></tr><tr><td colspan="5"><p><strong>六、项目评价</strong>（20′）</p><p><strong>（一）小组自评；</strong></p><p><strong>（二）小组互评；</strong></p><p><strong>（三）教师点评。</strong></p><p><strong>（四）综合评比。</strong>评选出最佳小组。</p></td><td><p>1.组织小组自评、互评；</p><p>2.对各小组进行点评；</p><p>3.评选最佳小组。</p></td><td colspan="2"><p>1.小组自评；</p><p>2.小组互评。</p></td><td><p>通过评价活动，培养学生的口头表达能力，提高学生的自信心。</p></td></tr><tr><td colspan="5"><p><strong>七、小结</strong>（5′）</p><p></p></td><td><p>对本节课主要内容进行总结。</p></td><td colspan="2"><p>认真总结本节课所学的知识与技能。</p></td><td><p>突出重点、难点，加深对所学知识的理解。</p></td></tr><tr><td colspan="2"><p><strong>知识点 链接</strong></p></td><td colspan="8"><p>一、函数（FC）</p><p>1.定义</p><p>函数，又称为功能英文简称FC，是用户编写能够完成特定任务的程序块，类似于子程序。FC的特点是没有固定的存储区，功能执行结束后，其局部变量中的临时数据就会丢失，解决这一问题的办法是可以用全局变量来存储那些在功能执行结果后需要保存的数据。</p><p>2.生成FC</p><p>（1）打开博图软件的项目视图中的文件夹"\PLC-1\程序块"，用鼠标双击其中的"添加新块"对话框。</p><p>（2）单击"FC"按钮，按"确定"，生成默认名称为"块-1[FC1]"函数。</p><p>3.生成FC的局部数据</p><p>局域变量表里有：Input（输入参数）、Output（输出参数）、In_Out（输入/输出参数）、Temp（临时数据）、Return（返回值Ret_Val）。</p><p>4.应用练习：在函数FC1中实现两种电动机的连续运行控制。</p><p></p><p>二、函数块（FB）</p><p>1、定义</p><p>与函数FC相比，FB是有自己的存储区的块即：背景数据块，FB的典型应用是执行一个扫描周期不能结束的操作。每次调用FB时，都需要指定一个背景数据块。后者随函数块的调用而打开，在调用结束时自动关闭。FB的输人、输出参数和静态变量(Static)用指定的背景数据块保存，但是不会保存临时局部变量(Temp) 中的数据。函数块执行完后，背景数据块中的数据不会丢失。</p><p>2.生成FB</p><p>（1）打开博图软件的项目视图中的文件夹"\PLC-1\程序块"，用鼠标双击其中的"添加新块"对话框</p><p>（2）单击"FB"按钮，按"确定"，生成默认名称为"块-1[FB1]"函数</p><p>3.生成FB的局部数据</p><p>局域变量表里有：Input（输入参数）、Output（输出参数）、In_Out（输入/输出参数）、Temp（临时数据）等参数。</p><p>4.应用练习：在函数FB1中实现电动机及抱闸控制。</p></td></tr><tr><td colspan="2"><p><strong>课</strong></p><p><strong>后</strong></p><p><strong>教</strong></p><p><strong>学</strong></p><p><strong>反</strong></p><p><strong>思</strong></p></td><td colspan="8"><p></p></td></tr></tbody></table></div></script>

<!-- 指令文本模板（含可替换占位符，放在隐藏 textarea 中以避免 </script> 解析问题） -->
<textarea id="instructionTemplate" style="display:none">***

以上是教案的md格式模版，参考上面模版，并参考最后的[参考文件]的内容写出
{TOPIC} 的教案

课程重点：{KEY_POINTS}

注意1.保持格式框架不变2.要以html的方式输出，一次输出完，不要中断 3.要可以直接运行 4.页面要提供可以直接下载word功能，参考如下
  <div id="downloadBtn" class="download-btn" onclick="downloadWord()">下载Word文档</div>
    <script>
        function downloadWord() {
            // 创建一个 Blob 对象，类型为 docx
            const blob = new Blob([document.documentElement.outerHTML], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
            // 创建一个临时链接
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '教案.docx';
            // 触发下载
            document.body.appendChild(a);
            a.click();
            // 清理
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

{REFERENCE_CONTENT}</textarea>

<!-- 主逻辑 -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var generatedHTML = '';

  /* ---------- 配置存取 ---------- */
  function loadConfig() {
    try {
      var saved = localStorage.getItem('jiaoan_config');
      if (saved) {
        var cfg = JSON.parse(saved);
        $('apiKey').value = cfg.apiKey || '';
        $('baseUrl').value = cfg.baseUrl || 'https://api.openai.com/v1';
        $('model').value = cfg.model || 'gpt-4o';
      }
    } catch (e) { /* 忽略 */ }
  }

  function saveConfig() {
    var cfg = {
      apiKey: $('apiKey').value,
      baseUrl: $('baseUrl').value,
      model: $('model').value
    };
    try { localStorage.setItem('jiaoan_config', JSON.stringify(cfg)); } catch (e) { /* 忽略 */ }
  }

  /* ---------- 组装提示词 ---------- */
  function buildPrompt() {
    var tableHTML = $('tableTemplate').textContent;
    var instruction = $('instructionTemplate').value;
    var topic = $('topic').value;
    var keyPoints = $('keyPoints').value;
    var reference = $('reference').value;

    instruction = instruction.split('{TOPIC}').join(topic);
    instruction = instruction.split('{KEY_POINTS}').join(keyPoints);
    instruction = instruction.split('{REFERENCE_CONTENT}').join(reference);

    return tableHTML + '\n\n' + instruction;
  }

  /* ---------- 从 AI 返回内容中提取 HTML ---------- */
  function extractHTML(content) {
    if (!content) return '';
    // 优先匹配 ```html ... ```
    var m = content.match(/```html\s*([\s\S]*?)```/i);
    if (m) return m[1].trim();
    // 匹配通用 ``` ... ```
    m = content.match(/```[\s\S]*?```/);
    if (m) {
      var inner = m[0].replace(/^```\w*\n?/, '').replace(/```\s*$/, '');
      return inner.trim();
    }
    // 尝试从 <!DOCTYPE 或 <html 开始截取
    var lower = content.toLowerCase();
    var idx = lower.indexOf('<!doctype');
    if (idx >= 0) return content.substring(idx).trim();
    idx = lower.indexOf('<html');
    if (idx >= 0) return content.substring(idx).trim();
    return content.trim();
  }

  /* ---------- 状态提示 ---------- */
  function showStatus(msg, type) {
    var el = $('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  /* ---------- 生成教案 ---------- */
  function generateLesson() {
    var apiKey = $('apiKey').value.trim();
    if (!apiKey) {
      showStatus('请填写 API Key', 'error');
      return;
    }
    var baseUrl = $('baseUrl').value.trim().replace(/\/+$/, '');
    var model = $('model').value.trim();
    var prompt = buildPrompt();

    var btn = $('generateBtn');
    btn.disabled = true;
    btn.textContent = '生成中...';
    showStatus('正在生成教案，请耐心等待...', 'loading');

    // 超时控制：90 秒
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, 90000);
    var startTime = Date.now();

    showStatus('正在请求 ' + baseUrl + '/chat/completions ...', 'loading');

    fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.7
      })
    }).then(function (response) {
      if (!response.ok) {
        return response.text().then(function (txt) {
          var errMsg = 'HTTP ' + response.status + (response.statusText ? ' ' + response.statusText : '');
          try {
            var errData = JSON.parse(txt);
            if (errData && errData.error && errData.error.message) errMsg = errData.error.message;
          } catch (e) { if (txt) errMsg += '\n' + txt.substring(0, 500); }
          throw new Error(errMsg);
        });
      }
      return response.json();
    }).then(function (data) {
      clearTimeout(timeoutId);
      if (!data.choices || !data.choices[0] || !data.choices[0].message) {
        throw new Error('返回数据格式异常：' + JSON.stringify(data).substring(0, 500));
      }
      var content = data.choices[0].message.content;
      generatedHTML = extractHTML(content);

      var wrapper = $('previewWrapper');
      wrapper.innerHTML = '<iframe class="preview-frame" id="previewFrame"></iframe>';
      $('previewFrame').srcdoc = generatedHTML;

      $('downloadHtmlBtn').disabled = false;
      $('downloadWordBtn').disabled = false;
      showStatus('教案生成成功！耗时 ' + Math.round((Date.now() - startTime) / 1000) + ' 秒，可以预览和下载。', 'success');
    }).catch(function (err) {
      clearTimeout(timeoutId);
      var msg = err && err.message ? err.message : String(err);
      // 友好提示常见错误
      if (err.name === 'AbortError') {
        msg = '请求超时（90 秒）。可能是网络慢或 API 未响应。请检查 API Base URL 是否正确，或网络是否需要代理。';
      } else if (msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('NetworkError') >= 0) {
        msg = '网络请求失败（Failed to fetch）。常见原因：\n' +
              '1. CORS 跨域被拦截（该 API 不允许浏览器直接调用）\n' +
              '2. API Base URL 错误或无法访问\n' +
              '3. 网络需要代理才能访问\n' +
              '请求地址：' + baseUrl + '/chat/completions';
      }
      showStatus('生成失败：' + msg, 'error');
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = '生成教案';
    });
  }

  /* ---------- 下载 HTML ---------- */
  function downloadHTML() {
    if (!generatedHTML) return;
    var blob = new Blob([generatedHTML], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '教案.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- 下载 Word ---------- */
  function downloadWord() {
    if (!generatedHTML) return;
    var header = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>';
    var footer = '</body></html>';
    var blob = new Blob(['\ufeff' + header + generatedHTML + footer], { type: 'application/msword' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '教案.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- 初始化 ---------- */
  window.addEventListener('DOMContentLoaded', function () {
    loadConfig();
    $('apiKey').addEventListener('input', saveConfig);
    $('baseUrl').addEventListener('input', saveConfig);
    $('model').addEventListener('input', saveConfig);
    $('generateBtn').addEventListener('click', generateLesson);
    $('downloadHtmlBtn').addEventListener('click', downloadHTML);
    $('downloadWordBtn').addEventListener('click', downloadWord);
  });
})();
</script>
</body>
</html>
