<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的收藏</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .fav-header {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-light) 100%);
      padding: 40px 20px 24px;
      color: #fff;
    }
    .fav-header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .fav-header p {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }
    .fav-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .fav-card {
      display: flex;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .fav-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .fav-info {
      padding: 12px;
      flex: 1;
    }
    .fav-name {
      font-size: 16px;
      font-weight: 600;
    }
    .fav-location {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .fav-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .fav-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="fav-header">
    <h1>我的收藏</h1>
    <p>你心仪的海岛目的地</p>
  </div>

  <div class="fav-list" id="favList">
    <!-- 动态渲染 -->
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item" data-page="discover">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item active" data-page="favorites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script>
    (function() {
      const favList = document.getElementById('favList');
      const STORAGE_KEY = 'island_favorites';

      function getFavorites() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          return [];
        }
      }

      function renderFavorites() {
        const favIds = getFavorites();
        if (favIds.length === 0) {
          favList.innerHTML = `
            <div class="fav-empty">
              <div class="fav-empty-icon">🤍</div>
              <div>还没有收藏任何海岛</div>
              <div style="font-size:12px;margin-top:8px;">去发现和收藏你喜欢的海岛吧</div>
            </div>
          `;
          return;
        }

        const favIslands = ISLANDS.filter(i => favIds.includes(String(i.id)) || favIds.includes(i.id));
        if (favIslands.length === 0) {
          favList.innerHTML = `
            <div class="fav-empty">
              <div class="fav-empty-icon">🤍</div>
              <div>还没有收藏任何海岛</div>
              <div style="font-size:12px;margin-top:8px;">去发现和收藏你喜欢的海岛吧</div>
            </div>
          `;
          return;
        }

        favList.innerHTML = favIslands.map(item => `
          <div class="fav-card" onclick="location.href='detail.html?id=${item.id}'">
            <img src="${item.image}" alt="${item.name}">
            <div class="fav-info">
              <div class="fav-name">${item.name}</div>
              <div class="fav-location">${item.location}</div>
            </div>
          </div>
        `).join('');
      }

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: '../index.html',
        discover: 'discover.html',
        favorites: 'favorites.html',
        profile: 'profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });

      renderFavorites();
    })();
  </script>
</body>
</html>
