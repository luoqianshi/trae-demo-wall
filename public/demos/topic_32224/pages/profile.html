<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>个人中心</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* ===== 头部背景 ===== */
    .profile-header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
      padding: 32px 16px 40px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .profile-header::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .profile-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 140px;
      height: 140px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }

    /* ===== 用户信息区 ===== */
    .user-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar:active {
      transform: scale(0.95);
    }

    .avatar-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .nickname {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nickname-edit {
      font-size: 14px;
      opacity: 0.7;
      cursor: pointer;
      padding: 2px;
      transition: var(--transition);
    }

    .nickname-edit:active {
      opacity: 1;
    }

    .nickname-input {
      font-size: 20px;
      font-weight: 700;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      text-align: center;
      outline: none;
      width: 160px;
    }

    .nickname-input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    /* ===== 探索统计 ===== */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.75;
    }

    /* ===== 功能菜单 ===== */
    .menu-section {
      padding: 16px;
      margin-top: -20px;
      position: relative;
      z-index: 2;
    }

    .menu-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 1px solid var(--border);
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:active {
      background: var(--bg);
    }

    .menu-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .menu-icon-primary {
      background: linear-gradient(135deg, rgba(26,107,140,0.12), rgba(26,107,140,0.06));
    }

    .menu-icon-accent {
      background: linear-gradient(135deg, rgba(245,166,35,0.15), rgba(245,166,35,0.08));
    }

    .menu-icon-success {
      background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(34,197,94,0.06));
    }

    .menu-icon-info {
      background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(59,130,246,0.06));
    }

    .menu-icon-warn {
      background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.05));
    }

    .menu-icon-gray {
      background: linear-gradient(135deg, rgba(107,114,128,0.12), rgba(107,114,128,0.06));
    }

    .menu-content {
      flex: 1;
    }

    .menu-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .menu-arrow {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ===== 浏览历史 ===== */
    .history-section {
      padding: 0 16px 16px;
    }

    .history-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .history-clear {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .history-clear:active {
      color: var(--primary);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      cursor: pointer;
      transition: var(--transition);
    }

    .history-item:active {
      background: var(--border);
    }

    .history-img {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-empty {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ===== 底部版本号 ===== */
    .version-footer {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ===== 弹窗 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      width: 280px;
      max-width: 90%;
      padding: 24px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .modal-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-btn {
      padding: 10px 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-btn:active {
      transform: scale(0.97);
    }

    /* 反馈弹窗特殊样式 */
    .feedback-textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      resize: none;
      outline: none;
      margin-bottom: 16px;
      font-family: inherit;
    }

    .feedback-textarea:focus {
      border-color: var(--primary-light);
    }

    /* 隐藏文件输入 */
    #avatarInput {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 头部用户信息 -->
  <header class="profile-header animate-fade-in-up">
    <div class="user-info">
      <div class="avatar-wrap">
        <div class="avatar" id="avatarBtn">
          <span id="avatarPlaceholder">&#128100;</span>
          <img id="avatarImg" src="" alt="头像" style="display:none;">
        </div>
        <div class="avatar-edit" id="avatarEditBtn">&#9998;</div>
        <input type="file" id="avatarInput" accept="image/*">
      </div>
      <div class="nickname" id="nicknameWrap">
        <span id="nicknameText">海岛探索者</span>
        <span class="nickname-edit" id="nicknameEditBtn">&#9998;</span>
      </div>
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="exploredCount">0</div>
          <div class="stat-label">已探索海岛</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="favoritedCount">0</div>
          <div class="stat-label">收藏海岛</div>
        </div>
      </div>
    </div>
  </header>

  <!-- 功能菜单 -->
  <section class="menu-section animate-fade-in-up delay-1">
    <div class="menu-card">
      <div class="menu-item" id="menuFavorites">
        <div class="menu-icon menu-icon-accent">&#9829;</div>
        <div class="menu-content">
          <div class="menu-title">我的收藏</div>
          <div class="menu-desc">查看已收藏的海岛</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
      <div class="menu-item" id="menuHistory">
        <div class="menu-icon menu-icon-primary">&#128340;</div>
        <div class="menu-content">
          <div class="menu-title">浏览历史</div>
          <div class="menu-desc">最近浏览的海岛记录</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
      <div class="menu-item" id="menuCompare">
        <div class="menu-icon menu-icon-success">&#128200;</div>
        <div class="menu-content">
          <div class="menu-title">海岛对比</div>
          <div class="menu-desc">对比多个海岛详情</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
      <div class="menu-item" id="menuPlan">
        <div class="menu-icon menu-icon-info">&#128197;</div>
        <div class="menu-content">
          <div class="menu-title">行程规划</div>
          <div class="menu-desc">规划你的海岛之旅</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
      <div class="menu-item" id="menuAbout">
        <div class="menu-icon menu-icon-gray">&#8505;</div>
        <div class="menu-content">
          <div class="menu-title">关于我们</div>
          <div class="menu-desc">版本信息与团队介绍</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
      <div class="menu-item" id="menuFeedback">
        <div class="menu-icon menu-icon-warn">&#9993;</div>
        <div class="menu-content">
          <div class="menu-title">意见反馈</div>
          <div class="menu-desc">帮助我们做得更好</div>
        </div>
        <div class="menu-arrow">&#8250;</div>
      </div>
    </div>
  </section>

  <!-- 浏览历史 -->
  <section class="history-section animate-fade-in-up delay-2" id="historySection" style="display:none;">
    <div class="history-card">
      <div class="history-header">
        <div class="history-title">最近浏览</div>
        <div class="history-clear" id="clearHistory">清空</div>
      </div>
      <div class="history-list" id="historyList">
        <!-- JS 动态生成 -->
      </div>
    </div>
  </section>

  <!-- 版本号 -->
  <div class="version-footer animate-fade-in delay-3">
    海岛决策引擎 v1.3.0
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item" data-page="discover">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item" data-page="favorites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item active" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </nav>

  <!-- 关于弹窗 -->
  <div class="modal-overlay" id="aboutModal">
    <div class="modal-box">
      <div class="modal-icon">&#127965;</div>
      <div class="modal-title">关于我们</div>
      <div class="modal-body">
        <div style="margin-bottom:8px;"><strong>海岛决策引擎 v1.3.0</strong></div>
        <div>致力于帮助每一位旅行者找到最适合自己的海岛目的地。</div>
        <div style="margin-top:8px;font-size:12px;color:var(--text-muted);">&#169; 2024 海岛决策团队</div>
      </div>
      <button class="modal-btn" onclick="closeModal('aboutModal')">知道了</button>
    </div>
  </div>

  <!-- 反馈弹窗 -->
  <div class="modal-overlay" id="feedbackModal">
    <div class="modal-box">
      <div class="modal-icon">&#9993;</div>
      <div class="modal-title">意见反馈</div>
      <div class="modal-body" style="margin-bottom:12px;">
        您的建议是我们进步的动力
      </div>
      <textarea class="feedback-textarea" id="feedbackText" placeholder="请输入您的意见或建议..."></textarea>
      <button class="modal-btn" onclick="submitFeedback()">提交反馈</button>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script>
    (function() {
      // ========== localStorage 数据管理 ==========
      const STORAGE_KEY = 'island_profile_data';

      function getProfileData() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : getDefaultData();
        } catch (e) {
          return getDefaultData();
        }
      }

      function getDefaultData() {
        return {
          nickname: '海岛探索者',
          avatar: '',
          explored: [],
          favorites: [],
          history: []
        };
      }

      function saveProfileData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // ========== 初始化数据 ==========
      let profile = getProfileData();

      // 如果没有历史记录，模拟一些浏览历史
      if (profile.history.length === 0 && ISLANDS.length > 0) {
        profile.history = [
          { id: ISLANDS[0].id, name: ISLANDS[0].name, cover: ISLANDS[0].image, time: Date.now() - 3600000 },
          { id: ISLANDS[1].id, name: ISLANDS[1].name, cover: ISLANDS[1].image, time: Date.now() - 86400000 }
        ];
        saveProfileData(profile);
      }

      // 如果没有探索数据，模拟一些
      if (profile.explored.length === 0) {
        profile.explored = [1, 2, 3];
        saveProfileData(profile);
      }

      // ========== 渲染用户信息 ==========
      const avatarBtn = document.getElementById('avatarBtn');
      const avatarImg = document.getElementById('avatarImg');
      const avatarPlaceholder = document.getElementById('avatarPlaceholder');
      const nicknameText = document.getElementById('nicknameText');
      const exploredCount = document.getElementById('exploredCount');
      const favoritedCount = document.getElementById('favoritedCount');

      function renderUserInfo() {
        if (profile.avatar) {
          avatarImg.src = profile.avatar;
          avatarImg.style.display = 'block';
          avatarPlaceholder.style.display = 'none';
        } else {
          avatarImg.style.display = 'none';
          avatarPlaceholder.style.display = 'flex';
        }
        nicknameText.textContent = profile.nickname || '海岛探索者';
        exploredCount.textContent = profile.explored.length;
        favoritedCount.textContent = profile.favorites.length;
      }

      renderUserInfo();

      // ========== 头像更换 ==========
      const avatarInput = document.getElementById('avatarInput');

      function triggerAvatarUpload() {
        avatarInput.click();
      }

      avatarBtn.addEventListener('click', triggerAvatarUpload);
      document.getElementById('avatarEditBtn').addEventListener('click', triggerAvatarUpload);

      avatarInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          profile.avatar = e.target.result;
          saveProfileData(profile);
          renderUserInfo();
        };
        reader.readAsDataURL(file);
      });

      // ========== 昵称编辑 ==========
      const nicknameWrap = document.getElementById('nicknameWrap');
      let isEditingNickname = false;

      document.getElementById('nicknameEditBtn').addEventListener('click', function() {
        if (isEditingNickname) return;
        isEditingNickname = true;
        const currentName = profile.nickname || '海岛探索者';
        nicknameWrap.innerHTML = `<input type="text" class="nickname-input" id="nicknameInput" value="${currentName}" maxlength="12">`;
        const input = document.getElementById('nicknameInput');
        input.focus();
        input.select();

        function saveNickname() {
          const newName = input.value.trim();
          if (newName) {
            profile.nickname = newName;
            saveProfileData(profile);
          }
          isEditingNickname = false;
          nicknameWrap.innerHTML = `<span id="nicknameText">${profile.nickname}</span><span class="nickname-edit" id="nicknameEditBtn">&#9998;</span>`;
          renderUserInfo();
          document.getElementById('nicknameEditBtn').addEventListener('click', arguments.callee);
        }

        input.addEventListener('blur', saveNickname);
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            input.blur();
          }
        });
      });

      // ========== 渲染浏览历史 ==========
      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');

      function renderHistory() {
        if (profile.history.length === 0) {
          historySection.style.display = 'none';
          return;
        }
        historySection.style.display = 'block';

        historyList.innerHTML = profile.history.slice(0, 5).map(item => {
          const island = ISLANDS.find(i => i.id === item.id);
          const cover = island ? island.image : (item.cover || '');
          const timeStr = formatTime(item.time);
          return `
            <div class="history-item" data-id="${item.id}">
              <img src="${cover}" alt="${item.name}" class="history-img" loading="lazy">
              <div class="history-info">
                <div class="history-name">${item.name}</div>
                <div class="history-time">${timeStr}</div>
              </div>
            </div>
          `;
        }).join('');

        // 绑定点击跳转
        historyList.querySelectorAll('.history-item').forEach(item => {
          item.addEventListener('click', function() {
            const id = this.dataset.id;
            window.location.href = `detail.html?id=${id}`;
          });
        });
      }

      function formatTime(timestamp) {
        const now = Date.now();
        const diff = now - timestamp;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
        if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
        const d = new Date(timestamp);
        return d.getMonth() + 1 + '月' + d.getDate() + '日';
      }

      renderHistory();

      // 清空历史
      document.getElementById('clearHistory').addEventListener('click', function() {
        if (confirm('确定要清空浏览历史吗？')) {
          profile.history = [];
          saveProfileData(profile);
          renderHistory();
        }
      });

      // ========== 功能菜单点击 ==========
      document.getElementById('menuFavorites').addEventListener('click', function() {
        window.location.href = 'discover.html?filter=favorites';
      });

      document.getElementById('menuHistory').addEventListener('click', function() {
        const section = document.getElementById('historySection');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
        if (section.style.display === 'block') {
          section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      document.getElementById('menuCompare').addEventListener('click', function() {
        alert('海岛对比功能：选择多个海岛进行详细对比（演示）');
      });

      document.getElementById('menuPlan').addEventListener('click', function() {
        alert('行程规划功能：根据您的偏好自动生成海岛行程（演示）');
      });

      document.getElementById('menuAbout').addEventListener('click', function() {
        openModal('aboutModal');
      });

      document.getElementById('menuFeedback').addEventListener('click', function() {
        openModal('feedbackModal');
      });

      // ========== 弹窗控制 ==========
      window.openModal = function(id) {
        document.getElementById(id).classList.add('show');
      };

      window.closeModal = function(id) {
        document.getElementById(id).classList.remove('show');
      };

      window.submitFeedback = function() {
        const text = document.getElementById('feedbackText').value.trim();
        if (!text) {
          alert('请输入反馈内容');
          return;
        }
        alert('感谢您的反馈！我们会认真阅读每一条建议。');
        document.getElementById('feedbackText').value = '';
        closeModal('feedbackModal');
      };

      // 点击遮罩关闭弹窗
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', function(e) {
          if (e.target === this) {
            this.classList.remove('show');
          }
        });
      });

      // ========== 记录当前页面浏览（用于历史） ==========
      // 从其他页面进入详情页时，会自动记录到历史
      // 这里提供一个全局方法供其他页面调用
      window.addToHistory = function(islandId) {
        const island = ISLANDS.find(i => i.id === islandId);
        if (!island) return;
        profile.history = profile.history.filter(h => h.id !== islandId);
        profile.history.unshift({
          id: island.id,
          name: island.name,
          cover: island.image,
          time: Date.now()
        });
        if (profile.history.length > 20) {
          profile.history = profile.history.slice(0, 20);
        }
        saveProfileData(profile);
      };

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: '../index.html',
        discover: 'discover.html',
        favorites: 'favorites.html',
        profile: 'profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });
    })();
  </script>
</body>
</html>
