<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>推荐结果 - 这个夏天，去哪片海？</title>
  <link rel="stylesheet" href="../css/common.css">
</head>
<body class="page-padding">
  <!-- Result Header -->
  <header class="result-header animate-fade-in">
    <div class="result-context animate-fade-in-up delay-1" id="resultContext">加载中...</div>
  </header>

  <!-- Satellite Data -->
  <section class="satellite-grid animate-fade-in-up delay-2" id="satelliteGrid">
    <div class="satellite-card">
      <div class="satellite-icon">🌡️</div>
      <div class="satellite-label">水温</div>
      <div class="satellite-value"><span id="waterTemp">--</span><span class="satellite-unit">°C</span></div>
    </div>
    <div class="satellite-card">
      <div class="satellite-icon">👁️</div>
      <div class="satellite-label">能见度</div>
      <div class="satellite-value"><span id="visibility">--</span><span class="satellite-unit">m</span></div>
    </div>
    <div class="satellite-card">
      <div class="satellite-icon">🌊</div>
      <div class="satellite-label">浪高</div>
      <div class="satellite-value"><span id="waveHeight">--</span><span class="satellite-unit">m</span></div>
    </div>
    <div class="satellite-card">
      <div class="satellite-icon">🌧️</div>
      <div class="satellite-label">降雨概率</div>
      <div class="satellite-value"><span id="rainProb">--</span><span class="satellite-unit">%</span></div>
    </div>
  </section>

  <!-- Climate Calendar -->
  <section class="climate-section animate-fade-in-up delay-3">
    <h2 class="section-title">气候日历</h2>
    <div class="climate-chart" id="climateChart">
      <!-- Bars injected by JS -->
    </div>
  </section>

  <!-- Result List -->
  <section class="result-list" id="resultList">
    <!-- Result cards injected by JS -->
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item" data-page="home" id="navHome">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item active" data-page="discover">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item" data-page="favorites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script>
    (function() {
      // ========== Parse URL params ==========
      const params = new URLSearchParams(window.location.search);
      const userPrefs = {
        month: params.get('month') || '6',
        days: params.get('days') || '5',
        budget: params.get('budget') || '20000',
        transport: params.get('transport') || 'direct',
        scene: params.get('scene') || 'couple',
        preferences: (params.get('preferences') || 'diving,beach').split(',').filter(Boolean)
      };

      const monthLabel = OPTIONS.months.find(m => m.value === userPrefs.month)?.label || userPrefs.month + '月';
      const daysLabel = OPTIONS.days.find(d => d.value === userPrefs.days)?.label || userPrefs.days + '天';
      const budgetLabel = OPTIONS.budgets.find(b => b.value === userPrefs.budget)?.label || '';

      // ========== Render context header ==========
      document.getElementById('resultContext').textContent =
        monthLabel + '出发 · ' + daysLabel + ' · ' + budgetLabel + '预算';

      // ========== Get recommendations ==========
      const top3 = getRecommendations(userPrefs);
      const topIsland = top3[0];

      // ========== Render satellite data (from top match) ==========
      const satData = getSatelliteData(topIsland.id, userPrefs.month);
      if (satData) {
        document.getElementById('waterTemp').textContent = satData.waterTemp;
        document.getElementById('visibility').textContent = satData.visibility;
        document.getElementById('waveHeight').textContent = satData.waveHeight;
        document.getElementById('rainProb').textContent = satData.rainProb;
      }

      // ========== Render climate chart ==========
      function renderClimateChart(island) {
        const chart = document.getElementById('climateChart');
        const currentMonth = parseInt(userPrefs.month);
        const maxVal = Math.max(...island.climate);
        const minVal = Math.min(...island.climate);
        const range = maxVal - minVal || 1;

        chart.innerHTML = island.climate.map((temp, idx) => {
          const monthNum = idx + 1;
          const isCurrent = monthNum === currentMonth;
          const heightPct = 20 + ((temp - minVal) / range) * 70;
          const monthShort = monthNum + '月';
          return `
            <div class="climate-bar-wrapper">
              <div class="climate-bar ${isCurrent ? 'current' : ''}" style="height:${heightPct}%" data-height="${heightPct}"></div>
              <div class="climate-month ${isCurrent ? 'current' : ''}">${monthShort}</div>
            </div>
          `;
        }).join('');
      }

      renderClimateChart(topIsland);

      // ========== Render result cards ==========
      function renderResultCards() {
        const list = document.getElementById('resultList');
        const badgeClasses = ['top1', 'top2', 'top3'];
        const badgeLabels = ['TOP 1', 'TOP 2', 'TOP 3'];

        list.innerHTML = top3.map((island, idx) => {
          const ratings = Object.entries(island.ratings).slice(0, 4);
          const ratingBars = ratings.map(([key, val]) => `
            <div class="rating-item">
              <span class="rating-label">${RATING_DIMENSIONS[key] || key}</span>
              <div class="rating-bar-bg">
                <div class="rating-bar-fill" style="width:${val}%"></div>
              </div>
            </div>
          `).join('');

          return `
            <div class="result-card animate-fade-in-up delay-${idx + 1}" data-id="${island.id}">
              <div class="result-badge ${badgeClasses[idx]}">${badgeLabels[idx]}</div>
              <img class="result-image" src="${island.image}" alt="${island.name}" loading="lazy">
              <div class="result-body">
                <div class="result-match">
                  <div>
                    <div class="result-match-score">${island.matchScore}%</div>
                    <div class="result-match-label">匹配度</div>
                  </div>
                </div>
                <div class="result-name">${island.name}</div>
                <div class="result-location">${island.location}</div>
                <div class="result-tags">
                  ${island.tags.map(tag => `<span class="result-tag">${tag}</span>`).join('')}
                </div>
                <div class="rating-group">
                  ${ratingBars}
                </div>
                <div class="result-reasons">
                  ${island.reasons.map(r => `<span class="result-reason">${r}</span>`).join('')}
                </div>
                <div class="result-price">
                  <span class="result-price-label">参考价</span>
                  <span class="result-price-value">¥${island.price.min.toLocaleString()}-${island.price.max.toLocaleString()}</span>
                  <span class="result-price-unit">/${island.price.unit}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Click handlers
        list.querySelectorAll('.result-card').forEach(card => {
          card.addEventListener('click', function() {
            const id = this.dataset.id;
            window.location.href = 'detail.html?id=' + id;
          });
        });
      }

      renderResultCards();

      // ========== Animate rating bars on scroll ==========
      function animateBars() {
        document.querySelectorAll('.rating-bar-fill').forEach(bar => {
          const width = bar.style.width;
          bar.style.width = '0%';
          setTimeout(() => { bar.style.width = width; }, 100);
        });
      }

      // Trigger bar animation after a short delay
      setTimeout(animateBars, 400);

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: '../index.html',
        discover: 'discover.html',
        favorites: 'favorites.html',
        profile: 'profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });
    })();
  </script>
</body>
</html>
