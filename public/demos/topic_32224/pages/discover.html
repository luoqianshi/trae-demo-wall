<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>发现海岛</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* ===== 头部区域 ===== */
    .header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
      padding: 32px 16px 24px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .header-subtitle {
      font-size: 13px;
      opacity: 0.8;
      position: relative;
      z-index: 1;
    }

    /* ===== 搜索栏 ===== */
    .search-section {
      padding: 12px 16px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 16px 0 38px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--primary-light);
      background: var(--bg-white);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .filter-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--bg);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .filter-btn:active {
      background: var(--border);
    }

    .filter-btn svg {
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    /* ===== 快捷功能入口 ===== */
    .quick-actions {
      padding: 12px 16px;
      background: var(--bg-white);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .quick-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(26,107,140,0.08), rgba(26,107,140,0.04));
      border: 1px solid rgba(26,107,140,0.15);
      color: var(--primary);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
    }

    .quick-btn:active {
      background: linear-gradient(135deg, rgba(26,107,140,0.15), rgba(26,107,140,0.08));
    }

    .quick-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ===== 地区筛选标签 ===== */
    .region-filter {
      padding: 12px 16px;
      background: var(--bg-white);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .region-tag {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: var(--radius-xl);
      font-size: 13px;
      font-weight: 500;
      background: var(--bg);
      color: var(--text-secondary);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .region-tag.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(26,107,140,0.25);
    }

    .region-tag:active {
      transform: scale(0.95);
    }

    /* ===== 海岛网格列表 ===== */
    .island-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .island-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .island-card:active {
      transform: scale(0.97);
    }

    .island-card-img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .island-card-score {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(245,166,35,0.35);
    }

    .island-card-body {
      padding: 10px;
    }

    .island-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .island-card-location {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .island-card-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .island-card-tag {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
      background: rgba(26,107,140,0.08);
      color: var(--primary);
    }

    /* 无结果提示 */
    .no-result {
      grid-column: span 2;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .no-result-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header animate-fade-in-up">
    <h1 class="header-title">发现海岛</h1>
    <p class="header-subtitle">探索全球最美热带海岛</p>
  </header>

  <!-- 搜索栏 -->
  <section class="search-section animate-fade-in-up delay-1">
    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索海岛名称或地区...">
      </div>
      <button class="filter-btn" id="filterBtn" title="筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
    </div>
  </section>

  <!-- 快捷功能入口 -->
  <section class="quick-actions hide-scrollbar animate-fade-in-up delay-2">
    <button class="quick-btn" id="compareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      海岛对比
    </button>
  </section>

  <!-- 地区筛选标签 -->
  <section class="region-filter hide-scrollbar animate-fade-in-up delay-3" id="regionFilter">
    <!-- JS 动态生成 -->
  </section>

  <!-- 海岛网格列表 -->
  <main class="island-grid page-content-no-cta" id="islandGrid">
    <!-- JS 动态生成 -->
  </main>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item active" data-page="discover">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item" data-page="favorites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script>
    (function() {
      // 当前筛选状态
      let currentRegion = '全部';
      let searchQuery = '';

      // 渲染地区筛选标签
      function renderRegionFilter() {
        const container = document.getElementById('regionFilter');
        container.innerHTML = REGIONS.map(region => `
          <button class="region-tag ${region === currentRegion ? 'active' : ''}" data-region="${region}">
            ${region}
          </button>
        `).join('');

        // 绑定点击事件
        container.querySelectorAll('.region-tag').forEach(tag => {
          tag.addEventListener('click', function() {
            currentRegion = this.dataset.region;
            renderRegionFilter();
            renderIslandGrid();
          });
        });
      }

      // 渲染海岛网格
      function renderIslandGrid() {
        const container = document.getElementById('islandGrid');
        
        // 筛选数据
        let filtered = ISLANDS.filter(item => {
          const matchRegion = currentRegion === '全部' || item.region === currentRegion;
          const matchSearch = !searchQuery || 
            item.name.includes(searchQuery) || 
            item.location.includes(searchQuery) ||
            item.region.includes(searchQuery) ||
            item.tags.some(t => t.includes(searchQuery));
          return matchRegion && matchSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="no-result animate-fade-in">
              <div class="no-result-icon">&#127965;</div>
              <div>没有找到匹配的海岛</div>
              <div style="font-size:12px;margin-top:4px;">试试其他关键词或地区</div>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered.map((item, index) => {
          const delayClass = index < 8 ? `delay-${Math.min(index + 1, 8)}` : '';
          const tagsHtml = item.tags.slice(0, 2).map(tag => 
            `<span class="island-card-tag">${tag}</span>`
          ).join('');
          
          return `
            <article class="island-card animate-fade-in-up ${delayClass}" data-id="${item.id}">
              <div style="position:relative;">
                <img src="${item.image}" alt="${item.name}" class="island-card-img" loading="lazy">
                <div class="island-card-score">${item.matchScore}</div>
              </div>
              <div class="island-card-body">
                <h3 class="island-card-name">${item.name}</h3>
                <div class="island-card-location">
                  <span>&#128205;</span>
                  <span>${item.location}</span>
                </div>
                <div class="island-card-tags">
                  ${tagsHtml}
                </div>
              </div>
            </article>
          `;
        }).join('');

        // 绑定卡片点击事件
        container.querySelectorAll('.island-card').forEach(card => {
          card.addEventListener('click', function() {
            const id = this.dataset.id;
            window.location.href = `detail.html?id=${id}`;
          });
        });
      }

      // 搜索功能
      const searchInput = document.getElementById('searchInput');
      let searchTimeout;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchQuery = this.value.trim();
          renderIslandGrid();
        }, 300);
      });

      // 筛选按钮
      document.getElementById('filterBtn').addEventListener('click', function() {
        alert('筛选功能：可按评分、费用、季节等条件筛选（演示）');
      });

      // 海岛对比按钮
      document.getElementById('compareBtn').addEventListener('click', function() {
        alert('海岛对比功能：选择多个海岛进行详细对比（演示）');
      });

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: '../index.html',
        discover: 'discover.html',
        favorites: 'favorites.html',
        profile: 'profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });

      // 初始化
      renderRegionFilter();
      renderIslandGrid();
    })();
  </script>
</body>
</html>
