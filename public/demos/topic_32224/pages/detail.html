<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>海岛详情</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* ===== Hero 大图区域 ===== */
    .hero {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
    }

    /* ===== 内容区 ===== */
    .content {
      padding: 20px 16px;
      position: relative;
      margin-top: -30px;
      z-index: 2;
    }

    .content-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      box-shadow: var(--shadow-md);
    }

    /* 标题区 */
    .detail-header {
      margin-bottom: 16px;
    }

    .detail-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .detail-location {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 评分与基本信息 */
    .info-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .score-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .score-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .basic-info-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .info-item {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .info-item-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-item-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* 区块标题 */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    /* 海洋环境评分 */
    .ocean-score-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ocean-score-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ocean-score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ocean-score-name {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .ocean-score-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    /* 特色体验标签 */
    .experience-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .experience-tag {
      padding: 7px 14px;
      border-radius: var(--radius-xl);
      font-size: 13px;
      font-weight: 500;
      background: linear-gradient(135deg, rgba(26,107,140,0.08), rgba(26,107,140,0.04));
      color: var(--primary);
      border: 1px solid rgba(26,107,140,0.12);
    }

    /* 每日消费明细 */
    .cost-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cost-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cost-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: rgba(26,107,140,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .cost-info {
      flex: 1;
    }

    .cost-name {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .cost-bar-wrap {
      margin-top: 4px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .cost-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
      transition: width 1s ease-out;
    }

    .cost-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
      min-width: 50px;
      text-align: right;
    }

    .cost-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cost-total-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cost-total-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* 登岛方式 */
    .access-text {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 14px;
      border-radius: var(--radius-sm);
    }

    /* 必玩景点 */
    .attractions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .attraction-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .attraction-item:active {
      background: var(--border);
    }

    .attraction-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .attraction-info {
      flex: 1;
    }

    .attraction-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .attraction-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* 未找到提示 */
    .not-found {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .not-found-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .not-found-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .not-found-desc {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- JS 动态渲染 -->
  </div>

  <script src="../js/data.js"></script>
  <script>
    (function() {
      // 从 URL 读取海岛 id
      const params = new URLSearchParams(window.location.search);
      const islandId = parseInt(params.get('id'), 10);
      const island = islandData.find(item => item.id === islandId);

      const app = document.getElementById('app');

      if (!island) {
        app.innerHTML = `
          <div class="not-found animate-fade-in">
            <div class="not-found-icon">&#127965;</div>
            <div class="not-found-title">海岛未找到</div>
            <div class="not-found-desc">该海岛不存在或已被移除</div>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="history.back()">返回上一页</button>
          </div>
          <nav class="bottom-nav">
            <div class="nav-item" data-page="home">
              <span class="nav-icon">🏠</span>
              <span class="nav-label">首页</span>
            </div>
            <div class="nav-item" data-page="discover">
              <span class="nav-icon">🔍</span>
              <span class="nav-label">发现</span>
            </div>
            <div class="nav-item" data-page="favorites">
              <span class="nav-icon">❤️</span>
              <span class="nav-label">收藏</span>
            </div>
            <div class="nav-item" data-page="profile">
              <span class="nav-icon">👤</span>
              <span class="nav-label">我的</span>
            </div>
          </nav>
        `;
        return;
      }

      // 计算总费用
      const totalCost = Object.values(island.dailyCost).reduce((a, b) => a + b, 0);
      const maxCost = Math.max(...Object.values(island.dailyCost));

      // 海洋评分 HTML
      const oceanScoreHtml = Object.entries(island.oceanScore).map(([key, value]) => `
        <div class="ocean-score-item animate-fade-in-up">
          <div class="ocean-score-header">
            <span class="ocean-score-name">${oceanScoreLabels[key]}</span>
            <span class="ocean-score-value">${value}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${value}%;"></div>
          </div>
        </div>
      `).join('');

      // 特色体验 HTML
      const experiencesHtml = island.experiences.map(exp => `
        <span class="experience-tag animate-scale-in">${exp}</span>
      `).join('');

      // 每日消费 HTML
      const costHtml = Object.entries(island.dailyCost).map(([key, value]) => `
        <div class="cost-item animate-fade-in-up">
          <div class="cost-icon">${getCostIcon(key)}</div>
          <div class="cost-info">
            <div class="cost-name">${costLabels[key]}</div>
            <div class="cost-bar-wrap">
              <div class="cost-bar" style="width:${(value / maxCost * 100).toFixed(1)}%;"></div>
            </div>
          </div>
          <div class="cost-value">¥${value}</div>
        </div>
      `).join('');

      // 景点 HTML
      const attractionsHtml = island.attractions.map((attr, idx) => `
        <div class="attraction-item animate-fade-in-up delay-${Math.min(idx + 1, 8)}">
          <div class="attraction-icon">${attr.icon}</div>
          <div class="attraction-info">
            <div class="attraction-name">${attr.name}</div>
            <div class="attraction-desc">${attr.desc}</div>
          </div>
        </div>
      `).join('');

      app.innerHTML = `
        <!-- Hero 大图 -->
        <div class="hero animate-fade-in">
          <img src="${island.cover}" alt="${island.name}" class="hero-img">
          <div class="hero-overlay"></div>
          <button class="back-btn" onclick="history.back()">&#8592;</button>
        </div>

        <!-- 内容区 -->
        <div class="content page-content">
          <div class="content-card animate-fade-in-up delay-1">
            <!-- 标题 -->
            <div class="detail-header">
              <h1 class="detail-name">${island.name}</h1>
              <div class="detail-location">
                <span>&#128205;</span>
                <span>${island.location} · ${island.region}</span>
              </div>
            </div>

            <!-- 评分与基本信息 -->
            <div class="info-row">
              <div class="score-section">
                <div class="score-ring" style="--score:${island.matchScore};">
                  <span>${island.matchScore}</span>
                </div>
                <div class="score-label">当月指数</div>
              </div>
              <div class="basic-info-grid">
                <div class="info-item animate-fade-in-up delay-2">
                  <div class="info-item-label">最佳季节</div>
                  <div class="info-item-value">${island.bestSeason}</div>
                </div>
                <div class="info-item animate-fade-in-up delay-3">
                  <div class="info-item-label">签证政策</div>
                  <div class="info-item-value">${island.visa}</div>
                </div>
                <div class="info-item animate-fade-in-up delay-4">
                  <div class="info-item-label">飞行时间</div>
                  <div class="info-item-value">${island.flightTime}</div>
                </div>
                <div class="info-item animate-fade-in-up delay-5">
                  <div class="info-item-label">当地货币</div>
                  <div class="info-item-value">${island.currency}</div>
                </div>
              </div>
            </div>

            <!-- 海洋环境评分 -->
            <div class="section">
              <h2 class="section-title">
                <span>&#127754;</span>
                海洋环境评分
              </h2>
              <div class="ocean-score-list">
                ${oceanScoreHtml}
              </div>
            </div>

            <!-- 特色体验 -->
            <div class="section">
              <h2 class="section-title">
                <span>&#127942;</span>
                特色体验
              </h2>
              <div class="experience-tags">
                ${experiencesHtml}
              </div>
            </div>

            <!-- 每日消费明细 -->
            <div class="section">
              <h2 class="section-title">
                <span>&#128176;</span>
                每日消费明细
              </h2>
              <div class="cost-list">
                ${costHtml}
                <div class="cost-total">
                  <span class="cost-total-label">每日预估总计</span>
                  <span class="cost-total-value">¥${totalCost}</span>
                </div>
              </div>
            </div>

            <!-- 登岛方式 -->
            <div class="section">
              <h2 class="section-title">
                <span>&#9992;</span>
                登岛方式
              </h2>
              <div class="access-text">${island.access}</div>
            </div>

            <!-- 必玩景点 -->
            <div class="section">
              <h2 class="section-title">
                <span>&#127965;</span>
                必玩景点
              </h2>
              <div class="attractions-list">
                ${attractionsHtml}
              </div>
            </div>
          </div>
        </div>

        <!-- 底部固定 CTA 栏 -->
        <div class="bottom-cta animate-fade-in-up">
          <button class="btn-favorite" id="favoriteBtn" title="收藏">
            <span id="favoriteIcon">&#9825;</span>
          </button>
          <button class="btn btn-primary" id="recommendBtn">
            查看推荐结果
          </button>
        </div>

        <!-- 底部导航栏 -->
        <nav class="bottom-nav">
          <div class="nav-item" data-page="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">首页</span>
          </div>
          <div class="nav-item" data-page="discover">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">发现</span>
          </div>
          <div class="nav-item" data-page="favorites">
            <span class="nav-icon">❤️</span>
            <span class="nav-label">收藏</span>
          </div>
          <div class="nav-item" data-page="profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">我的</span>
          </div>
        </nav>
      `;

      // 收藏按钮交互
      const favoriteBtn = document.getElementById('favoriteBtn');
      const favoriteIcon = document.getElementById('favoriteIcon');
      let isFavorited = false;

      favoriteBtn.addEventListener('click', function() {
        isFavorited = !isFavorited;
        this.classList.toggle('active', isFavorited);
        favoriteIcon.innerHTML = isFavorited ? '&#10084;' : '&#9825;';
        favoriteIcon.style.color = isFavorited ? '#ef4444' : '';
      });

      // 查看推荐结果按钮
      document.getElementById('recommendBtn').addEventListener('click', function() {
        alert(`已为您生成「${island.name}」的个性化推荐行程！（演示）`);
      });

      // 费用条动画触发
      setTimeout(() => {
        document.querySelectorAll('.cost-bar').forEach(bar => {
          const width = bar.style.width;
          bar.style.width = '0';
          setTimeout(() => { bar.style.width = width; }, 50);
        });
      }, 300);

      // 获取费用图标
      function getCostIcon(key) {
        const icons = {
          accommodation: '🏨',
          food: '🍜',
          activities: '🎯',
          transport: '🚗',
          shopping: '🛍️'
        };
        return icons[key] || '💰';
      }

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: '../index.html',
        discover: 'discover.html',
        favorites: 'favorites.html',
        profile: 'profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });
    })();
  </script>
</body>
</html>
