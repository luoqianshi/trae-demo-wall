<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>这个夏天，去哪片海？</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <!-- Hero -->
  <section class="hero animate-fade-in">
    <h1 class="hero-brand animate-fade-in-up delay-1">这个夏天，去哪片海？</h1>
    <p class="hero-subtitle animate-fade-in-up delay-2">发现属于你的完美海岛</p>
  </section>

  <!-- Postcard Input Panel -->
  <div class="postcard animate-fade-in-up delay-3">
    <h2 class="postcard-title">定制你的海岛之旅</h2>

    <div class="form-group">
      <label class="form-label">出发月份</label>
      <select class="form-select" id="monthSelect">
        <option value="">请选择月份</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">出行天数</label>
      <select class="form-select" id="daysSelect">
        <option value="">请选择天数</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">预算范围</label>
      <select class="form-select" id="budgetSelect">
        <option value="">请选择预算</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">上岛方式</label>
      <div class="tab-group" id="transportGroup">
        <div class="tab-item" data-value="direct">直飞上岛</div>
        <div class="tab-item" data-value="transfer">转机+船</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">出行场景</label>
      <div class="tab-group" id="sceneGroup">
        <div class="tab-item" data-value="solo">独自旅行</div>
        <div class="tab-item" data-value="couple">情侣蜜月</div>
        <div class="tab-item" data-value="family">亲子家庭</div>
        <div class="tab-item" data-value="friends">朋友结伴</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">旅行偏好（可多选）</label>
      <div class="tag-group" id="preferenceGroup">
        <div class="tag-item" data-value="diving">潜水</div>
        <div class="tag-item" data-value="surfing">冲浪</div>
        <div class="tag-item" data-value="snorkeling">浮潜</div>
        <div class="tag-item" data-value="beach">沙滩躺平</div>
        <div class="tag-item" data-value="photo">摄影打卡</div>
        <div class="tag-item" data-value="food">美食探店</div>
        <div class="tag-item" data-value="culture">人文探索</div>
        <div class="tag-item" data-value="hiking">徒步探险</div>
      </div>
    </div>

    <button class="cta-btn" id="goBtn" disabled>⚓ 出发</button>
  </div>

  <!-- Monthly Recommendations -->
  <h2 class="section-title animate-fade-in-up delay-4">当月推荐</h2>
  <div class="scroll-container" id="recommendCards">
    <!-- Cards injected by JS -->
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item" data-page="discover">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item" data-page="favorites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </nav>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">正在为你寻找最佳海岛...</p>
  </div>

  <script src="js/data.js"></script>
  <script>
    (function() {
      // ========== State ==========
      const state = {
        month: '',
        days: '',
        budget: '',
        transport: '',
        scene: '',
        preferences: []
      };

      // ========== DOM refs ==========
      const monthSelect = document.getElementById('monthSelect');
      const daysSelect = document.getElementById('daysSelect');
      const budgetSelect = document.getElementById('budgetSelect');
      const transportGroup = document.getElementById('transportGroup');
      const sceneGroup = document.getElementById('sceneGroup');
      const preferenceGroup = document.getElementById('preferenceGroup');
      const goBtn = document.getElementById('goBtn');
      const recommendCards = document.getElementById('recommendCards');
      const loadingOverlay = document.getElementById('loadingOverlay');

      // ========== Populate selects ==========
      function populateSelect(selectEl, options) {
        options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.label;
          selectEl.appendChild(option);
        });
      }

      populateSelect(monthSelect, OPTIONS.months);
      populateSelect(daysSelect, OPTIONS.days);
      populateSelect(budgetSelect, OPTIONS.budgets);

      // ========== Tab selection ==========
      function initTabGroup(groupEl, key, multi = false) {
        const items = groupEl.querySelectorAll('.tab-item, .tag-item');
        items.forEach(item => {
          item.addEventListener('click', function() {
            const value = this.dataset.value;
            if (multi) {
              this.classList.toggle('active');
              if (this.classList.contains('active')) {
                if (!state[key].includes(value)) state[key].push(value);
              } else {
                state[key] = state[key].filter(v => v !== value);
              }
            } else {
              items.forEach(i => i.classList.remove('active'));
              this.classList.add('active');
              state[key] = value;
            }
            validateForm();
          });
        });
      }

      initTabGroup(transportGroup, 'transport');
      initTabGroup(sceneGroup, 'scene');
      initTabGroup(preferenceGroup, 'preferences', true);

      // ========== Select change ==========
      monthSelect.addEventListener('change', function() {
        state.month = this.value;
        validateForm();
        renderRecommendCards();
      });
      daysSelect.addEventListener('change', function() {
        state.days = this.value;
        validateForm();
      });
      budgetSelect.addEventListener('change', function() {
        state.budget = this.value;
        validateForm();
      });

      // ========== Form validation ==========
      function validateForm() {
        const isValid = state.month && state.days && state.budget && state.transport && state.scene && state.preferences.length > 0;
        goBtn.disabled = !isValid;
      }

      // ========== Render recommendation cards ==========
      function renderRecommendCards() {
        const currentMonth = state.month ? parseInt(state.month) : new Date().getMonth() + 1;
        const sorted = [...ISLANDS].sort((a, b) => {
          const aBest = a.bestMonths.includes(currentMonth) ? 1 : 0;
          const bBest = b.bestMonths.includes(currentMonth) ? 1 : 0;
          return bBest - aBest;
        });
        const top4 = sorted.slice(0, 4);

        recommendCards.innerHTML = top4.map((island, idx) => `
          <div class="card animate-scale-in delay-${idx + 1}">
            <img class="card-image" src="${island.image}" alt="${island.name}" loading="lazy">
            <div class="card-body">
              <div class="card-title">${island.name}</div>
              <div class="card-location">${island.location}</div>
              <div class="card-tags">
                ${island.tags.slice(0, 3).map(tag => `<span class="card-tag">${tag}</span>`).join('')}
              </div>
            </div>
          </div>
        `).join('');
      }

      // ========== Go button ==========
      goBtn.addEventListener('click', function() {
        if (this.disabled) return;

        loadingOverlay.classList.add('show');

        const params = new URLSearchParams();
        params.set('month', state.month);
        params.set('days', state.days);
        params.set('budget', state.budget);
        params.set('transport', state.transport);
        params.set('scene', state.scene);
        params.set('preferences', state.preferences.join(','));

        setTimeout(() => {
          window.location.href = 'pages/result.html?' + params.toString();
        }, 1500);
      });

      // ========== Bottom nav ==========
      const NAV_MAP = {
        home: 'index.html',
        discover: 'pages/discover.html',
        favorites: 'pages/favorites.html',
        profile: 'pages/profile.html'
      };
      document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          if (page && NAV_MAP[page]) {
            window.location.href = NAV_MAP[page];
          }
        });
      });

      // ========== Init ==========
      renderRecommendCards();
    })();
  </script>
</body>
</html>
