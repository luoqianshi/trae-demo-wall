<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸鱼公益 - 写明信片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #F7F2EC;
  color: #2D2A26;
  min-height: 100vh;
  padding-bottom: 20px;
}

.back-btn {
  position: absolute;
  top: 12px; left: 12px;
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  text-decoration: none;
  color: #2D2A26;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  z-index: 10;
}

/* ===== 顶部图 ===== */
.hero {
  position: relative;
  width: 100%;
  height: 180px;
  background: linear-gradient(135deg, #C17A53 0%, #D4956A 50%, #7A9E7E 100%);
  border-radius: 0 0 24px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero-img {
  width: 140px;
  height: 140px;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

/* ===== 匹配信息 ===== */
.match-card {
  background: #fff;
  margin: -24px 16px 16px;
  border-radius: 16px;
  padding: 18px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  position: relative;
  z-index: 10;
  text-align: center;
}
.match-tag {
  display: inline-block;
  font-size: 11px;
  color: #7A9E7E;
  background: rgba(122,158,126,0.12);
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}
.match-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.match-info { font-size: 13px; color: #8C7E72; line-height: 1.5; }

/* ===== 明信片模板选择 ===== */
.template-card {
  background: #fff;
  margin: 0 16px 16px;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.template-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.template-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
}
.template-scroll::-webkit-scrollbar { display: none; }
.template-item {
  flex-shrink: 0;
  width: 100px;
  height: 70px;
  border-radius: 10px;
  overflow: hidden;
  border: 3px solid transparent;
  cursor: pointer;
}
.template-item.selected { border-color: #C17A53; }
.template-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== 写信区 ===== */
.letter-card {
  background: #fff;
  margin: 0 16px 16px;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.letter-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.letter-area {
  width: 100%;
  min-height: 140px;
  border: 2px solid #F0E6DC;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  line-height: 1.7;
  resize: none;
  outline: none;
  font-family: inherit;
}
.letter-area:focus { border-color: #C17A53; }
.letter-hint {
  font-size: 12px;
  color: #8C7E72;
  margin-top: 8px;
  text-align: right;
}

/* ===== 贴纸 ===== */
.sticker-card {
  background: #fff;
  margin: 0 16px 16px;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.sticker-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.sticker-grid {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.sticker-item {
  width: 40px; height: 40px;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #F7F2EC;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.2s;
}
.sticker-item:active { transform: scale(0.9); }

/* ===== 发送按钮 ===== */
.send-btn {
  margin: 0 16px;
  width: calc(100% - 32px);
  background: linear-gradient(135deg, #C17A53, #D4956A);
  color: #fff;
  border: none;
  padding: 16px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(193,122,83,0.3);
}
.send-hint {
  text-align: center;
  font-size: 12px;
  color: #8C7E72;
  margin-top: 12px;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: #fff;
  border-radius: 20px;
  padding: 32px 28px;
  text-align: center;
  width: 300px;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-icon { font-size: 56px; margin-bottom: 12px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.modal-text { font-size: 14px; color: #8C7E72; margin-bottom: 20px; }
.modal-btn {
  background: linear-gradient(135deg, #C17A53, #D4956A);
  color: #fff;
  border: none;
  padding: 12px 36px;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="hero">
  <a href="index.html" class="back-btn">&#x2190;</a>
  <img src="assets/postcard_512x512.jpg" class="hero-img" alt="明信片">
</div>

<div class="match-card">
  <div class="match-tag">今日匹配</div>
  <div class="match-name">云南 · 小花（8岁）</div>
  <div class="match-info">大理州云龙县诺邓镇中心小学二年级<br>喜欢画画和读故事书，梦想成为一名老师</div>
</div>

<div class="template-card">
  <div class="template-title">选择明信片模板</div>
  <div class="template-scroll">
    <div class="template-item selected" onclick="selectTemplate(this)">
      <img src="assets/postcard_512x512.jpg" alt="模板1">
    </div>
    <div class="template-item" onclick="selectTemplate(this)">
      <img src="assets/hero_cover_1280x720.jpg" alt="模板2">
    </div>
    <div class="template-item" onclick="selectTemplate(this)">
      <img src="assets/project_library_512x512.jpg" alt="模板3">
    </div>
    <div class="template-item" onclick="selectTemplate(this)">
      <img src="assets/postcard_exchange_1152x864.jpg" alt="模板4">
    </div>
  </div>
</div>

<div class="letter-card">
  <div class="letter-title">写点什么吧</div>
  <textarea class="letter-area" placeholder="亲爱的小花：&#10;&#10;你好呀！我是来自城市的一位大朋友..." id="letterText"></textarea>
  <div class="letter-hint">50-200字，让文字传递温暖</div>
</div>

<div class="sticker-card">
  <div class="sticker-title">加个贴纸</div>
  <div class="sticker-grid">
    <div class="sticker-item" onclick="addSticker('&#x1F31F;')">&#x1F31F;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F338;')">&#x1F338;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F424;')">&#x1F424;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F31E;')">&#x1F31E;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F495;')">&#x1F495;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F384;')">&#x1F384;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F3A8;')">&#x1F3A8;</div>
    <div class="sticker-item" onclick="addSticker('&#x1F4DA;')">&#x1F4DA;</div>
  </div>
</div>

<button class="send-btn" onclick="sendPostcard()">发送明信片</button>
<div class="send-hint">明信片将在 1-3 个工作日内送达</div>

<!-- 发送成功弹窗 -->
<div class="modal-overlay" id="sendModal">
  <div class="modal-content">
    <div class="modal-icon">&#x1F48C;</div>
    <div class="modal-title">明信片已寄出</div>
    <div class="modal-text">你的温暖正在飞向云南山区<br>小花收到后会给你回信哦</div>
    <button class="modal-btn" onclick="location.href='index.html'">返回首页</button>
  </div>
</div>

<script>
function selectTemplate(el) {
  document.querySelectorAll('.template-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
}

function addSticker(emoji) {
  const ta = document.getElementById('letterText');
  ta.value += emoji;
  ta.focus();
}

function sendPostcard() {
  const text = document.getElementById('letterText').value.trim();
  if (!text) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:300;';
    toast.textContent = '先写点什么再发送吧~';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1800);
    return;
  }
  document.getElementById('sendModal').classList.add('show');
}
</script>

</body>
</html>
