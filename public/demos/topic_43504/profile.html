<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸鱼公益 - 我的</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #F7F2EC;
  color: #2D2A26;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ===== 用户信息 ===== */
.user-header {
  background: linear-gradient(135deg, #C17A53 0%, #D4956A 100%);
  padding: 24px 16px 32px;
  border-radius: 0 0 24px 24px;
  color: #fff;
  text-align: center;
}
.user-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: #fff;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.user-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.user-level {
  display: inline-block;
  font-size: 12px;
  background: rgba(255,255,255,0.25);
  padding: 3px 12px;
  border-radius: 12px;
}

/* ===== 数据概览 ===== */
.stats-card {
  background: #fff;
  margin: -20px 16px 16px;
  border-radius: 16px;
  padding: 20px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  position: relative;
  z-index: 10;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.stat-cell { text-align: center; }
.stat-cell .num {
  font-size: 20px; font-weight: 700; color: #C17A53;
}
.stat-cell .label {
  font-size: 11px; color: #8C7E72; margin-top: 4px;
}

/* ===== 菜单列表 ===== */
.menu-card {
  background: #fff;
  margin: 0 16px 16px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.menu-title {
  font-size: 14px; font-weight: 700;
  padding: 14px 16px 8px;
  color: #8C7E72;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #F7F2EC;
  cursor: pointer;
}
.menu-item:last-child { border-bottom: none; }
.menu-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.menu-icon.cert { background: #FFF3E0; }
.menu-icon.postcard { background: #FCE4EC; }
.menu-icon.plan { background: #E3F2FD; }
.menu-icon.record { background: #E8F5E9; }
.menu-icon.setting { background: #F3E5F5; }
.menu-icon.about { background: #FFF8E1; }
.menu-text { flex: 1; font-size: 15px; }
.menu-arrow { font-size: 14px; color: #C4B5A5; }
.menu-badge {
  font-size: 11px;
  background: #C17A53;
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== 证书墙预览 ===== */
.cert-preview {
  display: flex;
  gap: 10px;
  padding: 0 16px 16px;
  overflow-x: auto;
}
.cert-preview::-webkit-scrollbar { display: none; }
.cert-item {
  flex-shrink: 0;
  width: 100px; height: 70px;
  background: linear-gradient(135deg, #FFF8F5, #F0E6DC);
  border-radius: 10px;
  border: 2px solid #F0E6DC;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 11px; color: #8C7E72;
}
.cert-item .cert-icon { font-size: 24px; margin-bottom: 4px; }

/* ===== 底部导航 ===== */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  border-top: 1px solid #F0E6DC;
  z-index: 100;
}
.tab-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  text-decoration: none;
  color: #8C7E72;
  font-size: 11px;
  transition: color 0.2s;
}
.tab-item.active { color: #C17A53; }
.tab-item .tab-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.stats-card, .menu-card { animation: fadeInUp 0.4s ease forwards; }
.menu-card:nth-child(3) { animation-delay: 0.1s; }
.menu-card:nth-child(4) { animation-delay: 0.15s; }
</style>
</head>
<body>

<div class="user-header">
  <div class="user-avatar">&#x1F464;</div>
  <div class="user-name">摸鱼公益用户</div>
  <div class="user-level">微光等级 Lv.3 萤火</div>
</div>

<div class="stats-card">
  <div class="stats-grid">
    <div class="stat-cell">
      <div class="num">128.8</div>
      <div class="label">累计捐赠(元)</div>
    </div>
    <div class="stat-cell">
      <div class="num">356</div>
      <div class="label">微光值</div>
    </div>
    <div class="stat-cell">
      <div class="num">12</div>
      <div class="label">帮助人数</div>
    </div>
    <div class="stat-cell">
      <div class="num">7</div>
      <div class="label">连续签到</div>
    </div>
  </div>
</div>

<div class="menu-card">
  <div class="menu-title">我的公益</div>
  <div class="menu-item" onclick="showToast('证书墙开发中')">
    <div class="menu-icon cert">&#x1F4C3;</div>
    <div class="menu-text">捐赠证书</div>
    <span class="menu-badge">5</span>
    <span class="menu-arrow">&gt;</span>
  </div>
  <div class="menu-item" onclick="location.href='postcard.html'">
    <div class="menu-icon postcard">&#x1F48C;</div>
    <div class="menu-text">我的明信片</div>
    <span class="menu-badge">2</span>
    <span class="menu-arrow">&gt;</span>
  </div>
  <div class="menu-item" onclick="showToast('自动计划开发中')">
    <div class="menu-icon plan">&#x1F4C5;</div>
    <div class="menu-text">自动捐赠计划</div>
    <span class="menu-arrow">&gt;</span>
  </div>
  <div class="menu-item" onclick="showToast('捐赠记录开发中')">
    <div class="menu-icon record">&#x1F4CB;</div>
    <div class="menu-text">捐赠记录</div>
    <span class="menu-arrow">&gt;</span>
  </div>
</div>

<div class="menu-card">
  <div class="menu-title">设置</div>
  <div class="menu-item" onclick="showToast('通知设置开发中')">
    <div class="menu-icon setting">&#x1F514;</div>
    <div class="menu-text">通知偏好</div>
    <span class="menu-arrow">&gt;</span>
  </div>
  <div class="menu-item" onclick="showToast('隐私设置开发中')">
    <div class="menu-icon setting">&#x1F512;</div>
    <div class="menu-text">隐私设置</div>
    <span class="menu-arrow">&gt;</span>
  </div>
  <div class="menu-item" onclick="showToast('关于我们开发中')">
    <div class="menu-icon about">&#x1F4A1;</div>
    <div class="menu-text">关于摸鱼公益</div>
    <span class="menu-arrow">&gt;</span>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
  <a href="index.html" class="tab-item">
    <span class="tab-icon">&#x1F3E0;</span>
    <span>首页</span>
  </a>
  <a href="discover.html" class="tab-item">
    <span class="tab-icon">&#x1F4E0;</span>
    <span>发现</span>
  </a>
  <a href="tasks.html" class="tab-item">
    <span class="tab-icon">&#x2705;</span>
    <span>任务</span>
  </a>
  <a href="community.html" class="tab-item">
    <span class="tab-icon">&#x1F4AC;</span>
    <span>社区</span>
  </a>
  <a href="profile.html" class="tab-item active">
    <span class="tab-icon">&#x1F464;</span>
    <span>我的</span>
  </a>
</div>

<script>
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:300;white-space:nowrap;';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}
</script>

</body>
</html>
