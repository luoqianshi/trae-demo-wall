<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸鱼公益 - 助农小游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #F7F2EC 0%, #E8F5E9 100%);
  color: #2D2A26;
  min-height: 100vh;
  overflow: hidden;
}

.back-btn {
  position: absolute;
  top: 12px; left: 12px;
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  text-decoration: none;
  color: #2D2A26;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  z-index: 10;
}

/* ===== 游戏头部 ===== */
.game-header {
  text-align: center;
  padding: 20px 16px 10px;
}
.game-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.game-sub { font-size: 13px; color: #8C7E72; }
.game-stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 14px;
}
.stat-box {
  background: #fff;
  padding: 10px 20px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  text-align: center;
}
.stat-box .num { font-size: 22px; font-weight: 700; color: #C17A53; }
.stat-box .label { font-size: 11px; color: #8C7E72; }

/* ===== 游戏区域 ===== */
.game-area {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 360px;
  margin: 16px auto;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  overflow: hidden;
}

.hole-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 20px;
  height: 100%;
}

.hole {
  position: relative;
  background: #E8D5C4;
  border-radius: 50%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
}
.hole::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 10%; right: 10%;
  height: 30%;
  background: #D4BFA8;
  border-radius: 50%;
}

.veggie {
  position: absolute;
  bottom: -100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  transition: bottom 0.3s ease;
  z-index: 2;
  pointer-events: none;
}
.veggie.up { bottom: 15%; }
.veggie.hit {
  animation: hitPop 0.4s ease forwards;
}
@keyframes hitPop {
  0% { transform: translateX(-50%) scale(1); opacity: 1; }
  50% { transform: translateX(-50%) scale(1.4); opacity: 0.8; }
  100% { transform: translateX(-50%) scale(0); opacity: 0; }
}

.score-popup {
  position: absolute;
  font-size: 14px;
  font-weight: 700;
  color: #C17A53;
  pointer-events: none;
  animation: floatUp 0.8s ease forwards;
  z-index: 5;
}
@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-40px); opacity: 0; }
}

/* ===== 开始/结束覆盖层 ===== */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  border-radius: 20px;
}
.overlay.hidden { display: none; }
.overlay-icon { font-size: 64px; margin-bottom: 12px; }
.overlay-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.overlay-text { font-size: 14px; color: #8C7E72; margin-bottom: 20px; text-align: center; padding: 0 20px; }
.overlay-btn {
  background: linear-gradient(135deg, #C17A53, #D4956A);
  color: #fff;
  border: none;
  padding: 14px 40px;
  border-radius: 28px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(193,122,83,0.3);
}

/* ===== 倒计时条 ===== */
.timer-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: #F0E6DC;
  z-index: 10;
}
.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #C17A53, #D4956A);
  width: 100%;
  transition: width 1s linear;
}

/* ===== 底部说明 ===== */
.game-footer {
  text-align: center;
  padding: 16px;
  font-size: 13px;
  color: #8C7E72;
}
.game-footer strong { color: #C17A53; }

/* ===== 结果弹窗 ===== */
.result-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.result-modal.show { display: flex; }
.result-content {
  background: #fff;
  border-radius: 20px;
  padding: 32px 28px;
  text-align: center;
  width: 300px;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.result-icon { font-size: 56px; margin-bottom: 12px; }
.result-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.result-score { font-size: 36px; font-weight: 700; color: #C17A53; margin: 8px 0; }
.result-text { font-size: 14px; color: #8C7E72; margin-bottom: 20px; }
.result-reward {
  background: #FFF8F5;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 20px;
  font-size: 14px;
}
.result-reward strong { color: #C17A53; }
.result-btn {
  background: linear-gradient(135deg, #C17A53, #D4956A);
  color: #fff;
  border: none;
  padding: 12px 36px;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
}
.result-btn2 {
  background: transparent;
  color: #8C7E72;
  border: none;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>
<body>

<a href="tasks.html" class="back-btn">&#x2190;</a>

<div class="game-header">
  <div class="game-title">助农小游戏</div>
  <div class="game-sub">点击冒出来的蔬菜，帮助果农收获</div>
  <div class="game-stats">
    <div class="stat-box">
      <div class="num" id="scoreNum">0</div>
      <div class="label">得分</div>
    </div>
    <div class="stat-box">
      <div class="num" id="timeNum">30</div>
      <div class="label">剩余秒</div>
    </div>
  </div>
</div>

<div class="game-area" id="gameArea">
  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

  <div class="hole-grid" id="holeGrid">
    <div class="hole" data-index="0" onclick="whack(0, event)"><div class="veggie" id="v0">&#x1F955;</div></div>
    <div class="hole" data-index="1" onclick="whack(1, event)"><div class="veggie" id="v1">&#x1F955;</div></div>
    <div class="hole" data-index="2" onclick="whack(2, event)"><div class="veggie" id="v2">&#x1F955;</div></div>
    <div class="hole" data-index="3" onclick="whack(3, event)"><div class="veggie" id="v3">&#x1F955;</div></div>
    <div class="hole" data-index="4" onclick="whack(4, event)"><div class="veggie" id="v4">&#x1F955;</div></div>
    <div class="hole" data-index="5" onclick="whack(5, event)"><div class="veggie" id="v5">&#x1F955;</div></div>
    <div class="hole" data-index="6" onclick="whack(6, event)"><div class="veggie" id="v6">&#x1F955;</div></div>
    <div class="hole" data-index="7" onclick="whack(7, event)"><div class="veggie" id="v7">&#x1F955;</div></div>
    <div class="hole" data-index="8" onclick="whack(8, event)"><div class="veggie" id="v8">&#x1F955;</div></div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-icon">&#x1F955;</div>
    <div class="overlay-title">拔萝卜大作战</div>
    <div class="overlay-text">30秒内尽可能多地点击冒出来的蔬菜<br>每收获一个 +10 分</div>
    <button class="overlay-btn" onclick="startGame()">开始游戏</button>
  </div>
</div>

<div class="game-footer">
  游戏得分可兑换 <strong>微光值</strong>，100分 = +30微光
</div>

<!-- 结果弹窗 -->
<div class="result-modal" id="resultModal">
  <div class="result-content">
    <div class="result-icon">&#x1F3C6;</div>
    <div class="result-title">游戏结束</div>
    <div class="result-score" id="finalScore">0</div>
    <div class="result-text" id="resultText">不错哦，继续加油！</div>
    <div class="result-reward">
      获得微光值：<strong id="rewardLight">+0</strong>
    </div>
    <button class="result-btn" onclick="startGame()">再玩一次</button>
    <br>
    <button class="result-btn2" onclick="location.href='tasks.html'">返回任务中心</button>
  </div>
</div>

<script>
const veggies = ['&#x1F955;', '&#x1F954;', '&#x1F360;', '&#x1F346;', '&#x1F345;'];
let score = 0;
let timeLeft = 30;
let gameInterval;
let popInterval;
let activeHoles = new Set();
let playing = false;

function startGame() {
  score = 0;
  timeLeft = 30;
  activeHoles.clear();
  playing = true;
  document.getElementById('scoreNum').textContent = '0';
  document.getElementById('timeNum').textContent = '30';
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('timerFill').style.width = '100%';
  document.getElementById('timerFill').style.transition = 'width 30s linear';

  // 清除所有蔬菜
  for (let i = 0; i < 9; i++) {
    document.getElementById('v' + i).classList.remove('up', 'hit');
  }

  setTimeout(() => {
    document.getElementById('timerFill').style.width = '0%';
  }, 50);

  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timeNum').textContent = timeLeft;
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);

  popInterval = setInterval(popVeggie, 700);
}

function popVeggie() {
  if (!playing) return;
  const available = [];
  for (let i = 0; i < 9; i++) {
    if (!activeHoles.has(i)) available.push(i);
  }
  if (available.length === 0) return;

  const idx = available[Math.floor(Math.random() * available.length)];
  const veggie = document.getElementById('v' + idx);
  const vType = veggies[Math.floor(Math.random() * veggies.length)];
  veggie.innerHTML = vType;
  veggie.classList.remove('hit');
  veggie.classList.add('up');
  activeHoles.add(idx);

  setTimeout(() => {
    if (activeHoles.has(idx)) {
      veggie.classList.remove('up');
      activeHoles.delete(idx);
    }
  }, 1200);
}

function whack(idx, event) {
  if (!playing || !activeHoles.has(idx)) return;

  const veggie = document.getElementById('v' + idx);
  veggie.classList.remove('up');
  veggie.classList.add('hit');
  activeHoles.delete(idx);

  score += 10;
  document.getElementById('scoreNum').textContent = score;

  // 分数飘字
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = '+10';
  popup.style.left = (event.clientX - document.getElementById('gameArea').getBoundingClientRect().left) + 'px';
  popup.style.top = (event.clientY - document.getElementById('gameArea').getBoundingClientRect().top) + 'px';
  document.getElementById('gameArea').appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

function endGame() {
  playing = false;
  clearInterval(gameInterval);
  clearInterval(popInterval);
  document.getElementById('timerFill').style.transition = 'none';

  const reward = Math.min(Math.floor(score / 3), 30);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('rewardLight').textContent = '+' + reward;

  let text = '';
  if (score >= 200) text = '太厉害了！你是助农小能手！';
  else if (score >= 100) text = '不错哦，继续加油！';
  else text = '下次再接再厉，熟能生巧！';
  document.getElementById('resultText').textContent = text;

  document.getElementById('resultModal').classList.add('show');
}
</script>

</body>
</html>
