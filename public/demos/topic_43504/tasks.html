<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸鱼公益 - 任务中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #F7F2EC;
  color: #2D2A26;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ===== 顶部 ===== */
.header {
  background: linear-gradient(135deg, #7A9E7E 0%, #9AB89D 100%);
  padding: 16px;
  border-radius: 0 0 24px 24px;
  color: #fff;
}
.header-title { font-size: 20px; font-weight: 700; }
.header-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

/* ===== 今日进度 ===== */
.progress-card {
  background: #fff;
  margin: -20px 16px 16px;
  border-radius: 16px;
  padding: 18px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  position: relative;
  z-index: 10;
}
.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.progress-label { font-size: 14px; font-weight: 600; }
.progress-val { font-size: 14px; color: #8C7E72; }
.progress-val span { color: #C17A53; font-weight: 700; }
.progress-bar {
  height: 8px;
  background: #F0E6DC;
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #C17A53, #D4956A);
  border-radius: 4px;
  width: 45%;
  transition: width 0.8s ease;
}
.progress-hint {
  font-size: 12px;
  color: #8C7E72;
  margin-top: 10px;
  text-align: center;
}

/* ===== 任务列表 ===== */
.section-title {
  font-size: 16px;
  font-weight: 700;
  margin: 20px 16px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::before {
  content: '';
  width: 4px; height: 18px;
  background: #C17A53;
  border-radius: 2px;
}

.task-list { margin: 0 16px; }
.task-row {
  background: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.task-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.task-icon.sign { background: #FFF3E0; }
.task-icon.game { background: #E8F5E9; }
.task-icon.quiz { background: #E3F2FD; }
.task-icon.steps { background: #F3E5F5; }
.task-icon.read { background: #FFF8E1; }
.task-icon.card { background: #FCE4EC; }
.task-icon.invite { background: #E0F2F1; }

.task-info { flex: 1; }
.task-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.task-desc { font-size: 12px; color: #8C7E72; }
.task-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.task-reward {
  font-size: 13px;
  color: #C17A53;
  font-weight: 700;
}
.task-btn {
  background: linear-gradient(135deg, #C17A53, #D4956A);
  color: #fff;
  border: none;
  padding: 6px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.task-btn.done {
  background: #E8E8E8;
  color: #999;
}

/* ===== 底部导航 ===== */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  border-top: 1px solid #F0E6DC;
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  text-decoration: none;
  color: #8C7E72;
  font-size: 11px;
  transition: color 0.2s;
}
.tab-item.active { color: #C17A53; }
.tab-item .tab-icon {
  width: 24px; height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* Toast */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.task-row { animation: fadeInUp 0.4s ease forwards; }
.task-row:nth-child(1) { animation-delay: 0.05s; }
.task-row:nth-child(2) { animation-delay: 0.1s; }
.task-row:nth-child(3) { animation-delay: 0.15s; }
.task-row:nth-child(4) { animation-delay: 0.2s; }
.task-row:nth-child(5) { animation-delay: 0.25s; }
.task-row:nth-child(6) { animation-delay: 0.3s; }
.task-row:nth-child(7) { animation-delay: 0.35s; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">任务中心</div>
  <div class="header-sub">完成任务，积累微光值，让善意发光</div>
</div>

<div class="progress-card">
  <div class="progress-top">
    <div class="progress-label">今日任务进度</div>
    <div class="progress-val"><span>3</span> / 7 已完成</div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" style="width: 42%"></div>
  </div>
  <div class="progress-hint">再完成 4 个任务可获得 <strong>+20 额外奖励</strong></div>
</div>

<div class="section-title">每日任务</div>
<div class="task-list">
  <div class="task-row">
    <div class="task-icon sign">&#x1F4C5;</div>
    <div class="task-info">
      <div class="task-name">每日签到</div>
      <div class="task-desc">连续签到 3 天，明天可得 +10</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+5 微光</div>
      <button class="task-btn done">已完成</button>
    </div>
  </div>

  <div class="task-row" onclick="location.href='game.html'">
    <div class="task-icon game">&#x1F955;</div>
    <div class="task-info">
      <div class="task-name">助农小游戏</div>
      <div class="task-desc">玩一局"拔萝卜"，帮助虚拟果农</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+30 微光</div>
      <button class="task-btn">去玩玩</button>
    </div>
  </div>

  <div class="task-row" onclick="showToast('知识问答开发中')">
    <div class="task-icon quiz">&#x1F4DA;</div>
    <div class="task-info">
      <div class="task-name">知识问答</div>
      <div class="task-desc">答对 3 道公益知识题</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+15 微光</div>
      <button class="task-btn">去答题</button>
    </div>
  </div>

  <div class="task-row" onclick="showToast('步数捐赠开发中')">
    <div class="task-icon steps">&#x1F463;</div>
    <div class="task-info">
      <div class="task-name">步数捐赠</div>
      <div class="task-desc">今日步数 5,230 / 10,000</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+20 微光</div>
      <button class="task-btn">去同步</button>
    </div>
  </div>

  <div class="task-row" onclick="showToast('阅读故事开发中')">
    <div class="task-icon read">&#x1F4D6;</div>
    <div class="task-info">
      <div class="task-name">阅读故事</div>
      <div class="task-desc">阅读一篇受助人故事</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+15 微光</div>
      <button class="task-btn">去阅读</button>
    </div>
  </div>

  <div class="task-row" onclick="location.href='postcard.html'">
    <div class="task-icon card">&#x1F48C;</div>
    <div class="task-info">
      <div class="task-name">写明信片</div>
      <div class="task-desc">给山区小朋友写一张电子明信片</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+25 微光</div>
      <button class="task-btn">去写信</button>
    </div>
  </div>

  <div class="task-row" onclick="showToast('邀请好友开发中')">
    <div class="task-icon invite">&#x1F465;</div>
    <div class="task-info">
      <div class="task-name">邀请好友</div>
      <div class="task-desc">邀请好友加入摸鱼公益</div>
    </div>
    <div class="task-right">
      <div class="task-reward">+50 微光</div>
      <button class="task-btn">去邀请</button>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
  <a href="index.html" class="tab-item">
    <span class="tab-icon">&#x1F3E0;</span>
    <span>首页</span>
  </a>
  <a href="discover.html" class="tab-item">
    <span class="tab-icon">&#x1F4E0;</span>
    <span>发现</span>
  </a>
  <a href="tasks.html" class="tab-item active">
    <span class="tab-icon">&#x2705;</span>
    <span>任务</span>
  </a>
  <a href="community.html" class="tab-item">
    <span class="tab-icon">&#x1F4AC;</span>
    <span>社区</span>
  </a>
  <a href="profile.html" class="tab-item">
    <span class="tab-icon">&#x1F464;</span>
    <span>我的</span>
  </a>
</div>

<script>
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:300;white-space:nowrap;';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}
</script>

</body>
</html>
