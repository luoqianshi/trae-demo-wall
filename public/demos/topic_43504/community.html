<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸鱼公益 - 社区</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #F7F2EC;
  color: #2D2A26;
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  background: linear-gradient(135deg, #C17A53 0%, #D4956A 100%);
  padding: 16px;
  border-radius: 0 0 24px 24px;
  color: #fff;
}
.header-title { font-size: 20px; font-weight: 700; }
.header-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

/* ===== 排行榜 ===== */
.rank-card {
  background: #fff;
  margin: -20px 16px 16px;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  position: relative;
  z-index: 10;
}
.rank-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
}
.rank-num {
  width: 24px; text-align: center;
  font-size: 14px; font-weight: 700;
  color: #8C7E72;
}
.rank-num.top { color: #C17A53; font-size: 16px; }
.rank-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #C17A53, #D4956A);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 700;
}
.rank-name { flex: 1; font-size: 14px; }
.rank-score { font-size: 13px; color: #C17A53; font-weight: 700; }

/* ===== 动态列表 ===== */
.section-title {
  font-size: 16px; font-weight: 700;
  margin: 20px 16px 12px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::before {
  content: ''; width: 4px; height: 18px;
  background: #C17A53; border-radius: 2px;
}

.feed-list { margin: 0 16px; }
.feed-card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.feed-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.feed-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7A9E7E, #9AB89D);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px;
}
.feed-user { flex: 1; }
.feed-name { font-size: 14px; font-weight: 600; }
.feed-time { font-size: 11px; color: #8C7E72; }
.feed-content { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
.feed-img {
  width: 100%; height: 160px;
  object-fit: cover; border-radius: 10px;
  margin-bottom: 10px;
}
.feed-actions {
  display: flex; gap: 20px;
  padding-top: 10px;
  border-top: 1px solid #F0E6DC;
}
.feed-action {
  display: flex; align-items: center; gap: 4px;
  font-size: 13px; color: #8C7E72;
  cursor: pointer;
}
.feed-action.active { color: #C17A53; }

/* ===== 底部导航 ===== */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  border-top: 1px solid #F0E6DC;
  z-index: 100;
}
.tab-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  text-decoration: none;
  color: #8C7E72;
  font-size: 11px;
  transition: color 0.2s;
}
.tab-item.active { color: #C17A53; }
.tab-item .tab-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.feed-card { animation: fadeInUp 0.4s ease forwards; }
.feed-card:nth-child(1) { animation-delay: 0.05s; }
.feed-card:nth-child(2) { animation-delay: 0.1s; }
.feed-card:nth-child(3) { animation-delay: 0.15s; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">社区</div>
  <div class="header-sub">看看大家都在做什么好事</div>
</div>

<div class="rank-card">

    <div class="rank-item">

</div>

    <img src="assets/postcard_512x512.jpg" class="feed-img" alt="明信片">

    </div>
  </div>

  <div class="feed-card">
    <div class="feed-header">
      <div class="feed-avatar" style="background:linear-gradient(135deg,#D4956A,#E8B896)">阿</div>
      <div class="feed-user">
        <div class="feed-name">阿杰</div>
        <div class="feed-time">昨天</div>
      </div>
    </div>
    <div class="feed-content">开启了"一杯奶茶钱计划"，每月自动捐18.8元。做公益也可以很轻松~</div>
    <div class="feed-actions">

      <div class="feed-action">&#x1F4AC; 8</div>
      <div class="feed-action">&#x1F4E4; 分享</div>
    </div>
  </div>
</div>

</body>
</html>
