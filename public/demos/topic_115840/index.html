<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵植 - 你的玄学绿植伴侣</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">🌿</span>
          <span class="logo-text">灵植</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-bar">
          <input type="text" placeholder="搜索绿植、运势..." id="searchInput">
          <span class="search-icon">🔍</span>
        </div>
      </div>
      <div class="header-right">
        <div class="date-display">
          <span id="currentDate"></span>
        </div>
        <button class="notification-btn" onclick="showNotification()">🔔</button>
      </div>
    </header>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="navigateTo('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">首页</span>
      </button>
      <button class="nav-item" onclick="navigateTo('plants')">
        <span class="nav-icon">🌱</span>
        <span class="nav-text">灵植库</span>
      </button>
      <button class="nav-item" onclick="navigateTo('care')">
        <span class="nav-icon">💧</span>
        <span class="nav-text">养护</span>
      </button>
      <button class="nav-item" onclick="navigateTo('profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-text">我的</span>
      </button>
    </nav>

    <main class="main-content">
      <div id="page-home" class="page">
        <section class="hero-section">
          <div class="hero-bg"></div>
          <div class="hero-content">
            <div class="hero-date">
              <span id="heroDate"></span>
              <span id="heroLunar"></span>
            </div>
            <h1 class="hero-title">今日运势绿植</h1>
            <div class="hero-plant-card" onclick="showPlantDetail('p001')">
              <img src="https://copilot-cn.bytedance.net/api/ide/v1/text_to_image?prompt=lucky%20money%20tree%20plant%20with%20golden%20coins%20on%20elegant%20white%20background%20Chinese%20style%20minimalist&image_size=square" alt="发财树" class="hero-plant-img">
              <div class="hero-plant-info">
                <h2 class="hero-plant-name">发财树</h2>
                <p class="hero-plant-meaning">💰 广纳财气，福气不散</p>
                <p class="hero-plant-tip">今日宜：东南方位摆放</p>
              </div>
            </div>
            <div class="hero-lucky">
              <span class="lucky-icon">✨</span>
              <span>今日幸运色：金色</span>
              <span>幸运数字：8</span>
            </div>
          </div>
        </section>

        <section class="quick-entry">
          <h3 class="section-title">快捷入口</h3>
          <div class="entry-grid">
            <div class="entry-card" onclick="navigateTo('plants')">
              <div class="entry-icon">🔥</div>
              <div class="entry-text">热门推荐</div>
            </div>
            <div class="entry-card" onclick="navigateTo('plants')">
              <div class="entry-icon">🌱</div>
              <div class="entry-text">新手入门</div>
            </div>
            <div class="entry-card" onclick="navigateTo('plants')">
              <div class="entry-icon">🍀</div>
              <div class="entry-text">转运植物</div>
            </div>
            <div class="entry-card" onclick="navigateTo('plants')">
              <div class="entry-icon">🏠</div>
              <div class="entry-text">客厅绿植</div>
            </div>
          </div>
        </section>

        <section class="feed-section">
          <h3 class="section-title">灵植社区</h3>
          <div class="feed-list" id="feedList">
          </div>
        </section>
      </div>

      <div id="page-plants" class="page hidden">
        <div class="plants-header">
          <h2 class="page-title">灵植库</h2>
          <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterPlants('all')">全部</button>
            <button class="filter-tab" onclick="filterPlants('wealth')">招财</button>
            <button class="filter-tab" onclick="filterPlants('health')">健康</button>
            <button class="filter-tab" onclick="filterPlants('career')">事业</button>
            <button class="filter-tab" onclick="filterPlants('love')">感情</button>
          </div>
        </div>
        <div class="plants-grid" id="plantsGrid">
        </div>
      </div>

      <div id="page-care" class="page hidden">
        <div class="care-header">
          <h2 class="page-title">养护助手</h2>
        </div>
        <div class="garden-section">
          <div class="section-header">
            <h3 class="section-title">我的花园</h3>
            <button class="add-plant-btn" onclick="addPlantToGarden()">+ 添加植物</button>
          </div>
          <div class="garden-list" id="gardenList">
          </div>
        </div>
        <div class="tips-section">
          <h3 class="section-title">养护小贴士</h3>
          <div class="tips-list" id="tipsList">
          </div>
        </div>
      </div>

      <div id="page-profile" class="page hidden">
        <div class="profile-header">
          <div class="profile-card">
            <div class="avatar-container">
              <div class="avatar">👤</div>
              <div class="level-badge">Lv.1</div>
            </div>
            <div class="profile-info">
              <h2 class="profile-name" id="profileName">灵植新手</h2>
              <p class="profile-title" id="profileTitle">植物爱好者</p>
            </div>
            <button class="edit-btn" onclick="editProfile()">编辑档案</button>
          </div>
        </div>

        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-value" id="statPlants">0</span>
            <span class="stat-label">我的植物</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statDays">0</span>
            <span class="stat-label">连续养护</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statAchieve">0</span>
            <span class="stat-label">获得成就</span>
          </div>
        </div>

        <div class="profile-section">
          <h3 class="section-title">命理档案</h3>
          <div class="profile-form" id="profileForm">
            <div class="form-group">
              <label>出生日期</label>
              <span id="profileBirthDate" class="form-value">未填写</span>
            </div>
            <div class="form-group">
              <label>性别</label>
              <span id="profileGender" class="form-value">未填写</span>
            </div>
            <div class="form-group">
              <label>当前需求</label>
              <span id="profileNeeds" class="form-value">未设置</span>
            </div>
          </div>
        </div>

        <div class="profile-section">
          <h3 class="section-title">成就徽章</h3>
          <div class="achievements-list" id="achievementsList">
          </div>
        </div>

        <div class="profile-menu">
          <div class="menu-item">
            <span class="menu-icon">📖</span>
            <span class="menu-text">养植日记</span>
          </div>
          <div class="menu-item">
            <span class="menu-icon">🎁</span>
            <span class="menu-text">我的奖品</span>
          </div>
          <div class="menu-item">
            <span class="menu-icon">⚙️</span>
            <span class="menu-text">设置</span>
          </div>
        </div>
      </div>

      <div id="page-plant-detail" class="page hidden">
        <button class="back-btn" onclick="navigateTo('plants')">← 返回</button>
        <div class="plant-detail-content" id="plantDetailContent">
        </div>
      </div>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
    <div id="modal-container" class="modal-container hidden">
      <div id="modal-edit-profile" class="modal-content">
        <div class="modal-header">
          <h3>完善命理档案</h3>
          <button class="close-modal" onclick="closeModal()">×</button>
        </div>
        <form class="modal-form" id="editProfileForm">
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="editNickname" placeholder="请输入昵称">
          </div>
          <div class="form-group">
            <label>性别</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="male"> 男</label>
              <label><input type="radio" name="gender" value="female"> 女</label>
            </div>
          </div>
          <div class="form-group">
            <label>出生日期</label>
            <input type="date" id="editBirthDate">
            <span class="form-hint">用于计算五行八字，推荐本命绿植</span>
          </div>
          <div class="form-group">
            <label>出生时辰（选填）</label>
            <select id="editBirthTime">
              <option value="">不知道</option>
              <option value="子时">子时 (23:00-01:00)</option>
              <option value="丑时">丑时 (01:00-03:00)</option>
              <option value="寅时">寅时 (03:00-05:00)</option>
              <option value="卯时">卯时 (05:00-07:00)</option>
              <option value="辰时">辰时 (07:00-09:00)</option>
              <option value="巳时">巳时 (09:00-11:00)</option>
              <option value="午时">午时 (11:00-13:00)</option>
              <option value="未时">未时 (13:00-15:00)</option>
              <option value="申时">申时 (15:00-17:00)</option>
              <option value="酉时">酉时 (17:00-19:00)</option>
              <option value="戌时">戌时 (19:00-21:00)</option>
              <option value="亥时">亥时 (21:00-23:00)</option>
            </select>
          </div>
          <div class="form-group">
            <label>出生地（选填）</label>
            <input type="text" id="editBirthPlace" placeholder="如：北京">
          </div>
          <div class="form-group">
            <label>当前需求</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="needs" value="wealth"> 招财旺运</label>
              <label><input type="checkbox" name="needs" value="health"> 健康平安</label>
              <label><input type="checkbox" name="needs" value="career"> 事业提升</label>
              <label><input type="checkbox" name="needs" value="love"> 感情顺利</label>
              <label><input type="checkbox" name="needs" value="study"> 学业进步</label>
              <label><input type="checkbox" name="needs" value="home"> 家宅和谐</label>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">暂不填写</button>
            <button type="submit" class="btn-primary">开启灵植之旅</button>
          </div>
        </form>
      </div>

      <div id="modal-plant-detail" class="modal-content">
      </div>
    </div>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
