带路吧，我真的不想错过第一盘。"}],keywords:["wrong","other way","right","left","follow","turn","section","aisle","trust","lead","this way"],tips:`观众走错方向时，不要直接说"You're wrong"，用"Actually..."或"Right this way"更温和，主动带路比单纯指方向更有效。`,closingLine:"你把观众从错误方向带到了正确的C区入口，观众顺利入座。"}]},4:{dayNumber:4,title:"票务问题处理",subtitle:"网球志愿者 · Day 4",scenes:[{id:1,location:"检票闸机前",background:"一位观众在闸机前翻遍了所有口袋和包，神情越来越焦急。",script:[{text:"Oh no... I can't find my ticket anywhere. I swear I had it in my hand just now! Can I still enter?",textZh:"糟糕……我哪儿都找不到票。我发誓刚才还拿在手里的！我还能进去吗？"},{text:"The ticket office? But the match is starting! I don't want to miss the opening match!",textZh:"票务窗口？可是比赛就要开始了！我不想错过开幕赛啊！"},{text:"Okay, okay, thank you. Can you show me where the ticket office is? I really appreciate it.",textZh:"好吧，谢谢你。你能指给我看票务窗口在哪里吗？非常感谢。"}],keywords:["don't worry","ticket office","reprint","please","help","calm","this way","assist","box office"],tips:`观众丢票会很焦虑，先用"Don't worry"安抚，再引导到票务窗口（不能自行放行），语气要温和坚定。`,closingLine:"你安抚了观众的情绪并引导到票务处补票，观众赶在第二局开始前进入了场馆。"},{id:2,location:"检票口",background:"一位观众反复用手机电子票尝试扫描闸机，但闸机一直红灯不通过。",script:[{text:"Ugh, this is so frustrating. My e-ticket isn't scanning. I've tried three times already!",textZh:"唉，真气人。我的电子票扫不出来，我已经试了三次了！"},{text:"Brightness? Let me check... wait, is it because I have dark mode on?",textZh:"亮度？我看看……等等，是不是因为我开了深色模式？"},{text:"It's still not working. Hmm, maybe I should go to the ticket window. Can you point me there?",textZh:"还是不行。看来我得去票务窗口了，你能指一下方向吗？"}],keywords:["brightness","screen","try","adjust","please","help","barcode","ticket office","dark mode","scan again"],tips:"电子票扫不出通常是屏幕亮度或条码损坏问题，先建议调亮屏幕，如仍不行再引导至票务窗口。",closingLine:"观众调亮屏幕后顺利扫码入场，还感谢了你耐心的指导。"},{id:3,location:"入口处",background:"两个年轻人嬉笑着走来，只举着一张票想一起通过闸机。",script:[{text:"Hey buddy! We're together, can we just squeeze through? We'll be quick!",textZh:"嘿兄弟！我们是一起的，让我们挤过去吧？很快的！"},{text:"Aww come on, it's not that strict, right? The seat next to my friend is empty anyway.",textZh:"哎呀别这样，没那么严格吧？反正我朋友旁边的座位也是空的。"},{text:"Alright, alright, fine. Where can we buy another ticket quickly? We don't want to miss too much.",textZh:"好吧好吧。哪里能快速再买一张票？我们不想错过太多比赛。"}],keywords:["sorry","afraid","one ticket","each person","policy","ticket office","understand","i'm sorry","rule"],tips:`遇到软磨硬泡想无票入场的观众，态度要友好但坚定，用"I'm afraid"温和解释规则，不要被带节奏。`,closingLine:"你礼貌但坚定地执行了规则，并引导观众到售票亭购买了额外的票。"}]},5:{dayNumber:5,title:"座位引导与现场咨询",subtitle:"网球志愿者 · Day 5",scenes:[{id:1,location:"看台通道",background:"比赛正在进行中，一位迟到的观众猫着腰在昏暗过道里找座位。",script:[{text:"Psst... sorry, I'm late. Where is Row 12, Seat 8? I can't see a thing in here.",textZh:"嘘……抱歉我迟到了。12排8号在哪里？这里面太黑了我什么都看不见。"},{text:"Oh right, the match is in play. Am I blocking anyone's view? I feel terrible.",textZh:"哦对，比赛在进行中。我挡到别人视线了吗？太不好意思了。"},{text:"Thank you for walking me over. I'll wait here until the changeover before sitting down.",textZh:"谢谢你带我过来。我等换边的时候再坐下。"}],keywords:["row","seat","this way","quiet","follow","aisle","please","down","wait","changeover","whisper"],tips:"比赛中引导迟到观众要压低声音，提醒他们等换边（changeover）时再入座，弯着腰快速带位。",closingLine:"你轻声快速地把观众带到座位旁，观众在换边时安静入座，没有打扰到其他观众。"},{id:2,location:"场馆大厅",background:"中场休息时，一位观众带着两个小孩四处张望。",script:[{text:"Excuse me, where can I buy some water? The kids are really thirsty after that first set.",textZh:"请问哪里可以买水？第一盘打完孩子们都渴坏了。"},{text:"Free water fountain? That sounds great. Where exactly is that? And is there a restroom nearby too?",textZh:"免费饮水处？太好了。具体在哪里？附近有洗手间吗？"},{text:"Perfect, that's everything. You volunteers are so helpful, thank you!",textZh:"太好了，都解决了。你们志愿者真热心，谢谢！"}],keywords:["concession","water fountain","over there","straight","right","restroom","around corner","free","kids"],tips:"带小孩的观众可能需要多种信息（水、厕所、餐饮），可以一次性告知附近的设施位置，体现主动服务意识。",closingLine:"你不仅指了饮水处和洗手间的位置，还简单介绍了周边设施，家长带着孩子们开心地前往。"},{id:3,location:"看台区",background:"比赛即将开始，一位观众坐在座位上反复核对自己的票，旁边站着另一位观众。",script:[{text:"Excuse me, is this Seat 15? I've been sitting here but this person says it's their seat.",textZh:"您好，这是15号座位吗？我一直坐在这儿，但这个人说是他的座位。"},{text:"Oh,
