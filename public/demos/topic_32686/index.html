<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球Online：星轨互换计划</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { display: none; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000000;
  font-family: 'Noto Sans SC', sans-serif;
}

#canvas-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

.stage {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
}

.stage.active { opacity: 1; pointer-events: auto; }

#stage1 { background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 70%); }

.input-container {
  position: relative;
  width: 60%;
  max-width: 800px;
}

.glow-line {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,220,255,0.6), transparent);
  box-shadow: 0 0 20px rgba(100,150,255,0.3), 0 0 40px rgba(100,150,255,0.1);
  animation: pulse-line 3s ease-in-out infinite;
}

@keyframes pulse-line { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

.cosmic-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: rgba(220,240,255,0.9);
  font-size: 1.2rem;
  font-weight: 200;
  letter-spacing: 0.05em;
  text-align: center;
  padding: 20px 0;
  font-family: 'Noto Sans SC', sans-serif;
}

.cosmic-input::placeholder { color: rgba(150,180,220,0.4); font-weight: 200; }

.floating-particle {
  position: absolute;
  width: 2px; height: 2px;
  background: rgba(255,255,255,0.8);
  border-radius: 50%;
  pointer-events: none;
}

#stage2 { background: #000000; }

.astro-container {
  position: relative;
  width: 400px; height: 400px;
  cursor: grab;
}

.astro-container.dragging {
  cursor: grabbing;
}

.orbit {
  position: absolute;
  border: 1px solid rgba(100,150,255,0.3);
  border-radius: 50%;
  transition: box-shadow 0.3s ease;
}

.orbit:hover { border-color: rgba(150,200,255,0.5); }

.orbit.c1 { width:100px;height:100px;top:50%;left:50%;margin-left:-50px;margin-top:-50px; }
.orbit.c2 { width:200px;height:200px;top:50%;left:50%;margin-left:-100px;margin-top:-100px; }
.orbit.c3 { width:300px;height:300px;top:50%;left:50%;margin-left:-150px;margin-top:-150px; }
.orbit.c4 { width:400px;height:400px;top:50%;left:50%;margin-left:-200px;margin-top:-200px; }

.orbit-center {
  position: absolute;
  width: 8px; height: 8px;
  background: rgba(200,230,255,0.8);
  border-radius: 50%;
  top: 50%; left: 50%;
  margin-left: -4px; margin-top: -4px;
  box-shadow: 0 0 20px rgba(150,200,255,0.5);
}

.vibrating .orbit {
  animation: orbit-vibrate 0.1s linear infinite;
  box-shadow: 0 0 30px rgba(100,200,255,0.8), 0 0 60px rgba(100,200,255,0.4);
}

@keyframes orbit-vibrate {
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(1px,0)}
  50%{transform:translate(0,1px)}
  75%{transform:translate(-1px,0)}
}

#stage3 { background: #000000; }

.resonance-text {
  color: rgba(200,230,255,0.9);
  font-size: 1rem;
  font-weight: 200;
  letter-spacing: 0.1em;
  text-align: center;
  line-height: 2.5;
  opacity: 0;
}

#stage4 { background: radial-gradient(ellipse at center, #050510 0%, #000000 60%); }

.card-container { perspective: 1200px; cursor: pointer; }

.shift-card {
  width: 360px; height: 520px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 1.2s cubic-bezier(0.4,0,0.2,1);
}

.shift-card.flipped { transform: rotateX(180deg); }

.card-face {
  position: absolute;
  width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 24px;
  backdrop-filter: blur(20px);
  background: rgba(20,30,50,0.4);
  border: 1px solid rgba(100,150,255,0.2);
  overflow: hidden;
}

.card-front { padding: 32px; }
.card-back { transform: rotateX(180deg); padding: 32px; }

.illustration-placeholder {
  width: 100%; height: 180px;
  border-radius: 16px;
  background: rgba(10,20,40,0.6);
  border: 1px solid rgba(100,150,255,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
  overflow: hidden;
}

.illustration-svg {
  width: 100%;
  height: 100%;
}

.diary-text {
  color: rgba(220,240,255,0.85);
  font-size: 0.9rem;
  font-weight: 200;
  line-height: 1.8;
  letter-spacing: 0.02em;
}

.task-section { margin-bottom: 20px; }
.task-section:last-child { margin-bottom: 0; }

.task-number {
  color: rgba(150,200,255,0.4);
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.2em;
  margin-bottom: 8px;
}

.task-text {
  color: rgba(220,240,255,0.8);
  font-size: 0.85rem;
  font-weight: 200;
  line-height: 1.6;
}

.back-home {
  position: absolute;
  bottom: 60px;
  color: rgba(150,200,255,0.4);
  font-size: 0.8rem;
  font-weight: 200;
  letter-spacing: 0.2em;
  cursor: pointer;
  opacity: 0;
  transition: opacity 1.5s ease, color 0.3s ease;
}

.back-home:hover { color: rgba(200,230,255,0.8); }

.back-home.visible { opacity: 1; }

.stage-hint {
  position: absolute;
  bottom: 80px;
  color: rgba(150,200,255,0.35);
  font-size: 0.85rem;
  font-weight: 200;
  letter-spacing: 0.15em;
  opacity: 0;
  animation: hint-fade 2s ease 1s forwards;
}

@keyframes hint-fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.achievement-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 2s ease;
}

.achievement-overlay.active { opacity: 1; }

.achievement-text {
  color: rgba(255,215,100,0.9);
  font-size: 0.95rem;
  font-weight: 200;
  letter-spacing: 0.3em;
  text-align: center;
  animation: achievement-glow 3s ease-in-out infinite;
}

@keyframes achievement-glow {
  0%,100%{text-shadow:0 0 20px rgba(255,215,100,0.3);opacity:0.6}
  50%{text-shadow:0 0 40px rgba(255,215,100,0.6),0 0 80px rgba(255,215,100,0.3);opacity:1}
}

.supernova-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 99;
  pointer-events: none;
}

@media (max-width:768px) {
  .input-container { width: 85%; }
  .cosmic-input { font-size: 1rem; }
  .astro-container { width: 280px; height: 280px; }
  .orbit.c1 { width:70px;height:70px;margin-left:-35px;margin-top:-35px; }
  .orbit.c2 { width:140px;height:140px;margin-left:-70px;margin-top:-70px; }
  .orbit.c3 { width:210px;height:210px;margin-left:-105px;margin-top:-105px; }
  .orbit.c4 { width:280px;height:280px;margin-left:-140px;margin-top:-140px; }
  .shift-card { width: 280px; height: 420px; }
  .card-front,.card-back { padding: 24px; }
  .illustration-placeholder { height: 140px; margin-bottom: 18px; }
  .diary-text { font-size: 0.8rem; }
}
</style>
</head>
<body>

<div id="canvas-container"><canvas id="starCanvas"></canvas></div>

<div class="stage active" id="stage1">
  <div class="input-container">
    <input type="text" class="cosmic-input" id="cosmicInput" placeholder="写下你今天的烦恼，建立宇宙档案..." autocomplete="off">
    <div class="glow-line"></div>
  </div>
</div>

<div class="stage" id="stage2">
  <div class="astro-container" id="astroContainer">
    <div class="orbit orbit-center"></div>
    <div class="orbit c1" data-orbit="0"></div>
    <div class="orbit c2" data-orbit="1"></div>
    <div class="orbit c3" data-orbit="2"></div>
    <div class="orbit c4" data-orbit="3"></div>
  </div>
  <div class="stage-hint" id="stage2Hint">拨动星轨，释放心绪...</div>
</div>

<div class="stage" id="stage3">
  <div class="resonance-text" id="resonanceText"></div>
</div>

<div class="stage" id="stage4">
  <div class="card-container" id="cardContainer">
    <div class="shift-card" id="shiftCard">
      <div class="card-face card-front">
        <div class="illustration-placeholder" id="illustrationContainer">
          <svg class="illustration-svg" viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice" id="illustrationSvg"></svg>
        </div>
        <div class="diary-text" id="diaryText">
          "今夜的雷克雅未克没有极光，但海浪拍打礁石的声音比任何光都更清晰。我在灯塔里守望着这片黑色的海，想起你写下的烦恼。其实星辰一直在那里，只是云层太厚。当你愿意抬头时，它们会为你闪烁。"
        </div>
      </div>
      <div class="card-face card-back">
        <div class="task-section"><div class="task-number">01</div><div class="task-text" id="task1">像灯塔守望者一样，静坐5分钟</div></div>
        <div class="task-section"><div class="task-number">02</div><div class="task-text" id="task2">走到窗边，观察天空的颜色变化</div></div>
        <div class="task-section"><div class="task-number">03</div><div class="task-text" id="task3">写下一件今天让你微笑的小事</div></div>
      </div>
    </div>
  </div>
  <div class="back-home" id="backHome">重新开始</div>
</div>

<div class="achievement-overlay" id="achievementOverlay">
  <div class="achievement-text">隐藏成就解锁：跨越光年的共鸣</div>
</div>

<canvas class="supernova-canvas" id="supernovaCanvas"></canvas>

<script>
var stages = ['stage1','stage2','stage3','stage4'];
var currentStage = 0;

function switchStage(index) {
  document.getElementById(stages[currentStage]).classList.remove('active');
  currentStage = index;
  document.getElementById(stages[currentStage]).classList.add('active');
  
  if(currentStage === 1) {
    initStage2();
  } else if(currentStage === 2) {
    initStage3();
  } else if(currentStage === 3) {
    initStage4();
  }
}

var userInput = '';
var matchedLocation = null;

var fallbackDatabase = {
  "locations": [
    { "id": 1, "name": "冰岛·雷克雅未克", "coords": "64N, 21W", "keywords": ["焦虑", "压力", "紧张", "烦躁", "不安", "失眠", "担忧", "恐惧", "害怕"], "atmosphere": "清冷", "diary": "今夜的雷克雅未克没有极光，但海浪拍打礁石的声音比任何光都更清晰。我在灯塔里守望着这片黑色的海，想起你写下的烦恼。其实星辰一直在那里，只是云层太厚。当你愿意抬头时，它们会为你闪烁。", "tasks": ["像灯塔守望者一样，静坐5分钟", "走到窗边，观察天空的颜色变化", "写下一件今天让你微笑的小事"] },
    { "id": 2, "name": "挪威·卑尔根", "coords": "60N, 5E", "keywords": ["孤独", "寂寞", "失落", "伤感", "难过", "悲伤", "心碎", "想念"], "atmosphere": "忧郁", "diary": "卑尔根的雨已经下了三天，但我知道云层之上永远有阳光。雨雾中的木屋透出温暖的灯火，就像你心中未曾熄灭的希望。孤独其实并不可怕，它只是让你更清晰地听见自己内心的声音。", "tasks": ["泡一杯热茶，静静听雨", "给远方的朋友发一条问候消息", "在纸上写下三个感谢的人"] },
    { "id": 3, "name": "新西兰·皇后镇", "coords": "45S, 168E", "keywords": ["迷茫", "困惑", "无助", "不知所措", "迷失", "徘徊", "犹豫"], "atmosphere": "空灵", "diary": "站在皇后镇的山顶，脚下是瓦卡蒂普湖湛蓝的水面。远方的雪山在云雾中若隐若现，就像你未来的道路。迷茫是暂时的，就像晨雾终将散去。深呼吸，让大自然的力量指引你前行。", "tasks": ["闭上眼睛，做三次深呼吸", "列出三个你喜欢做的事情", "给自己写一句鼓励的话"] },
    { "id": 4, "name": "日本·京都", "coords": "35N, 135E", "keywords": ["疲惫", "累", "倦怠", "心累", "透支", "消耗", "无力"], "atmosphere": "静谧", "diary": "枯山水庭院里的白砂如水般流动，青苔在石头上静静生长。在京都的古寺中，时间仿佛放慢了脚步。你不需要一直奔跑，停下来休息并不是放弃。让身心回归平静，才能重新出发。", "tasks": ["找一处安静的角落闭目养神", "听一首舒缓的音乐", "泡个热水澡放松身心"] },
    { "id": 5, "name": "瑞士·采尔马特", "coords": "46N, 7E", "keywords": ["愤怒", "生气", "烦躁", "暴躁", "激动", "失控", "怨恨"], "atmosphere": "纯净", "diary": "马特洪峰的冰雪在阳光下闪耀着蓝色的光芒，空气纯净得仿佛能洗去一切尘埃。愤怒是一团火，它会灼伤自己也伤害他人。深呼吸，想象自己站在雪山之巅，让清风带走所有的火气。", "tasks": ["做10次深呼吸，慢慢呼气", "去户外走一圈，感受自然", "把烦恼写在纸上然后撕掉"] },
    { "id": 6, "name": "澳大利亚·乌鲁鲁", "coords": "25S, 131E", "keywords": ["空虚", "无聊", "乏味", "平淡", "无意义", "麻木"], "atmosphere": "深邃", "diary": "乌鲁鲁巨石在夕阳下变幻着颜色，从金色到橙红再到深紫。这片土地见证了亿万年的变迁，而你的烦恼只是时间长河中的一瞬。生命本就是一场旅程，每一个当下都有它独特的意义。", "tasks": ["观察身边三件你从未注意过的事物", "尝试一种从未吃过的食物", "写下今天让你觉得有趣的一件事"] },
    { "id": 7, "name": "印度·瓦拉纳西", "coords": "25N, 83E", "keywords": ["遗憾", "后悔", "自责", "内疚", "羞愧"], "atmosphere": "神圣", "diary": "恒河的水流淌了千年，带走了无数人的悲伤与悔恨。在瓦拉纳西的晨曦中，一切都可以重新开始。过去的已经过去，重要的是现在和未来。原谅自己，才能真正放下。", "tasks": ["写下一件让你释怀的事", "对自己说一声'没关系'", "做一件让自己开心的小事"] },
    { "id": 8, "name": "智利·阿塔卡马", "coords": "23S, 67W", "keywords": ["绝望", "无助", "黑暗", "痛苦", "煎熬", "挣扎"], "atmosphere": "浩瀚", "diary": "阿塔卡马沙漠的星空是世界上最璀璨的，银河横跨天际，繁星触手可及。在这片无垠的宇宙面前，所有的痛苦都变得渺小。请相信，即使在最深的黑暗中，也总有星光为你指引方向。", "tasks": ["晚上抬头看看星空", "回想一件让你感到希望的事", "告诉自己'明天会更好'"] },
    { "id": 9, "name": "加拿大·班夫", "coords": "51N, 115W", "keywords": ["焦虑", "期待", "兴奋", "紧张", "不安", "激动"], "atmosphere": "壮阔", "diary": "班夫的湖泊倒映着雪山，森林在微风中低语。生命中的每一次挑战都是成长的机会，就像攀登高山需要勇气。相信自己的能力，你比想象中更强大。", "tasks": ["列出三个你已经克服的困难", "告诉自己'我能行'", "做一些简单的伸展运动"] },
    { "id": 10, "name": "马尔代夫·马累", "coords": "4N, 73E", "keywords": ["快乐", "幸福", "满足", "感恩", "喜悦", "美好", "开心"], "atmosphere": "温暖", "diary": "马尔代夫的海水清澈见底，珊瑚在阳光下闪烁着五彩斑斓的光芒。感谢你愿意分享这份美好，让我也感受到了这份温暖。请记住这份感觉，让它成为你前进的动力。", "tasks": ["写下今天让你开心的三件事", "给帮助过你的人发个感谢消息", "做一个深呼吸感受当下"] }
  ]
};

function matchLocation(text) {
  var db = fallbackDatabase;
  if(!db || !db.locations) {
    return { name: '冰岛·雷克雅未克', coords: '64N, 21W', diary: '今夜的雷克雅未克没有极光，但海浪拍打礁石的声音比任何光都更清晰。', tasks: ['静坐5分钟', '观察天空', '写下微笑的小事'] };
  }
  
  var bestMatch = null;
  var highestScore = 0;
  
  db.locations.forEach(function(loc) {
    var score = 0;
    loc.keywords.forEach(function(kw) {
      if(text.indexOf(kw) !== -1) {
        score += 2;
      }
    });
    
    ['清冷', '忧郁', '空灵', '静谧', '纯净', '深邃', '神圣', '浩瀚', '壮阔', '温暖'].forEach(function(word) {
      if(text.indexOf(word) !== -1) {
        score += 1;
      }
    });
    
    if(score > highestScore) {
      highestScore = score;
      bestMatch = loc;
    }
  });
  
  if(bestMatch && highestScore > 0) {
    return bestMatch;
  }
  
  var randomIndex = Math.floor(Math.random() * db.locations.length);
  return db.locations[randomIndex];
}

var starCanvas = document.getElementById('starCanvas');
var starCtx = starCanvas.getContext('2d');
var stars = [];

function resizeStarCanvas() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  var count = Math.floor((starCanvas.width * starCanvas.height) / 8000);
  for(var i=0; i<count; i++) {
    stars.push({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      size: Math.random() * 1.5 + 0.5,
      opacity: Math.random() * 0.8 + 0.2,
      twinkleSpeed: Math.random() * 0.03 + 0.01,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}

function animateStars() {
  starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(function(star) {
    star.twinklePhase += star.twinkleSpeed;
    var currentOpacity = star.opacity * (0.5 + Math.sin(star.twinklePhase) * 0.5);
    starCtx.beginPath();
    starCtx.arc(star.x,star.y,star.size,0,Math.PI*2);
    starCtx.fillStyle = 'rgba(220,240,255,' + currentOpacity + ')';
    starCtx.fill();
  });
  requestAnimationFrame(animateStars);
}

resizeStarCanvas();
createStars();
animateStars();
window.addEventListener('resize', function(){ resizeStarCanvas(); createStars(); });

var cosmicInput = document.getElementById('cosmicInput');
var inputContainer = document.querySelector('.input-container');

setTimeout(function(){ cosmicInput.focus(); }, 500);

cosmicInput.addEventListener('keydown', function(e) {
  if(e.key === 'Enter' && cosmicInput.value.trim()) {
    userInput = cosmicInput.value.trim();
    matchedLocation = matchLocation(userInput);
    
    cosmicInput.value = '';
    cosmicInput.style.opacity = '0';
    
    var particles = [];
    for(var i=0; i<30; i++) {
      var p = document.createElement('div');
      p.className = 'floating-particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = '50%';
      inputContainer.appendChild(p);
      particles.push(p);
    }
    
    particles.forEach(function(p, i) {
      setTimeout(function() {
        var angle = Math.random() * Math.PI * 2;
        var dist = Math.random() * 200 + 100;
        p.style.transition = 'all 2s ease-out';
        p.style.transform = 'translate(' + Math.cos(angle)*dist + 'px,' + (Math.sin(angle)*dist - 50) + 'px)';
        p.style.opacity = '0';
        setTimeout(function(){ p.remove(); }, 2000);
      }, i * 50);
    });
    
    setTimeout(function(){ switchStage(1); }, 2000);
  }
});

var astroContainer = document.getElementById('astroContainer');
var orbits = document.querySelectorAll('.orbit');
var isDragging = false;
var startAngle = 0;
var currentRotation = [0,0,0,0];
var vibrationTimeout = null;
var hasInteracted = false;

function getAngle(x, y) {
  var rect = astroContainer.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  return Math.atan2(y-cy, x-cx);
}

function initStage2() {
  hasInteracted = false;
  
  astroContainer.addEventListener('mousedown', onStage2MouseDown);
  document.addEventListener('mousemove', onStage2MouseMove);
  document.addEventListener('mouseup', onStage2MouseUp);
  
  astroContainer.addEventListener('touchstart', onStage2TouchStart);
  document.addEventListener('touchmove', onStage2TouchMove);
  document.addEventListener('touchend', onStage2TouchEnd);
}

function cleanupStage2() {
  astroContainer.removeEventListener('mousedown', onStage2MouseDown);
  document.removeEventListener('mousemove', onStage2MouseMove);
  document.removeEventListener('mouseup', onStage2MouseUp);
  
  astroContainer.removeEventListener('touchstart', onStage2TouchStart);
  document.removeEventListener('touchmove', onStage2TouchMove);
  document.removeEventListener('touchend', onStage2TouchEnd);
  
  isDragging = false;
  astroContainer.classList.remove('dragging');
  if(vibrationTimeout) { clearTimeout(vibrationTimeout); vibrationTimeout = null; }
}

function onStage2MouseDown(e) {
  isDragging = true;
  startAngle = getAngle(e.clientX, e.clientY);
  astroContainer.classList.add('dragging');
  hasInteracted = true;
  
  if(vibrationTimeout) { clearTimeout(vibrationTimeout); vibrationTimeout = null; }
  vibrationTimeout = setTimeout(function() {
    if(isDragging) {
      astroContainer.classList.add('vibrating');
      setTimeout(function() {
        astroContainer.classList.remove('vibrating');
        cleanupStage2();
        switchStage(2);
      }, 1500);
    }
  }, 3000);
}

function onStage2MouseMove(e) {
  if(isDragging) {
    var ca = getAngle(e.clientX, e.clientY);
    var delta = ca - startAngle;
    orbits.forEach(function(o, i) {
      if(i > 0) {
        currentRotation[i-1] += delta * (4-i) * 0.5;
        o.style.transform = 'rotate(' + currentRotation[i-1] + 'rad)';
      }
    });
    startAngle = ca;
  }
}

function onStage2MouseUp() {
  isDragging = false;
  astroContainer.classList.remove('dragging');
  if(vibrationTimeout) { clearTimeout(vibrationTimeout); vibrationTimeout = null; }
  
  if(hasInteracted && !isDragging) {
    astroContainer.classList.add('vibrating');
    setTimeout(function() {
      astroContainer.classList.remove('vibrating');
      cleanupStage2();
      switchStage(2);
    }, 1500);
  }
}

function onStage2TouchStart(e) {
  e.preventDefault();
  if(e.touches.length === 1) {
    var t = e.touches[0];
    isDragging = true;
    startAngle = getAngle(t.clientX, t.clientY);
    astroContainer.classList.add('dragging');
    hasInteracted = true;
    
    if(vibrationTimeout) { clearTimeout(vibrationTimeout); vibrationTimeout = null; }
    vibrationTimeout = setTimeout(function() {
      if(isDragging) {
        astroContainer.classList.add('vibrating');
        setTimeout(function() {
          astroContainer.classList.remove('vibrating');
          cleanupStage2();
          switchStage(2);
        }, 1500);
      }
    }, 3000);
  }
}

function onStage2TouchMove(e) {
  if(isDragging && e.touches.length === 1) {
    e.preventDefault();
    var t = e.touches[0];
    var ca = getAngle(t.clientX, t.clientY);
    var delta = ca - startAngle;
    orbits.forEach(function(o, i) {
      if(i > 0) {
        currentRotation[i-1] += delta * (4-i) * 0.5;
        o.style.transform = 'rotate(' + currentRotation[i-1] + 'rad)';
      }
    });
    startAngle = ca;
  }
}

function onStage2TouchEnd() {
  isDragging = false;
  astroContainer.classList.remove('dragging');
  if(vibrationTimeout) { clearTimeout(vibrationTimeout); vibrationTimeout = null; }
  
  if(hasInteracted && !isDragging) {
    astroContainer.classList.add('vibrating');
    setTimeout(function() {
      astroContainer.classList.remove('vibrating');
      cleanupStage2();
      switchStage(2);
    }, 1500);
  }
}

var resonanceText = document.getElementById('resonanceText');

function typeWriter(text, index, callback) {
  if(index < text.length) {
    resonanceText.innerHTML += text.charAt(index);
    setTimeout(function(){ typeWriter(text, index+1, callback); }, 80);
  } else { if(callback) callback(); }
}

function showResonance() {
  resonanceText.innerHTML = '';
  
  var loc = matchedLocation;
  if(!loc) {
    loc = { name: '冰岛·雷克雅未克', coords: '64N, 21W' };

  var messages = ['正在检索共振频率……','','成功锁定坐标 [' + loc.coords + ']', loc.name];
  
  setTimeout(function() {
    resonanceText.style.opacity = '1';
    
    var msgIndex = 0;
    function next() {
      if(msgIndex < messages.length) {
        if(messages[msgIndex] === '') {
          resonanceText.innerHTML += '<br><br>';
          msgIndex++;
          setTimeout(next, 500);
        } else {
          typeWriter(messages[msgIndex], 0, function() {
            resonanceText.innerHTML += '<br>';
            msgIndex++;
            setTimeout(next, 600);
          });
        }
      } else {
        setTimeout(function(){ switchStage(3); }, 2000);
      }
    }
    next();
  }, 300);
}

function onCardDblClick(e) {

  clickTimeout = setTimeout(function(){ clickCount = 0; }, 2000);
  if(clickCount >= 3) {
    triggerSupernova();
    clickCount = 0;
    if(clickTimeout) { clearTimeout(clickTimeout); clickTimeout = null; }
  }

function triggerSupernova() {
  var canvas = document.getElementById('supernovaCanvas');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  var particles = [];
  var cx = window.innerWidth/2;
  var cy = window.innerHeight/2;
  
  for(var i=0; i<500; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 8 + 2;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 4 + 1,
      opacity: Math.random() * 0.8 + 0.2,
      color: 'hsl(' + (Math.random()*60 + 180) + ',80%,70%)',
      life: 1
    });
  }
  
  function animate() {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    var active = false;
    particles.forEach(function(p) {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.98; p.vy *= 0.98;
      p.life -= 0.005;
      if(p.life > 0) {
        active = true;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity * p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    });
    
    if(active) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  
  animate();
  document.getElementById('achievementOverlay').classList.add('active');
  setTimeout(function(){ document.getElementById('achievementOverlay').classList.remove('active'); }, 10000);
}

var backHome = document.getElementById('backHome');

function goHome() {
  shiftCard.classList.remove('flipped');
  backHome.classList.remove('visible');
  
  switchStage(0);
  
  setTimeout(function() {
    cosmicInput.style.opacity = '1';
    cosmicInput.value = '';
    cosmicInput.focus();
  }, 500);
  
  currentRotation = [0,0,0,0];
  orbits.forEach(function(o, i) {
    if(i > 0) {
      o.style.transform = 'rotate(0rad)';
    }
  });
  
  resonanceText.innerHTML = '';
  resonanceText.style.opacity = '0';
}

backHome.addEventListener('click', goHome);
