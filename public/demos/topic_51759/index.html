<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">

<script src="js/common.js"></script>
<style>
/* ===== 首页专属：圆形按钮 + 8卫星微浮动 ===== */
.orbit-system {
  position: relative;
  width: 320px;
  height: 320px;
  margin: 0 auto;
}

/* 中心圆形按钮 */
.orbit-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 96px; height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFC94D 0%, #FF6A2A 100%);
  box-shadow:
    0 0 0 4px rgba(255,201,77,0.3),
    0 0 24px rgba(255,106,42,0.35),
    0 8px 32px rgba(255,106,42,0.25);
  cursor: pointer;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: transform 0.3s var(--ease-spring-soft), box-shadow 0.3s;
  animation: centerPulse 3s ease-in-out infinite;
  border: none;
  font-family: var(--font-zh);
}
.orbit-center:hover {
  transform: translate(-50%, -50%) scale(1.08);
  box-shadow:
    0 0 0 6px rgba(255,201,77,0.4),
    0 0 40px rgba(255,106,42,0.5),
    0 12px 40px rgba(255,106,42,0.35);
}
.orbit-center:active {
  transform: translate(-50%, -50%) scale(0.95);
}
.orbit-center__emoji {
  font-size: 26px;
  line-height: 1;
}
.orbit-center__text {
  font-size: 11px;
  font-weight: 700;
  color: white;
  letter-spacing: 0.5px;
}
.orbit-center__sub {
  font-size: 8px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  letter-spacing: 1px;
}

@keyframes centerPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(255,201,77,0.3), 0 0 24px rgba(255,106,42,0.35), 0 8px 32px rgba(255,106,42,0.25); }
  50% { box-shadow: 0 0 0 8px rgba(255,201,77,0.2), 0 0 40px rgba(255,106,42,0.45), 0 8px 32px rgba(255,106,42,0.25); }
}

/* 轨道环（装饰） */
.orbit-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1.5px dashed rgba(255,201,77,0.18);
  pointer-events: none;
}

/* 卫星卡片 */
.satellite {
  position: absolute;
  width: 62px; height: 62px;
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  z-index: 5;
  transition: transform 0.25s var(--ease-spring-soft), box-shadow 0.25s;
  border: 1.5px solid transparent;
}
.satellite:hover {
  transform: scale(1.12);
  box-shadow: var(--shadow-lg);
  border-color: var(--action-primary);
  animation-play-state: paused !important;
}
.satellite:active { transform: scale(0.92); }
.satellite__icon { font-size: 20px; line-height: 1; }
.satellite__label {
  font-size: 8px; font-weight: 600; color: var(--text-primary);
  font-family: var(--font-zh);
  white-space: nowrap;
}

/* 8颗卫星位置 — 内环4颗 + 外环4颗 */
/* 内环：上、右、下、左 (距中心88px) */
.satellite--0 {
  top: 18px; left: 50%; margin-left: -31px;
  animation: float0 4s ease-in-out infinite;
}
.satellite--1 {
  top: 50%; right: 18px; margin-top: -31px;
  animation: float1 4.5s ease-in-out infinite;
}
.satellite--2 {
  bottom: 18px; left: 50%; margin-left: -31px;
  animation: float2 5s ease-in-out infinite;
}
.satellite--3 {
  top: 50%; left: 18px; margin-top: -31px;
  animation: float3 3.8s ease-in-out infinite;
}
/* 外环：左上、右上、右下、左下 (对角分布) */
.satellite--4 {
  top: 22px; left: 22px;
  animation: float4 4.2s ease-in-out infinite;
}
.satellite--5 {
  top: 22px; right: 22px;
  animation: float5 4.8s ease-in-out infinite;
}
.satellite--6 {
  bottom: 22px; right: 22px;
  animation: float6 5.2s ease-in-out infinite;
}
.satellite--7 {
  bottom: 22px; left: 22px;
  animation: float7 4.6s ease-in-out infinite;
}

/* 微浮动关键帧 */
@keyframes float0 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@keyframes float1 {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(4px); }
}
@keyframes float2 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}
@keyframes float3 {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-4px); }
}
@keyframes float4 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-3px, -4px); }
}
@keyframes float5 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(3px, -4px); }
}
@keyframes float6 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(3px, 4px); }
}
@keyframes float7 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-3px, 4px); }
}

/* 首页底部灵魂拷问 */
.daily-question {
  margin: var(--space-3) var(--space-5); padding: var(--space-4);
  background: var(--bg-goldSoft); border-radius: var(--radius-lg);
  display: flex; align-items: flex-start; gap: var(--space-3);
}
.daily-q__icon { font-size: 28px; flex-shrink: 0; }
.daily-q__text { font-size: var(--fs-body-md); color: #8B6914; line-height: 1.6; }

/* ===== 三消游戏弹出层 ===== */
.game-overlay {
  position: absolute; inset: 0; z-index: 100;
  background: var(--bg-surface);
  display: flex; flex-direction: column;
  animation: slideUp 0.3s ease-out;
}
.game-overlay.hidden { display: none; }
.game-overlay.closing { animation: slideDown 0.25s ease-in forwards; }

.game-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  background: linear-gradient(135deg, #FFC94D 0%, #FF6A2A 100%);
  color: white; flex-shrink: 0;
}
.game-header__title { font-size: var(--fs-h3); font-weight: 700; }
.game-header__close {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.25); border: none;
  color: white; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.game-info {
  display: flex; justify-content: space-around;
  padding: var(--space-2) var(--space-4);
  background: var(--bg-elevated); flex-shrink: 0;
}
.game-info__item { text-align: center; }
.game-info__label { font-size: 10px; color: var(--text-tertiary); }
.game-info__value { font-size: var(--fs-h3); font-weight: 700; color: var(--action-primary); }

.game-rules {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--space-4);
  background: var(--bg-goldSoft);
  font-size: 11px; color: #8B6914; line-height: 1.5;
  flex-shrink: 0;
}
.game-rules__icon { font-size: 14px; flex-shrink: 0; }

.game-board-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: var(--space-2);
}
.game-board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  width: 100%; max-width: 280px;
  aspect-ratio: 1;
}
.game-cell {
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  user-select: none;
  border: 2px solid transparent;
}
.game-cell:hover { transform: scale(1.08); }
.game-cell.selected {
  border-color: var(--action-primary);
  background: rgba(255,201,77,0.15);
  transform: scale(1.1);
}
.game-cell.matched {
  animation: cellPop 0.3s ease-out forwards;
}
@keyframes cellPop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.5; }
  100% { transform: scale(0); opacity: 0; }
}
.game-cell.dropping {
  animation: cellDrop 0.25s ease-out;
}
@keyframes cellDrop {
  0% { transform: translateY(-100%); opacity: 0.5; }
  100% { transform: translateY(0); opacity: 1; }
}

.game-footer {
  padding: var(--space-3) var(--space-4);
  display: flex; gap: var(--space-2); flex-shrink: 0;
}
.game-footer .btn { flex: 1; }

/* 结果卡片（含操作按钮） */
.result-card {
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-md);
  text-align: center;
  animation: slideUp 0.3s ease-out;
}
.result-card__emoji { font-size: 28px; margin-bottom: 2px; }
.result-card__name { font-size: var(--fs-h3); font-weight: 700; color: var(--text-primary); }
.result-card__desc { font-size: var(--fs-body-sm); color: var(--text-secondary); margin-top: 2px; }
.result-card__actions {
  display: flex; gap: 6px; margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--border-subtle);
}
.result-card__actions .btn { flex: 1; font-size: 11px; padding: 6px 0; }
</style>
</head>

<script>
'use strict';

// 卫星动作映射（8颗）
const satelliteActions = [
  { name: '纠结克星', action: 'spinWheelAction' },
  { name: '惊喜饭盒', action: 'openBlindBox' },
  { name: '排面拉满', action: 'navigateTable' },
  { name: '大师召唤', action: 'navigateCook' },
  { name: '点外卖', action: 'orderTakeout' },
  { name: '出去吃', action: 'goOutEat' },
  { name: '喝点吗', action: 'drinkSomething' },
  { name: '小游戏', action: 'openMiniGame' },
];

function handleSatellite(index) {
  const item = satelliteActions[index];
  switch(item.action) {
    case 'spinWheelAction': spinWheelAction(); break;
    case 'openBlindBox': openBlindBox(); break;
    case 'navigateTable': navigateTo('table'); break;
    case 'navigateCook': navigateTo('cook'); break;
    case 'orderTakeout': orderTakeout(); break;
    case 'goOutEat': goOutEat(); break;
    case 'drinkSomething': drinkSomething(); break;
    case 'openMiniGame': openMiniGame(); break;
  }
}

// 点击中心按钮：卫星弹跳 + 随机选菜
let orbitSpinning = false;
function spinOrbit() {
  if (orbitSpinning) return;
  orbitSpinning = true;

  const centerBtn = document.getElementById('orbitCenterBtn');
  const satellites = document.querySelectorAll('.satellite');

  // 中心按钮快速脉冲
  centerBtn.style.animation = 'none';
  centerBtn.offsetHeight;
  centerBtn.style.animation = 'centerPulse 0.2s ease-in-out 6';

  // 卫星弹跳（向外扩散）
  satellites.forEach((s, i) => {
    s.style.animation = 'none';
    s.style.transition = 'transform 0.3s ease-out';
    s.style.transform = 'scale(0.85)';
  });

  setTimeout(() => {
    satellites.forEach(s => {
      s.style.transform = 'scale(1.1)';
    });
  }, 200);

  setTimeout(() => {
    satellites.forEach(s => {
      s.style.transition = '';
      s.style.transform = '';
      s.style.animation = '';
    });
    centerBtn.style.animation = 'centerPulse 3s ease-in-out infinite';
    orbitSpinning = false;

    // 随机选一道菜
    const r = Math.floor(Math.random() * foodRankings.length);
    const food = foodRankings[r];
    const emojis = ['🍖','🥘','🍗','🍕','🍣','🍜','🥩','🍛'];
    showResultCard(emojis[r], food.name, food.desc, food.name);
  }, 600);
}

// 纠结克星
function spinWheelAction() {
  const wheelItems = ['红烧肉', '麻婆豆腐', '宫保鸡丁', '水煮鱼', '火锅', '寿司', '披萨', '沙拉'];
  const emojis = ['🍖','🥘','🍗','🐟','🍲','🍣','🍕','🥗'];
  const r = Math.floor(Math.random() * wheelItems.length);
  showResultCard(emojis[r], wheelItems[r], '命运之轮已转！', wheelItems[r]);
}

// 惊喜饭盒
function openBlindBox() {
  const r = Math.floor(Math.random() * foodRankings.length);
  const food = foodRankings[r];
  const emojis = ['🍖','🥘','🍗','🍕','🍣','🍜','🥩','🍛'];
  showResultCard(emojis[r], food.name, `盲盒拆出：${food.desc}`, food.name);
}

// 点外卖
function orderTakeout() {
  const takeoutFoods = ['麻辣烫', '黄焖鸡', '炸鸡汉堡', '日式拉面', '煲仔饭', '烤肉饭', '螺蛳粉', '麻辣香锅'];
  const emojis = ['🍜','🍗','🍔','🍜','🍚','🍖','🌶️','🥘'];
  const r = Math.floor(Math.random() * takeoutFoods.length);
  const platforms = ['美团外卖', '饿了么', '抖音外卖'];
  const platform = platforms[Math.floor(Math.random() * platforms.length)];
  showResultCard(emojis[r], takeoutFoods[r], `打开${platform}，搜索「${takeoutFoods[r]}」`, takeoutFoods[r]);
}

// 出去吃
function goOutEat() {
  const places = ['火锅店', '日料店', '烧烤摊', '川菜馆', '西餐厅', '粤式茶楼', '韩国烤肉', '泰餐'];
  const emojis = ['🍲','🍣','🥩','🌶️','🥩','🫖','🥓','🍛'];
  const r = Math.floor(Math.random() * places.length);
  const moods = ['约上朋友', '犒劳自己', '换换口味', '改善伙食'];
  const mood = moods[Math.floor(Math.random() * moods.length)];
  showResultCard(emojis[r], places[r], `${mood}，出门去吃${places[r]}！`, places[r]);
}

// 喝点吗
function drinkSomething() {
  const drinks = ['奶茶', '冰美式', '柠檬茶', '精酿啤酒', '鸡尾酒', '椰子水', '奶盖茶', '气泡水'];
  const emojis = ['🧋','☕','🍋','🍺','🍹','🥥','🧋','💧'];
  const r = Math.floor(Math.random() * drinks.length);
  const vibes = ['来一杯解解馋', '今天适合喝点', '口渴了吧', '犒赏自己一杯'];
  const vibe = vibes[Math.floor(Math.random() * vibes.length)];

// ===== 三消食材游戏 =====
const GAME_SIZE = 6;
const GAME_EMOJIS = ['🥩','🍗','🥬','🧄','🌶️','🥕'];
const MAX_MOVES = 30;
let gameBoard = [];
let gameScore = 0;
let gameMoves = MAX_MOVES;
let gameCombo = 0;
let selectedCell = null;
let gameProcessing = false;

function openMiniGame() {
  const overlay = document.getElementById('gameOverlay');
  overlay.classList.remove('hidden', 'closing');
  resetGame();
}

function closeMiniGame() {
  const overlay = document.getElementById('gameOverlay');
  overlay.classList.add('closing');
  setTimeout(() => overlay.classList.add('hidden'), 250);
}

function resetGame() {
  gameScore = 0; gameMoves = MAX_MOVES; gameCombo = 0;
  selectedCell = null; gameProcessing = false;
  updateGameInfo();
  initGameBoard();
  // 消除初始匹配
  let hasMatch = true;
  while (hasMatch) {
    const matches = findMatches();
    if (matches.length > 0) {
      matches.forEach(([r, c]) => { gameBoard[r][c] = randomEmoji(); });
    } else {
      hasMatch = false;
    }
  }
  renderBoard();
}

function randomEmoji() {
  return GAME_EMOJIS[Math.floor(Math.random() * GAME_EMOJIS.length)];
}

function initGameBoard() {
  gameBoard = [];
  for (let r = 0; r < GAME_SIZE; r++) {
    gameBoard[r] = [];
    for (let c = 0; c < GAME_SIZE; c++) {
      gameBoard[r][c] = randomEmoji();
    }
  }
}

function renderBoard() {
  const boardEl = document.getElementById('gameBoard');
  boardEl.innerHTML = '';
  for (let r = 0; r < GAME_SIZE; r++) {
    for (let c = 0; c < GAME_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'game-cell';
      cell.textContent = gameBoard[r][c];
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function onCellClick(row, col) {
  if (gameProcessing || gameMoves <= 0) return;

  if (!selectedCell) {
    selectedCell = { row, col };
    highlightCell(row, col, true);
    return;
  }

  const { row: sr, col: sc } = selectedCell;
  highlightCell(sr, sc, false);

  // 检查是否相邻
  const isAdj = (Math.abs(sr - row) + Math.abs(sc - col)) === 1;
  if (!isAdj) {
    selectedCell = { row, col };
    highlightCell(row, col, true);
    return;
  }

  selectedCell = null;
  gameProcessing = true;

  // 交换
  swapCells(sr, sc, row, col);
  renderBoard();

  // 检查是否有匹配
  const matches = findMatches();
  if (matches.length === 0) {
    // 无匹配，换回来
    setTimeout(() => {
      swapCells(sr, sc, row, col);
      renderBoard();
      gameProcessing = false;
      showToast('无法消除，换回来！');
    }, 300);
    return;
  }

  // 有匹配，扣步数
  gameMoves--;
  gameCombo = 0;
  processMatches();
}

function swapCells(r1, c1, r2, c2) {
  const tmp = gameBoard[r1][c1];
  gameBoard[r1][c1] = gameBoard[r2][c2];
  gameBoard[r2][c2] = tmp;
}

function highlightCell(row, col, on) {
  const boardEl = document.getElementById('gameBoard');
  const idx = row * GAME_SIZE + col;
  const cell = boardEl.children[idx];
  if (cell) cell.classList.toggle('selected', on);
}

function findMatches() {
  const matched = new Set();

  // 横向检测
  for (let r = 0; r < GAME_SIZE; r++) {
    for (let c = 0; c < GAME_SIZE - 2; c++) {
      const v = gameBoard[r][c];
      if (v && v === gameBoard[r][c+1] && v === gameBoard[r][c+2]) {
        matched.add(`${r},${c}`);
        matched.add(`${r},${c+1}`);
        matched.add(`${r},${c+2}`);
      }
    }
  }

  // 纵向检测
  for (let c = 0; c < GAME_SIZE; c++) {
    for (let r = 0; r < GAME_SIZE - 2; r++) {
      const v = gameBoard[r][c];
      if (v && v === gameBoard[r+1][c] && v === gameBoard[r+2][c]) {
        matched.add(`${r},${c}`);
        matched.add(`${r+1},${c}`);
        matched.add(`${r+2},${c}`);
      }
    }
  }

  return [...matched].map(s => s.split(',').map(Number));
}

function processMatches() {
  const matches = findMatches();
  if (matches.length === 0) {
    gameProcessing = false;
    updateGameInfo();
    if (gameMoves <= 0) {
      setTimeout(() => showToast(`游戏结束！得分：${gameScore}`), 200);
    }
    return;
  }

  gameCombo++;
  const points = matches.length * 10 * gameCombo;
  gameScore += points;

  // 播放消除动画
  const boardEl = document.getElementById('gameBoard');
  matches.forEach(([r, c]) => {
    const idx = r * GAME_SIZE + c;
    if (boardEl.children[idx]) boardEl.children[idx].classList.add('matched');
  });

  setTimeout(() => {
    // 清除消除的格子
    matches.forEach(([r, c]) => { gameBoard[r][c] = null; });

    // 下落填充
    dropAndFill();

    renderBoard();
    updateGameInfo();

    // 标记下落动画
    const cells = document.getElementById('gameBoard').children;
    for (let i = 0; i < cells.length; i++) {
      cells[i].classList.add('dropping');
    }

    // 继续检测连锁
    setTimeout(() => processMatches(), 300);
  }, 300);
}

function dropAndFill() {
  for (let c = 0; c < GAME_SIZE; c++) {
    // 从下往上，把 null 挤到顶部
    let writeRow = GAME_SIZE - 1;
    for (let r = GAME_SIZE - 1; r >= 0; r--) {
      if (gameBoard[r][c] !== null) {
        gameBoard[writeRow][c] = gameBoard[r][c];
        if (writeRow !== r) gameBoard[r][c] = null;
        writeRow--;
      }
    }
    // 顶部空位填充新食材
    for (let r = writeRow; r >= 0; r--) {
      gameBoard[r][c] = randomEmoji();
    }
  }
}

function updateGameInfo() {
  document.getElementById('gameScore').textContent = gameScore;
  document.getElementById('gameMoves').textContent = gameMoves;
  document.getElementById('gameCombo').textContent = gameCombo;
}
