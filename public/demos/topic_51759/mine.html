<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我 — 吃啥子</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/common.css">
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen">

<!-- GHeader -->
<header class="gheader">
  <div class="gheader__top">
    <div class="gheader__mascot">
      <div class="gheader__mascot-icon">G</div>
      <span class="gheader__phrase">你的干饭档案</span>
    </div>
    <div class="gheader__actions">
      <button class="btn btn--ghost btn--sm" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <div class="gheader__avatar" style="cursor:default;">吃</div>
    </div>
  </div>
</header>

<main>
<!-- ===== 主页：个人中心 ===== -->
<section class="page active" id="mineMain">
  <div class="page-container">
    <div class="profile-card">
      <div class="profile-avatar">吃</div>
      <div>
        <div style="font-size:var(--fs-h3);font-weight:700;">干饭王者</div>
        <div style="font-size:var(--fs-body-sm);color:var(--text-tertiary);">干饭王者 Lv.8</div>
      </div>
    </div>

    <div class="menu-grid">
      <div class="menu-item" onclick="showSubPage('favorites')">
        <div class="menu-item__icon">❤️</div>
        <div class="menu-item__label">我的宝藏</div>
        <div class="menu-item__stat">5</div>
      </div>
      <div class="menu-item" onclick="showSubPage('menus')">
        <div class="menu-item__icon">📋</div>
        <div class="menu-item__label">菜篮子</div>
        <div class="menu-item__stat">3</div>
      </div>
      <div class="menu-item" onclick="showSubPage('achievement')">
        <div class="menu-item__icon">🏆</div>
        <div class="menu-item__label">炫饭勋章</div>
        <div class="menu-item__stat">3/8</div>
      </div>
      <div class="menu-item" onclick="showSubPage('diet')">
        <div class="menu-item__icon">📊</div>
        <div class="menu-item__label">干饭日记</div>
      </div>
      <div class="menu-item" onclick="showSubPage('settings')">
        <div class="menu-item__icon">⚙️</div>
        <div class="menu-item__label">调教AI</div>
      </div>
      <div class="menu-item" onclick="showToast('会员功能开发中')">
        <div class="menu-item__icon">👑</div>
        <div class="menu-item__label">VIP特权</div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 子页：干饭日记 ===== -->
<section class="page" id="dietPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">干饭日记</span>
      <div></div>
    </div>
    <div id="dietRecords" style="padding:var(--space-5);"></div>
  </div>
</section>

<!-- ===== 子页：炫饭勋章 ===== -->
<section class="page" id="achievementPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">炫饭勋章</span>
      <div></div>
    </div>
    <div class="achievement-grid mt-3" id="achievementGrid"></div>
  </div>
</section>

<!-- ===== 子页：我的宝藏 ===== -->
<section class="page" id="favoritesPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">我的宝藏</span>
      <div></div>
    </div>
    <div class="chip-row mt-3">
      <span class="chip active">全部</span>
      <span class="chip">菜谱</span>
      <span class="chip">文章</span>
    </div>
    <div id="favList" style="margin-top:var(--space-3);"></div>
  </div>
</section>

<!-- ===== 子页：菜篮子 ===== -->
<section class="page" id="menusPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">菜篮子</span>
      <div></div>
    </div>
    <div style="padding:var(--space-5);">
      <div class="empty-state">
        <div class="empty-state__icon">📋</div>
        <div class="empty-state__text">暂无自定义菜单<br>在随机决策中创建菜单吧</div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 子页：安排! ===== -->
<section class="page" id="planPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">安排!</span>
      <div></div>
    </div>
    <div style="padding:var(--space-5);">
      <div class="empty-state">
        <div class="empty-state__icon">📅</div>
        <div class="empty-state__text">暂无饮食计划<br>制定一周的饮食计划吧</div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 子页：调教AI ===== -->
<section class="page" id="settingsPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">调教AI</span>
      <div></div>
    </div>
    <div style="padding:var(--space-5);">
      <p style="font-size:var(--fs-body-sm);color:var(--text-secondary);line-height:1.8;">
        🧠 AI服务商：阶跃星辰 StepFun<br>
        🤖 模型：Step-2-16k<br>
        🌡️ 菜谱温度：0.8（偏创意）<br>
        🎯 推荐温度：0.7（偏精准）<br>
        📏 最大Token：2048<br><br>
        <em>可视化配置面板即将登场</em>
      </p>
    </div>
  </div>
</section>
</main>

<!-- TabBar -->
<nav class="tabbar">
  <button class="tabbar__item" onclick="location.href='index.html'">
    <span class="tabbar__icon">🏠</span>
    <span class="tabbar__label">开吃!</span>
  </button>
  <button class="tabbar__item" onclick="location.href='discover.html'">
    <span class="tabbar__icon">🔍</span>
    <span class="tabbar__label">逛逛</span>
  </button>
  <button class="tabbar__item" onclick="location.href='identify.html'">
    <span class="tabbar__icon">🔮</span>
    <span class="tabbar__label">扫描</span>
  </button>
  <button class="tabbar__item" onclick="location.href='kitchen.html'">
    <span class="tabbar__icon">⚡</span>
    <span class="tabbar__label">灶台</span>
  </button>
  <button class="tabbar__item active" onclick="location.href='mine.html'">
    <span class="tabbar__icon">😎</span>
    <span class="tabbar__label">我</span>
  </button>
</nav>

<script>
'use strict';

let currentSubPage = null;

// ===== 子页导航 =====
function showSubPage(name) {
  const mainPage = document.getElementById('mineMain');
  const subPage = document.getElementById(name + 'Page');
  if (mainPage && subPage) {
    mainPage.classList.remove('active');
    subPage.classList.add('active');
    currentSubPage = name;
    document.querySelector('.gheader').classList.add('hidden');
    document.querySelector('.tabbar').classList.add('hidden');
    document.querySelector('main').scrollTop = 0;
  }
  // 初始化子页
  if (name === 'diet') initDietPage();
  if (name === 'achievement') initAchievementPage();
  if (name === 'favorites') initFavoritesPage();
}

function hideSubPage() {
  const mainPage = document.getElementById('mineMain');
  if (currentSubPage) {
    const subPage = document.getElementById(currentSubPage + 'Page');
    if (subPage) subPage.classList.remove('active');
  }
  if (mainPage) mainPage.classList.add('active');
  document.querySelector('.gheader').classList.remove('hidden');
  document.querySelector('.tabbar').classList.remove('hidden');
  currentSubPage = null;
  document.querySelector('main').scrollTop = 0;
}

// ===== 干饭日记 =====
function initDietPage() {
  const container = document.getElementById('dietRecords');
  if (!container) return;
  container.innerHTML = dietRecords.map(day => `
    <div style="margin-bottom:var(--space-4);">
      <h3 style="font-size:var(--fs-label-lg);margin-bottom:var(--space-3);">📅 ${day.date}</h3>
      ${day.meals.map(m => `
        <div class="glass-card" style="padding:var(--space-3);margin-bottom:var(--space-2);">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <span style="font-weight:700;">${m.type}</span>
              <span style="color:var(--text-tertiary);margin-left:8px;">${m.foods.join('、')}</span>
            </div>
            <span style="font-weight:700;color:var(--action-accent);">${m.calories} kcal</span>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ===== 成就 =====
function initAchievementPage() {
  const grid = document.getElementById('achievementGrid');
  if (!grid) return;
  grid.innerHTML = achievements.map(a => `
    <div class="achievement-card ${a.unlocked ? '' : 'locked'}">
      <div class="achievement-card__icon">${a.icon}</div>
      <div class="achievement-card__name">${a.name}</div>
      <div class="achievement-card__desc">
        ${a.unlocked ? (a.date || '已解锁') : (a.progress || '未解锁')}
      </div>
    </div>
  `).join('');
}

// ===== 收藏 =====
function initFavoritesPage() {
  const list = document.getElementById('favList');
  if (!list) return;
  list.innerHTML = userFavorites.map(f => `
    <div class="fav-item" onclick="showToast('${f.name}')">
      <div class="fav-item__icon">${f.type === '菜谱' ? '🍽️' : '📄'}</div>
      <div class="fav-item__info">
        <div class="fav-item__name">${f.name}</div>
        <div class="fav-item__meta">
          ${f.chef ? `<span class="tag tag--orange">${f.chef}</span> ` : ''}
          ${f.time}
        </div>
      </div>
    </div>
  `).join('');
}

// ===== URL参数自动跳转子页 =====
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const sub = params.get('sub');
  if (sub) showSubPage(sub);
});
</script>
  </div><!-- /phone-screen -->
</div><!-- /phone-frame -->
</body>
</html>
