<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>逛逛 — 吃啥子</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/common.css">
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen">

<!-- GHeader -->
<header class="gheader">
  <div class="gheader__top">
    <div class="gheader__mascot">
      <div class="gheader__mascot-icon">G</div>
      <span class="gheader__phrase">发现好吃的!</span>
    </div>
    <div class="gheader__actions">
      <button class="btn btn--ghost btn--sm" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <div class="gheader__avatar" onclick="navigateTo('mine')">吃</div>
    </div>
  </div>
</header>

<main>
<!-- ===== 主页：晒饭区+冷知识+偷师 ===== -->
<section class="page active" id="discoverMain">
  <div class="page-container">
    <div class="chip-row mt-3">
      <span class="chip active" onclick="switchDiscoverTab(0, this)">晒饭区</span>
      <span class="chip" onclick="switchDiscoverTab(1, this)">冷知识</span>
      <span class="chip" onclick="switchDiscoverTab(2, this)">偷师</span>
    </div>

    <div id="discoverTab0">
      <div class="section-header">
        <span class="section-title">🔥 万人血书榜</span>
        <span style="font-size:var(--fs-body-sm);color:var(--action-accent);cursor:pointer;" onclick="showSubPage('rank')">查看全部 →</span>
      </div>
      <div id="rankingPreview"></div>

      <div class="section-header">
        <span class="section-title">💬 饭搭子动态</span>
      </div>
      <div id="communityPreview"></div>
    </div>

    <div id="discoverTab1" class="hidden">
      <div class="section-header">
        <span class="section-title">📚 涨姿势</span>
        <span style="font-size:var(--fs-body-sm);color:var(--action-accent);cursor:pointer;" onclick="showSubPage('knowledge')">查看全部 →</span>
      </div>
      <div id="knowledgePreview"></div>
    </div>

    <div id="discoverTab2" class="hidden">
      <div class="section-header">
        <span class="section-title">👨‍🍳 偷师学堂</span>
      </div>
      <div class="classroom-grid" id="classroomTeaserGrid"></div>
    </div>
  </div>
</section>

<!-- ===== 子页：封神榜 ===== -->
<section class="page" id="rankPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">好吃榜</span>
      <div></div>
    </div>
    <div id="rankList" style="margin-top:var(--space-3);"></div>
  </div>
</section>

<!-- ===== 子页：冷知识 ===== -->
<section class="page" id="knowledgePage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">饮食冷知识</span>
      <div></div>
    </div>
    <div id="knowledgeList" style="margin-top:var(--space-3);"></div>
  </div>
</section>

<!-- ===== 子页：饭搭子 ===== -->
<section class="page" id="communityPage">
  <div class="page-container">
    <div class="navbar">
      <button class="navbar__back" onclick="hideSubPage()">←</button>
      <span class="navbar__title">饭搭子</span>
      <div></div>
    </div>
    <div id="communityList" style="margin-top:var(--space-3);"></div>
  </div>
</section>
</main>

<!-- TabBar -->
<nav class="tabbar">
  <button class="tabbar__item" onclick="location.href='index.html'">
    <span class="tabbar__icon">🏠</span>
    <span class="tabbar__label">开吃!</span>
  </button>
  <button class="tabbar__item active" onclick="location.href='discover.html'">
    <span class="tabbar__icon">🔍</span>
    <span class="tabbar__label">逛逛</span>
  </button>
  <button class="tabbar__item" onclick="location.href='identify.html'">
    <span class="tabbar__icon">🔮</span>
    <span class="tabbar__label">扫描</span>
  </button>
  <button class="tabbar__item" onclick="location.href='kitchen.html'">
    <span class="tabbar__icon">⚡</span>
    <span class="tabbar__label">灶台</span>
  </button>
  <button class="tabbar__item" onclick="location.href='mine.html'">
    <span class="tabbar__icon">😎</span>
    <span class="tabbar__label">我</span>
  </button>
</nav>

<script>
'use strict';

let currentSubPage = null;

function switchDiscoverTab(index, el) {
  const tabEls = document.querySelectorAll('#discoverTab0,#discoverTab1,#discoverTab2');
  tabEls.forEach(t => t.classList.add('hidden'));
  const target = document.getElementById('discoverTab' + index);
  if (target) target.classList.remove('hidden');
  if (el) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }
}

function showSubPage(name) {
  const mainPage = document.getElementById('discoverMain');
  const subPage = document.getElementById(name + 'Page');
  if (mainPage && subPage) {
    mainPage.classList.remove('active');
    subPage.classList.add('active');
    currentSubPage = name;
    document.querySelector('.gheader').classList.add('hidden');
    document.querySelector('.tabbar').classList.add('hidden');
    document.querySelector('main').scrollTop = 0;
  }
  // 初始化子页
  if (name === 'rank') initRankPage();
  if (name === 'knowledge') initKnowledgePage();
  if (name === 'community') initCommunityPage();
}

function hideSubPage() {
  const mainPage = document.getElementById('discoverMain');
  if (currentSubPage) {
    const subPage = document.getElementById(currentSubPage + 'Page');
    if (subPage) subPage.classList.remove('active');
  }
  if (mainPage) mainPage.classList.add('active');
  document.querySelector('.gheader').classList.remove('hidden');
  document.querySelector('.tabbar').classList.remove('hidden');
  currentSubPage = null;
  document.querySelector('main').scrollTop = 0;
}

// ===== 渲染主页 =====
function renderDiscover() {
  // 榜单预览
  const rankingPreview = document.getElementById('rankingPreview');
  if (rankingPreview) {
    rankingPreview.innerHTML = foodRankings.slice(0,4).map((f, i) => `
      <div class="rank-item">
        <div class="rank-num rank-num--${i+1}">${i+1}</div>
        <div class="rank-info">
          <div class="rank-name">${f.name}</div>
          <div class="rank-desc">${f.desc}</div>
        </div>
        <div class="rank-score">${f.score}</div>
      </div>
    `).join('');
  }

  // 饭搭子预览
  const communityPreview = document.getElementById('communityPreview');
  if (communityPreview) {
    communityPreview.innerHTML = communityPosts.slice(0,2).map(p => `
      <div class="community-post" onclick="showSubPage('community');showToast('${p.user}: ${p.title}')">
        <div class="community-post__header">
          <div class="community-post__avatar">${p.avatar}</div>
          <div>
            <div class="community-post__user">${p.user}</div>
            <div class="community-post__time">${p.time}</div>
          </div>
        </div>
        <div class="community-post__title">${p.title}</div>
        <div class="community-post__content">${p.content}</div>
        <div class="community-post__footer">
          <span>♥ ${p.likes}</span><span>💬 ${p.comments}</span>
          ${p.tags.map(t => `<span class="tag tag--orange">${t}</span>`).join(' ')}
        </div>
      </div>
    `).join('');
  }

  // 涨姿势预览
  const knowledgePreview = document.getElementById('knowledgePreview');
  if (knowledgePreview) {
    knowledgePreview.innerHTML = knowledgeArticles.slice(0,3).map(a => `
      <div class="knowledge-item" onclick="showSubPage('knowledge');showToast('${a.title}')">
        <div class="knowledge-item__title">${a.title}</div>
        <div class="knowledge-item__summary">${a.summary}</div>
        <div class="knowledge-item__meta">
          <span>${a.category}</span><span>👁 ${a.readCount}</span>
        </div>
      </div>
    `).join('');
  }

  // 偷师学堂预览
  const teaserGrid = document.getElementById('classroomTeaserGrid');
  if (teaserGrid) {
    teaserGrid.innerHTML = classroomCourses.slice(0,4).map(c => `
      <div class="classroom-card" onclick="navigateTo('classroom')">
        <div class="classroom-card__icon">${c.icon}</div>
        <div class="classroom-card__title">${c.title}</div>
        <div class="classroom-card__meta">${c.level} · ${c.duration}</div>
      </div>
    `).join('');
  }
}

// ===== 榜单 =====
function initRankPage() {
  const list = document.getElementById('rankList');
  if (list) {
    list.innerHTML = foodRankings.map((f, i) => `
      <div class="rank-item">
        <div class="rank-num rank-num--${i+1 > 3 ? 'default' : i+1}">${i > 2 ? i+1 : ''}</div>
        <div class="rank-info">
          <div class="rank-name">${f.name} <span class="tag tag--gold">${f.tag}</span></div>
          <div class="rank-desc">${f.desc}</div>
        </div>
        <div class="rank-score">${f.score}</div>
      </div>
    `).join('');
  }
}

// ===== 涨姿势 =====
function initKnowledgePage() {
  const list = document.getElementById('knowledgeList');
  if (list) {
    list.innerHTML = knowledgeArticles.map(a => `
      <div class="knowledge-item" onclick="showToast('详情页开发中：${a.title}')">
        <div class="knowledge-item__title">${a.title}</div>
        <div class="knowledge-item__summary">${a.summary}</div>
        <div class="knowledge-item__meta">
          <span class="tag tag--green">${a.category}</span>
          <span>👁 ${a.readCount}</span>
        </div>
      </div>
    `).join('');
  }
}

// ===== 饭搭子 =====
function initCommunityPage() {
  const list = document.getElementById('communityList');
  if (list) {
    list.innerHTML = communityPosts.map(p => `
      <div class="community-post" onclick="showToast('${p.user}: ${p.title}')">
        <div class="community-post__header">
          <div class="community-post__avatar">${p.avatar}</div>
          <div>
            <div class="community-post__user">${p.user}</div>
            <div class="community-post__time">${p.time}</div>
          </div>
        </div>
        <div class="community-post__title">${p.title}</div>
        <div class="community-post__content">${p.content}</div>
        <div class="community-post__footer">
          <span>♥ ${p.likes}</span><span>💬 ${p.comments}</span>
          ${p.tags.map(t => `<span class="tag tag--orange" style="margin-left:4px;">${t}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }
}

// ===== URL参数自动跳转子页 =====
document.addEventListener('DOMContentLoaded', () => {
  renderDiscover();
  const params = new URLSearchParams(window.location.search);
  const sub = params.get('sub');
  if (sub) showSubPage(sub);
});
</script>
  </div><!-- /phone-screen -->
</div><!-- /phone-frame -->
</body>
</html>
