<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>扫描 — 吃啥子</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/common.css">
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen">

<!-- GHeader -->
<header class="gheader">
  <div class="gheader__top">
    <div class="gheader__mascot">
      <div class="gheader__mascot-icon">G</div>
      <span class="gheader__phrase">一照识万物</span>
    </div>
    <div class="gheader__actions">
      <button class="btn btn--ghost btn--sm" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <div class="gheader__avatar" onclick="navigateTo('mine')">吃</div>
    </div>
  </div>
</header>

<main>
<section class="page active" data-page="identify">
  <div class="page-container">
    <h2 class="page-title" style="padding:var(--space-5) var(--space-5) 0;">一照识万物</h2>
    <p class="page-subtitle" style="padding:0 var(--space-5);">咔嚓一下，AI告诉你这是啥</p>

    <div class="identify-area" onclick="simulateIdentify()">
      <div class="identify-area__icon">📸</div>
      <div class="identify-area__text">点击拍照识别食物</div>
    </div>

    <div style="padding:0 var(--space-5);margin-top:var(--space-3);">
      <input type="text" id="identifyInput" placeholder="或输入食物名称搜索..."
        style="width:100%;padding:12px 16px;border-radius:var(--radius-full);border:1px solid var(--action-secondary-border);font-size:var(--fs-body-md);font-family:var(--font-zh);background:var(--bg-surface);">
      <button class="btn btn--primary btn--md" style="width:100%;margin-top:var(--space-3);" onclick="simulateIdentify()">识别</button>
    </div>

    <div id="identifyResult" class="identify-result hidden"></div>
  </div>
</section>
</main>

<!-- TabBar -->
<nav class="tabbar">
  <button class="tabbar__item" onclick="location.href='index.html'">
    <span class="tabbar__icon">🏠</span>
    <span class="tabbar__label">开吃!</span>
  </button>
  <button class="tabbar__item" onclick="location.href='discover.html'">
    <span class="tabbar__icon">🔍</span>
    <span class="tabbar__label">逛逛</span>
  </button>
  <button class="tabbar__item active" onclick="location.href='identify.html'">
    <span class="tabbar__icon">🔮</span>
    <span class="tabbar__label">扫描</span>
  </button>
  <button class="tabbar__item" onclick="location.href='kitchen.html'">
    <span class="tabbar__icon">⚡</span>
    <span class="tabbar__label">灶台</span>
  </button>
  <button class="tabbar__item" onclick="location.href='mine.html'">
    <span class="tabbar__icon">😎</span>
    <span class="tabbar__label">我</span>
  </button>
</nav>

<script>
'use strict';

async function simulateIdentify() {
  const input = document.getElementById('identifyInput').value.trim();
  const foodName = input || '番茄炒蛋';

  showCookingLoader(true);
  await sleep(1500);

  const resultEl = document.getElementById('identifyResult');
  resultEl.innerHTML = `
    <div class="identify-result__food">🍽️ ${foodName}</div>
    <div class="identify-result__info">
      <strong>分类：</strong>家常菜 | <strong>菜系：</strong>中式<br>
      <strong>主料：</strong>番茄、鸡蛋 | <strong>难度：</strong>简单
    </div>
    <div class="identify-result__score">
      <div class="identify-score-item">
        <div class="identify-score-value">8.5</div>
        <div class="identify-score-label">健康分</div>
      </div>
      <div class="identify-score-item">
        <div class="identify-score-value">9.2</div>
        <div class="identify-score-label">美味分</div>
      </div>
      <div class="identify-score-item">
        <div class="identify-score-value">320</div>
        <div class="identify-score-label">卡路里</div>
      </div>
    </div>
  `;
  resultEl.classList.remove('hidden');

  showCookingLoader(false);
}
</script>
  </div><!-- /phone-screen -->
</div><!-- /phone-frame -->
</body>
</html>
