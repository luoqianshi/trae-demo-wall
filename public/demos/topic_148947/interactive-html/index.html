<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今天吃什么 · 交互式 HTML 原型</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav">
      <div class="brand">
        <div class="brand-mark">吃</div>
        <div>
          <div class="brand-title">今天吃什么</div>
          <div class="brand-subtitle">家庭三餐规划原型</div>
        </div>
      </div>
      <button class="nav-item active" data-view="home">首页推荐</button>
      <button class="nav-item" data-view="week">一周菜单</button>
      <button class="nav-item" data-view="shopping">购物清单</button>
      <button class="nav-item" data-view="favorites">收藏</button>
      <button class="nav-item" data-view="profile">我的档案</button>
    </aside>

    <main class="content">
      <section id="home" class="view active-view">
        <div class="hero">
          <div>
            <h1>今天吃什么</h1>
            <p>每天30秒，解决一家人的三餐。</p>
          </div>
          <div class="hero-actions">
            <button class="primary" id="shuffleTodayBtn">重新推荐一组</button>
            <button class="secondary" data-jump="week">查看一周菜单</button>
          </div>
        </div>
        <div class="section-head">
          <h2>今日推荐</h2>
          <span id="currentMealHint"></span>
        </div>
        <div id="todayMeals" class="meal-grid"></div>
      </section>

      <section id="week" class="view">
        <div class="page-head">
          <div>
            <h1>一周菜单</h1>
            <p>早餐包含喝的和吃的，午晚餐默认三菜一汤，可手动增减替换。</p>
          </div>
          <div class="head-actions">
            <button class="secondary" id="regenWeekBtn">重新生成</button>
            <button class="ghost" id="clearWeekBtn">清空</button>
          </div>
        </div>
        <div id="weekMenu" class="week-list"></div>
      </section>

      <section id="shopping" class="view">
        <div class="page-head">
          <div>
            <h1>购物清单</h1>
            <p>按食材汇总采购，不包含米、水、常用调味料、鸡蛋、虾皮和花椒类。</p>
          </div>
          <button class="ghost" id="resetShoppingBtn">重置勾选</button>
        </div>
        <div id="shoppingList" class="shopping-list"></div>
      </section>

      <section id="favorites" class="view">
        <div class="page-head">
          <div>
            <h1>收藏菜谱</h1>
            <p>收藏喜欢的菜，方便之后加入菜单。</p>
          </div>
        </div>
        <div id="favoriteList" class="recipe-list"></div>
      </section>

      <section id="profile" class="view">
        <div class="page-head">
          <div>
            <h1>我的用餐档案</h1>
            <p>本地保存家庭人数、预算和偏好，用于菜单生成演示。</p>
          </div>
          <button class="ghost danger" id="clearAllBtn">清空本地数据</button>
        </div>
        <div class="profile-grid">
          <div class="card profile-card">
            <label>用餐人数</label>
            <select id="familySizeInput">
              <option value="1">1人</option>
              <option value="2">2人</option>
              <option value="3">3人</option>
              <option value="4">4人</option>
              <option value="5">5人</option>
              <option value="6">6人</option>
            </select>
            <label>本周预算</label>
            <input id="budgetInput" type="number" min="0" step="10">
            <label>忌口</label>
            <input id="avoidInput" placeholder="例如：不吃香菜、海鲜过敏">
            <label>常住地区</label>
            <input id="regionInput" placeholder="例如：安徽合肥">
            <button class="primary" id="saveProfileBtn">保存档案</button>
          </div>
          <div class="card stat-card">
            <div class="stat-row"><span>收藏数量</span><strong id="favoriteCount">0</strong></div>
            <div class="stat-row"><span>本周已添加菜品</span><strong id="menuCount">0</strong></div>
            <div class="stat-row"><span>预算建议</span><strong id="budgetLevel">标准</strong></div>
            <p id="budgetAdvice" class="advice"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="recipeDialog" class="recipe-dialog">
    <button class="dialog-close" id="closeRecipeDialog">×</button>
    <div id="recipeDetail"></div>
  </dialog>

  <dialog id="pickerDialog" class="picker-dialog">
    <div class="picker-head">
      <div>
        <h2 id="pickerTitle">选择菜品</h2>
        <p id="pickerDesc"></p>
      </div>
      <button class="dialog-close" id="closePickerDialog">×</button>
    </div>
    <input id="recipeSearch" class="search-input" placeholder="搜索菜名、食材、标签">
    <div id="pickerList" class="picker-list"></div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="./recipes-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
