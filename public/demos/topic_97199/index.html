<style>
/* ============ 全局重置 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #app { height: 100%; }
body { font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; color: #303133; }

/* ============ 登录页 ============ */
.login-container {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
}
.login-card { width: 400px; border-radius: 8px; }
.login-card .el-card__header { text-align: center; }
.login-title { font-size: 20px; font-weight: 600; color: #1e3a5f; }
.login-subtitle { font-size: 12px; color: #909399; letter-spacing: 0.5px; margin-top: 4px; }
.login-tip { text-align: center; font-size: 12px; color: #909399; margin-top: 12px; }

/* ============ 主布局 ============ */
.main-container { height: 100%; }
.app-header {
  background: #001529; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
}
.app-header .app-title { font-size: 18px; font-weight: 600; color: #fff; }
.app-header .header-right { display: flex; align-items: center; gap: 16px; }
.app-header .username { color: #fff; font-size: 14px; }
.app-header .logout-btn { color: #f56c6c; cursor: pointer; font-size: 14px; }
.app-aside { width: 220px !important; background: #fff; border-right: 1px solid #e6e6e6; }
.app-main { background: #f5f7fa; padding: 16px; }
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; color: #303133; }
.filter-card { margin-bottom: 16px; }
.filter-card .el-card__body { padding: 16px 20px; }

/* ============ 肌肉图弹窗 ============ */
.muscle-dialog .el-dialog__body { padding: 0 20px 20px; }
.muscle-layout { display: flex; gap: 16px; min-height: 520px; }
.muscle-left { flex: 1 1 55%; display: flex; flex-direction: column; }
.muscle-right { flex: 1 1 45%; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
.svg-wrapper { flex: 1; min-height: 480px; overflow: auto; border: 1px solid #ebeef5; border-radius: 4px; padding: 8px; background: #fafafa; }
.svg-container { position: relative; }
.muscle-svg { display: block; width: 100%; height: auto; max-width: 100%; user-select: none; }
.muscle-region { fill: transparent; stroke: #2563eb; stroke-width: 1; cursor: pointer; transition: fill 0.2s; pointer-events: all; }
.muscle-region:hover { fill: rgba(37,99,235,0.3); }
.muscle-region.selected { fill: rgba(13,148,136,0.4); stroke: #0d9488; }
.muscle-region.recorded { stroke: #f59e0b; stroke-dasharray: 4 3; }
.muscle-region.disabled { cursor: not-allowed; opacity: 0.4; }
.muscle-tooltip {
  position: fixed; z-index: 3000; pointer-events: none;
  background: rgba(17,24,39,0.9); color: #fff;
  padding: 4px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap;
}
.pending-section, .history-section { background: #fff; border: 1px solid #ebeef5; border-radius: 4px; padding: 12px; }
.section-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #303133; display: flex; justify-content: space-between; align-items: center; }
.section-title .count { font-size: 12px; color: #909399; font-weight: normal; }
.pending-list { max-height: 280px; overflow-y: auto; }
.pending-item { background: #f5f7fa; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
.pending-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.pending-item-name { font-weight: 600; font-size: 14px; }
.pending-item-meta { font-size: 12px; color: #909399; }
.history-list { max-height: 240px; overflow-y: auto; }
.history-item { border-left: 3px solid #2563eb; padding: 8px 10px; margin-bottom: 8px; background: #fafafa; border-radius: 0 4px 4px 0; }
.history-item-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.history-item-time { font-weight: 600; }
.history-item-meta { font-size: 12px; color: #909399; }
.history-item-muscles { font-size: 12px; color: #606266; margin-top: 4px; }
.pending-actions { margin-top: 10px; display: flex; gap: 8px; }

/* ============ 完成详情 ============ */
.detail-block { margin-bottom: 16px; }
.detail-block h4 { font-size: 14px; margin-bottom: 8px; color: #303133; }
.eval-box { background: #f5f7fa; padding: 12px; border-radius: 4px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #606266; }
.op-record-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 4px; padding: 12px; margin-bottom: 8px; }

/* ============ 标签 ============ */
.tag-chip { margin-right: 6px; margin-bottom: 4px; }

/* ============ 通用 ============ */
.el-table { margin-bottom: 0; }
.demo-badge { position: fixed; bottom: 12px; right: 12px; z-index: 9999; }
</style>

/* ---------- 工具函数 ---------- */
function maskSfzh(sfzh) {
  if (!sfzh || sfzh.length < 18) return sfzh;
  return sfzh.substring(0, 4) + '*'.repeat(sfzh.length - 8) + sfzh.substring(sfzh.length - 4);
}
function formatDate(d, fmt) {
  if (!d) return '-';
  fmt = fmt || 'YYYY-MM-DD HH:mm:ss';
  return dayjs(d).format(fmt);
}
function todayStr() { return dayjs().format('YYYY-MM-DD'); }
function daysAgoStr(n) { return dayjs().subtract(n, 'day').format('YYYY-MM-DD'); }
function nowISO() { return dayjs().format('YYYY-MM-DDTHH:mm:ss'); }

const LoginPage = {
  emits: ['login'],
  setup(props, { emit }) {
    const formRef = ref(null);
    const loginForm = reactive({ username: '', password: '' });
    const loading = ref(false);

      username: [{ required: true, message: '请输入工号', trigger: 'blur' }],

        loading.value = true;
        setTimeout(() => {
          const account = DEMO_ACCOUNTS.find(a => a.username === loginForm.username && a.password === loginForm.password);
          if (account) {
            const user = DB.users.find(u => u.username === account.username);
            const role = DB.roles.find(r => r.role_code === account.role);

              token: 'demo-token-' + Date.now(),

              role: account.role,

              permissions: DB.rolePermissions[user.role_id] || [],

const MuscleDiagramDialog = {
  props: { modelValue: Boolean, manageId: [Number, String], patientSfzh: String, patientName: String },
  emits: ['update:modelValue', 'submitted'],
  setup(props, { emit }) {
    const activeView = ref(null);
    const svgContent = ref('');
    const svgContainerRef = ref(null);
    const tooltipVisible = ref(false);
    const tooltipText = ref('');
    const tooltipX = ref(0);
    const tooltipY = ref(0);
    const selectedMuscles = ref([]);
    const historyRecords = ref([]);
    const submitLoading = ref(false);
    const viewList = Object.keys(SVG_VIEWS).map(k => ({ id: Number(k), ...SVG_VIEWS[k] }));

    const recordedMuscleIds = computed(() => {
      const ids = new Set();
      historyRecords.value.forEach(r => r.muscles.forEach(m => ids.add(m.muscle_id)));
      return ids;
    });
    const selectedMuscleIds = computed(() => new Set(selectedMuscles.value.map(m => m.muscleId)));

    const loadSvg = (viewId) => {
      svgContent.value = SVG_CONTENT[viewId] || '';
      nextTick(() => applyHighlight());
    };

    const applyHighlight = () => {
      const container = svgContainerRef.value;
      if (!container) return;
      const regions = container.querySelectorAll('.muscle-region');
      regions.forEach(el => {
        const mid = Number(el.getAttribute('data-muscle-id'));
        let cls = 'muscle-region';
        if (selectedMuscleIds.value.has(mid)) cls += ' selected';
        if (recordedMuscleIds.value.has(mid)) cls += ' recorded';
        el.setAttribute('class', cls);
      });
    };

    const findMuscleRegion = (target) => {
      let el = target;
      while (el && el !== svgContainerRef.value) {
        const cls = el.getAttribute && el.getAttribute('class');
        if (cls && cls.indexOf('muscle-region') >= 0) return el;
        el = el.parentNode;
      }
      return null;
    };

    const onSvgClick = (e) => {
      const region = findMuscleRegion(e.target);
      if (!region) return;
      const muscleId = Number(region.getAttribute('data-muscle-id'));
      const muscleName = region.getAttribute('data-muscle-name');
      const bodyRegion = region.getAttribute('data-region');
      const bodySide = region.getAttribute('data-side');
      selectedMuscles.value.push({ muscleId, muscleName, bodyRegion, bodySide, remark: '' });
      applyHighlight();
      ElementPlus.ElMessage.success('已添加：' + muscleName);
    };

    const onSvgMouseMove = (e) => {
      const region = findMuscleRegion(e.target);
      if (region) {
        tooltipText.value = region.getAttribute('data-muscle-name');
        tooltipVisible.value = true;
        tooltipX.value = e.clientX + 12;
        tooltipY.value = e.clientY + 12;
      } else {
        tooltipVisible.value = false;
      }
    };

    const onSvgMouseLeave = () => { tooltipVisible.value = false; };

    const removeMuscle = (index) => {
      selectedMuscles.value.splice(index, 1);
      applyHighlight();
    };

    const clearSelected = () => {
      ElementPlus.ElMessageBox.confirm('确定清空本次已选肌肉？', '提示', { type: 'warning' }).then(() => {
        selectedMuscles.value = [];
        applyHighlight();
      }).catch(() => {});
    };

    const submitRecords = () => {
      if (selectedMuscles.value.length === 0) {
        ElementPlus.ElMessage.warning('请至少选择一块肌肉');
        return;
      }
      submitLoading.value = true;
      setTimeout(() => {
        const newRecord = {
          id: Date.now(),
          operation_time: nowISO(),
          operator: DB.currentUser ? DB.currentUser.userInfo.ysdm : 'demo',
          muscle_count: selectedMuscles.value.length,
          muscles: selectedMuscles.value.map(m => ({
            muscle_id: m.muscleId, muscle_name: m.muscleName,
            body_region: m.bodyRegion, body_side: m.bodySide, remark: m.remark,
          })),
        };
        historyRecords.value.unshift(newRecord);
        // update operation count
        const p = DB.managedPatients.find(p => p.id === props.manageId);
        if (p) p.operation_count = (p.operation_count || 0) + selectedMuscles.value.length;
        selectedMuscles.value = [];
        applyHighlight();
        submitLoading.value = false;
        ElementPlus.ElMessage.success('操作记录提交成功');
        emit('submitted');
      }, 500);
    };

    const loadHistory = () => {
      historyRecords.value = (DB.operationRecords[props.manageId] || []).slice().sort((a, b) =>
        dayjs(b.operation_time).valueOf() - dayjs(a.operation_time).valueOf());
      applyHighlight();
    };

    const handleClose = () => {
      selectedMuscles.value = [];
      tooltipVisible.value = false;
      emit('update:modelValue', false);
    };

    const borderColors = ['#2563eb', '#0d9488', '#7c3aed', '#db2777', '#d97706'];
    const muscleSummary = (muscles) => muscles.map(m => m.muscle_name + '(' + m.body_side + ')').join('、');

    watch(() => props.modelValue, (val) => {
      if (val) {
        selectedMuscles.value = [];
        activeView.value = 1;
        loadSvg(1);
        loadHistory();
      }
    });
    watch(activeView, (v) => { if (v) loadSvg(v); });

    return { activeView, svgContent, svgContainerRef, viewList, selectedMuscles, historyRecords,
      tooltipVisible, tooltipText, tooltipX, tooltipY, submitLoading, borderColors,
      onSvgClick, onSvgMouseMove, onSvgMouseLeave, removeMuscle, clearSelected, submitRecords,
      handleClose, muscleSummary, formatDate, maskSfzh };
  },
  template: `
  <el-dialog :model-value="modelValue" @update:model-value="$emit('update:modelValue', $event)"
    :title="(patientName || '') + ' · 浮针操作记录'" width="80%" top="5vh"
    :close-on-click-modal="false" class="muscle-dialog" @close="handleClose">
    <div class="muscle-layout">
      <div class="muscle-left">
        <el-tabs v-model="activeView" type="card">
          <el-tab-pane v-for="v in viewList" :key="v.id" :label="v.name" :name="v.id">
            <div style="font-size:12px;color:#909399;margin-bottom:4px;">{{ v.desc }}</div>
          </el-tab-pane>
        </el-tabs>
        <div class="svg-wrapper">
          <div class="svg-container" ref="svgContainerRef" v-html="svgContent"
            @click="onSvgClick" @mousemove="onSvgMouseMove" @mouseleave="onSvgMouseLeave"></div>
        </div>
      </div>
      <div class="muscle-right">
        <div class="pending-section">
          <div class="section-title">本次操作记录（待提交）<span class="count">共 {{ selectedMuscles.length }} 条</span></div>
          <div class="pending-list" v-if="selectedMuscles.length > 0">
            <div class="pending-item" v-for="(m, i) in selectedMuscles" :key="i">
              <div class="pending-item-head">
                <div>
                  <span class="pending-item-name">{{ m.muscleName }}</span>
                  <span class="pending-item-meta" style="margin-left:8px;">{{ m.bodyRegion }} · {{ m.bodySide }}</span>
                </div>
                <el-button type="danger" link size="small" @click="removeMuscle(i)">删除</el-button>
              </div>
              <el-input v-model="m.remark" type="textarea" :rows="2" maxlength="500" show-word-limit placeholder="备注（选填）" />
            </div>
          </div>
          <el-empty v-else description="点击左侧肌肉图选择肌肉" :image-size="40" />
          <div class="pending-actions">
            <el-button type="success" size="small" :loading="submitLoading" @click="submitRecords">提交本次记录</el-button>
            <el-button size="small" @click="clearSelected" :disabled="selectedMuscles.length === 0">清空</el-button>
          </div>
        </div>
        <div class="history-section">
          <div class="section-title">历次操作记录<span class="count">共 {{ historyRecords.length }} 次</span></div>
          <div class="history-list" v-if="historyRecords.length > 0">
            <div class="history-item" v-for="(r, i) in historyRecords" :key="r.id"
              :style="{ borderLeftColor: borderColors[i % borderColors.length] }">
              <div class="history-item-head">
                <span class="history-item-time">第 {{ historyRecords.length - i }} 次 · {{ formatDate(r.operation_time, 'YYYY-MM-DD HH:mm') }}</span>
                <span class="history-item-meta">操作人：{{ r.operator }} | {{ r.muscle_count }} 块肌肉</span>
              </div>
              <div class="history-item-muscles">{{ muscleSummary(r.muscles) }}</div>
            </div>
          </div>
          <el-empty v-else description="暂无历次操作记录" :image-size="40" />
        </div>
      </div>
    </div>
    <template #footer>
      <el-button @click="handleClose">关闭</el-button>
    </template>
    <div class="muscle-tooltip" v-show="tooltipVisible"
      :style="{ left: tooltipX + 'px', top: tooltipY + 'px' }">{{ tooltipText }}</div>
  </el-dialog>`,
};

    const completeForm = reactive({ overallEvaluation: '', tags: [] });
    const completeLoading = ref(false);
    const tagOptions = computed(() => DB.tags.filter(t => t.isActive !== 0).map(t => ({ label: t.tag_name, value: t.tag_name })));

    const dateShortcuts = [
      { text: '今天', value: () => [new Date(), new Date()] },
      { text: '近7天', value: () => { const e = new Date(); const s = new Date(); s.setTime(s.getTime() - 3600*1000*24*6); return [s, e]; } },
      { text: '近30天', value: () => { const e = new Date(); const s = new Date(); s.setTime(s.getTime() - 3600*1000*24*29); return [s, e]; } },
    ];

    const fetchData = () => {
      loading.value = true;
      setTimeout(() => {
        tableData.value = DB.managedPatients.filter(p => p.status === 'MANAGED').slice();
        total.value = tableData.value.length;
        loading.value = false;
      }, 300);
    };

    const handleFilter = () => { page.value = 1; fetchData(); };

    const handleRecord = (row) => {
      muscleDialog.manageId = row.id;
      muscleDialog.patientSfzh = row.sfzh;
      muscleDialog.patientName = row.patient_name;
      muscleDialog.visible = true;
    };

    const handleComplete = (row) => {
      completeDialog.manageId = row.id;
      completeDialog.patientName = row.patient_name;
      completeDialog.patientSfzh = row.sfzh;
      completeForm.overallEvaluation = '';
      completeForm.tags = [];
      completeDialog.visible = true;
    };

    const confirmComplete = () => {
      if (!completeForm.overallEvaluation.trim()) {
        ElementPlus.ElMessage.warning('请填写总体评价');
        return;
      }
      ElementPlus.ElMessageBox.confirm('确认完成「' + completeDialog.patientName + '」的治疗？完成后患者将从管理列表移入完成列表。', '完成治疗', { type: 'warning' }).then(() => {
        completeLoading.value = true;
        setTimeout(() => {
          const idx = DB.managedPatients.findIndex(p => p.id === completeDialog.manageId);
          if (idx >= 0) {
            const p = DB.managedPatients[idx];
            p.status = 'COMPLETED';
            const newId = Math.max(...DB.completedPatients.map(c => c.id), 0) + 1;
            const newManageId = Math.max(...DB.completedPatients.map(c => c.manage_id), 0) + 1;
            DB.completedPatients.unshift({
              id: newId, manage_id: newManageId, patient_sfzh: p.sfzh, patient_name: p.patient_name,
              gender: p.gender, age: p.age, diagnosis: p.diagnosis,
              complete_time: nowISO(), operator: DB.currentUser ? DB.currentUser.userInfo.ysdm : 'demo',
              overall_evaluation: completeForm.overallEvaluation, tags: completeForm.tags.slice(), is_revoked: 0,
            });
            // move operation records
            if (DB.operationRecords[p.id]) {
              DB.completedOperationRecords[newManageId] = DB.operationRecords[p.id];
            }
          }
          completeLoading.value = false;
          completeDialog.visible = false;
          ElementPlus.ElMessage.success('已完成治疗');
          fetchData();
        }, 500);
      }).catch(() => {});
    };

    const onMuscleSubmitted = () => { fetchData(); };
    const indexMethod = (i) => (page.value - 1) * size.value + i + 1;

    onMounted(() => { fetchData(); });

    return { dateRange, tableData, total, page, size, loading, dateShortcuts,

      handleFilter, handleRecord, handleComplete, confirmComplete, onMuscleSubmitted,
      indexMethod, maskSfzh, formatDate };

// ---------- 完成页 ----------
const CompletionPage = {
  setup() {
    const searchForm = reactive({ keyword: '', startDate: '', endDate: '', tag: '' });
    const dateRange = ref([]);
    const tableData = ref([]);
    const total = ref(0);
    const page = ref(1);
    const size = ref(20);
    const loading = ref(false);

    const tagList = computed(() => DB.tags.filter(t => t.isActive !== 0));

    const detailDialog = reactive({ visible: false, loading: false, row: null, data: null });
    const tagDialog = reactive({ visible: false, loading: false, manageId: null, patientName: '', tags: [] });

    const fetchData = () => {
      loading.value = true;
      setTimeout(() => {
        let list = DB.completedPatients.filter(p => p.is_revoked === 0);
        if (searchForm.keyword) {
          const kw = searchForm.keyword.toLowerCase();
          list = list.filter(p => p.patient_name.toLowerCase().includes(kw) || p.patient_sfzh.includes(searchForm.keyword));
        }
        if (searchForm.tag) {
          list = list.filter(p => p.tags.includes(searchForm.tag));
        }
        tableData.value = list;
        total.value = list.length;
        loading.value = false;
      }, 300);
    };

    const handleSearch = () => { page.value = 1; fetchData(); };
    const handleReset = () => {
      searchForm.keyword = ''; searchForm.tag = ''; dateRange.value = [];
      searchForm.startDate = ''; searchForm.endDate = '';
      page.value = 1; fetchData();
    };

    watch(dateRange, (val) => {
      searchForm.startDate = val && val[0] ? val[0] : '';
      searchForm.endDate = val && val[1] ? val[1] : '';
    });

    const tagType = (tagName) => {
      const t = DB.tags.find(tg => tg.tag_name === tagName);
      if (!t) return 'primary';
      if (t.tag_category && t.tag_category.includes('疗效')) return 'primary';
      if (t.tag_category && t.tag_category.includes('部位')) return 'success';
      if (t.tag_category && t.tag_category.includes('病种')) return 'warning';
      return 'primary';
    };

    const handleDetail = (row) => {
      detailDialog.row = row;
      detailDialog.visible = true;
      detailDialog.loading = true;
      setTimeout(() => {
        const opRecords = DB.completedOperationRecords[row.manage_id] || [];
        detailDialog.data = {
          completeRecord: { overallEvaluation: row.overall_evaluation, completeTime: row.complete_time },
          operationRecords: opRecords,
          tags: row.tags.slice(),
        };
        detailDialog.loading = false;
      }, 400);
    };

    const handleEditTags = (row) => {
      tagDialog.manageId = row.manage_id;
      tagDialog.patientName = row.patient_name;
      tagDialog.tags = row.tags.slice();
      tagDialog.visible = true;
    };

    const saveTags = () => {
      tagDialog.loading = true;
      setTimeout(() => {
        const p = DB.completedPatients.find(p => p.manage_id === tagDialog.manageId);
        if (p) p.tags = tagDialog.tags.slice();
        if (detailDialog.data) detailDialog.data.tags = tagDialog.tags.slice();
        tagDialog.loading = false;
        tagDialog.visible = false;
        ElementPlus.ElMessage.success('标签已更新');
        fetchData();
      }, 300);
    };

    const handleRevoke = (row) => {
      ElementPlus.ElMessageBox.confirm('确认撤销「' + row.patient_name + '」的完成状态？撤销后将回到管理列表。', '撤销完成', { type: 'warning' }).then(() => {
        const idx = DB.completedPatients.findIndex(p => p.manage_id === row.manage_id);
        if (idx >= 0) {
          const cp = DB.completedPatients[idx];
          cp.is_revoked = 1;
          // back to managed
          const newId = Math.max(...DB.managedPatients.map(p => p.id), 0) + 1;
          DB.managedPatients.unshift({
            id: newId, patid: '', patient_name: cp.patient_name, gender: cp.gender, age: cp.age,
            sfzh: cp.patient_sfzh, diagnosis: cp.diagnosis, syxh: '', blh: '', yexh: '0',
            manage_time: nowISO(), manage_user: DB.currentUser ? DB.currentUser.userInfo.ysdm : 'demo',
            status: 'MANAGED', operation_count: 0,
          });
          DB.operationRecords[newId] = DB.completedOperationRecords[cp.manage_id] || [];
        }
        ElementPlus.ElMessage.success('已撤销完成');
        fetchData();
      }).catch(() => {});
    };

    const muscleSummary = (muscles) => muscles.map(m => m.muscle_name + '(' + m.body_side + ')').join('、');
    const borderColors = ['#2563eb', '#0d9488', '#7c3aed', '#db2777', '#d97706'];
    const indexMethod = (i) => (page.value - 1) * size.value + i + 1;

    onMounted(() => { fetchData(); });

    return { searchForm, dateRange, tableData, total, page, size, loading, tagList,
      detailDialog, tagDialog, tagType, handleSearch, handleReset, handleDetail,
      handleEditTags, saveTags, handleRevoke, muscleSummary, borderColors, indexMethod,
      maskSfzh, formatDate };
  },
  template: `
  <div>
    <h2 class="page-title">病人完成</h2>
    <el-card class="filter-card" shadow="never">
      <el-form :inline="true" :model="searchForm">

          <el-input v-model="searchForm.keyword" placeholder="输入姓名或身份证号" clearable style="width:200px"
            @keyup.enter="handleSearch" />
        </el-form-item>
        <el-form-item label="完成时间">
          <el-date-picker v-model="dateRange" type="daterange" value-format="YYYY-MM-DD"
            range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" unlink-panels />
        </el-form-item>
        <el-form-item label="标签筛选">
          <el-select v-model="searchForm.tag" clearable placeholder="全部" style="width:180px">
            <el-option v-for="t in tagList" :key="t.id" :label="t.tag_name" :value="t.tag_name" />
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="handleSearch">查询</el-button>
          <el-button @click="handleReset">重置</el-button>
        </el-form-item>
      </el-form>
    </el-card>
    <el-table :data="tableData" border v-loading="loading" style="width:100%">
      <el-table-column type="index" label="序号" width="60" align="center" :index="indexMethod" />
      <el-table-column prop="patient_name" label="姓名" width="100" />
      <el-table-column label="身份证号" width="180">
        <template #default="{ row }">{{ maskSfzh(row.patient_sfzh) }}</template>
      </el-table-column>
      <el-table-column label="完成时间" width="160">
        <template #default="{ row }">{{ formatDate(row.complete_time, 'YYYY-MM-DD HH:mm') }}</template>
      </el-table-column>
      <el-table-column label="诊断" min-width="140" show-overflow-tooltip>
        <template #default="{ row }">{{ row.diagnosis }}</template>
      </el-table-column>
      <el-table-column label="标签" min-width="200">
        <template #default="{ row }">
          <el-tag v-for="t in row.tags" :key="t" :type="tagType(t)" effect="light" class="tag-chip">{{ t }}</el-tag>
          <span v-if="!row.tags || row.tags.length === 0">-</span>
        </template>
      </el-table-column>
      <el-table-column label="操作" width="280" fixed="right">
        <template #default="{ row }">
          <el-button size="small" @click="handleDetail(row)">查看详情</el-button>
          <el-button type="primary" size="small" @click="handleEditTags(row)">调整标签</el-button>

        </template>
      </el-table-column>
    </el-table>
    <el-pagination background :total="total" :current-page="page" :page-size="size"
      :page-sizes="[20,50,100]" layout="total, sizes, prev, pager, next, jumper"
      style="margin-top:16px;justify-content:flex-end;display:flex;"
      @current-change="page=$event" @size-change="size=$event;page=1" />

    <!-- 详情弹窗 -->
    <el-dialog v-model="detailDialog.visible" title="完成详情" width="720px" :close-on-click-modal="false">
      <div v-loading="detailDialog.loading">
        <template v-if="detailDialog.data && detailDialog.row">
          <el-descriptions :column="2" border>
            <el-descriptions-item label="姓名">{{ detailDialog.row.patient_name }}</el-descriptions-item>
            <el-descriptions-item label="身份证号">{{ maskSfzh(detailDialog.row.patient_sfzh) }}</el-descriptions-item>

        tableData.value = list;
        total.value = list.length;
        loading.value = false;
      }, 200);
    };

    const roleList = computed(() => DB.roles);
    const getRoleName = (rid) => { const r = DB.roles.find(r => r.id === rid); return r ? r.role_name : '-'; };

    const handleAdd = () => {
      dialog.isEdit = false;
      dialog.form = { id: null, ysdm: '', username: '', real_name: '', ysksdm: 'FK001', role_id: 1, is_active: 1 };
      dialog.visible = true;
    };
    const handleEdit = (row) => {
      dialog.isEdit = true;
      dialog.form = { ...row };
      dialog.visible = true;

    const saveUser = () => {
      if (!dialog.form.ysdm || !dialog.form.username) { ElementPlus.ElMessage.warning('请填写工号和用户名'); return; }
      dialog.loading = true;
      setTimeout(() => {
        if (dialog.isEdit) {
          const idx = DB.users.findIndex(u => u.id === dialog.form.id);
          if (idx >= 0) Object.assign(DB.users[idx], dialog.form, { updated_at: nowISO() });
        } else {
          const newId = Math.max(...DB.users.map(u => u.id), 0) + 1;
          const role = DB.roles.find(r => r.id === dialog.form.role_id);
          DB.users.push({ ...dialog.form, id: newId, data_source: 'manual', sync_time: null, created_at: nowISO(), updated_at: nowISO(), role_code: role ? role.role_code : '', role_name: role ? role.role_name : '' });
        }
        dialog.loading = false;
        dialog.visible = false;
        ElementPlus.ElMessage.success('保存成功');
        fetchData();
      }, 300);
    };
    const handleDisable = (row) => {
      ElementPlus.ElMessageBox.confirm('确认' + (row.is_active ? '停用' : '启用') + '用户「' + row.real_name + '」？', '提示', { type: 'warning' }).then(() => {

      }).catch(() => {});
    };
    const handleSync = () => {
      ElementPlus.ElMessage.success('同步完成（演示），新增 0 条用户记录');
    };

    onMounted(() => { fetchData(); });
    return { tableData, total, loading, keyword, dialog, roleList, getRoleName,
      fetchData, handleAdd, handleEdit, saveUser, handleDisable, handleSync, formatDate };
  },

        let list = DB.tags.slice();

      dialog.isEdit = false;
      dialog.form = { id: null, tag_name: '', tag_category: '', sort_order: 0, is_active: 1 };

      dialog.form = { ...row };
      dialog.visible = true;
    };

      if (!dialog.form.tag_name) { ElementPlus.ElMessage.warning('请填写标签名称'); return; }

const MainLayout = {
  components: { ScreeningPage, ManagementPage, CompletionPage, SystemUsersPage, SystemRolesPage, SystemTagsPage, SystemMuscleConfigPage },
  props: { currentUser: Object },
  emits: ['logout'],
  setup(props, { emit }) {
    const currentPage = ref('screening');

    const menuItems = computed(() => {
      const items = [
        { path: 'screening', title: '病人筛查', roles: ['DOCTOR', 'MANAGER', 'ADMIN'] },
        { path: 'management', title: '病人管理', roles: ['DOCTOR', 'MANAGER', 'ADMIN'] },
        { path: 'completion', title: '病人完成', roles: ['DOCTOR', 'MANAGER', 'ADMIN'] },
      ];
      if (props.currentUser && props.currentUser.role === 'ADMIN') {
        items.push({ path: 'system', title: '系统管理', roles: ['ADMIN'], children: [
          { path: 'system/users', title: '用户管理' },
          { path: 'system/roles', title: '岗位权限配置' },
          { path: 'system/tags', title: '标签配置' },
          { path: 'system/muscle-config', title: '位面与部位配置' },
        ]});
      }
      return items;
    });

    const displayName = computed(() => {
      if (!props.currentUser) return '未登录';
      return props.currentUser.userInfo.realName || props.currentUser.userInfo.ysdm || '未登录';
    });

    const handleLogout = () => {
      ElementPlus.ElMessageBox.confirm('确定要退出登录吗？', '提示', { type: 'warning' }).then(() => {
        emit('logout');
      }).catch(() => {});
    };

    const systemSubPage = ref('system/users');
    const handleMenuSelect = (path) => {
      if (path.startsWith('system/')) {
        currentPage.value = 'system';
        systemSubPage.value = path;
      } else {
        currentPage.value = path;
      }
    };

    return { currentPage, menuItems, displayName, handleLogout, systemSubPage, handleMenuSelect };
  },
  template: `
  <el-container class="main-container">
    <el-header class="app-header">
      <div class="app-title">浮针治疗管理系统</div>
      <div class="header-right">
        <span class="username">{{ displayName }}</span>
        <span v-if="currentUser" style="color:#909399;font-size:12px;">({{ currentUser.roleName }})</span>
        <span class="logout-btn" @click="handleLogout">退出登录</span>
      </div>
    </el-header>
    <el-container>
      <el-aside class="app-aside">
        <el-menu :default-active="currentPage.startsWith('system') ? systemSubPage : currentPage" @select="handleMenuSelect">
          <template v-for="item in menuItems" :key="item.path">
            <el-sub-menu v-if="item.children" :index="item.path">
              <template #title><span>{{ item.title }}</span></template>
              <el-menu-item v-for="c in item.children" :key="c.path" :index="c.path">{{ c.title }}</el-menu-item>
            </el-sub-menu>
            <el-menu-item v-else :index="item.path">{{ item.title }}</el-menu-item>
          </template>
        </el-menu>
      </el-aside>
      <el-main class="app-main">
        <component v-if="currentPage === 'screening'" :is="'ScreeningPage'" />
        <component v-else-if="currentPage === 'management'" :is="'ManagementPage'" />
        <component v-else-if="currentPage === 'completion'" :is="'CompletionPage'" />
        <template v-else-if="currentPage === 'system'">
          <system-users-page v-if="systemSubPage === 'system/users'" />
          <system-roles-page v-else-if="systemSubPage === 'system/roles'" />
          <system-tags-page v-else-if="systemSubPage === 'system/tags'" />
          <system-muscle-config-page v-else-if="systemSubPage === 'system/muscle-config'" />
        </template>
      </el-main>
    </el-container>
  </el-container>`,
};

/* ---------- 根组件 ---------- */
const App = {
  components: { LoginPage, MainLayout },
  setup() {
    const currentUser = ref(null);
    const handleLogin = (result) => {
      DB.currentUser = result;
      currentUser.value = result;
    };
    const handleLogout = () => {
      DB.currentUser = null;
      currentUser.value = null;
      ElementPlus.ElMessage.success('已退出登录');
    };
    return { currentUser, handleLogin, handleLogout };
  },
  template: `
  <login-page v-if="!currentUser" @login="handleLogin" />
  <main-layout v-else :current-user="currentUser" @logout="handleLogout" />`,
};

/* ---------- 挂载应用 ---------- */
const app = createApp(App);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
