<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOPC - AI运营控制面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #1a1a24;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --accent-tertiary: #f472b6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 背景效果 */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(139, 92, 246, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(6, 182, 212, 0.12), transparent),
                radial-gradient(ellipse 50% 30% at 50% 80%, rgba(244, 114, 182, 0.1), transparent);
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        /* 卡片样式 */
        .card {
            background: linear-gradient(135deg, rgba(26, 26, 36, 0.9) 0%, rgba(17, 17, 24, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.1);
        }
        
        .card-glow {
            position: relative;
            overflow: hidden;
        }
        
        .card-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.1), transparent 30%);
            animation: rotate 4s linear infinite;
        }
        
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        
        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-secondary);
        }
        
        /* 状态指示器 */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 商品卡片 */
        .product-card {
            background: rgba(26, 26, 36, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-4px);
        }
        
        .product-card.selected {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        /* 笔记预览 */
        .note-preview {
            background: linear-gradient(180deg, #fff9f0 0%, #fff5e6 100%);
            border-radius: 12px;
            padding: 20px;
            color: #333;
            position: relative;
        }
        
        .note-preview::before {
            content: '小红书笔记预览';
            position: absolute;
            top: -10px;
            left: 20px;
            background: linear-gradient(135deg, #ff2442, #ff6b81);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* 数据指标 */
        .metric-card {
            background: rgba(26, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            border-color: var(--accent-tertiary);
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* 动画 */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in-left {
            animation: slideInLeft 0.6s ease forwards;
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .slide-in-right {
            animation: slideInRight 0.6s ease forwards;
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
        
        /* AI回复气泡 */
        .ai-bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px 16px 16px 4px;
            padding: 12px 16px;
            margin-bottom: 8px;
            animation: bubbleIn 0.3s ease;
        }
        
        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* 标签样式 */
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tag-purple {
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-primary);
        }
        
        .tag-cyan {
            background: rgba(6, 182, 212, 0.2);
            color: var(--accent-secondary);
        }
        
        .tag-pink {
            background: rgba(244, 114, 182, 0.2);
            color: var(--accent-tertiary);
        }
        
        /* 进度条 */
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1s ease;
        }
        
        /* 推荐卡片 */
        .recommend-card {
            background: rgba(26, 26, 36, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }
        
        .recommend-card:hover {
            border-color: var(--accent-primary);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="noise-overlay"></div>
    
    <div class="relative z-10 min-h-screen p-6">
        <!-- 顶部导航 -->
        <header class="flex items-center justify-between mb-8 fade-in">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-cyan-500 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold gradient-text">AIOPC</h1>
                        <p class="text-xs text-slate-400">AI运营控制面板 · 智能推广引擎</p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <span class="status-dot bg-emerald-400"></span>
                    <span class="text-sm text-slate-300">小程序已连接</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-dot bg-emerald-400"></span>
                    <span class="text-sm text-slate-300">小红书已授权</span>
                </div>
                <div class="text-sm text-slate-400">
                    <span id="currentTime"></span>
                </div>
            </div>
        </header>
        
        <!-- 主内容区 -->
        <div class="grid grid-cols-12 gap-6">
            <!-- 左侧：商品列表 -->
            <div class="col-span-3 slide-in-left">
                <div class="card p-5 h-[calc(100vh-140px)] flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                            </svg>
                            商品列表
                        </h2>
                        <span class="tag tag-purple">共1件</span>
                    </div>
                    
                    <div class="mb-4">
                        <div class="relative">
                            <input type="text" id="productSearch" placeholder="搜索商品..." 
                                class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition-colors">
                            <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto space-y-3" id="productList">
                        <!-- 商品卡片会通过JS动态生成 -->
                    </div>
                </div>
            </div>
            
            <!-- 中间：笔记生成 -->
            <div class="col-span-5 fade-in" style="animation-delay: 0.2s">
                <div class="card p-5 h-[calc(100vh-140px)] flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            笔记生成
                        </h2>
                        <div class="flex gap-2">
                            <button onclick="generateNote()" class="btn-primary text-sm flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                                </svg>
                                AI生成
                            </button>
                            <button onclick="publishNote()" class="btn-secondary text-sm flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                                </svg>
                                发布
                            </button>
                        </div>
                    </div>
                    
                    <!-- 选中商品信息 -->
                    <div id="selectedProduct" class="mb-4 p-4 bg-black/30 rounded-xl border border-purple-500/30 hidden">
                        <div class="flex gap-4">
                            <img id="selectedProductImg" src="" alt="" class="w-20 h-20 rounded-lg object-cover">
                            <div class="flex-1">
                                <h3 id="selectedProductName" class="font-semibold text-white mb-1"></h3>
                                <div class="flex items-center gap-3 text-sm">
                                    <span class="text-emerald-400 font-bold" id="selectedProductPrice"></span>
                                    <span class="text-slate-400 line-through" id="selectedProductOriginalPrice"></span>
                                </div>
                                <p class="text-xs text-slate-500 mt-1" id="selectedProductSpecs"></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 生成的笔记内容 -->
                    <div class="flex-1 overflow-y-auto">
                        <div class="note-preview min-h-[300px]">
                            <div class="mb-4">
                                <input type="text" id="noteTitle" placeholder="笔记标题..." 
                                    class="w-full bg-transparent border-b border-gray-300 text-lg font-bold py-2 focus:outline-none placeholder-gray-400">
                            </div>
                            <textarea id="noteContent" placeholder="AI生成的笔记内容会显示在这里..." 
                                class="w-full bg-transparent min-h-[200px] text-base leading-relaxed focus:outline-none resize-none placeholder-gray-400"></textarea>
                            <div id="noteTags" class="mt-4 flex flex-wrap gap-2">
                                <!-- 标签会动态生成 -->
                            </div>
                        </div>
                        
                        <!-- 发布状态 -->
                        <div id="publishStatus" class="mt-4 p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl hidden">
                            <div class="flex items-center gap-3">
                                <span class="status-dot bg-emerald-400"></span>
                                <span class="text-emerald-400 font-medium">笔记发布成功！</span>
                            </div>
                            <p class="text-sm text-slate-400 mt-2">笔记已同步到小红书，等待审核...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧：数据看板 -->
            <div class="col-span-4 slide-in-right">
                <div class="card p-5 h-[calc(100vh-140px)] flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                            数据看板
                        </h2>
                        <select class="bg-black/30 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                            <option>最近7天</option>
                            <option>最近30天</option>
                            <option>全部</option>
                        </select>
                    </div>
                    
                    <!-- 核心指标 -->
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="metric-card">
                            <div class="text-slate-400 text-sm mb-1">浏览量</div>
                            <div class="metric-value gradient-text" id="metricViews">0</div>
                            <div class="flex items-center justify-center gap-1 mt-1 text-xs text-emerald-400">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                                </svg>
                                <span>+0%</span>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="text-slate-400 text-sm mb-1">点赞数</div>
                            <div class="metric-value text-pink-400" id="metricLikes">0</div>
                            <div class="flex items-center justify-center gap-1 mt-1 text-xs text-emerald-400">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                                </svg>
                                <span>+0%</span>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="text-slate-400 text-sm mb-1">收藏数</div>
                            <div class="metric-value text-cyan-400" id="metricFavorites">0</div>
                            <div class="flex items-center justify-center gap-1 mt-1 text-xs text-emerald-400">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                                </svg>
                                <span>+0%</span>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="text-slate-400 text-sm mb-1">评论数</div>
                            <div class="metric-value text-yellow-400" id="metricComments">0</div>
                            <div class="flex items-center justify-center gap-1 mt-1 text-xs text-emerald-400">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                                </svg>
                                <span>+0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 趋势图表 -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-slate-300 mb-3">数据趋势</h3>
                        <div class="h-32 flex items-end gap-1">
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 45%"></div>
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 60%"></div>
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 35%"></div>
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 80%"></div>
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 55%"></div>
                            <div class="flex-1 bg-gradient-to-t from-purple-500/30 to-purple-500/5 rounded-t" style="height: 70%"></div>
                            <div class="flex-1 bg-gradient-to-t from-cyan-500/50 to-cyan-500/10 rounded-t relative" style="height: 95%">
                                <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-cyan-400 rounded-full"></div>
                            </div>
                        </div>
                        <div class="flex justify-between mt-2 text-xs text-slate-500">
                            <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
                        </div>
                    </div>
                    
                    <!-- AI自动回复 -->
                    <div class="flex-1 overflow-hidden">
                        <h3 class="text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
                            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                            </svg>
                            AI智能回复
                        </h3>
                        <div class="space-y-2 max-h-[200px] overflow-y-auto" id="aiReplies">
                            <!-- AI回复会动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部：AI智能推荐 -->
        <div class="mt-6 fade-in" style="animation-delay: 0.4s">
            <div class="card p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                        AI智能推荐 · 需求趋势分析
                    </h2>
                    <div class="flex items-center gap-2">
                        <span class="tag tag-cyan">7月高发</span>
                        <span class="tag tag-pink">节日热点</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-4 gap-4" id="recommendations">
                    <!-- 推荐卡片会动态生成 -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 商品数据 - 来自D:\items\美妆产品1
        // 图片将通过API加载
        
        const products = [
            {
                id: 1,
                name: '83%双重酵萃 酵萃护肤神仙水精华露190ml',
                price: '¥99',
                originalPrice: '¥299',
                freight: '免运费',
                specs: '精华露190ml',
                service: '本品不支持退换',
                unshipped: '无',
                sales: 0,
                tags: ['美妆', '护肤', '精华'],
                images: [] // 从API加载
            }
        ];
        
        // 从API加载图片
        async function loadProductImages() {
            try {
                const resp = await fetch('http://localhost:5000/api/top-images');
                const images = await resp.json();
                if (products[0]) products[0].images = images;
                renderProducts();
                if (selectedProductId) selectProduct(selectedProductId);
            } catch (e) {
                console.log('图片加载失败，使用占位图');
            }
        }
        
        // AI回复数据
        const aiRepliesData = [
            { user: '小红书用户****', comment: '这款神仙水真的好用吗？', reply: '亲，这款83%双重酵萃神仙水超级好用的！富含酵母精华，深层补水保湿，使用后皮肤明显变得光滑细腻～' },
            { user: '小红书用户****', comment: '价格还能再优惠吗？', reply: '亲，当前秒杀价¥99已经是全网最低了，还能免运费！喜欢的话赶紧下单哦～' },
            { user: '小红书用户****', comment: '敏感肌能用吗？', reply: '亲，这款神仙水配方温和，不含酒精香精，敏感肌也可以使用哦～建议先做局部测试！' },
            { user: '小红书用户****', comment: '190ml能用多久？', reply: '亲，正常早晚使用的话，190ml大概可以用2-3个月左右，性价比很高哦～' }
        ];
        
        // AI推荐数据
        const recommendationsData = [
            { season: '夏季热点', icon: '☀️', title: '护肤保湿', desc: '夏季空调房肌肤干燥，精华水需求上涨280%', trend: 'up', products: ['神仙水', '精华液', '保湿霜'] },
            { season: '节日热点', icon: '🎋', title: '七夕将至', desc: '还有30天，情侣美妆礼盒、护肤套装开始预热', trend: 'up', products: ['护肤礼盒', '美妆套装', '香水'] },
            { season: '养宠热点', icon: '🐱', title: '美妆达人', desc: '年轻人护肤意识增强，美妆类搜索量上涨200%', trend: 'up', products: ['神仙水', '面膜', '精华'] },
            { season: '宅家热点', icon: '🏠', title: '精致护肤', desc: '宅家护肤成为趋势，家用美容仪、神仙水销量攀升', trend: 'up', products: ['神仙水', '美容仪', '面膜'] }
        ];
        
        let selectedProductId = null;
        
        // 初始化
        function init() {
            renderProducts();
            renderAIRepplies();
            renderRecommendations();
            updateTime();
            setInterval(updateTime, 1000);
            animateMetrics();
            loadProductImages();
        }
        
        // 更新时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentTime').textContent = timeStr;
        }
        
        // 渲染商品列表
        function renderProducts() {
            const container = document.getElementById('productList');
            container.innerHTML = products.map((p, index) => `
                <div class="product-card ${selectedProductId === p.id ? 'selected' : ''}" onclick="selectProduct(${p.id})" style="animation-delay: ${index * 0.05}s">
                    <div class="flex gap-3">
                        <img src="${p.images[0] || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22>商品图片</text></svg>'}" alt="${p.name}" class="w-16 h-16 rounded-lg object-cover">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-sm truncate">${p.name}</h4>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-emerald-400 font-bold text-sm">${p.price}</span>
                                <span class="text-slate-500 line-through text-xs">${p.originalPrice}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                ${p.tags.slice(0, 2).map(t => `<span class="tag tag-purple text-xs">${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs text-slate-500">
                        <span>销量 ${p.sales}</span>
                        <span>${p.freight}</span>
                    </div>
                </div>
            `).join('');
        }
        
        // 选择商品
        function selectProduct(id) {
            selectedProductId = id;
            renderProducts();
            
            const product = products.find(p => p.id === id);
            const selectedDiv = document.getElementById('selectedProduct');
            
            document.getElementById('selectedProductImg').src = product.images[0] || '';
            document.getElementById('selectedProductName').textContent = product.name;
            document.getElementById('selectedProductPrice').textContent = product.price;
            document.getElementById('selectedProductOriginalPrice').textContent = product.originalPrice;
            document.getElementById('selectedProductSpecs').textContent = product.specs;
            
            selectedDiv.classList.remove('hidden');
            selectedDiv.classList.add('fade-in');
        }
        
        // AI生成笔记
        function generateNote() {
            if (!selectedProductId) {
                alert('请先选择一个商品');
                return;
            }
            
            const product = products.find(p => p.id === selectedProductId);
            
            // 模拟AI生成
            const titleTemplates = [
                `挖到宝了！${product.tags[0]}党必入这款${product.name.split(' ')[0]}`,
                `后悔没早点买！夏天必备的${product.tags[0]}好物分享`,
                `室友问链接！这款${product.name.split(' ')[0]}绝了`,
                `真香警告！这款${product.tags[0]}也太好用了吧`,
                `私藏已久的${product.tags[0]}好物，终于舍得分享了`
            ];
            
            const contentTemplates = [
                `夏天来了，作为${product.tags[0]}爱好者，今天必须给大家安利这款${product.name}！
                
之前也买过不少同类的，但这款真的让我眼前一亮！

✨亮点一：${product.specs.split(' / ')[0]}
✨亮点二：${product.specs.split(' / ')[1] || '性价比超高'}
✨亮点三：${product.service}

价格方面，原价${product.originalPrice}，现在只要${product.price}，还能${product.freight}！

已经下单了两件，一件自用一件送闺蜜～

#${product.tags[0]}# #好物分享# #种草清单# #夏日必备#`,
                
                `作为一个${product.tags[0] + product.tags[1] || product.tags[0]}达人，今天来分享一款最近超爱用的${product.name.split(' ')[0]}！

说实话，之前一直觉得这类产品都是智商税，直到闺蜜给我安利了这款...

✅使用感受：${product.specs.split(' / ')[0]}
✅价格方面：${product.price}（${product.freight}）
✅服务保障：${product.service}

不得不说，现在国货真的越做越好了！${product.unshipped !== '无' ? `不过要注意哦，${product.unshipped}地区暂时不发货～` : ''}

喜欢的姐妹赶紧冲！`                
            ];
            
            const title = titleTemplates[Math.floor(Math.random() * titleTemplates.length)];
            const content = contentTemplates[Math.floor(Math.random() * contentTemplates.length)];
            const tags = [`#${product.tags[0]}`, '#好物分享', '#种草清单', '#私藏好物', '#夏日必备', '#购物分享'].slice(0, 4);
            
            document.getElementById('noteTitle').value = title;
            document.getElementById('noteContent').value = content;
            
            const tagsContainer = document.getElementById('noteTags');
            tagsContainer.innerHTML = tags.map((t, i) => `
                <span class="tag" style="background: rgba(255,82,82,0.15); color: #ff5252; animation-delay: ${i * 0.1}s" style="animation: fadeIn 0.3s ease forwards">${t}</span>
            `).join('');
        }
        
        // 发布笔记
        function publishNote() {
            const title = document.getElementById('noteTitle').value;
            if (!title) {
                alert('请先生成笔记内容');
                return;
            }
            
            const statusDiv = document.getElementById('publishStatus');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-emerald-400 font-medium">正在发布笔记...</span>
                </div>
                <p class="text-sm text-slate-400 mt-2">正在同步到小红书平台</p>
            `;
            
            setTimeout(() => {
                statusDiv.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="status-dot bg-emerald-400"></span>
                        <span class="text-emerald-400 font-medium">笔记发布成功！</span>
                    </div>
                    <p class="text-sm text-slate-400 mt-2">笔记已同步到小红书，审核中...</p>
                `;
                
                // 更新数据
                setTimeout(() => {
                    document.getElementById('metricViews').textContent = '+128';
                    document.getElementById('metricLikes').textContent = '+24';
                    document.getElementById('metricFavorites').textContent = '+8';
                    document.getElementById('metricComments').textContent = '+3';
                }, 1500);
            }, 2000);
        }
        
        // 渲染AI回复
        function renderAIRepplies() {
            const container = document.getElementById('aiReplies');
            container.innerHTML = aiRepliesData.map((r, i) => `
                <div class="ai-bubble" style="animation-delay: ${i * 0.15}s">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs text-slate-400">${r.user}</span>
                        <span class="text-xs text-purple-400">说：</span>
                    </div>
                    <p class="text-sm text-slate-300">${r.comment}</p>
                    <div class="mt-2 pt-2 border-t border-purple-500/20">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs text-cyan-400">🤖 AI回复：</span>
                        </div>
                        <p class="text-sm text-white">${r.reply}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // 渲染推荐
        function renderRecommendations() {
            const container = document.getElementById('recommendations');
            container.innerHTML = recommendationsData.map((r, i) => `
                <div class="recommend-card" style="animation: fadeIn 0.5s ease ${i * 0.1}s forwards; opacity: 0">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-3xl">${r.icon}</span>
                        <div>
                            <span class="tag tag-purple text-xs mb-1">${r.season}</span>
                            <h3 class="font-semibold">${r.title}</h3>
                        </div>
                    </div>
                    <p class="text-sm text-slate-400 mb-3">${r.desc}</p>
                    <div class="flex items-center gap-2">
                        ${r.products.map(p => `<span class="text-xs bg-black/30 px-2 py-1 rounded text-slate-300">${p}</span>`).join('')}
                    </div>
                    <div class="mt-3 flex items-center gap-2">
                        <span class="text-xs text-emerald-400 flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                            </svg>
                            需求上涨
                        </span>
                        <span class="text-xs text-slate-500">|</span>
                        <span class="text-xs text-cyan-400">建议重点推广</span>
                    </div>
                </div>
            `).join('');
        }
        
        // 指标动画
        function animateMetrics() {
            const metrics = {
                views: 12580,
                likes: 2341,
                favorites: 892,
                comments: 156
            };
            
            setTimeout(() => {
                animateValue('metricViews', metrics.views);
                animateValue('metricLikes', metrics.likes);
                animateValue('metricFavorites', metrics.favorites);
                animateValue('metricComments', metrics.comments);
            }, 500);
        }
        
        function animateValue(id, target) {
            const el = document.getElementById(id);
            let current = 0;
            const step = Math.ceil(target / 30);
            const timer = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.textContent = current.toLocaleString();
            }, 30);
        }
        
        // 搜索功能
        document.getElementById('productSearch').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(keyword) || 
                p.tags.some(t => t.toLowerCase().includes(keyword))
            );
            
            const container = document.getElementById('productList');
            if (keyword === '') {
                renderProducts();
            } else {
                container.innerHTML = filtered.map((p) => `
                    <div class="product-card ${selectedProductId === p.id ? 'selected' : ''}" onclick="selectProduct(${p.id})">
                        <div class="flex gap-3">
                            <img src="${p.image}" alt="${p.name}" class="w-16 h-16 rounded-lg object-cover">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-medium text-sm truncate">${p.name}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-emerald-400 font-bold text-sm">${p.price}</span>
                                    <span class="text-slate-500 line-through text-xs">${p.originalPrice}</span>
                                </div>
                                <div class="flex items-center gap-2 mt-2">
                                    ${p.tags.slice(0, 2).map(t => `<span class="tag tag-purple text-xs">${t}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        });
        
        // 启动
        init();
    </script>
</body>
</html>
