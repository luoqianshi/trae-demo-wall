<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>API Key 配置检查 - 语策军师</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { font-size: 1.25rem; color: #1E293B; }
    .card { border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; margin: 16px 0; background: #fff; }
    .ok { color: #2A9D8F; font-weight: 600; }
    .warn { color: #F59E0B; font-weight: 600; }
    .err { color: #EF4444; font-weight: 600; }
    code { background: #F1F5F9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F1F5F9; }
    .row:last-child { border-bottom: none; }
    .label { color: #64748B; }
    .value { font-weight: 600; }
    a { color: #2A9D8F; }
  </style>
</head>
<body>
  <h1>语策军师 · API Key 配置检查</h1>
  <div id="result">正在检查...</div>

  <script>
    (function() {
      const providers = JSON.parse(localStorage.getItem('ycjs_providers') || '[]');
      const ark = providers.find(p => p.name.includes('火山'));
      const active = providers.find(p => p.enabled && p.apiKey);

      let html = '';

      // 总体状态
      if (active && active.name.includes('火山')) {
        html += '<div class="card"><span class="ok">配置正常</span> — 火山引擎 Ark 已启用且 API Key 已设置</div>';
      } else if (ark && ark.apiKey) {
        html += '<div class="card"><span class="warn">部分配置</span> — API Key 已保存但未启用（enabled=false）</div>';
      } else if (ark) {
        html += '<div class="card"><span class="err">未配置</span> — 火山引擎 Ark 存在但 API Key 为空</div>';
      } else {
        html += '<div class="card"><span class="err">未配置</span> — 未找到火山引擎 Ark 配置</div>';
      }

      // 详细配置
      html += '<div class="card"><h3>详细配置</h3>';
      if (ark) {
        html += '<div class="row"><span class="label">服务商</span><span class="value">' + ark.name + '</span></div>';
        html += '<div class="row"><span class="label">模型</span><span class="value">' + ark.model + '</span></div>';
        html += '<div class="row"><span class="label">API Key</span><span class="value">' + (ark.apiKey ? ark.apiKey.substring(0, 20) + '...' : '<span class="err">未设置</span>') + '</span></div>';
        html += '<div class="row"><span class="label">启用状态</span><span class="value">' + (ark.enabled ? '<span class="ok">已启用</span>' : '<span class="warn">未启用</span>') + '</span></div>';
        html += '<div class="row"><span class="label">baseUrl</span><span class="value">' + ark.baseUrl + '</span></div>';
      } else {
        html += '<p>未找到火山引擎配置</p>';
      }
      html += '</div>';

      // 所有服务商概览
      html += '<div class="card"><h3>所有服务商</h3>';
      if (providers.length === 0) {
        html += '<p>未配置任何服务商</p>';
      } else {
        providers.forEach(p => {
          const status = p.enabled && p.apiKey ? '<span class="ok">可用</span>' : (p.apiKey ? '<span class="warn">有Key未启用</span>' : '<span class="err">无Key</span>');
          html += '<div class="row"><span class="label">' + p.name + '</span><span class="value">' + status + '</span></div>';
        });
      }
      html += '</div>';

      html += '<p><a href="index.html">返回应用</a></p>';
      document.getElementById('result').innerHTML = html;
    })();
  </script>
</body>
</html>
