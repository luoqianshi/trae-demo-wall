<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语策军师 · 对话上下文 AI 辅助网页工具</title>
  <meta name="description" content="记忆全部对话，读懂言外之意。为社恐年轻人、职场新人和不善表达者，提供真正理解上下文的 AI 沟通辅助。">

  <!-- 字体加载 -->
  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('../yucejunshi/_shared/fonts/Outfit-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Outfit';
      src: url('../yucejunshi/_shared/fonts/Outfit-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('../yucejunshi/_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('../yucejunshi/_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'JetBrainsMono';
      src: url('../yucejunshi/_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
  </style>

  <!-- 内联完整 CSS -->
  <style>
    /* ============================================================
       设计令牌 (Design Tokens) — M6
       ============================================================ */
    :root {
      /* 背景色 */
      --ycjs-bg: #FDF8F3;
      --ycjs-bg-card: #FFFFFF;
      --ycjs-bg-hover: #F5F0EB;
      --ycjs-bg-bubble-me: #E0F2F1;
      --ycjs-bg-bubble-other: #FFFFFF;

      /* 文字色 */
      --ycjs-text-primary: #1E293B;
      --ycjs-text-secondary: #64748B;
      --ycjs-text-muted: #94A3B8;

      /* 边框 */
      --ycjs-border: #E2E8F0;
      --ycjs-border-focus: #2A9D8F;

      /* 主色调 — 青绿 */
      --ycjs-primary: #2A9D8F;
      --ycjs-primary-hover: #248A7E;
      --ycjs-primary-light: #E0F2F1;

      /* 辅助色 — 紫 */
      --ycjs-accent: #9B7EDE;
      --ycjs-accent-light: #F3E8FF;

      /* 功能色 */
      --ycjs-success: #2A9D8F;
      --ycjs-warning: #F59E0B;
      --ycjs-error: #EF4444;
      --ycjs-info: #3B82F6;

      /* 字体 */
      --ycjs-font-display: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --ycjs-font-body: 'InstrumentSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --ycjs-font-mono: 'JetBrainsMono', 'SF Mono', monospace;

      /* 字号 */
      --ycjs-text-xs: 0.75rem;
      --ycjs-text-sm: 0.875rem;
      --ycjs-text-base: 1rem;
      --ycjs-text-lg: 1.125rem;
      --ycjs-text-xl: 1.25rem;
      --ycjs-text-2xl: 1.5rem;
      --ycjs-text-3xl: 2rem;

      /* 间距 */
      --ycjs-space-1: 0.25rem;
      --ycjs-space-2: 0.5rem;
      --ycjs-space-3: 0.75rem;
      --ycjs-space-4: 1rem;
      --ycjs-space-5: 1.25rem;
      --ycjs-space-6: 1.5rem;
      --ycjs-space-8: 2rem;
      --ycjs-space-10: 2.5rem;
      --ycjs-space-12: 3rem;

      /* 圆角 */
      --ycjs-radius-sm: 6px;
      --ycjs-radius-md: 10px;
      --ycjs-radius-lg: 14px;
      --ycjs-radius-xl: 16px;
      --ycjs-radius-full: 999px;

      /* 阴影 */
      --ycjs-shadow-sm: 0 1px 2px rgba(30, 41, 59, 0.05);
      --ycjs-shadow-md: 0 4px 14px rgba(42, 157, 143, 0.3);
      --ycjs-shadow-lg: 0 12px 40px rgba(30, 41, 59, 0.1);

      /* 布局尺寸 */
      --ycjs-sidebar-width: 240px;
      --ycjs-header-height: 56px;
      --ycjs-input-height: 140px;
    }

    /* ============================================================
       Reset & Base
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--ycjs-font-body);
      color: var(--ycjs-text-primary);
      background: var(--ycjs-bg);
      line-height: 1.75;
      overflow: hidden;
      height: 100vh;
    }
    button { cursor: pointer; font-family: inherit; }
    input, textarea { font-family: inherit; }
    ::selection { background: var(--ycjs-primary-light); color: var(--ycjs-primary); }

    /* ============================================================
       动画关键帧
       ============================================================ */
    @keyframes ycjsSlideUpFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ycjsSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ycjsFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 尊重减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ============================================================
       整体布局
       ============================================================ */
    .ycjs-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* --- Header --- */
    .ycjs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--ycjs-header-height);
      padding: 0 var(--ycjs-space-6);
      background: var(--ycjs-bg-card);
      border-bottom: 1px solid var(--ycjs-border);
      flex-shrink: 0;
      z-index: 100;
    }
    .ycjs-header__left {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-3);
    }
    .ycjs-header__logo {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-xl);
      font-weight: 700;
      color: var(--ycjs-primary);
      letter-spacing: -0.02em;
    }
    .ycjs-header__subtitle {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
    }
    .ycjs-header__right {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
    }
    /* 汉堡菜单按钮（仅移动端可见） */
    .ycjs-header__menu-btn {
      display: none;
      background: none;
      border: none;
      padding: var(--ycjs-space-2);
      color: var(--ycjs-text-secondary);
    }
    .ycjs-header__menu-btn:hover {
      color: var(--ycjs-text-primary);
    }

    /* --- Main Content Area --- */
    .ycjs-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* --- Sidebar --- */
    .ycjs-sidebar {
      width: var(--ycjs-sidebar-width);
      background: var(--ycjs-bg-card);
      border-right: 1px solid var(--ycjs-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .ycjs-sidebar__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--ycjs-space-4);
      border-bottom: 1px solid var(--ycjs-border);
    }
    .ycjs-sidebar__title {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-sm);
      font-weight: 700;
      color: var(--ycjs-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ycjs-sidebar__new-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--ycjs-space-1);
      padding: var(--ycjs-space-2) var(--ycjs-space-3);
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
      color: var(--ycjs-primary);
      background: var(--ycjs-primary-light);
      border: none;
      border-radius: var(--ycjs-radius-sm);
      transition: all 0.2s ease;
    }
    .ycjs-sidebar__new-btn:hover {
      background: var(--ycjs-primary);
      color: #fff;
      transform: translateY(-1px);
    }
    .ycjs-session-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--ycjs-space-2);
    }

    /* 会话列表项 */
    .ycjs-session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--ycjs-space-3) var(--ycjs-space-4);
      border-radius: var(--ycjs-radius-md);
      cursor: pointer;
      transition: background 0.15s ease;
      margin-bottom: var(--ycjs-space-1);
    }
    .ycjs-session-item:hover {
      background: var(--ycjs-bg-hover);
    }
    .ycjs-session-item--active {
      background: var(--ycjs-primary-light);
      border-left: 3px solid var(--ycjs-primary);
    }
    .ycjs-session-item__content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-1);
    }
    .ycjs-session-item__title {
      font-size: var(--ycjs-text-sm);
      font-weight: 600;
      color: var(--ycjs-text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ycjs-session-item__time {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
    }
    .ycjs-session-item__delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--ycjs-text-muted);
      padding: var(--ycjs-space-1);
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .ycjs-session-item:hover .ycjs-session-item__delete {
      opacity: 1;
    }
    .ycjs-session-item__delete:hover {
      color: var(--ycjs-error);
    }
    .ycjs-session-empty {
      padding: var(--ycjs-space-6);
      text-align: center;
      color: var(--ycjs-text-muted);
      font-size: var(--ycjs-text-sm);
    }

    /* --- Content Panels --- */
    .ycjs-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 聊天面板 */
    .ycjs-chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--ycjs-border);
      min-width: 0;
    }
    .ycjs-chat-panel__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      padding: var(--ycjs-space-4) var(--ycjs-space-6);
      border-bottom: 1px solid var(--ycjs-border);
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-sm);
      font-weight: 700;
      color: var(--ycjs-text-secondary);
      flex-shrink: 0;
    }
    #ycjs-chat-panel {
      flex: 1;
      overflow-y: auto;
      padding: var(--ycjs-space-6);
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-3);
    }

    /* AI 面板 */
    .ycjs-ai-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .ycjs-ai-panel__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      padding: var(--ycjs-space-4) var(--ycjs-space-6);
      border-bottom: 1px solid var(--ycjs-border);
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-sm);
      font-weight: 700;
      color: var(--ycjs-text-secondary);
      flex-shrink: 0;
    }
    #ycjs-ai-panel {
      flex: 1;
      overflow-y: auto;
      padding: var(--ycjs-space-6);
    }

    /* --- Input Area --- */
    .ycjs-input-area-wrapper {
      background: var(--ycjs-bg-card);
      border-top: 1px solid var(--ycjs-border);
      padding: var(--ycjs-space-4) var(--ycjs-space-6);
      flex-shrink: 0;
    }
    .ycjs-input-area-wrapper__inner {
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-3);
      max-width: 100%;
    }
    .ycjs-input-area {
      width: 100%;
      min-height: var(--ycjs-input-height);
      max-height: 240px;
      padding: var(--ycjs-space-4);
      border: 1.5px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-lg);
      font-size: var(--ycjs-text-base);
      color: var(--ycjs-text-primary);
      background: var(--ycjs-bg);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      line-height: 1.6;
    }
    .ycjs-input-area:focus {
      border-color: var(--ycjs-border-focus);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.15);
    }
    .ycjs-input-area::placeholder {
      color: var(--ycjs-text-muted);
    }
    .ycjs-input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ycjs-input-actions__hint {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
    }
    .ycjs-input-actions__btns {
      display: flex;
      gap: var(--ycjs-space-2);
    }

    /* ============================================================
       公共组件 — Button
       ============================================================ */
    .ycjs-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      padding: var(--ycjs-space-2) var(--ycjs-space-4);
      border: none;
      border-radius: var(--ycjs-radius-sm);
      font-size: var(--ycjs-text-sm);
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .ycjs-btn--primary {
      background: var(--ycjs-primary);
      color: #fff;
      box-shadow: var(--ycjs-shadow-md);
    }
    .ycjs-btn--primary:hover {
      background: var(--ycjs-primary-hover);
      transform: translateY(-1px);
    }
    .ycjs-btn--primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .ycjs-btn--secondary {
      background: transparent;
      color: var(--ycjs-text-primary);
      border: 1.5px solid var(--ycjs-border);
    }
    .ycjs-btn--secondary:hover {
      border-color: var(--ycjs-primary);
      color: var(--ycjs-primary);
    }
    .ycjs-btn--ghost {
      background: transparent;
      color: var(--ycjs-text-secondary);
      border: 1.5px solid var(--ycjs-border);
    }
    .ycjs-btn--ghost:hover {
      background: var(--ycjs-bg-hover);
      border-color: var(--ycjs-primary);
      color: var(--ycjs-primary);
    }
    .ycjs-btn--danger {
      background: var(--ycjs-error);
      color: #fff;
    }
    .ycjs-btn--danger:hover {
      background: #DC2626;
    }
    .ycjs-btn--sm {
      padding: var(--ycjs-space-1) var(--ycjs-space-3);
      font-size: var(--ycjs-text-xs);
      border-radius: var(--ycjs-radius-sm);
    }
    .ycjs-btn--md {
      padding: var(--ycjs-space-2) var(--ycjs-space-5);
      font-size: var(--ycjs-text-sm);
    }
    .ycjs-btn--lg {
      padding: var(--ycjs-space-3) var(--ycjs-space-6);
      font-size: var(--ycjs-text-base);
    }
    .ycjs-btn--icon {
      padding: var(--ycjs-space-2);
      background: none;
      border: none;
      color: var(--ycjs-text-secondary);
      border-radius: var(--ycjs-radius-sm);
    }
    .ycjs-btn--icon:hover {
      background: var(--ycjs-bg-hover);
      color: var(--ycjs-text-primary);
    }

    /* ============================================================
       Chat Bubble
       ============================================================ */
    .ycjs-chat-count {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
      text-align: center;
      padding: var(--ycjs-space-2) 0;
      border-bottom: 1px solid var(--ycjs-border);
      margin-bottom: var(--ycjs-space-3);
    }
    .ycjs-session-item__count {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
    }
    .ycjs-chat-bubble {
      display: flex;
      gap: var(--ycjs-space-3);
      max-width: 80%;
    }
    .ycjs-chat-bubble--other {
      align-self: flex-start;
    }
    .ycjs-chat-bubble--me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .ycjs-chat-bubble__avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--ycjs-radius-full);
      background: var(--ycjs-primary-light);
      color: var(--ycjs-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--ycjs-text-sm);
      font-weight: 700;
      flex-shrink: 0;
    }
    .ycjs-chat-bubble--me .ycjs-chat-bubble__avatar {
      background: var(--ycjs-accent-light);
      color: var(--ycjs-accent);
    }
    .ycjs-chat-bubble__body {
      min-width: 0;
    }
    .ycjs-chat-bubble__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      margin-bottom: var(--ycjs-space-1);
    }
    .ycjs-chat-bubble--me .ycjs-chat-bubble__header {
      flex-direction: row-reverse;
    }
    .ycjs-chat-bubble__sender {
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
      color: var(--ycjs-text-secondary);
    }
    .ycjs-chat-bubble__time {
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
    }
    .ycjs-chat-bubble__text {
      padding: var(--ycjs-space-3) var(--ycjs-space-4);
      border-radius: var(--ycjs-radius-lg);
      font-size: var(--ycjs-text-sm);
      line-height: 1.65;
      word-break: break-word;
    }
    .ycjs-chat-bubble--other .ycjs-chat-bubble__text {
      background: var(--ycjs-bg-bubble-other);
      border: 1px solid var(--ycjs-border);
      border-top-left-radius: var(--ycjs-radius-sm);
    }
    .ycjs-chat-bubble--me .ycjs-chat-bubble__text {
      background: var(--ycjs-bg-bubble-me);
      border-top-right-radius: var(--ycjs-radius-sm);
    }

    /* ============================================================
       Empty State
       ============================================================ */
    .ycjs-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: var(--ycjs-space-4);
      padding: var(--ycjs-space-8);
      text-align: center;
    }
    .ycjs-empty-state__icon {
      opacity: 0.4;
    }
    .ycjs-empty-state__title {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-lg);
      font-weight: 700;
      color: var(--ycjs-text-muted);
    }
    .ycjs-empty-state__desc {
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-text-muted);
      max-width: 280px;
    }

    /* ============================================================
       Loading Spinner
       ============================================================ */
    .ycjs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--ycjs-space-4);
      padding: var(--ycjs-space-8);
    }
    .ycjs-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--ycjs-border);
      border-top-color: var(--ycjs-primary);
      border-radius: 50%;
      animation: ycjsSpin 800ms linear infinite;
    }
    .ycjs-loading__text {
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-text-muted);
    }

    /* ============================================================
       Error Card
       ============================================================ */
    .ycjs-error-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--ycjs-space-4);
      padding: var(--ycjs-space-8);
      text-align: center;
    }
    .ycjs-error-card__icon {
      opacity: 0.6;
    }
    .ycjs-error-card__message {
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-error);
    }

    /* ============================================================
       Emotion Analysis Card (D区)
       ============================================================ */
    .ycjs-emotion-card {
      background: var(--ycjs-bg-card);
      border: 1px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-lg);
      padding: var(--ycjs-space-5);
      margin-bottom: var(--ycjs-space-4);
      animation: ycjsSlideUpFade 300ms ease-out;
    }
    .ycjs-emotion-card__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      margin-bottom: var(--ycjs-space-4);
    }
    .ycjs-emotion-card__title {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-base);
      font-weight: 700;
      color: var(--ycjs-text-primary);
    }
    .ycjs-emotion-card__main {
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-3);
    }
    .ycjs-emotion-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ycjs-emotion-label {
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-text-secondary);
    }
    .ycjs-emotion-value {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      font-size: var(--ycjs-text-sm);
    }
    .ycjs-emotion-level {
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
    }
    .ycjs-emotion-meter {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-3);
    }
    .ycjs-emotion-meter__bar {
      flex: 1;
      height: 8px;
      background: var(--ycjs-bg-hover);
      border-radius: var(--ycjs-radius-full);
      overflow: hidden;
    }
    .ycjs-emotion-meter__fill {
      height: 100%;
      border-radius: var(--ycjs-radius-full);
      transition: width 0.5s ease;
    }
    .ycjs-emotion-meter__number {
      font-size: var(--ycjs-text-xs);
      font-weight: 700;
      min-width: 32px;
      text-align: right;
    }
    .ycjs-emotion-detail {
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-2);
      padding-top: var(--ycjs-space-2);
      border-top: 1px solid var(--ycjs-border);
    }
    .ycjs-emotion-detail__item {
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-1);
    }
    .ycjs-emotion-detail__label {
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
      color: var(--ycjs-text-muted);
    }
    .ycjs-emotion-detail__text {
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-text-primary);
      line-height: 1.6;
    }
    .ycjs-emotion-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: var(--ycjs-space-2);
      padding-top: var(--ycjs-space-2);
    }
    .ycjs-emotion-keyword {
      display: inline-block;
      padding: var(--ycjs-space-1) var(--ycjs-space-3);
      background: var(--ycjs-primary-light);
      color: var(--ycjs-primary);
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
      border-radius: var(--ycjs-radius-full);
    }
    .ycjs-emotion-card__scope {
      margin-left: auto;
      font-size: var(--ycjs-text-xs);
      color: var(--ycjs-text-muted);
      font-weight: 400;
    }

    /* ============================================================
       Reply Section (E区)
       ============================================================ */
    .ycjs-reply-section {
      background: var(--ycjs-bg-card);
      border: 1px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-lg);
      padding: var(--ycjs-space-5);
      margin-bottom: var(--ycjs-space-4);
      animation: ycjsSlideUpFade 300ms ease-out 100ms both;
    }
    .ycjs-reply-section__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      margin-bottom: var(--ycjs-space-4);
    }
    .ycjs-reply-section__title {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-base);
      font-weight: 700;
      color: var(--ycjs-text-primary);
    }
    .ycjs-reply-tabs {
      display: flex;
      gap: var(--ycjs-space-2);
      margin-bottom: var(--ycjs-space-4);
      flex-wrap: wrap;
    }
    .ycjs-reply-tab {
      padding: var(--ycjs-space-2) var(--ycjs-space-4);
      font-size: var(--ycjs-text-sm);
      font-weight: 600;
      color: var(--ycjs-text-secondary);
      background: var(--ycjs-bg);
      border: 1.5px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-full);
      transition: all 0.15s ease;
    }
    .ycjs-reply-tab:hover {
      border-color: var(--ycjs-primary);
      color: var(--ycjs-primary);
    }
    .ycjs-reply-tab--active {
      background: var(--ycjs-primary);
      color: #fff;
      border-color: var(--ycjs-primary);
    }
    .ycjs-reply-content {
      transition: opacity 0.15s ease-in-out;
    }
    .ycjs-reply-card {
      background: var(--ycjs-bg);
      border: 1px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-md);
      padding: var(--ycjs-space-4);
      max-height: 200px;
      overflow-y: auto;
    }
    .ycjs-reply-card__content {
      font-size: var(--ycjs-text-base);
      line-height: 1.75;
      color: var(--ycjs-text-primary);
      margin-bottom: var(--ycjs-space-3);
      white-space: pre-wrap;
    }
    .ycjs-reply-card__reasoning {
      display: flex;
      align-items: flex-start;
      gap: var(--ycjs-space-2);
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-warning);
      margin-bottom: var(--ycjs-space-3);
      padding-top: var(--ycjs-space-3);
      border-top: 1px dashed var(--ycjs-border);
    }
    .ycjs-reply-card__reasoning svg {
      flex-shrink: 0;
      margin-top: 3px;
    }
    .ycjs-reply-card__actions {
      display: flex;
      justify-content: flex-end;
    }
    .ycjs-copy-btn--copied {
      background: var(--ycjs-success) !important;
    }

    /* ============================================================
       Quick Actions (F区)
       ============================================================ */
    .ycjs-quick-actions {
      animation: ycjsSlideUpFade 300ms ease-out 200ms both;
    }
    .ycjs-quick-actions__header {
      display: flex;
      align-items: center;
      gap: var(--ycjs-space-2);
      margin-bottom: var(--ycjs-space-3);
    }
    .ycjs-quick-actions__title {
      font-size: var(--ycjs-text-xs);
      font-weight: 600;
      color: var(--ycjs-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ycjs-quick-actions__btns {
      display: flex;
      flex-wrap: wrap;
      gap: var(--ycjs-space-2);
    }

    /* ============================================================
       Toast 轻提示
       ============================================================ */
    .ycjs-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: var(--ycjs-space-3) var(--ycjs-space-5);
      border-radius: var(--ycjs-radius-md);
      font-size: var(--ycjs-text-sm);
      font-weight: 600;
      box-shadow: var(--ycjs-shadow-lg);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .ycjs-toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .ycjs-toast--hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
    }
    .ycjs-toast--success {
      background: var(--ycjs-success);
      color: #fff;
    }
    .ycjs-toast--error {
      background: var(--ycjs-error);
      color: #fff;
    }
    .ycjs-toast--info {
      background: var(--ycjs-info);
      color: #fff;
    }

    /* ============================================================
       Settings Drawer
       ============================================================ */
    .ycjs-settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 500;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }
    .ycjs-settings-overlay--visible {
      opacity: 1;
      visibility: visible;
    }
    .ycjs-settings-drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: 380px;
      max-width: 100vw;
      height: 100vh;
      background: var(--ycjs-bg-card);
      z-index: 600;
      box-shadow: var(--ycjs-shadow-lg);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .ycjs-settings-drawer--open {
      right: 0;
    }
    .ycjs-settings-drawer__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--ycjs-space-5) var(--ycjs-space-6);
      border-bottom: 1px solid var(--ycjs-border);
    }
    .ycjs-settings-drawer__title {
      font-family: var(--ycjs-font-display);
      font-size: var(--ycjs-text-lg);
      font-weight: 700;
    }
    .ycjs-settings-drawer__close {
      background: none;
      border: none;
      color: var(--ycjs-text-muted);
      padding: var(--ycjs-space-2);
    }
    .ycjs-settings-drawer__close:hover {
      color: var(--ycjs-text-primary);
    }
    .ycjs-settings-drawer__body {
      flex: 1;
      overflow-y: auto;
      padding: var(--ycjs-space-6);
    }
    .ycjs-settings-section {
      margin-bottom: var(--ycjs-space-6);
    }
    .ycjs-settings-section__title {
      font-size: var(--ycjs-text-sm);
      font-weight: 700;
      color: var(--ycjs-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--ycjs-space-3);
    }
    .ycjs-settings-field {
      margin-bottom: var(--ycjs-space-4);
    }
    .ycjs-settings-field label {
      display: block;
      font-size: var(--ycjs-text-sm);
      font-weight: 600;
      color: var(--ycjs-text-primary);
      margin-bottom: var(--ycjs-space-2);
    }
    .ycjs-settings-field input,
    .ycjs-settings-field select {
      width: 100%;
      padding: var(--ycjs-space-2) var(--ycjs-space-3);
      border: 1.5px solid var(--ycjs-border);
      border-radius: var(--ycjs-radius-sm);
      font-size: var(--ycjs-text-sm);
      color: var(--ycjs-text-primary);
      background: var(--ycjs-bg);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .ycjs-settings-field input:focus,
    .ycjs-settings-field select:focus {
      border-color: var(--ycjs-border-focus);
    }
    .ycjs-settings-actions {
      padding: var(--ycjs-space-5) var(--ycjs-space-6);
      border-top: 1px solid var(--ycjs-border);
      display: flex;
      flex-direction: column;
      gap: var(--ycjs-space-2);
    }

    /* ============================================================
       Mobile Sidebar Overlay
       ============================================================ */
    .ycjs-sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 400;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }
    .ycjs-sidebar-overlay--visible {
      opacity: 1;
      visibility: visible;
    }

    /* ============================================================
       响应式适配
       ============================================================ */
    /* Tablet: 768px - 1023px */
    @media (max-width: 1023px) {
      .ycjs-sidebar {
        position: fixed;
        top: var(--ycjs-header-height);
        left: -260px;
        width: 260px;
        height: calc(100vh - var(--ycjs-header-height));
        z-index: 400;
        transition: left 0.3s ease;
        box-shadow: none;
      }
      .ycjs-sidebar--open {
        left: 0;
        box-shadow: var(--ycjs-shadow-lg);
      }
      .ycjs-sidebar-overlay {
        display: block;
      }
      .ycjs-header__menu-btn {
        display: block;
      }
    }

    /* Mobile: < 768px */
    @media (max-width: 767px) {
      .ycjs-header {
        padding: 0 var(--ycjs-space-4);
      }
      .ycjs-header__subtitle {
        display: none;
      }
      .ycjs-content {
        flex-direction: column;
      }
      .ycjs-chat-panel {
        border-right: none;
        border-bottom: 1px solid var(--ycjs-border);
        flex: 1;
      }
      .ycjs-ai-panel {
        flex: 1;
      }
      #ycjs-chat-panel,
      #ycjs-ai-panel {
        padding: var(--ycjs-space-4);
      }
      .ycjs-input-area {
        min-height: 100px;
      }
      .ycjs-input-actions__hint {
        display: none;
      }
      .ycjs-settings-drawer {
        width: 100vw;
      }
    }

    /* Scrollbar Styling */
    #ycjs-chat-panel::-webkit-scrollbar,
    #ycjs-ai-panel::-webkit-scrollbar,
    .ycjs-session-list::-webkit-scrollbar {
      width: 6px;
    }
    #ycjs-chat-panel::-webkit-scrollbar-track,
    #ycjs-ai-panel::-webkit-scrollbar-track,
    .ycjs-session-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #ycjs-chat-panel::-webkit-scrollbar-thumb,
    #ycjs-ai-panel::-webkit-scrollbar-thumb,
    .ycjs-session-list::-webkit-scrollbar-thumb {
      background: var(--ycjs-border);
      border-radius: 3px;
    }
    #ycjs-chat-panel::-webkit-scrollbar-thumb:hover,
    #ycjs-ai-panel::-webkit-scrollbar-thumb:hover,
    .ycjs-session-list::-webkit-scrollbar-thumb:hover {
      background: var(--ycjs-text-muted);
    }
  </style>
</head>
<body>

<div class="ycjs-app">

  <!-- ===== Header ===== -->
  <header class="ycjs-header">
    <div class="ycjs-header__left">
      <!-- 移动端汉堡菜单 -->
      <button class="ycjs-btn ycjs-btn--icon" id="ycjs-btn-menu" aria-label="打开菜单">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <span class="ycjs-header__logo">语策军师</span>
      <span class="ycjs-header__subtitle">对话上下文 AI 辅助工具</span>
    </div>
    <div class="ycjs-header__right">
      <button class="ycjs-btn ycjs-btn--icon" id="ycjs-btn-settings" aria-label="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="ycjs-main">

    <!-- 侧边栏遮罩（移动端） -->
    <div class="ycjs-sidebar-overlay" id="ycjs-sidebar-overlay"></div>

    <!-- Sidebar — 历史会话 -->
    <aside class="ycjs-sidebar" id="ycjs-sidebar">
      <div class="ycjs-sidebar__header">
        <span class="ycjs-sidebar__title">历史会话</span>
        <button class="ycjs-sidebar__new-btn" id="ycjs-btn-new-session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          新建会话
        </button>
      </div>
      <div class="ycjs-session-list" id="ycjs-session-list">
        <!-- 由 JS 动态渲染 -->
      </div>
    </aside>

    <!-- Content — 聊天面板 + AI 面板 -->
    <div class="ycjs-content">

      <!-- 聊天面板 (B区) -->
      <section class="ycjs-chat-panel">
        <div class="ycjs-chat-panel__header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
          <span>对话记录</span>
        </div>
        <div id="ycjs-chat-panel">
          <!-- 由 JS 动态渲染 -->
        </div>
      </section>

      <!-- AI 辅助面板 (D/E/F区) -->
      <section class="ycjs-ai-panel">
        <div class="ycjs-ai-panel__header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
          <span>AI 辅助面板</span>
        </div>
        <div id="ycjs-ai-panel">
          <!-- 由 JS 动态渲染 -->
        </div>
      </section>

    </div>

  </main>

  <!-- ===== Input Area (C区) ===== -->
  <footer class="ycjs-input-area-wrapper">
    <div class="ycjs-input-area-wrapper__inner">
      <textarea
        class="ycjs-input-area"
        id="ycjs-input-area"
        placeholder="粘贴聊天内容...（支持从微信等直接复制粘贴，Ctrl+V 粘贴后自动解析）"
        rows="5"
      ></textarea>
      <div class="ycjs-input-actions">
        <span class="ycjs-input-actions__hint">粘贴后自动解析 | Ctrl+Enter 手动提交</span>
        <div class="ycjs-input-actions__btns">
          <button class="ycjs-btn ycjs-btn--primary ycjs-btn--md" id="ycjs-btn-generate">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            生成回复
          </button>
        </div>
      </div>
    </div>
  </footer>

</div>

<!-- ===== Settings Drawer ===== -->
<div class="ycjs-settings-overlay" id="ycjs-settings-overlay"></div>
<div class="ycjs-settings-drawer" id="ycjs-settings-drawer">
  <div class="ycjs-settings-drawer__header">
    <span class="ycjs-settings-drawer__title">设置</span>
    <button class="ycjs-settings-drawer__close" aria-label="关闭设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="ycjs-settings-drawer__body">

    <!-- AI Provider 配置 -->
    <div class="ycjs-settings-section">
      <div class="ycjs-settings-section__title">AI 服务配置</div>
      <div class="ycjs-settings-field">
        <label for="ycjs-setting-provider">AI 服务商</label>
        <select id="ycjs-setting-provider">
          <option value="zhipu">智谱 AI (GLM-4-Flash)</option>
          <option value="deepseek">DeepSeek (deepseek-chat)</option>
          <option value="qwen">通义千问 (qwen-turbo)</option>
          <option value="ark">火山引擎 Ark (doubao-seed-2-0-mini-260428)</option>
          <option value="openai">OpenAI (GPT-4o-mini)</option>
        </select>
      </div>
      <div class="ycjs-settings-field">
        <label for="ycjs-setting-apikey">API Key</label>
        <input type="password" id="ycjs-setting-apikey" placeholder="输入 API Key">
      </div>
      <div class="ycjs-settings-field">
        <label for="ycjs-setting-baseurl">自定义 API 地址（可选）</label>
        <input type="text" id="ycjs-setting-baseurl" placeholder="留空使用默认地址">
      </div>
    </div>

    <!-- 偏好设置 -->
    <div class="ycjs-settings-section">
      <div class="ycjs-settings-section__title">偏好设置</div>
      <div class="ycjs-settings-field">
        <label for="ycjs-setting-default-tone">默认回复语气</label>
        <select id="ycjs-setting-default-tone">
          <option value="friendly">友好</option>
          <option value="formal">正式</option>
          <option value="casual">随意</option>
          <option value="professional">专业</option>
        </select>
      </div>
      <div class="ycjs-settings-field">
        <label for="ycjs-setting-max-sessions">最大历史会话数</label>
        <input type="number" id="ycjs-setting-max-sessions" value="50" min="10" max="200">
      </div>
    </div>

    <!-- 数据管理 -->
    <div class="ycjs-settings-section">
      <div class="ycjs-settings-section__title">数据管理</div>
      <div style="display:flex; gap:var(--ycjs-space-2); flex-wrap:wrap;">
        <button class="ycjs-btn ycjs-btn--secondary ycjs-btn--sm" id="ycjs-btn-export">
          导出数据
        </button>
        <button class="ycjs-btn ycjs-btn--secondary ycjs-btn--sm" id="ycjs-btn-import">
          导入数据
        </button>
        <button class="ycjs-btn ycjs-btn--danger ycjs-btn--sm" id="ycjs-btn-clear-data">
          清除所有数据
        </button>
      </div>
    </div>

    <!-- 保存按钮 -->
    <div class="ycjs-settings-section" style="margin-top: var(--ycjs-space-6);">
      <button class="ycjs-btn ycjs-btn--primary" id="ycjs-btn-save-settings" style="width:100%;">
        保存设置
      </button>
    </div>

  </div>
</div>

<!-- ===== JS Modules ===== -->
<script type="module" src="js/event-bus.js"></script>
<script type="module" src="js/storage.js"></script>
<script type="module" src="js/context-parser.js"></script>
<script type="module" src="js/ai-generation.js"></script>
<script type="module" src="js/conversation.js"></script>
<script type="module" src="js/reply-showcase.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
