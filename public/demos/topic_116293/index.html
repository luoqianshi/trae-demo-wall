<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后室探索</title>
  <style>
    :root {
      --yellow: #d7c76a;
      --wall: #b7a84b;
      --dark: #080907;
      --ui: rgba(10, 12, 10, .72);
      --green: #a8ff9d;
      --red: #ff6d6d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050604;
      color: #f8f5d7;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: auto;
      background: #111;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      left: 18px;
      top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      max-width: calc(100vw - 220px);
    }

    .pill {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 220, .18);
      background: var(--ui);
      border-radius: 999px;
      box-shadow: 0 0 24px rgba(0,0,0,.38);
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    .meter {
      width: 170px;
      height: 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0,0,0,.5);
      display: inline-block;
      vertical-align: -1px;
      margin-left: 8px;
    }

    .meter > i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e9ff74, #70ff9b);
      border-radius: inherit;
    }

    .centerHint {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 32px));
      text-align: center;
      line-height: 1.55;
      padding: 12px 16px;
      border-radius: 16px;
      color: rgba(255,255,220,.92);
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 0 28px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      transition: opacity .3s;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(680px, calc(100vw - 36px));
      padding: 28px;
      border-radius: 22px;
      text-align: center;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,220,.22);
      box-shadow: 0 0 80px rgba(0,0,0,.65);
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .message h1 {
      margin: 0 0 12px;
      letter-spacing: 3px;
      font-size: clamp(30px, 6vw, 58px);
      color: #fff6a8;
      text-shadow: 0 0 18px rgba(255,246,168,.3);
    }

    .message p {
      margin: 10px 0;
      color: rgba(255,255,230,.88);
      line-height: 1.8;
    }

    button {
      margin-top: 18px;
      pointer-events: auto;
      border: 0;
      color: #15150b;
      font-weight: 800;
      background: linear-gradient(180deg, #fff08c, #c7b64d);
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,.35);
      font-size: 16px;
    }

    button:hover { filter: brightness(1.08); }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      opacity: .5;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,230,.7);
      box-shadow: 0 0 6px rgba(255,255,230,.35);
    }

    .crosshair::before {
      left: 6px;
      top: 0;
      width: 2px;
      height: 14px;
    }

    .crosshair::after {
      left: 0;
      top: 6px;
      width: 14px;
      height: 2px;
    }

    .scanline {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.026) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 50% 52%, transparent 0 38%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.82) 100%);
      mix-blend-mode: overlay;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="scanline"></div>
  <div class="hud">
    <div class="topbar">
      <div class="pill">层级：<span id="levelName">Level 0</span></div>
      <div class="pill">第四维度 W：<span id="dimensionText">0.00</span></div>
      <div class="pill">电量 <span class="meter"><i id="batteryBar"></i></span></div>
      <div class="pill">距离出口：<span id="distance">未知</span></div>
      <div class="pill">状态：<span id="status">迷失</span></div>
    </div>
    <div class="crosshair"></div>
    <div class="centerHint" id="hint">
      WASD 移动，鼠标或 ← → 转向，Q/E 改变第四维度 W，R 折叠空间，Shift 奔跑，F 手电。找到红色出口门进入下一层。
    </div>
    <div class="message" id="menu">
      <h1>后室探索</h1>
      <p>你在刺眼的荧光灯下醒来。潮湿的地毯、泛黄的墙纸、没有尽头的走廊。</p>
      <p>目标：穿过多个层级，找到红色出口门。现在空间不是 3D，而是会随第四维度 W 改变的 4D 后室。</p>
      <button id="startBtn">进入后室</button>
    </div>
    <div class="message hidden" id="endPanel">
      <h1 id="endTitle">结束</h1>
      <p id="endText"></p>
      <button id="restartBtn">重新探索</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const batteryBar = document.getElementById("batteryBar");
    const levelName = document.getElementById("levelName");
    const dimensionText = document.getElementById("dimensionText");
    const distanceText = document.getElementById("distance");
    const statusText = document.getElementById("status");
    const menu = document.getElementById("menu");
    const hint = document.getElementById("hint");
    const endPanel = document.getElementById("endPanel");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");

    let W = 0, H = 0, DPR = 1;
    let running = false;
    let lastTime = 0;
    let mouseLocked = false;
    let audioCtx = null;
    let drone = null;
    let buzz = null;

    const keys = new Set();
    const mapW = 25;
    const mapH = 25;
    const tile = 1;
    let map = [];
    let exit = { x: 23.5, y: 23.5 };
    let entities = [];
    let props = [];
    let guaranteedPath = [];
    let currentLevel = 0;
    let qualityScale = 1;
    let foldPulse = 0;
    let foldCooldown = 0;
    const levels = [
      { name: "Level 0 大厅", tag: "实体隔断 / 矮墙 / 支撑柱 / 无贴图障碍", theme: "lobby", wall: [211, 197, 91], floor: ["#766d2b", "#1b1709"], ceil: ["#50471d", "#a3913b"], entities: 0, fog: .50, light: 14, open: .18, block: .025, propChance: .085, props: ["partition", "lowwall", "column"] },
      { name: "Level 1 停车区", tag: "混凝土柱 / 车辆 / 供给箱 / 真实阻挡", theme: "parking", wall: [158, 160, 150], floor: ["#5b5c55", "#151515"], ceil: ["#303231", "#797c74"], entities: 1, fog: .58, light: 13, open: .14, block: .04, propChance: .095, props: ["pillar", "crate", "car"] },
      { name: "Level 2 管道梦", tag: "管道架 / 阀门箱 / 锅炉块 / 维修障碍", theme: "pipes", wall: [150, 116, 76], floor: ["#624933", "#17100a"], ceil: ["#332319", "#6d5034"], entities: 1, fog: .66, light: 11, open: .11, block: .058, propChance: .13, props: ["pipeRack", "valveBlock", "boiler"] },
      { name: "Level 3 电气站", tag: "变压器 / 电缆卷 / 电柜 / 工业障碍", theme: "electric", wall: [93, 123, 117], floor: ["#2e403d", "#08100f"], ceil: ["#14211f", "#49615c"], entities: 2, fog: .72, light: 10, open: .10, block: .068, propChance: .13, props: ["transformer", "cableDrum", "panelBlock"] },
      { name: "Level 4 废弃办公室", tag: "办公桌 / 隔间墙 / 售货机 / 办公障碍", theme: "office", wall: [116, 130, 145], floor: ["#3b4450", "#10151b"], ceil: ["#202932", "#687481"], entities: 0, fog: .48, light: 14, open: .17, block: .035, propChance: .12, props: ["desk", "cubicle", "vending"] },
      { name: "Level 5 恐怖酒店", tag: "沙发 / 长桌 / 衣柜 / 酒店家具障碍", theme: "hotel", wall: [124, 82, 61], floor: ["#4d3026", "#110908"], ceil: ["#2a1714", "#674033"], entities: 2, fog: .76, light: 9.5, open: .09, block: .075, propChance: .13, props: ["sofa", "hotelTable", "wardrobe"] }
    ];
    let player = {
      x: 1.5,
      y: 1.5,
      a: 0,
      battery: 100,
      flashlight: true,
      alive: true,
      won: false,
      bob: 0,
      fear: 0,
      w: 0
    };

    function resize() {
      DPR = Math.min(2.5, window.devicePixelRatio || 1);
      W = canvas.width = Math.floor(innerWidth * DPR);
      H = canvas.height = Math.floor(innerHeight * DPR);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      W = innerWidth;
      H = innerHeight;
    }

    function level() {
      return levels[currentLevel];
    }

    function makeMap() {
      const cfg = level();
      levelName.textContent = cfg.name;
      statusText.textContent = cfg.tag;
      map = Array.from({ length: mapH }, (_, y) =>
        Array.from({ length: mapW }, (_, x) => (x === 0 || y === 0 || x === mapW - 1 || y === mapH - 1) ? 1 : 1)
      );

      function carve(x, y) {
        const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(() => Math.random() - .5);
        map[y][x] = 0;
        for (const [dx, dy] of dirs) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx > 0 && ny > 0 && nx < mapW - 1 && ny < mapH - 1 && map[ny][nx] === 1) {
            map[y + dy / 2][x + dx / 2] = 0;
            carve(nx, ny);
          }
        }
      }

      carve(1, 1);

      for (let y = 2; y < mapH - 2; y++) {
        for (let x = 2; x < mapW - 2; x++) {
          if (Math.random() < cfg.open) map[y][x] = 0;
          if (Math.random() < cfg.block) map[y][x] = 1;
        }
      }

      map[1][1] = 0;
      map[1][2] = 0;
      map[2][1] = 0;
      let best = { x: 23, y: 23, d: 0 };
      for (let y = 1; y < mapH - 1; y++) {
        for (let x = 1; x < mapW - 1; x++) {
          if (map[y][x] === 0) {
            const d = Math.hypot(x - 1, y - 1);
            if (d > best.d) best = { x, y, d };
          }
        }
      }
      exit = { x: best.x + .5, y: best.y + .5 };
      carveGuaranteedPath(1, 1, best.x, best.y);
      guaranteedPath = findPath(1, 1, best.x, best.y);
      props = generateProps(cfg);
      entities = [];
      for (let i = 0; i < cfg.entities; i++) {
        let spot = findEmptySpot(8 + i * 2);
        entities.push({
          x: spot.x,
          y: spot.y,
          t: Math.random(),
          speed: .68 + currentLevel * .08 + Math.random() * .12,
          kind: i % 3
        });
      }
    }

    function generateProps(cfg) {
      const out = [];
      for (let y = 1; y < mapH - 1; y++) {
        for (let x = 1; x < mapW - 1; x++) {
          if (map[y][x] || Math.random() > cfg.propChance) continue;
          if (Math.hypot(x + .5 - 1.5, y + .5 - 1.5) < 3) continue;
          if (Math.hypot(x + .5 - exit.x, y + .5 - exit.y) < 2.4) continue;
          if (nearGuaranteedPath(x, y, 1)) continue;
          const type = cfg.props[Math.floor(Math.random() * cfg.props.length)];
          out.push({
            x: x + .5,
            y: y + .5,
            type,
            solid: true,
            radius: propRadius(type),
            phase: Math.random() * Math.PI * 2
          });
        }
      }
      return out.slice(0, 34);
    }

    function propRadius(type) {
      if (["car", "sofa", "hotelTable"].includes(type)) return .62;
      if (["partition", "lowwall", "cubicle", "pipeRack"].includes(type)) return .55;
      if (["pillar", "column", "boiler", "transformer", "wardrobe", "vending"].includes(type)) return .48;
      return .42;
    }

    function nearGuaranteedPath(x, y, radius = 0) {
      return guaranteedPath.some(p => Math.abs(p.x - x) <= radius && Math.abs(p.y - y) <= radius);
    }

    function propAt(x, y, padding = 0) {
      for (const prop of props) {
        if (!prop.solid) continue;
        if (Math.hypot(prop.x - x, prop.y - y) < prop.radius + padding) return prop;
      }
      return null;
    }

    function findEmptySpot(minDist) {
      for (let tries = 0; tries < 800; tries++) {
        const x = 1 + Math.floor(Math.random() * (mapW - 2)) + .5;
        const y = 1 + Math.floor(Math.random() * (mapH - 2)) + .5;
        const farFromStart = Math.hypot(x - 1.5, y - 1.5) > minDist;
        const farFromExit = Math.hypot(x - exit.x, y - exit.y) > 4;
        if (!wallAt(x, y) && farFromStart && farFromExit) return { x, y };
      }
      return { x: 12.5, y: 12.5 };
    }

    function carveGuaranteedPath(sx, sy, ex, ey) {
      let x = sx;
      let y = sy;
      map[y][x] = 0;
      const horizontalFirst = Math.random() > .5;
      const walkX = () => {
        while (x !== ex) {
          x += Math.sign(ex - x);
          map[y][x] = 0;
          if (y + 1 < mapH - 1 && Math.random() < .28) map[y + 1][x] = 0;
          if (y - 1 > 0 && Math.random() < .28) map[y - 1][x] = 0;
        }
      };
      const walkY = () => {
        while (y !== ey) {
          y += Math.sign(ey - y);
          map[y][x] = 0;
          if (x + 1 < mapW - 1 && Math.random() < .28) map[y][x + 1] = 0;
          if (x - 1 > 0 && Math.random() < .28) map[y][x - 1] = 0;
        }
      };
      if (horizontalFirst) {
        walkX();
        walkY();
      } else {
        walkY();
        walkX();
      }
      map[sy][sx] = 0;
      map[ey][ex] = 0;
    }

    function findPath(sx, sy, ex, ey) {
      const queue = [{ x: sx, y: sy }];
      const seen = Array.from({ length: mapH }, () => Array(mapW).fill(false));
      const prev = Array.from({ length: mapH }, () => Array(mapW).fill(null));
      seen[sy][sx] = true;
      for (let i = 0; i < queue.length; i++) {
        const p = queue[i];
        if (p.x === ex && p.y === ey) break;
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = p.x + dx;
          const ny = p.y + dy;
          if (nx <= 0 || ny <= 0 || nx >= mapW - 1 || ny >= mapH - 1) continue;
          if (seen[ny][nx] || map[ny][nx] === 1) continue;
          seen[ny][nx] = true;
          prev[ny][nx] = p;
          queue.push({ x: nx, y: ny });
        }
      }
      if (!seen[ey][ex]) return [];
      const path = [];
      let cur = { x: ex, y: ey };
      while (cur) {
        path.push(cur);
        cur = prev[cur.y][cur.x];
      }
      return path.reverse();
    }

    function wallAt(x, y) {
      const mx = Math.floor(x);
      const my = Math.floor(y);
      if (mx < 0 || my < 0 || mx >= mapW || my >= mapH) return true;
      if (guaranteedPath.some(p => p.x === mx && p.y === my)) return false;
      const dimensionalOpen = Math.sin(mx * 1.73 + my * 2.41 + player.w * Math.PI * 2 + currentLevel) > .72;
      const dimensionalWall = Math.cos(mx * 2.19 - my * 1.37 + player.w * Math.PI * 2) > .88;
      if (map[my][mx] === 1) return !dimensionalOpen;
      return dimensionalWall && Math.abs(player.w) > .38;
    }

    function blockedAt(x, y, padding = .18) {
      return wallAt(x, y) || !!propAt(x, y, padding);
    }

    function castRay(angle) {
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);
      let dist = 0;
      let hitX = player.x;
      let hitY = player.y;
      let side = 0;
      while (dist < 18) {
        dist += .018;
        hitX = player.x + cos * dist;
        hitY = player.y + sin * dist;
        if (wallAt(hitX, hitY)) {
          const fx = hitX - Math.floor(hitX);
          const fy = hitY - Math.floor(hitY);
          side = (fx < .08 || fx > .92) ? 1 : 0;
          break;
        }
      }
      return { dist, hitX, hitY, side };
    }

    function dimensionWarp(x, y) {
      return Math.sin(x * 3.1 + player.w * 5.7) * Math.cos(y * 2.6 - player.w * 4.9);
    }

    function drawCeilingFloor() {
      const cfg = level();
      const gradCeil = ctx.createLinearGradient(0, 0, 0, H / 2);
      gradCeil.addColorStop(0, cfg.ceil[0]);
      gradCeil.addColorStop(1, cfg.ceil[1]);
      ctx.fillStyle = gradCeil;
      ctx.fillRect(0, 0, W, H / 2);

      const gradFloor = ctx.createLinearGradient(0, H / 2, 0, H);
      gradFloor.addColorStop(0, cfg.floor[0]);
      gradFloor.addColorStop(1, cfg.floor[1]);
      ctx.fillStyle = gradFloor;
      ctx.fillRect(0, H / 2, W, H / 2);

      ctx.globalAlpha = .18;
      ctx.strokeStyle = "rgba(12,10,5,.75)";
      for (let y = H / 2; y < H; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(y * .08 + player.bob) * 2);
        ctx.lineTo(W, y + Math.cos(y * .04) * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = .16;
      for (let x = -W; x < W * 2; x += 70) {
        ctx.beginPath();
        ctx.moveTo(W / 2 + (x - W / 2) * .08, H / 2);
        ctx.lineTo(x + Math.sin(player.bob) * 10, H);
        ctx.stroke();
      }
      ctx.globalAlpha = .28;
      ctx.fillStyle = "rgba(255,245,170,.7)";
      for (let x = 70; x < W; x += 220) {
        const flicker = .65 + Math.sin(performance.now() * .006 + x) * .25;
        ctx.globalAlpha = .16 * flicker;
        ctx.fillRect(x, H * .18, 84, 5);
        ctx.globalAlpha = .05 * flicker;
        ctx.fillRect(x - 40, H * .18, 164, H * .24);
      }
      ctx.globalAlpha = 1;
    }

    function draw3D() {
      drawCeilingFloor();
      const cfg = level();
      const fov = Math.PI / 3.1;
      const rays = Math.floor(Math.max(360, Math.min(820, W / (1.35 + (1 - qualityScale) * .95))));
      const strip = W / rays + 1;

      for (let i = 0; i < rays; i++) {
        const t = i / rays;
        const angle = player.a - fov / 2 + t * fov;
        const ray = castRay(angle);
        const corrected = ray.dist * Math.cos(angle - player.a);
        const wallH = Math.min(H * 1.7, H / Math.max(.08, corrected));
        const x = i * strip;
        const y = H / 2 - wallH / 2 + Math.sin(player.bob) * 4;
        const light = Math.max(0, 1 - corrected / (player.flashlight ? cfg.light : 5.4));
        const wallpaper = Math.sin(ray.hitX * 19.7) * Math.cos(ray.hitY * 17.3);
        const stripe = (Math.floor(ray.hitX * 4) + Math.floor(ray.hitY * 4)) % 2;
        const sideShade = ray.side ? .86 : 1;
        const warp = dimensionWarp(ray.hitX, ray.hitY);
        const chroma = Math.abs(player.w) * 34 + foldPulse * 26;
        const grime = (stripe ? 14 : -9) + wallpaper * 18 + warp * 12;
        const r = Math.floor((cfg.wall[0] + grime + chroma) * light * sideShade + 10);
        const g = Math.floor((cfg.wall[1] + grime * .75) * light * sideShade + 10);
        const b = Math.floor((cfg.wall[2] + grime * .45 + chroma * 1.4) * light * sideShade + 8);

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, strip, wallH);

        const shade = ctx.createLinearGradient(x, y, x, y + wallH);
        shade.addColorStop(0, "rgba(255,255,210,.10)");
        shade.addColorStop(.18, "rgba(255,255,210,.02)");
        shade.addColorStop(.72, "rgba(0,0,0,.02)");
        shade.addColorStop(1, "rgba(0,0,0,.32)");
        ctx.fillStyle = shade;
        ctx.fillRect(x, y, strip, wallH);

        if (i % 9 === 0) {
          ctx.globalAlpha = .20 * light;
          ctx.fillStyle = wallpaper > .6 ? "#fff3a8" : "#1d190c";
          ctx.fillRect(x, y, Math.max(1, strip), wallH);
          ctx.globalAlpha = 1;
        }

        if (i % 17 === 0 && corrected < 8) {
          ctx.globalAlpha = .12 * light;
          ctx.fillStyle = "rgba(40,32,13,.9)";
          ctx.fillRect(x, y + wallH * .62, Math.max(1, strip), Math.max(6, wallH * .018));
          ctx.globalAlpha = 1;
        }
      }

      drawPathMarkers();
      drawProps();
      drawExit();
      drawEntities();
      drawHypercubeOverlay();
      drawLighting();
      drawNoise();
      drawMiniMap();
    }

    function drawHypercubeOverlay() {
      const t = performance.now() * .001;
      const strength = Math.min(1, Math.abs(player.w) * 1.5 + foldPulse);
      if (strength < .04) return;
      const cx = Math.max(110, W * .13);
      const cy = Math.max(230, H * .76);
      const size = Math.min(W, H) * (.07 + strength * .025);
      const verts = [];
      for (let i = 0; i < 16; i++) {
        const x = (i & 1) ? 1 : -1;
        const y = (i & 2) ? 1 : -1;
        const z = (i & 4) ? 1 : -1;
        const w = (i & 8) ? 1 : -1;
        const a = t * .7 + player.w * 2.6;
        const b = t * .43 - player.w * 1.9;
        const rx = x * Math.cos(a) - w * Math.sin(a);
        const rw = x * Math.sin(a) + w * Math.cos(a);
        const ry = y * Math.cos(b) - z * Math.sin(b);
        const rz = y * Math.sin(b) + z * Math.cos(b);
        const persp4 = 1.8 / (2.5 - rw * .35);
        const persp3 = 1.5 / (2.2 - rz * .35);
        verts.push({ x: cx + rx * size * persp4 * persp3, y: cy + ry * size * persp4 * persp3 });
      }
      ctx.save();
      ctx.globalAlpha = .07 + strength * .13;
      ctx.strokeStyle = "rgba(150, 230, 255, .9)";
      ctx.lineWidth = 1.2;
      ctx.shadowColor = "rgba(80,200,255,.9)";
      ctx.shadowBlur = 16;
      for (let i = 0; i < 16; i++) {
        for (let bit = 1; bit < 16; bit <<= 1) {
          const j = i ^ bit;
          if (i < j) {
            ctx.beginPath();
            ctx.moveTo(verts[i].x, verts[i].y);
            ctx.lineTo(verts[j].x, verts[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawProps() {
      const visible = props
        .map(prop => ({ prop, p: projectPoint(prop.x, prop.y) }))
        .filter(item => item.p && item.p.dist < 9 && hasLineOfSight(item.prop.x, item.prop.y))
        .sort((a, b) => b.p.dist - a.p.dist);
      for (const item of visible) drawProp(item.prop, item.p);
    }

    function drawProp(prop, p) {
      const scale = Math.max(6, H / p.dist * .18);
      const alpha = Math.max(0, Math.min(.9, 1 - p.dist / 10));
      const baseY = p.y + scale * 1.35;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 12;

      if (prop.type === "partition") {
        ctx.fillStyle = "#c6b760";
        ctx.fillRect(p.x - scale * .62, baseY - scale * 1.55, scale * 1.24, scale * 1.0);
        ctx.fillStyle = "rgba(40,32,12,.28)";
        ctx.fillRect(p.x - scale * .55, baseY - scale * 1.45, scale * 1.1, scale * .18);
      } else if (prop.type === "lowwall") {
        ctx.fillStyle = "#b8a84d";
        ctx.fillRect(p.x - scale * .85, baseY - scale * .95, scale * 1.7, scale * .45);
        ctx.fillStyle = "rgba(255,246,160,.22)";
        ctx.fillRect(p.x - scale * .78, baseY - scale * .9, scale * 1.55, scale * .09);
      } else if (prop.type === "column") {
        ctx.fillStyle = "#b9aa55";
        ctx.fillRect(p.x - scale * .28, baseY - scale * 2.6, scale * .56, scale * 2.6);
        ctx.fillStyle = "rgba(48,38,12,.24)";
        ctx.fillRect(p.x + scale * .12, baseY - scale * 2.55, scale * .09, scale * 2.5);
      } else if (prop.type === "pillar") {
        ctx.fillStyle = "#6f716c";
        ctx.fillRect(p.x - scale * .34, baseY - scale * 2.8, scale * .68, scale * 2.9);
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fillRect(p.x - scale * .26, baseY - scale * 2.75, scale * .12, scale * 2.7);
      } else if (prop.type === "crate") {
        ctx.fillStyle = "#6b5130";
        ctx.fillRect(p.x - scale * .55, baseY - scale * .8, scale * 1.1, scale * .72);
        ctx.strokeStyle = "#2b1e12";
        ctx.strokeRect(p.x - scale * .55, baseY - scale * .8, scale * 1.1, scale * .72);
        ctx.beginPath();
        ctx.moveTo(p.x - scale * .5, baseY - scale * .25);
        ctx.lineTo(p.x + scale * .5, baseY - scale * .75);
        ctx.stroke();
      } else if (prop.type === "car") {
        ctx.fillStyle = ["#5e1b1b", "#182d54", "#c8c8bd"][Math.floor(prop.phase * 10) % 3];
        ctx.fillRect(p.x - scale * .9, baseY - scale * .55, scale * 1.8, scale * .48);
        ctx.fillRect(p.x - scale * .55, baseY - scale * .9, scale * .9, scale * .42);
        ctx.fillStyle = "#0b0c0e";
        ctx.beginPath(); ctx.arc(p.x - scale * .55, baseY - scale * .05, scale * .16, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x + scale * .55, baseY - scale * .05, scale * .16, 0, Math.PI * 2); ctx.fill();
      } else if (prop.type === "pipeRack") {
        ctx.fillStyle = "#3d2a1f";
        ctx.fillRect(p.x - scale * .82, baseY - scale * 1.7, scale * 1.64, scale * .34);
        ctx.fillRect(p.x - scale * .78, baseY - scale * 1.12, scale * 1.56, scale * .24);
        ctx.fillStyle = "#9a673e";
        ctx.fillRect(p.x - scale * .72, baseY - scale * 1.62, scale * 1.44, scale * .08);
        ctx.fillRect(p.x - scale * .72, baseY - scale * 1.04, scale * 1.44, scale * .07);
      } else if (prop.type === "valveBlock") {
        ctx.fillStyle = "#5b3927";
        ctx.fillRect(p.x - scale * .48, baseY - scale * 1.45, scale * .96, scale * .95);
        ctx.strokeStyle = "#b1663c";
        ctx.lineWidth = Math.max(2, scale * .08);
        ctx.beginPath(); ctx.arc(p.x, baseY - scale, scale * .28, 0, Math.PI * 2); ctx.stroke();
      } else if (prop.type === "boiler") {
        ctx.fillStyle = "#4a3429";
        ctx.beginPath();
        ctx.ellipse(p.x, baseY - scale * 1.05, scale * .62, scale * .8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1d120e";
        ctx.fillRect(p.x - scale * .46, baseY - scale * 1.55, scale * .92, scale * .18);
      } else if (prop.type === "pipe") {
        ctx.strokeStyle = "#2b211a";
        ctx.lineWidth = Math.max(3, scale * .18);
        ctx.beginPath();
        ctx.moveTo(p.x - scale * .9, baseY - scale * 1.6);
        ctx.lineTo(p.x + scale * .9, baseY - scale * 1.6);
        ctx.stroke();
        ctx.strokeStyle = "#8a5a38";
        ctx.lineWidth = Math.max(2, scale * .07);
        ctx.stroke();
      } else if (prop.type === "valve") {
        ctx.strokeStyle = "#753d26";
        ctx.lineWidth = Math.max(2, scale * .08);
        ctx.beginPath(); ctx.arc(p.x, baseY - scale, scale * .35, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.x - scale * .35, baseY - scale); ctx.lineTo(p.x + scale * .35, baseY - scale); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.x, baseY - scale * 1.35); ctx.lineTo(p.x, baseY - scale * .65); ctx.stroke();
      } else if (prop.type === "steam") {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(230,230,220,.55)";
        ctx.lineWidth = Math.max(1, scale * .06);
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(p.x + (i - 1) * scale * .18, baseY);
          ctx.bezierCurveTo(p.x - scale * .2, baseY - scale * .6, p.x + scale * .25, baseY - scale, p.x + Math.sin(performance.now() * .003 + prop.phase + i) * scale * .25, baseY - scale * 1.5);
          ctx.stroke();
        }
      } else if (prop.type === "transformer") {
        ctx.fillStyle = "#263a35";
        ctx.fillRect(p.x - scale * .58, baseY - scale * 1.75, scale * 1.16, scale * 1.3);
        ctx.fillStyle = "#111a18";
        for (let i = 0; i < 4; i++) ctx.fillRect(p.x - scale * .45 + i * scale * .25, baseY - scale * 1.95, scale * .1, scale * .32);
        ctx.fillStyle = "#9dff9d";
        ctx.fillRect(p.x - scale * .42, baseY - scale * 1.52, scale * .13, scale * .13);
      } else if (prop.type === "cableDrum") {
        ctx.fillStyle = "#171717";
        ctx.beginPath(); ctx.arc(p.x, baseY - scale * .85, scale * .52, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#6f6f6f";
        ctx.lineWidth = Math.max(2, scale * .07);
        ctx.beginPath(); ctx.arc(p.x, baseY - scale * .85, scale * .34, 0, Math.PI * 2); ctx.stroke();
      } else if (prop.type === "panelBlock") {
        ctx.fillStyle = "#23312e";
        ctx.fillRect(p.x - scale * .5, baseY - scale * 1.75, scale, scale * 1.32);
        ctx.fillStyle = "#84ff85";
        ctx.fillRect(p.x - scale * .32, baseY - scale * 1.5, scale * .14, scale * .12);
        ctx.fillStyle = "#ff6f6f";
        ctx.fillRect(p.x + scale * .15, baseY - scale * 1.5, scale * .14, scale * .12);
      } else if (prop.type === "wire") {
        ctx.strokeStyle = "#050505";
        ctx.lineWidth = Math.max(2, scale * .06);
        ctx.beginPath();
        ctx.moveTo(p.x - scale, baseY - scale * 2.2);
        ctx.quadraticCurveTo(p.x, baseY - scale * 1.5 + Math.sin(prop.phase) * scale * .2, p.x + scale, baseY - scale * 2.15);
        ctx.stroke();
      } else if (prop.type === "panel") {
        ctx.fillStyle = "#24322e";
        ctx.fillRect(p.x - scale * .42, baseY - scale * 1.55, scale * .84, scale * 1.05);
        ctx.fillStyle = Math.sin(performance.now() * .01 + prop.phase) > .4 ? "#8dff8d" : "#2d5a2d";
        ctx.fillRect(p.x - scale * .22, baseY - scale * 1.36, scale * .12, scale * .12);
        ctx.fillStyle = "#ff7474";
        ctx.fillRect(p.x + scale * .1, baseY - scale * 1.36, scale * .12, scale * .12);
      } else if (prop.type === "fan") {
        ctx.strokeStyle = "#111";
        ctx.lineWidth = Math.max(2, scale * .05);
        ctx.beginPath(); ctx.arc(p.x, baseY - scale * 1.35, scale * .42, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 4; i++) {
          const a = performance.now() * .006 + i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(p.x, baseY - scale * 1.35);
          ctx.lineTo(p.x + Math.cos(a) * scale * .34, baseY - scale * 1.35 + Math.sin(a) * scale * .34);
          ctx.stroke();
        }
      } else if (prop.type === "desk") {
        ctx.fillStyle = "#53463a";
        ctx.fillRect(p.x - scale * .75, baseY - scale * .72, scale * 1.5, scale * .32);
        ctx.fillRect(p.x - scale * .63, baseY - scale * .42, scale * .12, scale * .52);
        ctx.fillRect(p.x + scale * .5, baseY - scale * .42, scale * .12, scale * .52);
      } else if (prop.type === "cubicle") {
        ctx.fillStyle = "#66727c";
        ctx.fillRect(p.x - scale * .72, baseY - scale * 1.48, scale * 1.44, scale * .78);
        ctx.fillStyle = "rgba(220,230,240,.18)";
        ctx.fillRect(p.x - scale * .62, baseY - scale * 1.38, scale * 1.24, scale * .12);
      } else if (prop.type === "window") {
        ctx.fillStyle = "rgba(150,180,200,.35)";
        ctx.fillRect(p.x - scale * .55, baseY - scale * 1.85, scale * 1.1, scale * .9);
        ctx.strokeStyle = "rgba(220,230,240,.5)";
        ctx.strokeRect(p.x - scale * .55, baseY - scale * 1.85, scale * 1.1, scale * .9);
        ctx.strokeStyle = "rgba(220,230,240,.35)";
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(p.x - scale * .48 + i * scale * .28, baseY - scale * .98);
          ctx.lineTo(p.x - scale * .62 + i * scale * .28, baseY - scale * 1.78);
          ctx.stroke();
        }
      } else if (prop.type === "vending") {
        ctx.fillStyle = "#283b55";
        ctx.fillRect(p.x - scale * .38, baseY - scale * 1.75, scale * .76, scale * 1.45);
        ctx.fillStyle = "#9bd4ff";
        ctx.fillRect(p.x - scale * .24, baseY - scale * 1.55, scale * .32, scale * .38);
        ctx.fillStyle = "#f4f0c0";
        ctx.fillRect(p.x + scale * .14, baseY - scale * 1.55, scale * .1, scale * .7);
      } else if (prop.type === "sofa") {
        ctx.fillStyle = "#4a221b";
        ctx.fillRect(p.x - scale * .8, baseY - scale * .92, scale * 1.6, scale * .48);
        ctx.fillRect(p.x - scale * .68, baseY - scale * 1.24, scale * 1.36, scale * .42);
        ctx.fillStyle = "#2c120f";
        ctx.fillRect(p.x - scale * .88, baseY - scale * .98, scale * .16, scale * .54);
        ctx.fillRect(p.x + scale * .72, baseY - scale * .98, scale * .16, scale * .54);
      } else if (prop.type === "hotelTable") {
        ctx.fillStyle = "#3a1f18";
        ctx.fillRect(p.x - scale * .9, baseY - scale * .82, scale * 1.8, scale * .26);
        ctx.fillRect(p.x - scale * .72, baseY - scale * .56, scale * .12, scale * .56);
        ctx.fillRect(p.x + scale * .6, baseY - scale * .56, scale * .12, scale * .56);
      } else if (prop.type === "wardrobe") {
        ctx.fillStyle = "#331913";
        ctx.fillRect(p.x - scale * .48, baseY - scale * 2.05, scale * .96, scale * 1.72);
        ctx.strokeStyle = "#72442d";
        ctx.strokeRect(p.x - scale * .42, baseY - scale * 1.96, scale * .84, scale * 1.55);
        ctx.fillStyle = "#c49a63";
        ctx.beginPath(); ctx.arc(p.x + scale * .1, baseY - scale * 1.18, scale * .035, 0, Math.PI * 2); ctx.fill();
      } else if (prop.type === "portrait") {
        ctx.fillStyle = "#2a150f";
        ctx.fillRect(p.x - scale * .38, baseY - scale * 1.85, scale * .76, scale * .92);
        ctx.fillStyle = "#9c785a";
        ctx.fillRect(p.x - scale * .29, baseY - scale * 1.75, scale * .58, scale * .72);
        ctx.fillStyle = "#1b0a08";
        ctx.beginPath(); ctx.arc(p.x, baseY - scale * 1.42, scale * .16, 0, Math.PI * 2); ctx.fill();
      } else if (prop.type === "lamp") {
        ctx.fillStyle = "#24120d";
        ctx.fillRect(p.x - scale * .06, baseY - scale * 1.55, scale * .12, scale * 1.2);
        ctx.fillStyle = "rgba(255,190,100,.75)";
        ctx.beginPath(); ctx.arc(p.x, baseY - scale * 1.6, scale * .24, 0, Math.PI * 2); ctx.fill();
      } else if (prop.type === "door") {
        ctx.fillStyle = "#3a1f18";
        ctx.fillRect(p.x - scale * .38, baseY - scale * 1.95, scale * .76, scale * 1.55);
        ctx.fillStyle = "#d7b073";
        ctx.beginPath(); ctx.arc(p.x + scale * .22, baseY - scale * 1.18, scale * .045, 0, Math.PI * 2); ctx.fill();
      } else if (prop.type === "outlet") {
        ctx.fillStyle = "#e5d680";
        ctx.fillRect(p.x - scale * .22, baseY - scale * 1.35, scale * .44, scale * .32);
        ctx.fillStyle = "#302810";
        ctx.fillRect(p.x - scale * .09, baseY - scale * 1.25, scale * .04, scale * .12);
        ctx.fillRect(p.x + scale * .05, baseY - scale * 1.25, scale * .04, scale * .12);
      } else if (prop.type === "stain") {
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(72,54,20,.45)";
        ctx.beginPath();
        ctx.ellipse(p.x, baseY - scale * .1, scale * .55, scale * .17, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function projectPoint(px, py) {
      const dx = px - player.x;
      const dy = py - player.y;
      const dist = Math.hypot(dx, dy);
      let angle = Math.atan2(dy, dx) - player.a;
      while (angle < -Math.PI) angle += Math.PI * 2;
      while (angle > Math.PI) angle -= Math.PI * 2;
      const fov = Math.PI / 3.1;
      if (Math.abs(angle) > fov / 2 || dist < .1) return null;
      return {
        x: W / 2 + (angle / (fov / 2)) * W / 2,
        y: H / 2,
        dist
      };
    }

    function hasLineOfSight(px, py) {
      const dx = px - player.x;
      const dy = py - player.y;
      const dist = Math.hypot(dx, dy);
      for (let d = .1; d < dist; d += .08) {
        if (wallAt(player.x + dx / dist * d, player.y + dy / dist * d)) return false;
      }
      return true;
    }

    function drawExit() {
      if (!hasLineOfSight(exit.x, exit.y)) return;
      const p = projectPoint(exit.x, exit.y);
      if (!p || p.dist > 10) return;
      const h = H / p.dist * .75;
      const w = h * .45;
      const alpha = Math.max(0, 1 - p.dist / 10);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = "rgba(255,40,40,.9)";
      ctx.shadowBlur = 34;
      ctx.fillStyle = "#491313";
      ctx.fillRect(p.x - w / 2, p.y - h / 2, w, h);
      ctx.fillStyle = "#ff4141";
      ctx.fillRect(p.x - w / 2 + w * .12, p.y - h / 2 + h * .12, w * .76, h * .76);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = alpha * .55;
      ctx.fillStyle = "rgba(255, 220, 160, .8)";
      ctx.fillRect(p.x - w * .22, p.y - h * .38, w * .44, h * .08);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ffe0a0";
      ctx.beginPath();
      ctx.arc(p.x + w * .25, p.y, Math.max(2, h * .025), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPathMarkers() {
      ctx.save();
      for (let i = 5; i < guaranteedPath.length; i += 6) {
        const cell = guaranteedPath[i];
        const px = cell.x + .5;
        const py = cell.y + .5;
        if (!hasLineOfSight(px, py)) continue;
        const p = projectPoint(px, py);
        if (!p || p.dist > 6.5) continue;
        const size = Math.max(5, H / p.dist * .035);
        const alpha = Math.max(0, .55 - p.dist / 13);
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "rgba(170,255,150,.75)";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "rgba(160,255,130,.9)";
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + size * 2.2);
        ctx.lineTo(p.x - size, p.y + size * 3.6);
        ctx.lineTo(p.x + size, p.y + size * 3.6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEntities() {
      for (const entity of entities) drawEntity(entity);
    }

    function drawEntity(entity) {
      if (!hasLineOfSight(entity.x, entity.y)) return;
      const p = projectPoint(entity.x, entity.y);
      if (!p || p.dist > 8) return;
      const h = H / p.dist * .7;
      const alpha = Math.max(0, .8 - p.dist / 9);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = "rgba(0,0,0,.8)";
      ctx.shadowBlur = 22;
      ctx.fillStyle = entity.kind === 1 ? "#111312" : "#050505";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + h * .08, h * (entity.kind === 2 ? .12 : .18), h * .48, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 8;
      ctx.fillStyle = entity.kind === 2 ? "#ff7272" : "#f7ffb0";
      ctx.beginPath();
      ctx.arc(p.x - h * .055, p.y - h * .16, Math.max(2, h * .018), 0, Math.PI * 2);
      ctx.arc(p.x + h * .055, p.y - h * .16, Math.max(2, h * .018), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawLighting() {
      const cfg = level();
      const g = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, player.flashlight ? Math.max(W, H) * .62 : Math.max(W, H) * .35);
      g.addColorStop(0, "rgba(255, 248, 170, 0)");
      g.addColorStop(.45, "rgba(0, 0, 0, .08)");
      g.addColorStop(1, player.flashlight ? `rgba(0, 0, 0, ${cfg.fog})` : "rgba(0, 0, 0, .88)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      if (player.flashlight) {
        const cone = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * .45);
        cone.addColorStop(0, "rgba(255, 249, 186, .22)");
        cone.addColorStop(1, "rgba(255, 249, 186, 0)");
        ctx.fillStyle = cone;
        ctx.fillRect(0, 0, W, H);
      }

      ctx.globalAlpha = .08 + currentLevel * .018;
      ctx.fillStyle = "rgba(210,220,190,1)";
      for (let i = 0; i < 18; i++) {
        const x = (Math.sin(i * 91.7 + performance.now() * .0003) * .5 + .5) * W;
        const y = (Math.cos(i * 53.1 + performance.now() * .0002) * .5 + .5) * H;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;

      const fearAlpha = Math.min(.4, player.fear * .35);
      if (fearAlpha > .02) {
        ctx.fillStyle = `rgba(80,0,0,${fearAlpha})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawNoise() {
      const amount = 420 + currentLevel * 120 + player.fear * 1000;
      ctx.globalAlpha = .035 + currentLevel * .006 + player.fear * .035;
      ctx.fillStyle = "#fff";
      for (let i = 0; i < amount; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        ctx.fillRect(x, y, Math.random() * 2, Math.random() * 2);
      }
      ctx.globalAlpha = 1;
    }

    function drawMiniMap() {
      const size = 150;
      const s = size / mapW;
      const x0 = W - size - 18;
      const y0 = 18;
      ctx.save();
      ctx.globalAlpha = .82;
      ctx.fillStyle = "rgba(0,0,0,.48)";
      ctx.fillRect(x0 - 8, y0 - 8, size + 16, size + 16);
      for (let y = 0; y < mapH; y++) {
        for (let x = 0; x < mapW; x++) {
          ctx.fillStyle = map[y][x] ? "#5b5324" : "#d5c56a";
          ctx.fillRect(x0 + x * s, y0 + y * s, s - .5, s - .5);
        }
      }
      if (guaranteedPath.length) {
        ctx.globalAlpha = .62;
        ctx.strokeStyle = "#a9ff88";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < guaranteedPath.length; i++) {
          const p = guaranteedPath[i];
          const px = x0 + (p.x + .5) * s;
          const py = y0 + (p.y + .5) * s;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.globalAlpha = .82;
        ctx.lineWidth = 1;
      }
      ctx.fillStyle = "#31414a";
      ctx.globalAlpha = .88;
      for (const prop of props) {
        if (!prop.solid) continue;
        const r = Math.max(2.5, prop.radius * s);
        ctx.fillRect(x0 + prop.x * s - r, y0 + prop.y * s - r, r * 2, r * 2);
      }
      ctx.globalAlpha = .82;
      ctx.fillStyle = "#ff4040";
      ctx.fillRect(x0 + exit.x * s - 3, y0 + exit.y * s - 3, 6, 6);
      ctx.fillStyle = "#050505";
      for (const entity of entities) {
        ctx.beginPath();
        ctx.arc(x0 + entity.x * s, y0 + entity.y * s, 3.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#85ff8c";
      ctx.beginPath();
      ctx.arc(x0 + player.x * s, y0 + player.y * s, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#85ff8c";
      ctx.beginPath();
      ctx.moveTo(x0 + player.x * s, y0 + player.y * s);
      ctx.lineTo(x0 + (player.x + Math.cos(player.a) * .9) * s, y0 + (player.y + Math.sin(player.a) * .9) * s);
      ctx.stroke();
      ctx.restore();
    }

    function move(dx, dy) {
      const nx = player.x + dx;
      const ny = player.y + dy;
      if (!blockedAt(nx, player.y, .18)) player.x = nx;
      if (!blockedAt(player.x, ny, .18)) player.y = ny;
    }

    function update(dt) {
      if (!running || !player.alive || player.won) return;

      const run = keys.has("Shift");
      const speed = (run ? 3.0 : 1.75) * dt;
      let moving = false;
      if (keys.has("q")) player.w = Math.max(-1, player.w - dt * .85);
      if (keys.has("e")) player.w = Math.min(1, player.w + dt * .85);
      foldPulse = Math.max(0, foldPulse - dt * 1.7);
      foldCooldown = Math.max(0, foldCooldown - dt);
      if (keys.has("w")) { move(Math.cos(player.a) * speed, Math.sin(player.a) * speed); moving = true; }
      if (keys.has("s")) { move(-Math.cos(player.a) * speed, -Math.sin(player.a) * speed); moving = true; }
      if (keys.has("a")) { move(Math.cos(player.a - Math.PI / 2) * speed, Math.sin(player.a - Math.PI / 2) * speed); moving = true; }
      if (keys.has("d")) { move(Math.cos(player.a + Math.PI / 2) * speed, Math.sin(player.a + Math.PI / 2) * speed); moving = true; }
      if (keys.has("ArrowLeft")) player.a -= 2.3 * dt;
      if (keys.has("ArrowRight")) player.a += 2.3 * dt;

      if (moving) player.bob += (run ? 13 : 8) * dt;
      player.battery -= dt * (player.flashlight ? 1.65 + currentLevel * .22 : .38) + (run ? dt * .25 : 0) + Math.abs(player.w) * dt * .22 + foldPulse * dt * .45;
      player.battery = Math.max(0, player.battery);

      let closestDist = Infinity;
      for (const entity of entities) {
        entity.t += dt;
        const distToEntity = Math.hypot(entity.x - player.x, entity.y - player.y);
        closestDist = Math.min(closestDist, distToEntity);
        if (entity.t > .14) {
          entity.t = 0;
          const dx = player.x - entity.x;
          const dy = player.y - entity.y;
          const d = Math.hypot(dx, dy) || 1;
          const chase = distToEntity < 7.5 + currentLevel * .45 || player.battery < 30;
          const jitter = chase ? 0 : Math.sin(performance.now() * .001 + entity.kind) * 1.8;
          const sp = (chase ? .07 : .028) * entity.speed;
          const tx = entity.x + (dx / d * Math.cos(jitter) - dy / d * Math.sin(jitter)) * sp;
          const ty = entity.y + (dx / d * Math.sin(jitter) + dy / d * Math.cos(jitter)) * sp;
          if (!blockedAt(tx, entity.y, .16)) entity.x = tx;
          if (!blockedAt(entity.x, ty, .16)) entity.y = ty;
        }
      }
      player.fear = Math.max(0, Math.min(1, 1 - closestDist / 9));

      const exitDist = Math.hypot(exit.x - player.x, exit.y - player.y);
      distanceText.textContent = exitDist < 4 ? "很近" : exitDist < 9 ? "接近" : "遥远";
      const dimensionState = Math.abs(player.w) > .65 ? "4D 错位" : Math.abs(player.w) > .25 ? "维度偏移" : "";
      statusText.textContent = player.fear > .72 ? "被注视" : player.battery < 20 ? "低电量" : dimensionState || (currentLevel === 4 ? "较安全" : currentLevel >= 3 ? "不稳定" : "迷失");
      dimensionText.textContent = `${player.w >= 0 ? "+" : ""}${player.w.toFixed(2)}`;
      batteryBar.style.width = player.battery + "%";
      batteryBar.style.background = player.battery < 20 ? "linear-gradient(90deg,#ff4a4a,#ffb14a)" : "linear-gradient(90deg,#e9ff74,#70ff9b)";

      if (exitDist < .75) advanceLevel();
      if (player.battery <= 0) end(false, "手电熄灭了。荧光灯的嗡鸣突然停止，黑暗里有东西替你呼吸。");
      if (closestDist < .55) end(false, "你没有回头，但它已经站在你身后。");

      updateAudio(closestDist);
    }

    function render(t) {
      const dt = Math.min(.05, (t - lastTime) / 1000 || 0);
      lastTime = t;
      if (dt > .034) qualityScale = Math.max(.58, qualityScale - .035);
      else if (dt < .021) qualityScale = Math.min(1, qualityScale + .018);
      update(dt);
      draw3D();
      if (running) requestAnimationFrame(render);
    }

    function reset(newRun = true) {
      if (newRun) currentLevel = 0;
      makeMap();
      player = {
        x: 1.5,
        y: 1.5,
        a: 0,
        battery: 100,
        flashlight: true,
        alive: true,
        won: false,
        bob: 0,
        fear: 0,
        w: 0
      };
      foldPulse = 0;
      foldCooldown = 0;
      endPanel.classList.add("hidden");
      hint.style.opacity = "1";
      setTimeout(() => hint.style.opacity = ".15", 7000);
    }

    function advanceLevel() {
      if (currentLevel >= levels.length - 1) {
        end(true, "你穿过最后一扇门，荧光灯声逐渐远去。你暂时逃出了后室。");
        return;
      }
      currentLevel++;
      makeMap();
      player.x = 1.5;
      player.y = 1.5;
      player.a = 0;
      player.w = 0;
      player.battery = Math.min(100, player.battery + 18);
      player.fear = 0;
      statusText.textContent = "进入新层级";
      hint.textContent = `你进入了 ${level().name}。Q/E 可改变第四维度 W，R 可短暂折叠空间，寻找红色出口门。`;
      hint.style.opacity = "1";
      setTimeout(() => hint.style.opacity = ".15", 5000);
    }

    function start() {
      reset(true);
      menu.classList.add("hidden");
      running = true;
      lastTime = performance.now();
      setupAudio();
      canvas.requestPointerLock?.();
      requestAnimationFrame(render);
    }

    function end(won, text) {
      player.alive = false;
      player.won = won;
      running = false;
      endTitle.textContent = won ? "你离开了" : "你迷失了";
      endText.textContent = text;
      endPanel.classList.remove("hidden");
      document.exitPointerLock?.();
      stopAudio();
    }

    function setupAudio() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const hum = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        hum.type = "sawtooth";
        hum.frequency.value = 55;
        gain.gain.value = .025;
        hum.connect(gain).connect(audioCtx.destination);
        hum.start();
        drone = { hum, gain };

        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = 92;
        g.gain.value = .001;
        osc.connect(g).connect(audioCtx.destination);
        osc.start();
        buzz = { osc, g };
      } catch (_) {}
    }

    function updateAudio(d) {
      if (!audioCtx || !buzz || !drone) return;
      const fear = Math.max(0, Math.min(1, 1 - d / 8));
      buzz.g.gain.setTargetAtTime(.003 + fear * .035, audioCtx.currentTime, .08);
      buzz.osc.frequency.setTargetAtTime(80 + fear * 70 + Math.sin(performance.now() * .01) * 8, audioCtx.currentTime, .04);
      drone.gain.gain.setTargetAtTime(.018 + fear * .02, audioCtx.currentTime, .1);
    }

    function stopAudio() {
      try {
        if (drone) {
          drone.gain.gain.setTargetAtTime(0, audioCtx.currentTime, .03);
          setTimeout(() => drone?.hum.stop(), 80);
        }
        if (buzz) {
          buzz.g.gain.setTargetAtTime(0, audioCtx.currentTime, .03);
          setTimeout(() => buzz?.osc.stop(), 80);
        }
      } catch (_) {}
      drone = null;
      buzz = null;
    }

    addEventListener("resize", resize);
    addEventListener("keydown", e => {
      keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key);
      if (e.key.toLowerCase() === "f" && running) player.flashlight = !player.flashlight;
      if (e.key.toLowerCase() === "r" && running && foldCooldown <= 0) {
        foldPulse = 1;
        foldCooldown = 4;
        player.w = Math.max(-1, Math.min(1, player.w + (Math.random() > .5 ? .38 : -.38)));
        hint.textContent = "空间被折叠了：附近墙体的第四维度切片正在重新排列。";
        hint.style.opacity = "1";
        setTimeout(() => hint.style.opacity = ".15", 2600);
      }
    });
    addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
    addEventListener("mousemove", e => {
      if (document.pointerLockElement === canvas && running) player.a += e.movementX * .0024;
    });
    addEventListener("click", () => {
      if (running && document.pointerLockElement !== canvas) canvas.requestPointerLock?.();
    });
    document.addEventListener("pointerlockchange", () => {
      mouseLocked = document.pointerLockElement === canvas;
    });

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("restartBtn").addEventListener("click", start);

    resize();
    makeMap();
    draw3D();
  </script>
</body>
</html>
