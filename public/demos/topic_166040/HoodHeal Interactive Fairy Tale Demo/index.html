<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodHeal - 情绪治愈互动童话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 30%, #F7DC6F 70%, #F5B041 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 1s ease;
        }

        /* 场景主题样式 */
        body.scene-happy {
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 30%, #90EE90 70%, #32CD32 100%);
        }
        body.scene-sad {
            background: linear-gradient(180deg, #708090 0%, #A9A9A9 30%, #C0C0C0 70%, #D3D3D3 100%);
        }
        body.scene-angry {
            background: linear-gradient(180deg, #CD5C5C 0%, #F08080 30%, #FA8072 70%, #FFA07A 100%);
        }
        body.scene-scared {
            background: linear-gradient(180deg, #2F4F4F 0%, #4682B4 30%, #5F9EA0 70%, #708090 100%);
        }
        body.scene-lonely {
            background: linear-gradient(180deg, #4169E1 0%, #6495ED 30%, #87CEEB 70%, #ADD8E6 100%);
        }
        body.scene-nervous {
            background: linear-gradient(180deg, #DAA520 0%, #F0E68C 30%, #FAFAD2 70%, #FFFFE0 100%);
        }

        /* 加载覆盖层 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        
        .loading-spinner {
            font-size: 48px;
            animation: bounce 1s ease-in-out infinite;
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #666;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* 场景插画容器 */
        .scene-illustration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -4;
            overflow: hidden;
        }

        /* 雨滴效果 */
        .rain {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.8));
            animation: rain 1s linear infinite;
        }
        @keyframes rain {
            0% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0.3; }
        }

        /* 雪花效果 */
        .snowflake {
            position: absolute;
            color: white;
            font-size: 14px;
            animation: snowfall 3s linear infinite;
        }
        @keyframes snowfall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.5; }
        }

        /* 落叶效果 */
        .leaf {
            position: absolute;
            color: #D2691E;
            font-size: 20px;
            animation: leafFall 4s ease-in-out infinite;
        }
        @keyframes leafFall {
            0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 1; }
            25% { transform: translateY(25vh) rotate(90deg) translateX(30px); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(-20px); }
            75% { transform: translateY(75vh) rotate(270deg) translateX(40px); }
            100% { transform: translateY(100vh) rotate(360deg) translateX(10px); opacity: 0.5; }
        }

        /* 萤火虫效果 */
        .firefly {
            position: absolute;
            color: #7FFF00;
            font-size: 16px;
            animation: fireflyGlow 2s ease-in-out infinite;
        }
        @keyframes fireflyGlow {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 花瓣飘落效果 */
        .petal {
            position: absolute;
            color: #FFB6C1;
            font-size: 18px;
            animation: petalFall 3s ease-in-out infinite;
        }
        @keyframes petalFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            50% { transform: translateY(50vh) rotate(180deg); }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.3; }
        }

        /* 星光闪烁 */
        .night-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: starTwinkle 2s ease-in-out infinite;
        }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* 月亮 */
        .moon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #F5F5DC 0%, #DAA520 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            top: 8%;
            right: 15%;
        }

        /* 闪电效果 */
        .lightning {
            position: absolute;
            width: 3px;
            background: #FFFF00;
            opacity: 0;
            animation: lightningFlash 3s ease-in-out infinite;
        }
        @keyframes lightningFlash {
            0%, 90%, 100% { opacity: 0; }
            91%, 93% { opacity: 1; }
            92% { opacity: 0; }
        }

        /* 彩虹 */
        .scene-rainbow {
            position: absolute;
            top: 20%;
            right: -5%;
            width: 250px;
            height: 125px;
            background: linear-gradient(135deg, 
                #FF0000 0%, #FF7F00 14%, #FFFF00 28%, 
                #00FF00 42%, #0000FF 57%, #4B0082 71%, #9400D3 85%);
            border-radius: 125px 125px 0 0;
            opacity: 0;
            transform: rotate(45deg);
            transition: opacity 1s ease;
        }
        .scene-rainbow.visible {
            opacity: 0.7;
        }

        /* 彩虹背景遮罩 */
        .scene-rainbow::before {
            content: '';
            position: absolute;
            width: 230px;
            height: 115px;
            background: inherit;
            background: linear-gradient(180deg, rgba(135, 206, 235, 0.9) 0%, rgba(152, 216, 200, 0.9) 100%);
            border-radius: 115px 115px 0 0;
            top: 5px;
            left: 5px;
        }

        /* 火焰动画 */
        @keyframes fireGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* 风动画 */
        @keyframes windBlow {
            0% { transform: translateX(-100px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        /* 云朵装饰 */
        .cloud {
            position: fixed;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            z-index: -1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud-1 {
            width: 80px;
            height: 40px;
            top: 10%;
            left: 10%;
            animation: float 8s ease-in-out infinite;
        }
        .cloud-1::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 15px;
        }
        .cloud-1::after {
            width: 30px;
            height: 30px;
            top: -15px;
            left: 40px;
        }
        .cloud-2 {
            width: 100px;
            height: 50px;
            top: 20%;
            right: 15%;
            animation: float 10s ease-in-out infinite 2s;
        }
        .cloud-2::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 20px;
        }
        .cloud-2::after {
            width: 35px;
            height: 35px;
            top: -20px;
            left: 55px;
        }
        .cloud-3 {
            width: 70px;
            height: 35px;
            top: 35%;
            left: 60%;
            animation: float 7s ease-in-out infinite 1s;
        }
        .cloud-3::before {
            width: 35px;
            height: 35px;
            top: -18px;
            left: 12px;
        }

        @keyframes float {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        /* 太阳 */
        .sun {
            position: fixed;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            top: 5%;
            right: 8%;
            z-index: -2;
            box-shadow: 0 0 60px 20px rgba(255, 215, 0, 0.4);
            animation: sunPulse 4s ease-in-out infinite;
        }
        .sun::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255, 215, 0, 0.3) 70%);
            border-radius: 50%;
        }
        @keyframes sunPulse {
            0%, 100% { box-shadow: 0 0 60px 20px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 80px 30px rgba(255, 215, 0, 0.5); }
        }

        /* 远山 */
        .mountains {
            position: fixed;
            bottom: 20%;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: -3;
        }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .mountain-1 {
            left: -5%;
            border-width: 0 150px 120px 150px;
            border-color: transparent transparent #7BA3B5 transparent;
        }
        .mountain-2 {
            left: 10%;
            border-width: 0 200px 180px 200px;
            border-color: transparent transparent #8FB9A8 transparent;
        }
        .mountain-3 {
            left: 40%;
            border-width: 0 180px 150px 180px;
            border-color: transparent transparent #7BA3B5 transparent;
        }
        .mountain-4 {
            right: -5%;
            border-width: 0 160px 140px 160px;
            border-color: transparent transparent #8FB9A8 transparent;
        }
        .mountain-5 {
            right: 20%;
            border-width: 0 120px 100px 120px;
            border-color: transparent transparent #7BA3B5 transparent;
        }

        /* 森林树木 */
        .forest {
            position: fixed;
            bottom: 15%;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: -2;
        }
        .tree {
            position: absolute;
            bottom: 0;
        }
        .tree-trunk {
            background: linear-gradient(90deg, #8B4513 0%, #654321 50%, #8B4513 100%);
            border-radius: 5px;
        }
        .tree-leaves {
            position: absolute;
            border-radius: 50% 50% 50% 50%;
        }
        .tree-1 { left: 2%; }
        .tree-1 .tree-trunk { width: 25px; height: 60px; }
        .tree-1 .tree-leaves { width: 80px; height: 80px; background: linear-gradient(180deg, #228B22 0%, #006400 100%); bottom: 50px; left: -28px; }
        .tree-1 .tree-leaves::before { content: ''; position: absolute; width: 60px; height: 60px; background: #228B22; border-radius: 50%; bottom: 40px; left: 10px; }
        
        .tree-2 { left: 8%; }
        .tree-2 .tree-trunk { width: 30px; height: 80px; }
        .tree-2 .tree-leaves { width: 100px; height: 100px; background: linear-gradient(180deg, #2E8B57 0%, #006400 100%); bottom: 70px; left: -35px; }
        .tree-2 .tree-leaves::before { content: ''; position: absolute; width: 70px; height: 70px; background: #2E8B57; border-radius: 50%; bottom: 50px; left: 15px; }
        
        .tree-3 { right: 5%; }
        .tree-3 .tree-trunk { width: 28px; height: 70px; }
        .tree-3 .tree-leaves { width: 90px; height: 90px; background: linear-gradient(180deg, #32CD32 0%, #006400 100%); bottom: 60px; left: -31px; }
        
        .tree-4 { right: 12%; }
        .tree-4 .tree-trunk { width: 22px; height: 55px; }
        .tree-4 .tree-leaves { width: 75px; height: 75px; background: linear-gradient(180deg, #228B22 0%, #006400 100%); bottom: 45px; left: -26px; }

        /* 草地 */
        .grass {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, #7CFC00 0%, #228B22 100%);
            z-index: -1;
            border-radius: 50% 50% 0 0;
        }
        .grass::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, #90EE90 0%, #7CFC00 100%);
            border-radius: 50%;
        }

        /* 花朵 */
        .flowers {
            position: fixed;
            bottom: 8%;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 0;
        }
        .flower {
            position: absolute;
            bottom: 0;
            animation: flowerSway 3s ease-in-out infinite;
        }
        .flower-center {
            width: 12px;
            height: 12px;
            background: #FFD700;
            border-radius: 50%;
            position: relative;
        }
        .flower-petal {
            position: absolute;
            width: 15px;
            height: 20px;
            background: currentColor;
            border-radius: 50%;
        }
        .flower-1 { left: 10%; color: #FF69B4; animation-delay: 0s; }
        .flower-1 .flower-petal:nth-child(1) { transform: rotate(0deg) translateY(-15px); }
        .flower-1 .flower-petal:nth-child(2) { transform: rotate(72deg) translateY(-15px); }
        .flower-1 .flower-petal:nth-child(3) { transform: rotate(144deg) translateY(-15px); }
        .flower-1 .flower-petal:nth-child(4) { transform: rotate(216deg) translateY(-15px); }
        .flower-1 .flower-petal:nth-child(5) { transform: rotate(288deg) translateY(-15px); }
        
        .flower-2 { left: 25%; color: #FF6347; animation-delay: 0.5s; }
        .flower-2 .flower-petal:nth-child(1) { transform: rotate(0deg) translateY(-12px); }
        .flower-2 .flower-petal:nth-child(2) { transform: rotate(72deg) translateY(-12px); }
        .flower-2 .flower-petal:nth-child(3) { transform: rotate(144deg) translateY(-12px); }
        .flower-2 .flower-petal:nth-child(4) { transform: rotate(216deg) translateY(-12px); }
        .flower-2 .flower-petal:nth-child(5) { transform: rotate(288deg) translateY(-12px); }
        
        .flower-3 { right: 15%; color: #FF1493; animation-delay: 1s; }
        .flower-3 .flower-petal:nth-child(1) { transform: rotate(0deg) translateY(-18px); }
        .flower-3 .flower-petal:nth-child(2) { transform: rotate(72deg) translateY(-18px); }
        .flower-3 .flower-petal:nth-child(3) { transform: rotate(144deg) translateY(-18px); }
        .flower-3 .flower-petal:nth-child(4) { transform: rotate(216deg) translateY(-18px); }
        .flower-3 .flower-petal:nth-child(5) { transform: rotate(288deg) translateY(-18px); }
        
        .flower-4 { right: 30%; color: #FF7F50; animation-delay: 1.5s; }
        .flower-4 .flower-petal:nth-child(1) { transform: rotate(0deg) translateY(-14px); }
        .flower-4 .flower-petal:nth-child(2) { transform: rotate(72deg) translateY(-14px); }
        .flower-4 .flower-petal:nth-child(3) { transform: rotate(144deg) translateY(-14px); }
        .flower-4 .flower-petal:nth-child(4) { transform: rotate(216deg) translateY(-14px); }
        .flower-4 .flower-petal:nth-child(5) { transform: rotate(288deg) translateY(-14px); }
        
        @keyframes flowerSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        /* 蝴蝶 */
        .butterflies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .butterfly {
            position: absolute;
            font-size: 24px;
            animation: butterflyFly 8s ease-in-out infinite;
        }
        .butterfly-1 { top: 25%; animation-delay: 0s; }
        .butterfly-2 { top: 45%; animation-delay: 2s; }
        .butterfly-3 { top: 35%; animation-delay: 4s; }
        .butterfly-4 { top: 55%; animation-delay: 6s; }
        
        @keyframes butterflyFly {
            0% { left: -5%; transform: scale(1); }
            25% { left: 25%; transform: scale(1.1) rotate(10deg); }
            50% { left: 50%; transform: scale(1); }
            75% { left: 75%; transform: scale(1.1) rotate(-10deg); }
            100% { left: 105%; transform: scale(1); }
        }

        /* 小鸟 */
        .birds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .bird {
            position: absolute;
            font-size: 20px;
            animation: birdFly 12s linear infinite;
        }
        .bird-1 { top: 15%; animation-delay: 0s; }
        .bird-2 { top: 30%; animation-delay: 4s; }
        .bird-3 { top: 20%; animation-delay: 8s; }
        
        @keyframes birdFly {
            0% { left: -5%; }
            100% { left: 105%; }
        }

        /* 彩虹 */
        .rainbow {
            position: fixed;
            top: 15%;
            right: -10%;
            width: 300px;
            height: 150px;
            background: linear-gradient(135deg, 
                #FF0000 0%, 
                #FF7F00 14%, 
                #FFFF00 28%, 
                #00FF00 42%, 
                #0000FF 57%, 
                #4B0082 71%, 
                #9400D3 85%);
            border-radius: 150px 150px 0 0;
            opacity: 0.6;
            z-index: -2;
            transform: rotate(45deg);
        }
        .rainbow::before {
            content: '';
            position: absolute;
            width: 280px;
            height: 140px;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
            border-radius: 140px 140px 0 0;
            top: 5px;
            left: 5px;
        }

        /* 蘑菇 */
        .mushrooms {
            position: fixed;
            bottom: 12%;
            left: 0;
            width: 100%;
            height: 40px;
            z-index: 0;
        }
        .mushroom {
            position: absolute;
            bottom: 0;
        }
        .mushroom-cap {
            width: 30px;
            height: 20px;
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            border-radius: 15px 15px 0 0;
            position: relative;
        }
        .mushroom-cap::before {
            content: '•';
            color: white;
            font-size: 8px;
            position: absolute;
            top: 5px;
            left: 8px;
        }
        .mushroom-cap::after {
            content: '•';
            color: white;
            font-size: 6px;
            position: absolute;
            top: 10px;
            left: 18px;
        }
        .mushroom-stem {
            width: 12px;
            height: 15px;
            background: linear-gradient(90deg, #F5F5DC 0%, #DEDEDE 50%, #F5F5DC 100%);
            margin: 0 auto;
        }
        .mushroom-1 { left: 5%; }
        .mushroom-1 .mushroom-cap { width: 35px; height: 25px; }
        .mushroom-1 .mushroom-cap { background: linear-gradient(180deg, #FF8C00 0%, #FF6600 100%); }
        .mushroom-2 { right: 8%; }
        .mushroom-3 { left: 45%; }
        .mushroom-3 .mushroom-cap { background: linear-gradient(180deg, #9932CC 0%, #8A2BE2 100%); }

        /* 星星装饰 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .star {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: twinkle 2s ease-in-out infinite;
        }
        .star:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .star:nth-child(2) { top: 25%; left: 70%; animation-delay: 0.3s; }
        .star:nth-child(3) { top: 40%; left: 30%; animation-delay: 0.6s; }
        .star:nth-child(4) { top: 55%; left: 85%; animation-delay: 0.9s; }
        .star:nth-child(5) { top: 70%; left: 15%; animation-delay: 1.2s; }
        .star:nth-child(6) { top: 80%; left: 60%; animation-delay: 1.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 2.5rem;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(255, 107, 107, 0.3);
            margin-bottom: 10px;
            animation: bounce 1s ease infinite alternate;
        }
        .header p {
            font-size: 1.1rem;
            color: #6c5ce7;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        /* 情绪输入卡片 */
        .emotion-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        .emotion-card:hover {
            transform: translateY(-5px);
        }
        .emotion-card h2 {
            color: #fd79a8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }
        .emotion-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .emotion-input {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #fab1a0;
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .emotion-input:focus {
            border-color: #fd79a8;
        }
        .generate-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #fd79a8 0%, #fdcb6e 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(253, 121, 168, 0.4);
        }
        .emotion-suggestions {
            text-align: center;
        }
        .emotion-suggestions span {
            display: inline-block;
            padding: 8px 16px;
            background: #ffeaa7;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .emotion-suggestions span:hover {
            background: #fdcb6e;
            transform: scale(1.1);
        }

        /* 故事卡片 */
        .story-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .story-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 角色展示 */
        .character-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .character {
            display: inline-block;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
            animation: characterBounce 1s ease infinite alternate;
        }
        .character-name {
            font-size: 1.2rem;
            color: #6c5ce7;
            font-weight: bold;
        }

        @keyframes characterBounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-5px) scale(1.02); }
        }

        /* 故事内容 */
        .story-content {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #2d3436;
            position: relative;
        }
        .story-content::before {
            content: '';
            position: absolute;
            top: 15px;
            left: -10px;
            width: 20px;
            height: 20px;
            background: #e8f5e9;
            border-radius: 50%;
        }
        .story-content::after {
            content: '';
            position: absolute;
            bottom: 15px;
            right: -10px;
            width: 15px;
            height: 15px;
            background: #c8e6c9;
            border-radius: 50%;
        }

        /* 选项按钮 */
        .choices-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .choice-btn {
            padding: 20px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .choice-btn::before {
            content: '🌱';
            margin-right: 10px;
        }
        .choice-btn:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(9, 132, 227, 0.4);
        }

        /* 结局卡片 */
        .ending-card {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            animation: endingGlow 2s ease-in-out infinite;
        }
        .ending-card h3 {
            font-size: 1.8rem;
            color: #e17055;
            margin-bottom: 20px;
        }
        .ending-card .ending-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #2d3436;
            margin-bottom: 25px;
        }
        .ending-card .ending-moral {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            color: #00b894;
            font-weight: bold;
        }
        .ending-card .ending-emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes endingGlow {
            0%, 100% { box-shadow: 0 5px 20px rgba(253, 203, 110, 0.3); }
            50% { box-shadow: 0 10px 30px rgba(253, 203, 110, 0.6); }
        }

        /* 重新开始按钮 */
        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #fd79a8 0%, #fdcb6e 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(253, 121, 168, 0.4);
        }

        /* 进度指示器 */
        .progress-bar {
            height: 5px;
            background: #ffeaa7;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fd79a8, #fdcb6e);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* 小动物角色样式 */
        .character-bear { background: linear-gradient(135deg, #e17055 0%, #d63031 100%); }
        .character-rabbit { background: linear-gradient(135deg, #fab1a0 0%, #fd79a8 100%); }
        .character-fox { background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%); }
        .character-owl { background: linear-gradient(135deg, #636e72 0%, #2d3436 100%); }
        .character-deer { background: linear-gradient(135deg, #fdcb6e 0%, #e17055 100%); }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .emotion-input-wrapper { flex-direction: column; }
            .choice-btn { font-size: 1rem; }
            .story-content { font-size: 1.1rem; }
        }
    </style>

            distraction: { emoji: '🎨', title: '转移之法', content: '{characterName}学会了用快乐的事情转移注意力，发现快乐能驱散恐惧。', moral: '💡 成长启示：关注美好事物，就能忘记烦恼和恐惧。' },
            selfcompassion: { emoji: '💝', title: '自我同情', content: '{characterName}学会了拥抱自己内心的小怪兽，懂得了接纳自己的恐惧。', moral: '💡 成长启示：接纳自己的不完美，才能真正地成长。' },
            celebration: { emoji: '🎊', title: '庆祝时刻', content: '{characterName}和朋友们一起庆祝，感受到了友谊的美好和生活的幸福。', moral: '💡 成长启示：珍惜每一个美好的时刻，快乐需要用心感受。' },
            wish: { emoji: '🌟', title: '美好愿望', content: '{characterName}许下了美好的愿望，相信只要心怀美好，愿望就会实现。', moral: '💡 成长启示：心怀美好，就能遇见美好。' },
            memories: { emoji: '📸', title: '珍贵回忆', content: '{characterName}把美好的时刻珍藏在心里，这些回忆将成为永远的财富。', moral: '💡 成长启示：珍惜每一次相聚，美好的回忆是人生的宝藏。' },
            fun: { emoji: '🎮', title: '欢乐时光', content: '{characterName}和朋友们度过了快乐的时光，明白了快乐在于分享和陪伴。', moral: '💡 成长启示：快乐很简单，和喜欢的人在一起就是幸福。' },
            appreciation: { emoji: '🙏', title: '感恩之心', content: '{characterName}学会了感恩，感谢生命中每一个美好的遇见。', moral: '💡 成长启示：感恩让生活更美好，珍惜拥有的一切。' }
        };

        // 当前故事状态
        let currentEmotion = '';
        let currentCharacter = null;
        let currentTemplate = null;
        let currentSceneIndex = 0;
        let currentTreasure = '';
        let totalScenes = 0;
        let currentStoryData = null; // 存储API返回的故事数据
        let previousScene = ''; // 上一个场景描述
        
        // API基础URL
        const API_BASE = 'http://localhost:3000/api';

        // 选择情绪
        function selectEmotion(emotion) {
            document.getElementById('emotionInput').value = emotion;
            generateStory();
        }

        // 生成故事（优先调用API）
        async function generateStory() {
            const emotion = document.getElementById('emotionInput').value.trim();
            
            if (!emotion) {
                alert('请输入你的情绪或选择一个情绪标签');
                return;
            }

            // 显示加载状态
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                // 尝试调用API生成故事
                const response = await fetch(`${API_BASE}/generate-story`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emotion })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    // API失败，使用本地回退
                    console.log('API调用失败，使用本地故事模板');
                    useLocalStory(emotion);
                } else {
                    // 使用API返回的故事
                    useAPIStory(data, emotion);
                }
            } catch (error) {
                // 网络错误，使用本地回退
                console.log('网络错误，使用本地故事模板:', error);
                useLocalStory(emotion);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // 使用API返回的故事
        function useAPIStory(data, emotion) {
            currentEmotion = emotion;
            currentCharacter = { name: data.character, emoji: data.characterEmoji };
            currentStoryData = data;
            previousScene = data.scene;
            
            // 显示故事卡片
            document.getElementById('emotionCard').style.display = 'none';
            document.getElementById('storyCard').classList.add('active');

            // 重置场景索引
            currentSceneIndex = 0;
            totalScenes = 5; // API故事大约5个场景

            // 更新进度条
            updateProgress();

            // 初始化角色显示
            updateCharacter();

            // 生成场景插画
            generateScene(emotion);

            // 显示故事开头（API返回的第一个场景）
            showScene(data.scene, data.choices);
        }

        // 使用本地故事模板
        function useLocalStory(emotion) {
            // 确定情绪类型（支持模糊匹配）
            let matchedEmotion = emotion;
            if (!storyTemplates[emotion]) {
                const emotionKeywords = {
                    '难过': ['伤心', '难过', '不开心', '委屈', '失落'],
                    '孤单': ['孤单', '孤独', '寂寞', '一个人'],
                    '生气': ['生气', '愤怒', '发火', '烦躁'],
                    '紧张': ['紧张', '害怕', '担心', '焦虑'],
                    '害怕': ['害怕', '恐惧', '胆小', '不安'],
                    '开心': ['开心', '快乐', '高兴', '幸福']
                };
                
                for (const [key, keywords] of Object.entries(emotionKeywords)) {
                    if (keywords.some(k => emotion.includes(k))) {
                        matchedEmotion = key;
                        break;
                    }
                }
                
                if (!storyTemplates[matchedEmotion]) {
                    matchedEmotion = '难过';
                }
            }

            currentEmotion = matchedEmotion;
            currentTemplate = storyTemplates[matchedEmotion];
            currentCharacter = characters[Math.floor(Math.random() * characters.length)];
            currentTreasure = currentTemplate.treasures[Math.floor(Math.random() * currentTemplate.treasures.length)];

            // 显示故事卡片
            document.getElementById('emotionCard').style.display = 'none';
            document.getElementById('storyCard').classList.add('active');

            // 重置场景索引
            currentSceneIndex = 0;
            totalScenes = currentTemplate.scenes.length + 1;

            // 更新进度条
            updateProgress();

            // 初始化角色显示
            updateCharacter();

            // 生成场景插画
            generateScene(matchedEmotion);

            // 显示故事开头
            showIntro();
        }

        // 根据情绪生成场景插画
        function generateScene(emotion) {
            // 清除之前的场景
            clearScene();
            
            const sceneContainer = document.getElementById('sceneIllustration');
            
            // 设置背景主题
            document.body.className = `scene-${emotion}`;
            
            // 根据情绪生成不同的场景效果
            switch(emotion) {
                case '难过':
                    createRain();
                    break;
                case '孤单':
                    createNightSky();
                    createFireflies();
                    break;
                case '生气':
                    createFireEffect();
                    createLightning();
                    break;
                case '紧张':
                    createLeaves();
                    createWindyEffect();
                    break;
                case '害怕':
                    createNightSky();
                    createMoon();
                    createFireflies();
                    break;
                case '开心':
                    createPetals();
                    createRainbow();
                    break;
            }
        }

        // 清除场景效果
        function clearScene() {
            const sceneContainer = document.getElementById('sceneIllustration');
            sceneContainer.innerHTML = '';
            document.body.className = '';
        }

        // 创建雨滴效果
        function createRain() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 30; i++) {
                const raindrop = document.createElement('div');
                raindrop.className = 'rain';
                raindrop.style.left = Math.random() * 100 + '%';
                raindrop.style.animationDelay = Math.random() * 1 + 's';
                raindrop.style.animationDuration = (0.8 + Math.random() * 0.4) + 's';
                container.appendChild(raindrop);
            }
        }

        // 创建夜空星星
        function createNightSky() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'night-star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        // 创建月亮
        function createMoon() {
            const container = document.getElementById('sceneIllustration');
            const moon = document.createElement('div');
            moon.className = 'moon';
            container.appendChild(moon);
        }

        // 创建萤火虫
        function createFireflies() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 15; i++) {
                const firefly = document.createElement('div');
                firefly.className = 'firefly';
                firefly.textContent = '✨';
                firefly.style.left = Math.random() * 100 + '%';
                firefly.style.top = Math.random() * 80 + '%';
                firefly.style.animationDelay = Math.random() * 3 + 's';
                firefly.style.fontSize = (12 + Math.random() * 8) + 'px';
                container.appendChild(firefly);
            }
        }

        // 创建落叶效果
        function createLeaves() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 10; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.textContent = '🍂';
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDelay = Math.random() * 4 + 's';
                leaf.style.animationDuration = (3 + Math.random() * 2) + 's';
                container.appendChild(leaf);
            }
        }

        // 创建花瓣效果
        function createPetals() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = '🌸';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDelay = Math.random() * 3 + 's';
                petal.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
                container.appendChild(petal);
            }
        }

        // 创建彩虹效果
        function createRainbow() {
            const container = document.getElementById('sceneIllustration');
            const rainbow = document.createElement('div');
            rainbow.className = 'scene-rainbow visible';
            container.appendChild(rainbow);
        }

        // 创建火焰效果
        function createFireEffect() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 8; i++) {
                const fire = document.createElement('div');
                fire.textContent = '🔥';
                fire.style.position = 'absolute';
                fire.style.bottom = '15%';
                fire.style.left = (10 + i * 12) + '%';
                fire.style.fontSize = (20 + Math.random() * 20) + 'px';
                fire.style.animation = 'fireGlow 0.5s ease-in-out infinite alternate';
                container.appendChild(fire);
            }
        }

        // 创建闪电效果
        function createLightning() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 3; i++) {
                const lightning = document.createElement('div');
                lightning.className = 'lightning';
                lightning.style.left = (30 + i * 20) + '%';
                lightning.style.top = '0';
                lightning.style.height = Math.random() * 200 + 100 + 'px';
                lightning.style.animationDelay = i * 1 + 's';
                container.appendChild(lightning);
            }
        }

        // 创建风效果
        function createWindyEffect() {
            const container = document.getElementById('sceneIllustration');
            for (let i = 0; i < 15; i++) {
                const wind = document.createElement('div');
                wind.textContent = '💨';
                wind.style.position = 'absolute';
                wind.style.top = (20 + Math.random() * 40) + '%';
                wind.style.fontSize = (16 + Math.random() * 12) + 'px';
                wind.style.animation = 'windBlow 2s linear infinite';
                wind.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(wind);
            }
        }

        // 更新角色显示
        function updateCharacter() {
            const characterDiv = document.getElementById('character');
            const characterNameDiv = document.getElementById('characterName');
            
            characterDiv.textContent = currentCharacter.emoji;
            characterDiv.className = 'character ' + currentCharacter.className;
            characterNameDiv.textContent = currentCharacter.name;
        }

        // 更新进度条
        function updateProgress() {
            const progressFill = document.getElementById('progressFill');
            const progress = ((currentSceneIndex + 1) / totalScenes) * 100;
            progressFill.style.width = progress + '%';
        }

        // 显示故事开头
        function showIntro() {
            const storyContent = document.getElementById('storyContent');
            const choicesSection = document.getElementById('choicesSection');
            const endingCard = document.getElementById('endingCard');
            
            // 隐藏结局卡片
            endingCard.style.display = 'none';
            
            // 替换模板变量
            let intro = currentTemplate.intro;
            intro = intro.replace(/{character}/g, currentCharacter.emoji);
            intro = intro.replace(/{characterName}/g, currentCharacter.name);
            intro = intro.replace(/{treasure}/g, currentTreasure);
            
            storyContent.innerHTML = intro;
            
            // 显示第一个场景的选项
            showChoices(0);
        }

        // 显示选项
        function showChoices(sceneIndex) {
            const choicesSection = document.getElementById('choicesSection');
            const scene = currentTemplate.scenes[sceneIndex];
            
            // 清空之前的选项
            choicesSection.innerHTML = '';
            
            // 创建选项按钮
            scene.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = choice.text.replace(/{characterName}/g, currentCharacter.name)
                                          .replace(/{treasure}/g, currentTreasure)
                                          .replace(/{oldCharacter}/g, getOldCharacter())
                                          .replace(/{friendCharacter}/g, getFriendCharacter())
                                          .replace(/{neighborCharacter}/g, getNeighborCharacter());
                btn.onclick = () => handleChoice(choice);
                btn.style.animationDelay = index * 0.1 + 's';
                choicesSection.appendChild(btn);
            });
            
            // 更新场景索引
            currentSceneIndex = sceneIndex;
            updateProgress();
        }

        // 获取老年角色
        function getOldCharacter() {
            const oldCharacters = ['猫头鹰智慧', '老乌龟爷爷', '大象伯伯'];
            return oldCharacters[Math.floor(Math.random() * oldCharacters.length)];
        }

        // 获取朋友角色
        function getFriendCharacter() {
            const friendCharacters = ['小兔子', '小松鼠', '小刺猬', '小狐狸'];
            return friendCharacters[Math.floor(Math.random() * friendCharacters.length)];
        }

        // 获取邻居角色
        function getNeighborCharacter() {
            const neighborCharacters = ['小熊猫', '小鹿', '小浣熊'];
            return neighborCharacters[Math.floor(Math.random() * neighborCharacters.length)];
        }

        // 处理选择（支持API和本地故事）
        function handleChoice(choice) {
            // 如果是API故事，继续调用API生成下一个场景
            if (currentStoryData) {
                continueAPIStory(choice);
            } else {
                // 本地故事处理
                handleLocalChoice(choice);
            }
        }

        // 继续API故事
        async function continueAPIStory(choice) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                const response = await fetch(`${API_BASE}/continue-story`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emotion: currentEmotion,
                        character: currentCharacter.name,
                        characterEmoji: currentCharacter.emoji,
                        previousScene: previousScene,
                        choice: choice.text
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    // API失败，使用本地结局
                    showEnding(choice.endingType || 'courage');
                } else {
                    // 更新场景数据
                    previousScene = data.scene;
                    currentSceneIndex++;
                    updateProgress();
                    
                    // 显示新场景
                    showScene(data.scene, data.choices);
                }
            } catch (error) {
                console.log('继续故事失败:', error);
                showEnding(choice.endingType || 'courage');
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // 处理本地故事选择
        function handleLocalChoice(choice) {
            const storyContent = document.getElementById('storyContent');
            const endingCard = document.getElementById('endingCard');
            
            // 如果是最后一个场景，显示结局
            if (choice.nextScene >= currentTemplate.scenes.length) {
                showEnding(choice.ending);
                return;
            }
            
            // 显示下一个场景内容
            const nextScene = currentTemplate.scenes[choice.nextScene];
            let content = nextScene.content;
            content = content.replace(/{character}/g, currentCharacter.emoji);
            content = content.replace(/{characterName}/g, currentCharacter.name);
            content = content.replace(/{treasure}/g, currentTreasure);
            content = content.replace(/{oldCharacter}/g, getOldCharacter());
            content = content.replace(/{friendCharacter}/g, getFriendCharacter());
            content = content.replace(/{neighborCharacter}/g, getNeighborCharacter());
            
            storyContent.innerHTML = content;
            
            // 显示下一个场景的选项
            setTimeout(() => {
                showChoices(choice.nextScene);
            }, 300);
        }

        // 显示场景内容（通用）
        function showScene(sceneText, choices) {
            const storyContent = document.getElementById('storyContent');
            const choicesSection = document.getElementById('choicesSection');
            const endingCard = document.getElementById('endingCard');
            
            endingCard.style.display = 'none';
            storyContent.innerHTML = sceneText;
            
            // 创建选项按钮
            choicesSection.innerHTML = '';
            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = choice.text;
                btn.onclick = () => {
                    // 检查是否是结局
                    if (choice.nextSceneId === 'ending' || currentSceneIndex >= 3) {
                        showAPIEnding(choice.endingType);
                    } else {
                        handleChoice(choice);
                    }
                };
                btn.style.animationDelay = index * 0.1 + 's';
                choicesSection.appendChild(btn);
            });
        }

        // 显示API结局
        async function showAPIEnding(endingType) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                const response = await fetch(`${API_BASE}/generate-ending`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emotion: currentEmotion,
                        character: currentCharacter.name,
                        characterEmoji: currentCharacter.emoji,
                        endingType: endingType
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    // 使用本地回退结局
                    showEnding(endingType);
                } else {
                    // 显示API结局
                    showEndingFromAPI(data);
                }
            } catch (error) {
                console.log('生成结局失败:', error);
                showEnding(endingType);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // 显示API返回的结局
        function showEndingFromAPI(endingData) {
            const endingCard = document.getElementById('endingCard');
            const choicesSection = document.getElementById('choicesSection');
            
            choicesSection.innerHTML = '';
            
            document.getElementById('endingEmoji').textContent = endingData.emoji;
            document.getElementById('endingTitle').textContent = endingData.title;
            document.getElementById('endingContent').innerHTML = endingData.content;
            document.getElementById('endingMoral').textContent = endingData.moral;
            
            endingCard.style.display = 'block';
            currentSceneIndex = totalScenes - 1;
            updateProgress();
        }

        // 显示结局
        function showEnding(endingKey) {
            const ending = endings[endingKey];
            const endingCard = document.getElementById('endingCard');
            const choicesSection = document.getElementById('choicesSection');
            
            // 隐藏选项
            choicesSection.innerHTML = '';
            
            // 更新结局内容
            document.getElementById('endingEmoji').textContent = ending.emoji;
            document.getElementById('endingTitle').textContent = ending.title;
            document.getElementById('endingContent').innerHTML = ending.content
                .replace(/{character}/g, currentCharacter.emoji)
                .replace(/{characterName}/g, currentCharacter.name);
            document.getElementById('endingMoral').textContent = ending.moral;
            
            // 显示结局卡片
            endingCard.style.display = 'block';
            
            // 更新进度条
            currentSceneIndex = totalScenes - 1;
            updateProgress();
        }

        // 重新开始
        function restartStory() {
            document.getElementById('storyCard').classList.remove('active');
            document.getElementById('emotionCard').style.display = 'block';
            document.getElementById('emotionInput').value = '';
            document.getElementById('progressFill').style.width = '0%';
        }
    </script>
</body>
</html>
