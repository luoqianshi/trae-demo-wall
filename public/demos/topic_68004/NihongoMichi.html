                </form>
                <div class="mt-6 text-center">
                  <a href="#" class="text-sm font-bold text-muted hover:text-primary" data-nav>先逛逛，暂不登录</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== PROFILE ====================
    function renderProfile() {
      const allLessons = getAllLessons();
      const completedLessons = allLessons.filter(l => isLessonCompleted(l.id)).length;
      const totalLessons = allLessons.length;
      const ttsMode = getTTSMode();
      const isLoggedIn = user.isLoggedIn;
      const userName = user.name || '学习者';
      const displayName = isLoggedIn ? userName : '学习者';
      const displayInitial = isLoggedIn ? (userName[0] || 'あ') : 'あ';

      const stats = [
        { label: '已学课程', value: completedLessons, icon: 'bookOpen', color: 'primary' },
        { label: '累计 XP', value: formatNumber(progress.xp), icon: 'gem', color: 'secondary' },
        { label: '连续学习', value: progress.streakDays, icon: 'flame', color: 'warning' },
        { label: '成就', value: progress.achievements.length, icon: 'trophy', color: 'warning' },
      ];

      const syncMessage = tempState.profileSyncMessage || '';
      const isSyncing = tempState.profileIsSyncing || false;
      const nameInputValue = tempState.profileNameInput !== undefined ? tempState.profileNameInput : userName;

      return `
        <div class="container page-section" style="max-width:48rem;">
          <div class="card p-6 mb-6 card-soft">
            <div class="flex items-center gap-4">
              <div style="width:5rem;height:5rem;flex-shrink:0;border-radius:1rem;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:1.875rem;font-weight:800;">${escapeHtml(displayInitial)}</div>
              <div class="flex-1">
                <h1 class="section-title-sm">${escapeHtml(displayName)}</h1>
                <p class="text-muted" style="font-size:0.875rem;">${isLoggedIn ? '一起努力通关 N1' : '登录后可备份学习进度'}</p>
              </div>
              ${!isLoggedIn ? `<a href="#login" class="btn btn-primary btn-sm" data-nav>登录</a>` : `<button class="btn btn-secondary btn-sm" data-action="logoutAndRender">退出登录</button>`}
            </div>

            ${isLoggedIn ? `
              <div style="margin-top:1rem; padding-top:1rem; border-top:2px solid var(--border);" class="space-y-3">
                <div class="flex items-center gap-2">
                  ${icon('user', 16, 'color:var(--muted);')}
                  <input type="text" value="${escapeHtml(nameInputValue)}" class="input" style="flex:1; padding:0.5rem 0.75rem; font-size:0.875rem; font-weight:700;" data-bind-state="profileNameInput" data-enter-action="updateProfileName">
                  <button data-action="updateProfileName" class="btn btn-primary btn-sm" style="padding:0.5rem 0.75rem;">修改</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button data-action="handleProfileSync" ${isSyncing ? 'disabled' : ''} class="btn btn-primary btn-sm" style="justify-content:center; gap:0.375rem; ${isSyncing ? 'opacity:0.6; cursor:not-allowed;' : ''}">
                    ${icon('cloud', 16)}
                    ${isSyncing ? '备份中...' : '备份到本地'}
                  </button>
                  <button data-action="handleProfileLoadCloud" ${isSyncing ? 'disabled' : ''} class="btn btn-secondary btn-sm" style="justify-content:center; gap:0.375rem; ${isSyncing ? 'opacity:0.6; cursor:not-allowed;' : ''}">
                    ${icon('cloudDownload', 16)}
                    从本地恢复
                  </button>
                </div>
                ${syncMessage ? `<div style="background:var(--primary-light); color:var(--primary); border-radius:0.75rem; padding:0.5rem; text-align:center; font-size:0.75rem; font-weight:800;">${escapeHtml(syncMessage)}</div>` : ''}
              </div>
            ` : ''}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            ${stats.map(s => `
              <div class="card p-4 text-center">
                <div style="width:2.5rem;height:2.5rem;margin:0 auto 0.5rem;border-radius:0.75rem;display:flex;align-items:center;justify-content:center;background:var(--${s.color}-light);color:var(--${s.color});">${icon(s.icon, 20)}</div>
                <div style="font-size:1.5rem;font-weight:800;">${s.value}</div>
                <div class="text-muted" style="font-size:0.75rem;">${s.label}</div>
              </div>
            `).join('')}
          </div>

          <div class="card p-5 mb-6">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div style="width:2.5rem;height:2.5rem;border-radius:0.75rem;background:var(--secondary-light);color:var(--secondary);display:flex;align-items:center;justify-content:center;">${icon('sparkles', 20)}</div>
                <div>
                  <h2 class="font-extrabold">修行</h2>
                  <p class="text-muted" style="font-size:0.75rem;">进入异世界文字 RPG</p>
                </div>
              </div>
              <a href="#xiuxing" class="btn btn-primary btn-sm" data-nav>进入修行 ${icon('arrowRight', 14)}</a>
            </div>
          </div>

          <div class="card p-5 mb-6">
            <h2 class="mb-4 font-extrabold" style="font-size:1.125rem;">学习进度</h2>
            <div class="mb-3">
              <div class="flex justify-between text-sm mb-1">
                <span class="text-muted">全部课程</span>
                <span class="font-bold">${completedLessons}/${totalLessons}</span>
              </div>
              <div class="progress-bar">
                <div style="width:${totalLessons > 0 ? (completedLessons / totalLessons) * 100 : 0}%; background:var(--primary);"></div>
              </div>
            </div>
            <a href="#stage/n5" class="flex items-center justify-between rounded-xl px-4 py-3 text-sm font-bold" style="background:var(--primary-light); color:var(--primary);" data-nav>
              <span>继续学习</span>
              ${icon('arrowRight', 16)}
            </a>
          </div>

          <div class="mb-6">
            <h2 class="mb-4 font-extrabold" style="font-size:1.125rem;">成就徽章</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${achievements.map(a => {
                const unlocked = progress.achievements.includes(a.id);
                return `
                  <div class="card p-4" style="background:${unlocked ? 'var(--card)' : 'var(--muted-light)'}; opacity:${unlocked ? 1 : 0.75};">
                    <div class="flex items-center gap-3">
                      <div style="width:3rem;height:3rem;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;background:${unlocked ? 'var(--warning-light)' : 'var(--border)'};color:${unlocked ? 'var(--warning)' : 'var(--muted)'};">${stageIcon(a.icon, 28)}</div>
                      <div class="flex-1">
                        <div class="font-bold ${unlocked ? '' : 'text-muted'}" style="font-size:0.875rem;">${escapeHtml(a.name)}</div>
                        <div class="text-muted" style="font-size:0.75rem;">${escapeHtml(a.description)}</div>
                      </div>
                      ${unlocked ? icon('checkCircle2', 20, 'color:var(--success);') : icon('lock', 20, 'color:var(--muted);')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card p-5 mb-6">
            <h2 class="mb-4 font-extrabold" style="font-size:1.125rem;">${icon('volume2', 18)} 设置</h2>
            <div class="mb-4">
              <div class="mb-2 text-sm font-bold">发音引擎</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button data-action="setTTSMode" data-arg0="baidu" class="btn ${ttsMode === 'baidu' ? 'btn-primary' : 'btn-ghost'}" style="font-size:0.875rem;">百度 TTS</button>
                <button data-action="setTTSMode" data-arg0="web" class="btn ${ttsMode === 'web' ? 'btn-primary' : 'btn-ghost'}" style="font-size:0.875rem;">浏览器语音</button>
              </div>
              <p class="text-muted mt-2" style="font-size:0.75rem; line-height:1.5;">默认使用浏览器语音，无需联网；系统会自动选用日语语音包，未安装时也会以默认语音朗读。如需更自然的在线发音，可切换为百度 TTS（网络不畅时会自动降级为浏览器语音）。</p>
            </div>
            <button class="btn btn-link w-full" data-action="resetAllProgress">${icon('rotateCcw', 16)} 重置学习进度</button>
          </div>
        </div>
      `;
    }

    window.getTTSMode = function() {
      // Backward compatibility: migrate legacy nm_tts_mode into progress
      if (!progress.ttsMode) {
        const legacy = safeGetItem('nm_tts_mode');
        progress.ttsMode = (legacy === 'baidu' || legacy === 'web') ? legacy : 'web';
        saveProgress();
      }
      return progress.ttsMode === 'baidu' ? 'baidu' : 'web';
    };

    window.setTTSMode = function(mode) {
      const normalized = mode === 'baidu' ? 'baidu' : 'web';
      progress.ttsMode = normalized;
      safeSetItem('nm_tts_mode', normalized);
      saveProgress();
      render();
    };

    window.updateProfileName = function() {
      const name = (tempState.profileNameInput || '').trim();
      if (!name) {
        tempState.profileSyncMessage = '昵称不能为空';
        render();
        return;
      }
      updateUserName(name);
      tempState.profileNameInput = '';
      tempState.profileSyncMessage = '昵称已更新';
      render();
    };

    window.handleProfileSync = async function() {
      tempState.profileIsSyncing = true;
      tempState.profileSyncMessage = '';
      render();
      const result = await syncProgress();
      if (result.success) {
        if (!progress.achievements.includes('sync_pioneer')) {
          progress.achievements.push('sync_pioneer');
          saveProgress();
        }
        tempState.profileSyncMessage = '进度已备份到本地';
      } else {
        tempState.profileSyncMessage = result.message || '备份失败';
      }
      tempState.profileIsSyncing = false;
      render();
    };

    window.handleProfileLoadCloud = async function() {
      tempState.profileIsSyncing = true;
      tempState.profileSyncMessage = '';
      render();
      const result = await loadCloudProgress();
      tempState.profileSyncMessage = result.success ? `已从本地恢复进度 ${result.updatedAt ? new Date(result.updatedAt).toLocaleString() : ''}`.trim() : (result.message || '本地没有备份或加载失败');
      tempState.profileIsSyncing = false;
      render();
    };

    function renderLeaderboard() {
      const tab = tempState.leaderboardTab || 'rank';
      const entries = getCombinedLeaderboard();
      const currentName = progress.user.isLoggedIn ? (progress.user.name || '学习者') : '游客学习者';
      const medals = ['🥇','🥈','🥉'];
      const currentRank = entries.findIndex(e => e.type === 'me') + 1;
      const me = entries.find(e => e.type === 'me');
      const hasFriends = progress.friends.length > 0;

      const rankBadgeStyle = (i) => {
        if (i === 0) return 'background:linear-gradient(135deg, #FFD700 0%, #FFC400 100%); color:#7C4A00; box-shadow:0 2px 6px rgba(255,196,0,0.35);';
        if (i === 1) return 'background:linear-gradient(135deg, #E8EAED 0%, #D1D5DB 100%); color:#4B5563; box-shadow:0 2px 6px rgba(156,163,175,0.25);';
        if (i === 2) return 'background:linear-gradient(135deg, #F5CBA7 0%, #E0A16E 100%); color:#7C3A12; box-shadow:0 2px 6px rgba(224,161,110,0.28);';
        return 'background:linear-gradient(180deg, #FFFFFF 0%, var(--muted-light) 100%); color:var(--muted); border:1.5px solid var(--border);';
      };

      const tabBtn = (key, label, svg) => {
        const active = tab === key;
        return `<button data-action="setLeaderboardTab" data-arg0="${key}" class="flex-1 rounded-2xl py-3 text-sm font-bold transition-all ${active ? 'bg-primary text-white shadow-soft' : 'text-muted hover:bg-primary-light hover:text-primary'}" style="border:none; cursor:pointer; ${active ? 'box-shadow:0 3px 10px rgba(244,114,164,0.32);' : ''}">${svg}<span style="margin-left:0.375rem;">${label}</span></button>`;
      };

      const renderEmptyState = (emoji, text, link, linkText) => `
        <div class="text-center py-10">
          <div style="font-size:3rem; margin-bottom:0.75rem; opacity:0.75;">${emoji}</div>
          <div class="text-muted" style="font-size:0.9375rem; margin-bottom:1.25rem;">${text}</div>
          ${link ? `<a href="${link}" class="btn btn-primary btn-sm" data-nav>${linkText}</a>` : ''}
        </div>
      `;

      const renderRankPanel = () => {
        return `
          ${me ? `
            <div class="card card-gradient p-5 mb-6" style="border-color:var(--primary);">
              <div class="flex items-center gap-4">
                <div class="avatar avatar-lg" style="${currentRank <= 3 && currentRank > 0 ? rankBadgeStyle(currentRank - 1) : 'background:var(--primary-gradient); color:white; box-shadow:0 3px 10px rgba(244,114,164,0.32);'}">${currentRank <= 3 && currentRank > 0 ? medals[currentRank-1] : `<span style="font-size:1.125rem;">#${currentRank}</span>`}</div>
                <div class="flex-1">
                  <div class="font-extrabold" style="font-size:1.125rem;">${escapeHtml(me.name)} <span class="text-muted" style="font-size:0.75rem; font-weight:500;">(我)</span></div>
                  <div class="text-muted" style="font-size:0.8125rem;">修行第 ${me.xiuxingChapter || 0} 章 · 小游戏 ${me.miniGames || 0} · 成就 ${me.achievements || 0}</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:1.375rem;font-weight:800; background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">${formatNumber(me.xp)}</div>
                  <div class="text-muted text-xs" style="font-weight:700;">XP</div>
                </div>
              </div>
            </div>
          ` : ''}

          <div class="card card-gradient p-5 mb-6">
            <div class="flex items-center justify-between mb-5">
              <h2 class="font-extrabold" style="font-size:1.125rem;">${icon('trophy', 18)} 排行榜</h2>
              <span class="badge badge-ghost">${hasFriends ? '好友 + NPC' : '仅 NPC'}</span>
            </div>
            ${entries.length === 0 ? renderEmptyState('🏆', '还没有记录，快去学习和闯关吧！', '#map', '去闯关') : `
              <div class="space-y-3">
                ${entries.slice(0, 20).map((e, i) => {
                  const isMe = e.type === 'me';
                  const isFriend = e.type === 'friend';
                  const isNpc = e.type === 'npc';
                  const onlineDot = isFriend && e.isOnline ? '<span style="display:inline-block;width:0.5rem;height:0.5rem;border-radius:50%;background:var(--success);margin-left:0.375rem;box-shadow:0 0 0 2px var(--card);"></span>' : '';
                  return `
                    <div class="list-item ${isMe ? 'bg-primary-light' : ''}" style="${isMe ? 'border-color:var(--primary); box-shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 3px 10px rgba(244,114,164,0.10);' : ''}">
                      <div style="width:2.25rem;height:2.25rem;border-radius:0.625rem;display:flex;align-items:center;justify-content:center;font-weight:800; flex-shrink:0; ${rankBadgeStyle(i)}">${medals[i] || (i + 1)}</div>
                      ${isNpc ? `<div class="avatar avatar-md avatar-soft" data-action="openNpcDetail" data-arg0="${e.id}" style="cursor:pointer; font-size:1.125rem; border:2px solid var(--border-strong);">${e.icon}</div>` : `<div class="avatar avatar-md ${isMe ? '' : 'avatar-soft'}" style="${isMe ? 'background:var(--primary-gradient); color:white; box-shadow:0 3px 10px rgba(244,114,164,0.25);' : ''}">${isMe ? '我' : '👤'}${onlineDot}</div>`}
                      <div class="flex-1" style="min-width:0;">
                        <div class="font-bold" style="font-size:0.9375rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                          ${isNpc ? `<button data-action="openNpcDetail" data-arg0="${e.id}" style="background:none;border:none;padding:0;cursor:pointer;color:var(--primary);font-weight:inherit;">${escapeHtml(e.rawName)}</button>` : escapeHtml(e.name)}
                          ${isNpc ? `<span class="badge badge-ghost" style="margin-left:0.375rem; padding:0.125rem 0.5rem; font-size:0.625rem;">NPC</span>` : ''}
                        </div>
                        <div class="text-muted" style="font-size:0.75rem;">修行第 ${e.xiuxingChapter || 0} 章 · 小游戏 ${e.miniGames || 0} · 成就 ${e.achievements || 0}</div>
                      </div>
                      <div style="text-align:right; white-space:nowrap;">
                        <div style="font-weight:800; color:var(--primary);">${formatNumber(e.xp)}</div>
                        <div class="text-muted text-xs">XP</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="text-center">
            <a href="#map" class="btn btn-primary" data-nav>去闯关 ${icon('arrowRight', 18)}</a>
          </div>
        `;
      };

      const renderFriendsPanel = () => {
        return `
          <div class="card card-gradient p-5 mb-6">
            <h2 class="mb-4 font-extrabold" style="font-size:1.125rem;">${icon('userPlus', 18)} 添加好友</h2>
            <div class="flex gap-2">
              <input type="text" id="friendSearchInput" class="input flex-1" placeholder="输入任意名字搜索并添加（演示模式）" data-enter-action="addFriendFromInput">
              <button class="btn btn-primary" data-action="addFriendFromInput">${icon('userPlus', 18)} 添加</button>
            </div>
            <p class="text-muted text-xs mt-3">目前为本地演示，任意名字都能添加成功。</p>
          </div>

          <div class="card card-gradient p-5 mb-6">
            <div class="flex items-center justify-between mb-5">
              <h2 class="font-extrabold" style="font-size:1.125rem;">${icon('users', 18)} 我的好友</h2>
              <span class="badge badge-ghost">${progress.friends.length} 位</span>
            </div>
            ${progress.friends.length === 0 ? renderEmptyState('👋', '还没有好友，快去添加一个吧！') : `
              <div class="space-y-3">
                ${progress.friends.map(f => `
                  <div class="list-item">
                    <div class="avatar avatar-md avatar-soft" style="position:relative; ${f.isOnline ? 'box-shadow:0 0 0 2px var(--card), 0 0 0 4px rgba(74,222,128,0.35);' : ''}">
                      👤
                      ${f.isOnline ? '<span style="position:absolute; bottom:0.125rem; right:0.125rem; width:0.75rem; height:0.75rem; border-radius:50%; background:var(--success); border:2px solid var(--card); box-shadow:0 0 0 1.5px var(--success-light);"></span>' : ''}
                    </div>
                    <div class="flex-1" style="min-width:0;">
                      <div class="font-bold" style="font-size:0.9375rem; display:flex; align-items:center;">${escapeHtml(f.name)} ${f.isOnline ? '<span class="badge badge-ghost" style="margin-left:0.375rem; font-size:0.625rem; padding:0.125rem 0.5rem;">在线</span>' : ''}</div>
                      <div class="text-muted" style="font-size:0.75rem;">${formatNumber(f.xp)} XP · 修行第 ${f.xiuxingChapter || 0} 章 · ${f.lastActive}</div>
                    </div>
                    <div class="flex gap-1">
                      <button class="btn btn-ghost btn-circle" style="width:2.25rem;height:2.25rem; font-size:1rem;" data-action="openFriendChat" data-arg0="${f.id}" title="聊天">💬</button>
                      <button class="btn btn-ghost btn-circle" style="width:2.25rem;height:2.25rem; font-size:1rem;" data-action="pokeFriend" data-arg0="${f.id}" title="拍一拍">👋</button>
                      <button class="btn btn-ghost btn-circle" style="width:2.25rem;height:2.25rem; font-size:1rem;" data-action="remindFriend" data-arg0="${f.id}" title="提醒学习">🔔</button>
                      <button class="btn btn-ghost btn-circle" style="width:2.25rem;height:2.25rem; font-size:1rem; color:var(--error);" data-action="removeFriend" data-arg0="${f.id}" title="删除好友">${icon('trash2', 16)}</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      };

      const renderNpcPanel = () => {
        const npcList = Object.keys(xiuxingNpcs).map(id => {
          const npc = xiuxingNpcs[id];
          const profile = getNpcProfile(id);
          const unlocked = isNpcUnlocked(id);
          return { id, npc, profile, unlocked };
        });
        const unlockedCount = npcList.filter(n => n.unlocked).length;
        return `
          <div class="card card-gradient p-5 mb-6">
            <div class="flex items-center justify-between mb-5">
              <h2 class="font-extrabold" style="font-size:1.125rem;">${icon('book', 18)} NPC 图鉴</h2>
              <span class="badge badge-gradient">已解锁 ${unlockedCount} / ${npcList.length}</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              ${npcList.map(({ id, npc, profile, unlocked }) => {
                const avatar = `<div style="width:3.5rem;height:3.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem; background:${unlocked ? 'linear-gradient(180deg, #FFFFFF 0%, var(--primary-light) 100%)' : 'var(--muted-light)'}; border:2px solid ${unlocked ? 'var(--border-strong)' : 'var(--border)'}; box-shadow:${unlocked ? '0 3px 10px rgba(244,114,164,0.14)' : 'none'}; font-size:1.75rem; filter:${unlocked ? 'none' : 'grayscale(100%) blur(1px)'};">${npc.icon}</div>`;
                const name = `<div class="font-bold text-sm" style="margin-bottom:0.25rem;">${unlocked ? escapeHtml(npc.nameCn) : '???'}</div>`;
                const subtitle = `<div class="text-muted text-xs" style="line-height:1.4;">${unlocked ? escapeHtml(profile.title) : `${icon('lock', 12)} 未解锁`}</div>`;
                if (unlocked) {
                  return `<button data-action="openNpcDetail" data-arg0="${id}" class="card card-hover p-4 text-center" style="cursor:pointer; padding:1.25rem 1rem; border-color:var(--border-strong);">${avatar}${name}${subtitle}</button>`;
                }
                return `<div class="card p-4 text-center opacity-50" style="padding:1.25rem 1rem; cursor:not-allowed;">${avatar}${name}${subtitle}</div>`;
              }).join('')}
            </div>
          </div>
        `;
      };

      const renderNpcDetailModal = () => {
        const npcId = tempState.npcDetailId;
        if (!npcId) return '';
        const profile = getNpcProfile(npcId);
        if (!profile) return '';
        return `
          <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="npcDetailTitle" style="z-index:60;" data-overlay-close="closeNpcDetail">

    function getNpcProfile(npcId) {
      const npc = xiuxingNpcs[npcId];
      if (!npc) return null;
      const profile = NPC_PROFILES[npcId] || {};
      return {
        id: npc.id,
        name: npc.name,
        nameCn: npc.nameCn,
        icon: npc.icon,
        category: npc.category,
        title: profile.title || '异世界居民',
        selfIntro: profile.selfIntro || `${npc.nameCn}是异世界的一位居民。`,
        lifeStory: profile.lifeStory || '关于这位角色的经历，仍在探索之中。',
        catchphrase: profile.catchphrase || '「……」',
      };
    }

    function getXiuxingNpcName(npcId) {
      const mode = tempState.xiuxingNpcNameMode || safeGetItem('nm_xiuxing_name_mode') || 'jp';
      const npc = npcId ? xiuxingNpcs[npcId] : undefined;
      if (!npc) return '';
      return mode === 'cn' ? npc.nameCn : npc.name;
    }

    window.toggleXiuxingNpcName = toggleXiuxingNpcName;
    function toggleXiuxingNpcName() {
      const current = tempState.xiuxingNpcNameMode || safeGetItem('nm_xiuxing_name_mode') || 'jp';
      const next = current === 'jp' ? 'cn' : 'jp';
      tempState.xiuxingNpcNameMode = next;
      safeSetItem('nm_xiuxing_name_mode', next);
      render();
    }

    function pickCombatQuestion(skillId, nodeQuestion) {
      const skill = xiuxingSkills[skillId];
      if (!skill || !skill.questions || skill.questions.length === 0) return nodeQuestion;
      const xp = progress.xiuxingProgress;
      if (!xp.questionRotation) xp.questionRotation = {};
      const idx = xp.questionRotation[skillId] || 0;
      const q = skill.questions[idx % skill.questions.length];
      xp.questionRotation[skillId] = (idx + 1) % skill.questions.length;
      return q;
    }

    function ensureXiuxingProgress() {
      if (!progress.xiuxingProgress) {
        progress.xiuxingProgress = {
          started: false,
          playerName: '',
          currentNode: 'intro',
          favor: 0,
          items: [],
          player: {
            name: '',
            level: 1,
            xp: 0,
            hp: 100,
            maxHp: 100,
            mp: 50,
            maxMp: 50,
            gold: 0,
            skills: ['normal_attack'],
            inventory: []
          },
          combat: null,
          log: [],
          questionRotation: {}
        };
      }
      if (!progress.xiuxingProgress.player) {
        progress.xiuxingProgress.player = {
          name: '',
          level: 1,
          xp: 0,
          hp: 100,
          maxHp: 100,
          mp: 50,
          maxMp: 50,
          gold: 0,
          skills: ['normal_attack'],
          inventory: []
        };
      }
      if (!progress.xiuxingProgress.log) progress.xiuxingProgress.log = [];
      if (!progress.xiuxingProgress.combat) progress.xiuxingProgress.combat = null;
      if (!progress.xiuxingProgress.items) progress.xiuxingProgress.items = [];
      if (!progress.xiuxingProgress.questionRotation) progress.xiuxingProgress.questionRotation = {};
      // Migrate old combat state to new shape.
      const combat = progress.xiuxingProgress.combat;
      if (combat && typeof combat.answered !== 'undefined' && typeof combat.pendingAction === 'undefined') {
        combat.pendingAction = null;
        combat.pendingPayload = undefined;
        combat.combatQuestion = null;
      }
    }

    function enterXiuxingNode(nodeId) {
      ensureXiuxingProgress();
      const xp = progress.xiuxingProgress;
      const node = xiuxingStory.find(n => n.id === nodeId) || xiuxingStory[0];
      if (!node) return;

      if (node.npcId) unlockNpc(node.npcId);

      if (!progress.achievements.includes('first_xiuxing')) {
        progress.achievements.push('first_xiuxing');
      }

      if (node.type === 'combat' && !xp.combat) {
        const enemyTemplate = xiuxingEnemies[node.enemy];
        if (enemyTemplate) {
          xp.combat = {
            instanceId: generateId(),
            enemyId: node.enemy,
            enemyHp: enemyTemplate.hp,
            pendingAction: null,
            pendingPayload: undefined,
            combatQuestion: null,
            feedback: null,
            log: ['遭遇了 ' + enemyTemplate.name + '！']
          };
        }
      }

      if (node.type === 'spell') {
        const state = tempState.xiuxingState || {};
        if (!state.spellQuestion) {
          state.spellQuestion = pickCombatQuestion(node.spell);
          tempState.xiuxingState = state;
        }
      }

      saveProgress();
    }

    function prepareXiuxingRoute() {
      ensureXiuxingProgress();
      const xp = progress.xiuxingProgress;
      if (xp.started) {
        const nodeId = tempState.xiuxingNode || xp.currentNode || 'intro';
        enterXiuxingNode(nodeId);
      }
    }

              <span class="badge badge-ghost" style="color:var(--primary); font-size:0.95rem; padding:0.5rem 0.85rem;">异世界文字 RPG</span>
            </div>

            <div class="card card-gradient p-6 sm:p-8 text-center" style="max-width:36rem; margin:0 auto; border-color:var(--primary);">
              <div class="avatar avatar-xl" style="margin:0 auto 1.5rem; background:var(--primary-gradient); color:white; box-shadow:0 8px 24px rgba(244,114,164,0.32);">${icon('sparkles', 32)}</div>
              <div>
                <h2 class="section-title-sm" style="font-size:1.625rem; background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; color:transparent;">欢迎来到修行世界</h2>
                <p class="section-subtitle mt-2">你即将被召唤到异世界。在这里，主角的战斗、对话、魔法都需要使用日语。</p>
              </div>

              <div class="text-left mt-6 space-y-2" style="max-width:24rem; margin-left:auto; margin-right:auto;">
                <label class="text-sm font-bold text-muted">主角名字</label>
                <div class="input flex items-center gap-2" style="padding:0.75rem 1rem; background:var(--card);">
                  ${icon('user', 20, 'color:var(--muted);')}
                  <input type="text" id="xiuxingName" value="${defaultName}" placeholder="输入主角名字" style="flex:1; background:transparent; font-size:1.125rem; font-weight:700; outline:none; border:none;">
                </div>
              </div>

              <button class="btn btn-primary btn-lg w-full mt-6" style="justify-content:center; gap:0.5rem;" data-action="startXiuxing">
                ${icon('sparkles', 20)} 开始异世界之旅
              </button>
            </div>
          </div>
        `;
      }

      const nodeId = tempState.xiuxingNode || xp.currentNode || 'intro';
      const node = xiuxingStory.find(n => n.id === nodeId) || xiuxingStory[0];
      const state = tempState.xiuxingState || {};

      const chapterTitle = getXiuxingChapterTitle(nodeId);
      return `
        ${tempState.xiuxingDeathPending ? renderXiuxingDeathModal() : ''}
        <div class="container page-section" style="max-width:72rem;">
          <div class="mb-8 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <a href="#profile" class="btn btn-ghost btn-circle" data-nav aria-label="返回个人资料">${icon('arrowLeft', 20)}</a>
              <span class="badge badge-ghost" style="color:var(--primary); font-size:0.95rem; padding:0.5rem 0.85rem;">${escapeHtml(chapterTitle)}</span>
            </div>
            <button class="btn btn-sm" data-action="resetXiuxing" style="background:rgba(255,255,255,0.85); border:1.5px solid var(--border-strong); color:var(--muted); box-shadow:var(--shadow-sm);">${icon('rotateCcw', 14)} 重置修行</button>
          </div>

          <div class="grid grid-cols-1 gap-6 lg:grid-cols-3 lg:gap-8">
            <div class="space-y-8 lg:col-span-2">
              ${renderXiuxingStoryLog(node, state.feedback)}
              ${node.type === 'combat' ? renderXiuxingCombatPanel(node) : renderXiuxingInteraction(node, state)}
            </div>
            <div class="space-y-6">
              ${renderXiuxingStatusPanel()}
              ${renderXiuxingNpcFavorPanel()}
              ${renderXiuxingInventoryPanel()}
            </div>
          </div>
        </div>
      `;
    }

    function getXiuxingChapterTitle(nodeId) {
      return xiuxingChapterMap[nodeId] || '修行之旅';
    }

    function formatXiuxingText(text) {
      if (!text) return '';
      const name = progress.xiuxingProgress && progress.xiuxingProgress.player ? (progress.xiuxingProgress.player.name || progress.xiuxingProgress.playerName || '冒险者') : '冒险者';
      return escapeHtml(text).replace(/\{playerName\}/g, escapeHtml(name));
    }

    window.startXiuxing = function() {
      const input = document.getElementById('xiuxingName');
      const name = input && input.value.trim() ? input.value.trim() : (progress.user.name || '冒险者');
      ensureXiuxingProgress();
      progress.xiuxingProgress.started = true;
      progress.xiuxingProgress.playerName = name;
      progress.xiuxingProgress.player.name = name;
      if (!progress.user.name) progress.user.name = name;
      saveProgress();
      enterXiuxingNode(progress.xiuxingProgress.currentNode || 'intro');
      render();
    };

    function renderXiuxingStoryLog(node, feedback) {
      const displayText = formatXiuxingText(node.text);
      const japanese = extractXiuxingDialogue(displayText);
      const speakerName = node.speaker ? getXiuxingNpcName(node.npcId) : '';
      const originalName = node.npcId && xiuxingNpcs[node.npcId] ? xiuxingNpcs[node.npcId].name : '';
      const npcIcon = node.npcId && xiuxingNpcs[node.npcId] ? xiuxingNpcs[node.npcId].icon : '';
      const canToggleName = node.npcId && xiuxingNpcs[node.npcId] && originalName !== xiuxingNpcs[node.npcId].nameCn;
      return `
        <div class="card card-elevated p-5 sm:p-6" style="min-height:260px; position:relative; overflow:hidden; border-color:var(--border-strong);">
          <div style="position:absolute; top:0; right:0; width:10rem; height:10rem; background:radial-gradient(circle, rgba(244,114,164,0.10) 0%, transparent 65%); pointer-events:none;"></div>
          <div class="mb-5 flex flex-wrap items-center gap-2">
            ${node.location ? `<span class="badge" style="background:var(--secondary-light);color:var(--secondary); box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;">${icon('mapPin', 12)} ${escapeHtml(node.location)}</span>` : ''}
            ${speakerName ? `
              <button type="button" data-action="toggleXiuxingNpcName" class="badge" style="background:var(--primary-gradient-soft);color:var(--primary); border:1.5px solid var(--border); cursor:pointer;" title="点击切换 NPC 名字显示语言" aria-label="切换 NPC 名字显示语言">
                ${npcIcon ? `<span style="margin-right:0.25rem;" aria-hidden="true">${npcIcon}</span>` : icon('messageCircle', 12)}
                <span>${escapeHtml(speakerName)}</span>
                ${canToggleName ? icon('languages', 10, 'opacity:0.7; margin-left:0.25rem;') : ''}
              </button>
            ` : ''}
            ${japanese ? `<button class="badge" style="background:var(--success-light);color:var(--success); border:1.5px solid var(--border); cursor:pointer; box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;" data-action="speak" data-arg0="${escapeHtml(japanese)}" aria-label="朗读日语">${icon('volume2', 12)} 朗读</button>` : ''}
          </div>
          <div class="text-base leading-relaxed" style="white-space:pre-line; position:relative;">${displayText.replace(/「([^」]+)」/g, '<span class="font-jp" style="color:var(--primary); font-weight:800; font-size:1.05em;">「$1」</span>')}</div>
          ${feedback ? `<div class="mt-5 rounded-2xl p-3 text-center text-sm font-extrabold" style="background:var(--warning-light); color:var(--warning-dark); border:1.5px solid var(--border);" aria-live="polite" aria-atomic="true">${escapeHtml(feedback)}</div>` : ''}
        </div>
      `;
    }

    function renderXiuxingStatusPanel() {
      const xp = progress.xiuxingProgress;
      const player = xp.player;
      const editing = tempState.xiuxingEditingName;
      const levelMaxXp = player.level * 100;
      const skills = player.skills.map(id => xiuxingSkills[id]).filter(Boolean);
      const hpPct = Math.min((player.hp / player.maxHp) * 100, 100);
      const mpPct = Math.min((player.mp / player.maxMp) * 100, 100);
      return `
        <div class="card card-gradient p-5 space-y-4" style="border-color:var(--border-strong);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-sm font-bold text-muted">${icon('user', 16)} 冒险者状态</div>
            <span class="badge badge-gradient">Lv ${player.level}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="avatar avatar-lg" style="font-size:1.25rem; background:var(--primary-gradient); color:white; box-shadow:0 4px 12px rgba(244,114,164,0.25);">${player.name && player.name.trim() ? escapeHtml(player.name.trim()[0]) : '?'}</div>
            <div class="flex-1" style="min-width:0;">
              ${editing ? `
                <div class="flex items-center gap-2">
                  <input type="text" id="xiuxingRenameInput" value="${escapeHtml(player.name || '')}" class="input" style="flex:1; padding:0.375rem 0.625rem; font-size:0.875rem;" data-enter-action="saveXiuxingName">
                  <button data-action="saveXiuxingName" class="btn btn-success btn-sm" style="padding:0.375rem 0.625rem;" aria-label="保存名字">${icon('check', 16)}</button>
                </div>
              ` : `
                <div class="flex items-center gap-2">
                  <span class="text-lg font-extrabold" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(player.name || '冒险者')}</span>
                  <button data-action="startXiuxingRename" class="btn btn-ghost btn-sm" style="padding:0.25rem 0.5rem; color:var(--muted);" aria-label="编辑主角名字">${icon('edit2', 14)}</button>
                </div>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-xs text-muted">XP ${player.xp} / ${levelMaxXp}</span>
                </div>
                <div class="progress-bar progress-bar-sm" style="margin-top:0.375rem;" role="progressbar" aria-valuemin="0" aria-valuemax="${levelMaxXp}" aria-valuenow="${player.xp}" aria-label="经验值"><div style="width:${Math.min((player.xp / levelMaxXp) * 100, 100)}%; background:linear-gradient(90deg, #FACC15, #F59E0B); border-radius:9999px;"></div></div>
              `}
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="rounded-2xl p-3" style="background:linear-gradient(180deg, #FFFFFF 0%, var(--error-light) 100%); border:1.5px solid var(--border); box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold" style="color:var(--error); display:flex; align-items:center; gap:0.25rem;">${icon('heart', 14)} HP</span>
                <span class="text-xs font-extrabold" style="color:var(--error);">${player.hp}/${player.maxHp}</span>
              </div>
              <div class="progress-bar" style="height:0.625rem; background:rgba(255,75,75,0.12);" role="progressbar" aria-valuemin="0" aria-valuemax="${player.maxHp}" aria-valuenow="${player.hp}" aria-label="生命值"><div style="width:${hpPct}%; background:linear-gradient(90deg, #FF8A8A, #FF4B4B); border-radius:9999px;"></div></div>
            </div>
            <div class="rounded-2xl p-3" style="background:linear-gradient(180deg, #FFFFFF 0%, var(--primary-light) 100%); border:1.5px solid var(--border); box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold" style="color:var(--primary); display:flex; align-items:center; gap:0.25rem;">${icon('zap', 14)} MP</span>
                <span class="text-xs font-extrabold" style="color:var(--primary);">${player.mp}/${player.maxMp}</span>
              </div>
              <div class="progress-bar" style="height:0.625rem; background:rgba(255,107,157,0.12);" role="progressbar" aria-valuemin="0" aria-valuemax="${player.maxMp}" aria-valuenow="${player.mp}" aria-label="魔法值"><div style="width:${mpPct}%; background:var(--primary-gradient); border-radius:9999px;"></div></div>
            </div>
          </div>
          <div class="flex items-center justify-between rounded-2xl px-4 py-3" style="background:linear-gradient(135deg, #FFFBE6 0%, #FFF4D6 100%); border:1.5px solid var(--border); box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;">
            <div class="flex items-center gap-2 text-sm font-bold" style="color:var(--warning-dark);">${icon('coins', 18)}<span>金币</span></div>
            <div class="text-lg font-extrabold" style="color:var(--warning);">${player.gold} G</div>
          </div>
          <div>
            <div class="mb-2 text-xs font-bold text-muted">已学会技能</div>
            <div class="flex flex-wrap gap-2">
              ${skills.length === 0 ? '<span class="text-xs text-muted">暂无技能</span>' : skills.map(s => `<span class="inline-flex items-center gap-1 rounded-xl px-2.5 py-1 text-xs font-bold" style="background:linear-gradient(180deg, #FFFFFF 0%, var(--primary-light) 100%);color:var(--primary); border:1.5px solid var(--border); box-shadow:var(--shadow-sm);">${icon('star', 12)} ${escapeHtml(s.name)}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderXiuxingInventoryPanel() {
      const xp = progress.xiuxingProgress;
      const inCombat = xp.combat && xp.combat.enemyHp > 0 && !xp.combat.feedback;
      if (xp.items.length === 0) return '';
      return `
        <div class="card p-5 space-y-3">
          <div class="flex items-center gap-2 text-sm font-bold text-muted">${icon('backpack', 16)} 道具</div>
          <div class="flex flex-wrap gap-2">
            ${xp.items.map((id, idx) => {
              const item = xiuxingItems[id];
              if (!item) return '';
              return `<button data-action="useXiuxingItem" data-arg0="${idx}" class="btn btn-success btn-sm" style="padding:0.375rem 0.625rem; background:var(--success-light); color:var(--success); box-shadow:none; border:none;">${item.icon} ${escapeHtml(item.name)}</button>`;
            }).join('')}
          </div>
          ${inCombat ? '<p class="text-xs text-muted">战斗中点击道具即可使用。</p>' : '<p class="text-xs text-muted">非战斗时使用道具恢复状态。</p>'}
        </div>
      `;
    }

    function renderXiuxingNpcFavorPanel() {
      const xp = progress.xiuxingProgress;
      const npcList = Object.values(xiuxingNpcs).map(npc => {
        const unlocked = isNpcUnlocked(npc.id);
        const base = npc.defaultAffection || 0;
        const bonus = npc.id === 'goddess' ? (xp.favor || 0) : Math.floor((xp.favor || 0) / 10);
        const affection = Math.max(0, Math.min(100, base + bonus));
        return { ...npc, unlocked, affection };
      });
      const categoryLabel = {
        life: '生活',
        party: '同伴',
        profession: '职业',
        antagonist: '敌对',
        hidden: '隐藏'
      };
      const categoryColor = {
        life: 'var(--primary)',
        party: 'var(--secondary)',
        profession: 'var(--warning)',
        antagonist: 'var(--error)',
        hidden: 'var(--muted)'
      };
      const categoryBg = {
        life: 'var(--primary-light)',
        party: 'var(--secondary-light)',
        profession: 'var(--warning-light)',
        antagonist: 'var(--error-light)',
        hidden: 'var(--muted-light)'
      };
      return `
        <div class="card card-gradient p-5 space-y-4" style="border-color:var(--border-strong);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-sm font-bold text-muted">${icon('heart', 16)} NPC 好感度</div>
            <span class="badge badge-gradient">${npcList.filter(n => n.unlocked).length} / ${npcList.length}</span>
          </div>
          <div class="space-y-3" style="max-height:22rem; overflow:auto; padding-right:0.25rem;">
            ${npcList.map(npc => `
              <button data-action="openNpcDetail" data-arg0="${npc.id}" class="w-full text-left rounded-2xl p-3 transition-all ${npc.unlocked ? 'bg-muted-light hover:bg-primary-light' : 'bg-muted-light opacity-60'}" style="border:1.5px solid ${npc.unlocked ? 'var(--border)' : 'transparent'}; cursor:pointer; box-shadow:0 1px 0 rgba(255,255,255,0.8) inset;" aria-label="${npc.unlocked ? escapeHtml(npc.nameCn) + '，好感度 ' + npc.affection + '%' : '未解锁 NPC'}">
                <div class="flex items-center gap-3">
                  <div class="avatar avatar-md avatar-soft" style="font-size:1.25rem; background:${npc.unlocked ? categoryBg[npc.category] || 'var(--primary-light)' : 'var(--muted-light)'}; color:${npc.unlocked ? categoryColor[npc.category] || 'var(--primary)' : 'var(--muted)'}; filter:${npc.unlocked ? 'none' : 'grayscale(100%) blur(1px)'}; border:2px solid ${npc.unlocked ? 'var(--border-strong)' : 'var(--border)'};">${npc.icon}</div>
                  <div class="flex-1" style="min-width:0;">
                    <div class="flex items-center justify-between">
                      <div class="font-bold text-sm" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${npc.unlocked ? escapeHtml(npc.nameCn) : '???'} <span class="text-muted font-normal text-xs">${npc.unlocked ? escapeHtml(npc.name) : ''}</span></div>
                      <span class="text-xs font-extrabold" style="color:var(--primary); white-space:nowrap;">${npc.affection}%</span>
                    </div>
                    <div class="flex items-center gap-2 mt-1.5">
                      <div class="progress-bar flex-1" style="height:0.5rem; background:var(--border);" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${npc.affection}" aria-label="${escapeHtml(npc.nameCn)} 好感度">
                        <div style="width:${npc.affection}%; background: ${npc.affection >= 80 ? 'linear-gradient(90deg, #4ADE80, #22C55E)' : npc.affection >= 40 ? 'var(--primary-gradient)' : 'linear-gradient(90deg, #FACC15, #F59E0B)'}; border-radius:9999px; box-shadow:0 0 8px rgba(244,114,164,0.12);"></div>
                      </div>
                    </div>
                    <div class="mt-2 flex items-center justify-between">
                      <span class="badge badge-ghost" style="font-size:0.625rem; padding:0.125rem 0.5rem; color:${categoryColor[npc.category] || 'var(--muted)'}; border-color:var(--border); background:${categoryBg[npc.category] || 'var(--background)'};">${escapeHtml(categoryLabel[npc.category] || npc.category)}</span>
                      ${!npc.unlocked ? `<span class="text-muted text-xs">${icon('lock', 12)} 未解锁</span>` : ''}
                    </div>
                  </div>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderXiuxingCombatPanel(node) {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (!combat) return '';
      const enemy = xiuxingEnemies[combat.enemyId];
      const player = xp.player;
      const q = combat.combatQuestion || node.question;

      let actionArea = '';
      if (combat.feedback) {
        actionArea = `
          <div class="card p-5" style="border-color:${combat.feedback.correct ? 'var(--success)' : 'var(--error)'}; background:${combat.feedback.correct ? 'var(--success-light)' : 'var(--error-light)'};" aria-live="polite" aria-atomic="true">
            <div class="text-center mb-3">
              <div style="font-size:2.25rem; margin-bottom:0.5rem;" aria-hidden="true">${combat.feedback.correct ? '✨' : '💥'}</div>
              <div class="text-sm font-bold" style="color:${combat.feedback.correct ? 'var(--success)' : 'var(--error)'}">${combat.feedback.correct ? '回答正确！' : '回答错误。'}</div>
            </div>
            <div class="mb-2 text-sm"><span class="font-bold">正确答案：</span><span class="font-jp">${escapeHtml(combat.feedback.correctAnswer)}</span></div>
            <div class="mb-4 text-xs text-muted">${escapeHtml(combat.feedback.explanation)}</div>
            <button class="btn btn-primary w-full" data-action="continueXiuxingCombat">继续</button>
          </div>
        `;
      } else if (combat.pendingAction === 'attack' || combat.pendingAction === 'skill') {
        if (q) {
          actionArea = `
            <div class="space-y-4">
              <div class="card card-elevated p-5 text-center text-lg font-bold" style="background:linear-gradient(135deg, var(--primary-light) 0%, #FFFFFF 100%); color:var(--primary); border-color:var(--primary);">${icon('swords', 20)} ${escapeHtml(q.prompt)}</div>
              <div class="grid grid-cols-1 gap-4" role="group" aria-label="战斗答题选项">
                ${q.options.map((opt, idx) => `<button class="option-btn" data-action="answerXiuxingCombat" data-arg0="${escapeHtml(opt)}"><span class="opt-marker">${String.fromCharCode(65 + idx)}</span><span>${escapeHtml(opt)}</span></button>`).join('')}
              </div>
            </div>
          `;
        }
      } else {
        const combatSkills = player.skills
          .map(id => xiuxingSkills[id])
          .filter(s => s && s.id !== 'normal_attack');
        const usableItems = xp.items
          .map((id, idx) => ({ ...xiuxingItems[id], idx }))
          .filter(i => i.effect === 'heal' || i.effect === 'mp');
        const resolving = combat.resolving;
        const disabledStyle = 'opacity:0.5; cursor:not-allowed; pointer-events:none;';
        actionArea = `
          <div class="space-y-4">
            <div class="text-xs font-bold text-muted text-center">选择行动</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <button class="btn btn-primary btn-lg" data-action="xiuxingPlayerAction" data-arg0="attack" ${resolving ? 'disabled' : ''} style="${resolving ? disabledStyle : ''}">${icon('swords', 18)} 攻击</button>
              <button class="btn btn-secondary btn-lg" data-action="xiuxingPlayerAction" data-arg0="flee" ${resolving ? 'disabled' : ''} style="${resolving ? disabledStyle : ''}">${icon('footprints', 18)} 逃跑</button>
            </div>
            ${combatSkills.length > 0 ? `
              <div class="space-y-2">
                <div class="text-xs font-bold text-muted">技能</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  ${combatSkills.map(skill => {
                    const disabled = resolving || player.mp < skill.mpCost;
                    return `<button data-action="xiuxingPlayerAction" data-arg0="skill" data-arg1="${skill.id}" class="btn ${disabled ? 'btn-ghost' : 'btn-secondary'} btn-sm" style="justify-content:center; gap:0.5rem; ${disabled ? 'opacity:0.6; cursor:not-allowed; pointer-events:none;' : ''}" ${disabled ? 'disabled' : ''}>
                      <span>${skill.icon}</span><span>${escapeHtml(skill.name)} (${skill.mpCost}MP)</span>
                    </button>`;
                  }).join('')}
                </div>
              </div>
            ` : ''}
            ${usableItems.length > 0 ? `
              <div class="space-y-2">
                <div class="text-xs font-bold text-muted">道具</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  ${usableItems.map(item => `
                    <button data-action="xiuxingPlayerAction" data-arg0="item" data-arg1="${item.idx}" class="btn btn-success btn-sm" ${resolving ? 'disabled' : ''} style="justify-content:center; gap:0.5rem; background:var(--success-light); color:var(--success); box-shadow:none; border:none; ${resolving ? disabledStyle : ''}">
                      <span>${item.icon}</span><span>${escapeHtml(item.name)}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        <div class="card card-elevated p-5 sm:p-6 space-y-5" style="position:relative; overflow:hidden;">
          <div style="position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--error), #FF8F8F);"></div>
          <div class="flex items-center gap-4 rounded-2xl border-2 border-border p-4" style="background:var(--background);">
            <div class="avatar avatar-lg" style="background:var(--error-light); color:var(--error); font-size:1.875rem;">${enemy.icon}</div>
            <div class="flex-1">
              <div class="mb-1 flex items-center justify-between">
                <span class="font-extrabold">${escapeHtml(enemy.name)}</span>
                <span class="badge badge-ghost" style="font-size:0.625rem;">HP ${combat.enemyHp}/${enemy.maxHp}</span>
              </div>
              <div class="progress-bar" style="height:0.625rem; background:rgba(255,75,75,0.12);" role="progressbar" aria-valuemin="0" aria-valuemax="${enemy.maxHp}" aria-valuenow="${combat.enemyHp}" aria-label="${escapeHtml(enemy.name)} 生命值"><div style="width:${Math.min((combat.enemyHp / enemy.maxHp) * 100, 100)}%; background:linear-gradient(90deg, #FF6B6B, #FF4B4B); border-radius:9999px;"></div></div>
            </div>
          </div>

          ${actionArea}

          <div id="xiuxingCombatLog" class="combat-log" aria-live="polite" aria-atomic="false" aria-relevant="additions">
            ${combat.log.map(log => `<p class="text-sm"><span class="log-bullet">›</span>${escapeHtml(log)}</p>`).join('')}
          </div>
        </div>
      `;
    }

    function renderXiuxingInteraction(node, state) {
      if (node.type === 'reward') {
        const reward = node.reward || {};
        const rewardParts = [];
        if (reward.xp) rewardParts.push(`<span class="badge" style="background:var(--warning-light); color:var(--warning);">+${reward.xp} XP</span>`);
        if (reward.gold) rewardParts.push(`<span class="badge" style="background:var(--warning-light); color:var(--warning);">+${reward.gold} G</span>`);
        if (reward.skill) rewardParts.push(`<span class="badge" style="background:var(--primary-light); color:var(--primary);">习得 ${escapeHtml(xiuxingSkills[reward.skill]?.name || reward.skill)}</span>`);
        if (reward.item) rewardParts.push(`<span class="badge" style="background:var(--success-light); color:var(--success);">获得 ${escapeHtml(xiuxingItems[reward.item]?.name || reward.item)}</span>`);
        const buttons = node.choices && node.choices.length
          ? node.choices.map(c => `<button class="btn btn-primary btn-lg" data-action="chooseXiuxing" data-arg0="${c.next}" data-arg1="${c.effect || ''}">${formatXiuxingText(c.label)}</button>`).join('')
          : `<button class="btn btn-primary btn-lg" data-action="chooseXiuxing" data-arg0="${node.next}">继续 ${icon('arrowRight', 18)}</button>`;
        return `
          <div class="space-y-4">
            <div class="card card-elevated p-5 text-center" style="background:linear-gradient(135deg, var(--success-light) 0%, #FFFFFF 100%); border-color:var(--success);">
              <div style="font-size:2.5rem; margin-bottom:0.5rem;">🎁</div>
              <div class="mb-2 text-lg font-extrabold" style="color:var(--success);">获得奖励</div>
              <div class="flex flex-wrap items-center justify-center gap-2 text-sm">${rewardParts.length ? rewardParts.join('') : '章节完成！'}</div>
            </div>
            <div class="flex flex-col gap-4">
              ${buttons}
            </div>
          </div>
        `;
      }

      if (node.type === 'spell') {
        const q = state.spellQuestion;
        const feedback = state.spellFeedback;
        if (feedback) {
          return `
            <div class="card p-5" style="border-color:${feedback.correct ? 'var(--success)' : 'var(--error)'}; background:${feedback.correct ? 'var(--success-light)' : 'var(--error-light)'};" aria-live="polite" aria-atomic="true">
              <div class="text-center mb-3">
                <div style="font-size:2.25rem; margin-bottom:0.5rem;" aria-hidden="true">${feedback.correct ? '✨' : '💫'}</div>
                <div class="text-sm font-bold" style="color:${feedback.correct ? 'var(--success)' : 'var(--error)'}">${feedback.correct ? '咒语成功！' : '咒语失败了……'}</div>
              </div>
              <div class="mb-2 text-sm"><span class="font-bold">正确答案：</span><span class="font-jp">${escapeHtml(feedback.correctAnswer)}</span></div>
              <div class="mb-4 text-xs text-muted">${escapeHtml(feedback.explanation)}</div>
              ${feedback.correct
                ? `<button class="btn btn-primary w-full" data-action="chooseXiuxing" data-arg0="${node.next}">继续</button>`
                : `<button class="btn btn-secondary w-full" data-action="retryXiuxingSpell">重新咏唱</button>`}
            </div>
          `;
        }
        return `
          <div class="space-y-4">
            <div class="card card-elevated p-5 text-center text-lg font-bold" style="background:linear-gradient(135deg, var(--primary-light) 0%, #FFFFFF 100%); color:var(--primary); border-color:var(--primary);">${icon('sparkles', 20)} ${escapeHtml(q.prompt)}</div>
            <div class="grid grid-cols-1 gap-4" role="group" aria-label="咒语选项">
              ${q.options.map((opt, idx) => `<button class="option-btn" data-action="answerXiuxingSpell" data-arg0="${escapeHtml(opt)}"><span class="opt-marker">${String.fromCharCode(65 + idx)}</span><span>${escapeHtml(opt)}</span></button>`).join('')}
            </div>
          </div>
        `;
      }

      if (node.type === 'narrative') {
        const next = node.choices && node.choices[0] ? node.choices[0].next : node.next;
        const effect = node.choices && node.choices[0] ? (node.choices[0].effect || '') : '';
        return `
          <div class="flex justify-center">
            <button class="btn btn-primary btn-lg" data-action="chooseXiuxing" data-arg0="${next}" data-arg1="${effect}">继续 ${icon('arrowRight', 18)}</button>
          </div>
        `;
      }

      return `
        <div class="flex flex-col gap-4">
          ${node.choices.map(c => `<button class="btn btn-primary btn-lg" data-action="chooseXiuxing" data-arg0="${c.next}" data-arg1="${c.effect || ''}">${formatXiuxingText(c.label)}</button>`).join('')}
        </div>
      `;
    }

    window.chooseXiuxing = function(next, effect) {
      const xp = progress.xiuxingProgress;
      if (effect) {
        effect.split(';').forEach(token => {
          if (!token) return;
          if (token.startsWith('favor+')) xp.favor += parseInt(token.slice(6), 10) || 0;
          else if (token.startsWith('favor-')) xp.favor = Math.max(0, xp.favor - (parseInt(token.slice(6), 10) || 0));
          else if (token.startsWith('flag_')) {
            const parts = token.slice(5).split('_');
            const value = parts.pop();
            const key = parts.join('_');
            if (!xp.flags) xp.flags = {};
            xp.flags[key] = value;
          }
        });
      }
      if (next === 'home') {
        tempState.xiuxingNode = null;
        tempState.xiuxingState = {};
        xp.combat = null;
        navigate('home');
        return;
      }
      if (next === 'intro') {
        xp.currentNode = 'intro';
        xp.combat = null;
        xp.player.hp = xp.player.maxHp;
        xp.player.mp = xp.player.maxMp;
        xp.log = [];
      }
      if (next !== 'home') {
        const node = xiuxingData.xiuxingStory[next];
        if (node && node.type === 'reward' && node.reward) {
          applyXiuxingReward(node.reward);
        }
      }
      tempState.xiuxingNode = next;
      tempState.xiuxingState = {};
      xp.currentNode = next;
      xp.combat = null;
      enterXiuxingNode(next);

      const chapterAchievementMap = {
        chapter1_complete: 'xiuxing_chapter1',
        chapter2_complete: 'xiuxing_chapter2',
        chapter3_complete: 'xiuxing_chapter3',
        chapter4_complete: 'xiuxing_chapter4',
        chapter5_complete: 'xiuxing_chapter5',
        chapter6_complete: 'xiuxing_chapter6',
        chapter7_complete: 'xiuxing_chapter7',
        chapter8_complete: 'xiuxing_chapter8',
        chapter9_complete: 'xiuxing_chapter9',
        chapter10_complete: 'xiuxing_chapter10',
        chapter10_complete_done: 'xiuxing_true_ending',
      };
      if (chapterAchievementMap[next] && !progress.achievements.includes(chapterAchievementMap[next])) {
        progress.achievements.push(chapterAchievementMap[next]);
      }
      updateLeaderboard();
      saveProgress();
      render();
    };

    window.answerXiuxingSpell = function(opt) {
      const state = tempState.xiuxingState || {};
      const q = state.spellQuestion;
      if (!q || state.spellFeedback) return;
      const correctAnswer = typeof q.answer === 'number' ? q.options[q.answer] : q.answer;
      const isCorrect = opt === correctAnswer;
      state.spellFeedback = { correct: isCorrect, selectedAnswer: opt, correctAnswer: correctAnswer, explanation: q.explanation };
      render();
    };

    window.retryXiuxingSpell = function() {
      const state = tempState.xiuxingState || {};
      const nodeId = tempState.xiuxingNode || progress.xiuxingProgress.currentNode || 'intro';
      const node = xiuxingStory.find(n => n.id === nodeId);
      state.spellQuestion = node && node.type === 'spell' ? pickCombatQuestion(node.spell) : null;
      state.spellFeedback = null;
      render();
    };

    window.xiuxingPlayerAction = function(action, payload) {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (!combat || combat.feedback) return;
      if (combat.pendingAction) return;
      if (combat.resolving) return;

      const nodeId = tempState.xiuxingNode || xp.currentNode || 'intro';
      const node = xiuxingStory.find(n => n.id === nodeId);
      if (!node || node.type !== 'combat') return;

      if (action === 'attack') {
        combat.pendingAction = 'attack';
        combat.pendingPayload = undefined;
        combat.combatQuestion = pickCombatQuestion('normal_attack', node.question);
        combat.log.push('你摆好架势，准备发起攻击！');
      } else if (action === 'skill') {
        const skill = xiuxingSkills[payload];
        if (!skill) return;
        if (xp.player.mp < skill.mpCost) {
          combat.log.push(`MP 不足，无法使用 ${skill.name}！`);
          render();
          return;
        }
        combat.pendingAction = 'skill';
        combat.pendingPayload = payload;
        combat.combatQuestion = pickCombatQuestion(payload, node.question);
        combat.log.push(`你开始咏唱 ${skill.name}……`);
      } else if (action === 'item') {
        useXiuxingItemInCombat(parseInt(payload, 10));
        return;
      } else if (action === 'flee') {
        combat.pendingAction = 'flee';
        combat.log.push('你试图逃跑，但腿一软摔了个跟头！');
        executeXiuxingEnemyAttack();
        return;
      }
      saveProgress();
      render();
    };

    window.answerXiuxingCombat = function(opt) {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (!combat || !combat.combatQuestion || combat.feedback) return;
      const q = combat.combatQuestion;
      const correctAnswer = typeof q.answer === 'number' ? q.options[q.answer] : q.answer;
      const isCorrect = opt === correctAnswer;
      combat.feedback = { correct: isCorrect, selectedAnswer: opt, correctAnswer: correctAnswer, explanation: q.explanation };
      saveProgress();
      render();
    };

    window.continueXiuxingCombat = function() {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (!combat || !combat.feedback) return;

      const nodeId = tempState.xiuxingNode || xp.currentNode || 'intro';
      const node = xiuxingStory.find(n => n.id === nodeId);
      const correct = combat.feedback.correct;
      const pendingAction = combat.pendingAction;
      const pendingPayload = combat.pendingPayload;

      if (correct) {
        if (pendingAction === 'attack') {
          const skill = xiuxingSkills.normal_attack;
          const dmg = skill.damage;
          combat.enemyHp = Math.max(0, combat.enemyHp - dmg);
          combat.log.push(`对 ${xiuxingEnemies[combat.enemyId].name} 造成 ${dmg} 点伤害！`);
        } else if (pendingAction === 'skill' && pendingPayload) {
          const skill = xiuxingSkills[pendingPayload];
          if (skill) {
            xp.player.mp = Math.max(0, xp.player.mp - skill.mpCost);
            if (skill.damage) {
              combat.enemyHp = Math.max(0, combat.enemyHp - skill.damage);
              combat.log.push(`${skill.name} 造成 ${skill.damage} 点伤害！`);
            }
            if (skill.heal) {
              xp.player.hp = Math.min(xp.player.maxHp, xp.player.hp + skill.heal);
              combat.log.push(`回复了 ${skill.heal} HP！`);
            }
          }
        }
      } else {
        combat.log.push('行动失败！');
      }

      combat.feedback = null;
      combat.combatQuestion = null;
      combat.pendingAction = null;
      combat.pendingPayload = undefined;

      if (combat.enemyHp <= 0) {
        combat.log.push(`${xiuxingEnemies[combat.enemyId].name} 被打倒了！`);
        if (node.reward) {
          const rewardParts = [];
          if (node.reward.xp) rewardParts.push(`+${node.reward.xp} XP`);
          if (node.reward.gold) rewardParts.push(`+${node.reward.gold} G`);
          if (node.reward.skill) rewardParts.push(`习得 ${xiuxingSkills[node.reward.skill]?.name || node.reward.skill}`);
          if (node.reward.item) rewardParts.push(`获得 ${xiuxingItems[node.reward.item]?.name || node.reward.item}`);
          if (rewardParts.length) combat.log.push(`获得奖励：${rewardParts.join('、')}`);
        }
        combat.resolving = true;
        saveProgress();
        render();
        const rewardInstanceId = combat.instanceId;
        setTimeout(function() {
          if (!xp.combat || xp.combat.instanceId !== rewardInstanceId) return;
          if (node.reward) applyXiuxingReward(node.reward);
          xp.combat = null;
          tempState.xiuxingState = { combatFinished: true };
          const nextNode = node.next || (node.choices && node.choices[0] ? node.choices[0].next : null);
          if (nextNode) {
            chooseXiuxing(nextNode);
          } else {
            saveProgress();
            render();
          }
        }, 600);
        return;
      }

      combat.resolving = true;
      saveProgress();
      render();
      const attackInstanceId = combat.instanceId;
      setTimeout(function() {
        if (!xp.combat || xp.combat.instanceId !== attackInstanceId) return;
        executeXiuxingEnemyAttack();
      }, 400);
    };

    function executeXiuxingEnemyAttack() {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (!combat || combat.enemyHp <= 0) return;
      const enemy = xiuxingEnemies[combat.enemyId];
      xp.player.hp = Math.max(0, xp.player.hp - enemy.attack);
      combat.log.push(`${enemy.name} 发起攻击，你受到 ${enemy.attack} 点伤害！`);
      combat.pendingAction = null;
      combat.pendingPayload = undefined;
      combat.combatQuestion = null;
      combat.feedback = null;
      if (xp.player.hp <= 0) {
        combat.resolving = true;
      } else {
        combat.resolving = false;
      }
      saveProgress();
      render();

      if (xp.player.hp <= 0) {
        const deathInstanceId = combat.instanceId;
        setTimeout(function() {
          if (!xp.combat || xp.combat.instanceId !== deathInstanceId) return;
          const nodeId = tempState.xiuxingNode || xp.currentNode || 'intro';
          const node = xiuxingStory.find(n => n.id === nodeId);
          if (node && node.trialLossNext) {
            xp.player.hp = Math.max(1, Math.floor(xp.player.maxHp * 0.3));
            chooseXiuxing(node.trialLossNext, '');
            return;
          }
          tempState.xiuxingDeathPending = true;
          render();
        }, 600);
      }
    }

    function renderXiuxingDeathModal() {
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="xiuxingDeathTitle" style="z-index:50;">
          <div class="card modal p-6 text-center" style="border:3px solid var(--error); overflow:hidden;" role="document">
            <div style="position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, var(--error), #FF8F8F);"></div>
            <div style="font-size:3.5rem; margin:0.5rem 0;" aria-hidden="true">💀</div>
            <div id="xiuxingDeathTitle" style="font-size:1.375rem; font-weight:800; color:var(--error); margin-bottom:0.5rem;">你倒下了</div>
            <p class="section-subtitle" style="margin-bottom:1.5rem;">进度将会被重置。点击“重新开始”再次踏上修行之路。</p>
            <button class="btn btn-error btn-lg w-full" data-action="confirmXiuxingDeath">重新开始</button>
          </div>
        </div>
      `;
    }

    window.confirmXiuxingDeath = function() {
      tempState.xiuxingDeathPending = false;
      resetXiuxing();
    };

    function useXiuxingItemInCombat(itemIdx) {
      const xp = progress.xiuxingProgress;
      const combat = xp.combat;
      if (typeof itemIdx !== 'number' || itemIdx < 0 || itemIdx >= xp.items.length) return;
      const itemId = xp.items[itemIdx];
      const item = xiuxingItems[itemId];
      if (!item) return;
      xp.items.splice(itemIdx, 1);
      if (item.effect === 'heal') {
        xp.player.hp = Math.min(xp.player.maxHp, xp.player.hp + item.value);
        combat.log.push(`使用了 ${item.name}，回复 ${item.value} HP。`);
      } else if (item.effect === 'mp') {
        xp.player.mp = Math.min(xp.player.maxMp, xp.player.mp + item.value);
        combat.log.push(`使用了 ${item.name}，回复 ${item.value} MP。`);
      } else {
        combat.log.push(`${item.name} 现在无法使用。`);
      }
      combat.resolving = true;
      saveProgress();
      render();
      const itemInstanceId = combat.instanceId;
      setTimeout(function() {
        if (!xp.combat || xp.combat.instanceId !== itemInstanceId) return;
        executeXiuxingEnemyAttack();
      }, 400);
    }

    window.useXiuxingItem = function(itemIdx) {
      const xp = progress.xiuxingProgress;
      const idx = Number(itemIdx);
      if (xp.combat && xp.combat.enemyHp > 0) {
        if (xp.combat.feedback || xp.combat.pendingAction || xp.combat.resolving) return;
        useXiuxingItemInCombat(idx);
        return;
      }
      if (typeof idx !== 'number' || isNaN(idx) || idx < 0 || idx >= xp.items.length) return;
      const itemId = xp.items[idx];
      const item = xiuxingItems[itemId];
      if (!item) return;
      xp.items.splice(idx, 1);
      if (item.effect === 'heal') {
        xp.player.hp = Math.min(xp.player.maxHp, xp.player.hp + item.value);
      } else if (item.effect === 'mp') {
        xp.player.mp = Math.min(xp.player.maxMp, xp.player.mp + item.value);
      }
      saveProgress();
      render();
    };

    function applyXiuxingReward(reward) {
      if (!reward) return;
      const xp = progress.xiuxingProgress;
      const player = xp.player;
      if (reward.xp) {
        player.xp += reward.xp;
        addXP(reward.xp);
      }
      if (reward.gold) player.gold += reward.gold;
      if (reward.skill && !player.skills.includes(reward.skill)) player.skills.push(reward.skill);
      if (reward.item && !xp.items.includes(reward.item)) xp.items.push(reward.item);
      while (player.xp >= player.level * 100) {
        player.xp -= player.level * 100;
        player.level++;
        player.maxHp += 20;
        player.maxMp += 10;
        player.hp = player.maxHp;
        player.mp = player.maxMp;
      }
    }

    window.resetXiuxing = function() {
      progress.xiuxingProgress = {
        started: false,
        playerName: '',
        currentNode: 'intro',
        favor: 0,
        items: [],
        player: { name: '', level: 1, xp: 0, hp: 100, maxHp: 100, mp: 50, maxMp: 50, gold: 0, skills: ['normal_attack'], inventory: [] },
        combat: null,
        log: [],
        questionRotation: {}
      };
      tempState.xiuxingNode = null;
      tempState.xiuxingState = {};
      tempState.xiuxingDeathPending = false;
      saveProgress();
      render();
    };

    window.startXiuxingRename = function() {
      tempState.xiuxingEditingName = true;
      render();
    };

    window.saveXiuxingName = function() {
      const input = document.getElementById('xiuxingRenameInput');
      const name = input && input.value.trim() ? input.value.trim() : progress.xiuxingProgress.player.name;
      progress.xiuxingProgress.player.name = name;
      progress.xiuxingProgress.playerName = name;
      tempState.xiuxingEditingName = false;
      saveProgress();
      render();
    };

    // ==================== BOOTSTRAP ====================
    window.addEventListener('hashchange', () => {
      const route = parseRoute(window.location.hash);
      currentRoute = route.name;
      routeParams = route.params;
      if (route.name === 'xiuxing') prepareXiuxingRoute();
      render();
    });

    window.addEventListener('DOMContentLoaded', () => {
      warmUpSpeechVoices();
      // On some mobile browsers the voice list only populates after the first user gesture.
      document.addEventListener('click', warmUpSpeechVoices, { once: true });
      const route = parseRoute(window.location.hash);
      currentRoute = route.name;
      routeParams = route.params;
      if (route.name === 'xiuxing') prepareXiuxingRoute();
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (tempState.npcDetailId) {
          e.preventDefault();
          closeNpcDetail();
        } else if (tempState.chatFriendId) {
          e.preventDefault();
          closeFriendChat();
        } else if (tempState.mobileMenuOpen) {
          e.preventDefault();
          tempState.mobileMenuOpen = false;
          render();
        }
      }
    });
  </script>
</body>
</html>
</html>
