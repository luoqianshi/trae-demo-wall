              <div class="flex items-center gap-2 font-bold ${state.isCorrect ? 'text-success' : 'text-error'}">
                ${state.isCorrect ? icon('checkCircle2', 18) + ' 回答正确！' : icon('xCircle', 18) + ' 回答错误'}
              </div>
              <p class="text-muted mt-1" style="font-size:0.875rem;">${escapeHtml(q.explanation)}</p>
            </div>
            <div class="text-center mt-6">
              <button class="btn btn-primary btn-lg" data-action="nextQuizQuestion">${state.currentIndex < state.questions.length - 1 ? '下一题 ' + icon('arrowRight', 18) : '查看结果 ' + icon('arrowRight', 18)}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderChoiceOptions(q, state, onClickName = 'selectQuizOption') {
      if (q.type === 'truefalse') {
        return `
          <div class="flex flex-col gap-3 mt-4" role="group" aria-label="判断选项">
            ${['正确', '错误'].map((opt, idx) => {
              let cls = 'option-btn';
              if (state.answered) {
                const isCorrect = (idx === 0 && q.answer === true) || (idx === 1 && q.answer === false);
                if (isCorrect) cls += ' correct';
                else if (state.selected === opt) cls += ' wrong animate-shake';
                else cls += ' dim';
              }
              return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="${onClickName}" data-arg0="${escapeHtml(opt)}"><span class="opt-marker">${idx === 0 ? 'O' : 'X'}</span><span>${escapeHtml(opt)}</span></button>`;
            }).join('')}
          </div>
        `;
      }
      if (q.type === 'fillblank' && !q.options) {
        const inputId = 'fillInput-' + Math.random().toString(36).slice(2, 8);
        return `
          <div class="mt-4 space-y-3">
            <input type="text" id="${inputId}" class="input font-jp ${state.answered ? (state.isCorrect ? 'input-correct' : 'input-wrong') : ''}" placeholder="请输入答案" aria-label="填写答案" ${state.answered ? 'disabled' : ''} data-enter-action="submitFillBlank" data-enter-arg0="${inputId}" data-enter-arg1="${onClickName}">
            <button class="btn btn-primary w-full" ${state.answered ? 'disabled' : ''} data-action="submitFillBlank" data-arg0="${inputId}" data-arg1="${onClickName}">提交</button>
          </div>
        `;
      }
      return `
        <div class="flex flex-col gap-3 mt-4" role="group" aria-label="选项">
          ${(q.options || []).map((opt, idx) => {
            let cls = 'option-btn';
            if (state.answered) {
              if (idx === q.answer) cls += ' correct';
              else if (state.selected === opt) cls += ' wrong animate-shake';
              else cls += ' dim';
            }
            return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="${onClickName}" data-arg0="${escapeHtml(opt)}"><span class="opt-marker">${String.fromCharCode(65 + idx)}</span><span>${escapeHtml(opt)}</span></button>`;
          }).join('')}
        </div>
      `;
    }

    function renderFillOptions(q, state, onClickName = 'selectQuizOption') {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4" role="group" aria-label="选项">
          ${q.options.map((opt, idx) => {
            let cls = 'option-btn font-jp';
            if (state.answered) {
              if (opt === q.answer) cls += ' correct';
              else if (state.selected === opt) cls += ' wrong animate-shake';
              else cls += ' dim';
            }
            return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="${onClickName}" data-arg0="${escapeHtml(opt)}" style="justify-content:center;"><span>${escapeHtml(opt)}</span></button>`;
          }).join('')}
        </div>
      `;
    }

    function initQuiz(scope, id) {
      let questions = [];
      let title = '';
      let stageId = 'n5';
      let unitId = '';
      if (scope === 'lesson') {
        const found = getLessonById(id);
        questions = found ? shuffle([...found.lesson.questions]) : [];
        title = found ? found.lesson.name : '课后练习';
        if (found) unitId = found.unit.id;
      } else if (scope === 'unit') {
        const stage = getStageById('n5');
        const unit = stage.units.find(u => u.id === id);
        questions = unit ? shuffle(unit.lessons.flatMap(l => l.questions)).slice(0, 10) : [];
        title = unit ? `${unit.name} 单元测试` : '单元测试';
        unitId = id;
      } else if (scope === 'stage') {
        questions = shuffle(getAllLessons().flatMap(l => l.questions)).slice(0, 15);
        title = 'N5 阶段测试';
      }
      tempState.quiz = { scope, id, questions, currentIndex: 0, score: 0, answered: false, selected: null, isCorrect: false, finished: false, title, stageId, unitId };
    }

    window.selectQuizOption = function(opt) {
      const state = tempState.quiz;
      if (state.answered) return;
      state.selected = opt;
      state.answered = true;
      const q = state.questions[state.currentIndex];
      let isCorrect = false;
      if (q.type === 'choice' || q.type === 'listening') isCorrect = q.options[q.answer] === opt;
      else if (q.type === 'truefalse') isCorrect = (opt === '正确' && q.answer === true) || (opt === '错误' && q.answer === false);
      else if (q.type === 'fillblank') isCorrect = opt === q.answer;
      state.isCorrect = isCorrect;
      if (isCorrect) state.score++;
      else addMistake(q.id, q.lessonId, state.selected);
      render();
    };

    window.nextQuizQuestion = function() {
      const state = tempState.quiz;
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        state.isCorrect = false;
        render();
      } else {
        state.finished = true;
        const pct = Math.round((state.score / state.questions.length) * 100);
        recordQuestions(state.score, state.questions.length);
        if (state.scope === 'lesson' && pct >= 60) {
          completeLesson(state.id);
        }
        if (state.scope === 'stage' && pct >= 70) {
          // stage test ace achievement
          if (!progress.achievements.includes('stage_test_ace')) {
            progress.achievements.push('stage_test_ace');
          }
        }
        if (state.scope === 'unit' && pct >= 70) {
          if (!progress.achievements.includes('unit_test_ace')) {
            progress.achievements.push('unit_test_ace');
          }
        }
        checkAchievements();
        saveProgress();
        render();
      }
    };

    function renderQuizResult(state) {
      const pct = Math.round((state.score / state.questions.length) * 100);
      const passed = pct >= (state.scope === 'lesson' ? 60 : 70);
      const backHref = state.scope === 'lesson' ? `#stage/${state.stageId}/unit/${state.unitId}/lesson/${state.id}` : (state.scope === 'unit' ? `#stage/${state.stageId}` : `#stage/${state.stageId}`);
      return `
        <div class="container page-section" style="max-width:28rem; text-align:center;" aria-live="polite" aria-atomic="true">
          <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%; background:${passed ? 'var(--success-light)' : 'var(--error-light)'}; color:${passed ? 'var(--success)' : 'var(--error)'}; display:flex; align-items:center; justify-content:center; font-size:2.5rem;">${passed ? icon('trophy', 40) : icon('xCircle', 40)}</div>
          <h1 class="section-title mt-4">${escapeHtml(state.title)} ${passed ? '通过！' : '未通过'}</h1>
          <p class="text-muted mb-6">你答对了 ${state.score}/${state.questions.length} 题，得分 ${pct} 分</p>

          <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-8">
            <div class="text-muted" style="font-size:0.875rem;">测试成绩</div>
            <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
            <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="测试成绩">
              <div style="width:${pct}%; background:${passed ? 'var(--success)' : 'var(--error)'};"></div>
            </div>
          </div>

          <div class="flex flex-col gap-3">
            ${state.scope === 'lesson' && passed ? `<a href="${backHref}" class="btn btn-primary btn-lg" data-nav>继续学习 ${icon('arrowRight', 18)}</a>` : ''}
            ${!passed ? `<button class="btn btn-primary btn-lg" data-action="resetQuiz">${icon('rotateCcw', 18)} 重新挑战</button>` : ''}
            <a href="${backHref}" class="btn btn-secondary" data-nav>返回课程</a>
          </div>
        </div>
      `;
    }

    window.resetQuiz = function() {
      const state = tempState.quiz;
      initQuiz(state.scope, state.id);
      render();
    };

    // ==================== PRACTICE DISPATCHER ====================
    function renderPracticeDispatcher() {
      const sub = routeParams[0];
      const id = routeParams[1];
      if (sub === 'lesson' && id) return renderQuizView('lesson', id);
      if (sub === 'exam' && id) return renderExam(id);
      return renderPracticeCenter();
    }

    // ==================== PRACTICE CENTER ====================
    function renderPracticeCenter() {
      if (!isStageUnlocked('n5')) {
        return `
          <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
            <div class="text-center">
              <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--muted-light);color:var(--muted);display:flex;align-items:center;justify-content:center;">${icon('lock', 40)}</div>
              <h1 class="section-title mt-4">练习中心尚未解锁</h1>
              <p class="text-muted mb-6">请先完成五十音图测试</p>
              <a href="#kana" class="btn btn-primary" data-nav>去学习五十音 ${icon('arrowRight', 18)}</a>
            </div>
          </div>
        `;
      }
      const allLessons = getAllLessons();
      const completedCount = allLessons.filter(l => isLessonCompleted(l.id)).length;
      return `
        <div class="container page-section" style="max-width:48rem;">
          <div class="text-center mb-6">
            <div class="badge bg-primary-light text-primary mb-2">${icon('dumbbell', 14)} 课后练习</div>
            <h1 class="section-title">练习中心</h1>
            <p class="text-muted mt-1" style="font-size:0.875rem;">选择课程进行练习，巩固所学知识</p>
          </div>

          <div class="card p-5 mb-6">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-muted" style="font-size:0.875rem;">已完成课程</div>
                <div style="font-size:1.5rem;font-weight:800;">${completedCount} / ${allLessons.length}</div>
              </div>
              <div style="width:3.5rem;height:3.5rem;border-radius:0.75rem;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;">${icon('sparkles', 28)}</div>
            </div>
          </div>

          <div class="flex flex-col gap-6">
            ${n5Stage.units.map(unit => `
              <div>
                <h2 style="font-size:1.125rem;font-weight:800;margin-bottom:0.75rem;">${escapeHtml(unit.name)}</h2>
                <div class="flex flex-col gap-3">
                  ${unit.lessons.map((lesson, index) => {
                    const completed = isLessonCompleted(lesson.id);
                    return `
                      <a href="#practice/lesson/${encodeURIComponent(lesson.id)}" class="card-soft flex items-center justify-between rounded-2xl border-2 p-4 transition-all ${completed ? 'border-success bg-success-light' : 'border-border bg-card hover:border-primary'}" data-nav>
                        <div class="flex items-center gap-4">
                          <div style="width:3rem;height:3rem;border-radius:0.75rem;display:flex;align-items:center;justify-content:center; color:white; background:${completed ? 'var(--success)' : 'var(--primary)'}">${completed ? icon('check', 20) : '<span style="font-size:1.125rem;font-weight:800;">' + (index + 1) + '</span>'}</div>
                          <div>
                            <div class="font-bold">${escapeHtml(lesson.name)}</div>
                            <div class="text-muted" style="font-size:0.75rem;">${lesson.questions.length} 道练习题</div>
                          </div>
                        </div>
                        <div class="font-bold text-primary" style="font-size:0.875rem;">${completed ? '再练一次' : '开始练习'}</div>
                      </a>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="mt-10">
            <div class="flex items-center gap-2 mb-4">
              <div style="width:2rem;height:2rem;border-radius:0.5rem;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;">${icon('fileText', 18)}</div>
              <h2 style="font-size:1.125rem;font-weight:800;">拟真试卷</h2>
            </div>
            <p class="text-muted mb-4" style="font-size:0.875rem;">模拟 JLPT 考试，包含词汇、语法、阅读、听力与作文</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
              ${exams.map(exam => `
                <a href="#practice/exam/${encodeURIComponent(exam.level)}" class="card-soft flex flex-col items-center justify-center rounded-2xl border-2 border-border bg-card p-4 text-center transition-all hover:border-primary" data-nav style="min-height:8rem;">
                  <div style="font-size:1.5rem;font-weight:800;color:var(--primary);">${exam.level.toUpperCase()}</div>
                  <div class="text-muted" style="font-size:0.75rem;font-weight:700;">${exam.questions.length} 题 + 作文</div>
                  <div class="mt-2 flex items-center gap-1" style="font-size:0.75rem;font-weight:800;color:var(--primary);">开始考试 ${icon('arrowRight', 18)}</div>
                </a>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    // ==================== CHALLENGE ====================
    function renderChallenge() {
      if (!tempState.challenge) initChallenge();
      const state = tempState.challenge;
      if (state.finished) return renderChallengeResult(state);
      const q = state.questions[state.currentIndex];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-6">
            <div class="badge bg-primary-light text-primary mb-2">${icon('star', 14)} 挑战练习</div>
            <h1 class="section-title">综合练习</h1>
            <p class="text-muted mt-1" style="font-size:0.875rem;">随机抽取各阶段题目，巩固所学知识</p>
          </div>
          <div class="mb-6">
            <div class="flex justify-between text-sm mb-2">
              <span class="font-bold">第 ${state.currentIndex + 1} / ${state.questions.length} 题</span>
              <span class="text-muted">得分：${state.score}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.currentIndex + 1}" aria-label="答题进度">
              <div style="width:${((state.currentIndex + 1) / state.questions.length) * 100}%; background:var(--primary);"></div>
            </div>
          </div>

          <div class="card p-5 sm:p-6 mb-6">
            <div class="text-muted mb-2" style="font-size:0.875rem;">${q.type === 'choice' ? '选择题' : q.type === 'truefalse' ? '判断题' : q.type === 'listening' ? '听力题' : '填空题'}</div>
            <h2 class="section-title" style="font-size:1.25rem;" id="challengeQuestionText">${renderQuestionText(q)}</h2>
            ${q.type === 'fillblank' && q.options ? renderFillOptions(q, state, 'selectChallengeOption') : renderChoiceOptions(q, state, 'selectChallengeOption')}
          </div>

          ${state.answered ? `
            <div class="card p-4 ${state.isCorrect ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.isCorrect ? 'var(--success)' : 'var(--error)'};" aria-live="polite" aria-atomic="true">
              <div class="flex items-center gap-2 font-bold ${state.isCorrect ? 'text-success' : 'text-error'}">
                ${state.isCorrect ? icon('checkCircle2', 18) + ' 回答正确！' : icon('xCircle', 18) + ' 回答错误'}
              </div>
              <p class="text-muted mt-1" style="font-size:0.875rem;">${escapeHtml(q.explanation)}</p>
            </div>
            <div class="text-center mt-6">
              <button class="btn btn-primary btn-lg" data-action="nextChallengeQuestion">${state.currentIndex < state.questions.length - 1 ? '下一题 ' + icon('arrowRight', 18) : '查看结果 ' + icon('arrowRight', 18)}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    window.selectChallengeOption = function(opt) {
      const state = tempState.challenge;
      if (state.answered) return;
      state.selected = opt;
      state.answered = true;
      const q = state.questions[state.currentIndex];
      let isCorrect = false;
      if (q.type === 'choice' || q.type === 'listening') isCorrect = q.options[q.answer] === opt;
      else if (q.type === 'truefalse') isCorrect = (opt === '正确' && q.answer === true) || (opt === '错误' && q.answer === false);
      else if (q.type === 'fillblank') isCorrect = opt === q.answer;
      state.isCorrect = isCorrect;
      if (isCorrect) state.score++;
      else addMistake(q.id, q.lessonId, state.selected);
      render();
    };

    function initChallenge() {
      const all = getAllLessons().flatMap(l => l.questions.map(q => ({ ...q, lessonId: l.id })));
      tempState.challenge = { questions: shuffle(all).slice(0, 10), currentIndex: 0, score: 0, answered: false, selected: null, isCorrect: false, finished: false };
    }

    window.nextChallengeQuestion = function() {
      const state = tempState.challenge;
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        state.isCorrect = false;
        render();
      } else {
        state.finished = true;
        recordQuestions(state.score, state.questions.length);
        if (state.questions.length > 0) {
          addXP(Math.round((state.score / state.questions.length) * 20));
        }
        checkAchievements();
        saveProgress();
        render();
      }
    };

    function renderChallengeResult(state) {
      const pct = Math.round((state.score / state.questions.length) * 100);
      return `
        <div class="container page-section" style="max-width:28rem; text-align:center;" aria-live="polite" aria-atomic="true">
          <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center;">${icon('star', 40)}</div>
          <h1 class="section-title mt-4">练习完成</h1>
          <p class="text-muted mb-6">你答对了 ${state.score}/${state.questions.length} 题，得分 ${pct} 分</p>
          <div class="card p-6 mb-8">
            <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
            <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="练习成绩"><div style="width:${pct}%; background:var(--primary);"></div></div>
          </div>
          <div class="flex flex-col gap-3">
            <button class="btn btn-primary btn-lg" data-action="resetChallenge">${icon('rotateCcw', 18)} 再来一组</button>
            <a href="#mistakes" class="btn btn-secondary" data-nav>复习错题</a>
          </div>
        </div>
      `;
    }

    window.resetChallenge = function() { initChallenge(); render(); };

    // ==================== EXAM ====================
    function renderExam(level) {
      level = level || routeParams[0] || 'n5';
      if (!tempState.exam || tempState.exam.level !== level) initExam(level);
      const state = tempState.exam;
      if (state.finished) return state.showReview ? renderExamReview(state) : renderExamResult(state);
      if (state.showEssay) return renderExamEssay(state);
      const q = state.questions[state.currentIndex];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-6">
            <div class="badge bg-primary-light text-primary mb-2">${escapeHtml(state.title)}</div>
            <h1 class="section-title">拟真试卷</h1>
          </div>
          <div class="mb-6">
            <div class="flex justify-between text-sm mb-2">
              <span class="font-bold">第 ${state.currentIndex + 1} / ${state.questions.length} 题</span>
              <span class="text-muted">答对：${state.score}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.currentIndex + 1}" aria-label="答题进度">
              <div style="width:${((state.currentIndex + 1) / state.questions.length) * 100}%; background:var(--primary);"></div>
            </div>
          </div>

          ${q.type === 'listening' ? `<div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-6 text-center">
            <div style="margin-bottom:0.75rem; color:var(--primary);" aria-hidden="true">${icon('ear', 32)}</div>
            <button class="btn btn-primary" data-action="speak" data-arg0="${escapeHtml(q.audioText)}" aria-label="播放音频">${icon('volume2', 20)} 播放音频</button>
          </div>` : ''}

          <div class="card p-5 sm:p-6 mb-6">
            ${q.passageText ? `<div class="text-muted mb-3 leading-relaxed" style="font-size:0.875rem;background:var(--muted-light);padding:0.875rem 1rem;border-radius:0.75rem;">${escapeHtml(q.passageText)}</div>` : ''}
            <div class="text-muted mb-2" style="font-size:0.875rem;">${q.type === 'choice' ? '选择题' : q.type === 'truefalse' ? '判断题' : q.type === 'listening' ? '听力题' : '填空题'}</div>
            <h2 class="section-title" style="font-size:1.25rem;" id="examQuestionText">${renderQuestionText(q)}</h2>
            ${q.type === 'fillblank' && q.options ? renderFillOptions(q, state, 'selectExamOption') : renderChoiceOptions(q, state, 'selectExamOption')}
          </div>

          ${state.answered ? `
            <div class="card p-4 ${state.isCorrect ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.isCorrect ? 'var(--success)' : 'var(--error)'};" aria-live="polite" aria-atomic="true">
              <div class="flex items-center gap-2 font-bold ${state.isCorrect ? 'text-success' : 'text-error'}">
                ${state.isCorrect ? icon('checkCircle2', 18) + ' 回答正确！' : icon('xCircle', 18) + ' 回答错误'}
              </div>
              <p class="text-muted mt-1" style="font-size:0.875rem;">${escapeHtml(q.explanation)}</p>
            </div>
            <div class="text-center mt-6">
              <button class="btn btn-primary btn-lg" data-action="nextExamQuestion">${state.currentIndex < state.questions.length - 1 ? '下一题 ' + icon('arrowRight', 18) : '去写作文 ' + icon('arrowRight', 18)}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderExamEssay(state) {
      const exam = exams.find(e => e.level === state.level) || exams[0];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-6">
            <div class="badge bg-primary-light text-primary mb-2">${icon('fileText', 14)} 作文题</div>
            <h1 class="section-title">${escapeHtml(state.title)}</h1>
            <p class="text-muted mt-1" style="font-size:0.875rem;">作文不计入分数，可选择跳过</p>
          </div>
          <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-6">
            <h2 style="font-size:1.125rem;font-weight:800;margin-bottom:0.75rem;">题目</h2>
            <p class="leading-relaxed">${escapeHtml(exam.essay.prompt)}</p>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-bold mb-2">你的作文</label>
            <textarea id="examEssayText" class="input" rows="8" placeholder="在此输入你的作文..." data-bind-state="exam.essayText">${escapeHtml(state.essayText || '')}</textarea>
          </div>
          <div class="card p-5 mb-8">
            <button class="mb-3 flex items-center gap-2 text-sm font-bold text-primary" style="background:none;border:none;cursor:pointer;" data-action="toggleExamRef">
              <span>显示参考答案</span>
            </button>
            <pre style="display:none;text-align:left;white-space:pre-wrap;font-family:inherit;font-size:0.875rem;color:var(--muted);">${escapeHtml(exam.essay.referenceAnswer)}</pre>
          </div>
          <div class="flex flex-col gap-3 sm:flex-row">
            <button class="btn btn-secondary flex-1" data-action="skipExamEssay">跳过</button>
            <button class="btn btn-primary flex-1" data-action="submitExamEssay">提交作文并查看成绩 ${icon('arrowRight', 18)}</button>
          </div>
        </div>
      `;
    }

    function initExam(level) {
      const exam = exams.find(e => e.level === level) || exams[0];
      tempState.exam = { level, title: exam.title, questions: shuffle([...exam.questions]), currentIndex: 0, score: 0, answered: false, selected: null, isCorrect: false, finished: false, showEssay: false, essayText: '', results: [], showReview: false };
    }

    window.selectExamOption = function(opt) {
      const state = tempState.exam;
      if (state.answered) return;
      state.selected = opt;
      state.answered = true;
      const q = state.questions[state.currentIndex];
      let isCorrect = false;
      if (q.type === 'choice' || q.type === 'listening') isCorrect = q.options[q.answer] === opt;
      else if (q.type === 'truefalse') isCorrect = (opt === '正确' && q.answer === true) || (opt === '错误' && q.answer === false);
      else if (q.type === 'fillblank') isCorrect = opt === q.answer;
      state.isCorrect = isCorrect;
      if (isCorrect) state.score++;
      else addMistake(q.id, q.lessonId, state.selected);
      state.results.push({ question: q, userAnswer: opt, isCorrect });
      render();
    };

    window.nextExamQuestion = function() {
      const state = tempState.exam;
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        state.isCorrect = false;
        render();
      } else {
        state.showEssay = true;
        render();
      }
    };

    function renderExamResult(state) {
      const pct = Math.round((state.score / state.questions.length) * 100);
      const passed = pct >= 60;
      return `
        <div class="container page-section" style="max-width:28rem; text-align:center;" aria-live="polite" aria-atomic="true">
          <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%; background:${passed ? 'var(--success-light)' : 'var(--warning-light)'}; color:${passed ? 'var(--success)' : 'var(--warning)'}; display:flex; align-items:center; justify-content:center; font-size:2.5rem;">${passed ? icon('trophy', 40) : icon('xCircle', 40)}</div>
          <h1 class="section-title mt-4">${passed ? '测试通过！' : '还需要努力'}</h1>
          <p class="text-muted mb-6">你答对了 ${state.score}/${state.questions.length} 题，正确率 ${pct}%</p>
          <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-8">
            <div class="text-muted" style="font-size:0.875rem;">客观题成绩（不含作文）</div>
            <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
            <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="客观题成绩"><div style="width:${pct}%; background:${passed ? 'var(--success)' : 'var(--warning)'};"></div></div>
          </div>
          <div class="flex flex-col gap-3">
            <button class="btn btn-primary btn-lg" data-action="showExamReview">${icon('list', 20)} 查看解析</button>
            <button class="btn btn-secondary" data-action="resetExam">${icon('rotateCcw', 18)} 再做一次</button>
            <a href="#practice" class="btn btn-secondary" data-nav>${icon('bookOpen', 18)} 返回练习中心</a>
          </div>
        </div>
      `;
    }

    function renderExamReview(state) {
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-6">
            <h1 class="section-title">${escapeHtml(state.title)} 解析</h1>
            <p class="text-muted mt-1" style="font-size:0.875rem;">查看每道题的作答与解析</p>
          </div>
          <div class="flex flex-col gap-4 mb-6">
            ${state.results.map((result, index) => {
              const q = result.question;
              return `
                <div class="card-soft rounded-3xl border-2 p-5 ${result.isCorrect ? 'border-success bg-success-light' : 'border-error bg-error-light'}">
                  <div class="mb-2 flex items-center gap-2 text-sm font-bold">
                    <span class="${result.isCorrect ? 'text-success' : 'text-error'}">${result.isCorrect ? icon('checkCircle2', 18) : icon('xCircle', 18)}</span>
                    <span>第 ${index + 1} 题</span>
                  </div>
                  <p class="mb-3 font-bold">${renderQuestionText(q)}</p>
                  <div class="space-y-1 text-sm">
                    <p><span class="text-muted">你的答案：</span><span class="font-bold">${formatExamAnswer(q, result.userAnswer)}</span></p>
                    <p><span class="text-muted">正确答案：</span><span class="font-bold">${formatExamAnswer(q, q.answer)}</span></p>
                    <p class="pt-1 text-muted">${escapeHtml(q.explanation)}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="flex flex-col gap-3">
            <button class="btn btn-secondary" data-action="hideExamReview">返回成绩</button>
            <a href="#practice" class="btn btn-secondary" data-nav>${icon('bookOpen', 18)} 返回练习中心</a>
          </div>
        </div>
      `;
    }

    function formatExamAnswer(question, answer) {
      if (answer === null || answer === undefined) return '未作答';
      if (question.type === 'truefalse') return answer === true || answer === '正确' ? '正确' : '错误';
      if ((question.type === 'choice' || question.type === 'listening') && typeof answer === 'number') return escapeHtml(question.options[answer] || String(answer + 1));
      return escapeHtml(String(answer));
    }

    window.submitExamEssay = function() {
      const state = tempState.exam;
      const textarea = document.getElementById('examEssayText');
      if (textarea) state.essayText = textarea.value;
      state.showEssay = false;
      state.finished = true;
      recordQuestions(state.score, state.questions.length);
      addXP(Math.round((state.score / state.questions.length) * 50));
      checkAchievements();
      saveProgress();
      render();
    };

    window.skipExamEssay = function() {
      submitExamEssay();
    };

    window.showExamReview = function() {
      tempState.exam.showReview = true;
      render();
    };

    window.hideExamReview = function() {
      tempState.exam.showReview = false;
      render();
    };

    window.resetExam = function() {
      const level = tempState.exam ? tempState.exam.level : 'n5';
      initExam(level);
      render();
    };

    // ==================== MISTAKES ====================
    function renderMistakes() {
      const now = new Date();
      const dueMistakes = progress.mistakes.filter(m => !m.nextReviewAt || new Date(m.nextReviewAt) <= now);
      const upcoming = progress.mistakes.filter(m => m.nextReviewAt && new Date(m.nextReviewAt) > now);
      if (progress.mistakes.length === 0) {
        return `
          <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
            <div class="text-center">
              <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--success-light);color:var(--success);display:flex;align-items:center;justify-content:center;">${icon('sparkle', 40)}</div>
              <h1 class="section-title mt-4">错题本空空如也</h1>
              <p class="text-muted mb-6">太棒了！你没有错题，继续保持。</p>
              <a href="#practice" class="btn btn-primary" data-nav>去练习</a>
            </div>
          </div>
        `;
      }
      return `
        <div class="container page-section" style="max-width:56rem;">
          <div class="text-center mb-6">
            <div class="badge bg-primary-light text-primary mb-2">${icon('rotateCcw', 18)} 错题复习</div>
            <h1 class="section-title">错题本</h1>
            <p class="text-muted mt-1" style="font-size:0.875rem;">共 ${progress.mistakes.length} 道错题，今日待复习 ${dueMistakes.length} 道</p>
          </div>

          ${dueMistakes.length > 0 ? `
            <div class="card p-5 mb-6 text-center">
              <h2 class="font-extrabold mb-2" style="font-size:1.125rem;">今日待复习 ${dueMistakes.length} 题</h2>
              <p class="text-muted mb-4" style="font-size:0.875rem;">答对即可推迟复习，答错会保留在错题本</p>
              <a href="#mistakes-review" class="btn btn-primary" data-nav>开始复习 ${icon('arrowRight', 18)}</a>
            </div>
          ` : ''}

          <div class="flex flex-col gap-3 mb-6">
            ${dueMistakes.map(m => {
              const found = getQuestionById(m.questionId);
              if (!found) return '';
              const { question, lesson } = found;
              return `
                <div class="card p-4" id="mistake-${m.questionId}">
                  <div class="font-bold" style="font-size:1rem;">${renderQuestionText(question)}</div>
                  <div class="text-muted mt-1" style="font-size:0.75rem;">来自：${escapeHtml(lesson.name)}</div>
                  ${m.lastWrongAnswer ? `<div class="mt-3 p-3" style="background:var(--error-light);border-radius:0.75rem;"><div class="font-bold text-error">你曾选</div><div>${escapeHtml(m.lastWrongAnswer)}</div></div>` : ''}
                  <div class="mt-3 p-3" style="background:var(--success-light);border-radius:0.75rem;">
                    <div class="font-bold text-success">正确答案</div>
                    <div>${escapeHtml(question.type === 'choice' ? question.options[question.answer] : question.type === 'truefalse' ? (question.answer ? '正确' : '错误') : question.answer)}</div>
                  </div>
                  <div class="mt-3 text-muted" style="font-size:0.875rem;">${escapeHtml(question.explanation)}</div>
                  <div class="flex gap-2 mt-3">
                    <button class="btn btn-success flex-1" data-action="masterMistake" data-arg0="${m.questionId}">${icon('checkCircle2', 18)} 已掌握</button>
                    <button class="btn btn-ghost flex-1" data-action="reviewMistake" data-arg0="${m.questionId}">${icon('calendar', 18)} 稍后复习</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${upcoming.length > 0 ? `
            <h2 style="font-size:1.125rem;font-weight:800;margin-bottom:0.75rem;">${icon('clock', 16)} 后续复习</h2>
            <div class="flex flex-col gap-3">
              ${upcoming.map(m => {
                const found = getQuestionById(m.questionId);
                if (!found) return '';
                const { question, lesson } = found;
                return `
                  <div class="card p-4" style="opacity:0.8;">
                    <div class="font-bold">${renderQuestionText(question)}</div>
                    <div class="text-muted mt-1" style="font-size:0.75rem;">下次复习：${new Date(m.nextReviewAt).toLocaleDateString('zh-CN')} · 来自：${escapeHtml(lesson.name)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    window.masterMistake = function(qid) {
      removeMistake(qid);
      render();
    };

    window.reviewMistake = function(qid) {
      const m = progress.mistakes.find(x => x.questionId === qid);
      if (m) {
        m.reviewCount = (m.reviewCount || 0) + 1;
        const intervals = [1, 2, 4, 7, 15, 30];
        const days = intervals[Math.min(m.reviewCount - 1, intervals.length - 1)];
        const next = new Date();
        next.setDate(next.getDate() + days);
        next.setHours(0, 0, 0, 0);
        m.nextReviewAt = next.toISOString();
        m.lastReviewAt = new Date().toISOString();
        saveProgress();
      }
      render();
    };

    // ==================== MISTAKES REVIEW ====================
    function initMistakesReview() {
      const now = new Date();
      const dueItems = progress.mistakes
        .filter(m => !m.nextReviewAt || new Date(m.nextReviewAt) <= now)
        .map(m => {
          const found = getQuestionById(m.questionId);
          return found ? { mistake: m, question: found.question, lesson: found.lesson } : null;
        })
        .filter(Boolean);
      tempState.mistakesReview = {
        items: shuffle(dueItems),
        currentIndex: 0,
        correct: 0,
        answered: false,
        selected: null,
        finished: false,
      };
    }

    function renderMistakesReview() {
      if (!tempState.mistakesReview) initMistakesReview();
      const state = tempState.mistakesReview;
      if (!state || state.items.length === 0) {
        return `
          <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
            <div class="text-center">
              <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--success-light);color:var(--success);display:flex;align-items:center;justify-content:center;">${icon('checkCircle2', 40)}</div>
              <h1 class="section-title mt-4">没有待复习错题</h1>
              <a href="#mistakes" class="btn btn-primary mt-4" data-nav>返回错题本</a>
            </div>
          </div>
        `;
      }
      if (state.finished) {
        const total = state.items.length;
        const pct = Math.round((state.correct / total) * 100);
        return `
          <div class="container page-section" style="max-width:28rem; text-align:center;" aria-live="polite" aria-atomic="true">
            <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--success-light);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:2.5rem;">${icon('checkCircle2', 40)}</div>
            <h1 class="section-title mt-4">复习完成</h1>
            <p class="text-muted mb-6">你答对了 ${state.correct}/${total} 题，正确率 ${pct}%</p>
            <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-8">
              <div class="text-muted" style="font-size:0.875rem;">本次复习</div>
              <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
              <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="复习正确率"><div style="width:${pct}%;"></div></div>
            </div>
            <a href="#mistakes" class="btn btn-primary" data-nav>返回错题本</a>
          </div>
        `;
      }
      const { question } = state.items[state.currentIndex];
      const options = getQuestionOptions(question);
      const isFillBlankNoOptions = question.type === 'fillblank' && !question.options;
      const fillBlankInputId = 'mistakes-review-fillblank';
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="mb-6">
            <div class="mb-2 flex items-center justify-between text-sm">
              <span class="font-bold text-foreground">第 ${state.currentIndex + 1} / ${state.items.length} 题</span>
              <span class="text-muted">答对：${state.correct}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${state.items.length}" aria-valuenow="${state.currentIndex + 1}" aria-label="复习进度"><div style="width:${((state.currentIndex + 1) / state.items.length) * 100}%;"></div></div>
          </div>
          <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-6 text-center">
            <div class="text-muted mb-2" style="font-size:0.875rem;">${isFillBlankNoOptions ? '请填写正确答案' : '请选择正确答案'}</div>
            <div class="font-extrabold" style="font-size:1.25rem;" id="mistakesReviewQuestionText">${renderQuestionText(question)}</div>
          </div>
          ${isFillBlankNoOptions ? `
            <div class="mb-6 space-y-3">
              <input type="text" id="${fillBlankInputId}" class="input font-jp w-full" placeholder="请输入答案" aria-label="填写答案" ${state.answered ? 'disabled' : ''} data-enter-action="submitFillBlank" data-enter-arg0="${fillBlankInputId}" data-enter-arg1="selectMistakesReviewOption">
              <button class="btn btn-primary w-full" data-action="submitFillBlank" data-arg0="${fillBlankInputId}" data-arg1="selectMistakesReviewOption" ${state.answered ? 'disabled' : ''}>提交</button>
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6" role="group" aria-label="选项">
              ${options.map((opt, idx) => renderReviewOption(question, opt, idx, state)).join('')}
            </div>
          `}
          ${state.answered ? `
            <div class="card p-5 mb-6 ${state.isCorrect ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.isCorrect ? 'var(--success)' : 'var(--error)'};" aria-live="polite" aria-atomic="true">
              <div class="font-bold mb-1 ${state.isCorrect ? 'text-success' : 'text-error'}">${state.isCorrect ? icon('checkCircle2', 20) + ' 回答正确！' : icon('xCircle', 20) + ' 回答错误'}</div>
              <p class="text-muted" style="font-size:0.875rem;">${escapeHtml(question.explanation)}</p>
            </div>
            <div class="text-center">
              <button class="btn btn-primary" data-action="nextMistakesReviewQuestion">${state.currentIndex < state.items.length - 1 ? '下一题' : '查看结果'} ${icon('arrowRight', 18)}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function getQuestionOptions(question) {
      if (question.type === 'choice' || question.type === 'listening') return question.options;
      if (question.type === 'truefalse') return ['正确', '错误'];
      if (question.type === 'fillblank' && question.options) return question.options;
      return [];
    }

    function renderReviewOption(question, opt, idx, state) {
      let cls = 'card-soft flex items-center justify-center rounded-2xl border-2 border-border bg-card p-4 text-center font-bold transition-all hover:border-primary hover:bg-primary-light';
      if (state.answered) {
        const correct = isQuestionAnswerCorrect(question, opt);
        const selected = state.selected === opt;
        if (correct) cls = 'flex items-center justify-center rounded-2xl border-b-4 border-success-dark bg-success p-4 text-center font-bold text-white';
        else if (selected) cls = 'flex items-center justify-center rounded-2xl border-b-4 border-error-dark bg-error p-4 text-center font-bold text-white';
        else cls = 'flex items-center justify-center rounded-2xl border-2 border-border bg-muted-light p-4 text-center font-bold text-muted';
      }
      return `<button class="${cls}" data-action="selectMistakesReviewOption" data-arg0="${String(opt).replace(/"/g, '&quot;')}" ${state.answered ? 'disabled' : ''}>${escapeHtml(opt)}</button>`;
    }

    function isQuestionAnswerCorrect(question, opt) {
      if (question.type === 'choice' || question.type === 'listening') return question.options[question.answer] === opt;
      if (question.type === 'truefalse') return (opt === '正确' && question.answer === true) || (opt === '错误' && question.answer === false);
      if (question.type === 'fillblank') return question.answer === opt;
      return false;
    }

    window.selectMistakesReviewOption = function(opt) {
      const state = tempState.mistakesReview;
      if (state.answered) return;
      const { question, mistake } = state.items[state.currentIndex];
      state.selected = opt;
      state.answered = true;
      state.isCorrect = isQuestionAnswerCorrect(question, opt);
      if (state.isCorrect) {
        state.correct++;
        reviewMistake(mistake.questionId);
        addXP(3);
      }
      render();
    };

    window.nextMistakesReviewQuestion = function() {
      const state = tempState.mistakesReview;
      if (!state) return;
      if (state.currentIndex < state.items.length - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        state.isCorrect = false;
        render();
      } else {
        state.finished = true;
        recordQuestions(state.correct, state.items.length);
        render();
      }
    };

    // ==================== MAP ====================
    const mapNodes = [
      { id: 'kana-bubble', name: '假名泡泡', description: '选择正确读音，戳破假名泡泡', icon: 'あ', xp: 15 },
      { id: 'kana-typing', name: '假名输入', description: '看到假名，快速输入对应的罗马音', icon: '⌨️', xp: 18 },
      { id: 'word-match', name: '单词配对', description: '翻开卡片，把日语单词和中文意思连起来', icon: '🧩', xp: 15 },
      { id: 'word-scramble', name: '假名拼词', description: '把打乱的假名重新拼成正确的单词', icon: '🧱', xp: 18 },
      { id: 'speed-translate', name: '极速翻译', description: '看日语句子，选出正确中文', icon: '⚡', xp: 20 },
      { id: 'listen-meaning', name: '听音辨意', description: '听日语发音，选择听到的意思', icon: '👂', xp: 20 },
      { id: 'true-false', name: '判断正误', description: '判断日语单词或句子的意思是否正确', icon: '⚖️', xp: 16 },
      { id: 'boss-battle', name: '关卡 Boss', description: '综合挑战：假名、单词、句子一起来', icon: '👹', xp: 35 },
    ];

    function renderMap() {
      const completedCount = progress.completedMiniGames.length;
      const totalCount = mapNodes.length;
      const mapProgress = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
      return `
        <div class="container page-section animate-fadeInUp" style="max-width:42rem;">
          <div class="text-center mb-8">
            <div class="badge bg-primary-light text-primary mb-3">${icon('gamepad2', 14)} 学习地图</div>
            <h1 class="section-title" style="background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; color:transparent;">闯关地图</h1>
            <p class="section-subtitle mt-2">通过小游戏复习单词、假名和句子</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
            <div class="card p-3 text-center">
              <div class="text-warning mb-1" style="display:flex; justify-content:center;">${icon('flame', 20)}</div>
              <div style="font-size:1.125rem; font-weight:800;">${progress.streakDays}</div>
              <div class="text-muted" style="font-size:0.75rem;">连胜</div>
            </div>
            <div class="card p-3 text-center">
              <div class="text-primary mb-1" style="display:flex; justify-content:center;">${icon('gem', 20)}</div>
              <div style="font-size:1.125rem; font-weight:800;">${formatNumber(progress.xp)}</div>
              <div class="text-muted" style="font-size:0.75rem;">XP</div>
            </div>
            <div class="card p-3 text-center">
              <div class="text-success mb-1" style="display:flex; justify-content:center;">${icon('trophy', 20)}</div>
              <div style="font-size:1.125rem; font-weight:800;">${completedCount}/${totalCount}</div>
              <div class="text-muted" style="font-size:0.75rem;">关卡</div>
            </div>
          </div>

          <div class="card p-5 mb-8">
            <div class="flex justify-between mb-2">
              <span style="font-size:0.875rem; font-weight:700; color:var(--muted);">地图进度</span>
              <span style="font-size:0.875rem; font-weight:800; color:var(--primary);">${mapProgress}%</span>
            </div>
            <div class="progress-bar progress-bar-lg">
              <div style="width:${mapProgress}%; background:var(--primary);"></div>
            </div>
          </div>

          <div style="position:relative;">
            <div style="position:absolute; left:50%; top:0; bottom:0; width:0.25rem; transform:translateX(-50%); background:var(--border); border-radius:9999px; z-index:0;"></div>
            <div style="display:flex; flex-direction:column; gap:1.25rem; position:relative; z-index:1;">
              ${mapNodes.map((node, index) => {
                const isCompleted = progress.completedMiniGames.includes(node.id);
                const isUnlocked = index === 0 || progress.completedMiniGames.includes(mapNodes[index - 1].id);
                const isLeft = index % 2 === 0;
                return `
                  <div class="flex items-center gap-4" style="${isLeft ? 'flex-direction:row;' : 'flex-direction:row-reverse;'}">
                    <button class="card card-soft p-4 flex flex-1 items-center gap-4 ${isUnlocked ? 'map-node-btn' : ''}" style="border-color:${isCompleted ? 'var(--success)' : isUnlocked ? 'var(--primary)' : 'var(--border)'}; background:${isCompleted ? 'var(--success-light)' : isUnlocked ? 'var(--card)' : 'var(--muted-light)'}; ${isUnlocked ? 'cursor:pointer; transition:all 0.15s ease;' : 'pointer-events:none; opacity:0.85;'}" ${isUnlocked ? `data-action="openMapNodeModal" data-arg0="${node.id}"` : 'disabled'}>
                      <div style="width:3.5rem;height:3.5rem;flex-shrink:0;border-radius:0.75rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800; box-shadow:0 2px 4px -1px rgba(0,0,0,0.05); background:${isCompleted ? 'var(--success)' : isUnlocked ? 'var(--primary)' : 'var(--border)'}; color:${isCompleted || isUnlocked ? 'white' : 'var(--muted)'};">
                        ${isCompleted ? icon('star', 28) : stageIcon(node.icon, 28)}
                      </div>
                      <div class="flex-1" style="text-align:left;">
                        <div class="flex items-center gap-2">
                          <div class="font-bold ${isUnlocked ? '' : 'text-muted'}" style="font-size:1rem;">${escapeHtml(node.name)}</div>
                          ${!isUnlocked ? icon('lock', 14, 'color:var(--muted);') : ''}
                        </div>
                        <div class="text-muted" style="font-size:0.75rem;">${escapeHtml(node.description)}</div>
                        <div class="badge bg-primary-light text-primary mt-2" style="display:inline-flex; align-items:center; gap:0.25rem;">${icon('trophy', 12)} +${node.xp} XP</div>
                      </div>
                    </button>
                    <div style="position:relative; z-index:10; flex-shrink:0; width:2rem; height:2rem; border-radius:50%; border:2px solid ${isCompleted ? 'var(--success)' : isUnlocked ? 'var(--primary)' : 'var(--border)'}; background:${isCompleted ? 'var(--success)' : isUnlocked ? 'white' : 'var(--muted-light)'}; color:${isCompleted ? 'white' : isUnlocked ? 'var(--primary)' : 'var(--muted)'}; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:800;">
                      ${isCompleted ? icon('check', 16) : index + 1}
                    </div>
                    <div class="hidden sm:block" style="flex:1;"></div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="text-center mt-10">
            <a href="#stage/n5" class="btn btn-secondary" data-nav>返回课程学习</a>
          </div>
        </div>
        ${renderMapNodeModal()}
      `;
    }

    function renderMapNodeModal() {
      const node = tempState.mapSelectedNode;
      if (!node) return '';
      const isCompleted = progress.completedMiniGames.includes(node.id);
      return `
        <div style="position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); padding:1rem;" data-overlay-close="closeMapNodeModal">
          <div class="card" style="width:100%; max-width:24rem; text-align:center;">
            <div style="font-size:3.5rem; margin-bottom:0.5rem;">${stageIcon(node.icon, 56)}</div>
            <h2 class="section-title-sm">${escapeHtml(node.name)}</h2>
            <p class="text-muted" style="font-size:0.875rem; margin-bottom:1rem;">${escapeHtml(node.description)}</p>
            <div class="rounded-2xl p-4 mb-6" style="background:var(--primary-light);">
              <div class="text-xs font-bold text-primary">通关奖励</div>
              <div class="text-xl font-extrabold text-primary">+${node.xp} XP</div>
            </div>
            <div class="flex gap-3">
              <button class="btn btn-secondary flex-1" data-action="closeMapNodeModal">稍后再说</button>
              <button class="btn btn-primary flex-1" data-action="startGameFromMap" data-arg0="${encodeURIComponent(node.id)}">开始挑战</button>
            </div>
          </div>
        </div>
      `;
    }

    window.openMapNodeModal = function(nodeId) {
      tempState.mapSelectedNode = mapNodes.find(n => n.id === nodeId) || null;
      render();
    };
    window.closeMapNodeModal = function() {
      tempState.mapSelectedNode = null;
      render();
    };

    window.startGame = function(gameId) {
      navigate('game/' + encodeURIComponent(gameId));
    };

    // ==================== MINI GAMES ====================
    function renderGame() {
      const gameId = routeParams[0];
      const state = tempState.miniGame;
      if (!state || state.gameId !== gameId) initMiniGame(gameId);
      if (tempState.miniGame.finished) return renderMiniGameResult();
      if (gameId === 'kana-bubble') return renderKanaBubble();
      if (gameId === 'kana-typing') return renderKanaTyping();
      if (gameId === 'word-match') return renderWordMatch();
      if (gameId === 'word-scramble') return renderWordScramble();
      if (gameId === 'speed-translate') return renderSpeedTranslate();
      if (gameId === 'listen-meaning') return renderListenMeaning();
      if (gameId === 'true-false') return renderTrueFalse();
      if (gameId === 'boss-battle') return renderBossBattle();
      return `<div class="container page-section">游戏不存在</div>`;
    }

    function initMiniGame(gameId) {
      tempState.miniGame = { gameId, currentIndex: 0, score: 0, answered: false, selected: null, finished: false, input: '', build: [] };
      if (gameId === 'kana-bubble') initKanaBubble();
      else if (gameId === 'kana-typing') initKanaTyping();
      else if (gameId === 'word-match') initWordMatch();
      else if (gameId === 'word-scramble') initWordScramble();
      else if (gameId === 'speed-translate') initSpeedTranslate();
      else if (gameId === 'listen-meaning') initListenMeaning();
      else if (gameId === 'true-false') initTrueFalse();
      else if (gameId === 'boss-battle') initBossBattle();
    }

    function renderMiniGameHeader(title) {
      const state = tempState.miniGame;
      const total = state.items ? state.items.length : state.questions.length;
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-4">
            <div class="badge bg-primary-light text-primary mb-2">${icon('gamepad2', 18)} 小游戏</div>
            <h1 class="section-title" style="font-size:1.5rem;">${title}</h1>
          </div>
          <div class="mb-4">
            <div class="flex justify-between text-sm mb-2">
              <span class="font-bold">进度 ${state.currentIndex + 1} / ${total}</span>
              <span class="text-muted">得分：${state.score}</span>
            </div>
            <div class="progress-bar"><div style="width:${((state.currentIndex + 1) / total) * 100}%; background:var(--primary);"></div></div>
          </div>
      `;
    }

    function renderMiniGameResult() {
      const state = tempState.miniGame;
      const total = state.items ? state.items.length : state.questions.length;
      const pct = Math.round((state.score / total) * 100);
      const passed = pct >= 60;
      if (passed && !state.rewarded) {
        state.rewarded = true;
        const node = mapNodes.find(n => n.id === state.gameId);
        const xpReward = node ? node.xp : 30;
        completeMiniGame(state.gameId, xpReward);
      }
      const gameNames = {
        'kana-bubble': '假名泡泡', 'kana-typing': '假名输入', 'word-match': '单词配对',
        'word-scramble': '假名拼词', 'speed-translate': '极速翻译', 'listen-meaning': '听音辨意',
        'true-false': '判断正误', 'boss-battle': '关卡 Boss'
      };
      return `
        <div class="container page-section" style="max-width:28rem; text-align:center;">
          <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%; background:${passed ? 'var(--success-light)' : 'var(--error-light)'}; color:${passed ? 'var(--success)' : 'var(--error)'}; display:flex; align-items:center; justify-content:center; font-size:2.5rem;">${passed ? icon('partyPopper', 40) : icon('bomb', 40)}</div>
          <h1 class="section-title mt-4">${escapeHtml(gameNames[state.gameId] || state.gameId)} ${passed ? '通关！' : '挑战失败'}</h1>
          <p class="text-muted mb-6">得分 ${state.score}/${total}，正确率 ${pct}%</p>
          <div class="card p-6 mb-8">
            <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
            <div class="progress-bar mt-3"><div style="width:${pct}%; background:${passed ? 'var(--success)' : 'var(--error)'};"></div></div>
          </div>
          <div class="flex flex-col gap-3">
            <button class="btn btn-primary btn-lg" data-action="resetMiniGame">${icon('rotateCcw', 18)} 再玩一次</button>
            <a href="#map" class="btn btn-secondary" data-nav>返回地图</a>
          </div>
        </div>
      `;
    }

    window.resetMiniGame = function() {
      const state = tempState.miniGame;
      initMiniGame(state.gameId);
      render();
    };

    // --- Kana Bubble ---
    function initKanaBubble() {
      const items = takeRandom(hiragana.filter(k => k.group === 'seion'), 8);
      const allRomaji = hiragana.filter(k => k.group === 'seion').map(k => k.romaji);
      tempState.miniGame.items = items.map(k => {
        const distractors = shuffle(allRomaji.filter(r => r !== k.romaji)).slice(0, 3);
        return { kana: k.kana, answer: k.romaji, options: shuffle([k.romaji, ...distractors]) };
      });
    }

    function renderKanaBubble() {
      const state = tempState.miniGame;
      const item = state.items[state.currentIndex];
      return renderMiniGameHeader('假名泡泡') + `
          <div class="text-center mb-6">
            <div style="width:8rem;height:8rem;margin:0 auto;border-radius:50%;background:var(--primary-light);border:4px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;color:var(--primary);" class="font-jp animate-bounce">${escapeHtml(item.kana)}</div>

    // --- Kana Typing ---
    function initKanaTyping() {

    function renderKanaTyping() {

    window.submitKanaTyping = function() {
      const state = tempState.miniGame;
      if (state.answered) return;
      const input = document.getElementById('kanaTypingInput');
      const value = input ? input.value.trim().toLowerCase() : '';
      state.input = value;
      const item = state.items[state.currentIndex];
      state.isCorrect = value === item.answer.toLowerCase();
      state.answered = true;
      if (state.isCorrect) state.score++;
      render();

    // --- Word Scramble ---
    function splitKana(str) {
      return Array.from(str);
    }

    function initWordScramble() {
      const words = takeRandom(beginnerWords, 6);
      tempState.miniGame.items = words.map(w => {
        const chars = splitKana(w.japanese);
        return {
          ...w,
          chars: chars,
          shuffled: shuffle(chars.map((c, i) => ({ char: c, id: i })))
        };
      });
      tempState.miniGame.build = [];
      tempState.miniGame.usedIndices = [];
    }

    function renderWordScramble() {
      const state = tempState.miniGame;
      const item = state.items[state.currentIndex];
      const build = state.build || [];
      const used = state.usedIndices || [];
      const isDone = build.length === item.chars.length;
      const isCorrect = state.answered && state.isCorrect;
      const isWrong = state.answered && !state.isCorrect;
      return renderMiniGameHeader('假名拼词') + `
          <div class="text-center mb-4">
            <div class="text-muted text-sm">把打乱的假名拼成这个单词</div>
            <div class="font-bold text-lg mt-1" style="color:var(--foreground);">${escapeHtml(item.meaning)}</div>
            <div class="text-muted text-sm">${escapeHtml(item.romaji)}</div>
          </div>
          <div class="flex flex-wrap justify-center gap-2 mb-6" style="min-height:3.5rem;">
            ${build.map((b) => `<div class="scramble-slot font-jp ${isCorrect ? 'correct' : isWrong ? 'wrong' : ''}">${escapeHtml(b.char)}</div>`).join('')}
            ${state.answered ? '' : Array.from({length: item.chars.length - build.length}).map(() => `<div class="scramble-slot"></div>`).join('')}
          </div>
          <div class="flex flex-wrap justify-center gap-2 mb-6">
            ${item.shuffled.map((t, i) => {
              const isUsed = used.includes(i);
              return `<button class="scramble-tile font-jp ${isUsed ? 'used' : ''}" ${isUsed || state.answered ? 'disabled' : ''} data-action="selectScrambleTile" data-arg0="${i}">${escapeHtml(t.char)}</button>`;
            }).join('')}
          </div>
          ${!state.answered ? `
            <div class="flex justify-center gap-3">
              <button class="btn btn-secondary" data-action="clearScramble">重置</button>
              <button class="btn btn-primary" data-action="submitScramble" ${isDone ? '' : 'disabled'}>提交</button>
            </div>
          ` : `
            <div class="text-center">
              <div class="rounded-2xl p-4 ${isCorrect ? 'bg-success-light text-success' : 'bg-error-light text-error'} mb-4">
                <div class="font-bold">${isCorrect ? '拼对了！' : '拼错了'}</div>
                <div class="text-sm mt-1">正确单词：<span class="font-jp">${escapeHtml(item.japanese)}</span></div>
              </div>
              <button class="btn btn-primary btn-lg" data-action="nextMiniGameItem">下一题 ${icon('arrowRight', 18)}</button>
            </div>
          `}
        </div>
      `;
    }

    window.selectScrambleTile = function(index) {
      const state = tempState.miniGame;
      if (state.answered) return;
      const used = state.usedIndices || [];
      if (used.includes(index)) return;
      const item = state.items[state.currentIndex];
      const tile = item.shuffled[index];
      state.build = [...(state.build || []), { char: tile.char, id: index }];
      state.usedIndices = [...used, index];
      render();
    };

    window.clearScramble = function() {
      const state = tempState.miniGame;
      if (state.answered) return;
      state.build = [];
      state.usedIndices = [];
      render();
    };

    window.submitScramble = function() {
      const state = tempState.miniGame;
      if (state.answered) return;
      const item = state.items[state.currentIndex];
      const answer = (state.build || []).map(b => b.char).join('');
      state.isCorrect = answer === item.japanese;
      state.answered = true;
      if (state.isCorrect) state.score++;
      render();
    };

    // --- True / False ---
    function initTrueFalse() {
      const wordPool = beginnerWords.map(w => ({ ...w, type: 'word' }));
      const sentencePool = sentenceQuizzes.map(s => ({ ...s, type: 'sentence', japanese: s.japanese, meaning: s.meaning }));
      const all = takeRandom([...wordPool, ...sentencePool], 8);
      const meanings = [...beginnerWords.map(w => w.meaning), ...sentenceQuizzes.map(s => s.meaning)];
      tempState.miniGame.items = all.map(item => {
        const isTrue = Math.random() < 0.5;
        let shownMeaning = item.meaning;
        if (!isTrue) {
          const others = meanings.filter(m => m !== item.meaning);
          shownMeaning = others[Math.floor(Math.random() * others.length)];
        }
        return { ...item, isTrue, shownMeaning };
      });
    }

    function renderTrueFalse() {
      const state = tempState.miniGame;
      const item = state.items[state.currentIndex];
      return renderMiniGameHeader('判断正误') + `
          <div class="text-center mb-6">
            <div class="font-jp font-bold" style="font-size:1.75rem;color:var(--primary);">${escapeHtml(item.japanese)}</div>
            <div class="text-muted mt-2">下面这个意思是否正确？</div>
            <div class="card p-4 mt-3" style="display:inline-block; min-width:12rem;">
              <div class="font-bold text-lg">${escapeHtml(item.shownMeaning)}</div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button class="btn btn-success btn-lg" data-action="answerTrueFalse" data-arg0="true" ${state.answered ? 'disabled' : ''}>正确</button>
            <button class="btn btn-error btn-lg" data-action="answerTrueFalse" data-arg0="false" ${state.answered ? 'disabled' : ''}>错误</button>
          </div>
          ${state.answered ? `
            <div class="rounded-2xl p-4 mt-6 text-center ${state.isCorrect ? 'bg-success-light text-success' : 'bg-error-light text-error'}">
              <div class="font-bold">${state.isCorrect ? '判断正确！' : '判断错误'}</div>
              <div class="text-sm mt-1">正确意思：${escapeHtml(item.meaning)}</div>
            </div>
            <div class="text-center mt-4"><button class="btn btn-primary btn-lg" data-action="nextMiniGameItem">下一题 ${icon('arrowRight', 18)}</button></div>
          ` : ''}
        </div>
      `;
    }

    window.answerTrueFalse = function(answer) {
      const state = tempState.miniGame;
      if (state.answered) return;
      const item = state.items[state.currentIndex];
      const boolAnswer = answer === true || answer === 'true';
      state.isCorrect = boolAnswer === item.isTrue;
      state.answered = true;
      if (state.isCorrect) state.score++;
      render();
    };

    // --- Word Match ---
    function initWordMatch() {
      const words = takeRandom(beginnerWords, 6);
      tempState.miniGame.items = words; // for result scoring
      const cards = [];
      words.forEach((w, i) => {
        cards.push({ id: i, type: 'jp', text: w.japanese, match: w.meaning });
        cards.push({ id: i, type: 'cn', text: w.meaning, match: w.japanese });
      });
      tempState.miniGame.cards = shuffle(cards);
      tempState.miniGame.flipped = [];
      tempState.miniGame.matched = [];
      tempState.miniGame.moves = 0;
    }

    function renderWordMatch() {
      const state = tempState.miniGame;
      const matchedCount = state.matched.length / 2;
      const totalPairs = state.cards.length / 2;
      return `
        <div class="container page-section" style="max-width:30rem;">
          <div class="text-center mb-4">
            <div class="badge bg-primary-light text-primary mb-2">${icon('gamepad2', 18)} 小游戏</div>
            <h1 class="section-title" style="font-size:1.5rem;">单词配对</h1>
            <p class="text-muted mt-1">翻牌找出日语和中文的配对</p>
          </div>
          <div class="flex justify-between text-sm mb-4">
            <span class="font-bold">已配对 ${matchedCount} / ${totalPairs}</span>
            <span class="text-muted">步数：${state.moves}</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            ${state.cards.map((c, i) => {
              const isFlipped = state.flipped.includes(i) || state.matched.includes(i);
              const cls = isFlipped ? (state.matched.includes(i) ? 'match-card matched' : 'match-card flipped') : 'match-card';
              return `<button class="${cls} ${c.type === 'jp' ? 'font-jp' : ''}" ${isFlipped ? 'disabled' : ''} data-action="flipMatchCard" data-arg0="${i}">${isFlipped ? escapeHtml(c.text) : '?'}</button>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    window.flipMatchCard = function(index) {
      const state = tempState.miniGame;
      if (state.flipped.length >= 2 || state.flipped.includes(index) || state.matched.includes(index)) return;
      state.flipped.push(index);
      state.moves++;
      if (state.flipped.length === 2) {
        const [i1, i2] = state.flipped;
        const c1 = state.cards[i1], c2 = state.cards[i2];
        if (c1.match === c2.text && c2.match === c1.text) {
          state.matched.push(i1, i2);
          state.score++;
          state.flipped = [];
          if (state.matched.length === state.cards.length) {
            state.finished = true;
          }
          render();
        } else {
          render();
          setTimeout(() => {
            state.flipped = [];
            render();
          }, 800);
        }
      } else {
        render();
      }
    };

    // --- Speed Translate ---
    function initSpeedTranslate() {
      const items = takeRandom(sentenceQuizzes, 8);
      tempState.miniGame.items = items.map(q => {
        const distractors = shuffle(sentenceQuizzes.filter(s => s.meaning !== q.meaning).map(s => s.meaning)).slice(0, 3);
        return { ...q, options: shuffle([q.meaning, ...distractors]) };
      });
    }

    function renderSpeedTranslate() {
      const state = tempState.miniGame;
      const item = state.items[state.currentIndex];
      return renderMiniGameHeader('极速翻译') + `
          <div class="text-center mb-6">
            <div class="font-jp font-bold" style="font-size:1.75rem;color:var(--primary);">${escapeHtml(item.japanese)}</div>
            <div class="text-muted" style="font-size:0.875rem;">${escapeHtml(item.romaji)}</div>
            <p class="text-muted mt-2">请选择对应的中文意思</p>
          </div>
          <div class="flex flex-col gap-3">
            ${item.options.map(opt => {
              let cls = 'option-btn';
              if (state.answered) {
                if (opt === item.meaning) cls += ' correct';
                else if (state.selected === opt) cls += ' wrong animate-shake';
                else cls += ' dim';
              }
              return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="selectMiniGameOption" data-arg0="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
            }).join('')}
          </div>
          ${state.answered ? `<div class="text-center mt-6"><button class="btn btn-primary btn-lg" data-action="nextMiniGameItem">下一题 ${icon('arrowRight', 18)}</button></div>` : ''}
        </div>

    }

    // --- Listen Meaning ---
    function initListenMeaning() {
      const items = takeRandom(beginnerWords, 6);
      tempState.miniGame.items = items.map(w => {
        const distractors = shuffle(beginnerWords.filter(x => x.meaning !== w.meaning).map(x => x.meaning)).slice(0, 3);
        return { ...w, options: shuffle([w.meaning, ...distractors]) };
      });

    function renderListenMeaning() {
      const state = tempState.miniGame;
      const item = state.items[state.currentIndex];
      return renderMiniGameHeader('听音辨意') + `
          <div class="text-center mb-6">

          <div class="flex flex-col gap-3">
            ${item.options.map(opt => {
              let cls = 'option-btn';

                else if (state.selected === opt) cls += ' wrong animate-shake';
                else cls += ' dim';
              }
              return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="selectMiniGameOption" data-arg0="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
            }).join('')}
          </div>
          ${state.answered ? `<div class="text-center mt-6"><button class="btn btn-primary btn-lg" data-action="nextMiniGameItem">下一题 ${icon('arrowRight', 18)}</button></div>` : ''}

      `;

    // --- Boss Battle ---
    function initBossBattle() {
      const all = getAllLessons().flatMap(l => l.questions.map(q => ({ ...q, lessonId: l.id })));
      tempState.miniGame.questions = shuffle(all).slice(0, 10);
      tempState.miniGame.bossHp = 100;
      tempState.miniGame.playerHp = 100;
    }

    function renderBossBattle() {
      const state = tempState.miniGame;
      const q = state.questions[state.currentIndex];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="text-center mb-4">
            <div class="badge bg-error-light text-error mb-2">${icon('skull', 14)} Boss 战</div>
            <h1 class="section-title" style="font-size:1.5rem;">关卡 Boss</h1>
          </div>
          <div class="flex items-center justify-between mb-4">
            <div style="flex:1;margin-right:1rem;">
              <div class="font-bold text-success" style="font-size:0.875rem;">勇者 HP</div>
              <div class="progress-bar"><div style="width:${state.playerHp}%; background:var(--success);"></div></div>
            </div>
            <div style="color:var(--error);">${icon('skull', 40)}</div>
            <div style="flex:1;margin-left:1rem;">
              <div class="font-bold text-error" style="font-size:0.875rem;">Boss HP</div>
              <div class="progress-bar"><div style="width:${state.bossHp}%; background:var(--error);"></div></div>
            </div>
          </div>
          <div class="card p-5 sm:p-6 mb-6">
            <div class="text-muted mb-2" style="font-size:0.875rem;">第 ${state.currentIndex + 1} / ${state.questions.length} 题</div>
            <h2 class="section-title" style="font-size:1.25rem;">${renderQuestionText(q)}</h2>
            ${q.type === 'fillblank' && q.options ? renderFillOptions(q, state, 'selectMiniGameOption') : renderChoiceOptions(q, state, 'selectMiniGameOption')}
          </div>
          ${state.answered ? `
            <div class="card p-4 ${state.isCorrect ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.isCorrect ? 'var(--success)' : 'var(--error)'};">
              <div class="font-bold ${state.isCorrect ? 'text-success' : 'text-error'}">${state.isCorrect ? icon('checkCircle2', 18) + ' 命中 Boss！' : icon('xCircle', 18) + ' 被 Boss 反击了！'}</div>
              <p class="text-muted mt-1" style="font-size:0.875rem;">${escapeHtml(q.explanation)}</p>
            </div>
            <div class="text-center mt-6"><button class="btn btn-primary btn-lg" data-action="nextBossQuestion">下一回合 ${icon('arrowRight', 18)}</button></div>
          ` : ''}
        </div>
      `;
    }

    window.selectMiniGameOption = function(opt) {
      const state = tempState.miniGame;
      if (state.answered) return;
      state.selected = opt;
      state.answered = true;
      let isCorrect = false;
      if (state.items) {
        const item = state.items[state.currentIndex];
        if (state.gameId === 'kana-bubble') isCorrect = opt === item.answer;
        else if (state.gameId === 'speed-translate') isCorrect = opt === item.meaning;
        else if (state.gameId === 'listen-meaning') isCorrect = opt === item.meaning;
      } else if (state.questions) {
        const q = state.questions[state.currentIndex];
        if (q.type === 'choice' || q.type === 'listening') isCorrect = q.options[q.answer] === opt;
        else if (q.type === 'truefalse') isCorrect = (opt === '正确' && q.answer === true) || (opt === '错误' && q.answer === false);
        else if (q.type === 'fillblank') isCorrect = opt === q.answer;
      }
      state.isCorrect = isCorrect;
      if (isCorrect) state.score++;
      render();
    };

    window.nextMiniGameItem = function() {
      const state = tempState.miniGame;
      const total = state.items ? state.items.length : state.questions.length;
      if (state.currentIndex < total - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        state.isCorrect = false;
        state.input = '';
        state.build = [];
        state.usedIndices = [];
        render();
      } else {
        state.finished = true;
        render();
      }
    };

    window.nextBossQuestion = function() {
      const state = tempState.miniGame;
      if (state.isCorrect) state.bossHp = Math.max(0, state.bossHp - 20);
      else state.playerHp = Math.max(0, state.playerHp - 15);
      if (state.bossHp <= 0) {
        state.score = state.questions.length;
        state.finished = true;
        render();
        return;
      }
      if (state.playerHp <= 0 || state.currentIndex >= state.questions.length - 1) {
        state.finished = true;
        render();
        return;
      }
      state.currentIndex++;
      state.answered = false;
      state.selected = null;
      state.isCorrect = false;
      render();
    };
