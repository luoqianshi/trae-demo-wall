    .modal {
      background: var(--card); border: 1.5px solid var(--border-strong); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg), 0 20px 50px rgba(31, 41, 55, 0.16); max-width: 28rem; width: 100%; max-height: 90vh; overflow-y: auto;
      animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-wide { max-width: 32rem; }
    .modal-tall { height: 100%; max-height: 640px; display: flex; flex-direction: column; }

    /* Forms */
    input[type="text"], select, .input {
      width: 100%; min-height: 2.75rem; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--background); font-size: 1rem; font-weight: 700; outline: none;
      color: var(--foreground); font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    input[type="text"]::placeholder, .input::placeholder { color: #9CA3AF; }
    input[type="text"]:focus, select:focus, .input:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 4px rgba(244, 114, 164, 0.12); }
    .input-correct { border-color: var(--success) !important; background: var(--success-light) !important; }
    .input-wrong { border-color: var(--error) !important; background: var(--error-light) !important; }

    /* Kana grid */
    .kana-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid var(--border); border-bottom: 3px solid var(--border); border-radius: 1rem; background: linear-gradient(180deg, #FFFFFF 0%, var(--background) 100%);
      padding: 1rem 0.5rem; cursor: pointer; transition: all 0.15s ease;
      font: inherit; color: inherit; width: 100%; min-height: 5rem;
    }
    .kana-card:hover { border-color: var(--primary); border-bottom-color: var(--primary); background: linear-gradient(180deg, #FFFFFF 0%, var(--primary-light) 100%); }
    .kana-char { font-size: 1.75rem; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; }
    @media (min-width: 640px) { .kana-char { font-size: 2rem; } }
    .kana-roma {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 1rem;
      font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; padding: 0 1.25rem;
    }
    .kana-vol {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 1.25rem; height: 1.25rem; padding: 0.75rem; opacity: 0; transition: opacity 0.15s ease;
      box-sizing: content-box;
    }
    .kana-card:hover .kana-vol,
    .kana-card:focus-visible .kana-vol { opacity: 1; }
    @media (hover: none) and (pointer: coarse) {
      .kana-vol { opacity: 1; }
    }

    /* Option buttons */
    .option-btn {
      width: 100%; text-align: left; padding: 1rem 1.25rem; border-radius: var(--radius-md);
      border: 1.5px solid var(--border); border-bottom: 3px solid var(--border); background: var(--card);
      font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    .option-btn.correct { background: var(--success); border: none; border-bottom: 3px solid var(--success-dark); color: white; }
    .option-btn.wrong { background: var(--error); border: none; border-bottom: 3px solid var(--error-dark); color: white; }
    .option-btn.dim { background: var(--muted-light); border: 1.5px solid var(--border); color: var(--muted); }
    .option-btn .opt-marker {
      width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 1.5px solid currentColor;
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0;
    }

    /* Game cards */
    .match-card {
      height: 6rem; border-radius: var(--radius-md); border: 1.5px solid var(--border); border-bottom: 3px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center; font-weight: 800;
      cursor: pointer; transition: all 0.2s ease;
    }
    .match-card:hover:not(:disabled) { border-color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    .match-card.flipped { background: var(--primary); border-color: var(--primary); border-bottom-color: var(--primary); color: white; }
    .match-card.matched { background: var(--success); border-color: var(--success); border-bottom-color: var(--success); color: white; }

    /* Scramble tiles */
    .scramble-tile {
      min-width: 3rem; height: 3.5rem; border-radius: var(--radius-md);
      border: 1.5px solid var(--border); border-bottom: 3px solid var(--border); background: var(--card);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: all 0.15s ease;
    }
    .scramble-tile:hover:not(:disabled) { border-color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    .scramble-tile.used { opacity: 0.4; pointer-events: none; }
    .scramble-tile.correct { background: var(--success); border-color: var(--success); border-bottom-color: var(--success-dark); color: white; }
    .scramble-tile.wrong { background: var(--error); border-color: var(--error); border-bottom-color: var(--error-dark); color: white; }
    .scramble-slot {
      min-width: 3rem; height: 3.5rem; border-radius: var(--radius-md);
      border: 1.5px dashed var(--border); background: var(--muted-light);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; color: var(--primary);
    }

    /* Typing input */
    .typing-input {
      text-align: center; font-size: 1.5rem; letter-spacing: 0.1em;
      text-transform: lowercase;
    }

    /* Combat log */
    .combat-log {
      max-height: 12rem; overflow-y: auto; border: 2px solid var(--border); border-radius: 1rem;
      background: var(--muted-light); padding: 0.75rem 1rem;
      position: relative;
    }
    .combat-log::after {
      content: ''; position: sticky; bottom: 0; left: 0; right: 0; height: 1.5rem;
      background: linear-gradient(to top, var(--muted-light), transparent);
      display: block; pointer-events: none; margin: -0.75rem -1rem; margin-top: 0.5rem;
    }
    .combat-log p { margin: 0.375rem 0; }
    .combat-log .log-bullet { margin-right: 0.5rem; color: var(--muted); font-size: 0.75rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--background); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>

      "text": "傍晚的街道被夕阳染成温暖的橘红色，路灯一盏盏亮起，街边便利店的自动门发出「叮咚」的声响。\n你刚结束一天的课程，书包斜挎在肩上，正准备穿过斑马线回家。一阵带着青草香的风吹过，街角的银杏叶沙沙作响。\n忽然，天空像被谁撕开了一道口子，耀眼的白光从天而降，把整条街道照得如同白昼。\n耳边传来一个懒洋洋的女声：「あ、また間違えた……」\n你还没来得及抬头，整个人就像被卷进了洗衣机里——天旋地转、五感模糊，最后只剩下耳边呼啸的风声和薯片碎裂的轻响。",

    },

      "location": "召唤神殿",
      "speaker": "ミツル",
      "npcId": "goddess",
      "text": "等你回过神来，已经站在一座金碧辉煌却明显有些破旧的神殿里。高耸的穹顶绘着褪色的星空图，几根巨大的石柱上爬满了发光的藤蔓；空气中飘着淡淡的檀香和……番茄味薯片的气息。\n神殿中央的祭坛上，一位穿着宽松便服的少女正盘腿漂浮在半空，怀里抱着一袋吃了一半的薯片。她的长发像被微风吹拂般轻轻飘动，头顶却歪歪扭扭地戴着一顶明显小了一号的神官冠。\n她低头看着你，嘴里还嚼着薯片，碎屑簌簌往下掉：\n「ようこそ、異世界へ！あなたの名前は？」",

      "text": "清晨，你们三人在北门集合。ユイ检查着法杖上的宝石，ケント最后一次擦拭盾牌，而你则把アヤカ给的药水小心地收好。\nミツル不知何时出现在城墙上，手里捧着一袋薯片，表情却难得认真：「……気をつけてね。」说完便化作光点消失了。\n你们沿着王都北面的商道前行，越靠近遗迹，天空就越发阴沉。黑雾像是一条灰色的河流，从北方的地平线缓缓流淌过来。",

      "text": "傀儡倒在地上，化作一滩黑色的污水。长廊两侧的火把自动亮起，照亮了墙上斑驳的壁画——画中描绘着古代祭司用日语封印某种黑暗生物的场景。\nユイ凑近壁画，小声念出上面的古老文字：「言葉こそが、封印の鍵」。你们对视一眼，心中隐隐明白，这次冒险的意义远比想象中重大。",

      "text": "你们穿过旧街区的暗巷，在下水道的尽头找到了那扇古老的门。门上刻满了看不懂的文字，但你觉得其中一些符号似曾相识。\nユイ举起法杖，微弱的火光映出门上的日语：「古き扉、言葉の鍵で開かれん。」",

      "location": "真黑之殿入口",
      "text": "击败守卫后，一个高大的黑袍人影从殿内缓缓走出。他的脸隐藏在兜帽深处，声音像是从深渊传来。\n「我が主、真の黒き者はまだ眠っている。だが、お前たちの言葉は、目覚めの鍵となる。」",

      "text": "先锋倒下后，更深沉的声音在殿中回荡。那声音说，真黑之人仍在沉睡，而你是「言葉の鍵」。\nミツル的身影真正降临，不再是平时那副吃着薯片的虚影。她的眼中闪烁着古老的光芒：\n「私は古代言語戦争の見届け人……そして、お前たちを導く者よ。まだ旅は終わらない。」",

      "location": "王都地下入口",
      "text": "真黑之先锋倒下后，王都地下回荡着那句令人不安的预言：「古代日语之门即将开启，你们所谓的王国，不过是一扇锁。」\n你们一行人拖着疲惫的身躯回到地面，清晨的阳光刺眼得让人想流泪。还没等你们适应光线，街道两端已被银色铠甲包围。\n为首的骑士举起长枪，声音冷峻：「王宮への召喚だ。抵抗は無用。」\nユイ紧张地抓住法杖，ケント本能地挡在你身前。远处围观的人群窃窃私语，有人低声说：「王国騎士長が自ら……？」",

      "location": "最後の扉へ続く荒原",
      "text": "联军向西方荒原进发。越靠近封印之地，天空越灰暗，黑雾像活物一般在队伍周围游走。\nドレイク走到你身边，递来一壶酒：「生きて帰ろうぜ、英雄殿。」",
      "next": "herald_swarms"
    },
    {
      "id": "herald_swarms",
      "type": "combat",
      "location": "黒霧の平原",
      "text": "黑雾中涌出无数先锋残響，它们的形态扭曲而痛苦，仿佛是被吞噬语言意义的亡灵。\n「数が多い！連合の力を見せる時だ！」レオ高举长枪冲向前方。",
      "next": "ally_rescue_event",
      "enemy": "herald_remnant"
    },
    {
      "id": "ally_rescue_event",
      "type": "narrative",
      "location": "黒霧の平原",
      "text": "战斗陷入胶着时，一道熟悉的身影冲入敌阵。\n「遅れるなよ、{playerName}！」\n高好感度的同伴在最危急的时刻赶到，替你挡下了致命一击。",
      "next": "black_fog_general_combat"
    },
    {
      "id": "black_fog_general_combat",
      "type": "combat",
      "location": "最後の扉前",
      "text": "巨大的黒霧の将軍挡在最后一扇门前。它骑着由黑雾凝结的战马，手中长枪散发着吞噬光明的气息。\n「言葉の鍵を持つ者、ここで死ね。」",
      "next": "final_door_puzzle",
      "enemy": "black_fog_general"
    },
    {
      "id": "final_door_puzzle",
      "type": "spell",
      "location": "最後の扉",
      "text": "将軍倒下后，最后的门缓缓显现。门上刻着一段古老的封印文，需要以联军之力共同咏唱才能开启。\nミツル看向你：「最後は、あなたの言葉が鍵となる。」",
      "next": "sacrifice_scene",
      "spell": "allied_cannon"
    },
    {
      "id": "sacrifice_scene",
      "type": "dialogue",
      "location": "最後の扉前",
      "speaker": "ミツル",
      "npcId": "goddess",
      "text": "门缓缓开启，然而黑雾开始从四面八方涌来，试图重新关闭它。\n「誰かが残って、扉を押さえていなければならない。」\n队伍陷入了沉默。",
      "choices": [
        {
          "label": "私が残る。",
          "next": "chapter9_finale",
          "effect": "flag_sacrifice_npc_player"
        },
        {
          "label": "ミツル、頼む。",
          "next": "chapter9_finale",
          "effect": "flag_sacrifice_npc_goddess"
        },
        {
          "label": "皆で行こう。",
          "next": "chapter9_finale",
          "effect": "flag_sacrifice_npc_none"
        },
        {
          "label": "決められない……。",
          "next": "chapter9_finale",
          "effect": "flag_sacrifice_npc_auto"
        }
      ]
    },
    {
      "id": "chapter9_finale",
      "type": "narrative",
      "location": "最後の扉・対岸",
      "text": "身后的门在你们穿过之后缓缓关闭。留下来的人没有回头，只是大声喊道：「先に行け！」\n你们站在一片灰色的荒芜世界中。远处，一道巨大而空洞的身影正在等待。\n最終決戦の幕が上がる。",
      "next": "chapter9_complete"
    },
    {
      "id": "chapter9_complete",
      "type": "reward",
      "location": "真黑の領域・入口",
      "text": "联军之力凝聚在你体内，全新的力量开始觉醒。羁绊共鸣让连携技突破了原本的极限。",
      "next": "chapter9_complete_done",
      "reward": {
        "xp": 500,
        "gold": 2500,
        "skill": "allied_cannon"
      }
    },
    {
      "id": "chapter9_complete_done",
      "type": "reward",
      "location": "真黑の領域・入口",
      "text": "恭喜！你完成了第九章「真黑の封印と最後の扉」的冒险。\n你们穿越了最后的门，来到了言無的领域。羁绊共鸣使连携技获得了觉醒形态。",
      "next": "chapter10_start",
      "reward": {
        "xp": 250,
        "gold": 800,
        "skill": "awakened_link_claudia"
      }
    },
    {
      "id": "chapter10_start",
      "type": "narrative",
      "location": "真黑の領域",
      "text": "这里没有声音。没有颜色。甚至连时间的流逝都变得模糊。\n你们尝试说话，却发现声音刚出口就被某种无形的力量吞噬。\nミツル用手指在空中写下文字，那些文字也迅速消散。",
      "next": "void_silence"
    },
    {
      "id": "void_silence",
      "type": "narrative",
      "location": "真黑の領域",
      "text": "队伍成员一个接一个地失去声音。ユイ捂住嘴，ケント拼命摇头，クラウディア单膝跪地。\n只有你还勉强能听见自己的心跳。\n就在这时，前方的灰色开始凝聚成一个巨大的人形。",
      "next": "kotonashi_intro"
    },
    {
      "id": "kotonashi_intro",
      "type": "dialogue",
      "location": "真黑の領域・中心",
      "speaker": "言無",
      "npcId": "kotonashi",
      "text": "它没有五官，却能发出直达脑海的声音。\n「我は言無。言葉の意味を消し去る者。苦しみも、別れも、全てを無に還そう。」",
      "choices": [
        {
          "label": "言葉があるから、私たちは生きている。",
          "next": "kotonashi_phase1_combat",
          "effect": "favor+5"
        },
        {
          "label": "そんな世界は間違っている。",
          "next": "kotonashi_phase1_combat",
          "effect": "favor+3"
        },
        {
          "label": "何もかも消えるのは寂しい。",
          "next": "kotonashi_phase1_combat",
          "effect": "favor+2"
        },
        {
          "label": "黙れ。",
          "next": "kotonashi_phase1_combat",
          "effect": ""
        }
      ]
    },
    {
      "id": "kotonashi_phase1_combat",
      "type": "combat",
      "location": "真黑の領域・中心",
      "text": "言無的身影分裂成无数虚无的触手。普通攻击穿透它的身体，几乎无法造成伤害。\n「技能を使え……言葉の力だけが、虚無に触れる。」ミツル用尽力气在你脑海中传达。",
      "next": "bonds_resonance",
      "enemy": "kotonashi_phase1"
    },
    {
      "id": "bonds_resonance",
      "type": "narrative",
      "location": "真黑の領域・中心",
      "text": "就在你们快要被虚无吞没时，无数熟悉的声音穿透了寂静。\n「{playerName}！」\n「諦めるな！」\n「お前ならできる！」\n那些声音来自一路上结识的每一个人。羁绊化作光芒，将言無的虚无撕开一道裂缝。",
      "next": "kotonashi_phase2_combat"
    },
    {
      "id": "kotonashi_phase2_combat",
      "type": "combat",
      "location": "真黑の領域・中心",
      "text": "裂缝中，言無发出无声的尖啸。它的身体开始崩解，但崩解的同时也在重组。\n「絆など……言葉の幻想に過ぎぬ。」",
      "next": "language_creation",
      "enemy": "kotonashi_phase2"
    },
    {
      "id": "language_creation",
      "type": "spell",
      "location": "真黑の領域・中心",
      "text": "你举起言葉の鍵，开始用日语重新定义这个世界。\n每一个词都化作星辰，每一句话都构建法则。这是语言创世级别的咏唱。",
      "next": "kotonashi_phase3_combat",
      "spell": "word_of_creation"
    },
    {
      "id": "kotonashi_phase3_combat",
      "type": "combat",
      "location": "真黑の領域・中心",
      "text": "言無露出最终的形态——一个由无数“消失的词语”构成的巨人。\n「最後の言葉を……吐け。」",
      "next": "ending_choice",
      "enemy": "kotonashi_phase3"
    },
    {
      "id": "ending_choice",
      "type": "dialogue",
      "location": "崩壊する真黑の領域",
      "speaker": "言無",
      "npcId": "kotonashi",
      "text": "言無倒下后，两个世界的边界出现在你面前。\n「選択せよ。帰るか、留まるか、それとも……新しい道を開くか。」",
      "choices": [
        {
          "label": "私の世界へ帰る。",
          "next": "epilogue_return",
          "effect": "flag_ending_return"
        },
        {
          "label": "大切な人と共に、ここに残る。",
          "next": "epilogue_bond",
          "effect": "flag_ending_bond"
        },
        {
          "label": "一人で、この世界を守る。",
          "next": "epilogue_alone",
          "effect": "flag_ending_alone"
        },
        {
          "label": "二つの世界を繋ぐ。",
          "next": "epilogue_true",
          "effect": "flag_ending_true"
        }
      ]
    },
    {
      "id": "epilogue_return",
      "type": "narrative",
      "location": "元の世界",
      "text": "你选择了回到原来的世界。\n告别很短暂，因为言葉の鍵的力量正在衰退。ミツル最后笑着说：「忘れないで。あなたの言葉は、私たちを繋いでいる。」\n睁开眼时，你躺在自己的房间里。窗外是平凡的晨光。\n但从那天起，每当你说出某个日语单词，心底就会泛起一丝温暖。",
      "next": "chapter10_complete_done"
    },
    {
      "id": "epilogue_bond",
      "type": "narrative",
      "location": "新世界・王都",
      "text": "你选择了与最重视的伙伴共同留下。\n言葉の鍵化作一座连接两个世界的桥梁，而你决定在这座桥的这一端生活。\n新的世界虽然满目疮痍，但在你们手中，城市开始重建，森林重新发芽。\n「一緒に、新しい言葉を作ろう。」",
      "next": "chapter10_complete_done"
    },
    {
      "id": "epilogue_alone",
      "type": "narrative",
      "location": "新世界・古神殿",
      "text": "你选择了独自守护两个世界的平衡。\n你成为新的守门人，坐在古神殿的祭坛前，看着两个世界之间细小的光之河流。\n偶尔会有来自异界的旅人误入，你会用日语为他们指引归途。\n孤独，却并不寂寞。",
      "next": "chapter10_complete_done"
    },
    {
      "id": "epilogue_true",
      "type": "narrative",
      "location": "新世界・境界の橋",
      "text": "你选择了最艰难也最美好的道路：让两个世界相连。\n言葉の鍵在虚空中化作一座彩虹桥，异界人与地球人可以自由往来。\nミツル目瞪口呆地看着涌来的观光客：「……ちょっと、人が多すぎない？」\n你笑着回答：「これが、新しい世界だ。」",
      "next": "chapter10_complete_done"
    },
    {
      "id": "epilogue_void",
      "type": "narrative",
      "location": "虚無の果て",
      "text": "（坏结局）你的意志被虚无吞噬，世界逐渐失去声音与色彩。\n但在最后一刻，言葉の鍵发出一道微弱的光芒——它还保留着最后一次读档的力量。",
      "next": "chapter10_complete_done"
    },
    {
      "id": "chapter10_complete_done",
      "type": "reward",
      "location": "新世界",
      "text": "恭喜！你完成了第十章「言葉の終焉と新世界」，也完成了整个修行系统的冒险。\n无论你是选择归去、留下、守护还是连接，你的日语之旅都已经成为了这个世界传说的一部分。",
      "reward": {
        "xp": 1000,
        "gold": 5000,
        "skill": "root_void_exclusion"
      }
    }
  ],

    const exams = [n5Exam, n4Exam, n3Exam, n2Exam, n1Exam];

    // ==================== UTILITIES ====================
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function takeRandom(arr, n) {
      if (!Array.isArray(arr) || arr.length === 0) return [];
      const count = Math.max(0, Math.min(Number(n) || 0, arr.length));
      return shuffle(arr).slice(0, count);
    }
    function getToday() {
      return new Date().toISOString().slice(0, 10);
    }
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;')
        .replace(/\\/g, '&#92;');
    }
    function renderQuestionText(q) {
      let text = String(q.prompt || q.question || '');
      if (q.type === 'fillblank' && typeof q.answer === 'string') {
        const blanks = '＿'.repeat(Math.max(1, q.answer.length));
        text = text.replace(/＿+/g, blanks);
      }
      return escapeHtml(text);
    }
    function formatNumber(n) {
      if (n == null || isNaN(n)) return '0';
      return n >= 10000 ? (n/10000).toFixed(1)+'w' : n.toLocaleString();
    }
    function calculateNextStreak(last, today, current) {
      if (!last) return 1;
      if (last === today) return current;
      const lastDate = new Date(last + 'T00:00:00Z');
      const todayDate = new Date(today + 'T00:00:00Z');
      const diff = (todayDate - lastDate) / 86400000;
      if (diff === 1) return current + 1;
      return 1;
    }
    function getKanaByGroup(type, group) {
      return (type === 'hiragana' ? hiragana : katakana).filter(k => k.group === group);
    }
    function getAllLessons() { return n5Stage.units.flatMap(u => u.lessons); }
    function getLessonById(id) {
      for (const unit of n5Stage.units) {
        const lesson = unit.lessons.find(l => l.id === id);
        if (lesson) return { lesson, unit };
      }
      return null;
    }
    function getQuestionById(id) {
      for (const unit of n5Stage.units) {
        for (const lesson of unit.lessons) {
          const q = lesson.questions.find(q => q.id === id);
          if (q) return { question: q, lesson };
        }
      }
      for (const exam of exams) {
        const q = exam.questions.find(q => q.id === id);
        if (q) return { question: q, lesson: { name: exam.title } };
      }
      return null;
    }
    function getStageById(id) { return id === 'n5' ? n5Stage : null; }
    function extractJapanese(text) {
      const matches = text.match(/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]+/g);
      if (!matches) return '';
      return matches.join(' ');

    // ==================== STATE MANAGEMENT ====================
    const STORAGE_KEY = 'nihongo-michi-demo-progress';
    const defaultProgress = {
      version: 1,
      ttsMode: 'web',
      currentStage: null, currentLesson: null,
      completedLessons: [], completedKana: false, completedMiniGames: [],
      totalQuestions: 0, correctQuestions: 0,
      mistakes: [],
      streakDays: 1, achievements: [], xp: 0, lastStudyDate: null,

    function validateProgress(raw) {
      const clean = JSON.parse(JSON.stringify(defaultProgress));
      if (!raw || typeof raw !== 'object') return clean;

      // Scalars
      if (typeof raw.currentStage === 'string') clean.currentStage = raw.currentStage;
      if (typeof raw.currentLesson === 'string') clean.currentLesson = raw.currentLesson;
      if (typeof raw.completedKana === 'boolean') clean.completedKana = raw.completedKana;
      if (typeof raw.streakDays === 'number' && !isNaN(raw.streakDays)) clean.streakDays = Math.max(1, raw.streakDays);
      if (typeof raw.xp === 'number' && !isNaN(raw.xp)) clean.xp = Math.max(0, raw.xp);
      if (typeof raw.totalQuestions === 'number' && !isNaN(raw.totalQuestions)) clean.totalQuestions = Math.max(0, raw.totalQuestions);
      if (typeof raw.correctQuestions === 'number' && !isNaN(raw.correctQuestions)) clean.correctQuestions = Math.max(0, Math.min(raw.correctQuestions, clean.totalQuestions));
      if (typeof raw.lastStudyDate === 'string' || raw.lastStudyDate === null) clean.lastStudyDate = raw.lastStudyDate;

      // TTS mode: default to browser (web); keep baidu if explicitly chosen; normalize legacy 'browser' to 'web'
      if (typeof raw.ttsMode === 'string' && (raw.ttsMode === 'web' || raw.ttsMode === 'browser' || raw.ttsMode === 'baidu')) {
        clean.ttsMode = raw.ttsMode === 'browser' ? 'web' : raw.ttsMode;
      } else {
        clean.ttsMode = 'web';
      }

      // Arrays of strings
      ['completedLessons', 'completedMiniGames', 'achievements'].forEach(key => {
        if (Array.isArray(raw[key])) clean[key] = raw[key].filter(x => typeof x === 'string');
      });

      // Mistakes
      if (Array.isArray(raw.mistakes)) {
        clean.mistakes = raw.mistakes
          .filter(m => m && typeof m === 'object' && (typeof m.questionId === 'string' || typeof m.id === 'string'))
          .map(m => ({
            ...m,
            questionId: typeof m.questionId === 'string' ? m.questionId : m.id,
          }));
      }

      // Daily quests: keep known ids, reset corrupted/unknown ones
      if (Array.isArray(raw.dailyQuests)) {
        raw.dailyQuests.forEach(q => {
          if (q && typeof q === 'object' && typeof q.id === 'string') {
            const target = clean.dailyQuests.find(x => x.id === q.id);
            if (target) {
              if (typeof q.current === 'number' && !isNaN(q.current)) target.current = Math.max(0, Math.min(q.current, target.total));
              target.completed = target.current >= target.total;
            }
          }
        });
      }

      // User
      if (raw.user && typeof raw.user === 'object') {
        clean.user = {
          name: typeof raw.user.name === 'string' ? raw.user.name : clean.user.name,
          isLoggedIn: typeof raw.user.isLoggedIn === 'boolean' ? raw.user.isLoggedIn : clean.user.isLoggedIn,
        };
      }

      // Xiuxing progress
      if (raw.xiuxingProgress && typeof raw.xiuxingProgress === 'object') {
        const xp = raw.xiuxingProgress;
        clean.xiuxingProgress = {
          started: typeof xp.started === 'boolean' ? xp.started : clean.xiuxingProgress.started,
          playerName: typeof xp.playerName === 'string' ? xp.playerName : clean.xiuxingProgress.playerName,
          currentNode: typeof xp.currentNode === 'string' ? xp.currentNode : clean.xiuxingProgress.currentNode,
          favor: typeof xp.favor === 'number' && !isNaN(xp.favor) ? Math.max(0, xp.favor) : clean.xiuxingProgress.favor,
          items: Array.isArray(xp.items) ? xp.items.filter(x => typeof x === 'string') : clean.xiuxingProgress.items,
          player: xp.player && typeof xp.player === 'object' ? {
            name: typeof xp.player.name === 'string' ? xp.player.name : '',
            level: typeof xp.player.level === 'number' && !isNaN(xp.player.level) ? Math.max(1, xp.player.level) : 1,
            xp: typeof xp.player.xp === 'number' && !isNaN(xp.player.xp) ? Math.max(0, xp.player.xp) : 0,
            hp: typeof xp.player.hp === 'number' && !isNaN(xp.player.hp) ? Math.max(0, xp.player.hp) : 100,
            maxHp: typeof xp.player.maxHp === 'number' && !isNaN(xp.player.maxHp) ? Math.max(1, xp.player.maxHp) : 100,
            mp: typeof xp.player.mp === 'number' && !isNaN(xp.player.mp) ? Math.max(0, xp.player.mp) : 50,
            maxMp: typeof xp.player.maxMp === 'number' && !isNaN(xp.player.maxMp) ? Math.max(1, xp.player.maxMp) : 50,
            gold: typeof xp.player.gold === 'number' && !isNaN(xp.player.gold) ? Math.max(0, xp.player.gold) : 0,
            skills: Array.isArray(xp.player.skills) ? xp.player.skills.filter(x => typeof x === 'string') : ['normal_attack'],
            inventory: Array.isArray(xp.player.inventory) ? xp.player.inventory.filter(x => typeof x === 'string') : [],
          } : clean.xiuxingProgress.player,
          combat: xp.combat === null ? null : (xp.combat && typeof xp.combat === 'object' ? {
            enemyId: typeof xp.combat.enemyId === 'string' ? xp.combat.enemyId : '',
            enemyHp: typeof xp.combat.enemyHp === 'number' && !isNaN(xp.combat.enemyHp) ? Math.max(0, xp.combat.enemyHp) : 0,
            answered: typeof xp.combat.answered === 'boolean' ? xp.combat.answered : false,
            pendingAction: xp.combat.pendingAction === null || typeof xp.combat.pendingAction === 'string' ? xp.combat.pendingAction : null,
            feedback: xp.combat.feedback === null || typeof xp.combat.feedback === 'string' ? xp.combat.feedback : null,
            log: Array.isArray(xp.combat.log) ? xp.combat.log.filter(x => typeof x === 'string') : [],
          } : null),
          log: Array.isArray(xp.log) ? xp.log.filter(x => typeof x === 'string') : [],
          questionRotation: xp.questionRotation && typeof xp.questionRotation === 'object' ? xp.questionRotation : {},
        };
      }

      // Friends
      if (Array.isArray(raw.friends)) {
        clean.friends = raw.friends.filter(f => f && typeof f === 'object' && typeof f.id === 'string' && typeof f.name === 'string').map(f => ({
          id: f.id,
          name: f.name,
          xp: typeof f.xp === 'number' && !isNaN(f.xp) ? Math.max(0, f.xp) : 0,
          xiuxingChapter: typeof f.xiuxingChapter === 'number' && !isNaN(f.xiuxingChapter) ? Math.max(0, f.xiuxingChapter) : 0,
          miniGames: typeof f.miniGames === 'number' && !isNaN(f.miniGames) ? Math.max(0, f.miniGames) : 0,
          achievements: typeof f.achievements === 'number' && !isNaN(f.achievements) ? Math.max(0, f.achievements) : 0,
          addedAt: typeof f.addedAt === 'string' ? f.addedAt : new Date().toISOString(),
          isOnline: typeof f.isOnline === 'boolean' ? f.isOnline : false,
          lastActive: typeof f.lastActive === 'string' ? f.lastActive : '刚刚',
        }));
      }

      // Objects (maps)
      if (raw.npcCollection && typeof raw.npcCollection === 'object' && !Array.isArray(raw.npcCollection)) {
        Object.keys(raw.npcCollection).forEach(k => {
          const v = raw.npcCollection[k];
          if (v && typeof v === 'object') {
            clean.npcCollection[k] = {
              unlockedAt: typeof v.unlockedAt === 'string' ? v.unlockedAt : new Date().toISOString(),
              viewed: typeof v.viewed === 'boolean' ? v.viewed : false,
            };
          }
        });
      }
      if (raw.friendChats && typeof raw.friendChats === 'object' && !Array.isArray(raw.friendChats)) {
        Object.keys(raw.friendChats).forEach(k => {
          const arr = raw.friendChats[k];
          if (Array.isArray(arr)) {
            clean.friendChats[k] = arr.filter(msg => msg && typeof msg === 'object' && typeof msg.text === 'string').map(msg => ({
              from: msg.from === 'me' || msg.from === 'friend' ? msg.from : 'me',
              text: msg.text.slice(0, 500),
              time: typeof msg.time === 'string' ? msg.time : new Date().toISOString(),
            }));
          }
        });
      }

      return clean;
    }

    function safeSetItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.error('localStorage setItem failed for key:', key, e);
        window.lastStorageError = e;
        if (typeof showToast === 'function') showToast('本地存储写入失败，请检查存储空间');
      }
    }
    function safeGetItem(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        console.error('localStorage getItem failed for key:', key, e);
        return null;
      }
    }
    function safeRemoveItem(key) {
      try {
        localStorage.removeItem(key);
      } catch (e) {
        console.error('localStorage removeItem failed for key:', key, e);
      }
    }

    let progress = loadProgress();
    let tempState = {};

    function loadProgress() {
      try {
        const raw = safeGetItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultProgress));
        const parsed = JSON.parse(raw);
        return validateProgress(parsed);
      } catch (e) { return JSON.parse(JSON.stringify(defaultProgress)); }

    function saveProgress() {
      progress.version = defaultProgress.version;

    function updateStudyDate() {
      const today = getToday();
      if (progress.lastStudyDate === today) return;
      progress.streakDays = calculateNextStreak(progress.lastStudyDate, today, progress.streakDays);
      progress.lastStudyDate = today;
      // Reset daily quests for the new day
      progress.dailyQuests.forEach(q => {
        q.current = 0;
        q.completed = false;
      });
    }

    function checkAchievements() {
      const newly = [];
      if (!progress.achievements.includes('first_step') && progress.completedLessons.length > 0) newly.push('first_step');
      if (!progress.achievements.includes('kana_master') && progress.completedKana) newly.push('kana_master');
      if (!progress.achievements.includes('n5_beginner') && ['n5-u1-l1','n5-u1-l2','n5-u1-l3'].every(id => progress.completedLessons.includes(id))) newly.push('n5_beginner');
      if (!progress.achievements.includes('mistake_zero') && progress.mistakes.length === 0 && progress.totalQuestions > 0) newly.push('mistake_zero');
      if (!progress.achievements.includes('streak_star') && progress.streakDays >= 3) newly.push('streak_star');
      if (!progress.achievements.includes('game_master') && progress.completedMiniGames.length > 0) newly.push('game_master');
      if (!progress.achievements.includes('game_champion') && progress.completedMiniGames.length >= 5) newly.push('game_champion');
      if (!progress.achievements.includes('game_legend') && progress.completedMiniGames.length >= mapNodes.length) newly.push('game_legend');
      if (newly.length) {
        progress.achievements = [...new Set([...progress.achievements, ...newly])];
        return newly;
      }
      return [];
    }

    function updateDailyQuest(id, current) {
      const q = progress.dailyQuests.find(x => x.id === id);
      if (q) {
        const prev = Number(q.current) || 0;
        q.current = Math.max(prev, Math.min(current, q.total));
        q.completed = q.current >= q.total;
      }
    }

    function addMistake(questionId, lessonId, wrongAnswer) {
      const existing = progress.mistakes.find(m => m.questionId === questionId);
      if (existing) {
        existing.lastWrongAnswer = wrongAnswer;
        saveProgress();
        return;
      }
      progress.mistakes.push({
        questionId, lessonId, addedAt: new Date().toISOString(),
        reviewCount: 0, lastReviewAt: null, nextReviewAt: new Date().toISOString(),
        lastWrongAnswer: wrongAnswer
      });

    function reviewMistake(questionId) {
      const m = progress.mistakes.find(m => m.questionId === questionId);
      if (!m) return;
      const now = new Date();
      m.reviewCount = (m.reviewCount || 0) + 1;
      m.lastReviewAt = now.toISOString();
      const intervals = [1, 2, 4, 7, 15, 30];
      const days = intervals[Math.min(m.reviewCount - 1, intervals.length - 1)];
      const next = new Date(now);
      next.setDate(next.getDate() + days);
      next.setHours(0, 0, 0, 0);
      m.nextReviewAt = next.toISOString();
      saveProgress();
    }

      for (let i = 0; i < str.length; i++) {

      }
      return Math.abs(h);
    }

    function speakBaidu(text) {
      if (!text) return;
      const audio = new Audio();
      audio.src = 'https://fanyi.baidu.com/gettts?lan=jp&text=' + encodeURIComponent(text) + '&spd=3&source=web&ctp=1';
      let failed = false;
      let timeoutId;
      const onFail = (reason) => {
        if (failed) return;
        failed = true;
        clearTimeout(timeoutId);
        audio.onerror = null;
        audio.onplay = null;
        audio.onended = null;
        if ('speechSynthesis' in window) {
          showToast('百度 TTS 不可用，已切换为浏览器语音');
          speakWeb(text);
        } else {
          showToast('网络不畅，请重试');
        }
      };
      audio.onerror = onFail;
      audio.onplay = () => clearTimeout(timeoutId);
      audio.onended = () => clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        if (!failed && (audio.paused || audio.currentTime === 0)) {
          onFail('timeout');
        }
      }, 5000);
      audio.play().catch(onFail);
    }

    function speakWeb(text) {
      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音播放');
        return;
      }
      if (!text) return;

      // Prime the voice list on every attempt; some platforms (iOS Safari) only start loading after interaction.
      ensureSpeechVoicesReady();

      // Keep the synthesis engine alive and reset any stuck/paused state
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      window.speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;

      u.onerror = (e) => {
        if (e && e.error === 'canceled') return;
        if (!speakWeb.warnedSpeakError) {
          speakWeb.warnedSpeakError = true;
          showToast('浏览器语音播放失败');
        }
      };

      const findJaVoice = (voices) => {
        return voices.find(v => v.lang && (v.lang.toLowerCase().startsWith('ja') || v.lang.toLowerCase().includes('japanese')));
      };

      const doSpeak = () => {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) {
          if (!speakWeb.warnedNoVoice) {
            speakWeb.warnedNoVoice = true;
            showToast('未检测到可用语音，跳过朗读');
          }
          return;
        }
        const jaVoice = findJaVoice(voices);
        if (jaVoice) {
          u.voice = jaVoice;
        } else if (!warnedNoJaVoice) {
          warnedNoJaVoice = true;
          showToast('未检测到日语语音包，将使用默认语音朗读');
        }
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      };

      if (window.speechSynthesis.getVoices().length) {
        doSpeak();
      } else {
        let handler;
        const timeout = setTimeout(() => {
          window.speechSynthesis.removeEventListener('voiceschanged', handler);
          doSpeak();
        }, 2000);
        handler = () => {
          clearTimeout(timeout);
          window.speechSynthesis.removeEventListener('voiceschanged', handler);
          doSpeak();
        };
        window.speechSynthesis.addEventListener('voiceschanged', handler);
      }
    }

          return decodeURIComponent(p);
        } catch (e) {

        }
      };
      const name = decode(parts[0] || '') || 'home';
      const params = parts.slice(1).map(decode);
      return { name, params };

    function getFocusSelector(el) {
      const parts = [];
      let node = el;
      while (node && node !== document.body) {
        let tag = node.tagName ? node.tagName.toLowerCase() : 'unknown';
        if (node.id) {
          parts.unshift((typeof CSS !== 'undefined' && CSS.escape ? '#' + CSS.escape(node.id) : '#id'));
          break;
        }
        const parent = node.parentElement;
        if (parent) {
          const siblings = Array.from(parent.children).filter(c => c.tagName === node.tagName);
          const index = siblings.indexOf(node) + 1;
          if (siblings.length > 1) tag += ':nth-of-type(' + index + ')';
        }
        parts.unshift(tag);
        node = parent;
      }
      return parts.join(' > ');
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      const routeChanged = previousRoute !== currentRoute;
      previousRoute = currentRoute;

      const routeFn = Object.prototype.hasOwnProperty.call(routes, currentRoute) ? routes[currentRoute] : renderNotFound;
      const mainHtml = routeFn();
      const shellHtml = '<div class="page-bg"></div>' + renderNavbar() + renderMobileMenu() + '<main id="appMain"></main>' + renderFooter();
      const fullHtml = '<div class="page-bg"></div>' + renderNavbar() + renderMobileMenu() + '<main id="appMain">' + mainHtml + '</main>' + renderFooter();

      const active = document.activeElement;
      let focusRestore = null;
      if (active && active !== document.body) {
        focusRestore = active.id
          ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
          : { selector: getFocusSelector(active), start: active.selectionStart, end: active.selectionEnd };
      }
      const scrollX = window.pageXOffset || 0;
      const scrollY = window.pageYOffset || 0;

      // Use getElementById so the same logic works in real browsers and simplified test stubs.
      let main = document.getElementById('appMain');
      if (main && main.parentElement !== app) main = null;

      if (!main || shellHtml !== app._lastShellHtml) {
        app._lastShellHtml = shellHtml;
        app._lastMainHtml = mainHtml;
        app.innerHTML = fullHtml;
        bindEvents();
      } else if (mainHtml !== app._lastMainHtml) {
        main.innerHTML = mainHtml;
        app._lastMainHtml = mainHtml;
      }

      requestAnimationFrame(() => {
        const xiuxingLog = document.getElementById('xiuxingCombatLog');
        if (xiuxingLog) xiuxingLog.scrollTop = xiuxingLog.scrollHeight;
        const typingInput = document.getElementById('kanaTypingInput');
        if (typingInput && !typingInput.disabled) typingInput.focus();

        if (!routeChanged && focusRestore) {
          let el = null;
          if (focusRestore.id) {
            el = document.getElementById(focusRestore.id);
          } else if (focusRestore.selector) {
            try { el = document.querySelector(focusRestore.selector); } catch (e) {}
          }
          if (el && el.focus && !el.disabled) {
            el.focus();
            if (typeof focusRestore.start === 'number' && typeof el.selectionStart !== 'undefined') {
              try { el.setSelectionRange(focusRestore.start, focusRestore.end); } catch (e) {}
            }
          }
          if (typeof window.scrollTo === 'function') window.scrollTo(scrollX, scrollY);
        }
      });
    }

    function icon(name, size, attrs) {
      if (!size) size = 20;
      var svg = ICONS[name] || '';
      if (svg) svg = svg.replace(/width="[^"]*"/, 'width="' + size + '"').replace(/height="[^"]*"/, 'height="' + size + '"');

    }
    function stageIcon(iconVal, size) {
      if (!size) size = 28;
      if (ICONS[iconVal]) return icon(iconVal, size);
      return '<span style="font-size:' + size + 'px;">' + escapeHtml(iconVal) + '</span>';
    }

    function dispatchHandler(handler, el, argPrefix) {
      const args = [];
      const d = el.dataset;
      if (d[argPrefix + '0'] !== undefined) args.push(d[argPrefix + '0']);
      if (d[argPrefix + '1'] !== undefined) args.push(d[argPrefix + '1']);
      if (d[argPrefix + '2'] !== undefined) args.push(d[argPrefix + '2']);
      if (args.length) {
        handler.apply(null, args);
      } else {
        handler.call(null, el);
      }
    }
    function bindEvents() {
      const app = document.getElementById('app');
      if (!app) return;
      if (!app._actionDelegated) {
        app._actionDelegated = true;

        // Delegate navigation for data-nav links
        app.addEventListener('click', e => {
          const el = e.target.closest('[data-nav]');
          if (!el) return;
          e.preventDefault();
          e.stopPropagation();
          const href = el.getAttribute('href').slice(1);
          tempState.mobileMenuOpen = false;
          navigate(href);
        });

        // Delegate actions for data-action buttons (replaces inline onclick handlers)
        app.addEventListener('click', e => {
          const el = e.target.closest('[data-action]');
          if (!el || el.tagName === 'FORM') return;
          const action = el.dataset.action;
          const handler = window[action];
          if (typeof handler !== 'function') return;
          e.preventDefault();
          e.stopPropagation();
          dispatchHandler(handler, el, 'arg');
        });

        // Overlay close on background click
        app.addEventListener('click', e => {
          const el = e.target.closest('[data-overlay-close]');
          if (!el || e.target !== el) return;
          const action = el.dataset.overlayClose;
          const handler = window[action];
          if (typeof handler === 'function') {
            e.preventDefault();
            e.stopPropagation();
            handler();
          }
        });

        // Enter key handling for data-enter-action inputs
        app.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const el = e.target.closest('[data-enter-action]');
          if (!el) return;
          const action = el.dataset.enterAction;
          const handler = window[action];
          if (typeof handler !== 'function') return;
          e.preventDefault();
          e.stopPropagation();
          dispatchHandler(handler, el, 'enterArg');
        });

        // Two-way state binding for data-bind-state inputs
        app.addEventListener('input', e => {
          const el = e.target.closest('[data-bind-state]');
          if (!el) return;
          const path = el.dataset.bindState.split('.');
          let target = tempState;
          for (let i = 0; i < path.length - 1; i++) {
            if (!target[path[i]]) target[path[i]] = {};
            target = target[path[i]];
          }
          target[path[path.length - 1]] = el.value;
        });

        // Form submit delegation for data-action forms
        app.addEventListener('submit', e => {
          const el = e.target.closest('[data-action]');
          if (!el) return;
          const action = el.dataset.action;
          const handler = window[action];
          if (typeof handler !== 'function') return;
          e.preventDefault();
          e.stopPropagation();
          dispatchHandler(handler, el, 'arg');
        });

      }

      // Mobile menu button is only rebound when a new shell is created
      const menuBtn = document.getElementById('mobileMenuBtn');
      if (menuBtn && !menuBtn._menuBound) {
        menuBtn._menuBound = true;
        menuBtn.addEventListener('click', () => {
          tempState.mobileMenuOpen = !tempState.mobileMenuOpen;
          render();
        });
      }
    }

    window.submitFillBlank = function(inputId, onClickName) {

        { id: "n5", name: "N5 入门", description: "简单日常对话", icon: "🌸", href: "stage/n5" },
        { id: "n4", name: "N4 基础", description: "应对日常场景", icon: "⛩️", href: "#" },
        { id: "n3", name: "N3 进阶", description: "看懂日常文章", icon: "🗻", href: "#" },
        { id: "n2", name: "N2 中高级", description: "工作留学场景", icon: "🎌", href: "#" },
        { id: "n1", name: "N1 高级", description: "阅读抽象文章", icon: "👑", href: "#" },
      ];
      const getStatus = (id) => {
        if (id === 'kana') return progress.completedKana ? 'completed' : 'in_progress';
        if (id === 'n5') {
          if (!progress.completedKana) return 'locked';
          const allCompleted = getAllLessons().every(l => isLessonCompleted(l.id));
          return allCompleted ? 'completed' : 'in_progress';
        }
        return 'locked';
      };
      return `
        <div class="container page-section animate-fadeInUp" style="max-width:48rem;">
          <div class="text-center mb-8">
            <div class="badge bg-primary-light text-primary mb-3">${icon('bookOpen', 14)} 全部课程</div>
            <h1 class="section-title sm:text-3xl" style="background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; color:transparent;">课程目录</h1>
            <p class="section-subtitle mt-2">从零基础到 N1，系统化学习日语</p>
          </div>
          <div class="flex flex-col gap-4">
            ${stages.map(stage => {
              const status = getStatus(stage.id);
              const unlocked = status !== 'locked';
              return `
                ${unlocked
                  ? `<a href="#${stage.href}" class="card card-soft card-hover transition-all p-4 sm:p-6 flex items-center gap-4 sm:gap-6 rounded-3xl" data-nav style="border-color:${status === 'in_progress' ? 'var(--primary)' : 'var(--success)'}; background:${status === 'in_progress' ? 'var(--card)' : 'var(--success-light)'}">
                      <div style="width:5rem;height:5rem;flex-shrink:0;border-radius:1rem;display:flex;align-items:center;justify-content:center; font-weight:700; background:${status === 'completed' ? 'var(--success)' : 'var(--primary)'}; color:white;">
                        ${status === 'completed' ? icon('checkCircle2', 40) : stageIcon(stage.icon, 36)}
                      </div>
                      <div class="flex-1">
                        <div class="flex items-center gap-2">
                          <h2 class="font-extrabold text-lg sm:text-xl" style="color:var(--foreground);">${escapeHtml(stage.name)}</h2>
                        </div>
                        <p class="text-sm text-muted">${escapeHtml(stage.description)}</p>
                        ${status === 'in_progress' ? '<span class="inline-flex rounded-lg bg-primary-light text-primary mt-2" style="padding:0.25rem 0.75rem; font-size:0.75rem; font-weight:800;">进行中</span>' : ''}
                        ${status === 'completed' ? '<span class="inline-flex rounded-lg bg-success-light text-success mt-2" style="padding:0.25rem 0.75rem; font-size:0.75rem; font-weight:800;">已完成</span>' : ''}
                      </div>
                      ${icon('arrowRight', 24, 'color:var(--primary);')}
                    </a>`
                  : `<div class="card card-soft transition-all p-4 sm:p-6 flex items-center gap-4 sm:gap-6 rounded-3xl" style="border-color:var(--border); background:var(--muted-light); opacity:0.85;">
                      <div style="width:5rem;height:5rem;flex-shrink:0;border-radius:1rem;display:flex;align-items:center;justify-content:center; font-weight:700; background:var(--border); color:var(--muted);">
                        ${icon('lock', 36)}
                      </div>
                      <div class="flex-1">
                        <div class="flex items-center gap-2">
                          <h2 class="font-extrabold text-lg sm:text-xl" style="color:var(--muted);">${escapeHtml(stage.name)}</h2>
                          ${icon('lock', 16, 'color:var(--muted);')}
                        </div>
                        <p class="text-sm text-muted" style="opacity:0.7;">${escapeHtml(stage.description)}</p>
                        <span class="inline-flex rounded-lg bg-muted-light text-muted mt-2" style="padding:0.25rem 0.75rem; font-size:0.75rem; font-weight:800;">未解锁</span>
                      </div>
                    </div>`
                }
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ==================== KANA ====================
    function renderKana() {
      const type = tempState.kanaType || 'hiragana';
      const group = tempState.kanaGroup || 'seion';
      const groups = [
        { id: 'seion', label: '清音' },
        { id: 'dakuon', label: '浊音' },
        { id: 'handakuon', label: '半浊音' },
        { id: 'yoon', label: '拗音' },
      ];
      const list = getKanaByGroup(type, group);
      return `
        <div class="container page-section animate-fadeInUp" style="max-width:56rem;">
          <div class="text-center mb-8">
            <div class="badge bg-primary-light text-primary mb-3">${icon('graduationCap', 14)} 第一阶段</div>
            <h1 class="section-title sm:text-3xl" style="background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; color:transparent;">学习五十音图</h1>
            <p class="section-subtitle mt-2">掌握平假名和片假名，是日语学习的第一步</p>
          </div>

          <div class="flex justify-center mb-4">
            <div class="card" style="padding:0.25rem; display:inline-flex;">
              <button class="btn btn-sm ${type === 'hiragana' ? 'btn-primary' : 'btn-ghost'}" data-action="setKanaType" data-arg0="hiragana">平假名</button>
              <button class="btn btn-sm ${type === 'katakana' ? 'btn-primary' : 'btn-ghost'}" data-action="setKanaType" data-arg0="katakana">片假名</button>
            </div>
          </div>

          <div class="flex flex-wrap justify-center gap-2 mb-6">
            ${groups.map(g => `
              <button class="btn btn-sm ${group === g.id ? 'btn-primary' : 'btn-ghost'}" data-action="setKanaGroup" data-arg0="${escapeHtml(g.id)}">${escapeHtml(g.label)}</button>
            `).join('')}
          </div>

          ${tempState.kanaTTSError ? `<div class="mb-4 flex items-center justify-center gap-2 rounded-2xl bg-error-light px-4 py-3 text-sm font-bold text-error" aria-live="polite" aria-atomic="true">${icon('alertCircle', 16)} ${escapeHtml(tempState.kanaTTSError)}</div>` : ''}

          <div class="card p-4 sm:p-6 mb-6">
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-3" role="list" aria-label="五十音列表">
              ${list.map(k => `
                <button class="kana-card" data-action="speakKana" data-arg0="${escapeHtml(k.kana)}" aria-label="朗读 ${escapeHtml(k.kana)}（${escapeHtml(k.romaji)}）">
                  <span class="kana-char" aria-hidden="true">${escapeHtml(k.kana)}</span>
                  <span class="kana-roma" aria-hidden="true">
                    ${escapeHtml(k.romaji)}
                    <svg class="kana-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                  </span>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="flex flex-col items-center gap-4">
            <p class="text-muted" style="font-size:0.875rem;">已经记住这些假名了吗？来测试一下吧！</p>
            <a href="#kana-test" class="btn btn-primary btn-lg" data-nav>${progress.completedKana ? '再测一次' : '开始测试'} ${icon('arrowRight', 24)}</a>
            ${progress.completedKana ? `<div class="flex items-center gap-2" style="background:var(--success-light); color:var(--success); border-radius:0.75rem; padding:0.5rem 1rem; font-size:0.875rem; font-weight:800;">${icon('checkCircle2', 16)} 已通过五十音测试，N5 已解锁</div>` : ''}
          </div>
        </div>
      `;
    }

    window.setKanaType = function(t) { tempState.kanaType = t; render(); };
    window.setKanaGroup = function(g) { tempState.kanaGroup = g; render(); };

    window.speakKana = function(text) {
      tempState.kanaTTSError = null;
      try {
        speak(text);
      } catch (err) {
        tempState.kanaTTSError = err instanceof Error ? err.message : '语音播放失败';
        render();
        window.setTimeout(() => { tempState.kanaTTSError = null; render(); }, 3000);
      }
    };

    // ==================== KANA TEST ====================
    function renderKanaTest() {
      if (!tempState.kanaTest) initKanaTest();
      const state = tempState.kanaTest;
      if (state.finished) return renderKanaTestResult(state);
      const q = state.questions[state.currentIndex];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="mb-6">
            <div class="flex justify-between text-sm mb-2">
              <span class="font-bold">第 ${state.currentIndex + 1} / ${state.questions.length} 题</span>
              <span class="text-muted">得分：${state.score}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.currentIndex + 1}" aria-label="答题进度">
              <div style="width:${((state.currentIndex + 1) / state.questions.length) * 100}%; background:var(--primary);"></div>
            </div>
          </div>

          <div class="text-center mb-8">
            <div class="text-muted mb-4" style="font-size:0.875rem;">请选择这个假名的读音</div>
            <div style="width:10rem;height:10rem;margin:0 auto;border-radius:1.5rem;border:4px solid var(--primary); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:800; color:var(--primary); box-shadow:0 10px 25px -5px rgba(255,107,157,0.3);" class="font-jp" role="img" aria-label="假名 ${escapeHtml(q.kana)}">${escapeHtml(q.kana)}</div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" role="group" aria-label="选项">
            ${q.options.map((opt, idx) => {
              let cls = 'option-btn';
              if (state.answered) {
                if (opt === q.answer) cls += ' correct';
                else if (opt === state.selected) cls += ' wrong animate-shake';
                else cls += ' dim';
              }
              return `<button class="${cls}" ${state.answered ? 'disabled' : ''} data-action="selectKanaOption" data-arg0="${escapeHtml(opt)}" style="justify-content:center;"><span>${escapeHtml(opt)}</span></button>`;
            }).join('')}
          </div>

          ${state.answered ? `
            <div class="card p-4 mt-6 ${state.selected === q.answer ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.selected === q.answer ? 'var(--success)' : 'var(--error)'};" aria-live="polite" aria-atomic="true">
              <div class="flex items-center gap-2 font-bold ${state.selected === q.answer ? 'text-success' : 'text-error'}">
                ${state.selected === q.answer ? icon('checkCircle2', 18) + ' 回答正确！' : icon('xCircle', 18) + ' 回答错误'}
              </div>
              <p class="text-muted mt-1" style="font-size:0.875rem;">「${escapeHtml(q.kana)}」的正确读音是 <strong>${escapeHtml(q.answer)}</strong></p>
            </div>
            <div class="text-center mt-6">
              <button class="btn btn-primary btn-lg" data-action="nextKanaQuestion">${state.currentIndex < state.questions.length - 1 ? '下一题 ' + icon('arrowRight', 18) : '查看结果 ' + icon('arrowRight', 18)}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function initKanaTest() {
      const items = takeRandom(hiragana.filter(k => k.group === 'seion'), 10);
      const allRomaji = hiragana.filter(k => k.group === 'seion').map(k => k.romaji);
      const questions = items.map(k => {
        const distractors = shuffle(allRomaji.filter(r => r !== k.romaji)).slice(0, 3);
        return { kana: k.kana, answer: k.romaji, options: shuffle([k.romaji, ...distractors]) };
      });
      tempState.kanaTest = { questions, currentIndex: 0, score: 0, answered: false, selected: null, finished: false };
    }

    window.selectKanaOption = function(opt) {
      const state = tempState.kanaTest;
      if (state.answered) return;
      state.selected = opt;
      state.answered = true;
      if (opt === state.questions[state.currentIndex].answer) state.score++;
      render();
    };

    window.nextKanaQuestion = function() {
      const state = tempState.kanaTest;
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex++;
        state.answered = false;
        state.selected = null;
        render();
      } else {
        state.finished = true;
        const pct = Math.round((state.score / state.questions.length) * 100);
        recordQuestions(state.score, state.questions.length);
        if (pct >= 70) completeKana(pct);
        render();
      }
    };

    function renderKanaTestResult(state) {
      const pct = Math.round((state.score / state.questions.length) * 100);
      const passed = pct >= 70;
      return `
        <div class="container page-section" style="max-width:28rem; text-align:center;">
          <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%; background:${passed ? 'var(--success-light)' : 'var(--error-light)'}; color:${passed ? 'var(--success)' : 'var(--error)'}; display:flex; align-items:center; justify-content:center; font-size:2.5rem;">${passed ? icon('trophy', 40) : icon('xCircle', 40)}</div>
          <h1 class="section-title mt-4">${passed ? '恭喜通过测试！' : '再试一次吧'}</h1>
          <p class="text-muted mb-6">你答对了 ${state.score}/${state.questions.length} 题，得分 ${pct} 分${passed ? '，N5 课程已解锁！' : '，需要 70 分才能解锁 N5'}</p>

          <div class="card p-6 mb-8" aria-live="polite" aria-atomic="true">
            <div class="text-muted" style="font-size:0.875rem;">测试成绩</div>
            <div style="font-size:3rem; font-weight:800; color:var(--primary);">${pct}%</div>
            <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="测试成绩">
              <div style="width:${pct}%; background:${passed ? 'var(--success)' : 'var(--error)'};"></div>
            </div>
          </div>

          <div class="flex flex-col gap-3">
            ${passed ? `<a href="#stage/n5" class="btn btn-primary btn-lg" data-nav>开始学习 N5 ${icon('arrowRight', 18)}</a>` : `<button class="btn btn-primary btn-lg" data-action="resetKanaTest">${icon('rotateCcw', 18)} 重新测试</button>`}
            <a href="#kana" class="btn btn-secondary" data-nav>返回五十音图</a>
          </div>
        </div>
      `;
    }

    window.resetKanaTest = function() { initKanaTest(); render(); };

    // ==================== STAGE ====================
    function renderStage() {
      const stageId = routeParams[0] || 'n5';
      if (stageId === 'kana') return renderKana();
      const path = routeParams;
      const stage = getStageById(stageId);
      if (!stage) return renderUnimplementedStage(stageId);
      // Project-style nested paths:
      // stage/n5/unit/n5-u1/lesson/n5-u1-l1 => lesson detail
      // stage/n5/unit/n5-u1/test => unit test
      // stage/n5/test => stage test
      if (!isStageUnlocked(stageId)) return renderLockedStage(stageId);
      if (path.length >= 4 && path[1] === 'unit' && path[3] === 'lesson' && path[4]) {
        return renderLessonDetail(stageId, path[2], path[4]);
      }
      if (path.length === 4 && path[1] === 'unit' && path[3] === 'test') {
        return renderQuizView('unit', path[2]);
      }
      if (path.length === 2 && path[1] === 'test') {
        return renderQuizView('stage', stageId);
      }
      const all = getAllLessons();
      const completedCount = all.filter(l => isLessonCompleted(l.id)).length;
      return `
        <div class="container page-section" style="max-width:48rem;">
          <div class="card-soft rounded-3xl border-2 border-border bg-card p-6 mb-6">
            <div class="flex items-center gap-4">
              <div style="width:4rem;height:4rem;border-radius:0.75rem;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;">${stageIcon(stage.icon, 36)}</div>
              <div>
                <h1 class="section-title" style="font-size:1.5rem;">${escapeHtml(stage.name)}</h1>
                <p class="text-muted" style="font-size:0.875rem;">${escapeHtml(stage.description)}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-muted mt-4" style="font-size:0.875rem;">${icon('bookOpen', 16)} 已完成 ${completedCount} / ${all.length} 课</div>
            <div class="progress-bar mt-3" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${completedCount}" aria-label="阶段完成进度">
              <div style="width:${all.length ? Math.min((completedCount / all.length) * 100, 100) : 0}%; background:var(--primary);"></div>
            </div>
            <a href="#stage/${encodeURIComponent(stageId)}/test" class="btn btn-primary w-full mt-4" data-nav>${icon('graduationCap', 18)} 阶段测试</a>
          </div>

          <div class="flex flex-col gap-6">
            ${stage.units.map(unit => `
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 style="font-size:1.125rem;font-weight:800;">${escapeHtml(unit.name)}</h2>
                  <a href="#stage/${encodeURIComponent(stageId)}/unit/${encodeURIComponent(unit.id)}/test" class="flex items-center gap-1 rounded-xl bg-primary-light px-3 py-1.5 text-xs font-bold text-primary" data-nav style="text-decoration:none;transition:all 0.15s ease;">${icon('clipboardCheck', 14)} 单元测试</a>
                </div>
                <div class="flex flex-col gap-3">
                  ${unit.lessons.map((lesson, i) => {
                    const completed = isLessonCompleted(lesson.id);
                    const current = !completed && unit.lessons.slice(0, i).every(l => isLessonCompleted(l.id));
                    const locked = !(completed || current);
                    const href = locked ? '' : ` href="#stage/${encodeURIComponent(stageId)}/unit/${encodeURIComponent(unit.id)}/lesson/${encodeURIComponent(lesson.id)}"`;
                    const navAttr = locked ? '' : ' data-nav';
                    return `
                      <${locked ? 'div' : 'a'}${href}${navAttr} class="card-soft flex items-center justify-between rounded-2xl border-2 p-4" style="border-color:${completed ? 'var(--success)' : current ? 'var(--primary)' : 'var(--border)'}; background:${completed ? 'var(--success-light)' : current ? 'var(--card)' : 'var(--muted-light)'}; ${locked ? 'cursor:not-allowed;' : ''}" aria-disabled="${locked ? 'true' : 'false'}">
                        <div class="flex items-center gap-4">
                          <div style="width:3rem;height:3rem;border-radius:0.75rem;display:flex;align-items:center;justify-content:center; color:white; background:${completed ? 'var(--success)' : current ? 'var(--primary)' : 'var(--border)'};">${completed ? icon('check', 20) : '<span style="font-size:1.125rem;font-weight:800;">' + (i + 1) + '</span>'}</div>
                          <div>
                            <div class="font-bold ${completed || current ? '' : 'text-muted'}">${escapeHtml(lesson.name)}</div>
                            <div class="text-muted" style="font-size:0.75rem;">${completed ? '已完成' : current ? '继续学习' : '未解锁'}</div>
                          </div>
                        </div>
                        <div class="font-bold text-primary" style="font-size:0.875rem;">${completed ? '复习' : current ? '开始' : '锁定'}</div>
                      </${locked ? 'div' : 'a'}>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderLockedStage(stageId) {
      const meta = stageMetaList.find(s => s.id === stageId) || stageMetaList[0];
      return `
        <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
          <div class="text-center">
            <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--muted-light);color:var(--muted);display:flex;align-items:center;justify-content:center;">${icon('lock', 40)}</div>
            <h1 class="section-title mt-4">${escapeHtml(meta.name)} 尚未解锁</h1>
            <p class="text-muted mb-6">请先完成上一阶段的所有课程</p>
            <a href="#courses" class="btn btn-primary inline-flex items-center gap-2" data-nav>查看课程目录 ${icon('arrowRight', 18)}</a>
          </div>
        </div>
      `;
    }

    function renderUnimplementedStage(stageId) {
      const meta = stageMetaList.find(s => s.id === stageId);
      const name = meta ? meta.name : stageId.toUpperCase();
      return `
        <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
          <div class="text-center">
            <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--muted-light);color:var(--muted);display:flex;align-items:center;justify-content:center;">${icon('alertCircle', 40)}</div>
            <h1 class="section-title mt-4">该阶段尚未解锁或暂未开放</h1>
            <p class="text-muted mb-6">${escapeHtml(name)} 还在开发中，敬请期待</p>
            <a href="#home" class="btn btn-primary inline-flex items-center gap-2" data-nav>返回首页 ${icon('arrowRight', 18)}</a>
          </div>
        </div>
      `;
    }

    // ==================== LESSON ====================
    function renderLesson() {
      // Legacy direct lesson route: #lesson/n5-u1-l1 (defaults to n5)
      const lessonId = routeParams[0];
      return renderLessonDetail('n5', null, lessonId);
    }

    function renderLessonDetail(stageId, unitId, lessonId) {
      if (!isStageUnlocked(stageId || 'n5')) {
        return `
          <div class="container page-section flex items-center justify-center" style="min-height:60vh;">
            <div class="text-center">
              <div style="width:5rem;height:5rem;margin:0 auto;border-radius:50%;background:var(--muted-light);color:var(--muted);display:flex;align-items:center;justify-content:center;">${icon('lock', 40)}</div>
              <h1 class="section-title mt-4">课程尚未解锁</h1>
              <p class="text-muted mb-6">请先完成上一阶段的课程</p>
              <a href="#courses" class="btn btn-primary inline-flex items-center gap-2" data-nav>查看课程目录 ${icon('bookOpen', 18)}</a>
            </div>
          </div>
        `;
      }
      const found = getLessonById(lessonId);
      if (!found) return `<div class="container page-section">课程不存在</div>`;
      const { lesson, unit } = found;
      const completed = isLessonCompleted(lesson.id);
      const stage = getStageById(stageId || 'n5');
      const stageLessons = stage.units.flatMap(u => u.lessons);
      const currentStageIndex = stageLessons.findIndex(l => l.id === lessonId);
      const prevLesson = stageLessons[currentStageIndex - 1];
      const nextLesson = stageLessons[currentStageIndex + 1];
      const getUnitOfLesson = (l) => stage.units.find(u => u.lessons.some(x => x.id === l.id));
      const prevUnit = prevLesson ? getUnitOfLesson(prevLesson) : null;
      const nextUnit = nextLesson ? getUnitOfLesson(nextLesson) : null;

      const speakIcon = `<button class="btn btn-ghost btn-sm" style="padding:0.375rem; color:var(--muted);" data-action="speak" data-arg0="__TEXT__" aria-label="朗读">${icon('volume2', 18)}</button>`;

      return `
        <div class="container page-section" style="max-width:72rem;">
          <div class="grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-6">
            <aside class="hidden lg:block">
              <div class="card-soft rounded-3xl border-2 border-border bg-card p-4" style="position:sticky; top:6rem;">
                <div class="mb-4 px-2">
                  <div class="text-muted" style="font-size:0.75rem;font-weight:800;">${escapeHtml(stage.name)}</div>
                  <div style="font-weight:800;">${escapeHtml(unit.name)}</div>
                </div>
                <div class="flex flex-col gap-1">
                  ${unit.lessons.map((l, index) => {
                    const isCompleted = isLessonCompleted(l.id);
                    const isCurrent = l.id === lessonId;
                    return `
                      <a href="#stage/${encodeURIComponent(stageId)}/unit/${encodeURIComponent(unit.id)}/lesson/${encodeURIComponent(l.id)}" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-bold transition-colors" data-nav style="background:${isCurrent ? 'var(--primary-light)' : 'transparent'}; color:${isCurrent ? 'var(--primary)' : isCompleted ? 'var(--success)' : 'var(--muted)'}; text-decoration:none;">
                        <div style="width:1.5rem;height:1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white; background:${isCompleted ? 'var(--success)' : isCurrent ? 'var(--primary)' : 'var(--border)'}">${isCompleted ? icon('check', 14) : '<span style="font-size:0.75rem;">' + (index + 1) + '</span>'}</div>
                        <span class="truncate">${escapeHtml(l.name)}</span>
                      </a>
                    `;
                  }).join('')}
                </div>
              </div>
            </aside>

            <div>
              <div class="mb-6 flex items-center justify-between">
                <div>
                  <div class="text-muted" style="font-size:0.875rem;">${escapeHtml(unit.name)} · ${escapeHtml(stage.name)}</div>
                  <h1 class="section-title" style="font-size:1.5rem;">${escapeHtml(lesson.name)}</h1>
                </div>
                ${completed ? `<div class="flex items-center gap-1 rounded-xl bg-success-light px-3 py-1.5 text-sm font-bold text-success">${icon('checkCircle2', 16)} 已完成</div>` : ''}
              </div>

              <div class="flex flex-col gap-4 mb-6">
                ${lesson.content.grammar.map((g, idx) => `
                  <div class="card-soft rounded-3xl border-2 border-border bg-card p-5 sm:p-6">
                    <div class="badge bg-primary-light text-primary mb-3" style="display:inline-flex; align-items:center; gap:0.375rem;">语法点 ${idx + 1}</div>
                    <h2 class="font-jp section-title-sm" style="color:var(--primary);margin-bottom:0.5rem;">${escapeHtml(g.pattern)}</h2>
                    <p style="font-weight:700;margin-bottom:0.75rem;">${escapeHtml(g.meaning)}</p>
                    <div class="rounded-xl p-4 mb-4" style="background:var(--muted-light);font-size:0.875rem;">
                      <span style="font-weight:700;">用法：</span><span class="text-muted">${escapeHtml(g.usage)}</span>
                    </div>
                    ${g.examples.length > 0 ? `
                      <div class="flex flex-col gap-3">
                        <div style="font-size:0.875rem;font-weight:800;color:var(--muted);">例句</div>
                        ${g.examples.map(ex => `
                          <div class="card-soft rounded-2xl border-2 border-border p-4 flex items-start justify-between gap-3" style="background:var(--background);">
                            <div>
                              <p class="font-jp" style="font-size:1.125rem;font-weight:700;">${escapeHtml(ex.japanese)}</p>
                              ${ex.romaji ? `<p style="font-size:0.875rem;color:var(--muted);font-style:italic;">${escapeHtml(ex.romaji)}</p>` : ''}
                              <p style="font-size:0.875rem;color:var(--muted);">${escapeHtml(ex.meaning)}</p>
                            </div>
                            ${speakIcon.replace('__TEXT__', escapeHtml(extractJapanese(ex.japanese)))}
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>

              ${lesson.content.vocabulary.length > 0 ? `
                <div class="mb-6">
                  <h2 style="font-size:1.125rem;font-weight:800;margin-bottom:1rem;">词汇</h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${lesson.content.vocabulary.map(v => `
                      <div class="card-soft rounded-2xl border-2 border-border bg-card p-4 flex items-center justify-between gap-3">
                        <div>
                          <p class="font-jp" style="font-size:1.125rem;font-weight:700;">${escapeHtml(v.word)}</p>
                          <p style="font-size:0.875rem;color:var(--muted);font-style:italic;">${escapeHtml(v.romaji)}</p>
                          <p style="font-size:0.875rem;color:var(--muted);">${escapeHtml(v.meaning)}${v.pos ? `<span style="color:var(--primary);font-size:0.75rem;margin-left:0.5rem;">${escapeHtml(v.pos)}</span>` : ''}</p>
                        </div>
                        ${speakIcon.replace('__TEXT__', escapeHtml(extractJapanese(v.word)))}
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${lesson.content.examples.length > 0 ? `
                <div class="mb-6">
                  <h2 style="font-size:1.125rem;font-weight:800;margin-bottom:1rem;">更多例句</h2>
                  <div class="flex flex-col gap-3">
                    ${lesson.content.examples.map(ex => `
                      <div class="card-soft rounded-2xl border-2 border-border bg-card p-4 flex items-start justify-between gap-3">
                        <div>
                          <p class="font-jp" style="font-size:1.125rem;font-weight:700;">${escapeHtml(ex.japanese)}</p>
                          ${ex.romaji ? `<p style="font-size:0.875rem;color:var(--muted);font-style:italic;">${escapeHtml(ex.romaji)}</p>` : ''}
                          <p style="font-size:0.875rem;color:var(--muted);">${escapeHtml(ex.meaning)}</p>
                        </div>
                        ${speakIcon.replace('__TEXT__', escapeHtml(extractJapanese(ex.japanese)))}
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${lesson.content.notes && lesson.content.notes.length > 0 ? `
                <div class="mb-6 rounded-2xl border-2 border-warning p-4" style="background:var(--warning-light);">
                  <h3 style="font-size:0.875rem;font-weight:800;color:var(--warning-dark);margin-bottom:0.5rem;">注意点</h3>
                  <ul style="margin:0;padding-left:1.25rem;font-size:0.875rem;">
                    ${lesson.content.notes.map(n => `<li class="mt-1">${escapeHtml(n)}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}

              <div class="flex flex-col sm:flex-row gap-3 mb-6">
                ${!completed ? `
                  <button class="btn btn-primary flex-1 btn-lg" data-action="completeLessonAndRender" data-arg0="${lesson.id}">${icon('checkCircle2', 18)} 标记为已完成</button>
                ` : `
                  <a href="#practice/lesson/${encodeURIComponent(lesson.id)}" class="btn btn-primary flex-1 btn-lg" data-nav>${icon('dumbbell', 18)} 去做练习</a>
                `}
                <a href="#practice/lesson/${encodeURIComponent(lesson.id)}" class="btn btn-secondary flex items-center justify-center gap-2 rounded-2xl px-6 py-4 font-bold" data-nav>${icon('dumbbell', 18)} 练习</a>
              </div>

              <div class="flex items-center justify-between">
                ${prevLesson ? `<a href="#stage/${encodeURIComponent(stageId)}/unit/${encodeURIComponent(prevUnit ? prevUnit.id : unit.id)}/lesson/${encodeURIComponent(prevLesson.id)}" class="flex items-center gap-1 text-sm font-bold text-muted" data-nav style="text-decoration:none;transition:color 0.15s ease;">${icon('arrowLeft', 16)} 上一课</a>` : '<span></span>'}
                ${nextLesson ? `<a href="#stage/${encodeURIComponent(stageId)}/unit/${encodeURIComponent(nextUnit ? nextUnit.id : unit.id)}/lesson/${encodeURIComponent(nextLesson.id)}" class="flex items-center gap-1 text-sm font-bold text-primary" data-nav style="text-decoration:none;transition:color 0.15s ease;">下一课 ${icon('arrowRight', 16)}</a>` : '<span></span>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== QUIZ / TEST SESSION ====================
    function seedFillBlankOptions() {
      const fillAnswers = [];
      for (const unit of n5Stage.units) {
        for (const lesson of unit.lessons) {
          for (const q of lesson.questions) {
            if (q.type === 'fillblank' && typeof q.answer === 'string') fillAnswers.push(q.answer);
          }
        }
      }
      const unique = Array.from(new Set(fillAnswers));
      for (const unit of n5Stage.units) {
        for (const lesson of unit.lessons) {
          for (const q of lesson.questions) {
            if (q.type === 'fillblank' && (!q.options || q.options.length === 0) && unique.length > 0) {
              const correct = String(q.answer);
              const distractors = unique.filter(a => a !== correct);
              q.options = shuffle([correct, ...distractors.slice(0, 3)]);
            }
          }
        }
      }
    }
    seedFillBlankOptions();

    function renderQuizView(scope, id) {
      scope = scope || routeParams[0];
      id = id || routeParams[1];
      if (!tempState.quiz || tempState.quiz.scope !== scope || tempState.quiz.id !== id) initQuiz(scope, id);
      const state = tempState.quiz;
      if (state.finished) return renderQuizResult(state);
      const q = state.questions[state.currentIndex];
      return `
        <div class="container page-section" style="max-width:42rem;">
          <div class="mb-6">
            <div class="flex justify-between text-sm mb-2">
              <span class="font-bold">第 ${state.currentIndex + 1} / ${state.questions.length} 题</span>
              <span class="text-muted">得分：${state.score}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.currentIndex + 1}" aria-label="答题进度">
              <div style="width:${((state.currentIndex + 1) / state.questions.length) * 100}%; background:var(--primary);"></div>
            </div>
          </div>

          <div class="card p-5 sm:p-6 mb-6">
            <div class="text-muted mb-2" style="font-size:0.875rem;">${q.type === 'choice' ? '选择题' : q.type === 'truefalse' ? '判断题' : q.type === 'listening' ? '听力题' : '填空题'}</div>
            <h2 class="section-title" style="font-size:1.25rem;" id="quizQuestionText">${renderQuestionText(q)}</h2>
            ${q.type === 'fillblank' && q.options ? renderFillOptions(q, state) : renderChoiceOptions(q, state)}
          </div>

          ${state.answered ? `
            <div class="card p-4 ${state.isCorrect ? 'bg-success-light' : 'bg-error-light'}" style="border-color:${state.isCorrect ? 'var(--success)' : 'var(--error)'};" aria-live="polite" aria-atomic="true">
