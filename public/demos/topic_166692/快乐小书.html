                    description: "培养良好的阅读习惯，让你爱上读书！",
                    image: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20kids%20reading%20books%20in%20a%20cozy%20corner%20with%20bookshelf%20illustration&image_size=landscape_4_3",
                    tags: ["学习", "阅读", "习惯"],
                    content: "培养阅读好习惯：\n\n1. 每天固定时间阅读，比如睡前30分钟\n2. 选择自己喜欢的书，兴趣是最好的老师\n3. 读完一本书后，可以试着讲给爸爸妈妈听\n4. 遇到不认识的字，及时查字典\n5. 做读书笔记，记录好词好句\n\n读书可以让我们学到很多知识，还能让我们变得更聪明！让我们一起爱上阅读吧！📚"
                }
            ]
        };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.style.display = 'none';
            });
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(pageId + '-page').style.display = 'block';
            
            event.target.classList.add('active');
            
            if (!window[pageId + 'Rendered']) {
                renderContent(pageId);
                window[pageId + 'Rendered'] = true;
            }
        }

        function renderContent(category) {
            const container = document.getElementById(category + '-content');
            const items = category === 'home' 
                ? [...contents.science, ...contents.crafts, ...contents.stories, ...contents.learning].slice(0, 6)
                : contents[category];
            
            container.innerHTML = items.map(item => `
                <div class="content-card" onclick="showModal(${item.id}, '${category}')">
                    <img src="${item.image}" alt="${item.title}" class="content-image">
                    <div class="content-info">
                        <h3 class="content-title">${item.title}</h3>
                        <p class="content-desc">${item.description}</p>
                        <div class="content-tags">
                            ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showModal(id, category) {
            const items = contents[category];
            const item = items.find(i => i.id === id);
            
            if (item) {
                document.getElementById('modal-title').innerText = item.title;
                document.getElementById('modal-body').innerHTML = `
                    <img src="${item.image}" alt="${item.title}">
                    <p>${item.content}</p>
                `;
                document.getElementById('content-modal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('content-modal').style.display = 'none';
        }

        document.getElementById('content-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.homeRendered = false;
        window.scienceRendered = false;
        window.craftsRendered = false;
        window.storiesRendered = false;
        window.learningRendered = false;

        renderContent('home');
    </script>
</body>
</html>
