    }
    .history-item .hi-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .history-item .hi-actions button.hi-del:hover { border-color: var(--danger); color: var(--danger); }

    /* ============ Modal ============ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 1.4rem 1.3rem;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 20px 50px -20px rgba(0,0,0,.25);
    }
    .modal h4 { font-size: 1rem; font-weight: 700; margin-bottom: .8rem; }
    .modal-field { margin-bottom: .6rem; }
    .modal-field label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: .2rem; }
    .modal-field input {
      width: 100%;
      padding: .45rem .6rem;
      border: 1px solid var(--rule);
      border-radius: 7px;
      font-family: inherit;
      font-size: .9rem;
      color: var(--ink);
      outline: none;
    }
    .modal-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .modal-actions { display: flex; gap: .5rem; margin-top: 1rem; }
    .modal-actions .btn { flex: 1; padding: .55rem .8rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="app">

    <div class="app-bar">
      <div class="title">
        <div class="logo">AA</div>
        <span>套餐分摊计算器</span>
      </div>
      <div class="pkg-pill" id="pkgPill">套餐价 ¥1396</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="items">① 菜品</div>
      <div class="tab" data-tab="people">② 参与人</div>
      <div class="tab" data-tab="result">③ 算账</div>
      <div class="tab" data-tab="history">④ 历史</div>
    </div>

    <div class="body">

      <!-- ① Items -->
      <div class="panel active" id="panel-items">
        <div class="card">
          <div class="card-head">
            <h3><span class="dot"></span> 套餐内菜品 · 数量 &amp; 单价</h3>
            <button class="btn-small" id="addItem">+ 添加菜品</button>
          </div>

          <!-- 输入模式切换 -->
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="tag"><span class="mode-icon">🏷️</span> 标签模式</button>
            <button class="mode-btn" data-mode="slider"><span class="mode-icon">🎚️</span> 滑动模式</button>
            <button class="mode-btn" data-mode="both"><span class="mode-icon">🔀</span> 双模式</button>
          </div>

          <!-- 比例标签管理（标签/双模式时显示） -->
          <div class="tag-manager" id="tagManagerWrap">
            <div class="tag-manager-head">
              <span>比例标签（点击可编辑，支持添加自定义比例）</span>
            </div>
            <div class="tag-list" id="tagList"></div>
          </div>

          <!-- 图例 -->
          <div class="legend" id="legend"></div>

          <div class="table-wrap">
            <table class="dishes" id="dishTable">
              <thead><tr id="dishHead"></tr></thead>
              <tbody id="dishBody"></tbody>
            </table>
          </div>

          <!-- 滑动模式表格 -->
          <div class="table-wrap" id="sliderWrap" style="display:none;margin-top:.8rem;">
            <table class="slider-table" id="sliderTable">
              <thead><tr id="sliderHead"></tr></thead>
              <tbody id="sliderBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ② People -->
      <div class="panel" id="panel-people">
        <div class="card">
          <div class="card-head">
            <h3><span class="dot"></span> 参与吃饭的人</h3>
          </div>
          <div class="people-list" id="peopleList"></div>
          <p style="font-size:.78rem;color:var(--muted);margin-top:.7rem;">
            💡 添加后回 "① 菜品" 给每人勾选吃了什么。
          </p>
        </div>
      </div>

      <!-- ③ Result -->
      <div class="panel" id="panel-result">
        <div class="card">
          <div class="card-head">
            <h3><span class="dot"></span> 分账结果</h3>
            <button class="btn-small" id="recalc">重新计算</button>
          </div>
          <div class="result-summary">
            <div class="stat"><div class="v" id="rPkg">—</div><div class="l">套餐总价</div></div>
            <div class="stat"><div class="v" id="rOri">—</div><div class="l">原价合计</div></div>
            <div class="stat"><div class="v" id="rPpl">—</div><div class="l">参与人数</div></div>
          </div>
          <div class="result-list" id="rList"></div>
          <div class="fab-row">
            <button class="btn btn-ghost" id="resetAll">重置</button>
            <button class="btn" id="saveToHistory" style="background:var(--ok);color:#fff;box-shadow:0 4px 12px -4px rgba(16,185,129,.4);flex:2;">💾 保存</button>
            <button class="btn btn-primary" id="share">生成海报</button>
          </div>
        </div>
      </div>

      <!-- ④ History -->
      <div class="panel" id="panel-history">
        <div class="card">
          <div class="card-head">
            <h3><span class="dot"></span> 历史记录</h3>
            <button class="btn-small" id="clearHistory">清空全部</button>
          </div>
          <div id="historyList"></div>
          <p id="historyEmpty" style="text-align:center;padding:2rem 0;color:var(--muted);font-size:.88rem;display:none;">
            暂无历史记录，算账后自动保存。
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- 编辑/新建标签弹窗 -->
  <div class="modal-overlay" id="tagModal">
    <div class="modal">
      <h4 id="tagModalTitle">编辑比例标签</h4>
      <div class="modal-field">
        <label>标签名称（如：三分之一、一小口）</label>
        <input type="text" id="tagInputName" placeholder="例：三分之一">
      </div>
      <div class="modal-field">
        <label>比例值（0 ~ 1，如 0.33 = 33%）</label>
        <input type="number" id="tagInputValue" min="0" max="1" step="0.01" placeholder="例：0.33">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="tagModalCancel">取消</button>
        <button class="btn btn-primary" id="tagModalSave" style="background:var(--accent);box-shadow:none;">保存</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗（替代 prompt/alert/confirm） -->
  <div class="modal-overlay" id="genModal">
    <div class="modal" id="genModalBox">
      <h4 id="genModalTitle">提示</h4>
      <div id="genModalBody"></div>
      <div class="modal-actions" id="genModalActions"></div>
    </div>
  </div>

  <script>
    // ============ 通用弹窗系统（替代 prompt/alert/confirm） ============
    function customAlert(msg) {
      return new Promise(resolve => {
        const overlay = $('#genModal');
        const body = $('#genModalBody');
        const actions = $('#genModalActions');
        $('#genModalTitle').textContent = '提示';
        body.innerHTML = `<p style="font-size:.92rem;color:var(--ink);line-height:1.6;white-space:pre-wrap;">${msg}</p>`;
        actions.innerHTML = '<button class="btn btn-primary" id="genModalOk" style="background:var(--accent);box-shadow:none;">确定</button>';
        overlay.classList.add('show');
        const cleanup = () => { overlay.classList.remove('show'); resolve(); };
        $('#genModalOk').onclick = cleanup;
        overlay.onclick = (e) => { if (e.target === overlay) cleanup(); };
      });
    }

    function customConfirm(msg) {
      return new Promise(resolve => {
        const overlay = $('#genModal');
        const body = $('#genModalBody');
        const actions = $('#genModalActions');
        $('#genModalTitle').textContent = '确认';
        body.innerHTML = `<p style="font-size:.92rem;color:var(--ink);line-height:1.6;white-space:pre-wrap;">${msg}</p>`;
        actions.innerHTML = `
          <button class="btn btn-ghost" id="genModalNo">取消</button>
          <button class="btn btn-primary" id="genModalYes" style="background:var(--accent);box-shadow:none;">确定</button>
        `;
        overlay.classList.add('show');
        const cleanup = (v) => { overlay.classList.remove('show'); resolve(v); };
        $('#genModalYes').onclick = () => cleanup(true);
        $('#genModalNo').onclick = () => cleanup(false);
        overlay.onclick = (e) => { if (e.target === overlay) cleanup(false); };
      });
    }

    function customPrompt(msg, defaultVal) {
      return new Promise(resolve => {
        const overlay = $('#genModal');
        const body = $('#genModalBody');
        const actions = $('#genModalActions');
        $('#genModalTitle').textContent = '输入';
        body.innerHTML = `
          <p style="font-size:.88rem;color:var(--muted);margin-bottom:.5rem;">${msg}</p>
          <input type="text" id="genModalInput" value="${defaultVal !== undefined ? defaultVal : ''}" style="width:100%;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:7px;font-family:inherit;font-size:.95rem;color:var(--ink);outline:none;">
        `;
        actions.innerHTML = `
          <button class="btn btn-ghost" id="genModalNo">取消</button>
          <button class="btn btn-primary" id="genModalYes" style="background:var(--accent);box-shadow:none;">确定</button>
        `;
        overlay.classList.add('show');
        const input = $('#genModalInput');
        setTimeout(() => input.focus(), 100);
        const cleanup = (v) => { overlay.classList.remove('show'); resolve(v); };
        $('#genModalYes').onclick = () => cleanup(input.value);
        $('#genModalNo').onclick = () => cleanup(null);
        overlay.onclick = (e) => { if (e.target === overlay) cleanup(null); };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') cleanup(input.value);
          if (e.key === 'Escape') cleanup(null);
        });
      });
    }

    // ============ 比例标签数据 ============
    // builtIn: 不可删除的内置标签
    // custom: 用户添加的可删除标签
    const BUILTIN_TAGS = [
      { id: 'b1', label: '全',  value: 1,    css: 's-full',  type: 'builtin' },
      { id: 'b2', label: '半',  value: 0.5,  css: 's-half',  type: 'builtin' },
      { id: 'b3', label: '尝',  value: 0.25, css: 's-taste', type: 'builtin' },
      { id: 'b4', label: '×',   value: 0,    css: 's-none',  type: 'builtin' }
    ];
    let customTags = [];
    let editingTagId = null; // null = 新建

    function allTags() { return [...BUILTIN_TAGS, ...customTags]; }

    // ============ 核心数据 ============
    const DEFAULT_PEOPLE = ['小李', '小王', '小张', '小陈'];
    const DEFAULT_ITEMS = [
      { name: '招牌烤鱼 (麻辣)', qty: 1, price: 198, eater: [0.5, 0.3, 0.2, 0] },
      { name: '精品肥牛',         qty: 1, price: 128, eater: [0.5, 0.5, 0,   0] },
      { name: '爽口鲜蔬沙拉',     qty: 1, price: 58,  eater: [0,   0.3, 0.7, 0] },
      { name: '米饭',             qty: 4, price: 6,   eater: [0.5, 0.5, 0,   0] },
      { name: '酸梅汤 + 甜品',    qty: 1, price: 76,  eater: [0.5, 0.5, 0,   0] }
    ];
    let people = [...DEFAULT_PEOPLE];
    let items  = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    let pkgTotal = 1396;
    let inputMode = 'tag'; // 'tag' | 'slider' | 'both'

    const $  = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const fmt = (n) => '¥ ' + (Math.round(n * 100) / 100).toFixed(2);
    const lineOri = (it) => (+it.qty || 0) * (+it.price || 0);

    // ============ 渲染：标签管理 ============
    function renderTagList() {
      const list = $('#tagList');
      list.innerHTML = '';
      const tags = allTags();
      tags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        const isBuiltin = tag.type === 'builtin';
        const pct = Math.round(tag.value * 100) + '%';
        chip.innerHTML = `
          <span class="tag-dot" style="background:${isBuiltin ? '' : '#8b5cf6'}"></span>
          <span class="tag-label">${tag.label}</span>
          <span class="tag-pct">${pct}</span>
          <span class="tag-edit" data-edit="${tag.id}" title="编辑">✎</span>
          <span class="tag-del ${isBuiltin ? 'disabled' : ''}" data-del="${tag.id}" title="${isBuiltin ? '内置标签不可删除' : '删除'}">×</span>
        `;
        list.appendChild(chip);
      });
      // 添加按钮
      const addBtn = document.createElement('button');
      addBtn.className = 'add-tag-btn';
      addBtn.id = 'addTagBtn';
      addBtn.textContent = '+ 添加比例';
      list.appendChild(addBtn);
    }

    // ============ 渲染：图例 ============
    function renderLegend() {
      const legend = $('#legend');
      const tags = allTags();
      let html = '';
      tags.forEach(tag => {
        const isBuiltin = tag.type === 'builtin';
        const swatchClass = isBuiltin ? tag.css : 's-custom';
        const pct = Math.round(tag.value * 100) + '%';
        html += `<div class="legend-item"><span class="legend-swatch ${swatchClass}">${tag.label}</span> ${tag.label === '×' ? '不吃' : tag.label + ' (' + pct + ')'}</div>`;
      });
      html += '<span class="legend-sep"></span>';
      html += '<div class="legend-formula">应付 = 本人消费原价 ÷ 原价合计 × 套餐价</div>';
      legend.innerHTML = html;
    }

    // ============ 渲染：表头 ============
    function renderHead() {
      const head = $('#dishHead');
      head.innerHTML = '';
      const labels = ['菜品', '数量', '单价', '行原价', '已分配', ...people, ''];
      labels.forEach((t) => {
        const th = document.createElement('th');
        th.textContent = t;
        head.appendChild(th);
      });
      // 动态设置最小宽度：固定列 455px + 每人 100px + 删除 40px
      const table = $('#dishTable');
      table.style.minWidth = (455 + people.length * 100 + 40) + 'px';
    }

    // ============ 渲染：比例按钮 ============
    function ratioBtnHtml(i, pi, cur) {
      const tags = allTags();
      return tags.map(tag => {
        const isOn = Math.abs(cur - tag.value) < 0.001;
        const onClass = isOn ? 'on' : '';
        const customClass = tag.type === 'custom' ? 'is-custom' : '';
        const title = tag.label === '×' ? '不吃' : tag.label + ' (' + Math.round(tag.value * 100) + '%)';
        return `<button class="ratio-btn ${onClass} ${customClass}" data-i="${i}" data-pi="${pi}" data-v="${tag.value}" title="${title}">${tag.label}</button>`;
      }).join('');
    }

    // ============ 渲染：表体 ============
    function renderBody() {
      const body = $('#dishBody');
      body.innerHTML = '';
      items.forEach((it, i) => {
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.innerHTML = `<input class="cell-input text" data-k="name" data-i="${i}" value="${(it.name||'').replace(/"/g,'&quot;')}" placeholder="菜品名">`;
        tr.appendChild(tdName);

        const tdQty = document.createElement('td');
        tdQty.innerHTML = `<input class="cell-input num" type="number" min="0" step="1" data-k="qty" data-i="${i}" value="${it.qty}">`;
        tr.appendChild(tdQty);

        const tdUnit = document.createElement('td');
        tdUnit.innerHTML = `<input class="cell-input num" type="number" min="0" step="0.01" data-k="price" data-i="${i}" value="${it.price}">`;
        tr.appendChild(tdUnit);

        const tdLine = document.createElement('td');
        tdLine.innerHTML = `<span class="subtotal" data-subtotal="${i}">${fmt(lineOri(it))}</span>`;
        tr.appendChild(tdLine);

        // 5. 已分配比例
        const tdAlloc = document.createElement('td');
        const allocSum = (it.eater || []).reduce((s, v) => s + (v || 0), 0);
        const allocPct = Math.round(allocSum * 100);
        const allocWarn = allocSum > 1 + 0.001;
        const allocColor = allocSum >= 1 ? 'var(--ok)' : allocSum > 0.7 ? 'var(--accent2)' : 'var(--muted)';
        tdAlloc.innerHTML = `<span style="font-weight:700;font-size:.85rem;color:${allocColor}">${allocPct}%</span>${allocWarn ? '<br><span style="font-size:.65rem;color:var(--danger)">超分配!</span>' : ''}`;
        tr.appendChild(tdAlloc);

        people.forEach((p, pi) => {
          const td = document.createElement('td');
          td.className = 'person-cell';
          const cur = (it.eater && it.eater[pi] !== undefined) ? it.eater[pi] : 0;
          td.innerHTML = `
            <div class="pc-inner">
              <div class="pname">${p}</div>
              <div class="ratio-row">${ratioBtnHtml(i, pi, cur)}</div>
            </div>
          `;
          tr.appendChild(td);
        });

        const tdDel = document.createElement('td');
        tdDel.innerHTML = `<button class="icon-btn" data-del="${i}" title="删除">×</button>`;
        tr.appendChild(tdDel);

        body.appendChild(tr);
      });
    }

    // ============ 渲染：Slider 表头 ============
    function renderSliderHead() {
      const head = $('#sliderHead');
      head.innerHTML = '';
      const labels = ['菜品', '数量', '单价', '行原价', '已分配', ...people, ''];
      labels.forEach((t) => {
        const th = document.createElement('th');
        th.textContent = t;
        head.appendChild(th);
      });
      // 动态设置最小宽度：固定列 455px + 每人 140px + 删除 40px
      const table = $('#sliderTable');
      table.style.minWidth = (455 + people.length * 140 + 40) + 'px';
    }

    // ============ 渲染：Slider 表体 ============
    function renderSliderBody() {
      const body = $('#sliderBody');
      body.innerHTML = '';
      items.forEach((it, i) => {
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.innerHTML = `<input class="cell-input text" data-k="name" data-i="${i}" value="${(it.name||'').replace(/"/g,'&quot;')}" placeholder="菜品名">`;
        tr.appendChild(tdName);

        const tdQty = document.createElement('td');
        tdQty.innerHTML = `<input class="cell-input num" type="number" min="0" step="1" data-k="qty" data-i="${i}" value="${it.qty}">`;
        tr.appendChild(tdQty);

        const tdUnit = document.createElement('td');
        tdUnit.innerHTML = `<input class="cell-input num" type="number" min="0" step="0.01" data-k="price" data-i="${i}" value="${it.price}">`;
        tr.appendChild(tdUnit);

        const tdLine = document.createElement('td');
        tdLine.innerHTML = `<span class="subtotal" data-subtotal="${i}">${fmt(lineOri(it))}</span>`;
        tr.appendChild(tdLine);

        // 已分配
        const tdAlloc = document.createElement('td');
        const allocSum = (it.eater || []).reduce((s, v) => s + (v || 0), 0);
        const allocPct = Math.round(allocSum * 100);
        const allocColor = allocSum >= 1 ? 'var(--ok)' : allocSum > 0.7 ? 'var(--accent2)' : 'var(--muted)';
        tdAlloc.innerHTML = `<span style="font-weight:700;font-size:.85rem;color:${allocColor}" data-alloc="${i}">${allocPct}%</span>`;
        tr.appendChild(tdAlloc);

        // 每人 slider
        people.forEach((p, pi) => {
          const td = document.createElement('td');
          td.className = 'slider-cell';
          const cur = (it.eater && it.eater[pi] !== undefined) ? it.eater[pi] : 0;
          const curPct = Math.round(cur * 100);
          td.innerHTML = `
            <div class="sc-inner">
              <div class="sc-name">${p}</div>
              <div class="sc-row">
                <input type="range" min="0" max="100" step="1" value="${curPct}" data-i="${i}" data-pi="${pi}">
                <span class="sc-val" data-sval="${i}-${pi}">${curPct}%</span>
              </div>
              <div class="sc-bar"><div class="sc-bar-fill" data-sbar="${i}-${pi}" style="width:${curPct}%"></div></div>
            </div>
          `;
          tr.appendChild(td);
        });

        const tdDel = document.createElement('td');
        tdDel.innerHTML = `<button class="icon-btn" data-del="${i}" title="删除">×</button>`;
        tr.appendChild(tdDel);

        body.appendChild(tr);
      });
    }

    // ============ 渲染：参与人 ============
    function renderPeople() {
      const list = $('#peopleList');
      list.innerHTML = '';
      people.forEach((p, i) => {
        const chip = document.createElement('span');
        chip.className = 'person-chip';
        chip.innerHTML = `${p}<span class="x" data-pi="${i}">×</span>`;
        list.appendChild(chip);
      });
      const add = document.createElement('span');
      add.className = 'add-chip';
      add.id = 'addPerson';
      add.textContent = '+ 添加';
      list.appendChild(add);
    }

    function renderPill() { $('#pkgPill').textContent = '套餐价 ' + fmt(pkgTotal); }

    function renderAll() {
      renderPill();
      renderTagList();
      renderLegend();
      renderHead();
      renderBody();
      renderSliderHead();
      renderSliderBody();
      renderPeople();
      renderHistory();
      updateModeVisibility();
    }

    function updateModeVisibility() {
      const tagTable = document.querySelector('.table-wrap:first-of-type');
      const sliderW = $('#sliderWrap');
      const tagMgr = $('#tagManagerWrap');
      const legend = $('#legend');

      // 标签表格
      if (tagTable) tagTable.style.display = (inputMode === 'slider') ? 'none' : '';
      // 滑动表格
      sliderW.style.display = (inputMode === 'tag') ? 'none' : '';
      // 标签管理区
      tagMgr.style.display = (inputMode === 'slider') ? 'none' : '';
      // 图例
      legend.style.display = (inputMode === 'slider') ? 'none' : '';
    }

    // ============ 标签弹窗 ============
    function showTagModal(tagId) {
      editingTagId = tagId;
      const modal = $('#tagModal');
      const titleEl = $('#tagModalTitle');
      const nameEl = $('#tagInputName');
      const valEl = $('#tagInputValue');

      if (tagId) {
        // 编辑
        const tag = allTags().find(t => t.id === tagId);
        if (!tag) return;
        titleEl.textContent = '编辑比例标签';
        nameEl.value = tag.label;
        valEl.value = tag.value;
      } else {
        // 新建
        titleEl.textContent = '添加比例标签';
        nameEl.value = '';
        valEl.value = '';
      }
      modal.classList.add('show');
      setTimeout(() => nameEl.focus(), 100);
    }

    function hideTagModal() {
      $('#tagModal').classList.remove('show');
      editingTagId = null;
    }

    async function saveTag() {
      const name = $('#tagInputName').value.trim();
      const val = parseFloat($('#tagInputValue').value);
      if (!name) { await customAlert('请输入标签名称'); return; }
      if (isNaN(val) || val < 0 || val > 1) { await customAlert('比例值须在 0 ~ 1 之间'); return; }

      if (editingTagId) {
        // 编辑已有标签
        const builtin = BUILTIN_TAGS.find(t => t.id === editingTagId);
        if (builtin) {
          builtin.label = name;
          builtin.value = val;
        } else {
          const ct = customTags.find(t => t.id === editingTagId);
          if (ct) { ct.label = name; ct.value = val; }
        }
      } else {
        // 新建
        const id = 'c' + Date.now();
        customTags.push({ id, label: name, value: val, css: 's-custom', type: 'custom' });
      }
      hideTagModal();
    }

    // ============ 历史记录 ============
    const HISTORY_KEY = 'aa_calc_history';
    const MAX_HISTORY = 50;

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch { return []; }
    }

    function saveHistory(records) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(records.slice(0, MAX_HISTORY)));
    }

    function saveCurrentToHistory() {
      const totalOri = items.reduce((s, it) => s + lineOri(it), 0);
      const personOri = people.map((_, pi) => items.reduce((s, it) => s + ((it.eater && it.eater[pi]) || 0) * lineOri(it), 0));
      const personPay = personOri.map(v => totalOri > 0 ? v / totalOri * pkgTotal : 0);

      const record = {
        id: Date.now(),
        time: new Date().toLocaleString('zh-CN'),
        pkgTotal,
        totalOri,
        people: [...people],
        items: JSON.parse(JSON.stringify(items)),
        customTags: JSON.parse(JSON.stringify(customTags)),
        personPay
      };

      const records = loadHistory();
      records.unshift(record);
      saveHistory(records);
      renderHistory();
    }

    function renderHistory() {
      const list = $('#historyList');
      const empty = $('#historyEmpty');
      const records = loadHistory();

      if (records.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.innerHTML = '';

      records.forEach(rec => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.dataset.id = rec.id;

        const itemNames = rec.items.map(it => it.name).join('、');
        const chips = rec.people.map((p, i) => {
          const v = rec.personPay[i];
          return `<span class="hi-chip">${p} <span class="hi-amt">${fmt(v)}</span></span>`;
        }).join('');

        div.innerHTML = `
          <div class="hi-top">
            <span class="hi-title">套餐 ¥${rec.pkgTotal}</span>
            <span class="hi-time">${rec.time}</span>
          </div>
          <div class="hi-meta">
            <span>${rec.people.length} 人</span>
            <span>原价合计 ${fmt(rec.totalOri)}</span>
          </div>
          <div class="hi-people">${chips}</div>
          <div class="hi-actions">
            <button data-restore="${rec.id}">恢复此记录</button>
            <button class="hi-del" data-hdel="${rec.id}">删除</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    // 历史事件
    $('#historyList').addEventListener('click', async (e) => {
      const restoreBtn = e.target.closest('[data-restore]');
      if (restoreBtn) {
        const id = +restoreBtn.dataset.restore;
        const records = loadHistory();
        const rec = records.find(r => r.id === id);
        if (!rec) return;
        const ok = await customConfirm('恢复此记录将覆盖当前数据，确定吗？');
        if (!ok) return;
        people = [...rec.people];
        items = JSON.parse(JSON.stringify(rec.items));
        pkgTotal = rec.pkgTotal;
        customTags = JSON.parse(JSON.stringify(rec.customTags || []));
        renderAll();
        // 切换到菜品页
        $$('.tab').forEach(t => t.classList.remove('active'));
        $$('.tab')[0].classList.add('active');
        $$('.panel').forEach(p => p.classList.remove('active'));
        $('#panel-items').classList.add('active');
        return;
      }
      const delBtn = e.target.closest('[data-hdel]');
      if (delBtn) {
        const id = +delBtn.dataset.hdel;
        const records = loadHistory().filter(r => r.id !== id);
        saveHistory(records);
        renderHistory();
      }
    });

    $('#clearHistory').addEventListener('click', async () => {
      const records = loadHistory();
      if (records.length === 0) return;
      const ok = await customConfirm('确定清空全部历史记录？');
      if (!ok) return;
      saveHistory([]);
      renderHistory();
    });

    $('#saveToHistory').addEventListener('click', async () => {
      // 先确保计算了最新数据
      calc();
      saveCurrentToHistory();
      await customAlert('已保存到历史记录');
    });

    renderAll();

    // ============ 事件 ============
    // tabs
    $$('.tab').forEach(t => {
      t.addEventListener('click', () => {
        $$('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        $$('.panel').forEach(p => p.classList.remove('active'));
        $('#panel-' + t.dataset.tab).classList.add('active');
        if (t.dataset.tab === 'result') calc();
      });
    });

    // 标签管理
    $('#tagList').addEventListener('click', (e) => {
      if (e.target.id === 'addTagBtn') {
        showTagModal(null);
        return;
      }
      const editEl = e.target.closest('[data-edit]');
      if (editEl) {
        showTagModal(editEl.dataset.edit);
        return;
      }
      const delEl = e.target.closest('[data-del]');
      if (delEl && !delEl.classList.contains('disabled')) {
        customTags = customTags.filter(t => t.id !== delEl.dataset.del);
        renderAll();
      }
    });

    // 模式切换
    $$('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        inputMode = btn.dataset.mode;
        updateModeVisibility();
      });
    });

    // Slider 事件
    $('#sliderBody').addEventListener('input', (e) => {
      const t = e.target;
      // 名称/数量/单价输入
      if (t.dataset && t.dataset.k) {
        const i = +t.dataset.i;
        if (t.dataset.k === 'name')  items[i].name  = t.value;
        if (t.dataset.k === 'qty')   items[i].qty   = +t.value || 0;
        if (t.dataset.k === 'price') items[i].price = +t.value || 0;
        const sub = document.querySelector(`#sliderBody [data-subtotal="${i}"]`);
        if (sub) sub.textContent = fmt(lineOri(items[i]));
        return;
      }
      // range slider
      if (t.type === 'range') {
        const i = +t.dataset.i, pi = +t.dataset.pi;
        const pct = +t.value;
        if (!items[i].eater) items[i].eater = [];
        // 校验：其他人已占 + 新值 <= 100%
        const othersSum = items[i].eater.reduce((s, v, idx) => idx === pi ? s : s + (v || 0), 0);
        const maxAllowed = Math.round((1 - othersSum) * 100);
        const clamped = Math.min(pct, Math.max(0, maxAllowed));
        if (clamped !== pct) {
          t.value = clamped;
        }
        items[i].eater[pi] = clamped / 100;
        // 更新显示
        const valEl = document.querySelector(`[data-sval="${i}-${pi}"]`);
        if (valEl) valEl.textContent = clamped + '%';
        const barEl = document.querySelector(`[data-sbar="${i}-${pi}"]`);
        if (barEl) barEl.style.width = clamped + '%';
        // 更新已分配
        const allocSum = items[i].eater.reduce((s, v) => s + (v || 0), 0);
        const allocPct = Math.round(allocSum * 100);
        const allocEl = document.querySelector(`#sliderBody [data-alloc="${i}"]`);
        if (allocEl) {
          allocEl.textContent = allocPct + '%';
          allocEl.style.color = allocSum >= 1 ? 'var(--ok)' : allocSum > 0.7 ? 'var(--accent2)' : 'var(--muted)';
        }
      }
    });

    // slider 删除按钮
    $('#sliderBody').addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        items.splice(+del.dataset.del, 1);
        renderSliderBody();
      }
    });

    $('#tagModalCancel').addEventListener('click', hideTagModal);
    $('#tagModalSave').addEventListener('click', saveTag);
    $('#tagModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideTagModal();
    });

    // 参与人
    $('#peopleList').addEventListener('click', async (e) => {
      const addEl = e.target.closest('#addPerson');
      if (addEl) {
        const name = await customPrompt('输入参与人姓名', '');
        if (name && name.trim()) {
          const newName = name.trim();
          people.push(newName);
          // 确保每道菜的 eater 数组与 people 长度一致
          items.forEach(it => {
            if (!Array.isArray(it.eater)) it.eater = [];
            while (it.eater.length < people.length) it.eater.push(0);
            if (it.eater.length > people.length) it.eater.length = people.length;
          });
          renderAll();
        }
        return;
      }
      const delEl = e.target.closest('.x');
      if (delEl && delEl.dataset.pi !== undefined) {
        const pi = +delEl.dataset.pi;
        if (pi >= 0 && pi < people.length) {
          people.splice(pi, 1);
          items.forEach(it => {
            if (Array.isArray(it.eater)) {
              it.eater.splice(pi, 1);
            }
          });
          renderAll();
        }
      }
    });

    // 表格输入
    $('#dishBody').addEventListener('input', (e) => {
      const t = e.target;
      if (!t.dataset || !t.dataset.k) return;
      const i = +t.dataset.i;
      if (t.dataset.k === 'name')  items[i].name  = t.value;
      if (t.dataset.k === 'qty')   items[i].qty   = +t.value || 0;
      if (t.dataset.k === 'price') items[i].price = +t.value || 0;
      const sub = document.querySelector(`[data-subtotal="${i}"]`);
      if (sub) sub.textContent = fmt(lineOri(items[i]));
    });

    // 比例按钮点击（含超 100% 校验）
    $('#dishBody').addEventListener('click', async (e) => {
      const btn = e.target.closest('.ratio-btn');
      if (btn) {
        const i = +btn.dataset.i, pi = +btn.dataset.pi, v = +btn.dataset.v;
        if (!items[i].eater) items[i].eater = [];
        // 计算这道菜当前其他人已占的比例（不含当前人旧值）
        const oldVal = items[i].eater[pi] || 0;
        const othersSum = items[i].eater.reduce((s, val, idx) => idx === pi ? s : s + (val || 0), 0);
        const newTotal = othersSum + v;
        if (newTotal > 1 + 0.001) {
          // 超出 100%，阻止
          const remain = Math.max(0, 1 - othersSum);
          const remainPct = Math.round(remain * 100);
          await customAlert(`「${items[i].name}」已被分配 ${Math.round(othersSum * 100)}%，仅剩 ${remainPct}% 可分配。\n请选择 ${remainPct}% 或更低的比例。`);
          return;
        }
        items[i].eater[pi] = v;
        renderBody();
        renderSliderBody(); // 同步到 slider
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        items.splice(+del.dataset.del, 1);
        renderBody();
        renderSliderBody(); // 同步到 slider
      }
    });

    $('#addItem').addEventListener('click', () => {
      items.push({ name: '新菜品', qty: 1, price: 0, eater: new Array(people.length).fill(0) });
      renderBody();
      renderSliderBody();
    });

    $('#pkgPill').addEventListener('click', async () => {
      const v = await customPrompt('设置套餐总价（元）', pkgTotal);
      const n = parseFloat(v);
      if (!isNaN(n) && n > 0) { pkgTotal = n; renderPill(); }
    });

    $('#resetAll').addEventListener('click', async () => {
      const ok = await customConfirm('确定重置为默认示例？');
      if (!ok) return;
      people = [...DEFAULT_PEOPLE];
      items  = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      pkgTotal = 1396;
      customTags = [];
      renderAll();
    });

    // ============ 计算 ============
    function calc() {
      const totalOri = items.reduce((s, it) => s + lineOri(it), 0);
      const personOri = people.map((_, pi) => items.reduce((s, it) => {
        return s + ((it.eater && it.eater[pi]) || 0) * lineOri(it);
      }, 0));
      const personPay = personOri.map(v => totalOri > 0 ? v / totalOri * pkgTotal : 0);
      const maxPay = Math.max(...personPay, 0.0001);

      $('#rPkg').textContent = fmt(pkgTotal);
      $('#rOri').textContent = fmt(totalOri);
      $('#rPpl').textContent = people.length + ' 人';

      const list = $('#rList');
      list.innerHTML = '';
      const order = personPay.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v);
      order.forEach(({ v, i }, rank) => {
        const ratio = totalOri > 0 ? personOri[i] / totalOri * 100 : 0;
        const row = document.createElement('div');
        row.className = 'pay-row' + (rank === 0 ? ' top' : '');
        row.innerHTML = `
          <div class="who">
            <div class="avatar">${people[i][0]}</div>
            <div class="meta">
              <div class="name">${people[i]}</div>
              <div class="sub">占原价 ${ratio.toFixed(1)}% · 消费原价 ${fmt(personOri[i])}</div>
            </div>
          </div>
          <div class="amt">${fmt(v)}</div>
          <div class="progress"><span style="width:${(v / maxPay * 100).toFixed(1)}%"></span></div>
        `;
        list.appendChild(row);
      });
    }

    $('#recalc').addEventListener('click', calc);

    $('#share').addEventListener('click', () => {
      generatePoster();
    });

    // ============ 生成海报 JPG ============
    function generatePoster() {
      const totalOri = items.reduce((s, it) => s + lineOri(it), 0);
      const personOri = people.map((_, pi) => items.reduce((s, it) => s + ((it.eater && it.eater[pi]) || 0) * lineOri(it), 0));
      const personPay = personOri.map(v => totalOri > 0 ? v / totalOri * pkgTotal : 0);
      const maxPay = Math.max(...personPay, 0.0001);

      // Canvas 尺寸
      const W = 750, H = 960;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // 背景
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#4f46e5');
      grad.addColorStop(0.5, '#06b6d4');
      grad.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 白色卡片
      const cx = 40, cy = 40, cw = W - 80, ch = H - 80, cr = 24;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, cx, cy, cw, ch, cr);
      ctx.fill();

      // 标题
      ctx.fillStyle = '#1a1d29';
      ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('AA 套餐分账', W / 2, 120);

      // 副标题
      ctx.fillStyle = '#6b7280';
      ctx.font = '18px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('按菜品原价比例计算，公平透明', W / 2, 155);

      // 分割线
      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(80, 175);
      ctx.lineTo(W - 80, 175);
      ctx.stroke();

      // 套餐信息
      ctx.fillStyle = '#6b7280';
      ctx.font = '16px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('套餐总价', 80, 210);
      ctx.fillStyle = '#4f46e5';
      ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(fmt(pkgTotal), 200, 212);

      ctx.fillStyle = '#6b7280';
      ctx.font = '16px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('原价合计', 80, 250);
      ctx.fillStyle = '#1a1d29';
      ctx.font = 'bold 22px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(fmt(totalOri), 200, 252);

      ctx.fillStyle = '#6b7280';
      ctx.font = '16px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('参与人数', 80, 288);
      ctx.fillStyle = '#1a1d29';
      ctx.font = 'bold 22px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(people.length + ' 人', 200, 290);

      // 分割线
      ctx.strokeStyle = '#e5e7eb';
      ctx.beginPath();
      ctx.moveTo(80, 310);
      ctx.lineTo(W - 80, 310);
      ctx.stroke();

      // 每人账单
      const order = personPay.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v);
      let yPos = 350;
      const rowH = 90;

      order.forEach(({ v, i }, rank) => {
        const ratio = totalOri > 0 ? personOri[i] / totalOri * 100 : 0;
        const isTop = rank === 0;

        // 行背景
        if (isTop) {
          ctx.fillStyle = '#eef2ff';
          roundRect(ctx, 70, yPos - 30, W - 140, rowH - 10, 12);
          ctx.fill();
          ctx.strokeStyle = '#4f46e5';
          ctx.lineWidth = 1.5;
          roundRect(ctx, 70, yPos - 30, W - 140, rowH - 10, 12);
          ctx.stroke();
        }

        // 头像圆
        const avatarX = 110, avatarY = yPos + 5, avatarR = 22;
        ctx.fillStyle = isTop ? '#4f46e5' : '#06b6d4';
        ctx.beginPath();
        ctx.arc(avatarX, avatarY, avatarR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(people[i][0], avatarX, avatarY + 7);

        // 姓名
        ctx.fillStyle = '#1a1d29';
        ctx.font = 'bold 22px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(people[i], 150, yPos + 2);

        // 占比
        ctx.fillStyle = '#6b7280';
        ctx.font = '15px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillText('占原价 ' + ratio.toFixed(1) + '%  ·  消费原价 ' + fmt(personOri[i]), 150, yPos + 28);

        // 进度条背景
        const barX = 150, barY = yPos + 42, barW = W - 340, barH = 8;
        ctx.fillStyle = '#e5e7eb';
        roundRect(ctx, barX, barY, barW, barH, 4);
        ctx.fill();
        // 进度条填充
        const fillW = Math.max(4, barW * (v / maxPay));
        const barGrad = ctx.createLinearGradient(barX, 0, barX + fillW, 0);
        barGrad.addColorStop(0, '#4f46e5');
        barGrad.addColorStop(1, '#06b6d4');
        ctx.fillStyle = barGrad;
        roundRect(ctx, barX, barY, fillW, barH, 4);
        ctx.fill();

        // 金额
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 30px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(fmt(v), W - 90, yPos + 15);

        yPos += rowH;
      });

      // 底部水印
      ctx.fillStyle = '#9ca3af';
      ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('由「AA 套餐分摊计算器」生成', W / 2, H - 65);

      // 导出 JPG
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'AA分账_' + new Date().toISOString().slice(0, 10) + '.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.92);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    renderAll();
  </script>
</body>
</html>
