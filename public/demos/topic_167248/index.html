    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes spin {

            to { transform: rotate(360deg); }

        @keyframes slideUp {

            to { opacity: 1; transform: translateY(0); }

        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-scale-in { animation: scaleIn 0.25s ease-out; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        .transition-all { transition: all 0.3s ease; }
        .transition-colors { transition: color 0.2s, background-color 0.2s, border-color 0.2s; }
        .transition-transform { transition: transform 0.2s ease; }
        .active\:scale-95:active { transform: scale(0.95); }
        .active\:scale-90:active { transform: scale(0.9); }

    <script>
        const { useState, useEffect, useContext, createContext, createElement: e } = React;

        const skinIssuesData = [
            { id: 'pimple', name: '痘痘', severity: 'mild', description: '面部存在少量痘痘', suggestion: '保持面部清洁' },
            { id: 'blackhead', name: '黑头', severity: 'moderate', description: 'T区有明显黑头', suggestion: '定期使用清洁面膜' },
            { id: 'dark-circle', name: '黑眼圈', severity: 'mild', description: '眼下有轻微暗沉', suggestion: '保证充足睡眠' },

        const healthTipsData = [
            { id: 'qi-blood', title: '气血提示', description: '眼下暗沉可能与气血不足有关', suggestion: '建议多食用红枣等食物' },

        const skincareRecommendationsData = [
            { id: 'cleanser', name: '温和洁面', icon: '🧴', description: '选择氨基酸洁面产品，避免过度清洁' },
            { id: 'moisturizer', name: '保湿补水', icon: '💧', description: '使用适合肤质的保湿乳液或面霜' },
            { id: 'sunblock', name: '防晒防护', icon: '☀️', description: '每天使用防晒霜，防止紫外线伤害' },
            { id: 'mask', name: '定期敷面膜', icon: '🎭', description: '每周使用2-3次面膜，深层滋养肌肤' },
            { id: 'eye-cream', name: '眼霜护理', icon: '👁️', description: '使用眼霜呵护眼周肌肤' },
            { id: 'serum', name: '精华液', icon: '✨', description: '根据肌肤需求选择针对性精华' },
        ];

        function compressImage(base64Str, maxWidth = 300, maxHeight = 300, quality = 0.6) {
            return new Promise(function(resolve) {
                const img = new Image();
                img.src = base64Str;
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = function() {
                    resolve(base64Str);
                };
            });
        }

        function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            return crypto.subtle.digest('SHA-256', data).then(function(hash) {
                return Array.from(new Uint8Array(hash)).map(function(b) {
                    return b.toString(16).padStart(2, '0');
                }).join('');
            });
        }

        function analyzeSkinFromImage(imageData, userSkinType) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;

            let totalBrightness = 0;
            let totalRedness = 0;
            let darkPixelCount = 0;
            let redPixelCount = 0;
            let shinyPixelCount = 0;
            let pixelCount = 0;

            let lipPixelCount = 0;
            let lipR = 0, lipG = 0, lipB = 0;
            let lipSaturation = 0;
            let lipBrightness = 0;

            let leftEyePixelCount = 0;
            let leftEyeBrightness = 0;
            let leftEyeDarkPixels = 0;
            let leftEyeContrast = 0;

            let rightEyePixelCount = 0;
            let rightEyeBrightness = 0;
            let rightEyeDarkPixels = 0;
            let rightEyeContrast = 0;

            let facePixelCount = 0;
            let faceR = 0, faceG = 0, faceB = 0;
            let faceBrightness = 0;
            let faceRedness = 0;
            let faceYellowness = 0;

            let yintangPixelCount = 0;
            let yintangR = 0, yintangG = 0, yintangB = 0;
            let yintangBrightness = 0;
            let yintangDarkPixels = 0;

            const faceCenterY = height * 0.65;
            const faceWidth = width * 0.25;
            const lipTop = faceCenterY - 15;
            const lipBottom = faceCenterY + 10;

            const leftEyeX = width * 0.38;
            const rightEyeX = width * 0.62;
            const eyeY = height * 0.42;
            const eyeWidth = width * 0.08;
            const eyeHeight = height * 0.06;

            const faceCenterX = width / 2;
            const faceAnalyzeTop = height * 0.3;
            const faceAnalyzeBottom = height * 0.6;
            const faceAnalyzeLeft = faceCenterX - width * 0.2;
            const faceAnalyzeRight = faceCenterX + width * 0.2;

            const yintangX = width / 2;
            const yintangY = height * 0.33;
            const yintangWidth = width * 0.1;
            const yintangHeight = height * 0.06;

            for (let y = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    const i = (y * width + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const brightness = (r + g + b) / 3;

                    totalBrightness += brightness;

                    if (r > g * 1.15 && r > b * 1.1 && r > 120) {
                        redPixelCount++;
                        totalRedness += (r - Math.max(g, b)) / r;
                    }

                    if (brightness > 200 && r > 180 && g > 180 && b > 180) {
                        shinyPixelCount++;
                    }

                    if (brightness < 80) {
                        darkPixelCount++;
                    }

                    const centerX = width / 2;
                    const distFromCenter = Math.abs(x - centerX);
                    if (y >= lipTop && y <= lipBottom && distFromCenter < faceWidth) {
                        const isRed = r > 120 && r > g * 1.1 && r > b * 1.1;
                        const isPink = r > 150 && g > 100 && b > 100 && Math.abs(r - g) < 50 && Math.abs(r - b) < 50;
                        const maxC = Math.max(r, g, b);
                        const minC = Math.min(r, g, b);
                        const sat = maxC === 0 ? 0 : (maxC - minC) / maxC;
                        const bri = brightness / 255;
                        if (isRed || isPink) {
                            lipR += r;
                            lipG += g;
                            lipB += b;
                            lipSaturation += sat;
                            lipBrightness += bri;
                            lipPixelCount++;
                        }
                    }

                    if (Math.abs(x - leftEyeX) < eyeWidth && Math.abs(y - eyeY) < eyeHeight) {
                        leftEyeBrightness += brightness;
                        if (brightness < 60) leftEyeDarkPixels++;
                        leftEyePixelCount++;
                    }

                    if (Math.abs(x - rightEyeX) < eyeWidth && Math.abs(y - eyeY) < eyeHeight) {
                        rightEyeBrightness += brightness;
                        if (brightness < 60) rightEyeDarkPixels++;
                        rightEyePixelCount++;
                    }

                    if (y >= faceAnalyzeTop && y <= faceAnalyzeBottom && x >= faceAnalyzeLeft && x <= faceAnalyzeRight) {
                        const isSkin = r > 80 && g > 60 && b > 50 && r > g && g > b * 0.85;
                        if (isSkin && brightness > 50) {
                            faceR += r;
                            faceG += g;
                            faceB += b;
                            faceBrightness += brightness;
                            if (r > g * 1.1 && r > b * 1.1) faceRedness++;
                            if (r > 200 && g > 180 && b < 150) faceYellowness++;
                            facePixelCount++;
                        }
                    }

                    if (Math.abs(x - yintangX) < yintangWidth && Math.abs(y - yintangY) < yintangHeight) {
                        const isSkin = r > 80 && g > 60 && b > 50 && r > g && g > b * 0.85;
                        if (isSkin) {
                            yintangR += r;
                            yintangG += g;
                            yintangB += b;
                            yintangBrightness += brightness;
                            if (brightness < 100) yintangDarkPixels++;
                            yintangPixelCount++;
                        }
                    }

                    pixelCount++;
                }
            }

            let lipAnalysis = null;
            if (lipPixelCount > 0) {
                const avgLipR = lipR / lipPixelCount;
                const avgLipG = lipG / lipPixelCount;
                const avgLipB = lipB / lipPixelCount;
                const avgLipSat = lipSaturation / lipPixelCount;
                const avgLipBri = lipBrightness / lipPixelCount;

                let lipCondition = 'healthy';
                let lipDescription = '唇色红润';
                let lipSuggestion = '唇色健康，气血充足';
                let lipSeverity = 'mild';

                if (avgLipR < 120 || avgLipSat < 0.15) {
                    if (avgLipR < 100) {
                        lipCondition = 'blood-deficiency';
                        lipDescription = '唇色苍白或暗淡';
                        lipSuggestion = '唇色偏淡可能提示气血不足，建议多吃红枣、枸杞等补血食物';
                        lipSeverity = 'severe';
                    } else {
                        lipCondition = 'blood-deficiency-mild';
                        lipDescription = '唇色偏淡';
                        lipSuggestion = '唇色偏淡可能提示气血稍弱，建议注意营养均衡';
                        lipSeverity = 'mild';
                    }
                } else if (avgLipR > 180 && avgLipBri > 0.75) {
                    lipCondition = 'heat';
                    lipDescription = '唇色偏红';
                    lipSuggestion = '唇色偏红可能提示体内有热，建议清淡饮食，多喝水';
                    lipSeverity = 'mild';
                } else if (avgLipSat < 0.2 && avgLipBri > 0.6) {
                    lipCondition = 'qi-deficiency';
                    lipDescription = '唇色偏淡偏白';
                    lipSuggestion = '唇色偏淡可能提示气虚，建议适当运动，保证充足睡眠';
                    lipSeverity = 'mild';
                }

                lipAnalysis = {
                    condition: lipCondition,
                    description: lipDescription,
                    suggestion: lipSuggestion,
                    severity: lipSeverity,
                    avgR: Math.round(avgLipR),
                    avgG: Math.round(avgLipG),
                    avgB: Math.round(avgLipB),
                    saturation: Math.round(avgLipSat * 100),
                    brightness: Math.round(avgLipBri * 100)
                };
            }

            let eyeAnalysis = null;
            if (leftEyePixelCount > 10 && rightEyePixelCount > 10) {
                const avgLeftBrightness = leftEyeBrightness / leftEyePixelCount;
                const avgRightBrightness = rightEyeBrightness / rightEyePixelCount;
                const avgEyeBrightness = (avgLeftBrightness + avgRightBrightness) / 2;
                const leftDarkRatio = leftEyeDarkPixels / leftEyePixelCount;
                const rightDarkRatio = rightEyeDarkPixels / rightEyePixelCount;
                const avgDarkRatio = (leftDarkRatio + rightDarkRatio) / 2;

                let eyeCondition = 'bright';
                let eyeDescription = '眼睛有神';
                let eyeSuggestion = '眼神明亮，精神状态良好';
                let eyeSeverity = 'mild';

                if (avgEyeBrightness < 80 || avgDarkRatio > 0.4) {
                    eyeCondition = 'tired';
                    eyeDescription = '眼睛无神，有疲态';
                    eyeSuggestion = '眼神暗淡可能提示疲劳或睡眠不足，建议保证充足睡眠，适当休息眼睛';
                    eyeSeverity = 'moderate';
                } else if (avgEyeBrightness < 100 || avgDarkRatio > 0.25) {
                    eyeCondition = 'slightly-tired';
                    eyeDescription = '眼睛略显疲惫';
                    eyeSuggestion = '眼神稍显暗淡，建议注意用眼卫生，适当做眼保健操';
                    eyeSeverity = 'mild';
                }

                eyeAnalysis = {
                    condition: eyeCondition,
                    description: eyeDescription,
                    suggestion: eyeSuggestion,
                    severity: eyeSeverity,
                    avgBrightness: Math.round(avgEyeBrightness),
                    darkRatio: Math.round(avgDarkRatio * 100)
                };
            }

            let faceColorAnalysis = null;
            if (facePixelCount > 50) {
                const avgFaceR = faceR / facePixelCount;
                const avgFaceG = faceG / facePixelCount;
                const avgFaceB = faceB / facePixelCount;
                const avgFaceBrightness = faceBrightness / facePixelCount;
                const rednessRatio = faceRedness / facePixelCount;
                const yellownessRatio = faceYellowness / facePixelCount;

                let faceCondition = 'healthy';
                let faceDescription = '面色红润有光泽';
                let faceSuggestion = '面色健康，气血充足';
                let faceSeverity = 'mild';

                if (avgFaceBrightness > 180 && rednessRatio > 0.3) {
                    faceCondition = 'flushed';
                    faceDescription = '面色偏红';
                    faceSuggestion = '面色偏红可能提示体内有热或肝火旺，建议清淡饮食，保持心情舒畅';
                    faceSeverity = 'moderate';
                } else if (avgFaceBrightness < 100) {
                    faceCondition = 'pale';
                    faceDescription = '面色苍白';
                    faceSuggestion = '面色苍白可能提示气血不足，建议多吃补血食物，如红枣、桂圆、黑芝麻等';
                    faceSeverity = 'severe';
                } else if (avgFaceBrightness < 130 && rednessRatio < 0.1) {
                    faceCondition = 'qi-deficiency';
                    faceDescription = '面色偏白无华';
                    faceSuggestion = '面色偏白可能提示气虚或血虚，建议注意营养均衡，适当运动';
                    faceSeverity = 'moderate';
                } else if (yellownessRatio > 0.1) {
                    faceCondition = 'yellow';
                    faceDescription = '面色偏黄';
                    faceSuggestion = '面色偏黄可能提示脾虚或湿气重，建议健脾祛湿，饮食规律';
                    faceSeverity = 'moderate';
                }

                faceColorAnalysis = {
                    condition: faceCondition,
                    description: faceDescription,
                    suggestion: faceSuggestion,
                    severity: faceSeverity,
                    avgR: Math.round(avgFaceR),
                    avgG: Math.round(avgFaceG),
                    avgB: Math.round(avgFaceB),
                    brightness: Math.round(avgFaceBrightness),
                    rednessRatio: Math.round(rednessRatio * 100),
                    yellownessRatio: Math.round(yellownessRatio * 100)
                };
            }

            let yintangAnalysis = null;
            if (yintangPixelCount > 20) {
                const avgYintangBrightness = yintangBrightness / yintangPixelCount;
                const avgYintangR = yintangR / yintangPixelCount;
                const avgYintangG = yintangG / yintangPixelCount;
                const avgYintangB = yintangB / yintangPixelCount;
                const darkRatio = yintangDarkPixels / yintangPixelCount;

                let yintangCondition = 'bright';
                let yintangDescription = '印堂明亮';
                let yintangSuggestion = '印堂光亮，气血顺畅，精神状态良好';
                let yintangSeverity = 'mild';

                if (darkRatio > 0.3 || avgYintangBrightness < 90) {
                    yintangCondition = 'dark';
                    yintangDescription = '印堂发暗';
                    yintangSuggestion = '印堂发暗可能提示气血不畅或压力过大，建议放松心情，保证睡眠，适当运动';
                    yintangSeverity = 'severe';
                } else if (darkRatio > 0.15 || avgYintangBrightness < 110) {
                    yintangCondition = 'slightly-dull';
                    yintangDescription = '印堂稍暗';
                    yintangSuggestion = '印堂稍显暗淡，建议注意休息，减轻压力，保持心情愉悦';
                    yintangSeverity = 'moderate';
                } else if (avgYintangR > avgYintangG * 1.1 && avgYintangR > 150) {
                    yintangCondition = 'red';
                    yintangDescription = '印堂发红';
                    yintangSuggestion = '印堂发红可能提示心火较旺，建议清淡饮食，保持心情平和';
                    yintangSeverity = 'moderate';
                }

                yintangAnalysis = {
                    condition: yintangCondition,
                    description: yintangDescription,
                    suggestion: yintangSuggestion,
                    severity: yintangSeverity,
                    brightness: Math.round(avgYintangBrightness),
                    darkRatio: Math.round(darkRatio * 100),
                    avgR: Math.round(avgYintangR),
                    avgG: Math.round(avgYintangG),
                    avgB: Math.round(avgYintangB)
                };
            }

            const avgBrightness = totalBrightness / pixelCount;
            const rednessRatio = redPixelCount / pixelCount;
            const shinyRatio = shinyPixelCount / pixelCount;
            const darkRatio = darkPixelCount / pixelCount;

            const issues = [];
            let overallScore = 85;

            if (userSkinType === 'oily' || shinyRatio > 0.05) {
                const severity = shinyRatio > 0.12 ? 'severe' : shinyRatio > 0.07 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '油脂分泌旺盛' : severity === 'moderate' ? 'T区出油明显' : '有轻微出油';
                const sugText = severity === 'severe' ? '建议使用控油护肤产品，注意清洁' : '建议使用清爽型护肤品';
                issues.push({
                    id: 'oil',
                    name: '出油',
                    severity: severity,
                    description: '面部' + descText,
                    suggestion: sugText
                });
                if (severity === 'severe') overallScore -= 10;
                else if (severity === 'moderate') overallScore -= 5;
            }

            if (rednessRatio > 0.08) {
                const severity = rednessRatio > 0.18 ? 'severe' : rednessRatio > 0.12 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '泛红明显' : severity === 'moderate' ? '有明显泛红' : '轻微泛红';
                issues.push({
                    id: 'redness',
                    name: '泛红',
                    severity: severity,
                    description: '面部' + descText,
                    suggestion: '建议使用温和舒缓的护肤品，避免刺激'
                });
                if (severity === 'severe') overallScore -= 8;
                else if (severity === 'moderate') overallScore -= 4;
            }

            if (darkRatio > 0.06) {
                const severity = darkRatio > 0.12 ? 'severe' : darkRatio > 0.09 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '暗沉明显' : '有暗沉';
                issues.push({
                    id: 'dark-circle',
                    name: '黑眼圈/暗沉',
                    severity: severity,
                    description: '眼部/面部' + descText,
                    suggestion: '建议保证充足睡眠，使用提亮产品'
                });
                if (severity === 'severe') overallScore -= 7;
                else if (severity === 'moderate') overallScore -= 3;
            }

            if (avgBrightness < 130) {
                const severity = avgBrightness < 100 ? 'moderate' : 'mild';
                issues.push({
                    id: 'dull',
                    name: '肤色暗沉',
                    severity: severity,
                    description: '肤色整体偏暗，缺乏光泽',
                    suggestion: '建议注意防晒，使用提亮肤色的产品'
                });
                overallScore -= 5;
            }

            if (userSkinType === 'oily' && shinyRatio > 0.08) {
                const severity = shinyRatio > 0.15 ? 'moderate' : 'mild';
                issues.push({
                    id: 'blackhead',
                    name: '黑头',
                    severity: severity,
                    description: 'T区可能存在黑头问题',
                    suggestion: '建议定期使用清洁面膜，注意毛孔清洁'
                });
                overallScore -= 3;
            }

            if (rednessRatio > 0.05 && userSkinType === 'oily') {
                const severity = rednessRatio > 0.1 ? 'moderate' : 'mild';
                issues.push({
                    id: 'pimple',
                    name: '痘痘',
                    severity: severity,
                    description: '可能存在痘痘或痘印问题',
                    suggestion: '建议保持面部清洁，使用祛痘产品'
                });
                overallScore -= 4;
            }

            overallScore = Math.max(60, Math.min(98, overallScore));

            const skincareRecommendations = [];
            if (shinyRatio > 0.08) {
                skincareRecommendations.push(skincareRecommendationsData[0]);
                skincareRecommendations.push(skincareRecommendationsData[1]);
            }
            if (darkRatio > 0.05) {
                skincareRecommendations.push(skincareRecommendationsData[4]);
            }
            if (rednessRatio > 0.08) {
                skincareRecommendations.push(skincareRecommendationsData[0]);
            }
            if (avgBrightness < 80) {
                skincareRecommendations.push(skincareRecommendationsData[2]);
                skincareRecommendations.push(skincareRecommendationsData[5]);
            }
            if (skincareRecommendations.length === 0) {
                skincareRecommendations.push(skincareRecommendationsData[0]);
                skincareRecommendations.push(skincareRecommendationsData[1]);
                skincareRecommendations.push(skincareRecommendationsData[2]);
            }

            const healthTips = [];
            if (darkRatio > 0.08) {
                healthTips.push({
                    id: 'sleep',
                    title: '作息提示',
                    description: '眼部暗沉可能与睡眠不足有关',
                    suggestion: '建议每天保证7-8小时睡眠'
                });
            }
            if (rednessRatio > 0.1) {
                healthTips.push({
                    id: 'diet',
                    title: '饮食提示',
                    description: '面部泛红可能与饮食刺激有关',

        const AppContext = createContext();

        function AppProvider({ children }) {
            const [state, setState] = useState(function() {

                if (saved) {

                    return {
                        currentUser: parsed.currentUser || null,
                        users: parsed.users || [],
                        currentStyle: parsed.currentStyle || 'neutral',
                        scanHistory: parsed.scanHistory || [],
                        selectedRecordId: null,
                        communityPosts: parsed.communityPosts || [],
                        deepseekApiKey: parsed.deepseekApiKey || '',
                        aiChatHistory: parsed.aiChatHistory || []
                    };
                }
                return { currentUser: null, users: [], currentStyle: 'neutral', scanHistory: [], selectedRecordId: null, communityPosts: [], deepseekApiKey: '', aiChatHistory: [] };
            });

            useEffect(function() {
                localStorage.setItem('faceAnalysisApp', JSON.stringify(state));
            }, [state]);

            const registerUser = async function(username, password, gender, skinType) {
                if (!username || username.length < 3) {
                    return { success: false, message: '用户名至少3个字符' };
                }
                if (!password || password.length < 6) {
                    return { success: false, message: '密码至少6个字符' };
                }
                const exists = state.users.find(function(u) { return u.username === username; });
                if (exists) {
                    return { success: false, message: '用户名已存在' };
                }
                const hashedPassword = await hashPassword(password);
                const newUser = {
                    username: username,
                    password: hashedPassword,
                    gender: gender,
                    skinType: skinType,
                    createdAt: new Date().toISOString()
                };
                const newUsers = [...state.users, newUser];
                setState(function(prev) {
                    return {
                        ...prev,
                        users: newUsers,
                        currentUser: newUser,
                        currentStyle: gender === 'female' ? 'cute' : 'neutral'
                    };
                });
                return { success: true, message: '注册成功' };
            };

            const loginUser = async function(username, password) {
                if (!username || !password) {
                    return { success: false, message: '请输入用户名和密码' };
                }
                const user = state.users.find(function(u) { return u.username === username; });
                if (!user) {
                    return { success: false, message: '用户不存在' };
                }
                const hashedPassword = await hashPassword(password);
                if (user.password !== hashedPassword) {
                    return { success: false, message: '密码错误' };
                }
                setState(function(prev) {
                    return {
                        ...prev,
                        currentUser: user,
                        currentStyle: user.gender === 'female' ? 'cute' : 'neutral'
                    };
                });
                return { success: true, message: '登录成功' };
            };

            const logoutUser = function() {
                setState(function(prev) {
                    return { ...prev, currentUser: null };
                });
            };

            const updateUserInfo = function(userInfo) {
                setState(function(prev) {
                    if (!prev.currentUser) return prev;
                    const updatedUser = { ...prev.currentUser, ...userInfo };
                    const updatedUsers = prev.users.map(function(u) {
                        return u.username === updatedUser.username ? updatedUser : u;
                    });
                    return {
                        ...prev,
                        currentUser: updatedUser,
                        users: updatedUsers,
                        currentStyle: updatedUser.gender === 'female' ? 'cute' : prev.currentStyle
                    };
                });
            };

            const addScanRecord = function(record) {
                setState(function(prev) {
                    return { ...prev, scanHistory: [record, ...prev.scanHistory] };
                });
            };

            const deleteScanRecord = function(recordId) {
                setState(function(prev) {
                    return { ...prev, scanHistory: prev.scanHistory.filter(function(r) { return r.id !== recordId; }) };
                });
            };

            const clearScanHistory = function() {
                setState(function(prev) {
                    return { ...prev, scanHistory: [] };
                });
            };

            const setSelectedRecord = function(recordId) {
                setState(function(prev) {
                    return { ...prev, selectedRecordId: recordId };
                });
            };

            const setStyle = function(style) {
                setState(function(prev) { return { ...prev, currentStyle: style }; });
            };

            const addCommunityPost = function(post) {
                setState(function(prev) {
                    return {
                        ...prev,
                        communityPosts: [post, ...prev.communityPosts]
                    };
                });
            };

            const likePost = function(postId) {
                setState(function(prev) {
                    const updatedPosts = prev.communityPosts.map(function(p) {
                        if (p.id === postId) {
                            const isLiked = p.likedBy.includes(prev.currentUser.username);
                            return {
                                ...p,
                                likes: isLiked ? p.likes - 1 : p.likes + 1,
                                likedBy: isLiked 
                                    ? p.likedBy.filter(function(u) { return u !== prev.currentUser.username; })
                                    : [...p.likedBy, prev.currentUser.username]
                            };
                        }
                        return p;
                    });
                    return { ...prev, communityPosts: updatedPosts };
                });
            };

            const addComment = function(postId, comment) {
                setState(function(prev) {
                    const updatedPosts = prev.communityPosts.map(function(p) {
                        if (p.id === postId) {
                            return {
                                ...p,
                                comments: [...p.comments, comment]
                            };
                        }
                        return p;
                    });
                    return { ...prev, communityPosts: updatedPosts };
                });
            };

            const deletePost = function(postId) {
                setState(function(prev) {
                    return {
                        ...prev,
                        communityPosts: prev.communityPosts.filter(function(p) { return p.id !== postId; })
                    };
                });
            };

            const setDeepseekApiKey = function(apiKey) {
                setState(function(prev) {
                    return { ...prev, deepseekApiKey: apiKey };
                });
            };

            const addAiChatMessage = function(message) {
                setState(function(prev) {
                    return { ...prev, aiChatHistory: [...prev.aiChatHistory, message] };
                });
            };

            const clearAiChatHistory = function() {

            const callDeepseekAPI = async function(messages, options) {
                const apiKey = state.deepseekApiKey;
                if (!apiKey) {
                    return { success: false, message: '请先在设置中配置智谱AI API Key' };
                }

                const opts = options || {};
                const model = opts.model || 'glm-4-flash';
                const temperature = opts.temperature !== undefined ? opts.temperature : 0.7;
                const maxTokens = opts.maxTokens || 2000;

                try {
                    const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages,
                            temperature: temperature,
                            max_tokens: maxTokens
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(function() { return {}; });
                        let errorMsg = 'API调用失败';
                        if (response.status === 401) {
                            errorMsg = 'API Key无效，请检查您的智谱AI API Key';
                        } else if (response.status === 404) {
                            errorMsg = '模型不存在，请确认模型名称正确';
                        } else if (response.status === 429) {
                            errorMsg = '请求过于频繁，请稍后再试';
                        } else if (errorData.error && errorData.error.message) {
                            errorMsg = errorData.error.message;
                        } else {
                            errorMsg = errorMsg + '（状态码：' + response.status + '）';
                        }
                        return { success: false, message: errorMsg };
                    }

                    const data = await response.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        return {
                            success: true,
                            content: data.choices[0].message.content,
                            usage: data.usage
                        };
                    }
                    return { success: false, message: '响应格式异常' };
                } catch (error) {
                    return { success: false, message: '网络错误：' + (error.message || '请求失败') };
                }
            };

            return e(AppContext.Provider, { value: { 
                state: state, 
                registerUser: registerUser, 
                loginUser: loginUser, 
                logoutUser: logoutUser, 
                updateUserInfo: updateUserInfo, 
                addScanRecord: addScanRecord,

                const data = imageData.data;
                let totalBrightness = 0;

                for (let i = 0; i < data.length; i += 16) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    totalBrightness += (r + g + b) / 3;
                    pixelCount++;
                }
                return pixelCount > 0 ? totalBrightness / pixelCount : 0;

                        navigator.clipboard.writeText(shareText).then(function() {
                            setShareSuccess(true);
                            setTimeout(closeShareModal, 1500);
                        }).catch(function() {
                            fallbackCopy(shareText);
                        });
                        return;
                    }
                } catch (e) {}
                
                fallbackCopy(shareText);
            };

            function fallbackCopy(text) {
                try {
                    var textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    textarea.style.top = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    var ok = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (ok) {
                        setShareSuccess(true);
                        setTimeout(closeShareModal, 1500);
                    } else {
                        alert('请手动复制：\n\n' + text);
                        closeShareModal();
                    }

                        ),
                        e('div', { className: 'text-sm text-gray-600 space-y-2 pt-2' },
                            e('p', null, '版本：1.0.0'),
                            e('p', null, '一款基于图像识别的中医面诊与皮肤分析工具，让健康触手可及。'),
                            e('p', { className: 'text-xs text-gray-400 pt-2' }, '免责声明：本应用仅供参考，不能替代专业医疗诊断。')
                        )
                    )
                )
            );
        }

        function AIChat({ onNavigate }) {
            const { state, callDeepseekAPI, clearAiChatHistory } = useApp();
            const [messages, setMessages] = useState(function() {
                const history = state.aiChatHistory || [];
                if (history.length === 0) {
                    return [{
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: '您好！我是颜容AI助手 🤖\n\n我可以帮您：\n• 解答皮肤护理问题\n• 解读中医面诊结果\n• 提供健康养生建议\n• 分析肤质和护肤方案\n\n请问有什么可以帮助您的？'
                    }];
                }
                return history;
            });
            const [inputText, setInputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            const messagesEndRef = React.useRef(null);
            const isCute = state.currentStyle === 'cute';

            const bgStyle = isCute ? 'bg-gradient-to-br from-pink-100 via-purple-50 to-pink-50' : 'bg-gradient-to-br from-gray-50 via-slate-50 to-gray-100';
            const btnStyle = isCute ? 'bg-gradient-to-r from-pink-400 to-purple-400' : 'bg-gradient-to-r from-gray-500 to-slate-500';
            const cardStyle = isCute ? 'bg-white/80 rounded-2xl shadow-lg border-pink-100' : 'bg-white/80 rounded-xl shadow-md border-gray-100';

            useEffect(function() {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages]);

            const sendMessage = async function() {
                const text = inputText.trim();
                if (!text || isLoading) return;

                if (!state.deepseekApiKey) {
                    const noKeyMsg = {
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: '⚠️ 您还没有配置智谱AI API Key，请先在「个人中心 → AI助手设置」中配置API Key后再使用。'
                    };
                    setMessages(function(prev) { return [...prev, noKeyMsg]; });
                    return;
                }

                const userMsg = { id: Date.now().toString(), role: 'user', content: text };
                setMessages(function(prev) { return [...prev, userMsg]; });
                setInputText('');
                setIsLoading(true);

                const systemPrompt = '你是颜容AI助手，一款专注于中医面诊和皮肤健康分析的智能助手。请用友好、专业的语气回答用户的问题。你的专长包括：皮肤护理建议、中医面诊解读（唇色、眼神、面色、印堂）、健康养生建议、肤质分析等。回答要简洁实用，避免过长，适当使用emoji增加亲和力。如果用户询问医疗诊断相关问题，请提醒用户本应用仅供参考，不能替代专业医疗诊断。';
                
                const apiMessages = [{ role: 'system', content: systemPrompt }];
                messages.slice(-10).forEach(function(m) {
                    if (m.role === 'user' || m.role === 'assistant') {
                        apiMessages.push({ role: m.role, content: m.content });
                    }
                });
                apiMessages.push({ role: 'user', content: text });

                const result = await callDeepseekAPI(apiMessages, { temperature: 0.8, maxTokens: 1500 });
                
                setIsLoading(false);
                if (result.success) {
                    const aiMsg = {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: result.content
                    };
                    setMessages(function(prev) { return [...prev, aiMsg]; });
                } else {
                    const errorMsg = {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: '❌ ' + result.message
                    };
                    setMessages(function(prev) { return [...prev, errorMsg]; });
                }
            };

            const handleKeyPress = function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const handleClearChat = function() {
                setShowClearConfirm(false);
                setMessages([{
                    id: Date.now().toString(),
                    role: 'assistant',
                    content: '对话已清空。请问有什么可以帮助您的？ 🤖'
                }]);
                clearAiChatHistory();
            };

            const quickQuestions = [
                '油性皮肤怎么护理？',
                '气血不足怎么调理？',
                '黑眼圈很重怎么办？',
                '推荐一下日常护肤步骤'
            ];

            return e('div', { className: 'min-h-screen ' + bgStyle + ' flex flex-col' },
                e('header', { className: 'flex items-center gap-4 p-4 ' + (isCute ? 'bg-pink-100/80' : 'bg-gray-100/80') + ' backdrop-blur-sm sticky top-0 z-10' },
                    e('button', { onClick: function() { onNavigate('home'); }, className: 'p-2 rounded-full ' + (isCute ? 'bg-pink-200 text-pink-600' : 'bg-gray-200 text-gray-600') }, '←'),
                    e('div', { className: 'flex-1' },
                        e('h1', { className: 'text-lg font-bold ' + (isCute ? 'text-pink-600' : 'text-gray-700') }, 'AI助手'),
                        e('p', { className: 'text-xs text-gray-500' }, state.deepseekApiKey ? '智谱AI 已连接' : '请先配置API Key')
                    ),
                    e('button', { onClick: function() { setShowClearConfirm(true); }, className: 'p-2 rounded-full ' + (isCute ? 'bg-pink-200 text-pink-600' : 'bg-gray-200 text-gray-600') }, '🗑️')
                ),
                e('div', { className: 'flex-1 overflow-y-auto p-4 pb-4' },
                    messages.map(function(msg) {
                        const isUser = msg.role === 'user';
                        return e('div', { key: msg.id, className: 'flex ' + (isUser ? 'justify-end' : 'justify-start') + ' mb-4 animate-fade-in' },
                            !isUser && e('div', { className: 'w-8 h-8 rounded-full flex items-center justify-center mr-2 flex-shrink-0 ' + (isCute ? 'bg-gradient-to-br from-pink-200 to-purple-200' : 'bg-gray-200') }, '🤖'),
                            e('div', { className: 'max-w-[80%] ' + (isUser ? 'order-first mr-2' : '') },
                                e('div', { className: 'px-4 py-3 rounded-2xl ' + (isUser 
                                    ? (isCute ? 'bg-gradient-to-r from-pink-400 to-purple-400 text-white' : 'bg-gray-600 text-white') + ' rounded-br-sm'
                                    : (isCute ? 'bg-white text-gray-700 shadow-md border border-pink-100' : 'bg-white text-gray-700 shadow-md border border-gray-100') + ' rounded-bl-sm') 
                                },
                                    e('p', { className: 'text-sm whitespace-pre-wrap leading-relaxed' }, msg.content)
                                )
                            ),
                            isUser && e('div', { className: 'w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ' + (isCute ? 'bg-pink-100' : 'bg-gray-100') }, '👤')
                        );
                    }),
                    isLoading && e('div', { className: 'flex justify-start mb-4' },
                        e('div', { className: 'w-8 h-8 rounded-full flex items-center justify-center mr-2 ' + (isCute ? 'bg-gradient-to-br from-pink-200 to-purple-200' : 'bg-gray-200') }, '🤖'),
                        e('div', { className: 'px-4 py-3 rounded-2xl rounded-bl-sm bg-white shadow-md ' + (isCute ? 'border border-pink-100' : 'border border-gray-100') },
                            e('div', { className: 'flex gap-1' },
                                e('span', { className: 'w-2 h-2 rounded-full bg-gray-400 animate-pulse' }),
                                e('span', { className: 'w-2 h-2 rounded-full bg-gray-400 animate-pulse', style: { animationDelay: '0.2s' } }),
                                e('span', { className: 'w-2 h-2 rounded-full bg-gray-400 animate-pulse', style: { animationDelay: '0.4s' } })
                            )
                        )
                    ),
                    e('div', { ref: messagesEndRef })
                ),
                messages.length <= 1 && e('div', { className: 'px-4 pb-2' },
                    e('p', { className: 'text-xs text-gray-500 mb-2' }, '💡 试试这些问题：'),
                    e('div', { className: 'flex flex-wrap gap-2' },
                        quickQuestions.map(function(q) {
                            return e('button', { 
                                key: q, 
                                onClick: function() { setInputText(q); },
                                className: 'px-3 py-1.5 rounded-full text-xs ' + (isCute ? 'bg-pink-100 text-pink-600 hover:bg-pink-200' : 'bg-gray-100 text-gray-600 hover:bg-gray-200') + ' transition-colors'
                            }, q);
                        })
                    )
                ),
                e('div', { className: 'p-4 ' + (isCute ? 'bg-pink-50/80' : 'bg-gray-50/80') + ' backdrop-blur-sm' },
                    e('div', { className: 'flex items-end gap-2' },
                        e('textarea', {
                            value: inputText,
                            onChange: function(e) { setInputText(e.target.value); },
                            onKeyPress: handleKeyPress,
                            placeholder: '输入您的问题...',
                            rows: 1,
                            className: 'flex-1 px-4 py-3 rounded-2xl border ' + (isCute ? 'border-pink-200 focus:border-pink-400 focus:ring-2 focus:ring-pink-200' : 'border-gray-200 focus:border-gray-400 focus:ring-2 focus:ring-gray-200') + ' outline-none transition-all resize-none max-h-32'
                        }),
                        e('button', { 
                            onClick: sendMessage,
                            disabled: isLoading || !inputText.trim(),
                            className: 'p-3 rounded-full text-white ' + btnStyle + ' disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-95'
                        }, '➤')
                    )
                ),
                showClearConfirm && e('div', { className: 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4', onClick: function() { setShowClearConfirm(false); } },
                    e('div', { className: 'bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl', onClick: function(e) { e.stopPropagation(); } },
                        e('h3', { className: 'text-lg font-bold text-gray-800 mb-3' }, '确认清空'),
                        e('p', { className: 'text-gray-600 mb-5' }, '确定要清空所有对话记录吗？此操作不可撤销。'),
                        e('div', { className: 'flex gap-3' },
                            e('button', { onClick: function() { setShowClearConfirm(false); }, className: 'flex-1 py-2.5 rounded-full border border-gray-200 text-gray-600' }, '取消'),
                            e('button', { onClick: handleClearChat, className: 'flex-1 py-2.5 rounded-full bg-red-500 text-white' }, '清空')
                        )
                    )
                )
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = useState('login');
            const [isTransitioning, setIsTransitioning] = useState(false);
            const { state, logoutUser } = useApp();

            useEffect(function() {
                if (state.currentUser) {
                    setCurrentPage('home');
                } else {
                    setCurrentPage('login');
                }
            }, [state.currentUser]);

            const navigate = function(page) {
                if (page === currentPage) return;
                setIsTransitioning(true);
                setTimeout(function() {
                    setCurrentPage(page);
                    window.scrollTo(0, 0);
                    setIsTransitioning(false);
                }, 200);
            };

            const handleLogout = function() {
                logoutUser();
                navigate('login');
            };

            const renderPage = function() {
                switch (currentPage) {
                    case 'login': return e(Login, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
                    case 'register': return e(Register, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
                    case 'home': return e(Home, { onNavigate: navigate });
                    case 'upload': return e(PhotoUpload, { onNavigate: navigate, onComplete: function() { navigate('result'); } });
                    case 'result': return e(Result, { onNavigate: navigate });
                    case 'history': return e(History, { onNavigate: navigate });
                    case 'community': return e(Community, { onNavigate: navigate });
                    case 'profile': return e(Profile, { onNavigate: navigate, onLogout: handleLogout });
                    case 'aichat': return e(AIChat, { onNavigate: navigate });
                    default: return e(Login, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
                }
            };

            return e('div', { className: 'min-h-screen bg-gray-50' },
                e('div', { 
                    className: 'transition-all duration-200 ease-in-out ' + 
                        (isTransitioning ? 'opacity-0 translate-x-4' : 'opacity-100 translate-x-0')
                },
                    renderPage()
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(AppProvider, null, e(App)));
    </script>
</body>
</html>
