看得见。",author:"— 温暖小站"},{text:"人生没有白走的路，每一步都算数。",author:"— 温暖小站"},{text:"不是因为看到希望才坚持，而是因为坚持才看到希望。",author:"— 温暖小站"},{text:"愿你如阳光，明媚不忧伤；愿你如月光，明亮不清冷。",author:"— 温暖小站"},{text:"生活的美好，在于它的不确定性。",author:"— 温暖小站"}],ke=[{title:"窗边的向日葵",content:'有一位老人，每天都会在窗边放一盆向日葵。不管天气如何，向日葵总是朝着阳光的方向。有人问她："为什么每天都要这样？"老人笑着说："因为我知道，无论今天经历了什么，明天太阳总会升起。"其实，我们每个人心里都有这样一盆向日葵，只要我们愿意，总能找到属于自己的阳光。'},{title:"深夜的灯光",content:"在一个寒冷的冬夜，女孩加班到很晚。走出办公楼时，她发现整栋楼只有自己办公室的灯还亮着。正当她感到孤独的时候，她看到对面居民楼里，有一盏灯正在为她闪烁。那是她的室友，知道她加班晚，特意留了一盏灯。那一刻，她觉得这个冬天不再寒冷。"},{title:"温暖的陌生人",content:'一位妈妈带着孩子在公交车上，孩子突然哭闹不止。妈妈急得满头大汗，周围的乘客也纷纷投来不满的目光。就在这时，一位老奶奶从包里拿出一颗糖，递给孩子说："小朋友，吃糖就不哭了哦。"孩子接过糖，停止了哭闹。妈妈感激地看着老奶奶，老奶奶只是微笑着说："每个孩子都是天使，只是有时候他们需要一点甜。"'},{title:"雨后的彩虹",content:'小男孩因为考试失利而闷闷不乐，他坐在窗边，看着窗外的大雨。爸爸走过来，坐在他身边说："你看，大雨过后总会有彩虹。人生也是一样，遇到困难不要害怕，因为困难之后，总会有美好的事情等着你。"小男孩似懂非懂地点点头。雨停了，一道美丽的彩虹出现在天边，小男孩的脸上终于露出了笑容。'}],Pt={MEMORIES:"starlight_memories",MOODS:"starlight_moods",QUOTES:"starlight_quotes",EXPECTATIONS:"starlight_expectations",TREEHOLE:"starlight_treehole",MEMORY_ID:"starlight_memory_id"},Ie=(t,e=null)=>{try{const n=localStorage.getItem(t);return n?JSON.parse(n):e}catch{return e}},De=(t,e)=>{try{return localStorage.setItem(t,JSON.stringify(e)),!0}catch{return!1}},Da=t=>{try{return localStorage.removeItem(t),!0}catch{return!1}},vt={getMemories:()=>Ie(Pt.MEMORIES,[]),setMemories:t=>De(Pt.MEMORIES,t),getMoods:()=>Ie(Pt.MOODS,[]),setMoods:t=>De(Pt.MOODS,t),getQuotes:()=>Ie(Pt.QUOTES,[]),setQuotes:t=>De(Pt.QUOTES,t),getExpectations:()=>Ie(Pt.EXPECTATIONS,[]),setExpectations:t=>De(Pt.EXPECTATIONS,t),getTreehole:()=>Ie(Pt.TREEHOLE,[]),setTreehole:t=>De(Pt.TREEHOLE,t),getMemoryId:()=>Ie(Pt.MEMORY_ID,0),setMemoryId:t=>De(Pt.MEMORY_ID,t),clearAll:()=>{Object.values(Pt).forEach(Da)}},Pa={class:"morning-scene"},Ra={class:"sun-container"},La={class:"particles-container"},Fa={class:"nav-bar"},Na={class:"scene-content"},Ha={class:"quote-card"},ka={class:"quote-text"},ja={key:0,class:"quote-author"},Ba={class:"breathing-section"},Va={class:"breathing-text"},
