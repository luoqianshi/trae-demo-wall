version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: linkhood-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-linkhood}
      MYSQL_USER: ${DB_USER:-linkhood}
      MYSQL_PASSWORD: ${DB_PASSWORD:-linkhood123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - linkhood-network

  backend:
    build: ./backend
    container_name: linkhood-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-linkhood}
      DB_USER: ${DB_USER:-linkhood}
      DB_PASSWORD: ${DB_PASSWORD:-linkhood123}
      JWT_SECRET: ${JWT_SECRET:-linkhood-secret-key-2026-neighbor-social-platform}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - linkhood-network
    command: >
      sh -c "npx sequelize-cli db:migrate --config config/database.js &&
             node server.js"

  frontend:
    build: ./frontend
    container_name: linkhood-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - linkhood-network

volumes:
  mysql_data:

networks:
  linkhood-network:
    driver: bridge
