<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即兴剧场AI - 你的口袋剧场</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #14142b;
            --border: rgba(139,92,246,0.2);
            --accent: #8b5cf6;
            --accent2: #ec4899;
            --accent3: #fbbf24;
            --text: #e8e8f0;
            --text-dim: #a1a1b5;
            --green: #4ade80;
            --red: #f87171;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        .app { max-width: 800px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

        /* ===== 通用 ===== */
        .hidden { display: none !important; }
        .btn {
            border: none; cursor: pointer; border-radius: 12px;
            font-size: 15px; font-weight: 600; padding: 14px 28px;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; box-shadow: 0 4px 20px rgba(139,92,246,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(139,92,246,0.45); }
        .btn-ghost { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: rgba(255,255,255,0.12); }
        .tag {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }

        /* ===== 首页 ===== */
        #page-home { flex: 1; display: flex; flex-direction: column; }
        .hero {
            text-align: center; padding: 60px 24px 40px;
            background: linear-gradient(160deg, #1a1a3e 0%, #2d1b69 40%, #1a1a3e 100%);
            position: relative; overflow: hidden;
        }
        .hero::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        }
        .hero .logo { font-size: 56px; margin-bottom: 8px; }
        .hero h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(90deg, #a78bfa, #f472b6, #fbbf24);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .hero p { color: var(--accent); font-size: 16px; }
        .hero .stats {
            display: flex; justify-content: center; gap: 32px; margin-top: 28px;
        }
        .hero .stat { text-align: center; }
        .hero .stat .num { font-size: 24px; font-weight: 800; color: var(--text); }
        .hero .stat .label { font-size: 12px; color: var(--text-dim); }

        .section { padding: 32px 24px; }
        .section-title {
            font-size: 20px; font-weight: 700; margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px; color: #c4b5fd;
        }
        .section-title .bar { width: 4px; height: 20px; background: var(--accent); border-radius: 2px; }

        .scripts-grid { display: grid; gap: 16px; }
        .script-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .script-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(139,92,246,0.2); }
        .script-card .icon { font-size: 32px; margin-bottom: 8px; display: block; }
        .script-card h3 { font-size: 18px; margin-bottom: 6px; color: #ddd6fe; }
        .script-card p { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
        .script-card .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .script-card .tag { background: rgba(139,92,246,0.15); color: #c4b5fd; }
        .script-card .tag.hot { background: rgba(236,72,153,0.15); color: #f9a8d4; }
        .script-card .difficulty { position: absolute; top: 16px; right: 16px; font-size: 12px; color: var(--accent3); }

        /* ===== 角色卡页面 ===== */
        #page-role { flex: 1; }
        .role-header { background: linear-gradient(160deg, #1a1a3e, #2d1b69); padding: 32px 24px; text-align: center; }
        .role-header .scene-icon { font-size: 48px; margin-bottom: 8px; }
        .role-header h2 { font-size: 22px; color: #ddd6fe; margin-bottom: 8px; }
        .role-header .scene-desc { font-size: 14px; color: var(--text-dim); max-width: 500px; margin: 0 auto; }
        .role-body { padding: 24px; }
        .my-role {
            background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.1));
            border: 1px solid var(--accent); border-radius: 16px; padding: 24px; margin-bottom: 20px;
        }
        .my-role .label { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
        .my-role .role-name { font-size: 22px; font-weight: 700; color: #ddd6fe; margin-bottom: 8px; }
        .my-role .role-traits { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .my-role .role-traits .tag { background: rgba(255,255,255,0.1); color: var(--text); }
        .my-role .role-mission {
            background: rgba(0,0,0,0.25); border-radius: 10px; padding: 14px;
            font-size: 14px; color: var(--accent3); border-left: 3px solid var(--accent3);
        }
        .my-role .role-mission .mlabel { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
        .npc-list { display: grid; gap: 12px; }
        .npc-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: start;
        }
        .npc-card .avatar { font-size: 28px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(139,92,246,0.1); border-radius: 12px; flex-shrink: 0; }
        .npc-card .info h4 { font-size: 15px; color: #ddd6fe; margin-bottom: 2px; }
        .npc-card .info .role { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        .npc-card .info .desc { font-size: 13px; color: var(--text-dim); }

        /* ===== 演出页面 ===== */
        #page-stage { flex: 1; display: flex; flex-direction: column; }
        .stage-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; background: rgba(139,92,246,0.08);
            border-bottom: 1px solid var(--border);
        }
        .stage-header .title { font-size: 15px; font-weight: 600; color: #ddd6fe; display: flex; align-items: center; gap: 8px; }
        .stage-header .actions { display: flex; gap: 8px; }
        .stage-header .actions button {
            background: none; border: 1px solid var(--border); color: var(--text-dim);
            border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .stage-header .actions button:hover { color: var(--text); border-color: var(--accent); }
        .scene-banner {
            background: rgba(139,92,246,0.06); padding: 12px 20px;
            border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-dim);
            display: flex; align-items: center; gap: 8px;
        }
        .scene-banner .pulse { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { display: flex; gap: 10px; max-width: 88%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg .avatar { font-size: 22px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; flex-shrink: 0; }
        .msg .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; }
        .msg .bubble .sender { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
        .msg .bubble .text { color: var(--text); }
        .msg.npc { align-self: flex-start; }
        .msg.npc .avatar { background: rgba(236,72,153,0.12); }
        .msg.npc .bubble { background: rgba(236,72,153,0.1); border-radius: 16px 16px 16px 4px; }
        .msg.npc .bubble .sender { color: #f9a8d4; }
        .msg.narrator { align-self: center; max-width: 90%; }
        .msg.narrator .bubble {
            background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
            border-radius: 12px; text-align: center; font-size: 13px; color: var(--accent3); font-style: italic;
        }
        .msg.player { align-self: flex-end; flex-direction: row-reverse; }
        .msg.player .avatar { background: rgba(139,92,246,0.12); }
        .msg.player .bubble { background: rgba(139,92,246,0.15); border-radius: 16px 16px 4px 16px; }
        .msg.player .bubble .sender { color: #c4b5fd; text-align: right; }
        .msg.clue .bubble {
            background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2);
            border-radius: 10px; font-size: 13px; color: var(--green);
        }
        .typing-indicator { align-self: flex-start; display: flex; gap: 10px; }
        .typing-indicator .avatar { font-size: 22px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(236,72,153,0.12); border-radius: 10px; }
        .typing-indicator .dots { display: flex; gap: 4px; align-items: center; background: rgba(236,72,153,0.1); border-radius: 16px; padding: 14px 18px; }
        .typing-indicator .dot { width: 7px; height: 7px; background: #f9a8d4; border-radius: 50%; animation: bounce 1s infinite; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .quick-actions { padding: 8px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-actions .qa {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-dim);
            padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit;
            transition: all 0.15s;
        }
        .quick-actions .qa:hover { background: rgba(139,92,246,0.15); color: #c4b5fd; border-color: var(--accent); }

        .input-area { padding: 12px 20px 20px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea {
            flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 14px;
            font-family: inherit; resize: none; max-height: 120px; min-height: 44px;
        }
        .input-row textarea:focus { outline: none; border-color: var(--accent); }
        .input-row .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white;
            border: none; border-radius: 12px; width: 44px; height: 44px; cursor: pointer;
            font-size: 18px; flex-shrink: 0; transition: all 0.2s;
        }
        .input-row .send-btn:hover { transform: scale(1.05); }
        .input-row .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== 回顾页面 ===== */
        #page-review { flex: 1; }
        .review-header { background: linear-gradient(160deg, #1a1a3e, #2d1b69); padding: 40px 24px; text-align: center; }
        .review-header .medal { font-size: 56px; margin-bottom: 8px; }
        .review-header h2 { font-size: 28px; font-weight: 800; color: #ddd6fe; margin-bottom: 8px; }
        .review-header .score { font-size: 48px; font-weight: 800; background: linear-gradient(90deg, var(--accent3), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .review-header .score-label { font-size: 14px; color: var(--text-dim); }
        .review-body { padding: 24px; }
        .score-breakdown { display: grid; gap: 12px; margin-bottom: 24px; }
        .score-item { display: flex; align-items: center; gap: 12px; }
        .score-item .name { width: 100px; font-size: 14px; color: var(--text-dim); }
        .score-item .bar-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
        .score-item .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1s ease; }
        .score-item .val { width: 36px; text-align: right; font-size: 14px; font-weight: 700; color: #c4b5fd; }
        .achievements { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
        .achievement {
            background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(236,72,153,0.08));
            border: 1px solid rgba(251,191,36,0.25); border-radius: 12px; padding: 14px 18px; text-align: center;
        }
        .achievement .a-icon { font-size: 28px; }
        .achievement .a-name { font-size: 12px; color: var(--accent3); font-weight: 600; margin-top: 4px; }
        .highlight-list { margin-bottom: 24px; }
        .highlight-item {
            background: rgba(255,255,255,0.04); border-left: 3px solid var(--accent2);
            border-radius: 0 12px 12px 0; padding: 14px 18px; margin-bottom: 12px;
        }
        .highlight-item .h-label { font-size: 12px; color: var(--accent2); font-weight: 700; margin-bottom: 4px; }
        .highlight-item .h-text { font-size: 14px; color: var(--text); }

        /* ===== 社区页面 ===== */
        #page-community { flex: 1; }
        .community-list { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
        .play-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer;
        }
        .play-card:hover { border-color: var(--accent); }
        .play-card .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .play-card .ph .ptitle { font-size: 16px; font-weight: 600; color: #ddd6fe; }
        .play-card .ph .pscore { font-size: 14px; color: var(--accent3); font-weight: 700; }
        .play-card .pexcerpt { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
        .play-card .pmeta { display: flex; gap: 12px; font-size: 12px; color: var(--text-dim); }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            display: flex; background: rgba(20,20,43,0.95); border-top: 1px solid var(--border);
            backdrop-filter: blur(10px); padding: 8px 0; position: sticky; bottom: 0;
        }
        .nav-item {
            flex: 1; text-align: center; padding: 8px; cursor: pointer; color: var(--text-dim);
            font-size: 12px; transition: color 0.2s; font-family: inherit; background: none; border: none;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
<div class="app">

    <!-- ===== 首页 ===== -->
    <div id="page-home">
        <div class="hero">
            <div class="logo">🎭</div>
            <h1>即兴剧场AI</h1>
            <p>你的口袋剧场 · 打开就能演</p>
            <div class="stats">
                <div class="stat"><div class="num" id="stat-plays">0</div><div class="label">已演出场次</div></div>
                <div class="stat"><div class="num" id="stat-score">--</div><div class="label">最高演技分</div></div>
                <div class="stat"><div class="num" id="stat-achievements">0</div><div class="label">成就解锁</div></div>
            </div>
        </div>
        <div class="section">
            <div class="section-title"><span class="bar"></span>选择你的剧本</div>
            <div class="scripts-grid" id="scripts-grid"></div>
        </div>
        <div class="section">
            <div class="section-title"><span class="bar"></span>社区剧场</div>
            <div style="font-size:14px;color:var(--text-dim);margin-bottom:12px;">看看别人演了什么精彩好戏</div>
            <div class="community-list" id="community-preview"></div>
        </div>
    </div>

    <!-- ===== 角色卡页面 ===== -->
    <div id="page-role" class="hidden">
        <div class="role-header" id="role-header"></div>
        <div class="role-body" id="role-body"></div>
        <div style="padding:0 24px 32px;text-align:center;">
            <button class="btn btn-primary" onclick="startPerformance()" style="width:100%;font-size:17px;">🎭 开始演出</button>
        </div>
    </div>

    <!-- ===== 演出页面 ===== -->
    <div id="page-stage" class="hidden">
        <div class="stage-header">
            <div class="title" id="stage-title">🎭 演出中</div>
            <div class="actions">
                <button onclick="endPerformance(true)">🏁 结束演出</button>
            </div>
        </div>
        <div class="scene-banner">
            <span class="pulse"></span>
            <span id="scene-text">场景加载中...</span>
        </div>
        <div class="chat-area" id="chat-area"></div>
        <div class="quick-actions" id="quick-actions"></div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="msg-input" placeholder="输入你的台词或动作...（如：我仔细观察房间角落）" rows="1"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendPlayerMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- ===== 回顾页面 ===== -->
    <div id="page-review" class="hidden">
        <div class="review-header" id="review-header"></div>
        <div class="review-body" id="review-body"></div>
        <div style="padding:0 24px 32px;display:flex;gap:12px;">
            <button class="btn btn-ghost" onclick="goHome()" style="flex:1;">回到首页</button>
            <button class="btn btn-primary" onclick="goHome()" style="flex:1;">再演一场</button>
        </div>
    </div>

    <!-- ===== 底部导航 ===== -->
    <div class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" onclick="goHome()"><span class="icon">🏠</span>首页</button>
        <button class="nav-item" onclick="goCommunity()"><span class="icon">🌐</span>社区</button>
        <button class="nav-item" onclick="goHome()"><span class="icon">🎨</span>工坊</button>
    </div>
</div>

<script>
// ===== 剧本数据库 =====
const SCRIPTS = {
    mystery: {
        id: 'mystery',
        icon: '🕵️',
        name: '雾庄迷案',
        type: '悬疑探案',
        difficulty: '★★☆',
        desc: '深夜的雾庄别墅发生了一起离奇命案。你是受邀前来调查的侦探，每个人都有秘密，每个人都有动机……',
        tags: ['推理', '悬疑', '反转'],
        scene: '1947年 · 雾庄别墅 · 暴雨夜',
        sceneIcon: '🏰',
        sceneDesc: '窗外暴雨如注，雷声轰鸣。雾庄别墅的主人——富商沈明远被发现倒在书房，手边是一杯没喝完的红酒。门从内侧反锁，窗户紧闭，这是一个密室。',
        playerRole: {
            name: '侦探·李默',
            icon: '🎭',
            traits: ['冷静观察', '逻辑缜密', '不善交际'],
            mission: '找出真凶，还原案发经过。注意：凶手就藏在在场的人中，且现场看似自杀实则谋杀。'
        },
        npcs: [
            { name: '管家·王伯', icon: '🧓', role: '在沈家服务30年', desc: '忠诚老实，但对主人的某些行为颇有微词' },
            { name: '沈夫人·林婉', icon: '💃', role: '沈明远的第二任妻子', desc: '年轻貌美，与主人关系紧张，似乎有隐情' },
            { name: '私人医生·陈泽', icon: '👨‍⚕️', role: '沈明远的私人医生', desc: '专业冷静，但被发现频繁出入书房' }
        ],
        keywords: {
            '红酒|酒|杯子': { clue: '🍷 线索：红酒杯中检测出微量苦杏仁味——可能是氰化物！', score: 15 },
            '窗户|窗': { clue: '🪟 线索：窗户虽然紧闭，但窗框上有细微的划痕，似乎曾被从外部打开过。', score: 10 },
            '门|锁|密室': { clue: '🔒 线索：门从内部反锁，但锁芯上有新鲜的划痕——有人用工具从外部操作过。', score: 15 },
            '王伯|管家': { npc: '管家·王伯', reply: '老爷对我有知遇之恩，我绝不会害他！不过……那天晚上我听到书房里有争吵声，是夫人和陈医生。', score: 8 },

let state = {

// ===== 初始化 =====
function init() {
    renderScripts();
    renderCommunityPreview();
    updateStats();
}

function renderScripts() {
    const grid = document.getElementById('scripts-grid');
    grid.innerHTML = Object.values(SCRIPTS).map(s => `
        <div class="script-card" onclick="selectScript('${s.id}')">
            <span class="difficulty">${s.difficulty}</span>
            <span class="icon">${s.icon}</span>
            <h3>${s.name}</h3>
            <p>${s.desc}</p>
            <div class="tags">
                <span class="tag ${s.id==='mystery'?'hot':''}">${s.type}</span>
                ${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}
            </div>
        </div>
    `).join('');
}

function renderCommunityPreview() {
    const el = document.getElementById('community-preview');
    el.innerHTML = COMMUNITY.slice(0,2).map(p => `
        <div class="play-card" onclick="goCommunity()">
            <div class="ph"><span class="ptitle">${p.title}</span><span class="pscore">⭐${p.score}</span></div>
            <div class="pexcerpt">${p.excerpt}</div>
            <div class="pmeta">📍${p.meta.type} · ⏱️${p.meta.time} · 👤${p.meta.author}</div>
        </div>
    `).join('');
}

function updateStats() {
    document.getElementById('stat-plays').textContent = state.playHistory.length;
    document.getElementById('stat-score').textContent = state.bestScore || '--';
    document.getElementById('stat-achievements').textContent = state.unlockedAchievements.length;
}

// ===== 选择剧本 =====
function selectScript(id) {
    state.currentScript = SCRIPTS[id];
    renderRolePage();
    showPage('page-role');
}

function renderRolePage() {
    const s = state.currentScript;
    document.getElementById('role-header').innerHTML = `
        <div class="scene-icon">${s.sceneIcon}</div>
        <h2>${s.name}</h2>
        <div class="scene-desc">${s.scene}</div>
        <p style="margin-top:12px;font-size:13px;color:var(--text-dim);max-width:500px;margin-left:auto;margin-right:auto;">${s.sceneDesc}</p>
    `;
    document.getElementById('role-body').innerHTML = `
        <div class="my-role">
            <div class="label">🎭 你的角色</div>
            <div class="role-name">${s.playerRole.name}</div>

            </div>

        <div class="npc-list">
            ${s.npcs.map(n=>`

                    <div class="avatar">${n.icon}</div>

                        <h4>${n.name}</h4>

}

// ===== 演出阶段 =====
function startPerformance() {
    state.messages = [];
    state.cluesFound = [];
    state.score = 0;
    state.turns = 0;
    state.keywordScores = {};
    showPage('page-stage');
    document.getElementById('stage-title').textContent = `${state.currentScript.icon} ${state.currentScript.name}`;
    document.getElementById('scene-text').textContent = state.currentScript.scene;

    // 开场白
    addNarrator(`🎬 演出开始！场景：${state.currentScript.scene}`);
    setTimeout(() => {
        addNarrator(state.currentScript.sceneDesc);
        setTimeout(() => {
            addNPCMsg('🎭 导演', `欢迎来到「${state.currentScript.name}」！你是${state.currentScript.playerRole.name}。输入你的行动或对话来推进剧情。试试询问线索、质问NPC，或描述你的行动。`);
            renderQuickActions();
        }, 800);
    }, 1000);
}

function renderQuickActions() {
    const s = state.currentScript;
    let actions = [];
    if (s.id === 'mystery') {
        actions = ['观察红酒杯', '检查门窗', '询问管家', '询问沈夫人', '询问私人医生'];
    } else if (s.id === 'romance') {
        actions = ['查看花灯上的诗', '寻找蒙面女子', '去茶楼打听消息', '面对禁军统领'];
    } else if (s.id === 'scifi') {
        actions = ['检查特殊货舱', '询问AI星语', '询问副船长', '询问工程师老吴'];
    }
    document.getElementById('quick-actions').innerHTML = actions.map(a =>
        `<button class="qa" onclick="quickAct('${a}')">${a}</button>`
    ).join('');
}

function quickAct(text) {
    document.getElementById('msg-input').value = text;
    sendPlayerMessage();
}

function sendPlayerMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';

    addPlayerMsg(state.currentScript.playerRole.name, text);
    state.turns++;
    processInput(text);
}

function processInput(text) {
    const s = state.currentScript;
    const lower = text.toLowerCase();
    let matched = null;
    let matchedKey = null;

    for (const [key, val] of Object.entries(s.keywords)) {
        const patterns = key.split('|');
        if (patterns.some(p => lower.includes(p.toLowerCase()))) {
            if (!state.keywordScores[key] || state.keywordScores[key] < val.score) {
                matched = val;
                matchedKey = key;
            }
            break;
        }
    }

    // 显示AI思考中
    showTyping();

    setTimeout(() => {
        hideTyping();

        if (matched) {
            if (matched.clue) {
                if (!state.cluesFound.includes(matched.clue)) {
                    state.cluesFound.push(matched.clue);
                    addClueMsg(matched.clue);
                    if (matched.score) state.score += matched.score;
                    state.keywordScores[matchedKey] = matched.score;
                }
                // NPC对线索的反应
                setTimeout(() => {
                    const reply = s.defaultReplies[Math.floor(Math.random() * s.defaultReplies.length)];
                    const npcName = reply.split('：')[0];
                    const npcText = reply.split('：').slice(1).join('：');
                    addNPCMsg(npcName, npcText);
                }, 600);
            } else if (matched.npc) {
                addNPCMsg(matched.npc, matched.reply);
                if (matched.score) state.score += matched.score;
                state.keywordScores[matchedKey] = matched.score;
            } else if (matched.checkAccusation) {
                handleAccusation(text, matched.score);
            }
        } else {
            // 默认回复
            const reply = s.defaultReplies[Math.floor(Math.random() * s.defaultReplies.length)];
            const npcName = reply.split('：')[0];
            const npcText = reply.split('：').slice(1).join('：');
            addNPCMsg(npcName, npcText);
            state.score += 2;
        }

        // 剧情推进提示
        if (state.turns === 3) {
            setTimeout(() => addNarrator('💡 提示：你已经交流了几轮，试试检查线索或深入追问某个NPC。'), 1000);
        }
        if (state.turns === 6 && state.cluesFound.length < 2) {
            setTimeout(() => addNarrator('💡 提示：你发现的线索还不多，试试搜索"红酒""门窗""安眠药"等关键词。'), 1000);
        }

        // 自动更新场景
        if (state.turns === 5) {
            addNarrator('🌙 暴雨加剧，雷声轰鸣。时间在一分一秒流逝……');
        }
    }, 800 + Math.random() * 600);
}

function handleAccusation(text, baseScore) {
    const s = state.currentScript;
    if (s.solution) {
        const correct = text.includes(s.solution) || text.includes(s.npcs.find(n=>n.name.includes(s.solution))?.name?.split('·')[1] || s.solution);
        if (correct) {
            state.score += baseScore;
            addNarrator(`🏆 恭喜！你成功指认真凶——${s.solution}！`);
            setTimeout(() => addNPCMsg('🎭 导演', `精彩！${s.solutionReason}`), 600);
            setTimeout(() => endPerformance(false), 2500);
        } else {
            addNPCMsg('🎭 导演', '指认需要证据支撑。再找找线索吧！试试搜索"红酒""安眠药""门窗"等关键词。');
            state.score += 3;
        }
    } else {
        addNPCMsg('🎭 导演', '这个故事没有标准答案，你的每个选择都是一种结局。继续探索吧！');
        state.score += baseScore;
    }
}

function endPerformance(manual) {
    const s = state.currentScript;
    const finalScore = Math.min(100, state.score + state.turns * 2);
    state.score = finalScore;

    // 计算成就
    if (state.cluesFound.length >= 3) unlockAchievement('线索猎人', '🔍');
    if (state.turns >= 8) unlockAchievement('戏瘾大发', '🎭');
    if (finalScore >= 80) unlockAchievement('影帝/影后', '🏆');
    if (finalScore >= 60 && state.turns <= 6) unlockAchievement('效率之王', '⚡');
    unlockAchievement('初登舞台', '🌟');

    // 保存记录
    state.playHistory.push({
        script: s.name,
        score: finalScore,
        turns: state.turns,
        clues: state.cluesFound.length,
        time: new Date().toLocaleString('zh-CN')
    });
    localStorage.setItem('theater_plays', JSON.stringify(state.playHistory));
    if (finalScore > state.bestScore) {
        state.bestScore = finalScore;
        localStorage.setItem('theater_best', finalScore);
    }

    renderReview(finalScore);
    showPage('page-review');
}

function renderReview(score) {
    const s = state.currentScript;
    const grade = score >= 90 ? 'S' : score >= 80 ? 'A' : score >= 70 ? 'B' : score >= 60 ? 'C' : 'D';
    const medal = score >= 90 ? '🏆' : score >= 80 ? '🥇' : score >= 70 ? '🥈' : '🥉';

    document.getElementById('review-header').innerHTML = `
        <div class="medal">${medal}</div>
        <h2>演出结束！</h2>
        <div class="score">${score}</div>
        <div class="score-label">演技评分 · ${grade}级</div>
    `;

    const creativity = Math.min(100, 30 + state.cluesFound.length * 15);
    const reactivity = Math.min(100, 25 + state.turns * 8);
    const roleplay = Math.min(100, 20 + state.cluesFound.length * 10 + (s.solution ? 20 : 10));
    const plot = Math.min(100, state.score);

    document.getElementById('review-body').innerHTML = `
        <div class="section-title"><span class="bar"></span>评分明细</div>
        <div class="score-breakdown">
            <div class="score-item"><span class="name">创意力</span><div class="bar-bg"><div class="bar-fill" style="width:${creativity}%"></div></div><span class="val">${creativity}</span></div>
            <div class="score-item"><span class="name">反应力</span><div class="bar-bg"><div class="bar-fill" style="width:${reactivity}%"></div></div><span class="val">${reactivity}</span></div>
            <div class="score-item"><span class="name">角色贴合</span><div class="bar-bg"><div class="bar-fill" style="width:${roleplay}%"></div></div><span class="val">${roleplay}</span></div>
            <div class="score-item"><span class="name">剧情推进</span><div class="bar-bg"><div class="bar-fill" style="width:${plot}%"></div></div><span class="val">${plot}</span></div>
        </div>
        <div class="section-title"><span class="bar"></span>本场成就</div>
        <div class="achievements">
            ${state.achievements.map(a=>`<div class="achievement"><div class="a-icon">${a.icon}</div><div class="a-name">${a.name}</div></div>`).join('')}
        </div>
        <div class="section-title"><span class="bar"></span>名场面</div>
        <div class="highlight-list">
            ${s.highlights.map((h,i)=>`<div class="highlight-item"><div class="h-label">名场面 ${i+1}</div><div class="h-text">${h}</div></div>`).join('')}
            ${state.cluesFound.length > 0 ? `<div class="highlight-item"><div class="h-label">关键发现</div><div class="h-text">你发现了 ${state.cluesFound.length} 条重要线索</div></div>` : ''}
        </div>
        <div class="section-title"><span class="bar"></span>剧本回顾</div>
        <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;font-size:13px;color:var(--text-dim);max-height:200px;overflow-y:auto;">
            ${state.messages.map(m=>`<div style="margin-bottom:6px;">${m}</div>`).join('')}
        </div>
        <div style="margin-top:16px;font-size:13px;color:var(--text-dim);">
            📊 本场数据：${state.turns}轮对话 · ${state.cluesFound.length}条线索 · ${state.playHistory.length}场总演出
        </div>
    `;

    state.achievements = [];
}

function unlockAchievement(name, icon) {
    if (!state.achievements.find(a=>a.name===name)) {
        state.achievements.push({name, icon});
    }
    if (!state.unlockedAchievements.find(a=>a.name===name)) {
        state.unlockedAchievements.push({name, icon});
        localStorage.setItem('theater_achievements', JSON.stringify(state.unlockedAchievements));
    }
}

// ===== 消息渲染 =====
function addPlayerMsg(sender, text) {
    state.messages.push(`【${sender}】${text}`);
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.className = 'msg player';
    el.innerHTML = `<div class="avatar">${state.currentScript.playerRole.icon}</div><div class="bubble"><div class="sender">${sender}</div><div class="text">${escapeHtml(text)}</div></div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function addNPCMsg(sender, text) {
    state.messages.push(`【${sender}】${text}`);
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.className = 'msg npc';
    const icon = sender.includes('管家') ? '🧓' : sender.includes('夫人') ? '💃' : sender.includes('医生') ? '👨‍⚕️' : sender.includes('星语') || sender.includes('AI') ? '🤖' : sender.includes('苏晴') ? '👩‍✈️' : sender.includes('老吴') ? '🔧' : sender.includes('赵婶') ? '👩‍🍳' : sender.includes('阿漓') ? '🌸' : sender.includes('赵恒') ? '⚔️' : sender.includes('导演') ? '🎭' : '💬';
    el.innerHTML = `<div class="avatar">${icon}</div><div class="bubble"><div class="sender">${sender}</div><div class="text">${escapeHtml(text)}</div></div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function addNarrator(text) {
    state.messages.push(`【旁白】${text}`);
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.className = 'msg narrator';
    el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function addClueMsg(text) {
    state.messages.push(`【线索】${text}`);
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.className = 'msg clue';
    el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function showTyping() {
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.id = 'typing-indicator';
    el.className = 'typing-indicator';
    el.innerHTML = `<div class="avatar">💬</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
}

// ===== 导航 =====
function showPage(id) {
    ['page-home','page-role','page-stage','page-review'].forEach(p => {
        document.getElementById(p).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
    document.getElementById('bottom-nav').classList.toggle('hidden', id === 'page-stage');
}

function goHome() {
    updateStats();
    showPage('page-home');
}

function goCommunity() {
    const el = document.getElementById('community-preview');
    el.innerHTML = COMMUNITY.map(p => `
        <div class="play-card">
            <div class="ph"><span class="ptitle">${p.title}</span><span class="pscore">⭐${p.score}</span></div>
            <div class="pexcerpt">${p.excerpt}</div>
            <div class="pmeta">📍${p.meta.type} · ⏱️${p.meta.time} · 👤${p.meta.author}</div>
        </div>
    `).join('');
    showPage('page-home');
    document.getElementById('page-home').scrollIntoView();
    el.scrollIntoView({behavior:'smooth'});
}

// ===== 工具 =====
function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 输入框自适应高度
document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(120, this.scrollHeight) + 'px';
});
// 回车发送
document.getElementById('msg-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPlayerMessage();
    }
});

// 启动
init();
</script>
</body>
</html>
