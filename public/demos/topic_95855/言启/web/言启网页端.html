<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言启 · 语言表达训练</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div class="top-notice-bar" id="topNoticeBar">
      <div class="top-notice-track">
        <span class="top-notice-text">温馨提示：本项目为参赛演示版本，内置AI接口密钥仅作评审测试使用，赛后将立即销毁，请勿外传</span>
        <span class="top-notice-text" aria-hidden="true">温馨提示：本项目为参赛演示版本，内置AI接口密钥仅作评审测试使用，赛后将立即销毁，请勿外传</span>
      </div>
    </div>
    <div class="ambient-bg">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
      <div class="noise"></div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
      <div class="sidebar-panel">
        <div class="sidebar-header">
          <div class="user-profile-mini">
            <div class="avatar-ring">
              <div class="avatar">
                <span>言</span>
              </div>
            </div>
            <div class="user-info">
              <div class="user-name">表达学习者</div>
              <div class="user-title" id="userTitle">初入言途</div>
            </div>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-link active" data-page="home" onclick="navigateTo('home')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>首页</span>
          </button>
          <button class="nav-link" data-page="training" onclick="navigateTo('training')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>训练中心</span>
          </button>
          <button class="nav-link" data-page="growth" onclick="navigateTo('growth')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
            <span>成长轨迹</span>
          </button>
          <button class="nav-link" data-page="profile" onclick="navigateTo('profile')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>个人中心</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="streak-display">
            <div class="streak-flame">🔥</div>
            <div class="streak-details">
              <span class="streak-number" id="streakNumber">0</span>
              <span class="streak-label">连续训练天数</span>
            </div>
          </div>
          <button class="help-btn-sidebar" onclick="showHelp()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>使用帮助</span>
          </button>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-bar" id="topBar">
        <div class="top-bar-left">
          <button class="icon-btn" id="menuBtn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="brand">
            <span class="brand-mark">言</span>
            <span class="brand-name">启</span>
          </div>
        </div>
        <div class="top-bar-right">
          <button class="icon-btn theme-btn-top" onclick="toggleTheme()" title="切换主题">
            <span id="themeIcon">🌙</span>
          </button>
          <button class="icon-btn help-btn" onclick="showHelp()" title="使用帮助">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </button>
          <div class="level-pill" id="levelPill">
            <span class="level-icon">✦</span>
            <span class="level-text" id="levelText">Lv.1</span>
          </div>
        </div>
      </header>

      <main class="page-container" id="pageContainer"></main>

      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="home" onclick="navigateTo('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>首页</span>
        </button>
        <button class="nav-item" data-page="training" onclick="navigateTo('training')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          <span>训练</span>
        </button>
        <button class="nav-item nav-item--center" onclick="navigateTo('training')">
          <div class="center-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </div>
        </button>
        <button class="nav-item" data-page="growth" onclick="navigateTo('growth')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
          <span>成长</span>
        </button>
        <button class="nav-item" data-page="profile" onclick="navigateTo('profile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <div id="toastRoot" class="toast-root"></div>
    <div id="modalRoot" class="modal-root"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
