<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>味游地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
            height: 100vh;
        }
        .app { height: 100vh; display: flex; flex-direction: column; }
        .page {
            flex: 1;
            overflow-y: auto;
            display: none;
            -webkit-overflow-scrolling: touch;
        }
        .page.active { display: block; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        .header .subtitle { font-size: 12px; opacity: 0.85; font-weight: 400; margin-top: 2px; }

        /* Map */
        #map { height: calc(100vh - 100px); width: 100%; }
        .map-controls {
            position: absolute;
            bottom: 70px;
            right: 16px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .fab {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Cards */
        .card-list { padding: 12px; }
        .spot-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .spot-card:active { transform: scale(0.98); }
        .spot-img {
            width: 70px; height: 70px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
        }
        .spot-info { flex: 1; }
        .spot-name { font-size: 16px; font-weight: 600; color: #333; }
        .spot-meta {
            font-size: 12px; color: #888;
            margin-top: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .spot-tags {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .tag {
            font-size: 11px; padding: 2px 8px;
            border-radius: 10px; background: #f0f2ff;
            color: #667eea;
        }
        .spot-rating {
            color: #ff9500; font-size: 13px; font-weight: 600;
        }

        /* Detail Page */
        .detail-img {
            width: 100%; height: 200px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; color: white;
            position: relative;
        }
        .detail-img .back-btn {
            position: absolute; top: 12px; left: 12px;
            width: 36px; height: 36px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px; border: none;
            cursor: pointer;
        }
        .detail-content { padding: 16px; }
        .detail-name { font-size: 22px; font-weight: 700; color: #333; }
        .detail-meta {
            display: flex; gap: 12px; margin-top: 8px;
            font-size: 13px; color: #666;
        }
        .detail-desc {
            margin-top: 12px;
            font-size: 14px; line-height: 1.7; color: #555;
        }
        .action-btns {
            display: flex; gap: 12px; margin-top: 16px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
        }
        .action-btn.active { color: #ff4757; }

        /* Comments */
        .comments-section {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px;
        }
        .comments-title {
            font-size: 16px; font-weight: 600;
            margin-bottom: 12px;
        }
        .comment-item {
            display: flex; gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600;
            flex-shrink: 0;
        }
        .comment-body { flex: 1; }
        .comment-author { font-size: 14px; font-weight: 600; color: #333; }
        .comment-text { font-size: 13px; color: #555; margin-top: 4px; line-height: 1.5; }
        .comment-time { font-size: 11px; color: #aaa; margin-top: 4px; }
        .comment-input-area {
            display: flex; gap: 10px;
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        .comment-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .comment-input:focus { border-color: #667eea; }
        .send-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Add Spot Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 14px; color: #555; margin-bottom: 6px; display: block; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #667eea; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .modal-btns {
            display: flex; gap: 12px; margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .modal-btn.cancel { background: #f0f0f0; color: #555; }
        .modal-btn.submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: white;
            border-top: 1px solid #eee;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 0;
            cursor: pointer;
            color: #999;
            font-size: 11px;
        }
        .tab-item.active { color: #667eea; }
        .tab-icon { font-size: 22px; }

        /* Search Bar */
        .search-bar {
            padding: 10px 16px;
            background: white;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background: #f5f5f5;
        }
        .search-input:focus { border-color: #667eea; background: white; }

        /* Profile */
        .profile-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .profile-avatar {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .profile-name { font-size: 18px; font-weight: 600; }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-label { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .profile-menu {
            padding: 12px;
        }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
        }
        .menu-icon { font-size: 20px; width: 28px; text-align: center; }
        .menu-arrow { margin-left: auto; color: #ccc; }

        /* Category Filter */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 0 16px 10px;
            background: white;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            background: white;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            display: none;
        }
        .toast.show { display: block; }

        /* Custom Popup */
        .custom-popup {
            font-family: inherit;
        }
        .popup-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .popup-desc { font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Map Page -->
        <div class="page active" id="page-map">
            <div class="header">
                味游地图
                <div class="subtitle">探索舌尖上的中国</div>
            </div>
            <div id="map"></div>
            <div class="map-controls">
                <button class="fab" onclick="showAddModal()">+</button>
            </div>
        </div>

        <!-- List Page -->
        <div class="page" id="page-list">
            <div class="header">发现美食</div>
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="搜索美食、景点..." id="searchInput" oninput="doSearch()">
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="setFilter('all')">全部</button>
                <button class="filter-btn" onclick="setFilter('food')">美食</button>
                <button class="filter-btn" onclick="setFilter('scenic')">景点</button>
                <button class="filter-btn" onclick="setFilter('nearby')">附近</button>
            </div>
            <div class="card-list" id="spotList"></div>
        </div>

        <!-- Profile Page -->
        <div class="page" id="page-profile">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <div class="profile-name">美食探索家</div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-fav">0</div>
                        <div class="stat-label">收藏</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-check">0</div>
                        <div class="stat-label">打卡</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-spot">0</div>
                        <div class="stat-label">贡献</div>
                    </div>
                </div>
            </div>
            <div class="profile-menu">
                <div class="menu-item" onclick="showMyFavorites()">
                    <span class="menu-icon">⭐</span>
                    <span>我的收藏</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="showMyChecks()">
                    <span class="menu-icon">📍</span>
                    <span>打卡足迹</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="showMySpots()">
                    <span class="menu-icon">📝</span>
                    <span>我的贡献</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item">
                    <span class="menu-icon">⚙️</span>
                    <span>设置</span>
                    <span class="menu-arrow">›</span>
                </div>
            </div>
        </div>

        <!-- Detail Page -->
        <div class="page" id="page-detail">
            <div class="detail-img" id="detailImg">
                <button class="back-btn" onclick="goBack()">‹</button>
                <span id="detailEmoji">🍜</span>
            </div>
            <div class="detail-content">
                <div class="detail-name" id="detailName">--</div>
                <div class="detail-meta">
                    <span id="detailCategory">--</span>
                    <span class="spot-rating" id="detailRating">⭐ --</span>
                    <span id="detailDistance">--</span>
                </div>
                <div class="detail-desc" id="detailDesc">--</div>
                <div class="action-btns">
                    <button class="action-btn" id="favBtn" onclick="toggleFavorite()">
                        <span>⭐</span> <span>收藏</span>
                    </button>
                    <button class="action-btn primary" id="checkBtn" onclick="toggleCheckin()">
                        <span>📍</span> <span>打卡</span>
                    </button>
                </div>
                <div class="comments-section">
                    <div class="comments-title">💬 评论 (<span id="commentCount">0</span>)</div>
                    <div id="commentList"></div>
                    <div class="comment-input-area">
                        <input type="text" class="comment-input" placeholder="分享你的体验..." id="commentInput">
                        <button class="send-btn" onclick="addComment()">发送</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sub List Page (fav/check/my) -->
        <div class="page" id="page-sublist">
            <div class="header">
                <button class="back-btn" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.2);" onclick="goBack()">‹</button>
                <span id="sublistTitle">--</span>
            </div>
            <div class="card-list" id="subList"></div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('map')">
                <span class="tab-icon">🗺️</span>
                <span>地图</span>
            </div>
            <div class="tab-item" onclick="switchTab('list')">
                <span class="tab-icon">📋</span>
                <span>发现</span>
            </div>
            <div class="tab-item" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>
                <span>我的</span>
            </div>
        </div>
    </div>

    <!-- Add Spot Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-title">📍 添加新地点</div>
            <div class="form-group">
                <label class="form-label">地点名称</label>
                <input type="text" class="form-input" id="addName" placeholder="例如：老王烧烤">
            </div>
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="addType">
                    <option value="food">美食</option>
                    <option value="scenic">景点</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">描述</label>
                <textarea class="form-textarea" id="addDesc" placeholder="简单介绍一下这个地方..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">评分 (1-5)</label>
                <input type="number" class="form-input" id="addRating" min="1" max="5" value="4.5" step="0.1">
            </div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="hideAddModal()">取消</button>
                <button class="modal-btn submit" onclick="submitSpot()">添加</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ================== Data ==================
        const EMOJIS = { food: ['🍜','🥟','🍢','🍗','🍰','🍺','🍣','🥘'], scenic: ['🏯','🌸','🏔️','🌊','🌳','⛩️','🌉','🏛️'] };
        const defaultSpots = [
            { id: 1, name: '老码头担担面', type: 'food', lat: 30.6586, lng: 104.0668, rating: 4.9, emoji: '🍜', desc: '做了30年的老字号，红油飘香，面条劲道。本地人从小吃到大，比网红店正宗百倍。', comments: [
                { author: '小王同学', text: '正宗！比网红店好吃多了，老板做了30年', time: '2天前' },
                { author: '吃货阿明', text: '推荐加红油，微辣刚好，人均15块', time: '5天前' },
                { author: '成都土著', text: '从小吃到大，希望不要被炒成网红店😂', time: '1周前' }
            ]},
            { id: 2, name: '宽窄巷子', type: 'scenic', lat: 30.6698, lng: 104.0556, rating: 4.6, emoji: '🏯', desc: '成都遗留下来的较成规模的清朝古街道，与大慈寺、文殊院一起并称为成都三大历史文化名城保护街区。', comments: [
                { author: '旅行者小李', text: '晚上去特别好看，灯笼亮起来很有氛围', time: '3天前' },
                { author: '摄影爱好者', text: '适合拍照，但是小吃偏贵，建议只逛不买', time: '1周前' }
            ]},
            { id: 3, name: '钟水饺总店', type: 'food', lat: 30.6721, lng: 104.0612, rating: 4.8, emoji: '🥟', desc: '创始于1893年，四川成都著名小吃。皮薄馅嫩，淋上特制红油，麻辣鲜香。', comments: [
                { author: '美食家', text: '红油水饺是一绝，甜辣口味很独特', time: '1天前' }
            ]},
            { id: 4, name: '锦里古街', type: 'scenic', lat: 30.6456, lng: 104.0493, rating: 4.5, emoji: '⛩️', desc: '传说中锦里曾是西蜀历史上最古老、最具有商业气息的街道之一，早在秦汉、三国时期便闻名全国。', comments: []},
            { id: 5, name: '龙抄手', type: 'food', lat: 30.6555, lng: 104.0712, rating: 4.7, emoji: '🍢', desc: '成都名小吃，抄手皮薄馅嫩，原汤鲜美。各种口味可选，红油、酸辣、清汤各有千秋。', comments: [
                { author: '游客小张', text: '第一次吃抄手，皮薄得透明，太好吃了！', time: '4天前' }
            ]},
            { id: 6, name: '武侯祠', type: 'scenic', lat: 30.6423, lng: 104.0471, rating: 4.8, emoji: '🏛️', desc: '中国唯一的君臣合祀祠庙，纪念诸葛亮、刘备及蜀汉英雄。红墙竹影是网红打卡点。', comments: [
                { author: '历史迷', text: '三国迷必去，里面有很多历史文物', time: '2周前' },
                { author: '拍照达人', text: '红墙拍照绝美，建议早上去人少', time: '3周前' }
            ]}
        ];

        let spots = [];
        let favorites = new Set();
        let checkins = new Set();
        let mySpots = new Set();
        let currentSpotId = null;
        let map = null;
        let markers = [];
        let currentFilter = 'all';
        let historyStack = [];

        // ================== Init ==================
        function initData() {
            const saved = localStorage.getItem('wy_spots');
            if (saved) {
                spots = JSON.parse(saved);
            } else {
                spots = JSON.parse(JSON.stringify(defaultSpots));
                saveSpots();
            }
            const savedFav = localStorage.getItem('wy_fav');
            if (savedFav) favorites = new Set(JSON.parse(savedFav));
            const savedCheck = localStorage.getItem('wy_check');
            if (savedCheck) checkins = new Set(JSON.parse(savedCheck));
            const savedMy = localStorage.getItem('wy_my');
            if (savedMy) mySpots = new Set(JSON.parse(savedMy));
        }

        function saveSpots() {
            localStorage.setItem('wy_spots', JSON.stringify(spots));
        }
        function saveFav() { localStorage.setItem('wy_fav', JSON.stringify([...favorites])); }
        function saveCheck() { localStorage.setItem('wy_check', JSON.stringify([...checkins])); }
        function saveMy() { localStorage.setItem('wy_my', JSON.stringify([...mySpots])); }

        // ================== Map ==================
        function initMap() {
            map = L.map('map').setView([30.66, 104.06], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            renderMarkers();
        }

        function renderMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            spots.forEach(spot => {
                const color = spot.type === 'food' ? '#ff6b6b' : '#4ecdc4';
                const marker = L.circleMarker([spot.lat, spot.lng], {
                    radius: 10,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                marker.bindPopup(`
                    <div class="custom-popup">
                        <div class="popup-title">${spot.emoji} ${spot.name}</div>
                        <div class="popup-desc">⭐ ${spot.rating} · ${spot.type === 'food' ? '美食' : '景点'}</div>
                    </div>
                `);
                marker.on('click', () => { showDetail(spot.id); });
                markers.push(marker);
            });
        }

        // ================== Navigation ==================
        function switchTab(tab) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + tab).classList.add('active');
            if (tab === 'list') renderList();
            if (tab === 'profile') updateProfileStats();
        }

        function showPage(pageId) {
            const current = document.querySelector('.page.active');
            if (current) historyStack.push(current.id);
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function goBack() {
            const prev = historyStack.pop() || 'page-list';
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(prev).classList.add('active');
        }

        // ================== List ==================
        function renderList() {
            const list = document.getElementById('spotList');
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            let filtered = spots;
            if (currentFilter !== 'all') {
                filtered = spots.filter(s => s.type === currentFilter || (currentFilter === 'nearby'));
            }
            if (search) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(search));
            }
            list.innerHTML = filtered.map(spot => `
                <div class="spot-card" onclick="showDetail(${spot.id})">
                    <div class="spot-img">${spot.emoji}</div>
                    <div class="spot-info">
                        <div class="spot-name">${spot.name}</div>
                        <div class="spot-meta">
                            <span>${spot.type === 'food' ? '美食' : '景点'}</span>
                            <span class="spot-rating">⭐ ${spot.rating}</span>
                            <span>💬 ${spot.comments.length}</span>
                        </div>
                        <div class="spot-tags">
                            <span class="tag">${spot.type === 'food' ? '地道美食' : '必游景点'}</span>
                            ${favorites.has(spot.id) ? '<span class="tag">已收藏</span>' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderList();
        }

        function doSearch() { renderList(); }

        // ================== Detail ==================
        function showDetail(id) {
            currentSpotId = id;
            const spot = spots.find(s => s.id === id);
            if (!spot) return;
            document.getElementById('detailEmoji').textContent = spot.emoji;
            document.getElementById('detailName').textContent = spot.name;
            document.getElementById('detailCategory').textContent = spot.type === 'food' ? '🍴 美食' : '📸 景点';
            document.getElementById('detailRating').textContent = '⭐ ' + spot.rating;
            document.getElementById('detailDesc').textContent = spot.desc;
            document.getElementById('detailImg').style.background = spot.type === 'food'
                ? 'linear-gradient(135deg, #ffecd2, #fcb69f)'
                : 'linear-gradient(135deg, #a8edea, #fed6e3)';
            updateActionBtns();
            renderComments();
            showPage('page-detail');
        }

        function updateActionBtns() {
            const favBtn = document.getElementById('favBtn');
            const checkBtn = document.getElementById('checkBtn');
            favBtn.classList.toggle('active', favorites.has(currentSpotId));
            favBtn.innerHTML = favorites.has(currentSpotId) ? '<span>⭐</span> <span>已收藏</span>' : '<span>⭐</span> <span>收藏</span>';
            checkBtn.innerHTML = checkins.has(currentSpotId) ? '<span>✅</span> <span>已打卡</span>' : '<span>📍</span> <span>打卡</span>';
        }

        function toggleFavorite() {
            if (favorites.has(currentSpotId)) {
                favorites.delete(currentSpotId);
                showToast('已取消收藏');
            } else {
                favorites.add(currentSpotId);
                showToast('收藏成功！');
            }
            saveFav();
            updateActionBtns();
        }

        function toggleCheckin() {
            if (checkins.has(currentSpotId)) {
                checkins.delete(currentSpotId);
                showToast('取消打卡');
            } else {
                checkins.add(currentSpotId);
                showToast('打卡成功！');
            }
            saveCheck();
            updateActionBtns();
            updateProfileStats();
        }

        // ================== Comments ==================
        function renderComments() {
            const spot = spots.find(s => s.id === currentSpotId);
            document.getElementById('commentCount').textContent = spot.comments.length;
            const list = document.getElementById('commentList');
            if (spot.comments.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;font-size:13px;">暂无评论，快来抢沙发吧~</div>';
                return;
            }
            list.innerHTML = spot.comments.map(c => `
                <div class="comment-item">
                    <div class="comment-avatar">${c.author[0]}</div>
                    <div class="comment-body">
                        <div class="comment-author">${c.author}</div>
                        <div class="comment-text">${c.text}</div>
                        <div class="comment-time">${c.time}</div>
                    </div>
                </div>
            `).join('');
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;
            const spot = spots.find(s => s.id === currentSpotId);
            spot.comments.push({
                author: '我',
                text: text,
                time: '刚刚'
            });
            saveSpots();
            input.value = '';
            renderComments();
            showToast('评论发表成功！');
        }

        // ================== Add Spot ==================
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function hideAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addName').value = '';
            document.getElementById('addDesc').value = '';
        }

        function submitSpot() {
            const name = document.getElementById('addName').value.trim();
            const type = document.getElementById('addType').value;
            const desc = document.getElementById('addDesc').value.trim();
            const rating = parseFloat(document.getElementById('addRating').value) || 4;
            if (!name) { showToast('请输入地点名称'); return; }

            const center = map.getCenter();
            const newSpot = {
                id: Date.now(),
                name, type, desc, rating,
                lat: center.lat + (Math.random() - 0.5) * 0.01,
                lng: center.lng + (Math.random() - 0.5) * 0.01,
                emoji: EMOJIS[type][Math.floor(Math.random() * EMOJIS[type].length)],
                comments: []
            };
            spots.push(newSpot);
            mySpots.add(newSpot.id);
            saveSpots();
            saveMy();
            renderMarkers();
            hideAddModal();
            showToast('添加成功！');
            updateProfileStats();
        }

        // ================== Profile ==================
        function updateProfileStats() {
            document.getElementById('stat-fav').textContent = favorites.size;
            document.getElementById('stat-check').textContent = checkins.size;
            document.getElementById('stat-spot').textContent = mySpots.size;
        }

        function showMyFavorites() {
            document.getElementById('sublistTitle').textContent = '⭐ 我的收藏';
            renderSubList([...favorites]);
            showPage('page-sublist');
        }

        function showMyChecks() {
            document.getElementById('sublistTitle').textContent = '📍 打卡足迹';
            renderSubList([...checkins]);
            showPage('page-sublist');
        }

        function showMySpots() {
            document.getElementById('sublistTitle').textContent = '📝 我的贡献';
            renderSubList([...mySpots]);
            showPage('page-sublist');
        }

        function renderSubList(ids) {
            const list = document.getElementById('subList');
            const filtered = spots.filter(s => ids.includes(s.id));
            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#999;padding:40px;font-size:14px;">这里空空如也~</div>';
                return;
            }
            list.innerHTML = filtered.map(spot => `
                <div class="spot-card" onclick="showDetail(${spot.id})">
                    <div class="spot-img">${spot.emoji}</div>
                    <div class="spot-info">
                        <div class="spot-name">${spot.name}</div>
                        <div class="spot-meta">
                            <span>${spot.type === 'food' ? '美食' : '景点'}</span>
                            <span class="spot-rating">⭐ ${spot.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ================== Utils ==================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ================== Start ==================
        window.onload = function() {
            initData();
            initMap();
            renderList();
            updateProfileStats();
        };
    </script>
</body>
</html>
