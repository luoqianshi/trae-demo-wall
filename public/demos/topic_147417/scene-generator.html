<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵犀智家 — 跨品牌智能家居场景生成器</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-light: #A29BFE;
            --primary-dark: #5B4CDB;
            --bg-white: #FFFFFF;
            --bg-gray: #F8F9FA;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --text-muted: #B2BEC3;
            --border-color: #E8ECF0;
            --shadow-sm: 0 2px 8px rgba(108, 92, 231, 0.08);
            --shadow-md: 0 4px 16px rgba(108, 92, 231, 0.12);
            --shadow-lg: 0 8px 24px rgba(108, 92, 231, 0.16);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #F8F9FA 0%, #EEF2FF 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #8E44AD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .input-section {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 60px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-gray);
            transition: var(--transition);
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper .icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-muted);
        }

        .templates {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .template-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-gray);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .template-btn:hover {
            background: rgba(108, 92, 231, 0.08);
            border-color: var(--primary-light);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .template-btn:active {
            transform: translateY(0);
        }

        .flowchart-section {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flowchart {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
            z-index: 1;
        }

        .node-box {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: white;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            width: 100%;
            max-width: 180px;
        }

        .node-box:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .node-trigger .node-box {
            background: linear-gradient(135deg, #0984E3 0%, #0652DD 100%);
        }

        .node-condition .node-box {
            background: linear-gradient(135deg, #FD79A8 0%, #E84393 100%);
        }

        .node-action .node-box {
            background: linear-gradient(135deg, #00B894 0%, #00CEC9 100%);
        }

        .node-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .arrow {
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, var(--text-muted) 0%, var(--primary-light) 100%);
            position: relative;
            margin: 0 -10px;
            z-index: 0;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 10px solid var(--primary-light);
        }

        .rule-card-section {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
        }

        .rule-card-section h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rule-card-section h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .rule-card {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.05) 0%, rgba(142, 68, 173, 0.05) 100%);
            border: 1px solid rgba(108, 92, 231, 0.1);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .rule-card .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 14px;
        }

        .rule-card .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .rule-content {
            display: grid;
            gap: 16px;
        }

        .rule-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .rule-item .icon-box {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .rule-item.trigger .icon-box {
            background: rgba(9, 132, 227, 0.1);
            color: #0984E3;
        }

        .rule-item.condition .icon-box {
            background: rgba(253, 121, 168, 0.1);
            color: #FD79A8;
        }

        .rule-item.action .icon-box {
            background: rgba(0, 184, 148, 0.1);
            color: #00B894;
        }

        .rule-item .icon-box .icon {
            font-size: 18px;
        }

        .rule-item .text-box {
            flex: 1;
        }

        .rule-item .text-box .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .rule-item .text-box .value {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            header h1 {
                font-size: 22px;
            }

            header p {
                font-size: 14px;
            }

            .input-section,
            .flowchart-section,
            .rule-card-section {
                padding: 20px;
            }

            .flowchart {
                flex-direction: column;
                gap: 24px;
            }

            .arrow {
                width: 4px;
                height: 30px;
                margin: 0;
                background: linear-gradient(180deg, var(--text-muted) 0%, var(--primary-light) 100%);
            }

            .arrow::after {
                right: 50%;
                top: auto;
                bottom: -8px;
                transform: translateX(50%);
                border-top: 10px solid var(--primary-light);
                border-bottom: none;
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
            }

            .node {
                min-width: auto;
            }

            .node-box {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>灵犀智家 — 跨品牌智能家居场景生成器</h1>
            <p>说话就能控制全屋智能</p>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <span class="icon">🎤</span>
                <input type="text" id="inputText" placeholder="试试说：有人移动时打开客厅灯" />
            </div>
            <div class="templates">
                <button class="template-btn" data-template="回家模式">🏠 回家模式</button>
                <button class="template-btn" data-template="离家模式">🚪 离家模式</button>
                <button class="template-btn" data-template="观影模式">🎬 观影模式</button>
                <button class="template-btn" data-template="夜间起夜">🌙 夜间起夜</button>
            </div>
        </div>

        <div class="flowchart-section">
            <div class="flowchart" id="flowchart">
                <div class="node node-trigger">
                    <div class="node-box">等待输入</div>
                    <div class="node-label">触发</div>
                </div>
            </div>
        </div>

        <div class="rule-card-section">
            <h3>已生成规则卡片</h3>
            <div class="rule-card" id="ruleCard">
                <div class="empty-state">
                    <div class="icon">✨</div>
                    <p>输入指令或选择模板，生成您的智能场景规则</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>已对接涂鸦 OpenAPI，支持跨平台规则导出至 Home Assistant</p>
        </footer>
    </div>

    <script>
        const templates = {
            '回家模式': {
                trigger: '门锁｜检测到开门',
                condition: '仅 18:00-22:00',
                action: '客厅灯｜开启 + 空调｜开启'
            },
            '离家模式': {
                trigger: '门锁｜检测到关门',
                condition: '无限制',
                action: '全屋灯｜关闭 + 空调｜关闭 + 窗帘｜关闭'
            },
            '观影模式': {
                trigger: '语音助手｜收到指令',
                condition: '仅 19:00-23:00',
                action: '客厅灯｜调暗 + 窗帘｜关闭 + 投影｜开启'
            },
            '夜间起夜': {
                trigger: '人体传感器｜检测到有人移动',
                condition: '仅 22:00-06:00',
                action: '走廊灯｜低亮开启'
            }
        };

        const keywords = {
            trigger: {
                '移动|有人': '人体传感器｜检测到有人移动',
                '开门|门锁': '门锁｜检测到开门',
                '关门': '门锁｜检测到关门',
                '语音|说话': '语音助手｜收到指令',
                '温度|冷|热': '温度传感器｜检测到温度变化',
                '湿度': '湿度传感器｜检测到湿度变化',
                '光线|亮度|暗': '光线传感器｜检测到光线变化',
                '烟|烟雾': '烟雾报警器｜检测到烟雾',
                '水|漏水': '漏水传感器｜检测到漏水'
            },
            condition: {
                '夜|晚上|22|06': '仅 22:00-06:00',
                '白天|上午|下午': '仅 06:00-18:00',
                '傍晚|晚上': '仅 18:00-22:00',
                '无人|没人': '检测到房间无人',
                '有人|有人在': '检测到房间有人',
                '工作日': '仅工作日',
                '周末': '仅周末'
            },
            action: {
                '灯|开灯|关灯|亮|暗': '客厅灯｜开启',
                '空调|冷气|暖气': '空调｜开启',
                '窗帘|拉帘': '窗帘｜关闭',
                '投影|电视': '投影｜开启',
                '音乐|音响': '音响｜播放音乐',
                '扫地|清洁': '扫地机器人｜开始清洁',
                '加湿器': '加湿器｜开启',
                '净化器': '空气净化器｜开启'
            }
        };

        function parseInput(text) {
            let result = {
                trigger: '触发条件',
                condition: '无限制',
                action: '执行动作'
            };

            for (const [pattern, value] of Object.entries(keywords.trigger)) {
                if (new RegExp(pattern).test(text)) {
                    result.trigger = value;
                    break;
                }
            }

            for (const [pattern, value] of Object.entries(keywords.condition)) {
                if (new RegExp(pattern).test(text)) {
                    result.condition = value;
                    break;
                }
            }

            for (const [pattern, value] of Object.entries(keywords.action)) {
                if (new RegExp(pattern).test(text)) {
                    result.action = value;
                    break;
                }
            }

            if (result.trigger === '触发条件') {
                result.trigger = '智能设备｜触发事件';
            }
            if (result.action === '执行动作') {
                result.action = '智能设备｜执行指令';
            }

            return result;
        }

        function renderFlowchart(data) {
            const flowchart = document.getElementById('flowchart');
            
            let html = `
                <div class="node node-trigger">
                    <div class="node-box">${data.trigger}</div>
                    <div class="node-label">触发</div>
                </div>
                <div class="arrow"></div>
                <div class="node node-condition">
                    <div class="node-box">${data.condition}</div>
                    <div class="node-label">条件</div>
                </div>
                <div class="arrow"></div>
                <div class="node node-action">
                    <div class="node-box">${data.action}</div>
                    <div class="node-label">动作</div>
                </div>
            `;

            flowchart.innerHTML = html;
        }

        function renderRuleCard(data) {
            const ruleCard = document.getElementById('ruleCard');

            let html = `
                <div class="rule-content">
                    <div class="rule-item trigger">
                        <div class="icon-box">
                            <span class="icon">🔌</span>
                        </div>
                        <div class="text-box">
                            <div class="label">触发条件</div>
                            <div class="value">${data.trigger}</div>
                        </div>
                    </div>
                    <div class="rule-item condition">
                        <div class="icon-box">
                            <span class="icon">⏱️</span>
                        </div>
                        <div class="text-box">
                            <div class="label">生效限制</div>
                            <div class="value">${data.condition}</div>
                        </div>
                    </div>
                    <div class="rule-item action">
                        <div class="icon-box">
                            <span class="icon">⚡</span>
                        </div>
                        <div class="text-box">
                            <div class="label">执行动作</div>
                            <div class="value">${data.action}</div>
                        </div>
                    </div>
                </div>
            `;

            ruleCard.innerHTML = html;
        }

        function handleInput(text) {
            if (!text.trim()) return;
            
            let data;
            if (templates[text.trim()]) {
                data = templates[text.trim()];
            } else {
                data = parseInput(text);
            }
            
            renderFlowchart(data);
            renderRuleCard(data);
        }

        const inputText = document.getElementById('inputText');
        inputText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleInput(inputText.value);
            }
        });

        const templateBtns = document.querySelectorAll('.template-btn');
        templateBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const template = btn.dataset.template;
                inputText.value = template;
                handleInput(template);
            });
        });
    </script>
</body>
</html>
