<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ha-bg: #F7F8FA;
      --ha-card: #FFFFFF;
      --ha-text: #1F1F1F;
      --ha-secondary: #6B7280;
      --ha-border: #E8EAED;
      --ha-blue: #03A9F4;
      --ha-blue-soft: rgba(3, 169, 244, 0.10);
      --ha-green: #4CAF50;
      --ha-green-soft: rgba(76, 175, 80, 0.10);
      --ha-amber: #FF9800;
      --ha-amber-soft: rgba(255, 152, 0, 0.10);
      --ha-red: #F44336;
      --ha-red-soft: rgba(244, 67, 54, 0.10);
      --ha-purple: #7E57C2;
      --ha-purple-soft: rgba(126, 87, 194, 0.10);
      --ha-radius: 8px;
    }

    body {
      font-family: 'Open Sans', 'Noto Sans SC', sans-serif;
      background: var(--ha-bg);
      color: var(--ha-text);
      line-height: 1.5;
      padding: 16px;
    }

    .ha-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .ha-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .ha-title i { color: var(--ha-blue); }

    .ha-time { font-size: 13px; color: var(--ha-secondary); font-weight: 500; }

    .ha-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .ha-card {
      background: var(--ha-card);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 200ms ease, transform 200ms ease;
      cursor: pointer;
    }

    .ha-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .ha-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ha-card-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .ha-card-icon.blue { background: var(--ha-blue-soft); color: var(--ha-blue); }
    .ha-card-icon.green { background: var(--ha-green-soft); color: var(--ha-green); }
    .ha-card-icon.amber { background: var(--ha-amber-soft); color: var(--ha-amber); }
    .ha-card-icon.red { background: var(--ha-red-soft); color: var(--ha-red); }
    .ha-card-icon.purple { background: var(--ha-purple-soft); color: var(--ha-purple); }

    .ha-toggle {
      width: 32px;
      height: 18px;
      border-radius: 18px;
      background: var(--ha-border);
      position: relative;
      transition: background 200ms ease;
    }

    .ha-toggle.on { background: var(--ha-green); }

    .ha-toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: transform 200ms ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .ha-toggle.on::after { transform: translateX(14px); }

    .ha-card-name { font-size: 13px; color: var(--ha-secondary); font-weight: 500; }
    .ha-card-value { font-size: 22px; font-weight: 700; }
    .ha-card-unit { font-size: 13px; font-weight: 500; color: var(--ha-secondary); }
    .ha-card-state { font-size: 14px; font-weight: 600; color: var(--ha-green); }

    .ha-section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ha-secondary);
      margin: 16px 0 10px;
    }

    .ha-wide {
      grid-column: span 2;
    }

    .ha-climate {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ha-climate-temp {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .ha-climate-controls {
      display: flex;
      gap: 8px;
    }

    .ha-climate-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--ha-border);
      background: var(--ha-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      color: var(--ha-secondary);
    }

    @media (max-width: 500px) {
      .ha-grid { grid-template-columns: repeat(2, 1fr); }
      .ha-wide { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <div class="ha-header">
    <div class="ha-title">
      <i class="fas fa-house"></i>
      <span>客厅</span>
    </div>
    <span class="ha-time">14:32 · 晴</span>
  </div>

  <p class="ha-section-label">气候</p>
  <div class="ha-grid">
    <div class="ha-card ha-wide">
      <div class="ha-card-top">
        <div class="ha-card-icon blue"><i class="fas fa-temperature-half"></i></div>
        <span class="ha-card-state">制冷中</span>
      </div>
      <div class="ha-climate">
        <div>
          <div class="ha-climate-temp">24<span class="ha-card-unit">°C</span></div>
          <div class="ha-card-name">空调</div>
        </div>
        <div class="ha-climate-controls">
          <div class="ha-climate-btn"><i class="fas fa-minus"></i></div>
          <div class="ha-climate-btn"><i class="fas fa-plus"></i></div>
        </div>
      </div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon amber"><i class="fas fa-droplet"></i></div>
      </div>
      <div class="ha-card-value">45<span class="ha-card-unit">%</span></div>
      <div class="ha-card-name">湿度</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon green"><i class="fas fa-wind"></i></div>
      </div>
      <div class="ha-card-value">优</div>
      <div class="ha-card-name">空气质量</div>
    </div>
  </div>

  <p class="ha-section-label">灯光</p>
  <div class="ha-grid">
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon amber"><i class="fas fa-lightbulb"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">开启</div>
      <div class="ha-card-name">主灯</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon amber"><i class="fas fa-lightbulb"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">开启</div>
      <div class="ha-card-name">落地灯</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon amber"><i class="fas fa-lightbulb"></i></div>
        <div class="ha-toggle"></div>
      </div>
      <div class="ha-card-state" style="color: var(--ha-secondary);">关闭</div>
      <div class="ha-card-name">射灯</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon amber"><i class="fas fa-lightbulb"></i></div>
        <div class="ha-toggle"></div>
      </div>
      <div class="ha-card-state" style="color: var(--ha-secondary);">关闭</div>
      <div class="ha-card-name">灯带</div>
    </div>
  </div>

  <p class="ha-section-label">设备</p>
  <div class="ha-grid">
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon purple"><i class="fas fa-tv"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">播放中</div>
      <div class="ha-card-name">电视</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon blue"><i class="fas fa-fan"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">2 档</div>
      <div class="ha-card-name">风扇</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon red"><i class="fas fa-video"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">录制中</div>
      <div class="ha-card-name">摄像头</div>
    </div>
    <div class="ha-card">
      <div class="ha-card-top">
        <div class="ha-card-icon green"><i class="fas fa-lock"></i></div>
        <div class="ha-toggle on"></div>
      </div>
      <div class="ha-card-state">已上锁</div>
      <div class="ha-card-name">门锁</div>
    </div>
  </div>
</body>
</html>
