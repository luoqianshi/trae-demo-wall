<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能家居控制中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="state-checkbox">
  <input type="checkbox" id="menu-toggle" class="state-checkbox">

  <label for="menu-toggle" class="menu-overlay" aria-label="关闭菜单"></label>

  <header class="navbar">
    <div class="nav-left">
      <label for="menu-toggle" class="hamburger" aria-label="打开菜单">
        <i class="fas fa-bars"></i>
      </label>
      <a href="#" class="logo">
        <i class="fas fa-house"></i>
        <span>SmartHome</span>
      </a>
    </div>
    <h1 class="site-title">智能家居控制中心</h1>
    <div class="nav-right">
      <label for="theme-toggle" class="theme-btn" aria-label="切换主题">
        <i class="fas fa-moon moon-icon"></i>
        <i class="fas fa-sun sun-icon"></i>
      </label>
      <div class="user-menu">
        <a href="#" class="user-avatar">
          <i class="fas fa-circle-user"></i>
          <span class="user-name">陈先生</span>
          <i class="fas fa-chevron-down chevron"></i>
        </a>
        <div class="dropdown">
          <a href="#"><i class="fas fa-user"></i><span>个人资料</span></a>
          <a href="#"><i class="fas fa-sliders"></i><span>偏好设置</span></a>
          <a href="#"><i class="fas fa-circle-question"></i><span>帮助中心</span></a>
          <div class="dropdown-divider"></div>
          <a href="#" class="danger"><i class="fas fa-right-from-bracket"></i><span>退出登录</span></a>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav-menu">
        <p class="nav-group-label">主菜单</p>
        <input type="radio" name="nav" id="nav-dashboard" class="nav-radio" checked>
        <label for="nav-dashboard" class="nav-item">
          <i class="fas fa-gauge-high"></i>
          <span>仪表盘</span>
        </label>
        <input type="radio" name="nav" id="nav-devices" class="nav-radio">
        <label for="nav-devices" class="nav-item">
          <i class="fas fa-microchip"></i>
          <span>设备</span>
          <span class="nav-badge">28</span>
        </label>
        <input type="radio" name="nav" id="nav-scenes" class="nav-radio">
        <label for="nav-scenes" class="nav-item">
          <i class="fas fa-clapperboard"></i>
          <span>场景</span>
        </label>
        <input type="radio" name="nav" id="nav-history" class="nav-radio">
        <label for="nav-history" class="nav-item">
          <i class="fas fa-chart-line"></i>
          <span>历史</span>
        </label>
        <input type="radio" name="nav" id="nav-settings" class="nav-radio">
        <label for="nav-settings" class="nav-item">
          <i class="fas fa-gear"></i>
          <span>设置</span>
        </label>
      </nav>
      <div class="sidebar-footer">
        <div class="status-card">
          <div class="status-indicator">
            <span class="status-dot online"></span>
            <span class="status-text">系统在线</span>
          </div>
          <span class="status-detail">12 台设备活跃</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <section class="ha-section">
        <div class="section-header">
          <h2 class="section-title">
            <i class="fas fa-desktop"></i>
            Home Assistant 仪表盘
          </h2>
          <a href="#" class="section-link">
            <span>全屏查看</span>
            <i class="fas fa-up-right-from-square"></i>
          </a>
        </div>
        <div class="iframe-wrapper">
          <iframe
            src="ha-preview.html"
            loading="lazy"
            title="Home Assistant 仪表盘"
          ></iframe>
        </div>
      </section>

      <section class="widgets-section">
        <div class="section-header">
          <h2 class="section-title">
            <i class="fas fa-grip"></i>
            快捷控制
          </h2>
        </div>
        <div class="widgets">
          <div class="widget-card">
            <div class="widget-icon temp">
              <i class="fas fa-temperature-half"></i>
            </div>
            <div class="widget-info">
              <span class="widget-label">客厅温度</span>
              <span class="widget-value">23.5<span class="unit">°C</span></span>
            </div>
            <div class="widget-trend down">
              <i class="fas fa-arrow-down"></i><span>0.5°</span>
            </div>
          </div>

          <div class="widget-card">
            <div class="widget-icon humidity">
              <i class="fas fa-droplet"></i>
            </div>
            <div class="widget-info">
              <span class="widget-label">室内湿度</span>
              <span class="widget-value">45<span class="unit">%</span></span>
            </div>
            <div class="widget-trend up">
              <i class="fas fa-arrow-up"></i><span>2%</span>
            </div>
          </div>

          <div class="widget-card">
            <div class="widget-icon light">
              <i class="fas fa-lightbulb"></i>
            </div>
            <div class="widget-info">
              <span class="widget-label">客厅灯光</span>
              <span class="widget-value status-on">已开启</span>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="widget-card camera-card">
            <div class="camera-header">
              <div class="widget-info">
                <span class="widget-label">前门摄像头</span>
                <span class="camera-status">
                  <span class="status-dot online"></span> 实时
                </span>
              </div>
              <i class="fas fa-video camera-icon"></i>
            </div>
            <img
              src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=front%20door%20security%20camera%20view%20of%20a%20modern%20home%20entrance%20with%20garden%20daytime%20clear%20sky%20wide%20angle%20CCTV%20footage&image_size=landscape_4_3"
              alt="前门摄像头实时画面"
              loading="lazy"
              class="camera-snapshot"
            >
          </div>

          <div class="widget-card">
            <div class="widget-icon energy">
              <i class="fas fa-bolt"></i>
            </div>
            <div class="widget-info">
              <span class="widget-label">今日用电</span>
              <span class="widget-value">2.4<span class="unit">kWh</span></span>
            </div>
            <div class="widget-trend eco">
              <i class="fas fa-leaf"></i><span>节能</span>
            </div>
          </div>

          <div class="widget-card">
            <div class="widget-icon air">
              <i class="fas fa-wind"></i>
            </div>
            <div class="widget-info">
              <span class="widget-label">空气质量</span>
              <span class="widget-value">优</span>
            </div>
            <div class="widget-trend">
              <span>PM2.5 · 12</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
