enable_local_ai: true
enable_cloud_ai: false
default_port: 8501

# ============================================
# AI 多引擎配置
# ============================================
ai:
  enabled: true                       # 是否启用 AI 增强
  default_provider: deepseek          # 默认 Provider（deepseek/tongyi/zhipu/kimi/openai/ollama）
  fallback_to_local: true             # AI 调用失败时是否降级到本地规则
  max_devices_in_prompt: 200          # 发送给 AI 的设备列表最大长度
  timeout: 15                         # API 调用超时（秒）

  # 各 Provider 默认配置（可在 UI 高级配置中覆盖）
  providers:
    deepseek:
      api_url: "https://api.deepseek.com/v1/chat/completions"
      model: "deepseek-chat"
    tongyi:
      api_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation"
      model: "qwen-plus"
    zhipu:
      api_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
      model: "glm-4-flash"
    kimi:
      api_url: "https://api.moonshot.cn/v1/chat/completions"
      model: "moonshot-v1-8k"
    openai:
      api_url: "https://api.openai.com/v1/chat/completions"
      model: "gpt-3.5-turbo"
    ollama:
      api_url: "http://localhost:11434/api/generate"
      model: "qwen:7b"
