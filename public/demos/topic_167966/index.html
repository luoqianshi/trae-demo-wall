<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join - 同城活动社交平台 Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1 class="demo-title">Join</h1>
      <p class="demo-subtitle">发现身边有趣的人和事</p>
    </div>
    
    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                <path d="M1 8C2.5 8 3.5 6.5 3.5 5C3.5 3.5 2.5 2 1 2C-0.5 2 -1.5 3.5 -1.5 5C-1.5 6.5 -0.5 8 1 8Z" transform="translate(2.5 3.5)"/>
                <path d="M4.5 10C6.5 10 8 7.5 8 5C8 2.5 6.5 0 4.5 0C2.5 0 1 2.5 1 5C1 7.5 2.5 10 4.5 10Z" transform="translate(7 1)"/>
              </svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                <rect x="0" y="3" width="12" height="6" rx="1.5"/>
                <rect x="13" y="4.5" width="2" height="3" rx="0.5"/>
                <rect x="1" y="4" width="8" height="4" rx="0.5" fill="white"/>
              </svg>
            </div>
          </div>
          
          <div class="app-content" id="appContent">
          </div>
          
          <div class="bottom-nav" id="bottomNav">
            <div class="nav-item active" data-page="explore">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
              </svg>
              <span>探索</span>
            </div>
            <div class="nav-item" data-page="messages">
              <div class="nav-badge">3</div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <span>消息</span>
            </div>
            <div class="nav-item" data-page="schedule">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <span>日程</span>
            </div>
            <div class="nav-item" data-page="space">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
              <span>空间</span>
            </div>
            <div class="nav-item" data-page="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span>我的</span>
            </div>
          </div>
          
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
    
    <div class="demo-footer">
      <p>投资人演示 Demo · 2026</p>
    </div>
  </div>
  
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContainer">
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
