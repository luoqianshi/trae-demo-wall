<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Replay - AI人生回放</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f1435 100%);
            color: white;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        body::before {
            content: "";
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(3px 3px at 20% 30%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 70% 80%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(2px 2px at 90% 40%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(2px 2px at 40% 60%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 {
            background: radial-gradient(circle, rgba(77, 125, 255, 0.6), transparent);
            top: -200px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .glow-2 {
            background: radial-gradient(circle, rgba(90, 216, 255, 0.5), transparent);
            bottom: -150px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        header {
            height: 80px;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            backdrop-filter: blur(20px);
            background: rgba(10, 14, 39, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(90, 216, 255, 0.4);
        }

        .logo span {
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            color: white;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(77, 125, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-icon {
            padding: 12px;
            border-radius: 10px;
        }

        .page {
            position: absolute;
            left: 0;
            right: 0;
            top: 80px;
            bottom: 0;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
        }

        #homePage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 60px;
            text-align: center;
            overflow: hidden;
        }

        .home-hero {
            animation: fadeUp 1s ease-out forwards;
            opacity: 0;
        }

        .home-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff, #8d5cff);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            margin: 0 auto 40px;
            box-shadow: 0 0 60px rgba(90, 216, 255, 0.3);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(90, 216, 255, 0.3); }
            50% { box-shadow: 0 0 80px rgba(90, 216, 255, 0.5); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .home-hero h1 {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
            animation: fadeUp 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        .home-hero .subtitle {
            font-size: 24px;
            color: #a8b8ff;
            line-height: 1.6;
            margin-bottom: 60px;
            animation: fadeUp 1s ease-out 0.4s forwards;
            opacity: 0;
        }

        .home-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            animation: fadeUp 1s ease-out 0.6s forwards;
            opacity: 0;
        }

        .home-buttons .btn {
            font-size: 16px;
            padding: 16px 40px;
            border-radius: 16px;
        }

        #viewPage {
            overflow-y: auto;
            padding: 40px 60px;
            min-height: calc(100vh - 80px);
        }

        #viewPage::-webkit-scrollbar {
            width: 8px;
        }

        #viewPage::-webkit-scrollbar-thumb {
            background: rgba(90, 216, 255, 0.3);
            border-radius: 4px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898cc;
            font-size: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #5ad8ff;
            box-shadow: 0 0 20px rgba(90, 216, 255, 0.15);
        }

        .search-input::placeholder {
            color: #6b7a9a;
        }

        .tag-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-filter {
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            color: #a8b8ff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag-filter:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tag-filter.active {
            background: linear-gradient(135deg, rgba(90, 216, 255, 0.3), rgba(77, 125, 255, 0.3));
            border-color: #5ad8ff;
            color: white;
        }

        .summary {
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .summary-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .summary-header h2 {
            font-size: 28px;
            font-weight: 600;
        }

        .ai-badge {
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(90, 216, 255, 0.2), rgba(77, 125, 255, 0.2));
            border-radius: 20px;
            font-size: 12px;
            color: #5ad8ff;
            border: 1px solid rgba(90, 216, 255, 0.3);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        .summary-item {
            padding: 24px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .summary-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .summary-item h3 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            transition: transform 0.3s;
        }

        .summary-item p {
            color: #8898cc;
            font-size: 14px;
        }

        .ai-summary-card {
            padding: 30px;
            background: linear-gradient(135deg, rgba(90, 216, 255, 0.08), rgba(77, 125, 255, 0.08));
            border-radius: 20px;
            border: 1px solid rgba(90, 216, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .ai-summary-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #5ad8ff, #4d7dff);
        }

        .ai-summary-card .year {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
        }

        .ai-summary-card .stats-row {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ai-summary-card .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-summary-card .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #5ad8ff;
        }

        .ai-summary-card .stat-label {
            font-size: 14px;
            color: #a8b8ff;
        }

        .ai-summary-card .ai-text {
            font-size: 16px;
            color: #d0d8ff;
            line-height: 1.8;
            font-style: italic;
            padding-left: 20px;
            border-left: 3px solid rgba(90, 216, 255, 0.3);
        }

        .ai-summary-card .empty-text {
            font-size: 18px;
            color: #a8b8ff;
            text-align: center;
            padding: 20px;
        }

        .timeline-wrap {
            width: 100%;
            margin-top: 30px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 80px;
            scrollbar-width: thin;
            scrollbar-color: rgba(90, 216, 255, 0.5) transparent;
        }

        .timeline-wrap::-webkit-scrollbar {
            height: 12px;
        }

        .timeline-wrap::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #5ad8ff, #4d7dff);
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(90, 216, 255, 0.5);
        }

        .timeline {
            position: relative;
            display: flex;
            align-items: center;
            min-width: max-content;
            height: 600px;
            padding: 0 80px;
        }

        .timeline-line {
            position: absolute;
            left: 80px;
            right: 80px;
            top: 50%;
            height: 4px;
            border-radius: 50px;
            background: linear-gradient(90deg, rgba(90, 216, 255, 0.3), rgba(77, 125, 255, 0.5), rgba(141, 92, 255, 0.3));
            box-shadow: 0 0 20px rgba(90, 216, 255, 0.3);
        }

        .timeline-line::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #5ad8ff, transparent);
            animation: flowLight 3s linear infinite;
        }

        @keyframes flowLight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #timeline-container {
            display: flex;
            position: relative;
            z-index: 5;
        }

        .timeline-node {
            position: relative;
            width: 300px;
            height: 520px;
            margin-right: 80px;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .timeline-node.active {
            transform: scale(1.05);
        }

        .timeline-node:last-child {
            margin-right: 0;
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(90, 216, 255, 0.6), 0 0 40px rgba(90, 216, 255, 0.3);
            transition: all 0.3s;
            cursor: pointer;
            z-index: 10;
        }

        .timeline-dot::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            transform: translate(-50%, -50%);
        }

        .timeline-dot:hover {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 30px rgba(90, 216, 255, 0.8), 0 0 60px rgba(90, 216, 255, 0.4);
        }

        .timeline-node.active .timeline-dot {
            transform: translate(-50%, -50%) scale(1.5);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(90, 216, 255, 0.6);
        }

        .timeline-card {
            position: absolute;
            width: 260px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .timeline-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 30px 60px rgba(90, 216, 255, 0.25);
            border-color: rgba(90, 216, 255, 0.3);
        }

        .timeline-node.active .timeline-card {
            transform: translateY(-20px) scale(1.08);
            box-shadow: 0 30px 70px rgba(90, 216, 255, 0.4);
            border-color: rgba(90, 216, 255, 0.5);
        }

        .timeline-card-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .timeline-card:hover .timeline-card-img {
            transform: scale(1.1);
        }

        .timeline-card-info {
            padding: 20px;
        }

        .timeline-card-date {
            font-size: 13px;
            color: #5ad8ff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .timeline-card-title {
            font-size: 20px;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .timeline-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .timeline-card-tag {
            padding: 4px 12px;
            background: rgba(77, 125, 255, 0.2);
            border-radius: 15px;
            font-size: 12px;
            color: #5ad8ff;
            border: 1px solid rgba(90, 216, 255, 0.2);
        }

        .timeline-card.top {
            bottom: 240px;
            left: 50%;
            transform: translateX(-50%);
        }

        .timeline-card.bottom {
            top: 240px;
            left: 50%;
            transform: translateX(-50%);
        }

        .timeline-year {
            position: absolute;
            top: 50%;
            transform: translateY(50px);
            width: 100%;
            text-align: center;
            color: #8898cc;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #8898cc;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .empty-state h3 {
            font-size: 28px;
            margin-bottom: 10px;
            color: white;
        }

        .empty-state p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        #adminPage {
            overflow-y: auto;
            padding: 40px 60px;
            min-height: calc(100vh - 80px);
        }

        #adminPage::-webkit-scrollbar {
            width: 8px;
        }

        #adminPage::-webkit-scrollbar-thumb {
            background: rgba(90, 216, 255, 0.3);
            border-radius: 4px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .panel-header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #a8b8ff;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #5ad8ff;
            box-shadow: 0 0 20px rgba(90, 216, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #6b7a9a;
        }

        .image-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .image-upload-area:hover,
        .image-upload-area.dragover {
            border-color: #5ad8ff;
            background: rgba(90, 216, 255, 0.05);
        }

        .image-upload-area input {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #5ad8ff;
        }

        .upload-text {
            font-size: 16px;
            color: #a8b8ff;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: #6b7a9a;
        }

        .image-preview {
            margin-top: 16px;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .image-preview img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
        }

        .image-preview .remove-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-preview .remove-btn:hover {
            background: rgba(255, 77, 77, 0.8);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s;
            margin-top: 20px;
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(77, 125, 255, 0.4);
        }

        .save-btn:active {
            transform: translateY(-1px);
        }

        .memory-list {
            max-height: 700px;
            overflow-y: auto;
        }

        .memory-list::-webkit-scrollbar {
            width: 6px;
        }

        .memory-list::-webkit-scrollbar-thumb {
            background: rgba(90, 216, 255, 0.2);
            border-radius: 3px;
        }

        .memory-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .memory-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .memory-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .memory-info {
            flex: 1;
            min-width: 0;
        }

        .memory-info h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: white;
        }

        .memory-info .date {
            font-size: 13px;
            color: #5ad8ff;
            margin-bottom: 10px;
        }

        .memory-info .desc {
            font-size: 14px;
            color: #8898cc;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .memory-info .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .memory-info .tag {
            padding: 3px 10px;
            background: rgba(77, 125, 255, 0.15);
            border-radius: 10px;
            font-size: 11px;
            color: #5ad8ff;
        }

        .memory-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .memory-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .edit-btn {
            background: rgba(77, 125, 255, 0.2);
            color: #5ad8ff;
            border: 1px solid rgba(77, 125, 255, 0.3);
        }

        .edit-btn:hover {
            background: rgba(77, 125, 255, 0.3);
            transform: translateY(-2px);
        }

        .delete-btn {
            background: rgba(255, 77, 77, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .delete-btn:hover {
            background: rgba(255, 77, 77, 0.3);
            transform: translateY(-2px);
        }

        .modal-overlay {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: rgba(20, 25, 50, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h3 {
            font-size: 22px;
            margin-bottom: 16px;
            color: white;
        }

        .modal p {
            font-size: 15px;
            color: #8898cc;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-actions .btn {
            padding: 12px 24px;
            font-size: 14px;
        }

        .detail-modal {
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .detail-modal::-webkit-scrollbar {
            width: 6px;
        }

        .detail-modal::-webkit-scrollbar-thumb {
            background: rgba(90, 216, 255, 0.3);
            border-radius: 3px;
        }

        .detail-img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .detail-date {
            font-size: 14px;
            color: #5ad8ff;
            margin-bottom: 16px;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .detail-tag {
            padding: 6px 14px;
            background: rgba(77, 125, 255, 0.2);
            border-radius: 15px;
            font-size: 13px;
            color: #5ad8ff;
            border: 1px solid rgba(90, 216, 255, 0.2);
        }

        .detail-desc {
            font-size: 16px;
            color: #c0c8e8;
            line-height: 1.8;
        }

        .close-btn {
            position: absolute;
            right: 16px;
            top: 16px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 16px 28px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.success {
            border-left: 4px solid #52c41a;
        }

        .toast.error {
            border-left: 4px solid #ff4d4d;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .playback-overlay {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }

        .playback-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .playback-content {
            text-align: center;
            max-width: 90%;
        }

        .playback-image {
            max-width: 800px;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 60px rgba(90, 216, 255, 0.3);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playback-image.active {
            opacity: 1;
            transform: scale(1);
        }

        .playback-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeUp 0.5s 0.3s forwards;
        }

        .playback-date {
            font-size: 16px;
            color: #5ad8ff;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 0.5s 0.4s forwards;
        }

        .playback-desc {
            font-size: 18px;
            color: #a8b8ff;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeUp 0.5s 0.5s forwards;
        }

        .playback-controls {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .playback-overlay.active .playback-controls {
            opacity: 1;
        }

        .playback-controls .btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
        }

        .playback-progress {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .playback-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #5ad8ff, #4d7dff);
            width: 0%;
            transition: width 0.3s;
        }

        .playback-end-screen {
            text-align: center;
            padding: 60px;
            opacity: 0;
            animation: fadeUp 1s forwards;
        }

        .playback-end-screen .icon {
            font-size: 80px;
            margin-bottom: 30px;
            color: #5ad8ff;
        }

        .playback-end-screen h2 {
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
        }

        .playback-end-screen p {
            font-size: 18px;
            color: #a8b8ff;
            line-height: 1.6;
        }

        #statsPage {
            overflow-y: auto;
            padding: 40px 60px;
            min-height: calc(100vh - 80px);
        }

        #statsPage::-webkit-scrollbar {
            width: 8px;
        }

        #statsPage::-webkit-scrollbar-thumb {
            background: rgba(90, 216, 255, 0.3);
            border-radius: 4px;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-header {
            margin-bottom: 40px;
        }

        .stats-header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stats-header p {
            font-size: 16px;
            color: #8898cc;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(90, 216, 255, 0.1);
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 16px;
        }

        .stat-card .number {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #5ad8ff, #4d7dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 14px;
            color: #8898cc;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }

        .chart-card h3 {
            font-size: 18px;
            margin-bottom: 24px;
            color: white;
        }

        .tag-chart {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tag-bar-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tag-bar-label {
            width: 80px;
            font-size: 14px;
            color: #a8b8ff;
            flex-shrink: 0;
        }

        .tag-bar {
            flex: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .tag-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #5ad8ff, #4d7dff);
            border-radius: 12px;
            transition: width 1s ease-out;
            position: relative;
        }

        .tag-bar-fill::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3));
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(0); }
            100% { transform: translateX(20px); }
        }

        .tag-bar-count {
            width: 40px;
            font-size: 14px;
            color: #5ad8ff;
            font-weight: 600;
            text-align: right;
        }

        .timeline-chart {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            height: 200px;
            padding: 20px 0;
        }

        .year-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px 8px 0 0;
            position: relative;
            transition: all 0.3s;
        }

        .year-bar:hover {
            background: rgba(90, 216, 255, 0.2);
        }

        .year-bar-fill {
            width: 100%;
            background: linear-gradient(180deg, #5ad8ff, #4d7dff);
            border-radius: 8px 8px 0 0;
            transition: height 1s ease-out;
        }

        .year-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #8898cc;
        }

        .year-bar-count {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #5ad8ff;
            font-weight: 600;
        }

        @media (max-width: 1440px) {
            header {
                padding: 0 40px;
            }

            #viewPage,
            #adminPage,
            #statsPage {
                padding: 30px 40px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 1366px) {
            .timeline-card {
                width: 240px;
            }

            .timeline-node {
                width: 280px;
                margin-right: 60px;
            }

            .timeline {
                height: 550px;
            }

            .timeline-card.top {
                bottom: 220px;
            }

            .timeline-card.bottom {
                top: 220px;
            }
        }

        @media (max-width: 1024px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .home-hero h1 {
                font-size: 48px;
            }

            .home-hero .subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 0 20px;
                height: 70px;
            }

            .logo {
                font-size: 22px;
            }

            .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            #viewPage,
            #adminPage,
            #statsPage {
                padding: 20px;
                top: 70px;
            }

            .home-hero h1 {
                font-size: 36px;
            }

            .home-hero .subtitle {
                font-size: 18px;
            }

            .home-logo {
                width: 80px;
                height: 80px;
                font-size: 40px;
                margin-bottom: 24px;
            }

            .home-buttons {
                flex-direction: column;
                gap: 12px;
            }

            .home-buttons .btn {
                width: 200px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .summary-item h3 {
                font-size: 32px;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-container {
                max-width: 100%;
                width: 100%;
            }

            .timeline-wrap {
                padding-bottom: 40px;
            }

            .timeline {
                flex-direction: column;
                height: auto;
                padding: 40px 20px;
                align-items: flex-start;
            }

            .timeline-line {
                position: absolute;
                left: 14px;
                top: 0;
                bottom: 0;
                width: 4px;
                height: auto;
            }

            .timeline-node {
                width: 100%;
                height: auto;
                margin-right: 0;
                margin-bottom: 40px;
                display: flex;
                align-items: flex-start;
                gap: 30px;
            }

            .timeline-node:last-child {
                margin-bottom: 0;
            }

            .timeline-dot {
                position: static;
                width: 20px;
                height: 20px;
                flex-shrink: 0;
                transform: none;
                margin-top: 20px;
            }

            .timeline-card {
                position: static;
                transform: none;
                width: 100%;
                max-width: none;
            }

            .timeline-card.top,
            .timeline-card.bottom {
                position: static;
                transform: none;
            }

            .timeline-year {
                position: static;
                transform: none;
                text-align: left;
                margin-bottom: 8px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .memory-item {
                flex-direction: column;
            }

            .memory-item img {
                width: 100%;
                height: 150px;
            }

            .memory-actions {
                width: 100%;
            }

            .memory-actions button {
                flex: 1;
            }
        }

        @media (max-width: 480px) {
            .home-hero h1 {
                font-size: 28px;
            }

            .home-hero .subtitle {
                font-size: 16px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .summary-item h3 {
                font-size: 28px;
            }

            .modal {
                padding: 20px;
            }

            .playback-image {
                max-height: 300px;
            }

            .playback-title {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="stars" id="stars"></div>
    <div class="gradient-glow glow-1"></div>
    <div class="gradient-glow glow-2"></div>

    <header>
        <div class="logo">
            <div class="logo-icon">🎬</div>
            <span>Life</span> Replay
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" id="playbackBtn">▶ 人生回放</button>
            <button class="btn btn-secondary" id="statsBtn">📊 统计</button>
            <button class="btn btn-primary" id="switchBtn">后台管理</button>
        </div>
    </header>

    <div id="homePage" class="page active">
        <div class="home-hero">
            <div class="home-logo">🎬</div>
            <h1>Life Replay</h1>
            <p class="subtitle">让 AI 帮你记录人生，<br>让回忆重新鲜活。</p>
            <div class="home-buttons">
                <button class="btn btn-primary" onclick="goToView()">开始回放</button>
                <button class="btn btn-secondary" onclick="goToAdmin()">添加回忆</button>
            </div>
        </div>
    </div>

    <div id="viewPage" class="page">
        <div class="toolbar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索回忆、标签、日期...">
            </div>
            <div class="tag-filters" id="tagFilters"></div>
        </div>

        <div class="summary">
            <div class="summary-header">
                <h2>✨ AI 年度总结</h2>
                <span class="ai-badge">AI 生成</span>
            </div>
            <div class="summary-grid">
                <div class="summary-item">
                    <h3 id="memoryCount">0</h3>
                    <p>回忆数量</p>
                </div>
                <div class="summary-item">
                    <h3 id="yearCount">0</h3>
                    <p>年份跨度</p>
                </div>
                <div class="summary-item">
                    <h3 id="tagCount">0</h3>
                    <p>标签数量</p>
                </div>
                <div class="summary-item">
                    <h3 id="photoCount">0</h3>
                    <p>照片数量</p>
                </div>
            </div>
            <div class="ai-summary-card" id="aiSummaryCard">
                <div class="empty-text">开始记录你的第一段人生故事。</div>
            </div>
        </div>

        <div class="timeline-wrap">
            <div class="timeline">
                <div class="timeline-line"></div>
                <div id="timeline-container"></div>
            </div>
        </div>

        <div class="empty-state" id="viewEmptyState" style="display: none;">
            <div class="icon">🌟</div>
            <h3>暂无回忆</h3>
            <p>点击右上角「后台管理」<br>开始记录你的第一段人生故事。</p>
        </div>
    </div>

    <div id="adminPage" class="page">
        <div class="admin-container">
            <div class="panel">
                <div class="panel-header">
                    <span>📝</span>
                    <h2>添加/编辑回忆</h2>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="date">
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="title" placeholder="给这个回忆起个名字">
                </div>
                <div class="form-group">
                    <label>标签（用逗号分隔）</label>
                    <input type="text" id="tags" placeholder="旅行, 生日, 毕业">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="desc" placeholder="写下你的回忆..."></textarea>
                </div>
                <div class="form-group">
                    <label>图片</label>
                    <div class="image-upload-area" id="imageUploadArea">
                        <input type="file" id="image" accept="image/*">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击或拖拽上传图片</div>
                        <div class="upload-hint">支持 JPG、PNG 格式</div>
                    </div>
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <button class="save-btn" id="saveBtn">保存回忆</button>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span>📋</span>
                    <h2>回忆列表</h2>
                </div>
                <div class="memory-list" id="memoryList"></div>
            </div>
        </div>
    </div>

    <div id="statsPage" class="page">
        <div class="stats-container">
            <div class="stats-header">
                <h1>📊 AI 统计分析</h1>
                <p>深入了解你的人生回忆数据</p>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="chart-card">
                <h3>📈 标签分布</h3>
                <div class="tag-chart" id="tagChart"></div>
            </div>
            <div class="chart-card">
                <h3>📅 年度回忆分布</h3>
                <div class="timeline-chart" id="yearChart"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>删除确认</h3>
            <p>确定要删除这个珍贵的回忆吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-primary" style="background: linear-gradient(135deg, #ff6b6b, #ff4d4d);" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal detail-modal">
            <button class="close-btn" onclick="closeDetailModal()">×</button>
            <img class="detail-img" id="detailImg" src="" alt="">
            <h2 class="detail-title" id="detailTitle"></h2>
            <div class="detail-date" id="detailDate"></div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-desc" id="detailDesc"></div>
        </div>
    </div>

    <div class="playback-overlay" id="playbackOverlay">
        <div class="playback-content" id="playbackContent">
            <img class="playback-image" id="playbackImg" src="" alt="">
            <h2 class="playback-title" id="playbackTitle"></h2>
            <div class="playback-date" id="playbackDate"></div>
            <div class="playback-desc" id="playbackDesc"></div>
        </div>
        <div class="playback-controls">
            <button class="btn btn-secondary" onclick="stopPlayback()">停止</button>
            <button class="btn btn-primary" onclick="nextPlayback()">下一张</button>
        </div>
        <div class="playback-progress">
            <div class="playback-progress-bar" id="playbackProgress"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script>
    const STORAGE_KEY = "lifeReplayData";
    let memories = [];
    let editingIndex = -1;
    let deletingIndex = -1;
    let playbackIndex = -1;
    let playbackInterval = null;
    let currentFilterTag = '全部';
    let currentSearch = '';

    const switchBtn = document.getElementById("switchBtn");
    const playbackBtn = document.getElementById("playbackBtn");
    const statsBtn = document.getElementById("statsBtn");
    const homePage = document.getElementById("homePage");
    const viewPage = document.getElementById("viewPage");
    const adminPage = document.getElementById("adminPage");
    const statsPage = document.getElementById("statsPage");

    const dateInput = document.getElementById("date");
    const titleInput = document.getElementById("title");
    const tagInput = document.getElementById("tags");
    const descInput = document.getElementById("desc");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const imageUploadArea = document.getElementById("imageUploadArea");

    const saveBtn = document.getElementById("saveBtn");
    const memoryList = document.getElementById("memoryList");
    const timelineContainer = document.getElementById("timeline-container");
    const tagFilters = document.getElementById("tagFilters");
    const searchInput = document.getElementById("searchInput");
    const viewEmptyState = document.getElementById("viewEmptyState");
    const aiSummaryCard = document.getElementById("aiSummaryCard");

    const deleteModal = document.getElementById("deleteModal");
    const detailModal = document.getElementById("detailModal");
    const detailImg = document.getElementById("detailImg");
    const detailTitle = document.getElementById("detailTitle");
    const detailDate = document.getElementById("detailDate");
    const detailTags = document.getElementById("detailTags");
    const detailDesc = document.getElementById("detailDesc");

    const playbackOverlay = document.getElementById("playbackOverlay");
    let playbackImg = document.getElementById("playbackImg");
    let playbackTitle = document.getElementById("playbackTitle");
    let playbackDate = document.getElementById("playbackDate");
    let playbackDesc = document.getElementById("playbackDesc");
    const playbackProgress = document.getElementById("playbackProgress");
    const playbackContent = document.getElementById("playbackContent");

    const toast = document.getElementById("toast");

    window.onload = () => {
        initStars();
        loadData();
        renderList();
        renderTimeline();
        updateSummary();
        renderTagFilters();
    };

    function initStars() {
        const starsContainer = document.getElementById('stars');
        const starCount = 100;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.opacity = Math.random() * 0.5 + 0.2;
            starsContainer.appendChild(star);
        }
    }

    function goToView() {
        homePage.classList.remove('active');
        viewPage.classList.add('active');
    }

    function goToAdmin() {
        homePage.classList.remove('active');
        adminPage.classList.add('active');
        switchBtn.innerText = '返回展示';
    }

    switchBtn.onclick = () => {
        if (viewPage.classList.contains("active") || statsPage.classList.contains("active") || homePage.classList.contains("active")) {
            viewPage.classList.remove("active");
            statsPage.classList.remove("active");
            homePage.classList.remove("active");
            adminPage.classList.add("active");
            switchBtn.innerText = "返回展示";
        } else {
            adminPage.classList.remove("active");
            viewPage.classList.add("active");
            switchBtn.innerText = "后台管理";
            renderTimeline();
            updateSummary();
        }
    };

    playbackBtn.onclick = () => {
        if (memories.length === 0) {
            showToast('请先添加一些回忆', 'error');
            return;
        }
        startPlayback();
    };

    statsBtn.onclick = () => {
        viewPage.classList.remove("active");
        homePage.classList.remove("active");
        adminPage.classList.remove("active");
        statsPage.classList.add("active");
        renderStats();
    };

    searchInput.oninput = (e) => {
        currentSearch = e.target.value.toLowerCase();
        renderTimeline();
    };

    function renderTagFilters() {
        const allTags = new Set();
        memories.forEach(m => {
            if (m.tags) {
                m.tags.split(',').forEach(t => {
                    const tag = t.trim();
                    if (tag) allTags.add(tag);
                });
            }
        });
        const tags = ['全部', ...Array.from(allTags)];
        tagFilters.innerHTML = tags.map(tag => `
            <button class="tag-filter ${tag === currentFilterTag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</button>
        `).join('');
    }

    function filterByTag(tag) {
        currentFilterTag = tag;
        renderTagFilters();
        renderTimeline();
    }

    function filterMemories(list) {
        return list.filter(m => {
            const matchSearch = !currentSearch || 
                m.title.toLowerCase().includes(currentSearch) ||
                (m.tags && m.tags.toLowerCase().includes(currentSearch)) ||
                m.date.includes(currentSearch);
            const matchTag = currentFilterTag === '全部' || 
                (m.tags && m.tags.includes(currentFilterTag));
            return matchSearch && matchTag;
        });
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
    }

    function loadData() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            memories = JSON.parse(data);
            memories.sort((a, b) => new Date(a.date) - new Date(b.date));
        }
    }

    imageUploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        imageUploadArea.classList.add('dragover');
    });

    imageUploadArea.addEventListener('dragleave', () => {
        imageUploadArea.classList.remove('dragover');
    });

    imageUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        imageUploadArea.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            processImage(file);
        }
    });

    imageInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            processImage(file);
        }
    };

    function processImage(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            imagePreview.innerHTML = `
                <img src="${event.target.result}" alt="预览">
                <div class="remove-btn" onclick="clearImage()">✕</div>
            `;
        };
        reader.readAsDataURL(file);
    }

    function clearImage() {
        imagePreview.innerHTML = '';
        imageInput.value = '';
    }

    saveBtn.onclick = () => {
        if (!dateInput.value) {
            showToast('请选择日期', 'error');
            return;
        }
        if (!titleInput.value.trim()) {
            showToast('请输入标题', 'error');
            return;
        }

        const file = imageInput.files[0];
        const hasPreview = imagePreview.querySelector('img');

        if (editingIndex !== -1 && !file && hasPreview) {
            const imgSrc = hasPreview.src;
            updateMemory(editingIndex, imgSrc);
            return;
        }

        if (!file && !hasPreview) {
            showToast('请选择图片', 'error');
            return;
        }

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                if (editingIndex === -1) {
                    addMemory(e.target.result);
                } else {
                    updateMemory(editingIndex, e.target.result);
                }
            };
            reader.readAsDataURL(file);
        } else if (hasPreview) {
            if (editingIndex === -1) {
                addMemory(hasPreview.src);
            } else {
                updateMemory(editingIndex, hasPreview.src);
            }
        }
    };

    function addMemory(image) {
        const item = {
            date: dateInput.value,
            title: titleInput.value.trim(),
            tags: tagInput.value.trim(),
            desc: descInput.value.trim(),
            image: image
        };
        memories.push(item);
        finishSave('添加成功');
    }

    function updateMemory(index, image) {
        memories[index].date = dateInput.value;
        memories[index].title = titleInput.value.trim();
        memories[index].tags = tagInput.value.trim();
        memories[index].desc = descInput.value.trim();
        memories[index].image = image;
        finishSave('保存成功');
    }

    function finishSave(message) {
        memories.sort((a, b) => new Date(a.date) - new Date(b.date));
        saveData();
        clearForm();
        renderList();
        renderTimeline();
        updateSummary();
        renderTagFilters();
        editingIndex = -1;
        showToast(message, 'success');
    }

    function clearForm() {
        dateInput.value = "";
        titleInput.value = "";
        tagInput.value = "";
        descInput.value = "";
        imageInput.value = "";
        imagePreview.innerHTML = "";
    }

    function renderList() {
        if (memories.length === 0) {
            memoryList.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <h3>还没有回忆</h3>
                    <p>在左侧添加你的第一个回忆吧！</p>
                </div>
            `;
            return;
        }

        memoryList.innerHTML = memories.map((memory, index) => {
            const tags = memory.tags ? memory.tags.split(',').map(t => t.trim()).filter(t => t) : [];
            return `
                <div class="memory-item">
                    <img src="${memory.image}" alt="${memory.title}">
                    <div class="memory-info">
                        <h4>${memory.title}</h4>
                        <div class="date">${memory.date}</div>
                        <div class="desc">${memory.desc || '暂无描述'}</div>
                        <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    </div>
                    <div class="memory-actions">
                        <button class="edit-btn" onclick="editMemory(${index})">编辑</button>
                        <button class="delete-btn" onclick="showDeleteModal(${index})">删除</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function editMemory(index) {
        const memory = memories[index];
        editingIndex = index;
        dateInput.value = memory.date;
        titleInput.value = memory.title;
        tagInput.value = memory.tags || '';
        descInput.value = memory.desc || '';
        imagePreview.innerHTML = `
            <img src="${memory.image}" alt="预览">
            <div class="remove-btn" onclick="clearImage()">✕</div>
        `;
        adminPage.scrollTop = 0;
    }

    function showDeleteModal(index) {
        deletingIndex = index;
        deleteModal.classList.add('active');
    }

    function closeDeleteModal() {
        deleteModal.classList.remove('active');
        deletingIndex = -1;
    }

    function confirmDelete() {
        if (deletingIndex !== -1) {
            memories.splice(deletingIndex, 1);
            saveData();
            renderList();
            renderTimeline();
            updateSummary();
            renderTagFilters();
            closeDeleteModal();
            showToast('删除成功', 'success');
        }
    }

    function renderTimeline() {
        const filtered = filterMemories(memories);
        
        if (filtered.length === 0) {
            timelineContainer.innerHTML = '';
            viewEmptyState.style.display = 'block';
            return;
        }

        viewEmptyState.style.display = 'none';

        timelineContainer.innerHTML = filtered.map((memory, index) => {
            const isTop = index % 2 === 0;
            const year = new Date(memory.date).getFullYear();
            const tags = memory.tags ? memory.tags.split(',').map(t => t.trim()).filter(t => t) : [];
            
            return `
                <div class="timeline-node" data-index="${index}">
                    <div class="timeline-dot"></div>
                    <div class="timeline-card ${isTop ? 'top' : 'bottom'}" onclick="showDetail(${memories.indexOf(memory)})">
                        <img class="timeline-card-img" src="${memory.image}" alt="${memory.title}">
                        <div class="timeline-card-info">
                            <div class="timeline-card-date">${memory.date}</div>
                            <h3 class="timeline-card-title">${memory.title}</h3>
                            <div class="timeline-card-tags">${tags.map(t => `<span class="timeline-card-tag">${t}</span>`).join('')}</div>
                        </div>
                    </div>
                    <div class="timeline-year">${year}</div>
                </div>
            `;
        }).join('');
    }

    function showDetail(index) {
        const memory = memories[index];
        detailImg.src = memory.image;
        detailTitle.textContent = memory.title;
        detailDate.textContent = memory.date;
        const tags = memory.tags ? memory.tags.split(',').map(t => t.trim()).filter(t => t) : [];
        detailTags.innerHTML = tags.map(t => `<span class="detail-tag">${t}</span>`).join('');
        detailDesc.textContent = memory.desc || '暂无描述';
        detailModal.classList.add('active');
    }

    function closeDetailModal() {
        detailModal.classList.remove('active');
    }

    detailModal.onclick = (e) => {
        if (e.target === detailModal) {
            closeDetailModal();
        }
    };

    function updateSummary() {
        animateNumber('memoryCount', memories.length);
        animateNumber('photoCount', memories.length);

        if (memories.length > 0) {
            const years = memories.map(m => new Date(m.date).getFullYear());
            const minYear = Math.min(...years);
            const maxYear = Math.max(...years);
            animateNumber('yearCount', maxYear - minYear + 1);

            const allTags = new Set();
            memories.forEach(m => {
                if (m.tags) {
                    m.tags.split(',').forEach(t => {
                        const tag = t.trim();
                        if (tag) allTags.add(tag);
                    });
                }
            });
            animateNumber('tagCount', allTags.size);
            updateAISummary();
        } else {
            document.getElementById('yearCount').textContent = '0';
            document.getElementById('tagCount').textContent = '0';
            aiSummaryCard.innerHTML = '<div class="empty-text">开始记录你的第一段人生故事。</div>';
        }
    }

    function animateNumber(id, target) {
        const element = document.getElementById(id);
        const current = parseInt(element.textContent) || 0;
        if (current === target) return;
        
        const duration = 1000;
        const steps = 60;
        const increment = (target - current) / steps;
        let step = 0;
        
        const timer = setInterval(() => {
            step++;
            const value = Math.round(current + increment * step);
            element.textContent = value;
            
            if (step >= steps) {
                clearInterval(timer);
                element.textContent = target;
            }
        }, duration / steps);
    }

    function updateAISummary() {
        if (memories.length === 0) return;

        const currentYear = new Date().getFullYear();
        const yearMemories = memories.filter(m => new Date(m.date).getFullYear() === currentYear);
        const year = yearMemories.length > 0 ? currentYear : new Date(memories[memories.length - 1].date).getFullYear();
        const count = yearMemories.length > 0 ? yearMemories.length : memories.length;

        const tagCounts = {};
        memories.forEach(m => {
            if (m.tags) {
                m.tags.split(',').forEach(t => {
                    const tag = t.trim();
                    if (tag) {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    }
                });
            }
        });

        const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
        
        let summaryText = '';
        if (count === 0) {
            summaryText = '开始记录你的第一段人生故事。';
        } else if (count <= 5) {
            summaryText = `这一年你记录了${count}段珍贵的回忆，每一段都是生活的美好印记。继续记录更多精彩时刻吧！`;
        } else if (count <= 15) {
            summaryText = `这一年是充实的一年，你记录了${count}段回忆。${sortedTags[0] ? `其中${sortedTags[0][0]}占了${sortedTags[0][1]}次，` : ''}留下了许多难忘的瞬间。`;
        } else {
            summaryText = `这一年是你成长最快的一年，你经历了许多重要时刻，留下了${count}段珍贵回忆。${sortedTags.slice(0, 2).map(t => `${t[0]}${t[1]}次`).join('、')}，每一段都值得珍藏。`;
        }

        aiSummaryCard.innerHTML = `
            <div class="year">${year}</div>
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-number">${count}</span>
                    <span class="stat-label">段回忆</span>
                </div>
                ${sortedTags.map(t => `
                    <div class="stat-item">
                        <span class="stat-number">${t[1]}</span>
                        <span class="stat-label">${t[0]}</span>
                    </div>
                `).join('')}
            </div>
            <div class="ai-text">"${summaryText}"</div>
        `;
    }

    function startPlayback() {
        if (memories.length === 0) return;
        
        playbackIndex = 0;
        playbackOverlay.classList.add('active');
        showPlaybackItem(0);
        
        playbackInterval = setInterval(() => {
            playbackIndex++;
            if (playbackIndex >= memories.length) {
                endPlayback();
            } else {
                showPlaybackItem(playbackIndex);
            }
        }, 4000);
    }

    function showPlaybackItem(index) {
        const memory = memories[index];
        
        playbackImg.classList.remove('active');
        playbackTitle.style.opacity = '0';
        playbackDate.style.opacity = '0';
        playbackDesc.style.opacity = '0';
        
        setTimeout(() => {
            playbackImg.src = memory.image;
            playbackTitle.textContent = memory.title;
            playbackDate.textContent = memory.date;
            playbackDesc.textContent = memory.desc || '';
            
            playbackImg.classList.add('active');
            playbackTitle.style.opacity = '1';
            playbackDate.style.opacity = '1';
            playbackDesc.style.opacity = '1';
            
            playbackProgress.style.width = `${((index + 1) / memories.length) * 100}%`;
        }, 300);
    }

    function nextPlayback() {
        clearInterval(playbackInterval);
        playbackIndex++;
        if (playbackIndex >= memories.length) {
            endPlayback();
        } else {
            showPlaybackItem(playbackIndex);
            playbackInterval = setInterval(() => {
                playbackIndex++;
                if (playbackIndex >= memories.length) {
                    endPlayback();
                } else {
                    showPlaybackItem(playbackIndex);
                }
            }, 4000);
        }
    }

    function stopPlayback() {
        clearInterval(playbackInterval);
        playbackOverlay.classList.remove('active');
        playbackIndex = -1;
    }

    function endPlayback() {
        clearInterval(playbackInterval);
        playbackContent.innerHTML = `
            <div class="playback-end-screen">
                <div class="icon">🎬</div>
                <h2>感谢观看你的人生</h2>
                <p>每一段回忆都是人生的宝藏，<br>继续记录更多精彩时刻吧。</p>
            </div>
        `;
        playbackProgress.style.width = '100%';
        
        setTimeout(() => {
            playbackOverlay.classList.remove('active');
            setTimeout(() => {
                playbackContent.innerHTML = `
                    <img class="playback-image" id="playbackImg" src="" alt="">
                    <h2 class="playback-title" id="playbackTitle"></h2>
                    <div class="playback-date" id="playbackDate"></div>
                    <div class="playback-desc" id="playbackDesc"></div>
                `;
                playbackImg = document.getElementById("playbackImg");
                playbackTitle = document.getElementById("playbackTitle");
                playbackDate = document.getElementById("playbackDate");
                playbackDesc = document.getElementById("playbackDesc");
                playbackProgress.style.width = '0%';
            }, 500);
        }, 4000);
    }

    function renderStats() {
        if (memories.length === 0) {
            statsGrid.innerHTML = `
                <div class="stat-card" style="grid-column: 1 / -1;">
                    <div class="icon">📭</div>
                    <div class="number" style="font-size: 32px;">暂无数据</div>
                    <div class="label">添加回忆后查看统计</div>
                </div>
            `;
            document.getElementById('tagChart').innerHTML = '<div style="text-align: center; padding: 40px; color: #8898cc;">暂无标签数据</div>';
            document.getElementById('yearChart').innerHTML = '<div style="text-align: center; padding: 40px; color: #8898cc;">暂无年度数据</div>';
            return;
        }

        const years = memories.map(m => new Date(m.date).getFullYear());
        const minYear = Math.min(...years);
        const maxYear = Math.max(...years);
        
        const tagCounts = {};
        memories.forEach(m => {
            if (m.tags) {
                m.tags.split(',').forEach(t => {
                    const tag = t.trim();
                    if (tag) {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    }
                });
            }
        });
        const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
        const topTag = sortedTags.length > 0 ? sortedTags[0][0] : '-';
        
        const dates = memories.map(m => new Date(m.date));
        const latest = new Date(Math.max(...dates));
        const earliest = new Date(Math.min(...dates));
        
        statsGrid.innerHTML = `
            <div class="stat-card">
                <div class="icon">📷</div>
                <div class="number">${memories.length}</div>
                <div class="label">照片数量</div>
            </div>
            <div class="stat-card">
                <div class="icon">📅</div>
                <div class="number">${maxYear - minYear + 1}</div>
                <div class="label">年份跨度</div>
            </div>
            <div class="stat-card">
                <div class="icon">🏷️</div>
                <div class="number">${Object.keys(tagCounts).length}</div>
                <div class="label">标签数量</div>
            </div>
            <div class="stat-card">
                <div class="icon">⭐</div>
                <div class="number">${topTag}</div>
                <div class="label">最多出现标签</div>
            </div>
            <div class="stat-card">
                <div class="icon">📆</div>
                <div class="number">${latest.toLocaleDateString()}</div>
                <div class="label">最近一次回忆</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏳</div>
                <div class="number">${earliest.toLocaleDateString()}</div>
                <div class="label">最早一次回忆</div>
            </div>
        `;

        const maxTagCount = sortedTags.length > 0 ? sortedTags[0][1] : 1;
        document.getElementById('tagChart').innerHTML = sortedTags.map(t => `
            <div class="tag-bar-item">
                <span class="tag-bar-label">${t[0]}</span>
                <div class="tag-bar">
                    <div class="tag-bar-fill" style="width: ${(t[1] / maxTagCount) * 100}%"></div>
                </div>
                <span class="tag-bar-count">${t[1]}</span>
            </div>
        `).join('');

        const yearCounts = {};
        for (let y = minYear; y <= maxYear; y++) {
            yearCounts[y] = memories.filter(m => new Date(m.date).getFullYear() === y).length;
        }
        const maxYearCount = Math.max(...Object.values(yearCounts));
        
        document.getElementById('yearChart').innerHTML = Object.entries(yearCounts).map(([year, count]) => `
            <div class="year-bar">
                <div class="year-bar-count">${count}</div>
                <div class="year-bar-fill" style="height: ${maxYearCount > 0 ? (count / maxYearCount) * 100 : 0}%"></div>
                <div class="year-bar-label">${year}</div>
            </div>
        `).join('');
    }

    function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
</script>

</body>

</html>
