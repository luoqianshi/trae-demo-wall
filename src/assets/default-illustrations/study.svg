<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 翻开的书页 -->
    <path d="M210 140 L300 118 L300 228 L210 250 Z"/>
    <path d="M390 140 L300 118 L300 228 L390 250 Z"/>
    <!-- 书页内线 -->
    <line x1="225" y1="160" x2="285" y2="148" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <line x1="225" y1="175" x2="285" y2="163" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <line x1="225" y1="190" x2="285" y2="178" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <line x1="315" y1="148" x2="375" y2="160" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <line x1="315" y1="163" x2="375" y2="175" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <line x1="315" y1="178" x2="375" y2="190" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- 光线 -->
  <g stroke="#34d399" stroke-width="1.2" fill="none" opacity="0.4" stroke-linecap="round">
    <line x1="300" y1="100" x2="280" y2="60"/>
    <line x1="300" y1="100" x2="300" y2="50"/>
    <line x1="300" y1="100" x2="320" y2="60"/>
    <line x1="300" y1="100" x2="260" y2="70"/>
    <line x1="300" y1="100" x2="340" y2="70"/>
  </g>
  <!-- 光晕点 -->
  <circle cx="300" cy="100" r="3" fill="#34d399" opacity="0.6"/>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
</svg>
