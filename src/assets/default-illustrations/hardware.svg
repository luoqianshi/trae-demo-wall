<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <!-- 芯片主体 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="250" y="120" width="100" height="100" rx="8"/>
    <!-- 芯片内部 -->
    <rect x="270" y="140" width="60" height="60" rx="4" stroke="#34d399" opacity="0.3"/>
    <line x1="280" y1="150" x2="320" y2="150" stroke="#34d399" stroke-width="0.8" opacity="0.3"/>
    <line x1="280" y1="165" x2="320" y2="165" stroke="#34d399" stroke-width="0.8" opacity="0.3"/>
    <line x1="280" y1="180" x2="320" y2="180" stroke="#34d399" stroke-width="0.8" opacity="0.3"/>
    <!-- 中心点 -->
    <circle cx="300" cy="170" r="5" fill="#34d399" opacity="0.3"/>
  </g>
  <!-- 引脚 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
    <!-- 上方引脚 -->
    <line x1="270" y1="120" x2="270" y2="100"/>
    <line x1="290" y1="120" x2="290" y2="100"/>
    <line x1="310" y1="120" x2="310" y2="100"/>
    <line x1="330" y1="120" x2="330" y2="100"/>
    <!-- 下方引脚 -->
    <line x1="270" y1="220" x2="270" y2="240"/>
    <line x1="290" y1="220" x2="290" y2="240"/>
    <line x1="310" y1="220" x2="310" y2="240"/>
    <line x1="330" y1="220" x2="330" y2="240"/>
    <!-- 左侧引脚 -->
    <line x1="250" y1="140" x2="230" y2="140"/>
    <line x1="250" y1="160" x2="230" y2="160"/>
    <line x1="250" y1="180" x2="230" y2="180"/>
    <line x1="250" y1="200" x2="230" y2="200"/>
    <!-- 右侧引脚 -->
    <line x1="350" y1="140" x2="370" y2="140"/>
    <line x1="350" y1="160" x2="370" y2="160"/>
    <line x1="350" y1="180" x2="370" y2="180"/>
    <line x1="350" y1="200" x2="370" y2="200"/>
  </g>
  <!-- 电路走线 -->
  <g stroke="#34d399" stroke-width="1" fill="none" opacity="0.15" stroke-linecap="round">
    <path d="M230 140 L200 140 L200 80 L160 80"/>
    <path d="M370 140 L400 140 L400 80 L440 80"/>
    <path d="M230 200 L200 200 L200 260 L160 260"/>
    <path d="M370 200 L400 200 L400 260 L440 260"/>
    <path d="M270 100 L270 70 L350 70 L350 100" stroke-dasharray="3 3"/>
  </g>
  <!-- 走线端点 -->
  <g fill="#34d399" opacity="0.2">
    <circle cx="160" cy="80" r="2"/>
    <circle cx="440" cy="80" r="2"/>
    <circle cx="160" cy="260" r="2"/>
    <circle cx="440" cy="260" r="2"/>
  </g>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
</svg>
