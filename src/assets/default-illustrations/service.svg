<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <!-- 服务窗口 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="200" y="100" width="200" height="140" rx="12"/>
    <!-- 窗口顶栏 -->
    <line x1="200" y1="125" x2="400" y2="125"/>
    <circle cx="215" cy="112" r="3" stroke="#34d399" opacity="0.4"/>
    <circle cx="227" cy="112" r="3" stroke="#34d399" opacity="0.4"/>
    <circle cx="239" cy="112" r="3" stroke="#34d399" opacity="0.4"/>
    <!-- 内部节点 -->
    <circle cx="260" cy="165" r="8" stroke="#34d399" opacity="0.4"/>
    <circle cx="340" cy="165" r="8" stroke="#34d399" opacity="0.4"/>
    <circle cx="300" cy="205" r="8" stroke="#34d399" opacity="0.4"/>
    <!-- 节点连线 -->
    <line x1="268" y1="165" x2="332" y2="165" stroke="#34d399" opacity="0.3"/>
    <line x1="260" y1="173" x2="295" y2="200" stroke="#34d399" opacity="0.3"/>
    <line x1="340" y1="173" x2="305" y2="200" stroke="#34d399" opacity="0.3"/>
    <!-- 节点中心点 -->
    <circle cx="260" cy="165" r="3" fill="#34d399" opacity="0.3"/>
    <circle cx="340" cy="165" r="3" fill="#34d399" opacity="0.3"/>
    <circle cx="300" cy="205" r="3" fill="#34d399" opacity="0.3"/>
  </g>
  <!-- 外部连接线 -->
  <g stroke="#34d399" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round" stroke-dasharray="3 4">
    <line x1="150" y1="170" x2="200" y2="170"/>
    <line x1="400" y1="170" x2="450" y2="170"/>
  </g>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
</svg>
