<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <!-- 心形轮廓 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 230 C270 200 220 175 220 145 C220 125 235 110 255 110 C275 110 290 125 300 140 C310 125 325 110 345 110 C365 110 380 125 380 145 C380 175 330 200 300 230 Z"/>
  </g>
  <!-- 同心圆光环 -->
  <g stroke="#34d399" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round">
    <circle cx="300" cy="165" r="55"/>
    <circle cx="300" cy="165" r="80" opacity="0.5"/>
    <circle cx="300" cy="165" r="105" opacity="0.3"/>
    <circle cx="300" cy="165" r="130" opacity="0.15"/>
  </g>
  <!-- 心形中心光点 -->
  <circle cx="300" cy="165" r="4" fill="#34d399" opacity="0.5"/>
  <!-- 装饰小点 -->
  <g fill="#34d399" opacity="0.2">
    <circle cx="200" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/>
    <circle cx="180" cy="220" r="2"/>
    <circle cx="420" cy="220" r="2"/>
    <circle cx="150" cy="160" r="1.5"/>
    <circle cx="450" cy="160" r="1.5"/>
  </g>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
