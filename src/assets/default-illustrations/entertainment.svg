<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <!-- 抽象手柄轮廓 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 150 Q200 120 230 120 L370 120 Q400 120 400 150 L400 190 Q400 220 370 220 L340 220 Q320 220 310 205 L290 205 Q280 220 260 220 L230 220 Q200 220 200 190 Z"/>
    <!-- 左摇杆圆 -->
    <circle cx="245" cy="170" r="10" stroke="#34d399" opacity="0.4"/>
    <circle cx="245" cy="170" r="4" fill="#34d399" opacity="0.3"/>
    <!-- 右侧按钮 -->
    <circle cx="345" cy="160" r="5" stroke="#34d399" opacity="0.4"/>
    <circle cx="365" cy="175" r="5" stroke="#34d399" opacity="0.4"/>
    <circle cx="325" cy="175" r="5" stroke="#34d399" opacity="0.4"/>
    <circle cx="345" cy="190" r="5" stroke="#34d399" opacity="0.4"/>
  </g>
  <!-- 散落像素方块 -->
  <g fill="#34d399" opacity="0.15">
    <rect x="120" y="80" width="6" height="6" rx="1"/>
    <rect x="480" y="90" width="6" height="6" rx="1"/>
    <rect x="100" y="250" width="8" height="8" rx="1"/>
    <rect x="500" y="260" width="6" height="6" rx="1"/>
    <rect x="150" y="280" width="5" height="5" rx="1"/>
    <rect x="460" y="50" width="5" height="5" rx="1"/>
    <rect x="80" y="180" width="4" height="4" rx="1"/>
    <rect x="520" y="180" width="4" height="4" rx="1"/>
  </g>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
</svg>
