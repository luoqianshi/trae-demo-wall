<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#1e2d27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#glow)"/>
  <!-- 宝石切面多边形 -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 外层大宝石 -->
    <path d="M300 80 L380 140 L420 220 L360 270 L240 270 L180 220 L220 140 Z"/>
    <!-- 内部折射线 -->
    <line x1="300" y1="80" x2="360" y2="270" stroke="#34d399" opacity="0.3"/>
    <line x1="300" y1="80" x2="240" y2="270" stroke="#34d399" opacity="0.3"/>
    <line x1="380" y1="140" x2="240" y2="270" stroke="#34d399" opacity="0.3"/>
    <line x1="220" y1="140" x2="360" y2="270" stroke="#34d399" opacity="0.3"/>
    <line x1="380" y1="140" x2="220" y2="140" stroke="#34d399" opacity="0.3"/>
    <line x1="420" y1="220" x2="180" y2="220" stroke="#34d399" opacity="0.3"/>
    <!-- 中心点 -->
    <circle cx="300" cy="175" r="6" fill="#34d399" opacity="0.4"/>
    <circle cx="300" cy="175" r="12" stroke="#34d399" opacity="0.2"/>
  </g>
  <!-- 内层小宝石 -->
  <g stroke="#34d399" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 130 L340 160 L355 200 L325 230 L275 230 L245 200 L260 160 Z"/>
  </g>
  <!-- 外围装饰点 -->
  <g fill="#34d399" opacity="0.15">
    <circle cx="300" cy="50" r="2"/>
    <circle cx="440" cy="120" r="2"/>
    <circle cx="470" cy="220" r="2"/>
    <circle cx="400" cy="290" r="2"/>
    <circle cx="200" cy="290" r="2"/>
    <circle cx="130" cy="220" r="2"/>
    <circle cx="160" cy="120" r="2"/>
  </g>
  <!-- TRAE 品牌标记 -->
  <text x="560" y="320" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" opacity="0.2" text-anchor="end">TRAE</text>
</svg>
